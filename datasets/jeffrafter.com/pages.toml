["https://jeffrafter.com/gatsby-with-typescript"]
title = "Building a Static Gatsby-based Website with TypeScript | Jeff Rafter"
description = "Creating a static website involves an almost infinite set of choices. I've upgraded several sites to Gatsby (including this one) finding a way to integrate TypeScript as part of the journey. Gatsby leverages React, JSX, CSS-in-JS, GraphQL and many other modern approaches to building sites."
full_description = '''Building a Static Gatsby-based Website with TypeScriptMay 25, 2019 Image credit: The Great Gatsby Throughout the Years Updated: February 2020Creating a static website involves an almost infinite set of choices. Among these is Gatsby – a static site framework based on React, JSX, CSS-in-JS and many other modern approaches. Gatsby is, in many ways, the JavaScript successor to Jekyll. I’ve upgraded several sites to Gatsby (including this one) finding a way to integrate TypeScript as part of the journey.In this post I am going to work through all of the pieces of a default Gatsby site and try to explain them along the way. Included in this post are some of the reasons why I’ve chosen one particular plugin or skipped another. Often – especially when you choose a default Gatsby starter – it is difficult to understand how all of the pieces fit together, or how you might build your own starter template. Hopefully this post provides some helpful examples.Also: the Gatsby documentation is extremely good. There is a fantastic tutorial, quick start and some recipes. I’ve relied on those and a host of other blogs when working on this post.In order to follow this, you’ll need access to a terminal (or console) and you’ll need Node, Node Version Manager, and git installed. All of the code (and commits) are available on GitHub: https://github.com/example-gatsby-typescript-blog/example-gatsby-typescript-blog.github.io Getting startedTo get started, we’ll follow the quick start. First, install the Gatsby CLI (command line interface):npm install -g gatsby-cliNext, we’ll want to create a new Gatsby site. In this post we’ll assume that our site is called (rather uninspiringly) example. Run the following command (it will generate a new folder called example where you run the command):gatsby new exampleChange directory to newly created folder example:cd exampleThe new command created a project folder and automatically installed our node modules and setup defaults. The project structure should look like:example/ | |- .git/ |- .gitignore |- .prettierignore |- .prettierrc |- LICENSE |- README.md |- gatsby-browser.js |- gatsby-config.js |- gatsby-node.js |- gatsby-ssr.js |- node_modules/ |- package-lock.json |- package.json |- src/ | |- components/ | | |- header.js | | |- image.js | | |- layout.css | | |- layout.js | | |- seo.js | |- images/ | | |- gatsby-astronaut.png | | |- gatsby-icon.png | |- pages/ | | |- 404.js | | |- index.js | | |- page-2.jsWith this, we already have enough to run Gatsby and view our site. Run:npm startThis will start Gatsby in develop mode. Open a browser to http://localhost:8000 and you should see: The default covers the basics but isn’t very personalized. Let’s work on that now. Configuring the node versionGatsby requires Node to run on your computer. If you have multiple local projects on your computer, you might run into a conflict about which Node version should be used. Node Version Manager solves this problem. After installing a Node Version Manager, check which version of Node you have installed:nvm lsIf you don’t have the version you want, find a remote version:nvm ls-remoteThis will show lots of versions. Find the last one with LTS (for Long Term Support). Generally LTS versions are very stable. Install it using:nvm install 12.16.1To control which version of Node should be used in our project, we’ll add a .nvmrcNotice that the .nvmrc file starts with a "." (period). By default on most systems this creates a hidden file. Oftentimes general project config is hidden away. On MacOS you can show hidden files in Finder by running defaults write com.apple.finder AppleShowAllFiles -bool true and restarting Finder. If you want to list hidden files in your console use the -a parameter: ls -a. file (within the project directory):12.16.1The file is pretty simple; just the version. At the time you read this there may be a newer version of Node. You can also find the latest version at https://nodejs.org.Once you’ve created the .nvmrc file, run:nvm useYou should see:Found '.nvmrc' with version <12.16.1> Now using node v12.16.1 (npm v6.13.4) Ignore some thingsWe plan to use git to keep track of our changes. The default Gatsby starter has already initialized our project to use git. As we work on our project locally, there will be a lot of files we create but we won’t want to keep track of (because they are specific to our machine or for security reasons); we’ll want to ignore them. To do this we’ll need a .gitignore file.gitignore also starts with a "." and you can start to see a pattern emerge.. These files can be very short and specific, or they can be very long and general. Luckily, Gatsby has created this for us already. If you are looking for more examples of what might go in a .gitignore file, you can check out https://github.com/github/gitignore.Take a look at the provided file. Notice that we are ignoring environment (.env*) files. We’ll use these later to setup values specific to our development or production environments. For more information on environments see Environment Variables. Keeping things cleanPeople have different preferences when they edit code. Some prefer tabs over spaces. Some want two spaces instead of four. Some prefer semicolons and some don’t. It shouldn’t matter right? Actually it does. If editors are auto-formatting code based on user preferences, it is important to make sure everyone has chosen the same set of defaults. This makes it easy to tell what changed between versions – even when different developers (with different preferences) have made changes.Prettier & .prettierrcGatsby automatically includes support for Prettier. Prettier works to auto-format your code based on a shared configuration. The default configuration is setup in the .prettierrc file:{ "endOfLine": "lf", "semi": false, "singleQuote": false, "tabWidth": 2, "trailingComma": "es5" }This is a fairly safe set of defaults. I tend to use the following .prettierrc configuration:{ "endOfLine": "lf", "semi": false, "singleQuote": true, "tabWidth": 2, "trailingComma": "all", "bracketSpacing": false, "jsxBracketSameLine": true, "printWidth": 120 }You might have different preferences in your project. That’s fine, so long as all of the developers working on the code agree. For more information on the available options, view the Prettier docs.There are some files in our project that we shouldn’t (or don’t want to) prettify. The reasons we might not want to run Prettier vary but include: different formatting preferences, external libraries, generated files, frequency of change, or speed. Luckily we can tell Prettier to ignore files. The default .prettierignore file should be good:.cache package.json package-lock.json publicConfigure your editor This section is completely optional. This is here mostly so I can copy and paste the configuration for myself. 🎡 If there are several people working on your project, the chances are high that they use different editors for their code. At the very least their settings might not be consistent. In some cases, the editors might not have support for Prettier. You can provide hints to their editors. This can be done by including a generic .editorconfig file (based on the format from https://editorconfig.org). Create .editorconfig in your project and add the following:root = true [*] indent_style = space indent_size = 2 charset = utf-8 trim_trailing_whitespace = true insert_final_newline = trueDepending on the editor this may or may not be used. For example, you might be using Visual Studio Code. In that case you can add some additional configuration. To do that, you can create a .vscode folder with the settings for your project.Create the folder:mkdir .vscodeAnd in that folder make settings.json{ "editor.tabSize": 2, "editor.insertSpaces": true, "editor.renderWhitespace": "boundary", "editor.rulers": [120], "editor.formatOnSave": true, "files.encoding": "utf8", "files.trimTrailingWhitespace": true, "files.insertFinalNewline": true, "typescript.tsdk": "node_modules/typescript/lib", "search.exclude": { "public/**": true, "node_modules/**": true } }eslint Note: a previous version of this post used tslint to add TypeScript support. It is now recommended to use eslint which includes the functionality of tslint. Using Prettier and configuring our editor helps keep our code clean. Even with these tools we will still want to check our code for problems. Linters do exactly that. They can be configured to check our files for syntax errors, missing types, formatting problems and more. “Linting” is very similar to using prettier and in fact eslint and prettier can work together.To configure eslint, create a new file called .eslintrc.json:{ "parser": "@typescript-eslint/parser", "plugins": ["@typescript-eslint", "prettier", "react", "react-hooks"], "extends": [ "eslint:recommended", "plugin:@typescript-eslint/recommended", "plugin:prettier/recommended", "plugin:react/recommended" ], "rules": { "prettier/prettier": [ "error", { "singleQuote": true, "trailingComma": "all", "bracketSpacing": false, "printWidth": 120, "tabWidth": 2, "semi": false } ], "react/prop-types": [ "error", { "skipUndeclared": true } ], "react-hooks/rules-of-hooks": "error", "react-hooks/exhaustive-deps": "warn" }, "settings": { "react": { "version": "detect" } }, "env": { "browser": true, "node": true, "jest": true, "es6": true }, "parserOptions": { "ecmaVersion": 2018, "sourceType": "module" } }Notice that we’ve disabled the prop-types validation. In React, prop-types can be used to validate the properties submitted to your components. Unlike TypeScript, which is used during development, prop-type validation is used at runtime. There are some cases where this distinction can be extremely helpful, but I generally find TypeScript’s type checking sufficient for my Gatsby sites. If you would like to generate runtime prop-types when building your Gatsby site, check out gatsby-plugin-babel-plugin-typescript-to-proptypes (though you will still need to disable the eslint rule for development).To ignore specific folders and files, create a new file called .eslintignore:*.js .cacheHere, we’re ignoring all JavaScript files (so that we can focus only on TypeScript).We’ll need to install some additional support (we can run this now, but we’ll look more at the packages we’re using a little later):npm install --save-dev \ eslint \ @typescript-eslint/eslint-plugin \ @typescript-eslint/parser \ eslint-config-prettier \ eslint-plugin-prettier \ prettier Save your progress using version controlAt this point we really haven’t added anything to the default (except a lot of configuration). Even though our website isn’t even a website yet – it still makes sense to save our work. If we make a mistake having our code saved will help us. To do this we’ll use git - a version control software that lets us create commits or versions as we go.By default Gatsby creates a git repository and the default files have been added to it. Generally, I use GitHub DesktopIt might surprise you but some of the top coders at GitHub including cheshire137 use GitHub Desktop and micro-commit; that is, they make lots of very small commits for every change they make. This makes it easier to look back at their change history and see each step along the way to solving a problem or implementing a feature.; however, I’ll use the command line here.You can check the status of your changes and repository:git statusYou should see:On branch master Changes not staged for commit: (use "git add <file>..." to update what will be committed) (use "git checkout -- <file>..." to discard changes in working directory) modified: .prettierrc Untracked files: (use "git add <file>..." to include in what will be committed) .editorconfig .eslintignore .eslintrc.json .nvmrc .vscode/ no changes added to commit (use "git add" and/or "git commit -a")Let’s get ready to create a commit by adding all of the files:git add .Here the . means: “everything in the current folder”. But what are we adding it to? We are adding it to the commit stage. Let’s check the status again:git statusYou should see:On branch master Changes to be committed: (use "git reset HEAD <file>..." to unstage) new file: .editorconfig new file: .eslintignore new file: .eslintrc.json new file: .nvmrc modified: .prettierrc new file: .vscode/settings.jsonWe’re getting ready to add the new files (and modify one file) to our repository. Let’s commit:git commit -m "Add more configuration"This creates a commit with the message we specified. The commit acts like a save point. If we add or delete files or change something and make a mistake, we can always revert back to this point. We’ll continue to commit as we make changes. Packages & DependenciesFor almost any Node project you’ll find that you use a lot of packages – you’ll have far more code in your node_modules folder (where package code is stored) than your main project (for example in your src folder).In fact the size of the node_modules folder has become a meme: By default, Gatsby has created a package.json. Within the package.json, you’ll find metadata about your project as well as a list of dependencies used by Node (and Gatsby). The metadata in package.json isn’t used by Gatsby but the list of dependencies are used.The default package.json look like this:{ "name": "gatsby-starter-default", "private": true, "description": "A simple starter to get up and developing quickly with Gatsby", "version": "0.1.0", "author": "Kyle Mathews <mathews.kyle@gmail.com>", "dependencies": { "gatsby": "^2.19.7", "gatsby-image": "^2.2.39", "gatsby-plugin-manifest": "^2.2.39", "gatsby-plugin-offline": "^3.0.32", "gatsby-plugin-react-helmet": "^3.1.21", "gatsby-plugin-sharp": "^2.4.3", "gatsby-source-filesystem": "^2.1.46", "gatsby-transformer-sharp": "^2.3.13", "prop-types": "^15.7.2", "react": "^16.12.0", "react-dom": "^16.12.0", "react-helmet": "^5.2.1" }, "devDependencies": { "prettier": "^1.19.1" }, "keywords": ["gatsby"], "license": "MIT", "scripts": { "build": "gatsby build", "develop": "gatsby develop", "format": "prettier --write \"**/*.{js,jsx,json,md}\"", "start": "npm run develop", "serve": "gatsby serve", "clean": "gatsby clean", "test": "echo \"Write tests! -> https://gatsby.dev/unit-testing\" && exit 1" }, "repository": { "type": "git", "url": "https://github.com/gatsbyjs/gatsby-starter-default" }, "bugs": { "url": "https://github.com/gatsbyjs/gatsby/issues" } }Let’s customize this a bit. Change the name and description fields to something relevant. Set the author field to your name and emailKyle Matthews is the creator and founder of Gatsby. Don't worry about removing him as the author. His name is there because he built the Gatsby Starter Default. For your blog, you're the author. and double-check the license, changing it as needed. If you need help picking an open source license, you can find one that fits your project (MIT is a good default).The default dependencies in package.json are a good foundati'''
