title = "Exploring - Using Express and Amazon Web Services | Jeff Rafter"
description = "Using Express to build out your API can be challenging; but integrating it with all of the products available from Amazon Web Services can feel impossible."
full_description = '''Exploring - Using Express and Amazon Web ServicesOctober 09, 2020 🗺 Exploring - Work in progressUsing Express to build out your API can be challenging; but integrating it with all of the products available from Amazon Web Services can feel impossible. This post focuses less on best practices for your API and more on reusable patterns to tie all of those products together. This is the second part in a series on building out a scalable website on AWS. In the first part we setup all of the infrastructure we’ll need using Terraform. Choosing a frameworkBefore we even get started we need to decide what framework we’ll use to write our AWS Lambda function - if any. Out of the box AWS gives you a handler pattern that you can use to receive an incoming web request, perform some actions and return a response. For a web server this is really all we need. In fact, using this simple pattern is actually the recommended best practice.AWS Lambda is a FaaS (Function as a Service) or “serverless” platform designed to execute discrete “functions” or handlers. The expectation is that each route on our website will execute a separate specific function inside Lambda. Each of these routes would be setup individually inside AWS API Gateway and point to their respective AWS Lambda functions. We’ve setup our API Gateway to send all routes to a single function (site_api).Why would we do this? What are the tradeoffs?All routes pointing to a single function When developing your API you want to be able to test it locally When deploying you want shared dependencies to be updated simultaneously Adding a new route to API Gateway and pointing to a new Lambda function is cumbersome Changing API Gateway can be slow Our function will have fewer cold-starts Many routes pointing to separate functions You might want to restrict deployments for specific parts of the site You can change parts of the site without changing everything A single mistake won’t break the entire site Deploying new functions will only cause cold-starts on part of the site You want to use Lambda@Edge Smaller functions take less time to upload and deploy Smaller functions have a shorter cold-start time In general, how you choose between these trade-offs is dictated by the site and team (and in some cases preferences). If you have a smaller site and smaller team then it is often better to favor simplicity. Choosing All routes pointing to a single function simplifies local development and deployment but increases risk by putting everything in one function. For example, if you are the only developer (or there are only a couple developers), then layering strict permissions about who can deploy specific parts of the site is overkill.What’s a cold-start? Even though AWS Lambda runs functions “on-demand” it still needs to load the code in order to execute it. If your code-base is large it will take a long time to load before your function can respond to requests. Because this can be slow, AWS tries to avoid doing it too often and keeps the code in a hot-cache for five minutes after it is loaded. If the function is used again, the timeout is restarted. You should try to avoid cold-starts as much as possible and you should try to minimize their impact as much as possible to keep your site snappy. Keeping all of your routes in a separate functions means that the code that needs to be loaded is smaller (and therefore faster to load). But pointing all of your routes to a single shared function means that the function will be used more frequently and will likely have fewer cold-starts.As with most things, it depends.For our API we’ll use a single function. This is almost always the simplest and easiest choice especially when getting started. As our site grows we can slowly transition from this model to a hybrid model with multiple functions and ultimately to individual functions for every route if needed.Why Express?Because we’re using a single function we’ll need to enable that function to handle routing for us (like a traditional web server). There are numerous frameworks that make it easy. Express is a “Fast, unopinionated, minimalist web framework for Node.js”. That sounds like what we want. We could choose a smaller framework like Micro from Vercel (used as part of Next.js) - but it is not typically used in serverless environments. We could also choose Sails.js, a much richer MVC framework written in JavaScript. In many cases this is the right choice, but for our purposes we’ll use Express as it is closer to the metal which makes it easier to follow the logic.Because we are building an API there are a few other options available to us.Getting startedIn the previous post we created a very simple API function:exports.handler = async (event, context) => { console.log('Event: ' + JSON.stringify(event)) console.log('Context: ' + JSON.stringify(context)) return { statusCode: 200, body: JSON.stringify({ event: event, context: context, }), } }In the handler we logged information about the event and context and echoed back the result as JSON. You would never want a function like this in a production application, but this allowed us to quickly setup our API Gateway deployment, test AWS Lambda and make sure our logging worked.To make our API we’ll need more code than this. Let’s create a new folder called api. I usually make this a sibling folder to the terraform folder we created previously.mkdir apiChange to that folder:cd apiWe’ll use npm to install and manage the packages for our API. Let’s set that up now:npm init -yThis will generate a default package.json:{ "name": "api", "version": "1.0.0", "description": "", "main": "index.js", "scripts": { "test": "echo \"Error: no test specified\" && exit 1" }, "keywords": [], "author": "", "license": "ISC" }Next, we’ll install express:npm install --save expressWe’ll need a few more packages right away:npm install --save cors helmet body-parser cookie-parser http-errorsWe’ll also need some AWS and serverless specific packages:npm install --save aws-sdk @vendia/serverless-expressTypeScriptI usually choose to use TypeScript for my projects. Though it isn’t required it makes some things easier (and some things much harder). It can be a tough trade-off.npm install --save-dev typescriptWe only need TypeScript support while developing. We’ll convert the application to JavaScript when deploying. Install the following TypeScript dependencies:npm install --save-dev ts-node-dev ts-loaderWe’ll need to setup our TypeScript configuration; create a new file called tsconfig.json:{ "compilerOptions": { "module": "commonjs", "target": "esnext", "lib": ["es2015", "es2017"], "strict": true, "esModuleInterop": true, "skipLibCheck": true, "noUnusedLocals": true, "noUnusedParameters": true, "noImplicitAny": true, "removeComments": false, "preserveConstEnums": true }, "include": ["**/*.ts"], "exclude": ["node_modules"] }Next we’ll want to download type definitions for our dependencies:npm install --save-dev \ @types/node \ @types/cors \ @types/cookie-parser \ @types/http-errors \We’ll want to add a few scripts to package.json to utilize these dependencies. The only script we need at the moment is build which will convert our TypeScript to JavaScript. We can remove the placeholder test script for now. While we’re developing our action we’ll need access to all of our project’s dependencies; but when we release our action we don’t want to include the testing, linting and TypeScript dependencies. Because of this, the difference between dependencies and devDependencies is important (as well as --save versus --save-dev).Add the following scripts to package.json{ "scripts": { "build": "tsc --noEmit", }, } Keep it clean (optional) Note: this section is not required to complete this tutorial; if you want to skip it feel free. Everyone has different preferences when they edit code. Some prefer tabs over spaces. Some want two spaces instead of four. Some prefer semicolons and some don’t. It shouldn’t matter right? But it does. If editors are auto-formatting code based on user preferences it is important to make sure everyone has chosen the same set of defaults for that auto-formatting. This makes it easy to tell what changed between versions – even when different developers (with different preferences) have made changes.For this reason we’ll setup a linter and code formatter for our code. Install eslint and prettier:npm install --save-dev \ eslint \ @typescript-eslint/eslint-plugin \ @typescript-eslint/parser \ eslint-config-prettier \ eslint-plugin-prettier \ prettierNow that we have the packages we’ll need to configure them in .eslintrc.json. Create that file in your project root folder:{ "parser": "@typescript-eslint/parser", "plugins": ["@typescript-eslint", "prettier"], "extends": [ "eslint:recommended", "plugin:@typescript-eslint/recommended", "plugin:prettier/recommended" ], "rules": { "prettier/prettier": [ "error", { "singleQuote": true, "trailingComma": "all", "bracketSpacing": true, "printWidth": 120, "tabWidth": 2, "semi": false } ] }, "env": { "node": true, "es6": true }, "parserOptions": { "ecmaVersion": 2018, "sourceType": "module" } }I won’t go into too much detail here; there are better explanations to be found. This configuration does a few things: Relies on the TypeScript ESlint parser with the prettier plugin - I’ve found this works very well in VS Code. The expected environment should include node - this will help eslint ignore missing declarations for things like process, module, etc. If you need to ignore specific files when linting you can add them to .eslintignore. Because our setup doesn’t work well for JavaScript we’ll ignore all JavaScript files. Create .eslintignore in the project root folder:*.jsIf you are using VS Code, you can install the ESLint extension so you can see lint warnings in your editor. Additionally, we can add a lint item to the scripts node in package.json so that we can check for lint warnings when building and deploying: "scripts": { "build": "tsc --noEmit", "lint": "eslint . --ext .ts" },With this in place we can run:npm run lintWait, there’s an error:Oops! Something went wrong! :( ESLint: 7.24.0 No files matching the pattern "." were found. Please check for typing mistakes in the pattern.We haven’t written any TypeScript to lint yet.Prettier & .prettierrcPrettier works to auto-format your code based on a shared configuration. If you are using VSCode you can install the prettier extension and it will auto-format your code every time you save. The configuration is setup in the .prettierrc file. Create .prettierrc. I tend to use the following setup:{ "endOfLine": "lf", "semi": false, "singleQuote": true, "tabWidth": 2, "trailingComma": "all", "bracketSpacing": false, "jsxBracketSameLine": true, "printWidth": 120 }You might have different preferences in your project. That’s fine, so long as all of the developers working on the code agree. For more information on the available options, view the Prettier docs.There are some files in our project that we shouldn’t (or don’t want to) prettify. The reasons we might not want to run Prettier vary but include: different formatting preferences, external libraries, generated files, frequency of change, or speed. Luckily we can tell Prettier to ignore files. Add a .prettierignore file:package.json package-lock.json node_modulesTime to stop configuring and start writing code. Building the Express APIExpress applications can be very simple - all of the logic can be contained in a single file. As your project becomes more complex this can become very confusing. Because of this, we’ll use files and folders that help us keep the project organized:api/ |- .env |- src/ | |- app.ts | |- env.ts | |- lambda.ts | |- local.ts | |- middleware/ | | |- error.ts | | |- not-found.ts | |- routes/ | | |- index.ts | | |- ok.tsMain ApplicationEven though it is not required, it is common to put the main application logic in a file called app.ts (or app.js if you are not using TypeScript). That’s the name the Express application generator chooses (which we are not using). In our case we’ll want to store all of the code for our application in a src folder to keep things organized. Create src/app.ts and copy the following:import express from 'express' import cookieParser from 'cookie-parser' import cors from 'cors' import helmet from 'helmet' import router from './routes' import { errorMiddleware } from './middleware/error' import { notFoundMiddleware } from './middleware/not-found' // Create the Express app const app = express() // Setup middleware for our API app.use(express.json()) app.use(express.urlencoded({ extended: true })) app.use(cookieParser()) app.use(helmet()) app.use(cors({ credentials: true })) // The aws-serverless-express library creates a server and listens on a Unix // Domain Socket for you, so you don't need the usual call to app.listen. app.use('/', router) // If the user tries to access any path which doesn't exist, and there was no error, return a 404 app.use(notFoundMiddleware) // Error handling middleware should be loaded after the loading the routes app.use(errorMiddleware) // Export your express server so it can be reused depending on how the server is run. export default appAfter creating the default express application we begin using specific middleware. Express applications receive a request (containing params and other information) and return a response (in our case, containing JSON). The middleware pattern allows us to treat this request-response cycle as a pipeline using specific functions:const customMiddleware = (request: Request, response: Response, next: NextFunction) { console.log('Time:', Date.now()) next() })The customMiddleware function receives the request and response objects and can modify them before allowing the middleware pipeline to move to the next middleware function.When setting up our application we’ve specified that our application should use a common set of middleware: express.json(): allows our application to handle JSON requests express.urlencoded({ extended: true }): allows our application to handle URL encoded parameters cookieParser(): parses any cookie headers sent to our application helmet(): introduces a set of security-related middleware including default content security policies cors({ credentials: true }): allows our API to be called from other domains by returning correct Cross-Origin Resource Sharing responses The routes - or paths - that your API handles can also be treated as middleware. We’ll store those in a separate folder so that we can keep the logic separate. For now, we’ve included them in our application in the correct order. We want to process all of our routes after our security middleware and serverless middleware and before any of our error handling middleware.Our error handling middleware comes last so that we can catch any errors that happen within our routes (or security middleware). We haven’t written our notFoundMiddleware or errorMiddleware'''
