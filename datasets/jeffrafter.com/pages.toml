["https://jeffrafter.com/oculus-quest"]
title = "Developing for the Oculus Quest | Jeff Rafter"
description = "Everyone wants to talk about consumer VR. I just want to make some games."
full_description = '''Developing for the Oculus QuestJuly 25, 2019 Image credit: Oculus Quest on Amazon The Oculus Quest is entirely immersive and a blast to play with. Of course, the moment I put it on, I immediately wanted to make my own games and got started with UnityThere are lots of articles on Unity versus Unreal versus building your own engine entirely from scratch using Oculus Native support. For me, my goal was to get something running as quickly as possible. Harder decisions later.. There are a few blog posts and videos that helped me on my way. Getting startedTo develop for you Oculus you’ll not only need an Oculus account but you may want to setup an Oculus Organiztion (free). Additionally (for my purposes), you’ll need a Unity account. I’m using a personal account (also free).Mac versus WindowsI’m using a MacBook Pro. Many of the tutorials and videos you’ll find assume you’re working on Windows. This can create some challenges but the biggest challenges are around the platform support for the Oculus Quest itself. Oculus doesn’t make a version of it’s Oculus Desktop app (or libraries) available on MacOS. Because of this you’ll want to start with tutorials that are specific to the Mac and adjust.Unity & initial setupI followed a couple of tutorials for getting Unity Hub and Unity installed. I recommend: How to get started with Oculus Quest and Unity on macOS How to get started with Oculus Quest development in Unity If you prefer videos: LearnOnce I had the basics working, and could load games I built in Unity on my Quest, I wanted to do more. I found a set of fantastic tutorial videos by Valem, Quentin Valembois and was hooked. As I went through the videos I took notes and (with permission) am posting those here.While watching these videos, you might notice Valem is using the ▶ button to debug. This works because he is actually developing for the Rift in the videos (notice that the controllers are upside-down). In a later video on recreating Slenderman (at 1:47) he explains how to use the ▶ button while building for the Oculus Quest. Unfortunately that won’t work on MacOS because the Oculus plugin is not supported. There are notes on how to get this working at the end of this post. A note on the Oculus Integration assetThe Oculus Integration in the Unity Asset Store solves an amazing amount of problems for you. Unfortunately, the updates are not necessarily backward compatible and it makes following tutorials difficult. Most of the tutorials listed here were for the 1.38 version. The current 1.39 version requires a few more steps.After you download and import the kit you’ll restart Unity. You should see a new menu for Oculus: Choose Tools | Remove AndroidManifest.xml. Choose Tools | Create store-compatible AndroidManifest.xml From your project search, find the newly created AndroidManifest.xml and open it in your editor. You’ll want to change android.intent.category.INFO to android.intent.category.LAUNCHER so that when you choose Build and Run it will actually run the generated APK on your Oculus Quest.Also, you need to indicate you are using headtracking with a uses-feature element.Here is the full file:<?xml version="1.0" encoding="utf-8" standalone="no"?> <manifest xmlns:android="http://schemas.android.com/apk/res/android" android:installLocation="auto"> <!-- Request the headset DoF mode --> <application android:allowBackup="false"> <activity android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" android:configChanges="locale|fontScale|keyboard|keyboardHidden|mcc|mnc|navigation|orientation|screenLayout|screenSize|smallestScreenSize|touchscreen|uiMode" android:launchMode="singleTask" android:name="com.unity3d.player.UnityPlayerActivity" android:excludeFromRecents="true"> <intent-filter> <action android:name="android.intent.action.MAIN"/> <category android:name="android.intent.category.LAUNCHER"/> </intent-filter> </activity> <meta-data android:name="unityplayer.SkipPermissionsDialog" android:value="false" /> </application> <uses-feature android:name="android.hardware.vr.headtracking" android:version="1" android:required="true" /> </manifest>If you’re using a LocalAvatar you’ll notice you don’t have hands. You’ll need to add an application id in Oculus | Avatars | Edit Settings. You can get an Application Id by creating an application for your organization on the Oculus Developer website at https://dashboard.oculus.com | Manage. There’s a good shortcut for testing though: just enter - for the Oculus Go/Quest or Gear VR field. How to make a VR game in Unity - Part 1 - Setup, Hand presence, Grabbing object Setup the project Set Unknown Sources in the Oculus app (Windows only) In Unity Hub create a new 3D app Click Build Settings in the File menu Choose Android, click Switch Platform Change the Texture Compression to ASTC (not requiredDXT, PVRTC, ATC, and ASTC are all support textures with an alpha channel. These formats also support higher compression rates and/or better image quality, but they are only supported on a subset of Android devices. https://docs.unity3d.com/Manual/android-GettingStarted.html. ASTC is considered the best choice for Oculus Quest., very slow) Open Player Settings: Set the Company and Product Name Remove Vulkan from the Graphics APIs list (Other Settings) Set the Package Name (Other Settings)If you leave this at the default of com.oculus.*, nothing will happen when it attempts to deploy the player. Unity will appear to complete but your Quest will do nothing (not even install the application to Unknown Sources). Change the package name to com.DefaultCompany.OculusQuestTest1 or a name matching what you have named your Company and Product Name. Set the Minimum API Level to Android 4.4 ‘KitKat’ (Other Settings) Check VR Integration (XR Settings) Add the Oculus Virtual Reality SDK (XR Settings) Download Oculus Integration from the Asset Store (slow) Import All from the Oculus Integration (very slow) Make the scene Create a 3D plane Create a 3D cube Create a red material and apply it to cube Create a black material and apply it to plane Delete the main camera Add OVRPlayerController to the scene and move it back away from the cube Set Tracking Origin Type to Floor on the OVRCameraRig child (note: if you are using the ▶ button, this should be Stage) Add the Character Camera Constraint component to the OVRPlayerController Drag the OVRCameraRig to the Character Camera Constraint Camera Rig field Check the Dynamic Height box Note: As of 1.39 you also need to set the Target Devices of the OVR Manager (Script) to Quest Simple grabbing Add LocalAvatar prefab to the TrackingSpace of the OVRPlayerController Add AvatarGrabberLeft and AvatarGrabberRight prefab to the LocalAvatar Make the red cube wider (more like a table) Add an empty object called Cubes and add some cubes (6 of them) Select all of the cubes and add the OVRGrabbable script Add the RigidBody component Build and run In Build Settings click Add Open Scenes Plug in your Oculus (you may need to “Trust this computer”) On Windows you should be able to click play On Mac click Build and Run (slow first build) From the comments: Colliding with the cubes and flying into the air? “Some of you have experienced a bug where the player fly when you put your hands under you. A really simple fix is to set the body and the hand to a different layer then in Physics settings uncheck the collision between the two layer in the collision layer matrix! :) Hope this will help some of you!” https://www.youtube.com/watch?v=sKQOlqNe_WY&lc=Ugy0IV2wmiRMywTkPk94AaABAg Note: setting up layer interactions happens more in the next section. How to make a VR game in Unity - Part 2 - Custom Hand, Distance grab Setting up custom hands Remove the LocalAvatar you added Add CustomHandLeft and CustomHandRight to the scene Select both, drag the TrackingSpace of the OVRCameraRig to the Parent Transform property of the custom hands Find the hand:Rhand component in CustomHandRight, expand the Materials section and set the material to Hands_transparent (same as the material for hand:Lhand) Expand the Hands_transparent material, change the Inner Color to aqua, increase the Rim Power Go to Project Settings | Time and change the Fixed Timestep to 1 / 90 Still jittery? Move the hands under the OVRPlayerController LeftHandAnchor and RightHandAnchor and remove the Parent Tansform comment(see also: unity distance grab and kinematic rigid bodies), note: I couldn't get this to align correctly in the latest version for the DistanceGrabHandLeft and DistanceGrabHandRight Setting up distance grab Remove the custom hands Select all of the cubes Set the Collision Detection to Continuous Dynamic Remove the OVR Grabbable Script Add the Distance Grabbable Script Add DistanceGrabLeft and DistanceGrabRight prefabs to scene Set the Player field to the OVRPlayerController Set the TrackingSpace to the Parent Transform Set the Grab Object in Layer field to the number corresponding to your Cubes Layer (9) Set Obstruction Layer to -1 (none) Create an Empty Game Object and call it Grab Manager and add it to the OVRPlayerController (this is different from the video, but solves the problem where only one box can be grabbed, also this is fixed in the following videos) Add the Sphere Collider component to the Grab Manager Set Is Trigger to true Set the Radius to something larger (3.5 is good) Adding the crosshairs Click the object that you want to have a crosshair on Once selected, create an Empty Game Object called Crosshair Add the Grabbable Crosshair Script to the object Create a child Quad object called “On” Remove the mesh collider of the quad Add the TriangleCursorTargeted Material Move it slightly behind the cube Duplicate the child Quad and call it “Off” Change the material to TriangleCursorUntargeted Make it smaller by lowering the scale Change the material color to gray Drag On to the Targeted Crosshair field of the Crosshair script Drag Off to the Enabled Crosshair field of the Crosshair script Make a prefab from the crosshair (drag from the scene to Assets) Drag the prefab into the remaining cubes How to make a VR game in Unity - Part 3 - VR Shooter Setup the gun In the Asset Store find the asset: “Modern Guns: Handgun” published by NOKOBOT. Smash the download button. Click Import, then Import All Open the folder in Assets, Nokobot, ModernGuns_Handgun, Prefabs, Active guns Drag Handgun_M1911A_Black (WithScript) prefab into the scene Scale it down (0.3) and move it to the left of the boxes Add a Rigidbody component Add the Distance Grabbable script Set the layer to the Grabbable layer (same as Cubes) Add a new Empty 3D object to the gun called COLLIDERS Add a new Cube to COLLIDERS that aligns to the barrel Barrel: Duplicate that cube to COLLIDERS and align the duplicate to the grip Grip: Remove the Mesh Renderer of both cubes Remove the Cube (Mesh Filter) of both cubes Drag each cube to the Grab Points field of the Distance Grabbable object in the gun Add the crosshair prefab to the gun Scale the crosshair down a little bit Modify the Distance Grabbable script Click on the gun, go to the Distance Grabbable object, click the gear and choose Edit Script. Everywhere we are using the m_renderer check if null and return (if (!m_renderer) return;): /************************************************************************************ Copyright (c) Facebook Technologies, LLC and its affiliates. All rights reserved. See SampleFramework license.txt for license terms. Unless required by applicable law or agreed to in writing, the sample code is provided “AS IS” WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the license for specific language governing permissions and limitations under the license. ************************************************************************************/ using System; using UnityEngine; using OVRTouchSample; namespace OculusSampleFramework { public class DistanceGrabbable : OVRGrabbable { public string m_materialColorField; GrabbableCrosshair m_crosshair; GrabManager m_crosshairManager; Renderer m_renderer; MaterialPropertyBlock m_mpb; public bool InRange { get { return m_inRange; } set { m_inRange = value; RefreshCrosshair(); } } bool m_inRange; public bool Targeted { get { return m_targeted; } set { m_targeted = value; RefreshCrosshair(); } } bool m_targeted; protected override void Start() { base.Start(); m_crosshair = gameObject.GetComponentInChildren<GrabbableCrosshair>(); m_renderer = gameObject.GetComponent<Renderer>(); m_crosshairManager = FindObjectOfType<GrabManager>(); m_mpb = new MaterialPropertyBlock(); RefreshCrosshair(); m_mpb.SetColor(m_materialColorField, Color.white); if (!m_renderer) return; m_renderer.SetPropertyBlock(m_mpb); } void RefreshCrosshair() { if (m_crosshair) { if (isGrabbed) m_crosshair.SetState(GrabbableCrosshair.CrosshairState.Disabled); else if (!InRange) m_crosshair.SetState(GrabbableCrosshair.CrosshairState.Disabled); else m_crosshair.SetState(Targeted ? GrabbableCrosshair.CrosshairState.Targeted : GrabbableCrosshair.CrosshairState.Enabled); } if (m_materialColorField != null) { if (!m_renderer) return; m_renderer.GetPropertyBlock(m_mpb); if (isGrabbed || !InRange) m_mpb.SetColor(m_materialColorField, Color.white); else if (Targeted) m_mpb.SetColor(m_materialColorField, m_crosshairManager.OutlineColorHighlighted); else m_mpb.SetColor(m_materialColorField, m_crosshairManager.OutlineColorInRange); m_renderer.SetPropertyBlock(m_mpb); } } public void SetColor(Color focusColor) { if (!m_renderer) return; m_mpb.SetColor(m_materialColorField, focusColor); m_renderer.SetPropertyBlock(m_mpb); } public void ClearColor() { if (!m_renderer) return; m_mpb.SetColor(m_materialColorField, Color.white); m_renderer.SetPropertyBlock(m_mpb); } } }Modify the Grab Manager script Click on the Grab Manager in the OVRPlayerController Click the gear icon on the Grab Manager Script and choose Edit Script Change GetComponentInChildren to GetComponentInParent: /************************************************************************************ Copyright (c) Facebook Technologies, LLC and its affiliates. All rights reserved. See SampleFramework license.txt for license terms. Unless required by applicable law or agreed to in writing, the sample code is provided “AS IS” WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the license for specific language governing permissions and limitations under the license. ************************************************************************************/ /************************************************************************************ Quick implementation notes: Grab candidates and grab range: ------------------------------- The trigger volume on the OVRPlayerController, which also has a GrabManager component, determines whether an object is in range or out of range. Hands (via the DistanceGrabber component) determine the target object in one of two ways, depending on bool m_useSpher'''
