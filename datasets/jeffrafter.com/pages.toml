["https://jeffrafter.com/working-with-github-actions"]
title = "Working with GitHub Actions | Jeff Rafter"
description = "GitHub Actions are still in beta and are changing quickly. But if you are looking to get started the possibilities are endless."
full_description = '''Working with GitHub ActionsSeptember 19, 2019 Image credit: GitHub's Hubot from the Octodex GitHub Actions are still in beta and are changing quickly. But if you are looking to get started the possibilities are endless. This guide is mostly about pointing to documentation and exploring some fun ways to use GitHub Actions.In this post we’ll create a repository which contains a GitHub Action - built in TypeScript - and an associated workflow. In the action we’ll respond to push events and output some logging information. Technically, you don’t need a custom script to accomplish this; you could instead build a very simple workflow which runs echo commands. Using a full script will allow us to explore more capabilities of GitHub Actions. We’ll also create an action that automatically responds to, and reacts to, issue comments.Before you read this it is important to note: starting with a template will save you a lot of time and setup. In this post, however, I am going to work through and explain all of the steps. Included in this post are some of the reasons I’ve chosen one particular setup and skipped another. When getting started with GitHub Actions it is difficult to understand how all of the pieces fit together, or why you might want to create and action for a particular task. Hopefully this post provides some helpful examples. That said, there are probably steps here that you’ve seen before, don’t care about, or just want to skip and that’s okay.In order to follow this, you’ll need a GitHub account. Additionally, you’ll need to sign up for the GitHub Actions beta. The examples will be in TypeScript. All of the code (and commits) are availble on GitHub: https://github.com/jeffrafter/example-github-action-typescript DocumentationThe documentation for GitHub Actions is really good (far more complete than this post) and is good to have on hand. You can learn how to build Actions, Workflows and core concepts; as well as dive deeply on using the toolkit, octokit and handling payloads. Automating your Workflow with GitHub Actions GitHub Package Toolkit Event Types & Payloads Rest API V3 octokit/rest.js Getting startedFirst you want to create a folder for your project:mkdir example-github-action-typescript cd example-github-action-typescriptWe’ll be using TypeScript to build our action, which requires Node. Out of the box GitHub supports a few environments for your actions to run There are several different virtual operating systems you can use for your actions which come preloaded with useful software. Additionally, you can utilize Docker containers running in one of these virtual environments to pre-configure your hosts.. There is built-in support for running actions built in JavaScript (using Node). So why did I choose to use TypeScript? It makes development a lot easier by providing compile-time checks and hints in my editor about methods and parameters (especially if you are using an editor like VSCode that has support for it). As part of our action we’ll export the TypeScript to JavaScript.Let’s setup our example to use Node. If you have multiple local projects you might run into a conflict about which Node version should be used. Node Version Manager solves this problem. To control which version of Node should be used in your project, add an .nvmrcNotice that the .nvmrc file starts with a "." (period). By default on most systems this creates a hidden file. Oftentimes general project config is hidden away. On MacOS you can show hidden files in Finder by running defaults write com.apple.finder AppleShowAllFiles -bool true and restarting Finder. If you want to list hidden files in your console use the -a parameter: ls -a. file:12.7.0The file is pretty simple; just the version. I chose 12.7.0 because it matches the version that is used to run our action (node12). Node 10.16.3 is installed in the default GitHub Action software environment and can be used as well but the will not match the running action environment. At the time you read this there may be a newer version of Node or you may chose to use an older version because your code requirements. You can check https://nodejs.org. Ignore some thingsWe plan to use git to keep track of our changes. As we work on our project locally, there will be a lot of files we won’t want to keep track of; we’ll want to ignore them. To do this we’ll create a new file called .gitignore .gitignore also starts with a "." and you can start to see a pattern emerge.. These files can be very short and specific, or they can be very long and general. We’ll use a more generic one that will work on different kinds of computers. If you are looking for an example .gitignore you can check out https://github.com/github/gitignore. For now, just copy the following (this .gitignore includes only what is important for this post. For a more complete version see here):# Ignore any generated TypeScript -> JavaScript files .github/actions/**/*.js # Logs logs *.log npm-debug.log* # Dependency directories node_modules/ # Typescript v1 declaration files typings/ # Optional npm cache directory .npm # Optional eslint cache .eslintcacheWith this setup we’ll ignore node_modules and JavaScript files in our action folders (if there was any generated locally). This is a non-standard choice but makes developing our action a little easier. By default, GitHub recommends you include the node_modules folder as installing them per-action execution is slow (25-35 seconds). Including all of the node_modules in your repository can lead to a lot of files and large commits which can be confusing. Additionally, if your node_modules include platform specific dependencies which must be compiled (such as hunspell) you will need to recompile them for the target action container anyway.Ignoring generated JavaScript in our action folders means that we have to build our TypeScript as part of our workflow. Again, this is slower and can lead to compile time errors on the server, but it saves us a few steps when developing actions. Save your progress using version controlAt this point we really haven’t made anything (except a lot of configuration). Even though our website isn’t even a website yet – it still makes sense to save our work. If we make a mistake having our code saved will help us. To do this we’ll use git - a version control software that lets us create commits or versions as we go. To initialize a git repository run:git initBy default this creates an empty git repository (none of our files have been added to it). Generally, I use GitHub Desktop; however, I’ll use the command line here. You can check the status of your changes and repository:git statusYou should see:On branch master No commits yet Untracked files: (use "git add <file>..." to include in what will be committed) .gitignore .nvmrc nothing added to commit but untracked files present (use "git add" to track)Let’s get ready to create a commit by adding all of the files:git add .Here the . means: “everything in the current folder”. But what are we adding it to? We are adding it to the commit stage. Let’s check the status again:git statusYou should see:On branch master No commits yet Changes to be committed: (use "git rm --cached <file>..." to unstage) new file: .gitignore new file: .nvmrcWe’re getting ready to add two new files to our repository. Let’s commit:git commit -m "Initial commit with configuration"This creates a commit with the message we specified. The commit acts like a save point. If we add or delete files or change something and make a mistake, we can always revert back to this point. We’ll continue to commit as we make changes. Packages & DependenciesFor almost any Node project you’ll find that you use a lot of packages – you’ll have far more code in packages in your node_modules folder (where package code is stored) than your main project.Initialize your packages:npm init -yNow you have a package.json:{ "name": "example-github-action-typescript", "version": "1.0.0", "description": "", "main": "index.js", "scripts": { "test": "echo \"Error: no test specified\" && exit 1" }, "keywords": [], "author": "", "license": "ISC" }Let’s simplify it a bit (you can fill out or keep fields you like here, but this is the minimum):{ "private": true, "scripts": { "build": "tsc", "test": "tsc --noEmit && jest" }, "license": "ISC" }The only scripts we need at the moment are build which will convert our TypeScript to JavaScript and test which will run our tests. While we’re working on our action we’ll need access to all of our project’s dependencies; the difference between dependencies and devDependencies won’t matter very much. For that reason we’ll install everything as a dev dependency:npm install --save-dev \ @actions/core \ @actions/githubThe @actions/core and @actions/github are the baseline for interacting with GitHub and the incoming events. When you publish an action which is meant to be used by multiple repositories and workflows, you’ll release the action with dependencies included (so they run more quickly). In that case you would use --save instead of --save-dev. In most other cases the code for your actions should only be used as part of your testing or development environment (not part of your production environment).We’ll want to add testing support to test our action:npm install --save-dev \ jest \ js-yamlAnd TypeScript support:npm install --save-dev \ typescript \ ts-jestFinally, because we’re using TypeScript, we’ll want to add type support for development:npm install --save-dev \ @types/jest \ @types/nodeThis is a good opportunity to create another commit; check the status:git statusYou should see:On branch master Untracked files: (use "git add <file>..." to include in what will be committed) package-lock.json package.json nothing added to commit but untracked files present (use "git add" to track)We’ve added a lot of files to our folder but many of them are ignored. For example, the node_modules folder contains tons of files (as mentioned before). We want everyone working on our project to install the same dependencies. When installing, they were automatically added to the package.json file. The package-lock.json ensures that the dependencies of our packages are locked to specific versions. Because of this, we’ll add both of these files to git:git add .And then commit:git commit -m "Setting up our packages" TypeScriptWe’ll also need to configure TypeScript before we can build our action. Create tsconfig.json:{ "compilerOptions": { "module": "commonjs", "target": "esnext", "lib": ["es2015", "es2017"], "strict": true, "esModuleInterop": true, "skipLibCheck": true, "noUnusedLocals": true, "noUnusedParameters": true, "noImplicitAny": true, "removeComments": false, "preserveConstEnums": true }, "include": [".github/actions/**/*.ts", "**/*.ts"], "exclude": ["node_modules"] }By default this allows us to build all of the actions contained in our repository, adds some strict compile-time checks, and skips type checking for our dependencies.Let’s commit this file:git statusYou should see:On branch master Untracked files: (use "git add <file>..." to include in what will be committed) tsconfig.json nothing added to commit but untracked files present (use "git add" to track)Add it:git add .And commit:git commit -m "TypeScript configuration"Keep it clean (optional) Note: this section is not required to complete this tutorial; if you want to skip it feel free. Everyone has different preferences when they edit code. Some prefer tabs over spaces. Some want two spaces instead of four. Some prefer semicolons and some don’t. It shouldn’t matter right? But it does. If editors are autoformatting code based on user preferences it is important to make sure everyone has chosen the same set of defaults for that autoformatting. This makes it easy to tell what changed between versions – even when different developers (with different preferences) have made changes.For this reason we’ll setup a linter and code formatter for our code. Install eslint and prettier:npm install --save-dev \ eslint \ @typescript-eslint/eslint-plugin \ @typescript-eslint/parser \ eslint-config-prettier \ eslint-plugin-prettier \ prettierNow that we have the packages we’ll need to configure them in .eslintrc.json:{ "parser": "@typescript-eslint/parser", "plugins": ["@typescript-eslint", "prettier"], "extends": [ "eslint:recommended", "plugin:@typescript-eslint/recommended", "plugin:prettier/recommended" ], "rules": { "prettier/prettier": [ "error", { "singleQuote": true, "trailingComma": "all", "bracketSpacing": false, "printWidth": 120, "tabWidth": 2, "semi": false } ], // octokit/rest requires parameters that are not in camelcase "camelcase": "off", "@typescript-eslint/camelcase": ["error", {"properties": "never"}] }, "env": { "node": true, "jest": true, "es6": true }, "parserOptions": { "ecmaVersion": 2018, "sourceType": "module" } }I won’t go into too much detail here; there are better explanations to be found. This configuration does a few things: Relies on the typescript eslint parser with the prettier plugin - I’ve found this works very well in @Code. If you were previously using ts-lint with prettier this setup should replace your old configuration. This eslint config doesn’t work perfectly for projects that contain both JavaScript and TypeScript - because of that we won’t attempt to lint JavaScript files in our project I’ve turned off the camelcase rules for properties - when writing GitHub Actions you will likely use properties from @actions/github and from the API and these will not be camelcase.There are lots of ways to name variables including camelCase, snake_case, ProperCase, and CONSTANT_CASE. JavaScript and TypeScript tend to use camelCase for variable names, but Ruby (which is what much of GitHub and the GitHub API is written in) generally uses snake_case. This is one of those places where the idioms of different languages collide and you have to make the best of it. The expected environment should include node and jest - this will help eslint ignore missing declarations for things like describe, process, module, etc. If you need to ignore specific files when linting you can add them to .eslintignore. Because our setup doesn’t work well for JavaScript we’ll ignore all JavaScript files in .eslintignore:*.js !/.githubNotice that we are explicitly unignoring the .github folder. This is where our source code will be kept (see next section). We have to unignore this folder explicitly because it starts with a . and is normally ignored by eslint.Add a lint action to the scripts node in package.json: "scripts": { "build": "tsc", "test": "tsc --noEmit && jest", "lint": "eslint . --ext .ts" },With this in place we can run:npm run lintWait, there’s an error:Oops! Something went wrong! :( ESLint: 6.4.0. No files matching the pattern "." were found. Please check for typing mistakes in the pattern.We haven’t written any TypeScript to lint yet. Time to stop configuring and start writing code.Checki'''
