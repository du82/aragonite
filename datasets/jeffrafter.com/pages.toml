["https://jeffrafter.com/unity-multiplayer-vr-with-normcore"]
title = "Unity Multiplayer Virtual Reality with Normcore | Jeff Rafter"
description = "What's better than Virtual Reality? Virtual Reality with friends. Even the most basic games become more fun when played together. Learn how to quickly setup a multiplayer VR game with Normcore and Unity."
full_description = '''Unity Multiplayer Virtual Reality with NormcoreOctober 16, 2021 Image credit: Oculus Quest What’s better than Virtual Reality? Virtual Reality with friends. Even the most basic games become more fun when played together. Previously, we focused on getting started with Unity and Virtual Reality. This post builds on top of that foundation: adding multiplayer support, multi-platform support, multiple controllers, and virtual reality avatars. Choosing a multiplayer packageThere are a number of different approaches for building multiplayer games in Unity, some of the most common are: Mirror (Unity multiplayer networking) https://github.com/vis2k/Mirror Normcore (Unity multiplayer service) https://normcore.io Photon (Unity multiplayer service) https://www.photonengine.com/ Mirror is open source and fantastic for peer to peer multiplayer. It requires that you (or a player) host the server which requires more work at scale. If you are looking to use Mirror I highly recommend the excellent YouTube series How To Make A Multiplayer Game In Unity - Client-Server - Mirror Networking by DapperDino.Photon and Normcore are hosted services but both have free plans. Photon tends to charge based on the number of concurrently connected users and Normcore based on the hours spent in shared “rooms”. I tend to use Normcore because the kinds of games I want to make work better with their plans and I find it the simplest solution. Depending on your use case you might choose another option.Check out the pricing: https://normcore.io/pricing https://www.photonengine.com/en-US/PUN/Pricing Planning out the sceneBefore we start building our scene it is important to outline our goals: Users should be able to view and control their player with a VR headset, Keyboard and AR Each player will be represented by an avatar within the game VR controllers can represent hands and teleport Avatars are rigged with inverse kinematics Networked objects should be sharable between players User controlWithin our basic example we were able to control the player’s view (what is displayed on the each lens) by moving the camera when the headset moved. In this way, the locomotion of our headset is our main “controller.” But what about our friends that don’t have an Oculus Quest? It would be great if they could also join our multiplayer game. To support this we will create three sets of controls: Virtual reality - the headset and the two VR controllers Augmented reality - using a phone as an AR controller Computer - using a keyboard and mouse to control the player This adds some complexity but it means our game will be more accessible. Additionally, it makes it much easier to test out the multiplayer functionality (without needing multiple headsets). We can run the game in the Unity editor and our device to test various aspects of our game.AvatarsGame designers often categorize their games as first-person or third-person. In a first-person game you view the game from the player’s perspective. Games like Quake or Counter-strike (or Superhot for VR) are “first-person shooters.” In a third-person game you control the player but not from the player’s perspective. Games like Super Mario 3D World (or Moss for VR) let you control Mario without seeing through Mario’s eyes. We’ll probably end up using multiple perspectives, but we’ll start with first-person as that will be more immersive in VR.Regardless of the perspective, we’ll need to be able to show the player in the scene. Often in first-person VR games you don’t see yourself (you might see only your hands). Because our game is multiplayer we’ll need to be able to see the other players in the scene. These are called player avatarsWhy are they called "avatars"? According to wikipedia, "The word avatar originates in Hinduism, where it stands for the 'descent' of a deity in a terrestrial form." It goes on to say, "The use of the term avatar for the on-screen representation of the user was coined in 1985 by Richard Garriott for the computer game Ultima IV: Quest of the Avatar. In this game, Garriott desired the player's character to be his earth self manifested into the virtual world."; and they are what we’ll be controlling.When a player joins the multiplayer version of our game we’ll create a local player avatar for them. As they control their character and move it around the scene, we’ll update our local copy of the avatar. To do this we’ll separate out how the player is controlled from how the player object is updated and displayed - even for our own local player object.VR controllers can represent hands and teleportIn the previous post we were able to look around our scene - but we didn’t have a body or even hands. The Oculus Quest offers two ways to control the hands of your character: hand tracking and touch controllers. We’ll implement the touch controllers and use those as our “hands” within our scene. This will allow us to leverage haptic feedback and different button inputs for interacting.Tracking the headset’s position means that walking around in reality will translate to player movement in virtual reality. That’s great, but a given player’s play-space size might be very small. Because we’ll be using the controllers, we could easily utilize the thumb-sticks to control player locomotion. Generally there are three kinds of controller based locomotion: Teleporting Snap-turns Thumbstick movement We’ll implement all three of these controls. Unfortunately, though, thumbstick based movement can induce discomfort as the player’s visual position changes without a corresponding physical change. For this reason, many games do not enable thumbstick based movement, so we’ll make it optional.Rigged characters and inverse kinematicsOur VR avatars will be controlled using three 3D points: the headset and the two controllers. Using these three points we can easily represent a head and two hands in our scene. We can go further: rigging these to an entire body with arms will let us control all parts of the body like a puppeteer. This is done by solving how the joints would need to bend based on the three control points using a technique called inverse kinematics.Networked objects should be sharable between playersLastly, we’ll want to be able to see (and share) objects in our multiplayer scene. For example, we’ll want to be able to pickup, drop and throw things. For most objects within a multiplayer environment there is one “owner” that determines the position and rotation of each object. Changes to the position and rotation are broadcast to all of the participants. In most cases physics simulations are handled on the local machine of the “owner”.One thing we’re not covering in this post is anti-cheating. Because we are relying on the clients to broadcast changes to the position of objects (including their own player) we are trusting them to follow the rules. A cheater could, in theory, modify the game so they could run or move more quickly, go through walls, etc. For now we won’t worry about validating movements but in a public application you would need to implement a robust anti-cheating system.Create a new projectWe’ll need to create a new Unity project for our multiplayer scene. We’ll assume you are starting with the project from the previous post. If you followed that post you can continue to use the same project you’ve already started. Getting started with Normcorehttps://normcore.io/documentation/essentials/getting-started.htmlSign up for an account.Download the package.Open the package.Import the package Create a new Game Object called RealtimeAdd a Realtime component and set the App Key (you may need to create an application first: https://normcore.io/dashboard/app/applications). For now you can leave the room as Test Room.Add a Realtime Avatar Manager component. Creating a Custom Avatarhttps://normcore.io/documentation/guides/xr-avatars-and-voice-chat.html#creating-custom-avatarsCreate a new empty game object and call it AvatarAdd a Realtime Avatar component to the object. Notice that it added a Realtime View automatically for you. This will help track and broadcast the position of this object across players. Click Create Avatar Prefab. This will add a Realtime Transform and three new child objects: Head, Left Hand, Right Hand. Each of these objects have Realtime View and Realtime Transform components and will be tracked accordingly. The Head object also has components for syncing the voice and changing the scale of the head proportionally.We need to turn this into a prefab. Create a new folder in your Assets called Resources (it must be called Resources for the object to be instantiated at runtime). Drag the Avatar object into the Resources folder. Next, delete the object from the scene hierarchy.Select the Realtime game object. Drag the Avatar prefab from the Assets/Resources into the Local Avatar Prefab property.You should be able to run the game and all of the players that join will have their own avatar (made out of cubes). Keyboard controllerAdding the ability to control things with the keyboard will make it easier to test and debug the game. Also, it will make it easier to get multiple players in the game.Add a new empty game object called Keyboard to the Controller game object. Then add a Camera object to the Keyboard object. Change the tag to MainCamera. Then add a Simple Camera Controller component to the Camera object:You may want to adjust the sensitivity of the camera controller:Also, you can check the Invert Y checkbox.Uncheck the Keyboard object in the hierarchy so that it is not active when the game starts.We now have two controllers in the scene: the keyboard and the XR rig. We’ll want to make it so that the game auto-switches to the keyboard controller when the XR rig is not available. In the Controller object create a new script called ControllerSwitcher.#if !(UNITY_EDITOR_WIN || UNITY_STANDALONE_WIN || (UNITY_ANDROID && !UNITY_EDITOR)) #define OVRPLUGIN_UNSUPPORTED_PLATFORM #endif using System.Collections; using System.Collections.Generic; using UnityEngine; using Normal.Realtime; public class ControllerSwitcher : MonoBehaviour { public GameObject keyboardController; public Transform keyboardHead; public GameObject XRRig; public Transform XRHead; public Transform XRLeftHand; public Transform XRRightHand; public Transform realtime; private RealtimeAvatarManager realtimeAvatarManager; void Start() { realtimeAvatarManager = realtime.GetComponent<RealtimeAvatarManager>(); realtimeAvatarManager.avatarCreated += OnAvatarCreated; #if OVRPLUGIN_UNSUPPORTED_PLATFORM XRRig.SetActive(false); keyboardController.SetActive(true); #else XRRig.SetActive(true); #endif } void Update() { } public void OnAvatarCreated(RealtimeAvatarManager avatarManager, RealtimeAvatar avatar, bool isLocalAvatar) { if (!isLocalAvatar) return; #if OVRPLUGIN_UNSUPPORTED_PLATFORM avatar.localPlayer.head = keyboardHead; #else avatar.localPlayer.root = XRRig.transform; avatar.localPlayer.head = XRHead; avatar.localPlayer.leftHand = XRLeftHand; avatar.localPlayer.rightHand = XRRightHand; #endif } }If you are running on a Mac M1, you may encounter an error when Normcore attempts to connect to your Microphone. To fix this, you can try the following: open the Avatar prefab (double-click), open the Head object and uncheck the Realtime Avatar Voice component. This completely disables voices, but will allow the game to run without crashing.You’ll notice that you head moves with the keyboard controller, but your hands are stuck in the ground. We’ll need to fix this later when we setup our inverse kinematics. LocomotionNow that we have bodies and hands we can start implementing the locomotion controls. In the scene hierarchy, add a new Locomotion System (Action Based). By default this will give you a Locomotion System component, a Teleportation Provider component, and a Snap Turn Provider component. Connect the XR Rig to the XR Rig property. This should allow you to snap turn using the thumbsticks. Teleporting aroundLet’s make it so you can teleport around. In order to teleport, we’ll need to have a place we can teleport to. Click on the Floor object in the Environment object. Add a Teleportation Area component:Run the game. You should be able to use the grip buttons to teleport.This is pretty simple teleportation. Let’s improve it by using the thumbsticks to teleport instead. We’ll also add a “reticle” that allows us to see where we’re going.ReticlesWe’ll make a basic reticle. Create a new Cylinder in the environment and name it Reticle. Remove the collider, reset the transform and scale the X and Z down to 0.6 and scale the Y down to 0.1:Make a new material for the reticle and call it Reticle. Set the base color to blue, the opactity to 0.5, change the Surface Type to Transparent:Drag the material onto the Reticle object.Within the RightHand Controller object, change the XR Ray Interactor’s Line Type to Projectile Curve and change the Velocity to 8. Set the Select Action Trigger property to State Change. Uncheck Enable Interaction with UI GameObjects and set the Haptic Events as follows: On Select Enter: Haptic Intensity: 0.3, Duration: 0.1 On Hover Enter: Haptic Intensity: 0.1, Duration: 0.1 Then drag the Reticle object from the hierarchy to the XR Interactor Line Visual’s Reticle property:https://www.youtube.com/watch?v=siFRhXNVIcY Adding a ball to throwCreate a new sphere object.Position it above the table. You can set the transform as follows:Add a RigidBody to the sphere and add an XR Grab Interactable. Set the XR Grab Interactable movement type to Velocity Tracking and check the Force Gravity on Detach checkbox. At this point you should be able to run the game and grab the sphere. You can even throw it! Unfortunately you’ll find it hard to get any momentum from the throw. Run the game and try to throw the sphere.The reason you can’t throw it well is because the ball is colliding with your hands. When you let go of the grip button, the ball will start to collide and immediately fall down. If you don’t want interactors to work with it change the Layer of the ball to a new layer called Grab.We’ll also create a new layer called Avatar. Open the Avatar prefab and change the layer of the Avatar object to Avatar (including all of the children).Go to Edit | Project Settings | Physics and go to the Layer Collision Matrix. Uncheck the box that is the intersection between Avatar and Grab.Unfortunately the ball is not shared between all of the players. Each player sees the ball only for themselves.To fix this we’ll need to add a Realtime Transform component to the ball. This will automatically add a Realtime View component to it as well. In order manage the ownership of these objects we’ll need each player to request ownership of the ball when it is grabbed. Create a new script component on the ball called Grabbable. Use the following code:using Normal.Realtime; using UnityEngine; using UnityEngine.XR.Interaction.Toolkit; public class Grabbable : MonoB'''
