full_description = "Posts tagged markdownDocker, CUPS-PDF, Avahi and AirPrint2024-02-17T00:01:00Just use docker to print to a PDF from your iPad ™️Printers, Fake Printers, and AirPrint2024-02-16T00:01:00When the economy crashes and the world ends you'll find us all trading ink cartridges for currency.Vagrant, CUPS-PDF and AirPrint2024-02-19T00:01:00I've been on a quest to setup a virtual AirPrint printer on my Mac that allows me to print to a PDF from my iPad. I've tried a few different things including RWTS-PDFWriter and CUPS-PDF and I kept falling short. The final piece of the puzzle was to use Vagrant to run a Linux VM with CUPS-PDF installed. Here's how I did it.Gifs2019-04-23T00:01:00It's really hard to make Gifs.Example Markdown2019-02-01T22:12:03.284ZTufte CSS provides tools to style web articles using the ideas demonstrated by Edward Tufte's books and handouts. Tufte's style is known for its simplicity, extensive use of sidenotes, tight integration of graphics with text, and carefully chosen typography."
