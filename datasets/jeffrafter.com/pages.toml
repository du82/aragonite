["https://jeffrafter.com/terraform-and-aws"]
title = "Terraform and Amazon Web Services | Jeff Rafter"
description = "There are a lot of options for configuring AWS. Terraform from HashiCorp is a tool for configuring remote infrastructure. You can create Terraform configuration files and treat your infrastructure as code; versioning the changes and storing your settings in your repository."
full_description = '''Terraform and Amazon Web ServicesOctober 09, 2020 Image credit: HashiCorp's Terraform I’ve previously written about building a static website with Gatsby and TypeScript. If you’re building a static website like a blog then deploying to GitHub Pages is more than enough. But what if the website you are building needs user authentication and authorization? What if you need to store and retrieve items from a database? What if you need server side processing. What if you want to integrate payment processing? There are a lot of options and managing it all quickly becomes difficult.Who is this for?This is a long post. Even by my standards. Also, this isn’t exactly introductory or beginner friendly (though I do try to explain how things are setup and how to make decisions). This post is more of a long-winded reference. I’ve written it because I needed opinionated documentation with all of my choices in one place. Your choices will probably be different because there are lots of trade-offs. Because this is opinionated it is also limited. There are many deeper technical topics I omit because I don’t use them. Nevertheless, hopefully this is useful for you.Some historyYears ago, I was helping to build an E-Commerce startup. It was one of those experiences where you’re surrounded by brilliant and creative people that can make anything. Our platform was built using Ruby on Rails 1.2, relied on an early beta of Stripe for payment processing, and we used the beta of Slack to communicate.We deployed everything to Amazon Web Services because we knew it could scale. At the time the tooling was limited. So we hired a consultant named Mitchell Hashimoto to help us. Mitchell and I would work late setting up the infrastructure using a series of YAML files and a AWS API tool called fog. It was rudimentary but it worked amazingly well.From experience I can tell you that Mitchell is one of the fastest, most brilliant people I have ever seen. He built everything we needed flawlessly. One night, he started telling me about what he envisioned as a much better configuration language and platform. Looking back, I realize now he was envisioning Terraform.SetupBefore you begin building anything it is useful to understand the trade-offs associated with different platforms, frameworks, and languages. When I’m building something new I tend to optimize for the following: Price Scalability Performance Maintainability It is very likely your priorities are different. I put price first because I don’t want to be restricted from making a lot of websites. Using Now or Netlify or Heroku will get you up and running very quickly. In many cases you can get your website running for free and it will be free forever. As you scale your service though - adding authentication, storage, background jobs and more the price quickly goes up - even if you don’t have a large number of users.If you anticipate a small consistent scale you could spin up a VPS (virtual private server) on Digital Ocean and the price will stay constant, but you’ll have a lot more to manage including security updates.Building on a cloud platform like AWS, Azure or Google Cloud allows you to keep a low price while providing massive scalability. These platforms have a free-tier that allows you to build your website at virtually no-cost. For the kinds of websites I build Amazon Web Services has the best pricing, but is arguably the most difficult to work with. That’s the trade-off: you get more options, scalability and lower-price but it comes with higher complexity.In this post, I’ll detail my setup. It should allow you to build a dynamic website at essentially no cost until it scales beyond 50,000 users per month.Our website can be divided into three main projects: Our infrastructure - built using Terraform Our server-side API - built using Express Our front-end website - built using Gatsby We’ll keep these in separate folders (and each will have a separate repository):example/ | |- terraform/ | |- .git | |- ... Terraform project files |- api/ | |- .git | |- ... Express project files |- site/ | |- .git | |- ... Gatsby project filesTerraformTerraform is a tool for configuring remote infrastructure. There are a lot of other options for configuring AWS.One of the best tools is serverless which is generally much simpler than Terraform to use. You can also check out apex but it is no longer maintained. Additionally, you could use AWS CloudFormation directly but Terraform is slightly easier to manage when working with larger organizations. but Terraform provides much more flexibility (even allowing you to deploy to multiple cloud providers). You can create Terraform configuration files (*.tf) and treat your infrastructure as code; versioning the changes and storing your settings in your repository.You’ll need to download and install Terraform. You can also use Homebrew (if you are on a Mac):brew install terraform Getting startedTo get started I’ll assume you’ve purchased a domain, but for the purposes of this post, we’ll pretend our domain is example.com (you’ll need to replace example.com with your domain throughout). You can buy a domain pretty much anywhere for $0.99 to $12.00 for the first year. I use Google Domains because I use Gmail so it’s easier to keep track of. By default you get an email address you can use to start setting up services. Within your domain provider, setup an alias for *@example.com to point to your personal email address. This way any email sent to example.com will still get through.Next, sign up for AWS using the new email address. When signing up, I tend to use a single-use email like aws@example.com and I generally use the domain name as the AWS Account Name (for example: if my domain is example.com my I would choose example as my account name). To complete your account creation you’ll need to enter a credit card for billingThough we'll attempt to keep the costs down, we'll be utilizing Route53 for DNS. Because of this the bill will be at least $0.50 per month (the cost of the primary DNS zone). There are alternatives for setting up your DNS, but keeping everything together makes things simpler. and you’ll need to select a support plan (I generally choose the free support plan). You’ll also need a phone number for verification. Setting up an IAM userIn general, it is not a good practice to use root user accounts to log into the console and manage your configuration. Creating IAM users for each person in your organization allows you to control access at an individual level. Additionally, if credentials are compromised for a given user those credentials can be revoked centrally.Let’s create a user in the Identity and Access Management service. Choose your own (personal) user name and choose AWS Management Console Access: Setup your password and configure your policies: You might want more granular access controls, but when getting started AdministratorAccess policy keeps things simple.Create a user for programmatic access; I’ve called my user terraform: Once you create the user you’ll need to keep a copy of the AWS Access Key ID and the AWS Secret Access Key. We’ll configure the AWS Command Line Interface (CLI) on our machine use these. Download and install awscli. On a mac you can use Homebrew:brew install awscliOnce installed, awscli will need to know about your credentials. There are a few ways to do this: Saving your credentials in Terraform Configuring the default credentials Configuring a profile Using environment variables Saving your credentials in Terraform (wrong)It is possible to put your credentials directly inside of Terraform (don’t do this):# DON'T DO THIS provider "aws" { aws_access_key_id = "YOUR_AWS_ACCESS_KEY_ID" aws_secret_access_key = "YOUR_AWS_SECRET_ACCESS_KEY" }Not only is this unsafe (we’ll be using version control for our configuration files and you should never store credentials in your repository), it cannot be easily overridden by other developers; meaning everyone will share credentials.Configuring the default credentialsInstead, it is much better to let the awscli tool store the credentials locally. To do this run:aws configureYou’ll be prompted to enter your credentials and region:AWS Access Key ID [None]: YOUR_ACCESS_KEY_ID AWS Secret Access Key [None]: YOUR_SECRET_ACCESS_KEY Default region name [None]: us-east-1 Default output format [None]: jsonBy default, I’ve chosen to use us-east-1 (also known as N. Virginia). You might prefer another region but unless you have a specific reason not to, you should choose us-east-1 as it will make later configuration a little easier. Setting the default credentials with aws configure allows all of the developers to use individual credentials without needing to change anything within the Terraform configuration.Configuring a profileStoring default credentials works great, but what if you have multiple projects on your machine - each with different credentials? Luckily, awscli can work with multiple profiles. Profile names may include your project name, domain name, an environment (like staging or production). There is good documentation on different configurations for the awscli tool.You can name a profile anything you like. For now, just use your domain name without the .com (in our case, example). Run:aws configure --profile exampleFill in the prompts as you did before.In order to use a profile you’ll need to export an environment variable (replacing example with the profile name you configured). On Mac/Linux you can do this with the export command:export AWS_PROFILE=exampleOr if you are using an alternative shell like the fish shell:set -x AWS_PROFILE exampleOn Windows:C:\> setx AWS_PROFILE exampleUsing environment variablesIt is also possible to skip the awscli configuration altogether. To do this you’ll need to set environment variables for your credentials. For example, on Mac/Linux:export AWS_ACCESS_KEY_ID=YOUR_ACCESS_KEY_ID export AWS_SECRET_ACCESS_KEY=YOUR_SECRET_ACCESS_KEYOn Windows:C:\> setx AWS_ACCESS_KEY_ID YOUR_ACCESS_KEY_ID C:\> setx AWS_SECRET_ACCESS_KEY YOUR_SECRET_ACCESS_KEYThis pattern is particularly useful when running terraform in a continuous integration platform (such as GitHub Actions).Managing multiple environments locally can be cumbersome. A helpful tool for this is direnv: it allows you to control the environment on a per-folder basis. We won't use that here, though. Project organization choicesTerraform uses its own configuration language and uses the file extension *.tf. Our project will have a lot of Terraform configuration. There are several different approaches we could use to organize our Terraform project. These fit into three categories: Keep all of the configuration in one folder or one file Separate the configuration of resources into separate modules Control access and permissions to each resource configuration and state individually Each of these patterns offer advantages and disadvantages.Keep all of the configuration in one folder or one fileTerraform is made up of a series of configuration files, variables, outputs and states. When starting a project, all of this can be kept in a single terraform.tf file:terraform/ | |- terraform.tfAfter you apply your Terraform configuration, a local copy of your state will be created:terraform/ | |- terraform.tf |- terraform.tfstate |- terraform.tfstate.backupAs your infrastructure grows, however, the number of services and resources you rely on will quickly grow and a single file will become unwieldy. It is possible to separate out each service to a separate file as well as separating out the variables and outputs to separate files. When running, Terraform loads all of the files and treats them as a single configuration and figures out the interdependencies. For example:terraform/ | |- dns.tf |- certs.tf |- email.tf |- storage.tf |- site.tf |- database.tf |- users.tf |- identities.tf |- api.tf |- logging.tf |- variables.tf |- outputs.tf |- terraform.tfstate |- terraform.tfstate.backupIn this case, it is clear where changes need to be made for specific resources. This makes it easier for developers. Unfortunately is still relies on a single state file even though we’re using separate files. Because of this, when applying the configuration using terraform apply, it will need to check and compare the state of every service. If you have a lot of services this can be slow. If you’re making lots of changes that makes sense. But when making a small change (such as just changing the version of a lambda function) this might not be a good choice.Separate the configuration of resources into separate modulesTerraform has a built in module system that works well to separate out your resources. To do this you would create subfolders for each resource. A default terraform.tf file imports the modules and runs them:terraform/ | |- .gitignore |- README.md |- terraform.tf |- terraform.tfstate |- terraform.tfstate.backup |- dns/ | |- main.tf | |- variables.tf | |- outputs.tf |- certs/ | |- main.tf | |- variables.tf | |- outputs.tf |- email/ | |- main.tf | |- variables.tf | |- outputs.tf |- storage/ | |- main.tf | |- variables.tf | |- outputs.tf |- site/ | |- main.tf | |- variables.tf | |- outputs.tf |- database/ | |- main.tf | |- variables.tf | |- outputs.tf |- users/ | |- main.tf | |- variables.tf | |- outputs.tf |- identities/ | |- main.tf | |- variables.tf | |- outputs.tf |- api/ | |- main.tf | |- variables.tf | |- outputs.tf |- logging/ | |- main.tf | |- variables.tf | |- outputs.tfThis is a lot of repeated files and filenames and it is easy to get confused when making changes in an editor (“which main.tf am I editing?”). At the same time, this separation of concerns is very powerful. Normally the modules (subfolders) would not contain configuration specific to your website. Instead the specific names and values would be passed into the modules via variables. Because of this, modules can actually be open source and shared between projects.Cloud Posse maintains a huge set of open source modules that can be used in your project. In many cases using these modules is the right choice if you are looking to follow best practices around specific resources.Just as we saw in the previous setup, when running terraform apply, Terraform sees all of the modules as a single configuration. Knowing where to make a change is still relatively easy, but each change requires re-applying the entire state for every resource.Control access and permissions to each resource configuration and state individuallyAs your website grows and more developers are working on it, it will not make sense to keep everything in a single file. Likewise, maintaining all of your infrastructure in a single state file can become problematic. As your team grows you’ll have developers that understand networking, others that understand database concerns, some will work on site security, and others will deploy changes to the API and site. You’ll want to restrict access to different part'''
