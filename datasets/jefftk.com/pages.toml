["https://jefftk.com"]
title = "Jeff Kaufman"
full_description = "This is all my dance weekend gigs since restarting, both with Free Raisins and Kingfisher, and all either included travel or were within a few hours drive. They also all included housing and food. Some involved more playing than others and each gig has its own combination of pros and cons, but here's the range: This time our first dance was Baltimore, and while it's possible to drive from Boston to Baltimore in one day and then play a dance, we decided to be a bit more relaxed and do it over two. We also decided to repeat what worked well during our summer tour and stop interesting places. A few months ago my cracked-screen laptop finished dying, and I got a new one. I use the stacked monitor a lot less now, since for quick things the built-in monitor is much more handy. But it's still something I want when traveling, where I might be working on the laptop for a significant time. Still, having events automatically show up on calendars is great, and after Jeff Keller asked I decided to put something together. But after thinking it through, and noting that this puts me on the other side from many of my friends, I think the project should go ahead. The proposal isn't to tear down paradise to put up a parking lot, it's to put up 500+ apartments (studio, 1br, 2br, 3br), 100+ of them limited to people below income thresholds ('affordable'). We're in the middle of a housing crisis, where instead of letting people build up to meet demand we've been competing with each other to bid up the apartments that do exist. Rising rent has been really hard on our communities, folk scene included. Of my Cambridge/Somerville folkie friends from, say, fifteen years ago, the majority of folks still in the general area have been priced out, to Vermont, Maine, and Western Mass. While spaces to make music are a key component of a thriving community, housing is even more critical."
year_published = 2025
clearnet = "https://jefftk.com"
