full_description = '''Less Laptop Velcro February 8th, 2025 tech A year ago I broke my laptop screen, and took the opportunity to build something I've always wanted: a monitor that folds vertically so I don't have to bend my neck: A few months ago my cracked-screen laptop finished dying, and I got a new one. I use the stacked monitor a lot less now, since for quick things the built-in monitor is much more handy. But it's still something I want when traveling, where I might be working on the laptop for a significant time. I originally used quite a lot of velcro on my laptop: This turned out to be overkill, and to get worse over time: after a few hours joined the bond was so secure that if my screen were not already busted I would have been worried I'd crack it. With the new laptop I put on just a tiny bit of velcro: This turns out to be plenty: I haven't had any issues with it falling off, but I can still detach it without feeling like I'm putting excessive force on the machine. ← Kingfisher Tour February 2025 BIDA Calendar iCal Feed → Comment via: facebook, lesswrong, mastodon, bluesky var last_visit = document.cookie.replace(/(?:(?:^|.*;\s*)jtk_last_visit\s*\=\s*([^;]*).*$)|^.*$/, "$1"); var current_time = new Date().getTime(); var one_year_gmt_str = new Date(current_time + 31536000000).toGMTString(); document.cookie = "jtk_last_visit=" + current_time + "; path=" + window.location.pathname + "; expires=" + one_year_gmt_str; function ajaxJsonRequest(url, callback) { function createRequestObject() { var tmpXmlHttpObject; if (window.XMLHttpRequest) { // Mozilla, Safari would use this method ... tmpXmlHttpObject = new XMLHttpRequest(); } else if (window.ActiveXObject) { // IE would use this method ... tmpXmlHttpObject = new ActiveXObject("Microsoft.XMLHTTP"); } return tmpXmlHttpObject; } var http = createRequestObject(); //make a connection to the server ... specifying that you intend to make a GET request //to the server. Specifiy the page name and the URL parameters 