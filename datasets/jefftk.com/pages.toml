{ recursively_add_service(children[i], service); } } function all_comments_sorted() { var ts_comment = []; for (var service in all_comments) { for (var i = 0 ; i < all_comments[service].length ; i++) { var comment_copy = deep_copy(all_comments[service][i]); recursively_add_service(comment_copy, service); var ts = comment_copy[4]; ts_comment.push([ts, comment_copy]); } } ts_comment = ts_comment.sort(); var c = []; for (var i = 0 ; i < ts_comment.length ; i++) { c.push(ts_comment[i][1]); } return c; } function redrawComments() { var d = document.getElementById("comments"); var h = "<div class=\"comment-thread\">"; h += display_posts(all_comments_sorted()); window.acs = all_comments_sorted(); window.dictionary = dictionary; window.quoting = quoting; h += "</div>"; d.innerHTML=h; } function pullComments(wsgiUrl, serviceName) { ajaxJsonRequest(wsgiUrl.replace("json-comments", "json-comments-cached"), function(response) { gotComments(serviceName, response); ajaxJsonRequest(wsgiUrl, function(response) { gotComments(serviceName, response); }); }); } pullComments('/wsgi/json-comments/fb/pfbid028nKqn2NoG5PLVamhcSGyJ3h7oxfTb5kKQPG2DeJzUxUW4TMRDsnSGCgGKoykpskzl', 'facebook'); pullComments('/wsgi/json-comments/lw/posts/va7oH9XfjjmHaLnZF', 'lesswrong'); pullComments('/wsgi/json-comments/m/113954348315721840', 'mastodon'); pullComments('/wsgi/json-comments/bs/3lhhwqgfxqs25', 'bluesky');'''
