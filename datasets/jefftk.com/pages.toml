title = "Summer Tour Stops"
description = '''Last week, Lily, Anna, Cecilia, Harris, and I drove to St Louis and back playing dances. I wrote about one aspect  last week, and will probably continue splitting thoughts across posts. Today I'm thinking some about our approach to stopping along the way.  I grew up in a family with a very strong "maximize time at destination" approach to road trips. We would often leave before daylight, with stop'''
full_description = '''Summer Tour Stops July 9th, 2024 kids, tour Last week, Lily, Anna, Cecilia, Harris, and I drove to St Louis and back playing dances. I wrote about one aspect last week, and will probably continue splitting thoughts across posts. Today I'm thinking some about our approach to stopping along the way. I grew up in a family with a very strong "maximize time at destination" approach to road trips. We would often leave before daylight, with stops determined by the minivan's requirements for additional gasoline. We would eat while driving, I recall creative efforts to handle certain biological needs, and we'd generally try to get the trip over with as quickly as possible. I did sometimes see other people taking a different approach, but it wasn't until the first time I drove a group of college classmates a long way that I realized people have widely divergent preferences here. We were driving a van to Dance Flurry, about five hours North of Swarthmore, and around lunchtime people started talking about maybe stopping for lunch. I (really!) thought they were joking, and said that since we still had more gas and had brought along a bunch of food we didn't need to stop. There was a revolt, and we did not end up eating while driving. Over time, I've come around to a view where one of the great things about traveling long distances by car is the opportunity for interesting stops. It's often the case that there are intermediate locations that are better places to spend the marginal hour than your origin or destination. Before this tour we put some time into thinking about nice places to stop, and we also did some looking up options while driving. We ended up stopping at: Cecilia's father's violin shop, where he showed us how he repairs instruments: Lily and Anna both got to take turns putting on clamps: Niagara Falls, on the way from Rochester to Pittsburgh. I'd been there once before, ten years earlier with Amy and Audrey, but it was great to take the older two kids there. We also had a lot more time than on our previous visit, and so were able to take the elevator and boardwalk down to the base of the falls. Lily loved the powerful wind and spray; Anna wanted to stay a bit further from the most intense area. Golden Gate Park in Brookville OH on the way from Pittsburgh to Bloomington. Really big play structure (but Lily was worried about splinters and says it's a head bonking hazard), plus a creek. Lily did some vegan 'fishing': Bluespring Caverns, on the way from Bloomington to St Louis. It's an underground river, through a cave, with a boat tour. I'd been in smaller caves before, but this felt very different. Gateway Arch, another stop on the way to the St Louis dance. We went up to the top, in very small cars with tiny doors. The view was excellent. The Woodlands in Martinsville IL on the way from St Louis to Cincinnati. The headline attractions were a 90-foot slide: And a pretty great zipline: It was fast enough you'd go nearly horizontal when stopping at the end. There was also a little creek, some musical toys, and a nice play structure. Brookville Lake, on the way from Cincinnati to Indianapolis. Swimming and hanging out at the beach, very relaxed. The water was warm, though since I get cold easily I was glad to have my wetsuit with me. Pepper Pike Park, on the way from Indianapolis to Syracuse. Lots of green space, some water, decent playground, nice bench swings. Lee Athletic Field, in Lee MA on the way back to Boston. The playground and field were fine, but at the far end of the field there was the best stream we'd stopped at all trip. Lots of trees, cool water, squishy mud in places, a few skippable stones, and a small island you could wade to without getting your knees under. There were also stops that didn't end up being so nice (usually: "too hot, no water, not much to do") but we generally kept these short, stretching legs and moving on. I asked everyone to rate these: Lily Anna Jeff Cecilia Harris Niagara Falls 1 1 2 3 2 Gateway Arch 5 1 3 1 1 Bluespring Caverns 6 1 1 2 5 The Woodlands (Zipline) 2 1 6 3 4 Violin Shop 7 1 5 6 3 Brookville Lake (Swimming) 3 1 7 5 6 Lee Athletic Field (Island) 4 1 4 7 9 Pepper Pike Park (Green) 8 1 9 8 7 Golden Gate Park (Creek) 9 1 8 9 8 Overall, I think this dramatically improved the tour. While I love playing dances, and that remains my favorite part, some of the things we saw along the way came close! Referenced in: Stacked Laptop Monitor Update Kingfisher Tour February 2025 ← AirBnB Baking Sample Prevalance vs Global Prevalence → Comment via: facebook, lesswrong, mastodon var last_visit = document.cookie.replace(/(?:(?:^|.*;\s*)jtk_last_visit\s*\=\s*([^;]*).*$)|^.*$/, "$1"); var current_time = new Date().getTime(); var one_year_gmt_str = new Date(current_time + 31536000000).toGMTString(); document.cookie = "jtk_last_visit=" + current_time + "; path=" + window.location.pathname + "; expires=" + one_year_gmt_str; function ajaxJsonRequest(url, callback) { function createRequestObject() { var tmpXmlHttpObject; if (window.XMLHttpRequest) { // Mozilla, Safari would use this method ... tmpXmlHttpObject = new XMLHttpRequest(); } else if (window.ActiveXObject) { // IE would use this method ... tmpXmlHttpObject = new ActiveXObject("Microsoft.XMLHTTP"); } return tmpXmlHttpObject; } var http = createRequestObject(); //make a connection to the server ... specifying that you intend to make a GET request //to the server. Specifiy the page name and the URL parameters to send http.open('get', url); http.onreadystatechange = function() { if(http.readyState == 4){ callback(JSON.parse(http.responseText)); } } http.send(null); } all_comments = {}; quote_threshold = 8; quoting= {} dictionary = {} function canonical_wordlist(s) { return (s.replace(/&[^ ;]+;/g, '') .replace(/<[^> ]+>/g, '') .toLowerCase() .replace(/[^a-z0-9 ]/g, '') .split(" ")); } function build_phrase_dictionary_for_comment(comment, index) { var words = canonical_wordlist(comment); f