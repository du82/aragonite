title = "Donations"
full_description = "Julia and I believe that one of the best ways to make the world better is to donate to effective charities. Since we're advocating this, we want to be transparent about our own donations. Note: entries in grey italics are not included in the totals, and we don't count them towards our 50% donation goal. [2] We sent this donation on 2023-12-27 but the bank messed up the transaction and we had to resend it at the beginning of January 2024. The IRS considers this a 2024 transaction, but to make our internal accounting more consistent we've listed it on the date we initated the transaction. [3] We hadn't donated to a political campaign since college, but Julia was impressed with this candidate's work on pandemic preparedness, which is an area we've both thought was important for a long time. In general, we prefer to donate through funds because they are able to put a lot more time and attention into identifying excellent donation opportunities, but campaign finance rules mean this model doesn't work for political donations. Unlike our other donations, this was not tax-deductible. We originally donated $5,800, but after losing the primary Flynn returned $3,219.52."
