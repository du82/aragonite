full_description = "Jekyll 3.0.3 Released Permalink release 08 Feb 2016 parkr GitHub Pages upgraded to Jekyll 3.0.2 last week. With a testbed of over a million sites, this really put Jekyll 3 through the wringer. This release addresses a handful of bugs that were surfaced as a result. The fixes: Fix problem where outputting to a folder would have two extensions Handle tildes (~) in filenames properly Fix issue when comparing documents without dates Include line numbers in liquid error output Read more on the changelog with links to the related patches. Please keep submitting bugs as you find them! Please do take a look in our various help resources before filing a bug and use our forum for asking questions and getting help on a specific problem you’re having. Happy Jekylling!"
