title = "Jekyll 1.1.2 Released | Jekyll • Simple, blog-aware, static sites"
description = "Version 1.1.2 fixes a minor, but nonetheless important security vulnerability affecting several third-party Jekyll plugins. If your Jekyll site does not use plugins, you may, but are not required to upgrade at this time."
full_description = "Jekyll 1.1.2 Released Permalink release 25 Jul 2013 parkr Version 1.1.2 fixes a minor, but nonetheless important security vulnerability affecting several third-party Jekyll plugins. If your Jekyll site does not use plugins, you may, but are not required to upgrade at this time. Community and custom plugins extending the Liquid::Drop class may inadvertently disclose some system information such as directory structure or software configuration to users with access to the Liquid templating system. We recommend you upgrade to Jekyll v1.1.2 immediately if you use Liquid::Drop plugins on your Jekyll site. Many thanks for Ben Balter for alerting us to the problem and submitting a patch so quickly."
