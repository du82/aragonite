title = "Jekyll Turns 21! Err… I mean 2.1.0. | Jekyll • Simple, blog-aware, static sites"
description = "Jekyll’s finally legal to drink in the States. And he’s done a lot of learning in the process! Here are some of the new things to look forward to:"
full_description = "Jekyll Turns 21! Err... I mean 2.1.0. Permalink release 28 Jun 2014 parkr Jekyll’s finally legal to drink in the States. And he’s done a lot of learning in the process! Here are some of the new things to look forward to: Uses the latest Liquid version (2.6.1) (#2495) Set front matter defaults for collections (#2419) Set a collection-specific URL template (#2418) pygments.rb 0.6.0! (#2504) .json files in _data (#2369) Allow subdirectories in _data (#2395) Add support for hl_lines in highlight tag (#2532) Post categories now merge with directory, front matter, and defaults (#2373) New --skip_initial_build flag for jekyll serve (#2477) A bajillion bug fixes and site updates! Let’s go party! Check out the full changelog for more. Many thanks to these 37 contributors for the 2.1.0 release: Alberto Grespan, Alessandro Lorenzi, Alex Medearis, Alfred Xing, Anatol Broder, Ben, Ben Balter, Bud Parr, Chezou, Denilson Figueiredo de Sá, Denilson Sá, Ivan Tse, Jens Nazarenus, Jesse Shawl, Jordon Bedwell, Josh Davis, János Rusiczki, Marc Ransome, Mathieu Bruyen, Matt Rogers, Parker Moore, Pat Hawks, Paul Henry, Peter Rhoades, Philipp Rudloff, Quinn Shanahan, Renaud Martinet, Rob Murray, Rodrigo Dumont, Simon Sarris, Terry, Terry Schmidt, Tomer Cohen, XhmikosR, Yihang Ho, jaybe@jekyll, and mikecole."
