["https://jekyllrb.com/news/2016/06/03/update-on-jekyll-s-google-summer-of-code-projects"]
title = "Jekyll’s Google Summer of Code Project: The CMS You Always Wanted | Jekyll • Simple, blog-aware, static sites"
description = "This year, Jekyll applied to be a part of Google Summer of Code. Students were able to propose any project related to Jekyll. With a gracious sponsorship from GitHub and the participation of myself, @benbalter and @jldec, Jekyll was able to accept two students for the 2016 season, @mertkahyaoglu and @rush-skills."
full_description = "Jekyll's Google Summer of Code Project: The CMS You Always Wanted Permalink community 03 Jun 2016 parkr This year, Jekyll applied to be a part of Google Summer of Code. Students were able to propose any project related to Jekyll. With a gracious sponsorship from GitHub and the participation of myself, @benbalter and @jldec, Jekyll was able to accept two students for the 2016 season, @mertkahyaoglu and @rush-skills. These students are working on a project that fills a huge need for the community: a graphical solution for managing your site’s content. Current plans include a fully-integrated admin which spins up when you run jekyll serve and provides a friendly web interface for creating and editing your content. The server and web interface will speak a common HTTP interface so either piece could be switched out for, e.g. a server which writes directly to a repository on GitHub. The strength of text files as the storage medium for content has been part of Jekyll’s success. Our homepage lauds the absence of a traditional SQL database when using Jekyll – your content should be what demands your time, not pesky database downtime. Unfortunately, understanding of the structure of a Jekyll site takes some work, enough that for some users, it’s prohibitive to using Jekyll to accomplish their publishing goals. Mert and Ankur both applied to take on this challenge and agreed to split the project, one taking on the web interface and the other taking on the backend. We’re very excited to see a fully-functional CMS for Jekyll at the end of the summer produced by these excellent community members, and we hope you’ll join us in cheering them on and sharing our gratitude for all their hard work. Thanks, as always, for being part of such a wonderful community that made this all possible. I’m honored to work with each of you to create something folks all around the globe find a joy to use. I look forward to our continued work to move Jekyll forward. As always, Happy Jekylling!"
author = "parkr"
year_published = 2016
year_updated = 2016
