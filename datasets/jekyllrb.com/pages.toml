["https://jekyllrb.com/docs/deployment/third-party"]
title = "3rd Party | Jekyll • Simple, blog-aware, static sites"
description = "AWS Amplify"
full_description = "Improve this page 3rd Party AWS Amplify The AWS Amplify Console provides continuous deployment and hosting for modern web apps (single page apps and static site generators). Continuous deployment allows developers to deploy updates to their web app on every code commit to their Git repository. Hosting includes features such as globally available CDNs, 1-click custom domain setup + HTTPS, feature branch deployments, redirects, trailing slashes, and password protection. Read this step-by-step guide to deploy and host your Jekyll site on AWS Amplify. CloudCannon CloudCannon has everything you need to build, host and update Jekyll websites. Take advantage of our global CDN, automated SSL, continuous deployment and more. GitHub Pages Sites on GitHub Pages are powered by Jekyll behind the scenes, so if you’re looking for a zero-hassle, zero-cost solution, GitHub Pages are a great way to host your Jekyll-powered website for free. GitLab Pages GitLab Pages offers free hosting with custom domains. Get started with Jekyll and a fully customizable pipeline. KeyCDN KeyCDN accelerates Jekyll-powered websites with a wide range of other features such as real time image processing including WebP transformation. The Jekyll hosting tutorial provides various options to supercharge Jekyll sites with just a few steps. It combines best flexibility and excellent performance. Kickster Use Kickster for automated deploys to GitHub Pages when using unsupported plugins on GitHub Pages. Kickster provides a basic Jekyll project setup packed with web best practices and useful optimization tools increasing your overall project quality. Kickster ships with automated and worry-free deployment scripts for GitHub Pages. Install the Kickster gem and you are good to go. More documentation can be found here. If you do not want to use the gem or start a new project you can just copy paste the deployment scripts for Travis CI or Circle CI. Netlify Netlify provides Global CDN, Continuous Deployment, one click HTTPS and much more, providing developers a robust toolset for modern web projects, without added complexity. Netlify supports custom plugins for Jekyll and has a free plan for open source projects. Read this Jekyll step-by-step guide to setup your Jekyll site on Netlify. Render Render provides zero config continuous deployment for static sites. The service is free under 100GB monthly bandwidth. Hostman Hostman allows you to host websites for free with no configurations. Read this guide to deploy your Jekyll site on Hostman. Static Publisher Static Publisher is another automated deployment option with a server listening for webhook posts, though it’s not tied to GitHub specifically. It has a one-click deploy to Heroku, it can watch multiple projects from one server, it has an easy to user admin interface and can publish to either S3 or to a git repository (e.g. gh-pages). Vercel Vercel provides zero config continuous deployment, HTTPS Custom domains, high performance smart CDN, you get instant static deploy for free. 21YunBox 21YunBox provides blazing fast Chinese CDN, Continuous Deployment, one click HTTPS and much more, providing developers a hassle-free solution to launch their web projects in China. Read this Jekyll step-by-step guide to deploy your Jekyll site on 21YunBox. Layer0 Layer0 is an all-in-one platform to develop, deploy, preview, experiment on, monitor, and run your headless frontend. It is focused on large, dynamic websites and best-in-class performance through EdgeJS (a JavaScript-based Content Delivery Network), predictive prefetching, and performance monitoring. Layer0 offers a free tier. Get started in just a few minutes by following Layer0’s guide to deploying Jekyll. Kinsta Application Hosting Kinsta Application Hosting is a Cloud Platform designed to help your company and dev teams ship web projects faster and more efficiently. You can host your apps, databases, and sites all in one place. Easily connect with GitHub and automate deployments and get 24/7 support for all your favorite languages and frameworks. Read this guide to learn how to deploy Jekyll site on Kinsta."
