full_description = "Jekyll 2.2.0 Released Permalink release 29 Jul 2014 parkr Jekyll 2.2.0 contains a few key updates: A warning will now fire if you specify a layout in any of your pages or posts that doesn’t exist. Certain Pygments options are now whitelisted in safe mode Categories in a post’s path are now respected (i.e. folders in _posts will now work properly). As always, a full list of the updates are on the history page. Happy Jekylling! Jekyll 2.2.0 contains a few key updates: A warning will now fire if you specify a layout in any of your pages or posts that doesn’t exist. Certain Pygments options are now whitelisted in safe mode Categories in a post’s path are now respected (i.e. folders in _posts will now work properly). As always, a full list of the updates are on the history page. Happy Jekylling!"
