["https://jekyllrb.com/tutorials/convert-site-to-jekyll"]
title = "Convert an HTML site to Jekyll | Jekyll • Simple, blog-aware, static sites"
description = "In this example, the content from a Markdown document document.md that specifies layout: docs gets pushed into the {{ content }} tag of the layout file docs.html. Because the docs layout itself specifies layout: page, the content from docs.html gets pushed into the {{ content }} tag in the layout file page.html. Finally because the page layout specifies layout: default, the content from page.html gets pushed into the {{ content }} tag of the layout file default.html."
full_description = '''Improve this page Convert an HTML site to Jekyll 10 February 2017 tomjoht If you’re looking for themes for your Jekyll site, you don’t have to restrict yourself to existing Jekyll themes. It’s pretty easy to convert almost any static HTML files into a Jekyll website. In many ways, any site that is currently a static site is already a Jekyll website. Jekyll just allows you to automate parts of the site (like inserting pages into templates, rendering lists for navigation, generating feeds and sitemaps, and more) as it processes the files. Understanding how to convert any HTML site into Jekyll templates will open your world to many more options for Jekyll themes. Instead of searching online for Jekyll themes, you can choose from the large variety of HTML templates for your site, quickly Jekyll-ize the HTML templates as you need to, and build the output with Jekyll. Although websites can have sophisticated features and controls, we’ll keep things simple in this tutorial. What is a Jekyll Website? First, let’s start with a grounding in the basics. Stripping a Jekyll site down to an extremely basic level will help clarify what happens in a Jekyll site. If you haven’t already installed the jekyll gem, install it. We’ll start with a basic Jekyll site consisting of three files: . ├── _config.yml ├── _layouts │ └── default.html └── index.md Manually create these three files in a folder called my_jekyll_site or whatever suits you the most, and place default.html inside a folder named _layouts. touch _config.yml index.md default.html mkdir _layouts && mv default.html _layouts Fire up your favorite editor, and populate the contents of the default.html and index.md files as follows: _config.yml name: My Jekyll Website _layouts/default.html <!DOCTYPE html> <html> <body> {{ content }} </body> </html> index.md --- title: My page layout: default --- # {{ page.title }} Content is written in [Markdown](https://learnxinyminutes.com/docs/markdown/). Plain text format allows you to focus on your **content**. <!-- You can use HTML elements in Markdown, such as the comment element, and they won't be affected by a markdown parser. However, if you create an HTML element in your markdown file, you cannot use markdown syntax within that element's contents. --> Now cd to my_jekyll_site and serve the site with the built-in server: cd my_jekyll_site jekyll serve If you have a Gemfile, use Bundler by typing bundle exec jekyll serve instead. When you serve the site, you get a preview URL such as http://127.0.0.1:4000/ (which is the same as http://localhost:4000/). The site’s files are built into the _site folder by default. This is a Jekyll site at the most basic functional level. Here’s what is happening: The _config.yml file contains settings that Jekyll uses as it processes your site. An empty config file will use default values for building a Jekyll site. For example, to convert Markdown to HTML, Jekyll will automatically use the kramdown Markdown filter, without any need to specify it. Jekyll looks for files with front matter tags (the two sets of dashed lines --- like those in index.md) and processes the files (populating site variables, rendering any Liquid, and converting Markdown to HTML). Jekyll pushes the content from all pages and posts into the {{ content }} variable in the layout specified (default) in the front matter tags. The processed files get written as .html files in the _site directory. You can read more about how Jekyll processes the files in order of Interpretation. With this basic understanding of how a Jekyll site works, you can convert almost any HTML theme for Jekyll. The following sections will take you through a step-by-step tutorial to do so. 1. Create a template for your default layout Find your HTML theme and save it as a default layout. If you’re converting or cloning an existing site, you can right-click the page and view the source code. For example, suppose you’re cloning your company site to create a documentation site with the same branding. Or suppose you have a personal site that you built with HTML and now want to make it a Jekyll site. Get the HTML source code for your site. Regardless of the site, do check the license and make sure you have permission to copy and use the code. Copy and paste the source code into a file called default.html. Put the default.html file inside the _layouts folder. This will be the default layout template for your pages and posts — that is, each page or post will use this layout when Jekyll builds the site. Note that in looking for templates, you want the HTML output of the template. If the template has PHP tags or other dynamic scripts, these dynamic elements will need to be converted to HTML or to Liquid. Liquid is Jekyll templating system to retrieve dynamic content. Open default.html into your browser locally to ensure the site looks and behaves like it does online. You will likely need to adjust CSS, JS, and image paths so they work. For example, if the paths were relative on the site you copied, you’ll need to either download the same assets into your Jekyll site or use absolute paths to the same assets in the cloud. (Syntax such as src="// requires a prefix such as src="http:// to work in your local browser.) Jekyll provides some filters to prepend a site URL before path. For example, you could preface your stylesheet like this: {{ "/assets/style.css" | relative_url }} The relative_url filter will prepend the baseurl value from your config file (as blog for instance) to the input. This is useful if your site is hosted at a subpath rather than at the root of the domain (for example, http://mysite.com/blog/). You can also use an absolute_url filter. This filter will prepend the url and baseurl value to the input: {{ "/assets/style.css" | absolute_url }} Again, both url and baseurl can be defined in your site’s config file, like this: url: http://mysite.com baseurl: /blog The result in the output will be http://mysite.com/blog/assets/style.css. Note that the url property of any page begins with a forward slash (/), so omit this at the end of your url or baseurl property. You don’t have to prepend filters to link paths like this. You could also use relative links across your entire site. However you decide to code the paths to your assets, make sure they render correctly. Does your local default.html page look good in your browser? Are all images, styles, and other elements showing up correctly? If so, great. Keep going. You can use this template as the layout for all your pages and posts or create as many templates as you need. In the next section, you’ll blank out the content of the layout and replace it with placeholder tags that get populated dynamically with your Jekyll pages. 2. Identify the content part of the layout In default.html, find where the page content begins (usually at h1 or h2 tags). Replace the title that appears inside these tags with {{ page.title }}. Remove the content part (keep everything else: navigation menu, sidebar, footer, etc.) and replace it with {{ content }}. Check the layout again in your browser and make sure you didn’t corrupt or alter it up by inadvertently removing a crucial div tag or other element. The only change should be to the title and page content, which are now blanked out or showing the placeholder tag. 3. Create a couple of files with front matter tags Create a couple of files (index.md and about.md) in your root directory. In your index.md file, add some front matter tags containing a title and layout property, like this: --- title: Home layout: default --- Some page content here... Create another page for testing called about.md with similar front matter tags. If you don’t specify a layout in your pages, Jekyll will simply render that page as an unstyled basic HTML page. 4. Add a configuration file Add a _config.yml file in your root directory. In _config.yml, you can optionally specify the markdown filter you want. By default, the GitHub Flavored Markdown (GFM) processor for kramdown is used. If no other filter is specified, your config file will automatically apply the following as a default setting: markdown: kramdown kramdown: input: GFM You can find additional Markdown Options in the Jekyll docs, though it’s unlikely that you’ll need them. 5. Test your pages Now run jekyll serve and toggle between your index.html and about.html pages. The default layout should load for both pages. You’ve now extracted your content out into separate files and defined a common layout for pages. You could define any number of layouts you want for pages. Then just identify the layout you want that particular page to use. For example: --- title: Sample page layout: homepage --- This page would then use the homepage.html template in the _layouts folder. You can even set default front matter tags for pages, posts, or collections in your _config.yml file so that you don’t have to specify the layout in the front matter variables. Anyways, setting defaults is beyond the scope of this tutorial, let’s get back to work. 6. Configure site variables You already configured the page title using {{ page.title }} tags. But there are more title tags to populate. Pages also have a title tag that appears in the browser tab or window. Typically you put the page title followed by the site title here. In your default.html layout, look for the title tags below your head tags: <title>ACME Website</title> Insert the following site variables: <title>{{ page.title }} | {{ site.title }}</title> Open _config.yml and add a title property for your site’s name. title: ACME Website Any properties you add in your _config.yml file are accessible through the site namespace. Similarly, any properties in your page’s front matter are accessible through the page namespace. Use dot notation after site or page to access the value. Stop your Jekyll server with Ctrl + C and restart it. Verify that the title tags are populating correctly. Every time you modify your config file, you have to restart Jekyll for the changes to take effect. When you modify other files, Jekyll automatically picks up the changes when it rebuilds. If you have other variables to populate in your site, rinse and repeat. 7. Show posts on a page It’s common to show a list of posts on the homepage. First, let’s create some posts so that we have something to showcase. Add some posts in a _posts folder following the standard YYYY-MM-DD-title.md post format: 2017-01-02-my-first-post.md 2017-01-15-my-second-post.md 2017-02-08-my-third-post.md In each post, add some basic content: --- title: My First Post layout: default --- Some sample content... Now let’s create a layout that will display the posts. Create a new file in _layouts called home.html and add the following logic: --- layout: default --- {{ content }} <ul class="myposts"> {% for post in site.posts %} <li><a href="{{ post.url }}">{{ post.title}}</a> <span class="postDate">{{ post.date | date: "%b %-d, %Y" }}</span> </li> {% endfor %} </ul> Create a file called blog.md in your root directory and specify the home layout: --- title: Blog layout: home --- In this case, contents of blog.md will be pushed into the {{ content }} tag in the home layout. Then the home layout will be pushed into the {{ content }} tag of the default layout. How layouts work When a layout specifies another layout, it means the content of the first layout will be stuffed into the {{ content }} tag of the second layout. As an analogy, think of Russian dolls that fit into each other. Each layout fits into another layout that it specifies. The following diagram shows how layouts work in Jekyll: In this example, the content from a Markdown document document.md that specifies layout: docs gets pushed into the {{ content }} tag of the layout file docs.html. Because the docs layout itself specifies layout: page, the content from docs.html gets pushed into the {{ content }} tag in the layout file page.html. Finally because the page layout specifies layout: default, the content from page.html gets pushed into the {{ content }} tag of the layout file default.html. You don’t need multiple layouts. You could just use one: default. You have options for how you design your site. In general, it’s common to define one layout for pages and another layout for posts, but for both of these layouts to inherit the default template (which usually defines the top and bottom parts of the site). In your browser, go to blog.html and see the list of posts. Note that you don’t have to use the method described here. You could have simply added the for loop to any page, such as index.md, to display these posts. But given that you may have more complex logic for other features, it can be helpful to store your logic in templates separate from the page area where you frequently type your content. At minimum, a layout should contain {{ content }}, which acts as a receiver for the content to be rendered. For loops By the way, let’s pause here to look at the for loop logic a little more closely. For loops in Liquid are one of the most commonly used Liquid tags. For loops let you iterate through content in your Jekyll site and build out a result. The for loop also has certain properties available (like first or last iteration) based on the loop’s position in the loop as well. We’ve only scratched the surface of what you can do with for loops in retrieving posts. For example, if you wanted to display posts from a specific category, you could do so by adding a categories property to your post’s front matter and then look in those categories. Further, you could limit the number of results by adding a limit property. Here’s an example: <ul class="myposts"> {% for post in site.categories.podcasts limit:3 %} <li><a href="{{ post.url }}">{{ post.title}}</a> <span class="postDate">{{ post.date | date: "%b %-d, %Y" }}</span> </li> {% endfor %} </ul> This loop would get the latest three posts that have a category called podcasts in the front matter. 8. Configure navigation Now that you’ve configured posts, let’s configure page navigation. Most websites have some navigation either in the sidebar or header area. In this tutorial, we’ll assume you’ve got a simple list of pages you want to generate. If you only have a handful of pages, you could list them by using a for loop to iterate through the site.pages object and then order them by a front matter property. Identify the part of your code where the list of pages appears. Usually this is a <ul> element with various child <li> elements. Replace the code with the following: <ul> {% assign mypages = site.pages | sort: "order" %} {% for page in mypages %} <li><a href="{{ page.url | absolute_url }}">{{ page.title }}</a></li> {% endfor %} </ul> This example assumes each page would have front matter containing both a title and order property like this: --- title: My page order: 2 --- Here the order property will define how the pages get sorted, with 1 appearing first in the list. You co'''
author = "tomjoht"
year_published = 2017
