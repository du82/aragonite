["https://jekyllrb.com/docs/configuration/sass"]
title = "Sass/SCSS Options | Jekyll • Simple, blog-aware, static sites"
description = "Jekyll comes bundled with jekyll-sass-converter plugin. By default, Jekyll will look for Sass partials in the _sass directory relative to your site’s source directory."
full_description = '''Improve this page Sass/SCSS Options Jekyll comes bundled with jekyll-sass-converter plugin. By default, Jekyll will look for Sass partials in the _sass directory relative to your site’s source directory. You can further configure the plugin by adding options to your Jekyll config under the sass attribute. See the plugin’s documentation for details and for its default values. If you see a warning in VSCode regarding @import "main";, you may ignore it as the same does not affect the functionality of the SCSS code in Jekyll. However, Jekyll 4 does not allow importing a main sass partial (_sass/main.scss) from a sass page of a same name, viz. css/main.scss. Note that directory paths specified in the sass configuration are resolved relative to your site's source, not relative to the location of the _config.yml file.'''
