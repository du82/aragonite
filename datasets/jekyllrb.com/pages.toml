description = "This is a minor release for Jekyll 2.1.0. It fixes a couple bugs and introduces fixes for a couple security-related issues."
full_description = "Jekyll 2.1.1 Released Permalink release 01 Jul 2014 parkr This is a minor release for Jekyll 2.1.0. It fixes a couple bugs and introduces fixes for a couple security-related issues. It covers two security vulnerabilities: One in the reading of data One in the layouts setting They were identified in Jekyll 1.5.1 and has been confirmed as patched in this version and the version used by GitHub Pages. If you are in the business of building Jekyll sites, please ensure you upgrade to 2.1.1 as soon as possible. For more, check out jekyll/jekyll#2563. Additionally, the dependency on Maruku has been loosened and a bug was fixed with document URLs. As always, check out the full changelog for more info! Happy Jekylling!"
