["https://jekyllrb.com/news/2018/04/19/development-update"]
title = "Jekyll 4.0 is on the Horizon! | Jekyll • Simple, blog-aware, static sites"
description = "With the release of Jekyll 3.8.0, it’s been 2 and a half years since the last major release. Jekyll 3.0.0 was released in late October of 2015! That’s a long time ago, and we’ve been working towards the next major release of Jekyll for a couple of months now. Here’s a small preview of what’s to come:"
full_description = "Jekyll 4.0 is on the Horizon! Permalink community 19 Apr 2018 oe With the release of Jekyll 3.8.0, it’s been 2 and a half years since the last major release. Jekyll 3.0.0 was released in late October of 2015! That’s a long time ago, and we’ve been working towards the next major release of Jekyll for a couple of months now. Here’s a small preview of what’s to come: Dropping support for Ruby 2.1 and 2.2. Both versions have reached their EOL period. Dropping Pygments as a dependency. We’re already defaulting to Rouge, and this removes the implicit Python dependency. (finally!) Making the link tag use relative URLs. This is a big breaking change, but it’s the cleaner solution. We’re open to more ideas, though. If the development cost isn’t too high, or if someone volunteers to take care of the implementation, it’s likely that your suggestion might make it into Jekyll 4.0. Head over to this issue for more details. Some interesting topics might be improving Internationalization support in Jekyll, creating convenience Liquid tags, et cetera. That being said, the development period of version 4.0 begins now. This means a couple of things: New features will only be implemented in Jekyll 4.0. There will be no 3.9.0 or the like. Same with bug fixes, unless they concern something introduced in Jekyll 3.7 or 3.8, in which case we will backport the fixes and release a patch version. Now is a great time to finally take on the feature you’ve wanted to see in Jekyll for ages! Just open an issue or experiment with the code to get going! As for a release date, we’re currently aiming for late summer, around September or so. However, keep in mind that this project is purely volunteer-run, and as such, delays might occur and we might not hit that release date. Finally, this is a great time for newcomers to open-source to make their first contribution. We’ll be doing our best to mark recommended contributions and create newcomer-friendly issues, as well as to provide mentoring throughout the contribution process (although we’d like to think that we’re already pretty proficient at that). So if you’ve always been hesitant about contributing to a large open-source project, Jekyll is a good place to start! Happy Jekylling!"
