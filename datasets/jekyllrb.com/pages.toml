title = "Jekyll 3.0 Released | Jekyll • Simple, blog-aware, static sites"
description = "The much-anticipated Jekyll 3.0 has been released! Key changes:"
full_description = "Jekyll 3.0 Released Permalink release 26 Oct 2015 parkr The much-anticipated Jekyll 3.0 has been released! Key changes: Incremental regeneration (experimental, enable with --incremental) Liquid profiler (add --profile to a build or serve) Hook plugin API (no more monkey-patching!) Dependencies reduced from 14 to 8, none contain C extensions. We’re hoping to reduce this even more in the future. Changed version support: no support for Ruby 1.9.3, added basic JRuby support. Better Windows support. Extension-less URLs site.collections is an array of collections, thus: collection[0] becomes collection.label collection[1] becomes collection Default highlighter is now Rouge instead of Pygments Lots of performance improvements … and lots more! We also added a Code of Conduct to encourage a happier, nicer community where contributions and discussion is protected from negative behaviour. A huge shout-out to the amazing Jekyll Core Team members Jordon Bedwell, Alfred Xing, and Matt Rogers for all their hard work in making Jekyll 3 the best release yet. We also added Jekyll Talk, managed solely by Jordon, which offers a modern forum experience for Jekyllers across the globe to talk and learn about Jekyll! As always, check out the full history for more details. Our contributors are the core of what makes Jekyll great! Many thanks to the 132 contributors who made this release possible (in alphabetical order): AJ Acevedo, Adam Richeimer, Alan Scherger, Alfred Xing, Anatol Broder, Andrew Dunning, Anna Debenham, Anton, Arne Gockeln, Arthur Hammer, Arthur Neves, BRAVO, Ben Balter, Bernardo Dias, BigBlueHat, Brandon Mathis, Bruce Smith, Cai⚡️, Carlos Matallín, ChaYoung You, Christian Vuerings, Cory Simmons, David Herman, David Silva Smith, David Smith, David Wales, David Williamson, DigitalSparky, Dimitri König, Dominik, Eduardo Boucas, Eduardo Bouças, Eduardo Bouças, Erlend Sogge Heggen, Eugene Pirogov, Ezmyrelda Andrade, Fabian Rodriguez, Fabian Tamp, Fabio Nie