["https://jekyllrb.com/docs/configuration/default"]
title = "Default Configuration | Jekyll • Simple, blog-aware, static sites"
description = "Jekyll runs with the following configuration options by default. Alternative settings for these options can be explicitly specified in the configuration file or on the command-line."
full_description = 'Improve this page Default Configuration Jekyll runs with the following configuration options by default. Alternative settings for these options can be explicitly specified in the configuration file or on the command-line. Be aware of directory paths In general, make directory path values in configuration keys like plugins_dir relative to the current working directory, not the site source. The sass configuration key is an exception, where values must be relative to the site source. # Where things are source : . destination : ./_site collections_dir : . plugins_dir : _plugins # takes an array of strings and loads plugins in that order layouts_dir : _layouts data_dir : _data includes_dir : _includes sass: sass_dir: _sass collections: posts: output : true # Handling Reading safe : false include : [".htaccess"] exclude : ["Gemfile", "Gemfile.lock", "node_modules", "vendor/bundle/", "vendor/cache/", "vendor/gems/", "vendor/ruby/"] keep_files : [".git", ".svn"] encoding : "utf-8" markdown_ext : "markdown,mkdown,mkdn,mkd,md" strict_front_matter : false # Filtering Content show_drafts : null limit_posts : 0 future : false unpublished : false # Plugins whitelist : [] plugins : [] # Conversion markdown : kramdown highlighter : rouge lsi : false excerpt_separator : "\n\n" incremental : false # Serving detach : false port : 4000 host : 127.0.0.1 baseurl : "" # does not include hostname show_dir_listing : false # Outputting permalink : date paginate_path : /page:num timezone : null quiet : false verbose : false defaults : [] liquid: error_mode : warn strict_filters : false strict_variables : false # Markdown Processors kramdown: auto_ids : true entity_output : as_char toc_levels : [1, 2, 3, 4, 5, 6] smart_quotes : lsquo,rsquo,ldquo,rdquo input : GFM hard_wrap : false footnote_nr : 1 show_warnings : false'
