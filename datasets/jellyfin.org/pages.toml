full_description = "TestingTesting Jellyfin ServerOn this pageTesting Jellyfin Server Backups!Unstable often makes irreversible changes to existing Jellyfin setups. Please make regular backups of Jellyfin files. Read More Weekly Unstable Build​ The weekly unstable builds are generated every Monday 5:00 AM UTC. Testing using the Unstable builds can not only test Jellyfin itself, but also help identify issues with packaging. To install them, navigate to our downloads page and choose Server, choose your platform, then choose Unstable. The choices have to be made in this order. After choosing, scroll down and find the installation method you would like to use. Follow the steps in the Upgrade & Downgrade documentation for more detailed instructions. Testing from Master Branch​ The Master branch of the server can be used to obtain the absolute bleeding edge. This is only intended for developers. Further info can be found in the packaging repository itself and in the contributing docs.Edit this page"
