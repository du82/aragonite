title = "Intel GPU | Jellyfin"
description = "This tutorial guides you on setting up full video hardware acceleration on Intel integrated GPUs and ARC discrete GPUs via QSV and VA-API. If you are on macOS, please use VideoToolbox instead."
full_description = '''AdministrationHardware AccelerationIntel GPUOn this pageHWA Tutorial On Intel GPU This tutorial guides you on setting up full video hardware acceleration on Intel integrated GPUs and ARC discrete GPUs via QSV and VA-API. If you are on macOS, please use VideoToolbox instead. Acceleration Methods​ Hardware accelerated transcoding is supported on most Intel GPUs. On Windows QSV is the only available method. On Linux there are two methods: QSV - Preferred on mainstream GPUs, for better performance VA-API - Required by pre-Broadwell legacy GPUs, for compatibility noteLinux VA-API supports nearly all Intel GPUs.Linux QSV supported platforms are limited to Broadwell (5th gen Core) and newer. The QSV interface provided by Intel OneVPL / MediaSDK is a high-level implementation based on Linux VA-API and Windows DXVA/D3D11VA providing better performance and more fine-tuning options on supported platforms. QSV can be used together with VA-API and DXVA/D3D11VA for a more flexible hybrid transcoding pipeline. cautionICL (Ice Lake) / JSL (Jasper Lake) / EHL (Elkhart Lake) and older generations are losing support for QSV on Linux, since the MediaSDK runtime has been deprecated by Intel, and may stop working in a few years, by which point you will have to switch to VA-API. Please use newer hardware if you are shopping for hardware.Please read deprecation notice and legacy platforms support for more info. note Unlike NVIDIA NVENC, there is no concurrent encoding sessions limit on Intel iGPU and ARC dGPU. QSV and VA-API support headless server on both Windows and Linux, which means a connected monitor is not required. Tone-mapping Methods​ Hardware accelerated HDR/DV to SDR tone-mapping is supported on all Intel GPUs that have HEVC 10-bit decoding. There are two different methods that can be used on Windows and/or Linux. Pros and cons are listed below: OpenCL Pros - Supports Dolby Vision P5, detailed fine-tuning options, widely supported hardware. Cons - The OpenCL runtime sometimes need to be manually installed on Linux. QSV VPP Pros - Lower power consumption, realized by Intel fixed-function LUT hardware. Cons - Poor tuning options, limited supported GPU models, currently only available on Linux. noteThe Prefer OS native DXVA or VA-API hardware decoders feature toggles between the native decoders and the QSV decoders. Dolby Vision support requires that this option be checked. Select GPU Hardware​ For beginners, please refer to the Hardware Selection Guide for tips on selecting hardware. For expert users, please continue reading this section. cautionDo not use models of Intel processors ending with "F" - those do not have an integrated GPU. Quick Sync Video support can be checked via the Intel ark website prior to buying a new GPU suitable for hardware acceleration. Transcode H.264​ AVC / H.264 8-bit is still widely used due to its excellent compatibility. All Intel GPUs that support QSV can decode and encode it. Decoding & Encoding H.264 8-bit - Any Intel GPU that supports Quick Sync Video (QSV) Transcode HEVC​ HEVC / H.265 remains the first choice for storing 4K 10-bit, HDR and Dolby Vision video. It has mature software encoding support thanks to x265, as well as the widely implemented hardware encoding support in most GPUs released after 2016. Intel GPUs are no exception: Decoding & Encoding HEVC 8-bit - Gen 9 Skylake (6th Gen Core) and newer Decoding & Encoding HEVC 10-bit - Gen 9.5 Kaby Lake (7th Gen Core), Apollo Lake, Gemini Lake (Pentium and Celeron) and newer noteNote that the 6th Gen Core with HD 5xx iGPUs lacks 10-bit support, it's best to choose 7th Gen and newer processors, which usually have HD / UHD 6xx series iGPUs. Transcode AV1​ AV1 is a royalty-free, future-proof video codec. It saves a lot of storage space and network bandwidth due to smaller file size. The downside is that decoding and encoding is very demanding on the CPU. Hardware acceleration makes it possible to transcode AV1 streams on the fly. AV1 encoding is supported in Jellyfin 10.9 and newer. Intel added support for AV1 acceleration in their latest GPUs: Decoding AV1 8/10-bit - Gen 12 Tiger Lake (11th Gen Core) and newer Encoding AV1 8/10-bit - Gen 12.5 DG2 / ARC A-series, Gen 12.7 Meteor Lake (14th Gen Core Mobile / 1st Gen Core Ultra) and newer noteNote that Jasper Lake and Elkhart Lake processors are 10th Gen Pentium/Celeron/Atom, which don't have AV1 acceleration. Transcode Other Codecs​ Please refer to these links: Intel Media Capabilities documentation Linux media-driver/iHD capabilities Linux vaapi-driver/i965 capabilities Speed And Quality​ Intel improves the speed and video quality of its fixed-function encoders between each generation of graphics architectures. They can be divided into 4 tiers by their performance： Entry-Level - HD / UHD 600, 605 and 61x tipThese iGPUs usually come from mini PC boxes or NASes and they can transcode HEVC 10-bit and apply tone-mapping filters. You can't expect much due to performance and power constraints, but it's still adequate for personal use. Mainstream - HD / UHD 620, 630, Iris 640, 655 and the Gen 11 graphics tipThese iGPUs have more computing power than entry-level, which makes them capable of multiple 4k HDR HEVC 10-bit transcoding at the same time. Note that the Gen 11 graphics have a slightly improved encoder quality over Gen 9. High-Performance - UHD 7xx series and Iris Xe graphics tipThese GPUs use Gen 12 XeLP architecture with AV1 hardware decoding, significantly improved video quality and speed. Models like the UHD 770 and Iris Xe feature a second MFX video engine, which enhances its concurrent transcoding capabilities. Hardcore - ARC A & B-series discrete and integrated GPU tipARC A-series GPUs use Gen 12.5 XeHPG architecture, which continues to improve on the basis of XeLP, supports AV1 hardware encoding and improved H.264 and HEVC encoding. This makes it competitive with the medium preset of the x264 and x265 software encoders. All ARC A-series GPU models come with two MFX video engines. The encoding quality on the ARC B-series is similar to its predecessor, but with slightly improved encoding speeds. OneVPL And MediaSDK​ OneVPL is a new QSV implementation to supersede MediaSDK. Both provide the Quick Sync Video (QSV) runtime. Intel supports OneVPL on Gen 12+ graphics (11th Gen Core and newer processor, namely Tiger Lake & Rocket Lake). note The most notable difference is that OneVPL supports the new AV1 hardware encoder on ARC GPU. FFmpeg 6.0 enables OneVPL. This process is seamless for the end users. ARC GPU Support​ Jellyfin server support Intel ARC Alchemist/A-series discrete GPU on both Windows and Linux 6.2+. For using ARC Battlemage/B-series discrete GPU on Linux, kernel version 6.12+ is required. Windows is also supported, just install the GPU driver. You only need to follow the Windows Setups and Linux Setups to configure and verify it. tip Resizable-BAR is not mandatory for hardware acceleration, but it can affect the graphics performance. It's recommended to enable the Resizable-BAR if the processor, motherboard and BIOS support it. ASPM should be enabled in the BIOS if supported. This greatly reduces the idle power consumption of the ARC GPU. Low-Power encoding is used by default on ARC GPUs. GuC & HuC firmware can be missing on older distros, you might need to manually download it from the Kernel firmware git. Old kernel build configs may not have the MEI modules enabled, which are necessary for using ARC GPU on Linux. Starting from ARC Battlemage/B-series discrete GPUs, Intel has enabled the xe kernel driver by default on new GPUs (Xe-2 and newer architectures) to replace the long-standing i915 kernel driver. Low-power encoding, GuC and HuC firmware are automatically enabled, and users should not refer to settings like i915.enable_guc=xxx, which are no longer relevant. Windows Setups​ Windows 10 64-bit and newer is recommeded. QSV is not available on Windows Docker and WSL/WSL2. Known Issues And Limitations On Windows​ Please refer to this section for known issues and limitations Configure On Windows Host​ Wipe the old driver with DDU if you upgraded from a pre-6th Gen Intel processor without doing a fresh installation. Clean install the latest EXE or INF driver from Intel download center. Don't allow the GPU to be preempted by the Windows Remote desktop session. Type gpedit.msc in Win+R shortcut key dialog and run to open the "Local Group Policy Editor". Navigate in the left tree [Computer Configuration > Administrative Templates > Windows Components] Here you can find [Remote Desktop Services > Remote Desktop Session Host > Remote Session Environment] On the right side, double click the [Use hardware graphics adapters for all Remote Desktop Services sessions] Set [Disabled] in the pop-up dialog window and click [OK], reboot the system. Enable QSV in Jellyfin and uncheck the unsupported codecs. Verify On Windows​ Play a video in the Jellyfin web client and trigger a video transcoding by setting a lower resolution or bitrate. Open the "Task Manager" and navigate to the GPU page. Check the occupancy of the engines as follows. noteDuplicate engine names indicate the GPU may have multiple MFX video engines. 3D - 2D/3D engine, QSV VPP or GPGPU workload Copy - Blitter/Copy engine workload Video Decode - QSV decoder or encoder workload Video Processing - QSV VPP processor workload Compute - GPGPU or QSV VPP workload (only available on ARC / DG2+) Linux Setups​ A 64-bit Linux distribution is required. The supported GPU varies by kernel and firmware versions. Known Issues And Limitations On Linux​ Please refer to this section for known issues and limitations Configure On Linux Host​ Debian And Ubuntu Linux​ The jellyfin-ffmpeg* deb package comes with all necessary user mode Intel media drivers except OpenCL (see below). noteRoot permission is required. Assuming you have added the jellyfin repository to your apt source list and installed the jellyfin-server and jellyfin-web, if you choose to use vanilla ffmpeg, instead of jellyfin-ffmpeg, you will need to install the following intel packages. noteIf you are running Debian, you will need to add "non-free" to your apt config. Install the jellyfin-ffmpeg7 package. Remove the deprecated jellyfin meta package if it breaks the dependencies: sudo apt update && sudo apt install -y jellyfin-ffmpeg7 Make sure at least one renderD* device exists in /dev/dri. Otherwise upgrade your kernel or enable the iGPU in the BIOS. noteNote the permissions and group available to write to it, in this case it is render: $ ls -l /dev/dritotal 0drwxr-xr-x 2 root root 120 Mar 5 05:15 by-pathcrw-rw----+ 1 root video 226, 0 Mar 5 05:15 card0crw-rw----+ 1 root video 226, 1 Mar 5 05:15 card1crw-rw----+ 1 root render 226, 128 Mar 5 05:15 renderD128crw-rw----+ 1 root render 226, 129 Mar 5 05:15 renderD129 Add the jellyfin user to the render group, then restart jellyfin service: noteOn some releases, the group may be video or input instead of render. sudo usermod -aG render jellyfinsudo systemctl restart jellyfin Check the version of intel-opencl-icd thats the Linux distro provides: $ apt policy intel-opencl-icdintel-opencl-icd: Installed: (none) Candidate: 22.14.22890-1... If the version is newer than 22.xx.xxxxx just install it. For the latest products like N95/N100 and Arc A380, support is provided in 23.xx.xxxxx and newer. Otherwise install from Intel compute-runtime repository. sudo apt install -y intel-opencl-icd Check the supported QSV / VA-API codecs: note iHD driver indicates support for the QSV and VA-API interfaces. i965 driver indicates only support for the VA-API interface, which should only be used on pre-Broadwell platforms. sudo /usr/lib/jellyfin-ffmpeg/vainfo --display drm --device /dev/dri/renderD128libva info: VA-API version 1.17.0libva info: Trying to open /usr/lib/jellyfin-ffmpeg/lib/dri/iHD_drv_video.solibva info: Found init function __vaDriverInit_1_17libva info: va_openDriver() returns 0Trying display: drmvainfo: VA-API version: 1.17 (libva 2.17.0)vainfo: Driver version: Intel iHD driver for Intel(R) Gen Graphics - 23.1.2 (xxxxxxx)vainfo: Supported profile and entrypoints... Check the OpenCL runtime status: sudo /usr/lib/jellyfin-ffmpeg/ffmpeg -v verbose -init_hw_device vaapi=va:/dev/dri/renderD128 -init_hw_device opencl@va[AVHWDeviceContext @ 0x55cc8ac21a80] 0.0: Intel(R) OpenCL HD Graphics / Intel(R) Iris(R) Xe Graphics [0x9a49][AVHWDeviceContext @ 0x55cc8ac21a80] Intel QSV to OpenCL mapping function found (clCreateFromVA_APIMediaSurfaceINTEL).[AVHWDeviceContext @ 0x55cc8ac21a80] Intel QSV in OpenCL acquire function found (clEnqueueAcquireVA_APIMediaSurfacesINTEL).[AVHWDeviceContext @ 0x55cc8ac21a80] Intel QSV in OpenCL release function found (clEnqueueReleaseVA_APIMediaSurfacesINTEL).... If you wish to use the second GPU, change renderD128 to renderD129 in the Jellyfin dashboard. Enable QSV or VA-API in Jellyfin and uncheck the unsupported codecs. Linux Mint​ Linux Mint uses Ubuntu as its package base. You can follow the configuration steps of Debian And Ubuntu Linux but install all Jellyfin packages jellyfin-server, jellyfin-web and jellyfin-ffmpeg7 manually from the Jellyfin Server Releases Page. Also make sure you choose the correct codename by following the official version maps. Arch Linux​ noteRoot permission is required. Install the Archlinux/extra jellyfin-ffmpeg package: sudo pacman -Syu jellyfin-ffmpeg User mode Intel media drivers and the OpenCL runtime are required to be manually installed for enabling QSV / VA-API: intel-media-driver intel-media-sdk onevpl-intel-gpu intel-compute-runtime libva-intel-driver Check the QSV / VA-API codecs and the OpenCL runtime status: sudo pacman -Syu libva-utilssudo vainfo --display drm --device /dev/dri/renderD128sudo /usr/lib/jellyfin-ffmpeg/ffmpeg -v verbose -init_hw_device vaapi=va:/dev/dri/renderD128 -init_hw_device opencl@va Check to the remaining parts of Debian And Ubuntu Linux. Other Distros​ We provide portable jellyfin-ffmpeg binaries for distros that don't have a regular maintainer. They can be downloaded from one of these links: Jellyfin repository Releases · jellyfin/jellyfin-ffmpeg · GitHub noteMinimum requirements for glibc and Linux versions: x86_64 / amd64 - glibc >= 2.28, Linux >= 4.18 (most distros released in 2018 and later) Extract and install it to the correct path, change the FFmpeg path in the Jellyfin dashboard to match it: noteRoot permission is required. cd ~/mkdir -p jellyfin-ffmpegwget https://repo.jellyfin.org/releases/ffmpeg/<VERSION>/jellyfin-ffmpeg_<VERSION>_portable_linux64-gpl.tar.xztar -xvf jellyfin-ffmpeg_<VERSION>_portable_linux64-gpl.tar.xz -C jellyfin-ffmpegsudo mv jellyfin-ffmpeg /usr/libsudo ldd -v /usr/lib/jellyfin-ffmpeg/ffmpeg Install other necessary Intel driver packages and their dependencies that contain these key words: Intel media driver - iHD Intel vaapi driver - i965 Intel media sdk - MFX Intel oneVPL-intel-gpu - VPL Intel compute runtime - OpenC'''
