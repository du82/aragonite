["https://jellyfin.org/posts/android-v2.1.0"]
title = "Android v2.1.0 - Jellyfin in your car! | Jellyfin"
description = "Listen to your music while driving with the new Android update"
full_description = '''Android v2.1.0 - Jellyfin in your car!October 25, 2020 · 3 min readNiels van VelzenCore Team, Android LeadJellyfin for Android version 2.1 is here with support for Android Auto. A new version of the Android app: version 2.1 has just been released! This update contains some quality of life improvements, some bugfixes and new features. It's been only a few weeks since 2.0 but we couldn't wait to bring these new exiting changes to you. Let's start with the most awesome feature. Android Auto​ Starting with this update we now support playing music in cars. This change was contributed by @Spacetech and we are excited to release it. Right now it supports browsing your music library in multiple categories: latest, albums, artists, songs and genres. It allows shuffling your albums and shows thumbnails when available. Note: since we do not have offline-support at the moment all music playback needs an active network connection to work. Be aware this may cause additional charges in your mobile plan. Connectivity issues​ Some users reported issues when connecting to their server. We've made some improvements to fix those problems: When your server uses an outdated version a warning is shown. If the webui fails to load we now show a proper error allowing you to change the server address. Users with self-signed certificates should be able to use the app again. And lastly, when your device name includes special characters they are now removed to fix the "endless loading" issue. Playback improvements​ The native video player (ExoPlayer) now supports zooming using gestures so you can remove the black bars from the video. We made some changes to which audio codecs are supported to prevent unnecessary transcoding. We also made some big changes to the structure of the app to fix an issue where you weren't able to return to the app after leaving Picture-in-Picture mode. There is a new option in the settings to select which external player to use. The listed players should also report playback status back to Jellyfin to track what you watch and allow the app to resume playback. Issues with subtitles (especially external subtitles) should now be less common. F-Droid​ We have added the required metadata for F-Droid to our repository. We are currently working with the F-Droid team to get the app in their repository - we will post an additional announcement when this is ready. Release Notes​ Full release notes available on GitHub. Download Now​ Direct downloads are always available from our repository. Contributors​ We are grateful to all contributors this release: @Maxr1998 - Sponsor @nielsvanvelzen - Sponsor @vitorsemeano @ferferga - Sponsor @CarlosOlivo @Spacetech @h1dden-da3m0n @IzzySoft'''
