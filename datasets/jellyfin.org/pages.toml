["https://jellyfin.org/docs/general/server/metadata/nfo"]
title = "Local .nfo metadata | Jellyfin"
description = "Jellyfin can read and write local .nfo metadata files to import or export metadata from and to other programs and tools."
full_description = '''Server GuideMetadataLocal .nfo metadataOn this pageLocal .nfo metadata Jellyfin can read and write local .nfo metadata files to import or export metadata from and to other programs and tools. Naming .nfo files​ In order for Jellyfin to find the .nfo files, you have to name them correctly. The table below will help you name them. Media TypeFilenameMoviesmovie.nfo, VIDEO_TS.nfo or for DVDs <filename of the movie>.nfoTV Showstvshow.nfoTV Seasonseason.nfoEpisode<filename of the episode>.nfoMusic Artistartist.nfoMusic Albumalbum.nfoMusic Videosee Movies Reading metadata from .nfo files​ Jellyfin supports a common set of .nfo metadata tags. The following list may not be exhaustive. cautionIf there are multiple tags that map to the same internal Jellyfin data like plot and review, the last of these tags in the file will have priority. noteIt's currently not possible to disable .nfo metadata. Local metadata will always be fetched and has priority over remote metadata providers like TMDb. noteUser data importing is only possible for a single user. This user can be set in the .nfo settings. TagNotenametitlesame as namelocaltitlesame as namedateaddedoriginaltitlesortnamecriticratingsorttitleplotbiographysame as plotreviewsame as plotlanguagewatchedplease see the note about user dataplaycountplease see the note about user datalastplayedplease see the note about user datacountrycodelockedfieldstaglinecountrympaacustomratingruntimeaspectratiolockdatastudiomultiple tags alloweddirectormultiple tags allowedcreditsmultiple tags allowedwritermultiple tags allowedactormultiple tags allowedtrailerkodi formatdisplayorderyearratingsame as customratingratingsmultiple child tags allowed; name attribute of each tag will specify wheter the rating is critics or community ratingairedformedpremieredreleasedateenddategenremultiple tags allowedtagmultiple tags allowedstylemultiple tags allowedfileinfouniqueidtype attribute specifies id providerthumbplease see the section about imagesfanartplease see the section about images Provider id tags are supported as well if they follow the scheme: <PROVIDER_NAME+ id>. You can also use your .nfo files to help Jellyfin identify your media. You can just enter an IMDb, TMDb or TVDb link, to link the media to the specific provider id. For more information about .nfo files, please also see the Kodi wiki. Writing metadata to .nfo files​ Jellyfin can write metadata to .nfo files. To enable this option, select the "Nfo saver" in the settings of you library. While writing .nfo files, the following tags are supported for saving: .nfo tagNotetitleidIMDb id for moves, TVDb id for tv shows,originaltitleseasonnumberonly for tv show seasonsshowtitleonly for tv show episodesepisodeonly for tv show episodeseasononly for tv show episodeairedonly for tv show episodeairsafter_seasononly for tv show episodeairsbefore_episodeonly for tv show episodeairsbefore_seasononly for tv show episodedisplayepisodeonly for tv show episode; which episode this special airs beforedisplayseasononly for tv show episode; season the special aired indirectornew tag for each directorwriternew tag for each writercreditsnew tag for each credittrailerYouTube URL in the Kodi format plugin://plugin.video.youtube/?action=play_video&videoid=<Youtube Video ID>ratingyearsorttitlempaaaspectratiodateaddedin UTCcollectionnumberTMDb collection idsetcollection name; only for moviesimdb_idonly for TV showsimdbidfor all other media typestvdbididmbidtmdbidlanguagecountrycodeformedonly for music artistspremieredenddatereleasedatecriticratingruntimecountrynew tag for each production countrygenrenew tag for each genrestudionew tag for each studiodisbandedonly for music artistsaudiodbartistidonly for musicaudiodbalbumidonly forzap2itidonly for tv showsmusicbrainzalbumidonly for musicmusicbrainzalbumartistidonly for musicmusicbrainzartistidonly for musicmusicbrainzreleasegroupidonly for musictvrageidartonly if save image paths is enabled in the nfo settings; backdrops with child element fanart, posters with the tag poster Additional provider ids are supported as well. They will be exported with the tag <providernameid>. Image paths and URLs in .nfo files​ There are some small caveats to keep in mind when using .nfo files for your images. Jellyfin supports only one image for each artwork type. This means that only the first thumb tag for each artwork type is used. Artwork defined in .nfo files with local paths or URLs have priority over remote image providers and images in the media folders. Edit this page'''
year_published = 2025
