["https://jellyfin.org/docs/general/clients/kodi"]
title = "Kodi | Jellyfin"
description = "Add-on Repository"
full_description = '''ClientsKodiOn this pageKodi Add-on Repository​ There are two different Kodi add-ons that serve slightly different use cases. Jellyfin for Kodi - This add-on syncs metadata from selected Jellyfin libraries into the local Kodi database. This has the effect of making interacting with it feel very much like vanilla Kodi with local media (shows up under Movies/TV Shows on the home screen by default, virtually no delay, etc). However, it also tends to consume the database and not share well, so if you have local media or something else that interacts with the database directly, you will have conflicts and it will not be happy. The sync process can take some extra time on Kodi startup if you do not leave it running 24/7, but it is mostly in the background while Kodi is running. JellyCon - Behaves more like a standard Kodi streaming add-on. Media is accessed primarily by going through the Add-ons -> JellyCon menu, however you can set up menu options to link to it and show info on the home screen. It also allows easier switching between multiple Jellyfin servers or users since it doesn't have to rely on syncing all the metadata down. By not having metadata synced, it has to request info from the server which can take a bit more time when you are browsing (typically only a second or two in my testing), but you don't have to wait for the database to sync or keep it up to date. Install Add-on Repository​ The most convenient install method of our Jellyfin add-ons is to use the official Kodi Jellyfin Repository. Using this repository allows for easy install of our add-ons, as well as automatically keeping the add-ons up to date with the latest version. Any other Jellyfin related add-ons that may be built in the future will also be available here. The installation method for the repository varies depending on what kind of device you're using, outlined below. General Use Devices (PCs and Tablets)​ Download the repository installer found here. It will be saved as repository.jellyfin.kodi.zip Install the Jellyfin repository. Open Kodi, go to the settings menu, and navigate to "Add-on Browser" Select "Install from Zip File" If prompted, enter settings and enable "Unknown Sources", then go back to the Add-on Browser Select the newly downloaded file and it will be installed "Embedded" Devices (Android TV, Firestick, and other TV Boxes)​ Open Kodi, go to the settings menu, and navigate to "File manager" Select "Add source" In the text box, enter https://kodi.jellyfin.org Enter a name for the data source, such as "Jellyfin Repo" and select Ok From the settings menu, navigate to "Add-on Browser" Select "Install from Zip File" If prompted, enter settings and enable "Unknown Sources", then go back to the Add-on Browser Select the data source you just added Install repository.jellyfin.kodi.zip Jellyfin for Kodi​ tipIt is highly recommended to install the Kodi Sync Queue plugin into the Jellyfin server as well. This will keep your media libraries up to date without waiting for a periodic re-sync from Kodi. cautionRemote Kodi databases, like MySQL, are not supported. A local SQLite database is required (this is the default). Jellyfin for Kodi Overview​ This add-on syncs metadata from selected Jellyfin libraries into the local Kodi database. This has the effect of making interacting with it feel very much like vanilla Kodi with local media (shows up under Movies/TV Shows on the home screen by default, virtually no delay, etc). However, it also tends to consume the database and not share well, so if you have local media or something else that interacts with the database directly, you will have conflicts and it will not be happy. The sync process can take some extra time on Kodi startup if you do not leave it running 24/7, but it is mostly in the background while Kodi is running. Media in Kodi's database is automatically kept in sync with the server in one of several ways: Startup sync - Each time Kodi starts, it will reach out to the Kodi Sync Queue plugin in the server and request all updated media since its last check-in time (when Kodi was last shut down). Live sync - This happens while Kodi is running. When the server updates an item, it will send a notification to Kodi over a websocket connection that it has new media that needs to be updated. Install Jellyfin for Kodi Add-on​ Install Jellyfin for Kodi. From within Kodi, navigate to "Add-on Browser" Select "Install from Repository" Choose "Kodi Jellyfin Add-ons", followed by "Video Add-ons" Select the Jellyfin add-on and choose install Within a few seconds you should be prompted for your server details. If a Jellyfin server is detected on your local network, it will displayed in a dialog If a Jellyfin server is not detected on your local network, select "Manually Add Server". Enter your server info into the text field. Enter the server name or IP address and the port number (default value is 8096) Host: 192.168.1.10:8096 If using SSL and a reverse proxy, enter the full URL in the "Host" field Host: https://jellyfin.example.com Note that if you have a baseurl set, you should append that value to the end of the host field. Host: 192.168.0.10:8096/jellyfin Select user account and input password, or select "Manual Login" and fill in your user information Once you are successfully authenticated with the server, you'll be asked about which mode you'd like to use, Add-on vs Native, which are outlined below. Add-on Mode​ Add-on mode uses the Jellyfin server to translate media files from the filesystem to Kodi. This is the default setting for the add-on, and is sufficient for most use cases. It will work both on the local network and over the Internet through a reverse proxy or VPN connection. Providing network speed is sufficient, Kodi will direct play nearly all files and put little overhead on the Jellyfin server. To use Add-on mode, simply choose "Add-on" at the dialog and proceed to Library Syncing Native Mode​ cautionDo not use Native mode! Use Addon-mode instead.Jellyfin 10.10 no longer provides the shared network folder via the API, and as such native mode does not get the required information to function. Native mode accesses your media files directly from the filesystem, bypassing the Jellyfin server during playback. Native mode needs more setup and configuration, but it can, on rare occasions, lead to better performance where network bandwidth is a limitation. It requires your media to be available to the device Kodi is running on over either NFS or Samba, and therefore should only be used on a LAN or over a VPN connection. To use Native mode, first set up your libraries in Jellyfin with a remote path. cautionStarting from Jellyfin 10.9 it is no longer possible to set the shared network folder. In the Jellyfin server, navigate to the Libraries section of the admin dashboard. Select an existing library (or create a new one) Select the media folder Enter the path to your network share in the "Shared network folder" textbox Possible formats: NFS nfs://192.168.0.10:/path/to/media Samba Guest User - \\192.168.0.10\share_name Custom User (Not Recommended) - \\user:password@192.168.0.10\share_name It's more secure to use the generic Guest mapping here and specify credentials from within Kodi Mounted share If you have mounted your network share, you can reference the local mount point. This can be more performant but generally means it only works for one type of operating system, given the difference between the file systems /mnt/media (Linux) Z:\media (Windows) /Volumes/media (Mac OS) Configure libraries in Kodi Skip the initial library selection. We need to add file shares to Kodi first Within Kodi, navigate to the settings menu and select "File manager" Select "Add source" Select "Browse" and "Add network location" Create either a NFS or SMB location from the selection box and fill in the necessary information about your network share If you are using a mounted share, browse to the mount point on your file system rather than the network share Select your newly created location and choose "Ok" Give your media source a name and choose "Ok" Go to Add-ons -> Jellyfin -> Manage Libraries -> Add Libraries Proceed to Library Syncing Library Syncing​ This screen allows you to choose which libraries to sync to your Kodi install. This process will copy metadata for your media into the local Kodi database, allowing you to browse through your media libraries as if they were native to your device. Either choose "All" or select individual libraries you would like synced and select OK. Syncing the metadata will start automatically. The duration of this process varies greatly depending on the size of your library, the power of your local device, and the connection speed to the server. You can still access any libraries that have not been synced by going through the Jellyfin add-on menu. These unsynced libraries will be labeled as "dynamic." If an error occurs during syncing, enable debug logging in the Jellyfin add-on in Kodi and if in a Unix-like OS, set the log level of Samba to 2 to see if there are issues authenticating. Multiple User Accounts​ The Jellyfin for Kodi add-on doesn't natively handle multiple user accounts. Fortunately, Kodi has a built-in method of handling this called profiles. Information about this can be found on the Profiles page of the Kodi Wiki. Once profiles have been created, you must install the Jellyfin add-on and go through the installation steps above for each user profile. When you switch Kodi profiles, you will also switch Jellyfin users. You can tell Kodi to bring you to a profile login screen during startup by going to the Profiles section inside of the Settings page and checking the box for "Show login screen on startup." tipKodi's default skin does not display all unicode characters. To display unicode characters the skin's font must be changed. Multiple Clients​ When using multiple Kodi clients do not copy Kodi's database (i.e. myvideosXYZ.db, jellyfin.db) files from one client to the other to try and reduce initial syncing time. This will partially work, but it will cause conflicts between clients and the sync process from the server will not work properly. JellyCon​ JellyCon Overview​ JellyCon behaves more like a standard Kodi streaming add-on. Media is accessed primarily by going through the Add-ons -> JellyCon menu, however depending on what skin is being used custom shortcuts and widgets can be added to the home menu. It also allows easier switching between multiple Jellyfin servers or users since it doesn't have to rely on syncing all the metadata down. By not having metadata synced, it has to request info from the server which can take a bit more time when you're browsing, but you don't have to wait for the database to sync or keep it up to date. It is also compatible with other media sources and can be used with other add-ons without issue. Install JellyCon Add-on​ Install JellyCon Add-on From within Kodi, navigate to "Add-on Browser" Select "Install from Repository" Choose "Kodi Jellyfin Add-ons", followed by "Video Add-ons" Select the JellyCon add-on and choose install Within a few seconds you should be prompted for your server details. If a Jellyfin server is detected on your local network, it will be displayed in a dialog. Otherwise, you will be prompted for a URL Select a user from the list, or Manual Login to type in a username/password Configuring Home​ Many Kodi skins allow for customizing of the home menu with custom nodes and widgets. However, all of these use slightly different layouts and terminology. Rather than a step-by-step guide, this section serves as an barebones introduction to customizing a skin. Examples​ If you would like a link on the home screen to open a library in your Jellyfin server called "Kid's Movies", you would point the menu item to the path: Add-On -> Video Add-On -> JellyCon -> Jellyfin Libraries -> Kid's Movies -> Create menu item to here. Beyond just modifying where the home menu headers go, many skins also allow you to use widgets. Widgets help populate the home screen with data, often the posters of media in the selected image. If you would like to display the most recent movies across all of your Jellyfin libraries on the home screen, the path would be: Add-On -> Video Add-On -> JellyCon -> Global Lists -> Movies -> Movies - Recently Added (20) -> Use as widget Another common use case of widgets would be to display the next available episodes of shows that you may be watching. As above, this can be done both with individual libraries or with all libraries combined: Add-On -> Video Add-On -> JellyCon -> Jellyfin Libraries -> Anime -> Anime - Next Up (20) -> Use as widget Add-On -> Video Add-On -> JellyCon -> Global Lists -> TV Shows -> TV Shows - Next Up (20) -> Use as widget Edit this page'''
year_published = 2025
