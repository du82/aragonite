full_description = "InstallationInstallationThe Jellyfin project and its contributors offer a number of pre-built binary packages to assist in getting Jellyfin up and running quickly on multiple systems. cautionFreeBSD and its derivatives, such as TrueNAS CORE, are NOT supported by Jellyfin due to .NET officially not being compatible with these platforms.Even though there are builds available online for these platforms, they are unofficial and from a separate project. If you do encounter issues on these platforms, please ask for support in their respective support channels first.TrueNAS SCALE is based on Linux and therefore officially supported. Please install the Jellyfin app from its app repository. This app is not officially maintained by the Jellyfin team, therefore please use the TrueNAS support channels for help first. For info on selecting hardware for a Jellyfin server, please refer to the Hardware Selection Guide 📄️ ContainerInstall as a container using Docker, Podman and others.📄️ LinuxInstall on Linux.📄️ WindowsInstall on Windows.📄️ TrueNAS SCALEInstall on TrueNAS SCALE.📄️ SynologyInstall on Synology NAS.📄️ macOSInstall on macOS.📄️ Building from sourceCompile and run Jellyfin yourself.Edit this page"
