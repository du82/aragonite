title = '22 posts tagged with "release" | Jellyfin'
full_description = '''Jellyfin for iOS 1.6.0February 28, 2025 · 4 min readBill ThorntonCore Team, Web LeadJellyfin for iOS is back with the first release in nearly 3 years!Tags:releaseiosRead more Jellyfin for Android TV 0.18November 30, 2024 · 6 min readNiels van VelzenCore Team, Android LeadVersion 0.18 of our Jellyfin for Android TV app is ready! Exciting features like lyrics and media segments are now available, along with significant improvements to subtitles and more.Tags:releaseandroid-tvRead more Jellyfin 10.10.0October 26, 2024 · 6 min readJoshua BonifaceProject LeaderWe are pleased to announce the latest stable release of Jellyfin, version 10.10.0! This major release brings several new features, improvements, and bugfixes to improve your Jellyfin experience. With our faster release cadence between 10.9.0 and 10.10.0, this release should be far less daunting, so please read on for a quick peek at what's new and some important-to-know breaking changes! You may upgrade your Jellyfin instances at any time now. For those who were running Unstable builds for testing, we thank you immensely, and you may now switch back to the Stable repository and forcibly reinstall/repull the latest version. As always, ensure you back up your Jellyfin data and configuration directories before upgrading. With a major release, it's possible you will hit a bug and want to revert, and to do so, you will need to restore from a backup. Happy watching! - JoshuaTags:releaseRead more Release Roadmap for 10.10.0September 10, 2024 · 8 min readJoshua BonifaceProject Leader We are pleased to announce that we are now beginning the process for the 10.10.0 release, with a planned release date of Saturday, October 26th (updated - see below), 2024! We said 6 months in our 10.9.0 release posts, and we're sticking by that! The feature freeze proper starts next week, with a soft "new PR freeze" today, so here's what you need to know about the timeline and a recap of how to help us test 10.10.0 before release. Remember, the more people who help test it out before release, the less bugs we're likely to find after release, so fire up those secondary servers and warn your users: 10.10.0 is coming! Developers/contributors, and those users who want a bit more information, please read on! - JoshuaTags:releasetestingRead more'''
