["https://jellyfin.org/posts/android-on-fdroid"]
title = "Android app now on F-Droid | Jellyfin"
description = "Available to download right now!"
full_description = "Android app now on F-DroidMarch 1, 2021 · One min readNiels van VelzenCore Team, Android LeadWe're happy to announce the immediate availability of the Android mobile app on the F-Droid store. The F-Droid version does not contain any proprietary libraries and builds are fully reproducible. Missing features​ Unfortunately, the library required for casting support is proprietary, meaning that it's not available under a free license and Google doesn't publish the source code. Because of that, we had to remove it in the F-Droid version. Fortunately, the remote control feature still works. Additionally, the Android Auto integration does not work because Google does not allow apps to integrate with it when the app was not installed from the Google Play store. Download Now​ Direct downloads are always available from our repository."
year_published = 2021
