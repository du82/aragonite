["https://jellyfin.org/posts/android-tv-11"]
title = "New Android TV Release - v0.11.0 | Jellyfin"
description = "Improved Video Playback That Goes up to 11"
full_description = '''New Android TV Release - v0.11.0February 4, 2020 · 2 min readNiels van VelzenCore Team, Android LeadThank you for using Jellyfin! This is a major update for the Android TV client. infoWe have added crash reporting. Read the notes below for more information. Highlights​ Upgraded ExoPlayer to version 2 This means video playback should be a lot smoother now! New home screen The newly made home screen now looks more or less the same as the webclient. It will display the sections you have chosen under your "Home" preferences. Note: changing sections is only available in the web version for now Integration with "Next Up" section on Android TV devices Crash Reporting​ Providing logs on Android TV devices can be challenging for users as it requires Android developer tools. Issues can be challenging to replicate for developers and crash logs help a lot with this. We don't want to force users to report their logs to a third-party and therefore we won't report anything by default. When a crash occured the app will show a dialog and ask to report the logs. All crash reports are retained for 30 days and can only be reviewed by a small group of developers inside the Android TV team. More information can be found in the issue about this change. Release Notes​ Full release notes available on GitHub. Download Now​ Direct downloads are always available from our repository.Tags:releaseandroid-tv'''
