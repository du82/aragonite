full_description = "Server GuideNotificationsOn this pageNotifications You can use notifications to get alerts when certain events happen on your server. Some common notifications include plugin installations and different user events. Services​ Notifications can be sent using different services depending on what kind of integration you want. Jellyfin will show notifications on the dashboard by default, but you can install alternative services on the Plugins page. Most services will require additional configuration but can be extremely useful for those who want instant updates for activity on their server. Configuration​ You can properly configure this feature on the Notifications page in the settings. All notification types will be shown in a list as well as their current status. They can be enabled individually and can be set to only monitor specific users. Any installed notification services will show up in a list in this section.Edit this page"
