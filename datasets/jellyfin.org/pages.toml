["https://jellyfin.org/posts/client-mpv"]
title = "Client Spotlight: MPV Shim | Jellyfin"
description = "Watch all your favorite content without transcoding!"
full_description = "Client Spotlight: MPV ShimFebruary 7, 2020 · 2 min readIzzie WaltonDesktop Applications LeadJellyfin MPV Shim is a lightweight cast-only client that allows you to cast videos from Jellyfin to the MPV Media Player. It runs in the system tray and stays out of your way until you want to play something. It also has excellent codec support and many configurable options for advanced users. If you watch a lot of anime, this client is definitely for you. The player has full support for 10-bit HEVC video with subtitles. Additionally, there is a menu option that allows setting subtitles and audio preferences over an entire season of TV at once. To get started on Windows, simply download the binary and run it. If you are on Linux, follow the instructions here. After you have started the client, enter the URL of your server and the username and password to connect. The client will run in a tray icon, which allows you to access the configuration and view the error logs. Casting media is easy. Open the Play On menu in the Jellyfin web or mobile clients and select Jellyfin MPV Shim. Then play media normally. You’ll be able to control most aspects of playback from the web application or by using keyboard shortcuts. Most of the options can be accessed using the menu during playback. Press C on your computer or use the arrow-based navigation controls in the mobile client when supported. You can adjust playback settings and preferences in the menu with ease. Use the arrow keys and enter to navigate and escape to go back. The Auto Set Audio/Subtitles option allows you to set the subtitles for an entire season at once, instead of having to change the settings each time the episode changes. Use the Preferences menu to adjust the default playback settings and remote video quality. Client Spotlight This blog series aims to highlight some of the amazing projects created by our community. Feel free to send a message if you can think of a project that could use more love!"
author = "https://github.com/iwalton3"
year_published = 2020
