title = "Blog | Jellyfin"
full_description = "Client Spotlight: VideotapeAugust 22, 2020 · One min readJose Maria VillagraVideotape is a free lightweight video player for both Windows 10 & Xbox. Their new 3.0 version now supports Jellyfin!Read more Jellyfin Release - v10.6.0July 19, 2020 · 9 min readJulien MachielsAfter months of work, here comes another behemoth of a release, this time with over 30 major improvements and tons of fixes.Read more Plugin RepositoriesJuly 17, 2020 · 6 min readdkanadaCore TeamThere have been several changes to plugins for the new release. Here's a quick post going over the biggest updates for developers and users alike.Read more Packaging Updates for 10.6.0June 21, 2020 · 9 min readJoshua BonifaceProject LeaderPackaging and building binaries for releases and testing has long been an issue for us. From fighting with duct-tape-and-coat-hanger scripts, to testing breaking changes, to massaging official releases, how we were doing things for the last year-and-a-half needed some improvements. Luckily, today they are all completed. In this post, I'll detail the changes as well as what the entail for our users. For a brief TL;DR: for most users of our stable releases, not much will change, and you will upgrade to 10.6.0 as you always have. For anyone using nightlies for testing, advanced setups, or who are just curious - read on!Read more Client Spotlight: Infuse for tvOS and iOSMay 12, 2020 · 2 min readAnthony LavadoCore TeamToday, Firecore has launched Infuse 6.4 for Apple TV, iPhone, and iPad. This release brings official support for Jellyfin, built right in.Read more Jellyfin: Now on Xbox One (UPDATED)April 22, 2020 · One min readAnthony LavadoCore TeamDue to long standing issues with this current release of the Xbox client beta, and incompatibility with the latest release of Jellyfin, we've made the decision to remove it from the store. We hope to return soon, with an updated client. In the meanwhile, please try using the Edge browser, or Kodi with our plug-ins to watch Jellyfin.Read more"
