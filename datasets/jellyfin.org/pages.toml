["https://jellyfin.org/docs/general/installation/linux"]
title = "Linux | Jellyfin"
description = "Install on Linux."
full_description = '''InstallationLinuxOn this pageLinuxOfficial packages and methods​ Debuntu (Debian, Ubuntu, and derivatives using apt) with official repository​ The Jellyfin team provides 3rd-party Debian and Ubuntu repositories, to help ensure your Jellyfin install is always kept up-to-date. For Ubuntu, only LTS distributions from the past 5 years are supported. Repository (Automatic)​ To simplify deployment and help automate this for as many users as possible, we provide a BASH script to handle repo installation as well as installing Jellyfin. All you need to do is run this command on your system (requires curl, or subsitute curl with wget -O-): curl https://repo.jellyfin.org/install-debuntu.sh | sudo bash noteYou can verify the script download integrity with (requires sha256sum):diff <( curl -s https://repo.jellyfin.org/install-debuntu.sh -o install-debuntu.sh; sha256sum install-debuntu.sh ) <( curl -s https://repo.jellyfin.org/install-debuntu.sh.sha256sum )An empty output means everything is correct. Then you can inspect the script to see what it does (optional but recommended) and execute it with:less install-debuntu.shsudo bash install-debuntu.sh noteThe script tries to handle as many common derivatives as possible, including, at least, Linux Mint (Ubuntu and Debian editions), Raspbian/Raspberry Pi OS, and KDE Neon. We welcome PRs to the script for any other common derivatives, or you can use the steps below instead. Repository (Using extrepo)​ extrepo is only supported on Debian currently. The advantage of extrepo is that it is packaged in Debian. So you don’t have to execute the curl | sudo bash combo from the previous Automatic section. The risk with that command is that it relies on the security of the webserver. extrepo avoids this by having the Jellyfin repo information including the GPG key in its extrepo-data. extrepo-data is verified with GPG by the extrepo tool. So there is a chain of trust from Debian all the way to the Jellyfin repo information. sudo apt install extreposudo extrepo enable jellyfin Now you can continue at step 5. of the Repository (Manual) section. Containers​ For non Debian/Ubuntu systems, containers are the recommended way to install Jellyfin. Please follow the instructions here. Community maintained packages​ Alpine Linux​ Jellyfin can be found in the community repository as jellyfin and jellyfin-web. To enable the web UI after installing jellyfin-web, make sure to remove the --nowebclient option from /etc/conf.d/jellyfin. Arch Linux​ The Extra repository contains builds for both jellyfin-server and jellyfin-web. jellyfin-server includes a hard dependency on jellyfin-ffmpeg. Both packages, server and web, can also be built from source at the tip of the master branch using jellyfin-git. The AUR also offers each separately at jellyfin-server-git and jellyfin-web-git. Fedora, CentOS and other RPM distributions​ Builds in RPM package format are provided by RPM Fusion. Official packages are no longer provided starting with 10.9. RPM Fusion​ rpmfusion must be enabled first sudo dnf install https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm Install the jellyfin package, which will automatically install jellyfin-server, jellyfin-web and jellyfin-firewalld sudo dnf install jellyfin Enable and start the Jellyfin service: sudo systemctl enable --now jellyfin Manual installation via the .rpm packages​ You will need to enable rpmfusion, as ffmpeg is a dependency of the jellyfin server package sudo dnf install https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm noteYou do not need to manually install ffmpeg; it will be installed by the Jellyfin server package as a dependency. Install the Jellyfin server sudo dnf install <link to server `.rpm` file URL> Install the Jellyfin web interface sudo dnf install <link to web `.rpm` file URL> Enable and start the Jellyfin service: sudo systemctl enable --now jellyfin Allow Jellyfin through the firewall: sudo firewall-cmd --permanent --add-service=jellyfin noteThis will open the following ports: 8096 TCP, used by default for HTTP traffic; you can change this in the dashboard 8920 TCP, used by default for HTTPS traffic; you can change this in the dashboard 1900 UDP, used for service auto-discovery; this is not configurable 7359 UDP, used for auto-discovery; this is not configurable Reload the firewall to apply the new rules: sudo firewall-cmd --reload Go to localhost:8096 or ip-address-of-jellyfin-server:8096 to finish setup in the web UI. Gentoo​ The Gentoo ebuild repository includes the Jellyfin package which can be installed like other software: emerge www-apps/jellyfin NixOS​ NixOS has a module for Jellyfin, it can be enabled as follows: { services.jellyfin.enable = true;} For more information, refer to the NixOS wiki. Advanced​ Manual installation on Debian, Ubuntu and derivatives​ Repository (Manual)​ If you would prefer to install everything manually, the full steps are as follows: Install curl and gnupg if you haven't already: sudo apt install curl gnupg On Ubuntu (and derivatives) only, enable the Universe repository to obtain all the FFmpeg dependencies: sudo add-apt-repository universe noteIf the above command fails you will need to install the following package software-properties-common. This can be achieved with the following command sudo apt-get install software-properties-common On Debian, you can also enable the non-free components of your base repositories for additional FFmpeg dependencies, but this is optional. Download the GPG signing key (signed by the Jellyfin Team) and install it: sudo mkdir -p /etc/apt/keyringscurl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg Add a repository configuration at /etc/apt/sources.list.d/jellyfin.sources: export VERSION_OS="$( awk -F'=' '/^ID=/{ print $NF }' /etc/os-release )"export VERSION_CODENAME="$( awk -F'=' '/^VERSION_CODENAME=/{ print $NF }' /etc/os-release )"export DPKG_ARCHITECTURE="$( dpkg --print-architecture )"cat <<EOF | sudo tee /etc/apt/sources.list.d/jellyfin.sourcesTypes: debURIs: https://repo.jellyfin.org/${VERSION_OS}Suites: ${VERSION_CODENAME}Components: mainArchitectures: ${DPKG_ARCHITECTURE}Signed-By: /etc/apt/keyrings/jellyfin.gpgEOF noteThe supported values for the above variables are: ${VERSION_OS}: One of debian or ubuntu; if it is not, use the closest one for your distribution. ${VERSION_CODENAME}: One of our supported Debian or Ubuntu release codenames. These can change as new releases come out and old releases are dropped, so check the script to be sure yours is supported. ${DPKG_ARCHITECTURE}: One of our supported architectures. Microsoft does not provide a .NET for 32-bit x86 Linux systems, and hence Jellyfin is not supported on the i386 architecture. Update your APT repositories: sudo apt update Install the Jellyfin metapackage, which will automatically fetch the various sub-packages: sudo apt install jellyfin noteIf you want to be explicit, instead of the metapackage, you can install the sub-packages individually:sudo apt install jellyfin-server jellyfin-webThe jellyfin-server package will automatically select the right jellyfin-ffmpeg package for you as well. Manage the Jellyfin system service: sudo systemctl {action} jellyfinsudo service jellyfin {action} .deb Packages (Very Manual)​ Raw .deb packages, including old versions, source packages, and dpkg meta files, are available in the main download repository. noteThe repository is the preferred way to obtain Jellyfin on Debian and Ubuntu systems, as this ensures you get automatic updates and that all dependencies are properly resolved. Use these steps only if you really know what you're doing. On Ubuntu (and derivatives) only, enable the Universe repository to obtain all the FFmpeg dependencies: sudo add-apt-repository universe noteIf the above command fails you will need to install the following package software-properties-common. This can be achieved with the following command sudo apt-get install software-properties-common On Debian, you can also enable the non-free components of your base repositories for additional FFmpeg dependencies, but this is optional. Download the desired jellyfin-server, jellyfin-web, and jellyfin-ffmpeg .deb packages from the repository; jellyfin is a metapackage and is not required. Install the downloaded .deb packages: sudo dpkg -i jellyfin_*.deb jellyfin-ffmpeg_*.deb noteThis step may throw errors; continue to the next step to resolve them. Use apt to install any missing dependencies: sudo apt -f install Manage the Jellyfin system service: sudo systemctl {action} jellyfinsudo service jellyfin {action} Linux (generic amd64)​ Generic amd64, arm64, and armhf Linux builds in TAR archive format are available in the main download repository. Base Installation Process​ Create a directory in /opt for jellyfin and its files, and enter that directory. sudo mkdir /opt/jellyfincd /opt/jellyfin Download the latest generic Linux build for your architecture. The rest of these instructions assume version 10.8.13 is being installed (i.e. jellyfin_10.8.13_amd64.tar.gz). Download the generic build, then extract the archive: sudo wget https://repo.jellyfin.org/?path=/server/linux/stable/combined/jellyfin_10.8.13_amd64.tar.gzsudo tar xvzf jellyfin_10.8.13_amd64.tar.gz Create a symbolic link to the Jellyfin 10.8.13 directory. This allows an upgrade by repeating the above steps and enabling it by simply re-creating the symbolic link to the new version. sudo ln -s jellyfin_10.8.13 jellyfin Create four sub-directories for Jellyfin data. sudo mkdir data cache config log FFmpeg Installation​ If you are not running a Debian derivative, install ffmpeg through your OS's package manager, and skip this section. cautionNot being able to use jellyfin-ffmpeg will most likely break hardware acceleration and tonemapping. If you are running Debian or a derivative, you should download and install an ffmpeg .deb package built specifically for Jellyfin. If you run into any dependency errors, run this and it will install them and jellyfin-ffmpeg. sudo apt install -f Running Jellyfin​ Due to the number of command line options that must be passed on to the Jellyfin binary, it is easiest to create a small script to run Jellyfin. sudoedit jellyfin.sh Then paste the following commands and modify as needed. #!/bin/bashJELLYFINDIR="/opt/jellyfin"FFMPEGDIR="/usr/share/jellyfin-ffmpeg"$JELLYFINDIR/jellyfin/jellyfin \ -d $JELLYFINDIR/data \ -C $JELLYFINDIR/cache \ -c $JELLYFINDIR/config \ -l $JELLYFINDIR/log \ --ffmpeg $FFMPEGDIR/ffmpeg Assuming you desire Jellyfin to run as a non-root user, chmod all files and directories to your normal login user and group. Also make the startup script above executable. sudo chown -R user:group *sudo chmod u+x jellyfin.sh Finally you can run it. You will see lots of log information when run, this is normal. Setup is as usual in the web browser. ./jellyfin.sh Starting Jellyfin on boot (optional)​ Create a systemd unit file. cd /etc/systemd/systemsudo nano jellyfin.service Then paste the following contents, replacing youruser with your username. [Unit]Description=JellyfinAfter=network.target[Service]Type=simpleUser=youruserRestart=alwaysExecStart=/opt/jellyfin/jellyfin.sh[Install]WantedBy=multi-user.target Apply the correct permissions to the file, enable the service to start on boot, then start it. sudo chmod 644 jellyfin.servicesudo systemctl daemon-reloadsudo systemctl enable jellyfin.servicesudo systemctl start jellyfin.service Portable DLL​ Platform-agnostic .NET Core DLL builds in TAR archive format are available here. These builds use the binary jellyfin.dll and must be loaded with dotnet. Building from source​ Jellyfin can be built from source directly. Please read Building from source for more info.Edit this page'''
year_published = 2025
