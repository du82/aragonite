full_description = "Android TV v0.12September 30, 2021 · 6 min readNiels van VelzenCore Team, Android LeadToday we're bringing the Android TV app to 2021 with a modern design and tons of other changes.Tags:releaseandroid-tvRead more Jellyfin Android v2.3.0 - Improved Integrated PlayerAugust 1, 2021 · 3 min readMax RumpfAndroid Mobile LeadAfter a prolonged beta testing period, we're excited to announce that version 2.3.0 of the Jellyfin Android app is now available!Read more Regarding the Android betasJuly 24, 2021 · 2 min readNiels van VelzenCore Team, Android LeadWith the release of the first Android TV 0.12 release beta, this is a good time to explain how our Android beta programs work and how to start using them. The mobile app has used a public beta channel for around a year now and with the Android TV app coming close to a new release we're adding a similar program for that as well.Tags:android-tvRead more Introducing Jellyfin Media PlayerApril 18, 2021 · 2 min readIzzie WaltonDesktop Applications LeadJellyfin Media Player is a new Jellyfin client option intended to offer a more user-friendly experience. It takes the user interface from jellyfin-web, including the playback interface, and combines it with the extensive codec support from MPV.Read more A Note About Privacy and Expo for iOSApril 17, 2021 · 4 min readAnthony LavadoCore TeamWhen it comes to Jellyfin, we guarantee that there is no involuntary tracking, from the server to the mobile apps. This still remains true, even with today's update to the Apple App Store.Read more The Jellyfin CDN: Mirrorbits for the massesApril 12, 2021 · 15 min readJoshua BonifaceProject LeaderFor many projects, distributing binary assets is easy: put the files on GitHub and you're done. It's not something many think about. But at Jellyfin, we needed something more robust, something able to handle our needs more elegantly than GitHub or a basic web server could. And both for those interested, and for those supporting other similar projects, I'd like to share how we do it.Read more"
