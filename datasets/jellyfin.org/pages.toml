["https://jellyfin.org/docs/general/server/plugins/tvheadend"]
title = "TVHeadend | Jellyfin"
description = "The objective of the guide is to configure the Jellyfin TVHeadend plugin to backend a TVHeadend server."
full_description = "Server GuidePluginsTVHeadendOn this pageTVHeadend The objective of the guide is to configure the Jellyfin TVHeadend plugin to backend a TVHeadend server. Requirements​ TVHeadend server Jellyfin server TVHeadend plugin installed in Jellyfin Configuration​ Create a user for Jellyfin in TVHeadend: it is convenient to create a specific user for Jellyfin. Go to Configuration > Users > Access Entries > Add Give the user parameters Enabled: ✔ Username: Username (for example: Jellyfin) Change parameters: Rights,Channel number range,Channel tags,DVR configurations,Streaming profiles,Connection limits Web interface: ✔ Streaming: Basic,Advanced,HTSP Video recoder: Basic,HTSP,View all (Optional) Comment: Comment for the user (for example: User used by Jellyfin) (Optional) Allowed networks: Network address with network mask to allow (for example 127.0.0.1/32) Press Save Go to Configuration > Users > Passwords > Add Give the user parameters Enabled: ✔ Username The user created previously (for example: Jellyfin) Password: The password for the user created previously (for example: Jellyfin_password) Press Save noteThe parameters Change parameters, Streaming and Video recoder must be marked as shown. Otherwise, Jellyfin can connect to TVHeadend but problems may arise when reproducing the content. Adjust the Jellyfin TVHeadend plugin to establish the connection. Go to Dashboard > Plugins > TVHeadend > Settings Provide creator access data previously: TVHeadend Hostname or IP Address: IP address of the TVHeadend server (for example: 127.0.0.1) Username: The user created previously (for example: Jellyfin) Password: The password created previously (for example: Jellyfin_password) noteBy default the the TVHeadend Hostname or IP Address section is configured by default with the hostname localhost, it is preferable to use the IP address 127.0.0.1 instead of localhost. Reference Configure the channels for viewing in Jellyfin: even if Jellyfin manages to connect to TVHeadend, the guide will not be synchronized because there has to be a number assigned to the channels in TVHeadend. Reference Manual mode Go to Configuration > Channel/EPG > Channels Select the channel to be changed and press Edit In the option Number we enter the number that we are going to assign to the channel (for example: 1), this number must be nonzero Press save Automatic mode Go to Configuration > DVB Inputs > Networks Select the network you want and press Edit In the option Channel numbers from we enter the number so we want the numbering of the channels to start (for example: 1), this number must be nonzero Press save Update the data from the TVHeadend guide to Jellyfin Go to Dashboard > Live TV Refresh guide data noteIf the guide is not updated, restart the Jellyfin server. Once the update of the guide is finished, the Live TV will already be able to see the guide related to the synchronized channels and will be able to visualize the content.Edit this page"
