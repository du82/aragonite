["https://jellyfin.org/posts/a-call-for-developers"]
title = "A Call for Developers | Jellyfin"
description = "Jellyfin needs your help to get better, so join us this October and beyond!"
full_description = '''A Call for DevelopersOctober 1, 2023 · 5 min readJoshua BonifaceProject Leader This year, DigitalOcean's Hacktoberfest is in it's 10th year. In previous years, we haven't made too much of it, but within our project, this is our most important year yet. We'd like to call on you, the wider community, to help make Jellyfin better! We need contributors, fresh ideas and blood to help the project move past our current funk and into something more. Will you join us? We keep a close eye on the buzz about Jellyfin around Reddit and the Internet more broadly; in the last couple weeks we have seen a few major Plex-related kerfufles and the comments inevitably include the following exchange: Person A: Use Jellyfin instead Person B: Jellyfin sucks, it lacks client X or feature Y Person C: Works for me Person D: It needs polish and more apps Sometimes one of us will jump in, but I think it's high time for us to make a public request for something that's been on our minds as a team for quite a while. For those who are not aware, Jellyfin is a bit unusual, even within the FLOSS world. We are explicitly anti-commercial. Our team is entirely composed of volunteers who contribute because they like what we're doing and can help out in whatever ways they can. This includes developers, translators, and community members who help moderate the community and assist others in troubleshooting and working through problems. No one gets paid for Jellyfin work, by design. We're not backed by any company or "organization" with its own agenda. We have no "monetization plan" or anything of the sort, and actively avoid bug bounties. Jellyfin isn't a "product" in the commercial sense of the word. And while we do take donations, these only cover our infrastructure costs and the rare piece of developer client hardware as needed; we don't pay developers out of donations, and never will. Money is not an issue (for what we use it for), and that's not really what we need. This is a choice we've made from day 1 to avoid Jellyfin following in the footsteps of nearly every other player in this space, who start out as FLOSS, start adding user-hostile features in the name of money, and then go closed source. We want to be different. We want to be volunteer-only and work on this thing to help make media streaming available to everyone. But, the team behind Jellyfin is under strain. We love what we do, and want to keep doing it. But our core contributor base is actually fairly small, at most about 30 active people, for everything - the core server, the webUI, and all of our clients. And it hasn't really grown in quite some time. Some of our developers have been with us since the early days, some joined later, but life sometimes gets in the way, and we've lost some over the years, so the number has been pretty flat for the last 3 years all together. For some parts of the project, especially individual apps, we have at most 1 or 2 people working on them, for free in their own time, because it "scratches their itch". Some very-well-requested features/clients have gotten no traction at all, with no one coming in willing to start/help developing them. We've had to abandon some (like Chromecast for a while, though it's getting new life in the last few weeks) because of this. We're aware that probably the biggest complaints about Jellyfin are about the lack of client support, and the rough edges/lack of polish. We do hear you. We do want this to improve this just as much as you do. But we need people to help us do so. We need more volunteers who can help make the code better, write new code, document, and generally improve things. We need your help to push past what I call the Development Bystander Problem, get some new blood into the project, and especially, help to make it better! So, this is our open call to the world: Jellyfin needs YOU! Whether you're a developer, a writer, a UI/UX designer, a non-English-language speaker, or just an avid enthusiast willing to help out, no matter your experience level, we'd love the extra help. We have some resources to help you get started, and our chat channels on Matrix/IRC/Discord and the Forum are quite active, with the team very happy to help new contributors. Every little bit helps, from fixing a small bug to improving the documentation or working on a full client. We do have a "track", so to speak, for people to officially join the team as well: if this is something you want, it's absolutely possible after proving yourself with quality contributions of any kind and a willingness to participate. We want to make Jellyfin better, and address our users' concerns, limitations, and bugs. We hope this post explains where we're at and helps inspire some new contributors to join the project and help us truly turn Jellyfin into the best streaming server it can be, free for everyone forever. Thanks, and Happy Watching!Tags:project'''
author = "https://github.com/joshuaboniface"
year_published = 2023
