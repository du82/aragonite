["https://jellyfin.org/docs/general/contributing/issues"]
title = "Reporting Issues | Jellyfin"
description = "This page discusses how to open issues, including the policies and procedures of the Jellyfin project around handling issues."
full_description = "ContributingReporting IssuesOn this pageReporting Issues This page discusses how to open issues, including the policies and procedures of the Jellyfin project around handling issues. Issues should only detail software bug reports. All other discussions, including initial troubleshooting, should be directed towards our help channels. Requesting Features​ Please note that feature and enhancement requests should be directed towards our Fider instance for tracking, voting, and reporting. Please keep all feature requests to this page and not GitHub issues. Searching and Voting​ Before opening an issue, please search the existing issues to see if a similar problem or feature request has been reported. Duplicate issues clutter the repository and should be avoided. If you do find an issue that matches, or closely matches, your issue, please make use of the 👍 reaction to confirm the issue also affects you or that you support the feature request. If you wish, add a comment as well describing your version of the issue or feature use case. If the existing issue is closed, please read through it to see if the accepted workaround(s) apply to your case. If not, leave a comment and the issue will be reopened. Note that, since PRs go into dev first but releases are built from master, an issue's fix won't be immediately available in the official sources, but will be included in the next release. Opening an Issue​ Once you're ready to open an issue, please see this page! Reporting Bugs​ When writing a bug issue, please ensure you capture as much relevant detail as possible - this is very important to assist in troubleshooting and triaging/investigating the issue. Some useful elements include: How you installed Jellyfin (upgrade or fresh install) What platform and operating system you are using (Debian, Arch, Docker, etc.) What you were doing that caused the issue to appear Any relevant log output Any non-standard configurations you use Bugs should be tagged with [bug] at the beginning of their title. This will later be removed by the Jellyfin team when assigning labels. To assist in triaging, if you know which other label(s) should be applied to your issue, please add them after the [bug] label. Bugs should be reproduceable. That is, you should be able to have determined through troubleshooting how to replicate the issue. While one-time bugs should not be ignored, if they're difficult or impossible to reproduce, it's likely very hard to fix them. Please attempt to reproduce the bug before filing the issue and include the smallest test case you can to demonstrate it. If you ever need assistance for troubleshooting or opening an issue, please contact the community and we'll try to help you out! Issue Labels​ Jellyfin features a number of issue labels to assist in triaging and managing issues. Users cannot assign these themselves due to GitHub's permissions, but they will be added by a team member during triaging. Categories​ These labels are broad categories for which part of the codebase is affected. backend: An issue that mainly relates to the server backend code. build: An issue that mainly relates to the build process. Criticality​ These labels help determine how critical an issue is. regression: An issue in need of immediate attention due to a regression from the last build. bug: A bug in the code that affects normal usage. Management​ These labels help assist in managing the project and direction. good first issue: Something that should be very straightforward to do and is a great place to get started. help wanted: An issue that currently has no clear expert within the project and could use outside assistance. roadmap: A meta-issue related to the future roadmap of the project. investigation: An investigation-type issue into the codebase. Pull Requests​ These labels apply only to pull requests for administrative purposes. requires testing: A PR that has not been tested in a live environment yet. Any major backend-affecting PRs should be tested before being merged to avoid regressions. Edit this page"
year_published = 2025
clearnet = "https://jellyfin.org/docs/general/contributing/issues"
