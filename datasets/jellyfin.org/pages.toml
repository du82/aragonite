["https://jellyfin.org/posts/android-tv-13"]
title = "Android TV v0.13 | Jellyfin"
description = "That was quick"
full_description = '''Android TV v0.13March 17, 2022 · 4 min readNiels van VelzenCore Team, Android LeadWe're back with another release for Android TV and Fire TV users containing a lot of bugfixes! As promised in the previous release post, the time between updates is getting shorter. We aim for future updates to happen significantly more frequently than the two years between 0.11 and 0.12. Today's update brings some new features and greatly improves playback of videos. Let's get started with the player changes. Playback changes​ Most changes in this release are related to playing video files, the so called playback code. A lot of changes were made, both bugfixes and new features! The full list is, as always, available in the changelog. The most notable changes are listed below. Transcoding updates​ A lot of issues with video are caused by the way the app transcodes video. We've tweaked the transcoding behavior and found a lot of issues were fixed with those tweaks, issues like the video ending early or unexpectedly rewinding itself. Unfortunately these changes triggered some issues in Jellyfin 10.7 and we had to limit these changes to servers running Jellyfin 10.8. We recommend updating as soon as a stable server release is ready. Additionally, we've added support for more audio codecs. The added codecs include Dolby Digital, Digital Plus and TrueHD, as well as DTS and Linear PCM audio, all commonly found on DVDs and Blu-rays, but also a more universal AAC support. This change is comparable with the audio codec changes in the last release of our mobile app. Version selection​ A much requested feature was the ability to add a version selector. We've now added this function. A new button is now shown on the details page for a movie/episode/video that can be used to select which version to play. Speed control​ It's now possible to change the speed of playback. You can slow down or speed up a video. The set speed is remembered so the next video plays at the same speed, until you restart the app or manually change it back. Speed control is not available for Live TV. Subtitle preferences​ Not everyone enjoyed the default subtitle styling in the previous version, so now there are a few options to change it. It's now possible to change the size of the subtitles and to toggle between a black background or text outline. These preferences work for all text based subtitles. Image based subtitles like SubStation Alpha and VobSub still use their own styling. Search & Screen saver​ You can now use the search function on Android TV to search in your Jellyfin libraries. This feature is supported for Android TV devices that do not use Google TV (like the new Chromecast). To get started, just search for a movie and press the "Available on Jellyfin" button. Additionally, we've added a screen saver that highlights your media. To enable it go to your system settings, open the screen saver category, and select the Jellyfin screen saver. On some devices this function may be called "Daydream". The screen saver shows random series and movies with their backdrop. Updated preferences​ The app has quite a lot of preferences. To make it easier to find the correct preference we've divided them into a few categories and re-ordered all of them. Some new preferences were added too. We've added subtitle preferences (see above), the ability to (finally) change the home sections from within the app. And the licenses of third party libraries are now shown in the about section. Contributors​ Like all releases, we couldn't do it without our contributors and your donations! Jellyfin is made entirely by volunteers that don't get paid for their work. A big shout-out to the following contributors that made this release possible: Jellyfin Team @nielsvanvelzen - Donate via GitHub sponsors @mueslimak3r - Donate via GitHub sponsors @thornbill - Donate via GitHub sponsors @h1dden-da3m0n Other contributors @DavidFair @ElegyD @siankatabg @koying @danieladov Changelog​ Full changelog with all pull requests available on GitHub. Download Now​ Direct downloads are always available from our repository. You can also join our beta program on Google Play to test new versions.Tags:releaseandroid-tv'''
