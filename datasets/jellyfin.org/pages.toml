["https://jellyfin.org/docs/general/installation/macos"]
title = "macOS | Jellyfin"
description = "Install on macOS."
full_description = '''InstallationmacOSOn this pageInstall on macOS macOS Application packages and builds in TAR archive format are available here. Jellyfin requires macOS 12 or newer to run. Jellyfin 10.9 or newer is required for Apple Silicon native support. Packaged Version(dmg)​ Install​ Download the latest version. Drag the .app package into the Applications folder. Start the application. Click the icon in the menu bar and select "Launch Web UI". Upgrade​ Download the latest version. Stop the currently running server either via the dashboard or using the menu bar icon. Drag the new .app package into the Applications folder and click yes to replace the files. Start the application. Uninstall​ Stop the currently running server either via the dashboard or using the application icon. Move the .app package to the trash. Deleting Configuration​ This will delete all settings and user information. This applies for the .app package and the portable version. Delete the folder ~/.config/jellyfin/ Delete the folder ~/.local/share/jellyfin/ Portable Version​ The portable version is intended for advanced users who want more customization options. For average users, the packaged version is strongly recommended. If you are not comfortable with command line, then this is not the version for you. Installing the Portable Version​ Download the latest version of Jellyfin. Extract it into the Applications folder. Open Terminal and type cd followed with a space then drag the jellyfin folder into the terminal. Type xattr -rd com.apple.quarantine . to remove the quarantine flag. Type codesign -fs - --deep jellyfin to create an ad-hoc signature for the server. Type ./jellyfin to run jellyfin. Open your browser at http://localhost:8096. Closing the terminal window will end Jellyfin. Running Jellyfin in screen or tmux can prevent this from happening. Upgrading the Portable Version​ Download the latest version. Stop the currently running server either via the dashboard or using CTRL+C in the terminal window. Extract the latest version into Applications Open Terminal and type cd followed with a space then drag the jellyfin folder into the terminal. Type xattr -rd com.apple.quarantine . to remove the quarantine flag. Type codesign -fs - --deep jellyfin to create an ad-hoc signature for the server. Type ./jellyfin to run jellyfin. Open your browser at http://localhost:8096 Uninstalling the Portable Version​ Stop the currently running server either via the dashboard or using CTRL+C in the terminal window. Move /Application/jellyfin-version folder to the Trash. Replace version with the actual version number you are trying to delete. Delete the folder ~/.config/jellyfin/ Delete the folder ~/.local/share/jellyfin/ Using FFmpeg with the Portable Version​ The portable version doesn't come with FFmpeg by default. There are a few options for installing FFmpeg: download jellyfin-ffmpeg from the Jellyfin repo (recommended) use the package manager homebrew by typing brew install ffmpeg into your Terminal (here's how to install homebrew if you don't have it already download the most recent static build from this link (compiled by a third party see this page for options and information) (Apple Silicon builds are not available from this source) compile from source available from the official website Once downloaded, remove the quarantine flag for the ffmpeg and ffprobe. Ensure that both ffmpeg and ffprobe are located at the same path, then execute the following command: cd /path/to/ffmpeg/folderxattr -rd com.apple.quarantine .Edit this page'''
year_published = 2025
