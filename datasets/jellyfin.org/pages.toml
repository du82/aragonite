["https://jellyfin.org/posts/page/2"]
title = "Blog | Jellyfin"
full_description = "Jellyfin Android 2.6December 12, 2023 · 2 min readNiels van VelzenCore Team, Android LeadMax RumpfAndroid Mobile LeadImprovements to the Jellyfin mobile experience are here. A new update for the Jellyfin Android app is ready! Read along to learn everything new in this update! - Niels & MaxTags:releaseandroidRead more Roku Version 2.0.0December 11, 2023 · 6 min read1hitsongRoku TeamWhen we say this 2.0.0 release is a major milestone, we honestly mean it. New features and bug fixes abound, but even behind the scenes the updates continue all the way to the foundation with us updating every single file in the app to support a new programming language. You can't get more monumental than that! Read more to learn about some of the exciting new features. - 1hitsongTags:releaserokuRead more Android TV version 0.16December 10, 2023 · 4 min readNiels van VelzenCore Team, Android LeadIt has been a busy year with a lot of work on the Android TV app. After an extended beta period today is finally the day to share this work to the public. Read along to learn everything about improved music playback, the new screensaver and more! - NielsTags:releaseandroid-tvRead more Jellyfin Security & YouNovember 26, 2023 · 3 min readJoshua BonifaceProject LeaderWe have just released our 10.8.13 stable version. This release fixes two serious security vulnerabilities, which will be detailed in full in approximately 1-2 weeks. Please be advised to update your Jellyfin instances as soon as possible before these vulnerabilities are released publicly.Tags:securityRead more A Call for DevelopersOctober 1, 2023 · 5 min readJoshua BonifaceProject Leader This year, DigitalOcean's Hacktoberfest is in it's 10th year. In previous years, we haven't made too much of it, but within our project, this is our most important year yet. We'd like to call on you, the wider community, to help make Jellyfin better! We need contributors, fresh ideas and blood to help the project move past our current