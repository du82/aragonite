title = "Roku Version 1.6.4 | Jellyfin"
description = "A new Jellyfin for Roku emerges from the shadows"
full_description = '''Roku Version 1.6.4April 5, 2023 · 3 min read1hitsongRoku TeamWe are excited to announce the release of Jellyfin 1.6.4 for Roku! With so many new featues and bug fixes, you'll wonder how we crammed it all into one release. Keep reading to learn more. - 1hitsong Requires minimum server version of 10.8.1 🐛 Bug Fixes​ Fix distorted TV episode posters. Add client-side progress bar and played indicator Fix option menu focus if opened while library still loading Only show next episode popup if web client setting is turned on Fix default view setting for movie genres Graceful episode playback failure Fix multiple client crashes identified by crashlogs ⚙️ New Settings​ User defined maximum video bitrate Disable unwatched episode count Next episode button time 🆕 New Features​ TV series & season shuffle Phase 1 CJK subtitle support (External files only) Phase 1 playlist support (Does not currently support CJK subtitles) The options button now closes the user settings menu New persondetails view Genres, parental ratings, and years as movie filters ⭐ Additional Updates​ Improve settings menu, implement title hover and hide in griditem and musicartistgriditem Improve quality of album art on now playing view Make home view load faster Updated "OnNow" home row to default to channel images if program images are not availible Update CI ubuntu version and node version Install & configure unit test suite Add user policy to check if canDelete Loading spinner, Progress Dialog and movie details button animate Make title scrolling consistent in extras slider Add settings guidelines to devguide.md Add workflow to validate XML translation files Add json and markdown to lint workflow + add automation workflow Create global audio player Fix typo: trancoding -> transcoding Fix en_US translation file Make CI throw error for duplicate translation entries Add a production build workflow Show "Actor" when an actor has no role 👥 Contributors​ Jellyfin apps are developed by our great contributors and we couldn't do it without them. Everyone is a volunteer that doesn't get paid by any organizations, so consider donating if you appreciate their work. A big shout-out to all contributors that made this release possible: @RussianCow @1hitsong @cewert @jimdogx @jkim2492 @sevenrats @candry7731 @ApexArray 💾 Downloads & Changelog​ The complete list of changes for this release, including all merged pull requests, can be found on GitHub. Your installed Jellyfin channel should automatically update once available or you can install Jellyfin from the Roku store.Tags:releaseroku'''
