["https://jellyfin.org/docs"]
title = "Introduction | Jellyfin"
description = "Jellyfin is a Free Software Media System that puts you in control of managing and streaming your media. It is an alternative to the proprietary Emby and Plex, to provide media from a dedicated server to end-user devices via multiple apps. Jellyfin is descended from Emby's 3.5.2 release and ported to the .NET Core framework to enable full cross-platform support. There are no strings attached, no premium licenses or features, and no hidden agendas: just a team who want to build something better and work together to achieve it. We welcome anyone who is interested in joining us in our quest!"
full_description = "IntroductionOn this pageWelcome to the Jellyfin Documentation Jellyfin is a Free Software Media System that puts you in control of managing and streaming your media. It is an alternative to the proprietary Emby and Plex, to provide media from a dedicated server to end-user devices via multiple apps. Jellyfin is descended from Emby's 3.5.2 release and ported to the .NET Core framework to enable full cross-platform support. There are no strings attached, no premium licenses or features, and no hidden agendas: just a team who want to build something better and work together to achieve it. We welcome anyone who is interested in joining us in our quest! You can find a list of all available clients here. For more information please see our about page or the FAQ. If you are looking for help, check out this page for all the different communication channels we use. Note: Jellyfin is a fast-moving project that is in its early stages, and this documentation as well as the code may change frequently. Please check back often and do not hesitate to contact us via our Matrix channels or Forum! Getting Started​ Want to get starting using Jellyfin right now? Check out the pages below for how to install Jellyfin on your machine. Arch Debian Ubuntu Fedora CentOS Docker Kubernetes Windows MacOS Generic Linux Alternatively, Jellyfin may be built directly from the source code. Administrator Documentation​ Want to know more about administering a Jellyfin server? Check out these pages! Quick-Start Guide: What to do after you have installed Jellyfin to get it up and running. Migrating: How to migrate Jellyfin. Backup and Restore: How to back up or restore your Jellyfin metadata and configuration. Plugins: How to install and manage plugins. Networking: Networking settings and troubleshooting. Monitoring: Integration with external monitoring software. Hardware Acceleration: Improve transcoding performance on supported hardware. Contributing to Jellyfin​ Want to help out? Check out the pages below for how to contribute. Contribution Guide: General information on contributing to Jellyfin. Plugin Guide: Documentation and resources to get started writing a plugin to extend Jellyfin functionality. Reporting Bugs: How to use our issue tracker on GitHub to report bugs. Requesting Features: How to use our issue tracker on GitHub to request new features or enhancements. Edit this page"
