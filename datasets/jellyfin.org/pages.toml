["https://jellyfin.org/docs/general/installation/windows"]
title = "Windows | Jellyfin"
description = "Install on Windows."
full_description = 'InstallationWindowsOn this pageWindowsWindows installers and builds in ZIP archive format are available here. cautionIf you installed a version prior to 10.4.0 using a PowerShell script, you will need to manually remove the service using the command nssm remove Jellyfin and uninstall the server by remove all the files manually. Also one might need to move the data files to the correct location, or point the installer at the old location. cautionThe Basic Install is the recommended way to run the Jellyfin Server. Using the Advanced/Service mode may experience FFmpeg hardware acceleration issues and is only for advanced users. Install using installer​ Install Download the latest version. Run the installer. (Optional) When installing as a service (not recommended), pick the service account type. If everything was completed successfully, Jellyfin is now running. Open your browser at http://your_local_IP_address:8096 to finish setting up Jellyfin. Update Download the latest version. Close or Stop Jellyfin if it is running. Run the installer. If everything was completed successfully, the new version is installed. Uninstall Go to Add or remove programs in Windows. Search for Jellyfin. Click Uninstall. Install manually (portable)​ Install Download and extract the latest version. Create a folder jellyfin at your preferred install location. Copy the extracted folder into the jellyfin folder and rename it to system. Create jellyfin.bat within your jellyfin folder containing: To use the default library/data location at %localappdata%: <--Your install path-->\jellyfin\system\jellyfin.exe To use a custom library/data location (Path after the -d parameter): <--Your install path-->\jellyfin\system\jellyfin.exe -d <--Your install path-->\jellyfin\data To use a custom library/data location (Path after the -d parameter) and disable the auto-start of the webapp: <--Your install path-->\jellyfin\system\jellyfin.exe -d <--Your install path-->\jellyfin\data -noautorunwebapp Run jellyfin.bat Open your browser at http://<--Server-IP-->:8096. Update Stop Jellyfin Rename the Jellyfin system folder to system-bak Download and extract the latest Jellyfin version Copy the extracted folder into the jellyfin folder and rename it to system Run jellyfin.bat to start the server again Rollback Stop Jellyfin. Delete the system folder. Rename system-bak to system. Run jellyfin.bat to start the server again. Edit this page'
