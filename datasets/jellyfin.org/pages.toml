["https://jellyfin.org"]
title = "The Free Software Media System | Jellyfin"
description = "The volunteer-built media solution that puts you in control of your media. Stream to any device from your own server, with no strings attached."
full_description = "What is Jellyfin?Jellyfin enables you to collect, manage, and stream your media. Run the Jellyfin server on your system and gain access to the leading free-software entertainment system, bells and whistles included.MoviesMoviesEnjoy your entire movie collection, easy to browse and with beautiful artwork.ShowsShowsWatch your favorite shows, automatically sorted by season and ready to binge.MusicMusicListen to music, your artists and your playlists, at home or on the go.Live TV & DVRLive TV & DVRWatch TV and set automatic recordings to expand your library.BooksBooksRead your books, comics, and magazines.PhotosPhotosOrganize your photos and share memories with your friends and family.SyncPlaySyncPlaySharing a movie night remotely has never been so easy.MoviesMoviesEnjoy your entire movie collection, easy to browse and with beautiful artwork.ShowsShowsWatch your favorite shows, automatically sorted by season and ready to binge.MusicMusicListen to music, your artists and your playlists, at home or on the go.Live TV & DVRLive TV & DVRWatch TV and set automatic recordings to expand your library.BooksBooksRead your books, comics, and magazines.PhotosPhotosOrganize your photos and share memories with your friends and family.SyncPlaySyncPlaySharing a movie night remotely has never been so easy.Your media, wherever you areWith a large array of official and third-party clients, Jellyfin is available on most popular platforms. Your media is ready to follow you, wherever you go.WebDesktopAndroidAndroidAppleAppleAmazonAmazonRokuRokuKodiKodiAnd moreFind a ClientSee Jellyfin in ActionThe home screen highlights your media library. The sections can be customized to each user’s individual preferences.The library screen lists your media with options to filter and sort so you can find exactly what you are looking for.The details screen displays all the information about your media.The playback screen gives you the controls you need to play or cast your media or start a SyncPlay session with friends or family.Try the DemoOpen Source InitiativeFree SoftwareJellyfin is Free Software, licensed under the GNU GPL. You can use it, study it, modify it, build it, and distribute it for free, as long as your changes are licensed the same way.Community BuiltThe project relies entirely on contributions from volunteers. Want to help out? There’s lots of ways to do so, and you don’t even have to code! See our contribution guide for more details.No FeesThe Jellyfin server and official clients are free to download, now and always. There are no costs, hidden or otherwise, to use Jellyfin, either for yourself, for your friends, or for your company. All our incidental costs are paid through donations from users like you.Privacy FocusedJellyfin has no tracking, phone-home, or central servers collecting your data. We believe in keeping our software open and transparent. We’re also not in the media business, so the only media you see is your own.Get Started NowCheck out our Getting Started guide to download and set up your server today.Download Jellyfin"
