title = "Excluding a directory | Jellyfin"
description = "Directories, and their respective media files, can be excluded from the library scan. This can be achieved by placing a .ignore file in the directory you want to exclude. As a result, the directory, and it's subdirectories, will be excluded from being scanned and shown to the end user."
full_description = "Server GuideMediaExcluding a directoryExcluding a directory Directories, and their respective media files, can be excluded from the library scan. This can be achieved by placing a .ignore file in the directory you want to exclude. As a result, the directory, and it's subdirectories, will be excluded from being scanned and shown to the end user. tipWhen placing a .ignore file inside a directory, make sure to refresh/ rescan the metadata afterwards for it to be applied. The example given below results in the directories Season 03 and OST being ignored: Shows└── Series (2010) ├── Season 01 │ ├── ... ├── Season 02 │ ├── ... ├── Season 03 │ ├── .ignore │ └── ... └── OST ├── .ignore └── ... cautionCurrently, placing a .ignore file inside an Extras directory does not work.Edit this page"
