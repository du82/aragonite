["https://jellyfin.org/posts/ios-update-150"]
title = "Updating our iOS App | Jellyfin"
description = "Framework updates and minimum system requirements"
full_description = '''Updating our iOS AppJune 8, 2022 · 3 min readAnthony LavadoCore TeamWith Jellyfin Mobile, our main iOS App, we have updated some frameworks that adjust our minimum iOS version. Our main iOS app has been built using Expo. It offers a unique take on a "managed" React Native experience that allows anyone to develop an app for iOS, even without using a Mac. It allowed us to get an app out quickly, and use the web interface that is a part of every Jellyfin install. As time goes on, we keep Expo up to date in order to take advantage of security fixes, and help us use new features in the app itself. With our next app release, we move to Expo 43, which fully supports iOS 15, but must also drop support for iOS 10 and 11. As a result, starting with version 1.5.0 of our Apple app, iOS/iPadOS 12 or newer is required. If your device is still on an older version of iOS, and you currently have the app downloaded, your experience will stay mostly the same for now. The installed version isn't being removed from the store, so you can still re-install it if needed - but your device won't receive any updates for it. As time goes on, and you update your Jellyfin server, you may encounter unexpected behaviour with the older iOS app. If you haven't downloaded it before, or are running into issues, you can try a few different options: If your server is local (on your home network), try VLC media player. It still supports devices as old as iOS 9, and can access the DLNA server built-in to Jellyfin. If your server is remote, or you have the DLNA server disabled, you can try using Safari to access the normal Jellyfin interface. If you can't seem to get anything to work, feel free to get in touch and visit us in chat, or on Reddit. We've got a great community of users who are always willing to help, and we're usually around as well. All the links are available on our contact page. Thank you for using Jellyfin and supporting us this far. Our iOS app is largely worked on by only one contributor, @thornbill, who gives generously of his spare time to develop the app and make improvements to it and our web interface. He, along with a few of our contributors have donation pages setup either through GitHub Sponsors, or other sites like LiberaPay, Patreon and more. If you'd like to support any of them, please see their profiles for more information. If you'd like to support Jellyfin as a whole (infrastructure and equipment costs only), you can visit our public ledger on OpenCollective. We're pretty well covered for now, so consider donating to contributors first.'''
author = "https://github.com/anthonylavado"
