["https://jellyfin.org/posts/android-v2.3.0"]
title = "Jellyfin Android v2.3.0 - Improved Integrated Player | Jellyfin"
description = "Enjoy a more polished Jellyfin experience on your phone"
full_description = "Jellyfin Android v2.3.0 - Improved Integrated PlayerAugust 1, 2021 · 3 min readMax RumpfAndroid Mobile LeadAfter a prolonged beta testing period, we're excited to announce that version 2.3.0 of the Jellyfin Android app is now available! A lot things have changed since the last stable release, mainly to improve stability and compatibility with the Jellyfin Server. Communication between the Android app and the server was updated to use a new library that supports more modern technologies which improves the development process and allows us to support additional features in the future, eventually resulting in a fully native app that's specifically optimized for phones. Due to the library changes, the new version of the app only supports servers of version 10.7.0 or later, so make sure your server is up-to-date before you install the update! Integrated Video Player Improvements​ The integrated/native video player was especially reworked and supports playlists now (so that you can binge-watch your shows more easily), allows setting the playback speed and introduced an option in the client settings to remember the screen brightness applied through gestures. The Picture-in-Picture (PiP) mode now respects the aspect ratio of your media and will have smooth animations when entering it. Soon, you'll also be able to select a bitrate limit to force transcoded streaming and reduce data usage, so please look forward to the next updates! Polishing and Bug Fixes​ You can now set the location to download content to in the client settings. There were also a lot of bug fixes which will improve the experience with the app, not only in the native player but also for Android Auto support and when casting media to Chromecast. Download Now​ Direct downloads are always available from our repository. Full Release Notes​ The full (technical) release notes are available on GitHub. Contributors​ As always, lots of great people contributed in this release: Jellyfin Team​ @nielsvanvelzen - Sponsor @Maxr1998 - Sponsor @h1dden-da3m0n - Special shout-out for helping with the migration to GitHub Actions! @ferferga - Sponsor Others​ @CarlosOlivo @fedesenmartin @ThreeFive-O @Codex- @diederikdehaas Contribute​ If you have some experience with Android development and are interested in contributing yourself, feel free to dive into the source code on GitHub and open pull requests! Alternatively, you can help translating the app into your language on our Weblate."
