["https://jellyfin.org/docs/general/server/plugins"]
title = "Plugins | Jellyfin"
description = "Jellyfin has a collection of optional plugins that can be installed to provide additional features. To create a plugin, see the plugin template repository."
full_description = '''Server GuidePluginsOn this pagePlugins Jellyfin has a collection of optional plugins that can be installed to provide additional features. To create a plugin, see the plugin template repository. Installing​ Catalog​ Many plugins are available in a repository hosted on our servers, which can be easily installed using the plugin catalog in the settings. At the moment many of these are still being updated frequently so the version number may not be accurate. There are several different categories that can indicate what kind of functionality the plugins may provide. The plugins folder is located in different locations depending on your install: %UserProfile%\AppData\Local\jellyfin\plugins for direct installs %ProgramData%\Jellyfin\Server\plugins for tray installs After that start Jellyfin back up, and reinstall each plugin you want to update using the above method from the catalog. Plugin settings should be retained if you do not delete the .xml files from the <direct or tray path>\plugins\configurations folder. Authentication: Add new authentication providers, such as LDAP. Channels: Allow streaming remote audio or video content. General: Plugins that serve general purposes, such as sync with Trakt.tv, or Kodi. Live TV: Plugins that help with connecting to tuners, such as NextPVR, or TVHeadend. Metadata: Scrape metadata from a new source or modify existing metadata. Notifications: Allow notifications to connect to many different services, including Gotify and Slack. Manual​ All plugins hosted on the repository can be built from source and manually added to your server as well. They just need to be placed in the plugin directory, which is something like /var/lib/jellyfin/plugins/ on most Linux distributions. Once the server is restarted any additions should automatically show up in your list of installed plugins. If you can't see the new plugin there may be a file permission issue. List​ Official Plugins​ Metadata Plugins​ Manage your Anime in Jellyfin with several different metadata providers and options for organizing your collection. Anilist​ Provides metadata support from Anilist. Link: Github Anidb​ Provides metadata support from Anidb. Link: Github Anisearch​ Provides metadata support from Anisearch. Link: Github Bookshelf​ Supports several different metadata providers and options for organizing your collection. Links: GitHub Kitsu​ Provides metadata support from Kitsu. Github Fanart​ Scrape poster images for movies, shows, and artists in your library from fanart.tv. Links: GitHub Kodi Sync Queue​ Helps keep Jellyfin for Kodi in sync with the library without needing to run periodic full scans. Links: GitHub Local Intros​ Use pre-roll intro videos from local storage. Links: GitHub LDAP​ Authenticate your Jellyfin users against an LDAP database, and optionally create users who do not yet exist automatically. Allows the administrator to customize most aspects of the LDAP authentication process, including customizable search attributes, username attribute, and a search filter for administrative users (set on user creation). The user, via the "Manual Login" process, can enter any valid attribute value, which will be mapped back to the specified username attribute automatically as well. Links: GitHub NextPVR​ Provides access to Live TV, Program Guide, and Recordings from NextPVR. Links: GitHub Open Subtitles​ Download subtitles from the internet to use with your media files from Open Subtitles. You can configure the languages it downloads on a per-library basis. Links: GitHub Subtitle Extract​ Plugin to automatically extract embedded subtitles in media. This avoids delayed subtitles during streaming if the client does not support direct play and requests subtitles. Links: GitHub Playback Reporting​ Collect and show user playback statistics, such as total time watched, media watched, time of day watched, and time of week watched. Can keep information for as long as you want or can cull older information automatically. Also allows you to manually query the data collected so you can generate your own reports. Links: GitHub Reports​ Generate reports of your media library. Links: GitHub TMDb Box Sets​ Automatically create movie box sets based on TMDb collections. Configurable minimum number of films to be considered a boxset. Boxsets are created as collections and includes a scheduled task to ensure that new media is automatically put into boxsets. Links: GitHub Trakt​ Record your watched media with Trakt. Links: GitHub TVHeadend​ Manage TVHeadEnd from Jellyfin. Click here for plugin support. Links: GitHub 3rd-Party Plugins​ Ani-Sync​ Ani-Sync lets you synchronize/scrobble your Jellyfin Anime watch progress to popular services like MyAnimeList, AniList, Kitsu. Links: GitHub Kinopoisk metadata plugin​ Fetches metadata from https://kinopoisk.ru. This site is popular in the Russian-speaking community and contains almost no English-language information. Can provide movies and series rating, description, actors and staff, trailers and so on. Links: GitHub Last.FM​ Enables audio scrobbling to Last.FM as well as a metadata fetcher source. Links: GitHub Merge Versions​ Automatically group every repeated movie. Links: GitHub Shokofin​ A plugin to integrate your Shoko database with the Jellyfin media server. Links: GitHub Skin Manager​ Download and manage the most popular skins. Links: GitHub Themerr​ Plugin for Jellyfin that adds theme songs to movies and tv shows using ThemerrDB. Links: GitHub YouTube Metadata​ Downloads metadata of YouTube videos with a YouTube API key. Links: GitHub TubeArchivistMetadata​ A plugin to integrate your TubeArchivist library with Jellyfin, providing metadata and organizing media. Links: GitHub Repositories​ Official Jellyfin Plugin Repositories​ JellyfinOfficialRepository URLhttps://repo.jellyfin.org/files/plugin/manifest.jsonJellyfin UnstableOfficialUnstableRepository URLhttps://repo.jellyfin.org/files/plugin-unstable/manifest.json 3rd-Party Plugin Repositories​ 9p4's Single-Sign-On (SSO) RepoThird PartyRepository URLhttps://raw.githubusercontent.com/9p4/jellyfin-plugin-sso/manifest-release/manifest.jsonIncludes9p4's Single Sign On PluginAni-Sync RepoThird PartyRepository URLhttps://raw.githubusercontent.com/vosmiic/jellyfin-ani-sync/master/manifest.jsonIncludesAni-Syncdanieladov's RepoThird PartyRepository URLhttps://raw.githubusercontent.com/danieladov/JellyfinPluginManifest/master/manifest.jsonIncludesMerge VersionsSkin ManagerTheme Songsdkanada's RepoThird PartyRepository URLhttps://raw.githubusercontent.com/dkanada/jellyfin-plugin-intros/master/manifest.jsonIncludesIntrosk-matti's RepoThird PartyRepository URLhttps://raw.githubusercontent.com/k-matti/jellyfin-plugin-repository/master/manifest.jsonIncludesSMS NotificationsNapiSubLinFor's RepoThird PartyRepository URLhttps://raw.githubusercontent.com/LinFor/jellyfin-plugin-kinopoisk/master/dist/manifest.jsonIncludesKinopoisk metadata pluginLizardByte's RepoThird PartyRepository URLhttps://app.lizardbyte.dev/jellyfin-plugin-repo/manifest.jsonIncludesThemerrShokoAnime's RepoThird PartyRepository URLhttps://raw.githubusercontent.com/ShokoAnime/Shokofin/metadata/stable/manifest.jsonIncludesShokofinTubeArchivist's RepoThird PartyRepository URLhttps://raw.githubusercontent.com/tubearchivist/tubearchivist-jf-plugin/master/manifest.jsonIncludesTubeArchivistMetadataEdit this page'''
