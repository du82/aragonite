["https://jeremycarlson.com/about/testimonials"]
title = "Testimonials – Jeremy Carlson"
full_description = "Testimonials “Jeremy’s work was always timely and his input was integral to the success of our tenth anniversary.” It was a pleasure to work with Jeremy Carlson and Carlson Design. Our tenth anniversary report is an engaging and eye-catching centerpiece for our members and existing and prospective funders. Jeremy’s work was always timely and his input was integral to the success of our tenth anniversary. Carlson Design was crucial to the success of our Gone to the Well Once Too Often campaign to reform groundwater laws in the West. The design elements created a reader-friendly and accessible report on a complicated topic and we continue to use Gone to the Well as our key outreach tool in our work with legislators and local communities. —David Stillwell, Trout Unlimited Western Water Project Jeremy is a wonderfully creative person. Our collaboration on behalf of several of my clients over the years has produced great results, and I can recommend Jeremy highly for his creativity and grasp of communicating ideas through graphics. —Terri Lee, Lively Marketing! The Wobble Wedge website has grown into a nice sales tool. Even though we have thrown very little effort at marketing it. By the way, the new 200 WW jar you did is sailing off the shelves. Their sales have already doubled and are still trending up at a steep pace…nice job. —Robert Bellows, Focus 12, Inc. We love our new website and have gotten a lot of positive feedback about it. Jeremy was responsive and easy to work with. —Jody Pierce, Director, Pennock Center for Counseling Try me. You’ll like me."
