["https://jeremycarlson.com/about"]
title = "About Me – Jeremy Carlson"
full_description = "About Me Elegant visual and technical solutions. I create logos, web sites, brochures, reports, illustration and more. Each is a unique solution to a client’s problem. “It was a pleasure to work with Jeremy …” —David Stillwell, Trout Unlimited read more » Small is beautiful. As a freelance designer, I stay directly in contact with my clients, and I am intimately involved in the finer details as well as the overall scope of my work. Clients appreciate my ability to leap between artistic sensibilities and technical considerations. Care for the details. “Meet one of the best graphic designers in Colorado.” —Judy Robinson, Centennial Printing Whether I am producing an annual report, or developing a web site, I am deeply engaged in my craft. As a web developer, I pay attention to finicky details–such as accessibility, compliance with web standards, cross-browser compatibility, and search engine optimization (SEO)–so you can focus on your work. I have a passion for helping you connect to your clients. I want you to thrive. If you have a problem, maybe I can help. Let’s talk."
