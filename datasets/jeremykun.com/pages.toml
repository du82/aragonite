title = "Proof Gallery || Math ∩ Programming"
full_description = 'Proof GalleryMathematics (like programming) is often called an art form. This makes mathematics the art of argument in the sense that the beauty of a proof lies in its method. An aesthetic proof is an elegant, inspired, concise, and beautiful expression. Here I present a collection of aesthetic proofs I’ve come across over the years.No Background NeededArea of a triangle within a rectangle Number of games in a tournamentComputing percentages easierThe party problemTiling chessboards with dominoesA rook gameThe handshake lemma (with double counting)Number Theory & CombinatoricsSums of k powersSum of the first n numbers, sum of the first n squaresAn arithmetic expression for $\binom{n}{2}$There are infinitely many primes (a lower bound on $\pi(n)$)Ramsey number lower bound $R(m, m)$Learning a single variable polynomialA parlor trick for SETLinear AlgebraA spectral analysis of Moore graphsA parlor trick for SETGeometryDouble Angle Trigonometric FormulasGeometric series with geometric proofsThree circles and collinear centers of dilationMobius transformations are isometries of a sphereThe square root of two is irrational (geometric proof)Logicn-Colorability is equivalent to finite n-colorabilityAnalysisCauchy-Schwarz inequality (by amplification)Abstract AlgebraThe smallest non-cyclic simple group has order 60$\mathbb{Z}[\sqrt{2}]$ has infinitely many unitsComplexity TheoryClassic Nintendo games are NP-hardTesting Polynomial EqualityEncoding boolean logic in polynomialsTopologyThere are infinitely many primesThe Fundamental Theorem of AlgebraWith Liouville’s Theorem (complex analysis)With fundamental groups (algebraic topology)With Galois theory (group theory & field theory)With Picard’s Little Theorem (complex analysis)False Proofs1 = 2 (with algebra)1 = 2 (with calculus)2 = 4 (with infinite power towers)There are finitely many primes31.5 = 32.5All horses are the same colorThe reals are countableEvery number can be described in fewer than twenty words'
