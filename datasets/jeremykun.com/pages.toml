["https://jeremykun.com/2024/10/30/how-this-blog-does-indieweb"]
title = "How This Blog Does IndieWeb || Math ∩ Programming"
description = """
This article will explain how the blog is organized at a technical level, and show how I implemented various IndieWeb features.
Table of Contents:
Motivation Structure and Deployment Static search index Running scripts via GitHub Actions Social media syndication and the “shortform” section Links to syndicated versions at the end of each post Warning for a too-long first paragraph Triggering this workflow automatically after deployment Blogroll (the “What I’m Reading” page) Chrome extension Webmentions and referencing external discussion threads Bridgy Hacker News backlinks Outgoing webmentions DOIs Dead link checker Motivation Earlier this year I migrated this blog off Wordpress to the Hugo static site generator."""
full_description = '''How This Blog Does IndieWeb#indieweb #posse 2024-10-30This article will explain how the blog is organized at a technical level, and show how I implemented various IndieWeb features.Table of Contents:MotivationStructure and DeploymentStatic search indexRunning scripts via GitHub ActionsSocial media syndication and the “shortform” sectionLinks to syndicated versions at the end of each postWarning for a too-long first paragraphTriggering this workflow automatically after deploymentBlogroll (the “What I’m Reading” page)Chrome extensionWebmentions and referencing external discussion threadsBridgyHacker News backlinksOutgoing webmentionsDOIsDead link checkerMotivationEarlier this year I migrated this blog off Wordpress to the Hugo static site generator. Over the last six months I’ve been gradually sculpting and shaping this digital place to feel more like my cozy corner of the web. This was partly motivated by withering social media, partly inspired by the IndieWeb POSSE philosophy (Publish on your Own Site, Syndicate Elsewhere), and partly driven by my desire to do more with the space like embed Javascript demos and have footnotes and endnotes.So one of the big new features is that I have a “shortform” section on the blog, which corresponds roughly to threads I would post on Twitter or Mastodon. Syndication automatically converts those to full threads on all platforms, with a link back to the website.The main constraint I had for myself when doing all this was to avoid managing a continuously running server, and certainly not deal with self-hosting. As the rest of the article shows, this means I rely heavily on GitHub Actions to run automation, as well as Netlify to trigger deployment webhooks and various third-party services for webmentions.Depending so heavily on GitHub Actions mildly triggers my reliability brain, but because the custom features are implemented in standard python scripts, and the “databases” are also stored in flat files in the repo, if something goes awry migrating off GH Actions should be relatively straightforward.As a standard disclaimer, the scripts in this article are very hacky and specific to my setup. I will likely never take the time to make them into something general-purpose. It’s my cozy corner and it can be a little messy.Structure and DeploymentThe blog is a relatively standard Hugo site using the Paperesque theme with various customizations. The blog lives in a private GitHub repository (with the theme fully vendored within), and deploys to Netlify on every push.Here is my hugo.tomlbaseURL = 'https://www.jeremykun.com/' languageCode = 'en-us' title = 'Math ∩ Programming' theme = 'paperesque' # This parameter is branched on in templates to determine if MathJAX should be # served when the page is loaded. [params] math = true [[params.topmenu]] name = "Main Content" url = "main-content/" [[params.topmenu]] name = "Primers" url = "primers/" [[params.topmenu]] name = "All articles" url = "posts/" [[params.topmenu]] name = "About" url = "about/" [[params.topmenu]] name = "rss" url = "rss/" [markup.goldmark.extensions.passthrough] enable = true [markup.goldmark.extensions.passthrough.delimiters] inline = [['$', '$'], ['\(', '\)']] block = [['$$', '$$'], ['\[', '\]']] Note the extension to allow Hugo to work well with standard TeX delimiters, I actually added that to Hugo in v0.122.0. See the docs here, and note there is still one bug I haven’t figured out how to fix.And my netlify.toml:[build] # npx -y pagefind ... runs pagefind to create a static search index command = "hugo --gc --minify && npx -y pagefind --site public" publish = "public" # exclude flat files in scripts/ that contain database mappings for published # social media posts ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)scripts/*.txt'" [build.environment] HUGO_VERSION = "v0.122.0" TZ = "America/Los_Angeles" [[redirects]] from = "/feed/" to = "/index.xml" status = 301 [context.deploy-preview] command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL && npx -y pagefind --site public" Static search indexThe build command above has an extra step to initialize a static search index using Pagefind. When this runs, it creates files such that this just works.<div style="margin: 20px 0px 20px 0px;"> <link href="/pagefind/pagefind-ui.css" rel="stylesheet"> <script src="/pagefind/pagefind-ui.js"></script> <div id="search"></div> <script> window.addEventListener('DOMContentLoaded', (event) => { new PagefindUI({ element: "#search", showSubResults: true }); }); </script> </div> I slapped it in themes/paperesque/layouts/partials/homepage_display_section.html and it creates the search bar and dynamic experience you see on the blog homepage. I have not noticed it producing significant additional bandwidth usage, especially not compared to serving images.Running scripts via GitHub ActionsBecause the site is static, all of the automation on the blog is done through GitHub Actions, modifying static files in the repository and triggering a new deployment if any files change.To accomplish this, I utilize the workflow_dispatch trigger in GitHub Actions, which allows one to remotely trigger a workflow via an HTTP POST request, optionally with arguments passed in the URL.For example, my social media syndication script starts like this:#.github/workflows/syndicate.yml name: Syndicate to social media permissions: contents: write on: workflow_dispatch: schedule: # https://crontab.guru/once-a-day - cron: '0 0 * * *' To trigger this action remotely, I can POST to https://api.github.com/repos/j2kun/math-intersect-programming/actions/workflows/syndicate.yml/dispatches with the following headers{ "Accept": "application/vnd.github+json", "Authorization": "Bearer <API_KEY>", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/x-www-form-urlencoded" } where <API_KEY> is a GitHub personal access token with permissions to trigger workflows. (I have it set to “Read access to actions variables, metadata, and secrets” and “Read and Write access to actions”) I will show how this is set up for the various instances in which it’s invoked in the later sections. As a bonus, workflow_dispatch gives a nice button in the GitHub Actions UI to trigger the workflow, which is helpful for debugging.Once I can trigger a workflow remotely, the rest of the workflow involves checking out the repo, installing dependencies of the script, running a script that does whatever the action is supposed to do, and commit and push any changes to main.The script running is simple, but this was the first time I tried actually pushing commits from a GH Action workflow. To do this, I set up a GITHUB_TOKEN secret that has write permissions, and then each script has a set of steps that looks like this:- name: Run my_script.py run: | python -m scripts.my_script env: SOME_SECRET: ${{ secrets.SOME_SECRET }} - name: Commit changes run: | git config --local user.name ${{ github.actor }} git config --local user.email "${{ github.actor }}@users.noreply.github.com" test -z "$(git status --porcelain)" || git add <FILE_THAT_COULD_BE_CHANGED> test -z "$(git status --porcelain)" || git commit -m "<SOME MESSAGE>" - name: Push changes uses: ad-m/github-push-action@master with: github_token: ${{ secrets.GITHUB_TOKEN }} branch: main The git status --porcelain command returns an empty string if there are no changes to commit, and test -z returns true if the argument string is empty, so this skips the git add and git commit commands if there is nothing to commit.This boilerplate is repeated often enough in the next few sections that I will omit it and just show the script that is being run.Social media syndication and the “shortform” sectionThe big one is social media syndication. Here I do a few things:For long articles, post a single social media post with the title of the article and a link to it.For a new special “shortform” section of the blog, split the article into posts and publish them on each social media platform as a thread.For each syndicated post, save the URL of the syndicated post in a text file (“database”), so I can know it’s been processed in the future.For each syndicated post, add a link to the end of the post to the syndicated post, so readers can “discover” that I syndicate stuff and see any associated discussion.Each social media platform I want to syndicate to gets its own script, but they all have a common structure. Each has a flat file stored in the repository where each line of the file contains a pair of the blog post URL and the syndicated post URL. E.g., published_mastodon.txt has as its first linehttps://www.jeremykun.com/shortform/2024-05-06-1018/ https://mathstodon.xyz/@j2kun/112426452236288901 Then each syndication script loads the markdown files for all relevant posts from the repo, determines their canonical URL, looks them up in the database to see if they’ve been syndicated, and syndicates each one that hasn’t. Finally, it writes the database with any new entries back to disk.I have a set of helpers in a “utils” module that I use to parse markdown and convert articles to threads, among other things. I copied the current utils.py into a GitHub gist for full reference, and will highlight some of the more relevant parts shortly.Then there is a common syndication.py that handles the common logic across platforms:import pprint from scripts import utils as utils def publish_single_post( publish_callback, abspath: str, published_posts, dry_run=False, **kwargs ): """ publish_callback takes as input the post and any additional args passed in kwargs, and returns the URI to the post that should be stored in the databse. """ print(f"Processing {abspath} as single post") blog_post_permalink = utils.canonical_url(abspath, post_type="") with open(abspath, "r") as infile: post = utils.title_and_link_as_post(infile.read(), blog_post_permalink) # a debug print of the posts about to be posted print(f"Printing post for {abspath}:\n----------------------") print(f"\n{post}") print("\n----------------------\n") if dry_run: print("Dry run enabled, skipping post creation") return print(f"Publishing post for {abspath}") output_uri = publish_callback(post, **kwargs) print(f"Successfully posted post {output_uri}") published_posts[blog_post_permalink] = output_uri def publish_thread( publish_callback, post_adjuster, abspath: str, published_posts, dry_run=False, **kwargs, ): """ publish_callback takes as input the list of posts and any additional args passed in kwargs, and returns the URI to the root post that should be stored in the databse. post_adjuster takes as input the list of posts and returns the list of posts that should be published, adjusting the length and/or splitting them as needed for the platform. """ print(f"Processing {abspath} as thread") blog_post_permalink = utils.canonical_url(abspath) convert_math = kwargs.pop("convert_math", True) with open(abspath, "r") as infile: posts = utils.convert_post_to_thread( infile.read(), blog_post_permalink, convert_math=convert_math, ) posts = post_adjuster(posts, blog_post_permalink=blog_post_permalink, **kwargs) print(f"Printing post thread for {abspath}:\n----------------------") for i, post in enumerate(posts): print(f"\n{i}.\t{post}") print("\n----------------------\n") if dry_run: print("Dry run enabled, skipping post creation") return print(f"Publishing post thread for {abspath}") root_uri = publish_callback(posts, **kwargs) published_posts[blog_post_permalink] = root_uri def syndicate_to_service( name: str, database_filepath, thread_publisher, thread_adjuster, post_publisher, since_days=1, dry_run=False, **kwargs, ): print("Syndicating to", name) # dict mapping Blog URL to first post url in published thread. git_root = utils.get_git_root() database_path = git_root / database_filepath published_posts = utils.load_database(database_path) print(f"Existing {name} posts from {database_path}:") pprint.pp(published_posts) posts_to_try = utils.get_blog_posts() posts_to_publish = utils.get_posts_without_mapping( posts_to_try, published_posts, since_days=since_days ) try: for abspath in posts_to_publish["shortform"]: publish_thread( thread_publisher, thread_adjuster, abspath, published_posts, dry_run=dry_run, **kwargs, ) for abspath in posts_to_publish["posts"]: publish_single_post( post_publisher, abspath, published_posts, dry_run=dry_run, **kwargs, ) finally: print("Writing successful post URLs to disk") utils.dump_database(published_posts, database_path) The main part is syndicate_to_service, which loads the database file, extracts the posts and finds the ones that haven’t been syndicated yet, and then decides to publish a thread or single post. The publish_thread function is the tricky part. It takes two callbacks publish_callback and post_adjuster, which, respectively, implement the platform specific ways to publish all the posts in a thread and “adjust” a thread to fit the platform’s constraints.By “adjust” I mean that platforms differ in the allowed length of a post, as well as how to count the character contributions of links and such. It’s also responsible for adding the link back to the original post. The slightly devious part is that the post_adjuster and publish_callback receive **kwargs from passed through from syndicate_to_service, which allow the original caller to propagate platform-specific options (mainly the client for the platform’s API).The Mastodon client is the simplest:import os import fire from mastodon import Mastodon from scripts import syndication as syndication # A simple text file with two urls per line DATABASE_FILE = "scripts/published_mastodon.txt" def mastodon_post_publisher(post: str, mastodon_client=None, **kwargs): if not mastodon_client: raise ValueError("mastodon_client must be provided") status_dict = mastodon_client.status_post(post) return status_dict['url'] def mastodon_thread_adjuster(posts, blog_post_permalink=None, **kwargs): if not blog_post_permalink: raise ValueError("blog_post_permalink must be provided") posts[0] += f"\n\nArchived at: {blog_post_permalink}" return posts def mastodon_thread_publisher(posts, mastodon_client=None, **kwargs): if not mastodon_client: raise ValueError("mastodon_client must be provided") toots_for_post = [] for i, toot in enumerate(posts): reply_id = toots_for_post[-1]["id"] if len(toots_for_post) > 0 else None status_dict = mastodon_client.status_post(toot, in_reply_to_id=reply_id) print( f"Successfully posted toot {i} of the thread: " f"{status_dict['id']} -> {status_dict['url']}" ) toots_for_post.append(status_dict) return toots_for_post[0]["url"] def publish_to_mastodon(since_days=1, dry_run=False): """Idempotently publish shortform and regular posts to mastodon.""" # File generated by scripts/login_with_mastodon.py or else set in # environment for headless usage in GH actions. mastodon_client = Mastodon( api_base_url="https://mathstodon.xyz", access_token=os.getenv( "MASTODON_TOKEN", "scripts/jeremykun_tootbot_usercred.se'''
