title = "A High-Level Technical Overview of Fully Homomorphic Encryption || Math ∩ Programming"
description = """
About two years ago, I switched teams at Google to focus on fully homomorphic encryption (abbreviated FHE, or sometimes HE). Since then I’ve got to work on a lot of interesting projects, learning along the way about post-quantum cryptography, compiler design, and the ins and outs of fully homomorphic encryption.
If you’ve heard about FHE and you’re a software person, you’ve probably heard two things: it lets you run programs directly on encrypted data without ever decrypting it; and it’s still too slow to be useful for anything."""
full_description = 'A High-Level Technical Overview of Fully Homomorphic Encryption#cryptography #fhe #homomorphic encryption #linear algebra #lwe #mathematics #programming #rlwe 2024-05-04About two years ago, I switched teams at Google to focus on fully homomorphic encryption (abbreviated FHE, or sometimes HE). Since then I’ve got to work on a lot of interesting projects, learning along the way about post-quantum cryptography, compiler design, and the ins and outs of fully homomorphic encryption.If you’ve heard about FHE and you’re a software person, you’ve probably heard two things: it lets you run programs directly on encrypted data without ever decrypting it; and it’s still too slow to be useful for anything. But beyond that, there aren’t a lot of resources that provide a survey of the field that’s more accessible than a 40-page research paper (if you want that, here’s one from 2022). This article will provide that overview—technical, but still high level enough that you can get a better sense for how this stuff works and where the field is headed. There is also a nice brief history of FHE research over at FHE.org.Disclaimers: Because I am two years young in this field, I feel obliged to warn you that I’m not an expert. I haven’t published any original research in FHE, and there are decently large gaps in my knowledge. However, I’m coming to this field with an eye toward integrating as many useful techniques as possible into my current main project: the HEIR compiler toolchain. As such, I don’t have a bias toward any particular approach to FHE. I’m also not going to include a timeline of publications or a citation graph of incremental improvements. Instead, I’m going to focus on the subset of techniques that, from my perspective, are at the forefront of the field.Table of contents:The highest-level viewCommonalities of FHE schemesLWE and RLWEBasic operations and dealing with noiseResidue number systemsDouble-CRTGadget decompositionsIndividual FHE schemesBFV and BGV (integer/fixed-point arithmetic)CKKS (approximate arithmetic)CGGI (boolean/short integer arithmetic)Beyond SchemesHardware accelerationSoftwareWriting FHE programsGetting involvedThanksThe highest-level viewHere’s the explanation of homomorphic encryption I give to my fellow software engineers over lunch.Homomorphic encryption lets you encrypt data in such a way that you can run programs on it without ever decrypting it. This means that the computer running the program has no access to the underlying data while running the program—neither via intermediate computed values, nor even the result. In particular, if a nefarious human had access to the machine’s raw memory, they still could not learn any information about the underlying data (without breaking the cryptography). A user sends the program an encrypted input, and when the program is done, the encrypted result is sent back to the user to decrypt.Running a program on encrypted data sounds magical. It works by choosing an encryption scheme that is “compatible” with addition and multiplication in the following sense:Adding ciphertexts gives you an encryption of the sum of the underlying plaintexts.Multiplying two ciphertexts give you an encryption of the product of the underlying plaintexts.Given this power, you can encrypt your data bit by bit, express your program as a boolean circuit—an XOR gate is addition and an AND gate is multiplication—and simulate the circuit. Since XOR and AND form a universal basis for boolean logic, you can always decompose a circuit this way.1To hammer my point home about how FHE can—in theory—handle universal computation, both Conway’s Game of Life and a complete processor architecture have been implemented in FHE.There are four main caveats to this. First, a boolean circuit alone is not enough to do everything computers can do. Circuits always terminate, so without doing something more, you can’t write programs that loop infinitely. Transcendental functions like sine and exponentiation have their own challenges, as emulating them with bit arithmetic is often infeasible for the reason given next.Second, simulating circuits is slow, especially with the overhead of doing cryptography for every gate. Generously, a modern boolean-gate FHE implementation takes on the order of 1 millisecond to evaluate a single gate without any special hardware acceleration. Compare that to an older CPU running at 2 GHz and requiring 4 clock cycles to compute a single (32-bit!) instruction, that’s on the order of 1 nanosecond per operation. If you did a naive circuit decomposition without anything else, running FHE on CPU is at least a million times slower than the corresponding unencrypted program.2Third, the cryptographic guarantee implies limitations on what sorts of optimizations you could use (even if you didn’t use the boolean circuit approach), because realizing that optimization would necessarily break the cryptography. For example, it is not be possible to write an FHE program that uses fewer instructions than the program’s worst-case input. Doing so would reveal information that the input is not the worst-case, which contradicts the security of the cryptography. Instead, an FHE program must eagerly compute all branches of if-statements, and then use a select statement to decide which result should be used. The same reasoning applies to loops: all loops must run through their maximum iteration count, and effectively this means that all loops must have statically-known upper bounds.Fourth, there is a bandwidth concern. FHE encryption schemes generally increase the size of the data being encrypted, and the user must send the server a special set of encryption keys to enable the computation, which are relatively large as well. The special keys need only be generated and sent once and can be used for all future computations, but they can easily be gigabytes in size. In one example FHE scheme with lightweight keys, a ciphertext encrypting a single integer is on the order of 25 KB, and the special keys are about 0.5 GB. In others, 16,000 or more integers are packed into a single ciphertext of similar size, but the keys can be 10s of GiBs.I will describe the various ways that FHE schemes work with or around these limitations in later sections.Commonalities of FHE schemesThis section will give a mildly-technical overview of how the encryption schemes underlying FHE work. The next section will provide more specific details of specific FHE schemes and their differing capabilities.LWE and RLWEAll modern FHE schemes encrypt their data using effectively the same cryptographic foundation: a noisy dot product. The simplest version of this actually used in an FHE scheme is called the Learning With Errors problem, or LWE.LWE encryption supports encrypting small-bit-width integers by placing those bits in the most significant bits of a machine word—for simplicity, say it’s a 4-bit integer in the top-most bits of a 32-bit integer with all the other bits initialized to zero, and call that whole encoded plaintext $m$. The secret key $s$ is a random binary vector of some fixed length $n$ chosen to achieve a certain security—say $n=800$. Then to encrypt, you sample a random length-$n$ vector of 32-bit integers $a$, take a dot product with the secret key $s$, add the message $m$, and then add some random noise from a carefully-chosen distribution that is intimately tied to the security of the scheme. The encrypted value is both the random samples chosen, as well as the noise-masked result, i.e., $(a, a \cdot s + m + \textup{noise})$. More precisely, in codedef encrypt(m, s, a, noise): # the 28 below would realistically come from a config clean_product = np.dot(a, s) + (m << 28) obfuscated_product = clean_product + noise return np.append(a, obfuscated_product) The noise distribution is the most mysterious part, and I won’t go into much detail here, but in most cases it’s taken to be a symmetric integer-valued Gaussian distribution, centered at zero with a tunable variance. Larger variance implies higher security, but as I’ll discuss more later, it reduces the number of homomorphic operations one can apply before the underlying message is corrupted, which in turn hurts performance because expensive cleanup operations are needed to recover from high noise ciphertexts.3LWE decryption then reverses this process: re-compute the dot product and subtract it from the output of the encryption. But at the end you need to apply a rounding step to remove the noise that was added to the ciphertext during encryption. Because the message is in the highest-order bits of the message (say, bits 28-31), and because the noise added was not very large, rounding to the nearest multiple of $2^{28}$ removes it.def decrypt(ciphertext, secret_key): obfuscated_plaintext = ciphertext[-1] - np.dot(ciphertext[:-1], secret_key) return round_to_power_of_2(obfuscated_plaintext , 28) The cryptographic guarantee is that, given a large sample of encryptions of a message with the same secret key, one cannot learn the secret key or the underlying message with any nontrivial probability above random guessing. This is effectively a hard machine learning problem: try to learn a fixed function $f(a) = a \cdot s + m$ from a family of possible functions parameterized by $s$ and $m$. The learner may sample uniformly random input-output pairs, but the outputs are slightly perturbed from their true values. Without the perturbance, this problem is equivalent to solving a linear system and would be easy. With the perturbance, nobody knows how to solve it in polynomial time. There is vast literature on why LWE (or even simpler problems) should be hard to solve. Here is a survey on the best known attacks.LWE is the front-facing encryption used for the CGGI cryptosystem, described in more detail later, but most of the other FHE schemes use a generalization of LWE to polynomial arithmetic, called Ring Learning With Errors (RLWE).In RLWE, the scalar multiplications and additions from LWE are upgraded to polynomial multiplications and additions. Instead of operations being done modulo a machine word size, operations are done modulo a “polynomial modulus,” and that modulus is critical to the security of the scheme.In more detail, we start by picking a polynomial ring. We pick a polynomial degree as the maximum degree (say, $N = 1024$), the coefficients are always integers modulo some chosen modulus $q$ (it may be a machine word size or some large prime), and finally we pick a polynomial, usually $x^N + 1$, and represent the result of every operation as a remainder when divided by that polynomial. In math notation, this set of polynomials would be denoted $\mathbb{Z}/q\mathbb{Z}[x] / (x^N + 1)$. The requirements of the specification of $q, N,$ and the polynomial modulus differ from scheme to scheme. The modulus $x^N+1$ is standard because it enables efficient polynomial multiplication via the discrete fourier transform (DFT) or the number-theoretic transform (NTT). See my earlier article on how these special polynomial multiplications can be implemented, though I haven’t written about the NTT yet.To encrypt, one or more small-integer messages are encoded into a polynomial in some scheme-dependent way (I wrote a whole article about this). The secret key is a list of random polynomials with binary coefficients, and the samples are random polynomials with uniformly random mod $q$ coefficients. Then you take a dot product, add the message, and add a similar “noise polynomial” to mask the result.Because polynomials are “harder” than integers (for more details, see this article), the vector size $n$, which was 800 in my LWE example, is often set to 1 in RLWE. That is, the “dot product” from LWE is replaced by a single polynomial product. If you think about it, a polynomial product is a lot like a convolution, which is a twisty cousin of the simpler dot product. The polynomial degree replaces the dimension of the LWE vector for scaling security. That said, some schemes use two or more polynomials to get different trade-offs of security and performance.The main advantage to using RLWE over LWE is that you can pack many messages into a single polynomial, and the homomorphic operations you do apply to all the messages. It’s the same sort of advantage as SIMD, but there are more restrictions on what SIMD operations are available on these packed messages that I’ll discuss in later sections.Finally, many people have observed that an integer is just a polynomial with degree 0. And because RLWE started off with the vector dimension always being set to 1, you can take these two parameters (vector dimension and polynomial degree) to get a single mother-problem where both parameters can be variable. That mother problem is called “Module LWE,” and it’s beyond the scope of this article.Basic operations and dealing with noiseIn both LWE and RLWE encryptions, the addition of two ciphertexts naturally corresponds to the addition of the underlying messages. Getting a homomorphic multiplication is harder, and the method is often scheme-dependent, but it’s possible. You might have noticed that LWE and RLWE support “small bit width integers” instead of the single bits I mentioned previously. Indeed, modern FHE practitioners take advantage of this and represent their circuits in terms of low-bit-width arithmetic operations, or take advantage of fixed-width representations to support decimal computations. Depending on the computation, this can have a dramatic benefit over representing everything in terms of pure boolean circuits.In addition to operating on the underlying messages, homomorphic addition also adds the cryptographic noise in the two operands to the result ciphertext. Likewise, a homomorphic product roughly multiplies the noise in the two ciphertexts. This is clearly unsustainable. Once the noise exceeds the some-28 bits of space allocated for it, decryption will fail and the program result effectively becomes random noise.By way of example, in a recent FHE program I worked on, I had 3-bit messages in the top of a 32-bit LWE plaintext. The cryptographic parameters I set up had my initial program starting with an effective bound of about 12 bits of noise (this is probably not secure enough for real world uses). A single addition adds one more bit of noise, and a multiplication doubles the noise. So we can do at most one multiplication followed by at most five or so additions before we are too noisy to continue.So nearly all of the complexity in FHE is based around how to avoid noise growth or how to reduce noise mid-program. The latter is called bootstrapping, which deserves some special attention. The idea of bootstrapping is trippy. Its technical details are beyond the scope of this article, but I can summarize the main idea: you can homomorphically decrypt an FHE ciphertext and re-encrypt it under a new secret key without ever seeing the underlying message. In doing so, the noise of the resul'
