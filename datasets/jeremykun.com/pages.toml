["https://jeremykun.com/2014/12/01/linear-programming-and-the-simplex-algorithm"]
title = "Linear Programming and the Simplex Algorithm || Math ∩ Programming"
description = "In the last post in this series we saw some simple examples of linear programs, derived the concept of a dual linear program, and saw the duality theorem and the complementary slackness conditions which give a rough sketch of the stopping criterion for an algorithm. This time we’ll go ahead and write this algorithm for solving linear programs, and next time we’ll apply the algorithm to an industry-strength version of the nutrition problem we saw last time."
full_description = '''Linear Programming and the Simplex Algorithm#exponential time algorithms #integer programming #linear algebra #linear programming #lp-relaxation #optimization #row reduction #simplex algorithm 2014-12-01This article was ported from my old Wordpress blog here, If you see any issues with the rendering or layout, please send me an email.In the last post in this series we saw some simple examples of linear programs, derived the concept of a dual linear program, and saw the duality theorem and the complementary slackness conditions which give a rough sketch of the stopping criterion for an algorithm. This time we’ll go ahead and write this algorithm for solving linear programs, and next time we’ll apply the algorithm to an industry-strength version of the nutrition problem we saw last time. The algorithm we’ll implement is called the simplex algorithm. It was the first algorithm for solving linear programs, invented in the 1940’s by George Dantzig, and it’s still the leading practical algorithm, and it was a key part of a Nobel Prize. It’s by far one of the most important algorithms ever devised.As usual, we’ll post all of the code written in the making of this post on this blog’s Github page.Slack variables and equality constraintsThe simplex algorithm can solve any kind of linear program, but it only accepts a special form of the program as input. So first we have to do some manipulations. Recall that the primal form of a linear program was the following minimization problem.$$\min \left \langle c, x \right \rangle \\\ \textup{s.t. } Ax \geq b, x \geq 0$$where the brackets mean “dot product.” And its dual is$$\max \left \langle y, b \right \rangle \\\ \textup{s.t. } A^Ty \leq c, y \geq 0$$The linear program can actually have more complicated constraints than just the ones above. In general, one might want to have “greater than” and “less than” constraints in the same problem. It turns out that this isn’t any harder, and moreover the simplex algorithm only uses equality constraints, and with some finicky algebra we can turn any set of inequality or equality constraints into a set of equality constraints.We’ll call our goal the “standard form,” which is as follows:$$\max \left \langle c, x \right \rangle \\\ \textup{s.t. } Ax = b, x \geq 0$$It seems impossible to get the usual minimization/maximization problem into standard form until you realize there’s nothing stopping you from adding more variables to the problem. That is, say we’re given a constraint like:$$\displaystyle x_7 + x_3 \leq 10,$$we can add a new variable $ \xi$, called a slack variable, so that we get an equality:$$\displaystyle x_7 + x_3 + \xi = 10$$And now we can just impose that $ \xi \geq 0$. The idea is that $ \xi$ represents how much “slack” there is in the inequality, and you can always choose it to make the condition an equality. So if the equality holds and the variables are nonnegative, then the $ x_i$ will still satisfy their original inequality. For “greater than” constraints, we can do the same thing but subtract a nonnegative variable. Finally, if we have a minimization problem “$ \min z$” we can convert it to $ \max -z$.So, to combine all of this together, if we have the following linear program with each kind of constraint,We can add new variables $ \xi_1, \xi_2$, and write it asBy defining the vector variable $ x = (x_1, x_2, x_3, \xi_1, \xi_2)$ and $ c = (-1,-1,-1,0,0)$ and $ A$ to have $ -1, 0, 1$ as appropriately for the new variables, we see that the system is written in standard form.This is the kind of tedious transformation we can automate with a program. Assuming there are $ n$ variables, the input consists of the vector $ c$ of length $ n$, and three matrix-vector pairs $ (A, b)$ representing the three kinds of constraints. It’s a bit annoying to describe, but the essential idea is that we compute a rectangular “identity” matrix whose diagonal entries are $ \pm 1$, and then join this with the original constraint matrix row-wise. The reader can see the full implementation in the Github repository for this post, though we won’t use this particular functionality in the algorithm that follows.There are some other additional things we could do: for example there might be some variables that are completely unrestricted. What you do in this case is take an unrestricted variable $ z$ and replace it by the difference of two unrestricted variables $ z’ – z”$. For simplicity we’ll ignore this, but it would be a fruitful exercise for the reader to augment the function to account for these.What happened to the slackness conditions?The “standard form” of our linear program raises an obvious question: how can the complementary slackness conditions make sense if everything is an equality? It turns out that one can redo all the work one did for linear programs of the form we gave last time (minimize w.r.t. greater-than constraints) for programs in the new “standard form” above. We even get the same complementary slackness conditions! If you want to, you can do this entire routine quite a bit faster if you invoke the power of Lagrangians. We won’t do that here, but the tool shows up as a way to work with primal-dual conversions in many other parts of mathematics, so it’s a good buzzword to keep in mind.In our case, the only difference with the complementary slackness conditions is that one of the two is trivial: $ \left \langle y^*, Ax^* – b \right \rangle = 0$. This is because if our candidate solution $ x^*$ is feasible, then it will have to satisfy $ Ax = b$ already. The other one, that $ \left \langle x^*, A^Ty^* – c \right \rangle = 0$, is the only one we need to worry about.Again, the complementary slackness conditions give us inspiration here. Recall that, informally, they say that when a variable is used at all, it is used as much as it can be to fulfill its constraint (the corresponding dual constraint is tight). So a solution will correspond to a choice of some variables which are either used or not, and a choice of nonzero variables will correspond to a solution. We even saw this happen in the last post when we observed that broccoli trumps oranges. If we can get a good handle on how to navigate the set of these solutions, then we’ll have a nifty algorithm.Let’s make this official and lay out our assumptions.Extreme points and basic solutionsRemember that the graphical way to solve a linear program is to look at the line (or hyperplane) given by $ \langle c, x \rangle = q$ and keep increasing $ q$ (or decreasing it, if you are minimizing) until the very last moment when this line touches the region of feasible solutions. Also recall that the “feasible region” is just the set of all solutions to $ Ax = b$, that is the solutions that satisfy the constraints. We imagined this picture:The constraints define a convex area of 'feasible solutions.' Image source: Wikipedia.With this geometric intuition it’s clear that there will always be an optimal solution on a vertex of the feasible region. These points are called extreme points of the feasible region. But because we will almost never work in the plane again (even introducing slack variables makes us relatively high dimensional!) we want an algebraic characterization of these extreme points.If you have a little bit of practice with convex sets the correct definition is very natural. Recall that a set $ X$ is convex if for any two points $ x, y \in X$ every point on the line segment between $ x$ and $ y$ is also in $ X$. An algebraic way to say this (thinking of these points now as vectors) is that every point $ \delta x + (1-\delta) y \in X$ when $ 0 \leq \delta \leq 1$. Now an extreme point is just a point that isn’t on the inside of any such line, i.e. can’t be written this way for $ 0 < \delta < 1$. For example,A convex set with extremal points in red. Image credit Wikipedia.Another way to say this is that if $ z$ is an extreme point then whenever $ z$ can be written as $ \delta x + (1-\delta) y$ for some $ 0 < \delta < 1$, then actually $ x=y=z$. Now since our constraints are all linear (and there are a finite number of them) they won’t define a convex set with weird curves like the one above. This means that there are a finite number of extreme points that just correspond to the intersections of some of the constraints. So there are at most $ 2^n$ possibilities.Indeed we want a characterization of extreme points that’s specific to linear programs in standard form, “$ \max \langle c, x \rangle \textup{ s.t. } Ax=b, x \geq 0$.” And here is one.Definition: Let $ A$ be an $ m \times n$ matrix with $ n \geq m$. A solution $ x$ to $ Ax=b$ is called basic if at most $ m$ of its entries are nonzero.The reason we call it “basic” is because, under some mild assumptions we describe below, a basic solution corresponds to a vector space basis of $ \mathbb{R}^m$. Which basis? The one given by the $ m$ columns of $ A$ used in the basic solution. We don’t need to talk about bases like this, though, so in the event of a headache just think of the basis as a set $ B \subset \{ 1, 2, \dots, n \}$ of size $ m$ corresponding to the nonzero entries of the basic solution.Indeed, what we’re doing here is looking at the matrix $ A_B$ formed by taking the columns of $ A$ whose indices are in $ B$, and the vector $ x_B$ in the same way, and looking at the equation $ A_Bx_B = b$. If all the parts of $ x$ that we removed were zero then this will hold if and only if $ Ax=b$. One might worry that $ A_B$ is not invertible, so we’ll go ahead and assume it is. In fact, we’ll assume that every set of $ m$ columns of $ A$ forms a basis and that the rows of $ A$ are also linearly independent. This isn’t without loss of generality because if some rows or columns are not linearly independent, we can remove the offending constraints and variables without changing the set of solutions (this is why it’s so nice to work with the standard form).Moreover, we’ll assume that every basic solution has exactly $ m$ nonzero variables. A basic solution which doesn’t satisfy this assumption is called degenerate, and they’ll essentially be special corner cases in the simplex algorithm. Finally, we call a basic solution feasible if (in addition to satisfying $ Ax=b$) it satisfies $ x \geq 0$. Now that we’ve made all these assumptions it’s easy to see that choosing $ m$ nonzero variables uniquely determines a basic feasible solution. Again calling the sub-matrix $ A_B$ for a basis $ B$, it’s just $ x_B = A_B^{-1}b$. Now to finish our characterization, we just have to show that under the same assumptions basic feasible solutions are exactly the extremal points of the feasible region.Proposition: A vector $ x$ is a basic feasible solution if and only if it’s an extreme point of the set $ \{ x : Ax = b, x \geq 0 \}$.Proof. For one direction, suppose you have a basic feasible solution $ x$, and say we write it as $ x = \delta y + (1-\delta) z$ for some $ 0 < \delta < 1$. We want to show that this implies $ y = z$. Since all of these points are in the feasible region, all of their coordinates are nonnegative. So whenever a coordinate $ x_i = 0$ it must be that both $ y_i = z_i = 0$. Since $ x$ has exactly $ n-m$ zero entries, it must be that $ y, z$ both have at least $ n-m$ zero entries, and hence $ y,z$ are both basic. By our non-degeneracy assumption they both then have exactly $ m$ nonzero entries. Let $ B$ be the set of the nonzero indices of $ x$. Because $ Ay = Az = b$, we have $ A(y-z) = 0$. Now $ y-z$ has all of its nonzero entries in $ B$, and because the columns of $ A_B$ are linearly independent, the fact that $ A_B(y-z) = 0$ implies $ y-z = 0$.In the other direction, suppose that you have some extreme point $ x$ which is feasible but not basic. In other words, there are more than $ m$ nonzero entries of $ x$, and we’ll call the indices $ J = \{ j_1, \dots, j_t \}$ where $ t > m$. The columns of $ A_J$ are linearly dependent (since they’re $ t$ vectors in $ \mathbb{R}^m$), and so let $ \sum_{i=1}^t z_{j_i} A_{j_i}$ be a nontrivial linear combination of the columns of $ A$. Add zeros to make the $ z_{j_i}$ into a length $ n$ vector $ z$, so that $ Az = 0$. Now$$A(x + \varepsilon z) = A(x – \varepsilon z) = Ax = b$$And if we pick $ \varepsilon$ sufficiently small $ x \pm \varepsilon z$ will still be nonnegative, because the only entries we’re changing of $ x$ are the strictly positive ones. Then $ x = \delta (x + \varepsilon z) + (1 – \delta) \varepsilon z$ for $ \delta = 1/2$, but this is very embarrassing for $ x$ who was supposed to be an extreme point. $ \square$Now that we know extreme points are the same as basic feasible solutions, we need to show that any linear program that has some solution has a basic feasible solution. This is clear geometrically: any time you have an optimum it has to either lie on a line or at a vertex, and if it lies on a line then you can slide it to a vertex without changing its value. Nevertheless, it is a useful exercise to go through the algebra.Theorem. Whenever a linear program is feasible and bounded, it has a basic feasible solution.Proof. Let $ x$ be an optimal solution to the LP. If $ x$ has at most $ m$ nonzero entries then it’s a basic solution and by the non-degeneracy assumption it must have exactly $ m$ nonzero entries. In this case there’s nothing to do, so suppose that $ x$ has $ r > m$ nonzero entries. It can’t be a basic feasible solution, and hence is not an extreme point of the set of feasible solutions (as proved by the last theorem). So write it as $ x = \delta y + (1-\delta) z$ for some feasible $ y \neq z$ and $ 0 < \delta < 1$.The only thing we know about $ x$ is it’s optimal. Let $ c$ be the cost vector, and the optimality says that $ \langle c,x \rangle \geq \langle c,y \rangle$, and $ \langle c,x \rangle \geq \langle c,z \rangle$. We claim that in fact these are equal, that $ y, z$ are both optimal as well. Indeed, say $ y$ were not optimal, then$$\displaystyle \langle c, y \rangle < \langle c,x \rangle = \delta \langle c,y \rangle + (1-\delta) \langle c,z \rangle$$Which can be rearranged to show that $ \langle c,y \rangle < \langle c, z \rangle$. Unfortunately for $ x$, this implies that it was not optimal all along:$$\displaystyle \langle c,x \rangle < \delta \langle c, z \rangle + (1-\delta) \langle c,z \rangle = \langle c,z \rangle$$An identical argument works to show $ z$ is optimal, too. Now we claim we can use $ y,z$ to get a new solution that has fewer than $ r$ nonzero entries. Once we show this we’re done: inductively repeat the argument with the smaller solution until we get down to exactly $ m$ nonzero variables. As before we know that $ y,z$ must have at least as many zeros as $ x$. If they have more zeros we’re done. And if they have exactly as many zeros we can do the following trick. Write $ w = \gamma y + (1- \gamma)z$ for a $ \gamma \in \mathbb{R}$ we’ll choose later. Note that no matter the $ \gamma$, $ w$ is optimal. Rewriting $ w = z + \gamma (y-z)$,'''
