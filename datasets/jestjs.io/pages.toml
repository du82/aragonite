title = "Using with webpack · Jest"
description = "Jest can be used in projects that use webpack to manage assets, styles, and compilation. webpack does offer some unique challenges over other tools because it integrates directly with your application to allow managing stylesheets, assets like images and fonts, along with the expansive ecosystem of compile-to-JavaScript languages and tools."
full_description = '''GuidesUsing with webpackVersion: 29.4On this pageUsing with webpackJest can be used in projects that use webpack to manage assets, styles, and compilation. webpack does offer some unique challenges over other tools because it integrates directly with your application to allow managing stylesheets, assets like images and fonts, along with the expansive ecosystem of compile-to-JavaScript languages and tools. A webpack example​ Let's start with a common sort of webpack config file and translate it to a Jest setup. webpack.config.jsmodule.exports = { module: { rules: [ { test: /\.jsx?$/, exclude: ['node_modules'], use: ['babel-loader'], }, { test: /\.css$/, use: ['style-loader', 'css-loader'], }, { test: /\.gif$/, type: 'asset/inline', }, { test: /\.(ttf|eot|svg)$/, type: 'asset/resource', }, ], }, resolve: { alias: { config$: './configs/app-config.js', react: './vendor/react-master', }, extensions: ['.js', '.jsx'], modules: [ 'node_modules', 'bower_components', 'shared', '/shared/vendor/modules', ], },}; If you have JavaScript files that are transformed by Babel, you can enable support for Babel by installing the babel-jest plugin. Non-Babel JavaScript transformations can be handled with Jest's transform config option. Handling Static Assets​ Next, let's configure Jest to gracefully handle asset files such as stylesheets and images. Usually, these files aren't particularly useful in tests so we can safely mock them out. However, if you are using CSS Modules then it's better to mock a proxy for your className lookups. jest.config.jsmodule.exports = { moduleNameMapper: { '\\.(jpg|jpeg|png|gif|eot|otf|webp|svg|ttf|woff|woff2|mp4|webm|wav|mp3|m4a|aac|oga)$': '<rootDir>/__mocks__/fileMock.js', '\\.(css|less)$': '<rootDir>/__mocks__/styleMock.js', },}; And the mock files themselves: __mocks__/styleMock.jsmodule.exports = {}; __mocks__/fileMock.jsmodule.exports = 'test-file-stub'; Mocking CSS Modules​ You can use an ES6 Proxy to mock CSS Modules: npmYarnpnpmnpm install --save-dev identity-obj-proxyyarn add --dev identity-obj-proxypnpm add --save-dev identity-obj-proxy Then all your className lookups on the styles object will be returned as-is (e.g., styles.foobar === 'foobar'). This is pretty handy for React Snapshot Testing. jest.config.js (for CSS Modules)module.exports = { moduleNameMapper: { '\\.(jpg|jpeg|png|gif|eot|otf|webp|svg|ttf|woff|woff2|mp4|webm|wav|mp3|m4a|aac|oga)$': '<rootDir>/__mocks__/fileMock.js', '\\.(css|less)$': 'identity-obj-proxy', },}; If moduleNameMapper cannot fulfill your requirements, you can use Jest's transform config option to specify how assets are transformed. For example, a transformer that returns the basename of a file (such that require('logo.jpg'); returns 'logo') can be written as: fileTransformer.jsconst path = require('path');module.exports = { process(sourceText, sourcePath, options) { return { code: `module.exports = ${JSON.stringify(path.basename(sourcePath))};`, }; },}; jest.config.js (for custom transformers and CSS Modules)module.exports = { moduleNameMapper: { '\\.(css|less)$': 'identity-obj-proxy', }, transform: { '\\.(jpg|jpeg|png|gif|eot|otf|webp|svg|ttf|woff|woff2|mp4|webm|wav|mp3|m4a|aac|oga)$': '<rootDir>/fileTransformer.js', },}; We've told Jest to ignore files matching a stylesheet or image extension, and instead, require our mock files. You can adjust the regular expression to match the file types your webpack config handles. tipRemember to include the default babel-jest transformer explicitly, if you wish to use it alongside with additional code preprocessors:"transform": { "\\.[jt]sx?$": "babel-jest", "\\.css$": "some-css-transformer",} Configuring Jest to find our files​ Now that Jest knows how to process our files, we need to tell it how to find them. For webpack's modules, and extensions options there are direct analogs in Jest's moduleDirectories and moduleFileExtensions options. jest.config.jsmodule.exports = { moduleFileExtensions: ['js', 'jsx'], moduleDirectories: ['node_modules', 'bower_components', 'shared'], moduleNameMapper: { '\\.(css|less)$': '<rootDir>/__mocks__/styleMock.js', '\\.(gif|ttf|eot|svg)$': '<rootDir>/__mocks__/fileMock.js', },}; note<rootDir> is a special token that gets replaced by Jest with the root of your project. Most of the time this will be the folder where your package.json is located unless you specify a custom rootDir option in your configuration. Similarly, Jest's counterpart for Webpack's resolve.roots (an alternative to setting NODE_PATH) is modulePaths. jest.config.jsmodule.exports = { modulePaths: ['/shared/vendor/modules'], moduleFileExtensions: ['js', 'jsx'], moduleDirectories: ['node_modules', 'bower_components', 'shared'], moduleNameMapper: { '\\.(css|less)$': '<rootDir>/__mocks__/styleMock.js', '\\.(gif|ttf|eot|svg)$': '<rootDir>/__mocks__/fileMock.js', },}; And finally, we have to handle the webpack alias. For that, we can make use of the moduleNameMapper option again. jest.config.jsmodule.exports = { modulePaths: ['/shared/vendor/modules'], moduleFileExtensions: ['js', 'jsx'], moduleDirectories: ['node_modules', 'bower_components', 'shared'], moduleNameMapper: { '\\.(css|less)$': '<rootDir>/__mocks__/styleMock.js', '\\.(gif|ttf|eot|svg)$': '<rootDir>/__mocks__/fileMock.js', '^react(.*)$': '<rootDir>/vendor/react-master$1', '^config$': '<rootDir>/configs/app-config.js', },}; That's it! webpack is a complex and flexible tool, so you may have to make some adjustments to handle your specific application's needs. Luckily for most projects, Jest should be more than flexible enough to handle your webpack config. tipFor more complex webpack configurations, you may also want to investigate projects such as: babel-plugin-webpack-loaders. Using with webpack​ In addition to installing babel-jest as described earlier, you'll need to add @babel/preset-env like so: npmYarnpnpmnpm install --save-dev @babel/preset-envyarn add --dev @babel/preset-envpnpm add --save-dev @babel/preset-env Then, you'll want to configure Babel as follows: .babelrc{ "presets": ["@babel/preset-env"]} tipJest caches files to speed up test execution. If you updated .babelrc and Jest is not working as expected, try clearing the cache by running jest --clearCache. tipIf you use dynamic imports (import('some-file.js').then(module => ...)), you need to enable the dynamic-import-node plugin..babelrc{ "presets": [["env", {"modules": false}]], "plugins": ["syntax-dynamic-import"], "env": { "test": { "plugins": ["dynamic-import-node"] } }} For an example of how to use Jest with webpack with React, you can view one here.Edit this pageLast updated on Feb 5, 2023 by Tom Mrazauskas'''
