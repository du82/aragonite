["https://jestjs.io/fr"]
title = "Jest · 🃏 Delightful JavaScript Testing"
full_description = "Il fonctionne avec les projets utilisant : Babel, TypeScript, Node, React, Angular, Vue et plus encore ! Jest a pour but de fonctionner dès le départ, sans configuration, sur la plupart des projets JavaScript. Réalisez des tests qui gardent facilement la trace d'objets volumineux. Les snapshots vivent soit à proximité de vos tests, soit sont intégrés en direct. Les tests sont parallélisés en les exécutant dans leurs propres processus afin de maximiser les performances. De it à expect - Jest a toute la boîte à outils en un seul endroit. Bien documenté, bien maintenu, bien fait. En s'assurant que vos tests ont un état global unique, Jest peut exécuter des tests en parallèle de manière fiable. Pour accélérer les choses, Jest exécute d'abord les tests qui ont échoué précédemment et réorganise les exécutions en fonction de la durée des fichiers de test. Générez la couverture de code en ajoutant l'indicateur --coverage. Aucune configuration supplémentaire n'est nécessaire. Jest peut collecter des informations de couverture de code à partir de projets entiers, y compris les fichiers non testés. Jest utilise un résolveur personnalisé pour les importations dans vos tests, ce qui permet de simuler facilement tout objet en dehors de la portée de votre test. Vous pouvez utiliser les importations simulées avec la riche API Mock Functions pour espionner les appels de fonction avec une syntaxe de test lisible. Les tests échouent - lorsqu'ils en sont victimes, Jest fournit un contexte riche pour expliquer pourquoi. Voici quelques exemples : Jest est un framework de test JavaScript conçu pour assurer la correction de toute base de code JavaScript. Il vous permet d'écrire des tests avec une API accessible, familière et riche en fonctionnalités qui vous donne des résultats rapidement. Jest est bien documenté, nécessite peu de configuration et peut être étendu pour répondre à vos besoins. L'équipe principale et les contributeurs de Jest parlent régulièrement de Jest et les tests JavaScript de qualité. Consultez notre présentation de Construction d'outils JavaScript de haute qualité à la jsconf.eu 2017 et notre présentation de Jest en tant que plateforme à la ReactiveConf 2017."
