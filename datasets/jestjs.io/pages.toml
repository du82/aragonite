title = "Jest CLI Options · Jest"
description = "The jest command line runner has a number of useful options. You can run jest --help to view all available options. Many of the options shown below can also be used together to run tests exactly the way you want. Every one of Jest's Configuration options can also be specified through the CLI."
full_description = '''Jest CLI OptionsVersion: 29.6On this pageJest CLI OptionsThe jest command line runner has a number of useful options. You can run jest --help to view all available options. Many of the options shown below can also be used together to run tests exactly the way you want. Every one of Jest's Configuration options can also be specified through the CLI. Here is a brief overview: Running from the command line​ Run all tests (default): jest Run only the tests that were specified with a pattern or filename: jest my-test #orjest path/to/my-test.js Run tests related to changed files based on hg/git (uncommitted files): jest -o Run tests related to path/to/fileA.js and path/to/fileB.js: jest --findRelatedTests path/to/fileA.js path/to/fileB.js Run tests that match this spec name (match against the name in describe or test, basically). jest -t name-of-spec Run watch mode: jest --watch #runs jest -o by defaultjest --watchAll #runs all tests Watch mode also enables to specify the name or path to a file to focus on a specific set of tests. Using with package manager​ If you run Jest via your package manager, you can still pass the command line arguments directly as Jest arguments. Instead of: jest -u -t="ColorPicker" you can use: npmYarnpnpmnpm test -- -u -t="ColorPicker"yarn test -u -t="ColorPicker"pnpm test -u -t="ColorPicker" Camelcase & dashed args support​ Jest supports both camelcase and dashed arg formats. The following examples will have an equal result: jest --collect-coveragejest --collectCoverage Arguments can also be mixed: jest --update-snapshot --detectOpenHandles Options​ noteCLI options take precedence over values from the Configuration. Camelcase & dashed args supportOptionsReferencejest <regexForTestFiles>--bail[=<n>]--cache--changedFilesWithAncestor--changedSince--ci--clearCache--clearMocks--collectCoverageFrom=<glob>--colors--config=<path>--coverage[=<boolean>]--coverageDirectory=<path>--coverageProvider=<provider>--debug--detectOpenHandles--env=<environment>--errorOnDeprecated--expand--filter=<file>--findRelatedTests <spaceSeparatedListOfSourceFiles>--forceExit--help--ignoreProjects <project1> ... <projectN>--init--injectGlobals--json--lastCommit--listTests--logHeapUsage--maxConcurrency=<num>--maxWorkers=<num>|<string>--noStackTrace--notify--onlyChanged--onlyFailures--openHandlesTimeout=<milliseconds>--outputFile=<filename>--passWithNoTests--projects <path1> ... <pathN>--randomize--reporters--resetMocks--restoreMocks--roots--runInBand--runTestsByPath--seed=<num>--selectProjects <project1> ... <projectN>--setupFilesAfterEnv <path1> ... <pathN>--shard--showConfig--showSeed--silent--testEnvironmentOptions=<json string>--testLocationInResults--testMatch glob1 ... globN--testNamePattern=<regex>--testPathIgnorePatterns=<regex>|[array]--testPathPattern=<regex>--testRunner=<path>--testSequencer=<path>--testTimeout=<number>--updateSnapshot--useStderr--verbose--version--watch--watchAll--watchman--workerThreads Reference​ jest <regexForTestFiles>​ When you run jest with an argument, that argument is treated as a regular expression to match against files in your project. It is possible to run test suites by providing a pattern. Only the files that the pattern matches will be picked up and executed. Depending on your terminal, you may need to quote this argument: jest "my.*(complex)?pattern". On Windows, you will need to use / as a path separator or escape \ as \\. --bail[=<n>]​ Alias: -b. Exit the test suite immediately upon n number of failing test suite. Defaults to 1. --cache​ Whether to use the cache. Defaults to true. Disable the cache using --no-cache. cautionThe cache should only be disabled if you are experiencing caching related problems. On average, disabling the cache makes Jest at least two times slower. If you want to inspect the cache, use --showConfig and look at the cacheDirectory value. If you need to clear the cache, use --clearCache. --changedFilesWithAncestor​ Runs tests related to the current changes and the changes made in the last commit. Behaves similarly to --onlyChanged. --changedSince​ Runs tests related to the changes since the provided branch or commit hash. If the current branch has diverged from the given branch, then only changes made locally will be tested. Behaves similarly to --onlyChanged. --ci​ When this option is provided, Jest will assume it is running in a CI environment. This changes the behavior when a new snapshot is encountered. Instead of the regular behavior of storing a new snapshot automatically, it will fail the test and require Jest to be run with --updateSnapshot. --clearCache​ Deletes the Jest cache directory and then exits without running tests. Will delete cacheDirectory if the option is passed, or Jest's default cache directory. The default cache directory can be found by calling jest --showConfig. cautionClearing the cache will reduce performance. --clearMocks​ Automatically clear mock calls, instances, contexts and results before every test. Equivalent to calling jest.clearAllMocks() before each test. This does not remove any mock implementation that may have been provided. --collectCoverageFrom=<glob>​ A glob pattern relative to rootDir matching the files that coverage info needs to be collected from. --colors​ Forces test results output highlighting even if stdout is not a TTY. noteAlternatively you can set the environment variable FORCE_COLOR=true to forcefully enable or FORCE_COLOR=false to disable colorized output. The use of FORCE_COLOR overrides all other color support checks. --config=<path>​ Alias: -c. The path to a Jest config file specifying how to find and execute tests. If no rootDir is set in the config, the directory containing the config file is assumed to be the rootDir for the project. This can also be a JSON-encoded value which Jest will use as configuration. --coverage[=<boolean>]​ Alias: --collectCoverage. Indicates that test coverage information should be collected and reported in the output. Optionally pass <boolean> to override option set in configuration. --coverageDirectory=<path>​ The directory where Jest should output its coverage files. --coverageProvider=<provider>​ Indicates which provider should be used to instrument code for coverage. Allowed values are babel (default) or v8. --debug​ Print debugging info about your Jest config. --detectOpenHandles​ Attempt to collect and print open handles preventing Jest from exiting cleanly. Use this in cases where you need to use --forceExit in order for Jest to exit to potentially track down the reason. This implies --runInBand, making tests run serially. Implemented using async_hooks. This option has a significant performance penalty and should only be used for debugging. --env=<environment>​ The test environment used for all tests. This can point to any file or node module. Examples: jsdom, node or path/to/my-environment.js. --errorOnDeprecated​ Make calling deprecated APIs throw helpful error messages. Useful for easing the upgrade process. --expand​ Alias: -e. Use this flag to show full diffs and errors instead of a patch. --filter=<file>​ Path to a module exporting a filtering function. This asynchronous function receives a list of test paths which can be manipulated to exclude tests from running by returning an object with shape { filtered: Array<{ test: string }> }. Especially useful when used in conjunction with a testing infrastructure to filter known broken tests, e.g. my-filter.jsmodule.exports = testPaths => { const allowedPaths = testPaths .filter(filteringFunction) .map(test => ({test})); // [{ test: "path1.spec.js" }, { test: "path2.spec.js" }, etc] return { filtered: allowedPaths, };}; --findRelatedTests <spaceSeparatedListOfSourceFiles>​ Find and run the tests that cover a space separated list of source files that were passed in as arguments. Useful for pre-commit hook integration to run the minimal amount of tests necessary. Can be used together with --coverage to include a test coverage for the source files, no duplicate --collectCoverageFrom arguments needed. --forceExit​ Force Jest to exit after all tests have completed running. This is useful when resources set up by test code cannot be adequately cleaned up. cautionThis feature is an escape-hatch. If Jest doesn't exit at the end of a test run, it means external resources are still being held on to or timers are still pending in your code. It is advised to tear down external resources after each test to make sure Jest can shut down cleanly. You can use --detectOpenHandles to help track it down. --help​ Show the help information, similar to this page. --ignoreProjects <project1> ... <projectN>​ Ignore the tests of the specified projects. Jest uses the attribute displayName in the configuration to identify each project. If you use this option, you should provide a displayName to all your projects. --init​ Generate a basic configuration file. Based on your project, Jest will ask you a few questions that will help to generate a jest.config.js file with a short description for each option. --injectGlobals​ Insert Jest's globals (expect, test, describe, beforeEach etc.) into the global environment. If you set this to false, you should import from @jest/globals, e.g. import {expect, jest, test} from '@jest/globals';jest.useFakeTimers();test('some test', () => { expect(Date.now()).toBe(0);}); noteThis option is only supported using the default jest-circus test runner. --json​ Prints the test results in JSON. This mode will send all other test output and user messages to stderr. --lastCommit​ Run all tests affected by file changes in the last commit made. Behaves similarly to --onlyChanged. --listTests​ Lists all test files that Jest will run given the arguments, and exits. --logHeapUsage​ Logs the heap usage after every test. Useful to debug memory leaks. Use together with --runInBand and --expose-gc in node. --maxConcurrency=<num>​ Prevents Jest from executing more than the specified amount of tests at the same time. Only affects tests that use test.concurrent. --maxWorkers=<num>|<string>​ Alias: -w. Specifies the maximum number of workers the worker-pool will spawn for running tests. In single run mode, this defaults to the number of the cores available on your machine minus one for the main thread. In watch mode, this defaults to half of the available cores on your machine to ensure Jest is unobtrusive and does not grind your machine to a halt. It may be useful to adjust this in resource limited environments like CIs but the defaults should be adequate for most use-cases. For environments with variable CPUs available, you can use percentage based configuration: --maxWorkers=50% --noStackTrace​ Disables stack trace in test results output. --notify​ Activates notifications for test results. Good for when you don't want your consciousness to be able to focus on anything except JavaScript testing. --onlyChanged​ Alias: -o. Attempts to identify which tests to run based on which files have changed in the current repository. Only works if you're running tests in a git/hg repository at the moment and requires a static dependency graph (ie. no dynamic requires). --onlyFailures​ Alias: -f. Run tests that failed in the previous execution. --openHandlesTimeout=<milliseconds>​ When --detectOpenHandles and --forceExit are disabled, Jest will print a warning if the process has not exited cleanly after this number of milliseconds. A value of 0 disables the warning. Defaults to 1000. --outputFile=<filename>​ Write test results to a file when the --json option is also specified. The returned JSON structure is documented in testResultsProcessor. --passWithNoTests​ Allows the test suite to pass when no files are found. --projects <path1> ... <pathN>​ Run tests from one or more projects, found in the specified paths; also takes path globs. This option is the CLI equivalent of the projects configuration option. noteIf configuration files are found in the specified paths, all projects specified within those configuration files will be run. --randomize​ Shuffle the order of the tests within a file. The shuffling is based on the seed. See --seed=<num> for more info. Seed value is displayed when this option is set. Equivalent to setting the CLI option --showSeed. jest --randomize --seed 1234 noteThis option is only supported using the default jest-circus test runner. --reporters​ Run tests with specified reporters. Reporter options are not available via CLI. Example with multiple reporters: jest --reporters="default" --reporters="jest-junit" --resetMocks​ Automatically reset mock state before every test. Equivalent to calling jest.resetAllMocks() before each test. This will lead to any mocks having their fake implementations removed but does not restore their initial implementation. --restoreMocks​ Automatically restore mock state and implementation before every test. Equivalent to calling jest.restoreAllMocks() before each test. This will lead to any mocks having their fake implementations removed and restores their initial implementation. --roots​ A list of paths to directories that Jest should use to search for files in. --runInBand​ Alias: -i. Run all tests serially in the current process, rather than creating a worker pool of child processes that run tests. This can be useful for debugging. --runTestsByPath​ Run only the tests that were specified with their exact paths. This avoids converting them into a regular expression and matching it against every single file. For example, given the following file structure: __tests__└── t1.test.js # test└── t2.test.js # test When ran with a pattern, no test is found: jest --runTestsByPath __tests__/t Output: No tests found However, passing an exact path will execute only the given test: jest --runTestsByPath __tests__/t1.test.js Output: PASS __tests__/t1.test.js tipThe default regex matching works fine on small runs, but becomes slow if provided with multiple patterns and/or against a lot of tests. This option replaces the regex matching logic and by that optimizes the time it takes Jest to filter specific test files. --seed=<num>​ Sets a seed value that can be retrieved in a test file via jest.getSeed(). The seed value must be between -0x80000000 and 0x7fffffff inclusive (-2147483648 (-(2 ** 31)) and 2147483647 (2 ** 31 - 1) in decimal). jest --seed=1324 tipIf this option is not specified Jest will randomly generate the value. You can use the --showSeed flag to print the seed in the test report summary.Jest uses the seed internally for shuffling the order in which test suites are run. If the --randomize option is used, the seed is also used for shuffling the order of tests within each describe block. When dealing with flaky tests, rerunning with the same seed might help reproduce the failure. --selectProjects <project1> ... <projectN>​ Run the tests of the specified projects. Jest uses the attribute displayName in the configuration to identify each project. If you use this option, you should provide a di'''
