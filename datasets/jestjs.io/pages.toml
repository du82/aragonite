title = "Jest · 🃏 Delightful JavaScript Testing"
full_description = "Faça testes que tenham objetos grandes com facilidade. Snapshots vivem ao lado de seus testes, ou embutidos. De it para expect - Jest tem todo o conjunto de ferramentas em um só lugar. Bem documentado e mantido. Ao garantir que seus testes têm um estado global único, Jest pode executar testes em paralelo de forma confiável. Para tornar as coisas rápidas, Jest executa testes anteriores falharam primeiro e organiza novamente com base no quanto os arquivos de teste demoram. Crie relatórios de cobertura de código facilmente usando --coverage. Sem necessidade adicional de configurações ou bibliotecas! Jest consegue coletar informações de cobertura de código de projetos inteiros, incluindo arquivos não testados. Jest uses a custom resolver for imports in your tests, making it simple to mock any object outside of your test’s scope. You can use mocked imports with the rich Mock Functions API to spy on function calls with readable test syntax. Testes falham, quando eles ocorrem o Jest fornece um contexto rico do porque falhou, aqui estão alguns exemplos: Jest é um framework de teste em JavaScript projetado para garantir a correção de qualquer código JavaScript. Ele permite que você escreva testes com uma API acessível, familiar e rica em recursos que lhe dá resultados rapidamente. Jest está bem documentado, requer pouca configuração e pode ser estendido para corresponder aos seus requisitos. A equipe core do Jest e colaboradores regularmente falam sobre Jest e Agradavelmente Testando JavaScript. Confira nossas palestras sobre Construindo Ferramentas JavaScript de Alta Qualidade. na f2017 2017. ou nossa palestra sobre Testando com Snapshot na React Conf. Muita gente! Com mais de 300 milhões de downloads no último mês, e utilizado em mais de 11.000.000 de repositórios públicos no GitHub. Copyright OpenJS Foundation and Jest contributors. All rights reserved. The OpenJS Foundation has registered trademarks and uses trademarks. For a list of trademarks of the OpenJS Foundation, please see our Trademark Policy and Trademark List. Trademarks and logos not indicated on the list of OpenJS Foundation trademarks are trademarks™ or registered® trademarks of their respective holders. Use of them does not imply any affiliation with or endorsement by them."
