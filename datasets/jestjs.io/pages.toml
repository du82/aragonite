title = "Блог · Jest"
full_description = "Jest 29: Snapshot format changes25 серпня 2022 р. · Одна хвилина читанняSimen BekkhusJest 29 is here, just a few short months after Jest 28. As mentioned in the Jest 28 blog post, this version contains just a couple of breaking changes, in order to make the upgrade as smooth as possible.Read more Jest joins OpenJS Foundation11 травня 2022 р. · Одна хвилина читанняRicky Hanlon Today we're excited to announce that Jest is joining the OpenJS Foundation! This change transfers ownership of the project from Meta to the Jest Core team via the OpenJS Foundation as an Impact Project. We’re grateful to Meta for creating Jest and all of their support over the years, and we look forward to the future of Jest as a project owned by the Jest community! Check out the Meta Engineering blog and OpenJS Foundation blog announcements for more info. Jest 28: Shedding weight and improving compatibility 🫶25 квітня 2022 р. · 8 хвилин читанняSimen BekkhusJest 28 is finally here, and it comes with some long requested features such as support for sharding a test run across multiple machines, package exports and the ability to customize the behavior of fake timers. These are just some personal highlights, and we'll be highlighting more in this blog post. Additionally, as announced in the Jest 27 blog post last year, we have removed some packages that no longer are used by default from the default installation. As a result the installation size has dropped by about 1/3.Read more Jest 27: New Defaults for Jest, 2021 edition ⏩25 травня 2021 р. · 7 хвилин читанняTim SeckingerIn the Jest 26 blog post about a year ago, we announced that after two major releases with few breaking changes, Jest 27 will flip some switches to set better defaults for projects that are new or can migrate smoothly. This gives us the opportunity to remove some packages from the default distribution of Jest 28 and publish them as separately installable and pluggable modules instead. Everyone on the new defaults can benefit from a smaller install size, while people needing these packages can still install them separately. With the first major change of defaults since the New Defaults for Jest that came with the seminal version 15, Jest 27 is now here, to keep Jest fast, lean, and relevant in the future. We will explain those changes of defaults and other notable breaking changes in this post, but first, let's get into some exciting new features!Read more"
