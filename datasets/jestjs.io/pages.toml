["https://jestjs.io/docs/jest-object"]
title = "The Jest Object · Jest"
description = "The jest object is automatically in scope within every test file. The methods in the jest object help create mocks and let you control Jest's overall behavior. It can also be imported explicitly by via import  from '@jest/globals'."
full_description = '''The Jest ObjectVersion: 29.7On this pageThe Jest ObjectThe jest object is automatically in scope within every test file. The methods in the jest object help create mocks and let you control Jest's overall behavior. It can also be imported explicitly by via import {jest} from '@jest/globals'. infoThe TypeScript examples from this page will only work as documented if you explicitly import Jest APIs:import {expect, jest, test} from '@jest/globals';Consult the Getting Started guide for details on how to setup Jest with TypeScript. Methods​ Mock Modulesjest.disableAutomock()jest.enableAutomock()jest.createMockFromModule(moduleName)jest.mock(moduleName, factory, options)jest.Mocked<Source>jest.mocked(source, options?)jest.unmock(moduleName)jest.deepUnmock(moduleName)jest.doMock(moduleName, factory, options)jest.dontMock(moduleName)jest.setMock(moduleName, moduleExports)jest.requireActual(moduleName)jest.requireMock(moduleName)jest.resetModules()jest.isolateModules(fn)jest.isolateModulesAsync(fn)Mock Functionsjest.fn(implementation?)jest.isMockFunction(fn)jest.replaceProperty(object, propertyKey, value)jest.spyOn(object, methodName)jest.spyOn(object, methodName, accessType?)jest.Replaced<Source>jest.Spied<Source>jest.clearAllMocks()jest.resetAllMocks()jest.restoreAllMocks()Fake Timersjest.useFakeTimers(fakeTimersConfig?)jest.useRealTimers()jest.runAllTicks()jest.runAllTimers()jest.runAllTimersAsync()jest.runAllImmediates()jest.advanceTimersByTime(msToRun)jest.advanceTimersByTimeAsync(msToRun)jest.runOnlyPendingTimers()jest.runOnlyPendingTimersAsync()jest.advanceTimersToNextTimer(steps)jest.advanceTimersToNextTimerAsync(steps)jest.clearAllTimers()jest.getTimerCount()jest.now()jest.setSystemTime(now?: number | Date)jest.getRealSystemTime()Miscjest.getSeed()jest.isEnvironmentTornDown()jest.retryTimes(numRetries, options?)jest.setTimeout(timeout) Mock Modules​ jest.disableAutomock()​ Disables automatic mocking in the module loader. infoAutomatic mocking should be enabled via automock configuration option for this method to have any effect. Also see documentation of the configuration option for more details.JavaScriptTypeScript/** @type {import('jest').Config} */const config = { automock: true,};module.exports = config;import type {Config} from 'jest';const config: Config = { automock: true,};export default config; After disableAutomock() is called, all require()s will return the real versions of each module (rather than a mocked version). utils.jsexport default { authorize: () => { return 'token'; },}; __tests__/disableAutomocking.jsimport utils from '../utils';jest.disableAutomock();test('original implementation', () => { // now we have the original implementation, // even if we set the automocking in a jest configuration expect(utils.authorize()).toBe('token');}); This is usually useful when you have a scenario where the number of dependencies you want to mock is far less than the number of dependencies that you don't. For example, if you're writing a test for a module that uses a large number of dependencies that can be reasonably classified as "implementation details" of the module, then you likely do not want to mock them. Examples of dependencies that might be considered "implementation details" are things ranging from language built-ins (e.g. Array.prototype methods) to highly common utility methods (e.g. underscore, lodash, array utilities, etc) and entire libraries like React.js. Returns the jest object for chaining. tipWhen using babel-jest, calls to disableAutomock() will automatically be hoisted to the top of the code block. Use autoMockOff() if you want to explicitly avoid this behavior. jest.enableAutomock()​ Enables automatic mocking in the module loader. infoFor more details on automatic mocking see documentation of automock configuration option. Example: utils.jsexport default { authorize: () => { return 'token'; }, isAuthorized: secret => secret === 'wizard',}; __tests__/enableAutomocking.jsjest.enableAutomock();import utils from '../utils';test('original implementation', () => { // now we have the mocked implementation, expect(utils.authorize._isMockFunction).toBeTruthy(); expect(utils.isAuthorized._isMockFunction).toBeTruthy();}); Returns the jest object for chaining. tipWhen using babel-jest, calls to enableAutomock will automatically be hoisted to the top of the code block. Use autoMockOn if you want to explicitly avoid this behavior. jest.createMockFromModule(moduleName)​ Given the name of a module, use the automatic mocking system to generate a mocked version of the module for you. This is useful when you want to create a manual mock that extends the automatic mock's behavior: JavaScriptTypeScriptutils.jsmodule.exports = { authorize: () => { return 'token'; }, isAuthorized: secret => secret === 'wizard',};__tests__/createMockFromModule.test.jsconst utils = jest.createMockFromModule('../utils');utils.isAuthorized = jest.fn(secret => secret === 'not wizard');test('implementation created by jest.createMockFromModule', () => { expect(jest.isMockFunction(utils.authorize)).toBe(true); expect(utils.isAuthorized('not wizard')).toBe(true);});utils.tsexport const utils = { authorize: () => { return 'token'; }, isAuthorized: (secret: string) => secret === 'wizard',};__tests__/createMockFromModule.test.tsconst {utils} = jest.createMockFromModule<typeof import('../utils')>('../utils');utils.isAuthorized = jest.fn((secret: string) => secret === 'not wizard');test('implementation created by jest.createMockFromModule', () => { expect(jest.isMockFunction(utils.authorize)).toBe(true); expect(utils.isAuthorized('not wizard')).toBe(true);}); This is how createMockFromModule will mock the following data types: Function​ Creates a new mock function. The new function has no formal parameters and when called will return undefined. This functionality also applies to async functions. Class​ Creates a new class. The interface of the original class is maintained, all of the class member functions and properties will be mocked. Object​ Creates a new deeply cloned object. The object keys are maintained and their values are mocked. Array​ Creates a new empty array, ignoring the original. Primitives​ Creates a new property with the same primitive value as the original property. Example: example.jsmodule.exports = { function: function square(a, b) { return a * b; }, asyncFunction: async function asyncSquare(a, b) { const result = (await a) * b; return result; }, class: new (class Bar { constructor() { this.array = [1, 2, 3]; } foo() {} })(), object: { baz: 'foo', bar: { fiz: 1, buzz: [1, 2, 3], }, }, array: [1, 2, 3], number: 123, string: 'baz', boolean: true, symbol: Symbol.for('a.b.c'),}; __tests__/example.test.jsconst example = jest.createMockFromModule('../example');test('should run example code', () => { // creates a new mocked function with no formal arguments. expect(example.function.name).toBe('square'); expect(example.function).toHaveLength(0); // async functions get the same treatment as standard synchronous functions. expect(example.asyncFunction.name).toBe('asyncSquare'); expect(example.asyncFunction).toHaveLength(0); // creates a new class with the same interface, member functions and properties are mocked. expect(example.class.constructor.name).toBe('Bar'); expect(example.class.foo.name).toBe('foo'); expect(example.class.array).toHaveLength(0); // creates a deeply cloned version of the original object. expect(example.object).toEqual({ baz: 'foo', bar: { fiz: 1, buzz: [], }, }); // creates a new empty array, ignoring the original array. expect(example.array).toHaveLength(0); // creates a new property with the same primitive value as the original property. expect(example.number).toBe(123); expect(example.string).toBe('baz'); expect(example.boolean).toBe(true); expect(example.symbol).toEqual(Symbol.for('a.b.c'));}); jest.mock(moduleName, factory, options)​ Mocks a module with an auto-mocked version when it is being required. factory and options are optional. For example: banana.jsmodule.exports = () => 'banana'; __tests__/test.jsjest.mock('../banana');const banana = require('../banana'); // banana will be explicitly mocked.banana(); // will return 'undefined' because the function is auto-mocked. The second argument can be used to specify an explicit module factory that is being run instead of using Jest's automocking feature: JavaScriptTypeScriptjest.mock('../moduleName', () => { return jest.fn(() => 42);});// This runs the function specified as second argument to `jest.mock`.const moduleName = require('../moduleName');moduleName(); // Will return '42';// The optional type argument provides typings for the module factoryjest.mock<typeof import('../moduleName')>('../moduleName', () => { return jest.fn(() => 42);});// This runs the function specified as second argument to `jest.mock`.const moduleName = require('../moduleName');moduleName(); // Will return '42'; When using the factory parameter for an ES6 module with a default export, the __esModule: true property needs to be specified. This property is normally generated by Babel / TypeScript, but here it needs to be set manually. When importing a default export, it's an instruction to import the property named default from the export object: import moduleName, {foo} from '../moduleName';jest.mock('../moduleName', () => { return { __esModule: true, default: jest.fn(() => 42), foo: jest.fn(() => 43), };});moduleName(); // Will return 42foo(); // Will return 43 The third argument can be used to create virtual mocks – mocks of modules that don't exist anywhere in the system: jest.mock( '../moduleName', () => { /* * Custom implementation of a module that doesn't exist in JS, * like a generated module or a native module in react-native. */ }, {virtual: true},); cautionImporting a module in a setup file (as specified by setupFilesAfterEnv) will prevent mocking for the module in question, as well as all the modules that it imports. Modules that are mocked with jest.mock are mocked only for the file that calls jest.mock. Another file that imports the module will get the original implementation even if it runs after the test file that mocks the module. Returns the jest object for chaining. tipWriting tests in TypeScript? Use the jest.Mocked utility type or the jest.mocked() helper method to have your mocked modules typed. jest.Mocked<Source>​ See TypeScript Usage chapter of Mock Functions page for documentation. jest.mocked(source, options?)​ See TypeScript Usage chapter of Mock Functions page for documentation. jest.unmock(moduleName)​ Indicates that the module system should never return a mocked version of the specified module from require() (e.g. that it should always return the real module). The most common use of this API is for specifying the module a given test intends to be testing (and thus doesn't want automatically mocked). Returns the jest object for chaining. jest.deepUnmock(moduleName)​ Indicates that the module system should never return a mocked version of the specified module and its dependencies. Returns the jest object for chaining. jest.doMock(moduleName, factory, options)​ When using babel-jest, calls to mock will automatically be hoisted to the top of the code block. Use this method if you want to explicitly avoid this behavior. One example when this is useful is when you want to mock a module differently within the same file: JavaScriptTypeScriptbeforeEach(() => { jest.resetModules();});test('moduleName 1', () => { jest.doMock('../moduleName', () => { return jest.fn(() => 1); }); const moduleName = require('../moduleName'); expect(moduleName()).toBe(1);});test('moduleName 2', () => { jest.doMock('../moduleName', () => { return jest.fn(() => 2); }); const moduleName = require('../moduleName'); expect(moduleName()).toBe(2);});beforeEach(() => { jest.resetModules();});test('moduleName 1', () => { // The optional type argument provides typings for the module factory jest.doMock<typeof import('../moduleName')>('../moduleName', () => { return jest.fn(() => 1); }); const moduleName = require('../moduleName'); expect(moduleName()).toBe(1);});test('moduleName 2', () => { jest.doMock<typeof import('../moduleName')>('../moduleName', () => { return jest.fn(() => 2); }); const moduleName = require('../moduleName'); expect(moduleName()).toBe(2);}); Using jest.doMock() with ES6 imports requires additional steps. Follow these if you don't want to use require in your tests: We have to specify the __esModule: true property (see the jest.mock() API for more information). Static ES6 module imports are hoisted to the top of the file, so instead we have to import them dynamically using import(). Finally, we need an environment which supports dynamic importing. Please see Using Babel for the initial setup. Then add the plugin babel-plugin-dynamic-import-node, or an equivalent, to your Babel config to enable dynamic importing in Node. beforeEach(() => { jest.resetModules();});test('moduleName 1', () => { jest.doMock('../moduleName', () => { return { __esModule: true, default: 'default1', foo: 'foo1', }; }); return import('../moduleName').then(moduleName => { expect(moduleName.default).toBe('default1'); expect(moduleName.foo).toBe('foo1'); });});test('moduleName 2', () => { jest.doMock('../moduleName', () => { return { __esModule: true, default: 'default2', foo: 'foo2', }; }); return import('../moduleName').then(moduleName => { expect(moduleName.default).toBe('default2'); expect(moduleName.foo).toBe('foo2'); });}); Returns the jest object for chaining. jest.dontMock(moduleName)​ When using babel-jest, calls to unmock will automatically be hoisted to the top of the code block. Use this method if you want to explicitly avoid this behavior. Returns the jest object for chaining. jest.setMock(moduleName, moduleExports)​ Explicitly supplies the mock object that the module system should return for the specified module. On occasion, there are times where the automatically generated mock the module system would normally provide you isn't adequate enough for your testing needs. Normally under those circumstances you should write a manual mock that is more adequate for the module in question. However, on extremely rare occasions, even a manual mock isn't suitable for your purposes and you need to build the mock yourself inside your test. In these rare scenarios you can use this API to manually fill the slot in the module system's mock-module registry. Returns the jest object for chaining. infoIt is recommended to use jest.mock() instead. The jest.mock API's second argument is a module factory instead of the expected exported module object. jest.requireActual(moduleName)​ Returns the actual module instead of a mock, bypassing all checks on whether the module should receive a mock implementation or not. JavaScriptTypeScriptjest.mock('../myModule', () => { // Require the original module to not be mocked... const originalModule = jest.requireActual('../myModule'); return { __esModule: true, // Use'''
