title = "Mock Functions · Jest"
description = 'Mock functions are also known as "spies", because they let you spy on the behavior of a function that is called indirectly by some other code, rather than only testing the output. You can create a mock function with jest.fn(). If no implementation is given, the mock function will return undefined when invoked.'
full_description = '''Mock FunctionsVersion: 29.4On this pageMock FunctionsMock functions are also known as "spies", because they let you spy on the behavior of a function that is called indirectly by some other code, rather than only testing the output. You can create a mock function with jest.fn(). If no implementation is given, the mock function will return undefined when invoked. infoThe TypeScript examples from this page will only work as documented if you explicitly import Jest APIs:import {expect, jest, test} from '@jest/globals';Consult the Getting Started guide for details on how to setup Jest with TypeScript. Methods​ ReferencemockFn.getMockName()mockFn.mock.callsmockFn.mock.resultsmockFn.mock.instancesmockFn.mock.contextsmockFn.mock.lastCallmockFn.mockClear()mockFn.mockReset()mockFn.mockRestore()mockFn.mockImplementation(fn)mockFn.mockImplementationOnce(fn)mockFn.mockName(name)mockFn.mockReturnThis()mockFn.mockReturnValue(value)mockFn.mockReturnValueOnce(value)mockFn.mockResolvedValue(value)mockFn.mockResolvedValueOnce(value)mockFn.mockRejectedValue(value)mockFn.mockRejectedValueOnce(value)mockFn.withImplementation(fn, callback)Replaced PropertiesreplacedProperty.replaceValue(value)replacedProperty.restore()TypeScript Usagejest.fn(implementation?)jest.Mock<T>jest.Mocked<Source>jest.Replaced<Source>jest.mocked(source, options?)jest.Spied<Source> Reference​ mockFn.getMockName()​ Returns the mock name string set by calling .mockName(). mockFn.mock.calls​ An array containing the call arguments of all calls that have been made to this mock function. Each item in the array is an array of arguments that were passed during the call. For example: A mock function f that has been called twice, with the arguments f('arg1', 'arg2'), and then with the arguments f('arg3', 'arg4'), would have a mock.calls array that looks like this: [ ['arg1', 'arg2'], ['arg3', 'arg4'],]; mockFn.mock.results​ An array containing the results of all calls that have been made to this mock function. Each entry in this array is an object containing a type property, and a value property. type will be one of the following: 'return' - Indicates that the call completed by returning normally. 'throw' - Indicates that the call completed by throwing a value. 'incomplete' - Indicates that the call has not yet completed. This occurs if you test the result from within the mock function itself, or from within a function that was called by the mock. The value property contains the value that was thrown or returned. value is undefined when type === 'incomplete'. For example: A mock function f that has been called three times, returning 'result1', throwing an error, and then returning 'result2', would have a mock.results array that looks like this: [ { type: 'return', value: 'result1', }, { type: 'throw', value: { /* Error instance */ }, }, { type: 'return', value: 'result2', },]; mockFn.mock.instances​ An array that contains all the object instances that have been instantiated from this mock function using new. For example: A mock function that has been instantiated twice would have the following mock.instances array: const mockFn = jest.fn();const a = new mockFn();const b = new mockFn();mockFn.mock.instances[0] === a; // truemockFn.mock.instances[1] === b; // true mockFn.mock.contexts​ An array that contains the contexts for all calls of the mock function. A context is the this value that a function receives when called. The context can be set using Function.prototype.bind, Function.prototype.call or Function.prototype.apply. For example: const mockFn = jest.fn();const boundMockFn = mockFn.bind(thisContext0);boundMockFn('a', 'b');mockFn.call(thisContext1, 'a', 'b');mockFn.apply(thisContext2, ['a', 'b']);mockFn.mock.contexts[0] === thisContext0; // truemockFn.mock.contexts[1] === thisContext1; // truemockFn.mock.contexts[2] === thisContext2; // true mockFn.mock.lastCall​ An array containing the call arguments of the last call that was made to this mock function. If the function was not called, it will return undefined. For example: A mock function f that has been called twice, with the arguments f('arg1', 'arg2'), and then with the arguments f('arg3', 'arg4'), would have a mock.lastCall array that looks like this: ['arg3', 'arg4']; mockFn.mockClear()​ Clears all information stored in the mockFn.mock.calls, mockFn.mock.instances, mockFn.mock.contexts and mockFn.mock.results arrays. Often this is useful when you want to clean up a mocks usage data between two assertions. The clearMocks configuration option is available to clear mocks automatically before each tests. cautionBeware that mockFn.mockClear() will replace mockFn.mock, not just reset the values of its properties! You should, therefore, avoid assigning mockFn.mock to other variables, temporary or not, to make sure you don't access stale data. mockFn.mockReset()​ Does everything that mockFn.mockClear() does, and also replaces the mock implementation with an empty function, returning undefined. The resetMocks configuration option is available to reset mocks automatically before each test. mockFn.mockRestore()​ Does everything that mockFn.mockReset() does, and also restores the original (non-mocked) implementation. This is useful when you want to mock functions in certain test cases and restore the original implementation in others. The restoreMocks configuration option is available to restore mocks automatically before each test. infomockFn.mockRestore() only works when the mock was created with jest.spyOn(). Thus you have to take care of restoration yourself when manually assigning jest.fn(). mockFn.mockImplementation(fn)​ Accepts a function that should be used as the implementation of the mock. The mock itself will still record all calls that go into and instances that come from itself – the only difference is that the implementation will also be executed when the mock is called. tipjest.fn(implementation) is a shorthand for jest.fn().mockImplementation(implementation). JavaScriptTypeScriptconst mockFn = jest.fn(scalar => 42 + scalar);mockFn(0); // 42mockFn(1); // 43mockFn.mockImplementation(scalar => 36 + scalar);mockFn(2); // 38mockFn(3); // 39import {jest} from '@jest/globals';const mockFn = jest.fn((scalar: number) => 42 + scalar);mockFn(0); // 42mockFn(1); // 43mockFn.mockImplementation(scalar => 36 + scalar);mockFn(2); // 38mockFn(3); // 39 .mockImplementation() can also be used to mock class constructors: JavaScriptTypeScriptSomeClass.jsmodule.exports = class SomeClass { method(a, b) {}};SomeClass.test.jsconst SomeClass = require('./SomeClass');jest.mock('./SomeClass'); // this happens automatically with automockingconst mockMethod = jest.fn();SomeClass.mockImplementation(() => { return { method: mockMethod, };});const some = new SomeClass();some.method('a', 'b');console.log('Calls to method:', mockMethod.mock.calls);SomeClass.tsexport class SomeClass { method(a: string, b: string): void {}}SomeClass.test.tsimport {jest} from '@jest/globals';import {SomeClass} from './SomeClass';jest.mock('./SomeClass'); // this happens automatically with automockingconst mockMethod = jest.fn<(a: string, b: string) => void>();jest.mocked(SomeClass).mockImplementation(() => { return { method: mockMethod, };});const some = new SomeClass();some.method('a', 'b');console.log('Calls to method:', mockMethod.mock.calls); mockFn.mockImplementationOnce(fn)​ Accepts a function that will be used as an implementation of the mock for one call to the mocked function. Can be chained so that multiple function calls produce different results. JavaScriptTypeScriptconst mockFn = jest .fn() .mockImplementationOnce(cb => cb(null, true)) .mockImplementationOnce(cb => cb(null, false));mockFn((err, val) => console.log(val)); // truemockFn((err, val) => console.log(val)); // falseimport {jest} from '@jest/globals';const mockFn = jest .fn<(cb: (a: null, b: boolean) => void) => void>() .mockImplementationOnce(cb => cb(null, true)) .mockImplementationOnce(cb => cb(null, false));mockFn((err, val) => console.log(val)); // truemockFn((err, val) => console.log(val)); // false When the mocked function runs out of implementations defined with .mockImplementationOnce(), it will execute the default implementation set with jest.fn(() => defaultValue) or .mockImplementation(() => defaultValue) if they were called: const mockFn = jest .fn(() => 'default') .mockImplementationOnce(() => 'first call') .mockImplementationOnce(() => 'second call');mockFn(); // 'first call'mockFn(); // 'second call'mockFn(); // 'default'mockFn(); // 'default' mockFn.mockName(name)​ Accepts a string to use in test result output in place of 'jest.fn()' to indicate which mock function is being referenced. For example: const mockFn = jest.fn().mockName('mockedFunction');// mockFn();expect(mockFn).toHaveBeenCalled(); Will result in this error: expect(mockedFunction).toHaveBeenCalled()Expected number of calls: >= 1Received number of calls: 0 mockFn.mockReturnThis()​ Shorthand for: jest.fn(function () { return this;}); mockFn.mockReturnValue(value)​ Shorthand for: jest.fn().mockImplementation(() => value); Accepts a value that will be returned whenever the mock function is called. JavaScriptTypeScriptconst mock = jest.fn();mock.mockReturnValue(42);mock(); // 42mock.mockReturnValue(43);mock(); // 43import {jest} from '@jest/globals';const mock = jest.fn<() => number>();mock.mockReturnValue(42);mock(); // 42mock.mockReturnValue(43);mock(); // 43 mockFn.mockReturnValueOnce(value)​ Shorthand for: jest.fn().mockImplementationOnce(() => value); Accepts a value that will be returned for one call to the mock function. Can be chained so that successive calls to the mock function return different values. When there are no more mockReturnValueOnce values to use, calls will return a value specified by mockReturnValue. JavaScriptTypeScriptconst mockFn = jest .fn() .mockReturnValue('default') .mockReturnValueOnce('first call') .mockReturnValueOnce('second call');mockFn(); // 'first call'mockFn(); // 'second call'mockFn(); // 'default'mockFn(); // 'default'import {jest} from '@jest/globals';const mockFn = jest .fn<() => string>() .mockReturnValue('default') .mockReturnValueOnce('first call') .mockReturnValueOnce('second call');mockFn(); // 'first call'mockFn(); // 'second call'mockFn(); // 'default'mockFn(); // 'default' mockFn.mockResolvedValue(value)​ Shorthand for: jest.fn().mockImplementation(() => Promise.resolve(value)); Useful to mock async functions in async tests: JavaScriptTypeScripttest('async test', async () => { const asyncMock = jest.fn().mockResolvedValue(43); await asyncMock(); // 43});import {jest, test} from '@jest/globals';test('async test', async () => { const asyncMock = jest.fn<() => Promise<number>>().mockResolvedValue(43); await asyncMock(); // 43}); mockFn.mockResolvedValueOnce(value)​ Shorthand for: jest.fn().mockImplementationOnce(() => Promise.resolve(value)); Useful to resolve different values over multiple async calls: JavaScriptTypeScripttest('async test', async () => { const asyncMock = jest .fn() .mockResolvedValue('default') .mockResolvedValueOnce('first call') .mockResolvedValueOnce('second call'); await asyncMock(); // 'first call' await asyncMock(); // 'second call' await asyncMock(); // 'default' await asyncMock(); // 'default'});import {jest, test} from '@jest/globals';test('async test', async () => { const asyncMock = jest .fn<() => Promise<string>>() .mockResolvedValue('default') .mockResolvedValueOnce('first call') .mockResolvedValueOnce('second call'); await asyncMock(); // 'first call' await asyncMock(); // 'second call' await asyncMock(); // 'default' await asyncMock(); // 'default'}); mockFn.mockRejectedValue(value)​ Shorthand for: jest.fn().mockImplementation(() => Promise.reject(value)); Useful to create async mock functions that will always reject: JavaScriptTypeScripttest('async test', async () => { const asyncMock = jest .fn() .mockRejectedValue(new Error('Async error message')); await asyncMock(); // throws 'Async error message'});import {jest, test} from '@jest/globals';test('async test', async () => { const asyncMock = jest .fn<() => Promise<never>>() .mockRejectedValue(new Error('Async error message')); await asyncMock(); // throws 'Async error message'}); mockFn.mockRejectedValueOnce(value)​ Shorthand for: jest.fn().mockImplementationOnce(() => Promise.reject(value)); Useful together with .mockResolvedValueOnce() or to reject with different exceptions over multiple async calls: JavaScriptTypeScripttest('async test', async () => { const asyncMock = jest .fn() .mockResolvedValueOnce('first call') .mockRejectedValueOnce(new Error('Async error message')); await asyncMock(); // 'first call' await asyncMock(); // throws 'Async error message'});import {jest, test} from '@jest/globals';test('async test', async () => { const asyncMock = jest .fn<() => Promise<string>>() .mockResolvedValueOnce('first call') .mockRejectedValueOnce(new Error('Async error message')); await asyncMock(); // 'first call' await asyncMock(); // throws 'Async error message'}); mockFn.withImplementation(fn, callback)​ Accepts a function which should be temporarily used as the implementation of the mock while the callback is being executed. test('test', () => { const mock = jest.fn(() => 'outside callback'); mock.withImplementation( () => 'inside callback', () => { mock(); // 'inside callback' }, ); mock(); // 'outside callback'}); mockFn.withImplementation can be used regardless of whether or not the callback is asynchronous (returns a thenable). If the callback is asynchronous a promise will be returned. Awaiting the promise will await the callback and reset the implementation. test('async test', async () => { const mock = jest.fn(() => 'outside callback'); // We await this call since the callback is async await mock.withImplementation( () => 'inside callback', async () => { mock(); // 'inside callback' }, ); mock(); // 'outside callback'}); Replaced Properties​ replacedProperty.replaceValue(value)​ Changes the value of already replaced property. This is useful when you want to replace property and then adjust the value in specific tests. As an alternative, you can call jest.replaceProperty() multiple times on same property. replacedProperty.restore()​ Restores object's property to the original value. Beware that replacedProperty.restore() only works when the property value was replaced with jest.replaceProperty(). The restoreMocks configuration option is available to restore replaced properties automatically before each test. TypeScript Usage​ infoThe TypeScript examples from this page will only work as documented if you explicitly import Jest APIs:import {expect, jest, test} from '@jest/globals';Consult the Getting Started guide for details on how to setup Jest with TypeScript. jest.fn(implementation?)​ Correct mock typings will be inferred if implementation is passed to jest.fn(). There are many use cases where the implementation is omitted. To ensure type safety you may pass a generic'''
