title = "Jest · 🃏 Delightful JavaScript Testing"
full_description = "Jest – це чудовий фреймворк для тестування JavaScript з акцентом на простоті. Він працює з проектами, що використовують: Babel, TypeScript, Node, React, Angular, Vue та багато іншого! Мета Jest — працювати з коробки, без налаштувань для більшості JavaScript проектів. Відслідковуйте великі об'єкти в тестах без зайвих зусиль. Знімки живуть поруч з вашими тестами або вбудовуються прямо в них. Тести виконуються паралельно шляхом запуску їх у власних процесах для підвищення продуктивності. Від it до expect - з Jest всі інструменти знаходяться в одному місці. Добре документовані і добре підтримувані. Забезпечуючи для ваших тестів ункальний глобальний контекст, Jest може надійно виконувати тести паралельно. Щоб пришвидшити роботу, Jest спочатку запускає тести, які завершалися з помилками і постійно реорганізує порядок виконання тестів на основі того, як довго вони виконуються. Генеруйте звіт про покриття коду використовуючи параметр --coverage. Не потрібно ніяких додаткових налаштувань. Jest може збирати інформацію про покриття коду зі всього проекту, включаючи не тестовані файли. Jest використовує власний резолер для імпортів у ваших тестах, що дозволяє легко створювати об’єкти-імітації для будь якого модуля за межами видимості тесту. Ви можете використовувати імітований імпорт з багатими імітаційними функціями API для відслідковування викликів функцій зі зручним синтаксисом тестів."
