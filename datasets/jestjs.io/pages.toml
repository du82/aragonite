title = "Jest · 🃏 Delightful JavaScript Testing"
full_description = "Jest — это восхитительный фреймворк для тестирования JavaScript с акцентом на простоту. Работает с проектами, использующими Babel, TypeScript, Node, React, Angular, Vue и многое другое! Jest нацелен на работу из коробки, без дополнительных настроек, для большинства проектов на JavaScript. Пишите тесты, которые легко отслеживают большие объекты. Снимки живут либо рядом с вашими тестами, либо прописаны прямо в коде. Тесты выполняются параллельно, запускаясь в своих собственных потоках, для достижения максимальной производительности. От it до expect — Jest обладает полноценным набором инструментов из коробки. Хорошо документированный, хорошо поддерживаемый, просто хороший. Обеспечивая вашим тестам уникальное глобальное состояние, Jest добивается безошибочного запуска тестов в параллельных потоках. Чтобы делать это быстро, Jest в первую очередь запускает проваленные ранее тесты, и меняет очередность их запуска, отталкиваясь от того, как долго выполняется каждый тест. Генерируйте покрытие кода добавив флаг --coverage. Никаких дополнительных настроек не требуется. Jest может собирать данные о покрытии кода со всего проекта, включая не протестированные файлы."
