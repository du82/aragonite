title = "ブログ · Jest"
full_description = "Jest 29: スナップショットフォーマットの変更2022年8月25日 · 読むのにかかる時間 1分Simen BekkhusJust 28 から数カ月後しか経っていませんが、Jest 29 がリリースされました。 Jest 28 ブログ記事で説明したように、アップグレードをできるだけスムーズなものにするために、このバージョンには破壊的変更がいくつか含まれています。Read more Jest joins OpenJS Foundation2022年5月11日 · 読むのにかかる時間 1分Ricky Hanlon Today we're excited to announce that Jest is joining the OpenJS Foundation! This change transfers ownership of the project from Meta to the Jest Core team via the OpenJS Foundation as an Impact Project. We’re grateful to Meta for creating Jest and all of their support over the years, and we look forward to the future of Jest as a project owned by the Jest community! Check out the Meta Engineering blog and OpenJS Foundation blog announcements for more info. Jest 28: Shedding weight and improving compatibility 🫶2022年4月25日 · 読むのにかかる時間 1分Simen BekkhusJest 28 is finally here, and it comes with some long requested features such as support for sharding a test run across multiple machines, package exports and the ability to customize the behavior of fake timers. These are just some personal highlights, and we'll be highlighting more in this blog post. Additionally, as announced in the Jest 27 blog post last year, we have removed some packages that no longer are used by default from the default installation. As a result the installation size has dropped by about 1/3.Read more Jest 27: Jest の新しいデフォルト設定 - 2021 年版 ⏩2021年5月25日 · 読むのにかかる時間 1分Tim Seckinger約1年前の Jest 26 のブログポスト内で発表したのは、2つのメジャーリリースでいくつかの破壊的変更を行った後、Jest 27 で新しいプロジェクトやスムーズな移行のために一部の設定をよりよいデフォルトに切り替えることでした。 これにより、Jest 28 のデフォルトの配布物からいくつかのパッケージを削除し、個別にインストール可能でプラガブルなモジュールとして公開する機会が得られます。 新しいデフォルト設定ではインストールサイズが小さくなるため、すべての人が恩恵を受けることができます。一方でこれらのパッケージが必要な人は、個別にインストールすることもできます。 Jest 27では、Jestの高速性、効率性、将来性を維持するためにmバージョン15に付属していた New Defaults for Jest 以来の大きなデフォルト設定の変更が行われました。 この記事では、これらのデフォルトの変更やその他の注目すべき変更点について説明しますが、その前に、エキサイティングな新機能についてご紹介します！Read more"
