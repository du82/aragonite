title = "Jest · 🃏 Delightful JavaScript Testing"
full_description = "确保您的测试具有独一无二的全局状态，Jest 才能可靠地并行测试。为了缩短测试时间，Jest 会优先运行未通过的测试，并根据每个测试的时长调整测试顺序。 无需其他操作，您仅需添加 --coverage 参数来生成代码覆盖率报告。Jest 可以收集整个项目的覆盖信息，包括未测试的文件。 Jest 使用自定义解析器来导入您测试中的依赖，让您轻松模拟测试范围外的对象。您可使用富模拟函数 来模拟导入，并借由简单易读的测试语法监视函数调用。 Jest 是一款保障代码正确的 JavaScript 测试框架，提供您熟悉且功能完善的接口来快速完成测试。 Jest 核心团队及贡献者会定期探讨Jest 与愉悦进行 JavaScript 测试。来看看我们在 jsconf.eu 2017 上的构建高质量的 JavaScript 工具及 ReactiveConf 2017 上的 Jest 即平台讲座吧！ A lot of people! With 300+ million downloads in the last month, and used on over 11,000,000 public repos on GitHub. Copyright OpenJS Foundation and Jest contributors. All rights reserved. The OpenJS Foundation has registered trademarks and uses trademarks. For a list of trademarks of the OpenJS Foundation, please see our Trademark Policy and Trademark List. Trademarks and logos not indicated on the list of OpenJS Foundation trademarks are trademarks™ or registered® trademarks of their respective holders. Use of them does not imply any affiliation with or endorsement by them. The OpenJS Foundation | Terms of Use | Privacy Policy | Bylaws | Code of Conduct | Trademark Policy | Trademark List | Cookie Policy"
