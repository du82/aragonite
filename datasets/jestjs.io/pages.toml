["https://jestjs.io/fr/blog"]
title = "Blog · Jest"
full_description = "Jest 29 : Changements de format de snapshot25 août 2022 · Une minute de lectureSimen BekkhusJest 29 est là, juste quelques mois après Jest 28. Comme mentionné dans l'article du blog Jest 28, cette version contient juste quelques changements de rupture, afin de rendre la mise à jour aussi douce que possible.Read more Jest rejoint la fondation OpenJS11 mai 2022 · Une minute de lectureRicky Hanlon Aujourd'hui, nous sommes heureux d'annoncer que Jest rejoint la Fondation OpenJS ! Ce changement transfère la propriété du projet de Meta à l'équipe principale de Jest via la Fondation OpenJS en tant que projet d'impact. Nous sommes reconnaissants envers Meta pour la création de Jest et pour tout son soutien au fil des ans, et nous nous réjouissons de l'avenir de Jest en tant que projet appartenant à la communauté Jest ! Consultez le blog de l'ingénierie Meta et les annonces du blog de la Fondation OpenJS pour plus d'informations. Jest 28 : Perte de poids et compatibilité accrue 🫶25 avril 2022 · 9 minutes de lectureSimen BekkhusJest 28 est enfin là, et il est livré avec certaines fonctionnalités demandées depuis longtemps, telles que le support du partage de l'exécution de test sur plusieurs machines, les exports de paquets et la possibilité de personnaliser le comportement des faux temporisateurs. Il ne s'agit là que de quelques points marquants et nous en soulignerons d'autres dans cet article du blog. De plus, comme annoncé dans l'article du blog consacré à Jest 27 l'année dernière, nous avons supprimé de l'installation par défaut certains paquets qui ne sont plus utilisés par défaut. En conséquence, la taille de l'installation a diminué d'environ 1/3.Read more Jest 27 : nouvelles valeurs par défaut pour Jest, édition 2021 ⏩25 mai 2021 · 8 minutes de lectureTim SeckingerDans l'article du blog pour Jest 26, il y a environ un an, nous avons annoncé qu'après deux versions majeures avec peu de modifications de rupture, Jest 27 basculera quelques interrupteurs afin de définir de meilleures valeurs par défaut pour les projets qui sont nouveaux ou qui peuvent migrer en douceur. Cela nous donne l'opportunité de retirer certains paquets de la distribution par défaut de Jest 28 et de les publier en tant que modules installables et connectables séparément. Tous ceux qui utilisent les nouvelles valeurs par défaut peuvent bénéficier d'une installation plus petite, tandis que ceux qui ont besoin de ces paquets peuvent toujours les installer séparément. Avec le premier changement majeur des valeurs par défaut depuis les nouvelles valeurs par défaut pour Jest qui accompagnaient la version 15, Jest 27 est maintenant là, pour que Jest reste rapide, léger et pertinent dans le futur. Nous expliquerons ces changements de valeurs par défaut et d'autres changements notables dans cet article, mais tout d'abord, nous allons aborder les nouvelles fonctionnalités !Read more"
