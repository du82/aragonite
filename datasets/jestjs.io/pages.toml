title = "Jest · 🃏 Delightful JavaScript Testing"
full_description = "Make tests which keep track of large objects with ease. Snapshots live either alongside your tests, or embedded inline. From it to expect - Jest has the entire toolkit in one place. Well documented, well maintained, well good. By ensuring your tests have unique global state, Jest can reliably run tests in parallel. To make things quick, Jest runs previously failed tests first and re-organizes runs based on how long test files take. Generate code coverage by adding the flag --coverage. No additional setup needed. Jest can collect code coverage information from entire projects, including untested files. Jest uses a custom resolver for imports in your tests, making it simple to mock any object outside of your test’s scope. You can use mocked imports with the rich Mock Functions API to spy on function calls with readable test syntax. Jest is a JavaScript testing framework designed to ensure correctness of any JavaScript codebase. It allows you to write tests with an approachable, familiar and feature-rich API that gives you results quickly. Jest is well-documented, requires little configuration and can be extended to match your requirements. The Jest core team and contributors regularly speak about Jest and Delightful JavaScript Testing. Check out our talk about Building High-Quality JavaScript Tools at jsconf.eu 2017 and our talk about Jest as a Platform at ReactiveConf 2017. A lot of people! With 300+ million downloads in the last month, and used on over 11,000,000 public repos on GitHub. Copyright OpenJS Foundation and Jest contributors. All rights reserved. The OpenJS Foundation has registered trademarks and uses trademarks. For a list of trademarks of the OpenJS Foundation, please see our Trademark Policy and Trademark List. Trademarks and logos not indicated on the list of OpenJS Foundation trademarks are trademarks™ or registered® trademarks of their respective holders. Use of them does not imply any affiliation with or endorsement by them. The OpenJS Foundation | Terms of Use | Privacy Policy | Bylaws | Code of Conduct | Trademark Policy | Trademark List | Cookie Policy"
