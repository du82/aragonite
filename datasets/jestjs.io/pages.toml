full_description = "Jest はシンプルさを重視した、快適な JavaScript テスティングフレームワークです。 Babel、TypeScript、Node、React、Angular、Vue など、様々なフレームワークを利用したプロジェクトで動作します！ Jest はほとんどの JavaScript プロジェクトにおいて、細かい設定不要で動作することを目指しています。 スナップショット機能で大きなオブジェクトを容易に追跡できるテストを作成できます。スナップショットはテストと一緒に、あるいはインラインに埋め込んだ状態で表示できます。 パフォーマンスを最大化するために、別々のプロセスで実行してテストを並列化します。 it から expect まで――。 Jest にはすべてのツールキットが1つにまとまっています。きちんとドキュメント化され、よくメンテナンスされている、優れたツールキットです。 テストが一意なグローバル状態を持つことを保証することで、Jest は安全にテストを並列実行できます。開発効率が上がるよう、Jest は以前に失敗したテストを最初に実行し、テストファイルの所要時間に基づいて再整理します。 フラグ --coverage を指定することで、コードカバレッジを生成します。追加の設定は必要ありません。Jest は未テストのファイルを含むプロジェクト全体からコードカバレッジ情報を収集できます。 Jestではテストにおけるインポートに独自のリゾルバを使用することで、テストスコープ外のオブジェクトを簡単にモックできます。 豊富なモック機能 API でモックされたインポートを使用して、読みやすいテスト構文で関数呼び出しをスパイすることができます。 テストが失敗したとき、Jest は理由をわかりやすく示します。ここではいくつかの例を紹介します。"
