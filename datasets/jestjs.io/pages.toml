title = "Configuring Jest · Jest"
description = "The Jest philosophy is to work great by default, but sometimes you just need more configuration power."
full_description = "Configuring JestVersion: 29.7On this pageConfiguring JestThe Jest philosophy is to work great by default, but sometimes you just need more configuration power. It is recommended to define the configuration in a dedicated JavaScript, TypeScript or JSON file. The file will be discovered automatically, if it is named jest.config.js|ts|mjs|cjs|json. You can use --config flag to pass an explicit path to the file. noteKeep in mind that the resulting configuration object must always be JSON-serializable. The configuration file should simply export an object: JavaScriptTypeScript/** @type {import('jest').Config} */const config = { verbose: true,};module.exports = config;import type {Config} from 'jest';const config: Config = { verbose: true,};export default config; Or a function returning an object: JavaScriptTypeScript/** @returns {Promise<import('jest').Config>} */module.exports = async () => { return { verbose: true, };};import type {Config} from 'jest';export default async (): Promise<Config> => { return { verbose: true, };}; tipTo read TypeScript configuration files Jest requires ts-node. Make sure it is installed in your project. The configuration also can be stored in a JSON file as a plain object: jest.config.json{ \"bail\": 1, \"verbose\": true} Alternatively Jest's configuration can be defined through the \"jest\" key in the package.json of your project: package.json{ \"name\": \"my-project\", \"jest\": { \"verbose\": true }} Options​ infoYou can retrieve Jest's defaults from jest-config to extend them if needed:JavaScriptTypeScriptconst {defaults} = require('jest-config');/** @type {import('jest').Config} */const config = { moduleFileExtensions: [...defaults.moduleFileExtensions, 'mts', 'cts'],};module.exports = config;import type {Config} from 'jest';import {defaults} from 'jest-config';const config: Config = { moduleFileExtensions: [...defaults.moduleFileExtensions, 'mts'],};export default config; automock [boolean]bail [number | boolean]cacheDirectory [string]clearMocks [boolean]collectCoverage [boolean]collectCoverageFrom [array]coverageDirectory [string]coveragePathIgnorePatterns [array<string>]coverageProvider [string]coverageReporters [array<string | [string, options]>]coverageThreshold [object]dependencyExtractor [string]displayName [string, object]errorOnDeprecated [boolean]extensionsToTreatAsEsm [array<string>]fakeTimers [object]forceCoverageMatch [array<string>]globals [object]globalSetup [string]globalTeardown [string]haste [object]injectGlobals [boolean]maxConcurrency [number]maxWorkers [number | string]moduleDirectories [array<string>]moduleFileExtensions [array<string>]moduleNameMapper [object<string, string | array<string>>]modulePathIgnorePatterns [array<string>]modulePaths [array<string>]notify [boolean]notifyMode [string]openHandlesTimeout [number]preset [string]prettierPath [string]projects [array<string | ProjectConfig>]randomize [boolean]reporters [array<moduleName | [moduleName, options]>]resetMocks [boolean]resetModules [boolean]resolver [string]restoreMocks [boolean]rootDir [string]roots [array<string>]runner [string]sandboxInjectedGlobals [array<string>]setupFiles [array]setupFilesAfterEnv [array]showSeed [boolean]slowTestThreshold [number]snapshotFormat [object]snapshotResolver [string]snapshotSerializers [array<string>]testEnvironment [string]testEnvironmentOptions [Object]testFailureExitCode [number]testMatch [array<string>]testPathIgnorePatterns [array<string>]testRegex [string | array<string>]testResultsProcessor [string]testRunner [string]testSequencer [string]testTimeout [number]transform [object<string, pathToTransformer | [pathToTransformer, object]>]transformIgnorePatterns [array<string>]unmockedModulePathPatterns [array<string>]verbose [boolean]watchPathIgnorePatterns [array<string>]watchPlugins [array<string | [string, Object]>]watchman [boolean]workerIdleMemoryLimit [number|string]// [string]workerThreads Reference​ automock [boolean]​ Default: false This option tells Jest that all imported modules in your tests should be mocked automatically. All modules used in your tests will have a replacement implementation, keeping the API surface. Example: utils.jsexport default { authorize: () => 'token', isAuthorized: secret => secret === 'wizard',}; __tests__/automock.test.jsimport utils from '../utils';test('if utils mocked automatically', () => { // Public methods of `utils` are now mock functions expect(utils.authorize.mock).toBeTruthy(); expect(utils.isAuthorized.mock).toBeTruthy(); // You can provide them with your own implementation // or pass the expected return value utils.authorize.mockReturnValue('mocked_token'); utils.isAuthorized.mockReturnValue(true); expect(utils.authorize()).toBe('mocked_token'); expect(utils.isAuthorized('not_wizard')).toBeTruthy();}); noteNode modules are automatically mocked when you have a manual mock in place (e.g.: __mocks__/lodash.js). More info here.Node.js core modules, like fs, are not mocked by default. They can be mocked explicitly, like jest.mock('fs'). bail [number | boolean]​ Default: 0 By default, Jest runs all tests and produces all errors into the console upon completion. The bail config option can be used here to have Jest stop running tests after n failures. Setting bail to true is the same as setting bail to 1. cacheDirectory [string]​ Default: \"/tmp/<path>\" The directory where Jest should store its cached dependency information. Jest attempts to scan your dependency tree once (up-front) and cache it in order to ease some of the filesystem churn that needs to happen while running tests. This config option lets you customize where Jest stores that cache data on disk. clearMocks [boolean]​ Default: false Automatically clear mock calls, instances, contexts and results before every test. Equivalent to calling jest.clearAllMocks() before each test. This does not remove any mock implementation that may have been provided. collectCoverage [boolean]​ Default: false Indicates whether the coverage information should be collected while executing the test. Because this retrofits all executed files with coverage collection statements, it may significantly slow down your tests. Jest ships with two coverage providers: babel (default) and v8. See the coverageProvider option for more details. infoThe babel and v8 coverage providers use /* istanbul ignore next */ and /* c8 ignore next */ comments to exclude lines from coverage reports, respectively. For more information, you can view the istanbuljs documentation and the c8 documentation. collectCoverageFrom [array]​ Default: undefined An array of glob patterns indicating a set of files for which coverage information should be collected. If a file matches the specified glob pattern, coverage information will be collected for it even if no tests exist for this file and it's never required in the test suite. JavaScriptTypeScript/** @type {import('jest').Config} */const config = { collectCoverageFrom: [ '**/*.{js,jsx}', '!**/node_modules/**', '!**/vendor/**', ],};module.exports = config;import type {Config} from 'jest';const config: Config = { collectCoverageFrom: [ '**/*.{js,jsx}', '!**/node_modules/**', '!**/vendor/**', ],};export default config; This will collect coverage information for all the files inside the project's rootDir, except the ones that match **/node_modules/** or **/vendor/**. tipEach glob pattern is applied in the order they are specified in the config. For example [\"!**/__tests__/**\", \"**/*.js\"] will not exclude __tests__ because the negation is overwritten with the second pattern. In order to make the negated glob work in this example it has to come after **/*.js. noteThis option requires collectCoverage to be set to true or Jest to be invoked with --coverage. Help:If you are seeing coverage output such as...=============================== Coverage summary ===============================Statements : Unknown% ( 0/0 )Branches : Unknown% ( 0/0 )Functions : Unknown% ( 0/0 )Lines : Unknown% ( 0/0 )================================================================================Jest: Coverage data for global was not found.Most likely your glob patterns are not matching any files. Refer to the micromatch documentation to ensure your globs are compatible. coverageDirectory [string]​ Default: undefined The directory where Jest should output its coverage files. coveragePathIgnorePatterns [array<string>]​ Default: [\"/node_modules/\"] An array of regexp pattern strings that are matched against all file paths before executing the test. If the file path matches any of the patterns, coverage information will be skipped. These pattern strings match against the full path. Use the <rootDir> string token to include the path to your project's root directory to prevent it from accidentally ignoring all of your files in different environments that may have different root directories. Example: [\"<rootDir>/build/\", \"<rootDir>/node_modules/\"]. coverageProvider [string]​ Indicates which provider should be used to instrument code for coverage. Allowed values are babel (default) or v8. coverageReporters [array<string | [string, options]>]​ Default: [\"clover\", \"json\", \"lcov\", \"text\"] A list of reporter names that Jest uses when writing coverage reports. Any istanbul reporter can be used. tipSetting this option overwrites the default values. Add \"text\" or \"text-summary\" to see a coverage summary in the console output. Additional options can be passed using the tuple form. For example, you may hide coverage report lines for all fully-covered files: JavaScriptTypeScript/** @type {import('jest').Config} */const config = { coverageReporters: ['clover', 'json', 'lcov', ['text', {skipFull: true}]],};module.exports = config;import type {Config} from 'jest';const config: Config = { coverageReporters: ['clover', 'json', 'lcov', ['text', {skipFull: true}]],};export default config; For more information about the options object shape refer to CoverageReporterWithOptions type in the type definitions. coverageThreshold [object]​ Default: undefined This will be used to configure minimum threshold enforcement for coverage results. Thresholds can be specified as global, as a glob, and as a directory or file path. If thresholds aren't met, jest will fail. Thresholds specified as a positive number are taken to be the minimum percentage required. Thresholds specified as a negative number represent the maximum number of uncovered entities allowed. For example, with the following configuration jest will fail if there is less than 80% branch, line, and function coverage, or if there are more than 10 uncovered statements: JavaScriptTypeScript/** @type {import('jest').Config} */const config = { coverageThreshold: { global: { branches: 80, functions: 80, lines: 80, statements: -10, }, },};module.exports = config;import type {Config} from 'jest';const config: Config = { coverageThreshold: { global: { branches: 80, functions: 80, lines: 80, statements: -10, }, },};export default config; If globs or paths are specified alongside global, coverage data for matching paths will be subtracted from overall coverage and thresholds will be applied independently. Thresholds for globs are applied to all files matching the glob. If the file specified by path is not found, an error is returned. For example, with the following configuration: JavaScriptTypeScript/** @type {import('jest').Config} */const config = { coverageThreshold: { global: { branches: 50, functions: 50, lines: 50, statements: 50, }, './src/components/': { branches: 40, statements: 40, }, './src/reducers/**/*.js': { statements: 90, }, './src/api/very-important-module.js': { branches: 100, functions: 100, lines: 100, statements: 100, }, },};module.exports = config;import type {Config} from 'jest';const config: Config = { coverageThreshold: { global: { branches: 50, functions: 50, lines: 50, statements: 50, }, './src/components/': { branches: 40, statements: 40, }, './src/reducers/**/*.js': { statements: 90, }, './src/api/very-important-module.js': { branches: 100, functions: 100, lines: 100, statements: 100, }, },};export default config; Jest will fail if: The ./src/components directory has less than 40% branch or statement coverage. One of the files matching the ./src/reducers/**/*.js glob has less than 90% statement coverage. The ./src/api/very-important-module.js file has less than 100% coverage. Every remaining file combined has less than 50% coverage (global). dependencyExtractor [string]​ Default: undefined This option allows the use of a custom dependency extractor. It must be a node module that exports an object with an extract function. E.g.: const crypto = require('crypto');const fs = require('fs');module.exports = { extract(code, filePath, defaultExtract) { const deps = defaultExtract(code, filePath); // Scan the file and add dependencies in `deps` (which is a `Set`) return deps; }, getCacheKey() { return crypto .createHash('md5') .update(fs.readFileSync(__filename)) .digest('hex'); },}; The extract function should return an iterable (Array, Set, etc.) with the dependencies found in the code. That module can also contain a getCacheKey function to generate a cache key to determine if the logic has changed and any cached artifacts relying on it should be discarded. displayName [string, object]​ default: undefined Allows for a label to be printed alongside a test while it is running. This becomes more useful in multi-project repositories where there can be many jest configuration files. This visually tells which project a test belongs to. JavaScriptTypeScript/** @type {import('jest').Config} */const config = { displayName: 'CLIENT',};module.exports = config;import type {Config} from 'jest';const config: Config = { displayName: 'CLIENT',};export default config; Alternatively, an object with the properties name and color can be passed. This allows for a custom configuration of the background color of the displayName. displayName defaults to white when its value is a string. Jest uses chalk to provide the color. As such, all of the valid options for colors supported by chalk are also supported by Jest. JavaScriptTypeScript/** @type {import('jest').Config} */const config = { displayName: { name: 'CLIENT', color: 'blue', },};module.exports = config;import type {Config} from 'jest';const config: Config = { displayName: { name: 'CLIENT', color: 'blue', },};export default config; errorOnDeprecated [boolean]​ Default: false Make calling deprecated APIs throw helpful error messages. Useful for easing the upgrade process. extensionsToTreatAsEsm [array<string>]​ Default: [] Jest will run .mjs and .js files with nearest package.json's type field set to module as ECMAScript Modules. If you have any other files that should run with native ESM, you need to specify their file extension here. JavaScriptTypeScript/** @type {import('jest').Config} */const config = { extensionsToTreatAsEsm: ['.ts'],};module.exports = config;import type {Config} from 'jest';const config: Config = { extensionsToTreatAsEsm: ['"
