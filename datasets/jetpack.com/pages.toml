full_description = "How can we help you? Chat with our AI Support Assistant or browse our documentation and forum topics. Send Clear document.addEventListener( 'DOMContentLoaded', function () { const chat = document.getElementById( 'jp-support__chat' ); const form = document.getElementById( 'jp-support__chat-form' ); const input = document.getElementById( 'jp-support__chat-input' ); const clearButton = document.getElementById( 'jp-support__chat-clear-button' ); resizeChat(); form.addEventListener( 'submit', function ( event ) { event.preventDefault(); chat.sendMessage( input.value.trim() ); input.value = ''; } ); clearButton.addEventListener( 'click', function ( event ) { event.preventDefault(); chat.clearChat(); } ); document.addEventListener( 'scroll', resizeChat ); function resizeChat() { const MIN_HEIGHT = 500; const TOP_OFFSET = 900 < window.innerWidth ? 130 : 20; const container = document.getElementById( 'jp-support__chat-container' ); const parent = container.parentElement; parent.style.minHeight = MIN_HEIGHT; container.style.position = 'absolute'; if ( parent.offsetTop + parent.scrollHeight - window.scrollY - TOP_OFFSET < MIN_HEIGHT ) { container.style.height = MIN_HEIGHT + 'px'; container.style.bottom = '0'; container.style.top = ''; return; } const offsetTop = window.scrollY - parent.offsetTop + TOP_OFFSET; const offsetBottom = ( parent.offsetTop + parent.scrollHeight ) - ( window.scrollY + window.innerHeight ) + 50; container.style.height = 'auto'; container.style.top = Math.max( offsetTop, 0 ) + 'px'; container.style.bottom = Math.max( offsetBottom, 0 ) + 'px'; } } ); Jetpack Customer? Log in with your WordPress.com account to access personalized support. Log in Support documentation FAQs Plugin forums Search our extensive support forums or start a new topic to get help with our free plugins. Jetpack Jetpack Backup Jetpack Boost Jetpack Protect Jetpack Social Jetpack Search Jetpack VideoPress"
