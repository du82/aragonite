full_description = "Jetpack AI Assistant The most powerful AI tool for WordPress Turn your ideas into ready‑to‑publish content at lightspeed. Elevate your content Try it for only $4.95 per month Unleash your full potential as content creator Boost your content creation with Jetpack AI, seamlessly integrated into Gutenberg, designed to enhance your workflow and make you irreplaceable. Discover all features PERFORMANCE Generate content, tables and forms Easily generate content, lists and tables directly in the editor using the new AI block. You can also use prompts to generate forms with pre-filled content. IMAGE GENERATION Generate images for your posts and site Use AI-generated images to illustrate your post or create a logo for your site. Generate them from custom prompts or based on your site’s content. INTRODUCING Visualize issues and make your content clearer Become an expert editor and ensure your content is clear for your readers. Quickly identify long sentences, mistakes, and complex or ambiguous words, then use AI to fix them and improve your readability score. As seen on TechCrunch ↗ PUBLISHING OPTIMIZATION Improve title and featured image with one click Optimize your post titles for better performance, generate featured images, and collect feedback—all with one-click actions. CONTENT EDITING Fine-tune your content from the toolbar Change your content’s tone, translate, summarize, expand, or apply custom edits using our AI options integrated into multiple blocks. Get started with Jetpack AI now AI Assistant Free Start for free Try our AI Assistant for free to boost your content creation. Quota of 20 requests Prompt based content generation Generate text, images, tables, and lists Adaptive tone adjustment Superior spelling and grammar correction Title & summary generation AI Assistant 50% off * $4.95 instead of $9.95 per month for the first year, billed yearly $ 4.95 $ 9.95 per month for the first year, billed yearly Upgrade Make content creation a breeze with artificial intelligence. High request capacity ** Priority support All free features * Discount is for the first year only, all renewals are at full price.** Limits apply for high request capacity. Learn more about it here. Questions? We’ve got you covered. What types of content can the Jetpack AI Assistant generate? Jetpack AI Assistant is capable of generating blog posts, detailed pages, structured lists, and comprehensive tables. How do the spelling and grammar correction features work? Jetpack AI Assistant analyzes your text and identifies potential errors in spelling and grammar. It then suggests corrections that you can accept or ignore. Can I control the tone of the generated content? Absolutely. You can specify whether you want the text to have a formal or conversational tone, and Jetpack AI Assistant will adjust accordingly. How does the title and summary generation work? Jetpack AI Assistant evaluates the content of your text and generates appropriate titles and summaries based on its understanding. Is the Jetpack AI Assistant available for free? Yes, the Jetpack AI Assistant block is currently available for free up to 20 requests. We encourage you to try it out and share your feedback. You can upgrade your plan to continue using the AI Assistant after the initial 20 requests. Does the AI Assistant’s paid plan have a request limit? The AI Assistant’s paid plan includes a request limit that will meet the needs of the vast majority of users, and should be more than sufficient to enable you to build and manage your website. In rare circumstances, we may constrain accounts using more resources than should be the case in the normal operation of a typical website. While we believe the limit will meet the needs of nearly all users, we are committed to ensuring you have the tools you need to succeed and will continue to monitor and evolve our services to best support you. Should there be any changes to this limit in the future, we will communicate them clearly and in advance."
