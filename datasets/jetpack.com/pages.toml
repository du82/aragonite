title = "Jetpack Akismet - Anti-spam Plugin for WordPress Sites"
description = "Stop comment and form spam on WordPress. Automatically clear spam from comments and forms. Save time and give your visitors a better experience."
full_description = "Jetpack Akismet Anti-spam Stop comment and form spam Automatically clear spam from comments and forms. Save time, get more responses, give your visitors a better experience – all without lifting a finger. Get Akismet Anti-spam Try it for only $4.95 per month No more approving or vetting Manually reviewing spammy form submissions eats up time — time you could spend growing your business. Verify less, convert more No more CAPTCHAs, so visitors submit more forms and you won’t waste time on fake responses. An experience they’ll all love No more spam means visitors can comment and engage distraction-free — without being sidetracked, duped, or just annoyed. Jetpack has caught almost 2 million blocked spam comments on my sites. What I appreciate the most is how the system learns as we go. If a spam comment slips through, or a good comment gets spammed, we can make sure it doesn’t happen again.” CHRIS COYIER, Web Design Expertcodepen.io / ShopTalk Show Akismet 50% off * $4.95 instead of $9.95 per month for the first year, billed yearly $ 4.95 $ 9.95 per month for the first year, billed yearly Get Akismet Save time and get better responses by automatically blocking spam from your comments and forms. Comment and form protection Block spam without CAPTCHAs 10K API calls/mo Security 50% off * $9.95 instead of $19.95 per month for the first year, billed yearly $ 9.95 $ 19.95 per month for the first year, billed yearly Get Security Easy-to-use, comprehensive site security. Includes VaultPress Backup, Jetpack Scan, and Akismet. Starts with 10GB backup storage Comment and form spam protection (10k API calls/mo) 30-day activity log Real-time cloud backups Unlimited restores Website firewall (WAF) Real-time malware scanning One-click fixes * Discount is for the first year only, all renewals are at full price. Frequently Asked Questions Does Jetpack Akismet Anti-spam work with form submissions? Yes. If you use Jetpack’s contact form (either the Form block, or the classic editor version), your contact form submissions will automatically be scanned for spam. You can also manually mark comments as spam/not spam via the Feedback section of WP Admin to help Akismet Anti-spam learn to flag comments like that in future. For information on using Jetpack Akismet Anti-spam with other form plugins, please view this support article from Akismet about how to use Akismet with your contact forms. How does Jetpack Akismet Anti-spam block spam submissions on comments and forms? Jetpack Akismet Anti-spam uses state of the art algorithms and methods to block spam submissions on comments and forms on your site. To date Akismet Anti-spam has blocked more than 500 billion pieces of spam off the web, averaging about 7.5 million per hour. How do I confirm if Jetpack Akismet Anti-spam is working? Once you have setup Akismet Anti-spam, you can test that it is working by using one of the following keywords in a comment on your site: Email: akismet-guaranteed-spam@example.com Comment Body: akismet-guaranteed-spam Once submitted, you will see this comment has been moved to your spam folder automatically by Jetpack Akismet Anti-spam: WP Admin > Comments > Spam If this doesn’t work for you, feel free to reach our to our support team for help. Do I need to use a captcha with Jetpack Akismet Anti-spam? No. With Jetpack Akismet Anti-spam enabled, spam submissions are filtered automatically, which makes it easier for legitimate visitors on your site to engage with your comments section or to submit a form. Do I need to manually review comments and form submissions when using Jetpack Akismet Anti-spam? No. Anything that Jetpack Akismet Anti-spam thinks is spam is automatically moved to your site’s spam section. On the off chance that some spam does get through, you can mark it as spam which will make Akismet Anti-spam recognize submissions like that as spam in the future. How many API calls do I get per month with Jetpack Akismet Anti-spam? Akismet Anti-spam comes with 10k API calls per month, which should be more than enough for a small business. If you need more API calls, you can upgrade to one of Akismet’s higher tier plans. Does Jetpack Akismet Anti-spam work with Jetpack, Contact Form 7, Gravity Forms, Formidable Forms, etc? Yes. If you are using Jetpack forms, then there is no additional setup required. If you are using a different form plugin, please review this article from Akismet on how to setup Akismet Anti-spam for other form plugins. How do I know Jetpack Akismet Anti-spam will work for my site? Jetpack Akismet Anti-spam works on any WordPress site that uses a compatible form plugin. Does Jetpack Akismet Anti-spam report the amount of blocked spam? Yes. On the Jetpack Dashboard (WP Admin > Jetpack > Dashboard) there is a stats card that shows the number of spam comments and submissions blocked on your site from Akismet Anti-spam. Need help? Getting started with Jetpack Akismet Anti-spam Scope of support"
