full_description = "Promote Jetpack.Earn Commission. Join our Affiliate program and share in every sale you send our way. Sign up How it works Sign up Sign up with your details, get verified, and you’ll be ready to access your own personal affiliate dashboard. Build your campaign Select from our range of products and services, create engaging content, and track your success with advanced reporting tools. Learn, analyze, and optimize Monitor your campaign’s performance, make data-driven adjustments and optimizations on the fly, and watch your conversions build up. Seamless payouts Easily manage and keep tabs on all your payments with reliable, timely, secure payouts, and everything from tax details to multi-currency transactions. Popular products and bundles All products Complete bundle The complete bundle of Jetpack products. Security bundle Security bundle VaultPress Backup, Akismet and Scan. Site stats Stats Stats and insights into your website traffic. Site backup VaultPress Backup Real-time cloud backups and one-click restores. Site speed Boost The easiest speed optimization plugin for WordPress. Site protection Scan 24/7 protection: WAF and automatic malware scanning. Block spam Akismet Anti-spam Automatically clear spam from your comments and forms. Site search Search Powerful and customizable site search; no developer required. Audience growth Creator Create, grow, and monetize your audience. Questions? We’ve got you covered. What is an affiliate program and who is it for? An affiliate program is a partnership that allows individuals or brands (affiliates) to earn commissions by promoting another company’s products or services. Becoming an affiliate is a great option for anyone interested in making money online through promotion, including bloggers, influencers, business owners, and more. How does being a Jetpack affiliate work? Signing up takes seconds. Join the Automattic Affiliate program and our team of experts will verify your account. Once you’re approved, you’ll get access to start creating affiliate campaigns for Jetpack (and also all of Automattic’s products) — from one easy dashboard. Are all Jetpack products included in the program? Jetpack CRM is not included in the affiliate program currently. This is because it is sold via a separate system. If you would like to see Jetpack CRM included in the program please do contact us at affiliates@automattic.com so we can prioritise it. What makes the Automattic Affiliate Program unique? The Automattic Affiliate Program makes it easy to spin up affiliate campaigns across the full range of Automattic’s well-loved, profitable products and manage all of your campaigns and products from a single, easy dashboard. You can promote one or more brands including Jetpack, WordPress.com hosting, WordPress.com domain registration, Woo, WooExpress, Woo Marketplace, and Sensei, all without having to sign up for separate affiliate programs. Automattic brands are recognizable, open source, and trustworthy, helping result in higher conversion rates for you. How much can I get paid? Your earnings will depend on which and how many Automattic brands you chose to affiliate for and how much affiliate traffic you drive each month. You can review the full term details for each brand after signing up. How will I get paid? After you set up your payment information you’ll automatically receive payments at regular intervals based on the performance of your campaigns. You can track your success with any of the products you’re promoting from a single dashboard, so you’ll never be in the dark as to what to expect. What if I have more questions? Send us any questions at affiliates@automattic.com and we’d be happy to help. Start earning commission today Sign up"
