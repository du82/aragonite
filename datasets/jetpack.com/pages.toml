["https://jetpack.com/2013/06/10/moving-sharing-icons"]
title = "Moving Sharing Icons"
description = "One of the most common requests you send us is “Can we move the Sharing and Like buttons?” By default, the Sharing and Like buttons get printed at the end of the the_content() Loop function, which …"
full_description = "One of the most common requests you send us is “Can we move the Sharing and Like buttons?” By default, the Sharing and Like buttons get printed at the end of the the_content() Loop function, which causes them to display at the end of your post’s text — but that may not be where you want them in your site’s design. There are actually two ways to move the Sharing buttons and one for the Like button. Move the Sharing and Like buttons Jetpack, by default, just attaches this tag to two filters — the_content() and the_excerpt() — so that the Sharing icons get displayed. By editing your theme files, you can move the tag wherever you’d like — we default to attaching it to the filters so that, when the Sharing and Likes modules are activated, the buttons are displayed with no extra work. You’re free to move it around to put the Sharing icons where you’d like; here’s how: In your functions.php file, add the following: function jptweak_remove_share() { remove_filter( 'the_content', 'sharing_display', 19 ); remove_filter( 'the_excerpt', 'sharing_display', 19 ); if ( class_exists( 'Jetpack_Likes' ) ) { remove_filter( 'the_content', array( Jetpack_Likes::init(), 'post_likes' ), 30, 1 ); } } add_action( 'loop_start', 'jptweak_remove_share' ); Find the file for the location where you’d like the sharing icons to appear and insert the following code in the area you want the Sharing or Likes buttons to appear: if ( function_exists( 'sharing_display' ) ) { sharing_display( '', true ); } if ( class_exists( 'Jetpack_Likes' ) ) { $custom_likes = new Jetpack_Likes; echo $custom_likes->post_likes( '' ); } Note that you do not need to display these together; you can put sharing_display() in a separate place from the Likes display codeblock. Move the Sharing Buttons via jQuery This method comes via Beau Lebens, a fellow Automattician. He coded this jQuery method for moving the Sharing icons: jQuery( document ).ready( function( $ ) { // Relocate Jetpack sharing buttons down into the comments form jQuery( '#sharing' ).html( jQuery( '.sharedaddy' ).detach() ); } ); The #sharing selector is just the DOM location where I want to move the buttons to, and the .sharedaddy one is the container that Jetpack places its buttons in normally. We just detach it from the normal position and then dump it into the new location exactly as it was. We hope this helps you develop your theme and display things the way you like. This entry was posted in Tips & Tricks and tagged Did you know, jquery, sharedaddy, sharing. Bookmark the permalink. Tips & Tricks Tim Moore Software engineer, InfoSec & DevOps apprentice, writer, and neurodivergent person. Explore the benefits of Jetpack Learn how Jetpack can help you protect, speed up, and grow your WordPress site. Get up to 50% off your first year. Explore plans Share thisClick to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Reddit (Opens in new window)Click to share on Pocket (Opens in new window)Like Loading... Related"
