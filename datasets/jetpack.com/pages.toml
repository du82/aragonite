description = "Jetpack Security provides easy-to-use, powerful WordPress security including backups, malware scanning, and spam protection"
full_description = "Jetpack Security We guard your site.You run your business. Jetpack Security provides easy‑to‑use, comprehensive WordPress site security, including real‑time backups, a web application firewall, malware scanning, and spam protection. Secure your site For only $9.95 per month Jetpack VaultPress Backup There’s no time for downtime Real-time backups save every change and one-click restores get you back online quickly. Find out exactly which action (or person) broke your site with the activity log. Manual backups take time, and you’ve got more important things to do. Jetpack VaultPress Backup works behind the scenes, so you don’t have to. Get VaultPress Backup Security 50% off * $9.95 instead of $19.95 per month for the first year, billed yearly $ 9.95 $ 19.95 per month for the first year, billed yearly Get Security Easy-to-use, comprehensive site security. Includes VaultPress Backup, Jetpack Scan, and Akismet. Starts with 10GB backup storage Comment and form spam protection (10k API calls/mo) 30-day activity log Real-time cloud backups Unlimited restores Website firewall (WAF) Real-time malware scanning One-click fixes * Discount is for the first year only, all renewals are at full price. Want to buy VaultPress Backup, Scan, or Akismet Anti-spam individually? Check out the pricing page! Jetpack Scan Simple, yet powerful Stay one step ahead of security threats with our around‑the‑clock web application firewall (WAF), and automated malware scanning with one‑click fixes. You can review WordPress security scan results in one centralized location, fix problems, and restore backups. If Jetpack does notice a problem, you’ll receive an instant email alert so you can fix it right away and get back to running your business. Get Jetpack Scan Jetpack Akismet Anti-spam Never think about spam again Save hours of time by automatically clearing spam from comments and forms with the power of Akismet. No more CAPTCHAs, so visitors submit more forms, and you won’t waste time on fake responses. No more spam means visitors can comment and engage distraction-free — without being sidetracked, duped, or just annoyed. Get Akismet Anti-spam Brute force attack protection We automatically block attempts to hack your site from millions of known malicious attackers. Downtime monitoring We’ll let you know instantly if your site goes down, so you can find out before your customers do. Activity Log Understand every site change and take the guesswork out of site management and repair. More than 27 million WordPress sites trust Jetpack for their website security It took just one click to restore my WooCommerce store. It was a great interface and it did the job. Jetpack VaultPress Backup saved my site really quickly. Oli, DeveloperSevenoaks Bookshop Read more about how Jetpack Security kept Sevenoaks Bookshop up and running Security 50% off * $9.95 instead of $19.95 per month for the first year, billed yearly $ 9.95 $ 19.95 per month for the first year, billed yearly Get Security Easy-to-use, comprehensive site security. Includes VaultPress Backup, Jetpack Scan, and Akismet. Starts with 10GB backup storage Comment and form spam protection (10k API calls/mo) 30-day activity log Real-time cloud backups Unlimited restores Website firewall (WAF) Real-time malware scanning One-click fixes * Discount is for the first year only, all renewals are at full price. Want to buy VaultPress Backup, Scan, or Akismet Anti-spam individually? Check out the pricing page! Questions? We’ve got you covered. How does Jetpack VaultPress Backup work? Jetpack VaultPress Backup is activated and your first backup is created as soon as you complete your purchase. At the top of your activity log, you will see the following prompt to add remote access / server credentials for your site. These credentials allow you to connect for backups if the Jetpack connection isn’t working and they’re also required for site restores. Once backups start, you’ll see a “Backup complete” event in your activity log, either daily or when you make changes, and know that your WordPress site is securely backed up. Click the ellipsis (three dots) to the right of the event will show available restore and download options. With this WordPress backup plugin, you can revert changes or restore an earlier version of your site if you need to – regardless of whether it’s because your WordPress security scan has picked up a malicious threat, or if you’ve simply been messing around with your site’s design. No ifs, ands, or uh-ohs about it. What threats does Jetpack Scan catch? Threats might include: Changes to Core WordPress files – generally, these files should never be changed, so your WordPress security scan will automatically flag any changes as suspicious. Outdated or insecure plugins – Plugins that have known security vulnerabilities will be detected by Jetpack Scan. If there’s a newer version that has patched the threat, you can update the plugin with one click. If there is no newer version with a fix, we allow you to delete the plugin from your site. Other Vulnerabilities – Web-based shells give an attacker full access to your server — allowing them to execute malicious code, delete files, make changes to your database, and many more dangerous things. Shells are usually found in files, so our WordPress vulnerability scanner will pick them up so they can be removed by deleting any infected files from your server and replacing them with a clean version from your backup. The WordPress vulnerability scanner page provides an at-a-glance reference of the current state of the site. It will either show that the site is looking great, or it will list the currently active threats. What other security features does Jetpack Security include? Besides backups, malware scanning, and comment spam protection, Jetpack Security includes: Brute force attack protection – We automatically block attempts to hack your site from millions of known malicious attackers. Downtime monitoring – We’ll let you know instantly if your site goes down, so you can find out before your customers do. Activity log – Understand every site change and take the guesswork out of site management and repair. Secure authentication – Sign in to WordPress sites quickly and securely, and add optional two-factor authentication. Why do I need security for my site? Security is important to consider for any site or online business, including WordPress. If your site is hacked it can cause serious damage to your income and your business’ reputation. Hackers can manipulate your website’s data, steal information from you or your users (including passwords), install and execute malicious code, and even distribute the malicious code between your users. Here are a few of our articles that will provide some additional insight into WordPress security and the most popular WordPress security plugins: Do You Need a Security Upgrade for Your WordPress Website? How to Protect Your Small Business from Cyber Attacks Six ways people break their sites Why You Should Avoid Using Nulled Plugins and Themes WordPress Security for Beginners Ten Steps for a Secure WooCommerce Checkout Experience 12 Best WordPress Security Plugins Compared (2022 Review) Does Jetpack Security support WordPress multisite? No, Jetpack Security does not currently support WordPress multisite. Need help with Jetpack Security? Getting started Contact support Support policy Secure your site For only $9.95 per month"
