full_description = "Free CDN for WordPress Sites Accelerate your site with faster images and static files. Reduced load times for your readers, less bandwidth from your host. Get started What is a WordPress CDN (Content Delivery Network)? How fast your site loads can affect you in multiple ways, whether it’s from your users impatiently clicking away while waiting for your site to load or search engines penalizing your site for slow load speeds. Most hosting companies will charge you more depending on the number of visitors, site size, and the amount of bandwidth (speed) you want to make available to your readers. Site speed is impacted by many factors and one of them is content delivery. Using what is referred to as a content delivery network (or CDN) helps by: Delivering your content from high-speed and dedicated data centers. Allowing more files to be downloaded simultaneously by the browser. Distributing data centers in different geographic locations to improve download speeds and provide redundancy. When you use a WordPress CDN, you’ll be able to distribute server load and save bandwidth – reducing your existing hosting costs! Jetpack comes with a free Content Delivery Network (CDN) to optimize and deliver your photos and some static files like CSS and JavaScript. What’s not to like? Get started Feature Detail One-click setup and install: no coding, no complicated configuration. Automatically starts serving all your images, photos, as well as some static CSS and JavaScript files from our servers located around the world. Automatically resizes images for mobile devices further improving speeds. Did we mention it’s free? Unlimited number of files. Works well with VideoPress, our ad-free video hosting service. Unlike most WordPress CDN services, our site accelerator is free with no upsells. Part of Jetpack’s suite of content creation tools for WordPress sites including content delivery, image tools, sidebar customization, and more. Frequently Asked Questions Here are the answers to some common questions. And we’re always more than happy to answer any additional questions you may have. How much does it cost? Our WordPress CDN tools are provided for free to all sites running Jetpack. Can I use it for other things besides images? Yes. We now serve static CSS and JavaScript files from WordPress Core, Jetpack, and WooCommerce to further speed up your site for visitors and decrease your server load, saving valuable bandwidth. Please note that our WordPress CDN does not serve audio (i.e., mp3, wav, flac, etc.) or video (i.e., mp4, wmv, flv, etc.) files. If you’d like to host videos on our CDN, check out our video hosting feature. How do I turn it on? Simply install Jetpack and enable it with one click from your Jetpack dashboard. For advanced settings and trouble-shooting read our detailed support document. Get Started Whatever sort of site you’re running, Jetpack is designed to keep your site protected and blazing fast. Don’t have Jetpack? If you don’t currently have Jetpack, install it now so you can begin taking advantage of free features like our CDN, downtime monitoring, and brute force attack protection. Installation is totally free and just takes a few minutes. Install Jetpack Still undecided about upgrading? Visit our pricing page and check out how we can secure your site or help you better reach your audience. If you are dissatisfied for any reason, we offer full refunds within 14 days for yearly plans, and within 7 days for monthly plans. Compare plans"
