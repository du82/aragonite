title = "Jetpack Stats - The #1 Analytics Tool for WordPress Sites"
description = "Discover the #1 analytics tool for WordPress websites. With Jetpack Stats, you don’t need to be a data scientist to see how your site is performing."
full_description = "Jetpack Stats Simple, yet powerful stats to grow your site With Jetpack Stats, you don’t need to be a data scientist to see how your site is performing. Get Jetpack Stats For only $8.33 per month Jetpack Stats is trusted by over 14.5 million people around the world. Tried and true visitor stats to help you understand your audience Explore real‑time data on visitors, likes, and comments. Get detailed insights on the referrers that bring traffic to your site. Discover what countries your visitors are coming from. Measure link clicks, video plays, and file downloads within your site. See what’s working with content performance metrics Discover your top performing posts & pages. See who is creating the most popular content on your team with our author metrics. Easily keep track of your content creation habits & trends over the years. View weekly and yearly trends with 7‑day Highlights and Year in Review. Understand where your visitors are coming from with UTM tracking. Get Jetpack Stats Jetpack Stats gives you all the information you need to know without Google Analytics. This is all I need to know: who’s coming to my site, where on the web they’re coming from, and where in the world they’re coming from. That’s great for me. Mark-Andrew NordstromEntrepreneur & Open Source Evangelist Learn more about how Mark-Andrew uses Jetpack & WordPress within the skateboarding community. Engage with your subscribers and view your social reach See your WordPress & Email subscribers, and follow them back to build your community. Connect Jetpack Social to popular social networks and see your total follower counts. See what popular social networks your content is being shared to the most. Third‑party integrations to keep you growing Promote content to millions of WordPress and Tumblr users directly from Stats using Blaze. Easily see orders, refunds, shipping, and other product trends as a WooCommerce customer. Monitor ads displayed & keep track of earnings when using Jetpack Ads. Keeping personal data secure Jetpack Stats gives you a powerful WordPress analytics tool that respects your visitors’ privacy, allowing you to gain valuable insights while maintaining GDPR compliance. Get Jetpack Stats Get the Jetpack app and take stats with you Visit wp.com/app or scan the QR code to download for free. Stats Free Start for free Get started with our basic features. Real-time data on visitors Discover your top performing post & pages Detailed insights on the referrers that bring traffic GDPR compliant For personal sites only. Sites with commercial activities (e.g., ads, sales, affiliate links or business activities) require a paid plan. Stats Name your price Pay what you can Get Personal Stats Simple, yet powerful stats for your personal site. All basic features Priority support For use with personal sites only For personal sites only. Sites with commercial activities (e.g., ads, sales, affiliate links or business activities) require a paid plan. Stats $8.33 per month, billed yearly $ 8.33 /month, billed yearly Get Commercial Stats The most advanced stats Jetpack has to offer. All basic features Monthly limit of 10K site views (upgradable) Access to upcoming advanced features Priority support Commercial use Eligible for sites with commercial activities Questions? We’ve got you covered. How do I configure Jetpack Stats? Simply install the plugin and go to the Stats tab. It’s that simple. If you need more help, check out this support article. Should I choose a free or paid Jetpack Stats plan? Free access to Jetpack Stats is for personal, non-commercial sites only. Commercial sites require a paid subscription. For more details, check out our support page. Why can personal sites use Stats for free? Automattic’s (Jetpack’s parent company) mission is to make the web a better place. This includes making some features widely available, even if you don’t make money from your site. If you get value from Jetpack Stats, feel free to pay any amount to unlock priority support. We’ve used this pricing structure with Akismet, and based on our experience, we believe this is the fairest way to provide our products to the world while limiting paid plans to those with more ability to pay. Does Jetpack Stats integrate with Google Analytics? Yes! You can use both on your WordPress installation. The benefit of using Jetpack Stats is that you can see a snapshot of your blog’s activity directly from your dashboard. If you want to use another analytics service to give you additional in-depth information, you can certainly do so. With Stats, can I view visitors by country? Yes! Jetpack Stats will show you a heatmap of exactly where in the world your site has been receiving its visitors from: Does Stats honor DNT requests? Do Not Track (DNT) is a feature in web browsers and websites that asks advertisers and other web software providers not to track individuals’ browsing habits. As a site owner, you can configure Jetpack Stats to honor requests from visitors who have DNT enabled, and prevent tracking of their activity (i.e., post and page views) with an easy-to-add snippet. Through Stats, can I see who viewed individual posts? No. Any piece of data explicitly identifying a specific user (IP address, WordPress.com ID, WordPress.com username, etc.) is not visible to the site owner when using Jetpack Stats, so you won’t be able to see which specific users or accounts viewed a particular post. Can I download my site stats? You can click the title of each feature on your stats page, and scroll to the bottom of that feature to download your stats. Simply click on the “Download data as CSV” link, and download the file to your computer. Need enterprise level stats? Parse.ly, by Automattic, makes working with data easy for newsrooms and marketers, giving them the insights they need to focus their content strategy and improve ROI. Explore Parse.ly"
