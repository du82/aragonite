["https://jetpack.com/social"]
title = "Jetpack Social: The #1 WordPress Social Media Sharing Plugin"
description = "Automatically share your website content to your favorite social media platforms, from one place. Over 1 million posts are shared with Jetpack Social daily."
full_description = "Jetpack Social Publish once.Share everywhere. Automatically share your website content to your favorite social media platforms, from one place. Get Jetpack Social Over 1 million posts are shared with Jetpack Social, every day. Save time by managing your social platforms from a single hub No time to format and share on every individual platform? Jetpack Social automatically shares your site’s posts and products to your social media channels for you. Automate Social Sharing for Your Blog Posts With Jetpack Social you can schedule your posts so you`re not chained to your devices. Share any day and time your fans are most engaged. Customize your images with our Social Image Generator. Create a unique style for your social media images Overlay custom text onto your images and choose from a variety of styles to increase engagement on your social posts. Most importantly, you`ll save time by doing it all within the WordPress editor. Social Free Free Start for free Grow your audience effortlessly by automating posting on social media. Schedule posts Post to Facebook, Instagram, Threads, Bluesky, LinkedIn, Mastodon, Nextdoor & Tumblr Recycle content Social 50% off * $4.95 instead of $9.95 per month for the first year, billed yearly $ 4.95 $ 9.95 per month for the first year, billed yearly Get Social The most feature-packed plan Social has to offer! All Free features Priority support Upload custom images or videos with your posts Automatically generate images for posts Multi-image sharing (soon!) * Discount is for the first year only, all renewals are at full price. Questions? We’ve got you covered. How do I connect with my social networks? With the social sharing plugin installed, connecting with your social networks takes only a few clicks from the Social admin page, or the Tools menu of your site. For more detailed assistance, check out the full support article. Why should I publish on my site and social media at the same time? Social media is popular, but not everyone uses it regularly. If you only publish on social media, you’re missing up to 60% of adult Americans. It’s important to publish on both your website & social media in order to reach your whole audience. Jetpack Social works as a social media auto poster and makes it easy to share content. How do I auto share new posts? While writing a post in the editor, find the Jetpack icon at the top right of the editor. Click on the icon, and you will see the sidebar showing a “Share this post” section. There you can select the accounts you want to auto-share. When publishing, your post will be shared on your social media automatically. For more details about how to auto share posts to social media, check the full support article. How do I auto share scheduled posts? To share scheduled posts on social media automatically, go to your WordPress Admin → Posts and locate the scheduled post to be published. Edit and click on the Social icon (the speaker) at the top right of the editor. Then you will see the sidebar with the “Share this post” section where you can select and configure your social publications. When the post is finally published, it will auto post to social media. How do I share previously published posts? You can also recycle published posts to share on your social media. Go to your WordPress Admin → Posts and locate your published post. Edit and click on the Social icon (the speaker) at the top right of the editor. You will see the sidebar with the “Share this post” section, where you can select and configure your social publications. Then, click on the “Share post” action to auto post to social media. This action won’t change the status of your post. How do I share my content as social media posts? When you upgrade to the Social plan, you unlock the ability to select an image or video and custom text to share your blog post as a social post. Rather than appearing as a link preview, your image and text will look like you manually published it on the social platform itself, saving you time and optimizing engagement. Studies show that manually published social posts get 50% more engagement than sharing links. To use this feature, simply upload an image or video and add your custom text in the Social section of the sidebar editor. When the post is published, you will trigger the automated social media posting. Need Help? Install Social as a standalone plugin Getting started with Jetpack Social Auto sharing posts Troubleshooting ."
