["https://jigsaw.w3.org"]
title = "Jigsaw Overview"
full_description = "The Jigsaw software provides the Consortium's Java-based Web server. With a modular architecture and full HTTP/1.1 compliance, the Jigsaw server is a premier experimental platform for W3C and the Internet community. The server uses an object-oriented approach when it comes to the storage of files and the processing of incoming requests, making it both more efficient and easily extensible."
