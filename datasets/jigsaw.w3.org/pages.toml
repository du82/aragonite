["https://jigsaw.w3.org/HTTP"]
title = "HTTP/1.1 demos"
full_description = '''DISCLAIMER: Jigsaw tries to implement all features of HTTP/1.1, it has not however reached a Refernce Implementation status of any sort with regard to HTTP/1.1. This "test suite" has been established temporarily, in particular: You're looking for a server implementing a specific HTTP/1.1 feature ? If that feature is not in the included list below, send mail to jigsaw@w3.org. Chunk Encoding Jigsaw will chunk encode any stream that needs to be chunk encoded automatically, when possible. This link points to a CGI script, whose output will be chunk encoded if you're using an HTTP/1.1 client. TE Jigsaw will serve you this text file, according to the transfer-encoding present in the request. It can serve the resource using gzip or deflate compression scheme. TE (bis) Jigsaw will serve you this text file, according to the transfer-encoding present in the request. It can serve the resource using gzip or deflate compression scheme, the data comes from another resource, so a Content-Location: header is added. Connection The Connection header is used in HTTP/1.1 to mark a header as "hop-by-hop" only. Proxies, for example, should remove header listed in Connection. Cache-Control (max-age) Jigsaw will always emit appropriate Cache-Control info. This link points to a page whose cache control max-age value has been set to 120 seconds. Cache-Control (private) This links points to a page that will be served with a private cache control directive. Cache-Control (proxy-revalidate) This links point to a page that will be served with a proxy-revalidate cache control directive. Cache-Control (no-cache) This links points to a page which has a fake Set-Cookie header, and which include a Cache-Control: no-cache="Set-Cookie" header. Meant to test proxies. Content-MD5 This links points to a resource served with its MD5 digest. It gives an indication that the integrity of the entity body has been respected. Note that it only for accidental modification or errors, not to check for malicious attacks.In this example, the value should be: Content-Md5: 0TMnkhCZtrIjdTtJk6x3+Q== Retry-After (delay) This link points to something which can be unavailable, depending on the date and time. If it is not available, it will give the delay of expected unavailability. Retry-After (date) This link points to something which can be unavailable, depending on the date and time. If it is not available, it will give the date of expected availability. 300 Multiple Choices This link points to a resource which can give two resources. One for text/html, one for text/plain. If you have the same quality level for both, the server will return a 300 Multiple Choices along with a list of available variants. 406 Not Acceptable This link points to a resource which cannot be served, according to the Accept header sent. The server will return a 406 Not Acceptable to notify the failure of the request. 414 Request-URI Too Long This link points to a resource which cannot be served, as the URI to reach it will be too long. The server will return a 414 Request-URI Too Long to notify the failure of the request. Redirect test page This link point to a page demonstrating some redirect response codes. Basic Authentication test This link point to a protected resource, to access it, the user is "guest" and the password is also "guest". Digest Authentication test This link point to a protected resource, to access it, the user is "guest" and the password is also "guest". This page is protected using Digest Authentication. Content-Location test This link point to resource whose content is in another directory. The computation of the base URI of this document has to be done according to the Content-Location header sent by the server.'''
year_published = 2025
clearnet = "https://jigsaw.w3.org/HTTP"
tags = ["disclaimer", "features", "jigsaw"]
language = "en"
internal-references = ["none"]
external-references = ["ftp.ietf.org", "w3.org"]

