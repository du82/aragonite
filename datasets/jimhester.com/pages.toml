["https://jimhester.com/contact"]
title = "About / Contact | Jim Hester"
description = "A little more about me and how to get in touch"
full_description = "I have lived in northeast Ohio for over 25 years and have long had an interest in computers and programming, starting with writing programs in BASIC on our family’s IBM PS/1. I have also long had an interest in biology, particularly genetics. Combining my two interests led me to pursue bioinformatics and a job as a Program Analyst at the Cleveland Clinic. My research at CCF focused on using high-throughput sequencing to study a variety of issues, such as maternal obesity in mice, microbial populations in the Cuyahoga river, and Plasmodium Vivax malaria. While at the Cleveland Clinic, I became an avid user of the statistical programming language R, using it to process, visualize, model and report our data. I also began writing R packages and contributing to open source packages on GitHub. I enjoyed working with open source software and being part of the R community, so looked for opportunities that allowed me to continue to do so, which eventually landed me at RStudio. At RStudio I have worked on numerious projects including writing and/or maintaining 25+ R packages on CRAN. I have also given a number of talks and workshops about R and R packages, which has allowed my to travel to Europe and Australia, as well as throughout the United States. After a number of years at RStudio I decided to pursue an exciting opportunity and Netflix, building infrastructure and supporting the R community there."
