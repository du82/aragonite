ndingThis will call our grounding engine do fact-checking.scienceExperimentalkeyboard_arrow_downEnter your queryarrow_downwardkeyhttps://g.jina.ai/Reader URLRead release notearrow_forwardfilter_altCommon, SpecificParametersarrow_drop_downSearch Parameters/HeadersAdd API Key for Higher Rate Limit Enter your Jina API key to access a higher rate limit. For latest rate limit information, please refer to the table below.open_in_newLearn moreUse POST Method Use POST instead of GET method with a URL passed in the body. Useful for building SPAs with hash-based routing.open_in_newLearn moreRead Engine Choose the engine to use for parsing the content for the given URL. Affect the quality, speed, compatibility of the result.Defaultarrow_drop_downContent Format You can control the level of detail in the response to prevent over-filtering. The default pipeline is optimized for most websites and LLM input.Defaultarrow_drop_downUse ReaderLM-v2 ExperimentalUses ReaderLM-v2 for HTML to Markdown conversion, to deliver high-quality results for websites with complex structures and contents. Costs 3x tokens!open_in_newLearn moreTimeout Maximum time to wait for the webpage to load. Note that this is NOT the total time for the whole end-to-end request.Token Budget Limits the maximum number of tokens used for this request. Exceeding this limit will cause the request to fail.Target Selector Provide a list of CSS selector to focus on more specific parts of the page. Useful when your desired content doesn't show under the default settings.body .class #id Wait For Selector Provide a list of CSS selector to wait for specific elements to appear before returning. Useful when your desired content doesn't show under the default settings.body .class #id Excluded Selector Provide a list of CSS selector to remove the specified elements of the page. Useful when you want to exclude specific parts of the page like headers, footers, etc.header .class #id Remove All Images Remove all images from the response.Gather All Links At the End A "Buttons & Links" section will be created at the end. This helps the downstream LLMs or web agents navigating the page or take further actions.No Summary (Default)arrow_drop_downGather All Images At the End An "Images" section will be created at the end. This gives the downstream LLMs an overview of all visuals on the page, which may improve reasoning.No Summary (Default)arrow_drop_downJSON Response The response will be in JSON format, containing the URL, title, content, and timestamp (if available). In Search mode, it returns a list of five entries, each following the described JSON structure.Viewport Configuration POSTConfigure browser viewport dimensions for responsive renderingopen_in_newLearn moreForward Cookie Our API server can forward your custom cookie settings when accessing the URL, which is useful for pages requiring extra authentication. Note that requests with cookies will not be cached.open_in_newLearn more<cookie-name>=<cookie-value> <cookie-name-1>=<cookie-value>; domain=<cookie-1-domain> Image Caption Captions all images at the specified URL, adding 'Image [idx]: [caption]' as an alt tag for those without one. This allows downstream LLMs to interact with the images in activities such as reasoning and summarizing.Use a Proxy Server Our API server can utilize your proxy to access URLs, which is helpful for pages accessible only through specific proxies.open_in_newLearn moreBypass the Cache Our API server caches both Read and Search mode contents for a certain amount of time. To bypass this cache, set this header to true.Github Flavored Markdown Opt in/out features from GFM (Github Flavored Markdown).Enabledarrow_drop_downStream Mode Stream mode is beneficial for large target pages, allowing more time for the page to fully render. If standard mode results in incomplete content, consider using Stream mode.open_in_newLearn moreBrowser Locale Control the browser locale to render the page. Lots of websites serve different 