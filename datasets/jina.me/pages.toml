full_description = "SassI’m a Sass core team member as an open-source designer, where I lead the brand, website design, front-end UI development, and content direction.OverviewSass is a mature, stable, and powerful professional-grade CSS extension language. Sass is completely compatible with all versions of CSS. You can use it with any available CSS libraries.The StoryI am a fan of using Sass to process my CSS. I was first introduced to it during my time working at Engine Yard. One day, one of the core team members tweeted his frustration with the design of the project. He suggested that it might be why designers were using a competitor instead.While Sass was first to market, Less had become more popular with designers. Sass’s website and brand was not inspiring designers to use it. Also, the original brand was also controversial (sexist).So I volunteered to lead the redesign of the brand and website.ResultsThe brand has not only been embraced by the community, but many companies, tools, and resources have adopted the language. The most popular CSS framework (Bootstrap) abandoned Less in favor of Sass. The United States Web Design System uses it. Hillary Clinton even wore a replica of the glasses I drew to hire developers.ResponsibilitiesBrandingCreative DirectionDesign SystemsEvent PlanningFrontend DevelopmentUX DesignVisual DesignDeliverablesIdentity GuidelinesStyle GuideWebsiteRelated contributions:Meet-upsStickerOther creative creditsThe Core Team & Team Sass DesignContributors from the Sass communityAttendees at Sass ConfWorkarrow_backClarityarrow_forwardarrow_backBeehive Design Systemarrow_forwardarrow_backSalesforce Lightning Design Systemarrow_forwardarrow_backSassarrow_forwardarrow_backApple Online Storearrow_forward"
