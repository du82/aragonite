e team.Front-end User Interface DeveloperApple Online StoreMarch 1, 2007–March 2008–currentI led the CSS architecture in-house for the remodel project, moving the entire online experience to web standards. I also maintained and documented front-end best practices in a style guide.––currentinfernoMemphis, TennesseeInteractive DesignerJune 2006–February 2007–currentInteractive web designer and frontend web developer for clients including NuVasive, Medtronic, FedEx, Posh Pattern, and more.––current––currentRocket Science DesignMemphis, TennesseeDesigner & DeveloperAugust 2005–June 2006–currentPart-time web designer/developer for websites, business cards, and other printed materials for clients, including Emerge Memphis, Germantown Day Spa, etc.––current––currentWurzburgMemphis, TennesseeDesignerApril 2005–August 2005–currentIn-house designer and developer for brochures, branded merchandise and gifts, company newsletter, stationery, large-scale graphics for trade show booths, company vehicles, and the intranet website.––current––currentIsys TechnologyMemphis, TennesseeDesign InternApril 2004–July 2004–currentDesign and development for various clients, including Lausanne Collegiate School and Memphis Area Transit Authority.––current––currentOden Marketing & DesignMemphis, TennesseeInteractive Design InternJanuary 2004–April 2004–currentProvided design and front-end development for client projects for a leading Memphis agency. This included creating style guides documenting design and code. Clients included the American Contract Bridge League, FedEx, International Paper, Anita Kerr, etc.––current––currentMemphis Brooks Museum of ArtMemphis Brooks Museum of ArtMemphis, TennesseeDigital Arts InstructorMay 2003–July 2003–currentTaught Adobe Photoshop and digital art concepts to inner-city girls in two age groups: 12–14 and 15–18.––current––currentMemphis College of ArtMemphis College of ArtMemphis, TennesseeWork StudyAugust 2001–April 2003–currentSupported tuition and living