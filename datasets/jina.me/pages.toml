full_description = "My PortfolioThis portfolio is a collection of selected work from throughout my career. My projects include design systems, visual design, front-end development, as well as community-focused initiatives.You can find a more in-depth overview of all relevant job and educational experiences at my CV. If you are interested in us working together, please feel free to get in touch.ClarityI created Clarity, the premiere design systems community conference, at a time when design system teams were becoming a thing. It is now in its eighth year.Beehive Design SystemDesign systems and operations for Amazon Honeycode, a new No-code app builder product from Amazon (named “Beehive” before the public launch).Salesforce Lightning Design SystemI was the founding lead designer for one of the most popular enterprise design systems, the Salesforce Lightning Design System.SassI’m a Sass core team member as an open-source designer, where I lead the brand, website design, front-end UI development, and content direction.Apple Online StoreI led the CSS architecture for the remodel of Apple’s online store experience to move to web standards. I also created/documented a styleguide with HTML & CSS."
