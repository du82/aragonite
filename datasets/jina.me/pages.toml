full_description = "Beehive Design SystemDesign systems and operations for Amazon Honeycode, a new No-code app builder product from Amazon (named “Beehive” before the public launch).OverviewYou need to manage your tasks, your projects, and your team. Now, you can build an app to achieve your goals with Amazon Honeycode—no programming required.The StoryI was recruited by fellow former Salesforce employees who worked with me to join them at Amazon. They wanted me to recreate the success of the Salesforce Lightning Design System. In a contract-turned-full-time engagement, I worked closely with product designers by providing design direction for visuals and interactions. I also worked with engineers to ensure their CSS was to specifications as well as guidance on accessibility.My role also included some design operations as well, including provisioning access to the design tools used on the team, project management, and providing education and workshops opportunities.During my time there, I built a React-based style guide with components and documentation for both the design and engineering organizations to use.ResultsResponsibilitiesCreative DirectionDesign SystemsFrontend DevelopmentProject ManagementUX DesignVisual DesignDeliverablesCSS FrameworkIconsStyle GuideUI Kit (sticker sheet)Other creative creditsRebecca Buck (initial design manager)Scott Perket (initial branding and design language)Christian Gin (assisted with design specifications and Sketch UI Kit)The rest of the design team for all the product design work which informed the design systemPatrick Woo (provided lots of feedback and guidance for the React style guide I was building)James Khatiblou (helped set up the initial framework for the style guide)Workarrow_backClarityarrow_forwardarrow_backBeehive Design Systemarrow_forwardarrow_backSalesforce Lightning Design Systemarrow_forwardarrow_backSassarrow_forwardarrow_backApple Online Storearrow_forward"
