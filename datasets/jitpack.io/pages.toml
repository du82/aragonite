["https://jitpack.io/w/privacy.html"]
title = "JitPack | Publish JVM and Android libraries"
description = "JitPack makes it easy to release your Java or Android library. Publish straight from GitHub or Bitbucket."
full_description = "When you register for JitPack we ask for information such as your name, email address and GitHub username. We collect the e-mail addresses of those who communicate with us via e-mail, aggregate information on what pages consumers access or visit, and information volunteered by the consumer (such as survey information and/or site registrations). The information we collect is used to improve the content of our Web pages and the quality of our service, and is not shared with or sold to other organizations for commercial purposes, except to provide products or services you’ve requested, when we have your permission, or under the following circumstances: It is necessary to share information in order to investigate, prevent, or take action regarding illegal activities, suspected fraud, situations involving potential threats to the physical safety of any person, violations of Terms of Service, or as otherwise required by law. We transfer information about you if JitPack is acquired by or merged with another company. In this event, JitPack will notify you before information about you is transferred and becomes subject to a different privacy policy. When you register for JitPack Personal Account we ask for information such as your name, email address, billing address, credit card information. Members who sign up for the free account are not required to enter a credit card. JitPack uses collected information for the following general purposes: products and services provision, billing, identification and authentication, services improvement, contact, and research. A cookie is a small amount of data, which often includes an anonymous unique identifier, that is sent to your browser from a web site’s computers and stored on your computer’s hard drive. Cookies are required to use the JitPack service. We use cookies to record current session information, but do not use permanent cookies. You are required to re-login to your JitPack account after a certain period of time has elapsed to protect you against others accidentally accessing your account contents."
