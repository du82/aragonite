["https://jleuze.com/author/jleuze/page/7"]
title = "Josh Leuze | Josh Leuze | Page 7"
description = "I'm a WordPress developer from Minnesota. Aside from WordPress; I'm also into biking, art, and sci-fi."
full_description = "A tasty Meteor Slides milestone March 25, 2011 / Josh Leuze / 13 Comments Meteor Slides reached a couple of big milestones this week. My plugin broke 50 ratings while holding onto a five-star rating. It has also now been downloaded over 25,000 times, that’s a lot of slideshows! To celebrate Kristine and I baked some gold star cookies with the kids—alright, they baked the cookies and I ate them. Thank you everyone who has tried and rated my plugin, marked it as working, or left a comment. I really appreciate all of the feedback! Meteor Slides updated for WordPress 3.1 January 31, 2011 / Josh Leuze / 21 Comments In preparation for WordPress 3.1 which should be out any day now, I just released Meteor Slides 1.3.2. This version is still compatible with WordPress 3.0 and has been tested up through 3.1 Release Candidate 3. Meteor Slide 1.3.2 has some updated functionality for WordPress 3.1, improves support for slideshows of different sizes, and now includes contextual help for all of the slideshow admin pages. This plugin recently reached 17,000 downloads, and after 40 ratings, Meteor Slides is still holding onto five stars! Thanks everyone who has tried my plugin, rated it, and especially those who have been kind enough to donate. Seen a few cool implementations of Meteor Slides lately and I’d love to see more if you want to share a link. Read More Help test Meteor Slides 1.3.2 December 19, 2010 / Josh Leuze / 36 Comments I recently released Meteor Slides 1.3.1, this version should work just fine in most situations. But there is an issue with using multiple slideshows of different sizes. Not all of the different elements in the slideshow are resizing dynamically when the dimensions are changed in the metadata. This issue is most noticeable when using navigation. I have a development version of Meteor Slides 1.3.2 in trunk that fixes this problem and I could use some help testing it. The CSS and HTML markup of the slideshow have had some significant changes. These changes simplify the slideshow and should make it easier to customize in the future, but they could cause problems with existing customizations. Read More"
