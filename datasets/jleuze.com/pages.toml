["https://jleuze.com/tag/wordcamp/page/2"]
title = "wordcamp | Josh Leuze | Page 2"
full_description = "Speaking at WordCamp Minneapolis 2015 April 21, 2015 / Josh Leuze / 2 Comments We’ve been hard at work getting ready for WordCamp Minneapolis this weekend and I think it will be the best one yet! The schedule is packed with great sessions, we’ve got a Mexican buffet lined up for lunch, and some awesome looking swag courtesy of Westwerk and Marktime Media. My session is called Building Your First Functionality Plugin and I’ll be talking about what should be in a WordPress theme, and what should be in a plugin. This will be an intro to building plugins for new developers and will also cover how a functionality plugin might differ from a standard plugin. Minneapolis should be a great start to another year of awesome WordCamps, I hope to see some of you there! Building Better Widgets July 26, 2014 / Josh Leuze / No Comments At WordCamp Milwaukee 2014 I gave a talk on Building Better Widgets. In this session I talked about how to design interesting and useful WordPress widgets. I covered designing for a wide range of widgets, exploring different widget designs, planning responsive widgets that scale well, thinking about animated and interactive widgets, and upgrading your widgets with plugins. Read More Building Your First Widget June 15, 2014 / Josh Leuze / 1 Comment I spoke today at WordCamp Chicago, talking about building widgets. In my session we learned how to build your first WordPress widget and went step-by-step through the best practices for building a simple widget. We discussed when a widget should be built into a theme or plugin, and when a widget should be its own plugin. You can check out the slides if you’d like to. Read More Speaking at WordCamp Minneapolis 2014 April 24, 2014 / Josh Leuze / No Comments I’ve been so busy lately with client projects, helping organize WordCamp Minneapolis, and getting settled into my new office, that I almost forgot to write about it on my own blog! WordCamp Minneapolis 2014 is this weekend, April 26-27th, and I’ll be speaking on Saturday. My talk is called Don’t let your site jump the shark, it’s in the design track and I’ll be talking about using animation on websites successfully. Read More"
