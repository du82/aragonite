full_description = "October 7, 2010 / Josh Leuze / No Comments Ask Me About WordPress I will be speaking at WordCamp Minneapolis – St. Paul on Saturday, November 13th, 2010. This will be my first time speaking at a WordCamp, my session is on creating custom page templates. I’ll be covering some of the most common uses that I run into such as adding templates for a single column, alternate sidebar, or special content. If you’re in the area, I highly recommend coming to WordCamp, they are great events for learning more about WordPress and meeting other users. If you’re in another time zone, there’s probably a WordCamp near you, or check out WordCampTV. I will also be volunteering at the help desk, answering questions about WordPress and helping people with their sites. Cory at iThemes was kind enough to send some WPShirts for the help desk crew, so we should be easy to spot. Stop by and ask me about WordPress! Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: WordPress Tags: event, wordcamp Previous Post: Add a theme’s CSS style to the visual editor Next Post: Beta testers needed for Meteor Slides 1.3"
