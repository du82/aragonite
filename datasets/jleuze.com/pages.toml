full_description = "July 27, 2011 / Josh Leuze / No Comments I will be at WordCamp Chicago this weekend. This will be my second time at WordCamp Chicago and only my third WordCamp, the Midwest needs more WordCamps! In 2009 I drove down for Chicago’s first WordCamp. I had a great time at WordCamp, but it was a long hectic drive by myself. Not going to make that drive again, but I also don’t want to be one of those people on Twitter complaining about delayed flights and TSA jackboots so I’m going to take the train instead. I’m packing a nice thick book and hoping for a stress-free trip, don’t let me down Amtrak! Looking forward to meeting a bunch of people I only know from Twitter or their blogs, new people who I haven’t bumped into online yet, and maybe even some people who use Meteor Slides. Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: WordPress Tags: event, wordcamp Previous Post: A tasty Meteor Slides milestone Next Post: A new look for Meteor Slides"
