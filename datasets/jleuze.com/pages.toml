title = "wordcamp | Josh Leuze | Page 4"
full_description = "I’ll be at WordCamp Omaha this week November 14, 2011 / Josh Leuze / 5 Comments On Friday I will be in Omaha for their first WordCamp. I’m glad to see more WordCamps happening in the Midwest, especially since WordCamp MSP didn’t happen this year. Hopefully 2012 will bring even more WordCamps to the area! Update: It looks like WordCamp Omaha didn’t happen this year either, better luck next year… Headed to WordCamp Chicago this weekend July 27, 2011 / Josh Leuze / No Comments I will be at WordCamp Chicago this weekend. This will be my second time at WordCamp Chicago and only my third WordCamp, the Midwest needs more WordCamps! In 2009 I drove down for Chicago’s first WordCamp. I had a great time at WordCamp, but it was a long hectic drive by myself. Not going to make that drive again, but I also don’t want to be one of those people on Twitter complaining about delayed flights and TSA jackboots so I’m going to take the train instead. I’m packing a nice thick book and hoping for a stress-free trip, don’t let me down Amtrak! Looking forward to meeting a bunch of people I only know from Twitter or their blogs, new people who I haven’t bumped into online yet, and maybe even some people who use Meteor Slides. I’m speaking at WordCamp Minneapolis October 7, 2010 / Josh Leuze / No Comments Ask Me About WordPress I will be speaking at WordCamp Minneapolis – St. Paul on Saturday, November 13th, 2010. This will be my first time speaking at a WordCamp, my session is on creating custom page templates. I’ll be covering some of the most common uses that I run into such as adding templates for a single column, alternate sidebar, or special content. If you’re in the area, I highly recommend coming to WordCamp, they are great events for learning more about WordPress and meeting other users. If you’re in another time zone, there’s probably a WordCamp near you, or check out WordCampTV. I will also be volunteering at the help desk, answering questions about WordPress and helping people with their sites. Cory at iThemes was kind enough to send some WPShirts for the help desk crew, so we should be easy to spot. Stop by and ask me about WordPress!"
