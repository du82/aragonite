full_description = "June 16, 2010 / Josh Leuze / 2 Comments I decided my website really needs a mascot, every website should have a mascot right? There isn’t a day goes by that I don’t wish I had a robot minion. Some droid as smart as a dog that could pull weeds and help me water the garden. And on the Net, I need even more help—there just isn’t enough hours in the day! So I built Ampersand here to help me out with some of the grunt work: cleaning up spam, moderating comments, and squashing spider bots that have overstayed their welcome. I have always been a doodler and a science fiction fan, so Ampersand will give me the opportunity to dust off my Wacom tablet and add some futuristic illustrations to my site. Be sure to keep your eyes peeled for Ampersand lurking in the background keeping my outpost running. Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: News Tags: illustration Previous Post: My outpost on the Net Next Post: My first plugin, Meteor Slides Join the conversation! 2 Comments Toby June 24, 2010 at 12:46 pm Haha! Wonderful!! A real life fake robot to take care of all the mundane tasks! Josh June 27, 2010 at 6:48 pm Yeah, I could use a real one! Maybe I should start small, get a vacuum cleaner droid or something. Comments are closed."
