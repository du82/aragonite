full_description = "April 26, 2012 / Josh Leuze / 222 Comments Meteor Slides 1.5 adds responsive slideshow support, touch navigation, an improved slideshow widget, new translations, and updates jQuery Cycle. Responsive Slideshows I have been building more responsive websites lately and receiving more and more requests from users for responsive slideshows, so I have updated the slideshows to scale automatically. If you are using a fixed width theme the slideshows will remain unchanged at their original dimensions. But if you are using a fluid or responsive width theme those are used as the maximum dimensions and the slideshow will scale, shrinking to fit the theme on smaller screens and devices. Any custom slideshow templates, stylesheets, or scripts you are using would have to be updated from the default versions in 1.5 to add this responsive functionality. Try resizing the Meteor Slides homepage in your browser to see the responsive slideshow in action! Touch Wipe Navigation Another mobile friendly update in Meteor Slides 1.5 is support for touch navigation. I added the jQuery Touchwipe plugin which allows previous and next navigation with the swipe of a finger. This works on many touch devices including the iPad, iPhone, and Android mobiles and tablets. Built In Support The contextual help feature has been updated to use the new help functions in WordPress 3.3 and expanded with more information and links to relevant documentation. Click the help tab in the upper right corner of any Meteor Slides admin page for more information. Improved Slideshow Widget The Meteor Slides Widget has been updated with a new slideshow selector. This option only displays if you have created one or more slideshows, allowing you to easily choose a slideshow from a dropdown without having to enter the slideshow’s slug. Even More Translations Thanks to these translators, Meteor Slides is now available in twenty languages! Belarusian: Translation by Alexander Ovsov Czech: Translation by Ondřej Carda Danish: Translation by Kim Hansen Dutch: Translation by Leon Buitendam German: Translation by Maximilian Brandl Persian: Translation by Peyman Asadi A Five Star Year Since 1.4 was released last year the downloads have more than doubled to 93,000, and it has zoomed up to a 145 ratings. I have gotten so many awesome comments, tweets, emails, and even donations from Meteor Slides users this year, thanks everyone for your feedback and generosity! If you want to keep up with and participate in the development of Meteor Slides, check out the project on Github. Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: responsive, slideshow, translation, widget Previous Post: I’ll be at WordCamp Omaha this week Next Post: Speaking at WordCamp NYC 2012 Join the conversation! 222 Comments Rich May 4, 2012 at 3:12 pm Josh, my heart has just sank! I updated to the latest version (1.5) to discover it no longer supports single slides. You need more than one slide to make the script work. Being able to have just one slide was a great feature because it meant you could just upload a single picture and use it as a panel for promotional information throughout one’s site. Josh, please bring this feature back, give me a link to download the old version or tell me how I can get just one panel to show. I’m a theme developer and I’m recommending directing people to your plugin as an enhancement to one of my themes. Please help! Rich Josh May 4, 2012 at 7:45 pm No worries Rich I’m not dropping support for this, you can still use a single slide, there is just a bug in 1.5 with slideshows that have only one slide. I will be releasing Meteor Slides 1.5.1 soon, which will have a fix for this bug. In the meantime, you can download the master from Github, which already includes this fix. Thanks for recommending my plugin, I’d love to check out some of your themes! Rich May 5, 2012 at 4:04 am Phew, that’s great news. Thanks Josh. I managed to find an older version of the plugin i had, but I’ll head on over to Github for the master. I’ll send you a link to the theme once I’ve ironed out a few creases so you can see it in its Meteor Slide glory :)) Rich Josh May 5, 2012 at 11:15 pm Cool, I’ll be looking forward to it! Dion GeBorde May 5, 2012 at 6:45 pm Josh, this is a fantastic plugin! The depth you’ve gone into developing it is admirable. My question is: is there a way to add captions to the images that show up on the slideshow vis a vis this non-wordpress site? In reviewing that site and the notes of the underlying jquery cycle plugin, it appears that the jquery can handle any type element as the slideshow, not only pictures, so I know the capability exists, but I haven’t seen any wordpress jquery cycle based plugins that do anything but images, so I don’t know if there’s some inherent limitation in incorporating it into WordPress that I don’t know about. Long story short, I’m happy to buy you several cups of coffee if you can either a) add the capability to the native functionality of your Meteor Slides plugin or b) show me how I might customize it myself. 🙂 I’m not afraid of digging into code, but I wouldn’t classify myself much past the newbie level. Thanks for your work! Josh May 5, 2012 at 11:37 pm Thanks Dion, coffee is always appreciated, but I better not drink several at once! You can easily add captions using a custom slideshow template. The example in the documentation shows you how to use the slide title as a caption, if you need a title and description you could add excerpts to the slide post type and add the excerpt to the slideshow template. Dion GeBorde May 7, 2012 at 12:31 pm Thanks, Josh, I bought you a cup of coffee (or two, depending on what you drink) just for replying. 🙂 From the “customize template” page I see how in your example we’re adding the title to the actual slideshow, but the Title is already in the custom post type. Buy you a few more cups of coffee for showing me just what code would go where to include an excerpt box (or generic meta box) in the slide custom post type that would then show up on the slide in the slideshow. 🙂 🙂 If you take a look at that moving company page I referenced in my first comment, you’ll see that the headline and caption are inside another div, so that the parent div and the child title and caption can all be styled independently with a custom stylesheet. Really appreciate your time and help! Josh May 7, 2012 at 1:04 pm Thanks, I raise my cup to you! Adding excerpt support to the slides post type is really easy, you can either drop this bit of code into your theme’s functions.php, or create a meteor-excerpts.php file with this code and install it as a plugin. Now that you have a title and excerpt to work with for each slide, add something like this to your custom slideshow template before the closing .mslide tag. You should be able to style that markup to match the example you posted or however else you want the captions to look. Dion GeBorde May 8, 2012 at 12:38 am Well Josh, I was all excited. The information you provided was comprehensive and well detailed. I made all the changes and configured my CSS. I just now went to upload my first slide “From URL.” I inserted the URL, the title, and the alt tag. Clicked the “Insert into Post” button and … nothing. Nothing happens. No “working” spinner, no error message. Just … nothing. Any ideas? Josh May 8, 2012 at 12:59 am You have to upload the slide image when you add it as a featured image, it won’t work with the “From URL” option. Ingemar May 5, 2012 at 11:41 pm Hi! I just upgraded to 1.5 and there seems to be a small glitch in the image positioning when you hover over the image. Also the positioning of the “navigation dots” are off. See examples below: Version 1.5 (bug): http://testing.swipeware.com/big-fat-goalie-2 As you can see the image jumps down when hovered over. Version 1.4 (works fine): http://www.swipeware.com/big-fat-goalie Regards, Ingemar Josh May 6, 2012 at 1:13 pm Hi Ingemar, the hover nav display is conflicting with a few themes, add this to your theme’s stylesheet to fix the problem: .meteor-slides.navhover ul.meteor-nav { display: inline !important; } bitejones June 12, 2014 at 5:47 am Hey Josh, my slide show is moving down on hover as well I have being trying several of these fixes including .meteor-slides.navhover ul.meteor-nav { display: inline !important;} but no luck so far. Greatly appreciate any help you can offer. Cheers Josh June 12, 2014 at 9:28 am Hi, could you post a link to the page you’re working on? bitejones June 12, 2014 at 9:57 am Sorry I thought I did. http://www.burlingtonschoolofenglish.com Josh June 13, 2014 at 9:52 am Your theme is adding some line height to the list for the slideshow navigation, you can fix this by adding this rule to your theme’s stylesheet: #content .meteor-nav { line-height: 0; } Also, you are using the slideshow name, “Main” to specify a slideshow, make sure you use the slideshow slug instead, like “main”. bitejones June 13, 2014 at 11:32 am Hey Josh, Thank you for looking into this for me, i Sincerely appreciate this. The problem is rectified on safari and in google chrome, unfortunately it is still moving down on hover on firefox and explorer. Would be great if you can look into this for me as well. much appreciated. Josh June 13, 2014 at 11:55 am Your theme is adding some padding to the list items in the slideshow nav, try removing that like this: #content ul.meteor-nav li { padding: 0; } bitejones June 16, 2014 at 3:44 am Thank you Josh, amazing! appreciated that! Josh June 16, 2014 at 12:28 pm No problem! Ingemar May 7, 2012 at 3:35 am Hi Josh, I’ve added that to my CSS an now it’s much better. The navigation dots are still below the containing div instead of below the slides, but that’s something I can live with. Thanks! Josh May 7, 2012 at 10:01 am No problem, you should be able to play around with the positioning of the paged nav to get it how you want it, let me know if you have problems with it. Dion GeBorde May 8, 2012 at 2:41 am Hey Josh, Well man, your plugin is brilliant and your support phenomenal. Once I went in and started paying attention to all the individual trainings, I discovered you had already described exactly how to add the featured image (before I returned and saw your reply). Well, everything’s working perfectly, got my captions going (just formatting details remain) and I am a happy camper. Enjoy a few more cups of coffee on me, but not all at once. But clearly if you’re up as late as I am, you could probably use them. 😉 Thanks for everything. Josh May 8, 2012 at 5:26 pm You’re welcome Dion, I’m glad the documentation helped out. Thanks again for the coffee! Neil May 8, 2012 at 9:45 am Hey Josh, I cannot get your code to work on my site. Perhaps you can see where I went wrong: $themeslug = ‘if’; $root = get_template_directory_uri(); $slider_default = ‘meteor_slideshow’; The slider works in the sidebar, but I have tried all sorts and cannot get it to work. Please can you help? Great site BTW! Josh May 8, 2012 at 5:23 pm Hi Neil, can you post a link to the site you’re working on? I’m not sure what this means: $slider_default = ‘meteor_slideshow’; Are you using the template tag or shortcode to add the slideshow? Dion GeBorde May 9, 2012 at 1:07 pm Hey Josh! Oh, got me a whole new can of worms. I’ve pulled the meteor slides php and css into my child theme and edited them both to get showing just what I wanted in Firefox. Then I checked on my Android smartphone and in Chrome and … there’s no slideshow! There’s a blank space big enough for the slideshow, but no photos, no error message, nuthin. Suggestions? Josh May 9, 2012 at 1:13 pm I can take a look if you want to post a link. Dion GeBorde May 9, 2012 at 1:29 pm The site is here. Let me know if you need anything else. And thanks! Josh May 9, 2012 at 3:23 pm The slideshow markup looks fine on the page, the problem is that the scripts that power the slideshow are missing from your head. I think your cache is messing with them, try disabling the cache and testing the slideshow. If that is the problem, clear the cache or see if you can exclude those scripts. Dion GeBorde May 10, 2012 at 10:50 pm Thanks Josh. After some wriggling and wrestling with W3 Total Cache, it all looks like it’s working. There’s something else that confuses me though. The effect appears differently in Firefox than Chrome, IE, or Android. Do you know why that might be? Frankly I think the effect is way cooler in Firefox and probably the way it’s *supposed* to look (curtainX). Any thoughts? Josh May 11, 2012 at 5:59 pm The effect looks the same to me in Firefox and Chrome, did you get it figured out? Some of the effects work better for certain content than others, like with the curtain effects only the image is re-sizing, not the caption, so that could cause it to work differently than it would with just an image. You might want to experiment more, uncover or scrollHorz might work better with captions. Dion GeBorde May 11, 2012 at 10:45 pm Hey Josh, Yah, I checked them again the next morning and they all looked great, so I think it was just delayed in refreshing the cache or something. I actually really like the fact that the caption doesn’t resize; makes for a mesmerizing, complex effect I think. Anyhoo, you’ve been brilliant through this whole process. Really appreciate your skills and support! Josh May 11, 2012 at 11:28 pm Cool, glad to help! Cezary May 14, 2012 at 11:19 am Hi…excellent work 😉 Thank You very much. I have one questions Josh: can I transform navigation-list under images into buttons with titles of slides? rgrds Josh May 14, 2012 at 4:22 pm You’re welcome Cezary! It is possible to use the slide titles in the pager instead of just numbers, but it is kind of complicated so I added this to the documentation on customizing the slideshow script. Take a look at the new section on building custom paged navigation to learn how to do this. Cezary May 15, 2012 at 7:41 am Thanks Josh, Your tutorial is great. It was easy and fast process. Everything looks perfetctly 😉 Once again: Big Thanks. Josh May 15, 2012 at 9:54 am No problem, glad the tutorial helped! Mark McLachlan May 21, 2012 at 6:56 am Hello Josh I wonder if you could help with some custom border styles I have on my sidebar slideshow. The bottom border is not showing after I updated the stylesheet in the child theme. I don’t have access to an ipad to see how it displays at the mo but suspect it may also cut off the border on the right. I have enjoyed the instructions on your site as it has helped greatly with a custom page template I am working on to include in the site. thanks Mark Josh May 21, 2012 at 10:31 am Hi Mark, the problem is that the slideshow is sized to fit just the slides, so borders or padding added to the slides can"
