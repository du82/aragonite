title = "bugs | Josh Leuze"
full_description = "A small Meteor Slides update December 19, 2014 / Josh Leuze / 4 Comments I released Meteor Slide 1.5.3 yesterday. This update has some minor stylesheet tweaks to fix conflicts with the new default theme, TwentyFifteen, as well as some other common theme issues. Meteor Slides 1.5.3 also includes a new Norwegian translation and updated Swedish translation. Read More Inspecting WordPress With Firebug April 27, 2013 / Josh Leuze / 1 Comment I have been using WordPress for about six years. Different themes, plugins, and code editors have come and gone through this huge learning process as I have developed hundreds of websites, but the one constant for me has been the Firefox add-on Firebug. It’s the only tool that I have stuck with throughout those years because I have been able to learn so much with Firebug and build projects so much faster by using it. If you have never used a web inspector like Firebug before, what it does is allow you to bridge the gap between the source code and the rendered out page in your browser. You can look at each bit of code interactively and see how it fits into the page, adjusting the code in the inspector and seeing the updates live in your browser. Read More Five stars for Meteor Slides January 21, 2013 / Josh Leuze / 42 Comments Meteor Slides recently reached a big milestone, receiving 200 five star ratings on WordPress.org. It has also been getting some great reviews via the new review feature in the plugin directory. My robot minion Ampersand has been hiding out lately and I haven’t been spending nearly enough time drawing, so I dusted off my Wacom tablet and did some sketching. First I drew Ampersand going on a 5 star balloon ride after hitting 200 ratings and then I drew a spiffy new donate page with buttons for PayPal and my Amazon wishlist. My reading queue is getting out of control! Read More Meteor Slides updated for WordPress 3.1 January 31, 2011 / Josh Leuze / 21 Comments In preparation for WordPress 3.1 which should be out any day now, I just released Meteor Slides 1.3.2. This version is still compatible with WordPress 3.0 and has been tested up through 3.1 Release Candidate 3. Meteor Slide 1.3.2 has some updated functionality for WordPress 3.1, improves support for slideshows of different sizes, and now includes contextual help for all of the slideshow admin pages. This plugin recently reached 17,000 downloads, and after 40 ratings, Meteor Slides is still holding onto five stars! Thanks everyone who has tried my plugin, rated it, and especially those who have been kind enough to donate. Seen a few cool implementations of Meteor Slides lately and I’d love to see more if you want to share a link. Read More"
