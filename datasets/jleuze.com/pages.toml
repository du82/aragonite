full_description = "July 18, 2010 / Josh Leuze / No Comments Meteor Slides now includes localization support so that it can be translated into any language. Indonesian and Turkish translations are currently included with the plugin, Italian and Romanian translations should be released soon. Meteor Slides in your language? If you would like to volunteer to translate Meteor Slides into your language it would be a big help! You can download the PO file if you know how to use it, or grab the plain text file and I’ll take it from there. Please email your translation to: mail@jleuze.com Meteor Slides 1.2 This release adds support for multiple languages and contains two translations. If you have any problems with this version please let me know. Localization support Updated plugin to support translation. Two members of the WordPress community have kindly translated Meteor Slides, thanks for contributing! Translations: Indonesian: Translation by gustulank Turkish: Translation by ercani Meteor Slides 1.2.1 Added two more translations courtesy of Eugen and Florent, thanks for helping! Translations: French: Translation by Florent Quiquandon Romanian: Translation by Eugen Paun Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: illustration, slideshow, translation Previous Post: Meteor Slides is going global Next Post: New features & languages for Meteor Slides"
