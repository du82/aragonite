["https://jleuze.com/meteor-slides-updated-for-wordpress-3-1"]
title = "Meteor Slides updated for WordPress 3.1 | Josh Leuze"
description = "In preparation for WordPress 3.1 which should be out any day now, I just released Meteor Slides 1.3.2. This version is still compatible with WordPress 3.0 and has been tested up through 3.1 Release…"
full_description = "January 31, 2011 / Josh Leuze / 21 Comments In preparation for WordPress 3.1 which should be out any day now, I just released Meteor Slides 1.3.2. This version is still compatible with WordPress 3.0 and has been tested up through 3.1 Release Candidate 3. Meteor Slide 1.3.2 has some updated functionality for WordPress 3.1, improves support for slideshows of different sizes, and now includes contextual help for all of the slideshow admin pages. This plugin recently reached 17,000 downloads, and after 40 ratings, Meteor Slides is still holding onto five stars! Thanks everyone who has tried my plugin, rated it, and especially those who have been kind enough to donate. Seen a few cool implementations of Meteor Slides lately and I’d love to see more if you want to share a link. Meteor Slides 1.3.2 Meteor Slides 1.3.2 improves support for multiple slideshows and adds updates for WordPress 3.1 compatability. Any custom stylesheets or templates will need to be updated for use with this release. Improved support for multiple slideshows of different sizes Fixed transparent PNG bug Updated functions for WordPress 3.1 compatibility Updated screenshots for WordPress 3.1 Updated jQuery Cycle to 2.94 Updated jQuery Metadata to 2.1 Added message filters for slides Added contextual help Added Chinese translation by Yu Haoran Updating Custom Stylesheets and Templates To fully support multiple slideshows of different sizes I had to make some changes to simplify the markup of the slideshow. This will not affect most users of Meteor Slides, but if you are using a custom stylesheet or slideshow template you will want to replace these with a fresh copy from 1.3.2 and update your changes. Sorry for any inconvenience, but these changes should improve the flexibility and reliability of the slideshow. If you have any problems or questions please let me know. Note: I had a generic function in 1.3.2 that was causing a conflict, Meteor Slides 1.3.3 resolves this issue. Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: bugs, slideshow, translation Previous Post: Help test Meteor Slides 1.3.2 Next Post: A tasty Meteor Slides milestone Join the conversation! 21 Comments Toby January 31, 2011 at 11:28 pm Great work, Josh! Meteor Slides has been amazing for me everywhere I have installed it! Josh January 31, 2011 at 11:58 pm Thanks Toby, glad to hear my plugin is coming in handy! Rob February 8, 2011 at 8:15 am Good plugin. Easy to work with. I used another gallery much like this one, but could not find an easy way to get it into a WordPress page. Only thin I miss in this one is the ability to put a text on/below each slide. Josh February 9, 2011 at 12:20 am Hi Rob, thanks for trying Meteor Slides. There are no captions out of the box, but you can add them with a custom template if you would like to. Gene February 14, 2011 at 11:16 am Hey I noticed that whenever I only select 1 slide for “Slideshow Quantity” instead of having multiples slides in the settings page, the width and height aren’t applied to the slide when I refresh the page. It seems to only work correctly when I have more than 1 slide. For example if I set the settings to 940px width and 300 height and only select 1 slide to show, the size settings aren’t applied. I could see the difference in firebug. Josh February 15, 2011 at 9:45 pm I don’t think jQuery Cycle is setup to handle just one slide since it wouldn’t function as a slideshow. Gene February 16, 2011 at 7:51 pm Yeah, I had to add a margin:auto to one of the div’s I think. It centered the slide……. Its no big deal for me, I was just wondering what to tell a client that uses a theme with the meteor plugin and only selects 1 slide. I dont know why they would use a slideshow for only 1 slide, but you know someone will do it and ask why it isn’t working lol. Thanks Dave K. March 28, 2011 at 1:44 pm Still the best slideshow I’ve tried. Really nice work. Thanks. Josh March 28, 2011 at 6:10 pm No problem Dave! Rick April 14, 2011 at 9:19 pm I am starting a new WordPress site from a theme that I just purchased………….meteor slides is not working. I don’t see thumbnails of my slides either in the meteor slides plugin. Josh April 15, 2011 at 9:04 am Hi Rick, this link didn’t work for me, is that the correct link to the site you are working on? Rick April 15, 2011 at 9:29 am Sorry………..see if it works now. Josh April 15, 2011 at 9:41 am It is working for me now. First thing I would do is deactivate any other plugins and test the slideshow to confirm that there aren’t any other plugins conflicting with Meteor Slides. I would also try switching to the default theme to see if the plugin is conflicting with your theme. Once you know what Meteor Slides is conflicting with, it will be much easier to fix! Rick April 15, 2011 at 10:04 am I have all the plugins deactivated except meteor slideshow…………I activated the default theme and nothing works. I purchased the theme and it came with your meteor slideshow plugin. Could it be a server issue? The website is hosted on Go Daddy’s server. Josh April 15, 2011 at 10:08 am At least we know it is not conflicting with another theme or plugin. What is the name of the theme, where did you get it? You can see the slideshow images fine in the admin, they are attached to the slide posts as featured images? Rick April 15, 2011 at 10:18 am Sorry…………..I forgot to tell you that I don’t see any thumbnails for the slides in the admin. Thanks for replying so quickly. Josh April 15, 2011 at 10:20 am If the problem is in the admin area too, can you email me some login info so that I can check it out? Where did you get this theme? Melissa September 22, 2013 at 11:15 pm Hey Josh-I’m stuck. The slideshow worked at first, but now it’s not appearing on my website. The slides do show up in admin though. Not sure what went wrong. Can you help? Josh September 23, 2013 at 10:06 am Hi Melissa, I can see that you are using the slideshow widget, but nothing is loading for the slideshow. Try removing the widget and adding it back into the widgetized area. Melissa September 23, 2013 at 2:21 pm Thanks, Josh! That worked! I appreciate your help! Love the slideshow widget; looks great! Josh September 23, 2013 at 4:23 pm You’re welcome Melissa! Comments are closed."
