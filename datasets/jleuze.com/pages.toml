full_description = "Speaking at WordCamp Milwaukee 2013 May 13, 2013 / Josh Leuze / No Comments Next month I’ll be at WordCamp Milwaukee talking about WordPress themes in a session called Theme Choices, When To Have A Baby. I’ll be talking about using a theme right off the shelf, hacking and forking themes, parent and child themes, starter themes, and theme frameworks. I’ll also discuss what functions should be in a theme, and when to use a plugin. The organizers for WordCamp Milwaukee were kind enough to setup a coupon code for each speaker, you can use “Leuze” to save five bucks when you get a ticket. I’m looking forward to yet another awesome WordCamp and also spending some time in Milwaukee instead of just seeing the city roll by on the train. If you’re going to be attending, you should definitely find me and say hi! Speaking at WordCamp Minneapolis 2013 March 30, 2013 / Josh Leuze / No Comments I’m speaking at WordCamp Minneapolis next month, my session is called Inspecting WordPress. I’ll be talking about using Firebug or other web inspectors to dig into a site and learn how it is put together, make CSS tweaks, fix bugs, and optimize a site. Several of us from the local MSP WordPress user group have been busy organizing the WordCamp. Everyone’s been doing an awesome job, the schedule, venues, parties, and swag are all coming along nicely. I built the theme, designed by the talented guys at WerkPress, and I’ve been managing the site. We just posted the speakers and sessions, there’s going to be a lot of brainpower to tap into. Read More WordCamp Chicago road trip August 21, 2012 / Josh Leuze / No Comments I’m going on a WordPress bender this weekend! First I’m headed to the Twin Cities for the MSP WordPress meetup. After that, Kiko Doran and I are road tripping down to Chicago for WordCamp Chicago 2012. This will be my third time attending WordCamp Chicago and it looks like it will be the best one yet. There are a lot of awesome speakers and sessions on the schedule, but I’m really interested in the interactive talks track, hopefully those will start some good conversations."
