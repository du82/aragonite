title = "WordPress | Josh Leuze | Page 2"
full_description = "Speaking at WordCamp Milwaukee 2015 July 24, 2015 / Josh Leuze / No Comments This weekend I’ll be at WordCamp Milwaukee, last year in Milwaukee I talked about building better widgets and this year I’m talking about building better themes! This is my only WordCamp this summer, they seem to be spreading out throughout the year now, which is good. So my goal for the year is one each season, Minneapolis in the spring, Milwaukee this summer, Chicago in the fall, and Philadelphia this winter for the first ever WordCamp US! Meteor Slides widget update for WordPress 4.3 July 5, 2015 / Josh Leuze / No Comments Today I released Meteor Slides 1.5.4. This tiny update changes the code for setting up the slideshow widget for WordPress 4.3, which will be coming out soon. This only updates how the widget is added to WordPress and doesn’t change the admin interface for the widget or how slideshow widgets display on the frontend of a site. Read More Building Your First Functionality Plugin April 25, 2015 / Josh Leuze / No Comments I gave a talk at WordCamp Minneapolis 2015 about building functionality plugins. We talked about the difference between themes and plugins, and what should go in each. I covered getting setup for writing a plugin, best practices for WordPress development, and gave some real world examples of plugin functionality. Read More Speaking at WordCamp Minneapolis 2015 April 21, 2015 / Josh Leuze / 2 Comments We’ve been hard at work getting ready for WordCamp Minneapolis this weekend and I think it will be the best one yet! The schedule is packed with great sessions, we’ve got a Mexican buffet lined up for lunch, and some awesome looking swag courtesy of Westwerk and Marktime Media. My session is called Building Your First Functionality Plugin and I’ll be talking about what should be in a WordPress theme, and what should be in a plugin. This will be an intro to building plugins for new developers and will also cover how a functionality plugin might differ from a standard plugin. Minneapolis should be a great start to another year of awesome WordCamps, I hope to see some of you there!"
