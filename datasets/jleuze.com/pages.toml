["https://jleuze.com/small-meteor-slides-update-for-members-plugin"]
title = "Small Meteor Slides update for Members plugin | Josh Leuze"
description = "I have one more small update for Meteor Slides, version 1.5.6, which includes updated support and functionality for the latest version of the Members plugin."
full_description = "June 17, 2016 / Josh Leuze / No Comments I have one more small update for Meteor Slides, version 1.5.6, which includes updated support and functionality for the latest version of the Members plugin. Members 1.1.1 The latest version of the Members plugin has some big changes, including the addition of a new admin section for the role manager with new capabilities groups. This version of Meteor Slides has been updated to support these changes in Members. Meteor Slides will also add a custom Meteor Slides capabilities group with all of the custom capabilities for managing slides. If you have Meteor Slides and Members both installed it is important to update both plugins to the latest version to avoid plugin conflicts. Check out this previous post about using the Members plugin with Meteor Slides for more info about why you might want to use these plugins together. DOWNLOAD METEOR SLIDES FROM WORDPRESS.ORG Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: jquery, members Previous Post: Speaking at WordCamp Minneapolis 2016 Next Post: Speaking at WordCamp Minneapolis / St. Paul 2018"
