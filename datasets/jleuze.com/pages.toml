["https://jleuze.com/a-tasty-meteor-slides-milestone"]
title = "A tasty Meteor Slides milestone | Josh Leuze"
description = "Meteor Slides reached a couple of big milestones this week. My plugin broke 50 ratings while holding onto a five-star rating. It has also now been downloaded over 25,000 times, that’s a lot o…"
full_description = "March 25, 2011 / Josh Leuze / 13 Comments Meteor Slides reached a couple of big milestones this week. My plugin broke 50 ratings while holding onto a five-star rating. It has also now been downloaded over 25,000 times, that’s a lot of slideshows! To celebrate Kristine and I baked some gold star cookies with the kids—alright, they baked the cookies and I ate them. Thank you everyone who has tried and rated my plugin, marked it as working, or left a comment. I really appreciate all of the feedback! Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides Previous Post: Meteor Slides updated for WordPress 3.1 Next Post: Headed to WordCamp Chicago this weekend Join the conversation! 13 Comments WordPress Community Links: Gold star cookie edition | WPCandy March 26, 2011 at 7:10 pm […] up we have blog posts. This week:Josh Leuze hit a milestone with his Meteor Slides plugin, and celebrated with 5-star cookies.Jason Paul shared why he uses WordPress. Why do you use WordPress?Thomas […] Paul March 26, 2011 at 9:23 pm I’ve learned a lot from hacking this ‘Meteor Sliders’ plugin. Thank you for your hard work Congratulations Josh ! Josh March 26, 2011 at 9:24 pm Thanks Paul, I’m glad you’re learning from it! Don March 28, 2011 at 11:16 am It’s well written and functions perfectly (enough that a non-savvy client ‘gets it’), so I’m not surprised that you’re at 5 stars still. The rating is deserved–good work. Josh March 28, 2011 at 11:29 am Thanks so much Don! Toby March 29, 2011 at 3:01 am Congrats, Josh! Meteor Slides rocks!!! Josh March 29, 2011 at 6:16 pm Thanks Toby! Ehud March 30, 2011 at 3:07 pm Meteor Slides is a great plugin. I’d give 6 stars if there was such an option. Special thanks for making the process for customizing the CSS and even the PHP loop so easy! I was banging my head against the wall with some other slider plugins until I found this one – it’s almost perfect. My wishlist is very short: * allow slide order not just by date * warning notice when I try to publish a slide without a title (where does it go, anyway?) Josh March 30, 2011 at 3:36 pm Thanks Ehud, I do a lot of custom slideshows so I wanted to make sure it was easy to customize my plugin. I am planning to add a better way to sort the slides in a future release so be on the lookout for that! I think that the slides without titles is a WordPress bug, with a blog post, an empty title becomes the post ID, hopefully they extend this to custom post types in the future. Hane May 6, 2011 at 9:01 am I love Meteor – I would just like to know how I can show 2 or 3 images next to each other instead of just one. Josh May 6, 2011 at 2:52 pm Hi Hane, it sounds like you need more of a carousel rather than a slider, check out the jCarousel examples, it can probably do what you want. Junior May 10, 2011 at 10:15 pm Hi Josh, Slides Meteor is excellent, I was looking for something that works, and now I found! Thanks. … Junior Brazil Josh May 10, 2011 at 10:45 pm Thanks Junior, I’m glad it’s working out for you! Comments are closed."
