["https://jleuze.com/category/wordpress/page/6"]
title = "WordPress | Josh Leuze | Page 6"
full_description = "I’ll be at WordCamp Omaha this week November 14, 2011 / Josh Leuze / 5 Comments On Friday I will be in Omaha for their first WordCamp. I’m glad to see more WordCamps happening in the Midwest, especially since WordCamp MSP didn’t happen this year. Hopefully 2012 will bring even more WordCamps to the area! Update: It looks like WordCamp Omaha didn’t happen this year either, better luck next year… Using the Members plugin with Meteor Slides September 23, 2011 / Josh Leuze / 15 Comments One of the new features in Meteor Slide 1.4 that needs covering in more detail is support for the Members plugin. Using Members, you can control which roles can create and edit slides and slideshows, and which can change the slides settings. By default slide posts use the same capabilities as blog posts and only admins can change the slide settings. So admins, editors, and authors can create new slides, and contributors can create slide post drafts. This is straightforward, but not exactly ideal. Most of the time I only want the admin and editor to create and edit slides. And what if you want to give an editor access to the settings? This is where Members comes in handy. Read More A new look for Meteor Slides August 31, 2011 / Josh Leuze / 73 Comments Meteor Slides 1.4 features a new slideshow design, support for the Members plugin, custom slideshow script support, and several new and updated translations. Meteor Slides has been busy since version 1.3.3 was released. The number of downloads doubled to over 40,000 with nearly 80 ratings and many generous donors have also helped to keep my coffee cup full, thanks! I recently created a GitHub repository for Meteor Slides; drop by if you’d like to fork, pull, watch, or otherwise fiddle with my plugin. Read More Headed to WordCamp Chicago this weekend July 27, 2011 / Josh Leuze / No Comments I will be at WordCamp Chicago this weekend. This will be my second time at WordCamp Chicago and only my third WordCamp, the Midwest needs more WordCamps! In 2009 I drove down for Chicago’s first WordCamp. I had a great time at WordCamp, but it was a long hectic drive by myself. Not going to make that drive again, but I also don’t want to be one of those people on Twitter complaining about delayed flights and TSA jackboots so I’m going to take the train instead. I’m packing a nice thick book and hoping for a stress-free trip, don’t let me down Amtrak! Looking forward to meeting a bunch of people I only know from Twitter or their blogs, new people who I haven’t bumped into online yet, and maybe even some people who use Meteor Slides."
