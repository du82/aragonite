title = "Josh Leuze | Josh Leuze | Page 8"
description = "I'm a WordPress developer from Minnesota. Aside from WordPress; I'm also into biking, art, and sci-fi."
full_description = "Multiple Slideshows for Meteor Slides October 28, 2010 / Josh Leuze / 54 Comments Meteor Slides 1.3 is now available for download. This version of Meteor Slides supports multiple slideshows and includes a number of improvements and fixes. I have updated the Meter Slides homepage and and added detailed documentation. Check out the new screencast below to learn more about the newest version. Video Overview This screencast shows some of the new features in 1.3, such as adding multiple slideshows, and using metadata. Read More Beta testers needed for Meteor Slides 1.3 October 14, 2010 / Josh Leuze / 6 Comments I have Meteor Slides 1.3 finished and ready to go, it just needs a bit of testing before I release the final version. I have tested this plugin with the TwentyTen theme and on my own site with some common plugins and it works very well. But there are some big changes in this version and I’d like to hear how it works with a variety of themes and plugins out in the wild. Features in this version include support for multiple slideshows and metadata. The template tag, shortcode, and widget all support both of these features. I’m especially interested to see how the shortcode and widget work with different themes and plugins. There are also several other small changes, such as expanded navigation options. Download the beta of Meteor Slides 1.3 and give it a try! I updated the beta to fix a bug with using metadata to resize a slideshow. I am currently writing updated documentation and recording some new screencasts for these new features. I’m hoping to release Meteor Slides 1.3 before the end of the month, of course a babysitter and some espresso could speed things up! Read More I’m speaking at WordCamp Minneapolis October 7, 2010 / Josh Leuze / No Comments Ask Me About WordPress I will be speaking at WordCamp Minneapolis – St. Paul on Saturday, November 13th, 2010. This will be my first time speaking at a WordCamp, my session is on creating custom page templates. I’ll be covering some of the most common uses that I run into such as adding templates for a single column, alternate sidebar, or special content. If you’re in the area, I highly recommend coming to WordCamp, they are great events for learning more about WordPress and meeting other users. If you’re in another time zone, there’s probably a WordCamp near you, or check out WordCampTV. I will also be volunteering at the help desk, answering questions about WordPress and helping people with their sites. Cory at iThemes was kind enough to send some WPShirts for the help desk crew, so we should be easy to spot. Stop by and ask me about WordPress!"
