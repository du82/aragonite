full_description = "Meteor Slides update for WordPress 4.4 & Twenty Sixteen December 11, 2015 / Josh Leuze / 9 Comments I just released Meteor Slides 1.5.5. This is a small update that adds support for responsive images using srcset in WordPress 4.4 and fixes some Twenty Sixteen theme conflicts. Read More Meteor Slides widget update for WordPress 4.3 July 5, 2015 / Josh Leuze / No Comments Today I released Meteor Slides 1.5.4. This tiny update changes the code for setting up the slideshow widget for WordPress 4.3, which will be coming out soon. This only updates how the widget is added to WordPress and doesn’t change the admin interface for the widget or how slideshow widgets display on the frontend of a site. Read More A small Meteor Slides update December 19, 2014 / Josh Leuze / 4 Comments I released Meteor Slide 1.5.3 yesterday. This update has some minor stylesheet tweaks to fix conflicts with the new default theme, TwentyFifteen, as well as some other common theme issues. Meteor Slides 1.5.3 also includes a new Norwegian translation and updated Swedish translation. Read More Meteor Slides updated for WordPress 4.0 October 12, 2014 / Josh Leuze / 9 Comments I just released Meteor Slide 1.5.2, a plugin update which includes a new Slides icon and other styling adjustments to match the admin in WordPress 4.0. This update also includes some new and updated translations, bringing the total number of translations up to twenty-five! Read More Five stars for Meteor Slides January 21, 2013 / Josh Leuze / 42 Comments Meteor Slides recently reached a big milestone, receiving 200 five star ratings on WordPress.org. It has also been getting some great reviews via the new review feature in the plugin directory. My robot minion Ampersand has been hiding out lately and I haven’t been spending nearly enough time drawing, so I dusted off my Wacom tablet and did some sketching. First I drew Ampersand going on a 5 star balloon ride after hitting 200 ratings and then I drew a spiffy