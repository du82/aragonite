["https://jleuze.com/tag/bugs/page/2"]
title = "bugs | Josh Leuze | Page 2"
full_description = "A few Meteor Slides updates December 14, 2010 / Josh Leuze / 32 Comments I just released Meteor Slides 1.3.1, which fixes thumbnail registration conflicts, transparent images issues, and navigation for multiple slideshows. There have been a few projects where I have needed to customize the template for the slideshow, so this version adds support for a custom slideshow template. I added some documentation for using a custom template which shows how to add titles or captions to the slides, and there is also now a page in the documentation on custom stylesheets. Read More Improved Meteor Slides navigation August 30, 2010 / Josh Leuze / 15 Comments I’ve been getting a ton of feedback about Meteor Slides lately, and seeing some really awesome looking sites using my plugin. Meteor Slides recently broke 5000 downloads on WordPress.org and got its eleventh 5 star rating, thanks everyone for trying out my plugin and leaving a rating or feedback. And I want to give a special thank you to the users who have been kind enough to support this plugin with a donation. I just released Meteor Slides 1.2.3, which includes paged slide navigation. The paged buttons goes together with the left/right navigation and neither will be added to your slideshow unless you enable navigation in the settings. You can see how the paged navigation works on my homepage. The buttons can be easily modified or even hidden completely with CSS if you would prefer a different design. Read More Meteor Slides is going global July 10, 2010 / Josh Leuze / No Comments Eugen at WPTuts.ro wrote a post about Meteor Slides, and even took the time to make some awesome screenshots that explain the plugin’s interface in Romanian. One of the features on my to-do list is adding support for localization so that users can translate Meteor Slides into any language they choose. I held off on this feature in the initial release, because there just isn’t that much text in the plugin to be translated. But my goal with Meteor Slides was to make it easy to use with an intuitive interface, and a big part of that usability is being able to read the interface! To help meet that goal, translation support is the next feature I’ll be releasing for Meteor Slides. Translators needed! However this feature isn’t very useful without some translation files, and my high school french isn’t going to be of much help. If anyone would like to volunteer to translate Meteor Slides it’d be much appreciated. I can provide you with a POT file if you have the software to use it, or I can send you plain text and create the file from your translation. Just leave a comment or email me: mail@jleuze.com Meteor Slides 1.1.1 I released an update for Meteor Slides that fixes a few bugs. If you find more bugs, please let me know. Read More"
