title = "Multiple Slideshows for Meteor Slides | Josh Leuze"
description = """
Meteor Slides 1.3 is now available for download. This version of Meteor Slides supports multiple slideshows and includes a number of improvements and fixes.

I have updated the Meter Slides homepag…"""
full_description = '''October 28, 2010 / Josh Leuze / 54 Comments Meteor Slides 1.3 is now available for download. This version of Meteor Slides supports multiple slideshows and includes a number of improvements and fixes. I have updated the Meter Slides homepage and and added detailed documentation. Check out the new screencast below to learn more about the newest version. Video Overview This screencast shows some of the new features in 1.3, such as adding multiple slideshows, and using metadata. Meteor Slides 1.3 Added custom slideshows taxonomy for multiple slideshows Optional slideshow and metadata parameters for template tag and shortcode Optional title, slideshow, and metadata parameters for the widget Added settings link to plugins page Added Slide image and link to slides column Removed slides from menu editor and search Expanded navigation options Added Metadata jQuery plugin Added Swedish translation by Simon Wämmerfors Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides Tags: custom post type, screencast, slideshow Previous Post: Beta testers needed for Meteor Slides 1.3 Next Post: Creating your own Page Templates Join the conversation! 54 Comments duyhen December 9, 2010 at 1:43 am i want to put in wiget and page but edit size for to both, help Josh December 9, 2010 at 9:32 am Hi duyhen, you can use metadata to setup slideshows of different sizes. Check out this support forum thread for more info. Paul December 15, 2010 at 7:36 am Hi Josh The CPT created will have its own permalink, like this for example http://www.jleuze.com/slide/slide-1/ Is there anyway to make CPT not to have URL ( no permalink to it at all ? ) btw, I think your plugin is by far the best of feature slider plugin. Thank you very much and please keep it up !! Josh December 15, 2010 at 10:05 am Hi Paul, no technically they are posts, so they will always have a permalink. The slides posts are excluded from search and should never show up on the frontend. In Meteor Slides 1.3.1 I have also pretty well hidden the permalinks for the slides since they aren’t needed. Paul December 16, 2010 at 1:21 am Hi Josh, Thank you very much for taking a time to answer my question, I’ve learned a few things just by looking at the plugin files. Josh December 16, 2010 at 8:52 am No problem Paul, let me know if you have any other questions. Sarah December 16, 2010 at 2:27 am I’m having some issues with the width/height. I’m using shortcode in a page, and no matter how I’ve tried to input the width and height of the image (640px x 480px), it always reverts it back to 640px x 200px, which cuts it off on the top. Do you have any idea why it is doing this? Josh December 16, 2010 at 8:56 am So is the actual height option in the settings reverting, or is it just the height of the slideshow on the frontend? There could be a conflict with your theme, could you post a link? Sarah December 16, 2010 at 1:17 pm It seems to be working ok now, I guess it was because I changed the dimensions after uploading the images. Another issue I’m having now is that on the home page my slideshow should be 648×648… but on internal pages it should be 648×518. The ones that are 648×518 have a big white space underneath. I tried messing with metadata to change the height within the shortcode, but that doesn’t seem to be working. Any suggestions? Josh December 16, 2010 at 1:37 pm Can you share the code with with metadata you are using to load the slideshow? And do you have a link to the page you are working on? Sarah December 22, 2010 at 6:41 pm Here is a link to the page: http://fancyflavor.com/envy/ (test page) and here is the metadata: [meteor_slideshow slideshow="irma-slideshow" metadata="random: 1, width: '648px', height: '518px'"] (I tried several different ways to change the width/height because I wasn’t sure if it needed the px or the ”) Josh December 22, 2010 at 10:38 pm You don’t need single quotes with numbers, or px. Format them like this example. For that white gap under the slideshow you are trying to resize, that is a bug in version 1.3.1 with resizing slideshows. Try using Meteor Slides 1.3.2 instead. Dennis January 11, 2011 at 11:40 am Your plug in is great in terms of ease of you! Thank you for making our website development effort way less complicated. Where can I find the options list for the metadata? Josh January 11, 2011 at 1:09 pm No problem Dennis, thanks for trying my plugin! You can find the full list of options on the jQuery Cycle website. mark shirley January 19, 2011 at 7:19 pm Hi Josh I looked at your overview but that skips over multiple slideshows and the terminology in the documentation is confusing if your not familiar with the plugin I have tried for a couple of hours to figure it out. In the end I plucked for radslide simply because it was easy to understand how to achieve this. Perhaps you need to do a tutorial on multiple slideshows as a lot of “simpletons” like me will just not use it…best of luck Josh January 20, 2011 at 7:19 pm Yeah, some screencasts about the advanced features such as multiple slideshows are long overdue but I should be adding more soon! Joy May 7, 2012 at 10:12 pm I created a slideshow and the navigation is working but the images aren’t appearing. They appeared earlier with a slideshow I deleted. I disabled every plugin in the event their was a conflict to no avail. Josh May 8, 2012 at 5:20 pm Hi Joy, I’m seeing a slideshow on that page, did you get this figured out? Rex May 28, 2012 at 7:53 am Good Day sir Josh Ive been trying create thumbnails for meteor slider based on your detailed instructions through: http://wordpress.org/support/topic/plugin-meteor-slides-feature-request-replace-paging-with-smaller-thumbnails but i cant and i don’t get it. may i ask for more details for this sir? 🙂 thanks sir.. Josh May 28, 2012 at 10:06 am Hi Rex, did you take a look at customizing the slideshow script? Adding thumbnail navigation is going to be just like the second example on building custom paged navigation with slide titles, but instead of loading the titles, you’ll load the thumbnails. To actually add the thumbnails, I would create another featured image size that matches what you want for the thumb nav in your theme’s functions.php file. And then load that size as a featured image just like the slideshow uses the larger slide featured image. Zuri July 24, 2012 at 12:41 pm Hi Josh, Fantastic plugin! I’m having the same issue with trying to create thumbnails for the navigation. I’ve tried to follow your instructions in the past threads and I’ve also checked out customizing the slideshow script. Unfortunately, I know very little jQuery and am struggling to figure this out. Any help you could give would be greatly appreciated. Cheers, Zuri Josh August 12, 2012 at 12:48 am Sorry Zuri, I don’t have any better documentation on this to point you at right now, but writing this up is definitely on my to do list! Jennifer January 24, 2013 at 1:22 pm I’m also trying to add thumbnails per your example and I can get the image tag to show up exactly as needed, except it just says the src is “undefined” and I haven’t a clue how to solve that. Josh January 25, 2013 at 1:08 am Hi Jennifer, could you post a link to the site you’re working on? Emil Uzelac September 14, 2012 at 7:55 pm Hey Josh, Just want to say thanks for the great plugin. It’s highly recommended to all members of my forum, as well as clients. Not only because Meteor is easy for them, but also Responsive and that’s the priority for my Theme 🙂 Keep up the great work bud! Thanks, Emil Josh September 16, 2012 at 3:54 pm Thanks Emil, I appreciate your recommendation, Responsive is an awesome theme! Vaibhav February 4, 2013 at 2:52 am Hi, I want to create 4 slide shows in header. I have copy pasted code 4 times in header.php file it is now showing same slide show 4 times. But how to add 4 different slideshows side by side in header, any idea. Josh February 4, 2013 at 10:05 am Did you get it figured out? It looks like each one is specifying a different slideshow. Vaibhav February 4, 2013 at 12:54 pm Yes, it is solved. Now if you look at all 4 slideshows there seems a bit mismatch in the timing of the slideshow. It will look better if the slide can rotate in particular order. 1,2,3,4 or 4,3,2,1 or may be 1&3 change then 2&4 will change. If you can give some idea for giving timing to each slideshow would appreciate. Josh February 4, 2013 at 1:03 pm You can use metadata to change the speed of each slideshow if you want them to be staggered. Vaibhav February 5, 2013 at 1:32 am Not sure how to add timing in code if i have 4 slideshows with name left, middle, right,extreme-right then how you edit the code for timing. My Previous code is Can you please provide the metacode for the above 4 slides. Josh February 5, 2013 at 10:55 am It depends on how you want the slideshows to cycle. For example, if you want the first and the third slideshows to cycle every 6 seconds, and then the second and fourth slideshows to cycle every 12 seconds, you could set the default option to 6 seconds, and in the metadata for the other two slideshows, change the duration to 12: [meteor_slideshow metadata="timeout: 12000"] Vaibhav February 5, 2013 at 11:20 am I tried but its giving me syntax error below is my 2 slideshow code . . .can you please add metadata for timing any random time i just want correct syntax then i will edit it as per my requirement. . thanks for your time & help. Josh February 5, 2013 at 11:22 am That should be right, but I can’t see your error, it didn’t come through on the comment. Vaibhav February 5, 2013 at 11:21 am I want code meta data code for template. Josh February 5, 2013 at 11:24 am It’s the same, it just has a different format: Vaibhav February 5, 2013 at 11:35 am Excellent just love this plugin. Its just working as i wanted. I have 4 slideshows working awesome. . . . highly recommended . .. . thanks a ton!! Josh February 5, 2013 at 11:38 am No problem! Dianne May 18, 2017 at 10:10 pm Dear Josh, Could you please help me out, I really can’t find any answer on the net yet. I want to put two different slideshows on one page and it is just not working. Either only one slideshow comes or I get two in one. Josh Leuze May 19, 2017 at 12:49 am Hi Dianne, did you look at the documentation on adding multiple slideshows?http://jleuze.com/plugins/meteor-slides/multiple-slideshows/ I can take a look if you want to send me a link to the page you’re working on. Pesky Squid February 15, 2013 at 2:45 pm Hi Josh, Your plug-in is awesome. I have started learning to build a site in WP since last week. Many things are in the eco-system is new to me. I can get the slideshow to play on the front page by inserting this line into header.php. However, I intend to create a unique slideshow for each post. How can I achieve that? Currently every post has the same slideshow as the front page. Sorry if this question had already been asked and answered previously. Thanks in advance! Pesky Squid Pesky Squid February 15, 2013 at 2:51 pm The code did not show up. Let me try again. Josh February 15, 2013 at 3:28 pm The code didn’t come through, but how exactly do you want it to work, you want the slideshow to stay in the header on each page, but load a different slideshow on each page, is that right? Pesky Squid February 15, 2013 at 3:50 pm Yes. That’s what I want to do. Different slideshows on different posts and another one on the front page. I learned from another thread that someone suggested using the is_page() to determine what slideshow to display. However, it is not working for me. I’m trying blockquote because I failed twice trying to embed php code. Must be a rookie mistake. Thanks again! Pesky Squid Josh February 15, 2013 at 4:03 pm That works for checking the slug of a Page, but not a Post. Try using this instead: Pesky Squid February 15, 2013 at 4:16 pm Wonderful. It does exactly what I want. Thank you very much! Josh February 15, 2013 at 4:21 pm No problem! Anne February 15, 2013 at 3:28 pm Hi, This is a great plugin! Very clean and easily customizable. Has anyone had trouble having multiple slideshows on one page WITH thumbnails? I have successfully implemented thumbnails in my slideshows but the thumbs of the second slideshow don’t work. Thanks in advance! Josh February 15, 2013 at 3:34 pm Hi Anne, I haven’t run into this issue, but I haven’t tried to use multiple slideshows with thumbnails. I have run into the same problem with using multiple slideshows with titles for navigation. Take a look at how the title loop and the script are setup in that example in the documentation on custom slideshow scripts, that might give you some insight. Anne February 15, 2013 at 4:41 pm It’s great how supportive you are of users! I feel like the solution is right there and I can’t see it! It’s terribly frustrating. I feel like it has to do with the meteor count. On the second slideshow, the meteor count starts at 1 again, so there are duplicate mslide-1 and mslide-2, etc. The first set of thumbs controls both slideshows.. … any ideas on how to get the meteor count to NOT reset after a slideshow? I tried removing this: But that didn’t really work. Any further insight you might be able to share is much appreciated! Thanks again! Anne February 15, 2013 at 4:41 pm Hmm.. the code tag is not working. Josh February 15, 2013 at 5:00 pm Can you post a link to the site you’re working on? Bob November 1, 2017 at 10:47 pm is there a shortcode for having different Slide Duration times for slides on the same page? Josh Leuze November 8, 2017 at 4:46 pm Yes, you can set the slide duration using custom metadata in the shortcode, like this: [meteor_slideshow metadata="timeout: '4000'"] Comments are closed.'''
