["http://www.jleuze.com/adding-multiple-slideshows-with-different-sizes"]
title = "Adding multiple slideshows with different sizes | Josh Leuze"
description = """
Meteor Slides users often ask how to create multiple slideshows with different sizes.

Here is a tutorial which will show you how to do this using multiple slideshows and metadata."""
full_description = '''October 27, 2011 / Josh Leuze / 340 Comments Meteor Slides users often ask how to create multiple slideshows with different sizes. Here is a tutorial which will show you how to do this using multiple slideshows and metadata. Let’s say you need two slideshows on your site. The larger slideshow, Jupiter, is 500×200 and the smaller slideshow, Mercury, is 300×150. The height and width options on the slides settings page determine two things, the dimensions of the slideshow itself, and the maximum dimensions of the individual slides. Smaller slides can be used, but any slides that are larger than these dimensions will be cropped, so the height and width in the slides settings should match the largest slideshow on your site. Start with the largest slideshow Start by setting up the largest slideshow in the standard way. In the slides settings, set the Slide Height to “200” and the Slide Width to “500”. Then create a slideshow called “Jupiter”, make your slides with images that are 500×200, and add them to the Jupiter slideshow. Here is an example shortcode to load the largest slideshow with the name Jupiter: [meteor_slideshow slideshow="jupiter"] Note that you don’t need to use metadata to set the dimensions of the largest slideshow because it should match the dimensions on the settings page. Then setup the smaller slideshow Now for the smaller slideshow, create a slideshow called “Mercury”. Make the slides for this slideshow with images that are 300×150 and add them to the Mercury slideshow. Because you have used smaller slide images which were prepped to fit 300×150, all you need to do is override the default slideshow height and width using metadata to shrink this specific slideshow to the proper dimensions. Here is an example shortcode to load the smaller slideshow with the name Mercury: [meteor_slideshow slideshow="mercury" metadata="height: 150, width: 300"] When using metadata, only values which are strings should use single quotes, other types, such as the integers in the above example, should be used without single quotes. Styling specific slideshows with CSS By default the slideshows will be full width block level elements. Maybe you would like to wrap some text around the smaller slideshow though. When you specify a slideshow, a unique ID is created for it based on the slideshow’s slug. So the Mercury slideshow ID would be “meteor-slideshowmercury”. With this ID you can target just that slideshow with certain CSS rules: #meteor-slideshowmercury { float: left; margin: 0 20px 20px 0; } Keep it simple But don't forget, less is more! A slideshow is a great way to get a visitor's attention, but when you add multiple slideshows or other animated elements to the same page you are dividing the user's attention and diluting that page's potential. So try to keep it simple by spreading these elements out to different pages to reduce the clutter and increase the quality of your website. Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, Tutorials Tags: custom taxonomies, slideshow Previous Post: Using the Members plugin with Meteor Slides Next Post: I’ll be at WordCamp Omaha this week Join the conversation! 340 Comments Dirk April 9, 2013 at 4:25 am Hi Josh, just found your plugin and it works great for me! Thanks for you work. There are is something I mentioned playing around with it and I wanted to ask if this is the right behavior. I scaled the slideshow to 800×500. Added 2 slide with an image 800×500 Added 1 slide with an image 800×300 When I look at the page the box is shrank to 300 in height. If I delete the small image the box is ok. So I guess all images have to be in the correct size and not too small!? Another question if you don’t mind. Is it possible to add the navigation via keyboard (pressing left and/or right) Thanks and keep it up! Josh April 9, 2013 at 11:55 am Hi Dirk, it does work best if the slide images are all the same size. You can use images with different sizes, but the slideshow will scale to the size of the first image, so you would want the largest image first. There are examples online that show how to add keyboard navigation to jQuery Cycle, you could use a custom slideshow script to do this. Dirk April 11, 2013 at 4:52 am Thanks a lot for quick answer Josh ! Keit Oliveira May 3, 2013 at 7:54 pm Hello, I tried use: but the Slideshow doesn’t appears. What could be causing this? Help me, thanks. Josh May 4, 2013 at 12:22 am Hi Keit, can you post a link? Arturo May 22, 2013 at 11:22 am Hey Josh, first, thanks for your plugin, works amazingly!! One question, while i’m creating a different slideshow with custom size, when I try to hover or click the arrows everything goes down like if there’s something above the images, please take a look here: http://goo.gl/qyihN Again, thanks so much! Josh May 23, 2013 at 10:52 am Hi Arturo, the slideshow is working good for me. Did you get it fixed, or is this only happening in a certain browser? Daniel May 30, 2013 at 1:59 am Hi, I have a problem. When I write the code belowe I can see the images in the slideshow, but the slideshow’s container takes the height of the principal slideshow. Can someone help me? Thanks a lo. Josh May 30, 2013 at 12:22 pm Hey Daniel, the code you posted isn’t coming through in the comments. Can you create new post in the support forums with that code and a link to the site you’re working on? Chris Mayer June 5, 2013 at 11:26 am Hi Josh, I have uploaded an image that is 1400×400 and my slideshow is set to 1400 and 400 respectively in the Slides Settings menu. I’m using the responsive two thousand twelve theme default in wordpress 3.5.1, my width is scaled to 960 just fine, but the height is cropping at 137px. Any help would be greatly appreciated. Site is: Excited Designs Cheers, Chris Josh June 5, 2013 at 2:14 pm Hi Chris, the slides look good on my end, did you get it figured out? Chris June 5, 2013 at 4:50 pm Yeah. But when I tried replying to my own comment, the form here lagged out and chrome seized up, so I just left it. I had to delete the old image entirely, and then upload it again. Thanks! Chris Josh June 5, 2013 at 4:51 pm Cool, that’s good to hear! Chris A July 3, 2013 at 12:17 pm Hello Josh, I hav inserted the following code: to my page-fullwidth.php file. I have 3 slides, if i have only one slide it show the image. How ever if i have more then 1 the slider just loads blank and no images are displayed. Josh July 3, 2013 at 12:35 pm Sorry, if you need to share some code you’ll have to post it in the support forums. Can you send me a link to the page with 2 or more slideshows on it that aren’t working? Chris A July 3, 2013 at 1:13 pm i am working on it locally so i cant give you a sample, i am using the cherry framework with a child theme, would this cause any complications Josh July 5, 2013 at 2:17 pm That’s tough to troubleshoot. Sounds to me like there are some JavaScript errors. If there is one slide it will just load it as a static image, if there are multiple slides it uses jQuery, so if JS ir broken it won’t work with multiple slides. I would try inspecting WordPress with Firebug or another tool and see if you can find some errors. You can also try deactivating your other plugins to test for conflicts. Lokesh July 15, 2013 at 11:28 pm I have trouble making multiple slide show in a single page.Like if i have to insert multiple slide shows in a single web page without writing code again and again.What should i do? Josh July 16, 2013 at 8:28 am Can you post a link to the page you’re having this problem on? Lokesh July 16, 2013 at 10:39 am I do not have that website online yet.but i have mailed you the coding. Thank you. Josh July 16, 2013 at 4:33 pm Is that PHP file you sent me part of a WordPress theme? I don’t see the required WordPress functions or the slideshow template tag. Shell July 20, 2013 at 4:44 pm Hi Josh! I am so frustrated! Is there a way I can adapt this plugin to create an image slideshow like the one on this site: http://www.mavericksouthernkitchens.com/highcotton/charleston/ . If not, how should I go about creating this…thank you!!!! Josh July 22, 2013 at 9:42 am That’s pretty custom, you wouldn’t be able to do that with Meteor Slides. Slideshows are really meant to show one slide at a time, in that example it is sort of working like a slideshow, but it displays multiple slides at once, so it is really a carousel. That site uses the Infinite Carousel jQuery script, which I don’t think is being actively developed anymore, you could try starting with Cycle 2. Shell July 24, 2013 at 10:38 pm Thanks for your help Josh! Jason July 22, 2013 at 5:27 pm Hi Josh, I’m at a loss… I’ve deleted the plugin, slides, slideshows and re-added everything but still get nowhere.. The sub pages (sell) seem to cut off the slide. It appears that the slider is only using cropped images even though I’ve adjusted the “settings” to account for the largest x and y axis for my 2 shows… There is a chance that the other guy working on the site (real estate MLS data) has screwed with something, but I can’t find it. Mostly want to be sure that I have your settings correct on my end… Josh July 22, 2013 at 6:19 pm Did you re-upload the slide images after setting the current slideshow dimensions? Jason July 22, 2013 at 6:43 pm I did… even renamed my sliders so there wouldn’t be any mess in the back end… [meteor_slideshow slideshow="inner1" metadata="height: 310, width: 970"] This is my slider shortcode. Honestly this just doesn’t make any sense… I have a feeling there’s something in there that the other guy has screwed up… Your sliders (both!) worked perfectly before he screwed up the database and broke my entire header. (yes, it’s already been a long week!) 🙂 don’t waste your time on this… I’ll work on this end. Thanks for your help. Awesome slider!!! Jason July 22, 2013 at 7:34 pm for what it’s worth, I added a different slider plugin and it works fine. I’m terrified to know what he’s done to my client’s database! 🙂 thanks again for your help! Josh July 23, 2013 at 9:49 am Good to hear you got something figured out Jason. Lokesh July 26, 2013 at 12:28 pm Hey josh. This is lokesh again.I have solved my problem regarding slide show but now i am facing a new and very irritating problem. Actually i am using two style sheets in a single web page but when i change one…Other changes automatically. Like first is Hori.css for Main menu and other one is for vertical menu named as vertical.css but when i made changes to vertical.css the main menu automatically change.I am sending you the codes in text file. on your email id. thank you. Josh July 26, 2013 at 12:38 pm Is the site you’re working still offline? if you could get it online it’d be a lot easier for me to debug. Lokesh July 26, 2013 at 12:40 pm Yeah its offline. How can get a site online when i am still working on its home page 😛 ? Josh July 26, 2013 at 12:45 pm The same as you would put a site online when you’re ready to launch it, but usually you put it on a subdomain or a subdirectory and “discourage search engines from indexing this site” so that it is private until you’re ready to launch it. Lokesh July 26, 2013 at 12:58 pm I am just practicing for now my friend.I do not know how much time i will take to finish this website.So please tell me. Josh July 26, 2013 at 1:03 pm Do you use Firebug or another inspector? They’re a big help if figuring out CSS issues. This is the best resource on moving WordPress. Lokesh July 26, 2013 at 1:09 pm I think i i wont need them because i just wanna know if i can use two css style sheets in a single HTML web page?If yes,Then how? Josh July 26, 2013 at 1:14 pm Oh, I thought you were having conflicts between those two CSS files. You can add as many stylesheets as you want to, though the less files you load the better. You want to enqueue the stylesheets in your theme via the functions.php file, like this: http://codex.wordpress.org/Function_Reference/wp_enqueue_style#Loading_stylesheets_in_WordPress_themes novice August 9, 2013 at 12:45 am I have set the default slide size to 940wX400h and have a slideshow on home page. I need another slideshow in contact page in the right column with 300w X 500h. The slides images are of various sizes. I set the shortcode for the contact page: [meteor_slideshow slideshow="yyyy" metadata="height: 500, width: 300"] It looks horrible. How should I set the shortcode? Josh August 9, 2013 at 11:06 am Can you post a link? Pramathesh August 16, 2013 at 9:30 am First, thanks a lot for this plugin. It is very useful and very simple to use. I am working on a site (which is on localhost so I can’t send a link yet). The site uses two slideshows on two different pages: 1. The first one has a width of 840 px and height of 280 px 2. the other has a width of 450 px and a height of 627 px The second slideshow has its height set to 280 px. Following some of the comments on this page, I have tried setting the width and the height in the settings page to 840 and 627 respectively. Then using metadata I have set the slideshows to the settings I want like this: [meteor_slideshow slideshow="first" metadata="width: 840, height: 280"] and [meteor_slideshow slideshow="impacts" metadata="height: 627, width: 450"] The height of the second one gets trimmed to 280. Why is this happening? I am using weaver ii pro theme. Grateful for help and thanks in advance Josh August 16, 2013 at 12:29 pm If the slide height on the settings page is 627 and the width is 840 any slide images smaller than that shouldn’t be cropped, did you upload the slide images after setting the current slideshow sizes? Try re-uploading the images. Pramathesh August 18, 2013 at 2:15 am Thanks for your very prompt reply. I did as you said and it worked! Rated five stars on wordpress. Thanks once again Josh August 18, 2013 at 9:37 am Thanks for taking the time to write a review and rate my plugin Pramathesh! James October 18, 2013 at 10:05 am Hello Josh. After installing Meteor Slideshow… 1. I changed the slide show quantity to 3, height & width to 150, transition style to scrollleft, and slideshow navigation to both. 2. Then I created a slideshow title “Test Example” and slug “testexample”. Then I used inkscape to create 3 images 150×150 with a .png extension and I created new slides uploading the images into the slides and selecting the slideshow “Test Example” for each slide. In my page I use [meteor_slideshow slideshow="testexample"]. When I open the page the images are not visible but if I mouse over where the slideshow is suppose to be the navigation button are visible. Here is a line to the page where the slideshow is located. http://moviewz.com/a-development-test-4-slider/ I would like to get this slideshow working if possible because it has the features I like to use on my website. Why are the pictures not showing up in the slideshow? All '''
