title = "Speaking at WordCamp Minneapolis 2013 | Josh Leuze"
description = "I’m speaking at WordCamp Minneapolis next month, my session is called Inspecting WordPress. I’ll be talking about using Firebug or other web inspectors to dig into a site and learn how …"
full_description = "March 30, 2013 / Josh Leuze / No Comments I’m speaking at WordCamp Minneapolis next month, my session is called Inspecting WordPress. I’ll be talking about using Firebug or other web inspectors to dig into a site and learn how it is put together, make CSS tweaks, fix bugs, and optimize a site. Several of us from the local MSP WordPress user group have been busy organizing the WordCamp. Everyone’s been doing an awesome job, the schedule, venues, parties, and swag are all coming along nicely. I built the theme, designed by the talented guys at WerkPress, and I’ve been managing the site. We just posted the speakers and sessions, there’s going to be a lot of brainpower to tap into. WordCamp Season This will be the start of a busy WordCamp season for me. I remember five years ago wondering if there would ever be any WordCamps in the Midwest. Then in 2009 I went to Chicago for their first WordCamp, and we had our first WordCamp in Minnesota the next year. Now in 2013 I’m wondering if I will be able to attend all the WordCamps in my area! After WordCamp Minneapolis I’ll be taking a break for a month, and then in June I’ll be heading to WordCamp Winnipeg, WordCamp Milwaukee, and WordCamp Chicago. I’m really looking forward to all three of these. Even though I was raised on CBC over a pair of rabbit ears and it’s only 300 miles away, I’ve never been to Canada, so I need to fix that. Last year I missed out on the nearest WordCamp next door in Wisconsin because I was speaking at WordCamp NYC. I try making it to Chicago every year, to me it’s the Midwest’s WordCamp San Francisco and I like to think it’s just as awesome! After all that I’m taking July off and doing some proper camping, with tents. Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: WordPress Tags: event, msp wordpress, wordcamp Previous Post: Five stars for Meteor Slides Next Post: Inspecting WordPress With Firebug"
