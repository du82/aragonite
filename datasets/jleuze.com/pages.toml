full_description = "Speaking at WordCamp Minneapolis / St. Paul 2018 August 24, 2018 / Josh Leuze / No Comments This year I will be talking about Building Better Themes at WordCamp MSP. I will be in the Swain room first thing Friday morning talking all about themes. You can check out the slides for my talk, or the starter theme Regolith on Github. I’m looking forward to spending some time in the Happiness Bar as well, if you see me stop by and say hi! Speaking at WordCamp Minneapolis 2016 May 20, 2016 / Josh Leuze / No Comments We’ve been busy organizing WordCamp Minneapolis and this is the big weekend! I’m speaking about Classy Theming & Getting Granular on Foundation Friday in the Intro to Design track. Read More Building Better Themes July 25, 2015 / Josh Leuze / No Comments At WordCamp Milwaukee 2015 I talked about building better themes. We talked about theme design, theme development standards, coding best practices, Retina and responsive styling, and theme optimization. Check out my slides, or the starter theme, Regolith, on GitHub. Speaking at WordCamp Milwaukee 2015 July 24, 2015 / Josh Leuze / No Comments This weekend I’ll be at WordCamp Milwaukee, last year in Milwaukee I talked about building better widgets and this year I’m talking about building better themes! This is my only WordCamp this summer, they seem to be spreading out throughout the year now, which is good. So my goal for the year is one each season, Minneapolis in the spring, Milwaukee this summer, Chicago in the fall, and Philadelphia this winter for the first ever WordCamp US! Building Your First Functionality Plugin April 25, 2015 / Josh Leuze / No Comments I gave a talk at WordCamp Minneapolis 2015 about building functionality plugins. We talked about the difference between themes and plugins, and what should go in each. I covered getting setup for writing a plugin, best practices for WordPress development, and gave some real world examples of plugin functionality. Read More"
