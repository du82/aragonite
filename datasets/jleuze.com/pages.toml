title = "Building Your First Widget | Josh Leuze"
description = "I spoke today at WordCamp Chicago, talking about building widgets. In my session we learned how to build your first WordPress widget and went step-by-step through the best practices for building a …"
full_description = "June 15, 2014 / Josh Leuze / 1 Comment I spoke today at WordCamp Chicago, talking about building widgets. In my session we learned how to build your first WordPress widget and went step-by-step through the best practices for building a simple widget. We discussed when a widget should be built into a theme or plugin, and when a widget should be its own plugin. You can check out the slides if you’d like to. The plugin that I used as an example is a simple plugin that allows you to add your name to a sidebar. The example code is up on Github for themes and plugins. Hopefully everyone who attended is ready to avenge their fathers, or unleash their own widgets out into the world! Update: Here is a video of my talk from WordCamp Chicago 2014: Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Videos, WordPress Tags: presentation, theme, wordcamp Previous Post: Speaking at WordCamp Minneapolis 2014 Next Post: Building Better Widgets Join the conversation! 1 Comment The Bean, the Blues and a ton of WordPress info at WordCamp Chicago 2014 | InMotion Hosting News June 23, 2014 at 5:23 pm […] morning with breakfast in hand Josh Leuze (@jleuze) started off the day with a talk on “Building Your First Widget“. It was great presentation on how to get some simple widget interactivity into WordPress in […] Comments are closed."
