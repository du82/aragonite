full_description = "Meteor Slides includes localization support so that it can be translated into any language. There are currently twenty-six translations available. If WordPress is setup in one of these languages, Meteor Slides will also use that language. Translations Belarusian: Translation by Alexander Ovsov Bulgarian: Translation by Georgi Parvanov Chinese (Simplified): Translation by Yu Haoran Chinese (Traditional): Translation by Danny Czech: Translation by Ondřej Carda Danish: Translation by Kim Hansen and Rune Rønde Møller Dutch: Translation by Leon Buitendam French: Translation by Florent Quiquandon and Thierry Michalowski German: Translation by Maximilian Brandl Greek: Translation by Margarit Koka Hebrew: Translation by Ariel Klikstein and Ahrale Indonesian: Translation by gustulank Italian: Translation by Giovanpietro Avveduto Japanese:Translation by COCOM Norwegian:Translation by Andreas Lutro Persian: Translation by Peyman Asadi Polish: Translation by Marcin Pronobis Portuguese: Translation by Hugo Baeta Portuguese (Brazilian): Translation by Raoni Del Pérsio Romanian: Translation by Eugen Paun Russian: Translation by Boris Homiakov Serbo-Croatian: Translation by Andrijana Nikolic Spanish: Translation by Alexis Swedish: Translation by Simon Wämmerfors and Christian Arwin Turkish: Translation by ercani Vietnamese: Translation by Duy Duong Meteor Slides in your language? If you would like to volunteer to translate Meteor Slides into your language it would be a big help! You can download the PO file from the plugin repo. Please email me your translation or submit your pull request on GitHub."
