title = "members | Josh Leuze"
full_description = "Small Meteor Slides update for Members plugin June 17, 2016 / Josh Leuze / No Comments I have one more small update for Meteor Slides, version 1.5.6, which includes updated support and functionality for the latest version of the Members plugin. Read More Using the Members plugin with Meteor Slides September 23, 2011 / Josh Leuze / 15 Comments One of the new features in Meteor Slide 1.4 that needs covering in more detail is support for the Members plugin. Using Members, you can control which roles can create and edit slides and slideshows, and which can change the slides settings. By default slide posts use the same capabilities as blog posts and only admins can change the slide settings. So admins, editors, and authors can create new slides, and contributors can create slide post drafts. This is straightforward, but not exactly ideal. Most of the time I only want the admin and editor to create and edit slides. And what if you want to give an editor access to the settings? This is where Members comes in handy. Read More"
