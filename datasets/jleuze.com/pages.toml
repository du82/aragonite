["https://jleuze.com/a-few-meteor-slides-updates"]
title = "A few Meteor Slides updates | Josh Leuze"
description = """
I just released Meteor Slides 1.3.1, which fixes thumbnail registration conflicts, transparent images issues, and navigation for multiple slideshows.

There have been few projects where I have need…"""
full_description = "December 14, 2010 / Josh Leuze / 32 Comments I just released Meteor Slides 1.3.1, which fixes thumbnail registration conflicts, transparent images issues, and navigation for multiple slideshows. There have been a few projects where I have needed to customize the template for the slideshow, so this version adds support for a custom slideshow template. I added some documentation for using a custom template which shows how to add titles or captions to the slides, and there is also now a page in the documentation on custom stylesheets. Be on the lookout for more Meteor Slides screencasts and documentation in the near future! Meteor Slides 1.3.1 Fixed post thumbnail registration conflicts. Added support for custom slideshow loop. Fixed navigation for multiple slideshows. Improved support for transparent images. Fixed slideshow layout issues. Updated French translation by Thierry Michalowski Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides Tags: bugs, custom post type, slideshow Previous Post: Creating your own Page Templates Next Post: Help test Meteor Slides 1.3.2 Join the conversation! 32 Comments Norm Gregory December 15, 2010 at 12:43 am Anything special I should do in upgrading? Josh December 15, 2010 at 9:23 am Hi Norm, no unless you are using a custom stylesheet you shouldn’t need to do anything special. Norm Gregory December 15, 2010 at 2:52 pm Auto-updated via WordPress . . . smooth and easy. Thank Josh. Josh December 15, 2010 at 6:36 pm No problem Norm! Stacy December 15, 2010 at 10:53 am Hi Josh! I downloaded the plugin last night and for some reason it will not transition through the pictures plus if I choose more than one slide, it stacks them “not literally” it’s more like, one picture than under it another etc… Not sure what I am doing wrong. I watched the setup videos and did everything that you showed to the T. Hmmm. My main site http://www.croy.scentsy.us has the same slide that you have created and I would love to have it on my blog site as well. I would appreciate any help. Thanks! Josh December 15, 2010 at 11:04 am I don’t see a slideshow on your site, but it looks like the JavaScript files for the plugin are missing. Try deleting Meteor Slides and reinstalling it. Stacy December 15, 2010 at 11:08 am http://www.joinbuyhost.com/products-2/ There is where it’s at. Stacy December 15, 2010 at 2:55 pm All is in working order! Thanks Josh! Subscribing to future posts..cannot wait to see what you have in store for future apps! Josh December 15, 2010 at 6:37 pm Good to hear Stacy, thanks for subscribing! Carole Hickman December 24, 2010 at 6:39 am Hi Josh! I downloaded the plugin last night and for some reason it will not transition through the pictures plus if I choose more than one slide, it stacks them “not literally” it’s more like, one picture than under it another etc… Not sure what I am doing wrong. I watched the setup videos and did everything that you showed to the T. Hmmm. My main site has the same slide that you have created and I would love to have it on my blog site as well. I would appreciate any help. Thanks! Josh December 24, 2010 at 11:08 am Hi Carol, can you post a link to the page you are having this problem on? Norm Gregory December 28, 2010 at 9:17 pm Josh . . The wrong sized photos are being used in my latest slide show. As usual a video is worth a thousand typed words. http://www.screencast-o-matic.com/watch/c6lUnjXgF (I also posted this over at the wordpress support forum) Josh December 28, 2010 at 10:34 pm I’ll check it out Norm. Alison January 9, 2011 at 7:47 am Hi Josh, I have used your slider for a website http://www.theoldstarbristol.co.uk, but the slider does not seem to fade correctly. Please could you help? Thank you Alison Josh January 9, 2011 at 10:36 am Hi Alison, the fade looks alright to me in Firefox and IE8. Is the problem with a certain browser? Is the transition completely broken, or does it just have some flaws? Elise January 11, 2011 at 9:13 pm John, I’m so impressed by Meteor Slides. Thank you so much! It’s going to solve a lot of problems for me. I’ve installed it onto a site where the client wants multiple slideshows and I’ve already customized it. It works beautifully and the process to create slideshows is very well thought out. I’ll post up when the site is launched. Thanks again! Josh January 11, 2011 at 9:38 pm You’re welcome Elisa, glad to hear that my plugin has been helpful! Rayan January 21, 2011 at 5:03 pm Hi there! So I downloaded your plugin, it’s working fabulously but…I am very much a beginner and can’t seem to figure out how to do any other styling to the css other than a border, and have it show up. Specifically I was trying to add padding between the images and the border itself and I can’t seem to get it to work properly. I’m also unsure of how to add a drop shadow to bottom and right side as well as the transparent png across the slide behind the title??? I am sure this is very obvious to most (sorry) but I am a beginner and would LOVE a tad bit of help, pretty please!! Also you mentioned on another page that to modify using CSS we would need to upload the png files and add the url’s back into the css, but I’m not sure where to find the png files to upload?? heeellllp! Josh January 21, 2011 at 7:44 pm Hi Rayan, thanks for trying my plugin. If you are having trouble getting your CSS to apply to the slideshow, the slideshow’s stylesheet might be overriding it, you can use a custom stylesheet to avoid that issue. You only need to copy the images if you are using navigation, these images are located in “meteor-slides/images”. You might run into sizing issues trying to add padding to the slideshow itself, I would try adding the border and padding to the feature_box div you have wrapped around it. CSS Tricks has a good post showing how to add dropshadows with CSS. And here is some info on adding a background image. rayan January 21, 2011 at 8:16 pm Awesome! Yep I’m sure that is precisely what the issues are! I will give These a try in a bit! Thank u soooo much for your help! Ron Childress February 6, 2011 at 9:54 pm Hello. I am trying to use just one of my slide shows. I have more than one. When I put the slug for that show in the field in your widget, nothing shows up. However, if I leave it blank, every slide shows up, which won’t work. Can you help me? I’m using firefox, don’t know if that matters. Ron Josh February 6, 2011 at 10:02 pm Hi Ron, are you sure you are using the slug, not the slideshow name? Is there anything strange about the slug, special characters or anything? Josh February 6, 2011 at 10:09 pm Nevermind, I think the problem is that your theme is also loading the same jQuery Cycle plugin as Meteor Slides uses. This will cause some conflicts, I would try to run all your slideshows through the theme or the plugin rather than using both. Tim February 27, 2011 at 3:49 pm Is there a way to upload multiple images at once and/or create multiple slides simultaneously? Josh February 27, 2011 at 10:01 pm Hi Tim, you can upload as many slide images at once as you want using the media uploader, but each slide is a separate post and has to be created individually. Stacy February 28, 2011 at 12:10 am Still not working Josh…Have tried everything…Uninstalling plugins etc.. ba March 11, 2011 at 1:33 pm see the nav but not the slides??? Josh March 11, 2011 at 8:03 pm It looks like you have two copies of the slideshow on that page, but they are different, did you edit any of the files? Tina April 6, 2011 at 9:08 pm Hi Josh, I love your plug-in but I am having a bit of an issue. The one in my header works fine except when I created a new slideshow to put a photo in my footer, the photo shows in the header one too. I have checked the “check” box only for the one slideshow for that photo. Any ideas as to how to get it not to show on the main slideshow? Thanks! Josh April 6, 2011 at 9:49 pm Hi Tina, if you are using multiple slideshows, each one needs to specify a slideshow or it will load slides from any slideshow. Tina April 7, 2011 at 5:18 am Thanks Josh! It was a simple mistake, I needed to put the slug in the slideshow field and not the title in that field. Love the plug-in and plan to use it more places in my site! Josh April 7, 2011 at 9:03 am Awesome, thanks for trying Meteor Slides! Comments are closed."
