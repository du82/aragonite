title = "Josh Leuze | Josh Leuze | Page 5"
description = "I'm a WordPress developer from Minnesota. Aside from WordPress; I'm also into biking, art, and sci-fi."
full_description = "Speaking at WordUp Minneapolis 2012 next week October 5, 2012 / Josh Leuze / 2 Comments Next weekend, on October 13, the MSP WordPress User Group will be having its first WordUp Minneapolis conference. The event is from 9am to 4pm at the Minneapolis Community & Technical College downtown and costs just ten dollars. The format for WordUp will basically be a mini-WordCamp. We had our first WordCamp Minneapolis in 2010 and WordUp 2012 will hopefully be a solid stepping stone towards our next WordCamp in early 2013! Read More WordCamp Chicago road trip August 21, 2012 / Josh Leuze / No Comments I’m going on a WordPress bender this weekend! First I’m headed to the Twin Cities for the MSP WordPress meetup. After that, Kiko Doran and I are road tripping down to Chicago for WordCamp Chicago 2012. This will be my third time attending WordCamp Chicago and it looks like it will be the best one yet. There are a lot of awesome speakers and sessions on the schedule, but I’m really interested in the interactive talks track, hopefully those will start some good conversations. WordCamp NYC session slides and code June 9, 2012 / Josh Leuze / 1 Comment Here are some notes from my session, jQuery The WordPress Way. You can view the presentation slides or download a child theme for Twenty Eleven with all the demo code. Also, check out the documentation on adding jQuery to WordPress and definitely read this great post on WPCandy about properly adding jQuery to a theme. Speaking at WordCamp NYC 2012 June 4, 2012 / Josh Leuze / No Comments I’m headed to New York this week with John Havlik for WordCamp NYC. My session is about using jQuery the WordPress way, I’ll be talking about some of the common jQuery problems I run into while supporting Meteor Slides. Create responsive slideshows with Meteor Slides 1.5 April 26, 2012 / Josh Leuze / 222 Comments Meteor Slides 1.5 adds responsive slideshow support, touch navigation, an improved slideshow widget, new translations, and updates jQuery Cycle. Responsive Slideshows I have been building more responsive websites lately and receiving more and more requests from users for responsive slideshows, so I have updated the slideshows to scale automatically. If you are using a fixed width theme the slideshows will remain unchanged at their original dimensions. But if you are using a fluid or responsive width theme those are used as the maximum dimensions and the slideshow will scale, shrinking to fit the theme on smaller screens and devices. Any custom slideshow templates, stylesheets, or scripts you are using would have to be updated from the default versions in 1.5 to add this responsive functionality. Try resizing the Meteor Slides homepage in your browser to see the responsive slideshow in action! Read More"
