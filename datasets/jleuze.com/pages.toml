title = "Meteor Slides | Josh Leuze | Page 5"
full_description = "Meteor Slides widget and stylesheet July 5, 2010 / Josh Leuze / 53 Comments Meteor Slides has been out for two weeks now and I haven’t heard about any more bugs, so I have started working on adding more features to the plugin. If you do run into a bug, please let me know. I was really surprised that almost 400 people watched the Meteor Slides screencast that I recorded, I hope that video makes things easier for some users. I will definitely be making some more screencasts related to theme development in the future. Meteor Slides 1.1 The latest version of Meteor Slides now includes a slideshow widget, an easy to customize stylesheet, and an update for the jQuery Cycle plugin that powers the slideshow. Read More Meteor Slides updates and screencast June 27, 2010 / Josh Leuze / 21 Comments It has been one week since I released Meteor Slides and I have been getting a lot of great feedback. Nearly 600 people have tried out Meteor Slides so far which is just awesome, thanks everybody! If anyone uses my plugin on a live site, be sure to leave a comment with a link, I’d love to see it in action. A couple of sharp-eyed users have spotted bugs in my plugin and were kind enough to report them. If you spot any more bugs, please let me know. Read More My first plugin, Meteor Slides June 16, 2010 / Josh Leuze / No Comments Meteor Slides makes it simple to manage a slideshow with WordPress by adding a custom post type for slides. There are many slideshow plugins to choose from, and I have a few good ones that I like to use. But each one seems to have some issues. Constructive Criticism The biggest issue is that some of them only have one transition. Personally, fade is the only transition I need. But when you have a slideshow all set up, and the client decides they want they want a diagonal wipe transition, you want options! Read More"
