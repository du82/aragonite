description = """
I added navigation to this version of Meteor Slides, it is an optional feature that is off by default and can be activated in the Meteor Slides Settings.

Meteor Slides is now also available in t…"""
full_description = "August 10, 2010 / Josh Leuze / 16 Comments One of my goals with Meteor Slides is to keep it very clean and minimalist, particularly on the front end. On my own site, I am using the plugin as a promo banner with just three slides, so adding navigation would be unnecessary. But some people have been using Meteor Slides to display a gallery of a dozen or more photos, and in this situation navigation would be helpful. So I added navigation to this version of Meteor Slides, it is an optional feature that is off by default and can be activated in the Meteor Slides Settings. You can see the navigation in action on my homepage. Meteor Slides Settings Meteor Slides is now also available in three more languages: Italian, Portuguese, and Spanish. This release of Meteor Slides is the first to have a sponsor. This version is sponsored by Raoni Del Pérsio, thanks so much for your support Raoni! Donations If you have found my Meteor Slides plugin or support to be helpful, consider buying me a cup of coffee to keep the code and answers flowing. Meteor Slides in your language? If you would like to volunteer to translate Meteor Slides into your language it would be a big help! You can download the PO file if you know how to use it, or grab the plain text file and I’ll take it from there. Please email your translation to: mail@jleuze.com Meteor Slides 1.2.2 Added navigation to the slideshow and added three more translations courtesy of Giovanpietro, Raoni, and Alexis, thanks for helping! Slideshow Navigation: Optional left/right navigation arrows to load the previous or next slide in the slideshow. Translations: Italian: Translation by Giovanpietro Avveduto Portuguese: Translation by Raoni Del Pérsio Spanish: Translation by Alexis Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: slideshow, translation Previous Post: Translations for Meteor Slides Next Post: Improved Meteor Slides navigation Join the conversation! 16 Comments Ivan August 12, 2010 at 5:30 am Hello Josh. May be I can help you with translate your plugin to Russian language. If you not against I can to try make it. Kind regards, Ivan Josh August 12, 2010 at 9:23 am That would be great Ivan! Danielle August 19, 2010 at 4:53 pm Hi Josh, Love the navigation – is there any way to have image number also? So, the previous and next arrows appear and when hovering over the image, the image number appears, like this – 1/10 Cheers, Danielle Josh August 19, 2010 at 10:03 pm No problem Danielle, glad you like the navigation. I am adding little dot buttons to the navigation soon that will highlight to show you which slide you are on in the show, will that work for you? Danielle August 19, 2010 at 10:07 pm Yes, I think so! Does this meteor slide allow you to have multiple slideshows on different pages with different images in each? Cheers Josh August 19, 2010 at 10:12 pm Right now it supports one slideshow, I am working on adding functionality for multiple slideshows, each with its own set of slides. Danielle August 19, 2010 at 10:39 pm Okay, great!! Do you have an estimation as to when you will be putting this into place? Josh August 19, 2010 at 10:46 pm The dots for the navigation will be release soon, possibly this weekend. The version with multiple slideshows might be closer to a month. Zanzavar September 17, 2010 at 3:10 am Great work Josh, the plugin works perfectly so far! One small question: Is it easy to show over the post image the post title or a small description field? any advice on how to achieve that? Thanks! Josh September 17, 2010 at 8:08 am No problem Zanzavar, glad it is working well for you! Meteor Slides doesn’t have a captions feature, you’d have to add text to the slides when you are prepping them in your image editor. Micaela September 22, 2012 at 1:25 am I’ve been exploring for a little bit for any high quality articles or weblog posts on this sort of space . Exploring in Yahoo I finally stumbled upon this site. Reading this info So i am satisfied to show that I’ve an incredibly good uncanny feeling I came upon exactly what I needed. I such a lot undoubtedly will make sure to don?t disregard this site and give it a look regularly. costa Blanca forum spain Arboleas September 22, 2012 at 2:10 am I think this is among the most vital information for me. And i am satisfied reading your article. However wanna remark on some normal things, The website style is great, the articles is in point of fact great : D. Just right task, cheers living spain forum San Pedro del Pinatar September 22, 2012 at 2:51 am Unquestionably believe that which you said. Your favorite reason appeared to be on the web the easiest thing to be aware of. I say to you, I certainly get irked while people think about worries that they plainly do not know about. You managed to hit the nail upon the top as well as defined out the whole thing without having side-effects , people could take a signal. Will likely be back to get more. Thanks flyinspain forum Costa Calida September 22, 2012 at 3:23 am Great article! We are linking to this particularly great content on our site. Keep up the great writing. azahar September 23, 2012 at 10:53 pm I have to thank you for the efforts you have put in penning this website. I really hope to view the same high-grade content from you in the future as well. In fact, your creative writing abilities has encouraged me to get my own website now 😉 pictures of dogs and cats May 24, 2014 at 4:55 am It’s an interesting perspective on dog training this one in my garage with the almighty with their ektara. What’s so special, so how come I had not a spiritualist myself! It allows them to take energy from somebody else or at the Rosicrucian headquarters in California, but regardless, if someone was pushing the boundaries of romantic fiction? Comments are closed."
