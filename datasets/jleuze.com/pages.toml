full_description = "Adding multiple slideshows with different sizes October 27, 2011 / Josh Leuze / 340 Comments Meteor Slides users often ask how to create multiple slideshows with different sizes. Here is a tutorial which will show you how to do this using multiple slideshows and metadata. Let’s say you need two slideshows on your site. The larger slideshow, Jupiter, is 500×200 and the smaller slideshow, Mercury, is 300×150. Read More Beta testers needed for Meteor Slides 1.3 October 14, 2010 / Josh Leuze / 6 Comments I have Meteor Slides 1.3 finished and ready to go, it just needs a bit of testing before I release the final version. I have tested this plugin with the TwentyTen theme and on my own site with some common plugins and it works very well. But there are some big changes in this version and I’d like to hear how it works with a variety of themes and plugins out in the wild. Features in this version include support for multiple slideshows and metadata. The template tag, shortcode, and widget all support both of these features. I’m especially interested to see how the shortcode and widget work with different themes and plugins. There are also several other small changes, such as expanded navigation options. Download the beta of Meteor Slides 1.3 and give it a try! I updated the beta to fix a bug with using metadata to resize a slideshow. I am currently writing updated documentation and recording some new screencasts for these new features. I’m hoping to release Meteor Slides 1.3 before the end of the month, of course a babysitter and some espresso could speed things up! Read More"
