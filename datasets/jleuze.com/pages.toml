full_description = "Five stars for Meteor Slides January 21, 2013 / Josh Leuze / 42 Comments Meteor Slides recently reached a big milestone, receiving 200 five star ratings on WordPress.org. It has also been getting some great reviews via the new review feature in the plugin directory. My robot minion Ampersand has been hiding out lately and I haven’t been spending nearly enough time drawing, so I dusted off my Wacom tablet and did some sketching. First I drew Ampersand going on a 5 star balloon ride after hitting 200 ratings and then I drew a spiffy new donate page with buttons for PayPal and my Amazon wishlist. My reading queue is getting out of control! Read More Translations for Meteor Slides July 18, 2010 / Josh Leuze / No Comments Meteor Slides now includes localization support so that it can be translated into any language. Indonesian and Turkish translations are currently included with the plugin, Italian and Romanian translations should be released soon. Meteor Slides in your language? If you would like to volunteer to translate Meteor Slides into your language it would be a big help! You can download the PO file if you know how to use it, or grab the plain text file and I’ll take it from there. Please email your translation to: mail@jleuze.com Read More Ampersand, my robot minion June 16, 2010 / Josh Leuze / 2 Comments I decided my website really needs a mascot, every website should have a mascot right? There isn’t a day goes by that I don’t wish I had a robot minion. Some droid as smart as a dog that could pull weeds and help me water the garden. And on the Net, I need even more help—there just isn’t enough hours in the day! So I built Ampersand here to help me out with some of the grunt work: cleaning up spam, moderating comments, and squashing spider bots that have overstayed their welcome. I have always been a doodler and a science fiction fan, so Ampersand will give me the opportunity to dust off my Wacom tablet and add some futuristic illustrations to my site. Be sure to keep your eyes peeled for Ampersand lurking in the background keeping my outpost running."
