["https://jleuze.com/a-small-meteor-slides-update"]
title = "A small Meteor Slides update | Josh Leuze"
description = "I released Meteor Slide 1.5.3 yesterday. This update has some minor stylesheet tweaks to fix conflicts with the new default theme, TwentyFifteen, as well as some other common theme issues. Meteor S…"
full_description = "December 19, 2014 / Josh Leuze / 4 Comments I released Meteor Slide 1.5.3 yesterday. This update has some minor stylesheet tweaks to fix conflicts with the new default theme, TwentyFifteen, as well as some other common theme issues. Meteor Slides 1.5.3 also includes a new Norwegian translation and updated Swedish translation. WordPress 4.1 Meteor Slides has been tested with the latest release of WordPress and is fully compatible. I have also tested the plugin with WordPress 4.0, but this is the minimum requirement. I don’t test any further back than that and I encourage everyone to keep WordPress and all of their themes and plugins updated. A New Translation As a Minnesotan with roots in Norway, I’m excited to have a new Norwegian translation of Meteor Slides. This completes the Scandinavian trio of translations, which I think calls for another round of lefse this holiday season! Norwegian: Translation by Andreas Lutro Updated Swedish: Translation update by Christian Arwin 400,000 Downloads This weekend Meteor Slides should reach 400,000 downloads, that’s a whole lot of slideshows! I’m excited, and little scared, to see Meteor Slides hit a half million downloads some time in 2015. Thanks everyone who has downloaded and used my plugin, I appreciate all of your reviews and other feedback! Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: bugs, slideshow, translation Previous Post: Using WordPress For Project Management Next Post: Speaking at WordCamp Minneapolis 2015 Join the conversation! 4 Comments Robin Ooi April 6, 2015 at 10:57 am Hey Josh, Great work on the Meteor Slides plugin! Just wondering if you have any plans of updating this plugin in 2015? Cheers, Robin Josh April 6, 2015 at 1:24 pm Thanks Robin! Yes, I have been working on Meteor Slides 1.6, which will be released within the next few months and have a lot of performance improvements. You can follow along with the development of Meteor Slides on Github: https://github.com/JLeuze/Meteor-Slides/ Robin Ooi April 6, 2015 at 1:36 pm Thanks for the heads up Josh! Hopefully it’s compatible with WordPress 4.1.1?? Josh April 6, 2015 at 1:47 pm Yes, Meteor Slides will always be compatible with the latest version of WordPress. Comments are closed."
