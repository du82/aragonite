title = "Customizing The Slideshow Template | Josh Leuze"
description = "The layout of the Meteor Slides slideshow is determined by a template file. You can copy this file into your theme to override the default template and customize the slideshow loop or other markup …"
full_description = "The layout of the Meteor Slides slideshow is determined by a template file. You can copy this file into your theme to override the default template and customize the slideshow loop or other markup without hacking the plugin. Adding a custom slideshow template Copy meteor-slideshow.php from /meteor-slides/includes/ to your theme’s directory to replace the plugin’s default slideshow template. Using the slideshow template Customizing this template should be unnecessary in most circumstances. Custom CSS or metadata should be enough to accomplish most tasks. One reason you may choose to customize the slideshow template would be to add a title or caption to the slides. To see an example of how to add captions to your slideshow, you can look at the Captions Skin."
