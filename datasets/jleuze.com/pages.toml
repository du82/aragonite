title = "Speaking at WordCamp Minneapolis 2014 | Josh Leuze"
description = """
I’ve been so busy lately with client projects, helping organize WordCamp Minneapolis, and getting settled into my new office, that I almost forgot to write about it on my own blog!

WordCam…"""
full_description = "April 24, 2014 / Josh Leuze / No Comments I’ve been so busy lately with client projects, helping organize WordCamp Minneapolis, and getting settled into my new office, that I almost forgot to write about it on my own blog! WordCamp Minneapolis 2014 is this weekend, April 26-27th, and I’ll be speaking on Saturday. My talk is called Don’t let your site jump the shark, it’s in the design track and I’ll be talking about using animation on websites successfully. The schedule is full of awesome talks, this is going to be the best WordCamp Minneapolis yet, so if you haven’t already, you should get a ticket! Update: Here is a video of my talk from WordCamp Minneapolis 2014: WordCamp Season This summer’s WordCamp season will be off to a slow start. I’m taking the train to WordCamp Chicago in June, WordCamp Milwaukee in July, and hopefully one more WordCamp in August to round out the summer. I was bummed to hear that WordCamp Winnipeg won’t be happening this year, my passport is burning a hole in my pocket. But it sounds like there might finally be a WordCamp Omaha in 2014, which is great news since it fell through last time! But it should be a busy summer; I’ll be speaking at another WordCamp(stay tuned), releasing a big update for Meteor Slides, rebuilding this website, launching a new personal sci fi blog, doing some camping and canoeing with my family, and hopefully finally making it to Gen Con for the first time! Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Videos, WordPress Tags: event, msp wordpress, wordcamp Previous Post: WordCamp Milwaukee session slides and links Next Post: Building Your First Widget"
