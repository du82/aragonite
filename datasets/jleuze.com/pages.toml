full_description = "My first plugin, Meteor Slides June 16, 2010 / Josh Leuze / No Comments Meteor Slides makes it simple to manage a slideshow with WordPress by adding a custom post type for slides. There are many slideshow plugins to choose from, and I have a few good ones that I like to use. But each one seems to have some issues. Constructive Criticism The biggest issue is that some of them only have one transition. Personally, fade is the only transition I need. But when you have a slideshow all set up, and the client decides they want they want a diagonal wipe transition, you want options! Read More"
