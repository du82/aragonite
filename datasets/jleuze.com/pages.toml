title = "Meteor Slides | Josh Leuze | Page 4"
full_description = "Beta testers needed for Meteor Slides 1.3 October 14, 2010 / Josh Leuze / 6 Comments I have Meteor Slides 1.3 finished and ready to go, it just needs a bit of testing before I release the final version. I have tested this plugin with the TwentyTen theme and on my own site with some common plugins and it works very well. But there are some big changes in this version and I’d like to hear how it works with a variety of themes and plugins out in the wild. Features in this version include support for multiple slideshows and metadata. The template tag, shortcode, and widget all support both of these features. I’m especially interested to see how the shortcode and widget work with different themes and plugins. There are also several other small changes, such as expanded navigation options. Download the beta of Meteor Slides 1.3 and give it a try! I updated the beta to fix a bug with using metadata to resize a slideshow. I am currently writing updated documentation and recording some new screencasts for these new features. I’m hoping to release Meteor Slides 1.3 before the end of the month, of course a babysitter and some espresso could speed things up! Read More Improved Meteor Slides navigation August 30, 2010 / Josh Leuze / 15 Comments I’ve been getting a ton of feedback about Meteor Slides lately, and seeing some really awesome looking sites using my plugin. Meteor Slides recently broke 5000 downloads on WordPress.org and got its eleventh 5 star rating, thanks everyone for trying out my plugin and leaving a rating or feedback. And I want to give a special thank you to the users who have been kind enough to support this plugin with a donation. I just released Meteor Slides 1.2.3, which includes paged slide navigation. The paged buttons goes together with the left/right navigation and neither will be added to your slideshow unless you enable navigation in the settings. You can see how the paged navigation works on my homepage. The buttons can be easily modified or even hidden completely with CSS if you would prefer a different design. Read More"
