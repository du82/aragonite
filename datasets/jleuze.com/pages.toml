["https://jleuze.com/category/wordpress/page/8"]
title = "WordPress | Josh Leuze | Page 8"
full_description = "New features & languages for Meteor Slides August 10, 2010 / Josh Leuze / 16 Comments One of my goals with Meteor Slides is to keep it very clean and minimalist, particularly on the front end. On my own site, I am using the plugin as a promo banner with just three slides, so adding navigation would be unnecessary. But some people have been using Meteor Slides to display a gallery of a dozen or more photos, and in this situation navigation would be helpful. So I added navigation to this version of Meteor Slides, it is an optional feature that is off by default and can be activated in the Meteor Slides Settings. You can see the navigation in action on my homepage. Read More Translations for Meteor Slides July 18, 2010 / Josh Leuze / No Comments Meteor Slides now includes localization support so that it can be translated into any language. Indonesian and Turkish translations are currently included with the plugin, Italian and Romanian translations should be released soon. Meteor Slides in your language? If you would like to volunteer to translate Meteor Slides into your language it would be a big help! You can download the PO file if you know how to use it, or grab the plain text file and I’ll take it from there. Please email your translation to: mail@jleuze.com Read More Meteor Slides is going global July 10, 2010 / Josh Leuze / No Comments Eugen at WPTuts.ro wrote a post about Meteor Slides, and even took the time to make some awesome screenshots that explain the plugin’s interface in Romanian. One of the features on my to-do list is adding support for localization so that users can translate Meteor Slides into any language they choose. I held off on this feature in the initial release, because there just isn’t that much text in the plugin to be translated. But my goal with Meteor Slides was to make it easy to use with an intuitive interface, and a big part of that usability is being able to read the interface! To help meet that goal, translation support is the next feature I’ll be releasing for Meteor Slides. Translators needed! However this feature isn’t very useful without some translation files, and my high school french isn’t going to be of much help. If anyone would like to volunteer to translate Meteor Slides it’d be much appreciated. I can provide you with a POT file if you have the software to use it, or I can send you plain text and create the file from your translation. Just leave a comment or email me: mail@jleuze.com Meteor Slides 1.1.1 I released an update for Meteor Slides that fixes a few bugs. If you find more bugs, please let me know. Read More"
