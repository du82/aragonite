["http://www.jleuze.com/adding-multiple-slideshows-with-different-sizes/comment-page-1"]
title = "Adding multiple slideshows with different sizes | Josh Leuze"
description = """
Meteor Slides users often ask how to create multiple slideshows with different sizes.

Here is a tutorial which will show you how to do this using multiple slideshows and metadata."""
full_description = '''October 27, 2011 / Josh Leuze / 340 Comments Meteor Slides users often ask how to create multiple slideshows with different sizes. Here is a tutorial which will show you how to do this using multiple slideshows and metadata. Let’s say you need two slideshows on your site. The larger slideshow, Jupiter, is 500×200 and the smaller slideshow, Mercury, is 300×150. The height and width options on the slides settings page determine two things, the dimensions of the slideshow itself, and the maximum dimensions of the individual slides. Smaller slides can be used, but any slides that are larger than these dimensions will be cropped, so the height and width in the slides settings should match the largest slideshow on your site. Start with the largest slideshow Start by setting up the largest slideshow in the standard way. In the slides settings, set the Slide Height to “200” and the Slide Width to “500”. Then create a slideshow called “Jupiter”, make your slides with images that are 500×200, and add them to the Jupiter slideshow. Here is an example shortcode to load the largest slideshow with the name Jupiter: [meteor_slideshow slideshow="jupiter"] Note that you don’t need to use metadata to set the dimensions of the largest slideshow because it should match the dimensions on the settings page. Then setup the smaller slideshow Now for the smaller slideshow, create a slideshow called “Mercury”. Make the slides for this slideshow with images that are 300×150 and add them to the Mercury slideshow. Because you have used smaller slide images which were prepped to fit 300×150, all you need to do is override the default slideshow height and width using metadata to shrink this specific slideshow to the proper dimensions. Here is an example shortcode to load the smaller slideshow with the name Mercury: [meteor_slideshow slideshow="mercury" metadata="height: 150, width: 300"] When using metadata, only values which are strings should use single quotes, other types, such as the integers in the above example, should be used without single quotes. Styling specific slideshows with CSS By default the slideshows will be full width block level elements. Maybe you would like to wrap some text around the smaller slideshow though. When you specify a slideshow, a unique ID is created for it based on the slideshow’s slug. So the Mercury slideshow ID would be “meteor-slideshowmercury”. With this ID you can target just that slideshow with certain CSS rules: #meteor-slideshowmercury { float: left; margin: 0 20px 20px 0; } Keep it simple But don't forget, less is more! A slideshow is a great way to get a visitor's attention, but when you add multiple slideshows or other animated elements to the same page you are dividing the user's attention and diluting that page's potential. So try to keep it simple by spreading these elements out to different pages to reduce the clutter and increase the quality of your website. Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, Tutorials Tags: custom taxonomies, slideshow Previous Post: Using the Members plugin with Meteor Slides Next Post: I’ll be at WordCamp Omaha this week Join the conversation! 340 Comments Dave November 2, 2011 at 10:43 am I’m trying to have a different size on a second slideshow and it seems to make the area the correct size. But it seems like the images are resized to the default size (250×250) when I want the images to be 350×263. This is on the page http://theblindspot.biz/wordpress/motorization The homepage has the slide show at the required 260-x250. This is the code that I put in the page for Motorization [meteor_slideshow slideshow="motorization" metadata="height: 263, width: 350"] Can you tell me if I’m doing something incorrectly on the code? Thanks for your help. Dave Josh November 4, 2011 at 1:42 pm Hi Dave, you have the height and width set to 250px in the slideshow settings. Any slide images you upload will be cropped to these dimensions, you should set the height and width to match the largest slideshow you need. Kyle January 1, 2012 at 8:38 pm Hey Dave, I’m having trouble w/ multiple slideshows. All of the images in the “slides” area are posted in each of my slideshows. They are set up to scale as I need them but all the images from slideshow 1 also appear in slideshow 2, and likewise. here is an example http://www.kyledwatson.com/art/ all of the skewed images should not be there. DavidH January 2, 2012 at 3:43 pm Kyle, I’ll let Josh respond with more detail since it’s his plugin but for starters I would verify that for each slide you have selected the checkbox for the appropriate slideshow (in the slide’s sidebar). Josh January 2, 2012 at 4:10 pm Kyle, it looks to me like you aren’t specifying a slideshow on that page and that is why it is loading all the slides. It could be as simple as a typo, double check that you have the shortcode or template tag formatted correctly and that you are using the slideshow’s slug as the value of the slideshow parameter. scott November 11, 2011 at 7:20 pm So cool! This plugin rocks! TY TY TY Josh. I hoped you could have multiple sizes and here it is! Josh November 11, 2011 at 11:35 pm Thanks Scott, you’re welcome! RJ November 12, 2011 at 1:16 am Meteor Slides Settings – height: 424 x width: 425 Main page is [meteor_slideshow slideshow="main-page" metadata="height:282, width: 425"] Occupations page is [meteor_slideshow slideshow="occupations" metadata="height:424, width: 283"] The height of the occupations images does not reflect height:424 – I assume it is 282. How do I fix this please, I keep pulling out my hair…at this rate I won’t have much left.:) Thank you for your assistance. RJ Josh November 13, 2011 at 9:10 am Hi RJ, can you post a link to the site you are working on? RJ November 13, 2011 at 9:17 am https://maestrovirtualassistant.com RJ November 13, 2011 at 9:22 am I just took off the security. Home page is the wide images and your’re on the list is the vertical. I appreciate your assistance. RJ https://maestrovirtualassistant.com Josh November 14, 2011 at 2:39 pm The height of the occupations slideshow looks correct to me: https://www.maestrovirtualassistant.com/on-the-list/ But the slide images are 253×200, are they supposed to be 283×424? If the images were cropped, possibly they were uploaded before the slide dimensions were set? duanwanty November 15, 2011 at 7:12 am Hi Josh I have tried to add a smaller slideshow on a website, but the three dots, like the bigger one on the same page, seems to have disappeared and it is not changing. please tell me what i did wrong. here is the website: ww2.davidfourie.co.za i am using the meteor slide widget and i added the follwong in the metadata field: [meteor_slideshow slideshow=sponsors metadata=height: 150, width: 300] as you see it looks fine (sort of) except for the three dots and it doesnt seem to be showing the other slides at all. not an expert at all, but getting there. please tell me what I did wrong. Josh November 15, 2011 at 9:00 am Hi Duan, it looks like no slides are being loaded. Try adding quotes around the slideshow and metadata values like this: [meteor_slideshow slideshow="sponsors" metadata="height: 150, width: 300"] RJ November 15, 2011 at 8:03 am They are not cropped. I removed the images, reloaded the images to library, created new slides, and it works. Your the man!!!! Thank you. RJ Josh November 15, 2011 at 9:02 am Awesome, glad to hear you got it working! Alex November 17, 2011 at 4:28 am Hi Josh, May i know after i set the biggest size in setting “735×120” and then i create another slideshow, i style it with css into “209×120″ like what you show above but i still get the main size i set..”735×120”. Alex Josh November 21, 2011 at 6:05 pm Hi Alex, possibly there is a typo in your metadata? Can you post a link to the page you’re having this problem on? duanwanty November 21, 2011 at 6:27 am Hi Josh As soon as I add those quotes, and I save the widget info, it deletes everything after the quotes. So it doesnt save the metadate right. Shucks Josh November 21, 2011 at 10:59 am Hi Duan, are you adding the whole shortcode to the metadata field in the widget, or just the metadata like this: metadata="height: 150, width: 300" Mik August 9, 2013 at 10:22 am I tried entering the following code for a smaller slide show: metadata="height: 200, width: 260" to my widget but it keeps disappearing and doesnt save the settings. I also tried: height: 200, width: 260 wich save, but does not affect the slide show size for the widget – Is something wrong? Josh August 9, 2013 at 11:04 am The second way is correct, in the metadata field of the widget, you just add the actual metadata. You might be having a theme conflict, could you post a link? duanwanty November 21, 2011 at 6:27 am I dont know, how I will manage to fix it… DavidH December 3, 2011 at 8:21 pm Excellent. Thanks for this Josh. Using multiple slideshows is working great for me but I haven’t yet figured out how to change the *number* of slides in a slideshow via metadata. (I didn’t see that as an Option on the jQuery Cycle’s Options page.) Sorry if I’m missing that on a different information page but I’ve looked through the documentation and haven’t come across it. Thanks in advance! Josh December 3, 2011 at 9:33 pm Hi Dave, right now the quantity in the options applies to all the slideshows. Usually I set this to match the number of slides in the largest slideshow and just add less slides to the other slideshows. But being able to override more of the options via metadata would be handy, I see what I can come up with! DavidH December 3, 2011 at 9:39 pm I thought that might be the case—I’ve noticed before that while setting up a slideshow it will still cycle through without any “blanks” even before I have met the total number of slides I’ve defined in the settings but I was concerned this might come back and bite me later! Thanks Josh, and thanks for the quick response. Josh December 3, 2011 at 9:44 pm No problem David, so the slideshow is loading empty slides for you? If there are only 3 slides in the slideshow, that’s all that should be loaded, even if the quantity is set higher than that. DavidH December 3, 2011 at 10:12 pm Ah, sorry. It’s the opposite—I was just confirming what you said that in fact the slideshow actually cycles through the number of slides I’ve *created* rather than relying on the number I’ve defined in the settings. Josh December 3, 2011 at 11:01 pm That’s good to hear! oz December 4, 2011 at 3:27 pm I love the plugin, but I have a quick question, can the second smaller slideshow work if the y axis is bigger than the 1st slideshow’s y axis, for ex. 1st is 640 x 335, 2nd is 290 x 470. 2nd is smaller but the y axis is bigger. Thank You! oz December 4, 2011 at 3:52 pm I have answered the question, just put in the metadata for 640 x 335 and then reset the settings to 290 x 470 and now it works like a dream! Josh December 5, 2011 at 6:10 pm Yeah, if the slideshows are drastically different in size, you have to set the height to the tallest slideshow and the width to the widest slideshow and set the dimensions in the metadata for each specific slideshow. Dorte Pedersen December 5, 2011 at 11:26 am Hi, I am working on setting up a wordpress responsive fluid grid website and have creted the home page to be static. Instead of the featured image I want to set up a sliding images at the top to the right. I have installed the Meteor Plugin, customized the settings, but I dont know how to activate it so it shows up. I dont want to use widgets or include it as a posted image inside of the text-post, as the placement would not work visually. How do I replace the current featured image with the slider image, so it is placed where the featured image is now? Thanks for your support in advanced. All best, Dorte DavidH December 5, 2011 at 11:33 am @Dorte, when you say the homepage is static do you mean you’ve created a page template and hard-coded the homepage content in that? Also, can you give us the link to the page? Dorte Pedersen December 6, 2011 at 12:32 pm Hi again, no, what I have done is this: Under Settings Front page desplays: I have chosen A static page, and front page is home page, Post page is my about page. My plan is to set up the Meteor slider on the front home page. Sorry, but I am quite new in setting this up. Hope this clarifies it. Thanks Josh December 6, 2011 at 12:41 pm There are two ways you can add a slideshow to the page you have set as your homepage. The easiest way would be to add the shortcode to the content of that page using the the visual editor. But if you wanted the slideshow above the page title, or right below the header above two or more columns, you would need to use the template tag and add it to a template file in your theme. For most of the themes I build, I create a custom page template with a unique layout just for the homepage. Check out this tutorial I wrote on creating custom page templates for more info on how to do this. Dorte Pedersen December 6, 2011 at 1:29 pm Thanks a lot, I will check it out. Dorte Josh December 5, 2011 at 6:16 pm You’ll want to use the template tag, but where depends on your theme, what theme are you using and could you post a link? I don’t have any good documentation yet, but it is possible to customize Meteor Slides so that the slideshow is responsive and scales well with the rest of the site. DavidH December 5, 2011 at 7:29 pm As a reference to Meteor Slides in a responsive site, I just finished building a very simple project (that I didn’t design) that took a little Meteor Slides customization to make responsive. Feel free to check the source: http://freedomsolarpower.com. Josh December 8, 2011 at 11:39 am That works great, I’ll take a peek and see how you did it! Dorte Pedersen December 8, 2011 at 4:11 am Hi again, my site is http://dortepdesign.dk It is the picture on the home page that is placed on the second right coloumn wich is 300px high and 400px bright. This is by adding the image as a featured image. If I put the picture inside of the text post it goes below the text in the left coloumn (not wanted). So I am not looking for a 960 px bright top image slider. The theme is React from http://thethemefoundry.com Cheers Josh December 8, 2011 at 11:43 am The theme is commercial so I can’t look at the code, but if you can email me a login for the site I can look at the code of the homepage in the theme editor and tell you what to change. Duan December 5, 2011 at 11:40 am Hi Josh I have been trying to unsubscribe from the comment on this page, as I no longer need assistance, but it keeps giving me an error. Can you assist? Its not that its im not interested, its just that I dont need the advice now. Trust you understand. Josh December 5, 2011 at 6:13 pm No worries Duan, I’ll unsubscribe you! Kermit Woodall December '''
