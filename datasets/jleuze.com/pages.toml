["https://jleuze.com/create-responsive-slideshows-with-meteor-slides-1-5"]
title = "Create responsive slideshows with Meteor Slides 1.5 | Josh Leuze"
description = """
Meteor Slides 1.5 adds responsive slideshow support, touch navigation, an improved slideshow widget, new translations, and updates jQuery Cycle.

I have been building more responsive websites latel…"""
full_description = '''April 26, 2012 / Josh Leuze / 222 Comments Meteor Slides 1.5 adds responsive slideshow support, touch navigation, an improved slideshow widget, new translations, and updates jQuery Cycle. Responsive Slideshows I have been building more responsive websites lately and receiving more and more requests from users for responsive slideshows, so I have updated the slideshows to scale automatically. If you are using a fixed width theme the slideshows will remain unchanged at their original dimensions. But if you are using a fluid or responsive width theme those are used as the maximum dimensions and the slideshow will scale, shrinking to fit the theme on smaller screens and devices. Any custom slideshow templates, stylesheets, or scripts you are using would have to be updated from the default versions in 1.5 to add this responsive functionality. Try resizing the Meteor Slides homepage in your browser to see the responsive slideshow in action! Touch Wipe Navigation Another mobile friendly update in Meteor Slides 1.5 is support for touch navigation. I added the jQuery Touchwipe plugin which allows previous and next navigation with the swipe of a finger. This works on many touch devices including the iPad, iPhone, and Android mobiles and tablets. Built In Support The contextual help feature has been updated to use the new help functions in WordPress 3.3 and expanded with more information and links to relevant documentation. Click the help tab in the upper right corner of any Meteor Slides admin page for more information. Improved Slideshow Widget The Meteor Slides Widget has been updated with a new slideshow selector. This option only displays if you have created one or more slideshows, allowing you to easily choose a slideshow from a dropdown without having to enter the slideshow’s slug. Even More Translations Thanks to these translators, Meteor Slides is now available in twenty languages! Belarusian: Translation by Alexander Ovsov Czech: Translation by Ondřej Carda Danish: Translation by Kim Hansen Dutch: Translation by Leon Buitendam German: Translation by Maximilian Brandl Persian: Translation by Peyman Asadi A Five Star Year Since 1.4 was released last year the downloads have more than doubled to 93,000, and it has zoomed up to a 145 ratings. I have gotten so many awesome comments, tweets, emails, and even donations from Meteor Slides users this year, thanks everyone for your feedback and generosity! If you want to keep up with and participate in the development of Meteor Slides, check out the project on Github. Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: responsive, slideshow, translation, widget Previous Post: I’ll be at WordCamp Omaha this week Next Post: Speaking at WordCamp NYC 2012 Join the conversation! 222 Comments Sergio March 11, 2013 at 3:22 pm Where I wrote “the tree” or “the box”… I wanted to write “slideshow”. Sorry Josh. Sergio March 11, 2013 at 3:29 pm Hi Josh, another question. Is there a way to configure, in the navigation menu, pause and play?. Because it never stops … and maybe there are people who want to stop moving. Then, that person may want the slides were again set in motion again. Thank you. Josh March 11, 2013 at 3:34 pm No worries Sergio, I don’t speak Spanish, so we’re even! If you can post a link to the site you are working on, that will help me. The plugin will crop slide images to fit the slideshow if they are too large. It is a “maximum” size. But you will get the best results of you size images to Photoshop first to match the slideshow size. Also, make sure you set the size in the slideshow options first, and then upload your slide images. You can use metadata to have the slideshow paused by default, pause after one rotation of the slides, or you can customize it to have pause and play buttons. Sergio March 11, 2013 at 3:53 pm Wow Josh, thanks for answering so fast. 1. The website at which I am working … not yet online. Anyway, I did what you said you’d do: delete slides, set the size of the slideshow, re-create the slides, etc.. That’s why I came to the conclusion that the maximum size puts the size of the slide, not the size of the slideshow. That’s why I think the only solution will be to generate the scale of the images in photoshop and then create slides. 2. I would like the buttons to pause and play. What do I do?. I’ve checked all the settings but I have not seen anything. Thanks for your help. Sergio March 11, 2013 at 5:19 pm Hi Josh… again… The problem (size) is only with the height. With the width… I have not a problem. For example, if the slideshow has configured a height of 450 px and the slide has a height of 700 px, then the slideshow will expand to 700 px on the slide. That problem does not exist with the width. Thank you for your time. Josh March 12, 2013 at 3:01 pm It depends, if the slideshow is set to 450px high and you a slide images that is 700px, it will be cropped to fit the slideshow. It is not meant to size the slide images, only to prevent them from breaking it by being too large, and also to help with the layout of the slideshow. When you set the size of the slideshow, you are telling the plugin that is how big your slides are, when they don’t match the results can vary. It is best to size your images correctly first in Photoshop and then match the slideshow to that size. Pausing the slideshow by default is easy, you can set the Slide Duration to “0”, and that will disable the auto-advance. If you enable the slideshow navigation, users can use that to cycle through the slides. Adding actual pause and play buttons is harder, you have to customize the slideshow template and add the buttons, and edit the slideshow script to activate them. Here is an example of jQuery Cycle that uses the pause and play button. Empire1 March 12, 2013 at 3:15 pm Hi Josh like this plugin, I’ve pluged in a mobile theme, if I put a slide in the main site would it show up in the mobile site? Our do I have to build the mobile site with the slide in it. URL Thanks Josh March 12, 2013 at 3:34 pm I don’t know how you have your mobile theme setup, but if it is different than your desktop theme, you’d have to add the slideshow to the mobile theme using the template tag. Most of the time it is used in responsive themes, so the theme and slideshow scale for mobiles and there is only one theme. If you can tell me more about how you have that setup and I maybe be of more help. Empire1 March 12, 2013 at 4:27 pm Thanks for the fast reply Josh! I’m not to sure how it is pluged in. As someone did it for us, I know it is on a template that as been messed around with, and the mobile is just a plug in I think. Because when I write txt or put images on the main site they show up on the mobile site, but the header from the main site isn’t showing in mobile version and the blog page don’t show up as well. The URL is http://www.mycarvaletingservices.co.uk Thanks Gary Josh March 12, 2013 at 4:40 pm If the mobile plugin loads it’s own theme, you’d have to edit that mobile theme to add a slideshow. It depends on the plugin, some switch the theme, so it would be standard WordPress theme in your theme folder, others have their own custom theme built into the plugin. Either way, look into the mobile plugin some more, the documentation will tell you how to create a custom mobile theme, once you have that adding the slideshow should be simple. Empire1 March 12, 2013 at 4:44 pm Thank you Josh, I take a look at the files and see if they have messed with them. And then try and get a slide in there as I do like your plugin. Proberly be buying you lots of coffee to get it there 🙂 Thanks Gary Josh March 12, 2013 at 4:47 pm Cheers Gary, I’d look up the mobile plugin, it should have some documentation either on WordPress.org or on their own site and that will tell you how to make a custom mobile theme. Then you should be able to check and see if you have a custom one you can edit, or if you need one. Sergio March 13, 2013 at 1:10 pm Hi Josh, thank you for your comments and your help. I’ll see what I do. I’ve seen what you indicated but for now, it’s very difficult for me. Well, now let me send a big hug and thank you for being there. Oh, and as I see you’re in Minnesota … if you look at Ricky Rubio … send him greetings from Madrid. Up the Timberwolves … 🙂 Josh March 13, 2013 at 2:17 pm Ha, you’re welcome Sergio! Daniel March 17, 2013 at 10:25 am Hi Josh, Thank you for the useful plugin! I was looking for responsive slideshow to use it up on the site header. I knew about Meteor as the WP Theme (Weaver 2) that I use, talk about it somewhere in its documentation. Well, I installed your plugin but it seems that it not work as it’s supposed. I tried to use the Meteor widget in the Header Horizontal Widget Area . 1 – I don’t know if plugin do crop or enlarge images but it seems that the high is not took but width. 2 – with my theme, which is responsive and have set a max width, Meteor is not responsive. I’ve read above about something aprox similar and you told James on replay to its July 6, 2012 at 8:09 am post to modify .widget-wrap { float: none; } Well, I don’t know if this is my situation, too but I wanted to try modifying it…only that I don’t know where is the code line to do it. Please tell me what I can do to get that responsive feature working. Here’s my website http://www.danielchiriac.com Thank you, Daniel PS. I’ve just remembered that I can insert short codes in header area directly from weaver 2 admin page and I inserted [meteor_slideshow] and also I uploaded new images to slideshow (cose I remembered, too that you wrote somewere to use images uploaded AFTER the plugin install to avoid any problems … Well, using short code the plugin works thoroughly! Thank you very much! Josh March 17, 2013 at 11:09 am Hi Daniel, glad to hear that you got it figured out. The site looks great, you’ve got some amazing art on there! Daniel March 17, 2013 at 12:57 pm Oh, thank you for appreciations, Josh! I really like your widget even that using it is not very natural 🙂 Before Meteor I used “Slideshow” plugin which I think it has a better interface (is it the right word?) but it don’t fit to my needs I was quite confused of the Meteor setting up at the first use. Well, I thought that this is so because you wanted to write a “slim” plugin that it simply does its job without a stuffy interface….. and as my PC run on Gentoo Linux, I realy appreciate a simple code that just work. Best, Daniel Josh March 17, 2013 at 1:08 pm Yeah, one of my goals with Meteor Slides is to keep it very simple! Eden Chen March 21, 2013 at 4:24 am Hello,Thank you Josh.Good post,I have some questions? 1:Meteor Slides and W3t will be Conflict？ 2:Especially W3t the minify! thank you again! Josh March 21, 2013 at 4:36 pm Hi, Meteor Slides is compatible with most caching plugins, including W3 Total Cache. Sometimes minifying the JavaScript can cause problems, but the latest version of Meteor Slides fixes some of these issues so minification should work better. Erica Morrow April 1, 2013 at 4:16 pm Hi, I was wondering how do i change the size of the plugin on my home page. i want it to be smaller Josh April 1, 2013 at 5:52 pm Hi Erica, in the slideshow settings you can change the height and the width. To fit that spot in the Responsive theme, the slideshow should be set to 440×300. After you update the dimensions, make sure you size the slide images to match that exactly in an image editor, and then re-upload them to WordPress. Patti April 7, 2013 at 8:53 am I uploaded the plugin and activated it. I set up the settings with the biggest slideshow dimensions before uploading any images. I wanted a caption so I uploaded, to my child theme, meteor-slideshow.php and I placed this code: <?php // Get the featured image's description $ms_thumb_id = get_post_thumbnail_id($id); $ms_description = esc_attr( get_post_field( 'post_content', $ms_thumb_id ) ); echo '’ . $ms_description . ”; ?> above the I created a slideshow and then placed this code: [meteor_slideshow slideshow="step-by-step-guide" metadata="height: 346, width: 546"] into a page. I added this code to my css: .meteor-slides p { background: rgba(0,0,0,0.5); bottom: 0; color: #fff; left: 0; line-height: 20px; margin: 0; padding: 2%; position: absolute; text-align: center; width: 96%; } div.meteor-slides { margin: 0 auto !important; } The images look great, the caption looks good, but it appears I have a background showing that is bigger than the slideshow and when you hover or try to click on the slideshow it actually moves and has a scroll bar. Have no idea what I’ve done wrong. Help please? I’ll deactivate my maintenance mode if you want to take a look and see what suggestions you can give me. http://hometownchatter.com/help/ Patti April 7, 2013 at 8:58 am *above the closing div of .mslide don’t know why that didn’t show up Josh April 7, 2013 at 11:39 am Hi Patti, I can take a look if you want to deactivate the maintenance mode. Patti April 7, 2013 at 1:11 pm Hey Josh..thanks. I’ve disabled the maintenance mode. 🙂 Josh April 8, 2013 at 2:20 pm Sorry, I didn’t have a chance to look into it yesterday and now the site is in maintenance mode again. Patti April 8, 2013 at 7:40 pm Hey Josh, don’t know if you’re around right now, but I’ve taken the site off maintenance mode again. Sorry I missed your earlier message. If you can’t tonight, maybe you could let me know a time that works for you and I can shut it off for you tomorrow. I’m central time zone. Thanks so much for getting back with me. 🙂 Josh April 9, 2013 at 11:30 am Hi Patti, I checked the site yesterday and maintenance mode was still active. Maybe you want to send me a login for the site so I can check it out while it’s in maintenance mode? Patti April 9, 2013 at 12:08 pm Sent you a message Josh! Thanks for keeping in touch and not giving up on our game of email/comment tag! 😀 Josh April 9, 2013 at 12:36 pm No problem, I took a look, the problem was that the shortcode had code tags wrapped around it from being copy/pasted into the visual editor. I switched to the HTML view and removed these tags and it is working fine now. Patti April 9, 2013 at 12:42 pm YOU ROCK!! Thanks so much Josh. Josh April 9, 2013 at 2:06 pm You’re welcome! Lee April 23, 2013 at 4:12 pm Hi Josh Great Plug-in, just having what I hope is a small issue. The slider is for a 1 col page, and is set to a size that is smaller than the page width. When I publish the slider it alligns to the left leaving empty space. I want it centred. Have tried , and tried positioning it within the visual WP edit page, but with no effect. Any help is appreciated. Josh May 2, 2013 at 11:14 am Hi Lee, you can center the slideshow by changing the slideshow alignment. Lee May 2, 2013 at 11:34 am Thanks Josh, I actually'''
