full_description = "A small Meteor Slides update December 19, 2014 / Josh Leuze / 4 Comments I released Meteor Slide 1.5.3 yesterday. This update has some minor stylesheet tweaks to fix conflicts with the new default theme, TwentyFifteen, as well as some other common theme issues. Meteor Slides 1.5.3 also includes a new Norwegian translation and updated Swedish translation. Read More Meteor Slides updated for WordPress 4.0 October 12, 2014 / Josh Leuze / 9 Comments I just released Meteor Slide 1.5.2, a plugin update which includes a new Slides icon and other styling adjustments to match the admin in WordPress 4.0. This update also includes some new and updated translations, bringing the total number of translations up to twenty-five! Read More Create responsive slideshows with Meteor Slides 1.5 April 26, 2012 / Josh Leuze / 222 Comments Meteor Slides 1.5 adds responsive slideshow support, touch navigation, an improved slideshow widget, new translations, and updates jQuery Cycle. Responsive Slideshows I have been building more responsive websites lately and receiving more and more requests from users for responsive slideshows, so I have updated the slideshows to scale automatically. If you are using a fixed width theme the slideshows will remain unchanged at their original dimensions. But if you are using a fluid or responsive width theme those are used as the maximum dimensions and the slideshow will scale, shrinking to fit the theme on smaller screens and devices. Any custom slideshow templates, stylesheets, or scripts you are using would have to be updated from the default versions in 1.5 to add this responsive functionality. Try resizing the Meteor Slides homepage in your browser to see the responsive slideshow in action! Read More A new look for Meteor Slides August 31, 2011 / Josh Leuze / 73 Comments Meteor Slides 1.4 features a new slideshow design, support for the Members plugin, custom slideshow script support, and several new and updated translations. Meteor Slides has been busy since version 1.3.3 was released. The number of downloads doubled to over 40,000 with nearly 80 ratings and many generous donors have also helped to keep my coffee cup full, thanks! I recently created a GitHub repository for Meteor Slides; drop by if you’d like to fork, pull, watch, or otherwise fiddle with my plugin. Read More"
