title = "Adding multiple slideshows with different sizes | Josh Leuze"
description = """
Meteor Slides users often ask how to create multiple slideshows with different sizes.

Here is a tutorial which will show you how to do this using multiple slideshows and metadata."""
full_description = '''October 27, 2011 / Josh Leuze / 340 Comments Meteor Slides users often ask how to create multiple slideshows with different sizes. Here is a tutorial which will show you how to do this using multiple slideshows and metadata. Let’s say you need two slideshows on your site. The larger slideshow, Jupiter, is 500×200 and the smaller slideshow, Mercury, is 300×150. The height and width options on the slides settings page determine two things, the dimensions of the slideshow itself, and the maximum dimensions of the individual slides. Smaller slides can be used, but any slides that are larger than these dimensions will be cropped, so the height and width in the slides settings should match the largest slideshow on your site. Start with the largest slideshow Start by setting up the largest slideshow in the standard way. In the slides settings, set the Slide Height to “200” and the Slide Width to “500”. Then create a slideshow called “Jupiter”, make your slides with images that are 500×200, and add them to the Jupiter slideshow. Here is an example shortcode to load the largest slideshow with the name Jupiter: [meteor_slideshow slideshow="jupiter"] Note that you don’t need to use metadata to set the dimensions of the largest slideshow because it should match the dimensions on the settings page. Then setup the smaller slideshow Now for the smaller slideshow, create a slideshow called “Mercury”. Make the slides for this slideshow with images that are 300×150 and add them to the Mercury slideshow. Because you have used smaller slide images which were prepped to fit 300×150, all you need to do is override the default slideshow height and width using metadata to shrink this specific slideshow to the proper dimensions. Here is an example shortcode to load the smaller slideshow with the name Mercury: [meteor_slideshow slideshow="mercury" metadata="height: 150, width: 300"] When using metadata, only values which are strings should use single quotes, other types, such as the integers in the above example, should be used without single quotes. Styling specific slideshows with CSS By default the slideshows will be full width block level elements. Maybe you would like to wrap some text around the smaller slideshow though. When you specify a slideshow, a unique ID is created for it based on the slideshow’s slug. So the Mercury slideshow ID would be “meteor-slideshowmercury”. With this ID you can target just that slideshow with certain CSS rules: #meteor-slideshowmercury { float: left; margin: 0 20px 20px 0; } Keep it simple But don't forget, less is more! A slideshow is a great way to get a visitor's attention, but when you add multiple slideshows or other animated elements to the same page you are dividing the user's attention and diluting that page's potential. So try to keep it simple by spreading these elements out to different pages to reduce the clutter and increase the quality of your website. Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, Tutorials Tags: custom taxonomies, slideshow Previous Post: Using the Members plugin with Meteor Slides Next Post: I’ll be at WordCamp Omaha this week Join the conversation! 340 Comments Henkz July 16, 2012 at 11:50 am Hi, how to add slidehow on the single post. I’ve make 3 slides and have added this code: [meteor_slideshow] to my HTML section on my test post. But, there’s no slides I see when I publish the post. Is there any additional code should I insert to the standard one? Josh July 17, 2012 at 1:19 am Hi Henkz, all you should need to do is add the shortcode. You did add this to the post’s content in the post editor? Could you post a link to the page you are trying to add a slideshow to? charly marciano July 18, 2012 at 7:24 pm Hi Josh, please tnxs for you meteor slide its great! i want to ask you something, i set the slideshow in 600*400 but and my pics are that dimension but the slide crop my pics to another dimension, what can i do? thanks man for all hugs Josh July 19, 2012 at 12:33 am Hi Charly, did you upload the images after setting the slideshow dimensions? Could you post a link to the slideshow you’re working on? charly marciano July 19, 2012 at 11:08 am of course, http://dehombrestrabajando.com.ar/?page_id=49 well I read something about my problem. the same you answer. im gonna try reloading all the images with the plug setted rigth to the pics dimensions. and I tell you. Tnxs! charly marciano July 19, 2012 at 11:41 am MAN TNXS!! http://dehombrestrabajando.com.ar/?page_id=54 working! hugs! Josh July 19, 2012 at 1:45 pm Good to hear you got it figured out! Drew July 24, 2012 at 7:38 am Hi Josh, Thanks for such a great plugin. Just wondering how to use the CSS code for wrapping text around a slideshow? I’m a newbie when it comes to code of any kind. I’m able to easily get the slideshow up and running and I’ve found your CSS code RE: wrapping text: #meteor-slideshowmercury { float: left; margin: 0 20px 20px 0; } I simply don’t know where to insert that code (obviously with the slideshow name changed to my slideshow’s name). I’m using the Weaver II Pro theme which has a lot of CSS capability so I’m thinking this should be easy but nothing I’ve tried seems to work. I’ll definitely be buying you some coffee. Not today, but very soon. Kindly, Drew Drew July 24, 2012 at 7:51 am Hey Josh, I just figured it out. I needed to assign that specific slideshow name when inserting it into the post. Excellent. I’m definitely going to buy you a cup of coffee in the next few days! Kindly, Drew Josh July 24, 2012 at 5:11 pm Thanks Drew, coffee is always appreciated! Edwin July 31, 2012 at 6:10 pm Hi Josh, Is there a way to have multiple slideshows with varying number of slides? I initially set the quantity to 25 in the settings page and created a slideshow of 25. I then changed the quantity to 50 and created another slideshow with 50 pictures. These 2 pages displayed the slide quantities properly in the slide navigation bar. At this point I thought the qty is actually “max qty” and that any slideshow under qty of 50 would display correctly. But the third slideshow consisting of 17 pictures, shows the 17 plus the 33 of the previous slideshow. Josh August 1, 2012 at 12:38 pm Hi Edwin, yes the slideshow quantity is a max, if you add less slides to a slideshow it will show that number of slides. Did you create and load specific slideshows? Edwin August 1, 2012 at 12:57 pm Yes Josh, the quantity is set to 50 and I’ve created 3 slide shows: Slideshow 1: contains 28 slides and shows 28 slides http://www.crazyforpetshotel.com/index.php/gallery/hotel-stars/ Slideshow 2: contains 47 slides and shows 47 slides http://www.crazyforpetshotel.com/index.php/gallery/lets-play/ Slideshow 3: contains 17 slides but shows 50 slides! (33 are from slideshow 2) http://www.crazyforpetshotel.com/index.php/gallery/rooms/ Here’s a screenshot of the slideshow setup: http://www.cc20.com/bucket/settings.png http://www.cc20.com/bucket/slideshows.png Edwin August 1, 2012 at 1:25 pm UPDATE: I’m not sure if this is related, but I noticed that the slideshow slug was the same name as the page. I renamed the slideshow and it’s now being displayed correctly. Josh August 3, 2012 at 2:19 pm The name of the slug shouldn’t matter as long as it matches what you have specified in the template tag or shortcode, but at least you got it working! Geli August 1, 2012 at 4:56 am Hello Josh! I have been happily using your slideshow on this page http://www.geliheimann.com/coaching-intervention/therapy-coaching-methods/energy-psych/, which has small diameters (100×560) [meteor_slideshow slideshow="quotes" metadata="height: 100, width: 560"]. Now I want to add a larger slideshow (250×940) to the homepage (http://www.geliheimann.com/) and it does not show up. I used [meteor_slideshow slideshow="homepage"] even added metadata, but still it does not show. The image shows up if I just use: [meteor_slideshow] but then I also get all the other smaller images from the other slideshow. I realise that you said to start with the larger slideshow first. Well, I did not have the larger one in my mind when I created the small one first. I hope I do not have to remove every image and the two slide shows, just to get the larger one first. Please help. Thanks, Geli. Josh August 1, 2012 at 12:42 pm Hi Geli, I see a slideshow on your homepage, did you get it figured out? Jay Patel August 1, 2012 at 5:54 am Excellent slideshow and thank you for making it available to us. If you ever want to use any of my image thumbnails to showcase your work let me know. Here are few suggestions for short code options: Adding Captions (Turning them On-Off) Adding Slide Navigation: (Turning them On-Off) Skins/Custom CSS (being able to select the custom CSS) – Ideally this would not be overwritten when you upgrade to newer version. Josh August 1, 2012 at 3:15 pm Thanks Jay, you’ve got some amazing photos in your gallery! I’ll definitely be extending the shortcode options to include more per-slideshow functionality in the future. Jay Patel August 1, 2012 at 4:09 pm Is there any way to crop the height? Without putting the slide show in an external DIV container? Josh August 3, 2012 at 2:16 pm The slides should be cropped to the height set in the slideshow settings. Geli August 1, 2012 at 4:08 pm Josh, thank you. I have no clue how come it works now, but I am happy. Thanks! Josh August 3, 2012 at 2:15 pm You’re welcome! Simon August 16, 2012 at 10:32 pm Hey josh, look having an issue getting my slides to show at all on my main/home page, used the short code to add it, a box seems to appear, but, no pictures, i foloowed the instructions to a tea till late last night no results at all to get anything, got up this mornin re did it, got the box which seems to be the right hight/ width, but no images will appear. I have been trying other slideshow scripts, maybe theres conflict, maybe its cause its 1.5, and im using the latest WP, but came across yours and liked it so much I thaught id try it, anyhows got any brainy ideas to whaT i might be doin wrong Josh August 18, 2012 at 12:56 pm Hi Simon, this could be a theme conflict, the slides might just be hiding. Can you post a link? Mike August 17, 2012 at 3:22 am Hi Josh, I’m having trouble getting the appearance size to change. I have the settings adjusted to the desired size and have tried some of the possible solutions to similar issues in this comment section but having no luck. What am I missing? Thanks in advance for your help! The link to the page I’m using this is http://174.132.168.6/~beegredd/cremationsociety-wi.com/facility/ Mike August 17, 2012 at 1:10 pm I forgot to add that I’m wanting to change the size settings to 432H x 616W. Josh August 18, 2012 at 12:57 pm Hi Mike, the slide images are sized when they are uploaded. Did you changed the dimensions after uploading the slides? Try re-uploading the slide images. Mike August 20, 2012 at 12:34 am Thanks Josh, it’s working! Is there a way to add play and pause navigation buttons at the bottom or below the slide show? Josh August 20, 2012 at 11:36 am Yes, you can add a pause button with some customizations. olexisomar August 27, 2012 at 11:20 am Hi Josh, I want to have different amount of slides in two different sliders, How can I do it? Ok I got an slider on the header which show 5 slides but I want to have another slide that show all my Images not sure if this can be done but if is possible can you help me to get it going? Thanks in advance. Best regards, Olexis Josh August 29, 2012 at 3:17 pm Hi Olexis, set the slideshow quantity to match the slideshow with the most slides. If you have a header one with 5 and an about one with 10, set it to 10. Then for the header, specify that slideshow and only add the 5 slides to that slideshow. Then for the about slideshow specify the about slidewshow and add the 10 slides to that one. Ano Wesu September 5, 2012 at 1:29 pm Hey Man, Dope Plugin! Been using it for a year. One Problem though. i changed to a mobile template for mobile devices, and the slides show up too big on the mobile device. (they are fine on my PC). link: sev.coop i tried this: [meteor_slideshow slideshow="my slide name" metadata="height: auto, width: auto"] but my jquery dropdown menu stops working for that page when i do use that tag. (even though the images begin to show up correctly on the mobile device.) may be a conflict? i also read that your version 1.5 supports fluid sizing, but its not resizing when i browse my site from a mobile device. link again: sev.coop Thanks for any help. Josh September 6, 2012 at 1:01 pm Thanks Ano! It won’t work with the height and width set to auto, it has to be a specific number value, so it is breaking the slideshow’s JavaScript on that page. You shouldn’t have to change the dimensions though, it will scale to fit the browser if the theme is also scaling. If it isn’t scaling properly the most likely problem is that the theme isn’t fully scaling, like the container that it is in is larger and the slideshow is scaling to fill it. I can’t test the mobile version, it isn’t showing up on my Android mobile, how are you handling the mobile version, with a plugin? Ano Wesu September 7, 2012 at 10:16 am thank you for the info on the “auto” setting. im using the “any mobile theme switcher” plugin atm. as far as why my slides arent scaling, i guess i can try a different “mobile-ready” wp theme. im not so much worried about the theme i use, just if it works. i can edit the css later. the current theme does scale itself because other photos are showing up correctly. just not the slideshow. i looked at it on 2 androids, an iphone, and an itouch. i appreciate the help Ano Wesu September 7, 2012 at 6:33 pm whadup! hey man you were right about the container, thanks! i figured out that the slides are resizing but it depends on the device’s portrait screen size. my android: when i have it positioned in portrait it doesnt shrink far enough because of the container (like you said). BUT when i position it to landscape everything is fine. MIL GRACIAS. the world needs you Josh September 11, 2012 at 4:26 pm Good to hear that you got it figured out! Ano Wesu September 5, 2012 at 1:42 pm oh, and this is an example of the blank slideshow on a page, along with my dropdown menu not working: sev.coop/test gracias Cornelis September 11, 2012 at 7:51 am Hi Josh, Thanx for your great work. Meteor Slides is a great enhancement for site I am working on. There is however one issue I cannot resolve. it has to do with horizontal alignment of the slider… When I make a slider with only one image. The slider is aligned in the centre of my post. When I add an image to the slideshow the slider is aligned on the left of my post. Do you have an idea how to solve this behavior. In my case, the slider with 2 or more images has to be aligned in the centre '''
