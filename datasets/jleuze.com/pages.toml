title = "A new look for Meteor Slides | Josh Leuze"
description = """
Meteor Slides 1.4 features a new slideshow design, support for the Members plugin, custom slideshow script support, and several new and updated translations.

I recently created a GitHub reposito…"""
full_description = '''August 31, 2011 / Josh Leuze / 73 Comments Meteor Slides 1.4 features a new slideshow design, support for the Members plugin, custom slideshow script support, and several new and updated translations. Meteor Slides has been busy since version 1.3.3 was released. The number of downloads doubled to over 40,000 with nearly 80 ratings and many generous donors have also helped to keep my coffee cup full, thanks! I recently created a GitHub repository for Meteor Slides; drop by if you’d like to fork, pull, watch, or otherwise fiddle with my plugin. A new slideshow skin The most noticeable change in version 1.4 is a new skin for the slideshow. The new navigation arrows and paged buttons improve the visibility on a wider range of backgrounds and just freshen things up a bit. See it in action on the plugin homepage. These updates should enhance the navigation’s usability without being too drastic of a change visually. But no one has to switch the design of the slideshow on their site. I have packaged up the original design as a slideshow skin called Retrograde that you can drop into the theme to use the original design. Keep an eye out for more slideshow skins, I have a few on the drawing board that I will release soon. Members plugin support You might be able to tell from my plugin, but I don’t like to add functionality to themes when there is an awesome plugin that could be used instead. The same goes for adding functionality to plugins! Allowing users to control which roles have access to Meteor Slides has been on my GitHub issues list for a while now. This could be built into my plugin, but that adds complexity that most users don’t need and deviates pretty far from the plugin’s purpose. And there is already an awesome plugin for managing users and roles called Members. Justin Tadlock’s Members plugin is one of the few plugins I use on nearly every site I build. With Members it is simple to customize a role for a client that has just the capabilities they need to create a better user experience. I knew I wanted to extend those custom roles to include Meteor Slides capabilities as well. My first attempts at supporting Members didn’t work out, but thanks to Justin’s book, Professional WordPress Plugin Development, which he co-wrote with Brad Williams and Ozh Richard, I was able to get it working great! Adding support for the Members plugin is the most noticeable improvement, but there are a lot more behind the scenes. I added uninstall functionality for plugin options, moved the admin functions to a separate file, re-organized the plugin, and really improved the code overall. If you want to write awesome WordPress plugins, this is the book to get! Custom slideshow script I have extended Meteor Slide’s support for custom stylesheets and templates to include slideshow scripts as well. This should rarely be needed, but is handy if you need to heavily customize the paged navigation. Check out the documentation on custom slideshow scripts to learn more. More translations Meteor Slides is now available in fifteen languages thanks to the kindness of these translators! Hebrew: Translation by Ariel Klikstein Japanese: Translation by COCOM Polish: Translation by Marcin Pronobis Portuguese: Translation by Hugo Baeta Russian: Translation by Boris Homiakov Updated Swedish: Translation by Simon Wämmerfors Download Meteor Slides from WordPress.org Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Meteor Slides, WordPress Tags: skin, slideshow, translation Previous Post: Headed to WordCamp Chicago this weekend Next Post: Using the Members plugin with Meteor Slides Join the conversation! 73 Comments dartisan September 6, 2011 at 5:32 am Hi, It looks great, good work! I’m just getting it up and running for the first time, on a test site (using the Thesis theme) and I need to customize the slideshow template (to include an excerpt and title), however I see no sign of in the meteor-slides-plugin.php. Has something changed or am I misinterpreting the guidance on your site? Thanks. dartisan September 6, 2011 at 5:36 am …the answer is: yes, I am misinterpreting it, and opened the wrong PHP clearly! Apologies, thanks again for a great looking plugin. Josh September 6, 2011 at 9:30 am Thanks! That’s right you need to edit the meteor-slideshow.php file which is now hidden in the includes folder. Glad to hear you got it figured out. Ciprian September 8, 2011 at 2:22 am Hi, Great plugin, thank you. I use “Meteor Slides” on many sites and work perfectly everytime, whenever the theme I use. I have a little question. Is there a simply way (a metadata or something to modify in CSS) to hide titles of images when hovering above the slide? I use “Meteor Slides” often in header of sites and I don’t wish to see titles of pictures here. I find a workaround and upload a transparent image positioned absolute with a z-index above the slideshow, but I wondering is’nt a simplier way. Thank You Josh September 8, 2011 at 12:11 pm Hi Ciprian, thanks for the kind words! Yes, you can remove the title tooltip for the images using a custom slideshow template. The trick is that “the_post_thumbnail” function for the slide images loads the whole image tag, so it is difficult to edit. But if you get just the URL of the slide image, you can make your own image tag without a title to remove the tooltip. Here is the code you need to do this. This replaces everything within the “mslide” div container which starts on line 103: <?php // Get just the URL for the slide featured image $featuredslide = wp_get_attachment_image_src( get_post_thumbnail_id($GLOBALS['post']->ID), 'featured-slide' ); ?> <?php // Adds slide image with Slide URL link if ( get_post_meta( $post->ID, "slide_url_value", $single = true ) != "" ): ?> <a href="<?php echo get_post_meta( $post->ID, "slide_url_value", $single = true ); ?>"><img src="<?php echo esc_attr($featuredslide[0]); ?>" alt="<?php the_title(); ?>" /></a> <?php // Adds slide image without Slide URL link else: ?> <img src="<?php echo esc_attr($featuredslide[0]); ?>" alt="<?php the_title(); ?>" /> <?php endif; ?> Ciprian September 9, 2011 at 12:57 am Thank you very much Josh, working perfect. But is not the first time when I learn something for you – with Meteor Slide and Weaver I learn about z-index, the plugin is very well documented and maintained and your tutorials let me say just: “AHA, thats the way it works things” 🙂 Best Regards, Ciprian Josh September 9, 2011 at 10:49 am No problem Ciprian, I’m glad that you’re learning something from my posts! jerry lucas September 14, 2011 at 4:44 pm I messed up and need help fixing it. I added a slideshow and them tried to make it a child of a parent but that not only didn’t work, but it gave me two slideshow categories with the same name and a “parent” tied to only one… but who knows which since they are the same. How cam I delete my slideshow categories (not the slides) and start over? Josh September 15, 2011 at 9:51 am Hi Jerry, you can go to Slides -> Slideshows and edit or delete any of the slideshows without affecting the actual slides. myinthtwe September 15, 2011 at 8:18 am Meteor Slides different dimensions? wordpress version 3.2.1 meteor slides plugin version 1.4 i using short code. but not change. How can i try? Best Regards, myint Josh September 15, 2011 at 9:53 am Hi, are you using metadata in the shortcode to resize the slideshow like this: [meteor_slideshow metadata="height: 100, width: 200"] myint September 21, 2011 at 8:57 pm i need function_exists code inside width and height; Josh September 21, 2011 at 10:19 pm Are you saying that you want to add metadata for height and width to the template tag, or am I misunderstanding you? myint September 21, 2011 at 10:36 pm yeath, i want add metadata in customize width and height “( function_exists( ‘meteor_slideshow’ ) ) { meteor_slideshow(“test”,”width: 100 height: 150″);” Josh September 21, 2011 at 11:28 pm Try it with the metadata options separated by commas: ( function_exists( ‘meteor_slideshow’ ) ) { meteor_slideshow(“test”,”width: 100, height: 150″);” myint September 22, 2011 at 4:02 am thank. my theme is twentyten. i put your plugin banner and sidebar on one page. banner size is use 980×198 plugin setting. sidebar size is 200×500. i also create two category slideshows. banner size can control plugin setting and customize metadata. i upload sidebar image 200×500 and using customize metadata function_exists( ‘meteor_slideshow’ ) ) { meteor_slideshow( “left-slideshow”,”width: 200, height: 500″); but display image is 200×198 link is /uploads/leftside-200×198.jpg Josh September 22, 2011 at 10:23 am This is because the slide images are cropped to fit within the dimensions on the settings page. So if that page has the height set at 198px, any images taller than that will be cropped to 198px. If you want to have slideshows with different heights and widths, make sure that the settings match the highest and widest slideshows so that none of the images are cropped. However you will then have to set the height and width of each slideshow using metadata. Don’t forget to re-upload your images after changing the settings, the images are only cropped when they are uploaded. myint September 23, 2011 at 12:52 am Thank Josh. I try it? myint September 23, 2011 at 2:06 am Great plugin, I got it. thank you. Josh September 23, 2011 at 9:46 am Thanks, no problem! Bruce Scott September 21, 2011 at 11:39 am Hi. It’s not very clear where this code should go in the 2011 template. Can you help? Cheers. Josh September 21, 2011 at 12:04 pm Hi Bruce, it depends on where you want the slideshow. Do you want it to replace the header image? Just the homepage, or all pages? Bruce Scott September 21, 2011 at 12:12 pm I want it to replace the header for all pages but I’m really struggling – the file sizes are 958×332 Can you help? Josh September 21, 2011 at 12:21 pm Sure, in the header.php file of Twenty Eleven, there is a chunk of code that loads the images. It starts on line 78, and ends on line 97, remove that code and replace it with the slideshow template tag: <?php if ( function_exists( 'meteor_slideshow' ) ) { meteor_slideshow(); } ?> Bruce Scott September 21, 2011 at 12:30 pm looks like i’ve got a different line 78-97 because I’m just getting a blank page. Can you include the code I have to replace? Josh September 21, 2011 at 6:34 pm You could probably just remove the header image in the theme header options and then add the slideshow right above the nav: <nav id="access" role="navigation"> Angelo September 24, 2011 at 11:52 am Hello Josh I appreciate your plugin. Congratulations. Could you add in the next version navigation with the numbers? Something like that http://img695.imageshack.us/img695/6666/asdasdfu.jpg It would be very useful! Thanks Josh September 24, 2011 at 12:27 pm Thanks Angelo! The good news is, the paged navigation buttons are numbered, the default slideshow skin just hides the numbers and uses a graphic instead. If you inspect them with Firebug, you’ll see the numbers. You can use a custom stylesheet to reveal the numbers by removing this rule: text-indent: -9999px; Angelo September 24, 2011 at 3:16 pm Thank you. I tried but graphically the result is not very nice. The numbers are placed over the image and this is a problem. Ehm….I’m not very good with css. It would be nice if you could include this mode in the settings panel. Josh September 25, 2011 at 12:51 am Yeah you do need to play around with the CSS a bit. I’m planning to make some slideshow skins that could be used as a starting point for creating custom slideshows. Here is an CSS example that looks a little better with the numbers showing: .meteor-buttons a { background: #333; color: #fff; display: block; float: left; height: 10px; line-height: 10px; margin: 0 3px 0 0; outline: none; padding: 3px; text-align: center; text-decoration: none; text-indent: 0; width: 10px; } .meteor-buttons a:hover, .meteor-buttons a.activeSlide { background: #666; } Angelo September 26, 2011 at 8:34 am I’m planning to make some slideshow skins that could be used as a starting point for creating custom slideshows. It’s really a great idea!! More options will make the plugin more flexible and valuable. I have now changed the css and I got this. http://img685.imageshack.us/img685/3369/sdsav.jpg If I wanted a black frame like this your example http://www.jleuze.com/wp-content/uploads/awesome-new-meteor-slides-navigation.jpg What should I add to the css? Thank you very much for your kindness Josh September 26, 2011 at 2:40 pm The black in that image is actually the background color of the page. You could add that to the slideshow like this though: .navpaged, .navboth { background-color: #D0D0D0; padding: 11px 11px 21px;; } .mslide { margin: 10px; } Angelo September 27, 2011 at 2:56 pm Hi Josh I have applied your modification but the images were decentred against the background. I have made some tests with css and i have find the solution for the symmetrical frame. It’s this http://img11.imageshack.us/img11/1633/eheher.jpg Thanks very much Josh, I hope to see some skins implemented in the plugin. Best regards Josh September 27, 2011 at 3:02 pm No problem Angelo, expect to see some new slideshow skins soon! Brian M October 4, 2011 at 6:52 pm Wow, I’m glad I finally found this WordPress slider. It’s got great built-in features and I’m finding it mostly easy to customize. Hope you can help me with a question… I’m using this slider on a WordPress theme that I am designing to be completely mobile-friendly by setting max-width’s and then if the browser/device is smaller then the max width everything shrinks and adjusts to fit, even some images are set with variable width/height options. I’ve figured out how to make the slider width vary, and also the slider images width and height vary, but the height of the slider box is not varying. Any ideas how to get a variable height slider box. Josh October 4, 2011 at 7:13 pm Thanks for trying my plugin Brian. I just built a responsive theme for a project that was also using Meteor Slides and I was able to make the slideshow responsive, so it is doable! This forum post is a good place to start, and the demo helps too. You need to use a custom slideshow template and add a dummy image to the slideshow so that it has some inline content that can scale properly. You don’t need to edit the slideshow script though, just using a custom stylesheet should be enough. Brian M October 4, 2011 at 9:44 pm Thanks for the response. I looked at that forum post and demo and tried some things but nothing is working to give the slider a variable height. Josh October 4, 2011 at 10:02 pm I could check it out if you can post a link to the site you are working on. Petr November 13, 2011 at 11:41 am Hi Josh, i have the same Probleme like Brian. Have you any solution? Thanks Josh Novembe'''
