full_description = "Speaking at WordCamp Minneapolis / St. Paul 2018 August 24, 2018 / Josh Leuze / No Comments This year I will be talking about Building Better Themes at WordCamp MSP. I will be in the Swain room first thing Friday morning talking all about themes. You can check out the slides for my talk, or the starter theme Regolith on Github. I’m looking forward to spending some time in the Happiness Bar as well, if you see me stop by and say hi! Small Meteor Slides update for Members plugin June 17, 2016 / Josh Leuze / No Comments I have one more small update for Meteor Slides, version 1.5.6, which includes updated support and functionality for the latest version of the Members plugin. Read More Speaking at WordCamp Minneapolis 2016 May 20, 2016 / Josh Leuze / No Comments We’ve been busy organizing WordCamp Minneapolis and this is the big weekend! I’m speaking about Classy Theming & Getting Granular on Foundation Friday in the Intro to Design track. Read More Meteor Slides update for WordPress 4.4 & Twenty Sixteen December 11, 2015 / Josh Leuze / 9 Comments I just released Meteor Slides 1.5.5. This is a small update that adds support for responsive images using srcset in WordPress 4.4 and fixes some Twenty Sixteen theme conflicts. Read More Building Better Themes July 25, 2015 / Josh Leuze / No Comments At WordCamp Milwaukee 2015 I talked about building better themes. We talked about theme design, theme development standards, coding best practices, Retina and responsive styling, and theme optimization. Check out my slides, or the starter theme, Regolith, on GitHub."
