description = """
On Friday I will be in Omaha for their first WordCamp. I’m glad to see more WordCamps happening in the Midwest, especially since WordCamp MSP didn’t happen this year.

Update: It look…"""
full_description = "November 14, 2011 / Josh Leuze / 5 Comments On Friday I will be in Omaha for their first WordCamp. I’m glad to see more WordCamps happening in the Midwest, especially since WordCamp MSP didn’t happen this year. Hopefully 2012 will bring even more WordCamps to the area! Update: It looks like WordCamp Omaha didn’t happen this year either, better luck next year… Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: WordPress Tags: event, wordcamp Previous Post: Adding multiple slideshows with different sizes Next Post: Create responsive slideshows with Meteor Slides 1.5 Join the conversation! 5 Comments Terminator January 23, 2012 at 6:15 am Hi there, congrats on ur being to wordcamp. I need a slight help, that is where should i place the code: to activate the slider as the header slider of my wp web. I am using the following theme: Twenty Eleven 1.3. Josh January 23, 2012 at 1:23 pm Thanks, but this WordCamp was postponed so I haven’t been able to go yet. But I’m hoping to make it to WordCamp Omaha and a few others this year! Take a look at this thread in the support forums for more info on adding a slideshow to your header in Twenty Eleven. Terminator January 24, 2012 at 12:32 am Thanks bro, i will not insult you by giving thanks!!!, anyway the thread worked just cool. One more thing, should i go thorough the same process for all other themes to make it as header slides? Josh January 24, 2012 at 1:04 am No problem, that info is only valid for Twenty Eleven. Added it to other themes will be similar, but not the same. The first thing I would check for in other themes is a header widget area. Meteor Slides has a slideshow widget, so that would be the easiest way to add a slideshow if the header uses widgets. Speaking at WordCamp Minneapolis 2014 | Josh Leuze April 24, 2014 at 3:39 pm […] But it sounds like there might finally be a WordCamp Omaha in 2014, which is great news since it fell through last […] Comments are closed."
