["https://jleuze.com/blog/page/6"]
title = "Blog | Josh Leuze | WordPress Developer | Page 6"
description = "WordPress Developer"
full_description = "I’ll be at WordCamp Omaha this week November 14, 2011 / Josh Leuze / 5 Comments On Friday I will be in Omaha for their first WordCamp. I’m glad to see more WordCamps happening in the Midwest, especially since WordCamp MSP didn’t happen this year. Hopefully 2012 will bring even more WordCamps to the area! Update: It looks like WordCamp Omaha didn’t happen this year either, better luck next year… Adding multiple slideshows with different sizes October 27, 2011 / Josh Leuze / 340 Comments Meteor Slides users often ask how to create multiple slideshows with different sizes. Here is a tutorial which will show you how to do this using multiple slideshows and metadata. Let’s say you need two slideshows on your site. The larger slideshow, Jupiter, is 500×200 and the smaller slideshow, Mercury, is 300×150. Read More Using the Members plugin with Meteor Slides September 23, 2011 / Josh Leuze / 15 Comments One of the new features in Meteor Slide 1.4 that needs covering in more detail is support for the Members plugin. Using Members, you can control which roles can create and edit slides and slideshows, and which can change the slides settings. By default slide posts use the same capabilities as blog posts and only admins can change the slide settings. So admins, editors, and authors can create new slides, and contributors can create slide post drafts. This is straightforward, but not exactly ideal. Most of the time I only want the admin and editor to create and edit slides. And what if you want to give an editor access to the settings? This is where Members comes in handy. Read More A new look for Meteor Slides August 31, 2011 / Josh Leuze / 73 Comments Meteor Slides 1.4 features a new slideshow design, support for the Members plugin, custom slideshow script support, and several new and updated translations. Meteor Slides has been busy since version 1.3.3 was released. The number of downloads doubled to over 40,000 with nearly 80 ratings and many generous donors have also helped to keep my coffee cup full, thanks! I recently created a GitHub repository for Meteor Slides; drop by if you’d like to fork, pull, watch, or otherwise fiddle with my plugin. Read More"
