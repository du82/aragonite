title = "Using Metadata | Josh Leuze"
description = "With Metadata, classes can be added to the slideshow, which are dynamically applied as commands to the slideshow. Metadata can be used to override the global slideshow settings and use different se…"
full_description = '''With Metadata, classes can be added to the slideshow, which are dynamically applied as commands to the slideshow. Metadata can be used to override the global slideshow settings and use different settings on specific slideshows. Metadata can also be used to configure additional jQuery Cycle options which are not available on the Meteor Slides settings page or to change the slideshow alignment. When using metadata, only values which are strings should use single quotes, other types, such as the integers and booleans, should be used without single quotes. Adding Metadata Template Tag Here is an example of a slideshow template tag that just changes the transition to zoom: <?php if ( function_exists( 'meteor_slideshow' ) ) { meteor_slideshow( "", "fx: 'zoom'" ); } ?> This tag loads the robots slideshow and uses the zoom effect: <?php if ( function_exists( 'meteor_slideshow' ) ) { meteor_slideshow( "robots", "fx: 'zoom'" ); } ?> Shortcode And this is how the shortcode that changes the transition to zoom would be formatted: [meteor_slideshow metadata="fx: 'zoom'"] Here is a shortcode example for the robots slideshow with the zoom effect and random slides: [meteor_slideshow slideshow="robots" metadata="fx: 'zoom', random: 1"] Widget The widget has the same format as the template tag, add the metadata to the “Metadata” field in the widget: fx: 'zoom', random: 1'''
