full_description = "April 21, 2015 / Josh Leuze / 2 Comments We’ve been hard at work getting ready for WordCamp Minneapolis this weekend and I think it will be the best one yet! The schedule is packed with great sessions, we’ve got a Mexican buffet lined up for lunch, and some awesome looking swag courtesy of Westwerk and Marktime Media. My session is called Building Your First Functionality Plugin and I’ll be talking about what should be in a WordPress theme, and what should be in a plugin. This will be an intro to building plugins for new developers and will also cover how a functionality plugin might differ from a standard plugin. Minneapolis should be a great start to another year of awesome WordCamps, I hope to see some of you there! Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: WordPress Tags: event, msp wordpress, wordcamp Previous Post: A small Meteor Slides update Next Post: Building Your First Functionality Plugin Join the conversation! 2 Comments Sue May 27, 2015 at 7:23 pm Hi Josh, I’m new to WordPress and am starting an online business. I would like to attend the user group tomorrow night but don’t know if my questions would be appropriate for that venue. Is there a WordPress plug-in that allows a user to enter search criteria for events (e.g. locally, regionally, statewide and nationally)? Have you ever interfaced WordPress with RegOnline software? Josh May 27, 2015 at 8:09 pm Hi Sue, you should definitely come to the meeting tomorrow night! All levels of WordPress users are welcome and I’m sure that someone there will be able to help you out with this. There are a few different ways to do custom searches with WordPress, it depends on exactly want you are trying to do. Comments are closed."
