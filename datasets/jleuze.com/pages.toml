["https://jleuze.com/using-wordpress-for-project-management"]
title = "Using WordPress For Project Management | Josh Leuze"
description = """
At WordUp Minneapolis 2014 I gave a talk on using WordPress for project management.

In this session I talked about building a simple project management app with WordPress using the P2 theme and …"""
full_description = "October 18, 2014 / Josh Leuze / 6 Comments At WordUp Minneapolis 2014 I gave a talk on using WordPress for project management. In this session I talked about building a simple project management app with WordPress using the P2 theme and a handful of plugins. With this app you can create to do lists, check off those tasks, and mark posts as unresolved or resolved. The base of this tool is the P2 theme, which allows you to easily make new project posts from the frontend of the site. This theme is extended with P2 Resolved Posts, P2 New Post Categories, and a custom plugin of mine called P2 Projects. I also use the Members plugin to make the site private. With the P2 Resolved Posts plugin posts can be marked as resolved or unresolved, P2 Projects marks new posts as “unresolved” automatically and adds a category widget for filtering unresolved or resolved project posts. The P2 New Post Categories plugin adds a dropdown to the front end post editor for selecting a category for the project posts. Setup Video Tutorial Watch this screencast and learn how to build this app step-by-step. I have used many different tools for project management over the years: a legal pad and a pen, ancient FileMaker programs, and pretty much every web app out there from Basecamp to Trello. Ultimately these are all, aside from a pad and pen, overkill for my own use as a freelancer. By using WordPress I was able to cut out another monthly expense and build something that was tailored specifically to my needs. This solution might not be right for you, but the beauty of WordPress is that it doesn’t have to be, you can get in there and build your own perfect app! Share this post!Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Google+ (Opens in new window) Category: Tutorials, Videos, WordPress Tags: event, msp wordpress, widget Previous Post: Meteor Slides updated for WordPress 4.0 Next Post: A small Meteor Slides update Join the conversation! 6 Comments Using WordPress For Project Management | Josh Leuze | Stan Waring's Blog December 13, 2014 at 7:01 am […] Using WordPress For Project Management | Josh Leuze. […] Stephen P Crump March 30, 2015 at 9:56 pm Pretty awesome tutorial! Thanks! Josh March 30, 2015 at 10:37 pm You’re welcome! Stephen P Crump March 31, 2015 at 2:20 am I got everything to work but the Urgent Projects (pops up in red on the Right Sidebar) example to work for some reason… any ideas? When I did my categories i created a Parent and attached Subcategories to them. See screen capture link below http://cl.ly/image/3M0h0o3j2E03?_ga=1.5359603.1989416350.1427766159 Stephen P Crump March 31, 2015 at 2:27 am Forgot to include Screen Capture of front end http://cl.ly/image/242E0R1L3x3x?_ga=1.135457777.1989416350.1427766159 Josh March 31, 2015 at 3:33 pm This is part of the Unresolved Post Categories widget, if there is a tag called “Urgent” and there are unresolved posts with that tag, it should load the button. Make sure you are using that widget, and that tag. Comments are closed."
