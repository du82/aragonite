["https://jleuze.com/tag/slideshow/page/2"]
title = "slideshow | Josh Leuze | Page 2"
full_description = "Create responsive slideshows with Meteor Slides 1.5 April 26, 2012 / Josh Leuze / 222 Comments Meteor Slides 1.5 adds responsive slideshow support, touch navigation, an improved slideshow widget, new translations, and updates jQuery Cycle. Responsive Slideshows I have been building more responsive websites lately and receiving more and more requests from users for responsive slideshows, so I have updated the slideshows to scale automatically. If you are using a fixed width theme the slideshows will remain unchanged at their original dimensions. But if you are using a fluid or responsive width theme those are used as the maximum dimensions and the slideshow will scale, shrinking to fit the theme on smaller screens and devices. Any custom slideshow templates, stylesheets, or scripts you are using would have to be updated from the default versions in 1.5 to add this responsive functionality. Try resizing the Meteor Slides homepage in your browser to see the responsive slideshow in action! Read More Adding multiple slideshows with different sizes October 27, 2011 / Josh Leuze / 340 Comments Meteor Slides users often ask how to create multiple slideshows with different sizes. Here is a tutorial which will show you how to do this using multiple slideshows and metadata. Let’s say you need two slideshows on your site. The larger slideshow, Jupiter, is 500×200 and the smaller slideshow, Mercury, is 300×150. Read More Using the Members plugin with Meteor Slides September 23, 2011 / Josh Leuze / 15 Comments One of the new features in Meteor Slide 1.4 that needs covering in more detail is support for the Members plugin. Using Members, you can control which roles can create and edit slides and slideshows, and which can change the slides settings. By default slide posts use the same capabilities as blog posts and only admins can change the slide settings. So admins, editors, and authors can create new slides, and contributors can create slide post drafts. This is straightforward, but not exactly ideal. Most of the time I only want the admin and editor to create and edit slides. And what if you want to give an editor access to the settings? This is where Members comes in handy. Read More"
