["https://jleuze.com/tag/msp-wordpress"]
title = "msp wordpress | Josh Leuze"
full_description = "Speaking at WordCamp Minneapolis 2015 April 21, 2015 / Josh Leuze / 2 Comments We’ve been hard at work getting ready for WordCamp Minneapolis this weekend and I think it will be the best one yet! The schedule is packed with great sessions, we’ve got a Mexican buffet lined up for lunch, and some awesome looking swag courtesy of Westwerk and Marktime Media. My session is called Building Your First Functionality Plugin and I’ll be talking about what should be in a WordPress theme, and what should be in a plugin. This will be an intro to building plugins for new developers and will also cover how a functionality plugin might differ from a standard plugin. Minneapolis should be a great start to another year of awesome WordCamps, I hope to see some of you there! Using WordPress For Project Management October 18, 2014 / Josh Leuze / 6 Comments At WordUp Minneapolis 2014 I gave a talk on using WordPress for project management. In this session I talked about building a simple project management app with WordPress using the P2 theme and a handful of plugins. With this app you can create to do lists, check off those tasks, and mark posts as unresolved or resolved. Read More Speaking at WordCamp Minneapolis 2014 April 24, 2014 / Josh Leuze / No Comments I’ve been so busy lately with client projects, helping organize WordCamp Minneapolis, and getting settled into my new office, that I almost forgot to write about it on my own blog! WordCamp Minneapolis 2014 is this weekend, April 26-27th, and I’ll be speaking on Saturday. My talk is called Don’t let your site jump the shark, it’s in the design track and I’ll be talking about using animation on websites successfully. Read More Speaking at WordCamp Minneapolis 2013 March 30, 2013 / Josh Leuze / No Comments I’m speaking at WordCamp Minneapolis next month, my session is called Inspecting WordPress. I’ll be talking about using Firebug or other web inspectors to dig into a site and learn how it is put together, make CSS tweaks, fix bugs, and optimize a site. Several of us from the local MSP WordPress user group have been busy organizing the WordCamp. Everyone’s been doing an awesome job, the schedule, venues, parties, and swag are all coming along nicely. I built the theme, designed by the talented guys at WerkPress, and I’ve been managing the site. We just posted the speakers and sessions, there’s going to be a lot of brainpower to tap into. Read More"
