title = "Research"
full_description = "Research group: Mathematical Modelling Group Research projects I participate or participated in and received some funds from the following research projects: Off-diagonal thermodynamics and its connection with other factors as a route to predictable selectivity in C-H bond cleavage, project no. GA24-11247S of the Czech Science Foundation (2024-2026). Multiphase flow, transport, and structural changes related to water freezing and thawing in the subsurface, project no. 21-09093S of the Czech Science Foundation (2021-2023). Development and application of advanced mathematical modeling methods for natural and industrial processes using high-performance computing, project no. SGS20/184/OHK4/3T/14 of the Grant Agency of the Czech Technical University (2020-2022). Research centre for informatics, project of excellent research no. CZ.02.1.01/0.0/0.0/16_019/0000765, Operational Programme of Research, Development and Education, Ministry of Education, Youth and Sports of the Czech Republic (2018-2022). Computational Models and Experimental Investigation of Fluid Dynamics, Mass Transfer and Transport, and Phase Transitions in Porous Media for Environmental Applications, project Inter-Excelence MSMT no. LTAUSA19021 of Ministry of Education, Youth and Sports of the Czech Republic (2020-2022). Analysis of flow character and prediction of evolution in endovascular treated arteries by magnetic resonance imaging coupled with mathematical modeling, project no. NV19-08-00071 of the Ministry of Health of the Czech Republic (2019-2022). Research centre for low-carbon energy technologies, project of excellent research no. CZ.02.1.01/0.0/0.0/16_019/0000753, Operational Programme of Research, Development and Education, Ministry of Education, Youth and Sports of the Czech Republic (2018-2022). Large structures in boundary layers over complex surfaces under high Reynolds numbers, project no. 18-09539S of the Czech Science Foundation (2018-2020). Investigation of shallow s