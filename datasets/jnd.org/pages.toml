title = "Latest Updates – Don Norman's JND.org"
description = "December 2024 Update on the Don Norman Design Award and Summit (DNDA24) Updated December 4, 2024 The Don Norman Design Award and summit (DNDA) is an international program to advance the development of humanity-centered design education and projects that provide evidence of their capability to make significant enhancements to society. The phrase “Humanity-Centered” emphasizes the…"
full_description = 'About Don Norman Latest Updates About Don Norman Schedule ABOUT NNg Nielsen Norman Group Consulting & talks Discussions, Not Talks Guidelines for writing to me Photographs suitable for publication Select a tab Latest Updates About Don Norman Schedule ABOUT NNg Nielsen Norman Group Consulting & talks Discussions, Not Talks Guidelines for writing to me Photographs suitable for publication Latest Updates December 2024 Update on the Don Norman Design Award and Summit (DNDA24) Updated December 4, 2024 The Don Norman Design Award and summit (DNDA) is an international program to advance the development of humanity-centered design education and projects that provide evidence of their capability to make significant enhancements to society. The phrase “Humanity-Centered” emphasizes the rights of all of humanity and addresses all life plus the earth’s environment. DNDA is a non-profit charity: 501(c)(3) in the United States. I am delighted to announce that the 2024 Don Norman Design Award and Summit (DNDA24) has concluded with an exciting, emotional, and educational Summit on November 14 and 15, 2024. Over 200 people attended from multiple countries (entries came from 26 countries). The 2025 summit (DNDA25) will be held in Singapore, November 19-21, 2025. Details about the award process including application forms are now being developed. The spirit will be the same as in 2024 (as described below), but the details will change. We hope to have this information on the DNDA website (https://dnda.design) in early January. Awards and Recognition Awards to early-career groups Recognition to educational and other relevant groups and organizations An international summit for humanity-centered design education groups and projects Don Norman Design Award (DNDA) is a global platform for early-career practitioners and educational organizations to showcase projects that profoundly impact society and then, to host an international summit for all groups that are working to benefit society through Humanity-Centered Design. What kinds of projects? See the United Nations’ list of 17 Sustainable Development Goals at https://sdgs.un.org/ (and read deeply into the numerous specialized websites branching off from that site). All entries in all the categories (see the list below), must address one of the UN’s SDGs and use Humanity-Centered Design principles (HCD+). See the DNDA website at https://dnda.design for more details. The awards celebrate early career professionals. In addition, recognition is given to HCD+ educational groups that train people who work on or who educate others on societal projects. We also recognize the work of organizations that help early career investigators, as well as special recognition to groups that fit the spirit of DNDA but do not fit into the standard categories. The summit brings together international groups and programs that engage in Humanity-Centered education for societal projects, enabling all to share insights and experiences as well as to honor each year’s recipients of awards or that receive recognition. Our mission is to champion humanity-centered design, emphasizing the rights and well-being of all people and the shared ecosystem of the planet. Categories of Awards and Recognition Awards: Groups receiving awards receive a trophy, certificate, and a monetary gift Early Career Projects. HCD+ work by early career groups that provide evidence for accomplishing societal good Recognition: Groups that receive recognition for accomplishments in HCD+ receive a certificate HCD+ Education. Groups that train HCD+ practioners, with graduates who do HCD+ projects or education. HCD+ Organizations. Groups that assist early career individuals Special Recognition. Groups whose HCD+ approach to societal needs that fit the spirit of DNDA but do not qualify for any of the categories listed above. All applications are reviewed by an international committee of jurors. Related console.log("PHP: 16") You may also like