full_description = "Essays & Articles Back All Essays Ask Don Automobiles Core77 DBW Sustainability Design Education Emotion & Design Good Design Inspiration Interaction Articles Interviews LinkedIn Articles People Recommended reading Technology & Society Television Video SELECT CATEGORY AllEssaysAsk DonAutomobilesCore77DBWDesignEducationEmotion & DesignGood DesignInspirationInteraction ArticlesInterviewsLinkedIn ArticlesPeopleRecommended readingTechnology & SocietyTelevisionVideo April 12, 2023 A video and text summary of Design for a Better World: A talk for McKinsey & Company /https://www.mckinsey.com/featured-insights/mckinsey-on-books/author-talks-don-norman-designs-a-better-world I thought that McKinsey did an excellent job of summarizing a video conversation I had with them for anyone interested in a quick overview of my book Design for a Better World. Here is how they describe the article they produced: The former Apple VP and University of California Design Lab director explains why leaders should take the “humanity-centered” approach and adopt sustainable technologies and business models. In this edition of Author Talks, McKinsey’s Ben Sheppard chats with researcher, professor, and former executive, Don Norman, about his new book, Design for a Better World: Meaningful, Sustainable, Humanity Centered (The MIT Press, 2023). From collaborating with generative AI to building a minimal-waste circular economy, Norman builds on the foundation of human-centered design to project the next phase of sustainable innovation and answer the question, “What can we do to make a difference for the entire world?” An edited version of the conversation follows. Related Back You may also like books books Design for a Better World The Design of Everyday Things, Revised and Expanded Edition Living with Complexity Emotional Design: Why We Love (or Hate) Everyday Things View more books"
