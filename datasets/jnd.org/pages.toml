full_description = 'Engineers and business executives are good at solving problems, but they seldom ask if it is the correct problem. Human- and humanity-centered designers are trained to address the core, underlying factors, not just the symptoms. Design must change from being unintentionally destructive to being intentionally constructive Failures? No — Learning Experiences We scientists (and designers) learn from our failures. In fact, scientists seldom fail. Instead, they say “that didn’t work. Time to try something new.” I prefer never to talk of failure. Instead, I say “that... Simplicity is in the mind, complexity is in the world. If you understand something, then even things that are complex become simple. The complexity of the product must match the complexity of the task. I learn more by being wrong than by being right When people praise my ideas it is nice to hear, but I don’t learn anything. If people disagree, I learn. If they convince me, I am thankful and I change. If I believe I was... If you can think of a clever solution in a few hours, assume many others have already done so If you can think of a clever new concept or solution to an existing problem in a few minutes or hours, then you should recognize that many people all over the world, many who have... Make it Simple? No! Make it Understandable. Make it Simple? No! Make it Understandable. When people make things "simple" by minimizing controls, they make it much more difficult to work or to understand. Simplicity is in the mind, Complexity is in the world. Why? Things you understand are simple. It is the designer’s job to take complex requirements and make them so understandable and appropriate that they are pronounced “simple.” The universe is made of stories, not atoms A quote from the poet Muriel Rukeyzer’s book “The speed of darkness.” Why stories? Because they combine history and context, critical events and results, both good and bad, expected and unexpected all linked through causal... You are being too logical, I often tell engineers and executives. “You are being too logical,” I explain. “People are not logical. Logic is artificial. It was invented by mathematicians and philosophers. It is not how people think, which is why it is so difficult for... Design for people the way they are, not for how you want them to be. The Don Norman Design Award and Summit (DNDA24) I am delighted to announce that the 2024 Don Norman Design Award and Summit (DNDA24) has concluded with an exciting, emotional, and educational Summit on November 14 and 15, 2024. The 2025 DNDA25 Summit will be held in Singapore. See more at https://jnd.org/about-don-norman/latest-updates/ Essays & Articles Praise for Design for a Better World Essays “Don Norman joining the movement for…” Don Norman joining the movement for responsible and sustainable design brings considerable heft to the demand for design to transform from a user-centric focus to serving society and the... May 29, 2023 2 minutes read Podcasts and articles DBW The former Apple VP and University of California Design Lab director explains why leaders should take the “humanity-centered” approach and adopt sustainable technologies and business models. April 19, 2023 1 minute read Design for a Better World: Excerpts and videos from the Interaction Design Foundation (IxDF) DBW Excerpts from my videos of IxDF on Design for a Better World. Plus a highly recommended video on the history of participatory design by Victor Udoewa. April 17, 2023 3 minutes read Where did the term User Experience (UX) come from? Design Where did the term User Experience come from? When I joined Apple in 1993, my first title was “Apple Fellow,” which was a very high position that gave me absolute freedom to do anything I... April 15, 2023 5 minutes read GPT-4: We Are in a Major Technological Change Design Yes, there has been much hype over the imagined powers and flaws of the new Large Language Models (e.g., Chat GPT-4), but the recent advances (that is, as of today in April 2023) indicate that there is a major transformation taking place that everyone needs to pay attention to. I call your attention to a brilliant article and an engaging video talk about the major accomplishments. April 12, 2023 3 minutes read A video and text summary of Design for a Better World: A talk for McKinsey & Company DBW I thought that McKinsey did an excellent job of summarizing a video conversation I had with them for anyone interested in a quick overview of my book Design for a Better World. April 12, 2023 1 minute read View more essays & articles Design for a Better World Meaningful, Sustainable, Humanity Centered Find out more Videos View more vidoes You Can Find More Videos of Mine on the Internet I have far too many Videos and Podcasts to post. In fact, so many, that I can’t even remember them all. So, if you want them, simply go to your favorite search engine and type “Don Norman videos” or “Don Norman podcast” Vox media hated their doors, so they visited me to understand why. They produced this 5 minute video that has been watched over 11 million times (as of March 2023). A 1-minute video jointly made by the Nielsen Norman Group and the UC San Diego Design Lab. Another title might be, “Why design education must change.” A 12 minute TED talk: Emotional Design (3 ways good design makes you happy) (over 2 million views as of march 2023) A 2 1/2 minute video on how the new, generative design tools from AI are valuable collaborators for human activity. This is an extract from an Interaction Design Institute course. I can’t embed the video here because it is on the IxDF site, but you can see it there: https://www.interaction-design.org/literature/topics/ai Videos from my course “Design for a Better World” at the Interaction Design Foundation Sustainable Design https://www.interaction-design.org/literature/topics/sustainable-design Circular Economy https://www.interaction-design.org/literature/topics/circular-economy Incremental Modular Design https://www.interaction-design.org/literature/topics/incremental-modular-design Books View more books Design for a Better World Meaningful, Sustainable, Humanity Centered Read more about this book The Design of Everyday Things, Revised and Expanded Edition Read more about this book Living with Complexity Book overview Published: May 2010 If only today’s technology were simpler! It’s the universal lament, but it’s wrong. We don’t want simplicity. Simple tools are not up to the task. The world is complex; our... Read more about this book Emotional Design: Why We Love (or Hate) Everyday Things Book overview Published: 2004 Did you ever wonder why cheap wine tastes better in fancy glasses? Why sales of Macintosh computers soared when Apple introduced the colorful iMac? New research on emotion and cognition has... Read more about this book The Design of Future Things Book overview Published: 2007 In The Design of Future Things, best-selling author Donald A. Norman presents a revealing examination of smart technology, from smooth-talking GPS units to cantankerous refrigerators. Exploring the links between design and... Read more about this book The Invisible Computer Book overview Published 1998 Technologies have a life cycle, says Donald Norman, and companies and their products must change as they pass from youth to maturity. Alas, the computer industry thinks it is still in... Read more about this book Things That Make Us​ Smart: Defending Human Attributes in the Age of the Machine Book overview Published 1994 In Things That Make Us Smart, Donald A. Norman explores the complex interaction between human thought and the technology it creates, arguing for the development of machines that fit our minds,... Read more about this book Turn Signals Are the Facial Expressions of Automobiles Book overview From water faucets and airplane cockpits to the concept of “real time” and the future of memory, this wide-ranging tour through technology provides a new understanding of how the gadgets that surround us... Read more about this book The Design of Everyday Things (first edition) Book overview Published 1986 (re-issued 2002). 2013 revised edition. The Design of Everyday Things (DOET) was first published in 1988. The book is about how people interact with technology. The principles of interaction are mostly... Read more about this book User Centered System Design: New Perspectives on Human-Computer Interaction Book overview Published 1986 This comprehensive volume is the product of an intensive collaborative effort among researchers across the United States, Europe and Japan. The result — a change in the way we think of... Read more about this book Learning and Memory Book overview Published 1982 Translations available Read more about this book Explorations in Cognition Book overview Published 1975 San Francisco: Freeman Norman, D. A., Rumelhart, D. E., & the LNR Research Group Translations Read more about this book Memory and Attention: An Introduction to Human Information Processing Book overview Published 1969 (Republished 1976) New York: Wiley Translations (1969 edition) Translations available (1976 edition) Read more about this book Human Information Processing Book overview Published 1972 (Republished 1977) New York: Academic Press P. H. Lindsay & D. A. Norman Translations available (1972 edition) Translations available (1977 edition) Read more about this book'
