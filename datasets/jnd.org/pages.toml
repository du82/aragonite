full_description = "Back to all books Emotional Design: Why We Love (or Hate) Everyday Things Emotional Design: Why We Love (or Hate) Everyday Things Book overview Published: 2004 Did you ever wonder why cheap wine tastes better in fancy glasses? Why sales of Macintosh computers soared when Apple introduced the colorful iMac? New research on emotion and cognition has shown that attractive things really do work better, as Donald Norman amply demonstrates in this fascinating book, which has garnered acclaim everywhere from Scientific American to The New Yorker.Emotional Design articulates the profound influence of the feelings that objects evoke, from our willingness to spend thousands of dollars on Gucci bags and Rolex watches, to the impact of emotion on the everyday objects of tomorrow.Norman draws on a wealth of examples and the latest scientific insights to present a bold exploration of the objects in our everyday world. Emotional Design will appeal not only to designers and manufacturers but also to managers, psychologists, and general readers who love to think about their stuff. EXCERPTS: Three chapters are available for reading as PDF files. These are early drafts and riddled with typos. They have all been fixed in the book, so please don’t tell me about errors!) : Table of Contents Prologue: Three Teapots (537 kbyte pdf file) The Meaning of Things Attractive Things Work Better (245 kbyte pdf file)The Multiple Faces of Emotion & Design Design in Practice Three Levels of Design: Visceral, Behavioral and Reflective Fun & Games People, Places and Things Emotional Machines The Future of Robots Epilogue:We Are All Designers ( 200 kbyte pdf file) Related You may also like books books Design for a Better World The Design of Everyday Things, Revised and Expanded Edition Living with Complexity Emotional Design: Why We Love (or Hate) Everyday Things View more books"
