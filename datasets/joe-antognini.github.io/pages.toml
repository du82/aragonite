["https://joe-antognini.github.io/ml/consciousness"]
title = "Consciousness is not computation – Joe Antognini"
description = "Spend enough time in the tech world and you will sooner or later find that itis a common article of faith that comput..."
full_description = 'Consciousness is not computation June 17, 2022 Spend enough time in the tech world and you will sooner or later find that it is a common article of faith that computers will one day gain consciousness. With powerful enough computers and sophisticated enough AI, the reasoning goes, it is inevitable that computers will eventually become conscious just as we are. In fact, some are even bolder and claim that this isn’t just something that will happen off in the distant future, but that the age of sentient computers is upon us already. David Chalmers famously argued that we must be open to the idea that any feedback system — even one as simple as a thermostat — is conscious, even if in a limited way. Recently AI researcher Ilya Sutskever speculated that today’s large neural networks may be “slightly conscious.” And a few months later Google engineer Blake Lemoine was fired after going public with his concerns that the LaMDA language model is sentient. The idea that consciousness is fundamentally computational is admittedly attractive. At the core of the philosophy of mind is what Chalmers called “the hard problem of consciousness.” How can purely physical processes give rise to the apparently subjective experience of consciousness? This problem has bedeviled philosophers since the time of Descartes, and I think a fair (tongue-in-cheek) assessment of their centuries of collective effort is that the time would have been better spent abiding by Hume’s counsel of playing backgammon and enjoying the company of friends instead. But as computers developed in the 20th century, a promising idea emerged. It went like this: Perhaps the brain is like a computer and the mind is like a computer program. What is important, then, is not so much the specific hardware of the brain, but the computer program that the brain is running. This idea seemed to break the stranglehold of physical matter on consciousness and introduced an abstract, non-physical entity that sits on top of the hardware, which seems to neatly correspond to the way that consciousness seems to sit on top of the brain. [1] After centuries of fruitless efforts by philosophers at explaining the origin of consciousness, it’s easy to see why those who worked with these new machines latched onto this revolutionary paradigm, especially as this idea began to be represented in science fiction and, as the decades progressed, computers started to surpass humans in a variety of tasks. But we must resist the allure of this seductive idea. The theory that consciousness is nothing but running the right kind of computer program is wrong. Computation alone is insufficient to produce consciousness. This is, as I understand it, not a radical position among philosophers of the mind these days. Back in the 1980s John Searle cast doubt on the computational theory of consciousness with the Chinese Room argument, and today it seems that most philosophers accept its validity. But this position is not universal. Some philosophers have raised a number of objections to Searle’s argument. And it certainly does not appear that the consensus within the tech world matches the consensus among philosophers, since the notion that computers will one day attain consciousness is still popular. My purpose in this blog post is to outline another argument against the idea that consciousness can be reduced to computation. This is the so-called “triviality argument.” It is less famous than the Chinese Room argument (perhaps because the name is not as catchy), but I think it refutes the computational theory of consciousness at a more fundamental level. Some preliminaries What I mean by “consciousness” Before getting too deep we need a working definition of consciousness. This is a tricky concept to define rigorously since it seems that a rigorous definition of consciousness practically requires a theory of consciousness itself. To make matters worse, in these kinds of discussions it oftentimes gets mingled with related ideas like self-awareness, intelligence, and executive function. But in this post I am interested only in consciousness as a sort of perception or sentience — an awareness of being, or, more loosely, “what it feels like to be something.” This aspect of consciousness is sometimes called “qualia.” [2] I won’t rehearse the classic arguments for the existence of qualia since, like Descartes, I regard my own qualia as an empirical fact — perhaps the only empirical fact that I can know for certain. [3] Of course given any position in philosophy you can find some philosopher who has made the case for it [4], and Daniel Dennett has made the case that qualia does not exist. But I will take it as an axiom that qualia and consciousness exist. So if we accept that qualia exists (which, after all, seems intuitively sensible), we are burdened with the apparently impossible task of explaining how consciousness can be generated by physical processes. This is the crux of the “hard problem of consciousness.” Consciousness is observer independent It’s worth pausing here and noting one property of consciousness that will be of use to us later: consciousness is independent of external observers. By this I mean that the existence of my consciousness does not depend on other observers perceiving me to be conscious. Even if everyone else in the universe should deny that I am conscious — or if those other observers did not exist at all — this would have no bearing on my own consciousness. If, in a terrible catastrophe all life on Earth should perish, except by some strange fortune my own, my consciousness would not suddenly dissolve into the ether. What is computation? We also need a working definition of computation. Fortunately here we are on much firmer ground. Computation, in the broadest sense, is the manipulation of symbols according to an algorithm. The largest and most important category of computation is the set of algorithms which can, in principle, be executed on a Turing machine. As far as we know, every algorithm that can be run on a physical computer can also be run on a Turing machine. [5] What is a computer? There is then the follow-up question of what exactly constitutes a computer. Now, a Turing machine is a purely mathematical abstraction, like a circle or a fractal. We can create or identify things in the real world which can be well modeled by a circle, but the abstract idea of a circle is distinct from a drawing of a circle. Likewise we can build an object in the real world which can model the behavior of the abstract Turing machine. And, more practically, we can build devices whose behavior, while not identical to that of a Turing machine, can compute the same things. We call such devices computers. A little more formally, we can define a computer to be a device which has physical states, and whose physical states map onto the states of a Turing machine. The computer is then the instantiation of that abstract Turing machine in the physical world. We can, for example, make a correspondence between the voltage levels in a CPU register with the state of the Turing machine; likewise we can make a correspondence between the magnetic moments of sections of a hard drive with the states of the Turing machine’s ticker tape. How accurate does a computer need to be? We generally expect computers to be deterministic. If we run the same program twice, the computer should generate the same results. [6] But achieving complete determinism is impossible. Sometimes, very rarely, the computer will make a mistake — a cosmic ray, for example, will fly through and flip a bit somewhere. [7] If we decide that a machine is not a computer simply because it ever makes any errors, we will have to conclude that there are no computers at all in the real world. And if computers don’t exist, then consciousness cannot be computation. But it’s not necessary to impose such a strict requirement. We don’t need to demand that the computer never make a mistake. We only need to require that the computer not make a mistake when we run our program. If, during the program’s execution, every abstract state of the ideal Turing machine can be mapped on to a physical state of the system, we can say that the system is computing the algorithm. If it makes a mistake somewhere and breaks that correspondence, then it stops being a computer for the time being, at least for our purposes. This definition of a computer as a mapping between the physical states of a system and the abstract states of a Turing machine is powerful because it abstracts away the internal mechanics of the computer. The computer can use transistors or vacuum tubes or something else entirely, and we can just focus just on what the abstract Turing machine is doing. Computer scientists don’t need to know anything about Kirchhoff’s laws or semiconductor physics to determine whether \(P = NP\). Consciousness in a field of rocks Since computation is independent of the physical mechanism it uses to transform its states and produce outputs, we can imagine (impractical) computers that are made out of things other than electronics. We can create mechanical computers out of Legos or balls tumbling down a pegboard. A wonderful cartoon from XKCD imagined an individual who finds himself in a vast desert filled with rocks. To allay his boredom, he manipulates the rocks on the desert to produce a computer, and in so doing, simulates the entire universe, instant by instant. Now, if consciousness were a consequence of pure computation, it would be possible to write a clever computer program (let’s call it consciousness.exe) that, when executed on a big enough computer, produces a conscious being. But computation is independent from the physical substrate that the computation is performed on. So if a powerful supercomputer can produce consciousness by running consciousness.exe, we should also be able to produce a conscious being by running the same consciousness.exe program with enough Legos or by manipulating enough rocks in a desert. It already seems implausible to me that a vast desert of rocks being manipulated into various patterns is conscious. What exactly is conscious here? What happens if I accidentally kick a rock to the side — have I killed whatever ghostly being inhabits these rocks? Nevertheless, I think we can do better than simply asserting its implausibility. Sure, it is hard to imagine what it means for this vast desert of rocks to be conscious, but there are lots of unintuitive things in this world. We shouldn’t let our prejudices as to what substrate consciousness should exist in prevent us from accepting that it could very well exist in a substrate which is unfamiliar to us. [8] Does iron become conscious when it’s hot? So let’s follow where this argument takes us. Rather than manipulating rocks in a desert, let’s imagine a bar of iron heated past the Curie temperature. Each atom in the bar has a magnetic moment which points either up or down, and because the bar is so hot, the magnetic moment of each atom is randomly flipping between up and down. Moreover, by an ingenious detector, we have the means to observe whether the magnetic moment of every atom in the bar is up or down at any given time. I want to determine if this bar of iron is conscious, so I examine its atoms to see if it is running the consciousness.exe computer program. I designate the first \(P\) atoms to be input bits, another \(N\) atoms to be internal states of the Turing machine, and then another \(Q\) atoms to be outputs. Then I look at the magnetic moments of those atoms sampled at different time steps and see if they correspond to the inputs, outputs, and intermediate states of the corresponding Turing machine by designating a moment pointing up as a 1 and a moment pointing down as a 0. Naturally, there is no correspondence so I conclude that the bar of iron is not conscious. Simultaneously, however, my friend Alice performs the same observation. But rather than designating moments pointing up as a 1 and a moment pointing down as a 0, she considers an atom pointing up to be a 1, unless it’s the first atom in the bar, in which case it’s a 0. Naturally, she, too, observes no correspondence with consciousness.exe and concludes that the bar of iron is not conscious. But another friend of mine, Bob, makes the same observation, though using a slightly different encoding. He considers an atom pointing up to be a 1, unless it’s the second atom in the bar, in which case it’s a 0. Similarly Carl performs the same observation, but in his encoding, an atom pointing up is a 1 unless it’s the third atom, and so on. Eventually we get to Ada, who encodes an atom pointing up as a 1 unless it’s the first or second in which case it’s a 0. Then Barbara, who encodes an atom pointing up as a 1 unless it’s the first or third. Continuing this, we can imagine an enormous crowd of observers staring at this iron bar, each using a unique encoding of atomic states to bits. With a sufficiently large number of observers, the encodings of all possible Turing machines of the given size are represented. This means that one of these observers will, by chance, happen to observe that the states of the atoms correspond exactly to the bits of a Turing machine computing consciousness.exe. This observer will then conclude that the bar of iron is a computer running consciousness.exe and is therefore conscious. But! If a single observer can correctly determine that the bar of iron is conscious, we must conclude that the bar of iron is conscious for everybody, because consciousness is observer independent. If true, honest-to-God consciousness is just a matter of running consciousness.exe, we have indeed found someone who has correctly observed that the bar of iron is running consciousness.exe and we must conclude that the bar of iron really is conscious. To go further, I have not specified what consciousness.exe is, and presumably there are many possible consciousness.exe programs. There is alices_consciousness.exe, bobs_consciousness.exe, along with joes_consciousness.exe and your_consciousness.exe, which are the programs that generate Alice’s, Bob’s, my own, and your consciousnesses, respectively. The bar of iron is running all of them. So not only is the bar of iron conscious, it contains my consciousness, your consciousness, and all possible consciousnesses. And of course there’s nothing special about the iron itself. We could make the same argument with any system where we can map states to bits. We could imagine doing the same thing with the locations of molecules in a pail of water or on the wall of a room, or in a brick. In all cases we are forced to conclude that a sufficiently large system contains all possible consciousnesses. So the proposition that consciousness is computation leads quite inevitably to an extreme panpsychism. Even if we could stomach a traditional conception of panpsychism that posits that all things are conscious in '
