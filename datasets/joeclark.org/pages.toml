["https://joeclark.org/podcastingtest"]
title = "Canonical test podcasts (Joe Clark)"
full_description = "Are you the creator, programmer, or quality-tester of a podcasting application? This page provides a range of podcasts that exemplify a range of atypical use case from merely uncommon to exceedingly fringe. If your app can handle all these, you’re doing well. Remember: Your app will be used to listen to potentially thousands of podcasts you’ve never heard of (or would ever choose to listen to yourself). Quality testing is about other people, in this case your users or customers. At the very least, make sure blind people can use your podcast app with system accessibility features. A reasonable test case is one of the many blind podcasts out there, like Maccessibility (their RSS), which not only uses chapter markers but features guests who complain about inaccessible podcasting apps. I have no immediate recommendations on how to make a podcasting app more accessible to persons with other disabilities (e.g., Christopher Hills), least of all via test podcast feeds. Lots of technology podcasts uses chapter breaks or bookmarks. But a podcast aimed at civilians that does so is that of Jocko Willink (Jocko RSS). Podcasts that use custom artwork at every chapter break (or even once during an episode, i.e., change artwork partway through an episode) used to be easy to find 10 years ago but aren’t anymore. They’re a useful test case. The Layout podcast uses one different image for some chapters. It’s just the main image inverted, but it qualifies for our purposes. See Episodes 63 and 64, for example (Layout RSS). I put a lot of effort into testing the following two, for very little gain: Upgrade and MacCast (just the Enhanced version, which has no canonical URL and which pulls a Sam Harris and buries show topics deep inside episode summaries). The actual content of a podcast – which you’d have to sit there and listen to – can be an issue that you need to test against. For example: Your app auto-deletes podcast episodes after they finish playing, because your assumption is that podcasts are informational, and once you’re done with an episode you obviously never need to hear that information again."
year_published = 2017
year_updated = 2017
