["https://joeclark.org/dossiers/johnwaters.html"]
title = "John Waters’ best films of the year (Joe Clark)"
full_description = "This archive exists because Artforum (and now Vulture, whatever that is) cannot be trusted to keep these lists published and available. Plus my markup and copy-editing are better. Love Lies Bleeding (Rose Glass) This hilarious, bloody film noir is the best movie of the year, one that Russ Meyer might have made if he had been a lesbian intellectual addicted to steroids. Even the pig-men are cute. Sort of. Queer (Luca Guadagnino) Daniel Craig may be queerbait for taking on the gay beatnik role of William Burroughs’s alter ego, but I’m all for it. He’s absolutely brilliant and even has a “snowball” scene, a happy reminder of a sex act I had long forgotten. Oh, if today’s homos were this radical, I’d be a much happier queer myself. The Brutalist (Brady Corbet) A cold-as-concrete VistaVision (!) epic about the cruelty of architecture and the agony of being ahead of your time, with Adrien Brody and Guy Pearce butting to the front of the line of Oscars hopefuls. Yes, the running time is 3.5 hours, but the only thing too long is the intermission. Hard Truths (Mike Leigh) A horribly sad and sometimes hilariously funny portrait of the most unpleasant sourpuss woman in the history of cinema. She’s a rotten mother and a terrible wife, and everyone around her is racked with pain except the audience, which slowly begins to root for her. A wretched experience I’ll cherish forever. Messy (Alexi Wasser) A snappy, witty little indie by a new female auteur (who also stars in the film) that brings to mind the best of Woody Allen’s comedies with very different subject matter: hipster women and their sex addictions. It’s sparkling, it’s rude, it’s knowing, and it’s hot. I’m glad young people are still angry and confused about mating. Joker: Folie à Deux (Todd Phillips) Finally, a love story I can relate to. So insane, so well thought out, so well directed, so much smoking! It’s Jailhouse Rock meets Busby Berkeley with a 9/11 That’s Entertainment! ending that will make you shake your head in cinematic astonishment. Stupid critics. Gaga so good. Joker so right. Die, dumbbells, die!"
