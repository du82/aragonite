["https://joeclark.org/holyfamily"]
title = "Holy Family redesign (Joe Clark, Toronto)"
full_description = "Holy Family is a Catholic church on King St. West in Toronto. It offers Latin low and high masses and a so-called reverent Novus Ordo. Holy Family runs its own seminary, which is actually defined by provincial statute. The overarching corporation and religious order, the Oratory of St. Philip Neri, furthermore operates a second church, St. Vincent de Paul on Roncesvalles. I was verbally authorized by the Oratory’s provost, Fr. Paul Pearson, and his second-in-command, Fr. Martin Hilbert, to assemble and provide deficiency lists concerning physical plant and graphic communication. (The sole venue considered was Holy Family itself, not the seminary or St. Vincent’s.) Why? Because the building had all sorts of avoidable defects, and basically every aspect of type and copy has been mismanaged, to the point that parishioners actually miss special events because they aren’t announced in a manner they will actually notice. I had not one but two approvals to carry out this project. But when I tried to get basic fact-checking questions answered by Fr. Hilbert, I was basically told he was scotching the project. Of course I took this up with Fr. Pearson, who runs the place. I told him I am not willing to tolerate not one but two Catholic priests who reneg on deals. I further told Fr. Pearson that Fr. Hilbert had failed in his duty to be a good shephered. “You’re my church! You have to be the one place on God’s green earth where I’m not treated as a problem,” I wrote Fr. Pearson. These two priests, in charge as they are of Holy Family and the Oratory, have ignored me completely. They’ve caused a great schism and have done precisely nothing to remedy same even after being invited to do so. “Surely you have nothing to learn and need nobody’s help. Guess again: Come fall, costed, typeset proposals will be ready for presentation at an all-hands meeting,” I further wrote. Holy Family has to decide if it wants my expert help or not. If so, Holy Family has a great deal of work to do to regain my trust. Frs. Pearson and Hilbert have to go the extra mile to welcome this lost sheep back to their fold."
