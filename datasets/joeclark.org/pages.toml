["https://joeclark.org/strength"]
title = "Strength (Joe Clark, Toronto)"
full_description = "I’ve spent a lifetime developing expertise in various fields. Hence I can firmly recommend identifying the real experts in fields and doing whatever they say. And that certainly applies to the project of getting stronger. Dr. Stuart McGill all the way. There are countless podcast and YouTube interviews with this medical researcher from Waterloo. Do his fundamental back exercises most every day. Here one heeds my favourite rat bastard, God-Emperor Mark Rippetoe, who half-blocked my account on his site Starting Strength and rewrote my bio to read “Supefluous.” (Hugs and kisses and tempeh by the pound, Mark!) Read Starting Strength and do exactly what it says. If you are an old, read The Barbell Prescription. For Rippetoe, too, there are umpteen podcast and YouTube interviews. But by far the easiest place to start is Rippetoe’s appearances in the Art of Manliness’s videos. I also have Becoming a Supple Leopard and I admire the chutzpah to put a thing like that together, but I don’t get its purpose. Deskbound is an extremely useful book for unfucking your back after sitting at a computer all day reading (or creating) pages like these."
