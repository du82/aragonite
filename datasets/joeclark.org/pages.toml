["https://joeclark.org/dossiers/pride"]
title = "Documents concerning Pride Toronto and its Dispute Resolution Process (Joe Clark)"
full_description = "I filed several complaints under the Pride Toronto Dispute Resolution Process. The newest complaint (August 2016) was against Black Lives Matter Toronto. You may not know much about it, or about how it came into existence (via the Community Advisory Panel, 2011). In that case, read these first. I’m maintaining an archive of documents about Black Lives Matter Toronto vs. Pride Toronto – so everyone can easily put their hands on this fleeting online information later on. I’ve written about Pride Toronto a few times on my personal Weblog. In particular, I think the Trans March and Dyke March represent separatism and should not exist as Pride-sponsored marches. (One obvious option is for Pride to offer funding to organizers of those marches for, say, three years, on the condition that they form their own nonprofit companies and run their own shows forever. Then the traditional Pride parade can revert to what it always was and is supposed to be, a Pride parade.) A PDF version – a tagged PDF with bookmarks and index. It contains not only the bylaws but many appendices"
