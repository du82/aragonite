["https://joeclark.org/quit"]
title = "I quit (Joe Clark, Toronto)"
full_description = "I have two more books to write and publish, but, save for fringes around the edges here and there, whatever kind of “public life” I previously had is over. And has been for decades, as I have realized the whole while. (“Why now, Joe? Why not 20 years ago‽”) It has been established over a period of half a lifetime that no one values (least of all is willing to pay me for) my knowledge and connoisseurship. I am the only or last man standing with the kind of knowledge I have, in well more than a few fields of expertise. The calculus is as follows: If there is one and only one way to solve a problem, the problem will sit unsolved forever if the solution is attached to me. It has been clear for years that seemingly everyone is willing to jettison my expertise, and just let all of it die with me. If there was a breaking point, James Craig of Apple unhesitatingly and with intent placed the final straw. James was in town for a Web-standards meeting to which I was not invited. He took me to late lunch before heading off to the airport. – and, across the table, James told me in these precise words that I would never work at Apple. I – I – have to be able to get along with people. I at no time wished to work at Apple. James was gratuitously precluding an option I had never wanted. It’s been a common enough sentiment: “This guy is the third rail of accessible media. He is a self-described expert... highly critical. He does not represent any business and only can cause us grief” – Jim Ballard, Deluxe (“I’ll keep him at arm’s length”) Then there was the pipsqueak who disinvited me from a conference. (That happened more than once.) Then, moreover, there was the beloved local columnist – friend to all, and the feeling is mutual – who cheerfully confirmed the outright omertà against hiring me for any journalistic enterprise. I will not go full Mark Pilgrim, but to whatever extent “you” came to expect further work from me, understand that there will be scarcely any or none. Of course I feel that “you” have variously betrayed or abandoned or renounced me in the first place. Broadly, the response to that sentiment has been “That’s the least you deserve.”"
year_published = 2023
clearnet = "https://joeclark.org/quit"
