["https://joeclark.org/papist"]
title = "Catholic projects (Joe Clark, Toronto)"
full_description = "Catholics are completely unaware of open and relational theology, whose proponents in turn are unaware of our objections to it. Until now Script for Byzantine rosary in Microsoft Word or PDF. Order of items is deliberate. Typography (in Sitka) is optimized for sight-reading at a distance. These are the only occasions at which permitting me to speak was even remotely contemplated. Church is yet another venue where I am considered a problem (cf. Holy Family). My palpable competence and ability, not least in public speaking, are held against me. Hence it is more expedient to let one Filipina after another (raises hands during Lord’s Prayer; diligently does Sign of Peace with visibly cringing nearby Caucasians) hack through and mangle scripture from the ambo, where no female should ever be found anyway Redesign of Holy Family, a Latin-mass church in Toronto. (A complete shitshow so far, and it’s their fault) Francis Leo will be a future pope: The Archbishop of Toronto is obviously being speedrun into position to be elected pope. Quite possibly the very next one “Bring me the head of ‘Kissy’ Fernández”: “Catholics who profess to be exasperated by the current papacy have done next to nothing to rid us of the irritant known as Víctor Manuel Fernández. Instead of learning from leftists[,] Catholic gadflies commit to a consistent policy of Not Winning” I’m sorry I ever tried to help these guys. Host and founder (sic) Anthony Abbate complained repeatedly about “audience capture,” but, when presented with a video application to appear on his show to rattle a few of his, his co-host’s, and Internet tradcaths’ shibboleths about homosexualism, suddenly I’m not cute and “witty” anymore, as I had been described on a previous show. That was after I had dubbed Anthony a garrulous autodidact. “Coward” and “hypocrite” seem more fitting now"
