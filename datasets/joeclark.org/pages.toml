["https://joeclark.org/cp"]
title = "‘CP Caps and Spelling’ (Joe Clark)"
full_description = "Canadian Press editor James McCarten put out a call for additions to its periodically-issued CP Caps and Spelling reference book. (It’s also an online resource to which one may subscribe. I do not.) McCarten put that call out on the medium where all Canadian journalists spend the majority of their time, Twitter. This in part explains why Canadian journalists are interchangeable and lousy at their jobs: What they do all day is RT each other. But of course a lexeme like RT would never be included in CP Caps and Spelling. We write the Queen’s English for print newspapers, do we not? Further, Twitter is overrun with junior (mostly female) hacks who have barely read professionally-edited copy in their lives and would not even have a viable opinion on whether or not “professionally-edited” is hyphenated in the foregoing context. I spent weeks trying to get McCarten’s attention by E‑mail (not “email,” though that is CP style). He eventually begrudgingly responded to the wrong half of my message, vaguely insinuating that mighty CP ignores messages due to civility or tone. As I told him later, as descriptivists we must approach every term without fear or favour. If the topic is productive use of Xy McXface (e.g., Boaty McBoatface), and the lexeme before us is Cunty McCuntface, we have no choice but to deal with it neutrally. Stated another way, rather than receive a hundred or more additions from a trained and informed person, McCarten literally tone-policed. As a linguist and copy-editor who goes back 30 years in typography, my list of additions addresses biases. Canadian journalists are far-left and cannot be bothered to read right-wing outlets because right-wing assholes offend them morally. To the extent possible, left-wing Canadian hacks (the phrase is tautological) want their enemies dead, and actually they’re putting a lot of effort into that. Still, on the whole, Canadian hacks either wilfully insulate themselves from right-wing neologisms and usage or pretend horror and offence once such neologisms are pushed into their faces (e.g., incel)."
