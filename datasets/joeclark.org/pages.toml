["https://joeclark.org/podcastingcensorship"]
title = "Podcast censorship, of a sort (Joe Clark)"
full_description = "(UPDATED) In one sense of the term, podcasts are censored from the only directory most people will ever use, iTunes. Some of the same podcasts don’t show up in the indexes that podcast applications like Overcast maintain. Not by any coïncidence whatsoever, all the affected podcasts are by conservatives. This shadowbanning seems to be deliberate. The concept of a feed has never been adequately explained to laypeople. The current sense of the word refers to e.g. infinitely scrolling Facebook or Instagram “content.” Of course that’s another sense, but the original meaning referred to RSS, an acronym whose expansion is pointless, so don’t bother. RSS feeds are what make podcasts possible. These simple files tell any podcast reader, or any other application, if and when a podcast has been updated, and where any audio files are stored (for downloading or streaming). Whatever podcast application you use (your “podcatcher”) maintains a list of the podcasts to which you subscribe. In another sense this too is a feed, but it’s more precisely what I just described – a subscription list. But where do you find podcasts to subscribe to in the first place? Most of the time, it’s on iTunes. The vast majority of people use iTunes as a directory, and also mistakenly think iTunes is needed to subscribe to a podcast (it isn’t). There are umpteen other platforms similar to iTunes, like Stitcher and SoundCloud. When you subscribe to a podcast on iTunes or essentially anywhere else, all you’re really doing is adding that podcast’s RSS feed to your subscription list. iTunes isn’t actually involved. There are weird lock-in scenarios where you have to use a certain platform to listen to the podcasts to which you’ve subscribed. But in all cases RSS feeds are used behind the scenes. The other place where most people will look for podcasts to subscribe to is right within their podcast application. For that, those applications have to have access to a directory, often custom-made and ‑maintained."
year_published = 2018
year_updated = 2018
