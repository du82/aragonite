full_description = "joey/ code Edit RecentChanges History Preferences Branchable Discussion This is my codewiki, a wiki for development stuff, design docs, and occasionally basic websites about my software. Current focus The stuff that's swapped into my local cache at the moment. git-annex propellor concurrent-output myrepos etckeeper ikiwiki ikiwiki-hosting shell-monad reactive-banana-automation easy-peasy-devicetree-squeezy fridge0 haskell-filepath-bytestring arduino-copilot zephyr-copilot Less active projects In maintenance mode mostly, but I still have my hands in it somewhat. moreutils mpdtoys Words2Nums pdmenu filters electrum-mnemonic brainfuck-monad zxcvbn-c scroll http-client-restricted scuttlebutt-types haskell-libmodbus haskell-git-lfs haskell-mountpoints virtual-hallway-track quarantimer debug-me Past projects I'm no longer working on these projects, but thankfully, other people have taken them on. Debian debian-installer debhelper alien tasksel flashybrid wmbattery debconf dpkg-repack os-prober pristine-tar devscripts pentium-builder apt-src jetring scriptreplay These need new maintainers, stat! debmirror sleepd nslu2-utils ticker github-backup These are dead and buried. shoop perlmoo TermStool base-config satutils mooix rootsync keysafe Misc Other stuff.. Kaxxt bin kong acpi sigprogs If you want to keep up with new projects, WhatsNew is a feed of any new pages I add to this site. Also, Ohloh tracks and mines my commits to many projects for interesting metrics. Here is a graph of Debian popcon stats for my newest projects. here is a graph for my most popular projects. I assume popcon only reflects 1/10th to 1/100th or less of total users. Links: blog/code links/technical thanks Last edited Wednesday evening, February 16th, 2022"
