full_description = "joey/ boxen Edit RecentChanges History Preferences Branchable ?Discussion This is my list of machine names that I use or have used, recorded here so I can pick new names without overlap. My current naming scheme (first described here) names machines after living things with some broad divisions for different types of machines. Machines marked with a are in active use. laptops Mostly mythical creatures. darkstar kiwi (Anna's) aquamiser2 (Mark's) peregrine (Mom's) sow (Dad's) kodama phoenix dragon corvid kraken wildebeest eel (Maggie's) servers Mostly birds. kite chicken turtle dodo ostrich stork wren bluebird hydra box finch pell orca diatom elephant clam mayfly oyster sparrow small machines leech lime slug snail stick honeybee [[chip] house sky phones limpet Palm Pre wireless routers Flying insects. dragonfly gnat moth (Mom's) butterfly (Anna's) fly (Anna's) desktops beaver (Dad's) sparrow penguin mouse (Maggie's) functional names digi phone sat labswitch test machines Large herbovores. donkey bison zebra elephant cow pegasus ox Small amphibians. frog (bitsyxb) toad (bitsyg5) Links: links/technical Last edited Wednesday afternoon, June 14th, 2023"
