full_description = '''joey/ grep Edit RecentChanges History Preferences Branchable ?Discussion This page aggregates together stuff having to do with Joey from elsewhere on the net. RSS mastadon posts untitled 1.15 cents per mile Posted Saturday afternoon, March 1st, 2025 mastadon posts untitled Coming out of winter, my car has been able to charge up 10% from #offgrid solar nearly every day this month. And I found a free level 2 charger downtown. So I spent only $4.64 on charging last month.Updated my home automation today to notice when the car reaches the desired charge level, and dump the solar power to other loads. Which will be a hot water heater eventually. Posted Saturday afternoon, March 1st, 2025 mastadon posts untitled Alternatively, it might be that they're quoting it as a means to establish a definition. The ToU does use the term one other time. Posted Saturday afternoon, March 1st, 2025 mastadon posts untitled Executable Form is a term used in the MPL, which #firefox is licensed under.“Executable Code" is a *quoted* term used in the new firefox Terms of Use.What are they quoting from if not the license of firefox? And if they're quoting the license of firefox, then don't they intend the ToU to apply to all Executable Forms of firefox? Which certainly, as far as the use in the MPL goes, means not only Mozilla's firefox binary, but Debian's. And also librewolf's.I'd love it if a lawyer could weigh in. In the meantime, I will probably be leaving librewolf behind, argh. Posted Saturday afternoon, March 1st, 2025 mastadon posts untitled "what's your main web browser?" is gonna be quite an interesting interview question for technical jobs now... if they say #firefox, make note that they are unlikely to negotiate on any terms of their contract Posted at lunch time on Saturday, March 1st, 2025 mastadon posts untitled I suspect this was a calculated maneuver, the good old ask for a mile and then take an inch. Posted Friday evening, February 28th, 2025 mastadon posts untitled well Mozilla has blinkedhttps://blog.mozilla.org/en/products/firefox/update-on-terms-of-use/"You give Mozilla the rights necessary to operate Firefox. This includes processing your data as we describe in the Firefox Privacy Notice. It also includes a nonexclusive, royalty-free, worldwide license for the purpose of doing as you request with the content you input in Firefox. This does not give Mozilla any ownership in that content."Still seems probably problematic, and to be clear, once you're dead to me, you're dead to me. Posted Friday evening, February 28th, 2025 mastadon posts untitled #mozilla #firefox Posted Friday evening, February 28th, 2025 mastadon posts untitled People are saying don't worry, #firefox doesn't contain code that will upload all your content to their servers to monetize it. Well, it doesn't need to. Mozilla is claiming a license to things you post in public or private anywhere, so they just need enough tracking information from their adtech partners to know which posts were made by firefox users. Then they can obtain those posts from their scraping and/or data collection partners (eg facebook) and feed those posts into advertising partner's LLM and use it to generate compelling ads for you that they display in the browser.As their terms of use puts it, they can "use that information to help you navigate, experience, and interact with online content". Posted late Friday afternoon, February 28th, 2025 mastadon posts untitled I had to mess with some about:config to get disk caching to work, and to get zoom settings to be remembered. Of course these have privacy implications. Posted at lunch time on Friday, February 28th, 2025 mastadon posts untitled switched to #librewolf Posted at lunch time on Friday, February 28th, 2025 mastadon posts untitled I've done some testing with my clock set to April to see how #firefox is going to behave to new users after early March when their blog says it will make acknowledging their new, thieving TOU part of the "standard product experience".I think it will be as simple as https://www.mozilla.org/en-US/privacy/firefox/ getting a link to the TOU. That page is currently opened in a tab when starting firefox for the 1st time. It does not currently link to the TOU.For existing users, I think a new firefox release later will make it pop up the TOU page.I think this will mean that the TOU will apply equally to *all* builds of firefox, including eg from Debian. Posted late Friday morning, February 28th, 2025 mastadon posts untitled https://joeyh.name/blog/entry/WASM_Wayland_Web_WWW/ Posted late Thursday night, February 28th, 2025 mastadon posts untitled giant meteor, why have you forsaken us? Posted Thursday night, February 27th, 2025 mastadon posts untitled irefox Posted Thursday night, February 27th, 2025 mastadon posts untitled Need a good laugh? #Mozilla's privacy faq now has:"Since we strive for transparency, and the LEGAL definition of “sale of data“ is extremely broad in some places, we’ve had to step back from making the definitive statements you know and love." Posted Thursday evening, February 27th, 2025 mastadon posts untitled The latest pack of lies from Mozillahttps://connect.mozilla.org/t5/discussions/information-about-the-new-terms-of-use-and-updated-privacy/m-p/87922/highlight/true#M33705 Posted late Thursday afternoon, February 27th, 2025 mastadon posts untitled Mozilla is now actively gaslighting their users. Posted late Thursday afternoon, February 27th, 2025 mastadon posts untitled I restrung my windchimes yesterday. Same great tones, but now they're also saying "you repaired this". At least there's that. Posted early Thursday morning, February 27th, 2025 mastadon posts untitled "You give Mozilla all rights necessary to operate Firefox, including processing data as we describe in the Firefox Privacy Notice, as well as acting on your behalf to help you navigate the internet. When you upload or input information through Firefox, you hereby grant us a nonexclusive, royalty-free, worldwide license to use that information to help you navigate, experience, and interact with online content as you indicate with your use of Firefox."People are reading this in lots of motivated ways to convince themselves it doesn't say what a lawyer wants it to say. But I guarantee you it does. And that's not "our program needs a license to your content to do stuff with it". Nor is it "you'll tell firefox what's appropriate and it will do that, it's your user agent after all". It's not 1999 people.It's more like "by using firefox at all, you have agreed to this terms of use, and we will monitize you and claim ownership over everything we can" Posted Wednesday night, February 26th, 2025 mastadon posts untitled If #mozilla goes through with this #firefox terms of use, we need to block their user agent from our websites. And I mean anyone who runs a website where users enter or upload content they own. It's unacceptable to passively sit by and let a browser vendor hoover up licenses to all your user's content. Posted Wednesday night, February 26th, 2025 mastadon posts untitled today's milestone: I can run `git-annex recompute` and it notices there's a new version of foo, and so generates a new version of bar Posted late Wednesday afternoon, February 26th, 2025 mastadon posts untitled when you delete the Washington Post from your web browser's start page, and it's replaced with the guillotine icon from @pluralistic.net Posted late Wednesday afternoon, February 26th, 2025 mastadon posts untitled Notice it checksummed the result of the second run of the computation and verified it's the same as the first run. That's because this particular computation declares itself to be reproducible. When a computation is not reproducible, it uses a VURL key instead, and learns the hashes of each new run of the computation. Also with --fast, adds an annexed file without running the computation, and so uses a VURL key.I'm pretty pleased how these peices are fitting together. Posted at teatime on Tuesday, February 25th, 2025 mastadon posts untitled compute remote works! #gitAnnex Posted Tuesday afternoon, February 25th, 2025 books Orbital author: Samantha Harvey name: Joey average rating: 3.58 book published: 2023 rating: 0 read at: date added: 2025/02/22 shelves: currently-reading review: Posted early Saturday morning, February 22nd, 2025 Copyright (C) 2025 Goodreads Inc. All rights reserved. books Ninth House (Alex Stern, #1) author: Leigh Bardugo name: Joey average rating: 4.03 book published: 2019 rating: 0 read at: date added: 2021/10/30 shelves: currently-reading review: Posted at lunch time on Saturday, October 30th, 2021 Copyright (C) 2021 Goodreads Inc. All rights reserved. books Dune Messiah (Dune Chronicles, #2) author: Frank Herbert name: Joey average rating: 3.89 book published: 1969 rating: 0 read at: date added: 2021/10/22 shelves: currently-reading, re-read-in-2021 review: Posted at teatime on Friday, October 22nd, 2021 Copyright (C) 2021 Goodreads Inc. All rights reserved. books Edges (Inverted Frontier #1) author: Linda Nagata name: Joey average rating: 4.10 book published: 2019 rating: 3 read at: date added: 2021/10/03 shelves: currently-reading review: Egan did the general extropian voyage better, but the murder ships are an interesting metaphor for Facebook. Posted Wednesday night, September 29th, 2021 Copyright (C) 2021 Goodreads Inc. All rights reserved. books Helgoland: The World of Quantum Theory author: Carlo Rovelli name: Joey average rating: 4.08 book published: 2020 rating: 0 read at: date added: 2021/09/18 shelves: currently-reading review: Posted Saturday evening, September 18th, 2021 Copyright (C) 2021 Goodreads Inc. All rights reserved. books XX author: Rian Hughes name: Joey average rating: 3.93 book published: 2020 rating: 0 read at: date added: 2021/09/10 shelves: currently-reading review: Posted Friday evening, September 10th, 2021 Copyright (C) 2024 Goodreads Inc. All rights res