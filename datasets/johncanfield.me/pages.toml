ious messages const successDiv = form.querySelector('.form__success'); const errorDiv = form.querySelector('.form__error'); const statusDiv = form.querySelector('.turnstile-status'); if (successDiv) successDiv.style.display = 'none'; if (errorDiv) errorDiv.style.display = 'none'; if (statusDiv) statusDiv.textContent = ''; const email = form.querySelector('input[name="contact[email]"]').value; const tokenInput = form.querySelector('input[name="cf-turnstile-response"]'); const submitButton = form.querySelector('.m-newsletter-form__button'); const turnstileWidget = form.querySelector('.cf-turnstile'); if (!tokenInput?.value) { if (statusDiv) { statusDiv.textContent = '⚠ Please complete the verification'; statusDiv.setAttribute('data-status', 'error'); } return; } if (submitButton) { submitButton.setAttribute('disabled', 'disabled'); } // Get the token value and immediately clear it to prevent reuse const token = tokenInput.value; tokenInput.value = ''; const response = await fetch(this.WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', }, body: JSON.stringify({ email: email, 'cf-turnstile-response': token }) }); const result = await response.json(); // Check both the HTTP status and the result success flag if (response.ok && result.success === true) { if (successDiv) { successDiv.style.display = 'block'; } if (statusDiv) { statusDiv.textContent = '✓ Successfully subscribed'; statusDiv.setAttribute('data-status', 'success'); } form.reset(); } else { const errorMessage = result.error || 'Failed to subscribe. Please try again.'; if (errorDiv) { errorDiv.textContent = errorMessage; errorDiv.style.display = 'block'; } if (statusDiv) { statusDiv.textContent = '⚠ ' + errorMessage; statusDiv.setAttribute('data-status', 'error'); } } // Always reset Turnstile after attempt if (turnstileWidget) { turnstile.reset(turnstileWidget); } // Reset submit button state if (submitButton) { submitButton.setAttribute('data-state', 'disabled'); } } catch (error) { c