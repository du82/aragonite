full_description = '''.sf__custom-01 .m-image-card__content { padding-bottom: 40px !important; } @media (min-width: 1400px) { .m-custom-slideshow .m-slide__content .m-slide__title { font-weight: 800; line-height: 1.45; font-size: 60px; margin-bottom: 15px; letter-spacing: 2px; } } @media (max-width: 767px) { .sf__custom-01 .m-image-card__content { padding-bottom: 20px !important; } } :root { /* Heights */ --hero-height-desktop: 850px; --hero-height-mobile: 350px; /* Desktop Typography */ --heading1-size: 32px; --heading2-size: 70px; --subheading-size: 36px; --button-size: 16px; /* Mobile Typography */ --heading1-size-mobile: 19px; --heading2-size-mobile: 34px; --subheading-size-mobile: 22px; --button-size-mobile: 14px; --heading2-line-width-mobile: 200px; /* Desktop Content Widths */ --heading1-width: 800px; --heading2-width: 800px; --subheading-width: 900px; --subheading-line-width: 900px; --button-width: 200px; --heading2-line-width: 400px; /* Desktop Positioning */ --heading1-x: 0px; --heading1-y: 10px; --heading2-x: 10px; --heading2-y: 40px; --subheading-x: 0px; --subheading-y: 700px; --button-x: 0px; --button-y: 770px; /* Mobile Positioning */ --heading1-x-mobile: 0px; --heading1-y-mobile: 10px; --heading2-x-mobile: 0px; --heading2-y-mobile: 40px; --subheading-x-mobile: 0px; --subheading-y-mobile: 30px; --button-x-mobile: -50px; --button-y-mobile: 40px; /* Tablet Typography */ --heading1-size-tablet: 25px; --heading2-size-tablet: 50px; --subheading-size-tablet: 30px; --heading2-line-width-tablet: 250px; --subheading-line-width-tablet: 400px; /* Tablet Positioning */ --heading1-y-tablet: 40px; --heading2-y-tablet: 80px; --subheading-y-tablet: 550px; --button-y-tablet: 640px; --hero-height-tablet: 700px; /* Tablet Offset Multiplier */ --tablet-offset-multiplier: 0.6; /* Below Slide Styling */ --below-slide-background: #ffffff; --below-slide-y: 0px; --above-slide-padding-top: 10px; --above-slide-padding-bottom: 10px; --above-slide-heading-gap: 0px; } FINALLY, Cards That Don't Suck™ You won't find cards like this at your grocery store. SHOP NOW FINALLY, Cards That Don't Suck™ Profanity pack, available now. Check It Out You won't find cards like this at your grocery store. Profanity pack, available now. SHOP NOW Check It Out // Replace your current DOMContentLoaded handler with this optimized version document.addEventListener('DOMContentLoaded', () => { const slideshow = document.querySelector('.hero-slideshow'); if (!slideshow || slideshow.querySelectorAll('.hero-slide').length < 2) return; let currentSlide = 0; const slides = [...slideshow.querySelectorAll('.hero-slide')]; const belowContent = [...document.querySelectorAll('.hero-below-slide .hero-slide__subheading')]; // Preload next slide's images const preloadNextSlide = (nextIndex) => { const nextSlide = slides[nextIndex]; if (!nextSlide) return; ['desktop-and-tablet', 'mobile'].forEach(type => { const img = nextSlide.querySelector(`.hero-slide__bg--${type}`); if (img && !img.loading) { img.loading = 'eager'; img.fetchpriority = 'high'; } }); }; const showSlide = (index) => { // Previous slide handling slides[currentSlide].classList.remove('active'); slides[index].classList.add('active'); const nextSlideId = slides[index].id.replace('Slide-', ''); // Update both desktop and mobile subheadings and buttons document.querySelectorAll('.hero-below-slide .hero-slide__subheading, .hero-below-slide .hero-button-wrapper').forEach(content => { content.classList.toggle('active', content.dataset.slide === nextSlideId); }); currentSlide = index; preloadNextSlide((index + 1) % slides.length); }; // Initialize first slide's content if (belowContent.length) { const firstSlideId = slides[0].id.replace('Slide-', ''); belowContent.find(content => content.dataset.slide === firstSlideId )?.classList.add('active'); } // Use requestAnimationFrame for smoother transitions let lastTime = 0; const interval = 10000; const animate = (timestamp) => { if (timestamp - lastTime >= interval) { showSlide((currentSlide + 1) % slides.length); lastTime = timestamp; } requestAnimationFrame(animate); }; requestAnimationFrame(animate); }); #m-newsletter-template--16998228230191__newsletter_BgbgE9 { --section-padding-top: 26px; --section-padding-bottom: 30px; } Want 10% off your first order? Sign up to our email list to hear about new deals and the latest product drops, and we'll send you a code for 10% off your order.Ultra exclusive: over 8 billion people aren't on it. .turnstile-status { display: none !important; /* Add this to completely hide the status messages */ } .m-newsletter-form__button[data-state="disabled"] { display: none !important; } .cf-turnstile { margin: 0 !important; padding: 0 !important; min-height: 0 !important; height: 0 !important; opacity: 0; overflow: hidden; position: absolute; visibility: hidden; transition: all 0.3s ease; } .cf-turnstile[data-state="visible"] { margin: 10px 0 !important; height: auto !important; min-height: 70px !important; opacity: 1; position: static; visibility: visible; } .m-newsletter-form { position: relative; } /* Status message styles */ .turnstile-status { font-size: 12px; margin-top: 4px; display: none; } /* Message style variations */ .m-newsletter-form--message-default .turnstile-status[data-status="success"] { color: #16a34a; display: block; } .m-newsletter-form--message-default .turnstile-status[data-status="error"] { color: #dc2626; display: block; } .m-newsletter-form--message-light .turnstile-status[data-status="success"], .m-newsletter-form--message-light .turnstile-status[data-status="error"], .m-newsletter-form--message-light .form__success, .m-newsletter-form--message-light .form__error { color: #ffffff; } window.MINIMALIST_NEWSLETTER = window.MINIMALIST_NEWSLETTER || { WORKER_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:8787' : 'https://minimalist-studio-newsletter.jmc3.workers.dev', async submitNewsletterForm(form) { try { // Reset any previous messages const successDiv = form.querySelector('.form__success'); const errorDiv = form.querySelector('.form__error'); const statusDiv = form.querySelector('.turnstile-status'); if (successDiv) successDiv.style.display = 'none'; if (errorDiv) errorDiv.style.display = 'none'; if (statusDiv) statusDiv.textContent = ''; const email = form.querySelector('input[name="contact[email]"]').value; const tokenInput = form.querySelector('input[name="cf-turnstile-response"]'); const submitButton = form.querySelector('.m-newsletter-form__button'); const turnstileWidget = form.querySelector('.cf-turnstile'); if (!tokenInput?.value) { if (statusDiv) { statusDiv.textContent = '⚠ Please complete the verification'; statusDiv.setAttribute('data-status', 'error'); } return; } if (submitButton) { submitButton.setAttribute('disabled', 'disabled'); } // Get the token value and immediately clear it to prevent reuse const token = tokenInput.value; tokenInput.value = ''; const response = await fetch(this.WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', }, body: JSON.stringify({ email: email, 'cf-turnstile-response': token }) }); const result = await response.json(); // Check both the HTTP status and the result success flag if (response.ok && result.success === true) { if (successDiv) { successDiv.style.display = 'block'; } if (statusDiv) { statusDiv.textContent = '✓ Successfully subscribed'; statusDiv.setAttribute('data-status', 'success'); } form.reset(); } else { const errorMessage = result.error || 'Failed to subscribe. Please try again.'; if (errorDiv) { errorDiv.textContent = errorMessage; errorDiv.style.display = 'block'; } if (statusDiv) { statusDiv.textContent = '⚠ ' + errorMessage; statusDiv.setAttribute('data-status', 'error'); } } // Always reset Turnstile after attempt if (turnstileWidget) { turnstile.reset(turnstileWidget); } // Reset submit button state if (submitButton) { submitButton.setAttribute('data-state', 'disabled'); } } catch (error) { console.error('Newsletter submission error:', error); const errorDiv = form.querySelector('.form__error'); const statusDiv = form.querySelector('.turnstile-status'); const turnstileWidget = form.querySelector('.cf-turnstile'); if (errorDiv) { errorDiv.textContent = 'An error occurred. Please try again.'; errorDiv.style.display = 'block'; } if (statusDiv) { statusDiv.textContent = '⚠ An error occurred. Please try again.'; statusDiv.setAttribute('data-status', 'error'); } // Reset Turnstile on error if (turnstileWidget) { turnstile.reset(turnstileWidget); } // Reset submit button state if (submitButton) { submitButton.setAttribute('data-state', 'disabled'); } } finally { const submitButton = form.querySelector('.m-newsletter-form__button'); if (submitButton) { submitButton.removeAttribute('disabled'); } } } }; window.onTurnstileSuccess = function(token) { const forms = document.querySelectorAll('.m-newsletter-form form'); forms.forEach(form => { let tokenInput = form.querySelector('input[name="cf-turnstile-response"]'); if (!tokenInput) { tokenInput = document.createElement('input'); tokenInput.setAttribute('type', 'hidden'); tokenInput.setAttribute('name', 'cf-turnstile-response'); form.appendChild(tokenInput); } tokenInput.value = token; const submitButton = form.querySelector('.m-newsletter-form__button'); if (submitButton) { submitButton.setAttribute('data-state', 'enabled'); } const turnstileWidget = form.querySelector('.cf-turnstile'); if (turnstileWidget) { turnstileWidget.removeAttribute('data-state'); } const statusDiv = form.querySelector('.turnstile-status'); if (statusDiv) { statusDiv.textContent = '✓ Verification complete'; statusDiv.setAttribute('data-status', 'success'); } }); }; window.onTurnstileError = function() { const forms = document.querySelectorAll('.m-newsletter-form form'); forms.forEach(form => { const turnstileWidget = form.querySelector('.cf-turnstile'); if (turnstileWidget) { turnstileWidget.setAttribute('data-state', 'visible'); } const statusDiv = form.querySelector('.turnstile-status'); if (statusDiv) { statusDiv.textContent = '⚠ Verification failed - please try again'; statusDiv.setAttribute('data-status', 'error'); } // Clear any existing token const tokenInput = form.querySelector('input[name="cf-turnstile-response"]'); if (tokenInput) { tokenInput.value = ''; } // Disable submit button const submitButton = form.querySelector('.m-newsletter-form__button'); if (submitButton) { submitButton.setAttribute('data-state', 'disabled'); } }); }; document.addEventListener('DOMContentLoaded', function() { const forms = document.querySelectorAll('.m-newsletter-form form'); forms.forEach(form => { form.setAttribute('action', 'javascript:void(0);'); form.setAttribute('onsubmit', 'return false;'); form.addEventListener('submit', function(e) { e.preventDefault(); e.stopPropagation(); window.MINIMALIST_NEWSLETTER.submitNewsletterForm(this); return false; }, true); }); }); Thanks for subscribing! Check your email for 10% off. Subscribe #shopify-section-template--16998228230191__newsletter_BgbgE9 .m-newsletter-section__description {opacity: 0.8;} #m-section--template--16998228230191__16211564572f5acba8 { --column-gap: 30px; --column-gap-mobile: 16px; --row-gap: 40px; --row-gap-mobile: 30px; --items: 4; --section-padding-top: 30px; --section-padding-bottom: 30px; } Hot This Week [{"id": 43478812917807, "title": "Default Title", "available": true,"inventory_quantity": 20,"inventory_policy": "deny","inventory_management": "shopify"}] Add to cart Add to Cart The Starter Pack Regular price $34.99 Sale price $34.99 Regular price $44.91 Unit price / 9 of our best-selling cards in 1 bundle. Our Cards That Don't Suck™ have all... Add to Cart Add to cart [{"id": 43486683267119, "title": "Default Title", "available": true,"inventory_quantity": 20,"inventory_policy": "deny","inventory_management": "shopify"}] Add to cart Add to Cart The Profanity Pack Regular price $34.99 Sale price $34.99 Regular price $44.91 Unit price / D