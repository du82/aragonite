 bigger than 25K in size. Animation allowed but no Flash. Buy a 300×250 Banner 125×125 Button Sponsorship The 125×125 button appear on every page, under the heading “John Chow dot Com Sponsors.” Button locations are randomized with each page load to give advertisers even exposure. Pricing is $500 per month per button. Only eight spots are available. The button can not be bigger than 15K in size. Animation allowed but no Flash. If you’re interested in securing a 125×125 button sponsorship, Email your ad to johnchow@johnchow.com and pay by clicking the PayPal link below. Buy a 125×125 Button Sponsored Reviews The blog accepts sponsored reviews at a rate of $500 per review. Sponsored reviews receive at least 12 hours as the top front page post. The gives your review maximum exposure to John Chow dot Com readers. You can read some of our reviews here. To order a review, send all the information about your product or service and paypal $500 to johnchow@johnchow.com. The average review takes 3 to 5 days to complete. Sponsored Tweets The blog accepts sponsored tweets at $117.65 per tweet. Your message may be tweeted up to three to give you a good return on investment. We write our tweets with the goal of having it retweeted by our followers. Please note that if you order a Sponsored Review, you automatically receive a Sponsored Tweet. Buy a Sponsored Tweet What Our Advertisers Are Saying We’ve made at least 10 times of what we spent so far. We paid $1,250, and we made over $13,500 as of right this second with the SGR Affiliate Program. On top of that, we’ve had over 312 subscribers to our newsletter only within 72 hours. We still have over 25 days to go. The truth is this is the BEST ROI ever for me as an advertiser. Zeila Rich According to Google Analytics, initial stats show a little under 400 clicks have been sent over since the new design went live, which went live on Aug 22. Stats also show the average referral from John Chow views 2.24 pages and spends an average of 8:58 minutes on the blog. Zac Johnson from his post on Aug 24. I have not tracked sales from most of my ReviewMe reviews (because I do not generally track that granular), but John Chow put up affiliate links in his review of my ebook, and I can tell you that his review paid for itself the first day. Aaron Wall – SEO Book"
