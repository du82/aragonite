["https://johnconway.art/retro_diplodocus"]
title = "Retro Diplodocus  by John Conway"
description = '''
When I was about fourteen or fifteen, I went to an exhibition called "The Great Russian Dinosaurs" at the Australian Museum in Sydney. Fresh-faced from my readings of Bakker, I was excited, and looking for a fight with all that stuffy orthodoxy I had read so much about. Luckily, I found myself outraged at once by the mounting of the skeletons. Hadrosaurs rearing high! Ribs not properly swept back! I was spluttering with the kind of smugness that only a teenage fanatic can have, and decided that something must be said. So, I bailed up one of the palaeontologists travelling with the exhibition, and confronted him about one of the most heinous of crimes against the Light of the Dinosaur Renaissance: an ankylosaur with semi-sprawling front legs.
With a supercilious smile I enquired politely as to why he had mounted the creature in such a way. He shrugged and said "Real animals move — they change position sometimes". How was I supposed to fight with that? All my trackway data, my shoulder anatomy arguments, rendered moot by an evasive side-step. So, I thought, this man is an idiot, and I know just how to test him: I asked him if he thought Velociraptor had feathers. "Maybe" he said, without a trace of sarcasm. Foiled! I stalked off to visualise the most feathers, erectest gaits, hottest blood, and fastest running dinosaurs I could from those evil mounts.
What's the point of all this you ask? Well...
My betrayal of the dinosaur renaissance. Guess what teenage John, sauropods were scaley and spikey. Sometimes they dragged their tails on the ground. And maybe they weren't always standing on their back legs to feed or fend off an Allosaurus running at a gazillion miles an hour.'''
full_description = '''Retro Diplodocus When I was about fourteen or fifteen, I went to an exhibition called "The Great Russian Dinosaurs" at the Australian Museum in Sydney. Fresh-faced from my readings of Bakker, I was excited, and looking for a fight with all that stuffy orthodoxy I had read so much about. Luckily, I found myself outraged at once by the mounting of the skeletons. Hadrosaurs rearing high! Ribs not properly swept back! I was spluttering with the kind of smugness that only a teenage fanatic can have, and decided that something must be said. So, I bailed up one of the palaeontologists travelling with the exhibition, and confronted him about one of the most heinous of crimes against the Light of the Dinosaur Renaissance: an ankylosaur with semi-sprawling front legs. With a supercilious smile I enquired politely as to why he had mounted the creature in such a way. He shrugged and said "Real animals move — they change position sometimes". How was I supposed to fight with that? All my trackway data, my shoulder anatomy arguments, rendered moot by an evasive side-step. So, I thought, this man is an idiot, and I know just how to test him: I asked him if he thought Velociraptor had feathers. "Maybe" he said, without a trace of sarcasm. Foiled! I stalked off to visualise the most feathers, erectest gaits, hottest blood, and fastest running dinosaurs I could from those evil mounts. What's the point of all this you ask? Well... My betrayal of the dinosaur renaissance. Guess what teenage John, sauropods were scaley and spikey. Sometimes they dragged their tails on the ground. And maybe they weren't always standing on their back legs to feed or fend off an Allosaurus running at a gazillion miles an hour. Adobe Photoshop on a Mac, 2007 Dinosaurs Sauropods Retro Diplodocus DinosaurRenaissance Bakker HotBlooded TailDragging'''
