["https://johnconway.art/uncomposition_supersaurus"]
title = "Uncomposition: Supersaurus  by John Conway"
description = """
Supersaurus in a forest in the Late Jurassic. 
This is the second painting in a series, where I am attempting to avoid deliberately posing and placing the animals in a composition. Usually we compose animals in scenes for aesthetic reasons, and avoid confusing angles or poses. Obscuring parts (particularly heads and eyes) is nearly always avoided. What if I try to purge those rules? Will a new sort of naturalism develop? 
In this painting I closed my eyes as a moved the animals and trees from side to side. So they are (somewhat) randomly placed. However, it is derived from an uncompleted painting where the animals were posed without the idea of uncomposition in mind, so there's still elements of the process to work on."""
full_description = "Uncomposition: Supersaurus Supersaurus in a forest in the Late Jurassic. This is the second painting in a series, where I am attempting to avoid deliberately posing and placing the animals in a composition. Usually we compose animals in scenes for aesthetic reasons, and avoid confusing angles or poses. Obscuring parts (particularly heads and eyes) is nearly always avoided. What if I try to purge those rules? Will a new sort of naturalism develop? In this painting I closed my eyes as a moved the animals and trees from side to side. So they are (somewhat) randomly placed. However, it is derived from an uncompleted painting where the animals were posed without the idea of uncomposition in mind, so there's still elements of the process to work on. Affinity Photo on a Mac, 2022 Uncomposition Sauropods Dinosaurs Painting Forest Palaeo Jurassic"
year_published = 2022
