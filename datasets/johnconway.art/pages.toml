["https://johnconway.art/saurolophus_tarbosaurus"]
title = "Saurolophus and Tarbosaurus  by John Conway"
description = "The duckbilled dinosaur Saurolophus angustirostris tries to get away from a very spritely Tarbosaurus bataar. This is a digital re-working of an oil painting I did in 1999 or so. The original painting was full of errors in proportion, biomechanics and environment, and I've tried to correct many of those here. The landscape of the Nemegt Formation was probably not as savannah-like as I've shown, but the minimalist landscape was what I particularly liked about the original painting, so I've kept it."
full_description = "Saurolophus and Tarbosaurus The duckbilled dinosaur Saurolophus angustirostris tries to get away from a very spritely Tarbosaurus bataar. This is a digital re-working of an oil painting I did in 1999 or so. The original painting was full of errors in proportion, biomechanics and environment, and I've tried to correct many of those here. The landscape of the Nemegt Formation was probably not as savannah-like as I've shown, but the minimalist landscape was what I particularly liked about the original painting, so I've kept it. Oil on Canvas, Adobe Photoshop on a Mac, 2014 Palaeo Painting TarbosaurusBataar SaurolophusAngustirostris Paleo Dinosaurs Mongolia Cretaceous FeatheredDinosaurs"
year_published = 2014
