["https://johnconway.art/uncomposition_the_flock"]
title = "Uncomposition: The Flock  by John Conway"
description = """
A flock of Campylognathoides liasicus, some time in the Late Jurassic.
This is the third painting in a series, where I am attempting to avoid deliberately posing and placing the animals in a composition. Usually we compose animals in scenes for aesthetic reasons, and avoid confusing angles or poses. Obscuring parts (particularly heads and eyes) is nearly always avoided. What if I try to purge those rules? Will a new sort of naturalism develop?"""
full_description = "Uncomposition: The Flock A flock of Campylognathoides liasicus, some time in the Late Jurassic. This is the third painting in a series, where I am attempting to avoid deliberately posing and placing the animals in a composition. Usually we compose animals in scenes for aesthetic reasons, and avoid confusing angles or poses. Obscuring parts (particularly heads and eyes) is nearly always avoided. What if I try to purge those rules? Will a new sort of naturalism develop? Pixelmator Pro on a Mac, 2022 Uncomposition Pterosaurs Campylognathoides Flock Sky Rhamphorynchoids"
