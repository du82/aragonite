["https://johnconway.art/jehol_biota"]
title = "Jehol Biota by  - Jehol Biota"
description = """
A representation of the Cretaceous Jehol Biota from some of the largest fossils to the smallest. At the largest scale you can see the ornithopod dinosaur Jinzhousaurus yangi, while the anurognathid pterosaur Dendrorhynchoides curvidentatus flies through the centre. Closer in you can see that Dendrorhynchoides is hunting the ichneumon wasp Tanychora beipioensis, which is covered with the pollen Protoconiferous funarius.
It was made with a series of Photoshop paintings at progressively smaller scales, which were stitched together and animated in After Effects."""
