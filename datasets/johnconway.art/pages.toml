["https://johnconway.art/uncomposition_the_river"]
title = "Uncomposition: The River  by John Conway"
description = """
Some dinosaurs and other animals by a river some time in the Jurassic. 
This is the first painting in a series, where I am attempting to avoid deliberately posing and placing the animals in a composition. Usually we compose animals in scenes for aesthetic reasons, and avoid confusing angles or poses. Obscuring parts (particularly heads and eyes) is nearly always avoided. What if I try to purge those rules? Will a new sort of naturalism develop? 
I don't feel like I really captured the whole spirit of uncomposition in this work - I tried without a randomising process. I tried just to clear my mind of compositional ideas, but obviously the whole sweep of the painting is highly composed."""
full_description = "Uncomposition: The River Some dinosaurs and other animals by a river some time in the Jurassic. This is the first painting in a series, where I am attempting to avoid deliberately posing and placing the animals in a composition. Usually we compose animals in scenes for aesthetic reasons, and avoid confusing angles or poses. Obscuring parts (particularly heads and eyes) is nearly always avoided. What if I try to purge those rules? Will a new sort of naturalism develop? I don't feel like I really captured the whole spirit of uncomposition in this work - I tried without a randomising process. I tried just to clear my mind of compositional ideas, but obviously the whole sweep of the painting is highly composed. Affinity Photo on a Mac, 2022 Uncomposition Sauropods Dinosaurs Painting Random Theropods Allosaurs River Jurassic"
