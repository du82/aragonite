full_description = "A History of Painting (With Dinosaurs) A History of Painting: With Dinosaurs is a visual journey through the history of painting, from the late Middle Ages to the Twentieth Century – a glimpse into what might have been, had the great artists painted dinosaurs. Illustrated with over fifty artworks, A History of Painting is either a big joke that will make you smile, or a serious questioning of subject matter in art that will make you think; you decide. Where to Buy A History of Painting is available as a paperback and Kindle ebook on the following Amazon sites:* 🇦🇺 Australia 🇨🇦 Canada 🇫🇷 France 🇩🇪 Germany 🇮🇹 Italy 🇯🇵 Japan 🇲🇽 Mexico 🇳🇱 Netherlands 🇸🇬 Singapore 🇪🇸 Spain 🇹🇷 Turkey 🇺🇸 US 🇬🇧 UK *This may not be a complete list, please search your local Amazon if it's not listed.) You can also get it as an eBook on Apple Books: ...or get an ePub file you can use in a reader of your choice (DRM free): ePub → All Yesterdays Unique and Speculative Views of Dinosaurs and Other Prehistoric Animals By me, C. M. Kosemen and Dr. Darren Naish with skeletal drawings by Scott Hartman, All Yesterdays is an illustrated survey of possibilities and details we might be overlooking in contemporary reconstructions of extinct animals. In two parts, we examine speculative possibilities that may not have been preserved in the fossil record, and muse on what future palaeontologists may think when reconstructing animals that live today. Where to Buy: Available in KINDLE,* IBOOK, NOOK, EPUB, and PAPERBACK versions. *You can download a free Kindle reader app for your computer, tablet, or phone from Amazon HERE. Cryptozoologicon The Biology, Evolution, and Mythology of Hidden Animals By me, C. M. Kosemen and Dr. Darren Naish, Cryptozoologicon is a celebration of the myths, legends, evolution and biology of hidden animals. Always sceptical, but always willing to indulge in speculative fun, Cryptozoologicon aims to provide a new way to approach cryptozoology: as fictional biology. Where to Buy: Available in KINDLE* IBOOK NOOK EPUBand PAPERBACK versions. *You can download a free Kindle reader app for your computer, tablet, or phone from Amazon HERE."
