["https://johnconway.co/avimimus-portentosus"]
title = "Avimimus portentosus  by John Conway"
description = """
Avimimus portentosus was a small maniraptoran theropod from the Late Cretaceous of Mongolia.
This work was orgininally an oil painting, which I did in 2001 or so for an exhibition of Australian palaeontology, and was meant to represent the Australian theropod Kakuru. However, since Kakuru is only known from a tibia, I based the reconstruction entirely on Avimimus. So for this digital workover, I am hereby instating it with its proper name."""
full_description = "Avimimus portentosus Avimimus portentosus was a small maniraptoran theropod from the Late Cretaceous of Mongolia. This work was orgininally an oil painting, which I did in 2001 or so for an exhibition of Australian palaeontology, and was meant to represent the Australian theropod Kakuru. However, since Kakuru is only known from a tibia, I based the reconstruction entirely on Avimimus. So for this digital workover, I am hereby instating it with its proper name. Adobe Photoshop on a Mac, 2013 Palaeo Painting Paleo Dinosaurs Theropods Dinobirds Mesozoic Mongolia FeatheredDinosaurs Naturalistic"
