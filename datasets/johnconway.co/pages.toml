["https://johnconway.co/branch_space"]
title = "Branch Space  by John Conway"
description = """
(... is probably not best viewed on a phone)
Branch Space is a little graphical program of mine that aims to capture certain aspects of evolution. It starts with single branch in the middle, growing in a random direction. At a randomised branch length, it splits, and new branches radiate in random directions. This loop is repeated forever. Branches are terminated if the number of branches is too high. Branches run a higher risk of being terminated if they cross another branch. The colour of branches drifts randomly. Random pixels of the canvas are erased over time, making older branches fade.
I like to think of it as organisms exploring ecological space - if they radiate into a space that is full, they run a higher risk of extinction, if they radiate into empty space they can expand and diversify."""
full_description = "Branch Space (... is probably not best viewed on a phone) Branch Space is a little graphical program of mine that aims to capture certain aspects of evolution. It starts with single branch in the middle, growing in a random direction. At a randomised branch length, it splits, and new branches radiate in random directions. This loop is repeated forever. Branches are terminated if the number of branches is too high. Branches run a higher risk of being terminated if they cross another branch. The colour of branches drifts randomly. Random pixels of the canvas are erased over time, making older branches fade. I like to think of it as organisms exploring ecological space - if they radiate into a space that is full, they run a higher risk of extinction, if they radiate into empty space they can expand and diversify. BBEdit, HTML & Javascript, 2018 Apps Evolution Ambient Programs"
year_published = 2018
