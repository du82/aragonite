["https://www.johndcook.com/blog/2023/09/09/triangle-subdivision"]
title = "Subdividing a triangle mesh with incenter and circumcenter"
description = "Repeated subdivision of triangles changes dramatically when you change how you define the center of the triangle."
full_description = "How you define center matters a lot Posted on 9 September 2023 by John Earlier I wrote a post showing what happens when you start with an equilateral triangle, then repeatedly subdivide it into smaller and smaller triangles by drawing lines from the centroid (barycenter) to each of the vertices. I mentioned in that post that I moved the code for finding the center to its own function because in the future I might want to see what happens when you look at different choices of center. There are thousands of ways to define the center of a triangle. This post will look at 4 levels of recursive division, using the barycenter, incenter, and circumcenter. Barycenter The barycenter of a set of points is the point that would be the center of mass if each point had the same weight. (The name comes from the Greek baros for weight. Think barium or bariatric surgery.) This is the method used in the earlier post. Incenter The incenter of a triangle is the center of the largest circle that can be drawn inside the triangle. When we use this definition of center and repeatedly divide our triangle, we get a substantially different image. Circumcenter The circumcenter of a triangle is the center of the unique circle that passes through each of the three vertices. This results in a very different image because the circumcenter of a triangle may be outside of the triangle. By recursively dividing our triangle, we get a hexagon! Related posts Circumcenter and orthocenter Nine point circle Douglas Hofstadter’s triangle center Categories : MathTags : GeometryBookmark the permalink"
