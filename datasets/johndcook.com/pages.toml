["https://www.johndcook.com/blog/2009/11/04/little-coffee-on-the-prairie"]
title = "A little coffee on the prairie"
description = "I was reading Little House on the Prairie with my youngest daughter the other day. Here's a passage that surprised me. Then Pa brought water from the creek, while Mary and Laura helped Ma get supper. Ma measured coffee beans into the coffee mill and Mary ground them. I'd read this book with my other"
full_description = "A little coffee on the prairie Posted on 4 November 2009 by John I was reading Little House on the Prairie with my youngest daughter the other day. Here’s a passage that surprised me. Then Pa brought water from the creek, while Mary and Laura helped Ma get supper. Ma measured coffee beans into the coffee mill and Mary ground them. I’d read this book with my other children and hadn’t given this part a thought. This time I thought about how odd it was that they had coffee. At this point the Ingalls family was moving from Wisconsin to Kansas some time in the 1870s. The family of five and all their worldly goods were packed into a covered wagon. They shot wild game for food. They gathered water from creeks. And yet they had coffee. Coffee doesn’t grow in the continental United States. It grows in the tropics at high altitudes. These settlers living off the land in the middle of nowhere had some coffee beans that had been imported from thousands of miles away. It’s interesting to think that despite all that they lacked, they had these tropical beans and apparently took them for granted. Said another way, of all the benefits of civilization, coffee made the short list of things settlers chose to take with them. Categories : UncategorizedTags : CoffeeBookmark the permalink JD Long 4 November 2009 at 09:18 I wonder what else falls into this category? Salt and sugar maybe? Flour would be a staple they may have bought but it would not have come from far away. Reminds me that the whole ‘white folk expansion’ of the 1500’s was spawned by the spice and gold trade. I’ll have to send my nieces and nephews researching this. They are my rural American distributed research network. Sort of a mechanical turk of kids under 15. Sue VanHattum 4 November 2009 at 09:22 I wonder if it’s accurate. I’ve heard good things about the accuracy of that series, but it does seem strange. John 4 November 2009 at 09:22 I don’t know about salt, but the first book in the series talks about how they made sugar from maple trees. Maple sugar was for every day use. They bought a little white sugar to bring out when guests came over."
