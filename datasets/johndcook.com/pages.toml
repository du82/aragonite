["https://www.johndcook.com/blog/2021/04/19/martian-gravity"]
title = "Gravity on Mars compared to Earth and Moon"
description = "Mars is a sort of geometric mean between the Earth and the moon."
full_description = "Martian gravity Posted on 19 April 2021 by John There is a lot of talk about Mars right now, and understandably so. The flight of Ingenuity today was awesome. As Daniel Oberhaus pointed out on Twitter, … the atmosphere on the surface of Mars is so thin that it’s the equivalent of flying at ~100k feet on Earth. No rotorcraft, piloted or uncrewed, has ever broken 50k on Earth. When I heard that gravity on Mars is about 1/3 of that of Earth, that sounded too small to me. My thinking was that gravity on the moon is about 1/6 of Earth, and Mars is much bigger than the moon, so gravity on Mars ought to be closer to gravity on Earth Where I went wrong was my assessment that Mars is “much” bigger than the moon. The radius of Mars is only about twice that of our moon; I would have guessed higher. Surface gravity is proportional to mass over radius squared. If the density of two balls is the same, then mass goes up like radius cubed, and so gravity would increase in proportion to radius. The density of Mars and the moon are about the same, and so the object with twice the radius has about twice the surface gravity. Let’s put some numbers to things. We’ll let m and r stand for mass and mean radius. And we’ll let subscripts E, M, and L stand for Earth, Mars, and Luna (our moon). rE = 6371 km rM = 3390 km rL = 1738 km The radius of Mars is approximately the geometric mean of the radii of the Earth and the moon. (rE rL)½ = 3327 ≈ 3390 = rM To calculate surface gravity we’ll need masses [1]. mE = 5.972 × 1024 kg mM = 6.417 × 1023 kg mL = 7.342 × 1022 kg The mass of Mars is also approximately the geometric mean of the masses of the Earth and the moon [2]. (mE mL)½ = 6.6 × 1023 ≈ 6.4× 1023 = mM The ratio of Martian gravity to lunar gravity is (mM / rM²) / (mL / rL²) = 2.2968 The ratio of Earth gravity to Martin gravity is (mE / rE²) / (mM / rM²) = 2.6140 so saying surface gravity on Mars is a third of that on Earth underestimates gravity on Mars a little but not too much. More Mars-related posts Flying to Mars in three days Mars, Magic Squares, and Music [1] I’m assuming mass is uniformly distributed for each body. It’s not exactly, and this makes a difference if you’re planning satellite trajectories, but it doesn’t make much of a difference here. [2] This is not a consequence of the relationship between the radii because the bodies have different densities. The moon and Mars have similar densities, but both are significantly less dense than Earth. Categories : ScienceBookmark the permalink"
