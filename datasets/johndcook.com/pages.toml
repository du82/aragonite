["https://www.johndcook.com/blog/articles"]
title = "Journal articles and technical reports"
description = "Publications in Bayesian statistics, numerical analysis, clinical trial design, and nonlinear partial differential equations by John Cook"
full_description = "Publications This page lists journal articles and technical reports. You can also find hundreds of articles on applications of math, statistics, and computing on my blog. Cristian Bologa, Vernon Shane Pankratz, Mark L Unruh, Maria Eleni Roumelioti, Vallabh Shah, Saeed Kamran Shaffi, Soraya Arzhan, John Cook, Christos Argyropoulos. Generalized mixed modeling in massive electronic health record databases: What is a healthy serum potassium? Submitted to SIAM Conference on Data Mining. Abstract. Converting electronic health record (EHR) entries to useful clinical inferences requires one to address computational challenges due to the large number of repeated observations in individual patients. Unfortunately, the libraries of major statistical environments which implement Generalized Linear Mixed Models for such analyses have been shown to scale poorly in big datasets. The major computational bottleneck concerns the numerical evaluation of multivariable integrals, which even for the simplest EHR analyses may involve hundreds of thousands or millions of dimensions (one for each patient). The Laplace Approximation (LA) plays a major role in the development of the theory of GLMMs and it can approximate integrals in high dimensions with acceptable accuracy. We thus examined the scalability of Laplace based calculations for GLMMs. Based on our experience on the HKBP we conclude that the combination of the Laplace approximation and automatic differentiation offers a computationally efficient approach for the analysis of big repeated measures data with GLMMs. Jay Schinfeld, Fady Sharara, Randy Morris, Gianpiero D. Palermo, Zev Rosenwaks, Eric Seaman, Steve Hirshberg, John Cook, Cristina Cardona, G. Charles Ostermeier, and Alexander J. Travis. Cap-Score™ Prospectively Predicts Probability of Pregnancy, Molecular Reproduction and Development. 2018 Abstract. Semen analysis (SA) poorly predicts male fertility, because it does not assess sperm fertilizing ability. The percentage of capacitated sperm determined by GM1 localization (“Cap-Score™”), differs between cohorts of fertile and potentially infertile men, and retrospectively, between men conceiving or failing to conceive by intrauterine insemination (IUI). Here, we prospectively tested whether Cap−Score can predict male fertility with the outcome being clinical pregnancy within ≤3 IUI cycles. Cap-Score and SA were performed (n=208) with outcomes initially available for 91 men. Men were predicted to have either low (n=47) or high (n=44) chance of generating pregnancy using previously-defined Cap-Score reference ranges. Absolute and cumulative pregnancy rates were reduced in men predicted to have low pregnancy rates versus high [(absolute: 10.6% vs 29.5%, p=0.04); (cumulative: 4.3% vs 18.2%, 9.9% vs 29.1%, and 14.0% vs 32.8% for cycles 1-3, n=91, 64 and 41, p=0.02)]. Only Cap-Score, not male/female age or SA results, differed significantly between outcome groups. Logistic regression evaluated Cap-Score and SA results relative to the probability of generating pregnancy (PGP) for men who were successful in, or completed, 3 IUI cycles (n=57). Cap-Score was significantly related to PGP (p=0.01). The model fit was then tested with 67 additional patients (n=124; 5 clinics); the equation changed minimally, but fit improved (p<0.001; margin of error: 4%). The Akaike Information Criterion found the best model used Cap-Score as the only predictor. These data show that Cap-Score provides a practical, predictive assessment of male fertility, with applications in assisted reproduction and treatment of male infertility. Yining Dua, John D. Cook, J. Jack Lee. Comparing Three Regularization Methods to Avoid Extreme Allocation Probability for Response Adaptive Randomization, Journal of Biopharmaceutical Studies, 2017. Abstract. Under the Bayesian framework, the simple response adaptive randomization (SAR) scheme is to randomize patients to a treatment with probability p which is a function of the probability that the treatment is better. We examine three variations on response-adaptive randomization (RAR) which are used to compromise between this scheme and equal randomization (ER) by varying the tuning parameter in the allocation probability. The first variation is to apply a power transformation (PT) to p to obtain randomization probabilities. The second is to clip p to live within specified lower and upper bounds. The last is to begin the trial with a burn-in period of equal randomization. In each method, both the mean proportion of patients treated on the superior arm and mean response rate increased as one was closer to SAR, while statistical power increased as one closed to ER. Without early stopping, the PT method put the most patients on the better arm given the same power. With the efficacy early stopping rule, the PT method provided both higher mean proportion to the better treatment arm and higher response rate, while the clip method had higher power. In terms of the mean patients enrolled in the trial, the PT method required the most patients and the burn-in method required the fewest. John D. Cook, Robert Primmer, Ab de Kwant. Comparing cost and performance of replication in erasure coding. Hitachi Review, vol 63 (July 2014). Abstract. Data storage systems are more reliable than their individual components. In order to build highly reliable systems out of less reliable parts, systems introduce redundancy. In replicated systems, objects are simply copied several times with each copy residing on a different physical device. While such an approach is simple and direct, more elaborate approaches such as erasure coding can achieve equivalent levels of data protection while using less redundancy. This report examines the trade-offs in cost and performance between replicated and erasure encoded storage systems. John D. Cook Approximating random inequalities with Edgeworth expansions (2012). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 78. Abstract. Random inequalities of the form Prob (X > Y + δ) often appear as part of Bayesian clinical trial methods. Simulating trial designs could require calculating millions of random inequalities. When these inequalities require numerical integration, or worse random sampling, the inequality calculations account for the large majority of the simulation time. In this paper we show how to approximate random inequalities using Edgeworth expansions. The calculations required to use these expansions can be done in closed form, as we will see below. Although the calculations are elementary, they are also somewhat tedious, and so we include Python code to illustrate how to use the approximations in practice. We make no distributional assumptions on the random variables X and Y other than requiring that the necessary moments exist. The accuracy of the approximation will depend on how well the densities of these random variables are approximated by the Edgeworth expansions. John D. Cook Fast approximation of gamma inequalities (2012). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 77. Abstract. Approximation for computing P(X > Y + δ) for independent gamma random variables X and Y. John D. Cook Fast approximation of beta inequalities (2012). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 76. Abstract. Approximation for computing P(X > Y + δ) for independent beta random variables X and Y. John D. Cook CRM: Prior means and medians (2012). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 73. Abstract. Resolving the confusion between two ways of specifying a CRM dose-finding trial design. John D. Cook Random inequalities between survival and uniform distributions (2011). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 71. Abstract. This note will look at ways of computing Prob(X > Y) where X is a distribution modeling survival (gamma, inverse gamma, Weibull, log-normal) and Y has a uniform distribution. Each of these can be computer in closed form in terms of common statistical functions. We begin with analytical calculations and then include software implementations in R to make some of the details more explicit. Finally, we give a suggestion for using simulation to compute random inequalities that cannot be computed in closed form. John D. Cook Basic properties of the soft maximum (2011). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 70. Abstract. This note presents the basic properties of the soft maximum, a smooth approximation to the maximum of two real variables. It concludes by looking at potential numerical difficulties with the soft maximum and how to avoid these difficulties. John D. Cook, Jairo Fúquene, Luis Pericchi. Skeptical and optimistic robust priors for clinical trials, Revista Columbiana de Estadistica, (2011) 34 no. 2, pp. 333–345. Abstract. A useful technique from the subjective Bayesian viewpoint, suggested by Spiegelhalter et al. (1994), is to ask the subject matter researchers and other parties involved, such as pharmaceutical companies and regulatory bodies, for reasonable optimistic and pessimistic priors regarding the effectiveness of a new treatment. Up to now, the proposed skeptical and optimistic priors have been limited to conjugate priors, though there is no need for this limitation. The same reasonably adversarial points of view can be taken with robust priors. A recent reference with robust priors usefully applied to clinical trials is in Fuquene, Cook, and Pericchi (2009). Our proposal in this paper is to use Cauchy and intrinsic robust priors for both skeptical and optimistic priors leading to results more closely related with the sampling data when prior and data are in conflict. In other words, the use of robust priors removes the dogmatism implicit in conjugate priors. John D. Cook. Block Adaptive Randomization (2011). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 63. Abstract. This note proposes a block-adaptive randomization method to limit the length of runs in an outcome-adaptive randomized trial. John D. Cook Upper bounds on non-central chi-squared tails and truncated normal moments (2010). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 62. Abstract. We show that moments of the truncated normal distribution provide upper bounds on the tails of the non-central chi-squared distribution, then develop upper bounds for the former. John D. Cook Asymptotic results for Normal-Cauchy model (2010). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 61. Abstract. This report proves asymptotic results for the posterior mean when sampling from a normal distribution with a Cauchy prior on the location parameter. John D. Cook How to test a random number generator (2009). Chapter 10 from Beautiful Testing: Leading Professionals Reveal How They Improve Software John D. Cook Determining distribution parameters from quantiles Abstract. Bayesian statistics often requires eliciting prior probabilities from subject matter experts who are unfamiliar with statistics. While most people an intuitive understanding of the mean of a probability distribution, fewer people understand variance as well, particularly in the context of asymmetric distributions. Prior beliefs may be more accurately captured by asking experts for quantiles rather than for means and variances. This note will explain how to solve for parameters so that common distributions satisfy two quantile conditions. We present algorithms for computing these parameters and point to corresponding software. The distributions discussed are normal, log normal, Cauchy, Weibull, gamma, and inverse gamma. The method given for the normal and Cauchy distributions applies more generally to any location-scale family. John D. Cook. Exact calculation of inequality probabilities (2009). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 54. Abstract. This note surveys results for computing the inequality probability Prob(X > Y) in closed form where X and Y are independent continuous random variables. Distribution families discussed include normal, Cauchy, gamma, inverse gamma, Levy, folded normal, and beta. Mixture distributions are also discussed. Jairo A. Fúquene P., John D. Cook, Luis Raúl Pericchi. A Case for Robust Bayesian priors with Applications to Binary Clinical Trials. Bayesian Analysis (2009) 4, Number 4, pp. 817–846. Abstract. Bayesian analysis is frequently limited to conjugate Bayesian analysis, particularly in the case in the analysis of clinical trial data. Even though conjugate analysis may be simpler computationally, the price to be paid is high: such analysis is not robust with respect to the prior, i.e., changing the prior may affect the conclusions without bound. Furthermore conjugate Bayesian analysis is blind with respect to the potential conflict between the prior and the data. On the other hand, robust priors have bounded influence. The prior is discounted automatically when there are conflicts between prior information and data. The original proposal of robust priors was made by de-Finetti in the 1960s. However, the practice has not taken hold in important areas such as in clinical trials where conjugate priors are ubiquitous. We show here how the Bayesian analysis for simple binary binomial data, after expressing in its exponentially family form, is improved by employing Cauchy priors. Moreover, we also introduce in the analysis of clinical trials a robust prior originally developed by J.O. Berger that gives closed-form results when coupled with a normal log-odds likelihood. Berger’s prior yields the superior robust analysis with no added computational complication compared to the conjugate analysis. We illustrate the results with famous textbook examples and a with data set and a prior from a previous trial. On the formal side, we give here a theorem that we call the “Polynomial Tails Comparison Theorem.” This theorem establishes the analytical behavior of any likelihood function with tails bounded by a polynomial when used with priors with polynomial-order tails, such as Cauchy or Student’s t. The likelihood does not have to be a location family nor exponential family distribution and the conditions of the theorem are easily verifiable. For Berger’s prior robustness can be established directly since the exact expressions for posterior moments are known. John D. Cook. Inequality Probabilities for Folded Normal Random Variables (2009). UT MD Anderson Cancer Center Department of Biostatistics Working Paper Series. Working Paper 52. Abstract. This note explains how to calculate the probability Prob(|X| > |Y|) for normal random v"
