["https://www.johndcook.com/blog/expert-testimony"]
title = "Expert statistical witness, legal testimony, litigation support"
description = "Consultant helping lawyers, judges, and juries understand subtle ideas in mathematics, especially probability and data analysis"
full_description = "Expert Testimony Juries don’t understand math, and yet more and more legal cases involve mathematics: understanding probabilities, drawing inferences from data, evaluating simulations, etc. This means it is becoming more necessary to grapple with sophisticated mathematical concepts and to communicate them to judges and juries, most of whom do not have strong backgrounds in mathematics and statistics. Solid statistical evidence is not persuasive unless judges and juries can appreciate the evidence. An expert statistical witness must have knowledge and experience to analyze and interpret data properly, professional credentials to be credible, and communication skills to convey the results to a non-technical audience. I can help on all accounts. Knowledge and experience Over my career I have worked in various areas of mathematics, statistics, and software development, at universities and private companies. I have consulted for large corporations such as Google and Amgen as well as smaller businesses and start-ups. This consulting complements my work in litigation support. I have served as a technical expert on cases involving intellectual property, personal injury, and class action, on the plaintiff side and on the defendant side. Professional credentials In 1992 I completed my PhD in mathematics from The University of Texas. Since then I’ve been an assistant professor at Vanderbilt University, a research statistician at MD Anderson Cancer Center, and adjunct faculty at The University of Texas Graduate School of Biomedical Sciences. Here are some of my publications. Communication skills An effective witness, in addition to being an expert, must be something of a teacher. I have taught at The University of Texas, Vanderbilt University, and the University of Texas Graduate School of Biomedical Sciences, and have given professional presentations to a wide variety of audiences. In my consulting work I often explain technical concepts to non-technical people. Working together To discuss how I can help your firm as an expert, please call or email to discuss your case. LET’S TALK"
