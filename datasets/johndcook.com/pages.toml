["https://www.johndcook.com/blog/2022/10/13/very-nearly-circular"]
title = "Planetary orbits are very nearly circular"
description = "Planets move in elliptical orbits, but it's not widely know how very nearly circular these ellipses are."
full_description = "Planetary orbits are very nearly circular Posted on 13 October 2022 by John If a science book shows you obviously elliptical orbits of planets, it is literally stretching the truth. I was taught that our benighted ancestors insisted that planetary orbits are circles for philosophical reasons. In fact, they insisted planetary orbits are circular because they very nearly are. Here’s a plot of the orbits of all nine planets in our solar system, or all eight planets and the dwarf planet Pluto if you prefer, scaled so that they all have the same semi-minor axis. See how far the “highly elliptical” orbit of Pluto extends past the perfect circle in the inside? Me neither. Here is how Kepler discovered that planets have elliptical orbits [1]. From 1601 to 1608, he [Kepler] tried fitting various geometrical curves to Tycho’s data on the positions of Mars. Finally, after struggling for almost a year to remove a discrepancy of of 8 minutes of arc (which a less honest man might have chosen to ignore!) Kepler hit upon the ellipse as a possible solution. It was only by obsessing over a discrepancy of 0.037% of a circle that Kepler was able to discover that Mars has an elliptical orbit. The next post explains why eccentricity numbers are misleading. The orbit of Pluto, for example, is “highly eccentric” with eccentricity 0.25, but this does not result in an orbit far from circular. [1] Roger Bate et al. Fundamentals of Astrodynamics. Dover. 1971 Categories : UncategorizedTags : Orbital mechanicsBookmark the permalink Oliver Knill 14 October 2022 at 09:41 amazing. I must say to feel like a fool. I could have bet that the ellipse is much less circular. But this is how textbook pictures can mislead. We have seen a picture of a rather large ellipse in thousands of pictures and so take this for granted. John 14 October 2022 at 10:52 Yes, in the sense that it’s eccentricity is about 0.2. But that does not mean that it’s orbit visually looks like an ellipse. For reasons I explain in the next post, the major axis of Mercury’s orbit is only about 2% wider than its minor axis."
author = "John"
year_published = 2022
