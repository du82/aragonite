["https://www.johndcook.com/blog/2025/02/27/code-profiling-without-a-profiler"]
title = "Code Profiling Without a Profiler"
description = "How can you tell what parts of your code are taking the most runtime, if you don't have or can't use a profiler? In this article we show how."
full_description = 'Code Profiling Without a Profiler Posted on 27 February 2025 by Wayne Joubert Making your code to run faster starts with understanding where in the code the runtime is actually spent. But suppose, for whatever reason, the code profiling tools won’t work? I recently used MS Visual Studio on a legacy C++ code. The code crashed shortly after startup when attempting to profile, though otherwise the code ran fine for both release and debug build targets. The cause of the problem was not immediately visible. If all else fails, using manual timers can help. The idea is to find a high-accuracy system wallclock timer function and use this to read the time before and after some part of the code you want to time. One can essentially apply “bisection search” to the code base to look for the code hot spots. See below for an example. This can be useful in various situations. Codes in complex languages (or even mixed languages in the code base) can have unusual constructs that break debuggers or profilers. Also, exotic hardware like embedded systems, GPUs or FPGAs may lack full profiler support. Additionally, brand new hardware releases often lack mature tool support, at least initially. Furthermore, profiling tools themselves, though helpful for getting a quick snapshot of the performance breakdown of each function in the code, have their own limitations. Profilers work either by instrumenting the executable code or sampling. Instrumenting can cause timing inaccuracies by adding overhead from calling the system timer on entrance and exit to every function called. Also it breaks function inlining, often reducing performance. Sampling on the other hand can be inaccurate if the sample rate is too low, or can distort runtime when sampling at too high a frequency. In contrast, manual timers can circumvent these problems by a very surgical application to specific parts of the code (though some profilers let you turn the profiler on and off at different parts of the code). Resorting to manual timing of code sections is a messy business. But sometimes it’s the only thing that will work. Visual Studio C++ Code Example // mycode.h #include "cstdio" #include "cstdarg" // Get time of day - elapsed seconds static double gtod() { LARGE_INTEGER ctr, freq; QueryPerformanceFrequency(&freq); QueryPerformanceCounter(&ctr); return static_cast(ctr.QuadPart) / static_cast(freq.QuadPart); } // Convenience function for printing to file static void FilePrintf(const char* format, ...) { char buffer[1024]; va_list args; va_start(args, format); vsnprintf(buffer, sizeof(buffer), format, args); va_end(args); FILE* myoutfile = fopen("mytimingsfile.txt", "a"); fprintf(myoutfile, "%s", buffer); fclose(myoutfile); } // Storage for timer extern double g_timer; // mycode.cpp #include "mycode.h" // Initialization for timer double g_timer = 0; int main() { // ... g_timer = 0; for (int i=0; i<n; ++i) { // ... const double t1 = gtod(); my_expensive_function(); g_timer += gtod() - t1; // ... } FilePrintf("my_expensive_function runtime: %.6f seconds.\n", g_timer); g_timer = 0; // ... Categories : Computing High Performance Computing Software developmentBookmark the permalink'
author = "Wayne Joubert"
