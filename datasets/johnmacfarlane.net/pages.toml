full_description = "John MacFarlane Professor of Philosophy University of California, Berkeley 314 Philosophy Hall Berkeley, CA 94720-2390 Tel: (510) 328-3546 Fax: (510) 642-4164 E-mail: jgm@berkeley.edu ORCID id: orcid.org/0000-0003-2557-9090 Office: 150 Philosophy Hall (office hours Tu 12:30-1:30, 3-4) My CV: HTML | PDF In addition to the Department of Philosophy, I am a member of the Group in Logic and the Methodology of Science and a co-organizer of the Meaning Sciences Club and the Townsend Center Working Group in the History and Philosophy of Logic, Mathematics, and Science. Most of my work is in the philosophy of logic and language. Other research interests include metaphysics and epistemology, the philosophy of mathematics, philosophical logic, the history of logic, Frege, Kant, ancient philosophy (particularly Aristotle), and fiddlosophy. I also enjoy making my own tools."
