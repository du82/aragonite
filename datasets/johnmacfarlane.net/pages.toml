full_description = "Dissertation Students My PhD students and what has become of them, organized by PhD year… 2024 Mathias Boehm (Updating the Common Ground). Junior Research Fellowship, Humboldt Universität zu Berlin. 2023 Sven Neth (Non-Ideal Decision Theory). Tenure track, University of Pittsburgh. 2021 Sophie Dandelet (Making Up Our Minds: Ethical Norms in Epistemic Inquiry). Bersoff postdoc, NYU. Assistant Professor, Cambridge University. 2019 Ethan Jerzak (Paradox in Thought and Natural Language). Tenure-track, National University of Singapore. Rachel Rudolph (Talking about Appearances: Experience, Evaluation, and Evidence in Discourse). Tenure-track, Auburn University. Associate Professor, UCSD. 2018 James Hutchinson (A Haunting Conviction: Frege on Truth and Logic). University of Indiana, Oscar R. Ewing Visiting Assistant Professor. Simon Fraser University, Lecturer. University of Toronto, Postdoctoral Scholar. Tenure-track, Nazarbayev University (Kazhakstan). Erica Klempner (Beauty, Art and Testimony: Subjectivity and Objectivity in Aesthetics). Berkeley Connect Fellow. 2017 Richard Lawrence (Nominalization, Specification, and Investigation). Berkeley Connect Fellow, UC Berkeley. Researcher, University of Tübingen. Postdoctoral Fellow, University of Vienna. Justin Vlasits (Platonic Division and the Origins of Aristotelian Logic). Postdoc, University of Tübingen. Tenure-track, University of Illinois, Chicago. 2016 Ethan Nowak (Two Dogmas about Demonstratives). Two-year teaching position at University College London. Leverhulme Early Career Fellow, King’s College London. Associate Professor, Umeå University, Sweden. 2015 Melissa Fusco (Deontic Modals and the Semantics of Choice). Tenure-track, Columbia University. 2014 Arpy Khatchirian (Substantive Truth and Knowledge of Meaning). Lecturer, UC Berkeley. Stanford Online High School. 2013 Justin Bledin (Logic Informed). Tenured, Johns Hopkins University. Michael Rieppel (Being Something: Prospects for a Property-Based Approach to Predicative Quantification). Tenured, Syracuse University. 2012 Joseph Barnes (A Platonic Account of Epistemic Value). Wissenschaftlicher Mitarbeiter, Humboldt-Universität zu Berlin. 2011 Stanley Chen (Matters of Taste Are Not “Mere Matters of Taste”). Harvard Law School, now a lawyer. Michael Caie (Rationality and Semantic Paradox). Tenured, University of Toronto (after University of Pittsburgh, Syracuse University, University of Rochester). 2010 Jessica Gelber (Causes and Kinds in Aristotle’s Embryology). Tenured, University of Toronto (after University of Pittsburgh and Syracuse University). 2009 Fabrizio Cariani (The Semantics of ‘Ought’ and the Unity of Modal Discourse). Tenure-track and then tenured, Northwestern University, now Professor, University of Maryland. 2008 Kenny Easwaran (The Foundations of Conditional Probability). Tenure-track at USC, tenured at Texas A&M, now Associate Professor in the Department of Logic and Philosophy of Science, UC Irvine. Mike Titelbaum (Quitting Certainties: A Doxastic Modeling Framework). Tenure-track and now tenured at University of Wisconsin, Madison. Andreas Anagnostopoulos (Aristotle on Change and Potentiality). Akademischer Rat, LMU Munich. 2007 Berislav Marusic (Skepticism Between Absurdity and Idleness). Tenure-track and tenured, Brandeis University. Now Senior Lecturer at University of Edinburgh. 2006 Bence Nanay (How Animals See the World: A Theory of Content for Action-Oriented Perceptual States). Professor of Philosophy and BOF Research Professor, University of Antwerp, and Senior Researc Associate, Peterhouse, University of Cambridge. 2005 Johannes Hafner (From Metamathematics to Philosophy: A Critical Assessment of Putnam’s Model-Theoretic Argument). Tenure-track at North Carolina State University. 2003 Elizabeth Camp (Saying and Seeing-As: The Linguistic, Cognitive, and Imaginative Uses and Effects of Metaphor). Tenured at Rutgers University (after University of Pennsylvania and Harvard Society of Fellows). Omar Mirza (Naturalism and Darwin’s Doubt: a Study of Plantinga’s Evolutionary Argument against Naturalism). Tenured at St. Cloud State University."
