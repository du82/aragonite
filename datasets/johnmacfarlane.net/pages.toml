["https://johnmacfarlane.net/BayHac2014"]
title = "Pandoc for Haskell Hackers"
full_description = "I grew up programming video games in BASIC on a TRS-80 and 6502 assembly on a KIM-1 that my grandfather bought (he must have been among the first microcomputer hobbyists). In college I worked summers as a programmer, writing scientific software in Pascal on VAX workstations with whopping 20 MB hard drives. I got out of programming when GUIs took over, but started to get interested again in 2004 after installing linux. I messed around with python and lisp and ruby, and wrote a website for my department. Then in 2005, an Australian philosopher/logician colleague of mine, Greg Restall, mentioned that his favorite programming language was Haskell. So I checked it out, and found that I liked it too. I started messing around with parsec, the parser combinator library. I asked myself, “what would be fun to try to parse?” I’d gotten interested in lightweight markup languages and was using reStructuredText for lecture notes and handouts. And I’d just seen this “markdown” thing that John Gruber introduced. So I said to myself, “Self, let’s try writing a markdown parser.” That seemed like a good challenge, because markdown is about as parser-unfriendly a language as you can get. An asterisk, for example, can be either an open or close tag for emphasis, or part of an open or close tag for strong emphasis, or just a literal asterisk—and which it is often depends on what comes after. At the time, the only markdown parsers around were just big regex transformations. Parsec worked well for this. Before long I had a working parser. It was considerably faster and more accurate than John Gruber’s perl script. And it was much easier to maintain and extend. Our goal is to learn how to use pandoc as a library, but let’s first have a quick demo of the command-line tool. Standalone documents are constructed from templates. To see the default template for a format, use -D: sample1.txt contains some nice structured metadata. This is YAML but with strings interpreted as markdown."
