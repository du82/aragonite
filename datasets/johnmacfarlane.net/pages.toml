title = "John MacFarlane - Courses"
description = "John MacFarlane"
full_description = "Courses Spring 2025 PHILOS 135: Theory of Meaning In this course, we will work through some fascinating and difficult philosophical questions concerning the nature of meaning and representation. By virtue of what do some things in the world (for example, words and thoughts) represent others? Is meaning always a matter of interpretation, or do some things have meaning independently of interpretation? Is conceptual thought prior to language? What would it take for a computer, a robot, a cat, or a Martian to have thoughts? Are the meanings of our words and the contents of our mental states determined by what’s going on inside our heads, or do they depend also on features of our physical and social environments? Could there be facts about meaning we could only discover by looking in someone’s brain? Are there objective facts about meaning at all? Can we define representation in scientific terms? In exploring these and related questions, we will read the work of Quine, Davidson, Grice, Putnam, Dennett, Searle, Burge, Chomsky, Block, Fodor, Dretske, Millikan, and others. You will come out of this course with a good understanding of some of the deep, central questions about language and thought that preoccupied philosophers in the late twentieth century (and, in my view, remain unresolved). Fall 2024 PHILOS 25A: Introduction to Ancient Philosophy This course is an introduction to ancient Greek philosophy–and, for the uninitiated, to philosophy itself. We will spend almost all of our time on the three most important Greek philosophers–Socrates, Plato, and Aristotle–with a passing glance at pre-Socratic and Hellenistic philosophers. Our primary goal will be to understand these philosophers’ characteristic methods and views, and (more importantly) their reasons for holding these views. It is often said that we should study ancient Greek philosophy because it is the intellectual basis for all later western philosophy and natural science. That is true, but it is only half the story. We should also study ancient Greek philosophy to become familiar with a worldview so alien that it throws our own into sharp relief. As you are outraged by some of the things these philosophers say, you will come to see more clearly what your own views are, and you will be forced to ask what justifies them. You will not just be studying the history of philosophy; you will be doing philosophy. Prerequisite: None. Spring 2024 PHILOS 290: Seminar: Belief We can describe an agent’s doxastic state by saying which propositions the agent believes. Alternatively, we can assign credences or confidence levels between 0 and 1 to each proposition. The first approach is “digital,” positing a binary, on/off relation of belief, while the second is “analog,” recognizing continuous variation in the strength of belief. What is the relation between these two ways of describing a doxastic state? Is one of them fundamental, and the other derivative? Are they competing or complementary descriptions? If they are complementary, what are their distinctive roles? If they are competing, which should we prefer, and what should we make of the other? In this seminar we will mostly be assuming that the analog description of cognitive states in terms of credences is useful, and asking whether any important theoretical role remains for the digital description in terms of beliefs. Many have thought not. Richard Jeffrey writes that he is “inclined to think that Ramsey sucked the marrow out of the ordinary notion, and used it to nourish a more adequate view,” and David Christensen argues that “believes” is like “large” or “warm”—a useful word in everyday life, but not one that plays a role in useful scientific or epistemological theories. We will see if we can resist these conclusions. Casting a broad net, we will consider a number of different approaches to making sense of belief: in terms of its role in psychological explanation, in terms of credence, as a cognitive heuristic, and in terms of its relations to cognitive norms, knowledge, assertion, reactive attitudes, reasons, guesses, and inquiry. Readings will be drawn from the recent literature on this topic. This course is aimed at graduate students in philosophy. Others who are interested in the seminar should request the permission of the instructor. Fall 2023 PHILOS 25A: Introduction to Ancient Philosophy This course is an introduction to ancient Greek philosophy–and, for the uninitiated, to philosophy itself. We will spend almost all of our time on the three most important Greek philosophers–Socrates, Plato, and Aristotle–with a passing glance at pre-Socratic and Hellenistic philosophers. Our primary goal will be to understand these philosophers’ characteristic methods and views, and (more importantly) their reasons for holding these views. It is often said that we should study ancient Greek philosophy because it is the intellectual basis for all later western philosophy and natural science. That is true, but it is only half the story. We should also study ancient Greek philosophy to become familiar with a worldview so alien that it throws our own into sharp relief. As you are outraged by some of the things these philosophers say, you will come to see more clearly what your own views are, and you will be forced to ask what justifies them. You will not just be studying the history of philosophy; you will be doing philosophy. Prerequisite: None. PHILOS 200: First-Year Graduate Seminar (with Shamik Dasgupta) Seminar for first-year graduate students in Philosophy. Spring 2023 PHILOS 290: Graduate Seminar: Sellars Wilfrid Sellars memorably said that the aim of philosophy is “to understand how things in the broadest possible sense of the term hang together in the broadest possible sense of the term.” We will try to understand his attempt to do that, reading a selection of his classic papers from the 1950s and 60s. Among other topics, we will discuss Sellars’ inferentialist account of meaning, his critique of traditional empiricism and its “Myth of the Given,” his expressivist accounts of the language of appearance and modality, his nominalist metaphysics, his scientific realism, and his Kantianism. We will try to understand his work in relation to earlier thinkers who influenced him, and we will see how different aspects of his thought influenced later thinkers with diverse philosophical views. Our overarching aim will be to think about what is still alive in Sellars’ thought, what might have been overlooked by the subsequent tradition, and what looks different in light of contemporary developments. PHILOS 142: Philosophical Logic We will think about the limitations of, presuppositions of, and alternatives to classical first-order predicate logic, focusing on the following questions: Are there quantificational idioms that cannot be expressed with the familiar universal and existential quantifiers? How can logic be extended to capture modal notions like necessity and obligation? Does the material conditional adequately capture the meaning of ‘if’—and if not, what are the alternatives? Should logical consequence be understood in terms of models or in terms of proofs? Can one intelligibly question the validity of basic logical principles like Modus Ponens or Double Negation Elimination? Is the fact that classical logic validates the inference from a contradiction to anything a flaw, and if so, how can logic be modified to repair it? How, exactly, is logic related to reasoning? Must classical logic be revised in order to be applied to vague language, and if so how? The course requires both problem sets and a philosophical paper. Prerequisite: Philosophy 12A. Spring 2022 PHILOS 161: Aristotle A concentrated study of Aristotle’s philosophy, including logic, theory of explanation, natural philosophy, psychology, metaphysics, and ethics. Students will learn how to read Aristotle’s dense prose and form their own judgments about controversial matters of interpretation. Prerequisite: Two previous courses in philosophy, including Philosophy 25A or the equivalent. Fall 2021 PHILOS 290: Graduate Seminar: Common Ground (with Seth Yalcin) The notion of common ground is one of the key organizing ideas in pragmatics. We will ask what motivates the idea, starting with its role in the analysis of presupposition and assertion. After we develop a grip on what role common ground is supposed to play in linguistic communication, we will ask what kind of state of mind realizes the role. Standard definitions of common ground invoke common knowledge or common belief. We’ll ask whether an analysis in that direction is correct, and focus special attention on the question whether common knowledge is even possible. As time permits, we will look at some debates in semantics and pragmatics which turn on issues about common ground, possibly including anaphora, epistemic vocabulary, and vagueness. The readings will drawn from work by Stalnaker, Lewis, Williamson, Lederman, Harris, MacFarlane, Camp, Yalcin, Hawthorne, Magidor, and Simons, among others. PHILOS 135: Theory of Meaning In this course, we will work through some fascinating and difficult philosophical questions concerning the nature of meaning and representation. By virtue of what do some things in the world (for example, words and thoughts) represent others? Is meaning always a matter of interpretation, or do some things have meaning independently of interpretation? Is conceptual thought prior to language? What would it take for a computer, a robot, a cat, or a Martian to have thoughts? Are the meanings of our words and the contents of our mental states determined by what’s going on inside our heads, or do they depend also on features of our physical and social environments? Could there be facts about meaning we could only discover by looking in someone’s brain? Are there objective facts about meaning at all? Can we define representation in scientific terms? In exploring these and related questions, we will read the work of Quine, Davidson, Grice, Putnam, Dennett, Searle, Burge, Chomsky, Block, Fodor, Dretske, Millikan, and others. You will come out of this course with a good understanding of some of the deep, central questions about language and thought that preoccupied philosophers in the late twentieth century (and, in my view, remain unresolved). Spring 2021 PHILOS 142: Philosophical Logic We will think about the limitations of, presuppositions of, and alternatives to classical first-order predicate logic, focusing on the following questions: Are there quantificational idioms that cannot be expressed with the familiar universal and existential quantifiers? How can logic be extended to capture modal notions like necessity and obligation? Does the material conditional adequately capture the meaning of ‘if’—and if not, what are the alternatives? Should logical consequence be understood in terms of models or in terms of proofs? Can one intelligibly question the validity of basic logical principles like Modus Ponens or Double Negation Elimination? Is the fact that classical logic validates the inference from a contradiction to anything a flaw, and if so, how can logic be modified to repair it? How, exactly, is logic related to reasoning? Must classical logic be revised in order to be applied to vague language, and if so how? The course requires both problem sets and a philosophical paper. Prerequisite: Philosophy 12A. PHILOS 290: Graduate Seminar: Belief, Credence, and Reasons We can describe an agent’s doxastic state by saying which propositions the agent believes. Alternatively, we can assign credences or confidence levels between 0 and 1 to each proposition. The first approach is “digital,” positing a binary, on/off relation of belief, while the second is “analog,” recognizing continuous variation in the strength of belief. What is the relation between these two ways of describing a doxastic state? Is one of the two modes of description accurate, and the other inaccurate? Or are they just different ways of describing the same underlying reality? Is one of the two modes of description fundamental, and the other derivative? Why do we have these two modes of description? Do they serve different purposes? The divide between digital and analog descriptions of doxastic states corresponds to a divide in theories of reasoning. Traditional accounts of reasoning give a central role to the notion of a reason. We decide what to believe, and what do do, by balancing up the reasons for and against and evaluating their weight. Much traditional epistemology is shaped by this conception of reasoning. But this notion does not play a role in Bayesian epistemology or in decision theory, which focuses more on a holistic notion of rationality. We will consider arguments that the constraints of rationality make sense only for credences, not for beliefs. We will also consider whether the notion of a reason makes sense only in the context of the full-belief ontology. Can we think of actions rationalized by states of partial belief as done for reasons? If not, is that a problem for the idea that reasons are central to reasoning? Do we care about reasons because we want to make better decisions, or for some other reason? We will read and discuss some of the recent literature bearing on these topics. Spring 2020 PHILOS 161: Aristotle A concentrated study of Aristotle’s theoretical philosophy: logic, theory of explanation, natural philosophy, psychology, and metaphysics. Students will learn how to read Aristotle’s dense prose and form their own judgments about controversial matters of interpretation. Prerequisite: Two previous courses in philosophy, including Philosophy 25A or the equivalent. PHILOS 290: Seminar: Vagueness We will consider some of the philosophical issues raised by vagueness. Much of the voluminous literature on vagueness focuses on its implications for logic and formal semantics. We will focus instead on issues in the philosophy of language and epistemology. (1) How do we communicate using vague language? In what does our shared grasp of the meanings of vague words consist? Does the fuzziness, fluidity, or context sensitivity of vague language pose a problem for standard accounts of communication? (2) What distinguishes vague thoughts from precise ones? How should we describe our attitudes of ambivalence towards borderline propositions? If it is a kind of partial belief, what kind? What sort of decision theory makes sense in the presence of vagueness? Fall 2019 PHILOS 25A: Introduction to Ancient Philosophy This course is an introduction to ancient Greek philosophy–and, for the uninitiated, to philosophy itself. We will spend almost all of our time on the three most important Greek philosophers–Socrates, Plato, and Aristotle–with a passing glance at pre-Socratic and Hellenistic philosophers. Our primary goal will be to understand these philosophers’ characteristic methods and views, and (more importantly) thei"
