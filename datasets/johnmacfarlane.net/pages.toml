["http://johnmacfarlane.net/papers.html"]
title = "John MacFarlane - Papers"
description = "John MacFarlane"
full_description = "Papers This page lists my published and forthcoming papers. For work in progress, see my Work in Progress page. For books, see Books. For citations to my publications, see my Google Scholar page. John MacFarlane, “Why Future Contingents Are Not All False”, Analytic Philosophy (2024). [preprint] [published version] This is my contribution to a book symposium on Patrick Todd’s book The Open Future: Why Future Contingents Are All False (Oxford: Oxford University Press, 2021). Todd argues for a modified Peircean view on which all future contingents are false. According to Todd, this is the only view that makes sense if we fully embrace an open future, rejecting the idea of actual future history. I argue that supervaluational accounts, on which future contingents are neither true nor false, are fully consistent with the metaphysics of an open future. I suggest that it is Todd’s failure to distinguish semantic and postsemantic levels that leads him to suppose otherwise. I also show how one can resist Todd’s argument (with Brian Rabern) that the conceptual possibility of omniscience requires us to reject Retro-closure (φ → Wasn Willn φ). John MacFarlane, “Belief: What is it Good for?”, Erkenntnis (2023). [preprint] [published version] “Absolutely nothing,” say the radical Bayesians. “Simplifying decisions,” say the moderates. “Providing premises in practical reasoning,” say the epistemologists. “Coordinating with others,” say I. It is hard to see how to construct an adequate theory of rational behavior without using a graded notion of belief, such as credence. But once we have credence, what role is left for belief? After surveying some answers to this question, I will explore the idea that belief is in a different line of work altogether. Its job is not to rationalize and explain an agent’s behavior, but to track what the agent would accept as a reason. Although some philosophers have seen the connection between belief and reasons, they have tended to see reasons as part of a theory of rational action. This locates belief in the rationalizing and explaining business, where it must vie with credence. In contrast, I argue that reasons play no essential role in an account of individual rationality; they are important because we need to coordinate with others. Credence and belief thus answer to separate needs. John MacFarlane, “Equal Validity and Disagreement: Comments on Baghramian and Coliva’s Relativism”, Analysis 82 (2022), 499–506. [preprint] [published version] Baghramian and Coliva (2020) have correctly identified the crux of the problem facing truth relativism: reconciling the idea that two parties to a dispute genuinely disagree, with the idea that their standpoints are (in some sense) equally valid and their judgments equally correct. I explain how my view aims to reconcile Disagreement with (something worth calling) Equal Validity, and I discuss Baghramian and Coliva’s charge that I have secured, at best, a weak simulacrum of either. John MacFarlane, “Lecture I: Vagueness and Communication”, Journal of Philosophy 117 (2020), 593–616. [preprint] [published version] I can say that a building is tall and you can understand me, even if neither of us has any clear idea exactly how tall a building must be in order to count as tall. This mundane fact poses a problem for the view that successful communication consists in the hearer’s recognition of the proposition a speaker intends to assert. The problem cannot be solved by the epistemicist’s usual appeal to anti-individualism, because the extensions of vague words like ‘tall’ are contextually fluid and can be constrained significantly by speakers’ intentions. The problem can be seen as a special case of a more general problem concerning what King has called “felicitous underspecification.” Traditional theories of vagueness offer nothing that can help with this problem. Appeals to diagonalization do not help either. A more radical solution is needed. John MacFarlane, “Lecture II: Seeing Through the Clouds”, Journal of Philosophy 117 (2020), 617–642. [preprint] [published version] One approach to the problem is to keep the orthodox notion of a proposition but innovate in the theory of speech acts. A number of philosophers and linguists have suggested that, in cases of felicitous underspecification, a speaker asserts a “cloud” of propositions rather than just one. This picture raises a number of questions: what norms constrain a “cloudy assertion,” what counts as uptake, and how is the conversational common ground revised if it is accepted? I explore three different ways of answering these questions, due to Braun and Sider, Buchanan, and von Fintel and Gillies. I argue that none of them provide a good general response to the problem posed by felicitous underspecification. However, the problems they face point the way to a more satisfactory account, which innovates in the theory of content rather than the theory of speech acts. John MacFarlane, “Lecture III: Indeterminacy as Indecision”, Journal of Philosophy 117 (2020), 643–667. [preprint] [published version] This lecture presents my own solution to the problem posed in Lecture I. Instead of a new theory of speech acts, it offers a new theory of the contents expressed by vague assertions, along the lines of the plan expressivism Allan Gibbard has advocated for normative language. On this view, the mental states we express in uttering vague sentences have a dual direction of fit: they jointly constrain the doxastic possibilities we recognize and our practical plans about how to draw boundaries. With this story in hand, I reconsider some of the traditional topics connected with vagueness: bivalence, the sorites paradox, higher-order vagueness, and the nature of vague thought. I conclude by arguing that the expressivist account can explain, as its rivals cannot, what makes vague language useful. John MacFarlane, “Review of Andrew Bacon, Vagueness and Thought”, Philosophical Review 129 (2020), 153–158. [preprint] [published version] John MacFarlane, “On Probabilistic Knowledge”, Res Philosophica 97 (2020), 97–108. [preprint] This is a lightly revised version of my comments from the Author Meets Critics symposium on Sarah Moss’s Probabilistic Knowledge at the Central Division APA, Denver, February 20, 2019. John MacFarlane, “В каком смысле, если он вообще есть, логика нормативна по отношению к мышлению? [In What Sense (If Any) Is Logic Normative for Thought?]”, in Современная логика: Основания, предмет и перспективы развития [Modern Logic: Its Subject Matter, Foundations and Prospects], ed. Д.В. Зайцева [D. Zaitsev] (Москва [Moscow]: ИД Форум [Forum], 2018). [published version] (This is a Russian translation of my 2004 Central APA Talk, translated by Vasilyi Shangin, with help from Ethan Nowak. ) Logic is often said to provide norms for thought or reasoning. Indeed, this idea is central to the way in which logic has traditionally been defined as a discipline, and without it, it is not clear how we would distinguish logic from the disciplines that crowd it on all sides: psychology, metaphysics, mathematics, and semantics. But it turns out to be surprisingly hard to say how facts about the validity of inferences relate to norms for reasoning, and some philosophers have concluded that the whole idea is confused. In this talk I will survey a space of possible “bridge principles” connecting logical facts with norms for reasoning. After discussing some considerations relevant to choosing between these bridge principles, I will defend two of them. I will then consider the implications of various choices of bridge principle for the long-standing debates about the roles of relevance, necessity, and formality in our notion of logical consequence. The methodological aim of the talk is to provide an alternative to the usual brute appeals to our “intuitions” about logical consequence in these fundamental debates. John MacFarlane, “Vagueness as Indecision”, Aristotelian Society Supplementary Volume 90 (2016), 255-283. [preprint] [published version] This paper motivates and explores an expressivist theory of vagueness, modeled on Allan Gibbard’s (2003) normative expressivism. It shows how Chris Kennedy’s (2007) semantics for gradable adjectives can be adjusted to fit into a theory on Gibbardian lines, where assertions constrain not just possible worlds but plans for action. Vagueness, on this account, is literally indecision about where to draw lines. It is argued that the distinctive phenomena of vagueness, such as the intuition of tolerance, can be explained in terms of practical constraints on plans, and that the expressivist view captures what is right about several contending theories of vagueness. John MacFarlane, “Précis, Assessment Sensitivity: Relative Truth and Its Applications”, Philosophy and Phenomenological Research 92 (2016), 168–170. [preprint] [published version] A short summary of Assessment Sensitivity: Relative Truth and Its Applications. John MacFarlane, “Replies to Raffman, Stanley, and Wright”, Philosophy and Phenomenological Research 92 (2016), 197–202. [preprint] [published version] Replies to commentaries on Assessment Sensitivity: Relative Truth and Its Applications by Diana Raffman, Jason Stanley, and Crispin Wright. John MacFarlane, “Abelard’s Argument for Formality”, in Formal Approaches and Natural Language in Medieval Logic, ed. Laurent Cesalli and Alain de Libera and Frédéric Goubier (Barcelona, Roma: Brepols, 2015), 41–57. [preprint] [published version] Fourteenth-century logicians define formal consequences as consequences that remain valid under uniform substitutions of categorematic terms, but they say little about the significance of this distinction. Why does it matter whether a consequence is formal or material? One possible answer is that, whereas the validity of a material consequence depends on both its structure and “the nature of things,” the validity of a formal consequence depends on its structure alone. But this claim does not follow from the definition of formal consequence by itself, and the fourteenth-century logicians do not give an argument for it. For that we must turn to Abelard, who argues explicitly that valid syllogisms take their validity from their construction alone, and not from “the nature of things.” I look at Abelard’s argument in its historical context. If my reconstruction is correct, the argument, and hence also the significance of the distinction between formal and material consequence, depends on a conception of “the nature of things” that we can no longer accept. This should give pause to contemporary thinkers who look to medieval notions of formal consequence as antecedents of their own. John MacFarlane, “Review of Huw Price, Expressivism, Pragmatism, and Representationalism”, Notre Dame Philosophical Reviews 2014.02.09 (2014). [published version] John MacFarlane, “Relativism”, in The Routledge Companion to the Philosophy of Language, ed. Delia Graff Fara and Gillian Russell (New York: Routledge, 2012), 132-142. [preprint] A brief introduction to relativism in semantics, touching on motivations, technical issues, and philosophical issues. John MacFarlane, “Richard on Truth and Commitment”, Philosophical Studies 106 (2012), 445-453. [preprint] [published version] My contribution to a book symposium on Mark Richard’s book When Truth Gives Out. John MacFarlane, “Simplicity Made Difficult”, Philosophical Studies 156 (2011), 441–448. [published version] My contribution to a book symposium on Herman Cappelen and John Hawthorne’s book Relativism and Monadic Truth. John MacFarlane, “What Is Assertion?”, in Assertion, ed. Jessica Brown and Herman Cappelen (Oxford: Oxford University Press, 2011), 79-96. [preprint] What is it to make an assertion? The literature contains four broad categories of answers: (1) To assert is to express an attitude. (2) To assert is to make a move defined by its constitutive rules. (3) To assert is to propose to add information to the conversational common ground. (4) To assert is to undertake a certain sort of commitment. I articulate these views and discuss the motivations and advantages of each. My aim here is exploratory, not polemical: I want to see, among other things, how each view might account for the phenomena that motivate its competitors. John MacFarlane, “Relativism and Knowledge Attributions”, in Routledge Companion to Epistemology, ed. Sven Bernecker and Duncan Pritchard (London: Routledge, 2011), 536-544. [preprint] A handbook-style explanation of “relativist” semantics for knowledge attributions and its motivation. John MacFarlane, “Epistemic Modals Are Assessment-Sensitive”, in Epistemic Modality, ed. Brian Weatherson and Andy Egan (Oxford: Oxford University Press, 2011), 144-178. [preprint] This is my latest effort to tell the story sketched in my 2003 manuscript “Epistemic Modalities and Relative Truth.” Niko Kolodny and John MacFarlane, “Ifs and Oughts”, Journal of Philosophy 107 (2010), 115-143. [preprint] [published version] We consider a paradox involving indicative conditionals (“ifs”) and deontic modals (“oughts”). After considering and rejecting several standard options for resolving the paradox—including rejecting various premises, positing an ambiguity or hidden contextual sensitivity, and positing a non-obvious logical form—we offer a semantics for deontic modals and indicative conditionals that resolves the paradox by making modus ponens invalid. We argue that this is a result to be welcomed on independent grounds, and we show that rejecting the general validity of modus ponens is compatible with vindicating most ordinary uses of modus ponens in reasoning. John MacFarlane, “Pragmatism and Inferentialism”, in Reading Brandom: On Making It Explicit, ed. Bernhard Weiss and Jeremy Wanderer (London: Routledge, 2010), 81-95. [preprint] I discuss the connections between Brandom’s pragmatism and his inferentialism. I argue that pragmatism, as Brandom initially describes it – the view that “semantics must answer to pragmatics” – does not favor an inferentialist approach to semantics over a truth-conditional one. I then consider whether inferentialism might be motivated by a stronger kind of pragmatism, one that requires semantic concepts to be definable in terms of independently intelligible pragmatic concepts. Although this more stringent requirement does exclude truth-conditional approaches to semantics, it is not clear that Brandom’s own approach meets it. John MacFarlane, “Fuzzy Epistemicism”, in Cuts and Clouds: Vagueness, Its Nature, and Its Logic, ed. Richard Dietz and Sebastiano Moruzzi (Oxford: Oxford University Press, 2010), 438-463. [preprint] It is taken for granted in much of the literature on vagueness that semantic and epistemic approaches to vagueness are fundamentally at odds. If we can analyze borderline cases and the sorites paradox in terms of degrees of truth, then we don’t need an epistemic explanation. Conv"
