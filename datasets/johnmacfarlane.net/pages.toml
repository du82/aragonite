title = "Pandoc - Pandoc User’s Guide"
full_description = 'Pandoc User’s Guide Synopsis pandoc [options] [input-file]… Description Pandoc is a Haskell library for converting from one markup format to another, and a command-line tool that uses this library. Pandoc can convert between numerous markup and word processing formats, including, but not limited to, various flavors of Markdown, HTML, LaTeX and Word docx. For the full lists of input and output formats, see the --from and --to options below. Pandoc can also produce PDF output: see creating a PDF, below. Pandoc’s enhanced version of Markdown includes syntax for tables, definition lists, metadata blocks, footnotes, citations, math, and much more. See below under Pandoc’s Markdown. Pandoc has a modular design: it consists of a set of readers, which parse text in a given format and produce a native representation of the document (an abstract syntax tree or AST), and a set of writers, which convert this native representation into a target format. Thus, adding an input or output format requires only adding a reader or writer. Users can also run custom pandoc filters to modify the intermediate AST. Because pandoc’s intermediate representation of a document is less expressive than many of the formats it converts between, one should not expect perfect conversions between every format and every other. Pandoc attempts to preserve the structural elements of a document, but not formatting details such as margin size. And some document elements, such as complex tables, may not fit into pandoc’s simple document model. While conversions from pandoc’s Markdown to all formats aspire to be perfect, conversions from formats more expressive than pandoc’s Markdown can be expected to be lossy. Using pandoc If no input-files are specified, input is read from stdin. Output goes to stdout by default. For output to a file, use the -o option: pandoc -o output.html input.txt By default, pandoc produces a document fragment. To produce a standalone document (e.g. a valid HTML file including <head> and <body>), use the -s or --standalone flag: pandoc -s -o output.html input.txt For more information on how standalone documents are produced, see Templates below. If multiple input files are given, pandoc will concatenate them all (with blank lines between them) before parsing. (Use --file-scope to parse files individually.) Specifying formats The format of the input and output can be specified explicitly using command-line options. The input format can be specified using the -f/--from option, the output format using the -t/--to option. Thus, to convert hello.txt from Markdown to LaTeX, you could type: pandoc -f markdown -t latex hello.txt To convert hello.html from HTML to Markdown: pandoc -f html -t markdown hello.html Supported input and output formats are listed below under Options (see -f for input formats and -t for output formats). You can also use pandoc --list-input-formats and pandoc --list-output-formats to print lists of supported formats. If the input or output format is not specified explicitly, pandoc will attempt to guess it from the extensions of the filenames. Thus, for example, pandoc -o hello.tex hello.txt will convert hello.txt from Markdown to LaTeX. If no output file is specified (so that output goes to stdout), or if the output file’s extension is unknown, the output format will default to HTML. If no input file is specified (so that input comes from stdin), or if the input files’ extensions are unknown, the input format will be assumed to be Markdown. Character encoding Pandoc uses the UTF-8 character encoding for both input and output. If your local character encoding is not UTF-8, you should pipe input and output through iconv: iconv -t utf-8 input.txt | pandoc | iconv -f utf-8 Note that in some output formats (such as HTML, LaTeX, ConTeXt, RTF, OPML, DocBook, and Texinfo), information about the character encoding is included in the document header, which will only be included if you use the -s/--standalone option. Creating a PDF To produce a PDF, specify an output file with a .pdf extension: pandoc test.txt -o test.pdf By default, pandoc will use LaTeX to create the PDF, which requires that a LaTeX engine be installed (see --pdf-engine below). Alternatively, pandoc can use ConTeXt, roff ms, or HTML as an intermediate format. To do this, specify an output file with a .pdf extension, as before, but add the --pdf-engine option or -t context, -t html, or -t ms to the command line. The tool used to generate the PDF from the intermediate format may be specified using --pdf-engine. You can control the PDF style using variables, depending on the intermediate format used: see variables for LaTeX, variables for ConTeXt, variables for wkhtmltopdf, variables for ms. When HTML is used as an intermediate format, the output can be styled using --css. To debug the PDF creation, it can be useful to look at the intermediate representation: instead of -o test.pdf, use for example -s -o test.tex to output the generated LaTeX. You can then test it with pdflatex test.tex. When using LaTeX, the following packages need to be available (they are included with all recent versions of TeX Live): amsfonts, amsmath, lm, unicode-math, iftex, listings (if the --listings option is used), fancyvrb, longtable, booktabs, [multirow] (if the document contains a table with cells that cross multiple rows), graphicx (if the document contains images), bookmark, xcolor, soul, geometry (with the geometry variable set), setspace (with linestretch), and babel (with lang). If CJKmainfont is set, xeCJK is needed if xelatex is used, else luatexja is needed if lualatex is used. framed is required if code is highlighted in a scheme that use a colored background. The use of xelatex or lualatex as the PDF engine requires fontspec. lualatex uses selnolig and lua-ul. xelatex uses bidi (with the dir variable set). If the mathspec variable is set, xelatex will use mathspec instead of unicode-math. The upquote and microtype packages are used if available, and csquotes will be used for typography if the csquotes variable or metadata field is set to a true value. The natbib, biblatex, bibtex, and biber packages can optionally be used for citation rendering. The following packages will be used to improve output quality if present, but pandoc does not require them to be present: upquote (for straight quotes in verbatim environments), microtype (for better spacing adjustments), parskip (for better inter-paragraph spaces), xurl (for better line breaks in URLs), and footnotehyper or footnote (to allow footnotes in tables). Reading from the Web Instead of an input file, an absolute URI may be given. In this case pandoc will fetch the content using HTTP: pandoc -f html -t markdown https://www.fsf.org It is possible to supply a custom User-Agent string or other header when requesting a document from a URL: pandoc -f html -t markdown --request-header User-Agent:"Mozilla/5.0" \ https://www.fsf.org Options General options -f FORMAT, -r FORMAT, --from=FORMAT, --read=FORMAT Specify input format. FORMAT can be: bibtex (BibTeX bibliography) biblatex (BibLaTeX bibliography) bits (BITS XML, alias for jats) commonmark (CommonMark Markdown) commonmark_x (CommonMark Markdown with extensions) creole (Creole 1.0) csljson (CSL JSON bibliography) csv (CSV table) tsv (TSV table) djot (Djot markup) docbook (DocBook) docx (Word docx) dokuwiki (DokuWiki markup) endnotexml (EndNote XML bibliography) epub (EPUB) fb2 (FictionBook2 e-book) gfm (GitHub-Flavored Markdown), or the deprecated and less accurate markdown_github; use markdown_github only if you need extensions not supported in gfm. haddock (Haddock markup) html (HTML) ipynb (Jupyter notebook) jats (JATS XML) jira (Jira/Confluence wiki markup) json (JSON version of native AST) latex (LaTeX) markdown (Pandoc’s Markdown) markdown_mmd (MultiMarkdown) markdown_phpextra (PHP Markdown Extra) markdown_strict (original unextended Markdown) mediawiki (MediaWiki markup) man (roff man) mdoc (mdoc manual page markup) muse (Muse) native (native Haskell) odt (OpenDocument text document) opml (OPML) org (Emacs Org mode) pod (Perl’s Plain Old Documentation) ris (RIS bibliography) rtf (Rich Text Format) rst (reStructuredText) t2t (txt2tags) textile (Textile) tikiwiki (TikiWiki markup) twiki (TWiki markup) typst (typst) vimwiki (Vimwiki) the path of a custom Lua reader, see Custom readers and writers below Extensions can be individually enabled or disabled by appending +EXTENSION or -EXTENSION to the format name. See Extensions below, for a list of extensions and their names. See --list-input-formats and --list-extensions, below. -t FORMAT, -w FORMAT, --to=FORMAT, --write=FORMAT Specify output format. FORMAT can be: ansi (text with ANSI escape codes, for terminal viewing) asciidoc (modern AsciiDoc as interpreted by AsciiDoctor) asciidoc_legacy (AsciiDoc as interpreted by asciidoc-py). asciidoctor (deprecated synonym for asciidoc) beamer (LaTeX beamer slide show) bibtex (BibTeX bibliography) biblatex (BibLaTeX bibliography) chunkedhtml (zip archive of multiple linked HTML files) commonmark (CommonMark Markdown) commonmark_x (CommonMark Markdown with extensions) context (ConTeXt) csljson (CSL JSON bibliography) djot (Djot markup) docbook or docbook4 (DocBook 4) docbook5 (DocBook 5) docx (Word docx) dokuwiki (DokuWiki markup) epub or epub3 (EPUB v3 book) epub2 (EPUB v2) fb2 (FictionBook2 e-book) gfm (GitHub-Flavored Markdown), or the deprecated and less accurate markdown_github; use markdown_github only if you need extensions not supported in gfm. haddock (Haddock markup) html or html5 (HTML, i.e. HTML5/XHTML polyglot markup) html4 (XHTML 1.0 Transitional) icml (InDesign ICML) ipynb (Jupyter notebook) jats_archiving (JATS XML, Archiving and Interchange Tag Set) jats_articleauthoring (JATS XML, Article Authoring Tag Set) jats_publishing (JATS XML, Journal Publishing Tag Set) jats (alias for jats_archiving) jira (Jira/Confluence wiki markup) json (JSON version of native AST) latex (LaTeX) man (roff man) markdown (Pandoc’s Markdown) markdown_mmd (MultiMarkdown) markdown_phpextra (PHP Markdown Extra) markdown_strict (original unextended Markdown) markua (Markua) mediawiki (MediaWiki markup) ms (roff ms) muse (Muse) native (native Haskell) odt (OpenDocument text document) opml (OPML) opendocument (OpenDocument XML) org (Emacs Org mode) pdf (PDF) plain (plain text) pptx (PowerPoint slide show) rst (reStructuredText) rtf (Rich Text Format) texinfo (GNU Texinfo) textile (Textile) slideous (Slideous HTML and JavaScript slide show) slidy (Slidy HTML and JavaScript slide show) dzslides (DZSlides HTML5 + JavaScript slide show) revealjs (reveal.js HTML5 + JavaScript slide show) s5 (S5 HTML and JavaScript slide show) tei (TEI Simple) typst (typst) xwiki (XWiki markup) zimwiki (ZimWiki markup) the path of a custom Lua writer, see Custom readers and writers below Note that odt, docx, epub, and pdf output will not be directed to stdout unless forced with -o -. Extensions can be individually enabled or disabled by appending +EXTENSION or -EXTENSION to the format name. See Extensions below, for a list of extensions and their names. See --list-output-formats and --list-extensions, below. -o FILE, --output=FILE Write output to FILE instead of stdout. If FILE is -, output will go to stdout, even if a non-textual format (docx, odt, epub2, epub3) is specified. If the output format is chunkedhtml and FILE has no extension, then instead of producing a .zip file pandoc will create a directory FILE and unpack the zip archive there (unless FILE already exists, in which case an error will be raised). --data-dir=DIRECTORY Specify the user data directory to search for pandoc data files. If this option is not specified, the default user data directory will be used. On *nix and macOS systems this will be the pandoc subdirectory of the XDG data directory (by default, $HOME/.local/share, overridable by setting the XDG_DATA_HOME environment variable). If that directory does not exist and $HOME/.pandoc exists, it will be used (for backwards compatibility). On Windows the default user data directory is %APPDATA%\pandoc. You can find the default user data directory on your system by looking at the output of pandoc --version. Data files placed in this directory (for example, reference.odt, reference.docx, epub.css, templates) will override pandoc’s normal defaults. (Note that the user data directory is not created by pandoc, so you will need to create it yourself if you want to make use of it.) -d FILE, --defaults=FILE Specify a set of default option settings. FILE is a YAML file whose fields correspond to command-line option settings. All options for document conversion, including input and output files, can be set using a defaults file. The file will be searched for first in the working directory, and then in the defaults subdirectory of the user data directory (see --data-dir). The .yaml extension may be omitted. See the section Defaults files for more information on the file format. Settings from the defaults file may be overridden or extended by subsequent options on the command line. --bash-completion Generate a bash completion script. To enable bash completion with pandoc, add this to your .bashrc: eval "$(pandoc --bash-completion)" --verbose Give verbose debugging output. --quiet Suppress warning messages. --fail-if-warnings[=true|false] Exit with error status if there are any warnings. --log=FILE Write log messages in machine-readable JSON format to FILE. All messages above DEBUG level will be written, regardless of verbosity settings (--verbose, --quiet). --list-input-formats List supported input formats, one per line. --list-output-formats List supported output formats, one per line. --list-extensions[=FORMAT] List supported extensions for FORMAT, one per line, preceded by a + or - indicating whether it is enabled by default in FORMAT. If FORMAT is not specified, defaults for pandoc’s Markdown are given. --list-highlight-languages List supported languages for syntax highlighting, one per line. --list-highlight-styles List supported styles for syntax highlighting, one per line. See --highlight-style. -v, --version Print version. -h, --help Show usage message. Reader options --shift-heading-level-by=NUMBER Shift heading levels by a positive or negative integer. For example, with --shift-heading-level-by=-1, level 2 headings become level 1 headings, and level 3 headings become level 2 headings. Headings cannot have a level less than 1, so a heading that would be shifted below level 1 becomes a regular paragraph. Exception: with a shift of -N, a level-N heading at the beginning of the document replaces the metadata title. --shift-heading-level-by=-1 is a good choice when converting HTML or Markdown documents that use an initial level-1 heading for the document title and level-2+ headings for sections. --shift-heading-level-by=1 may be a good choice for converting Markdown documents that use level-1 heading'
