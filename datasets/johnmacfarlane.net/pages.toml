full_description = "Alonzo Church’s JSL Reviews Alonzo Church (of Church’s Thesis and Church’s Theorem) was editor of the Reviews section of the Journal of Symbolic Logic from its founding in 1936 until 1979. During this period, he wrote or commissioned short reviews of virtually every article or book in the field of logic. Church’s reviews are valuable both for the keen insights they contain and for the record they provide of mid-twentieth century logic and philosophy of logic. This list of Church’s JSL reviews has been compiled with the help of the JSTOR database. The titles below are linked to page images of the reviews in JSTOR. Definition of Post’s Generalized Negative and Maximum in Terms of One Binary Operation. Donald L. Webb, Journal of Symbolic Logic, Vol. 1, No. 1. (Mar., 1936), p. 42. The Law of Transitivity. H. B. Smith, Journal of Symbolic Logic, Vol. 1, No. 1. (Mar., 1936), p. 43. Reducible Boolean Functions. J. C. C. McKinsey, Journal of Symbolic Logic, Vol. 1, No. 2. (Jun., 1936), p. 69. Extensions of Partially Ordered Sets. H. M. MacNeille, Journal of Symbolic Logic, Vol. 1, No. 2. (Jun., 1936), p. 73. A Note on Contradiction. Everett J. Nelson, Journal of Symbolic Logic, Vol. 1, No. 3. (Sep., 1936), p. 117. On Euler’s ϕ-Function and its Extensions. S. Pankajam, Journal of Symbolic Logic, Vol. 1, No. 3. (Sep., 1936), p. 118. Logistic and Philosophy. Jan Lukasiewicz, Journal of Symbolic Logic, Vol. 1, No. 3. (Sep., 1936), p. 118. Demonstration d’un theoreme concernant le principe du tiers exclu E. W. Beth, Journal of Symbolic Logic, Vol. 1, No. 3. (Sep., 1936), p. 118. Note sur la demonstration de M. E. W. Beth Marcel Barzin, Journal of Symbolic Logic, Vol. 1, No. 3. (Sep., 1936), p. 118. The theory of Representations for Boolean Algebras. M. H. Stone, Journal of Symbolic Logic, Vol. 1, No. 3. (Sep., 1936), pp. 118-119. Die Widerspruchsfreiheit der Stufenlogik. Gerhard Gentzen, Journal of Symbolic Logic, Vol. 1, No. 3. (Sep., 1936), p. 119. A note o