title = "Careers | Slack"
description = "Join the growing team at Slack! We're looking for a diverse group of creative and curious people who believe in achieving great things--within normal business hours."
full_description = "Careers At SlackWork with usExplore remote-friendly, flexible opportunities and join our mission to make work life simpler, more pleasant and more productive.View CareersLooking for internships?Slack is where the future worksEvery day, we refine, iterate and explore how to make work better for everyone. Join us in creating a better future of work that’s more connected, inclusive and flexible: ConnectedWe come together wherever we are—across time zones, regions, offices and screens.InclusiveOur teams reflect the rich diversity of our world, with equitable access to opportunity for everyone.FlexibleWe believe in your freedom to work when and how you work best, to help us all thrive.Our core valuesThese are some of the values we live by as a company. We work by them too. We’re building a platform and products we believe in, knowing that there is real value to be gained from helping people simplify whatever it is that they do and bring more of themselves to their work, wherever they are. Empathy Courtesy Thriving Craftsmanship Playfulness SolidarityWorking and thrivingAs part of the global Salesforce family, we’re proud to offer benefits that help you feel and do your best. Access a range of benefits, resources and expert guidance to help you prioritize your well-being, so you can thrive with a healthy body and mind.Time off to rest, recharge and volunteerExceptional health-care coverageHolistic programs for well-being, family planning and moreLearn more about benefitsCreating an inclusive environmentWe’re dedicated to hiring diverse talent and ensuring that we treat you with respect and support throughout the interview process and once you join Slack. We embrace diversity and strive to create conditions that provide everyone with an equal opportunity to thrive. We offer several programs and initiatives to foster these values.Diversity, Engagement and Belonging The Diversity, Engagement and Belonging (DEB) program unlocks the potential of all employees by investing in an inclusive community centered on education, introspection, opportunity and growth. Rising Tides Rising Tides is a six-month sponsorship program for a talented and diverse group of high performers and emerging leaders at Slack who have historically lacked access to this support. Program participants receive career development training, executive coaching and one-on-one sponsorship with a Slack executive team member, with a focus on building a supportive community of peers. Employee Resource Groups Employee Resource Groups (ERGs) support, promote and celebrate groups of employees who have come together around shared characteristics or life experiences. PartnershipsPartnership initiatives, like our collaboration with The Next Chapter, an apprenticeship program for formerly incarcerated individuals, underscore Slack’s commitment to DEB. Together with The Last Mile, The Next Chapter trains and hires returning citizens for Slack’s engineering teams.Career opportunitiesExplore our open roles for working totally remote, from the office or someplace in between.Applications in English, please!Filter job listingsAll locationsCalifornia - Palo AltoCalifornia - San FranciscoColorado - DenverGeorgia - AtlantaIllinois - ChicagoIndiana - IndianapolisNew York - New YorkOregon - RemoteTexas - AustinTexas - DallasWashington - BellevueWashington - SeattleAll departmentsMarketing & CommunicationsSoftware EngineeringAll job typesRegularIntern11open positionsClearApplyFilter Job ListingsFilter byAll locationsAll locationsCalifornia - Palo AltoCalifornia - San FranciscoColorado - DenverGeorgia - AtlantaIllinois - ChicagoIndiana - IndianapolisNew York - New YorkOregon - RemoteTexas - AustinTexas - DallasWashington - BellevueWashington - SeattleAll departmentsAll departmentsMarketing & CommunicationsSoftware EngineeringAll job typesAll job typesRegularIntern11open positionsMarketing & CommunicationsDirector, SEO4 locationsApplyDirector, SEO4 locationsApplyEmail Operation