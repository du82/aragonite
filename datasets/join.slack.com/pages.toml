full_description = '''Using SlackFrom channels to search, learn how Slack works from top to bottom.Getting StartedIntro to Slack Get started: admins Get started: usersRoles & permissionsUsing SlackChannelsDirect messagesFormat & style messagesMessage features & toolsAudio & videoShare files & conversationsSearch in SlackKeyboard shortcuts & accessibilityYour ProfileManage your accountAdjust your notificationsChange your settings & preferencesGet troubleshooting tipsConnect ToolsConnect tools from the Slack App DirectoryAutomate tasks with Workflow BuilderExplore apps in the Slack App DirectoryCreate custom appsAdministrationManage membersManage channelsManage billing, payments & plansWorkspace settings & permissionsWorkspace customizationEnterprise Grid settings & permissionsManage apps & workflowsConfigure access & securitySlack data & analyticsTutorials & videosTutorials Videos Discover moreNextPreviousActions,activity,access logs,accessibility,add,add an app,Add members,Add to Slack,administrators,all passwords,analytics,android,announcement,announcements,App Directory,app icon,Apple Watch,approving apps,archive,Asana,Atlassian,Automation apps,badge,billing details,billing,Bitbucket,bot user,box,browse,calls,Calls:,cancel,changes,channels,channel instantly,channel management,channel notification,channel suggestions,claim domains,close,company culture,compliance exports,compose,computers,conversations,convert,connect,connected accounts,connection,connecting,copy messages,create,customization,customize,custom SAML,custom,customer support teams,data exports,data security,deactivate,default channels,delete,deletion,deploy slack,desktop,direct messages,directory,disable,discover and join,Discovery APIs,display name,DMs,Do Not Disturb,domain,domains,downgrade,dropbox,duplicate accounts,edit,editing,education,email address,email,emoji,emoticons,Enterprise Grid,Enterprise Mobility Management,executives,export,failed payments,Fair Billing,faqs,finding,format,formatting,framework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterUsing SlackDirect messagesUse Slack Connect to start a DM with someone at another companyUse Slack Connect to start a DM with someone at another companyYou can use Slack Connect to start a direct message (DM) with someone at another company. To start a DM conversation, an invitation must be sent and accepted. Keep in mind that you or the person you invite can end a conversation at any time. Note: Owners and admins can restrict Slack Connect permissions. If you’re unable to send or accept an invitation, find an owner or admin and ask for help. Send an invitation Desktop Mobile Hover over More. Click External connections. Click Start a DM in the top right. Enter the email address for the person you’d like to invite. Click Send Invitation. From the Home tab, tap the compose button at the bottom of your screen. Select Message with external people from the menu. Tap Share to send an invitation. Tip: If you’re already working in channels with people outside your company, you can DM them without sending an invitation. Revoke a sent invitation Desktop iOS Android Hover over More. Click External connections. Click View invitations. Hover over an invitation and click the revoke icon. Select Revoke to confirm. Tap your profile picture at the top of your screen. Tap Invitations to connect. Tap the Sent tab. Locate the invitation, then tap Revoke. Tap your profile picture at the top of the screen. Tap Invitations to connect. Tap the Sent tab. Locate the invitation, then tap Revoke. Accept an invitation Desktop iOS Android Hover over More. Click External connections. Click Accept next to the invitation. Review the invitation details to make sure you recognize the sender’s email address and other info. When you’re ready, click Accept Invitation. Tap your profile picture at the top of your screen. Tap Invitations to connect. Review the invitation details. If the sender included a message, tap View message to read it. When you’re ready, tap Accept. Choose the Slack account you’d like to use for this DM. If you don't see your preferred account, tap Sign in to another account. Tap Start Conversation. Tap your profile picture at the top of your screen. Tap Invitations to connect. Review the invitation details. If the sender included a message, tap View message to read it. When you’re ready, tap Accept. Choose the Slack account you’d like to use for this DM. If you don't see your preferred account, tap Sign in to another account. Tap Start Conversation. Block an invitation If you receive a DM invitation you don't want to accept, you can ignore it. But if there's someone you don't want to hear from, you can block them from sending you future Slack Connect invitations from any Slack account associated with their email address. Desktop Mobile Hover over More. Click External connections. Next to the invitation, click Ignore. Click Block invitations from this person, then click Block Invitations to confirm. Open the invitation in your email inbox. Below the invitation details, tap Block all invitations. Tap Block All Invitations. Note: Owners and admins can restrict Slack Connect invitations your organization receives. Reach out to an owner or admin for additional help. View blocked invitations You can view the people you've blocked from sending you Slack Connect invitations. To unblock any invitations listed, contact us. Click your profile picture in the sidebar. Select Preferences. Select Privacy & visibility. Below Invitations you’ve blocked, view a list of email addresses for people you've stopped from sending you Slack Connect invitations. Note: It’s against Slack’s Acceptable Use Policy to send unsolicited communications, promotions, advertisements, or spam. Who can use this feature? By default, all members (but not guests) Available on all plans Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.render('slack_captcha', { 'sitekey' : "6LcQQiYUAAAAADxJHrihACqD5wf3lksm9jbnRY5k" }); };Submit article feedbackIf you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Oops! We're having trouble. Please try again later!IN THIS ARTICLE'''
