full_description = '''ExtrasSupplemental Slack info for you and your team.Getting StartedIntro to Slack Get started: admins Get started: usersRoles & permissionsUsing SlackChannelsDirect messagesFormat & style messagesMessage features & toolsAudio & videoShare files & conversationsSearch in SlackKeyboard shortcuts & accessibilityYour ProfileManage your accountAdjust your notificationsChange your settings & preferencesGet troubleshooting tipsConnect ToolsConnect tools from the Slack App DirectoryAutomate tasks with Workflow BuilderExplore apps in the Slack App DirectoryCreate custom appsAdministrationManage membersManage channelsManage billing, payments & plansWorkspace settings & permissionsWorkspace customizationEnterprise Grid settings & permissionsManage apps & workflowsConfigure access & securitySlack data & analyticsTutorials & videosTutorials Videos Discover moreNextPreviousActions,activity,access logs,accessibility,add,add an app,Add members,Add to Slack,administrators,all passwords,analytics,android,announcement,announcements,App Directory,app icon,Apple Watch,approving apps,archive,Asana,Atlassian,Automation apps,badge,billing details,billing,Bitbucket,bot user,box,browse,calls,Calls:,cancel,changes,channels,channel instantly,channel management,channel notification,channel suggestions,claim domains,close,company culture,compliance exports,compose,computers,conversations,convert,connect,connected accounts,connection,connecting,copy messages,create,customization,customize,custom SAML,custom,customer support teams,data exports,data security,deactivate,default channels,delete,deletion,deploy slack,desktop,direct messages,directory,disable,discover and join,Discovery APIs,display name,DMs,Do Not Disturb,domain,domains,downgrade,dropbox,duplicate accounts,edit,editing,education,email address,email,emoji,emoticons,Enterprise Grid,Enterprise Mobility Management,executives,export,failed payments,Fair Billing,faqs,finding,format,formatting,framework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterExtrasAdditional InfoGuide to Slack AIGuide to Slack AIWe take our commitment to protecting customer data seriously. Learn how we built Slack to be secure and private. Slack AI is a set of generative AI tools built right into Slack that allow you to search smarter, summarize conversations instantly, and more — so you and your team can be at your most productive. Slack AI uses the conversation data already in Slack to create an intuitive and secure AI experience tailored to you and your organization. Interested in Slack AI? Purchase Slack AI or contact our Sales team for more information. Summarize conversations Save time by getting up to speed more quickly across channels, threads, and direct messages (DMs). Whether you’re joining a new channel, returning from time off, or catching up on a fast-moving discussion, Slack AI can summarize conversations in seconds. Summarize channels and DMs In channels and DMs, you can summarize just your unread messages, the last seven days, or a custom date range (desktop only). Desktop Mobile Open the channel or DM you'd like to summarize. Click the Summarize icon. Choose an option to generate your summary. Your summary will appear when it’s finished. If you'd like, click the More details icon to review the summary's sources. Open the channel or DM you'd like to summarize. Tap the Summarize icon. Choose an option to generate your summary. When your summary is ready, you’ll see a badge on the Summarize icon. Tap it to view your summary. Tip: You can use Slack AI to take huddle notes by pressing the AI notes icon in any huddle. Summarize threads Summaries for threads will always be for the entire thread. Desktop Mobile Open the thread you'd like to summarize. Click the Summarize icon. Your summary will appear when it’s finished. If you like, click the More details icon to review the summary's sources. Open the thread you'd like to summarize. Tap the Summarize icon. When your summary is ready, you’ll see a badge on the Summarize icon. Tap it to view your summary. Note: Summaries can take longer to generate for larger time frames or message histories. We’ll notify you when your summary is ready, so feel free to take a break or move on to other work in the meantime. Summarize files When you share certain text-based file types (.pdf, .docx, .pptx, and .xlsx) in channels or DMs, Slack AI will automatically summarize the file so people can catch up quickly. AI summaries are only available for files that are accessible to everyone A summary will appear below the file with a Summarize icon. To view a more detailed summary, hover over the file and click View summary. Note: File summaries will appear in the same language as the file, regardless of your language preferences. Manage your file summaries You can adjust whether to show Slack AI file summaries. If disabled, file summaries won't be generated for any file you upload, and you won't see summaries for other people's files. Click your profile picture in the sidebar. Select Preferences. Choose Slack AI. Below File summaries, choose whether you’d like Slack AI to summarize files you upload and display summaries for files that other people upload. Note: Slack AI will summarize files by default but owners and admins can restrict this. Search for answers Ask a question in your own words and get a concise answer based on relevant knowledge already in Slack. Try asking questions that start with “how” or “what” or keywords like a project name to get started. Desktop Mobile Click the search field at the top of Slack. Type your question into the search field and press Enter. Slack AI answers will appear at the top of your search results. Slack AI answers will have citations that refer to the source messages or files that informed them. Hover over a citation to preview the source or click on it to view the message or file in Slack. Tap the search field at the top of Slack. Type your question into the search field and tap Search or the magnifying glass on your device's keyboard Slack AI answers will appear at the top of your search results. Slack AI answers will have citations that refer to the source messages that informed them. Tap a citation to view the source message or file in Slack. Tip: Get more out of search answers by visiting Tips for searching with Slack AI. Recap your day Start your day by getting caught up with a customized summary of your unread channels. With daily recaps, you can get automated daily summaries for channels that you’re interested in keeping tabs on, but don’t want to interrupt you throughout your work day. When you set up your recap for the first time, Slack AI will recommend a few channels that might be helpful to have a recap for — ones you visit often, but don’t tend to participate in. Once you review which channels to include and turn recap on, you can mute those channels to keep your sidebar focused and tidy, or unmute the conversations you'd like to continue to be notified for. You’ll get a new recap every morning with what you’ve missed from the previous day. Note: Owners and admins can choose whether members can use daily recaps. If you don’t see the option to view your recap, reach out to an owner or admin and ask for help. Read your daily recap Desktop Mobile Select Recap in your sidebar. Review your recap. Click the More detail icon to review a recap’s sources or click the three dots icon next to any channel to remove it from future recaps. From Home, tap Recap. Review your recap. Tap a message to view more details including the recap's sources. Tip: You can also easily add conversations to your recap by right-clicking them in the sidebar and selecting Add to recap. Manage your daily recap You can adjust the conversations in your recap at any time, and decide which channels should be muted in your sidebar to keep it tidy. From your desktop, click Recap in the sidebar. Click the gear icon in the top right. To add conversations to your recap, search for and select the channel you’d like to add. Add as many channels as you’d like. To remove conversations, uncheck the boxes next to the conversations you no longer want to include. Mute or unmute channels by clicking the toggle. Click Save FAQs How does Slack AI work? Slack AI uses third-party large language models (LLMs) hosted within Slack’s secure infrastructure to power conversation summaries and search answers. Can I use Slack AI on my mobile device? Yes. Slack AI is supported on both our iOS and Android apps. How does billing for Slack AI work? Billing for Slack AI will follow a similar structure to your plan type. You will be billed for all active workspace members on a price-per-user basis and terms will be aligned with plan terms — just like our Fair Billing policy. Everyone in your workspace or Enterprise Grid org will have unlimited use when you purchase Slack AI. Does Slack AI search canvases and files? Yes. By default, Slack AI will search most files in Slack but owners and admins can restrict this if they’d like. What plans and languages is Slack AI available in? Slack AI is currently available as a paid add-on for paid plans, with support for English, German, Japanese, Portuguese, and Spanish. Support for additional languages is coming soon. What language will I see Slack AI content in? Slack AI talks to you in the language you set in your individual language preferences. This means that if you set your language preference to Japanese, your Slack AI responses will be presented in Japanese. If you would like Slack AI to respond to you in another language, adjust your Slack language preferences. What does “language support” mean for Slack AI? When you initiate a summary, recap, or search, Slack AI sends only the most relevant messages to the LLM to create a summary. To do this, Slack messages get filtered through different language-specific models to find and rank highly relevant information. When we say a language is supported, it means that language has its own filtering models, and we’ve done quality testing on the results. Currently, Slack AI supports English, German, Japanese, Portuguese, and Spanish. If you use Slack in a language not available in your preferences, Slack AI will still return results, but you may see a difference in quality. Is Slack AI secure? Slack is committed to data ownership, security, and privacy, and Slack AI has been built to uphold those commitments from day one. Visit our Security for Slack AI FAQ. Who can use this feature? All members (including guests) Available on paid plans as a paid add-on Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.render('slack_captcha', { 'sitekey' : "6LcQQiYUAAAAADxJHrihACqD5wf3lksm9jbnRY5k" }); };Submit article feedbackIf you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Oops! We're having trouble. Please try again later!IN THIS ARTICLE'''
