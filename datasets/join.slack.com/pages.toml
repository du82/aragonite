ilder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterWorkspace administrationEnterprise Grid settings & permissionsManage profile details for Slack ConnectManage profile details for Slack ConnectOwners and Admins can manage what information outside organizations can see when viewing member profiles in Slack Connect channels and DMs. There are two options to choose from: Basic details (default)Name and profile photo Standard work detailsName, profile photo, title, status, local time, pronouns, and whether notifications have been paused with Do Not Disturb Manage profile visibility Pro and Business+ plans Enterprise Grid plan Workspace Owners can decide what profile information outside organizations can see in Slack Connect conversations. From the Home tab, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. Click the Settings tab. Next to Slack Connect Member Profiles, click Expand. Select an option. Click Save. Org Owners and Org Admins can decide what profile information outside organizations can see in Slack Connect conversations. They can also set a specific setting per organization. Adjust profile visibility for Slack Connect From the Home tab, click your organization name in the sidebar. Select Tools & settings from the menu, then click Organization settings. Click Slack Connect in the sidebar, then select Settings. Next to Member profiles, click Edit. Select an option, then click Save. Adjust profile visibility per external organization From the Home tab, click your organization name in the sidebar. Select Tools & settings from the menu, then click Organization settings. Click Slack Connect in the sidebar, then select Connections. Next to the organization you’d like to customize, click the three dots icon, then select Universal. Click Profiles in the sidebar, then select Customize for [organization name]. Choose an option from the drop-down menu, then click Save Change. Who can use this feature? Workspace Owners/Admins (Pro and Business+) and Org Owners/Admins (Enterprise Grid) Available on paid plans Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.render('slack_captcha', { 'sitekey' : "6LcQQiYUAAAAADxJHrihACqD5wf3lksm9jbnRY5k" }); };Submit article feedbackIf you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Oops! We're having trouble. Please try again later!IN THIS ARTICLE'''
