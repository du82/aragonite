,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterUsing SlackChannelsAdd people to a channelAdd people to a channel Slack organizes conversations into dedicated spaces called channels. Add people to channels to bring the right people and information in your workspace together in one place (for people outside your company, learn how to use Slack Connect to invite them to a channel). Add people to a channel You can add up to 1,000 people to a channel at once. For large groups, we recommend copying a list of full names or email addresses from another channel in Slack or another service before following the steps below. If email addresses are hidden in member profiles, you won't be able to add people to channels using email addresses. Tip: To help onboard new members, owners and admins can set default channels for them to automatically join. Desktop Mobile Open the channel you'd like to add people to. Click cluster of profile pictures in the top right. Click Add people. To add a few people, search for the members you'd like to add by name, email address, or user group (if you're using a paid plan) and select them. To add a large group, paste the list of names or email addresses into the field. When you're done, click Add. Open the channel you’d like to add people to. Tap the channel name at the top. Tap Add. To add a few people, search for the members you'd like to add by name or email address and select them. To add a large group, paste the list of names or email addresses into the field. When you’re done, tap Add. Tip: On paid plans, you can invite a usergroup to a channel on mobile with the /invite @[usergroup] slash command. Note: On the Business+ and Enterprise Grid plans, owners and admins with permission can add people to channels with channel management tools. Who can use this feature? All members and Multi-Channel Guests Available on all plans Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.render('slack_captcha', { 'sitekey' : "6LcQQiYUAAAAADxJHrihACqD5wf3lksm9jbnRY5k" }); };Submit article feedbackIf you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Oops! We're having trouble. Please try again later!IN THIS ARTICLE'''
