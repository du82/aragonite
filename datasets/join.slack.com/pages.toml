rmatting,framework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterWorkspace administrationWorkspace settings & permissionsManage channel posting permissionsManage channel posting permissionsYou can adjust who's allowed to post to channels or use mentions that notify all channel members. This helps keep large channels, like those used for announcements, on topic and free from distraction. Note: Owners can restrict who can set posting permissions. If you don’t see this option, find an owner and ask for help. Manage who can post in channels Free and Pro plans Business+ and Enterprise Grid plans You can change who can post messages in the #general channel. This channel will be read-only for anyone without permission to post. From your desktop, open the #general channel. Click the channel name in the conversation header. Select the Settings tab. Next to Posting permissions, click Edit. Select who can post and reply to messages. If you're specifying specific people, you can select up to 100. Click Save Changes. You can change who can post in any channel. A channel will be read-only for anyone without permission to post. From your desktop, open the channel you'd like to adjust posting permissions for. Click the channel name in the conversation header. Select the Settings tab. Next to Posting permissions, click Edit. Select who can post and reply to messages. If you're specifying specific people, you can select up to 100 per channel. Click Save Changes. Tip: On the Business+ and Enterprise Grid plans, owners and admins with permission can manage channel posting permissions with channel management tools. Manage who can notify a channel Free and Pro plans Business+ and Enterprise Grid plans You can change who can use @everyone to notify all members of the #general channel. From your desktop, open the #general channel. Click the channel name in the conversation header. Select the Settings tab. Next to Posting permissions, click Edit. Check or uncheck the box next to Allow @everyone mentions. Click Save Changes. You can change who can use @everyone to notify all members of the #general channel. You can also change who can use @here or @channel to notify members in other channels. From your desktop, open the channel you'd like to adjust posting permissions for. Click the channel name in the conversation header. Select the Settings tab. Next to Posting permissions, click Edit. Check or uncheck the box next to Allow @here and @channel mentions. (For the #general channel, you’ll see Allow @everyone mentions.) Click Save Changes. Who can use this feature? All members (default) Available on all plans Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.render('slack_captcha', { 'sitekey' : "6LcQQiYUAAAAADxJHrihACqD5wf3lksm9jbnRY5k" }); };Submit article feedbackIf you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Oops! We're having trouble. Please try again later!IN THIS ARTICLE'''
