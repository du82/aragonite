["https://join.slack.com/marketplace/AEFLFJR9Q-slack-for-gmail"]
title = "Slack for Gmail™ | Slack Marketplace"
description = "Keep conversations moving forward by bringing context from an email into a Slack channel or direct message with the Slack for Gmail™ Add-On available in the G Suite Marketplace. You can choose to add a message and include attachments along with the email as well.When to send email into Slack:• Email chain getting too noisy? Send it into Slack where you can discuss quickly and move forward.• Have an idea you want to share with your team? Send it along to a relevant channel with a note about your insights.• Need to coordinate a response to a customer question? Flag your teammates in Slack and use the email content to set context.How the Add-On works:• Start by installing the Slack for Gmail™ Add-On from the G Suite Marketplace• Open any email and click on the Slack icon in the right-hand side of your inbox • Choose the channel or person you’d like to forward the email to inside of Slack• Add a message and include attachments if you’d like• Voilà! The email is forwarded into Slack where anyone in the channel or direct message you shared it to can see the email content and open attachments.Please note that the following limits apply to emails shared via this app:• The combined headers and body of an email cannot be larger than 1MB.• When combined with attachments, an email cannot be larger than 30 MB.• There is a maximum of 20 attachments per email.More ways to use Google Mail in SlackAutomate with Workflow BuilderWorkflow Builder* lets you transform everyday processes into automations, without writing a single line of code. Add third-party tools like Google Mail to workflows to manage work and processes from Slack, and use templates to get started quickly. Learn more about automationsTemplates available for Google Mail:New Gmail messageFill out a form in Slack to send a Gmail message*Workflow Builder is only available on paid subscriptions"
