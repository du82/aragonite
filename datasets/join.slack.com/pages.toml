atting,framework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterWorkspace administrationSlack data & analyticsCustomize data retention in SlackCustomize data retention in SlackOn paid plans, Slack will retain all messages, canvases, lists, and files (including audio and video clips) for the lifetime of your workspace. If you’d like, you can adjust your retention settings to automatically delete data from your workspace after a set amount of time. You can also allow members to edit message retention settings for individual channels and direct messages (DMs). What you need to know On the free version of Slack, data older than one year will be deleted from your workspace on a rolling basis. On paid plans, data is kept for the lifetime of your workspace by default. Data deleted according to your retention setting is permanent. Adjust these settings with care. Deletions run once a day, so data may be deleted shortly after making a change to your retention settings. Retention settings will apply to all messages, files, canvases, and lists, including ones that are pinned or saved. Adjust message retention settings Free plan Pro and Business+ plans Enterprise Grid plan Workspace Owners can choose from the following options when setting message retention for conversations: Keep messages for one year, but don't track edits or deletionsSlack will keep all messages for one year, but will not track message edits or deletions. After one year, messages will be permanently deleted. Keep messages for 90 days, including edits and deletionsSlack will delete messages, edits, and deletions after 90 days. Note: On the free plan, applying basic data retention settings allow you to automatically delete messages and files that are hidden. From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. Next to Message history, click Expand. Select your preferred retention settings from the drop-down menu. Click Save. To confirm the change, click Confirm. Workspace Owners can choose from the following options when setting message retention for conversations: Keep everythingSlack will keep all messages and track message edits and deletions. Keep all messages, but don't track revisionsSlack will keep all messages, but will not track message edits or deletions. Delete messages after a specific time period Slack will delete messages following the custom time frame you choose. Note: On the Business+ plan, you can choose to delete messages from channels, but keep them accessible in exports if your workspace has been approved to export data from all conversations. From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. Next to Message history, click Expand. Select your preferred retention settings from the drop-down menu. Click Save. Check the box to confirm the change, then click Save. As an Org Owner, you can set a policy for message retention that will apply to every workspace in your org. With a policy in place, Workspace Owners won’t have the option to adjust message retention settings for workspaces they manage. Org Owners can also set a policy to hide messages before they are permanently deleted by message retention. You can choose from the following options when setting message retention for conversations: Keep everythingSlack will keep all messages and track message edits and deletions. Keep all messages, but don't track revisionsSlack will keep all messages, but will not track message edits or deletions. Delete messages after a specific time periodSlack will delete messages following the custom time frame you choose. Note: If your organization has been approved to export data from all conversations, you can choose to delete messages from channels and DMs, but keep them accessible in JSON based exports. Set org-level message retention policies To set an org policy for message retention or hiding, contact our Support team. When a policy is set, Slackbot will notify the Primary Org Owner and request approval to apply it. If approved, Slackbot will notify each Workspace Owner of changes to retention settings. Review org-level message retention policies From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Organization settings. Click Settings in the left sidebar, then select History. Set workspace-level message retention settings Note: If a retention policy has been set at the org level, Workspace Owners won’t be able to adjust message retention settings for their workspace(s). From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. If you manage more than one workspace, choose one from the drop-down menu. Next to Message history, click Expand. Select your preferred retention settings from the drop-down menu. Click Save. Check the box to confirm the change, then click Save. Note: Keep in mind that your retention settings will impact what you see in an export file. Allow conversation-specific retention settings Workspace Owners and Org Owners on paid plans can allow people to override retention settings and edit message retention for individual conversations with the following options: Member overrides allow members on paid plans to set their own message retention period for private channels and their DM conversations. Workspace Owners will be able to adjust this for public channels as well. Admin overrides allow admins on the Business+ and Enterprise Grid plans to edit message retention for channels with channel management tools. Pro and Business+ plans Enterprise Grid plan From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. Next to Message history, click Expand. Check the box next to Let workspace members override these settings. Click Save. Check the box to confirm the change, then click Apply new setting. Set message retention override policies As an Org Owner, you can set a policy to allow admins or members to override retention settings and adjust message retention for individual conversations in every workspace of your Enterprise Grid org. With this policy in place, Workspace Owners won’t have the option to adjust message retention settings for workspaces they manage. Contact our Support team to set this policy for your org. When a policy is set, Slackbot will notify the Org Primary Owner with a request to apply it. If approved, Slackbot will notify each Workspace Owner of changes to retention settings. Review message retention override policies From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Organization settings. Click Settings in the left sidebar, then select Messages and file history. Review your policies next to Message history overrides. Set workspace-level message retention override settings Note: If a retention policy has been set at the org level, Workspace Owners won’t be able to adjust message retention settings for their workspace(s). From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. If you manage more than one workspace, choose one from the drop-down menu. Next to Message history, click Expand. Check the box next to Let members set their own message history in private channel. Click Save. Check the box to confirm the change, then click Apply new setting. Note: Retention does not apply to messages in deleted channels. If you delete a channel, messages and revisions will be permanently deleted, regardless of your workspace retention settings. Adjust file retention settings When configuring your file retention settings, the available options will depend on your plan. Free plan Pro and Business+ plans Enterprise Grid plan Workspace Owners can choose from the following options when setting file retention: Keep files for one year, but don't keep deleted contentSlack will keep all shared files for one year, before they are permanently deleted. Deleted files will not be tracked. Keep files for 90 days, including deleted contentSlack will permanently delete files (snippets, uploaded files, and those shared via third-party apps like Dropbox or Google Drive) after 90 days. Note: Files shared via third-party apps remain stored in the service they originate from. Deleting them from Slack won't impact the original files. From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. Next to File history, click Expand. Select your preferred retention settings. Click Save. Check the box next to Yes, apply these new settings, then click Confirm. Workspace Owners can choose from the following options when setting file retention: Keep all filesSlack will keep all shared files for the lifetime of your workspace. Keep files, but only for a set number of daysSlack will permanently delete files (snippets, uploaded files, and those shared via third-party apps like Dropbox or Google Drive) after the number of days you choose. Keep all files including deleted filesSlack will keep all files for the lifetime of your workspace. Deleted files (including those that have been manually deleted) will be available via exports for all conversations and the Discovery API. Keep files including deleted files, but only for a set number of daysSlack will permanently delete files (snippets, uploaded files, and those shared via third-party apps) after the number of days you choose. Deleted files (including those that have been manually deleted) will be available via exports for all conversations and the Discovery API until the specified time has elapsed. Note: Files shared via third-party apps remain stored in the service they originate from. Deleting them from Slack won't impact the original files. From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Workspace settings. Next to File history, click Expand. Select your preferred retention settings. Click Save. Check the box next to Yes, apply these new settings, then click Confirm. As an Org Owner, you can set a policy for file retention that applies to every workspace in your org. To do so, contact our Support team. Org Owners can choose from the following options when setting file retention: Keep all filesSlack will keep all shared files for the lifetime of your Enterprise Grid org. Keep files, but only for a set number of daysSlack will permanently delete files (snippets, uploaded files, and those shared via third-party apps like Dropbox or Google Drive) after the number of days you choose. Keep "
