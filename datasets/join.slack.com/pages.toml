full_description = '''Workspace administrationLearn how to manage your Slack workspace or Enterprise Grid org.Getting StartedIntro to Slack Get started: admins Get started: usersRoles & permissionsUsing SlackChannelsDirect messagesFormat & style messagesMessage features & toolsAudio & videoShare files & conversationsSearch in SlackKeyboard shortcuts & accessibilityYour ProfileManage your accountAdjust your notificationsChange your settings & preferencesGet troubleshooting tipsConnect ToolsConnect tools from the Slack App DirectoryAutomate tasks with Workflow BuilderExplore apps in the Slack App DirectoryCreate custom appsAdministrationManage membersManage channelsManage billing, payments & plansWorkspace settings & permissionsWorkspace customizationEnterprise Grid settings & permissionsManage apps & workflowsConfigure access & securitySlack data & analyticsTutorials & videosTutorials Videos Discover moreNextPreviousActions,activity,access logs,accessibility,add,add an app,Add members,Add to Slack,administrators,all passwords,analytics,android,announcement,announcements,App Directory,app icon,Apple Watch,approving apps,archive,Asana,Atlassian,Automation apps,badge,billing details,billing,Bitbucket,bot user,box,browse,calls,Calls:,cancel,changes,channels,channel instantly,channel management,channel notification,channel suggestions,claim domains,close,company culture,compliance exports,compose,computers,conversations,convert,connect,connected accounts,connection,connecting,copy messages,create,customization,customize,custom SAML,custom,customer support teams,data exports,data security,deactivate,default channels,delete,deletion,deploy slack,desktop,direct messages,directory,disable,discover and join,Discovery APIs,display name,DMs,Do Not Disturb,domain,domains,downgrade,dropbox,duplicate accounts,edit,editing,education,email address,email,emoji,emoticons,Enterprise Grid,Enterprise Mobility Management,executives,export,failed payments,Fair Billing,faqs,finding,format,formatting,framework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterWorkspace administrationEnterprise Grid settings & permissionsMigrate workspaces to Enterprise GridMigrate workspaces to Enterprise GridLooking to incorporate an external workspace into your Enterprise Grid organization? Review this guide to learn how to prepare and what you can expect along the way. Before migration Workspaces on the Free, Pro, and Business+ plans can be migrated into your Enterprise Grid org. As you prepare to migrate a workspace, there are a few things to keep in mind: Account provisioningIf the migrating workspace uses SAML to manage identity, turn off account provisioning in your identity provider (IDP) to prevent accounts from being de-provisioned when you disable the connector. You can also minimize migration downtime and prevent duplicate accounts by assigning access to new members after the migration is complete. Guest accessIf you intend to allow guests to sign in with their email address and password, ensure your Grid org settings allow them to bypass SSO. Workspace settingsYour org's settings and policies will override individual workspace settings. Depending on permissions, Workspace Owners and Admins may be able to make adjustments to their workspace settings. Audit logs If your workspace uses audit logs, you'll need to export your logs to access them once the migration is complete. Initiate a migration You can start a migration from the admin dashboard. You’ll need the ID and URL of the workspace that you’re migrating. From your desktop, click your organization name in the sidebar. Hover over Tools & settings, then click Organization settings. Click Workspaces, then select Migrations. Enter the workspace ID and URL, then click Send Migration Request. The Workspace Primary Owner will receive a notification from Slackbot where they can approve or deny the migration request. Complete the migration checklist Once your migration has been approved by the Workspace Primary Owner, we'll provide you with a checklist to ensure you complete all necessary tasks. From your desktop, click your organization name in the sidebar. Hover over Tools & settings, then click Organization settings. Click Workspaces, then select Migrations. Select a workspace to open the migration checklist. Set up SSO (single sign-on) To proceed with your migration, set up SSO for your org (if you haven’t already). Make sure your new members can access Slack after the migration by matching the email domain in your SSO provider to the email domain for new users migrating into your org. Confirm matching user accountsIf the workspace you’re migrating contains accounts with the exact same email address and account type as accounts on your Grid org, you can choose to merge them. Resolve conflicting user accountsConflicting user accounts share some of the same profile fields, but not enough to be exact matches. If the workspace contains partial account matches, review them individually from the Migrating users tab and choose an action. Review conflicting settings If your Grid org's settings differ from the migrating workspace, you can review them from the Conflicting settings tab. Adjust settings if you'd like then click Confirm Settings to finish. Schedule your migrationWhen you're ready, click Schedule Migration to complete the checklist and schedule your migration. Follow the prompts to select a date and time for your migration. During migration Below is an overview of how Org Owners can view and manage migrations, plus what to expect once the migration is underway. Note: Migrations of larger workspaces may take a few hours to complete. We recommend giving members advance notice to avoid disruption. What to expect during a migration The migrating workspace will be unavailable to members for a portion of the migration. Members can use their workspace while direct messages (DMs) migrate in the background. Typically, the Enterprise Grid org will be accessible to existing members throughout the migration. Members will receive a message shortly before the migration begins to let them know their workspace will be temporarily unavailable. Slack Connect conversations between the migrating workspace and org won’t be accessible to either organization. After the migration, Slack Connect channels will become org-wide multi-workspace channels and they’ll use the privacy setting of the channel in the org. Members from the migrating workspace will receive an email and Slackbot message when the migration is complete. View and manage migrations Org Owners can cancel upcoming migrations and view the status of any that are in progress: From your desktop, click your organization name in the sidebar. Hover over Tools & settings, then click Organization settings. Click Workspaces, then click Migrations. Click the three dots icon next to a migration, then click Cancel migration. After migration Once migration is complete, here's what to expect: Message history, files, apps, and emojiMembers will have access to channel and direct message (DM) history, files, apps, and custom emoji. DMs across workspaces will be merged together. ProfilesDuring the migration process, members' profile details are merged based on the options you choose in the migration checklist. If more than one workspace was moved, profile details from the first workspace will be applied by default. Members can always update their profile after migrating if needed. Slack Sales ElevateAny Sales Elevate configurations including settings and notifications will be migrated to the Enterprise Grid organization. Workspace accessBy default, any org member can request to join the migrated workspace. Org Owners can adjust how members find and join the workspace by changing the access preference. Member accessThe migrated workspace’s URL will redirect to your org's sign-in page. New members and guests will sign in using the method set in your SSO settings. Workspace rolesThe Workspace Primary Owner role for any migrated workspaces will be re-assigned to the Org Primary Owner. The former Workspace Primary Owner will become a Workspace Owner. Have migration questions? Reach out to our Support team for help. Who can use this feature? Org Owners Available on the Enterprise Grid plan Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.render('slack_captcha', { 'sitekey' : "6LcQQiYUAAAAADxJHrihACqD5wf3lksm9jbnRY5k" }); };Submit article feedbackIf you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Oops! We're having trouble. Please try again later!IN THIS ARTICLE'''
