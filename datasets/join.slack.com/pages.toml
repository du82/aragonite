ilder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterWorkspace administrationManage apps & workflowsManage app settings and permissionsManage app settings and permissions Who can use this feature? Workspace Owners Available on all plans By default, any member can install an app to connect a third-party service to their Slack workspace. If they’d like, Workspace Owners can set permissions to manage how apps work in Slack. These permissions can be adjusted whether app approval is enabled for a workspace or not. Available permissions Only allow apps from the Slack MarketplaceLimit members to installing apps from the Slack Marketplace. All apps in the Slack Marketplace are reviewed by Slack. This will not prevent members from creating and installing internal apps. Multi-Channel Guests may use shortcutsAllow Multi-Channel Guests to use available shortcuts. Only allow link previews from installed appsRich link previews will only display if the Slack app registered to the link domain is installed to your workspace. Enable Sign in with SlackAllow members to use a Sign in with Slack option to sign into third-party websites and services when they install an associated app to Slack. Set permissions From your desktop, click your workspace name in the sidebar. Select Tools & settings from the menu, then click Manage apps to open the Slack Marketplace. Click App Management Settings in the left column. Scroll down to the bottom of the page and toggle the permissions you'd like to manage on or off. Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article hel