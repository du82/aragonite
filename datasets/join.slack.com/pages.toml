["https://join.slack.com/resources/using-slack/setting-up-a-shared-channel"]
title = "Getting started with Slack Connect | Slack"
description = "Slack Connect helps you speed up communication with the people you work with outside your company."
full_description = "Getting started with Slack ConnectSpeed up communication and work more securely with external partners, vendors and people outside your companyTable of ContentsTable of Contents 2 min readWhy Use Slack Connect? Designed to replace email—or however you collaborate with external organizations, customers and clients—Slack Connect makes the work that happens with outside partners faster, more productive and more secure. 4x Faster deal cycles for a sales team working with clients50% Reduction in weekly meetings for a technical team working with third party contractors2x Decreased turnaround time for creative reviews and approvals for a marketing team and creative agency. For the most part, working in channels or exchanging direct messages will look and feel just like the Slack you’re already used to. But in Slack Connect, you’ll be communicating with stakeholders from different companies. Everyone can discuss work, share files and drive business results in a shared space. Join the 100,000+ organizations working in Slack Connect: We hear back from our customers that we’re like an extension of their team, and part of that feeling definitely comes from the fact that we use Slack.Kami RicheyDirector of Customer Experience, FastlyFastly Customer Story Slack で実現する Digital HQ とは？デモ動画を見る→ How to get started with Slack Connect Just like with Slack, you can choose to use either direct messages or channels to communicate. If you are working with one other person—say on a contract or proposal—send them an invite to a direct message. You’ll be able to start messaging in Slack as soon as your partner accepts. If you need to work with more than one person—perhaps on a longer term initiative or campaign—you can send an invite to collaborate in a channel by following the steps below. Depending on your settings, the invitation may need to go through admin approval. 1. Create the channel Click the + button next to Channels in your sidebar. Name the channel, select privacy settings and click Next. 2. Send the invite Follow the prompt to share the channel outside your workspace. Send your partner an email invite right from Slack. 3. Wait for your partner to accept Pour yourself a cup of tea. Once your partner clicks the link, they’ll be taken back to Slack, where they can accept the invite and set up the channel on their end. 4. Get admin approval Depending on your settings, the invitation will be sent to an admin on both teams for approval. Admins can manage channels invitations by clicking on their workspace name > Administration > Manage shared channels. Get started Join the network of global companies collaborating together in Slack Connect. A better way to work with external partnersStrengthen relationships using Slack Connect. Whether you’re new to Slack or a pro, you’ll improve how you work with partners in just a few clicks.Learn more Learn more about the benefits of using Slack to work with external partners To share a channel, you’ll need to be on a paid plan. For more info, check out our pricing and plans. ChannelsSlack ConnectFootnotesClaims and figures based on specific teams using shared channels at their companies. Results may vary at your organization.↩Was this resource useful?Yes, thanks!Not really0/600Submit FeedbackAwesome!Thanks so much for your feedback!Got it!Thanks for your feedback.Oops! We're having trouble. Please try again later!"
