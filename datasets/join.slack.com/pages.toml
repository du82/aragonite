["https://join.slack.com/marketplace/A89HZ352N-clockwise"]
title = "Clockwise | Slack Marketplace"
description = "Clockwise is the only AI calendar assistant available in Slack.Schedule and reschedule meetings directly from Slack while Clockwise does the heavy lifting to find the best time for everyone. Powered by automation and AI, Clockwise rapidly calculates the best time for meetings, tasks, and deep work – all based on your preferences and busy schedule. Clockwise coordinates across individuals, teams, and entire companies, and it gets smarter and more powerful as more people use it. Reach your AI calendar assistant from anywhere:- Message the Clockwise assistant directly in Slack with your scheduling need (e.g. “Book 30 minutes with @Jason tomorrow”) - Use the /cw slash command from channels or direct messages- Add the Clockwise assistant into a channel or direct message to schedule with a mentionPowerful scheduling intelligence behind every interaction:- Clockwise will suggest the best times for everyone by analyzing data across multiple calendars while considering preferences, existing meetings, and habits- You’ll be able to preview scheduling options with relevant tradeoffs before confirming the eventKeep your status, notifications, and calendar in sync- Set your status to update automatically when you’re in a meeting or focused on deep work to avoid interruptions- Let colleagues in other timezones know when it’s early or late your time- Prepare for your day with a daily preview of your meetings & who’s OOO- Get notified when Clockwise proactively moves a flexible meeting to improve your scheduleNote: Your access to Clockwise's AI-powered scheduling features may be limited depending on your Slack plan and domain settings. Please keep in mind that AI can make mistakes, so always check the details before booking.Learn more at www.getclockwise.com"
