full_description = '''Using SlackFrom channels to search, learn how Slack works from top to bottom.Getting StartedIntro to Slack Get started: admins Get started: usersRoles & permissionsUsing SlackChannelsDirect messagesFormat & style messagesMessage features & toolsAudio & videoShare files & conversationsSearch in SlackKeyboard shortcuts & accessibilityYour ProfileManage your accountAdjust your notificationsChange your settings & preferencesGet troubleshooting tipsConnect ToolsConnect tools from the Slack App DirectoryAutomate tasks with Workflow BuilderExplore apps in the Slack App DirectoryCreate custom appsAdministrationManage membersManage channelsManage billing, payments & plansWorkspace settings & permissionsWorkspace customizationEnterprise Grid settings & permissionsManage apps & workflowsConfigure access & securitySlack data & analyticsTutorials & videosTutorials Videos Discover moreNextPreviousActions,activity,access logs,accessibility,add,add an app,Add members,Add to Slack,administrators,all passwords,analytics,android,announcement,announcements,App Directory,app icon,Apple Watch,approving apps,archive,Asana,Atlassian,Automation apps,badge,billing details,billing,Bitbucket,bot user,box,browse,calls,Calls:,cancel,changes,channels,channel instantly,channel management,channel notification,channel suggestions,claim domains,close,company culture,compliance exports,compose,computers,conversations,convert,connect,connected accounts,connection,connecting,copy messages,create,customization,customize,custom SAML,custom,customer support teams,data exports,data security,deactivate,default channels,delete,deletion,deploy slack,desktop,direct messages,directory,disable,discover and join,Discovery APIs,display name,DMs,Do Not Disturb,domain,domains,downgrade,dropbox,duplicate accounts,edit,editing,education,email address,email,emoji,emoticons,Enterprise Grid,Enterprise Mobility Management,executives,export,failed payments,Fair Billing,faqs,finding,format,formatting,framework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterUsing SlackAudio & videoCreate audio and video clips in SlackCreate audio and video clips in SlackShare audio and video clips in Slack to communicate easily with your team, regardless of their time zone or location. Anyone in a channel or direct message (DM) can play clips, and reply in thread with a clip of their own. Tip: Use our ideas and templates to show off your work, share an update, or give kudos to your team in a clip. Record a clip You can record video and audio clips up to five minutes long from Slack on your desktop or mobile device. Record a video clip Desktop iOS Android From a channel or DM, click the camera icon in the message field. Click Record. Click Share Screen and select a window. When you’re finished, click Stop Recording and select a thumbnail. Click Done and add a message if you’d like. Click the paper plane icon to send your clip. Customize your video clip Turn your camera on or off. Mute or unmute yourself. Blur your background or upload a background image. Select a different camera or microphone. Upload an existing video as a clip. Open a channel or DM and tap the message field. Tap the plus icon and select Record a Video Clip. Tap the Record button. When you’re finished recording, tap the Record button again, then tap Use Video. Add a message if you’d like, then tap the paper plane icon to send your clip. Open a channel or DM and tap the message field. Tap the plus icon and select Record a Video Clip. Tap the Record button. When you’re finished recording, tap the Record button again, then tap Attach. Add a message if you’d like, then tap the paper plane icon to send your clip. Tip: Closed captions are available for all video clips. Record an audio clip Desktop iOS Android From a channel or DM, click the microphone icon in the message field to start recording. When you’re finished, click the check mark to stop recording. Add a message if you’d like, then click the paper plane icon to send your clip. Open a channel or DM and tap the message field. Tap the microphone icon to start recording. When you’re finished, tap the check mark to stop recording. Add a message if you’d like, then tap the paper plane icon to send your clip. Open a channel or DM and tap the message field. Tap the microphone icon to start recording. When you’re finished, tap the check mark button to stop recording. Add a message if you’d like, then tap the paper plane icon to send your clip. Note: When clips are shared in a conversation on desktop, a preview of the transcript will display. To read a clip’s full transcript on desktop or mobile, select the three lines icon. Delete a clip If you have permission to edit or delete messages, you can delete clips you’ve recorded. Desktop iOS Android Hover over a clip and click the three dots icon. Click Delete clip. Click Yes, Delete This Clip. Delete a video clip Tap the clip, then tap the three dots icon. Tap Delete. Tap Yes, Delete Clip. Delete an audio clip Tap and hold the clip. Tap Delete, then tap Yes, Delete Clip. Delete a video clip Tap the clip, then tap the three dots icon. Tap Delete. Tap Delete again. Delete an audio clip Tap and hold the clip. Tap Delete, then tap Delete again. Note: Clips follow the same retention policy as other files in Slack. Troubleshoot recording issues If you’re having trouble with audio or video when recording clips, read on to learn how to troubleshoot some common issues. Check audio input sources If audio isn’t working when you record, go to your audio and video preferences in the Slack desktop app. From your desktop, click your profile picture in the top right. Select Preferences from the menu. Click Audio & video in the left-side column. Once you’ve opened preferences, check the following: Make sure you’ve selected the correct microphone and speaker. Test your microphone by saying a few words. If the voice meter doesn’t move up and down as you speak, try the other options in the microphone dropdown menu. Check audio settings Check to make sure your audio isn’t muted, then confirm that Slack has permission to access your microphone. Mac Windows Open System Preferences. Select Security & Privacy, then click the Privacy tab. Select Microphone from the list on the left. Check the box next to Slack. If it’s already checked, uncheck and recheck it. If you’re on Windows 10, follow these steps to make sure you’ve granted Slack access to your microphone: Open Settings. Select Privacy. Click Microphone. Toggle the setting on to allow apps to access your microphone. In the list of Microsoft Store apps, find Slack and toggle the setting on. Check camera and video settings If your camera isn’t working when you record, you may need to grant Slack access from your computer’s system settings: Mac Windows Open System Preferences. Select Security & Privacy, then click the Privacy tab. Click Camera. Check the box next to Slack. If it’s already checked, uncheck and recheck it. Open Settings. Select Privacy. Click Camera. Toggle the setting on to allow apps to access your camera. In the list of Microsoft Store apps, find Slack and toggle the setting on. Who can use this feature? All members and guests Available on all plans Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.r