amework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterUsing SlackMessage features & toolsSend emails to SlackSend emails to SlackSlack can help you keep all of your work communication — including emails — in one place. There are a few ways to send email to Slack, depending on your plan and how you’d like to use emails once they’ve been sent to your workspace. Note: If your Enterprise Grid organization is HIPAA compliant, you can’t send emails to Slack. How to send email to Slack Method Description Plan availability Create an email address for a channel or direct message (DM) Set up a dedicated email address to send emails to that conversation Paid plans Use an email add-on Install an email add-on to send individual emails from Gmail or Outlook to channels or DMs All plans Forward email to your DM with Slackbot Create a forwarding address to send individual emails to your DM with Slackbot All plans Create an email address for a channel or DM By default, anyone can create an email address for a channel or DM. Once an email address has been created for a conversation, anyone with the email address can use it to send email to Slack. Note: If you work with people from other organizations in channels, each organization can create a unique email address for a channel. Any email sent to that channel will be visible to all members. Create an email address From your desktop, open the channel or DM you’d like to send email to. Click the channel or member name(s) in the conversation header. Click the Integrations tab. Select Send emails to this [channel] or [conversation]. Click Get Email Address. If you’d like to set up an automatic forwarding rule from your email provider or add the email to your address book, click Copy next to the email address. If you created an email address for a channel, Slackbot will post a message that’s only visible to you with a prompt to let members know an email address has been created. Click Share Email Address to post a message to the channel with any details you’d like. Otherwise, click Dismiss. Note: Owners and admins can manage members’ ability to create email addresses for channels and DMs. If you don’t see this option, find an owner or admin to ask for help. Customize email appearance If you’d like, you can add an image and custom name for emails posted to Slack so they’re easier for people to recognize. From your desktop, open a channel or DM with an email address. Click the channel or member name(s) in the conversation header. Click the Integrations tab. Select Send emails to this [channel] or [conversation]. Click Customize Email Appearance. Below Email Icon, open the drop-down menu to upload an image or choose an emoji to display alongside emails posted to Slack. Below Email Name, enter a label for your emails. Click Save Changes. Delete an email address Owners, admins, and members with permission to create email addresses for conversations can delete the email address for any channel or DM they’re a part of. If a conversation’s email address is deleted, emails sent to it will not be posted in Slack. From your desktop, open the channel or DM. Click the channel or member name(s) in the conversation header. Click the Integrations tab. Select Send emails to this [channel] or [conversation]. Below the email address, click Delete Address. Click Delete email address to confirm. Use an email add-on Gmail Outlook Send email to Slack Head to the Slack for Gmail page in the Google Workspace Marketplace to install the Slack add-on to Gmail. If you’re unable to install the add-on, ask a Google Workspace administrator at your company to approve Slack for Gmail from the Google Workspace Admin Console. After you install the add-on, click the Slack icon in the right sidebar to connect your Gmail account to Slack. When prompted, open an email and click Connect to Slack. To send an email to Slack, click the Slack icon in the right sidebar and select Search Channels and People. Choose a workspace from the drop-down menu, then type the name of a channel or person and press Enter or select their name. Click Send to [name]. Click View to see your email in Slack. Disconnect Gmail and Slack Head to the Google Workspace Marketplace. Click the gear icon in the top-right corner, then select Manage Apps. Find Slack, then click Manage. Click Remove. Tip: If you don’t use Google Workspace, you can remove the add-on from the Add-ons section of your Gmail settings. What to expect The Outlook email add-in is only available for Office 365. It’s not supported for on-premise Microsoft Exchange customers. Only the Exchange mail protocol is supported, so you won’t be able to use the add-in if your Outlook client is set up to receive messages with POP/IMAP. On-premises SharePoint installations or Office 365 plans hosted on a Microsoft national cloud deployment (including Office 365 U.S. Government, Office 365 Germany, and Office 365 operated by 21Vianet in China) are not currently supported. Send email to Slack Head to the Slack for Outlook page in Microsoft AppSource. Click Get it now and follow the prompts. If you’re unable to install the add-in yourself, contact an Office 365 administrator at your company for help. After you install the add-in, connect Outlook to your Slack workspace. If you use the Outlook desktop app, click the Slack icon in the toolbar and select Connect to Slack. If you use Outlook in a browser, open an email and click the three dots icon, then select Slack for Outlook. To send an email to Slack from the Outlook desktop app, open an email and click the Slack icon to select the name of a channel or person from the dropdown menu. Click Send to Slack to send the email. To send an email to Slack from Outlook in a browser, open an email and click the three dots icon and select Send to Slack. Select the name of a channel or person from the dropdown menu, then click Send to Slack. Note: If you run into problems connecting Slack and Outlook, try using Google Chrome or Mozilla Firefox, then restart the Outlook desktop app. Disconnect Outlook and Slack Sign in to the Outlook desktop app. Click Get add-ins from the toolbar. Click My add-ins. Find Slack for Outlook and click the three dots icon. Click Remove. Set up a Slackbot forwarding address From your desktop, click your profile picture in the tab bar. Select Preferences from the menu. Click Messages & media. Scroll down to Bring emails into Slack, then click Get a Forwarding Address. Slack will generate a forwarding email address. Click Copy and use the forwarding address to set up a forwarding rule in your email client if you’d like. If you need to stop forwarding emails, go to the Messages & media section of your preferences. Below your forwarding address, click Disable this address. Note: If emails you send to Slack aren’t delivered, incoming emails may have been disabled for your workspace or org. Find an owner or admin to ask for help. Who can use this feature? All members (by default) Available on all plans Awesome!Thanks so much for your feedback!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Got it!If you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Was this article helpful?Yes, thanks!Not reallySorry about that! What did you find most unhelpful?This article didn’t answer my questions or solve my problemI found this article confusing or difficult to readI don’t like how the feature worksOther0/600var onloadRecaptchaCallback = function() { grecaptcha.render('slack_captcha', { 'sitekey' : "6LcQQiYUAAAAADxJHrihACqD5wf3lksm9jbnRY5k" }); };Submit article feedbackIf you’d like a member of our support team to respond to you, please send a note to feedback@slack.com.Oops! We're having trouble. Please try again later!IN THIS ARTICLE'''
