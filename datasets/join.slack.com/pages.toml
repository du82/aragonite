full_description = "ComplianceMeet global standards for privacy and securitySlack adheres to GDPR, CCPA and other privacy and security regulations. We also have policies and controls for you to manage security threats, keep your data safe and help you meet your compliance obligations.GDPRCCPAData ResidencyData Processing AddendaGlobal Trade Compliance Need help finding the information you need to complete your security or privacy questionnaire? We’ve organized our compliance resources so you can demonstrate Slack’s ability to meet your organization's requirements. Read our white paper on complianceRead our Transfer Impact AssessmentCompliance certifications and attestationsISO/IEC 27001Information Security Management System (ISMS)Download certificateISO/IEC 27017Security Controls for the Provision and Use of Cloud ServicesDownload certificateISO/IEC 27018Protection of Personally Identifiable Information (PII)Download certificateISO/IEC 27701Privacy Information Management System (PIMS)Download certificateSOC 2(Type Ⅱ)Trust Services PrinciplesSOC 3Service Organization ControlsDownload reportGovSlack SOC 2(Type Ⅱ)Trust Services PrinciplesGovSlack SOC 3Service Organization ControlDownload reportAPEC for Processors CertificationPrivacy Recognition for Processors (PRP) SystemDownload certificateAPEC for Controllers CertificationCross-Border Privacy Rules (CBPR) SystemDownload certificateCSACloud Security AllianceMeet specific industry regulations and international security and data privacy standardsHealth Insurance Portability and Accountability Act (HIPAA) Slack can be configured for HIPAA compliance, including electronically protected health information (e-PHI). Request requirements for HIPAA entitiesFinancial Industry Regulatory Authority (FINRA)Slack is FINRA 17a-4 configurable so your team can collaborate and still meet your compliance requirements.Federal Risk and Authorization Management Program (FedRAMP)Slack is FedRAMP Moderate authorized to meet the compliance needs of organizations in the public sector.GovSlack is FedRAMP JAB High authorized and is also pursing DoD CC SRG IL4 compliance.View our Moderate authorizationView our JAB High authorizationFederal Education Rights and Privacy Act (FERPA) Slack supports its educational customers and their unique compliance responsibilities. View our policyTrusted Information Security Assessment ExchangeScope-ID SHYV0T Assessment-ID AMHN37 TISAX and TISAX results are not intended for the general public.Request our resultsInformation Security Registered Assessors Program (IRAP)Slack has been assessed by an independent IRAP assessor against the requirements of the Australian Information Security Manual (ISM). Customers can contact their Slack Account team to request a copy of our IRAP report.IRAP Assessment LetterISMAPInformation System Security Management and Assessment Program (ISMAP)Slack was assessed for the Information System Security Management and Assessment Program (ISMAP), a Japanese Government program evaluating the security posture of cloud service providers. Slack's registration may be viewed on the ISMAP list of registered services.View our registrationFrequently asked questionsHow do we help you comply with the GDPR?We are committed to helping our customers and users understand, and where applicable, comply with the General Data Protection Regulation (GDPR). For more, please see our commitment page.Does the GDPR require EU personal data to stay in the EU?The GDPR does not require EU data to reside in the European Union. Slack’s Data Processing Agreement, and the European Union’s Model Clauses, will continue to ensure compliance for EU personal data transfers outside of the EU.How do we help you comply with the CCPA?We’re committed to helping Slack customers and users understand and exercise their rights under the California Consumer Privacy Act (CCPA). On this page, we clarify Slack’s role and obligations under the CCPA and provide additional information to help our customers meet their compliance needs.Do you have a Data Processing Agreement?Slack offers Data Processing Addenda that supplement the Customer Terms of Service or any MSA.Who are your Subprocessors?This page provides important information about the identity, location and role of Slack Subprocessors.Does Slack have a Modern Slavery Statement?Slack's Modern Slavery Statement can be found hereCan I request a copy of Slack’s SOC 2?Yes, you can make this request using our Privacy and Security FormDo you have additional resources for Security questions?We do! Please see our Security Whitepaper or visit our Security page for more information."
