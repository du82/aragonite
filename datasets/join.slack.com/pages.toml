["https://join.slack.com/developers"]
title = "Unlock your productivity potential with Slack Platform | Slack"
description = "Connect, simplify, and automate work."
full_description = "Use your custom functions, pick from pre-defined Slack functions, or combine both to get the automations you want. Our developer tools simplify the most tedious parts of development and ensure your automations are enterprise-grade from day one. Fast track development by creating, scaffolding, and deploying functions and apps from the command line. Streamline all your standard database operations by storing, querying and deleting data on Slack infrastructure. Block Kit lets you build interfaces without a UI designer. It's available for use in surfaces across all devices without any extra code. Version 3.0.0 of the developer tools for the Slack automations platform is here, with lots of goodies for you! We previously mentioned that we had deprecated the deno command and removed its listing from the help command. We have now removed the deno command completely. Developers who were depending on this command should now use the deno executable directly. We've also removed support for the deprecated, pre-release Deno Slack SDK versions that used slack.yaml and project.ts files. The Run-on-Slack platform no longer supports the slack.yaml file format, and no production projects should be affected. The project.ts file was deprecated by the Deno Slack SDK in favor of manifest.ts and manifest.json files. A new Block Kit block is now available for use! The markdown block accepts standard markdown and outputs formatted Slack markdown; intended for use in AI apps. The Data Access API is here! This API is now available in a limited release for interested partners. Use the Data Access API within AI apps to access all the relevant Slack data you need to ensure a pleasant user experience for AI apps."
