ilder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterWorkspace administrationWorkspace customizationCustomize member profilesCustomize member profilesSlack profiles make working together easier: members can share helpful details, like their time zone or job title, that others can see at a glance. With custom profiles, you can create new profile fields for any purpose to share even more details, like location, start date, social media profiles, and more. Tip: If you manage members with SCIM provisioning, you can ensure profile information never goes out of date by automatically syncing information in your identity provider (IDP) with Slack profile fields. Add custom profile fields Free, Pro, and Business+ plans Enterprise Grid plan Workspace Owners and Admins can add custom profile fields for all members of their organization. From your desktop, click your workspace name in the sidebar. Hover over Tools & settings, then click Workspace settings. Below Administration in the left sidebar, select Profiles. If you don’t see the left sidebar, click Menu in the top-left corner to find it. Click Add people or Add data element at the bottom of a section, then follow the prompts to include a Label, Placeholder text, and any further options for the field type. Click Publish Changes. Org Owners and Org Admins can add custom profile fields for all members of their organization. From your desktop, click your organization name in the sidebar. Hover over Tools & settings, then click Organization settings. Click Atlas in the left sidebar. Click Add people or Add data element at the bottom of a section, then follow the prompts to include a Label, Placeholder text, and any further options for the field type. Click Publish Changes. Note: Custom profile fields will appear 