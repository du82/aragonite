full_description = 'Enterprise Encryption Key ManagementKeep data flowing while minimizing risk with EKMTake complete control over access to your data and visibility at every step with Slack’s key management solution.Talk to salesWatch DemoWhat is Slack Enterprise Encryption Key Management?Watch videoBring your own keysWith Slack EKM, you use your own keys—stored in Amazon’s Key Management Service (AWS KMS)—to encrypt messages and files. Administrators can revoke key access granularly, so teams experience minimal disruption. They keep working as usual, and so does Slack.Sample message with Slack EKM in useproj-billingLisa ZhangOkay, I have some projections about how the new billing structure could affect revenue. This is based on the discussion between @Matt Brewer and @Sara Parras.2 repliesLast reply 3 minutes agoMessage #proj-billingPeace of mind for the security-consciousSlack EKM enhances the ability of organizations to share sensitive conversations and files on Slack while still meeting security requirements.Sample message with Slack EKM in useproj-billingLisa ZhangOkay, I have some projections about how the new billing structure could affect revenue. This is based on the discussion between @Matt Brewer and @Sara Parras.2 repliesLast reply 3 minutes agoMessage #proj-billing “Technology like Slack Enterprise Key Management is rapidly becoming a core requirement for enterprises of all sizes that need enhanced security of their collaboration environment. It becomes more important for enterprises to retain control of their encryption keys." Wayne KurtzmanResearch Director for Social, Communities and Collaboration, IDCKeep work flowing, securelyYour data stays protected while teams keep moving work forward.Visibility at every stepGet detailed visibility into how your keys are being accessed—usage of your keys to encrypt and decrypt messages and files in Slack is logged in AWS CloudWatch and CloudTrail.Granularly revoke key accessTo address security threats, administrators can revoke access in a very targeted manner. Access to messages and files can be revoked at the organization, workspace, channel, time-frame, and file levels.Keep collaborating in SlackThe Slack experience—from features to performance—remains the same. Teams can keep collaborating using all the Slack features they know best, even if access to some data is revoked.Secure enterprises collaborate on SlackMillions of people around the world use Slack to change the way they work together. Learn more about Slack for enterprise companiesLink may open in new tabWebinarWhat is Slack EKM?Watch replayLink may open in new tabBlogIntroducing Slack Enterprise Key ManagementLearn moreLink may open in new tabCustomer StoryManaging build and deployment processes with SlackRead storyLink may open in new tabWebinarWhat is Slack EKM?Watch replayLink may open in new tabBlogIntroducing Slack Enterprise Key ManagementLearn moreLink may open in new tabCustomer StoryManaging build and deployment processes with SlackRead storyAdd Slack EKM to your Enterprise GridContact sales'
