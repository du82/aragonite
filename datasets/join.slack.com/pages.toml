["https://join.slack.com/trust/data-request/transparency-report"]
title = "Transparency Report | Legal | Slack"
description = "Slack believes strongly in transparency and publishes reports about requests for data by law enforcement and governmental entities. View the latest report."
full_description = "Transparency ReportTrust navigationAdditional Policies PagesClose Legal NavigationGetting startedOverviewPrivacyPrivacySlack Privacy PolicyPrivacy FAQData RequestsData RequestsData Request OverviewData Request PolicyTransparency ReportComplianceComplianceCookie PolicySlack's GDPR CommitmentCalifornia Consumer Privacy Act (CCPA) FAQCCPA Metric DisclosureFERPA ComplianceSecuritySecurityOverviewData ManagementData ManagementTransparency and ControlPrivacy principles: Search, Learning, and IntelligenceLegalData ManagementLegal OverviewTo see the most recent report, please click here.At Slack we care deeply about maintaining the trust of our customers, as well as being as transparent as possible about government and third party requests for Customer data. As a part of this commitment, we publish periodic reports about requests for data by law enforcement and governmental entities. The latest report is below and covers all such requests from January 1 - December 31, 2021. More information about our policies and practices with respect to data (including definitions of terms not defined herein) can be found in the Slack Terms of Service, Privacy Policy, Security Practices, Data Request Policy and Data Request Overview.We abide by the following Guiding Principles:We are committed to maintaining Customer privacy and confidentiality.All legal process is carefully reviewed. Slack rejects or challenges any requests that have no legal basis or are unclear, overbroad, or otherwise inappropriate. Unless prohibited by law, Slack notifies a customer when it receives a request for that customer’s data, including a government request.Slack construes legal process as narrowly as possible.Wherever possible we encourage Customers and third parties to obtain relevant data without our intervention. We strongly believe that any government agency seeking access to customer data should address its request directly with that customer, where possible.Requests for information through legal processReporting PeriodType of requestNumber of requestsContent data and non-content data disclosedOnly non-content data disclosedUnited StatesJanuary 1 - December 31, 2021Search Warrants550Court Orders402Gov. Subpoenas22019National Security Requests000Non-US Entities Foreign requests pursuant to MLAT101 Definitions “Content data” Includes user generated data, for example public and private messages, posts, files and DMs. “MLAT” A Mutual Legal Assistance Treaty. Slack requires that a foreign government use appropriate international law process, such as through an MLAT, to obtain user data stored by Slack in the U.S. “National security requests” A National Security Letter issued under 18 U.S.C. § 2709, a Court Order issued under the Foreign Intelligence Surveillance Act or any other classified request for user information issued in the US. “Non-content data” Basic account information (such as name and email address, registration information, login history and billing information) and other non-content metadata (such as the date, time, and sender/recipient of messages or files). “Search warrant” An order issued by a judge or magistrate upon a finding of probable cause. A search warrant is required to obtain the content of communications. “Law Enforcement Subpoena” A compulsory demand issued by a governmental entity for the production of documents or testimony in a criminal case (such as grand jury subpoenas or administrative subpoenas) Previous versions of this report can be found in our Archives.Updated June 2, 2022."
