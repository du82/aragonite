full_description = "Working with cybersecurity and enterprise SaaS companies, through board service, advising, and investing. Previously, I was the co-founder and CTO of Duo Security. Prior to Duo, I completed my PhD at the University of Michigan. I love working with cybersecurity and enterprise SaaS companies, through board service, advising, and investing off my own balance sheet. Jon Oberheide is a board member, advisor, and investor, focused on working with cybersecurity and enterprise SaaS companies.Previously, Jon was the co-founder and CTO of Duo Security, with a mission to democratize security by making it easy and effective. Over 12 years, Duo scaled from zero to over 30,000 customers, $500M ARR, a 70+ NPS, and 1000 FTEs. Along that journey, Duo was acquired by Cisco for $2.4B.Prior to founding Duo, Jon was a security researcher and completed his BS, MS, and PhD at the University of Michigan in cybersecurity."
