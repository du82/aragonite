title = "Uses – Jonathan Bossenger"
description = "I've been building PCs since high school, even though back then they were made up of whatever I could find in bargain bins or second-hand. Computers are the tools I use to earn a living, support my family and pay for my hobbies, two of which also involve computers. This page lists what my current…"
full_description = "Uses I’ve been building PCs since high school, even though back then they were made up of whatever I could find in bargain bins or second-hand. Computers are the tools I use to earn a living, support my family and pay for my hobbies, two of which also involve computers. This page lists what my current setups are. Daily driver – Custom Workstation In May 2024, I built a new custom workstation with hardware comparable to a Mac Studio M2 Ultra. It runs Ubuntu LTS (currently 22.04.4 until 24.04.1 is released) with a Windows 11 dual boot option in case I need Windows for work purposes. I hate that it has RGB, but this seems to be the norm lately. Intel Core i7-14700K 3.4 GHz 20-Core Processor ID-COOLING FX360 Liquid CPU Cooler Gigabyte Z790 EAGLE Motherboard Corsair Vengeance 32 GB DDR5-6400 RAM TEAMGROUP 1 TB NVME Solid State Drive Zotac GeForce RTX 4070 Ti SUPER 16 GB Video Card Montech SKY TWO ATX Mid Tower Case Daily driver Travel/remove work – 14-inch MacBook Pro (Apple M1 chip) Since I joined Automattic, my new daily driver laptop has been a company-sponsored 14-inch MacBook Pro with the new Apple M1 chip. This laptop is a beast, and while I still don’t like macOS, the new Apple hardware is impressive. Since I got the new workstation, I use the laptop mostly for video recording, remote working, and travel. Apple M1 Pro chip with 10-core CPU & 16 core GPU 32GB unified memory 1TB SSD Gaming – Asus ROG Ally In 2023, I sold my home gaming PC and replaced it with the ROG Ally. I rarely use a PC at home anymore besides gaming, and I much prefer gaming wherever I want to on the ROG Ally. AMD Ryzen Z1 Extreme Processor AMD Radeon Graphics 7-inch 1080p screen 16GB LPDDR5 RAM 512GB NVMe SSD Personal Home Workstation Custom-built as a new workstation in Dec 2020. I don’t use this as my daily driver anymore. but I still have it hooked up in my office if I ever need to access Ubuntu, Windows, or for gaming. During the course of 2022, I doubled the RAM to 32GB, and in Jan 2023, I upgraded the graphics to an RTX 3060. Since building the new 2024 workstation, it resides at my house as a family computer, mostly used by my growing boys. AMD Ryzen 5 3600 CPU Asus TUF GAMING B550M-PLUS (WIFI) Motherboard 32GB 16GB Corsair VENGEANCE LPX DDR 4 RAM Palit GeForce RTX 3060 12GB Graphics Card Gigabyte GeForce GTX 1660 Ti OC 6GB Samsung 970 EVO Plus 500GB NVMe SSD 2 x WD Blue 1TB 3.5″ SATA Storage Drives Cooler Master MWE GOLD 650W ATX PSU Cooler Master Masterbox K500L ATX case"
