["https://jonathanbossenger.com/smg-century-city-terrible-customer-service"]
title = "SMG Century City: A tale of terrible customer service – Jonathan Bossenger"
description = "I am publishing this in response to a reply on a review I posted about my experiences of poor custom service from SMG Century City. Perhaps someone from SMG Century City will take the time to read my complaint if it is posted publicly. I have included as many screenshots of conversations and emails as…"
full_description = "SMG Century City: A tale of terrible customer service I am publishing this in response to a reply on a review I posted about my experiences of poor custom service from SMG Century City. Perhaps someone from SMG Century City will take the time to read my complaint if it is posted publicly. I have included as many screenshots of conversations and emails as possible, because there are just so many, too many in fact to have to wade through. Last October, I saw an Auto Trader ad for a 2020 VW Tiguan at SMG Century City. I was in the market for a Tiguan, so I arranged a test drive with my wife. The salesman in the following emails met with us for the test drive. During the test drive, I tried the steering wheel paddle shifter and discovered I couldn’t gear up. The salesman told me this was because I wasn’t revving it enough. I didn’t know much about how paddle shifters work, so I took his word for it. After discussing it with my family we decided to take another look at the car, coming through on a Saturday. While checking it out, my wife saw some red pieces of something in between the gear level panels/and on the side of the chair (possibly makeup or crayon). We also saw that the front interior light panel was loose, along with a few other issues. I sent an email to the salesman about these issues: The interior panel becomes important later. The salesman assured us these could be fixed, and we decided to proceed with the sale. During this process, I asked the salesman if SMG offered any warranty for any faults we might find on the the car after the purchase,and he indicated that there was a 6-month/2000 km warranty. He also assured me that the car had gone through all sorts of checks and diagnostics, but if anything went wrong, to let him know and it would be sorted out. During the first few weeks after taking possession of the car, I picked up a few additional issues. One cup holder was broken. The paddle shifter was definitely not working correctly Additionally, a few days later I detected there was a rattle coming from the left front dashboard area when I drove on roads outside of Durbanville. I mentioned these to the salesperson, and he asked me to bring the car in to SMG. After checking the car out, the SMG technicians couldn’t find the rattle. I had explained that it happened only in and around Durbanville, on certain roads, and on a trip from my house to Melkbos, but since the SMG technicians couldn’t replicate it, they couldn’t fix it. In terms of the paddle shifter, they confirmed that there was an issue and they would have to source a part to get it fixed. So I should take the car while they did the research, and then when I bring the car back to get it fixed, they’d sort out the cup holder. A few days later, the salesperson contacted me. On investigation, they discovered that the paddle shifter problem needs to be taken care of by VW, as it falls under the maintenance plan on the car. I said I would take it to my local VW workshop, Barons in Bellville. I also asked him if I should mention the rattle and cup holder, and he said I could and for Barons to send the quote to SMG. He also asked me to let him know who the service agent is at Barons, and he would follow up on things for me. Once I got the car to Barons, the service rep indicated that the maintenance plan doesn’t cover the rattle or cup holder. Determining the cause of the rattle would cost a R1350 diagnostic fee, and he would have to quote for the cup holder. So I immediately messaged the salesperson with this information. His response was that they should deal with it. So now I’d have to take it back to SMG for that. He also said that SMG would sort out the cup holder. Barons discovered that the entire steering wheel was faulty and needed to be replaced. As there were no steering wheels in the country, one had to be ordered, and I’d have to wait about a month. During this time, I also had to have a second set of temporary plates put in because the original license papers for the car were still at the bank. The salesperson also promised he’d send the spare key which I did not yet have with the second set of plates, which he did not. After emailing about the fact that I could replicate the rattle, the salesperson arranged to take the car back to SMG, for a drive with his manager, for him to hear the rattle. I explained that I could not replicate it around Century City area, but I can in my suburb of Durbanville, or on some of the roads between Durbanville and Malmesbury, and Melkbos, which are older roads, but you can drive at higher speeds (around 100km/h). I also explained that if you drive over the cat’s eyes on the highway at a highway speed, you can hear the rattle. During the drive in and around Century City, the manager did not replicate the rattle. When I said for him to drive at speed on the cats eyes, he said, “The cat’s eyes are quite harsh on a car”. When I explained it happens on the road between the N7 and Melkbos, he said” “That’s quite a bad road.” “The speed limit’s not 100 on that road.” (it is) A comment was also made about the age and mileage of the car, and that it was in really good condition for a car of that age and mileage. I said that might be the case, but my 2017 VW Golf that I drove before the Tiguan, with over 120000km, didn’t have any dashboard rattles. As much as I try to explain, I feel I’m not being heard. After losing my temper a little during that drive and pointing out that had the car been in for diagnostics, as the salesperson kept saying, then why did they not pick up the steering wheel, the manager looked under the car. He found a loose panel under the engine and had it fixed. However, when I get home and test it on the road I had heard before, it is still there. At this point, I record two videos of the rattle, and I email the salesperson and invite anyone from SMG to meet me at my house as I can replicate the rattle not 10 minutes from my house. https://www.youtube.com/watch?v=ERSqzTkNV9k https://www.youtube.com/watch?v=njGaS2UgW2Y The salesperson emails back incorrectly indicates that VW has tested it, and heard nothing. This is incorrect, as I’d already asked about getting VW to run the diagnostic, and the salesperson declined that option. (See earlier WhatsApp message)He suggests that VW should take care of the rattle under the maintenance plan, and that I will need to take my car to someone else for the cup holder. I email back to clarify the incorrect information (about Barons doing a diagnostic, after taking a trip to Barons to confirm the information given about the rattle not being covered by the maintenance plan). After chatting with his manager again, the salesperson again suggests a weekend drive to hear the rattle. I indicate when I am available for the second drive. Then I get no response. The only email I do receive has the subject line “Plates please [Vehicle Reg] – [Name] – Vehicle needs Roadworthy”. By this time it’s the school holidays, and I’m getting ready for a planned trip to Hermanus. During a trip from Hermanus to Gaansbaai, the rattle persists. Additionally, on a trip to Langebang, the rattle is still there. As I’ve tried to explain to the salesperson countless times, it’s on the older roads at higher speeds (100km/h) that it can be heard. Then, at the start of the year, I take my family to Newlands Stadium for a cricket match and return to my car. The front interior light panel, supposedly fixed in October, is falling apart. Pieces of plastic have just fallen off the panel. Another email to the salesperson listing the continuing rattle issue, the still outstanding cup holder, and now the interior panel. This time, he asks me to bring the car in for up to 3 days to sort out the rattle and ignores the other items I’ve mentioned. During that week I also had to take the car back to Barons to have the steering wheel replaced. So far I have had to take 2 trips to SMG, 2 trips to Barons, taking me out of work because of a complete lack of any pre-sales checks on the vehicle that could have prevented all of this. I am entirely convinced that no checks were done on this car and that it was advertised for sale as soon as it was traded in. There are so many unanswered questions. If any presales checks were done, why were the issues I found not picked up? Why is it that the salesperson offered to drive the car out to me for a test drive, but is not prepared to drive out to me to hear the rattle. When asked about the paddle shifter during the test drive, why did the salesperson essentially lie to me about it? Why did SMG not know that the paddle shifter would be taken care of under the maintenance plan? I could have gone straight to Barons in Bellville instead of wasting my time at SMG. Why were the license papers still with the bank, when the car was already sold to me? And why did it take so long to get the spare key? At this stage, I am very frustrated with SMG’s lack of service. So I decide to email their Customer Relationship Manager, detailing these issues: I receive no response, so I send a follow up email the next day, and still no response. Finally, I post a 1 star Google Review, hoping that someone will take notice. https://maps.app.goo.gl/L7ChufVym48v9RPt9 Their response is to completely ignore my complaint, repeating incorrect information about the rattle and the maintenance plan, as well as the lack of follow through about the drive. So as the customer, I’m expected to email, but no one is prepared to reply. I’ve since sent another email to the Customer Relationship Manager, again, with no response. Update 2025-02-18 21:26: I’ve also posted a second review, replying to the first and pointing out the inaccuracies. To date, no reply to that review. Update 2025-02-19 10:56: I finally received a call from the Customer Relationship Manager this morning. She followed up with their IT team and it looks like my emails were sent to quarantine for some reason. Not sure why suddenly, maybe marked as spam due to the number of emails sent? We have arranged to meet next Tuesday at 10:30 am to discuss and get this sorted out. Share this:Click to email a link to a friend (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Like this:Like Loading…"
year_published = 2025
year_updated = 2025
