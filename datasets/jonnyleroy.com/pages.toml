["https://jonnyleroy.com/2007/04/23/gtd-with-outlook"]
title = "GTD with Outlook – Making things better"
description = "Jonny LeRoy's writings on technology and society"
full_description = "Posted on April 23, 2007January 4, 2018 by jonnyGTD with Outlook I’ve been looking at the Getting Things Done process for organizing all your tasks and projects for a little while now. Though I’ve only just bothered to pick up the book, rather than just guessing what’s in it via hints from other websites. I’ve been trying to apply some of the principles to how I deal with work emails and have come up with a technique that’s been working pretty well since January, so I thought I’d share it. A posting on Getting Things Done with Gmail started me off thinking about this. At the client I’m working for at the moment they use Outlook (I’ve used it for many years and am intimately familiar with the good and bad in it) so I’ve had to work with the tool in hand. I much prefer working with gmail, or before that the Opera mail client, which was probably the best I’ve used, since they have a simpler ability to tag / label mails in multiple ways, but if you combine a few tricks in Outlook you can get to a reasonable solution. Preparation Decide Flag Colors: Blue = action Red = action with reminder / deadline Purple = delegated Green = reference Orange = deferred (I don’t like too many red flags because they scare you and make you angry when you look at the list of things to do â€¦) Create Project Folders: Create sub-folders in your inbox named by each project or logical / thematic grouping of your work Create Search Folders File >> New >> Search Folder Create a custom search folder >> choose Add name (Action, Deferred, Delegated, Reference) Criteria >> Advanced >> Field >> Frequently Used >> Flag color Condition: “equals”, Value: “<color> Flag” (insert color here) “Add to list” Repeat last 3 steps if you want more than one color in a bucket (I have blue and red both in Action) “OK” >> “OK >> “OK Right-click newly created search folder “Add to favorite folders” Phew! Empty your Inbox Aggressive deletion / archiving Move emails to sub-folders Use date, conversation and sender groupings to help Ongoing Process Dealing with Inbound Mail Deal with the mail if possible Delete it if you don’t need it Move to sub-folder if you don’t need any follow-up Flag it if you do Action by date: Red + reminder Action: Blue Delegated: Purple Deferred: Orange Reference: Green Move it to subfolder Keep the inbox empty Following Up Use the favorite folders (Action, Deferred, Delegated, and Reference) to find what work you need to do. When you’ve dealt with an item change its flag: No more actions >> remove flag, or green flag (reference) Delegate >> Purple Etc I find it useful to group / order the favorite folders by “In Folder”, but date is also useful Err, that’s it CategoriesProcess"
