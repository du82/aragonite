["https://jonnyleroy.com/2013/07/19/evolving-for-multiple-screens-video"]
title = "Evolving for multiple screens (Video) – Making things better"
description = "Jonny LeRoy's writings on technology and society"
full_description = "Posted on July 19, 2013January 4, 2018 by jonnyEvolving for multiple screens (Video) Here’s a video of a recent talk I gave with my colleague Stew Gleadow in Sydney and Melbourne in Australia at our ThoughtWorks Live event in May. It looks at strategies for successfully evolving mobile services and applications over time across a range of screens and platforms. We delve into some case studies on an Australian broadcaster’s second-screen application and a cross-platform approach for a major airline. CategoriesMobile"
