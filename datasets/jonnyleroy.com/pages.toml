title = "Agile circle of love – Making things better"
description = "Jonny LeRoy's writings on technology and society"
full_description = "Posted on May 29, 2008January 4, 2018 by jonnyAgile circle of love Have you ever noticed how teams who are new to Agile often struggle if they attempt to adopt just one or two of the XP practices? And have you noticed how the solution is often to introduce more practices? I had been developing a theory about the interdependence of various software development practices when I got the chance to work through some of these ideas in a session I facilitated with some fellow ThoughtWorks colleagues. We uncovered some interesting connections and an important positive feedback loop that is worth being aware of when trying to help teams adopt Agile. The session happened at least a year ago, but I’ve only just been prodded into posting the output. CategoriesProcess"
