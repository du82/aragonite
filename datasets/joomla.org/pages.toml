full_description = '''Contact for Press and Media only Welcome to the Joomla! Media Contact Form. Please select from the below list the reason you are contacting us today, so we can provide the correct form for you. This form is strictly for Media queries. Please do not use it for support requests or general questions about Joomla. These requests won't be answered. Why are you looking to contact us?(*) -- Please Select --Looking to get in touch with the Media & Marketing teamI need support for my websiteI have trouble with my administrator loginI'm looking for Joomla expertsI'm looking for tutorialsI have issue with an extension I found a bug in Joomla Core Invalid Input Your Name(*) Please let us know your name. Your Email(*) Please let us know your email address. Subject(*) Please write a subject for your message. Message(*) Please let us know your message. (*) I consent to Joomla.org collecting and storing my data through this form. Read our Privacy Policy In order to submit this form, you'll need to offer your consent. For support with your website, you can ask for help at the Joomla! Forum Or checkout the Joomla! Documentation Please report any bug you may find on the Joomla! Issue Tracker. Please follow the "How do you recover or reset your admin password" guide in our documentation. If you require additional help, please use the Joomla! Forum. You can find Joomla experts at our Joomla! Resources Directory You can find a whole range of documentation in our documentation wiki and tutorials at the documentation wiki's beginners portal We suggest that you contact the extension developer. If you have an issue the developer cannot resolve you may report the extension at the Joomla! Extensions Directory (*) Please complete the captcha Send Media Alerts & Press Releases Joomla's Brochure'''
