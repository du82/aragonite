["https://joomla.org/announcements/general-news/5773-yoyow-foundation-becomes-a-platinum-global-sponsor-of-joomla.html"]
title = "YOYOW Foundation Becomes a Platinum Global Sponsor of Joomla!"
description = "The YOYOW Foundation has become a Platinum Global Sponsor of Joomla."
full_description = "General News YOYOW Foundation Becomes a Platinum Global Sponsor of Joomla! Details Created: 08 July 2019 facebook twitter linkedin pinterest The YOYOW Foundation has become a Platinum Global Sponsor of Joomla. As for the number of users and daily visits, Joomla is currently the second-ranked CMS in the world. Currently, millions of websites are using Joomla to build websites. Joomla-based websites carry a large amount of user traffic. The YOYOW Foundation will cooperate with the Joomla Community and Open Source Matters, Inc. (The organization behind the Joomla Project) to promote the development of websites and applications that use the YOYOW network both in the Joomla Community and the YOYOW community. The YOYOW Foundation is also looking for more opportunities to collaborate with the Joomla Project and other Partners to increase the adoption of Joomla and simplify the access to the YOYOW network. The cooperation between YOYOW and Joomla for this time will further increase the international influence of the YOYOW project and promote the development of both sides. About Joomla Joomla is a free and Open Source Content Management System (CMS) for publishing web content. Over the years Joomla has won several awards. It is built on a Model-View-Controller web application framework that can be used independently of the CMS and allows you to build powerful online applications. Joomla is used all over the world to power millions of websites of all shapes and sizes, having been widely used by enterprises, governments, and individuals to build web applications. Joomla has thousands of free extensions and templates allowing users to customize their sites to fit their specific needs. It is one of the most popular website software since the platform is user friendly, extendable, multilingual, accessible, responsive, search engine optimized and so much more. About YOYOW YOYOW, an acronym of “You Own Your Own Words”, aims to build a blockchain network that uses blockchain technology to quantify the contribution and provide rewards for the content production area using a decentralized consensus approach, enabling content producers, content investors, content filterers and ecology facilitators to get reasonable incentives and rewards. HomeNewsGeneral NewsYOYOW Foundation Becomes a Platinum Global Sponsor of Joomla!"
