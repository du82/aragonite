full_description = "About the Joomla! Project The Joomla! Project is a community-based project with contributors from all over the world working in many different capacities. Departments The Joomla! Project is organized into six Departments. These groups utilise the wealth of knowledge our community provides. Each of these groups focuses on a specific aspect of Joomla! essential to the project's growth and development. Each department has a leadership team and together they form the Board of Directors. Hundreds of volunteers participate in the teams forming Joomla! Departments. You can find out more about these teams on the Volunteers Portal. Project Leadership The Joomla! Project is governed by the Board of Directors of Open Source Matters, Inc., a not-for-profit created to provide organization, legal, and financial support to the Joomla! Project. This leadership team nurtures all critical aspects of the Joomla! Project to ensure its continued existence, relevance, and integrity. Open Source Matters provides the necessary foundation for the Joomla! Project to receive donations, develop partnerships, retain copyrights and trademarks, and protect the individual contributors from unnecessary legal exposure. Software License The Joomla! software and default templates are copyright 2005-{source}<?php echo date('Y'); ?>{/source} Open Source Matters, Inc. If you want to use, copy, modify or distribute Joomla, you may do so under the terms of the GNU General Public License. If you are unfamiliar with this license, you might want to read the GNU General Public License FAQ."
