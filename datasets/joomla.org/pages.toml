["https://joomla.org/announcements/release-news/5917-joomla-5-2-1-security-release.html"]
title = "Joomla 5.2.1 Security Release"
description = "The Joomla! Project is pleased to announce the release of Joomla 5.2.1 Security Release."
full_description = "Release News Joomla 5.2.1 Security Release Details Created: 07 November 2024 facebook twitter linkedin pinterest The Joomla! Project is pleased to announce the release of Joomla 5.2.1. This is a security release for the 5.2 series of Joomla.. This release continues Joomla’s high standards in accessible web design, highlighting Joomla's values of inclusiveness, simplicity and security into an even more powerful open-source web platform. Security Fixes Fixing the file permissions for new installations. Due to a packaging error when building the 5.2.0 release, new installations had default file permissions which were too permissive. All files and folders in a new installation had the permissions set to 777, where 755 for folders and 644 for files would have been correct. This might make the installation vulnerable on specific hosting setups. This issue does NOT affect updates to 5.2.0 of existing Joomla sites, as during the update process, Joomla already automatically sets the permissions correctly, overwriting permissions in the archive. For sites created with the affected 5.2.0 packages, an automated solution updating the permissions of affected files and folders will be shipped with the next regular 5.2.x release. Site owners can either wait for that release or update the permissions manually. Where can I download Joomla 5.2.1? On the Downloads site, of course :) New Installations New installation instructions and technical requirements Install 5.2.1 Upgrade Upgrade 5.2.1 Who is Joomla! for? Web agencies, large and small companies, online shops, bloggers, communities, and all kinds of organisations (for example, NGOs, schools, charities and governments) all use Joomla as their preferred CMS. Joomla is written by committed volunteers. Many of those volunteers use it in their everyday web design, building and hosting. So, unlike many other systems, Joomla is built by those using it on a daily basis. That is reflected in its secure, robust nature. Is there help for extension developers with Joomla 5? Yes, a growing manual is aimed at those who code and maintain their extensions. The manual can be found at https://manual.joomla.org/migrations/44-50/ and is a growing work to help developers get ahead of any changes. How can you help develop Joomla? There are a variety of ways in which you can get actively involved with Joomla. It doesn't matter if you are a coder, an integrator, or a user of Joomla. You can join the community on Mattermost and look through the teams to join, or if you are ready, you can jump right into the Joomla! Bug Squad. The Joomla! Bug Squad and the CMS Release Team are some of the most active teams in the CMS development process and are always looking for people (not just developers) who can help with sorting bug reports, coding patches and testing solutions. It is a great way to increase your working knowledge of the Joomla code base and also a great way to meet new people from all around the world. You can also help Joomla development by thanking those involved in the many areas of the process. The Project also wants to thank all the contributors who have taken the time to prepare and submit work to be included in the Joomla CMS and Framework. Where can I find documentation about Joomla 5? There are some tutorials to help you with Joomla 4. You can find the existing ones, like creating a Plugin or a Module for Joomla 4, namespaces conventions, prepared statements, using the new web asset classes and many more in https://docs.joomla.org/Category:Joomla!_5.x We encourage developers to help write the documentation about Joomla 5 on docs.joomla.org to help and guide users and other extension developers. A JDocs page will help developers to see the existing documentation and the documentation still needed. We invite you to check it regularly, update it and provide the missing content. Related information If you are an extension developer, please make sure you subscribe to the extension developer channel https://joomlacommunity.cloud.mattermost.com/main/channels/extension-development-room Where you can join the community of extension developers. Filing bugs and issues General developer mailing list Joomla developer network A Huge Thank You to Our Volunteers! A huge shout out to our teams, who have done such an amazing job. In particular, the CMS maintenance team, CMS release team, docs team and Marketing team all did their utmost to make this release happen. Thank you all. Translations Dutch: Veiligheidsrelease Joomla 5.2.1German: Joomla! 5.2.1 als Sicherheitsupdate veröffentlichtFrançais / french : Joomla 5.2.1 version de sécuritéPolish: Joomla! 5.2.1 - poprawka zabezpieczeńRussian: Вышел релиз безопасности Joomla 5.2.Turkish: Joomla! 5.2.1 Güvenlik Sürümü HomeNewsRelease NewsJoomla 5.2.1 Security Release"
author = "Tom van der Laan"
year_published = 2024
