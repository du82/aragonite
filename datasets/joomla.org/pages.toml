["https://www.joomla.org/about-joomla/partners.html"]
title = "Discover the Joomla! Partners"
description = "Discover the Joomla! Partners 123RF, Algolia, AppVeyor, Civic, CleanTalk, CloudAccess.net, Crowdin, Elastic Email, GitHub, Glip, hCaptcha, Hosting.de, JetBrains"
full_description = '''Joomla! Partners 123RF As a leading global stock content provider of high quality commercial and editorial photos, vectors, videos and audio clips; 123RF empowers professional web developers and designers with the most inspiring visuals in their quest to develop outstanding websites. Being the main sponsor for this year’s JWC15, 123RF pledges to give back to the web community by partnering with Joomla and thus, providing the Joomla Community the opportunity to enjoy the affordable convenience of accessing legally licensed visual stock content that's friendly on the budget. Algolia Algolia is the single best way to build search into your mobile app or website. Founded in 2012, Algolia’s mission is to enable every developer & product team to build consumer-grade search. With their hosted search API, developers benefit from the power of a lightning-fast engine with out-of-the-box support for a typo-tolerant, as-you-type search experience. AppVeyor AppVeyor is providing Joomla with fast and easy to use Continuous Integration service to help Joomla developers with delivering the perfect code. Join thousands of Windows and Linux developers running their tests with AppVeyor! Free for open-source projects. Civic Civic, Joomla Official Cookie Partner.We’re an award winning digital solutions provider with almost two decades of industry leading experience. We help businesses succeed through effective, usable technology by combining our expertise in user experience design, development and hosting to provide digital solutions that work. Our reputation is built on customer service, innovation, value for money and market-leading expertise. We continue to work on high profile, creative, technically complex projects, and help our clients improve the services delivered to their users. CleanTalk CleanTalk is a SaaS spam protection service for websites. CleanTalk uses protection methods which are invisible for site visitors. CleanTalk analyzes user behavior and evaluates the parameters of a completed form. When installed on your site the anti-spam module captures the behavior parameters of the visitor or spam bot. These parameters are assessed and the service makes a decision - to post a message or to define it as spam and reject. On the basis of such checks, the service forms its own list of IP/email addresses used by spam bots. Likewise the visitor registrations are checked. The service adds not only email addresses to the blacklist but also IP addresses and domains of the websites that are promoted through spam mailout. CloudAccess.net Started in 2010, CloudAccess.net conceived and built the original 30 day demo program for Joomla.org. The newly founded demo program was utilized by hundreds of thousands of new Joomla users and provided otherwise untapped revenue stream for OSM and the Joomla project. Despite the demo contract expiration, to this day, CloudAccess.net remains a significant source of revenue. On top of their ongoing support, CloudAccess.net provide value to the Joomla community in various ways: CloudAccess.net is the official partner for the launch.joomla.org platform. For years, employees have been encouraged and paid to work on Joomla Project tasks during company time CloudAccess.net provides Free Joomla Hosting which allows anyone to build and host a fully functional Joomla site at no cost Sponsoring and attending various events around the world CloudAccess.net will continue to embrace their Joomla lineage by growing their innovative Joomla hosting services. Codium.ai CodiumAI offers a comprehensive tool suite designed to enhance code integrity and developer productivity across the entire software development lifecycle. Our flagship product, Codiumate, generates in-depth code behavior analysis and testing at the unit and component levels. With advanced org-level codebase context awareness, Codiumate significantly improves the quality of test generation and behavior analysis. Additionally, our PR-Agent streamlines the code review process by providing real-time feedback and identifying missing tests, ensuring higher code quality before merging. Our platform integrates seamlessly with popular IDEs and Git platforms, offering proactive features and best practices tailored to enterprise needs. Crowdin Crowdin is a young, fast growing IT R&D company, based in the Ukraine. Staying the one product company Crowdin strives to shake up the industry by providing new generation localisation platform that actually simplifies and accelerates the translation and localisation process.Being the first online, cloud based, TMS (Translation Management System) and CAT (Computer Aided Translation) tool at the same time, Crowdin continue to revolutionise the translation process. Founded in 2009 Crowdin quickly became profitable and stays a privately held, self funded company. The company’s goals and improvement direction is driven not only by growing and dynamic market requirements but also by truly passionate team and a desire to revolutionise. Crowdin,Joomla Official Translation Partner, ensures that Joomla! can translate all the core language strings, marketing materials, official extensions, websites and templates. Elastic Email Elastic Email is a reliable, fast growing all-in-one email delivery platform based in Canada. Our goal is to create a complete set of tools that make all aspects related to email marketing easy. We offer an SMTP Relay, robust HTTP API, and a User Interface that has a complete suite of features for managing contacts, templates, campaigns, and reports. Our specialization is delivering transactional and marketing emails in an efficient and hassle-free way. Among various integrations we have, we also provide a dedicated extension for Joomla called "Elastic Email Sender". GitHub GitHub is a web-based Git repository hosting service. It offers all of the distributed version control and source code management (SCM) functionality of Git as well as adding its own features. It provides access control and several collaboration features such as bug tracking, feature requests, task management, and wikis for every project. GitHub offers both plans for private repositories, and free account which are commonly used to host open-source software projects. As of April 2016, GitHub reports having more than 14 million users and more than 35 million repositories, making it the largest host of source code in the world. GitHub is used by different Joomla! teams to maintain, update and correct its core code and issues reported on web properties. Communication is transparent among these teams working on several important tasks. hCaptcha hCaptcha is a privacy-focused online security service. Ad networks see your visitors as the product. hCaptcha doesn't care who your users are, only how likely they are to be malicious. It is an API-compatible replacement for reCAPTCHA. We work to give you real data and let you decide how to use it. Sophisticated machine learning models are used to determine humanity. This lets us require less annoying tasks from users and take less of their time in doing so. hCaptcha enterprise solutions provide additional features like total customization of the user experience, and currently protect millions of users across tens of millions of websites. Hosting.de There are many hosting providers – but hosting.de is different. For 15 years the expert in the ISP industry has offered professional services for professional users. From Web Hosting to server clusters, hosting.de creates trendsetting solutions: not from the provider’s viewpoint but from the client’s one. You benefit from maximum performance and flexibility and an unique API-First concept. Our Partner Hosting.de provides our CI setup for Pull Request and quality testing of the Joomla Core. JetBrains Here at JetBrains, we develop the tools relied on by developers to create some of the world's most advanced software. With over 15 years of cutting-edge innovation, we have strived to implement the features top performing development demands. Our IDE packages help you to work faster by automating common, repetitive tasks, enabling you to stay focused on code design and the big picture. We provide tools to explore and familiarize yourself with code bases faster and make it easy for you to take care of the code quality through all the stages of development so you can spend less time on maintenance tasks in the future. LinkResearchTools (LRT) LinkResearchTools (LRT) is an advanced backlink analysis software that combines link data from 25 data sources, recrawls and scores all link by risk in a consistent, reliable way for providing enterprise-level SEO tools for backlink analysis, competitor research, link prospecting and outreach as well as critical technical SEO analysis and Google penalty recovery functions. LRT provides data that users can trust due to “just-in-time” recrawling and industry-leading custom SEO data technologies and metrics like LRT Power*Trust™, Link Detox Risk®, Link Velocity Trends™, Link Detox Genesis®, Link Redirect Trace™, TitleRank™ and Keyword Intelligence to name a few of the unique data metrics. LinkResearchTools supports all countries and languages. SEO training and a certification program to qualify key users as LRT Certified Professionals and Certified Agencies to provide best-in-class service to their clients. We are pleased to partner with The Joomla! Project by providing them a LinkResearchTools account and related training services to help find toxic links their backlink profiles and improve their overall link structure for internal and external links. OSTraining OSTraining, Joomla Official Training Partner, is the market leader in training for Joomla. Beginning in 2008 with live classroom training in the US and Europe, OSTraining expanded into online video training in 2010 and now has more than 2,700 training videos in its library. Its comprehensive training curriculum takes the student from an absolute beginner to an expert. Over 100,000 students across the world have taken OSTraining’s video classes. Renderforest Renderforest is an all-in-one branding platform. Since 2014, it has been transforming the industry of automated video production by offering ready-made, customizable video templates. Enhanced by AI and Machine Learning algorithms, Renderforest took broadcast quality video production to a new level. Now, it offers a full package of branding tools, including a logo maker and website builder. Report URI Report URI is a real-time Application Security and Health Monitoring platform. A modern web browser can send you all kinds of telemetry so you can make sure that things are running smoothly. Every visitor to your website can notify you of potential security issues, problems with DNS, TCP, HTTP, TLS and more! All of this with no code to deploy and no burden placed on your users, this is native browser functionality available in all the mainstream browsers. Get started today for free at report-uri.com! Rochen Ltd Founded in early 2000, Rochen has focused on providing extremely reliable web hosting solutions for over half a decade. Rochen is not only the hosting partner for the official Joomla Web site, but they were also nominated alongside Joomla as a finalist in the category of Best Linux/Open Source ISP/Internet Host at the LinuxWorld Expo Awards held in London, UK in October 2005. As well as hosting thousands of websites powered by Joomla Rochen also offer a complete range of web hosting services from shared and reseller hosting plans all the way up to fully managed dedicated servers and clusters. Rochen and their team have been instrumental in getting the Open Source Matters (OSM) and Joomla websites off the ground, providing us with the managed cluster of servers that we now use. To find out more about Rochen and the web hosting services they offer please visit: www.rochen.com. Screaming Frog Screaming Frog are a search marketing agency that develop industry leading SEO software, trusted by thousands of SEO agencies worldwide for technical SEO audits. The Screaming Frog SEO Spider is a website crawler, that allows you to crawl websites' URLs and fetch key elements to analyse on-site SEO. It will help find broken links, audit redirects, analyse the structure of the site, review robot directives and much more. The SEO Spider is free for crawling up to 500 URLs, or a licence can be purchased for additional features. The Screaming Frog Log File Analyser allows to upload raw log files and analyse search bot behaviour for invaluable SEO insight. It's free for 1,000 log events, and you can purchase a licence for additional features. We are pleased to partner with The Joomla! Project by providing them SEO Spider licenses to help them run their project websites more efficiently. Software Freedom Law Center (SFLC) The Software Freedom Law Center provides legal representation and other law related services to protect and advance Free and Open Source Software. They have been instrumental in providing legal guidance as the Joomla project grows and advances. UptimeRobot UptimeRobot is a world's leading uptime monitoring service that provides uptime monitoring of websites, servers, web services, and SSL certificates. It helps to minimize the downtime by sending various alerts to more than 800,000 users and companies. We are happy to partner with Joomla! and support them with a reliable monitoring service. See also Joomla Extension Partners We would like to thank those individuals and businesses that are actively supporting the Joomla project. Partnering with Joomla! If you or your business are interested in sponsoring Joomla, please send an email to This email address is being protected from spambots. You need JavaScript enabled to view it.'''
