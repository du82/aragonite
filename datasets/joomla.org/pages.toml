["https://joomla.org/announcements/general-news/5831-scalahosting-becomes-a-platinum-global-sponsor-of-joomla.html"]
title = "ScalaHosting Becomes a Platinum Global Sponsor of Joomla!"
description = "Open Source Matters Inc, the organisation behind Joomla!, and ScalaHosting are pleased to announce their strategic partnership."
full_description = 'General News ScalaHosting Becomes a Platinum Global Sponsor of Joomla! Details Created: 24 December 2020 facebook twitter linkedin pinterest Open Source Matters Inc, the organisation behind Joomla!, and ScalaHosting are pleased to announce their strategic partnership. ScalaHosting has recently become a Platinum Sponsor of Joomla and with that they are offering an approved VPS hosting environment for Joomla installs. Brian Mitchell, President of Open Source Matters Inc. described the sponsorship as “a great opportunity for users to experience not just the power of Joomla as a flexible and extensible Content Management System, but also to see Joomla hosted on a high grade platform at a very competitive price point. The ScalaHosting solution brings ‘professional hosting capabilities’ within reach of the smaller website creators who would previously have utilised a shared hosting solution.” Chris, CEO and Co-Founder of ScalaHosting stated: "ScalaHosting has been committed to Joomla and its community for over 10 years, and by supporting one of the most popular CMS platforms globally, it is for us a logical step forward. Being an exclusive Managed VPS provider, we want to help Joomla users to experience a completely different level of website loading speeds, reliability, and security, in an isolated cloud environment. The all-in-one VPS solutions like SPanel are the next big thing in the hosting industry and we want to make sure that Joomla fans are among the first to try it out. This is why we have partnered with Joomla to provide these tools so that both the Joomla users and ScalaHosting users can benefit from this one of a kind tool." About Joomla Joomla is an award winning Open Source CMS, built and maintained by a strong community of volunteers who strive to work on a robust, secure, easy to use platform. It is free to download and use, and its functionalities meet cutting edge web technology. Joomla enables website creators to create powerful websites where maintaining its content is easy and seamless. About ScalaHosting ScalaHosting has been on its journey of providing web hosting services since 2008, with its primary focus on the fully managed cloud VPS. What makes them different from traditional hosting providers is their software development team, which helped them achieve independence from 3rd party license providers like cPanel. Developed entirely in-house, their SPanel and SShield allow website owners worldwide to take advantage of the much more advanced VPS environment compared to the shared hosting, fully managed by industry experts, and still keep the prices low. HomeNewsGeneral NewsScalaHosting Becomes a Platinum Global Sponsor of Joomla!'
