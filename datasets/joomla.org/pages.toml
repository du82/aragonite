ool to control cookies on our websites soon. The tool will allow you to accept / delete all the cookies saved by any of the joomla.org websites. Using your browser Moreover, if you'd like to delete cookies or instruct your web browser to delete or refuse cookies, please visit the help center of your web browser. Please mention that if you do this, you may have to manually adjust some preferences every time you visit a site and some services or/and some functionalities may not work. Each browser provides help pages that help you manage cookies in their products. To disable cookies through your browser, follow the instructions usually located within the “Help,” “Tools” or “Edit” menus in your browser, or see detailed information on how to do this via the AboutCookies.org guide. Questions If you want to reach out to our Data Protection Officer (DPO) for information and questions, please send an email to This email address is being protected from spambots. You need JavaScript enabled to view it.. Last Updated: 1 May 2020'''
