description = "The Joomla! Project is pleased to announce the release of Joomla 5.1.4 and Joomla 4.4.8"
full_description = "Release News Joomla 5.1.4 and Joomla 4.4.8 are here! Details Created: 27 August 2024 facebook twitter linkedin pinterest Let’s celebrate! The Joomla! Project is pleased to announce the release of Joomla 5.1.4, alongside Joomla 4.4.8. This are bug fix releases for the 5.x and 4.x series of Joomla. These releases continues Joomla’s high standards in accessible web design, highlighting Joomla's values of inclusiveness, simplicity and security into an even more powerful open-source web platform. Bug fixes with 5.1.4 Fixes the bug in pagination introduced by a security fix in 5.1.3 Fix filter for option, format, view and layout in cache and pagination Update dates for supported php versions Fix for unsafe tags in mail templates Translation updates Where can I download Joomla 5.1? On the Downloads site, of course :) New Installations New installation instructions and technical requirements Install 5.1.4 Install: 4.4.8 Upgrade Upgrade 5.1.4 Upgrade 4.4.8 Would you like to make a tour of Joomla 5 without having to install it? We have a solution for you: Try Joomla 5.1 at launch.joomla.org How can I upgrade my site to Joomla 5.1.4? Good news for Joomla 4.4.x to 5.x, it’s an upgrade, not a migration. Why? Two main reasons: Joomla 4 (J4) extensions that have removed all deprecations of code and are using up-to date Joomla code, will work in Joomla 5 (J5) Most others will work with the new Behaviour - Backward Compatibility Plugin enabled The full details are found here: https://docs.joomla.org/Joomla_4.4.x_to_5.x_Planning_and_Upgrade_Step_by_Step Note: we advise you to first test the upgrade on a copy of your production site. You may also wonder if you have to migrate ASAP. You can take your time; we’ll support 4.4 for 1.5 more years. So your site is not at risk if you don’t upgrade now. And don’t forget that some of your extensions may not be yet ready for Joomla 5 (even though most developers have done a great job offering a Joomla 5 test version for a while. You can filter by version in the Joomla Extensions Directory so you can see which are ready for J5 and which are J5 ready with the b/c plugin enabled. Joomla 5.1.4 is out. Make some noise! Let the world know Joomla 5.1.4 is released. Use the hashtag #Joomla5, share the Joomla 5 video, send the Joomla 5 landing page to your clients or add it to your pro site. What about Joomla 4.4.8? Joomla 4.4.8 has no new features. However, you are required to upgrade from Joomla 4.x to Joomla 5.xIt contains updates to allow for a smoother upgrade path but no new features. Who is Joomla! for? Web agencies, large and small companies, online shops, bloggers, communities, and all kinds of organisations (for example, NGOs, schools, charities and governments) all use Joomla as their preferred CMS. Joomla is written by committed volunteers. Many of those volunteers use it in their everyday web design, building and hosting. So, unlike many other systems, Joomla is built by those using it on a daily basis. That is reflected in its secure, robust nature. Is there help for extension developers with Joomla 5? Yes, a growing manual is aimed at those who code and maintain their extensions. The manual can be found at https://manual.joomla.org/migrations/44-50/ and is a growing work to help developers get ahead of any changes. How can you help develop Joomla? There are a variety of ways in which you can get actively involved with Joomla. It doesn't matter if you are a coder, an integrator, or a user of Joomla. You can join the community on Mattermost and look through the teams to join, or if you are ready, you can jump right into the Joomla! Bug Squad. The Joomla! Bug Squad and the CMS Release Team are some of the most active teams in the CMS development process and are always looking for people (not just developers) who can help with sorting bug reports, coding patches and testing solutions. It is a great way to increase your working knowledge of the Joomla code base and also a great way to meet new people from all around the world. You can also help Joomla development by thanking those involved in the many areas of the process. The Project also wants to thank all the contributors who have taken the time to prepare and submit work to be included in the Joomla CMS and Framework. Where can I find documentation about Joomla 5? There are some tutorials to help you with Joomla 4. You can find the existing ones, like creating a Plugin or a Module for Joomla 4, namespaces conventions, prepared statements, using the new web asset classes and many more inhttps://docs.joomla.org/Category:Joomla!_5.x We encourage developers to help write the documentation about Joomla 5 on docs.joomla.org to help and guide users and other extension developers. A JDocs page will help developers see the existing documentation and the documentation still needed. We invite you to check it regularly, update it and provide the missing content. Related information If you are an extension developer, please make sure you subscribe to the extension developer channel https://joomlacommunity.cloud.mattermost.com/main/channels/extension-development-room Where you can join the community of extension developers. Filing bugs and issues General developer mailing list Joomla developer network A Huge Thank You to Our Volunteers! Joomla 5.1.4 results from thousands of hours of work by dozens of volunteers. A big thank you to everyone who contributed to the 5.1.4 and the 4.4.8 releases! A special mention to the Joomla 5.1.4 release managers: Martina Scholz, who worked tirelessly to get this release out, and Benjamin Trenkle, who stepped in to assist when needed. And Martin Kopp and Allon Moritz, who worked to get Joomla 4.4.8 ready for release. Full details are on GitHub A huge shout out to our teams, who have done an amazing job. In particular, the CMS maintenance team, CMS release team, docs team and Marketing team all did their utmost to make this release happen. Thank you all. Translations Dutch: Joomla 5.1.4 en 4.4.8 - zijn nu beschikbaarFrench: Joomla 5.1.4 et Joomla 4.4.8 sont disponibles !German: Joomla! 5.1.4 und Joomla! 4.4.8 veröffentlichtPolish: Wydano Joomla 5.1.4 i Joomla 4.4.8Russian: Вышли релизы Joomla 5.1.4 и Joomla 4.4.8Turkish: Joomla! 5.1.4 ve Joomla! 4.4.8 yayınlandı HomeNewsRelease NewsJoomla 5.1.4 and Joomla 4.4.8 are here!"
