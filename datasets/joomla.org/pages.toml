al basis Who the information is shared with Consequences of failure to provide the information Full name To list you in the public Certified User directory, to register for the exam, to address you by name, to ensure access to your account and to the Joomla Certification Exam. Consent provided by the user. Certification Team; Secretary; Webmasters Team; Exam Supervisor (External); Treasurer. We will not be able to list you in the public Certified User directory, to register you for the exam, to address you by name, to ensure access to your account, nor to provide you access to the Joomla Certification Exam. Email To register for the exam, to contact you, and to ensure access to your account and to the Joomla Certification Exam. Consent provided by the user. Certification Team; Secretary; Webmasters Team; Exam Supervisor (External); Elastic Email. We will not be able to register you for the exam, to contact you, nor to ensure access to your account and to the Joomla Certification Exam. IP address To allow access to the website. Processing is necessary for compliance with a legal obligation to which we are subject. Certification Team; Secretary; Webmasters Team N/A Address To prepare the receipt for the Certification Exam fees and participation. Processing is necessary for the performance of a contract to which you are a party. Certification Team; Secretary; Webmasters Team We will not be able to prepare the receipt for the Certification Exam fees and participation. Phone number To prepare the receipt for the Certification Exam fees and participation and to contact you. Processing is necessary for the performance of a contract to which you are a party. Certification Team; Secretary; Webmasters Team. We will not be able to prepare the receipt for the Certification Exam fees and participation, nor to contact you. Transaction number To process your payment. Processing is necessary for the performance of a contract to which you are a party. Certification Team; Secretary; 