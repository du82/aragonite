["https://joomla.org/announcements/general-news/5856-scalahosting-extends-their-platinum-global-sponsorship-of-joomla.html"]
title = "ScalaHosting extends their Platinum Global Sponsorship of Joomla!"
description = "Open Source Matters Inc, the organization behind Joomla!, and ScalaHosting are pleased to announce the extension of their strategic partnership."
full_description = '''General News ScalaHosting extends their Platinum Global Sponsorship of Joomla! Details Created: 09 March 2022 facebook twitter linkedin pinterest Open Source Matters Inc, the organization behind Joomla!, and ScalaHosting are pleased to announce the extension of their strategic partnership. ScalaHosting became a Platinum Sponsor of Joomla in January 2021, and with that, they are offering an approved VPS hosting environment for Joomla installs. Now, after a successful year of collaboration, both organizations decided to continue working together and go the extra mile to provide even more value to the Joomla fans. Robert Deutz, President of Open Source Matters Inc. described the partnership as “an enormous opportunity for both teams together to come up with incredible new cloud technologies and integrations where the ultimate benefit will go to the Joomla users. ScalaHosting develops some exciting and innovative solutions like the Multi-Datacenter-Clustering, and I can't wait to see how this will handle supper-busy Joomla websites. The powerful bundle between SPanel and our CMS is something else I'm eager to see in action in the near future.” Chris, CEO and Co-Founder of ScalaHosting stated: ScalaHosting has a long history serving Joomla customers, and we know their needs from a very specific angle. This knowledge will be utilized in the process of the Joomla integrations we are planning in the coming months and will result in a much better user experience. Now that we have made the managed VPS affordable and easy to manage, thanks to our SPanel, the time has come to introduce some truly innovative cloud solutions that will shake the industry for good. "ScalaHosting has a long history serving Joomla customers, and we know their needs from a very specific angle. This knowledge will be utilized in the process of the Joomla integrations we are planning in the coming months and will result in a much better user experience. Now that we have made the managed VPS affordable and easy to manage thanks to our SPanel, the time has come to introduce some truly innovative cloud solutions that will shake the industry for good." About Joomla Joomla is an award winning Open Source CMS, built and maintained by a strong community of volunteers who strive to work on a robust, secure, easy-to-use platform. It is free to download and use, and its functionalities meet cutting-edge web technology. Joomla enables website creators to create powerful websites where maintaining its content is easy and seamless. About ScalaHosting ScalaHosting has been on its journey of providing web hosting services since 2008, with its primary focus on the fully managed cloud VPS. What makes them different from traditional hosting providers is their software development team, which helped them achieve independence from 3rd party license providers like cPanel. Developed entirely in-house, their SPanel and SShield allow website owners worldwide to take advantage of the much more advanced VPS environment compared to the shared hosting, fully managed by industry experts, and still keep the prices low. HomeNewsGeneral NewsScalaHosting extends their Platinum Global Sponsorship of Joomla!'''
author = "Philip Walton"
year_published = 2022
