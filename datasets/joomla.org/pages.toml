["https://www.joomla.org/mailing-lists.html"]
title = "Joomla! Mailing Lists"
description = "Joomla's official mail lists are a way to stay connected with the latest news concerning the Joomla! Project and its community."
full_description = "Joomla! Mailing Lists Joomla's official mail lists are one of the many ways to stay connected with the all the latest news concerning the Joomla! Project and its community. Joomla! uses Google Groups for their mail lists and you will need a Google Account to subscribe to them. Click the mail list's heading to join or just read the posts. CMS Development This mail list is for discussions around building the Joomla! CMS. If you want to help make Joomla! awesome, please join this mail list. For talking about building third party extensions or other software please use: Joomla! General Development Mail List found right below. Visit https://developer.joomla.org for more information about developing with Joomla. General Development This is the main discussion list for software developers working on Joomla! extensions or on applications that use the Joomla! Framework. If you have questions about how to build something for Joomla! or want to ask others about general ideas concerning Joomla! development, then please join this mail list. Joomla! Framework This is the official Joomla! Framework Q&A/discussion mail list. The Joomla! Framework's source code can be found here: https://github.com/joomla-framework. Joomla! GSoC This is the official Joomla! Google Summer of Code discussion mail list."
