title = "Temporary Hosting Outage Affecting Website Accessibility"
description = "Important Notice to Our Valued Community Members and Partners Dear Community Members and Partners, We regret to inform you of a temporary hosting outage that has rendered some of our websites..."
full_description = "General News Temporary Hosting Outage Affecting Website Accessibility Details Created: 02 October 2023 facebook twitter linkedin pinterest Important Notice to Our Valued Community Members and Partners Dear Community Members and Partners, We regret to inform you of a temporary hosting outage that has rendered some of our websites inaccessible. Please accept our sincere apologies for any inconvenience this may have caused. Details of the Outage: Our hosting provider, Rochen, provided the following update regarding the situation: “During the process of applying regular software updates to our VMware vSAN storage cluster, multiple node members rebooted for the updates. Concurrently, additional nodes experienced crashes. This convergence of events, though extremely unlikely, unfortunately transpired. Our top-tier technical team is diligently working to restore the vSAN storage cluster at the earliest. We deeply regret the inconvenience and appreciate your patience, especially as our support channels are currently overwhelmed.” Date and Time of Outage: 1st October, starting around 06:00 UTC Affected Websites: (Please note this list may not cover all affected sites) https://community.joomla.org https://docs.joomla.org https://volunteers.joomla.org https://magazine.joomla.org https://www.opensourcematters.org https://extensions.joomla.org/ https://identity.joomla.org/ Estimated Time of Resolution: As of 05:00 UTC on October 2nd, Rochen reported that some VMs have been fully restored and are operational. However, restoration efforts continue for the remaining affected servers. Our Response: We are maintaining regular communication with Rochen. We have confidence in our long-standing partner to address and rectify these issues effectively. We deeply regret the inconvenience and are dedicated to taking measures to minimize such disruptions in the future. Your patience and understanding during this challenging time are greatly appreciated. Warm regards, HomeNewsGeneral NewsTemporary Hosting Outage Affecting Website Accessibility"
author = "Harald Leithner"
year_published = 2023
