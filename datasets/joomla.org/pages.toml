full_description = "Mission, Vision & Values Mission Statement Our mission is to provide a multilingual, flexible and free platform for digital publishing and collaboration, made and sustained by volunteers. The platform should be stable, secure and extensible. Adapting the latest technologies to the core product to be innovative and renewing as a platform. Our mission is to provide a stable tool for agencies, web-builders, SMB’s and non-profits to easily build, extend, maintain and edit an online publishing platform. For our end users our aim is that they are able to input, edit and distribute content within the CMS frontend without a big learning curve. Vision Statement Establish, maintain and support a global community of volunteers. Open Source Software that is free, secure, and high-quality. Engage ourself as a socially responsible project Build trust with all our users and therefore becoming a stronger community. Communicate openly on all levels of the community and about our software Act autonomously as a project Key Values Freedom Equality Trust Community Collaboration Usability Transparency"
