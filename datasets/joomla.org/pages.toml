["https://www.joomla.org/announcements/release-news/5920-joomla-5-2-4-security-bugfix-release.html"]
title = "Joomla 5.2.4 Security & Bugfix Release"
description = "The Joomla! Project is pleased to announce the release of Joomla 5.2.4 Security & Bugfix Release."
full_description = "Release News Joomla 5.2.4 Security & Bugfix Release Details Created: 18 February 2025 facebook twitter linkedin pinterest Let’s celebrate! The Joomla! Project is pleased to announce the release of Joomla 5.2.4 and Joomla 4.4.11. This is a security and bug fix release for the 5.x and 4.x series of Joomla. These releases continue Joomla’s high standards in accessible web design, highlighting Joomla's values of inclusiveness, simplicity and security into an even more powerful open-source web platform. Security Fix [20250201] - Core - SQL injection vulnerability in Scheduled Tasks component Bug fixes and Improvements with 5.2.4 Fix namespace map creation on PHP 8.4 (#44789) Fix PHP Warning for debuguser, debuggroup (#44721) Fix handling of null values on update row (#39607) Fix cache counting issue - correctly count number of files (#43986) Fix permissions for manually running scheduled tasks (#36719) Tag Router: Allow numeric/CSV IDs (Regression) (#44784) Fix for Composer update to enshrined/svg-sanitize to resolve SVG upload issues (#44746) Fix for Article cannot be saved successfully on the front-end (#44680) Fix media downloads with spaces (Follow-up of #37396) (#44745) Finder Router: Filter out unnecessary query elements (#44055) Jooa11y plugin and page cache conflicts (#41956) Fix a11y issue in accordion (role attribute) (#40578) Remove alt-text for menu items when both image and title are set (a11y fix) (#40675) Fix breadcrumbs color in light and dark mode (#44212) Email alt text fix in contact component (#44491) Web Asset Manager: Incorrect loading of external resource with / at the end (#44774) Fix media downloads with spaces (Follow-up of #37396) (#44745) Fix multi-select behavior in Media Manager (Follow-up of #39824) (#44747) Fix error handling when creating folders in Media Manager (#39878) Fix assets for com_scheduler on new installations (#44684) Fix password reset broken in backend (#44723) Email cloak plugin fails for emails with IDN (Internationalized Domain Names) (#39888) Fix handling of root path removal only when it is at the beginning (#36685) Load the namespace from the cached manifest (Reverted) (#44755) Fix for Codemirror duplicated assets entries (#44674) The full list on GitHub is here: https://github.com/joomla/joomla-cms/milestone/136?closed=1 What’s shipped with 4.4.11? Joomla 5 is the latest main version. No new features will be added in Joomla 4 and it will only receive security updates until October 14, 2025. [20250201] - Core - SQL injection vulnerability in Scheduled Tasks component Where can I download Joomla 5.2.4? You can find all Joomla 5 downloads through the official downloads page at: https://downloads.joomla.org/cms/joomla5/ New Installations New installation instructions and technical requirements Install 5.2.4 Upgrade Upgrade 5.2.4 Where can I download Joomla 4.4.11? Upgrade Upgrade 4.4.11 Would you like to make a tour of Joomla 5 without having to install it? We have a solution for you: Try Joomla 5.2.4 at launch.joomla.org. How can I upgrade my site to Joomla 5.2.4? Good news for Joomla 4.4.x to 5.x, it’s an upgrade, not a migration. Why? Two main reasons: Joomla 4 (J4) extensions that have removed all deprecations of code and are using up-to date Joomla code, will work in Joomla 5 (J5) Most others will work with the new Behaviour - Backward Compatibility Plugin enabled The full details are found here: https://docs.joomla.org/Joomla_4.4.x_to_5.x_Planning_and_Upgrade_Step_by_Step Note: we advise you to first test the upgrade on a copy of your production site. You may also wonder if you have to migrate ASAP. We’ll support Joomla 4.4 until 14 October 2025 with security patches. So your site is not at risk if you don’t upgrade now. And don’t forget that some of your extensions may not be yet ready for Joomla 5 (even though most developers have done a great job offering a Joomla 5 test version for a while. You can filter by version in the Joomla Extensions Directory so you can see which are ready for J5 and which are J5 ready with the b/c plugin enabled. For known issues with the 4.4.11 release, see the Version 4.4.11 FAQ; for the 5.2.4 release, check the Version 5.2.4 FAQ in our documentation. Who is Joomla! for? Web agencies, large and small companies, online shops, bloggers, communities, and all kinds of organisations (for example, NGOs, schools, charities and governments) all use Joomla as their preferred CMS. Joomla is written by committed volunteers. Many of those volunteers use it in their everyday web design, building and hosting. So, unlike many other systems, Joomla is built by those using it on a daily basis. That is reflected in its secure, robust nature. Is there help for extension developers with Joomla 5? Yes, a growing manual is aimed at those who code and maintain their extensions. The manual can be found at https://manual.joomla.org/migrations/51-52/ and is a growing work to help developers get ahead of any changes. How can you help develop Joomla? There are a variety of ways in which you can get actively involved with Joomla. It doesn't matter if you are a coder, an integrator, or a user of Joomla. You can join the community on Mattermost and look through the teams to join, or if you are ready, you can jump right into the Joomla! Bug Squad. The Joomla! Bug Squad and the CMS Release Team are some of the most active teams in the CMS development process and are always looking for people (not just developers) who can help with sorting bug reports, coding patches and testing solutions. It is a great way to increase your working knowledge of the Joomla code base and also a great way to meet new people from all around the world. You can also help Joomla development by thanking those involved in the many areas of the process. The Project also wants to thank all the contributors who have taken the time to prepare and submit work to be included in the Joomla CMS and Framework. Where can I find documentation about Joomla 5? There are some tutorials to help you with Joomla 4/5. You can find the existing ones, like creating a Plugin or a Module for Joomla 4/5, namespaces conventions, prepared statements, using the new web asset classes and many more in https://docs.joomla.org/Category:Joomla!_5.x We encourage developers to help write the documentation about Joomla 5 on docs.joomla.org to help and guide users and other extension developers. A JDocs page will help developers to see the existing documentation and the documentation still needed. We invite you to check it regularly, update it and provide the missing content. Related information If you are an extension developer, please make sure you subscribe to the extension developer channel https://joomlacommunity.cloud.mattermost.com/main/channels/extension-development-room Where you can join the community of extension developers. Filing bugs and issues General developer mailing list Joomla developer network A Huge Thank You to Our Volunteers! Joomla 5.2.4 results from thousands of hours of work by dozens of volunteers. A big thank you to everyone who contributed to Joomla 5.2.4!! Big thanks to the Joomla CMS Maintainers Team for their hard work. Also, for the bug sprint they organized on Friday 17, Saturday 18, and Sunday 19 January 2025. During that online 3-day working session, the team checked and cleaned GitHub issues, wrote patches, tested PRs, and moved, closed, or merged PRs into the right branches (5.2/5.3/6.0). A special mention to the Joomla 5.2 release managers: Hannes Papenberg and Peter Martin, who worked tirelessly to get this release out. Full details are on GitHub A huge shout out to our teams, who have done an amazing job. In particular, the CMS maintenance team, CMS release team, docs team and Marketing team all did their utmost to make this release happen. Thank you all. Translations Dutch: Veiligheids en bug-fix release Joomla 5.2.4 en 4.4.11French: Sortie de Joomla 5.2.4 et 4.4.11German: Joomla! 5.2.4 und 4.4.11 als Sicherheits- und Bugfix-Release veröffentlichtPolish: Joomla 5.2.4 i 4.1.11 - Poprawka zabezpieczeńTurkish: Joomla! 5.2.4 Güvenlik ve Hata Düzeltme Sürümü HomeNewsRelease NewsJoomla 5.2.4 Security & Bugfix Release"
author = "Tom van der Laan"
year_published = 2025
