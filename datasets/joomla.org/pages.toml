["https://www.joomla.org/announcements/release-news/5916-joomla-5-2-0-and-joomla-4-4-9-are-here.html"]
title = "Joomla 5.2.0 and Joomla 4.4.9 are here!"
description = "The Joomla! Project is pleased to announce the release of Joomla 5.2.0 and Joomla 4.4.9"
full_description = "Release News Joomla 5.2.0 and Joomla 4.4.9 are here! Details Created: 14 October 2024 facebook twitter linkedin pinterest Let’s celebrate! The Joomla project is thrilled to announce the release of Joomla 5.2 along with Joomla 4.4.9. This new minor version of Joomla 5.2 brings exciting improvements, making it easier for everyone – from developers to content creators – to build and manage their websites. What’s new in Joomla 5.2? Here’s a quick look at the powerful new features that Joomla 5.2 brings to the table: Guided Tour Enhancements With Joomla 5.2, a “What’s New” guided tour automatically starts after you update, making it easier to discover all the latest improvements in a seamless and user-friendly way. This feature can also be customized for your own needs.PR #43966 | Learn more in the documentation Multilingual Menu Management No more duplicating menus for each language! Joomla 5.2 simplifies multilingual site management by allowing multiple homepages to be added to a single menu.PR #43862 | Documentation here New Articles Module The brand-new Articles Module gives you more flexibility in displaying your content. Filter articles by category and tailor the display according to your needs – all with a more intuitive interface!PR #43738 | Documentation here Customizable Email Templates Give your emails a professional touch by customizing HTML templates directly from the Joomla admin panel. Personalize your email layouts, add logos, and ensure all communications are on-brand.PR #43829 | Learn more here Create Categories Directly in Menus Creating categories in Joomla has never been this easy. You can now save categories directly within menus, giving you a faster and more intuitive workflow.PR #43840 | Documentation here Conditional Fields for Forms Take control of your forms with conditional field display based on global settings. This feature lets you show or hide fields dynamically depending on the configurations, adding more flexibility to your forms.PR #43842 | Learn more in the documentation CSS Class Selector in TinyMCE Style your links more easily with Joomla 5.2’s new CSS class selector in TinyMCE. No need to manually edit the HTML – just choose your class and go!PR #43260 | Documentation here Improved Password Security Joomla 5.2 now supports a wider range of special characters for passwords, making your site even more secure.PR #43484 | Learn more about password security Developer Features and Optimizations Joomla 5.2 also brings several improvements aimed at developers and site performance: SEO and SEF URL Improvements Strict routing and improved SEF URL options reduce duplicate content and unnecessary redirects, boosting your site's SEO.PR #43432 | Learn about SEO Improvements Event Classes for Plugins Developers will appreciate the introduction of event classes, which make plugin development more modular and easier to manage.PR #43639 | Learn how to use event classes Improved Media Manager The media manager now auto-selects the most recent upload, making it faster to manage and embed media in your articles.PR #43823 | Learn more Optimized Image Thumbnails Joomla 5.2 also brings better image thumbnail compression, helping your site load faster while saving storage space.PR #43282 PHP 8.4 Support Full compatibility with PHP 8.4 ensures better performance and security as hosting environments upgrade to newer PHP versions.PR #43323 Better Task Management The scheduled tasks screen now warns administrators if a task fails to execute, helping you keep track of your cron jobs.PR #43491 Download Joomla 5.2 Now! Experience Joomla 5.2 for yourself by downloading the latest version: Download Joomla 5.2 Full Package Upgrade package for Joomla 5.2 Joomla 4.4.9 Note: Joomla 4.4.9 is now available, bringing the latest bug fixes. This release marks the end of bug fix updates for Joomla 4.4. Going forward, only security updates will be provided for this version. Download Joomla 4.4.9 Full Package Joomla 4.4.9 Upgrade Package: Would you like to make a tour of Joomla 5 without having to install it? We have a solution for you: Try Joomla 5.2 at launch.joomla.org If you’re still on Joomla 4.4.x, good news! Upgrading from Joomla 4.4.x to 5.x is an upgrade, not a migration. Most extensions will work seamlessly with the Backward Compatibility Plugin enabled.Full upgrade guide here Installation Instructions & Technical Requirements New installation instructions: Installing Joomla 5.x Technical requirements: Technical Requirements for Joomla Further Reading & Documentation For more information, explore the full documentation and PR lists: Joomla 5.2 Full PR List Joomla 5.2 Tips & Tricks A Huge Thank You to Our Volunteers! A big thank you to everyone who contributed to the 5.2.0 and the 4.4.9 releases! A special mention to the Joomla 5.2 release managers: Hannes Papenberg and Peter Martin, who worked tirelessly to get this release out. And Martin Kopp and Allon Moritz, who worked to get Joomla 4.4.9 ready for release.We had 4 new contributors, 41+ contributors and 317+ Pull Requests have been mergedFull details are on GitHub A huge shout out to our teams, who have done an amazing job. In particular, the CMS maintenance team, CMS release team, docs team and Marketing team all did their utmost to make this release happen. Thank you all. Translations Dutch: Joomla 5.2.0 en 4.4.9 zijn nu beschikbaarFrench: Joomla 5.2.0 et 4.4.9 sont disponibles !German: Joomla! 5.2.0 und Joomla! 4.4.9 veröffentlichtRussian: Вышли релизы Joomla 5.2.0 и Joomla 4.4.9Turkish: Joomla! 5.2.0 ve 4.4.9 Kararlı Sürüm Yayınlandı HomeNewsRelease NewsJoomla 5.2.0 and Joomla 4.4.9 are here!"
