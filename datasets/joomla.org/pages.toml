["https://www.joomla.org/cookie-policy.html"]
title = "Joomla! Cookies Policy"
description = "The Cookie Policy describes which cookies are created by the Joomla.org websites and how do we use them to customize your experience."
full_description = '''Cookies Policy This Cookie Policy applies to the websites/domains which are owned and managed by the Joomla Project: joomla.org and its subdomains opensourcematters.org joomlacode.org The Websites above are operated by Open Source Matters, Inc. (“Joomla”, "us", "we", or "our") and use cookies. (collectively the "Site"). Our Cookie Policy explains what cookies are, how we use cookies, how third-parties we partner with may use cookies on the Site, and which are your choices regarding cookies. Please read this Cookie Policy in conjunction with our Privacy Policy, which sets out additional details on how we store and process your personal data and your various rights. What are cookies? A cookie is a small text file that a website saves via the browser on your computer or mobile device when you visit the site. Why do we use cookies? They enable the website to remember your actions and preferences (such as login details, local language and/or other display preferences) over a period of time, so you don’t have to keep re-entering them whenever you come back to the site or browse from one page to another. Additionally, it allows the Site or a third-party to recognize you, while making your next visit easier and the Site more useful to you. Sometimes we may use tracking pixels, which are small graphic files linked to our servers that allow us to track your usage over our Site and on related functionalities. Cookies and tracking pixels allow us to serve you better and more efficiently, and to personalize your experience on our Site. Categories of cookies that Joomla’s properties use When you use and access the Site, we use a cookie bar that will inform you about the use of cookies in our websites and you would be able to accept or change your preferences regarding the use of cookies. The Joomla Project uses both session and persistent cookies on it’s Site and it uses different types of cookies to run the Site. Essential cookies Strictly necessary cookies are essential for the operation of the Site in order to enable you to move around the website and use its features, such as accessing secure areas, authenticating users and preventing fraudulent use of user accounts. Without these cookies, the Site may not be fully functional. We use the following strictly necessary cookies on our Site: Essential cookies Cookie name Provider of the cookie Purpose Expiration How to opt out/more information Used in Property/ies {random alphanumeric name} First party cookie Initialize the user session on the website and provide the content End of the session This is the Session Cookie referring to a specific session per time. Its usage is mandatory for the connection between the client and the server. *.joomla.org PHPSESSID First party cookie Initialize the user session on the website and provide the content End of session This is the Session Cookie referring to a specific session per time. Its usage is mandatory for the connection between the client and the server. issues.joomla.org Non-essential cookies: Performance Cookies Performance cookies help The Joomla Project improve the way our Site works. We use Google Analytics cookies to collect information about how visitors use our website. These cookies collect information about how visitors use a website, for instance which pages are visitors more often visit, and if they get error messages from any web pages. We anonymize IP addresses in Google Analytics, and the anonymized data is transmitted to and stored by Google on its servers. As a result these cookies don’t collect information that identifies a visitor. It is only used to improve how a website works. Performance cookies Cookies by Name Host Name Purpose Expiration More Info / Opt out Used in Property/ies _dc_gtm_UA* Google, Inc. Enable Google Tag Manager features, including Google Analytics and Google Ads. Session https://support.google.com/analytics/topic/2919631?hl=en&ref_topic=1008008https://policies.google.com/technologie