full_description = "Download Joomla! Download Joomla! Download and Install Joomla! in your own server or development environment. Download Joomla! → Use launch.joomla.org Use Joomla! Spin up a free and fully functional Joomla website on launch.joomla.org. Launch Joomla! → Joomla! Training Learn Joomla! Learn how to manage a Joomla website with free video training classes. Learn Joomla! → Joomla! is an award-winning content management system (CMS), which enables you to build web sites and powerful online applications. Hundreds of developers have been improving Joomla! since the first version was released in 2005. This immense effort has made Joomla! very popular, easy to use, stable and secure. Joomla! has thousands of free extensions and templates allowing you to customize your site to fit your specific needs. Joomla! is the only major CMS that is built entirely by volunteers from all over the world. We have a strong community bond and all take pleasure in building something that has a large global impact. If you are interested in volunteering please head over to the volunteer portal."
