["https://josepha.blog/2018/10/25/the-panel-predicament"]
title = "The Panel Predicament- Shedding Light not heat"
description = "Anyone can organize a great panel if they know the five basic steps."
full_description = "The Panel Predicament October 25, 2018 For anyone who has worked with me organizing content-driven events, you will have heard me say regularly how much I hate panels. I am quick to declare my dislike of them, but generally only in the safety of a group of organizers. I’ll try to provide some clarity in the need for panels, why I dislike most panels I see, and what we can change to make them better. The Value of Panels In theory, I understand the appeal of panels. There is a lot of information available in the world, and it’s increasingly difficult to assess how trustworthy to consider the opinion of any self-proclaimed expert. There are many ways to achieve expert level opinions: by education, by research, by practice. Probably other ways, too. To solve the problem, we host panels. We gather industry thought leaders or experts and have them discuss things openly, in the accountability-forging context of “filming in front of a live audience”. We then leave it up to the audience to decide — what is your version of this truth that we’ve presented to you, almost without editorial aid? The Failing of Panels In practice, panels are far from that. They are either overpowered by a single voice or are overpowered by apparent fighting among the panelists. Moderators double as panelists and leave the group with no discernible direction. Panelists answer in a round robin style, often leaving no time for interesting or informed viewpoints to shine through. Panels are overstaffed and used as a way to prevent the discomfort of having to turn down speakers. Most people don’t apply to be on a panel, and many who get assigned to participate on a panel think that it means no preparation is required. The Best Panels It’s not that we’ve never seen a good panel. We see them from time to time, on TV or at large-scale niche events. There is a lot of writing available about how to be a better speaker, but not a lot about how to be a better panelist. Or even how to craft an excellent panel as an organizer. So I’ll tell you what’s proven to work for me over the years, as a long-time event organizer. Crafting an Excellent Panel In my experience, the best panels require a thoughtful moderator and panelists with a decent level of rapport (but not best friends). It’s great if you already have a group that fits that description. If you don’t there is a short, simple process that you can follow to foster one from the expert panel you have assembled. Dedicated Moderator – Find your moderator first, because you’ll need them throughout this process. The best moderators keep the discussion moving by helping with time management, directing questions toward particular panelists, and resisting the urge to join the discussion. Limited Number – If the time allowed for your panel is one hour, you should select no more than three panelists not including the moderator. That gives each speaker about 15-20 accumulated minutes assuming everything else is perfect. Prepare Panelists – Your moderator and panelists should have two meetings. Each meeting should take about an hour and be via voice (or a video call if you feel fancy). In the first one, do some general introductions and learn about everyone’s expertise as it relates to your broad topic. The moderator should take notes* and the panelists should explore what they are all excited about so that a topic can be defined. Clarify Your Topic – After the first meeting, the moderator will know what the most interesting areas of expertise each panelist has. That will help them guide questions (whether prepared or from the audience) to the right people. It will also help create a panel title that is clear, concise, and marketable. Written Questions – In the second meeting, the moderator should have some questions that have already generated interesting discussions among the panelists. Ask the panelists if, since their last meeting, they’ve been wondering about something another panelist said. Write down 5-10 questions and be prepared to start the panel on the day with 2-3 of them. Rinse and Repeat That’s it! Five steps and most of them are talking. 🙂 The first time through it will feel strange and uncomfortable, but after that it’s like riding a bike. *A note on notes. If you’re the moderator the notes you’re taking are: who has a tendency to talk the most who needs encouragement to talk what panelists do what panelists wish they could do why they do what they do (their philosophies) why their future vision is what it is (their observations) etc Share this:TwitterFacebookLike this:Like Loading… leadership, thoughts, WordCamp Featured, leadership, panels, wordcamp Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
