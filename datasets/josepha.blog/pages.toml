full_description = "bravery There’s Risk in the Resolution January 27, 2023 Late last year I attended a wonderful leadership session that walked us through closing the book on 2022 and preparing ourselves for the opportunities coming in the new year. There were 30 or so leaders representing a vast array of sectors, and in our opening breakout session we were invited to look at a number… Continue reading leadership bravery No Man’s Land: A Visual Reminder of Privilege July 10, 2015 Hat tip to Nikki Wiarda for posting this video today. Here is a complete list of the questions that were asked. I remember doing this exercise in our church youth group growing up and being a little embarrassed to be behind my peers sometimes. I grew up in a church that was, I think, pretty wealthy and pretty… Continue reading thoughts, video bravery, buzzfeed, privilege Learning to Fail April 4, 2015 Failure is inevitable for most of us. Throughout our primary and secondary education we are given no option but to get into situations where we are guaranteed to fail. Everything from debate classes to cheerleading tryouts and, if you were like me, all the way back to the monkey bars is designed to challenge you to the point… Continue reading adventures, notes to self, thoughts bravery Busting Through Road Blocks March 23, 2015 Anyone who has written knows the pain of facing a creative block. Sometimes it happens right when you least expect it; in the middle of a paragraph, right before a deadline, or when a project depends on the wording and suddenly you have no direction. The most common one for me, and my least favorite,… Continue reading Uncategorized bravery, thoughts, writing July 6, 2004 No torrential rain. No puddles the size of my car. No screaming children. This already is looking more promising than the first time I was here. I climbed out of the car with insurance/registration papers clutched in one hand and my Nalgene with my car keys dangling idly from the other. “Brace yourself,” I thought.… Continue reading Uncategorized bravery About Me Josepha is the former Executive Director of the WordPress project, helping to coordinate and guide volunteer efforts across the WordPress ecosystem. She is a trusted open source leader supporting developers, designers, community builders, and WordPress advocates contributing to the web’s most loved CMS. You can hear her thoughts on WordPress and open source on the WP Briefing podcast. WordPress LinkedIn X Mastodon Featured Posts I stopped sharing things with my teams and it’s the best decision I ever made Building a Culture of Safety My Leadership Philosophy Ex Officio: The Best Title You’ll Ever Take The Burden of Proof The Panel Predicament Newsletter Type your email… subscribe Recent Posts Laugenbrötchen Thank you, WordPress A Little Friday Story New Old Hobbies A Thriving WordPress Minute"
