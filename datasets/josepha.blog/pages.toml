full_description = "adventures Thank you, WordPress October 4, 2024 This week marks my last as the Executive Director of the WordPress project. My time with WordPress has transformed me, both as a leader and an advocate. There’s still more to do in our shared quest to secure a self-sustaining future of the open source project that we all love, and my belief in our… Continue reading adventures leadership, WordPress New Old Hobbies June 17, 2024 I bought myself a new bicycle a few weeks back, right before a bit of back to back travel. I’m a returning rider who hasn’t spent any meaningful time on a bike since I was a child, and at first I was mostly worried about looking foolish. Side Note: Worries over looking foolish are in… Continue reading adventures December 20, 2023 I get a lot of WordPress swag over the course of the year. They are all charming reminders of specific events, but this year I got two that I especially loved. Continue reading adventures Six Years in WordPress February 2, 2021 Today is my six year anniversary of becoming a full-time, sponsored contributor to the WordPress open source project. There are many ways I would describe it—rewarding, complex, cutting edge, difficult, ever-changing, meaningful—but at the end of the day, I want to be able to describe it like this: For the past six years, I have… Continue reading adventures, thoughts, Updates Happy Thanksgiving! November 26, 2020 It’s good to practice a bit of gratitude throughout the year, but it feels like we could all use an extra helping in 2020. So, here are a few things I’m thankful for, and grateful to have in my life! A network of family and friends who are generously supportive. The ability (and time) to… Continue reading adventures Compliments for 100 Dollars January 29, 2020 I walk past a middle school at lunch every day. Most days we all just carry on with our own work (mine: dog walking, theirs: game playing), but today was different. As I walked by the school yard, one of the kids kicked a ball over the fence and across the street. She asked if… Continue reading conversations, funny, Pepper, random Tea con Dino May 15, 2019 Continue reading adventures Made of Sunshine March 14, 2019 I’m headed to sunnier climates today, so this seemed appropriate. It is also one of those cheerful songs that make it hard not to dance a little. Continue reading adventures music, video Unlucky in Travel January 11, 2019 I was at dinner with friends recently and, during the course of our mutual catching up, was told that I have the most spectacular stories. We’re all travelers in that group, both for work and for pleasure, so the fact that I seem to have the most unusual experiences of all of us is notable.… Continue reading adventures, funny, travel The Interrupting Bug October 10, 2018 A large bug has taken up residence in my office. It only arrives when I’m mid-meeting. So I leave. And it leaves. Which means that when I return to dispatch the squatter, it no longer is in sight. Continue reading adventures Next Page» About Me Josepha is the former Executive Director of the WordPress project, helping to coordinate and guide volunteer efforts across the WordPress ecosystem. She is a trusted open source leader supporting developers, designers, community builders, and WordPress advocates contributing to the web’s most loved CMS. You can hear her thoughts on WordPress and open source on the WP Briefing podcast. WordPress LinkedIn X Mastodon Featured Posts I stopped sharing things with my teams and it’s the best decision I ever made Building a Culture of Safety My Leadership Philosophy Ex Officio: The Best Title You’ll Ever Take The Burden of Proof The Panel Predicament Newsletter Type your email… subscribe Recent Posts Laugenbrötchen Thank you, WordPress A Little Friday Story New Old Hobbies A Thriving WordPress Minute"
