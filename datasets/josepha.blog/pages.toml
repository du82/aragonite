["https://josepha.blog/2022/05/20/dungeons-and-dragons-for-team-trainings"]
title = "Dungeons and Dragons for Team Trainings- Shedding Light not heat"
description = "If you’re not familiar with Dungeons and Dragons (or table top games in general), the best way to describe it is “collaborative story crafting where a group of characters try to solve problems, save folks in trouble, and survive quests that they uncover along the way”. A colleague of mine, Andrea Middleton, once used a…"
full_description = "Dungeons and Dragons for Team Trainings May 20, 2022 If you’re not familiar with Dungeons and Dragons (or table top games in general), the best way to describe it is “collaborative story crafting where a group of characters try to solve problems, save folks in trouble, and survive quests that they uncover along the way”. A colleague of mine, Andrea Middleton, once used a Dungeons and Dragons style session to introduce contributors to some basic issues that arise during the course of organizing an event, and ever since that session folks have asked for more trainings in the same style. I had the opportunity to do this recently myself, so I thought I would share some tips for hosting a training adventure of your own. Getting Prepared When you’re hosting these sessions, it’s important to do some documentation before you meet. You will be playing the role of everyone except the people who are in the room so there is a lot to think through. But also, don’t worry about getting too granular since your team will be a little unpredictable—just know the general shape, the main players, and the key elements. Make a list of what to learn – Spend some time thinking about any skills gaps or knowledge gaps within the team. Is this a basic training on everyday tasks or more complex? Are they already familiar with working as a team or are they just starting to form? Find a scenario where you can practice – Brainstorm some scenarios that will provide opportunities to learn one or more things from that list. For instance, if you want them to learn where the company directory is, then maybe your scenario takes place at a registration desk. What do they need to know already – Determine any pre knowledge that will be required. If it’s a lot, consider sending it ahead of time. If it’s mostly “know where to ask questions” you’re probably their best resource. 🙂 Outline your story – start at the end with your learning outcomes and work your way forward. Make particular note of any decisions that would cause the outcome to branch. Try to think through what the best way through the problem is, but also the most common first steps, missteps, and failures. In my session, Missteps triggered a random encounter or external input and Failures triggered “It’s a trap” moments where the problem became worse. Know the required parts of the story – Note any important facts or people they should seek out while they are collectively working through solutions. What information will they try to find? What information must they find? Are there specific people who they have to find or they will get stuck? Getting Adventursome Before you host your session, determine how familiar your group is with this type of game. Not everyone plays games let alone adventuring table top games. If people have never played before, make sure you give them an overview of the process (or send them your favorite one shot). Also, if you are going to use this to track goals and progress over time, consider some sort of “character sheet” to document progress. Don’t get too rigid with the mechanics, though. You want them to come out having succeeded at the learning objective! Welcome everyone! Explain how each turn will work and have them roll initiative (so you know what order they will go in). Since there’s no Dex to break ties, I just had my players roll to break their own ties. 🙂 Read the scenario and ask the highest roller what they want to do. Table talk and discussion is encouraged, so it’s important to confirm with your player that they have decided on an action. Once they have completed their action, read out the results of the action and move on to the next highest roller. Make notes of the table talk and progress. You don’t want to move them through anything too quickly. They should have a chance to discuss, ask questions, and ponder possible outcomes. This is a time for them not only research and explore the problem, but also to learn how to work together toward their common goal. Don’t let them flounder! If they get too stuck, you do have some options: Remind them that you are a resource (“I’m playing all parts except you all, so feel free to ask me anything.”). Roll in a random encounter (“a friendly community member DMs you to ask…”). Roll in a skills check (if they asked almost the right question, roll a Charisma to see if they get some extra info. Do they need information that they aren’t aware of or can’t find? Roll a Knowledge/History.) Rinse and repeat until the problem is solved! As far as one shots go, these might be pretty much on rails, with a few clear alternative endings/solutions. Getting Closure Once you’re finished, I recommend doing a little debrief if you have time. If you take good notes during their session, you’ll be able to go back and look at the various branches and see what could have been done differently. This is a loose concept based on my recent experience. If you end up trying this, let me know in the comments! Share this:TwitterFacebookLike this:Like Loading… leadership DnD, dungeons and dragons, leadership, learning, teaching, training Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i 