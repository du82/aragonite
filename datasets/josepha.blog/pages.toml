["https://josepha.blog/2024/10/04/thank-you-wordpress/comment-page-2"]
title = "Thank you, WordPress- Shedding Light not heat"
description = "This week marks my last as the Executive Director of the WordPress project. My time with WordPress has transformed me, both as a leader and an advocate. There’s still more to do in our shared quest to secure a self-sustaining future of the open source project that we all love, and my belief in our…"
full_description = "Thank you, WordPress October 4, 2024 This week marks my last as the Executive Director of the WordPress project. My time with WordPress has transformed me, both as a leader and an advocate. There’s still more to do in our shared quest to secure a self-sustaining future of the open source project that we all love, and my belief in our global community of contributors remains unchanged. I have spent nine years working shoulder to shoulder with you, and I didn’t want to leave without saying goodbye. Together, we’ve built software that changes lives, and working this deeply in open source changes you. You spend every day working on consequential problems with brilliant people, in hopes that what you do today will help people far into the future. For everyone who was ever led by me – thank you all so much for the trust you’ve given me, and for fighting through the tiniest details to make sure that we always did what was best. For everyone who has ever led me – thank you all for helping me become the insightful and resilient leader that I am. Moving Forward I still believe that open source is an idea that can transform generations. I believe in the power of a good-hearted group of people. I believe in the importance of strong opinions, loosely held. And I believe the world will always need the more equitable opportunities that well-maintained open source can provide: access to knowledge and learning, easy-to-join peer and business networks, the amplification of unheard voices, and a chance to tap into economic opportunity for those who weren’t born into it. While my next steps aren’t yet clear, I hope to never be too far from this community that taught me so much. And whatever the future holds, remember that you are kind, intrepid keepers of the open source ethos and always honor what brought you here. Share this:TwitterFacebookLike this:Like Loading… adventures leadership, WordPress Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» 106 responses to “Thank you, WordPress” WordPress Executive Director Resigns – WP Tavern – WP Maniac October 6, 2024 at 4:31 pm […] a farewell put up titled Thank you, WordPress, she expressed continued optimism for the way forward for the open-source mission: “There’s […] Loading… Reply Stormy Days For WordPress – WP Roads October 6, 2024 at 6:23 pm […] Josepha Haden Chomphosy, is among the 159 people that left Automattic last week, here's her goodbye post, many other key roles left the […] Loading… Reply WP Weekly 214 – Churn – 150+ Leave, WP Update Mirror, Woo Release Moved October 6, 2024 at 9:19 pm […] Haden Chomphosy, Executive Director of the WordPress project, has decided to leave after being there for nine years. Additionally, 159 people (8.4% of the company) have left […] Loading… Reply Thank You, Josepha: WordPress Executive Director Resigns – WP Tavern October 6, 2024 at 10:01 pm […] a farewell post titled Thank you, WordPress, she expressed continued optimism for the future of the open-source project: “There’s still […] Loading… Reply Mike Little October 7, 2024 at 1:32 am Thank you, Josepha Loading… Reply Ahsan Parwez October 7, 2024 at 2:40 am Thank you Josepha for being a leader for the open source web. Your contributions will continue to create an impact. Hopefully you will stay active within WordPress community. Loading… Reply Hauwa Abashiya October 7, 2024 at 3:45 am Thank you Josepha for your dedication to this community. It was such a joy to find out we shared a love for sewing. You will be an asset wherever you go. All the best. Loading… Reply Joel October 7, 2024 at 10:31 am Thank you for everything, Josepha! Loading… Reply Sarah Gooding October 7, 2024 at 11:39 am Thank you for all you have given to WordPress, Josepha! Your leadership will be missed. Wishing you the best on your next adventure and many bright days ahead! Loading… Reply Bud Kraus October 7, 2024 at 11:39 am Josepha Of all the news I’ve heard your leaving as Executive Director has hit me the hardest. Your brilliant leadership has been nothing but a shining example of how one person can make a difference in the lives of so many. I know. I’m one of them. The thought of you not being in the WP Community (say this is not so) is devastating. I wish all of this were not happening. The damage to the WP Project and Community may never really be repaired. I have been listening to your WP Briefing since the start and I will sorely miss the Joy of WP in your voice that you brought to every episdoe. That laugh. When will I get more of that? I always knew you were going to leave one day but I never foresaw it would be this way. I hope this is only goodbye for now and I will soon see you smiling again to be the leader that you are! Love, Bud. Loading… Reply Thank You, Josepha: WordPress Executive Director Resigns | BytePlate Brand October 8, 2024 at 4:03 am […] a farewell post titled Thank you, WordPress, she expressed continued optimism for the future of the open-source project: “There’s still […] Loading… Reply Timeline of the WordPress Drama - DevLog October 8, 2024 at 10:03 am […] Director Josepha Haden leaves Automattic. (Source: Josepha / […] Loading… Reply O drama WordPress vs. WP Engine, explicado – Séries do Momento October 9, 2024 at 12:51 am […] TikTok nos EUA, assumirá o cargo de diretora executiva. Este cargo foi anteriormente ocupado por J