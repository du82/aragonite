title = "Compliments for 100 Dollars- Shedding Light not heat"
description = "I walk past a middle school at lunch every day. Most days we all just carry on with our own work (mine: dog walking, theirs: game playing), but today was different. As I walked by the school yard, one of the kids kicked a ball over the fence and across the street. She asked if…"
full_description = "Compliments for 100 Dollars January 29, 2020 I walk past a middle school at lunch every day. Most days we all just carry on with our own work (mine: dog walking, theirs: game playing), but today was different. As I walked by the school yard, one of the kids kicked a ball over the fence and across the street. She asked if I would throw it back over, apologizing a lot as she did. It’s no real burden for me, so I retrieved it and threw it back over. Another student asked if I could help retrieve a second ball, and then a third (there wasn’t a fourth). Again, not a problem, so I returned those balls as well. And then he said this: “You’re so generous! Thank you! If I could pay you $100 I would, but I don’t have any money. Your dog is beautiful and healthy. Have a good day!” Now, I can’t be sure of what drove him to have that little interaction with me. But I would like to imagine it’s a mixture of these things: Having a very high valuation of time.Having a very low valuation of a dollar.Having an innate sense for the existence of reciprocity. Which then led him to decide that, knowing that he needed to pay for the use of my expensive time, a compliment to my dog was worth $100. Share this:TwitterFacebookLike this:Like Loading… conversations, funny, Pepper, random Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» Have a thought? Leav