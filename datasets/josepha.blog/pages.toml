description = "Gather 'round and let me tell you an amazing story about the time (yesterday) that I interrupted a murder (eagle/osprey/flying predator vs bunny). I was making dinner yesterday and my dog came into the kitchen. She looked insistent which is how she looks 80% of her waking hours. I decided to let her out into…"
full_description = "A Little Friday Story August 16, 2024 Gather ’round and let me tell you an amazing story about the time (yesterday) that I interrupted a murder (eagle/osprey/flying predator vs bunny). I was making dinner yesterday and my dog came into the kitchen. She looked insistent which is how she looks 80% of her waking hours. I decided to let her out into the backyard. When I opened the door to the backyard, there was a large bird on the ground. It was startled and flew up a little bit. When it flew up, a bunny ran away—first to the right and then to the left, racing along a far journey to the shed it lives under. The bird flew away. That’s not amazing, Josepha, that’s simply life. You’re right. That’s not the amazing part. The amazing part (alarming part?) is what I did. This is how I responded to the excitement as it unfolded. This is what my husband heard in the other room: “OH!” “RUN! RUN AWAY!” “MURDER!” “OH MAN, IT’S HUGE!” <– the bird, the bird had like a 5′ wingspan “RUN! OH MAN, MURDER!” This is the point at which he shouted after me, asking if everything was okay. “I interrupted a murder! It’s a bird murder and I interrupted it!” I then walked away and continued making dinner, all the while muttering, “I can’t believe how big that bird was, it was so huge. It was the size of the dog. Huge bird, I can’t believe it.” Share this:TwitterFacebookLike this:Like Loading… funny Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» 8 responses to “A Little Friday Story” Thomas Assel August 16, 2024 at 1:37 pm Meanwhile, the bird’s chicks, on the edge of starvation, perished in exhausted cries of anguish when their mother failed to bring back food. Loading… Reply Josepha Haden Chomphosy August 16, 2024 at 1:39 pm A tragedy in flight. Loading… Reply mickmel August 16, 2024 at 4:23 pm We have to watch out for that at our place, or our tiny dog would become the dinner himself! Loading… Reply Josepha Haden Chomphosy August 19, 2024 at 6:22 am My dog isn’t tiny and even she refused to go out and see what was happening lol Loading… Reply Andrea Middleton August 16, 2024 at 5:59 pm Osprey are uncommon in your area, but northern harriers can have a wingspan of about 40-46” and hunt low. Loading… Reply Josepha Haden Chomphosy August 19, 2024 at 6:22 am Now that is a striking bird! I didn’t make much effort to look at its face, since I thought its colorings would be easier to identify. I seem to have been wrong about that, though. So many white and brown birds around! Loading… Reply New Media Works August 21, 2024 at 9:42 am I enjoy listening to “Clear+Vivid” (with Alan Alda) … and I’m a little over a year behind schedule. 😐 Just the other day I listened to Sy Montgomery speak about her love of hawks (in the episode titled “For the Love of Hawks”) — although it was fascinating, I can’t say that I could imagine ever becoming quite as inspired as she was. 🙂 Norbert Loading… Reply Josepha Haden Chomphosy August 23, 2024 at 9:10 am It’s been within the past three months that I got very excited for a buzzard, spreading its wings in a tree. So, I can imagine being inspired by hawks! Loading… Reply Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
