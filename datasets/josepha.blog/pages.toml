["https://josepha.blog/2019/01/29/my-leadership-philosophy"]
title = "My Leadership Philosophy- Shedding Light not heat"
description = "I've been guiding and advising future leaders for many years, as a mentor and overall advocate, and my advice hasn't changed much in that time. My concept of good leadership is informed by being a woman in a male-dominated field, a person of color in a primarily white-dominated world, and a general faith in the…"
full_description = "My Leadership Philosophy January 29, 2019 I’ve been guiding and advising future leaders for many years, as a mentor and overall advocate, and my advice hasn’t changed much in that time. My concept of good leadership is informed by being a woman in a male-dominated field, a person of color in a primarily white-dominated world, and a general faith in the power of a good-hearted group of people. But more importantly than all of that… my concept of good leadership is modeled on every servant leader I’ve seen in my life. I was raised in public libraries filled with volunteer after-school programs, and community theater spaces run by people filled with passion. My entire life I’ve seen the world transformed by people who wanted nothing more than something better for the people who came after them. And I take all of that lived experience into my leadership practice every day. The Basics tl;drI believe that with clear communication and expectations, I can foster an environment of open participation and respectful collaboration.Attitude: I will be considerate in my thinking and communication, always being cheerful or flexible (and both when possible). I will always remember that your time is as valuable as mine. I will remember that trust is a partnership, and earned not owed.Principles: I will lead with consistency and a global mindset, motivating people through knowledge not fear. I will lead knowing that people will follow after me, and I should leave my world better than how I found it. I will lead with honesty and integrity, knowing that I am only as good as my word. Behavior: I expect to address confrontations directly and react calmly in difficult situations. I expect to consider problems from multiple sides and find a solution that is equitable. I expect to not know things, and fail at things, and ask people to work alongside me anyway. A Final Thought I spent a lot of time trying to decide the best way to share this information—how to make it approachable, how to make it “accessible”—before I realized that there’s no Right Way to explain who you are. I’ve been leading in some form or another for as long as I can remember. I’ve made mistakes along the way. I expect to make mistakes in the future. All I can ask is that people come with me on my second chances, just like I have come with them. We are all flawed and scarred, which in no way makes us less important or valued or loved. Democratizing publishing. Giving voices to the voiceless. Building a better tomorrow. Share this:TwitterFacebookLike this:Like Loading… leadership Featured Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» 4 responses to “My Leadership Philosophy” Nerd Alert 203: – INN Labs February 1, 2019 at 9:03 am […] Haden was recently named Executive Director of the WordPress project. Read up on her leadership philosophy, and her review of WordPress' strengths and […] Loading… Reply Leadership philosophy – On The Edge! February 1, 2019 at 7:56 pm […] leadership philosophy from my colleague Josepha is great. You should read the entirety here. This is great and overlaps for most people in leadership roles. Bookmarked here for later self […] Loading… Reply Tony Zeoli February 28, 2020 at 3:35 pm You said: “I will lead with honesty and integrity, knowing that I am only as good as my word.” Reminds me of my favorite quote: “Fame is a vapor, popularity an accident, and money takes wings. The only thing that endures is character.” Reminds me also of my favorite street lingo when I was growing up in urban housing in the Boston area: “Word is bond.” Loading… Reply Thank you, WordPress- Shedding Light | not heat October 4, 2024 at 4:46 pm […] still believe that open source is an idea that can transform generations. I believe in the power of a good-hearted group of people. I believe in the importance of strong opinions, loosely held. And I believe the world will always […] Loading… Reply Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
