description = "I bought myself a new bicycle a few weeks back, right before a bit of back to back travel. I’m a returning rider who hasn’t spent any meaningful time on a bike since I was a child, and at first I was mostly worried about looking foolish. Side Note: Worries over looking foolish are in…"
full_description = "New Old Hobbies June 17, 2024 I bought myself a new bicycle a few weeks back, right before a bit of back to back travel. I’m a returning rider who hasn’t spent any meaningful time on a bike since I was a child, and at first I was mostly worried about looking foolish. Side Note: Worries over looking foolish are in my top ten reasons for not trying new things, even when they are old things. Although, if it’s something I know I’m good at, I have no worries about looking foolish—I don’t know what the term for this is, so if you do let me know! I went for my first semi-planned little bike ride today and it was incredibly fun! I still need to practice starting and stopping…probably also need some practice for being around vehicles. But, there was an amazing, carefree feeling of freedom that was borderline childlike and remarkably instantaneous. 10/10, will ride again. Share this:TwitterFacebookLike this:Like Loading… adventures Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» 7 responses to “New Old Hobbies” Aditya June 17, 2024 at 8:12 am I have no worries about looking foolish—I don’t know what the term for this is, so if you do let me know! I think it is a milder form of cognitive dissonance, something more akin to a distaste for newness. Kudos on getting back on the bicycle! Loading… Reply Josepha Haden Chomphosy June 18, 2024 at 6:09 am Thank you! My city is improving its cycling infrastructure, too, so there’s some built in encouragement there 😅 Loading… Reply New Media Works June 17, 2024 at 11:27 am Hey Josepha 🙂 CONGRATULATIONS! 😀 I ride *every*day! 😯 I ride in the sun, I ride in the rain, sleet and snow, away I go! I will not refrain. I will be riding again … SOON. All those endorphins! I want em, I need em, I gotta have em — they’re like a miracle, every day. (#Thats4DeadHeads 😉 ) Um, what did I actually wanna say? Oh, yea: Once, like a decade ago when I stilled used FB (#SadButTrue), I wrote a post asking if “CrayCray” is a real word. I just noticed that string showing up a lot online, and so I asked my peeps. They were NOT happy, and told me stuff I don’t really wanna repeat here. I still don’t know if it’s a word or what it might mean, but maybe *THAT* is the concept you’re trying to put a name on? 🙂 Norbert Loading… Reply Josepha Haden Chomphosy June 18, 2024 at 6:10 am Biking in the sleet seems dangerous! I admit that I’m not quite there yet 🤣 Loading… Reply New Media Works June 18, 2024 at 11:00 am You remind me of when I was a grad student in Madison, WI I used to work quite late in the main library (which at the time was one of the largest in the United States). I was riding my bike home one late chilly winter evening and on one street I was speeding down a thin sheet of ice had developed (probably due to lack of traffic) and as soon as I encountered it my bike slid out from under me and I was sliding on the ice for probably hundreds of feet. I had gloves on, and at that time I always wore a helmet. It was a very funny experience and I was not injured at all. I simply walked over to my bike (which had slid in a slightly different direction than I had) picked it up, got on and continued to drive home. Nowaday I don’t speed quite as much, so it’s not as dangerous. Gloves are ALWAYS a good choice. In the summer, if I do wear them, then the “cut off” version with fingertips exposed. I think hands instinctively go down to break a fall, but not fingertips first (but rather palms or maybe the backhands. Knuckles can get quite easily scraped. Loading… mickmel June 18, 2024 at 4:18 am “Being around vehicles” is my biggest worry when riding a bike, and why I don’t do it often. At least around here, I wouldn’t dream of riding from my house — I’d have to drive to a place where it’d be more safe, thus killing much of that “feeling of freedom”. Loading… Reply Josepha Haden Chomphosy June 18, 2024 at 6:14 am My husband and I were discussing this. He’s from Europe, so the notion of transporting a bike somewhere to ride is ludicrous to him. But I’m with you, riding from home feels risky. I’ve been starting with small rides to build up my knowledge and comfort level. Loading… Reply Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
