full_description = "Cuppow Season! June 22, 2015 The temperatures are reaching up into the 90s in my neck of the woods which means it’s time to switch to iced coffee to get my mornings started right. Which also means it’s time to break out the Cuppow. I make many of my decisions with an eye toward sustainability and conservation and this little drink helper is no different. Now, you can ignore the fact that it looks like a sippy cup of you want to. I embrace it. This is my sippy cup of iced coffee. The Cuppow is actually just that teal plastic insert on top. The rest is a wide-mouth, tall Ball jar and accompanying ring. I purchased metal straws to go in this one for iced drinks, but I also have a clear one that is just a standard sippy Cuppow variety. So every morning this summer, I will be having a cold-brewed, caffeinated beverage out of this quirky and charming cup setup (which has admittedly made appearances on some WordCamp videos). Bring on the heat! Share this:TwitterFacebookLike this:Like Loading… food cuppow, iced coffee, summer Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency =