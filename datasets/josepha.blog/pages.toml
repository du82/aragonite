description = "I have a poorly kept secret to share with you. I love dumplings. Dumplings, by my broad definition, are protein-y type things wrapped in starch-y type things. Those protein-y, starch-y things on things are then cooked somehow... boiled, steamed, fried, baked. There is probably a more technical explanation, but for my purposes this definition is…"
full_description = "Dumpling Obsessed August 7, 2018 I have a poorly kept secret to share with you. I love dumplings. Dumplings, by my broad definition, are protein-y type things wrapped in starch-y type things. Those protein-y, starch-y things on things are then cooked somehow… boiled, steamed, fried, baked. There is probably a more technical explanation, but for my purposes this definition is just about perfect. And by “my purposes” I of course mean the express purpose of eating dumplings and trying to figure out how to make them myself. Take for instance these dumplings here. They have a few names: gyoza, pot stickers, pork dumplings. I’m not sure about the first time I had them, but I’m pretty sure they are what started me on this path of finding/making/eating this type of food. I was so set on finding the perfect recipe and making these dumplings, that my friends hosted a dumpling making party. We probably assembled a couple hundred. We were quite proud of ourselves. After I felt like I’d perfected those, I moved on to: apple dumplings chicken and dumplings samosas (is this a dumpling?) char siu bao (I’m bad at those) xiao long bao (I’m really bad at those) pelmeni empanadas (again, is this really a dumpling?) tamales (def not a dumpling, but also don’t you touch my tamale) So in the end what I’m wondering is this: What sort of dumpling do I need to tackle next? I know there are many many out there I haven’t heard of, but since I haven’t heard of them how can I possibly ever expect to find/eat/make them? Share this:TwitterFacebookLike this:Like Loading… food Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» 2 responses to “Dumpling Obsessed” jfroehlich November 28, 2018 at 7:34 am Well I was looking for something completely different in my twitter feed … But I just can’t ignore dumpling posts. Try Maultaschen or tibetian Momos. When you’d like a taste of Maultaschen just ask when your here next time. Loading… Reply Amit Bajracharya October 3, 2024 at 6:54 am You should definitely visit Nepal. You will get the world’s best dumplings, we call it MOMO. Loading… Reply Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
