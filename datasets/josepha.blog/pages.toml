description = "Working to shed light, not heat. (Check out this presentation at 26:30 for a primer on the concept.) I work with WordPress and have a lot to say about leadership, food, and my dog. Join me on my never-ending journey toward being the change we need to see in the world. Older content on this…"
full_description = "About Working to shed light, not heat. (Check out this presentation at 26:30 for a primer on the concept.) I work with WordPress and have a lot to say about leadership, food, and my dog. Join me on my never-ending journey toward being the change we need to see in the world. Older content on this blog is from a multi-year writing assignment. When I graduated high-school, my mother realized that I was somewhat lacking in my communication skills. She challenged me, in the way only mothers can, to write daily. Though some posts are embarrassingly badly written, or self-centered and shallow, I keep them around to remind myself how far I’ve come. And how right parents often are. I can now communicate complex ideas from beginning to end, without getting myself horribly off track, and even finish with a compelling conclusion. Share this:TwitterFacebookLike this:Like Loading… One response to “About” Jack August 8, 2015 at 2:58 am Your mother was correct. Write something each and every day. Write about anything.the stars and moon reveal to you, and why not. Put words together allowing yourself the joy of discovering life between the words. Just do it. Loading… About Me Josepha is the former Executive Director of the WordPress project, helping to coordinate and guide volunteer efforts across the WordPress ecosystem. She is a trusted open source leader supporting developers, designers, community builders, and WordPress advocates contributing to the web’s most loved CMS. You can hear her thoughts on WordPress and open source on the WP Briefing podcast. WordPress LinkedIn X Mastodon Featured Posts I stopped sharing things with my teams and it’s the best decision I ever made Building a Culture of Safety My Leadership Philosophy Ex Officio: The Best Title You’ll Ever Take The Burden of Proof The Panel Predicament Newsletter Type your email… subscribe Recent Posts Laugenbrötchen Thank you, WordPress A Little Friday Story New Old Hobbies A Thriving WordPress Minute"
