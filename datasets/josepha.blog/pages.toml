title = "To my global community: Start Small- Shedding Light not heat"
description = "When you don’t know where to start, start small, start with what you know, start with people."
full_description = "To my global community: Start Small February 25, 2022 When I woke up on Thursday, I was met with the devastating news that the Russian-Ukraine conflict had escalated. My first thought was, of course, whether anyone in the WordPress community lived in any affected areas. Then, I questioned what I could possibly do about it from halfway around the world. I can’t comment on the specific politics of this conflict and, for what it’s worth, I can’t for the life of me think of the “right” thing to say. But when I don’t know where to start, I generally like to start small. So, I’ll share what I’ve been thinking about for my communities these past few days. While I am certain that my words—no matter how carefully chosen—cannot possibly change the hearts and minds of nations with which I am wholly unaffiliated, I am equally certain that in my own communities there are people who are longing to learn how to help. I know I am. As the world faces war, it’s also the same world in which kindness, community, and integrity co-exist—you are testament to that. WordPress is built on the commitment of thousands of contributors from all over the world to a unified mission. I’m sure many of you are in solidarity with those affected by this week’s events. If you want to show your support, check in on your fellow contributors, friends, or families and let them know it’s okay to ask for help. You can also donate to a nonprofit that offers material relief or refuge to those in Ukraine. And of course, do what you can to stay informed. The world is a much more connected place today than it’s ever been. With all eyes bearing witness, learning, and paying attention, we are better equipped to move toward resolution. But as you do all of these things to support your community, however you’re defining it, remember that you do not personally hold all the responsibility for “making things work” today. We are all here as part of a passionate and compassionate global community—please be gentle with yourselves and others. Share this:TwitterFacebookLike this:Like Loading… leadership, thoughts Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» 4 responses to “To my global community: Start Small” New Media Works February 26, 2022 at 5:57 am Hey Josepha 🙂 I am *SO* looking forward to the possibility of meeting up again this year (@ WCEU in Porto)! IDK if you noticed it (or not), but this post of yours came right smack in the middle of my own writing about stuff like “TEH real world” … 😯 … and so I included a link to it (from my latest post @ socio.business.blog 😉 ). I hope I make it clear enough how I feel your thoughts are very *serious* (IMHO) … and I think that is “enough said”. 🙂 Norbert Loading… Reply The Month in WordPress – February 2022 – Metrikcorp Web Development May 31, 2022 at 4:53 pm […] community. If you don’t know where to begin, or how to support your peers, Executive Director Josepha Chomphosy’s advice to the global community is to start small. Overall, February has been a busy month for […] Loading… Reply The Month in WordPress – February 2022 • Repithwin Blog July 8, 2022 at 12:44 am […] community. If you don’t know where to begin, or how to support your peers, Executive Director Josepha Chomphosy’s advice to the global community is to start […] Loading… Reply The Month in WordPress – February 2022 – WPzoid November 5, 2023 at 1:08 am […] community. If you don’t know where to begin, or how to support your peers, Executive Director Josepha Chomphosy’s advice to the global community is to start […] Loading… Reply Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
