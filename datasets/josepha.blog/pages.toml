title = "Unlucky in Travel- Shedding Light not heat"
description = "I was at dinner with friends recently and, during the course of our mutual catching up, was told that I have the most spectacular stories. We're all travelers in that group, both for work and for pleasure, so the fact that I seem to have the most unusual experiences of all of us is notable.…"
full_description = "Unlucky in Travel January 11, 2019 I was at dinner with friends recently and, during the course of our mutual catching up, was told that I have the most spectacular stories. We’re all travelers in that group, both for work and for pleasure, so the fact that I seem to have the most unusual experiences of all of us is notable. Here are the most memorable circumstances, occurrences, and happenstances from the past year or so: I told a 20-something man to stop verbally berating an older woman who was struggling to lift her luggage. He looked as though he might strike me, and for a moment I was worried he would. He did not.A ticketing agent argued with me about my name for 10 minutes. She called a “Joseph Haden Chomphosy” to the desk, and I was sure it was my name but had gotten cut-off. We resolved it with me saying “If you think that somewhere on the planet, there is both a Joseph AND a Josepha with my last name and they both just happen to be in this building at the same time, you have a lot more faith than I do.”A passenger had a panic attack in the door of the aircraft and her service dog got loose and wandered around the cockpit.I flew out of an airport that was so small it hadn’t started taking electronic tickets yet. To this day I am not sure how they managed to get me on the plane, because it wasn’t with a paper ticket.I had a long conversation about the educational system and how it doesn’t properly account for populations that suffer from systemic inequality.On an entirely different flight, I had a long conversation about racism, college application processes, and real estate.Three times I have practiced an upcoming presentation on random strangers (because our flights were delayed).I was sent through security three times in 15 minutes at the same airport. They tested the same bottle every time even though it had been marked by them already.I have been transported by random, non-taxi cars by two separate travel companions and have lived to tell the tale.Twice I have shown up to an airport, ticket in hand, and been told that I am not a ticketed passenger. And I didn’t even travel that much last year. I was recently told by an absolutely brilliant woman that the best place for observational research is an airport, because that’s when people are their most honest selves. But if I believed what airports have to say about me, you’d think I was the unluckiest traveler around. 🙂 Share this:TwitterFacebookLike this:Like Loading… adventures, funny, travel Posted by:Josepha Haden Chomphosy Since 2019, Josepha Haden Chomphosy has served as the Executive Director of WordPress, the most widely used content management system in the world. She is passionate about creating inclusive communities and helping people develop the skills they need to succeed in the digital age. Josepha is known for her leadership skills, her passion for open source software, and her commitment to creating a more equitable and inclusive tech industry. She is a sought-after speaker and mentor, and has been recognized for her contributions to the world of technology and beyond. You can read her occasional writing on josepha.blog «Previous Post Next Post» Have a thought? Leave a comment!Cancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
