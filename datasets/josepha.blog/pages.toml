full_description = "random Compliments for 100 Dollars January 29, 2020 I walk past a middle school at lunch every day. Most days we all just carry on with our own work (mine: dog walking, theirs: game playing), but today was different. As I walked by the school yard, one of the kids kicked a ball over the fence and across the street. She asked if… Continue reading conversations, funny, Pepper, random Immortality, Space, and Doctor Who December 23, 2015 First, let’s rip the bandaid right off this post’s title. I don’t plan to talk about The Doctor. He was merely an afterthought in this conversation that happened, naturally, over beers with friends at our local bar. Join me as I recreate this short and silly thought experiment. Practical Problems with Immortality Imagine for a moment, that… Continue reading funny, random, thoughts My Unfortunate Week July 8, 2015 This past week I experienced a spectacular intersection of a number of under-the-weather situations. In general, this isn’t a fun intersection to find yourself in, but I’m back and better than ever! And if I’m not better than ever, at least I’m more coherent than I was last week which is a huge benefit. Continue reading random, travel Hanging Ivy May 14, 2015 Hanging ivy is beautiful as ground cover or, in this case, as a building cover. Not all hanging ivy is destined to be a building killer, but many years ago there was a fuss about Yale schools removing the ivy from their buildings. Plants have that same destructive power as water; it may take forever, but even… Continue reading random daily post, force of nature, ivy Why I Don’t Love Ninjas Quite as Much as Spies. January 26, 2010 Okay, now ninjas. I don’t love them quite as much and it’s because of one key difference. They get Back Office, Cool Tricks, and Blows of Justice. But they are also just one giant secret. No external charm with a secret agenda to save the world. Just darkness and secret. Which is why I can’t… Continue reading random Flooble May