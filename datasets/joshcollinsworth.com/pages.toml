["https://joshcollinsworth.com/blog/enjoyed-in-2024"]
title = "Things I enjoyed in 2024 - Josh Collinsworth blog"
description = "Things I watched, read, played, got into, enjoyed, or did and would do again, in 2024."
full_description = "Things I enjoyed in 2024 Published: December 24, 2024 Updated: December 31, 2024 [ Table of contents ] Gaming Tabletop games TV shows Reading Gear and tech Food and drink Personal, random, and other I suppose it’s natural to look back at January from the perspective of December and feel you’re looking at something from ages ago, like a dream or another life. 2024 was a packed year, full of change and unexpected surprises of every variety. A ton of this year was positive, especially the stuff having to do with my son. He graduated pre-k and started kindergarten; he played his first team sport (basketball); he’s grown in every way, and he’s the source of a great deal of the good things the year brought (even if parenting is also the source of many of the year’s challenges). We got to know our neighbors better. We’ve met lots of new people since our kid started school, and it feels like we’re starting to develop a little bit of a social network for the first time since moving to Kansas City two years ago. (Or at least, our kid is, and we’re tagging along.) Thanks to kindergarten, my wife and I have been able to resume going to the gym on a regular basis (a habit that had been decimated by the 1-2 punch of our son being born followed by the pandemic), and that’s been a major positive change. I was generally healthier this year, and felt that change mentally as well. Work-wise, I got the opportunity to travel to both San Diego and Dublin on work trips, and took part in launching a lot of cool projects. In my first full year at Deno, I helped to redesign, rebuild, and launch a new deno.com homepage twice; revamp most of the rest of the website; launch JSR; take on Oracle over the JavaScript trademark; remake the Deno Docs site; and—probably biggest of all—released Deno 2.0. At the same time, though, 2024 brought a lot of personal challenges. This list is meant to be positive, so I won’t dwell on the parts of the year that weren’t. Still, I have mixed feelings on my year, and it would be disingenuous to ignore that. There were losses, setbacks, and closed doors. Some of those challenges are in the “done” column; some might not ever move out of the “in progress” column. Some are ultimately trivial (like incompetent contractors—if you live in the Kansas City area, I’ve got a fencing company to avoid at all costs); some are more deeply personal. Among other things, my wife lost her grandpa this year, and I lost a respected and admired friend. I have a good life. Better than good. Still, I feel like I’m just barely keeping my head above water a lot of days. You’re going to see a lot of video games on the list below. It’s quite possible this was my most gaming-heavy year ever. That’s because I was frankly in a slump; with everything else going on, I rarely found my motivation this year. I didn’t create as much in 2024, and while I regret that, I don’t know that I could’ve done anything about it, either. It’s just something I had to work through, I think. I hit a long dry spell with blogging, and although I tinkered with side projects on and off, I never really found one I wanted to stick with. If it weren’t for WordPress drama and the election, this would be my first blog post in over half a year. But, I say all this only to acknowledge it. The year held many bright spots for me, and I’d like to spend the rest of this post talking about those, from the trivial to the meaningful, and everything in between. Gaming Things I played and loved this year in the world of video games include the following… Balatro Balatro has, at this point, become my most-played game ever. I put in over 300 hours of Balatro this year. While most of that time was on Switch, I also played on Steam and mobile (where it’s actually surprisingly good, i.e., dangerously distracting). Balatro (latin for “jester,” and no, nobody else knows how to pronounce it either, so just pick a way) is an unbelievably fun roguelike deckbuilder. But in case those words don’t mean anything to you: Balatro could accurately be described as poker solitaire. That is: you play with a standard four-suit, 52-card deck, and use limited discards and redraws to assemble poker hands, in order to score ever-increasing amounts of points. The more difficult the hand is to make, the more points it’s worth, naturally (e.g., four of a kind is worth far more than a pair). The game is nothing like poker aside from the hands, however; there’s no betting or bluffing, and you’re only playing against yourself, really, to score the required number of points per round. Like I said: almost a kind of solitaire. The fun comes in with the jokers: each of the game’s 150 joker cards act as a permanent power-up that adds a twist to the game’s rules. Some impact cards of certain suit(s); some give bonuses for certain hands or play styles (and possibly penalties for others); some have wild, game-breaking effects, like multiplying your score, growing more powerful over time, or altering your deck. You can generally have five active jokers at a time, which makes this a game about assembling the perfect combo and watching it go off like a satisfying Rube Goldberg machine. There are lots of other ways to alter the rules and the deck, too, so you’re constantly making interesting, strategic decisions in this game. You “win” at a certain point, but if you like, you can keep going just to see how far the point-scoring machine you’ve assembled can go. Either way, eventually you’ll hit a number that’s too big to reach, and you’ll start the whole thing all over again—possibly unlocking some new jokers for next time. It’s difficult to describe how weirdly fun Balatro is, but trust me: you should play it. (Just maybe not as much as I do.) Animal Well My first playthrough of Animal Well, I made the mistake of thinking I’d mostly done all there was to do, and put the game down with a contented but underwhelmed shrug. I thought I’d just finished a short but interesting Metroidvania, and I stopped. But I misjudged Animal Well severely. You play as a cute little blob-like thingy, just trying to find its way through a mysterious and beautiful retro world chock-full of various kinds of animals (some friendly, some not), with the help of fun items you gradually discover, like a yo-yo, frisbee, slinky, and bubble wand. Each item has multiple uses, and allows you to explore new parts of the world, until you eventually reach the “final boss.” That’s Animal Well at first glance, and you could finish that first round of it and be left with a perfectly satisfying (if somewhat short) Metroidvania experience. The genius of Animal Well, however, lies in what happens after you finish the game: you’re dropped right back into it. And this is where I made my mistake. As in its obvious inspirations Fez and Tunic, you can complete the main goal in Animal Well without ever discovering everything the world has to offer. The map is full of easily missed riddles and surprises, and there’s a whole second goal of the game after you beat the game’s so-called final boss the first time. Follow far enough down the rabbit hole (that is: collect all 64 of the eggs cleverly hidden throughout the map), by unraveling many of the game’s harder puzzles, and you’ll eventually reach the “true” ending. (And if that’s not enough for you, there are even deeper and more deviously cryptic puzzles quietly waiting, but most players probably won’t be compelled to go quite that Pepe Silvia.) It’s got some rough edges here and there, and it might not be for everyone. But if you’re at all a fan of games that which drop you into a world full of clues to puzzle over and assemble yourself—what does this item do? Why is that animal moving like that? Am I supposed to know what this inscription on the wall is for?—you owe it to yourself to try uncovering Animal Well’s secrets. Neva Neva is a bit like if Studio Ghibli made an interactive silent film about a girl and her pet. The story is beautifully told without any words at all: you play as Alba, a young woman who rescues an orphaned, dog-like magical creature named Neva. The story follows the pair as they survive and travel together through Neva’s strikingly gorgeous world, which is under siege by a mysterious dark energy that took Neva’s mother. The narrative unfolds in four discrete chapters, one for each season of their first year together. As the seasons change, Neva also changes. As Neva grows, so do her abilities, often in completely unexpected ways. The pair’s relationship—and how they tackle the challenges in front of them—continuously evolves as the game progresses, and you can’t help but feel for both of them as you guide their journey. You could call it a game about survival, or redemption, or a grand quest. But at its heart, Neva never stops being a story about the love between a girl and her pet companion. I gasped, I smiled, and I had tears in my eyes at least once or twice. Neva isn’t a very long game—I think I finished it in around 4 hours (though there are some optional achievements after that)—but every minute hits perfectly. It’s like a brief but beautiful novel that you can’t stop reading; it will stay with you for much, much longer than the afternoon you spend together. As I posted on Bluesky the moment I finished the game: if you are in possession of both a gaming system and a heart, you should play Neva. Chants of Sennaar Chants of Sennaar is more of a pure puzzle game than Animal Well, and probably more accessible as well. Its riddles are more straightforward, and most of the game’s challenge is mental. In fact, it’s pretty close to being a point-and-click, or a Myst-like. In Chants, you navigate a massive Babel-like tower/city, where all the inhabitants speak in inscrutable runes. Your job, with the help of a trusty notebook, is to decipher what each rune means, so you can understand the lexical rules of the language, and in turn, the people and signs of the level, in order to solve puzzles and progress. There are five levels in the tower, each with its own unique class of inhabitants who have their own language. Each language has its own runes and syntax. So once you’ve gotten one floor’s language figured out, you start another, slightly more complex language, until eventually you reach the top of the tower. It might sound academic, but it’s engaging and highly rewarding to put together the clues of each language, and have that “ah-ha!” moment of finally understanding what that thing you’ve been staring at actually means. Chants has some flaws; there’s a lot of backtracking, and the game’s occasional stealth sequences, though forgiving, can also be tedious. But it’s another intriguing puzzle game with a “good” ending waiting to be discovered for people who are willing to delve fully into solving its mysteries, and I found it to be the perfect blend of accessible, but satisfying and highly worthwhile. (One note: you regularly type in this game to make notes for yourself. This wasn’t an issue for me in the Switch’s handheld mode, but it could be cumbersome docked, or on any other standard console without a keyboard or touchscreen.) Arranger Arranger, which bills itself as “a role-puzzling adventure,” is a short but delightful puzzle game built on a mind-blowingly simple premise: what if, instead of your hero moving around the world, the world moved around your hero? It’s tough to explain, but: Arranger takes place on a grid. Whenever you move, you actually stay put as the ground turns into a conveyor belt that just shuffles you (and anything else on your row or column on the grid) over to the next spot. This means moving around is really all you do (there’s no combat or other reflex-based gameplay to speak of), but you have to figure out what way to shift the world around to get obstacles out of your way, or occasionally, move an object so that it interacts with a static enemy blocking your path. It’s a fresh new branch of Sokoban-style puzzles, and an ingeniously clever mechanic that makes up the core of the gameplay. Although the game introduces a number of interesting twists on the idea, there are far more possibilities than this brief adventure has time to fully explore. It’s a short, highly accessible gem of a puzzle game, with memorable characters and story, plus some lovely hand-drawn artwork. Highly recommended for anyone who enjoys puzzle games, or just a good story about a misfit who finds their place and saves the day. (There’s more depth to the ending than that, though, but I’ll let you discover it for yourself.) Prince of Persia: the Lost Crown I’ve never played any other game in the Prince of Persia series, but I picked up The Lost Crown up on a recommendation, and I’m glad I did. It’s a reboot of sorts—no previous serious knowledge required—and maybe the year’s best pure Metroidvania, with a huge world full of secrets to explore and interesting abilities to use and upgrade. You’re constantly finding new areas, and upgrading both your combat and movement abilities. There’s a perfect blend of exploration, puzzle solving, and combat to be found here, and Sargon (the protagonist) moves through the world with satisfying speed and agility. The story and characters are memorable, and the parry-driven combat is top-notch, even though I found the late-game difficulty a bit frustrating. (In fairness, I was just trying to brute-force my way through to the end before Animal Well came out, though.) There’s plenty to find, and lots of ways to customize both the hero and the gameplay to your personal preferences. If you’re at all a fan of the genre, this one’s well worth exploring, and I’ll likely replay it myself at some point in the future. I know I didn’t find nearly everything the world has to offer, and it would be a pleasure to explore it again. Thank Goodness You’re Here! From the publisher of Untitled Goose Game comes another silly game about running around and checking off tasks as a goofy protagonist, but this time in a northern English village full of offbeat weirdos. Thank Goodness You’re Here! is legitimately the funniest game I’ve ever played. The dialogue, jokes, and quirky illustration style combine to create something like if Monty Python made Adult Swim cartoons loosely inspired by the idyllic village in Hot Fuzz (and featuring the voice talents of Matt Berry, among others). It’s a short game that requires virtually no reflexes or other traditional gaming skills—all you actually do is move around and slap things until something happens—but when it does, it’s always funny. Almost more like a goofy interactive movie than a game, you could easily clear Thank Goodness You’re Here! in a couple of hours or so—but it’s still absolutely worth the journey. I was laughing at the game’s bizarre, hilarious absurdity the entire time. The Plucky Squire The Plucky Squire is a beautiful blend of heartwarming, nostalgic, and experimental. It’s a great family game, and one I would’ve gone absolutely "
