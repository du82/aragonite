full_description = "Featured project: Quina Quina is a strategic, logical word game, built from scratch with Nuxt. The gameplay is based on classic pen-and-paper word games (think: Mastermind, but with words), but the app and design are 100% original. Quina was released December 2020 as a progressive web app and on the Google Play store. Version 2.0 was released in spring 2022 (with an overhauled game board, a daily puzzle mode, and new achievements). Version 2.0 was also released on the iOS App Store. Quina on iOS Quina on Android (Note: because of privacy policies hostile to small developers, I've removed all apps from the Google Play store indefinitely, in order to protect my personal data.) Quina on the web GitHub repo Read about the making of Quina on this blog and on CSS Tricks Hondo Another word game, this one built with SvelteKit, and a bit more akin to Wordle (but with some twists and more complex mechanics). The goal is to guess as many words as possible in a row, earning bonus points for streaks, to get to 100 points as quickly as possible. Hondo on iOS Hondo on Android (Note: because of privacy policies hostile to small developers, I've removed all apps from the Google Play store indefinitely, in order to protect my personal data.) Hondo on the web GitHub repo Read about the making of Hondo SvelteKit static blog starter A fully open-source, pre-configured starter for a SvelteKit blog. Includes Markdown and Sass preprocessing; has mdsvex with rehype plugins pre-installed; and includes automatic prefetching of top-level routes, an RSS feed, and a JSON API. Live demo GitHub repo sveltekit-static-starter.netlify.app CSS Easing playground Created for this blog post, this interactive playground lets you examine how a variety of easing curves look and feel, and allows you to draw up your own and copy the CSS. Every curve on the page is an SVG, including the interactive demo, which is accessible across device types. The curve redraws in real time as the handles are moved, and an animated node follows the curve to demonstrate the movement. Live demo joshcollinsworth.com/demos/easing"
