 and UX leaders on customization options for React design components, enabling bespoke implementations for individual landing pages Implemented targeted “home cards” in Rails, alerting eligible users of new features, determined by locale, language, subscription and/or installed apps Operated as lead developer on multiple web page internationalization projects, launching marketing pages and offerings for many international locales and languages Worked with internal stakeholders to improve SEO and conversions, including implementation of A/B testing Reviewed code, proposals and pull requests across teams Administered code exercise interviews and feedback for prospective applicants Various publications Freelance technical writer Including articles published for: CSS Tricks LogRocket blog The Layout (misattributed) Aware3 Senior JavaScript Developer February 2021 – August 2021 Actively mentored and paired with junior engineers, helping to level up their skills and increase their knowledge and adoption of best practices in front-end, framework, and testing Built out new financial reporting features and filters aimed at giving admin portal users customizable insights into org. finances, giving and transactions (including year-over-year, LYBUNT and SYBUNT) Created and delivered a one-hour training on engineering web accessibility, covering ability types, assistive technologies, semantic HTML, ARIA, WCAG, and inclusive color, text, images and focus Worked with designers to build out design system in Storybook and implement new components in Vue/Knockout, ensuring consistent, pixel-perfect UI, and tight coupling with backend Laravel application data Independently authored unit tests with Karma, Mocha, Chai and Sinon to ensure code reliability Updated visual regression and acceptance tests as needed Initiated a streamlining of the ticketing and pull request processes to improve efficiency and team communication by reducing redundancy by consolidating to a single universal wor