title = "If WordPress is to survive, Matt Mullenweg must be removed - Josh Collinsworth blog"
description = "I believe Matt Mullenweg's abuses of his unilateral, unchecked powers prove that it is in the best interest of the entire WordPress community that he be removed from power immediately."
full_description = "If WordPress is to survive, Matt Mullenweg must be removed Published: September 27, 2024 Updated: January 11, 2025 Note This post is a little more hasty than some of my others, in the interest of keeping up with unfolding events. I hope you’ll bear with the jumble of thoughts. It’s being actively edited; use the table of contents below to jump to any updates. Cover image from this Etsy store (unaffiliated). [ Table of contents ] Wait, who are you and why do you care?I’m sorry, what happened?Automattic approaches WP Engine to offer a “license”Matt’s rejected, so he tries new strategiesWait—what’s Matt’s actual deal? Why is he doing this?Matt claims WP Engine is misrepresenting itselftt claims WP Engine is selling a “cheap knock-off” of WordPressMatt says WP Engine doesn’t give back enoughAn aside on motivations and justificationsThe WordCamp US fallout and Matt’s abuse of powerWP Engine’s reactionMatt melts downMatt goes nuclearUpdates: everything that’s happened since October 1st10.1: Matt talks taking over WP Engine10.1: Automattic releases the terms sheet, which kinda backfires10.2: WP Engine files suit against Matt and Automattic10.3: Matt offers buyouts to Automattic employees10.4: 159 Automattic employees take the buyout; Matt hires a famous lawyer who’s a horrible human10.5: Matt gleefully exposes a vulnerability in ACF, but prevents WPE from fixing it10.11 Matt adds a vague anti-WP Engine checkbox to WordPress.org, but fails to clarify why, all while playing the victim10.12 Matt commandeers ACF, using WordPress.org to steal a competitor’s product10.15: Previous lawsuits against Matt come to light10.15: Matt responds to the “other lawsuits”10.17 Matt wars against dissenters with second buyout offer; threatens employees who speak out; intercepts employees’ emails10.21: WP Engine files an injunction to regain access to WordPress.org10.23: Matt responds, saying WordPress.org belongs to him and him alone10.24: It’s been a week, and Matt’s apparently still balking at that latest employee buyout offer10.28: Matt cries freedom of speech, but censors speech he disagrees with10.29: Other plugin developers begin removing their work from .org; Matt threatens takeover instead11.10: Automattic taunts WP Engine with loss tracker website, which likely uses data mined from .org11.26: Automattic bypasses .org plugin approval process to release a stolen version of ACF Pro12.10: WP Engine wins injunction; Automattic must restore services and cease interfering; Matt has a childish breakdown in Slack1.10: Matt continues learning nothing, missing the point entirely, acting like an abuser, and burning WordPress to the ground1.11: Matt “announces” new WordPress fork that doesn’t exist, bans its theoretical participantsIf Matt cares about WordPress, he should step down immediately. And if Matt won’t step down, he should be removed.Addendum: on the future of WordPress There are some people who think being right about something confers the right to do whatever they think should be done about it; a license to act however they see fit in order to correct what they see as wrongness. This, of course, is never the case. No matter how egregious the original infraction, there are some responses it never justifies. That’s such common knowledge it’s proverbial: two wrongs don’t make a right; the ends don’t justify the means; etc. Doing the wrong thing for the right reason doesn’t makes it the right thing. Matt Mullenweg appears to have decided those truisms don’t apply to him, as he’s effectively spent the week causing destruction and collateral damage to countless WordPress sites and users, in his fight with one of the community’s landlords. Matt has, for far too long, enjoyed unchecked powers at the top of WordPress—powers which are all too often a direct and flagrant conflict of interest. And while we’ve seen this power abused before, we’ve never seen it on this scale. Some might agree with Matt’s original reasoning. But his egregious actions and reactions since then have utterly nullified any previous merit. A line has been crossed, and the entire community is worse for it. I believe that if WordPress is to survive, let alone thrive, Matt Mullenweg must be removed from all forms of official WordPress leadership, as expediently as possible. I believe that if WordPress is to survive, let alone thrive, Matt Mullenweg must be removed from all forms of official WordPress leadership, as expediently as possible. Wait, who are you and why do you care? Let’s get this out of the way right off: I’m not the best person to be talking about this. I haven’t really been involved in WordPress for about five years now. Honestly, I couldn’t tell you the last time I even logged in to a WordPress site. That said, however: I spent some six or seven years of my life deep in the WordPress world. I built and customized WordPress sites for clients as a designer; I taught a WordPress development course (focused on building custom themes in PHP) for about five years; and I worked in support for Flywheel, a managed WordPress hosting company, for a little over five years. It was there I transitioned to full-time frontend work, building tools to help support WordPress sites. So while I’ve been out of the WordPress game for a good while now, I still might be considered an expert next to your average Joe. I’d like to think I could still sling some theme templates with the best of ‘em. (Hell, some days I even get a little nostalgic and think about booting up a Local site just for fun.) You might have spotted the word “Flywheel” up there and realized that company was acquired by WP Engine—the company with which Mullenweg is publicly feuding at the moment—back in 2019. That might reasonably raise questions of my objectivity, so let’s get this out of the way: Yes, I used to work for WP Engine. I even kinda liked them, for a while (mostly while they just kinda left us alone for the first year or so). But I wouldn’t say my time at the company left a good taste in my mouth. We don’t need to dredge up a bunch of old and buried stuff that isn’t really important anyway, but suffice to say: I really don’t have any reason to be a WP Engine cheerleader. Most of the people I knew there have left, and I’ve watched from the sidelines as the company has implemented a bunch of scummy policies and shady sales tactics to squeeze money from their customers and make it harder to leave. (Oh yeah: they also like to brag about record growth and profits in the midst of layoffs.) On most days, if you wanted to have a conversation about how much WP Engine sucks, frankly, I’d be a happy participant. So this post might be a lot of things, but I can assure you it’s not me defending my old company just because I used to work for them. I’ve got literally no reason to do that. To the extent I’m on WP Engine’s side, it’s not because of any sense of loyalty to the company or to the remaining good people I know there; it’s because I believe what Matt’s doing is deeply wrong and foolishly destructive. To the extent I’m on WP Engine’s side, it’s not because of any sense of loyalty to the company or to the remaining good people I know there; it’s because I believe what Matt’s doing is deeply wrong and foolishly destructive. I’ll also go on record as saying I got pretty far in the interview process at Automattic once, a few years back. And, since we’re being honest, it was the absolute worst interview process I’ve ever taken part of as a web professional (though the people themselves were lovely). But that alone ain’t gonna get a post out of me. I’m not wasting my time and yours just to gripe about an interview I chose to drop out of over three years ago. Just thought it merited a mention. I still regarded Matt Mullenweg himself pretty highly after that, up until the last year or so. This post isn’t long enough to get into the details, but Matt had already become a pretty problemat(t)ic character well before any of this went down. So in summary: I’m not a big fan of either party, and I don’t have any good reason to side with either one of them. I am, however, somebody who still cares deeply about WordPress. It’s what gave me my start, and I still recommend it to a lot of people when they ask me what system might best suit their needs. It’s a wonderful community, all in all, and despite my inactivity, I still feel invested in WordPress, and interested in seeing it continue to be a productive way to democratize the web. Finally: I am not a lawyer, and since it’s Friday now and this feud had already reached lawyers-involved level by Monday morning, I should be careful to clarify any legal commentary here is expressly my personal, non-expert opinion. I’m sorry, what happened? For those of you who haven’t been following the story thus far (read: aren’t chronically online web nerds like me), let’s hit the highlights. Automattic approaches WP Engine to offer a “license” Sometime in or around July of this year, Automattic (Matt Mullenweg’s for-profit company, which owns, among other things, WordPress.com, a major WordPress hosting company) reached out to WP Engine (also a for-profit company that offers WordPress hosting, and probably Automattic’s largest business rival). Automattic was offering WP Engine some kind of “licensing,” at a rate of 8% of total business revenue, adding up to the eye-popping sum of several million dollars per year. WP Engine apparently turned down this offer, presumably because it doesn’t appear they actually need any license. The term “WP” is explicitly not covered by the WordPress trademark policy, and using the term “WordPress” to describe products and services (e.g., calling yourself a “WordPress specialist,” or saying you offer “WordPress hosting”) is fully allowed, according to the policy. They’ve also been in business for like 15 years now, and somehow none of this has come up before. Besides, I could name dozens of companies just off the top of my head also using one or both of those terms. So the “you need a license to say this” argument seems highly targeted and extremely dubious. Matt’s rejected, so he tries new strategies Immediately following WP Engine’s rejection, the WordPress Foundation (the nonprofit side of WordPress, the open source software, and which Matt Mullenweg also runs, in effect if not nominally) filed to trademark the terms “Managed WordPress” and “Hosted WordPress.” Neither trademark has been granted at this point, nor should they; they’ve been in use for ages, and are obviously far too generic for any one organization to hold. Most reasonable and knowledgeable people seem to share this opinion. Companies have been describing themselves as one or both of those terms for around 15 years at this point. (We freely called Flywheel a “managed WordPress hosting company” the entire time I worked there, and we were far from the first. We were also at one point one of WordPress.org’s recommended hosts. So…obviously, not a big deal.) Anyway, this filing of spurious trademarks makes it appear very much like Matt’s endgame was to extract money from WP Engine, but he just needed more of a foundation to do it (pun intended?). So, following that initial rejection, Matt set the Foundation arm of WordPress working on securing highly dubious trademarks, which, again, I and most reasonable observers think and hope will fail. Meanwhile, Matt also began sending a series of very apparently extortive messages to WP Engine leadership, essentially demanding they pay up or else. (This is all in WP Engine’s letter to Automattic, which I’m getting to, but which comes later in the story.) All of this was in the run-up to WordCamp US, the largest WordPress event of the year, at least in North America. (Of note: WP Engine sponsored this event at the highest level, as did WordPress.com.) Matt let WP Engine leadership know, via private DMs, that he intended to “go nuclear” and “scorched earth” on WP Engine in his keynote at the conference—that is, if WP Engine failed to acquiesce to his monetary demands, i.e., 8% of total revenue, i.e., tens of millions of dollars. It appears he repeated the “just pay up and I’ll make this all go away” offer up to the literal last minute before he went on stage. Let’s not beat around the bush: words like “threat” and “extortion” very much apply to Matt’s behavior here. Let’s not beat around the bush: words like “threat” and “extortion” very much apply to Matt’s behavior here. Update 9/28/24 I left out that Matt’s demands included the alternative option for WP Engine to “pay” in contribution hours; i.e., instead of cash, they could just donate employee work hours to WordPress. I didn’t feel this was important, since ultimately it all shakes out the same—it’s an identical sum of money that WP Engine is paying, one way or the other—but I suppose it’s relevant information. End update Again: this demand was ostensibly in exchange for a “license” to use terms like “WordPress,” “WordPress hosting,” “WooCommerce,” etc.—none of which appear to be actually necessary. The only possible exception seems to be “WooCommerce,” which is a trademark (and product/company) owned by Automattic. However, the lines are very blurry on what is and is not permissable when it comes to using the WooCommerce name. WP Engine does indeed call one of its offerings “WooCommerce hosting,” which is explicitly called out in the guidelines. So I don’t know, maybe there’s validity there. Maybe. However, for one thing, it’s hard to know whether, or how much the trademark guidelines might have changed. Matt made several changes to the WordPress license page in the last week, among other things, to call out WP Engine. That makes me not trust that the WooCommerce license page I’m looking at today is the same as it was last week—which, all on its own, should be setting off raging alarms for even the most casual of observers. It’s extremely bad news when the company you’re doing business with can just decide what the new terms are with no warning or recourse. Anyway, Matt keeps sending the DMs all the way up until the literal last minute, offering not to excoriate WP Engine onstage during his keynote at the country’s (continent’s? world’s?) largest WordPress event, provided they simply pay up. Once more: I’m no lawyer, but I’m pretty sure that’s called extortion. WP Engine says no (actually, they ask for more time, which Matt denies and takes as a no), so he proceeds with operation “scorched earth,” and blasts WP Engine both onstage at WordCamp US, and in several other venues. Wait—what’s Matt’s actual deal? Why is he doing this? Aside from the licensing issue, which I covered above (and which seems like a mostly flimsy premise to me), Matt’s got some other complaints with WP Engine. Some have validity, some seem completely made-up. Let’s walk through them. Matt claims WP Engine is misrepresenting itself Among Matt’s complaints: that WP Engine is “misrepresenting” itself as an entity that’s officially af"
