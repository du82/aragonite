title = "Ten tips for better CSS transitions and animations - Josh Collinsworth blog"
description = "Creating high-quality, polished web animations is both a science and an art. This post covers the best things I've learned over the last decade of crafting web UIs."
full_description = "Ten tips for better CSS transitions and animations Published: February 28, 2023 Updated: March 12, 2023 Note This is a followup to the post Understanding easing and cubic bezier curves in CSS. (This is also the original URL of that post.) If you came here looking for that—or if you don’t already have a solid grasp on CSS cubic-bezier curves—I suggest reading that post now. There are certain things you just know when you experience them, even if you don’t know where the intuition comes from, or can’t quite put into words what it is you recognize, exactly. You might not know anything about interiors, but you feel it when you’re in a well-designed space. Similarly, you can likely distinguish a good app from a bad app, even if you can’t explain what makes one feel better than the other. In just that same way: users may not realize what it is about the transitions or animations on our websites and apps, but they can keenly spot the difference between good and bad. They intuitively know when an app’s movement feels good, and when the impression is instead generic or unpolished—even if they can’t explain how or why. So to get a better understanding of what’s giving off those vibes—and how to sidestep the bad ones when building your own UIs—I’ve assembled this collection of things I’ve learned about crafting transitions and animations on the web over the last decade or so. While “transition” and “animation” are distinct concepts in CSS, I’ll continue to use the words mostly interchangeably here, to mean “any kind of movement or change.” 1. Make it shorter than you think it should be I get it; if you just poured your time and effort into creating a great transition, you want to enjoy it. If you’re like me (and most other developers), you might even just sit there admiring your fanciful animation, watching it transition back and forth in delight. But here’s the thing: The absolute #1 dead giveaway of poorly designed movement is that it lasts way too long. The absolute #1 dead giveaway of poorly designed movement is that it lasts way too long. Your users aren’t as enamored—and therefore, not as patient—as you are. They came here to get something done, and they aren’t interested in waiting longer than they need to, regardless of how cool it may be. My advice is: try to make your transitions as quick as possible, without being so short that a user might miss them. As a rule of thumb, I find that most single transitions work best somewhere in the 150–400 millisecond range (0.15 to 0.4 seconds). If you have back-to-back transitions—as one element moves out then another moves in afterwards, for example—you can double that, and add a little time between them, too. (You wouldn’t want the whiplash of two separate animations rushing by.) Keep making it faster until it feels too fast, then back it off just a little. Keep making it faster until it feels too fast, then back it off just a little. That said, however: there are always exceptions, and the bigger the change is on the page, the more noticeable the transition should probably be. There’s a big difference between, say, a nice little accent animation for the number of items in your cart updating, and an entire page transitioning out. Don’t let big changes go by too fast. One final point worth noting: an animation might not always feel as long as it actually is. A transition with a very slow ease-in might seem like it doesn’t start right away; conversely, a transition with a long tail might seem finished before it technically is. Keep that in mind. Perception is reality, so how the change feels is more important than what the duration technically is in the code. 2. Match the curve to the action Admittedly, this is easier said than done. You might be saying “ok, great, but how do I actually know which kind of cubic bézier curve to use in any given situation?” The unsatisfying answer is: trial-and-error (otherwise known as experience) is the best teacher here. Movement is as subjective as color, but it’s also as important. It’s a key part of the feel and branding of your website or web app. Movement is as subjective as color, but it’s also as important. It’s a key part of the feel and branding of your website or web app. That said, there’s a trick to keep in mind: as you experiment, think of movement in the real world, and compare it to the movement you’re working with in your app. Is this transition a positive confirmation, appearing and sliding into place? That might call for a speedy intro with a smooth but quick easing out, like an eager helper running up to report their task is done. How about a failure message appearing on the screen? That might call for a slightly slower easing curve, to indicate a slight reluctance. If it’s something important that should be known about immediately, speed and apparency would be a priority. If it’s highly critical, it might even call for a more aggressive movement (like shaking), to convey the severity and draw attention where needed. So my best recommendation is: invest the time, and ask whether the movement conveys the appropriate feeling. Does this movement seem consistent with the brand of the product or page? If Pixar animated a robot that did the thing your UI is doing, how would it move? 3. Accelerate and decelerate In the real world, we pretty much never see any type of movement jump immediately to max speed, or come to a full and complete stop instantaneously. So our UIs will seem a little more “real” and intuitive if we avoid curves that create that kind of movement, too. When something seems off about an animation, odds are it’s because it either starts or ends with unnatural suddenness. When something seems off about an animation, odds are it’s because it either starts or ends with unnatural suddenness. Even if it’s slight, I’d still recommend adding a bit of easing in and out to your cubic-bezier curves. That small but detectable bit of acceleration and/or deceleration could be the difference between a transition that feels smooth, and one that seems just a little off. Take a look at this demo, where all four squares rotate a full turn, but with different easings applied: See the Pen Untitled by Josh Collinsworth (@collinsworth) on CodePen. Notice how the first and second squares above seem to start or end much too abruptly. The third “smooth” option works much better, as its custom curve eases in and out for a more graceful movement that accelerates and decelerates. If you want to go even further toward animation that feels like it has real-world physics applied, the fourth “inertia” option works well, too; it “winds up” and overshoots, as though powered by a spring. (Just bear in mind: a little goes a long way with this type of animation.) One important note on sudden starts and stops, though: it’s fine if the user can’t see it. If the object in question fades in, then a sudden start might be fine (since the beginning of the animation won’t be perceptible in the first place). The same goes in reverse; if an element is fading to opacity: 0, then it may not matter exactly how the transition curve ends, since it won’t be visible at the end anyway. 4. Less is more A lot of these tips could be pretty well summarized as “less is more.” It’s easy to get carried away and make every single thing on the page animate in. (I’ve certainly been guilty of that.) But unless this is your personal website and you just feel like going a little wild, too much movement can easily do more harm than good. When it comes to transitioning things with CSS, understated is usually better than overstated. The more an element changes during an animation, the more the transition risks seeming overdone. The more an element changes during an animation, the more the transition risks seeming overdone. If you’re animating opacity from 0 to 1 (or the other way around), maybe try a smaller range, like 0.4 to 1 instead. If your element scales up to full size, try making it just slightly smaller to start, rather than so small it can’t be seen. Does an element slide into place? I find that in most cases, movement like that should be in the range of about 5–40 pixels. Any less, and the movement may be too subtle to even notice; much more, and a smooth slide may become a clumsy crash. Here’s an example of a transition that animates opacity, translateY and scale. Compare the first pronounced, drawn-out animation (orange), next to the very same transition, but toned down and a little quicker (blue). See the Pen Big vs subtle animation by Josh Collinsworth (@collinsworth) on CodePen. Doing too much can be worse than doing nothing at all. So find the point where the transition is just enough to be effective, and if you go further, do so cautiously. 5. Avoid browser defaults You may already know the browser has some built-in easing curves available to use: linear, ease, ease-in, ease-out, and ease-in-out. However, while these five named timing functions are convenient and useful in some situations, they’re also very generic. (Many of the animations built into tools and libraries online fall prey to the same homogeny, even if they do offer a wider range of choices.) If you want to get the most out of movement, you should reach beyond the most common off-the-shelf named options. Just as a site built with Bootstrap or Tailwind defaults risks looking generic, off-the-shelf easing curves can often make UIs seem bland and homogeneous. Just as a site built with Bootstrap or Tailwind defaults risks looking generic, off-the-shelf easing curves can often make UIs seem bland and homogeneous. As an alternative, VS Code has an amazing autocomplete for cubic-bezier curves with a wide range of options; start typing cubic-bezier in a CSS context, and you should see the following dropdown appear: All of those options are covered in my easing playground, if you’d like to take a look and play with the presets. Another excellent option: open your browser’s dev tools and play with the easing curves in there. Every major browser has an easing panel available as a sandbox to try different options and make adjustments. To access it, open dev tools, and click the curve icon next to a cubic-bezier value in the CSS styles panel. (The icon varies, but the workflow is basically identical across all browsers.) However you choose to define your easing curves, though: I recommend you take some time to make subtle tweaks. Use cubic-bezier, and don’t be afraid to tinker. You can certainly get by with the presets in the browser, or in VS Code. And if you’re using cubic-bezier over keyword values, you’re ahead of the game already. That said, though: you probably wouldn’t limit your color palette to only predefined CSS named colors. So you might not want to limit your transitions to a small handful of preset curves, either. 6. Multiple properties, multiple easings While this one won’t always come in handy, there will be times you’ll be animating more than one property at once on a single element, like when you scale an item with transform as its opacity also changes. You could apply the same cubic-bezier curve to both properties, as shown here: /* ⛔ Ok, but can be better: */ .my-element { transition: all cubic-bezier(0.5, 0, 0.5, 1) 0.5s; } /* ⛔ Also maybe not ideal: */ @keyframes scale_and_appear { from { opacity: 0; transform: scale(0); } } .my-element { animation: scale_and_appear 0.5s cubic-bezier(0.5, 0, 0.5, 1) forwards; } Depending, that might look just fine. However, there will be situations where the same curve doesn’t really work for every property being transitioned. The easing curve that works well for the transform may not feel right for the fade. That’s when it’s handy to set a unique easing per CSS property. The easing curve that works well for the transform may not feel right for the fade. That’s when it’s handy to set a unique easing per CSS property. In those cases, you can split the @keyframes animations by property, or specify multiple transitions. Then, you can specify a different curve for each property, since both transition and animation can accept multiple values: /* 👍 Better; each property has its own curve */ .my-element { transition: opacity linear 0.5s, transform cubic-bezier(0.5, 0, 0.5, 1) 0.5s; } /* 👍 Use two animations and apply both */ @keyframes scale { from { transform: scale(0); } } @keyframes appear { from { opacity: 0; } } .my-element { animation: scale 0.5s cubic-bezier(0.5, 0, 0.5, 1) forwards, appear 0.5s linear forwards; } Here’s a demo; as the boxes alternate in and out, notice how opacity and scale follow the same acceleration for the square on the left. On the right, however, opacity follows its own linear curve. See the Pen Varying easings per property by Josh Collinsworth (@collinsworth) on CodePen. Which one is better? Well, that all depends on the effect you’re going for. Again, this one may not come up too often, but it’s very handy when it does, and also easy to forget about, so it gets a spot on the list. You could even go so far as to change the duration of each property, but be careful things don’t go out of sync if you decide to get that wacky. 7. Use staggered delays When transitioning multiple elements (or one element with many parts), don’t underestimate the effect animation-delay or transition-delay can have—particularly when staggered. Take a look at this CodePen example; each line uses a new kind of animation delay to create a different effect: See the Pen Untitled by Josh Collinsworth (@collinsworth) on CodePen. In the pen above, the first line just transitions all at once. Fine, but not particularly sharp. In each line following, however, varying degrees of delay are applied to each letter, to create a playful “bounce-in” effect. There’s even one that goes backwards, and one that causes the line to appear from the middle out. However, remember less is more. It’s very easy to overdo animations like this, especially when there are lots of elements transitioning. I made that example much more overstated than I’d generally recommend, just for demonstration purposes. It’s probably a little too busy for most UI work. That said: there are opportunities to apply this effect on a more subtle scale. Dots in a loading screen, maybe? Perhaps when a drawer or hamburger menu is opened, each item might appear on a slight delay? Again, keep it short and subtle. But where applied well, staggered delays can help take web transitions to another level. 8. Ins go out, outs go in If you’ve looked at various kinds of easing curves, you may have noticed they tend to come in three varieties: an ease in (starts slower), ease out (ends slower), and in-out (which is essentially both; faster in the middle and slower at the beginning and the end). The tricky thing with transitions is: you often want your transition in to be an ease-out, and your transition out to be an ease-in. The tricky thing with transitions is: you often want your transition in to be an ease-out, and your"
