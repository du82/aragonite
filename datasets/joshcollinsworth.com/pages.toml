title = "For whatever it's worth: my advice on job hunting in tech - Josh Collinsworth blog"
description = "A collection of things I've learned over my decade in the industry, on how and where to look for jobs, applying, interviewing, talking about yourself and your work, and all those other fun things. For whatever it's worth."
full_description = "For whatever it's worth: my advice on job hunting in tech Published: June 7, 2024 Updated: July 23, 2024 Every once in a while, somebody will reach out to me with advice on navigating their development career. Sometimes it’s how to break into the industry; sometimes it’s more about career progression, where to look for jobs, or how to interview. Eventually, I realized I was having the same conversation often enough that it would probably save everyone a lot of time if I just wrote down all my advice. Hence: this post. Eventually, I realized I was having the same conversation often enough that it would probably save everyone a lot of time if I just wrote down all my advice. Hence: this post. This will serve as a collection of whatever I’ve learned, for whatever it’s worth. I’ll do my best to keep it up to date as the months and years roll on, but this is everything I know (or at least, am pretty sure I know) right now. [Table of contents] What this is (and isn’t)Before you startKnow what you wantShore up weaknesses, but focus on strengthsCreate a behavioral story bankIf you can, be financially preparedGet out there and networkYou need a websiteHave some writing templates readyWhere to lookApplyingTrack your effortsFront-load the searchBe among the first to applyGo to the sourceDon’t worry how many other applicants there areWrite good cover letters if you can; don’t if you can’tDon’t disqualify yourselfInvest in your web presenceResume adviceFocus on effect, not actionsTalk about yourself as a human, not a technology checklistTailor your resume to the jobKeep it short and simpleSweat the detailsInterviewingFail early and oftenHave your behavioral story bank readyTake the time you needNever, ever, EVER say bad things about previous jobs or coworkersAlways have questions ready, and always ask themBe prepared to talk salaryFollow up and connect after interviewsInvest in your setupAsk for feedbackOne weird trickHandling live coding interviewsPreparation and mindsetOnce the clock startsDon’t panicAfter time’s upTalking salaryMindsetThings are bad, but I think they’re getting betterIt’s not you, it’s themTake care of yourself What this is (and isn’t) This is advice for anyone actively looking for a job in tech, or about to start, particularly developers. It aims to cover the search, from beginning to end. Just to get this out of the way right off the bat: I’m no authoritative expert, either on hiring or on tech in general. If there was a talking heads-style TV show about tech careers, nobody would call me up to sit on the panel. I don’t claim to know everything. I don’t even claim whatever I do know will be useful in the first place; what worked for me then might not work for you now. However, I’ve had what I think is fair to consider a pretty good run in tech so far. I’ve been building things on the web for about ten years. I’ve worked for agencies, taught development courses, and I’ve spent the last several years full-time in frontend at some notable software companies. I’ll be the first to tell you a lot of my journey has been lucky. Still, though: some of that luck is reproducible. I’ll be the first to tell you a lot of my journey has been lucky. Still, though: some of that luck is reproducible. This will be very US- and developer-centric (especially frontend), so not everything will apply to you if you’re in another country or role. I think a lot of it still will, however. I won’t go deep into specifics on certain things (for example: how to write cover letters, or understanding algorithms), just because there are plenty of resources already available on those topics. I’ll give my general advice, though. Finally, I have to thank the members of the ShopTalk Show D-D-D-Discord for helping me flesh out this post with their own best suggestions and advice, especially Dave Rupert, Andrew Walpole, and Erick Merchant. Several of these points are theirs; I just added some color commentary. This is very long, which is why I’ve broken it up into sections. I’ve tried to make it as easy as possible to skip around and skim. All that said: the rest of my advice has no basis more reliable than my own meandering experience. I will dispense this advice now. For whatever it’s worth. (Your mileage may vary.) Before you start Regardless of where you are in your journey, these are things you might want to work on sooner than later. Know what you want Obviously, what you want is a job, because you’d like to make money to eat and survive and pay for Netflix. But since that answer probably won’t get you anywhere in interviews, let’s go a little deeper. Really think about what’s worked for you in the past, and what hasn’t. What kind of role best suits you, and in what type of organization? Do you like being a small part of a big team, with well-defined roles and success criteria? Do you like having lots of autonomy, wearing lots of hats, and forging your own path somewhere smaller and more ambiguous? (Or something in-between?) How would you like your next job to be different from your last job, and how would you like it to be the same? Would you take less pay for something more fulfilling? For that matter: what makes you feel fulfilled in the first place? One useful exercise: write down every criteria you can think of (pay, benefits, autonomy, company size, prestige, title, interesting work, culture, social impact, stability, etc.) Once you’ve thought of every aspect you can, rank them, first through last, and save your ranked list for later. Compare your ranked list to any job you consider applying for, to see how closely it matches. (You probably won’t find a perfect fit, but the list will help you notice bad fits.) However you do it, though: Spend some serious time figuring out what you value, and write it down. Spend some serious time figuring out what you value, and write it down. While I’m not generally a fan of personality tests and the like, I’ve found the CliftonStrengths Assessment (also called the StrengthsFinder, or Top Five Strengths) to be illuminating for me, personally. It’s helped me to understand what I value, what I bring to the table, and where I fit in best. In any case, keep your list handy; it will help you filter your search, and answer interview questions like “why are you interested in this company?” As a bonus: the list will also help guide you to some good questions you can ask in interviews. Shore up weaknesses, but focus on strengths If you have any severe deficiencies, it’s worth addressing those immediately. Now’s the time to make sure you’re ready for whatever comes your way. Practice for interviews. Brush up on any technology or topic that’s likely to come up for the kinds of role you’re applying for. Look up articles; listen to podcasts; watch videos; whatever works for you. You just want to get your brain out of passive mode, and actively thinking about these kinds of things. You don’t need to become an expert, by any stretch, in everything that might come up in an interview. Just absorb enough of the basics to have a high-level conversation (or at least, fake your way through one). Don’t fight against yourself trying to drag your lowest stats up. That energy goes a lot further leaning into your strengths. Beyond addressing any severe vulnerabilities, however: I personally believe effort is better spent bolstering strengths than mitigating weaknesses. There’s usually a reason some things click with you while others don’t, so don’t fight against yourself trying to drag your lowest stats up. That energy goes a lot further leaning into your strengths and interests. Plus, this is a long process; you need some wins along the way. Spend time working on the stuff you’re good at and enjoy. Don’t get me wrong: you should address your weaknesses, to some extent. But don’t get so caught up in it that you end up being average at everything. You’ll be hired for what you’re good at, not for what you’ve avoided being bad at. You’ll be hired for what you’re good at, not for what you’ve avoided being bad at. Create a behavioral story bank A “behavioral story bank” (BSB, not to be confused with Backstreet Boys) is a collection of stories about yourself you can tell any time you need to highlight your skills, positive qualities, and/or the results you’ve achieved. It’s a prepared list of all the best anecdotes about you. Think of times you’ve had success, or faced adversity, or learned new things; times you overcame challenges; times you earned recognition, or times your coworkers were grateful for something you did. If it helps: you can reverse-engineer your BSB from common interview questions (take the time to look some up). Once you have a handful of those situations, put them into the STAR format (Situation, Task, Action, Result). Write the list down, and have it ready at all times. That’s your BSB. Your behavioral story bank might be your single most important resource. It’ll help you write your cover letters, applications, and resume, and it’ll give you solid answers to interview questions. Your behavioral story bank might be your single most important resource. It’ll help you write your cover letters, applications, and resume, and it’ll give you solid answers to interview questions. You’ll be returning to your BSB over and over again throughout the entire process. (Every time you go back to your BSB, you can think Backstreet’s back, all right! I know you won’t actually do that, but I’ll still say it here.) Prepare like a stand-up performer; you want to have a set of your best material ready to go at any moment, so you’re never caught trying to come up with something on the spot. To some extent, interviews are performative (for better or worse). So, have some bits ready to go. One other piece of advice on your BSB: while stories should positively showcase your behaviors and results, they don’t all have to be super business-y, or directly related. They can be from other industries, or even personal. One example that’s stuck with me through the years: a Latino applicant shared a story of overcoming racism from his high school guidance counselor. His counselor tried to dissuade him from going to college, saying higher education “wasn’t for people like him.” The applicant rejected his counselor’s racist discouragement, and successfully graduated in his chosen academic field anyway. That’s obviously not a work story. But it’s one that absolutely showed persistence in overcoming adversity (and, one that made me feel invested in that applicant, rooting for his success). Point is: If you faced a challenge and got positive results, it counts. Don’t disqualify relevant experience just because it happened outside the walls of an office. If you faced a challenge and got positive results, it counts. Don’t disqualify relevant experience just because it happened outside the walls of an office. If you can, be financially prepared If you have the luxury, save money for your search. If you don’t (if you just found yourself laid off, for example—I’m very sorry), start cutting expenses now. Sadly, but realistically: you don’t know how long this might take. Steel yourself, in any case. It’s likely to take at least 6–8 weeks to find a job in the current market. It could be longer, and quite possibly much longer. I say that not to scare you, but to prepare you for all contingencies. Settle in, and find sustainable pace; this will be a marathon, not a sprint. It’s probably wise to stretch your financial runway as far as it can go. Get out there and network In this era, where everything is digital, the more of a personal connection you can make, and the more people you can make it with, the better off you’ll be. A great way to do this is to get involved with any relevant regional dev group you can find. Most large cities have developer meetups, and groups on Discord, Slack, Meetup, etc. There may even be Facebook groups, bulletin boards, and the like. Even if you aren’t looking locally, I’d still recommend seeking out dev groups in your area. Get involved, and get to know the members. If you can make in-person connections, they’ll likely be your strongest, but online friends are real friends, too. Wherever you are, be active. Have helpful and friendly conversations. Share useful things. Become a name and face that people recognize and think of positively. Wherever you are, be active. Have helpful and friendly conversations. Share useful things. Become a name and face that people recognize and think of positively. Nobody likes the guy who pops into the channel on day one and says “hey everyone, I’m looking, send jobs my way.” That’s tactless. Don’t be that guy. Nobody has any reason to help that person. Do let folks know you’re looking, of course, but only after you’ve gotten involved as a member of the group. Don’t try to take from a community you’re not giving to and participating in. Don’t try to take from a community you’re not giving to and participating in. The more you can become a helpful, friendly person to other people, the more those people will remember you for any opportunities that come up. Naturally, this also means: don’t spam, and don’t just post for the sake of posting. Quiet, infrequent involvement is fine, if that’s you. Be real. People commonly ask whether they should connect with strangers on LinkedIn. I don’t have strong feelings one way or the other, but I generally don’t connect with people if I don’t have any idea who they are. I’d recommend reading up on the pros and cons, using your own best judgment for your situation. You need a website Being on LinkedIn, etc. is a good start, but you shouldn’t stop there. No matter how great your LinkedIn profile is, it’s still just another LinkedIn profile. It’s hard to stand out when you’re the same circle avatar, on a page 95% the same as everyone else’s. No matter how great your LinkedIn profile is, it’s still just another LinkedIn profile. It’s hard to stand out when you’re the same circle avatar, on a page 95% the same as everyone else’s. A personal website is a great way to stand out. You can, and should, link to it from everywhere. Having one has served me extremely well over the years. Your website doesn’t need to be fancy at all. Bonus points for building it yourself, but it’s not required. If you do, build it well. Overly simple is better than over-complicated. (In other words: rock your <body> right. Yes, the Backstreet Boys jokes will continue. No, I will not apologize). You don’t have to blog, though it’s a good idea if you’re into it at all. You can just write about stuff you’re working on and learning, if nothing else. (“But I don’t have anything new or unique to say,” you might argue—to which I might reply, “this ain’t the world’s first job advice post, yet here we both are.”) You don’t need a lot of content. Even one page will do, if that’s what you feel fits best. (This should go without saying, but: do not fill your website with AI-generated writing. It’s ea"
