["https://joshcollinsworth.com/blog/response-to-defending-open-source"]
title = 'A response to "Defending Open Source: Protecting the Future of WordPress" - Josh Collinsworth blog'
description = "I feel it's important to issue a critical reading of Automattic's post, as it doesn't seem to offer much of a serious or objective examination of the issues at hand. Rather, the post unfortunately reads as something more akin to a puff piece, or corporate propaganda."
full_description = 'A response to "Defending Open Source: Protecting the Future of WordPress" Published: November 5, 2024 Updated: November 6, 2024 This post is a response to “Defending Open Source: Protecting the Future of WordPress,” which was recently published on Automattic’s website as an explanation of the company’s ongoing dispute with WP Engine. I feel it’s important to issue a critical reading of Automattic’s post, as it doesn’t seem to offer much of a serious or objective examination of the issues at hand. Rather, the post unfortunately reads as something more akin to a puff piece, or corporate propaganda. (Expectedly enough, I suppose, since Matt and Automattic are currently embroiled in lawsuits against WP Engine.) In this post, I’ll go through the original Automattic post, quoting key pieces, and adding the questions and context I feel are obviously missing. (If you’re new to this whole WordPress drama, I have a whole other post covering it here. I guess writing about this whole thing is a new hobby of mine.) Below, I frequently reference the author as “Matt” (meaning of course Matt Mullenweg), though I don’t actually know if he himself wrote this post, in part or in whole. In fact, I doubt it’s solely his; it’s much more subdued than the manic, aggressive tone Matt’s largely taken over the last eight weeks or more. It clearly went through a more rigorous vetting than most of his recent communications. I say “Matt” regardless, however, because ultimately, this whole thing is essentially Matt. He is Automattic, he is apparently the Foundation, and he is .org. This sequence of events was set in motion by Matt, and if these words weren’t directly written by him, they were written by somebody doing what he wanted, probably trying their best to please him. Most likely, he approved the final version, no matter how involved he was in its production. So let’s set aside the technicalities: all of this is Matt, directly or indirectly, whether filtered through marketing and legal or not. That said: let’s go through the Automattic post, section by section. 1. WordPress is Resilient WP Engine’s revenue grew from $100m in 2018 to over $400m by 2024, yet their use of trademarks went beyond the bounds of fair use, including in multiple product names and positioning statements, causing confusion, leading some customers to conflate WP Engine with WordPress. If this were Wikipedia, there would be at least five “who?” “such as?” and “citation needed” links in this sentence. First: why does it matter what WP Engine’s revenue was, or is? What’s the point of bringing it up not just here, but repeatedly throughout the article, if there’s never going to be any meaning attached to the figure? Was this growth different than the growth of comparable companies over the same period? If it was, why is this important? Why is this growth apparently bad, both in general and for WordPress in particular? Isn’t it at least arguably a good thing for WordPress if an exclusively WordPress-based company is growing? These are questions that aren’t ever addressed. We’re apparently just meant to know it’s bad, as a given, as though it’s a natural part of the doctrine we all share. Profits aside, we’re also left to wonder: what use of trademarks went beyond fair use, exactly? Because to this point, we’ve seen no compelling evidence that WP Engine’s use of the WordPress/WP name was either at odds with the official guidelines, or uncommon among WordPress-based companies. Again, we’re apparently just meant to innately know WP Engine has done bad things here, without any concrete example given. (As a reminder: Matt edited the official trademark guidelines after he started this whole thing. So if anyone’s failed to live up to the original agreement here, it sure seems like it’s not WP Engine.) It’s also worth a reminder that WP Engine did somewhat alter their plan names in response to this whole mess, and add some disambiguation to their website, to make sure folks know they’re not officially affiliated with WordPress. So even if they were out-of-bounds, it seems like they’ve remediated that part of the issue. Regardless, though: who was confused, exactly? (Besides Matt’s mom, of course.) What was the outcome of that confusion? Why was it harmful? I’m not aware of anyone, say, signing a contract with the wrong company by mistake, or being misled into any other kind of commitment or expenditure. If there was so much of this confusion, and if it was so damaging, why is Matt’s claim about his mom literally the only example we’ve ever been provided? And, again, with every other company in the ecosystem doing exactly the same things WP Engine is doing with the WordPress and WP names, what makes it not ok in their case and ok in every other case? Matt blocked WP Engine’s convenient access to resources he was under no obligation to provide such as the WordPress.org plugin directory. The wordpress.org domain is hard-coded into WordPress core almost a thousand times, and indirectly referenced hundreds more. Its functionality is central and vital to WordPress. Developers are required to push updates through WordPress.org. WordPress doesn’t even work without WordPress.org. It is, for all intents and purposes, a part of WordPress. The fact that it’s an external repository with its own domain, and not something you download with the core software, is nothing more than a necessary technical detail. I don’t think anyone who ever contributed to WordPress.org—either the repo itself, or the themes and plugins it houses—realized before this whole episode that they were working on something that would ever be described as one man’s personal project, or that their work could be ripped away from others (or even from themselves!) at the drop of a hat. In fact, the place where contributors worked on core itself is actually called “dotorg” in the official WordPress Slack, and in other places. So the two have very, very commonly been considered one and the same, even under Matt’s direct leadership. WordPress.org has never, at any point, been positioned as an add-on to WordPress, or a separate companion piece. It was never presented as a discrete project, and certainly not one operated by one man, who could or would lock users out, in the name of a corporate dispute built on shaky claims of community disruption. (Indeed, whatever WP Engine’s ostensible disruption to the community, it would be difficult to argue they were greater, or would have become greater, than the disruption Matt himself has unleashed on end users of WordPress.) I think we all know if this were a business dispute taking place behind the scenes, without involving the users, we’d be having a whole different conversation. But the authors who maintain the repo itself, and the plugins and themes it houses, fully believed in good faith their work was for everyone, “in perpetuity” (as the WP Foundation’s mission statement goes). So to take that work, intended and believed to be part of the community commons, and put it instead inside a walled garden—all because of where someone chooses to host their site—is a flagrant abuse of Matt’s trust and power. And to claim it’s all just his own site, like some blog he threw together on his own, is preposterous in nearly every possible sense. Now: that’s all my opinion, and I’m not a lawyer. There’s every possibility the courts side with Mullenweg on the point that he alone owns WordPress.org, and conclude he’s within his rights, legally speaking, to do whatever he wants with it. But the law is an imperfect model of justice, and being within your rights isn’t the same thing as being in the right. The idea that Matt doesn’t “owe” access to .org is an absurd legalistic technicality on par with a childish claim like “I never said I did all my homework.” And besides, we’re only in this position because he fleeced the whole community into believing .org was in a different, broader, more responsible set of hands than his and his alone. In my view, WordPress.org is a part of WordPress. It is owned by the community. Matt just managed to steal it without anyone noticing until now. WP Engine responded predictably—issuing multiple legal filings—while ignoring invitations for open debates. Let’s call a spade a spade: demanding debates is a childish move. It’s childish to believe the only reason someone doesn’t acknowledge your indisputable correctness is that you haven’t had the opportunity to crush them in the suffocating grip of your cold, hard reason. It’s childish to assume there are no other valid reasons a person might disagree with you, and/or won’t debate you. Frankly, It’s childish to think you can change their mind with a debate anyway. Maybe you’re not as right as you think you are. Maybe they’ve already looked into all your points and have very good reason to disagree with them. Maybe they know this whole thing is just a circus. Maybe they just don’t want to waste their time. WordPress will continue to thrive. The ecosystem is strong and resilient, supported by thousands of contributors and millions of users. Yes, thousands of contributors who never believed they were working on one man’s website, or that their work could or would ever be blocked off from many of those millions of users (or, for that matter, outright stolen, as with Advanced Custom Fields). Silver Lake and WP Engine are outliers. The overwhelming majority of WordPress users and businesses operate ethically and collaboratively—or at least neutrally. We desperately need to see some actual, tangible data and examples here. What is WP Engine doing that’s so different from every other host in the space? All we’ve heard up to this point is “they make lots of money.” So why are they an outlier? What do the “overwhelming majority” of other businesses do that makes them so ethical and collaborative, and how can you demonstrate WP Engine isn’t doing those things? Frankly, this article does more to convince me that Matt just wants to extort and squash his largest competitor than to convince me this is somehow about the greater good of the WordPress community. Otherwise, it would focus on the actual, tangible harms WP Engine is doing or would do, instead of just throwing big numbers and scary terms at us over and over. The only things Matt points to in this entire piece are the size and profitability of WP Engine, and the fact that they’re owned by private equity. But he never connects the dots; never shows how either of those are actually causing real harm to WordPress or its users. (All the while, of course, any one of us can point to countless ways Matt’s actions since WCUS have caused very real damage to users, and continue to do so.) We’re working to protect you. Our actions are focused on defending the WordPress community. I’m sorry, but no, they are not. Throwing WP Engine’s customers under the bus and exposing them to multiple vulnerabilities that they can’t update because you cut off their access isn’t “protecting” them. That isn’t what you do to people you consider members of your community. This is like the mayor cutting a suburb off from the power grid, over a dispute with the power company. You aren’t helping people, and you aren’t promoting community. You’re hurting people, and you’re tearing the community down. Choose ethical hosting providers: Hosts that prioritize open source principles help keep the ecosystem healthy. Again: show us some actual data here, if this is what you’re coming in with. (And no, Matt’s mostly made-up figures from his WCUS talk don’t count, as I already explained at length in my previous post on this whole mess.) What other hosting providers are doing more, specifically? What are they doing differently? How does their scale compare to WP Engine’s? Do as many people rely on the products they contribute to? For that matter: how do you even count what WP Engine is doing? Where would you even begin to make a fair comparison? The fact that Matt isn’t interested in even asking this question is rather telling, in my view. Even if WPE isn’t contributing as many hours specifically to core as Automattic is (and arguably: they shouldn’t be expected to), they’re clearly building things for the community and drawing people into it. WordPress has grown as WP Engine has grown. People keep using their stuff. Their products and plugins are obviously good for WordPress, generally speaking. Lots of them aren’t even used by people who host on WP Engine. (I, for one, would use Local and ACF for any WordPress site I built, even if I didn’t host with WPE.) So why is Matt’s personal math all that counts? And more importantly: why won’t he even show his work? Not that any of this matters, actually, because I’m sorry: it’s open-source software. You don’t just get to extort people out of nowhere if you decide you don’t like how they’re using it. 2. Private Equity vs. Open Source Honestly, I don’t even know if there’s much quotable in the next two sections. This one mostly just describes how capitalism works, while expecting the reader to do the work of equating capitalism with WP Engine. (It helps if you forget Automattic is also a for-profit company, I suppose.) A lot of people can get down to the anti-capitalist blues, myself included. But it doesn’t really hit the same way when it’s played by a guy worth around half a billion dollars, talking about his own for-profit company’s biggest competitor. Aside from “private equity is usually bad,” there’s very little of meaningful substance here. A lot of it is bad-faith tactics and fallacies. [Spooky Halloween voice]: Beware, children! I can name not one, but two open-source projects that took investor money and failed! Did you know WP Engine is worth more now that it was five years ago!? Woooooooo~! That’s because…they bought things and did marketing! [Sound of children screaming] WP Engine is bad because they make money, apparently. (Again: this does more to promote the idea that Matt’s focused on them because of their threat to his business than because they pose any real threat to the community or open source project.) Matt’s company also makes money. But he wants us to know his company does it the one true, pure way, and WP Engine does it the bad, evil way that will destroy everything (without doing much to spell out what the distinction is). Matt points to how much his company does for WordPress, but since he’s the only arbiter of what counts, everything on his side gets tallied while nothing on WP Engine’s side does. It’s hard to even take it seriously. If I had tried to submit this post in my community college English class, I would’ve gotten it back with marks all over this section. 3. Silver Lake & WP Engine This whole section doesn’t even really talk about WP Engine; it’s just a Cliff’s notes version of bad things private equity firms have done in the past, which once more fails to connect the dots on why and how that translates to harm or danger for WordPress itse'
