description = "How does the Glove80 stack up against similar keyboards like the Moonlander and Ergodox? I share my impressions after the first few weeks of use."
full_description = "First impressions of the MoErgo Glove80 ergonomic keyboard Published: October 24, 2023 Updated: April 8, 2024 Table of contents Backstory: my history with keyboards, ergonomics, and RSI Why the Glove80? Options Pricing and shipping Layout customization Lights Wireless and battery Ergonomics and customization Did it solve my issues? Switches and keycaps Summary Pros and cons Note I wrote a follow-up to this post here, after using the Glove80 for six months. I never had any real interest at all in mechanical keyboards until recently. I mostly considered them a novelty; the kind of thing that was fine as a hobby, but not anything particularly practical. Over the last year or so, however, I’ve been going deeper and deeper down the rabbit hole of mechanical keyboards, and I’ve discovered a much richer, more fulfilling world than I ever suspected. There’s just something about nerding out over the finest details of the machine you touch and use every day that can be extremely gratifying. My gateway into mechanical keyboards was purely driven by the search for better ergonomics. It was silly that I never looked any closer at things like keycaps and switches, I now realize. After all, a person who spends all day on their feet will likely care deeply about their shoes; why shouldn’t someone who logs thousands of keypresses a day be invested in how their fingers feel? However, unlike most mechanical keyboard enthusiasts, I wasn’t initially drawn to the hobby by any interest in the feel, sound, look, or performance. Instead, my gateway into mechanical keyboards was purely driven by the search for better ergonomics. Backstory: my history with keyboards, ergonomics, and RSI For most of my life, whatever keyboard was attached to or supplied with the computer I was using was just fine with me. I rarely gave any thought to the device resting beneath my fingertips. Then came 2020, and the pandemic. The home became the workplace. Between the constant demands of remote work and desperate attempts at escapism, my laptop was pretty much always…well, on top of my lap. (And even when it wasn’t, it was probably on a surface that was in no way designed to be a comfortable workstation.) Over these weeks and months, I developed a repetitive stress injury (RSI), and though I didn’t know it then, it would be my first of many. My right wrist, constantly pinched, was in ever-present and worsening pain, which was at times so bad I couldn’t even tighten my grip or carry heavy things. It became clear I couldn’t keep going without making changes. Image from kinesis-ergo.com Over the first year of working from home, I ended up spending around $2,000 overhauling my home workstation to alleviate the pain and prevent new injuries. Over the first year of working from home, I ended up spending around $2,000 overhauling my home workstation to alleviate the pain and prevent new injuries. (What a great system, that makes working most expensive for the people for whom it’s the most painful..) I got a better chair, a standing desk, a wrist brace, and—finally—my first split keyboard: the Kinesis Freestyle2 for Mac. The Kinesis Freestyle2 for Mac (my first ergonomic split keyboard) That keyboard served me well for nearly two years; it got my hands further apart, and allowed my wrists to sit at a more natural angle. But it eventually led to another, different injury: my left thumb was constantly bending at uncomfortable angles to press the command key to initiate shortcuts. That’s when I started looking at keyboards with thumb keys, and ended up with a ZSA Moonlander. I wrote about that story here. At first, I hated the Moonlander. The ortholinear (columnar grid) layout took a lot of getting used to, but it paid off and felt amazing once I got it down. To learn was to love. I even went so far as to invest in a new set of switches and keycaps for the Moonlander, which made me love it even more. The ZSA Moonlander (with custom keycaps) Over time, however, a new RSI flared up, even with the Moonlander. As I write this, I’m still recovering from this latest injury. Some of it, I attribute to the Moonlander specifically; some is likely my own fault. Some probably isn’t even work-related. As I write this, I’m still recovering from this latest injury. Some of it, I attribute to the Moonlander specifically; some is likely my own fault. Some probably isn’t even work-related. I don’t think all my issues stemmed from working on a computer; I notice minor pain sometimes even from playing my Switch in handheld mode for extended periods, or from keeping my arm locked in place when driving long distances. Still: I was adjusting the Moonlander a dozen times a day trying to figure out the problem. Turns out: it doesn’t really allow your hands to just rest when they’re not typing. (Or at least, it didn’t how I was using it, and certainly not without bending your wrists upward.) So over time, my left arm muscles fatigued from constant activation. I had to train myself to move my arm off the keyboard when not in use, since, again, there wasn’t any really comfortable way to just rest my hand (especially at higher tenting angles). I’m not here to tell you the Moonlander is bad, or that it won’t work for you. However, I will say again: I think it’s a keyboard that wants to be cool first, and ergonomic second. I initially thought the similar Ergodox EZ might solve my problems, with its thicker palm rests. However, the keyboard itself is so tall, it really wasn’t any different. And sadly, like the Moonlander, the Ergodox was a letdown in the range of customizations it offered. Again, I should emphasize that despite valid criticisms of the Moonlander, some of my issues with it were of my own creation, and some probably weren’t even entirely work-related. Ergonomics are highly personal, and everything you do in your day contributes. What works for one person might not work for another. Ergonomics are highly personal, and everything you do in your day contributes. What works for one person might not work for another. Still, even making all the adjustments I knew how to make—despite how much I loved the feel of it—I felt like there might be a better option for me than the Moonlander at this stage of my life and career. So again, beset by arm pain (this time in both wrists, as well as my left elbow), I set out to find a solution. That’s when I started thinking maybe the Glove80 could be the fit I was looking for. Why the Glove80? Ergonomic keyboards cover an incredibly wide spectrum. On one end, they’re little more than standard keyboards with a few curves, a gap in the middle, and/or a palm rest added. (Microsoft’s Sculpt Ergonomic Desktop and Logitech’s K350 and Ergo K860 fit this bill.) On the other end of the spectrum are devices that barely even resemble traditional keyboards. They’re often split (i.e., in two pieces, instead of one, allowing the wrists and forearms to sit straight in front of the shoulders instead of pointing awkwardly inwards together), and they frequently have a highly unconventional shape and layout. Not all ergonomic keyboards are mechanical (or split, for that matter), but many are; ergonomic keyboards are often a sub-niche of the mechanical keyboard niche. A wide range of ergonomic, split, and/or mechanical keyboards. Image from rtings.com. Even within the nested rabbit hole of ergonomic mechanical keyboards, however, neither the Glove80 nor its maker, a New Zealand company called MoErgo, are likely to be among the main names you’ve heard of. Generally, it seems like Kinesis and ZSA have the largest mindshare in the space (though there are others, like Cloud Nine, Dygma and UGL, maker of the UHK). Nearly as I can tell, the MoErgo Glove80 is a dark horse—or at least, it was until recently. Just finding reviews for it was challenging. The designer in me can’t help but wonder how much of that may be due to MoErgo’s website design; their store has a pretty dated, somewhat amateurish look and feel. It’s definitely not a storefront that inspires confidence in the product, as far as aesthetics go. So: why did I buy a relatively unknown keyboard from a comparatively small manufacturer with a highly questionable website? Because I could tell they cared—maybe more than anyone—about actual ergonomics. So: why did I buy a relatively unknown keyboard from a comparatively small manufacturer with a highly questionable website? Because I could tell they cared—maybe more than anyone—about actual ergonomics. MoErgo clearly takes the Glove80 very seriously. Join the Discord, and you’ll find the founders fastidiously posting updates, and actively responding to questions and issues. More impressive than that, though: MoErgo goes to great lengths to explain how and why they landed on the Glove80’s design, and that commitment shows. This doesn’t feel like a cool keyboard with “ergonomics” slapped on as an afterthought selling point, just because it can tent a little. [Side-eyes ZSA] The Glove80 genuinely feels as though every decision was in service to ergonomics first and foremost, and everything else was secondary. The Glove80 genuinely feels as though every decision was in service to ergonomics first and foremost, and everything else was secondary. MoErgo designates a pretty hefty portion of its website and printed materials to telling the story of the Glove80’s design. It’s undeniably impressive; over 500 experiments and prototypes are laid out in detail. The journey of assumptions being made, challenged, rethought and re-challenged is a testament to the designers’ dedication to arriving at the best possible ergonomic solution. With all that preamble out of the way, let’s get to the main course. As I’m writing this, I’m almost a month into using the Glove80 as my full-time daily driver. I’ll wrap things up with a tidy list of pros and cons, but in the meantime, a lot of my observations really aren’t either (or, are both at the same time), and so I think I’ll take more of a scattershot approach to this post. The Glove80 with default layout. Image from MoErgo Options Compared to some other similar keyboards, the choices you’ll need to make when ordering a Glove80 are fairly minimal. Mainly, you only choose: Switches (covered in depth here); and Color; grey (basically black), or white The keyboard comes with the palm rests already attached, but they can be removed if you prefer, for whatever reason. (They’re a big part of the package to me, so I don’t know why you’d want to, but maybe if you were mounting the keyboard you would.) Glove80 in white, with palm rests removed and additional custom keycaps. Image from MoErgo. There’s also a version available with unsoldered switches, in case you’re mechanically minded and want to add your own, but most of us will probably just choose switches and color. Worth noting: the keycaps (and included cable) will be white regardless of what color you choose for the body of the keyboard. Pricing and shipping Although the Glove80 is made by a New Zealand company, it ships from China. I initially thought this might mean shipping would be very slow and/or expensive. To my surprise, however, mine arrived in less than two weeks, and shipping was included in the price of the keyboard. That price, I’ll note, is certainly far from trivial; the Glove80 will run you $399 USD. That’s undeniably hefty, but all things considered, it’s actually a pretty good price. Other manufacturers charge similar rates for comparable keyboards, but the Glove80 already includes several extras for which those other companies often charge extra. It’s sadly common for supposedly ergonomic keyboards to only allow a minimal degree of tenting and/or tilting out of the box, but to offer a paid add-on to unlock more customization, which might run you over $100 all on its own. [Side-eyes ZSA again] Wireless connectivity, if offered, can also be an upcharge. You might also pay for RGB lighting, or for certain customization options. In many cases, even the palm rests run an extra $30–80. So while $399 USD might seem steep, know that unlike with most similar keyboards, that’s the full and final price; no up-sells or add-ons. So while $399 USD might seem steep, know that unlike with most similar keyboards, that’s the full and final price; no up-sells or add-ons. Another credit to MoErgo: unbeknownst to me at the time, I ordered my Glove80 just before the new version of the keyboard began shipping. (It’s not significantly different; it mostly just features minor construction improvements, and now comes with a few extra accessories and a travel case.) MoErgo put the old stock on sale for $20 off, about a week after my order. Total bummer for me, since I would’ve either got the newer package, or paid $20 less, if I’d only waited a little longer. But to the company’s credit, they took the initiative to automatically issue a $20 gift card and to everybody else in the same situation. Plus, that travel case now comes included with all new Glove80s at no extra cost. All of this speaks very highly of the folks running the show and what their priorities are. You get the sense that MoErgo is willing to invest profits to make people happier, and that’s one of the best things you can say about a company, if you ask me. Layout customization Like many keyboard manufacturers, MoErgo has their own layout editor app, available at my.glove80.com. This is where you go to make changes to your layout; when you’re done, you download a config file, and upload it to your keyboard. The Glove80 layout editor at my.glove80.com, with my personalized layout Under the hood, this app uses open-source ZMK software for customization. The keyboard ships with three layers: layer 0 (the default), layer 1, and the “magic” layer, which is triggered by the conspicuous MoErgo logo key, and which holds most of the hardware controls, like lights and Bluetooth. You have the ability to add more layers, if desired. In keyboard terms, a layer is a mapping of keys; a layer determines what each key does when pressed. For example: when you’re on the default layer, pressing the “a” key will simply type an “a” character. But on another layer, you could remap the “a” key to anything you want; arrows, symbols, or even complex key combos or macros. I haven’t used a lot of keyboard customization software; mainly jut ZSA’s Oryx, so that’s my only real point of reference. MoErgo’s app is similar and simple, at least for fairly standard things. Adding a complex modifier like hyper (cmd + opt + shift + ctrl) is a little more involved; you have to add each individual modifier separately, making this example a four-step process. It would be nice to have a single button for those instead, but that’s a minor quibble. I notice the editor is fairly straightforward; while you can customize key presses in a pretty wide variety of ways, you can’t do much besides customizing keys. That is, with Oryx, there’s a wide range of keyboard options, too. I didn’t us"
