title = "Adding page transitions in SvelteKit - Josh Collinsworth blog"
description = "Transitions, easing, and routing are all baked into SvelteKit. This makes utilizing page transition effects in SvelteKit sites and apps as easy as adding just a few lines of code."
full_description = "Adding page transitions in SvelteKit Published: March 1, 2023 Updated: March 6, 2023 Note If you’re just here for the code (I get it), here’s the link to skip to that part. If you’ve navigated the web before (and if not, thank whoever printed this out for you, I guess), you know the default behavior when you click a link is rather unimpressive: the page we were just looking at is unceremoniously replaced, more or less immediately. (Let’s be honest: you’ll probably be staring at dimly pulsing skeleton UI elements for several seconds after that, because React, but you get the point.) This is in stark contrast to the world of so-called “native” apps, and more recently, single-page applications (SPAs) on the web. Both have the capability to fluidly animate between UI states, which admittedly just feels nicer. SPAs accomplish this using a healthy dollop of JavaScript. You can pronounce each letter in SPA, as an acronym, or say it like the word “spa.” Surprisingly, unlike most things in tech, nobody seems to care that much about this particular bike shed. Recently, though, SPAs have come under heavy criticism. I won’t link to the #hotdrama here, but suffice to say: some in the web community feel the benefits of SPAs (app-like transitions; arguably better user experience) were heavily oversold, as their drawbacks (accessibility and performance issues) were downplayed. While there’s merit to that position, I’m not here to weigh in on the benefits and tradeoffs between SPAs and “multi-page” apps (we used to just call them websites). Because luckily, SvelteKit makes it very easy to ask: ¿por qué no los dos? One of the many things I love about SvelteKit is its router, which automatically manages changes from page to page, and even preloads content for faster navigation—all in a way that plays friendly with accessibility and browser controls. (The back button works like it should, for example.) Happily, if the router isn’t available—if the user has JavaScript disabled, for instance—SvelteKit will simply fall back to the browser default behavior of loading the page as usual, ‘90s-style. With SvelteKit, we can implement progressively enhanced page transitions with very little penalty. This means with SvelteKit, we can implement progressively enhanced page transitions with very little penalty (just a little extra JavaScript). And as a bonus: implementing page transitions in SvelteKit requires very little code. But before we get into the how, let’s spend a little time on what page transitions are, and why you might want them. What is a page transition? A page transition is a visual effect that replaces normal page loading behavior. When you click a link, a page transition takes over, and animates the old page being replaced by the new one. For example, the old page might fade away as the new page materializes. Or, the old might slide off to the left as the new one enters from the right. You could even combine these effects, or do anything else you could possibly dream of that’s possible in CSS and/or JavaScript. (This site uses page transitions; here’s a quick example.) Page transitions: why or why not? You might choose to implement page transitions (or not) based on a variety of factors. Let’s look at some pros and cons. Benefits of page transitions Again, fancy transitions are typically the domain of native apps, which means they can add some unexpected “delight” (to borrow the painfully overworked term) to a website or web app. Page transitions aren’t just a nifty effect, however; illustrating a change with animation is generally good UX, since it’s more natural to perceive an object moving into or out of place gradually, rather than instantly. Change is more intuitive when there’s some kind of animation to demonstrate it—and if that animation happens to look impressive, all the better. Granted, an internet user is not at all likely to be surprised if, upon clicking a link, they see the default behavior. That’s perfectly fine in most cases. But generally speaking, change is more intuitive when there’s some kind of animation to demonstrate it—and if that animation happens to look impressive, all the better. Page transitions may also increase perceived performance (i.e., how fast a site or app feels) since transitions give users a distraction during page loads, and may also give data a little extra time to load in undetected. This is a double-edged sword, though, as poor transitions can also easily have the opposite effect. That brings us to… Drawbacks of page transitions Benefits aside, there are a few important drawbacks of page transitions that we should consider. First of all, page transitions require JavaScript—for now, at least. The view transitions API is on the horizon, and it’s quite possible that within a year or two of this writing, we could have this type of transition available (and progressively enhanced!) in all modern browsers. For now, however, page transitions unavoidably require extra JavaScript. Another drawback: page transitions can be difficult to implement accessibly. This is more of a concern when rolling your own page transition from scratch than it is when working with SvelteKit—which generally handles things like setting focus properly and making sure the back button works—but it’s still something to be aware of. Rather than looking impressive, a poorly implemented page transition risks seeming amateurish or over-the-top. Also: if poorly implemented, page transitions can have the opposite of the desired effect. Rather than looking impressive, a bad page transition risks seeming amateurish or over-the-top. It’s easier to have too much than too little. So if you choose to add transitions, know that a little goes a long way. With great power comes great responsibility; we want to make sure we’re not giving our users vertigo, making them wait too long, or confusing them with an overwhelming flurry of movement. Finally, page transitions risk making your site feel a little slower than it might otherwise, since animating between two pages naturally takes time. However, as mentioned in the above section, this could go the opposite way, too. It just depends. You might nail an impressive bullseye, or you might shoot yourself in the foot. It’s all in the execution. How page transitions are built in SvelteKit For starters, let’s look at the three key components (ha, ha) that make up SvelteKit’s native page transitions, and how to implement them, one by one. Built-in transitions While you can certainly hand-roll your own transitions, there are a number of transition effects in Svelte you can import and use as needed. The Svelte compiler removes any unused parts of Svelte at build time—meaning nice things like transitions and easing curves can be included in the base framework without unnecessary bloat in the final production bundle. To start, import the type of transition you want to use from svelte/transition. Out of the box, you get fade, crossfade, fly, slide, scale, blur, and draw (the last of which is specifically for SVG strokes). But for now, let’s use fade, since it’s nice and simple. (It only animates opacity.) Since this will be a global transition that applies on every page, we’ll want to use it in our global +layout.svelte file (i.e., the one at the top level of src/routes). So let’s import it there: <!-- src/routes/+layout.svelte --> <script> import { fade } from 'svelte/transition'; </script> Once imported, we’ll need to apply the transition on an element, via the transition:fade attribute. You might think that we could just plop the transition on the <slot /> and be done with it, but unfortunately, slots can’t accept attributes. You should see an error in your code editor if you try it. <!-- ⚠️ This creates an error --> <slot transition:fade> That’s because the slot element is just stand-in; a placeholder for a different and as-of-yet unknown component (in this case, a page), whose attributes and properties are defined elsewhere. We can’t just smash the two together like that. We could theoretically get around this by including the transition attribute on the topmost element of every single page in our app, but that would be tedious, difficult to maintain, and error-prone. (AKA: gross.) Instead, it’s much simpler to wrap the slot element inside another element (or component), and apply the transition to that. <!-- ✅ Better, but won't do much yet... --> <div transition:fade> <slot /> </div> Keep in mind: this wrapper element will appear on every page of our site/app. It will transition out with the old page, and then back in with the new one, every time the user navigates— —Eventually, that is. This won’t do much on its own yet. Why? Because at this point, that div doesn’t change or leave the page when the user navigates. Since it’s in +layout.svelte, it’s global, and unaffected by navigation, just like a header or footer. That’s normal; that’s how stuff in the layout file should work. But it’s not what we want in this case. We need this div to re-render every time the URL changes—and that’s where key blocks come in… A #key block A #key block is markup that reacts to state. Whenever that state changes, the block will re-render. A #key block is markup that reacts to state. Whenever that state changes, the block will re-render. You could think of this as injected reactivity. In more casual terms, though: a #key block lets you say, “hey, Svelte: keep an eye on that thing there, and whenever it changes, re-render this chunk of code.” (“Sure thing!” Svelte replies, in Rich Harris’s charming British accent. But I digress.) {#key variableName} <!-- All elements in this block will re-render whenever variableName changes --> {/key} Ok, you might be thinking. Sounds good so far. But…how do we actually get the current page URL? Smart question! We’ll need a variable that holds the current path, and updates on navigation. And for that, we’ll need to rely on data from the load function. #key blocks can also watch an expression; it doesn’t have to be a variable. The load function As you may already know if you’ve worked with SvelteKit, every route can have a load function, in a +page.js file alongside the route’s +page.svelte file. The load function runs before the page is loaded, and returns data for the page to use. The load function runs before the page is loaded, and returns data for the page to use. Typically, this is handy for things like checking to see whether the current user is logged in, or for fetching data the page might need in order to render, as examples. And again: usually, this load function exists at the route level, per-page. However, we can also use a +layout.js file—alongside our +layout.svelte—if we want a global load function, that runs on every page load. (Which we do, because we always want to know what the current route is and when it changes, site-wide.) At a minimum, that might look like this: // src/routes/+layout.js export const load = ({ url }) => { const { pathname } = url; return { pathname }; }; There’s a bit of destructuring going on there, so let’s break it down: The load function has access to a number of named arguments, including url, which contains information about (what else?) the current page URL. The url object has several properties, but url.pathname is the current path (e.g., /blog or /contact), so it’s the one we want. load functions must return an object, so we return pathname, using the { pathname } shorthand. We could, of course, just return url as-is, and handle getting the property we need from it in the template instead. That could even make our +layout.js file a one-liner. However, I personally prefer to keep the .svelte file as clean as possible. I’d rather do as much dirty work inside the load function as I can, and let the mess exist out of sight. Besides: there’s no point in having extra properties flying around inside the template if we’re not going to use them. Accessing data returned from load The object returned from the load function is available in the corresponding .svelte file as the data prop. It’s passed in automatically; we just have to declare it. So, heading back to +layout.svelte, we can declare and access the data prop, before finally using the pathname property in our key block from before. <script> import { fade } from 'svelte/transition'; export let data; </script> {#key data.pathname} <div transition:fade> <slot /> </div> {/key} That’s the simplest way to do it; just use data.pathname right in the template. But if you’re like me, and like to destructure variables, there’s a gotcha to be aware of. Gotcha: destructuring the data object While the data object we get from the load function is itself reactive, remember that any variables declared from it will not be. In other words, this won’t work: <!-- src/routes/+layout.svelte --> <script> export let data; let pathname = data.pathname; // ⚠️ This won't work as desired </script> {#key pathname} <!-- Contents aren't re-rendered on page load --> {/key} That’s because the value of pathname will be set once, on initialization, but will then never change on further page loads. That might seem confusing, because it appears to go against how Svelte works. Aren’t variables supposed to be reactive by default? Yes. In fact, that variable is reactive already. The problem is: it’s not tied to the original object. When a variable relies on another value, we need to explicitly make it a reactive declaration, in order to keep the two in sync. This works instead: <!-- src/routes/+layout.svelte --> <script> export let data; $: pathname = data.pathname; // 👍 This works! </script> {#key pathname} <!-- All good --> {/key} Alternatively, you could use this shorthand, if you prefer destructuring: <!-- src/routes/+layout.svelte --> <script> export let data; $: ({ pathname } = data); // 😎 This shorthand works, too </script> {#key pathname} <!-- Still good --> {/key} Either way will work just the same. It’s just a matter of preference. The important part is making pathname a reactive declaration, using Svelte’s $: operator, if you choose to destructure that property. Or, skip it and just use data.pathname as-is, without declaring a new variable at all. Totally up to you. Assembling the pieces All right, now that we know how to access data returned from our load function and use it properly, we’re ready to put all the pieces together! Here’s where we should be now with +layout.svelte: <script> import { fade } from 'svelte/transition'; export let data; </script> {#key data.pathname} <div transition:fade> <slot /> </div> {/key} This kind of works. If you try it now, you’ll see a fade effect, but it will only appear to be a fade out; the new page will still seem to appear instantaneously. Why? Because both the “in” and “out” transitions are happening at the same time: The user clicks; Both the fade in and the fade out begin simultaneously. (Depending on page size and scroll position, you may even see them both temporar"
