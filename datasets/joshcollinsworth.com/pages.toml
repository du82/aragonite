om 4–12 students, and topics included running WordPress locally, PHP, MySQL, WordPress theming, the template hierarchy, and touched on fundamentals such as web performance, design foundations, and ensuring general accessibility Guided students in-person and remotely as they built custom WordPress sites and themes either as portfolio pieces or for a real-life clients, often meeting the needs of a local nonprofit organization. David Day & Associates Graphic designer/WordPress developer August 2014 – September 2015 Designed and implemented brand standards across print and web platforms Worked as lead designer on projects such as a rebrand and unification of two separate practices, now known singularly as Nebraska Spine + Pain Center, and rebranding The Alter Group, a 60-year-old commercial real estate developer, to bring its look and messaging into a modern market Heavily customized WordPress websites based on branding and client needs to ensure future-proof edit-ability without sacrificing brand integrity Participated in discovery sessions, critiques and reviews of concepts and designs Presented finalized design concepts to clients and maintained client communication as needed Relevant Skills Proficient with semantic, accessible HTML; strong with responsive CSS/Sass, and ES6+ JavaScript; specialized in Vue, Svelte and SvelteKit, WordPress, SVG, web animation, performance, and optimization. Experienced with React, TypeScript, Tailwind, Knockout, jQuery, JS testing (Karma, Mocha, Chai, framework utility libraries), PHP, MySQL, Ruby on Rails, Laravel, Docker, AWS, RegEx, NGINX, (Varnish) caching, Redux, Storybook, git/GitHub, NPM, Jira, CLIs, DNS, SemVer. Education Codecademy January 2018 Certification: Codecademy Pro Intensive React web app builder course Interface Web School Spring 2015 WordPress Developer Certification Metropolitan Community College August 2012 – November 2014 Associate’s of Graphic Communication Art and Design Links Contact LinkedIn GitHub"
