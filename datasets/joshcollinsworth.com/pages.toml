title = "Let's learn SvelteKit by building a static Markdown blog from scratch - Josh Collinsworth blog"
description = "Learn the fundamentals of SvelteKit by building a statically generated blog from scratch, with Markdown support, Sass, an API, and an RSS feed."
full_description = '''Let's learn SvelteKit by building a static Markdown blog from scratch Published: December 27, 2021 Updated: February 17, 2023 Note I’ve done my best to keep this post up-to-date through all of SvelteKit’s breaking changes. It should be fully updated for SvelteKit 1.0, but if you spot any issues, please let me know in the comments or send me a message. Thanks for reading! If you’ve ever recommended a favorite book, movie, or TV show to a friend who didn’t enjoy it at all, you know exactly how I felt when I saw this message from a colleague: man I just tried to hello world SvelteKit and it is NOT for me I love Svelte, and I’ve talked plenty about how much I’ve enjoyed rewriting this site using SvelteKit. So my first reaction, of course, was disappointment. What went wrong? But as I considered their reaction, I realized: it was valid. Amazing though it is, SvelteKit isn’t the simplest thing you could use as a static site generator. Amazing though it is, SvelteKit isn’t the simplest thing you could use as a static site generator. Other tools like Astro, Eleventy, or Gatsby will likely get you up and running faster, since that’s their sole focus. (At one point, at least, even the SvelteKit docs admitted its focus was not making the fastest static site generator.) However, I still feel SvelteKit is worthy of serious consideration in that regard. Its capabilities are much more broad and flexible than traditional SSGs, and there’s plenty unique to love about both its developer and user experiences. So this post will be aimed at smoothing out that initial learning curve, to help you understand and take advantage of SvelteKit’s wide range of possibilities. What we’ll cover, and what to know first This is a walkthrough of using SvelteKit to set up a prerendered static blog with Markdown, Sass and an API. (That’s how this site is built, by the way.) This is also an intro to SvelteKit itself, with a good overview of SvelteKit fundamentals that should be transferable to any project. Finally, this is fun!* *My opinion; citation needed You’ll get the most out of this if you: Know the fundamentals of front-end development and JavaScript; Have at least a basic understanding of Svelte already. (You can probably follow along regardless, but I’d recommend the Svelte tutorial first if you’re brand-new); Know the basics of both Markdown and Sass; Understand the basics of fetching JSON from an API; and Know how to install packages with npm, and have npm installed already. Finally, if you don’t really want to go through the whole tutorial and would rather just have a nice blog starter all ready to go, check out my SvelteKit blog starter here. (It’s much more fleshed-out than what we’ll build here, but the underlying concepts are the same.) Let’s get started! Creating a new SvelteKit app To generate a new SvelteKit project, run this in your terminal (naturally, you can change my-app to whatever other title you prefer): npm create svelte@latest my-app When you run that init command, SvelteKit will ask you some questions about your project and how you want it set up: We’ll select the “Skeleton project” option. (Note: not “Library skeleton project;” we’re just building a site, not a library.) If this is your very first time using SvelteKit, feel free to choose “SvelteKit demo app,” poke around a bit to get a sense of how things work, then come back. It’s a good intro, but it comes with several files and styles that would be a lot to undo as a starter. The setup tool will also ask for your preferences on TypeScript, ESlint, and Prettier. For simplicity’s sake, I won’t use TypeScript, but you’re welcome to if you like. (Svelte works quite well with it.) Once you’ve made your choices, after a moment of installation, you should see Your project is ready! appear in your terminal, along with next steps and helpful links: At this point, let’s open up the project in VS Code (or your text editor of choice). Then in the terminal, install the dependencies, and then run the dev server: npm install npm run dev -- --open Complete those commands, and our new site will be running in a browser window! The skeleton project is definitely unexciting. There isn’t even any CSS yet. But that’s ok; it gives us the freedom to style our app however we like, without the need to remove or work around any existing code. This is our blank canvas, and we’ll get some paint on it soon enough. Routing in SvelteKit Like many frameworks (and for that matter, PHP), SvelteKit has a directory-based approach to routing and pages; the structure of src/routes/ will mirror the structure of your website. Any folder inside src/routes becomes the name of a page. A +page.svelte file inside that folder defines the page's HTML content. Any folder inside src/routes becomes the name of a page. A +page.svelte file inside that folder defines the page's HTML content. So, from inside src/routes: +page.svelte is the homepage (/) about/+page.svelte would become the /about page blog/+page.svelte would be be the /blog page blog/some-post/+page.svelte becomes /blog/some-post The convention of +page.svelte might seem a bit confusing or unnecessary—especially if you're used to the old index.svelte convention—but as we'll see soon, the special + prefix helps distinguish between components and pages.There are also other things we can add to routes besides just pages, like dynamic server paths; more on that later. Adding pages For starters, just to get some pages on our site, let’s create about, contact, and blog folders inside of src/routes. (We can always delete or modify them later.) Within each of those folders, we’ll add a +page.svelte file, to serve as the route’s contents; the stuff people actually see when they navigate to that route on your site. Within each of those files, let’s toss a quick heading, and maybe some text, just so we can see a little content. Svelte files can just contain plain HTML. <!-- about/+page.svelte --> <h1>Hi, I'm Josh!</h1> <p>This is my about page.</p> <!-- contact/+page.svelte --> <h1>Get in touch</h1> <p><a href="mailto:me@my.tld">Email me!</a></p> <!-- blog/+page.svelte --> <h1>Blog</h1> <p>My blog posts will go here eventually…</p> Our src/routes folder should now look like this: 📂 src ┗ 📂 routes ┣ 📜 +page.svelte ┣ 📂 blog ┃ ┗ 📜 +page.svelte ┣ 📂 about ┃ ┗ 📜 +page.svelte ┗ 📂 contact ┗ 📜 +page.svelte At this point, you could visit /contact, /about, and/or /blog to see the pages we just created. There’s not much there yet, of course, but it’s nice to at least see that routing is taken care of for us automatically, just by creating folders inside routes and adding a +page.svelte file inside them. Adding a layout Most sites and apps have some elements that are reused on every page (a <header> and <footer> being the most common and obvious examples). Since adding those to every page would be tedious and error-prone, SvelteKit (like many other frameworks) conveniently lets us define layouts. Inside of src/routes, make a new file named +layout.svelte. 📂 src ┗ 📂 routes ┗ 📜 +layout.svelte This file has a special role: SvelteKit automatically checks routes (and all its subdirectories) for a +layout.svelte file. That layout will “wrap” all the content loaded from that route and its sub-routes. A layout becomes a parent component, and the current page will be slotted in as its child component. A layout becomes a parent component, and the current page will be slotted in as its child component. So a layout at the top level of the routes folder will apply globally, on every page. It’s easier to show than tell, so open up our new +layout.svelte file, and let’s add a placeholder header and footer: <!-- +layout.svelte --> <header>Hi, I'm a header</header> <main> <slot /> </main> <footer>Hello, I'm the footer.</footer> Save that, and you should now see that header text above the page’s contents, and the footer text below. Creating components Manually typing routes in the browser isn’t great, so let’s add some navigation. In the process, we’ll create our first component. First, create a new folder called lib inside of src. (lib is another SvelteKit convention; more on that in a moment.) Inside src/lib, we’ll create a folder named components, just for organizational purposes. And inside of that, we’ll create a new component named Header.svelte: 📂 src ┣ 📁 routes ┗ 📂 lib ┗ 📂 components ┗ 📜 Header.svelte You don’t have to capitalize component names, or keep components in their own folder, but both are generally preferred conventions. Inside our new Header component, let’s place some proper (albeit basic) navigation: <!-- Header.svelte --> <header> <a href="/">Home</a> <nav> <ul> <li> <a href="/blog">Blog</a> </li> <li> <a href="/about">About</a> </li> <li> <a href="/contact">Contact</a> </li> </ul> </nav> </header> Save that, and let’s go back to +layout.svelte to use it! To use a component, we first need to import it, which means we’ll need to add a <script> tag to our layout. (I personally prefer it at the top of the file, but Svelte gives you the freedom to arrange components however you like.) Once imported, we can replace our placeholder header with the component: <!-- +layout.svelte --> <script> import Header from '$lib/components/Header.svelte'; </script> <Header /> <!-- The rest of the HTML here --> Notice the import path. $lib is a handy alias that goes directly to src/lib, saving you from typing tedious relative paths. (You can customize this alias or add your own in jsconfig.json, but I won’t cover that here.) Anyway, now we should see something slightly more user-friendly in our browser: The styling still isn’t great, but it’s usable. We can click between pages now, which will make testing things out a lot easier. Component styling Svelte component styles are scoped by default. That makes it easy to write CSS without fear of it bleeding out and having side effects anywhere outside the component. To try it out, in Header.svelte, add a <style> tag. (It could go anywhere, but I prefer to put it at the end.) <!-- Header.svelte --> <!-- ... The rest of the file's contents here --> <style> header { padding: 1rem; background: lightskyblue; display: flex; flex-wrap: wrap; justify-content: space-between; } ul { margin: 0; list-style-type: none; display: flex; gap: 1rem; } a { text-decoration: none; color: inherit; } </style> If you save and take a look at the site now, you should see your Header component looking a little more header-like. You might also notice that the styling doesn’t affect anything in our main page content. That’s the power of scoping! If you want to, you could repeat this process with a <Footer /> component now, too. I’ll skip over it, since it’s just the same thing over again, but it’s a good thing to do at some point. Remember: components related to routing (like pages, layouts, and endpoints) begin with a +. Normal, reusable components don’t, and are usually capitalized. (You can keep both in the routes folder, but often, it’s preferred to have reusable components in lib instead.) Stylesheets in SvelteKit Svelte lets you import stylesheets directly into components—including pages and layouts. There are other ways to load stylesheets, but I find that’s the best. It’s easy, for one thing, but more importantly, it also preprocesses them automatically, which we’ll want when we add Sass shortly. Create a new folder inside of src/lib for your styles, and add a style.css file inside it. 📂 src ┣ 📁 routes ┗ 📂 lib ┣ 📁 components ┗ 📂 styles ┗ 📜 style.css There are no rules about how you structure things inside of src/lib. You aren’t even required to use lib at all. Feel free to organize your folders however you like. You can add whatever CSS you prefer, but if you need a suggestion, here’s a little bit of boilerplate that should begin to get things looking slightly better: /* style.css */ body { margin: 0; background: #eee; color: #333; font-family: sans-serif; } main { padding: 1rem; margin: 2rem auto; max-width: 40rem; } Once we’ve got a stylesheet with some CSS in it, loading it globally is as easy as importing the file in our layout: <!-- +layout.svelte --> <script> import Header from '$lib/components/Header.svelte'; import '$lib/styles/style.css'; </script> <!-- ...HTML here --> Since SvelteKit is server-rendered, if you view the page source, you’ll even see our style has been added to the HTML, rather than being client-rendered. Neat! Importing stylesheets in JavaScript files is not a web standard; it’s just supported by some bundlers and build tools. Adding Sass to SvelteKit One of the great things about Svelte is how comparatively easy it is to add external processors, thanks to svelte-preprocess. svelte-preprocess automatically transforms the code in your Svelte templates to provide support for TypeScript, PostCSS, scss/sass, Less, and many other technologies. Our next step is to install both svelte-preprocess and sass, which we may as well do at the same time: npm i -D svelte-preprocess sass As of version 1.0, SvelteKit features vitePreprocess as an included alternative to svelte-preprocess. While vitePreprocess ships with SvelteKit and is therefore a bit simpler to use, as of this update, it’s unfortunately not as capable as svelte-preprocess, and lacks a few features I consider indispensable, such as the global modifier for component styles. For that reason, I’ve left svelte-preprocess as the preferred option in this tutorial. You can read more about both preprocessers in the docs. Modifying the Svelte config Next, open the svelte.config.js file, found in the project root. As the name implies, svelte.config.js is the home for, well, configuration. It’s where we’ll make any needed changes to SvelteKit’s options and compiler. This change is minimal; we just need to import svelte-preprocess, and then add it to SvelteKit’s list of preprocessors. // svelte.config.js import sveltePreprocess from 'svelte-preprocess'; const config = { kit: { /* ...other kit options here already */ }, preprocess: [sveltePreprocess()] }; Note that you’ll need to create the preprocess option; it’s not there by default. (We’ll add Markdown processing here later, too.) Also note that you can pass an object with more granular options into the sveltePreprocess() function, but we won’t for now. It knows what to do with Sass by default, so no further customization is needed. It’s worth mentioning the scss.prependData option, which allows you to automatically inject code at the start of any Sass processing (such as Sass variables or an @import). You can read more in the svelte-preprocess docs; I just wanted to mention it since it’s quite handy. One more quick, important thing to know: you’ll want to stop and restart your dev server any time you make a config change. Adding SCSS to component styles Now that we’ve got both Sass and our preprocessor installed, you can use Sass inside any component’s <style> block just by adding a lang attribute, like so: <style lang="scss"> // We can write SCSS here'''
