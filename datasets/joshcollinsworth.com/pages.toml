["https://joshcollinsworth.com/blog/devaluing-frontend"]
title = "The quiet, pervasive devaluation of frontend - Josh Collinsworth blog"
description = "I keep noticing those of us in the frontend field being treated much the same as nurses, paralegals, and executive assistants. Our work is seen as important, certainly, but just not the same as, or as important as, the “real” work."
full_description = "The quiet, pervasive devaluation of frontend Published: March 7, 2024 Updated: March 9, 2024 There’s a trend I’ve noticed—or at least, I think I’ve noticed. It’s the kind of thing that’s hard to be sure of; the kind that might genuinely be true, or might simply appear to be true if you look at it a certain way. I can’t tell if I’m right, or if the shapes I’m envisioning in arbitrary ink blots say more about me than they do about what I’m observing. Maybe it’s both. Maybe it’s all subjective gray area and I’m just picking a spot to draw a line. I guess you can decide for yourself. I feel like I’m seeing a widespread diminishment of the practice of frontend. Nearly everywhere I look, I notice its importance minimized, and its challenges trivialized. I feel like I’m seeing a widespread diminishment of the practice of frontend. Nearly everywhere I look, I notice its importance minimized, and its challenges trivialized. This effect might be invisible to you right now. And thus, you might be reflexively inclined to say it doesn’t exist. Maybe you’re right. Maybe it doesn’t. Maybe I just need to step away from my little screens in my little basement office a little more often. Or, maybe it’s just like any other implicit bias; maybe it seems like it doesn’t exist because it feels so ordinary until you know what to look for. So: let’s talk about what I see. Maybe you’ll see it, too. I see it in the way we talk about frontend languages I notice CSS is widely considered some or all of the following: unmaintainable; subjective; messy; unruly; unpredictable; a footgun; overly complicated; unscalable; and a nightmare. (I generally disagree with all of those. But then, I’m also fond of saying CSS is the only language that gets blamed when the author is bad.) But despite all these claims, CSS is also somehow “not a real programming language.” Many people online will tell you so, often quite loudly, and sometimes even using memes. Same with HTML. It’s like CSS exists in some bizarre quantum state; somehow both too complex to use, yet too simple to take seriously, all at once. It’s like CSS exists in some bizarre quantum state; somehow both too complex to use, yet too simple to take seriously, all at once. I find what most of those people actually mean is: HTML and CSS aren’t scripting languages. Which: a) of course they aren’t; and b) is not really the point at all. CSS is a programming language because that’s what you’re doing when you write it; you’re programming the application’s presentation logic. And that’s important, because CSS has power enough to either maximize the useability of software, or to ruin it beyond all utility. (Really; you’d probably be astounded how many ways there are to utterly destroy anything on the web with hardly any CSS.) In many ways, CSS has greater impact than any other language on a user’s experience, which often directly influences success. Why, then, is its role so belittled? In many ways, CSS has greater impact than any other language on a user’s experience, which often directly influences success. Why, then, is its role so belittled? HTML is similar; HTML might not have things like loops and conditionals, but it is still a programming interface nonetheless because it’s how you program a UI—and to do it well requires as much care and expertise as any other language. Language is reality This might all sound trivial. It might seem like I’m just asserting my stance in some petty online argument. Who cares what developers argue about online? Get a life (as we used to say in the ’90s). However, I believe there are actually very important reasons to care. To assert that frontend languages are not programming languages is to assert that what one is doing when writing them is not programming, but something else. Something different. Something—perhaps not explicitly spoken, but undeniably implied—lesser. And yes, as biases go, even if there is one against frontend developers, it would be pretty hard to rank it above any of the myriad other biases present in everyday society… …unless this bias is actually a part of those other biases? Frontend tends to be the most diverse job title among developers. If you wanted to find the dev specialization with the most people who aren’t cishet white males, you’d pick frontend. Do we honestly believe the language around frontend is different purely by mere coincidence? I see it in the way we talk about practices Certain pursuits are validated with importance, dignity, and honor. Doctors; lawyers; architects; CEOs; software engineers. Some kinds of work are “serious” work, which is well and good—except that, implicitly, that means other kinds are not serious. We might not ever say it, or even think it, but when we cast some people as heroes, we relegate others to the role of the sidekick—even though their labor is no less important, and they do at least as much to push the work toward success. Nurses; paralegals; interior designers; executive assistants; frontend developers. (Surely it’s a coincidence the first group tends to be more male than the second.) Other forms of development are generally considered serious work. They’re important. They’re real computer science. (Computer science itself being a higher level of things we’ve decided are real, serious, and important—maybe not quite as much as medicine or law, but then again, maybe so in some circles.) Engineering is unquestionably difficult and respectable work. The idea that other engineers are smart—even smarter than we are—is the kind of stereotype that feels so common and true it’s rarely even questioned. Mostly, nobody actually says frontend is less important, or less real, or that you don’t have to be as smart to do it. But it often seems to be implied. Mostly, nobody actually says frontend is less important, or less real, or that you don’t have to be as smart to do it. But it often seems to be implied. If I were to guess at the origins of this perception, I’d propose it might all come down to optics. Frontend engineers work in languages that, while notoriously difficult to master, are relatively straightforward to learn. A lot of engineers stop at the basics and move on to other things—which is fine, of course. But I posit this leads to a Dunning-Kruger effect where those who haven’t taken the time to learn what they don’t know never actually become aware of that hazardous chasm, or the mistakes they might have already made relying on their established knowledge. I’d guess most engineering managers and other folks in charge of developers probably know some HTML, CSS and JavaScript. These tend to be basics most developers touch on early on. I think when those people in charge look at a frontend developer, there’s an unconscious “I could do that.” Our output is artistic, to some degree, and artistic things have a long, storied history of being tragically devalued merely because they seem simple and enjoyable. Our output is artistic, to some degree, and artistic things have a long, storied history of being tragically devalued merely because they seem simple and enjoyable. Contrast our workflows and our output with a backend developer, or site reliability engineer, as examples. They live in worlds of daunting terminals, oceans of data, and inscrutably interconnected systems. What they do looks scary, like something I couldn’t do and wouldn’t want to. Their output is easily measurable. A new API feature; a more efficient database; crises averted and crashes prevented. They go on charts and get presented to board members. Our work? Much harder to measure. Mostly, people just critique it. Like art. Naming things is hard Do you ever notice that the job of a person who works on frontend is, explicitly, developing sofware—and yet, esteemed titles like “software developer” (or the arguably even more esteemed “software engineer”) very strongly imply something else? If our job title does include the word “engineer,” it will almost certainly specify what we’re engineering. It’ll be UI engineer, or frontend engineer, or maybe the newer (and arguably more fitting) design engineer. But it’s probably not “software developer” or “software engineer” without any other qualification. Because that, tacitly, is not what we do. Somebody else does that. What we do is, at best, only a part of that. (Implicitly: less than that.) Sure, this is nuance of language and these titles serve to disambiguate. I get that. Nobody sat down one day and came up with these titles, let alone maliciously; they’re just functions of language and time, and the way they shook out probably wasn’t anyone’s design. Still: we ought to know by now the power language has to shape our perceptions, and in turn, our behavior. The language implies interfaces are decoupled from the software, and not an actual part of it. The language implies interfaces are decoupled from the software, and not an actual part of it. Even though we engineer software all day every day, by definition, somehow what we do isn’t seen as software engineering. It’s different than that. It’s softer than that. Certainly, we should venerate the skills required to earn a computer science degree, or pass a whiteboarding exercise on data structures and algorithms. But why must we only respect that type of skill? Why does anyone’s work have to be “more?” Why can’t it all be important, and challenging, in its own way? I see it in the feminine coding of frontend Writing CSS seems to be regarded much like taking notes in a meeting, complete with the implicit sexism and devaluation of the note taker’s importance in the room. Writing CSS seems to be regarded much like taking notes in a meeting, complete with the implicit sexism and devaluation of the note taker’s importance in the room. Though critical to the project, frontend work will quite often be disregarded by those who consider it beneath them (usually men, and usually only tacitly, never explicitly). It’s not serious enough; not important enough; not real enough. Too squishy. Like soft skills. Yes, of course, it’s important. It’s work that somebody needs to do, certainly. But probably not the important people, whose valuable attention is focused on other, bigger, more important problems. Design itself is typically conflated with frontend, and design has long been colored as a “feminine” pursuit. The deep technical challenges of frontend functionality are often mistakenly regarded more as a sort of painting with pixels; making things look right, rather than work correctly. Incidentally, folks involved in UI and design tend to be hit harder in layoffs than their peers, who are perceived as “more technical.” Women, too, are often laid off in greater numbers than men. So it’s hard not to see frontend devaluation and sexism as intertwined. (If they’re even separate things at all, that is.) I see it in the way we talk about frontend developers Frontend is complicated. Few would contend with that. But for some reason, where the difficulty of other forms of engineering are generally blamed on the daunting complexity of computers themselves (and where, again, we generally revere the people who dare attempt to wrangle that complexity), there’s a pervasive myth that frontend is only complex because frontend developers made it that way. As though we added frameworks and compilers and heaps of packages to our projects because we simply didn’t know any better. As though the nearly impossible job of supporting every possible device, operating system, screen size, browser, user preference, and interface in the past, present and future is so simple we invented all the complexity ourselves, just because we were bored. As though the nearly impossible job of supporting every possible device, operating system, screen size, browser, user preference, and interface in the past, present and future is so simple we invented all the complexity ourselves, just because we were bored. There are lots of jokes about frontend developers. There’s nothing wrong with that. Often, we’re the ones making them; we’re not above laughing at ourselves, and besides, there are plenty of jokes about other specialties, too. We like to kid about our affinity for new things. How we’re always coming up with new frameworks. How we’re always chasing the new hotness. That’s all well and good…until the joke starts to become the actual perception. Until we begin to be taken less seriously, because our reputation is a punch line. Yes, as a group, we get excited about new things. But why doesn’t that make us curious, or adaptable, or inquisitive? Why don’t we get credit for our joy of learning, instead of denigrated for refusing to stay in place? Why don’t we get the benefit of the doubt? Yes, as a group, we get excited about new things. But why doesn’t that make us curious, or adaptable, or inquisitive? Why don’t we get credit for our joy of learning, instead of denigrated for refusing to stay in place? Why don’t we get the benefit of the doubt? Browsers move fast, and they’ve evolved at an unprecedented pace in recent years. So I guess I’m not sure where the assumption that we frontend devs should be so intransigent in our tech choices comes from. Shouldn’t we be persistently reevaluating, when the landscape is constantly shifting? Shouldn’t we try to keep up? To be better? To rework old ideas with new capabilities? Don’t we deserve to be considered just a bit more than flighty little magpies, chasing anything that’s shiny? I see it in our responsibilities In my experience (yours may vary, of course), frontend engineers are regularly deployed as “fixers” on projects. We often aren’t included at the beginning stages, where we could easily identify costly accessibility, performance, and user experience mistakes; we’re brought in at the end, when things have already been built and it’s too late to change anything significantly. By then, it’s our job just to pretty things up. “Here; other people already made this.” (i.e., they already did the real work.) “Now we just need you to fix it up.” But…why is it broken? Why aren’t we addressing the pipeline that generated a flawed product to begin with? If our skills are valuable as duct tape over the cracks of organizational shortcomings, why aren’t they valuable during the planning and decision-making that led to those defects, when we could potentially prevent them? If our skills are valuable as duct tape over the cracks of organizational shortcomings, why aren’t they valuable during the planning and decision-making that led to those defects, when we could potentially prevent them? Why are we considered mere decorators, brought in at the end to spruce the place up a bit? (As though a decorator could fix a deeply inaccessible building with a fresh coat of paint and some classy furniture.) I see it in what’s expected of us The list of skills that a frontend engineer must know expands constantly and unendingly. The world where you could just learn some HTML, "
