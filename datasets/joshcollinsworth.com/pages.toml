full_description = '''A response to "Defending Open Source: Protecting the Future of WordPress" November 5, 2024 I feel it's important to issue a critical reading of Automattic's post, as it doesn't seem to offer much of a serious or objective examination of the issues at hand. Rather, the post unfortunately reads as something more akin to a puff piece, or corporate propaganda. Read more… opinionwebwordpress If WordPress is to survive, Matt Mullenweg must be removed September 27, 2024 I believe Matt Mullenweg's abuses of his unilateral, unchecked powers prove that it is in the best interest of the entire WordPress community that he be removed from power immediately. Read more… opinionwebwordpress A decade of code May 10, 2024 A personal (read: meandering) post inspired by the realization that I first began to learn HTML and CSS exactly ten years ago, reflecting on the lucky turning points that brought me to where I am today. Read more… personalweb The quiet, pervasive devaluation of frontend March 7, 2024 I keep noticing those of us in the frontend field being treated much the same as nurses, paralegals, and executive assistants. Our work is seen as important, certainly, but just not the same as, or as important as, the “real” work. Read more… personalopinioncssweb Classic rock, Mario Kart, and why we can't agree on Tailwind September 26, 2023 It's popular to say we can’t agree on Tailwind, but I posit we actually already do. I think what we actually disagree on isn’t the details of this (or any) specific software; it's in what we value, and how we each define assets and liabilities. Read more… csspersonalopinionweb Things you forgot (or never knew) because of React August 4, 2023 If you don't often look beyond established comfortable defaults, you might be surprised to learn just how far the world of frontend has moved away from React, and how big that gap continues to grow. Read more… opinionwebreactpopular Adding page transitions in SvelteKit March 1, 2023 Transi