["https://joshwcomeau.com/blog/how-i-built-my-blog-v2"]
title = "How I Built My Blog • Josh W. Comeau"
description = "I recently launched a brand new version of this blog, and in this post, I share how it’s built! We’ll examine the tech stack and see how all of the pieces fit together, as well as dig into some of the details to see how they work."
full_description = '''Over the past few months, I’ve been working on a brand new version of this blog. A couple of weeks ago, I flipped the switch! Here’s a quick side-by-side: Blog Homepage (Old)Blog Homepage (New)ToggleExpand From a design perspective, it hasn’t changed too much; I like to think that it’s a bit more refined, but the same general idea. Most of the interesting changes are under-the-hood, or hidden in the details. In this blog post, I want to share what the new stack looks like, and dig into some of those details! Over the years, my blog has become a surprisingly complex application. It’s over 100,000 lines of code, not counting the content. Migrating everything over was a big project, but super educational. I’ll share my honest thoughts on all of the new technology I used for this blog. If you’re planning on starting a blog yourself, or are thinking about using some of the technologies I’m using, this post will hopefully be quite helpful! Link to this headingThe core stack Let’s start with a quick list of the major technologies used by my blog: Next.jsv15.0.0 (beta)Reactv19.0.0 (beta)MDXv3.0.1Linariav6.1.0Shikiv1.17.7Sandpackv2.13.8React Springv9.7.3Framer Motionv11.2.10MongoDBv6.5.0TypeScriptv5.6.2PartyKitv0.0.108 This list probably seems like overkill for a blog, and a few people have asked me why I didn’t opt for a more “lightweight” alternative. There are a few reasons: All of my blog posts are written using MDX, so I needed first-class MDX support. My other main project, my course platform, uses Next.js. I wanted as little context-switching friction as possible. I wanted to get a bit more experience with the latest React features, things like Server Components and Actions. If it wasn’t for reasons 2 and 3, I probably would have given Astro(opens in new tab) a shot. I’ve also been curious about Remix(opens in new tab) for a long time! I think both are likely fantastic options. Pages Router vs. App RouterAs you may know, Next.js recently introduced a brand new routing system, the App Router. It’s a fundamental reimagining of how routing and rendering can work in React, the result of years of work from both the React and Next.js core teams.The previous version of this blog was also built with Next.js, but it used the older Pages Router. For my new blog, I worked exclusively with the App Router.It’s been really interesting getting to compare and contrast the two approaches. Later in this post, I’ll share my thoughts about this new direction, and whether it’s been worth migrating or not. Link to this headingContent management I write blog posts using MDX. It’s probably the most critical part of the tech stack for me. If you’re not familiar with MDX, it’s essentially a combination of Markdown and JSX. You can think of it as a superset of Markdown that provides an additional superpower: the ability to include custom React elements within the content. With MDX, I can create interactive widgets and drop ‘em right in the middle of a blog post, like this: Container width:600Drag me!Name:Email:Submit Taken from my blog post, An Interactive Guide to Flexbox. This ability is crucial for the sorts of content I create. I didn't want to be limited by the standard set of Markdown elements (links, tables, lists…). With MDX, I can create my own elements! It feels so much more powerful than traditional Markdown, or rich-text content stored in a CMS. You might be wondering: Why not go “full React”, and skip the Markdown part altogether? When I built the very first version of this blog, way back in 2017, that’s exactly what I did. Each blog post was a React component. There were two problems with this: The writing experience was awful. Having to wrap each paragraph in a <p>, for example, gets old really fast. There was no way to access the content as data. I couldn’t, for example, get a list of the 10 most recently updated blog posts, since each blog post was a chunk of code, not a database record or JSON object. MDX solves both of these problems, and without really sacrificing anything. I still have the full power of React when I'm writing blog posts! In terms of workflow, I edit my MDX files directly in VS Code and commit them as code. Article metadata (eg. title, publish date) is set in frontmatter at the top of the file. There are some drawbacks to this method (eg. I have to re-deploy the whole app to fix a typo), but I’ve found it’s the simplest option for me. There are several ways to use MDX with Next.js. I'm using next-mdx-remote(opens in new tab), mostly because it’s what I use on my course platform and I want the two projects to be as similar as possible. If you’re building a brand-new blog using Next.js, it’s probably worth giving the built-in MDX support(opens in new tab) a shot; it seems a lot more straightforward. Migrating from MDX v1 to v3The old version of this blog used MDX as well, but it used version 1. As part of the blog rebuild, I took the opportunity to update to the latest version, v3.The migration was honestly pretty frustrating at times 😅. Things that “just worked” in v1 became unsupported in v2/v3. In some cases, I was able to restore the old behaviour by installing a remark/rehype plugin, but most of the time I either had to hack together my own solution, or manually edit my MDX to match the new format.It wound up being a pretty big task, and it was demotivating at times because I didn’t feel like the new version was an improvement. I preferred the trade-offs made in v1. 😬That said, certain things are definitely better in the newer versions, and most of my gripes are subjective / a matter of taste. MDX remains the best solution I'm aware of for creating interactive content. If I was starting a brand-new project today, I would still choose MDX v3.*I might prefer the semantics of v1, but it’s unmaintained and hasn’t been updated since 2020, so it’s more prudent to use the latest version. Link to this headingStyling and CSS The old version of my blog used styled-components, a CSS-in-JS library. As I’ve written about previously, styled-components isn’t fully compatible with React Server Components. So, for this new blog, I've switched to Linaria(opens in new tab), via the next-with-linaria integration(opens in new tab). Here’s what it looks like: Copy to clipboardimport { styled } from '@linaria/react'; const Wrapper = styled.div` background: red; `; Linaria is an awesome tool. It offers a familiar styled API, but instead of working its magic at runtime, it instead compiles to CSS modules. This means that there is no JS runtime involved, and as a result, it’s fully compatible with React Server Components! Now, getting Linaria to work with Next has been an uphill battle. I ran into a few weird issues. For example, when I import React in a file without actually using it, I get this bewildering error: EvalError: TextEncoder is not defined/node_modules/.pnpm/@wyw-in-js+transform@0.4.1_typescript@5.4.5/node_modules/@wyw-in-js/transform/lib/module.js:223 throw new EvalError(e.message, this.callstack.join('\n| ')); The error messages / stack traces didn’t really help, so I solved most issues by walking backwards through my changes and/or deleting random things until the error disappeared. Fortunately, all of the issues I’ve found are consistent and predictable; it’s not one of those things where the error happens sometimes, or only in production. Once I learned all of its idiosyncracies, it’s been pretty smooth sailing, though there is one significant remaining issue. And it doesn’t have to do with Linaria at all, it has to do with how Next.js handles CSS modules. It’s too much of a detour to cover properly in this post, but to quickly summarize: Next.js “optimistically” bundles a bunch of CSS from unrelated routes, to improve subsequent navigation speed and guarantee the correct CSS order. This blog post, for example, loads 245kb of CSS, but it only uses 47kb.*Both of these numbers are the full uncompressed values. The actual amount of data sent over the wire is smaller. There is an active discussion on Github(opens in new tab) about this, and it sounds like some upcoming config options could improve the situation. Given all of this, I can’t really recommend Linaria. It’s a wonderful tool, but it just isn’t battle-tested enough for it to be a prudent decision for most people/teams. I'm currently most excited about Pigment CSS(opens in new tab), a zero-runtime CSS-in-JS tool being developed by the team behind Material UI. In the future, it will be the CSS library used by their popular MUI component library, which means it will quickly become one of the most battle-tested CSS libraries out there. It’s still early days, but once they release their version 1.0, I plan on trying to switch. Hopefully by then, Next.js has fixed the bundling issue with CSS Modules. 🤞 Why not use Tailwind?Over the past couple of years, Tailwind has become the most popular styling tool for React applications. Surely I could avoid all of these baffling issues by switching to Tailwind?There are a few reasons why this wasn’t the right solution for me: I had something like 1500 styled-components, and so I needed a tool that offered a simple migration path. I'm not rewriting thousands of lines of CSS by hand. Tailwind doesn’t support code-splitting at all, meaning that your entire app uses a single CSS file, loaded on every route. Because each declaration is its own reused class, this isn’t a huge problem for most projects, but it depends on how you use CSS. I tend do a lot of custom stuff with CSS variables, which could cause problems. Using Tailwind is an exasperating experience for me, and I want the projects I work on to be fun. Tailwind is just not my cup of tea. Link to this headingCode snippets Code snippets look very different on the new blog, thanks to a custom-designed syntax theme! Here’s a before/after: Code Snippets (Old)Code Snippets (New)ToggleExpand If you’d like to use this theme in your IDE, you can download the JSON files (dark, light). I haven’t tested it, but it uses the same grammar as VSCode and other editors, so it should work. A new coding fontYou might’ve noticed that the coding font has changed between the old blog and this one!After experimenting with a dozen different options, I landed on Connary Fagen’s Cartograph CF(opens in new tab). It’s a wonderfully whimsical font. I especially like the cursive italics:Copy to clipboard// Check out these sweet italics!Cartograph CF is a paid font. You can buy Cartograph CF directly from its foundry, but it may be cheaper to purchase through Font Bros(opens in new tab). Link to this headingThe magic of static I'm using Shiki(opens in new tab) for managing the syntax highlighting. While not specifically built for React, Shiki is designed to work at compile-time, making it a perfect fit for React Server Components. This is surprisingly exciting. In my old blog, I was using Prism, a typical client-side syntax highlighting library. Because all of the code gets included in the JavaScript bundle, several sacrifices have to be made: We have to be very conservative about the number of languages we support, since each additional language will add kilobytes to our bundle. The syntax highlighting logic is lean, much simpler than the syntax highlighting inside IDEs like VS Code. This gives theme creators less control over the end result, and means we can't share themes between IDE and Prism. With the minimal set of built-in languages, Prism winds up being 26kb minified and gzipped(opens in new tab), which is incredibly small for a syntax highlighter, but still a substantial addition to the bundle. With Shiki, it adds 0kb to the JavaScript bundle, it uses the same industry-standard TextMate grammar as VS Code, and it can support dozens of languages at no additional cost. This means that when I want to include a Haskell snippet, as I did in a random blog post I wrote years ago, it will be fully syntax-highlighted: Copy to clipboardpe58 = n where a p q = scanl (+) p $ iterate (+ 8) q b = [[x,y,z] | (x,(y,z)) <- zip (a 3 10) $ zip (a 5 12) (a 7 14)] c = zip (scanl1 (+) . map (length . filter isPrime) $ b) (iterate (+ 4) 5) [(n,_)] = take 1 $ dropWhile (\(_,(a,b)) -> 10*a > b) $ zip [3,5..] c Shiki is a joy to work with as a developer. It’s incredibly flexible and extensible. For example, I created my own “annotation” logic, so that I can highlight specific lines of code: Copy to clipboardfunction someRandomFunction() { // These two lines are highlighted! You can tell by the // background color, and the little bump on the left. return 42; } On my old blog, syntax highlighting didn't work properly for CSS-in-JS. My template strings would be treated as a standard string, rather than a bit of injected CSS within JS: With Shiki, I was able to reuse the syntax-highlighting logic that the styled-components VSCode Extension(opens in new tab) provides. And so now, my styled-components are highlighted correctly: Copy to clipboardconst FunkyButton = styled.button` position: absolute; background: linear-gradient( to bottom, red, gold ); @media (min-width: 24rem) { &:focus { background: gold; } } `; export default FunkyButton; As much as I love Shiki, it does have some tradeoffs. Because it uses a more powerful syntax-highlighting engine, it’s not as fast as other options. I was originally rendering these blog posts “on demand”, using standard Server Side Rendering rather than static compile-time HTML generation, but found that Shiki was slowing things down quite a bit, especially on pages with multiple snippets. This problem can be solved either by switching to static generation or with HTTP caching. Shiki is also memory-hungry; I ran into an issue with Node running out of memory(opens in new tab), and had to refactor to make sure I wasn't spawning multiple Shiki instances. The biggest issue, however, is that sometimes I need syntax highlighting on the client. For example, in my Shadow Palette generator tool, the snippet changes based on how the user edits the shadows: There’s no way to generate this at compile-time, since the code is dynamic! For these cases, I have a second Shiki highlighter. This one is lighter, only supporting a small handful of languages. And it isn’t included in my standard bundles, I'm lazy-loading it with next/dynamic(opens in new tab). Since the syntax highlighting itself is slower, I'm using useDeferredValue to keep the rest of the app fast. The trickiest part was that I needed both a static Server Component as well as a dynamic Client Component, in order for SSR to work correctly. I secretly swap between them on the client, after everything has loaded. Link to this headingCode playgrounds In addition to code snippets, I also have code playgrounds, little Codepen-style editors: Code Playground Reset CodeShow line numbersFormat code using PrettierOpen in CodeSandboxPrideFlag.jsPrideFlag.module.cssconstants.jsimport React from 'react'; import range from 'lodash.range'; import styles'''
