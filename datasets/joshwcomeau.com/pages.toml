full_description = "Animated Pride FlagsHappy Pride month! In this tutorial, I'll share a handful of my favourite animation tricks. You'll learn how to build an animated wavy pride flag using CSS keyframes and linear gradients. We'll also see how to make it dynamic using React. 🏳️‍🌈Read more: Animated Pride Flags An Interactive Guide to Keyframe AnimationsCSS keyframe animations are incredibly flexible and powerful, but they’re also a bit weird. In this deep-dive tutorial, we'll learn how CSS keyframes work from the ground up, and see how to use them to build high-quality animations.Read more: An Interactive Guide to Keyframe Animations Building a Magical 3D ButtonBet you can't click just once!Every action we take on the web starts with a button click, and yet most buttons are ho-hum and uninspired. In this tutorial, we'll build an animated 3D button with HTML and CSS that sparks joy.Read more: Building a Magical 3D Button An Interactive Guide to CSS TransitionsThis comprehensive guide shows how to use CSS transitions! A back-to-basics look at the fundamental building blocks we need to create microinteractions and other animations.Read more: An Interactive Guide to CSS Transitions A Friendly Introduction to Spring PhysicsOf all the little tips and techniques I've picked up over the years about animation, spring physics remains one of the most powerful and flexible. In this tutorial, we'll learn how to harness their power to build fluid, organic transitions.Read more: A Friendly Introduction to Spring Physics Dynamic Bézier CurvesA deep dive into Bézier curves in React. We'll look at how to build dynamic effects such as scroll-to-flatten using SVG path instructions, and how to architect our components for maximum readability and reusability.Read more: Dynamic Bézier Curves"
