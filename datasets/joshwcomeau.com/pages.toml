full_description = "A Million Little SecretsDeconstructing the “Whimsical Animations” landing pageI spent the past few weeks packing as many easter eggs as I could into my latest project, and in this blog post, I want to dig into some of the more interesting details! If you’re interested in animations/interactions, you’ll want to check this one out; I share a bunch of my favourite secrets and tricks. 😄Read more: A Million Little Secrets How I Built My Blog2024 “App Router” EditionI recently launched a brand new version of this blog, and in this post, I share how it’s built! We’ll examine the tech stack and see how all of the pieces fit together, as well as dig into some of the details to see how they work.Read more: How I Built My Blog The End of Front-End DevelopmentLarge language models like GPT-4 are becoming increasingly capable, at an alarming rate. Within a couple of years, we won't need developers any more! …Or at least, that's the narrative going viral on social media. I'm much more optimistic about what these AI advancements mean for the future of software development.Read more: The End of Front-End Development How To Learn Stuff QuicklyAs software developers, we're always learning new things; it's practically the whole gig! If we can learn to quickly pick up new languages/frameworks/tools, we'll become so much more effective at our job. It's sort of a superpower.Read more: How To Learn Stuff Quickly How I Built My BlogOriginal 2021 EditionAn in-depth look at the technical stack behind this very blog! We'll see how I use Next's API routes to implement my hit and like counters, how I use MDX to add interaction and customization, and how I organize my codebase, among others.Read more: How I Built My Blog Hands-Free CodingHow I develop software using dictation and eye-trackingEarlier this year, I lost the ability to use a keyboard and mouse for extended periods. Fortunately, this wasn't as catastrophic as it sounds! This article chronicles my experience using 