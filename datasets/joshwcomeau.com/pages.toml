["https://joshwcomeau.com/blog/whimsical-animations"]
title = "A Million Little Secrets • Josh W. Comeau"
description = "I spent the past few weeks packing as many easter eggs as I could into my latest project, and in this blog post, I want to dig into some of the more interesting details! If you’re interested in animations/interactions, you’ll want to check this one out; I share a bunch of my favourite secrets and tricks. 😄"
full_description = '''Table of ContentsIntroductionSome quick contextChaos toolbarParticlesSpritesFrosted glass piecesThe synthSound effectsWhere to find soundsMultiple samplesOn/off samplesProgress samplesMy use-sound hookFireworksIn conclusionIntroductionFor the past few months, I’ve been hard at work on my upcoming third course, Whimsical Animations. For each course, I create a custom landing page, and for a course about whimsical animations, I knew the landing page needed to be very extra. It took longer than I’d care to admit, but the course’s landing page(opens in new tab) is now live. 😄 At first glance, it looks pretty straightforward, even minimal… but there’s a lot going on under the surface. This landing page contains 14,000+ lines of code and 200+ files! In today’s blog post, I want to dig into some of the more interesting details and share how I built them. It won’t be a full-blown tutorial, but my goal is to give you a few solid techniques you can start using right away in your own work. ✨ Spoilers ahead!There are several little surprises baked into the landing page, and this blog post lays many of them out unceremoniously. If you have a few minutes to spare, I’d suggest visiting the page first yourself, and seeing if you can discover them! Whimsical Animations(opens in new tab) The experience is very limited on mobile. If at all possible, I’d strongly encourage you to visit on desktop. Link to this headingSome quick context If you’re familiar with my work, you know I love including whimsical lil’ details. Every week, I get questions around how I built a particular animation or interaction. Whimsical Animations is my attempt to bottle up all of that knowledge and experience into a comprehensive interactive online course. You’ll learn the set of core techniques I use to design and create all sorts of different effects. It’ll cover some of the most popular animations and interactions from this blog and my other projects, but my goal is much more broad than that. I want to give you the tools you can use to come up with your own unique effects. You’ll learn how to build animations and interactions using vanilla web technologies: CSS, JavaScript, SVG, and 2D Canvas. There will also be some extra content focused on React integration (which should translate reasonably well to other JS frameworks). The bulk of the course will focus on implementation, but we’ll cover the design process as well. My goal is to launch the course in “Early Access” by the end of the year. If you’re interested, I’d encourage you to join the waitlist(opens in new tab): you’ll be notified the moment the course is available, and I plan on sending extra little goodies and things in the weeks ahead. 💖 Link to this headingChaos toolbar The main thing that makes this page interesting is the “Chaos Toolbar”, a set of buttons in the top-right that allow the user to manipulate the page. For example, the grabber tool lets you pluck and throw individual elements: There’s also the bomb tool, which does exactly what you’d expect: Each tool has an icon, and each icon has unique animations. Let’s enlarge these icons so that we can examine these animations more closely. Hover or focusTap each icon to see it in action: Select “Grabber” toolSelect “Eraser” toolSelect “Bomb” toolSelect “Wand” tool Boop!Most hover animations work by applying some sort of transformation on hover, using the transition property to animate that transition:Copy to clipboard.some-element { transition: transform 200ms; &:hover { transform: rotate(10deg); } }I prefer to use a different approach: I briefly apply an override style on hover, but that style unsets itself after a short interval, regardless of whether the user is still hovering or not. This produces a short burst of motion that I call a “boop”.I wrote all about “Boop” transitions in an earlier blog post, so I won’t repeat all that stuff here. Most of these icons come from Lucide Icons(opens in new tab), my favourite icon pack. The only exception is the bomb, which I created myself in Figma. These icons are nice as-is, but in my opinion, it’s the animations that really bring them to life, adding so much character to our UI. Let’s talk about how we can add these sorts of animations. Lucide icons are distributed as SVGs. If you open one of these suckers up in your IDE, you’ll see something like this: Copy to clipboard<!-- /user/Downloads/eraser.svg --> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" > <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/> <path d="m5 11 9 9"/> <path d="M22 21H7"/> </svg> Unlike raster image formats like gif/jpg, SVGs are specified in an XML format, just like HTML tags! In fact, we can directly embed this code in our HTML (or in our JSX). This allows us to manipulate specific portions of our icon! A full explanation of SVGs is well beyond the scope of this blog post, although it’s something we’ll cover in depth in the course. To quickly summarize what’s going on here: our eraser icon consists of 3 <path> tags. Each <path> is a set of drawing instructions. When we layer these three instructions together, we get our eraser icon: Path APath BPath C Path A and B are the eraser itself, and Path C is the surface being erased. For our purposes, we want the eraser to move back and forth without affecting the surface: Pause We can accomplish this by wrapping the first two paths in a <g> tag, which stands for “group”. Then, we can apply a CSS transform to that group, sliding those two <path> tags along! I’m doing a similar trick on the “Bomb” icon. At first glance, it appears to be a standard transform: rotate(), but there’s a bit more to it than that. Play along with this slider to exaggerate the effect, to make it clearer: Autoplay animationMagnitude:50 To explain what’s going on here: the whole bomb rotates by 10 degrees. Then, on a <path> within the bomb’s SVG, I’m applying a nested rotation to the little fuse. It’s affected by both the parent rotation on the bomb and an additional rotation on the fuse. The trick to making this work is to make use of transform-origin to make sure each rotation pivots correctly. The parent rotation is anchored on the center of the bomb’s circle, while the fuse rotation is anchored to the tip of the bomb: Main pivot pointFuse pivot point SVG animation is one of the most important tools in my toolbox, and we’ll be covering it in depth in the course. In the meantime. you can learn more about transform-origin in my blog post, “The World of CSS Transforms”. Bomb Editing PanelThe bomb tool in the Chaos Toolbar has its own little secret feature: if you click and hold, something happens:This feature is only available on desktop. For keyboard users, you’ll discover an extra hidden button when tabbing past the bomb.Check it out on the Whimsical Animations landing page(opens in new tab). Link to this headingParticles The fourth tool in the Chaos Toolbar, the magic wand, is by far the most elaborate. Several elements on the page can be transformed, with unpredictable results. For example, the main heading can swap between different styles: Whenever an element is transformed, the wand cursor emits a few stars. This is an example of a particle effect, and it’s one of my favourite “genres” of effects. You might notice that the particles don’t fire in a completely random direction. They all wind up within a 45° cone: Each particle is positioned right under the cursor using absolute positioning and top / left, with transform: translate() used to fling them up and to the left. But how do we come up with the specific values for each particle? The key is to think in terms of polar coordinates. This stuff gets so much easier to reason about with the right coordinate system. On the web, we’re used to thinking in terms of cartesian coordinates: we specify things in terms of their X/Y displacement. transform: translate(-30px, 10px) will move the element 30 pixels to the left and 10 pixels down. With polar coordinates, we don’t think in terms of X and Y. We think in terms of angle and distance. This will be easier to explain with a demo. ClickTap around inside each graph to see how the coordinates are calculated. If you don’t use a pointer device, you can also use the keyboard by focusing the handle and using the arrow keys: Cartesian Coordinates110-45X: 110px, Y: -45pxX (Horizontal)110pxY (Vertical)-45pxPolar Coordinates110°125Distance: 125px, Angle: 110°Angle110°Distance125px With cartesian coordinates, it’s not really clear how to come up with valid X/Y values for my wand effect. But with polar coordinates, it’s pretty straightforward; I can generate random values within a specified range: Copy to clipboardimport { random } from '@/utils'; function generateParticle() { // Generate a random angle between 200° and 240°: const angle = random(200, 240); // Same thing for distance, between 30px and 60px: const distance = random(30, 60); return { angle, distance }; } (random is a small utility function that picks a random number between two values.) Now, we can’t actually apply a CSS transformation using polar coordinates; we need to convert them back to cartesian values before we can use them. This can be accomplished with trigonometry. I’ll spare you the math and give you the formula: Copy to clipboardfunction convertPolarToCartesian([angle, radius]) { const angleInRadians = convertDegreesToRadians(angle); const x = radius * Math.cos(angleInRadians); const y = radius * Math.sin(angleInRadians); return [x, y]; }; const convertDegreesToRadians = (angle) => (angle * Math.PI) / 180; I used to do all this logic in JavaScript and apply the final value in CSS, but these days, CSS has trigonometric functions built in! By combining them with CSS variables, we can set up a keyframe animation like this: Copy to clipboard@keyframes flingAway { to { transform: translate( calc(cos(var(--angle)) * var(--distance)), calc(sin(var(--angle)) * var(--distance)) ); } } .particle { animation: flingAway 1000ms ease-out; } Then, when we render our particles, we define --angle and --distance for each one. Here’s what that looks like in JSX: Copy to clipboardfunction Particle() { const angle = convertDegreesToRadians(random(200, 240)); const distance = random(30, 60); return ( <div className="particle" style={{ '--angle': `${angle}deg`, '--distance': `${distance}px`, }} /> ); } export default React.memo(Particle); This is the core strategy I’ve been using for particles, and it works great. There’s a bunch of other stuff we can do to make it even better, like: Adding random rotation with transform: rotate(). Applying another keyframe animation to fade the particle out after it settles in its final position. Randomizing animation-duration and animation-delay, to make it feel less choreographed/robotic. Garbage-collection, to remove old particles from the DOM. Using a spring-derived easing curve with linear(). Unless you’re a math enthusiast, this “polar coordinates” stuff probably doesn’t send a thrill up your leg, but honestly, it’s a critical concept for the sorts of things I build, one of the secret little keys that I rely on all the time. For example, the interactive rainbow on this blog’s homepage(opens in new tab) relies on polar coordinates: So does this “angle” control I created for my Gradient Generator: And this absolutely-ridiculous effect in Tinkersynth(opens in new tab), my generative art toy, relies entirely on shifting between cartesian and polar coordinates: Originally, this control was going to be a boolean toggle between cartesian or polar. On a whim, I decided to try mixing the two values, and this was the result. 😮 These are the first three examples that came to mind, but the list goes on and on. We’ll see more examples in the course. 😄 Link to this headingSprites The “Whimsical Animations” landing page is littered with random shapes: tubes and octahedrons and eggs, all sorts of stuff. I made these shapes myself using Blender, which is 3D modeling software. After creating 22 of these lil’ shapes, I realized I had a problem. 😬 Most optimization tools I use, like next/image, strip out color profile information. They flatten my beautiful wide-gamut images into the sRGB color space, losing a ton of richness and vibrance in the process: Color Mode:sRGBP3If the two images look the same to you, it’s likely because you’re not using a display that supports the P3 color space. When I keep them in their native P3 color space, each image is between 50kb and 150kb. With 22 individual images, I’d be sending almost two megabytes of assets, which feels like way too much for decorative images like this! It would also mean that each image would blink into existence whenever it finished loading, on its own schedule, creating a distracting flurry with no rhyme or reason. To solve these problems, I used a sprite. ✨ A sprite is a single image that contains all of the individual shapes packed together. Here’s a shrunk-down version: In my markup, I create individual <img> tags for each shape, using the object-position property to pan around inside the image and show a single shape. The code looks something like this: Copy to clipboard<style> .decoration { object-fit: none; object-position: var(--x) var(--y); /* Support high-DPR screens by rendering at 50% of the image’s true size: */ transform: scale(0.5); } </style> <img alt="" src="/images/shape-sprite.png" class="decoration" style="--x: -387px; --y: -125px; width: 120px; height: 240px" /> <img alt="" src="/images/shape-sprite.png" class="decoration" style="--x: -42px; --y: -201px; width: 456px; height: 80px" /> <!-- ...and so on, for all 22 shapes --> This is pretty tedious work: using image-editing software, I go through the shapes one by one, measuring its distance from the top/left corner, as well as its width/height. I hardcode all of this data in a big JSON object, and then map over it and render an <img> tag for each one. In order for images to look crisp on high-DPR displays like Apple’s Retina displays, the image is actually twice as big as its displayed size. I use transform: scale(0.5) to shrink it down to its intended size. Ideally, I should have two or three different versions of the spritesheet and swap between them based on the monitor’s display pixel ratio, but ultimately this’ll still look fine on standard displays. By using a sprite, we also solve the problem of each image popping in whenever it finishes loading. Instead, I set it up so that the images would fade in sequence, starting from the center and moving outwards. Here’s what that looks like, at half-speed: This fade animation uses a keyframe animation: Copy to clipboard@keyframes fadeFromTransparent { from { opacity: 0; } } Then, I use animation-duration and animation-delay to create the staggered swelling effect: Copy to clipboard<img alt="" src="/images/shape-sprite.png" class="decoration" style=" --x: -42px; --y: -201px; width: 456px; height'''
