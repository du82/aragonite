["https://joss.theoj.org/about"]
title = "Journal of Open Source Software"
description = "Journal of Open Source Software (JOSS) is a developer friendly, open access journal for research software packages."
full_description = "The Journal of Open Source Software is a developer friendly, open access journal for research software packages. The Journal of Open Source Software (JOSS) is an academic journal (ISSN 2475-9066) with a formal peer review process that is designed to improve the quality of the software submitted. Upon acceptance into JOSS, a Crossref DOI is minted and we list your paper on the JOSS website. Perhaps, and in a perfect world we'd rather papers about software weren't necessary but we recognize that for most researchers, papers and not software are the currency of academic research and that citations are required for a good career. We built this journal because we believe that after you've done the hard work of writing great software, it shouldn't take weeks and months to write a paper about your work. We have a simple submission workflow and extensive documentation to help you prepare your submission. If your software is already well documented then paper preparation should take no more than an hour. JOSS publishes articles about research software. This definition includes software that: solves complex modeling problems in a scientific context (physics, mathematics, biology, medicine, social science, neuroscience, engineering); supports the functioning of research instruments or the execution of research experiments; extracts knowledge from large data sets; offers a mathematical library; or similar. Research Software Engineer (RSE) at the University of Birmingham since 2023. Everyday user of Fortran and Python; increasingly dabbling in various languages and tools as a part of being an RSE. Samuel Forbes is an Assistant Professor of Developmental Science at Durham University in the United Kingdom. He specialises in infant cognitive and linguistic development. His research has a particular focus on methods, developing pipelines in eye-tracking, pupillometry and fNIRS. Dan Foreman-Mackey is a Research Scientist at the Flatiron Institute in the Center for Computational Astrophysics. His research program focuses on the development and application of probabilistic data analysis techniques to make novel discoveries and solve fundamental problems in astrophysics."
year_published = 2025
clearnet = "https://joss.theoj.org/about"
