full_description = "Calling for Senior Editors, Associate Editors, and Special Editions, 2024-2025 2023-12-17 The Acoustic Ecology Review Editorial Board welcomes new members for 2024-2025. Read More Read more about Calling for Senior Editors, Associate Editors, and Special Editions, 2024-2025 About the Journal Acoustic Ecology Review is an international journal and publication platform for the World Forum for Acoustic Ecology and the international sound studies community. Acoustic Ecology Review (AER) is the evolution of Soundscape, which has been the leading international journal for acoustic ecology since 2001. Acoustic Ecology Review extends and enhances the work of Soundscape to publish accessible and inclusive research in various digital formats, including audio and video. AER is a place for listening, dialogue, and debate. This international peer-reviewed publishing platform is available to all WFAE members and scholars of the global acoustic ecology community. Acoustic Ecology Review publishes editions of Soundscape: The Journal for Acoustic Ecology, conference proceedings of WFAE and those of WFAE Affiliate Member conferences, special editions, and independent articles. The publication is conceived as a forum for communication and discussion about interdisciplinary research and practice in the field of Acoustic Ecology. It focuses on the interrelationships between sound, nature, and society. The journal seeks to balance its content among scholarly writings, research, and an active engagement in current soundscape issues, both in and beyond academia. It serves as a voice for the WFAE’s diverse and global community. Acoustic Ecology Review is published in partnership with the World Forum for Acoustic Ecology and Simon Fraser University. The development of Acoustic Ecology Review on OJS (Open Journal Systems) was supported by the World Soundscape Project Educational Fund. Announcements Calling for Senior Editors, Associate Editors, and Special Editions, 2024-2025 2023-12-17 The Acoustic Ecology Review Editorial Board welcomes new members for 2024-2025. Read More Read more about Calling for Senior Editors, Associate Editors, and Special Editions, 2024-2025 Current Issue Vol. 1 No. 1 (2023): Proceedings of the 'Listening Pasts, Listening Futures' 2023 World Forum for Acoustic Ecology Conference In March 23-26, 2023 The World Forum for Acoustic Ecology (WFAE) hosted its 30th anniversary with an international conference, “Listening Pasts - Listening Futures” at the Atlantic Centre for the Arts (New Smyrna Beach, Florida) located near the Canaveral National Seashore, in the unceded lands of the Seminole people. A global cohort of over one hundred artists, academics, authors, students and community engagement specialists gathered to present research, performances, installations and workshops considering how we may learn collectively from the past and imagine new futures based on a diversity of listening practices and acoustic relationships in our worlds. As the wider field of sound studies has matured, so have contributions made by acoustic ecology towards sonic scholarship and practice, including addressing the legacies of the World Soundscape Project. The convening of this community of international specialists to reflect on and re-imagine core values of the field, central approaches, methods, and key theorists of past, present, and future comes during a pivotal environmental awakening, when acoustic ecology and soundscape studies have much to offer the world. Keynotes at the conference included David George Haskell, scientist and internationally renowned author of 2013 Pulitzer finalist The Forest Unseen and most recently Sounds Wild and Broken; Claude Schryer, French-Canadian producer of conscient podcast; Amanda Gutiérrez, Mexican artist/academic; and Jacek Smolicki, ACA 2023 Artist in Residence. As these proceedings demonstrate, acoustic ecology has matured and moved in critical and prescient directions along with new diversities of voices in the field. Some of the common themes to emerge from this historic edition of the WFAE conference include: An attention to the ethics of field recording: how to proceed in ways that are not extractivist of nature; how to be a guest within soundscape ecologies; how to seek forms of collaboration and consent from non-human inhabitants An infusion of feminist and queer methodology frameworks in thinking about place, sound and listening: what does it mean to listen with positionality; how does our listening practice “construct” places and soundscapes? New evaluative frameworks for dealing with ecologically-threatening noise; how can the study of acoustic ecology and longitudinal data in noise pollution help protect habitats? Pedagogical innovations in teaching with sound and fostering listening practices; toolkits and guidelines for classroom activities, organised actions, youth programs, and links to environmental initiatives. Along with critical perspectives on sound, participants this year dealt with themes of feminist kinship, decolonization, and radical art practices. Both the scholarship, and the calibre of critical art-based interventions speaks highly of the next generation acoustic ecologists. Enjoy reading! Milena Droumeva and Lindsey french Conference Proceedings Co-Editors Published: 2023-11-22 Conference Presentation Thinking Like a Giraffe: Biosemiotics, Ethics, and Soundscape Ecology Jonathan Beever PDF Conference Video Operator Please: Field Recording Practices Through The Lens Of Agential Realism Jesse Budel PDF Conference Video Listening as a Guest through Artistic Inquiries: Winter Walking Rachel Epp Buller PDF Conference Video Sounding Singapore: Sound as Cultural Heritage Marcus Cheng Chye Tan PDF Conference Video A Soundscape of Sea Waves and Collaborative Action Research: The Case of the Nami-kozo Folktale of the Enshu-nada Sea, Japan Shinya Daimon, Kazuya Minoura, Katsushi Kaneko PDF Conference Video Acoustic Ecology in Commissioned Work Jascha Ivan Dormann PDF Conference Video Soundwalking in Games Milena Droumeva PDF Conference Video A hybrid listening across totems and talking wires Juan Carlos Duarte Regino PDF Conference Video When We Hug, I Hear Your Ear Jonny Farrow PDF Conference Video Embodied Listening Practices and Ruderal Ecologies Lindsey french, Alex Young PDF Conference Video Spaces with Ears: Acoustic Ecology Beyond the Body Ivy Fu PDF Conference Video Distant Murmurs: Gothic Soundscapes in Literature Lewis Gittus PDF Conference Video How Aircraft Noise is Heard in Okinawa, Japan Kozo Hiramatsu PDF Conference Video Voicing the Nonhuman: Exploring the Affectual Relationship of Sonification Lauren Knight PDF Conference Video Situated Listening: Partial Perspectives and Critical Listening Positionality Stephanie Loveless, Freya Zinovieff PDF Conference Video (under)scoring the commons; Troubling the acoustics of urban renewal James Hazel Maher PDF Spatiotemporal Recording in the Field Theofanis Maragkos, Andreas Mniestris PDF Conference Video Magazzino Brancaccio: Sound, Participatory Performance and Auditory Resistance in Confiscated Properties in Palermo, Sicily Robin McGinley PDF The Silence of Global Oceans: Measuring the Acoustics Impact of the Covid-19 Lockdown Artash Nath PDF Conference Video A restless triumphant music Heritage and sound in 19th century Western Australia Penny O'Connor PDF Conference Video Communal Listening for Climate Action Garth Paine, Celia Yang PDF Conference Video Why I Wrote Listening to Places Robin Parmar PDF Conference Video Place as Potential: queer futurity in the recorded landscape Hali Santamas PDF Political Acoustic Ecology: On the Role of Political Ecology in Soundscape Studies Arnim Scheidel PDF Conference Video Listening to Insect Agency Reconsidering Relations Through Ecological Sound Art Lisa Ann Schonberg, Érica Marinho do Vale, Tainara Sobroza, Fabricio B. Baccaro PDF Conference Video Prehistoric Sites, Indigenous Voices, and Preserving Identities: Using Sound Mapping to Engage with Indigenous Sites in North America Mark J. Sciuchetti Jr. PDF Conference Video You Never Soundwalk Alone Transversal and Transformative Potentials of Soundwalking Jacek Smolicki PDF Conference Video Emerging directions in acoustic ecology – trends within Canada’s national protected areas system Jeannette Theberge, Benjamin Dorsey PDF Conference Video Circularity-driven urban quietness as an indicator of sustainability Aggelos Tsaligopoulos, Stella-Sofia Kyvelou, Aimilia Karapostoli, Eleftheria E. Klontza, Demetris F. Lekkas, Theodora Tsintzou, Yiannis G. Matsinos PDF Conference Video “Places for Hearing” in the City of Edo in 18th Century Japan: A Case Study of an Insect Listening Party on Dokan-Hill Keiko Torigoe PDF Towards Cultural Echology Noora Vikman, Riitta Rainio PDF Conference Video Listen-Pair-Share: a template for facilitating inclusive group discussion about active listening Nathan Wolek PDF Conference Video Listening to Victory Square Joey Zaurrini PDF Conference Video Conference Installation Sub_Merge Alex Braidwood, Diana Chester PDF The Absent Listener - Composing from Continuous Soundscape Recordings Darren Copeland PDF Conference Video Secret Reception Kristine Diekman, Benedict B. Pagac PDF Fathom Mary Edwards Album A Sound Map of the Cache la Poudre River Henry Koch PDF Forest Listening – An audio-visual installation Liz K. Miller PDF Windmills of Lapua Nikki Sheth PDF Free River: A Literary Soundwalk Ellen Wiles, Nicholas Allan Conference Music The Frequent Listener Eric Leonardson PDF The composition of Impressioni In-Naturali Federico Martusciello View All Issues"
