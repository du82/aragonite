description = "The Simon Fraser University Student Journal of Criminology (SJC) is a student-run and student-edited journal that publishes scholarship that will positively impact the criminology community. The JC provides a space for graduate students, undergraduate students, and faculty who have conducted research in criminology to present their work."
full_description = '''Journals Simon Fraser University Student Journal of Criminology The Simon Fraser University Student Journal of Criminology (SJC) is a student-run and student-edited journal that publishes scholarship that will positively impact the criminology community. The JC provides a space for graduate students, undergraduate students, and faculty who have conducted research in criminology to present their work. View Journal Current Issue Embark Climate Justice Journal The Embark Climate Justice Journal is a multidisciplinary effort to empower and resource SFU students in their sustainability journeys by publishing undergraduate and graduate coursework grounded in climate justice concepts. View Journal Current Issue POLIS: Sociology and Anthropology Undergraduate Journal From the streets of the Ancient Greek City State where Socrates went out to debate people about their ideas, to our modern spaces where we try to keep the tradition alive. POLIS is about inspiring wonder and curiosity that compelled the Greeks to discover the mysteries of reality. View Journal Current Issue Acoustic Ecology Review Acoustic Ecology Review is an international journal and publication platform for the World Forum for Acoustic Ecology and the international sound studies community. Acoustic Ecology Review (AER) is the evolution of Soundscape, which has been the leading international journal for acoustic ecology since 2001. Acoustic Ecology Review extends and enhances the work of Soundscape to publish accessible and inclusive research in various digital formats, including audio and video. AER is a place for listening, dialogue, and debate. This international peer-reviewed publishing platform is available to all WFAE members and scholars of the global acoustic ecology community. Acoustic Ecology Review publishes editions of Soundscape: The Journal for Acoustic Ecology, conference proceedings of WFAE and those of WFAE Affiliate Member conferences, special editions, and independent articles. The publication is conceived as a forum for communication and discussion about interdisciplinary research and practice in the field of Acoustic Ecology. It focuses on the interrelationships between sound, nature, and society. The journal seeks to balance its content among scholarly writings, research, and an active engagement in current soundscape issues, both in and beyond academia. It serves as a voice for the WFAE’s diverse and global community. Acoustic Ecology Review is published in partnership with the World Forum for Acoustic Ecology and Simon Fraser University. The development of Acoustic Ecology Review on OJS (Open Journal Systems) was supported by the World Soundscape Project Educational Fund. View Journal Current Issue The Lyre The Lyre is a student-led literary journal supported by SFU's Department of World Languages and Literatures. We publish a variety of creative work, including poetry, prose, translations, and visual art. View Journal Current Issue Fragmenting the West Coast This countercartographic project examines how contemporary Asian poets in Canada relate their experiences of migration, culture, and the environment on the West Coast. View Journal Current Issue SFU Educational Review View Journal Current Issue Journal of Urban Design and Mental Health The Journal of Urban Design and Mental Health brings together research and ideas from researchers and practitioners working across diverse fields at the nexus of urban design and mental health. It is a peer-reviewed journal published by the Centre for Urban Design and Mental Health. Prior issues are available on the Centre for Urban Design and Mental Health website: https://www.urbandesignmentalhealth.com/journal.html View Journal Current Issue Analytics Now "Time-starved executives are making bolder decisions with less risk and better outcomes. Their secret: Operations Reserach." - www.scienceofbetter.org View Journal Current Issue The Alcuin Society Awards for Excellence in Book Design in Canada The Alcuin Society Awards for Excellence in Book Design in Canada is the only national competition for book design. This journal is the result of a 2021 Scholarly Digitization Fund Grant from SFU Library to digitize and complete metadata work for back-issues of the catalogue from 1981 to 2018. View Journal Current Issue Philosophy Nouveau Previously Jove's Bodega, Philosophy Nouveau isn't your standard academic journal. Our focus is to provide philosophy (and non-philosophy) students a fun, approachable way to engage with different types of philosophy, and showcase philosophy in non-traditional ways. We feature art, photography, poems, short stories, and of course academic papers. View Journal Current Issue Indigenous Graduate Student Symposium Journal The Indigenous Graduate Student Symposium (IGSS) is hosted annually by Supporting Aboriginal Graduate Enhancement (SAGE), a peer-mentoring, inter-institutional initiative provided to graduate students across British Columbia. SAGE is hosted at the University of British Columbia in collaboration with Simon Fraser University and has “pods” at the University of Victoria, UBC Okanagan, University of Northern British Columbia, and University of Toronto. The IGSS offers a supportive environment for Indigenous graduate and postdoctoral students to present and receive feedback on their research. View Journal Current Issue SFU Undergraduate Research Symposium Journal The SFU Undergraduate Research Symposium (UGRS) provides an opportunity for eligible undergraduate students from all disciplines to present their research in a friendly and supportive environment. The Symposium showcases the high quality original undergraduate research taking place across Simon Fraser University. The Symposium is a multidisciplinary forum, meaning that student presenters are able to share their research with a diverse and interdisciplinary audience. View Journal Current Issue SLC Undergraduate Writing Contest The SLC Writing Contest journal will be published annually as a collection of the winners and honourable mentions of the SLC undergraduate writing contest. The Writing Contest journal is intended to serve as a database of model papers for current undergraduate students and to represent writing across the disciplines. View Journal Current Issue Intersectional Apocalypse Intersectional Apocalypse is a student-run, peer-edited, open access journal focused on collecting and sharing knowledge that is intersectionally feminist, LGBTQ2IA+ positive, anti-colonial, anti-racist, and anti-oppressive. View Journal Current Issue Confluence The SFU International Studies Student Association is proud to have officially re-launched Confluence. We are now officially CLOSED FOR SUBMISSIONS. Learn about our theme "Disruption" here. Confluence Vol. 2 "The Death of Democracy" can still be viewed here. View Journal Current Issue Gadfly Gadfly is the SFU Undergraduate journal for Political Science. View Journal Current Issue The Journal of Intelligence, Conflict, and Warfare The JICW is a practitioner-focused research resource and a researcher-focused opportunity to impact policy and real-world security and defence decision-making. The JICW is a canvas for both researchers and practitioners to explore new and emerging security problems. The journal aims to shine a light on new and emerging trends in conflict, security, and intelligence and brings to the fore issues that are under-researched. View Journal Current Issue SFU Undergraduate Journal of Psychology The SFUψUJP is a new annual publication that allows students to share their original research, meta-analyses, and critical essays with our broader academic community. View Journal Current Issue SFU Health Sciences Undergraduate Journal SFU Health Sciences Undergraduate Journal is a peer-reviewed digital journal for SFU health sciences undergraduate students and recently graduated students to share and publish coursework and original research related to the health sciences. This publication aims to provide students experience with the peer-review process and create an accessible, low-barrier platform for students to share their work. Topics included in this journal are wide-ranging, and include, but are not limited to health policy, health equity, public health, and health promotion. View Journal Current Issue Techne Techne is a peer-reviewed academic humanities journal. This journal will be an opportunity for Vancouver Technical Secondary students to publish writing, poetry, art, and more. Techne is also in collaboration with SFU and UBC underagrads who were kind enough to help with mentoring our younger editors and also editing work as well. View Journal Current Issue De Voix Vives Créé en 2015, De Voix Vives est le journal d'écriture créative -prose, poésie et oeuvres graphiques- des étudiant.e.s du département de français de SFU. View Journal Current Issue Eco-Thinking This journal site is an archive and new submissions are not accepted to Eco-Thinking at this time. Please visit the International Journal of Informal Science and Environmental Learning for new submissions and recent issues. View Journal Current Issue BCLA Browser: Linking the Library Landscape The BCLA Browser was an online, open access quarterly publication that communicated and discussed BCLA activities and news, library-related issues, and topics of interest to BCLA members published from 2009 to 2014. The last issue was Volume 6, no. 4 (2014). Please see BCLA Perspectives to see the latest newsletter from The British Columbia Library Association. View Journal Current Issue Integrated Assessment Journal The Integrated Assessment Journal is an interdisciplinary publication of The Integrated Assessment Society (TIAS) aimed at addressing complex public policy challenges. The Integrated Assessment Journal is not accepting submissions at this time. View Journal Current Issue The Poetic Front The Poetic Front is a journal of criticism, essay, and poetics based out of the Simon Fraser University Department of English. The journal published from 2008 to 2011. The Poetic Front is not accepting submissions at this time. View Journal Current Issue Amphora Digitized issues of the Alcuin Society journal Amphora. View Journal Current Issue Line Line (formerly West Coast Line) is a journal of poetry and critique based in Vancouver. Line was founded by Roy Miki in 1983 and last published in 2013. View Journal Current Issue thirdspace: a journal of feminist theory and culture thirdspace is a peer-reviewed journal, offering work in English and French, that aims to presents the best in scholarship on feminist theory and culture. We envision a broad definition of studies in "feminist theory and culture" which can include, but are not limited to, development and applications of feminist theory; cultures of feminism and feminist movement (including academia); and feminist cultural studies. thirdspace is not accepting submissions at this time. View Journal Current Issue AntiChamber Journal AntiChamber is a student-run and peer-reviewed journal that seeks to provide a platform for students and authors to freely express alternative views and voices. We strongly believe in the importance of ensuring a space for ideas and perspectives that diverge from conventional conversations and culture. Such ideas are necessarily intrinsic to both the flourishing of creative paradigms as well as the bolstering of well-accepted truths. Therefore, we commit our efforts and this space to encourage students and authors to embrace and cultivate their unique perspectives through clear articulation and intellectual rigour. View Journal Current Issue Anglo-Saxon Manuscripts in Microfiche Facsimile View All Issues View Full List of Published Manuscripts View Manuscripts included in the Project Settings About the Journal Anglo-Saxon Manuscripts in Microfiche Facsimile is an ongoing international and collaborative scholarly project that published facsimiles of manuscripts containing Old English, ranging in date from as early as the seventh century and as late as the fourteenth century, many of which have never been fully or adequately catalogued or described. For each manuscript in the project, entirely new histories, codicological descriptions, inventories of contents, and bibliographies have been commissioned, and have written by scholars from all over the world (the United States, Canada, England, New Zealand, and elsewhere) who have examined the manuscripts first-hand. ASMMF has always been about access—sometimes rough and ready—so we hope that this resource is useful, making for a scholarly tool that serves research in the fields of language, history, literature, art history, theology, history of the book, and more. View Journal Current Issue International Journal of Informal Science and Environmental Learning View Journal Current Issue'''
