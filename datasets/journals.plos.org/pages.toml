full_description = "01/07/2025 Research Article Post-concussion symptom burden and dynamics: Insights from a digital health intervention and machine learning This study aims to understand the nature and recovery trajectories of post-concussion symptomatology by applying an unsupervised machine learning approach to data captured from a digital health intervention (HeadOn). As part of the 35-day program, patients complete a daily symptom diary which rates 8 post-concussion symptoms. Image credit: Jamjoon et al 01/09/2025 Research Article A data management system for precision medicine Traditional Medical Data Management Systems (MedDMSs) are not designed for implementation of precision medicine. The authors defined, built and applied a MedDMS for precision medicine considering key factors such as GDPR compliance. Image credit: Jacobs et al 12/23/2024 Research Article A cluster randomized trial assessing the effect of a digital health algorithm on quality of care in Tanzania (DYNAMIC study) This study evaluated the use of ePOCT+, a digital health clinical decision support algorithm for health providers, combined with point-of-care diagnostic tools, training, and mentorship. The study compared 9 primary care health facilities using ePOCT+ with 9 facilities providing care as usual. Image credit: Rowan Smith 12/19/2024 Research Article A voice-based algorithm can predict type 2 diabetes status in USA adults: Findings from the Colive Voice study This study investigates the potential of using a voice-based algorithm to predict Type-2 Diabetes status in adults, as the first step towards developing a non-invasive and scalable screening method. Image credit: Fagherazzi et al 12/18/2024 Research Article EXAM: Ex-vivo allograft monitoring dashboard for the analysis of hypothermic machine perfusion data in deceased-donor kidney transplantation Hypothermic machine perfusion (HMP) effectively reduces the risk of delayed graft function in kidney transplant recipients. This study developed a free software, EXAM, to analyze HMP data for state-of-the-art visualization and quality control. Image credit: Robina Weermeijer"
