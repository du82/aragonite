 You can unsubscribe at any time by clicking the unsubscribe link in our emails or by contacting us at privacy@plos.org.NameThis field is for validation purposes and should be left unchanged."""
full_description = "We believe in a better future where science is open to all, for all PLOS is a non-profit organization on a mission to drive open science forward with measurable, meaningful change in research publishing, policy and practice. A catalyst for better Built on a strong legacy of pioneering innovation, we see the world through a lens of possibility, but we are not interested in change for the sake of change. We believe in better. We exist to serve the research enterprise which means our priorities are based on the needs of scholars, librarians, funders, and institutional leaders, not shareholders. Our vision and mission is at the center of our new brand identity. Find out more Open science PLOS is a mission-driven open science publisher covering all scientific disciplines with a focus on fundamental and applied research across life, health, sustainability, engineering, and technology. When you choose a PLOS journal you are putting integrity first and supporting an organization committed to research that is robust, reliable, and accessible to all. We offer processes to ensure the science is rigorous, practices to make sure research is shared and reused, policies that are equitable, and innovations in scholarly communications. Open science publishing Pave the way When it comes to scientific rigor and editorial integrity, we will not compromise. The research outputs we publish promote multi-disciplinary discussions on complex problems and enable all stakeholders to learn from, reuse, and build upon scientific knowledge. We reimagine models and mechanisms for sharing to meet open science principles and use our journals to test and refine innovations at all stages of the research lifecycle. Open science policy Advocate for change We actively engage in policy discussions with multi-stakeholder groups to drive open science adoption. Publishing expertise, pioneering innovations, and original research mean we are uniquely placed to contribute to discussions on the barriers to adoption and the opportunities for integration of open science principles in scholarly communication Open science practice Share and inspire We work with diverse communities to promote adoption of open science practices across discipline, geography, and career stage. To create new pathways to open science, we actively engage with stakeholders throughout the scholarly community with knowledge sharing, co-creation, and partnership Read more > About us> Our journals> Institutional sales> Career opportunities> Media engagement"
