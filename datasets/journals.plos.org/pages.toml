full_description = "11/14/2024 Opinion Indigenous knowledge and leadership for climate change adaptation in nutrition In this Opinion, authors discuss Indigenous food systems and knowledges play a crucial role and offer unique opportunities in adaptation to climate change while safeguarding nutrition, restoring the land, and protecting health. Image credit: Figure 1 by Zavaleta-Cortijo et al., CC BY 4.0 11/08/2024 Essay Evolution of WHO COVID-19 mask guidelines amid intense demands for rapid advice In this Essay, Nathan Ford et al take the example of mask use in the health care and community settings to describe the progressive application of the minimum standards required for developing trustworthy guidelines during a public health emergency. Image credit: Face Mask by Markus Winkler, Pixabay 12/05/2024 Essay Technology transfer, intellectual property, and the fight for the soul of WHO In this historical Essay, Melissa Barber describes the lost vision of global solidarity embodied in WHO’s midcentury technology transfer program offers a glimpse into an alternate path we might still chart, one where access to medicines is not bound by the logic of enforcing scarcity to maximize profit, and the right to health is a global responsibility. Image credit: Figure 2 by Barber et al., CC BY 4.0 11/15/2024 Opinion It shouldn’t take a murder: A call to action against sexual violence in healthcare In this Opinion, Shivangi Shankar, Abhijit Dhillon, and Abhiti Gupta argue that lawmakers, policymakers, directors, managers, and colleagues at all levels need to play a role in ensuring the prevention of SEAH in healthcare and maintaining a safe work environment for all. Image credit: Pattern by Ponciano, Pixabay 11/14/2024 Opinion A consensus statement on dual purpose pathogen surveillance systems: The always on approach In this Opinion, Helene-Mari van der Westhuizen et al propose Always On - an approach that incorporates pathogen surveillance for pandemic threats with infrastructure that supports routine clinical care and public health. Image credit: Syringe World by Arek Socha, Pixabay"
