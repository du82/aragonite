title = "PLOS Biology"
full_description = "02/21/2025 Research Article Caspases and cytoprotective autophagy under stress Caspase enzymes are traditionally known for their roles in late stages of apoptosis, but growing evidence supports their function in non-apoptotic cellular processes. Gayathri Samarasekera, Sharon Gorski and colleagues show that caspase-3 and caspase-7 promote cytoprotective autophagy in response to non-lethal stress by modulating PARP1 activity in breast cancer cells. Image credit: pbio.3003034 02/21/2025 Research Article Human-mouse differences in necroptosis regulation ZBP1 is known to initiate RIPK3-mediated necroptosis in murine models of viral infection, but how this pathway is regulated in human cells is unclear. Oluwamuyiwa Amusan, Shuqi Wang, Hongyan Guo and co-workers show that, unlike in the mouse, RIPK1 is required for HSV-induced ZBP1-dependent necroptosis in human cells; the RHIM motif in RIPK3 dictates this species-specific difference. Image credit: pbio.3002845 02/19/2025 Primer Gags and synapse formation Neurodevelopment requires dynamic control of synapse number. Yung-Heng Chang and Josh Dubnau explore a new study which reveals that the gag protein of Copia, an active retrotransposon, forms virus-like capsids that transfer its own RNA across the Drosophila neuromuscular junction to regulate synapse formation. Image credit: pbio.3003032 02/18/2025 Research Article Gap junctions in germ cell growth Gap junctions allow transfer of small molecules between cells, but it is unclear if cells can use this process to promote cell growth. Caroline Vachias, Vincent Mirouse and co-authors show that gap junctions allow the exchange of metabolites between germ cells and somatic cells to promote germline growth during Drosophila oogenesis. Image credit: pbio.3003045 02/18/2025 Research Article Retrotransposon capsids and synaptic plasticity Transposons are parasitic genome elements that serve as raw material for the evolution of new cellular functions. Githure M’Angale, Adrienne Lemieux, Yumeng Liu, Brian Kelch, Travis Thomson and colleagues reveal that the capsid of the virus-derived retrotransposon Copia mediates synaptic plasticity at the Drosophila neuromuscular junction. Don't miss the related Primer. Image credit: Travis Thomson & Brian Kelch"
