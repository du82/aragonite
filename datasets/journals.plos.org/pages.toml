title = "PLOS Complex Systems"
full_description = "02/03/2025 Research Article Human languages trade off complexity against efficiency The authors trained different language models, from simple statistical models to advanced neural networks, on a database of 41 multilingual text collections comprising a wide variety of text types, which together include nearly 3 billion words across more than 6,500 documents in over 2,000 languages. The trained models were then used to estimate entropy rates, a complexity measure derived from information theory. Image credit: Annie Spratt 02/03/2025 Research Article Patterns of co-occurrent skills in UK job adverts This study used a large data set of 65 million job adverts between 2016 and 2022 across the whole of the UK to examine the patterns of skills required together by employers. The authors found clusters of skills that appear together in adverts often, but these clusters do not always agree with how experts group skills based on competencies or qualifications. Image credit: Liu et al 01/03/2025 Research Article Difficult control is related to instability in biologically inspired Boolean networks Previous work in Boolean dynamical networks has suggested that the number of components that must be controlled to select an existing attractor is typically set by the number of attractors admitted by the dynamics, with no dependence on the size of the network. This study investigates the rare cases of networks that defy this expectation, with attractors that require controlling most nodes. Image credit: Daniels & Borriello 01/03/2025 Research Article Urban scaling with censored data Over the past two decades, urban scaling has become essential for understanding the rural-urban continuum by quantifying how urban characteristics depend on a city’s population size. Nonetheless, access to incomplete datasets about urban features systematically skews the conclusions derived from this theory. To address this limitation, the authors developed a framework that enables urban researchers to draw reliable conclusions about urban scaling, even when dealing with censored datasets. Image credit: John O'Nolan"
