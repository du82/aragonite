full_description = "01/29/2025 Research Article The role of oscillations in grid cells’ toroidal topology The authors present a quantitative approach to evaluating the role of various aspects of data in the emergence of low dimensional, topological, features. Topological features are those that are insensitive to certain deformations of an object, e.g. stretching, but not cutting. 01/23/2025 Education The tumour histopathology “glossary” for AI developers However, effective translation of AI and deep learning methods requires computational researchers to have at least a basic understanding of histopathology. This work aims to bridge that gap by introducing essential histopathology concepts to support AI developers in their research. Image credit: Mandal et al 01/24/2025 Research Article Social mates dynamically coordinate aggressive behavior to produce strategic territorial defense This study explores how behavioral patterns vary across contexts and alliances. The authors investigate the possibility that resident female and male downy woodpeckers guard their breeding territories from conspecific intruders by deploying defensive behavior in context-specific patterns. Image credit: Hans Veth 01/23/2025 Research Article Data-driven discovery and parameter estimation of mathematical models in biological pattern formation This study proposes a data-driven approach to validate the applicability of mathematical models. The authors developed methods to automatically select the appropriate mathematical models based on the patterns of interest and to estimate the model parameters. 01/10/2025 Education Ten simple rules for good model-sharing practices This paper suggests 10 simple rules for you to both (i) ensure you share models in a way that is at least “good enough,” and (ii) enable others to lead the change towards better model-sharing practices. Image credit: Fabio (Unsplash) 01/07/2025 Research Article Benchmarking uncertainty quantification for protein engineering In many cases, the goal of conducting new experiments in protein design is optimizing for a property or improving the machine learning model. Many standard methods for these two tasks require good estimates of the uncertainty in the model’s predictions. Image credit: NCI"
