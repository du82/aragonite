["https://jowua.com/article/jowua-v12n1-1/70464"]
title = "Guest Editorial: Special Issue on the ARES-Workshops 2020 - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "The ARES Workshops cover a wide variety of different topics in IT-Security, ranging from very technical approaches in digital forensics and malware detection to security management and threat intelligence. Thus, the Workshops serve as an integral part of ARES, not only due to the presentation of new results, but also with respect to the discussions initiated by presenting very recent result. Still, since the space reserved for workshop papers is limited, we decided to invite the best contributions to long-standing ARES workshops to submit extended versions. These journal versions as presented in this issue comprise fundamental extensions to the original works, as well as completely novel contributions based on the results of the original workshop papers and thus provide their own scientific merits rather than just being more elaborate versions of old results. While IT-Security has become a wide field of expertise in the last decades, sporting many different sub-fields and requiring many different methods and tools, it is apparent that tools from the world of artificial intelligence gained a lot of attention throughout recent years, which is also reflected in the contributions in this special issue."
