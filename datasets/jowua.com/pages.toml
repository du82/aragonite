["https://jowua.com/article/2024.I4.003/71591"]
title = "Design of Intelligent Protection and Promotion System for Non-Heritage Music Inheritance based on Internet of Things - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "Design of Intelligent Protection and Promotion System for Non-Heritage Music Inheritance based on Internet of Things Eco-friendly methods for the avoidance and control of crop illnesses and insects are essential to minimize synthetic pesticide usage, enhance agriculture quality, safeguard the ecosystem, and foster equitable agricultural growth. Utilizing Internet of Things (IoT) gadgets, the research created a framework for preventing and managing the spread of farming diseases and insects, comprising two primary parts: a plant security device (equipment) and a system for handling information (programs). The research integrated two varieties of protective plant gadgets to accommodate facility- and field-based manufacturing settings, employing ozone sterilizing and light-trap technology. The gadgets were outfitted with many sensors to gather immediate information and track the agricultural growing environment. The database of information features an IoT-based design and incorporates a mobile application to provide remote operation of plant security devices for the competent administration of plant security information. The framework facilitates efficient administration of extensive equipment deployments and multi-device collaboration for illness, pest control, and prevention. The implemented technique has functioned effectively for many years in China and has been utilized for cucumbers, tomatoes, grains, and other commodities. The research illustrates the efficacy and feasibility of the technique in the setting of a greenhouse and the field."
