["https://jowua.com/article/2024.I4.010/71665"]
title = "A Deep Learning-based Psychometric Natural Language Processing for Credit Evaluation of Personal Characteristics - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "A Deep Learning-based Psychometric Natural Language Processing for Credit Evaluation of Personal Characteristics Psychometric assessments that gauge individuals' skills, competencies, mindsets, and personality characteristics are essential for several practical applications, including online shopping, healthcare, and cybercrime. Conventional approaches cannot collect and measure extensive psychometric characteristics promptly and discreetly. As a result, despite their significance, psychometric factors have garnered less focus from the Natural Language Processing (NLP) and data sectors. This paper presents Deep Learning (DL), the Proposed model, designed to extract psychometric variables from user-generated texts. The proposed model incorporates an innovative representation insertion, a regional insertion, a Structural Equation Modelling (SEM) encoder, and a multitasking method, all functioning collaboratively to tackle the distinct issues of obtaining complex, nuanced, and user-focused psychometric measurements. The trials on three real-world datasets involving 11 psychometric characteristics, such as confidence, nervousness, and literacy, demonstrate that Proposed model significantly surpasses conventional feature-based classifications and leading DL frameworks. Ablation research indicates that every component of the Proposed model substantially enhances its general efficacy. The findings illustrate the effectiveness of the suggested design in enabling comprehensive psychometric examination."
year_published = 2024
