["https://jowua.com/article/jowua-v12n1-7/70476"]
title = "Conflict Identification and Resolution for Trust-Related Requirements Elicitation A Goal Modeling Approach - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "Conflict Identification and Resolution for Trust-Related Requirements Elicitation A Goal Modeling Approach In requirements engineering, goal modeling is a popular approach for requirements elicitation and improvement. It can not only support in specifying software goals and requirements but also in identifying and resolving conflicts between and among them. In this work, we extend the method for eliciting trust-related software features, called TrustSoFt, by the i* goal modeling framework. We extend the i* notation adapted to TrustSoFt and further provide a guideline for goal model creation, conflict identification, and conflict resolution in order to ensure that user concerns are addressed in the best possible way by the software to be developed. Examples are provided for an online dating application regarding the user concerns “fake profiles” and “data misuse”. As a result, goal modeling impels requirements engineers to properly annotate trustworthiness goals and requirements. It facilitates the identification of relevant elements for the issue being modeled and results in fine-graded trustworthiness requirements. We consider goal models as useful input for the development of trustrelated software features."
year_published = 2021
