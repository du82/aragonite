["https://jowua.com/cfp"]
title = "CFP - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
description = "Special Issue on Interdisciplinary Cybersecurity ## Guest Editors Martin Gilje Jaatun, University of Stavanger and SINTEF Digital, Norway, Email: martin.g.jaatun@uis.no […]"
full_description = "Special Issue on Interdisciplinary Cybersecurity## Guest EditorsMartin Gilje Jaatun, University of Stavanger and SINTEF Digital, Norway, Email: martin.g.jaatun@uis.noBela Genge, University of Medicine, Pharmacy, Sciences and Technology of Targu Mures, Romania, Email: bela.genge@umfst.roSimon Vrhovec, University of Maribor, Slovenia, Email: simon.vrhovec@um.si## Important DatesRegular Paper Submission Deadline: 15 April 2022Notification: 15 July 2022Revised Version (incl. Rebuttal): 15 October 2022Final Notification: 15 January 2023Camera-ready Version: 31 January 2023## Aims and ScopeCyberspace has become a complex continuum spanning a variety of network technologies and domains, such as cloud, fog and edge infrastructures, and wired, wireless and mobile networks. It enables a ubiquitous interconnection of heterogeneous devices, such as traditional hosts; smart, internet of things (IoT), wearable, and mobile devices; as well as individuals and organizations. This results in pervasive collection and use of sensitive data.Such a heterogeneous and sophisticated mix of technologies, devices and people inevitably poses significant challenges both for the security of connected devices and systems, and the privacy of individuals and organizations that they interact with, as new reconnaissance techniques and attacks are released on a daily basis. The situation for systems which include smart devices is further aggravated by a multitude of actors, such as manufacturers, service providers, app developers, telcos, and proprietary Software-as-a-Service (SaaS) deployments, in addition to the global nature of the cyberspace spanning over varying and potentially incompatible legislation.Ensuring cybersecurity of modern systems therefore requires a strong technological foundation complemented by efforts stemming from other areas, such as behavioral sciences, sociology, criminology, investigations, and law.This Special Issue aims at collecting previously unpublished, original, state‐of‐the‐art research dealing with solutions, problems, defense mechanisms, forensics issues, threat analysis, frameworks, and development of countermeasures for ensuring security and privacy of devices and people in the cyberspace.Topics for this Special Issue include (but are not limited to):Cybersecurity and cyber resilienceCyber insuranceDigital privacyDigital currency, blockchains and cybercrimeLaw, investigation, internet jurisdiction and ethicsChild safety in the cyberspaceCyber forensicsSurveillance, interception, blocking and sovereigntyCyber warfareNetwork securityCritical infrastructure securityEmbedded systems securityBusiness continuity and disaster recoveryInformation security governanceSecurity managementCloud securityInternet of things securityBig data and cybersecurityHealthcare information securitySoftware development security## SubmissionTo submit a paper, please log onto the JoWUA online submission system at http://www.easychair.org/conferences/?conf=jowua11.Then, please select “SI: Interdisciplinary Cybersecurity“."
