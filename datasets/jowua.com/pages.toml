["https://jowua.com/article/jowua-v1n1-2/69929"]
title = "Reducing the Risk of Insider Misuse by Revising Identity Management and User Account Data - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "To avoid insider computer misuse, identity and authorization data referring to the legitimate users of the systems must be properly organized and constantly and systematically analyzed and evaluated. In order to support this, a methodology for structured Identity Management has been developed. This methodology includes gathering of identity data spread among different applications, systematic cleansing of user account data in order to detect semantic as well as syntactic errors, grouping of privileges and access rights, and semiautomatic engineering of user roles. Each of the steps involved includes quality criteria and comprehensive tool support. The focus of this paper is on the data cleansing phase leading to feedback where insider misuse may occur due to existing privileges which go beyond the scope of the users’ current need-to-know."
