["https://jowua.com/article/jowua-v1n1-5/69935"]
title = "Specifying and Enforcing a Fine-Grained Information Flow Policy: Model and Experiments - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "In this paper we present a model for defining and enforcing a fine-grained information flow policy. We describe how the policy can be enforced on a typical computer and present experiments using the proposed model. A key feature of the model is that it allows the expression of rules which detail precisely which information elements are allowed to mix together. For example, the model allows the expression of a policy which forbids a doctor from mixing the personal medical details of the patients. The enforcement mechanisms tracks and records information flows within the system so that dynamic changes to the policy can be made with respect to information elements which may have propagated to different locations in the system."
