["https://jowua.com/article/jowua-v12n1-6/70474"]
title = "Blockchain Mirage or Silver Bullet? A Requirements-driven Comparative Analysis of Business and Developers’ Perceptions in the Accountancy Domain - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "Blockchain Mirage or Silver Bullet? A Requirements-driven Comparative Analysis of Business and Developers’ Perceptions in the Accountancy Domain Over the last decade, blockchain has gained popularity and researchers, as well as companies, are investigating new fields that could be impacted by blockchain technology. Among them, accounting has been identified as a promising field, as blockchain is said to bring trust and transparency to data, as well as tamper-resistance. However, there might be some issues in the adoption of such a new technology, for instance for misunderstanding the goals of using blockchain based accounting systems. Hence, the goal of this exploratory paper is to investigate, based on the question of whether blockchain will impact accounting, the differences in the developers and accountants mental models, and to identify goals and high level requirements for blockchain-based accounting software. For this, we used semi-structured interviews, concept analysis and goal based requirement engineering, on the concepts related to transparency and trust, on blockchain potential and challenges. Even though further research is needed, our results highlight that accounting is a socio-technical field, and that blockchain will shift the conception of trust and transparency, but not completely revolutionize the field, rather make it evolve."
