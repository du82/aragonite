["https://jowua.com/article/jowua-v13n1-0/70513"]
title = "Guest Editorial: Special Issue on the ARES-Workshops 2021 - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
full_description = "In recent years, the ARES Workshops have emerged as important sources for ongoing research, covering a wide variety of different topics in IT-Security, ranging from very technical approaches in digital forensics and malware detection to security management and threat intelligence. The Workshops have thus emerged to be an integral part of the ARES conference and provide a wide selection of novel results. Furthermore, the presentations given in these events drive discussions and new ideas, as well as new cooperations between partners, either inside a given field, but also across different areas if It Security. As the space reserved for workshop papers is limited and several contributions warranted a more in-depth discussion, we decided to invite the best contributions to long-standing ARES workshops to submit extended versions. These journal versions as presented in this issue comprise fundamental extensions to the original works, as well as completely novel contributions based on the results of the original workshop papers. The reviewers, whom we want to thank very much, challenged these extensions for their scientific merits, thus guaranteeing the presence of valuable new results beyond pure extension on the presentation side."
