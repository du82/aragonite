["https://jowua.com/submission-preparation-checklist"]
title = "Submission Checklist - Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications"
description = "Online Submissions All submissions to JoWUA must be made using the online submission system. The submissions will be assigned to […]"
full_description = ".old_text_widget img {max-width: 100%;height: auto;}.old_text_wdiget {margin: 0;padding: 0;overflow: hidden;color: ;font: ;background-color: ;} Online Submissions All submissions to JoWUA must be made using the online submission system. The submissions will be assigned to at least two independent referees who have professional backgrounds in the related subject area. Author Guidelines1. ScopeTopics of interest include, but are not limited to:Wireless mobile network architecture and protocolsMobile computing systems and servicesMobile Internet and mobility managementWireless sensors networks and RFID technologiesMobile ad hoc networkingWireless mesh networksWireless LANs, WiMax, cellular networksCross layer design and optimizationVehicle networksEnergy efficient networksFuture InternetTheoretical foundations and algorithms for ubiquitous computingAlgorithmic paradigms, models and analysis of ubiquitous computingIntelligent context-aware schemeSmart spaces and intelligent environmentsEmbedded systems and wearable computersMiddleware and agent technologies for ubiquitous computingAutonomic computing and communications for ubiquitous computingProgramming paradigms for ubiquitous computing applicationsUser interfaces and interaction modelsSoftware infrastructuresParallel/distributed/grid computingNovel machine architecturesSemantic web and knowledge gridSecurity issues and protocols in wireless mobile network and ubiquitous computingSecurity threats and model in wireless mobile network and ubiquitous computingKey Management, Authentication and Access control in wireless mobile network and ubiquitous computingPrivacy and trust in wireless mobile network and ubiquitous computingInsider threats and information leakage preventionDependable applicationsBusiness model and protocols for wireless mobile network and ubiquitous computingEmerging standards and technologies in wireless mobile network and ubiquitous computing2. SubmissionAll submissions to JoWUA must be made using the our online submission system integrated with this official web-site ofJoWUA. The submissions will be assigned to at least two independent referees who have professional backgrounds in the related subject area. To submit a paper, please log onto online submission system. If you don’t have one already, you will need to create your account.3. Manuscript FormatAll submissions must include the following elements: title, abstract, key words, illustrations, and bibliography. References should appear in a separate bibliography at the end of the paper, with items referred to by numerals in square brackets. Figures should be placed exactly where they are to appear within the text. Submitted papers must use one-column formatting with single-spaced text in a 11-point font. A manuscript style file is available and acceptable only for Latex:JoWUA uses the easychair Latex class. The submitted regular paper is suggested to from 10 to 20 pages, and the short paper is from 3 to 6 pages. All papers should be written in English. An abstract is essential for each paper with 100 to 200 words for a regular paper and 50 words for a short paper.3.1. Manuscript Format: Title and AbstractSelect a title that accurately and clearly tells what the paper is about. Choose title terms as highly specific as content and emphasis of the paper permit. The typical length is might 6 to 12 words. Avoid special symbols and formulas in titles unless essential to indicate content. An abstract is essential for each paper with 100 to 200 words for a regular paper and 50 words for a short paper. The abstract should state the objectives of the work, summarize the results, and give the principal conclusions. Abstracts must not include mathematical expressions or bibliographic references. Non-standard or uncommon abbreviations should be avoided, but if essential they must be defined at their first mention in the abstract itself.3.2. Manuscript Format: Figure and TableFigures include graphs of results, schematic drawings, samples of output screen dumps, and photographs of special equipment or displays. Each figure should be numbered and have a caption. Care should be taken to ensure that the legends and labels within the figure are large enough to be readable after they are reduced. For final submissions, high quality (at least 600 dpi) figures should be included. Number tables consecutively in accordance with their appearance in the text. Place footnotes to tables below the table body and indicate them with superscript lowercase letters.3.3. Manuscript Format: ReferencePlease ensure that every reference cited in the text is also present in the reference list (and vice versa). Unpublished results and personal communications are not recommended in the reference list, but may be mentioned in the text. The followings are examples for references:Reference to a Journal: I. You, J.-H. Lee, K. Sakurai and Y. Hori, “ESS-FH: Enhanced Security Scheme,” Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications, vol. 1, no. 1, pp.23-45, May 2010.Reference to Published in Conference Proceedings: I. You and E. Kim, “A Exploratory Study on R&D Strategies in Industrial Technology Security,” in Proc. of the 1st International Workshop on Managing Insider Threats (MIST’09), Seoul, Korea, LNCS, vol. 469, Springer-Verlag, June 2009, pp. 51-61.Reference to a thesis: J.-H. Lee, “Enabling Network-based Mobility Management in Next-Generation All-IP Networks: Analysis from the perspective of Security and Performance”, Ph.D. Thesis, Sungkyunkwan University, January 2010.Reference to a book: H. Smith, Mobile IPv6, 3rd ed., JoWUA press, June 2010.Reference to a chapter in an edited book: I. You and E. Kim, “Advances in Wireless Security,” in: K. Cho. and H. Ahn (Eds.), Next Generation Mobile Internet, JoWUA press, Seoul, pp. 281-304, June 2010.Reference to a web page: Mobility EXTensions for IPv6, May 2013, http://datatracker.ietf.org/wg/mext/charter/ [Online; accessed on May 20, 2021].4. Peer Review ProcessJoWUA adopts the single-blind peer review process as follows:The submitted manuscripts are evaluated by anonymous referees for originality, relevance, and presentation. Revisions requested by the editor should be submitted through which will be forwarded directly to that editor. After the refereeing process is complete, a handing editor makes a decision for acceptance or rejection. There are two types of revisions: major or minor. For a major revision, original referees will be invited to review the manuscript again, and make a recommendation. For a minor revision, no more reviews are required, the handing editor makes the final decision of acceptance if both the content and format are acceptable.5. Once AcceptedIf the reviewed manuscript is acceptable, we will send you a detailed guide and an author checklist for final manuscript submission requirements. And each author will be asked to sign and submit the COPYRIGHT AND CONSENT FORM, which formally accepts their copyright transfer to the journal publisher, Innovative Information Science & Technology Research Group.That is, each author needs to agree with the copyright requirements in the form, which is available at here.As an open access title, publishing an article in this journal requires an Open Access Charge that will be billed to the submitting author following acceptance. Apart from this Open Access Charge there are no other fees (for example submission charges, page charges, or color charges). The Open Access Charge for the journal is $1200. . Note that this charge can be waived or discounted depending on a situation. The manuscript will not be published without both the signed copyright form and the payment of the publication charge. 6. For the authors of conference (or workshop) papersIf an author wants to submit JoWUA the extended version of her or his conference paper, she or he should consider the followings:The author should cite the conference paper while clearly describing it is extended for the journal version. The conference paper should be considerably extended by at least 30%.The extended paper should not include the figures, tables, and paragraphs used in its conference version.7. Contact InformationFor further details and/or if you have any questions/suggestions, please do not hesitate to contact the editorial board or directly Editor-in-Chief of JoWUA. 8. Submission Preparation ChecklistAs part of the submission process, authors are required to check off their submission’s compliance with all of the following items, and submissions may be returned to authors that do not adhere to these guidelines.The submission has not been previously published, nor is it before another journal for consideration.The base font is Times New Roman-like, and the sans-serif font is Helvetica. The text is single-spaced; uses a 11-point font; employs italics, rather than underlining (except with URL addresses); and all illustrations, figures, and tables are placed within the text at the appropriate points, rather than at the end.The text adheres to the stylistic and bibliographic requirements outlined in this author guideline. Click Here to download Paper Template 9. Privacy StatementThe names and email addresses entered in the submission system of JoWUA will be used exclusively for the stated purposes of JoWUA and will not be made available for any other purpose or to any other party. Journal of Wireless Mobile Networks, Ubiquitous Computing, and Dependable Applications (JoWUA)ISSN (print): 2093-5374, ISSN (on-line): 2093-5382"
