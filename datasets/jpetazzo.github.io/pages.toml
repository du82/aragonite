["https://jpetazzo.github.io/2017/12/24/productivity-depression-kanban-emoji"]
title = "Recovering the productivity stolen by depression with kanban and emoji"
full_description = "I want to share a few organizational tools that helped me to be more productive while dealing with stress, anxiety, and depression. They include post-it notes, Trello cards, calendars, and emojis (just to name a few). I’m sharing them in the hopes that they can be a source of ideas and inspiration for those struggling with similar conditions. In 2016, I was diagnosed with depression, and it significantly affected the way I worked. I was less creative but more reactive. It felt impossible for me to write new content and have great ideas. All I could do was react, i.e. respond to e-mails, show up in meetings, and get things done at the last minute but at immense cost. Thanks to therapy and medication, my depression eventually retreated, but it was still throwing the occasional wrench in my brain machinery. I was facing a growing workload, looming critical deadlines, a swirl of unrelated tasks on the professional and personal sides, and this all felt very, very overwhelming. As a result, I was procrastinating, pushing things back; which eventually made everything worse (obviously). I learned that, even though I didn’t feel anxious, these were telltale signs of anxiety and work-related stress. I had never been particularly good at organizing myself. In the past, I had used agendas, notepads, ticket trackers, and trello boards when my job required it; but there was always some external stimulus and structure to guide me. (The company had a process. My project group had this one person who knows how things should be done and taught us the right way.) This time, I was on my own, and I didn’t know where to start. On the to-do list above, you can see that I actually have two columns on my notebook. The left column is for the long-standing tasks; the right column is for a collection of chores and high-churn tasks that should be completed quickly; I didn’t want them to pollute the main list. Notice how I started with a well-defined process, but I’m already amending it to accommodate my needs. Balancing rigor and flexibility was (and still is) a difficult act!"
year_published = 2025
