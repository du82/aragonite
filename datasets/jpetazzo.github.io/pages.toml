["https://jpetazzo.github.io/2018/09/06/the-depression-gnomes"]
title = "The depression gnomes"
full_description = "I’m going to try to explain how I felt when I was struggling with depression. There will be gnomes and other lousy metaphors, but don’t let that distract you. Sometimes, depression feels like two miniature gnomic versions of me are fighting over the control of my brain. You know, a bit like the little do-gooder angel and the mischievous imp that we imagine sitting on our shoulders, giving us advice when moral dilemmas arise. “You shouldn’t eat that cake! You’ve already eaten a big lunch! Furthermore, it’s full of fat and sugar, which are bad for your health!” “Chocolate is delicious! You love the cake, and the cake loves you… Furthermore, just one slice won’t kill you! You can always go to the gym to sweat it out… Tomorrow… (Muhahaha!)” The happy gnome is the one that is usually in charge, when I’m not depressed. He’s the one who tells me how to bring joy to myself and others. He’s an optimist, always sees the upside in every situation, and he sings “Always Look At The Bright Side Of Life” under the shower. The sad gnome is not only sad; he’s also an incorrigible defeatist. He’s normally not around, because he’s locking himself up in the basement. Everything scares him, including getting out of the basement. But when he roams free, he writes downer thinkpieces like “Ten Reasons Why It Will Never Work — Number Nine Will Scare You!” and he tends to be very, very convincing. In January 2017, a few months after being diagnosed with depression, I took a big decision: I would learn and play the cello! Why the cello, and which impact it had on me, are a whole another story; which I won’t tell now. All we need to know is that I managed to rent a cello and to find a teacher. However, my cello lessons were rather far. I had to drive half an hour to get there (and as much to get back). The drive was quite an ordeal, because my lessons were in the evening, it was dark outside, our car’s windshield was very dirty, and the headlights didn’t help much. Furthermore, I had just switched to a different antidepressant medication, and my body and brain were very busy coping with various chemical unbalances, making me even more tired than usual. The drive to my cello lessons and back was excruciating."
year_published = 2025
