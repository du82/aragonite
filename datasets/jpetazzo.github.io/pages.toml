["http://jpetazzo.github.io/2015/05/27/docker-images-vulnerabilities"]
title = "Someone said that 30% of the images on the Docker Registry contain vulnerabilities"
full_description = "This number is wonderful. Not because it’s high or low, but because it exists. The fact that it is possible (and relatively easy) to compute this metric means that it will be possible (and relatively easy) to improve it, among other things. Disclaimer: I work for Docker, and while this post is not sponsored or approved by my employer, you are obviously welcome to take it with a grain of salt. Listing official images is easy. They are all built using an automated system called bashbrew, using publicly available recipes. By the way, this means that if you want to rebuild the official images yourself, it is very easy to do so. (Keep in mind that some of those recipes include blobs and tarballs used for bootstrapping purposes; so sometimes you will have to go one step further to rebuild those blobs and tarballs.) Listing other images (the ones belonging to users and organizations) is harder. The hub doesn’t provide a way to list them all right now, so an acceptable workaround is to search for a very common word, e.g. a, and go from there. Of course, this requires some crawling; and you might end up missing a few users, but that will get you pretty close. (That being said, I’m told that the new registry API has something nice to make that task easier…) Downloading the images is trivial. If you want to do it without much fuss, just run a Docker daemon, and run docker pull username/imagename:tag. If you want to get a tarball of the container filesystem, that’s easy: just run docker export username/imagename:tag. (Redirect your standard output somewhere, otherwise you terminal will be a sad panda.) If you don’t trust the Docker daemon, you can also check the registry API (v1, v2) and download the layers through the API, then reconstruct the image from those layers. I’ll spare you the details, but as of today, layers are regular tarballs, and you can just unpack them in top of each other (in the right order) to reconstruct an image. Nothing fancy is involved; the only “trick” is to watch for whiteouts. Whiteouts are special marker files indicating that “a file used to be there, but it is no more.” In other words, if a layer has the file /etc/foo.conf but was removed in an upper layer, then that upper layer will have /etc/.wh.foo.conf, and the file foo.conf won’t show up in the container. It is masked by the whiteout, so to speak."
year_published = 2025
