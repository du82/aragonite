["https://jpetazzo.github.io/2014/03/23/lxc-attach-nsinit-nsenter-docker-0-9"]
title = "Attaching to a container with Docker 0.9 and libcontainer"
full_description = "If you upgraded your Docker installation to 0.9, you are now using libcontainer to run your containers. And if you were using lxc-attach, you probably noticed that it doesn’t work anymore. Here are two ways to recover the “attach” feature with Docker containers. First, let’s explain exactly what’s involved here. Before 0.9, Docker was using the LXC userland tools to start containers. It means that docker run … eventually translated to a call to lxc-start. As such, Docker containers could be managed with the LXC userland tools, including lxc-attach to obtain a shell within an existing container. This is a very convenient feature, because you can drop into a container without having to run a special server process within the container. lxc-attach relies on the fact that each container created with lxc-start listens on a specific socket: by default, an abstract socket named /var/lib/lxc/<container_name>/command. It uses that socket to infer the PID of the container, and then uses the setns() syscall to attach a new process to the namespaces used by the container. Docker 0.9 ships with the “native” execution driver, which uses libcontainer instead of the LXC userland tools. And guess what, libcontainer doesn’t create that abstract socket, so lxc-attach is confused and can’t locate the container. In most distros, nsenter is in the util-linux package. It ships after version 2.23. Unfortunately, Debian and Ubuntu still ship with util-linux 2.20 as of March 2014; so you will have to compile it yourself: Now, find the PID of the first process of the container (actually, any PID will do, but this is just easier and safer): nsenter does not drop capabilities; so the shell started by nsenter can do more stuff (and more harm!) than a normal process running within the container. Note: when looking for details about nsenter, I realized that Sebastien Han already posted a very similar recipe. If you want to use nsenter before version 0.9, his recipe works best (since Docker pre-0.9 doesn’t have .State.Pid)."
year_published = 2025
clearnet = "https://jpetazzo.github.io/2014/03/23/lxc-attach-nsinit-nsenter-docker-0-9"
