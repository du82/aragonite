["https://jpetazzo.github.io/2018/02/26/expatriation-tax-usa-irs"]
title = "Tax implications of relocating to the US"
full_description = "This is a boring post about boring tax stuff. It’s boring but I wish I had known that when I moved to the US — it would have saved me more than $10K. TL,DR: if you live in the US and own shares in foreign companies (even something tiny), you are supposed to declare it to the IRS each year. You won’t be taxed on it, but you have to declare it. Nobody told me anything about that when I moved to the US. When I learned about it, the compliance procedure ended up costing me more than $10K. (It wouldn’t have costed me anything if I had known ahead of time.) This post will be interesting for people who are US tax residents and own stuff outside of the US. This is the case for many tech workers expatriating to the US, especially the ones who have non-zero work experience, because they are very likely to have earned some equity in their origin country: stocks, stock options, contributions to retirement plans … And they are also very likely to have founded or taken participations in small companies. (And of course, this is not exclusive to tech workers!) Keep in mind that this is just the results of my own research, relevant to my own situation. Your situation is probably different. Do your own research before deciding what you should or shouldn’t do! If you are a US citizen or a permanent resident (i.e. a green card holder), then you are a US tax resident, regardless of where you live and work. (This doesn’t mean that you will pay taxes to the US; but you must file with the IRS every year.) If you are in the US with a work visa (e.g. H1B or L1) and live in the US more than half of the year, you also are a tax resident. In other words, when you expatriate to the US, if you arrive before July 1st, you will probably be a tax resident the first year; otherwise you will start being a tax resident the second year. Almost certainly, yes. You probably have bank accounts, unless you closed them just before moving to the US. Even your bank accounts should be declared (that’s the infamous FBAR, for Foreign Bank Account Report), except if they are below $10K. Then you can skip them, because the IRS doesn’t give a damn about amounts that low."
year_published = 2025
