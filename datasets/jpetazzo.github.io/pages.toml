["http://jpetazzo.github.io/2013/10/20/secure-connection-docker-api"]
title = "Securing Docker in the wild"
full_description = "By default, the Docker API is exposed over a local UNIX socket. If you want to control Docker from a remote host, you can configure Docker to expose its API over a TCP socket instead. However, Docker itself doesn’t implement authentication. We will see here how we can use SSL certificate authentication to encrypt and authenticate the Docker API. This is a very simple recipe, using socat in front of the Docker API. socat will accept HTTPS connections, make sure that the client shows an appropriate certificate, and relay the connection to the UNIX socket. The client should either use socat as well to wrap a normal connection into a SSL connection; or use OpenSSL (or a similar crypto library) to do the wrapping directly. In other words: the client will know for sure that it’s talking to the server, and the server will know for sure that it’s talking to an authorized client. In this example, we will cut corners. The client, server, and certificate authority will actually be the same entity. They will use the same key and certificate. We need to install socat on both the client and server; and we need openssl somewhere (doesn’t matter where exactly: it’s purely for generation of the key material). socat is a very common tool, so it should be available for your distro, even if it’s an exotic one. Here is my quick-and-dirty recipe to generate a RSA key (stored in key.pem) and a self-signed certificate (stored in cert.pem), valid for 100 years: fork means that socat will fork a new child process for each incoming connection (instead of handling only one connection and exiting right away). reuseaddr is a useful socket option, so that if you exit and restart socat, it won’t tell you that the address is already taken. By default, OPENSSL connections made with socat require the other end to show a valid certificate; unless you add verify=0. In that case, we want to encrypt connections and check certificates (to deny unauthorized clients), so the defaults are good."
year_published = 2025
clearnet = "http://jpetazzo.github.io/2013/10/20/secure-connection-docker-api"
