["https://jpetazzo.github.io/2017/01/15/yes-all-men"]
title = "Yes, all men"
full_description = "In conversations about sexism (in the tech industry or elsewhere), men are often surprised to hear how bad the situation is for some of their women coworkers and friends. We often are tempted to say “this wouldn’t happen in my company.” If you are an expatriate or travel abroad, there is also the variant “in my country, we treat women fairly!” I would like to share something that made me think twice about this. A few years ago, I was invited to talk about “the future of the cloud” at a tech event in Paris. This would be a 15-minute talk, with a very wide audience (both technical and non-technical folks). That was something very different from my usual mandate: back then, half of my talks were “Introduction to Docker and containers” and the other half consisted of more advanced topics revolving around containers (containers and security, containers and microservices, containers and immutable infrastructure, containers this and that, you get the idea). Just a few days before, one of my coworkers had published a gut-wrenching blog post where she was describing the daily harassment that she was facing. That woman was (and still is) one of the best open source developers of my generation, and back then, she was working on a very popular open source project. And as a result, she was receiving a constant stream of horrible emails and other messages containing death threats, photoshopped pictures, and more. Of course, not all women in the tech industry have to deal with behavior as extreme; but sexism and bias is rampant in our industry. Women have to work harder to get the same amount of credit; we collectively have biases that push women out of scientific disciplines (as illustrated by the story of this transgender man who suddenly found himself way better considered at work than when his name was Barbara). The software industry, and open source in particular, is no better: far from the “meritocracy” often advertised, open source communities don’t welcome women and studies show that women write code that is at least as good as men, but will be rated lower if their gender is known."
year_published = 2025
