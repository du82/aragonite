["http://jpetazzo.github.io/2017/01/06/les-mots-ont-un-sens"]
title = "Les mots ont un sens"
full_description = "I usually write in English, about container technology. This will be in French, and about very different topics. You’ve been warned! :-) C’est une phrase un peu bizarre, pas vrai ? Elle est tout à fait correcte grammaticalement parlant. Elle intime la personne qui l’entend à observer un spectacle insolite : une vache en train de pondre. C’est là que les problèmes commencent. Parce qu’on peut difficilement trouver plus mammifère qu’une vache, et que les mammifères ne pondent pas d’œufs. Une vache en train de pondre, c’est comme un dragon volant crachant du feu, un archange vengeur, ou un gentil électeur du FN : on peut s’imaginer à quoi ça ressemble (et encore), mais on sait que ça n’existe que dans notre imagination. Si je vous dis, « oh, regarde, une vache en train de pondre », qu’allez-vous comprendre ? Ma foi, il y a beaucoup d’interprétations possibles. Peut-être que j’ai cru voir une vache en train de pondre, assise dans l’herbe ; et ignorant que les vaches ne pondent pas, j’essaie d’attirer votre attention sur ce fait peu ordinaire. En ce cas, vous allez probablement me reprendre aimablement, m’expliquant que même si les vaches sont parfois les voisines des poules, elles ne pondent pas pour autant. Peut-être que je ne suis pas tout à fait saint d’esprit, ou bien que j’ai une aphasie de Wernicke à prédominance sémantique à la suite d’un AVC, par exemple ; autrement dit, j’ai une lésion au cerveau qui affecte la manière dont j’utilise mon langage. Peut-être que je ne montre pas une vraie vache en train de pondre, mais une représentation d’une vache en train de pondre. C’est un des points forts de l’humain, d’être capable d’imaginer, de conceptualiser des choses qui n’existent pas. Un artiste peut dessiner une vache assise sur un œuf. Ce que je voulais dire, c’est en réalité : « oh, regarde, un tableau représentant une vache en train de pondre », sauf que si cette discussion se déroule dans une galerie d’art, il sera quelque peu redondant de préciser qu’on parle d’un tableau (puisque il n’y a que ça tout autour de nous)."
year_published = 2025
