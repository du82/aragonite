["http://jpetazzo.github.io/2015/09/15/i-am-a-feminist-but"]
title = "“I am a feminist, but…”"
full_description = "TL,DR: we all have different perceptions and experiences. Just because you’re fine with a picture, book, movie, etc., doesn’t mean that everybody will accept it equally well. Even if you are the nicest person in the world. Let’s accept it, and be aware of each other’s sensitivities. A recent CommitStrip Episode describes two guys and a girl watching an episode of the TV show Mr Robot. This TV show has the reputation of being technically accurate in many ways, which makes it popular among people who know how modern technology actually works. (Those people can often be frustrated by the considerable suspension of disbelief required to watch most movies where computers, networks, and other technology artifacts are a central point of the plot. Anyway!) The first image just shows the three characters on a couch, watching the show. By looking at it, I was already afraid of what would be coming next. And I was right: they watch the show, with an avalanche of technical words: DDOS! Rootkits! Boot sequence! And the two guys are totally into the story, but the girl doesn’t get it. It’s conveying the stereotype that women are “not technical,” that they are not interested by computers, and when there is a “geeky” TV show they won’t “get it.” There is indeed a serious problem in the tech industry: there are much more men than women, and the unbalance becomes even worse when you focus on engineering positions. Some people naively think that this is because men are better than women in tech roles, but it’s simply not true. Every day,. we use inventions and concepts created or pioneered by women. Also, things are getting worse: the percentage of women in tech is decreasing, which seems to indicate that we’re doing something horribly wrong, causing many women to leave this industry. There are multiple causes, but sexism in the tech industry is one of them. Sexism isn’t always obvious objectification of women or crass harrassment. It’s also all the little things."
year_published = 2025
