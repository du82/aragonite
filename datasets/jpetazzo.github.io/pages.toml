["http://jpetazzo.github.io/2013/10/06/policy-rc-d-do-not-start-services-automatically"]
title = "Use policy-rc.d to prevent services from starting automatically"
full_description = "When you install (or upgrade) a service, the package manager will try to start (or restart) this service. If you are working on a normal server, this is usually what you want. But if you are inside a chroot environment, or maintaining some kind of golden image, you don’t want to start services. If you are using Debian/Ubuntu-based distros, there is a super easy way to solve the problem: the /usr/sbin/policy-rc.d script. When anything needs to start and stop services on Debian or Ubuntu, it doesn’t invoke init scripts directly: it goes through invoke-rc.d. So, instead of doing /etc/init.d/foobar start, a well-behaved postinstall script should do invoke-rc.d foobar start. It will do exactly the same thing, except that it will run policy-rc.d foobar start first. (If /usr/sbin/policy-rc.d doesn’t exist, it is skipped.) The policy-rc.d script has only one job: it should tell to invoke-rc.d if the action is allowed or not, by using its exit status. An exit status of 0 means “action allowed”; an exit status of 101 means “action not allowed”. There are other possibilities, for more complicated scenarios. You can read the details in the invoke-rc.d interface documentation. So, to prevent services from being started automatically when you install packages with dpkg, apt, etc., just do this (as root): If there is no shebang at the beginning of the file, the OS will try to execute it as a “normal” binary. The execve syscall will fail with ENOEXEC (Exec format error). Well, unless your script happen to conveniently have an ELF signature (or another binary signature recognized by your system), but this is very unlikely. The exec wrappers in the libc will try to use /bin/sh as a fallback to invoke the program – which is why I didn’t deem necessary to add a shebang to the policy-rc.d script. However, if you are running a shell, it will use execve directly, and if it fails, it will try to execute the script itself. In other words, if you call a script without shebang from bash, then bash will be used to execute it. (If the script is neither a standard executable nor a bash script, major confusion will ensue.)"
year_published = 2025
clearnet = "http://jpetazzo.github.io/2013/10/06/policy-rc-d-do-not-start-services-automatically"
