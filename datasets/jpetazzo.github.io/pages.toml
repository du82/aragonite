["https://jpetazzo.github.io/2017/04/26/employee-training-professional-development"]
title = "Train people well enough"
full_description = "I’d like to tell you a short story illustrating why training your employees is crucial to the success of your organization. I was born and raised in France, and worked there until 2010. Of course, I’m a native French speaker. What about other languages? Well, I could vaguely get around in German, and my written English was pretty good. So good, in fact, that most people with whom I was interacting (through emails or instant messaging) could easily mistake me for a native English speaker. My spoken English was a very different story, though. We’ll get back to that soon enough! In 2011, I moved to San Francisco to join dotCloud, the startup that eventually became Docker. We were 5, 6 engineers in a coworking space, Founder’s Den, at 625 3rd Street in San Francisco. My extremely thick French accent did not get too much in the way when working with dotCloud founders Solomon Hykes and Sebastien Pahl, who were both perfectly fluent in French and English (and German as well for Sebastien); or with my fellow compatriot Sam Alba. (I have to give props to Mark Erdmann, who was the only one who didn’t speak French in the office back then. Thanks for keeping up, dude!) One day, Solomon’s sister visited our office and filmed us at work. She was shooting a documentary about tech startups, and interviewed all of us. That’s how I realized that my French accent back then was, to put things mildly, not awesome. Countless people (including our investors–true story!) had told me multiple times that I should “absolutely not try to change it,” but it turns out that said accent was so thick, that Solomon’s sister had to add subtitles when I was speaking. Ouch. Multiple times a week, an English teacher (paid by the company) would come to the office, and that’s how I learned that the words law and low are, in fact, pronounced very differently (shocker!). I still have the thick French accent, but people can understand me more easily now. In 2013, when dotCloud became Docker, the SRE team that I was managing was reduced to a huge team of one, to borrow the words of my amazing coworker Kristie Howard. I considered switching gigs. But I accidentally submitted a talk about containers at the SCALE conference; and after that talk, I was asked to do a repeat in Beijing, and then in Moscow. My speaker career really took off, and I gave up to 100 talks per year about Docker. (We can have a conversation about whether that was a sane, healthy thing to do; but that’ll be in a later post!)"
