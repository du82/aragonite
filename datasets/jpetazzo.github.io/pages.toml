["http://jpetazzo.github.io/2014/12/27/gravlax-cured-salmon-recipe"]
title = "Gravlax (cured salmon) recipe"
full_description = "This is my recipe for Gravlax (cured salmon). It makes a great appetizer. The only downside is that you must prepare it in advance, since it needs to cure 36 to 48 hours in the fridge. The following quantities will easily feed 15 persons if the salmon is the main appetizer (and you will probably have some leftovers, but that’s OK because you can keep the salmon a few days in the fridge without any problem, since it will be cured). Don’t hesitate to scale down the recipe if you have less people! Finely chop the dill. If you don’t have specialized equipment, you can use kitchen scissors. Better remove the stems, at least the bigger ones; it’s not mandatory but it will be more pleasant (and the taste is in the leaves and smaller stems anyway). Put the salmon in a dish with a relatively high edge (maybe 2 inches), because the fish is going to let out a lot of liquid. Put a weight on the fish, so that the filets are tightly pressed against each other. I typically put a cutting board (smaller than the dish), and let one or two packs of beer rest on the board. Put the dish in the fridge. Flip it every 12 hours. Leave at least 36 hours total (48 hours is even better). When you will remove the fish from the fridge, you should see a lot of fishy water in the dish. Drain it. Then rince the salmon profusely, to remove the sugar and salt mix. There will probably be some bits of dill incrusted within the fish; that’s OK. Dice the salmon. I typically make cubes about the size of those appetizer cheese cubes, but you can also make thin slices. To dice the fish, I use a very sharp, toothless knife. I cut thin strips (half an inch wide, 2 to 4 inches long), with the skin; then I slice the strip in the middle, and make the blade slide between the skin and the flesh. Let’s prepare the sauce. Mix the greek yogurt, the juice of the two lemons, one tablespoon of olive oil, and the other half of the dill. Add a bit of salt and pepper according to your taste. Note: a few hours after cutting it, the salmon will taste very salty, but with the sauce, it should be just perfect. In my experience, after a day or so, it doesn’t taste that salty, and can be enjoyed without the sauce. I don’t know if the taste of salt really goes away, or if me tastebuds get accustomed."
