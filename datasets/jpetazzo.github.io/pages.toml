["https://jpetazzo.github.io/2017/12/06/letter-to-santa-kube"]
title = "Letter to Santa Kube"
full_description = "A few months ago, I wrote and delivered a Kubernetes orchestration workshop, based on my Swarm orchestration workshop. While doing so, I hit a few snags; and since I’m attending KubeCon this week, I thought this would be the perfect occasion to track down Santa Kube and give them my wishlist for Christmas! 🎄🎅🏿❤️ As a foreword: I don’t consider myself a Kube expert, and while I did a bit of research, I might have missed some obvious workarounds. If that is the case, I trust my readers to let me know, and I will be happy to update this post and give them all the credit (as well as a chunk of my eternal gratitude!) The kubectl logs command lets you stream logs from a single container, and it lets you retrieve logs from multiple pods using a selector. However, it doesn’t let you combine both: I’ve been spoiled by the Docker CLI, which lets me stream the logs of multiple replicas at the same time, and will prefix each line with the source of the log line: I would be out-of-this-world-ly delighted if I could get the convenience of multi-container log streaming, together with the power of Kubernetes selectors. I wrote my own bashery that basically repeatedly fetches logs using --since and then does something ugly to remove duplicate lines, but then I realized that this was so wrong on so many levels and stopped before that code would spring to life and try to devour my face. I have tried kail, but the installation was far from painless (why can’t I just go get a Go program? 😭) and it doesn’t play nice with white terminals (at first, I thought it was buggy because a lot of text was in white on a white background). And then there is stern which looks pretty dope too. Update: I tried it! Thanks @lestrrat for encouraging me to try it by the way. I just wish this were embedded in the kubectl CLI. I would also get much joy and happiness from a thing that could be installed with just go get (without messing with additional dependency management tools)_ since I could then install it without installing Go!"
