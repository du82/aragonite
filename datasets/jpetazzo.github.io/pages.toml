["https://jpetazzo.github.io/2017/12/16/usb-c-redux"]
title = "USB-C redux"
full_description = "A few months ago, I started using a 2017 12” Macbook Air. This machine has only two ports: an audio jack, and one USB-C port. That USB-C port is the only thing you have to plug external storage and monitors, network connectivity, and of course, a power supply. I had to do some research to understand how USB-C works, and find the perfect adapters (at least, the perfect adapters for what I do). This was written in 2017. The product recommendations in this post are probably not relevant anymore. However, the general description of how USB works (in particular, USB-C alt modes) is still relevant if you’re trying to figure this out. I also recommend to check this article which explains how USB-C data lanes get shared when using DP alt modes; it’s useful if you plan on using high resolution and high frame rates displays (think 4K at 60 fps). If you have a machine like the one I had, with only one USB-C port, and without Thunderbolt support, I recommend to get docks and dongles similar to these ones: Note that these products may not be available anymore today, so you might have to find other ones … Sorry! The docking station is great. Its only downside (for me!) is that it doesn’t have a DisplayPort output; but you can get 4K on the HDMI port (if your monitor supports it; some older monitors support higher resolutions only on their DP inputs). This means that you can’t use DisplayPort MST to cascade multiple screens. However, the dock has two extra DsplayLink ports (one DVI, one HDMI) that might or might not be helpful. (I’ll cover DisplayLink briefly later.) The adapter is great too. Its only downside (again: for me!) is that it uses a lot of power, and that’s why I ended up also getting a dock. The charger that comes with the MacBook Air delivers 40W. Once I insert the adapter between the charger and the MacBook, the latter reports that it is connected to a 13W power supply. This means that the battery will charge very slowly, or even drain slowly, if you are doing CPU intensive tasks (and that machine has a very weak CPU, so sometimes “having too many tabs open” can be CPU intensive!). Also, that means that the adapter dissipates a lot of heat. Finally, if you don’t need that plethora of connectors, there are smaller adapters that you might like more."
