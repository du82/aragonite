["http://jpetazzo.github.io/2017/05/05/track-host-mc-tips-from-dockercon"]
title = "Being a track host – tips from DockerCon"
full_description = "You’ve accepted to be a “track host,” but you don’t know how to do it? Or you’ve done it before, but you’d love to swap a few tips, tricks, and new ideas to do it better next time? I got you covered! I’ve been a track host twice. Both times were for DockerCon, in the “Black Belt Tech” track. I had a wonderful time, because that gave me the perfect excuse to sit during the whole conference in a track that was both fascinating and enlightening to me, and listen to speakers of the highest caliber; some of them my friends, some of them my idols, some of them both at the same time. I’ll be honest with you: the first time, I had no idea what I was doing. I knew I was supposed to introduce the speakers and make sure that everything went fine, but that was pretty much it. This experience alone doesn’t make me qualified to tell others how to be good track hosts, or “MCs.” However, I have spoken at conferences many, many times. If we include meetups and internal presentations at various companies, I have given more than one hundred talks over the last couple of years. This gave me a feel of what worked (and what didn’t) as a speaker. When I started “MC’ing” at DockerCon, I tried to have these experiences in mind, to turn them into useful teachings to better do my job. These tips and tricks are for the “day of.” If you are also involved in the program committee, speaker selection, and pre-conference preparation – I have another post that I want to write about that; but in the present one, I’m sticking purely to things happening the day(s) of the conference. This is going to sound silly, but make sure that you know when your speakers arrive. Know how to contact them. (It could be a phone number or any kind of instant messaging where you know that they’ll be responsive.) Good speakers will typically check their room the day before; but you can also setup a tour. Sometimes you have the room sufficiently ahead of time to offer rehearsals in that room; sometimes you’ll just be able to show them what it’s like. This is important for the speakers: it lets them anticipate the size of the room, how the audience will be seated, where the screen is (or are). If there are multiple projector screens, they’ll know that they shouldn’t use a laser pointer (since they’ll only be able to point at one screen at a time). They should also be able to check if there is a mirror screen, allowing them to see what they’re projecting without turning their back to the audience. That’s also a good moment to check that their computer (if they’re using theirs) can connect to the projector, and that they can connect to the network (wired or wireless) if they need it."
year_published = 2025
