["http://jpetazzo.github.io/2014/08/24/syslog-docker"]
title = "Multiple Docker containers logging to a single syslog"
full_description = "This is a simple recipe showing how to run syslog in one container, and then send the syslog messages of multiple other containers to that one. The Dockerfile and basic instructions are available on a tiny GitHub repo: https://github.com/jpetazzo/syslogdocker. Why the explicit host bind-mount? Because that container will create /dev/log when rsyslog starts, and we want to “pick up” that socket and bind-mount it in our future containers, without having to bind-mount the whole /dev. If we just use --volumes-from, we will pick up the whole /dev. It won’t have a big impact for now, but if later we do fancy stuff (like adding custom devices) it could mess things up, so let’s be fine-grained. That’s it! That container will send log messages to /dev/log, which will actually be the socket created by rsyslogd. You can see the logs by running another container with --volumes-from syslog and checking the files in /var/log. For bonus points, you can try to see what happens when you use journald or something that tries to be container-aware :-) This work by Jérôme Petazzoni is licensed under a Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License."
year_published = 2025
