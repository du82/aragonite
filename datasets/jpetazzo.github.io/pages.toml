title = "Recording video tutorials with (almost) zero budget"
full_description = "I’ve just published a series of video of a one-day Kubernetes tutorial that I recently delivered in London. I would like to share the method and tools that I used, because although the result is far from perfect, I believe it can be useful for other speakers who want to share their work to a wide audience without a huge investment (in time and equipment). I regularly deliver workshops, tutorials, and other training sessions. The main topics are containers and Kubernetes. Sometimes it is a half-day or full-day workshop at a conference; sometimes a longer tutorial; I also deliver public and private training for various companies. In April, I will deliver three training sessions in Paris (in French). There will be getting started with containers, deploying apps with Kubernetes, and Kubernetes administration and operations. French is not your thing? I got you covered with Kubernetes for administrators and operators, a two-day tutorial in June, at the O’Reilly Velocity conference in San Jose (CA). If you know someone who might be interested … I’d love if you could let them know! Thanks ♥ But in-person training doesn’t scale, and I’ve always wanted to reach a wider audience. A lot of high-quality courses are now available online through various platforms. Producing such a course is a lot of work; and for now, I (unfortunately) don’t have the resources to do that. However, I thought that it should be easier to do a live recording of a workshop, and then make the recording available online. The result wouldn’t be as good as a real online course, but it would be better than nothing (and it would get me one step in the right direction if I ever decide to make such a course after all). When I was working at Docker Inc., I started recording the workshops I delivered at conferences. To keep things simple, I decided that I would just do a screen recording. Of course, having a camera is better (it’s more engaging to see the speaker) but it’s also way more complex."
