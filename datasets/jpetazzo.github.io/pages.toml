["https://jpetazzo.github.io/2015/09/10/how-to-deliver-great-tech-tutorials"]
title = "How to deliver a great tech tutorial"
full_description = "Here are a few tips and tricks that I learned when building then delivering the Docker Fundamentals course at Docker Inc. This course is a 2 days training designed to be delivered to small groups (up to 20 people) but we also delivered the intro part many times at tech conferences, to groups of varying sizes (50 to 300). I wrote this in a hurry. The style is probably not very good, and I should probably move some parts around. Pull requests welcome :P We did this for every single Docker tutorial: just before the tutorial (like, the night before the tutorial, or even a few hours before it starts) we would create cloud VMs, pre-provisioned with all the things the students will need. You will need stable Internet access. Some people balked at the very idea of doing the training on remote machines. “What if the conference WiFi goes down?” In the case of Docker, we want to pull images, download packages, etc.; so by doing things “in the cloud” we just maintain one SSH connection per student, instead of having each student download images and packages for 10s or 100s of MB. At Velocity Santa Clara in 2014, we had 300 people in the room, and it worked pretty well. Just clarify ahead of time to set expectations. To automate the provisioning of the images, we recommend to use cloud-init because it’s ridiculously simple. In our case, we start from an Ubuntu 14.04 image (all serious providers will have this available; if not, switch to another provider), and we provide a script as the cloud-init payload. (On EC2, that’s the metadata field.) The script gets executed at first boot. In our case, the script installs the Docker Engine, Docker Compose, Docker Swarm, and pre-pulls a few images. It also sets a custom user and password in the VM. After provisioning the images, we have a script that gather the IP addresses, and generates a printable HTML file that has little cards, one per machine, showing IP address + login + password. We print that file, cut out the cards, and hand them out to the students."
year_published = 2025
