["https://jpetazzo.github.io/2015/01/13/docker-mount-dynamic-volumes"]
title = "Attach a volume to a container while it is running"
full_description = "It has been asked on #docker-dev recently if it was possible to attach a volume to a container after it was started. At first, I thought it would be difficult, because of how the mnt namespace works. Then I thought better :-) In the examples below, I deliberately included the $ sign to indicate the shell prompt and help to make the difference between what you’re supposed to type, and what the machine is supposed to answer. There are some multi-line commands, with > continuation characters. I am aware that it makes the examples really painful to copy-paste. If you want to copy-paste code, look at the sample script at the end of this post! In the following example, I assume that I started a simple container named charlie, with the following command: I also assume that I want to mount the host directory /home/jpetazzo/Work/DOCKER/docker to /src in my container. First, you will need nsenter, with the docker-enter helper script. Why? Because we are going to mount filesystems from within our container, and for security reasons, our container is not allowed to do that. Using nsenter, we will be able to run an arbitrary command within the context (technically: the namespaces) of our container, but without the associated security restrictions. Needless to say, this can be done only with root access on the Docker host. We want to mount the filesystem containing our host directory (/home/jpetazzo/Work/DOCKER/docker) in the container. First, we will canonicalize (or dereference) the file, just in case it is a symbolic link - or its path contains any symbolic link: Then, we need to find which filesystem contains that path. We will use an unexpected tool for that, df: Let’s use the -P flag (to force POSIX format, just in case you have an exotic df, or someone runs that on Solaris or BSD when those systems will get Docker too) and put the result into a variable as well: Now, in a world without bind mounts or BTRFS subvolumes, we would just have to look into /proc/mounts to find out the device corresponding to the /home/jpetazzo filesystem, and we would be golden. But on my system, /home/jpetazzo is a subvolume on a BTRFS pool. To get subvolume information (or bind mount information), we will check /proc/self/mountinfo."
year_published = 2025
