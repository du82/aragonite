["http://jpetazzo.github.io/2013/12/07/pxe-netboot-docker"]
title = "Network booting machines with a PXE server running in a Docker container"
full_description = "When you want to install a new machine, or boot in rescue mode, the usual method is to boot from a CD or USB stick. But virtually all modern computers with an Ethernet interface can also boot from the network. Here is how to setup a boot server super easily, by running it in a Docker container. On Intel machines (32 or 64 bits), the network boot mechanism is called PXE. It uses multiple protocols: Here, we will show how to build a PXE server (DHCP+TFTP) to boot a machine to the Debian install system. It lets you install Debian entirely from the network. You can of course tailor it to your needs (and I hope someone will submit interesting pull requests to make that happen). As you will see, setting up a PXE server is not hard. It used to be more complicated, but dnsmasq simplified the whole things immensely, since it combines a DNS, DHCP, and TFTP server, and can be configured entirely from the command-line. Now, the PXE server is booting anything connected to the br0 bridge; but usually, nothing is connected to that bridge. So, assuming that eth0 is your Ethernet interface, just do brctl addif br0 eth0 – and that’s it! Now you can boot PXE machines on the network connected to eth0! Then, we declare some environment variables. If you want to netboot 32 bits machines, you can change ARCH; if you want to install the jessie distribution instead, update DIST. And of course you can update the mirror if you want. Now we install the required packages. Dnsmasq is the DNS+DHCP+TFTP server. We will need wget a bit later; and iptables will be used to give network access to the netbooted machines. We install pipework. Pipework is used in the container for one trivial thing: waiting until eth1 becomes available. eth1 will appear “automagically” when we run pipework in the host, after starting the container. Download the Linux kernel, ramdisk, and PXE boot loader from the Debian mirror. The WORKDIR instruction means that all further lines will be executed in /tftp. Last but not least, we define the command that should run within the container. This one is big! We could have used a script; but since it’s not that big, we decided to use line continuations instead."
year_published = 2025
clearnet = "http://jpetazzo.github.io/2013/12/07/pxe-netboot-docker"
