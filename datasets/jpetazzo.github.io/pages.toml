["https://jpetazzo.github.io/2013/09/26/gunsub-github-unsubscribe-issue-notifications"]
title = "Gunsub: keep your GitHub notifications under control"
full_description = "Gunsub means “GitHub Unsubscribe”. It lets you be aware of everything happening in a given Github repository (through GitHub’s e-mail notifications), without getting too much spam. It lets the first notification go through, then automatically unsubscribes you from further messages in the same thread (unless you comment or are mentioned in the thread). I wrote this because I wanted to follow closely what was happening inthe Docker repository, but as some point, I realized that I spent too much time dealing with the constant stream of e-mail notifications. What I really needed was an initial notification for the first message of each conversation (e.g. when an issue is created). I didn’t want the rest of the conversation. If I want to get involved, all I have to do is to manually subscribe to the thread (which happens automatically if I comment on the issue through the website or through e-mail, or if someone mentions me on the issue). Gunsub uses the Github API; specifically, the /notifications endpoint. It checks all the notifications that I have received. For each notification, the API indicates the reason of the notification: is it because I was mentioned there? Or automatically subscribed because I’m watching the repository? Or something else? If I was automatically subscribed, then Gunsub checks if there is a subscription information for that thread. If there is a subscription information, it can be either to indicate a manual subscription, or conversely, to indicate that I’m already ignoring that thread; in either case, Gunsub doesn’t change the subscription setting. However, if there is no subscription information, Gunsub will unsubscribe me from further notifications. The subscription information gets overridden if I comment or get mentioned anyway. Thank you! The code is available on /jpetazzo/gunsub. Gunsub only uses the basic Python library, so you don’t need to install anything fancy. You only need to set two environment variables, GITHUB_USER and GITHUB_PASSWORD, and run it with python gunsub.py."
year_published = 2025
