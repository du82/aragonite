["https://jpetazzo.github.io/2015/01/14/amazon-docker-ecs-ec2-container-service"]
title = "My notes on Amazon's ECS (EC2 Container Service), aka Docker on AWS"
full_description = "This morning, I watched AWS’ webinar presenting their container service. Here are some quick notes, for those of you who are as curious as I was about it! This is not meant to be an intro to Docker. This is not meant to be an intro to EC2 or to AWS. This is for people who are already familiar with AWS, specifically with EC2, and who are already familiar with Docker, and wonder what’s behind the ECS (EC2 Container Service) announcements made at AWS re:invent last November. A “container instance” can be any EC2 instance, running any distro (Amazon Linux, Ubuntu, CoreOS…) A cluster starts being empty, and you can dynamically scale it up and down by adding and removing instances. It’s an app definition in JSON. The format is conceptually similar to Fig, but not exactly quite like it. I don’t know why they didn’t pick something more like Fig, or more like the Docker Compose project. It might be because almost everything else on AWS is in JSON, and they wanted to stick to that. Note: Micah Hausler wrote container-transform, a tool to convert Fig/Compose YAML files to the ECS task format: A task is an instanciation of a task definition. In other words, that will be a group of related, running containers. The webinar had a demo involving Mesos; they started container from Marathon, from Chronos, and using the CLI as well, and the containers were visible everywhere. That looked cool. Initially, I didn’t understand how it worked; but the people who built it were kind enough to chime in and explain: @mndoci @jpetazzo the scheduler drive speaks to AWS ECS only, there are no Mesos masters or slaves involved. Just ECS + Marathon/Chronos Containers can be linked (the task definition allows to name containers, and then to indicate that a container is linked to another one) but I don’t know how that works. There are a some items that are still to be clarified, like the use of private registries (but on that front, Docker Hub Enterprise might eventually come on AWS; and it will likely integrate nicely with ECS)."
year_published = 2025
