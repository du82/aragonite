full_description = '''Download jQuery v3.7.1 Only the latest version of jQuery is supported. Discover Support Options View Source on GitHub → How jQuery Works → Lightweight Footprint Only 30kB minified and gzipped. Can also be included as an AMD module CSS3 Compliant Supports CSS3 selectors to find elements as well as in style property manipulation Cross-Browser Chrome, Edge, Firefox, IE, Safari, Android, iOS, and more What is jQuery? jQuery is a fast, small, and feature-rich JavaScript library. It makes things like HTML document traversal and manipulation, event handling, animation, and Ajax much simpler with an easy-to-use API that works across a multitude of browsers. With a combination of versatility and extensibility, jQuery has changed the way that millions of people write JavaScript. Resources jQuery Core API Documentation jQuery Learning Center jQuery Blog Contribute to jQuery Browse or Submit jQuery Bugs A Brief Look DOM Traversal and Manipulation Get the <button> element with the class 'continue' and change its HTML to 'Next Step...' 1 $( "button.continue" ).html( "Next Step..." ) Event Handling Show the #banner-message element that is hidden with display:none in its CSS when any button in #button-container is clicked. 1 2 3 4 var hiddenBox = $( "#banner-message" );$( "#button-container button" ).on( "click", function( event ) { hiddenBox.show();}); Ajax Call a local script on the server /api/getWeather with the query parameter zipcode=97201 and replace the element #weather-temp's html with the returned text. 1 2 3 4 5 6 7 8 9 $.ajax({ url: "/api/getWeather", data: { zipcode: 97201 }, success: function( result ) { $( "#weather-temp" ).html( "<strong>" + result + "</strong> degrees" ); }}); Related Projects jQuery UI This project is in maintenance-only mode. Learn more. jQuery Mobile This project is deprecated. Learn more.'''
