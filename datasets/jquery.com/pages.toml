["https://jquery.com/upgrade-guide"]
title = "jQuery Core Upgrade Guides | jQuery"
description = "jQuery: The Write Less, Do More, JavaScript Library"
full_description = 'jQuery Core Upgrade Guides jQuery Upgrade Guides The jQuery upgrade guides provide information on all breaking changes and some notable changes in pinnacle versions of jQuery. Overall, jQuery has had very strong backwards compatibility throughout its history. However, these breaking changes were deemed necessary to address security concerns, fix bugs that could not be fixed without behavior changes, or to adapt to the introduction of modern APIs on the web. Most of the breaking changes listed should not apply to the majority of users, but these guides add some context and explanation for each change. 3.5 Upgrade Guide 3.0 Upgrade Guide 1.9 Upgrade Guide Upgrading jQuery The jQuery Team provides the jQuery Migrate plugin to make upgrading jQuery as easy as possible. It is mainly meant as a development tool that generates warning messages in the browser console that can be used to identify and fix compatibility issues. It temporarily restores deprecated features and behaviors so that older code will still run on newer versions of jQuery while the compatibility issues are addressed. There are two versions of jQuery Migrate: 1.x and 3.x (there is no Migrate 2.x). Only one version should be used at a time, but you may need to use both in succession if upgrading from a jQuery version that predates jQuery 1.9. For example, if your current jQuery version is 1.4.4, first upgrade to jQuery 1.12.4 with jQuery Migrate 1.x and then upgrade to the latest jQuery with jQuery Migrate 3.x. If your current version is 1.9 or later, you can update straight to the latest jQuery with jQuery Migrate 3.x. Using jQuery Migrate First, add jQuery Migrate to your page after loading jQuery. 1 2 <script src="https://code.jquery.com/jquery-3.7.1.js"></script><script src="https://code.jquery.com/jquery-migrate-3.4.1.js"></script> Then, test your website or application. As different jQuery APIs are used, jQuery Migrate will log messages to the console warning about any deprecations or breaking changes. Address each warning one at a time. Finally, when no more warnings are logged to the console and all breaking changes have been addressed, the jQuery Migrate can be removed and migration is complete! See the jQuery Migrate README for more details.'
