full_description = '''Download jQuery link Latest versionTo locally download these files, right-click the link and select "Save as..." from the menu. Download the compressed, production version: Download jQuery 3.7.1 Download the uncompressed development version of jQuery 3.7.1 Download the map file for jQuery 3.7.1 jQuery 3.7.1 blog post with release notes The slim build is a smaller version, that excludes the ajax and effects modules: Download jQuery 3.7.1 slim build Download the uncompressed development version of the jQuery 3.7.1 slim build Download the map for the jQuery 3.7.1 slim build The uncompressed version is best used during development or debugging; the compressed file saves bandwidth and improves performance in production. You can download the source map file to help with debugging the compressed production version. The source map is not required for end-users to run jQuery; it is a tool to help improve a developer's debugging experience. As of jQuery 1.11/2.1, we no longer link source maps to compressed releases by default. Browse the jQuery CDN at releases.jquery.com for a full list of assets, including older and historical versions. link UpgradeFor help when upgrading jQuery, read the upgrade guides. We also recommend using the jQuery Migrate plugin. link jQuery Migrate PluginThe jQuery Migrate plugin simplifies upgrading from older versions of jQuery. The plugin restores deprecated features and behaviors so that older code will still run properly on newer versions of jQuery. When upgrading from a pre-1.9 jQuery version to jQuery 1.9 or up to jQuery 3.0, first use jQuery Migrate 1.x: Download jQuery Migrate 1.4.1 (compressed production version) Download the uncompressed, development jQuery Migrate 1.4.1 When migrating from jQuery 3.x to a later jQuery 3.x version, use jQuery Migrate 3.x instead: Download jQuery Migrate 3.5.0 (compressed production version) Download the uncompressed, development jQuery Migrate 3.5.0 Use the compressed production version to restore compatibility issues without changing any application code. Use the uncompressed development version to additionally diagnose and help migrate compatibility issues, through helpful warnings on the console that identify how to transition your application code. link Downloading jQuery using npm or YarnjQuery is published on npm under the jquery package. You can install the latest version of jQuery with the npm CLI: 1 npm install jquery As an alternative you can use the Yarn CLI: 1 yarn add jquery This will install jQuery in the node_modules directory. Within node_modules/jquery/dist/ you will find an uncompressed release, a compressed release, and a map file. link jQuery Pre-Release BuildsThe jQuery team is constantly working to improve the code. Each commit to the Github repo generates a work-in-progress version of the code that we update on the jQuery CDN. We recommend they be used to determine whether a bug has already been fixed when reporting bugs against released versions, or to see if new bugs have been introduced. These versions are sometimes unstable and never suitable for production sites. Browse Git builds of jQuery link jQuery CDNTo use the jQuery CDN, reference the file in the script tag directly from the jQuery CDN domain. You can get the complete script tag, including Subresource Integrity attribute, by visiting https://releases.jquery.com and clicking on the version of the file that you want to use. Copy and paste that tag into your HTML file. The jQuery CDN supports Subresource Integrity (SRI) (specification) which allows the browser to verify that the files being delivered have not been modified. Adding the new integrity attribute will ensure your application gains this security improvement in supporting browsers. Starting with jQuery 1.9, sourcemap files are available on the jQuery CDN. However, as of version 1.10.0/2.1.0 the compressed jQuery no longer includes the sourcemap comment in CDN copies because it requires the uncompressed file and sourcemap file to be placed at the same location as the compressed file. If you are maintaining local copies and can control the locations all three files, you can add the sourcemap comment to the compressed file for easier debugging. To see all available files and versions, including older and historical versions, visit https://releases.jquery.com link Other CDNsThe following CDNs also host compressed and uncompressed versions of jQuery releases. Starting with jQuery 1.9 they may also host sourcemap files; check the site's documentation. Note that there may be delays between a jQuery release and its availability there. Please be patient, they receive the files at the same time the blog post is made public. Beta and release candidates are not hosted by these CDNs. Google CDN Microsoft CDN CDNJS CDN jsDelivr CDN link About the CodejQuery is provided under the MIT license. The code is hosted and developed in the jQuery GitHub repository. If you've spotted some areas of code that could be improved, feel free to report a bug. If you'd like to participate in developing jQuery, peruse our contributor site for more information. Feedback about a jQuery plugin should be directed to the plugin author, not the jQuery team. link Past ReleasesAll past releases can be found on the jQuery CDN.'''
