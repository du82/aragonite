["https://jquery.com/upgrade-guide/3.0"]
title = "jQuery Core 3.0 Upgrade Guide | jQuery"
description = "jQuery: The Write Less, Do More, JavaScript Library"
full_description = '''jQuery Core 3.0 Upgrade Guide Overview Browser Support jQuery Migrate Plugin Summary of Important Changes Ajax Breaking change: Special-case Deferred methods removed from jQuery.ajax Breaking change: Cross-domain script requests must be declared Breaking change: Hash in a URL is preserved in a jQuery.ajax() call Feature: New signature for jQuery.get() AND jQuery.post() Attributes Breaking change: .removeAttr() no longer sets properties to false Breaking change: select-multiple with nothing selected returns an empty array Feature: SVG documents support class operations Deprecated: .toggleClass() with no arguments and .toggleClass( Boolean ) Callbacks Feature: Locking a Callback prevents only future list execution Core Breaking change: jQuery 3.0 runs in Strict Mode Breaking change: document-ready handlers are now asynchronous Breaking change: jQuery.isNumeric() and custom .toString() Breaking change: Deprecated .context and .selector properties removed Breaking change: Deprecated .size() removed Breaking change: Undocumented internal methods no longer exposed Breaking change: Return values on empty sets are undefined Feature: for...of loops can be used on jQuery collections Feature: jQuery.ready promise is formally supported Deprecated: jQuery.unique(), renamed to jQuery.uniqueSort() Deprecated: jQuery.parseJSON() Deprecated: document-ready handlers other than jQuery(function) Data Breaking change: .data() names containing dashes Deferred Breaking change and Feature: jQuery.Deferred is now Promises/A+ compatible Resolution Callback exit Callback invocation Backwards compatibility Breaking change and Feature: jQuery.when() arguments Breaking change: jQuery.when() progress notifications Dimensions Breaking change: .width(), .height(), .css("width"), and .css("height") can return non-integer values Breaking change: .outerWidth() or .outerHeight() on window includes scrollbar width/height Effects Breaking change: .show(), .hide(), and .toggle() methods now respect more stylesheet changes Feature: Animations now use requestAnimationFrame Deprecated: jQuery.fx.interval Deprecated: Additional easing function parameters Event Breaking change: .load(), .unload(), and .error() removed Breaking change: .on("ready", fn) removed Breaking change: event.pageX and event.pageY normalization removed Breaking change: jQuery.event.props and jQuery.event.fixHooks removed Breaking change: Delegated events with bad selectors throw immediately Deprecated: .bind() and .delegate() Manipulation Breaking change: .wrapAll(function) only calls the function once Offset Breaking change: Invalid input to the .offset() method Selector Breaking change: Behavior of :hidden and :visible Breaking change: jQuery("#") and .find("#") are invalid syntax Feature: New method jQuery.escapeSelector() Deprecated: jQuery.expr[":"] and jQuery.expr.filters Serialize Breaking change: jQuery.param() no longer converts %20 to a plus sign Traversing Breaking change: .andSelf() removed, use .addBack() link OverviewWith the major version of 3.0, the jQuery Core team has taken the opportunity to make changes to clean up the API and fix bugs that may prove to be breaking changes for some code. This includes the removal of previously deprecated public APIs, changes to or removal of undocumented APIs, and changes to the documented or undocumented behavior of existing APIs for specific inputs. link Browser SupportAs of jQuery 3.0, the following browsers are supported: Internet Explorer: 9+ Chrome, Edge, Firefox, Safari: Current and Current - 1 Opera: Current Safari Mobile iOS: 7+ Android 4.0+ jQuery team policy is to only change browser support on major-version updates, so this list will apply until at least jQuery 4 arrives. link jQuery Migrate PluginAs with the major changes made in jQuery 1.9/2.0, we have created a new version of the jQuery Migrate Plugin to simplify migration of older code to version 3.0. We strongly recommend that you use this plugin as an upgrading tool, it will give specific advice about most of the major changes that may affect your code. Version 3.0 of the jQuery Migrate Plugin does not warn about or restore behaviors that were removed in previous major version changes such as jQuery 1.9/2.0. Use the following steps to upgrade from a version of jQuery older than 1.11.0 or 2.1.0 to this new version 3.0: Upgrade the version of jQuery on the page to the latest 1.x or 2.x version. Add the uncompressed jQuery Migrate 1.x Plugin to the page. Optional but recommended, update any plugins in use since later versions are usually the most compatible with recent versions of jQuery. Test the page and resolve any warnings that appear on the console, using the JQMIGRATE 1.x warning documentation as a guide. Remove the jQuery Migrate 1.x plugin and ensure that the updated jQuery code on the page continues to work properly with only the latest jQuery 1.x/2.x in use. Upgrade the version of jQuery on the page to the latest 3.x version and add the uncompressed jQuery Migrate 3.x plugin to the page. Test the page and resolve any warnings that appear on the console, using the JQMIGRATE 3.x warning documentation as a guide. Report any bugs in third-party plugins to the plugin author. Remove the jQuery Migrate 3.x plugin and ensure that the page continues to work properly with only the latest jQuery 3.x in use. Running both Migrate 1.x and Migrate 3.x simultaneously on the same page is not supported. The uncompressed development version of the Migrate plugin includes console log output to warn when specific deprecated and/or removed features are being used. This makes it valuable as a migration debugging tool for finding and remediating issues in existing jQuery code and plugins. The compressed version of the Migrate plugin does not generate any warnings, although it does issue a solitary console message that it has been installed to simplify debugging. Migrate can be used on production sites when jQuery 3.0 or higher is desired but older incompatible jQuery code or plugins must also be used. Ideally this is only used as a short-term solution, since restoring old behavior may cause conflicts with new jQuery code that expects the new behavior. link Summary of Important ChangesWith a library as widely used as jQuery, it is often difficult for the team to know which changes may impact developers the most before a release occurs. Despite the length of this list, we believe that the majority are edge cases. Many jQuery projects should be able to run version 3.0 with only minor changes if any. Changes are listed by their component category, and prefixed with a description to help you understand its impact: Breaking change: This change may affect existing code, since it changes the API surface in some way. Most of the time the impacts are only for specific edge cases as noted. Feature: The change is an API addition and should not affect existing code in most cases. However, there is the possibility that new features can interact negatively with existing code. Deprecated: This feature or API is still present in jQuery 3.0, but its use is discouraged. It may be removed in a future major-version update. Remember that the jQuery Migrate plugin described above can detect and warn about many of these changes so that they can be fixed in your code. For a complete and detailed list of all code changes, see the 3.0 milestone in the jQuery Core issue tracker or the version diff. link Ajaxlink Breaking change: Special-case Deferred methods removed from jQuery.ajaxThe jqXHR object returned from jQuery.ajax() is a jQuery Deferred and has historically had three extra methods with names matching the arguments object of success, error, and complete. This often confused people who did not realize that the returned object should be treated like a Deferred. As of jQuery 3.0 these methods have been removed. As replacements, use the Deferred standard methods of done, fail, and always, or use the new then and catch methods for Promises/A+ compliance. Note that this does not have any impact at all on the ajax callbacks of the same name passed through the options object, which continue to exist and are not deprecated. This only affects the jqXHR methods. https://github.com/jquery/jquery/issues/2084 link Breaking change: Cross-domain script requests must be declaredWhen making a request via jQuery.ajax() or jQuery.get() for a script on a domain other than the one that hosts the document, you must now explicitly specify dataType: "script" in the options. This prevents the possibility of an attack where the remote site delivers non-script content but later decides to serve a script that has malicious intent. Since jQuery.getScript() explicitly sets dataType: "script" it is unaffected by this change. link Breaking change: Hash in a URL is preserved in a jQuery.ajax() callThe jQuery.ajax() method no longer strips off the hash in the URL if it is provided, and sends the full URL to the transport (xhr, script, jsonp, or custom transport). If the server at the other end of the connection cannot deal with a hash on a URL, strip it off before sending the request. https://github.com/jquery/jquery/issues/1732 link Feature: New signature for jQuery.get() AND jQuery.post()jQuery 3 adds a new signature for the jQuery.get() and the jQuery.post() functions by adding a settings parameter. It's an object that can possess many properties and its the same object that you can provide to jQuery.ajax(). https://github.com/jquery/jquery/issues/1986 link Attributeslink Breaking change: .removeAttr() no longer sets properties to falsePrior to jQuery 3.0, using .removeAttr() on a boolean attribute such as checked, selected, or readonly would also set the corresponding named property to false. This behavior was required for ancient versions of Internet Explorer but is not correct for modern browsers because the attribute represents the initial value and the property represents the current (dynamic) value. It is almost always a mistake to use .removeAttr( "checked" ) on a DOM element. The only time it might be useful is if the DOM is later going to be serialized back to an HTML string. In all other cases, .prop( "checked", false ) should be used instead. https://github.com/jquery/jquery/issues/1759https://github.com/jquery/jquery/issues/2913 link Breaking change: select-multiple with nothing selected returns an empty arrayBefore jQuery 3.0, calling .val() on a <select multiple> element with no elements selected returned null. This was inconvenient since if at least one value was selected the return value would be an array. Also, if all options are disabled jQuery already returned an empty array. To improve consistency, the nothing-selected case now returns an empty array. https://github.com/jquery/jquery/issues/2562 link Feature: SVG documents support class operationsSVG has never been fully supported by jQuery and this hasn't changed in jQuery 3. Nonetheless, many jQuery methods work with SVG documents as well. As of jQuery 3 the methods that manipulate class names, such as .addClass() and .hasClass(), support SVG. https://github.com/jquery/jquery/issues/2199 link Deprecated: .toggleClass() with no arguments and .toggleClass( Boolean )Although a signature for these two cases was documented, its actual behavior was never fully defined. This undefined behavior is now deprecated so it will not be documented. You may find you were accidentally using the functionality because .toggleClass( undefined ) behaves the same as a call with no arguments, even though it was invalid input. link Callbackslink Feature: Locking a Callback prevents only future list executionIf a Callback object has a handler function that calls the .lock() method after being .fire()d, it only prevents future execution of the callback list and does not immediately abort execution of the current list. To stop the current execution, use the stopOnFalse option. https://github.com/jquery/jquery/issues/1990 link Corelink Breaking change: jQuery 3.0 runs in Strict ModeNow that most of the browsers supported by jQuery 3.0 have "use strict", jQuery is being built with this directive. Your code is not required to run in Strict Mode, so most existing code should not require any changes. The one case we encountered three years ago was that ASP.NET 4.0 used arguments.caller.callee to attempt tracing through call stacks in its __doPostBack() method. If you are still using a version of ASP.NET that still does this, keep using jQuery 2.x or earlier. Modern browsers support stack traces via error.stack so it should not ever be necessary to examine arguments.caller.callee. https://github.com/jquery/jquery/pull/3061https://bugs.jquery.com/ticket/13335 link Breaking change: document-ready handlers are now asynchronousThe document-ready processing in jQuery has been powered by the jQuery.Deferred implementation since jQuery 1.6. As part of jQuery 3.0's alignment with the Promises/A+ standard, document-ready handlers are called asynchronously even if the document is currently ready at the point where the handler is added. This provides a consistent code execution order that is independent of whether the document is ready or not. For example, consider this code: 1 2 3 4 $(function(){ console.log("ready");});console.log("outside ready"); In jQuery 3.0 this will always log "outside ready" followed by "ready" regardless of whether the document is ready at the point of execution. Earlier versions may log the messages in either order. Since handlers now execute independently of each other, an exception or failure in one document-ready handler no longer prevents other document-ready handlers from running. In custom builds where the deferred module is excluded, an alternative implementation of the document-ready code is used. This implementation supports the jQuery.ready promise but is not a jQuery.Deferred object so it should only be used through jQuery.when(). https://github.com/jquery/jquery/issues/1823https://github.com/jquery/jquery/pull/2891 link Breaking change: jQuery.isNumeric() and custom .toString()The jQuery.isNumeric() method is intended to be used with primitive numbers and strings that can be coerced to finite numbers. In particular, it no longer tries to obtain numbers from objects that have a .toString() method. Users needing specialized checks for other numerics should create their own validation functions. https://github.com/jquery/jquery/issues/2662 link Breaking change: Deprecated .context and .selector properties removedThese properties were deprecated in jQuery 1.9, as they were only used for the obsolete .live() method and have never accurately represented the context or selector for the current collection. https://github.com/jquery/jquery/issues/1908 link Breaking change: Deprecated .size() removed.size() is deprecated as of jQuery 1.8 and removed in jQuery 3.0 in favor of the .length property. link Breaking change: Undocumented internal methods no longer exposedVersio'''
