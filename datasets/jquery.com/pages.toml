["https://jquery.com/support"]
title = "jQuery Support | jQuery"
description = "jQuery: The Write Less, Do More, JavaScript Library"
full_description = '''jQuery Support link Supported versionsWe support only the latest version of jQuery. The 1.x and 2.x branches are no longer supported. jQuery 3.x is the current version branch of jQuery. jQuery 4.0 is in beta. Once jQuery 4.0 is released, we will provide security patches and bug fixes on the 3.x branch for a limited time. link Unsupported versionsWhen using a version earlier than the latest version, there are a few options: Upgrade to the latest version of jQuery. The best solution is to upgrade as it will include all features, bug fixes, security patches, and improvements. The jQuery Migrate Plugin and upgrade guides are available to assist with upgrading. Continue using an older version of jQuery, but include all security patches through commercial security support. Continue using an older version of jQuery without security patches. However, this can come with multiple risks. link Community supportThe following learning resources are available online and free of charge: jQuery Learning Center jQuery API Documentation jQuery UI Demos jQuery UI API Documentation link Matrix chatjQuery is on Matrix! The support channel for jQuery is #jquery_jquery:gitter.im. You can read the channel on Element without an account, or join the channel via any Matrix client. We use the public #jquery_dev channel to discuss project developments. We also hold weekly meetings on Matrix. link IRC chatWe are on Libera Chat IRC in the #jquery channel where you can ask for support. You can join via webchat, or via any IRC client. link StackOverflowStackOverflow is a great place to ask questions and find support for all jQuery projects. Search or create questions tagged with "jquery", or refer to the "jquery" tag introduction. link Commercial supportThe following companies offer commercial support services for jQuery. HeroDevs offers security and compatibility support for EOL versions of jQuery through the OpenJS Ecosystem Sustainability Program and is an approved commercial support vendor. Find out more about their Never Ending Support options. link Follow usjQuery on Mastodon and the Fediverse: @jquery@social.lfx.dev @qunit@fosstodon.org @openjsf@social.lfx.dev jQuery on Twitter: @jquery @jqueryui @jquerymobile @qunitjs @jqcon link Media & Press inquiryJournalists seeking information on jQuery should contact: info@jquery.com. For guidance on branding and trademark usage, visit https://brand.jquery.org/. link Found a bug?For reporting bugs in libraries, documentation, or content, the project's GitHub issue tracker should be used. All jQuery projects can be found at https://github.com/jquery Still haven't found what you're looking for? Please feel free to contact: info@jquery.com link Archives Freenode IRC chat channels (2011-2021) jQuery Forum (2010-2021): For questions and advice regarding jQuery Core, jQuery UI, Themeroller, QUnit, development of jQuery Plugins, and more. jQuery Accessibility mailing list (2008-2016).'''
author = "OpenJS Foundation - openjsf.org"
year_published = 2025
