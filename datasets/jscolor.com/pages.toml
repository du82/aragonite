["https://jscolor.com/docs"]
title = "Documentation - jscolor: JavaScript Color picker"
description = "Color Picker"
full_description = '''Table of Contents 'Hello world' example Installation Step 1: Get jscolor.js Step 2: Include jscolor.js in your HTML Step 3: Add data-jscolor attribute Configuration Presets Built-in presets Using presets Creating custom presets Scripting Accessing color picker instance Accessing color picker via jQuery Creating new picker instance Configuring a picker instance API Reference Configuration options alpha alphaChannel alphaElement backgroundColor borderColor borderRadius borderWidth buttonColor buttonHeight closeButton closeText container controlBorderColor controlBorderWidth crossSize forceStyle format hash height hideOnLeave hideOnPaletteClick mode onChange onInput padding palette paletteCols paletteHeight paletteSetsAlpha paletteSpacing pointerBorderColor pointerBorderWidth pointerColor pointerThickness position previewElement previewPadding previewPosition previewSize random required shadow shadowBlur shadowColor showOnClick sliderSize smartPosition uppercase value valueElement width zIndex Static properties activeClassName className looseJSON presets Static methods hide() init() install(rootNode) ready(func) trigger(eventNames) Picker instance methods channel(...) fromHSVA(h, s, v, a) fromRGBA(r, g, b, a) fromString(str) getFormat() hide() isLight() option(...) randomize(minV=0, maxV=100, minS=0, maxS=100, minH=0, maxH=359, minA=1, maxA=1) show() toBackground() toGrayscale() toHEXAString() toHEXString() toRGBAString() toRGBString() toString(format) trigger(eventNames) 'Hello world' example <script src="jscolor.js"></script> Your favorite color: <input value="ab2567" data-jscolor=""> Installation Step 1: Get jscolor.js Get jscolor.js using one of the following: Direct download: Latest version is: jscolor-2.5.2.zip (or see older releases) Node.js npm package: npm install @eastdesire/jscolor CDNJS: Use URL of the hosted jscolor.js for script's src attribute in the next step. Step 2: Include jscolor.js in your HTML <script src="jscolor.js"></script> Step 3: Add data-jscolor attribute Add data-jscolor attribute to all desired elements (like <input>, <button> or even <span>) Select color: <input data-jscolor=""> Configuration Tip: You can use the online Configurator tool to try out most of the configuration options. To change defaults for all color pickers, just add custom configuration options into the default preset: jscolor.presets.default = {<default_options>} Each color picker can also be configured individually by putting its configuration in data-jscolor attribute. Such options will override any inherited configuration. For example: Update Auto-update PreviewHide previewDownload var sandbox = new Sandbox('#sandbox-tpl-3', {'code':'<script src=\"jscolor.js\">\x3C/script>\n\n<script>\n// let\'s set defaults for all color pickers\njscolor.presets.default = {\n\twidth: 141, // make the picker a little narrower\n\tposition: \'right\', // position it to the right of the target\n\tpreviewPosition: \'right\', // display color preview on the right\n\tpreviewSize: 40, // make the color preview bigger\n\tpalette: [\n\t\t\'#000000\', \'#7d7d7d\', \'#870014\', \'#ec1c23\', \'#ff7e26\',\n\t\t\'#fef100\', \'#22b14b\', \'#00a1e7\', \'#3f47cc\', \'#a349a4\',\n\t\t\'#ffffff\', \'#c3c3c3\', \'#b87957\', \'#feaec9\', \'#ffc80d\',\n\t\t\'#eee3af\', \'#b5e61d\', \'#99d9ea\', \'#7092be\', \'#c8bfe7\',\n\t],\n};\n\x3C/script>\n\n<p>hex: <input data-jscolor=\"{}\" value=\"#3399FF\"></p>\n<p>rgba: <input data-jscolor=\"{}\" value=\"rgba(51,153,255,0.5)\"></p>\n\nOptional fields:\n<p>hex: <input data-jscolor=\"{required:false, format:\'hex\'}\"></p>\n<p>rgba: <input data-jscolor=\"{required:false, format:\'rgba\'}\"></p>','downloadScript':'../mod/sandbox/download.php','height':450}); Note on security: The data-jscolor attribute shouldn't be allowed to be set by an untrusted party. Presets In jscolor, a preset is a set of predefined configuration options which can be applied by simply specifying preset name(s) when creating a color picker. There are some built-in presets which can be used straight away, but you can also create your own. Built-in presets Default preset: default - an empty preset that can be customized. All color pickers use it as a baseline configuration. Color theme presets: light (default colors) dark Picker size presets: small medium (default size) large Other presets: thin - thin borders and controls (default thickness) thick - thick borders and controls Using presets To apply a configuration preset to a color picker, just name the preset in the preset configuration option. You can combine multiple presets together by providing a space-separated list. Should there be any overlapping options, then the former preset overrides the latter. <input data-jscolor="{preset:'<preset1> <preset2> …'}"> For example, this will create a large dark color picker on <input> element: <input data-jscolor="{preset:'dark large'}"> Creating custom presets You can create and use a custom preset this way: Update Auto-update PreviewHide previewDownload var sandbox = new Sandbox('#sandbox-tpl-4', {'code':'<script src=\"jscolor.js\">\x3C/script>\n\n<script>\n// let\'s define custom preset\njscolor.presets.myPreset = {\n\tformat: \'rgba\',\n\twidth: 201,\n\theight: 81,\n\tbackgroundColor: \'#333\',\n\tpalette: \'#fff #000 #808080 #996e36 #f55525 #ffe438 #88dd20 #22e0cd #269aff #bb1cd4\',\n}\n\x3C/script>\n\nColor: <input data-jscolor=\"{preset:\'myPreset\'}\">','downloadScript':'../mod/sandbox/download.php','height':280}); Scripting Accessing color picker instance Elements with data-jscolor attribute will have their picker instance installed in their property <targetElement>.jscolor after DOM is loaded. To access this property before that, you can either install the pickers immediately by calling jscolor.install() like in the example below, or instantiate them programmatically. For example, let's create a color input using this HTML: <input id="colorInput1" data-jscolor=""> You can access its color picker after DOM is loaded via .jscolor property. This is how to set a custom color: document.querySelector('#colorInput1').jscolor.fromString('#80FFAA'); // setting a custom color To call a show() method on it, even before DOM is fully loaded: jscolor.install(); // to immediately install pickers on elements that have data-jscolor attribute document.querySelector('#colorInput1').jscolor.show(); Accessing color picker via jQuery Once DOM is ready, or after calling jscolor.install(), you can access color pickers using jQuery this way: $('#colorInput1')[0].jscolor.fromString('#80FFAA'); // setting a custom color Creating new picker instance In addition to installing using HTML attribute data-jscolor, you can also create new color pickers programmatically using new keyword: var myPicker = new JSColor(<targetElement>, <options>) Note: JSColor is an alias to lowercase jscolor <targetElement> (node or CSS selector) – The DOM node that will display a color picker upon mouse click. The value is either a DOM node or CSS selector, e.g. '#colorInput1' <options> (object) – an optional hashmap with configuration options and their values in format {<option>:<value>, …} You can also specify one or more presets using a preset option, e.g. preset:'dark large' To call a show() method on myPicker: myPicker.show() Configuring a picker instance It is recommended that the picker options are set as a parameter when creating a picker instance, if they are already known at that point. Most options can also be changed afterwards using the option() method. For example: Update Auto-update PreviewHide previewDownload var sandbox = new Sandbox('#sandbox-tpl-5', {'code':'<script src=\"jscolor.js\">\x3C/script>\n\nColor: <input id=\"colorInput1\">\n\n<script>\nvar myPicker = new JSColor(\'#colorInput1\', {format:\'rgba\'});\n\n// let\'s additionally set an option\nmyPicker.option(\'previewSize\', 80);\n\n// we can also set multiple options at once\nmyPicker.option({\n\t\'width\': 101,\n\t\'position\': \'right\',\n\t\'backgroundColor\': \'#333\',\n});\n\x3C/script>','downloadScript':'../mod/sandbox/download.php','height':350}); API Reference Configuration options alpha (string) Initial color's alpha value (opacity). Note: To change the alpha value later in the script, call channel('A', <value>). To read it, call channel('A') Note: When alpha option is set, color picker will automatically display the alpha slider. alphaChannel (mixed) = 'auto' Specifies whether the alpha channel is enabled and the alpha slider is visible. 'auto' - automatically enable alpha channel if the current format supports it or if an alpha-related option is set (alpha, alphaElement) true - enable the alpha channel (alpha slider will be visible) false - disable the alpha channel (color will maintain 100% opacity) alphaElement (node or CSS selector) DOM element that will be used to edit/display the alpha value (opacity). This is particularly useful when you wish to work with alpha channel, but keep the color value in a HEX or RGB format, which doesn't specify opacity. Usually, it is a text <input>, so that the user can edit the alpha value. To include the chosen alpha in submitted <form> data, but make it hidden to the user, use <input type="hidden"> You can also use any other element, such as <span>, in which case the alpha value will be displayed as its read-only text content. Note: When alphaElement is set, color picker will automatically display the alpha slider. backgroundColor (string) = 'rgba(255,255,255,1)' Color picker's background color (in CSS color notation) borderColor (string) = 'rgba(187,187,187,1)' Border color of the color picker box (in CSS color notation) borderRadius (number) = 8 Border radius (px) of the color picker box borderWidth (number) = 1 Border width (px) of the color picker box buttonColor (string) = 'rgba(0,0,0,1)' Foreground color of the Close button, i.e. its border and text color (in CSS color notation) buttonHeight (number) = 18 Height (px) of the Close button closeButton (boolean) = false Whether to display a Close button closeText (string) = 'Close' Text of the Close button container (node) = document.body (Experimental option) Specifies where to append the color picker's box (BODY element by default) controlBorderColor (string) = 'rgba(187,187,187,1)' Border color of the color picker's controls (in CSS color notation) controlBorderWidth (number) = 1 Border width (px) of the color picker's controls crossSize (number) = 8 Size (px) of the cross-shaped pointer forceStyle (boolean) = true Whether to overwrite CSS style of the previewElement using !important flag format (string) = 'auto' Specifies a format to be used for displaying color value. 'auto' - automatically detect format from the initial color value and keep it in effect 'any' - user can enter a color code in any supported format (and it will stay in that format until different one is used) 'hex' - HEX color in CSS notation #RRGGBB 'hexa' - HEX color in CSS notation #RRGGBBAA 'rgb' - RGB color in CSS notation rgb(r,g,b) 'rgba' - RGBA color in CSS notation rgba(r,g,b,a) Note: When entering a color code in a different format than is currently in effect, the color will be converted. However, if format is set to 'any', the format will keep adapting to user-entered value. This way, it is always possible to e.g. paste a HEX color into RGBA color input. hash (boolean) = true Whether the valueElement should have its HEX color code prefixed with '#'. Only applicable to HEX color format. height (number) = 101 Height (px) of the color spectrum area hideOnLeave (boolean) = true Whether to automatically hide the picker when user leaves its target element (e.g. upon clicking the document) hideOnPaletteClick (boolean) = false When set to true, clicking the palette will also hide the color picker. mode (string) = 'HSV' Layout of the color picker controls. 'HSV' - hue and saturation are displayed as 2D gradient, value (brightness) is in the slider 'HVS' - hue and value (brightness) are displayed as 2D gradient, saturation is in the slider 'HS' - hue and saturation are displayed as 2D gradient, no slider (experimental setting) 'HV' - hue and value (brightness) are displayed as 2D gradient, no slider (experimental setting) onChange (function | string) A callback function that is called when the color changes, e.g. after releasing a mouse button or leaving an input field. The value can be either a function or a string with JavaScript code. The this variable in the callback function refers to the current color picker instance, so you can use, for example, this.toRGBAString() to get the current color in a CSS-compatible rgba format. onInput (function | string) A callback function that is called repeatedly as the color is being changed, e.g. while dragging a slider or typing a color code. The value can be either a function or a string with JavaScript code. The this variable in the callback function refers to the current color picker instance, so you can use, for example, this.toRGBAString() to get the current color in a CSS-compatible rgba format. padding (number) = 12 Padding (px) of the color picker box palette (array | string) = [] Colors to be displayed in the palette (swatch), specified as an array or a string of space separated color values (in any supported format). Both of the following palette values are valid: String notation: '#ffe438 #88dd20 rgba(0,154,255,0.6) rgba(187,0,255,0.3)' Array notation: ['#ffe438', '#88dd20', 'rgba(0,154,255,0.6)', 'rgba(187,0,255,0.3)'] paletteCols (number) = 10 Number of columns in the palette. paletteHeight (number) = 16 Maximum height (px) of a row in the palette. paletteSetsAlpha (mixed) = 'auto' 'auto' - palette colors that don't specify alpha will set alpha to 1.0, but only if the palette contains at least one color with transparency (alpha < 1.0) true - palette colors that don't specify alpha will set alpha to 1.0 false - palette colors that don't specify alpha will not change alpha Note: "Palette colors that don't specify alpha" are colors in hex or rgb format. paletteSpacing (number) = 4 Distance (px) between color samples in the palette. pointerBorderColor (string) = 'rgba(255,255,255,1)' Border color of the pointers inside the color picker's controls (in CSS color notation) pointerBorderWidth (number) = 1 Border width (px) of the pointers inside the color picker's controls pointerColor (string) = 'rgba(76,76,76,1)' Color of the pointers inside the color picker's controls (in CSS color notation) pointerThickness (number) = 2 Thickness (px) of the pointers inside the color picker's controls position (string) = 'bottom' Position of the color picker relative to the target element. Possible values: 'left' 'right' 'top' 'bottom' Note: If there is not enough space for the picker at the chosen position, a more suitable position will be used according to available space on page (unless smartPosition is disabled). previewElement (node or CSS selector) = targetElement DOM element that will contain a prev'''
