full_description = '''/* <![CDATA[ */ EXAMPLES.downloadScript = '../mod/sandbox/download.php'; EXAMPLES.es = 'default'; EXAMPLES.setData({'examples':{'basic-uses-palette-swatch':{'title':'Basic uses & Palette (swatch)','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>\n Color:\n <input data-jscolor=\"{}\" value=\"#3399FF\">\n</p>\n\n<p>\n Color with alpha:\n <input data-jscolor=\"{}\" value=\"#3399FF80\">\n</p>\n\n<p>\n Dark picker + button:\n <button data-jscolor=\"{preset:\'dark\', width:250, paletteCols:15, value:\'rgba(51,153,255,0.5)\'}\"></button>\n</p>\n\n<p>\n Custom:\n <input data-jscolor=\"{value:\'rgba(51,153,255,0.5)\', position:\'bottom\', height:80, backgroundColor:\'#333\',\n palette:\'rgba(0,0,0,0) #fff #808080 #000 #996e36 #f55525 #ffe438 #88dd20 #22e0cd #269aff #bb1cd4\',\n paletteCols:11, hideOnPaletteClick:true}\">\n (configured to hide upon clicking bottom palette)\n</p>\n\n<script>\n// Here we can adjust defaults for all color pickers on page:\njscolor.presets.default = {\n position: \'right\',\n palette: [\n \'#000000\', \'#7d7d7d\', \'#870014\', \'#ec1c23\', \'#ff7e26\',\n \'#fef100\', \'#22b14b\', \'#00a1e7\', \'#3f47cc\', \'#a349a4\',\n \'#ffffff\', \'#c3c3c3\', \'#b87957\', \'#feaec9\', \'#ffc80d\',\n \'#eee3af\', \'#b5e61d\', \'#99d9ea\', \'#7092be\', \'#c8bfe7\',\n ],\n //paletteCols: 12,\n //hideOnPaletteClick: true,\n};\n\x3C/script>','start_at':'preview'},'ajax-adding-color-pickers-dynamically':{'title':'Adding color pickers dynamically (AJAX)','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<script>\nfunction addHtml() {\n document.querySelector(\'#out\').innerHTML += \'<input data-jscolor=\"{}\">\'\n jscolor.install() // recognizes new inputs and installs jscolor on them\n}\n\x3C/script>\n\n<button onclick=\"addHtml()\">Click to generate HTML input</button>\n\n<p id=\"out\"></p>','start_at':'preview'},'onchange-and-oninput-events':{'title':'onChange and onInput events','code':'<script src=\"jscolor.js\">\x3C/script>\n\n\n<p>\n You can specify onChange/onInput event handler using jscolor\'s options:\n <button data-jscolor=\"{\n onChange: \'update(this, \\\'#pr1\\\')\',\n onInput: \'update(this, \\\'#pr2\\\')\',\n alpha:0.7, value:\'CCFFAA\'}\"></button>\n</p>\n<em id=\"pr1\" style=\"display:inline-block; padding:1em;\">change event</em>\n<em id=\"pr2\" style=\"display:inline-block; padding:1em;\">input event</em>\n\n\n<p>\n For text INPUTS, you can keep with classic HTML attributes:\n <input onChange=\"update(this.jscolor, \'#pr3\')\" onInput=\"update(this.jscolor, \'#pr4\')\" value=\"CCFFAA\" data-jscolor=\"{alpha:0.7}\">\n</p>\n<em id=\"pr3\" style=\"display:inline-block; padding:1em;\">change event</em>\n<em id=\"pr4\" style=\"display:inline-block; padding:1em;\">input event</em>\n\n\n<script>\nfunction update(picker, selector) {\n document.querySelector(selector).style.background = picker.toBackground();\n}\n\n// triggers \'onInput\' and \'onChange\' on all color pickers when they are ready\njscolor.trigger(\'input change\');\n\x3C/script>','start_at':'preview'},'submitting-form-transparent-colors-rrggbbaa-rgba':{'title':'Submitting form with transparent colors #rrggbbaa and rgba()','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<form onsubmit=\"showFormData(this); return false;\">\n <p>\n Color 1 - HexA:\n <input data-jscolor=\"{}\" value=\"#FFA00080\" name=\"color1\">\n </p>\n\n <p>\n Color 2 - Hex:\n <input data-jscolor=\"{alphaElement:\'#alp2\'}\" value=\"FFA000\" name=\"color2[value]\">\n opacity: <input id=\"alp2\" value=\"0.5\" name=\"color2[alpha]\" size=\"5\">\n </p>\n\n <p>\n Color 3:\n <input data-jscolor=\"{}\" value=\"rgba(255,160,0,0.5)\" name=\"color3\">\n </p>\n\n <p>\n Color 4:\n <button data-jscolor=\"{valueElement:\'#val4\', alphaElement:\'#alp4\'}\"></button>\n <input id=\"val4\" value=\"FFA000\" name=\"color4[value]\" type=\"hidden\">\n <input id=\"alp4\" value=\"0.5\" name=\"color4[alpha]\" type=\"hidden\">\n sends HEX and alpha value\n </p>\n\n <input type=\"submit\">\n</form>\n\n\n<pre id=\"form-data\"></pre>\n\n<script>\n// Helper function that displays submitted form data\nfunction showFormData(form) {\n var lines = [];\n\n for (var i = 0; i < form.elements.length; i++) {\n var e = form.elements[i];\n if (e.name) {\n lines.push(e.name + \' = \' + e.value);\n }\n }\n\n var out = document.querySelector(\'#form-data\');\n out.innerHTML = \'\';\n out.appendChild(document.createTextNode(lines.join(\'\\n\')));\n}\n\x3C/script>','start_at':'preview'},'presets-and-custom-theme':{'title':'Presets and Custom theme','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>\n Small dark preset:\n <input value=\"FFA000\" data-jscolor=\"{preset:\'small dark\', position:\'right\'}\">\n</p>\n\n<p>\n Large preset:\n <input value=\"rgba(255,160,0,0.5)\" data-jscolor=\"{preset:\'large\', position:\'right\'}\">\n</p>\n\n<p>\n Custom theme:\n <input value=\"rgba(255,160,0,0.5)\" data-jscolor=\"{\n position: \'right\', width: 181, height: 181,\n padding: 10, sliderSize: 25, borderRadius: 5,\n borderWidth: 1, controlBorderWidth: 1, pointerBorderWidth: 2,\n borderColor: \'#000\', controlBorderColor: \'#CCC\', backgroundColor: \'#333\'\n }\">\n</p>\n\n<p>\n Input with large preview:\n <input value=\"rgba(255,160,0,0.5)\" data-jscolor=\"{previewSize:60}\">\n</p>\n\n<p>\n Button with large preview:\n <button data-jscolor=\"{value:\'rgba(255,160,0,0.5)\', previewSize:60}\"></button>\n</p>','start_at':'preview'},'customizing-defaults':{'title':'Customizing defaults','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<script>\n// let\'s set default options for all color pickers\njscolor.presets.default = {\n value: \'#88DD20\',\n position: \'right\',\n backgroundColor: \'#333\',\n palette: \'#fff #000 #808080 #996e36 #f55525 #ffe438 #88dd20 #22e0cd #269aff #bb1cd4\',\n};\n\x3C/script>\n\n<p>\n These color pickers share the same default options:<br>\n <input data-jscolor=\"{}\"><br>\n <input data-jscolor=\"{}\"><br>\n</p>\n\n<p>\n ... which can also be extended or overwritten:<br>\n <input data-jscolor=\"{hash:false, width:101, paletteCols:5}\"><br>\n <input data-jscolor=\"{value:\'#FF99CC\', palette:\'#fff #ccc #999 #666 #333 #000\'}\"><br>\n</p>','start_at':'code'},'color-preview':{'title':'Color preview','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>\n You can either redirect the color preview:\n <input data-jscolor=\"{value:\'rgba(192,160,255,0.5)\', previewElement:\'#pr1\'}\">\n</p>\n<em id=\"pr1\" style=\"display:inline-block; padding:1em;\">previewElement</em>\n\n<p>\n Or use onInput event handler:\n <input data-jscolor=\"{value:\'rgba(192,160,255,0.5)\'}\", onInput=\"update(this.jscolor)\">\n</p>\n<em id=\"pr2\" style=\"display:inline-block; padding:1em;\">background</em>\n<em id=\"pr3\" style=\"display:inline-block; padding:1em;\">background color</em>\n\n<script>\nfunction update(picker) {\n document.getElementById(\'pr2\').style.background = picker.toBackground();\n document.getElementById(\'pr3\').style.background = picker.toRGBAString();\n}\n\njscolor.trigger(\'input\'); // triggers \'onInput\' on all color pickers when they are ready\n\x3C/script>','start_at':'preview'},'redirecting-value-and-preview':{'title':'Custom valueElement and previewElement','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<h3>Custom valueElement and alphaElement</h3>\n<p>\n <button data-jscolor=\"{valueElement:\'#val1\', alphaElement:\'#alp1\'}\">\n Pick color\n </button>\n valueElement: <input id=\"val1\" value=\"AB2567\">\n alphaElement: <input id=\"alp1\" value=\"0.7\" size=\"5\">\n<p>\n\n<h3>Custom previewElement</h3>\n<p>\n <button data-jscolor=\"{previewElement:\'#pr1\'}\">\n Pick color\n </button>\n previewElement: <span id=\"pr1\" style=\"display:inline-block; width:100px;\">&nbsp;</span>\n<p>','start_at':'preview'},'adjusting-position':{'title':'Adjusting position','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>\n You can show the picker on the left side of the text input:\n <input data-jscolor=\"{position:\'left\'}\">\n</p>\n\n<p>\n On the right:\n <input data-jscolor=\"{position:\'right\'}\">\n</p>\n\n<p style=\"margin-top:150px\">\n Above:\n <input data-jscolor=\"{position:\'top\'}\">\n</p>','start_at':'preview'},'hsv-and-hvs-mode':{'title':'HSV / HVS mode','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>HSV mode: <input data-jscolor=\"{mode:\'HSV\', position:\'right\'}\"></p>\n<p>HVS mode: <input data-jscolor=\"{mode:\'HVS\', position:\'right\'}\"></p>','start_at':'preview'},'instantiating-new-color-pickers':{'title':'Instantiating new Color Pickers','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<button onclick=\"add(100)\">Add 100 pickers</button>\n\n<p id=\"container\"></p>\n\n<script>\nfunction add(count) {\n for(var i = 0; i < count; i++) {\n var input = document.createElement(\'INPUT\');\n var opts = {backgroundColor: \'#333\'};\n\n var picker = new JSColor(input, opts); // \'JSColor\' is an alias to \'jscolor\'\n picker.fromHSVA((360/count) * i, 100, 100);\n\n document.querySelector(\'#container\').appendChild(input);\n }\n}\n\x3C/script>','start_at':'preview'},'getting-current-color':{'title':'Getting current color','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<input data-jscolor=\"{onInput:\'update(this)\', alpha:1.0}\" id=\"colorInput\">\n\n<pre id=\"out\" style=\"position:absolute; top:20px; left:300px;\"></pre>\n\n<script>\nfunction update(picker) {\n document.getElementById(\'out\').innerHTML = [\n \'toString() = \' + picker.toString(),\n \'toHEXString() = \' + picker.toHEXString(),\n \'toRGBString() = \' + picker.toRGBString(),\n \'toRGBAString() = \' + picker.toRGBAString(),\n \'R = \' + picker.channel(\'R\'),\n \'G = \' + picker.channel(\'G\'),\n \'B = \' + picker.channel(\'B\'),\n \'H = \' + picker.channel(\'H\'),\n \'S = \' + picker.channel(\'S\'),\n \'V = \' + picker.channel(\'V\'),\n \'A = \' + picker.channel(\'A\'),\n ].join(\'\\n\');\n}\n\njscolor.trigger(\'input\'); // triggers \'onInput\' on all color pickers when they are ready\n\x3C/script>','start_at':'preview'},'setting-current-color':{'title':'Setting current color','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>Move pointer over these buttons!</p>\n\n<button style=\"background:#FF9900\" onmouseover=\"\n document.querySelector(\'#foo\').jscolor.fromString(\'ff9900\')\n \">fromString()</button>\n\n<button style=\"background:rgba(77,230,51,.75)\" onmouseover=\"\n document.querySelector(\'#foo\').jscolor.fromRGBA(77,230,51,.75)\n \">fromRGBA()</button>\n\n<button style=\"background:rgba(128,204,255,0.25)\" onmouseover=\"\n document.querySelector(\'#foo\').jscolor.fromHSVA(204,50,100,.25)\n \">fromHSVA()</button>\n\n<p><input data-jscolor=\"{alphaChannel:true}\" id=\"foo\"></p>','start_at':'preview'},'generate-random-color':{'title':'Generate a random color','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>\n Random color:\n <input data-jscolor=\"{random:true}\">\n</p>\n\n<p>\n Random color within specified range: Value = 80-100, Saturation = 10-20, Hue = 0-359</p>\n <input data-jscolor=\"{random:[80, 100, 10, 20, 0, 359]}\">\n</p>','start_at':'preview'},'optional-value-and-formatting':{'title':'Optional value & Formatting','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<p>This color input is optional, so it can be left empty:\n <input data-jscolor=\"{required:false}\"></p>\n\n<p>No # prefix in hex code:\n <input data-jscolor=\"{hash:false}\"></p>\n\n<p>No # prefix in hex code, lowercase:\n <input data-jscolor=\"{hash:false, uppercase:false}\"></p>','start_at':'preview'},'showing-hiding-using-api':{'title':'Showing / Hiding using API','code':'<script src=\"jscolor.js\">\x3C/script>\n\n<button onclick=\"document.getElementById(\'foo\').jscolor.show()\">\n Show Picker</button>\n\n<button onclick=\"jscolor.hide()\">\n Hide Picker</button>\n\n<p><input id=\"foo\" data-jscolor=\"{}\" value=\"cc4499\">','start_at':'preview'},'close-button':{'title':'The Close button','code':'<script src=\"jscolor.js\">\x3C/script>\n\nColor picker with a <em>Close</em> button:\n<input data-jscolor=\"{closeButton:true, closeText:\'Close me!\', backgroundColor:\'#333\', buttonColor:\'#FFF\'}\">','start_at':'preview'}}}); /* ]]> */ Basic uses & Palette (swatch) Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('basic-uses-palette-swatch'); Adding color pickers dynamically (AJAX) Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('ajax-adding-color-pickers-dynamically'); onChange and onInput events Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('onchange-and-oninput-events'); Submitting form with transparent colors #rrggbbaa and rgba() Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('submitting-form-transparent-colors-rrggbbaa-rgba'); Presets and Custom theme Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('presets-and-custom-theme'); Customizing defaults Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('customizing-defaults'); Color preview Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('color-preview'); Custom valueElement and previewElement Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('redirecting-value-and-preview'); Adjusting position Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('adjusting-position'); HSV / HVS mode Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('hsv-and-hvs-mode'); Instantiating new Color Pickers Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('instantiating-new-color-pickers'); Getting current color Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('getting-current-color'); Setting current color Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('setting-current-color'); Generate a random color Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('generate-random-color'); Optional value & Formatting Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('optional-value-and-formatting'); Showing / Hiding using API Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('showing-hiding-using-api'); The Close button Edit sourceDownloadFullscreen editor PreviewDownloadFullscreen editor EXAMPLES.initExample('close-button');'''
