full_description = '''jscolor.js is a JavaScript color picker with opacity channel Just add data-jscolor attribute… Update Auto-update PreviewHide previewDownload var sandbox = new Sandbox('#sandbox-tpl-0', {'code':'<script src=\"jscolor.js\">\x3C/script>\n\nColor: <input value=\"#3399FF80\" data-jscolor=\"{}\">','downloadScript':'./mod/sandbox/download.php','height':250,'previewing':true,'downloadNameInitial':'example'}); Latest release: jscolor-2.5.2.zip (released 2023-12-02) <input data-jscolor="{ format: 'rgba', required: false, palette: '#C00 #0C0 #00C', previewPosition: 'right' }"> Color: <input data-jscolor="{ preset: 'dark', closeButton: true, closeText: 'OK' }"> Color: <input data-jscolor="{ value: '#33AACC80', backgroundColor: '#333', shadowColor: '#FFFFFF80', width: 121, height: 121 }"> Color: More examples → No framework needed jscolor.js is a self-sufficient JavaScript library consisting of only one file of plain JavaScript. It doesn't need any frameworks (jQuery, Dojo, MooTools, etc.) but it is friends with them all. Cross-browser Wide compatibilty across modern desktop & mobile browsers, including: Edge, Firefox, Chrome, Safari, Opera, and others… Highly customizable jscolor provides variety of configuration options. Whether you need to change color picker's size or colors, or attach a function to its onchange event, the configuration can be fine-tuned for your web project. Mobile friendly With a built-in support for touch events, jscolor is designed to be easy to use on touch devices such as tablets and smartphones. Assistance with implementation Should you need assistance incorporating color-related features into your project, do not hesitate to email (function () { var a = document.getElementById('plsnospm-1'); a.href = unescape('%6d%61%69%6c%74%6f%3a%64%65%76%25%34%30%6a%73%63%6f%6c%6f%72%2e%63%6f%6d%3f%73%75%62%6a%65%63%74%3d'); a.appendChild(document.createTextNode(unescape('dev%40jscolor.com'))); })(); for advice. Typical scenarios solved: Customizing jscolor configuration to suit your project Building color-related user interfaces, e.g. for generating colorized prints or product variants Dynamic page layouts based on user-specified colors and other parameters Color space calculations and conversions AJAX integration, server-side processing of color data, etc. jscolor example Pick color RGBA HEX R G B H ° S % V % A Pick color RGBA HEX R G B ° H % S % V A The side buttons have jscolor installed on them ♥ See also other examples of jscolor usage. jscolor.presets.demo = { valueElement: null, backgroundColor: '#202020', shadowColor: 'rgba(0,0,0,0.5)', previewSize: 50, palette: [ '#000000', '#7d7d7d', '#870014', '#ec1c23', '#ff7e26', '#fef100', '#22b14b', '#00a1e7', '#3f47cc', '#a349a4', '#ffffff', '#c3c3c3', '#b87957', '#feaec9', '#ffc80d', '#eee3af', '#b5e61d', '#99d9ea', '#7092be', '#c8bfe7', ], }; var pickers = {}; pickers.bgcolor = new JSColor('#bgcolor-button', { preset: 'demo dark', position: 'right', previewPosition: 'right', onInput: "update('bgcolor')", value: 'rgba(171,37,103,1)', }); pickers.fgcolor = new JSColor('#fgcolor-button', { preset: 'demo dark', position: 'left', previewPosition: 'left', onInput: "update('fgcolor')", value: 'rgba(255,255,255,1)', }); function update (id) { document.getElementById('demo-preview').style.backgroundColor = pickers.bgcolor.toRGBAString(); document.getElementById('demo-preview').style.color = document.getElementById('demo-preview').style.borderColor = pickers.fgcolor.toRGBAString(); document.getElementById(id + '-rgba').value = pickers[id].toRGBAString(); document.getElementById(id + '-hex').value = pickers[id].toHEXString(); document.getElementById(id + '-red').value = Math.round(pickers[id].channel('R')); document.getElementById(id + '-grn').value = Math.round(pickers[id].channel('G')); document.getElementById(id + '-blu').value = Math.round(pickers[id].channel('B')); document.getElementById(id + '-hue').value = Math.round(pickers[id].channel('H')); document.getElementById(id + '-sat').value = Math.round(pickers[id].channel('S')); document.getElementById(id + '-val').value = Math.round(pickers[id].channel('V')); document.getElementById(id + '-alp').value = Math.round(pickers[id].channel('A') * 100) / 100; } function setChannel (id, channel, value) { pickers[id].channel(channel, value); update(id); } function setString (id, str) { pickers[id].fromString(str); update(id); } pickers.bgcolor.trigger('input'); pickers.fgcolor.trigger('input'); Testimonials I just wanted to send a personal thanks for saving me a lot of time and bother. […] You've provided the cleanest solution with copy/paste of 2 lines and it's running. — Greg I really like jscolor, it's perfect for my little free web app! — Alan Our project has been using jscolor.js for a long while to full satisfaction. — Thijs'''
