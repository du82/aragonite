["https://www.json.org/json-da.html"]
title = "JSON"
full_description = 'JSON (JavaScript Object Notation) er et letvægtsformat til dataudveksling. Mennesker kan let læse og skrive JSON. Maskiner kan let analysere og generere JSON. Det er baseret på en delmængde af JavaScript programmingssproget, Standard ECMA-262 3rd Edition - December 1999. JSON er et tekstformat, der er fuldstændig sproguafhængigt. JSONs konventioner er velkendte for udviklere, der anvender C-lignende sprog så som C, C++, C#, Java, JavaScript, Perl, Python og mange andre. De egenskaber gør JSON til et ideelt sprog for dataudveksling. Begge er universelle datastrukturer. Stort set alle moderne programmingssprog understøtter dem på en eller anden måde. Det giver derfor god mening, at et tekstformat til dataudveksling mellem programmeringssprog også bygger på disse strukturer. Et objekt er en ikke-sorteret samling af navn/værdi par. Et objekt begynder med en {venstre tuborg-parentes og slutter med en }højre tuborg-parentes. Efter hvert navn følger et :kolon, mens navn/værdi parrene adskilles med ,komma. Et array er en ordnet samling af værdier. Det begynder med en [venstre firkant-parentes og slutter med en ]højre firkant-parentes. Værdierne adskilles med ,komma. En værdi kan være en tekststreng i citationstegn (dobbelt flueben), en talværdi, true, false, null, et objekt eller et array. Disse strukturer kan indlejres i hinanden. En tekststreng er en sekvens af nul eller flere Unicode tegn; den omklamres af citationstegn (dobbelt flueben) og den bruger baglæns skråstreg som "escape" tegn. Et enkelt tegn præsenteres som en tekststreng, der kun indeholder netop det tegn. En tekststreng er meget lig "string" i C eller Java. En talværdi er meget lig en talværdi i C eller Java, bortset fra JSON hverken benytter oktalt eller hexadecimalt format. Mellemrum af enhver art (whitespace) kan indsættes mellem to vilkårlige elementer. Med undtagelse af nogle få kodningsdetaljer er dette den komplette beskrivelse af JSON sproget.'
