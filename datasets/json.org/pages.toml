["https://www.json.org/json-uk.html"]
title = "JSON"
full_description = "JSON (JavaScript Object Notation) - простий формат обміну даними, що є зручним як для читання та написання людиною, так і для парсінгу та генерації комп'ютером. Він базується на підмножині мови програмування JavaScript стандарту ECMA-262 3rd Edition - December 1999. JSON - це текстовий формат, повністю незалежний від мови реалізації, але він використовує конвенції, знайомі програмистам C-подібних мов, таких як C, C++, C#, Java, JavaScript, Perl, Python та багатьох інших. Ці властивості роблять JSON ідеальною мовою для обміну даними. Це универсальні структури даних. У тому чи іншому вигляді їх підтримують майже усі сучасні мови програмування. Є сенс будувати формат даних, що є незалежним від мови програмування, саме на цих структурах. Об'єкт - це невпорядкований набір пар ключ/значення. Об'єкт починается з {відкриваючої фигурної дужки і закінчується }закриваючою фигурною дужкою. Кожне ім'я супроводжують :двокрапкою, а пари ключ/значення відокремлюють ,комою. Масив - це впорядкована колекція значень. Масив починається з [відкриваючої квадратної дужки і закінчується ]закриваючою квадратною дужкою. Значення відокремлюють ,комою. Значення може бути строкою у подвійних лапках, числом, true, false, null, об'єктом або масивом. Ці структури можуть бути вкладеними."
year_published = 2025
