["https://www.json.org/json-no.html"]
title = "JSON"
full_description = "JSON (JavaScript Object Notation) er et lettvektsformat for datautveksling som er lett å lese og skrive for mennesker. Det er basert på en delmengde av programmeringsspråket JavaScript, Standard ECMA-262 3rd Edition - December 1999. JSON er et tekstformat som er fullstendig uavhengig av andre språk, men som bruker konvensjoner som minner om språkene i C-familien, som C, C++, C#, Java, JavaScript, Perl, Python og mange andre. Disse egenskapene gjør JSON til et ideelt språk for datautveksling. Dette er universelle datastrukturer. Nesten alle moderne programmeringsspråk støtter dem i en eller annen form. Det er naturlig at et format for utveksling av data mellom ulike programmeringsspråk også er basert på disse strukturene. Et objekt er en uordnet mengde med navn/verdi-par. Et objekt begynner med {venstre sløyfeparentes og avsluttes med }høyre sløyfeparentes. Hvert navn er etterfulgt av :kolon og navn/verdi-parene er adskilt av ,komma. En array er en ordnet samling av verdier. En array starter med [venstre hakeparentes og avsluttes med ]høyre hakeparentes. Verdier er adskilt av ,komma. En verdi kan være en streng i doble anførselstegn, eller et tall, eller true eller false eller null, eller et objekt eller en array. Disse strukturene kan nøstes. En streng er en sekvens av null eller flere Unicode-tegn, omgitt av doble anførselstegn som kan inneholde bakstrek. Et tegn representeres av en ett-tegns streng. En streng minner om en streng i C eller Java. Et tall minner om et tall i C eller Java, bortsett fra at JSON verken benytter det oktale eller det heksadesimale tallsystemet. Mellomrom i alle former (whitespace) kan settes inn mellom alle par av elementer. Med unntak av enkelte koding-detaljer er dette en fullstendig beskrivelse av JSON-språket."
