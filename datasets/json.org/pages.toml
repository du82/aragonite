["https://www.json.org/json-ar.html"]
title = "JSON"
full_description = 'JSON (جاسون) طريقة ترقيم عناصر جافاسكريبت : هي صيغة سلسة لنقل البيانات - سهلة للأشخاص قراءتها واستيعابها ، وسهلة للأجهزة والحواسيب تحليلها وتوليدها ، هي جزء من لغة جافا سكريبت “الإصدار الثالث من نظام إيكما 262 ، ديسمبر 1999 ". جاسون هي صيغة بيانات مستقلة تماما عن اللغة المتسخدمة أو الإطار المتبع فيه ، يمكن لكثير من المبرمجين لعائلة لغات السي C والتي تشمل C++ ، C# ، جافا ، جافا سكريبت ، بيرل ، بايثون ، والعديد من اللغات استخدامها ، تلك المميزات تجعل من جاسون الأفضل في نقل البيانات (data) من لغة لأخرى. تلك المواصفات تجعل التركيب مكافئة لنقل البيانات ، كل لغات البرمجة الحديثة تقريبا تدعم هذه التراكيب بشكل من الأشكال ، ولذلك تجعل من جاسون الأفضل في نقل البيانات من لغة لأخرى. عنصر (object) : كمجموعة غير مرتبة من أزواج الأسماء والقيم ، العنصر يبدأ ب } (اليسرى) و تنتهي ب { (اليمنى) . كل اسم منفصل : (كولون) وأزواج القيم والأسماء منفصلة ب , ( فاصلة ) سلاسل (Array) ، هي مجموعة مرتبة من السلاسل، الأراي تبدأ ب [ (براكت اليسرى) وتنتهي ب ] (براكت اليمنى) ، القيم منفصلة بفاصلة , ( فاصلة) يمكن للقيم أن تكون مجموعة من الأحرف (String) منفصلة بعلامة ترقيم " أو رقم ، أو true أو false أو null ، أو سلسلة أو عنصر. وأيضا ممكن جعل التراكيب أكثر تعقيدا بحيث تستخدم كل هذه التراكيب معا .'
