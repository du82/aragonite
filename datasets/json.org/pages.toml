["https://www.json.org/json-sl.html"]
title = "JSON"
full_description = "JSON (JavaScript Object Notation) je preprost format za izmenjavo podatkov. Je enostaven za ljudi za branje in pisanje in tudi za računalnike za razbiranje in generiranje. Temelji na podmnožici programskega jezika JavaScript, Standard ECMA-262, tretja izdaja - december 1999. JSON je tekstoven format, ki je v celoti neodvisen od jezika, a uporablja konvencije znane programerjem v C-jevskih jezikih, vključujoč C, C++, C#, Javo, JavaScript, Perl, Python in mnoge druge. Zaradi teh lastnosti je JSON idealen jezik za izmenjavo podatkov. To sta univerzalni podatkovni strukturi. Praktično vsi moderni programski jeziki ju poznajo v taki ali drugačni obliki. Smiselno je, da tudi jezik za izmenjavo podatkov, ki je neodvisen od programskega jezika, temelji na teh dveh strukturah. Objekt je neurejena množica parov ime/vrednost. Objekt se začne z znakom {zaviti oklepaj in konča z }zaviti zaklepaj. Vsakemu imenu sledi :dvopičje, pari ime/vrednost pa so med seboj ločeni z znakom ,vejica. Seznam je urejena zbirka vrednosti. Seznam se začne z znakom [oglati oklepaj in konča z ]oglati zaklepaj. Vrednosti so med seboj ločene z znakom ,vejica. Vrednost je lahko niz v dvojnih narekovajih, število, true, false, null, objekt ali seznam. Te strukture so lahko gnezdene. Niz je zaporedje nič ali več Unicode znakov obdanih z dvojnima narekovajema, možne so tudi ubežne sekvence. Znak je predstavljen z enoznakovnim nizom. Niz je zelo podoben nizu v jezikih C ali Java. Število je prav táko, kakršno je število v C-ju ali Javi, samo da ne pozna osmiškega in šestnajstiškega zapisa. Prazen prostor se lahko pojavi poljubno med dvema simboloma. Razen nekaj detajlov kodiranja je jezik s tem popolnoma določen."
