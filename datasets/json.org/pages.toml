["https://www.json.org/json-sr.html"]
title = "JSON"
full_description = "JSON (JavaScript Object Notation) је лаган формат за размену података. Он је лак како за људе да га читају и пишу, тако и за рачунаре да га анализирају и генеришу. Заснива се на подскупу JavaScript Programming Language, Standard ECMA-262 3rd Edition - December 1999. JSON је текст формат који је потпуно независан од језика, али користи конвенције које су познате програмерима на C-породици језика, укључујући C, C++, C#, Java, JavaScript, Perl, Python и многе друге. Ове особине чине JSON идеалним језиком за размену података. То су универзалне структуре података, подржане од стране практично свих модерних програмских језика у једном или другом облику. Има смисла да је формат података који се заменљив са програмским језицима такође заснован на овим структурама. Објекат је несређени скуп име / вредност парova. Објекат почиње са {левa витичастa заграда и завршава се са }деснa витичастa заграда. Свако име следи :двотачка. Име / вредност парови су раздвојени са ,зарез. Низ је уређена колекција вредности. Низ почиње са [лева угласта заграда а завршава се са ]десна угласта заграда. Вредности су раздвојене са ,зарез. Вредност може бити ниска у наводницима, или број или true или false или null или објекат или низ. Те структуре могу бити угњеждене."
