["https://www.json.org/json-cz.html"]
title = "JSON"
full_description = "JSON (JavaScript Object Notation) je odlehčený formát pro výměnu dat. Je jednoduše čitelný i zapisovatelný člověkem a snadno analyzovatelný i generovatelný strojově. Je založen na podmnožině Programovacího jazyka JavaScript, Standard ECMA-262 3rd Edition - December 1999. JSON je textový, na jazyce zcela nezávislý formát, využívající však konvence dobře známé programátorům jazyků rodiny C (C, C++, C#, Java, JavaScript, Perl, Python a dalších). Díky tomu je JSON pro výměnu dat opravdu ideálním jazykem. Jedná se o univerzální datové struktury a v podstatě všechny moderní programovací jazyky je v nějaké formě podporují. Je tedy logické, aby na nich byl založen i na jazyce nezávislý výměnný formát. Objekt je neuspořádaná množina párů název/hodnota. Objekt je uvozen znakem {levá složená závorka a zakončen znakem }pravá složená závorka. Každý název je následován znakem :dvojtečka a páry název/hodnota jsou pak odděleny znakem ,čárka. Pole je seřazenou kolekcí hodnot. Začíná znakem [levá hranatá závorka and končí znakem ]pravá hranatá závorka. Hodnoty jsou odděleny znakem ,čárka. Hodnotou rozumíme řetezec uzavřený do dvojitých uvozovek, číslo, true, false, null, objekt nebo pole. Tyto struktury mohou být vnořovány. Řetězcem je nula nebo více znaků kódování Unicode, uzavřených do dvojitých uvozovek a využívající únikových sekvencí (escape sequence) s použitím zpětného lomítka. Znak je reprezentován jako řetězec s jediným znakem. Řetězec je velmi podobný řetězcům z jazyků C nebo Java. Číslo je podobné číslům z jazyků C a Java. Jedinou výjimkou je, že není používán oktalový ani hexadecimální zápis. Mezi jednotlivé syntakční znaky a hodnoty lze vkládat bílé znaky (whitespace). Až na pár výjimek týkajících se kódování je tímto jazyk kompletně popsán."
