full_description = "Changelog A detailed overview of the changes of every release of https://jsoneditoronline.org. Releases 2025-02-14, version 7.7.0 Feat: pasting in via the context menu in tree and table mode is now supported. Feat: improved jsonrepair, now repairing fenced Markdown code blocks. 2025-01-29, version 7.6.0 Feat: implemented new hash parameters left_mode, right_mode, panels, and compare, allowing to control the mode and visibility of the panels when loading documents via the left and right hash parameters. See docs: https://jsoneditoronline.org/docs/#url. Updated dependencies. 2025-01-17, version 7.5.3 Fix local legacy documents not being migrated when the migration has been executed once before. 2024-12-05, version 7.5.2 Fix modals closing when the mouse ends outside the modal after selecting text. 2024-12-03, version 7.5.1 Fix JSON schema validation not working anymore. Regression introduced in v7.4.0. 2024-12-03, version 7.5.0 Update to @jsonquerylang/jsonquery@4.1.1, containing new functions reverse, mapObject, mapKeys, mapValues, join, split, substring, number, and string. 2024-11-27, version 7.4.0 Update dependencies, most notably jsonrepair and svelte-jsoneditor. The latest version of svelte-jsoneditor now maintains history when switching mode. 2024-11-06, version 7.3.0 Update dependencies, most notably jsonrepair, svelte-jsoneditor v2, and react-tooltip v5. 2024-10-23, version 7.2.2 Fix the Escape key not working to exit full screen mode. Update dependencies. 2024-10-20, version 7.2.1 Update dependencies. Clarify highlighting colors when comparing two documents in the documentation. 2024-10-04, version 7.2.0 Allow removing public cloud documents from your files list via a new button “Forget document” in the Document Properties modal. Allow deleting your account and private documents via Account > Manage > Delete Account. 2024-09-30, version 7.1.1 Fix key not being rendered when the value does contain a search result and vice versa. 2024-09-27, version 7.1.0 Upgrade to svelte-jsoneditor@1.0.3, and upgrade all other dependencies. Implement support for two new query languages: JSON Query and JSONPath. JSON Query is the new default query language. Implement a hamburger menu on mobile screens. Small bug fixes. 2024-06-24, version 7.0.5 Optimize the web application cache. 2024-06-06, version 7.0.4 Fix find and replace not working well in Table mode. 2024-06-05, version 7.0.3 Fix Ctrl+Click (Cmd+Click) on urls not working on Mac. Update dependencies svelte-jsoneditor, jsonrepair, and ajv. 2024-05-15, version 7.0.2 Fix styling issues on older browsers. 2024-05-09, version 7.0.1 Fix “code” mode sometimes starting partly scrolled down in indepth articles. Fix non-empty last line of the CSV example in the article about converting JSON to CSV. Fix images on the indepth collection pages not lazy loading. Improve the structured data on the web pages (for search engines). Update dependencies svelte-jsoneditor, jsonrepair, and update dev dependencies. 2024-04-26, version 7.0.0 Migration of the web application and /indepth blog to AstroJS. Upgrade to jsonrepair@3.7.0, which improves repairing invalid numbers and regexes. 2024-04-11, version 6.17.6 Enable a new, “Ad-Free” only subscription plan which is cheaper than the “Developer” plan. Upgrade to svelte-jsoneditor@0.23.2, having some bug fixes. 2024-04-11, version 6.17.5 Upgrade to jsonrepair@3.6.1, which improves repairing truncated strings. 2024-04-02, version 6.17.4 Upgrade to fracturedjsonjs@4.0.0, ajv-formats@3.0.1, and @fortawesome version 6.5.2. 2024-03-13, version 6.17.3 Upgrade to svelte-jsoneditor@0.23.1 supporting fullscreen modals. 2024-03-13, version 6.17.2 Upgrade to svelte-jsoneditor@0.23.0, including search and replace for table mode and some bug fixes. 2024-02-28, version 6.17.1 Fix missing support for JSON Schema version draft-07. 2024-02-27, version 6.17.0 Improved number formatting when using “Smart Format”, upgraded to fracturedjsonjs@3.1.1. Sync public cloud document ids when signed in. 2024-02-20, version 6.16.0 New Smart Formatting option in text mode, powered by FracturedJson. This will format the JSON document in a relatively compact way that it is easy to read. 2024-02-15, version 6.15.2 Fixes dropdown menus not working on Safari. 2024-02-05, version 6.15.1 Fixes in svelte-jsoneditor: TransformModal could mutate the original data. Update to the latest version of classnames, immutable-json-patch, jsonrepair, lossless-json. 2024-01-30, version 6.15.0 Implemented a login and subscription, offering an alternative to ads, and coming with more extras. 2023-12-06, version 6.14.0 You can now access both editors in the Developer Console via editorLeft and editorRight, and use the following JSON utility libraries in the Developer Console: lodash, jsonrepair, Ajv, jmespath, and patch. Implement a new feature “Copy escaped” in the “Copy” menu. This will copy the JSON document with escaped quotes, so you can directly paste it inside a string. Make the actions panel between the two editors better responsive on a small screen and rotate the icons. Fix a styling issue with the background color of the overlay displaying a load error in dark mode. Update dependencies svelte-jsoneditor, codemirror, fontawesome, and others. 2023-11-21, version 6.13.16 Update dependency svelte-jsoneditor, fixing a font issue in table mode. 2023-11-13, version 6.13.15 Update dependencies: svelte-jsoneditor, jsonrepair, lossless-json containing bugfixes. 2023-10-17, version 6.13.14 Fix leave page confirmation not working on Chrome (displayed when there are unsaved changes). 2023-10-17, version 6.13.13 Allow storing local documents up to 100 MB (instead of 1 MB) Ask a confirmation when leaving the page or opening a new document when there are unsaved changes. In the sort and transform modals, rename “whole document” to “document root” to prevent confusion. 2023-10-10, version 6.13.12 Largely drop Google Analytics. 2023-10-02, version 6.13.11 Fix a regression in svelte-jsoneditor introduced in v6.13.10 not allowing to put the cursor halfway the value when editing a value. 2023-09-28, version 6.13.10 Update dependencies: svelte-jsoneditor, fixing not being able to paste in the input field of the search box. 2023-09-27, version 6.13.9 Update dependencies: svelte-jsoneditor and jsonrepair with fixes and improvements. 2023-09-12, version 6.13.8 Switched to the /v2 backend to store documents in the cloud. Fix showing a success or error message after saving a document. Improve loading error overlay background, making the message easier to read. Update dependencies: csv42, lossless-json, @fontawesome, and diff-sequences. 2023-06-28, version 6.13.7 Fix: when loading the application, it would sometimes load a previously closed document instead of an empty document. 2023-06-21, version 6.13.6 Allow the user to enable diffing for large documents. Performance improvements in transforms and diffing. Fixed navigating through differences not always expanding collapsed sections of an array. Updated dependencies. 2023-06-12, version 6.13.5 Implement support for JSON Schema version Draft 2020-12. Some fixes in using a JSON Schema from the left or right panel. Upgraded all dependencies like svelte-jsoneditor, containing small bugfixes. 2023-05-05, version 6.13.4 JSON Repair will now repair truncated numbers. The lossless JSON parser now throws an error when an object value is missing. 2023-04-17, version 6.13.3 A bugfix in JSON Repair. Update dependencies. 2023-03-28, version 6.13.2 Fixed a bug sometimes opening an empty file when loading a file from disk. Upgraded to svelte-jsoneditor@0.16.1, changing the row numbering in table mode to zero based. Faster /indepth blog 2023-03-22, version 6.13.1 Fix buttons “Copy formatted”, “Copy Compacted”, and “Copy as-is” not working. Regression since v6.13.0. Fix transform buttons between the panels not working. 2023-03-17, version 6.13.0 Implemented support for CSV import, and extended the CSV export options. 2023-03-16, version 6.12.7 Improved detection of columns in table mode. The JSON parser no longer throws a duplicate key exception when both values are the same. 2023-02-27, version 6.12.6 Fix table mode sometimes not rendering Implement a new option “Edit row” in the context menu of table mode. Set focus to the left panel, so you can directly start editing or pasting something. 2023-02-22, version 6.12.5 Upgraded to svelte-jsoneditor@0.14.9 containing some fixes and improvements: Transform modal: fixed JMESPath queries not working when operating on numbers. Transform modal: changed the Lodash queries to a chained operation. Added indentation markers in text mode. 2023-02-15, version 6.12.4 Fixed a formatting issue with empty objects and arrays, spreading them over multiple lines. Styling fixes in the Transform modal for dark theme. Minor bug fixes. 2023-02-03, version 6.12.3 Upgrade to svelte-jsoneditor@0.14.4 with some bug fixes and minor improvements. The editor now proposes to format the data when you load compact JSON. 2023-01-30, version 6.12.2 Fix clicking the sections “About”, “FAQ”, and “News” in the “Help” menu not working reliably and not being represented in the url. 2023-01-27, version 6.12.1 Fix diff error tooltip not always visible. Fix creating a new object or array by typing { or ] being broken (regression since v6.12.0). 2023-01-26, version 6.12.0 Improvements in table mode (svelte-jsoneditor@0.14.2): You can now duplicate, insert, or remove rows. Column names stay in the same order when sorting by column. Improved detection of columns in case of inhomogeneous data. A number of bugfixes. 2023-01-21, version 6.11.0 Display the editors in full-screen. 2023-01-20, version 6.10.7 Improved color highlighting when comparing documents in dark mode. Improved cursor styling. Some more minor tweaks and bug fixes. 2023-01-18, version 6.10.6 Upgrade dependencies, most notably svelte-jsoneditor@0.12.0, fixing a bug with JSON Schema enums and some other small bugs. Smaller bundle size, speeding up the web application a bit. 2023-01-07, version 6.10.5 Upgrade dependencies, most notably svelte-jsoneditor@0.11.8 and lossless-json@2.0.5, fixing a bug with unicode characters. 2022-12-20, version 6.10.4 Upgrade dependencies, most notably svelte-jsoneditor@0.11.5, lossless-json@2.0.4, and jsonrepair@3.0.1 coming with improved performance. 2022-12-15, version 6.10.3 Fix a bug in calculating differences with numbers, breaking scrolling to the difference and highlighting it. Regression since 6.8.0. 2022-12-14, version 6.10.2 Upgrade to the latest svelte-jsoneditor@0.11.4, fixing a bug that caused the highlighting of differences in both panels not to work. This regression was introduced in v6.10.0. 2022-12-13, version 6.10.1 Upgrade to the latest svelte-jsoneditor@0.11.3 with a bug fix for table mode. 2022-12-07, version 6.10.0 Upgrade to the latest svelte-jsoneditor@0.11.1 with a new table mode, displaying JSON data in a grid. Fix Differences not marking properties with value null as created or deleted. 2022-11-30, version 6.9.7 Fix JSON Schema being broken since v6.9.4. 2022-11-28, version 6.9.6 Fix main menu buttons sometimes only half visible after saving a new document. Replace the outdated tooltip library with a new one. 2022-11-18, version 6.9.5 Upgrade to the latest svelte-jsoneditor@0.10.2 with some minor bug fixes. Upgrade to the latest lossless-json@2.0.2, fixing an issue with duplicate keys. 2022-11-10, version 6.9.4 Upgrade to the latest svelte-jsoneditor, most notably fixing selected text not being visible in text mode when in dark mode. 2022-10-21, version 6.9.3 Fix the application not fully working offline. 2022-10-18, version 6.9.2 Upgrade to the latest svelte-jsoneditor, containing some bug fixes. 2022-10-14, version 6.9.1 Upgrade to the latest svelte-jsoneditor with editable navigation bar. Disabled changing the page title according to the opened documents. Upgrade ad scripts to make the web application faster. 2022-10-10, version 6.9.0 The theme colors are changed from green+brown to two more calm green colors. The theme colors are customizable: select from green, blue, or red. 2022-09-30, version 6.8.1 Detect duplicate keys. 2022-09-30, version 6.8.0 All configuration options are now collected in a new Configuration modal. The editor can now handle large numbers and keep formatting of numbers thanks to the integrated lossless-json parser. 2022-09-28, version 6.7.2 But fix related to escaping double quotes and unicode characters of control characters. 2022-09-22, version 6.7.1 Bug fix in the JSON Schema modal making the tabs crash the first time you try to open them. Regression since v6.6.4. 2022-09-12, version 6.7.0 Upgrade to the latest version of svelte-jsoneditor, containing some bug fixes. 2022-09-12, version 6.6.5 Fix a bug loading documents from disk being unreliable: sometimes not working on slow machines, mostly when using large documents. 2022-09-10, version 6.6.4 Improve loading time of the web application. 2022-09-05, version 6.6.3 Fix directly saving a new empty document without changes after opening it. Regression since v6.6.2 2022-09-01, version 6.6.2 Upgraded to the latest version of all dependencies, most notably svelte-jsoneditor with a minor fix. 2022-08-29, version 6.6.1 Upgrade to the latest version of svelte-jsoneditor, containing some bug fixes related to mobile devices. 2022-08-29, version 6.6.0 The JSON Editor Online application is now mobile-friendly, you can enjoy it on smaller screens and touch devices too! 2022-07-19, version 6.5.0 Implement support for opening urls via a proxy to work around limitations with CORS and unsecure urls. 2022-07-08, version 6.4.0 Upgrade to the latest version of svelte-jsoneditor, containing bug fixes and an internal refactor. Disable page scroll until you click one of the buttons About, FAQ, or News from the main menu. 2022-07-04, version 6.3.4 Show a warning message when using an unsecured (http) url. Please use the secured url instead: https://jsoneditoronline.org. In the future, the unsecured url will be deprecated. To migrate any documents from the unsecured to the secured environment: open the documents in the unsecured environment, save them to disk, open the secured environment, and load the documents there from disk. Updated dependencies. 2022-06-24, version 6.3.3 Added a Donate button. 2022-06-13, version 6.3.2 Fix error toast messages being unreadable due to almost white background (#97). 2022-06-08, version 6.3.1 Support tabs for indentation. 2022-06-07, version 6.3.0 Export JSON to CSV. Some minor styling tweaks. 2022-05-31, version 6.2.0 Update to svelte-jsoneditor@0.3.58, adding a status bar in code mode showing information about the cursor location and selected contents, and some styling tweaks. 2022-05-30, version 6.1.3 Update to svelte-jsoneditor@0.3.55, fixing the editor losing the expanded state when copying contents from one panel to the other. 2022-05-23, version 6.1.2 U"
