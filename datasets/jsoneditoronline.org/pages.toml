 c){let s=r.closest(this.tagName);s!=null&&s.isSameNode(this)&&(n[r.getAttribute("name")||"default"]=r.innerHTML)}let p;try{p=this.hasAttribute("props")?m(JSON.parse(this.getAttribute("props"))):{}}catch(r){let s=this.getAttribute("component-url")||"<unknown>",v=this.getAttribute("component-export");throw v&&(s+=` (export ${v})`),console.error(`[hydrate] Error parsing props for component ${s}`,this.getAttribute("props"),r),r}let u;await this.hydrator(this)(this.Component,p,n,{client:this.getAttribute("client")}),this.removeAttribute("ssr"),this.dispatchEvent(new CustomEvent("astro:hydrate"))});d(this,"unmount",()=>{this.isConnected||this.dispatchEvent(new CustomEvent("astro:unmount"))})}disconnectedCallback(){document.removeEventListener("astro:after-swap",this.unmount),document.addEventListener("astro:after-swap",this.unmount,{once:!0})}connectedCallback(){if(!this.hasAttribute("await-children")||document.readyState==="interactive"||document.readyState==="complete")this.childrenConnectedCallback();else{let e=()=>{document.removeEventListener("DOMContentLoaded",e),c.disconnect(),this.childrenConnectedCallback()},c=new MutationObserver(()=>{var n;((n=this.lastChild)==null?void 0:n.nodeType)===Node.COMMENT_NODE&&this.lastChild.nodeValue==="astro:end"&&(this.lastChild.remove(),e())});c.observe(this,{childList:!0}),document.addEventListener("DOMContentLoaded",e)}}async childrenConnectedCallback(){let e=this.getAttribute("before-hydration-url");e&&await import(e),this.start()}async start(){let e=JSON.parse(this.getAttribute("opts")),c=this.getAttribute("client");if(Astro[c]===void 0){window.addEventListener(`astro:${c}`,()=>this.start(),{once:!0});return}try{await Astro[c](async()=>{let n=this.getAttribute("renderer-url"),[h,{default:p}]=await Promise.all([import(this.getAttribute("component-url")),n?import(n):()=>()=>{}]),u=this.getAttribute("component-export")||"default";if(!u.includes("."))this.Component=h[u];else{this.Component=h;for(let f of u.split("."))this.Component=this.Component[f]}return this.hydrator=p,this.hydrate},e,this)}catch(n){console.error(`[astro-island] Error hydrating ${this.getAttribute("component-url")}`,n)}}attributeChangedCallback(){this.hydrate()}}d(y,"observedAttributes",["props"]),customElements.get("astro-island")||customElements.define("astro-island",y)}})(); Copy Edit in JSON Editor Online loading... A JSON array with objects The following example shows an array or a list with objects: Copy Edit in JSON Editor Online loading... Each of the objects has three properties and is the same as the object in the previous example. It looks different, but that is only because all properties are formatted on the same line. In JSON, you can add whitespaces and newlines between keys and values as you like, they do not change the meaning of the data. A nested JSON example JSON Objects and arrays can contain nested objects and arrays. You can have multiple nesting levels. This is explained in detail in the article “What is JSON? Learn all about JSON in 5 minutes”. In the following example you see a JSON object containing a list with friends. Each friend is an object, and this object again contains a nested array with the friend’s hobbies. Copy Edit in JSON Editor Online loading... A JSON example with a date The JSON data format does not support a date type. There are different ways to have a date in a JSON document. The most common one is to represent the date as a human-readable string, using the ISO Date format (In JavaScript you can try new Date().toISOString()): Copy Edit in JSON Editor Online loading... A JSON example with colors Like dates, JSON does not have a data type. You can put an HTML color or hex color code a string: Copy Edit in JSON Editor Online loading... A large JSON document For development purposes, it can be handy to have a large JSON document around to test performance for example. You can download one of the following auto-generated JSON documents (after downloading, you can open them in JSON Editor Online to inspect them): Download 100 users (30.4 KB)Download 1k users (303.8 KB)Download 10k users (3 MB)Download 100k users (29.7 MB)Download 1m users (296.6 MB)Download 1.7m users (504.3 MB) Preview with 10 users: Copy Edit in JSON Editor Online loading... A GeoJSON example Physical locations on earth are described with two coordinates: a longitude and a latitude. The longitude (horizontal) is zero degrees at Greenwich, and varies from -180 degrees West to 180 degrees East. The latitude (vertical) is 0 degrees at the equator, and varies from -90 degrees on the South pool to 90 degrees on the North pool. There is no standard way to model a GEO location in JSON. You may see an object like { "lat": 51.908, "lon": 4.485 } or { "lat": 51.908, "lng": 4.485 } or { "latitude": 51.908, "longitude": 4.485 }. Or you may see an array with two values: [ 4.485, 51.908 ] or [ 51.908, 4.485 ]. Which of the two values in the array is the latitude and which is the longitude differs for different applications, so be careful. Using the GeoJSON standard, you can describe points, lines, and polygons. These shapes can be rendered on a map. Here is an example: Copy Edit in JSON Editor Online loading... A JSON Schema example JSON Schema is a JSON based language to describe a data structure. You can read all about it in the article “JSON Schema validator: a powerful way to check JSON data”. The following example from this article describes a data structure that is an array with objects, each object having a required property name and age, and an optional property email. JSON Schema loading... JSON Full screen loading... The JSON document is valid according to the JSON Schema A YouTube JSON example You may be thinking “all these examples are nice, but they are made up. How does real JSON from real API’s look like?”. Let us have a look at the YouTube API. We can search for YouTube videos using an HTTP GET request. Let us search for videos about “football”. If we only provide the query parameter q, we will get a list with video id’s. To also receive the title and description of the videos, we add the query parameter part=snippet: GET https://www.googleapis.com/youtube/v3/search?q=football&part=snippet Note that you’ll have to provide a valid Authentication header in the HTTP GET request from the server. This is explained in the documentation of the YouTube API, where you can also try this out on the fly. The response is as follows. It is quite deeply nested, but basically it contains some generic information the first page of a list with videos. Each video contains an object with details like the id, but also the title, description, and channel information. Copy Edit in JSON Editor Online loading... More JSON datasets Here some links to more JSON datasets and resources: A curated list of awesome JSON Datasets like: climate, crime, food, gaming, government, population, movies, etc. Public datasets from the US government, such as population, diseases, demographic statistics, air quality, popular baby names, etc. City Lots of San Francisco a large document of 189.9 MB. JSON Generator a web application that to generate JSON data based on a template. DummyJSON a public API to get dummy/fake JSON data to use as placeholder in development or in prototype testing. Contents A JSON object A JSON array with objects A nested JSON example A JSON example with a date A JSON example with colors A large JSON document A GeoJSON example A JSON Schema example A YouTube JSON example More JSON datasets Recent posts Happy New Year to all of you! JSON Query: a small, flexible, and expandable JSON query language Tabular-JSON: Combining the best of JSON and CSV Smart JSON Formatting Ad-free JSON Editor Online experience Categories Beautify Compare Convert Data-fetching Datasets Other Parse Query Specification Tools Validate About About: Jos de Jong About: Indepth articles'
