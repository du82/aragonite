full_description = 'Is JSON valid? Validate JSON online Jun 12, 2023 | 4 min read Is JSON valid? Why is JSON invalid? How do you check if JSON is valid or not? You may get a vague, indirect errors if there is something wrong with your JSON data. If your JSON document does not contain indentation, it can be hard to spot the cause of the issue. In this article you will learn how you can validate JSON data, learn how it works, and learn what tools you can use for this. Validate JSON online Use this free JSON validator to check whether the syntax of your JSON is valid: astro-island,astro-slot,astro-static-slot{display:contents}(()=>{var e=async t=>{await(await t())()};(self.Astro||(self.Astro={})).load=e;window.dispatchEvent(new Event("astro:load"));})();;(()=>{var A=Object.defineProperty;var g=(i,o,a)=>o in i?A(i,o,{enumerable:!0,configurable:!0,writable:!0,value:a}):i[o]=a;var d=(i,o,a)=>g(i,typeof o!="symbol"?o+"":o,a);{let i={0:t=>m(t),1:t=>a(t),2:t=>new RegExp(t),3:t=>new Date(t),4:t=>new Map(a(t)),5:t=>new Set(a(t)),6:t=>BigInt(t),7:t=>new URL(t),8:t=>new Uint8Array(t),9:t=>new Uint16Array(t),10:t=>new Uint32Array(t),11:t=>1/0*t},o=t=>{let[l,e]=t;return l in i?i[l](e):void 0},a=t=>t.map(o),m=t=>typeof t!="object"||t===null?t:Object.fromEntries(Object.entries(t).map(([l,e])=>[l,o(e)]));class y extends HTMLElement{constructor(){super(...arguments);d(this,"Component");d(this,"hydrator");d(this,"hydrate",async()=>{var b;if(!this.hydrator||!this.isConnected)return;let e=(b=this.parentElement)==null?void 0:b.closest("astro-island[ssr]");if(e){e.addEventListener("astro:hydrate",this.hydrate,{once:!0});return}let c=this.querySelectorAll("astro-slot"),n={},h=this.querySelectorAll("template[data-astro-template]");for(let r of h){let s=r.closest(this.tagName);s!=null&&s.isSameNode(this)&&(n[r.getAttribute("data-astro-template")||"default"]=r.innerHTML,r.remove())}for(let r of c){let s=r.closest(this.tagName);s!=null&&s.isSameNode(this)&&(n[r.getAttribute("name")||"default"]=r.innerHTML)}let p;try{p=this.hasAttribute("props")?m(JSON.parse(this.getAttribute("props"))):{}}catch(r){let s=this.getAttribute("component-url")||"<unknown>",v=this.getAttribute("component-export");throw v&&(s+=` (export ${v})`),console.error(`[hydrate] Error parsing props for component ${s}`,this.getAttribute("props"),r),r}let u;await this.hydrator(this)(this.Component,p,n,{client:this.getAttribute("client")}),this.removeAttribute("ssr"),this.dispatchEvent(new CustomEvent("astro:hydrate"))});d(this,"unmount",()=>{this.isConnected||this.dispatchEvent(new CustomEvent("astro:unmount"))})}disconnectedCallback(){document.removeEventListener("astro:after-swap",this.unmount),document.addEventListener("astro:after-swap",this.unmount,{once:!0})}connectedCallback(){if(!this.hasAttribute("await-children")||document.readyState==="interactive"||document.readyState==="complete")this.childrenConnectedCallback();else{let e=()=>{document.removeEventListener("DOMContentLoaded",e),c.disconnect(),this.childrenConnectedCallback()},c=new MutationObserver(()=>{var n;((n=this.lastChild)==null?void 0:n.nodeType)===Node.COMMENT_NODE&&this.lastChild.nodeValue==="astro:end"&&(this.lastChild.remove(),e())});c.observe(this,{childList:!0}),document.addEventListener("DOMContentLoaded",e)}}async childrenConnectedCallback(){let e=this.getAttribute("before-hydration-url");e&&await import(e),this.start()}async start(){let e=JSON.parse(this.getAttribute("opts")),c=this.getAttribute("client");if(Astro[c]===void 0){window.addEventListener(`astro:${c}`,()=>this.start(),{once:!0});return}try{await Astro[c](async()=>{let n=this.getAttribute("renderer-url"),[h,{default:p}]=await Promise.all([import(this.getAttribute("component-url")),n?import(n):()=>()=>{}]),u=this.getAttribute("component-export")||"default";if(!u.includes("."))this.Component=h[u];else{this.Component=h;for(let f of u.split("."))this.Component=this.Component[f]}return this.hydrator=p,this.hydrate},e,this)}catch(n){console.error(`[astro-island] Error hydrating ${this.getAttribute("component-url")}`,n)}}attributeChangedCallback(){this.hydrate()}}d(y,"observedAttributes",["props"]),customElements.get("astro-island")||customElements.define("astro-island",y)}})(); Copy Edit in JSON Editor Online loading... Validating JSON syntax or structure There are two levels on which you can validate your JSON documents: Validate the syntax of a JSON document Validate the structure of a JSON document against a schema In general, these two categories are both called “validating JSON”, which can be confusing. We’ll clarify them here. Validate JSON syntax Validating the syntax makes sure the JSON document contains valid JSON and can be parsed. For example, forgetting a comma between two items in an array makes the JSON invalid. Trying to parse the document will result in a syntax error. For example the following document is invalid because it misses a comma between the first and the second key-value pair: { "name": "Joe" "age": 42 } Sometimes, the error is easy to spot, but in larger documents that are not formatted it can be hard to debug what is wrong. Also, some errors are hard to spot by the eye, like having a curly double quote character instead of a straight one: { “Name”: “Joe”, “age”: 42 } Typical causes of invalid JSON include copying JSON from a Word document, dealing with a JSON dialect like JSON5, and having a truncated JSON due to some text size limit. Another common case is having a JavaScript object: JSON is valid JavaScript, but JavaScript is not always valid JSON, since for example the quotes for object keys are optional in JavaScript but required in JSON. All common issues and solutions are described in the article “How to fix JSON and validate it with ease”. Validate JSON structure Besides syntax errors, it can be that you want to verify whether the contents of a document is according to a specific data structure or a “schema”. For example, given the following document: { "name": "Joe", "age": 42 } How can you make sure the document is an object having properties “name” and “age”, where “name” is a string, and “age” is an integer number? How can you validate the structure? This can be done using a validation library. One proven solution is to use JSON Schema, a language to describe the structure of a JSON document. The JSON Schema for the example at hand can look like: { "type": "object", "properties": { "name": { "type": "string" }, "age": { "type": "integer" } }, "required": ["name", "age"] } The article “JSON Schema validator: a powerful way to check JSON data” explains in detail what JSON Schema is and how and when to use it. When to validate JSON? You may need to manually validate a JSON document when you’re debugging an issue in your code as a developer. In such a case you can use online tools like JSON Editor Online. When you need to programmatically validate JSON, this is normally best to do “at the gate”: when the data enters your application. For example when fetching data in a web application, or receiving JSON in a backend server via a REST API. Best is to directly check the data, so you don’t have to reckon with potentially invalid data in the application itself. Is Json Valid conclusion So, what makes a JSON valid? We have learned that we can look at two things. The first is validating the syntax of a JSON document, like missing quotes or commas. The second is validating the structure of a JSON document, such as verifying that the document is an object containing properties like “name” and “age”. Validation of these two categories requires different tools. Validating JSON syntax requires a strict JSON parser with helpful error messages, else debugging an issue can be difficult. A tool like JSON Editor Online (and the inline editor in this article) can help repair syntax errors automatically. Validating JSON structure requires a validation library, such as Ajv with JSON Schema. Contents Validate JSON online Validating JSON syntax or structure Validat