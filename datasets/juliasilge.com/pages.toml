full_description = "Positron in action with #TidyTuesday orca encounters By Julia Silge in rstats October 14, 2024 This is my first screencast in quite a while! I’ve been busy working on Positron a new, next-generation data science IDE, and I’m excited to share a little first look at it with you today. Positron is currently in public beta and there is still a lot of work to get it ready for everyone to use, but in this screencast, I give you a first look at what data analysis with Positron will look like, using this week’s #TidyTuesday dataset on orca encounters in the Salish Sea. Huge thanks to Jadey Ryan for her work on this package! We know Positron still has some rough edges, but if you are interested in experimenting with it, I invite you to download the most recent beta release and share your feedback with us. Posted on: October 14, 2024 Length: 1 minute read, 132 words Categories: rstats Tags: rstats See Also: Educational attainment in #TidyTuesday UK towns Changes in #TidyTuesday US polling places Empirical Bayes for #TidyTuesday Doctor Who episodes Educational attainment in #TidyTuesday UK towns →"
