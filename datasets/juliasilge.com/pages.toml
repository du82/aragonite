external-references = ["bsky.app", "docs.posit.co", "en.wikipedia.org", "fosstodon.org", "github.com", "gohugo.io", "jasonpunyon.com", "ko-fi.com", "linkedin.com", "netlify.com", "orcid.org", "posit.co", "scholar.google.com", "smltar.com", "stackoverflow.com", "tidytextmining.com", "tmwr.org", "varianceexplained.org", "vetiver.posit.co", "youtube.com"]

["https://juliasilge.com/blog/baseball-racing"]
title = "Use racing methods to tune xgboost models and predict home runs | Julia Silge"
description = "A data science blog"
full_description = 'Use racing methods to tune xgboost models and predict home runs By Julia Silge in rstats tidymodels July 29, 2021 This is the latest in my series of screencasts demonstrating how to use the tidymodels packages, from just getting started to tuning more complex models. This week’s episode of SLICED, a competitive data science streaming show, had contestants compete to predict home runs in recent baseball games. Honestly I don’t know much about baseball ⚾ but the finetune package had a recent release and this challenge offers a good opportunity to show how to use racing methods for tuning. Here is the code I used in the video, for those who prefer reading instead of or in addition to video. Explore data Our modeling goal is to predict whether a batter’s hit results in a home run given features about the hit. The main data set provided is in a CSV file called training.csv. library(tidyverse) train_raw <- read_csv("train.csv") You can watch this week’s full episode of SLICED to see lots of exploratory data analysis and visualization of this dataset, but let’s just make a few plots to understand it better. How are home runs distributed in the physical space around home plate? train_raw %>% ggplot(aes(plate_x, plate_z, z = is_home_run)) + stat_summary_hex(alpha = 0.8, bins = 10) + scale_fill_viridis_c(labels = percent) + labs(fill = "% home runs") How do launch speed and angle of the ball leaving the bat affect home run percentage? train_raw %>% ggplot(aes(launch_angle, launch_speed, z = is_home_run)) + stat_summary_hex(alpha = 0.8, bins = 15) + scale_fill_viridis_c(labels = percent) + labs(fill = "% home runs") How does pacing, like the number of balls, strikes, or the inning, affect home runs? train_raw %>% mutate(is_home_run = if_else(as.logical(is_home_run), "yes", "no")) %>% select(is_home_run, balls, strikes, inning) %>% pivot_longer(balls:inning) %>% mutate(name = fct_inorder(name)) %>% ggplot(aes(value, after_stat(density), fill = is_home_run)) + geom_histogram(alpha = 0.5, binwidth = 1, position = "identity") + facet_wrap(~name, scales = "free") + labs(fill = "Home run?") There is certainly lots more to discover, but let’s move on to modeling. Build a model Let’s start our modeling by setting up our “data budget.” I’m going to convert the 0s and 1s from the original dataset into a factor for classification modeling. library(tidymodels) set.seed(123) bb_split <- train_raw %>% mutate( is_home_run = if_else(as.logical(is_home_run), "HR", "no"), is_home_run = factor(is_home_run) ) %>% initial_split(strata = is_home_run) bb_train <- training(bb_split) bb_test <- testing(bb_split) set.seed(234) bb_folds <- vfold_cv(bb_train, strata = is_home_run) bb_folds ## # 10-fold cross-validation using stratification ## # A tibble: 10 × 2 ## splits id ## <list> <chr> ## 1 <split [31214/3469]> Fold01 ## 2 <split [31214/3469]> Fold02 ## 3 <split [31214/3469]> Fold03 ## 4 <split [31215/3468]> Fold04 ## 5 <split [31215/3468]> Fold05 ## 6 <split [31215/3468]> Fold06 ## 7 <split [31215/3468]> Fold07 ## 8 <split [31215/3468]> Fold08 ## 9 <split [31215/3468]> Fold09 ## 10 <split [31215/3468]> Fold10 For feature engineering, let’s concentrate on the variables we already explored during EDA along with info about the pitch and handedness of players. There is some missing data, especially in the launch_angle and launch_speed, so let’s impute those values. bb_rec <- recipe(is_home_run ~ launch_angle + launch_speed + plate_x + plate_z + bb_type + bearing + pitch_mph + is_pitcher_lefty + is_batter_lefty + inning + balls + strikes + game_date, data = bb_train ) %>% step_date(game_date, features = c("week"), keep_original_cols = FALSE) %>% step_unknown(all_nominal_predictors()) %>% step_dummy(all_nominal_predictors(), one_hot = TRUE) %>% step_impute_median(all_numeric_predictors(), -launch_angle, -launch_speed) %>% step_impute_linear(launch_angle, launch_speed, impute_with = imp_vars(plate_x, plate_z, pitch_mph) ) %>% step_nzv(all_predictors()) ## we can `prep()` just to check that it works prep(bb_rec) ## Data Recipe ## ## Inputs: ## ## role #variables ## outcome 1 ## predictor 13 ## ## Training data contained 34683 data points and 15255 incomplete rows. ## ## Operations: ## ## Date features from game_date [trained] ## Unknown factor level assignment for bb_type, bearing [trained] ## Dummy variables from bb_type, bearing [trained] ## Median Imputation for plate_x, plate_z, pitch_mph, ... [trained] ## Linear regression imputation for launch_angle, launch_speed [trained] ## Sparse, unbalanced variable filter removed bb_type_unknown, bearing_unknown [trained] Now let’s create a tunable xgboost model specification. In a competition like SLICED, we likely wouldn’t want to tune all these parameters because of time constraints, but instead only some of the most important. xgb_spec <- boost_tree( trees = tune(), min_n = tune(), mtry = tune(), learn_rate = 0.01 ) %>% set_engine("xgboost") %>% set_mode("classification") xgb_wf <- workflow(bb_rec, xgb_spec) Use racing to tune xgboost Now we can use tune_race_anova() to eliminate parameter combinations that are not doing well. This particular SLICED episode was being evaluted on log loss. library(finetune) doParallel::registerDoParallel() set.seed(345) xgb_rs <- tune_race_anova( xgb_wf, resamples = bb_folds, grid = 15, metrics = metric_set(mn_log_loss), control = control_race(verbose_elim = TRUE) ) We can visualize how the possible parameter combinations we tried did during the “race.” Notice how we saved a TON of time by not evaluating the parameter combinations that were clearly doing poorly on all the resamples; we only kept going with the good parameter combinations. plot_race(xgb_rs) And we can look at the top results. show_best(xgb_rs) ## # A tibble: 1 × 9 ## mtry trees min_n .metric .estimator mean n std_err .config ## <int> <int> <int> <chr> <chr> <dbl> <int> <dbl> <chr> ## 1 6 1536 11 mn_log_lo… binary 0.0981 10 0.00171 Preprocessor1_Mo… Let’s use last_fit() to fit one final time to the training data and evaluate one final time on the testing data. xgb_last <- xgb_wf %>% finalize_workflow(select_best(xgb_rs, "mn_log_loss")) %>% last_fit(bb_split) xgb_last ## # Resampling results ## # Manual resampling ## # A tibble: 1 × 6 ## splits id .metrics .notes .predictions .workflow ## <list> <chr> <list> <list> <list> <list> ## 1 <split [34683… train/test… <tibble [2 … <tibble [0… <tibble [11,561… <workflo… We can collect the predictions on the testing set and do whatever we want, like create an ROC curve, or in this case compute log loss. collect_predictions(xgb_last) %>% mn_log_loss(is_home_run, .pred_HR) ## # A tibble: 1 × 3 ## .metric .estimator .estimate ## <chr> <chr> <dbl> ## 1 mn_log_loss binary 0.0975 This is pretty good for a single model; the competitors on SLICED who achieved better scores than this using this dataset all used ensemble models, I believe. We can also compute variable importance scores using the vip package. library(vip) extract_workflow(xgb_last) %>% extract_fit_parsnip() %>% vip(geom = "point", num_features = 15) Using racing methods is a great way to tune through lots of possible parameter options more quickly. Perhaps I’ll put it to the test next Tuesday, when I participate in the second and final episode of the SLICED playoffs! Posted on: July 29, 2021 Length: 5 minute read, 1058 words Categories: rstats tidymodels Tags: rstats tidymodels See Also: Positron in action with #TidyTuesday orca encounters Educational attainment in #TidyTuesday UK towns Changes in #TidyTuesday US polling places ← Tune xgboost models with early stopping to predict shelter animal status Predict which #TidyTuesday Scooby Doo monsters are REAL with a tuned decision tree model →'
year_published = 2021
clearnet = "https://juliasilge.com/blog/baseball-racing"
tags = ["#tidytuesday", "build", "data", "episode", "explore", "home", "let’s", "methods", "model", "models"]
language = "en"
internal-references = ["none"]
external-references = ["blog.apps.npr.org", "census.gov", "finetune.tidymodels.org", "geocompr.robinlovelace.net", "gohugo.io", "ironholds.org", "jasonpunyon.com", "kaggle.com", "ko-fi.com", "koalaverse.github.io", "nature.com", "notion.so", "orcid.org", "posit.co", "recipes.tidymodels.org", "scholar.google.com", "stackoverflow.com", "stats.stackexchange.com", "tidymodels.github.io", "vetiver.posit.co"]

["https://juliasilge.com/blog/map-challenge"]
title = "Spatial resampling for #TidyTuesday and the #30DayMapChallenge | Julia Silge"
description = "A data science blog"
full_description = 'Spatial resampling for #TidyTuesday and the #30DayMapChallenge By Julia Silge in rstats tidymodels November 5, 2021 This is the latest in my series of screencasts demonstrating how to use the tidymodels packages, from just getting started to tuning more complex models. Today’s screencast walks through how to use spatial resampling for evaluating a model, with this week’s #TidyTuesday dataset on geographic data. 🗾 Here is the code I used in the video, for those who prefer reading instead of or in addition to video. Explore data Geographic data is special when it comes to, well, basically everything! This includes modeling and especially evaluating models. This week’s #TidyTuesday is all about exploring spatial data for the #30DayMapChallenge this month, and especially the spData and spDataLarge packages along with the book Geocomputation with R. Let’s use the dataset of landslides (plus not-landslide locations) in Southern Ecuador. data("lsl", package = "spDataLarge") landslides <- as_tibble(lsl) landslides ## # A tibble: 350 × 8 ## x y lslpts slope cplan cprof elev log10_carea ## <dbl> <dbl> <fct> <dbl> <dbl> <dbl> <dbl> <dbl> ## 1 715078. 9558647. FALSE 37.4 0.0205 0.00866 2477. 2.61 ## 2 713748. 9558047. FALSE 41.7 -0.0241 0.00679 2486. 3.07 ## 3 712508. 9558887. FALSE 20.0 0.0390 0.0147 2142. 2.29 ## 4 713998. 9558187. FALSE 45.8 -0.00632 0.00435 2391. 3.83 ## 5 714308. 9557307. FALSE 41.7 0.0423 -0.0202 2570. 2.70 ## 6 713488. 9558117. FALSE 52.9 0.0323 0.00703 2418. 2.48 ## 7 714948. 9558347. FALSE 51.9 0.0399 0.000791 2546. 3.15 ## 8 714678. 9560357. FALSE 38.5 0.0164 0.0299 1932. 3.26 ## 9 714368. 9560287. FALSE 24.1 -0.0188 -0.00956 2059. 3.20 ## 10 712528. 9559217. FALSE 50.5 0.0142 0.0151 1973. 2.60 ## # … with 340 more rows How are these landslides (plus not landslides) distributes in this area? ggplot(landslides, aes(x, y)) + stat_summary_hex(aes(z = elev), alpha = 0.6, bins = 12) + geom_point(aes(color = lslpts), alpha = 0.7) + coord_fixed() + scale_fill_viridis_c() + scale_color_manual(values = c("gray90", "midnightblue")) + labs(fill = "Elevation", color = "Landslide?") Create spatial resamples In tidymodels, one of the first steps we recommend thinking about is “spending your data budget.” When it comes to geographic data, points close to each other are often similar so we don’t want to randomly resample our observations. Instead, we want to use a resampling strategy that accounts for that autocorrelation. Let’s create both resamples that are appropriate to spatial data and resamples that might work for “regular,” non-spatial data but are not a good fit for geographic data. library(tidymodels) library(spatialsample) set.seed(123) good_folds <- spatial_clustering_cv(landslides, coords = c("x", "y"), v = 5) good_folds ## # 5-fold spatial cross-validation ## # A tibble: 5 × 2 ## splits id ## <list> <chr> ## 1 <split [306/44]> Fold1 ## 2 <split [256/94]> Fold2 ## 3 <split [251/99]> Fold3 ## 4 <split [303/47]> Fold4 ## 5 <split [284/66]> Fold5 set.seed(234) bad_folds <- vfold_cv(landslides, v = 5, strata = lslpts) bad_folds ## # 5-fold cross-validation using stratification ## # A tibble: 5 × 2 ## splits id ## <list> <chr> ## 1 <split [280/70]> Fold1 ## 2 <split [280/70]> Fold2 ## 3 <split [280/70]> Fold3 ## 4 <split [280/70]> Fold4 ## 5 <split [280/70]> Fold5 The spatialsample package currently provides one method for spatial resampling and we are interested in hearing about what other methods we should support next. How do these resamples look? Let’s create a little helper function: plot_splits <- function(split) { p <- bind_rows( analysis(split) %>% mutate(analysis = "Analysis"), assessment(split) %>% mutate(analysis = "Assessment") ) %>% ggplot(aes(x, y, color = analysis)) + geom_point(size = 1.5, alpha = 0.8) + coord_fixed() + labs(color = NULL) print(p) } The spatial resampling creates resamples where observations close to each other are together. walk(good_folds$splits, plot_splits) The regular resampling doesn’t do this; it just randomly resamples all observations. walk(bad_folds$splits, plot_splits) This second option is not a good idea for geographic data. Fit and evaluate model Let’s create a straightforward logistic regression model to predict whether a location saw a landslide based on the other characteristics like slope, elevation, amount of water flow, etc. We can estimate how well this same model fits the data both with our regular folds and our special spatial resampling. glm_spec <- logistic_reg() lsl_form <- lslpts ~ slope + cplan + cprof + elev + log10_carea lsl_wf <- workflow(lsl_form, glm_spec) doParallel::registerDoParallel() set.seed(2021) regular_rs <- fit_resamples(lsl_wf, bad_folds) set.seed(2021) spatial_rs <- fit_resamples(lsl_wf, good_folds) How did our results turn out? collect_metrics(regular_rs) ## # A tibble: 2 × 6 ## .metric .estimator mean n std_err .config ## <chr> <chr> <dbl> <int> <dbl> <chr> ## 1 accuracy binary 0.737 5 0.0173 Preprocessor1_Model1 ## 2 roc_auc binary 0.808 5 0.0201 Preprocessor1_Model1 collect_metrics(spatial_rs) ## # A tibble: 2 × 6 ## .metric .estimator mean n std_err .config ## <chr> <chr> <dbl> <int> <dbl> <chr> ## 1 accuracy binary 0.677 5 0.0708 Preprocessor1_Model1 ## 2 roc_auc binary 0.782 5 0.00790 Preprocessor1_Model1 If we use the “regular” resampling, we get a more optimistc estimate of performance which would fool us into thinking our model would perform better than it really could. The lower performance estimate using spatial resampling is more accurate because of the autocorrelation of this geographic data; observations near each other are more alike than observations far apart. With geographic data, it’s important to use an appropriate model evaluation strategy! Posted on: November 5, 2021 Length: 5 minute read, 860 words Categories: rstats tidymodels Tags: rstats tidymodels See Also: Positron in action with #TidyTuesday orca encounters Educational attainment in #TidyTuesday UK towns Changes in #TidyTuesday US polling places ← Predicting viewership for #TidyTuesday Doctor Who episodes Predict #TidyTuesday giant pumpkin weights with workflowsets →'
year_published = 2021
clearnet = "https://juliasilge.com/blog/map-challenge"
tags = ["#30daymapchallenge", "#tidytuesday", "binary", "create", "data", "evaluate", "explore", "false", "geographic", "landslides"]
