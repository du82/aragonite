full_description = "Looking back on “Strangers Drowning” Overall, MacFarquhar was an extraordinarily careful and in-depth researcher and writer. But a couple of things feel strange to me about the chapter. Book review: The Origins of You The dual-risk hypothesis: an underlying vulnerability puts one at risk of developing a problem, but only when a particular stress is experienced. Book review: Don’t Shoot the Dog The author started off as a dolphin trainer at an aquarium park in the 1960s and moved on to horses, dogs, and her own children. Book review: The Anthropology of Childhood I read David Lancy’s “The Anthropology of Childhood: Cherubs, Chattel, and Changelings” and highlighted some passages. A lot of passages, it turns out."
