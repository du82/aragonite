full_description = "Ways to inculcate Patriotism in Kids Patriotism is not only a word but a feeling, when I come across reminds me of nostalgia and takes me back to my school days. Back then, I used to participate in several school functions and inter-school competitions based on the theme of patriotism. The salute to the Tricolor during flag hoisting, the National Anthem […] Read More. Improving Oral Communication Skills Communication is the process of expressing or exchanging our ideas, opinions and perspectives using disparate means like written, oral, use of signs and symbols, pictures etc. If we think of most favored communication style among these, we would choose written and oral style of communication. It has been often observed that maximum people are congenial […] Read More. Enhance Culturally Relevant Teaching Culture implies to the cumulative deposit of ideas, customs, knowledge, experience and social behaviors of a particular person or society as a whole. We all are born and brought up enveloped in a culture which serves as a foundation of our identity. It shapes our attitude, behavior, perception and personality thus, showcasing the ways of […] Read More. Developing Social and Emotional Learning among students Sensible handling of Anger or Annoyance, Formulating close bonds, Helping or Assisting others, Waiting in a queue Forbearing, Comprehending and Revering others opinion….Ah!!! What WONDERS can Social and Emotional Learning do when instilled in the children. Schools are a vital context for children’s Social and Emotional development. Be it a school or any public […] Read More. Single Parenting Challenges and Tips Single parenting may seem like a tough call in the first instance. And if it seems so, so is parenting in its entirety. On the contrary, single parents and their kids can have lot fun together. Take example from the well-known personalities who have been raised by single mother or father yet they existed up […] Read More. Quick Tips to Teaching Discipline to kids “Discipline is the defining fire by which talent becomes ability.” Teaching discipline to children can be a tricky task altogether as they are impatient and curious. Parents find it lot more difficult to make them abide by rules. Discipline being one of the most important pillars for success in life, helps to shape one’s future. […] Read More."
