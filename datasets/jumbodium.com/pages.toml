title = "Privacy Policy | JUMBODIUM"
full_description = '''Jumbodium Tech Private Limited OPC. [hereinafter "Jumbodium" or "Company"] is engaged in www.jumbodium.com to facilitate various educational processes involving students and educational institutes. Company has adopted the following Privacy Policy for information that may be collected from its website www.jumbodium.com [hereinafter "website"]. This privacy policy states what kind of information is collected from its Users by Company and the manner it is intended to be used. This Policy also states how the information is protected by Company. Company is committed to protecting your privacy. When you provide certain information that allows us to identify you, it is strictly used in accordance with this Privacy Policy. Company reserves the right to make changes to this privacy policy, as required. Users are encouraged to check this page periodically to ensure that you are aware of the changes. This policy is effective from 1st July 2009. Information Collected and it's Use: In order to facilitate various processes of educational institutions, we may collect the following types of information from you: Information When you visit our "website", we will ask you to sign up for a www.jumbodium.com account. Here, we ask you for personal information such as your name, email address and an account password, contact information, Pin code etc. as may appear on the website. The Information is primarily collected to facilitate your interaction with a specified Institute, such as filling out a specific college admission application, requested by you. It also helps you to interact with institute to clarify your queries. Further, it enables you to submit in a convenient and efficient manner any information that is likely to be needed when you complete college admission, financial aid and other applications and forms made available through our website. The information submitted is kept Confidential by ensuring appropriate technological support. Your information is being retained by us on behalf of the Educational institute for admission and other misc. purposes. As www.jumbodium.comis a facilitator in the Online Admissions process, your request in respect of admissions will involve a transfer of data. Such data related to your request or query will be made available to the institution or recipient you opt or choose or designate or to a service provider assisting us in completing that task. Therefore, your personal information is collected and provided to the designated recipient for the purposes of facilitating your admissions by: Filling and submitting online applications for admission with Institute specified by you or for Filling and submitting financial aid applications to the designated recipient. Your personal data required to complete that application will be provided on your behalf to the admissions office of the institution to which you are applying. Your request to any educational institution for brochure or prospectus or any other material will entail your contact information to be sent to that institution. Except as provided herein, personal data that you enter on the website, is not made available or distributed to third parties, except with your express consent. We will not give, sell or provide access to your personal information to any company, individual or organization for its use in marketing or commercial solicitation or for any other purpose, except with your express consent, as is necessary for the operation of this site. We also ask you for other information such as preferences and interests, which is optional. You may choose not to enter such information apart from what may be necessary for the purpose of www.jumbodium.com. If you voluntarily submit any additional information, we have your deemed free consent to use or share such information for the purpose of marketing or commercial solicitation. Additionally, for the purpose of payment, you may be requested for credit card or other payment account information which is directly submitted to the Payment Gateway. We do not maintain any data submitted for the purpose of effecting payment. In case of any dispute or discrepancy, you are requested to directly contact your Credit Card Company and the Payment Gateway Company. We may combine the information you submit under your account with information from other www.jumbodium.com services or third parties in order to provide you with a better experience and to improve the quality of our services. If we use this information in a manner different than the purpose for which it was collected, then we will ask for your consent prior to such use. If we propose to use personal information for any purposes other than those described in this Privacy Policy, we will offer you an effective way to opt out of the use of personal information for those other purposes. Information sharing: www.jumbodium.com only shares personal information with other companies or individuals outside of www.jumbodium.comin the following limited circumstances: We have your free consent. We provide such information to our subsidiaries, affiliated companies or other trusted businesses or persons for the purpose of processing personal information on our behalf. We require that these parties agree to process such information based on our instructions and in compliance with this Privacy Policy and any other appropriate confidentiality and security measures. When required by law to comply with any valid legal process such as a search warrant, Compliance under any prevailing law or statute, regulation or court order or any other order from any appropriate authorities or to detect, prevent, or otherwise address fraud, security or technical issues, or to protect against imminent harm to the rights, property or safety of Company, its users or the public as required or permitted by law. We may share with third parties certain pieces of aggregated, non-personal information, such as the number of users who searched for a particular term, for example, or how many users clicked on a particular advertisement. Such information does not identify you individually. Security measures: We take appropriate security measures to protect against unauthorized access to or unauthorized alteration, disclosure or destruction of data. These include internal reviews of our data collection, storage and processing practices and security measures, as well as physical security measures to guard against unauthorized access to systems where we store personal data. However, Company shall not be responsible in any manner whatsoever if the login or user id and/or password is shared and/or leaked by the user. We restrict access to personal information to Company employees, vendors, contractors and agents who need to know that information in order to operate, develop or improve our services. These individuals are bound by confidentiality obligations and may be subject to discipline, including termination and criminal prosecution, if they fail to meet these obligations. Data integrity: Company processes personal information only for the purposes for which it was collected and in accordance with this Privacy Policy or any applicable service-specific privacy notice. We review our data collection, storage and processing practices to ensure that we only collect, store and process the personal information needed to provide or improve our services. We take reasonable steps to ensure that the personal information we process is accurate, complete, and current, but we depend on our users to update or correct their personal information whenever necessary. Accessing and updating personal information We make good faith efforts to provide you with access to your personal information and either to correct this data if it is inaccurate or to delete such data at your request if it is not otherwise required to be retained by law or for legitimate business purposes. We ask individual users to identify themselves and the information requested to be accessed, corrected or removed before processing such requests, and we may decline to process requests that are unreasonably repetitive or systematic, require disproportionate technical effort, jeopardize the privacy of others, or would be extremely impractical (for instance, requests concerning information residing on backup tapes), or for which access is not otherwise required. Cookies: When you visit www.jumbodium.com, we send one or more cookies to your computer that uniquely identifies your browser. We use cookies to improve the quality of our service by storing user preferences and tracking user trends, such as how people search. Company also uses cookies in its advertising services to help advertisers and publishers serve and manage ads across the web. We may set a cookie in your browser when you visit a website and view or click on an ad supported by Company's advertising services. Most browsers are initially set up to accept cookies, but you can reset your browser to refuse all cookies or to indicate when a cookie is being sent. However, some of our features and services may not function properly if your cookies are disabled. You can decline to submit personal information to any of our services, in which case Company may not be able to provide those services to you. Log information: When you access www.jumbodium.com, our servers automatically record information that your browser sends whenever you visit a website. These server logs may include information such as your web request, Internet Protocol address, browser type, browser language, the date and time of your request and one or more cookies that may uniquely identify your browser. User communications: When you send email or other communications to www.jumbodium.com we may retain those communications in order to process your inquiries, respond to your requests and improve our services. www.jumbodium.com only processes personal information for the purposes described in this Privacy Policy. We may retain your information for internal record keeping or enhancing our products and services or for Audit purposes. www.jumbodium.com processes personal information on secure data servers. Links to other websites: Our website may contain links to other websites. Note that once you click these links to navigate away from our site, we do not have any control over the contents of the external sites. We will not be held responsible for the protection and privacy of any information which you provide to these sites and they will not be governed by this privacy statement. We encourage you to exercise caution and look at the privacy statement of such websites. Changes to this Privacy Policy: Please note that this Privacy Policy may change from time to time. Any changes made to this Policy shall be made available on the website. Your acceptance of this Privacy Policy is a deemed acceptance to the modified or changed Policy. If you have any additional questions or concerns about this Privacy Policy, please feel free to email us at info@jumbodium.com or contact us at: Jumbodium Tech Private Limited OPC. How to Unsubscribe from Email Communication? You can send email to info@jumbodium.com with Subject line: "Unsubscribe", to unsubscribe from the mailing list.'''
