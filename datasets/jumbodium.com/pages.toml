 an integral part of this agreement. You are encouraged to read all the details of the privacy policy and check for any amendments from time to time. For facilitating online admissions we have tied up with various educational institutes. The online admissions procedure is governed by the requirements communicated to us by the respective institution. The services offered for facilitating online admissions include: School Search Downloading Prospectus Filling and submission of forms. Posting any query to institute. Subscribe to school updates. Step 1: You can register and create profiles at www.jumbodium.com It is free of cost. Step 2:You can search & select schools for which you want to apply. Step 3: You are required to pay the requisite application form fee as may be specified by the institute by choosing Demand Draft, Cheque, Debit/Credit Card or Net Banking. Step 3.1: In case of online payment you can make payment by credit/debit card, cash card or net banking (COMING SOON). Step 3.2: For demand draft payment, you need to arrange for a demand draft from the bank as per instructions specified by the company. Simultaneously, you need to enter details of demand draft in the online application. Please note that payment confirmation is necessary to complete online application process. In case your payment is not confirmed then your application will be incomplete and will not be considered as submitted to the institute. You can save applications as drafts for later use. Step 4: You application form would be activated and it will be valid if your payment is confirmed by Jumbodium. Step 5:You can fill the application form online as per instructions specified in the online application form. Step 5.1:You can fill the application form in step by step manner. You can save your incomplete application form and can complete it at later time or date prior to deadline of the application. Step 6:After you fill all the required fields of the online form, you can submit it to the institute by clicking on the submit button. Please note that after form-submission, it is not possible to edit it under any circumstances and it will reach to the institute in precise manner in which you have filled the application form online. Step 7:After your form-submission, you will receive acknowledgement of form acceptance from Jumbodium via Email/SMS. It indicates that you have successfully applied for the specified school/institute. Step 8:Jumbodium maintains all the history of your applications in the database. So you can view your application by visiting www.jumbodium.com and logging in to enter into the Dashboard Section. Kindly note that if the payment is not successful due to any issues on the part of the Payment Gateway Company, then it shall be the responsibility of the Payment Gateway Company and you, to address the issue; and Jumbodium shall not be responsible in any manner whatsoever. Restrictions / Exceptions: The online filing of documents is subject to the following: You are expected to fully understand the requirements of the educational institution before filling up the application form. Any discrepancy caused later on shall not be entertained by the company. It shall be your sole responsibility to verify and validate such requirements before using Jumbodium. The inclusion of educational institute in Jumbodium does not imply that institute has complied with norms, rules, regulations that are prescribed by the appropriate authorities. Similarly, the inclusion of institute in Jumbodium does not imply that institute is recognized/ affiliated to particular university. It is solely your responsibility to verify and validate the recognition of the university. Jumbodium does not provide any guarantee of admission for the particular school(s) if you apply through Jumbodium. The entire process of admissions based on merit, or any other parameter shall be governed and controlled by the respective educational Institute. Grant of admissions shall be at the sole discretion of the respective educational institutions. It is hereby expressly clarified that, role of Jumbodium is only to facilitate and automate the admission process and NOT to grant admissions. Rejection of application: The application may be rejected in any of the following circumstances: Application rejected by the institute due to incomplete application. Application rejected due to any specific criteria or conditions not being fulfilled as per the requirements of the institute. Your Payment was not processed in time. You failed to submit your application before deadline of the course. By virtue of this agreement you agree that, Jumbodium would not be responsible for any rejection of your application. Jumbodium only acts as a facilitator and a common meeting platform between students and institute in relation to admissions. It is solely your responsibility to submit application as per instructions mentioned before deadline of the application expires. Web security safeguards as per the industry practices have been implemented in www.jumbodium.com. In case of any major issue which affects your application submission to any institute, you will be informed about non availability of our service till we resolve such issue. Apart from facilitating online filling of application Jumbodium also provides certain other services as follows. Links to other sites: Jumbodium provides link to various educational and other sites. (Other sites include social welfare, education counseling, competition news, blogs etc) However The Linked Sites are not under the control of Jumbodium and Jumbodium is not responsible for the contents of any Linked Site, including without limitation any link contained in a Linked Site, or any changes or updates to a Linked Site. By this agreement you covenant with the company that, Jumbodium is not responsible for webcasting or any other form of transmission received from any Linked Site. Jumbodium is providing these links as a matter of convenience, and the inclusion of any link does not imply endorsement by Jumbodium of the site or any association with its operators. You agree by virtue of this agreement that, Jumbodium does not take the responsibility of authenticity and contents of such web sites. It is the responsibility of the user to check the authenticity of contents displayed on such site. Communication services: Jumbodium may provide various communication services like bulletin board services, chat areas, news groups, forums, communities, institute web pages, calendars, and/or other message or communication facilities designed to enable you to communicate, clarify your queries, get more information about education institutions. However, the facility of communication service is subject to following: 2.1: By virtue of this agreement you agree that you will use the Communication Services only to post, send and receive messages and material that are proper and related to the particular Communication Service. 2.2: By this agreement you agree that, you will not use the communication service to Defame abuse, harass, stalk, threaten or otherwise violate the legal rights (such as rights of privacy and publicity) of others. 2.3: You further agree that you will not use communication service to Publish, post, upload, distribute or disseminate any inappropriate, profane, defamatory, infringing, obscene, indecent or unlawful topic, name, material or information. 2.4: You further agree that, you will not use communication service available on Jumbodium to Upload files that contain software or other material protected by intellectual property laws (or by rights of privacy of publicity) unless you own or control the rights thereto or have received all necessary consents. 2.5: You agree that, you will not upload files that contain viruses, corrupted files, or any other similar software or programs that may damage the operation of another's computer. 2.6: You covenant through this agreement that you will not advert