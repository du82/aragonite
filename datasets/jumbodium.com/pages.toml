["https://jumbodium.com/product_pricing.php"]
title = "Product Pricing | JUMBODIUM"
full_description = "Charges and Fees Jumbodium reserves the right to charge and recover from the User fees for availing the Service. Currently Jumbodium charges Rs.150/- as transaction fees for availing the service. The Jumbodium fees may be revised by from time to time. These changes shall be effective from the time they are posted on to the Jumbodium web site. You are bound by such revisions and should therefore visit the Jumbodium web site to review the current fees from time to time. Credit /Debit Card Service charges will be levied as per actual of the bill amount by Credit/Debit Card for providing service. These charges and fee shall be charged on to Your Credit/Debit Card Account including any service taxes if applicable. We accept the following payment methods: Credit card (Visa/ Master/ Amex) Debit card (Visa/ Master/ Maestro) Net Banking (For all leading banks ) Wire/Online transfer from all major Indian and International banks Cheque Demand Draft Any hidden charges included on a transaction? No, there are no hidden costs included on any transaction on www.jumbodium.com. The final cost is mentioned on the payment page and you do not have to pay anything more than that. Can I make a purchase without Debit/Credit card on jumbodium.com? You can choose for other payment method such as Net Banking, Cash/Cheque/Demand draft. Is it safe to share my credit card/debit card details while making purchases on www.jumbodium.com? Yes. All transactions are purely secured. We use the best recognized payment gateways to process your transactions. The transaction is processed using SSL data encryption (secure encrypted connection), which protects the information from being misused. My transaction failed but the money was deducted from my account. What do I do now? Please write to at support@jumbodium.com with the details of the transaction. Kindly include all the details and transaction receipt, if any. How does Jumbodium prevent fraud payments and activities? We and our payments partners monitor transactions continuously for suspicious activity and flag potentially fraudulent transactions for manual verification by our team. In the rarest of rare cases, when our team is unable to rule out the possibility of fraud categorically, the transaction is kept on hold, and the customer is requested to provide identity documents. The ID documents help us ensure that the transactions were made by the card holder. We apologize for any inconvenience that may be caused. This is in the interest of ensuring a safe and secure environment for online transactions. Do you accept International Credit Cards? Yes. We accept international credit cards. Are online transactions secure and safe? To make online shopping safer, RBI has made it mandatory, from 1st August onwards, for all online transactions to have an extra level of authentication. The 'extra' level is a password that you will have to enter after entering your credit/debit card details while making online payments. This new technology is called VBV – Verified by Visa or MSC – MasterCard Secure Code Do you accept payments in other currencies? We accept only INR."
year_published = 2025
