title = "SaaS Product Benchmarks 2023"
description = "Explore the 2023 SaaS Product Benchmarks to understand how your product measures up against the industry. Gain insights on key metrics across acquisition, activation, retention, and more, to strategize your product's growth effectively."
full_description = 'Acquisition is the pace at which you grow your overall user base. For instance if you acquire 10 users this week and had 100 users in total (active or not), you grew 10% Week over Week (WoW). Startups observe this metric to make sure they fuel their startup with new users. Paul Graham noted that a good growth rate is 5 to 7 percent per week, while an exceptional growth rate is 10 percent per week. For this benchmark we used "User base growth" at a user level to compare growth across venture backed Saas companies. User base growth is the percentage of users across the whole user base of a product that were acquired in a given week. This data is anonymized and comes from 357 users that opted-in in our in-product survey.Last update: November 2023'
