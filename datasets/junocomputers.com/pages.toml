description = "Juno Computers help's you switch to Linux!"
full_description = "All of our Juno computers come pre-installed with LibreOffice, a free and open source office suite.The suite comprises programs for word processing, the creation and editing of spreadsheets, slideshows, diagrams and drawings. LibreOffice can open and save documents in the Microsoft Office file formats, including Microsoft Office Open XML formats. Organize and listen to your music. Browse by albums, use lightning-fast search, and build playlist of your favorites. With one single click you will be able to install your favourite music apps from the Software Center. Play, create and edit your own playlists. Discover new music! IMPORT, ORGANIZE, AND EDIT PHOTOS. MAKE A SLIDESHOWSHARE WITH FACEBOOK, FLICKR, GOOGLE PHOTOS, PIWIGO OR TUMBLR BRICSCAD is a great alternative to AutoCAD. It is the all-in-one solution for 2D, 3D, Mechanical Design and BIM. It has full support for DWG. BLENDER is 3D software toolset used for creating animated films, visual effects, 3D printed models, motion graphics, virtual reality and more! MEGA allows you to get 50GB of free encrypted cloud storage and offers great prices for premium users. You won’t be missing out with the switch to Juno. The Software Center app provides a one-click installation to stay in touch with your family and friends on Skype. The Software Center provides a Hangouts plugin that will allow you to video call and chat using any browser. Simply log in through your Google account and you are good to go! If you’re not a fan of using WhatsApp on your phone, we provide a desktop application that will simplify your chatting experience. Open the Software Center and install it right away. Islington London, UK +44 (0) 2034887596 uk@junocomputers.com Company No: 11036376 VAT: GB 338 5090 91 Enter your details below to save your shopping cart for later. And, who knows, maybe we will even send you a sweet discount code :)"
