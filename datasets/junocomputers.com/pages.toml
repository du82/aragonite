full_description = "Privacy policySECTION 1 – WHAT DO WE DO WITH YOUR INFORMATION?When you purchase something from our store, as part of the buying and selling process, we collect the personal information you give us such as your name, address and email address.When you browse our store, we also automatically receive your computer’s internet protocol (IP) address in order to provide us with information that helps us learn about your browser and operating system.Email marketing (if applicable): With your permission, we may send you emails about our store, new products and other updates.SECTION 2 – CONSENTHow do you get my consent?When you provide us with personal information to complete a transaction, verify your credit card, place an order, arrange for a delivery or return a purchase, we imply that you consent to our collecting it and using it for that specific reason only.If we ask for your personal information for a secondary reason, like marketing, we will either ask you directly for your expressed consent, or provide you with an opportunity to say no.How do I withdraw my consent?If after you opt-in, you change your mind, you may withdraw your consent for us to contact you, for the continued collection, use or disclosure of your information, at anytime, by contacting us at uk@junocomputers.com or mailing us at:Juno Computers Ltd476 Caledonia RdFlat 17London, GBN7 8TBSECTION 3 – DISCLOSUREWe may disclose your personal information if we are required by law to do so or if you violate our Terms of Service.SECTION 4 – AGE OF CONSENTBy using this site, you represent that you are at least the age of majority in your state or province of residence, or that you are the age of majority in your state or province of residence and you have given us your consent to allow any of your minor dependents to use this site.SECTION 5 – CHANGES TO THIS PRIVACY POLICYWe reserve the right to modify this privacy policy at any time, so please review it frequently. Changes and clarifications will take effect immediately upon their posting on the website. If we make material changes to this policy, we will notify you here that it has been updated, so that you are aware of what information we collect, how we use it, and under what circumstances, if any, we use and/or disclose it.If our store is acquired or merged with another company, your information may be transferred to the new owners so that we may continue to sell products to you.QUESTIONS AND CONTACT INFORMATIONIf you would like to: access, correct, amend or delete any personal information we have about you, register a complaint, or simply want more information contact our Privacy Compliance Officer at uk@junocomputers.com or by mail at[Re: Privacy Compliance Officer]Juno Computers Ltd476 Caledonia RdFlat 17London, GBN7 8TB"
