["https://junocomputers.com/terms-conditions"]
title = "Terms & Conditions - Juno Computers UK"
description = "All shipments are sent through UPS. Card payments require up to 2 to 3 working days wait to be processed through our counter-fraud system. The machine will be"
full_description = "Terms & ConditionsSHIPPINGAll shipments are sent through UPS. Card payments require up to 2 to 3 working days wait to be processed through our counter-fraud system. The machine will be dispatched 5 working days after the payment has been cleared.Shipping Delays & DamagesOnce the parcel is handed over from Juno Computers Ltd to UPS, any forms of delay and/or damages will fall under the responsibility of UPS. Parcels that have been damaged in transit they will have to be returned or collected by UPS to proceed with the claim. This process can take 1 to 5 working days. The machine will be returned back to Juno Computers Ltd and a replacement will be shipped back to the customer as soon as possible. If the machine has been damaged in transit, please send pictures of the box and the laptop to uk@junocomputers.com in order to proceed with a damaged shipping claim. Juno Computers Ltd will work diligently to keep the customer informed and up to date at all times during this process.CUSTOMSImport taxes are not included in shipping prices. Juno Computers Ltd will not be responsible for any customs or duty fee’s applied by the recipients country. Please contact your local customs office for more information.EU orders will have to pay VAT/Sales Tax at customs in their respective countriesVAT / SALES TAXVAT/Sales tax might be charged at your country’s custom. Please contact your local customs local office for more information.RETURNSIf you would like to return your machine, you must notify us within 7 days of receipt. You then have 7 days to return the machine to receive a refund.The machine must returned in the original packaging and condition.If the machine appears to have accidental damages upon return, a refund will not be issued.To complete your return, we require a receipt or proof of purchase.Please do not send your purchase back to the manufacturer.There will be no refund after 14 days.REFUNDS (if applicable)Once your return is received and inspected, we will send you an email to notify you that we have received your returned item. At this time we will notify you of the approval or rejection of your refund.Juno Computers Ltd will deduct 10% off the original value of the machine, then your refund will be processed and a credit will automatically be applied to your credit card or original method of payment, within a certain amount of days. Shipping cost is non-refundable.Transactions made by bank transfer will be refunded in British Pounds excluding shipping cost. You or your bank are responsible for the exchange rate if the account is outside of the UK. Processing times vary from 3-7 working days.Shipping costs are non-refundable on all orders.ShippingTo return your product, you should mail your product to: 476 Caledonian Road, Flat 17, London, N7 8TB – UKYou will be responsible for paying for your own shipping costs for returning your item. Shipping costs are non-refundable.Depending on where you live, the time it may take for your exchanged product to reach you, may vary.If you are shipping an item over £75, you should consider using a trackable shipping service or purchasing shipping insurance. We can’t guarantee that we will receive your returned item in working condition. Any damages caused during shipping must be settled between the sender and the shipping company. The full exchange can not be carried out until the damaged claim has been resolved.Import TaxJuno Computers Ltd is not responsible for any taxes that are charged at your local country’s customs. We will not refund any Import taxes or VAT/Sales tax from foreign countries (outside of the UK). Please contact your local custom’s office for more information.Late or missing refunds (if applicable) If you haven’t received a refund yet, first check your bank account again. Then contact your credit card company, it may take some time before your refund is officially posted.Next contact your bank. There is often some processing time before a refund is posted. If you’ve done all of this and you still have not received your refund yet, please contact us at uk@junocomputers.com.Sale items (if applicable) Only regular priced items may be refunded, unfortunately sale items cannot be refunded.EXCHANGES (if applicable)We only replace items if they are defective or damaged. If you need to exchange it for the same item, send us an email at uk@junocomputers.com and post your item to: 476 Caledonian Road, Flat 17, London, N7 8TB – UKShippingTo return your product, you should mail your product to: 476 Caledonian Road, Flat 17, London, N7 8TB – UKYou will be responsible for paying for your own shipping costs for returning your item. Shipping costs are non-refundable.Depending on where you live, the time it may take for your exchanged product to reach you, may vary.If you are shipping an item over £75, you should consider using a trackable shipping service or purchasing shipping insurance. We can’t guarantee that we will receive your returned item in working condition. Any damages caused during shipping must be settled between the sender and the shipping company. The full exchange can not be carried out until the damaged claim has been resolved.CUSTOM PARTSAdditional custom brand parts are not refundable. SOFTWARE & OSRunning into OS and Software issues can happen. These common issues can be solved by troubleshooting the core issue of the problem or reinstalling the OS. If you run into these issues, they do not qualify as a “broken laptop/computer”. Please contact us right away at uk@junocomputers.com and we will work with you to find the solution. If you choose to return the unit, Juno Computers Ltd will deduct 5% off the original value (read REFUNDS for more information).CANCELLATIONSJuno Computers Ltd will deduct 10% off the original value. Shipping cost is non-refundable if is already in transit.Transactions made by bank transfer will be refunded the full amount. Processing times vary from 3-7 working days.WARRANTYCoverageJuno Computers Ltd provides a 1-year limited warranty on all manufacture problems. This does not include any forms of accidental damages (liquids, dropping etc.). Also, please be careful when manipulating the BIOS as this could lead to further complications such as bricking the laptop (rendering the the machine unusable). If this were to happen, your Juno Computers Ltd warranty will be voided.UbuntuJuno Computers Ltd offers support on Ubuntu core issues.DriversIf you choose not to install Juno drivers, it can cause the machine to overheat – in which case this will void the warranty. Please check our Support page on how to install our drivers.Battery LifeJuno Computers Ltd does not provide any warranties for the battery life, as is expected that all rechargeable batteries will lose charging capacities over time. ShippingThe customer is responsible for paying for shipping costs to our designated repair facility. Shipping costs are non-refundable.If you are shipping an item over £100, you should consider using a trackable shipping service or purchasing shipping insurance. Any damages caused during shipping must be settled between the sender and the shipping company. Juno Computers Ltd will cover the cost of returning the laptop to the customer.CustomsJuno Computers Ltd will not be responsible for any customs or duty fee’s applied by the recipients country. Please contact your local customs office for more information.Warranty ClaimTo claim your warranty, please email us at uk@junocomputers.comDATA PROTECTIONIt is the sole responsibility of customers to create a copy or backup of their data. Juno Computers Ltd can not guarantee that data won’t be lost during a repair or when receiving system updates. Some standard troubleshooting procedures involve storage structure repairs that can result in loss of data. Another even requires storage initialization or system reinstall, to restore the device to factory settings – to avoid the software issues mentioned earlier.Customers are therefore strongly advised to have a continuous backup, and to make a copy of sensitive data before sending the device for repair.We try, of course, to avoid any data loss and we will call you before using any tools that could result in data loss, but we cannot guarantee that accidents won’t happen.We will also assist with data recovery if the storage is faulty. The best and only way to avoid such disasters is to have a personal backup strategy in place. Please consider using a Cloud service or apps such as Deja Dup.Dead Pixels PolicyAll notebook displays use TFT technology, manufactured according to high industry standards, to guarantee trouble-free personal computing. Nevertheless, your display may have cosmetic imperfections that appear as small bright or dark spots. This is common to all LCD displays and cannot be avoided by any of our models. These imperfections are caused by one or more defective pixels or sub-pixels. Juno Computers Ltd follows the common bad pixel policy from the industry.Following the industry standard, Juno Computers Ltd warrants a defective LCD display as having 6 or more bad pixels and will accept delivery of such a system within 30 days from the invoice date for a replacement.NOT COVEREDJuno Computers Ltd does not teach customers how to use Ubuntu or any other applications. If you are new to Ubuntu or Linux, we would recommend the following on how to use it:Purchase booksWatch videosCheck this manual by UbuntorCheck out answers to some of the most common questions:Ask UbuntuLibreOffice SupportCOMPANY INFOJuno Computers Ltd476 Caledonia RdFlat 17N7 8TBLondonUnited KingdomCompany No: 11036376VAT: GB 338 5090 91"
