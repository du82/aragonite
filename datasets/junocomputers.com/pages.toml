["https://junocomputers.com/shipping-returns"]
title = "Shipping & Returns - Juno Computers UK"
description = "Preview Only"
full_description = "All shipments are sent through UPS. Card payments require up to 2 to 3 working days wait to be processed through our counter-fraud system. The machine will be dispatched 5 working days after the payment has been cleared. Once the parcel is handed over from Juno Computers Ltd to UPS, any forms of delay and/or damages will fall under the responsibility of UPS. Parcels that have been damaged in transit they will have to be returned or collected by UPS to proceed with the claim. This process can take 1 to 5 working days. The machine will be returned back to Juno Computers Ltd and a replacement will be shipped back to the customer as soon as possible. If the machine has been damaged in transit, please send pictures of the box and the laptop to uk@junocomputers.com in order to proceed with a damaged shipping claim. Juno Computers Ltd will work diligently to keep the customer informed and up to date at all times during this process. Import taxes are not included in shipping prices. Juno Computers Ltd will not be responsible for any customs or duty fee’s applied by the recipients country. Please contact your local customs office for more information. VAT/Sales tax might be charged at your country’s custom. Please contact your local customs local office for more information. If you would like to return your machine, you must notify us within 7 days of receipt. You then have 7 days to return the machine to receive a refund. REFUNDS (if applicable)Once your return is received and inspected, we will send you an email to notify you that we have received your returned item. At this time we will notify you of the approval or rejection of your refund. Juno Computers Ltd will deduct 10% off the original value of the machine, then your refund will be processed and a credit will automatically be applied to your credit card or original method of payment, within a certain amount of days. Shipping cost is non-refundable. Transactions made by bank transfer will be refunded in British Pounds excluding shipping cost. You or your bank are responsible for the exchange rate if the account is outside of the UK. Processing times vary from 3-7 working days."
