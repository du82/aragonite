title = "Warranty - Juno Computers UK"
description = "Juno Computers Ltd provides a 1-year for new machines and 6-months for open box machines limited warranty on all manufacture problems. This does not include"
full_description = "Juno Computers Ltd provides a 1-year for new machines and 6-months for clearance & open box machines limited warranty on all manufacture problems. This does not include any forms of accidental damages (liquids, dropping etc.). Also, please be careful when manipulating the BIOS as this could lead to further complications such as bricking the laptop (rendering the the machine unusable). If this were to happen, your Juno Computers Ltd warranty will be voided. If you choose not to install Juno drivers, it can cause the machine to overheat – in which case this will void the warranty. Please check our Support page on how to install our drivers. Juno Computers Ltd does not provide any warranties for the battery life, as is expected that all rechargeable batteries will lose charging capacities over time. The customer is responsible for paying for shipping costs to our designated repair facility. Shipping costs are non-refundable. If you are shipping an item over £100, you should consider using a trackable shipping service or purchasing shipping insurance. Any damages caused during shipping must be settled between the sender and the shipping company. Juno Computers Ltd will not be responsible for any customs or duty fee’s applied by the recipients country. Please contact your local customs office for more information. Third party online platforms such us Facebook, Twitter, Instagram, and other Social Media will not be used for support by Juno Computers Ltd. It is the sole responsibility of customers to create a copy or backup of their data. Juno Computers Ltd can not guarantee that data won’t be lost during a repair or when receiving system updates. Some standard troubleshooting procedures involve storage structure repairs that can result in loss of data. Another even requires storage initialization or system reinstall, to restore the device to factory settings – to avoid the software issues mentioned earlier. Customers are therefore strongly advised to have a continuous backup, and to make a copy of sensitive data before sending the device for repair."
