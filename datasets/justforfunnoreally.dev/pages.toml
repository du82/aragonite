title = "Just for Fun. No, Really."
full_description = "We like to write software! Coding is a zigzag journey of problem-solving, and the destination is less important than some might think. If one spends a lot of time on Hacker News, or other startup-oriented news sites, they might believe that everyone is working on their next multi-million-dollar startup and/or exit strategy. It may be hard to imagine that people work on open source code purely for the fun of it. There are hackers who just love the art of building software. They do it for the challenge, for the fun of it. They aren’t trying to make a million dollars. Or, if one is used to consuming other software only, and rarely creating any, they might get stuck in a mindset of thinking “what can this project do for me?” (And if the project isn’t relevant to them, they wonder why it exists.) There are hackers who don’t need lots of people to consume their software. Of course, they would love it if others enjoyed/admired/appreciated their work, but that's not strictly necessary. It's just fun to create. Lastly, if one has learned enough programming technique to do their day job and not a lot more, then they might not appreciate programmers who are always trying new things. There are hackers who live and breathe code, and the idea that every line of code must prove its monetary value, that every hour spent toiling away at the keyboard must be accounted for, is a damn shame. If you, dear reader, think you may have lost your way—that coding used to be fun for you, but now it's just a slog of clocking in and out to get a paycheck, then allow us to invite you back! Or, if you were conditioned to think that wild-idea programming is only for professionals and academics, this page is for you. You have the right to tinker, and have fun doing it! Think of something that you might like to build, learn, experience inside the computer, and just jump in. Without looking or researching first. You might just have a bit of fun. No, really."
year_published = 2025
