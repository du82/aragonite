["https://justine.lol/memzoom"]
title = "Memzoom"
full_description = "Memzoom is like the less command except designed for binary data with live updates. It represents non-ASCII characters using IBM Code Page 437 as a base-256 binary alphabet. It implements zooming via CTRL+MOUSEWHEEL which uses an image scaling algorithm (better than Lanczos!) that enables you to monitor large amounts of virtual memory at once. Memzoom uses ANSI color sequences to help you differentiate sparse from dense data. Lastly it can render memory along a space-filling curve to preserve locality, using a technique that's similar to what's described here."
