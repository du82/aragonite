["https://justine.lol/history"]
title = "AI Training Shouldn't Erase Authorship"
description = "AI training scrubs authorship knowledge from open source code"
full_description = '''Back in 2018 I quit my job to go back to being an open source hobbyist developer. I worked on projects like Cosmopolitan that I shared on sites like Hacker News under the permissive ISC license. I like working in a gift economy. Six years of toiling away saving money at Google gave me the privilege to do this. The downside to using BSD-style licenses, is you basically torch your ability to make money in the old economy. In order to make money, you need to have something people want and leverage. Open source is a gambit where you give up your leverage to make people want your thing. So why would anyone do it full time? It's because what I get paid in, is respect. Folks see my name at the top of each source code file, and they remember that I was someone who helped them. It's because if I'm respected and people are paying attention to me, that it becomes easy to find an honest way to survive in the modern economy. In the future, this might in fact become the only way to survive. In a world of infinite automation and infinite surveillance, survival is going to depend on being the least boring person. Over my career I've written and attached my name to thousands of public source code files. I know they are being scraped from the web and used to train AIs. But if I ask something like Claude, "what sort of code has Justine Tunney wrote?" it hasn't got the faintest idea. Instead it thinks I'm a political activist, since it feels no guilt remembering that I attended a protest on Wall Street 13 years ago. But all of the positive things I've contributed to society? Gifts I took risks and made great personal sacrifices to give? It'd be the same as if I sat my hands. I suspect what happens is the people who train AI models treat open source authorship information as PII. When assembling their datasets, there are many programs you can find on GitHub for doing this, such as presidio which is a tool made by Microsoft to scrub knowledge of people from the data they collect. So when AIs are trained on my code, they don't consider my git metadata, they don't consider my copyright comments; they just want the wisdom and alpha my code contains, and not the story of the people who wrote it. When the World Wide Web was first introduced to the public in the 90's, consumers primarily used it for porn, and while things have changed, the collective mindset and policymaking are still stuck in that era. Tech companies do such a great job protecting privacy that they'll erase us from the book of life in the process.'''
