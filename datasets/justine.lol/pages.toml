["https://justine.lol/cosmo3"]
title = "Cosmopolitan Third Edition"
description = "Linux distro of fat binaries that run on six OSes for ARM64/AMD64."
full_description = '''After nearly one year of development, I'm pleased to announce our version 3.0 release of the Cosmopolitan library. The project is an entirely new animal. For starters, Mozilla sponsored our work as part of their MIECO program. Google also awarded me an open source peer bonus for my work on Cosmopolitan, which is a rare honor, and it's nice to see our project listed up there among the greats, e.g. curl, linux, etc. In terms of this release, we're living up to the great expectations you've all held for this project in a number of ways. The first is we invented a new linker that lets you build fat binaries which can run on these platforms: It's called apelink.c and it's a fine piece of poetry that weaves together the Portable Executable, ELF, Mach-O, and PKZIP file formats into shell scripts that run on most PCs and servers without needing to be installed. This is an idea whose time has come; POSIX even changed their rules about binary in shell scripts specifically to let us do it. So we've been using it to create a "Fat Linux Distro" which I've named the "Cosmos". In the Cosmos, every program is statically linked and contains a PKZIP central directory where its /usr/share dependencies are embedded. You can think of it as a coalition of individualistic executables, where each program can be separated from the whole and run on other OSes. So far it includes programs like Emacs, Vim, CoreUtils, Curl, etc. cosmos-4.0.2.zip 385mb - PE+ELF+MachO+ZIP+SH executables For AMD64+ARM64 on Linux+Mac+Windows+FreeBSD+NetBSD+OpenBSD 494ecbd87c2f2f622f91066d4fe5d9ffc1aaaa13de02db1714dd84d014ed398f More specifically, the above zip file contains fat binaries for bash, emacs, python, zsh, lua, qjs, vim, nano, ape, less, grep, curl, wget, tidy, zip, unzip, zstd, bzip2, sqlite3, life, cpuid, nesemu1, make, redbean, greenbean, datasette, assimilate, ctags, pledge, verynice, find, tree, awk, [, b2sum, base32, base64, basename, basenc, berry, brotli, cat, chcon, chgrp, chown, chroot, cksum, clang-format, comm, csplit, cut, dash, date, df, dir, dircolors, dirname, du, echo, emacsclient, env, expand, expr, factor, false, fmt, fold, groups, head, id, install, join, kill, link, links, ln, locate, logname, ls, lz4, md5sum, mkfifo, mknod, mktemp, mktemper, nice, ninja, nl, nohup, nproc, numfmt, od, paste, pathchk, pigz, pinky, pr, printenv, printf, printimage, ptx, pwd, pypack1, readlink, realpath, rm, rmdir, rsync, runcon, script, sed, seq, sha1sum, sha224sum, sha256sum, sha384sum, sha512sum, shred, shuf, sleep, sort, split, stat, stty, sum, sync, tac, tail, tar, tee, test, timeout, tmux, touch, tr, true, truncate, tsort, tty, ttyinfo, unbourne, unexpand, uniq, unlink, uptime, users, vdir, wall, wc, who, whoami, xargs, xz, and yes. They can also be downloaded individually at https://cosmo.zip/pub/cosmos/bin/.'''
