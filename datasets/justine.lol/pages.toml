["https://justine.lol/rusage"]
title = "Portable rusage command"
description = "The best tool for reporting command resource usage across platforms."
full_description = '''I wrote a program called rusage.com which provides the best possible way to report resource usage statistics when launching command line programs. It provides a much richer set of information than the traditional UNIX time command: Above we see time isn't very good, since it only reports CPU usage at millisecond granularity. On the other hand, rusage.com gives you the full power of the underlying system calls (wait4(2) and getrusage(2)) which provide a richer set of higher precision information. rusage.com is distributed as a single-file dependency-free executable that you can use on any AMD64 operating system, as well as ARM64 platforms like Apple M1 and Raspberry Pi. rusage.com 332kb - PE+ELF+MachO+ZIP+SH + examples (debug data) designed for linux/macos/windows/freebsd/netbsd/openbsd on amd64/arm64 9d6c8b52d352d071ed78c9c79571eb62a372873298011e5f7e9693ba964bf184 The usefulness of this tool becomes apparent when running beefier programs, like an artificial general intelligence model with thirteen billion parameters. Here's what happens if we use llama.cpp to load Facebook's 13B LLaMA model. The code is currently implemented so that it uses std::ifstream to trawl through a 12gb file of floating point values, so they can be deserialized off spinning disk and loaded into C++ tensor data structures. In order to simulate what would happen the very first time a user runs the model after booting up, we'll be using a hack to drop page caches, which reveals the true cost of a program (noting that sudo is tired and doas is wired). Wow it took 75 seconds to generate a single token. That's what makes this problem so important. Notice however how few page faults occur? Also notice the fact that they're all minor faults, which the tool reports as "100% memcpy". Minor faults don't actually hit disk, but rather are transitions of virtual to resident memory. The most powerful system call of them all is mmap(), which we all know can solve this problem, even if we don't know how. So let's say we created our own drop-in replacement for std::ifstream, which is what the llama.cpp codebase currently uses, and we had it implement the i/o using mmap(MAP_SHARED) instead. Our goal here would be to avoid the overhead of making explicit read() system calls.'''
