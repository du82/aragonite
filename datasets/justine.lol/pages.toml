["https://justine.lol/apeloader"]
title = "APE Loader"
full_description = "Actually Portable Executable is a binary format that runs on seven operating systems. I'm pleased to announce your executables will no longer need to modify themselves on the fly in order to do that. We're now using the ape-no-modify-self.o bootloader for most programs in the Cosmopolitan repository. It works by embedding a 4kb Linux+MacOS+BSD executable command inside each executable that's named ape. The ape loader works by calling mmap() to load your executable into memory the same way the operating system would. That means it's scalable, since mmap() means the executable doesn't need to use the expensive cp command. Pages aren't loaded off disk until they're actually used by your program. What makes the loading process possible, is the APE loader does a quick scan of the first 4096 bytes to look for the classic APE printf shell command that would otherwise mutate the binary. For example, Actually Portable Executables normally look something like this: So your ape loader only needs to parse out those octal printf codes and apply them to the MAP_PRIVATE copy of your executable that's loaded into memory. No disk changes are needed. It can then read the ELF program headers and call mmap() as many additional times as needed to load the various segments of your program off disk. Now you may be asking, what happens if the APE loader isn't installed on my system? In that case, it'll try to dd the 4kb copy of the APE loader that's embedded within the host executable, out to the safest folder that's guaranteed to work, namely ${TMPDIR:-${HOME:-.}}/.ape. If your operating system defines the POSIX-specified $TMPDIR variable, then the ape loader will become $TMPDIR/.ape. Otherwise if $HOME is defined, it's dropped in in $HOME/.ape. Then, if neither is defined, ./.ape is created in the current directory. If we microbenchmark the time it takes to fork, spawn your APE program, and then wait for it to terminate, then this new solution takes about 40 microseconds, just like the old APE format."
year_published = 2025
