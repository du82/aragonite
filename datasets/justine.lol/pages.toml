["https://justine.lol/braille"]
title = "braille dump – hex dump with braille characters"
description = "braille dump improves the readibility of binary data using braille characters"
full_description = '''braille dump is a drop in replacement for hexdump -C that uses unicode braille characters to display hex codes 0x81..0xff thereby improving the readibility of binary. bd.com 44kb - PE+ELF+MachO+ZIP+SH (VirusTotal) 6334a8a8ad322b269c8e72ec5fb9b74be34d2909c079c675ad534fe386f25108 bd.com.dbg 634kb - ELF debugger data (optional) 2aeb976561255eb20ffdb442622e5dd3892304448c4f8bb9be6364f575287f02 Braille Dump will work on Linux 2.6.16+, Windows Vista+, MacOS XNU 15.6+, FreeBSD 12+, OpenBSD 6.4+, or NetBSD 9.1+. Here's a concrete example of why braille dump is better at presenting binary data than the old hexdump command. Let's say we wanted to view the binary header to the bd.com program itself. hexdump will show us: Let's say we're reading 64-bit little endian words. This is a good example of how braille dump does a much better job intuitively revealing the structure of the binary. The old hexdump command does this: If you get an error like "unable to find an interpreter" or "err:module:import_dll Library" then your system has likely been tuned to use binfmt-misc. You can safely restore the default Linux behavior for just Actually Portable Executables by running the following command: Braille Dump is authored and maintained by Justine Tunney. The extended braille charmap was designed by Google Information Security Engineer Ange Albertini. The glyphs used to display control codes were designed by IBM back in the early 1980's for the original personal computer, known as Code Page 437. What remains was designed by the American Standards Institute circa 1963 in X3.4. If you liked braille dump then please become a GitHub sponsor or join Justine's Patreon. PayPal donations are also accepted at jtunney@gmail.com.'''
