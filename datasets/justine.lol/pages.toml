["https://justine.lol/sectorlisp2"]
title = "LISP with GC in 436 bytes"
description = "LISP engine that's tiny enough to fit in a 512-byte master boot record"
full_description = "SectorLISP now supports garbage collection. This is the first time that a high-level garbage collected programming language has been optimized to fit inside the 512-byte boot sector of a floppy disk. Since we only needed 436 bytes, that means LISP has now outdistanced FORTH and BASIC to be the tiniest programming language in the world. SectorLISP consists of 223 lines of assembly. It provides a LISP system that's powerful enough to let you write your own LISP interpreter in just 40 lines of LISP. It's compatible with all PC models dating back to 1981 which have at least 64kb of RAM. This isn't a toy because SectorLISP can run the proof assistant that was included in LISP 1.5. We achieved the small file size thanks to 20/20 hindsight and an unbiased approach of maximum austerity. The goal of this project has been to have fun building a kit that optimizes for file size at the expense of everything else, which means SectorLISP has more in common with a game like Universal Paperclips than a talking paperclip like Clippy. This is a follow-up to a previous announcement made in October that SectorLISP now fits in one sector. There's been many changes over the past few months that made it possible to shave away another hundred bytes from the i8086 assembly implementation. It left plenty of room to add a 40 byte garbage collector. This blog post will tell the story of how our low-level assembly listing evolved, using a plain and simple C / JavaScript / Thompson Shell polyglot. sectorlisp.bin see also sectorlisp.S 436 bytes — BIOS only w/ i8086 architecture 8cad38486c2b92e8328de589f3aa35dbee1b357ec8bda2383bbb84093cc9a042 sectorlisp-friendly.bin see also sectorlisp.S 509 bytes — BIOS only w/ i8086 architecture 2b71dffae9900f3aa280ad6eb3bb2752dffb589a8d9a5463515683d03e7021d8 lisp.com see also lisp.js 20kb — Linux/Mac/Windows/FreeBSD/OpenBSD/NetBSD/BIOS 869abd2ebd9a31257b768398ac340967f888911dfa9152583fad79575ca11411 blinkenlights.com -rt sectorlisp.bin # runs emulator 319kb — Linux/Mac/Windows/FreeBSD/OpenBSD/NetBSD/BIOS 13434c53be973e1125c0f7821b59f9004083f189cdbcc8feefcc943f8258cce4"
