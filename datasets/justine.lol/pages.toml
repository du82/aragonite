["https://justine.lol/lambda"]
title = "Lambda Calculus in 383 Bytes"
description = "Programming language with a single keyword."
full_description = "The Lambda Calculus is a programming language with a single keyword. It's the Turing tarpit discovered by Turing's doctoral advisor. This blog post introduces a brand new 383 byte implementation of binary lambda calculus as an x86-64 Linux ELF executable. Friendly portable C code and prebuilt APE binaries are provided for other platforms too. SectorLambda implements a Church-Krivine-Tromp virtual machine with monadic I/O. In 383 bytes we've managed to achieve garbage collection, lazy lists, and tail recursion. The interpreter works by extracting the least significant bit from each stdin byte. Output consists of 0 and 1 bytes. It's 64-bit however displacement is limited to [0,255] so programs can't be too huge. That makes it a fun tool for learning, but for more industrial scale applications a 520 byte version is provided too, that overcomes many of those limitations, although it requires writing code at an even higher difficulty setting. Your program is read from stdin followed by its input. Here's a simple tutorial using the identity function (λ 0), which is encoded as (00 10) in the binary lambda calculus: Programs written in the binary lambda calculus are outrageously small. For example, its metacircular evaluator is 232 bits. If we use the 8-bit version of the interpreter (the capital Blc one) which uses a true binary wire format, then we can get a sense of just how small the programs targeting this virtual machine can be. This means that our 521 byte virtual machine is expressive enough to implement itself in just 43 bytes, which is one tenth its size! As a virtual machine it also has capabilities that the JVM lacks, even though it's literally six orders of a magnitude tinier. Something like this could have practical applications in compression formats, which need a small busy beaver that can produce large amounts of data. It's also just downright cool. For example, if you built a compression tool you could have it encode a file as a lambda expression that generates it. Since it's difficult to introduce a new compression format that most people haven't installed, you could prefix the compressed file with this 383 byte interpreter to get autonomous self-extracting archives that anyone can use. Binary Lambda Calculus would also make more sense than LISP as an embedded microprocessor."
year_published = 2025
clearnet = "https://justine.lol/lambda"
