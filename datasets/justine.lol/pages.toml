["https://justine.lol/make"]
title = "Using Landlock to Sandbox GNU Make"
description = "Sandboxing build systems has never been easier"
full_description = "I've modified GNU Make to support strict dependency checking. This is all thanks to the Landlock LSM system calls which were introduced in Linux Kernel 5.13 twelve months ago. What it means is that Make can now solve the cache invalidation problem similar to Bazel except with 5x better performance. I blogged last month about our work porting OpenBSD pledge() and unveil() to Linux as part of the Cosmopolitan Libc project. The thought occurred to me that sandboxes aren't just good for security: they have applications in build systems too. So I used unveil() to patch GNU Make so it can function like a zero-configuration sandbox, and I'm making this work available to the community using the Actually Portable Executable format. The basic idea is when Make runs a command, that command should only have access to a limited number of files: That way, if some rogue unit test accidentally tries to rm -rf /, the kernel will simply reject it using an EACCES error, because your root directory wasn't declared as a dependency in your Makefile config. For convenience, I've also chosen to implicitly whitelist a few other hard-coded paths. The following files are always unveiled by Make: Landlock Make is configured simply by writing a normal Makefile. For example, you can read the landlock-make/Makefile template to get the basic idea. However there's sometimes cases where you want to do something special. Special variables have been introduced for this purpose, which can be specified on a per-target basis: .UNVEIL works basically the same way as the new .EXTRA_PREREQS variable that was added to GNU Make this last year. You can specify as many paths as you want. The permission defaults to read-only, but you can override that by putting the appropriate letters with a colon in from of the file path. The permissions take effect recursively too. It's important to use the private keyword, because GNU Make variable inheritance makes it far too easy to accidentally remove safety from everything. For example, if you define a variable on a rule that generates an executable without using private, then the variable definition will also apply to all the object files going into that executable."
