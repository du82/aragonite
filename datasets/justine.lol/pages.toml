["https://justine.lol/mmap"]
title = "Edge AI Just Got Faster"
description = "Using mmap() to load LLaMA faster in parallel with less memory."
full_description = "When Meta released LLaMA back in February, many of us were excited to see a high-quality Large Language Model (LLM) become available for public access. Many of us who signed up however, had difficulties getting LLaMA to run on our edge and personal computer devices. One month ago, Georgi Gerganov started the llama.cpp project to provide a solution to this, and since then his project has been one of the hottest things on GitHub, having earned itself 19k stars. I spent the last few weeks volunteering for this project, and I've got some great news to share about its recent progress. We modified llama.cpp to load weights using mmap() instead of C++ standard I/O. That enabled us to load LLaMA 100x faster using half as much memory. Our changes have just been made available in the latest release. The benefits are as follows: One of the reasons llama.cpp attracted so much attention is because it lowers the barriers of entry for running large language models. That's great for helping the benefits of these models be more widely accessible to the public. It's also helping businesses save on costs. Thanks to mmap() we're much closer to both these goals than we were before. Furthermore, the reduction of user-visible latency has made the tool more pleasant to use. The new mmap() based loader is now available in the llama.cpp project, which is released under the MIT license on GitHub in both source and binary forms: New users should request access from Meta and read Simon Willison's blog post for an explanation of how to get started. Please note that, with our recent changes, some of the steps in his 13B tutorial relating to multiple .1, etc. files can now be skipped. That's because our conversion tools now turn multi-part weights into a single file. When the llama.cpp project received feedback that we should be using mmap() the first idea that came to mind was to find a way to make it work within the confines of our C++ library abstractions. @apaz-cli was the person who got the ball rolling on this. The basic idea we tried was to see how much better mmap() could make the loading of weights, if we wrote a new implementation of std::ifstream. This meant that, rather than having the underlying I/O implementation call read(), it would instead use mmap() from the constructor, and then the our_ifstream::read() function would just do a memcpy() under the hood."
