["https://justine.lol/sorting"]
title = "Understanding DeepMind's Sorting Algorithm"
description = "Working code examples meant to clarify AlphaDev's deep learning assembly optimizations."
full_description = "A few days ago, DeepMind published a blog post talking about a paper they wrote, where they discovered tinier kernels for sorting algorithms. They did this by taking their deep learning wisdom, which they gained by building AlphaGo, and applying it to the discipline of of superoptimization. That piqued my interest, since as a C library author, I'm always looking for opportunities to curate the best stuff. In some ways that's really the whole purpose of the C library. There are so many functions that we as programmers take for granted, which are the finished product of decades of research, distilled into plain and portable code. DeepMind earned a fair amount of well-deserved attention for this discovery, but unfortunately they could have done a much better job explaining it. Let's start with the assembly code they published for sorting an array with three items, translated from pseudo-assembly into assembly: I named this function move37() because the DeepMind blog post compares it to the 37th move AlphaGo made during its second match with Lee Sedol back in 2016. That's the move which stunned the experts who thought AlphaGo had made a mistake, but they were wrong, because the machine ultimately did achieve victory against its opponent, who saw himself as the Hector of humanity. So if we run the DeepMind code: That looks like a mistake to me. The array we gave it was {3, 1, 2} but move37() sorted it into {2, 1, 3}. DeepMind must be trolling us, because I don't believe that 2 comes before 1. Let's take a look at the open source contribution they made to LLVM libcxx which should hopefully clarify things: Now it makes sense. So move37() isn't actually a sorting function. It's a sorting kernel that's intended to be used as the building block of the sort3() function. It would have been nice if the paper and blog post had mentioned that, since it made me feel quite confused for the briefest of moments. Here's a better version of the code, which includes the missing swap operation."
year_published = 2025
