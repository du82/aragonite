["https://justine.lol/oneliners"]
title = "Bash One-Liners for LLMs"
description = "Tutorial on how llamafile makes LLMs shell scriptable."
full_description = "I spent the last month working with Mozilla to launch an open source project called llamafile which is the new best way to run an LLM on your own computer. So far things have been going pretty smoothly. The project earned 8.3k stars on GitHub, 1073 upvotes on Hacker News, and received press coverage from Hackaday. Yesterday I cut a 0.8.12 release so let's see what it can do. The easiest way to get started is to download one of my prebuilt .llamafile files on Hugging Face. The one we'll be using for this tutorial is a command-line interface for a multmodal vision model called LLaVA. It's able to do things that aren't possible with the OpenAI API, like describing images. The first step is to download your llamafile. It'll run on MacOS / Linux / Windows / BSDs. If you have any issues with the above, then see the Gotchas section of the README. MacOS users need Xcode. Linux users might need a binfmt_misc interpreter. Windows users need to rename the file to have a .exe suffix. I'm an old school UNIX hacker, so one of the ways I've been genuinely improving upon the llama.cpp codebase (on which llamafile is built) is by making it more shell-scriptable and writing man pages. The only thing better than having an LLM in one piece, is being able to program it on one line. This blog post describes my latest tricks. The llava-v1.5-7b-q4.llamafile program you downloaded earlier uses a multimodal vision model by default (unless you pass --mmproj '' as an argument). All you have to do is give it an --image GRAPHIC flag, which can be a jpeg, png, tga, bmp, psd, gif, hdr, pic, or pnm file. You then ask the vision model a question about the image using the --silent-prompt -p PROMPT flags, and it'll print an answer to standard output. Now here's your bash one-liner for image summarization (noting that you need to pass -ngl 999 to offload to NVIDIA and AMD GPUs): Here's the precise text you can expect llava v1.5 7b q4 w/ llamafile v0.3 to output in your terminal: The image features a group of three baby lemurs, two of which are being held by their mother. They appear to be in a lush green environment with trees and grass surrounding them. The mother lemur is holding her babies close to her body, providing protection and warmth. The scene captures the bond between the mother and her young ones as they navigate through the natural habitat together."
