["https://justine.lol/lex"]
title = "Weird Lexical Syntax"
description = "Let's explore the most unusual lexical syntax of popular programming languages."
full_description = "I just learned 42 programming languages this month to build a new syntax highlighter for llamafile. I feel like I'm up to my eyeballs in programming languages right now. Now that it's halloween, I thought I'd share some of the spookiest most surprising syntax I've seen. The languages I decided to support are Ada, Assembly, BASIC, C, C#, C++, COBOL, CSS, D, FORTH, FORTRAN, Go, Haskell, HTML, Java, JavaScript, Julia, JSON, Kotlin, ld, LISP, Lua, m4, Make, Markdown, MATLAB, Pascal, Perl, PHP, Python, R, Ruby, Rust, Scala, Shell, SQL, Swift, Tcl, TeX, TXT, TypeScript, and Zig. That crosses off pretty much everything on the TIOBE Index except Scratch, which can't be highlighted, since it uses blocks instead of text. It's really not difficult to implement a syntax highlighter. You could probably write one over the course of a job interview. My favorite tools for doing this have been C++ and GNU gperf. The hardest problem here is avoiding the need to do a bunch of string comparisons to determine if something is a keyword or not. Most developers would just use a hash table, but gperf lets you create a perfect hash table. For example: gperf was originally invented for gcc and it's a great way to squeeze out every last drop of performance. If you run the gperf command on the above code above, it'll generate this .c file. You'll notice its hash function only needs to consider a single character to get a collision free lookup. That's what makes it perfect, and perfect means better performance. I'm not sure who wants to be able to syntax highlight C at 35 MB per second, but I am now able to do so, even though I've defined about 4,000 keywords for the language. Thanks to gperf, those keywords don't slow things down. The rest just boils down to finite state machines. You don't really need flex, bison, or ragel to build a basic syntax highlighter. You simply need a for loop and a switch statement. At least for my use case, where I've really only been focusing on strings, comments, and keywords. If I wanted to highlight things like C function names, well, then I'd probably need to do actual parsing. But focusing on the essentials, we're only really doing lexing at most. See highlight_ada.cpp as an example."
