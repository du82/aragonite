title = "Day 5: I wrote a kernel module!!!"
description = "Day 5: I wrote a kernel module!!!"
full_description = "Day 5: I wrote a kernel module!!! • hackerschool • kernel • October 7, 2013 I WROTE A KERNEL MODULE. It doesn’t do anything useful or anything, but still! This is a pretty quick post because there was an awesome talk today by Mel Chua and I need to sleep. The source for the module is at https://gist.github.com/jvns/6878994 It intercepts any incoming packets and prints “Hello packet” to the kernel log for each one. It uses a the Netfilter framework, which I learned about from this document. To install it, you can run: $ make $ insmod hello-packet.ko and then $ rmmod hello-packet.ko to remove it. http://kernelnewbies.org is a fantastic resource and I’ve been learning a lot from it. Some more resources: Instructions for writing a “hello world” kernel module Some examples if you’re interested in learning about rootkits: 1, 2, 3, 4 (pdf) (I think I’m going to work on writing a rootkit tomorrow. eee.) Some things I learned along the way: You can’t use malloc inside the kernel (?!!?). This is because anything that’s used in the kernel needs to be defined in the kernel, and malloc is in glibc. This seems obvious in retrospect, but kind of blew my mind Similarly, you can’t use anything from glibc in the kernel. There are apparently things called kmalloc and vmalloc that you can use instead. I don’t know what these are yet. It is really easy to write a firewall that doesn’t let any packets in or out – just replace NF_ACCEPT with NF_DROP in my kernel module. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-ra