title = "Day 7: An echo server in Clojure"
description = "Day 7: An echo server in Clojure"
full_description = "Day 7: An echo server in Clojure • hackerschool • clojure • October 9, 2013 Today I spent some time on a fun kernel module, but it is not working yet! So here is what I also did. It did not take very long and I didn’t really learn too much Clojure doing this – this is really just procedural code written in Clojure. I can’t tell yet if this is an appropriate way to write a small Clojure program. Need to get some code review on this. But it works! You can see the code here: https://gist.github.com/jvns/6910896 You can interact with the server using netcat (see also: Day 2: netcat fun!). The -u option here tells netcat to use UDP instead of TCP. bork@kiwi ~/w/h/clorrent> nc -u localhost 12345 Hi, Clojure! Hi, Clojure! If you don’t want to set up a whole Leinengen project to run this, you can use lein-exec. This is the first step towards maybe writing a BitTorrent client in Clojure – many other people are writing BitTorrent client and really enjoying it, and I’m jealous. We’ll see if it happens! #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 6: I wrote a rootkit! Day 8: Julia writes Julia! And remembers that open source is hard."
