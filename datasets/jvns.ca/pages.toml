full_description = "Day 16: gzip + poetry = awesome • hackerschool • julia • favorite • gzip • October 24, 2013 Gzip compresses by replacing text with pointers to earlier parts of the text. Here’s a visualization of what actually happens when you decompress “The Raven”. It highlights the bits of text that are copied from previously in the poem. I showed this as a Thursday talk at Hacker School today :) I really like how you can see the rhyming inside the poem like (rapping… tapping) come out in the compression algorithm. No sound, just gzip. You can try it out if you want by cloning https://github.com/jvns/gzip.jl and checking out the ‘visualization’ branch. Edit: Thanks to a suggestion in the comments, here’s the whole poem and Hamlet. Edit: Some clarifications, for the interested: I implemented gunzip from scratch to learn how it works. This visualization is a small hack on top of that, just adding some print and sleep statements. You can see the source code that produces it. This in fact shows how LZ77 compression works, which is the first step of gzip (or DEFLATE) compression. The second step is Huffman coding and isn’t shown in the video at all :). If you want to know more, try this excellent but very long page. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { f