title = "So you want to be a wizard"
description = "So you want to be a wizard"
full_description = "So you want to be a wizard • talks • March 13, 2017 Today I did the opening keynote at SRECon. This talk was a little less technical than my normal talks: instead of talking about tools like tcpdump (though tcpdump makes an appearance!), I wanted to talk about how to make a career where you’re constantly learning and how to be good at your job whether or not you’re the most experienced person. Here’s the video, talk abstract, then the slides & a rough transcript. I’ve included links to every resource I mentioned. video source: usenix’s website abstract I don't always feel like a wizard. I'm not the most experienced member on my team, like most people I sometimes find my work difficult, and I still have a TON TO LEARN. But along the way, I have learned a few ways to debug tricky problems, get the information I need from my colleagues, and get my job done. We’re going to talk about how asking dumb questions is actually a superpower how you can read the source code to programs when all other avenues fail debugging tools that make you FEEL like a wizard and how understanding what your _organization_ needs can make you amazing At the end, we’ll have a better understanding of how you can get a lot of awesome stuff done even when you’re not the highest level wizard on your team. .container{display:flex;} .slide{ width:40%; border-bottom: 2px #ccc dashed; padding: 10px 0px; } .content{ width:60%; align-items:center; padding:20px; } @media (max-width: 480px) { .container{display:block;} .slide{width:100%;} .content{width:100%;} } So you want to be a wizard (this transcript is nowhere near totally faithful; there’s a fair amount of “what i meant to say / what I said, kind of, I think” in here :) ) You can click on any of the slides to see a bigger version. This talk is called “so you want to be a wizard”. The main problem with being a wizard is that, of course, computers are not magic! They are logical machines that you can totally learn to understand. So this talk is actually going to be about learning hard things and understanding complicated systems. I work as an engineer at Stripe. (this is the job description for my job). My team is in charge of a ton of things. Every so often I find out about a new thing that we’re in charge of (“oh, there’s a GPG keyserver we depend on? Okay!!”) What this means is that I (like many of you!) need to know about a ton of different systems. There are about a million things to know about Linux & networking, the AWS platform is really complicated and there’s a ton to know about how it works exactly. And there’s a seemingly neverending amount of new technology to learn about. For instance we’re looking at Kubernetes, and to operate a Kubernetes cluster you need to operate etcd, which means that you need to understand a bunch of distributed systems concepts to make sure you’re doing it right. So to do my job effectively, like many of you, I need to constantly learn new things. This talk is about how to do that, and why I like it. Here are the wizard skills we’re going to be discussing in this talk! In software engineering, I think it’s really important to understand both the systems that are a little higher-level than you and lower-level systems. In reliability engineering, what lives below us is typically “systems stuff” like operating systems & networking. Above us is stuff like business requirements & the programs we’re trying to make run reliably. This talk is mostly going to be about understanding lower-level systems, but we’re also going to talk a little about humans and how to make sure you’re actually building the right thing :) As a quick aside, I think understanding computer networking is so important that I wrote a whole zine about it, which you can pick up at the end of this talk. So – why is it important to understand the systems you work with? I think there are 3 main important reasons: First, understanding jargon is really useful. If someone says “hey, this process got killed by the OOM killer” it’s useful to know what that means! (we’re going to talk about what an OOM killer is later) second, it lets you debug harder problems. When I set up a web server (Apache) for the first time, maybe 8 years ago, I didn’t understand the HTTP protocol very well and I didn’t understand what many of the configuration options I was using meant exactly. So I would normally debug by Googling things and trying random fixes. This was a pretty viable strategy at the time (I got my webservers working!) but today when I configure webservers, it’s important for me to actually understand what I’m doing and exactly what effect I expect it to have. And now I can fix problems much more easily. rachelbythebay is a great collection of debugging stories, and it’s clear throughout that she has a really deep understanding of the systems she works with. The last reason is – having a solid understanding of the systems you work with lets you innovate. I think Docker is a cool example of this. Docker was not the first thing to ever use namespaces (one of the kernel features that people call “containers”), but in order to make a tool that people loved to use, the Docker developers had to have a really good understanding of exactly what features Linux has to support isolating processes from others. A system like Linux seems really intimidating at first, especially if you want to understand some of the internals a little bit. It’s like 4 million or 10 million lines of code or something. So let’s talk about how to break off pieces of knowledge one at a time so that you can tackle the challenge! My first favorite thing to do is learn fundamental concepts. This is incredibly useful – in networking, if you know what a packet is and how it’s put together, then it really helps to tackle other more complicated concepts. Let me tell you a quick story about how I learned what a system call was. The Recurse Center is a 12 week programming retreat in New York where you can go to learn fun new things about programming. I went 3 years ago. RC is about learning whatever interests you (low level stuff? fancy frontend tricks? functional programming? making cool art with programming?), and I went partly with the goal of understanding operating systems better. When I got to RC, I learned about the concept of a “system call”! (here’s the blog post I wrote the day I learned that). System calls are how applications talk to the operating system. I felt kind of sad that I didn’t know about them before, but the important thing was that I learned it! That’s exciting! This is the only piece of homework in this talk :) TCP is the protocol that runs a lot of the internet that we use day to day. Often it “just works” and you don’t need to think about it, but sometimes, well, we do need to think about it! So it’s helpful to understand the basics. The way I started learning about TCP was, I wrote a TCP stack in Python! This was really fun, it didn’t take that long, and I learned a ton by doing it and writing up what I learned. I also like to do experiments. You can make your laptop run out of memory on purpose! I would show you what happens (remember the “OOM killer”? it’s a system in the Linux kernel that starts just killing programs on your computer!), but I think it might not be a good live demo for a talk :). I think doing this kind of experiment is awesome because servers run out of memory in production, and it’s cool to see what that looks like and how to reason about it in a safer environment. (hint: if you run “dmesg” and search for “oom” it will show you OOM killer activity) Also at the Recurse Center, I decided I wanted to write a tiny operating system in Rust. It turns out that writing an OS in 3 weeks when you don’t know Rust or operating systems is hard, so I ended up writing a keyboard driver. I learned SO MUCH by doing this – you can read more about it here These are the programming experiment rules I like to follow. Sometimes I like to read books! Two books I’ve learned from in the last couple years are Networking for System Administrators & Linux Kernel Development. Networking for System Administrators is written for system administrators who want to be able to do basic networking tasks without having to ask their networking team. I’m not a system administrator, and I don’t have a networking team, but I learned a ton by reading this book. Another thing that I find super helpful is to try to read things or watch talks that are too hard for me at the time. For example, aphyr has an amazing series of posts about distributed systems failures (the ones called “Jepsen”). When I started reading these posts, I honestly didn’t understand them very well. I didn’t understand what “linearizable” meant, and I’d never worked with distributed databases. So sometimes I’d read a post and only understand maybe 20% of it. As I learned more and came back to his writing, I was able to understand more of it! I’m still not a distributed systems expert, but I’m happy I tried to read these posts even when I didn’t understand them well. That Linux kernel development book I mentioned is kind of similar. Its goal is to give you the tools you need to become a Linux kernel developer. I am not a Linux kernel developer (or at least not yet!). But I’ve learned a few interesting things by reading this book. Another maybe obvious tactic is to work with the thing in your job. Recently I needed to add some logging to a HTTP proxy we had. This was a relatively mundane task, but I learned more about how HTTP proxies work exactly by doing it! That was cool! It’s useful for me to remember that I can learn something even when I’m doing work which is sort of routine. This is the last, and maybe most important thing. I have models of how a ton of systems work in my head. Sometimes what happens on the computers work with does not match what my model says! As a small example – recently we had a computer that was swapping even though it had 16GB of free memory. This did not match my mental model (“computers only swap memory to disk when they’re out of memory”). Obviously there was something wrong with my model. So I investigated, and I learned a couple new things about how swap works on Linux! It turns that there are actually at least 4 reasons a Linux box might swap. You could be actually out of RAM. You could be “mostly” out of RAM. The “vm.swappiness” sysctl setting controls how likely your machine is to swap. This isn’t what was happening to us, though. A cgroup could be out of RAM, which was what was happening to us at the time (here’s the blog post I wrote about that). There’s also a 4th reason I learned about afterwards: if you have no swap, and your vm.overcommit_ratio is set to 50% (which is the default), you can end up in a situation where only half your RAM can be used. That’s no good! here’s a post about overcommit on Linux So it turns out understanding swap isn’t actually that simple. In fact, there’s a cool 200-page book Understanding the Linux Virtual Memory Manager. It also has a bunch of annotated kernel code that handles memory management, which is awesome. I’m happy I dug in a bit because now I understand how this part of Linux works better! So even getting to understand something that seems relatively basic like “when does a computer start swapping?” can take a while! There’s a lot to know, and it’s totally okay to not know it all right away. A quick story on my Linux journey: In 2003, when I was 15, my mom bought me a shiny new computer. I was really excited about Linux, so I installed a ton of different Linux distributions. (also, thanks to my mom!! I’m super lucky to have had a computer that I could bork repeatedly and the time & space to do tons of experiments) Around 2009, in university, I was one of the sysadmins for a small lab of 7 Linux & Windows computers. The old sysadmin said “hey, want to help out?”, gave me the root password, and we muddled our way through getting the computers to work for a bunch of math undergrads. In 2013 I learned what a system call is and a bunch of basic things about operating systems! This was super awesome. (here’s everything I learned at the Recurse Center < And now I’m still continuing to learn. The next wizard skill I’m going to talk about is asking great questions! A (great) situation I end up in a lot is where I have a coworker who knows something that I want to know, and they want to help me, and I just need to figure out the right questions to ask to get the answers I want! Asking good questions is really important because people in general cannot just magically guess what I want them to tell me. One of my favorite tricks is to state what I know, as a way to frame my question. Stating what I know is awesome because it helps me organize my thoughts, reveals misunderstands (me: “I know X”, them: “that not quite right!”), and helps me avoid answers that are too basic (yes yes yes i know that!) and too advanced (NO PLEASE BACK UP 30 STEPS FIRST). When asking a question, it’s pretty natural to want to ask the most experienced person around your question. They will probably know the answer, which is good! But I don’t think it’s the best strategy. Instead, I instead try to remember to ask a less experienced person, who I think will still know the answer. This is awesome because it reduces the load on the more-experienced person. But there’s more reasons this is great! I’m not the most experienced member of my team. I love it when people ask me questions because – if I don’t know the answer to their questions, then I can find out, and I can grow my own knowledge. So not asking the most experienced person is actually a cool way to show trust in less experienced team members, reduce the bus factor, and spread knowledge around. Doing research is great! It lets me ask more complicated and interesting questions! I really like to ask questions that are relatively easy to answer. yes/no questions are a really good way to accomplish this! And often an interesting yes/no question can lead to a great discussion. When debugging or fixing things, often you can end up in a situation where someone who’s super experienced knows how to Do A Thing, and other people on the team don’t know how. And often they have trouble remembering all the details to document them! So I like to (right after someone did something) to ask them to explain exactly what they did, or to ask if I can watch while they do it. The last thing I have to say about asking about questions, especially to senior engineers / managers / leaders is – please ask questions in public. I find that it’s much easier for senior people to admit that they don’t know something (because everybody knows you’re competent already!), and doing that really creates space for everyone to ask questions. Okay, let’s talk about reading code! Sometimes error messages are not particularly helpful. If you go read the code around where the error message got printed, sometimes you can get a bet"
