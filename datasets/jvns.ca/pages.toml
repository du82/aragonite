["https://jvns.ca/blog/2013/12/27/guys-guys-guys"]
title = 'When is "guys" gender neutral? I did a survey!'
description = 'When is "guys" gender neutral? I did a survey!'
full_description = 'When is "guys" gender neutral? I did a survey! • favorite • December 27, 2013 The other day I was having a discussion with someone about whether or not “guys” was a gender-neutral term. This person said “my friends totally think it is!”, and I verified with my friends, who totally said it wasn’t. Not the best grounds for a discussion. So I ran a slightly-more-scientific survey. Here are the survey questions, which you can still answer if you like. This resulted in a bunch of discussion on Twitter, which was at least as interesting as the survey results. Lots of people wanted to know the results, so here they are! About 2300 people replied. You can download the entire result set from the GitHub repository. Here’s a summary of the survey results. I’ve split it up by gender: I asked each person “Do you identify as a woman?”, so I’ve split the categories into “Women”, and “Men + Other”. The main thing I find interesting here is how women and men perceive these words differently: about 50% of men (+ other) think that “Java guys” is gender neutral, while only 25% of women do. There’s a similar split for “Python guy” and “Erlang guy”. The image probably appears too small here: click for the bigger image. Here’s the gender distribution: Issues with the survey This really isn’t meant to be a scientific study or anything – think of it as informally polling a few of your friends, except if you had a lot of friends. But here are some of the science issues: The gender split question could be better. Specifically, I’d use: “How do you identify? m/f/other”. There’s tons of selection bias, because the survey was only distributed through Twitter retweets. The framing of the survey is pretty biased – I said things like “someone is trying to convince me that ‘guys’ is a gender neutral term” in my tweets about the survey. People could optionally fill in where they were from, but I ignored that information. There are a lot of shades of grey: ideally people would rate each sentence on a 5-point scale or something. I think presenting this as a survey was a great way to get people to engage in a discussion in a mostly non-heated way and think about the way they use language. Several people told me that they thought that “guys” was a totally gender-neutral term and were surprised by their results when they took the survey. Awesome! A++ would survey again. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe A pandas cookbook Coding strategies'
