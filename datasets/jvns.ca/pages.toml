description = "Day 10: Goals. Goals? Maybe I need to be *reading* more code?"
full_description = "Day 10: Goals. Goals? Maybe I need to be *reading* more code? • hackerschool • October 16, 2013 Today I learned a bit of Clojure, and learned about a Julia plotting library called Gadfly.jl But it didn’t feel super productive, and now I’m thinking a bit about what my goals for Hacker School are. I think they’re something like: Contribute to open source projects! This is happening. Write a non-trivial piece of software from scratch that I feel good about the design of. This is not happening at all. Still hunting for something which is the right size and which I can care about enough to do it. Feel better about my ability to design good code. Also not happening yet. Learn about concurrency, because I don’t even. Learn about how to write practical functional programs. To address #3, I think I need to spend more time reading well-written code. I’m still not sure about #2. Or #4. Or #5. So far the things that have taught me the most were: doing a bit of async programming Learning about how Python bytecode works Maybe writing a Javascript interpreter would be a fun way to address numbers 2, 3, and 4? #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 11: How