title = "Day 24: Unit testing this TCP library"
description = "Day 24: Unit testing this TCP library"
full_description = "Day 24: Unit testing this TCP library • hackerschool • November 7, 2013 Today in morning checkins I realized I’d been having a lot of trouble testing this TCP library yesterday, because all of the tests needed to use the network. So now I have better unit tests which don’t need to sleep and use the network! I did this by adding a MockListener class which takes packets. The actual sending-packets-over-the-network tests no longer pass, because right now I’m just writing to the mock unit tests. But now the tests are a) faster (0.009 seconds instead of 5 or 10), and b) deterministic (they do the same thing every time) So this is much better. The implemention is still pretty much a scattered mess. I tried to deal with replies to packets and completely failed. I’m at the point where I have no idea of how to implement this TCP state machine. My plan for fixing this is to read this tiny implementation of TCP – it’s about 1000 lines of C. Right now I have about 100 lines of Python, and I don’t even have to unpack the packets or anything because scapy does that. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 22: Got some TCP packets back! Women in Technology