full_description = "Day 29: Trying out Emacs! • hackerschool • November 18, 2013 At Hacker School I’ve been watching all the Lisp wizards with their emacs attached to magical running Lisp processes where they can change and reload the code in real time. And I am officially jealous. So I am trying out emacs! Tomorrow I will write Clojure and use Overtone to generate music and it will be wonderful. And there was a fantastic talk today by Will Byrd about logic & relational programming where he showed how to automatically generate quines and it was mindblowing and fun. So I think I’m going to end up playing with Clojure’s core.logic a bit, because fun. Definitely using evil mode, though, because I haven’t spent years practicing vim keybindings for nothing =). #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 28: Made a git workflow visualization webapp! Day 30: Making music in Clojure with Overtone. Clojure bugs with laziness! Fun!"
