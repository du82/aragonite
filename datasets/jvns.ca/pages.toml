full_description = "Papers I like Here’s a very short list of computer science papers I like. I read very very few papers but I started this list because every so often I find a new one. Machine Learning: The High Interest Credit Card of Technical Debt (2014). I liked this paper because it resonated with my experience of doing machine learning at the time that I read it. Some were meant for C (Stephen Kell, 2017). I felt like this paper described why I feel an affinity for C even though I literally never write C programs. What we talk about when we talk about monads (Tomas Petricek, 2012). I’ve read a lot of things about monads and this is the only one that helped me understand what’s going on with them. I love that it talks about cases where monads have been misapplied and the social aspects of how they’re used."
