["https://jvns.ca/blog/2016/07/03/debugging-tools-i-love"]
title = "Linux debugging tools I love"
description = "Linux debugging tools I love"
full_description = "Linux debugging tools I love • favorite • July 3, 2016 I gave a talk this weekend about debugging tools I love (here are the slides, such as they are). I think of these tools like a swiss army knife – if something on your system is wrong or slow, in any programming language, knowing how to use them can really help you out. I’ve written pretty extensively on this, but I didn’t have a central list to refer to. So! Here’s the list of my current favorite tools. There are only 5! I’ve used all of them (except opensnoop) to debug actual problems. tcpdump and wireshark and opensnoop are also things that you can have on OS X. strace A tool that traces system calls. My favorite thing. I have a bunch of posts with examples of how to use it on this blog. If you want to read what I think of it you should read the fanzine reference that you can read here. strace is pretty broadly useful, but keep in mind it can really slow down your programs. I would be remiss if I did not mention the even-more-awesome dtrace. Colin Jones has a nice introduction. dstat A really simple tool that prints out how much data got sent over the network / written to disk every second. This is great when you suspect something is going on with network/disk usage and want to see what’s happening in real time. There’s also iostat and netstat and atop and a bunch of other tools, but dstat is my favorite. tcpdump + wireshark For spying on network traffic. I wrote an introduction explaining how to use them in tcpdump is amazing. When using these, it really helps to have a basic understanding of how networking works. Luckily the basics (“what’s the difference between IP and TCP and HTTP? what’s a network packet?”) are totally possible to pick up :D. perf Have a C program and want to know which functions it’s spending the most time in? perf is a sampling profiler for Linux that can tell you that. perf top gives you a live view of which functions are running right now, just like top. I like to use perf top no matter what language my programs are written in, just to see if I can understand anything from it. Sometimes it works! node.js has built-in support for using perf to show you which Node function is running right now. You can also get this for JVM programs with perf-map-agent. Brendan Gregg’s website has the best introduction to perf I know. You can use perf to generate amazing flame graphs like this: opensnoop Opensnoop is a new script that you can get as of Ubuntu 16.04. It’s a delightfully simple tool – it just shows you which files are being opened right now on your computer. And it’s fast, unlike strace! opensnoop also exists on OS X and does basically the same thing. Go to the iovisor/bcc repo on github for installation instructions. It works using eBPF, which is a new thing that I will not explain yet here but Brendan Gregg has been writing about enthusiastically for some time. You don’t need to know how it works to use it, though :). #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe PolyConf 2016 How do HTTP requests get sent to the right place?"
