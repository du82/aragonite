["https://jvns.ca/blog/2013/12/10/day-40-12-things-i-learned-today-about-linkers"]
title = "Day 40: 12 things I learned today about linkers."
description = "Day 40: 12 things I learned today about linkers."
full_description = "Day 40: 12 things I learned today about linkers. • hackerschool • how-things-work • December 10, 2013 I read 11 parts of this series on linkers today. I also wrote an epic blog post, but here is the tl;dr version (trying to synthesize…). This is all about ELF. I use “ELF file” and “object file” interchangeably. In no particular order: To inspect an ELF object file, you can use objdump, readelf and/or nm. Executable files have segments and sections. Each segment has many sections. The operating system looks at the segments, not the sections. Read/Write/Execute permissions are controlled per segment, not per section. [Part 8] ELF symbols have types! And different visibility options! [Part 5] The linker knows about threading, and does optimizations to make threading easier. [Part 7] An object file can define two symbols with the same name and different symbols, for backwards compatibility. [Part 9] Those .a files? Those are just collections of .o object files, and they’re called “archives”! [Part 11] Linkers can work in parallel to some extent. [Part 10] Linkers actually have to do fairly complicated stuff to allow the code in a shared library to be shared between different programs and save memory. [Part 6] for memory savings, [Part 4] for the PLT/GOT There’s more than one way to link a shared library, and the choices you make affect how quickly it loads [Part 4] In the Mach-O executable format you can have assembly code for differrent architectures in the same executable. Nuts. And there’s FatELF that extends ELF to do the same thing. (edit: and isn’t being developed anymore) Every .o file has a “relocation table” listing every single reference to a symbol that the linker will need to update, and how it will need to update it. [Part 2] If you’re making a speed comparison for a linker, you might compare it to cat. [Part 1] I’m curious about these ELF symbol versions – they sound kind of like polymorphism to me, and I’m wondering why people use symbol name mangling to implement polymorphism instead of symbol versions. Probably very good reasons! #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 40: Linkers are amazing. Day 39: Writing malloc wrong, for fun"
