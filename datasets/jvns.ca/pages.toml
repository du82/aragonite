full_description = "Day 28: Made a git workflow visualization webapp! • hackerschool • November 15, 2013 Yesterday and today I made the Git pictures from Wednesday’s post into a website! How it works: You tell it the sequence of git commands you’ve ever executed. It gives you back pretty pictures. Like this fantastic picture of Selena Deckelmann’s workflow! I really like how this one makes it clear when you’d want to use rebase (in between commit and push), or stash (before checkout and pull). It is a thing of beauty. You can make your own at https://visualize-your-git.herokuapp.com. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 27: Automatically testing changes in state! Visualizing my Git workflow! Floats! Day 29: Trying out Emacs!"
