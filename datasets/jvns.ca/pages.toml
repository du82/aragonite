title = "Talk: Building a Ruby profiler"
description = "Talk: Building a Ruby profiler"
full_description = "Talk: Building a Ruby profiler April 16, 2018 .container { display: flex; margin-bottom: 5px; } .slide { width: 50%; } .content { width: 50%; align-items: center; padding: 20px; } @media (max-width: 480px) { /*breakpoint*/ .container { display: block; } .slide { width: 100%; } .content { width: 100%; } Last month I gave a talk at Localhost, the Recurse Center’s monthly talk series. My favourite thing about Localhost’s talk format is that speakers give relatively in depth talks about technical topics, and then people ask lots of questions at the end. This talk is about the core of rbspy – how do we read memory out of the Ruby interpreter to figure out what function a Ruby process is running? How do we do that in a way that works across multiple Ruby versions? Do we need to stop the Ruby process to figure out what function is running? The talk is 30 minutes and it’s followed by about 30 minutes of questions. The audio is a bit sketchy in places. Here’s the video: #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Reverse engineering the Notability file format New zine: Profiling & tracing with perf!!"
