title = "Day 1: What does a shell even do?"
description = "Day 1: What does a shell even do?"
full_description = "Day 1: What does a shell even do? • hackerschool • September 30, 2013 So I’m working on writing a shell in C a little bit. Before yesterday, I didn’t have a very clear idea of what writing a shell even meant. Here are some things that your shell has to do! I’m sure there are some Important Things missing. Parse what you type in to figure out which are the commands and which are the arguments (ls -la LICENSE) expand ls * into ls file1 file2 file3 ... Pipes! If you write ls | grep blah, it needs to send the output from ls into grep. And redirection too. Signal handling! If you press Ctrl+C, it needs to send that signal to whatever process you’re running. Or something. I don’t really understand this yet. Process management! Lets you background and foreground jobs. (Ctrl+z and fg and bg) Shell scripting! (for loops and things) And a thing the shell doesn’t have to do: Figure out which command to execute using the $PATH environment variable. exec does that, apparently. I think I’m going to work on implementing pipes & redirection & signal handling. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Hacker School Day 1: Messing around with the stack in C Day 2: 