title = "Montreal All-Girl Hack Night #2: now with cookies"
description = "Montreal All-Girl Hack Night #2: now with cookies"
full_description = "Montreal All-Girl Hack Night #2: now with cookies January 27, 2013 The second hack night was as awesome as the first one – I worked on making music with arduinos with Floh, and other people worked on a netflix autocompleter, a keyboard music-making program in clojure, learning R, and some other things I didn’t catch since I was too busy coding. Turns out using a piezo speaker to make music is pretty easy! To encourage people to do more coding, we gave cookies to everyone who coded. As a result, there was way more coding :) And there may be a workshop next time! A few things: less people came this time, but I’m blaming that on the cold :) We made a wall of post its with programming project ideas. I’m not totally sure if anyone actually got any programming ideas from it, but it was a good conversation starter Someone came up to us after and offered to give an R workshop next time! Yay! We gave cookies to anyone who was anywhere near a computer or looked like they might be looking at code Some people still seemed to want more of a theme or direction for what to work on It continued to cost about $80. Yay! Next month: Google Montreal is hosting! #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a w