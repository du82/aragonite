["https://jvns.ca/blog/2013/11/06/day-23-started-writing-a-socket-library"]
title = "Day 23: Started writing a TCP stack in Python"
description = "Day 23: Started writing a TCP stack in Python"
full_description = "Day 23: Started writing a TCP stack in Python • hackerschool • November 6, 2013 For the last couple of days I’ve been trying to understand how TCP works, because networking is really fun. Yesterday I realized that I really hadn’t been writing as much code as I want to be, though. So I’ve started working on a mini TCP stack! I’m not sure yet how far this will go, but so far I’m running into tons of problems, so I think this might be a good choice. The code so far is at https://github.com/jvns/teeceepee. Here are the parameters: Built on top of scapy, so I don’t have to actually know how the bits of a TCP packet are put together I do, however, need to use raw sockets in order to be able to send TCP packets, so everything has to run as root So far I have A TCPSocket class, which manages connections to servers and keeps some state. Right now my states are CLOSED, SYN-SENT, and ESTABLISHED. I’m using this diagram as a reference. A TCPListener class, which is responsible for managing all the sockets that might be open. Basically it has a dictionary that maps ports to TCPSocket instances. I have no idea if this is actually how socket libraries work. There’s a thread that listens for packets that are coming in and sends them off to the appropriate TCPSocket instance for handling, using the dispatch method. This is my first time using threads pretty much ever. Expecting all the problems. The listener thread starts when I import the tcp module and ends when the program importing it ends. Right now I can establish a connection (send a TCP handshake) send some data (but not parse the response) Tomorrow I’m hoping to be able to tear down a connection properly and assemble the packets I’m receiving into some actual data. One of the things that is the most challenging so far is that I keep starting and stopping the library, so there are all kinds of connections that just die. Also I think the servers I’m interacting with think I’m unreliable, so sometimes they send me packets slowly. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe NYC Python talk Day 22: Got some TCP packets back!"
