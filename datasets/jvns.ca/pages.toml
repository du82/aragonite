title = "Day 2: netcat fun!"
description = "Day 2: netcat fun!"
full_description = "Day 2: netcat fun! • hackerschool • October 1, 2013 Today Alan taught me some things about networking. IN PARTICULAR that you can transfer a file to your friend on your local network with netcat. Also it is pretty fun to watch the transfer with Wireshark. Here’s how it works: I run netcat -l 12345 > file.pdf or netcat -l -p 12345 > file.pdf depending on my version of netcat. (BSD vs not-BSD or something) You run netcat $MY_IP_ADDRESS 12345 < file.pdf Then you wait a while until you think it’s probably done and stop it. And I have the file! That is all. Since you can see the whole thing in Wireshark, it is not secure or anything and anyone in the middle could also get the file. FUN. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 1: What does a shell even do? Day 3: What does the Linux kernel even do?"
