title = "Where to find bike sharing systems' data feeds"
description = "Where to find bike sharing systems' data feeds"
full_description = "Where to find bike sharing systems' data feeds October 6, 2013 Bike sharing systems by Bixi publish information about how many bikes and docks are available at each station about every minute, as XML or JSON. People sometimes ask me where the feed is for this data, as it’s not always advertised on their website. Here are the feeds for all the systems so far: XML feeds: Toronto - http://toronto.bixi.com/data/bikeStations.xml Montreal - http://montreal.bixi.com/data/bikeStations.xml Ottawa - http://capital.bixi.com/data/bikeStations.xml Washington D.C. Capital Bike Share - http://www.capitalbikeshare.com/data/stations/bikeStations.xml Minneapolis Nice Ride - http://secure.niceridemn.org/data2/bikeStations.xml Boston Hubway - http://thehubway.com/data/stations/bikeStations.xml London Barclay’s Cycle Hire - http://www.tfl.gov.uk/tfl/syndication/feeds/cycle-hire/livecyclehireupdates.xml JSON feeds: New York Citi Bike - http://citibikenyc.com/stations/json Melbourne Bike Share- http://www.melbournebikeshare.com.au/stationmap/data Bay Area Bike Share - http://bayareabikeshare.com/stations/json Chicago Divvy Bikes - http://divvybikes.com/stations/json Chattanooga - http://www.bikechattanooga.com/stations/json Columbus CoGo Bike Share - http://cogobikeshare.com/stations/json Aspen WE-cycle - https://www.we-cycle.org/pbsc/stations.php Other: Washington State University’s Green Bike system has an unfortunate situation where the availability data is embedded in the source of their homepage (near the end). I’ve found that there are some irregularities in the feed format, and sometimes it changes without notice. It may have stabilized now though. Happy hacking! #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-c