title = "Blogs I like"
description = "Blogs I like"
full_description = "Blogs I like Here are some of my favourite tech blogs. For each one I’ve linked to a specific blog post that I particularly liked. I also have a list of papers I like. Andy Baio’s waxy.org (every post is itself a single link) Andy Wingo (Fibs, lies, and benchmarks) Bonnie Eiseman (More than Coding: What is Exploratory Work?) Camille Fournier (How Do Individual Contributors Get Stuck? A Primer) Cathy O’Neil (IB’s grading algorithm is failing students) Chelsea Troy (Designing a Course 3: What will we do in a session?) CSS Tricks (Centering in CSS: A Complete Guide) Dan Luu (Files are hard) Gretchen McCulloch’s All Things Linguistic (not a tech blog but very fun) James Mickens (The Night Watch). Not a blog but his articles are amazing. Jeff Fowler (Wat is up with WebAssembly) Jessie Frazelle (LD_PRELOAD: The Hero We Need and Deserve) Kamal Marhubi (Segfaults are our friends and teachers) Kyle Kingsbury (Hexing the technical interview) Kyle Kingsbury (again)’s Jepsen analyses Lara Hogan (What does sponsorship look like?) Lindsey Kuper (An example run of the Chandy-Lamport snapshot algorithm) Marianne Bellotti (All the best engineering advice I stole from non-technical people) Mark Dominus (Don’t tug on that, you never know what it might be attached to) Monica Dinculescu (Emoji: how do you get from U+1F355 to 🍕?) Nadia Eghbal (Reimagining the PhD) Nelson Elhage (Computers can be understood) rachel by the bay (A mystery with memory leaks and a magic number) Raph Levien (xi-editor retrospective) Robert Heaton (How does a TCP Reset Attack work?) Safia Abdalla (Getting into git init) Amy Hoy & Alex Hillman’s Stacking the Bricks (The Fine Art of “Flintstoning”) Sumana Harihareswara (a review of “Lower Ed: The Troubling Rise of For-Profit Colleges”) The Morning Paper (How bad can it git? Characterizing secret leakage in public GitHub repositories) Vicki Boykis’ Normcore Tech (Google Drive is Production) without boats (Not Explicit (on different things “explicit” can mean in Rust)) I wrote this list using some somewhat arbitrary constraints, to narrow it down from the maybe 150 blogs I have in my RSS reader: the person has posted in the last 2 years (there are so many blogs I love that have mostly stopped posting!) there are “a lot” of posts, for some arbitrary definition of “a lot” (there are so many blogs I love where the person has only written like 5 posts!) I subscribe to it with RSS (there are so many blogs that I come across on Twitter and look extremely great and that I forget to subscribe to!) (obviously) that I like reading the blog"
