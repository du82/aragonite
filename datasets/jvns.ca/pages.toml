title = "Talks"
full_description = "Talks Here’s a mostly up to date list of all the talks I’ve given. Making Hard Things Easy (keynote, Strange Loop 2023) transcript Learning DNS in 10 years (keynote, RubyConf Mini, 2022) transcript High Reliability Infrastructure Migrations (keynote, KubeCon NA 2018) slides Abstract: For companies with high availability requirements (99.99% uptime or higher), running new software in production comes with a lot of risks. But it’s possible to make significant infrastructure changes while maintaining the availability your customers expect!I’ll give you a toolbox for derisking migrations and making infrastructure changes with confidence, with examples from our Kubernetes & Envoy experience at Stripe. Build impossible programs (Deconstruct 2018) transcript + video Building a Ruby profiler (Localhost, March 2018) Tech talk about what was involved in building a Ruby profiler. transcript So you want to be a wizard (keynote, SREcon 2017) See also transcript+slides and the accompanying zine A swiss army knife of debugging tools (Strange Loop 2016) Also see Transcript + slides and the accompanying zine An overview of a bunch of Linux debugging tools you might love. I handed out zines at the end. Learning systems programming with Rust (RustConf 2016) Transcript + slides Keynote at RustConf 2016. On how anyone can be a systems programmer. How to trick a neural network (!!Con 2016) Systems programming as a swiss army knife (PyCon 2015) Abstract: You might think of the Linux kernel as something that only kernel developers need to know about. Not so! It turns out that understanding some basics about kernels and systems programming makes you a better developer, and you can use this knowledge when debugging your normal everyday Python programs. PyCon, April 2015 Opening statements: PyCon 2015 In which I very excitedly welcome everyone to the conference. this was the first time I spoke in front of more than 1000 people and it was super fun. You can be a kernel hacker! (Strange Loop 2014) Strange Loop, September 2014 Abstract: Writing operating systems sounds like it’s only for wizards, but it turns out that operating systems are written by humans like you and me. I’m going to tell you what a kernel is and why you should care. Then we’ll talk about a few concrete ways to get started with kernel hacking, ranging from the super-easy to the terrifyingly difficult. Spying on your programs with strace (!!Con 2014) !!Con, May 2014 In which I am EXTREMELY EXCITED about explaining how to use strace to debug your code. (errata: sysdig is in fact linux-only!) Diving into Open Data with IPython Notebook & Pandas (PyCon 2014) PyCon, April 2014 Demo of how to use IPython Notebook & Pandas to find out whether people like to cycle when it rains (spoiler: they don’t). Video, IPython notebook"
