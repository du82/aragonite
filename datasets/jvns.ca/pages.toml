title = "Hacker School Day 1: Messing around with the stack in C"
description = "Hacker School Day 1: Messing around with the stack in C"
full_description = '''Hacker School Day 1: Messing around with the stack in C • hackerschool • September 30, 2013 Today was the first day of Hacker School. There were tons of amazing people and it was fun and a bit overwhelming. I paired with Daphne on a shell in C which is called _dash right now. She is fantastic and taught me tons of things about C. When trying to tokenize strings in our shell, we ran into a super unintuitive bug. Here’s the gist of it: #include <stdio.h> void set_strings(char*** strings) { char* strs[] = {"banana"}; *strings = strs; } int main() { char** strings; set_strings(&strings); printf("First print: '%s'\n", strings[0]); char* s = "abc"; printf("Second print: '%s'\n", strings[0]); } So this looks like normal code that would print “banana” twice. But here’s what actually happens: bork@kiwi ~/w/h/gists> gcc write-to-stack.c&& ./a.out First print: 'banana' Second print: 'UH�WAVAUE1TE1H�H�' As I understand it, this is because this line: char* strs[] = {"banana"}; gets allocated on the stack and not on the heap. So the pointer in strings points to the stack and when you do something like setting a variable, it becomes something weird. It took us a while to figure out what was going on. YAY! It’s sort of exciting to get bugs that are (as far as I know) totally impossible in Python. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800p