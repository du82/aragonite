title = "Day 25: ACK all the things"
description = "Day 25: ACK all the things"
full_description = 'Day 25: ACK all the things • hackerschool • November 12, 2013 Today I worked some more on my TCP stack! I read a bit of Stevens’ TCP/IP Illustrated, where I obtained exactly one insight: every TCP packet I send (except for the initial SYN) can have the ACK flag set. This simplified my packet-sending code a lot – I realized I can construct basically every packet the same way, except for the flags and the payload. Now I can write def _send_syn(self): self._send(flags="S") self.state = "SYN-SENT" instead of def send_syn(self): syn_pkt = self.ip_header / TCP(dport=self.dest_port, sport=self.src_port, flags="S", seq=self.seq) self.listener.send(syn_pkt) self.state = "SYN-SENT" Right now the way I’m handling ACKs is basically to send an ACK for every packet I receive. This isn’t really efficient (because if I’m receiving tons of packets really fast it would make sense to acknowledge less often). But it is not incorrect, which is all that I’m going for. I also decided that I want to be able to be a TCP server as well as a TCP client. So I started writing bind(). Here it is so far: def bind(self): pass Seriously I did not ever think about how bind() works before. It has to manage multiple connections! And keep a queue! What am I supposed to do when people send me packets all at once? Just ignore them until I have time? I don’t get it. Testing is fantastic. I love testing. I refactored pretty much all the code today in this commit. The code still works, because tests. =D However writing tests kind of sucks because it takes forever. Next up: writing tests for receiving packets out of order receiving duplicate packets being on the server side of the TCP handshake #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 26: Trying to describe the TCP state machine in a readable way. Failing. Day 27: Automatically testing changes in state! Visualizing my Git workflow! Floats!'
