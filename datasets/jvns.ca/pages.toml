full_description = "Day 32: Magical Orchestra!!! • hackerschool • music • November 21, 2013 This week Lyndsey and I worked on a ★★★ Magical Orchestra ★★★ in Clojure. The idea behind a ★★★ Magical Orchestra ★★★ is that you go to http://my-ip:8080/client.html, and then you get a page that looks like this: Then a sound plays on my computer! Like a crow, or a cowbell. So at presentations we plugged my computer into a speaker and let everyone make noise. It was delightful. If you are so inclined, you can have your very own magical orchestra by cloning the repo above, installing Leinengen, and running lein run. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 31: Binary trees with core.logic! Day 33: How to make music with ClojureScript"
