title = "Do Rails programmers use node.js? Visualizing correlations in command usage"
description = "Do Rails programmers use node.js? Visualizing correlations in command usage"
full_description = "Do Rails programmers use node.js? Visualizing correlations in command usage October 24, 2013 A few months ago I got curious about which unix command line utilities were the most popular, so I ran a survey on Hacker News. I ended up getting 1,500 responses or so. Once I had that, I wanted to know how commands are related to each other: do people who use gcc use python? What about scala and clojure? So I made a visualization to explore this question! It shows a graph where commands which are strongly correlated together are linked (for example ruby and rails). You can look at it here. I enjoy it a lot, especially the part of the graph around gcc, because it’s pretty sparse. Try clicking ‘See the whole graph’; it’s beautiful. Just do it in Chrome, not Firefox. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 15: How a .gz file is structured, redux Day 16: gzip + poetry = awesome"
