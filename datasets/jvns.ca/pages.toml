["https://jvns.ca/blog/2013/12/16/day-43-hopefully-the-last-day-spent-fixing-linker-problems"]
title = "Day 43: SOMETHING IS ERASING MY PROGRAM WHILE IT’S RUNNING (oh wait oops)"
description = "Day 43: SOMETHING IS ERASING MY PROGRAM WHILE IT’S RUNNING (oh wait oops)"
full_description = "Day 43: SOMETHING IS ERASING MY PROGRAM WHILE IT’S RUNNING (oh wait oops) • hackerschool • kernel • favorite • December 16, 2013 alternate title: “Hopefully the last day I spend all day trying to compile my code properly” (context: I’m working on writing an OS, and am experiencing a mysterious recurring bug. After many days, I have found the reason!) Today I went through the following: Decide to try to write some code Upgrade Rust, since my version is 8 days old Oh no, the new Rust breaks my oldish version of rust-core Upgrade rust-core Oh no, the new rust-core requires me to compile in a different way Spend a bunch of time messing with clang and friends to get everything to compile again Everything compiles. Yay! Try to run code Encounter mystery bug again, where my array mysteriously contains 0s instead of its actual contents Make sad faces Go talk to Allison. Allison is the best. Allison asks: “What linker debugging strategies do you have?” Change the linker script randomly (actual thing that has worked) Change variable attributes from ‘private’ to ‘public’ at random (actual other thing that has worked) Look at the linker map or symbol table (not helpful, so far) Attach gdb to qemu and inspect the contents of memory (!!!) gdb is great. It let me search my memory for “QWERTY” (not there! why not?) look at the memory at a given address (lots of zeros! huh!) Do a core dump, and compare it to the original file. Lots of zeros! Why is half my program gone? SURPRISE MY CODE IS NOT WORKING BECAUSE SOMETHING IS ERASING IT. Can we talk about this? I have code I can compile my code Half of my binary gets overwritten with 0s at runtime. Why. What did I do to deserve this? No wonder the order I put the binary in matters. It is a wonder that this code even runs, man. Man. Edit: I found why my binary has lots of 0s in it at runtime. It is because I was only loading 12k of it in loader.asm. Hopefully this will serve as a lesson to someone. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 42: How to run a simple ELF executable, from scratch (I don't know) Day 44: qemu + gdb = so great"
