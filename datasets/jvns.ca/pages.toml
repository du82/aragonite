title = "Day 34: The tiniest operating system"
description = "Day 34: The tiniest operating system"
full_description = "Day 34: The tiniest operating system • hackerschool • November 26, 2013 One of my as-yet-unrealized goals for Hacker School is to write an operating system, at least a tiny one. Today I decided to actually start in earnest, because this operating system isn’t going to write itself! I’ve decided to write an OS for x86, because I like the idea of being able to run it on my computer in real life. I immediately found a super-fantastic resource: MikeOS, which has really simple instructions. The only issue I had with them was that I had to run kvm instead of qemu to get it to run in the emulator. If you install build-essential, nasm, and qemu, and clone this gist, you too will have the tiniest operating system! So far all I’ve learned is how to use a particular BIOS interrupt handler, which lets me write characters to the screen and change the background colour. Here’s what my OS looks like so far. It prints something, and makes the background a pinkish colour. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 33: How to make music with ClojureScript Day 34b: Writing curl using my TCP stack"
