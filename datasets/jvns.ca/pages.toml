full_description = 'Day 22: Got some TCP packets back! • hackerschool • November 6, 2013 I spent a bunch of time with Jessica trying to send TCP packets to get the http://example.com homepage. It turned out that the problem we were having was not at the TCP level, but actually at HTTP level: we needed to send something like example.com\r\nAccept: */*\r\n\r\n" to make the server actually reply. I then successfully reassembled a bunch of TCP packets into a webpage! I still need to reply saying I got the packets (to the FIN-ACK, I think) Make sure I don’t use duplicate packets when I reassemble probably lots of things. Today wasn’t super productive, I think because I gave a talk at NYC Python and I was a bit worried about it. The talk went well, though! So tomorrow I will hopefully get more done. We will see! I really want to start writing “real” code again soon. Maybe tomorrow. This exploratory networking stuff is super fun and I’m learning a lot, but I feel like I haven’t written much code in a while and it is bothering me. Maybe a bittorrent client will come soon =) BUT WHICH LANGUAGE. Clojure? Hmm. #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; display: inline;} #mc_embed_signup { display: inline; } #mc_embed_signup input.button { background: #ff5e00; display: inline; color: white; padding: 6px 12px; } .form-inline { display:flex; flex-flow: row wrap; justify-content: center; } .form-inline input, .form-inline span { padding: 10px; } .form-inline input { display:inline; max-width:30%; margin: 0 10px 0 0; background-color: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; } button { background-color: #f50; box-shadow: none; border: 0; border-radius: 5px; color: white; padding: 5px 10px; } @media (max-width: 800px) { .form-inline input { margin: 10px 0; max-width:100% !important; } .form-inline { flex-direction: column; align-items: stretch; } } Want a weekly digest of this blog? Subscribe Day 23: Started writing a 