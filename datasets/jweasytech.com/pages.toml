description = "Just Works Easy Technology Information"
full_description = "TechnologyIkea registered a Matter-over-Thread temperature sensor with the FCC March 1, 2025 Ikea has registered its first Thread device, a new Matter-supporting temperature and humidity sensor called the “Timmerflotte,” with the FCC, reports HomeKit News. A diagram from the filing, which was spotted by CybermodStudios, shows a circular device that’s powered by two AAA batteries and features a QR code and 11-digit number for Matter setup. The Timmerflotte doesn’t appear to use any other wireless protocol other than Thread, HomeKit News notes. That means Ikea, which tends to use the Zigbee or Wi-Fi protocols for its devices, doesn’t offer a hub that this device could natively integrate with. Ikea’s Dirigera hub lacks both Thread border router capability, for one thing. And although it can now act as a Matter bridge, it’s not a Matter controller, meaning you can’t control Matter products with it. That said, Ikea originally announced that the Dirigera would have Thread support. It ultimately didn’t launch with it, but the Timmerflotte’s listing may be a sign Ikea is ready to switch on the Dirigera’s Thread radios and Matter controller functionality. That could let it serve as a standalone smart home hub, similar to the Aqara M3 hub or Flic’s LR and Mini hubs. Source link"
