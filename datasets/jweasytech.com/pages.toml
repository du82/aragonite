["https://jweasytech.com/2025/02/28/anritsu-introduces-new-software-based-solution-for-5g-iot-chipset-and-device-development-testing"]
title = "Anritsu Introduces New Software-based Solution for 5G IoT Chipset and Device Development Testing – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "EngineeringAnritsu Introduces New Software-based Solution for 5G IoT Chipset and Device Development Testing February 28, 2025 Anritsu Corporation has introduced the Virtual Signalling Tester NR Software MX844030PC, a software-based test simulator for developing 5G IoT chipsets and devices. The solution supports the 5G IoT test by using a new simulator that operates in a virtual environment on a PC using advanced architecture, as well as a Software Defined Radio (SDR) that implements most conventional radio functions in software. 5G network simulation in a virtual environment streamlines various tests, including DUT (Device Under Test) fault detection, performance evaluation, and current consumption, device interoperability, and shipping inspection/security tests. Anritsu will help quality assurance and development efficiency in various fields by utilizing its virtualization simulator technology and will continue to extend this solution towards Beyond 5G and 6G. The software-based virtualization testing market has grown rapidly in recent years, and there is demand for solutions leveraging the advantages of virtualization simulators, including reduced costs, efficient testing, and risk reduction, with a focus on creating flexible scenarios. Testing on a PC environment without conventional dedicated development testers enables to reduce hardware and operating costs, shorten test cycles and provide quick feedback. Moreover, various test environments under similar conditions to actual operation environments can be constructed flexibly because it is easy to customize matching development requirements The MX844030PC software platform supports 5G testing. It features 5G virtual network functionality and supports RedCap tests in the 5G sub-6 GHz band. The user-friendly RTD Lite3 GUI (Graphical User Interface) facilitates intuitive changes to parameters and test procedures from sample scenarios, as well as efficient device verification and analysis using Report/Log functions. The solution will be showcased at the Mobile World Congress (MWC) 2025 Anritsu booth from 3 March to 6 March 2025 in Barcelona, Spain. Source link"
