full_description = "TechnologyAdvanced Micro Devices, Inc. (AMD) February 28, 2025 – The new AMD Radeon™ RX 9000 Series graphics cards deliver enthusiast-level gaming experiences supercharged by AI – SANTA CLARA, Calif., Feb. 28, 2025 (GLOBE NEWSWIRE) — AMD (NASDAQ: AMD) today unveiled the highly-anticipated AMD RDNA™ 4 graphics architecture with the launch of the AMD Radeon™ RX 9070 XT and RX 9070 graphics cards as a part of the Radeon™ RX 9000 Series. The new graphics cards feature 16GB of memory and extensive improvements designed for high-quality gaming graphics, including re-vamped raytracing accelerators and powerful AI accelerators for ultra-fast, cutting-edge performance, and breakthrough gaming experiences. In a YouTube livestream, David McAfee, CVP and GM, Ryzen CPU and Radeon Graphics AMD, was joined by Andrej Zdravkovic, SVP of GPU Technologies and Engineering and Chief Software Officer, AMD, as well as Andy Pomianowski, CVP of Silicon Design Engineering, AMD, to discuss the outstanding performance and value proposition of the Radeon RX 9000 Series. In a related event in Zhuhai, China, Jack Huynh, SVP of the Client and Graphics Group, AMD, led a regional event for the new products. Huynh was joined by David Wang, SVP of GPU Technology and Engineering, AMD, and Lanzhi Wang, Senior Director of Product Management, AMD. The celebration was also marked by a customer celebration with Darren Grasby, EVP and Chief Sales Officer, AMD; Spencer Pan, President of AMD China, and partners including Asrock, ASUS, Gigabyte, Sapphire, Tul, Vastarmor, Veston, and XFX. “Today, we’re thrilled to unveil the AMD Radeon™ RX 9000 Series, a significant leap forward in graphics performance powered by our next-generation AMD RDNA™ 4 architecture,” said McAfee. “These GPUs are designed to meet the demands of today’s games, delivering enthusiast-class gaming experiences to gamers everywhere, while ready to support tomorrow’s innovations. Through the power of advanced AI and Raytracing accelerators, we’re not just improving frame rates – we’re fundamentally enhancing the gaming experience. Offering incredible performance, AI-powered features, and next-gen display support at competitive price points, the Radeon RX 9000 Series delivers exceptional value for gamers looking to upgrade their systems.” The RX 9000 Series, powered by the new AMD RDNA™ 4 architecture, offers gamers and creators a powerful blend of performance, visuals, and value. These advanced graphics cards redefine incredibly fast, high-resolution gaming with third-generation raytracing technology enabling realistic lighting, shadows, and reflections to deliver immersive gaming experiences while integrating a suite of AMD features to maximize hardware utilization. Beyond gaming, the RX 9000 Series GPUs leverage new second-generation AI accelerators with up to 8x INT8 throughput per AI accelerator (for sparse matrices) to enhance creative applications and effectively run generative AI applications (vs. RDNA 3).1 The RX 9000 Series GPUs also implement the newly redesigned AMD Radiance Display™ Engine & Enhanced Media Engine for broad display support and elevated quality in both recording and streaming. Gaming For Today and TomorrowThe Radeon RX 9000 Series unlocks new levels of performance while delivering a suite of new and enhanced features that improve the gaming experience. The Radeon RX 9070 Series offers 16GB of GDDR6 memory, allowing gamers to render the most exciting games of today and tomorrow at max settings. Compared to the previous generation RX 7900 GRE, the latest AMD Radeon RX 9070 is able to deliver over 20% more performance on average when gaming at 1440,2 with the AMD Radeon RX 9070 XT extending that lead to over 40% on average.3 Both graphics cards make smart upgrades for gamers looking to future-proof their systems with a suite of next-gen features that will keep their experiences feeling fresh for years to come. Key features include: Unified AMD RDNA™ 4 Compute Units – Features up to 64 advanced AMD RDNA™ 4 compute units delivering up to 40% higher gaming performance than the previous-generation AMD RDNA™ 3 architecture.3 High-Performance Raytracing – With 3rd generation Raytracing Accelerators, AMD RDNA 4 is able to deliver over 2x the Raytracing throughput per compute unit when compared to our previous generation.1 Gamers with the latest AMD Radeon RX 9000 Series are ready for immersive gaming experiences with high-quality graphics, including realistic lighting, shadows, and reflections. Supercharged AI Acceleration – 2nd Generation AI Accelerators received several enhancements, allowing AMD RDNA™ 4 to efficiently process advanced AI models much faster than what was possible with RDNA 3,4 through a combination of additional math pipelines for AI calculations, expanding the capabilities of the AI Accelerator to support new emerging data types such as FP8, and support for inference optimization techniques such as structured sparsity. These changes deliver up to 8x INT8 throughput per AI accelerator (for sparse matrices) per compute unit vs the previous generation.1 AMD FidelityFX™ Super Resolution Technology 4 (FSR 4) – AMD’s new cutting-edge ML-powered upscaling technology delivers high-quality boosted frames under even the most demanding workloads, such as 4K gaming with maximum raytracing settings and will be supported in over 30 games at launch. Innovative suite of features through HYPR-RX – Gamers can instantly improve their experience by activating AMD HYPR-RX and the suite of features within AMD Software, including AMD Radeon™ Super Resolution, AMD Fluid Motion Frames 2.1, AMD Radeon™ Anti-Lag, and AMD Radeon™ Boost. These features can all be tailored to gamers’ hardware and preferences within AMD Software: Adrenalin Edition™ to drive increased FPS, responsiveness and efficiency. AI-Enhanced AMD Software: Adrenalin Edition™ Application – A new suite of software and resources designed to deliver an industry-leading AI user experience with AMD Radeon RX 9070 Series graphics cards. Keep your drivers and AI software up to date with the new Software Manager. Find the answers to your questions about all things AMD or create free and private text and images with AMD Chat. Discover, download and install new and exciting AMD-partnered AI applications with the App Portal, and leverage AI to improve software quality with the AMD Image Inspector. Ready for Next-Generation Displays – AMD Radiance Display™ Engine supports the latest DisplayPort™ 2.1a and HDMI® 2.1b connections, enabling ultra-high resolutions and refresh rates up to 8K 144Hz, with 12-bit HDR and full REC2020 Color Space for incredible color accuracy. Paired with AMD FreeSync™ technology, gamers can enjoy tear-free, stutter-free gaming experiences on over 4000 compatible displays, including upcoming 4K 240Hz and 8K 144Hz DisplayPort™ 2.1 monitors.5 ML-Powered AMD FidelityFX™ Super Resolution 4 (AMD FSR 4) Upgrade Available exclusively on AMD Radeon™ RX 9000 Series graphics cards, AMD Software: Adrenalin Edition™ adds a new easy-to-use AMD FidelityFX™ Super Resolution 4 (AMD FSR 4) Upgrade feature that helps maximize performance at maximum quality in over 30 games at launch, with 75 coming later this year. AMD FSR 4 delivers a substantial image quality improvement over AMD FSR 3.1 upscaling, with the new ML-based algorithm helping to improve temporal stability, better preserve detail, and reduce ghosting. Utilizing features already built into the AMD FidelityFX™ API added when game developers integrate AMD FSR 3.1 into their games, AMD FSR 4 enables an easy upgrade for supported FSR 3.1 games and can be combined with existing in-game AMD FSR 3.1 advanced frame-generation and AMD Radeon™ Anti-Lag 2 for ultra-smooth, ultra-responsive gaming at incredible frame rates on AMD Radeon RX 9070 Series graphics cards. The new ML-accelerated AMD FSR 4 upscaling algorithm is trained using high-quality ground truth game data on AMD Instinct™ Accelerators and uses the hardware-accelerated FP8 Wave Matrix Multiply Accumulate (WMMA) feature of the AMD RDNA™ 4 architecture to ensure maximum upscaling quality while still providing a substantial game performance boost. AMD Radeon RX 9000 Series Product Specifications Model Compute Units GDDR6 Game Clock (GHz) Boost Clock6 (GHz) Memory Interface Infinity Cache TBP Price(USD SEP) AMD Radeon RX 9070 XT 64 16 GB 2.4 Up to 3.0 256-bit 64 MB 304W $599 AMD Radeon RX 9070 56 16 GB 2.1 Up to 2.5 256-bit 64 MB 220W $549 Pricing and Availability AMD Radeon RX 9000 Series graphics cards are expected to be available from leading board partners including Acer, ASRock, ASUS, Gigabyte, PowerColor, Sapphire, Vastarmor, XFX and Yeston beginning March 6th, 2025. The AMD Radeon RX 9070 XT has an SEP of $599 USD, while the AMD Radeon RX 9070 has an SEP of $549 USD. Supporting Resources Learn more AMD Radeon Graphics cards here Learn about RDNA 4 here Learn more about AMD FidelityFX Super Resolution here Follow AMD on LinkedIn Follow AMD on X About AMDFor more than 50 years AMD has driven innovation in high-performance computing, graphics and visualization technologies. Billions of people, leading Fortune 500 businesses and cutting-edge scientific research institutions around the world rely on AMD technology daily to improve how they live, work and play. AMD employees are focused on building leadership high-performance and adaptive products that push the boundaries of what is possible. For more information about how AMD is enabling today and inspiring tomorrow, visit the AMD (NASDAQ: AMD) website, blog, LinkedIn and X pages. Cautionary Statement This press release contains forward-looking statements concerning Advanced Micro Devices, Inc. (AMD) such as the features, functionality, performance, availability, timing and expected benefits of AMD products including the AMD Radeon™ RX 9000 Series graphics cards, which are made pursuant to the Safe Harbor provisions of the Private Securities Litigation Reform Act of 1995. Forward-looking statements are commonly identified by words such as “would,” “may,” “expects,” “believes,” “plans,” “intends,” “projects” and other terms with similar meaning. Investors are cautioned that the forward-looking statements in this press release are based on current beliefs, assumptions and expectations, speak only as of the date of this press release and involve risks and uncertainties that could cause actual results to differ materially from current expectations. Such statements are subject to certain known and unknown risks and uncertainties, many of which are difficult to predict and generally beyond AMD’s control, that could cause actual results and other future events to differ materially from those expressed in, or implied or projected by, the forward-looking information and statements. Material factors that could cause actual results to differ materially from current expectations include, without limitation, the following: Intel Corporation’s dominance of the microprocessor market and its aggressive business practices; Nvidia’s dominance in the graphics processing unit market and its aggressive business practices; competitive markets in which AMD’s products are sold; the cyclical nature of the semiconductor industry; market conditions of the industries in which AMD products are sold; AMD’s ability to introduce products on a timely basis with expected features and performance levels; loss of a significant customer; economic and market uncertainty; quarterly and seasonal sales patterns; AMD’s ability to adequately protect its technology or other intellectual property; unfavorable currency exchange rate fluctuations; ability of third party manufacturers to manufacture AMD’s products on a timely basis in sufficient quantities and using competitive technologies; availability of essential equipment, materials, substrates or manufacturing processes; ability to achieve expected manufacturing yields for AMD’s product