["https://jweasytech.com/2025/03/01/ayaneos-clamshell-handheld-joins-the-crowdfunding-hall-of-shame"]
title = "AYANEO’s clamshell handheld joins the crowdfunding hall of shame – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "SmartPhoneAYANEO’s clamshell handheld joins the crowdfunding hall of shame March 1, 2025 TL;DR The AYANEO Flip has been discontinued before all orders were shipped. The project was successfully funded last year, but order fulfillment has been delayed several times. Backers who didn’t receive their devices can request a refund or another AYANEO product within 30 days. Update, March 1, 2025 (01:58 PM ET): Rumors of the AYANEO Flip’s demise may have been greatly exaggerated. Or, at the very least, fundamentally misconstrued. AYANEO’s got a new update on its Indiegogo page where the company asserts that the Flip is very much not discontinued. Rather, the company frames what’s happening as a production delay as it seeks out new manufacturing partners. Furthermore, it defends its treatment of backers, claiming that only 18 crowdfunding orders had yet to be fulfilled — a mere handful. AYANEO says that more Flip units should be produced sometime within the next three months, and that moving forward it intends to continue the product line with new entries. Original article, February 27, 2025 (05:38 AM ET): Crowdfunding is one of the main ways new retro gaming handhelds are produced, with huge discounts for those willing to take the risk. Those risks don’t always pay off, though, with the latest high-profile cancelation coming from AYANEO. The AYANEO Flip, which was successfully crowdfunded last spring, raised over $850,000 on Indiegogo. There were two versions available, one with a second screen, similar to a Nintendo DS, and another with a full keyboard. Order fulfillment has been delayed due to parts shortages, but the project has now been discontinued entirely, with some backers never receiving their devices. AYANEO didn’t explain why the project was canceled, writing on the Indiegogo page that it was to “ensure we focus on delivering exceptional experiences through our existing and upcoming product lines.” It’s likely that parts have become difficult or impossible to source, or price increases have shifted the math in a way that’s untenable to produce. Backers who haven’t received their handhelds have 30 days to claim a refund or exchange. Regardless, backers who have not received their AYANEO Flips have two options: a full refund or an exchange for another AYANEO product, with price differences settled accordingly. However, the timeline set for refunds is just 30 days, so if you’re one of the unlucky few, you better act fast. The most popular AYANEO products are Android-based handhelds like the Pocket DMG and Pocket EVO, both of which cost significantly less than the Flip. The company’s Windows-based handhelds, like the Kun and Slide, are more traditional handhelds that compete with the likes of the Steam Deck and ROG Ally. The modular controls on the AYANEO 3 offer an innovative alternative, but that’s subject to the same crowdfunding risks as the Flip. This month, we’ve seen renewed interest in the clamshell form factor with the Retroid Flip 2, an Android-based handheld that drops the second screen and keyboard. Given the troubles faced by the AYANEO Flip, this more practical approach might be the way to go. Got a tip? Talk to us! Email our staff at news@androidauthority.com. You can stay anonymous or get credit for the info, it’s your choice. Source link"
