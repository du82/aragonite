["https://jweasytech.com/2025/03/01/constellation-technologies-operations-unveils-first-regenerative-5g-mmwave-satellite-payload-for-telecom-operators"]
title = "Constellation Technologies & Operations Unveils First Regenerative 5G mmWave Satellite Payload for Telecom Operators – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "EngineeringConstellation Technologies & Operations Unveils First Regenerative 5G mmWave Satellite Payload for Telecom Operators March 1, 2025 Less than six months after securing €9.3 million in funding, Constellation Technologies & Operations (CTO) is delivering on its ambitions. The startup is developing a constellation of VLEO satellites to enable telecom operators to provide high speed, low latency internet access from space — just as they do today with terrestrial networks. CTO unveils its first regenerative operational payload, the Early Test. Tested on the ground under simulated space environmental conditions, the Early Test payload has been integrated into D-Orbit’s ION satellite platform, which will allow it to operate in orbit. It is now scheduled to be launched into space in June 2025 — a pioneering milestone in space telecommunications, marking the first-ever use of the 5G mmWave spectrum for high speed, low latency internet data transmission via satellite, anywhere on the planet. At the same time, CTO is accelerating its structuring efforts by strengthening its management team with seasoned professionals. These experts will support the company’s growth and help achieve its mission: to provide telecom operators with a shared, neutral space-based infrastructure that ensures universal, high-performance, affordable and sustainable internet access. A Global First for CTO and a Major Step Forward for Space Connectivity Developed and manufactured in France, CTO’s payload is a breakthrough innovation in high speed space telecommunications. For the first time, telecom operators’ 5G mmWave spectrum is being leveraged for satellite-based ultra-fast, low latency internet transmission. The Early Test was designed to integrate and validate CTO’s essential hardware and software technologies for high speed connectivity. After its assembly, it underwent rigorous testing to confirm its functionality on the ground before being successfully integrated into the satellite platform that will support its operation once deployed in orbit. This successful integration represents a key milestone in CTO’s project, positioning the company as a future operator of connectivity services from space in reinforcing Europe’s autonomy and competitiveness in the space telecommunications market. Charles Delfieux, CEO of CTO, stated, “Our regenerative 5G mmWave payload is a world first that confirms CTO’s ability to accelerate the convergence between terrestrial and space connectivity. It is a fundamental brick to continue developing the next generation space infrastructure for telecoms operators that they can operate as they do today with terrestrial networks.” Tangible Benefits for Telecom Operator This technology opens new opportunities for telecom operators by enabling them to extend their coverage beyond terrestrial infrastructure limits using their 5G mmWave spectrum. CTO provides an efficient and cost-effective way to deliver high-performance connectivity in rural, remote and underserved areas — without requiring heavy investment in expanding terrestrial networks to low-density regions. CTO offers a strategic alternative to large-scale constellations launched by new entrants, allowing telecom operators to manage a shared space-based telecommunications network, just as they do today with terrestrial networks. This model enables them to diversify their service offerings beyond fiber and cellular solutions. An Innovative Project Driven by an Experienced, Strengthened Team Following its funding round, CTO has significantly expanded its workforce, particularly in leadership roles. To support its growth, the company now relies on a team of 30+ experts, led by an experienced management team in the space and telecommunications industries. This strengthened leadership aligns with CTO’s overall strategy of innovation and industrialization, reflecting its commitment to building a robust and sustainable organization while attracting and retaining the best talent in the field. With this technological breakthrough and its strengthened team, CTO is establishing itself as a key player in space telecommunications, actively contributing to the vision of universal connectivity. Source link"
