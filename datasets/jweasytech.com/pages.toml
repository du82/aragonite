["https://jweasytech.com/2025/02/27/hubble-provides-birds-eye-view-of-andromeda-galaxys-ecosystem"]
title = "Hubble provides bird’s-eye view of Andromeda galaxy’s ecosystem – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "SpaceHubble provides bird’s-eye view of Andromeda galaxy’s ecosystem February 27, 2025 This is a wide-angle view of the distribution of known satellite galaxies orbiting the large Andromeda galaxy (M31), located 2.5 million light-years away. The Hubble Space Telescope was used to study the entire population of 36 mini-galaxies circled in yellow. Andromeda is the bright spindle-shaped object at image center. All the dwarf galaxies seem to be confined to a plane, all orbiting in the same direction. The wide view is from ground-based photography. Hubble’s optical stability, clarity, and efficiency made this ambitious survey possible. Hubble close up snapshots of four dwarf galaxies are on image right. The most prominent dwarf galaxy is M32 (NGC 221), a compact ellipsoidal galaxy that might be the remnant core of a larger galaxy that collided with Andromeda a few billion years ago. Credit: NASA, ESA, Alessandro Savino (UC Berkeley), Joseph DePasquale (STScI), Akira Fujii DSS2 Located 2.5 million light-years away, the majestic Andromeda galaxy appears to the naked eye as a faint, spindle-shaped object roughly the angular size of the full moon. What backyard observers don’t see is a swarm of nearly three dozen small satellite galaxies circling the Andromeda galaxy, like bees around a hive. These satellite galaxies represent a rambunctious galactic “ecosystem” that NASA’s Hubble Space Telescope is studying in unprecedented detail. This ambitious Hubble Treasury Program used observations from more than a whopping 1,000 Hubble orbits. Hubble’s optical stability, clarity, and efficiency made this ambitious survey possible. This work included building a precise 3D mapping of all the dwarf galaxies buzzing around Andromeda and reconstructing how efficiently they formed new stars over the nearly 14 billion years of the universe’s lifetime. In the study published in The Astrophysical Journal, Hubble reveals a markedly different ecosystem from the smaller number of satellite galaxies that circle our Milky Way. This offers forensic clues as to how our Milky Way galaxy and Andromeda have evolved differently over billions of years. Our Milky Way has been relatively placid. But it looks like Andromeda has had a more dynamic history, which was probably affected by a major merger with another big galaxy a few billion years ago. This encounter, and the fact that Andromeda is as much as twice as massive as our Milky Way, could explain its plentiful and diverse dwarf galaxy population. This animation begins with a view of the neighboring Andromeda galaxy. We zoom through a scattering of foreground stars and enter the inky blackness of intergalactic space. We cross 2.5 million light-years to reach the Andromeda system, consisting of 36 dwarf satellite galaxies orbiting the giant spindle-shaped Andromeda galaxy at image center. An ambitious survey by the Hubble Space Telescope was made to plot the galaxy locations in three-dimensional space. In this video we circle around a model of the Andromeda system based on real Hubble observational data. NASA, ESA, Christian Nieves (STScI), Alessandro Savino (UC Berkeley); Acknowledgment: Joseph DePasquale (STScI), Frank Summers (STScI), Robert Gendler Surveying the Milky Way’s entire satellite system in such a comprehensive way is very challenging because we are embedded inside our galaxy. Nor can it be accomplished for other large galaxies because they are too far away to study the small satellite galaxies in much detail. The nearest galaxy of comparable mass to the Milky Way beyond Andromeda is M81, at nearly 12 million light-years. This bird’s-eye view of Andromeda’s satellite system allows us to decipher what drives the evolution of these small galaxies. “We see that the duration for which the satellites can continue forming new stars really depends on how massive they are and on how close they are to the Andromeda galaxy,” said lead author Alessandro Savino of the University of California at Berkeley. “It is a clear indication of how small-galaxy growth is disturbed by the influence of a massive galaxy like Andromeda.” “Everything scattered in the Andromeda system is very asymmetric and perturbed. It does appear that something significant happened not too long ago,” said principal investigator Daniel Weisz of the University of California at Berkeley. “There’s always a tendency to use what we understand in our own galaxy to extrapolate more generally to the other galaxies in the universe. “There’s always been concerns about whether what we are learning in the Milky Way applies more broadly to other galaxies. Or is there more diversity among external galaxies? Do they have similar properties? Our work has shown that low-mass galaxies in other ecosystems have followed different evolutionary paths than what we know from the Milky Way satellite galaxies.” For example, half of the Andromeda satellite galaxies all seem to be confined to a plane, all orbiting in the same direction. “That’s weird. It was actually a total surprise to find the satellites in that configuration and we still don’t fully understand why they appear that way,” said Weisz. Discover the latest in science, tech, and space with over 100,000 subscribers who rely on Phys.org for daily insights. Sign up for our free newsletter and get updates on breakthroughs, innovations, and research that matter—daily or weekly. The brightest companion galaxy to Andromeda is Messier 32 (M32). This is a compact ellipsoidal galaxy that might just be the remnant core of a larger galaxy that collided with Andromeda a few billion years ago. After being gravitationally stripped of gas and some stars, it continued along its orbit. Galaxy M32 contains older stars, but there is evidence it had a flurry of star formation a few billion years ago. In addition to M32, there seems to be a unique population of dwarf galaxies in Andromeda not seen in the Milky Way. They formed most of their stars very early on, but then they didn’t stop. They kept forming stars out of a reservoir of gas at a very low rate for a much longer time. “Star formation really continued to much later times, which is not at all what you would expect for these dwarf galaxies,” continued Savino. “This doesn’t appear in computer simulations. No one knows what to make of that so far.” “We do find that there is a lot of diversity that needs to be explained in the Andromeda satellite system,” added Weisz. “The way things come together matters a lot in understanding this galaxy’s history.” Hubble is providing the first set of imaging where astronomers measure the motions of the dwarf galaxies. In another five years, Hubble or NASA’s James Webb Space Telescope will be able to get the second set of observations, allowing astronomers to do a dynamical reconstruction for all 36 of the dwarf galaxies, which will help astronomers to rewind the motions of the entire Andromeda ecosystem billions of years into the past. More information: Alessandro Savino et al, The Hubble Space Telescope Survey of M31 Satellite Galaxies. IV. Survey Overview and Lifetime Star Formation Histories, The Astrophysical Journal (2025). DOI: 10.3847/1538-4357/ada24f Citation: Hubble provides bird’s-eye view of Andromeda galaxy’s ecosystem (2025, February 27) retrieved 27 February 2025 from https://phys.org/news/2025-02-hubble-bird-eye-view-andromeda.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only. Source link"
