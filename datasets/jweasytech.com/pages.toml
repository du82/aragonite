title = "Grinn, Kyocera AVX, Sony Altair, and Skylo Develop New Narrowband-NTN Reference Design – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "EngineeringGrinn, Kyocera AVX, Sony Altair, and Skylo Develop New Narrowband-NTN Reference Design March 1, 2025 Grinn, an electronics design company specializing in engineering, technology, and IoT solutions, has announced the release of Grinn Terrasat-NTN—its latest reference design, developed in collaboration with KYOCERA AVX, Sony Altair, and Skylo. This design showcases tracking and measurement capabilities using NB-NTN satellite technology and provides a versatile platform for various applications. A Collaborative Effort with Industry Leaders The development of this reference design was made possible through the combined expertise of leading technology providers. KYOCERA AVX, a global leader in antenna and electronic component design, played a key role in optimizing signal performance with tailored antenna solutions. Sony Altair contributed its advanced IoT chipset technology, embedded in Murata modules, to enhance reliability and efficiency. Skylo brought its deep understanding of satellite-based connectivity, ensuring the design could operate seamlessly in real-world scenarios where traditional networks often fall short. This collaboration reflects a shared vision of creating practical and effective solutions that address the increasing demand for satellite connectivity across industries such as agriculture, logistics, and energy. “At KYOCERA AVX, we are proud to bring our antenna design expertise to the innovative satellite-based reference design, Terrasat-NTN,” said Carmen Redondo, Director of Global Marketing for Antennas at KYOCERA AVX. “By optimizing antenna performance – especially when multiple technologies coexist within a single device – we are enabling reliable connectivity for developers and end-users. Our collaboration with Grinn and industry leaders like Sony Altair and Skylo emphasizes our commitment to advancing NTN technology and delivering solutions that meet the growing demand for global connectivity”. A Compact Solution for Complex Challenges The Grinn Terrasat-NTN is designed to address the challenges of operating in remote and demanding environments, offering practical features that deliver real-world benefits. Supporting 3GPP Release 14 standards with LTE Cat M1 and LTE NB1 technologies, the device ensures reliable communication even in areas without terrestrial networks. Its integrated sensors—tracking movement, orientation, temperature, and humidity—provide actionable data to support effective asset management and environmental monitoring. With a compact design measuring 116x54x22 mm and powered by a durable 1250 mAh Li-ion battery, the Grinn Terrasat-NTN is both portable and robust, making it adaptable for deployment in various scenarios. From monitoring agricultural conditions to tracking assets in remote locations, this device equips industries with the tools they need to operate efficiently in complex environments. “Satellite communication devices have long been seen as large, energy-intensive, and expensive. With the Grinn Terrasat-NTN, we set out to change that perception,” said Robert Otreba, CEO of Grinn. “Thanks to our collaboration with KYOCERA AVX, Sony Altair, and Skylo, we’ve developed a reference design that is functional yet lightweight, compact, and highly efficient. This design is not just a demonstration of what’s possible—it’s a practical foundation for future projects.” Click here to learn more about Grinn Terrasat-NTN. Source link"
