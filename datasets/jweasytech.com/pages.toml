full_description = "TechnologyAmazon drops M4 Mac Mini to its lowest price this year (and I don’t expect it to last) February 27, 2025 Jason Hiner/ZDNET Amazon has discounted several Mac Mini M4 builds as part of a new series of unexpected deals. The compact desktop can be purchased for as low as $549, although this price drop only applies to the 16GB RAM/256GB SSD model. If you want more storage space, the Mac Mini M4 with the 512GB SSD has seen a 10% discount, going from $799 to $719. There’s also a third M4 build with 512GB SSD and 24GB of unified memory that’s now selling for $919. Be aware that these prices do not include AppleCare+. Opting for the three-year warranty plan adds an extra $100. Also: M4 Mac Mini vs. M2 Mac Mini: Which Apple desktop should you buy? Apple does sell Mac Mini M4 Pro models; however, at the time of this writing, that desktop is out of stock on Amazon. You’ll have to hop over to B&H Photo Video for the Pro version, which is on sale for$1,299. It is surprising to see the Mac Mini M4 on sale across multiple platforms outside of a major holiday or sales event. The current desktop system has only been around since November 2024. These are the sort of prices you might see during an event like Amazon Prime Day. Regardless, I’m happy to see the discounts because the Mac Mini M4 is a solid computer. According to ZDNET editor Jason Hiner, the Mac Mini M4 introduced a “long-awaited redesign [to] one of Apple’s quirkiest and most utilitarian products. ” It’s more compact than the previous generation, weighing 1.5 pounds and measuring 5 by 5 inches. Also: Apple’s new MacBook Air M4 could be just around the corner – what we know Hiner goes on to describe Apple’s M4 chipset as providing “next-level performance,” which enables the computer to tackle tough workflows like music production, video editing, and other forms of content creation. These applications are boosted by the fact that the base M4 Mac Mini comes with 16GB of RAM, compared to older Mac Minis, which sported 8GB of memory. That’s fine for casual usage but buckles under demanding tasks. With the introduction of Apple Intelligence into the mix, Apple needed to give its hardware an upgrade. I recommend the Mac Mini M4 to people who want the latest Apple tech without the high cost. For comparison, the M4 iMac and MacBook Pro deliver a similar experience, but prices for those devices start at over $1,000. It’s unknown exactly how long this deal will last as an expiration date wasn’t given, but don’t expect it to last for very long. Act fast and take advantage of the discounts while they last. Deals are subject to sell out or expire at any time, though ZDNET remains committed to finding, sharing, and updating the best product deals for you to score the best savings. Our team of experts regularly checks in on the deals we share to ensure they are still live and obtainable. We’re sorry if you’ve missed out on a deal, but don’t fret — we constantly find new chances to save and share them with you on ZDNET.com. Show more !function(f,b,e,v,n,t,s) {if(f.fbq)return;n=f.fbq=function(){n.callMethod? n.callMethod.apply(n,arguments):n.queue.push(arguments)}; if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0'; n.queue=[];t=b.createElement(e);t.async=!0; t.src=v;s=b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t,s)}(window, document,'script', 'https://connect.facebook.net/en_US/fbevents.js'); fbq('set', 'autoConfig', false, '789754228632403'); fbq('init', '789754228632403'); Source link"
