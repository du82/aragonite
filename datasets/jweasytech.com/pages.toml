["https://jweasytech.com/2025/03/01/samsungs-midrange-galaxy-a56-has-ai-photo-editing-and-a-bump-for-its-buttons"]
title = "Samsung’s midrange Galaxy A56 has AI photo editing and a bump for its buttons – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "TechnologySamsung’s midrange Galaxy A56 has AI photo editing and a bump for its buttons March 1, 2025 While I naively hoped to see the Galaxy S25 Edge ahead of MWC, that wasn’t what I saw last week at Samsung’s pre-show briefing. However, what I did see might intrigue many of you: a cheaper slice of Galaxy hardware in the form of the Galaxy A56. It will be available later this year, starting at $499 (or £499 in the UK), which is slightly cheaper than the Pixel 8a when it first appeared. Samsung also announced the Galaxy A36 and A26 today, and they’ll start at $399 and $299 respectively. Many of the A series upgrades this year match what we saw from the S25. The A56 is thinner than its predecessor, down to 7.4mm from 8.2mm, while packing a marginally bigger 6.7-inch screen. The bezels, which were usually one of the most prominent visual tells of an A series, have been shaved the device’s bezels down further on the A56, too. Photo by Mat Smith for Engadget. The hardware has been tweaked, with a brushed metal frame and a minor design twist: a new slightly protruding bump on the side where the volume and power buttons sit. When I got to handle the A56 briefly, I liked this. Asymmetry aside, it was easier to handle, which was surprising since this was a 6.7-inch device, and I’m more used to 6.3-inch phones. The A56 felt less unwieldy. (Did Samsung’s designers read my unhinged editorial on the sides of phones and decide to muddy the waters further? Perhaps.) It’s a mixed bag on camera specs this year. The front of the A56 now has a lower-res 12-megapixel selfie camera, while on the back sits an upgraded 12MP ultrawide, 50MP main sensor with an f/1.8 lens and optical image stabilization. There’s still a 5MP macro lens for someone out there. Those new cameras feature many of the latest upgrades on the S25 family, including improved image signal processing for better low-light performance, as well as a raft of AI features, including enhanced subject detection in portrait mode. Samsung says the A56 will better recognize sky, skin, faces, hair and grass for improved bokeh effects. Regarding AI-powered image editing, there’s also Object Eraser, auto trim for videos and Create Filter, where you can choose an existing image and apply its color and tone to a different photo. You’ll also get Best Face, which lets you pick from multiple captures for everyone’s best expression, as long as you have motion photos enabled. These aren’t new features on smartphones, but their addition brings the midrange A56 closer to the Galaxy S25. Through One UI 7, the A56 gets style flourishes and home screen improvements like the Now bar, notification panel changes and scalable widgets in different shapes and sizes. Samsung also promises six generations of OS updates (up from four on last year’s A55) and six years of security updates. Photo by Mat Smith for Engadget. As you can tell by now, there aren’t any surprises here. The 5,000mAh battery is the same size as the A55’s, although the charging speed is now 45W. The company says you can charge the device fully in just over an hour. Samsung has swapped to its own 4nm Exynos 1580 chip, too, with CPU boosts of around 18 percent. The hardware, once again, inches closer to the quality and premium feel of what we typically see on Galaxy S devices. It’s peak midrange phone season. The Galaxy A56 goes up against the recently launched iPhone 16e, while rumors suggest Google’s Pixel 9a could break cover very soon. The Galaxy A36 and Galaxy A26 Samsung also announced the Galaxy A36 5G and Galaxy A26 5G today, which both have 6.7-inch screens that get as bright as 1,200 nits and refresh at up to 120Hz. They come with One UI 7 as well, including features like Circle To Search that previously launched on pricier phones. Plus, they also feature triple camera systems on the rear with a 50MP main sensor, though their ultrawide setup camera is not as sharp as the A56 at 8MP. Some of the software features, like Best Face, are also reserved for the A56, though you’ll still find the updated Object Eraser and Filters on the pair of cheaper handsets. Finally, though the A36 and A26 have the same IP67 rating and 5,000mAh battery as the A56, they’ll only pack 6GB of RAM and the A36 uses the Snapdragon 6 Gen 3 processor instead of the Exynos 1580 in the A56. Galaxy A56 price and availability In the UK, the Galaxy A56 will go on preorder on March 2nd and launch on March 19th. It’ll come in four “awesome” (Samsung’s wording) colors, Graphite, Olive, Pink and Light Grey. Because nothing screams awesome like a lighter shade of grey. While we do have US pricing, Samsung hasn’t shared more precise timing for availability than “later this year.” Source link"
