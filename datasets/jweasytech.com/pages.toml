["https://jweasytech.com/2025/03/01/us-firms-glsdb-2-0-bomb-to-offer-improved-electronic-warfare-resilience"]
title = "US firm’s GLSDB 2.0 bomb to offer improved electronic warfare resilience – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "EngineeringUS firm’s GLSDB 2.0 bomb to offer improved electronic warfare resilience March 1, 2025 Defense giant Raytheon, a division of RTX Corporation, is developing a ground-launched variant of its GBU-53/B Small Diameter Bomb II, the precision-guided, long-range munition known as StormBreaker. Raytheon has not disclosed full details but plans to begin testing the weapon this summer, according to Jon Norman, Vice President of Air & Space Defense Systems Requirements & Capability, during the Fighter Pilot Podcast. Currently, the company is assessing propulsion options, weighing a traditional solid-propellant system against an air-breathing jet engine. Solid-fuel and jet engine options for new weapon One option is to equip the GBU-53/B with a booster, launching it to a high altitude where it can glide toward its target. Another approach involves adding a miniature turbojet engine, effectively turning the bomb into a cruise missile. Regardless of the chosen option, it will be applied to both the ground-launched version and the extended-range air-to-air variant, allowing strikes from significantly greater distances. The current StormBreaker already achieves a range of approximately 110 km when released from high altitudes. An earlier effort to adapt a Small Diameter Bomb for ground launch involved modifying Boeing’s GBU-39/B with a solid booster, leading to the development of the GLSDB in collaboration with Raytheon and Saab. However, in combat operations over Ukraine, the system was found to be vulnerable to Russian electronic warfare countermeasures. GBU-53/B brings major guidance upgrades over its predecessor Unlike its predecessor, the GBU-53/B features a significantly more advanced guidance system. The original GBU-39/B Small Diameter Bomb relies primarily on satellite and inertial navigation, with only a specific subvariant incorporating a semi-active homing system. Since this lightweight bomb depends entirely on precision, electronic warfare disruptions can greatly diminish its effectiveness. In contrast, the GBU-53/B Small Diameter Bomb II integrates multiple terminal guidance systems, including active radar, semi-active laser homing, and a thermal imaging seeker. Satellite and inertial navigation are used only during midcourse flight. Thus, even if the satellite connection is jammed, the StormBreaker can still reach the target area and independently acquire the target, without needing precise coordinates. The shift to considering a jet engine over a rocket booster by Raytheon is likely influenced by lessons learned in Ukraine, where modern electronic warfare and air defense systems present significant challenges. In the past, Ukraine received Raytheon’s RIM-7 SEASPARROW missiles, a direct development of the AIM-7E Sparrow air-to-air missile system. These advanced missiles, launched from Soviet-era 9K37 BUK (NATO designation SA-11) systems, significantly enhanced Ukraine’s defense capabilities. One of the lessons for the U.S. defense leader now is that while boosting the weapon to high altitudes gives the enemy more time to react and intercept, flying at low altitudes to avoid detection could offer a better chance of success. Source link"
