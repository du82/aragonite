["https://jweasytech.com/2025/03/01/spacex-readies-a-redo-of-last-months-ill-fated-starship-test-flight"]
title = "SpaceX readies a redo of last month’s ill-fated Starship test flight – JWEasyTech"
description = "Just Works Easy Technology Information"
full_description = "TechnologySpaceX readies a redo of last month’s ill-fated Starship test flight March 1, 2025 FAA’s green light The FAA confirmed Friday it issued a launch license earlier this week for Starship Flight 8. “The FAA determined SpaceX met all safety, environmental and other licensing requirements for the suborbital test flight,” an FAA spokesperson said in a statement. The federal regulator oversaw a SpaceX-led investigation into the failure of Flight 7. SpaceX said NASA, the National Transportation Safety Board, and the US Space Force also participated in the investigation, which determined that propellant leaks and fires in an aft compartment, or attic, of Starship led to the shutdown of its engines and eventual breakup. Engineers concluded the leaks were most likely caused by a harmonic response several times stronger than predicted, suggesting the vibrations during the ship’s climb into space were in resonance with the vehicle’s natural frequency. This would have intensified the vibrations beyond the levels engineers expected from ground testing. Earlier this month, SpaceX completed an extended-duration static fire of the next Starship upper stage to test hardware modifications at multiple engine thrust levels. According to SpaceX, findings from the static fire informed changes to the fuel feed lines to Starship’s Raptor engines, adjustments to propellant temperatures, and a new operating thrust for the next test flight. “To address flammability potential in the attic section on Starship, additional vents and a new purge system utilizing gaseous nitrogen are being added to the current generation of ships to make the area more robust to propellant leakage,” SpaceX said. “Future upgrades to Starship will introduce the Raptor 3 engine, reducing the attic volume and eliminating the majority of joints that can leak into this volume.” FAA officials were apparently satisfied with all of this. The agency’s commercial spaceflight division completed a “comprehensive safety review” and determined Starship can return to flight operations while the investigation into the Flight 7 failure remains open. This isn’t new. The FAA also used this safety determination to expedite SpaceX launch license approvals last year as officials investigated mishaps on Starship and Falcon 9 rocket flights. Source link"
