["https://jxnblk.com/blog/modular-characters-part-one"]
title = "Modular Characters Part I | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "Since Novantica is set in a futuristic city, I always wanted to make sure the game had a certain level of city life – people walking around, bots zooming by, drones buzzing, trams gliding, and bikes rolling along. I hadn't done much 3D modeling before learning Unity, and, while modeling props, buildings, and other blockish things didn't seem to difficult, I struggled with creating humanoid characters. I knew that I wanted something low-poly, simple, and a bit cartoonish for the game's characters, but I'll admit that character design is probably not my strong suit. I watched a lot of video tutorials and studied characters from other games, and I settled on a general style that I felt was good enough, but wanted to polish the character artwork before releasing the game. I also wanted to improve upon the diversity and variety, while giving the NPCs just a little bit more personality. The existing NPCs were just a set of different models, with different hair styles, body shapes, and clothing. As you walked through the city, you'd inevitably encounter the same model over and over again. I could explain it away in the game by saying that the story involves time travel, but I wanted more random variety of the NPCs populating the city. The best way I could think of achieving this was by modularizing the characters so that I could randomly generate any number of NPCs using primitive parts and different color palettes. I started with rebuilding the core characters in Blender to try to nail down an approach and style that fit better with the feel of the game. Once I was happy with the general look and feel, I started building out modular characters based on this style. Starting with a base body type, I added multiple different models for hair styles, tops, bottoms, shoes, and accessories like sunglasses and hats. For coloring the models, I created several new textures that are UV mapped based on skin, hair, and colors for the tops, bottoms, shoes, and accessories. This way I could swap the texture on the model to change the complexion and colors of the outfits independent from the parts."
year_published = 2025
