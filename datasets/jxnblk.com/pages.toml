["https://jxnblk.com/blog/making-sourdough-and-learning-unity"]
title = "Making Sourdough & Learning Unity | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = '''In March 2020, I remember the former mayor one day telling people to go out for dinner and see a show – and the next day hearing that it wasn't safe to get within six feet of another person. If you haven't been to New York before, it's not easy to walk around outside and not get within six feet of another person. In hindsight, it was relatively safe to be outdoors, but at the time, we were afraid to step outside the door for a few weeks. I also remember a lot of people thinking that the whole thing would blow over in a month or two, but everything that I had been reading made me suspect that was far too optimistic. As someone who walks to get to 99% of the places I'm going and thoroughly enjoys it, I realized that I would have to pick up a few new hobbies to keep my sanity. Like so many others suddenly given more time to pursue domestic endeavors, I started trying to cook things that I'd never tried before. After a few loaves of bread and even more cleaning than I usually do, I realized that I'd need more creative outlets to occupy my time. I also found myself playing an unhealthy dose of games like Animal Crossing, which sparked an itch that I've had ever since I was a child. That summer, Unity started offering all its online learning courses for free, and I started to dive in. This wouldn't be the first time I thought about developing video games. When I was in elementary school in the 1980s, my neighbor and childhood best friend's dad had brought home an IBM PC. We were all familiar with the Apple IIes at school, but this thing was a completely different beast. It had one of those green and black displays (high tech compared to printers), and flipping the power switch on the back made it sound like an airplane was taking off inside my neighbor's basement. Even at that time, it was not a new computer – we affectionately called it "The Dinosaur." Other than drawing awesome pictures with LOGO at school, this was probably my first introduction to programming languages. We learned how to do a few things in BASIC, then immediately started to plan out how to build our own video game. I sketched out a bunch of characters and sprites on graph paper, but we never finished our Bomber Man clone.'''
