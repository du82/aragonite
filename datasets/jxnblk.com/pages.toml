["https://jxnblk.com/blog/portability"]
title = "Portability | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = '''In software development, formats help ensure that content and data are portable and can be used in many different applications. By adhering to HTML standards set by the WHATWG and W3C, browsers created by different organizations can render HTML documents created by many different people and generated in many different ways. That is, HTML is a portable format that can be rendered by many different clients. While HTML is certainly one of the most successful examples of standardization ever, less widely used formats can still benefit from the same idea. Take Markdown as an example. It was created in 2004 by John Gruber and Aaron Swartz, and today is the de facto format for writing software documentation. It isn't widely used outside the field of software development, but there are many different engines that can render this format into HTML. Markdown has become a somewhat portable format. By writing documentation, blog posts, or wiki pages in this format, you can use many different tools to render the content in different places, and you can be fairly certain that there will always be tools that can render this format in the future. Markdown was intended to be easy-to-read and easy-to-write, and can be viewed as a simple abstraction on top of HTML. A complete HTML page cannot be replaced by Markdown, but all Markdown files can be written as HTML. Most people find markdown simpler to read and write than raw HTML, and prefer using it for things like blog posts and documentation. In the same way that Markdown has found a niche in certain contexts for authoring HTML, I'm very interested in taking this idea and applying it to CSS. "But, CSS is already easy to read and write," you might say. Sure, but when I'm considering which styles differ the most across different interfaces and which styles make the biggest impact, I'm mostly concerned with three things: color, typography, and layout. Authoring an entire stylesheet to apply styles like this can require some effort, and the end result isn't as portable as you might think. Simply copying a stylesheet from one website to another does not guarantee that the styles will be applied the way you intend them to be. A lightweight abstraction for this sort of thing, however, could make these sorts of styles more portable.'''
year_published = 2025
