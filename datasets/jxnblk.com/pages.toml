["https://jxnblk.com/blog/patterns-for-style-composition-in-react"]
title = "Patterns for Style Composition in React | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "While React is extremely flexible in terms of how you can structure your application’s UI, I’ve found that a few patterns for style composition have helped me keep things organized and easy to work with. These aren’t hard-and-fast rules, these are simply reflections on how I’ve come to organize components in apps that I’ve worked on. Although the level of abstraction here might look like overkill for smaller projects, I find that this general approach has sped up my development across the board. I won’t get into approaches for state management or handling the business logic of your app, instead I’ll be focusing primarily on the visible and interactive parts of the UI. Generally, I like to keep styles separated from the parts of the app that are tied to state. That means routes, views, containers, forms, layouts, etc. should not have any styling or classes in them. Instead, these heavy-lifting components should be composed of primarily stateless functional UI components, sometimes referred to as presentational components. By keeping styling concerns separate from the application state, pieces can become more reusable and building out new views and containers can be quicker. Notice how none of the elements have a className or style prop. Using className or style props at this level could be considered a code smell. Each UI component used here encapsulates its own styling, and the styling simply becomes an implementation detail, which means a UI component can be updated or refactored without affecting anything else in the application. An example Button component, like the one in the form above, might look something like the following: I’ve used inline styles here for readability and to help demonstrate how this works, but any CSS-in-JS solution can be used instead and won’t have any affect on the form component above. By keeping all styling encapsulated in this component, the rest of the application doesn’t need to know anything about the Button beyond its props API."
