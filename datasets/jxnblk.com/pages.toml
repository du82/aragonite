["https://jxnblk.com/blog/mathematical-web-typography"]
title = "Mathematical Web Typography | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "When it comes to designing for the Web I like to follow a handful of general principles. First, design for the medium, or as Frank Chimero puts it, follow “the grain of the Web”. The Web is fluid - based on screens and devices of varying sizes – and typography on the Web should reflect that. Second, design content-out, which usually means designing around a strong typographical base since the large majority of Web content and UI is text. And last, design with modular scales. Things built on the Web should be fluid and infinitely scalable. Using modular scales in a design compliments that idea and keeps things organized in the face of growing complexity. Often when looking at how different sites have handled typography, I see similar problems arise. Instead of sticking to a limited, modular scale, any one site might have hundreds of font sizes declared and many more margin and padding declarations affecting the white space. Instead of conforming to a common convention that could help users make sense of the underlying complexity, these sites have added to the cognitive overhead with little to no benefit for the user. In my experience, a page rarely needs more than six font sizes to effectively convey its information hierarchy, and that’s exactly how many font sizes are provided with HTML headings. Instead of focusing on systems that enhance the content, design solutions often focus on singular context-specific problems and introduce magic numbers that quickly grow out of hand. These context-specific problems should inform the larger system, not break it. While these one-off cases may seem harmless in isolation, they often cause increasing complexity in a code base, and can lead to unintended side effects – increasing technical debt and slowing down development speed. While there may not be any one way to solve these problems, many sites try to address them with a style guide and well-defined typographic systems. Many typographic conventions have been around for centuries, but most of that knowledge was based on technology that involved physical pieces of metal and paper media. The majority of these conventions are still applicable on the Web, but I also think that the different constraints and capabilities of screens warrant some new approaches."
