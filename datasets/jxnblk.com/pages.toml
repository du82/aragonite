["https://jxnblk.com/blog/the-three-tenets-of-styled-system"]
title = "The Three Tenets of Styled System | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "I released Styled System around a year and a half ago, and since then, the library has been growing steadily and has even resulted in a few copycat libraries that use some of the same conventions. Up until now, I haven't really written much about the thinking behind the library, but have relied more on my approach of show, don't tell1. And while this library is certainly an iteration on a theme2 (those who have followed me for years may have a clear idea what it is meant for), I'd like to expand on what I think makes Styled System a great fit for some teams. It's not meant to solve every styling problem out there, but it is focused on some of the issues I've noticed over the years for diverse teams working on codebases where developers and designers may have varying levels of expertise with CSS and other technologies. I have a huge amount of respect for developers who focus on CSS and who strive to understand the intricacies of an ever-growing specification, but in my experience, it's far more likely that developers are focused on other parts of the Web stack and generally know just enough CSS to be dangerous. I don't think that means that CSS should be completely abstracted away, but I do think there is opportunity for creating powerful abstractions that make it easy to do the right thing3. Styled System is meant to be just one such abstraction. Consistency is the bedrock of any constraint-based design or design system effort. It goes hand-in-hand with software development principles like Don't Repeat Yourself (DRY) and the general idea of abstraction. With modern tooling like CSS-in-JS it's never been easier to ensure that values are type safe and that styles are consistent to a certain degree. Styled System takes advantage of some of these capabilities and attempts to help teams bake this consistency in by default. A hard-coded font size or color value in a code review is easy to smell, and developers naturally opt-in to keeping values stored in a globally shared theme object."
