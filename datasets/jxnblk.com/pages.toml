["https://jxnblk.com/blog/iterations-on-a-theme"]
title = "Iterations on a Theme | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = '''As my personal GitHub account rolls over 500 repos (apparently a few of them are private), it felt like a good time to reflect on how I approach using GitHub personally. You might say, "500! Whoa, buddy, that's way too many repos!" Believe me, it is. There are other people who do a much better job at staying organized than I do. But most of my repos aren't fully-baked open source projects. I see a lot of them as small experiments, my attempt to learn in public, or, for many of them, iterations on a theme. It might look like I'm cranking out new things left and right sometimes, but often I get the itch to rework an old idea, as a complete rewrite, with no baggage attached. There's certainly something to be said about starting with a blank slate. I need to do a better job of managing expectations, since a lot of these aren't intended to be hard dependencies in an application, but serve as good starting points for forking or suggestions for features in upstream libraries. For example, Rebass (didn't invent but) included a css prop until styled-components included one as well 1. It also had an is prop, until it was adopted and renamed as. The idea with these features was never to own these concepts forever, but to serve as a testing bed in userland and prove out APIs that might make sense in upstream libraries, many of which weren't mature enough for a formal PR. Some repos and ideas fall on the other side of the fence, not being all that great, and I think were better left as experiments. In looking back on some of these repos, I started thinking about how they've evolved over time and noticed a few overarching themes. Ever since learning about Jekyll years ago, I've been fascinated with the idea of generating simple static sites with modern tooling. What started as a blog post about static site generation in 2015, became a zero-config CLI in 2016 (appropriately named static-react). I took the same zero-config philosophy and applied it to webpack with a CLI named hotdamn (it even supported markdown for content). I was also really interested in the idea of how to make React more accessible to people who weren't JavaScript developers and made Ejsx. In 2017, working with a few others, some of these ideas became x0 and a little later mdx-go. I'll also admit that I have several private repos that generate static HTML through some means or another. I might be a little obsessed with this idea.'''
