["https://jxnblk.com/blog/design-graph"]
title = "The Design Graph | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "Working on various websites and web apps for over a decade, I've gravitated around certain words and phrases to talk about design constraints in user interfaces. Despite the rich vocabulary for talking about visual design, it feels like there isn't a great way to accurately describe the interconnected nature of working with design constraints. Talking about color palettes, using typographic scales, themes to codify the design language, or the component API of a particular library has often felt a little too disjointed for what I think should be a tightly woven system. The term design systems used to somewhat fill this void, however it's taken on a much larger meaning over the past few years and includes the people, organizations, and processes (among many other things), in addition to the implementation details. So, how can we talk about the implementation details of UI design in a more precise way? And, how can we build upon these concepts to push UI design to a higher level of abstraction? While working on tools that prioritize interoperability, themeability, portability, and the concepts of libraries like Theme UI, I've started thinking about a more holistic view that I call the Design Graph. The Design Graph isn't an actual implementation, but rather a conceptual model that includes pairwise relationships between its parts, or nodes to borrow a term from graph theory. Theme UI is one implementation that attempts to adhere to this model, and it's a great example of how the Design Graph can become more than the sum of its parts. Theme UI's source code isn't particularly complex or large, and it's similar to a few other libraries out there. The thing that really differentiates Theme UI is that it's meant to be built upon, hacked on, and iterated on to enable a higher level of interoperability across libraries. If you only look at what Theme UI does, you'll easily miss what it can enable. If you use Theme UI to build Gatsby themes, a component library, or a website, these things should all just work with other tools like Blocks UI. In the future, imagine if there are VS Code and Figma plugins, documentation generators, static analysis tools, and more that follow the same Design Graph schema so that the component library you have today gets a whole lot better over time. I want this imaginary future."
year_published = 2025
