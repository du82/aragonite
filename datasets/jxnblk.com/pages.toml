["https://jxnblk.com/blog/themeability"]
title = "Themeability | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "I've been interested in the idea of constraint-based design for a while. By constraining the solution space for a particular problem, new and novel ideas can emerge beyond the initial problem's scope. In the context of UI design, when you don't need to decide whether a heading's font size should be 22 or 24 pixels, you have more time to decide what that heading should say in the first place or whether there should be a heading at all. Like other tools aimed at promoting creative focus, design constraints can help create a distraction-free environment for creative thought. Design constraints can be viewed as a sort of hierarchy of needs – when you stop spending energy on lower-level problems, you can start exploring higher level abstractions in design. I've tried to distill some of this thinking into several different open source libraries over the years, notably Basscss, Rebass, and Styled System. While libraries like Basscss and Rebass were certainly not instant hits, some of their core ideas have slowly gained traction. And now, Styled System is becoming a more-and-more widely-used solution for applying visual design constraints within component libraries and design systems. Styled System is a solution for managing design constraint scales within certain domains of visual design. By defining a typographic scale, negative space scale, color palettes, and other visual attributes in a theme object, these values can be systematically applied to components where needed, while still allowing the flexibility to override values contextually within an application. Styled System provides an API to make doing the right thing easy when applying consistent styles throughout an application. At its core, it's a suite of utilities to create functions for mapping design constraints to components, and it helps you build a UI component library with a more consistent props API. I like to think of it as styling as a function of design constraints. Styled System is a fairly mature library at this point and much of the recent development has been focused on utilities that expand upon this core idea. While Styled System is great for building design systems and component libraries, it's not an ideal solution in and of itself for creating white-labels or themeable user interfaces. Styled System is completely framework-agnostic and requires the user to create their own components that integrate with other CSS-in-JS libraries. It requires you to make intentional, upfront decisions about the overall component API, which is great for corporate design systems, but shouldn't be neccessary for applying a design constraints in general-purpose UI development. And, while it is possible, Styled System doesn't provide much guidance for creating applications that are truly themeable."
