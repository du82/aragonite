["https://jxnblk.com/blog/universal-ui-components"]
title = "Universal UI Components | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "For a while now, I’ve been interested in the idea of creating portable, interoperable functional UI components that can work in any DOM rendering library, whether it’s React, Preact, hyperscript, bel, yo-yo, or some other library. The idea of functional UI components is a simple one: pass arguments into a function and it returns a representation of the DOM, usually with encapsulated styles and interactivity handled with callbacks to a global state, a la Redux. If you look at the currently available technology, there are predominantly three ways to create these components: Each has its own pros and cons. While JSX is mostly syntactic sugar, some prefer to use standard JavaScript syntax. One big advantage JSX has is that it abstracts away the function used to create DOM elements. For example, React uses React.createElement while Preact uses Preact.h. The pragma used in JSX is configurable by the end user. Hyperscript, although older than JSX, uses a similar function, but is written in standard JavaScript. Tagged template literals are also standard JavaScript, but require a little bit of extra code to change template literals into DOM elements. Assuming we pick one of the above syntaxes, there are relatively few differences among the implementations of components across libraries. For example, here is a bare-bones Button component for several different libraries. For brevity, styles have been left out of these examples. There are still quite a few differences in syntax between JSX, hyperscript, and tagged template literals. For the sake of this post, I’ll focus on implementing these components in JSX. The first three examples are covered, but here’s what the hyperscript and yo-yo examples would look like in JSX. For each of the non-React versions, JSX needs to be configured to use the appropriate pragma. Hyperscript and Preact both name their create element functions h. Here is an example .babelrc configuration. Although the other libraries name their create element functions differently, they can all be named h within the components for cross-library compatibility."
