["https://jxnblk.com/blog/unit-testing-ui"]
title = "Unit testing UI | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = 'I recently read this excellent article, where the design team at Vox has devised a testing framework for new UI components introduced into their pattern library. While the methods they suggest are excellent, and what I’d consider something that should be industry-standard in our field, it got me thinking that this concept could be taken a step further. What if designers wrote actual unit tests for UI components? What if those tests were actually applied in user acceptance testing, A/B tests, and tested against performance metrics? Taking a cue from test driven development, these tests should be written before any design work is started, and they should "fail" – because there’s no design yet. You might notice that this looks suspiciously like a user story, but I think this approach differs in a few ways. First, user stories attempt to capture the how and why in addition to the what. These unit tests only concern themselves with what. Secondly, user stories are very much a part of Agile software development, whereas these are simply meant to measure the design of UI components. Once you have a potential component, or even better, several potential components, you’d be ready to start testing it against the unit tests previously written. These tests shouldn’t overshadow the typical formats and methodologies of user testing, A/B testing, etc. Instead, they should be used as an analytical tool to gauge the results. If, when user testing a feature, the user doesn’t notice the button, there’s still more design work to do. If, after ramping up a new button component, A/B testing shows that conversion is lower than expected, there’s still more work to do. If users are bouncing at higher-than-anticipated rates because of slow page load, there’s still more work to be done. Now, I will admit that design work is a lot less black and white than software development can be, and that it might be easy to shoot yourself in the foot with an approach like this. If, for example, conversion never gets above 3.9%, and you spend 2 weeks designing and redesigning a button, there are probably some other variables affecting things, and there are better ways to prioritize your time.'
year_published = 2025
