title = "The Modern Front-End Design System Stack | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = '''Design systems come in all shapes and sizes and can encompass a wide range of skillsets and roles within an organization. As a front-end developer, I'd like to share some of the tooling that I've found to be helpful when building out the components and code portion of a design system in modern applications. On more than one occasion, I've been asked what a blessed "Jackson Stack" would look like. This list is likely to change in the future, but the following are tools that I think are both stable and beneficial to working in design systems in 2019. This doesn't attempt to cover every aspect of a design system, and there is always room for experimentation and exploration, so please take this as more of a starting point rather than a definitive list of tools to use. Full disclosure: I've worked on or with many of the tools listed in this post, and this reflects my own personal opinions. Don't sweat it if you're not using any of these, this is merely one perspective on the matter. I use the term modern here to refer to React and related technologies. This isn't meant to be an exclusive definition, and hopefully some of this tooling can serve as inspiration for tooling with other modern front-end libraries like Angular or Vue.js. For the sake of pragmatism and my own personal experience, the scope of this article will be focused on React. If you're a full-stack Rails developer, a designer working in CSS, or someone who doesn't touch code at all, hopefully you can steal some ideas and apply them to the tech stack that you use professionally. Everything is a component. I've found this mode of thinking in UI development to be extremely beneficial, and modern front-end applications are built upon functional, component-based architectures. While React itself offers almost zero guidance on how to manage styling, userland libraries like Emotion and Styled Components give you a way to author styles in a component-friendly way. While some might be skeptical of the sorts of abstractions introduced by CSS-in-JS libraries, those who embrace it find it to be a liberating way to author styles. Many (not all) of the problems that people typically encouter while working within a complex CSS codebase tend to go away when you adopt a JavaScript-based solution for managing styles. Developers no longer have to fight specificity wars, police pull requests for not conforming to a strict naming convention, or constantly worry about the ever-increasing size of their stylesheets. If there's only one thing from this list that you take away, I hope that it's this:'''
