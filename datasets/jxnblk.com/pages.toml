["https://jxnblk.com/blog/color-palette-documentation-for-living-style-guides"]
title = "Color Palette Documentation for Living Style Guides | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = "Virtually every style guide has a color palette section in its documentation. Many times I’ve seen this documentation created manually, where every change to a color requires updating the values in two places – the stylesheet and the style guide. This often leads to one falling out of sync with the other, and makes maintaining a living style guide more difficult. The problem with this approach is that the values are being defined in two different places. For a true living style guide, the code should serve as the single source of truth. Extracting color values from CSS can help keep documentation in sync, expose outdated colors, and point out opportunities for normalizing designs. The following will show how to use Node.js to build source-code-derived documentation for color palettes and present color contrast values for each possible pairing as a guide for usage. If you’re already using Node.js in your build system, you can integrate this directly into your project. For the purposes of this tutorial, create a new sandboxed project to experiment with. The PostCSS module will be used to transform the source CSS into an AST for manipulation with JavaScript. Color will be used to convert the values found in the stylesheet to hexidecimal. Colorable will be used to get color contrast values and WCAG scores for every possible pairing of colors. And lodash will be used to find unique color values and to render templates to HTML. Copy a CSS file into the project to use as a source for the color values. This tutorial will use Basscss as an example. Create a new build.js file that will be used to read the CSS file and eventually to generate an HTML page. The parse-colors module takes raw CSS and transforms it into an AST that can be iterated over. For now, this just logs all the properties found in the stylesheet. Next update the parse module to filter out everything but color and background-color properties, convert the values to hex, and remove duplicates. While color values can be used in other properties including the background shorthand, handling that would add complexity and will be omitted from this tutorial."
