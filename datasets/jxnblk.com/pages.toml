["https://jxnblk.com/blog/two-steps-forward"]
title = "Two Steps Forward, One Step Back | Jxnblk"
description = "Design engineer and aspiring indie game dev based in Brooklyn, NY"
full_description = '''Back in 2013, Adam Morse and I were following along the incredible work that Nicole Sullivan and others like Nicolas Gallagher were doing with Object-Oriented CSS (OOCSS). Our explorations around working with CSS-related tech-debt led to the creation of Basscss and Tachyons and the birth of "Utility CSS". These libraries inspired other design systems such as Buzzfeed's Solid and GitHub's Primer CSS. Even Bootstrap eventually added more utility-centric styles. This methodology became known by many names, including Atomic CSS, Functional CSS, and Utlity CSS, but I've started referring to it as Atomic/Functional/Utility CSS or AFUCSS. This sort of sounds like Hey, F you!, which is a pretty typical response when most people first encounter this flavor of CSS. Whatever your opinion on this methodology was, it tended to help with a few common problems of working with CSS at scale. Around the same time, we started working on CSS Stats, which helped validate some of our hypotheses about CSS filesize and front-end performance. Applying this methodology to production web applications at the time helped shave of hundreds of kilobytes of CSS that was being shipped to end users. Despite Tachyons' popularity, no single library ever took over the industry at a level that would negate the steep learning curve involved. This meant that not only did developers have to learn a new methodology, but also an inevitably large custom classname API. CSS is a powerful and nuanced language, but utility CSS can never fully replace it. Eventually, you'll need to add one-off styles that just aren't covered by the library you're using, and there isn't always a clear way to extend what you're working with. Without a clear way to handle things like this, developers tend to add inconsistent hacks and append-only styles. As any utility-based CSS library grows, so does the amount of CSS you ship to your users, leaving you reliant on more build tools to remove styles that you were never going to use in the first place. While it was generally better than other methodologies at the time with regard to CSS filesize, it still wasn't ideal.'''
year_published = 2025
