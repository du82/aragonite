full_description = "Hi, and welcome to my KDP income reports. I’m a “wide” self-published and traditionally-published author, and have been publicly reporting my revenue since January 2018. Follow along with my self-publishing journey, as I share detailed numbers from Amazon KDP, IngramSpark, wide publishing, Patreon, and other income sources. If you want my income reports delivered straight to your inbox, subscribe to blog updates via email. January 2025 Income Report February 28, 2025 To listen to an audio version of this report, join the Patreon » January’s revenue was $5,814, down from December’s $6,298. Profits were $2,143, up from December’s $2,022. keep on reading » December 2024 Income Report (and 2024 review!) January 28, 2025 To listen to an audio version of this report, join the Patreon » December’s revenue was $6,298, down from November’s $6,968. Profits were $2,022, down from November’s $3,351. This is also the last report of 2024. 2024’s revenue was $82,673, down from 2023’s $88,202. Profits were $43,301, down from 2023’s $56,722. keep on reading » November 2024 Income Report January 02, 2025 To listen to an audio version of this report, join the Patreon » November’s revenue was $6,968, down from October’s $8,815. Profits were $3,351, down from October’s $4,853. keep on reading » October 2024 Income Report November 25, 2024 To listen to an audio version of this report, join the Patreon » October’s revenue was $8,815, up from September’s $8,606. Profits were $4,853, down from September’s $5,745. keep on reading » September 2024 Income Report October 25, 2024 To listen to an audio version of this report, join the Patreon » September’s revenue was $8,606, down from August’s $9,077. Profits were $5,745, up from August’s $5,082. keep on reading » August 2024 Income Report September 27, 2024 To listen to an audio version of this report, join the Patreon » August’s revenue was $9,077, down from July’s $9,084. Profits were $5,082, down from July’s $5,553. keep on reading »"
