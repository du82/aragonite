["https://kaffee.org/masala-chai"]
title = "Wie macht man traditionellen Masala Chai?  |  kaffee.org"
full_description = "Mit Masala Chai wird ein ursprünglich aus dem asiatischen Raum stammendes Mischgetränk bezeichnet. Das indische Wort „Masala“ kann grob mit „Gewürzmischung“ übersetzt werden, wobei das „Chai“ vom chinesischen Wort „Chá“ für Tee abgeleitet wird. Masala Chai besteht aus Schwarztee, Zucker oder Honig, Milch sowie einer besonderen Gewürzmischung und gilt wegen seiner anregenden Wirkung als besonders beliebt. Chai ist eine gute Alternative für Latte Macchiato-Liebhaber. Masala Chai – ein Teegetränk der besonderen ArtMasala Chai ist das Nationalgetränk in Indien und feiert auch in Europa seinen Siegeszug als Trendgetränk. Neben der Selbstzubereitung, dem Erwerb von Teebeuteln in Teeläden und Coffeeshops, kann Masala Chai jetzt auch als Kapsel für die Nespresso Kaffeemaschinen bezogen werden. Zu den klassischen Zutaten für den Masala Chai gehören ein starker Schwarztee, der oft aus einem kräftigen Assam gebrüht wird, sowie Milch, Zucker oder andere Süßungsmittel. Das besondere Aroma wird dem Masala Chai jedoch durch die Gewürzmischung verliehen, die in Indien von Familie zu Familie variiert. Traditionelle Gewürze für den Masala Chai sind Nelken, Kardamom, Anis, Fenchelsamen, Zimt und Ingwer, die in fast jeder Rezeptvariation zu finden sind. Die verwendeten Gewürze entfalten zumal eine anregende Wirkungsweise. Insbesondere Kardamom soll sich nach der Lehre positiv auf die Lebensenergie und die Verdauung auswirken. Dadurch, dass nahezu jede Familie ein eigenes Rezept für den Masala Chai überliefert, kommen als würzende Zutaten auch Pfefferkörner, indische Lorbeerblätter sowie Muskat in Betracht. Statt Zucker wird je nach Region und Geschmack auch Honig als Süßungsmittel verwendet. Für die Zubereitung eines Masala Chai wird das Wasser mit der Milch, dem Zucker oder Honig und den Gewürzen aufgekocht. Erst nach einer Kochzeit von etwa einer Minute werden die Teeblätter hinzugefügt. Nach einer Ziehzeit von mindestens zehn Minuten wird der Masala Chai durch ein Sieb abgegossen und serviert. Hier das Rezept:"
