["https://kaffee.org/excellentas-kaffee-test-mit-cafflano"]
title = "Excellentas - Kaffee Test mit Cafflano  |  kaffee.org"
full_description = "SANJON aus Kolumbien:Prämiert mit 86,95 Punkten beim Cup of Excellence, überzeugt der frische, saftige Spezialitätenkaffee Sanjon mit der Süße von braunem Zucker und getrockneten Trauben. Sein samtiger Körper wird dabei durch Nuancen von Kirschen und Teerosen ergänzt. Inbesondere den traubigen Geschmack können wir absolut bestätigen - dieser macht den Kaffee zu unserem Favoriten im Sortiment! GAKENKE aus Burundi:Mit der Kombination aus Schokoladenaroma und dem Duft von getrockneten Früchten, konnte der saftig-cremige Gakenke ganze 85,49 Punkte beim Cup of Excellence einheimsen. Ein besonders vollmundiger Genuss wird versprochen. Testen konnten wir diesen Kaffee allerdings nicht. MIRADOR aus Kolumbien:Vom Cup of Excellence mit stolzen 85,85 Punkten ausgezeichnet, bietet der Mirador ein ganz besonderes Geschmackserlebnis. Sein lieblicher Geschmack von Karamell, Buttertoast und Honig verbindet sich mit dem Duft von Nelken, Kirschen und Brombeeren. Im Abgang überrascht er mit einem Hauch von Eukalyptus - und genau dieser Abgang in Kombination mit dem eher wilden Geschmacks-Mix zeichnet diesen Kaffee aus. Definitiv eine Bestellung wert! COCAGI aus Ruanda:Cocagi ist ein Kaffee mit einem samtigen Körper, der sich durch den milden Geschmack von Pfirsich und Orangen auszeichnet. Nicht zuletzt durch seinen frischen, intensiven Abgang wurde der Cocagi beim Cup of Excellence mit 86,68 Punkten bewertet. Leider konnten wir diesen nicht selbst testen. ILEANA aus Costa Rica:Ileana ist ein mit 85,68 Punkten ausgezeichneter Arabica-Kaffee, der durch den Geschmack von getrockneten Früchten und Waldbeeren eine angenehme, natürliche Süße mitbringt. Durch zarte Nuancen von Zimt, Zitrusfrüchten und braunem Zucker ist dieser cremige Kaffee im Abgang eher süß. Von den mitgelieferten Probe-Packs empfanden wir diesen am schlechtesten. Das lag aber nicht an der Qualität des Kaffees, sondern viel mehr an der (zu) starken hausinternen Konkurrenz! Deckel bzw. Füllbehälter: Das Fassungsvermögen beträgt ca. 270 ml. Es befindet sich eine kleine Öffnung an der Seite aus der letztendlich das heiße Wasser auf die gemahlenen Bohnen gegossen wird."
year_published = 2025
