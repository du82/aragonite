title = "Orangen-Mokka für 4 Personen  |  kaffee.org"
full_description = "Beliebt ist der Orangen-Mokka, wie der Mokka im Allgemeinen, vor allem in der Türkei und im Mittleren Osten. Die Kombination aus süß-saurer Frucht und mildem Kaffee sorgt für ein exotisches Geschmackserlebnis. Schritt: Sahne halbfest schlagen. Orangen-Schale abreiben und mit der Sahne vermischen. Orange auspressen. Schritt: Kaffeepulver mit 1/4 l kochendem Wasser aufgießen. Orangensaft, Zucker und Orangenlikör dazugeben und nochmals zum Kochen bringen. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung. Als engagierter Kaffeekenner achtet Luca auch auf Nachhaltigkeit und ethischen Konsum. Er widmet sich Themen wie fairem Handel, umweltfreundlichen Anbaumethoden und unterstützt lokale Kaffeebauern und -produzenten."
