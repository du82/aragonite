["https://kaffee.org/kaffee-panna-cotta-rezept"]
title = "Kaffee Panna Cotta Rezept  |  kaffee.org"
full_description = "Kaffee Panna Cotta - Panna Cotta ist ein traditionelle italienische Nachspeise. Es gibt sie bereits schon seit dem 10. Jahrhundert und sie wurde in Norditalien erfunden. Jedoch nicht von einer Italienerin, sondern von einer ungarischen Dame.“Panna Cotta” ist übrigens italienisch für “gekochte Sahne” - daher auch der Name des Desserts. Jetzt zerstößt man die Kaffeebohnen mit dem Mörser und kocht sie mit der Sahne, der Milch, Vanilleschote und -mark und mit 60 g Zucker auf. Nun nimmt man die Sahne vom Herd, gießt sie durch ein Sieb und lässt sie etwas abkühlen. Die ausgedrückte Gelatine wird unter Rühren dazu gegeben. Schließlich werden 100 mal Wasser und 60 g Zucker in einem Topf 5-7 Minuten sirupartig eingekocht. Und der Espresso, Likör und das Kakaopulver wird untergerührt. Am Besten verwendet man nur kleine Portionsgläser für das Kaffee Panna Cotta. Es ist nämlich sehr gehaltvoll. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung. Als engagierter Kaffeekenner achtet Luca auch auf Nachhaltigkeit und ethischen Konsum. Er widmet sich Themen wie fairem Handel, umweltfreundlichen Anbaumethoden und unterstützt lokale Kaffeebauern und -produzenten."
