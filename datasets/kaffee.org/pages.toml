["https://kaffee.org/liberica-kaffee"]
title = "Liberica Kaffee  |  kaffee.org"
full_description = "Ihren Ursprung hat die Kaffeepflanze Liberica in Westafrika, heute wird die Pflanze allerdings auch in Südostasien angebaut. Anbaugebiet ist meist das Flachland. Die Pflanze bevorzugt ein eher warmes Klima, darum ist ihr Hauptanbaugebiet in niedrigeren Breiten. Lässt man die Pflanze Liberica frei wachsen, zeichnet sich diese vor allem durch ihr äußerst kräftiges Wachstum aus. Ausgewachsen kann die Liberica Kaffeepflanze so groß wie ein Baum werden, je nach Region und Alter kann die Wuchshöhe bis zu 20 Meter betragen. Auffällig gestaltet sind im übrigen auch die Blätter dieser Kaffeepflanze, welche Keil- oder elipsenförmig sind. Die rote Steinfrucht, die diese Kaffeepflanze auszeichnet, ist im reifen Zustand bis zu 2 Zentimeter lang, die Verbreitung dieser Frucht übernehmen in diesem Fall Vögel, Nagetiere oder auch Fledermäuse. Eine Besonderheit, die vor allem beim Anbau als großer Vorteil angesehen wird, ist die hohe Widerstandsfähigkeit gegenüber Parasiten, auch die Produktionsmenge und die Lebensdauer der Pflanzen können sich durchaus sehen lassen. Grundsätzlich wird der Liberica Kaffee als eine relativ minderwertige Sorte angesehen. In erster Linie liegt das an der Tatsache, dass die Früchte der Pflanze saftarm sind und von Natur aus wenig Zucker enthalten. Ein besonders herber Geschmack ist die Folge. Der Koffeingehalt dieses Kaffees hingegen ist im Vergleich zu anderen Sorten höher. Der Liberica Kaffee nimmt im Bereich der Kaffewirtschaft eine eher untergeordnete Rolle ein. Dies liegt hauptsächlich daran, dass Aroma und Ergiebigkeit im Vergleich zu anderen Kaffeesorten relativ gering sind. Für wenig Verbreitung und Anbau sorgt jedoch auch die sehr lange Reifezeit. Der Reifeprozess liegt bei dieser Kaffeesorte bei 12 bis maximal 14 Monate, was die zweit längste Reifezeit im Kaffeebereich überhaupt bedeutet (lediglich bei dem Excelsa-Kaffee ist die Reifezeit noch länger). Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung."
