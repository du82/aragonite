["https://kaffee.org/jura-impressa-xj9-professional-high-end-kaffeevollautomat-im-test"]
title = "Jura Impressa XJ9 Professional – High-End Kaffeevollautomat im Test  |  kaffee.org"
full_description = '[caption id="attachment_5079" align="aligncenter" width="300"] ©AMAZON[/caption]Auf der Suche nach einer Leistungsfähigen Kaffeemaschine für den Büroalltag, haben wir die Jura Impressa XJ9 Professional in unserem Büro aufgebaut und für euch getestet. Kann die Jura Impressa Kaffeemaschine dem täglichen Ansturm kaffeesüchtiger Kollegen und Kolleginnen standhalten? Denn wie der Name schon verrät, ist das High-End Gerät vor allem für den professionellen Einsatz konzipiert und schafft ohne Probleme bis zu 60 Tassen am Tag. Hier zeigen wir euch, wie der Jura Impressa Kaffee auf dem Jura Kaffeevollautomaten im Test abgeschnitten hat. Stärke: Eher mild oder kräftig? Auf einer Skala von 1 – 5 (leicht, mild, normal, kräftig, stark) findet hier jeder die passende Stärke. Kaffeemenge: Wie viel ml Kaffee dürfen es sein? In 5er Schritten kann man die standardmäßigen 100 ml anpassen. On/Off-Schalter: Maschine ein- bzw. ausschalten. Achtung: Vollständig wird der Automat aber auf der Rückseite ausgeschaltet. Rotary-Switch: Die Taste leuchtet z.B. rot auf, wenn ein Reinigungsprogramm ansteht. Der Druck auf die Taste setzt es dann in Gang. Der Rotary Swich fungiert zudem als Alternative zu den Pfeiltasten im Display während der Zubereitung. So kann man damit Stärke, Milch- und Kaffeemenge durch Drehen bestimmen. Milchaufschäumer mit Feinschaumtechnologie: Die Jura Impressa verwöhnt mit cremig aufgeschäumter Milch. Das funktioniert standardmäßig über einen Schlauch, den man z. B. in die Milchtüte hängt. Für die perfekte Konsistenz ist es aber empfehlenswert einen Milchkühlbehälter anzuschaffen, der die Milch auf 4 – 8 Grad kühlt. Etwas nervig, aber aus hygienischen Gründen nachvollziehbar, ist die Tatsache, dass nach jeder Milchzubereitung eine Spülung des Milchsystems angesagt ist. Eine entsprechende Aufforderung steht dann im Display, außerdem leuchtet der Rotary Switch rot. Jetzt gilt es ein Gefäß unter die Düse zu stellen und den leuchtenden Knopf zu betätigen. Am Ende des Tages wird gar eine komplette Reinigung mit speziellem Milchsystem-Reiniger empfohlen. Wir meinen: Das Durchspülen mit warmen Wasser tut es auch, sofern man es regelmäßig macht.'
