["https://kaffee.org/kaffeebohnen-einfrieren"]
title = "Kaffeebohnen einfrieren – fauler Kompromiss oder nützlicher Trick?  |  kaffee.org"
full_description = "Wahe Kaffeekenner trinken ihren Kaffee nur aus frisch gemahlenen Bohnen. Wenn nun der Lieblingskaffee im Angebot ist, würde man am liebsten grenzenlos zuschlagen und sich einen großen Vorrat sichern. Wäre da nicht die Angst, dass sich bei langer Lagerung im Küchenschrank die wertvollen Aromen verflüchtigen könnten und der köstliche Kaffee nur noch fad schmeckt. Generell ist es immer empfehlenswert, frische Kaffeebohnen möglichst bald zu verbrauchen. Es geht nichts über das volle Aroma frisch gerösteter Bohnen. Wem es jedoch nicht möglich ist, seine Bohnen immer frisch und in kleinen Portionen zu beziehen, der ist auf Lagerung angewiesen. Das Einfrieren größerer Mengen Kaffeebohnen scheint eine gute Alternative. So sollen die Aromen konserviert werden und damit dem Kaffee auch nach längerer Lagerung noch seinen vollen feinen Geschmack verleihen. Allerdings scheiden sich an diesem Thema die Geister. Wahre Verfechter von frisch gemahlenem Kaffee bezeichnen das Einfrieren von Kaffeebohnen als Untugend, weil der Geschmack nach dem Auftauen nicht mehr derselbe sein soll. Wenn man sich aus praktischen Gründen für das Einfrieren entscheidet, ist es wichtig, darauf zu achten, dass die Bohnen luftdicht verschlossen eingefroren werden und keine Feuchtigkeit eindringen kann. Auch nach Entnahme der Bohnen aus dem Gefrierfach sollten sie erst vollständig auf Zimmertemperatur aufgetaut sein, bevor man sie aus der Verpackung nimmt, da sich sonst Kondenswasser niederschlägt. Da geröstete Kaffeebohnen kaum Feuchtigkeit enthalten, die beim Einfrieren vereist, kann man sie alternativ aber auch direkt in die Kaffeemühle geben. Ein Problem bei der Aufbewahrung von großen Mengen im Gefrierfach ist die bedarfsgerechte Entnahme von Portionen. Jedes Mal sind die Bohnen beim Herausnehmen Temperaturschwankungen ausgesetzt, das schadet ihnen auf Dauer. Frieren Sie deshalb, wenn möglich, nur in Portionsgröße ein. Auch wenn der frisch geröstete Kaffee stets dem gelagerten vorzuziehen ist, erreicht man bei korrekter Lagerung eine gute Kaffeequalität, sogar über einen längeren Zeitraum hinweg. Ob mit oder ohne einzufrieren, Kaffeebohnen sollten trocken, luftdicht abgeschlossen und dunkel aufbewahrt werden. Am besten belässt man sie in der Originalverpackung, um Aromaverlust beim Umfüllen zu vermeiden. Mit der Verpackung kann man die Bohnen dann in einer Keramikdose oder einem anderen luft- und lichtundurchlässigen Gefäß lagern."
year_published = 2023
