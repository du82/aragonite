["https://kaffee.org/fair-trade"]
title = "Fair Trade  |  kaffee.org"
full_description = "uch unter Kaffeetrinkern setzt sich der Trend zum bewussten Genuss zunehmend durch. Die Deutschen als Kaffetrinker-Nation legen beim Konsum ihres Lieblingsgetränkes immer mehr Wert auf Nachhaltigkeit. Das steigende Ökobewusstsein setzt sich nicht zuletzt in der verstärkten Nachfrage fair gehandelten Kaffees fort. Doch was ist Fair Trade überhaupt? Die Begrifflichkeit des Fair Trade (fairer Handel) beschreibt ein Prinzip, das vor allem der Bekämpfung von Armut bei Kleinbauern und Arbeitern in den sogenannten Entwicklungsländern Asiens, Lateinamerikas und Afrikas dient. Durch Zugänge zum Markt nördlicher Länder sowie langfristige Handelsbeziehungen soll einer Abwärtsspirale entgegengewirkt werden, die durch den lokalen Zwischenhandel geschädigte und weitestgehend von der Preispolitik des Weltmarktes abhängige Bauern/Arbeiter häufig in eine zunehmende Verelendung treibt. Weisen Plantagen oder Bauern-Kooperativen eine Fair-Trade-Zertifizierung auf, so erhalten Mitglieder bzw. angestellte Arbeiter stabile Einkommen/Bezahlungen für gelieferte Produkte. Darüber hinaus werden Angestellten zertifizierter Plantagen verschiedene Sozialleistungen sowie bezahlter Urlaub zuteil.Das Konzept des Fair Trade legt sein Augenmerk unter anderem auf soziale, ökologische und ökonomische Aspekte des Handels. Hinter dem offiziellen Fair-Trade-Siegel und den hiermit verbundenen Standards verbirgt sich zunächst der regierungsunabhängige internationale Dachverband FLO e.V. (Fairtrade Labelling Organizations International). Dieser Verband umfasst 25 Mitglieder, zu denen unter anderem Produzenten-Netzwerke, Marketingorganisationen sowie sogenannte Siegel-Initiativen zählen. Die Aufgabe einer internationalen Zertifizierung von Händlern und Produzenten übernimmt das dem Dachverband zugehörige Unternehmen FLO-CERT. Siegel-Initiativen sind jeweils national organisiert und vermarkten das Fair-Trade-Siegel landesweit. „Fair Trade“ bezeichnet einen kontrollierten Handel, bei dem den Erzeugern ein über dem Weltmarktpreis liegender Preis gezahlt wird. Die Fairtrade-Kaffee-Standards umfassen neben festgelegten Mindestpreisen u. a. Preisaufschläge für biologisch angebaute Produkte, das Verbot von Zwangs- und Kinderarbeit, ein Diskriminierungsverbot sowie bestimmte Umweltstandards. Mindestpreise sollen für eine Absicherung bei Schwankungen des Weltmarktpreises sorgen und einer nachhaltigen Produktion dienen. Aus „fairem Handel“ stammten in Deutschland 8,8 Millionen konsumierte Tonnen Kaffee (2011; zum Vergleich 2002: 2,9 Mio. t)."
