["https://kaffee.org/melitta-caffeo-ci-test"]
title = "Melitta Caffeo CI Test  |  kaffee.org"
full_description = "Die Melitta Caffeo CI ist eine der beliebtesten Kaffeevollautomaten hierzulande. Doch was macht diese Maschine so beliebt? Kann sie halten was sie verspricht? Wir haben die Melitta Maschine für Sie in unserem Melitta Caffeo CI Test unter die Lupe genommen. Die Melitta Caffeo Maschine wirbt mit einem vielfältigen Funktionsumfang, der keine Wünsche offen lässt. Doch was genau bietet die Maschine ihrem Nutzer? Und welche Vorteile bietet sie im Vergleich zu ähnlichen Maschinen in dieser Preisklasse?Die Melitta Maschine wird oftmals auch als die “intelligente” Kaffemaschine bezeichnet. Doch was genau steckt dahinter? Vielleicht haben Sie sich auch schon gefragt, für was das “CI” im Namen der Maschine steht - es steht für “Coffee Intelligence” und beschreibt die Memory-Funktion der Maschine. Mit dieser Funktion, die “my coffee” genannt wird, kann man seinen persönlichen Lieblingskaffee speichern. Dabei sind Faktoren wie der Mahlgrad, Bohnenmenge und Wassermenge einstellbar. So können bis zu 4 Personen ihr eigenes, liebstes Kaffeerezept hinterlegen und bei Bedarf abrufen.Eine Sache ist uns besonders positiv in unserem Melitta Caffeo CI Test aufgefallen: Die Maschine hat zwei getrennte Fächer für Kaffeebohnen - eine Seltenheit in diesem Preissegment. Somit kann man zwei verschiedene Sorten an Bohnen gleichzeitig in der Maschine aufbewahren und gezielt auswählen, welche man zubereiten möchte. Des weiteren gibt es außerdem noch einen Schacht für Kaffeepulver, dieser eignet sich beispielsweise für entkoffeinierten Kaffee. Mit der Melitta Caffeo lassen sich selbstverständlich alle gängigen Kaffeesorten von Espresso bis Latte Macchiato kreieren.Der Kaffeevollautomat verfügt außerdem über einen beleuchteten, höhenverstellbaren Kaffeeauslauf und sammelt damit ebenfalls Pluspunkte in unserem Melitta Caffeo CI Test. Somit passen auch Latte Macchiato Gläser ohne Probleme unter den Auslauf. In den Wassertank können bei Bedarf und je nach Wunsch auch Wasserfilter eingesetzt werden."
