["https://kaffee.org/kuerbis-gewuerz-latte"]
title = "Kürbis-Gewürz-Latte  |  kaffee.org"
full_description = "Die Tage werden kälter und ungemütlicher, ein herbstliches Getränk kann die Stimmung wieder heben! Dazu eignet sich perfekt eine Kürbis-Gewürz-Latte. Im Prinzip ist das ein handelsüblicher Latte Macchiato, der mit selbstgemachtem Kürbis-Sirup aufgewertet wird. 250 ml Wasser, 200 g Zucker, 1 TL Zimt, 1/2 TL gemahlene Nelken, 1/2 TL gemahlene Muskat, 50 g Kürbispüree Das Wasser und den Zucker in einem kleinen Kochtopf auf mittlerer Temperatur erhitzen und so lange umrühren bis der Zucker aufgelöst ist. Im Anschluss das Kürbispüree und die Gewürze dazu geben und das Ganze ca. 5 Minuten köcheln lassen, damit der Sirup leicht zähflüssig wird. Den Sirup abkühlen lassen und durchsieben, damit keine größeren Stückchen von Gewürzen und Kürbis mehr enthalten sind. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung. Als engagierter Kaffeekenner achtet Luca auch auf Nachhaltigkeit und ethischen Konsum. Er widmet sich Themen wie fairem Handel, umweltfreundlichen Anbaumethoden und unterstützt lokale Kaffeebauern und -produzenten."
year_published = 2023
