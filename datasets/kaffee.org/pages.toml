["https://kaffee.org/kaffeezubereitung-cold-brew"]
title = "Der ultimative Cold Brew Guide  |  kaffee.org"
full_description = "Der kalte Koffein-Kick: Seit fünf Jahren ist der Cold Brew nun im Mainstream angekommen. Während der Trend anfangs noch von der konservativen Fraktion der Kaffeefans als Hype belächelt wurde, ist inzwischen längst klar: Cold Brew ist weit mehr als kalter Kaffee. Okay, objektiv betrachtet ist es genau das – Kaffee, der nicht mit heißem Wasser aufgebrüht wird, sondern für dessen Zubereitung kaltes Wasser in den Filter gegossen wird. Aber aromatisch sorgt das für einen Unterschied wie Tag und Nacht. Denn auch wenn das kalte Wasser ca. 90% des Geschmacks aus den Bohnen zieht, hat Cold Brew 70% weniger Säuren und Bitterstoffe als normaler Kaffee. Dadurch treten genau die Aromen in den Vordergrund, die qualitativ hochwertige Bohnen ausmachen. Schokoladige und nussige Geschmäcker, Fruchtige Elemente und Zitrusnoten, florale und süße Aromen – Cold Brew verleiht der Geschmacksvielfalt des Kaffees eine neue Bühne. Und auch wenn Laien einen guten Cold Brew oft gar nicht als Kaffee identifizieren, geht es bei Cold Brew genau um die Vielseitigkeit, die Kaffeeliebhaber wie uns so begeistert. Aber auch geschmackliche Schönheit hat ihren Preis. Während ein normaler Filterkaffee in nur ca. vier Minuten durch den Filter tropft, dauert die Extraktion – also der Vorgang, bei dem das Wasser den Geschmack der Bohnen annimmt – beim Cold Brew mindestens acht Stunden. Die gute Nachricht: Diese Arbeitet erledigt der Cold Brew von alleine, sobald man ihn einmal angesetzt hat. Und ist der Cold Brew erst einmal fertig, hält er sich problemlos bis zu zwei Wochen in eurem Kühlschrank frisch. Für die besten Cold Brew Rezepte haben wir uns Unterstützung aus Garmisch-Partenkirchen, dem Disneyland für alle Wintersportler, geholt. Hier kennt man sich nämlich nicht nur mit Kälte aus, sondern auch mit Kaffee. Die Wildkaffee Rösterei zählt zu den besten Röstereien Deutschlands und den absoluten Favoriten unserer Redaktion. Zusammen mit ihnen haben wir für euch den ultimativen Cold Brew Guide zusammengestellt, in dem wir euch acht Schritte zum perfekten Cold Brew präsentieren."
