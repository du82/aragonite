["https://kaffee.org/pour-over-kaffee"]
title = "Pour over Kaffee: Zubereitung, Tipps & Tricks für perfekten Geschmack  |  kaffee.org"
full_description = "Über den Geschmack von Kaffee kann man stundenlang sprechen, aber eines ist sicher: frisch aufgebrühter Pour over Kaffee ist ein besonderes Geschmackserlebnis. In diesem Artikel erfährst Du, was Pour over Kaffee ist, welcher Kaffee dafür am besten geeignet ist, wie man ihn zubereitet und wie man den Geschmack verbessern kann. Pour over Kaffee ist eine Form der manuellen Kaffeezubereitung, bei der das heiße Wasser per Hand über das gemahlene Kaffeepulver gegossen wird - letztendlich also nichts anderes, als das klassische Filtern per Hand. Dabei tropft das Wasser langsam durch den Filter in die Tasse. Durch diesen Vorgang wird ein reiner und klarer Geschmack erreicht. Grundsätzlich kann jedes Kaffeepulver für Pour over verwendet werden, aber es gibt bestimmte Sorten, die besonders gut geeignet sind. Ideal sind Kaffees mit hoher Säure, wie zum Beispiel afrikanische und kolumbianische Kaffees. Auch mittelstarke Kaffees aus Mittel- und Südamerika funktionieren gut. Die Zubereitung von Pour over Kaffee ist einfach, erfordert aber etwas Übung und Geduld. Hier sind die wichtigsten Schritte: Lasse das Wasser durch den Kaffee tropfen und gieße das Wasser dann nach und nach in kreisenden Bewegungen über das Kaffeepulver. Nimm Dir Zeit, um das Wasser über das Kaffeepulver zu gießen und achte darauf, dass das Wasser gleichmäßig in die Tasse fließt. Bei der Zubereitung von Pour over Kaffee ist eine Kaffeemühle ein unverzichtbares Zubehör. Es ist wichtig, dass das Kaffeepulver eine bestimmte Mahlstärke hat, um ein optimales Geschmackserlebnis zu gewährleisten. Eine Handmühle oder eine elektrische Mühle mit konischem Mahlwerk eignet sich am besten für Pour over Kaffee. Ja, für Pour over Kaffee benötigt man spezielle Papier- oder Metallfilter. Diese filtern die feinen Partikel aus dem Kaffee heraus und verhindern, dass sie in die Tasse gelangen. Papierfilter sind die am häufigsten verwendeten Filter bei Pour over Kaffee, aber Metallfilter sind umweltfreundlicher und können wiederverwendet werden."
