["https://kaffee.org/cappuccino"]
title = "Cappuccino: In drei Schritten zum perfekten Cappuccino  |  kaffee.org"
full_description = "Ob zur Herbstsonne auf der Terrasse oder zum Frühstück im Bett: Der Cappuccino ist so beliebt wie kaum ein anderes Kaffeegetränk - zu Recht, wie wir finden. Die gute Nachricht: Für einen guten Cappuccino braucht man keine Barista-Ausbildung, nur ein bisschen Übung. Wir zeigen euch, wie ihr den perfekten Cappuccino zuhause hinbekommt. 100 - 150 Milliliter Milch aufschäumen: Profis arbeiten hier mit der Dampfdüse der Siebträgermaschine, ein elektrischer oder manueller Milchaufschäumer tun es aber auch Die wohl einfachste Art, schnell an einen Cappuccino zu kommen, ist die Zubereitung im Kaffeevollautomaten – ein Knopfdruck und das Getränk ist in der Tasse. Leider muss man zugeben, dass der „fertige“ Cappuccino geschmacklich oft zu wünschen übrig lässt. Wer seinen Cappuccino dennoch aus dem Vollautomaten genießen will, dem empfehlen wir die „getrennte Zubereitung“ – also Espresso und Milchschaum getrennt aus der Maschine zu lassen. Die Anleitung zur Zubereitung verrät es schon: Für einen Cappuccino braucht ihr nur 100 - 150 Milliliter Milch und einen guten Espresso. Am einfachsten lässt sich Vollmilch aufschäumen, fettarme Milch bis 1,5% funktioniert aber auch. Als Faustregel gilt: Je höher der Eiweißgehalt, desto stabiler wird der Milchschaum. Klar! Sojamilch und Hafermilch funktionieren zum Beispiel sehr gut. Mit Kokos- und Mandelmilch wird es schon schwieriger, die beiden lassen sich nicht ganz so gut aufschäumen. Über die perfekten Espressobohnen scheiden sich bis heute die Geister. Wir sagen: Erlaubt ist, was schmeckt. Nimm am besten deine Lieblings-Espressobohnen. Wir empfehlen eine Robusta-Mischung - die macht den Espresso kräftiger und den Cappuccino insgesamt intensiver. Wird der heiße Espresso in eine kalte Tasse gegossen, wird er bitter - der Cappuccino schmeckt dann nicht mehr. Zum Vorwärmen könnt ihr die Tassen einfach unter warmes Wasser halten und anschließend gut abtrocknen. Wer ohnehin empfindlich auf Koffein reagiert, könnte auch mit einem Cappuccino Probleme haben: Eine Tasse Cappuccino hat etwa 25 - 30 mg Koffein. Zum Vergleich: Eine Tasse Filterkaffee hat ca. 40mg."
year_published = 2023
