["https://kaffee.org/bulletproof-coffee"]
title = "Bulletproof Coffee  |  kaffee.org"
full_description = "„Bulletproof Coffee“ – wenn man diesen abgefahrenen Namen zum ersten Mal hört, fragt man sich unweigerlich, was es mit diesem speziellen Kaffee wohl auf sich hat. Hat der „kugelsichere Kaffee“ vielleicht irgendwas mit der Mafia zu tun oder womöglich eine besonders feste Konsistenz? Damit auch ihr nicht länger im Dunkeln tappt, erklären wir euch heute, was Bulletproof Coffee genau ist und wagen sogar den mutigen Selbstversuch. Ja, ihr habt richtig gelesen! Bei Bulletproof Coffee handelt es sich nicht um eine abgefahrene Erfindung aus einem Action-Thriller, sondern schlicht um ein ungewöhnliches Kaffeerezept des Amerikaners Dave Asprey. Er hat mit dem neuen Energie-Getränk einen regelrechten Hype ausgelöst und selbst angeblich 45 kg durch den täglichen Genuss des etwas anderen Frühstücks abgenommen – und das ohne lästiges Kalorienzählen! Der Trick dabei liegt in der unkonventionellen Zusammensetzung: Man nehme einfach ordentlich Butter, MCT-Öl sowie normalen Filterkaffee. Bei MCT-Öl handelt es sich um ein aus Kokosöl gewonnenes Fett, dass vom Körper nicht gespeichert, aber sofort in Energie umgewandelt werden kann.Auf die Idee zum Bulletproof Coffee kam Asprey durch eine Bergtour in Tibet: Dort gab ihm der tibetanische Tee mit Butter einen unglaublichen Energieschub für seine Wanderung. Begeistert von der Wirkung des Getränks brachte er das Rezept mit nach Hause und optimierte es nach und nach, indem er Kaffee statt Tee verwendete und darüber hinaus noch MCT-Öl hinzufügte. Er macht dich „bulletproof“ – so verspricht es der Rezeptentwickler Dave Asprey. Frühstückt man statt Brot, Haferflocken und Co den Powerdrink, so tankt man morgens nicht nur viel Energie, sondern boostet auch noch seine Leistungsfähigkeit und kurbelt die Fettverbrennung an. Grund dafür sind laut Asprey die hochwertigen Bestandteile des Rezepts: Butter aus reiner Weidemilch, MCT-Öl aus mittelkettigen Triglyceriden sowie möglichst pestizid- und pilzsporenfreier Kaffee. Die Weidemilch-Butter liefert dem Körper unter anderem wertvolle Omega-3-Fettsäuren, Beta-Carotin, Vitamine A, K, D und E sowie Buttersäure, die Entzündungen entgegenwirkt. Das MCT-Öl wiederum hat einen positiven Effekt auf die Fettverbrennung."
