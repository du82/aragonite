["https://kaffee.org/kaffeeroestung"]
title = "Kaffeeröstung  |  kaffee.org"
full_description = "Rohe Kaffeebohnen sind für Menschen nicht genießbar. Daher müssen die Bohnen geröstet werden, um sie für die Zubereitung von Kaffee nutzen zu können. Durch den Röstvorgang werden die Kaffeebohnen trocken erhitzt, während sie einem atmosphärischen Druck ausgesetzt sind. Fachleute unterscheiden mehrere Röstgrade und setzen verschiedene Geräte zur Kaffeeröstung ein. Kaffeeliebhaber können rohe Kaffeebohnen auch selbst rösten, um ihren eigenen Kaffee herzustellen. Die bekanntesten Kaffeesorten der Welt sind Arabica und Robusta. Wild wachsender Arabica-Kaffee kommt vor allem in Äthiopien vor, wo die Kaffeepflanze schon im 9. Jahrhundert erstmals in Schriften erwähnt wird. Über die erste Röstung von Kaffeebohnen sind nur Legenden überliefert, die zum Beispiel besagen, dass Hirten die Früchte eines Kaffeestrauchs gekaut und wegen des bitteren Geschmacks ins Feuer gespuckt haben. Dadurch soll sich das Aroma der Bohnen verbreitet haben und die Menschen begannen, die Kaffeebohnen in großen Eisenpfannen über dem Feuer zu rösten. Danach wurden die Bohnen in einem Mörser zerkleinert oder grob gemahlen. Das so gewonnene Kaffeepulver wurde zusammen mit Wasser und Zucker in einem bauchigen Gefäß aufgekocht und aus kleinen Schalen getrunken. Aus den ersten Versuchen, Kaffee zu rösten, hat sich eine eigene Industrie entwickelt, die immer bessere und verfeinerte Methoden zur Kaffeeröstung entwickelt hat. Bei den heutigen Röstverfahren werden die Kaffeebohnen langsam, trocken und fettfrei unter atmosphärischem Druck erhitzt. Dabei verdampft das Wasser, das in den Bohnen enthalten ist. Durch die Wasserverdampfung und die Röstgase entsteht in den Kaffeebohnen ein Überdruck, der sie auf das Doppelte ihres Volumens aufquellen lässt. Dabei bekommen die Zellwände der Bohnen Risse, die an einem knisternden Geräusch zu erkennen sind. Dieses Geräusch wird in Fachkreisen „first crack“ genannt. Gleichzeitig laufen chemische Prozesse ab, die als Maillard-Reaktionen bekannt sind. Zucker, freie Aminosäuren und andere Kohlenhydrate werden abgebaut oder finden sich zu neuen Verbindungen zusammen. So entstehen die typischen Röstaromen und Bitterstoffe, die den späteren Kaffeegeschmack bestimmen. Je nach Verwendungszweck des Kaffees endet mit dem ersten Knistern der Kaffeebohnen bereits der Röstprozess oder er wird bis zum zweiten Knacken oder auch darüber hinaus weitergeführt. Von der Länge der Röstung hängt die Farbe der gerösteten Kaffeebohnen ab. Die Bohnen verändern ständig ihre Farbe. Die Kaffeebohne erscheint zunächst hellgrün, bevor sich ihre Farbe über gelb und gelbbraun in hellbraun nach dem ersten Knistern und schließlich in dunkelbraun nach dem zweiten Knistern verändert. Je länger die Bohnen geröstet werden, umso mehr Bitterstoffe entstehen, die für das Aroma des aufgebrühten Kaffees ausschlaggebend sind. Nach dem Rösten müssen die Bohnen schnell abgekühlt werden, da sie nachgaren. Um den späteren Geschmack nicht zu beeinflussen, empfiehlt sich eine Luftkühlung. In der industriellen Kaffeeröstung wird jedoch auch Wasser zur Kühlung eingesetzt, das jedoch den Geschmack des Kaffees verändert."
year_published = 2023
