["https://kaffee.org/latte-art"]
title = "Latte Art  |  kaffee.org"
full_description = "Dass die Zubereitung von Kaffee, Cappuccino, Espresso oder Latte Macchiato eine Kunst sein kann, ist inzwischen hinlänglich bekannt. Die Arbeit eines Barista besteht jedoch nicht allein darin, eine ausgewogene Mischung des Kaffees zu erreichen und diese zu verarbeiten, sondern vor allem auch in der optischen Gestaltung der verschiedenen Kaffeespezialitäten. Denn ein Cappuccino soll schließlich nicht nur Geschmacks- und Geruchssinn ansprechen. Aufwendige Verzierungen der Milchschaumschicht stellen eine Kunst für sich dar – die sogenannte „Latte Art“. Mithilfe der „Strömung“ durch das richtige Ausgießen der Milch und des Milchschaums entstehen Muster und Bilder auf der Oberfläche des Getränks. Auch spezielle Stifte, Schokoladensirup oder Schablonen dienen manchmal als Hilfsmittel zur Gestaltung. Der Kreativität sind dabei keine Grenzen gesetzt: Vom „einfachen“ Herz über Kleeblätter, Sterne oder Engel – nahezu alles kann von den Baristas auf dem Schaum dargestellt werden. Internationale Wettbewerbe fordern die Kaffeekünstler heraus, immer komplexere Bilder herzustellen. Um die Gebilde aus Milch, Milchschaum und Espresso herzustellen allerdings, braucht man das geeignete Zubehör – und viel Übung. Denn so einfach es aussehen mag, selbst die vermeintlich simplen Figuren, wie etwa das Herz, stellen eine Herausforderung dar. Das Equipment eines Milchschaumkünstlers besteht aus einer Espressomaschine oder -kanne, einem Milchaufschäumer und nicht zuletzt einer Milchkanne und Cappuccinotassen. Letztere sollten einen nicht zu kleinen Durchmesser aufweisen, damit die Muster eine größere Fläche haben können. Auch die Milchkanne sollte groß genug sein. Zwischen 0,6 und 1 Liter Volumen liegt die ideale Größe. Je größer die Kanne, desto leichter gelingt der Schaum. Die Basis für die Zubereitung bildet der Espresso, der im besten Fall eine dichte Crema aufweist. Diese sorgt dafür, dass der Espresso länger heiß bleibt und ist gleichzeitig ein wichtiger Geschmacksträger."
year_published = 2023
