["https://kaffee.org/beanarella"]
title = "Beanarella - Kaffeekapseln in fair & Bio!  |  kaffee.org"
full_description = "„Quick and dirty“ – so kann man den Einsatz von Kaffeekapseln beschreiben. Am „quick“ ist ja auch prinzipiell nichts auszusetzen – schließlich ist die schnelle und unkomplizierte Zubereitung Sinn und Zweck eines Portionskaffees. Das „dirty“ in Form von Unmengen an Müll hingegen ist dabei eine sehr negative Begleiterscheinung – nicht nur aus Sicht vieler Konsumenten. Die Verantwortlichen der Swiss Coffee Company machten sich dieses Problem zur Aufgabe und ließen den kritischen Worten Taten folgen. Die Gewinner des Schweizer „Golden Idea Awards 2013“ lancierten in Rekordzeit ein konkurrenzfähiges Produkt auf dem Markt, das nicht nur Bio-Verfechtern gefällt, sondern auch das Gros der Kaffeekapsel-Liebhaber überzeugen dürfte. Kaffeekapseln bestehen im Normalfall aus Materialien wie Aluminium oder Kunststoff. Zwar sind jene in den meisten Fällen recyclebar, aber das gilt nicht für von Kaffeemehl „verunreinigte“ Kapseln. Die eigentliche Innovation der Swiss Coffee Company ist folglich die voll kompostierbare, weil zu 100% biologisch abbaubare Kaffeekapsel. Dass das nicht nur leere Versprechungen sind, bestätigt das auf der Verpackung prangernde Keimling-Siegel der EU. Dieses gibt vor, dass das so ausgezeichnete Produkt binnen 3 Monaten vollständig zersetzt sein muss. In einem ersten Test auf einer Schweizer Kompostieranlage, schafften das die Kapseln sogar in 4 Wochen. Es blieben nur noch Kalziumcarbonatrückstände zurück, die einen wichtigen Bestandteil der nährstoffreichen Humus-Erde bilden. Zu Ende gedacht: auch die Aromaschutzverpackung, in der sich die einzelnen Kapseln befinden, soll biologisch abbaubar sein. Dass in so eine astreine Öko-Kapsel keine industriell gerösteten und zweifelhaft angebauten Kaffeebohnen schon alleine vom Grundgedanken her nicht passen wollen, dürfte wohl logisch sein. So bezieht die Swiss Coffee Company ihren Kaffee selbstverständlich nur von Fair Trade Händlern, die garantieren, dass der Kaffee nachhaltig und verantwortungsvoll angebaut und geerntet wird. Auch eine Industrieröstung kommt für die „Gourmet Kaffeekapsel“ nicht in Frage. Das Gute: der Kaffee wird stattdessen auch nicht in einem Hinterhof geröstet, sondern in der ältesten Rösterei der Schweiz – der Turm Handels AG in St. Gallen."
year_published = 2023
