["https://kaffee.org/aldi-expressi-discounter-kapsel-kaffeemaschine"]
title = "Aldi Expressi -  Aldi-Kaffeemaschine im Test  |  kaffee.org"
full_description = 'Kapsel-Kaffeemaschinen sind ein beliebtes Weihnachtsgeschenk. Mit der Aldi Expressi ist Aldi Süd seit 2013 ebenfalls in diesem Wachstumssegment vertreten. Wie vom Discounter gewohnt, lockt die Aldi Expressi vor allem beim Thema Preis. Das gilt übrigens auch für die entsprechenden Kapseln. Aber kann der Nespresso-Konkurrent mehr als bloß günstig sein? In unserem Test widmen wir uns vor allem der Expressi Wave. Aldi Süd hat jedoch noch zwei weitere Kapsel-Kaffeemaschinen im Angebot, die wir kurz vorstellen. Die Aldi Kaffeemaschine selbst ist bereits für knapp 70 Euro zu erwerben. Aber Kapselkaffee-Kenner wissen: Der Anschaffungspreis der Maschine ist das geringste finanzielle Problem, denn dieser ist einmalig. Viel wichtiger sind deshalb die Folgekosten. Kapseln kosten zum Beispiel bedeutend mehr Geld als die gleiche Menge gemahlene oder ganze Bohnen. Und hier liegt tatsächlich die eigentliche Stärke des Aldi Expressi Systems: Mit ca. 20 Cent pro Aldi Kaffeekapsel sind die kleinen Alubehälter rund um die Hälfte billiger als die vom Klassenprimus Nespresso. Ein starkes Argument! Zu haben sind die Expressi Kapseln grundsätzlich in 16er-Verpackungen. Die Aldi Kapselmaschine wurde in der Schweiz entwickelt und designt. Insgesamt beweist die Aldi Expressi, dass günstig auch optisch schön sein kann. Das Erscheinungsbild gefällt mit seiner klaren Formensprache, die Retro-Elemente gekonnt mit modernem Design verbindet. Am Markantesten ist dabei das Wellenprofil an der Seite der Expressi Wave. Die Maschine gibt es wahlweise in Schwarz oder Silber. Uns gefällt "Silber" am besten - aber das liegt natürlich im Auge des Betrachters. Sobald man den 1-Liter-Wassertank mit der entsprechenden Menge Wasser gefüllt und den Power-Button gedrückt hat, gibt es eigentlich nicht sehr viel mehr zu tun als eine Tasse unter den Ausguss zu stellen und eine Kapsel einzulegen. So kennen und lieben wir Portionskaffeemaschinen: Schnell und einfach! Drei weitere Knöpfe entscheiden nun über Menge und Zusammensetzung des eigentlichen Kaffees. Wobei hier natürlich wenig Handlungsspielraum besteht, es läuft nämlich auf folgendes hinaus: Jeweils einen Knopf für große Tasse bzw. kleine Tasse und ein weiterer Knopf für die Zubereitung der Milchkapsel. Diese wird zum Beispiel für die Zubereitung von Cappuccino und Latte Macchiato gebraucht.'
