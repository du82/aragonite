["https://kaffee.org/chemex-kaffee-karaffe"]
title = "Chemex Karaffe ᐅ Chemex Kaffee zubereiten"
description = "Chemex Karaffe ✓ Chemex Kaffee zubereiten ✓ Kaffeezubereitung ✓ Kaffeekaraff ✓ Kaffeespazialitäten"
full_description = "Kaffee ist schwarz, mit Milch sowie mit oder ohne Zucker genießbar. Je nachdem, wie es dem Kaffeetrinker beliebt. Doch die Art der Zubereitung entscheidet maßgeblich über den letztendlichen Geschmack des Kaffees. Der deutsche Chemiker und leidenschaftliche Kaffeetrinker Dr. Peter J. Schlumbohm entwickelte diese stilvolle Kaffee-Karaffe, indem er seine Kenntnisse des Filtrierens vom Chemielabor auf die Extraktion des Kaffees übertrug. Das Endergebnis ist die Perfektion der Filterkaffee-Technik. Aufgrund des einzigartigen Designs in Form der Sanduhr ist die Chemex Kaffee-Karaffe im MoMa (Museum of Modern Art) in New York ausgestellt und wurde schon vielfach prämiert. Auch in den Top 100 der Designprodukte der Moderne ist die Chemex Karaffe vertreten. Die Chemex Kaffee-Kaffeekanne ist ein Dekantiergefäß und ein Zubereiter für Filterkaffee in einem. Die speziellen Filter und die elegante Form der Chemex sind die zwei verantwortlichen Komponenten für herausragenden Kaffeegenuss. Der Chemex-Filter läuft spitz zu und erzeugt somit eine größere Öffnung, die den Kaffee in den Kannenbauch tropfen lässt. Aufgrund der konischen Form erfolgt die Extraktion des Kaffees gleichmäßiger und die Kaffeearomen werden intensiver gelöst. Somit ergibt sich ein ausbalanciertes Geschmackserlebnis eines klaren und süßlichen Aromas. Die für die Chemex Kaffee-Karaffe speziell angefertigten Filter unterscheiden sich von herkömmlichen Kaffeefiltern. Sie sind feinporiger und halten somit mehr Kaffee-Öle und Kaffee-Sedimente im Filter zurück. Gegen das Licht gehalten schimmert der fertig gebrühte Kaffee in der Chemex Kaffee-Kaffeekanne leicht rötlich. Die Verwendung der Original-Filter für die Karaffe wird empfohlen, da diese passgenau sind und die optimalsten Ergebnisse liefern. Sofort nach Beendigung des Filtriervorgangs wird der Papierfilter entnommen und der Kaffee ist servierfertig. Der wärmeisolierte Griff ermöglicht ein bequemes Handling, ohne Gefahr zu laufen, dass er heiß wird. Elegant läuft der Kaffee aus der Chemex über die Ausgussrinne in die Kaffeetasse ein. Das dickwandige Glas ist hitzebeständig und übersteht sogar kleine Erschütterungen problemlos. Durch das entfernen der Holzmanschette und der Lederschnur kann die Chemex Kaffee-Karaffe auch in der Spülmaschine gereinigt werden."
