["https://kaffee.org/schuemli-kaffee"]
title = "Schümli Kaffee: Der Schweizer Kaffee  |  kaffee.org"
full_description = "Jeder Schweiz-Besucher hat ihn sicher schon einmal getrunken: den Café Crème. Was bei uns der klassische Filterkaffee, ist bei den Eidgenossen der Kaffee aus dem Kaffeevollautomaten. Dabei handelt es sich um das modernste und technisch komplexeste Kaffeegetränk – sowohl in der Röstung, als auch in der Zubereitung. Als Café Crème wird in der Schweiz zunächst einmal der Kaffee bezeichnet, der unter Druck mit einer Kolbenkaffeemaschine zubereitet wird. Traditionell wird diese aus der Schweiz stammende Kaffeespezialität so bezeichnet wegen der Zugabe von Kaffeesahne (frz. crème). In Deutschland kennt man den Café Crème unter dem Namen Schümli Kaffee – das “Schümli” steht dabei für die oberflächliche Crema, das “Kaffeeschäumchen”. Zutreffender wäre die Bezeichnung Kolbenkaffee, da es sich um eine Mischung handelt, die speziell für die Zubereitung in einer Kolbenmaschine kreiert wurde. Der Siegeszug des Schweizer Kolbenkaffees begann in den 1980er Jahren, als neben den Kaffeevollautomaten für den gewerblichen Einsatz, in der Schweiz auch solche für die Nutzung in Privathaushalten entstanden. Da der Kaffee unter Druck zubereitet wird (ca. 2 bis 3 bar), benötigt der Café Crème eine eigene Röstung und Rezeptur. Der Schweizer Schümli Kaffee hat einen kräftigeren Geschmack als der bekannte deutsche Filterkaffee, wird individuell frisch zubereitet und ist besonders säurearm und magenfreundlich. Auch werden, im Gegensatz zum Filterkaffee, ausschliesslich höherwertige Kaffees als Grundlage für den Schümli Kaffee verwendet. Das besondere Geschmacksprofil verdankt der Café Crème neben der Kolbentechnologie im Kaffeevollautomaten der bereits erwähnten besonderen Röstung. Die Röstung vereint mindestens drei verschiedene Rösttiefen (hell, mittel und dunkel), um dem Schümli Kaffee sowohl fruchtige Töne, als auch eine ausgeprägte Süsse und einen vollmundigen Körper zu verleihen. Diese Komposition erzeugt ein grossartiges Geschmackserlebnis in der Tasse und ein besonderes Aromaprofil. Dass es bei diesem Geschmackserlebnis bleibt, garantieren die Schweizer Kaffeeröstereien durch Ihr traditionell besonders ausgeprägtes Bewusstsein für Qualität – ein Bewusstsein, welches mit jeder Tasse Schweizer Schümli Kaffee dokumentiert wird."
year_published = 2023
