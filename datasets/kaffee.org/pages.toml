["https://kaffee.org/kaffeesatz"]
title = "Kaffeesatz weiterverwenden – 8 Dinge, die ihr mit eurem Kaffeesatz machen könnt!  |  kaffee.org"
full_description = "Der Kaffeesatz – ein schwarzer, klebriger Rest, der am Ende des Kaffeemachens im Filter übrig bleibt. Sieht unappetitlich aus und fühlt sich auch so an. Wegschmeißen ist da der erste Instinkt. Doch halt! Der vermeintliche Abfall aus gemahlenen Kaffeebohnen ist ein wahres Wundermittel! Im Folgenden zeigen wir euch all die Verwendungsmöglichkeiten, für die der Kaffeesatz noch herhalten kann. Glaubt uns, wenn wir sagen, dass ihr einiges davon noch nicht wusstet. Schon die Menschen des 19. Jahrhunderts benutzten ihren Kaffeesatz zum Reinigen ihrer Fußböden oder dem Waschen von Geschirr. Auch das Vertreiben übler Gerüche war für sie damals kein Geheimnis. All das ist den meisten von uns leider nicht mehr bekannt. Grund genug, all das Wissen (und noch mehr) aus der Versenkung zu holen! Die Verwendungsmöglichkeiten sind vielfältig, Kaffeesatz muss also selten im Biomüll entsorgt werden. Ob ihr nun ein Peeling daraus macht oder ihn als Dünger oder Farbstoff benutzt, bleibt euch überlassen – wir zeigen dir hier, was man mit Kaffeesatz alles machen kann. Bevor ihr euren Kaffeesatz weiterverwenden könnt, solltet ihr in abkühlen und austrocknen lassen. Wenn er nämlich noch feucht ist, schimmelt der Kaffeesatz recht schnell und sorgt für mehr Schaden als Nutzen. Füllt einfach ein flaches Gefäß mit den Kaffeeresten und stellt das offen zum trocknen dorthin, wo es nicht stört. Ist der Kaffeesatz getrocknet, kann er verwendet werden. Vielleicht noch ein kleiner Tipp: Ihr könnt den Kaffeesatz auch mit Wasser verdünnen und damit eure Pflanzen gießen. In der Regel besteht keine Gefahr der Überdosierung, da der Anteil von Koffein, Phosphor, Stickstoff und Kalium relativ niedrig ist. Kaffeeliebhaber, die viel Kaffee trinken und ihr Lieblingsgetränk bevorzugt frisch aufgebrüht genießen, werden sich vielleicht schon einmal gefragt haben: Wohin mit dem ganzen Kaffeesatz? Der Rest des Kaffeepulvers, der nach dem Aufbrühen des Pulvers zurückbleibt, wandert meist in den Müll. Wer sich glücklich schätzt und einen Garten sein eigen nennt, entsorgt das Pulver vielleicht auch auf dem hauseigenen Komposthaufen und kennt den positiven Effekt von Kaffeesatz: Er zieht jede Menge Regenwürmer an. Diese lockern das Erdreich und sind als Gartennützlinge erwünscht und beliebt. Auf diese Weise nutzt der Kaffeesatz dem Garten indirekt, da auf dem Kompost frischer Humusboden entsteht."
