["https://kaffee.org/french-press"]
title = "French Press: Kaffee zum selber machen  |  kaffee.org"
full_description = "Die French Press, auch als Kaffeepresse, Kaffeedrücker, Pressstempelkanne, Press Pot, Coffee Plunger, Chambordkanne oder Cafetière bezeichnet, ist eine Vorrichtung zum Brühen von Kaffee. French Presses gibt es in unterschiedlichen Variationen. Die Kaffeepressen unterscheiden sich nicht nur in den Volumina, die zwischen 350 ml und 1500 ml liegen, sondern auch im Design und in der Wärmedämmung. Vermutlich wurde die French Press gegen 1850 in Frankreich erfunden. Zuerst patentiert hat sie der italienische Designer Attilio Calimani im Jahr 1929. Dieser nahm wie auch sein Landsmann Faliero Bondanini im Laufe der Zeit zahlreiche Verbesserungen an diesem praktischen Brühsystem vor. Das dänische Unternehmen Bodum entwickelte 1974 die erste eigene Kaffeepresse dieser Art mit dem Namen Bistro. Von internationalen Medien zum umweltverträglichsten Kaffeebereiter gekürt, wurde diese mit dem dänischen Designpreis ausgezeichnet. Das Hauptelement dieser Kaffeepresse ist der Stempel mit dem daran befestigten metallenen Filter. Da dieses Sieb relativ grob ist, kommt bei dieser Zubereitungsart weniger fein gemahlenes, fast geschrotetes Kaffeepulver zum Einsatz. Das Pulver verbleibt über längere Zeit in direktem Kontakt zum Kaffeewasser. Demzufolge gehört das Brühverfahren zu den Immersionsmethoden. Der Filtereffekt beruht nicht allein auf dem Filtersieb, sondern auch auf den gröberen Partikeln, die sich während des Drückens in einem Schwebezustand befinden, sich am Sieb anlagern und dieses auf diese Weise feiner machen. Im Gegensatz zu anderen Methoden werden weniger kleinere Pulverpartikel im fertigen Kaffee zurück. Dadurch ist dieser aromatischer und vollmundiger als mit der herkömmlichen Papierfiltermethode hergestellter. Zunächst wird die Kanne mit möglichst frischem, grob gemahlenem Kaffee befüllt. Bei der Dosierung mit einem Kaffeemaß werden ca. zwei Löffel Kaffeepulver pro Tasse (150 ml) gerechnet. Das entspricht ca. acht Gramm. Anschließend kommt heißes, nicht mehr kochendes (ca. 92 bis 94 °C) Wasser hinzu. Die French Press sollte etwa halb voll sein. Nun wird sie etwas geschwenkt, um das Pulver mit der Flüssigkeit zu vermischen. Ist dies geschehen, wird die Kanne bis zum oberen Rand aufgefüllt. Der Stempel wird vorsichtig eingesetzt und leicht angedrückt. Die Ziehzeit (ca. drei bis sechs Minuten) sowie die Menge des Kaffeepulvers bestimmen die Stärke des Kaffees. Ist die Ziehzeit vorüber, wird der Stempel langsam nach unten auf den Boden der Kaffeekanne gepresst. Damit trennt sich der Kaffeesatz vom darüber stehenden Aufguss. Dieser sollte für bestmögliches Kaffeearoma möglichst bald in die Tasse gegossen und getrunken werden."
year_published = 2023
