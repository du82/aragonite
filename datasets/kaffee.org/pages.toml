["https://kaffee.org/muntermacher-kaffee"]
title = "Warum Kaffee müde machen kann!  |  kaffee.org"
full_description = "Ergebnisse einer neuen Studie von Forschern aus Bristol, London, Würzburg und Münster stellen die vielgepriesene Wirkung von Koffein infrage. Der Untersuchung zufolge liefert Kaffee (oder Tee) seinen Konsumenten weder einen Energieschub noch einen Koffeinkick. Streng genommen verhindert Kaffeekonsum bei regelmäßigen Kaffeetrinkern nur die Müdigkeit und Antriebslosigkeit, die durch einen Koffeinentzug entstehen würde.Die Studie (siehe hier) wurde mit 379 Teilnehmern durchgeführt, darunter sowohl Nicht-Kaffeetrinker als auch regelmäßige Kaffeekonsumenten. Nach einer 16-stündigen Koffeinabstinenz wurden den Teilnehmern entweder Koffeintabletten oder Placebotabletten verabreicht. Anschließend wurde die selbsteingeschätzte Aufmerksamkeit und Leistungsfähigkeit der Probanden ermittelt. Die regelmäßigen Kaffeetrinker, die ein Placebo eingenommen hatten, klagten zum Teil über Kopfscherzen und fühlten sich müde. Personen, die selten oder nie Kaffee trinken, hatten hingegen keine Probleme nach der Einnahme eines Placebos. Kaffeetrinker, die eine Dosis Koffein erhalten hatten, fühlten sich anschließend normal, ihre Werte waren unauffällig. Insgesamt lag keine der Versuchsgruppen mit ihren Leistungswerten über denen der Nicht-Kaffeetrinker mit Placebo. Dementsprechend lässt sich schlussfolgern, dass durch Koffeinkonsum keine Vorteile für Aktivität oder Leistungsfähigkeit entstehen.Wer ohne Kaffee nicht in den Tag starten kann, ist demnach einem Irrtum über die Wirkung von Koffein aufgesessen. Grundsätzlich kann Koffein zwar wach machen, da es an Rezeptoren für körpereigene Müdigkeits-Moleküle namens Adenosin andockt und diese blockiert. Gerade bei regelmäßigen Kaffeetrinkern wirkt Kaffee aber nicht mehr wirklich anregend, im Gegenteil: Ein Körper, der an einen regelmäßigen Koffeinkonsum gewöhnt ist, reagiert bei Entzug mit Ermüdungserscheinungen, Kopfschmerzen oder einem Gefühl verminderter Leistungsfähigkeit. Das Koffein wirkt also nur ausgleichend gegen die Symptome, die durch eine „Koffeinabhängigkeit“ oder -gewöhnung entstehen. Die Wirkung von Koffein ist bei Personen, die regelmäßig oder viel Kaffee genießen, eine umgekehrte, die Anregung, die Kaffeetrinker empfinden, eine gefühlte. Die Wissenschaftler haben damit die Illusion vom Kaffee als Wachmacher eingeschränkt. Der Beliebtheit des Getränks wird das jedoch wohl kaum einen Abbruch tun..."
year_published = 2023
