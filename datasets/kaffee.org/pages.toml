["https://kaffee.org/kaffeekapseln"]
title = "Kaffeekapseln für Kaffee & Espresso  |  kaffee.org"
full_description = "Kaffeekapseln sind Bestandteil eines Espresso-Kaffeesystems. Die einzeln portionierten Kapseln bestehen aus kleinen Aluminiumschalen, die entweder mit reinem Espresso oder speziellen Sorten mit unterschiedlichen Geschmacksrichtungen gefüllt sind. Tassimo-SystemTassimo ist eine Kapselmaschine der amerikanischen Firma Mondolez, die aus dem Kraft-Unternehmen hervorgegangen ist. Mondolez gilt derzeit als zweitgrößter Hersteller von Kaffeekapseln. Das System bereitet neben den Kaffeekapseln auch andere Heißgetränke zu. Cafissimo-SystemDie Marke gehört zum Unternehmen Tchibo und arbeitet mit einem italienischen Zubereitungssystem. Neben Kaffeekapseln werden auch Mischgetränke verarbeitet. Dolce Gusto-SystemDolce Gusto gehört ebenso wie Nespresso zum Nestlé-Konzern. Die Kapseln werden hierbei nicht aus Aluminium, sondern aus Kunststoff gefertigt. Neben den klassischen Espresso-Röstungen gibt es eine Vielzahl an Milchkaffeekapseln unterschiedlicher Geschmacksrichtungen. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung. Als engagierter Kaffeekenner achtet Luca auch auf Nachhaltigkeit und ethischen Konsum. Er widmet sich Themen wie fairem Handel, umweltfreundlichen Anbaumethoden und unterstützt lokale Kaffeebauern und -produzenten."
