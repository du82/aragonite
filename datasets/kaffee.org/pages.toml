["https://kaffee.org/espresso-italien-das-sollten-sie-als-tourist-beachten"]
title = "Espresso in Italien: Das sollten Sie als Tourist beachten!  |  kaffee.org"
full_description = "Italien ist das Mekka für jeden Kaffeeliebhaber. Traditionelle Barista zelebrieren die Kaffeezubereitung und das schmeckt und sieht man. Auch das Ambiente stimmt: Sonne, rustikale Möbel, geselliges Geplauder. Dass dieses Kaffee-Vergnügen nicht ganz billig ist, dürfte sich mittlerweile herumgesprochen haben. Aber ist das wirklich so? Und wann ist überhaupt der in Deutschland so beliebte Cappuccino angebracht und wann nicht? Ein kleiner „Caffè“-Knigge. In Italien ist der Caffé traditionell ein Espresso. Filterkaffee gibt es zwar, aber das sollten Sie bei der Bestellung ausdrücklich erwähnen. Es gibt sogar Lokalitäten, in denen ein sogenannter Caffè tedesco gar nicht erst serviert wird. In Hotels und touristennahen Cafés wird er im Prinzip überhaupt nur für die Touristen angeboten. Wenn man böse wäre, könnte man das als Touristenfalle bezeichnen. Man könnte aber auch sagen, dass die meisten Urlauber einfach nur schlecht informiert sind. Denn: für den schnellen Espressogenuss an der Theke – stehend versteht sich – gelten gesetzlich festgelegte Höchstpreise. Die sogenannten „al banco“-Preise sind für alle Bars, egal ob groß oder klein, namhaft- oder alternativ, in Mailand oder in einem kleinen Provinzdörfchen gelegen, verbindlich. Die genauen Preise sind jedoch von der Region abhängig, wobei sie maximal 1 Euro betragen. Ganz anders die Preise am Tisch. Hier darf der Wirt selbst entscheiden, welchen „Servicezuschlag“ er verlangt. In Venedig beispielsweise gut und gerne auch mal 6 Euro aufwärts. Das kann es aber natürlich immer noch wert sein. Meistens ist es noch so, dass sich die ausgeschriebenen Preise auf den Verzehr an der Theke beziehen. Ein Blick in die Tischspeisekarte sollte man deshalb auf jeden Fall riskieren! Streng genommen ist der Cappuccino eigentlich nur zum Frühstück angemessen. Denn nach 11 Uhr ist er von den Italienern etwas verpönt. Vorstellbar nur noch, wenn es draußen kalt ist. Warum das so ist? Ein Cappuccino gilt als schweres Getränk, das nicht verdauungsanregend ist, sondern in erster Linie selbst verdaut werden muss. Wenn man sich dieser Tradition nicht widersetzen will, aber dennoch etwas Milch zu seinem Espresso möchte, dann gibt es als Alternative den sogenannten Caffé macchiatto (ein mit Milch befleckter Espresso, also fast ein Mini-Cappuccino ohne Schaum). Während es an dieser Stelle noch eine Toleranzgrenze gibt, ist es in Italien ein absolutes „No-Go“ einen Cappuccino direkt nach der Mahlzeit zu bestellen. Hier muss Espresso getrunken werden, wenn man sich nicht sofort als deutscher Tourist outen möchte.Abschließend sei noch gesagt, dass es keine festen „Kaffeezeiten“ in Italien gibt. Espresso wird rund um die Uhr und überall getrunken. Auch ist das Glas Wasser zum Espresso keinesfalls obligatorisch wie oftmals berichtet wird. Zwar wird in den meisten Fällen ein Wasser gratis mitserviert, aber das ist nicht typisch italienisch."
year_published = 2023
clearnet = "https://kaffee.org/espresso-italien-das-sollten-sie-als-tourist-beachten"
