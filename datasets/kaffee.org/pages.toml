["https://kaffee.org/christof-feichtinger-kaffee-test"]
title = "Christof Feichtinger Kaffee – Test  |  kaffee.org"
full_description = "Zum Start unserer Testserie verschiedener Bohnenkaffees haben wir uns für den Café de Guatemala von Christof Feichtinger entschieden. Christof Feichtinger ist Gründer der gleichnamigen GmbH mit Sitz im baden-württembergischen Königheim. Er selbst wuchs in Guatemala auf und ist somit tief verbunden mit dem sogenannten Land des ewigen Frühlings und dessen Einwohnern, den Guatemalteken. Darauf basiert sein Bedürfnis die Situation des Landes zu verbessern und die hiesige Wirtschaft zu unterstützen, zumal der Anbau und Export von Kaffee die primäre Einkommensquelle der Bewohner darstellt. Die GmbH verfolgt drei elementare Prinzipien: höchste Qualität, Nachhaltigkeit und direkter Handel."
