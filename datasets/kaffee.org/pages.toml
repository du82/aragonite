["https://kaffee.org/kaffee-in-der-schwangerschaft"]
title = "Kaffee in der Schwangerschaft  |  kaffee.org"
full_description = "Die Tasse Kaffee am Morgen – macht wach, macht glücklich und gehört bei den meisten Menschen inzwischen so fest ins Morgenritual wie das Zähneputzen. Ja – der Kaffeekonsum scheint unverzichtbar.Kaffeesorten sollte man möglichst darauf achten überwiegend Arabica Bohnen zu kaufen. Früher befürchtete man oft, dass der erhöhte Koffein-Konsum in der Schwangerschaft eine Fehlgeburt begünstigen könnte – diese Annahme wurde aber mittlerweile glücklicherweise verworfen. Eine skandinavische Studie kommt nun zu dem Schluss, dass das Geburtsgewicht des Kindes durch die Aufnahme von Koffein beeinflusst wird. So bringen Frauen, die viel Kaffee und ähnliche Lebensmittel konsumieren, im Schnitt 60-70 Gramm leichtere Kinder zur Welt, als solche, die darauf verzichten. Durch das geringere Geburtsgewicht steigt das Risiko von gesundheitlichen Problemen in der Kindheit. Zusätzlich besteht das Problem, dass der Embryo noch nicht in der Lage ist, das Koffein im Blut abzubauen – es lagert sich deshalb im Hirngewebe ab. Genaue Studien zu den daraus resultierenden Folgen für die Kindesgesundheit gibt es bisher leider nicht. Als Alternative zum koffeinhaltigen Kaffee kann selbstverständlich ein Ersatzprodukt, beispielsweise aus Gerste oder Malz aufgebrüht werden. Dieses ist koffeinfrei und damit unbedenklich. Auch einige Teesorten eignen sich hervorragend als Alternative – wobei hier wieder auf den Koffeingehalt geachtet werden sollte: Schwarztee oder grüner Tee sind beispielsweise koffeinhaltig, Rooibostee dagegen nicht. Wenn es nicht zwingend etwas Warmes sein soll, eignen sich zum Frühstück natürlich auch Smoothies oder frisch gepresste Fruchtsäfte. Der ursprünglich schlechten Ruf konnte in zahlreichen Studien bereits widerlegt werden. Beispielsweise konnte die EPIC-Deutschland-Studie bei mehr als 42.000 Menschen nachweisen, dass Kaffeetrinken nicht das Risiko für Herz-Kreislauf-Erkrankungen erhöht. Parallel kam heraus, dass Kaffeetrinken sogar das Typ-2-Diabetes Risiko verringert. Man sollte einfach (wie bei allen Dingen) darauf achten nicht zu viel zu konsumieren. Maximal vier Tassen am Tag und man ist auf der sicheren Seite. Andersherum: 12 Fakten, warum Kaffeetrinken gesund ist.Hinweis: Die einzelnen Darstellungen enthalten nur allgemeine Hinweise, die eine individuelle Diagnose, Beratung und Behandlung durch Ärzte nicht ersetzen kann."
