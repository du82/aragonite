full_description = "Röstereien in Frankfurt backyard coffee Fair gehandelt Bio Espresso Röstungen mittlerer Preis Deuil-La-Barre-Str. 80 60437 Frankfurt zur Backyard coffee Kaffeerösterei Basaglia Fair gehandelt Bio eigenes Café Espresso Röstungen mittlerer Preis Große Seestraße 43 60486 Frankfurt zur Basaglia Kaffeerösterei Frankfurter Kaffeerösterei Fair gehandelt Bio eigenes Café Espresso Röstungen mittlerer Preis Georg-Allgaier-Strasse 4-6 60437 Frankfurt zur Frankfurter Kaffeerösterei Hoppenworth & Ploch Fair gehandelt Bio eigenes Café Espresso Röstungen mittlerer Preis Friedberger Landstraße 86 60316 Frankfurt zur Hoppenworth & Ploch Kaffeerösterei Wacker's Kaffee Bio Espresso Röstungen mittlerer Preis Salzschlirfer Straße 14 60386 Frankfurt zur Wacker‘s Kaffee Kaffeerösterei Die Weltstadt mit Charme in Hessen Frankfurt ist weltweit als Bankenmetropole bekannt und ist mit seinen vielen Hochhäusern einmalig in Deutschland. Nicht wenige sind der Meinung, die Stadt im Rhein-Main Gebiet sei neben Berlin die einzige internationale Metropole in Deutschland. Die dort ansässigen Banken und Dienstleistungsunternehmen locken viele internationale Mitarbeiter an, die auch die Kultur und Gastronomie beeinflussen. Neben global angesehenen Museen, Theatern und Opernhäusern kann sich auch die Restaurant- und Café-Landschaft sehen lassen. Doch neben der Weltgewandtheit zeichnet sich Frankfurt nach wie vor durch Tradition und Bodenständigkeit aus. Dieser Mix aus unterschiedlichen Welten macht die hessische Großstadt so interessant, wovon auch die Kaffeekultur profitiert. Großes Angebot an lokalen Frankfurter Kaffeeröstereien Ob in der Frankfurter Kleinmarkthalle, im angesagten Ostend, in Bornheim oder in Uni-Nähe im Westend: Frankfurt hat zahlreiche hochwertige Röstereien zu bieten. Neben alteingesessenen Kaffeeröstern gründen im Zentrum des Rhein-Main Gebiets immer wieder junge Röstmeister ihr eigenes Unternehmen. Die dritte Kaffeewelle in Deutschland hat längst auch die Universitätsstadt in Hessen erreicht, sodass die Vielfalt der Röststätten in den letzten Jahren rasant zugenommen hat. Vor einiger Zeit lag der Fokus der Frankfurter Röstereien noch auf kräftigen Espressomischungen, wie man sie aus Italien kennt. Die meisten Kaffeeröster hatten eine solide Hausmischung im Angebot und haben relativ wenig experimentiert. Inzwischen liegen helle Röstungen und unkonventionelle Kaffeemischungen im Trend, sodass auch die Frankfurter Röster ein deutlich größeres Repertoire anbieten und mit verschiedenen Aromen spielen. Frisch gerösteter Kaffee in gemütlichen Cafés Kaffeeliebhaber finden in Mainhattan gemütliche, charmante Kaffeehäuser genauso wie moderne, hippe Cafés mit internationalem Flair. Es empfiehlt sich, in trendigen Vierteln wie Nordend, Ostend oder Bornheim nach einem kleinen Café Ausschau zu halten und in lockerer Atmosphäre mit Studenten, Berufstätigen und Touristen gemeinsam den erstklassigen Kaffee zu genießen. Doch auch in urigen Stadtteilen wie Sachsenhausen wird man immer wieder von interessanten Kaffeeröstereien mit angeschlossenem Ausschank überrascht."
