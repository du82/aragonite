["https://kaffee.org/kaffee-selbst-anbauen"]
title = "Kaffee selbst anbauen - So gelingt die Aufzucht einer eigenen Kaffeepflanze  |  kaffee.org"
full_description = "Die Aussaat einer Kaffeepflanze ist ganzjährig möglich. Am besten gelingt die Anzucht mit frischen Samen, die man idealerweise den gereiften Kaffeebeeren entnehmen kann. Diese können anschließend, nachdem man sie von ihrer etwas härteren Schale und dem sie umschließenden Silberhäutchen getrennt hat, etwa einen Zentimeter tief in Erde gesteckt werden. Es ist sinnvoll, jede Bohne in einen eigenen Topf zu pflanzen. Kopfstecklinge können von einem Kaffeestrauch gewonnen und direkt in Erde gesetzt werden. Ein ausreichend warmer Standort ist in beiden Fällen wichtig. Ist die Pflanze groß genug und weist eine entsprechende Wurzelbildung auf, kann sie in einen größeren Topf umgepflanzt werden. Jetzt tut ihr eine Mischung aus Erde und Substrat gut, da eine konstante Feuchthaltung gewährleistet sein sollte. Weiteres Umtopfen ist in der Regel höchstens alle zwei bis drei Jahre erforderlich. Zum Gießen eignet sich weiches Regenwasser am besten. Ein leicht saurer Boden, der das Wachstum begünstigt, kann durch die gelegentliche Beimengung von Zitronensaft erreicht werden. Tropische und subtropische Pflanzen wie die aus Äthiopien stammende Kaffeepflanze besprüht man zudem möglichst täglich mit Wasser, da sie so auch über die Blätter Feuchtigkeit aufnehmen können. Warme Sommerregen sind eine gute Pflege für den Strauch, der die Temperaturen im Freien ansonsten nicht verträgt. In den kälteren Monaten sollte man seinen Coffea weniger gießen, jedoch eine möglichst hohe Luftfeuchtigkeit beibehalten. Die Kaffeepflanze mag Temperaturen zwischen 20 und 25 Grad, ist also die ideale Zimmerpflanze. Im Winter verträgt sie auch etwas kühlere Temperaturen um die 12 bis 15 Grad. Eine wesentlich kältere Umgebung oder Zugluft sollten vermieden werden. An einem hellen Standort, nicht der direkten oder prallen Sonne ausgesetzt oder durch andere Pflanzen beengt, fühlt sie sich wohl. Beschneiden kann man seine Kaffeepflanze unregelmäßig, falls ein buschigerer Wuchs gewünscht ist.Bis die Pflanze erstmals blüht, können einige Jahre vergehen."
year_published = 2023
clearnet = "https://kaffee.org/kaffee-selbst-anbauen"
