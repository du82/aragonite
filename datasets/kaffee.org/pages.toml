["https://kaffee.org/kaffeewasser"]
title = "Die Wissenschaft hinter Kaffeewasser und Tipps zur perfekten Aufbereitung  |  kaffee.org"
full_description = "Wasser nicht nur der Hauptbestandteil des „schwarzen Golds“, sondern auch entscheidend für den Geschmack des Endprodukts. Ist das Wasser beispielsweise zu kalkhaltig, kann dies das Aroma der mit ihm zubereiteten Getränke stark beeinflussen. Doch auch zu weiches Wasser kann zu Geschmacksveränderungen führen. Verantwortlich für die unterschiedlichen Härtegrade sind die Boden- und Gesteinsverhältnisse der jeweiligen Umgebung. Bestimmt wird die Wasserhärte durch das Messen von Kalzium- und Magnesiumionen. Die Härte wird in der Einheit °d ausgedrückt. Je höher die Anteile dieser Ionen, desto höher ist der Härtegrad des Leitungswassers. Zu weiches Wasser hebt die Säureanteile von stark oder schnell geröstetem Kaffee, sowie Sorten, die ohnehin säurebetont schmecken, zu stark hervor. Hartes Wasser aber ist ebenso unvorteilhaft, wenn es um die feinen Säuren und fruchtigen Noten des Arabica geht, da es diese durch seine basische Wirkung nahezu aufhebt. Auch entfaltet dieses Kochwasser oftmals einen unbeabsichtigten Eigengeschmack. Das beste Wasser für die Kaffeezubereitung ist sauberes, weiches und kalziumarmes Wasser. Hartes Wasser oder Wasser mit hohem Mineralgehalt kann den Geschmack und die Qualität Deines Kaffees negativ beeinflussen. Die Zubereitung des perfekten Kaffeewassers beginnt mit dem Filtern und Entfernen von Verunreinigungen wie Chlor und Schwermetallen. Danach kann man noch das Wasser abkochen und abkühlen lassen, um es von Kalk zu befreien. Weiches Kaffeewasser ist kalzium- und magnesiumarmes Wasser. Es ist ideal für die Kaffeezubereitung, da es weniger Mineralgehalt enthält, der den Geschmack negativ beeinflussen kann. Die meisten Kaffeemaschinenhersteller empfehlen die Verwendung von weichem Wasser. Das Wasser, das Du zum Kaffeebrauen verwendest, hat auch Auswirkungen auf die Langlebigkeit und Leistung Deiner Kaffeemaschine. Hartes Wasser kann Rückstände in der Maschine hinterlassen und dazu führen, dass sie verkalkt und schwerer zu reinigen ist."
year_published = 2023
