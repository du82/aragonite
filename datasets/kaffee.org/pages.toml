["https://kaffee.org/milchkaffee"]
title = "Milchkaffee ᐅ Café au lait, & Caffè Latte Zubereitung"
description = "Milchkaffee ✓ Café au Lait ✓ Caffè Latte ✓ Tipps für die Zubereitung ✓"
full_description = "Angenommen, Sie trinken gern Kaffee mit viel Milch und möchten eben diesen in einem Café trinken. Würden Sie einen Milchkaffee, einen Café au Lait, einen Caffè Latte, einen Café con leche oder einen „Kaffee mit viel Milch“ bestellen? Und was würden Sie erwarten, serviert zu bekommen? Viele Kaffeetrinker und Cafébesitzer verwenden die Bezeichnungen Milchkaffee, Café au Lait, Caffè Latte und Café con Leche synonym. Auf den ersten Blick mag das sinnvoll erscheinen, schließlich handelt es sich bei allen der genannten Kaffeevariationen um Kaffee mit hohem Milchanteil. Doch der Teufel steckt im Detail. So, wie Milch schwarzen Kaffee erhellt, wollen wir Licht ins Dunkel des Milchkaffee-Begriffsdschungels bringen. Klassischerweise wird Milchkaffee in Deutschland mit normalem Filterkaffee zubereitet, der mit warmer Milch aufgefüllt wird. Kaffee und Milch werden dabei zu gleichen Teilen verwendet. Serviert wird der Milchkaffee meist in einer großen Tasse oder Schale, gelegentlich auch mit Milchschaum. Der französische „Café au lait“ – also „Kaffee mit Milch“ – wird ebenfalls zu gleichen Teilen aus Kaffee und heißer Milch zubereitet. In Frankreich wird diese Kaffeespezialität insbesondere zum Frühstück getrunken, wobei die Franzosen gern ihr Baguette oder ihren Crossaint in den Café au lait eintunken. In Italien bekommt man bei Bestellung eines Caffè Latte einen doppelten Espresso serviert, der mit reichlich heißer Milch aufgegossen wird. Da die Milch nicht gekocht, sondern heiß aufgeschäumt wird, kommt zumeist eine kleine Menge Milchschaum mit in den Caffè Latte. Eine Verwechslungsgefahr mit dem beliebten Latte Macchiato (übersetzt etwa „gefleckte Milch“) besteht allerdings nicht. Denn dieser hat nicht nur eine große Milchschaumhaube, sondern unterscheidet sich auch durch die typische, namensgebende, Schichtung seiner Bestandteile im hohen Glas optisch deutlich vom Caffè Latte. In Italien wird Latte Macchiato oft für Kinder bestellt."
year_published = 2023
