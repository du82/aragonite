["https://kaffee.org/bionatural-espresso-test"]
title = "Bionatural Espresso - Test  |  kaffee.org"
full_description = "Dieses Mal haben wir uns für den Bionatural Bio Fairtrade Kaffee-Espresso by J. Hornig entschieden. Eines deutet sich bereits jetzt an: Doppelt und dreifach Nennungen werden im Verlauf unseres Tests eine Art Programm sein. Denn der Röster entspricht nicht dem Verkäufer. J. Hornig ist eine große und bekannte Familien-Kaffeerösterei aus Graz, Österreich. Die Manufaktur wurde bereits 1912 gegründet – man kann also getrost von einem Traditionsunternehmen sprechen. Der Fokus beim Kaffeerösten liegt neben der Reinheit der Rohstoffe, vor allem auf der Präzision bei der Herstellung – das ist zumindest die Unternehmensphilosophie. 2012 – passend zum 100-jährigen Firmenjubiläum – wurde das Unternehmen an Sohn Johannes Hornig IV übergeben. Die Marke mit den drei kultigen Sultan-Köpfen (oder eher Männern mit Afros?) stellt sich aktuell neu auf – dazu gehört vor allem ein neues frisches Design und eine noch klarere Positionierung in Richtung Premiummarke. Eine schonende Trommelröstung anstatt einer industriellen Heißluftröstung soll den Anspruch des Unternehmens weiter unterstreichen und dem Espresso eine besondere Aroma-Note verpassen. Der Röstvorgang wurde für den späteren Einsatz mit Kaffeevollautomaten optimiert – ideal für unsere Bedingungen. Ein Effekt der Trommelröstung soll außerdem die Reduzierung der Bitterstoffe sein. Das können wir so leider nicht bestätigen, aber mehr dazu im Fazit. Wer jetzt im Hornig Online-Shop verzweifelt nach „Bionatural Espresso“ sucht, wird allerdings nicht fündig werden. Denn der Vertrieb von Kaffee mit der Bezeichnung „Bionatural“ findet ausschließlich über den deutschen Vertriebspartner Business Coffee mit Sitz in München statt und befindet sich somit auch im Eigentum des mittelständischen Unternehmens aus Bayern. Vielleicht entspricht der „Espresso Creme – Alles Bio“ von J. Hornig dem „Bionatural“ von Business Coffee, vielleicht aber auch nicht. Was wir damit sagen wollen: Das alles ist im ersten Moment recht schwer nachzuvollziehen. Deshalb sind wir quasi gezwungen in diesem Test sowohl den Röster als auch den Vertriebspartner vorzustellen. Die Business Coffee GmbH versteht sich als alternativer Anbieter von exklusiven Kaffeesorten und Bio-Teemischungen sowie Zubehörartikel rund um Kaffee und Tee. Wenn man die Bionatural-Röstung bestellt, kauft man demnach bei Business Coffee, die wiederum den Kaffee bei J. Hornig rösten lassen. Wir hoffen, damit ist die Sachlage nun klar geworden."
