["https://kaffee.org/handpresso"]
title = "Handpresso: Espressomaschine für unterwegs  |  kaffee.org"
full_description = '''Es gibt Autohersteller, die damit werben bei Müdigkeitserscheinungen des Fahrers ein kleines Kaffeesymbol im Cockpit einzublenden. Ohne in technische Details abzudriften, geschieht dies über ein Kamerasystem, das insbesondere die Augenbewegungen des Fahrers überwacht. Die Botschaft des Autos: Ich habe bemerkt, dass du nicht mehr sehr konzentriert zu sein scheinst. Du blinzelst ständig. Tu' dir selbst und anderen einen Gefallen und fahre bei der nächsten Gelegenheit an einen Autohof und gönne dir zumindest eine Tasse Kaffee. Recht hat das Auto! Im Idealfall merkt man das sogar selbst. Das einzige Problem: Wo ist der nächste Autohof und ist der Kaffee dort nicht extrem teuer? Mit einer mobilen Espresso-Maschine von Handpresso genügt ein beliebiger Parkplatz oder eine Parkbucht für den spontanen und auf Dauer sicherlich kostengünstigeren Kaffeegenuss. Denn damit lässt sich dann direkt im Auto frischer Espresso aufbrühen. Natürlich auch bestens geeignet, wenn die rote Ampelphase mal wieder länger andauert - von Stau ganz zu schweigen! Andere Autofahrer im Umkreis werden die Prozedur mit neidischen Blicken verfolgen. So einen Autobahn-Espresso könnte man bestimmt in einigen Stausituationen für 5 Euro verkaufen. Aber das sei nur mal am Rande erwähnt. Die Bedienung der mobilen Espressomaschine ist relativ einfach. In nur 10 Schritten zum "Coffee to drive": Mit einem Preis von 150 Euro ist das Gerät nicht gerade billig. Die gute Verarbeitung, qualitativ hochwertige Materialien und fast schon allein die Tatsache eine Handespressomaschine zu besitzen, sind es dennoch wert. Vorteil: Es eignen sich sämtliche E.S.E. Kaffeepads für die Maschine. E.S.E. steht für Easy Serving Espresso und ist ein nicht proprietäres System, an dem sich alle interessierten Röster oder Hersteller beteiligen können. Jene Pads sind hartgepresst, haben einen Durchmesser von 4,4 cm und können sowohl in der Handpresso für das Auto als auch für das nachfolgende Produkt verwendet werden.'''
