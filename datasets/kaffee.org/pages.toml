["https://kaffee.org/schritt-fuer-schritt-anleitung-die-reinigung-der-jura-impressa-xj9-professional"]
title = "Schritt-für-Schritt Anleitung: Die Reinigung der Jura Impressa XJ9 Professional  |  kaffee.org"
full_description = "Kaffeevollautomaten sind einfach zu bedienen. Doch guter Kaffee aus Kaffeevollautomaten schmeckt nur dann lecker und aromatisch, wenn man die Kaffeemaschine auch hegt und pflegt. Eine regelmäßige und gründliche Reinigung ist daher von enormer Wichtigkeit. Im Oktober haben wir für euch den High-End Kaffeevollautomaten “Jura Impressa XJ9 Professional” getestet und vorgestellt. Heute möchten wir euch mit diesem Artikel zeigen, wie diese Kaffeemaschine gereinigt wird. Bevor ihr mit dem Reinigungsprogramm anfangt, gibt es jedoch noch ein paar Dinge zu beachten.Die Reinigung der Jura Impressa XJ9 sollte in der Regel nach 200 Zubereitungen oder 80 Einschaltspülungen erfolgen. Das Reinigungsprogramm dauert ungefähr 20 Minuten und die Reinigung sollte nicht unterbrochen werden, da sonst die Reinigungsqualität beeinträchtigt wird. Und jetzt zur Reinigung. Nach der Leerung drückt ihr den “Rotary Switch” und stellt ein Gefäß unter den Kaffeeauslauf sowie unter die Cappuccino-Düse. Nun die Abdeckung des Einfülltrichters für gemahlenen Kaffee öffnen, ebenfalls eine Reinigungstablette einwerfen und die Abdeckung wieder schließen. Der Vorgang wird abermals unterbrochen und die Restwasserschale und der Kaffeesatzbehälter müssen geleert, gründlich gereinigt und wieder eingesetzt werden. Wir finden, dass das Reinigungsprogramm nicht nur schnell, sondern auch überschaubar ist. Eine leichte Handhabung ist auf jeden Fall gegeben. Vor allem durch die Schritt-für-Schritt Anleitung im Display ist die Reinigung wirklich kinderleicht und man erspart sich das hektische Durchblättern der Betriebsanleitung. Wir wünschen euch viel Spaß beim Reinigen und genießt euren Kaffee in vollen Zügen. Wir können die Reinigungstabletten trotz des hohen Preises uneingeschränkt empfehlen. Sie reinigen schnell und gründlich, der Kaffeegeschmack wird in keiner Weise beeinträchtigt. Neben der Jura-Maschine können die Tabletten auch zur Reinigung von Thermoskannen eingesetzt werden."
year_published = 2023
