["https://kaffee.org/latte-macchiato"]
title = "Latte Macchiato: Alles über die Herkunft und Zubereitung  |  kaffee.org"
full_description = "Wer gern von Latte Macchiato spricht, sollte sich einige Hintergrundinformationen aneignen, um Missverständnisse oder sogar eine falsche Aussprache zu vermeiden. Der Name Latte macchiato stammt aus dem Italienischen und bedeutet so viel wie „gefleckte Milch“, das Wort macchiato wird wie „Makkiato“ gesprochen. Dieser amüsante Name führt uns auch gleich zur ursprünglichen Entwicklung des heutigen Szene-Getränks: Italiener lieben ihren Kaffee, und natürlich dürfen auch die Kinder davon trinken. Da reiner Kaffee oder sogar Espresso für kleine Italiener aber zu viel Koffein enthält und wohl auch zu bitter schmeckt, bekommen die Kinder ihre „gefleckte Milch“, also ein großes Glas warme Milch mit einem Schuss Kaffee. In den Dörfern Italiens wird der Latte macchiato bis heute so getrunken, in touristisch attraktiven Regionen aber, hat er sich weiterentwickelt und dem Geschmack der Besucher des Landes angepasst. Nördlich der Alpen wird der Latte macchiato grundsätzlich in Schichten getrunken, die nur durch die perfekte Zubereitung zustande kommen. Mit einer gut Ausgestatteten Kaffeemaschine ist ein Latte macchiato in Sekunden zubereitet – die Zubereitung ohne Kaffeevollautomat ist aber auch kein Hexenwerk und selbst gemacht schmeckt bekanntlich immer noch am besten 😉 Latte Macchiato ist neben dem Cappuccino das Trendgetränk im europäischen Raum. Speziell für Liebhaber des Milchkaffees ist Latte macchiato eine gute Alternative mit der extra Portion Milch. Der Latte macchiato wird aus den gleichen Zutaten zubereitet wie sein engster Verwandter, der Cappuccino. Allerdings ist beim „Latte“, der Name deutet es ja schon an, da Latte Milch bedeutet, der Milchanteil wesentlich höher, während beim Cappuccino der Espressoanteil überwiegt. Beide Getränke werden grundsätzlich nicht mit Filterkaffee zubereitet, sondern mit frisch aufgebrühtem Espresso. Beim Latte Macchiato wird die Milch wesentlich stärker aufgeschäumt als beim Cappuccino, so dass ein fester Milchschaum entsteht. Zuerst wird die Milch in das Glas gefüllt, anschließend der feste Milchschaum darauf geschichtet. Durch die viele Luft im Schaum bleibt dieser stets als oberste Schicht im Glas. Zum Schluss wird ein frisch gebrühter, einfacher Espresso vorsichtig (!) durch die Schaumschicht in das Glas gefüllt. Weil der Espresso wärmer als die Milch ist, setzt er sich bei langsamem Gießen zwischen Milch und Milchschaum ab. Es entstehen die typischen drei Schichten des Latte Macchiato. Der Latte Macchiato wird stets im Glas serviert, damit die einzelnen Schichten des Getränks schön zur Geltung kommen. Dazu wird ein langer Löffel zum Umrühren gereicht."
year_published = 2023
