["https://kaffee.org/koffeingehalt-von-kaffee"]
title = "Koffeingehalt von Kaffee - Ein Vergleich  |  kaffee.org"
full_description = "Koffein besitzt eine anregende, stimulierende Wirkung und ist ein Alkaloid, das als weißes, kristallines, geruchloses Pulver mit bitterem Geschmack auftritt. Weltweit ist Koffein die am meisten konsumierte Substanz mit aktiver pharmakologischer Wirkung. Koffein kommt nicht nur in Kaffee vor sondern auch in anderen Genussmitteln wie Tee, Mate, Cola, Guaraná, Kakao, Kolanüssen und Energy-Drinks. Selbst in diversen Schmerzmitteln ist nicht selten Koffein enthalten, was man auf dem Beipackzettel nachlesen kann.Die anregende Wirkung, so sie denn in entsprechender Menge vorhanden ist, wirkt sehr schnell. Ist der Koffeingehalt des Getränkes oder anderen Produktes jedoch minimal, dann ist gegebenenfalls überhaupt keine Wirkung spürbar. Aber nicht nur der Koffeingehalt spielt bei der Wirkungsweise eine tragende Rolle sondern auch die Art des Nahrungsmittels und dessen Zusammensetzung.Der Koffeingehalt im Vergleich 25 ml Espresso (oft serviert in einer 40 bis 50 ml Espressotasse) enthalten zwischen 25 bis 30 mg Koffein Da Cappuccino und Latte-Macchiato jeweils einen Espresso beinhalten entspricht der Koffeingehalt dem eines Espresso. Gut zu wissen: In Italien und anderen Ländern bekommt man bei Bestellung eines Caffè Latte einen doppelten Espresso serviert, der mit reichlich heißer Milch aufgegossen wird. 25 ml im Filteraufgussverfahren aufgebrühter Bohnenkaffee enthält zwischen 15 bis 25 mg Koffein. Bei einer übliche Kaffeetasse mit 125 ml Füllmenge ergibt das eine Koffeinmenge von 75 - 120 mg Während ein entkoffeinierter Kaffee in einer 125 ml Tasse noch eine geringe Restmenge an Koffein aufweist, die zwischen 1 und 4 mg liegt. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung."
