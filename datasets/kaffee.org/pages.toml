["https://kaffee.org/einkreiser-und-zweikreiser"]
title = "Was sind eigentlich Einkreiser und Zweikreiser Espressomaschinen?  |  kaffee.org"
full_description = "Espressomaschinen arbeiten mit unterschiedlicher Technik: dem Ein- und dem Zweikreiser-System. Der hauptsächliche Unterschied liegt darin, dass Zweikreiser getrennte Kreisläufe für den Brühvorgang und die Dampferzeugung haben, während dies beim Einkreiser über eine Einheit geregelt wird. Einkreiser sind für reine Espressotrinker geeignet, die nur gelegentlich Wasserdampf zum Aufschäumen von Milch benötigen. Die Maschinen sind mit einem kleinen Kessel ausgestattet, in welchem das Wasser für den Brühvorgang erhitzt wird. In demselben Kessel wird das Wasser erhitzt, um Dampf zu erzeugen, wobei dies höhere Temperaturen erfordert und der Kessel im Anschluss jedes Mal entlüftet werden muss. Erst, wenn das Wasser wieder abgekühlt ist, ist die Maschine bereit für den nächsten Espresso. Entsprechend langwierig ist die Zubereitung mehrerer Cappuccino oder Café Latte direkt hintereinander. Daneben muss das Wasser bei mehreren Brühvorgängen erneut erhitzt werden. Bei einem Zweikreiser dient jeweils ein Wasserkreislauf dem Erhitzen des Wassers für den Brühvorgang und einer der Erzeugung von Dampf. Es kann also zugleich Espresso zubereitet und Milch aufgeschäumt werden, ohne dass das Wasser zwischenzeitlich abkühlen und der Kessel entlüftet werden muss. Auch bleibt die Temperatur im Kessel während des Brühvorgangs stabiler als beim Einkreiser. Letzteres ist in einem größeren Wasservolumen und der Konstruktion des Zweikreisers bedingt. Bei der Zubereitung mehrerer Espresso-Getränke, insbesondere mit aufgeschäumter Milch, ist der Zweikreiser also schneller als der Einkreiser.Somit ist der Einkreiser die richtige Wahl für Einzelpersonen, die nur gelegentlich mal einen Cappuccino oder Café Latte zubereiten. Sollen Gäste bewirtet werden oder leben mehrere Personen im Haushalt, die unterschiedliche Vorlieben haben, ist ein Zweikreiser besser geeignet. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung."
