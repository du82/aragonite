title = "Ratgeber  |  kaffee.org"
full_description = "Unzählige Kaffeevariationen, unendlich viele Kaffeesorten, die unterschiedlichsten Kaffeemaschinen und massenhaft Zubereitungsarten. Um den Überblick nicht zu verlieren, haben wir die Kategorie „Ratgeber“ ins Leben gerufen. Sie soll durch die Welt des Kaffees führen, nützliche Tipps & Tricks vermitteln und natürlich Rat geben. Manchmal auch einfach nur auf unterhaltsame Weise informieren. Warum zum Beispiel in Italien den obligatorischen Espresso an der Theke trinken? Oder was ist dran an nachhaltigem Kaffeegenuss und wie lässt sich dies umsetzen? Welches Zubehör ist hilfreich, welche Maschine eignet sich am besten für mich und wie um alles in der Welt röstet man Kaffee? Diesen und weiteren Fragen wollen wir hier auf den Grund gehen."
