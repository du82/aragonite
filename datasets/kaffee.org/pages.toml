["https://kaffee.org/cellini-espresso-prestigio-test"]
title = "Cellini Espresso Prestigio - Test  |  kaffee.org"
full_description = "Seien wir doch mal ehrlich: Den ultimativen Kaffeegenuss verbinden die meisten von uns mit Italien. Auch wenn der Rohkaffee freilich aus weiter entfernten Anbauregionen stammt wie im Fall des „Cellini Espresso Prestigio“ aus Mittel- und Südamerika. Aber Rösten, Zubereiten und Servieren wird nirgendwo sonst derart leidenschaftlich zelebriert wie in Bella Italia. Immerhin ist der Barista – der Kaffeebarkeeper - ein anerkannter Ausbildungsberuf. Wenn wir uns italienischen Kaffee nach Hause holen, hoffen wir ein stückweit das südländische Flair und das positive Lebensgefühl mitzukaufen. Zugegeben, das ist viel verlangt. Aber der „Cellini Espresso Prestigio“ hat sein Bestes gegeben."
