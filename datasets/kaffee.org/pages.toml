["https://kaffee.org/kaffee-beugt-depressionen-vor"]
title = "Kaffee beugt Depressionen vor  |  kaffee.org"
full_description = "Hierbei handelt es sich nicht um eine alte Bauernweisheit, sondern um eine Tatsache an der US Forscher lange geforscht haben. Die Zusammenhänge sind zwar noch ein wenig unklar, aber ein Test mit fast 60.000 amerikanischen Damen über einen Zeitraum von 10 Jahren bestätigte die These, dass Kaffee vor Depressionen schützt. Im Langzeittest der Studie kristallisierte sich klar heraus, dass Frauen die keinen oder kaum Kaffee trinken wesentlich leichter zu Depressionen neigen als Frauen, denen ein Kaffeekränzchen täglich sehr wichtig ist. Schon der Genuss von zwei oder drei Tassen Kaffee minimierte das Depressionsrisiko um 15% gegenüber den Antikaffeetrinkerinnen. Bei einem Kaffeegenuss von vier Tassen pro Tag erhöhte sich der Wert sogar um 20%. Würde sich also der Jahresverbrauch der Deutschen von derzeit 150 Liter noch erhöhen, gäbe es wohl kaum noch Menschen, die unter Depressionen leiden. Leider ist diese These sehr gewagt, denn vielfach haben Depressionen auch krankhafte Eigenschaften, denen man sicherlich nicht mit Kaffee allein zu Leibe rücken kann. Kaffee enthält sehr viele Substanzen, die als Antioxidantien ihre Wirkung auf den Menschen entfalten. Aus diesem Grunde senkt Kaffee auch die Symptome von Prostatakrebs, auch hier tappt die Forschung noch im Dunkeln. Eines war jedoch schon immer klar, Die Wirkung von Koffein auf das Nervensystem, in seiner stimulierenden Art und Weise ist lange bekannt. Immerhin nimmt der Mensch das meiste Koffein nicht über die Cola ein, sondern zu 80% über den Kaffeegenuss. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung. Als engagierter Kaffeekenner achtet Luca auch auf Nachhaltigkeit und ethischen Konsum. Er widmet sich Themen wie fairem Handel, umweltfreundlichen Anbaumethoden und unterstützt lokale Kaffeebauern und -produzenten."
