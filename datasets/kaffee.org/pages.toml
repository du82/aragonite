["https://kaffee.org/kaffeemuehlen-elektrisch-und-von-hand"]
title = "Kaffeemühlen - elektrisch und von Hand  |  kaffee.org"
full_description = "Kaffeeliebhaber sind sich einig: Frische – von Kaffeemühlen gemahlene Bohnen – schmecken besser als abgepacktes Kaffeepulver! Denn das Aroma verfliegt bei fertigem Kaffeepulver viel schneller als bei ganzen oder frisch gemahlenen Bohnen – trotz Aromaschutzverpackung. Eine gesamte Packung Bohnen sofort zu mahlen, wäre demnach ebenso unklug.Kaffee selbst zu mahlen ist also nicht nur authentisch, sondern so kann man auch ohne teuren Kaffeevollautomat einen hochwertigen Kaffee selbst zubereiten.Ihr wollt euren Kaffee von nun an auch selbst mahlen? Wir haben für euch einen kleinen Kaffeemühlen-Ratgeber erstellt, der auf die Kriterien zur Auswahl der richtigen Kaffeemühle eingehen soll. Hand-Kaffeemühle oder elektrische Mühle? Wer sich entscheidet, seine Bohnen von nun an selbst zu mahlen, steht zunächst einmal vor der Wahl der richtigen Kaffeemühle. Doch welche Variante ist die beste? Grundsätzlich raten wir dazu, bei der Wahl einer geeigneten Kaffeemühle eher auf die Qualität als auf den Preis zu achten. Denn es gibt durchaus Qualitätsunterschiede zwischen den Kaffeemühlen. Dennoch – Hand-Kaffeemühlen sind in der Regel preisgünstiger als elektrische Kaffeemühlen und auch ein stückweit authentischer und lässiger – außerdem sind sie meistens mit einem sogenannten Kegelmahlwerk ausgestattet (dazu später mehr). Die Hand-Kaffeemühle ist ein Klassiker, der uns aus unserer Komfortzone lockt und der ein wenig Entspannung in unsere schnelllebige Welt bringt. Die Herstellung von Kaffeepulver ist natürlich kraftaufwändiger, weil die Mühlen über eine Kurbel angetrieben werden. Für kleine Mengen Pulver sind hochwertige Handmühlen sicherlich eine gute Lösung, bei größeren Mengen ist das Prozedere aber zu beschwerlich und zeitintensiv. Hier sind elektrische Kaffeemühlen schlichtweg praktischer als manuelle Kaffeemühlen! Bei ihnen ist es mit einem Knopfdruck getan. Man sollte bei intensiver Nutzung aber auch die maximale Betriebsdauer einhalten, denn das Mahlen von Kaffeebohnen ist auch für eine elektrische Mühle eine anstrengende Angelegenheit."
