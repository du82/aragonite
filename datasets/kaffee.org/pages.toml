["https://kaffee.org/mokka"]
title = "Mokka: Die Herkunft und Zubereitung  |  kaffee.org"
full_description = "Unter Mokka versteht man mehrfach aufgekochten, starken Kaffee aus feinstem Pulver, der für seinen hohen Koffeingehalt bekannt ist, in kleinen Tassen serviert und manchmal noch mit Gewürzen verfeinert wird. Mit Mokka verbinden viele Menschen entweder die typischen, kleinen Mokka-Tassen, aus denen dieser Kaffee getrunken wird oder aber eine Mischung aus Kaffee und heißer Schokolade. Letzteres ist eigentlich falsch, denn der ursprüngliche Mokka hat mit Schokolade nichts zu tun – der schokoladenartige Geschmack ist einfach eine Eigenheit der ursprünglichen Kaffeesorte Mokka. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung. Als engagierter Kaffeekenner achtet Luca auch auf Nachhaltigkeit und ethischen Konsum. Er widmet sich Themen wie fairem Handel, umweltfreundlichen Anbaumethoden und unterstützt lokale Kaffeebauern und -produzenten."
