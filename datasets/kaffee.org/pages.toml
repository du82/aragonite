["https://kaffee.org/tee-und-kaffee"]
title = "Tee und Kaffee schützen vor Herzerkrankungen  |  kaffee.org"
full_description = "Kaffee trinken ohne Reue, wer wünscht es sich nicht. Angesichts vieler kursierender Meinungen, Kaffeegenuss fördere Herz-Kreislauf-Erkrankungen, Schlaganfälle und andere Leiden, versucht sicht vielleicht so mancher leidenschaftlicher Kaffeetrinker zurückzuhalten, der Gesundheit zuliebe. Nachdem eine Studie vor Kurzem bereits offenbarte, dass Kaffee gut für das Herz sei, wagen nun niederländische Wissenschaftler einen weiteren Vorstoß, der die hartnäckigen Vorurteile gegen das schwarze Heißgetränk eindeutig schwächt. Die Ergebnisse ihrer im Juni 2010 veröffentlichten Langzeitstudie mit über 37.000 Probanden zeigen, dass moderater Kaffee-, aber vor allem Teegenuss dazu führen kann, das Risiko von Herzerkrankungen deutlich zu vermindern. Über 13 Jahre haben die Forscher vom University Medical Center in Utrecht Daten zum Tee- und Kaffeekonsum der Studienteilnehmer ausgewertet und mit dem Vorkommen von Herzerkrankungen und Todesfällen in dieser Personengruppe in Verbindung gesetzt. Am deutlichsten war das Ergebnis der Teetrinker. Wer täglich zwischen drei und sechs Tassen Tee trinkt, hat ein um 45 Prozent gesenktes Risiko, an einer Herzerkrankung zu sterben, als jemand, der weniger als eine Tasse Tee am Tag trinkt. Bei höherem Teekonsum (über sechs Tassen am Tag) ist das Risiko immer noch um 36 Prozent vermindert. In der Studie wurde zwar nicht erhoben, welche Art Tee die Probanden konsumierten. Es wird aber anhand statistischer Werte davon ausgegangen, dass 78 Prozent der niederländischen Teetrinker Schwarztee bevorzugen und 4,6 Prozent grünen Tee konsumieren. Damit können die Ergebnisse der Studie vor allem auf Schwarzteetrinker bezogen werden.Die Studie zeigte aber auch positive Ergebnisse für Kaffeetrinker: Zwei bis vier Tassen Kaffee am Tag senken das Risiko immerhin um 20 Prozent. Damit ist der Effekt nicht so stark wie bei Teetrinkern, aber dennoch klar vorhanden. Die Forscher statuieren auch, dass starker Tee- und Kaffeekonsum nicht das Risiko von Schlaganfällen erhöht, wie oft angenommen. Es konnten keine entsprechenden Zusammenhänge festgestellt werden.Warum allerdings bei Kaffeetrinkern die positiven Effekte schwächer ausfallen als bei Teetrinkern, können die Wissenschaftler nur vermuten. Möglicherweise seien starke Kaffeetrinker generell leichtfertiger mit ihrer Gesundheit, rauchen öfter und ernähren sich ungesünder. Sie hatten in der Studie höhere Cholesterinwerte und Blutzuckerspiegel als die Teetrinker. Trotzdem: Kaffee- und Teetrinker können sich also freuen. Die guten Auswirkungen auf die Gesundheit seien nicht von der Hand zu weisen und werden vielleicht den einen oder anderen starken Kaffeetrinker ein wenig beruhigen"
year_published = 2023
