["https://kaffee.org/anbaugebiete"]
title = "Kaffee Anbaugebiete & Herkunft  |  kaffee.org"
full_description = "Die Namen und Bezeichnungen von Kaffee-Röstungen vermitteln immer Fernweh nach exotischen Ländern und Gebieten. Da liest man zum Beispiel Äthiopien, Brasilien oder Sumatra. Oder kontinental ausgedrückt: Afrika, Mittel- und Südamerika sowie Teile Asiens. Wenn man sich einmal die Landkarte anschaut, stellt man fest, dass diese Regionen sich alle um einen Breitengrad tummeln – dem Äquator. Diese Anbaugebiete werden auch gerne unter dem Begriff „Kaffeegürtel“ zusammengefasst. Denn dort und auch nur dort, lassen sich Kaffeepflanzen kultivieren. Das liegt an den besonderen klimatischen Bedingungen: kein Frost und tropisches Wechselklima. An dieser Stelle wollen wir die wichtigsten Anbaugebiete vorstellen und euch weitere Infos geben. Die in Europa bekannte Kaffeebohne stammt von der Kaffeepflanze, die zur Gattung der Pflanzenart Rubiceae gehört. In deren Früchten, auch Kaffeekirschen genannt, reifen die Bohnen, die geröstet und zu Kaffee weiterverarbeitet werden. Doch die Kaffeepflanzen benötigen besondere geographische und klimatische Verhältnisse, da diese nur im feucht-milden Klima optimal gedeihen. Die Temperaturen sollten zwischen 15 und 28 Grad Celsius liegen. Hinzu kommt, dass sie dennoch viel Niederschlag und Sonneneinstrahlung benötigen. Aus diesem Grund gedeihen sie am besten in tropischen Höhenlagen, ab ca. 200 bis 2000 Meter Höhe. Brasilien – das Land des Fußballs, des Karnevals und natürlich des Kaffees, denn mit großem Abstand zu Vietnam produziert das südamerikanische Land immerhin 34 % des weltweit gehandelten Kaffees. Dabei ist Brasilien beherrscht von Gegensätzen, denn das Land mit dem international siebthöchsten Bruttoinlandsprodukt ist gleichzeitig eines der ärmsten Länder der Welt. Brasilien ist der größte Kaffeeexporteur weltweit – und das mehrere gute Gründe. Zunächst einmal wird Kaffeekultur in Brasilien selbst ganz groß geschrieben. In dem größten südamerikanischen Land wird Kaffee mit Gastfreundlichkeit und Genuss verbunden, denn egal, wann man ein Haus betritt, einen Cafezinho, einen kleinen schwarzen, starken Kaffee, bekommt man dort eigentlich immer angeboten. Dieser kleine Kaffee ist ein fester Bestandteil des brasilianischen Alltags: ob im Büro, bei Freunden, zu Hause oder auch im Café. Und so ist es natürlich wenig verwunderlich, dass Brasilien nicht nur im Kaffeegenuss, sondern auch in der Kaffeeproduktion ganz vorn mit dabei ist."
