["https://kaffee.org/black-ivory-kaffee"]
title = "Black Ivory Kaffee: Herkunft, Zubereitung, Geschmack, Preis & Nachhaltigkeit  |  kaffee.org"
full_description = "Der Trend zu exklusiven Edelkaffeesorten hält an: Nach „Kopi Luwag“, dem in Vietnam und Indonesien produzierten Kaffee, der seinen besonderen Geschmack durch die Verdauung von Schleichkatzen erhält, die die Bohnen fressen und wieder ausscheiden, gibt es nun „Black Ivory“ - „schwarzes Elfenbein“. Die in Thailand gewonnene Sorte wiederum, wandert durch den Verdauungstrakt wesentlich größerer Tiere. Wie schon der Name verrät, sind Elefanten in diesem Fall die Lieferanten des guten Geschmacks. Die Golden Triangle Asian Elephant Foundation betreibt im Auftrag des Kanadiers Blake Dinkin die Produktion des Luxuskaffees in Chiang Saen, im Norden Thailands, wo im Rahmen eines Gnadenhofes ehemalige Arbeitselefanten gehalten werden. Dieses „Altersheim“ hat es sich zur Aufgabe gemacht, den Tieren einen geschützten Lebensraum zu bieten. Für jeden Dickhäuter ist ein Mahut, ein Betreuer, zuständig, der sich um Pflege und Nahrung des jeweiligen Elefanten kümmert. Black Ivory Kaffee ist kein durchschnitlicher Kaffee, den du in deinem lokalen Supermarkt oder sogar in einer typischen Fachkaffeegeschäft finden wirst. Aufgrund seiner Seltenheit, ist er hauptsächlich online über die offizielle Black Ivory Coffee Webseite erhältlich. Der Black Ivory Kaffee hat eine beeindruckende Herkunftsgeschichte, die in den grünen Hochlandregionen von Thailand beginnt. Hier wird er in Handarbeit von den Bergstämmen der Karen und Lahu Volksgruppen angebaut. Die Kaffeekirschen werden dann den Elefanten zum Verzehr angeboten, das ist richtig! Dieser Kaffee durchläuft buchstäblich den Verdauungstrakt eines Elefanten, bevor er in deiner Kaffeetasse landet! Wie bei den meisten Premium-Kaffeesorten ist die Zubereitung des Black Ivory Kaffees wichtig, um das beste aus seinem einzigartigen Geschmack herauszuholen. Es wird empfohlen, den Kaffee per Hand in einem French Press Kaffeekocher zu brauen. Zuerst solltest du das Wasser auf etwa 93 Grad Celsius erhitzen. Dann füge deinen frisch gemahlenen Kaffee hinzu (etwa 10g für jede 120ml Wasser) und lass ihn für etwa 4 Minuten ziehen. Voilà, Dein Black Ivory Kaffee ist servierbereit!"
year_published = 2023
clearnet = "https://kaffee.org/black-ivory-kaffee"
