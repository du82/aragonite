hauptstadt wieder. Hierher pilgern Foodjunkies aus der ganzen Welt, um Craft Beer in Friedrichshain zu trinken, die beste vegane Currywurst in Kreuzberg zu probieren oder in einem Hinterhof in Mitte einen angesagten Foodtruck zu suchen. Ein weiterer Ernährungs-Trend, der in Berlin besonders ausgeprägt ist, dreht sich um Kaffee. Unzählige “Coffee Roasters” sind hier entstanden und machen Berlin in den Augen vieler Kaffeekenner zur Kaffeehauptstadt Deutschlands. Große Vielfalt an Berliner Röstereien und Cafés Mit dem Aufkommen der dritten Kaffeewelle sind in Berlin zahlreiche junge Kaffeeröstereien entstanden. Die hippen Röster haben sich vor allem auf helle Röstungen nach skandinavischem und amerikanischem Vorbild spezialisiert. Neben hochwertigen Kaffeebohnen aus nachhaltigem Anbau zeichnen sich diese Coffeeshops durch eine coole Atmosphäre aus. Längst ist der Kaffeegenuss zu einem richtigen Lifestyle für viele geworden und Kaffeeliebhaber legen größten Wert auf viele kleine Details - bezogen auf den Geschmack des Kaffees und die Einrichtung des Lokals gleichermaßen. Doch neben den modernen Cafés und Röstereien beheimatet die deutsche Hauptstadt auch alteingesessene Kaffeehäuser und Familienbetriebe, die sich schon seit Jahrzehnten mit Kaffee beschäftigen. Wer einen klassischen, kräftigen Espresso sucht und mit den modernen Kaffeetrends nicht viel anfangen kann, wird in Berlin also auch fündig. Die passenden Bohnen für jeden Geschmack Wie bereits erwähnt hält Berlin für alle Geschmäcker den richtigen Kaffee bereit. Die große Auswahl an Röststätten macht es möglich, morgens einen hell-gerösteten Filterkaffee aus Äthiopien zu trinken, die Mittagspause mit einem starken Espresso nach italienischem Vorbild abzuschließen und den Kuchen am Nachmittag mit einem leckeren Cappuccino aus südamerikanischen Bohnen zu genießen. In keiner anderen deutschen Stadt werden Einheimische und Touristen von so vielen Kaffeeexperten verwöhnt. Auch ausgefallene Kompositionen lassen sich in Berlin finden, sodass nahezu jedes Aroma abgedeckt wird. Wir empfehlen daher dringend einen Besuch in der deutschen Hauptstadt, um die Geschmackssinne zu erweitern und die Vielfalt des Kaffees zu erfahren."
