["https://kaffee.org/cafe-americano"]
title = "Cafe Americano: Zubereitung, Rezept & mehr  |  kaffee.org"
full_description = "Cafe Americano – das kann doch nichts anderes sein als ein amerikanischer Kaffee, oder etwa nicht?! Nicht ganz, denn der Cafe Americano kommt nämlich ursprünglich aus dem schönen Italien. Aller Wahrscheinlichkeit nach hat die Geschichte des etwas schwächeren Espressos im Zweiten Weltkrieg begonnen. Im Zuge des Krieges kamen viele amerikanische Soldaten, die so genannten G.I.s, nach Europa. Eine große Anzahl von Soldaten war zu dieser Zeit im südeuropäischen Italien stationiert. Die Militärs zeigten sich von Beginn an begeistert von der italienischen Ess- und Kaffeekultur. Nur mit dem kräftigen Espresso konnten und wollten sich die amerikanischen Gäste nicht so recht anfreunden – er war ihnen schlicht und einfach zu stark. Doch die Soldaten wussten sich natürlich zu helfen und streckten das kräftige, dunkle Kaffeegetränk einfach mit heißem Wasser. Die lebenslustigen Italiener nahmen die Abwandlung ihres Lieblingsheißgetränks mit Humor und setzten ihn, seiner Entstehung entsprechend, als „Caffè Americano“ (nach italienischer Schreibweise) auf ihre Getränkekarten.Kurioserweise ließ William Somerset Maugham in seinem bereits 1928 erschienenem Spionage-Roman Ein Abstecher nach Paris seinen Protagonisten im Ersten Weltkrieg einen Americano im italienischen Neapel bestellen. Ob es sich bei diesem Americano allerdings tatsächlich um den heute bekannten Cafe Americano handelt, ist nicht bekannt. Aber seien wir mal ehrlich, so machen Mythen doch viel mehr Spaß. Zu allererst wird natürlich ein klassischer Espresso zubereitet, am besten mit einem Vollautomaten oder einer Siebträgermaschine. Wichtig für die Herstellung des perfekten Espressos sind außerdem die Bohnenmischung, der richtige Mahlgrad und die passende Menge an Espressopulver. Wie man einen Espresso am besten zubereitet, erklären wir hier.Wie viel Espresso man für den Cafe Americano verwendet, bleibt letztendlich jedem selbst überlassen. Traditionell beträgt das Mischverhältnis von Espresso und Wasser allerdings 1:1 – bereitet man also einen doppelten Espresso für den Cafe Americano zu, verwendet man dementsprechend rund 55 - 60 ml heißes Wasser. Das Geheimnis des italienisch-amerikanischen Kaffees besteht darin, dass der Espresso vor dem Wasser seinen Weg in die Tasse findet.Danach wird das heiße Wasser dazu gegossen – möglichst langsam und vorsichtig, damit die Crema des Espressos erhalten bleibt. Fertig ist der Cafe Americano! Idealerweise schmeckt dieser so aromatisch und vollmundig wie ein Espresso, ist jedoch auch für weniger hartgesottene Kaffeetrinker gut verträglich und genießbar."
