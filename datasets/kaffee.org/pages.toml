["https://kaffee.org/kaffeeautomat-kaffeevollautomat"]
title = "Kaffeevollautomat: Kaffee auf Knopdruck  |  kaffee.org"
full_description = "Kaffeeautomaten sind Allroundmaschinen, die auf Wunsch Cappuccino, Espresso, Milchkaffee, Latte Macchiato, Café Crème oder auch Kaffee nach dem bisherigen Filterprinzip herstellen. Kaffeevollautomaten zeichnen sich durch Herstellung eines besonders aromatischen Kaffees aus. Bei herkömmlichen Kaffeemaschinen besteht die Gefahr, dass aufgrund des fehlenden Drucks bei der Kaffeezubereitung zu viele Bitterstoffe in den Kaffee gelangen. Dagegen wird der Brühvorgang bei einem Kaffeevollautomaten sehr kurz gehalten, wodurch weniger Koffein, Gerbsäuren und Bitterstoffe im Kaffee vorhanden sind. Zudem speichert die erzeugte Crema das Aroma, das sie allmählich an den Kaffee abgibt. Eine beständige Crema verbessert somit den Kaffeegeschmack. Die Herstellung von Espresso erfordert die Erzeugung eines besonders hohen Drucks durch einen Kaffeevollautomaten, um das typische Aroma aufzubauen. Die erste Filterkaffeemaschine („Wigomat“) ließ sich der Erfinder Gottlob Widmann im Jahr 1954 patentieren. Einen Kaffeevollautomaten mit integrierter Kaffeemühle entwickelte ab 1960 der Berliner Otto Bengtson. Der Schweizer Ingenieur Arthur Schmed entwarf 1980 den ersten mit Drucktechnik arbeitenden Prototypen einer vollautomatischen Kaffeemaschine, die 1985 als Weltneuheit präsentiert wurde. Nachdem Kaffeevollautomaten zunächst nur im betrieblichen Bereich Verwendung fanden, stehen heute für Unternehmen, Gastronomie und Privathaushalte unterschiedlichste Kaffeevollautomaten zur Verfügung. Im Jahr 2012 wurden in Deutschland nahezu 700.000 Kaffeevollautomaten verkauft. Marktführer ist die Firma De’Longhi, die gemeinsam mit den nachfolgenden Mitbewerbern Saeco und Jura auf einen Marktanteil von etwa drei Vierteln kam. Andere renommierte Hersteller von Kaffeevollautomaten sind Melitta, Miele, Siemens, Cafina, Bosch, Thermoplan, HGZ, Egro, Solis, Nivona, Schaerer und Franke. Anders als herkömmliche Filtermaschinen bestehen Kaffeevollautomaten aus den drei Komponenten Mahlwerk, Durchlauferhitzer und Brühgruppe. Letztere stellt den zentralen Funktionsbereich eines Kaffeevollautomaten dar. Nachdem die Kaffeebohnen durch den Vollautomaten gemahlen wurden, wird das Kaffeepulver zusammengepresst. Das erhitzte Wasser läuft sodann unter Druck durch das Kaffeepulver und sorgt auf diese Weise für eine trinkfähige Kaffeeportion. Die Einstellung einer individuell wählbaren Menge des Kaffeepulvers entscheidet über die Stärke des Kaffees. Kaffeevollautomaten mit einem einzigen Heizkreislauf müssen vor der Milchschaumzubereitung abkühlen, da der Schaum ansonsten zu heiß hergestellt würde. Automaten mit zwei Heizkreisläufen können gleichzeitig Milchschaum und Kaffee herstellen."
year_published = 2023
