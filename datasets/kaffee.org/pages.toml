["https://kaffee.org/eiskaffee-varianten"]
title = "Eiskaffee: Kühler Koffeingenuss mit zahlreichen Varianten  |  kaffee.org"
full_description = "Von wegen kalter Kaffee – Eiskaffee ist ein Klassiker, der jeden Sommer ein Comeback erlebt. Als Caffè freddo wird er in Italien traditionell als mit eiskaltem Wasser verlängerter, oftmals gesüßter Espresso, als Café frappé in Griechenland und auf Zypern als kalt aufgeschäumter Kaffee mit Eisstückchen serviert. Und auch wenn heute gerne mal auf fertig gemischte Pulvertütchen zurückgegriffen wird – ein selbst zubereiteter Eiskaffee ist ein Genuss, der die kleine Mühe durchaus wert ist! Die wohl einfachste, klassische Form der Zubereitung ist, einen Filterkaffee zu kochen, diesen erkalten zu lassen und dann wahlweise mit Milch anzureichern oder zusätzlich mit Zucker zu süßen. Für die italienische Variante kann der Kaffee natürlich durch Espresso ersetzt werden. Eisdielen servieren häufig ein oder zwei Kugeln Vanilleeis statt Eiswürfel im kühlen Kaffee. Beim Verfeinern des selbst gezauberten Erfrischungsgetränks sind der Phantasie aber keine Grenzen gesetzt: Ob mit einem Schuss Haselnuss-, Zimt- oder Walnusssirup oder auch einem Kaffee- oder Sahnelikör – der Eiskaffee bietet Raum für unzählige Geschmacksvariationen. Für den sogenannten Schwarzwälder Eiskaffee gibt man in den kalten Filterkaffee neben Zucker und Vanilleeis noch einen guten Schuss Kirschwasser. Aber auch moderne Klassiker der Kaffeekultur lassen sich in ein sommerlich-erfrischendes Koffeingetränk verwandeln, wie zum Beispiel Latte Macchiato. Hierzu gibt man 150 Milliliter Vanilleeis und die gewünschte Menge kalte Milch, sowie einen Esslöffel Zucker in ein hohes Glas. Eine Tasse Espresso über einen Löffel dazu schütten und nach Belieben mit Kakao- oder Schokostreuseln garnieren und schon ist der Sommertag gerettet. Oder wie wäre es mit einem flambierten Eiskaffee für den Abend? Hierzu einfach Kaffee aufbrühen und Vanillezucker zugeben. Den erkalteten Kaffee über einige Kugeln Vanilleeis in ein Glas gießen, hochprozentigen Rum oder Cognac mit Würfelzucker erhitzen, anzünden und über den Kaffee gießen. Auch mit Haselnuss- oder Stracciatellaeis schmeckt diese hochprozentige Eiskaffee-Variante."
