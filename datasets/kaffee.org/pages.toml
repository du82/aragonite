["https://kaffee.org/veganer-cappuccino"]
title = "Pflanzliche Milch: Welche Milchalternativen gibt es?  |  kaffee.org"
full_description = "Ob Milchkaffee, Cappuccino oder Latte Macchiato, viele populäre Kaffeegetränke werden mit aufgeschäumter Milch gekrönt. Für diejenigen, die ihren Kaffee vegan konsumieren und deshalb einen Milchersatz für ihren Kaffee benötigen, haben wir ein paar pflanzliche Milchalternativen ausprobiert.Vor allem in der veganen oder laktosefreien Ernährung dienen Getreide-, Soja- oder Nussmilch als Auswahlmöglichkeit. Wir haben die verschiedenen Milchalternativen ausprobiert, um zu sehen, wie diese sich im Cappuccino verhalten. Für unseren Vergleich haben wir alle Milchalternativen erhitzt, aufgeschäumt und unseren Cappuccino zubereitet. Haferdrink ist eine der Getreidedrinksorten und wird aus fermentiertem Getreide hergestellt. Aufgrund der produktionsbedingten Umwandlung von Stärke in Einfachzucker hat Hafermilch einen leicht süßen Geschmack. Durch seinen starken Hafergeschmack ist sie nicht jedermanns Sache. Bei einem Cappuccino ist der Getreidegeschmack nur minimal, und er hinterlässt einen süßlichen Geschmack. Der Espresso wird etwas unterdrückt, leichtere Röstungen verschwinden schnell ganz. Auf der anderen Seite schäumt die Hafermilch sehr gut auf und ist wirklich gute Alternative! Sojadrink ist ein pflanzliches Getränk, welches aus Sojabohnen hergestellt wird. Soja ist reich an Ballaststoffen, besteht zu 36% aus Eiweiß und ist daher eine sehr gute Eiweißquelle. Der Gehalt an Kohlenhydraten und Fetten ist geringer als der von Kuhmilch. Im Vergleich zu Kuhmilch enthält Sojamilch jedoch sowohl weniger Vitamin B2 als auch weniger Kalzium. Sojamilch hat einen erdigen geruch, schmeckt leicht nach Getreide und hat eine angenehm milde Süße, die auf den Herstellungsprozess zurückzuführen ist. Trotz ihres hohen Proteingehalts schäumt Sojamilch nur dezent gut auf. Bei einem Cappuccino verschwindet der Geschmack der Sojamilch praktisch. Der Cappuccino hat nicht mehr ganz so viel Aroma und wird zudem noch wässrig. Haselnussdrink hat einen starken Haselnussgeschmack, die Aromen der Haselnuss passen sehr gut zum Kaffee. Allerding ist die Schaumqualität eher schlecht: Flüssigkeit und Schaum trennen sich schnell. Haselnussdrink ist fettreich und kohlenhydratarm, im Gegensatz zu Getreidemilch haben Haselnussdrinks keine natürliche Süße. Aus diesem Grund wird hier oft Zucker zugesetzt, worauf Du beim Kauf achten solltest."
