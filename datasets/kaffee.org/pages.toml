["https://kaffee.org/kaffeebohnen-tests"]
title = "Kaffeebohnen Tests  |  kaffee.org"
full_description = "Wir von Kaffee.org haben uns der perfekten Tasse Kaffee verschrieben. Um das zu erreichen, sind nicht nur die Arten der Zubereitung von Bedeutung – weit gefehlt! Jede Kaffeebohne einer jeden Plantage auf dieser Welt hat ihren eigenen ganz charakteristischen Geschmack und unterschiedliche Eigenschaften. Es ist die hohe Kunst der Röster und Kaffeebauern aus einer Bohne das Höchstmaß an Qualität herauszupressen. Da wird schon mal mit allerlei Fachbegriffen umhergeworfen. Von Arabica und Robusta über Fermentation und Säuren im Kaffee; Wer den Durchblick behalten will, muss sich in die Materie einlesen. Hier auf Kaffee.org gibt es sämtliche wichtigen Infos kompakt für euch zusammengefasst, mit weiterführenden Tests für all eure Lieblingskaffeesorten.Wie laufen unsere Kaffeebohnen-Tests ab?Keine Kaffeebohne ist wie die andere. Jede Sorte schmeckt unterschiedlich, jede Kaffeebohneen-Test ist ein neues Abenteuer. Auch wenn wir schon Jahre dabei sind, ist der Moment, wenn der Postbote ein neues Kaffee-Päckchen bringt, immer noch ein ganz besonderer. Wir geben uns besondere Mühe, euch umfassende Testberichte zu erstellen. Doch wie gehen wir dabei vor?Testkriterium #1: Erster Eindruck – Verpackung & DesignKlar, wenn es um die Qualität des Kaffees geht, ist das Design eher nebensächlich. Doch die Art der Verpackung ist es, die einiges zur Qualität beisteuert. In einer Vakuumverpackung halten sich Kaffeebohnen einfach deutlich länger und sind schön aromatisch. Wenn wir aber ehrlich sind, haben wir alle schon einmal Produkte nur aufgrund eines augenfälligen Designs in den Einkaufskorb gelegt. Ein Kaffee in schicker Holztrommel, wie zum Beispiel unser Fritz Minges aus Peru, macht schließlich mehr her als in der zigsten Plastikverpackung. Hinzu kommt, dass sich auf der Packung wichtige Zusatzinformationen befinden. Gütesiegel, Informationen zur Kaffeemischung, dem Anbauort und der gesamten Wertschöpfungskette – das wird von Packung zu Packung unterschiedlich gehandhabt.Testkriterium #2: Aroma der KaffeebohnenAus der Packung und rein ins Vergnügen ist unsere Devise. Das Kaffeearoma bei geöffneter Packung gibt schon mal einen ersten Einblick darin, was uns später erwartet. Ob intensiv oder sanft, stark oder mild lässt oft sich sofort erkennen. Doch viel wichtiger als das Urteil unserer Nase ist natürlich das, was unsere Geschmacksnerven dazu sagen. Ist der Kaffee zu bitter? Welche Geschmacksnoten schmecken wir heraus? Hier trennt sich meist die Spreu vom Weizen. Bei Espresso-Bohnen greifen wir zunächst zu einer kleinen Siebträger-Maschine. Hier fließen besonders noch der Wachfaktor und die Cremabildung mit in die Bewertung ein. Danach wandern die Bohnen in einen Vollautomaten. Schließlich wollen die gängigen Kaffee-Variationen, wie Kaffee, Cappuccino, Latte Macchiato und Co auch getestet werden. So garantieren wir euch ein umfassendes Testergebnis, das alles miteinbezieht, was heutzutage in Sachen Kaffee getrunken wird. Je nach Art der Bohne wandert der Kaffee – frisch gemahlen – dann auch nochmal durch die Filtermaschine oder den Dripper. Mit dieser Herangehensweise versuchen wir, das Beste aus jedem Kaffee herauszuholen und unsere Kaffee-Empfehlungen perfekt auf die Bedürfnisse des Einzelnen abzustimmen.Testkriterium #3: Herkunft & PreisLast but not least werden von uns noch Informationen zur Herkunft des Kaffees sowie sein Preis in die Bewertung miteinbezogen. Natürlich wird hier darauf geachtet, ob es ein teurer Premiumkaffee oder ein Produkt aus dem Supermarkt ist. Für hohe Qualität ist der Kunde schließlich auch bereit mehr zu zahlen. Ein weiterer Punkt, der immer wichtiger wird, ist die Herkunft. Schließlich ist der Geschmack des Kaffees eng mit seinem Herkunftsland verbunden, genauso wie die Arbeitsbedingungen der Bauern eine ethische Rolle bei der Kaufentscheidung spielen. Bio, Fairtrade und Produktionsbedingungen sind für anspruchsvolle Kaffeegenießer also keine Fremdwörter. Wir geben auf all diese Aspekte Acht und sorgen so für einen umfassenden Testbericht. Um euch den Einstieg etwas leichter zu machen, haben wir im Folgenden schon einige allgemeine Informationen zu Kaffeebohnen zusammengestellt. Viel Spaß beim Lesen!„Warum testet ihr auch Robusta-Mischungen?“ – Welche Kaffeesorten gibt es und wie schmecken sie?Wir alle haben bestimmt schon mal im Supermarkt vor dem Kaffeeregal gestanden und uns gefragt: „100 Prozent Arabica-Mischung… Was bedeutet das eigentlich?“. Die Antwort ist eigentlich ganz einfach. Auf dem Kaffeemarkt wird hauptsächlich zwischen zwei Bohnensorten unterschieden: Arabica und Robusta. Das sind eigentlich Pflanzenarten, die aber in ihren Früchten (auch Kaffeekirschen genannt) das Objekt unserer Begierde tragen – die Kaffeebohnen. Insgesamt gibt es sogar über 60 Kaffeesorten, doch nur Arabica und Robusta sind für den Weltmarkt von Bedeutung. Ganze 70 Prozent des Marktes machen momentan die Arabicabohnen aus, Robusta verteidigt eisern die übrigen 30 Prozent. Äußerlich lassen sich die Bohnen relativ einfach unterscheiden. Während die Arabicabohnen einen geschwungenen Schnitt in der Mitte aufweisen, sind die etwas kleineren und rundlicheren Robustabohnen mit einem geraden Schnitt ausgestattet. Arabica-Bohnen zeichnen sich durch eine reichhaltigere Geschmacksvielfalt aus, da sie doppelt so viele Chromosomen besitzen wie ihre Verwandten. Dementsprechend schmecken Robustabohnen in der Regel holziger und erdiger, sind dafür aber doppelt so koffeinhaltig. Deshalb sind diese Bohnen auch so beliebt für Espressomischungen. Allerdings heißt das nicht, dass Arabicamischungen von Haus aus besser sind. Gerade die Billigkaffeesorten im Supermarkt weißen zwar oftmals auf 100 Prozent Arabica hin, doch „Arabica“ bedeutet nicht automatisch gut, sowie „Robusta“ nicht sofort mit „schlecht“ gleichzusetzen ist – deswegen sind wir in unseren Tests für alle Varianten und Mischungen offen.Wie wird der Kaffee angebaut?Interessanterweise ähnelt der Kaffeeanbau in einigen Aspekten dem Weinanbau. Hier wie dort spielen Klima, Erntemethode und Terroir eine große Rolle. Besonders gut lässt sich Kaffee in den äquatornahen Ländern anbauen, mit einem ausgeglichenen Klima sowie ausreichend Niederschlag und viel Schatten. Die Beschaffenheit des Bodens (Terroir) bestimmt, wie sauer und nährstoffreich schlussendlich der Kaffee wird. Ein auf Vulkanböden angebauter Kaffee in Äthiopien wird nie genauso schmecken wie der zum Teil in Küstennähe geerntete Kaffee Brasiliens. Arabicakaffees werden meist in Höhen von etwa 600 bis 1000 Meter angebaut, Robusta liegen mit 300 bis 600 Meter deutlich darunter. Teilweise liegen Plantagen sogar noch deutlich darüber oder darunter. Grundsätzlich gilt: Desto höher die Anbaulage, desto langsamer wachsen die Kaffeekirschen und weisen ausgeprägtere Aromen auf. Im Gegensatz zu den Arabicapflanzen, sind die Robusta sehr widerstandsfähig gegen Fressfeinde, Parasiten, Krankheiten und höhere Temperaturen. Ihren Namen haben sie also nicht von ungefähr. Welcher Kaffee wem zusagt, ist im vornherein schwer zu bestimmen. Hier hilft leider nur selbst auszuprobieren, welche Kaffeesorte aus welchem Land die richtige ist. Einzigartig sind sie alle, doch wir hoffen mit unseren Kaffeebohnen Tests etwas Klarheit in die Welt der Kaffeesorten zu bringen. Wichtig: Gebt verschiedenen Kaffees eine Chance und vergleicht die Sorten!Fermentierung bei Kaffeebohnen – gehört das nicht zum Wein?Kurz gesagt, ist Fermentierung die Umwandlung organischer Stoffe, die mithilfe von Biotechnologie angeregt wird. Keine Sorge, das ist weder Science Fiction noch läuft jemand in Gefahr, toxische Gase in die Luft zu blasen. Mithilfe von Bakterien-, -Pilz- oder Zellkulturen sowie dem Zusatz von Enzymen werden die Stoffe umgewandelt. Was man von Wein kennt, sorgt bei der Kaffeebohne dafür, dass Gerbstoffe abgebaut werden. Besonders bei der nassen Aufbereitung kommt diese Technik zum Einsatz. Hier wird die grob geschälte Bohne mittels Wasser fermentiert. Dadurch erhält der Kaffee eine präsente Säure sowie einen lebhaften Geschmack. Der Prozess beeinflusst also maßgeblich die Qualität des Kaffees, den wir später in unseren Tassen sehen wollen.Acrylamid und Maltrodextrin – ist Kaffee gesundheitsschädlich?Mit 150 getrunkenen Litern im Jahr pro Einwohner ist der Kaffee das beliebteste Getränk Deutschlands. Noch vor Bier oder Mineralwasser! Da ist es nur natürlich, dass wir keine toxischen und schädigenden Stoffe in unserer Tasse finden wollen. Acrylamid gilt gemeinhin als krebserregend und erbgutschädigend. Zumindest haben das Tierversuche nahegelegt, weswegen es seit einigen Jahren EU-Richtlinien für den Acrylamid-Gehalt im Kaffee gibt. Diese entstehen während des für den Kaffee unerlässlichen Röstvorgangs. In großen Trommeln zerfallen Kohlenhydrate und Eiweiße, wodurch sich die gewünschten Röstaromen bilden. Leider eben auch Acrylamid. Hier gibt es gute Neuigkeiten für die Kaffeeconnaisseure unter uns. Qualitätskaffee wird schonend bei niedrigen Temperaturen geröstet – da hat Acrylamid kaum Chancen! Ganz im Gegensatz zu billigem Supermarktkaffee, was Tests bewiesen haben. Weil wir weder uns noch euch vergiften wollen, achten wir bei unseren Kaffeebohnen Tests natürlich darauf, dass der Acrylamid-Gehalt in den Bohnen möglichst niedrig ist.Etwas ganz besonderes haben sich die Hersteller vor allem bei Billigkaffeesorten einfallen lassen. Sie strecken den Kaffee mit Zusatzstoffen, wie Karamell oder eben Maltrodexin. Oftmals reduziert sich der Kaffeeanteil um bis zu 12 Prozent! Oft werden diese Kaffees mit der Aufschrift „Melange“ beworben und sind laut Produzenten geschmacklich obenauf, da durch Zucker die Bitterstoffe neutralisiert werden. In Wirklichkeit sparen sie bloß Rohstoffe und Steuern, da weniger Kaffee importiert werden muss. Beim Kauf solltet ihr also unbedingt auf die Kennzeichnung der Verpackung achten. Sind Zuckerzusätze vermerkt, handelt es sich um eine solche „Melange“-Mischung. Qualität geht anders. Gesundes genießen ebenso.Bio, Fairtrade, trallala – im Dschungel der Siegel und AuszeichnungenDer Biomarkt ist groß im Kommen. Immer mehr Unternehmen und Lebensmittelproduzenten schwenken auf umweltbewusstere Herstellung um. Die Nachfrage steigt also und das Angebot zieht nach. Ähnlich sieht es mit dem Kaffee aus. Da dieser meist in ärmeren Dritte Welt Staaten angebaut wird, sind ähnliche Probleme gegeben wie in der Textil- oder Holzindustrie. Die Bauern werden mit einem Hungerlohn abgespeißt, der wahre Gewinn liegt bei den Großunternehmen. Die Konsumenten legen jedoch immer größeren Wert auf faire Anteile für jedermann und sind bereit, höhere Preise zu bezahlen. Bei einem mit dem Bio-Siegel zertifizierter Kaffee ist die gesamte Wertschöpfungskette überprüft worden. Die Kosten dafür belaufen sich auf ca. 3000 Euro. Viele Firmen gehen jedoch noch weiter, als es die gesetzlichen Vorgaben vorschreiben. Die Kaffeekooperative beispielsweise – die noch strengere Quaitätsmerkmale einhält – gibt ihrem Kaffee mit „Fairtrade Plus“ ganz einfach ein eigenes Siegel. Für einen genauen Überblick über die Leistungen hinter der Bohne, solltet ihr euch die Unternehmensseite genau ansehen. Die meisten Röstereien geben einen detaillierten Einblick in ihre Auswahlkriterien und deren Produktionswege. Vielen Röstereien ist eine Zertifizierung schlichtweg zu teuer, was aber nicht heißt, dass sie nicht trotzdem auf demselben Niveau arbeiten."
year_published = 2025
