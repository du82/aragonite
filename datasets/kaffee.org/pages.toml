["https://kaffee.org/wiener-kaffee-die-kaffeehauskultur-oesterreichs"]
title = "Wiener Kaffee - die Kaffeehauskultur Österreichs  |  kaffee.org"
full_description = "Wiener Kaffee – zwei Worte, die dem Kaffeekenner ein Lächeln entlocken. Kein anderes Land Europas kann sich mit solch einer traditionsreichen Kaffeekultur brüsten wie Österreich. Dessen atemberaubende Hauptstadt Wien ist nämlich nicht nur für das Wiener Schnitzel, sondern auch für Wiener Kaffee bekannt. Dank der traditionsreichen Kaffeehauskultur Wiens sind in Österreich viele verschiedene Kaffeespezialitäten entstanden. Damit ihr bei eurem nächsten Wien-Trip bei dem riesigen Kaffeeangebot nicht Überblick verliert, wollen wir Euch kurz mit den Wiener Kaffeespezialitäten vertraut machen. Die Wiener Kaffeehäuser bieten eine solche Vielfalt, dass es schwerfällt, sich hier für eine der leckeren Kaffeevarianten zu entscheiden. Hier ein kleiner Überblick zu den beliebtesten Wiener Kaffeespezialitäten, die übrigens traditionell mit einem Glas Wasser serviert werden. Die Basis aller Wiener Kaffeespezialitäten ist der Mokka. Dabei handelt es sich um einen schwarzen Kaffee ohne Zucker oder Milch. Klassisch wird er in einer Seihkanne oder auch Karlsbader Kanne gefiltert. In modernen Kaffeehäusern bekommt man ihn inzwischen aus der Espressomaschine. Wird in Wien ein Mokka bestellt, wird er als sogenannter Kleiner Schwarzer serviert. Ist er mit heißem Wasser gestreckt, nennt man ihn einen Verlängerten Schwarzen. Der Große Schwarze ist nichts anderes als ein doppelter Kleiner Schwarzer, der in einer dementsprechend größeren Schale serviert wird. Ein Kleiner Brauner ist schlicht ein einfacher Mokka, der mit Schlagsahne verfeinert in einer kleinen Schale serviert wird. Ebenso wie den Kleinen Schwarzen, gibt es auch den Kleinen Braunen als verlängerte Version mit heißem Wasser. Der Große Braune ist das etwas größere Pendant zum Kleinen Braunen – hier wird ein doppelter Mokka mit Schlagsahne zubereitet. Der Franziskaner ist eine Wiener Kaffeespezialität aus einem etwas verlängerten Mokka mit warmer Milch und Schlagsahne. Diese Zubereitung wird in einer großen Schale serviert."
year_published = 2023
clearnet = "https://kaffee.org/wiener-kaffee-die-kaffeehauskultur-oesterreichs"
tags = ["aufgepasst:", "basis", "brauner", "brew", "bzw.", "cold", "dabei!", "dripster", "eigentlich", "einkreiser"]
