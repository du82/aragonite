["https://kaffee.org/espressokanne"]
title = "Espressokanne  |  kaffee.org"
full_description = "Die Espressokanne, italienisch auch „Caffettiera“, ist eine klassische Herdkanne für eine unkomplizierte Kaffeezubereitung auf allen Herdarten – mittlerweile sogar auf Induktionsgeräten. Die traditionell aus Aluminium gefertigte Espressokanne wurde 1933 von dem Italiener Alfonso Bialetti entwickelt, kam aber erst nach 1945 auf den Markt. Der deutsche Name dieses Kochers ist allerdings irreführend, da man aufgrund des zu geringen Drucks bei der Zubereitung keinen Espresso mit einer feinen Crema erhält, sondern „nur“ normalen Kaffee. Das wohl bekannteste Espressokannen-Modell von Bialetti hört auf den Namen „Moka Express“ – man erkennt sie an der typisch achteckigen Form und dem berühmten Bialetti-Schnurrbartmännchen. Die Besonderheit der Moka Express ist, dass sie als erste Kaffeemaschine durch das sogenannte „Perkolator-Prinzip“ funktioniert. Hierbei steigt das Wasser durch ein Metallröhrchen in den Filter auf und erhält dabei sein unvergleichliches Kaffee-Aroma. Mit weit über 200 Millionen verkauften Exemplaren ist die Moka Express von Bialetti der absolute Klassiker der Kaffeezubereitung und mit einem Preis von rund 20€ durchaus für jeden Kaffeeliebhaber erschwinglich. Wer es einfach und gut mag, wird diese Art der Kaffeezubereitung lieben – der Aufbau der klassischen Espressokanne ist tatsächlich kinderleicht. Den unteren Teil der Kanne bildet ein meist nach oben hin enger zulaufendes Wassergefäß, das nah am oberen Rand mit einem Sicherheitsventil versehen ist. Auf diesen unteren Kannenteil wird der trichterförmige Kaffeefilter aufgesetzt. Den dritten Teil bildet dann die Kanne mit eingefasstem Steigrohr, die auf den unteren Teil der Kanne geschraubt wird. Sobald das Wasser kocht, sprudelt es durch den mit Kaffeepulver gefüllten Trichter und wird dann als Kaffee durch das Steigrohr in die obere Kanne gepresst. Glücklicherweise muss man kein Barista sein, um einen perfekten Kaffee zu zaubern! Zunächst schraubt man die Kanne auseinander und entnimmt den Filtereinsatz, dann wird der untere Kannenteil ungefähr bis zum Ventil mit Wasser befüllt. Ein kleiner Tipp: Wer seinen Kaffee besonders mild mag, sollte das Wasser schon vor dem Einfüllen erhitzen – denn je mehr sich das Metall der Kanne auf dem Herd erhitzt, desto bitterer wird der Kaffee. Im nächsten Schritt setzt man den Trichtereinsatz wieder auf das Unterteil der Espressokanne und füllt das am besten frisch gemahlene Kaffeepulver locker bis zum Rand ein. Das Kaffeepulver sollte hierfür möglichst einen mittleren Mahlgrad besitzen – zwischen einem eher feinen Pulver für Espresso und einem groben Pulver für die Zubereitung mit der French Press. Für die perfekte, gleichmäßige Körnung des Pulvers empfiehlt sich hier eine Kaffeemühle mit einem Scheibenmahlwerk. Vom Tamper sollte man bei dieser Art der Zubereitung lieber die Finger lassen, da dieser das Pulver zu fest zusammenpressen würde und das Wasser somit nicht aufsteigen kann. Es genügt vollkommen, den gemahlenen Kaffee leicht, aber möglichst gleichmäßig mit den Fingern festzuklopfen. Das obere Teil wird jetzt wieder auf dem Kannenunterteil festgeschraubt – das Kaffeekochen kann beginnen. Den besten Geschmack erhält man hierbei, wenn man den Kaffee bei mittlerer Temperatur auf der Herdplatte erhitzt. Nun heißt es ganz genau hinhören: Gibt die Kanne blubbernde bzw. hüstelnde Geräusche von sich, ist der Kaffee gleich fertig und kann bereits von der Platte genommen werden. Vorsicht sei jedoch geboten, denn die Kanne kann sehr heiß werden. Der fertige Kaffee sollte nun zügig serviert werden, da die Resthitze der Kanne weiterarbeitet und der Kaffee somit bitter werden kann. Alternativ kann man das Unterteil der Kanne nach dem Kochen auch kurz „abschrecken“."
