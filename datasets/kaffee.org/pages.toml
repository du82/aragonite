["https://kaffee.org/kaffee-richtig-aufbewahren"]
title = "Kaffee richtig aufbewahren - 4 Tipps, wie ihr euren Kaffee frisch haltet  |  kaffee.org"
full_description = "Gesetzlich ist Kaffee zwar 12 Monate haltbar, grundsätzlich gilt aber: Mit jeder Stunde, die wir ausgegasten Kaffee lagern, verliert er ein bisschen mehr seines Aromas. Für Kaffeefans wie uns ist das der absolute Albtraum. Aber: Wenn man weiß, wie Kaffee verpackt und gelagert werden sollte, kann man den Aromenverlust ein wenig hinauszögern. Hier deshalb unsere 4 Tipps, wie ihr euren Kaffee möglichst lange frisch haltet. Röstfrisch? Röstfrisch! Als echter Kaffeeliebhaber gibt man sich nicht mit Kaffee zufrieden, der schon seit Wochen, wenn nicht sogar Monaten im Regal einstaubt. Deshalb sollte man immer aufs Röstdatum achten. Den optimalen Geschmack haben Kaffeebohnen vier bis fünf Tage, nachdem sie geröstet wurden. Kommen die Kaffeebohnen gerade frisch aus der Rösttrommel, müssen sie erst noch einige Tage „ausgasen“, weil der Kaffee sonst bitter schmeckt. An der Stelle ein kleiner Tipp: Wie frisch die Bohnen sind, kann man an der Schaumkrone erkennen. Denn: Ist noch ein bisschen CO2 in den Bohnen, das mit dem Wasser reagiert, entsteht ganz automatisch eine schöne Crema. Ist die Schaumkrone dagegen dunkel und dünn, enthält der Kaffee so gut wie kein CO2 mehr und wurde schon zu lange gelagert. Heißt also: Wenn die Bohnen nach vier bis fünf Tagen genug CO2 abgegeben und ihre Geschmacksaromen entfaltet haben, tickt auch schon die Uhr. Fürs volle Aroma sollte man Kaffee innerhalb der ersten vier bis acht (aller spätestens zwölf) Wochen nach der Öffnung verbrauchen. Vorgemahlenen Kaffee sollte man sogar spätestens 14 Tage nach Anbruch der Packung verbraucht haben. Womit wir auch schon bei unserem zweiten Tipp wären... Gemahlener Kaffee verliert deutlich schneller seinen Geschmack als ganze Bohnen. Kein Wunder, schließlich dient die Bohne als natürliche „Aroma-Schutzkapsel“, wohingegen nach dem Mahlen das Aroma in der gesamten Umgebung verströmt. Der Grund dafür ist eigentlich ganz simpel: Kaffee verliert an Geschmack, wenn er mit Sauerstoff in Kontakt kommt. Wird der Kaffee gemahlen, vergrößert sich seine Oberfläche um ein Vielfaches. Dadurch wird der sog. Oxidationsprozess beschleunigt , weil man dem Sauerstoff mehr Angriffsfläche bietet und das Kaffeemehl schneller Feuchtigkeit aufnimmt als ganze Bohnen. Wir empfehlen deshalb, den Kaffee immer frisch zu mahlen. Hier heißt es: Lieber einmal zu viel mahlen als zu wenig. Eine Faustformel besagt, dass der gemahlene Kaffee schon in den ersten 40 Minuten die Hälfte seines Aromas verliert. Also am besten nur so viel Kaffee mahlen, wie man dann auch wirklich verbraucht."
year_published = 2023
clearnet = "https://kaffee.org/kaffee-richtig-aufbewahren"
