["https://kaffee.org/kaffeemaschine-entkalken"]
title = "Kaffeemaschine mit Hausmitteln entkalken - so gehts!  |  kaffee.org"
full_description = "[toc]Die Tasse Kaffee gehört für viele Personen zum täglichen Morgenritual. Doch auch eine Kaffeemaschine benötigt Pflege und sollte regelmäßig entkalkt und gereinigt werden. Denn ohne Entkalken gibt es keinen geschmacklich perfekten Kaffee und feuchte Kaffeereste sind außerdem ein idealer Nährboden für Schimmel und andere Keime. Zunächst ist es wichtig, dass die Essigessenz mit Wasser im Verhältnis 1:4 verdünnt wird. Denn unverdünnt und hoch konzentriert kann sie Gummidichtungen und anderen empfindlichen Teilen in der Maschine schaden. Hast du die Essigessenz verdünnt, gib sie diese in den Wasserbehälter der Kaffeemaschine, lasse sie kurz einwirken und starte den Entkalkungsvorgang nach den Vorgaben des jeweiligen Herstellers. Wichtig ist, dass du nach dem Entkalken noch 2-3 mal Wasser durch die Maschine laufen lässt, damit der nächste Kaffee nicht nach Essig schmeckt. Etwas Zitronensaft über einem Schwamm auspressen. Mit dem Schwamm kannst du dann über Kalkablagerungen wischen, das ganze ca. 30 Minuten einwirken lassen und dann feucht abwischen. Anschließend ist es wichtig, den Zitronensaft durch ein Sieb zu geben, damit kein Fruchtfleisch in die Maschine gelangt. Jetzt kannst du den Saft einer ganzen Zitrone mit ca. einem Liter Wasser verdünnen und die Mischung anschließend in den Wassertank geben. Ist die Entkalkung beendet, denke auch hier daran die Kaffeemaschine noch 2-3 mal mit Wasser zu spülen. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung. Als engagierter Kaffeekenner achtet Luca auch auf Nachhaltigkeit und ethischen Konsum. Er widmet sich Themen wie fairem Handel, umweltfreundlichen Anbaumethoden und unterstützt lokale Kaffeebauern und -produzenten."
