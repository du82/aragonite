["https://kaffee.org/pressstempelkanne"]
title = "Kaffeezubereitung in der Pressstempelkanne  |  kaffee.org"
full_description = "Mit einer sogenannten Pressstempelkanne, auch unter French Press bekannt, kann man in relativ kurzer Zeit traditionell Kaffee herstellen, ohne elektronische Unterstützung. Hier eine kleine Anleitung zum Kaffeegenuss, der französischen Art: Kaffee mahlenAnders als bei anderen Kaffeemaschinen, muss bei einer French Press der Mahlgrad vergleichsweise grob ausfallen. Ungefähr vergleichbar mit der Salzkorngröße von grobem Meersalz. Der Effekt: Das Aroma wird langsamer an das Wasser abgegeben. Richtige Menge Pulver bestimmenDie Menge des Kaffeepulvers ist ganz entscheidend. Wir würden ca. 8 gehäufte Esslöffel bei 1 Liter Wasser empfehlen. Wasser einfüllen und UmrührenWichtig ist es vor allem, dass kein frisch kochendes Wasser eingegossen wird. Also ruhig nachdem Erhitzen ein paar Minuten warten. Nach dem Einfüllen umrühren, damit sich das Pulver gleichmäßig im Wasser verteilt. Deckel draufZirka 4 Minuten ziehen lassen, damit sich das Aroma gut verteilt. In etwa vergleichbar mit der Zubereitung von Tee. Dadurch, dass das Kaffeepulver sich frei im Wasser bewegen kann und nicht gefiltert wird, entwickelt sich ein authentisches und unverfälschtes Aroma. Siebstempel nach unten drückenMit dem Siebstempel wird der schwimmende Kaffeesatz auf den Boden der Kanne gedrückt. Es gilt dabei langsam und gleichmäßig vorzugehen, damit der Kaffee nicht oben überläuft. Kaffee servierenDen Kaffee möglichst schnell servieren, da das Pulver weiterhin Aroma- und vor allem Bitterstoffe abgibt und der Kaffee nach zu langer Zeit schlichtweg ungenießbar wird. Unter fließendem Wasser die Kanne ausspülenDadurch, dass sich neben Kaffeerückständen vor allem auch der Kaffeesatz als solcher noch in der Kanne befindet, sollte man diese nach Benutzung reinigen. Luca ist nicht nur ein talentierter Barista, sondern auch ein leidenschaftlicher Blogger, der es versteht, seine Liebe zum Kaffee in mitreißenden Artikeln zum Ausdruck zu bringen. Er nimmt die Leser mit auf eine Reise durch die Welt des Kaffees, stellt neue Röstereien vor, teilt seine neuesten Entdeckungen und gibt wertvolle Tipps zur perfekten Zubereitung."
year_published = 2023
