["https://kaffee.org/arabica-und-robusta-kaffee"]
title = "Arabica und Robusta Kaffee - Unterschiede und Gemeinsamkeiten  |  kaffee.org"
full_description = "Die Welt des Kaffees ist vielfältig und kompliziert. Der Kaffeetrinker kauft nicht mehr irgendein vorgemahlenes Produkt, lässt es durch eine Kaffeemaschine laufen und hält es stundenlang auf der Heizplatte warm. Kaffeetrinken ist Teil der Kulinarik. Das wandlungsfähige Getränk begleitet seine Anhänger in vielen Spezialitäten durch den Tag. Dennoch halten sich hartnäckige Vorurteile. Den meisten Kaffeefreunden sind die Arten Arabica und Robusta ein Begriff. Und die allermeisten Kaffeefreunde haben die Information gespeichert: Arabica gut, Robusta schlecht. Damit tun sie der Robusta Unrecht. Wer die Robusta ablehnt, handelt ebenso ungerecht wie ein Weinkenner, der die Syrah-Traube der Mourvedre vorzieht. Aber es gibt schlechte Syrah- und gute Mourvedre-Weine. Und es gibt eine Menge guter Mischungen. Zwischen Arabica und Robusta ist optisch schnell unterschieden. Robusta-Bohnen sind klein, braun, rundlich. Sie zeigen einen offenen Schlitz. Arabica-Bohnen sind länglich, grünlich-braun, mit geschlossenerem Schlitz. Ebenso deutlich wie die optische Unterscheidung gelingt die Differenzierung von Aroma und Geschmack. Die Robusta kommt aus dem Tiefland, und das merkt man ihr an: ihrem erdigen, satten Geschmack und dem geringen Säurespiel des aufgegossenen Getränks. Arabica, der ‚Hochland-Kaffee‘, besitzt gut eingebundene Säuren; sein Geschmack wird als süßlich, klar, leicht und rund definiert. Auch hier darf der Wein-Vergleich bemüht werden: Ein deutscher Riesling entwickelt sein feines Säurespiel im Wechsel aus warmen Tagen und kalten Nächten. Und dennoch gibt es schlechte Riesling-Weine und interessante Tropfen aus hitzeresistenteren Traubenarten. Arabica und Robusta unterscheiden sich hinsichtlich Koffeingehalt und Verträglichkeit. Die Chlorogensäure, ein Inhaltsstoff jeder Kaffeebohne, liegt bei der Robusta um 30 % höher. Chlorogensäure kann Sodbrennen und Magenschmerzen verursachen. Hinzu kommt der höhere Koffeingehalt aller Robusta-Kaffees. Die Folgen erhöhten Robusta-Konsums stellen sich erst ein, nachdem der Kaffee getrunken wurde: Unverträglichkeits-Gefühl, erhöhte Herzfrequenz, Schweißausbrüche, Harndrang. Dass die Robusta einen höheren Gehalt an Alkaloiden aufweist, kann schon bei der Verkostung festgestellt werden: Sie schmeckt kräftiger, bitterer und besitzt einen scharfen Abgang. Die Bohne aus dem Tiefland ist eine typische Beimischung zum Espresso und Schümli. Sie macht den Geschmack markanter und sorgt für mehr Crema. Wer einmal einen 100 % Robusta-Kaffee probiert hat, wird ihn in allen Mischungen wiedererkennen."
year_published = 2023
clearnet = "https://kaffee.org/arabica-und-robusta-kaffee"
