/streams/upgrade-guide">9.6 Upgrade Guide</a></li> </ul> </li> </ul> You're viewing documentation for an older version of Kafka - check out our current documentation here. Documentation Kafka 3.5 Documentation Prior releases: 0.7.x, 0.8.0, 0.8.1.X, 0.8.2.X, 0.9.0.X, 0.10.0.X, 0.10.1.X, 0.10.2.X, 0.11.0.X, 1.0.X, 1.1.X, 2.0.X, 2.1.X, 2.2.X, 2.3.X, 2.4.X, 2.5.X, 2.6.X, 2.7.X, 2.8.X, 3.0.X, 3.1.X, 3.2.X, 3.3.X, 3.4.X. 1. Getting Started 1.1 Introduction /* Licensed to the Apache Software Foundation (ASF) under one or more contributor license agreements. See the NOTICE file distributed with this work for additional information regarding copyright ownership. The ASF licenses this file to You under the Apache License, Version 2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain a copy of the License at http://www.apache.org/licenses/LICENSE-2.0 Unless required by applicable law or agreed to in writing, software distributed under the License is distributed on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for the specific language governing permissions and limitations under the License. */ // Define variables for doc templates var context={ "version": "35", "dotVersion": "3.5", "fullDotVersion": "3.5.2", "scalaVersion": "2.13" }; <h4 class="anchor-heading"> <a class="anchor-link" id="intro_streaming" href="#intro_streaming"></a> <a href="#intro_streaming">What is event streaming?</a> </h4> <p> Event streaming is the digital equivalent of the human body's central nervous system. It is the technological foundation for the 'always-on' world where businesses are increasingly software-defined and automated, and where the user of software is more software. </p> <p> Technically speaking, event streaming is the practice of capturing data in real-time from event sources like databases, sensors, mobile devices, cloud services, and software applications in the form of streams of events; storing these event streams durably for later retrieval; manipulating, processing, and reacting to the event streams in real-time as well as retrospectively; and routing the event streams to different destination technologies as needed. Event streaming thus ensures a continuous flow and interpretation of data so that the right information is at the right place, at the right time. </p> <h4 class="anchor-heading"> <a class="anchor-link" id="intro_usage" href="#intro_usage"></a> <a href="#intro_usage">What can I use event streaming for?</a> </h4> <p> Event streaming is applied to a <a href="/powered-by">wide variety of use cases</a> across a plethora of industries and organizations. Its many examples include: </p> <ul> <li> To process payments and financial transactions in real-time, such as in stock exchanges, banks, and insurances. </li> <li> To track and monitor cars, trucks, fleets, and shipments in real-time, such as in logistics and the automotive industry. </li> <li> To continuously capture and analyze sensor data from IoT devices or other equipment, such as in factories and wind parks. </li> <li> To collect and immediately react to customer interactions and orders, such as in retail, the hotel and travel industry, and mobile applications. </li> <li> To monitor patients in hospital care and predict changes in condition to ensure timely treatment in emergencies. </li> <li> To connect, store, and make available data produced by different divisions of a company. </li> <li> To serve as the foundation for data platforms, event-driven architectures, and microservices. </li> </ul> <h4 class="anchor-heading"> <a class="anchor-link" id="intro_platform" href="#intro_platform"></a> <a href="#intro_platform">Apache Kafka&reg; is an event streaming platform. What does that mean?</a> </h4> <p> Kafka combines three key capabilities so you can implement <a href="/powered-by">your use cases</a> for event streaming end-to-end with a single battle-tested solution: </p> <ol> <li> To <strong>publish</strong> (write) and <strong>subscribe to</strong> (read) streams of events, including continuous import/export of your data from other systems. </li> <li> To <strong>store</strong> streams of events durably and reliably for as long as you want. </li> <li> To <strong>process</strong> streams of events as they occur or retrospectively. </li> </ol> <p> And all this functionality is provided in a distributed, highly scalable, elastic, fault-tolerant, and secure manner. Kafka can be deployed on bare-metal hardware, virtual machines, and containers, and on-premises as well as in the cloud. You can choose between self-managing your Kafka environments and using fully managed services offered by a variety of vendors. </p> <h4 class="anchor-heading"> <a class="anchor-link" id="intro_nutshell" href="#intro_nutshell"></a> <a href="#intro_nutshell">How does Kafka work in a nutshell?</a> </h4> <p> Kafka is a distributed system consisting of <strong>servers</strong> and <strong>clients</strong'''
