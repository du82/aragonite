full_description = "Apache Kafka More than 80% of all Fortune 100 companies trust, and use Kafka. Apache Kafka is an open-source distributed event streaming platform used by thousands of companies for high-performance data pipelines, streaming analytics, data integration, and mission-critical applications. Manufacturing 10 out of 10 Banks 7 out of 10 Insurance 10 out of 10 Telecom 8 out of 10 See Full List 10/10 Largest insurance companies 10/10 Largest manufacturing companies 10/10 Largest information technology and services companies 8/10 Largest telecommunications companies 8/10 Largest transportation companies 7/10 Largest retail companies 7/10 Largest banks and finance companies 6/10 Largest energy and utilities organizations Above is a snapshot of the number of top-ten largest companies using Kafka, per-industry. Core Capabilities High Throughput Deliver messages at network limited throughput using a cluster of machines with latencies as low as 2ms. Scalable Scale production clusters up to a thousand brokers, trillions of messages per day, petabytes of data, hundreds of thousands of partitions. Elastically expand and contract storage and processing. Permanent storage Store streams of data safely in a distributed, durable, fault-tolerant cluster. High availability Stretch clusters efficiently over availability zones or connect separate clusters across geographic regions. Ecosystem Built-in Stream Processing Process streams of events with joins, aggregations, filters, transformations, and more, using event-time and exactly-once processing. Connect To Almost Anything Kafka’s out-of-the-box Connect interface integrates with hundreds of event sources and event sinks including Postgres, JMS, Elasticsearch, AWS S3, and more. Client Libraries Read, write, and process streams of events in a vast array of programming languages. Large Ecosystem Open Source Tools Large ecosystem of open source tools: Leverage a vast array of community-driven tooling. Trust & Ease Of Use Mission Critical Support mission-critical use cases with guaranteed ordering, zero message loss, and efficient exactly-once processing. Trusted By Thousands of Orgs Thousands of organizations use Kafka, from internet giants to car manufacturers to stock exchanges. More than 5 million unique lifetime downloads. Vast User Community Kafka is one of the five most active projects of the Apache Software Foundation, with hundreds of meetups around the world. Rich Online Resources Rich documentation, online training, guided tutorials, videos, sample projects, Stack Overflow, etc."
