full_description = '''Best Kafka Summit Videos The following talks, with video recordings and slides available, achieved the best ratings by the community at the Kafka Summit conferences from 2018 onwards. Thanks to all the speakers for their hard work! TABLE OF CONTENTS Kafka Internals and Fundamentals Applications and Use Cases Architecture and Patterns Data Pipelines Kafka Operations Kafka Internals and Fundamentals Making Kafka Cloud Native, Jay Kreps (Confluent), KS EU 2021 How ksqlDB works, Michael Drogalis (Confluent), KS EU 2021 Understanding Kafka Produce and Fetch API Calls for High Throughput Applications, Jason Gustafson (Confluent), KS EU 2021 A Kafkaesque Raft Protocol, Mik Kocikowski (Cloudflare), KS EU 2021 Kafka ♥ Cloud (Keynote), Jay Kreps (Confluent), KS 2020 Trade-offs in Distributed Systems Design: Is Kafka The Best?, Ben Stopford & Michael G. Noll (Confluent), KS 2020 The Flux Capacitor of Kafka Streams and ksqlDB, Matthias J. Sax (Confluent), KS 2020 Crossing the Streams: the New Streaming Foreign-Key Join Feature in Kafka Streams, John Roesler (Confluent), KS 2020 Welcome to Kafka; We're Glad You're Here, Dave Klein (Centene), KS 2020 Kafka's New Architecture (Keynote), Gwen Shapira (Confluent), KS 2020 Getting Started with Apache Kafka – a Contributor's Journey, Israel Ekpo (Microsoft) & Matthias J. Sax (Confluent) & Nikolay Izhikov (Sberbank), KS 2020 Kafka Needs no (Zoo)Keeper (abstract), Jason Gustafson & Colin McCabe (Confluent), SFO 2019 Why Stop the World When you Can Change it? Design and Implementation of Incremental Cooperative Rebalancing (abstract), Konstantine Karantasis (Confluent), SFO 2019 Kafka 102: Streams and Tables All the Way Down (abstract), Michael G. Noll (Confluent), SFO 2019 What’s the time? …and why? (abstract), Matthias J. Sax (Confluent), SFO 2019 Zen and the Art of Streaming Joins: The What, When and Why (abstract), Nick Dearden (Confluent), NYC 2019 Exactly Once Semantics Revisited (abstract), Jason Gustafson (C