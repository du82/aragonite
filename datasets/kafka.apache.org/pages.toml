ion built for the same Scala version you use. Otherwise any version should work (2.13 is recommended). Kafka 3.1.0 includes a number of significant new features. Here is a summary of some notable changes: Apache Kafka supports Java 17 The FetchRequest supports Topic IDs (KIP-516) Extend SASL/OAUTHBEARER with support for OIDC (KIP-768) Add broker count metrics (KIP-748) Differentiate consistently metric latency measured in millis and nanos (KIP-773) The eager rebalance protocol is deprecated (KAFKA-13439) Add TaskId field to StreamsException (KIP-783) Custom partitioners in foreign-key joins (KIP-775) Fetch/findSessions queries with open endpoints for SessionStore/WindowStore (KIP-766) Range queries with open endpoints (KIP-763) Add total blocked time metric to Streams (KIP-761) Add additional configuration to control MirrorMaker2 internal topics naming convention (KIP-690) For more information, please read the detailed Release Notes. 3.0.2 Released Sept 19, 2022 Release Notes Source download: kafka-3.0.2-"
