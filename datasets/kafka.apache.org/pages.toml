ef="#streamsconfigs">3.6 Kafka Streams Configs</a> <li><a href="#adminclientconfigs">3.7 AdminClient Configs</a> <li><a href="#mirrormakerconfigs">3.8 MirrorMaker Configs</a> <li><a href="#systemproperties">3.9 System Properties</a> <li><a href="#tieredstorageconfigs">3.10 Tiered Storage Configs</a></li> </ul> </li> <li><a href="#design">4. Design</a> <ul> <li><a href="#majordesignelements">4.1 Motivation</a> <li><a href="#persistence">4.2 Persistence</a> <li><a href="#maximizingefficiency">4.3 Efficiency</a> <li><a href="#theproducer">4.4 The Producer</a> <li><a href="#theconsumer">4.5 The Consumer</a> <li><a href="#semantics">4.6 Message Delivery Semantics</a> <li><a href="#replication">4.7 Replication</a> <li><a href="#compaction">4.8 Log Compaction</a> <li><a href="#design_quotas">4.9 Quotas</a> </ul> </li> <li><a href="#implementation">5. Implementation</a> <ul> <li><a href="#networklayer">5.1 Network Layer</a> <li><a href="#messages">5.2 Messages</a> <li><a href="#messageformat">5.3 Message format</a> <li><a href="#log">5.4 Log</a> <li><a href="#distributionimpl">5.5 Distribution</a> </ul> </li> <li><a href="#operations">6. Operations</a> <ul> <li><a href="#basic_ops">6.1 Basic Kafka Operations</a> <ul> <li><a href="#basic_ops_add_topic">Adding and removing topics</a></li> <li><a href="#basic_ops_modify_topic">Modifying topics</a></li> <li><a href="#basic_ops_restarting">Graceful shutdown</a></li> <li><a href="#basic_ops_leader_balancing">Balancing leadership</a></li> <li><a href="#basic_ops_racks">Balancing Replicas Across Racks</a></li> <li><a href="#basic_ops_mirror_maker">Mirroring data between clusters</a></li> <li><a href="#basic_ops_consumer_lag">Checking consumer position</a></li> <li><a href="#basic_ops_consumer_group">Managing Consumer Groups</a></li> <li><a href="#basic_ops_cluster_expansion">Expanding your cluster</a></li> <li><a href="#basic_ops_decommissioning_brokers">Decommissioning brokers</a></li> <li><a href="#basic_ops_increase_replication_factor">Increasing replication factor</a></li> <li><a href="#rep-throttle">Limiting Bandwidth Usage during Data Migration</a></li> <li><a href="#quotas">Setting quotas</a></li> </ul> </li> <li><a href="#datacenters">6.2 Datacenters</a></li> <li><a href="#georeplication">6.3 Geo-Replication (Cross-Cluster Data Mirroring)</a></li> <ul> <li><a href="#georeplication-overview">Geo-Replication Overview</a></li> <li><a href="#georeplication-flows">What Are Replication Flows</a></li> <li><a href="#georeplication-mirrormaker">Configuring Geo-Replication</a></li> <li><a href="#georeplication-starting">Starting Geo-Replication</a></li> <li><a href="#georeplication-stopping">Stopping Geo-Replication</a></li> <li><a href="#georeplication-apply-config-changes">Applying Configuration Changes</a></li> <li><a href="#georeplication-monitoring">Monitoring Geo-Replication</a></li> </ul> </li> <li><a href="#multitenancy">6.4 Multi-Tenancy</a></li> <ul> <li><a href="#multitenancy-overview">Multi-Tenancy Overview</a></li> <li><a href="#multitenancy-topic-naming">Creating User Spaces (Namespaces)</a></li> <li><a href="#multitenancy-topic-configs">Configuring Topics</a></li> <li><a href="#multitenancy-security">Securing Clusters and Topics</a></li> <li><a href="#multitenancy-isolation">Isolating Tenants</a></li> <li><a href="#multitenancy-monitoring">Monitoring and Metering</a></li> <li><a href="#multitenancy-georeplication">Multi-Tenancy and Geo-Replication</a></li> <li><a href="#multitenancy-more">Further considerations</a></li> </ul> </li> <li><a href="#config">6.5 Important Configs</a> <ul> <li><a href="#clientconfig">Important Client Configs</a> <li><a href="#prodconfig">A Production Server Configs</a> </ul> </li> <li><a href="#java">6.6 Java Version</a> <li><a href="#hwandos">6.7 Hardware and OS</a> <ul> <li><a href="#os">OS</a></li> <li><a href="#diskandfs">Disks and Filesystems</a></li> <li><a href="#appvsosflush">Application vs OS Flush Management</a></li> <li><a href="#linuxflush">Linux Flush Behavior</a></li> <li><a href="#filesystems">Filesystem Selection</a></li> <li><a href="#replace_disk">Replace KRaft Controller Disk</a></li> </ul> </li> <li><a href="#monitoring">6.8 Monitoring</a> <ul> <li><a href="#remote_jmx">Security Considerations for Remote Monitoring using JMX</a></li> <li><a href="#tiered_storage_monitoring">Tiered Storage Monitoring</a></li> <li><a href="#kraft_monitoring">KRaft Monitoring</a></li> <li><a href="#selector_monitoring">Selector Monitoring</a></li> <li><a href="#common_node_monitoring">Common Node Monitoring</a></li> <li><a href="#producer_monitoring">Producer Monitoring</a></li> <li><a href="#consumer_monitoring">Consumer Monitoring</a></li> <li><a href="#connect_monitoring">Connect Monitoring</a></li> <li><a href="#kafka_streams_monitoring">Streams Monitoring</a></li> <li><a href="#others_monitoring">Others</a></li> </ul> </li> <li><a href="#zk">6.9 ZooKeeper</a> <ul> <li><a href="#zkversion">Stable Version</a> <li><a href="#zk_depr">ZooKeeper Deprecation</a> <li><a href="#zkops">Operationalization</a> </ul> </li> <li><a href="#kraft">6.10 KRaft</a> <ul> <li><a href="#kraft_config">Configuration</a></li> <li><a href="#kraft_storage">Storage Tool</a></li> <li><a href="#kraft_debug">Debugging</a></li> <li><a href="#kraft_deployment">Deploying Considerations</a></li> <li><a href="#kraft_missing">Missing Features</a></li> <li><a href="#kraft_zk_migration">ZooKeeper to KRaft Migration</a></li> </ul> </li> <li><a href="#tiered_storage">6.11 Tiered Storage</a> <ul> <li><a href="#tiered_storage_overview">Tiered Storage Overview</a></li> <li><a href="#tiered_storage_config">Configuration</a></li> <li><a href="#tiered_storage_config_ex">Quick Start Example</a></li> <li><a href="#tiered_storage_limitation">Limitations</a></li> </ul> </li> </ul> </li> <li><a href="#security">7. Security</a> <ul> <li><a href="#security_overview">7.1 Security Overview</a></li> <li><a href="#listener_configuration">7.2 Listener Configuration</a></li> <li><a href="#security_ssl">7.3 Encryption and Authentication using SSL</a></li> <li><a href="#security_sasl">7.4 Authentication using SASL</a></li> <li><a href="#security_authz">7.5 Authorization and ACLs</a></li> <li><a href="#security_rolling_upgrade">7.6 Incorporating Security Features in a Running Cluster</a></li> <li><a href="#zk_authz">7.7 ZooKeeper Authentication</a></li> <ul> <li><a href="#zk_authz_new">New Clusters</a></li> <ul> <li><a href="#zk_authz_new_sasl">ZooKeeper SASL Authentication</a></li> <li><a href="#zk_authz_new_mtls">ZooKeeper Mutual TLS Authentication</a></li> </ul> <li><a href="#zk_authz_migration">Migrating Clusters</a></li> <li><a href="#zk_authz_ensemble">Migrating the ZooKeeper Ensemble</a></li> <li><a href="#zk_authz_quorum">ZooKeeper Quorum Mutual TLS Authentication</a></li> </ul> <li><a href="#zk_encryption">7.8 ZooKeeper Encryption</a></li> </ul> </li> <li><a href="#connect">8. Kafka Connect</a> <ul> <li><a href="#connect_overview">8.1 Overview</a></li> <li><a href="#connect_user">8.2 User Guide</a></li> <ul> <li><a href="#connect_running">Running Kafka Connect</a></li> <li><a href="#connect_configuring">Configuring Connectors</a></li> <li><a href="#connect_transforms">Transformations</a></li> <li><a href="#connect_rest">REST API</a></li> <li><a href="#connect_errorreporting">Error Reporting in Connect</a></li> <li><a href="#connect_exactlyonce">Exactly-once support</a></li> <li><a href="#connect_plugindiscovery">Plugin Discovery</a></li> </ul> <li><a href="#connect_development">8.3 Connector Development Guide</a></li> <ul> <li><a href="#connect_concepts">Core Concepts and APIs</a></li> <li><a href="#connect_developing">Developing a Simple Connector</a></li> <li><a href="#connect_dynamicio">Dynamic Input/Output Streams</a></li> <li><a href="#connect_configs">Configuration Validation</a></li> <li><a href="#connect_schemas">Working with Schemas</a></li> </ul> <li><a href="#connect_administration">8.4 Administration</a></li> </ul> </li> <li><a href="/{{version}}/documentation/streams">9. Kafka Streams</a> <ul> <li><a href="/{{version}}/documentation/streams/quickstart">9.1 Play with a Streams Application</a></li> <li><a href="/{{version}}/documentation/streams/tutorial">9.2 Write your own Streams Applications</a></li> <li><a href="/{{version}}/documentation/streams/developer-guide">9.3 Developer Manual</a></li> <li><a href="/{{version}}/documentation/streams/core-concepts">9.4 Core Concepts</a></li> <li><a href="/{{version}}/documentation/streams/architecture">9.5 Architecture</a></li> <li><a href="/{{version}}/documentation/streams/upgrade-guide">9.6 Upgrade Guide</a></li> </ul> </li> </ul> You're viewing documentation for an older version of Kafka - check out our current documentation here. Documentation Kafka 3.6 Documentation Prior releases: 0.7.x, 0.8.0, 0.8.1.X, 0.8.2.X, 0.9.0.X, 0.10.0.X, 0.10.1.X, 0.10.2.X, 0.11.0.X, 1.0.X, 1.1.X, 2.0.X, 2.1.X, 2.2.X, 2.3.X, 2.4.X, 2.5.X, 2.6.X, 2.7.X, 2.8.X, 3.0.X, 3.1.X, 3.2.X, 3.3.X, 3.4.X, 3.5.X. 1. Getting Started 1.1 Introduction /* Licensed to the Apache Software Foundation (ASF) under one or more contributor license agreements. See the NOTICE file distributed with this work for additional information regarding copyright ownership. The ASF licenses this file to You under the Apache License, Version 2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain a copy of the License at http://www.apache.org/licenses/LICENSE-2.0 Unless required by applicable law or agreed to in writing, software distributed under the License is distributed on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for the specific language governing permissions and limitations under the License. */ // Define variables for doc templates var context={ "version": "36", "dotVersion": "3.6", "fullDotVersion": "3.6.2", "scalaVersion": "2.13" }; <h4 class="anchor-heading"> <a class="anchor-link" id="intro_streaming" href="#intro_streaming"></a> <a href="#intro_streaming">What is event streaming?</a> </h4> <p> Event streaming is the digital equivalent of the human body's central nervous system. It is the technological foundation for the 'always-on' world where businesses are increasingly software-defined and automated, and where the user of software is more software. </p> <p> Technically speaking, event streaming is the practice of capturing data in real-time from event sources like databases, sensors, mobile devices, cloud services, and software applications in the form of streams of events; storing these event streams durably for later retrieval; manipulating, processing, and reacting to the event streams in real-time as well as retrospectively; and routing the event streams to different destination technologies as needed. Event streaming thus ensures a continuous flow and interpretation of data so that the right information is at the right place, at the right time. </p> <h4 class="anchor-heading"> <a class="anchor-link" id="intro_usage" href="#intro_usage"></a> <a href="#intro_usage">What can I use event streaming for?</a> </h4> <p> Event streaming is applied to a <a href="/powered-by">wide variety of use cases</a> across a plethora of industries and organizations. Its many examples include: </p> <ul> <li> To process payments and financial transactions in real-time, such as in stock exchanges, banks, and insurances. </li> <li> To track and monitor cars, trucks, fleets, and shipments in real-time, such as in logistics and the automotive industry. </li> <li> To continuously capture and analyze sensor data from IoT devices or other equipment, such as in factories and wind parks. </li> <li> To collect and immediately react to customer interactions and orders, such as in retail, the hotel and travel industry, and mobile applications. </li> <li> To monitor patients in hospital care and predict changes in condition to ensure timely treatment in emergencies. </li> <li> To connect, store, and make available data produced by different divisions of a company. </li> <li> To serve as the foundation for data platforms, event-driven architectures, and microservices. </li> </ul> <h4 class="anchor-heading"> <a class="anchor-link" id="intro_platform" href="#intro_platform"></a> <a href="#intro_platform">Apache Kafka&reg; is an event streaming platform. What does that mean?</a> </h4> <p> Kafka combines three key capabilities so you can implement <a href="/powered-by">your use cases</a> for event streaming end-to-end with a single battle-tested solution: </p> <ol> <li> To <strong>publish</strong> (write) and <strong>subscribe to</strong> (read) streams of events, including continuous import/export of your data from other systems. </li> <li> To <strong>store</strong> streams of events durably and reliably for as long as you want. </li> <li> To <strong>process</strong> streams of events as they occur or retrospectively. </li> </ol> <p> And all this functionali'''
