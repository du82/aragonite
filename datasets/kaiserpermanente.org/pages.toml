full_description = "Health and Wellness At Kaiser Permanente, we know total health and wellness go beyond the doctor’s office. That’s why we’re here to help you find the high-quality care and resources you need. Jump to section Healthy living spotlight Managing your health Health tools Programs and classes Health articles Healthy living spotlight Self-care apps Download wellness apps to support your health needs. Health classes and programs Find in-person, over-the-phone, and online wellness options. Wellness coaching One on one support by phone with a wellness coach. Fitness and exercise deals Find discounts and tools to help you stay active. Addiction and recovery Anxiety Depression Attention deficit hyperactivity disorder (ADHD) Bipolar disorder Eating disorders Obsessive-compulsive disorder Show more Show less Browse these topics for healthier living Mental health Women's health Diabetes COVID-19 Maternity Heart health Cancer Gender-affirming care Flu Healthy eating Addiction Social health Fitness & exercise Life care planning Birth control Caregiving Parenting Stress Sleep Relationships Mindfulness Senior health Don’t let the flu slow you down Get your flu shot today so you can keep living life to the fullest. Flu shots are safe, convenient, and available at no cost at many Kaiser Permanente locations. Get the flu shot Search for classes and programs As a Kaiser Permanente member, you can sign up for in-person, over-the-phone, and online wellness programs and classes designed to help you achieve your health goals. To get information that’s specific to your area, select your region below. Learn about the health class directory Region Choose a region Tools for you Health encyclopedia Search from over 4,000 health topics on to learn which care is best for you. Explore health topics Food for Health recipe library Browse 600+ healthy meals to make at home. View recipes Support groups and classes Find online or in-person programs in your area. Explore classes Symptom checker Learn what your symptoms could mean. Search your symptoms Pharmacy services Fill and manage your medications. Manage your prescriptions Self-care apps Improve your sleep, mood, and more. Explore the apps Community resource directory Connect to food, housing, and more in your area. View the directory Caregiving resource guide Get tips to help you care for a loved one. Find caregiving support Life care planning Make plans so your loved ones know your wishes. Build your plan Total Health Assessment Get healthy lifestyle tips based on your health. Take the assessment Related articles Explore library View by topic: All topics Fitness and exercise Healthy eating Mental health Prevention and diseases Health and wellness Fitness and exercise Healthy eating Mental health Prevention and diseases View all Healthy Living articles View Fitness and Exercise articles View Healthy Eating articles View Mental Health articles View Prevention and Diseases articles This feature is temporarily unavailable. Please try again later. Back to top Connecting to care Call us 24/7 and talk with a licensed care clinician about your questions or concerns. Find your local phone number below. Call 24/7 for advice If you need help choosing the care that’s right for you, give us a call. Call us Message your care team Prefer to write? Message your care team anytime with medical questions. Compose a message Schedule an appointment Schedule in-person check-ups, phone or video visits, and other appointments. Schedule a visit"
