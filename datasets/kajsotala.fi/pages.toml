full_description = "Monta samanaikaista suhdetta – miksipä ei? Posted on Dec 8, 2010 in Finnish Essays, Finnish Posts | 0 comments Monia seurustelusuhteita revitään joka hetki aivan turhaan rikki, koska ihmiset luulevat että rakastaa voi vain yhtä ihmistä kerrallaan. Turhan tyypillinen kuvio on, että suhteen toinen osapuoli rakastuu johonkuhun muuhun. Hän ei kuitenkaan uskalla kertoa tätä kumppanilleen, koska nykymaailmassa ei kunnolla edes tunnusteta moisen mahdollisuuden olemassaoloa. Ajatellaan, että yhteen ihmiseen rakastuminen sulkee aina pois rakkauden muihin. Jos uudestaan rakastunut ihminen kertoisi asiasta kumppanilleen, tulkitsisi kumppani sen hyökkäyksenä itseään kohtaan tai omana puutteenaan. Sattumalta tuli vastaani varsin sydäntäsärkevä foorumiketju, jonka aloittaja kertoo miehensä olevan rakastuneen toiseenkin ihmiseen, mutta mies ei silti tahtoisi erota vaimostaankaan. Muilta keskustelijoilta tuleva viesti on selkeä: jätä se. Näin käy aivan liian usein. Mutta rakkautta on monenlaista. On vanhemman rakkautta lapsiinsa, ystävysten välistä rakkautta, ja sitä mitä on perinteisesti ajateltu romanttisena rakkautena. Hassua on, että näistä romanttinen rakkaus on ainoa, jota ajatellaan poissulkevana. Ei useamman lapsen vanhempi rakasta osaa lapsistaan enemmän kuin muita, eikä toisen lapsen hankkiminen tarkoita että esikoisestaan välittäisi enemmän. Läheinen ystävyys yhden ihmisen kanssa ei tarkoita, etteikö voisi olla läheinen jonkun muunkin kanssa. Miksi romanttisten suhteiden kohdalla sitten kuvitellaan näin? Seurustelua monen ihmisen kanssa samaan aikaan kutsutaan polyamoriaksi, siinä missä perinteinen seurustelu yhden ihmisen kanssa kerrallaan on monoamoriaa. Tyypillisimpiä polykuvioita ovat kolmen ihmisen suhteet, joita voi olla v-mallisia (yksi ihminen seurustelee kahden muun kanssa) tai kolmioita (jokainen seurustelee kahden muun kanssa). Suhteen osapuolten määrän ei kuitenkaan tarvitse rajoittua vain kolmeen. Yksi esimerkki polyamorisesta suhteesta löytyy tuoreesta Helsingin Sanomien jutusta. Pettäminen ei ole polyamoriaa. Englanniksi käytetään joskus ilmaisua “responsible consensual non-monogamy” – vastuullinen vapaaehtoinen monisuhteellisuus. Aito polyamoria tapahtuu rehellisesti, vapaasti kommunikoiden, ilman painostusta. Eräs nettituttuni on elänyt yli viisi vuotta polyamorisessa suhteessa kahden kumppaninsa kanssa, enkä tule koskaan unohtamaan sitä miten hän kuvasi onnellisia hetkiä heidän arjessaan. Hän kertoi eräänä päivänä pysähtyneensä katselemaan sitä miten hänen kumppaninsa olivat onnellisina käpertyneet toistensa syliin, mikä sai hänetkin hymyilemään, onnellisena heidän onnestaan. Kun hän itse puolestaan oli myöhemmin toisen heistä sylissä, huomasi hän suhteen kolmannen osapuolen jääneen katselemaan – ja tuttavani tunnisti tämän ilmeen samaksi rakastavan onnelliseksi, kuin mikä hänellä itsellään oli aiemmin ollut. Tätä on polyamoria parhaimmillaan. Polyamoria ei toki sovi kaikille. Jos rehellinen ja toimiva kommunikointi on kahden ihmisen suhteessa tärkeää, on se sitä vielä suuremmassa määrin kolmen tai useamman ihmisen suhteessa. Lisäksi mono- ja polyamorisuus tuntuvat jossain määrin olevan ihmisen omia suuntauksia samalla tapaa kuin homo- ja heteroseksuaalisuuskin. Joillekin tuntuu täysin luonnottomalta koettaa rajoittaa sitä, keitä kohtaan kokee tunteita. Toiset taas kokevat luonnostaan tunteita vain yhtä ihmistä kohtaan kerrallaan. Monoamorisen ja polyamorisen välinen suhde tuottaa helposti ongelmia. Joko polyamorinen pyrkii pysyttelemään tiukan yksiavioisena ja kieltämään omat tunteensa, tai monoamorinen joutuu sopeutumaan ajatukseen siitä, että hänen kumppanillaan on muitakin. Kumpikin tilanne on vaikea. Itse kuulun luonnostaan polyamorisiin. En koe mielekkääksi vetää tiukkaa rajaa hyvin läheisen ystävyyden ja romanttisen rakkauden välille. Joillekin tämä ero on hyvinkin selkeä, minulle on vain enemmän tai vähemmän läheisiä ystäviä. Mitä läheisempi, sen enemmän haluan olla mukana hänen elämässään ja jakaa oman elämäni hänen kanssaan. Unohtakaamme ajatus siitä, etteikö ihminen voisi aidosti rakastaa useampaa ihmistä kerrallaan. Miksi ihmeessä ei voisi? Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
