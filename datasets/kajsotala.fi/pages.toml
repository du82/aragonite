["https://kajsotala.fi/2011/03/homot-ja-heterot-ovat-mielikuvitusolentoja"]
title = "Homot ja heterot ovat mielikuvitusolentoja | Kaj Sotala"
description = "Mitä jos harrastaa kerran seksiä saman sukupuolen edustajan kanssa? Onko silloin bi tai homo? Entä jos on muuten hetero, mutta yksi tietty saman sukupuolen edustaja himottaisi? Onko tässä tiukassa …"
full_description = "Homot ja heterot ovat mielikuvitusolentoja Posted on Mar 23, 2011 in Finnish Essays, Finnish Posts | 0 comments Stereotyyppinen seksuaalikäsitys, jossa homot, heterot ja biseksuaalit menevät kukin omaan lokeroonsa tai laatikkoonsa. Mitä jos harrastaa kerran seksiä saman sukupuolen edustajan kanssa? Onko silloin bi tai homo? Entä jos on muuten hetero, mutta yksi tietty saman sukupuolen edustaja himottaisi? Onko tässä tiukassa rajanvedossa ylipäätään järkeä? Homon, heteron ja biseksuaalin käsitteet ovat monessa mielessä käteviä työkaluja. Ei silti kannata unohtaa, että ne ovat yliyksinkertaistuksia. Tilanne on vähän sama, kuin jos koettaisi kuvata ihmisen ruumiinrakennetta “pieni, keskikokoinen, iso”-luokittelulla. Ihminen voi olla pitkä mutta laiha, tai lyhyt mutta harteikas. Monilla onkin vaikeita löytää sopivia vaatteita, koska heidän mittasuhteensa eivät sovi tavallisiin kokomuotteihin. Vastaavasti seksuaalisuuskaan sopii harvoin perinteisiin muotteihin aivan täysin. Mikä tässä perinteisessä jaossa sitten on vikana? Otetaan vaikka minut esimerkiksi. Minulla on ajoittaisia fantasioita miehistä, ja voisin periaatteessa kuvitella itseni suhteeseen miehen kanssa. Nautin myös joistakin miehiä esittävistä piirroskuvista. Kuitenkin on erittäin harvinaista, että tuntisin fyysistä vetoa kehenkään tosielämässä kohtaamaani mieheen. Niin käy ehkä kerran parissa vuodessa. Olen siis periaatteessa bi mutta käytännössä hetero. Kumpikaan nimitys ei tunnu täysin oikealta. Kinseyn skaala, jossa (bi)seksuaalisuus on esitetty liukuvana määreenä. Askel parempaan suuntaan olisi Kinseyn skaala. Se kulkee nollasta kuuteen. 0 on puhtaan heteroseksuaali, 3 puhtaan biseksuaali ja 6 puhtaan homoseksuaali. Minä asettuisin Kinseyn skaalassa varmaankin ykkösen kohdalle. Aseksuaaleille on varattu oma merkintänsä, X. Tämäkin skaala on kuitenkin ongelmallinen. Se käsittelee seksuaalista ja romanttista kiinnostusta kuin nämä olisivat sama asia. Kuten sanottu, tunnen hyvin harvoin seksuaalista kiinnostusta miehiin. Vielä suurempi ongelma miessuhteilulleni on, että minun on vaikeaa saada miehiin tunnetason yhteyttä. Ilman tunnesidettä ei synny romanssia. Toisaalta olen ajoittain myös ihastunut joihinkin miehiin puhtaan platonisella tasolla. Aseksuaalien niputtaminen omaan ryhmäänsä on myös hankalaa. Tiedän aseksuaalisia hetero-, homo- ja biseksuaaleja. He ovat ihmisiä, jotka kokevat vähän tai eivät lainkaan kiinnostusta seksiin. Silti he ovat kiinnostuneita seurustelusta ja elämänsä jakamisesta toisen ihmisen kanssa. Kinseyn skaalasta seuraava askel voisi siis olla jaottelu, jossa olisi erikseen seksuaalinen ja romanttinen kiinnostus toisaalta miehiä ja toisaalta naisia kohtaan. Tämä alkaa jo käydä paremmaksi. Joku voisi vaikka tuntea miehiin neljän pisteen romanttista ja kahden pisteen seksuaalista kiinnostusta. Naisiin taas kuuden pisteen seksuaalista ja neljän pisteen romanttista kiinnostusta. Täysin tyydyttävää tulosta ei vieläkään saada. Luin tuoreeltaan jutun ihmisistä, jotka kokevat rakastuneensa rakennuksiin, esimerkiksi Eiffel-torniin tai Berliinin muuriin. Vastaavia epätavallisia suuntautumisia on maailma täynnä. On olemassa ääretön määrä asioita, joihin saattaisi kokea vetoa. Jos haluaisimme täysin kattavan luokittelun, pitäisi meillä on kiinnostuneisuusakselit kaikelle mahdolliselle. Ei mikään ihmekään, ettei tämänlaista luokittelua yleensä tehdä. Valtaosa mahdollisista suuntautumisista on niin harvinaisia, ettei niistä juuri koskaan tule puhetta. Sekä romanttinen että seksuaalinen kiinnostukseni Eiffel-torniin on nolla, mutta jollekin toiselle se on isompi. Mutta palataan vähän arkisempiin tilanteisiin. Lisäongelmia tulee siitä, että (esimerkiksi) puhtaat heteroseksuaalitkaan ovat harvoin kiinnostuneita kaikista vastakkaisen sukupuolen edustajista. Naimisissa oleva saattaa tuntea kiinnostusta vain ja ainoastaan kumppaniaan kohtaan. Joku saattaa olla pääosin vain kiinnostunut ujoista miehistä, toinen lihaksikkaista naisista. Joku saattaa olla puhdas hetero, kunnes rakastuu palavasti yhteen – ja vain yhteen – samaa sukupuolta olevaan. Mikään tästä ei olisi lainkaan ennenkuulumatonta. Aikaisemmat luokittelumme ovat siis pelkästään keskiarvoja. Kuvauksia siitä, millaiset ihmiset tai asiat tyypillisesti kiinnostavat. Ne ovat yhteenvetoja siitä, miten todennäköisesti miehellä tai naisella tai Eiffel-tornilla on niitä asioita, jotka meihin jollain tasolla vetoavat. Jos haluaisimme mennä oikein tarkaksi, tekisimme listan kaikista niistä piirteistä jotka tuottavat meissä vetoa. Tietynlaiset silmät saattavat tuottaa meissä kiinnostusta, tai tietynlaiset luonteenpiirteet. Toisten piirteiden ilmeneminen taas tuottaa meissä vastareaktion. Heteromiehelle penis voi olla sellainen asia, joka vie kaiken seksuaalisen kiinnostuksen sen omistajaan. Piirteet voivat myös olla abstraktimpia, kuten ihan vain se että joku pitää itseään tietyn sukupuolen edustajana. Ne eivät vaikuta toisistaan riippumatta, vaan tietyt piirteiden yhdistelmät tuottavat eri reaktion kuin samat piirteet yksinään. “Mies” tai “nainen” ei ole mikään absoluuttinen luokka. On perinteiseen mies- tai naiskuvaan sopivia ihmisiä, mutta myös transsukupuolisia ja intersukupuolisia, on geneettisiä miehiä jotka vaikuttavat fyysisesti naisilta, ja ihan vain ihmisiä jotka sopivat huonosti sukupuolistereotypioihin. Kuten kaikki kategoriat, “mies” tai “nainen” on yhteinen nimi tietyille piirteille, jotka tyypillisesti esiintyvät yhdessä. Ei ole jotakin maagista mieheyden tai naiseuden syvintä olemusta, yksittäistä tekijää jolla ihminen voitaisiin suoraan määrittää tietyn sukupuolen edustajaksi. Sen sijaan on tietynmallisia kehoja, tietynlaisia ajattelutapoja, tiettyjä temperamentteja, tiettyjä sukupuoli-identiteettejä. Osaa niistä esiintyy joillain sukupuolilla enemmän kuin toisilla. Näiden piirteiden avulla määritämme ihmisen sukupuolen. Kun haemme seksuaalista suuntautumistamme vastaavia ihmisiä, haemme pohjimmiltamme ihmisiä jotka viehättäisivät meitä. Jos tunnemme eniten vetoa asioihin joita kokemuksemme mukaan esiintyy vain miehillä, saatamme ajatella olevamme kiinnostuneita vain miehistä. Tai jos meitä viehättäviä piirteitä esiintyy tasaisesti kaikkien sukupuolen edustajilla, saatamme pitää itseämme bi- tai panseksuaaleina. Tämä määritelmä ei kuitenkaan ole mikään yksiselitteisen selkeä asia. Se on karkea yhteenveto siitä, millaisiin piirteiden yhdistelmiin tunnemme ihmisissä vetoa. Toki sanat kuten “biseksuaali” ovat monissa yhteyksissä käteviä. Niillä voi nopeasti kertoa keskiarvoja itsestään. Ei kuitenkaan kannata huolestua, jos ne sanat eivät tunnu sopivan. Heterot, homot ja bit ovat kaikki pohjimmiltaan mielikuvitusolentoja, mieltemme luomia luokituksia. Todellinen ihmispsykologia on paljon monimutkaisempaa kuin nämä karkeat yleistykset. Aiheeseen liittyen englanniksi: 37 Ways That Words Can Be Wrong, erityisesti kohdissa 1-14 mainitut linkit. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
