title = "En tarkoittanut loukata, olen vain eri planeetalta | Kaj Sotala"
description = "Kolme tosielämän esimerkkiä tapauksista, jotka ovat saaneet jonkun loukkaantumaan, mutta jotka ovat johtuneet lähinnä väärinkäsityksistä. Väärinkäsitykset ovat juontaneet juurensa siihen, että ihmi…"
full_description = "En tarkoittanut loukata, olen vain eri planeetalta Posted on Dec 21, 2010 in Finnish Essays, Finnish Posts | 0 comments Kolme tosielämän esimerkkiä tapauksista, jotka ovat saaneet jonkun loukkaantumaan, mutta jotka ovat johtuneet lähinnä väärinkäsityksistä. Väärinkäsitykset ovat juontaneet juurensa siihen, että ihmiset ovat pohjimmiltaan olleet eri kulttuureista – vaikka olisivatkin kaikki saman maan asukkaita. 1. Kysyjät ja arvaajat. Kysyjien ja arvaajien käsite popularisoitiin Guardianissa olevassa kolumnissa, joka puolestaan pohjautui MetaFilter-keskustelupalstalla olleeseen viestiin. Pähkinänkuoressa ajatuksessa on kyse siitä, että on kahdenlaisia perheitä: kysyjäperheitä ja arvaajaperheitä. Kysyjäperheissä kasvatetaan siihen ajatukseen, että ihmisen on hyväksyttävää pyytää mitä tahansa – palveluksia, palkankorotuksia, jne. – vaikka tietäisivät, että vastaus tulee todennäköisesti olemaan kieltävä. “Kokeilemalla ei häviä mitään.” Arvaajaperheissä kasvaneet taas kokevat, että mitään asiaa on epäkohteliasta kysyä suoraan. Jos joku haluaa jotakin, toisen on osattava ennakoida ja arvata tämä, ja tarjota asiaa sitten oma-aloitteisesti. Oma-aloitteinenkin tarjous voi kuitenkin olla pelkästään kohteliaisuudesta tehty, ja jokaisen on osattava erottaa se aidosta ja ymmärtää kieltäytyä. Ihminen joka hyväksyy kohteliaisuudesta tehdyt tarjoukset, samoin kuin ihminen joka tekee suoranaisia oma-aloitteisia pyyntöjä, koetaan töykeänä ja tungettelevana. Kun arvaaja törmää kysyjään, seuraa hankaluuksia. Arvaajan mielestä kysyjä on tungetteleva ja epäkohtelias, kysyjän mielestä arvaaja odottaa hänen olevan ajatustenlukija ja kokee arvaajan loukaantuvan ihan neutraaleista kysymyksistä. Pahimmillaan se johtaa tämänlaisiin keskusteluihin: “Voisitko silittää paitani? Minulla on tänään tapaaminen.” “Etkö näe että olen pakkaamassa eväitä enkä ole vielä edes pukeutunut? Olet niin ajattelematon!” “Mutta minähän vain kysyin. Jos sinulla on liian kiire, olisit vain voinut sanoa – ei tarvitse huutaa!” “Sinun pitäisi kiinnittää minun tarpeeksi huomiota jotta tietäisit milloin olla kysymättä!” 2. Kärjistäjät ja asiallistajat. Jouduin tuoreeltaan väittelyyn siitä, oliko piraattien perustulokannanottoa aiheellista muotoilla siten kuin muotoiltiin. Kannanottoa kritisoitiin siitä, että se tuntui asettuvan liikaa juuri Vihreiden perustulomallin taakse (mitä se minusta ei tehnyt, mutta luimme sitä eri tavalla). Tulin sitten tässä keskustelussa heittäneeksi, että jos Vihreät esittäisivät ettei homoja saa tappaa, niin eikö sitäkään ehdotusta saisi kannattaa. Kanssakeskustelijani loukkaantui tästä ja koki heiton asiattomana. Hän koki, että olen nyt rinnastamassa häntä homoja tappaviin ihmisiin. Itse olen kuitenkin melko pitkälti varttunut sellaisissa ympäristöissä, joissa on aivan tavallista käyttää tuonkaltaisia esimerkkejä täysin ystävällismielisessä keskustelussa. Erityisesti olen tottunut siihen, että kun keskustellaan etiikkaan tai päätöksentekoon liittyvistä säännöistä tai periaatteeista, pyritään kaikista ehdotetuista periaatteista löytämään ne ääritapaukset, joihin periaatteiden kirjaimellinen soveltaminen johtaisi. Tämä ei tarkoita sitä, että kenenkään tarkoitettaisiin olevan valmis esim. tappamaan homoja. Pikemminkin nämä heitot tulkitaan kysymyksinä. “Jos tulkitsisin tätä sääntöä siten kuin sen ilmauksestasi ymmärsin, tuntuisi se johtavan meidän molempien mielestä kestämättömään lopputulokseen. Joko ymmärsin sen väärin, sinulla on siinä lisäoletuksia jotka eivät ole minulle ilmeisiä, tai tämä periaate ei todellisuudessa sovikaan kuvaamaan arvojasi. Mikä näistä vaihtoehdoista on sinusta lähimpänä totuutta?” Tarkoitin oman kommenttini myös tulkittavan tuonkaltaiseksi kysymykseksi. En ymmärtänyt mitä toinen oikein ajoi takaa, etenkään kun paras hypoteesini siitä mitä saatettaisiin ajaa takaa tuntui johtavan absurdiin lopputulokseen. Siksi heitin ilmoille yhden niistä lopputuloksista joihin se tuntui johtavan, ja odotin että hän selventäisi miksi kyseiset perustelut eivät johtaisi siihen ja miten olin ymmärtänyt häntä väärin. Esimerkki oli kärjistetty, mutta olin tottunut ympäristöön jossa esimerkit ovat kärjistettyjä – jotta pointti tulisi mahdollisimman selväksi. En odottanut, että kukaan ottaisi sitä loukkauksena. Etenkään en osannut odottaa, että ihminen jonka kanssa olin ystävällisissä väleissä olettaisi minun rinnastavan hänen mielipiteensä moiseen toimintaan. Asia vaikuttaa taas kulttuurierolta. Kärjistäjät ovat valmiina käyttämään rajujakin kärjistyksiä, koska kokevat sen helpottavan pointin ymmärtämistä. Asiallistajat taas kokevat rajujen kärjistysten olevan huonotapaisia hyökkäyksiä keskustelukumppaneita vastaan, ja vain estävän asiallisen keskutelun. 3. Keskeyttäjät ja kuuntelijat. Eräs ystäväni on kasvanut perheessä, jossa on ollut varsin aggressiivinen keskustelukulttuuri. Toisen keskeyttämistä tai päällepuhumista ei pidetty mitenkään pahana, koska oletettiin että toinen kuitenkin joko keskeyttäisi kohta itse tai jatkaisi omaa asiaansa kunhan keskeyttäjä on saanut asiansa sanottua. Hän kokee herkästi olonsa epävarmaksi perinteisessä suomalaisessa keskustelukulttuurissa, jossa kuunnellaan kohteliaasti toisen puhetta loppuun ja keskeyttäminen koetaan epäkohteliaana. Hän päätyy herkästi dominoimaan keskustelua, siinä missä hiljaisemmat kokevat helposti etteivät saa suunvuoroa. —– Teemme kaikki tulkintamme maailmasta aiempien kokemuksiemme perusteella. Mikäli olemme olleet valtaosan ajastamme tietynlaisessa keskustelukulttuurissa, oletamme automaattisesti myös muiden ihmisten sisäistäneen sen kulttuurin keskustelunormit. Todellisuudessa he ovat saattaneet viettää paljon aikaa erilaisessa kulttuurissa, ja se mikä meistä on töykeää saattaa olla heille aivan normaalia. Erilaiset loukkaantumiset kannattaisikin pyrkiä purkamaan keskustellen – jos olettaa toisesta ihmisestä liikaa, menee nopeasti metsään. (Perehdyttäminen erilaisten keskustelukulttuurien ominaispiirteisiin ja niistä mahdollisesti syntyviin väärinymmärryksiin kuuluu muuten niihin tapoihin opettaa sosiaalisia taitoja, jotka mielelläni näkisin peruskoulussa.) Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
