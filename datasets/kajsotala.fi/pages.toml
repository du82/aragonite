title = "Saako hississä pyytää seksiä? | Kaj Sotala"
description = "Hissit ovat näemmä päivän Internets-puheenaihe. Riippuen siitä keneltä kysyy, puhe on feministeistä jotka pitävät kaikkia miehiä potentiaalisina raiskaajina, siitä että viattomasta ehdottelusta ärs…"
full_description = "Saako hississä pyytää seksiä? Posted on Jul 8, 2011 in Finnish Essays, Finnish Posts | 0 comments Hissit ovat näemmä päivän Internets-puheenaihe. Riippuen siitä keneltä kysyy, puhe on feministeistä jotka pitävät kaikkia miehiä potentiaalisina raiskaajina, siitä että viattomasta ehdottelusta ärsyyntyvät eivät välitä tyttöjen ympärileikkauksista, tai siitä että kahville pyytäminen on ahdistelua. Anteeksi mitä? Juttu alkoi viattomasta videoblogauksesta, jossa Rebecca Watson kertoi siitä mitä on viime aikoina puuhastellut. Kaiken muun lisäksi hän tuli maininneeksi aavistuksen epämiellyttävästä tilanteesta jonka hän koki eräässä konferenssissa käydessään: “At the bar later that night, actually at four in the morning, we were at the hotel bar, at four AM I said you know, I’ve had enough guys, I’m exhausted, going to bed. So I walked to the elevator, a man got on the elevator with me, and said, ‘don’t take this the wrong way, but I find you very interesting and I would like to talk more, would you like to come to my hotel room for coffee?’. Just a word for the wise here, guys, don’t do that. You know, I don’t really know how else to explain how this makes me incredibly uncomfortable, but I’ll just sort of lay it out that I was a single woman, you know, in a foreign country, four AM in a hotel elevator with you, just you, and… don’t invite me back to your hotel room right after I finish talking about how it creeps me out and makes me uncomfortable when men sexualize me in that manner.” Noin 16 sekunnin sivuhuomio kahdeksan minuutin mittaisessa videossa. “Jos olen juuri ollut paneelikeskustelussa jossa kerron miten koen sen epämukavaksi kun miehet seksualisoivat minua, älä ehdottele minua asioita kun olemme neljältä aamulla hotellin hississä kahden.” Tiivistettynä: omaa järkeä saa käyttää. Asia oli vielä sanottu melko hyväntuuliseen sävyyn. Juttu ei kuitenkaan jäänyt siihen. Se olisi ollut aivan liian järkevää. Mm. biologi PZ Myers kirjoitti oman blogitekstinsä, jossa hän viittasi Watsonin videoon. Myers kirjoitti tekstinsä kahdessa ekassa kappaleessa, että peruskohteliaisuudeksi ei riitä että teemme selkeästi sopimattomia ehdotuksia ja hyväksymme sitten kiltisti kielteisen vastauksen. Kohteliaisuutta on se, ettemme kysy mitään selkeästi sopimatonta ylipäätänsäkään. Sitten hän siirtyi aasinsillan kautta toiseen aiheeseen josta kirjoitti kuuden kappaleen verran. Myersin tekstin kommenttiosiossa syntyi myrsky, jossa mm. kuuluisa tieteen popularisoija ja ateisti Richard Dawkins esitti Watsonin mielipidettä vähätteleviä kantoja, ja vertasi Watsonin kuulemaa ehdotusta purukumin syömiseen. Kolmas blogaaja nosti Dawkinsin kommentit esille ja kritisoi niitä. Uuden Suomen puolella Panu Horsmalahti luonnehti siihenastisia tapahtumia siten, että “feministit” olivat suorastaan “raivostuneet” Watsonin alunperin kuulemasta ehdotuksesta. Tämä koko juttu kuulema kertoi siitä, miten “feministien” mielestä “jokainen mies on potentiaalinen on raiskaaja”. Toki Watson oli itse feministi ja painotti videossaan sitä, miten kaikki muut konferenssikävijät – miehet mukaanlukien – olivat olleet aivan mahtavia. Ja muutenkin blogeissa tunnuttiin enemmänkin kritisoivan tietynlaista käytöstä tietynlaisessa tilanteessa – sitä että ollaan kaksin pienessä suljetussa tilassa hotellissa jossa kaikki muut nukkuvat, ja aletaan tekemään ehdotuksia naiselle joka on aiemmin ilmaissut kokevansa ne epämukavina. Huokaus. Otetaanpa alusta. En usko, että Watsonin mainitsema mies aikoi mitään pahaa. Hän oli vain aavistuksen ajattelematon. Ja minusta on puhtaasti hyvä asia, että Watson kommentoi asiasta julkisesti. Monet ihmiset nimittäin eivät vain aidosti tule ajatelleeksi sitä, että vastaavanlainen käytös saattaisi olla jostakusta ahdistavaa. He tulevat tehneeksi mahdollisesti ahdistavia asioita tietämättään. “Jos olet tekemässä vieraalle ihmiselle jotain, jota saatetaan pitää merkkinä jostain uhkaavasta, älä tee sitä kun olette kaksin suljetussa tilassa jos et halua ahdistaa häntä” on perusjärkeä. Tämän sanominen ääneen on hyvä idea, vaikka olisi yleisesti ottaen sitä mieltä että tuosta ahdistuminen oli naurettavaa. Jos aikoo tehdä jotain josta toinen saattaa ahdistua, on parempi että ainakin tekee sen tietoisesti eikä vahingossa. Tuon alkuperäisen neuvon maalaaminen jotenkin hirveän sukupuolittuneeneksi ja asian vääntäminen sukupuolten sodaksi on aika turhaa. Ensinnäkin, miehenä ja ihmisenä minä arvostan tietoa siitä, mitkä tekoni saattavat ahdistaa muita. En haluaisi ahdistaa muita turhaan, joten haluan että minulle kerrotaan miten voin välttää sen. Toisekseen, kyllä minäkin olisin Watsonin kengissä saattanut kokea saman tilanteen jos en ahdistavana niin ainakin hermostuttavana. Se että olen itse mies ei muuta asiaa mihinkään. “Olisiko Watsonin pitänyt sanoa asiasta mitään julkisesti” on yksi kysymys. Toinen kysymys on se, että mitä jos mies olisi tiedostanut saattavansa aiheuttaa ahdistusta. Jos hän olisi toiminut tietoisena tästä, olisiko se ollut tuomittavaa? Osa jutun kommentoijista on sitä mieltä, että tuollaisen käytöksen paheksuminen on kaikkiin miehiin kohdistuvaa vainoa. Jos paheksuu miestä joka tietyssä tilanteessa pyysi naista kahville, paheksuu sitä että miehet ylipäätään kutsuvat naisia kahville! Paitsi ettei siitä ole kyse, vaan siitä tilanteesta jossa pyyntö esitettiin. Oliko tuossa tilanteessa aiheellista ahdistua? Raiskauksia nyt valitettavasti tapahtuu. Juuri tuon tyyppisissä tilanteissa niitä tapahtuu suhteellisen vähän. Ystävän tai sukulaisen luona tapahtuvat raiskaukset ovat paljon yleisempiä. Siitä huolimatta niitä tapahtuu myös tämänlaisissa tilanteissa. Miten todennäköistä se olisi ollut? Katsotaanpa tilannetta. Watson on juuri ollut paneelissa, jossa hän on puhunut siitä miten hän kokee itsensä olonsa epämukavaksi kun häntä kohdellaan seksiobjektina. Videollaan annetaan ymmärtää (joskaan ei sanota ihan suoraan), että kyseessä ollut mies oli myös ollut kuulemassa kun Watson puhui asiasta. Hän oli myös baarissa ja kuuli, kun Watson sanoi olevansa uupunut ja menevänsä nukkumaan. Sen jälkeen hän seuraa Watsonin perässä ja tekee tälle selkeän seksuaalisen ehdotuksen. Toki olisi ollut mahdollista ettei tuota ehdotusta ollut tarkoitettu seksuaaliseksi, mutta kuten Watson itse kommentoi: “There is a small chance that this man meant nothing sexual in his comment, despite the fact that I had clearly indicated my wish to go to bed (alone) and the fact that the bar had coffee and therefore there was absolutely zero reason to go to anyone’s hotel room to have it. Sure. There’s a chance.” But regardless, the point I was making was that people need to be aware of how their comments might make someone feel extraordinarily uncomfortable and even feel as though they are in danger. This person failed to recognize that even though I had been speaking about little else all day long.” Vaihtoehtoja on nyt kaksi. Joko mies on oikeasti vain täysin ajattelematon, eikä ole kaikesta huolimatta tajunnut tekevänsä Watsonin oloa epämukavaksi. Toinen vaihtoehto on, että hän on asiasta täysin tietoinen. Hän on valmis aiheuttamaan Watsonille epämukavan olon, jos se tarkoittaa mahdollisuutta saada seksiä. Ei, kahville pyytäminen ei tarkoita, että ihminen olisi millään mielekkäällä todennäköisyydellä raiskaaja. Edes kahville pyytäminen kun ollaan hississä kahdestaan ei tarkoita sitä. Mutta se, että ihminen joka ei selkeästikään kunnoita mukavuusrajojasi ja on kiinnostuneempi omasta nautinnostaan kuin siltä mitä sinusta tuntuu ehdottaa jotakin tuollaista? Siinä kohtaa on jo aiheellista soittaa muutamia hälytyskelloja. Etenkin jos on sellaisessa tilanteessa, jossa ei todennäköisesti saisi mistään apua jos toinen kävisi päälle. Kun Watson sanoi ei, niin mies hyväksyi sen kiltisti. Luultavasti kyseessä oli siis vain puhdas ajattelemattomuus. Mutta riski oli todellinen vaikkakin edelleen epätodennäköinen – kenties jotain 0,1 ja 1 prosentin väliltä. Mahdolliset seuraukset huomioonottaen se on tarpeeksi suuri riski siihen, että asiasta on jo aiheellista hermostua. Kantaani on kritisoitu sillä, että jos paheksumme miehen käytöstä tuossa tilanteessa, päädymme vielä kieltämään kaiken mikä saattaakin ahdistaa jotakuta. En voi olla samaa mieltä. Mahdollinen piittaamattomuus toisen tunteista on varoittava merkki, ei jotakin täysin tuulesta temmattua josta on täysin turha huolestua. Etenkin, kun Watson on saanut sähköposteja, joissa ihmiset ovat sanoneet toivovansa, että hänet “raiskattaisiin ja kidutettaisiin ja tapettaisiin”. Etenkin, kun Watsonia on kosketeltu konferenseissa luvatta aiemminkin. Niin pitkään kuin naisiin kohdistuu tuollaista käytöstä, on täysin perusteltua olla varuillaan mahdollisesti uhkaavissa tilanteissa. Tietenkin on epäreilua, että siinä samassa täysin viattomatkin miehet joutuvat epäillyiksi. Tietenkin olisi parempi, jos hyvää tarkoittavien miesten – ja naisten – ei tarvitsisi olla varpaillaan ja varoa käytöstään. Mutta se vaatii sen, että saamme ne loputkin miehet lopettamaan asiattomien sähköpostien lähettelyn, luvattoman kähmimisen ja varsinaiset raiskaukset. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
