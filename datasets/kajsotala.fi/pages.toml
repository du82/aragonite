title = "Lisääkö talouskasvu hyvinvointia? | Kaj Sotala"
description = "Talouskasvu lisää selkeästi aineellista vaurauttamme, mutta totumme nopeasti muuttuneeseen elintasoon, joten ei ole varmaa missä määrin talouskasvu lisää varsinaista hyvinvointiamme."
full_description = "Lisääkö talouskasvu hyvinvointia? Posted on Feb 26, 2012 in Finnish Essays, Finnish Posts | 0 comments Talouskasvu lisää selkeästi aineellista vaurauttamme, mutta totumme nopeasti muuttuneeseen elintasoon, joten ei ole varmaa missä määrin talouskasvu lisää varsinaista hyvinvointiamme. Mitä talouskasvu on. Alkuun minun on määriteltävä, mitä tarkoitan talouskasvulla. Englanti-Wikipedian määritelmä on ”talouden kasvava kyky tyydyttää yhteiskunnan jäsenten halut tuotteille ja palveluille”. Kirjahyllyssäni oleva taloustieteen oppikirja taas puhuu talouden kyvystä tuottaa enemmän hyödykkeitä käyttämättä välttämättä kuitenkaan enempää resursseja. Nämä ovat aika lähellä sitä talouskasvun määritelmää jota tarkoitan, joten mennään niillä. Klassinen talousliberaali argumentti menee osapuilleen seuraavasti: ”Vapaassa markkintaloudessa jokainen voi ansaita elantonsa tekemällä jotain, millä on arvoa toisille ihmisille. Vastineeksi hän saa asioita, joilla on arvoa hänelle. Talouskasvun myötä saman asian tekemiseen tarvitaan yhä vähemmän ihmisiä ja luonnonvaroja. Entisaikaan valtaosa väestöstä oli sidottu pelkkään maanviljelyyn. Nykyään koko yhteiskunnan ruokkimiseen tarvitaan vain pieni määrä maanviljelijöitä ja muut ovat vapaita tekemään muuta. Yksi Fordin varhaisista tehtaista kokosi autoja käsityönä ja sai valmistettua vain 11 autoa ensimmäisen olemassaolokuukautensa aikana. Kymmentä vuotta myöhemmin saman yhtiön kehittyneempi tehdas tarvitsi vain puolitoista tuntia yhden auton kokoamiseen. Kun tuotanto näin tehostuu, hinnat halpenevat ja jokainen tarvitsee yhä vähemmän rahaa saadakseen yhä enemmän sellaisia asioita, joilla on hänelle arvoa. Tuotantomäärien kasvun lisäksi tuotteiden laatu paranee, ja yhä harvinaisempia ja erikoisempia haluja voidaan palvella. Aikoinaan keskiluokkainen ihminen sai olla tyytyväinen mikäli ei joutunut näkemään koko vuoden aikana kertaakaan nälkää. Nykyään vastaavan sosiaaliluokan ihmisellä on varaa nauttia erinomaisesta ruuasta, hyvännäköisistä vaatteista, niin paljosta kirjallisuudesta, elokuvatarjonnasta, musiikista, videopeleistä ja muusta viihteestä kuin vain ehtii, ulkomaanmatkoista, toisella puolella planeettaa olevien ihmisten kanssa keskustelmisesta tosiaikaisesti, ja niin edelleen. Kaikki tämä on tullut mahdolliseksi talouskasvun myötä.” Pidän tätä argumenttia pääpiirteissään oikeana. Olen samaa mieltä siitä, että talouskasvun myötä tulee yhä helpommaksi tyydyttää entistä paremmin yhä suurempaa kirjoa ihmisten haluja. Kysymys siitä, tyydyttääkö talouskasvu ihmisten haluja entistä paremmin, on kuitenkin eri kuin kysymys siitä, lisääkö talouskasvu ihmisten hyvinvointia. Tarpeiden tyydyttäminen vastaan hyvinvointi. ”Hyvinvoinnilla” tarkoitan jotakin, mistä psykologisessa tutkimuksessa käytetään ilmaisua ”subjektiivinen hyvinvointi” (subjective well-being) [1]. Siihen kuuluu osa-alueita kuten yksilön yleinen tyytyväisyys elämäänsä sekä hänen kokemiensa positiivisten ja negatiivisten tuntemuksien ja tunnetilojen määrä. Arkikielisesti voitaisiin puhua onnellisuudesta. Lisääkö talouskasvu siis hyvinvointia? Se varsin todennäköisesti tekee sitä köyhissä maissa, joissa ruuansaannin ja terveydenhoidon kaltaiset perusedellytykset eivät täyty. Elämästään on vaikea nauttia, jos joutuu joka päivä miettimään sitä, mistä saisi jotain suuhunpantavaa. Näissä maissa talouskasvu onkin positiivinen voima, joka tälläkin hetkellä nostaa miljoonia ihmisiä vuodessa pois köyhyydestä. Mutta lisääkö talouskasvu hyvinvointia länsimaissa, joissa elämän perusedellytykset ovat jo kunnossa? Vastaus kysymykseen on kiistanalainen. Ns. Easterlinin paradoksi viittaa tutkimustulokseen, jonka mukaan rikkaampien maiden asukkaat ovat tyypillisesti onnellisempia kuin köyhien maiden asukkaat, mutta maan keskimääräinen onnellisuus ei tunnu kasvavan maan rikastuessa. Kyseisestä tuloksesta on väännetty taloustieteilijöiden keskuudessa kättä aina 1970-luvulta lähtien, mutta käsittäkseeni sitä ei olla pystytty vakuuttavasti kumoamaan, joskaan ei aivan aukottomasti osoittamaankaan. Koska tulokset eivät ole aivan yksiselitteisiä, tarkastelen seuraavaksi joitakin teoreettisia syitä sille, miksi talouskasvu ei lisäisi hyvinvointia. Sopeutuminen muutoksiin. Merkittävin syy on, että ihmiset tottuvat yllättävänkin nopeasti muuttuneisiin olosuhteisiin. Saatamme uneksia pitkään ylennyksestä, ison projektin saamisesta valmiiksi tai jostakin kalliista ostoksesta, mutta tyypillisesti asian saavuttamisesta seuraava ilo menee nopeasti ohitse. Pian unelmoimme jo seuraavasta asista, ja miltei jo unohdamme sen, että aiempi asia koskaan olikaan meille niin tärkeä. Psykologisessa tutkimuksessa on osoitettu, että kullakin ihmisellä on tietty luonteesta riippuva onnellisuuden perustaso, josta suurin osa muutoksista ei pysty muuttamaan kuin väliaikaisesti. Monet valtaisetkin elämänmuutokset, kuten lottovoitot, ylennykset, potkujen saaminen, ja jopa selkärankahalvaantuminen tuottavat onnellisuustilassa voimakkaan mutta lyhytaikaisen muutoksen [1]. Tämänlaisten tapahtumien vaikutukset onnellisuuteen hälvenevät tyypillisesti viimeistään vuoden sisään, kun ihmiset tottuvat uuteen tilanteeseensa [1, 2]. Myös taloudellisen tilanteen vaikutus onnellisuuteen katoaa, kun ihmiset saavuttavat sen pisteen, jossa heidän ei tarvitse enää huolehtia elämänsä perusedellytyksistä. Ihminen joka joutuu jatkuvasti miettimään, onko hänellä varaa syödä, on vähemmän onnellinen kuin sellainen joka ei joudu. Mutta vaurastumisella ei tuon pisteen jälkeen enää ole merkittävää vaikutusta hyvinvointiin. Ajatus siitä, että totumme nopeasti valtaosaan elintason muutoksista, voi olla joidenkin mielestä vaikea uskoa. Mutta vaikka siihen ei uskoisikaan, on silti järkeenkäyvää ajatella, että taloudellinen tilanne ei tietyn pisteen jälkeen vaikuttaisi onnellisuuteen. Ihmiset pyrkivät käyttämään rahaa ensisijaisesti niihin asioihin, jotka kokevat itselleen tärkeimpinä. Ensin maksetaan vuokra ja ruoka, sitten kiinnostavimmat harrastukset, ja sitten jos rahaa jää yli, niin mietitään jos vielä haluttaisiin jotain lisää. Mitä enemmän rahaa on käytettävissä, sen vähemmän jää jäljelle sellaisia asioita, joita haluaisi kovasti mutta joihin ei ole varaa. Tämä tunnetaan taloustieteessä laskevan rajahyödyn periaatteena – mitä enemmän ihmisellä on jotain asiaa (kuten rahaa) omasta takaa, sen vähemmän hän hyötyisi siitä että saisi sitä jotain lisää. Vaikka talouskasvun myötä saisikin hankittua samalla rahamäärällä yhä enemmän asioita, talouskasvun jatkuessa käy yhä epätodennäköisemmäksi, että niille ylimääräisille asioille olisi merkittävää käyttöä. Osaammeko investoida hyvinvointiin? Voi toisaalta myös olla, että ihmiset eivät vain osaa ostaa niitä asioita, jotka tekisivät heidät onnellisimmiksi. Positiivisten ihmissuhteiden määrä ja laatu on yksi niistä asioista, joilla on todettu olevan selkeä ja pysyvä vaikutus hyvinvointiin. On olemassa jonkin verran näyttöä siitä, että kokemusten – esimerkiksi hiihtolomien, konserttien tai aterioiden – ostaminen tekee ihmiset onnellisemmiksi kuin tavaroiden – esimerkiksi vaatteiden, korujen tai elektroniikan. Osasyyksi on esitetty, että kokemukset antavat meille tilaisuuden viettää aikaa ihmisten kanssa, siinä missä tavaroita ostetaan usein osittain siksi, että tehtäisiin muihin ihmisiin vaikutus. Tai kuten psykologi Jonathan Haidt tiivistää asian, ”asioiden tekeminen yhdistää meidät toisiimme, siinä missä tavarat usein erottavat meitä toisistamme”. [2, 3] Mikäli talouskasvu auttaa meitä saavuttamaan parempia kokemuksia muiden ihmisten kanssa, voi se tehdä meidät onnellisimmiksi. Jos kasvu taas kohdistuu pääosin vain parempien tavaroiden kehittämiseen, tai jos markkinointi saa meidät haluamaan yhä enemmän tavaroita, emme välttämättä voi siitä yhtään paremmin. Toinen tähän liittyvä ongelma on, että asiat, joita on helpoin markkinoida eivät mitenkään väistämättä ole niitä, jotka saavat meidät voimaan parhaiten. Suurimmat voitot ja siten myös suurimmat markkinointibudjetit kertyvät niille, jotka voivat myydä ihmisille asioita kerta toisensa jälkeen. Aliedustetuiksi jäävät sellaiset asiat, joita ihmisten ei tarvitse hankkia kuin muutaman kerran. Esimerkiksi roolipeliala on pysynyt niin pienenä kuin on osittain siksi, että suosittujenkin pelien ostajat pystyvät usein pelikirjan-pari hankittuaan käyttämään niitä peleihinsä vuosikausia, ostamatta alkuperäiseltä tekijältä enää mitään muuta. Ei ole mitään erityistä syytä olettaa, että jonkin asian markkinoitavuus ja tuottavuus kulkisivat käsi kädessä sen kanssa, miten paljon se tekee meitä onnellisemmiksi. Toisaalta nettiin on ajan kuluessa syntynyt yhä enemmän tiiviitä yhteisöjä, joiden kautta ihmiset voivat olla läheisissä tekemisissä keskenään ja mm. osallistua yhteisöllisesti kiinnostavien projektien rahoittamiseen. Tämäkin on talouskasvua, vaikka sitä ei sellaiseksi heti miellettäisikään – ja se tuottaa ihmisille nimenomaan kokemuksia. Kenties ajan kuluessa ihmiset tiedostavat yhä paremmin sen, mikä todella tuottaa hyvinvointia, ja talouskasvu ohjautuu luonnostaan siihen suuntaan. Talouskasvu ja länsimaiden köyhät. Aiemmista huomioista herää eräs kysymys. Mikäli kerran ihmisten taloudellinen tilanne voi vielä länsimaissakin olla niin huono, että se vähentää elämänlaatua, eikö lisätalouskasvu olisi silloin edelleen hyödyksi? Ehkä tarvitsemme lisää talouskasvua varmistaaksemme, että köyhimpienkään ihmisten ei tarvitse huolehtia peruspärjäämisestään? Jollain tasolla ajatus pitää varmasti paikkansa: mitä vähemmän ihmiset joutuvat uhraamaan omasta elämäntasostaan auttaakseen muita, sen helpommaksi myös köyhimpien auttaminen tulee. Monissa maissa, Suomi mukaanlukien, rikkinäiset sosiaaliturvajärjestelmät tuntuvat kuitenkin olevan yksi köyhyyden suurimpia syitä. Kannustinloukkujen poistaminen ja suoranaisen köyhimpien päähänpotkimisen lopettaminen olisivat muutoksia, jotka voitaisiin toteuttaa heti ja ilman ylimääräistä talouskasvuakin. Perustulon käyttöönotto auttaisi vähävaraisimpia tällä hetkellä paljon enemmän kuin merkittäväkään talouskasvu. (Se todennäköisesti jopa lisäisi talouskasvua.) Tiede ja teknologia. On vielä yksi merkittävä asianhaara, jota en ole vielä käsitellyt. Talouskasvu liittyy hyvin läheisesti tieteelliseen kehitykseen: olenkin jossain määrin käsitellyt näitä kahta samana asiana. Tekniikan kehittyessä paranee myös kykymme parantaa tauteja, käyttää asioiden tuottamiseen vähemmän luonnonvaroja, ja niin edelleen. Mitä voimakkaampi talous, sen enemmän meillä on varaa käyttää myös rahaa tekniikan kehitykseen. Tieteen ja tekniikan kehityksen vaikutus hyvinvointiin on kuitenkin liian laaja aihe käsiteltäväksi tässä. Tyydyn vain sanomaan, että tiede tuntuu tuovan mukanaan paljon lupaavia asioita, mutta myös paljon uhkaavia. Näiden nettovaikutusta on mahdotonta arvioida tällä hetkellä. Yhteenvetona olennaisimmista huomioista: Talouskasvu lisää selkeästi aineellista hyvinvointiamme ja kykyämme tyydyttää erilaisia halujamme. Talouskasvu todennäköisesti lisää hyvinvointia kehitysmaissa, mutta länsimaissa asia on paljon kiistanalaisempi. Ihmisillä on tietty onnellisuuden perustaso, ja merkittävä osa haluistamme on luonteeltaan sellaisia, ettei niiden tyydyttäminen vaikuta tuohon perustasoon kuin korkeintaan hetkellisesti. Totumme muuttuneeseen elintasoon nopeasti. Ei ole selvää, tarvitsemmeko enää enempää aineellista hyvinvointia. Toisaalta talouskasvu voi auttaa meitä hankkimaan parempia kokemuksia, jotka mahdollisesti nostavat onnellisuutta. Ei myöskään ole selvää, missä määrin talouskasvu tosiaan ohjautuu parempien kokemusten – tai ylipäätään hyvinvointiamme lisäävien asioiden – hankkimiseen. Asioiden markkinoitavuus ei välttämättä korreloi niiden hyvinvointia lisäävän vaikutuksen kanssa kuin heikosti. Talouskasvu voisi auttaa köyhimpiä, tosin kunnon perustulo auttaisi enemmän. Lisääkö talouskasvu siis hyvinvointia, näin loppujen lopuksi? Hitostako minä muka tietäisin. Lähteitä [1] Diener, E. (2000). Subjective well-being: The science of happiness and a proposal for a national index. American Psychologist, vol 55., no. 1, 34-43. http://internal.psychology.illinois.edu/~broberts/Diener%202000.pdf [2] Haidt, J. (2006) The Happiness Hypothesis: Finding Modern Truth in Ancient Wisdom. http://www.amazon.com/Happiness-Hypothesis-Finding-Modern-Ancient/dp/0465028020/ [3] Van Boven, L. & Gilovich, T. (2003) To Do or to Have? That Is The Question. Journal of Personality and Social Psychology, vol. 85, no. 6, 1193-1202. http://psych.colorado.edu/~vanboven/VanBoven/Publications_files/vb_gilo_2003.pdf Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
