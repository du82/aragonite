title = "Sydämeni on vasemmalla, aivoni eivät tiedä missä olisivat | Kaj Sotala"
description = "Jos minulta kysyttäisiin olenko oikealla vai vasemmalla, en osaisi vastata. Tai ainakaan en osaisi tiivistää vastaustani pariin sanaan. Pohjimmaisia arvojani voi pitää suhteellisen vasemmistolaisin…"
full_description = "Sydämeni on vasemmalla, aivoni eivät tiedä missä olisivat Posted on Sep 18, 2011 in Finnish Essays, Finnish Posts | 0 comments Jos minulta kysyttäisiin olenko oikealla vai vasemmalla, en osaisi vastata. Tai ainakaan en osaisi tiivistää vastaustani pariin sanaan. Pohjimmaisia arvojani voi pitää suhteellisen vasemmistolaisina. Minusta valtion tehtävänä on luoda tilanne, jossa mahdollisimman moni yhteiskunnan jäsen voi mahdollisimman hyvin. Pidän vapautta tärkeänä, mutta pohjimmiltaan kuitenkin välinearvona. Jos valtion harjoittama sääntely vähentää vapautta mutta lisää hyvinvointia, on tilanne minusta hyväksyttävä. Koen pohjimmiltaan epäreiluksi sen, että eri ihmiset saavat eri määrän palkkaa vain, koska tekevät eri töitä. Toisaalta on selvää, ettei suunnitelmatalous toimi. Vapaa markkinatalous luo tilanteen, jossa jokainen voi vapaasti toteuttaa omia halujaan ja tarpeitaan. Kilpailu auttaa pitämään hinnat alhaalla, ja kysynnän ja tarjonnan mekanismit ohjaavat tuotantoa paljon tehokkaammin, kuin mikään valtiollinen järjestelmä. Päättäjiä on usein monta syytä epäillä, ja ylhäältä päin sanellut päätökset ovat herkästi huonompia kuin ihmisistä itsestään lähtevät. Mutta puhdas markkinatalouskaan ei tunnu oikealta. Minulla on pitkään ollut tarkoituksena laatia “mihin valtiota tarvitaan”-niminen kirjoitussarja, joka kävisi lävitse pitkän listan vapaan markkinatalouden ongelmia. Vapaa päätöksenteko aiheuttaa ylituotantoa mikäli tuottaja ei maksa kaikkia tuotannon kustannuksia (esim. saasteiden aiheuttamia haittoja) (negatiiviset ulkoisvaikutukset). Toisaalta seuraa alituotantoa, mikäli kolmannet osapuolet keräävät merkittäviä hyötyjä mitä tuottaja ei saa (positiiviset ulkoisvaikutukset). Ihmisille saattaa olla yksilöllisesti hyödyllistä toimia yhdellä tavalla, vaikka olisi kokonaisuudessaan kannattavampaa jos kaikki toimisivat toisin (koordinaatio-ongelmat ja osittaisoptimointi). Yksi yritys voi saavuttaa aseman, jossa se voi ilman valtion väliintuloa pyytää kuluttajilta käytännössä mielivaltaisia hintoja (luonnolliset monopolit). Korkeat tuloerot voivat herkästi johtaa epätasa-arvoiseen ja segregoituneeseen yhteiskuntaan, joka toimisi paremmin jos tuloeroja tasattaisiin. Klassinen vapaan markkinatalouden ideaali olettaa myös ihmiset rationaalisiksi, omia halujaan järkevästi toteuttaviksi yksilöiksi. Mitä enemmän opin ihmispsykologiasta, sen skeptisemmin suhtaudun tähän ajatukseen. Ihmiset tavoittelevat sitä minkä kuvittelevat tekevän heidän onnellisiksi, eivät sitä mikä todella tekisi heidät onnelliseksi. Ja mitä tyypilliseen ihmiskäytökseen tulee, on tämäkin usein liioittelua: ihmiset tekevät usein asioita, joita tietävät katuvansa myöhemmin. Ihmiset eivät myöskään pyri uskomaan asioita jotka ovat tosia, vaan asioita joihin on mukava uskoa. Talouskasvu on valtaisan hyvä asia kehitysmaissa, mutta länsimaissa sen hyöty on paljon kyseenalaisempi. Mutta tarkoittaako mikään tästä sitä, että olisi perusteltua kannattaa vahvaa valtiota? Libertaareja on montaa lajia, mutta heistä järkevimmät päättelevät jotakuinkin seuraavasti: I think my libertarianism rests chiefly on the empirical proposition—a factual belief which is either false or true, depending on how the universe actually works—that 90% of the time you have a bright idea like “offer government mortgage guarantees so that more people can own houses,” someone will somehow manage to screw it up, or there’ll be side effects you didn’t think about, and most of the time you’ll end up doing more harm than good, and the next time won’t be much different from the last time. Toisin sanoen vapaa markkinatalous on paha juttu, mutta valtio saa aikaan vieläkin pahempia tuloksia. Julkisen valinnan teorian mukaan valtion sääntely johtaa herkästi siihen, että päättäjät päätyvät eturyhmien ja firmojen taskuun. Teollisuudenaloja sääntelemään perustetut valtionvirastot päätyvät ajamaan kyseisten teollisuudenalojen etuja. Alussa hyvääkin tarkoittava valtiovalta tuottaa lopulta vapaata markkinatalouttakin pahemman tilanteen. Valtaan päässeet tahot käyttävät valtiota asenaan, jolla tuhota kilpailijansa. Mitä taas tulee ihmisten epärationaalisuuteen, valtaan pääseminen ei maagisesti tee ihmisestä rationaalisesti ajattelevaa. Tavallinen harhakuvitelmien vallassa oleva ihminen voi tyypillisesti vahingoittaa lähinnä itseään ja lähipiiriään. Eduskunnassa oleva harhakuvitelmainen ihminen voi vahingoittaa kaikkia maansa asukkaita, ja globalisaation myötä miltei koko ihmiskuntaa. Robin Hanson: Paternalism is policy intended to benefit some people by limiting their choices, like a parent who stops a kid from playing in the street. Examples include laws requiring professional licensing and product safety features, or banning risky buildings, food, drugs, and financial investments. […] To evaluate if paternalism is good or bad, we need more than the sort of evidence that would convince regulators that they are less biased than citizens, or that would convince citizens that they are less biased than regulators. After all, we expect each group to be biased in underestimating their own bias. Without such evidence, paternalism is just arrogance, i.e., an unsupported presumption by regulators of their own superiority. Päättäjät vaikuttavat usein aivan yhtä irrationaalisilta, kuin tavallinenkin kansa. Eli ehkä olisi pienempi paha, jos valtion tehtäviä rajoitettaisiin mahdollisimman paljon. Mutta sitten taas toisaalta… libertaarit esittävät monia hyviä huomioita, mutta ei ole mitenkään itsestäänselvää että he olisivat ääripessimisminsä suhteen oikeassa. Valtioilla, kuten ihmisyhteisöillä yleensä, tuntuu olevan selkeä taipumus ajautua huonompaan suuntaan. Mutta sääntely saa silti aikaan paljon hyvää ja tarpeellista. Pohjoismaat tuntuisivat olevan niin hyvinvoivia kuin ovat nimenomaan suhteellisen ison ja vahvan valtion vuoksi. Ehkä valtion mahdollistama hyvinvointi on saavutettavissa, vaikka se vaatisikin ikuista valppautta. Ehkä libertaarit korostavat valtiovallan huonoja puolia vähän liikaakin. Scott Siskind: (for example, it’s easy to think of ways modern Western civilization is better than primitive tribal civilization – more wealth, less prejudice, fewer tapeworms. There are also a few counterintuitive hard-to-understand ways primitive tribal civilizations are better than us – closer family bonds, more attuned to the natural world. And so many intellectuals focus on these to the exclusion of everything else and talk about how Western society is hopelessly corrupt and evil. Where they should be saying “Western civ is great, but not quite as great as the average person might think,” we instead get “Western civ is awful.” This passes unchallenged because the good things about Western civ like absence of tapeworms have become background noise to which everyone has adjusted. One interesting marker for this kind of behavior is that people still feel contrarian when they say it even though everyone who hears it agrees with them.) I feel that some aspects of opposition to regulation might be this kind of behavior. There’s a large background of successful regulation (like banning lead and fluorinating water and not dumping trash on the streets and so on) that no one ever notices (unless they’ve just come back from a country that doesn’t have it!) There’s also some highly available examples of regulation that goes wrong. People feel like these must be hard to catch and so can start a death spiral around how intelligent they are to notice. Kukaan ei tunnu oikeasti tietävän, missä oikea tasapaino valtion sääntelyn ja vapaan markkinatalouden välillä menee. En ainakaan minä. Tällä hetkellä kallistuin jossain määrin vahvan sosiaaliturvan ja varsin vapaiden markkinoiden yhdistelmään, mutta en tiedä onko sekään paras ratkaisu. Olen melko varma vain siitä, että tulen vielä muuttamaan mieltäni useaan otteeseen. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
