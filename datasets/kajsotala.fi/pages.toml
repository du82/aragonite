sh Posts | 0 comments A fiction-writing trick I find particularly compelling are open loops. A cliffhanger is an example: you want to know how the hero survives, so your thoughts keep looping back to the situation, trying to figure out what happens next. But you need the author to tell you. Really good writing uses open loops at the sentence level as well. The first sentence of the story is meaningful on its own, but... Read More Different kinds of language proficiency Posted on Feb 26, 2021 in English Posts | 2 comments It’s funny how forms asking for your language proficiency use “native language” to mean “best possible proficiency”. My native languages are Finnish and Swedish, but I’m out of practice with Swedish so my English vocabulary is way better than my Swedish. Though interestingly, speaking either Finnish and Swedish with someone give me a sense of emotional... Read More Bedtime reminiscences Posted on Feb 19, 2021 in English Posts | 0 comments Things that I imagine would be cool to do with my kids (if I manage to have some): taking bedtime as a moment to reminisce about the day together. Recalling enjoyable moments is by itself enjoyable. So ask, what parts of the day did you like? What were some good moments? What about it was enjoyable? At first, it’ll be just me mentioning things I noticed on that day: “You seemed to... Read More Unwitting cult leaders Posted on Feb 11, 2021 in English Essays, English Posts | 2 comments An insight that I’d kind of already had, but which this interview with Michael Taft (relevant section starts at about 32 minutes) helped crystallize: We tend to think of a “cult leader” as someone who intentionally sets out to create a cult. But most cult-like things probably don’t form like that. A lot of people feel a strong innate desire to be in a cult. In the podcast,... Read More November 10-day virtual meditation retreat Posted on Nov 23, 2020 in English Posts | 0 comments So yesterday I finished a 10-day virtual meditation retr