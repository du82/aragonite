title = "Fake qualities of mind | Kaj Sotala"
description = "There’s a thing where you’d like to have one “quality of mind”, but it’s not available, but you substitute it with a kind of a fake or alternative version of the same.…"
full_description = "Fake qualities of mind Posted on Sep 22, 2022 in English Posts | 3 comments There’s a thing where you’d like to have one “quality of mind”, but it’s not available, but you substitute it with a kind of a fake or alternative version of the same. Which is fine as long as you realize you’re doing it, but becomes an issue if you forget that what’s happening. For example, you have a job that you’re sometimes naturally motivated to do and sometimes you totally don’t feel like it. On the days when you don’t feel motivated, you substitute the motivation with an act of just making yourself do it. Which of course makes sense: it’s hard to be motivated all the time, and if you need to work anyway, then you need to find some substitute. But what happens if you forget that you’re doing this, and forget what it actually feels like to be naturally motivated? Then you might find yourself doing the mental motion of “pushing yourself” all the time and wonder why it is that you keep struggling with motivation and why work feels so unenjoyable. You might think that the answer is to push yourself more, or to find more effective ways of pushing yourself. And then you might wonder why it is that even when you do manage to more successfully push yourself, you keep feeling depressed. After all, the pushing was a substitute for situations when you’re not enjoying yourself, but need to work anyway! But it might be that you constantly pushing yourself is a part of the problem. It’s hard to be naturally motivated if you don’t give yourself the time (or if your external circumstances don’t give you the time) to actually let that motivation emerge on its own. That’s not to say that just easing off on the pushing would necessarily be sufficient. Often there’s a reason for why the pushing became the default response; the original motivation was somehow blocked, and you need to somehow identify what’s keeping it blocked. It’s easiest to talk about this in the context of motivation. Most people probably have some sense of the difference between feeling naturally motivated and pushing yourself to do something. But in my experience, the same dynamic can emerge in a variety of contexts, such as: Trying to ‘do’ creative inspiration, vs. actually having inspiration Trying to ‘do’ empathy, vs. actually having empathy Trying to ‘do’ sexual arousal, vs. actually getting aroused Trying to quiet your feelings, vs. actually having self-compassion As well as more subtle mental motions that I have difficulty putting into exact words. The more general form of the thing seems to be something like… a part of the brain may sometimes be triggered and create an enjoyable and ‘useful’ state of mind. Typically these states of mind are more accessible if you’re feeling safe and not feeling stressed. When you are more stressed, or the original states are otherwise blocked off, another part of the mind observes that it would be useful to have that original state again. So it tries to somehow copy or substitute for it, but because it doesn’t have access to the systems that would actually trigger that state, it ends up with an imperfect substitute that only somewhat resembles the original one. What needs to happen next depends on the exact situation, but the first step is to notice that this is happening, and that “keep doing the thing but harder” isn’t necessarily the solution. My friend Annie comments: The easiest way for me to identify when I’m doing this is if there start to be phrases / mantras / affirmations that frequently pop into my head uninvited, and it’s the exact same phrase each time. Used to happen all the time at my stressful marketing job. It’s as if one part of my brain is trying to push the rest of my brain to be the kind of person who would naturally think/say that, but because I think in concepts by default (followed by written words, followed by audio, followed by visual), I’ve learned to question the authenticity of thoughts that present themselves as audio first. Personally I notice the “lifeless phrases first” thing in the context of self-compassion. Actually feeling compassion towards myself, vs. the kind of mental speech that sounds vaguely comforting but is actually about hushing up the emotion or trying to explain why it’s unnecessary / wrong / already taken care of. Share this:TweetShare on Tumblr 3 comments Ivo September 28, 2022 I find that “keep doing the thing” helps though. If I’m at a party and in an uninterested state of mind, faking interest can lead to a conversation that sparks actual interest. I also find that faking empathy requires thinking about the situation of the other more deeply, sparking real empathy. And faking arousal, going with the flow of the other, tends to spark arousal. Reply Kaj Sotala September 29, 2022 Yeah, it can definitely work! I think that’s part of the difficulty, that even when it goes badly it might still work often enough or well enough that it feels like it makes sense to continue with it. Or it might be the case that it actually just works fine overall. Then there’s genuinely no immediate reason to change. And then it’s unobvious whether one is: * Living in a world where everything is actually fine, no need to change * Living in a world where it sometimes works and sometimes doesn’t, and maybe you’d be better off doing something about it * Living in a world where it doesn’t work at all and you need to do something totally different Especially since one can be at different points at different times – various factors seem to affect how well the thing works, so it might have started off as functional and then slowly gotten worse. Or started off as sometimes working and then gotten more consistently functional over time. Reply Jana August 4, 2023 I’m excited that you described something I’ve been working with past months. I don’t have any mechanism how to notice it is happening yet. Only in retrospective, I feel that the joy from life disappeared and I realize I tried to do things that I find useful/enjoyable/good in the past, but I was not genuinely feeling like doing that in that moment. Reply Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
