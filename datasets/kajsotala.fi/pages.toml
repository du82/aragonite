full_description = "Chapman, Kegan & sosiaalinen ja moraalinen kehitys Posted on Apr 2, 2017 in Finnish Posts | 0 comments Luin vihdoin David Chapmanin tiivistelmän psykologi Robert Keganin sosiaalisen ja moraalisen kehityksen mallista, ja totesin että tämähän on yllättävän kiinnostava kuvaus monista nykypäivän yhteiskunnallisista dynamiikoista. (Ainakin mikäli pitää paikkansa.) Mallin mukaan ihmisten moraalinen kehitys etenee viiden askeleen läpi. Askeleet 1-2 ovat relevantteja lähinnä vain lapsille,... Read More Yrittäjyys ja asenteet Posted on Feb 1, 2014 in Finnish Essays, Finnish Posts | 2 comments Yksi asenne, jota näkee Piilaakso-henkisessä startup-kulttuurissa paljon ja jonka mielelläni näkisin leviävän Suomeenkin, on suhtautuminen yrittäjyyteen likipitäen altruistisena toimintana. Tuossa kulttuurissa yrittäjä on ihminen, joka löytää uuden tavan parantaa muiden elämää, ja toteuttaa sen. Olen lukennut tuosta kulttuurista tulevia “miten ryhtyä... Read More Nyky-yhteiskunta ja motivaation kuolema Posted on Dec 29, 2013 in Finnish Essays, Finnish Posts | 5 comments Päivän Hesarissa olleesta mielipidekirjoituksesta: Kaikki lapset aloittavat innokkaina ekaluokan, mutta osalta motivaatio loppuu jatkuvien epäonnistumisten takia jo alakoulussa. […] Opeteltava aines on käsitteellistä, ja niinpä lapsi ei voi ymmärtää asioita, ne on vain muistettava. Minäkin olen yrittänyt opettaa 11-vuotiaalle väkisin kirkon herätysliikkeitä ja renessanssia –... Read More Kansalaisaloite on vaaleja luotettavampi tahdonilmaus Posted on Mar 12, 2013 in Finnish Posts | 0 comments Helsingin Sanomat uutisoi eduskunnan pääsihteeri Seppo Tiitisen vähättelevän kansalaisaloitetta: Hänen mukaansa uudella järjestelmällä ei ole tarkoitus muuttaa normaalia käytäntöä, jonka mukaan lainsäädäntöaloite on pääsääntöisesti hallituksella. “Kun aloitteenteko kohdentuu joko marginaalisiin tai muutoin riidanalaisiin asioihin, se ei voi olla se tie, jolla... Read More Lisääkö talouskasvu hyvinvointia? Posted on Feb 26, 2012 in Finnish Essays, Finnish Posts | 0 comments Talouskasvu lisää selkeästi aineellista vaurauttamme, mutta totumme nopeasti muuttuneeseen elintasoon, joten ei ole varmaa missä määrin talouskasvu lisää varsinaista hyvinvointiamme. Read More Sydämeni on vasemmalla, aivoni eivät tiedä missä olisivat Posted on Sep 18, 2011 in Finnish Essays, Finnish Posts | 0 comments Jos minulta kysyttäisiin olenko oikealla vai vasemmalla, en osaisi vastata. Tai ainakaan en osaisi tiivistää vastaustani pariin sanaan. Pohjimmaisia arvojani voi pitää suhteellisen vasemmistolaisina. Minusta valtion tehtävänä on luoda tilanne, jossa mahdollisimman moni yhteiskunnan jäsen voi mahdollisimman hyvin. Pidän vapautta tärkeänä, mutta pohjimmiltaan kuitenkin välinearvona.... Read More Saako hississä pyytää seksiä? Posted on Jul 8, 2011 in Finnish Essays, Finnish Posts | 0 comments Hissit ovat näemmä päivän Internets-puheenaihe. Riippuen siitä keneltä kysyy, puhe on feministeistä jotka pitävät kaikkia miehiä potentiaalisina raiskaajina, siitä että viattomasta ehdottelusta ärsyyntyvät eivät välitä tyttöjen ympärileikkauksista, tai siitä että kahville pyytäminen on ahdistelua. Anteeksi mitä? Juttu alkoi viattomasta videoblogauksesta, jossa Rebecca... Read More Vapauden hintana on ikuinen valppaus Posted on Apr 19, 2011 in Finnish Essays, Finnish Posts | 0 comments Demokratian suurin ongelma ja etu on, että päätökset tehdään enemmistön halun mukaan. Se johtaa sekä epäreiluun päätöksentekoon ja eturyhmien suosimiseen, että vääryyksien välttämiseen ja asioiden paranemiseen. Asiat voivat mennä parempaan suuntaan, mutta se vaatii jatkuvaa työtä niiden eteen. Kuvitellaan, että ison valtatien varrella asuu sata maanviljelijää. Valtatieltä... Read More Kolme syytä epäillä valtiovaltaa Posted on Apr 15, 2011 in Finnish Essays, Finnish Posts | 0 comments En pidä valtiota vihollisena tai pahana mörkönä. Siitä huolimatta on kolme hyvää syytä suhtautua epäluuloisesti kaikkeen valtion toimintaan. 1.