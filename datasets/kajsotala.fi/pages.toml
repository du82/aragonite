["https://kajsotala.fi/2010/11/viisi-ainetta-jotka-toisin-peruskouluun"]
title = "Viisi ainetta, jotka toisin peruskouluun | Kaj Sotala"
description = "Nykymuotoinen koulu ei opeta elämässä oikeasti tarvittavia taitoja. Merkittävän osan siitä, mitä olen oppinut ja josta minulle on ollut todellista hyötyä elämässä, olen oppinut koulun ulkopuolella …"
full_description = "Viisi ainetta, jotka toisin peruskouluun Posted on Nov 22, 2010 in Finnish Essays, Finnish Posts | 0 comments Nykymuotoinen koulu ei opeta elämässä oikeasti tarvittavia taitoja. Merkittävän osan siitä, mitä olen oppinut ja josta minulle on ollut todellista hyötyä elämässä, olen oppinut koulun ulkopuolella törmättyäni siihen sattumalta. Sen sijaan lukuisat oppitunnit peruskoulussa ja lukiossa opettivat hyvin vähän hyödyllistä, etenkin niihin käytettyyn aikaan nähden. Käytännössä koulu on myös monien mielestä epämotivoivaa, koska kaikki tietävät että harvasta siellä opitusta asiasta on oikeassa elämässä mitään hyötyä. Mitä koulussa sitten pitäisi opettaa? Tässä tämänhetkinen top 5-listani. 1. Empatia. Mutta eihän empatiaa voi opettaa? Kyllä voi. Roots of Empathy (Empatian juuret) on vuonna 1996 alkanut ohjelma, joka on toiminut lähes 13 000 koululuokassa ympäri Kanadaa ja sittemmin laajentunut myös muihin maihin. Ohjelmaan tarvitaan vapaaehtoinen vanhempi ja hänen vauvansa, joka on kouluvuoden alkaessa 2-4 kuukautta vanha. Vanhempi, vauva ja koulutettu ohjaaja käyvät luokkahuoneessa joka kuukausi yhdeksän kuukauden ajan. Näiden vierailujen aikana vauva istuu luokan keskellä, ja lapset koettavat ohjaajan avulla ymmärtää vauvan tuntemuksia. Tulokset ovat olleet vaikuttavia. Luokan oppilaat, häiriköistä ujoimpiin, avautuvat ja pehmentyvät. Teini-ikäiset laulavat yhdessä lastenloruja. Lapset oppivat näkemään asiat pienen vauvan näkökulmasta ja iloitsemaan siitä, miten tämä vähitellen oppii uusia taitoja. Ja vaikutukset kestävät myös vauvan ja äidin lähdettyä: lasten välit paranevat ja koulukiusaaminen vähenee. He eivät vain opi katsomaan asioita vauvan näkökulmasta, vaan ylipäätään asettamaan itsensä toisten asemaan. (Empatian juuret-ohjelmasta enemmän tässä mainiossa artikkelissa.) Ihminen jolla on huono päivä ajattelee muiden ymmärtävän, että hänellä on vain huono päivä eikä hän yleensä ole tämänlainen. Kuitenkin kun hän näkee muita ihmisiä joilla on huono päivä, olettaa hän tyypillisesti että he käyttäytyvät vihaisesti koska he ovat luonnostaan vihaisia. Emme luonnostaan asetu muiden ihmisten asemaan yhtä hyvin kuin voisimme. Hyvä uutinen on kuitenkin, että heidän asemaansa asettuminen on vain tietty tapa ajatella, taito joka on opeteltavissa siinä missä mikä tahansa muukin. Sen sijaan että tulkitsisimme pienimmänkin tilaisuuden tullen kaikki pahoiksi ihmisiksi, voimme opetella ensin pohtimaan josko heidän toimillaan olisi muita selityksiä. Ja tähän auttaa, jos meille on opetettu eri tapoja joilla erilaiset ihmiset tyypillisesti asioihin reagoivat. Lääkäriopiskelijoiden koulutuksessa on saatu hyviä kokemuksia empatian kehittämisestä harjoituksissa, joissa opiskelijat lukevat potilaiden kertomuksia kokemuksistaan samalla kun itse kirjoittavat henkilökohtaisista sairastamiskerroistaan ja kuuntelevat muiden opiskelijoiden vastaavia kirjoituksia. Etenkin hyväosaisten on vaikea ymmärtää muiden ihmisten ongelmia, ellei niitä erikseen opeteta ymmärtämään. 2. Työelämäoppi (idea lainattu täältä). Harva tietää peruskoulun lopulla mitä haluaisi tehdä aikuisena: monet menevät lukioon saadakseen miettimäaikaa, mutta eivät tiedä sen paremmin lukion kuin välttämättä korkeakoulunkaan lopulla. Merkittävä syy tähän on, että vaikka erilaisia ammatteja ja töitä on valtaisa määrä, harva tietää juuri mistään niistä mitään. Sopivan työn löytäminen on kysymys joka vaikuttaa ihmisen koko loppuelämään, joten miksei eri ammatteihin tutustuminen ole omana aineenaan jo koulussa? En nyt tarkoita muutamaa hassua opotuntia peruskoulun lopulla tai yksittäistä TET-harjoittelujaksoa, vaan kunnollista perehtymistä. Sellaista, jossa vaikka 7. luokalta lähtien käytäisiin joka viikolla tutustumassa yhteen työpaikkaan, tai kutsuttaisiin kouluun joku kertomaan siitä mitä työtä hän tekee ja millaista se on. Joka työstä kerrottaisiin erilaisia käytännön tietoja, kuten millaista palkkaa siitä tyypillisesti saa, millaisia senhetkiset työllistymisnäkymät ovat ja mitä asioita sitä varten tarvitsee opiskella. Jokainen oppilas voisi valita esimerkiksi kolme kiinnostavimmalta vaikuttavaa työtä, jonka jälkeen heille yritettäisiin järjestää mahdollisuus seurata jotakin sen työn tekijää viikon ajan ja nähdä millaista se käytännössä oikein on. Tämän kautta peruskoulunsa päättävillä olisi paljon enemmän todellista tietoa siitä, mikä heitä saattaisi kiinnostaa. 3. Sosiaaliset taidot. Ellen tunne ihmistä erittäin hyvin, on minun vaikea aloittaa hänen kanssaan spontaania keskustelua. En ole läheskään ainoa, jolla on tämä ongelma. Toiset taas ovat tässä hyviä, ja asiaa olisi todennäköisesti suhteellisen helppo opettaa. Kuinka monella olisi enää vaikeuksia lähestyä vastakkaisen (tai saman) sukupuolen edustajia, jos peruskoulun aikana olisi ollut tehtävänä aloittaa vaikka sata vähintään kymmenen minuuttia kestävää keskustelua muiden oppilaiden kanssa, joista puolet poikia ja puolet tyttöjä? Tämä olisi myös melko turvallinen ympäristö jossa harjoitusta saada, sillä tuota tehtävää voisi aina käyttää (teko)syynä uuden keskustelun aloittamiseen, ja lähestyttävä osapuoli voisi samalla myös kartuttaa omaa keskustelukiintiötään. Muita vastaavia taitoja löytyy runsaasti. Olen joutunut omillani opettelemaan ainakin puheenvuoron ottamista ryhmäkeskustelussa ja keskustelun eri ulottuvuuksien (faktat, status, signalointi, sosialisointi) erottelemista toisistaan. Nettikeskusteluita pidempään seuranneet eivät varmaan ole erityisen eri mieltä siitä, että elämästä tulisi paljon mukavampaa jos ihmiset opetettaisiin ymmärtämään että kohteliaisuudella ja asiallisuudella voi usein olla paljon vakuuttavampi kuin hyökkäävydellä. Ja niin edelleen. 4. Kriittinen ajattelu. Monet ajattelevat (virheellisesti) esimerkiksi jotakin sensuuntaista, että koska mitään ei voi tietää varmasti, voi yhtä hyvin uskoa mihin tahansa. Samaan aikaan toiset takertuvat raudanlujasti täysin perustelemattomiin uskomuksiin, jotka uskovat absoluuttisesti tosiksi eivätkä edes yritä pyrkiä itsekritiikkiin. Molemmat ajattelutavat ovat vahingollisia. Ihmisten ajattelua tutkinut psykologi Keith Stanovich on kasannut pitkän listan haitallisia seurauksia joita puutteellisesta ajattelusta seuraa, sekä eritellyt eri ajatteluvirheitä tarkoituksenaan auttaa ihmisiä pääsemään niiden ylitse. Lesswrong.com -sivustolle on koottu pitkä sarja ajattelua ja tiedonfilosofiaa koskevia kirjoituksia, jotka aikoinaan mullistivat oman ajatteluni kokonaan ja tekivät siitä paljon selkeämmän ja jäsentyneemmän. 5. Onnellisuus. Aihetta tutkineet psykologit katsovat, että onnellisuus on ainakin osittain opeteltavissa oleva taito. Omaan lievään masennukseeni auttoi selvästi, kun luin listan masennukseen liittyvistä ajatusvääristymistä: pelkkä niiden tiedostaminen auttoi näkemään, miten naurettavia ne oikeasti olivatkaan. Oman onnellisuutensa kohottamiseksi on olemassa monenlaisia tapoja. Yksinkertaisimpiin kuuluu se, että koettaa muistaa hymyillä useammin: hymyilemme kun olemme hyvällä päällä, mutta hymyileminen saa meidät jo itsessään paremmalle päälle. Enemmän harjoitusta vaatiivia tapoja ovat mietiskely sekä itsensä opettaminen löytämään positiiviset puolet kaikesta. Itse koen eri tekniikoiden hyödyntämisen nostaneen keskimääräistä onnellisuustasoani aavistuksen, ja parhaina aikoina ne auttavat pitämään minut onnellisena ja hyväntuulisena koko päivän – siinä missä vielä vuosi sitten koin elämäni kohtalaisen harmaaksi ja innottomaksi. —- Viisi uutta ainetta on varsin paljon, ja jotain tarvitsisi vastineeksi vähentää. Väitän kuitenkin, että vaikka esimerkiksi maantiede, biologia, fysiikka, kemia, ja oma peruskouluaikojen suosikkiaineeni historia ovatkin kieltämättä hyödyllisiä, peruskoulutasolla opetettuna niiden yhteenlaskettukin hyöty on pienempi kuin yhdenkään yllä mainitsemani viiden aineen yksinään. Uskonkin, että mikäli koulut keksittäisiin vasta nyt ja niiden opetusohjelma pitäisi laatia puhtaalta pöydältä, päädyttäisiin lähes yksimielisesti siihen että yllä käsittelemäni viisi oppiainetta ovat aivan liian tärkeitä, jotta niitä voisi jättää opetuksesta pois. Muokkaus kello 15:30: Minulle kommentoitiin, että osa tästä sisällöstä on nykyisessä opetusohjelmassa jo. Se on varsin positiivista kehitystä, mutta epäilen kuitenkin ettei kaikkea ole, eikä etenkään sellaisessa laajuudessa kuin olisi jos kaikki viisi olisivat omia oppiaineitaan. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
