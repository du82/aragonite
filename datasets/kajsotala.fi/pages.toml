n my small closet, locked away from all other life. Read More The Flailer Posted on Sep 25, 2005 in Fiction | 0 comments A cold wind blew as Shaelin watched over the landscape. Read More The Gallows Tree Posted on Dec 30, 2005 in Fiction | 0 comments It's always a sunset by the gallows tree. Read More The Listener Posted on Mar 16, 2010 in Fiction | 0 comments The family had finally gotten their new house built. One of the first things they did was to throw a housewarming party and bring in the Listener. Read More The Phoenix Posted on Oct 3, 2003 in Fiction | 0 comments Mielea closed her eyes, silently drawing a deep breath. As she did so, the sharp, pungent smell of the volcano’s toxic gases made her throat and nostrils burn, the acrid feeling spreading down to her lungs. For a long moment, she held her breath, savoring the pain. Then she exhaled, the gas burning almost twice as much as it made its way over her throat again. Slowly she opened her eyes,... Read More To Live and Die for the God-Emperor Posted on Nov 15, 2005 in Fiction | 0 comments The party in the Menovian asteroid belt has been going on non-stop for ten millennia now. Read More Union Posted on Feb 20, 2007 in Fiction | 0 comments It began with simple emotion implants. I loved my girl more than I could ever express in words, and it pained me to know I could never communicate that feeling adequately enough. I watched her eyes when she said she loved me, and I knew that she was suffering from the same. Read More We’re Running Out of Adults Posted on Sep 23, 2002 in Fiction | 0 comments "We are running out of adults." The words were first heard in the office of the Minister of Weather, but few people paid any attention to them. Read More [Fiction] The boy in the glass dome Posted on Mar 3, 2023 in English Posts, Fiction | 0 comments A boy is sitting inside a glass dome. It would just barely have enough space for him to stand. It’s night, and he’s watching the stars. He has been doing that for a long time. There’s a small tube attached to the bottom of the dome. A miniature cargo train runs through that tube, bringing with it small bubbles of nutrients and oxygen. When the train reaches the dome, the bubbles... Read More [Invisible Networks] Goblin Marketplace Posted on Apr 3, 2022 in English Posts, Fiction | 0 comments "The Goblin Marketplace is that way. Assuming that you have ears on your head, you can't miss it." The expression is not metaphorical: even if you were deaf, you _would_ hear the sounds of the Marketplace. That is, assuming that nobody had cut your ears off. Read More « Older Entries Recent Posts “Miksi jonkun pitäisi saada käyttää kenkiä?” 1. Ainulindalë 14 objections against AI/Friendly AI/The Singularity answered 18-month follow-up on my self-concept work A Date with Darin This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback.'''
