["https://kajsotala.fi/2017/07/how-i-found-fixed-the-root-problem-behind-my-depression-and-anxiety-after-20-years"]
title = "How I found & fixed a major cause of my depression and anxiety | Kaj Sotala"
description = "EDIT Dec 18, 2018: For a followup of how the changes in this post have lasted, see “18-month followup on my self-concept work”. EDIT Aug 7th, 2022: As a five-year follow-up: the above f…"
full_description = "How I found & fixed a major cause of my depression and anxiety Posted on Jul 26, 2017 in English Essays, English Posts | 23 comments EDIT Dec 18, 2018: For a followup of how the changes in this post have lasted, see “18-month followup on my self-concept work“. EDIT Aug 7th, 2022: As a five-year follow-up: the above followup is still roughly correct, in that this did represent a major and significant change for the better, and at the same time there were also other causes of depression and anxiety that would eventually resurface. This post described split self-concepts as a “root cause” for my issues, but looking back, I should probably have realized to ask the question of why I had such split root causes in the first place. There were, in fact, deeper root causes which I have been working on healing afterwards. Still, it’s clear that the changes described here made lots of things better, and e.g. the thing about being constantly concerned about possibly feeling like a bad person at any moment is still gone. I was nine years old and about to soon turn ten, when I announced to my parents that I didn’t want any birthday presents, because I didn’t think that I’d done anything to deserve them. This left my parents more than a little puzzled and upset, especially when I later also insisted I didn’t want presents for other birthdays – nor for Christmas, for that matter. I didn’t even know myself where exactly I’d gotten that notion from. I just had a sense of, well, such special attention being undeserved. I’ve previously written about my depression and burnouts; usually I’ve said that my problems started during the second year of my university studies, when I tried to take on too many courses at once and burned out for the first time. But that raises the question of why I drove myself to burnout in the first place. The real root problem was something much deeper, and older: a hard-to-describe feeling of emptiness and being insufficient, and a desperate desire to feel better somehow. Since school had been the one area in my life where I felt I had excelled, it was natural to try to satisfy that desire by studying hard. But, successful or not, just studying a lot wasn’t going to solve the root problem of feeling unworthy. This post is about how I finally managed to isolate and solve that root problem, what past problems I can now trace back to it, and how that has affected me. Why am I so confident that the problem really has been solved? First, I’ve mostly kept quiet about this change for five weeks, to see whether the improvements would last. They have lasted. While I’ve previously used a number of self-help techniques that just mysteriously stopped working at some point, none of those short-lived successes lasted this long before. Second, as I’m about to describe, the effects have been getting stronger over time: it feels like they set in motion a process of my psyche reorganizing itself. And third, well, the changes have been just so massive that it’s hard to imagine this being just a temporary thing. [EDITED TO ADD: A few people have asked whether I can be confident that this has really been sufficient to cure my depression, so I should clarify: I believe that this taken care of the original reason why I had feelings of insecurity, insufficiency etc., feelings which then drove me to do various things that led to burnout and depression. Whether the original cause of those behaviors and feelings has been dealt with, is a distinct question from whether the depression that they caused has been dealt with. After all, depression can cause various changes to the brain that linger long after the original cause is gone. I don’t know whether the depression will come back or not, but I do expect that many of the factors that originally caused it and maintained it have now been fixed; still, there may be others.] Finding the root cause: self-concept Last spring, things felt like they were going pretty well. After a painful breakup and a few other challenges, I had taken time off from work and decided that I would focus on getting my mental health in order. I had focused a lot on themes of self-compassion and made progress on that front, and I’d also found and started applying a powerful technique for fixing emotional problems. I’d also resumed my meditation practice, with good results. So, things were going pretty well… until my money was starting to run out and I went back to work. And then much of the depression that I thought I had beaten, came back. For some reason, my job felt utterly demotivating. I wasn’t quite sure of the exact reasons, but there was a strong sense of the work feeling pointless and sucking up all of my time, and none of the techniques for emotional healing seemed to make a dent in that. I made the following post on Facebook: I think the main problem with my life is that I’ve very rarely had the feeling that my existence would matter. (At this point I expect that a bunch of people are thinking about commenting something like “your existence does matter to me” – which is appreciated, but doesn’t actually help. This is more about the day-to-day experience, which isn’t much affected by individual events.) All of my jobs have been ones where basically nobody would have noticed if I’d just slacked off for the whole week, or in some cases whether I showed up at work at all. Occasionally I produce something that people notice and comment on, but those moments are pretty far between, since mostly the things that I work on take an extended time before there’s a point in showing them to anyone. If I keep making an active effort, I can have a pretty active social life… But as soon as I don’t, I don’t. There was one whole month when I only left home to get groceries, and aside for maybe one person who later commented about not having seen me for a while, it didn’t seem like anyone even noticed me not having been around. Intellectually, I know that my existence isn’t *totally* irrelevant. But when the day-to-day experience is that 90% of the time, my physical presence or absence goes basically unnoticed, it’s hard to really believe in that on an emotional level. And then… Matt Goldenberg suggested that the problem might be with my self-concepts and linked an article about self-concepts. The article was an excerpt from a book called Transforming Your Self, which I proceeded to buy. The model presented in the book is that self-esteem is composed of self-concepts: we might think of ourselves as having qualities like “smart”, or “kind”, or “thoughtful” – or, for that matter, “stupid” or “cruel”. Whether a quality is perceived as good or bad depends on the kinds of cultural messages we’ve internalized. Somebody growing up in a relatively sheltered Western culture might think of “cruel” as a negative concept, whereas somebody who grew up in a war zone where you have to be able to kill others in order to survive, might think of “cruel” as a positive concept. If you have lots of robust, positive-valued self-concepts, you’ll have a good self-esteem; if you have lots of negative-valued self-concepts, you’ll have bad self-esteem. While self-esteem is composed of self-concepts with different valuations, the self-concepts themselves are also composed of more fine-grained parts. More specifically, they’re composed of individual memories which serve as examples of the concept. So if you have a self-concept of being kind, you have at least one memory – typically more – of a situation where you acted in a kind way. (You can try this out. Pick some quality like honest, or kind, or intelligent, or sociable – something that you are sure is both true of you, and which you like. When you have found one, consider how you know that you have this quality. The exact way in which qualities are represented varies between people: do you have a mental picture of being that, or is it a feeling or an internal voice that tells it to you? There should be at least one memory associated with your quality – which memory is it?) The article that Matt linked gave the example of somebody creating an entirely new self-concept, of being lovable. The man in the example – Peter – did have individual memories of being lovable, but they had never been organized under a coherent concept before. When someone called him lovable, he was just nonplussed, drawing a total blank. “Lovable” just wasn’t how he thought of himself. After Peter consciously searched for memories which might fit the description, and organized them together to form a new self-concept, his behavior changed. He started liking himself more, and he became kinder in his interactions with others. Matt suggested that my sense of life being meaningless was about me not having a self-concept of “meaning”. Which sounded interesting… but not quite right. It felt more like my problem was something like with Peter, of having a missing self-concept around “lovable”, or something like that. I poked around that thought, got the book, read the book, tried to see if I could create such a self-concept… But there was also a sense that this wasn’t just a missing self-concept, but rather there was an existing negative one. And then as I was about to go bed, I realized that I had a sense of unease, a vague feeling of shame… as if there was something shameful about me that I knew, but was trying to avoid thinking about. And I knew that I had felt this same vague shame many times before, often particularly when I was tired. But because I had been instinctively trying to avoid thinking about it, I had never stopped to analyze it. Counterexamples In the book’s model, besides examples, a self-concept also has counterexamples. These are memories of cases where you failed to uphold the quality that the self-concept represents. For instance, if we are talking about kindness, then nobody is kind literally all the time. Maybe you’re generally kind, but grumpy and irritable when you’re hungry. In that case, besides having memories of times when you were kind, your self-concept would also have memories about being hungry and irritable and not being particularly kind at that time. In a healthy, robust self-concept, both examples and counterexamples form an integrated whole: the examples tell you what you generally are, and the counterexamples outline the caveats and exceptions. That way, knowing the limits of your quality, you can pay special attention to taking those limits into account. For instance, you might warn your kids in advance that you’re hungry so you are going to be grumpy, or you could make sure to eat before you start snapping at them. That’s how a self-concept works if it’s healthy. But it’s also possible for your counterexamples to be split off from your examples. This leads to an unstable and uncertain self-concept: either your attention is (on a subconscious level) focused on the examples and totally ignores the counterexamples, in which case you feel good and kind, or it swings to the counterexamples and totally ignores the examples, in which case you feel like a terrible horrible person with no redeeming qualities. Even if your attention is on the examples, there’s always an underlying insecurity, a sense of unease from the fact that anything might cause your attention to swing back to the counterexamples. You need a constant stream of external validation and evidence in order to keep your attention anchored on the examples; the moment it ceases, your attention risks swinging to the counterexamples again. A sense of unease about your thoughts going to something that might cause you to feel bad… that was a lot like that vague sense of shame I realized I was experiencing. So I looked at that sense of shame, poked at it in my mind. And some early memories came up. Memories of feeling like I’d been selfish – really old memories, back from when I was maybe 7 years old. In retrospect, they were about some pretty trivial incidents. A few fights that I’d had with my mom – probably pretty typical fights for a kid of 7 – and a general sense that I could get her to do a lot of things for me and that I was selfish in exploiting that to the full (as likely any kid would have, given the opportunity). But there was an aura of shame and guilt around them; a feeling which I could now feel had been around in many other incidents after that, but which had first manifested itself in these particular memories. Fixing the root problem Early on in the book, there’s this excerpt: For a long time, people have realized that our beliefs about others and our surroundings are often self-fulfilling. Someone who believes that the world is a dangerous and threatening place finds a world filled with fear, unhappiness, and disappointment. Someone who believes that the world is filled with vast opportunities and wonders to be experienced finds the very same world filled with endless variety, richness, and satisfaction. Even more important than these beliefs are the beliefs that you have about yourself, because your self-concept goes with you everywhere, and affects everything that you experience. If you believe that others are mean and stupid, you can retreat to the solitude of nature and be nourished. But if you believe that you yourself are mean and stupid, there is no escape-except the temporary ones of overwhelming stimulation, mind-numbing drugs, or sleep. On the other hand, if you believe in your own kindness and intelligence, these beliefs can sustain and support you, even when events and people around you are very difficult. That rang a bell. A very familiar bell. Back in 2014, I wrote about having a constant need to escape: It feels that, large parts of the time, my mind is constantly looking for an escape, though I’m not entirely sure what exactly it is trying to escape from. But it wants to get away from the current situation, whatever the current situation happens to be. To become so engrossed in something that it forgets about everything else. Unfortunately, this often leads to the opposite result. My mind wants that engrossment right now, and if it can’t get it, it will flinch away from whatever I’m doing and into whatever provides an immediate reward. Facebook, forums, IRC, whatever gives that quick dopamine burst. That means that I have difficulty getting into books, TV shows, computer games: if they don’t grab me right away, I’ll start growing restless and be unable to focus on them. Even more so with studies or work, which usually require an even longer “warm-up” period before one gets into flow. Exactly what was it that I was trying to escape from? The fact that, on some subconscious level, I disliked myself and wanted to get away from myself. Those early memories of being selfish, that I had – they had never been properly integrated with later memories of doing unselfish things. I had desperately tried to do all kinds of stuff to prove to myself that I wasn’t an entirely worthless person, but no matter how many positive e"
