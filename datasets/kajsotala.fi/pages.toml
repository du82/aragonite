full_description = '''Things I have been using LLMs for Posted on Jan 20, 2025 in English Posts | 5 comments There are quite a few different things you can use LLMs for, and I think we’re still only discovering most of them. Here are a few of the ones I’ve come up with. My favorite chatbot is Claude Sonnet. It does have a tendency for sycophancy – for example, it will go “what a fascinating/insightful/excellent/etc. question!” in response to most of the things you might ask it. Some... Read More Don’t ignore bad vibes you get from people Posted on Jan 18, 2025 in English Posts | 0 comments I think a lot of people have heard so much about internalized prejudice and bias that they think they should ignore any bad vibes they get about a person that they can’t rationally explain. But if a person gives you a bad feeling, don’t ignore that. Both I and several others who I know have generally come to regret it if they’ve gotten a bad feeling about somebody and ignored it... Read More You can validly be seen and validated by a chatbot Posted on Dec 20, 2024 in English Essays, English Posts | 0 comments There’s a common sentiment saying that a chatbot can’t really make you feel seen or validated. As chatbots are (presumably) not sentient, they can’t see you and thus can’t make you seen either. Or if they do, it is somehow fake and it’s bad that you feel that way. So let me tell you about ways in which Claude Sonnet makes me feel seen, and how I think those are... Read More Trying to translate when people talk past each other Posted on Dec 17, 2024 in English Essays, English Posts | 0 comments Sometimes two people are talking past each other, and I try to help them understand each other (with varying degrees of success). It’s as if they are looking at the same object, but from different angles. Mostly they see the same thing – most of the words have shared meanings. But some key words and assumptions have a different meaning to them. Often, I find that one person (call them... Read More Circling as practice for “just be yourself” Posted on Dec 16, 2024 in English Essays, English Posts | 0 comments I mentioned on Twitter that to a significant extent, Circling taught me what “just be yourself” means to such an extent that I have a consistently good time on dates because I don’t feel like I need to perform. Somebody asked me to elaborate, so here’s what I wrote in response: — For those who don’t know, Circling is… a practice that’s infamously... Read More My 10-year retrospective on trying SSRIs Posted on Sep 22, 2024 in English Posts | 1 comment In 2014 I got on SSRIs the first time, and they were amazing. I wrote online about how I suddenly had energy to do things, could concentrate on stuff, and generally just felt better and happier. I now got a message from someone who’d found my writings and was wondering what my experience with antidepressants was now, 10 years later. I wrote this reply to them, and thought I might as well... Read More Games of My Childhood: The Troops Posted on Jul 8, 2024 in English Posts | 0 comments The Troops (Finnish “joukot”, could also be translated as “the armies” or “the forces”) was a game of pretend that I played the most with my friend Eero; I believe Aleksi also joined in. The central premise was that each time that you played a video game and killed, recruited, rescued, built, or otherwise destroyed/obtained an enemy, character, or unit in that... Read More Indecision and internalized authority figures Posted on Jul 6, 2024 in English Posts | 0 comments A trauma book I was reading had an interesting claim that indecision is often because the person looks for the approval of an internalized authority figure (the writer is a Jungian therapist so attributed it to looking for the approval of an internalized parent, but I think it can be broader) but is unable to predict what action they would approve of. I feel like that has some intuitive truth... Read More Links and brief musings for June Posted on Jul 6, 2024 in English Posts | 0 comments Links in English Schrödinger’s Ursula Apparently the concept of Schrödinger’s cat got popularized thanks to Ursula Le Guin. Schrödinger originally invented the cat image as a gag. If true believers in quantum mechanics are right that the microworld’s uncertainties are dispelled only when we observe it, Schrödinger felt, this must also sometimes happen in the macroworld –... Read More Links for May Posted on Jun 1, 2024 in English Posts | 0 comments In English What would happen if a superintelligent AI was aligned with your values? The details here are a little too much in the “superintelligence is magic that can achieve anything” direction to my taste (I don’t think that anything will just be instantly teleported into safety, superintelligent AI or not), but I don’t doubt that the same results could be achieved via... Read More Why I no longer identify as transhumanist Posted on Feb 3, 2024 in English Posts | 1 comment Someone asked me how come I used to have a strong identity as a singularitarian / transhumanist but don’t have it anymore. Here’s what I answered them: ——- So I think the short version is something like: transhumanism/singularitarianism used to give me hope about things I felt strongly about. Molecular nanotechnology would bring material abundance, radical life extension... Read More My idea of sacredness, divinity, and religion Posted on Oct 29, 2023 in Blog, English Essays, English Posts | 1 comment Here’s a conception that I have about sacredness, divinity, and religion. There’s a sense in which love and friendship didn’t have to exist. If you look at the animal kingdom, you see all kinds of solitary species, animals that only come together for mating. Members of social species – such as humans – have companionship and cooperation, but many species do quite... Read More The 99% principle for personal problems Posted on Oct 2, 2023 in English Posts | 0 comments Often when people are dealing with an issue – emoti