title = "Tasa-arvo ei ole sukupuolikysymys | Kaj Sotala"
description = "Tasa-arvokeskusteluita tunnutaan välillä käyvän ikään kuin kyse olisi kahden joukkueen välisestä urheilumatsista. Esimerkiksi: “Naisvaltaisilla aloilla on huono palkka.” “Mutta ha…"
full_description = "Tasa-arvo ei ole sukupuolikysymys Posted on Oct 1, 2010 in Finnish Posts | 0 comments Tasa-arvokeskusteluita tunnutaan välillä käyvän ikään kuin kyse olisi kahden joukkueen välisestä urheilumatsista. Esimerkiksi: “Naisvaltaisilla aloilla on huono palkka.” “Mutta hahaa, miehiä syrjitäänkin huoltajuuskiistoissa! Koska miehillä on ongelmia, naisten ongelmista ei siis tarvitse välittää.” Tai päinvastoin: “Pojat menestyvät tyttöjä huonommin koulussa.” “Mutta hahaa, naisten onkin turvattomampaa liikkua yksin pimeän tultua! Koska naisilla on ongelmia, ei miestenkään ongelmista tarvitse välittää.” Viimeistä lausetta ei yleensä lausuta ihan näin suoraan, mutta ajatus on luettavissa rivien välistä. Kukaan harvemmin huomauttaa, ettei tämänkaltaisessa muotoilussa ole mitään järkeä. Kaikki naiset eivät ole naisvaltaisilla aloilla eivätkä kaikki miehet miesvaltaisilla. Kaikki eivät elämänsä aikana joudu osallisiksi huoltajuuskiistoihin, ja osaa niihin joutuvista miehistäkin kohdellaan reilusti. Kaikilla pojilla ei mene huonosti koulussa eikä kaikilla tytöillä hyvin. Moni mieskin kokee olonsa turvattomaksi pimeän tullen ulkona liikkuessaan. Tasa-arvoon liittyvät ongelmat eivät ole mitään äidinmaidossa tulevia tai geneettisesti määräytyviä piirteitä, joista olisi kaikille naisille tai kaikille miehille samanlaista haittaa. Eivätkä sukupuolet ole mitään vastakkain kisaavia urheilujoukkueita kilpailussa, jossa joukkueiden saamia etuja tarvitsee tasapainottaa. Sen sijaan on kyllä aloja, joiden palkka on niiden raskauteen ja tarpeellisuuteen nähden hyvin pieni. On ihmisiä, joille ei anneta reilua mahdollisuutta saada lapsensa huoltajuutta. On lapsia ja aikuisia, joilla menee huonosti koulussa. Ja on ihmisiä, jotka kokevat itsensä turvattomaksi liikkuessaan yksin ulkona pimeällä. Nämä ovat ongelmia, joita tulisi pyrkiä korjaamaan – riippumatta siitä, kumpaan sukupuoleen ne kohdistuvat. Toki meidän kannattaa pyrkiä selvittämään sitä, mitä ongelmia erityisesti miehiin tai naisiin kohdistuu. Ilman tietoa todellisista ongelmista emme pysty korjaamaan niitä. Mutta silloinkin kyse on ongelmien ratkomisesta, ei siitä että etsittäisiin asetta jonka avulla vähätellä muiden ongelmia. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
