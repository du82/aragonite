["https://kajsotala.fi/2011/04/kolme-syyta-epailla-valtiovaltaa"]
title = "Kolme syytä epäillä valtiovaltaa | Kaj Sotala"
description = "En pidä valtiota vihollisena tai pahana mörkönä. Siitä huolimatta on kolme hyvää syytä suhtautua epäluuloisesti kaikkeen valtion toimintaan. 1. Päättäjien kannustimet ovat vinoutuneet. Parasta olis…"
full_description = "Kolme syytä epäillä valtiovaltaa Posted on Apr 15, 2011 in Finnish Essays, Finnish Posts | 0 comments En pidä valtiota vihollisena tai pahana mörkönä. Siitä huolimatta on kolme hyvää syytä suhtautua epäluuloisesti kaikkeen valtion toimintaan. 1. Päättäjien kannustimet ovat vinoutuneet. Parasta olisi, jos poliitikot pyrkisivät tekemään mahdollisimman hyviä päätöksiä. Sen jälkeen heitä äänestettäisiin sen perusteella, miten hyviä päätöksiä he ovat saaneet tehtyä. Valitettavasti äänestäjä ei voi tietää, miten hyviä päätöksiä poliitikko on tehnyt. Hän voi vain tietää, miten hyviä päätöksiä poliitikko vaikuttaa tehneen. Mikäli kansanedustaja haluaa pitää virkansa, on hänelle tärkeämpää näyttää hyvältä kuin olla hyvä. Jos kansa vaatii toimia jonkin asian eteen, voi olla parempi toteuttaa haitallinenkin toimi ja väittää sitä hyödylliseksi kuin olla tekemättä mitään. Muuten antaisi sen kuvan, ettei välitä asiasta. (Usein äänestäjät eivät edes ylipäätään ole kiinnostuneet päätösten seurauksista.) Mahdollinen esimerkki tästä löytyy valtion niin kutsutusta “tuottavuusohjelmasta”, joka nimestään huolimatta on välillä päätynyt nostamaan kustannuksia. Erään valtion laitoksen johtaja kertoi minulle, että heidän laitoksessaan on ulkoistettu kaikki, mikä ei kuulu laitoksen ydinosaamiseen; esimerkiksi aulan vahtimestarin palvelut ostetaan ulkopuoliselta yritykseltä. Kysyin, paljonko tämä säästää, ja sain vastaukseksi, että se lisää menoja, mutta on välttämätöntä tuottavuusohjelman tavoitteiden saavuttamiseksi. (Osmo Soininvaara, Julkisen sektorin tuottavuus) 2. Päätösten kaikkia seurauksia ei voi tietää. Monet hyviltä vaikuttavat päätökset tuottavat ongelmia, jotka eivät ole heti ilmeisiä. Usein esimerkiksi unohtuu, että tuet muuttavat ihmisten käyttäytymistä. Asumiskustannusten tuet nostavat asumiskustannuksia. Työmatkatuet rohkaisevat asumaan kauempana töistä, vaikka se olisi henkisesti rasittavampaa. Toisaalta jonkin asian kieltäminen saattaa siirtää sen laillisen talouden piiristä järjestäytyneen rikollisuuden käsiin. Kielletyllä asialla saattaa myös olla hyviä käyttötapoja, joita ei olla otettu täysin huomioon. Tietenkin päätöksillä voi myös olla odottamattomia hyviä puolia. Ja on tapauksia, joissa on selvää että hyvät puolet ovat huonoja painavampia. Tieteellinen tutkimus voi myös paljastaa asioita, joista tavalliset ihmiset eivät ole tietoisia ja joista valtion on siten perusteltua päättää. Mutta eduskunnassa on 200 päättäjää, siinä missä Suomessa on kokonaisuudessaan viisi miljoonaa ihmistä. Jos kansalle suodaan enemmän vapautta, on usein todennäköisempää että he itse keksivät omaan elämäänsä parhaat toimintatavat. Haluaisitko ennemmin sata euroa vapaasti käytettäväksi, vai sata euroa joiden käyttötarkoitus on päätetty puolestasi? Jos olet keksinyt täydellisen tavan elää, on turhauttavaa tietää että valtio estää sen. 3. Eturyhmät ostavat itselleen etuja. Ajatellaan että jokin yritys haluaa verohelpotuksen, tuen tai muun itseään hyödyttävän lain. Lain arvo yritykselle on 10 miljoonaa euroa vuodessa. Tällöin yrityksen kannattaa käyttää miltei 10 euroa miljoonaa vuodessa vaikuttaakseen päättäjiin ja saadakseen lakinsa läpi. Muiden ei kuitenkaan kannata käyttää merkittävästi rahaa asian vastustamiseen. Jos asia maksaa yhteiskunnalle 10 miljoonaa vuodessa, tarkoittaa se Suomen kokoisessa maassa vain vajaata kahta euroa asukasta kohden. Harvaa kiinnostaa järin aktiivisesti vastustaa asiaa, joka maksaa heille kahta euroa vuodessa. Ajan kanssa eri eturyhmien ostamat lait kuitenkin kasaantuvat, kunnes ne alkavat käydä todella kalliiksi. Tekijänoikeuden suoja-ajat ovat hyvä esimerkki ostetusta edusta. 70 vuotta tekijän kuoleman jälkeen kestävä suoja-aika maksaa yhteiskunnalle miljoonia, mutta hyödyttää vain suuryhtiöitä. 2008-2009 taas haluttiin pidentää äänitteiden tekijänoikeudelle läheistä sukua olevaa ns. lähisuojaa. Tätä perusteltiin artistien eläketurvalla, mutta todellisuudessa pidennyksen artisteille suuntautuva lisätuotto ei valtaosassa tapauksia olisi kattanut edes pankkimaksuja. Sen sijaan neljä suurinta levy-yhtiötä olisi ottanut kolme neljäsosaa näin saaduista voitoista. (Lähteet ja kattavampi analyysi tapauksesta löytyy Jokapiraatinoikeuden 5. luvusta.) Tekijänoikeuden lisäksi EU:n maataloustuet ovat myös ostettu etu. Yhden analyysin mukaan jokainen euro maataloustukiin maksaa veronmaksajille ja ruuan ostajille puolitoista euroa. Lisäksi monessa maassa suurituloiset saavat suuremman osuuden tulonsiirroista kuin pienituloiset, mikä selittyy myös erilaisilla ostetuilla eduilla. [1] En ole libertaari enkä minarkisti. Uskon näistä tekijöistä huolimatta, että valtio tekee kokonaisuudessaan enemmän hyvää kuin pahaa. Uskon myös, että valtion on täysin perusteltua tukea tai rajoittaa monia asioita. Olen sivunnut näiden uskomusten syitä aiemmin, mm. kun mainitsin vapauden lisäämisen perustelluksi syyksi valtion säätelylle. (“Mikäli esimerkiksi hyväksymme sen ajatuksen, että raha on vaihdon väline joka vapauttaa ihmisen tekemään haluamiaan asioita, seuraa siitä että rikkailla on enemmän vapautta kuin köyhillä. Tulonsiirrot ja varallisuuden tasaaminen on silloin perusteltua, sillä oikein tehtynä se lisää köyhien vapauksia enemmän kuin vie niitä rikkailta.“) Palaan aiheeseen vielä yksityiskohtaisemmin myöhemmin. Siihen asti mainitsen vain allekirjoittavani kaiken sen libertarismin kritiikin, jonka Scott Siskindin Non-Libertarian FAQ esittää. On kuitenkin olennaista tiedostaa, että Suomessa ei epäillä valtiovaltaa läheskään niin paljoa kuin pitäisi. Oletetaan että on jokin kaikkein paras säätelyn taso. Miltei riippumatta siitä missä tämä piste sijaitsee, tulee erityisesti eturyhmien vaikutus jatkuvasti vetämään valtiota sen ohitse, kohti haitallista ylisäätelyä. Emme vain mene kohti liiallista säätelyä, menemme myös kohti säätelyä joka hyödyttää vain niitä, jotka ovat jo valmiiksi hyvässä asemassa. Vain heillä on varaa ostaa valtiolta itseään hyödyttäviä lakeja. Kaikilta uusilla lakiehdotuksilta ja budjetin laajennuksilta tulisi vaatia hyvin raskasta todistustaakkaa. Tekeekö tämä laki varmasti sen, mitä väitetään? Minkä tiedon perusteella? Auttaako se lähinnä muutenkin hyvässä asemassa olevaa eturyhmää? Päätöksenteko pitäisi saada julkisemmaksi ja avoimemmaksi, jotta tämänlaista kritiikkiä voitaisiin esittää paremmin. Tällä hetkellä lainsäädännön on aivan liian helppo mennä täysin metsään. Vielä olennaisempaa olisi kuitenkin alkaa suhtautumaan lähtökohtaisesti skeptisesti kaikkeen valtion harrastamaan säätelyyn. [1] Mueller, Dennis C. (2003) Public Choice III, Cambridge University Press. Sivut 61-63. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
