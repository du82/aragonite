full_description = "Academic Papers Peer-reviewed book chapters Kaj Sotala (2018). Disjunctive Scenarios of Catastrophic AI Risk. AI Safety and Security (Roman Yampolskiy, ed.), CRC Press. Papers in peer-reviewed journals Seth Baum, Stuart Armstrong, Timoteus Ekenstedt, Olle Häggström, Robin Hanson, Karin Kuhlemann, Matthijs M. Maas, James D. Miller, Markus Salmela, Anders Sandberg, Kaj Sotala, Phil Torres, Alexey Turchin & Roman V. Yampolskiy (2019) Long-Term Trajectories of Human Civilization. Foresight, Vol. 21 No. 1, pp. 53-83. DOI 10.1108/FS-04-2018-0037. Kaj Sotala & Lukas Gloor (2017) Superintelligence as a Cause or Cure for Risks of Astronomical Suffering. Informatica 41 (4). Kaj Sotala (2017) How Feasible is the Rapid Development of Artificial Superintelligence? Physica Scripta 92 (11), 113001. Kaj Sotala & Roman Yampolskiy (2015) Responses to Catastrophic AGI risk: A Survey. Physica Scripta 90 (1) 018001. Reprinted, with some minor edits, as the book chapters Risks of the Journey to the Singularity. In The Technological Singularity: Managing the Journey (Victor Callaghan et al, eds.), Springer-Verlag, 2017. Responses to the Journey to the Singularity. In The Technological Singularity: Managing the Journey (Victor Callaghan et al, eds.), Springer-Verlag, 2017. Older preprint version: Technical report 2013-2, Machine Intelligence Research Institute. Stuart Armstrong, Kaj Sotala & Seán S. Ó hÉigeartaigh (2014) The errors, insights and lessons of famous AI predictions – and what they mean for the future. Journal of Experimental & Theoretical Artificial Intelligence. Kaj Sotala (2012) Advantages of Artificial Intelligences, Uploads, and Digital Minds. International Journal of Machine Consciousness 4 (1), 275-291. Kaj Sotala & Harri Valpola (2012) Coalescing Minds: Brain Uploading-Related Group Mind Scenarios. International Journal of Machine Consciousness 4 (1), 293-312. Peer-reviewed conference papers Kaj Sotala (2016). Defining Human Values for Value Learners. 2nd International Workshop on AI and Ethics, AAAI-2016. Phoenix, Arizona. Kaj Sotala (2015). Concept learning for safe autonomous AI. 1st International Workshop on AI and Ethics, AAAI-2015. Austin, Texas. Poster version. Stuart Armstrong & Kaj Sotala (2012) How We’re Predicting AI — or Failing to. Beyond AI: Artificial Dreams. Pilsen, Czech Republic. Please note: one of the conclusions in this paper is flawed; see the article “Error in Armstrong and Sotala 2012” at AI Impacts. Thank you to Katja Grace for catching this. Fortunately, the overall conclusion remains mostly unaffected. Peer-reviewed conference presentations Kaj Sotala (2015). Sentient companions predicted and modeled into existence: explaining the tulpa phenomenon. Toward a Science of Consciousness 2015. Helsinki, Finland. Presentation slides (PDF, Slideshare). Kaj Sotala & Harri Valpola (2015) Coalescing minds and personal identity. Toward a Science of Consciousness 2015. Helsinki, Finland. Presentation slides. Kaj Sotala (2010) From mostly harmless to civilization-threatening: Pathways to dangerous artificial intelligences. ECAP10: VIIIth European Conference on Computing and Philosophy. München, Germany. Kaj Sotala (2009) Evolved altruism, ethical complexity, anthropomorphic trust: three factors misleading estimates of the safety of artificial general intelligence. VIIth European Conference on Computing and Philosophy. Universitat Autònoma de Barcelona, Spain. Other academic works Kaj Sotala (2016) Response to Floridi on Dangers from AI. APA Newsletter on Philosophy and Computers, vol 15, no. 2. Kaj Sotala (2015) Bayes Academy – an Educational Game for Learning Bayesian Networks. Master’s thesis in Computer Science, University of Helsinki. For the citation counts of these, see my Google Citations profile for the counts as they are indexed by Google Scholar. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
