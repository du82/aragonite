["https://kajsotala.fi/2018/10/on-insecurity-as-a-friend"]
title = "On insecurity as a friend | Kaj Sotala"
description = "There’s a common narrative about confidence that says that confidence is good, insecurity is bad. It’s better to develop your confidence than to be insecure. There’s an obvious tr…"
full_description = "On insecurity as a friend Posted on Oct 9, 2018 in English Posts | 0 comments There’s a common narrative about confidence that says that confidence is good, insecurity is bad. It’s better to develop your confidence than to be insecure. There’s an obvious truth to this. But what that narrative does not acknowledge, and what both a person struggling with insecurity and their well-meaning friends might miss, is that that insecurity may be in place for a reason. You might not notice it online, but I’ve usually been pretty timid and insecure in real life. But this wasn’t always the case. There were occasions earlier in my life when I was less insecure, more confident in myself. I was also pretty horrible at things like reading social nuance and figuring out when and why someone might be offended. So I was given, repeatedly, the feedback that my behavior was bad and inappropriate. Eventually a part of me internalized that as “I’m very likely to accidentally offend the people around me, so I should be very cautious about what I say, ideally saying nothing at all”. This was, I think, the correct lesson to internalize at that point! It shifted me more into an observer mode, allowing me to just watch social situations and learn more about their dynamics that way. I still don’t think that I’m great at reading social nuance, but I’m at least better at it than I used to be. And there have been times since then when I’ve decided that I should act with more confidence, and just get rid of the part that generates the insecurity. I’ve been about to do something, felt a sense of insecurity, and walked over the feeling and done the thing anyway. Sometimes this has had good results. But often it has also led to things blowing up in my face, with me inadvertently hurting someone and leaving me feeling guilty for months afterwards. Turns out, that feeling of insecurity wasn’t a purely bad thing. It was throwing up important alarms which I chose to ignore, alarms which were sounding because it recognized my behavior as matching previous behavior which had had poor consequences. Yes, on many occasions that part of me makes me way too cautious. And it would be good to moderate that caution a little. But the same part which generates the feelings of insecurity is the same part which is constantly working to model other people and their experience, their reactions to me. The part that is doing its hardest to make other people feel safe and comfortable around me, to avoid doing things that would make them feel needlessly hurt or upset or unsafe, and to actively let them know that I’m doing this. Just carving out that part would be a mistake. A moral wrong, even. The answer is not to get rid of it. The answer is to integrate its cautions better, to keep it with me as a trusted friend and ally – one which feels safe enough about getting its warnings listened to, that it will not scream all the time just to be heard. Share this:TweetShare on Tumblr No comments Trackbacks/Pingbacks 18-month follow-up on my self-concept work | Kaj Sotala - […] ongoing, but I’ve been making progress. Major contributors to current progress are the skills of integrating the cautions from… Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send