title = "Sähkökirja uhkaa (ehkä) suomalaisia kirjailijoita | Kaj Sotala"
description = "Sähkökirjojen yleistymisen on peloteltu laajentavan verkkopiratismin kirjoihin ja uhkaavan siten kirjailijoiden elantoa. Olen samaa mieltä siitä, että suomalaisten kirjailijoiden elanto saattaa säh…"
full_description = "Sähkökirja uhkaa (ehkä) suomalaisia kirjailijoita Posted on Mar 25, 2011 in Finnish Essays, Finnish Posts | 0 comments Sähkökirjojen yleistymisen on peloteltu laajentavan verkkopiratismin kirjoihin ja uhkaavan siten kirjailijoiden elantoa. Olen samaa mieltä siitä, että suomalaisten kirjailijoiden elanto saattaa sähkökirjojen myötä heiketä. Tai sitten ei. Piratismin kanssa sillä ei kuitenkaan ole mitään tekemistä. Sain viikko sitten käsiini Kindlen, Amazon-verkkokaupan sähkökirjanlukijan. Monet olivat kehuneet laitetta, ja pienten alkuhankaluuksien jälkeen päädyin olemaan samaa mieltä. Kirjantappajan tuloa on ennusteltu pitkään, mutta nyt se on vihdoin täällä. Osan hakuteoksista saatan edelleen haluta fyysisinä, mutta siihen se sitten jääkin. Vastedes ainoa syyni hankkia kaunokirjallisuutta paperilla on se, jos sitä ei saa Kindlelle. Saakin sitten olla erittäin hyvää kirjallisuutta, jotta vaivautuisin. Kirjoista on liikkunut verkossa luvattomia skanneja jo pitkään, mutta tähän asti ne ovat lähinnä lisänneet fyysisten kirjojen myyntiä (ks. tilastot Jokapiraatinoikeuden 2. luvussa). Kirjoja on kuitenkin hankala lukea tietokoneen näytöltä, mikä on saattanut vähentää piratismin vaikutusta. Ovatko kirjailijoiden tulot nyt vaarassa, kun lukulaitteista on tullut perinteistä kirjaa mukavampia käyttää? Ei. Sähkökirjat vaarantavat etenkin suomalaisten kirjailijoiden tulot jo muutenkin niin rajusti, ettei piratismilla ole sen jälkeen enää mitään merkitystä. Tämän ymmärtämiseksi on syytä ensin katsoa mitä muutama ulkomainen kirjailija sanoo sähkökirjoista. Randy Ingermanson (kuusi romaania, yksi tietokirja) ja Joe Konrath (16 romaania) ovat kaksi yhdysvaltalaista kirjailijaa, jotka blogaavat säännöllisesti sähkökirjoista ja niiden markkinatilanteesta. Näitä blogeja kannattaa seurata, jos aihe kiinnostaa. Sähkökirjat ovat tuomassa valtaista muutosta kirja-alalle. Sähkökirjojen julkaiseminen omakustanteina on usein paljon kannattavampaa kuin perinteisen julkaisijan etsiminen. Niin ensikertalaiset kuin veteraanitkin ovat siirtymässä omakustanteisiin. Syy on yksinkertainen. Omakustanteen saa myytyä halvemmalla ja paremmalla katteella. Joe Konrath myy sähkökirjojaan omakustanteina kolmen dollarin hintaan, ja saa myyntihinnasta itselleen 70%. Perinteisen kustantajan kautta hän saisi itselleen vajaat 20%. Hän ansaitsee yhtä myytyä kolmen dollarin sähkökirjaa kohden enemmän kuin hän ansaitsisi kahdeksan dollarin pehmeäkantisesta kirjasta. 25 dollarin kovakantisella tekisi kyllä jonkin verran enemmän voittoa per myyty kappale, mutta halvempia sähkökirjoja myydään paljon enemmän. Konrath on todennut, että kolme dollaria on sähkökirjalle se hinta, jolla ansaitsee eniten rahaa. Tammikuussa hän ansaitsi sillä 42 000 dollaria. Ja vaikka Konrath onkin vakiintunut kirja-alan ammattilainen, toimii sama strategia amatööreillekin. Otetaan vaikka Amanda Hocking, joka laittoi ensimmäiset kirjansa myyntiin viime vuoden marraskuussa. Useimpien niiden hinta vaihteli yhden ja kolmen dollarin välillä. Hän myi viime vuoden aikana 164 000 kirjaa; tämän vuoden tammikuussa, 450 000 kirjaa. Randy Ingermanson arvioi, että maailmanhistorian ensimmäinen miljardin dollarin kirja tullaan julkaisemaan lähitulevaisuudessa. Hän veikkaa sen hinnan olevan noin kolmen dollarin paikkeilla. Se voi hyvin tulla täydeltä aloittelijalta. Tämänlaisilla hinnoilla on selvää, ettei piratismilla ole enää mitään merkitystä. Jos kirjan hinta on dollarista kolmeen dollariin, kuka vaivautuu hankkimaan sen laittomasti? Kindlen kautta tehtävät ostokset ovat vieläpä niin käteviä, että piratisointi olisi turhan vaivalloista. Kindleni hankittuani otin netistä jokusen ilmaisen kirjan, joiden tekijänoikeudet olivat rauenneet. Ajattelin että siirtäisin ne tietokoneeltani lukulaitteelle. Tähän asti en ole jaksanut, koska se vaatisi Kindlen yhdistämistä tietokoneeseen ja tiedostojen kopiointia käsin. On paljon helpompaa ostaa kirjoja muutamien dollareiden hintaan suoraan Kindlen omasta kaupasta, johon laite yhdistää langattomasti. Piratismi on kirja-alalla merkityksetön ongelma jos sitä vertaa digitaalisen ympäristön muihin haasteisiin, aivan kuten kaikilla muillakin kulttuurinaloilla. Mutta suomalaisille kirjailijoille on ongelma, jos hintakilpailu pudottaa kirjojen hinnat muutamaan dollariin. Sillä hinnoittelustrategialla voi tehdä isot rahat englanninkielisillä markkinoilla, joissa lukijoita riittää. Suomen kielialue on kuitenkin harmillisen pieni. Kaikkein aikojen myydyimpien suomalaisten kirjojen top kymppiin pääsee niinkin pienellä kuin 200 000 kappaleen myynnillä. Tyypilliset kirjat myyvät monta, monta kertaa tätä vähemmän. Hintojen tiputtaminen voi varmasti auttaa asiaa, mutta lukijoita on silti vain se vajaat kuusi miljoonaa. Tietenkin suomalaisilla kirjoilla on se etu, että ne ovat suomenkielisiä. Ne eivät siis aivan suoraan kilpaile ulkomaisten kanssa, ja niistä voi pyytää suurempia hintoja. Mutta etenkin lukemista harrastava osuus nuorisosta on hyvin kielitaitoista, ja tulee vain kielitaitoistumaan lisää. Jos samalla hinnalla voi saada viisi englanninkielistä kirjaa tai yhden suomenkielisen, valinta tuskin on vaikea. Toisaalta osa suomalaisista kirjailijoista voi hyötyäkin. Pitkänkin uran tehneen kirjailijan myyntipalkkiot saattavat tyypillisesti jäädä tuhanteen euroon vuodessa. Apurahat ovatkin useimmille suurempi tulonlähde kuin varsinaiset myyntitulot. Parin euron kirjoilla ei ehkä tee elantoa, mutta niiden avulla voi silti saada huomattavasti enemmän voittoa kuin nyt. Lisäksi suomalaisetkin kirjailijat voivat panostaa hyviin kääntäjiin ja tuoda teoksensa maailmanmarkkinoille, tai kirjoittaa suoraan englanniksi. Elämme mielenkiintoisia aikoja. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
