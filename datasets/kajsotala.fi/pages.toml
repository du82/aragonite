["https://kajsotala.fi/2011/01/miksi-jonkun-pitaisi-saada-kayttaa-kenkia"]
title = "“Miksi jonkun pitäisi saada käyttää kenkiä?” | Kaj Sotala"
description = "Yksi surkeimpia tapoja vastustaa jotakin on kysyä, “miksi kenenkään pitäisi saada tehdä noin”. Miksi ihmisten pitäisi saada kopioida kulttuuriteoksia toisilleen? Miksi homojen pitäisi s…"
full_description = "“Miksi jonkun pitäisi saada käyttää kenkiä?” Posted on Jan 23, 2011 in Finnish Essays, Finnish Posts | 1 comment Yksi surkeimpia tapoja vastustaa jotakin on kysyä, “miksi kenenkään pitäisi saada tehdä noin”. Miksi ihmisten pitäisi saada kopioida kulttuuriteoksia toisilleen? Miksi homojen pitäisi saada mennä naimisiin? Miksi ihmisten pitäisi saada sanoa loukkaavia asioita julkisesti? Miksi kenenkään pitäisi saada käyttää tajuntaan vaikuttavia aineita? Miksi jonkun pitäisi saada käyttää kenkiä? Vapausperiaate sanoo, että jos jonkin asian kieltämiseen ei löydy perusteluita, tulisi sen olla sallittu. Ei siis ole niin, että kaikki asiat olisivat oletusarvoisesti kiellettyjä ja niiden salliminen pitäisi erikseen perustella. Sen sijaan kaikki asiat ovat oletusarvoisesti sallittuja ja niiden kieltäminen on erikseen perusteltava. On helppo nähdä, miksi näin on. Jos jokainen joutuisi ensin erikseen perustelemaan sen, miksi saa lähteä kauppaan, miksi saa aloittaa uuden harrastuksen tai miksi saa laittaa kengät jalkaansa, ei mistään tulisi mitään. Eduskunnan kaikki aika menisi siihen, että se säätäisi lakeja joissa määriteltäisiin kaikki ne lukemattomat asiat, jotka ovat sallittuja. Mutta käytännön seikkojen lisäksi löytyy toinenkin syy: perimmäinen oikeutus minkä tahansa asian tekemiselle on se, että olemassa on ihminen joka haluaa tehdä niin. Jos haluan syödä pienen iltapalan, eikö se ole moraalinen teko jo pelkästään siksi, että haluan tehdä niin ja minulle tulee sen syömisestä hyvä olo? Jos joku haluaa tehdä jotain, on jo itsessään moraalista antaa hänen tehdä niin. Tietenkään tämä ei tarkoita, että meidän pitäisi sallia aivan kaikki. On oikein, että ampumaharrastaja saa ammuskella pyssyllä jos hän siitä pitää, eikä hänen tarvitse sitä kenellekään perustella. Jos hän kuitenkin haluaisi ampua toisen, ei ole vaikeaa keksiä pitkää listaa syitä asian kieltämiselle. Ne syyt painavat puntarissa paljon enemmän, kuin mikään mielihyvä mitä tappamisesta ehkä aiheutuisi. Eikä tapauksen edes tarvitse olla näin äärimmäinen. Jokainen varmaan ymmärtää, miksi myös aseiden heiluttelua keskellä kaupunkia voi olla hyvä rajoittaa, vaikkei ketään varsinaisesti ammuttaisikaan. Mutta asian ydin onkin juuri tässä. Jos meillä on hyvät, perustellut syyt vastustaa kenkien käyttämistä, ei meidän silloin tarvitse turvautua epätoivoiseen “mutta miksi sallisimme kenellekään kenkien käytön?!”-huudahdukseen. Sen sijaan voimme latoa pöytään ne varsinaiset syyt, miksi asia on vastustamisen arvoinen. Mikäli joku ei keksi sen parempaa perustelua kuin kysyä, miksi jokin asia pitäisi sallia, kielii se siitä ettei hän itsekään tiedä miksi se pitäisi kieltää. Hänen ainoa todellinen syynsä on silloin usein vaistomainen inhoreaktio, hänen ainoa oikea perustelunsa “no kun mä en tykkää“. Muuten hänen ei tarvitsisi turvautua “mutta miksi”-kysymykseen. Ellei sen parempaa keksi, on hävinnyt koko väittelyn. Share this:TweetShare on Tumblr One comment Trygve Hansson June 23, 2023 Älä vastusta kenen se ei oo, bitch https://www.kirjastot.fi/kysy/onko-eeva-anderssonin-kirjalle-tiikerien?language_content_entity=fi Reply Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
