n Cognition. Cecilia Heyes, Nick Chater & Dominic Michael Dwyer. Trends in Cognitive Sciences, 2020. Some theories have proposed that humans have evolved to experience some stimuli (e.g. snakes, spiders) as more potentially frightening, so that a fear for these entities is learned faster than a fear for more neutral things. In evolutionary... Read More The Haters Gonna Hate Fallacy Posted on Sep 22, 2020 in Blog, English Posts | 0 comments Occasionally I see people doing what I think of as the “Haters Gonna Hate Fallacy”. The HGHF says something like: “People are going to misinterpret you no matter how carefully you word things. Therefore, there’s no point wasting time wording things carefully.” An example: “I think [term X] in your post is going to cause misunderstandings, I’d suggest... Read More GPT-3 space opera Posted on Jul 16, 2020 in Blog, English Posts | 0 comments AI Dungeon is an online text adventure which uses the “GPT” AI to generate responses to what you say. You can type in anything, and it will try to create a response. I had tried it a bit before, as well as seeing a friend try, and it had been amusing but very quickly incoherent. Yesterday I tried its upgraded version, the “Dragon Model“. It’s only available in the... Read More Healing vs. exercise analogies for emotional work Posted on Jan 27, 2020 in English Posts | 1 comment I know a fair number of people who put in a lot of effort into things like emotional healing, digging up and dealing with buried trauma, meditative and therapy practices, and so on. (I count myself in this category.) And I think that there’s a thing that sometimes happens when other people see all of this, which is that it all seems kinda fake. I say this because even I have this thought... Read More Waiting Posted on Jun 2, 2019 in English Posts | 4 comments I’ve often noticed in myself a tendency, if I am not doing something immediately engrossing, to find myself waiting. Waiting, waiting, waiting, not really being present, just willing time to pass. But the weird thing is, frequently there isn’t anything in particular that I’m waiting *for*. Getting out of that situation, yes, but I don’t have anything in particular that... Read More 18-month follow-up on my self-concept work Posted on Dec 18, 2018 in English Essays, English Posts | 2 comments About eighteen months ago, I found Steve Andreas’s book Transforming Your Self, and applied its techniques to fixing a number of issues in my self-concepts which had contributed to my depression and anxiety. Six weeks after those changes, I posted a report called “How I found & fixed the root problem behind my depression and anxiety after 20+ years”. I figured that by now it would be... Read More Tentatively considering emotional stories (IFS and “getting into Self”) Posted on Nov 30, 2018 in English Posts | 0 comments I’ve recently been getting a lot out of the psychotherapy model of Internal Family Systems, as described in this book. I just wrote a comment on Slate Star Codex describing some of its basics and what I’ve gotten out of it, and thought that I might as well repost it here: I recommend this book, though with the note that I often don’t need to follow the full process outlined... Read More Incorrect hypotheses point to correct observations Posted on Nov 20, 2018 in English Essays, English Posts | 0 comments 1. The Consciousness Researcher and Out-Of-Body Experiences In his book Consciousness and the Brain, cognitive neuroscientist Stansilas Dehaene writes about scientifically investigating people’s reports of their out-of-body experiences: … the Swiss neurologist Olaf Blanke[ did a] beautiful series of experiments on out-of-body experiences. Surgery patients occasionally report leaving... Read More « Older Entries Next Entries » Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as