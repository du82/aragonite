["https://kajsotala.fi/2011/04/vapauden-hintana-on-ikuinen-valppaus"]
title = "Vapauden hintana on ikuinen valppaus | Kaj Sotala"
description = "Demokratian suurin ongelma ja etu on, että päätökset tehdään enemmistön halun mukaan. Se johtaa sekä epäreiluun päätöksentekoon ja eturyhmien suosimiseen, että vääryyksien välttämiseen ja asioiden …"
full_description = "Vapauden hintana on ikuinen valppaus Posted on Apr 19, 2011 in Finnish Essays, Finnish Posts | 0 comments Demokratian suurin ongelma ja etu on, että päätökset tehdään enemmistön halun mukaan. Se johtaa sekä epäreiluun päätöksentekoon ja eturyhmien suosimiseen, että vääryyksien välttämiseen ja asioiden paranemiseen. Asiat voivat mennä parempaan suuntaan, mutta se vaatii jatkuvaa työtä niiden eteen. Kuvitellaan, että ison valtatien varrella asuu sata maanviljelijää. Valtatieltä lähtee pienempiä sorateitä, joista jokainen vie noin 4-5 maanviljelijän luokse. Soratiet ovat varsin huonokuntoisia, ja viljelijät haluaisivat korvata ne kunnon teillä. Yksi mahdollisuus olisi, että kukin 4-5 maanviljelijän porukka maksaisi yhdessä oman tiensä parantamisen. Toisena mahdollisuutena kaikki sata voisivat yhdessä maksaa kaikkien teiden parannustyöt. Silloin he voisivat saada työlle neuvoteltua paremman hinnan, kuin jos kukin porukka ostaisi työn erikseen. Demokraattisessa yhteisössä on kuitenkin vielä kolmaskin mahdollisuus. 51 maanviljelijää voi liittoutua ja määrätä, että loput 49 joutuvat maksamaan parannustyön omasta pussistaan enemmistölle. Liittouman muodostaneet 51 maksavat koko hommasta pyöreät nolla euroa, mutta saavat silti itselleen uuden tien. Vähemmistöön jääneet 49 joutuvat maksamaan parannustyöt, mutta eivät saa siitä vastikkeeksi mitään. Jos käytössä on demokratia jossa kaikki ajattelevat omaa etuaan, kannattaa enemmistön aina liittoutua vähemmistöä vastaan. Enemmistön kannalta paras tilanne on se, jossa heidän ylivoimansa on niin pieni kuin mahdollinen. 51 prosentin enemmistö ja 49 prosentin vähemmistö on parempi kuin 60 prosentin enemmistö ja 40 prosentin vähemmistö. Tämä siksi, että 49 prosentilta saa kerättyä enemmän rahaa tai muita etuja, ja se voidaan myös jakaa pienemmän porukan kesken. Jokainen enemmistöliittouman jäsen hyötyy silloin itse eniten. Tarkkaavaiset lukijat saattavat huomata yhteyden ajankohtaiseen aiheeseen. Uuden eduskunnan valitsemisen jälkeen puolueet neuvottelevat keskenään ja koettavat muodostaa enemmistöhallituksen. Vastineeksi yhteistyöstä kukin hallituspuolue saa jotain mitä itse haluaa. Jotta jokainen hallitukseen pääsevä puolue saisi mahdollisimman paljon haluamiaan asioita, ei hallitukseen tavallisissa olosuhteissa oteta enempää puolueita kuin on pakko. Enemmistö ei tietenkään voi toimia täysin mielivaltaisesti. Useimpien ihmisten omatunto ja moraali eivät salli heidän tehdä vähemmistölle aivan mitä vain. Valta myös vaihtuu neljän vuoden välein, ja periaatteessa mikä tahansa puolue voi yhtäkkiä päätyä takaisin oppositioon. Tämä kannustaa noudattamaan tiettyjä herrasmiessääntöjä. Kohtuuttomaksi koettu lainsäädäntö johtaa myös siihen, että ihmiset lakkaavat kunnioittamasta lakia. Silloin enemmistöllekin voi tulla kannattavammaksi lieventää lainsäädäntöä, koska sen valvominen on liian kallista tai jopa mahdotonta. Paljon haitallista lainsäädäntöä voidaan kuitenkin silti ajaa läpi. Mikäli joku ryhmä haluaa jotain asiaa erityisen paljon, voi se ostaa tiensä enemmistöliittoumaan lupaamalla vastineeksi tehdä yhteistyötä muissa asioissa. RKP on tällä tapaa saanut pakkoruotsin pakotettua koko kansalle, vaikka vain noin neljä prosenttia kansasta äänestää RKP:tä. Vastaavalla tavalla jokainen puolue pyrkii ensisijaisesti kahmimaan omille äänestäjilleen tarpeeksi etuja saadakseen heidän äänensä edelleen ja pysyäkseen siten vallassa. En väitä, etteikö kaikkien puolueiden riveissä olisi myös paljon pyyteettömästi toimivia kansanedustajia, jotka haluavat tehdä aidosti koko kansaa hyödyttäviä päätöksiä. Mutta jos he haluavat saada koko kansaa hyödyttäviä päätöksiä läpi, on heidän pysyttävä vallassa jollakin tapaa. Ihmiset toisaalta äänestävät herkemmin juuri heidän etujaan ajavia päättäjiä, ja toisaalta kapealla ohjelmalla on helpompi päästä enemmistöliittoumiin mukaan. Epäitsekkäidenkin päättäjien on siis käytännön syistä pelattava samaa peliä kuin muidenkin. Kannattaa kuitenkin huomata, että asialla on myös hyvät puolensa. Vaikka se mahdollistaa lievät epäoikeudenmukaisuudet, auttaa se myös estämään räikeimmät sellaiset. Ajatellaan vaikka, että enemmistöllä kansasta olisi lievä halu ajaa kaikki suomenruotsalaiset pois maasta. Tämä suunnitelma ei kuitenkaan tulisi onnistumaan, sillä suomenruotsalaiset ja heidän tukijansa hyväksyisivät silloin lähes minkä tahansa kaupan jolla tämä saataisiin estettyä. Pakkoruotsinkin ongelma on tehottomuus ja haitallisuus, ei se että olisi väärin tarjota palveluita jonkun äidinkielellä. Myös järjestelmä jossa ei tapahtuisi kuvatunlaista äänikauppaa ja liittoumia olisi epäoikeudenmukainen. Jotkut äänestäjät haluavat jotain asiaa hyvin voimakkaasti. Toiset vastustavat sitä, mutta asialla ei loppujen lopuksi ole heille hirvittävän suurta merkitystä. Jos kaikki äänestäisivät suoraan halujensa mukaan, 51 asiaa lievästi vastustavan äänestäjän äänet voittaisivat 49 voimakkaasti kannattavan äänestäjän äänet. Sekään ei olisi oikein. Äänikauppa mahdollistaa päätösten painottumisen sen mukaan, mikä on kullekin tärkeää. Se tekee myös Piraattipuolueen kapeasta ohjelmasta edun, sillä se tekee helpommaksi suojella kansalaisoikeuksia keskittymällä vain niihin. Järjestelmässä on siis sekä hyvät että huonot puolensa. Toisaalta se mahdollistaa sen, että yksittäiset eturyhmät voivat kahmia etuja jotka hyödyttävät vain heitä. Toisaalta se mahdollistaa sen, että räikeät epäoikeudenmukaisuudet saadaan torjuttua. Sanoin ylempänä, että myös epäitsekkäät edustajat joutuvat pelaamaan tätä peliä. Pelin pelaaminen ei kuitenkaan välttämättä tarkoita periaatteidensa myymistä, vaan sillä voi myös edistää aidosti ihailtavia asioita. Mikä erottaa eturyhmän harrastaman etujen kahmimisen aidosti jalon aatteen puolustamisesta? Kysymys ei ole aivan helppo. Itse käyttäisin mittatikkuna jonkinlaista tietämättömyyden verhon periaatetta: kannattaisitko päätöstä, jos et tietäisi, mikä tulee olemaan asemasi yhteiskunnassa? Esimerkiksi melkein kaikki haluavat itselleen enemmän rahaa. Jos tietää kuuluvansa johonkin tiettyyn ammattiryhmään, kannattaa tukea päätöstä joka lisää sen ammattiryhmän tuloja. Jos taas ei tiedä mihin ihmisryhmään kuuluu, kannattaa suosia maltillisia tulonsiirtoja kaikilta rikkailta kaikille köyhille. Silloin varmistaa sen, että saa ainakin peruselintason asemastaan riippumatta. Perusteltuja ovat sellaiset päätökset, jotka mahdollistavat jokaiselle hyvän elämän, olivat hänen olosuhteensa millaisia tahansa. Vapauden ja oikeudenmukaisuuden hintana on ikuinen valppaus. Eduskunta ja valtio tekee jatkuvasti päätöksiä, joista osa on suunniteltu antamaan tietyille tahoille epäreiluja etuja. Näitä tulee pyrkiä vastustamaan aina kun mahdollista. Toiset päätökset ovat aidosti sosiaalista oikeudenmukaisuutta edistäviä ja kaikkien etua ajavia. Niitä tulee pyrkiä edistämään. Koska kaikki päättäjät väittävät ajavansa kaikkien etua, pitää kaikkia päättäjiä epäillä ja kaikki ehdotukset alistaa ankaralle kritiikille. Jos näin ei tee, tulee maasta aina vain epäoikeudenmukaisempi. Mutta jos näin onnistutaan tekemään, tulee maasta aina vain parempi paikka elää. Sen puolesta kannattaa taistella. Share this:TweetShare on Tumblr Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed. Recent Posts Things I have been using LLMs for Don’t ignore bad vibes you get from people You can validly be seen and validated by a chatbot Trying to translate when people talk past each other Circling as practice for “just be yourself” This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
