Read More Lisääkö talouskasvu hyvinvointia? Posted on Feb 26, 2012 in Finnish Essays, Finnish Posts | 0 comments Talouskasvu lisää selkeästi aineellista vaurauttamme, mutta totumme nopeasti muuttuneeseen elintasoon, joten ei ole varmaa missä määrin talouskasvu lisää varsinaista hyvinvointiamme. Read More Monta samanaikaista suhdetta – miksipä ei? Posted on Dec 8, 2010 in Finnish Essays, Finnish Posts | 0 comments Monia seurustelusuhteita revitään joka hetki aivan turhaan rikki, koska ihmiset luulevat että rakastaa voi vain yhtä ihmistä kerrallaan. Turhan tyypillinen kuvio on, että suhteen toinen osapuoli rakastuu johonkuhun muuhun. Hän ei kuitenkaan uskalla kertoa tätä kumppanilleen, koska nykymaailmassa ei kunnolla edes tunnusteta moisen mahdollisuuden olemassaoloa. Ajatellaan, että yhteen... Read More Nyky-yhteiskunta ja motivaation kuolema Posted on Dec 29, 2013 in Finnish Essays, Finnish Posts | 5 comments Päivän Hesarissa olleesta mielipidekirjoituksesta: Kaikki lapset aloittavat innokkaina ekaluokan, mutta osalta motivaatio loppuu jatkuvien epäonnistumisten takia jo alakoulussa. […] Opeteltava aines on käsitteellistä, ja niinpä lapsi ei voi ymmärtää asioita, ne on vain muistettava. Minäkin olen yrittänyt opettaa 11-vuotiaalle väkisin kirkon herätysliikkeitä ja renessanssia –... Read More Saako hississä pyytää seksiä? Posted on Jul 8, 2011 in Finnish Essays, Finnish Posts | 0 comments Hissit ovat näemmä päivän Internets-puheenaihe. Riippuen siitä keneltä kysyy, puhe on feministeistä jotka pitävät kaikkia miehiä potentiaalisina raiskaajina, siitä että viattomasta ehdottelusta ärsyyntyvät eivät välitä tyttöjen ympärileikkauksista, tai siitä että kahville pyytäminen on ahdistelua. Anteeksi mitä? Juttu alkoi viattomasta videoblogauksesta, jossa Rebecca... Read More Sähkökirja uhkaa (ehkä) suomalaisia kirjailijoita Posted on Mar 25, 2011 in Finnish Essays, Finnish Posts | 0 comments Sähkökirjojen yleistymisen on peloteltu laajentavan verkkopiratismin kirjoihin ja uhkaavan siten kirjailijoiden elantoa. Olen samaa mieltä siitä, että suomalaisten kirjailijoiden elanto saattaa sähkökirjojen myötä heiketä. Tai sitten ei. Piratismin kanssa sillä ei kuitenkaan ole mitään tekemistä. Sain viikko sitten käsiini Kindlen, Amazon-verkkokaupan sähkökirjanlukijan. Monet... Read More Sydämeni on vasemmalla, aivoni eivät tiedä missä olisivat Posted on Sep 18, 2011 in Finnish Essays, Finnish Posts | 0 comments Jos minulta kysyttäisiin olenko oikealla vai vasemmalla, en osaisi vastata. Tai ainakaan en osaisi tiivistää vastaustani pariin sanaan. Pohjimmaisia arvojani voi pitää suhteellisen vasemmistolaisina. Minusta valtion tehtävänä on luoda tilanne, jossa mahdollisimman moni yhteiskunnan jäsen voi mahdollisimman hyvin. Pidän vapautta tärkeänä, mutta pohjimmiltaan kuitenkin välinearvona.... Read More Vapauden hintana on ikuinen valppaus Posted on Apr 19, 2011 in Finnish Essays, Finnish Posts | 0 comments Demokratian suurin ongelma ja etu on, että päätökset tehdään enemmistön halun mukaan. Se johtaa sekä epäreiluun päätöksentekoon ja eturyhmien suosimiseen, että vääryyksien välttämiseen ja asioiden paranemiseen. Asiat voivat mennä parempaan suuntaan, mutta se vaatii jatkuvaa työtä niiden eteen. Kuvitellaan, että ison valtatien varrella asuu sata maanviljelijää. Valtatieltä... Read More Viisi ainetta, jotka toisin peruskouluun Posted on Nov 22, 2010 in Finnish Essays, Finnish Posts | 0 comments Nykymuotoinen koulu ei opeta elämässä oikeasti tarvittavia taitoja. Merkittävän osan siitä, mitä olen oppinut ja josta minulle on ollut todellista hyötyä elämässä, olen oppinut koulun ulkopuolella törmättyäni siihen sattumalta. Sen sijaan lukuisat oppitunnit peruskoulussa ja lukiossa opettivat hyvin vähän hyödyllistä, etenkin niihin käytettyyn aikaan nähden. Käytännössä... Read More Yrittäjyys ja asenteet Posted on Feb 1, 2014 in Finnish Essays, Finnish Posts | 2 comments Yksi asenne, jota näkee Piilaakso-henkisessä startup-kulttuurissa paljon ja jonka mielelläni näkisin leviävän Suomeenkin, on suhtautuminen yrittäjyyteen likipitäen altruistisena toimintana. Tuossa kulttuurissa yrittäjä on ihminen, joka löytää uuden tavan parantaa muiden elämää, ja toteuttaa sen. Olen lukennut tuosta kulttuurista tulevia “miten ryhtyä... Read More Recent Posts “Miksi jonkun pitäisi saada käyttää kenkiä?” 1. Ainulindalë 14 objections against AI/Friendly AI/The Singularity answered 18-month follow-up on my self-concept work A Date with Darin This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
