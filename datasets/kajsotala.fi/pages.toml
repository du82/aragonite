full_description = "14 objections against AI/Friendly AI/The Singularity answered Posted on Oct 25, 2007 in English Essays, Essays | 4 comments What it says. Not really an essay, but I didn't want to create a new category just for this. Read More 18-month follow-up on my self-concept work Posted on Dec 18, 2018 in English Essays, English Posts | 2 comments About eighteen months ago, I found Steve Andreas’s book Transforming Your Self, and applied its techniques to fixing a number of issues in my self-concepts which had contributed to my depression and anxiety. Six weeks after those changes, I posted a report called “How I found & fixed the root problem behind my depression and anxiety after 20+ years”. I figured that by now it would be... Read More Adult children make mistakes, too Posted on May 29, 2015 in English Essays, English Posts | 0 comments There’s a lot of blame and guilt in many people’s lives. We often think of people in terms of good or bad, and feel unworthy or miserable if we fail at things we think we should be able to do. When we don’t do quite as well as we could, because we’re tired or unwell or distracted, we blame and belittle ourselves. Let’s take a different approach. Think of a young... Read More AI risk model: single or multiple AIs? Posted on Apr 15, 2016 in English Essays, English Posts | 6 comments EDIT April 20th: Replaced original graph with a clearer one. My previous posts have basically been discussing a scenario where a single AI becomes powerful enough to threaten humanity. However, there is no reason to only focus on the scenario with a single AI. Depending on our assumptions, a number of AIs could also emerge at the same time. Here are some considerations. A single AI The classic... Read More AI thought process visualization Posted on Dec 29, 2011 in English Essays, English Posts, Essays | 0 comments I started thinking about all the original computer science CGI stuff you could do in a sci-fi movie or TV series. Read More An appreciation of the Less Wrong Sequences Posted on Aug 16, 2016 in English Essays, English Posts | 1 comment Ruby Bloom recently posted about the significance of Eliezer Yudkowsky‘s Less Wrong Sequences on his thinking. I felt compelled to do the same. Before reading the Sequences, I was what the Sequences would call “a clever arguer” – someone who was good at coming up with arguments for their own favored position, and didn’t really feel all that compelled to care... Read More Applied cognitive science: learning from a faux pas Posted on Apr 12, 2010 in English Essays, English Posts | 0 comments Yesterday evening, I pasted to two IRC channels an excerpt of what someone had written. In the context of the original text, that excerpt had seemed to me like harmless if somewhat raunchy humor. What I didn’t realize at the time was that by removing the context, the person writing it came off looking like a jerk, and by laughing at it I came off looking as something of a jerk as well. Two... Read More Circling as practice for “just be yourself” Posted on Dec 16, 2024 in English Essays, English Posts | 0 comments I mentioned on Twitter that to a significant extent, Circling taught me what “just be yourself” means to such an extent that I have a consistently good time on dates because I don’t feel like I need to perform. Somebody asked me to elaborate, so here’s what I wrote in response: — For those who don’t know, Circling is… a practice that’s infamously... Read More Decisive Strategic Advantage without a Hard Takeoff (part 1) Posted on Apr 27, 2016 in English Essays, English Posts | 3 comments A common question when discussing the social implications of AI is the question of whether to expect a soft takeoff or a hard takeoff. In a hard takeoff, an AI will, within a relatively short time, grow to superhuman levels of intelligence and become impossible for mere humans to control anymore. Essentially, a hard takeoff will allow the AI to achieve what’s a so-called decisive strategic... Read More DeepDream: Today psychedelic images, tomorrow unemployed artists Posted on Jul 7, 2015 in English Essays, English Posts | 6 comments One interesting thing that I noticed about Google’s DeepDream algorithm (which you might also know as “that thing making all pictures look like psychedelic trips“) is that it seems to increase the image quality. For instance, my current Facebook profile picture was ran through DD and looks sharper than the original, which was relatively fuzzy and grainy. If you know how DD... Read More Depressed due to a lack of accomplishments? Posted on Sep 23, 2006 in English Essays, Essays | 0 comments Don't be. You still have plenty of time. Read More Dissecting edugames: iCivics.org Posted on May 8, 2013 in English Essays, English Posts | 0 comments The Serious Games Market blog showcases a number of interesting edugames, and I thought that I should try some. One of the posts linked to an interesting-sounding site called iCivics.org, which has a number of educational games that are designed to teach kids about the way the US government works. Some of the games were relatively good. Others were dreadful enough that even with a designed... Read More Doing Good in the Addiction Economy Posted on Sep 8, 2013 in English Essays, English Posts | 30 comments The world is becoming ever-more addictive and distracting, showering us with short-term rewards. But we can still take control of those mechanisms in order to do good in the world, and make ourselves into better people. Read More Don’t trust people, trust their components Posted on Feb 8, 2014 in English Essays, English Posts | 9 comments I used to think that people were either trustworthy, semi-trustworthy, or unreliable. Basically, there was a single scale, and if you were high enough on that scale, you could be counted on when it came to anything important. My model wasn’t quite this simplistic – for instance, I did acknowledge that someone like my mother could be trustworthy for me but less motivated in helping out... Read More Empowering the growth of others: an underutilized desire for game design? Posted on Apr 3, 2017 in English Essays | 6 comments There’s a human desire which is very emotionally powerful, and which I’m a little surprised to realize that very few video games seem to have tapped into. (That I know of? Please let me know about any counter-examples!) The desire is for a specific way of helping others and seeing the consequences of that help. It’s when you help someone acquire a new skill or ability, see them... Read More How feeling more secure feels different than I expected Posted on Sep 17, 2021 in English Essays, English Posts | 0 comments This year, I’ve been feeling more emotionally secure, thanks to various kinds of internal and external work (the stuff at https://attachmentrepair.com/ being one notable example). The effect of this doesn’t always feel like I expected it to feel. I once thought that in order to not worry so much about whether people like me, I would need to become convinced that they do like me. Or at... Read More How I found & fixed a major cause of my depression and anxiety Posted on Jul 26, 2017 in English Essays, English Posts | 23 comments EDIT Dec 18, 2018: For a followup of how the changes in this post have lasted, see “18-month followup on my self-concept work“. EDIT Aug 7th, 2022: As a five-year follow-up: the above followup is still roughly correct, in that this did represent a major and significant change for the better, and at the same time there were also other causes of depression and anxiety that would... Read More Incorrect hypotheses point to correct observations Posted on Nov 20, 2018 in English Essays, English Posts | 0 comments 1. The Consciousness Researcher and Out-Of-Body Experiences In his book Consciousness and the Brain, cognitive neuroscientist Stansilas Dehaene writes about scientifically investigating people’s reports of their out-of-body experiences: … the Swiss neurologist Olaf Blanke[ did a] beautiful series of experiments on out-of-body experiences. Surgery patients occasionally report leaving... Read More Jasen Murray on tranquility meditation Posted on May 15, 2013 in English Essays, English Posts | 0 comments Since the page that I previously used to link to for a description of how to do tranquility meditation has died, I’m reposting the instructions here. I found them very useful in getting started with meditation, and they seemed to work better for me than any other instructions. Original credit for writing them goes to Jasen Murray. —- Very brief summary: Use either the breath or metta... Read More Learning from painful experiences Posted on Nov 12, 2015 in English Essays, English Posts | 1 comment A model that I've found very useful is that pain is an attention signal. If there's a memory or thing that you find painful, that's an indication that there's something important in that memory that your mind is trying to draw your attention to. Once you properly internalize the lesson in question, the pain will go away. Read More « Older Entries Recent Posts “Miksi jonkun pitäisi saada käyttää kenkiä?” 1. Ainulindalë 14 objections against AI/Friendly AI/The Singularity answered 18-month follow-up on my self-concept work A Date with Darin This work by Kaj Sotala is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License. In addition to making a public comment, you may also send me anonymous feedback."
