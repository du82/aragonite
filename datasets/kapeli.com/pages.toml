title = "Brackets Cheat Sheet - Kapeli"
description = "Toggle sidebar"
full_description = "View / Window Manipulation CMD+SHIFT+H Toggle sidebar CMD+M Minimize File and Folders CMD+N New file CMD+O Open file CMD+OPTION+O Open folder CMD+W Close file CMD+SHIFT+W Close all files File Navigation CMD+SHIFT+O Quick open CMD+L Go to line CMD+T Quick find definition CMD+J Jump to definition CMD+` Goto first problem CMD+SHIFT+] Next document CMD+SHIFT+[ Previous document CMD+E Toggle quick edit OPTION+Arrow Up Previous match OPTION+Arrow Down Next match CMD+OPTION+N New rule CMD+FN+Arrow Left Goto file start CMD+FN+Arrow Right Goto file end FN+Arrow Up Page up FN+Arrow Down Page down Find CMD+F Find in file CMD+SHIFT+F Find in project CMD+G Find next CMD+SHIFT+G Find previous CMD+CTRL+G Find all and select CMD+B Add next match to selection CMD+SHIFT+B Skip and add next match to selection Replace CMD+OPTION+F Replace CMD+OPTION+SHIFT+F Replace in project Folding OPTION+1 Collapse all OPTION+SHIFT+1 Expand all CMD+OPTION+[ Collapse current CMD+OPTION+] Expand current Basic Editing CMD+C Copy CMD+X Cut CMD+V Paste CMD+Z Undo CMD+SHIFT+Z Redo Line Manipulation CMD+] Indent current line or selection CMD+[ Outdent current line or selection CMD+Return Insert newline after current line or selection CMD+SHIFT+Return Insert newline before current line or selection CTRL+SHIFT+D Delete current line or selection CMD+Backspace Delete to line start CMD+Delete Delete to line end CTRL+SHIFT+Arrow Up Move current line or selection up CTRL+SHIFT+Arrow Down Move current line or selection down CMD+D Duplicate current line or selection CMD+OPTION+L Split selection into lines CMD+/ Toggle line comment CMD+SHIFT+/ Toggle block comment Word Manipulation CTRL+T Transpose characters either side of the cursor OPTION+Backspace Delete text to beginning of word OPTION+Delete Delete text to end of word Cursors OPTION+SHIFT+Arrow Down Add cursor to next line OPTION+SHIFT+Arrow Up Add cursor to previous line Selection CMD+A Select all CTRL+L Select current line OPTION+SHIFT+Arrow Left Select to beginning of word OPTION+SHIFT+Arrow Right Select to end of word CMD+SHIFT+Arrow Left Select to first character of line CMD+SHIFT+Arrow Right Select to last character of line CMD+SHIFT+Arrow Up Select to beginning of document CMD+SHIFT+Arrow Down Select to end of document CMD+U Undo selection CMD+SHIFT+U Redo selection Hints CTRL+Space Show code hints CTRL+SHIFT+Space Show parameter hint Live Preview CMD+OPTION+P Enable live preview CMD+SHIFT+C Toggle live preview highlight CMD+SHIFT+R Force reload of live preview Debugging CMD+OPTION+I Show developer tools CMD+R Reload with extensions CMD+CTRL-R Reload without extensions Miscellaneous F1 Help F2 Rename file CMD+Plus Increase font size CMD+Minus Decrease font size CMD+0 Restore font size to default Notes Created by David Waterston."
year_published = 2025
clearnet = "https://kapeli.com/cheat_sheets/Brackets.docset/Contents/Resources/Documents/index"
