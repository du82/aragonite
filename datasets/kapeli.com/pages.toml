om the selection CMD+G Create Storyline Create a storyline from a selection of connected clips 1 Cut and Switch to Viewer Angle 1 Cut and switch the multicam clip to angle 1 of the current bank 2 Cut and Switch to Viewer Angle 2 Cut and switch the multicam clip to angle 2 of the current bank 3 Cut and Switch to Viewer Angle 3 Cut and switch the multicam clip to angle 3 of the current bank 4 Cut and Switch to Viewer Angle 4 Cut and switch the multicam clip to angle 4 of the current bank 5 Cut and Switch to Viewer Angle 5 Cut and switch the multicam clip to angle 5 of the current bank 6 Cut and Switch to Viewer Angle 6 Cut and switch the multicam clip to angle 6 of the current bank 7 Cut and Switch to Viewer Angle 7 Cut and switch the multicam clip to angle 7 of the current bank 8 Cut and Switch to Viewer Angle 8 Cut and switch the multicam clip to angle 8 of the current bank 9 Cut and Switch to Viewer Angle 9 Cut and switch the multicam clip to angle 9 of the current bank Delete Delete Delete the timeline selection, reject the browser selection, or remove a through edit CMD+OPTION+Delete Delete Selection Only Delete the selection and attach the connected clip or clips to the resulting gap clip CMD+SHIFT+A Deselect All Deselect all selected items CMD+D Duplicate Duplicate the browser selection V Enable/Disable Clip Enable or disable playback for the selection CTRL+S Expand Audio View audio and video separately for selected clips CTRL+OPTION+S Expand/Collapse Audio Components Expand or collapse audio components for the selection in the timeline SHIFT+X Extend Edit Extend the selected edit point to the skimmer or playhead position SHIFT+Down Arrow Extend Selection Down In the browser list view, add the next item to the selection CMD+CTRL+Right-Arrow Extend Selection to Next Clip In the timeline, add the next item to the selection SHIFT+Up Arrow Extend Selection Up In the browser list view, add the previous item to the selection OPTION+SHIFT+Y Finalize Audition Dissolve 