["https://kapeli.com/cheat_sheets/Chromium_Command_Line_Switches.docset/Contents/Resources/Documents/index"]
title = "Chromium Command Line Switches Cheat Sheet - Kapeli"
description = """
--/prefetch:1
The constant OS_WIN must be defined.

/prefetch:# arguments to use when launching various process types. It has been observed that when file reads are consistent for 3 process launches with the same /prefetch:# argument, the Windows prefetcher starts issuing reads in batch at process launch. Because reads depend on the process type, the prefetcher wouldn't be able to observe consistent reads if no /prefetch:# arguments were used. Note that the browser process has no /prefetch:# argument; as such all other processes must have one in order to avoid polluting its profile. Note: # must always be in [1, 8]; otherwise it is ignored by the Windows prefetcher."""
full_description = '''Chromium Command Line Switches --/prefetch:1 The constant OS_WIN must be defined. /prefetch:# arguments to use when launching various process types. It has been observed that when file reads are consistent for 3 process launches with the same /prefetch:# argument, the Windows prefetcher starts issuing reads in batch at process launch. Because reads depend on the process type, the prefetcher wouldn't be able to observe consistent reads if no /prefetch:# arguments were used. Note that the browser process has no /prefetch:# argument; as such all other processes must have one in order to avoid polluting its profile. Note: # must always be in [1, 8]; otherwise it is ignored by the Windows prefetcher. --/prefetch:2 The constant OS_WIN must be defined. No description --/prefetch:3 The constant OS_WIN must be defined. No description --/prefetch:4 The constant OS_WIN must be defined. No description --/prefetch:5 The constant OS_WIN must be defined. /prefetch:# arguments for the browser process launched in background mode and for the watcher process. Use profiles 5, 6 and 7 as documented on kPrefetchArgument* in content_switches.cc. --/prefetch:6 The constant OS_WIN must be defined. No description --/prefetch:8 The constant OS_WIN must be defined. /prefetch:# argument shared by all process types that don't have their own. It is likely that the prefetcher won't work for these process types as it won't be able to observe consistent file reads across launches. However, having a valid prefetch argument for these process types is required to prevent them from interfering with the prefetch profile of the browser process. --0 Value of the --profiler-timing flag that will disable timing information for chrome://profiler. --? No description --accept-resource-provider Flag indicating that a resource provider must be set up to provide cast receiver with resources. Apps cannot start until provided resources. This flag implies --alsa-check-close-timeout=0. --adaboost No description --aec-refined-adaptive-filter Enables a new tuning of the WebRTC Acoustic Echo Canceler (AEC). The new tuning aims at resolving two issues with the AEC: https://bugs.chromium.org/p/webrtc/issues/detail?id=5777 https://bugs.chromium.org/p/webrtc/issues/detail?id=5778 TODO(hlundin): Remove this switch when experimentation is over; crbug.com/603821. --agc-startup-min-volume Override the default minimum starting volume of the Automatic Gain Control algorithm in WebRTC used with audio tracks from getUserMedia. The valid range is 12-255. Values outside that range will be clamped to the lowest or highest valid value inside WebRTC. TODO(tommi): Remove this switch when crbug.com/555577 is fixed. --aggressive No description --aggressive-cache-discard No description --aggressive-tab-discard No description --allow-cross-origin-auth-prompt Allows third-party content included on a page to prompt for a HTTP basic auth username/password pair. --allow-data-roaming-by-default If this flag is set, enable data roaming in the cellular network by default upon system start if it's an unmanaged device. This flag is used by Rialto device to obtain device policy during OOBE since the Rialto device has no display and and only connects over cell. --allow-external-pages Allow access to external pages during layout tests. --allow-failed-policy-fetch-for-test If this flag is passed, failed policy fetches will not cause profile initialization to fail. This is useful for tests because it means that tests don't have to mock out the policy infrastructure. --allow-file-access-from-files By default, file:// URIs cannot read other file:// URIs. This is an override for developers who need the old behavior for testing. --allow-hidden-media-playback Allows media playback for hidden WebContents --allow-http-background-page Allows non-https URL for background_page for hosted apps. --allow-http-screen-capture Allow non-secure origins to use the screen capture API and the desktopCapture extension API. --allow-insecure-localhost Enables TLS/SSL errors on localhost to be ignored (no interstitial, no blocking of requests). --allow-legacy-extension-manifests Allows the browser to load extensions that lack a modern manifest when that would otherwise be forbidden. --allow-loopback-in-peer-connection Allows loopback interface to be added in network list for peer connection. --allow-nacl-crxfs-api The constant BUILDFLAG(ENABLE_PLUGINS) must be defined. Specifies comma-separated list of extension ids or hosts to grant access to CRX file system APIs. --allow-nacl-file-handle-api The constant BUILDFLAG(ENABLE_PLUGINS) must be defined. Specifies comma-separated list of extension ids or hosts to grant access to file handle APIs. --allow-nacl-socket-api The constant BUILDFLAG(ENABLE_PLUGINS) must be defined. Specifies comma-separated list of extension ids or hosts to grant access to TCP/UDP socket APIs. --allow-no-sandbox-job Enables the sandboxed processes to run without a job object assigned to them. This flag is required to allow Chrome to run in RemoteApps or Citrix. This flag can reduce the security of the sandboxed processes and allow them to do certain API calls like shut down Windows or access the clipboard. Also we lose the chance to kill some processes until the outer job that owns them finishes. --allow-outdated-plugins Don't block outdated plugins. --allow-ra-in-dev-mode Allows remote attestation (RA) in dev mode for testing purpose. Usually RA is disabled in dev mode because it will always fail. However, there are cases in testing where we do want to go through the permission flow even in dev mode. This can be enabled by this flag. --allow-running-insecure-content By default, an https page cannot run JavaScript, CSS or plugins from http URLs. This provides an override to get the old insecure behavior. --allow-sandbox-debugging Allows debugging of sandboxed processes (see zygote_main_linux.cc). --allow-silent-push Allows Web Push notifications that do not show a notification. --alsa-check-close-timeout Time in ms to wait before closing the PCM handle when no more mixer inputs remain. Assumed to be 0 if --accept-resource-provider is present. --alsa-enable-upsampling Flag that enables resampling audio with sample rate below 32kHz up to 48kHz. Should be set to true for internal audio products. --alsa-fixed-output-sample-rate Optional flag to set a fixed sample rate for the alsa device. --alsa-input-device The constants OS_FREEBSD, OS_LINUX and OS_SOLARIS must be defined. The Alsa device to use when opening an audio input stream. --alsa-output-avail-min Minimum number of available frames for scheduling a transfer. --alsa-output-buffer-size Size of the ALSA output buffer in frames. This directly sets the latency of the output device. Latency can be calculated by multiplying the sample rate by the output buffer size. --alsa-output-device The constants OS_FREEBSD, OS_LINUX and OS_SOLARIS must be defined. The Alsa device to use when opening an audio stream. --alsa-output-period-size Size of the ALSA output period in frames. The period of an ALSA output device determines how many frames elapse between hardware interrupts. --alsa-output-start-threshold How many frames need to be in the output buffer before output starts. --also-emit-success-logs Also emit full event trace logs for successful tests. --always-authorize-plugins Prevents Chrome from requiring authorization to run certain widely installed but less commonly used plugins. --always-on No description --always-use-complex-text Always use the complex text path for layout tests. --alwaystrue No description --android-fonts-path Uses the android SkFontManager on linux. The specified directory should include the configuration xml file with the name "fonts.xml". This is used in blimp to emulate android fonts on linux. --android-stderr-port The constant OS_ANDROID must be defined. Redirect stderr to the given port. Only supported on Android. --android-stdin-port The constant OS_ANDROID must be defined. Redirect stdin to the given port. Only supported on Android. --android-stdout-port The constant OS_ANDROID must be defined. Redirect stdout to the given port. Only supported on Android. --angle No description --app Specifies that the associated value should be launched in "application" mode. --app-auto-launched Specifies whether an app launched in kiosk mode was auto launched with zero delay. Used in order to properly restore auto-launched state during session restore flow. --app-id Specifies that the extension-app with the specified id should be launched according to its configuration. --app-mode-auth-code Value of GAIA auth code for --force-app-mode. --app-mode-oauth-token Value of OAuth2 refresh token for --force-app-mode. --app-mode-oem-manifest Path for app's OEM manifest file. --app-shell-allow-roaming Allow roaming in the cellular network. --app-shell-host-window-size Size for the host window to create (i.e. "800x600"). --app-shell-preferred-network SSID of the preferred WiFi network. --app-shell-refresh-token Refresh token for identity API calls for the current user. Used for testing. --app-shell-user User email address of the current user. --apple No description --apps-gallery-download-url The URL that the webstore APIs download extensions from. Note: the URL must contain one '%s' for the extension ID. --apps-gallery-update-url The update url used by gallery/webstore extensions. --apps-gallery-url The URL to use for the gallery link in the app launcher. --apps-keep-chrome-alive-in-tests The constant OS_MACOSX must be defined. Prevents Chrome from quitting when Chrome Apps are open. --arc-availability Signals ARC support status on this device. This can take one of the following three values. - none: ARC is not installed on this device. (default) - installed: ARC is installed on this device, but not officially supported. Users can enable ARC only when Finch experiment is turned on. - installed-only-kiosk-supported: ARC is installed, but officially supported only in kiosk mode. - officially-supported: ARC is installed and supported on this device. So users can enable ARC via settings etc. - officially-supported-with-active-directory: ARC is supported and also allowed to use with Active Directory management. --arc-available DEPRECATED: Please use --arc-availability=installed. Signals the availability of the ARC instance on this device. --artifacts-dir Screenshot testing: specifies the directoru where artifacts will be stored. --ash-adjustable-large-cursor Enables adjustable large cursor. --ash-animate-from-boot-splash-screen Enables an animated transition from the boot splash screen (Chrome logo on a white background) to the login screen. Implies |kAshCopyHostBackgroundAtBoot| and doesn't make much sense if used in conjunction with |kDisableBootAnimation| (since the transition begins at the same time as the white/grayscale login screen animation). --ash-copy-host-background-at-boot Copies the host window's content to the system background layer at startup. Can make boot slightly slower, but also hides an even-longer awkward period where we display a white background if the login wallpaper takes a long time to load. --ash-debug-shortcuts Enable keyboard shortcuts useful for debugging. --ash-dev-shortcuts Enable keyboard shortcuts used by developers only. --ash-disable-maximize-mode-window-backdrop Disables the window backdrops normally used in maximize mode (TouchView). --ash-disable-screen-orientation-lock Disable the support for WebContents to lock the screen orientation. --ash-disable-touch-exploration-mode Disable the Touch Exploration Mode. Touch Exploration Mode will no longer be turned on automatically when spoken feedback is enabled when this flag is set. --ash-enable-docked-windows Enables docking windows to the right or left (not to be confused with snapped windows). --ash-enable-magnifier-key-scroller Enables key bindings to scroll magnified screen. --ash-enable-mirrored-screen Enables mirrored screen. --ash-enable-palette-on-all-displays Enables the palette on every display, instead of only the internal one. --ash-enable-software-mirroring Enables software based mirroring. --ash-enable-unified-desktop The constant OS_CHROMEOS must be defined. Enables unified desktop mode. --ash-force-enable-palette Enables the palette next to the status area. --ash-hide-notifications-for-factory Hides notifications that are irrelevant to Chrome OS device factory testing, such as battery level updates. --ash-host-window-bounds Sets a window size, optional position, and optional scale factor. "1024x768" creates a window of size 1024x768. "100+200-1024x768" positions the window at 100,200. "1024x768*2" sets the scale factor to 2 for a high DPI display. "800,0+800-800x800" for two displays at 800x800 resolution. "800,0+800-800x800,0+1600-800x800" for three displays at 800x800 resolution. --ash-shelf-color Enables the shelf color to be derived from the wallpaper. --ash-touch-hud Enables the heads-up display for tracking touch points. --ash-webui-init When wallpaper boot animation is not disabled this switch is used to override OOBE/sign in WebUI init type. Possible values: parallel|postpone. Default: parallel. --attestation-server Determines which Google Privacy CA to use for attestation. --audio-buffer-size Allow users to specify a custom buffer size for debugging purpose. --aura-legacy-power-button (Most) Chrome OS hardware reports ACPI power button releases correctly. Standard hardware reports releases immediately after presses. If set, we lock the screen or shutdown the system immediately in response to a press instead of displaying an interactive animation. --auth-ext-path Enables overriding the path for the default authentication extension. --auth-server-whitelist Whitelist for Negotiate Auth servers --auth-spnego-account-type The constant OS_ANDROID must be defined. Android authentication account type for SPNEGO authentication --auto The values the kTouchEventFeatureDetection switch may have, as in --touch-events=disabled. auto: enabled at startup when an attached touchscreen is present. --auto-open-devtools-for-tabs This flag makes Chrome auto-open DevTools window for each tab. It is intended to be used by developers and automation to not require user interaction for opening DevTools. --auto-select-desktop-capture-source This flag makes Chrome auto-select the provided choice when an extension asks permission to start desktop capture. Should only be used for tests. For instance, --auto-select-desktop-capture-source="Entire screen" will automatically select to share the entire screen in English locales. --blink-settings Set blink settings. Format is <name>[=<value],<name>[=<value>],... The names are declared in Settings.json5. For boolean type, use "true", "false", or omit '=<value>' part to set to true. For enum type, use the int value of the enum value. Applied after other command line flags and prefs. --bootstrap Values for the kExtensionContentVerification fla'''
