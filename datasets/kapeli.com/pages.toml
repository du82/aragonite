["https://kapeli.com/cheat_sheets/Amethyst.docset/Contents/Resources/Documents/index"]
title = "Amethyst Cheat Sheet - Kapeli"
description = """
cycle-layout

Cycle layout to the next layout"""
full_description = "Layouts mod1 + space cycle-layout Cycle layout to the next layout mod2 + space cycle-layout-backward Cycle layout to the previous layout mod1 + a select-tall-layout Select the tall layout: a main area on the left and a secondary area on the right mod1 + s select-wide-layout Select the wide layout: a main area on the top and a secondary column on the right mod1 + d select-fullscreen-layout Select the fullscreen layout: all windows are sized to fill the screen mod1 + f select-column-layout All windows are distributed in evenly sized in columns from left to right mod1 + h shrink-main Shrink the main pane of the current layout mod1 + l expand-main Expand the main pane of the current layout mod1 + , increase-main Increase the number of windows in the main pane mod1 + . decrease-main Decrease the number of windows in the main pane mod1 + t toggle-float Toggle the focused window between being floating and tiled mod2 + t toggle-tiling Toggle tiling of all windows mod1 + i display-current-layout Show a HUD with the current layout Windows mod1 + w focus-screen-1 Focus the main window on the first screen mod1 + e focus-screen-2 Focus the main window on the second screen mod1 + r focus-screen-3 Focus the main window on the third screen mod2 + w throw-screen-1 Throw the focused window to the first screen mod2 + e throw-screen-2 Throw the focused window to the second screen mod2 + r throw-screen-3 Throw the focused window to the third screen mod1 + j focus-ccw Move window focus counter-clockwise on the current screen mod1 + k focus-cw Move window focus clockwise on the current screen mod2 + h swap-screen-ccw Throw the focused window counter-clockwise to the next screen mod2 + l swap-screen-cw Throw the focused window clockwise to the next screen mod2 + j swap-ccw Swap focused window with the next window going counter-clockwise mod2 + k swap-cw Swap focused window with the next window going clockwise mod1 + enter swap-main Swap focused window with the main window of its screen mod2 + 1 throw-space-1 Throw the focused window to the first space mod2 + 2 throw-space-2 Throw the focused window to the second space mod2 + 3 throw-space-3 Throw the focused window to the third space mod2 + 4 throw-space-4 Throw the focused window to the fourth space mod2 + 5 throw-space-5 Throw the focused window to the fifth space mod2 + 6 throw-space-6 Throw the focused window to the sixth space mod2 + 7 throw-space-7 Throw the focused window to the seventh space mod2 + 8 throw-space-8 Throw the focused window to the eighth space mod2 + 9 throw-space-9 Throw the focused window to the ninth space"
