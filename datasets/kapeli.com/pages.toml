full_description = 'General CMD+SHIFT+P Toggle command palette CMD+/ Comment line or selection CTRL+Space Show available auto-completions CTRL+SHIFT+L Select grammar (set/change syntax) CMD+, Open settings Find CMD+F Find in file CMD+G Find next CMD+SHIFT+F Find in project CMD+E Use selection for find View / Window Manipulation CMD+\ Toggle tree-view sidebar CMD+CTRL+F Toggle fullscreen CMD+K, Arrow Key Split pane left, right, up or down CMD+K+Arrow Key Focus pane left, right, up or down File Navigation CMD+P Toggle file finder CTRL+G Go to line CMD+R Go to symbol CMD+SHIFT+} Next file CMD+SHIFT+{ Previous file CMD+F2 Set bookmark F2 Go to next bookmark Git Integration CMD+SHIFT+B Git status list CMD+OPTION+Z Checkout head revision OPTION+G+Arrow Down Move to next diff OPTION+G+Arrow Up Move to previous diff Folding CMD+OPTION+[ Fold current code block CMD+OPTION+] Unfold current code block CMD+OPTION+SHIFT+[ Fold all code blocks CMD+OPTION+SHIFT+] Unfold all code blocks CMD+1-9 Fold code blocks at depth 1-9 Word Manipulation CTRL+T Transpose characters either side of cursor OPTION+Backspace Delete text to beginning of word OPTION+Delete Delete text to end of word Line Manipulation CMD+] Indent current line CMD+[ Outdent current line CMD+Return Insert newline after current line CMD+SHIFT+Return Insert newline before current line CTRL+SHIFT+K Delete current line CMD+CTRL+Arrow Up Move current line up CMD+CTRL+Arrow Down Move current line down CMD+SHIFT+D Duplicate current line CMD+J Join current and next lines Selection CMD+D Select current word/token CMD+L Select current line OPTION+SHIFT+Arrow Left Select to beginning of word OPTION+SHIFT+Arrow Right Select to end of word CMD+SHIFT+Arrow Left Select to first character of line CMD+SHIFT+Arrow Right Select to last character of line CMD+SHIFT+Arrow Up Select to beginning of document CMD+SHIFT+Arrow Down Select to end of document Notes Based on a cheat sheet from Bugsnag. Converted by Dominic Damian.'
