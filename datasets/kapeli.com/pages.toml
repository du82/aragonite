ainer IPv4 address (e.g. 172.30.100.104) --ip6 Container IPv6 address (e.g. 2001:db8::33) --ipc IPC namespace to use --isolation Container isolation technology --kernel-memory Kernel memory limit -l value Set meta data on a container (default []) --label-file Read in a line delimited file of labels (default []) --link Add link to another container (default []) --link-local-ip Container IPv4/IPv6 link-local addresses (default []) --log-driver Logging driver for container --log-opt Log driver options (default []) --mac-address Container MAC address (e.g. 92:d0:c6:0a:29:33) -m string Memory limit --memory-reservation Memory soft limit --memory-swap Swap limit equal to memory plus swap: '-1' to enable unlimited swap --memory-swappiness Tune container memory swappiness (0 to 100) (default -1) --name Assign a name to the container --net Connect a container to a network (default "default") --net-alias Add network-scoped alias for the container (default []) --no-healthcheck Disable any container-specified HEALTHCHECK --oom-kill-disable Disable OOM Killer --oom-score-adj Tune host's OOM preferences (-1000 to 1000) --pid PID namespace to use --pids-limit Tune container pids limit (set -1 for unlimited) --privileged Give extended privileges to this container -p value Publish a container's port(s) to the host (default []) -P Publish all exposed ports to random ports --read-only Mount the container's root filesystem as read only --restart Restart policy to apply when a container exits (default "no") --runtime Runtime to use for this container --security-opt Security Options (default []) --shm-size Size of /dev/shm, default value is 64MB --stop-signal Signal to stop a container, SIGTERM by default (default "SIGTERM") --storage-opt Set storage driver options per container (default []) --sysctl Sysctl options (default map[]) --tmpfs Mount a tmpfs directory (default []) -t Allocate a pseudo-TTY --ulimit Ulimit options (default []) -u string Username or UID (format: <name|uid>[:<grou