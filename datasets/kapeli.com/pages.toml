write - Backtimed Overwrite from the skimmer or playhead position back CMD+OPTION+Down Arrow Overwrite to Primary Storyline Overwrite at the skimmer or playhead position in the primary storyline OPTION+V Paste as Connected Paste the selection and connect it to the primary storyline CMD+V Paste Insert at Playhead Insert the Clipboard contents at the skimmer or playhead position CTRL+SHIFT+Left Arrow Previous Angle Switch to the previous angle in the multicam clip OPTION+SHIFT+Left Arrow Previous Audio Angle Switch to the previous audio angle in the multicam clip CTRL+Left Arrow Previous Pick Select the previous clip in the Audition window, making it the audition pick CMD+SHIFT+Left Arrow Previous Video Angle Switch to the previous video angle in the multicam clip CTRL+= Raise Volume 1 dB Raise the audio volume by 1 dB SHIFT+R Replace Replace the selected clip in the timeline with the browser selection OPTION+R Replace from Start Replace the selected clip in the timeline with the browser selection, starting from its start point SHIFT+Delete Replace with Gap Replace the selected timeline clip with a gap clip CMD+A Select All Select all clips C Select Clip Select the clip under the pointer in the timeline CMD+Up Arrow Select Clip Above Select the clip above the current timeline selection at the skimmer or playhead location CMD+Down Arrow Select Clip Below Select the clip below the current timeline selection at the skimmer or playhead location SHIFT+[ Select Left Audio Edge For audio/video clips in expanded view, select the left edge of the audio edit point [ Select Left Edge Select the left edge of the edit point SHIFT+\ Select Left and Right Audio Edit Edges For audio/video clips in expanded view, select the left and right edges of the audio edit point \ Select Left and Right Edit Edges Select the left and right edges of the edit point CTRL+\ Select Left and Right Video Edit Edges For audio/video clips in expanded view, select the left and right edges of the video edit point CTRL+[ Select Left Video Edge For audio/video clips in expanded view, select the left edge of the video edit point CTRL+SHIFT+Right Arrow Select Next Angle Switch to the next angle in the multicam clip OPTION+SHIFT+Right Arrow Select Next Audio Angle Switch to the next audio angle in the multicam clip CMD+Right Arrow Select Next Clip Move the playhead and the selection to the next topmost timeline clip in the same role CTRL+Right Arrow Select Next Pick Select the next clip in the Audition window, making it the audition pick CMD+SHIFT+Right Arrow Select Next Video Angle Switch to the next video angle in the multicam clip CMD+Left Arrow Select Previous Clip Move the playhead and the selection to the previous topmost timeline clip in the same role SHIFT+] Select Right Audio Edge For audio/video clips in expanded view, select the right edge of the audio edit point ] Select Right Edge Select the right edge of the edit point CTRL+] Select Right Video Edge For audio/video clips in expanded view, select the right edge of the video edit point CMD+SHIFT+O Set Additional Selection End Set an additional range selection end point at the playhead or skimmer location CMD+SHIFT+I Set Additional Selection Start Set an additional range selection start point at the playhead or skimmer location CTRL+E Show/Hide Precision Editor When an edit point is selected, show or hide the precision editor N Snapping Turn snapping on or off OPTION+S Solo Solo the selected items in the timeline SHIFT+1 Source Media: Audio & Video Turn on audio/video mode to add the video and audio portion of your selection to the timeline SHIFT+3 Source Media: Audio Only Turn on audio-only mode to add the audio portion of your selection to the timeline SHIFT+2 Source Media: Video Only Turn on video-only mode to add the video portion of your selection to the timeline CMD+CTRL+OPTION+C Split Caption Replace the selected captions with abutting single-line captions, one for each line of text in the original captions. OPTION+1 Switch to Viewer Angle 1 Switch the multicam clip to angle 1 of the current bank OPTION+2 Switch to Viewer Angle 2 Switch the multicam clip to angle 2 of the current bank OPTION+3 Switch to Viewer Angle 3 Switch the multicam clip to angle 3 of the current bank OPTION+4 Switch to Viewer Angle 4 Switch the multicam clip to angle 4 of the current bank OPTION+5 Switch to Viewer Angle 5 Switch the multicam clip to angle 5 of the current bank OPTION+6 Switch to Viewer Angle 6 Switch the multicam clip to angle 6 of the current bank OPTION+7 Switch to Viewer Angle 7 Switch the multicam clip to angle 7 of the current bank OPTION+8 Switch to Viewer Angle 8 Switch the multicam clip to angle 8 of the current bank OPTION+9 Switch to Viewer Angle 9 Switch the multicam clip to angle 9 of the current bank G Toggle Storyline Mode Turn on or turn off the ability to build storylines when dragging clips in the timeline OPTION+] Trim End Trim the end of the selected or topmost clip to the skimmer or playhead position OPTION+[ Trim Start Trim the clip start point to the skimmer or playhead position OPTION+\ Trim to Selection Trim clip start and end points to the range selection Effects CTRL+SHIFT+T Add Basic Lower Third Connect a basic lower-third title to the primary storyline CTRL+T Add Basic Title Connect a basic title to the primary storyline CMD+OPTION+E Add Default Audio Effect Add the default audio effect to the selection CMD+T Add Default Transition Add the default transition to the selection OPTION+E Add Default Video Effect Add the default video effect to the selection OPTION+Delete Color Board: Reset Current Board Controls Reset the controls in the current Color Board pane CMD+CTRL+C Color Board: Switch to the Color Pane Switch to the Color pane in the Color Board CMD+CTRL+E Color Board: Switch to the Exposure Pane Switch to the Exposure pane in the Color Board CMD+CTRL+S Color Board: Switch to the Saturation Pane Switch to the Saturation pane in the Color Board CMD+OPTION+C Copy Effects Copy the selected effects and their settings OPTION+SHIFT+C Copy Keyframes Copy the selected keyframes and their settings OPTION+SHIFT+X Cut Keyframes Cut the selected keyframes and their settings CMD+OPTION+B Enable/Disable Balance Color Turn Balance Color corrections on or off CMD+SHIFT+M Match Audio Match the sound between clips CMD+OPTION+M Match Color Match color between clips OPTION+Tab Next Text Navigate to the next text item CMD+SHIFT+V Paste Attributes Paste selected attributes and their settings to the selection CMD+OPTION+V Paste Effects Paste effects and their settings to the selection OPTION+SHIFT+V Paste Keyframes Paste keyframes and their settings to the selection OPTION+SHIFT+Tab Previous Text Navigate to the previous text item CMD+SHIFT+X Remove Attributes Remove selected attributes from the selection CMD+OPTION+X Remove Effects Remove all effects from the selection CMD+R Retime Editor Show or hide the retime editor SHIFT+N Retime: Create Normal Speed Segment Set the selection to play at normal (100 percent) speed SHIFT+H Retime: Hold Create a 2-second hold segment CMD+OPTION+R Retime: Reset Reset the selection to play forward at normal (100 percent) speed CTRL+SHIFT+V Solo Animation Show one effect at a time in the Video Animation editor General Delete Delete Delete the timeline selection, reject the browser selection, or remove a through edit CMD+F Find Show or hide the Filter window (in the browser) or the timeline index (in the timeline) CMD+OPTION+3 Go to Event Viewer Make the event viewer active CMD+I Import Media Import media from a device, a camera, or an archive CMD+CTRL+J Library Properties Open the Library Properties inspector for the current library CMD+Delete Move to Trash Move the selection to the Finder Trash CMD+N New Project Create a new project CMD+J Project Properties Open the Properties inspector for the current project CTRL+SHIFT+R Render All Start all rendering tasks for the current project CTRL+R Render Selection Start rendering tasks for the selection CMD+SHIFT+R Reveal in Finder Reveal the selected event clip’s source media file in the Finder Marking OPTION+C Add Caption Add a caption to the active language subrole at the playhead location M Add Marker Add a marker at the location of the skimmer or playhead CTRL+C All Clips Change the browser filter settings to show all clips OPTION+M Add Marker and Modify Add a marker and edit the marker’s text CTRL+1 Apply Keyword Tag 1 Apply keyword 1 to the selection CTRL+2 Apply Keyword Tag 2 Apply keyword 2 to the selection CTRL+3 Apply Keyword Tag 3 Apply keyword 3 to the selection CTRL+4 Apply Keyword Tag 4 Apply keyword 4 to the selection CTRL+5 Apply Keyword Tag 5 Apply keyword 5 to the selection CTRL+6 Apply Keyword Tag 6 Apply keyword 6 to the selection CTRL+7 Apply Keyword Tag 7 Apply keyword 7 to the selection CTRL+8 Apply Keyword Tag 8 Apply keyword 8 to the selection CTRL+9 Apply Keyword Tag 9 Apply keyword 9 to the selection OPTION+X Clear Selected R'
