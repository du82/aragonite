title = "Dash for macOS - API Documentation Browser, Snippet Manager - Kapeli"
description = "Dash is an API Documentation Browser and Code Snippet Manager. Dash searches offline documentation of 200+ APIs and stores snippets of code. You can also generate your own documentation sets."
full_description = "Dash is an API Documentation Browser and Code Snippet Manager. Dash instantly searches offline documentation sets for 200+ APIs, 100+ cheat sheets and more. You can even generate your own docsets or request docsets to be included. Dash comes with 200+ offline documentation sets. You can choose which documentation sets to download and Dash will take care of the rest, making sure they are kept up to date. You can also generate your own docsets, request docsets or download docsets from third-party sources. Listed below are all the various documentation sets Dash comes with. The most popular ones are highlighted. All documentation sets have been generated and are maintained with the utmost care. Dash integrates with package managers to generate documentation sets for anything you might need, as well as provide custom documentation sources of its own."
