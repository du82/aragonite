["https://kapeli.com/cheat_sheets/Bash_Shortcuts.docset/Contents/Resources/Documents/index"]
title = "Bash Shortcuts Cheat Sheet - Kapeli"
description = "Go to the start/end of the command line"
full_description = "Command Editing Shortcuts CTRL+A CTRL+E Go to the start/end of the command line CTRL+U CTRL+K Delete from cursor to the start/end of the command line CTRL+W OPTION+D Delete from cursor to start/end of word (whole word if at the boundary) CTRL+Y Paste word or text that was cut using one of the deletion shortcuts (such as the one above) after the cursor CTRL+XX Move between start of command line and current cursor position (and back again) OPTION+B OPTION+F Move backward/forward one word (or go to start of word the cursor is currently on) OPTION+C Capitalize to end of word starting at cursor (whole word if cursor is at the beginning of word) OPTION+U Make uppercase from cursor to end of word OPTION+L Make lowercase from cursor to end of word OPTION+T Swap current word with previous CTRL+F CTRL+B Move forward/backward one character CTRL+D CTRL+H Delete character after/before under cursor CTRL+T Swap character under cursor with the previous one Command Recall Shortcuts CTRL+R Search the history backwards CTRL+J End the search at current history entry CTRL+G Escape from history searching mode CTRL+P Previous command in history (i.e., walk back through the command history) CTRL+N Next command in history (i.e., walk forward through the command history) CTRL+_ Undo last command OPTION+. Use the last word of the previous command Command Control Shortcuts CTRL+L Clear the screen CTRL+S Stops the output to the screen (for long running verbose command) CTRL+Q Allow output to the screen (if previously stopped using command above) CTRL+C Terminate the command CTRL+Z Suspend/stop the command Bash Bang Shortcuts !! Run last command !blah Run the most recent command that starts with blah !blah:p Print out the command that !blah would run (also adds it as the latest command in the command history !$ The last word of the previous command (same as OPTION+.) !$:p Print out the word that !$ would substitute !* The previous command except for the first word (e.g., if you type find some_file.txt /, then !* would give you some_file.txt /) !*:p Print out what !* would substitute"
year_published = 2025
