description = "Verify conda is installed, check version #"
full_description = "Managing Conda and Anaconda conda info Verify conda is installed, check version # conda update conda Update conda package and environment manager conda update anaconda Update the anaconda meta package Managing Environments conda info --envs conda info -e Get a list of all my environments Active environment shown with * conda create --name snowflakes biopython conda create -n snowflakes biopython Create an environment and install program(s) conda activate snowflakes Activate the new environment to use it conda deactivate Deactivate the environment conda create -n bunnies python=3.4 astroid Create a new environment, specify Python version conda create -n flowers --clone snowflakes Make exact copy of an environment conda remove -n flowers --all Delete an environment conda env export > puppies.yml Save current environment to a file conda env create -f puppies.yml Load environment from a file Managing Python conda search --full-name python conda search -f python Check versions of Python available to install conda create -n snakes python=3.4 Install different version of Python in new environment Managing .condarc Configuration conda config --get Get all keys and values from my .condarc file conda config --get channels Get value of the key channels from .condarc file conda config --add channels pandas Add a new value to channels so conda looks for packages in this location Managing Packages, Including Python conda list View list of packages and versions installed in active environment conda search beautiful-soup Search for a package to see if it is available to conda install conda install -n bunnies beautiful-soup Install a new package NOTE: If you do not include the name of the environment, it will install in the current active environment. conda update beautiful-soup Update a package in the current environment conda search --override-channels -c pandas bottleneck Search for a package in a specific location (the pandas channel on Anaconda.org) conda install -c pandas bottleneck Install a package from a specific channel conda search --override-channels -c defaults beautiful-soup Search for a package to see if it is available from the Anaconda repository conda install iopro accelerate Install commercial Continuum packages conda skeleton pypi pyinstrument conda build pyinstrument Build a Conda package from a Python Package Index (PyPi) Package Removing Packages or Environments conda remove --name bunnies beautiful-soup Remove one package from any named environment conda remove beautiful-soup Remove one package from the active environment conda remove --name bunnies beautiful-soup astroid Remove multiple packages from any environment conda remove --name snakes --all Remove an environment Notes Based on the cheat sheet from Conda Docs Converted by Charles"
year_published = 2025
clearnet = "https://kapeli.com/cheat_sheets/Conda.docset/Contents/Resources/Documents/index"
