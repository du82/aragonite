["https://kapeli.com/dash_plugins"]
title = "Dash Plugins - Kapeli"
description = "This page provides instructions on how to integrate Dash with other apps."
full_description = "This page provides instructions on how plugin developers can integrate Dash with other apps. This page is not meant for regular Dash users. If you're just looking for a way to integrate Dash with your favorite app, check out Dash's Preferences > Integration. You can trigger a search in Dash by opening a dash://{query} URL. For example, click here. For instructions on how to open custom URLs in Terminal, System Services or AppleScripts, check out Dash's Preferences > Integration. Dash supports a lot of different docsets and it would be great if plugins would be able to tell Dash which docsets it should search exactly. This is usually determined based on the type of file the user currently has opened when he/she triggers a search. The trick is which keywords to use given a file type. The general guideline is to use all the keywords that are relevant. If a user does not have a docset installed for a keyword, the keyword is simply ignored, so there's no harm if you send over too many keywords. For example, if the user triggers a search from a .php file, you shouldn't only send over the php keyword, but also keywords for all the PHP frameworks and even the HTML-related ones."
year_published = 2025
