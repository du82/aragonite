full_description = '''Welcome to Dash's User Guide. The sections below will help you get the most out of Dash. As always, feel free to contact me about anything if you need further help. Documentation sets, or docsets, consist of collections of HTML files. Dash uses these docsets to store the docs you need. This section describes the various features Dash has to help you acquire and manange docsets. You can manage the docsets you have installed from within Preferences > Docsets. You can drag and drop docsets to change the order in which results appear. If you're looking for more advanced ways of managing docsets and easier switching between them, see the sections below about Search Profiles and Docset Keywords. You can set up collections of docsets and easily switch between them using search profiles. For example, let's say you do both macOS and Web development, you could set up a "macOS" search profile which automatically gets activated when Xcode launches and a "Web" search profile which automatically gets activated when Sublime Text launches. Search profiles persist between Dash launches and searches. If you explicitly do not need persistence, use Docset Keywords. Docset keywords are a very easy way to search a specific docset, regardless if it's enabled or not. Each docset has a default keyword which can be edited in Preferences > Docsets. Keywords are typed inside of the main search field. For example, PHP's default keyword is "php:". Typing "php:printf" would search the PHP docset for "printf". Note: this assumes you have the PHP docset installed. Docset keywords can also be used with the dash:// URL scheme, which makes it very easy to integrate them into plugins and extensions. For more details, see the dash:// custom URL scheme section. You can assign the same keyword to more than one docset, and Dash will search them all. However, you might want to consider using Search Profiles instead which provide more flexibility for activating collections of docsets. Docsets which support the "Table of Contents" feature show a filterable list of entries inside Dash's table of contents which is located on the left side of the Dash window (when shown). You can easily navigate this table using ALT+Down/Up Arrow.'''
year_published = 2025
clearnet = "https://kapeli.com/dash_guide"
