title = "Ack Cheat Sheet - Kapeli"
description = """
Usage:
 ack [OPTIONS]... PATTERN [FILES OR DIRECTORIES]
Search for PATTERN in each source file in the tree from the current directory on down.  If any files or directories are specified, then only those files and directories are checked. ack may also search STDIN, but only if no file or directory arguments are specified, or if one of them is -.

Default switches may be specified in the ACK_OPTIONS environment variable or an .ackrc file. If you want no dependency on the environment, turn it off with --noenv.

Example:
 ack -i select"""
full_description = '''Usage Usage: ack [OPTIONS]... PATTERN [FILES OR DIRECTORIES] Search for PATTERN in each source file in the tree from the current directory on down. If any files or directories are specified, then only those files and directories are checked. ack may also search STDIN, but only if no file or directory arguments are specified, or if one of them is -. Default switches may be specified in the ACK_OPTIONS environment variable or an .ackrc file. If you want no dependency on the environment, turn it off with --noenv. Example: ack -i select Searching -i, --ignore-case Ignore case distinctions in pattern --[no]smart-case Ignore case distinctions in pattern, but only if pattern contains no upper case Ignored if -i is specified. -v, --invert-match Invert match: select non-matching lines -w, --word-regexp Force pattern to match only whole words -Q, --literal Quote all metacharacters: pattern is literal Search Output --lines=NUM Only print NUM lines of each file -l, --files-with-matches Only print filenames containing matches -L, --files-without-matches Only print filenames with no matches --output=expr Output the evaluation of expression for each line Turns off text highlighting. -o Show only the part of a line matching pattern --passthru Print all lines, whether matching or not --match PATTERN Specify pattern explicitly. -m, --max-count=NUM Stop searching in each file after NUM matches -1 Stop searching after one match of any kind -H, --with-filename Print the filename for each match This is the default unless explicitly searching a single file. -h, --no-filename Suppress the prefixing filename on output -c, --count Show number of lines matching per file --[no]column Show the column number of the first match -A NUM, --after-context=NUM Print NUM lines of trailing context after matching lines -B NUM, --before-context=NUM Print NUM lines of leading context before matching lines -C [NUM], --context[=NUM] Print NUM lines of output context The default is 2. --print0 Print null byte as separator between filenames Only works with -f, -g, -l, -L or -c. -s Suppress error messages about nonexistent or unreadable files File Presentation --pager=COMMAND Pipe all ack output through COMMAND For example, --pager="less -R". Ignored if output is redirected. --nopager Do not send output through a pager Cancels any setting in ~/.ackrc, ACK_PAGER or ACK_PAGER_COLOR. --[no]heading Print a filename heading above each file's results The default is on, when used interactively. --[no]break Print a break between results from different files The default is on, when used interactively. --group Same as --heading --break --nogroup Same as --noheading --nobreak --[no]color Highlight the matching text The default is on unless output is redirected, or on Windows. --color-filename=COLOR Set color for filenames --color-match=COLOR Set color for matches --color-lineno=COLOR Set color for line numbers --[no]colour Same as --[no]color --flush Flush output immediately, even when ack is used non-interactively (when output goes to a pipe or file) File Finding -f Only print the files selected, without searching The PATTERN must not be specified. -g Same as -f, but only select files matching PATTERN --sort-files Sort the found files lexically --show-types Show which types each file has --files-from=FILE Read the list of files to search from FILE -x Read the list of files to search from STDIN File Inclusion and Exclusion --[no]ignore-dir=name Add or remove directory from the list of ignored directories --[no]ignore-directory=name Synonym for --ignore-dir --ignore-file=filter Add filter for ignoring files -r, -R, --recurse Recurse into subdirectories This is ack's default behavior. -n, --no-recurse No descending into subdirectories --[no]follow Follow symlinks Default is off. -k, --known-types Include only files with types that ack recognizes --type=X Include only files with the filetype X --type=noX Exclude files with the filetype X See ack --help-types for supported filetypes. Miscellaneous --[no]env Ignore environment variables and global ackrc files --ackrc=filename Specify an ackrc file to use --ignore-ack-defaults Ignore the default definitions that ack includes --create-ackrc Outputs a default ackrc for your customization to standard output --help, -? Display help --help-types Display all known types --dump Dump information on which options are loaded from which RC files --[no]filter Force ack to treat standard input as a pipe (--filter) or tty (--nofilter) --man Man page --version Display version and copyright --thpppt Bill the Cat --bar The warning admiral File Type Specification --type-set TYPE:FILTER:FILTERARGS Files with the given FILTERARGS applied to the given FILTER are recognized as being of type TYPE. This replaces an existing definition for type TYPE --type-add TYPE:FILTER:FILTERARGS Files with the given FILTERARGS applied to the given FILTER are recognized as being of type TYPE --type-del TYPE Remove all filters associated with TYPE File Types --[no]actionscript .as, .mxml --[no]ada .ada, .adb, .ads --[no]asm .asm, .s --[no]asp .asp --[no]aspx .master, .ascx, .asmx, .aspx, .svc --[no]batch .bat, .cmd --[no]cc .c, .h, .xs --[no]cfmx .cfc, .cfm, .cfml --[no]clojure .clj --[no]cmake CMakeLists.txt, .cmake --[no]coffeescript .coffee --[no]cpp .cpp, .cc, .cxx, .m, .hpp, .hh, .h, .hxx --[no]csharp .cs --[no]css .css --[no]dart .dart --[no]delphi .pas, .int, .dfm, .nfm, .dof, .dpk, .dproj, .groupproj, .bdsgroup, .bdsproj --[no]elisp .el --[no]elixir .ex, .exs --[no]erlang .erl, .hrl --[no]fortran .f, .f77, .f90, .f95, .f03, .for, .ftn, .fpp --[no]go .go --[no]groovy .groovy, .gtmpl, .gpp, .grunit, .gradle --[no]haskell .hs, .lhs --[no]hh .h --[no]html .htm, .html --[no]java .java, .properties --[no]js .js --[no]json .json --[no]jsp .jsp, .jspx, .jhtm, .jhtml --[no]less .less --[no]lisp .lisp, .lsp --[no]lua .lua, first line matches /^#!.*\blua(jit)?/ --[no]make .mk, .mak, makefile, Makefile, GNUmakefile --[no