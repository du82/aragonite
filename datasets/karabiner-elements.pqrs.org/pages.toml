["https://karabiner-elements.pqrs.org/docs/help/how-to/sticky-modifier-key"]
title = "How to use sticky modifier keys | Karabiner-Elements"
description = """
You can enable the sticky modifier keys from Karabiner-Elements Settings > Simple modifications.
Note The sticky modifier keys acts as general modifier key while you are pressing and holding down the key.
For example, the following operation result is AA instead of Aa.
Press sticky left shift key Press a key Release a key Press a key Release a key Release sticky left shift key If you want to disable this feature, use sticky modifier key (pressing and holding down is disabled)."""
full_description = "Documentation Help How to How to use sticky modifier keys How to use sticky modifier keys You can enable the sticky modifier keys from Karabiner-Elements Settings > Simple modifications. Note The sticky modifier keys acts as general modifier key while you are pressing and holding down the key. For example, the following operation result is AA instead of Aa. Press sticky left shift key Press a key Release a key Press a key Release a key Release sticky left shift key If you want to disable this feature, use sticky modifier key (pressing and holding down is disabled). Sticky modifier key indicator Sticky modifier key indicator will be shown while the sticky modifiers are active. You can hide the indicator from Karabiner-Elements Settings > UI. Sticky modifiers and mouse events The sticky modifiers are not deactivate by mouse buttons if you are not enabled the mouse. There are two solutions: Deactivate sticky modifier by press the sticky modifier key again. Enable your mouse on Devices."
