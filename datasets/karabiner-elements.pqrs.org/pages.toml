["https://karabiner-elements.pqrs.org/docs/help/troubleshooting/preferences-window-shown-at-login"]
title = "Settings window is shown at login | Karabiner-Elements"
description = """
If you manually registered Karabiner-Elements to Open at Login, the settings window will always appear at startup.
Karabiner-Elements will start automatically via launchd even if it is not in Open at Login, so remove it from your Open at Login.
Open System Settings. Open General > Login Items. Remove Karabiner-Elements from Open at Login. Caution Do not disable Karabiner-Elements.app in Allow in the Background. It’s a required setting for Karabiner-Elements to work."""
full_description = "Documentation Help Troubleshooting Settings window is shown at login Settings window is shown at login If you manually registered Karabiner-Elements to Open at Login, the settings window will always appear at startup. Karabiner-Elements will start automatically via launchd even if it is not in Open at Login, so remove it from your Open at Login. Open System Settings. Open General > Login Items. Remove Karabiner-Elements from Open at Login. Caution Do not disable Karabiner-Elements.app in Allow in the Background. It’s a required setting for Karabiner-Elements to work."
