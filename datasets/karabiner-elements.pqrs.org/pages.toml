["https://karabiner-elements.pqrs.org/docs/releasenotes"]
title = "Release notes | Karabiner-Elements"
description = "Karabiner-Elements 15.3.0 📦 Download 📅 Release date Oct 28, 2024 🐛 Bug Fixes Fixed the behavior when setting the function keys to act as regular f1…f12 keys instead of media controls. ✨ New Features Added the following variables for variable_if, variable_unless: system.scroll_direction_is_natural system.use_fkeys_as_standard_function_keys ⚡️ Improvements The key names in the Function Keys settings became clearer when “Use all F1, F2, etc. keys as standard function keys” is enabled. Details of Breaking Changes in v15.1.0"
full_description = 'Documentation Release notes Release notes Karabiner-Elements 15.3.0 📦 Download 📅 Release date Oct 28, 2024 🐛 Bug Fixes Fixed the behavior when setting the function keys to act as regular f1…f12 keys instead of media controls. ✨ New Features Added the following variables for variable_if, variable_unless: system.scroll_direction_is_natural system.use_fkeys_as_standard_function_keys ⚡️ Improvements The key names in the Function Keys settings became clearer when “Use all F1, F2, etc. keys as standard function keys” is enabled. Details of Breaking Changes in v15.1.0 Karabiner-Elements 15.2.0 📦 Download 📅 Release date Oct 7, 2024 🐛 Bug Fixes The method for setting “Use all F1, F2, etc. keys as standard function keys” has been changed. Due to internal processing in macOS, with the new virtual keyboard introduced in version 15.1.0, this setting must be changed through System Settings. Details of Breaking Changes in v15.1.0 Karabiner-Elements 15.1.0 📦 Download 📅 Release date Oct 6, 2024 🔔 Important Notes After the upgrade, you have to set keyboard type and restart macOS. 💥 Breaking changes The implicit conversion feature for fn+arrow keys, fn+return, and fn+delete has been removed. For example, fn+up arrow used to be automatically changed to page up, but it will now be treated as fn+up arrow without modification. To improve the behavior around the fn key, the Vendor ID and Product ID of the virtual keyboard used by Karabiner-Elements have been changed to the same values as those of a real Apple external keyboard. There were two JSON files that output information about connected devices, but this information has now been consolidated into karabiner_grabber_devices.json. karabiner_grabber_device_details.json is no longer used. Please use karabiner_grabber_devices.json from now on. karabiner_grabber_devices.json karabiner_grabber_device_details.json (obsoleted) ✨ New Features Added open_application to complex modifications. A setting has been added to disable mouse cursor movement and scrolling for both the mouse and gamepad. Settings of the gamepad stick have been added; deadzone and delta magnitude detection threshold. Added an option to allow quitting EventViewer with Command+Q and Command+W. ⚡️ Improvements Fixed an issue where disconnected devices would occasionally remain in the device list. Updated the embedded screenshots and help messages for macOS 15 Sequoia. Adjusted the gamepad deadzone default value. Details of Breaking Changes in v15.1.0 Karabiner-Elements 15.0.0 📦 Download 📅 Release date Aug 8, 2024 💥 Breaking changes macOS 11 and macOS 12 are no longer supported. The background service management method has been changed to a new method compatible with macOS 13 and later. Therefore, permission needs to be granted for the background service to run. Please follow the steps below. Open Karabiner-Elements Settings. Follow the instructions to allow Karabiner-Elements Privileged Daemons to run in the System Settings. The method to enable the Multitouch Extension has changed. To enable the Multitouch Extension, go to the Misc tab in the settings and turn on Enable Multitouch Extension. 🔔 Important Notes A unique random ID called karabiner_machine_identifier is now generated during installation. This ID is used for machine-specific settings and may be included in the karabiner.json file. If you are sharing karabiner.json with others, you might be interested in how this ID is generated and whether it is safe to share. Since it is a safe ID to share with others, and there is no need to mask it when you share karabiner.json with others. For more details, please refer to the Privacy page. ✨ New Features Added the ability to disable Complex Modifications rules. Added the ability to duplicate and reorder profiles. Added the ability to restart Karabiner-Elements from the menu. Added the ability to reset device settings that are not currently connected. ⚡️ Improvements Improved “{device} is ignored temporarily until {key_code} is pressed again” message for to make it more understandable. (Thanks to @adamnovak) Added “Enable Karabiner Notification Window” configuration, which allows you to hide the notification window by turning off this setting. (Thanks to @jwodnicki) Support al_consumer_control_configuration key, used as the Music key. (Thanks to @kambala-decapitator) Improved behaviour when using the gamepad stick as a pointing device. Improved to_if_alone behavior to use the modifier flags of the time the key is pressed, when sending events. Added {"type": "unset"} option to set_variable. Integrated karabiner_observer functions into karabiner_grabber, and then karabiner_observer has been removed. The number of background processes has been reduced, resolving performance issues caused by inter-process communication that were occurring in some environments. A custom JSON formatter has been introduced to save JSON in a more compact format. The process for saving the configuration file has been optimized so that settings that have not been changed from their default values are not included in karabiner.json. Internal changes: Improved the interface of libkrbn to minimize the use of unsafe pointers in Swift. Karabiner-Elements 14.13.0 📦 Download 📅 Release date Dec 9, 2023 🔔 Important Notes A reboot is required when upgrading from version 14.12.0 or earlier, to update the virtual keyboard driver. ✨ New Features Palm detection is supported in MultitouchExtension. (Thanks to @quarkw) Use Bluetooth address (Bluetooth MAC address) is used to identify the device when the Bluetooth device does not have Vendor ID and Product ID. (Thanks to @stackia) Add the following settings into Devices tab. Flip mouse X Flip mouse Y Flip mouse vertical wheel Flip mouse horizontal wheel Swap mouse X and Y Swap mouse wheels Gamepad support (DirectInput devices are supported. Xinput is not supported at all) Added “Add your own rule” button into Complex Modifications settings. The json content of Complex Modifications can now be changed via the Edit button. Added “Move item to top” and “Move item to bottom” into the context menu of the Complex Modifications list. Add the following options to karabiner_cli --format-json --eval-js --silent Changes for users who write their own json. The device_address condition has been added into device_if and device_unless. (Thanks to @stackia) Added key_up_value to set_variable. Added mouse_basic manipulator. ⚡️ Improvements Added the ability to filter by keywords when adding Complex Modifications rules. Adjusted the position of the Add rule button in Complex Modifications. (Thanks to @GanZhiXiong) MultitouchExtension has been rewritten in Swift. Karabiner-Elements 14.12.0 📦 Download 📅 Release date Apr 16, 2023 ✨ New Features Added the ability to switch application icons. This can be changed from the UI tab in Settings. Manual Added new application icons. (Thanks to @Zabriskije) Added the following variables in MultitouchExtension. (Thanks to @codeanpeace) multitouch_extension_finger_count_upper_quarter_area multitouch_extension_finger_count_lower_quarter_area multitouch_extension_finger_count_left_quarter_area multitouch_extension_finger_count_right_quarter_area ⚡️ Improvements Prevent moving the mouse from waking up from sleep by ungrab devices during system sleep. (Thanks to @aspacca) Fixed inconsistent and confusing brightness label in Simple Modifications. (Thanks to @revolter) Improved MultitouchExtension to synchronize finger count (half and quarter) variables with finger movement. Moved “Disable the built-in keyboard while this device is connected” settings into Devices tab from Devices > Advanced tab in Settings. 🐛 Bug Fixes Fixed an issue that dynamic keyboard type change (ANSI, ISO and JIS) by changing the country code of the virtual keyboard did not work properly. Karabiner-Elements 14.11.0 📦 Download 📅 Release date Jan 7, 2023 💥 Breaking changes Changed bundle identifier of Karabiner-Elements Settings to org.pqrs.Karabiner-Elements.Settings from org.pqrs.Karabiner-Elements.Preferences. ✨ New Features Added Ask for confirmation when quitting option into Settings > Misc tab. (Thanks to @basti1302) ⚡️ Improvements Improved health checks for inter-process communication to better recover from errors. 🐛 Bug Fixes Fixed an issue that uninstaller does not remove Karabiner-Elements.app and Karabiner-EventViewer.app in macOS Ventura. Fixed an issue that could cause multiple update windows will be shown. Karabiner-Elements 14.10.0 📦 Download 📅 Release date Sep 25, 2022 ⚡️ Improvements Update set_mouse_cursor_position to use the current screen if screen option is not specified. (Thanks to @gnawf) Sparkle Framework has been updated. 🐛 Bug Fixes Fixed an issue that the device_if and device_unless does not work if vendor_id or product_id is zero. (or more precisely, if vendor_id or product_id cannot be retrieved and is set to 0) Karabiner-Elements 14.9.0 📦 Download 📅 Release date Sep 11, 2022 ✨ New Features Supported Remote control buttons. (menu arrows buttons, color buttons) The is_built_in_keyboard has been added into device_if and device_unless. The device_exists_if and device_exists_unless has been added into conditions. 🐛 Bug Fixes Fixed an issue that the ignored device’s modifier keys are not ignored properly. Karabiner-Elements 14.8.0 📦 Download 📅 Release date Aug 11, 2022 ✨ New Features Add Enable unsafe configuration feature into Preferences > Pro tab. 🐛 Bug Fixes Fixed an issue that the built-in keyboard is not be treated as the built-in keyboard if the keyboard is connected via SPI (Serial Peripheral Interface), such as M2 MacBook Air. Karabiner-Elements 14.6.0 📦 Download 📅 Release date Jul 31, 2022 ✨ New Features Treat as a built-in keyboard setting has been added into Devices configuration. It works with “Disable the built-in keyboard” feature. 🐛 Bug Fixes Fixed an issue that “Disable the built-in keyboard” feature does not work if the built-in keyboard is not included in the event modification target devices. Karabiner-Elements 14.5.0 📦 Download 📅 Release date Jul 17, 2022 💥 Breaking changes The following modifier flags and manipulators are now canceled even for events from devices not grabbed by Karabiner-Elements, e.g. mouse clicks. sticky modifiers to_if_alone to_if_held_down to_delayed_action ⚡️ Improvements Improved behavior the sticky modifiers when used together with the built-in trackpad. (Thanks to @quarkw) Preferences Window is rewritten in SwiftUI. set_variable now supports bool and string value. Sparkle Framework has been updated. Karabiner-Elements 14.4.0 📦 Download 📅 Release date Mar 1, 2022 🐛 Bug Fixes Fixed an issue that NotificationWindow causes high CPU usage in some environments. Karabiner-Elements 14.3.0 📦 Download 📅 Release date Nov 20, 2021 ⚡️ Improvements Added System Extensions tab to EventViewer. Added a workaround for macOS’s ioreg command issue that consumes high CPU usage on macOS Monterey. Karabiner-Elements 14.2.0 📦 Download 📅 Release date Nov 3, 2021 💥 Breaking changes macOS 10.15 support has been dropped. ✨ New Features Supported Touch ID on Magic Keyboard. Supported application launcher keys (Mail, Browser, Calculator, etc.) which are belong to HID Consumer Usage Page and Application Launch Buttons Usage. Add new features for writing your own settings: Added software_function.iokit_power_management_sleep_system. 🐛 Bug Fixes Fixed an issue that an alert window appears in an incorrect position on macOS 12 Monterey. ⚡️ Improvements Update application icons. (Thanks to Kouji TAMURA) EventViewer is rewritten in SwiftUI. Karabiner-Elements 13.7.0 📦 Download 📅 Release date Sep 6, 2021 🐛 Bug Fixes Fix an issue that shell_command does not set environment variables (HOME, USER, etc.). Karabiner-Elements 13.6.0 📦 Download 📅 Release date Sep 3, 2021 ✨ New Features Add new features for writing your own settings: Added software_function.cg_event_double_click. Added software_function.set_mouse_cursor_position. Added set_notification_message. 🐛 Bug Fixes Fixed an issue that karabiner.json parse error message is not shown in Preferences > Log if the error message contains corrupted characters. ⚡️ Improvements Changed to log the output of shell_command into console_user_server.log. The notification window transparency will be increased when the mouse cursor is hovered. Karabiner-Elements 13.5.0 📦 Download 📅 Release date Jun 20, 2021 ⚡️ Improvements Improved temporary directory handling to reduce the frequency of mds process accessing it. Improved mouse_key.speed_multiplier handling when it is used with to.modifiers, the modifier is retained while speed_multiplier is active. The caps lock LED manipulation has been enabled by default. Note: This change applies to newly connected keyboards. Several Objective-C code around GUI has been rewritten in Swift + SwiftUI. Karabiner-Elements 13.4.0 📦 Download 📅 Release date Apr 4, 2021 🐛 Bug Fixes Fixed an issue that Karabiner-Elements stops working with virtual_hid_keyboard is not ready. Please wait for a while. error message when you kill karabiner_console_user_server process manually. ⚡️ Improvements Changed to terminate virtual HID devices immediately after quit Karabiner-Elements. 🔔 Notes for Mac computers with Apple Silicon (Apple M1) users macOS Big Sur 11.2 or earlier has an issue within memory management and HID device handling that causes kernel panics on Mac computers with Apple Silicon. The virtual device that is used internally by Karabiner-Elements triggers this issue, and a kernel panic might be caused at macOS shutdown. We confirmed that this issue has been fixed in macOS Big Sur 11.3 Beta. Please use macOS Big Sur 11.3 Beta or later versions if you are facing the kernel panic issue. Karabiner-Elements 13.3.0 📦 Download 📅 Release date Jan 29, 2021 🐛 Bug Fixes Fixed an issue that installer requires Rosetta 2 on Apple Silicon Macs. 💥 Breaking Changes Changed the default function of f4 key to spotlight, f5 key to dictation, f6 key to f6. Note: This change will be applied when you create a new profile. Changed to Karabiner-Elements does not modify f1-f12 keys on touch bar. The caps lock delay of Karabiner Virtual HID Keyboard has been removed. The state of caps lock will be changed immediately after you press the caps lock key. ✨ New Features Supported sticky modifier keys Added apple_vendor_keyboard_key_code and apple_vendor_top_case_key_code to event definitions. apple_vendor_keyboard_key_code apple_vendor_top_case_key_code ⚡️ Improvements Updated in-app screenshots to Big Sur. Added the close button to notification window. Karabiner-Elements 13.1.0 📦 Download 📅 Release date Oct 30, 2020 🔔 Important Notes Restarting macOS is required after upgrading from v13.0.0. The following alert will be shown after upgrade. Please follow the instructions. 🐛 Bug Fixes Fixed an issue that Karabiner-DriverKit-VirtualHIDDevice might crash when caps lock key is pressed in some environments. Karabiner-Elements 13.0.0 📦 Download 📅 Release date Oct 4, 2020 💥'
