["https://karabiner-elements.pqrs.org/docs/json/complex-modifications-manipulator-definition/from"]
title = "from event definition | Karabiner-Elements"
description = '''
{ "from": { "key_code": "The name of key_code", "consumer_key_code": "The name of consumer_key_code", "pointing_button": "The name of pointing_button", "any": "key_code or consumer_key_code or pointing_button", "modifiers": { "mandatory": [ modifier, modifier, ... ], "optional": [ modifier, modifier, ... ] }, "simultaneous": [ { "key_code, consumer_key_code, pointing_button or any" }, { "key_code, consumer_key_code, pointing_button or any" }, ... ], "simultaneous_options": { "detect_key_down_uninterruptedly": false, "key_down_order": "A restriction of input events order", "key_up_order": "A restriction of input events order", "key_up_when": "When key_up events are posted", "to_after_key_up": [ to event definition, to event definition, ... ] } } } Name Required Description key_code Optional Key code which you want to change consumer_key_code Optional Consumer key code (media key code) which you want to change pointing_button Optional Pointing button name which you want to change any Optional "any": "key_code", "any": "consumer_key_code" or "any": "pointing_button" modifiers Optional Specify mandatory and optional modifiers (e.g., “change control-h to delete”) simultaneous Optional Specify multiple events which are pressed simultaneously simultaneous_options Optional Options for simultaneous Note key_code, consumer_key_code, pointing_button and any are exclusive.
You have to specify one of them. Caution Be careful using "pointing_button": "button1" and "any": "pointing_button".
You may lose the left click button and system will be unusable. Detail from.any from.modifiers from.simultaneous from.simultaneous_options Investigate key names You can find key_code, consumer_key_code and pointing_button names by EventViewer. You can also confirm names in list. (See "data" in the list.) Tip You can also specify key_code, consumer_key_code, pointing_button with raw number as follows.'''
full_description = 'Documentation Karabiner Configuration Reference Manual complex_modifications manipulator definition from event definition from event definition { "from": { "key_code": "The name of key_code", "consumer_key_code": "The name of consumer_key_code", "pointing_button": "The name of pointing_button", "any": "key_code or consumer_key_code or pointing_button", "modifiers": { "mandatory": [ modifier, modifier, ... ], "optional": [ modifier, modifier, ... ] }, "simultaneous": [ { "key_code, consumer_key_code, pointing_button or any" }, { "key_code, consumer_key_code, pointing_button or any" }, ... ], "simultaneous_options": { "detect_key_down_uninterruptedly": false, "key_down_order": "A restriction of input events order", "key_up_order": "A restriction of input events order", "key_up_when": "When key_up events are posted", "to_after_key_up": [ to event definition, to event definition, ... ] } } } Name Required Description key_code Optional Key code which you want to change consumer_key_code Optional Consumer key code (media key code) which you want to change pointing_button Optional Pointing button name which you want to change any Optional "any": "key_code", "any": "consumer_key_code" or "any": "pointing_button" modifiers Optional Specify mandatory and optional modifiers (e.g., “change control-h to delete”) simultaneous Optional Specify multiple events which are pressed simultaneously simultaneous_options Optional Options for simultaneous Note key_code, consumer_key_code, pointing_button and any are exclusive. You have to specify one of them. Caution Be careful using "pointing_button": "button1" and "any": "pointing_button". You may lose the left click button and system will be unusable. Detail from.any from.modifiers from.simultaneous from.simultaneous_options Investigate key names You can find key_code, consumer_key_code and pointing_button names by EventViewer. You can also confirm names in list. (See "data" in the list.) Tip You can also specify key_code, consumer_key_code, pointing_button with raw number as follows. { "from": { "key_code": 41 } } Do not add double quotes when you use the raw number. Table of Contents from.any from.modifiers from.simultaneous from.simultaneous_options'
