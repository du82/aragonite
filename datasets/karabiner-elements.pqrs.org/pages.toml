["https://karabiner-elements.pqrs.org/docs/json/complex-modifications-manipulator-definition/conditions/keyboard-type"]
title = "keyboard_type_if, keyboard_type_unless | Karabiner-Elements"
description = '''
Change an event if/unless the event is from specified type keyboard.
The keyboard type mentioned here refers to the type of the virtual keyboard.
Example Change control-[ key to escape, including JIS layout support.
Note: the [ key is close_bracket in JIS layout
💡 How to use this example { "description": "Change control-[ to escape", "manipulators": [ { "type": "basic", "from": { "key_code": "open_bracket", "modifiers": { "mandatory": ["control"], "optional": ["caps_lock"] } }, "to": [{ "key_code": "escape" }], "conditions": [ { "keyboard_types": ["ansi", "iso"], "type": "keyboard_type_if" } ] }, { "type": "basic", "from": { "key_code": "close_bracket", "modifiers": { "mandatory": ["control"], "optional": ["caps_lock"] } }, "to": [{ "key_code": "escape" }], "conditions": [ { "keyboard_types": ["jis"], "type": "keyboard_type_if" } ] } ] } Specification { "type": "keyboard_type_if", "keyboard_types": ["ansi", "iso"] } Name Required Description type Required "keyboard_type_if" or "keyboard_type_unless" keyboard_types Required An array of "ansi", "iso" or "jis" description Optional A human-readable comment Multiple keyboard types keyboard_types are joined by “or”.'''
full_description = 'Documentation Karabiner Configuration Reference Manual complex_modifications manipulator definition Conditions keyboard_type_if, keyboard_type_unless keyboard_type_if, keyboard_type_unless Change an event if/unless the event is from specified type keyboard. The keyboard type mentioned here refers to the type of the virtual keyboard. Example Change control-[ key to escape, including JIS layout support. Note: the [ key is close_bracket in JIS layout 💡 How to use this example { "description": "Change control-[ to escape", "manipulators": [ { "type": "basic", "from": { "key_code": "open_bracket", "modifiers": { "mandatory": ["control"], "optional": ["caps_lock"] } }, "to": [{ "key_code": "escape" }], "conditions": [ { "keyboard_types": ["ansi", "iso"], "type": "keyboard_type_if" } ] }, { "type": "basic", "from": { "key_code": "close_bracket", "modifiers": { "mandatory": ["control"], "optional": ["caps_lock"] } }, "to": [{ "key_code": "escape" }], "conditions": [ { "keyboard_types": ["jis"], "type": "keyboard_type_if" } ] } ] } Specification { "type": "keyboard_type_if", "keyboard_types": ["ansi", "iso"] } Name Required Description type Required "keyboard_type_if" or "keyboard_type_unless" keyboard_types Required An array of "ansi", "iso" or "jis" description Optional A human-readable comment Multiple keyboard types keyboard_types are joined by “or”. The following condition is matched if the keyboard type is “ansi” or “iso”. { "type": "keyboard_type_if", "keyboard_types": ["ansi", "iso"] }'
