title = "Working with AHO, Oslo – Kardashev Street"
description = "I'm about half-way through working (remotely) with a great cohort of interaction design students from AHO in Oslo - on a Kardashev Street brief - which I delivered using NotebookLM as an experiment. They've been doing some excellent field studies on streets and places around Oslo, understanding residential communities and their energy usage. This week's…"
full_description = "I’m about half-way through working (remotely) with a great cohort of interaction design students from AHO in Oslo – on a Kardashev Street brief – which I delivered using NotebookLM as an experiment. They’ve been doing some excellent field studies on streets and places around Oslo, understanding residential communities and their energy usage. This week’s… I’m about half-way through working (remotely) with a great cohort of interaction design students from AHO in Oslo – on a Kardashev Street brief – which I delivered using NotebookLM as an experiment. They’ve been doing some excellent field studies on streets and places around Oslo, understanding residential communities and their energy usage. This week’s progress review saw them starting to explore potential energy futures for the places they’ve studied. The quality of work is wonderful so far, and especially looking to the social and service-design aspects as much as the technological. I’ll write more at the end of the project. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3eac0b649e', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading…"
