full_description = "Introducing Kardashev Street: examining through design the challenges of maximising energy generation, distribution and usage at street level, for as many people as possible, everyday. This idea started a while ago, in a pub near Goldsmiths, where I was talking with tutors on the design course there. I was due to give their students a brief around solar, and was talking animatedly about the Kardashev scale of civilisational energy usage. We discussed bring that down to a scale that the students could engage with and “Kardashev Street” was born. This site is a work in progress stemming from that idea – about bringing the promise of near-endless energy from our sun down to street level, and examining through design the challenges of maximising energy generation, distribution and usage at street level, for as many people as possible, everyday. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3eaba01616', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading…"
