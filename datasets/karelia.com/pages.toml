title = "The Hit List for iPad: Keep everything on track, wherever you are"
description = "The Hit List for iPad helps you plan & forget, then act on time. Pair it with The Hit List for Mac and use the sync service to keep everything moving!"
full_description = "The Hit List for Mac iPhone iPad Apple Watch What’s New The Hit List for iPad Get more done with the time you have. The Hit List helps you manage the daily chaos of modern life right from your iPad. It’s easy to use — as easy as making lists. And it’s powerful enough to let you plan, move on, and then act at the right time. The perfect balance of power and ease of use. Updated for iOS 9. For iPad, iPhone, and Apple Watch. See What’s New. Also for Mac iPhone Watch The ‘Today’ view shows what matters to you for today. Use the special lists Inbox, Today & Upcoming to change focus. Create as many other lists (and folders of lists) as you like. Keep short-term or long-term lists, or keep lists by topic. Prioritize and re-prioritize as you wish. New tasks drop into your Inbox by default, ready for processing later. Assign a start or due date, and attach detailed notes. More than one step? Add subtasks. Subtasks act just like regular tasks — and when they are all checked, the containing task is done. Repeat! Things that need attention daily, weekly or at other intervals can be set up in advance too. Tags add additional context, and let you view similar tasks together. Schedule — then forget — your future tasks. You can always take a peek at the things you have queued up to start soon. The Hit List is packed with features to make managing your time quick and easy, from any Mac, iPhone, iPad, or Apple Watch. Lists Plan and outline in your lists Today List Filter out distractions and focus on what matters today Upcoming List Get an overview of stuff coming up Tags Group similar tasks by context or other tags Cards Focus on one thing at a time. Take notes. Start and Due Dates Schedule tasks for when they become relevant Subtasks Break down big tasks into manageable chunks Repeating Tasks Schedule bills, meetings, and more Get the big picture on your day using The Hit List. It’s easy to learn — as easy as making lists. And, it’s powerful enough to let you plan, let it go, then act at the right time. You can use it to manage a to-do list just like you would on a piece of paper. Or you can do much more. Pick the style that’s best for you! The Hit List is simple, yet powerful and flexible enough to be used with systems such as Getting Things Done (GTD) by David Allen — or your very own unique approach. The Hit List Sync Service Included subscription handles Macs, iPhones, iPads & Apple Watches. Integrated A sync service subscription is included with The Hit List for Mac and The Hit List for iPhone and iPad, and it handles Apple Watches too. Blazing Fast Syncing is FAST, and polite. It won't interrupt or distract you. Secure Data are transmitted to and from the sync servers using HTTPS. It is protected from prying eyes. Easy Sign up from preferences, and go. After you log in on a device or Mac, your data will come with you. The Hit List: for Mac Make short work of managing life’s chaos Stay on top of your tasks at your desk and get a bigger picture. Using our included sync service, your tasks are with you no matter where you are! Explore The Hit List for Mac Download a Demo Buy Now Download a Demo Buy Now The Hit List reviews One of the problems with some other programs is that there is often way too much in your visual field which slows you down. […] The Hit List seems to have gotten around this problem simply through good design. The payoff though is significant and a lot of time is saved. …If you like lists but aren’t thrilled with your current solution … give The Hit List a try. If you’re a list junkie (like me), you’re gonna love it. …If you are looking for a fast task manager that has support for nested folders and subtasks, I recommend giving The Hit List a try. The Hit List is GTD– David Allen’s popular Getting Things Done method for productivity– aware but goes well beyond basic list keeping and focus. It's for you if you have a lot to do, or your work is just fiddly enough that you need a powerful app to help you keep on top of it. The Hit List for iPhone & iPad includes The Hit List for Apple Watch."
