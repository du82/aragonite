title = "Karelia - makers of Sandvox, The Hit List and more for OS X & iOS"
description = "Karelia works to create simple, elegant, and intuitive software that empowers and delights OS X and iOS users worldwide."
full_description = "Contact us Newsletter archive Media & Press Open source About Karelia Karelia Software is recognized for groundbreaking innovation and design. From its very first product, Watson (MacWorld “Eddy” and Apple Design Award for “Most Innovative Application”), Karelia Software products continue to bring home awards and distinctions. Karelia Software operates as a distributed team of developers with a passionate focus on a single goal: to create simple, elegant, and intuitive software that empowers and delights OS X and iOS users worldwide. Our Software Karelia’s flagship product, Sandvox® (Apple Design Award runner-up for “Best Mac OS X User Experience”), is an application for creating websites, developed after hearing—all too often—that building a great website from scratch was just too difficult for most people. The Hit List helps people manage the chaos of modern life with less stress and more fun. These and other Karelia apps and Open Source Projects all reflect the focused approach distinctive in all Karelia software. Awards & Recognition Karelia has been honored with two prestigious Apple Design Awards, and more! (Sandvox 1.2) (Sandvox 2.7.3) (Watson 1.5) Sandvox Get the latest version Demo Buy Now Meet Karelia’s core team Andy Kim Developer / UI & UX Designer [ More ] Andy Kim Developer / UI & UX Designer Andy Kim is a programmer-designer hybrid who is passionate about humans and interaction. While he disguises himself as a normal person, inside his head he’s always thinking of ways to challenge the norm and find new ways to make people’s lives more pleasurable and efficient through software. Prior to joining Karelia, Andy founded Potion Factory where he designed and developed software such as The Hit List. Fascinated by how different cultures solve different problems, Andy enjoys traveling as a hobby. Whether on foot, bicycle, motorcycle, or boat, he likes to absorb new surroundings at a slow pace. His superpower is being able to eat any local cuisine, even ones made from bugs, rotten tofu, or raw meat. Andy holds a BA in Computer Science from UC Berkeley. twitter Mike Abdullah Developer / Englishman [ More ] Mike Abdullah Developer / Englishman Mike Abdullah “found” Karelia while studying for a Master's degree in Integrated Engineering. Hired on originally to write documentation for Sandvox 1.2, Mike joined Karelia full-time shortly after graduation. Completely unbeknownst to Dan or Terrence at the time, Mike was and is a spectacular Cocoa developer. Quickly moving up through the ranks, Mike is now technical lead for Sandvox and manages Karelia’s open source repositories on GitHub. When not coding, Mike can often be found rock climbing or karting. He is also an accomplished musician, playing both trumpet and percussion for notable garage bands and orchestras around London. Mike holds a Master's in Integrated Engineering with honors from the University of Reading. twitter blog Dive right in We invite you to get to know Karelia by checking out our work and our blog. The forums we host for conversation on our software are active, and well-monitored (thanks mostly to our crackerjack support team). If you’re looking for info, the forums are a very good place to start. We also publish an email newsletter, which has helpful articles and information. We invite you to keep up with us on Twitter and Facebook as well. At the beginning, and at the end of the day—our customers are the reasons we are able to do the work we do, and we’re happy to be of service. If you need something, or just want to share an idea—please get in touch. Karelia Newsletter Subscribe for all the news from Karelia on releases, special promotions and more. Please leave this field empty: Please leave this field empty: Infrequent mailings. We protect your privacy."
