["https://karelia.com/blog/the-hit-list-2-5-ipad.html"]
title = "The Hit List, Native on iPad | Karelia Software"
full_description = '''The Hit List is going big. Not small — like our last release, squeezing it down for Apple Watch — but BIG to take full advantage of iPad. Please welcome iPad to the family of devices supported by The Hit List on iOS, all as a single universal app purchase. <img src="../_Media/today_med.png" alt="today" width="600" height="424" /> Our goal with the iPad app was to blend the simplicity of iOS with the extra power of The Hit List for Mac, and we think you'll love the result.Hold your iPad in portrait orientation to focus on your list with no distractions. Towards the right-hand edge of the screen, you can conveniently see and edit the start or due dates of your tasks, making scheduling a breeze. <img src="../_Media/datepicker_med.png" alt="datepicker" width="353" height="500" /> Turn your iPad to landscape and the left of the screen opens up to reveal your lists, folders, and tags, and quickly navigate between them. And of course, tap on a task to open up its details card to use The Hit List's full suite of task editing features.As an iPad user you might also find an extra little feature comes in handy: it's now super-easy to share lists by email, to send a copy to a friend for example.MultitaskingiOS 9 introduces multitasking features for iPad, turning The Hit List into an even bigger companion in your daily usage. <img src="../_Media/multitask_med.png" alt="multitask" width="600" height="424" /> For example, say you're working on something when you remember an item that should be on your shopping list. Use Slide Over to quickly pull up The Hit List, add the item to your list, then return to your work with a single tap.And with Split View, you can run another app side-by-side with The Hit List. Perhaps you're doing some research in Safari for an upcoming trip; use Split View to keep The Hit List on screen and create a list while you browse.iPhone 6s <img src="../_Media/quick-add_med.png" alt="quick-add" width="399" height="278" /> Are you the proud owner of an iPhone 6s? The Hit List now includes Quick Actions with 3D Touch. On your phone's Home screen, press The Hit List's icon and you can immediately create a new task, or go straight to your Today list.Other ImprovementsA popular customer request has been for an easy way to see when there are notes attached to a task. We listened and added exactly that, with a handy little badge to indicate their presence. <img src="../_Media/notes-zoom_med.png" alt="notes-zoom" width="450" height="328" /> Lastly, we've given tags a bit of an overhaul, with a cleaner, streamlined appearance, similar to that seen in The Hit List's Today Widget.The Hit List for iPhone & iPad is available immediately from the App Store, and is a Universal app, running on your iPhone, iPad and Apple Watch. Available for a special introductory price of just US$14.99.'''
author = "Karelia Software"
year_published = 2025
clearnet = "https://karelia.com/blog/the-hit-list-2-5-ipad.html"
