title = "Stars: A fun, fast way to rate songs in iTunes libraries"
description = "Hear and find what you love easier, and faster when you rate songs with Stars. Song ratings help build great playlists and sort music tracks."
full_description = '''Stars Download on the Mac App Store Stars Quickly rate your iTunes songs Stars offers a distraction-free way to quickly rate songs with a clean design approach. Thoroughly rebuilt for OS X Yosemite, Stars includes a handy, minimalist iTunes controller that shows the album cover of the song that is currently playing. Check it out (in action) in the movie clip! The distraction-free way to rate your iTunes library function fallback(av) { while (av.firstChild) { if (av.firstChild.nodeName == 'SOURCE') { av.removeChild(av.firstChild); } else { av.parentNode.insertBefore(av.firstChild, av); } } av.parentNode.removeChild(av); } This browser cannot play the embedded video file. var video = document.getElementById('video'); if (video.canPlayType && video.canPlayType('video/x-m4v')) { // canPlayType is overoptimistic, so we have browser sniff. var ua = navigator.userAgent; var tridentMatch = ua.match(/Trident\/([0-9.]*)/); var tridentVersion = tridentMatch ? parseFloat(tridentMatch[1]) : 0; if (!(ua.indexOf('WebKit/') >= 0 || !ua.match(/MSIE [1-8]\./) || tridentVersion >= 7)){ // Only WebKit browsers and IE >9 can currently play this natively fallback(video); } } else { fallback(video); } Half-star ratings - Stars now behaves more like iTunes with respect to half-star ratings. Click between stars to award a half-star rating. Stars can alert you with a notification if your song needs to be rated. Next and previous tracks. Option-click to forward or rewind by 10 seconds (hold the button to fast-forward or rewind). Or drag the scrubber to any point in your song. A double-click on the album cover reveals the song in iTunes.'''
