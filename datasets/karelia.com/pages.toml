title = "Karelia Software Brings The Hit List to iPad | Karelia Software"
full_description = '''New App Design Bolsters Usability on iPad, Supports Slide Over and Split View; Now Universal for iPad, iPhone and Apple WatchAlameda, Calif. - December 10, 2015 - Karelia Software today released The Hit List version 2.5 on iOS, bringing a native version of The Hit List app to the iPad with an expanded interface and user interaction designed to take advantage of the iPad form factor.The Hit List v2.5 introduces a completely reimagined new design for the iPad, includes an updated app for iPhone with 3D Touch Quick Action support, and includes The Hit List app on Apple Watch."The Hit List version 2.5 is big news for iPad users," said Dan Wood, president of Karelia Software. "For many, the iPad expands the way people get work done on a mobile device, and The Hit List for iPad expands how people can manage their tasks. Created for the iPad, the new app combines some of the powerful features from The Hit List for Mac with a sleek design inspired by The Hit List for iPhone."The Hit List on an iPad mobile device makes it easy to focus on one list in portrait orientation, or manage sets of lists in landscape. The Hit List now runs native on iPad mobile devices and introduces multitasking using the Slide Over and Split View features in iOS 9, the ability to sharing lists by email, and faster access to start and due dates. The Hit List v2.5 runs on both iPad and iPad Pro.The Hit List v2.5 on iPhone mobile devices introduces 3D Touch Quick Actions for iPhone 6s. For all iPhone models, the v2.5 update introduces a badge to indicate a note is attached to a task, plus a cleaner, fresher appearance for tags.The Hit List v2.5 includes other interface enhancements and bug fixes, and requires iOS 9.1 or later.Simply Powerful Tasks and To-DosDesigned for today’s interrupt-driven and busy life, The Hit List handles personal task management with a perfect balance of app power and ease of use. Using The Hit List is as easy as making lists, and powerful enough to let you plan, move on, and then act at the right time. The Hit List includes access to its own fast and reliable sync service for individuals to keep tasks and lists in sync between desktop and mobile devices.For additional information on The Hit List, please visit: <http://www.karelia.com/products/the-hit-list/ipad.html>Pricing and AvailabilityThe Hit List v2.5 is available today for iPad, iPhone and Apple Watch mobile devices at an introductory price of US$14.99 (regularly US$19.99) from the App Store.The Hit List v2.5 includes The Hit List app for Apple Watch, the Today widget for Notification Center, The Hit List app for iPhone and The Hit List app for iPad. All purchases of The Hit List and The Hit List for Mac include unlimited access to The Hit List Sync Service.The Hit List v2.5 is available as an automatic update at no additional charge for all customers of The Hit List for iPhone.About Karelia Software LLCKarelia Software, winner of Macworld Eddy and Apple Design Awards, delivers well designed software that empowers and delights OS X and iOS users worldwide. Karelia's flagship application, Sandvox, radically simplifies how anyone can build the website of their dreams. Karelia's The Hit List helps people manage the chaos of modern life with less stress and more fun. Learn more about these and other Karelia apps by visiting <http://www.karelia.com/>.Copyright (c) 2015, Karelia Software LLC. All Rights Reserved. Sandvox is a registered trademark of Karelia Software. Mac, Mac OS, OS X and App Store are trademarks of Apple Inc., registered in the U.S. and other countries. All other company and product names are trademarks of their respective owners.###'''
