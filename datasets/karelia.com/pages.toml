title = "The Karelia Software Blog"
description = '''
Today we're releasing version 2.7 of The Hit List for iOS. It brings some big changes, which we're excited to tell you about.Free for AllYes, that's right, our iOS app is now free! Here at Karelia, we care deeply about lists and what they can mean for personal productivity. We believe that on phones — the devices we carry and use all day — it's critical to have high quality lists and scheduling functionality available to everyone.Of course, we wish to stay in business! We continue to offer the premium power and functionality of The Hit List for Mac for just $49, and are exploring bringing some of those premium features to iOS.Apple WatchAs a small independent company, there is a limit to the time and resources we have available. In light of that, we have made the difficult decision to remove support for Apple Watch for now.The App ItselfAnd now we come to the really interesting stuff: what improvements have been made to the app in this release? Well, almost too much to cover here! We've been hard at work on many smaller bits of polish for this release to add power and streamline your workflow. We'll be writing more in greater depth later to better demonstrate the benefits you can see, but for now, here are some highlights:SMARTER TASK LISTS
																
																
																	
																		
																			
																				<img src="../_Media/screen-shot-2018-03-04-at_med.png" alt="Screen Shot 2018-03-04 at 16.09.48" width="250" height="444" />
																			
																			
																		
																	
																We've made several improvements to how tasks in a list can be sorted and arranged. You can see this on the Today screen, where tasks are now automatically ordered by priority, giving you a better view of the day. On the Upcoming screen, tasks for the week are broken down by individual days. We've also introduced a new option to sort lists by the date that each task was created.“PUSH" SYNCIf you work with multiple devices, you'll really appreciate this. Whenever you make a change on one device, it is immediately "pushed" to all your other iOS devices. Your lists will never be out-of-date on your phone again.AND MORE!Plenty more polish has gone into this release, and we can't wait for you to get your hands on it. Grab it from the App Store today, and don't forget that The Hit List on iOS is now free, so tell your friends and family!'''
full_description = '''Get news, tips and more from the team on products, app developments and related news from the Karelia Software blog. Please grab the RSS feed if you use a newsreader. Our newsletter is another great source for updates on our work. Please subscribe! The Hit List 2.7 for iOS Released Today we're releasing version 2.7 of The Hit List for iOS. It brings some big changes, which we're excited to tell you about.Free for AllYes, that's right, our iOS app is now free! Here at Karelia, we care deeply about lists and what they can mean for personal productivity. We believe that on phones — the devices we carry and use all day — it's critical to have high quality lists and scheduling functionality available to everyone.Of course, we wish to stay in business! We continue to offer the premium power and functionality of The Hit List for Mac for just $49, and are exploring bringing some of those premium features to iOS.Apple WatchAs a small independent company, there is a limit to the time and resources we have available. In light of that, we have made the difficult decision to remove support for Apple Watch for now.The App ItselfAnd now we come to the really interesting stuff: what improvements have been made to the app in this release? Well, almost too much to cover here! We've been hard at work on many smaller bits of polish for this release to add power and streamline your workflow. We'll be writing more in greater depth later to better demonstrate the benefits you can see, but for now, here are some highlights:SMARTER TASK LISTS <img src="../_Media/screen-shot-2018-03-04-at_med.png" alt="Screen Shot 2018-03-04 at 16.09.48" width="250" height="444" /> We've made several improvements to how tasks in a list can be sorted and arranged. You can see this on the Today screen, where tasks are now automatically ordered by priority, giving you a better view of the day. On the Upcoming screen, tasks for the week are broken down by individual days. We've also introduced a new option to sort lists by the date that each task was created.“PUSH" SYNCIf you work with multiple devices, you'll really appreciate this. Whenever you make a change on one device, it is immediately "pushed" to all your other iOS devices. Your lists will never be out-of-date on your phone again.AND MORE!Plenty more polish has gone into this release, and we can't wait for you to get your hands on it. Grab it from the App Store today, and don't forget that The Hit List on iOS is now free, so tell your friends and family! Jul 12, 2018 Karelia’s Mac Apps Ready for High Sierra It's here, and we're ready too! Sandvox, The Hit List, and Stars — our Mac apps are all good to go with High Sierra. On Monday Apple released the latest version of macOS: High Sierra, and we've worked to ensure our apps are ready for it:The Hit List has been updated to version 1.1.30 to resolve compatiblity issues and fix a couple of bugs which had crept in.Sandvox version 2.10.10 was already High Sierra compatible.Stars has also been updated to version 5.1 for improved compatibility with High Sierra, iTunes 12.7, and Apple Music. Get it from the Mac App Store.Your apps can be updated with the built-in “Sparkle” mechanism if you got them directly from us, or through the Mac App Store.That’s it for now. Happy upgrading! Sep 27, 2017 The Hit List 2.6 for iOS Released Now that iOS 11 is released, we’re happy to announce that The Hit List is ready for it. Yesterday we've released version 2.6, with the following changes:Tweaked home screen layout for easier access to creating lists and searchingSpotlight search for tasksiOS 11 compatibility improvementsFolders can be deleted without having to first delete all their contentsFixed issue where trying to create a new tag on iPad would create a list insteadThe main thing you'll notice is search is now a little more prominently featured. There are buttons conveniently in reach at the bottom of the screen for starting a search, and for creating new lists/folders/tags.But most importantly, The Hit List is now integrated with Spotlight. What does this mean? On any home screen of your phone, you can swipe downwards to bring up a search field. Type in there and iOS searches the web, your contacts etc., and now your tasks!Say you remember making a note of something related to your electricity bill, but not sure which app that was in? Spotlight will search them all and ta-da, yep it was The Hit List you used for that. Tap it and the app will launch so you can see/edit the full details and check it off.And of course, as hinted at the top, this version of The Hit List is ready to go for iOS 11. We've squashed some compatibility bugs and now it's in tip-top shape. iOS 11 also introduces some exciting features to the platform and we look forward to being able to adopt some of them soon and bring you even greater power to your workflow.So if you haven't already, head over to the App Store and grab yourself the latest update. As always, we appreciate any reviews you post there. Sep 20, 2017 Karelia’s Mac Apps Ready for Sierra Sandvox. The Hit List. Tangerine!. Stars. If you are ready for Sierra, these apps are ready for you! <img src="../_Media/os1012-homescreensiri_pr_med.png" alt="OS1012-HomescreenSiri PR-PRINT" width="262" height="152" /> If you are using Sierra, you should have no problem using the latest version of our Mac apps:Sandvox has just been updated to version 2.10.8. This solves some Sierra-specific issues related to publishing and document language choice, along with some other issues. If you got Sandvox from the Mac App Store, be sure to use the store’s update mechanism to install this new version.The Hit List is at version 1.1.26 and works just great.Tangerine! is still helping you build custom playlists at version 1.4.3a.Stars continues to help you rate your iTunes songs at version 5.0.2. Get it from the Mac App Store.Your apps can be updated with the built-in “Sparkle” mechanism if you got them directly from us, or through the Mac App Store.Thanks for using our apps! Sep 27, 2016 The Hit List, ready for iOS 10 Today Apple is releasing iOS 10. It will probably be available by the time you read this!We’ve recently updated The Hit List for iPhone & iPad to version 2.5.6, to be ready for iOS 10. Grab it from the app store while it’s hot! <img src="../_Media/simulator-screen-shot-sep_med.png" alt="Simulator Screen Shot Sep 13, 2016, 8.22.57 PM" width="375" height="667" /> Sep 14, 2016'''
