The rooms include 24-hour room service, complementary bottled water, coffee and tea maker, mini bar, hair dryer, robe, work desk, iron, Wi-Fi, flat screen television, and premium channels. Movies are available for rent from the front desk.
Guests can dine at the Palmar Market, Sea and Stones Restaurant, and Arena Sports Bar.
There is 24-hour fitness center with free weights, cardio equipment, sauna, and tennis courts. The spa at the hotel offers guests many ways to relax and unwind, including massages and hair and nail treatments.
Guests can explore the local attractions such as Tulum Ruins, Chichen Itza, Xcaret Park, and Xel-Ha Park. They can see how much history is here and check out Aztec areas as well.
For those who love being active, there are many activities nearby that they can take part in such as bowling, hiking, sailing, water skiing, kayaking, and snorkeling.
When visiting Mexico, it is important to find a hotel that makes guests feel safe and welcomed. The Westin Resort & Spa, Cancun is just the place. Reservations are easy to make online and if guests have questions about room sizes or amenities, the staff here is bi-lingual, friendly, and knowledgeable of the hotel and of the area. They can guide guests in the right direction before they get here."""
