title = "16 Best Hotels in Dubrovnik. Hotels from $37/night - KAYAK"
description = "Looking for Dubrovnik Hotel? 2-star hotels from $37, 3 stars from $49 and 4 stars+ from $68. Stay at Sobe Novi Grad from $37/night, Kala Luxury Rooms By Duhomes from $111/night, Guest House Jeljenic from $46/night and more. Compare prices of 5,517 hotels in Dubrovnik on KAYAK now."
full_description = "Since the 1950s and 1960s, when Hollywood stars came to the Adriatic Riviera, the walled city of Dubrovnik has been a special spot in the sun for travelers. Of course, its history goes back centuries, to Roman times and the Venetian Empire. Plus, its traffic-free Old Town is a UNESCO World Heritage Site: time-polished limestone walkways lead to baroque churches, hidden alleys and a flurry of restaurants and bars. When it comes to hotels, there are several in the Old Town, set in historic buildings with rooftop views over the skyline – though be aware that during summer these aren’t the quietest of options. Outside the historic center, there are many newer hotels along with refurbished classics, which have more space for swimming pools, spas and restaurant options. I’ve been traveling here for the last couple of decades – here’s my selection of the best hotels in Dubrovnik. This is Dubrovnik’s original grande dame hotel. Opened in 1897, it drew in travelers from the Austro-Hungarian Empire, who came by steamship to spend winter weeks here by the sea. I love the sense of history here. It’s known locally as “a hotel which remembers much”: Edward VIII and Wallis Simpson danced in the garden in 1936, while refugees sheltered here during the Homeland War of the 1990s when it was severely damaged. But it was renovated in 2018 by Hilton, who have done a good job. The colorful balcony railings have been preserved, along with the original staircase and cornice ceilings. Abstract paintings and a blue-and-gray decor give it a contemporary twist. Times have changed but it’s easy to time-travel back, lounging on the terrace and sipping a Victorian-era cocktail at the bar. This is one of the best hotels in Dubrovnik for atmosphere and old-school glamour. Prijeko Palace is an Old Town hotel set inside a 15th-century palace. To make it even more special each bedroom is designed by a different Croatian artist. There is a sense of theatrical grandeur with original paintings and photography from the artists, along with quirky details such as dressmaker’s dummies decorated with jewelry."
