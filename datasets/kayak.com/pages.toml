full_description = "More often than not the big decision on where to stay in Cancún comes down to budget. On the mainland, the city center is packed with hostels, intimate bed and breakfasts, mid-range hotels, and several upmarket options. Primarily though it consists of places that are easy on the wallet. Hotel zone accommodations, on the other hand, are usually of the top-end variety. The pricier room rates typically get you massive pools, all-day eats and bottomless drinks, white-sand beaches at your doorstep, and in some cases, extravagant luxury. The pampering at Le Blanc Spa Resort, personalized butlers and all, is so over the top that you may never want to leave. Rooms are pimped out with double hot tubs, the restaurants serve some of the city’s finest gourmet fare and the complementary hydrotherapy pool puts you in instant vacay mode. Should you manage to pry yourself away from this great white wonder, a thriving nightlife scene is a short walk away, and yet the hotel is far enough removed from the thumping discos to get a good night’s sleep. The contemporary architecture at this secluded resort in Punta Nizuc, the southernmost tip of the hotel zone, is a gorgeous blend of Mexican and Asian design. Sporting airy open spaces, soothing water features and ocean views nearly everywhere you turn, it’s minimalism done right. The private beach is smaller than some other luxury hotels up the coast but it never feels crowded. The cherry on top is Ni, a breezy Peruvian restaurant specializing in fresh ceviche. A solid downtown option for business travelers and families, this well-run hotel’s spacious suites give you plenty of bang for your back, plus it puts you in the middle of an up-and-coming restaurant zone. The larger suites sleep four comfortably and have full kitchens, making them an ideal setup for small groups or families. Kick the day off at the adjoining Cafe Nader with a Veracruz-style cafe con leche and fresh-baked pastries. Sitting pretty on a secluded stretch of coast about halfway between Cancún and Puerto Morelos, the Waldorf Astoria has so many things to like. Starting with the oceanfront rooms with swim-up pools, the exquisite dining and a pet-friendly policy that means plenty of fancy treats for your pooch. The Waldorf has a rich offering of activities geared toward families too."
