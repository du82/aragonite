 the significance of exploring existential questions and nurturing curiosity to cultivate a deeper connection with the cosmos. Jan. 5 Listen 52 min The Japanese art of happiness: From ikigai, to ritual, to embracing old age Philosophy The Japanese art of happiness: From ikigai, to ritual, to embracing old age Traveler and author Pico Iyer explains what makes Japan so unique and why he’s made it his home. Dec. 31 Listen 52 min Winter wisdom: Katherine May on grief, loss, and the power of celebration Health & Wellness Winter wisdom: Katherine May on grief, loss, and the power of celebration Writer and author Katherine May shares her love for winter, and explains why it is time for both joy and sadness. Dec. 22 Listen 52 min Load More googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415923826084-0');}); Share your passion for new experiences, sounds, & ideas Get Involved Featured Original Pantry Cafe serves its last pancake and ham steak Press Play with Madeleine Brand What’s happening with ‘Star Wars’ and ‘James Bond?’ The Business Helena Bottemiller Evich addresses the agenda to “Make America Healthy Again” Good Food Midweek Reset: Connecting with teens Life Examined 5 Things To Do Newsletter The best of what to see, hear, eat, do, and more. hbspt.forms.create({ portalId: "335293", formId: "406daed6-f7b6-4885-979a-a5182e10082f", target: "#kcrw-news-five-things" }); Upcoming Events View All $(function() { var selector = '#upcoming-events-events-portlet'; InitKCRWEventsPortlet(selector, 2, 'https://events.kcrw.com/wp-json/tribe/events/v1/events?start_date=NOW&categories=art,culture,talk,debate,film,comedy,food-and-drink&per_page=5'); }); googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415924739221-0');}); $(function () { if ($.KCRW._podcast_scroll_event !== true) { $(window).on('scroll', function(){ if ($(this).scrollTop() > 625 && !isMobile()) { $('#podcast-menu').addClass('open'); } else { $('#podcast-menu').removeClass('open'); } }); $.KCR