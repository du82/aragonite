title = "Diversity, Equity & Inclusion | KCRW"
description = "KCRW cares about diversity of thought, of voices both inside KCRW and what we put out as a media organization. These are the actions we are taking to continue building a better, more equitable organization and make an impact on public radio as a whole."
full_description = '''var googletag = googletag || {}; if (googletag.cmd !== undefined) { googletag.cmd.push(function() { var ads = googletag.pubads(); ads.clearTargeting(); ads.setTargeting('id', ["diversity-equity-inclusion"]); ads.setTargeting('section', ["about"]); ads.setTargeting('mode', ["production"]); ads.setTargeting('categories', []); ads.setTargeting('view', ["no-title-view"]); }); } Info Diversity, Equity & Inclusion KCRW creates and curates a unique mix of content centered around music discovery, NPR news, cultural exploration, and informed public affairs. KCRW is driven by the spirit of Los Angeles and delivers in innovative ways – on the radio, digitally and in person – to diverse, curious communities around the corner and around the world. A community service of Santa Monica College, KCRW can be found on the air in LA, Santa Barbara, Ventura, Mojave, Palm Springs, San Luis Obispo, via the KCRW-developed smart phone app, and online at kcrw.com. Letters to Our Community Thank you for reading this community report, which is part of our annual commitment to KCRW’s Pledge for Equity. We continue to strive to reflect diversity and inclusion in every aspect of our organization – with, by and for those who represent KCRW and with, by and for those whom we serve with our programming. The work we are doing will never be done. What follows is a snapshot of our current efforts. Jennifer Ferro, President, KCRW - - - - -Dear Members of the KCRW Community, As KCRW’s Diversity, Equity, and Inclusion Task Force, we strive to set the pace for and model a more supportive and just workplace. We take seriously our role as ambassadors and have made substantial progress toward mapping KCRW’s current diversity landscape and identifying strengths and areas for growth. In keeping with our commitment to promoting trust and transparency, we are sharing our annual KCRW Pledge for Equity Community Report. Significant findings regarding the diversity of KCRW’s staff and leadership, as well as the first concrete steps toward greater equity, are included in this document. Our task force was specifically responsible for KCRW's Community Agreements, based on the three principles of keeping perspective, actively engaging, and building relationships. We feel strongly that the agreements—and all of the activities outlined in the report—demonstrate the deep investment we have in listening, learning, and collectively enacting change at KCRW. Sincerely,The DEI Taskforce KCRW Pledge for Equity KCRW cares about diversity of thought, of voices both inside KCRW and what we put out as a media organization. These are the actions we are taking to continue building a better, more equitable organization and make an impact on public radio as a whole.KCRW Pledge for Equity Annual Report:June 2023June 2022January 2022August 2021 KCRW Pledge for Equity Quarterly Report:February 2021 $(window).on('load', function () { if (!$.KCRW.player.isPlaying()) { $.KCRW.close_player(); } }); var _KCRW_UID = '451d0aa8a8514b3090c06737c40b025d'; var _KCRW_portal_type = 'Document'; var _KCRW_context_url = 'https://www.kcrw.com/about/diversity-equity-inclusion'; if (window.dataLayer && dataLayer.push) { var _KCRW_prior_page_data; var _KCRW_base_page_data = { "kcrw_uid": _KCRW_UID, "kcrw_portal_type": _KCRW_portal_type, "categories": [], "media_type": null, "show": null }; dataLayer.push(_KCRW_base_page_data); }'''
