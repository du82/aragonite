rs filed a lawsuit in federal court in California today, arguing that Elon Musk’s demands for federal employees to provide a bulleted list of everything they… Feb. 24 Listen 50 min Dept. of Edu’s impact on LAUSD, homemade onigiri and spring rolls News Germans head to the polls Sunday at a time of increasing popularity for far-right politicians and Europe at a crossroads over Ukraine. Feb. 20 Listen 50 min Trump’s freeze on foreign aid, meaning of home from Angeleno who lost it News With President Trump back in the White House, Ukraine finds its once top ally has now become a wild card in its three-year war with Russia. Feb. 19 Listen 56 min Load More googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415924739221-0');}); $(function () { if ($.KCRW._podcast_scroll_event !== true) { $(window).on('scroll', function(){ if ($(this).scrollTop() > 625 && !isMobile()) { $('#podcast-menu').addClass('open'); } else { $('#podcast-menu').removeClass('open'); } }); $.KCRW._podcast_scroll_event = true; } }); var _KCRW_UID = '5b1bc1f1bc560a26a2e11c05460b909e'; var _KCRW_portal_type = 'kcrw.site.show'; var _KCRW_context_url = 'https://www.kcrw.com/news/shows/press-play-with-madeleine-brand'; if (window.dataLayer && dataLayer.push) { var _KCRW_prior_page_data; var _KCRW_base_page_data = { "kcrw_uid": _KCRW_UID, "kcrw_portal_type": _KCRW_portal_type, "categories": ["News"], "media_type": "audio", "show": "Press Play with Madeleine Brand" }; dataLayer.push(_KCRW_base_page_data); }'''
