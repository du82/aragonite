full_description = '''var googletag = googletag || {}; if (googletag.cmd !== undefined) { googletag.cmd.push(function() { var ads = googletag.pubads(); ads.clearTargeting(); ads.setTargeting('section', ["news"]); ads.setTargeting('program', ["kcrw-features"]); ads.setTargeting('mode', ["production"]); ads.setTargeting('id', ["kcrw-features"]); ads.setTargeting('categories', ["News"]); ads.setTargeting('view', ["podcast-show-stories"]); }); } Info KCRW Features KCRW's stories, special interviews, and in-depth reporting from the field. KCRW's features air on Morning Edition and All Things Considered. Latest Episode Subscribe Stories Episodes Subscribe Immigrant families with ICE fears consider care options for kids Immigration Immigrant families with ICE fears consider care options for kids Legal advocates are helping families with mixed immigration status make guardianship plans for their children, just in case the adults are detained by immigration authorities. Mar. 3 Listen 3 min Immigrant day laborers learn how to do risky fire cleanup Wildfires Immigrant day laborers learn how to do risky fire cleanup The cleanup is underway in Altadena and Pacific Palisades, and local organizations are educating immigrant day laborers on how to stay safe. Mar. 5 Labor law change confuses CA nail salon industry Business & Economy Labor law change confuses CA nail salon industry A new bill wants to clarify if nail salon workers are independent contractors. Mar. 5 Listen 5 min Original Pantry Cafe shuts down after a century in business Food & Drink Original Pantry Cafe shuts down after a century in business A large group of supporters stood outside The Original Pantry Cafe on its final day in Downtown Los Angeles. Mar. 3 Listen 5 min LA’s religious groups empower immigrants amid deportations Immigration LA’s religious groups empower immigrants amid deportations Religious institutions have long been a refuge for immigrants. Now, they’re mobilizing in response to recent actions from the Trump administration. Feb. 27 Listen 4 min A visit to a lab of the future, tucked away in Downtown LA Technology A visit to a lab of the future, tucked away in Downtown LA The LA central library’s Octavia Lab provides free access to recording studios, 3D printers, video editing software. All you need is a library card. Feb. 27 Listen 8 min Which soul food restaurant reigns supreme in LA? Race & Ethnicity Which soul food restaurant reigns supreme in LA? As Black History Month wraps up, Eater LA reporter Mona Holmes shares the history of soul food and which local restaurant offers the best experience. Feb. 26 Listen 5 min Altadena couple plans to rebuild in danger zone with no reservations Wildfires Altadena couple plans to rebuild in danger zone with no reservations Nothing says “Los Angeles lifestyle” quite like a house in the hills. For one couple, the appeal is enough to make rebuilding a certainty in spite of the fire risk. Feb. 26 Listen 5 min LAUSD builds for housing-insecure employees, but it’s not easy Education LAUSD builds for housing-insecure employees, but it’s not easy Housing costs are pushing school employees away from the neighborhoods where they work, creating long commutes and high turnover. LAUSD wants to build them housing nearby. Feb. 26 Listen 8 min Student in foster care documentary loses home in Eaton Fire Wildfires Student in foster care documentary loses home in Eaton Fire Alex Ballantyne, the subject of the LA documentary “ Possible Selves ,” compares losing his home in the fires to his feelings while in foster care. Feb. 25 Listen 7 min San Clemente rejects proposal to ban feeding unhoused people Orange County San Clemente rejects proposal to ban feeding unhoused people The San Clemente City Council voted down a ban on giving food to strangers in public, including unhoused people. Feb. 25 Listen 5 min LA teen donates thousands of shoes to fire victims Wildfires LA teen donates thousands of shoes to fire victims Jacob Chow leads the Pasadena Relief Boutique, an organization supplying thousands of shoes and other essentials to families affected by the Eaton Fire. Feb. 22 Listen 5 min LA’s newest gay bar inherits Downtown’s queer legacy Food & Drink LA’s newest gay bar inherits Downtown’s queer legacy Kiso has opened at the site of the oldest gay bar in the urban core. It’s part of a renaissance of queer spaces in Downtown and across the city. Feb. 20 Listen 5 min 1 in 4 LA fast food workers were paid below minimum wage in 2024. Why? Food & Drink 1 in 4 LA fast food workers were paid below minimum wage in 2024. Why? Fast food workers lose about 16% of their pay every year, a new Northwestern University study found. Feb. 20 Listen 4 min The race to save historic tiles from post-fire bulldozers Wildfires The race to save historic tiles from post-fire bulldozers Volunteers are racing to save historic tiles before bulldozers clear them away from the Eaton Fire area in Altadena. Many are Batchelder tiles that survived on fireplaces. Feb. 20 Listen 5 min Lost beloved books in LA wildfires? Turn to Reading Rhythms Wildfires Lost beloved books in LA wildfires? Turn to Reading Rhythms Reading Rhythms, an organization of book enthusiasts, is hosting a drive to replace books lost in recent LA fires. Feb. 19 Listen 8 min ‘Past chapter’: KCRW staffer returns to damaged Palisades home Wildfires ‘Past chapter’: KCRW staffer returns to damaged Palisades home After the devastating fires last month, KCRW’s Adria Kloke makes a few trips back to get essentials from her home in the Palisades. Feb. 15 Listen 8 min Mamas found support from each other during LA wildfires Wildfires Mamas found support from each other during LA wildfires Angelenos who acted immediately to help families navigate delivering a baby during the LA fires are redefining postpartum care. Feb. 14 Listen 4 min Superstar Luka Dončić’s debut launches new era for LA Lakers Sports Superstar Luka Dončić’s debut launches new era for LA Lakers NBA superstar Luke Dončić made his debut as an LA Laker this week after a bombshell trade from the Dallas Mavericks. Could he lead the team to the playoffs? Feb. 13 Listen 5 min Fentanyl grips MacArthur Park as officials talk cleanup Law Fentanyl grips MacArthur Park as officials talk cleanup Locals are frustrated as scenes of open drug use and misery play out day and night in a central LA park. Officials pledge outreach and cleanup. Feb. 11 Listen 5 min Load More googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415923826084-0');}); Share your passion for new experiences, sounds, & ideas Get Involved Featured Immigrant families with ICE fears consider care options for kids KCRW Features Immigrant day laborers learn how to do risky fire cleanup KCRW Features Labor law change confuses CA nail salon industry KCRW Features NPR Live Special Coverage: President addresses Congress News Special Programming 5 Things To Do Newsletter The best of what to see, hear, eat, do, and more. hbspt.forms.create({ portalId: "335293", formId: "406daed6-f7b6-4885-979a-a5182e10082f", target: "#kcrw-5-things-newsletter-1" }); Upcoming Events View All $(function() { var selector = '#upcoming-events-events-portlet'; InitKCRWEventsPortlet(selector, 2, 'https://events.kcrw.com/wp-json/tribe/events/v1/events?start_date=NOW&categories=debate,talk,culture&per_page=5'); }); googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415924739221-0');}); $(function () { if ($.KCRW._podcast_scroll_event !== true) { $(window).on('scroll', function(){ if ($(this).scrollTop() > 625 && !isMobile()) { $('#podcast-menu').addClass('open'); } else { $('#podcast-menu').removeClass('open'); } }); $.KCRW._podcast_scroll_event = true; } }); var _KCRW_UID = 'd8cce63ec3334bebbfdfcc42a4bdc7e0'; var _KCRW_portal_type = 'kcrw.site.show'; var _KCRW_context_url = 'https://www.kcrw.com/news/shows/kcrw-features'; if (window.dataLayer && dataLayer.push) { var _KCRW_prior_page_data; var _KCRW_base_page_data = { "kcrw_uid"