full_description = '''var googletag = googletag || {}; if (googletag.cmd !== undefined) { googletag.cmd.push(function() { var ads = googletag.pubads(); ads.clearTargeting(); ads.setTargeting('section', ["culture"]); ads.setTargeting('program', ["the-business"]); ads.setTargeting('mode', ["production"]); ads.setTargeting('id', ["the-business"]); ads.setTargeting('categories', ["Culture", "Entertainment", "Arts"]); ads.setTargeting('view', ["podcast-show-stories"]); }); } Info The Business Lively banter about entertainment industry news and in-depth interviews with directors, producers, writers and actors, hosted by award-winning journalist Kim Masters of The Hollywood Reporter. Latest Episode Subscribe Follow Stories Episodes Newsletter Meet Your Host Subscribe What’s happening with ‘Star Wars’ and ‘James Bond?’ Entertainment What’s happening with ‘Star Wars’ and ‘James Bond?’ Major shake-ups are coming for two fiercely beloved film franchises — “Star Wars” and “James Bond” — we dig into what it all means. Feb. 28 Listen 21 min Songwriters Clément Ducol and Camille on the music of ‘Emilia Pérez’ Entertainment Songwriters Clément Ducol and Camille on the music of ‘Emilia Pérez’ Clément Ducol and Camille, songwriters of “Emilia Pérez,” on shaping the film’s operatic world, and how they’re handling the controversies the film has sparked. Feb. 28 Listen 8 min Pamela Anderson on her life in show business and ‘The Last Showgirl’ Entertainment Pamela Anderson on her life in show business and ‘The Last Showgirl’ Star of “The Last Showgirl” Pamela Anderson keeps things in perspective, even pay discrepancies: “It doesn't matter, I mean, it all evens out in the end.” Feb. 21 Listen 11 min Feud(s): The Murdochs (ongoing) + Harvey vs. Bob Weinstein (developing) Entertainment Feud(s): The Murdochs (ongoing) + Harvey vs. Bob Weinstein (developing) The Murdoch succession Feb. 21 Listen 18 min The directors of ‘Wallace and Gromit: Vengeance Most Fowl’ on modernizing claymation Entertainment The directors of ‘Wallace and Gromit: Vengeance Most Fowl’ on modernizing claymation Nick Park and Merlin Crossingham, directors of the latest “Wallace and Gromit” tale, talk mixing claymation with modernity… and notes from Jeffrey Katzenberg. Feb. 14 Listen 10 min Will Disney’s softened stance on DEI spark a trend? Entertainment Will Disney’s softened stance on DEI spark a trend? Disney and PBS are among the first to dial back DEI initiatives amidst the new political climate. Will Comcast follow suit? Feb. 14 Listen 19 min Jesse Eisenberg on balancing humor and trauma in ‘A Real Pain’ Entertainment Jesse Eisenberg on balancing humor and trauma in ‘A Real Pain’ Jesse Eisenberg talks Polish citizenship and finding the complex humor in “A Real Pain,” his cinematic exploration of generational trauma. Feb. 7 Listen 16 min FCC shares Kamala Harris interview transcript amidst ongoing lawsuit Entertainment FCC shares Kamala Harris interview transcript amidst ongoing lawsuit The full transcript from a CBS interview with Kamala Harris was shared by the FCC as the lawsuit surrounding it appears likely to result in a settlement. Feb. 7 Listen 16 min Marc Platt on the staying power of ‘Wicked’ Entertainment Marc Platt on the staying power of ‘Wicked’ Super producer Marc Platt reflects on his part in the 20-year-plus life cycle of the smash hit musical “Wicked” — from Broadway to the big screen. Jan. 31 Listen 17 min A tone-deaf ‘True Detective’ parody ad for Texas clashes against calls to ‘Stay in LA’ Entertainment A tone-deaf ‘True Detective’ parody ad for Texas clashes against calls to ‘Stay in LA’ A new ad starring Matthew McConaughey and Woody Harrelson calls for Texas to up production incentives, but its anti-Hollywood sentiment lands with a thud. Jan. 31 Listen 22 min THR’s Scott Feinberg talks us through the Oscar nominations For Your Consideration THR’s Scott Feinberg talks us through the Oscar nominations Scott Feinberg, Executive Editor of Awards for The Hollywood Reporter, joins Kim Masters to break down this year's Oscar nominations. Jan. 24 Listen 14 min Netlflix adds 19 million subscribers… and raises its prices Entertainment Netlflix adds 19 million subscribers… and raises its prices The Lively/Baldoni war rages on, Netflix adds 19 million subscribers in Q4, and David Ellison’s Paramount purchase looks to be gaining high level support. Jan. 24 Listen 15 min ENCORE: ‘Sing Sing’ director Greg Kwedar has big plans for pay equity Entertainment ENCORE: ‘Sing Sing’ director Greg Kwedar has big plans for pay equity Director Greg Kwedar’s recently re-released A24 film “Sing Sing” offers a parity model for equal ownership and equal pay in film production. Jan. 17 Listen 15 min Hollywood power players question LA’s mayoral leadership Entertainment Hollywood power players question LA’s mayoral leadership Industry leaders express frustration with LA’s leadership in the midst of ongoing wildfires, Justin Baldoni sues Ryan Reynolds, and Trump threatens Comcast. Jan. 17 Listen 14 min Brady Corbet & Mona Fastvold: a seven year battle to make ‘The Brutalist’ Entertainment Brady Corbet & Mona Fastvold: a seven year battle to make ‘The Brutalist’ Director Brady Corbet's Golden Globe winning film The Brutalist tackles the oft-toxic relationship between art and commerce. Jan. 10 Listen 16 min Warner Brothers shakes up the C-suite Entertainment Warner Brothers shakes up the C-suite Warner Bros. parts ways with two notable execs as new studio heads Mike DeLuca and Pamela Abdi begin rolling out an ambitious slate of 2025 films. Jan. 10 Listen 20 min Inside the twists and turns of the Blake Lively–Justin Baldoni feud Entertainment Inside the twists and turns of the Blake Lively–Justin Baldoni feud Justin Baldoni has filed a lawsuit against the New York Times, which released a story about the alleged PR campaign to tarnish Blake Lively after she made allegations of sexual… Jan. 3 Listen 20 min 'Nosferatu' writer-director and Focus Features chairman embrace the darkness of audience test screenings Entertainment 'Nosferatu' writer-director and Focus Features chairman embrace the darkness of audience test screenings Writer and director Robert Eggers has a fascination with making films that take place in meticulously reconstructed historical settings. ‘Nosferatu’ marks his latest dark film. Jan. 3 Listen 8 min Kim Masters and Matt Belloni banter listener questions in mailbag episode of ‘The Business’ Entertainment Kim Masters and Matt Belloni banter listener questions in mailbag episode of ‘The Business’ As 2024 comes to an end, we want to thank you, our listeners! We asked you to send us your burning questions about the industry, and you delivered – from around the world. Dec. 27 Listen 29 min Documentarian Nic Stacey on his film, ‘Buy Now! The Shopping Conspiracy’ Entertainment Documentarian Nic Stacey on his film, ‘Buy Now! The Shopping Conspiracy’ Consumption, big tech in focus in ‘Buy Now! The Shopping Conspiracy’ Dec. 13 Listen 29 min Load More googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415923826084-0');}); Share your passion for new experiences, sounds, & ideas Get Involved Featured Original Pantry Cafe serves its last pancake and ham steak Press Play with Madeleine Brand What’s happening with ‘Star Wars’ and ‘James Bond?’ The Business Helena Bottemiller Evich addresses the agenda to “Make America Healthy Again” Good Food Midweek Reset: Connecting with teens Life Examined 5 Things To Do Newsletter The best of what to see, hear, eat, do, and more. hbspt.forms.create({ portalId: "335293", formId: "406daed6-f7b6-4885-979a-a5182e10082f", target: "#kcrw-news-five-things" }); Upcoming Events View All $(function() { var selector = '#upcoming-events-events-portlet'; InitKCRWEventsPortlet(selector, 2, 'https://events.kcrw.com/wp-json/tribe/events/v1/events?start_date=NOW&categories=art,culture,talk,debate,film,comedy,food-and-drink&per_page=5'); }); googletag.cmd.push(function() {googletag