about-kcrw { float:left; width:600px; } #about .about-sidebar { background-color:#f8f8f8; float:right; padding:0 40px 40px; width:216px; } #about .videoWrapper { position: relative; padding-bottom: 56.25%; /* 16:9 */ padding-top: 25px; height: 0; } #about .videoWrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } @media only screen and (max-width: 600px) { #about h3 { font-size: 21px; } #about p { font-size:15px; } #about .human-inspiration p { font-size: 30px; margin-bottom:0; } #about .broadcast-frequencies .broadcast-map { float: left; display:block; height:394px; width:296px;} #about .broadcast-frequencies .broadcast-list ul { list-style-type: none; font-size: 15px; margin-left: -20px !important; } #about .broadcast-frequencies .broadcast-list ul strong { font-family: "Flama-Bold"; } #about .broadcast-frequencies .broadcast-list li { line-height: 20px; } #about .about-more .col { float: left; width: 296px; padding-left: 0 !important; } #about .about-kcrw { width:100%; } #about .about-sidebar { margin-top:1em; } } --> Always on LA. ABOUT KCRW KCRW is your always-on connection to music, news, culture, and each other — on the radio, online, and in-person. We belong to Los Angeles, connecting diverse perspectives and the sounds of Southern California with curious communities around the corner and around the world. We are NPR’s flagship member station in Southern California and a community service of Santa Monica College. You can find our broadcast signal in LA, Santa Barbara, Ventura, Mojave, Palm Springs, San Luis Obispo, and worldwide via the KCRW app and at kcrw.com. Mission As a community driven by the spirit of Los Angeles, KCRW aspires to connect the interesting to the interested, growing a hyper-engaged LA-based collective through one-of-a-kind experiences. Always excellent, essential, and accessible, we’re the exclusive club that everyone is invited to. We are the curator of the LA experience — your guide to understanding the diverse communities and cultures of the region, spotlighting unique perspectives through original programming and hand-picked content. Always free, never behind a paywall. Music KCRW’s hand-picked music programming is thoughtfully curated by actual people. It encourages real music discovery and delivers a truly eclectic listening experience. KCRW Music is helmed by Program Director of Music, industry veteran Anne Litt and a team of influential tastemaker DJs including Morning Becomes Eclectic co-hosts Novena Carmel and Anthony Valadez, and FREAKS ONLY host Travis Holcombe, as well as Chris Douridas, Dan Wilcox, Francesca Harding, Henry Rollins, Jason Bentley Jason Kramer, Jeremy Sole, John Moses, José Galván, LeRoy Downs, Nassir Nassirzadeh, Raul Campos, Ro “Wyldeflower” Contreras, Scott Dallavo, SiLVA, Tyler Boudreaux, and Valida. KCRW DJs are given one directive: “play what you love.” KCRW has hosted radio debuts and album celebrations for countless artists. Now household names, KCRW has been influential in the career launches of such luminaries as Adele, Alabama Shakes, Anderson Paak, Angel Olsen, Beck, Billie Eilish, Black Pumas, Brett Dennen, Coldplay, Eels, Fiona Apple, Gabriel Garzon Montano, Garbage, Gillian Welch, Janelle Monae, Jenny Lewis, Juana Molina, Kamasi Washington, Mac DeMarco, Natalie Lafourcade, Ray LaMontagne, Sofi Tukker, and Tame Impala, among many others. KCRW Music offers a robust array of music programming including nearly 100 hours of hosted music every week, and a continuous curated stream of music, Eclectic24. KCRW connects music fans to artists through an array of rich content, including "Today's Top Tune," a free daily downloadable song; Lost Notes, the critically acclaimed in-depth music podcast; and Live from Anne’s Backyard, intimate performances, fresh sounds, and candid conversations with a view. News & Culture KCRW originates and produces weekly content connecting Los Angeles to the world and the world to Los Angeles KCRW’s original audio work, syndicated throughout the U.S. responds with nuance to the interests and needs of Southern California. These programs include the award-winning political review, Left, Right & Center, The Treatment with Elvis Mitchell, Bookworm with Michael Silverblatt, and The Business hosted by Kim Masters. KCRW focuses on Los Angeles and beyond through Press Play with Madeleine Brand and Greater LA with Steve Chiotakis. The station does more than report, it builds communities through shows such as Good Food with Evan Kleiman, and through podcasts such as Bodies and Life Examined. As an NPR affiliate, KCRW airs local editions of popular news magazines Morning Edition and All Things Considered. KCRW also carries nationally syndicated shows such as Marketplace, New Yorker Radio Hour, and The Moth. Events KCRW has a history of bringing unique live experiences to Southern California and around the country – whether concerts with musical talent, or conversations between our hosts and the world's leading thinkers and creators. Music events include the KCRW Festival at the Hollywood Bowl; KCRW’s annual "Summer Nights," a free, all ages concert series throughout Greater Los Angeles; "KCRW Presents," live music shows in Southern California, San Francisco, New York, and other major cities; and live broadcasts and DJ performances from cultural events such as Sundance Film Festival, SXSW, and Coachella Valley Music and Arts Festival, among others. Cultural events include live conversations between KCRW hosts and leading figures in film, art, politics, literature and pop culture and showcasing compelling and independent documentaries; the annual Good Food Pie Contest; Gustavo's Great Tortilla Tournament; and ongoing events hosted with leading cultural institutions, including Los Angeles County Museum of Art (LACMA), Natural History Museum (NHM), California African American Museum (CAAM), Hammer Museum, and the Los Angeles Philharmonic Association. Santa Monica College KCRW is headquartered at the KCRW Media Center on Santa Monica College’s CMD Campus. The 34,000 square-foot, state-of-the-art facility acts as both a media hub and a cultural community center. As an externally-facing department of Santa Monica College, KCRW is committed to being a positive and contributing member of the SMC community. SMC has three externally facing departments: KCRW, The Broad Stage and the SMC Foundation. KCRW serves the SMC mission through public service, community engagement and visibility and branding. The KCRW Foundation, an independent 501c3, exists to support KCRW’s operation. SMC holds the broadcast licenses with the FCC, and is the entity of record with the Corporation for Public Broadcasting. SMC has seats on the KCRW Foundation Board and the President of the organization reports to both institutions. More About KCRW About KCRW Foundation Board Staff Directory Show Syndication Major Funders Careers & Volunteers Become a Sponsor Capital Campaign Pressroom Public File Diversity, Equity & Inclusion KCRW Pledge for Equity Quarterly Report Contact Us BROADCAST FREQUENCIES 89.9 FM & HD KCRW: LA, Orange Counties 89.1 FM & HD KCRU: Ventura County 89.3 FM & HD KCRI: Greater Palm Springs area, Twentynine Palms, Yucca Valley 88.1 FM & HD KCRY: Kern, Northern LA Counties 88.7 FM & HD KDRW: Santa Barbara 101.3 FM KERW: San Luis Obispo 89.7 FM: Gorman 90.9 FM: Banning 92.9 FM: Borrego Springs 100.1 FM: Ridgecrest 102.3 FM: Santa Paula, Moorpark, Fillmore 102.1 FM: Ojai 89.9 FM: Lemon Grove, Spring Valley 106.9 FM: Goleta AWARDS Edward R. Murrow Award, The George Foster Peabody Award, Radio & Television News Directors Association Awards, Corporation for Public Broadcasting Awards, L.A. Press Club's Southern California Journalism Awards, Gracie Awards, and many others. CONTACT Mailing Address:1900 Pico Blvd.Santa Monica, CA 90405 Main Office: 424-538-8500 Membership: (888) 600-KCRW (5279) Fax: 310-450-7172 General Inquiries: Email us Membership Questions: Email us 