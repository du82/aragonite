title = "SUPPORT KCRW"
description = "As the cultural voice of LA, KCRW is the home for sounds, tastes, ideas, and experiences that are new, next, and unexpected. A KCRW membership is an entry into year-round experiences that reflect that. By supporting KCRW, you are joining a community that is original and daring, that finds joy and connection through music, news, and culture, and that believes everyone is welcome to this experiment in public radio we call KCRW. We love our community and member perks are our way of saying thank you!"
