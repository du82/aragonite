description = "KCRW explores the arts! News, feature articles about artists, galleries, events & more. A world of arts & entertainment is waiting to be discovered."
full_description = '''googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415923772346-0');}); googletag.cmd.push(function() {googletag.display('div-gpt-ad-1560197135211-0');}); Arts Culture Entertainment Music Theater Technology Race & Ethnicity What’s happening with ‘Star Wars’ and ‘James Bond?’ Entertainment Major shake-ups are coming for two fiercely beloved film franchises — “Star Wars” and “James Bond” — we dig into what it all means. Feb. 28 from The Business Listen 21 min David Whyte reflects on the transformative nature of poetry Health & Wellness Author, poet, and philosopher David Whyte reflects on the power of words and explores why accepting and celebrating the human condition is such a gift. Mar. 2 from Life Examined Listen 52 min Songwriters Clément Ducol and Camille on the music of ‘Emilia Pérez’ Entertainment Songwriters Clément Ducol and Camille on the music of ‘Emilia Pérez’ Clément Ducol and Camille, songwriters of “Emilia Pérez,” on shaping the film’s operatic world, and how they’re handling the controversies the film has sparked. Feb. 28 from The Business Listen 8 min Weekend film reviews: ‘Last Breath,’ ‘My Dead Friend Zoe’ Entertainment Weekend film reviews: ‘Last Breath,’ ‘My Dead Friend Zoe’ The latest film releases include Last Breath, My Dead Friend Zoe, Cold Wallet, and The Accidental Getaway Driver. Weighing in are Tim Grierson, senior U.S. Feb. 28 from Weekend Film Reviews Listen 15 min Need a professional recording studio, 3D printer or laser cutter? Turn to the Octavia Lab Technology Need a professional recording studio, 3D printer or laser cutter? Turn to the Octavia Lab The LA central library’s Octavia Lab provides free access to recording studios, 3D printers, video editing software. All you need is a library card. Feb. 27 from KCRW Features Listen 8 min Larissa FastHorse on measuring and faking race, plus theatrical farce Theater Larissa FastHorse on measuring and faking race, plus theatrical farce Playwright Larissa FastHorse’s “Fake It Until You Make It” is a farce about two women — one Indigenous, the other white — competing for a grant to fund their nonprofits. Feb. 25 from Press Play with Madeleine Brand Listen 17 min Ke Huy Quan professes his abiding love for creative downtime Arts Ke Huy Quan professes his abiding love for creative downtime Oscar-winner Ke Huy Quan fills us in on how much he appreciates time between projects and why it’s so fun to do fight sequences with a real sense of story. Feb. 22 from The Treatment Listen 17 min Jason Schwartzman talks controlled chaos in organs and harmonies Arts Jason Schwartzman talks controlled chaos in organs and harmonies Actor Jason Schwartzman loves synchronicity in organ playing and harmonies. Allow him to explain. Feb. 22 from The Treatment Listen 5 min Questlove talks Sly Stone and Black genius Arts Questlove talks Sly Stone and Black genius Ahmir “Questlove” Thompson Elvis at last month’s Sundance Film Festival to share what Black genius means to him… and to tease his next project(!). Feb. 22 from The Treatment Listen 29 min Pamela Anderson on her life in show business and ‘The Last Showgirl’ Entertainment Pamela Anderson on her life in show business and ‘The Last Showgirl’ Star of “The Last Showgirl” Pamela Anderson keeps things in perspective, even pay discrepancies: “It doesn't matter, I mean, it all evens out in the end.” Feb. 21 from The Business Listen 11 min Feud(s): The Murdochs (ongoing) + Harvey vs. Bob Weinstein (developing) Entertainment Feud(s): The Murdochs (ongoing) + Harvey vs. Bob Weinstein (developing) The Murdoch succession Feb. 21 from The Business Listen 18 min Weekend film reviews: ‘Old Guy,’ ‘Picnic at Hanging Rock’ Entertainment Weekend film reviews: ‘Old Guy,’ ‘Picnic at Hanging Rock’ The latest film releases include Old Guy, The Monkey, Picnic at Hanging Rock, and Bridget Jones: Mad About the Boy. Feb. 21 from Weekend Film Reviews Listen 15 min Quirky LA museum invites you into intricacies of Andalusian interior design Arts Quirky LA museum invites you into intricacies of Andalusian interior design The Museum of Jurassic Technology has recreated a meditative space from medieval Andalusia as part of the Getty’s region-wide PST Art event. Feb. 20 from Press Play with Madeleine Brand Listen 6 min Edward Norton tells us why he decided not to meet Bob Dylan Arts Edward Norton tells us why he decided not to meet Bob Dylan Edward Norton joins for a special “live” episode of The Treatment at KCRW HQ to share his reverence for David Lynch, and defend his decision to not meet a hero. Feb. 15 from The Treatment Listen 29 min Director James Mangold + costumer Arianne Phillips on big designs for ‘A Complete Unknown’ Arts Director James Mangold + costumer Arianne Phillips on big designs for ‘A Complete Unknown’ Collaborators James Mangold (filmmaker) and Arianne Phillips (costume designer) join to discuss deep 1960s research, and exploring Dylan’s famed enigmatism. Feb. 15 from The Treatment Listen 18 min BONUS: Extended interview with actor Edward Norton Arts BONUS: Extended interview with actor Edward Norton Oscar nominated actor Edward Norton sits down for an extended interview with Elvis Mitchell in front of a live audience at KCRW's Annenberg Performance Studio. Feb. 15 from The Treatment Listen 52 min The directors of ‘Wallace and Gromit: Vengeance Most Fowl’ on modernizing claymation Entertainment The directors of ‘Wallace and Gromit: Vengeance Most Fowl’ on modernizing claymation Nick Park and Merlin Crossingham, directors of the latest “Wallace and Gromit” tale, talk mixing claymation with modernity… and notes from Jeffrey Katzenberg. Feb. 14 from The Business Listen 10 min Will Disney’s softened stance on DEI spark a trend? Entertainment Will Disney’s softened stance on DEI spark a trend? Disney and PBS are among the first to dial back DEI initiatives amidst the new political climate. Will Comcast follow suit? Feb. 14 from The Business Listen 19 min John David Washington on the enduring relevance of ‘Philadelphia’ Arts John David Washington on the enduring relevance of ‘Philadelphia’ John David Washington advocates for Jonathan Demme’s remarkably humanistic dramatization of the AIDS crisis in his Oscar winning 1993 film, ‘Philadelphia.’ Feb. 14 from The Treatment Listen 5 min Demi Moore shares why she loves provocative films like ‘The Substance’ Arts Demi Moore shares why she loves provocative films like ‘The Substance’ Actress Demi Moore tells us about her Oscar-nominated work in the 2024 body horror film “The Substance.” Feb. 7 from The Treatment Listen 29 min Load More googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415923826084-0');}); Get to know your neighbors Get Involved Featured Original Pantry Cafe serves its last pancake and ham steak Press Play with Madeleine Brand What’s happening with ‘Star Wars’ and ‘James Bond?’ The Business Helena Bottemiller Evich addresses the agenda to “Make America Healthy Again” Good Food Immigrant families with ICE fears consider care options for kids KCRW Features 5 Things To Do Newsletter The best of what to see, hear, eat, do, and more. hbspt.forms.create({ portalId: "335293", formId: "406daed6-f7b6-4885-979a-a5182e10082f", target: "#kcrw-home-five-things" }); About Arts on KCRW Stories and reviews of dance, theater, art shows and cinema.'''
