title = "Privacy Policy | KCRW"
full_description = '''var googletag = googletag || {}; if (googletag.cmd !== undefined) { googletag.cmd.push(function() { var ads = googletag.pubads(); ads.clearTargeting(); ads.setTargeting('id', ["privacy-policy"]); ads.setTargeting('section', ["about"]); ads.setTargeting('mode', ["production"]); ads.setTargeting('categories', []); ads.setTargeting('view', ["plone"]); }); } Info Privacy Policy KCRW Online Privacy Policy Highlights Note: The KCRW Online Privacy Policy ("Privacy Policy") has been updated with an effective date of June 30, 2018. Please review the updated Privacy Policy carefully before using the KCRW Services. By using any of the KCRW Services, you consent to the terms of the updated Privacy Policy. This section highlights important features of the Privacy Policy. Please scroll down to see the full Privacy Policy or click on "Read more" to learn more about a specific area. Scope of Privacy Policy KCRW owns, operates, or provides access to KCRW.org and KCRW's mobile applications, email newsletters, and other sites, digital platforms and interactive services provided by KCRW that link to or refer to the Privacy Policy (collectively "KCRW Services" or "our Services"). This Privacy Policy, last modified on June 30, 2018, applies only to the KCRW Services and does not govern the separate websites, applications, newsletters, platforms and services of KCRW s or of any third parties that may link to or be linked to from the KCRW Services. NOTICE TO EU RESIDENTS: Our handling of information about EU residents is governed by the KCRW Privacy Notice for EU Residents, effective May 25, 2018. This Privacy Policy does not apply to EU residents. Children If you are a parent or guardian, we encourage you to become involved in your children's online experience, and to share your knowledge and experience with your young ones. If you are under 13, please do not register for the KCRW Services or provide us with any contact or other information, including your name, address or email address. If you are between the ages of 13 and 18, you must obtain permission from your parent or guardian before registering for the KCRW Services or otherwise sending any contact or other information to KCRW. Information You Provide Directly Through Our Services We and our service providers collect a variety of contact and other information about you that you provide directly through our Services, including your name, email address, postal address, telephone number, password, age, payment card information, country of residence, communications and content preferences, and your favorite s. We may collect such information when you: Register for an KCRW account, application programming interface (API) content access, or any KCRW email newsletter. Email, text or otherwise share a story from any of the KCRW Services. Contact us for information or to ask a question. Make a purchase from the KCRW Shop. Post, upload, or otherwise submit a comment, story idea, essay, photo, or other content to KCRW. Register for an KCRW tour or event or any contest we sponsor. Apply for a job, internship or fellowship at KCRW. If you choose to participate in a survey, we may ask you to provide your date of birth, gender, education level, information about your employment, income level and other information. Make a donation to KCRW or an KCRW or submit a related inquiry. Otherwise volunteer information to us or respond to a request for information through any of our Services. If you do not consent to the collection, use or sharing of this type of information in the manner described in the Privacy Policy, please do not provide us with such information. By providing such information, you are "opting in" to the collection, use and sharing of this information in accordance with the Privacy Policy. Information Collected Automatically Through Technology As you navigate our Services, we and our service providers also automatically collect a variety of information about your interactions with our Services. Depending on which KCRW Services you use and how you access them, the information collected automatically may include: The Internet Protocol address (IP address) of the computer or device you used to access an KCRW Service and information about your Internet Service Provider. The website, application, platform or service you visited before and after visiting an KCRW Service. Information about your computer or mobile device, and its browser, operating system, settings and software. Unique device identifiers on the mobile device you used to access an KCRW Service, including, as applicable, the Apple IDFA (Identifier for Advertisers) or Google Android Advertising ID. Your approximate geographic location information (derived from request header information, such as your IP address) and/or more precise location if you have given KCRW explicit consent to receive this information for an KCRW mobile application on your mobile device. Automobile make (for certain connected car platforms). The dates, times, duration and frequency of your interactions with our Services, any search terms you enter, the media files you listen to, download, view, email, text or otherwise share, favorites you select, and your navigation path through our Services. Listening data, including information about your interactions with KCRW podcasts and other media files. Information about your interactions with our email messages. If you do not consent to the automatic collection, use or sharing of this type of information in the manner described in the Privacy Policy, please do not use the KCRW Services. By using the KCRW Services, you are "opting in" to the automatic collection, use and sharing of this information in accordance with the Privacy Policy. Use of Information We and our service providers may use the information collected from you (whether provided by you directly or automatically collected through technology) to: Manage, administer, promote, analyze and improve our Services. Respond to your questions or messages and fulfill your orders or requests for services. Customize the content you see and hear on our Services, including offering content from KCRW associated with your account or located near you and offering other content that may be of interest to you. Customize the sponsorship credits you see and hear on our Services and on third-party services you may use or visit. Recognize you as the same user as you access our Services using different computers, devices and browsers. Send you email newsletters and marketing, fundraising, membership and other communications from KCRW and our s. Publish, broadcast or otherwise use stories or information you submit to us. Comply with laws and enforce KCRW's Terms of Use and other legal rights. Generate aggregate or other information that does not directly identify you as an individual or the devices you use to access our Services, and use and share that information for KCRW's purposes. We also may use the information collected from you in other ways, and for other purposes, that are described to you at the point of collection or for which we otherwise have obtained your consent. Disclosure of Information Subject to the choices you have to control certain collection and uses of information as described in the “Your Choices” section of the Privacy Policy, we reserve the right to share with any third party, in accordance with applicable law, aggregated or other information that does not directly identify you as an individual. We also may share your name, email address and other personal information: With our s, who may use this information for internal purposes and to send you email newsletters and marketing, fundraising, membership and other communications. With our authorized service providers for purposes of providing services on our behalf. With our authorized third-party applications for purposes of providing certain KCRW Services to you on the applications. If we sell an KCRW Service or in the unlikely event of bankruptcy. To protect or defend the rights of KCRW, our s, our users or others. When required by law or public authorities. With persons we contact on your behalf when you choose to email, text, or otherwise share a story or other content through our Services. With other parties if we have disclosed such sharing to you at the time of collection of the information or if we otherwise have your consent. Your Choices If you do not consent to the collection, use or sharing of information as described in the Privacy Policy, please do not use the KCRW Services or provide us with information. By using the KCRW Services or providing us with information through the KCRW Services, you are "opting in" to the collection, use and sharing of that information as described in the Privacy Policy. If you provide registration information to us, you can sign in to your KCRW account or contact us to update or correct that information at any time. If you do not want us to share your name, contact or other information with s, you can contact us. You can stop the delivery of marketing emails or email newsletters from KCRW by following the unsubscribe instructions in any such email you receive. You also can sign in to your KCRW account to manage your KCRW email newsletter subscriptions or contact us. You have choices about the collection and use of your information by third parties for the display of certain personalized or "interest-based" online sponsorship credits, as described in our section on interest-based messages in the "Your Choices” section of the Privacy Policy. If you grant your consent to our collection of your precise mobile device location information, you can revoke your consent at any time by using the privacy settings of your device and/or the settings of the applicable KCRW mobile application. You have choices to prevent or limit the collection of information through cookies, pixel tags and other technology as further described in our section on cookies in the "Your Choices" section of the Privacy Policy. Further information about our use of cookies, pixel tags and other tracking technologies used by NPR member stations can be found here. Security and Other Information At KCRW, we recognize the importance of privacy to users of our Services. We have adopted safeguards to help protect sensitive information we collect, but no data transmission or storage can be guaranteed to be 100% secure. Notice to Users Outside the U.S. Our Services are controlled and operated within the United States. If you access our Services outside of the United States, we may transfer the information collected from you to data centers outside of your home country or jurisdiction. In particular, your information may be transferred to and processed in the United States and other jurisdictions where we or our service providers operate, where data protection and other laws may not be equivalent to those in your jurisdiction. By using the KCRW Services, you agree that your information can be transferred to and used in the United States and in other jurisdictions where we or our service providers operate, as set forth in the Privacy Policy. NOTICE TO EU RESIDENTS: Our handling of information about EU residents is governed by the KCRW Privacy Notice for EU Residents, effective May 25, 2018. This Privacy Policy does not apply to EU residents. For California Residents: Your California Privacy Rights California residents can request and obtain from us once a year and free of charge a list of all third parties to which KCRW has disclosed certain information during the preceding calendar year for the third parties' direct marketing purposes. If you are a California resident and want such a list, please contact us. For all such requests, you must put the statement "Your California Privacy Rights" in the message field of your request, as well as your name, street address, city, state, and zip code. Please note that we will not accept these requests by telephone, mail or fax, and we are not responsible for notices that are not labeled or sent properly, or that do not have complete information. Full Version of KCRW Online Privacy Policy Effective Date June 30, 2018 Welcome to the KCRW Online Privacy Policy ("Privacy Policy"). This Privacy Policy describes the information National Public Radio, Inc. and its affiliated organizations (owned or controlled by, or under common ownership or control with, National Public Radio, Inc.) (collectively, "KCRW," "we" or "us") collect or allow others to collect from you and your computer or device when you use KCRW.org or other sites, KCRW One or other applications, email newsletters, digital platforms or other interactive services provided by KCRW that link to or refer to this Privacy Policy (collectively, the "KCRW Services" or "our Services"). This Privacy Policy also explains how that information may be used and shared and the choices you have to limit or prevent certain uses or sharing of that information. Please note that this Privacy Policy does not govern the websites and services of KCRW's s, or the websites and services of third parties that may link to or be linked to from the KCRW Services. NOTICE TO EU RESIDENTS: Our handling of information about EU residents is governed by the KCRW Privacy Notice for EU Residents, effective May 25, 2018. This Privacy Policy does not apply to EU residents. By using, registering for, or otherwise accessing our Services, you agree to this Privacy Policy and KCRW’s Terms of Use and you give your express "opt-in" consent to the collection, use, storage, sharing, transfer, and processing of information about you and your interactions with our Services as explained in this Privacy Policy. If you do not agree to this Privacy Policy or KCRW's Terms of Use, please do not use the KCRW Services or provide us with your contact or other information. If you have questions about this Privacy Policy, please contact us. Children KCRW cares about protecting the privacy of children. If you are a parent or guardian, we encourage you to become involved in your children's online experience, and to share your knowledge and experience with your young ones. If you are under 13, please do not register for our Services or provide us with any contact or other information, including your name, postal address or email address. If you are between the ages of 13 and 18, you must obtain permission from your parent or guardian before registering for KCRW Services or otherwise sending any contact or other information to KCRW. Information Collected Through Our Services Information You Provide Directly Through Our Services We and service providers working on our behalf will collect any information that you choose to provide directly through our Services, including your name, email address, postal address, telephone number, password, age, payment card information, country of residence, communications and content preferences and your favorite s. For example, such inf'''
