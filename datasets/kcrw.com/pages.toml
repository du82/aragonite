 min Midweek Reset: Toxic positivity Psychology Midweek Reset: Toxic positivity This week, cognitive scientist and professor of psychology at Yale University Lori Santos explains that negative emotions are very much part of the human experience and essential to… Feb. 19 Listen 3 min Baratunde Thurston on nature, democracy, and interdependence Environment Baratunde Thurston on nature, democracy, and interdependence Nature, the great outdoors, and our interdependence. Feb. 16 Listen 52 min Midweek Reset: Sleep Health & Wellness Midweek Reset: Sleep This week, Kenneth Miller , writer and author of Mapping the Dark; The Visionary Scientists Who Unlocked The Mysteries of Sleep, offers a practical approach for insomniacs. Feb. 12 Listen 4 min The Black Utopians; vision, history, and legacy Race & Ethnicity The Black Utopians; vision, history, and legacy Utopian vision and how it influenced Black thinkers and leaders in the 1960s is discussed by sociologist Ruha Benjamin and author Aaron Robertson. Feb. 9 Listen 52 min Midweek Reset: On Attachments Psychology Midweek Reset: On Attachments This week, Amir Levine , associate professor of psychiatry at Columbia University and co-author of Attached: The New Science of Adult Attachment and How It Can Help You Find—and… Feb. 5 Listen 4 min New book ‘Winter’s End’ chronicles dementia and end of life choice Philosophy New book ‘Winter’s End’ chronicles dementia and end of life choice Dan Winter’s advocacy for ending his life is discussed by dementia researcher Lewis Cohen, hospice specialist Jeff Zesiger, and Winter’s husband John Forsgren. Feb. 2 Listen 52 min Midweek Reset: On The Cosmos Science Midweek Reset: On The Cosmos This week, Kelsey Johnson , astronomer and author of Into the Unknown:The Quest to Understand the Mysteries of the Cosmos talks about the Cosmos and the moral necessity of exploring… Jan. 29 Listen 3 min Learning from silence: Pico Iyer on the transformative power of solitude Psychology Learning from silence: