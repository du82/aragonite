full_description = '''var googletag = googletag || {}; if (googletag.cmd !== undefined) { googletag.cmd.push(function() { var ads = googletag.pubads(); ads.clearTargeting(); ads.setTargeting('section', ["music"]); ads.setTargeting('program', ["music-special"]); ads.setTargeting('mode', ["production"]); ads.setTargeting('id', ["music-special"]); ads.setTargeting('categories', ["Music"]); ads.setTargeting('view', ["show-view"]); }); } Info googletag.cmd.push(function() {googletag.display('div-gpt-ad-1415923772346-0');}); Music Special Programming Listen Dec 31 1 hr Discover KCRW's exclusive artist interviews, live performances, original programming and streaming playlists. Our digital-first music programming is on-demand and updated weekly. All Episodes Novena Carmel “Morning Becomes Eclectic: 2024 Countdown Edition” Music Novena’s Best of 2024 countdown episode of Morning Becomes Eclectic was so good, we had to close the year with it!!! Dec. 31 Ariana Morgenstern “Top Tune Highlights” Music Ariana Morgenstern is one of the major forces behind KCRW’s Music Team. Dec. 31 Listen 1 hr Anna Chang “Live From KCRW Highlights” Music Among the many other things she does at KCRW, Anna Chang is also the producer of the live performances that take place at KCRW. Dec. 31 Listen 1 hr Nassir Nassirzadeh “2024 Top 30 Highlights” Music Nassir is responsible for compiling the songs that go into our library that our DJs play on their shows. Many of these songs eventually make it to KCRW’s Top 30 chart. Dec. 31 Listen 1 hr Henry Rollins’ favorite records of 2024 (that only exist in his mind) Best New Music Rollins reviews 3 definitely, certainly real 12” records from 2024 Dec. 31 Ivy talks making the seminal y2k dreampop LP ‘Long Distance’ Music Ivy broke out in the early 2000s with "Edge of the Ocean." As their album “Long Distance” makes its vinyl debut, the surviving members reflect on its creation. Oct. 31 Nick Cave on ‘Wild God,’ ‘Shrek 2,’ & ‘The Red Hand Files’ Music On the heels of his 18th studio album “Wild God,” Nick Cave settles in for a meaty chat about the new LP, the nature of existence, and working on “Shrek 2.” Sep. 5, 2024 Listen 1 hr, 16 min Remembering Angela McCluskey: Live on MBE (1995-2010) Music KCRW remembers Angela McCluskey, formerly of Wild Colonials, with a selection of KCRW live appearances. Mar. 14, 2024 Load More More from KCRW Ashley Jackson: ‘Deep River II’ Best New Music Award-winning harpist Ashley Jackson , whose expressive work melds traditional classical music with the rich heritage of Black spirituality, has a new album on the horizon — Take Me To… Mar. 5 from Today's Top Tune Listen 2 min Morning Becomes Eclectic playlist: Mar. 4, 2025 Best New Music KCRW's signature music program features new releases, live performances, and artist interviews hosted by Novena Carmel. Mar. 4 from Morning Becomes Eclectic Listen 2 hr, 49 min Bellzzz: ‘Far Away’ Best New Music Dear Elizabeth is the forthcoming debut EP (out March 28) by the artist known as Bellzzz . It’s based on her childhood imagination of a young girl she invented. Mar. 4 from Today's Top Tune Listen 4 min Featured Shows All Shows > Morning Becomes Eclectic KCRW's signature daily music show. New releases, live performances, and interviews. Lost Notes This season on Lost Notes: Groupies. Women of the Sunset Strip from the Pill to Punk. FREAKS ONLY Future beats and a mind-melting mix of fuzz, bass, and funk. Served fresh every weeknight. Bent by Nature She was the most influential American DJ you’ve never heard of. Deirdre O’Donoghue was a vital force in the musical underground of the 1980s. Events View All > Mar 13 Troubadour Presents Joy Oladokun Mar 13 Troubadour Mar 14 KCRW Under the Blood Moon, a KCRW Members-Only Experience Mar 14 Clifton’s Republic Mar 15 Goldenvoice Nathy Peluso Mar 15 The Novo Mar 22 The Bellwether Los Angeles Folk Festival Mar 22 The Bellwether The Latest José Galván's playlist, March 3, 2025 Best New Music José Galván's playlist, March 3, 2025 An infectious harmony of varied sounds and melodies that bridge cultures and genres. Mar. 3 from José Galván Listen 1 hr, 59 min FREAKS ONLY playlist: March 3, 2025 Best New Music FREAKS ONLY playlist: March 3, 2025 New music. Emerging artists. No boundaries. Served fresh every weeknight, 8-10pm, only on FREAKS ONLY by Travis Holcombe. Mar. 3 from FREAKS ONLY Listen 1 hr, 59 min Morning Becomes Eclectic playlist: Mar. 3, 2025 Best New Music Morning Becomes Eclectic playlist: Mar. 3, 2025 Hear Tamino’s contemplative single “Willow” before it hits DSPs, and ahead of his new LP “Every Dawn’s A Mountain” (due March 21). Mar. 3 from Morning Becomes Eclectic Listen 2 hr, 49 min Amy Millan: ‘Wire Walks’ Best New Music Amy Millan: ‘Wire Walks’ Amy Millan is a Star, literally, she’s a member of the beloved Montreal indie-pop group Stars. She’s also a satellite member of the iconic Broken Social Scene collective. Mar. 3 from Today's Top Tune Listen 4 min Eclectic 24 Best New Music Eclectic 24 KCRW's all-music channel blending the collected talents and tastes of all KCRW's DJs into a single voice streaming 24 hours a day. Mar. 3 Eclectic 24 Best New Music Eclectic 24 KCRW's all-music channel blending the collected talents and tastes of all KCRW's DJs into a single voice streaming 24 hours a day. Mar. 3 LeRoy Downs' playlist, March 2, 2025 Music LeRoy Downs' playlist, March 2, 2025 "Just Jazz" with LeRoy Downs. Downs' goal is to bring a varied sonic experience to jazz, while blending music, style, and culture. Mar. 2 from LeRoy Downs Listen 2 hr Jason Kramer's playlist, March 2, 2025 Best New Music Jason Kramer's playlist, March 2, 2025 Featuring selections that range from carefully curated music from around the world with unique gems and quality tracks that will satisfy the needs of even the most discerning music… Mar. 2 from Jason Kramer Listen 2 hr Music Insider Newsletter Anne Litt shares her take on the week in KCRW music. hbspt.forms.create({ portalId: "3352