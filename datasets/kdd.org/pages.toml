["https://kdd.org/awards/sigkdd-innovation-award"]
title = "SIGKDD Awards : SIGKDD Innovation Award"
description = """
2022 SIGKDD Innovation Award: Huan Liu2022 Award Winner                                                                    ACM SIGKDD is pleased to announce that Dr. Huan Liu is the winner of its 2022 Innovation Award.  He is a professor of computer science and engineering at Arizona State University, Tempe and is recognized for his outstanding and influential contributions to the foundation, principles and applications of social media mining and feature selection for data mining.
                                    Continue Reading"""
full_description = "SIGKDD Innovation Award The award recognizes individuals for their outstanding technical contributions to the field of knowledge discovery in data and data mining that have had lasting impact in furthering the theory and/or development of commercial systems. Recipients 2022 SIGKDD Innovation Award: Huan Liu2022 Award Winner ACM SIGKDD is pleased to announce that Dr. Huan Liu is the winner of its 2022 Innovation Award. He is a professor of computer science and engineering at Arizona State University, Tempe and is recognized for his outstanding and influential contributions to the foundation, principles and applications of social media mining and feature selection for data mining. Continue Reading 2021 SIGKDD Innovation Award: Johannes Gehrke2021 Award Winner Johannes Gehrke is a Technical Fellow and the Managing Director of Research at Redmond and the CTO and head of machine learning for the Intelligent Communications and Conversations Cloud (IC3), which powers Microsoft Teams. Until June 2020, he was leading architecture and machine learning for IC3. Johannes’ research interests are in the areas of database systems, distributed systems, and machine learning. He has received a National Science Foundation Career Award, an Arthur P. Sloan Fellowship, a Humboldt Research Award, the 2011 IEEE Computer Society Technical Achievement Award, and he is an ACM Fellow and an IEEE Fellow. Johannes co-authored the undergraduate textbook Database Management Systems (McGrawHill (2002), currently in its third edition), used at universities all over the world. He is a member of the ACM SIGKDD Executive Committee. From 1999 to 2015, Johannes was on the faculty in the Department of Computer Science at Cornell University where he graduated 25 PhD students, and from 2005 to 2008, he was Chief Scientist at FAST Search and Transfer. Continue Reading 2020 SIGKDD Innovation Award: Thorsten Joachims2020 Award Winner Thorsten Joachims, professor of Computer Science and Information Science at Cornell University, is recognized for his research contributions in machine learning, including influential work studying human biases in information retrieval, support vector machines (SVM) and structured output prediction. Notably, Joachims pioneered methods for eliciting reliable preferences from implicit feedback, methods for unbiased learning-to-rank and ranking methods that provide fairness guarantees. The ACM SIGKDD Innovation Award is the highest honor for technical excellence in the field of knowledge discovery and data mining. It is conferred on an individual or group of collaborators whose outstanding technical innovations have greatly influenced the direction of research and development in the field. “I am greatly honored by this recognition from the KDD community,” said Joachims. “KDD is known for innovation — not only as an academic endeavor but also with an eye towards real-world impact and social good.” Continue Reading 2019 SIGKDD Innovation Award: Dr. Charu Aggarwal2019 Award Winner ACM SIGKDD is pleased to announce that Dr. Charu Aggarwal is the winner of its 2019 Innovation Award. He is a distinguished research staff member at IBM T.J. Watson Research Center and is recognized for his research contributions in high-dimensional data, privacy, data streams, uncertain data, graphs, text mining and social networks. The ACM SIGKDD Innovation Award is the highest award for technical excellence in the field of Knowledge Discovery and Data Mining (KDD). It is conferred on one individual or one group of collaborators whose outstanding technical innovations in the KDD field have had a lasting impact in advancing the theory and practice of the field. The contributions must have significantly influenced the direction of research and development of the field or transferred to practice in significant and innovative ways and/or enabled the development of commercial systems. Continue Reading 2018 SIGKDD Innovation Award: Dr. Bing Liu2018 Award Winner ACM SIGKDD is pleased to announce that Dr. Bing Liu is the winner of its 2018 Innovation Award. He is a Distinguished Professor of Computer Science at the University of Illinois at Chicago and is honoured this year for his seminal contributions to the foundation of data mining and applications, particularly in opinion mining. The ACM SIGKDD Innovation Award is the highest award for technical excellence in the field of Knowledge Discovery and Data Mining (KDD). It is conferred on one individual or one group of collaborators whose outstanding technical innovations in the KDD field have had a lasting impact in advancing the theory and practice of the field. The contributions must have significantly influenced the direction of research and development of the field or transferred to practice in significant and innovative ways and/or enabled the development of commercial systems. Continue Reading 2017 SIGKDD Innovation Award: Dr. Jian Pei2017 Award Winner ACM SIGKDD is pleased to announce that Dr. Jian Pei is the winner of its 2017 Innovation Award. He is recognized for his seminal contributions to the foundation of data mining and applications, particularly in pattern mining and spatial data mining. He is a major inventor of several pattern-growth methods, including FP-growth and PrefixSpan, which have been extensively used by industry and adopted by data mining textbooks and open source software toolkits. As one of the most cited authors in data mining, his prolific publications have been cited tens of thousands of times. The ACM SIGKDD Innovation Award is the highest award for technical excellence in the field of Knowledge Discovery and Data Mining (KDD). It is conferred on one individual or one group of collaborators whose outstanding technical innovations in the KDD field have had a lasting impact in advancing the theory and practice of the field. The contributions must have significantly influenced the direction of research and development of the field or transferred to practice in significant and innovative ways and/or enabled the development of commercial systems. Continue Reading 2016 SIGKDD Innovation Award: Philip S. Yu2016 Award Winner ACM SIGKDD is pleased to announce that Philip S. Yu is the winner of its 2016 Innovation Award. He is recognized for his influential research and scientific contributions on mining, fusion and anonymization of big data. The ACM SIGKDD Innovation Award is the highest award for technical excellence in the field of Knowledge Discovery and Data Mining (KDD). It is conferred on one individual or one group of collaborators whose outstanding technical innovations in the KDD field have had a lasting impact in advancing the theory and practice of the field. The contributions must have significantly influenced the direction of research and development of the field or transferred to practice in significant and innovative ways and/or enabled the development of commercial systems. Continue Reading 2015 SIGKDD Innovation Award: Hans-Peter Kriegel2015 Award Winner Hans-Peter Kriegel is the winner of its 2015 Innovation Award. He is recognized for his influential research and scientific contributions to data mining in clustering, outlier detection and high-dimensional data analysis, including density-based approaches. He has been a Professor of Informatics at Ludwig-Maximilians-Universitaet Muenchen, Germany since 1991. He has published over a wide range of data mining topics including clustering, outlier detection and high-dimensional data analysis. In 2009 the Association for Computing Machinery (ACM) elected Professor Kriegel an ACM Fellow for his contributions to knowledge discovery and data mining, similarity search, spatial data management, and access-methods for high-dimensional data. Continue Reading 2014 SIGKDD Innovation Award: Pedro Domingos2014 Award Winner Prof. Domingos carried out some of the earliest research on mining data streams. His VFDT algorithm was the first to be capable of learning decision trees from streams while guaranteeing that the result is very close to that of batch learning, and remains the fastest decision tree learner available. He went on to generalize the ideas in VFDT to clustering, the EM algorithm, Bayesian network structure learning, and other problems. The resulting VFML toolkit is one of the best open-source resources for stream mining. Continue Reading 2013 SIGKDD Innovation Award: Prof. Jon Kleinberg2013 Award Winner ACM SIGKDD is pleased to announce that Prof. Jon Kleinberg is the winner of the 2013 Innovation Award. He is recognized for his seminal contributions to the analysis of social and information networks, mining the web graph, study of cascading behaviors in networks, and the development of algorithmic models of human behavior. Continue Reading Frequency of the Awards Once a year. Administration of the Awards Program The SIGKDD Awards Committee, consisting of 3-5 prominent senior scientists in the field, will solicit nominations for recipient candidates, evaluate the nominations, and select winners. The SIGKDD Chair will form the Awards Committee by inviting candidates. The SIGKDD Chair will appoint the Chair of the Awards Committee. The terms of the Awards Committee will be the same as the term of the SIGKDD Chair. Once formed, the Awards Committee will select winners of the Awards completely independently of SIGKDD Chair or SIGKDD Executive Committee. The Award winner will be decided by a two-thirds majority vote of the Awards Committee. There will be at most one individual or one group to receive either Award in any given year. (It is possible that in a given year, there may be no winner of either Award.) The Awards Committee will solicit nominations for Award recipients 5 months before the SIGKDD Annual International Conference via the SIGKDD website, SIGKDD Annual Conference website, and the KDNuggets electronic newsletter. Nominations, once made, may be re-considered for the subsequent two years; if the nominee does not win after the first three years, the nomination is discarded. The deadline for the nominations will be 3 months before the SIGKDD Annual International Conference. (The Awards Committee will take 6 weeks to make its decisions.) The winners will receive the Awards at the SIGKDD Annual International Conference. The winners will be announced in the SIGKDD Conference website and the SIGKDD website. The Awards Each Award carries a $2,500 monetary award and a plaque. If the winner is a group of individuals, the group will receive $2,500 (not each individual). However, each individual will receive a plaque. Exclusions SIGKDD Chair and members of the SIGKDD Awards Committee are not eligible to be nominated for either Award. Related Posts: Search SIGKDD Awards Twitter Feed Follow Us on Twitter Popular Recent Call for Bids to Host KDD-2018 KDD Cup 2016 Call for Proposals Call for Bids to Host KDD-2019 SIGKDD Honors Career Achievements in Knowledge Discovery and Data Mining Aug 05 2021 2021 ACM SIGKDD Election Results Jun 16 2021 2021 SIGKDD Doctoral Dissertation Award: Call for Nominations Mar 29 2021"
