title = "SIGKDD Awards : 2022 SIGKDD Rising Star Award"
full_description = "2022 SIGKDD Rising Star Award2022 SIGKDD Rising Star Award Award Winner The 2022 SIGKDD Rising Star Award is presented to Dr. Yuxiao Dong of Tsinghua University, for his contributions to graph representation learning and pre-training. Yuxiao Dong is an Assistant Professor of Computer Science at Tsinghua University, where he is a member of the Knowledge Engineering Group (KEG). His research focuses on data mining, graph representation learning, and social &amp; information networks. Together with collaborators, his recent research includes the Heterogeneous Graph Transformer (HGT), graph pre-training (GraphMAE, GCC, GPT-GNN, kgTransformer), and network embedding (NetMF, NetSMF, ProNE, SketchNE) algorithms, some of which were deployed for billion-scale applications in AMiner, Facebook, and Microsoft and nominated for best papers in WWW&#39;22 and WWW&#39;19. He was selected as one of the IJCAI’22 Early Career Spotlights and received the 2017 SIGKDD Doctoral Dissertation Award Honorable Mention. Tags Twitter Feed Follow Us on Twitter Popular Recent Call for Bids to Host KDD-2018 KDD Cup 2016 Call for Proposals Call for Bids to Host KDD-2019 SIGKDD Honors Career Achievements in Knowledge Discovery and Data Mining Aug 05 2021 2021 ACM SIGKDD Election Results Jun 16 2021 2021 SIGKDD Doctoral Dissertation Award: Call for Nominations Mar 29 2021"
