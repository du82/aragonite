full_description = "2022 SIGKDD Rising Star Award Sep 19 2022 Continue Reading 2022 SIGKDD Best Paper Award Winners Sep 19 2022 Continue Reading 2022 SIGKDD Service Award: Charu Aggarwal Sep 19 2022 Dr. Charu Aggarwal has made significant service contributions to conferences and journals in the field of data mining. He has served as a program chair of ACM KDD Conference in 2016 and the IEEE ICDM Conference in 2015. He is an editor-in-chief of ACM Transactions on Knowledge Discovery from Data, and is also an editor-in-chief of ACM Books. He previously served as the editor-in-chief of ACM SIGKDD Explorations, which is the premier newsletter of ACM SIGKDD. Continue Reading 2022 SIGKDD Innovation Award: Huan Liu Sep 19 2022 ACM SIGKDD is pleased to announce that Dr. Huan Liu is the winner of its 2022 Innovation Award. He is a professor of computer science and engineering at Arizona State University, Tempe and is recognized for his outstanding and influential contributions to the foundation, principles and applications of social media mining and feature selection for data mining. Continue Reading SIGKDD Honors Career Achievements in Knowledge Discovery and Data Mining Aug 05 2021 KDD 2021, the premier interdisciplinary conference in data science, today announced the recipients of the 2021 ACM SIGKDD Awards for exemplary individuals and research teams in data science, machine learning, big data and artificial intelligence. Ahead of the organization's annual conference on Continue Reading 2021 SIGKDD Test of Time Award Winners Aug 05 2021 The SIGKDD Test of Time Award recognizes outstanding papers from past KDD Conferences beyond the last decade that have had an important impact on the data mining research community. Continue Reading 2021 SIGKDD Rising Star Award Aug 05 2021 Continue Reading 2021 SIGKDD Dissertation Award Winners Aug 05 2021 ACM SIGKDD dissertation awards recognize outstanding work done by graduate students in the areas of data science, machine learning and data mining. Continue Reading 2021 SIGKDD Service Award: Shipeng Yu Aug 05 2021 Shipeng Yu has been leading teams and driving AI innovations across industries such as social network, manufacturing, service, and healthcare. With a strong research background and an entrepreneurial mindset, he is enthusiastic about creative thinking, innovative business models, and great team work. Currently he leads the Communications AI team at LinkedIn, which owns the major AI engine driving engagement growth and member retention at LinkedIn. The team develops innovative AI algorithms, builds scalable AI pipeline and platforms, makes great business impact, and also actively contributes to research communities. Shipeng strongly believes in giving back to the research community. He served as General Chair for KDD 2017. He is currently the Sponsorship Director for SIGKDD, overseeing the sponsorship effort for the annual KDD conferences and other Data Mining community activities. Continue Reading 2021 SIGKDD Innovation Award: Johannes Gehrke Aug 05 2021 Johannes Gehrke is a Technical Fellow and the Managing Director of Research at Redmond and the CTO and head of machine learning for the Intelligent Communications and Conversations Cloud (IC3), which powers Microsoft Teams. Until June 2020, he was leading architecture and machine learning for IC3. Johannes’ research interests are in the areas of database systems, distributed systems, and machine learning. He has received a National Science Foundation Career Award, an Arthur P. Sloan Fellowship, a Humboldt Research Award, the 2011 IEEE Computer Society Technical Achievement Award, and he is an ACM Fellow and an IEEE Fellow. Johannes co-authored the undergraduate textbook Database Management Systems (McGrawHill (2002), currently in its third edition), used at universities all over the world. He is a member of the ACM SIGKDD Executive Committee. From 1999 to 2015, Johannes was on the faculty in the Department of Computer Science at Cornell University where he graduated 25 PhD students, and from 2005 to 2008, he was Chief Scientist at FAST Search and Transfer. Continue Reading 2021 ACM SIGKDD Election Results Jun 16 2021 (For the term of 1 July 2021 – 30 June 2023) Chair Wei Wang UCLA Email: weiwang@cs.ucla.edu Secretary-Treasurer Hui Xiong Rutgers University Email: xionghui@gmail.com Executive Committee Mohammed J. Zaki Rensselaer Polytechnic Institute Email: zaki@cs.rpi.edu Thorsten Joachims Cornell Continue Reading 2020 SIGKDD Rising Star Award Winners Mar 29 2021 Continue Reading 2021 SIGKDD Doctoral Dissertation Award: Call for Nominations Mar 29 2021 This annual award by ACM SIGKDD recognizes outstanding research by doctoral candidates in the field of data science, data mining and knowledge discovery. The KDD Doctoral Dissertation Award winner and up to two runners-up will be recognized at the KDD conference, and their dissertations will have Continue Reading 2020 SIGKDD Test of Time Award Winners Mar 15 2021 The SIGKDD Test of Time Award recognizes outstanding papers from past KDD Conferences beyond the last decade that have had an important impact on the data mining research community. Continue Reading 2020 SIGKDD Dissertation Award Winners Mar 15 2021 ACM SIGKDD dissertation awards recognize outstanding work done by graduate students in the areas of data science, machine learning and data mining. Continue Reading 2020 SIGKDD Service Award: Michael Zeller Mar 15 2021 Michael Zeller, head of artificial intelligence (AI) strategy and solutions at Temask, is honored for his contributions to the field through dedication to ACM SIGKDD as the volunteer treasurer and secretary of the executive committee. Zeller has served on the executive board for eight years, playing an instrumental role in planning multiple KDD conferences. With a special emphasis on applied AI, his mission as an executive committee member is to foster strong partnerships between research institutions and industry organizations as a key for the continued success of the KDD community. Continue Reading 2020 SIGKDD Innovation Award: Thorsten Joachims Mar 15 2021 Thorsten Joachims, professor of Computer Science and Information Science at Cornell University, is recognized for his research contributions in machine learning, including influential work studying human biases in information retrieval, support vector machines (SVM) and structured output prediction. Notably, Joachims pioneered methods for eliciting reliable preferences from implicit feedback, methods for unbiased learning-to-rank and ranking methods that provide fairness guarantees. The ACM SIGKDD Innovation Award is the highest honor for technical excellence in the field of knowledge discovery and data mining. It is conferred on an individual or group of collaborators whose outstanding technical innovations have greatly influenced the direction of research and development in the field. “I am greatly honored by this recognition from the KDD community,” said Joachims. “KDD is known for innovation — not only as an academic endeavor but also with an eye towards real-world impact and social good.” Continue Reading Call for Nominations: ACM SIGKDD 2021 Innovation, Service, and Rising Star Awards Mar 15 2021 ACM SIGKDD invites your nominations for its 2021 Innovation Award, Service Award, and Rising Star Award. ACM SIGKDD, ACM’s Special Interest Group on Knowledge Discovery and Data Mining (KDD), is the premier global professional organization for researchers and professionals dedicated to the Continue Reading SIGKDD Executive Committee Call for Nominations Oct 25 2020 Dear SIGKDD members, Hope everything is well during this extraordinary time. Time flies! The term of the current SIGKDD Executive Committee will end on June 30, 2021. According to the ACM rule, we need to prepare for the election early next year. The first step is to get a slate of capable Continue Reading The LinkedIn Fairness Toolkit Launched to Measure Fairness in Large-scale AI Apps Aug 28 2020 Read more at SD Times 123 Next Page Last Page Search KDD News Twitter Feed Follow Us on Twitter Popular Recent Call for Bids to Host KDD-2018 KDD Cup 2016 Call for Proposals Call for Bids to Host KDD-2019 SIGKDD Honors Career Achievements in Knowledge Discovery and Data Mining Aug 05 2021 2021 ACM SIGKDD Election Results Jun 16 2021 2021 SIGKDD Doctoral Dissertation Award: Call for Nominations Mar 29 2021"
