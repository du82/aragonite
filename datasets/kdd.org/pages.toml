["https://kdd.org/about"]
title = "About SIGKDD"
full_description = '''Our Mission SIGKDD's mission to provide the premier forum for advancement, education, and adoption of the "science" of knowledge discovery and data mining from all types of data stored in computers and networks of computers. What we Do SIGKDD promotes basic research and development in KDD, adoption of "standards" in the market in terms of terminology, evaluation, methodology and interdisciplinary education among KDD researchers, practitioners, and users. What You Get SIGKDD membership includes the chance to participate in shaping the Data Mining and Knowledge Discovery field through research meetings, innovation and service awards, and other SIGKDD activities. Membership The mission of KDD is to promote the rapid maturation of the field of knowledge discovery in data and data-mining.Membership benefits include: KDD Discounts You receive discounts on the annual KDD conference registration. KDD Partner Discounts You get discounts on KDD partner conferences, including the ASA Statistical Computing Section, Interface, SIGMOD and SIGART conferences. The Latest Information You will begin a subscription to the KDD newsletter SIGKDD: The community for data mining, data science and analytics. Join today! Web Form About ACM The Association for Computing Machinery (ACM) is widely recognized as the premier membership organization for computing professionals, delivering resources that advance computing as a science and profession; enabling professional development; and promoting policies and research that benefit society. Executive Committee Wei Wang SIGKDD Chair Professor of Computer ScienceUCLA Hui Xiong SIGKDD Secretary/Treasurer Distinguished ProfessorRutgers, The State University of New Jersey Johannes Gehrke Member of the Board Managing Director and Technical FellowMicrosoft Thorsten Joachims Member of the Board Professor of Computer ScienceCornell University Jian Pei Member of the Board Professor of Computer ScienceSimon Fraser University Cynthia Rud