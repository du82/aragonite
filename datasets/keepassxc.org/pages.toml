full_description = "KeePassXC 2.7.0 released By Jonathan White Posted on 21 March 2022, 22:00 in Releases Today, we are releasing KeePassXC 2.7.0. Closing 118 issues and merging in 149 pull requests, this release is one of our biggest and most important yet! We have incorporated several significant improvements including: Entry tagging Quick unlock using Windows Hello and macOS Touch ID Massive overhaul of Auto-Type Improvements to attachment handling Improvements to Secret Service integration (Linux) Migration of the crypto backend from libgcrypt to Botan Much, much more… Read more… KeePassXC 2.6.6 released By Jonathan White Posted on 11 June 2021, 22:40 in Releases Today we are releasing the sixth 2.6 maintenance updates, KeePassXC 2.6.6. This release quickly corrects a couple of bugs found in 2.6.5.Read more… KeePassXC 2.6.5 released By Jonathan White Posted on 7 June 2021, 22:00 in Releases Note: we do not recommend using this release as it contains a couple of bugs Today we are releasing the fifth 2.6 maintenance update, KeePassXC 2.6.5. This version brings numerous backports from the develop branch to bring some of our exciting new features into a stable release. Notable changes include showing the search bar even when hidden, showing a countdown when the clipboard contains data, retaining creation date when saving the database, and fixing numerous bugs. See more in the changelog after the break.Read more… KeePassXC 2.6.4 released By Janek Bevendorff Posted on 1 February 2021, 01:40 in Releases Today we are releasing the fourth 2.6 maintenance update, KeePassXC 2.6.4. This new version fixes various minor bugs, updates a vulnerable third-party dependency, and enables live theme switching. Whereas previously, the user had to restart KeePassXC in order to switch between light and dark mode, this can now be done at runtime without the need for a restart. On Windows and macOS, the application now also responds automatically to theme changes in the system, working much better with Big Sur’s “Auto” theme.Read more…"
