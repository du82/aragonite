["https://keepassxc.org/blog/2022-03-21-2.7.0-released"]
title = "KeePassXC 2.7.0 released – KeePassXC"
description = "KeePassXC Password Manager"
full_description = "KeePassXC 2.7.0 released By Jonathan White Posted on 21 March 2022, 22:00 in Releases Today, we are releasing KeePassXC 2.7.0. Closing 118 issues and merging in 149 pull requests, this release is one of our biggest and most important yet! We have incorporated several significant improvements including: Entry tagging Quick unlock using Windows Hello and macOS Touch ID Massive overhaul of Auto-Type Improvements to attachment handling Improvements to Secret Service integration (Linux) Migration of the crypto backend from libgcrypt to Botan Much, much more… Pictures are worth a thousand words, so here are some shots of the new features within 2.7.0. The first image shows the new Auto-Type selection dialog brimming with options. You can now easily search all open databases for an entry to type using the same powerful search syntax as in the main application. You can also type out TOTP codes and copy data to the clipboard from this dialog. We feel like this is a game changer to interacting with your database. Updated Auto-Type Selection Up next is the long-awaited implementation of entry tags. We added a quick selection panel to the bottom-left of the main view. When a tag is clicked, the entry list is filtered instantly to show entries that contain that tag. We also included some default searches for showing entries that are expired or have weak passwords. Tags are easily added when editing an entry with auto-completion enabled. This feature is going to see additional growth in upcoming releases. Database Tags We also took this opportunity to improve how you view entry history. We now show which fields changed between each line item, so you can easily revert a specific change. Compare Entry History Lastly, we added a new tab to the database reports that shows data used by the browser extension. You can very quickly see all entries with URLs and with custom settings for the browser extension. This report allows you to quickly hone in on entries with wrong URLs or misconfigured allow/deny settings. Browser Statistics Side note: The new release is the first to be built with the Microsoft toolchain instead of Msys2 on Windows. As a result, Windows users may need to install the Microsoft Visual C++ Redistributable if experiencing issues with missing DLLs. View the entire changelog on the 2.7.0 Release Page. The new release can be downloaded from our downloads page, our Ubuntu PPA, and Snapcraft. Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix and IRC in case you have any other issues with the new release (see Contact). Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
