full_description = "KeePassXC 2.3.4 released By Janek Bevendorff Posted on 23 August 2018, 21:32 in Releases Today we announce another 2.3 maintenance release with KeePassXC 2.3.4. This release fixes a crash while downloading website favicons and brings some minor improvements to the entry view, database merging, SSH agent functionality, and browser integration. With KeePassXC 2.3.4, we have also updated our PPA to ship a package for the upcoming Ubuntu 18.10 Cosmic Cuttlefish, whereas 17.10 Artful Aardvark has been discontinued. The new release can be downloaded from our downloads page, our Ubuntu PPA, and Snapcraft. Changelog Here’s the full changelog for KeePassXC 2.3.4: Show all URL schemes in entry view [#1768] Disable merge when database is locked [#1975] Fix intermittent crashes with favorite icon downloads [#1980] Provide potential crash warning to Qt 5.5.x users [#2211] Disable apply button when creating new entry/group to prevent data loss [#2204] Multiple SSH Agent fixes [#1981, #2117] Multiple Browser Integration enhancements [#1993, #2003, #2055, #2116, #2159, #2174, #2185] Fix browser proxy application not closing properly [#2142] Add real names and Patreon supporters to about dialog [#2214] Add settings button to toolbar, Donate button, and Report a Bug button to help menu [#2214] Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
