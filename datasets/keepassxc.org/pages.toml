["https://keepassxc.org/blog/2020-01-19-2.5.3-released"]
title = "KeePassXC 2.5.3 released – KeePassXC"
description = "KeePassXC Password Manager"
full_description = "KeePassXC 2.5.3 released By Janek Bevendorff Posted on 19 January 2020, 22:45 in Releases Today we are releasing KeePassXC 2.5.3, the third maintenance update for KeePassXC 2.5. The update adds support for the new Chromium-based Edge browser to KeePassXC-Browser and comes with a critical fix for a bug that may inadvertently scramble a database’s master key after removing a YubiKey from a KDBX 3.1 database. Additional changes include fixes for a number of application crashes, enhanced URL matching in KeePassXC-Browser, and other stability improvements. The new release can be downloaded from our downloads page, our Ubuntu PPA, and Snapcraft. Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix and IRC in case you have any other issues with the new release (see Contact). Changelog This is the full changelog for KeePassXC 2.5.3: Fixed Fix a possible database lockout when removing a YubiKey from a KDBX 3.1 database [#4147] Fix crash if Auto-Type is performed on a new entry [#4150] Fix crash when all entries are deleted from a group [#4156] Improve the reliability of clipboard clearing on Gnome [#4165] Do not check cmd:// URLs for valid URL syntax anymore [#4172] Prevent unnecessary merges for databases on network shares [#4153] Browser: Prevent native messaging proxy from blocking application shutdown [#4155] Browser: Improve website URL matching [#4134, #4177] Added Browser: Enable support for Chromium-based Edge Browser [#3359] Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
