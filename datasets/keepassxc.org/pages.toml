["https://keepassxc.org/docs/KeePassXC_GettingStarted.html"]
title = "KeePassXC: Getting Started Guide"
full_description = "KeePassXC is open-source software and may be available on other websites that are unaffiliated with Team KeePassXC. We strongly discourage downloading KeePassXC from third-party websites. KeePassXC stores a configuration file in ~/.cache to remember window position, recent files, and other local settings. If you mount this folder to a tmpdisk you will lose settings after reboot. You can enable double-click copying of entry username and password in the Application Security Settings. This is turned off by default starting with version 2.7.0. Keep this password for your database safe. Either memorize it or note it down somewhere. Losing the database password might result in permanent locking of your database and you will not be able to retrieve information stored in the database. On Windows, you will be prompted to authenticate to Windows Hello after unlocking your database with full credentials. This is required to setup Quick Unlock. If you cancel this prompt then Quick Unlock will not be enabled and your database will continue to unlock. Your computer time must be synchronized with an internet time source to generate valid TOTP codes, read more here. Storing TOTP codes in the same database as the password will eliminate the advantages of two-factor authentication. If you desire maximum security, we recommend keeping TOTP codes in a separate database that you only unlock when needed. You can disable the recycle bin within the Database Settings. If the recycle bin is disabled then deleted entries will be permanently removed from the database. You can safely store your database file in the cloud (OneDrive, Dropbox, Google Drive, Nextcloud, Syncthing, etc.). The database file is always fully encrypted; unencrypted data is never written to disk and is never accessible to your cloud storage provider. We recommend using a storage service that keeps automatic backups (version history) of your database file in the event of corruption or accidental deletion. For the most up-to-date troubleshooting advice on all platforms, please read our Troubleshooting Guide."
author = "KeePassXC Team"
