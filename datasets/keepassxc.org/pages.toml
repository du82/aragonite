full_description = "KeePassXC 2.2.2 released By Janek Bevendorff Posted on 22 October 2017, 03:00 in Releases Today we announce with KeePassXC 2.2.2 the second patch release for KeePassXC 2.2.x. This release contains mostly fixes for our AppImage and Snap packages, but als numerous other bug fixes.Read more… KeePassXC 2.2.1 released By TheZero Posted on 2 October 2017, 18:19 in Releases After a little delay, we are very proud to announce the release of KeePassXC 2.2.1. This release comes with lots of bug fixes for the previous major release. The team worked hard to fix any bugs reported by the community and managed to resolve 59 issues.Read more… KeePassXC 2.2.0 released By Janek Bevendorff Posted on 26 June 2017, 02:35 in Releases We are very excited to announce the release of KeePassXC 2.2.0! We have worked long and hard to bring you lots of new features and bug fixes in a well-rounded release. Among the top highlights of this release are YubiKey challenge-response support for strengthening your database encryption key a generator for time-based one-time passwords (TOTP) a diceware password generator a command line interface (CLI) CSV database import true portable mode with the config file residing in the same directory as the application automatic database locking when you lock your desktop session Read more… KeePassXC 2.1.4 released By Janek Bevendorff Posted on 11 April 2017, 16:20 in Releases Although we expected 2.1.3 to be the last release in the 2.1.x series, we have released a new 2.1.4 maintenance update today. The release fixes a compatibility warning with the chromeIPass browser plugin.Read more… Authenticode fundraising completed By Janek Bevendorff Posted on 15 March 2017, 01:33 in Fundraising The KeePassXC team wants to thank all who have contributed to our Authenticode certificate fundraising. With your support and additional generous funding from the Linux Fund (thank you especially, Ilan), we managed to collect all the money needed for purchasing a four-year Authenticode certificate.Read more…"
