["https://keepassxc.org/blog/2021-01-13-2.6.3-released"]
title = "KeePassXC 2.6.3 released – KeePassXC"
description = "KeePassXC Password Manager"
full_description = "KeePassXC 2.6.3 released By Jonathan White Posted on 13 January 2021, 12:00 in Releases Today we are releasing the third 2.6 maintenance update, KeePassXC 2.6.3. This update includes support for new KeePass2 features that increase the security of your database: XML Key File Version 2 and Argon2id. The new XML Key File makes it easier to print your key file for storage and recovery. This is now the default key file created by KeePass2. KeePassXC continues to generate hashed key files by default for the time being, though an XML key file can be generated by choosing the*.keyx file extension. The benefits of Argon2id are discussed here. Along with these improvements, this update includes better support for CSV import/export, protection from Windows 10 clipboard history, macOS Big Sur icon styling, and improvements to the user interface and user experience. The new release can be downloaded from our downloads page, our Ubuntu PPA, and Snapcraft. Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix and IRC in case you have any other issues with the new release (see Contact). 2.6.3 Changelog Added Support Argon2id KDF #5778 Support XMLv2 key files #5798 Changed Improve CSV Import/Export, include time fields and TOTP #5346 Support empty area dragging of the application window #5860 Display default Auto-Type sequence in preview pane #5654 Remove strict length limit on generated passwords #5748 Hide key file path by default when unlocking database #5779 Document browser extension use with Edge in managed mode #5692 Windows: Prevent clipboard history and cloud sync #5853 macOS: Update the application icon to Big Sur styling #5851 Fixed Re-select previously selected entry on database unlock #5559 Properly save special character choice in password generator #5610 Fix crash in browser integration with multiple similar entries #5653 Remove offset on username field in classic theme #5788 Ensure entry history is copied when drag/dropping entries and groups #5817 Close modal dialogs when database is locked #5820 Prevent crash when KeeShare modifies an entry that is currently being edited #5827 Improve preview of entry attributes #5834 Always activate/focus database open dialog preventing mistype #5878 Reports: fix calculation of average password length #5862 Linux: Delay startup on login to correct tray icon issues #5724 Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
