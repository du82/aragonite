full_description = "KeePassXC 2.7.9 released By Jonathan White Posted on 19 June 2024, 18:00 in Releases Today, we are releasing KeePassXC 2.7.9 with many bug fixes and enhancements. Highlights include improvements to CSV and Bitwarden importing, passkeys refinement, several UX issues, and improvement to using browser integration with the Snap distribution.Read more… KeePassXC 2.7.8 released By Jonathan White Posted on 6 May 2024, 22:45 in Releases Today, we are releasing KeePassXC 2.7.8 with many bug fixes and enhancements, particularly to our passkey support. We also fixed several crashes that were discovered in the previous release. Finally, this version introduces several quality of life improvements that were ported over from the development branch that we think you will enjoy. Let’s dive in!Read more… KeePassXC 2.7.7 released By Jonathan White Posted on 10 March 2024, 09:00 in Releases We’re thrilled to announce the release of KeePassXC version 2.7.7. This update brings several exciting features and enhancements that will improve your workflow and integration with modern authentication services. Let’s dive into the major highlights: Passkeys Support This release delivers the official implementation of Passkeys for KeePassXC! This feature is a year in the making and uses the existing browser integration service to both store and use Passkeys for authentication. A special thank you to Ortham for providing an extremely comprehensive standards, security, and privacy review of our implementation prior to release. If you haven’t heard of Passkeys yet, they are an alternative to passwords that are incredibly secure and privacy preserving. Read more about Passkeys and also read our documentation. Passkeys Report Read more… KeePassXC 2.7.6 released By Jonathan White Posted on 15 August 2023, 17:00 in Releases Today, we are releasing KeePassXC 2.7.6 with a few bug fixes and enhancements. This version fixes a crash on macOS that occurred on exit. We also improved the visual display when dragging entries to move/copy, Quick Unlock is now automatically activated when unlocking for Auto-Type or Browser access, and the Auto-Type button and shortcut key will be disabled when Auto-Type is turned off for the entry or group. New Drag/Drop Example Read more…"
