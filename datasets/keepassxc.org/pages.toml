full_description = "KeePassXC 2.7.6 released By Jonathan White Posted on 15 August 2023, 17:00 in Releases Today, we are releasing KeePassXC 2.7.6 with a few bug fixes and enhancements. This version fixes a crash on macOS that occurred on exit. We also improved the visual display when dragging entries to move/copy, Quick Unlock is now automatically activated when unlocking for Auto-Type or Browser access, and the Auto-Type button and shortcut key will be disabled when Auto-Type is turned off for the entry or group. New Drag/Drop Example Changelog You can view the entire list of changes on the 2.7.6 Release Page. Download The new release can be downloaded from our downloads page, the Microsoft Store, our Ubuntu PPA, and Flathub. Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
