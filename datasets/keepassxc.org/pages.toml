full_description = '''The Team The KeePassXC team is formed by droidmonkey phoerious hifi louib varjolintu Contact You can contact us via [matrix], a free chat protocol. We have two channels, one for user questions and one for development-related discussions: #keepassxc:mozilla.org Element.io web chat (user's channel) #keepassxc-dev:mozilla.org Element.io web chat (developer's channel) Please be patient when asking a question! You may not get an immediate answer, but someone will respond to you eventually. In case you prefer it old-school, we also have the two equivalent IRC channels #keepassxc and #keepassxc-dev on irc.libera.chat, which are synced with the [matrix] channels above. #keepassxc Libera web chat (user's channel) #keepassxc-dev Libera web chat (developer's channel) If you need to report a security issue, please send us a private (encrypted) message on [matrix] or email us. Please do not (!) send user questions, bug reports or support requests that way (that's what the public [matrix] and IRC channels and our GitHub issue tracker are for). Legal Info / Impressum Janek Bevendorff Friesstr. 1 99423 Weimar, Germany [email protected] No user questions via email, please! Legal or otherwise confidential correspondence only! Team email PGP key: 105D 8D57 BB97 46BD Please note: We are an international team who speak a few different languages, and we will use Google Translate if needed (mind your privacy!), but it's easiest for us to respond to English emails. Thank you! let team = $("#team"); $.get("https://api.github.com/orgs/keepassxreboot/public_members", (data) => { team.html('<div class="uk-margin-large uk-grid uk-grid-small uk-child-width-1-2@m uk-child-width-1-3@m" uk-grid></div>'); let row = team.find(".uk-grid:first-child"); data.forEach((value, index) => { row.html(row.html() + `<div> <div class="uk-card uk-card-default"> <div class="uk-card-body uk-padding-small"> <div class="uk-grid uk-grid-small uk-child-width-1-2" uk-grid> <div class="uk-text-center"> <img class="uk-border-circle" src="${value.avatar_url}" width="60" height="60" alt="${value.login}"> <div class="uk-text-small uk-text-bold uk-text-uppercase uk-margin-small"><a href="${value.html_url}" class="uk-text-muted">${value.login}</a></div> </div> <div> <a href="${value.html_url}" class="uk-button uk-button-primary uk-button-medium uk-width-1-1 uk-margin-small-bottom"><i class="fa-brands fa-github" aria-hidden="true"></i> GitHub</a> <a href="https://github.com/keepassxreboot/keepassxc/commits?author=${value.login}" class="uk-button uk-button-secondary uk-button-medium uk-width-1-1"><i class="fa-solid fa-code-pull-request"></i> Code</a> </div> </div> </div> </div> </div>`); }); });'''
