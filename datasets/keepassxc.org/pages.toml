title = "KeePassXC Blog – KeePassXC"
description = "KeePassXC Password Manager"
full_description = "KeePassXC 2.5.4 released By Janek Bevendorff Posted on 9 April 2020, 20:00 in Releases Today we are releasing KeePassXC 2.5.4, the fourth maintenance update for KeePassXC 2.5. The update primarily resolves a compatibility issue with macOS 10.15.4 and 10.14.6. The most recent macOS security patches changed the way code signatures are checked resulting in a KeePassXC crash at startup. We published a quick workaround at the end of last month, for which we had to sacrifice TouchID support in order to allow you guys to continue using KeePassXC. This update ships with a full resolution of the code signing issue and brings back TouchID.Read more… KeePassXC 2.5.3 released By Janek Bevendorff Posted on 19 January 2020, 22:45 in Releases Today we are releasing KeePassXC 2.5.3, the third maintenance update for KeePassXC 2.5. The update adds support for the new Chromium-based Edge browser to KeePassXC-Browser and comes with a critical fix for a bug that may inadvertently scramble a database’s master key after removing a YubiKey from a KDBX 3.1 database.Read more… KeePassXC 2.5.2 released By Jonathan White Posted on 4 January 2020, 17:00 in Releases Today we are releasing the second maintenance update for the 2.5 baseline, KeePassXC 2.5.2. This update comes with additional fixes to reported issues after our initial release. Thank you for your patience and detailed reports that allowed us to fix these problems. Overall this release brings significant stability and usability improvements to KeePassXC. Most notably are fixes to crashes when the database is stored in a cloud storage service and resolving site sub-domain matching for the browser extension.Read more… KeePassXC 2.5.1 released By Jonathan White Posted on 11 November 2019, 22:10 in Releases Today we are releasing the first maintenance update for the 2.5 baseline, KeePassXC 2.5.1. This update comes with fixes to reported issues after our initial release. Thank you for your patience and detailed reports that allowed us to fix these problems. Overall this release brings significant stability and usability improvements to KeePassXC. Most notably the file hash checking has been reduced to every 30 seconds to eliminate lag with large databases.Read more…"
