["https://keepassxc.org/blog/2019-03-19-2.4.0-released"]
title = "KeePassXC 2.4.0 released – KeePassXC"
description = "KeePassXC Password Manager"
full_description = "KeePassXC 2.4.0 released By Jonathan White Posted on 25 March 2019, 13:45 in Releases After two beta releases, today we are proud to release KeePassXC 2.4.0! With this release, we have streamlined our code, improved the user interface, and added several new and exciting features. We have merged a total of 116 pull requests that implemented 12 new features, resolved 28 bugs, and closed 73 issues. Among the highlights of this release are a new database creation wizard, advanced search, KeeShare database sharing and synchronization, update checks, OpenSSH for Windows support, and a QR Code generator for TOTP. Thanks to our active community, KeePassXC is now available in 40 languages! Help us translate on Transifex. The new release can be downloaded from our downloads page, our Ubuntu PPA, and Snapcraft. A special thanks to our Patreon donors and the excellent code contributions from ckieschnick and mstarke of HicknHack Software. Additionally, special thanks to adolfogc, mxk6n, kneitinger, brainplot, and the KeePassXC Team. A Few Technicalities With KeePassXC 2.4.0, we got rid of the EXE Windows installer in favor of an MSI installer. The new MSI installer is generally equivalent in functionality, though if you were using the EXE installer before, you need to manually uninstall KeePassXC before installing the update. Our macOS binaries now have a minimum requirement of macOS 10.12 (Sierra) instead of 10.10 (Yosemite) as before. This is due to a new Qt version which is required in order to provide you with support for the new Mojave dark theme. KeePassXC itself will continue to run on older systems, but would need to be recompiled for that specific macOS version from source. Changelog Here is the full changelog for KeePassXC 2.4.0: New Database Wizard [#1952] Advanced Search [#1797] Automatic update checker [#2648] KeeShare database synchronization [#2109, #1992, #2738, #2742, #2746, #2739] Improve favicon fetching; transition to Duck-Duck-Go [#2795, #2011, #2439] Remove KeePassHttp support [#1752] CLI: output info to stderr for easier scripting [#2558] CLI: Add –quiet option [#2507] CLI: Add create command [#2540] CLI: Add recursive listing of entries [#2345] CLI: Fix stdin/stdout encoding on Windows [#2425] SSH Agent: Support OpenSSH for Windows [#1994] macOS: TouchID Quick Unlock [#1851] macOS: Multiple improvements; include CLI in DMG [#2165, #2331, #2583] Linux: Prevent Klipper from storing secrets in clipboard [#1969] Linux: Use polling based file watching for NFS [#2171] Linux: Enable use of browser plugin in Snap build [#2802] TOTP QR Code Generator [#1167] High-DPI Scaling for 4k screens [#2404] Make keyboard shortcuts more consistent [#2431] Warn user if deleting referenced entries [#1744] Allow toolbar to be hidden and repositioned [#1819, #2357] Increase max allowed database timeout to 12 hours [#2173] Password generator uses existing password length by default [#2318] Improve alert message box button labels [#2376] Show message when a database merge makes no changes [#2551] Browser Integration Enhancements [#1497, #2253, #1904, #2232, #1850, #2218, #2391, #2396, #2542, #2622, #2637, #2790] Overall Code Improvements [#2316, #2284, #2351, #2402, #2410, #2419, #2422, #2443, #2491, #2506, #2610, #2667, #2709, #2731] Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
