full_description = "KeePassXC 2.3.4 released By Janek Bevendorff Posted on 23 August 2018, 21:32 in Releases Today we announce another 2.3 maintenance release with KeePassXC 2.3.4. This release fixes a crash while downloading website favicons and brings some minor improvements to the entry view, database merging, SSH agent functionality, and browser integration. With KeePassXC 2.3.4, we have also updated our PPA to ship a package for the upcoming Ubuntu 18.10 Cosmic Cuttlefish, whereas 17.10 Artful Aardvark has been discontinued.Read more… KeePassXC 2.3.3 released By Janek Bevendorff Posted on 9 May 2018, 20:30 in Releases Today we announce the third 2.3 maintenance release KeePassXC 2.3.3. This release fixes a crash that was introduced in KeePassXC 2.3.2. The crash occurred when browser integration via proxy was enabled and prevented the application from starting if the setting was enabled in a previous version.Read more… KeePassXC 2.3.2 released By Jonathan White Posted on 8 May 2018, 23:13 in Releases Today we announce the second 2.3 maintenance release KeePassXC 2.3.2. This release focuses on refining the favorite icon downloader, SSH Agent, and browser integration feature. A complimenting update to the browser plugin is also being released to increase reliability and usability.Read more… KeePassXC 2.3.1 released By Janek Bevendorff Posted on 7 March 2018, 00:46 in Releases A week has gone by since our last big feature release and today we announce the first 2.3 maintenance release KeePassXC 2.3.1. KeePassXC 2.3 came with a lot of new features and, not unexpectedly, also quite a few new bugs, which we address in this new release.Read more… KeePassXC 2.3.0 released By Janek Bevendorff Posted on 28 February 2018, 03:00 in Releases After a short beta phase, we are proud to release KeePassXC 2.3.0. With this release, we reach another major milestone on our journey to providing you with the best and most secure cross-platform password management tool. KeePassXC 2.3 comes with a lot of new features and bug fixes which our users have been waiting for long enough. Among the highlights of the release are KDBX 4.0, Argon2 as a new key derivation function, SSH agent integration, a new entry preview panel and an all-new browser plugin, called KeePassXC-Browser, which replaces the old KeePassHTTP-based plugins. Thanks to our active community, KeePassXC also received a great number of new and updated translations and is now available in 32 languages, with even more being under development on Transifex!Read more…"
