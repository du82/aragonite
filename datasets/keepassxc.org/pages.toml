["https://keepassxc.org/blog/2021-01-31-2.6.4-released"]
title = "KeePassXC 2.6.4 released – KeePassXC"
description = "KeePassXC Password Manager"
full_description = "KeePassXC 2.6.4 released By Janek Bevendorff Posted on 1 February 2021, 01:40 in Releases Today we are releasing the fourth 2.6 maintenance update, KeePassXC 2.6.4. This new version fixes various minor bugs, updates a vulnerable third-party dependency, and enables live theme switching. Whereas previously, the user had to restart KeePassXC in order to switch between light and dark mode, this can now be done at runtime without the need for a restart. On Windows and macOS, the application now also responds automatically to theme changes in the system, working much better with Big Sur’s “Auto” theme. The pre-built Windows and macOS binaries ship with an updated version of libgcrypt, (the third-party library we use for cryptographic primitives), which fixes a buffer overflow vulnerability. Since KeePassXC does not decrypt arbitrary untrusted data (TLS for fetching Favicons is not handled by libgcrypt), we believe the impact on our users to be low, but recommend upgrading ASAP nonetheless. AppImages for Linux ship with an older version of the library which was not affected. As an additional treat, KeePassXC 2.6.4 is the first release for which we provide native ARM64 builds for the new Apple Silicon M1 Macs. For the time being, the ARM64 build comes without support for signed KeeShare containers due to dependency incompatibilities. If this functionality is needed, use the Intel build instead (which works just as fine with Rosetta2). The new release can be downloaded from our downloads page, our Ubuntu PPA, and Snapcraft. Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix and IRC in case you have any other issues with the new release (see Contact). 2.6.4 Changelog Added Automatically adapt to light/dark system theme changes (Windows/macOS only) #6034 Changed Show window title as tooltip on system tray #5948 Compress Snap release as LZO for faster initial startup #5877 Password generator: Set maximum selectable password length to 999 #5937 Fixed Fix crash on app close when using SSH agent #5935 Fix KDF selection showing wrong item when using Argon2id #5923 Automatically close About dialog on database lock if it is still open #5947 Linux: Fix automatic launch at system startup with AppImages #5901 Linux: Fix click-to-move on empty area activating when using menus #5971 Linux: Try multiple times to show tray icon if tray is not ready yet #5948 macOS: Fix KeePassXC blocking clean shutdown #6002 Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
author = "KeePassXC Team"
year_published = 2021
year_updated = 2021
