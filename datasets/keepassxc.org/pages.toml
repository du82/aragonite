full_description = "KeePassXC 2.7.1 released By Janek Bevendorff Posted on 6 April 2022, 20:50 in Releases Today, we are releasing KeePassXC 2.7.1, the first maintenance update for the 2.7 stable series. The release fixes multiple issues with Auto-Type, performance problems with the legacy AES-KDF, and several other minor bugs. We also improved the entry preview panel layout and paved the way for first-class Flatpak support on Linux. Flatpak, thus far, has been a downstream third-party distribution, but with the new release, we upstreamed patches needed for building KeePassXC as a Flatpak, and it will eventually supersede Snap as our preferred Linux distribution channel. Our experience shows that Flatpak has been a more stable platform than Snap, which has had many deployment bugs over the years, so we decided to deprecate it in favour of Flatpak. If you are experiencing problems with the current Snap, we recommend you switch to one of our other two supported Linux packages or to Flatpak once we announce an official Flathub channel. Further improvements in this release are support for spaces in tag names and other tag editing improvements, as well as new entry expiration presets for 12 and 24 hours. Changelog You can view the entire list of changes on the 2.7.1 Release Page. Download The new release can be downloaded from our downloads page, the Microsoft Store, our Ubuntu PPA, and Snapcraft (Flatpak TBA). Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
