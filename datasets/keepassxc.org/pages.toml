["https://keepassxc.org/docs/KeePassXC_UserGuide.html"]
title = "KeePassXC: User Guide"
full_description = "You can enable double-click copying of entry username and password in the Application Security Settings. This is turned off by default starting with version 2.7.0. Usage: keepassxc.exe [options] [filename(s)] KeePassXC – cross-platform password manager Options: -?, -h, --help Displays help on commandline options. --help-all Displays help including Qt specific options. -v, --version Displays version information. --config <config> path to a custom config file --localconfig <localconfig> path to a custom local config file --lock lock all open databases --keyfile <keyfile> key file of the database --pw-stdin read password of the database from stdin --debug-info Displays debugging information. --allow-screencapture Allow screen recording and screenshots Arguments: filename(s) filenames of the password databases to open (*.kdbx) Keep this password for your database safe. Either memorize it or note it down somewhere. Losing the database password might result in permanent locking of your database and you will not be able to retrieve information stored in the database. On Windows, you will be prompted to authenticate to Windows Hello after unlocking your database with full credentials. This is required to setup Quick Unlock. If you cancel this prompt then Quick Unlock will not be enabled and your database will continue to unlock. Your computer time must be synchronized with an internet time source to generate valid TOTP codes, read more here. Storing TOTP codes in the same database as the password will eliminate the advantages of two-factor authentication. If you desire maximum security, we recommend keeping TOTP codes in a separate database that you only unlock when needed. You can disable the recycle bin within the Database Settings. If the recycle bin is disabled then deleted entries will be permanently removed from the database. When you try to open the attached file, KeePassXC extracts the attachment to a temporary file and opens it using the default application associated with the file type. After finishing viewing or editing the file, you can choose between importing or discarding the changes that you made to the temporary file. KeePassXC securely deletes the temporary file by overwriting it."
