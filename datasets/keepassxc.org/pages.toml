["https://keepassxc.org/blog/2017-10-25-ubuntu-ppa"]
title = "KeePassXC Ubuntu PPA Launched – KeePassXC"
description = "KeePassXC Password Manager"
full_description = "KeePassXC Ubuntu PPA Launched By Janek Bevendorff Posted on 25 October 2017, 14:51 in Packages With our AppImage and Snap release, KeePassXC runs on almost any desktop Linux platform today. While especially the AppImage is extremely versatile and portable, we fully understand if users prefer a package that integrates better with their desktop system. Many Linux distributions already ship KeePassXC as a native package, but the largest player, Ubuntu, is still left out in the rain. While a Debian package has been submitted, it is still hanging in the review queue and will possibly continue to do so for a while. Meanwhile to fill the gap, there were excellent third-party DEB builds by magkopian (thanks al lot!), but nothing official. This changes now. We are very excited to announce our own official Ubuntu PPA! We support all Ubuntu versions which still receive updates from Canonical. These are: Artful Aardvark (17.10) Zesty Zapus (17.04) Xenial Xerus (16.04 LTS) Trusty Tahr (14.04 LTS) To install the PPA, install the software-properties-common package and then run: 1add-apt-repository ppa:phoerious/keepassxc 2apt update 3apt install keepassxc From now on, you will always get the latest KeePassXC version directly through your package manager, whenever you do an apt upgrade. The source packages within the PPA are signed with our official release key. Please be aware that at the moment, YubiKeys don’t work with 14.04 Trusty Tahr, because of its outdated YubiKey libraries. We will address this issue soon by providing more recent versions of the required libraries through the Trusty PPA (the same which we are already bundling with our AppImage, which is also build on Trusty Tahr). Update: The issue has been resolved, YubiKeys now fully work on Trusty. Feedback Please report any bugs you encounter at our GitHub issue tracker. We are also available on Matrix for real-time feedback and discussions. See our contact page for further options."
