title = "Asiakaspalvelu | Kemi"
description = "040 680 3120, asiakaspalvelupisteestä saat neuvontaa ja tietoa kaupungin palveluista sekä apua sähköiseen asiointiin"
full_description = "AsiakaspalveluAsiakaspalvelupisteestä saat neuvontaa ja tietoa kaupungin palveluista sekä apua sähköiseen asiointiin. Kemin kaupungilla on kaksi asiakaspalvelupistettä, jotka sijaitsevat kaupungintalolla ja kulttuurikeskuksessa. Kemin kaupungintalon asiakaspalvelu palvelee arkisin kello 8-15.30, puhelinnumero 040 680 3120 sekä puhelinvaihde numerosta 016 259 111 kello 8-15.30. Kaupungintalon ala-aulan asiakaspalvelupisteen yhteydessä toimii pienimuotoinen matkailuneuvonta, josta saa paikallisia julkaisuja, esitteitä ja karttoja. Kulttuurikeskuksen aulassa sijaitsevassa toimipisteessä käyttömestarit hoitavat muun muassa kulttuurikeskuksen ja Pruntsin tilojen varausta ja vuokrausta järjestöille. Tämä asiakaspalvelupiste on avoinna maanantaista perjantaihin kello 8–21 sekä viikonloppuisin kello 10–15. Jos asiasi on kiireinen, soita ennakkoon, koska työntekijöillä on tehtäviä myös muualla talossa. Yhteystiedot löydät tältä sivulta. Kaupungin lähettämät laskut Laskun sisältöä koskevat kysymykset Jos sinulla on kysyttävää kaupungin lähettämän laskun sisällöstä, ole yhdessä laskuttajaan. Laskuttajan puhelinnumeron löydän laskun oikeasta yläkulmasta. Eräpäiväsiirrot ja maksusuunnitelmat Jos haluat pyytää laskuun maksuaikaa tai sopia maksusuunnitelmasta, voit tehdä sen ennen laskun eräpäivää. Pyynnön voit tehdä joko sähköpostilla tai puhelimitse. Tarvittavat tiedot eräpäiväsiirron tai maksusuunnitelman tekemiseen: laskun numero laskun saajan nimi ehdotus eräpäivästä tai maksusopimuksesta. Yhteystiedot: perinta@kemi.fi 040 751 3596, puhelinaika 9.30-11 040 512 1962, puhelinaika 9.30-11 Tästä linkistä pysäköintivirhemaksuja koskeviin ohjeisiin Maksumuistutukset ja perintä Eräpäivän jälkeen maksamatta oleva lasku siirretään Suomen Kuntaperintä Oy:lle perittäväksi. Kuntaperintä hoitaa perintää kokonaisuutena, maksumuistutuksen, vapaaehtoisen ja oikeudellisen perinnän sekä jälkiperinnän. Jos sinulla on kysyttävää tai haluat ehdottaa maksusopimusta perintään siirtyneestä laskusta, ole yhteydessä suoraan Kuntaperintään joko puhelimella, sähköpostilla tai verkkopalvelun avulla. Kuntaperinnän verkkopalvelusta voit tarkastella Kuntaperintään siirrettyä laskuasi, maksaa velan, ehdottaa maksusopimusta tai lähettää viestin Kuntaperinnälle. Verkkopalveluun kirjaudutaan pankkitunnuksilla. Suomen Kuntaperintä Oy:n asiakaspalveluPuhelin 020 6399 420, maanantaista perjantaihin kello 8-16Verkkopalvelu https://oma.kuntaperinta.fiSähköposti asta.perinta@kuntaperinta.fi Jaa: Kopioitu leikepöydälle"
