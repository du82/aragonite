["https://www.kemi.fi/asuminen-ja-ymparisto/kartat/historialliset-kartat"]
title = "Historialliset kartat | Kemi"
description = "Kemi kartalla Kemi paikkana esiintyy jo keskiaikaisissa kartoissa muodossa Chim. Varhaisissa kartoissa näkyvät jo tunnistettavat maa-alueet, vesistöt ja paikat. Kartat olivat hyvin värikkäitä ja sisälsivät …"
full_description = "Historialliset kartat Kemi kartalla Kemi paikkana esiintyy jo keskiaikaisissa kartoissa muodossa Chim. Varhaisissa kartoissa näkyvät jo tunnistettavat maa-alueet, vesistöt ja paikat. Kartat olivat hyvin värikkäitä ja sisälsivät kuvitteellisia asioita. Vanhimpia karttoja säilytetään kansallisarkistossa, ja niitä on saatavilla digitoituina myös netistä. Karttasuurennos: Carta Marina, Pohjoismaiden kartta. Kartan otsikon suomennos latinasta: Merikartta ja kuvaus pohjoisista maista sekä niissä olevista ihmeellisistä asioista, mitä suurimmalla huolellisuudella valmistettu Herran vuonna 1539. (Venetsia) Kun maanmittaustekniikka kehittyi ja kartoitukset laajenivat, karttojen tarkkuus parantui oleellisesti. Alapuoleisessa karttasuurennoksessa näkyvät jo kohtuullisen tarkasti Kemin edustan rannikon muodot. Karttasuurennos: Karta öfver Botten wiken. Klint, Gustaf af (1829) Kemi oli Ruotsin vallan aikana osa Korsholmin linnalääniä. Läänin raja oli samalla hiippakuntaraja. Kemin suurpitäjä on sittemmin jakautunut Kemin, Tervolan ja Simon pitäjiksi. Kemi kaupunki perustettiin vuonna 1869. Kaupunki kattoi aluksi nykyisen Sauvosaaren ja Selkäsaaren maa-alueet. Laajennettu ja nykyinen kunnanraja on vuodelta 1931. Salli markkinointievästeet nähdäksesi sisällön Maastokartat Maastokarttoja (aiemmin peruskartta 1:20 000) julkaisee Maanmittauslaitos säännöllisin väliajoin mittakaavaan 1:50 000. Kemistä varhaisin julkaisu on vuodelta 1936. Salli markkinointievästeet nähdäksesi sisällön Opaskartta Kemin ensimmäinen painettu opaskartta on vuodelta 1955. Uusin versio on Kemin perustamisen 150-vuotisjuhlavuonna 2019 painettu opaskartta, joka on myös digitaalisena Kemin karttapalvelussa. Kartat ovat omaa tuotantoa. Salli markkinointievästeet nähdäksesi sisällön Asemakaavakartat Ensimmäisen asemakaavan laati lääninarkkitehti Ludvig Isak Lindqvist vuonna 1866. Kaava oli luonteeltaan ajalle tyypillinen ruutukaava, jossa paloturvallisuunäkökulmat olivat keskiössä. Viimeisimmät asemakaavan tontit lunastettiin ja rakennettiin ensimmäisen maailmansodan päätyttyä, ja uutta asemakaavaa alettiin laatia. Lindqvistin asemakaava on kuvassa vasemmalla. Uuden asemakaavan laatija oli arkkitehti Otto-I. Meurman. Sauvosaaren jäljellä olevat alueet kaavoitettiin asuin-, teollisuus- ja varastotonteiksi. Kaava valmistui vuonna 1925 ja kaavalla liitettiin osa Peurasaaresta sekä Syväkangas kaupunkiin. Meurmanin laatimissa kaavoissa näkyvät 1900-luvun aatevirtaukset, ja ruutukaavoitus hylättiin Sauvosaarea lukuun ottamatta uusissa kaavoissa. Meurmanin asemakaava on kuvassa oikealla. Salli markkinointievästeet nähdäksesi sisällön Jaa: Kopioitu leikepöydälle"
