["https://www.kemi.fi/kaupunki-ja-hallinto/asiointi/ilmoita-vaarinkaytoksesta"]
title = "Ilmoita väärinkäytöksestä | Kemi"
description = "Kerro kaupungin toimintaa koskevasta väärinkäytösepäilystä Kemin kaupungin toimintaa ja palveluita tuotetaan julkisin verovaroin. Suhtaudumme vakavasti kaikkiin väärinkäytösepäilyihin. Ilmiantokanava edistää kaupungin toiminnan avoimuutta ja luotettavuutta. Toiminto …"
full_description = "Ilmoita väärinkäytöksestä Kerro kaupungin toimintaa koskevasta väärinkäytösepäilystä Kemin kaupungin toimintaa ja palveluita tuotetaan julkisin verovaroin. Suhtaudumme vakavasti kaikkiin väärinkäytösepäilyihin. Ilmiantokanava edistää kaupungin toiminnan avoimuutta ja luotettavuutta. Toiminto myös auttaa kehittämään kaupungin prosesseja ja estää mahdollisia vahinkoja. Väärinkäytös voi olla eriasteista: huolimattomuudesta tai osaamattomuudesta johtuvaa, tahallista tai jopa rikokseksi katsottavia tekoja tai laiminlyöntejä. Väärinkäytösepäily voi kohdistua yksittäiseen viranhaltijaan, työntekijään tai luottamushenkilöön tai esimerkiksi kaupungin palveluiden tuottamiseen, hankintoihin, sopimuksiin tai päätöksentekoon. Miten ilmoitus tehdään Ilmoitus tehdään nimettömänä alla olevan linkin kautta. Mitä yksityiskohtaisempi ilmoitus on, sitä paremmin väärinkäytösepäilyä voidaan tutkia. Kun olet tallentanut ilmoituksesi, järjestelmä luo sille automaattisesti yksilöidyn linkin, joka sinun tulee ottaa talteen, esim. kopioida linkkirivin päässä olevan painikkeen avulla. Linkin avulla voit seurata ilmoituksen käsittelyä ja vastata ilmoitukseen liittyvin lisätietopyyntöihin. Ilmoituksen ei voi enää palata, jos suljet ikkunan ennen linkin tallennusta! Kaupunki selvittää ilmoitusten perusteella mahdolliset väärinkäytökset, mikäli ilmoitukset osoittautuvat aiheellisiksi. Miten ilmoitukset käsitellään Ilmoituksia käsittelevät kaupunkitarkastaja ja kaupunginjuristi, jotka päättävät väärinkäytösepäilyjen tutkimisesta. Ilmoitus jätetään anonyymisti. Väärinkäytösepäilyjä seuraavat toimenpiteet vaihtelevat väärinkäytösepäilyn vakavuudesta riippuen. Väärinkäytösepäilyjä voidaan tutkia viranomaisten yhteistyönä tai ne voidaan siirtää poliisin tutkittavaksi. Ilmoitusjärjestelmää ei saa käyttää epäasiallisiin tarkoituksiin. Huomioithan että ilmoituksen jättäjä voi joutua perättömästä ilmoituksesta rikosoikeudelliseen vastuuseen. Poliisilla on mahdollisuus saada tietoonsa ilmoittajan teletunnistetiedot, vaikka ilmoitus olisikin jätetty anonyymisti. Tästä pääset tekemään väärinkäyttöilmoituksen Organisaatiossa havaitusta väärinkäytöksestä ilmoitus tehdään ensisijaisesti Kemin kaupungin sisäiseen ilmoituskanavaan. Osana oikeuskanslerin yleistä laillisuusvalvontaa oikeuskansleri kuitenkin valvoo, että toimivaltaiset viranomaiset täyttävät ilmoittajansuojelulain mukaiset velvollisuutensa. Ilmoitus on mahdollista tehdä tietyissä tapauksissa myös oikeuskanslerinviraston keskitettyyn ulkoiseen ilmoituskanavaan tai suoraan toimivaltaiselle viranomaiselle. Oikeuskanslerinvirasto siirtää keskitettyyn ulkoiseen ilmoituskanavaan tehdyt ilmoitukset toimivaltaiselle viranomaiselle, joka tutkii ilmoituksen ja ryhtyy tarpeellisiin toimenpiteisiin. Lue lisää oikeuskanslerinviraston keskitetystä ulkoisesta ilmoituskanavasta Jaa: Kopioitu leikepöydälle"
