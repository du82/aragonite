["https://www.kemi.fi/asuminen-ja-ymparisto/asuminen/palstaviljely"]
title = "Palstaviljely | Kemi"
description = "Palstaviljely on palkitseva harrastus ja sopii kaikille, joilla vain riittää aikaa palstan hoitoon. Kemin kaupunki kartoittaa palstaviljelyyn ja siirtolapuutarhaksi soveltuvia kohteita. Jos olet kiinnostunut, ota …"
full_description = "PalstaviljelyPalstaviljely on palkitseva harrastus ja sopii kaikille, joilla vain riittää aikaa palstan hoitoon. Kemin kaupunki kartoittaa palstaviljelyyn ja siirtolapuutarhaksi soveltuvia kohteita. Jos olet kiinnostunut, ota rohkeasti yhteyttä! Antoisinta on kasvattaa palstalla sellaisia herkkuja, joita ruokakaupasta tai torilta ei löydy. Ahkera viljelijä huomaa työn tuloksen myös säästönä ruokalaskussa. Nyt palstoja vuokraavat eniten pari-kolmekymppiset urbaanit uusviljelijät, jotka haluavat syödä omin käsin kasvatettua, luonnonmukaista lähiruokaa – ja juuri siitä palstaviljelyssä onkin kyse! Palstaviljelyalueet sijaitsevat Sotisaaressa ja Siikakankaalla. Siikakankaan aluetta hallinnoi ja palstojen varauksen hoitaa Meri-Lapin Nuoret työhön ry. Ympärivuotinen kaupunkiviljely ja lähiruoan tuottaminen Kemissä -hanke Viljelypalstojen varaus Sotisaaren uudelle palstaviljelyalueelle on käynnistynyt! Ympärivuotinen kaupunkiviljely –hanke innostaa kaupunkilaisia hyötyviljelyyn Kemiin perustettavalla uudella palstaviljelyalueella Kemin Sotisaaressa. Hanke järjestää palstaviljelijöille Kaupunkiviljelykoulu -päivän viljelykauden alussa ja toimii maan omistajan apuna palstojen varaustoiminnassa. Palstat ovat kooltaan 10 x 10 metriä. Palstat jaetaan varausjärjestyksessä ja palstan vuokra maksetaan maan omistajalle palstan jakotilaisuudessa kesäkuun alkupuolella. Palstojen jakotilaisuudesta tiedotetaan erikseen palstan varanneille. Perehdy viljelypalstan vuokrausehtoihin ja alueen käyttösääntöihin, ennen palstan varaamista. Sotisaaren palsta-alue on laitettu alulle yhteistyönä maan omistaja Britta Sotisaaren kanssa vuodelle 2021. Maan omistaja hallinnoi aluetta itse ja hoitaa vuokrauksen. Kartta Sotisaaren palstaviljelyalueesta SOTISAAREN PALSTAVILJELYN SÄÄNNÖT Nämä säännöt koskevat Sotisaaren palstaviljelyaluettaSijainti: Sotisaarentie 4894300 Kemi Vuokrattavan viljelypalstan koko 10 x 10 metriä (1 aari)Palsta-alue muokataan keväällä viljelykuntoon, kun routa on sulanut ja pelto kuivahtanut. Kevätmuokkauksen jälkeen palstat merkitään, jonka jälkeen järjestetään palstojen jakotilaisuus paikan päällä kesäkuun alkupuolella. Palstojen jakotilaisuudesta tiedotetaan erikseen palstan varaajille. Vuokrausperusteet Maksamalla viljelypalstasta vuotuisen (50 euroa) vuokran, vuokraaja saa vuokraoikeuden viljelypalstaan. Vuokra maksetaan käteisellä palstan jakotilaisuudessa. Vuokra-aika alkaa palstan jakotilaisuudesta keväällä ja päättyy syyskuun viimeinen päivä. Vuokraaja sitoutuu noudattamaan viljelypalsta-alueen käyttösääntöjä. Vuokraajan on poistettava kasvit ja viljelyvälineet palstalta välittömästi, kun vuokra-aika päättyy. Sääntöjen rikkomisesta ja vuokraajan epäsopivasta käytöksestä voi vuokranantaja päättää palstan vuokrauksen yksimielisesti. Viljelypalstamaksua ei tässä tapauksessa palauteta tai hyvitetä. Vuokranantaja voi laskuttaa täysimääräisenä siivouskustannukset (100 euroa), mikäli vuokraaja ei huolehdi palstan hoidosta ja siisteydestä sääntöjen mukaisesti. Viljelypalsta-alueen käyttösäännöt Palstaa saa käyttää ainoastaan yksivuotisten koriste- ja hyötykasvien viljelyyn. Palstaa on viljeltävä ja hoidettava koko viljelykauden. Viljelyssä ei saa käyttää kemiallisia kasvinsuojeluaineita. Ainoastaan luonnonmukaiset valmisteet ovat sallittuja. Maan kalkitus ja lannoitus on sallittua, mutta maa-ainesta tai säkkimultaa ei saa tuoda alueelle. Viljelyssä on sallittua käyttää harsokatteita ja orgaanisia katteita, mutta muovin käyttö on kielletty. Palstojen rajaaminen aidoilla ja lankuilla on kielletty. Kasvit on sijoitettava siten, että ne ovat hoidettavissa omalla palstalla ja niistä ei aiheudu haittaa toisille viljelijöille (kasvien leviämisen estäminen). Palstalle ei saa tehdä rakennelmia, esimerkiksi rakentaa kasvihuonetta, kompostia tai viljelylaatikoita. Alueella on varattu viljelijöille yhteinen levähdys- ja taukopaikka, jossa voi syödä eväitä ja istahtaa palstan hoitamisen lomassa. Omia puutarhavälineitä ja työkaluja voi säilyttää palstaviljelyalueen vieressä olevassa vanhassa hevostallissa. Palstojen hoito on sallittua päivittäin kello 6–21 välisenä aikana. Kastelu Maan omistaja huolehtii palstalle vesisäiliön, josta saa ottaa kasteluvettä omiin astioihin. Vettä ei saa johtaa palstalle pumpulla, eikä johtaa letkulla viljelypalstalle. Jokainen veden käyttäjä huolehtii vesisäiliön täyttämisestä kastelun jälkeen. Jätehuolto Vuokraaja huolehtii palstansa ja palstaviljelyalueen siisteydestä. Vuokraaja vie omat roskat pois omakustanteisesti. Kasvijätteet viedään niille varattuun paikkaan kompostoitavaksi. Alueella tai palstalla ei saa tehdä avotulta. Roskien polttaminen on ehdottomasti kielletty. Muuta Koirien tuonti viljelypalsta-alueelle on kielletty. Vuokranantaja ei vastaa kasveille tehdystä ilkivallasta tai palstan vuokraajan omaisuudelle tehdystä vahingosta. Jaa: Kopioitu leikepöydälle"
