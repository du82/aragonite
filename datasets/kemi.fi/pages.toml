full_description = "Tontit ja kiinteistöt Kaupungilla on monipuolinen tonttitarjonta omakotitalorakentamiseen ja yritystoimintaa varten. Omakotitontit Kemissä Vapaita omakotitontteja löytyy muun muassa Rovan ja Nauskan alueilta, mutta myös muista kaupunginosista. Vapaita tontteja voi katsoa kaupungin Karttapalvelusta. Karttapalvelussa on kaupungin omistamien vapaiden tonttien lisäksi yksityisten maanomistajien myytäväksi ilmoitettuja tontteja. Yksityiset maanomistajat voivat ilmoittaa tonttinsa myytäväksi Karttapalvelussa veloituksetta. Yritystontit Kemissä Vapaita yritystontteja on tarjolla muun muassa Kemintullissa, Karjalahdella ja Ajoksessa. Alueiden saavutettavuus ja logistinen sijainti ovat erinomaisia. Tontteja löytyy niin liike-, toimisto-, varasto- kuin teollisuusrakentamiseen. Osa tonteista on räätälöitävissä koon ja välirajojen suhteen yritysten tarpeiden mukaan sopivaksi. Siirry tästä Invest In Kemi -sivustolle Maankäyttöpalvelusta saat lisätietoa vapaista tonteista, tontin varaukseen liittyvistä asioista sekä oman tontin myytäväksi ilmoittamisesta. Tontinvarauslomakkeet omakotitalotontille ja elinkeinotontille. Jaa: Kopioitu leikepöydälle"
