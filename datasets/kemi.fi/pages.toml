full_description = "Monikulttuurikeskus MikseriSetlementti Toivolan Monikulttuurikeskus Mikseri on Kemissä toimiva matalan kynnyksen kohtaamispaikka. Mikserin tavoitteena on edistää hyvinvointia, elämänhallintaa ja osallisuutta Meri-Lapin alueella. Setlementti Toivolan Monikulttuurikeskus Mikseri on Kemissä toimiva matalan kynnyksen kohtaamispaikka. Mikserin tavoitteena on edistää hyvinvointia, elämänhallintaa ja osallisuutta Meri-Lapin alueella. Mikserin toiminta tähtää yhteenkuuluvuuden, yhteisöllisyyden ja sosiaalisten verkostojen vahvistamiseen sekä kotoutumisen tukemiseen. Monikulttuurikeskus tarjoaa matalan kynnyksen ohjaus- ja neuvontapalvelut ilman ajanvarausta liittyen kotoutumiseen, suomessa asumiseen ja elämiseen ja arjen ongelmatilanteiden ratkaisemiseen. Mikserissä on erilaisia ryhmätoimintoja, kuten käsityökerho, naisten ryhmä sekä tutustumista suomen kieleen. Mikseri järjestää myös tilaisuuksia ja tapahtumia, joista erikseen ilmoitetaan sosiaalisessa mediassa. Mikserin kotisivuilta löytyy myös Kotoudu kotona -opas, jossa on laajasti tietoa suomalaisesta yhteiskunnasta sekä Koko perhe kotoutuu-opas, joka sisältää tietoa ja motivointia kotoutumisen tueksi. Oppaista on useita kieliversioita. Oppaat ovat ensisijaisesti suunnattu maahanmuuttaneille, mutta oppaita voivat hyödyntää myös ammattilaiset oman työnsä tukena. Mikseriin voi tulla myös vapaaehtoiseksi, ota rohkeasti yhteyttä! Tarkemmat tiedot toiminnasta löytyvät kotisivuilta ja sosiaalisesta mediasta. Siirry tästä Mikserin kotisivuille Jaa: Kopioitu leikepöydälle"
