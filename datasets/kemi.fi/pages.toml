full_description = "Varautuminen Varautuminen vakaviin häiriötilanteisiin ja väestönsuojeluun Suomalainen tietoyhteiskunta on hyvin häiriöherkkä ja haavoittuva. Yhteiskuntamme haavoittuvuuden johdosta meidän kaikkien tulee varautua moninaisiin vakaviin häiriötilanteisiin ja jopa poikkeusoloihin, jotka äärimmillään voivat ilmetä aseellisena selkkauksena. Varautuminen häiriöiden aiheuttamiin ongelmiin tehdään ennakolta, jotta kriisitilanteessa voimme toimia mahdollisimman tehokkaasti ihmisten, omaisuuden ja toimintojen suojaamiseksi kaikilta niitä uhkaavilta vaaroilta. Mikäli varautumista vakaviin häiriötilanteisiin ja väestönsuojeluun ilmenee, viranomaiset tiedottavat hyvissä ajoin asiasta. Väestön varoittaminen Väestöä voidaan varoittaa vaaran uhatessa monin keinoin. Varoittamisen keinoja ovat muun muassa: Yleisradion ja paikallisradioiden välittämät vaaratiedotteet Televisiokanavien välittämät vaaratiedotteet ja teksti-TV:n sivu 112 Viranomaisen verkkosivut ja tiedotteet Väestöhälyttimillä annettavat äänimerkit ulkona liikkuvalle väestölle Yleinen vaaramerkki on yhden minuutin pituinen nouseva äänimerkki (7 sekuntia) ja laskeva äänimerkki (7 sekuntia) tai kuuluttamalla annettu varoitus. Vaara ohi -merkki on minuutin mittainen tasainen äänimerkki. Se ilmoittaa, että uhka tai vaara on ohi. Väestöhälyttimillä tehdään 7 sekunnin mittainen koesoitto joka kuun ensimmäisenä arkimaanantaina kello 12. Koesoitto ei aiheuta toimenpiteitä kuulijoille. Kuuluvuutta kysellään säännöllisesti kaupunkilaisilta. Erheellisesti väestöhälyttimellä annetusta äänimerkistä ei tiedoteta vaaratiedotteella. Teknisestä viasta tai muusta syystä väestön varoitusjärjestelmällä soitetun erheellisen äänimerkin jälkeen pelastusviranomainen tiedottaa erheellisestä äänimerkistä mahdollisimman pikaisesti alueen väestölle pelastustoimen mediatiedotteella. Jos kuulet yleisen vaaramerkin – toimi näin siirry sisälle sulje ovet, ikkunat, tuuletusaukot ja ilmanvaihto avaa radio ja odota rauhallisesti ohjeita vältä tarpeetonta soittoa 112 numeroon ettei linja ruuhkaannu pysy sisällä älä poistu alueelta, ettet joudu matkalla vaaraan tiedota vaarasta myös muita lähiseudun asukkaita Mikäli tilanne vaatii suojautumista kaasulta selvitä etukäteen huoltohenkilöstön kanssa, kuinka rakennuksen koneellinen ilmanvaihto hätätilanteessa pysäytetään ja kuka sen tekee. Ilmanvaihtolaitteiston hätäpysäytyskytkin on syytä merkitä selvästi. Kytkimen pitäisi sijaita sellaisessa paikassa, että asukas voi tulipalon tai vaarallisen aineen aiheuttamassa hätätilanteessa pysäyttää ilmanvaihdon. Lisätietoa Pelastustoimen sivuilta Omatoiminen varautuminen Omatoiminen varautuminen on osa yhteiskunnan kriisinkestävyyttä. Jokaisen tulee varautua itse erilaisiin häiriötilanteisiin, kuten sähkö- ja tietoliikennekatkoihin. Ihmisten omatoiminen varautuminen helpottaa viranomaisten työtä kriisin sattuessa, koska voimavarat eivät riitä kaikissa häiriötilanteissa kaikkiin avuntarvekohteisiin ja resursseja joudutaan silloin priorisoimaan eniten avun tarpeessa oleviin kohteisiin. Yksityisen henkilön kohdalla varautumista säätelee pelastuslaki. Pelastuslain mukainen omatoiminen varautuminen täydentää valmiuslain velvoitteita. Pelastuslain mukaan rakennuksen omistaja ja haltija on velvollinen ehkäisemään vaaratilanteiden syntymistä, varautumaan henkilöiden, omaisuuden ja ympäristön suojaamiseen vaaratilanteissa ja varautumaan sellaisiin pelastustoimenpiteisiin, joihin ne omatoimisesti kykenevät. Päivittäisiin ja poikkeuksellisiinkin vaaratilanteisiin varautuminen on luonnollista aloittaa jokaisen omista tiedoista ja taidoista sekä asuin- ja työympäristön turvallisuusjärjestelyistä. Kotivara Katsasta kaappiesi sisältö ja arvioi, montako päivää taloutesi selviää ilman kauppareissua. Yllättävien tilanteiden varalle on hyvä olla etukäteen mietitty toimintasuunnitelma. Kotivara tarkoittaa kykyä toimia poikkeustilanteessa. Kotivara on yhtä lailla yksinasuvan kuin perheen suunnitelma siitä, miten toimia esimerkiksi sairastumisen, onnettomuuden tai luonnonoikun sattuessa. Oman kotitalouden lisäksi myös yhteiskunta voi haavoittua hetkellisesti ja siten vaikuttaa arkeen. Kotivaralla tarkoitetaan ensisijaisesti ruokaa ja juotavaa, mutta myös muita päivittäistarvikkeita, kuten lääkkeitä, vessapaperia, lamppuja. Kotivara ei tarkoita erillistä elintarvikkeiden hätävarastoa, vaan tuotteita käytetään koko ajan ”parasta ennen” -muistisäännön mukaisesti. Idea on koota normaalia kulutusta suurempi mieleinen kotivara tuotteista ja tarvikkeista, joita käytetään muutenkin. Jos vedenjakelu keskeytyy tai vesijohtovesi saastuu, viranomaiset perustavat vedenjakelupisteitä tilanteen niin salliessa. Kotoa on hyvä löytyä kannellisia astioita veden säilyttämistä ja kuljettamista varten ja uhkatilanteen mukaan jo ennalta varastoiden. Astioiksi soveltuvat esimerkiksi puhtaat kannelliset ämpärit tai muoviset mehukanisterit tai kaupoista saatavat tähän tarkoitukseen tehdyt vesisäiliöt. Kotivara on myös tietojen ja taitojen hankkimista, opettelemista ja ylläpitämistä. Varautuminen erilaisiin häiriötilanteisiin on hyvää kansalaistaitoa, esimerkiksi alkusammutus- ja ensiaputaidot ovat hyödyllisiä taitoja jokaiselle. Sähkökatkoon varautuminen Viime vuosina poikkeukselliset sääolot ovat aiheuttaneet haasteellisia tilanteita niin yksityishenkilöille kuin viranomaisillekin. Kova tuuli, tulvivat vedet tai äärimmäiset liikenneolosuhteet ovat koetelleet ihmisten kykyä selviytyä arjen askareista. Venäjän hyökkäys Ukrainaan muutti radikaalilla tavalla uhkakuvia ja varautumistarpeita. Valmiuslaki edellyttää viranomaisilta varautumista edellä kerrotun kaltaisiin tilanteisiin. Varautumisella tarkoitetaan niitä toimenpiteitä, joilla pyritään turvaamaan yhteiskunnan ja yksilöiden toimintakyky kaikissa tilanteissa. Varautumisella pyritään ehkäisemään vaaratilanteita, huomioimaan normaaliolojen häiriötilanteet ja valmistelemaan toimenpiteet poikkeusolojen varalta. Todennäköisin häiriötilanne, joka kuntalaisen arkea merkittävällä tavalla vaikeuttaa, on laajamittainen ja pitkäkestoinen sähkökatko. Sähkönpuute tekee arjen yksinkertaisista asioista hyvin haasteellisia tai lähes mahdottomia. Kemin kaupunki ei tiiviin kaupunkimaisen rakenteen ansiosta kuitenkaan ole kovin herkkä luonnonilmiöiden aiheuttamille sähköverkon vaurioille. Suurin osa Kemin Energian sähköverkosta on jo tänä päivänä maakaapeloitu, joten se on kohtuullisen hyvin turvassa äärimmäisiltä sääilmiöiltä ja niiden vaikutuksilta. Jokaisen kuntalaisen tulisi hetkeksi pysähtyä miettimään kuinka omaa varautumistaan sähkökatkoihin voi parantaa jo varsin pienillä toimilla. Kotona olisi hyvä olla varastoituna esim. välttämättömiä ruokatarvikkeita, lääkkeitä, polttoaineita, pattereita, käteistä rahaa muutaman päivän tarpeeseen, sillä sähkökatkon sattuessa sähköisistä tietojärjestelmistä riippuvaiset kaupat ja huoltoasemat eivät kykene myymään tuotteitaan ja ne sulkevat ovensa lähes välittömästi sähkönsaannin katkettua. Näin varaudut pitkiin sähkökatkoihin -opas tässä linkissä Pelastustoimen sivuilla on runsaasti ohjeita monenlaiseen varautumiseen, lue lisää tästä linkistä. Tutustu etukäteen omatoimiseen varautumiseen myös 72 tuntia -sivustolla. Väestönsuojelu Väestönsuojelulla tarkoitetaan sellaisten humanitaaristen tehtävien suorittamista, joiden tarkoituksena on siviiliväestön suojelu vihollisuuksien ja onnettomuuksien vaaroja vastaan, väestön auttaminen selviytymään vihollisuuksien ja onnettomuuksien välittömiltä vaikutuksilta sekä välttämättömien edellytysten luominen eloonjäämiselle. Suomen viranomaiset ovat varautuneet väestön suojelemiseen kattavasti, ja maailmantilannetta ja sen kehitystä seurataan jatkuvasti. Viranomaiset myös harjoittelevat väestönsuojelua vuosittain. Suomi on hyvin varautunut. Varautuminen vakaviin häiriötilanteisiin sekä väestönsuojeluun tehdään yhdessä ja sen vastuut jakautuvat kansalaisille, kiinteistöjen omistajille, yrityksille ja laitoksille sekä valtion ja kunnan viranomaisille. Väestönsuojat Nykyaikainen väestönsuoja antaa käyttökuntoon laitettuna suojaa asevaikutuksilta, rakennussortumilta, ionisoivalta säteilyltä ja myrkyllisiltä aineilta. Oman väestönsuojan sijainti- tai olemassaolotieto löytyy isännöitsijältä tai taloyhtiön hallitukselta. Viranomaiset tiedottavat hyvissä ajoin mikäli tulee tarvetta ottaa väestönsuoja käyttöön. Kiinteistökohtaiset väestönsuojat eli talosuojat ovat Kemissä suojautumisen perusta. Kiinteistön pelastussuunnitelmassa tulee olla kerrottu, missä kiinteistön väestönsuoja sijaitsee tai mihin yhteiseen väestönsuojaan kiinteistö on liittynyt. Tarvittaessa asiaa voi selvittää rakennuslupa-asiakirjoista tai tiedustella palotarkastajalta. Omakotitaloalueilla ja maaseudulla ei väestönsuojia yleensä ole. Rakennuksessa sijaitsevan väestönsuojan kunto ja käyttövalmius ovat rakennuksen omistajan tai haltijan vastuulla. Suojan omistaja huolehtii siitä, että suoja laitteineen pysyy kunnossa ja että siellä on kunnon ylläpitämistä ja hätätilanteita varten tarpeelliset työkalut ja välineistöt. Jos väestönsuojaa käytetään muuhun tarkoitukseen, se on voitava kunnostaa väestönsuojakäyttöön 72 tunnissa. Väestönsuojeluvälineet ja väestönsuojalaitteet on voitava ottaa käyttöön saman ajan kuluessa. Pelastuslain mukaan väestönsuoja on rakennettava rakennustyön yhteydessä rakennuttajan kustannuksella rakennukseen, jonka kerrosala on vähintään 1 200 neliötä ja jossa asutaan tai työskennellään pysyvästi. Teollisuusrakentamisessa kerrosalan raja on 1 500 neliötä. Kemissä ei ole yleisiä kaikille avoimia väestönsuojia, kaupungista löytyy kuitenkin yli 20 000 paikkaa väestönsuojissa. Helpoiten oman väestönsuojan löytävät kerrostaloissa asuvat. Oman kiinteistökohtaisen väestönsuojan tiedot löytyvät kiinteistön pelastussuunnitelmasta. Pelastuslaki edellyttää, että kiinteistössä on väestönsuojan käyttöönottoon perehtynyt henkilö. Väestönsuojan käyttöönottoon tulisi olla suunnitelma esimerkiksi osana pelastussuunnitelmaa. Väestönsuojan kunnossapidosta vastaa kiinteistön omistaja. Väestönsuojan laitteet tulee tarkastaa ja huoltaa vähintään 10 vuoden välein. Rakennuksessa sijaitsevan väestönsuojan kunto ja käyttövalmius ovat rakennuksen omistajan tai haltijan vastuulla. Suojan omistaja huolehtii siitä, että suoja laitteineen pysyy kunnossa ja että siellä on kunnon ylläpitämistä ja hätätilanteita varten tarpeelliset työkalut ja välineistöt.Jos väestönsuojaa käytetään muuhun tarkoitukseen, se on voitava kunnostaa väestönsuojakäyttöön 72 tunnissa. Väestönsuojeluvälineet ja väestönsuojalaitteet on voitava ottaa käyttöön saman ajan kuluessa. Taloyhtiöiden kokouksissa on aika ajoin syytä ottaa asialistalle pelastussuunnitelmien päivittäminen, vastuuhenkilön nimeäminen ja kouluttaminen sekä väestösuojien varustuksen tarkastaminen. Omakotiasujilla ja pienissä taloyhtiöissä asuvien tulee suojausta vaativan tilanteen tullessa tulee mennä sisälle, sulkea ovet, ikkunat ja ilmanvaihto sekä avata radio ja kuunnella viranomaisten ohjeita. Käytännössä ja useissa tilanteissa tämä on riittävää. Ylimääräisiä väestönsuojiasuojia löytyy muun muassa kouluista, liikerakennuksista ja työpaikoilta. Pelastusviranomainen osoittaa uhka-analyysin perusteella kuntalaisille suojautumispaikat väestönsuojista tai vaihtoehtoisesti suorittaa evakuointeja uhkatilanteen mukaan. Pelastuslaitos voi myös tarvittaessa määrätä erilaisia tarpeisiin soveltuvia tiloja käytettäväksi suojatiloina kriisitilanteessa. Omaa varautumista ja suojautumista voi suunnitella jo etukäteen varautumalla rakentamaan tilapäissuojan. Tilapäissuojiksi soveltuvia tiloja ovat esim. maanalaiset huoneet, kellarit ja muut sopivat tilat. Tilojen käyttöä vaikeuttavat ulkoseinien ovet ja aukot, jotka on suojarakenteilla peitettävä. Hyviä suojarakenteita, suuren massansa vuoksi, ovat esim. hiekkasäkit ja muurauksella tehtävät rakenteet. Evakuointi Evakuoinnilla tarkoitetaan viranomaisten johdolla tapahtuvaa väestön tai sen osan siirtämistä pois vaaran uhkaamalta alueelta ja sijoittamista turvalliselle alueelle sekä väestön elinedellytysten ja yhteiskunnan tärkeiden toimintojen turvaamista. Suppeimmillaan evakuointi voi koskea esimerkiksi yhden talon asukkaiden ja laajimmillaan useiden kuntien tai vielä laajempien alueiden koko väestön siirtämistä pois vaaran uhkaamalta alueelta ja sijoittamista turvalliselle alueelle. Evakuoinnit suunnitellaan sekä normaali- että poikkeusoloja varten. Ihmisten vapaaehtoista siirtymistä ei lueta evakuointikäsitteen piiriin. Sen sijaan viranomaisten kehotuksesta tapahtuva omatoiminen siirtyminen kuuluu evakuointiin. Evakuoinnit eivät ole ensisijainen suojaamiskeino, vaan väestönsuojelun suunnittelussa lähtökohtana on väestön pysyminen vakinaisilla asuinsijoillaan ja vaarassa olevien suojaaminen ensisijassa väestönsuojiin. Evakuointi on paikalla suojautumista täydentävä ja eräissä tilanteissa vaihtoehtoinen menetelmä. Evakuointi normaalioloissa (onnettomuusevakuointi) Normaalioloissa voidaan joutua suorittamaan onnettomuusevakuointi. Tällöin varaudutaan viranomaisen päätöksen perusteella tulipalon, muun onnettomuuden tai muutoin evakuointia vaativan tilanteen vuoksi evakuoimaan rajoitettu määrä henkilöitä pois heidän vakituisista asuin- ja oleskelupaikoistaan. Evakuointi tapahtuu yleensä kunnan sisällä tukeutuen kunnan organisaatioihin. Evakuointi väestönsuojelutilanteissa Joskus voidaan joutua suorittamaan laajamittainen evakuointi, jolloin evakuoidaan koko kaupungin väestö tai väestöä useista kaupunginosista. Tällainen laajamittainen evakuointi voi tulla kyseeseen alueeseen kohdistuvan sotilaallisen voiman käytön tai sillä uhkaamisen seurauksena ja päätöksen kyseisestä evakuoinnista tekee valtioneuvosto. Puolustustilan voimassa ollessa evakuointipäätöksen voi tehdä myös aluevastuussa oleva sotilasviranomainen. Evakuointeja toimeenpantaessa perustetaan alueellisia evakuointien kokoontumispaikkoja kyytiä tarvitseville ja niiden sijainnista tiedotetaan tarvittaessa viestimien välityksellä. Ole hyvä ja hyväksy kaikki evästeet nä