["https://www.kemi.fi/asuminen-ja-ymparisto/rakentaminen-ja-ymparisto/kaavoitus"]
title = "Kaavoitus | Kemi"
description = "Kaavoituksella tarkoitetaan maankäytön suunnittelemista eri tarkoituksiin. Kaavoituksen tehtävänä on luoda edellytykset vetovoimaisen asuinympäristön ja elinkeinoelämän toimintaympäristön kehittämiselle. Maankäytön suunnittelun yleinen ohjaus perustuu maankäyttö- ja rakennuslakiin. …"
full_description = "KaavoitusKaavoituksella tarkoitetaan maankäytön suunnittelemista eri tarkoituksiin. Kaavoituksen tehtävänä on luoda edellytykset vetovoimaisen asuinympäristön ja elinkeinoelämän toimintaympäristön kehittämiselle. Kuva Kemin keskustasta lintuperspektiivistäKUVA: JUKKA VILEN Maankäytön suunnittelun yleinen ohjaus perustuu maankäyttö- ja rakennuslakiin. Valtioneuvoston laatimat valtakunnalliset alueidenkäyttötavoitteet (VAT) ohjaavat maankäytön suunnittelua. Maankäyttöön vaikutetaan myös esimerkiksi erilaisilla seutu- ja kuntastrategioilla, kunnan maapolitiikalla ja rakennusjärjestyksellä. Suunnittelun on tärkeää olla avointa ja kuntalaisilla on mahdollisuus vaikuttaa työn lopputulokseen. Suunnittelussa tulee huomioida myös kulttuuriympäristön- ja luonnonarvot. Kaavat Kaavoitusjärjestelmään sisältyy kolme eri kaavatasoa: maakuntakaava, yleiskaava ja asemakaava. Maakuntakaava Maakuntakaava on kartalla esitetty yleispiirteinen suunnitelma alueiden käytöstä maakunnassa tai sen osassa. Siinä kuvataan maakunnan alueiden käytön ja yhdyskuntarakenteen periaatteet sekä osoitetaan maakunnan kehittämisen kannalta tarpeellisia alueita. Kemin alueella on voimassa Länsi-Lapin maakuntakaava, jonka laatii Lapin liitto. Maakuntakaavalla ratkaistaan koko Länsi-Lapin yleispiirteiset kysymykset. Maakuntakaava ohjaa alempia kaavatasoja. Yleiskaava Yleiskaavassa osoitetaan alueiden käytön päämäärät kunnassa. Siinä määritetään kehityksen suuret linjat sekä kaava-alueen käyttö, esimerkiksi asuinalueiden, työpaikkojen ja liikenneväylien sijainti. Kemissä yleiskaava koostuu koko kaupungin alueen kattavista osayleiskaavoista. Kemin kaupunginhallitus vastaa yleiskaavan laatimisesta ja sen hyväksyy kaupunginvaltuusto. Yleiskaava ohjaa asemakaavaa. Asemakaava Asemakaava on yksityiskohtaisin kaavataso ja sillä määritellään alueen tuleva käyttö: mitä säilytetään, mitä saa rakentaa, mihin ja millä tavalla. Kaavassa osoitetaan esimerkiksi rakennusten sijainti, koko ja käyttötarkoitus. Asemakaavojen laatimisesta vastaa elinvoimalautakunta ja ne hyväksyy kaupunginvaltuusto. Jos kaava on vaikutuksiltaan vähäinen, kaavan voi hyväksyä elinvoimalautakunta. Asemakaavamuutoksen hakeminen Asemakaavan muutosta voi hakea tontin omistaja tai haltija. Ole yhteydessä kaupungin asemakaavoittajaan ennen hakemuksen jättämistä. Samalla voit tiedustella haettavan muutoksen kustannuksista ja aikataulusta sekä muista muutokseen liittyvistä asioista.Arvioimme tapauskohtaisesti, onko asemakaavan muuttaminen mahdollista ja tarkoituksenmukaista. Asemakaavan muutoksen laatimiskustannukset peritään hakijalta ja ne määräytyvät elinvoimalautakunnan hyväksymän taksan mukaisesti. Kaavamuutoksen käynnistämisestä tai hakemuksen hylkäämisestä päättää kaupunginhallitus.Hae kaavamuutosta valmiilla lomakkeella tai vapaamuotoisella hakemuksella, jossa on vastaavat tiedot kuin lomakkeessa. Toimita hakemus liitteineen Kemin kaupungin elinvoimatoimialan kirjaamoon osoitteeseen Valtakatu 26, 94100 Kemi tai sähköpostilla osoitteeseen elinvoima@kemi.fi . Kaavamuutoshakemus löytyy tästä linkistä Kaavoitustaksat löytyvät tämän linkin takaa Suunnittelun käynnistyessä kaavasta laaditaan osallistumis- ja arviointisuunnitelma (OAS), jossa kerrotaan kaavan osalliset, osallistumis- ja vuorovaikutusmenettelyt, tavoitteet sekä alustava aikataulu. Osallistumis- ja arviointisuunnitelma, kaavaluonnosmateriaali sekä kaavaehdotusmateriaali ovat vuorollaan nähtävillä 14-30 vuorokautta kaavan vaikutusten merkittävyydestä riippuen, minkä aikana kuntalaisilla on mahdollisuus esittää materiaaleista mielipiteensä joko suullisesti tai kirjallisesti (ehdotusta koskevat muistutukset aina kirjallisena). Nähtävilläoloista ilmoitetaan paikallisessa sanomalehdessä, kaupungin virallisella ilmoitustaululla sekä kotisivuilla. Kaava-aineistot ovat nähtävillä kaupungintalon 4. kerroksen ilmoitustaululla ja kaupungin internet-sivuilla osoitteessa: www.kemi.fi/asuminen-ja ymparisto/rakentaminen-ja-ymparisto/kaavoitus/vireilla/.Kirjalliset mielipiteet / muistutukset toimitetaan osoitteeseen:Kemin kaupunki, Elinvoimatoimiala / Maankäyttö, kaavoitus ja asumisen palvelut (4. kerros), Valtakatu 26, 94100 Kemi tai sähköpostitse: elinvoima@kemi.fi Jaa: Kopioitu leikepöydälle"
