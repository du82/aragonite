["https://www.kemi.fi/asuminen-ja-ymparisto/kadut-ja-liikenne"]
title = "Kadut ja liikenne"
description = "Kemi on väljästi rakennettu kaupunki. Kadut ovat leveät, pyöräteitä on paljon, hoidettuja puistoja on useita. Lenkkeilijät, lapset, koirat, tapahtumien järjestäjät – kaikille käyttäjille löytyy tilaa. …"
full_description = "Kadut ja liikenneKemi on väljästi rakennettu kaupunki. Kadut ovat leveät, pyöräteitä on paljon, hoidettuja puistoja on useita. Lenkkeilijät, lapset, koirat, tapahtumien järjestäjät – kaikille käyttäjille löytyy tilaa. Kemin rautatieasema Kemin rautatieasema sijaitsee keskustassa. Sen etäisyys Helsingin rautatieasemalta Haapamäen ja Oulun asemien kautta on 858 kilometriä. Sijainti pääradan varrella tarkoittaa vilkasta junaliikennettä. Asemalla pysähtyvät kaikki rataosan henkilöjunat. Kemi on tärkeä solmukohta. Rataosat Rovaniemelle sekä Tornioon ja edelleen Kolariin erkanevat hieman Kemin pohjoispuolella. Siellä erkanee pääradasta myös sivurata Outokummun Elijärven kaivokselle. Kemissä on runsaasti tavaraliikennettä. Rautatieasemalta johtavat sivuradat Stora Enson Veitsiluodon tehtaille ja Ajoksen satamaan sekä Metsä Groupin tehtaille. Asemarakennus on pystytetty Rautatiehallituksen arkkitehdin Bruno Granholmin piirustusten mukaan. Se valmistui vuonna 1903. Asema-alueella on kymmeniä vanhoja rakennuksia, joissa on paljon yritystoimintaa, kuten päivittäin avoinna olevat kahvila sekä putiikkihotelli. Kemi-Tornion lentoasema Lentoasema palvelee Etelä-Lappiin suuntaavia liikematkustajia sekä matkailijoita. Kemin ja Tornion alueen matkailukohteista monet sijaitsevatkin erinomaisten liikenneyhteyksien päässä lentoasemalta. Rajan läheisyys tuo matkustajia myös Ruotsista. Lentoasema sijaitsee viitisen kilometriä kaupungin keskustasta pohjoiseen. Asema on perustettu vuonna 1939. Siirry tästä Kemi-Tornion lentoaseman sivulle Jaa: Kopioitu leikepöydälle"
year_published = 2025
