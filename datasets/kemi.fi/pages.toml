["https://www.kemi.fi/blogi/kemissa-ei-taloutta-osata-hoitaa-siella-sita-rahaa-vasta-tuhlataankin-taman-vaitteen-kuulee-usein-onko-se-totta"]
title = "”Kemissä ei taloutta osata hoitaa, siellä sitä rahaa vasta tuhlataankin”, tämän väitteen kuulee usein. Onko se totta? | Kemi"
description = "Kemin taloustilanteeseen tuo oman erityishaasteensa Suomen valtio ja negatiivinen valtionosuus. Kaupunki joutuu maksamaan valtiolle reilut kaksi ja puoli miljoona euroa palveluista, joita sen tulee valtion määräyksestä tuottaa. Tilanne…"
full_description = "Kemin kaupunki19.12.2024”Kemissä ei taloutta osata hoitaa, siellä sitä rahaa vasta tuhlataankin”, tämän väitteen kuulee usein. Onko se totta? Suomen kuudenneksi pienimmät palvelutuotannon kustannukset Kemiä ei juuri tunneta tiukasta taloudenpidosta, siitä huolimatta Kemin palvelutuotannon nettokustannukset asukasta kohden ovat Suomen kuudenneksi pienimmät ja Lapin kunnista selvästi pienimmät. Asian selventämiseksi ja vertailun vuoksi todettakoon, että naapurimme Tornio käyttää taloutensa pyörittämiseen 260 euroa enemmän asukasta kohden, mikä tekee noin 5.5 miljoonaa euroa enemmän vuositasolla. Rovaniemellä puolestaan palvelutuotannon nettokustannukset ovat 412 euroa asukasta kohden suuremmat, mikä tekee vuositasolla jo 27 miljoonaa euroa enemmän riihikuivaa rahaa. Oulun kaupungin osalta palvelutuotannon nettokustannukset ovat 655 euroa kalliimmat asukasta kohden, mikä tekee jo huikeat 140 miljoona euroa suuremmat vuosittaiset kustannukset. Mikä selittää eroja kaupunkien välillä? Saneerausta ja tiukkaa taloudenpitoa Kemi on uudistunut ja käynyt viime vuosina läpi vaikean ja rankan kulukuurin sekä toteuttanut tiukkaa talouden hallintaa sote-uudistuksen jälkeen. On syytä huomata, että alhaiset toimintamenot on saavutettu laajasta ja kattavasta palveluvalikoimasta huolimatta. Kemi panostaa edelleen vahvasti asukkaidensa hyvinvointiin, erityisesti kulttuuriin ja vapaa-ajan palveluihin, joihin käytetään resursseja 14. eniten asukasta kohden koko Suomessa. Panos asukasta kohden on merkittävä ja sijoitus hieno Suomen 309 kunnan joukossa. Valtio vie Kemiltä miljoonia Kemin taloustilanteeseen tuo oman erityishaasteensa Suomen valtio ja negatiivinen valtionosuus. Kaupunki joutuu maksamaan valtiolle reilut kaksi ja puoli miljoona euroa palveluista, joita sen tulee valtion määräyksestä tuottaa. Tilanne on absurdi, suorastaan uskomaton, eikä ole millään tavalla oikeudenmukainen, etenkään kun lähimmät naapurimme saavat valtiolta miljoonia euroja palveluidensa rahoittamiseen. Valtion vahvasti hiekoittamasta ladusta huolimatta Kemi tekee myös vuonna 2024 ylijäämäisen tilinpäätöksen ja pienentää takavuosina syntynyttä velkataakkaansa."
