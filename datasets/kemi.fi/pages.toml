full_description = "Eläimet Hyötyeläinten pito kaupunkialueella edellyttää erilaisia lupia. Moni haluaisi kesäksi lampaita ja kanoja asemakaava-alueillekin, mutta paperityön määrä pelottaa. Eläinten pitoon liittyviä asioita käsittelevät ympäristöterveys-, ympäristönsuojelu- ja elintarvikevalvonta sekä eläintensuojeluviranomaiset. Kotieläimistä ei ilmoitusta tarvitse tehdä, mutta kanoista, lampaista, hevosista, lehmistä ja muista hyötyeläimiksi luettavista lajeista on viranomaisen lomake täytettävä. Mikäli eläimiä on suuri määrä tarvitaan lisäksi ainakin ympäristöluvat. Keveimmillään lupaviidakosta selviää pelkällä ilmoituksella terveysviranomaiselle. Kanoja hankkivan on rekisteröidyttävä siipikarjan pitäjäksi aluehallintovirastoon. Jos munia annetaan oman talouden ulkopuolelle, tulee kanalasta ottaa salmonellanäytteet säännöllisesti. Eläimiä hankkivan kannattaa esitellä suunnitelma naapureille ja hankkia etukäteen kirjallinen suostumus. Eläimistä ei saa aiheutua häiritsevää ääntelyä eikä hajuhaittoja. Jaa: Kopioitu leikepöydälle"
