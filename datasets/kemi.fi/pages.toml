full_description = "Joukkoliikenne Joukkoliikenteen järjestämisestä Kemin, Tornion, Keminmaan, Simon ja Tervolan alueilla vastaa Meri-Lapin joukkoliikenneyksikkö yhteistyössä kuntien ja liikenteenharjoittajien kanssa. Kemin kaupunkiliikenteen liikennöitsijä on Kemin Taksipalvelu Oy. Aikatauluja päivitetään yleensä keväisin ja syksyisin. Kemissä asiointilinja Onnikka on kaikille avointa joukkoliikennettä, jonka autot ovat erityisesti vammaisille ja vanhuksille soveltuvia. Onnikan liikennöitsijä on Kemin Taksipalvelu Oy. Aikataulut, reitit ja lipputaksat löytyvät täältä: Siirry tästä Meri-Lapin joukkoliikenteen sivuille Siirry tästä Kemin Taksipalvelun sivuille Siirry tästä Matkahuollon sivuille Asiointilinja Onnikka Ilmainen kaupunkiliikenne uusille kemiläisille Kemin kaupunki tarjoaa uusille asukkaille maksuttoman kaupunkiliikenteen muuttovuodeksi.Saadakseen edun uuden asukkaan on haettava matkakortti täyttämällä hakulomake netissä tai virka-aikana kaupungintalon asiakaspalvelussa. Hakija voi valita fyysisen muovikortin tai Kemi Cardin mobiilikortin. Hakemuksen liitteenä on toimitettava digi- ja väestötietoviraston todistus kuntaan muuttamisesta.Fyysinen kortti on haettava kaupungintalon asiakaspalvelupisteeltä, kortti on haettavissa noin viikon kuluessa hakemuksen saapumisesta. Mobiilikortti jaetaan jopa samana päivänä hakemuksen saapumisesta mikäli on toimitettu todistus kuntaan muuttamisesta ja hakijan puhelimessa on Cardu-sovelluksesta ladattu Kemi Card. Tästä matkakortin hakulomakkeeseen Jaa: Kopioitu leikepöydälle"
