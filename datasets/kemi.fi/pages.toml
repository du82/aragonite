["https://www.kemi.fi/asuminen-ja-ymparisto/asuminen/hulevesi"]
title = "Hulevesi | Kemi"
description = "Hulevesi on rakennetuilta alueilta poisjohdettavaa sade- ja sulamisvettä. Hulevesiä syntyy perustusvesistä ja pintavaluntana rakennusten katoilta, piha-alueilta, katualueilta ja puistoista. Hulevedet johdetaan maaperään imeyttämällä tai vesistöihin …"
full_description = "Hulevesi Hulevesi on rakennetuilta alueilta poisjohdettavaa sade- ja sulamisvettä. Hulevesiä syntyy perustusvesistä ja pintavaluntana rakennusten katoilta, piha-alueilta, katualueilta ja puistoista. Hulevedet johdetaan maaperään imeyttämällä tai vesistöihin putkiviemäreissä ja ojissa. Hulevesien hallinta on osa perusinfraa. Hulevesien hallinnan tarkoitus on estää vesien aiheuttamat haitat kiinteistöille ja ympäristölle. Hulevesijärjestelmiä ovat putkiviemärit, avo-ojat ja erilaiset imeytys- ja viivytysrakenteet. Kemin kaupunginvaltuusto on päättänyt 25.9.2017, että hulevesiasioiden hoito siirretään Kemin Vesi Oy:ltä Kemin kaupungille 1.1.2018 alkaen, ja että samalla otetaan käyttöön kunnan hulevesimaksu kunnan hulevesijärjestelmän rahoittamiseksi. Kaupunginvaltuusto on hyväksynyt kunnan hulevesimaksutaksan kokouksessaan 13.11.2017 Omakotitalot, paritalot ja vapaa-ajankiinteistöt Tontin pinta-ala neliömetriäalle 10001000 tai suurempi Hulevesimaksu euroa38 57 Muut kiinteistöt Tontin pinta-ala neliömetriäalle 2000alle 3000alle 4000alle 5000alle 6000alle 7000alle 8000alle 9000alle 10000alle 20000alle 30000yli 30000 Hulevesimaksu euroa7615222830438045653260868491210641216 Kunnan hulevesimaksulla katetaan kunnan hulevesijärjestelmästä kunnalle aiheutuneet kustannukset ja maksu peritään hulevesijärjestelmän vaikutusalueen kiinteistöjen omistajilta tai haltijoilta. Kunnan hulevesijärjestelmän vaikutusalueeksi on määritelty asemakaava-alueet, ja hulevesimaksu peritään hulevesijärjestelmän vaikutusalueella riippumatta kiinteistön konkreettisesta liittämisestä järjestelmään. Maksu on julkisoikeudellisena suoraan ulosottokelpoinen eikä siitä voi anoa vapautusta. Kunnan hulevesijärjestelmään kuuluvat kaikki sellaiset kunnan omistamat rakenteet, jotka on suunniteltu ja rakennettu palvelemaan hulevesien hallintaa, kuten esimerkiksi hulevesiviemärit, ojat ja hulevesialtaat. Hulevesimaksun määräytymisperusteena ovat tontin pinta-ala ja käyttötarkoitus. Hulevesimaksu peritään kerran vuodessa ja se on arvonlisäveroton maksu. Maksutuotot käytetään hulevesijärjestelmien kunnossapitoon ja rakentamiseen. Jaa: Kopioitu leikepöydälle"
