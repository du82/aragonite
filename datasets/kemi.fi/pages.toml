full_description = "Ympäristön- ja luonnonsuojeluYmpäristönsuojelun toiminta-ajatuksena on saavuttaa hyvä ympäristön tila, joka on terveellinen, turvallinen ja viihtyisä. Kukkiva keltakurjenmiekka Kiikelissä kesäkuun 2019 lopussa. KUVA: PENTTI KORPELA Ympäristönsuojelulain mukaiset viranomaistehtävät sisältävät ympäristölupien ja -ilmoitusten käsittelyn ja lupapäätökset sekä niihin kuuluvat viranomaistarkastukset sekä lupien ja ilmoitusten jatkuvan valvonnan. Ympäristönsuojelun visiona on, että Kemi on vetovoimainen, turvallinen, terveellinen ja viihtyisä kaupunki, jossa kaupunkia edistetään ympäristönsuojelun näkökulmasta. Tämä tarkoittaa sitä, että ekologia otetaan huomioon kaupunkisuunnittelussa jätteiden määrää pienennetään kaupunki toimii luonnon monimuotoisuuden säilyttämiseksi kaupunki turvaa terveellisen elinympäristön ympäristökasvatus on osa kaikkea kasvatusta Kemin kaupungin ympäristön tilasta tehdyt julkaisut löydät tästä linkistä. Jaa: Kopioitu leikepöydälle"
