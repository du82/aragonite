description = "Meri-Lapin ympäristöpalvelut vastaa tuotantoeläinten, hevosten ja lemmikkien eläinlääkäripäivystyksestä ja perusterveydenhuollosta myös Kemin kaupungin alueella. Pieneläinpotilaat hoidetaan ajanvarauksella. Kiireellisissä tapauksissa aika järjestetään samalle päivälle, muissa tapauksissa …"
full_description = "EläinlääkäritMeri-Lapin ympäristöpalvelut vastaa tuotantoeläinten, hevosten ja lemmikkien eläinlääkäripäivystyksestä ja perusterveydenhuollosta myös Kemin kaupungin alueella. Pieneläinpotilaat hoidetaan ajanvarauksella. Kiireellisissä tapauksissa aika järjestetään samalle päivälle, muissa tapauksissa niin pian kuin mahdollista. Potilaat pyritään hoitamaan arkisin virka-ajan puitteissa. Arkiajan ulkopuolella toimii päivystys kiireellisiä tapauksia varten. Puhelinaika Muina aikoina voi ottaa yhteyttä kiireellisissä asioissa. Jos ette heti tavoita eläinlääkäriä, jättäkää viesti puhelinvastaajaan, teille soitetaan takaisin.Eläinlääkäreiden puhelinnumeroihin ei tule lähettää tekstiviestejä, koska viestit eivät aina kulkeudu perille, jos puhelin on esimerkiksi kiinni tai liittymästä on soitonsiirto toiseen numeroon. Ääniviestejä voi jättää vastaajaan. Sairas- ja tilakäyntien tilaaminen, vastaanottoajan varaaminen ja puhelinneuvonta arkiaamuisin kello 8–9 eläinlääkärien matkapuhelinnumeroissa, jotka löytyvät sivun alaosan linkin takaa. Muutos maanantaista 28.2.2022 alkaen Meri-Lapin alueen kunnallinen eläinlääkintähuolto (Simo, Kemi, Tornio, Tervola, Keminmaa) ottaa käyttöön koko alueen yhteisen ajanvaraus- ja neuvontapuhelimen. Aiemmat ajanvarausnumerot poistuvat käytöstä. Nykyinen päivystysnumero 0600 19030 toimii maanantaista 28.2.2022 alkaen kaikkina viikonpäivinä vuorokauden ympäri, 24/7/365. Ensisijainen ajanvarausaika on edelleen arkiaamuisin kello 8–9. Päivystysaikana (muulloin kuin arkipäivisin kello 8-15) puhelut ovat maksullisia: kello 8–21 hinta on 2,54 euroa minuutiltakello 22–8 hinta on 5,11 euroa minuutilta. Päivystys Arkiajan ulkopuolella päivystää yksi alueen eläinlääkäreistä koko viiden kunnan muodostamalla päivystysalueella (Tornio, Tervola, Keminmaa, Simo, Kemi). Päivystys on tarkoitettu välitöntä hoitoa vaativia sairastapauksia varten. Puhelinneuvonta ja muut kiireettömät asiat, kuten pitkäaikaissairauksien hoito, keskitetään arkiaikaan. Puhelut ohjautuvat päivystävän eläinlääkärin puhelimeen soitonsiirrolla, joten tekstiviestit eivät siirry. Siirry Meri-Lapin ympäristöpalvelujen sivulle Jaa: Kopioitu leikepöydälle"
