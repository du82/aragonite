title = "Katujen ja yleisten alueiden kunnossapito | Kemi"
description = "Kadun kunnossapitoa on päällysteiden korjaaminen tai päällystäminen, lumen ja jään poistaminen, katujen tasaisena pitäminen, liukkauden torjuminen ja pölyntorjunta (hiekoitushiekan poisto ja sorateiden suolaus). Kadun kunnossapitoon …"
full_description = "Katujen ja yleisten alueiden kunnossapitoKadun kunnossapitoa on päällysteiden korjaaminen tai päällystäminen, lumen ja jään poistaminen, katujen tasaisena pitäminen, liukkauden torjuminen ja pölyntorjunta (hiekoitushiekan poisto ja sorateiden suolaus). Kadun kunnossapitoon kuuluvat ne toimenpiteet, joiden tarkoituksena on pitää katu liikenteen tarpeiden edellyttämässä tyydyttävässä kunnossa. Talvikunnossapitoa ohjaa erillinen katuluokitus, jonka perusteella määräytyy kadun kunnossapitotoimen alkamisaika ja sen kesto. Talvikunnossapito 2024-2025 Kiireettömiä ilmoituksia voi tehdä milloin tahansa käyttämällä asiakaspalautelomaketta Osallistu ja vaikuta -sivulla. Päivystysnumero käytössä talvikauden, lokakuulta huhtikuulle. Hiekoitusta Mansikkanokankadulla tammikuussa 2020. KUVA: NINA SUSI Yleisten alueiden tilapäinen käyttö Yleisten alueiden kuten puistojen, katujen tai niihin verrattavien alueiden tilapäinen sulkeminen tai tapahtumien järjestäminen edellyttää lupaa kunnan viranomaiselta. Voit hakea lupaa alapuoleisesta linkistä. Siirry tästä lomakkeisiin Kadut Kaupungin kunnossapitovastuulla olevan liikenneverkoston pituus on noin 215 kilometriä, joista 68 on kevyenliikenteen väyliä. Osa kaupungin verkostosta on Liikenneviraston hoidettavana. Katujen kunnossapitoon kuuluvat myös katualueilla olevien istutusten, kalusteiden, korokkeiden, suojakaiteiden, liikennemerkkien ja muiden vastaavien laitteiden kunnossapito sekä katuojien, sadevesikourujen ja -kaivojen avoinna pitäminen. Puistot Puistot, puistokadut ja viheralueet ovat olennainen osa Kemiä. Ne luovat viihtyisyyttä ja parantavat kemiläisten asumisen ja elämisen laatua. Kaupunki on panostanut kaupunkikuvan parantamiseen muun muassa pitämällä ranta-alueet yleisinä alueina, hoitamalla puistoja ja huolehtimalla viheralueiden riittävyydestä kaikissa kaupunginosissa. Kemissä on useita erilaisia puistoja. Yhteensä puistojen pinta-ala on 80 hehtaaria. Koirille on oma erillinen koirapuisto. Kaupungin puistoista ja viheralueita vastaa viheraluepalvelut. Venesatamat Kemissä on kuusi venesatamaa, joista neljä Sauvosaaressa, yksi Kuivanuorossa sekä yksi Paavonkarissa. Kemin kaupungin teknisen toimialan yhdyskuntatekniikka ylläpitää pienvenesatamien venesatamapalveluita. Keskustassa sijaitseva Ulenin venesatama on tarkoitettu ensisijaisesti purjeveneiden ja moottoripurjehtijoiden käyttöön. Moottoriveneiden sijoittamisesta sinne päätetään erikseen. Metsät Kaupunki huolehtii metsäomaisuudestaan ja suorittaa rakentamisen edellyttämät hakkuut ja raivaukset. Vastaamme myös ulkoilu- ja virkistysalueiden sekä metsäisten puistojen metsänhoitotöistä. Jaa: Kopioitu leikepöydälle"
