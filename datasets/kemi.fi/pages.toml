description = "Kemissä on tarjolla on runsaasti erilaisia asumisvaihtoehtoja – omistusasuntoja, vuokra-asuntoja ja asumisoikeusasuntoja eri puolilla kaupunkia niin kerros- kuin pientaloissakin. Kemissä on viihtyisä asumisympäristö, hyvät kouluttautumismahdollisuudet …"
full_description = "Asuminen Kemissä on tarjolla on runsaasti erilaisia asumisvaihtoehtoja – omistusasuntoja, vuokra-asuntoja ja asumisoikeusasuntoja eri puolilla kaupunkia niin kerros- kuin pientaloissakin. Kemissä on viihtyisä asumisympäristö, hyvät kouluttautumismahdollisuudet sekä monipuoliset kulttuuri-, harrastus- ja liikuntapalvelut. Kemi on vetovoimainen, turvallinen ja terveellinen Meri-Lapin keskus, joka järjestää laadukkaita palveluita asukkailleen. Rakentamisella pyritään luomaan edellytykset viihtyisälle asumiselle eri puolella kaupunkia. Jaa: Kopioitu leikepöydälle"
