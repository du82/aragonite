title = "Maahanmuuttajat | Kemi"
description = "Kemin kaupunki huolehtii peruspalvelujen soveltuvuudesta ja saatavuudesta kaikille kemiläisille. Maahanmuuttajille on tarjolla samat peruspalvelut kuin muillekin kuntalaisille. Maahanmuuttajille suunnattujen palveluiden tavoitteena on edistää kotoutumista, työllisyyttä, …"
full_description = "Maahanmuuttajat Kemin kaupunki huolehtii peruspalvelujen soveltuvuudesta ja saatavuudesta kaikille kemiläisille. Maahanmuuttajille on tarjolla samat peruspalvelut kuin muillekin kuntalaisille. Maahanmuuttajille suunnattujen palveluiden tavoitteena on edistää kotoutumista, työllisyyttä, osaamista, työelämävalmiuksia, kielitaitoa, yhdenvertaisuutta, hyvinvointia sekä osallisuutta yhteiskuntaan. Autamme arkielämään liittyvissä tilanteissa ja ohjaamme tarpeen mukaisten palveluiden piiriin. Maahanmuuttopalvelut vastaavat lisäksi kunnan maahanmuuttotyön koordinoinnista, kehittämisestä sekä suunnittelusta. Meri-Lapin kotoutumisohjelmaan pääset tästä Maahanmuuttopalvelut Kemi kaupungin maahanmuuttopalvelut tuottavat kotoutumislain mukaisia palveluita maahan muuttaneille kemiläisille. Maahanmuuttopalveluiden asiakkuudessa voi olla enintään kolme vuotta siitä, kun maahanmuuttaja on saanut ensimmäisen oleskeluluvan tai kotikuntamerkinnän. Maahanmuuttopalveluiden asiakkaita ovat kiintiöpakolaiset turvapaikanhakijat, joilla on oleskelulupa ja kotikunta Kemissä tilapäisen suojelun perusteella oleskeluluvan saaneet, joiden kotikunta on Kemi kansainvälistä suojelua saaneiden Kemissä asuvat perheenjäsenet työvoiman ulkopuolella olevat maahan muuttaneet, joilla on oikeus kotoutumislain mukaisiin palveluihin. Maahanmuuttopalvelut antavat alkuvaiheen ohjausta ja neuvontaa kotoutumista edistävistä toimenpiteistä ja palveluista. Laadimme työvoiman ulkopuolella oleville asiakkaille osaamisen ja kotoutumisen palvelutarpeen arvioinnin ja tarvittaessa kotoutumissuunnitelman. Maahanmuuttopalveluihin voi ottaa yhteyttä puhelimitse tai sähköpostilla. Toimistolla palvelemme vain ajanvarauksella. Palvelu on luottamuksellista ja maksutonta. Käytämme tulkkia tarvittaessa. Lue myös Kivalo-opisto Monikulttuurisuuskeskus Mikseri International Pointti Työllisyyspalvelut Jaa: Kopioitu leikepöydälle"
