full_description = "Karttapalvelu Kartta-aineistot Digitaalinen kartta-aineisto kattaa koko kaupungin alueen. Aineistoa on saatavissa useissa eri rasteri- ja vektoriformaateissa. Numeerisia aineistoja voi tilata maankäyttöpalvelusta. Kartta-aineistojen toimitusaika on noin 3–5 työpäivää. Aineistosta peritään aineistomaksu ja työaikakorvaus. Kemin karttapalvelu Numeerisessa muodossa on saatavana kantakartta opaskartta virastokartta asemakaavakartta yleiskaavakartta Kartta-aineistoja on saatavana myös Maanmittauslaitoksen latauspalvelusta. Siirry tästä Maanmittauslaitoksen sivuille Karttapalvelut rakentajille Rakennuksen suunnittelua varten asiakkaalle lähetetään tilauksesta otteet pohjakartasta ja asemakaavakartasta kaavamääräyksineen. Rakennusvalvonta tilaa tarvittaessa viralliset karttaotteet rakentamislupia varten asiakkaan asemapiirroksen pohjalta. Osoitenumerot Maankäyttöpalvelut vastaa kaupungin osoitenumeroinnista. Asemakaava-alueen kadut on numeroitu siten, että numeron kasvusuuntaan nähden parilliset numerot ovat vasemmalla ja parittomat oikealla puolella katua. Asemakaava-alueen ulkopuolella on voimassa haja-asutusalueiden osoitetietojärjestelmä. Kiinteistön tai rakennuksen osoitenumero tarkoittaa sen sijaintia kymmenissä metreissä tien alkupisteestä. Esimerkiksi jos rakennuksen osoitenumero on 34, sijaitsee rakennus noin 340 metriä tien alkupisteestä. Mikäli osoitenumerointia joudutaan muuttamaan esimerkiksi asemakaavan muutoksen yhteydessä, ilmoitetaan uusi osoitenumero kyseisen rakennuksen asukkaille. Kaupunki toimittaa tiedon muuttuneesta osoitenumerosta Digi- ja väestötietovirastolle. Maankäyttöpalvelun toimesta tehty osoitteenmuutos ei muuta osoitetta sellaisissa rekistereissä, joita ei päivitetä automaattisesti väestörekisterin tiedoilla Jaa: Kopioitu leikepöydälle"
