title = "Hej | Kenneth Auchenberg"
full_description = "I'm a partner at AlleyCorp, a New York-based venture capital firm, where I focus on AI, developer tools, and infrastructure. Before stepping into venture capital, I spent two decades building products and leading engineering teams. As an angel investor, I help and support founders building for developers. My journey brought me to the US to work on developer tools at Microsoft, where I was a part of the early Visual Studio Code team. Later, at Stripe, I led the work on our developer platform and platform for extensibility. I was born and raised in Copenhagen, Denmark, where I co-founded the technology ColdFront conference, the hacker café Prototype, and was a part of the Danish startups Podio and ZYB, both of which were acquired, by Citrix and Vodafone, respectively."
