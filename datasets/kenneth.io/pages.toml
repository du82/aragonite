["https://kenneth.io/post/rebooting-prototype-our-hacker-cafe-in-copenhagen"]
title = "Rebooting Prototype, our hacker-cafe in Copenhagen | Kenneth Auchenberg"
full_description = "Prototype started when Jacob, back in April 2014, asked if I was interested sharing an office. He had gotten the opportunity to take over the coffee shop, Min Nye Kaffebar, and convert it into an office. Without much consideration I immediately said yes, as I had been looking for an office/hackerlab, to run experiments like Helpmate.Booting PrototypeWithin a week we were a bunch of great people ready to share an office, in a former coffee shop, in Vesterbro with no additional plan.From there we started iterating, and step by step, we converted this former coffee shop into a little community of coders, designers, and hackers. We decided on the name Prototype, found a fitting domain, created a visual identity (great work Tony ) and we started hanging out in our space.The concept of Prototype was from the beginning been a bit in flux. Is it a coffee shop? Is it an office? The short answer it’s both. All of us liked to work out of coffee shops, but we were tired of places noisy places with no power outlets and crappy wifi, so with Prototype we had the opportunity to create the ideal space for us.We keept the original interior, as we wanted to keep the cafe vibe. We started filling the fridge with drinks, snacks and beers, and installed a bit of tech, so we could show presentations and listen to music.Building a micro-communityDuring the past year we have had many guests stopping by, including many former customers who thought it still was a regular coffee shop. We have been hosting events like How To Build A Startup, Let’s build Prototypes at Trailerpark Festival and many pitch/hack nights.We have been the temporally home of a few startups, like Peakon, Haxi, Champion, AddThisEvent, and ERNIT.We have thrown a few parties (sorry neighbors), and most importantly we have been the home to brilliant minds from all around the world, who on and off, have been a part of little micro community.I think micro communities like Prototype are important, as they create the foundation where like-minded people come, think and build together.We need more places like Prototype - all over the world. .rsme-embed .rsme-d-none { display: none; } .rsme-embed .twitter-tweet { margin: 0 !important; } .rsme-embed blockquote { margin: 0 !important; padding: 0 !important; } .rsme-embed.rsme-facebook-embed .fb-post iframe { width: 100% !important; } .rsme-embed.rsme-facebook-embed .fb-post span { width: 100% !important; } .rsme-embed .rsme-d-none { display: none; } .rsme-embed .twitter-tweet { margin: 0 !important; } .rsme-embed blockquote { margin: 0 !important; padding: 0 !important; } .rsme-embed.rsme-facebook-embed .fb-post iframe { width: 100% !important; } .rsme-embed.rsme-facebook-embed .fb-post span { width: 100% !important; } .rsme-spinner { border: 3px solid rgba(0,0,0,0.75); border-right-color: transparent; border-radius: 50%; animation: rsme-spin 1s linear infinite; } @keyframes rsme-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } View post on Instagram .rsme-embed .rsme-d-none { display: none; } .rsme-embed .twitter-tweet { margin: 0 !important; } .rsme-embed blockquote { margin: 0 !important; padding: 0 !important; } .rsme-embed.rsme-facebook-embed .fb-post iframe { width: 100% !important; } .rsme-embed.rsme-facebook-embed .fb-post span { width: 100% !important; } .rsme-embed .rsme-d-none { display: none; } .rsme-embed .twitter-tweet { margin: 0 !important; } .rsme-embed blockquote { margin: 0 !important; padding: 0 !important; } .rsme-embed.rsme-facebook-embed .fb-post iframe { width: 100% !important; } .rsme-embed.rsme-facebook-embed .fb-post span { width: 100% !important; } .rsme-spinner { border: 3px solid rgba(0,0,0,0.75); border-right-color: transparent; border-radius: 50%; animation: rsme-spin 1s linear infinite; } @keyframes rsme-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } View post on Instagram .rsme-embed .rsme-d-none { display: none; } .rsme-embed .twitte