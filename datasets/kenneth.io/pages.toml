full_description = "Some days ago at #demodag, I launched Playify, which is a new web application that helps your migrate your iTunes music to Spotify.This first version is quite basic, it allows you to upload your iTunes Library file, the tool then parses the file, and asks Spotify which albums that is avaliable. The results its presented as a nice sortable list (with covers from Last.fm).Playify might help you getting started with Spotify or even help you to discover some of your favorite music you had forgotten. Personally I found a lot of my favorite music this way, simply because I hadn't thought about searching for it on Spotify.Try it out at http://playify.kenneth.io, and let me know what works, and what that doesn't!"
