["https://kenneth.io/post/stepping-down-as-copenhagenjs-organizer"]
title = "Stepping down as CopenhagenJS organizer | Kenneth Auchenberg"
full_description = '''Back in December I decided to quit my job and take a leap into unexplored territories. I ended up packing a backpack to travel Asia, which has been an amazing experience, but it also meant that I haven’t been able to help organizing CopenhagenJS, as I simply haven’t been around.Now I’m back in Copenhagen, and been putting a bit of thought into how I should be spending my time going forward, and I reached the conclusion that it’s time to step down as CopenhagenJS organizer and pass the baton on.4 years of fun years with CopenhagenJSCopenhagenJS came to life in the summer of 2011, after I one afternoon randomly tweeted this:<figure> <blockquote class="twitter-tweet" lang="en"><p lang="en" dir="ltr">Thinking about starting a new JavaScript group in Copenhagen, to bring some life to the community. Anyone up for joining <a href="https://twitter.com/copenhagenjs">@copenhagenjs</a>?</p>— Kenneth Auchenberg (@auchenberg) <a href="https://twitter.com/auchenberg/status/92983442437963776">July 18, 2011</a></blockquote> <script async src="//platform.twitter.com/widgets.js" charset="utf-8"></script> </figure>I tweeted this without knowing much about the existing front-end/javascript community. Soon after Bjorn asked if I was interested in taking over the existing Oresund JavaScript meetup group (which I never attended) and Morgan Roderick also stepped in and bought the copenhagenjs.dk domain.<figure> <blockquote class="twitter-tweet" lang="en"><p lang="en" dir="ltr"><a href="https://twitter.com/auchenberg">@auchenberg</a> <a href="https://twitter.com/copenhagenjs">@copenhagenjs</a> Up for taking over the existing one?</p>— Bobcoin Söderqvist (@bjorn_js) <a href="https://twitter.com/bjorn_js/status/92985688257073152">July 18, 2011</a></blockquote> <script async src="//platform.twitter.com/widgets.js" charset="utf-8"></script> </figure>In a matter of just a few days we had managed to join forces, we merged the existing front-end meetups into CopenhagenJS, build a website, designed a logo, and on the 21 July 2011 we announced the first meetup, where the original Podio offices were literally stuffed with wonderful people.With CopenhagenJS I wanted to create a forum where we could discuss our problems, share ideas and most importantly get inspired. The name has been a bit off from the beginning, as my intention was to cover front-end in broad, and not just JavaScript, but we followed a trend, and got a logo (almost) for free. We have meet consistently every third Thursday every month for more than 4 years, and have managed to build a community around front-end and JavaScript from the ground up.Over the years our community has grown, and we now have more than 1.100 followers, and many wonderful people joining the meetups. When Bjorn stepped down as organizer, Peter Müller stepped up, who for the past years, has been driving the community together with me.Our community ins't the biggest community in the world, but we had a fantastic range of speakers. We have had international international names like Douglas Crockford and Seb Lee Delisle stopping by. We have done special events with companies like Adobe, Microsoft and GitHub, and we been hosted by many great companies, who I’m thankful for their investments into the local community.Meetup evolved into ColdFront ConferenceTwo years ago I started ColdFront Conference, which was an idea that came up among us organizers, as we wanted to take the local community to an international level. I ended up being the one executing on the idea, and just a few weeks ago, we ran the second ColdFront, and the feedback been incredible. But organizing a conference is an incredible time consuming thing, and combining it with a monthly meetup, is a bit too time consuming.So now that I’m back in Copenhagen I’ve decided to take a step back, and look at all the many projects I’m involved with, and revise how my commitment should be.Going forwardThis means I’m now stepping down as CopenhagenJS organizer, and I passed the baton to the Kevin Simper who is the main driver of community today. I’m sure Kevin’s drive and commitment to CopenhagenJS will take the community to new levels. To support Kevin and welcome a “new generation” of organizers, we are also looking for new co-organizers, so if you are interested reach out to Kevin.Much has happened in Copenhagen the past 4 years. We now have an established tech & startup-scene with CPHFTW. We have a better meetup culture, and the rise of JavaScript has shown a need for a strong united community.So going forward, I sincerely hope that new organizers and organizers of existing meetups like cphfront, will come together, collaborate, and maybe even unite. So we, together, can show the world why Copenhagen should be on the international front-end map.Thanks for the ride./k'''
year_published = 2015
