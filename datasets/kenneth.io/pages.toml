 { border: 3px solid rgba(0,0,0,0.75); border-right-color: transparent; border-radius: 50%; animation: rsme-spin 1s linear infinite; } @keyframes rsme-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } View post on Instagram .rsme-embed .rsme-d-none { display: none; } .rsme-embed .twitter-tweet { margin: 0 !important; } .rsme-embed blockquote { margin: 0 !important; padding: 0 !important; } .rsme-embed.rsme-facebook-embed .fb-post iframe { width: 100% !important; } .rsme-embed.rsme-facebook-embed .fb-post span { width: 100% !important; } .rsme-embed .rsme-d-none { display: none; } .rsme-embed .twitter-tweet { margin: 0 !important; } .rsme-embed blockquote { margin: 0 !important; padding: 0 !important; } .rsme-embed.rsme-facebook-embed .fb-post iframe { width: 100% !important; } .rsme-embed.rsme-facebook-embed .fb-post span { width: 100% !important; } .rsme-spinner { border: 3px solid rgba(0,0,0,0.75); border-right-color: transparent; border-radius: 50%; animation: rsme-spin 1s linear infinite; } @keyframes rsme-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } View post on Instagram Rebooting — a new generation of PrototypesIn the winter of 2014 we “peaked” by having an almost full shop every day, but January 2015, it came to an end, as I had decided to go travelling, Jacob decided to join DR, and Michael went all-in on his startup. So since January Prototype has been in this weird limbo-state, where we still paid the rent, but most of us were “too” busy to be around.So back in August we seat down, and after many discussions, whether we should close the place, rent it out, or keep going. We reached the conclusion that we wanted to keep our little hacker shop, but a “reboot” was needed. We needed a new driver of the place.Soon after, Anders decided to step up and become the main driver of Prototype. And the past months Anders and Prototype have been looking for new members. I’m super excited to see so many applicants and new members coming to Prototype these weeks. It means our idea and concept around Prototype is continues to live, and it makes me happy to see new energy being fueled into our little hacker cafe.Going forward I still be a member of Prototype, and contribute in a way that makes sense, but I won’t be the driver of the place. It has been a fun ride building Prototype, and I'm proud of where our little weird hacker cafe is today.The baton has been passed to the new generation of Prototypes, and that’s fantastic!/k"
