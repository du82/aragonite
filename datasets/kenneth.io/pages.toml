["https://kenneth.io/post/integrations-and-the-service-provider-side-of-ai-and-agentic-systems"]
title = "Integrations and the service-provider side of AI and agentic systems | Kenneth Auchenberg"
full_description = "As we move into an agentic world where AI systems will take actions on our behalf, there’s a significant part of the ecosystem that’s currently underserved in terms of infrastructure and protocols: the integrations and service-provider side for AI and agentic systems.Looking back at 2024, we saw a range of new frameworks and runtimes focused on building AI systems (and agents), but far fewer companies focused on the service provider side of AI and agentic systems — which, in my opinion, is the most critical aspect.In the not-so-distant future, we will all have agents working on our behalf. Some agents will be built into our phones and laptops (ChatGPT and Gemini), while others will address more vertical-specific needs, such as code generation tools (Devin, Cursor, or Augment Code), managing customer service (Lorikeet and Intercom Fin), or conducting research (Perplexity).The common thread among all these agents is that they need to interact with the existing world of services and software to retrieve production data and take actions on the user’s behalf via tools.Today, this behavior has emerged as tools for LLMs, where every major model provider now supports a way to pass on a set of predefined tools for LLMs to call when they need to go beyond their pre-trained knowledge or take actions.It’s January 2025, and tools for LLMs are the Wild West.Using tools with AI agents today is like the early days of Web 2.0Each service provider must figure out how to make their services available to a given LLM or agent. This varies across every AI provider, every LLM, and every AI agent framework. In many ways, this feels similar to the early days of Web 2.0, when building mashups was painful — until a standard like OAuth emerged to solve authentication challenges and introduce a well-defined workflow for interacting with third-party APIs.Today, if you are building an agent, you are likely first choosing which framework you want to use. Then, you select a model provider. If you want your agent to interact with tools and services, you have two options:Write your own tools: These are usually small pieces of glue code that invoke APIs or execute commands via shell scripting to automate tasks locally.Use pre-made packages: For example, Stripe’s agent toolkit provides a prebuilt adapter between the agent framework and the standard Stripe API SDK.import {StripeAgentToolkit} from '@stripe/agent-toolkit/ai-sdk'; import {openai} from '@ai-sdk/openai'; import {generateText} from 'ai'; const toolkit = new StripeAgentToolkit({ secretKey: 'sk_test_123', configuration: { actions: { // ... enable specific Stripe functionality }, }, }); await generateText({ model: openai('gpt-4o'), tools: { ...toolkit.getTools(), }, maxSteps: 5, prompt: 'Send <<email address>> an invoice for $100', }); Source: https://stripe.dev/blog/adding-payments-to-your-agentic-workflowsWhen peeking under the surface of the Stripe agent toolkit, we find something interesting: the toolkit essentially consists of a set of prompts that describe each API operation to the LLM and outline the input parameters for how the AI should use this tool, which is essentially an API request to Stripe.export const createCustomerPrompt = ` This tool will create a customer in Stripe. It takes two arguments: - name (str): The name of the customer. - email (str, optional): The email of the customer. `; export const listCustomersPrompt = ` This tool will fetch a list of Customers from Stripe. It takes no input. `; export const createProductPrompt = ` This tool will create a product in Stripe. It takes two arguments: - name (str): The name of the product. - description (str, optional): The description of the product. `; Source: https://github.com/stripe/agent-toolkit/blob/main/typescript/src/shared/prompts.tsThis approach is, first of all, incredibly smart and lightweight. However, as I reflect on it, I wonder whether this truly represents the end destination for how service providers will publish their tools and actions to AIs.I’m reminded of Bret Victor’s classic talk, “The Future of Programming,” from 13:21 to 16:22, where he shares a provocative idea about dynamic service discovery and loose coupling between systems:Building on this perspective, we can draw many parallels to what’s happening in the market today and what might emerge in the future. AI models now have the opportunity to evolve from static and centralized solution spaces to a more dynamic and decentralized solution space for service discovery.The integrations and service-provider landscape todayWhen I look at the landscape for AI tools today, I see a young market with emerging players reacting to current demands. The focus is on making it easier to build AI agents, with solutions centered around productivity, centralization, and aggregation.This approach is great in the short term to boost the supply side of AI agents. However, as I consider the mid-to-long-term trajectory and the potential endgame for the AI tools ecosystem, I believe what we are seeing today represents a local maximum of the market's current state. Looking ahead, I think we will see more parallels to how APIs and services are integrated and consumed today.Currently, APIs and services are characterized by the following:Discovery: While not as dynamic as Bret Victor might envision, developers discover APIs and services in decentralized ways, without a rigid discovery framework.Tightly coupled, but well-defined: Integrations between systems are often hard-coded, but many API providers offer standardized specifications like OpenAPI, which describe their APIs in a well-defined and consistent format.No gatekeepers: Services are inherently decentralized, with no central app-store-like gatekeeper controlling access. This allows for open and flexible integrations.Limited aggregation: Unified API providers like Merge exist, but they are the exception rather than the rule. Most service providers publish their APIs independently, maintaining control over the experiences they offer and the methods they use.This decentralized, standardized, and flexible approach offers valuable insights into the potential future evolution of the AI tools and integrations ecosystem.AI Tools and Integrations Market MapIn typical VC fashion, I’ve created a new market map of what I call the AI tools and integrations landscape, which captures startups and companies enabling AIs and agentic systems to interact with the world around them.The landscape is divided into several layers, spanning from the most high-level integration layer to the most low-level model provider layer. It features the startups and companies that I find most interesting in this space. Naturally, this is not a comprehensive list.The market map is also available as an interactive site on https://ai-tools-integrations-market-map.vercel.app/.If you think I missed something, I’ve made the market map fully open-source and updatable via GitHub, so feel free to contribute by opening a PR to either add a company or update an existing one.Opportunities and what might be nextWhen drawing parallels to how APIs and service providers are offering their services today, I believe a clearer picture of what might be next for AI tools is emerging. A few interesting trends stand out:More AI toolkit SDKs for popular AI Agent frameworksIn the short term, we will see more AI agent toolkits, like the one provided by Stripe. Every popular service provider will likely build its own toolkits to make it easier to integrate their services with AI agents.Furthermore, I wouldn’t be surprised if DXI providers like StainlessAPI and Speakeasy step in to simplify the process for such companies to create and offer these toolkits.Short term App-store-like aggregatorsTo address the immediate challenges of discovery, I believe we will see an increase in short-term aggregators that act as centralized registries for AI tools. These aggregators will play an important role in organizing and simplifying the process of finding and integrating tools in the early stages of this ecosystem. However, as the space matures, I expect these centralized solutions to gradually be replaced by decentralized discovery mechanisms.Decentralized discovery will emergeDecentralized discovery offers several advantages, such as greater scalability, reduced reliance on single points of failure, and the ability for developers to maintain more control over their tools. By leveraging standardized protocols and conventions, decentralized systems can provide a more flexible and open way to connect services and tools, ultimately reflecting the diverse and dynamic nature of the AI ecosystem.Back in 2023, we saw OpenAI launch ChatGPT Plugins, which provided developers with a new way to interact with ChatGPT. They took a decentralized approach to discovery, allowing developers to create and self-host plugin manifests, which were dynamically discoverable by ChatGPT.In 2024, we saw the Model Context Protocol (MCP) emerge from Anthropic as a new standard for how applications provide context to LLMs. It has already seen strong adoption among service providers.Building on these two examples, I believe a similar protocol, standard, or convention will emerge for decentralized tool discovery. It will likely resemble something closer to llms.txt than a centralized npm-style registry.I don’t think it’s too far-fetched to envision something like /.well-known/agent_tools.txt, which could describe details such as:# agent_tools.txt This file describes the tools offered by Stripe for AIs and agentic systems. Base API: https://api.stripe.com MCP endpoint: mcp://api.stripe.com/mcp OpenAPI spec: https://github.com/stripe/openapi/blob/master/openapi/spec3.json ## Tools - Create Customer POST /v1/customers This tool will create a customer in Stripe. It takes two arguments: - name (str): The name of the customer. - email (str, optional): The email of the customer. - List Customers GET /v1/customers This tool will fetch a list of Customers from Stripe. It takes no input. - Contact Support https://support.stripe.com/contact This tool will contact Stripe support. Fill out the form and submit. Source: /.well-known/agent_tools.txtWe have already seen some of this thinking being incorporated into the MCP roadmap.Emergence of Agent-first InterfacesWhen looking at the tooling interface itself and how future integrations between AI agents and services will work, I think a good question to ask is whether we will see a new generation of interfaces emerge that are more efficient and better suited for AI agents.Today, agents primarily use two interfaces:Agents making API requestsMost agents today make API requests to integrate with modern systems, where the model typically ingests an OpenAPI spec and generates an HTTP client on the fly to make the request. This approach requires a computing environment for the AI agent and mimics how traditional systems interact with APIs.Agents using browser automation to emulate human interactionAnother common interface is browser automation, where the AI agent automates a headless browser running locally or in the cloud through services like Browserbase (disclaimer: I'm an investor in Browserbase).Browser automation is a great solution for services that don’t offer APIs and emulates how humans interact with the internet today. I think browser automation is essential for addressing the long tail, as the reality is that few services offer APIs, and even fewer will offer new agent-first interfaces.In some ways, browser automation feels like the interface to the legacy world built for a human-first internet.However, when zooming out, neither of these two interfaces feels truly great or efficient:As a service provider, you don’t want AI agents to generate code indiscriminately and inadvertently DDoS your API.On the browser automation side, you don’t want agents emulating humans through browsers either, as it limits your ability to control their behavior.Instead, I think we will see the emergence of agent-first service interfaces, designed to allow agents to interact with services in more efficient ways, optimized for the interaction patterns and edge cases that arise when AI agents are treated as a new type of client for your service.Treating Agents as a New Client Type for Service ProvidersToday, we are mostly treating agents as a form of human or API client in our integrations. I don't think that's the right approach, as service providers fundamentally want to assert more control over what AI agents and agentic systems are doing with their services, and that behavior might be different than how humans interact with services.In many ways, parallels can be drawn to the desktop-to-mobile transition: the first generation of infrastructure treated mobile as just another desktop client, while later generations treated mobile as a new and distinct interface.This shift occurred due to a desire for greater control, and I think a similar trend will happen with agents.New service-provider-focused agentic infrastructureTreating agents as a new client type for service providers, combined with the potential emergence of agent-first interfaces, will likely lead to a new generation of infrastructure focused on access control, usage patterns, billing, and monetization as AI agents become more widely deployed.I believe we will see a new generation of service-provider-focused infrastructure that makes it easier to retrofit an agentic interface to existing services.If you’re working on something in this space, I want to talk with you. I’d love to riff about the future, and if you’re looking for funding, I’m actively funding early-stage AI agent tools companies — so reach out!That’s it for now.Best,KennethThank youA big thank you to Ian Livingstone, Peter Zakin, Charlie Robbins, Davis Treybig, James Dillard, Jeff Silverstein, Paul Butler, Paul Klein, and Smit Patel for their feedback for this post.Relevant readinghttps://www.letta.com/blog/ai-agents-stackhttps://llmstxt.org/https://www.answer.ai/posts/2024-09-03-llmstxt.htmlhttps://stripe.dev/blog/adding-payments-to-your-agentic-workflowshttps://x.com/AtomSilverman/status/1860098409778282842https://www.anthropic.com/research/building-effective-agentshttps://x.com/ianlivingstone/status/1869451032666747341https://x.com/alexalbert__/status/1874853921543553147"
year_published = 2025
clearnet = "https://kenneth.io/post/integrations-and-the-service-provider-side-of-ai-and-agentic-systems"
