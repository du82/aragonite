["https://kenneth.io/post/60-items-for-the-next-many-months-in-asia"]
title = "60 items. For the next many months in Asia. | Kenneth Auchenberg"
full_description = "It’s now 24 hours ago I arrived here in hot Bangkok with just 60 items with me. For the next coming months I’ll be traveling asia, in a somewhat unplanned manner. It’s the first time I’m traveling longer than a month, and the first time I’m on my own.Exciting!Traveling like this has been on my mind for a while, and after reading this What I learnt from bootstrapping my startup from Thailand in six months post by @levels.io, on how to be traveling as a “digital nomade”, I made the decision that it soon was going to be my turn.So here I am. In Bangkok, with my laptop, camera and 58 other items.I’m ready to meet new people, explore Asia, and have a great time.So what did I bring with me?When packing for this trip I’ve spend quite some time reading blog posts on do and don’ts for Asia. There’s so much information out there, but I ended up following the principles of Expertvagabond gear guide. I decided to go “minimal”, and try the The 100 Thing Challenge, so the first thing was to find a relatively compact backpack, after a bit of research I ended up with a Osprey Exos 38 liter backpack, which is about half the size of a typical backpacker bag.This is the items I decided to bring with me:Gear1x Osprey Exos 38 back bag1x Sea to Summit Ultra-Sil Day Pack1x Sea To summit Bed liner1x Sea To summit travel towel1x Leatherman New Wave tool1x Black Diamond headlamp4x Eagle Creek Pack-It Cubes2x Eagle Creek Compression Sacs1x Shemagh1x Sewing kit2x Aloksak bags1x First aid kit1x Ducktape2x Pens (sharpie + pen)2x LocksClothing3x T-shirts2x Tank tops1x Long sleeved shirt2x Long parts4x Underpants4x Pair of socks2x Shorts1x Toms shoes1x Uniqlo Termo West1x Nike Free 5.0 shoesElectronics1x Macbook Air + charger1x Fuji X100s + charger1x Kindle Voyage1x Ankor USB charger + Micro USB cable1x GoPro Hero 4 Silver + accessories1x Travel power adaptorMics4x Creditcards1x Passport + passport photos (for visa)1x Drivers license1x Toothbrush + painkillers + malaria meds3x Coffee Collective coffee (a gift to Ake from Roots Coffee, not counted)Total: 60 itemsSo I have 60 items with me. Is it enough? It's it too much? I don't know. Time will tell.What’s next?I’m in Bangkok for the next week or so, and after that I’m probably headed for Cambodia. I haven’t made the decision yet, so let’s see where I’ll end up./k"
