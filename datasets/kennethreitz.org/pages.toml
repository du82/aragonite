full_description = "kennethreitz.org / Photos Cities Archives Humans Events Experiments I was a photographer for many years. I focused on street photography, portraiture, and still life. I have a deep love for black and white photography, and I have always been drawn to the work of photographers like Henri Cartier–Bresson. My work was showcased in Leica Gallery in DC, and the Leica Blog did a feature on me once: EXPLORING THE MATERIAL WORLD IN AN ELECTRONIC UNIVERSE. I don't take professional–level photos anymore, but I plan to start again one day. Gear Thoughts: I started off shooting with a Canon 5D Mark II, and later upgraded to a Leica M9. One of my favorite cameras of all time is the Fujifilm X100 Series. My favorite lens of all time is the 35 Summicron ASPH. by Leica. The Leica Monochrom is a dream camera for black and white photography. I have a significant number of thoughts about photography, and the gear used. If you want to talk shop, drop me a line. Like I said, I don't own any of this equipment any longer, so this part of my life seems like it's behind me. I hope to return to it one day. I miss it."
