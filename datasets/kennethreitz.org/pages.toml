full_description = "kennethreitz.org / Poetry / Holy Syntax Holy Syntax Syntax is far more precious to me than it is to you — this I gaurentee. A comma is sacred, and a period — divine. The sacredness of latency — comedically timed A punchline delivered two seconds too late. A failure of our time, yet the fault lies within me and one alone, for latency cannot be taught. I am surrounded by silence. a gift, surely, right? Holy isolation, if I can just keep my verbs right. Contained, within, a sandbox of thought — The mind begins to unravel as I unteach myself songs — The cries of the tempest, quickening like sands Falling quickly through: my time, my energy, my Psyché What.e.v.e.r. All hail the sacred Entropy LORDs!"
