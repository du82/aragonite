["https://kennethreitz.org/values"]
title = "Values — kennethreitz.org"
full_description = "kennethreitz.org / Values A Concise List of Personal Values This is a concise list of my personal values. I iterate on them, from time to time. Trust and verify. As above, so below. Creativity is crafted from strife. Full, 180° turns are encouraged. Communicate intent, always. Never stop. Life is not a race, but there’s no speed limit either. Watch yourself closely and learn from your mistakes. Reality exists, regardless of your emotional support of it. There’s a big difference between judgement and discernment. Organize for peacefulness, love others, and craft meaningfulness — always. Negative atmospheres are toxic. Remove yourself from them. All things in the Universe are self–referential in Nature. Drink copious amounts of water—every day. Often, the best way to learn is to teach. Everything is an expression of its opposite. Please be cordial, or please be on your way. Everything’s going to be okay. Be gentle with yourself. Inspire. Stay inspired. Attention is the only currency we have in life. Thanks for gifting me yours."
