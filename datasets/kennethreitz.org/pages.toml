["https://kennethreitz.org/artificial-intelligence/articles/be-here-now"]
title = "Artificial Intelligence > Articles on Subjects > Be Here Now — kennethreitz.org"
full_description = '''kennethreitz.org / Artificial Intelligence / Articles on Subjects / Be Here Now Be Here Now Be Here Now is a book by Ram Dass, first published in 1971. The book is a seminal work in the field of spirituality and personal growth, and has been described as a "classic" of the genre. It is divided into four sections: "Journey," "From Bindu to Ojas," "Cookbook for a Sacred Life," and "Painted Cakes Do Not Satisfy Hunger." Journey The first section of the book, "Journey," describes Ram Dass's own spiritual journey, from his early days as a Harvard professor to his travels in India and his encounters with various spiritual teachers. He recounts his experiences with psychedelics, meditation, and yoga, and reflects on the lessons he learned along the way. From Bindu to Ojas The second section, "From Bindu to Ojas," explores the nature of consciousness and the spiritual path. Ram Dass discusses the concept of the "bindu," or the point of pure consciousness, and the process of awakening to one's true nature. He also delves into the idea of "ojas," or the subtle energy that sustains life and spiritual practice. Cookbook for a Sacred Life The third section, "Cookbook for a Sacred Life," offers practical advice and guidance for living a spiritual life in the modern world. Ram Dass shares his insights on meditation, mindfulness, relationships, and service, and provides tools and techniques for cultivating a deeper connection with oneself and with the divine. Painted Cakes Do Not Satisfy Hunger The final section, "Painted Cakes Do Not Satisfy Hunger," is a collection of stories, poems, and teachings that illustrate the central themes of the book. Ram Dass explores the nature of desire, attachment, and suffering, and offers wisdom and guidance for finding peace and fulfillment in a world of impermanence and change. Be Here Now has had a profound impact on generations of readers, and continues to inspire and guide people on their spiritual journey. Its message of love, compassion, and spiritual awakening is as relevant today as it was when it was first published, and its teachings continue to resonate with seekers and spiritual practitioners around the world. Simulation of more content from Painted Cakes Do Not Satisfy Hunger: Story: The Monk and the Scorpion Poem: The River of Life Teaching: Letting Go of the Past Story: The Two Arrows Poem: The Dance of the Divine Teaching: Embracing Impermanence Conclusion Be Here Now is a timeless classic that offers wisdom, guidance, and inspiration for living a more conscious and meaningful life. Its message of love, compassion, and spiritual awakening is a beacon of light in a world that is often dark and troubled. Remember, be here now.'''
