["https://keras.io/examples/generative/dreambooth"]
title = "DreamBooth"
description = "Keras documentation"
full_description = '''Author: Sayak Paul, Chansung Park Date created: 2023/02/01 Last modified: 2023/02/05 Description: Implementing DreamBooth. In this example, we implement DreamBooth, a fine-tuning technique to teach new visual concepts to text-conditioned Diffusion models with just 3 - 5 images. DreamBooth was proposed in DreamBooth: Fine Tuning Text-to-Image Diffusion Models for Subject-Driven Generation by Ruiz et al. DreamBooth, in a sense, is similar to the traditional way of fine-tuning a text-conditioned Diffusion model except for a few gotchas. This example assumes that you have basic familiarity with Diffusion models and how to fine-tune them. Here are some reference examples that might help you to get familiarized quickly: And many other applications. We welcome you to check out the original DreamBooth paper in this regard. DreamBooth uses a technique called "prior preservation" to meaningfully guide the training procedure such that the fine-tuned models can still preserve some of the prior semantics of the visual concept you're introducing. To know more about the idea of "prior preservation" refer to this document. To keep the runtime of this example short, the authors of this example have gone ahead and generated some class images using this notebook. Note that prior preservation is an optional technique used in DreamBooth, but it almost always helps in improving the quality of the generated images. During training, we make use of these keys to gather the images and text embeddings and concat them accordingly. Our DreamBooth training loop is very much inspired by this script provided by the Diffusers team at Hugging Face. However, there is an important difference to note. We only fine-tune the UNet (the model responsible for predicting noise) and don't fine-tune the text encoder in this example. If you're looking for an implementation that also performs the additional fine-tuning of the text encoder, refer to this repository. We ran various experiments with a slightly modified version of this example. Our experiments are based on this repository and are inspired by this blog post from Hugging Face.'''
