["https://keras.io/examples/generative/finetune_stable_diffusion"]
title = "Fine-tuning Stable Diffusion"
description = "Keras documentation"
full_description = "Author: Sayak Paul, Chansung Park Date created: 2022/12/28 Last modified: 2023/01/13 Description: Fine-tuning Stable Diffusion using a custom image-caption dataset. This tutorial shows how to fine-tune a Stable Diffusion model on a custom dataset of {image, caption} pairs. We build on top of the fine-tuning script provided by Hugging Face here. We assume that you have a high-level understanding of the Stable Diffusion model. The following resources can be helpful if you're looking for more information in that regard: The tutorial relies on KerasCV 0.4.0. Additionally, we need at least TensorFlow 2.11 in order to use AdamW with mixed precision. It's worth noting that during the process of generating an image from a text prompt, the image encoder is not typically employed. Note that only the diffusion model parameters are updated during fine-tuning, while the (pre-trained) text and the image encoders are kept frozen. We use the dataset Pokémon BLIP captions. However, we'll use a slightly different version which was derived from the original dataset to fit better with tf.data. Refer to the documentation for more details. Since we have only 833 {image, caption} pairs, we can precompute the text embeddings from the captions. Moreover, the text encoder will be kept frozen during the course of fine-tuning, so we can save some compute by doing this. In this section, we'll prepare a tf.data.Dataset object from the input image file paths and their corresponding caption tokens. The section will include the following: The baseline Stable Diffusion model was trained using images with 512x512 resolution. It's unlikely for a model that's trained using higher-resolution images to transfer well to lower-resolution images. However, the current model will lead to OOM if we keep the resolution to 512x512 (without enabling mixed-precision). Therefore, in the interest of interactive demonstrations, we kept the input resolution to 256x256. One important implementation detail to note here: Instead of directly taking the latent vector produced by the image encoder (which is a VAE), we sample from the mean and log-variance predicted by it. This way, we can achieve better sample quality and diversity."
