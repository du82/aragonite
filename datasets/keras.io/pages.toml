["https://keras.io/about"]
title = "About Keras 3"
description = "Keras documentation"
full_description = "Keras is a deep learning API written in Python and capable of running on top of either JAX, TensorFlow, or PyTorch. As a multi-framework API, Keras can be used to develop modular components that are compatible with any framework – JAX, TensorFlow, or PyTorch. The core data structures of Keras are layers and models. The simplest type of model is the Sequential model, a linear stack of layers. For more complex architectures, you should use the Keras functional API, which allows to build arbitrary graphs of layers, or write models entirely from scratch via subclasssing. If you need to, you can further configure your optimizer. The Keras philosophy is to keep simple things simple, while allowing the user to be fully in control when they need to (the ultimate control being the easy extensibility of the source code via subclassing). However, Keras is also a highly-flexible framework suitable to iterate on state-of-the-art research ideas. Keras follows the principle of progressive disclosure of complexity: it makes it easy to get started, yet it makes it possible to handle arbitrarily advanced use cases, only requiring incremental learning at each step. In much the same way that you were able to train and evaluate a simple neural network above in a few lines, you can use Keras to quickly develop new training procedures or state-of-the-art model architectures. Here's an example of a custom Keras layer – which can be used in low-level workflows in JAX, TensorFlow, or PyTorch, interchangeably: You can also post bug reports and feature requests (only) in GitHub issues. Make sure to read our guidelines first. Keras (κέρας) means horn in ancient Greek. It is a reference to a literary image from ancient Greek and Latin literature, first found in the Odyssey, where dream spirits (Oneiroi, singular Oneiros) are divided between those who deceive dreamers with false visions, who arrive to Earth through a gate of ivory, and those who announce a future that will come to pass, who arrive through a gate of horn. It's a play on the words κέρας (horn) / κραίνω (fulfill), and ἐλέφας (ivory) / ἐλεφαίρομαι (deceive)."
