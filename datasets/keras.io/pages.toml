full_description = "Author: Mostafa M. Amin Date created: 2024/10/04 Last modified: 2024/10/04 Description: Introducing the STFTSpectrogram layer to extract spectrograms for audio classification. Preprocessing audio as spectrograms is an essential step in the vast majority of audio-based applications. Spectrograms represent the frequency content of a signal over time, are widely used for this purpose. In this tutorial, we'll demonstrate how to use the STFTSpectrogram layer in Keras to convert raw audio waveforms into spectrograms within the model. We'll then feed these spectrograms into an LSTM network followed by Dense layers to perform audio classification on the Speech Commands dataset. We'll use the Dataset for Environmental Sound Classification dataset (ESC-10). This dataset consists of five-second .wav files of environmental sounds. Create a function that uses the STFTSpectrogram to compute three spectrograms with multiple bandwidths, then aligns them as an image with different channels, to get a multi-bandwith spectrogram, then plots the spectrogram. The first model will use a non-trainable STFTSpectrogram layer, so it is intended purely for preprocessing. Additionally, the model will use 1D signals, hence it make use of Conv1D layers. The second model will use a trainable STFTSpectrogram layer with the expand_dims option, which expands the shapes to be compatible with image models."
