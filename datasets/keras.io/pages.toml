title = "English speaker accent recognition using Transfer Learning"
description = "Keras documentation"
full_description = "Author: Fadi Badine Date created: 2022/04/16 Last modified: 2022/04/16 Description: Training a model to classify UK & Ireland accents using feature extraction from Yamnet. The following example shows how to use feature extraction in order to train a model to classify the English accent spoken in an audio wave. Instead of training a model from scratch, transfer learning enables us to take advantage of existing state-of-the-art deep learning models and use them as feature extractors. Yamnet is an audio event classifier trained on the AudioSet dataset to predict audio events from the AudioSet ontology. It is available on TensorFlow Hub. Yamnet accepts a 1-D tensor of audio samples with a sample rate of 16 kHz. As output, the model returns a 3-tuple: We will use the embeddings, which are the features extracted from the audio samples, as the input to our dense model. The dataset used is the Crowdsourced high-quality UK and Ireland English Dialect speech data set which consists of a total of 17,877 high-quality audio wav files. This dataset includes over 31 hours of recording from 120 volunteers who self-identify as native speakers of Southern England, Midlands, Northern England, Wales, Scotland and Ireland. For more info, please refer to the above link or to the following paper: Open-source Multi-speaker Corpora of the English Accents in the British Isles Of the 3 columns (ID, filename and transcript), we are only interested in the filename column in order to read the audio file. We will ignore the other two. Next, we need to create a tf.data.Dataset. This is done by creating a dataframe_to_dataset function that does the following: The below load_16k_audio_file is copied from the following tutorial Transfer learning with YAMNet for environmental sound classification Getting the class weights is a little tricky because even though we know the number of audio files for each class, it does not represent the number of samples for that class since Yamnet transforms each audio file into multiple audio samples of 0.96 seconds each. So every audio file will be split into a number of samples that is proportional to its length."
