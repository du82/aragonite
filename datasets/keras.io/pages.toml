["https://keras.io/examples/audio/vocal_track_separation"]
title = "Vocal Track Separation with Encoder-Decoder Architecture"
description = "Keras documentation"
full_description = '''Author: Joaquin Jimenez Date created: 2024/12/10 Last modified: 2024/12/10 Description: Train a model to separate vocal tracks from music mixtures. In this tutorial, we build a vocal track separation model using an encoder-decoder architecture in Keras 3. We train the model on the MUSDB18 dataset, which provides music mixtures and isolated tracks for drums, bass, other, and vocals. W. Choi, M. Kim, J. Chung, D. Lee, and S. Jung, “Investigating U-Nets with various intermediate blocks for spectrogram-based singing voice separation,” in the 21st International Society for Music Information Retrieval Conference, 2020. The data processing and model training routines are partly derived from: ZFTurbo/Music-Source-Separation-Training. The following constants define configuration parameters for audio processing and model training, including dataset paths, audio chunk sizes, Short-Time Fourier Transform (STFT) parameters, and training hyperparameters. The MUSDB18 dataset is a standard benchmark for music source separation, containing 150 full-length music tracks along with isolated drums, bass, other, and vocals. The dataset is stored in .mp4 format, and each .mp4 file includes multiple audio streams (mixture and individual tracks). The following utility function downloads MUSDB18 and converts its .mp4 files to .wav files for each instrument track, resampled to 16 kHz. We define a custom dataset class to generate random audio chunks and their corresponding labels. The dataset does the following: This approach allows creating an effectively infinite variety of training examples through randomization and augmentation. Let's visualize a random mixed audio chunk and its corresponding isolated vocals. This helps to understand the nature of the preprocessed input data. The model operates on STFT representations rather than raw audio. We define a preprocessing model to compute STFT and a corresponding inverse transform (iSTFT). The model uses a custom encoder-decoder architecture with Time-Frequency Convolution (TFC) and Time-Distributed Fully Connected (TDF) blocks. They are grouped into a TimeFrequencyTransformBlock, i.e. "TFC_TDF" in the original paper by Choi et al.'''
