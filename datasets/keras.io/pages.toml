full_description = 'Are you a machine learning engineer looking for a Keras introduction one-pager? Read our guide Introduction to Keras for engineers. Are you looking for detailed guides covering in-depth usage of different parts of the Keras API? Read our Keras developer guides. Are you looking for tutorials showing Keras in action across a wide range of use cases? See the Keras code examples: over 150 well-explained notebooks demonstrating Keras best practices in computer vision, natural language processing, and generative AI. To use Keras 3, you will also need to install a backend framework – either JAX, TensorFlow, or PyTorch: If you install TensorFlow 2.15, you should reinstall Keras 3 afterwards. The cause is that tensorflow==2.15 will overwrite your Keras installation with keras==2.15. This step is not necessary for TensorFlow versions 2.16 onwards as starting in TensorFlow 2.16, it will install Keras 3 by default. You can export the environment variable KERAS_BACKEND or you can edit your local config file at ~/.keras/keras.json to configure your backend. Available backend options are: "jax", "tensorflow", "torch". Example: Note: The backend must be configured before importing Keras, and the backend cannot be changed after the package has been imported. If you are running on Colab or Kaggle, the GPU should already be configured, with the correct CUDA version. Installing a newer version of CUDA on Colab or Kaggle is typically not possible. Even though pip installers exist, they rely on a pre-installed NVIDIA driver and there is no way to update the driver on Colab or Kaggle. If you want to attempt to create a "universal environment" where any backend can use the GPU, we recommend following the dependency versions used by Colab (which seeks to solve this exact problem). You can install the CUDA driver from here, then pip install backends by following their respective CUDA installation instructions: Installing JAX, Installing TensorFlow, Installing PyTorch This