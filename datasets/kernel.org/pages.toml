["https://www.kernel.org/cloning-linux-from-a-bundle.html"]
title = "Cloning Linux from a bundle"
full_description = 'Cloning Linux from a bundle 2016-03-02 In Site news. If you find yourself on an unreliable Internet connection and need to perform a fresh clone of Linux.git, you may find it tricky to do so if your connection resets before you are able to complete the clone. There is currently no way to resume a git clone using git, but there is a neat trick you can use instead of cloning directly -- using git bundle files. Here is how you would do it. Start with "wget -c", which tells wget to continue interrupted downloads. If your connection resets, just rerun the same command while in the same directory, and it will pick up where it left off: wget -c https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/clone.bundle Next, clone from the bundle: git clone clone.bundle linux Now, point the origin to the live git repository and get the latest changes: cd linux git remote remove origin git remote add origin https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git git pull origin master Once this is done, you can delete the "clone.bundle" file, unless you think you will need to perform a fresh clone again in the future. The "clone.bundle" files are generated weekly on Sunday, so they should contain most objects you need, even during kernel merge windows when there are lots of changes committed daily.'
year_published = 2016
clearnet = "https://www.kernel.org/cloning-linux-from-a-bundle.html"
