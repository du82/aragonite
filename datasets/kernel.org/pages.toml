["https://www.kernel.org/category/site-news2.html"]
title = "The Linux Kernel Archives - Site news"
full_description = '''Shutting down FTP services 2017-01-27 In Site news. Those of you who have been around for a while may remember a time when you used to be able to mount kernel.org directly as a partition on your system using NFS (or even SMB/CIFS). The Wayback Machine shows that this was still advertised some time in January … read more Gandi.net TLS certificates 2016-10-11 In Site news. If your browser alerted you that the site certificates have changed, that would be because we replaced our StartCOM, Ltd certificates with those offered by our DNS registrar, Gandi. We are very thankful to Gandi for this opportunity. A common question is why we aren't using the certificates offered by … read more Cloning Linux from a bundle 2016-03-02 In Site news. If you find yourself on an unreliable Internet connection and need to perform a fresh clone of Linux.git, you may find it tricky to do so if your connection resets before you are able to complete the clone. There is currently no way to resume a git clone using … read more Introducing Fastly CDN 2015-10-05 In Site news. We are happy to announce that Fastly has offered their worldwide CDN network to provide fast download services for Linux kernel releases, which should improve download speeds for those of you located outside North America. We have modified the front page to offer CDN-powered download links, but all the existing … read more Hurr, Durr Im'a Sheep 2015-04-01 In Site news. Linus named the upcoming 4.0 release of the kernel "Hurr Durr I'ma Sheep" (see his git commit), so we are celebrating this April Fool's day with a minor prank. If you've been redirected to imasheep.hurrdurr.org, do not panic. It's all part of the joke. We've also restored … read more FTP limited on mirrors.kernel.org 2015-02-03 By Konstantin Ryabitsev In Site news. We've had to temporarily limit FTP access to mirrors.kernel.org due to high IO load. We have recently upgraded our hardware in order to increase capacity -- 16TB was no longer nearly sufficient enough to host all the distro mirrors and archives. We chose larger but slower disks and offset … read more'''
