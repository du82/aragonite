title = "The Linux Kernel Archives - Site news"
full_description = '''Fifty shades of Tux 2013-05-07 In Site news. Special thanks to Benoît Monin for donating a MIT-licensed CSS theme to the kernel.org project to replace the one we hastily put together. Though the Pelican authors have since obtained a free-license commitment from the copyright owners of the CSS files shipping with Pelican, we wanted to have something … read more XZ by default and JSON 2013-03-11 In Site news. We've implemented two oft-requested features today: The download links now default to .tar.xz versions of archives There is now a JSON file with the release information located in https://www.kernel.org/releases.json. If you've been screen-scraping the front page, please use this instead. If you have any … read more /pub tree resync-ing 2013-03-08 In Site news. Due to a failure in one of the rsync scripts during the maintenance window, the mirrors of /pub hierarchy on www.kernel.org got erased. We are resyncing them now from the master storage, but in the meantime you will probably get an occasional "Forbidden". The entirety of the archive … read more Cleanroom styles 2013-03-03 In Site news. You are probably wondering what happened to the site's look. Unfortunately, we've been alerted that the default theme shipped by Pelican (which we largely adapted) has an unclear license. Until this is cleared up, we've put together a quick-and-dirty cleanroom CSS reimplementation that preserves the functional aspects of the site … read more Pelican 2013-03-01 In Site news. Welcome to the reworked kernel.org website. We have switched to using Pelican in order to statically render our site content, which simplifies mirroring and distribution. You can view the sources used to build this website in its own git repository. Additionally, we have switched from using gitweb-caching to using … read more'''
