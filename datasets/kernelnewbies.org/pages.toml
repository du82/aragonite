["https://kernelnewbies.org/Documents/LinuxIPNetworking"]
title = "Documents/LinuxIPNetworking - Linux Kernel Newbies"
full_description = '''A Guide to the Implementation and Modification of the Linux Protocol Stack Glenn Herrin TR 00-04 May 31, 2000 Abstract This document is a guide to understanding how the Linux kernel (version 2.2.14 specifically) implements networking protocols, focused primarily on the Internet Protocol (IP). It is intended as a complete reference for experimenters with overviews, walk-throughs, source code explanations, and examples. The first part contains an in-depth examination of the code, data structures, and functionality involved with networking. There are chapters on initialization, connections and sockets, and receiving, transmitting, and forwarding packets. The second part contains detailed instructions for modifiying the kernel source code and installing new modules. There are chapters on kernel installation, modules, the proc file system, and a complete example. Contents Contents Introduction Background Document Conventions Sample Network Example Copyright, License, and Disclaimer Acknowledgements Message Traffic Overview The Network Traffic Path The Protocol Stack Packet Structure Internet Routing Network Initialization Overview Startup The Network Initialization Script ifconfig route Dynamic Routing Programs Examples Home Computer Host Computer on a LAN Network Routing Computer Linux and Network Program Functions ifconfig route Connections Overview Socket Structures Sockets and Routing Connection Processes Establishing Connections Socket Call Walk-Through Connect Call Walk-Through Closing Connections Close Walk-Through Linux Functions Sending Messages Overview Sending Walk-Through Writing to a Socket Creating a Packet with UDP Creating a Packet with TCP Wrapping a Packet in IP Transmitting a Packet Linux Functions Receiving Messages Overview Receiving Walk-Through Reading from a Socket (Part I) Receiving a Packet Running the Network "Bottom Half" Unwrapping a Packet in IP Accepting a Packet in UDP Accepting a Packet in TCP Reading from a Socket (Part II) Linux Functions IP Forwarding Overview IP Forward Walk-Through Receiving a Packet Running the Network "Bottom Half" Examining a Packet in IP Forwarding a Packet in IP Transmitting a Packet Linux Functions Basic Internet Protocol Routing Overview Routing Tables The Neighbor Table The Forwarding Information Base The Routing Cache Updating Routing Information Linux Functions Dynamic Routing with routed Overview How routed works Data Structures Initialization Normal Operations routed Functions Editing Linux Source Code The Linux Source Tree Using EMACS Tags Referencing with Tags Constructing TAGS File Using vi Tags Rebuilding the Kernel Patching the Kernel Source Linux Modules Overview Writing, Installing and Removing Modules Writing Modules Installing and Removing Modules Example The proc File System Overview Network proc Files Registering prof Files Formatting a Function to Provide Information Building a proc Entry Registering a proc Entry Unregistering a proc Entry Example Example Packet Dropper Overview Considerations Experimental Systems and Benchmarks Results and Preliminary Analysis Standard Kernel Modified Kernel Dropping Packets Prelimiary Analysis Code Kernel Module Additional Resources Internet Sites Books Acronyms Chapter 1 1. Introduction This is version 1.0 of this document, dated May 31, 2000, referencing the Linux kernel version 2.2.14. 1.1. Background Linux is becoming more and more popular as an alternative operating system. Since it is freely available to everyone as part of the open source movement, literally thousands of programmers are constantly working on the code to implement new features, improve existing ones, and fix bugs and inefficiencies in the code. There are many sources for learning more about Linux, from the source code itself (downloadable from the Internet) to books to "HOW-TOs" and message boards maintained on many different subjects. This document is an effort to bring together many of these sources into one coherent reference on and guide to modifying the networking code within the Linux kernel. It presents the internal workings on four levels: a general overview, more specific examinations of network activities, detailed function walk-throughs, and references to the actual code and data structures. It is designed to provide as much or as little detail as the reader desires. This guide was written specifically about the Linux 2.2.14 kernel (which has already been superseded by 2.2.15) and many of the examples come from the Red Hat 6.1 distribution; hopefully the information provided is general enough that it will still apply across distributions and new kernels. It also focuses almost exclusively on TCP/UDP, IP, and Ethernet - which are the most common but by no means the only networking protocols available for Linux platforms. As a reference for kernel programmers, this document includes information and pointers on editing and recompiling the kernel, writing and installing modules, and working with the /proc file system. It also presents an example of a program that drops packets for a selected host, along with analysis of the results. Between the descriptions and the examples, this should answer most questions about how Linux performs networking operations and how you can modify it to suit your own purposes. This project began in a Computer Science Department networking lab at the University of New Hampshire as an effort to institute changes in the Linux kernel to experiment with different routing algorithms. It quickly became apparent that blindly hacking the kernel was not a good idea, so this document was born as a research record and a reference for future programmers. Finally it became large enough (and hopefully useful enough) that we decided to generalize it, formalize it, and release it for public consumption. As a final note, Linux is an ever-changing system and truly mastering it, if such a thing is even possible, would take far more time than has been spent putting this reference together. If you notice any misstatements, omissions, glaring errors, or even typos within this document, please contact the person who is currently maintaining it. The goal of this project has been to create a freely available and useful reference for Linux programmers. 1.2. Document Conventions It is assumed that the reader understands the C programming language and is acquainted with common network protocols. This is not vital for the more general information but the details within this document are intended for experienced programmers and may be incomprehensible to casual Linux users. Almost all of the code presented requires superuser access to implement. Some of the examples can create security holes where none previously existed; programmers should be careful to restore their systems to a normal state after experimenting with the kernel. File references and program names are written in a slanted font. Code, command line entries, and machine names are written in a typewriter font. Generic entries or variables (such as an output filename) and comments are written in an italic font. 1.3. Sample Network Example There are numerous examples in this document that help clarify the presented material. For the sake of consistency and familiarity, most of them reference the sample network shown in Figure 1.1. Figure 1.1: Sample network structure. This network represents the computer system at a fictional unnamed University (U!). It has a router connected to the Internet at large (chrysler). That machine is connected (through the jeep interface) to the campus-wide network, u.edu, consisting of computers named for Chrysler owned car companies (dodge, eagle, etc.). There is also a LAN subnet for the computer science department, cs.u.edu, whose hosts are named after Dodge vehicle models (stealth, neon, etc.). They are connected to the campus network by the dodge/viper computer. Both the u.edu and cs.u.edu networks use Ethernet hardware and protocols. This is obviously not a real network. The IP addresses are all taken from the block reserved for class B private networks (that are not guaranteed to be unique). Most real class B networks would have many more computers, and a network with only eight computers would probably not have a subnet. The connection to the Internet (through chrysler) would usually be via a T1 or T3 line, and that router would probably be a "real" router (i.e. a Cisco Systems hardware router) rather than a computer with two network cards. However, this example is realistic enough to serve its purpose: to illustrate the the Linux network implementation and the interactions between hosts, subnets, and networks. 1.4. Copyright, License, and Disclaimer Copyright (c) 2000 by Glenn Herrin. This document may be freely reproduced in whole or in part provided credit is given to the author with a line similar to the following: Copied from Linux IP Networking, available at http://original.source/location. (The visibility of the credit should be proportional to the amount of the document reproduced!) Commercial redistribution is permitted and encouraged. All modifications of this document, including translations, anthologies, and partial documents, must meet the following requirements: Modified versions must be labeled as such. The person making the modifications must be identified. Acknowledgement of the original author must be retained. The location of the original unmodified document be identified. The original author's name may not be used to assert or imply endorsement of the resulting document without the original author's permission. Please note any modifications including deletions. This is a variation (changes are intentional) of the Linux Documentation Project (LDP) License available at: http://www.linuxdoc.org/COPYRIGHT.html This document is not currently part of the LDP, but it may be submitted in the future. This document is distributed in the hope that it will be useful but (of course) without any given or implied warranty of fitness for any purpose whatsoever. Use it at your own risk. 1.5. Acknowledgements I wrote this document as part of my Master's project for the Computer Science Department of the University of New Hampshire. I would like to thank Professor Pilar de la Torre for setting up the project and Professor Radim Bartos for being both a sponsor and my advisor - giving me numerous pointers, much encouragement, and a set of computers on which to experiment. I would also like to credit the United States Army, which has been my home for 11 years and paid for my attendance at UNH. Glenn Herrin Major, United States Army Primary Documenter and Researcher, Version 1.0 <gherrin@cs.unh.edu> Chapter 2 2. Message Traffic Overview This chapter presents an overview of the entire Linux messaging system. It provides a discussion of configurations, introduces the data structures involved, and describes the basics of IP routing. 2.1. The Network Traffic Path The Internet Protocol (IP) is the heart of the Linux messaging system. While Linux (more or less) strictly adheres to the layering concept - and it is possible to use a different protocol (like ATM) - IP is almost always the nexus through which packets flow. The IP implementation of the network layer performs routing and forwarding as well as encapsulating data. See Figure 2.1 for a simplified diagram of how network packets move through the Linux kernel. Figure 2.1: Abstraction of the Linux message traffic path. When an application generates traffic, it sends packets through sockets to a transport layer (TCP or UDP) and then on to the network layer (IP). In the IP layer, the kernel looks up the route to the host in either the routing cache or its Forwarding Information Base (FIB). If the packet is for another computer, the kernel addresses it and then sends it to a link layer output interface (typically an Ethernet device) which ultimately sends the packet out over the physical medium. When a packet arrives over the medium, the input interface receives it and checks to see if the packet is indeed for the host computer. If so, it sends the packet up to the IP layer, which looks up the route to the packet's destination. If the packet has to be forwarded to another computer, the IP layer sends it back down to an output interface. If the packet is for an application, it sends it up through the transport layer and sockets for the application to read when it is ready. Along the way, each socket and protocol performs various checks and formatting functions, detailed in later chapters. The entire process is implemented with references and jump tables that isolate each protocol, most of which are set up during initialization when the computer boots. See Chapter 3 for details of the initialization process. 2.2. The Protocol Stack Network devices form the bottom layer of the protocol stack; they use a link layer protocol (usually Ethernet) to communicate with other devices to send and receive traffic. Input interfaces copy packets from a medium, perform some error checks, and then forward them to the network layer. Output interfaces receive packets from the network layer, perform some error checks, and then send them out over the medium. IP is the standard network layer protocol. It checks incoming packets to see if they are for the host computer or if they need to be forwarded. It defragments packets if necessary and delivers them to the transport protocols. It maintains a database of routes for outgoing packets; it addresses and fragments them if necessary before sending them down to the link layer. TCP and UDP are the most common transport layer protocols. UDP simply provides a framework for addressing packets to ports within a computer, while TCP allows more complex connection based operations, including recovery mechanisms for packet loss and traffic management implementations. Either one copies the packet's payload between user and kernel space. However, both are just part of the intermediate layer between the applications and the network. IP Specific INET Sockets are the data elements and implementations of generic sockets. They have associated queues and code that executes socket operations such as reading, writing, and making connections. They act as the intermediary between an application's generic socket and the transport layer protocol. Generic BSD Sockets are more abstract structures that contain INET sockets. Applications read from and write to BSD sockets; the BSD sockets translate the operations into INET socket operations. See Chapter 4 for more on sockets. Applications, run in user space, form the top level of the protocol stack; they can be as simple as two-way chat connection or as complex as the Routing Information Protocol (RIP - see Chapter 9). 2.3. Packet Structure The key to maintaining the strict layering of protocols without wasting time copying parameters and payloads back and forth is the common packet data structure (a socket buffer, or sk_buff - Figure 2.2)'''
