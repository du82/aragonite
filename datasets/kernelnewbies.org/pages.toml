full_description = '''Mailing Lists This is a list of mailing lists you might find useful. Feel free to suggest more! Mailing list Guidelines IMPORTANT: Before starting posting on kernelnewbies mailing list(or other mailing lists for that matter) you are expected to read the following guidelines: http://kernelnewbies.org/mailinglistguidelines Most of these lists can be searched via the http://marc.info/ archive. To subscribe to the kernelnewbies mailing list, fill out the form at: https://lists.kernelnewbies.org/mailman/listinfo/kernelnewbies Various Topics Kernelnewbies : Discussion of kernel coding for beginners Homepage : http://kernelnewbies.org Subscription : http://lists.kernelnewbies.org/mailman/listinfo/kernelnewbies Archive : http://lists.kernelnewbies.org/pipermail/kernelnewbies/ Procmail rule : :0 * ^List-Id:.*kernelnewbies.kernelnewbies.org Mail/kernelnewbies Linux Kernel Mailing List : The MAIN List Homepage : https://lore.kernel.org/lkml/ Subscription : 'echo subscribe linux-kernel | mail majordomo@vger.kernel.org' Archive : http://marc.info/?l=linux-kernel Procmail rule : :0 * ^Sender:\ linux-kernel-owner@vger\.kernel\.org Mail/linux-kernel Linux filesystem development Homepage : [None listed] Subscription : 'echo subscribe linux-fsdevel | mail majordomo@vger.kernel.org' Archive : https://lore.kernel.org/linux-fsdevel/ or http://marc.info/?l=linux-fsdevel Procmail rule : :0 * ^Sender:\ linux-fsdevel-owner@vger\.kernel\.org Mail/linux-fsdevel netdev : Linux network development list Subscription : 'echo subscribe netdev | mail majordomo@vger.kernel.org' Archive : https://lore.kernel.org/netdev/ or http://www.spinics.net/lists/netdev/ Procmail rule : :0 * ^X-Maling-List:.*netdev@vger\.kernel\.org Mail/netdev linux-net : Linux networking user list Subscription : 'echo subscribe linux-net | mail majordomo@vger.kernel.org' Archive : http://marc.info/?l=linux-net Procmail rule : :0 * ^Sender:\ linux-net-owner@vger\.kernel\.org Mail/linux-net linux-raid : Lin