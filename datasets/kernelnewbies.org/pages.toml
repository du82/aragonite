["https://kernelnewbies.org/UpcomingEvents"]
title = "UpcomingEvents - Linux Kernel Newbies"
full_description = '''Want to take a live, hands-on kernel development tutorial? There are several regularly scheduled events where you can write a working driver or get your kernel hacking questions answered. LinuxSymposium The Linux Symposium is a core technology conference, targeting software developers working on the Linux kernel, OS infrastructure, security, networking, and related research projects. With attendees coming from over 30 different countries, the Symposium is the single most comprehensive collection of Linux experts in the world. 2006's tutorials included "A Step by Step Introduction to Writing (or Understanding) a Linux Filesystem", "Write a real, working Linux driver" and "Reverse Engineering USB Drivers for Compatibility". Held in Ottawa, Canada once a year, sometime during the summer months (June-August) Here's their archive of proceedings which is basically a collection of very informative articles LinuxWorld Conference and Expo LinuxWorld (soon to be OpenSourceWorld in 2009) features comprehensive educational and technical programming on Linux and open source technology. One tutorial was "Write a real, working Linux driver". Held in San Francisco, California, USA once a year during August FreedomHEC The hardware unconference where you'll learn how easy it is to make your hardware compatible with free, open source operating systems such as Linux, and available to new markets such as servers, next-generation entertainment devices, and more. Get answers on everything from kernel data structures to the fine points of licensing. Discover how participating in the Linux process is fast and simple, how the development process works, and where to get started. Held in different cities around the world. FreedomHEC - from the website: "FreedomHEC is the conference where hardware vendors looking for a cost-effective Linux driver strategy can meet Linux driver experts."'''
