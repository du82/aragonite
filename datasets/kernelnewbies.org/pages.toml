title = "LinuxChanges - Linux Kernel Newbies"
description = "Summary of the changes and new features merged in the Linux Kernel during the 2.6.x and 3.x development"
full_description = '''Changes done in each Linux kernel release. Other places to get news about the Linux kernel are LWN kernel status or the Linux Kernel mailing list (there is a web interface in www.lkml.org or lore.kernel.org/lkml). The lore.kernel.org/lkml/ archive is also available via NTTP if you prefer to use a newsreader: use nntp://nntp.lore.kernel.org/org.kernel.vger.linux-kernel for that. List of changes of older releases can be found at LinuxVersions. If you're going to add something here look first at LinuxChangesRules! You can discuss the latest Linux kernel changes on the New Linux Kernel Features Forum. Linux 6.13 has been released on Sunday, 19 Jan 2025. Summary: This release includes a new lazy preemption model that provides more preemption opportunities than the voluntary preemption mode used often as default, but not as many as the full preemption mode. There is also support for fine-grained timestamps, without the performance overhead that would often come with providing high-resolution timestamps for every single file; lightweight guard pages; support for storage with atomic writes in XFS and Ext4; support for NAPI suspension during idle periods; a new networking device API to configure TX H/W shaping; various io_uring improvements; ARM support for running Linux in a protected VM under the Arm Confidential Compute Architecture; ARM support for user-space shadow stacks; and a referenced counting mechanism for files that is slightly more scalable. As always, there are many other features, new drivers, improvements and fixes. Also, you might be interested in the LWN merge window report: part 1, part 2 Contents Prominent features Lazy preemption: a bit more of preemption Support for multi-grain file timestamps: fine-grained timestamps, without the performance overhead Support for atomic writes NAPI suspension for more efficient networking New networking device API to configure TX H/W shaping Lightweight guard pages Various io_uring improvements ARM64 virtualization and security improvements Reference counting mechanism for more scalable file operations Core (various) File systems Memory management Block layer Tracing, perf and BPF Virtualization Cryptography Security Networking Architectures Drivers Graphics Power Management Storage Drivers in the Staging area Networking Audio Tablets, touch screens, keyboards, mouses TV tuners, webcams, video capturers Universal Serial Bus Serial Peripheral Interface (SPI) Watchdog Serial CPU Frequency scaling Voltage, current regulators, power capping, power supply Real Time Clock (RTC) Pin Controllers (pinctrl) Multi Media Card (MMC) Memory Technology Devices (MTD) Industrial I/O (iio) Multi Function Devices (MFD) Pulse-Width Modulation (PWM) Inter-Integrated Circuit (I2C + I3C) Hardware monitoring (hwmon) General Purpose I/O (gpio) Leds DMA engines Hardware Random Number Generator (hwrng) Cryptography hardware acceleration PCI Clock PHY ("physical layer" framework) EDAC (Error Detection And Correction) IOMMU Various List of Pull Requests Other news sites 1. Prominent features 1.1. Lazy preemption: a bit more of preemption The Linux kernel support four different preemption modes. There is a "full preemption" mode, but since preemption is usually at odds with performance, most Linux kernels default to using the "voluntary preemption" mode, which provides some preemption opportunities, but it's not full preemption. This release adds a "lazy preemption" mode that aims to be a bridge between the voluntary and the full preemption mode. It optimizes fair-class preemption by delaying preemption requests to the tick boundary, while working as full preemption for RR/FIFO/DEADLINE classes. Recommended LWN article: The long road to lazy preemption 1.2. Support for multi-grain file timestamps: fine-grained timestamps, without the performance overhead Some applications (notably, NFS) need higher-resolution timestamps on files, but higher resolution timestamps on all files can increase the rate at which metadata needs to be written to the disk. In this release, Linux adds support for fine-grained timestamps, but only when processes do query that information for a file. This allows for finer-grained timestamps without the performance overhead. Documentation: Multigrain Timestamps Recommended LWN article: Rethinking multi-grain timestamps 1.3. Support for atomic writes There is some hardware that supports atomic write operations, by which we mean writes to write data that is larger than the storage's sector size in an atomic way. This release adds support for atomic writes in XFS, Ext4's Direct I/O, and some md RAID modes. Recommended LWN article: Atomic writes without tears 1.4. NAPI suspension for more efficient networking Interrupt mitigation in networking loads can be accomplished with busy polling, and can be quite efficient, but it cannot effectively support both low- and high-load situations. This release adds a new packet delivery mode that properly alternates between busy polling and interrupt-based delivery depending on busy and idle periods of the application. During a busy period, the system operates in busy-polling mode, which avoids interference. During an idle period, the system falls back to interrupt deferral, but with a small timeout to avoid excessive latencies 1.5. New networking device API to configure TX H/W shaping There is a plurality of shaping-related drivers API, but none flexible enough to meet existing demand from vendors. This release introduces new device APIs to configure in a flexible way TX H/W shaping. The new functionalities are exposed via a newly defined generic netlink interface and include introspection capabilities. API documentation: Family net-shaper netlink specification 1.6. Lightweight guard pages A guard page is a page that, when accessed, cause a fatal signal to arise. Installing a guard page in certain places can be useful in various situations. Currently users must establish PROT_NONE ranges to achieve this, but this is costly memory-wise - it needs a VMA for each and every one of these regions AND they become unmergeable with surrounding VMAs This release implements a MADV_GUARD_INSTALL flag for the madvise() system call which implements a guard page, but without that overhead, thus making it cheaper and easier to use these pages. 1.7. Various io_uring improvements This release adds support for various io_uring features: Add support for ring resizing, so apps can start with a small ring and grow it as needed Support for sending a sync message to another ring, without having a ring available to send a normal async message Add support for just doing partial buffer clones, rather than always cloning the entire buffer table Add support for fixed wait regions, rather than needing to copy the same wait data tons of times for each wait operation Add static NAPI support, where a specific NAPI instance is used rather than having a list of them available that need lookup Regions, param pre-mapping and reg waits extension: it's a better and more generic API for ring/memory/region registration, and it changes the API extending registered waits to be a generic parameter passing mechanism. That will be useful in the future to implement a more flexible rings creation, especially when we want to share same huge page / mapping Add support for hybrid IO polling, which is a variant of strict IOPOLL but with an initial sleep delay to avoid spinning too early and wasting resources on devices that aren't necessarily in the < 5 usec category wrt latencies 1.8. ARM64 virtualization and security improvements This release adds support in the ARM architecture for: Running Linux in a protected VM under the Arm Confidential Compute Architecture (CCA) (Arm Confidential Compute Architecture documentation) Support for Guarded Control Stack in userspace (ARM's implementation of shadow stacks), which provides support for hardware protected stacks of return addresses, intended to provide hardening against return oriented programming (ROP) attacks and to make it easier to gather call stacks for applications such as profiling. 1.9. Reference counting mechanism for more scalable file operations This release introduce a new reference counting mechanism for files. It gives consistent improvement up to 3-5% on workloads with loads of threads 2. Core (various) (FEATURED) Lazy preemption commit, commit, commit, commit cgroup: Exposing nice CPU usage to userspace commit, commit fanotify: allow reporting errors on failure to open fd commit fcntl: make F_DUPFD_QUERY associative commit Add fs.dentry-negative sysctl for automated deletion of dentry, this sets the policy for negative dentries, and whether to always delete the dentry when a file is removed or not, since this can affect performance commit fs/file.c: optimize the critical section of file_lock in commit, commit, commit Add the four syscalls setxattrat(), getxattrat(), listxattrat() and removexattrat(). Those can be used to operate on extended attributes, especially security related ones, either relative to a pinned directory or on a file descriptor without read access, avoiding a /proc/<pid>/fd/<fd> detour, requiring a mounted procfs. Part of a small-scale attempt at sanitizing the interplay between io_uring and normal syscalls commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit Introduce file_ref_t (for better scalability) commit, commit, commit, commit (FEATURED) fs: multigrain timestamp commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit pidfd: add ioctl to retrieve pid info commit statmount() Allow statmount() to fetch the fs_subtype and sb_source commit, commit, commit, commit Add flag to retrieve unescaped options commit Retrieve security mount options commit Add API (AT_HANDLE_CONNECTABLE) for exporting NFS connectable file handles to userspace commit, commit, commit, commit (FEATURED) io_uring Add support for ring resizing. It can be hard to appropriately size the CQ ring upfront, if the application doesn't know how busy it will be. This results in applications sizing rings for the most busy case, which can be wasteful. With ring resizing, they can start small and grow the ring, if needed commit, commit, commit, commit Support for sending a sync message to another ring, without having a ring available to send a normal async message commit Add support for fixed wait regions, rather than needing to copy the same wait data tons of times for each wait operation commit, commit, commit Rewrite the resource node handling, which before was serialized per ring commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit Add static NAPI support, where a specific NAPI instance is used rather than having a list of them available that need lookup commit, commit, commit, commit, commit, commit Regions, param pre-mapping and reg waits extension: it's a better and more generic API for ring/memory/region registration, and it changes the API extending registered waits to be a generic parameter passing mechanism. That will be useful in the future to implement a more flexible rings creation, especially when we want to share same huge page / mapping commit, commit, commit, commit, commit, commit Add support for hybrid IO polling, which is a variant of strict IOPOLL but with an initial sleep delay to avoid spinning too early and wasting resources on devices that aren't necessarily in the < 5 usec category wrt latencies commit Add support for just doing partial buffer clones, rather than always cloning the entire buffer table commit, commit Limit local tw done commit, commit Use a dedicated thread for timer wakeups with forced-threading. commit, commit hung_task: Add detect count for hung tasks commit, commit posix-timers: Cure the SIG_IGN mess commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit RCU: Torture-test changes for v6.13 commit, commit, commit, commit, commit rtla: Support idle state disabling via libcpupower in timerlat commit, commit, commit, commit, commit, commit rust: Add PidNamespace commit File abstractions needed by Rust Binder commit, commit, commit, commit, commit, commit, commit, commit, commit Tracepoints and static branch in Rust commit, commit, commit, commit, commit Add seqfile abstraction commit Generic Allocator support commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit Device / Driver PCI / Platform Rust abstractions commit, commit, commit lock: add trylock method support for lock backend commit Use custom FFI integer types commit, commit, commit sched Improve cache locality of RSEQ concurrency IDs for intermittent workloads commit Preparatory changes for Proxy Execution v13 commit, commit, commit, commit, commit, commit, commit sched_ext: Introduce LLC awareness to the default idle selection policy commit sched_ext: Introduce NUMA awareness to the default idle selection policy commit selinux: Deprecate /sys/fs/selinux/user commit prepare sysctl core for const struct ctl_table commit, commit, commit, commit, commit, commit workqueue: Reduce expensive locks for unbound workqueue commit Enhance min heap API with non-inline functions and optimizations commit, commit, commit, commit, commit, commit kbuild Add generic support for built-in boot DTBs commit, commit Support building external modules in a separate build directory commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit Switch from lz4c to lz4 for compression commit Add AutoFDO and Propeller support for Clang build commit, commit, commit, commit, commit, commit, commit debugfs: add small file operations for most files commit, commit debugobjects: Rework object handling commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit 3. File systems Btrfs Add io_uring command for encoded reads (ENCODED_READ ioctl) commit Add new ioctl to wait for cleaned subvolumes commit Convert delayed head refs to xarray and cleanups commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit, commit Reduce extent tree lock contention when searching for inline backref commit Reduce lock contention when traversing extent buffers commit Make extent map shrinker more efficient and re-enable it commit, commit, commit, commit, commit Some folio conversion pieces commit, commit XFS (FEATURED) Block atomic writes for xfs commit, commit, commit, commit, commit, commit, commit, commit Co'''
