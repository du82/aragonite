full_description = 'The Linux Kernel Mailing List Podcast aims to provide a semi-daily summary of ongoing discussion on the Linux Kernel Mailing List (LKML), condensed to within 3-5 minutes. It is intended to help listeners with busy schedules keep up with the list traffic but it does not provide "news" coverage per se. Detailed technical analysis and articles on new features are already provided by the (excellent) Linux Weekly News website, and by other projects, such as KernelNewbies. Transcripts Please visit http://www.kernelpodcast.org/ for further information, to give feedback, and for complete transcripts. Subscribing Please add the following URL to your Podcast software: http://podcasts.jonmasters.org/kernel/kernel.xml You can also search websites such as Podcast.com and iTunes for "Linux Kernel". Older Transcripts The following transcripts are available: KernelPodcast20090614 KernelPodcast20090611 KernelPodcast20090610 KernelPodcast20090609 KernelPodcast20090608 KernelPodcast20090607 KernelPodcast20090604 KernelPodcast20090603 KernelPodcast20090602 KernelPodcast20090601 KernelPodcast20090531 KernelPodcast20090528 KernelPodcast20090527 KernelPodcast20090526 KernelPodcast20090525 KernelPodcast20090521 KernelPodcast20090520 KernelPodcast20090519 KernelPodcast20090518 KernelPodcast20090517 KernelPodcast20090515 KernelPodcast20090514 KernelPodcast20090513 KernelPodcast20090512 KernelPodcast20090511 KernelPodcast20090510'
