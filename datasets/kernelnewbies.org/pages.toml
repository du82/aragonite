["https://kernelnewbies.org/IRC"]
title = "IRC - Linux Kernel Newbies"
full_description = "Start your favorite IRC client /server irc.oftc.net /join #kernelnewbies Ask what you want to know without asking permission to ask and keep the discussion ontopic (i.e. about kernel programming). Alternatively try this URL: irc://irc.oftc.net/kernelnewbies (should work with many browser / IRC client combinations) Intro to IRC IRC (Internet Relay Chat) is communication network. Users can talk together in realtime, each user has a nick. There are rooms (called channels) on IRC, their names begin with #. For more information browse to http://www.irchelp.org/. Kernel newbies are gathered on #kernelnewbies on irc.oftc.net. This channel is about kernel development, its internals and so on. For general Linux discussion please go to other channels like #linux, or one with the name of your favorite Linux distribution. How to simply join #kernelnewbies IRC Kernel newbies are using IRC network at OFTC.net. If you don't have a favorite IRC client (or you don't know any), choose one: xchat (GUI, gtk, runs under Linux other Unices and also Windows) irssi (text only, Linux & Unices) kvirc (GUI, kde, Linux & Unices) ksirc (GUI, kde, Linux & unices) konversation (GUI, kde, Linux & Unices) BitchX (text only, Linux & Unices) Pidgin (GUI, gtk) webchat Upon first start, some clients popup a window with serverlist. If you don't want to play with it and click, close it and you'll probably find one line at the bottom that looks like a command line. Enter there: /server irc.oftc.net This will connect you to the server. /join #kernelnewbies You will join the channel and you can talk to us"
