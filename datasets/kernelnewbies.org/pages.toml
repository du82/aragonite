rite('<a href="#" onclick="return togglenumber(\'CA-3d30ba5d911a934b8f23cf37420a5aa4fa48e4da\', 1, 1);" \ class="codenumbers">Toggle line numbers<\/a>'); 1 def syntax(highlight): 2 print "on" 3 return None Linking HelpOnEditing InterWiki http://futeboltrading.com http://moinmoin.wikiwikiweb.de/ someone@the.inter.net Image Link Smileys Lists Bullet first nested and numbered numbered lists are renumbered second third mal sehen blockquote deeper Glossary TermDefinition Drawing Heading 1 Heading 2 Heading 3 [[http://milkcoree.com/| milkcoree]] Heading 4 besonders gross document.write('<a href="#" onclick="return togglenumber(\'CA-dfacaa347b1238c293fc24cb7628a094fcb11a6c\', 1, 1);" \ class="codenumbers">Toggle line numbers<\/a>'); 1 #!/usr/bin/perl (-) 2 print "Hello World!" ПростоТест IRC Log test Log test Online document.write('<a href="#" onclick="return togglenumber(\'CA-c317f514d3c6aa37846e087d0b019c509900057c\', 1, 1);" \ class="codenumbers">Toggle line numbers<\/a>'); 1 (23:18) < jroes> ah 2 (23:19) < jroes> hm, i like the way {{{ works, but i was hoping the lines would wrap 3 (23:21) -!- gpciceri [~gpciceri@host181-130.pool8248.interbusiness.it] has quit [Read error: 110 (Connection timed out)] 4 (23:36) < ThomasWal> you could also write a parser or processor 5 (23:38) < jroes> i could? 6 (23:38) < jroes> would that require modification on the moin end though? 7 (23:38) < jroes> i cant change the wiki myself :x 8 (23:39) < ThomasWal> parsers and processors are plugable 9 (23:39) < ThomasWal> so you dont need to change the core code 10 (23:40) < ThomasWal> you need to copy it to the wiki data directory though 11 (23:40) < jroes> well, what i meant to say was that i dont have access to the box running the wiki 12 (23:40) < ThomasWal> then this is no option awdsd asdasd sa asdasd sad asdadasds adasd asd asd asd asd asd a dadad ad adad ad asd asd adad asdasd asd adad as d 13 (23:40) < jroes> yeah :/ 14 (23:50) < sarnold> What'd I miss? 15 Hi there :) The devil here. 