["https://kernelnewbies.org/Outreachyfirstpatch"]
title = "Outreachyfirstpatch - Linux Kernel Newbies"
full_description = '''Hooray! Thanks for your interest in working on the Linux kernel. Use this tutorial to create your first patch to the Linux kernel. Intro If you run into any issues with this tutorial, please ask questions on the Outreachy mailing list: Email to: outreachy@lists.linux.dev Subscribe: outreachy+subscribe@lists.linux.dev More subscriber options: outreachy+subscribe@lists.linux.dev View the archive: https://lore.kernel.org/outreachy/ Support can also be found on #kernel-outreachy IRC channel on irc.oftc.net. Please make sure to set your real name in your IRC client, so that we can correlate names and emails with irc handles. Note that the Linux kernel is GPLv2. Contributions that include content generated by AI tools that may rely on sources that are not compatible with GPLv2 thus cannot be accepted into the Linux kernel. This includes ChatGPT. Contribution Instructions Our community requires 2 types of contributions: 1) Community-wide Cleanup patches: A few cleanup patches need to be accepted into staging/testing before moving on to the Project Starter Tasks. The cleanup patches are restricted to drivers/staging. However, do not submit patches for drivers/staging/media to Outreachy. 2) Project Starter Tasks (starter tasks, small tasks) The project mentors may suggest starter tasks that lead to patches outside of staging/drivers. Mentors and applicants, please only work beyond staging if necessary. The turn-around on patches can be too slow for our brief contribution period. All patches from Outreachy applicants must be sent to the Outreachy Mailing List ( outreachy@lists.linux.dev ), as well as to the recipients you retrieve using get_maintainer.pl. Information about how to use get_maintainer.pl is below. If you have any questions about any aspect of the patch submission process, please ask on the mailing list. Intro This tutorial will cover how to get your first patch submitted. You have three choices for how to complete this tutorial: Run Linux in VMPlayer from Windows. Run Linux natively on your own machine. Run Linux within VMPlayer on Linux. We recommend running Linux natively. Most Linux kernel developers run Linux natively, so you may as well get used to it. If you want to run Linux in VMPlayer, follow these directions. Note, you will not be able to compile the Linux kernel on a Mac, because the filesystem defaults to case-insensitive. This tutorial assumes you are running Ubuntu or Debian. If you are running Fedora, Suse, Arch, or Gentoo, the package installation commands or package names may be slightly different. Ask for help on #kernelnewbies on irc.oftc.net if you get stuck. If (and only if) you are an applicant for Outreachy, then you should ask for help on #kernel-outreachy on irc.oftc.net. Additionally, we highly recommend that applicants have a stable internet connection, with no download caps. Communication over IRC can be difficult if your internet connection keeps dropping or has a big lag time, so you need a stable internet connection. Downloading the initial kernel will use over 5 GB of data, which will easily blow through a standard 3G capped plan. We recommend making sure you have cable internet, or an unlimited 3G plan. Overview This tutorial will show you how to: Setup your tools Explore the kernel tree Play with some git basics Update your kernel Make a driver change Start creating your first patch Understand patch best practices Find a driver to clean up Committing your changes Submit a patch Responding to emails Revising your patches Submitting a patchset Setup your tools You'll need to install, configure, and download some software to get started. You should follow the setup directions here. Setup vim (Note, if you're running a native Linux install and you're used to another editor like emacs or nano, you can still use that editor, and you can skip this step. You may not be able to use gvim.) Tip: Vim is a simple text editor that has a couple modes. It starts out in standard mode, and you can move the cursor down or up with the arrow keys (or the 'j' or 'k' keys), and move the cursor left or right with the arrow keys (or the 'h' and 'l' keys). You can go into "Insert mode" by typing 'i'. Now you can change text. To get back into standard mode, type <Escape>. To write a file, get into standard mode, and type :w<enter>. To quit vim, type :q<enter>. If you want to learn more about vim, the VIM adventures game is quite fun. First, we need to make sure to enable the C indentation module in our default text editor (vim). Turning on this module will ensure that lines automatically get indented to the right level as you're editing. It saves you from hitting <tab> a lot. You can turn on automatic indentation based on the file type. First run: vim ~/.vimrcThen add this line: filetype plugin indent onYou'll also want to add a couple more lines, to turn syntax highlighting on, and show the file name in the terminal title bar: syntax on set titleMost distributions compile vim so that 8 space tabs are the default. If you find they're not the default, you will need to add the following line to your .vimrc: set tabstop=8 set softtabstop=8 set shiftwidth=8 set noexpandtabThat's equivalent to running this command in vim: :set tabstop=8 softtabstop=8 shiftwidth=8 noexpandtab Setup vim as your default editor Next, we'll need to set up mutt to use vim as the default editor, instead of nano. Run: sudo update-alternatives --config editorand chose /usr/bin/vim.basic as the default editor. Set up email To be able to send Linux kernel patches, you'll need to be able to send email from the Linux VM image (or your computer that is natively running Linux). The VM image comes installed with esmtp, and if you were following the native Linux install directions you should have that installed on your computer as well. Esmtp is a mail transport agent. It routes email to your mail server, such as gmail. To know what information to give esmtp, you will need to look up your mail server settings. You will also need to install an approved email client, and use it to respond to message on the outreachy-kernel mailing list. These instructions assume you're using mutt, but you may find a GUI mail client like Evolution to be easier to use. Gmail set up In gmail, go click the gear icon, go to "Settings", go to the tab "Forwarding POP/IMAP", and click "Enable IMAP", then click on "Save Changes". Then click the "Configuration instructions" link at the very bottom of the page. Note the outgoing mail server information in "Step 2", and copy it into the .esmtprc file, as shown in the next section. Next, make sure two-step verification is enabled on your gmail account, then generate and use App Password. Yahoo set up In yahoo, go click on your account icon (top right, above "Settings" and to the left of "Home"). Click on "Account info" and then go to "Account security". (You may have to sign in again for this step.) Scroll down to the setting "Allow apps that use less secure sign-in" and turn it on. If you have two-step verification or account key enabled, you will also need to use App Password. Configure esmtp Note: If you already have another mail transfer agent (MTA) installed, you do not need to install esmtp. Instead, change the .muttrc file "sendmail" line to be the path to your MTA. Mutt uses ssmtp by default, so if your MTA is ssmtp, you can leave that line out entirely. First, create a .esmtprc file with the right permissions: touch ~/.esmtprc chmod g-rwx ~/.esmtprc chmod o-rwx ~/.esmtprcEdit the .esmtprc in your home directory, and add lines like this: identity "my.email@gmail.com" hostname smtp.gmail.com:587 username "my.email@gmail.com" password "ThisIsNotARealPassWord" starttls required (For Yahoo mail, replace hostname line with: hostname smtp.mail.yahoo.com:587Next, set up the mail client, mutt, with some defaults, by creating a .muttrc file in your homedirectory: set sendmail="/usr/bin/esmtp" set envelope_from=yes set from="Your Name <my.email@gmail.com>" set use_from=yes set edit_headers=yes Test your email setup Next, let's send a test email message with mutt. Run this command: muttSay "no" to creating an inbox for now. Type 'm' to create a new message. Specify your own email address (or a secondary email) to send the test message to. Set the Subject however you want to. Type a message in the body, and then save and quit. Hit 'y' to send the message, hit 'e' to edit the message again, or hit 'q' to abort sending the message. Look in your email to double check you received a message. If you send the email to yourself, for some mail services like gmail, the message will not show up in your inbox, and you will have to look in your Sent Mail folder. If mutt is not working, try mutt -d 2This will cause the creation of files with names beginning .muttdebug, followed by 0, 1, etc., that can help you find the problem. Setup git First, you need to tell git what your name and email address is, so that it can be used in the authorship information in the git commit. Create a file called .gitconfig and add lines like these to it: [user] name = Your Name email = your.email@example.com Make sure that the email you specify here is the same email you used to set up sending mail. The Linux kernel developers will not accept a patch where the "From" email differs from the "Signed-off-by" line, which is what will happen if these two emails do not match. Make sure you store your full, legal name in the 'name' line. By adding your Signed-off-by line to a patch, you are certifying that you have read and understood the Developer's Certificate of Origin. Please read through that document before you send patches to the kernel. Explore the kernel tree First, open a terminal, by clicking the black screen icon with the ">_" text in it. Tip: You can exit out of a terminal tab or window by pressing <CTRL>d at any time. This is the recommended way of closing the terminal, since it won't kill any processes you have running in the background. Get used to exiting the terminal this way by opening and closing the terminal a couple times. Change directories to your git checkout you set up earlier: cd git/kernels/staging/This is the Linux kernel tree. You can explore it by using the `ls` and `cd` commands. If you run `ls`, you'll see several different folders: intern@ubuntu:~/git/kernels/staging$ ls COPYING Documentation Kconfig Makefile arch certs drivers fs init kernel mm samples security tools virt CREDITS Kbuild MAINTAINERS README block crypto firmware include ipc lib net scripts sound usrThere's more to this directory than meets the eye! If you run ls -A, you'll see there's a hidden directory called .git. This contains all the meta information that git uses to track branches, remote repositories, and changes to files in the local directory. You can view the commit history by running git logIf you want a more compact form, you can run a command to see just the "short description" for each commit, with an abbreviated git commit ID: git log --oneline Play with some git basics Git is a distributed revision control system, which means you can hack on your version of the code without having to coordinate with other developers. Think of your git checkout as a separate copy of the kernel respository. Git includes support for branches. Each branch can contain a completely different set of patches. Kernel developers typically use one branch per patchset. For example, you might have one branch that includes bug fixes, and another branch that contains commits for a new feature you're working on. You can run `git branch` to see which branch you're on, and what other branches are available: intern@ubuntu:~/git/kernels/staging$ git branch * staging-testing In this case, there is only one branch, called staging-testing. The star indicates that the "staging-testing" branch is the one you are currently on. In git speak, we say that you currently have the master branch "checked out". Create a new branch called 'first-patch', and checkout that branch by running: git checkout -b first-patchNow if you run git branch, you'll see that there are two branches, and you are currently on the "first-patch" branch: intern@ubuntu:~/git/kernels/staging$ git branch staging-testing * first-patch You can also use the git branch command to show branches on the staging remote repository. Run the command: intern@ubuntu:~/git/kernels/staging$ git branch -a * first-patch staging-testing remotes/origin/HEAD -> origin/master remotes/origin/master remotes/origin/staging-linus remotes/origin/staging-next remotes/origin/staging-testing remotes/origin/testThe first remote repository that is used to create the git checkout is called "origin". For now, just remember that "origin" means Greg Kroah-Hartman's staging git repository. Here, you can see the staging remote has five branches: master, staging-linus, staging-next, staging-testing, and test. The staging-linus branch contains bug fix patches for the current kernel release candidate, and the staging-next branch contains patches for the next kernel release. Your patches will all go into staging-testing (since they will be code clean up, not bug fixes), so you want to base all your branches on the staging-testing branch. Greg first applies patches to staging-testing. They are moved to staging-next shortly thereafter. Update your kernel When you create your first application clean-up patches, you want to create them on top of the latest commit from the staging-testing tree. If your patch is out-of-date and doesn't apply to the latest tree, it may be rejected. You'll need to use git to fetch the latest changes: git fetch originThe third word in that command is the name of the remote repository you are fetching from. In this case, it's origin, which is the remote repository we initially cloned from (the staging repository). That command will fetch the changes from the remote, but it won't actually change in files in the working copy (i.e. the files in this directory). If you run: git logYou will see that your current working directory still points to the original commit. So where are the staging tree current changes? The answer is that git stores the changes in a special hidden directory called .git. You can view the history of the staging repository by giving git log the "staging-testing" branch of the "origin" remote repository: git log origin/staging-testingNext, we need to update our branch to include the changes in the staging tree. The safest way to do this is to "rebase" your branch. This means that if you have any commits on your branch, they will be placed on top of the staging tree commits. Sometimes you may have to edit your commits if there are conflicts, but you should ask your mentor for help with this. For now, run: git rebase origin/staging-testingIf you run `git log` to show your staging branch history and then `git log origin/staging-testing` to show the staging-testing branch history, you should see that they have exactly the same co'''
