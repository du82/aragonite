title = "HelpOnMoinWikiSyntax - Linux Kernel Newbies"
full_description = "Moin Wiki Syntax Contents Moin Wiki Syntax Headings and table of contents Text Formatting Hyperlinks Internal Links External Links Avoid or Limit Automatic Linking Drawings TWikiDraw AnyWikiDraw Blockquotes and Indentations Lists Unordered Lists Ordered Lists with Numbers with Roman Numbers with Letters Definition Lists Horizontal Rules Tables Tables Cell Width Spanning Rows and Columns Alignment of Cell Contents Coloured Table Cells HTML-like Options for Tables Macros and Variables Macros Variables Smileys and Icons Parsers Verbatim Display Syntax Highlighting Using the wiki parser with css classes Admonitions Comments This page aims to introduce the most important elements of MoinMoin's syntax at a glance, showing first the markup verbatim and then how it is rendered by the wiki engine. Additionally, you'll find links to the relative help pages. Please note that some of the features depend on your configuration. Headings and table of contents see: HelpOnHeadlines Table of contents: <<TableOfContents()>> Table of contents (up to 2nd level headings only): <<TableOfContents(2)>> = heading 1st level = == heading 2nd level == === heading 3rd level === ==== heading 4th level ==== ===== heading 5th level ===== ====== no heading 6th level ======Table of contents: Contents heading 1st level heading 2nd level heading 3rd level heading 4th level heading 5th level no heading 6th level Table of contents (up to 2nd level headings only): Contents heading 1st level heading 2nd level heading 1st level heading 2nd level heading 3rd level heading 4th level heading 5th level no heading 6th level Text Formatting see: HelpOnFormatting Markup Result ''italic'' italic '''bold''' bold `monospace` monospace {{{code}}} code __underline__ underline ^super^script superscript ,,sub,,script subscript ~-smaller-~ smaller ~+larger+~ larger --(stroke)-- stroke Hyperlinks see: HelpOnLinking Internal Links Markup Result FrontPage FrontPage [[FrontPage]] FrontPage HelpOnEditing/SubPages HelpOnEditing/SubPages /SubPage /SubPage ../SiblingPage ../SiblingPage [[FrontPage|named link]] named link [[#anchorname]] #anchorname [[#anchorname|description]] description [[PageName#anchorname]] PageName#anchorname [[PageName#anchorname|description]] description [[attachment:filename.txt]] filename.txt External Links Markup Result http://moinmo.in/ http://moinmo.in/ [[http://moinmo.in/]] http://moinmo.in/ [[http://moinmo.in/|MoinMoin Wiki]] MoinMoin Wiki [[http://static.moinmo.in/logos/moinmoin.png]] http://static.moinmo.in/logos/moinmoin.png {{http://static.moinmo.in/logos/moinmoin.png}} [[http://static.moinmo.in/logos/moinmoin.png|moinmoin.png]] moinmoin.png MeatBall:InterWiki InterWiki [MeatBall:InterWiki|InterWiki page on MeatBall]] InterWiki page on MeatBall [[file://///server/share/filename%20with%20spaces.txt|link to filename.txt]] link to filename.txt user@example.com user@example.com Avoid or Limit Automatic Linking Markup Result Wiki''''''Name WikiName Wiki``Name WikiName !WikiName WikiName WikiName''''''s WikiNames WikiName``s WikiNames `http://www.example.com` http://www.example.com [[http://www.example.com/]]notlinked http://www.example.com/notlinked Drawings see: HelpOnDrawings TWikiDraw AnyWikiDraw Blockquotes and Indentations indented text text indented to the 2nd levelindented text text indented to the 2nd level Lists see: HelpOnLists Unordered Lists * item 1 * item 2 (preceding white space) * item 2.1 * item 2.1.1 * item 3 . item 3.1 (bulletless) . item 4 (bulletless) * item 4.1 . item 4.1.1 (bulletless)item 1 item 2 (preceding white space) item 2.1 item 2.1.1 item 3 item 3.1 (bulletless) item 4 (bulletless) item 4.1 item 4.1.1 (bulletless) Ordered Lists with Numbers 1. item 1 1. item 1.1 1. item 1.2 1. item 2item 1 item 1.1 item 1.2 item 2 with Roman Numbers I. item 1 i. item 1.1 i. item 1.2 I. item 2item 1 item 1.1 item 1.2 item 2 with Letters A. item A a. item A. a) a. item A. b) A. item Bitem A item A. a) item A. b) item B Definition Lists term:: definition object:: :: description 1 :: description 2termdefinition objectdescription 1 description 2 Horizontal Rules see: HelpOnRules ---- ----- ------ ------- -------- --------- ---------- Tables see: HelpOnTables Tables ||'''A'''||'''B'''||'''C'''|| ||1 ||2 ||3 || A B C 1 2 3 Cell Width ||minimal width ||<99%>maximal width || minimal width maximal width Spanning Rows and Columns ||<|2> cell spanning 2 rows ||cell in the 2nd column || ||cell in the 2nd column of the 2nd row || ||<-2> cell spanning 2 columns || ||||use empty cells as a shorthand || cell spanning 2 rows cell in the 2nd column cell in the 2nd column of the 2nd row cell spanning 2 columns use empty cells as a shorthand Alignment of Cell Contents ||<^|3> top (combined) ||<:99%> center (combined) ||<v|3> bottom (combined) || ||<)> right || ||<(> left || top (combined) center (combined) bottom (combined) right left Coloured Table Cells ||<#0000FF> blue ||<#00FF00> green ||<#FF0000> red || ||<#00FFFF> cyan ||<#FF00FF> magenta ||<#FFFF00> yellow || blue green red cyan magenta yellow HTML-like Options for Tables ||A ||<rowspan=\"2\"> like <|2> || ||<bgcolor=\"#00FF00\"> like <#00FF00> || ||<colspan=\"2\"> like <-2>|| A like <|2> like <#00FF00> like <-2> Macros and Variables Macros see: HelpOnMacros <<Anchor(anchorname)>> inserts a link anchor anchorname <<BR>> inserts a hard line break <<FootNote(Note)>> inserts a footnote saying Note <<Include(HelpOnMacros/Include)>> inserts the contents of the page HelpOnMacros/Include inline <<MailTo(user AT example DOT com)>> obfuscates the email address user@example.com to users not logged in Variables see: HelpOnVariables @SIG@ inserts your login name and timestamp of modification @TIME@ inserts date and time of modification Smileys and Icons see: HelpOnSmileys Markup Display Markup Display Markup Display Markup Display X-( :D <:( :o :( :) B) :)) ;) /!\\ <!> (!) :-? :\\ >:> |) :-( :-) B-) :-)) ;-) |-) (./) {OK} {X} {i} {1} {2} {3} {*} {o} Parsers see: HelpOnParsers Verbatim Display {{{ def hello(): print \"Hello World!\" }}}def hello(): print \"Hello World!\" Syntax Highlighting {{{#!highlight python def hello(): print \"Hello World!\" }}} function isnumbered(obj) { return obj.childNodes.length && obj.firstChild.childNodes.length && obj.firstChild.firstChild.className == 'LineNumber'; } function nformat(num,chrs,add) { var nlen = Math.max(0,chrs-(''+num).length), res = ''; while (nlen>0) { res += ' '; nlen-- } return res+num+add; } function addnumber(did, nstart, nstep) { var c = document.getElementById(did), l = c.firstChild, n = 1; if (!isnumbered(c)) { if (typeof nstart == 'undefined') nstart = 1; if (typeof nstep == 'undefined') nstep = 1; var n = nstart; while (l != null) { if (l.tagName == 'SPAN') { var s = document.createElement('SPAN'); var a = document.createElement('A'); s.className = 'LineNumber'; a.appendChild(document.createTextNode(nformat(n,4,''))); a.href = '#' + did + '_' + n; s.appendChild(a); s.appendChild(document.createTextNode(' ')); n += nstep; if (l.childNodes.length) { l.insertBefore(s, l.firstChild); } else { l.appendChild(s); } } l = l.nextSibling; } } return false; } function remnumber(did) { var c = document.getElementById(did), l = c.firstChild; if (isnumbered(c)) { while (l != null) { if (l.tagName == 'SPAN' && l.firstChild.className == 'LineNumber') l.removeChild(l.firstChild); l = l.nextSibling; } } return false; } function togglenumber(did, nstart, nstep) { var c = document.getElementById(did); if (isnumbered(c)) { remnumber(did); } else { addnumber(did,nstart,nstep); } return false; } document.write('<a href=\"#\" onclick=\"return togglenumber(\\'CA-78c687fbb04d58d5ee5c7f64fd6654a3595f0c88\\', 1, 1);\" \\ class=\"codenumbers\">Toggle line numbers<\\/a>'); 1 def hello(): 2 print \"Hello World!\" Using the wiki parser with css classes {{{#!wiki red/solid This is wiki markup in a '''div''' with __css__ `class=\"red solid\"`. }}}This is wiki markup in a div with css class=\"red solid\". Admonitions see: HelpOnAdmonitions {{{#!wiki caution '''Don't overuse admonitions''' Admonitions should be used with care. A page riddled with admonitions will look restless and will be harder to follow than a page where admonitions are used sparingly. }}}Don't overuse admonitions Admonitions should be used with care. A page riddled with admonitions will look restless and will be harder to follow than a page where admonitions are used sparingly. Comments see: HelpOnComments Click on \"Comments\" in edit bar to toggle the /* comments */ visibility.Click on \"Comments\" in edit bar to toggle the comments visibility. {{{#!wiki comment/dashed This is a wiki parser section with class \"comment dashed\" (see HelpOnParsers). Its visibility gets toggled the same way. }}}This is a wiki parser section with class \"comment dashed\" (see HelpOnParsers). Its visibility gets toggled the same way."
