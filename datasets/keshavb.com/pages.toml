full_description = "Water Treatment Consultant for Hire With my wide-ranging experience in the water and effluent treatment world, I actively consult with various companies, both the manufacturers and users of chemicals and technologies, to help industrial treatment solutions reach the right users, and to help industries and plants find the right solutions and technologies to solve their treatment challenges. Here are the general terms under which I can help. If you are a developer or manufacturer or chemicals and treatment technologies I can help be your contact and representative on the ground in Dubai to explore the market for your solutions. My long career in this field in the region has given me a broad understanding of the market, and contacts in both the usage and services side of things here in Dubai, and the region. If you’re looking to find potential uses and users for your technologies, access to stake-holders and decision makers in the industries, and an exploration of where and how your products can be deployed and marketed, I can provide my expertise in the field. I work on a retainer of a USD 1500 a month. A minimum 2-month commitment and advance payment in full is required. Thereafter to be continued by advance monthly payments to retain my services. If you are an industrial outfit in need of treatment solutions I can help assess your process and plant as it stands, figure out the current obstacles and suggest solutions based on analyses and my expertise. Many industries need regular troubleshooting and sourcing advice on a variety of chemicals and treatment techniques and I can provide this service on a retainership or on a one-off basis. To engage my services for repeat consultations, I work on a retainer of USD 1000 a month for a single plant or industrial unit. A minimum 2-month commitment and advance payment in full is required. Thereafter to be continued by advance monthly payments to retain my services. For a one-off consultation or troubleshooting of a specific problem in your plant, I work on a consultation fee of USD 850, paid in advance. One-off consultations will last for a maximum of two weeks and involve a maximum of 3 visits to your facilities for investigation and analysis. Anything beyond that will be invoiced extra. If these terms meet your needs or you have any more question, please contact me and we can discuss it further."
