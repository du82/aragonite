["https://kevin.burke.dev/kevin/san-francisco-chronicle-pricing"]
title = "How much does a San Francisco Chronicle subscription cost? | Kevin Burke"
full_description = '''How much does a San Francisco Chronicle subscription cost? Posted on June 5, 2022 The San Francisco Chronicle charges for subscriptions. How much does a subscription cost? This is an impossible question to answer, even for current subscribers. The Chronicle advertises several different prices for new subscribers. The only public information the Chronicle shares about its permanent subscription rates raises more questions than answers. No one at the Chronicle has ever read through this section. The digital-only rate is $34.50 per week, which means that it is about twice the price of getting the Chronicle delivered to your house every single day. If you get the Chronicle delivered, you can get a free digital subscription so you if you want a digital subscription you should opt for delivery. The "home delivery" prices are listed twice and you have to look particularly close to figure out that one of them includes a digital subscription. No one is paying, or going to pay, $34 a week for digital access to the Chronicle!?? I only started looking into this because after three years, the Chronicle decided to more than double the price of my subscription, from $149 a year to $358 per year. The terms of service say that they are supposed to notify me when they change the price ("We will notify you of any changes if the regular fee for your subscription changes from what was stated at the time of your initial order."). They sent no notification, the first I found out was on my credit card bill. I then tried to find any public information the Chronicle had posted about its subscription pricing, whether they had announced recently that they were raising their prices to invest in the newsroom, anything. The only thing I found was that FAQ page that says a digital subscription costs $34 a week. This is the only public information anywhere that the Chronicle offers about its rates. There is no notion of a "subscription plan." I couldn't really believe this, so I called the Chronicle customer service line. They confirmed that the Chronicle could decide at any time to charge you $34 per week, or about $1800 per year, for a Chronicle subscription, and anyone who got a lower price than that was just lucky to have it. By contrast the New York Times clearly shows the introductory price and the standard price. The Washington Post also clearly explains how much you are going to pay. By contrast someone at the Chronicle must have looked at my 3 year old subscription and decided I should pay more and charge me for that, without any notification, or justification, or even explanation that "this is the rate most people are paying." Anyway, if you are a Chronicle subscriber you should be aware that: The Chronicle can and will change the price of your subscription at any time According to the Chronicle, everyone who buys a subscription is getting a discount from the $1800/year rate, and should feel lucky. The Chronicle will not tell you why you're paying the rate you're paying. Liked what you read? I am available for hire. Posted in News.'''
