full_description = "Startup, tech, AI, crypto learnings #15: “Consciousness is nature’s algorithm” Other celeb memecoins went to zero quickly, but Trump is Trump, and has the unique qualities of (a) 100M+ followers, (b) daily non-stop coverage, (c) presidential immunity, and (d) unprecedented control over the government. Digital trade now makes up 25% of global trade— around $5 trillion—and is the fastest-growing segment. What makes this absolutely revolutionary is how perfectly suited transformer models are for this exact problem. Think about it – transformers process sequences of tokens, and what’s DNA? It’s literally nature’s token sequence. Proteins are just strands of DNA wearing a fancy outfit, and transformers can read them like a master cryptographer breaking the simplest cipher. If kids start using RN and it becomes cool, that’s a whole different level of social phenomenon. Previously I thought the only bipartisan consensus in DC was for anti-China Cold War 2. But perhaps this can be moderated at the grassroots level. Just a week ago videos showing techno-utopian Chinese cities or aesthetic cafes or bookstores were often mistaken for Tokyo or Seoul. Now people are getting the real picture. His story also shows to me that it’s never to late to change your life. He did a hard fork towards health in his early to mid 40s I think. From my experience, if you’re radically unhappily with your life, it’s usually better to do a hard fork like this. Change your environment, identity, and become who you really want to be. Because you have decades of baggage that made you what you don’t want to be today. The video will only stop getting new views if TikTok starts to fail in finding more people who engage with it properly. Regarding the engagement metrics, I think that watch time is the most important metric, because this is what keeps users on the app. Other types of engagement also matter, primarily shares and comments, but likes do not really make a difference. Robin Hanson: For the 40 years we’ve been together, my wife & I have had a tradition of seeing most of the Oscar nominated movies every year. Has bonded us, & entertained us. Reflexion utilizes a short-term sliding window to capture recent feedback and incorporates persistent long-term storage to retain condensed insights. He explained that many of his friends with prestigious degrees are moving away from Shanghai and Beijing – Yes, the pay there can be twice as high as in second or third tier cities. But the competitiveness is insane. And in order to actually land the high skilled positions, they have to work truly insane hours (9-9-6 is not a myth). — I kept asking young people about the public intellectual landscape in China – who are their equivalents of Jordan Peterson, Joe Rogan, Lex Friedman, and Sam Harris? The sense I got is that this kind of popular intellectual ecosystem just doesn’t exist there. Sure, there are viral Bilibili videos from professors talking about practical matters like how to manage your finances. But grand takes about what’s happening in the world and what we should do about it? Not much going on. Just as ancients held heliocentric views, we hold anthropocentric (human-centric) views. These must be altered in the face of LLMs, which can already defeat the Turning Test and demonstrate mere glimmers of the brilliance to come. everyone — no matter how connected or successful — should be playing in at least one new arena at all times. The harsh truth is that arenas are never static. If they’re not new, they’re getting old. If they’re not growing, they’re dying. It’s not just opportunistic but also healthy for your mind. Regardless, there’s not going to be a model moat that lasts longer than a year, bc labs swap researchers like baseball cards, and, perhaps more importantly, the researchers between labs party and sleep with each other. Plus I think researchers are too idealistic to not share information if things got out of hand. Tom Brady is a 7x 