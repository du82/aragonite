full_description = "Recent tv and movies: Day of the Jackal, Bikeriders, Kraven, Heretic (and American Primeval) Day of the Jackal — my favorite this month, an incredible 10-episode thriller starring Eddie Redmayne, basically 007 if he was a mega bucks assassin. Plot dragged midway — could have trimmed maybe 2,3 episodes to make the story tighter, but the acting, action, cast, character development, dialogue, all of it was awesome. Cliffhangers galore. A+ Bikeriders — enjoy anything with Tom Hardy; Austin Butler reminds me of a young Brad Pitt; some fun action and fights and a bit of historic Americana, but story wasn’t engaging enough imo Kraven — incredible trailer (first ~5m), but unfortunately that was the highlight of the film; needed a stronger antagonist, and more interesting characters to surround Aaron Taylor Johnson Heretic — though I finished the movie, it was solely to watch the final plot reveal which was an anti-climactic gotcha; I did enjoy Hugh Grant’s bad guy arc, and the female co-leads held up capably, and the cinematography was great started American Primeval towards end of the month and it is promising as heck — Peter Berg directed (Friday Night Lights sublime); Taylor Kitsch does well in gritty roles with less dialogue; the setting is chefs kiss for dramatic storytelling (Mormon military expansionism + raw Native American portrayals + dark sides of American frontier life); awesome writing; you know it’s good when you feel like you’ve seen a movie’s worth of plot and character progression and you check and you’re barely halfway through the pilot, can’t wait for rest of it Posted on January 29, 2025Categories MediaTags american primeval, bikeriders, day of the jackal, heretic, kraven"
