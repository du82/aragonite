full_description = "My Personal Bible – some recent additions (Wences’s bitcoin PDF, Rafa Nadal’s memoir) Here’s an updated version of my personal bible which is a collection of excerpts and highlights and quotes from my favorite writings. Recently I added two sources, one is Wences Casares’s bitcoin PDF (original post), some snippets: If Bitcoin succeeds it may be a global non-political standard of value and settlement. The world already has a global non-political standard of length in the meter, and a global non-political standard of weight in the kilo. Could you imagine a world in which we changed the length of the meter or the weight of the kilo regularly according to political considerations? Yet that is what we are doing with our standard of value. To illustrate the power of these qualities, consider that today the only standard of value and settlement that the United States of America can be certain that The People’s Republic of China (PRC) will not discriminate access to, censor transactions from or dilute the value of is the Bitcoin Blockchain. I’m not half done with Rafa Nadal’s 2011 memoir (Amazon link) which is AMAZING, felt compelled to begin adding it to my bible already. Some snippets: To illustrate the power of these qualities, consider that today the only standard of value and settlement that the United States of America can be certain that The People’s Republic of China (PRC) will not discriminate access to, censor transactions from or dilute the value of is the Bitcoin Blockchain. Nadal’s mother, Ana María Parera, does not disagree. “He’s on top in the tennis world but, deep down, he is a super-sensitive human being full of fears and insecurities that people who don’t know him would scarcely imagine,” she says. “He doesn’t like the dark, for example, and he prefers to sleep with the light, or the TV, on. He is not comfortable with thunder and lightning either. When he was a child he’d hide under a cushion when that happened and, even now, when there’s a storm and you need to go outside to fetch something, he won’t let you. And then there are his eating habits, his loathing of cheese and tomato, and of ham, the national dish of Spain. I’m not as mad about ham myself as most people seem to be, but cheese? It is a bit peculiar.” After all he’s accomplished since then — can’t wait for an update. Click to email a link to a friend (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Pocket (Opens in new window) Posted on October 27, 2022Author habitsCategories BibleTags bitcoin, rafa nadal, tennis, wences casares"
