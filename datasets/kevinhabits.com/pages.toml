striking quotes. if you think labor displacement was bad due to outsourcing/offshoring, we are about to see that same effect only 100x with AI and robotics. i think it is no coincidence that this new world order is being led, now conspicuously, by tech / robots / AI leaders. and in many ways, i think this moment has very little to do with Donald Trump. I think software engineering will spawn a new subdiscipline, specializing in applications of AI and wielding the emerging stack effectively, just as “site reliability engineer”, “devops engineer”, “data engineer” and “analytics engineer” emerged. Chiang’s Law, after science fiction writer Ted Chiang who came up with the idea. I tried to reduce it to 12 words: Science fiction is about strange rules, while fantasy is about special people. — “If you know who you are, you get a civilizational war, if you don’t know who you are, you get a culture war.” Single most useful idea for analyzing contemporary geopolitics I’ve encountered in years. Now I think it’s equally useful for domestic politics. innovation is the sum of change across the whole system, not a thing which causes a change in how people behave. No small innovation ever caused a large shift in how people spend their time and no large one has ever failed to do so. Award-winning journalist Alex Newman provides a FLAWLESS 90 second summary of the “man-made climate change” scam: “The notion that CO2 is pollution is absolutely preposterous… The idea that [it’s] going to destroy the planet or change the temperature of the Earth is totally ludicrous.” “But from a totalitarian perspective, if you can convince people that CO2 is pollution, there’s no human activity that doesn’t result in CO2 emissions, including living, including dying, turning on a light switch.” “Every single aspect of your life, then, if we submit to the idea that CO2 is pollution, then comes under the regulatory control of the people who claim to be saving us from pollution.” AI will accelerate the evolution of taste and ideas by generating infinite variations, forcing human creators to become curators rather than generators. — AI may integrate so seamlessly into thought processes (through assistants, wearables, and predictive systems) that our own thinking feels less our own. In hindsight, we may say: “Of course we didn’t just use AI; we merged with it, and thinking alone became rare.” At first approximation moneyness is a zero-sum game. Gold is primed for demonetisation in the internet age. There are only two candidates to supplant it and win internet money—BTC and ETH. Nothing else comes close. IMO the determining Schelling points are credible neutrality, security, and scarcity. @WillManidis I’ve met many more people who turned their lives around by walking around aimlessly for a couple hours a day than I’ve met people who have had their lives improved at all by professional therapy If you can not only throw out more information, but move a lot faster then your enemy and change tactics on the fly y"
