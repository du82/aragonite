full_description = "Books I’ve read My goal is to finish one book a month, and write summaries when time allows. My habit is to rotate between several books at a time; I like the ability to switch between titles depending on my mood and interests, like flipping TV channels or alternating Netflix shows. So all the books below are ones I’ve read from beginning to end; the ratio of books I start versus books I finish is probably something like 1:10 or even 1:20. The ratio seems to grow over time Here’s a list of the summaries I’ve written. Most of them are also linked to below. February 2025 – no new books January 2025 – no new books and considering if I should even continue updating this page as almost all my reading is X + Readwise (articles) + flashcards December 2024 – too much travel + personal stuff going on to read books, I also have almost 300 articles saved in a reading queue to tackle lol November 2024 – It Follows script (such a good concept); No One Will Save You script; a few Asterix comic books; Margin Call script; Napoleon script; Banshees of Inisherin script (great writing); Snowpiercer script October 2024 – a script-heavy month (Weekend Read app is awesome) – Blade movie script; Sopranos pilot script; What we do in the shadows pilot script; Ad Astra script; Hereditary script; Memes make millions (ebook) by Jason Levin September 2024 – finished Strokes of Genius by Jon Wertheim about the famous 2008 Federer-Nadal Wimbledon final; enjoying Barbara Tuchman’s A Distant Mirror August 2024 – didn’t finish any, but am still reading Strokes of Genius, started On the Edge by Nate Silver, and enjoying the Putin bio The New Tsar by Steven Lee Myers July 2024 – a gaming month as I briefly described here: Stardew Valley, Kingdom Rush, GTA San Andreas; in books, started Devil’s Chessboard on a friend’s rec and yeah it’s an eye opener June 2024 – nothing, though I have been reading the incredibly powerful story The Forgotten Highlander about a young Scottish man’s horrific journey through the Asia Pacific theater during WW2 (thanks to Founders Podcast for the rec!) and Strokes of Genius about an epic Federer-Nadal Wimbledon battle May 2024 – nothing, shared a few favorite essays though including Godel Incompleteness, We don’t sell saddles here, Acceleration of addictiveness, Why everything is becoming a game April 2024 – Operation Tropical Storm by Jake Adelstein (just a Kindle Single) March 2024 – finished none again; reading Shogun, Outrageous Marketing, AI is Good for You February 2024 – nada 🥲 January 2024 – nada December 2023 – Open by Andre Agassi — forgot I bought it, but once I got into it (again), it was almost impossible to put down. Incredible and well-written story November 2023 – also nada October 2023 – nada September 2023 – Tokyo Year Zero by David Peace (Japanese crime fiction) August 2023 Balls Deep by Nick Krauser Cage of Souls by Adrian Tchaikovsky (absolutely incredible, I’ve been on a Tchaikovsky binge since Children of Men) July 2023 – The Count of Monte Cristo by Alexandre Dumas (inspired by this series of tweets) June 2023 – none this month, reading too many blogs May 2023 – Dopamine Nation by Anna Lembke (book highlights) April 2023 – no finished books, though lots of podcasting March 2023 Collateral by Stuart Beattie (script) Children of Men by Adrian Tchaikovsky (highlights) February 2023 J.G. Ballard’s High-Rise (highlights) Intimations of a new worldview by Brett Andersen January 2023 Murderbot Diaries by Martha Wells Ra by qntm December 2022 – none, but really enjoyed sample of Amitav Ghosh’s The Glass Palace November 2022 – All You Need is Kill (manga) by Hiroshi Sakurazaka (on which Edge of Tomorrow is based) October 2022 – Why Buy Bitcoin by Andy Edstrom September 2022 – Breath by James Nestor (a life-changing book; I reacted to it in a similar way to Power of Habits) August 2022 – John Rain by Barry Eisler July 2022 – 12 Rules for Life by Jordan Peterson (started reading it years ago, picked up