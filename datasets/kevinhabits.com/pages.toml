eenplay of Knives Out by Rian Johnson Screenplay of Star Wars: The Force Awakens by JJ Abrams, Lawrence Kasdan, and Michael Arndt Screenplay of Unforgiven by David Webb Peoples (amazing) September 2020 – didn’t finish any books, but have begun sharing notes from articles and podcasts in weekly random notes posts August 2020 Disunited Nations by Peter Zeihan [Highlights] The Book of Satoshi by Phil Champagne [Highlights] July 2020 – didn’t finish again, although I did listen to a lot of podcasts lol June 2020 World After Capital by Albert Wenger [highlights] May 2020 – didn’t finish; spending a LOT more time on Twitter and reading Pocket articles, a lot less on books… April 2020 Ender’s Game whitepaper by Parker Lewis [source] The Price of Tomorrow by Jeff Booth [highlights] March 2020 eBoys by Randall Stross February 2020 – didn’t finish January 2020 Maxims and Reflections by von Goethe Pimp by Iceberg Slim (gripping) December 2019 – also didn’t finish (first two month lapse since early 2018) November 2019 – didn’t finish October 2019 The Art of Living by Thich Nhat Hanh September 2019 三字经 – the Confucian “Three Character Classic” August 2019 The Great CEO Within by Matt Mochary Looper by Rian Johnson (script) 道德经 by 老子 (Dao De Jing by Lao Zi) – for the 3rd or 4th time July 2019 The Systems Bible by John Gall Writing Screenplays that Sell by Michael Hauge It Follows by David Robert Mitchell (script) June 2019 Get Out by Jordan Peele (script) Lost S1E04 (script) Rick and Morty S1E06 (script) The Matrix by the Wachowskis (script) Lessons of History by Will and Ariel Durant [highlights] May 2019 Absent Superpower by Peter Zeihan [highlights] The Shochu Handbook by Christopher Pellegrini Lost S01E01 – Pilot by Damon Lindelof (script) Lost S01E02 (script) Lost S01E03 (script) Bourne Ultimatum by Tony Gilroy! (script) Kubo and the Two Strings by Marc Haimes (script) Rick and Morty – Meeseeks (script) Training Day by David Ayer (script) The Bitcoin Standard by Saifedean Am