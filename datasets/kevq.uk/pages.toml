title = "Notes | Kev Quirk"
full_description = '''Notes Notes are my shorter posts; kinda like my own little microblog. They have their own RSS feed and are automatically syndicated to my social profiles. 5 March 2025 at 07:14 I don't know how anyone uses an #iPhone without a case. They're almost impossible to grip without one! Are these things made of Teflon?? 4 March 2025 at 15:49 Riding to work this morning and my iPhone fell out of its carrier, then a fucking van ran over it! It's a bit damaged... 3 March 2025 at 18:09 This is how utterly shit #AppleIntelligence is...I received an email yesterday in response to my "iOS Mail Is Shite" post and the email started with "Kev - I cannot agree with you more." But Apple "Intelligence" summarised the email as "Disagrees with Kev; uses Mutt for blog email." What an utter shit show. 1 March 2025 at 19:15 And the new steed is home! 1 March 2025 at 08:20 How did this petulant fucking moron get voted in?? https://kottke.org/25/02/trump-ejects-zelenskyy-from-white-house 27 February 2025 at 19:10 I'm getting really bored of the constant "block #YouTube ads" battle. Like it or not, it's the streaming service I spend, by far, the most time on. Thinking about admitting defeat and just paying for Premium. 24 February 2025 at 09:07 Having to put another fish to sleep is a really shitty way to start a Monday. This is the problem with the #fishkeeping hobby - when you setup a tank and stock it with a load of babies, they all grow up together, but they all grow old together too. So you end up losing them one after another. I think I might hang up my buckets once these all pass. 23 February 2025 at 09:54 When you're thinking about getting a motorbike and decide to go around a few showrooms to narrow down your shortlist, you should definitely NOT spend £22k on a new bike. No, that's a stupid thing to do and very irresponsible. I'd never do such a silly thing. 🫣 18 February 2025 at 21:06 I haven't read this much bollocks in a long, long time. https://web.archive.org/web/20250217180159/https://andysblog.uk/blogging-for-traffic-not-design/ 18 February 2025 at 19:30 Tell me you're working too many hours without telling me you're working too many hours... 8 February 2025 at 12:14 Walking the dogs with the youngest... Him: Daaaaaad, I've been reading a book in school about how babies are born. Me (inner monologue): Shit shit shit shit shit shit. Him: Did you know that a baby comes out of a ladies private parts and the hole is this big (holds fingers up in a very small circle). But a baby is this big (holds hands up about 2 feet apart). Me: Yep. That's pretty much it, mate. Him: .........................................I'm glad I'm not a girl. Me: 😂😂😂😂😂 8 February 2025 at 11:05 Shouting from the other end of the house: Me: [youngest kid's name], GUESS WHAT??? Him: WHAT? Me: YOU SMELL! 😂😂 Him (very calmly): You're boring... And so the student becomes the master. You win this round, young'n. 6 February 2025 at 11:35 Fantastic post by Manu on what identity is and that we can't be identified in broad strokes. https://manuelmoreale.com/identity 3 February 2025 at 17:28 For some reason, I find this site hilarious (probably needs to be done on desktop). https://pointerpointer.com/ 2 February 2025 at 21:23 Do people find “month in review” posts interesting? I’ve thought about doing them myself, but very rarely read them so haven’t bothered. Although when I do read them, they’re usually quite interesting… 2 February 2025 at 17:08 Last Friday I posted about taking a break from Mastodon and since then I've checked Masto maybe 3 time and only really looked at my notifications. It's actually been very pleasant. No politics, no moaning, no negativity, and no drama. I checked the timeline just now and all 4 of those things came flooding in. Think I'm going to continue just checking my notifications. It's nice. 30 January 2025 at 10:03 Right then, off to the garage... 26 January 2025 at 12:20 Today it's monster trucks. 25 January 2025 at 18:20 Just sitting down with the kids to watch The NeverEnding Story and this happened... Me: this was released the year I was born, so it's the same age as me, boys. Oldest: So it's old fashioned? Me: Yep Oldest: So why is there colour then? 😂😂😂 why do kids troll us so much?? 25 January 2025 at 14:40 One of my favourite #Kirby plugins seems to be abandoned. The default Kirby textarea editor is fine, but this adds some nice quality of life things that I really enjoy. I wish I had the skills to maintain something like this. I'd love to help. 😞 https://github.com/fabianmichael/kirby-markdown-field Older Notes →'''
