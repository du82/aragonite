["https://kevq.uk/watches"]
title = "Watches | Kev Quirk"
description = "This page is an evolving list of the watches I currently have in my collection."
full_description = '''Watches I have a love for many different types of watches. My collection tends to hover at around 50 watches, so I thought I'd list them out here. As I buy and sell watches, I'll try to keep this page updated. Here's a rough guide on what the star ratings for all these watches mean: ★☆☆☆☆ (1 star) - A bad watch, I should probably sell it ★★☆☆☆ (2 stars) - It's okay, but I don't wear it often ★★★☆☆ (3 stars) - It's a good watch that I wear regularly ★★★★☆ (4 stars) - A great watch that I wear often ★★★★★ (5 stars) - Pretty much the perfect watch For reference, I have a 7.25" (18.4cm) wrist. I now have a watch wearing log, so if you wanna see which watches I've been wearing, take a look here. You can also subscribe via RSS. Casio G-SHOCK Seiko Timex Others Sold Casio ↑ Casio F-91W Case size: 34mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £15 ($19) Rating: ★★★☆☆ (3 stars) The F-91W is a fantastic watch - it's cheap, works well and has the basic functions that most people would need. It loses a couple stars for the poor backlight and only 30m of water resistance. I like these watches so much, that I actually have six of them. Read more about the Casio F-91W Casio F-84W Case size: 33mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £25 ($30) Rating: ★★★☆☆ (3 stars) The F-84W is very similar to the F-91W, except it was made for the Japanese market. Personally, I prefer the look of the 84 vs the 91 as it has a more 80's aesthetic. The internals are exactly the same as the 91, so it suffers from the same poor backlight and 30m of water resistance. Casio F-94W Case size: 33mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £25 ($30) Rating: ★★★☆☆ (3 stars) I love the yellow accent of the F94-W. I have it on a yellow and grey NATO strap, which (I think) works great. The F-94W has an updated module to the 91 and 84, but it's pretty much the same in terms of features. The backlight is improved, slightly, but the water resistance remains the same. Casio W-86 Case size: 33.5mm Movement: Quartz Water resist: 50m Strap size: 18mm Category: Digital Price: £25 ($30) Rating: ★★★★☆ (4 stars) A natural upgrade from the F-series of watches that improves the water resistance and the backlight (it's a proper illuminator) for not much more money. The design is a little more modern and will work on most people's wrists. It's a great digital watch. Casio CA-53W Case size: 34mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £30 ($40) Rating: ★★★☆☆ (3 stars) I love the CA-53W purely for it's nostalgia as the watch Marty McFly wore in Back to the Future. It's useless as calculator though, thanks to the tiny buttons. And because of all those buttons, the screens is tiny too. Weirdly, there's also no 24hr time on this watch, which is a shame. If it wasn't for the nostalgia factor, I'd be giving this 2 stars. Casio A100WE Case size: 32.7mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £50 ($63) Rating: ★★★☆☆ (3 stars) Very similar to the CA-53W, the A100 has huge nostalgia factor as it's the watch Ripley wore in the Alien films. I love the design of this watch, but I always forget which button does what function, as the labels are (stupidly) on the back. I also think it's expensive for what it is. Still cool though. Casio A700WE Case size: 35.5mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £45 ($57) Rating: ★★★★☆ (4 stars) I love the A700. It's a classic looking watch that can be worn anywhere. While walking the dog, while out with friends, or even to a wedding. It's so slim that it fits perfectly under a shirt cuff. The screen is also really legible - I love this watch. Casio AE-1200 Case size: 42mm Movement: Quartz Water resist: 100m Strap size: 18mm Category: Digital Price: £35 ($45) Rating: ★★★★☆ (4 stars) The AE-1200 (AKA the Royale) is a fantastic watch with a TONNE of features, all for £35. It also has 100m of water resistance and a really good backlight. The only reason I haven't given this 5 stars is because I personally think it has too much going on with the screen. I have an SKXMOD metal case, strap and sapphire crystal on this watch. Casio W-218H Case size: 43.2mm Movement: Quartz Water resist: 50m Strap size: 18mm Category: Digital Price: £25 ($31) Rating: ★★★☆☆ (3 stars) A great alternative to the G-SHOCK DW-5600 if you don't want to pay the extra money. It's obviously not as robust as the G-SHOCK, but it's a great beater watch. This is actually the first watch that got me back into Casio a few years ago. Casio W-800H Case size: 36.8mm Movement: Quartz Water resist: 100m Strap size: 18mm Category: Digital Price: £30 ($38) Rating: ★★★★★ (5 stars) The W-800H is pretty much the perfect digital watch, in my opinion. It's cheap, super clear with a massive screen and it looks great. With 100m water resistance, you can go swimming in this thing too. I wear this one all the time. Casio W-217H Case size: 42.2mm Movement: Quartz Water resist: 50m Strap size: 18mm Category: Digital Price: £23 ($30) Rating: ★★★★★ (5 stars) Imagine the F-91W and the W-800H had a beautiful baby. The W-217H would be the result. I love this watch. If you're after a cheap beater that's as clear as the W-800H, but a little smaller, this is the watch you should buy. I have this on a custom 20mm silicone strap. Casio A1000 Case size: 38mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £100 ($127) Rating: ★★★☆☆ (3 stars) This is a slightly more upmarket version of the A700. With a metal case and higher quality strap, albeit a bit of a hair puller. It's a nice watch, especially with the copper border around the edge, but I think it's a little overpriced for what it is. Also, for £100, I'd expect to see more than 30m of water resistance. Casio MWD-110H Case size: 47.2mm Movement: Quartz Water resist: 100m Strap size: 24mm Category: Digital Price: £35 ($45) Rating: ★★★☆☆ (3 stars) This is a big old watch, so probably not for everyone. But if you want a watch that's 90% G-SHOCK for 30% of the price, you should look at the MWD-110H. I don't really wear this watch as often as I should. It's good. Read more about the Casio MWD-110H Casio DW-290 Case size: 46.8mm Movement: Quartz Water resist: 200m Strap size: 19mm Category: Digital Price: £45 ($55) Rating: ★★★☆☆ (3 stars) Another big watch that's similar, in looks, to the G-SHOCK line up. And, like G-SHOCKs, the DW-290 has 200m water resist. It also has some nostalgic props, being the watch that Tom Cruise wore in the original Mission Impossible film. Casio MDV-106 (Duro) Case size: 44mm Movement: Quartz Water resist: 200m Strap size: 22mm Category: Diver Price: £60 ($75) Rating: ★★★★☆ (4 stars) Finally a non-digital watch, eh? Like with most divers, this is a BIG watch, at 44mm. It's heavy too - you really feel this one on your wrist. It's at the upper limit of what I can pull off on my wrist, but it's such great value for money. I have it on a grey and blue NATO strap. Casio MRW-200H Case size: 44mm Movement: Quartz Water resist: 100m Strap size: 18mm Category: Diver Price: £23.50 ($30) Rating: ★★★★★ (5 stars) I absolutely love the MRW-200H. The white dial with black numerals and hands just works so well; I love the really high contrast. Although it's 44mm, it doesn't feel (or wear) like one. And being resin, it's really light. Great watch for such a small amount of money. Casio MTP-V005L Case size: 40mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Dress Price: £30 ($38) Rating: ★★★☆☆ (3 stars) This is one of 2 dress watches in my collection. It's slim and looks WAY more expensive than it actually is with the beautiful sunburst effect on the dial. If I'm ever putting on a suit, I'll usually be wearing this or my PRX. I have it on an aftermarket brown leather strap. Casio Forester Case size: 41mm Movement: Quartz Water resist: 100m Strap size: 20mm Category: Field Price: £32 ($40) Rating: ★★★☆☆ (3 stars) Another great beater watch that can do anything, pretty much. It's a great field watch that's Casio's answer to the Timex Expedition. Casio B640W Case size: 35mm Movement: Quartz Water resist: 50m Strap size: 18mm Category: Digital Price: £40 ($50) Rating: ★★☆☆☆ (2 stars) I really don't wear this watch as much as I should. I like it, I just like my other watches more. It has a real 90s vintage vibe to it. It only cost me £15 (second hand) from eBay, so I keep it around, otherwise I'd probably sell it. Casio F-201WA Case size: 34mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £18 ($22) Rating: ★★★☆☆ (3 stars) Very similar in looks to the W-800H, but it's a little smaller. Large, clear display and the 5 alarms would probably be useful to many people. Wish it had better WR, but not the end of the world. Casio AE1500 Case size: 55mm Movement: Quartz Water resist: 100m Strap size: 18mm Category: Digital Price: £32 ($40) Rating: ★★★★☆ (4 stars) The AE-1500 is a HUGE watch at 55mm, but it doesn't wear quite that big. If you can pull off a 44mm diver, you can pull this off. Because it's so big, the legibility on the screen is ridiculously good, and that's why I bought this watch. At around £30, it's the perfect beater. Casio A168 Custom Case size: 34mm Movement: Quartz Water resist: 30m Strap size: 18mm Category: Digital Price: £100 Rating: ★★★★☆ (4 stars) The Casio A168 is a great watch, but it's made even more great by upgrading the bezel, case and glass to a full metal/sapphire jobby from SKXMOD. I also have it on a custom rubber strap. It's a lovely piece. G-SHOCK ↑ G-SHOCK GA-2100BWP Case size: 45.4mm Movement: Quartz Water resist: 200m Strap size: 20mm Category: Analogue Price: £139 ($177) Rating: ★★★☆☆ (3 stars) This is a really good watch. Many of the GA2100 range (or CasiOak as they're better known) have poor contrast on the dial, but not this one. I also think the unique marbling on the resin is interesting. G-SHOCK G-9000 Case size: 46.3mm Movement: Quartz Water resist: 200m Strap size: 20mm Category: Digital Price: £80 ($100) Rating: ★★★★★ (5 stars) The "Mudman" is probably my favourite watch in the collection. It think it's beautiful in its ruggedness and it fits my wrist perfectly. I love this one and I wear it all the time. G-SHOCK DW-6640RE Case size: 50mm Movement: Quartz Water resist: 200m Strap size: 20mm Category: Digital Price: £129 ($164) Rating: ★★☆☆☆ (2 stars) This is part of the G-SHOCK 40th Anniversary collection, and has a unique strap listing some of the more popular models from the G-SHOCK lineup over the years. This is a nice watch, but it's a bit too big for me, I think, so I don't wear it often. G-SHOCK DWE-5657RE Case size: 44mm Movement: Quartz Water resist: 200m Strap size: 20mm Category: Digital Price: £159 ($202) Rating: ★★★☆☆ (3 stars) Another watch from the 40th Anniversary lineup, and sporting the same strap at the DW-6640RE. This is a take on the venerable DW5600 though. Difference here is that this edition of the watch comes with interchangeable bezels, so it's practically 2 watches in 1. G-SHOCK GW-M5610U Case size: 43.2mm Movement: Quartz Water resist: 200m Strap size: 20mm Category: Digital Price: £135 ($172) Rating: ★★★★★ (5 stars) Probably the most versatile G-SHOCK in existence. The GW-M5610U takes the DW-5600 and makes it's better. With solar power and automatic time setting, this thing is brilliant. I use it to set the time on all my other watches. G-SHOCK GM-5600MF Case size: 43.2mm Movement: Quartz Water resist: 200m Strap size: 20mm Category: Digital Price: £189 ($240) Rating: ★★★★☆ (4 stars) This is a posh DW-5600. It's basically the exact same watch as the 5600, except in a metal case instead of a resin one. I really like this watch - it's super robust and looks great in grey. G-SHOCK GA-2100MNG-2AER Case size: 45.4mm Movement: Quartz Water resist: 200m Strap size: 20mm Category: Analogue Price: £135 ($171) Rating: ★★★☆☆ (3 stars) I already have a GA-2100 in my collection, but when I saw this limited edition one, I thought it was really cool and had to have it. It would have got 4 stars if it didn't have the negative LCD display, but hey, you can't have everything. 🙃 Seiko ↑ Seiko SRPD71K1 Case size: 42mm Movement: Automatic Water resist: 100m Strap size: 22mm Category: Diver Price: £300 ($382) Rating: ★★★★☆ (4 stars) When I first saw this watch, I knew I had to have it. It's absolutely gorgeous. I love the deep blue of the face, coupled with the off-white of the applied numerals and hands. This is the watch that garners the most comments from people, especially on the aftermarket suede strap. Seiko SNK805K2 Case size: 37mm Movement: Automatic Water resist: 30m Strap size: 20mm Category: Field Price: £140 ($178) Rating: ★★★★☆ (4 stars) This is a fantastic little field watch that I wear all the time. I do like smaller watches, so being 37mm works really well. I don't think it looks too small on my wrist, either. These are cheap automatics, but the Seiko 5 series are really well built. Seiko SNZG11K1 Case size: 42mm Movement: Automatic Water resist: 100m Strap size: 20mm Category: Field Price: £185 ($235) Rating: ★★★★☆ (4 stars) The big brother of the SNK805K2. I love how clear this watch is to read and how good the lume is on it. The brushed steel case is also really nice. I personally have this on an aftermarket blue leather strap. Seiko SSB403P1 Case size: 41mm Movement: Quartz Water resist: 100m Strap size: 20mm Category: Chronograph Price: £209 ($266) Rating: ★★★☆☆ (3 stars) My only quartz Seiko, and the only chronograph in my collection too. There's a lot going on with the design of this watch, which can make it hard to read. I love the NATO strap this thing comes on though. Seiko SBSC009 Case size: 39mm Movement: Automatic Water resist: 100m Strap size: 20mm Category: GMT Price: £366 Rating: ★★★★★ (5 stars) I do a lot of traveling with my job, so I wanted a GMT so I can tell what time it is at home. I've always loved the Rolex Polar Explorer, and this Seiko looks VERY similar for a fraction of the price. It's absolutely stunning and 39mm is the perfect size for my wrist. Timex ↑ Q Timex Reissue Case size: 38mm Movement: Quartz Water resist: 50m Strap size: 18mm Category: Diver Price: £159 ($202) Rating: ★★★★☆ (4 stars) I absolutely love this watch. It's gorgeous, fits my wrist perfectly and is really old school. It just looks the business, especially with the blue face and Pepsi bezel. The only reason I haven't given it 5 stars is because the strap is a real hair puller. Timex Waterbury Ocean Case size: 42mm Movement: Quartz Water resist: 30m Strap size: 20mm Category: Analogue Price: £90 ($115) Rating: ★★★☆☆ (3 stars) The Waterbury Ocean is made out of recycled ocean plastic. Because of that, it has this mottled effect to the plastic, which I think looks really cool. The strap is really comfortable on this w'''
