title = "Subscribe | Kev Quirk"
description = "If you want to subscribe to Kev Quirk's content, this page will show you how."
full_description = "Subscribe I try really hard to make my content as easy as possible for you to get. I'm a firm believer that readers shouldn't have to go hunting for content; instead, bloggers like me should make the content available so you can consume it in a way that makes sense for you. With that in mind, I publish my content in a number of places: On this blog (obviously) Via RSS Via Email On the Fediverse (Mastodon) RSS feed Of course this site has an RSS feed; because I think that's very important. I have a few different feeds for various post types on this site. Combined feed contains the 20 most recent items I've written, whether that's notes or posts Posts feed contains the 20 latest blog posts I wrote Notes feed, like my blog posts feed, contains the last 20 notes I've published Watch Log feed is a feed of my watch log and contains info about the watch I'm wearing that day, along with a picture of it All RSS feeds contain the entire post, not a summary. Email Every one has an email addres, right? And not everyone uses RSS, in fact, many people don't. So I thought it would be a good idea to allow you to subscribe via email too, if you wish. This isn't a newsletter - I'm not that hip. This service literally just regurjitates any new posts from my RSS feed to an email. You won't get any spam, literally just my posts in their entirety, whenever I publish them. All my emails contain an unsubscribe link in the footer, and like everything else on this site, there's absolutely no tracking. If you want to subscribe via email, here's a handy-dandy form: Enter your email The Fediverse (Mastodon) Links to everything I write on this blog tend to be published on my Mastodon account too. I will publish posts about other topics on my Mastodon account too, as it's my main social space on the Internet. Follow me on Mastodon"
