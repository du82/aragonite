["https://kevq.uk/how-online-tracking-works"]
title = "How Online Tracking Works | Kev Quirk"
description = "I'm going to try and explain how online tracking works. I think I have a relatively good understanding of things, but it's a complicated subject, so I'll try and keep it as simple as possible."
full_description = "How Online Tracking Works 07 Sep 2019 | ~8 minute read With the numerous Facebook snafu's going around, as well the feeling that new data breaches are being reported daily, privacy is currently top of mind in the tech world. For many, privacy equates to advertising, cookies and tracking, but it's so much more than those three things alone. Having said that, they certainly don't help things so in this post, I'm going to try and explain how online tracking works. I think I have a relatively good understanding of things, but it's a complicated subject, so I'll try and keep it as simple as possible. If you can't explain it simply, you don't understand it well enough. - Albert Einstein Why do we need to know? I think that if you understand what makes online tracking bad, you can better protect yourself against it. So by understanding how online tracking works, you may be able to stop your details being listed in the next breach that finds itself on Pastebin. With that in mind, there's a lot for us to get through, so let's get started shall we? What is a cookie? Contrary to popular belief, cookies are not biscuits, and they are not necessarily malicious. A cookie in this context is a small text file that is stored on your machine. Cookies are created by your browser, and they contain a small amount of data that is specific to a the website that you have visited, usually in the form of a session ID. Most modern websites use cookies for two main purposes - to keep you logged in and to track your behaviour. How cookies keep you logged in When you log in to a website, let's use Facebook as an example, your browser sends Facebook a message informing it you wish to log in. We call this a HTTP request. This message contains your username and password (that's why HTTPS is important), if your credentials match what Facebook has on record, you're allowed to log in. Once you're cleared to login, Facebook will generate a unique session ID and sends it to your browser. Your browser then creates a cookie containing your session ID. The cookie is stored on your machine and sent to Facebook along with every HTTP request your machine creates. When you then navigate around Facebook, they know its you and don't ask you to log in again. Without a session ID Facebook would ask you to login every single time you navigate to a different page. This would get pretty annoying, pretty quick. So this is a legitimate use for cookies where they are used in an innocuous manner. How cookies can be used to track you If a website, like Facebook, requires a login to be used, it's extremely simple to track you while you use their service. This is because you already have a cookie with a session ID stored on your device. Since this cookie is used with every request you send to the site, the website owner knows exactly where you have been and what you have done during your session. This data can then be used to create a profile of your usage habits, and the more you use a service, the more data they have on you. This profile can then be used to send you targetted advertising; the rationale being that if you're shown an advert for something you're interested in, you're going to be more likely to click on it. This is also how sites like YouTube can recommend other content that is based on your tastes - because they're tracking you and know exactly what you have been doing while on their site. For me, this is where cookies start to mutate from being a benign, useful tool, to a potentially nefarious tracking mechanism. Third party cookies - single site If a website does not require a login, you're still not safe unfortunately. Many sites use third party cookies for things like analytics, as knowing which pages are popular and how much traffic your site is getting can be useful information. There are ways to do this analysis without cookies; for example, using web server log analysis, or by still using an analytics platform, but not allowing them to create cookies on your visitor's device. This means that the stats are a little less accurate, but still give a good idea of visitor counts. This is how I monitor the analytics for this website. Ok, so how does a third party analytics platform, such as Google Analytics or Matomo, know when someone visits your site? Lets use a news site as an example, when a person visits news-site.com the news site doesn't create a session ID itself, but instead has a little snippet of JavaScript code that in turn sends a request to the analytics platform, which then creates the session ID and places it on the visitor's device. Since the session ID is unique to that visitor, it is used to track that person's activity throughout the site, as the session ID will be sent back to the analytics platform along with any requests to news-site.com. Analytics platforms are popular and will likely be tracking multiple sites - that's especially true when it comes to Google Analytics. However, analytical data is not shared between sites being tracked. So if news-site.com and banking-site.net are both using Google Analytics to track their visitors, Google Analytics will not co-mingle the news and banking site's data. Therefore the tracking cookie for news-site.com can only be used to track you on that particular site. That's not to say that Google isn't finding other ways to interpret all this data in such a way to be of benefit to them, but I couldn't possibly speculate. Third party cookies - multi-site This is where shit gets real and really starts to make me feel uneasy. Multi-site third party tracking works in a very similar way to single site tracking, however when the session ID is generated for that visitor on news-site.com, the same session ID is shared across all sites within that tracking platform. This means that the third party tracking platform can now track you over any site they have subscribed to their platform. Worse still, that data is available to any website owners using that platform AND is often sold to fourth parties, such as advertisers. Have you ever gone on to Amazon and searched for something, then seen adverts for that exact item you just looked at on Facebook? That's because of third party multi-site cookies. When you visit Amazon and search for hard drives, Facebook is also using the same multi-site tracking company, so you have the same session ID across both sites. This means that Facebook knows you just searched for hard drives on Amazon, so then shows you adverts for said hard drive in the hope that you click. Not just advertising We're not just talking about advertising here. The multi-site platform will have many sites over many niches signed up to their service. So you can potentially be tracked across social media, shopping sites, news sites, porn sites, or any other sites you can think of. With this tracking, an extremely detailed profile can be built up on you. Imagine a profile that contains your likes and dislikes, where you like to visit and things like the type of porn you prefer. Then when it comes to Google, this profile could also contain your search history, location tracking from your Android device, your contacts, your calendars, your emails, your text messages, phones calls etc. etc. etc. Pretty worrying, right? How can I protect myself? It isn't all bad news, as there are tools out there that you can use to protect yourself. The major browsers have options available for blocking third party cookies; here are instructions for both Firefox and Chrome. Having said that, I would still recommend installing a content filter add-on to your browser, I personally use uBlock Origin. It's available for all major browsers, it's free and is pretty much set it and forget it when it comes to blocking trackers. Then there's VPN services. Many think a VPN is a magic pill against all things privacy on the Internet. Unfortunately, that isn't the case - whilst a VPN will help give you some anonymity, as many people are likely using the same public IP addresses that VPN provider uses, you're still being tracked. The best advice I can give over and above everything else is to use privacy respecting services online. Or, better yet, self-host those services. I personally de-Googled a lot of the services I use, and I do host some of them myself too. Here are some quick recommendations: DuckDuckGo instead of Google search. Nextcloud instead of Google Drive or Dropbox. Fastmail or Zoho Mail instead of Gmail. Tutanota and Proton are also highly recommended, but they include extra security that some less technical users may find confusing. Mastodon instead of Facebook and Twitter. PixelFed instead of Instagram. Signal instead of WhatsApp. Conclusion By replacing core services with privacy respecting ones, and taking a few steps to block trackers while you're browsing the web, you can make your online experience much more private. Having such an in-depth profile that is easily identifiable to a single person really concerns me. Especially when that profile is then being sold on to advertisers and other potentially nefarious 3rd parties for a profit. This is our personal data, they have no right to sell it on! So there you have it, you now have a better idea of how online tracking works. This post doesn't cover everything, far from it actually, but I hope it's enough for you to start making informed decisions about where your personal data could potentially end up. What steps do you take to maintain your privacy online? Please feel free to leave a comment below to tell me about it. And remember, I respect your privacy! Privacy Security Technology Reply by email ← The one before Commento - The Privacy Respecting Commenting System Up next → How Browser Fingerprinting Works Want more? So you've read this post and you're still not satisfied? Ok then, here's some other stuff for you to do: Sign my guestbook Read a random post Subscribe via RSS or email Check out my watch collection See which watches I've been wearing"
