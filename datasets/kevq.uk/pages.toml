full_description = '''Guestbook I miss the good old days of the Internet, so after seeing Manu do the same thing, I decided to create my own guestbook. I loved a good guestbook back in the day, so figured this would be a fun little feature to add. Please do feel free to sign this guestbook using the form below. Sign my Guestbook All guestbook entries will be held for moderation before being published. Sorry, but the spam is real. 😞 Alok 05 Mar 2025 12:11 Hey Kev, your site looks incredible! It’s been a big motivation for my own revamp. Kev 👍🏻 this. keith 04 Mar 2025 00:12 Hey! Found your site through the 512kb club (thewebisfucked.com) and now I'm completely inspired by your watch collection. I'll probably have to put up a page for my collection now (and probably buy more watches)! Thanks! Kev says... You absolutely should do both those things...then send me the link! 🙃 Old Internet Nostalgic 28 Feb 2025 10:57 This is one of the best looking and designed personal blogs I have ever seen. Also, big fan of your reviews of your book reviews! Kev ❤️ this. Chris Eldon 28 Feb 2025 03:56 Hi Kev! I'm relatively new to building my personal spot on the internet and have been having a fantastic time finding niche sites and personal blogs like yours lately. As someone that's been helping the public sector with their own websites for years, figured it's about time to put my skills to use for my own use. I've also really liked finding all sorts of cool projects that I would otherwise not have found if not for personal sites. It's like seeing the way the internet was intended to be - a little something for everyone, not just a money-making depression machine. I've still got a ways to go (between starting Degoogling, making my own site, and life in general) but I'm excited to see this world that's been existing right under my eyes all this time. Thanks for all the wonderful content, and for keeping a great blogroll going :) -Chris Kev 🙏🏻 this. Elias 26 Feb 2025 20:28 Greetings from Finland! I really hope I'll get around to writing someday :) Kev 👍🏻 this. Mark McNally 15 Feb 2025 22:40 I forgot exactly how I found your website (a link a few 10s of tabs back) but I'm glad I did. Interesting content and will be reading your new posts in the future :) Kev 👍🏻 this. İsmail Efe Top 08 Feb 2025 15:13 Hey Kev, love the blog. You are a huge inspiration. Keep up the good work. Kev ❤️ this. Beatrix Kiddo 25 Jan 2025 04:02 I'm a Xennial & forever 90s girl at heart, so naturally I'm hella geeked that soft web is making a comeback. Enjoyed your site 😊 Kev ❤️ this. V.H. Belvadi 06 Jan 2025 15:51 Hey Kev, thanks for making the IndieWeb better one post at a time. Love how quirky this site is ;) Kev 😂 this. Théo 19 Dec 2024 19:42 Heyy :) Always a pleasure to read your blog posts :) Kev 👍🏻 this. İsmail Şevik 18 Dec 2024 16:15 Kev your blog is great. I like that it has a different style. I enjoy reading your posts very well. Kev 🙏🏻 this. 袁 (Yuan) 10 Dec 2024 23:02 你好kev，第一次访问你的博客，很有个性很漂亮，我正在开发我的博客，正在到处收集灵感，所以来到你的网站。 我也非常喜欢摩托，之前有一辆 GSX250，我骑他游了几乎半个中国。 然后，祝你新年快乐！ Translation thanks to Kagi translate: Hello Kev, this is my first visit to your blog, it's very unique and beautiful. I am developing my blog and collecting inspiration everywhere, so I came to your site. I also really like motorcycles; I used to have a GSX250, and I rode it around almost half of China. Then, I wish you a Happy New Year! Kev 🙏🏻 this. Suzy McHale 25 Nov 2024 04:23 Hi, I have been visiting your website for a year or more (can't recall how I came across it!) and it's now one of several I visit daily. I particularly enjoy your tech posts and am transitioning (with difficulty!) from Windows to macOS. I'm also into hand-coding my own old-fashioned site (and much prefer the "old web" in general). Um, I am not very good at delurking like this, so I'll leave things there! Kev says... Thanks for the kind words, Suzy. I went through the pain of migrating from Win to Mac a few years ago, but I'm very happy now, so stick with it. 🙃 Happy to see you're building your own site from scratch. It looks great. 👍🏻 Thomas 04 Nov 2024 20:27 Stumbled across your site while trying to find out if there's a somewhat nice middle ground between static sites and a full blown CMS. This is after my site wiki backend has apparently broken after many years of neglect and lack of updates. I still don't have an answer, but really enjoyed reliving the good old days of just surfing an interesting website. Keep up the great work! Kev says... You should check out Frontmatter for VSCode. I think it’s a good balance between CMS and SSG. https://github.com/estruyf/vscode-front-matter ODUZ 16 Oct 2024 09:08 Hi Kev 👋🏼 I really like your posts and website design. Very inspiring 🔥 Admittedly, sorry, I copied/plagiarized/stole some elements from your website 🫣. Thanks again 🫰🏼 Kev says... Imitation is the highest form of flattery, so they say. :-) I don't think there's a unique site on the web, we're all influenced by other stuff we see, so copy away! Chip 16 Oct 2024 04:14 Thanks for simple.css,it makes my site look so awesome! Kev ❤️ this. Vidhu Kant Sharma 09 Oct 2024 20:49 The new design in pretty dope Kev 👍🏻 this. Todd Gray 02 Oct 2024 18:34 Hello Quirky Kev Kev 👋🏻 this. Yash Ghelani 28 Sep 2024 16:56 Love how this website’s font-size is super readable on my teeny-tiny iPhone 12 mini’s screen. And I love you for it. Thank you :) Kev ❤️ this. Peyton 30 Aug 2024 20:54 Really enjoyed reading about your watch collection! Inspired me to purchase my first Casio. You have such a great and personable writing style. Thanks! Kev ❤️ this. Levelsi 22 Aug 2024 12:50 Thanks for Simple.css, Kev, and for all the inspiring work you do for the IndieWeb community! I always enjoy seeing what else you’re up to! Kev ❤️ this. Zachary Betz 14 Aug 2024 15:24 Hi Kev! Thanks for this website. The design is unique and your posts are fun. I look forward to reading them. Keep it up 💪 Kev 🙏🏻 this. Adrian Lansdown 31 Jul 202