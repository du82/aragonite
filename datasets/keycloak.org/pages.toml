["https://www.keycloak.org/2023/04/keycloak-2110-released"]
title = "Keycloak 21.1.0 released - Keycloak"
description = "Monorepo * FIPS 140-2 support * Experimental Account Console version 3 * Changes to Keycloak Authorization Services support in Keycloak Java-based Adapters"
full_description = "<dependency> <groupId>org.keycloak</groupId> <artifactId>keycloak-policy-enforcer</artifactId> <version>21.1.0</version> </dependency> Having multiple repositories introduced a lot of complexity and toil. For example frequently multiple pull requests had to be sent to different repositories for a single change. FIPS 140-2 support in Keycloak, which was preview in the previous release, is now promoted to be officially supported. The Account Console version 3 is now available as an experimental feature in Keycloak. This version supports custom fields created with the 'User Profile' feature. If you are looking to try it out and provide us with some early feedback you can enable it as follows: As part of the removal of the deprecated adapters, the Keycloak Policy Enforcer was extracted from the adapters code base into a separate dependency: By providing this dependency, we expect making it possible to integrate the policy enforcer with the Java stack of your preference. It also provides built-in support for enabling the policy enforcer to Jakarta applications protected with Wildfly Elytron. In the previous version, when Keycloak was used on Java 17 with Javascript providers it was needed to add the Nashorn javascript engine to the distribution. This is no longer needed as Nashorn javascript engine is available in Keycloak server by default. © Keycloak Authors 2025. © 2025 The Linux Foundation. All rights reserved. The Linux Foundation has registered trademarks and uses trademarks. For a list of trademarks of The Linux Foundation, please see our Trademark Usage page."
