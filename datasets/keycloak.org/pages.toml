["https://www.keycloak.org/high-availability/concepts-multi-site"]
title = "Concepts for multi-site deployments - Keycloak"
description = "Understanding a multi-site deployment with synchronous replication"
full_description = "Lost changes leading to users being able to log in with an old password because database changes are not replicated to the other site at the point of failure when using an asynchronous database. Invalid caches leading to users being able to log in with an old password because invalidating caches are not propagated at the point of failure to the other site when using an asynchronous Infinispan replication. This topic describes a highly available multi-site setup and the behavior to expect. It outlines the requirements of the high availability architecture and describes the benefits and tradeoffs. Use this setup to provide Keycloak deployments that are able to tolerate site failures, reducing the likelihood of downtime. Two independent Keycloak deployments running in different sites are connected with a low latency network connection. Users, realms, clients, sessions, and other entities are stored in a database that is replicated synchronously across the two sites. The data is also cached in the Keycloak Infinispan caches as local caches. When the data is changed in one Keycloak instance, that data is updated in the database, and an invalidation message is sent to the other site using the work cache. In the following paragraphs and diagrams, references to deploying Infinispan apply to the external Infinispan. While this setup aims for high availability, the following situations can still lead to service or data loss: Keycloak site failure may result in requests failing in the period between the failure and the loadbalancer detecting it, as requests may still be routed to the failed site. Once failures occur in the communication between the sites, manual steps are necessary to re-synchronize a degraded setup. Degraded setups can lead to service or data loss if additional components fail. Monitoring is necessary to detect degraded setups. If the writer instance fails, the database can promote a reader instance in the same or other site to be the new writer. Multiple Keycloak instances run on each site. If one instance fails some incoming requests might receive an error message or are delayed for some seconds."
author = "Keycloak Team"
year_published = 2025
clearnet = "https://www.keycloak.org/high-availability/concepts-multi-site"
tags = ["answers", "caching", "causes", "concepts", "data", "deployment,", "deployments", "failures", "footnotes:", "idm"]
