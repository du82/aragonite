["https://www.keycloak.org/migration/migrating-to-quarkus"]
title = "Migrating to Quarkus distribution - Keycloak"
description = "Migrate to the new Quarkus distribution from the legacy WildFly distribution"
full_description = "Starting with Keycloak 17 the default distribution is now powered by Quarkus, while the legacy WildFly powered distribution will still be around until June 2022 we highly recommend starting the migration as soon as possible. Before undertaking the migration we highly recommend reading through the new Server Guides to understand how to install and configure the new distribution. The WildFly distribution of Keycloak used complicated XML files for configuration, resulting in the need for a CLI tool (jboss-cli) to manipulate these files. These files also brought complication to upgrading, where an error-prone script was used to upgrade the config from a previous version. The new Quarkus powered distribution leverages a simple configuration file instead, with corresponding CLI arguments and environment variables as options, making it significantly easier to configure Keycloak. However, this results in the inability to automatically migrate the configuration from the previous distribution. To migrate to the new Quarkus powered distribution the first step is to understand what configuration changes you are applying to the legacy distribution, and apply those that are necessary to the new distribution by following the new Server Guides. One thing to note is the new distribution is a lot more opinionated when it comes to configuration. It aims to provide better defaults, with the need to configure less yourself. However, we may not always have the balance right, and there may be use-cases not covered. If you are unable to configure something that you need to tweak in the new distribution, please open a discussion in GitHub Discussions. Until a new release is available it is possible to configure the new distribution by directly applying Quarkus level configuration through the conf/quarkus.properties file. We recommend you use this sparingly as you will be applying configuration untested and unsupported by the Keycloak team. Unlike WildFly, Quarkus is not an application server. While an application server can dynamically deploy applications, and alter what is loaded into memory at runtime, this is not possible on Quarkus."
author = "Keycloak Team"
year_published = 2025
clearnet = "https://www.keycloak.org/migration/migrating-to-quarkus"
