["https://www.keycloak.org/securing-apps/client-registration-cli"]
title = "Client registration CLI - Keycloak"
description = "Automating Client Registration with the CLI"
full_description = '''These permissions grant the user the capability to perform operations without the use of Initial Access Token or Registration Access Token (see Client registration service for more information). $ kcreg.sh config credentials --server http://localhost:8080 --realm demo --user user --client reg-cli $ kcreg.sh create -s clientId=my_client -s 'redirectUris=["http://localhost:8980/myapp/*"]' $ kcreg.sh get my_client c:\> kcreg config credentials --server http://localhost:8080 --realm demo --user user --client reg-cli c:\> kcreg create -s clientId=my_client -s "redirectUris=[\"http://localhost:8980/myapp/*\"]" c:\> kcreg get my_client In a production environment, Keycloak has to be accessed with https: to avoid exposing tokens to network sniffers. Do not make the configuration file visible to other users on the system. The configuration file contains access tokens and secrets that should be kept private. $ kcreg.sh create -f client-template.json -s clientId=myclient -s baseUrl=/myclient -s 'redirectUris=["/myclient/*"]' -o C:\> kcreg create -f client-template.json -s clientId=myclient -s baseUrl=/myclient -s "redirectUris=[\"/myclient/*\"]" -o $ kcreg.sh get myclient > myclient.json $ vi myclient.json $ kcreg.sh update myclient -f myclient.json C:\> kcreg get myclient > myclient.json C:\> notepad myclient.json C:\> kcreg update myclient -f myclient.json'''
