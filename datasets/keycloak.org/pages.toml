["https://www.keycloak.org/observability/keycloak-service-level-indicators"]
title = "Keycloak service level indicators (SLIs) - Keycloak"
description = "Learn about the Service Level Indicators to monitor your Keycloak deployment's performance"
full_description = 'As a Keycloak user, I want to be able to log in, refresh my token and log out, so that I can use the applications that use Keycloak for authentication. While these SLOs are independent of the actual load the system, this is expected as a single user does not care about the system load if they get slow responses. At the same time, if you enter a Service Level Agreement (SLA) with stakeholders, you as the one running Keycloak have an interest to define limits of the traffic Keycloak receives, as response times will be prolonged and error rates might increase as the load of the system increases and scaling thresholds are reached. For a production environment, you might want to replace those queries or subqueries with a recording rule to make sure they do not use too many resources if you want to use them for alerting or live dashboards. count_over_time( sum (up{ container="keycloak", (1) namespace="$namespace" } > 0)[30d:15s] ) (2) / count_over_time(vector(1)[30d:15s]) (3) In Grafana you can replace value 30d:15s with $range:$interval to compute availability SLI in the time range selected for the dashboard. sum( rate( http_server_requests_seconds_bucket{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*", (1) le="0.25", (2) container="keycloak", (3) namespace="$namespace"} [5m] (4) ) ) without (le,uri,status,outcome,method,pod,instance) (5) / sum( rate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*", (1) container="keycloak", namespace="$namespace"} [5m] (3) ) ) without (le,uri,status,outcome,method,pod,instance) (5) In Grafana you can replace value 5m with $__range to compute latency SLI in the time range selected for the dashboard. sum( rate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*", (1) outcome="SERVER_ERROR", (2) container="keycloak", (3) namespace="$namespace"} [5m] (4) ) ) without (le,uri,status,outcome,method,pod,instance) (5) / sum( rate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*", (1) container="keycloak", (3) namespace="$namespace"} [5m] (4) ) ) without (le,uri,status,outcome,method,pod,instance) (5)'
