["https://www.keycloak.org/observability/health"]
title = "Enabling Keycloak Health checks - Keycloak"
description = "If the server should expose health check endpoints."
full_description = '{ "status": "UP", "checks": [ { "name": "Keycloak database connections health check", "status": "UP" } ] } health-enabled If the server should expose health check endpoints. If enabled, health checks are available at the /health, /health/ready and /health/live endpoints. CLI: --health-enabled Env: KC_HEALTH_ENABLED If enabled, health checks are available at the /health, /health/ready and /health/live endpoints. CLI: --health-enabled Env: KC_HEALTH_ENABLED Keycloak has built in support for health checks. This guide describes how to enable and use the Keycloak health checks. The Keycloak health checks are exposed on the management port 9000 by default. For more details, see Configuring the Management Interface These endpoints respond with HTTP status 200 OK on success or 503 Service Unavailable on failure, and a JSON object like the following: It is recommended that the health endpoints be monitored by external HTTP requests. Due to security measures that remove curl and other packages from the Keycloak container image, local command-based monitoring will not function easily. If you are not using Keycloak in a container, use whatever you want to access the health check endpoints. You may use a simple HTTP HEAD request to determine the live or ready state of Keycloak. curl is a good HTTP client for this purpose. If Keycloak is deployed in a container, you must run this command from outside it due to the previously mentioned security measures. For example: If the command returns with status 0, then Keycloak is live or ready, depending on which endpoint you called. Otherwise there is a problem. Define a HTTP Probe so that Kubernetes may externally monitor the health endpoints. Do not use a liveness command. The Containerfile HEALTHCHECK instruction defines a command that will be periodically executed inside the container as it runs. The Keycloak container does not have any CLI HTTP clients installed. Consider installing curl as an additional RPM, as detailed by the Running Keycloak in a container guide. Note that your container may be less secure because of this.'
author = "Keycloak Team"
year_published = 2025
