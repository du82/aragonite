["https://www.keycloak.org/securing-apps/docker-registry"]
title = "Docker registry - Keycloak"
description = "Configuring a Docker registry to use Keycloak"
full_description = "Docker authentication is disabled by default. To enable see the Enabling and disabling features guide. auth: token: realm: http://localhost:8080/realms/master/protocol/docker-v2/auth service: docker-test issuer: http://localhost:8080/realms/master Don’t forget to configure the rootcertbundle field with the location of the Keycloak realm’s public key. The auth configuration will not work without this argument. REGISTRY_AUTH_TOKEN_REALM: http://localhost:8080/realms/master/protocol/docker-v2/auth REGISTRY_AUTH_TOKEN_SERVICE: docker-test REGISTRY_AUTH_TOKEN_ISSUER: http://localhost:8080/realms/master Don’t forget to configure the REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE override with the location of the Keycloak realm’s public key. The auth configuration will not work without this argument. This installation method is meant to be an easy way to get a docker registry authenticating against a Keycloak server. It is intended for development purposes only and should never be used in a production or production-like environment. it is recommended that you configure the Docker registry client in a realm other than 'master', since the HTTP Basic auth flow will not present forms."
author = "Keycloak Team"
year_published = 2025
clearnet = "https://www.keycloak.org/securing-apps/docker-registry"
