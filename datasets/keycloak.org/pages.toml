["https://www.keycloak.org/server/features"]
title = "Enabling and disabling features - Keycloak"
description = "Understand how to configure Keycloak to use optional features"
full_description = "features-disabled Disables a set of one or more features. CLI: --features-disabled Env: KC_FEATURES_DISABLED Keycloak has packed some functionality in features, including some disabled features, such as Technology Preview and deprecated features. Other features are enabled by default, but you can disable them if they do not apply to your use of Keycloak. Some supported features, and all preview features, are disabled by default. To enable a feature, enter this command: Enabled feature may be versioned, or unversioned. If you use a versioned feature name, e.g. feature:v1, that exact feature version will be enabled as long as it still exists in the runtime. If you instead use an unversioned name, e.g. just feature, the selection of the particular supported feature version may change from release to release according to the following precedence: The following list contains supported features that are enabled by default, and can be disabled if not needed. The following list contains supported features that are disabled by default, and can be enabled if needed. Preview features are disabled by default and are not recommended for use in production. These features may change or be removed at a future release. The following list contains deprecated features that will be removed in a future release. These features are disabled by default. account-api[:v1], account[:v3], admin-api[:v1], admin-fine-grained-authz[:v1,v2], admin[:v2], authorization[:v1], cache-embedded-remote-store[:v1], ciba[:v1], client-policies[:v1], client-secret-rotation[:v1], client-types[:v1], clusterless[:v1], declarative-ui[:v1], device-flow[:v1], docker[:v1], dpop[:v1], dynamic-scopes[:v1], fips[:v1], hostname[:v2], impersonation[:v1], ipa-tuura-federation[:v1], kerberos[:v1], login[:v2,v1], multi-site[:v1], oid4vc-vci[:v1], opentelemetry[:v1], organization[:v1], par[:v1], passkeys[:v1], persistent-user-sessions[:v1], preview, quick-theme[:v1], recovery-codes[:v1], scripts[:v1], step-up-authentication[:v1], token-exchange[:v1], transient-users[:v1], update-email[:v1], user-event-metrics[:v1], web-authn[:v1]"
