["https://www.keycloak.org/high-availability/concepts-memory-and-cpu-sizing"]
title = "Concepts for sizing CPU and memory resources - Keycloak"
description = "Understand these concepts to avoid resource exhaustion and congestion"
full_description = "Performance will be lowered when scaling to more Pods (due to additional overhead) and using a cross-datacenter setup (due to additional traffic and operations). Increased cache sizes can improve the performance when Keycloak instances running for a longer time. This will decrease response times and reduce IOPS on the database. Still, those caches need to be filled when an instance is restarted, so do not set resources too tight based on the stable state measured once the caches have been filled. Use these values as a starting point and perform your own load tests before going into production."
author = "Keycloak Team"
year_published = 2025
