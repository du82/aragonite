["https://www.keycloak.org/2022/03/releases"]
title = "Keycloak release plans for 2022 - Keycloak"
description = "Keycloak - the open source identity and access management solution. Add single-sign-on and authentication to applications and secure services with minimum effort."
full_description = "December last year was a bit on the crazy side with 3 feature releases of Keycloak (15.1, 16.0, and 16.1). This was down to balancing WildFly upgrades with introduction of the Quarkus dist preview. This year we are planning to bring more predictability to Keycloak releases and are aiming for a quarterly release, with more frequent patch releases in-between. One thing worth highlighting is we have decided to extend the support of the WildFly distribution until September to give everyone more time to migrate. New store is graduated to the new default store for PostgreSQL and CockroachDB. We will come back with more details on what happens with the old store and support for other database vendors, but rest assured we will give everyone plenty of heads up, and at the minimum the old store will be supported at least until the middle of 2023. With the new Quarkus distribution, new Operator, and new Store we are aiming to shift our focus onto production deployments of Keycloak. Keycloak 21 is the release where we’re aiming all this effort to really come together to make it as easy as possible to install and manage Keycloak at any scale. Remaining deprecated OpenID Connect adapters will be removed (adapter deprecation blog post), including: © Keycloak Authors 2025. © 2025 The Linux Foundation. All rights reserved. The Linux Foundation has registered trademarks and uses trademarks. For a list of trademarks of The Linux Foundation, please see our Trademark Usage page."
