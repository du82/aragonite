["https://www.keycloak.org/docs/latest/server_admin/index.html"]
title = "Server Administration Guide"
full_description = "Server Administration Getting Started Securing applications Server Developer Authorization Services Upgrading Release Notes export KC_BOOTSTRAP_ADMIN_USERNAME=<username> export KC_BOOTSTRAP_ADMIN_PASSWORD=<password> bin/kc.[sh|bat] start Export files from the Admin Console are not suitable for backups or data transfer between servers. Only boot-time exports are suitable for backups or data transfer between servers. UpdateEmail is Preview and is not fully supported. This feature is disabled by default. To enable start the server with --features=preview or --features=update-email If you enable this feature and you are migrating from a previous version, enable the Update Email required action in your realms. Otherwise, users cannot update their email addresses. Not all the keystore types support all types of keys. For example, JKS in all modes and PKCS12 in fips mode (BCFIPS provider) cannot store secret key entries. REST and confidential clients must set Admin URL so Keycloak can send clients the pushed not-before policy request. If you disable Import Users, you cannot save user profile attributes into the Keycloak database. Also, you cannot save metadata except for user profile metadata mapped to the LDAP. This metadata can include role mappings, group mappings, and other metadata based on the LDAP mappers' configuration. When you attempt to change the non-LDAP mapped user data, the user update is not possible. For example, you cannot disable the LDAP mapped user unless the user’s enabled flag maps to an LDAP attribute. When working with imported users, Keycloak performs a LDAP search when the user is queried to validate the user and decorate it so that the configured mappers work properly. This means that extra care must be taken when performing unfiltered user searches that may fetch a big number of users as a LDAP search will be issued for every imported user that is found, possibly affecting the performance in a negative way. Operations that fetch a single user (for example during login) are usually cached and should not be impacted by this extra LDAP search that is performed when the user is fetched for the first time."
year_published = 2025
clearnet = "https://www.keycloak.org/docs/latest/server_admin/index.html"
