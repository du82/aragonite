["https://www.keycloak.org/operator/installation"]
title = "Keycloak Operator Installation - Keycloak"
description = "How to install the Keycloak Operator on Kubernetes and OpenShift"
full_description = "kubectl apply -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.1.3/kubernetes/keycloaks.k8s.keycloak.org-v1.yml kubectl apply -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.1.3/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml kubectl apply -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.1.3/kubernetes/kubernetes.yml The recommended way to install the Keycloak Operator in Kubernetes environments is to use the Operator Lifecycle Manager (OLM). Be sure that you have cluster-admin permission or an equivalent level of permissions granted by an administrator. The following procedure describes how to install the Keycloak Operator. However, for general instructions on installing Operators using OLM, see Install your operator with OLM. In the default Catalog, the Keycloak Operator is named keycloak-operator. Make sure to use the fast channel to find the operator. You may select to either have the Operator watch the namespace where it is installed, or to watch a single namespace of your choosing. The Operator will watch the namespace where it is installed. You may optionally select a namespace with the -n option. It is currently not fully supported for the operator to watch multiple or all namespaces. In circumstances where you want to watch multiple namespaces, you can install multiple operators. CRD revisions from newer Operator versions won’t introduce breaking changes except for the eventual removal of fields that have been well deprecated. Thus newer CRDs are generally backward compatible. the CRDs installed last will be the ones in use. This applies to OLM installations as well where the Operator version, that is installed as the last, also installs and overrides the CRDs if they exists in the cluster already. older CRDs may not be forwards compatible with new fields used by newer operators. When using OLM it will check if your custom resources are compatible with the CRDs being installed, so the usage of new fields can prevent the simultaneous installation of older operator versions."
