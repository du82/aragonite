["https://www.keycloak.org/observability/metrics-for-troubleshooting"]
title = "Metrics for troubleshooting Keycloak deployment - Keycloak"
description = "Learn about metrics that can indicate where the issue is, for example, when service level objective is not met"
full_description = "Observation: Latency service level objective is not met. Metrics that indicate a problem: Keycloak’s database connection pool is often exhausted, and there are threads queuing for a connection to be retrieved from the pool. Keycloak’s users cache hit ratio is at a low percentage, around 5%. This means only 1 out of 20 user searches is able to obtain user data from the cache and the rest needs to load it from the database. Possible mitigations suggested: Increasing the users cache size to a higher number which would decrease the number of reads from the database. Increasing the number of connections in the connection pool. This would need to be checked with metrics for your database and tuning it for a higher load, for example, by increasing the number of available processors. This guide focuses on Keycloak metrics. Troubleshooting the database itself is out of scope. This guide provides general guidance. You should always confirm the configuration change by conducting a performance test comparing the metrics in question for the old and the new configuration."
author = "Keycloak Team"
year_published = 2025
clearnet = "https://www.keycloak.org/observability/metrics-for-troubleshooting"
