["https://www.keycloak.org/high-availability/deploy-infinispan-kubernetes-crossdc"]
title = "Deploy Infinispan for HA with the Infinispan Operator - Keycloak"
description = "Building block for an Infinispan deployment on Kubernetes"
full_description = '''Only Infinispan version 15.0.13.Final or more recent patch releases are supported for external Infinispan deployments. apiVersion: v1 kind: Secret type: Opaque metadata: name: connect-secret namespace: keycloak data: identities.yaml: Y3JlZGVudGlhbHM6CiAgLSB1c2VybmFtZTogZGV2ZWxvcGVyCiAgICBwYXNzd29yZDogc3Ryb25nLXBhc3N3b3JkCiAgICByb2xlczoKICAgICAgLSBhZG1pbgo= (1) apiVersion: v1 kind: Secret metadata: name: ispn-xsite-sa-token (1) annotations: kubernetes.io/service-account.name: "xsite-sa" (2) type: kubernetes.io/service-account-token kubectl create sa -n keycloak xsite-sa oc policy add-role-to-user view -n keycloak -z xsite-sa kubectl create -f xsite-sa-secret-token.yaml kubectl get secrets ispn-xsite-sa-token -o jsonpath="{.data.token}" | base64 -d > Site-A-token.txt kubectl create sa -n keycloak xsite-sa oc policy add-role-to-user view -n keycloak -z xsite-sa kubectl create -f xsite-sa-secret-token.yaml kubectl get secrets ispn-xsite-sa-token -o jsonpath="{.data.token}" | base64 -d > Site-B-token.txt kubectl create secret generic -n keycloak xsite-token-secret \ --from-literal=token="$(cat Site-B-token.txt)" kubectl create secret generic -n keycloak xsite-token-secret \ --from-literal=token="$(cat Site-A-token.txt)" kubectl -n keycloak create secret generic xsite-keystore-secret \ --from-file=keystore.p12="./certs/keystore.p12" \ (1) --from-literal=password=secret \ (2) --from-literal=type=pkcs12 (3) kubectl -n keycloak create secret generic xsite-truststore-secret \ --from-file=truststore.p12="./certs/truststore.p12" \ (1) --from-literal=password=caSecret \ (2) --from-literal=type=pkcs12 (3) The Infinispan CR for Site-A apiVersion: infinispan.org/v1 kind: Infinispan metadata: name: infinispan (1) namespace: keycloak annotations: infinispan.org/monitoring: 'true' (2) spec: replicas: 3 jmx: enabled: true security: endpointSecretName: connect-secret (3) service: type: DataGrid sites: local: name: site-a (4) expose: type: Route (5) maxRelayNodes: 128 encryption: transportKeyStore: secretName: xsite-keystore-secret (6) alias: xsite (7) filename: keystore.p12 (8) routerKeyStore: secretName: xsite-keystore-secret (6) alias: xsite (7) filename: keystore.p12 (8) trustStore: secretName: xsite-truststore-secret (9) filename: truststore.p12 (10) locations: - name: site-b (11) clusterName: infinispan namespace: keycloak (12) url: openshift://api.site-b (13) secretName: xsite-token-secret (14) 1 The cluster name 2 Allows the cluster to be monitored by Prometheus. 3 If using a custom credential, configure here the secret name. 4 The name of the local site, in this case Site-A. 5 Exposing the cross-site connection using OpenShift Route. 6 The secret name where the Keystore exists as defined in the previous step. 7 The alias of the certificate inside the Keystore. 8 The secret key (filename) of the Keystore as defined in the previous step. 9 The secret name where the Truststore exists as defined in the previous step. 10 The Truststore key (filename) of the Keystore as defined in the previous step. 11 The remote site’s name, in this case Site-B. 12 The namespace of the Infinispan cluster from the remote site. 13 The OpenShift API URL for the remote site. 14 The secret with the access token to authenticate into the remote site.'''
