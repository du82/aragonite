["https://www.keycloak.org/server/db"]
title = "Configuring the database - Keycloak"
description = "An overview about how to configure relational databases"
full_description = "FROM quay.io/keycloak/keycloak:latest ADD --chown=keycloak:keycloak --chmod=644 https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc11/23.5.0.24.07/ojdbc11-23.5.0.24.07.jar /opt/keycloak/providers/ojdbc11.jar ADD --chown=keycloak:keycloak --chmod=644 https://repo1.maven.org/maven2/com/oracle/database/nls/orai18n/23.5.0.24.07/orai18n-23.5.0.24.07.jar /opt/keycloak/providers/orai18n.jar # Setting the build parameter for the database: ENV KC_DB=oracle # Add all other build parameters needed, for example enable health and metrics: ENV KC_HEALTH_ENABLED=true ENV KC_METRICS_ENABLED=true # To be able to use the image with the Keycloak Operator, it needs to be optimized, which requires Keycloak's build step: RUN /opt/keycloak/bin/kc.sh build # The database vendor. db=postgres # The username of the database user. db-username=keycloak # The password of the database user. db-password=change_me # Sets the hostname of the default JDBC URL of the chosen vendor db-url-host=keycloak-postgres bin/kc.[sh|bat] start --db postgres --db-url-host keycloak-postgres --db-username keycloak --db-password change_me The examples above include the minimum settings needed to connect to the database but it exposes the database password and is not recommended. Use the conf/keycloak.conf as shown above, environment variables, or keystore for at least the password. For details on these properties and any performance implications, see the Oracle JDBC driver configuration documentation. FROM quay.io/keycloak/keycloak:latest ADD --chmod=0666 https://github.com/awslabs/aws-advanced-jdbc-wrapper/releases/download/2.3.1/aws-advanced-jdbc-wrapper-2.3.1.jar /opt/keycloak/providers/aws-advanced-jdbc-wrapper.jar Certain vendors, such as Azure SQL and MariaDB Galera, do not support or rely on the XA transaction mechanism. Enabling XA transactions in a containerized environment does not fully support XA recovery unless stable storage is available at that path. db The database vendor. In production mode the default value of dev-file is deprecated, you should explicitly specify the db instead. CLI: --db Env: KC_DB"
