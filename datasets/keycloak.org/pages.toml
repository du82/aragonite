title = "Server Developer Guide"
full_description = 'Server Developer Getting Started Securing applications Server Administration Authorization Services Upgrading Release Notes The following example assumes that you created the user admin with the password password in the master realm as shown in the Getting Started Guide tutorial. curl \ -d "client_id=admin-cli" \ -d "username=admin" \ -d "password=password" \ -d "grant_type=password" \ "http://localhost:8080/realms/master/protocol/openid-connect/token" curl \ -d "client_id=<YOUR_CLIENT_ID>" \ -d "client_secret=<YOUR_CLIENT_SECRET>" \ -d "grant_type=client_credentials" \ "http://localhost:8080/realms/master/protocol/openid-connect/token" To set the theme for the master Admin Console you need to set the Admin Console theme for the master realm. bin/kc.[sh|bat] start --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false If you want to manually delete the content of the themes cache, you can do so by deleting the data/tmp/kc-gzip-cache directory of the server distribution. It can be useful for instance if you redeployed custom providers or custom themes without disabling themes caching in the previous server executions. If no default value is provided and there’s no corresponding system property or environment variable, then nothing is replaced and you end up with the format in your template. javaVersion=${java.version} unixHome=${env.HOME:Unix home not found} windowsHome=${env.HOMEPATH:Windows home not found} <#macro content> <#-- footer at the end of the login box --> <div> <ul id="kc-login-footer-links"> <li><a href="#home">Home</a></li> <li><a href="#about">About</a></li> <li><a href="#contact">Contact</a></li> </ul> <div> </#macro> passwordResetSubject=My password recovery passwordResetBody=Reset password link: {0} passwordResetBodyHtml=<a href="{0}">Reset password</a> import { KeycloakProvider } from "@keycloak/keycloak-ui-shared"; //... <KeycloakProvider environment={{ serverBaseUrl: "http://localhost:8080", realm: "master", clientId: "security-admin-console" }}> {/* rest of you application */} </KeycloakProvider>'
