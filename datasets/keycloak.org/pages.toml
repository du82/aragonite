title = "Keycloak JavaScript adapter - Keycloak"
description = "Client-side JavaScript library that can be used to secure web applications."
full_description = '''import Keycloak from 'keycloak-js'; const keycloak = new Keycloak({ url: "http://keycloak-server", realm: "my-realm", clientId: "my-app" }); try { const authenticated = await keycloak.init(); if (authenticated) { console.log('User is authenticated'); } else { console.log('User is not authenticated'); } } catch (error) { console.error('Failed to initialize adapter:', error); } await keycloak.init({ onLoad: 'check-sso', silentCheckSsoRedirectUri: `${location.origin}/silent-check-sso.html` }); <!doctype html> <html> <body> <script> parent.postMessage(location.href, location.origin); </script> </body> </html> Silent check-sso functionality is limited in some modern browsers. Please see the Modern Browsers with Tracking Protection Section. async function fetchUsers() { const response = await fetch('/api/users', { headers: { accept: 'application/json', authorization: `Bearer ${keycloak.token}` } }); return response.json(); } try { await keycloak.updateToken(30); } catch (error) { console.error('Failed to refresh token:', error); } const users = await fetchUsers(); Both access and refresh token are stored in memory and are not persisted in any kind of storage. Therefore, these tokens should never be persisted to prevent hijacking attacks. Session Status iframe functionality is limited in some modern browsers. Please see Modern Browsers with Tracking Protection Section. import Keycloak from 'keycloak-js'; import KeycloakCapacitorAdapter from 'keycloak-capacitor-adapter'; const keycloak = new Keycloak({ url: "http://keycloak-server", realm: "my-realm", clientId: "my-app" }); await keycloak.init({ adapter: KeycloakCapacitorAdapter, }); import Keycloak, { KeycloakAdapter } from 'keycloak-js'; // Implement the 'KeycloakAdapter' interface so that all required methods are guaranteed to be present. const MyCustomAdapter: KeycloakAdapter = { async login(options) { // Write your own implementation here. } // The other methods go here... }; const keycloak = new Keycloak({ url: "http://keycloak-server", realm: "my-realm", clientId: "my-app" }); await keycloak.init({ adapter: MyCustomAdapter, });'''
