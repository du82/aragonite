["https://www.keycloak.org/high-availability/bblocks-multi-site"]
title = "Building blocks multi-site deployments - Keycloak"
description = "Overview of building blocks, alternatives and not considered options"
full_description = "We provide these blueprints to show a minimal functionally complete example with a good baseline performance for regular installations. You would still need to adapt it to your environment and your organization’s standards and security best practices. The following building blocks are needed to set up a multi-site deployment with synchronous replication. The building blocks link to a blueprint with an example configuration. They are listed in the order in which they need to be installed. Not considered: Two regions on the same or different continents, as it would increase the latency and the likelihood of network failures. Synchronous replication of databases as services with Aurora Regional Deployments on AWS is only available within the same region. Not considered: A stretched ROSA cluster which spans multiple availability zones, as this could be a single point of failure if misconfigured. Blueprint: Deploy Infinispan for HA with the Infinispan Operator using the Infinispan Operator, and connect the two sites using Infinispan’s Gossip Router. Not considered: Direct interconnections between the Kubernetes clusters on the network layer. It might be considered in the future. Blueprint: Deploy Keycloak for HA with the Keycloak Operator that includes connecting to the Aurora database and the Infinispan server. A load balancer which checks the /lb-check URL of the Keycloak deployment in each site, plus an automation to detect Infinispan connectivity problems between the two sites. Blueprint: Deploy an AWS Global Accelerator load balancer together with Deploy an AWS Lambda to disable a non-responding site. © Keycloak Authors 2025. © 2025 The Linux Foundation. All rights reserved. The Linux Foundation has registered trademarks and uses trademarks. For a list of trademarks of The Linux Foundation, please see our Trademark Usage page."
