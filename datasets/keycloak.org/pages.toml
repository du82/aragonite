["https://www.keycloak.org/2020/09/new-account-console.adoc"]
title = "New Account Console - Keycloak"
description = "Keycloak - the open source identity and access management solution. Add single-sign-on and authentication to applications and secure services with minimum effort."
full_description = 'body { --pf-global--FontFamily--sans-serif: Comic Sans MS; --pf-global--FontFamily--heading--sans-serif: Comic Sans MS; --pf-global--BackgroundColor--dark-100: #2B9AF3; --pf-global--Color--100: #004080; } The Keycloak team is excited that our new Account Console is finally final! The old account console is still available for those who need it, but the new version is the default from now on. In addition to the modern look and feel, we make it really easy for organizations to personalize the console with custom themes and even custom pages that can have unlimited functionality. PatternFly 4 makes it really easy to theme the new account console using its system of CSS variables. All you have to do is tweak a few variables, add your own logo, and the console is perfectly skinned. You may have noticed the "Keycloak Man" section above. The new console includes one of our most requested features. That is the ability to add and remove sub-pages. So we’ve made it very easy to develop and plug in your own React component and add it to the Account Console. It’s even possible to build new pages with nothing but an editor. No build step is required unless you want to use more advanced tools like JSX and Typescript. Of course, this "Keycloak Man" theme is available online as a Keycloak Quick Start so you can check out all the source. New Account Console is the home for user configuration of new Keycloak features like WebAuthn support. So look for new features to start showing up in the New Account Console instead of the old one. © Keycloak Authors 2025. © 2025 The Linux Foundation. All rights reserved. The Linux Foundation has registered trademarks and uses trademarks. For a list of trademarks of The Linux Foundation, please see our Trademark Usage page.'
