["https://www.keycloak.org/securing-apps/mod-auth-mellon"]
title = "mod_auth_mellon Apache Module - Keycloak"
description = "Configuring the mod_auth_mellon Apache module with Keycloak"
full_description = '''Keycloak does not provide any official support to mod_auth_mellon. The instructions below are best-effort and may not be up-to-date. The guide assumes that the server is a RHEL system. Although similar steps would be needed for other linux systems. We recommend that you stick to official mod_auth_mellon documentation for more details. <Location / > MellonEnable info MellonEndpointPath /mellon/ MellonSPMetadataFile /etc/httpd/saml2/mellon_metadata.xml MellonSPPrivateKeyFile /etc/httpd/saml2/mellon.key MellonSPCertFile /etc/httpd/saml2/mellon.crt MellonIdPMetadataFile /etc/httpd/saml2/idp_metadata.xml </Location> <Location /private > AuthType Mellon MellonEnable auth Require valid-user </Location> fqdn=`hostname` mellon_endpoint_url="https://${fqdn}/mellon" mellon_entity_id="${mellon_endpoint_url}/metadata" file_prefix="$(echo "$mellon_entity_id" | sed 's/[^A-Za-z.]/_/g' | sed 's/__*/_/g')" mv ${file_prefix}.cert /etc/httpd/saml2/mellon.crt mv ${file_prefix}.key /etc/httpd/saml2/mellon.key mv ${file_prefix}.xml /etc/httpd/saml2/mellon_metadata.xml curl -k -o /etc/httpd/saml2/idp_metadata.xml \ https://$idp_host/realms/test_realm/protocol/saml/descriptor Configtest is equivalent to the -t argument to apachectl. If the configuration test shows any errors, correct them before proceeding.'''
author = "Keycloak Team"
year_published = 2025
clearnet = "https://www.keycloak.org/securing-apps/mod-auth-mellon"
