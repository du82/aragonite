["https://www.keycloak.org/2019/04/keycloak-newsletter-1"]
title = "Keycloak Community Newsletter #1 - Keycloak"
description = "Keycloak - the open source identity and access management solution. Add single-sign-on and authentication to applications and secure services with minimum effort."
full_description = '''This is the very first "Keycloak Community Newsletter." The goal of this newsletter is to share news about the Keycloak project. Since the beginning of the year, the community has been really active. Each week several blog posts about Keycloak are published. Here is a short selection. Let's start with Philip Riecks who explains in this article how you can use Microprofile JWT Authentication with Keycloak and React. Joshua Alfred Erney explains in this blog series how to integrate Keycloak and Kong, a popular API management platform. With Mohamed Aboullaite's blog post, you will learn how to secure your Kibana dashboards using Keycloak. Finally in this three-part article, the process of installing Keycloak on Kubernetes will become very clear. From now on, new larger Keycloak's features will be openly discussed. For each new feature, a design document will be created and pushed to our Github repository as a simple MarkDown file. This strategy makes it easy for everyone to comment as well as contribute to the designs by opening Github issues and providing pull requests. We have already three documents open for discussion: The big announcement, two weeks ago, was that WebAuthn became an official W3C Standard. This event is a milestone in the world of authentication and Identity Management. The goal of WebAuthn, according to Wikipedia is to: standardize an interface for public-key authentication of users to web-based applications and services. The Keycloak community is naturally really interested in this new standard. A design document is available and the community has even started to work on a prototype. In March, the Javaland conference was held in Germany. The conference had two talks about Keycloak. Sébastien blanc gave a talk about Securing your Microservices with Keycloak. A Github repository contains the demo. Thomas Darimont also gave an introductory talk in German about Keycloak. In April, at Devoxx France, Guillaume Gillon will talk in French about how to combine Keycloak and Gravitee.io.'''
author = "Keycloak Team"
year_published = 2019
clearnet = "https://www.keycloak.org/2019/04/keycloak-newsletter-1"
