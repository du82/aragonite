["https://www.keycloak.org/server/caching"]
title = "Configuring distributed caches - Keycloak"
description = "Defines the cache mechanism for high-availability."
full_description = 'Remove the <memory max-count="..."/> Change owners attribute of the distributed-cache tag to 2 or more Use -D<property>=<value> to pass the properties via the JAVA_OPTS_APPEND environment variable or in the CLI command. Additional Stacks It is recommended to use one of the stacks available above. Additional stacks are provided by Infinispan, but it is outside the scope of this guide how to configure them. Please refer to Setting up Infinispan cluster transport for further documentation. <jgroups> <stack name="my-encrypt-udp" extends="udp"> <SSL_KEY_EXCHANGE keystore_name="server.jks" keystore_password="password" stack.combine="INSERT_AFTER" stack.position="VERIFY_SUSPECT2"/> <ASYM_ENCRYPT asym_keylength="2048" asym_algorithm="RSA" change_key_on_coord_leave = "false" change_key_on_leave = "false" use_external_key_exchange = "true" stack.combine="INSERT_BEFORE" stack.position="pbcast.NAKACK2"/> </stack> </jgroups> <cache-container name="keycloak"> <transport lock-timeout="60000" stack="my-encrypt-udp"/> ... </cache-container> Use -D<property>=<value> to modify the ports above in your JAVA_OPTS_APPEND environment variable or in your CLI command. Use -Djgroups.bind.address=<IP> to modify the bind address in your JAVA_OPTS_APPEND environment variable or in your CLI command. Use -D<property>=<value> set this in your JAVA_OPTS_APPEND environment variable or in your CLI command. cache Defines the cache mechanism for high-availability. By default in production mode, a ispn cache is used to create a cluster between multiple server nodes. By default in development mode, a local cache disables clustering and is intended for development and testing purposes. CLI: --cache Env: KC_CACHE By default in production mode, a ispn cache is used to create a cluster between multiple server nodes. By default in development mode, a local cache disables clustering and is intended for development and testing purposes. CLI: --cache Env: KC_CACHE cache-config-file Defines the file from which cache configuration should be loaded from. The configuration file is relative to the conf/ directory. CLI: --cache-config-file Env: KC_CACHE_CONFIG_FILE'
