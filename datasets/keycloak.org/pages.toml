["https://www.keycloak.org/getting-started/getting-started-docker"]
title = "Docker - Keycloak"
description = "Get started with Keycloak on Docker"
full_description = "docker run -p 8080:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin quay.io/keycloak/keycloak:26.1.3 start-dev Make sure your machine or container platform can provide sufficient memory and CPU for your desired usage of Keycloak. See Concepts for sizing CPU and memory resources for more on how to get started with production sizing. This command starts Keycloak exposed on the local port 8080 and creates an initial admin user with the username admin and password admin. A realm in Keycloak is equivalent to a tenant. Each realm allows an administrator to create isolated groups of applications and users. Initially, Keycloak includes a single realm, called master. Use this realm only for managing Keycloak and not for managing any applications. As a user in the Account Console, you can manage your account including modifying your profile, adding two-factor authentication, and including identity provider accounts. To secure the first application, you start by registering the application with your Keycloak instance: To confirm the client was created successfully, you can use the SPA testing application on the Keycloak website. © Keycloak Authors 2025. © 2025 The Linux Foundation. All rights reserved. The Linux Foundation has registered trademarks and uses trademarks. For a list of trademarks of The Linux Foundation, please see our Trademark Usage page."
