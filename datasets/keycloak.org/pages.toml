description = "This describes how to take a site offline so that it no longer processes client requests"
full_description = "NAMESPACE= (1) REGION= (2) HOSTNAME=$(kubectl -n $NAMESPACE get svc accelerator-loadbalancer --template=\"{{range .status.loadBalancer.ingress}}{{.hostname}}{{end}}\") aws elbv2 describe-load-balancers \\ --query \"LoadBalancers[?DNSName=='${HOSTNAME}'].LoadBalancerArn\" \\ --region ${REGION} \\ --output text arn:aws:elasticloadbalancing:eu-west-1:606671647913:loadbalancer/net/a49e56e51e16843b9a3bc686327c907b/9b786f80ed4eba3d ACCELERATOR_NAME= (1) ACCELERATOR_ARN=$(aws globalaccelerator list-accelerators \\ --query \"Accelerators[?Name=='${ACCELERATOR_NAME}'].AcceleratorArn\" \\ --region us-west-2 \\ (2) --output text ) LISTENER_ARN=$(aws globalaccelerator list-listeners \\ --accelerator-arn ${ACCELERATOR_ARN} \\ --query \"Listeners[*].ListenerArn\" \\ --region us-west-2 \\ --output text ) aws globalaccelerator list-endpoint-groups \\ --listener-arn ${LISTENER_ARN} \\ --region us-west-2 { \"EndpointGroups\": [ { \"EndpointGroupArn\": \"arn:aws:globalaccelerator::606671647913:accelerator/d280fc09-3057-4ab6-9330-6cbf1f450748/listener/8769072f/endpoint-group/a30b64ec1700\", \"EndpointGroupRegion\": \"eu-west-1\", \"EndpointDescriptions\": [ { \"EndpointId\": \"arn:aws:elasticloadbalancing:eu-west-1:606671647913:loadbalancer/net/a49e56e51e16843b9a3bc686327c907b/9b786f80ed4eba3d\", \"Weight\": 128, \"HealthState\": \"HEALTHY\", \"ClientIPPreservationEnabled\": false }, { \"EndpointId\": \"arn:aws:elasticloadbalancing:eu-west-1:606671647913:loadbalancer/net/a3c75f239541c4a6e9c48cf8d48d602f/5ba333e87019ccf0\", \"Weight\": 128, \"HealthState\": \"HEALTHY\", \"ClientIPPreservationEnabled\": false } ], \"TrafficDialPercentage\": 100.0, \"HealthCheckPort\": 443, \"HealthCheckProtocol\": \"TCP\", \"HealthCheckIntervalSeconds\": 30, \"ThresholdCount\": 3 } ] } aws globalaccelerator update-endpoint-group \\ --endpoint-group-arn arn:aws:globalaccelerator::606671647913:accelerator/d280fc09-3057-4ab6-9330-6cbf1f450748/listener/8769072f/endpoint-group/a30b64ec1700