["https://www.keycloak.org/observability/event-metrics"]
title = "Enabling Keycloak Event Metrics - Keycloak"
description = "Learn how to enable and use Keycloak Event Metrics"
full_description = "This guide is describing a feature which is currently in preview. Please provide your feedback while we’re continuing to work on this. bin/kc.[sh|bat] start --features=user-event-metrics --metrics-enabled=true --event-metrics-user-enabled=true ... metrics-enabled If the server should expose metrics. If enabled, metrics are available at the /metrics endpoint. CLI: --metrics-enabled Env: KC_METRICS_ENABLED If enabled, metrics are available at the /metrics endpoint. CLI: --metrics-enabled Env: KC_METRICS_ENABLED event-metrics-user-enabled Preview: Create metrics based on user events. CLI: --event-metrics-user-enabled Env: KC_EVENT_METRICS_USER_ENABLED Available only when metrics are enabled and feature user-event-metrics is enabled event-metrics-user-events Preview: Comma-separated list of events to be collected for user event metrics. Reduce the number of metrics. If empty or not set, all events create a metric. CLI: --event-metrics-user-events Env: KC_EVENT_METRICS_USER_EVENTS Available only when user event metrics are enabled Use remove_credential instead of remove_totp, and update_credential instead of update_totp and update_password. Deprecated values: remove_totp, update_totp, update_password Reduce the number of metrics. If empty or not set, all events create a metric. CLI: --event-metrics-user-events Env: KC_EVENT_METRICS_USER_EVENTS event-metrics-user-tags Preview: Comma-separated list of tags to be collected for user event metrics. By default only realm is enabled to avoid a high metrics cardinality. CLI: --event-metrics-user-tags Env: KC_EVENT_METRICS_USER_TAGS Available only when user event metrics are enabled By default only realm is enabled to avoid a high metrics cardinality. CLI: --event-metrics-user-tags Env: KC_EVENT_METRICS_USER_TAGS"
