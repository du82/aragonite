["https://www.keycloak.org/securing-apps/mod-auth-openidc"]
title = "mod_auth_openidc Apache HTTPD Module - Keycloak"
description = "Configuring the mod_auth_openidc Apache module with Keycloak"
full_description = "Keycloak does not provide any official support to mod_auth_openidc. The instructions below are best-effort and may not be up-to-date. We recommend that you stick to official mod_auth_openidc documentation for more details. LoadModule auth_openidc_module modules/mod_auth_openidc.so ServerName ${HOSTIP} <VirtualHost *:80> ServerAdmin webmaster@localhost DocumentRoot /var/www/html #this is required by mod_auth_openidc OIDCCryptoPassphrase a-random-secret-used-by-apache-oidc-and-balancer OIDCProviderMetadataURL ${KC_ADDR}/realms/${KC_REALM}/.well-known/openid-configuration OIDCClientID ${CLIENT_ID} OIDCClientSecret ${CLIENT_SECRET} OIDCRedirectURI http://${HOSTIP}/${CLIENT_APP_NAME}/redirect_uri # maps the preferred_username claim to the REMOTE_USER environment variable OIDCRemoteUserClaim preferred_username <Location /${CLIENT_APP_NAME}/> AuthType openid-connect Require valid-user </Location> </VirtualHost>"
author = "Keycloak Team"
year_published = 2025
clearnet = "https://www.keycloak.org/securing-apps/mod-auth-openidc"
