["https://www.keycloak.org/high-availability/introduction"]
title = "Multi-site deployments - Keycloak"
description = "Connect multiple Keycloak deployments in different sites to increase the overall availability"
full_description = "Keycloak supports deployments that consist of multiple Keycloak instances that connect to each other using its Infinispan caches; load balancers can distribute the load evenly across those instances. Those setups are intended for a transparent network on a single site. The Keycloak high-availability guide goes one step further to describe setups across multiple sites. While this setup adds additional complexity, that extra amount of high availability may be needed for some environments. High availability with a primary DB instance in one Availability Zone, and a synchronously replicated reader in the second Availability Zone While equivalent setups should work, you will need to verify the performance and failure behavior of your environment. We provide functional tests, failure tests and load tests in the Keycloak Benchmark Project. While we did not see a hard limit in our tests with these values, we ask you to test for higher volumes with horizontally and vertically scaled Keycloak name instances and databases. During upgrades of Keycloak or Infinispan both sites needs to be taken offline for the duration of the upgrade. After certain failure scenarios, manual intervention may be required to restore redundancy by bringing the failed site back online. The different guides introduce the necessary concepts and building blocks. For each building block, a blueprint shows how to set a fully functional example. Additional performance tuning and security hardening are still recommended when preparing a production setup. © Keycloak Authors 2025. © 2025 The Linux Foundation. All rights reserved. The Linux Foundation has registered trademarks and uses trademarks. For a list of trademarks of The Linux Foundation, please see our Trademark Usage page."
