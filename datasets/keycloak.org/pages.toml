["https://www.keycloak.org/server/reverseproxy"]
title = "Using a reverse proxy - Keycloak"
description = "Learn how to configure Keycloak together with a reverse proxy, api gateway, or load balancer."
full_description = "If you are using a reverse proxy for anything other than https passthrough and do not set the proxy-headers option, then by default you will see 403 Forbidden responses to requests via the proxy that perform origin checking. If either forwarded or xforwarded is selected, make sure your reverse proxy properly sets and overwrites the Forwarded or X-Forwarded-* headers respectively. To set these headers, consult the documentation for your reverse proxy. Misconfiguration will leave Keycloak exposed to security vulnerabilities. When using the xforwarded setting, the X-Forwarded-Port takes precedence over any port included in the X-Forwarded-Host. If the TLS connection is terminated at the reverse proxy (edge termination), enabling HTTP through the http-enabled setting is required. Client certificate lookup via a proxy header for X.509 authentication is considered security-sensitive. If misconfigured, a forged client certificate header can be used for authentication. Extra precautions need to be taken to ensure that the client certificate information can be trusted when passed via a proxy header. Double check your use case needs reencrypt or edge TLS termination which implies using a proxy header for client certificate lookup. TLS passthrough is recommended as a more secure option when X.509 authentication is desired as it does not require passing the certificate via a proxy header. Client certificate lookup from a proxy header is applicable only to reencrypt and edge TLS termination. If passthrough is not an option, implement the following security measures: Configure your network so that Keycloak is isolated and can accept connections only from the proxy. Make sure that the proxy overwrites the header that is configured in spi-x509cert-lookup-<provider>-ssl-client-cert option. Keep in mind that any of the spi-x509cert-* options don’t reflect the proxy-trusted-addresses option. Pay extra attention to the spi-x509cert-lookup-<provider>-trust-proxy-verification setting. Make sure you enable it only if you can trust your proxy to verify the client certificate. Setting spi-x509cert-lookup-<provider>-trust-proxy-verification=true without the proxy verifying the client certificate chain will expose Keycloak to security vulnerability when a forged client certificate can be used for authentication."
author = "Keycloak Team"
year_published = 2025
clearnet = "https://www.keycloak.org/server/reverseproxy"
