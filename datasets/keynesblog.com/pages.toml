description = "Post su Elogio della spesa publica scritto da keynesblog"
full_description = "Elogio della spesa publica Perché tagliare le tasse non funziona? Di keynesblog 9 gennaio 2015 37 commenti La riduzione delle imposte, viene detto in continuazione sui giornali italiani, è una necessità impellente per il nostro paese se si vuole uscire dalla crisi economica. C’è chi, come Francesco Giavazzi, è arrivato a sostenere che pur di realizzarla non dovremmo preoccuparci di sfondare il tetto del 3% di rapporto deficit/PIL imposto dai trattati europei. […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1624953d', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); L’imbroglio della disoccupazione di equilibrio Di keynesblog 29 ottobre 2014 16 commenti Nel progetto di bilancio inviato alla Commissione Europea il ministro Padoan ha contestato i calcoli dell’Unione europea sul PIL potenziale e la disoccupazione di equilibrio. Vediamo di cosa si tratta. Il FMI: gli investimenti pubblici si ripagano da soli Di keynesblog 9 ottobre 2014 25 commenti Prosegue il ritorno al buon senso economico del Fondo Monetario Internazionale sotto la guida di Olivier Blanchard. Che ora scopre, dati alla mano, che un dollaro speso in infrastrutture ne genera quasi tre di Larry Summers, dal Financial Times Il referendum contro l’austerità è un regalo alla Germania? Ma anche no Di keynesblog 1 settembre 2014 40 commenti Ovvero: perché chi non guarda contemporaneamente anche al lato dell’offerta rischia di prendere lucciole per lanterne, fischi per fiaschi e il keynesismo per la croce keynesiana; e ancora: perché la domanda è un vincolo esterno quanto il tasso di cambio fisso. Il Personal Computer è figlio della spesa pubblica Di keynesblog 28 marzo 2014 19 commenti Il mito popolare che circonda l’origine del personal computer è che esso sia stato sviluppato interamente con gli sforzi del settore privato. Questa storia, però, trascura lo sforzo concertato del governo di sostenere questa nuova tecnologia sia con finanziamenti che personale, prima, durante e dopo la sua “nascita” a Xerox. Ciò che rende il PC ” […] Navigazione articolo"
