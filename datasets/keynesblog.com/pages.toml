["https://keynesblog.com/2023/02/07/in-ricordo-di-luigi-pasinetti"]
title = "In ricordo di Luigi Pasinetti | Keynes blog"
description = "Luigi Pasinetti E' venuto a mancare alcuni giorni fa Luigi Pasinetti. Economista eterodosso, esponente della scuola sraffiana e post keynesiana, Pasinetti ha insegnato a Cambridge e alla Cattolica di Milano. I suoi contributi più rilevanti sono relativi alla distribuzione del reddito, la teoria del capitale, i modelli di crescita multisettoriale. Il suo nome è legato…"
full_description = "In ricordo di Luigi Pasinetti Pubblicato da keynesblog il 7 febbraio 2023 in Economia Luigi Pasinetti E’ venuto a mancare alcuni giorni fa Luigi Pasinetti. Economista eterodosso, esponente della scuola sraffiana e post keynesiana, Pasinetti ha insegnato a Cambridge e alla Cattolica di Milano. I suoi contributi più rilevanti sono relativi alla distribuzione del reddito, la teoria del capitale, i modelli di crescita multisettoriale. Il suo nome è legato anche al teorema che afferma l’indipendenza del saggio di profitto dalla propensione di risparmio dei lavoratori.Per ricordarlo, segnaliamo il suo saggio “Critica della teoria neoclassica della crescita e della distribuzione” pubblicato su Moneta e Credito nel 2000. Il saggio esamina le principali teorie della distribuzione del reddito nel loro rapporto con le teorie della crescita economica. In primo luogo, viene considerato l’approccio classico, con particolare attenzione alla teoria ricardiana. Si discute poi la teoria neoclassica, evidenziandone le origini (Bohm-Bawerk, Wicksell, Clark) e il ruolo della funzione di produzione aggregata. Si ricorda poi l’emergere di una teoria “keynesiana” della distribuzione del reddito sulla scia del modello di crescita di Harrod e la sorprendente rinascita della teoria neoclassica (dopo i contributi di Solow e Meade). Ma, come mostra il paper, la teoria neoclassica della distribuzione del reddito manca di coerenza logica e ha fondamenta traballanti, come è stato rivelato dalle severe critiche mosse alla funzione di produzione neoclassica. La letteratura economica mainstream aggira questo problema semplicemente ignorandolo, mentre i modelli di crescita endogena escludono la questione della teoria della distribuzione dalla loro considerazione. Tuttavia, sebbene l’economia mainstream ignori il problema della distribuzione del reddito, si tratta di una questione troppo rilevante e una serie di nuove linee di ricerca, brevemente descritte, tentano nuovi approcci.Link: https://rosa.uniroma1.it/rosa04/moneta_e_credito/article/view/10133 __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f1347d87c', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1347d8e9', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink Navigazione articolo ← L’attualità di Keynes In memoria di Salvatore Biasco →"
