["https://keynesblog.com/2020/02/10/tony-thirlwall-sul-tasso-di-cambio-non-e-un-meccanismo-efficiente-per-equilibrare-la-bilancia-dei-pagamenti"]
title = "Tony Thirlwall sul tasso di cambio: “Non è un meccanismo efficiente per equilibrare la bilancia dei pagamenti” | Keynes blog"
description = "Anthony Thirlwall è uno dei più noti studiosi di economia internazionale post-keynesiana. In questo articolo pubblicato da Moneta e Credito, analizza la sua teoria sulla crescita vincolata dalla bilancia dei pagamenti. A distanza di molti anni, Thirwall mantiene due argomenti: il primo è che i paesi hanno bisogno di valuta internazionale di scambio (oggi…"
full_description = "2 commenti Tony Thirlwall sul tasso di cambio: “Non è un meccanismo efficiente per equilibrare la bilancia dei pagamenti” Pubblicato da keynesblog il 10 febbraio 2020 in consigliati, Economia, Europa, segnalazioni, Teoria economica Anthony Thirlwall è uno dei più noti studiosi di economia internazionale post-keynesiana. In questo articolo pubblicato da Moneta e Credito, analizza la sua teoria sulla crescita vincolata dalla bilancia dei pagamenti. A distanza di molti anni, Thirwall mantiene due argomenti: il primo è che i paesi hanno bisogno di valuta internazionale di scambio (oggi principalmente dollari ed euro) e la scarsità di tali valute è un vincolo allo sviluppo e al commercio. Un problema, questo, che nell’euro viene superato dalla disponibilità illimitata di riserve tramite il Target 2 (leggasi in proposito Lavoie qui). Il secondo argomento è che il tasso di cambio flessibile non è un meccanismo efficiente per riequilibrare la bilancia dei pagamenti: Sulla questione del tasso di cambio flessibile come meccanismo equilibrante, bisogna anzitutto distinguere il tasso di cambio nominale da quello reale. Per i paesi è semplice aggiustare il tasso nominale, ma non altrettanto aggiustare il tasso di cambio reale perché i competitors potrebbero adottare comportamenti del tipo “price to market” o operare delle ritorsioni, e i prezzi interni potrebbero aumentare nonostante una svalutazione nominale. In secondo luogo, le condizioni di Marshall-Lerner devono essere soddisfatte perché la bilancia dei pagamenti vada in equilibrio. Questo potrebbe non succedere nel breve periodo, o a causa della natura dei beni esportati o importati da un certo paese. L’evidenza internazionale degli ultimi 40 anni a partire dalla crisi del sistema dei tassi fissi di Bretton Woods, nel 1971, suggerisce che variazioni del tasso di cambio non sono un’arma efficiente nell’aggiustamento della bilancia dei pagamenti. Le valute si apprezzano e deprezzano, ma ciononostante enormi squilibri globali nelle bilance dei pagamenti rimangono. Buona lettura: https://ojs.uniroma1.it/index.php/monetaecredito/article/download/9621/9501 __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f1102841d', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1102846f', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink Navigazione articolo ← Le banche creano moneta “dal nulla”? L’ex vicepresidente della BCE spiega cosa significa Lo spread, la “gaffe” della Lagarde e gli opposti estremismi → 2 commenti su “Tony Thirlwall sul tasso di cambio: “Non è un meccanismo efficiente per equilibrare la bilancia dei pagamenti”” FEDERICO FARNETI 11 febbraio 2020 alle 11:30 BRAVISSIMI, W BLOG KEYNES!!! Edo-Stark 21 febbraio 2020 alle 18:07 Benissimo; nash ci insegna che sussistono paradossi sull’assioma della razionalità, soprattutto nei casi in cui l’informazioni sono parziali; non è quindi possibile per lo stato riequilibrare il cambio nominale con quello reale, proprio per l’impossibilità di prevedere tutte le reazioni che il riequilibrio artificiale provocherebbe, per i vari motivi citati. Divertente come lo stesso non valga per i cambi fissi, stabiliti. Si cita Bretton Woods che altro non era che questo, un sistema di cambi fissi. La parzialità dell’informazione permane anche in questa situazione, per l’impossibilità di prevedere le evoluzioni future nella quantità e qualità della massa monetaria che smuovono di nuovo il tasso reale, senza citare l’evidente azzardo morale che comporta per i gestori delle politiche monetarie stesse( che voi tanto amate), ad aumentare il circolante, in quanto protetti da eventuali svalutazioni. Esattamente ciò che successe a BrettonWood. Che l’oro vi stia antipatico non vale a invalidare il concetto, cari keynesiani. Non mancano considerazioni filosofiche. Il cambio flessibile, per definizione oscilla. Ora capisco l’avversione alla volatilità dei mercati da parte di chi sui mercati non ci ha mai operato realmente (comprare un bond non è operare). Ma il mercato libero è per definizione incerto. Il prezzo su base annua è definibile come range, più che come una cifra univoca. Il mercato è socratico, sa di non sapere.Crolla, risale, vegeta per mesi. E invece a voi chi vi conferisce una tale saccenteria da poter individuare con precisione un piccolo rangino, con certezza assoluta? Il modellino che avete costruito? In una scienza molle come l’economia? Il beneficio del dubbio, questo rende il mercato libero, flessibile, che si muove, un sistema migliore del vostro, che pecca, a essere buoni, di tanta hubris, tanto da sfiorare l’arroganza. I commenti sono chiusi."
