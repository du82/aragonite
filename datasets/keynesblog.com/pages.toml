full_description = "Europa Più SURE, meno MES Di keynesblog 1 dicembre 2020 Alessandro Mangia, Francesco Saraceno da rivistailmulino.it Nel febbraio scorso gli Stati europei si sono trovati in prima linea nel contrastare la crisi del Covid-19 con massicci aumenti della spesa pubblica. L’Europa ha agito da facilitatore con il programma Pepp (programma di acquisto per l’emergenza pandemica) di acquisti di titoli della Bce, con la sospensione delle […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f169bc04c', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Come Mario Draghi ha salvato l’euro Di keynesblog 19 settembre 2020 4 commenti di Francesco Saraceno, tratto da “La Riconquista”, Ed. Luiss Quando Mario Draghi ha lasciato la testa della BCE, nel novembre del 2019, su una cosa i molti estimatori e i pochi detrattori del presidente della BCE si sono trovati d’accordo: durante gli otto anni in cui ha condotto la politica monetaria dell’Eurozona, l’ex governatore della Banca d’Italia […] Le conseguenze economiche della pandemia: Mario Draghi e le scelte di politica economica ai tempi del coronavirus Di keynesblog 30 marzo 2020 3 commenti di Francesco Saraceno, da Luiss Open Mario Draghi, sul Financial Times, ha fornito un contributo interessante al dibattito sulle politiche di contrasto alla pandemia del Coronavirus. Cosa si può ritenere dell’analisi del rimpianto ex presidente della Bce? Andiamo per punti. #Covid19, sorpresa: la quarantena fa bene all’economia Di keynesblog 27 marzo 2020 9 commenti In queste settimane abbiamo ascoltato economisti, industriali e politici mettere in contrapposizione le conseguenze economiche della “quarantena”* e la tutela della salute. L’argomento, in sintesi, può essere riassunto con “le conseguenze economiche della quarantena sarebbero peggiori di quelle della malattia” o addirittura “morirebbe più gente di fame per per il virus”. Un’idea che, ricordiamolo, stava […] La crisi del #Covid19 è l’occasione per ripensare il capitalismo Di keynesblog 24 marzo 2020 5 commenti di Mariana Mazzucato da The Guardian (trad. Keynesblog.com) Viviamo una crisi di portata mondiale. La pandemia di Covid-19 si sta rapidamente diffondendo in tutti i paesi, con una scala e una gravità che non si vedono dalla devastante influenza spagnola del 1918. A meno che non venga intrapresa un’azione coordinata globale per contenerla, il contagio […] Lo spread, la “gaffe” della Lagarde e gli opposti estremismi Di keynesblog 13 marzo 2020 5 commenti (spiegazione per sovranisti stile stampante magica da una parte, e impenitenti membri della setta dei ricardiani estinti dall’altra). 1. Fatto: ieri la presidente della BCE Christine Lagarde ha detto che non è compito della banca centrale “chiudere gli spread” tra paesi. Questo ha causato un aumento di 60 punti base dello spread tra Italia e […] Tony Thirlwall sul tasso di cambio: “Non è un meccanismo efficiente per equilibrare la bilancia dei pagamenti” Di keynesblog 10 febbraio 2020 2 commenti Anthony Thirlwall è uno dei più noti studiosi di economia internazionale post-keynesiana. In questo articolo pubblicato da Moneta e Credito, analizza la sua teoria sulla crescita vincolata dalla bilancia dei pagamenti. A distanza di molti anni, Thirwall mantiene due argomenti: il primo è che i paesi hanno bisogno di valuta internazionale di scambio (oggi […] La riforma del #MES, i limiti dell’architettura dell’euro e il rischio #Italexit Di keynesblog 5 dicembre 2019 3 commenti In questi giorni si sta facendo un gran parlare della riforma del Meccanismo Europeo di Stabilità (MES o EMS in inglese), lo strumento che permette agli stati in difficoltà finanziarie di accedere a linee di credito privilegiate (ad esempio per rispondere ad una crisi bancaria). La discussione purtroppo si è subito infiammata grazie alla componente […] L’eredità di Mario Draghi Di keynesblog 25 ottobre 2019 L’Unione ha dimostrato, negli anni più recenti, una sorprendente capacità di auto-riformarsi. E l’indiscusso protagonista di questi cambiamenti è stato Mario Draghi Blanchard: “Le élites hanno confidato troppo nel capitalismo” Di keynesblog 12 luglio 2018 4 commenti « Di fronte all’ascesa del populismo, i governi devono occuparsi urgentemente delle disuguaglianze », avverte l’ex capo economista del Fondo Monetario Internazionale Olivier Blanchard. Presente ai Rencontres Économiques di Aix-en-Provence, il 6 luglio scorso, Blanchard esprime timori anche sulla fragilità della moneta unica. Navigazione articolo ← Articoli più vecchi"
