title = "FAQ | Keynes blog"
description = "Post su FAQ scritto da keynesblog"
full_description = "FAQ Robert Skidelsky: “Keynes e la Teoria Generale” [video sub ITA] Di keynesblog 15 marzo 2015 8 commenti Robert Skidelsky, economista e storico dell’economia, biografo di Keynes, in questa intervista per il sito EconStories illustra i contenuti della Teoria Generale dell’Occupazione, dell’Interesse e della Moneta, l’opera più importante dell’economista di Cambridge. In particolare Skidelsky spiega perché il “keynesismo” illustrato nei libri di testo differisce sostanzialmente dal contenuto della Teoria Generale. Grazie all’amico Faber Fabbris […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f178bef77', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Smontiamo i luoghi comuni (3): il keynesismo è inattuale a causa degli elevati debiti pubblici? Di keynesblog 21 gennaio 2013 13 commenti Gli elevati debiti pubblici hanno origini differenti. In paesi vittime delle bolle, essi sono cresciuti poiché gli Stati hanno acquistato i debiti privati nel momento in cui hanno salvato le banche. Secondo la Banca Mondiale, mediamente i salvataggi sono costati il 12,8% del PIL delle nazioni coinvolte. In Italia, invece, l’origine del debito pubblico è […] Smontiamo i luoghi comuni (2): il keynesismo non è più attuale a causa della globalizzazione? Di keynesblog 15 gennaio 2013 5 commenti La globalizzazione è un fenomeno tutt’altro che recente. In effetti, come abbiamo visto, il capitalismo nasce con le borse in cui si trattavano gli scambi commerciali internazionali. Smontiamo i luoghi comuni (1): la finanziarizzazione dell’economia rende obsoleto il keynesismo? Di keynesblog 18 dicembre 2012 15 commenti Questo articolo è il primo di una breve serie in cui analizzeremo le risposte alle affermazioni più comuni contro la possibilità di implementare politiche keynesiane nel contesto politico-economico attuale. Navigazione articolo"
