full_description = "Teoria economica In memoria di Salvatore Biasco Di keynesblog 13 novembre 2023 1 Commento Ad un anno dalla scomparsa di Salvatore Biasco, economista allievo di Paolo Sylos Labini, Maurice Dobb, Nicholas Kaldor e Hyman Minsky, la rivista Moneta e Credito ha pubblicato uno speciale in memoriam per ricordare il suo lavoro. Come sottolineato da D’Ippoliti e Roncaglia nell’introduzione “I molteplici contributi di Biasco hanno spaziato dall’economia internazionale alla finanza, […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b1f298b2ff5', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); #Covid19: per 95% economisti quarantena ha priorità sul PIL. Zingales: “3 volte il PIL prezzo accettabile per salvare milioni di vite” Di keynesblog 5 aprile 2020 12 commenti Mentre in Italia, a fronte di 15mila morti accertati e di un tassi di contagio che rimane ancora preoccupante, c’è chi già pensa a riaprire tutto, negli Stati Uniti gli economisti hanno le idee ben chiare su come affrontare la situazione: il lockdown va perseguito fino in fondo, anche a costo di una contrazione del […] Tony Thirlwall sul tasso di cambio: “Non è un meccanismo efficiente per equilibrare la bilancia dei pagamenti” Di keynesblog 10 febbraio 2020 2 commenti Anthony Thirlwall è uno dei più noti studiosi di economia internazionale post-keynesiana. In questo articolo pubblicato da Moneta e Credito, analizza la sua teoria sulla crescita vincolata dalla bilancia dei pagamenti. A distanza di molti anni, Thirwall mantiene due argomenti: il primo è che i paesi hanno bisogno di valuta internazionale di scambio (oggi […] Le banche creano moneta “dal nulla”? L’ex vicepresidente della BCE spiega cosa significa Di keynesblog 18 dicembre 2019 2 commenti Cogliendo l’occasione di un articolo comparso su VoxEU, Vitor Constâncio, ex vicepresidente della BCE con Mario Draghi, spiega su Twitter in che senso è corretto sostenere che le banche commerciali creano moneta “dal nulla” e cosa questo significhi. Non è vero, come molti pensano, che le banche prestano i soldi depositati dai clienti. E non […] La riforma del #MES, i limiti dell’architettura dell’euro e il rischio #Italexit Di keynesblog 5 dicembre 2019 3 commenti In questi giorni si sta facendo un gran parlare della riforma del Meccanismo Europeo di Stabilità (MES o EMS in inglese), lo strumento che permette agli stati in difficoltà finanziarie di accedere a linee di credito privilegiate (ad esempio per rispondere ad una crisi bancaria). La discussione purtroppo si è subito infiammata grazie alla componente […] Le svalutazioni non sono più quelle di una volta Di keynesblog 17 ottobre 2019 1 Commento Può apparire controintuitivo, ma una svalutazione può tramutarsi in una riduzione delle esportazioni, invece che un’espansione delle stesse. E’ quanto Valentina Bruno e Hyun Song Shin rilevano analizzando i dati dell’export mondiale a livello dettagliato in relazione all’andamento del dollaro. Un apprezzamento del dollaro, e quindi una svalutazione delle altre valute, frena il commercio internazionale, […] Serve un nuovo vecchio keynesismo Di keynesblog 17 settembre 2019 Pubblichiamo la traduzione italiana dell’articolo di Larry Summers e Anna Stansbury in occasione della conferenza annuale dei banchieri centrali di Jackson Hole. Summers, uno degli esponenti più noti del mainstream economico, negli ultimi anni, con sempre maggiore enfasi, predica il ritorno ad un keynesismo più vicino al pensiero e alle proposte politiche di Keynes. di […] Joan Robinson, la ribelle razionale Di keynesblog 10 settembre 2019 di Maria Cristina Marcuzzo da Inet Joan Robinson era destinata ad essere una ribelle. Il padre era Sir Fredrick Maurice, che terminò la sua carriera militare accusando pubblicamente il Primo Ministro britannico Lloyd George di mentire sulla forza dell’esercito sul fronte occidentale della prima guerra mondiale. Il bisnonno era Fedrerick Denison Maurice, il cristiano socialista […] Alessandro Roncaglia, “L’età della disgregazione. Storia del pensiero economico contemporaneo” Di keynesblog 14 marzo 2019 1 Commento Alessandro Roncaglia, L’età della disgregazione. Storia del pensiero economico contemporaneo, Laterza 2019. Pubblichiamo la presentazione dell’autore tenuta presso l’Accademia Nazionale dei Lincei, marzo 2019 Link per acquistare il libro su IBS Il libro che vi presento arriva in libreria in questi giorni, dopo una lunga (e faticosa) fase di gestazione. Si intitola L’età della disgregazione […] Giorgio Lunghini: “La prospettiva Keynes” Di keynesblog 23 dicembre 2018 Ieri ci ha lasciati Giorgio Lunghini, uno degli economisti più attivi e profondi del panorama italiano. A lungo docente a Pavia, Milano e in Bocconi, Lunghini apparteneva a quel filone eterodosso italiano classico-keynesiano che coniugava una pluralità di approcci di differenti epoche, autori e scuole. Fino al 2010 ha tenuto all’Università Bocconi il corso progredito […] Navigazione articolo ← Articoli più vecchi"
