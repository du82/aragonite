description = "Post su Storia scritto da keynesblog"
full_description = "Storia L’attualità di Keynes Di keynesblog 8 febbraio 2022 In occasione del decimo anniversario di Keynesblog.com, pubblichiamo questo interessante articolo di Alessandro Bellocchi e Giuseppe Travaglini, tratto da “Nuova Lettera Matematica” del Dicembre 2021. di A. Bellocchi e G. Travaglini, da “Nuova Lettera Matematica”, Dicembre 2021 “Dobbiamo inventare una saggezza nuova per una nuova era. E nel frattempo, se vogliamo fare qualcosa di buono, […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1a3aaa34', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); 75 anni fa moriva John Maynard Keynes Di keynesblog 21 aprile 2021 1 Commento Il 21 aprile 1946, esattamente 75 anni fa, moriva John Maynard Keynes. Segnaliamo la breve biografia scientifica del grande economista di Cambridge scritta da Andrea Terzi http://www.ateconomics.com/wp-content/uploads/TERZI-A-2008-John-Maynard-Keynes.pdf Joan Robinson, la ribelle razionale Di keynesblog 10 settembre 2019 di Maria Cristina Marcuzzo da Inet Joan Robinson era destinata ad essere una ribelle. Il padre era Sir Fredrick Maurice, che terminò la sua carriera militare accusando pubblicamente il Primo Ministro britannico Lloyd George di mentire sulla forza dell’esercito sul fronte occidentale della prima guerra mondiale. Il bisnonno era Fedrerick Denison Maurice, il cristiano socialista […] Alessandro Roncaglia, “L’età della disgregazione. Storia del pensiero economico contemporaneo” Di keynesblog 14 marzo 2019 1 Commento Alessandro Roncaglia, L’età della disgregazione. Storia del pensiero economico contemporaneo, Laterza 2019. Pubblichiamo la presentazione dell’autore tenuta presso l’Accademia Nazionale dei Lincei, marzo 2019 Link per acquistare il libro su IBS Il libro che vi presento arriva in libreria in questi giorni, dopo una lunga (e faticosa) fase di gestazione. Si intitola L’età della disgregazione […] 1992: quando svalutammo la moneta per svalutare i salari Di keynesblog 27 febbraio 2018 10 commenti La crisi dello SME del 1992 si concluse con l’abbandono dell’accordo di cambio da parte dell’Italia e della Gran Bretagna. Su questo evento e sui suoi effetti i “noeuro” hanno costruito un mito non corrispondente alla realtà. In particolare mostreremo perché non si innescò una spirale inflattiva e come la svalutazione fu pagata dai lavoratori. […] Neanche Say credeva alla Legge di Say Di keynesblog 25 luglio 2017 7 commenti Il Prof. Riccardo Puglisi in un articolo sul suo blog ha (ben) spiegato cos’è il Prodotto Interno Lordo. Ma all’interno dell’articolo si può leggere anche qualcosa di più controverso di una semplice identità contabile: «E un concetto ancora più prezioso che entra in ballo qui è quello di circuito del reddito: come sintetizzato nella Legge […] La spesa pubblica che salvò la Germania Di keynesblog 5 settembre 2016 13 commenti di Gustavo Piga, da gustavopiga.it Nel 1946, il reddito pro-capite tedesco era pari al 36% di quello britannico e al 60% di quello francese. Nel 1959, la Germania acciuffa la Francia e nel 1970 gli inglesi. Questo miracolo renano si ottenne con una crescita media del 7,5% negli anni ’50. La Teoria Generale di Keynes compie 80 anni Di keynesblog 24 febbraio 2016 6 commenti di Robert Skidelsky Nel 1935, John Maynard Keynes scrisse a George Bernard Shaw: “Credo che scriverò un libro di teoria economica che rivoluzionerà in gran parte – non credo immediatamente, ma nel corso dei prossimi dieci anni – il modo in cui il mondo guarda ai problemi economici.” E, in effetti, l’opera magna di Keynes, […] Il ritorno del Keynesismo militare Di keynesblog 24 novembre 2015 11 commenti “… la guerra ha sempre provocato un’intensa attività industriale. Nel passato la finanza ortodossa ha considerato la guerra come l’unica legittima scusa per la creazione di occupazione tramite la spesa pubblica. Lei, signor Presidente, dopo aver gettato via tali catene, è libero di impegnare nell’interesse della pace e della prosperità la tecnica che finora è stata […] Robert Skidelsky: “Keynes e la Teoria Generale” [video sub ITA] Di keynesblog 15 marzo 2015 8 commenti Robert Skidelsky, economista e storico dell’economia, biografo di Keynes, in questa intervista per il sito EconStories illustra i contenuti della Teoria Generale dell’Occupazione, dell’Interesse e della Moneta, l’opera più importante dell’economista di Cambridge. In particolare Skidelsky spiega perché il “keynesismo” illustrato nei libri di testo differisce sostanzialmente dal contenuto della Teoria Generale. Grazie all’amico Faber Fabbris […] Navigazione articolo ← Articoli più vecchi"
