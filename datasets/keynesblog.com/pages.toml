description = "Il presidente degli Stati Uniti Joe Biden Pubblichiamo l'introduzione di un brief del Council of Economic Advisers degli Stati Uniti nel quale gli economisti che assistono il presidente americano mettono nero su bianco la fine dell'ideologia neoliberista, fatta di tasse basse, deregolamentazione e riduzione della spesa sociale. L'articolo completo è linkato in fondo a questo…"
full_description = "1 Commento Forti e persistenti segnali keynesiani dagli Stati Uniti Pubblicato da keynesblog il 15 Maggio 2021 in Economia Il presidente degli Stati Uniti Joe Biden Pubblichiamo l’introduzione di un brief del Council of Economic Advisers degli Stati Uniti nel quale gli economisti che assistono il presidente americano mettono nero su bianco la fine dell’ideologia neoliberista, fatta di tasse basse, deregolamentazione e riduzione della spesa sociale. L’articolo completo è linkato in fondo a questo post. Negli ultimi quattro decenni, l’idea che tasse più basse, meno spesa pubblica e minori regolamentazioni avrebbero generato una crescita economica più forte ha esercitato un’influenza sostanziale sulla politica pubblica degli Stati Uniti. Durante questo periodo, gli Stati Uniti hanno sottoinvestito in beni pubblici come le infrastrutture e l’innovazione e i guadagni dalla crescita sono maturati in modo sproporzionato per la parte superiore della distribuzione del reddito e della ricchezza. Persistono disparità razziali, etniche e di genere di lunga data. Inoltre, mentre sono stati fatti progressi storici nell’espansione dell’assicurazione sanitaria, resta ancora molto da fare per fornire un’adeguata protezione contro il rischio economico. Gli indicatori di deprivazione, come la povertà infantile, sono troppo alti, e il declino dell’aspettativa di vita complessiva in alcuni anni prima della pandemia, accompagnato da maggiori disparità, è motivo di preoccupazione. Il Tax Cuts and Jobs Act del 2017 (varato dall’Amministrazione Trump, ndt)) rifletteva la vecchia ortodossia delle tasse più basse. Una forte riduzione delle imposte sulle società in un periodo di alti profitti aziendali è stata venduta con previsioni troppo rosee sulla crescita economica che ne sarebbe derivata. La legge non ha mantenuto queste promesse. Non c’è stato alcun impatto evidente sugli investimenti o sulla crescita: il prodotto interno lordo è cresciuto del 2,4% nei due anni precedenti il passaggio della legge e del 2,4% nei due anni successivi. Invece, i tagli fiscali hanno contribuito alla disuguaglianza fornendo guadagni sproporzionati ai già benestanti senza i promessi guadagni salariali per la classe media. La teoria economica alla base dell’American Jobs Plan e dell’American Families Plan del presidente Biden è diversa. Queste politiche proposte riflettono l’evidenza empirica che un’economia forte dipende da una solida base di investimenti pubblici, e che gli investimenti in lavoratori, famiglie e comunità possono ripagare per decenni a venire. In contrasto con l’American Rescue Plan, questi piani non sono leggi di emergenza, ma affrontano sfide di lunga data. Per funzionare e fornire guadagni economici forti e condivisi, i mercati hanno bisogno di un settore pubblico impegnato ed efficace. Dalle politiche che stimolano l’innovazione e facilitano l’offerta di lavoro a quelle che forniscono investimenti nell’infanzia e protezioni contro l’insicurezza economica, il settore pubblico ha un ruolo importante da svolgere nel sostenere l’economia. Questi tipi di programmi pubblici permettono agli attori del mercato di continuare a produrre beni e servizi. Ma quando i politici dirigono il settore pubblico lontano da queste cose – non investendo nell’innovazione, nel sostegno alla partecipazione alla forza lavoro, nei bambini o nella protezione dal rischio – tutti soffrono di una crescita economica più lenta, di una maggiore disuguaglianza e di una ridotta sicurezza economica. In questo articolo, esponiamo le prove economiche che dimostrano perché un robusto investimento pubblico è un elemento importante di un’economia statunitense forte e inclusiva. Potete leggere l’articolo completo qui: https://www.whitehouse.gov/wp-content/uploads/2021/05/AJP-AFP-Narrative-2021-05-11-1930-.pdf __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67be871aa12a8', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67be871aa12f9', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink Navigazione articolo ← 75 anni fa moriva John Maynard Keynes Anche Draghi lo certifica: per ridurre il debito pubblico bisogna aumentare il deficit → Un commento su “Forti e persistenti segnali keynesiani dagli Stati Uniti” Michelangelo Tumini 15 Maggio 2021 alle 15:31 Condivido da sempre l’impostazione di politiche economiche basate sulle teorie keynesiane. Un bravo a Biden per averle riprese per favorire una redistribuzione della ricchezza, che negli ultimi 40 anni improntati sulle politiche imposte da Reagan e dalla Thatcher. I commenti sono chiusi."
