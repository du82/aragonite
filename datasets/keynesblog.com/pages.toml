["https://keynesblog.com/2023/11/13/in-memoria-di-salvatore-biasco"]
title = "In memoria di Salvatore Biasco | Keynes blog"
description = '''Ad un anno dalla scomparsa di Salvatore Biasco, economista allievo di Paolo Sylos Labini, Maurice Dobb, Nicholas Kaldor e Hyman Minsky, la rivista Moneta e Credito ha pubblicato uno speciale in memoriam per ricordare il suo lavoro. Come sottolineato da D'Ippoliti e Roncaglia nell'introduzione "I molteplici contributi di Biasco hanno spaziato dall’economia internazionale alla finanza,…'''
full_description = "1 Commento In memoria di Salvatore Biasco Pubblicato da keynesblog il 13 novembre 2023 in Economia, Italia, segnalazioni, Teoria economica Ad un anno dalla scomparsa di Salvatore Biasco, economista allievo di Paolo Sylos Labini, Maurice Dobb, Nicholas Kaldor e Hyman Minsky, la rivista Moneta e Credito ha pubblicato uno speciale in memoriam per ricordare il suo lavoro. Come sottolineato da D’Ippoliti e Roncaglia nell’introduzione “I molteplici contributi di Biasco hanno spaziato dall’economia internazionale alla finanza, passando per l’impegno politico in prima persona. Il lavoro di Biasco ha sempre sottolineato il ruolo centrale della politica economica ma anche la sua natura endogena. In contrasto con le teorie dominanti che attribuiscono le fluttuazioni economiche e le crisi a fattori esterni, Biasco considerava problematica l’idea di un equilibrio stabile di mercato. Il lavoro di Biasco ha gettato luce sull’importante impatto delle variabili finanziarie su quelle reali, ad esempio con articoli sull’endogenità dei cicli valutari e sull’importanza dei flussi lordi di capitali nel sistema monetario internazionale.” Sui cicli valutari rimandiamo in particolare al contributo di Daniela Palma, pubblicando di seguito l’abstract: Salvatore Biasco e l’instabilità dell’economia mondiale nella prospettiva dei “cicli valutari” Con il saggio su “I cicli valutari e l’economia internazionale” di fine anni Ottanta (1987), Salvatore Biasco avvia una importante riflessione teorica sul regime di fluttuazione dei cambi, confutando sulla base di un approccio keynesiano la validità dei modelli di determinazione del tasso di cambio ispirati ai principi di efficienza dei mercati finanziari. A partire da un quadro analitico di determinazione su base finanziaria del tasso di cambio nel quale le scelte di portafoglio degli operatori internazionali avvengono in condizioni di incertezza e di razionalità limitata, l’analisi mette in luce come la finanza speculativa di breve periodo amplifichi i movimenti della fluttuazione, provocando squilibri strutturali dell’economia reale, che retroagiscono sulla dinamica del cambio e concorrono a destabilizzare il quadro macroeconomico. Su questa linea interpretativa l’analisi di Biasco approda successivamente a una lettura del disequilibrio economico che ha caratterizzato la dinamica dello sviluppo mondiale fino al culmine della crisi finanziaria internazionale del 2007-2008, sottolineando il ruolo del dollaro, in quanto valuta di riferimento del sistema monetario internazionale, e il contributo dell’instabilità dei mercati valutari alla crescente fragilità finanziaria che ha investito l’economia capitalistica.Link all’articolo: https://rosa.uniroma1.it/rosa04/moneta_e_credito/article/view/18283 L’intero numero è liberamente consultabile all’indirizzo: https://rosa.uniroma1.it/rosa04/moneta_e_credito/issue/view/1663 __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f13c36740', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f13c36794', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: Salvatore Biasco Permalink Navigazione articolo ← In ricordo di Luigi Pasinetti Un commento su “In memoria di Salvatore Biasco” Mariano Claudio Vettori 15 novembre 2023 alle 00:51 grazie di un gradito ritorno del vostro blogel I commenti sono chiusi."
