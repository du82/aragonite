full_description = "ibt La fantastica uscita dall’euro dell’OFCE Di keynesblog 21 febbraio 2017 15 commenti Sui siti noeuro impazza un working paper pubblicato dall’OFCE di Parigi secondo il quale non vi sono pericoli per l’Italia in caso di uscita dall’euro. Vediamo di capire perché non c’è proprio nulla da festeggiare L’economia non è una scienza esatta, ma una scienza sociale. C’è però una bella differenza tra studiare una scienza […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b1f3bf68a31', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); La BCE spiega cos’è la moneta Di keynesblog 21 ottobre 2016 3 commenti Nella nostra serie sulla teoria della moneta endogena abbiamo già mostrato che le banche centrali sanno molto bene che la quantità di moneta non è sotto il loro diretto controllo. La Bank of England ha voluto esplicitarlo in modo inequivocabile, ma anche la BCE, sul suo sito ufficiale, nello spiegare la natura della moneta usa […] Che succede se usciamo dall’euro? Di keynesblog 8 ottobre 2016 21 commenti Il manifesto ha pubblicato ieri l’articolo che riportiamo qui di seguito. Seguono tre brevi note (nostre). L’articolo di Giorgio Lunghini (il manifesto il 23 settembre) e la replica di Sergio Cesaratto et al. (30 settembre) hanno il merito di riaprire la discussione sulle conseguenze dell’uscita dall’euro. Un dibattito spesso condito da eccessive semplificazioni. Per questo ci […] L’impossibile uscita “da sinistra” dall’euro Di keynesblog 26 settembre 2016 20 commenti di Guido Iodice Questo articolo è un commento critico all’intervista a Emiliano Brancaccio pubblicata da Micromega. Ho scelto di prenderla come spunto proprio perché stimo Brancaccio e credo che le suej tesi siano ispirate da una riflessione seria. Come premessa devo chiarire che non sono un difensore dell’euro: credo anzi che la moneta unica sia […] Il mainstream scopre la legge di Kaldor-Verdoorn Di keynesblog 6 settembre 2016 1 Commento La teoria economica dominante non è nuova a incorporare concetti sviluppati dai filoni eterodossi. Isteresi, deflazione da debiti, moneta endogena, crescita endogena sono solo alcuni degli esempi più noti di risultati delle teorie economiche non mainstrean (in particolare l’economia Post Keynesiana) che sono riproducibili in un modello ortodosso. A tale proposito segnaliamo ai lettori il paper Endogenous […] Michele Salvati recensisce “La battaglia contro l’Europa” di Thomas Fazi e Guido Iodice Di keynesblog 8 luglio 2016 11 commenti Michele Salvati, noto economista e politologo, ha recensito il libro di Thomas Fazi e Guido Iodice “La Battaglia contro l’Europa” per la prestigiosa rivista “Il Mulino”. Pur collocandosi alla parte opposta dello spettro politico della sinistra rispetto agli autori, Salvati esprime un giudizio complessivamente positivo e coglie la caratteristica di fondo del volume: radicalità dell’analisi […] Uno stimolo decentralizzato e un nuovo “whatever it takes” per l’Eurozona Di keynesblog 1 giugno 2016 17 commenti Il comitato scientifico del think tank Progressive Economy ha premiato ieri a Bruxelles il paper “Why further integration is the wrong answer to the EMU’s problems: the case for a decentralised fiscal stimulus” [la versione preliminare è scaricabile da questo link] di Thomas Fazi (eunews.it/oneuro) e Guido Iodice (Keynesblog.com), quale vincitore del Call for Papers 2016 nella […] Bill Clinton, il liberista Di keynesblog 16 Maggio 2016 6 commenti Hillary Clinton ha annunciato che, se eletta presidente, incaricherà suo marito Bill di “rivitalizzare l’economia”. Ecco perché non si tratta di una buona scelta. Tratto da “La battaglia contro l’Europa” di Thomas Fazi e Guido Iodice In libreria “La battaglia contro l’Europa” di T.Fazi e G.Iodice Di keynesblog 24 marzo 2016 7 commenti Esce oggi in libreria “La battaglia contro l’Europa” di Thomas Fazi (eunews.it/oneuro) e Guido Iodice (coautore di Keynes blog). Il libro è anche acquistabile, scontato, on line nei principali store, tra cui: Amazon (anche in formato e-book Kindle), IBS, Feltrinelli Meglio le frontiere per i capitali che per le persone Di keynesblog 10 febbraio 2016 13 commenti di Emiliano Brancaccio da http://www.emilianobrancaccio.it Intervento alla Conferenza “per un Piano B in Europa”, Parigi, 23 Gennaio 2016 Traduzione di Lorenzo Battisti per Marx21.it Proponiamo l’intervento di Emiliano Brancaccio all’incontro di Parigi per un “Piano B per l’Europa”, l’iniziativa di alcuni esponenti delle sinistre radicali europee. Le proposte di Emiliano Brancaccio hanno creato un vivace dibattito […] Navigazione articolo ← Articoli più vecchi"
