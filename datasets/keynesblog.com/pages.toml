full_description = "eurobancor Meglio le frontiere per i capitali che per le persone Di keynesblog 10 febbraio 2016 13 commenti di Emiliano Brancaccio da http://www.emilianobrancaccio.it Intervento alla Conferenza “per un Piano B in Europa”, Parigi, 23 Gennaio 2016 Traduzione di Lorenzo Battisti per Marx21.it Proponiamo l’intervento di Emiliano Brancaccio all’incontro di Parigi per un “Piano B per l’Europa”, l’iniziativa di alcuni esponenti delle sinistre radicali europee. Le proposte di Emiliano Brancaccio hanno creato un vivace dibattito […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f16f9414b', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Appello per una “Bretton Woods” europea Di keynesblog 15 ottobre 2014 33 commenti Un gruppo di oltre 50 economisti italiani, tra i più prestigiosi, ha sottoscritto questo appello per una riforma dell’Unione monetaria europea al fine di evitarne la possibile esplosione. Sebbene vi sia dedicato uno dei punti, forse il documento risulta deficitario su un argomento che da sempre in questo blog abbiamo indicato come centrale, ovvero i […] Il referendum contro l’austerità è un regalo alla Germania? Ma anche no Di keynesblog 1 settembre 2014 40 commenti Ovvero: perché chi non guarda contemporaneamente anche al lato dell’offerta rischia di prendere lucciole per lanterne, fischi per fiaschi e il keynesismo per la croce keynesiana; e ancora: perché la domanda è un vincolo esterno quanto il tasso di cambio fisso. Riunire l’unione monetaria: una proposta per contrastare gli squilibri della zona euro Di keynesblog 30 aprile 2014 14 commenti Gli squilibri commerciali persistenti minacciano di far deragliare l’economia europea. Luca Fantacci propone una European Clearing Union per promuovere un modello sostenibile di commercio in tutta l’Eurozona di Luca Fantacci, Università Bocconi Perché non c’è bisogno della Germania per fare l’euro-bancor Di keynesblog 11 marzo 2014 10 commenti Un bell’articolo di Enrico Grazzini (“Euro, come recuperare la sovranità monetaria”), pubblicato da Sbilanciamoci qualche giorno fa, e che volentieri segnaliamo in fondo a questo post, è una buona occasione per chiarire un punto “politico” sull’idea di superare l’euro attraverso la trasformazione dell’unione monetaria europea in un sistema ispirato all’International Clearing Union di Keynes. L’articolo fa […] Come superare l’euro senza farsi male Di keynesblog 4 marzo 2014 10 commenti Tra l’attuale, insostenibile, moneta unica, e l’idea ingenua e propagandistica che si debba uscire dall’euro un venerdì sera e poi “vedere di nascosto l’effetto che fa”, una terza plausibile via è trasformare l’euro da “moneta unica” a “moneta comune”, in un nuovo sistema di cambi tra monete nazionali D.Palma, G.Iodice – da “Euro Tunnel”, allegato […] Gli scenari dell’euro e la soluzione del Bancor Di keynesblog 15 gennaio 2014 16 commenti di Enrico Grazzini da Economia e Politica La Commissione dell’Unione Europea per la prima volta in base al trattato Two Pack della UE ha revisionato la legge italiana di bilancio imponendo al governo Letta di garantire la diminuzione più rapida del deficit pubblico. E’ sempre più chiaro che Parlamento e governo italiano non decidono quasi […] Un euro a 5 stelle? Di keynesblog 2 dicembre 2013 49 commenti Beppe Grillo durante il V3 Day svoltosi ieri a Genova ha rilanciato l’idea di un referendum per la permanenza nell’euro. Diversi giuristi ritengono questa proposta impraticabile, ma è pur vero che una legge costituzionale potrebbe superare le obiezioni in punta di diritto, come del resto già avvenne per il referendum consultivo del 1989 con il […] Per correggere il surplus tedesco non basta più domanda e inflazione in Germania Di keynesblog 25 novembre 2013 1 Commento Dopo tanta attesa, anche la Germania arriva ad essere processata dalla Commissione Europea, con l’accusa di tenere tirato il freno della domanda interna e di basare la propria crescita (peraltro modesta nel biennio 2012-13) solo sulle esportazioni, contribuendo alla crisi dei Paesi del Sud Europa. Quel baco keynesiano nel Six-Pack Di keynesblog 11 novembre 2013 3 commenti Il Six-Pack, il pacchetto di sei riforme al Patto di Stabilità dell’Unione Europea entrato in vigore a fine 2011, contiene un piccolo “bug”. Una delle norme approvate dall’Unione prevede una procedura di infrazione sugli avanzi e disavanzi delle partite correnti, simile a quella sul deficit pubblico. Complice il rallentamento dell’economia tedesca e delle importazioni, la […] Navigazione articolo ← Articoli più vecchi"
