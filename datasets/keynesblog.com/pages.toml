title = "Chi siamo | Keynes blog"
description = '"Dobbiamo inventare una nuova saggezza per una nuova epoca. Nel frattempo, se vogliamo veramente fare qualcosa di buono, dobbiamo apparire eterodossi, importuni, pericolosi, ribelli nei confronti di chi ci ha preceduto." John Maynard Keynes Keynes blog offre una rassegna di idee sulla "grande recessione" iniziata nel 2008 e la cui conclusione pare non essere ancora…'
full_description = "66 commenti Chi siamo “Dobbiamo inventare una nuova saggezza per una nuova epoca. Nel frattempo, se vogliamo veramente fare qualcosa di buono, dobbiamo apparire eterodossi, importuni, pericolosi, ribelli nei confronti di chi ci ha preceduto.” John Maynard Keynes Keynes blog offre una rassegna di idee sulla “grande recessione” iniziata nel 2008 e la cui conclusione pare non essere ancora alle porte. E’ proprio vero che i “sacrifici” ci tireranno fuori dalla crisi? Le liberalizzazioni sono una soluzione per aumentare la crescita? Lo spread calerà se ci dimostreremo “responsabili” e applicheremo le ricette di austerità? Oppure, al contrario, i sacrifici deprimeranno la domanda peggiorando le cose? E se è così, quali politiche economiche alternative è possibile e necessario adottare per la ripresa? A queste ed altre domande Keynes blog tenterà di rispondere segnalando articoli, saggi, interventi di economisti, pensatori e politici. Pur accogliendo i contributi di diverse scuole del pensiero economico eterodosse e critiche del neoliberismo, il blog si richiama esplicitamente a John Maynard Keynes, l’economista britannico che, per usare le parole del premio Nobel Paul Krugman, con il suo lavoro ci diede la soluzione della Grande Depressione degli Anni ’30 del Novecento e che ispirò le politiche economiche del mondo occidentale per oltre 30 anni dopo la fine della Seconda Guerra mondiale. L’abbandono di quel fecondo filone di pensiero, a partire dagli anni ’70, in favore di un laissez-faire spesso senza alcun contrappeso, ha sguarnito la politica e la teoria economica degli strumenti per comprendere e gestire i cicli economici e ha prodotto ineguaglianze sempre più gravi che, secondo molti, sono tra le cause della recessione di questi anni. Keynes blog è ideato e curato da Guido Iodice e Daniela Palma. Guido Iodice ha ideato Aprileonline.info, quotidiano on-line del “Correntone DS” e Rossodisera.info, quotidiano on-line dell’area di Rifondazione Comunista-Sinistra Europea, noto anche come “la Velina rossissima”. Di entrambi è stato editorialista e corsivista. Si è occupato di politiche per l’innovazione tecnologica nell’Associazione NetWork-DS, per la quale ha prodotto il piano nazionale per la banda larga “Italiacavo”, che ha fatto parte del programma elettorale dei Democratici di Sinistra nel 2001. Come collaboratore parlamentare di Pietro Folena si è speso in particolare in iniziative legislative a favore del software libero/open source e per una revisione liberale del copyright. Ha fatto parte degli organismi dirigenti nazionali dei Democratici di Sinistra. Daniela Palma, laureata con lode in Scienze Statistiche ed Economiche su temi dell’Economia Internazionale presso l’Università degli Studi di Roma “La Sapienza”. E’ stata Visiting Research Fellow presso il National Center for Geographic Information and Analysis del National Science Foundation degli Stati Uniti nella sede della University of California at Santa Barbara, lavorando su una dissertazione dal titolo “Trasformazioni topologiche dei dati nell’analisi di serie socio – economiche territoriali” con la quale ha conseguito il Dottorato di Ricerca in Analisi Economica Matematica e Statistica dei Fenomeni Sociali (Università degli Studi di Roma “La Sapienza”, 1995). Primo ricercatore presso l’Enea nelle aree dell’economia dell’innovazione e dello sviluppo e dell’analisi della sostenibilità ambientale ed economica, è autrice di diversi articoli pubblicati in riviste e libri sia a livello nazionale che internazionale. Coordina dal 1999 le attività dell’Osservatorio Enea sull’Italia nella Competizione Tecnologica Internazionale. Disclaimer: Gli articoli esprimono le opinioni degli autori e non impegnano in nessun modo le Amministrazioni di appartenenza. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c31c11697b7', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c31c116983f', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... 66 commenti su “Chi siamo” Francesco Saraceno 1 febbraio 2012 alle 17:47 Rispondi In bocca al lupo, e al piacere di leggervi! Francesco rita 1 febbraio 2012 alle 18:33 Rispondi Davvero un piacere, per una vecchia keynesiana irredenta. A presto leggervi, spero! Rita francesco zaffuto 11 febbraio 2012 alle 12:10 Rispondi Non so se la ricetta indicata da Keynes possa bastare per uscire da questa crisi, ma sicuramente non si può prescindere dalle indicazioni di Keynes. Vi auguro tanto ascolto in web. guido rizzi 4 luglio 2016 alle 10:47 Rispondi sicuramente non può bastare, perchè la crisi ha motivazioni ben più profonde: la globalizzazione neoliberista. Ma è vero che non si può prescinderne Giuseppe Masala 5 marzo 2012 alle 21:39 Rispondi Vi ho scoperto oggi. Non è mai troppo tardi. Piacere di leggervi. guiodic 5 marzo 2012 alle 22:13 Rispondi Grazie! Antonio Pirozzi 9 marzo 2012 alle 19:33 Rispondi Complimenti per la splendida e valida iniziativa ! Credo che la sfida della sinistra, quella vera, quella che pensa e propone un progetto di vita ai cittadini, dovrebbe parlare in maniera comprensibile alla gente di economia e politica, e di come queste cose possono risolvere oppure avvelenare la vita di tutti ! aquilone 29 marzo 2012 alle 07:58 Rispondi Uh! Dopo il forum di ubuntu, linuxqualityhelp e il tuo blog, ti trovo anche qui, Guiodic! Pare che abbiamo tante cose in comune. Subito aggiunto in Liferea! Buon lavoro! Giancarlo 2 aprile 2012 alle 16:50 Rispondi Ottima questa idea di proporre un sito che sviluppi la teoria keynesiana. Abbiamo bisogno di keynesismo, oggi più che mai. Buon lavoro gio 10 aprile 2012 alle 18:27 Rispondi Da tempo mi domandavo come mai nessun pensiero keynesiano venisse espresso in modo palese in questo contesto critico della economia. E’ vero, non mi ero data molto da fare a cercare, ma mi meravigliava l’assenza completa di riferimenti nei media e nei commenti generalmente diffusi. Mi dicevo, Keynes, come Marx, non è più neanche citato. Mi chiedevo, se fosse ancora tra noi Federico Caffé che direbbe? Bene, finalmente trovo qualcosa. Ma dovete darvi molto molto più da fare. Siamo proprio inguaiati …. Buon lavoro !!! Federico Guglielmo 11 aprile 2012 alle 10:09 Rispondi E’ probabile che l’orientamento keynesiano (vero, non finto) sia l’unica piattaforma intellettuale e pratica per riaggregare un soggetto politico progressista, oggi miseramente frammentato e debole. Peraltro, anche molte sensibilita’ “centriste” e alquanto confuse potrebbero trovarlo convincente. E non solo in Italia. Buon lavoro! Paolo 11 aprile 2012 alle 19:21 Rispondi Bravi!!! Diffondete il verbo Gian Luca Menti 15 aprile 2012 alle 07:10 Rispondi Meno male che c’è ancora qualcge cervello funzionante nell’epoca del preteso ‘tecnicismo’ scientifico delle scelte economiche (che, infatti, oggi risultano folli) Gingolph 18 aprile 2012 alle 14:38 Rispondi Grazie. Era dai tempi della mia tesi che non sentivo così forte il bisogno di confrontarmi con le teorie dell’economista di Cambridge. Marco 27 aprile 2012 alle 20:15 Rispondi Non sono di sinistra e non so se le ricette keynesiane funzionerebbero col nostro livello di indebitamento, ma mi fa solo piacere trovare un po’ di aria fresca nel pensiero economico e un’alternativa ai soliti beceri e rancorosi liberisti incattiviti che pare godano solo quando vedono licenziare il prossimo Claudio's 5 Maggio 2012 alle 19:55 Rispondi MI fà piacere che ci sia, come dice Marco, un pò di aria fresca nel mondo dell’economia asfissiato da poltiche dell’impossibile!!! luca russi 19 Maggio 2012 alle 02:05 Rispondi Io l’ economia la mastico pochissimo, ma le contraddizioni tra quello che ci dicono e quello che succede sotto i nostri occhi ora cominciano a vederle tutti…Occorrono strumenti e nozioni per decifrare gli eventi e risvegliare le coscienze. L’ articolo di oggi (17/05) su Monti e l’ FMI è perfetto, dovrebbero leggerlo in qualche Facoltà di Economia…A quando i nostri Think Tanks? luca rugi 26 Maggio 2012 alle 23:57 Rispondi Seguiri è una boccata d’aria fresca e pulita dato il fetido ambiente in cui siamo costretti a vivere Come creare un blog che parla di economia e ottenere un sacco di visite? | Oralibera(le) 9 giugno 2012 alle 12:13 Rispondi […] il sito Keynesblog non è mio ma di Guido Iodice e Daniela Palma, quindi tutte gli usi del “noi” sono da intendere […] sergio d'alessio 24 luglio 2012 alle 19:15 Rispondi Che cosa ne pensate di Richard Kahn? Aldo 8 agosto 2012 alle 18:35 Rispondi Ho scoperto da poco questo sito web, ne sono felicissimo, si sta tenendo nascosto il pensiero keynesiano da questa assurda crisi senza sbocchi, voluta dalla grande finanza mondiale, per “cinesizzare”, l’economia mondiale post-globalizzazione, anche in italia se non apriremo gli occhi lavoremo alle condizioni “Foxcon”, cioè ad 0,50 ora,per 10 ore giornaliere per sei giorni, azzerando totalmente i diritti, la strada che sta percorrendo l’attuale governo, a quel punto chi ha delocalizzato tornerà a casa, contento di aver raggiunto i risultati sperati, questi! Paolo Delfini 29 agosto 2012 alle 00:10 Rispondi HO SCOPERTO RECENTEMENTIE QUESTO SITO, IN UN MONDO MONOPOLIZZATO DAL PENSIERO UNICO LIBERISTA, SIETE UNA DELLE RARE ECCEZIONI. CONGRATULAZIONI E CONTINUATE COSI ! attilio coletti 31 agosto 2012 alle 13:13 Rispondi Temo il Verbo, anche se dal 31 al 38, con perfette intuizioni, quando tutti perdevano, Keynes triplicò il capitale.E’ tuttavia imprescindibile oggi riavvisare il concetto di crescita dalla premessa inesorabile del limite planetario. Oggi? Difficilissimo o forse impossibile. Quasi utopia! Ferruccio Violi 31 agosto 2012 alle 23:58 Rispondi Molto Interessante, Le Politiche dinamiche di sviluppo esercitano pressione sul sistema e sulla Fiducia che ad esso danno. LA BCE ha dato in accordo ai Politici Protettori 3000 Miliardi alle Banche , le Banche nulla al Sistema, niente ai Cittadini, niente alle Imprese. Il sistema Italia è avvitato su se stesso, se non si Cambia la COSTITUZIONE subito, non si esce dall’avvitamento e nulla si potra’ fare Realmente per Noi per i Giovani e per le Future Generazioni. Soldi Subito a Imprese , Cittadini, Artigiani,Casalinghe, loro si sviluppano da soli e mettono in moto il sistema, allora solo allora si potra’ pagare le tasse di un sistema corrotto, ipocrita,senza idee come l’Italia Politica. Azzerare subito i debiti di imprese, e cittadini , la BCE puo’ dare Soldi stampandoli ai sistemi, i Sistemi si devono regolamentare certo, l’Italia deve tagliare sprechi e spese pubbliche , e deve investire moltissimo in Brevetti, Ricerca, Innovazione, e nelle vecchie Professioni, fare il Pane , Olio, Vino, quello Vero non quello Chimico che si fa ora. Gli sprechi che ci sono ancora fanno paura, avete letto il Meccanismo di Stabilita’, il Fiscal Compact , si vede che è stato scritto da Finanzieri, in Italia lo hanno ratificato senza sapere nemmeno che cosa è. E cosi’ decide la Finanza , non i cittadini, non i Popoli, non il lavoro, la ns. Sovranita’ non esiste piu’. La ns. Dignita’ di vivere in serenita’ è finita. Saluti Ferruccio Keynes contro….. Keynesblog! | Oralibera(le) 4 settembre 2012 alle 20:29 Rispondi […] economista del secolo scorso, ricorre con insistenza in tutte le pagine. Gli autori del blog, Guido Iodice e Daniela Palma, oltre alla quotidiana (o quasi) offerta di articoli, hanno messo a disposizione un documento pdf […] Keynesiano di Destra 7 settembre 2012 alle 12:24 Rispondi Ma guardate che Keynes non era di sinistra. Anzi, nel suo libro Teoria Generale, egli si pone su posizioni nettamente contrarie a Marx e al socialismo in genere; specificando che il capitalismo della sua epoca era paragonabile a una pianta malata: la pianta non va ammazzata ma semplicemente curata. Io non sono mai stato di sinistra (che poi sempre tutte queste etichette all’italiana…) ma condivido la maggior parte delle idee di Keynes e di questo blog. Purtroppo però ho l’impressione che si esageri dando per intero la colpa al liberismo della crisi attuale. Io penso invece che la causa sia stata un’estremizzazione del liberismo, quasi una sorta di fondamentalismo dello stesso che ha lasciato la finanza (e non il mercato, son due cose distinte…del mercato fanno anche parte le botteghe e le piccole-medie imprese che chiudono a ripetizione, loro sono le vittime non i carnefici!) libera di fare quel che vuole e di violare ogni forma di regola per tenerla sotto controllo, spartendosi i profitti con la politica degli Stati e scaricando sui cittadini e sulle imprese le sue perdite e le crisi da essa provocate. Penso che si debba tornare alle idee di Keynes per rilanciare la crescita e progettare un futuro migliore per tutti, ossia un liberismo “moderato” e attento alla lotta contro la disoccupazione prima di tutto. Ezio 4 marzo 2014 alle 12:47 Rispondi Sono pienamente d’accordo, buon lavoro a tutti. Intermediari Finanziari 5 ottobre 2012 alle 14:07 Rispondi Reblogged this on Intermediari Finanziari. antonimo 12 ottobre 2012 alle 13:40 Rispondi Quello che fate merita il plauso. Bisogna ritornare alla ragione e contrastare la folle deriva che richia di travolgerci tutti. Valerio Rosso 1 novembre 2012 alle 01:09 Rispondi Complimenti, da oggi vi seguirò… Paolo 8_Mano 14 novembre 2012 alle 15:33 Rispondi Ciao ragazzi (sono più giovane di voi, posso chiamarvi ragazzi comunque?). Mi piace molto il vostro blog, è bello poter leggere di economia e capire davvero qualcosa, pur da profano. Tutti abbiamo a che fare coi soldi, alla fine! carlo 16 novembre 2012 alle 20:27 Rispondi alla fine degli anni ’70 studiando economia e scienza delle finanze divenni un Ultras keynesiano…. lorenzo 28 novembre 2012 alle 23:10 Rispondi Rimettiamo Keynes al centro del dibattito sul futuro dell’economia in Europa R Francesco 3 dicembre 2012 alle 22:40 Rispondi Un raggio di sole in un ambiente pervaso da Europeisti incalliti e soggetti molto miopi per loro voler e non . E’ un piacere trovare un blog come questo, ho letto il pdf riassuntivo e non posso ritrovarmi d’accordo. Penso sarò , senza nessun dubbio, un vostro assiduo lettore, essendo fresco laureato in economia ed ancora interessato a tematiche a me vicine per attualità e concetti. andrea 9 dicembre 2012 alle 12:56 Rispondi Un’esigenza essenziale oggi è quella di fermare la deriva dell’Unione europea, non per rinnegare la cooperazione fra gli Stati, ma per rinnovarla. L’attuale involuzione dell’UE ci sta portando ad una tirannide centralista anziché all’Europa dei popoli e ad un sistema politico federale. Prendo ad esempio le parole di un altro deludente personaggio, Mario Draghi. Egli auspica la creazione di un “commissario europeo” (naturalmente non eletto ma cooptato) che abbia il "
