title = "Lo spread a zero per rendere l’euro irrevocabile | Keynes blog"
description = "In un articolo sul Foglio, il prof. Sandro Brusco del gruppo Noise from Amerika critica la proposta dell'economista Marcello Minenna della Consob per portare a zero gli spread tra i tassi di interesse dell'eurozona. Secondo Brusco gli spread rifletterebbero il rischio relativo tra i diversi paesi e quindi sarebbero necessari e salutari. L'errore di Brusco…"
full_description = "4 commenti Lo spread a zero per rendere l’euro irrevocabile Pubblicato da keynesblog il 4 dicembre 2017 in consigliati, Economia, Europa, Teoria economica In un articolo sul Foglio, il prof. Sandro Brusco del gruppo Noise from Amerika critica la proposta dell’economista Marcello Minenna della Consob per portare a zero gli spread tra i tassi di interesse dell’eurozona. Secondo Brusco gli spread rifletterebbero il rischio relativo tra i diversi paesi e quindi sarebbero necessari e salutari. L’errore di Brusco è non considerare la particolare struttura istituzionale incompleta dell’euro, in cui esiste una moneta unica, una banca centrale unica, ma non un Tesoro e un debito pubblico unici. Poiché i titoli di stato sono i principali collaterali di una moneta ma, a parte piccole emissioni dell’ESM e di altre agenzie, non esistono titoli pubblici dell’eurozona, la BCE, al fine di preservare l’euro, dovrebbe rendere equivalenti i titoli di stato dei diversi paesi. Nel 2016 il comitato scientifico del think tank Progressive Economy, formato da economisti di rilievo come Fitoussi, Stiglitz, Bofinger e Mazzucato, ha premiato un paper di T.Fazi e G.Iodice in cui è contenuta la proposta che la BCE assuma come obiettivo di uno spread minimo (vicino allo zero) al fine di preservare l’euro. Ne riportiamo alcuni stralci. Il ruolo della BCE: la necessità di un nuovo “Whatever It Takes” Come è noto, a seguito della crisi del debito sovrano greco nel 2010, i differenziali dei tassi di interesse tra la Germania e i paesi della periferia dell’euro (i cosiddetti “spread”) hanno iniziato a crescere drammaticamente. Il fenomeno della crescita degli spread, in realtà, si era già manifestato con minore intensità già all’indomani della crisi del 2008, ma è solo due anni più tardi che tale differenziale è divenuto una seria minaccia per la sopravvivenza dell’euro. Con la crisi dei debiti sovrani, l’ingente deflusso di capitali verso lidi considerati sicuri ha causato vendite massicce dei titoli di debito sovrano non solo di quei paesi che avevano subito crisi bancarie molto serie e hanno quindi dovuto salvare i solo sistemi bancari (in particolare Irlanda e Spagna), ma anche per un paese come l’Italia, le cui banche non sono state investite da fallimenti a catena. […] A questo punto, occorre chiedersi perché l’euro non è crollato. Marc Lavoie (in ‘The Eurozone: Similitudes and differences with Keynes’s Plan”) spiega l’eccezionale resilienza della moneta unica con il fatto che in una unione monetaria come l’euro nessun paese si troverà mai a corto di riserve, come accadrebbe in un normale sistema di cambi fissi, a causa del funzionamento del sistema Target 2: There is no limit to the debit position that a national central bank can incur on the books of the ECB; that is, its liabilities with respect to the rest of the Eurosystem are not limited. They can be carried indefinitely. There is no time prescribed for the settlement of the TARGET2 balances. Additionally, national central banks in debit are charged the main official rate, which is also the rate gained by those with claims on the Eurosystem. Thus these imbalances could go on forever. In altri termini, il sistema Target 2 della ECB ha creato un ammortizzatore automatico che ha evitato l’esplosione dell’eurozona. Tuttavia il sistema Target 2 non avrebbe potuto contrastare l’aumento dei tassi di interesse che tra il 2011 e il 2012 ha messo a rischio la tenuta dell’eurozona. La divaricazione dei tassi di interesse ha trovato una potente contromisura a partire dalla metà del 2012, con l’annuncio della BCE del programma Outright monetary transactions (OMT), preceduto dal celeberrimo discorso del 26 luglio 2012 a Londra del presidente della BCE Mario Draghi in cui egli ha affermato: Within our mandate, the ECB is ready to do whatever it takes to preserve the euro. And believe me, it will be enough. A partire dall’annucio dell’OMT (che, occorre ricordare, non è stato mai applicato) i differenziali dei tassi di interesse tra i paesi membri sono tornati sotto controllo, sia pure lentamente, sotto la spinta della promessa della ECB di garantire finanziamenti illimitati, sia pure sotto condizione, in caso di emergenza, fungendo da quasi lender of last resort per gli Stati. Il successivo Quantitative Easing ha addirittura contribuito a portare, nel corso del 2015-2016, in terreno negativo i tassi a breve termine persino in alcuni dei paesi più colpiti dalla crisi dei debiti sovrani, che avevano visto crescere i tassi a breve fino a superare i pur alti tassi a lungo termine, segno che i mercati assumevano una uscita imminente di tali paesi dall’eurozona. Ciò è dovuto al fatto che i mercati hanno assunto che i paesi i cui titoli di debito sono oggetto degli acquisti della ECB nell’ambito del Quantitative Easing hanno pressoché cessato di essere a rischio ridenominazione. Due anni dopo il discorso di Londra, Draghi ha rafforzato l’impegno della ECB in un discorso tenuto all’Univesity of Helsinky: … if there are parts of the euro area that are worse off inside the Union, doubts may grow about whether they might ultimately have to leave. And if one country can potentially leave the monetary union, then this creates a replicable precedent for all countries. This in turn would undermine the fungibility of money, as bank deposits and other financial contracts in any country would bear a redenomination risk. This is not theory: we all have seen first-hand, and at considerable costs in terms of welfare and employment, how fears about euro exit and redenomination have fragmented our economies. So it should be clear that the success of monetary union anywhere depends on its success everywhere. The euro is – and has to be – irrevocable in all its member states, not just because the Treaties say so, but because without this there cannot be a truly single money. In altre parole, l’integrità finanziaria dell’unione monetaria è basata sull’equivalenza dei depositi nelle banche dei diversi paesi membri. Se il pubblico ritiene che gli euro depositati in una banca greca non sono uguali agli euro depositati in una banca tedesca, allora l’unione monetaria non esiste più agli occhi del pubblico. C’è un’eccezione significativa alla ritrovata calma sui debiti sovrani: la Grecia. Esclusa dal QE e oggetto di un programma di salvataggio che non sembra funzionare, essa viene ancora considerata dai mercati a rischio di uscita dall’euro. Ciò depone a favore dell’impressione che l’OMT e il Quantitative Easing, in quanto misure di emergenza, potrebbero non essere sufficienti a garantire la permanenza di tutti i membri nell’area euro in caso di nuovi shock. Serve quindi uno strumento permanente che rassicuri i mercati circa la “fungibilità della moneta”. I titoli di stato hanno un ruolo cruciale nell’unione monetaria (e in qualsiasi area monetaria): rappresentano la “materia prima” attraverso la quale la Banca Centrale Europea crea moneta e, contemporaneamente, rappresentato l’asset più sicuro su cui le banche possono fare conto, a parte le riserve. Al fine di assicurare la stabilità del sistema finanziario è quindi necessaria una forma di garanzia dei debiti sovrani da parte della BCE. Questa forma di garanzia è inoltre cruciale in una unione monetaria decentralizzata immaginata in questo articolo poiché gli Stati devono essere sottratti dal giudizio dei mercati circa la loro solvibilità o la loro permanenza nell’Unione Monetaria. D’altra parte garantire i debiti sovrani significa, in ultima analisi, garantire l’irrevocabilità dell’euro stesso. In termini pratici la BCE dovrebbe impegnarsi a fare “qualsiasi cosa necessaria” per mantenere gli spread al di sotto, diciamo, di 30 punti base. Questo assicurerebbe che gli stati possano finanziarsi a costo ragionevole anche dopo il tapering del QE. L’effetto “fiscale” non sarebbe differente da quello dello stesso QE e perciò non susciterebbe preoccupazioni circa il finanziamento monetario degli Stati da parte della BCE. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b21f8d70a9e', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b21f8d70b30', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: euro, eurozona, lavoie, Noise from Ameika Permalink Navigazione articolo ← L’euro è una cosa troppo seria per lasciarla in mano ai soliti europeisti (e ai noeuro) L’appello: superare il Fiscal compact per un nuovo sviluppo europeo → 4 commenti su “Lo spread a zero per rendere l’euro irrevocabile” nemobis 4 dicembre 2017 alle 17:41 Un “whatever” forse no, ma qualche misura di convergenza non è politicamente impossibile. Le banche tedesche si lamentano che è difficile fare profitti con tassi cosí bassi: le si può accontentare stabilendo che gli acquisti non debbano essere proporzionali al peso di ciascun paese. Se la BCE vende 450 G€ di bund per spostarli su titoli a tasso piú alto, ci sarà certo un riavvicinamento pur senza cambiare i totali. https://www.ecb.europa.eu/mopo/implement/omt/html/index.en.html Si potrebbe anche produrre qualche profitto aggiuntivo da redistribuire ai tedeschi per soffocare la retorica dei trasferimenti dai paesi ricchi. Vediamo se la SPD porta il governo tedesco ad appoggiare il ministro delle finanze europeo di Macron… https://uk.reuters.com/article/uk-germany-politics-csu/german-spd-to-start-talks-with-merkel-next-week-if-members-agree-idUKKBN1DY0N7 vincesko 4 dicembre 2017 alle 20:26 Dovrebbe essere superfluo rammentarlo, ma in effetti non lo è affatto: osservo che tra i compiti strategici dell’Unione Europea (che ha messo insieme economie eterogenee), e quindi della BCE che ne fa parte integrante (cfr. in particolare l’art. 2-Obiettivi, statuto BCE,[1] che cita l’art. 3 del TUE[2), ci sono la convergenza economica e dei tassi d’interesse dei Paesi membri. Il problema duplice è che, com’è noto, “strategico” ha un significato relativo e, nell’attuale UE a trazione tedesca, anche “politico”. [1] “Conformemente agli articoli 127, paragrafo 1 e 282, paragrafo 2, del trattato sul funzionamento dell’Unione europea, l’obiettivo principale del SEBC è il mantenimento della stabilità dei prezzi. Fatto salvo l’obiettivo della stabilità dei prezzi, esso sostiene le politiche economiche generali dell’Unione al fine di contribuire alla realizzazione degli obiettivi dell’Unione definiti nell’articolo 3 del trattato sull’Unione europea”. Fai clic per accedere a c_32620121026it._protocol_4pdf.pdf [2] “Art. 3. […] Si adopera per lo sviluppo sostenibile dell’Europa, basato su una crescita economica equilibrata e sulla stabilità dei prezzi, su un’economia sociale di mercato fortemente competitiva, che mira alla piena occupazione e al progresso sociale. […] Essa promuove la coesione economica, sociale e territoriale, e la solidarietà tra gli Stati membri”. Michele Castignani 14 dicembre 2017 alle 23:52 Ciò nonostante, il mantenimento artificioso di tassi troppo bassi e per lungo tempo credo spingerebbe le Banche ad assumere rischi eccessivi e le imprese a indebitarsi oltre misura. Non credete? Andrea Mecchia 16 dicembre 2017 alle 21:20 I difetti dell’euro sono due. Innanzitutto non è una moneta sovrana per gli stati che la adottano e in secondo luogo, essendo un accordo di cambi fissi, avvantaggi alcuni paesi e ne penalizza altri. Questi due problemi non sono solo economici ma sociologici perché hanno a che fare con la carenza di democrazia nei paesi e tra paesi. Per questi motivi eventuali azioni tese a smussare effetti a valle, non cancellano i due peccati originali a monte. I commenti sono chiusi."
