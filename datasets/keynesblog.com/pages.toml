full_description = "moneta endogena Le banche creano moneta “dal nulla”? L’ex vicepresidente della BCE spiega cosa significa Di keynesblog 18 dicembre 2019 2 commenti Cogliendo l’occasione di un articolo comparso su VoxEU, Vitor Constâncio, ex vicepresidente della BCE con Mario Draghi, spiega su Twitter in che senso è corretto sostenere che le banche commerciali creano moneta “dal nulla” e cosa questo significhi. Non è vero, come molti pensano, che le banche prestano i soldi depositati dai clienti. E non […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1b0ebb34', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); La BCE spiega cos’è la moneta Di keynesblog 21 ottobre 2016 3 commenti Nella nostra serie sulla teoria della moneta endogena abbiamo già mostrato che le banche centrali sanno molto bene che la quantità di moneta non è sotto il loro diretto controllo. La Bank of England ha voluto esplicitarlo in modo inequivocabile, ma anche la BCE, sul suo sito ufficiale, nello spiegare la natura della moneta usa […] Augusto Graziani, l’uomo che ha davvero capito la moneta Di keynesblog 24 settembre 2015 17 commenti di Steve Keen Cos’è la moneta e come viene creata? Queste dovrebbero essere due delle domande più semplici a cui rispondere in economia; dopo tutto, la moneta è l’unica cosa che tutti noi usiamo in un’economia; ma davvero sappiamo di cosa si tratta, e da dove viene? Gli economisti che non capivano troppo della moneta Di keynesblog 25 marzo 2014 10 commenti Il recente paper della Banca d’Inghilterra sui meccanismi della creazione monetaria continua a suscitare un acceso dibattito. A essere preso di mira è in particolare il moltiplicatore monetario. La Banca d’Inghilterra: “Tutto quello che sapete sulla moneta è sbagliato” Di keynesblog 20 marzo 2014 35 commenti Un recente e dettagliato articolo pubblicato dalla Banca d’Inghilterra nell’ultimo Quarterly Bullettin ha suscitato un certo clamore in rete e sui media britannici. Il paper può essere riassunto in questo modo: “Tutto quello che avete imparato sulla moneta dai libri di testo di economia è sbagliato”. Inflazione e Moneta endogena: il PDF Di keynesblog 21 Maggio 2013 20 commenti Per agevolare la lettura, abbiamo realizzato un PDF con la serie di articoli su inflazione e moneta endogena. Si può scaricare cliccando qui. Buona lettura! Inflazione e moneta (6). Bibliografia Di keynesblog 23 aprile 2013 3 commenti Nei prossimi giorni raccoglieremo la serie di articoli sulla Teoria della Moneta Endogena in un unico PDF da scaricare. Nel frattempo pubblichiamo una web/bibliografia. Le precedenti puntate sono qui di seguito linkate: La Teoria Quantitativa della Moneta A cosa è dovuta l’inflazione? Domanda e offerta di moneta La Teoria della Moneta Endogena Le Banche Centrali e la Teoria della […] Inflazione e moneta. (5) Le Banche Centrali e la Teoria della Moneta Endogena Di keynesblog 26 marzo 2013 21 commenti Cosa pensano della moneta endogena gli economisti monetari non eterodossi e le banche centrali? Proponiamo alcuni pareri di noti accademici e banchieri centrali da cui si evince che quella che una volta era considerata una tesi eterodossa è in realtà condivisa da molti studiosi e ancor più tra coloro che lavorano sul campo. Inflazione e moneta. (4) La Teoria della Moneta Endogena Di keynesblog 25 marzo 2013 32 commenti Dopo aver mostrato che la quantità di moneta è legata alla domanda di prestiti, siamo ora pronti ad esporre la Teoria della Moneta Endogena, secondo la quale i prestiti creano i depositi e i depositi creano le riserve in moneta legale. Inflazione e moneta. (3) Domanda e offerta di moneta Di keynesblog 21 marzo 2013 11 commenti Siamo arrivati al terzo appuntamento della serie “Inflazione e moneta endogena”. In questo articolo esamineremo come il credito bancario possa essere individuato quale causa della crescita delle masse monetarie. Navigazione articolo ← Articoli più vecchi"
