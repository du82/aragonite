["https://keynesblog.com/2015/03/10/europa-cancellazione-debito-germania-grecia"]
title = "Ecco come l’Europa cancellò il debito della Germania | Keynes blog"
description = "Gli accordi sul debito di Londra (1953) dimostrano che i governi europei sanno come risolvere una crisi da debito coniugando giustizia e ripresa economica. Ecco quattro lezioni esemplari, utili nell’attuale crisi del debito greco. Il 27 febbraio 1953 fu siglato a Londra un accordo che cancellava la metà del debito della Germania (all’epoca la Germania…"
full_description = "58 commenti Ecco come l’Europa cancellò il debito della Germania Pubblicato da keynesblog il 10 marzo 2015 in Economia, Europa, Storia Gli accordi sul debito di Londra (1953) dimostrano che i governi europei sanno come risolvere una crisi da debito coniugando giustizia e ripresa economica. Ecco quattro lezioni esemplari, utili nell’attuale crisi del debito greco. Il 27 febbraio 1953 fu siglato a Londra un accordo che cancellava la metà del debito della Germania (all’epoca la Germania Ovest). 15 miliardi su un totale di 30 miliardi di Deutschmarks*. Fra i paesi che accordarono la cancellazione c’erano gli Stati Uniti, l’Inghilterra e la Francia, assieme a Grecia, Spagna e Pakistan (paesi che sono oggi fra i più importanti debitori). L’accordo copriva anche il debito di privati e società. Dopo il 1953, altri paesi firmarono l’accordo per cancellare il debito tedesco: l’Egitto, l’Argentina, il Congo Belga (oggi Repubblica Democratica del Congo), la Cambogia, il Cameroun, la Nuova Guinea, la Federazione di Rodesia e il Nyasaland (oggi Malawi, Zambia e Zimbabwe). (1) Il debito Tedesco risaliva a due periodi storici: gli anni precedenti la prima guerra mondiale e quelli immediatamente successivi alla seconda. Circa la metà derivava da prestiti che la Germania aveva contratto durante gli anni ’20 e i primi anni ’30 (prima dell’ascesa dei nazisti al potere), e che furono usati per pagare i danni di guerra imposti nel 1919 dal trattato di Versailles. Si trattava del lascito delle colossali riparazioni dei danni di guerra imposte al paese dopo la sconfitta nella prima guerra mondiale. L’altra metà del debito era legata alle spese di ricostruzione dopo il secondo conflitto mondiale. Nel 1952, il debito della Germania detenuto da paesi esteri ammontava al 25% circa del reddito nazionale. Si tratta di un debito relativamente contenuto rispetto alle cifre di oggi: Spagna, Grecia, Irlanda e Portogallo hanno tutte un debito verso creditori esteri superiore all’80% del PIL. La Germania Ovest doveva affrontare enormi spese per la ricostruzione, ma le riserve di valuta estera erano scarse. La delegazione tedesca alla conferenza sostenne con successo la tesi che i rimborsi del debito sarebbero cresciuti vertiginosamente nell’immediato futuro, e che ciò avrebbe gravemente ostacolato la ricostruzione. In seguito all’annullamento del debito, la Germania Ovest visse un ‘miracolo economico’ trainato da una vasta opera di ricostruzione, e forti incrementi del reddito e delle esportazioni. Questa stabilità contribuì alla pace e alla prosperità in Europa. I creditori della Germania Ovest erano ben disposti a stabilizzare il quadro politico ed economico del paese, per rafforzare un ‘bastione contro il comunismo’. Questo sottinteso politico spinse i creditori ad affrontare con un approccio illuminato la questione del debito; approccio purtroppo assente nelle crisi di debito degli ultimi trent’anni – America Latina e Africa (anni ’80 e anni ’90); estremo oriente (metà anni ’90); Russia e l’Argentina (alla soglia del millennio) e oggi l’Europa. In tutte queste crisi, la Germania si è trovata fra i creditori, com’è crudamente emerso nel corso della crisi europea del debito. Oltre all’entità del debito cancellato, molti altri aspetti degli accordi sul debito di Londra furono di sicuro vantaggio per la Germania; i principî che li ispirarono potrebbero essere applicati al caso degli attuali paesi debitori. 1) Imposizione di limiti espliciti al rimborso del debito Innanzitutto fu abilmente richiesto (e ottenuto) che il rimborso del debito della Germania Ovest procedesse solo in caso di eccedenza commerciale. In caso di deficit commerciale, non sarebbe stato effettuato nessun pagamento. In altre parole, il governo avrebbe rimborsato il debito unicamente con risorse effettivamente disponibili, invece di ricorrere a nuovi prestiti o utilizzando riserve di valuta estera. Questo meccanismo evitò una nuova recessione o una lunga stagnazione. Inoltre, nell’ipotesi di una bilancia commerciale in passivo, la Germania Ovest era autorizzata a limitare le importazioni. Se i paesi creditori volevano recuperare i loro prestiti, erano quindi indotti ad importare merci dalla Germania. Il meccanismo che permise di procedere in questo senso fu la rivalutazione contro il marco delle divise dei paesi creditori: con un marco ‘debole’ le merci prodotte in Germania erano più convenienti sui mercati esteri. L’effetto fu una rapida crescita delle esportazioni tedesche, che permise al paese di ripagare il debito residuo. D’altra parte, i paesi creditori riorientarono di fatto le loro politiche economiche interne, spingendo verso maggiori importazioni (e quindi sostenendo i consumi), invece di costringere i debitori ad applicare politiche di austerità. [Quest’ultima è la via scelta dalla Germania attuale, che parallelamente insiste sul mercantilismo e deprime i consumi interni, n.d.t.] Deficit, surplus e debito Se un paese esporta più di quello che importa, ha un eccedenza commerciale (o surplus). Ciò comporta un reddito in eccesso, che non è speso in beni importati. Quest’eccesso servirà a riassorbire debito, oppure si trasformerà in credito verso altri paesi, che a loro volta s’indebiteranno. Se un paese è in deficit commerciale, importa più di quanto esporta. È quindi costretto a contrarre dei debiti con altri paesi, o a mettere in vendita il suo patrimonio. I debiti tra paesi sono insomma causati da (o causano a loro volta) deficit e surplus nelle bilance commerciali. Perché un paese possa essere in surplus, deve esisterne un altro con un deficit. Più le bilance commerciali sono in equilibrio, più stabile è l’economia mondiale. Perché un debito possa essere rimborsato, i paesi debitori devono essere in surplus, e i paesi creditori devono trovarsi in deficit commerciale. È molto difficile per i paesi debitori raggiungere un eccedenza di bilancia commerciale, se i creditori non sono disposti ad accettare disavanzi. Non è teoricamente possibile che tutti i paesi siano in surplus, a meno che il pianeta Terra non si metta a commerciare con un altro pianeta. La bilancia commerciale della Germania Ovest fu ampiamente in attivo durante il periodo di rimborso del debito, e così la clausola limitativa non venne mai applicata. Ma la sua sola esistenza permise di ricostruire l’economia tedesca e sostenere le esportazioni, creando un potente incentivo ad acquistare merci provenienti dalla RFT, e permettendo la svalutazione del marco rispetto alle altre divise. La competitività della Germania e la svalutazione del marco segnarono tutto il periodo del rimborso del debito, e finirono per vincolare gli altri paesi dell’Eurozona con la creazione dell’euro negli anni ’90. Negli anni ’50 e ’60, le eccedenze commerciali della Germania Ovest permisero il rimborso del debito; negli anni più recenti, hanno invece contribuito ad aumentare il debito di altri paesi, come la Grecia, l’Irlanda, la Spagna ed il Portogallo. Grazie alla cancellazione del debito e alla riduzione dei tassi d’interesse, i pagamenti assorbiti dal rimborso costituivano il 2,9% delle esportazioni nel 1958 (il primo anno del risarcimento) e si ridussero con la crescita del surplus. A titolo di confronto, l’FMI e la Banca Mondiale considerano ‘sostenibili’ per i paesi più poveri rimborsi del debito dell’ordine del 15%-25% del valore delle esportazioni. Nel 2015, l’FMI prevede che la Germania avrà un’eccedenza commerciale pari al 5,8% del PIL, quando invece potrebbe importare merci dai paesi creditori, per aiutarli ad uscire dalla crisi. [Il surplus commerciale tedesca ha violato ripetutamente i criteri della Macroeconomic Imbalance Procedures — MIP. Ma per ora le sanzioni non sono state applicate alla Germania, n.d.t.] Inoltre, come prima ricordato, i rimborsi attuali del debito sono molto più elevati (in termini di percentuale rispetto al valore delle esportazioni) di quanto pagato dalla Germania Ovest al ritmo massimo dei pagamenti. Attualmente, i rimborsi del governo greco sono dell’ordine del 30% delle sue esportazioni (2). Situazioni simili si presentano per i paesi più indebitati del sud del mondo: il Pakistan, le Filippine, El Salvador e la Jamaica spendono fra il 10% e il 20% per cento delle loro esportazioni per ripianare i loro debiti esteri (3). Questi valori non comprendono i rimborsi dei debiti privati. 2) Coinvolgimento di tutti i tipi di creditori Tutti i creditori furono coinvolti nel programma di ristrutturazione, sia gli stati, sia i privati, ai quali furono applicati gli stessi criteri. Questo per limitare gli effetti dei contenziosi eventualmente aperti dai privati per disparità di trattamento. Ben diverso è stato l’approccio delle ristrutturazioni del debito più recenti. Il programma di normalizzazione del debito dei paesi poveri (Heavily Indebted Poor Countries initiative, HIPC), che ha cancellato 130 miliardi di dollari di debiti a 35 paesi fra i più poveri del mondo (anni 2000), ha riguardato unicamente i debiti verso istituzioni internazionali o paesi terzi. I soggetti privati non sono stati coinvolti nell’accordo. Di conseguenza, paesi fra i più poveri al mondo, come Sierra Leone, Zambia, Repubblica Democratica del Congo, sono stati citati in giudizio presso tibunali occidentali dai ‘Vulture funds’ (fondi speculativi ‘avvoltoio’), per montanti colossali, che non sono in grado di rimborsare. Alla fine del 2001, l’Argentina si dichiarò insolvente sul proprio debtio, semplicemente perché era troppo elevato da rimborsare. Molti dei creditori privati sottoscrissero un nuovo accordo, che prevedeva uno sconto del 70% sul debito nominale. Alcuni creditori, fra i quali ‘fondi avvoltoio’ che avevano riacquistato parti del debito nel pieno della crisi, e a condizioni molto convenienti, esigono oggi -in sede legale- il rimborso totale del debito all’Argentina, oggi non più insolvente. Nel giugno 2014, la corte suprema USA confermò il giudizio del tribunale di New York in favore di due fondi speculativi (NML Capital e Aurelius Capital) che esigevano 1,3 miliardi di dollari di debiti contratti dall’Argentina durante la crisi del 2001. Il giudizio stabiliva che l’Argentina avrebbe dovuto dapprima rimborsare i debiti verso i due fondi prima di procedere a qualsiasi altro indennizzo. Il rifiuto di ottemperare dell’Argentina comportò un nuovo default sul debito e a uno stallo che dura ancora oggi. In Grecia sono avvenute nel 2011 due ristrutturazioni, che hanno portato ad una riduzione del debito nominale di più del 50% per 9 creditori privati su 10. Malgrado questa ‘riduzione’ il valore del capitale da recuperare restava comunque superiore al prezzo di vendita dei diritti creditorî sul mercato. E i creditori insittetero perché il nuovo debito fosse sottoposto – nella maggior parte dei casi – al diritto britannico. Con limiti evidenti sul controllo futuro del proprio debito da parte del governo greco. Per di più, i creditori che detenevano il ‘vecchio’ debito sotto legislazione non greca (britannica o elvetica) sono rimasti fuori dall’accordo, e sono attualmente in grado di esigere il pagamento completo della somma originaria, più del doppio dei creditori ‘ristrutturati’. Molti di questi debiti sono detenuti da fondi speculativi che hanno comprato il debito a prezzi stracciati, e che stanno quindi speculando, con vasti profitti, a danno del popolo greco. Inoltre, i prestiti accordati alla Grecia per ricoprire il suo debito negli ultimi due anni lo hanno di fatto trasferito da creditori privati verso soggetti istituzionali, l’FMI e i governi dell’UE. Questa parte non ha subito alcuna riduzione, e quindi il debito detenuto da creditori esteri è oggi ben al di là del 100% del PIL. 3) Applicare la ristrutturazione a tutti i debiti, non solo quelli verso i governi. Gli accordi sul debito di Londra furono applicati a tutti i debiti contratti dalla Germania Ovest: verso privati, governi e società estere. Comprendeva quindi i debiti dei privati e delle società tedeschi, oltre al debito pubblico. La maggior parte della crisi del debito odierna è scaturita da debiti inizialmente a carico di società private, soprattutto banche. Per esempio, i prestiti contratti dal settore privato in Irlanda hanno spinto nel 2007 il debito totale del paese al 1000% del PIL. Il governo irlandese, invece, ha potuto approfittare di un avanzo di bilancio in quegli stessi anni, e il suo debito totale (detenuto sia da risparmiatori irlandesi, sia da creditori esteri) era ‘appena’ l’11% del PIL nel 2007. Perché un’economia esca dalla stagnazione causata da debito eccessivo, devono essere ristrutturati tanto il debito detenuto dai privati quanto quello detenuto dai governi. 4) Negoziati piuttosto che sanzioni Se la Germania Ovest non avesse voluto, o non fosse stata in grado di rimborsare il debito, l’accordo prevedeva consultazioni fra il debitore e i creditori, sotto la supervisione di un organismo internazionale terzo. Un approccio del tutto diverso da quello che ha ispirato i ‘negoziati’ più recenti sul debito, nei quali i governi e le istituzioni creditrici (il Club di Parigi, l’FMI, la BCE) hanno imposto i termini dell’accordo ai paesi debitori, obbligandoli a instaurare politiche di austerità e liberalizzazioni sui mercati. Come ci si poteva aspettare, la Germania Ovest non ebbe ulteriori problemi di debito, e anche questa clausola non venne mai applicata. Il caso Grecia: spezzare le catene Ispirandosi all’antica idea del Giubileo, in occasione del quale i debiti erano annullati, gli schiavi erano liberati, e la terra ridistribuita, la Jubilee Debt Campaign lancia un appello per un nuovo ‘Giubileo del debito’ per risolvere l’attuale crisi economica globale. Quest’iniziativa costituirebbe il quadro per rompere l’attuale spirale della crisi debitoria e bancaria in Europa, e alleggerire il fardello perpetuo che grava sui paesi del sud del mondo. In altre parole: – Cancellare i debiti ingiusti dei paesi più indebitati; – Promuovere una tassazione giusta e progressiva, piuttosto che ricorrere a nuovi prestiti; – Uscire dalla logica di nuovi prestiti che spingono i paesi poveri nella voragine del debito La Grecia è indiscutibilmente fra i paesi che più hanno bisogno di una cancellazione del debito. Dopo più di quattro anni di austerità, il debito greco è salito dal 133% al 174% del PIL. Il salario minimo è caduto del 25%, la disoccupazione giovanile è oltre il 50%. E più del 20% della popolazione è sotto la soglia di povertà. È necessario che i creditori di Atene capiscano la lezione dell’accordo sul debito tedesco del 1953, e spezzino le catene del debito che attanagliano oggi la Grecia. Traduzione: Faber Fabbris Fonte: jubileedebt.org.uk ___________ Note * La cancellazione del debito riguardò la Germania Ovest, che aveva ereditato la totalità del debito tedesco verso i paesi occidentali dopo la seconda guerra mondiale. Si trattò quindi dell’annullamento del debito della Germania pre-bellica, anche se le trattative furono fatte con la sola Germania Ov"
