title = "Nobel per l’Economia 2021: il mainstream scopre il salario minimo | Keynes blog"
description = "Alessandro Guerriero e Mattia Marasti da Kritica Economica Quest’anno il Premio Nobel per l’Economia – anche se chiamarlo Nobel è impreciso – è stato assegnato a David Card, Guido Imbens e Joshua Angrist. Mentre gli ultimi due sono stati premiati per ricerche metodologiche che hanno consentito una più sottile distinzione tra correlazione e causazione, David Card è stato premiato per…"
full_description = "Nobel per l’Economia 2021: il mainstream scopre il salario minimo Pubblicato da keynesblog il 28 ottobre 2021 in Economia Alessandro Guerriero e Mattia Marasti da Kritica Economica Quest’anno il Premio Nobel per l’Economia – anche se chiamarlo Nobel è impreciso – è stato assegnato a David Card, Guido Imbens e Joshua Angrist. Mentre gli ultimi due sono stati premiati per ricerche metodologiche che hanno consentito una più sottile distinzione tra correlazione e causazione, David Card è stato premiato per i suoi contributi all’economia del lavoro. Uno dei contributi maggiori di Card alla disciplina è di sicuro il suo lavoro sul salario minimo. Giocando proprio sulle motivazioni del Nobel di quest’anno, forse è una correlazione il fatto che ha ricevuto il Nobel proprio nell’anno in cui il salario minimo è tornato a essere un tema caldo. Ne sono un esempio gli sforzi dell’amministrazione Biden per alzare a 15 dollari orari il salario minimo federale. Nel nostro paese una forma di salario minimo era stata in un primo tempo inserita nella bozza del Pnrr dal governo Conte II, salvo poi essere escluso dal governo Draghi. Per la prima volta, però, il segretario di uno dei sindacati confederali, Maurizio Landini, si è detto favorevole all’introduzione della misura. Il salario minimo per i neoclassici La prima forma di salario minimo venne introdotta dal presidente Franklin Delano Roosevelt negli Stati Uniti d’America intorno alla metà degli anni ’30. Si trattava, già al tempo, di una misura controversa e criticata dagli economisti “tradizionali”. La teoria economica neoclassica fornisce infatti una risposta univoca riguardo agli effetti del salario minimo. In un contesto istituzionale di mercati perfettamente competitivi, un salario minimo sopra la soglia di equilibrio porterebbe a un aumento della disoccupazione. All’epoca la realtà sembrava seguire la teoria, tanto che i risultati del salario minimo di Roosevelt furono fortemente criticati dagli economisti. Uno scetticismo che arriva fino ai giorni nostri: uno dei testi più diffusi al mondo per lo studio dell’economia, scritto dal macroeconomista neokeynesiano Greg Mankiw, afferma infatti che il salario minimo avrebbe effetti negativi soprattutto su coloro che intende proteggere, ossia i lavoratori meno pagati. Con il passare del tempo anche la teoria economica mainstream ha, in parte, ampliato le sue vedute: nel modello di monopsonio il problema di ottimizzazione risolto dall’azienda che domanda lavoro non ha un output efficiente come nell’ipotesi di mercati perfettamente concorrenziali. Che vuol dire? Vuol dire che c’è spazio per l’istituzione di un salario minimo al di sopra del salario di equilibrio. Allo stesso tempo la macroeconomia ha indagato approfonditamente l’effetto dei salari sull’offerta di lavoro – quindi sui lavoratori. La teoria dei salari efficienti poggia appunto sul fatto che, pur considerandoli ancora come un costo, salari elevati producono effetti positivi sull’economia. Il salario minimo per la teoria classica e per Keynes Un’analisi diversa è offerta invece dalla teoria classica (i cui maggiori esponenti sono Smith, Ricardo e Marx). Secondo questo approccio, il salario e l’occupazione non sono determinati simultaneamente e non esiste una relazione inversa tra di essi. Il salario è la conseguenza di diversi fattori storico-sociali: secondo Adam Smith esso è determinato dal livello sussistenza dei lavoratori e dalla loro forza contrattuale rispetto ai capitalisti, oltre che all’influenza delle istituzioni. Secondo la teoria classica, una legge che introduce il salario minimo farebbe aumentare artificialmente il livello del salario. Anzi, se fosse duratura, modificherebbe anche le abitudini di spesa dei lavoratori e di conseguenza il loro livello di sussistenza. Con un salario minimo universale la forza contrattuale dei sindacati aumenterebbe e ci potrebbero essere ulteriori aumenti dei salari nei settori in cui già vige una paga maggiore del minimo. Anche adottando il punto di vista di Keynes un salario minimo potrebbe essere positivo per l’economia, proprio perché eviterebbe una discesa dei salari nominali. Come scrive Keynes nel capitolo 19 della Teoria Generale, una discesa dei salari nominali avrebbe conseguenze molto gravi. Essa porterebbe non ad un aumento dell’occupazione, ma alla deflazione e di conseguenza ad ulteriori aspettative di riduzione dei prezzi. Inoltre, la riduzione dei salari avverrebbe in maniera arbitraria e disuguale, colpendo diversamente varie categorie di lavoratori (soprattutto quelle industrie dove la disoccupazione è più elevata o i sindacati sono meno forti). Le tensioni sociali sarebbero inevitabili, con conseguenze negative anche dal punto di vista macroeconomico. Sia la teoria classica che la teoria keynesiana non determinano l’occupazione nel mercato del lavoro ma nel mercato dei beni. Proprio per questo motivo l’introduzione del salario minimo e il conseguente aumento dei redditi dei lavoratori più poveri comporterebbero maggiori consumi, facendo crescere la domanda aggregata e l’occupazione. Infine, il salario minimo andrebbe a diminuire le disuguaglianze economiche e sociali, poiché ne beneficerebbero i lavoratori meno pagati, tra cui molte persone immigrate in Italia. I cambiamenti del mainstream Come ha fatto notare Daron Acemoglu su Project Syndicate, anche nell’economia mainstream è avvenuto un cambiamento a partire dagli anni ’80. Questo ci riporta, quindi a David Card e al grande assente di questo premio Nobel, Alan Krueger, scomparso prematuramente. Lo studio sul tema che viene considerato una pietra miliare si basa su un metodo al tempo pionieristico: il difference in difference. Una delle limitazioni della scienza economica risiede nell’impossibilità di fare esperimenti, caratteristica fondante invece delle scienze dure come la fisica e la chimica. In qualche modo il difference in difference permette di arginare questa difficoltà, studiando un fenomeno esogeno come un terremoto, un’epidemia o, appunto, l’introduzione di una nuova legge come il salario minimo. Il difference in difference consiste infatti nel paragonare due gruppi, uno di trattamento, uno di controllo. Si prende quindi la media delle osservazioni prima del trattamento e si confronta la differenza. Poi si fa lo stesso per le osservazioni dopo il trattamento. Se la differenza è statisticamente significativa – per semplificare – allora possiamo stabilire un rapporto di causalità. Siamo all’inizio degli anni ’90 e lo Stato del New Jersey ha recentemente approvato un aumento del salario minimo rispetto alla base federale. Al fine di studiare gli effetti di una tale misura Card e Krueger confrontarono il mercato dei fast food del New Jersey con quello della Pennsylvania. Prima dell’aumento del salario minimo i due Stati avevano una simile tendenza dell’occupazione. Questo permetteva di utilizzare la Pennsylvania come gruppo di controllo. Analizzando i dati, Krueger e Card conclusero che il salario minimo non solo non aveva avuto effetti negativi sull’occupazione: l’aveva addirittura aumentata. Conclusioni di politica economica Una rondine, in ogni caso, non fa primavera: a partire da quello studio la letteratura sul salario minimo è andata infoltendosi. Seppur con netti miglioramenti, l’evidenza riguardante gli Stati Uniti d’America mostra un effetto leggermente negativo e statisticamente significativo sull’occupazione. Ma il contesto è tutto. In Germania il salario minimo è stato introdotto nel 2015. Gli effetti sono stati una diminuzione della disuguaglianza nei livelli salariali, un aumento della retribuzione nei primi due decili di salario e nessuna riduzione dell’occupazione. Il nostro Paese rappresenta un caso raro in Europa: solo le socialdemocrazie nordiche e l’Austria, con una contrattazione collettiva più forte della nostra, non sono dotate di un salario minimo per ogni lavoratore e lavoratrice. In un contesto di salari stagnanti, produttività il cui incremento è da trent’anni tra i più bassi d’Europa e disuguaglianze laceranti, il salario minimo potrebbe giocare un ruolo cruciale per il nostro paese. La strategia seguita fino a qui, infatti, ha puntato a rilanciare il paese attraverso le esportazioni (senza effetti miracolosi) o attraverso una crescente flessibilità nel mondo del lavoro, a partire dagli accordi del ‘93, passando per il Pacchetto Treu, le riforme del governo Berlusconi e infine il Jobs act del governo Renzi. Una traiettoria che hanno ormai imboccato vari Stati e che desta la preoccupazione della comunità economica. Seguendo il mantra “qualunque lavoro è meglio di nessun lavoro”, vi è stata una carenza sempre più asfissiante di buoni lavori (good jobs), come li ha definiti Daron Acemoglu. Recentemente anche Autor, in un suo editoriale per il The New York Times, ha sostenuto che c’è una mancanza di buoni posti di lavoro, in grado di coniugare la dignità della persona con la crescita della produttività – che, ci preme ricordarlo, non deriva dalle medicine per il mal di schiena che prendi la sera. Non siamo tanto folli da ritenere il salario minimo un silver bullet per l’economia italiana: il nostro settore industriale a scarso valore aggiunto, formato prevalentemente da piccole e medie imprese che fanno poca innovazione, richiede un’azione urgente e un ritorno a una politica industriale più interventista. Ad esempio, con una nuova IRI, ruolo che potrebbe avere Cassa Depositi e Prestiti, passando da essere semplice riparatore del mercato (market fixer) ad attore dinamico e propenso a prendere rischi (risk taker). Certo è che la carente domanda aggregata che caratterizza il nostro paese, assieme alle condizioni disumane a cui sono sottoposti milioni di lavoratori e lavoratrici, necessita di una seria riflessione sullo strumento del salario minimo. Già oggi alla Camera sono state presentate varie proposte di legge per introdurlo: vi sono ovviamente dei dettagli tecnici, come il livello (8, 9 o 10 euro l’ora?). La letteratura su questo è divisa. Si tratta di una scelta politica, ovviamente riformabile. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f12da8871', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f12da88e7', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: David Card, Mainstream, salario minimo Permalink Navigazione articolo ← Il Nobel all’economista che ha scoperto che il salario minimo non crea disoccupazione L’attualità di Keynes →"
