["https://keynesblog.com/2013/10/14/robert-shiller-le-bolle-finanziarie-sono-come-le-epidemie"]
title = "Robert Shiller: “Le bolle finanziarie sono come le epidemie” | Keynes blog"
description = "Pubblichiamo un recente articolo del neo-premio Nobel Robert Shiller, uno dei maggiori studiosi della finanza comportamentale. Dalla lettura dell'articolo emerge la distanza di analisi tra l'autore ed Eugene Fama, che con lo stesso Shiller e Lars Peter Hansen condivide il Nobel per l'Economia 2013. di Robert J. Shiller Dopo lo scoppio della bolla immobiliare più…"
full_description = "44 commenti Robert Shiller: “Le bolle finanziarie sono come le epidemie” Pubblicato da keynesblog il 14 ottobre 2013 in Economia, Teoria economica Pubblichiamo un recente articolo del neo-premio Nobel Robert Shiller, uno dei maggiori studiosi della finanza comportamentale. Dalla lettura dell’articolo emerge la distanza di analisi tra l’autore ed Eugene Fama, che con lo stesso Shiller e Lars Peter Hansen condivide il Nobel per l’Economia 2013. di Robert J. Shiller Dopo lo scoppio della bolla immobiliare più grande di tutti i tempi, nel 2006, e la fine di una grossa bolla dei mercati l’anno seguente, verrebbe spontaneo pensare che viviamo in un mondo del dopobolla. Eppure non si fa altro che parlare di bolle: bolle immobiliari vecchie e nuove in molti Paesi, una nuova bolla globale dei mercati, una bolla dei mercati obbligazionari a lungo termine negli Usa e in altri Paesi, una dei prezzi del petrolio, una dell’oro, così via. Di certo però non mi aspettavo di sentir parlare di bolle quando sono stato in Colombia, il mese scorso. Invece anche lì si faceva un gran discutere di una bolla immobiliare in pieno svolgimento: mentre mi portava in giro per Cartagena, destinazione turistica sul mar dei Caraibi, l’autista mi indicava con meraviglia case che recentemente erano state vendute per milioni di dollari. Il Banco de la República, l’autorità monetaria del Paese sudamericano, fornisce un indice dei prezzi delle case per tre grandi città (Bogotá, Medellín e Calí): dal 2004 a oggi questo indice è cresciuto del 69 per cento in termini reali (corretti in base all’inflazione) e buona parte di questo incremento si è verificato dopo il 2007. È un ritmo di crescita non dissimile da quello degli Usa tra il 1997 e il 2006, quando l’indice S&P/Case-Shiller, relativo ai prezzi delle case in dieci città, aumentò del 131 per cento in termini reali. Tutto questo spinge a porsi una domanda: cos’è esattamente una bolla speculativa? Il dizionario definisce «bolla», in senso figurato, «qualcosa di fragile, inconsistente, vuoto o senza valore; un’esibizione ingannevole. Dal XVII secolo il termine è spesso applicato a schemi commerciali e finanziari illusori». Il problema è che termini come «esibizione» e «schemi» lasciano intendere una creazione deliberata, più che un fenomeno sociale ampio che avviene senza la regia di nessuno. Forse è la parola «bolla» che è usata con troppa leggerezza. È quello che pensa Eugene Fama. Secondo Fama, principale sostenitore della «teoria del mercato efficiente», le bolle non esistono. In un’intervista rilasciata nel 2010 a John Cassidy del New Yorker diceva: «Non so nemmeno cosa vuol dire una bolla. Sono parole diventate di moda, ma che secondo me non hanno senso». Nella seconda edizione del mio libro Irrational Exuberance, ho cercato di dare una definizione migliore. Una «bolla speculativa», scrivevo, è «una situazione in cui la notizia di un incremento di prezzo stimola l’entusiasmo degli investitori, che si diffonde per contagio psicologico di persona in persona, ingigantendo storie capaci di giustificare l’incremento di prezzo». Tutto questo attira «un ventaglio sempre più ampio di investitori che pur nutrendo dubbi sul valore reale dell’investimento ci si lanciano ugualmente, in parte per invidia del successo di altri e in parte per il brivido dell’azzardo». È questo il significato essenziale della parola «bolla» nella sua accezione più comune. Implicito in questa definizione è il motivo per cui è tanto difficile, per gli investitori più accorti, realizzare profitti puntando contro le bolle: il contagio psicologico favorisce un atteggiamento mentale che giustifica gli incrementi di prezzo, tanto che partecipare alla bolla può quasi essere definito un atto razionale. Ma non è razionale. La storia è diversa in ogni Paese a seconda delle notizie da cui nasce la bolla, che non sempre combaciano con quelle di altri Paesi. Per esempio, la storia da cui è nata la bolla colombiana è che il Governo, sotto le attente cure dello stimato presidente Juan Manuel Santos, ha portato l’inflazione e i tassi di interesse a livelli da Paese sviluppato e ha quasi eliminato la minaccia della guerriglia delle Farc, iniettando nuova vitalità nell’economia. È una storia sufficiente a produrre una bolla immobiliare. Essendo sostanzialmente fenomeni sociopsicologici, le bolle sono, per loro natura, difficili da controllare. Le misure di regolamentazione prese dopo la crisi finanziaria potrebbero limitare il rischio in futuro, ma il timore di bolle potrebbe ingigantire il contagio psicologico, producendo ancor più profezie che si realizzano da sole. Un problema della parola «bolla» è che crea l’immagine di una bolla di sapone che si allarga sempre più ed è destinata a scoppiare, improvvisamente e irrevocabilmente. Ma in realtà le bolle speculative sono più complicate: a volte si sgonfiano perché cambia la storia che le ha originate, e poi tornano a gonfiarsi. Sembra più accurato paragonare questi fenomeni alle epidemie. Il caso dell’influenza ci insegna che può apparire all’improvviso una nuova epidemia proprio mentre un’epidemia precedente sta regredendo, se compare una nuova forma del virus o se qualche fattore ambientale accresce il tasso di contagio. Lo stesso succede con le bolle speculative: se emerge una nuova storia sull’economia e se questa nuova storia ha una forza narrativa sufficiente a scatenare un nuovo contagio nella mentalità degli investitori, allora entra in scena una nuova bolla speculativa. È quello che successe con il boom del mercato negli Stati Uniti degli anni Venti, che toccò l’apice nel 1929. Concepire le bolle come un periodo di crescita spettacolare dei prezzi seguito da un repentino punto di svolta e poi da uno schianto definitivo e di vaste proporzioni significa distorcere questi precedenti storici: in realtà, dopo il “martedì nero”, ci fu un grosso boom dei prezzi reali delle azioni negli Stati Uniti che nel 1930 li riportò in parte indietro ai livelli del 1929; seguì un secondo crac, un altro boom dal 1932 al 1937 e poi un terzo crac. Le bolle speculative non terminano come un racconto, un romanzo o un’opera teatrale. Non c’è uno scioglimento finale che riconduce tutti i fili di una narrazione verso una conclusione a effetto. Nel mondo reale, non sappiamo mai quando una storia è finita. Fonte: Il Sole 24 Ore __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3be2c0c61d', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3be2c0c673', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: bolla immobiliare, Eugene Fama, Irrational Exuberance, Lars Peter Hansen, Nobel 2013, Robert J Shiller Permalink Navigazione articolo ← I conti truccati di Saccomanni Le mille bolle dei mercati finanziari → 44 commenti su “Robert Shiller: “Le bolle finanziarie sono come le epidemie”” alessiogr 14 ottobre 2013 alle 15:45 L’ha ribloggato su flaneurkh. Pacman 14 ottobre 2013 alle 17:54 Ovviamente, questo professore mainstream ignora completamente il ruolo della banca centrale nel determinare il tasso di interesse, cioè il prezzo del denaro, e di conseguenza ignora quanto la presenza di un pianificatore centrale distorca il libero mercato inviando segnali che non permettono il calcolo economico, non permettono di stabilire il prezzo di mercato delle merci e non permettono la corretta allocazione delle risorse scarse. Così le bolle si gonfiano per motivi psicologici… Ed esplodono per motivi climatologici? Bernanke da Princeton crede che se uno stimolo non è stato sufficiente ce ne voglia di più. Lo crede anche Krugman. Si stampa sempre troppo poco! Niente paura! Ci penserà la Yellen a stampare ancora di più. QE all’infinito. Anche perché, ormai è chiaro a tutti, se si smettesse di stampare verrebbe giù tutto all’istante. Perché tutto ormai si regge solo su quei coriandoli creati dal nulla che sono diventati i dollari fiatmoney. E che vanno a finire sempre e soltanto nelle solite tasche di WallStreet alla faccia di MainStreet. END THE FED! walter 14 ottobre 2013 alle 19:30 Ovviamente nessuno nega che nelle bolle ci sia una forte componente psicologica per cui gli investitori scommettono non in base ai fondamentali ma perchè pensano che il prezzo dell’assets si alzerà domani come si è innalzato ieri. Considerazioni di questo genere però hanno una valenza quasi zero dal punto di vista prescrittivo. Il fatto che Schiller non accenni minimamente al ruolo della banca centrale nel manipolare i tassi ufficiali a convenienza è la controprova dell’aridità e inutilità di interventi di questo genere. E del fatto che chi non ha una teoria della moneta e del capitale ha poco da dire riguardo l’ analisi delle bolle finanziarie e dei cicli economici. Ok, gli investitori sono polli e giocano d’azzardo. E allora che si fa? Ma ovviamente si concede alla banca centrale il diritto di stampare fiat money a corso legale per salvare i giocatori d’azzardo dalla bancarotta. Avanti così! Un altro Nobel deludente. Fla 15 ottobre 2013 alle 16:42 Benissimo. Aboliamo la FED (e tutte le banche centrali). Pongo a questo punto un quesito. Come si regolano quindi i pagamenti fra le varie banche commerciali/d’investimento? keynesblog 15 ottobre 2013 alle 17:27 Immagino la risposta sia “in oro”. f. spirito 16 ottobre 2013 alle 03:24 @fla: dove sarebbe il problema? finchè non sei illiquido non c’è bisogno di nessuno per regolare niente. poi se ti trovi illiquido basta una certa garanzia statale per un tempo x. oltre quel tempo, sei insolvente e fallisci. fine. poi, chiaramente potrebbero esserci delle clearing house private che, soggette agli stessi limiti di sopra, provano a stare nel mercato. Fla 16 ottobre 2013 alle 14:49 @ Keyneblog: vero, ha ragione!! Infatti l’oro sulla terra, per loro, è disponibile in quantità illimitate. Per tutti. Gli è sconosciuto il fatto del perchè ci fu il Nixon shock. @ f. spirito: non sto parlando di situazioni estreme, ma del giornaliero. La FED nasce nel 1913 dopo la grave crisi speculativa del 1907 proprio perchè le clearing house private rifiutarono al tempo di prestarsi i soldi l’una con l’altra durante la corsa agli sportelli scatenata dal panico. Sono le banche stesse ad accettare solo ed esclusivamente moneta di Banca Centrale (High powered money, base monetaria, moneta ad alto potenziale, chiamiamola come vogliamo) e non moneta bancaria. Ad esempio, come dichiara la stessa FED http://www.federalreserve.gov/pf/pdf/pf_7.pdf : “Creando il sistema della Federal Reserve, il Congresso intendeva porre fine alle gravi crisi finanziarie che periodicamente sconvolgevano la nazione, in particolare il panico finanziario che si verificò nel 1907. Durante quell’episodio, i pagamenti furono sospesi in tutto il paese perché molte banche e clearinghouse si rifiutavano di liquidare degli assegni emessi da certe altre banche, una pratica che contribuì al fallimento di banche altrimenti solventi. Per affrontare questi problemi, il Congresso diede alla Federal Reserve l’autorità di istituire un sistema dei pagamenti valido in tutto il paese.”. La FED quindi perchè nasce? Perchè sennò, lasciato ai privati, il sistema dei pagamenti nazionale va in tilt, causando il crash economico. Che, immagino per Lei, sia una bazzecola da quanto scrive. f. spirito 16 ottobre 2013 alle 16:13 @fla: e infatti, si vede che gran risultati ha ottenuto la FED no? grande depressione, stagflazione, grande recessione. mmm :D Fla 16 ottobre 2013 alle 18:00 Direi che dare alla FED le colpe della grande depressione, stagflazione e grande recessione è quantomeno azzardato. f. spirito 16 ottobre 2013 alle 20:49 nessuno ha dato colpe a nessuno. semplicemente, tu hai detto: “Creando il sistema della Federal Reserve, il Congresso intendeva porre fine alle gravi crisi finanziarie che periodicamente sconvolgevano la nazione” beh, NON CI SONO RIUSCITI. anzi, ci son state crisi BEN PEGGIORI. f. spirito 16 ottobre 2013 alle 20:53 sempre per fla: volendo poi dare colpe, ricopio qui un piccolo estratto di uno sconosciuto che nel 2003 diceva: “The special privileges granted to Fannie and Freddie have distorted the housing market by allowing them to attract capital that they could not attract under pure market conditions. Like all artificially created bubbles, the boom in housing prices cannot last forever. When housing prices fall, homeowners will experience difficulty as their equity is wiped out. Furthermore, the holders of the mortgage debt will also have a loss. These losses will be greater than they would have otherwise been had government policy not actively encouraged over-investment in housing, the damage will be catastrophic.” è lo stesso che dice che prima o poi, il dollaro collasserà. certo, ci sono lo shale gas e le cannoniere… Fla 16 ottobre 2013 alle 23:06 Innanzitutto non sono cose che IO dico, ma che dice la Federal Reserve. Negli USA, prima del 1947 il tasso di crescita si muoveva in un “corridoio” che andava dal +16% al – 15%. Dal 1947 in poi, l’impegno dei governi occidentali nell’adottare politiche anticicliche (pensa un po’, quelle cosiddette keynesiane) ha ristretto i margini del corridoio dal +10% al 3% L’ultima recessione (2010) è cinque volte meno intensa della recessione più grave del periodo fra le due guerre. Detto questo, ci sono state crisi peggiori? Da quando si è deciso di fare politiche anticicliche, controllo movimenti capitali, banche centrali che concertano col Tesoro, la risposta è no. Da quanto si è deciso di invertire la rotta, le cose sono cambiate (deregulation, crisi finanziarie vari paesi ex-sovietici, sudamericani, sud est asiatico, Dot Com, Subprime). Poi è pacifico: se mi metti ex-banchiere al segretario Tesoro, è naturale che farà gli interessi di Wall Street e non di Main Street. Secondo punto: La FED, così come qualsiasi istituto centrale, prima di tutto rifornisce le banche nazionali della liquidità di cui necessitano per non lasciare a secco il sistema dei pagamenti. Se poi si utilizza la FED, come avvenuto nel 2008, per fare il welfare banking, salvare il sistema finanziario collassante, siamo d’accordo che così non va. Ma, essendo il suo mandato, sono stati obbligati a farlo. Rimane però il punto centrale: la BC fornisce liquidità SU RICHIESTA del sistema. Mica si stampa a piacere, dai, è risaputo da tutti. Su Fannie Mae e Freddie Mac è inutile guardare la fine e non l’inizio: da metà anni ’70 i consumi, soprattutto in USA, sono stati trainati del debito privato. Diamo uno sguardo ai real wages ed alla disoccupazione statunitense. Con redditi in calo, il consumatore non può far altro che acquistare a debito. Questa è la droga del mercato, altrochè i QE. Sono stati i vari Rubin, Clinton e compagnia a voler che"
