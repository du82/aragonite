["https://keynesblog.com/2013/06/12/la-teoria-delle-aree-valutarie-ottimali-non-spiega-la-crisi-delleuro-pdf"]
title = "La Teoria delle Aree Valutarie Ottimali non spiega la crisi dell’euro [PDF] | Keynes blog"
description = "Il peccato “originale” dell'euro non pare trovare adeguata spiegazione in una delle teorie che oggi sembra andare molto di moda a seguito della crisi della moneta unica. Una disamina critica della teoria delle “aree valutarie ottimali” porta a concludere che i “criteri” da essa enunciati sono contraddittori ai fini di illustrare le criticità dell'euro, mentre…"
full_description = "31 commenti La Teoria delle Aree Valutarie Ottimali non spiega la crisi dell’euro [PDF] Pubblicato da keynesblog il 12 giugno 2013 in consigliati, Economia, Europa, ibt, Teoria economica Il peccato “originale” dell’euro non pare trovare adeguata spiegazione in una delle teorie che oggi sembra andare molto di moda a seguito della crisi della moneta unica. Una disamina critica della teoria delle “aree valutarie ottimali” porta a concludere che i “criteri” da essa enunciati sono contraddittori ai fini di illustrare le criticità dell’euro, mentre le sue conclusioni di politica economica sono controproducenti economicamente e socialmente insostenibili. Ciò che rende stabile un’area valutaria è, in ultima analisi, lo Stato. La teoria delle Aree Valutarie Ottimali (AVO, in inglese “Optimum Currency Area”) sta vivendo una notorietà particolarmente elevata dallo scoppio della crisi dell’euro. Economisti di diverse estrazioni, e numerosi studi dei maggiori organismi internazionali, hanno individuato nell’eurozona un’“area valutaria pessima” e spiegato in questo modo la tendenza al collasso della moneta unica europea. Eppure, a ben vedere, la teoria delle AVO non sembra convincente circa le difficoltà dell’euro. Nell’articolo che proponiamo (scarica il PDF) partiamo mostrando che la teoria si basa sui presupposti del paradigma teorico neoclassico: le preferenze del consumatore, la dotazione dei fattori produttivi, l’esistenza di un tasso “naturale” di interesse che equilibra investimenti e risparmi, la teoria quantitativa della moneta. Non sorprende quindi che le politiche che ne discendono siano in larga parte basate su una modifica delle condizioni dell’offerta: mobilità del fattore lavoro (cioè l’emigrazione dei disoccupati da una regione depressa) e del capitale, flessibilità salariale, maggiore concorrenza per indurre l’abbassamento dei costi. Esaminando i “criteri” in base ai quali un’area valutaria può considerarsi ottimale, mostriamo che essi non sembrano dare una spiegazione convincente della crisi dell’euro. Rifacendoci alla letteratura, mainstream ed eterodossa, evidenziamo la contraddittorietà di tali criteri sia rispetto a quanto avvenuto nell’eurozona, sia in una situazione teorica. In particolare ci concentriamo sulla mobilità delle merci e dei capitali, che può produrre maggiori divergenze tra le regioni di un’area valutaria, e sulla mobilità del fattore lavoro, ritenuta dalla teoria AVO un elemento riequilibrante. Al contrario, mostriamo che il “rimedio” dell’emigrazione dei disoccupati da una regione in crisi verso le regioni più forti, non determina necessariamente un riequilibrio ma al contrario può esacerbare le divergenze pregresse. La conclusione della nostra argomentazione è che l’unico “criterio” determinante per la stabilità di un’area valutaria è la presenza di uno Stato con un largo bilancio pubblico e una banca centrale prestatrice di ultima istanza e “garante” del debito pubblico (esattamente ciò che manca all’eurozona). Questo “criterio” determinante è stato diluito in un insieme di altri presupposti, in larga parte irrilevanti o persino contraddittori. Ne risulta che la teoria delle AVO, che si consideri la sua formulazione originaria o la sua evoluzione “endogena”, non appare in grado né di spiegare la crisi dell’euro né di indicarne la soluzione. Scarica il PDF __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0a4005f2', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0a400642', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: aree valutarie ottimali, euro, Robert Mundell Permalink Navigazione articolo ← L’incoerenza della Lettanomics Dazi sui pannelli fotovoltaici? Il problema è la Germania, non la Cina → 31 commenti su “La Teoria delle Aree Valutarie Ottimali non spiega la crisi dell’euro [PDF]” Saverio 12 giugno 2013 alle 10:10 Scusate, ma qui credo ci sia un equivoco di fondo: la teoria delle “AVO” non viene presa – dai critici dell’euro, come il sottoscritto – come modello sociale da seguire, tutt’altro. Essa è però utile per spiegare perchè l’Euro è insostenibile: se non puoi svalutare la moneta puoi solo “svalutare” i salari, con tutto quel che vediamo sotto i nostri occhi. Poichè la costruzione di uno stato europeo con un ampio bilancio federale ed una banca prestatrice di ultima istanza è evento assai meno probabile che la Terra si allontani dal sistema solare, allora l’unica soluzione è l’eutanasia dell’euro guiodic 12 giugno 2013 alle 10:27 Hai già letto 10 pagine di articolo e relativa bibliografia? Saverio 13 giugno 2013 alle 16:00 L’ho riletto per esser sicuro di aver capito. Al di là delle considerazioni di natura teorica ed empirica (che lascio a chi ne sa più di me) non mi pare che smentisca l’assioma “se non puoi svalutare la moneta puoi solo svalutare i salari”. Continuo a pensare più possibile che la Terra si metta a girare in senso opposto a quello cui siamo abituati che non realizzare uno stato europeo con ampio bilancio federale e banca prestatrice di ultima istanza. guiodic 16 giugno 2013 alle 10:24 ““se non puoi svalutare la moneta puoi solo svalutare i salari”.” L’esperienza mostra che di norma si fanno tutte e due le cose. Comunque il discorso è più ampio. pierpier 12 giugno 2013 alle 13:49 Credo che il problema sia che di AVO ne esistano poche nella realtà, cionoostante quanti Stati sono nati che non erano AVO? alcuni esempi Stati Uniti, la Germania dopo l’unificazione e la stessa Italia,e alla fine mi pare che gli esempi dimostrino che alla fine funzionino. Il problema è che in politica ed economia non si può invertire l’ordine dei fattori , per cui si crea prima una unificazione politica, con tutte le regole istituzionali per farla funzionare compresa una vera banca centrale e poi di conseguenza si ha una moneta unica. In Europa si è voluto forzare la mano facendo un unione monetaria prima di tutto per cui non poteva funzionare , infatti è bastata la prima crisi per mandare all’aria tutto. Giorgio 12 giugno 2013 alle 14:07 Intervento molto interessante. Chiaro e completo. Complimenti. claudio 12 giugno 2013 alle 14:55 e quello che ho sempre pensato è cioè se tu riduci a meri amministatori gli stati nazionali devi avere uno stato supernazionale forte che si prende cura di ogni metro di terra esistente in quei confini (economicamente parlando) con meccanismi fiscali di compensazione ,e con la salvaguardia della composizione dei capitali…(altro che aprire alla libera circolazione dei capitali ,al di fuori di quell,area ,e sempre che quell,area facesse sistema e non affari all,interno) per la questione dell,”invasione “di capitali esteri nelle aree del sud europa compreso anche l,irlanda ed il successivo “ritorno”verso le aree forti..questo lo dovrebbero capire bene coloro che dicono che draghi non si è mosso di concerto con la germania…..comunque spero che sul blog compaiono sempre di piu questi lavori Nicos Atene. 12 giugno 2013 alle 23:32 La esperienza Italiana e’ molto utile per i sostenitori della insostenibilita’ del Euro.Dopo 162 anni dalla sua unificazione , il divario economio tra Nord e’ Sud diverge invece di convergere. Da notare: Nonostante l ‘ Italia soddisfa tutti i parametri di una AVO. La zona euro invece e’ composta da stati, nella strangrante maggioranza con niente in comune :,sviluppo economico, storia, cultura, lingua ecc. Tra l’ altro In un esperimento che il parere dei popoli non conta e conta solamente della elit di Brusseles quale emana leggi e ordini che li stati sono costretti ad appliare. L’ euro e’ stato un esperimento fallimentare. Invece di una sua eutanasia proporei un divorzio consensuale. Non esiste nessun vantaggio per i popoli e li stati nazione del sud europa dalla la loro permanenza nella zona euro. E gli vantaggi sono tantissimi.: Austerita’ permanente, perdita’ della sovranita’ e della democrazia parlamentare in un zona dominata dalla Germania .. claudio 13 giugno 2013 alle 09:52 pero qui mi sembra che dobbiamo metterci d,accordo su una cosa è cioe se dobbiamo parlare sul fatto che l,euro non poteva funzionare perche operava in una zona A:V:O non era adatta (a cui io credo poco) oppure perche sono state applicate all,euro politiche e di conseguenza regole economiche confuse al di fuori di qualsiasi logica, con caratterestiche prevalentemente politiche…(cioè con la creazione di poteri al di fuori di ogni logica di sistema ,e di democrazia).che ha permesso all,euro di funzionare,solo ed a vantaggio di chi lo ha progettato in quel modo.Oppure ha funzionato male perche progettato per funzionare “MALE”. ,euro al contrario di quello che molti pensano ha funzionato ( per alcuni)ed è stata questo secondo me il problema: che l,euro ha seguito una sua logica che era diversa dalla mia e di tantissime persone che magari volevano un progetto vero di unificazione ed è questo il problema vero..il resto avo o non avo sono solo palliativi inutili che cercano di giustificare il fallimento dell,euro….se si fossero applicate altre logiche l,euro avrebbe funzionato perche le cose fatte bene funzionano sempre . Damiano 13 giugno 2013 alle 11:45 L’euro? una moneta nata per truffare i popoli già nel cambio iniziale quando le banche strombazzavano, che con l’euro si erano abbassati i tassi, una favola in realtà si era alzato il valore della moneta quindi di conseguenza si è potuto abbassare i tassi ma ci vuole più lavoro per avere meno moneta con un potere reale di acquisto inferiore al LIRA,( di fatto in Italia). L’euro a giovato ai grandi capitali che hanno uno strumento ottimo per le loro truffe e speculazioni anche con leggi che favoriscono tutta questa sporcizia, e ha affossato il lavoro in Italia, Grecia, Spagna, chi sa perché. Avete voi una spiegazione? La Teoria delle Aree Valutarie Ottimali non spiega la crisi dell’euro. | Quaderni socialisti 16 giugno 2013 alle 18:38 […] Continua a leggere » […] Il grossetano Marco f. 16 giugno 2013 alle 21:17 1) “Se non posso svalutare la moneta allora si svalutano i salari”…. 2) “L’esperienza mostra che di norma si fanno tutte e due le cose”…. Mentre comprendo bene il punto uno, ho difficoltà ad inquadrare il 2. Passi in un sistema a cambi fissi (dove uno si sgancia, tipo lira/ECU 1992), ma in un sistema con moneta unica come applico la seconda parte del 2? L’euro può anche svalutarsi contro $ e ¥ ma i differenziali di redditività intra-€ (che sono il vero problema e generano i perduranti squilibri di partite correnti fra paesi core e periferici dell AVO/OCA) come scompaiono? Non siamo un’unica stato con trasferimenti da nord a sud, non siamo un vero stato con un solo popolo con una sola lingua e laureati del sud che possano far concorrenza a laureati tedeschi in casa loro (ci credo che la mobilità territoriale del lavoro non consente di raggiungere il livellamento dei differenziali salariali, a meno che un 110 e lode in economia a Roma faccia concorrenza ad un lavavetri ai semafori di Stoccarda…,, me lo aveva detto babbo: “studia il tedesco, quella sarà la lingua del padrone!!”). Gian 16 giugno 2013 alle 22:08 Consiglio di leggere chi ne capisce veramente qualcosa (e ha titolo di farlo): http://krugman.blogs.nytimes.com/2012/06/24/revenge-of-the-optimum-currency-area/ guiodic 17 giugno 2013 alle 01:43 Peccato che se tu avessi letto i lavori scientifici di Krugman, ti renderesti conto che il modello da lui utilizzato implica che, in condizioni che si verificano facilmente, le conclusioni di Mundell sono parziali se non errate e che la mobilità dei fattori produttivi, come quella delle merci, è fonte di divergenze e squilibri. Questo è spiegato nel pdf che abbiamo scritto, ma tu ti sei limitato a leggere tre righe di sommario e affidarti a un post su un blog di Krugman invece di leggere quello che scriveva come economista e per il quale ha preso anche il Nobel. Nel PDF ci sono i link. Buona lettura. guiodic 17 giugno 2013 alle 01:45 Aggiungo che persino Fleming – quello che con Mundell ha creato il famoso modello Mundell-Fleming – ammetteva che la mobilità dei fattori non è affatto detto che sia una buona idea. Gian 17 giugno 2013 alle 11:36 Premessa: interpreto la teoria delle AVO con la lente di Krugman. Primo: la teoria delle AVO, i cui criteri nel caso dell’euro sono stati largamente sottostimati, è tutta edificata sulla concezione della limitazione dei danni prodotti da un’unificazione valutaria, che è sempre dannosa. Secondo: si considera la labor mobility e non la mobilità del capitale, quest’ultima figlia di un’incontrollata deregolamentazione i cui effetti nefasti sono indubbi. Terzo: nel lungo periodo la sola integrazione fiscale produce perlomeno tensioni politiche: camicie verdi in Italia e possibili camicie brune in Germania se tale integrazione si realizzasse (a livello nazionale in Germania stessa esistono già ora forti attriti, figurarsi a livello europeo: http://www.wallstreetitalia.com/article/1532895/europa/la-germania-non-vuole-l-unione-fiscale-tedesca-figuriamoci-quella-europea.aspx) Quarto: nel documento si criticano i risultati delle condizioni della teoria delle AVO come se esse fossero state applicate, ma labor mobility e soprattutto integrazione fiscale e la presenza di un prestatore d’ultima istanza sono tutti fattori assenti. Quinto: si considerano gli effetti di una diminuzione dei prezzi interni durante una crisi, esercizio che è perlomeno fuoriluogo. Sesto: mi fornisca per cortesia le fonti di questa frase: “Sempre secondo Krugman, in determinate condizioni la mobilità del fattore lavoro può avere persino effetti avversi sulla convergenza tra le regioni facenti parte di un’area valutaria.” Inoltre, mi dica cortesemente sulla base di che cosa si afferma che il ruolo dello Stato è stato “progressivamente messo in ombra nello sviluppo della teoria delle AVO”. Questa è la conclusione di Krugman riguardo all’euro: “[…] concerns about the euro based on optimum currency area theory were actually understated. Members of a currency area, it turns out, should have high integration of bank guarantees and a system of lender of last resort provisions for governments as well as the traditional Mundell criterion of high labor mobility and the Kenen criterion of fiscal integration. The euro area has none of these.”. Se avesse aperto il link la mia replica sarebbe stata superflua. guiodic 17 giugno 2013 alle 11:40 “mi fornisca per cortesia le fonti di questa frase: “Sempre secondo Krugman, in determinate condizioni la mobilità del fattore lavoro può avere persino effetti avversi sulla convergenza tra le regioni facenti parte di un’area valutaria.” Guardi la bibliografia. Se avesse aperto il link la mia replica sarebbe stata superflua. Se avesse guardato la bibliog"
