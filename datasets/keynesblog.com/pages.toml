full_description = "Video [Video] Joseph Stiglitz: “Non firmate il TTIP” Di keynesblog 30 ottobre 2015 4 commenti Robert Skidelsky: “Keynes e la Teoria Generale” [video sub ITA] Di keynesblog 15 marzo 2015 8 commenti Robert Skidelsky, economista e storico dell’economia, biografo di Keynes, in questa intervista per il sito EconStories illustra i contenuti della Teoria Generale dell’Occupazione, dell’Interesse e della Moneta, l’opera più importante dell’economista di Cambridge. In particolare Skidelsky spiega perché il “keynesismo” illustrato nei libri di testo differisce sostanzialmente dal contenuto della Teoria Generale. Grazie all’amico Faber Fabbris […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1bfb2b7c', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); [video] Alessandro Roncaglia: Keynes e il ruolo dello stato nell’economia Di keynesblog 10 aprile 2014 1 Commento “Da Mario a Maynard” – video dell’intervento al convegno sull’Europa e l’Euro del M5S Di keynesblog 5 novembre 2013 26 commenti Pubblichiamo il video dell’intervento di Guido Iodice al convegno dei gruppi parlamentari del M5S tenutosi il 4 novembre 2013. Sotto il video è possibile scaricare anche le slide. Slide “Da Mario a Maynard” “Euro: opportunità o schiavitù?” – Oggi incontro organizzato dal M5S (diretta web ore 16) Di keynesblog 4 novembre 2013 6 commenti Prende avvio il ciclo di incontri promossi dal gruppo parlamentare del MoVimento 5 Stelle con economisti ed esperti per discutere delle politiche europee, dell’impatto dei vincoli dell’Ue sulla nostra economia e delle prospettive della moneta unica. Il M5S propone quattro momenti di riflessione sul significato della nostra permanenza in Ue e sulle conseguenze dell’Unione monetaria. […] Giappone e Abenomics a Economìa su Radio Macchianera Di keynesblog 2 giugno 2013 2 commenti Perché il PIL giapponese è riuscito a crescere del 3,5% nei primi 3 mesi dell’anno? E come ha fatto l’indice di Borsa a Tokyo a salire del 64% in 6 mesi?! Tutto merito dell’Abenomics? In studio: Marco Ardemagni, Matteo Bordone, Laura Carcano, Paolo Landi, Gianluca Neri, Simone Tolomelli. In collegamento audio Guido Iodice di Keynes blog. 21 maggio 2013 Fonte: podcast di Macchianera. Tutte le contraddizioni di Bini Smaghi [2 video] Di keynesblog 17 Maggio 2013 18 commenti di Stefano Lucarelli per Keynes Blog Non è cosa di tutti i giorni vedere un ex membro del comitato esecutivo della BCE arrampicarsi sugli specchi dinanzi ad una serie di critiche puntuali. Mercoledì scorso ad Ancona, Lorenzo Bini Smaghi ha presentato e discusso con alcuni degli economisti italiani più capaci di criticare le ricette mainstream […] [VIDEO] EPIC intervista Emiliano Brancaccio su euro, austerità, MMT Di keynesblog 15 marzo 2013 2 commenti Il gruppo EPIC (Economia Per I Cittadini) ha intervistato Emiliano Brancaccio, ricercatore e docente di Economia presso l’Università del Sannio. Le cause della crisi europea, le divergenze tra paesi centrali e paesi periferici dell’Unione, gli ostacoli all’adozione di riforme in grado di contrastare le forze centrifughe in atto e la prospettiva di una implosione della […] [Video] Intervista a Daniela Palma e Guido Iodice (Keynes Blog) Di keynesblog 28 gennaio 2013 80 commenti Il 20 dicembre la web radio toscana “Free Channel” ci ha lungamente intervistati durante la trasmissione “Close Up” di Aldo Oliva. Parliamo di austerità, euro e delle contraddizioni della politica. Questa è la prima parte. e questa la seconda parte: [Video] A cosa serve lo Stato? Di keynesblog 14 novembre 2012 5 commenti Abbiamo sottotitolato per voi questo video dell’Istituto Roosevelt, il prestigioso think tank “liberal” americano, vicino al Partito Democratico di Obama. Forse potrà sembrare retorico, ma non negli USA dopo decenni di propaganda contro ogni intervento pubblico nell’economia. E del resto anche da noi ormai da anni impazzano i luoghi comuni contro lo Stato. Buona visione. […] Navigazione articolo ← Articoli più vecchi"
