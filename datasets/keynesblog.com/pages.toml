["https://keynesblog.com/2012/02/23/il-pasto-gratis-di-keynes"]
title = "Il “pasto gratis” di Keynes | Keynes blog"
description = "Non esiste un pasto gratis. Questa è forse una delle frasi più ricorrenti in economia. Sta a significare che qualsiasi azione che abbia una valenza economica ha un costo che prima o poi qualcuno dovrà pagare. Ma è davvero così? Nell'articolo di Brad DeLong che proponiamo ai lettori si dimostra l'esatto opposto. Si tratta di…"
full_description = "15 commenti Il “pasto gratis” di Keynes Pubblicato da keynesblog il 23 febbraio 2012 in Teoria economica I moltiplicatori calcolati da Moody's Non esiste un pasto gratis. Questa è forse una delle frasi più ricorrenti in economia. Sta a significare che qualsiasi azione che abbia una valenza economica ha un costo che prima o poi qualcuno dovrà pagare. Ma è davvero così? Nell’articolo di Brad DeLong che proponiamo ai lettori si dimostra l’esatto opposto. Si tratta di una esposizione divulgativa del principio noto come “effetto moltiplicatore“, introdotto nella Teoria Generale da Keynes ma sviluppato dall’economista post keynesiano Richard Kahn, un alievo dello stesso Keynes. Il ragionamento è semplice: se lo stato spende un milione di euro in una strada, questo milione di euro entrerà direttamente nel Pil nazionale. Ma per costruire una strada serviranno degli operai e degli ingegneri, i quali spenderanno il loro stipendio (che faceva già parte della spesa iniziale di un milione di euro). Ma spendendo i propri salari queste persone farebbero lavorare altri lavoratori impiegati nelle aziende che producono alimenti, oggetti di consumo, oppure costruiscono case o altro ancora. Ad ogni passaggio una parte degli introiti verrebbe risparmiata, ad esempio l’operaio potrebbe spendere solo 800 euro su mille di stipendio: pertanto l’effetto non dura all’infinito, ma sicuramente è significativo. E, come intuibile, l’effetto è tanto più grande quanto più grande è la propensione al consumo e minore quella al risparmio. Ci sono, in effetti, evidenze sperimentali. Il capo economista di Moody’s, Mark Zandi, ha ad esempio testimoniato al congresso che l’effetto moltiplicatore per i buoni alimentari destinati alle persone povere frutta alla ricchezza nazionale in un anno 1,76 volte la spesa. Non male. Investimenti a lungo periodo hanno ovviamente moltiplicatori minori su un anno, ma generalmente maggiori complessivamente. Insomma, che i soldi si usino per l’assistenza sociale mirata al consumo o per costruire ponti, non sono sprecati, e anzi costruiscono un futuro di modernizzazione di una nazione. Se la cosa suona strana è solo perché non si tiene conto di un fatto semplice: non parliamo di una torta “fissa”. Non stiamo togliendo ricchezza a qualcuno per darla ad un altro: stiamo creando nuova ricchezza. Ecco perché, con gli investimenti e le politiche keynesiane, si possono tenere in ordine i conti pubblici e contemporaneamente dare lavoro a chi è oggi disoccupato. Un problema che nel nostro paese sembra non porsi più nessuno. Ovviamente gli economisti non keynesiani non saranno d’accordo. Diranno che prima o poi tutto si paga. Ma sono gli stessi che sostenevano che Grecia e Portogallo si sarebbero salvati grazie all’ “austerità espansiva”. In fine la risposta a due comuni obiezioni. 1) Le spese per gli investimenti andrebbero fatte emettendo titoli di stato, cioè facendosi prestare il denaro dai cittadini. I BTp oggi viaggiano ad un tasso di interesse oltre il 5%, quindi molto alto. E’ per questo che in molti propongono gli Eurobond (e quindi un debito pubblico europeo, come lo è la moneta) che avrebbe tassi più ragionevoli. 2) Nel nostro paese le infrastrutture e altre spese pubbliche tendono a costare molto di più che in altre nazioni. Il motivo in genere è la corruzione dilagante. Ma questa si risolve con controlli migliori e regole più ferree per gli appalti. Se fossimo affetti da un’ulcera sarebbe suicida pensare di non operarsi perché il medico potrebbe lasciarci la pinza nello stomaco: la soluzione è scegliere un medico affidabile, non morire di ulcera. Leggi l’articolo di Brad DeLong __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f094df82c', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f094dfdbf', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: Brad DeLong, mark zandi Permalink Navigazione articolo ← Siamo tutti greci Anche la Commissione UE finalmente scopre la recessione → 15 commenti su “Il “pasto gratis” di Keynes” Aury88 23 febbraio 2012 alle 18:41 cavolo anche io faccio spesso questo ragionamento…lo reputo una cosa intuitiva, logica (mi sembra che questo ragionamento avesse tante cose in comune con la politica economica di Roosevelt)…non sapevo ci fose dietro addirittura una teoria economica. ho sempre avuto dei dubbi però e cioè alla fine è più efficace un milione preso dallo stato tramite le tasse e reinvestito nel territorio o lo è di più non tassare per un milione la popolazione, oppure meglio ancora far si che sia la popolazione ad investire quei soldi promettendo detrazioni in base agli investimenti? in oltre questo ragionamento è ancora così valido in un economia globalizzata per risolvere problemi locali? quei soldi la gente povera probabilmente li spenderebbe per comprarsi beni il più economici possibili che, quindi, spesso provengono da paesi extraeuropei.l’effetto potrebbe risultarne diluito su una più vasta scala, tanto vasta da poter non essere più apprezzabile a livello nazionale. guiodic 23 febbraio 2012 alle 21:29 mi sembra che questo ragionamento avesse tante cose in comune con la politica economica di Roosevelt Esattamente. ho sempre avuto dei dubbi però e cioè alla fine è più efficace un milione preso dallo stato tramite le tasse e reinvestito nel territorio Qui non parliamo di tasse, ma di spesa in deficit, alimentata dal debito pubblico, cioè dai prestiti dei cittadini. Tuttavia bisogna anche valutare il caso in cui vengono tassate le rendite (e non il lavoro o i profitti). Questo favorisce l’investimento privato. In un periodo di depressione può essere anche efficace tassare i redditi più alti che hanno una maggiore propensione al risparmio e/o detassare le spese private, in particolare gli investimenti. Però il problema è questo: in un periodo di depressione anche se investire fosse totalmente gratis (cioè l’imprenditore si trovasse a pagare interessi zero) la tendenza sarebbe quella di NON investire perché l’imprenditore avrebbe timore di non riuscire a restituire neppure il capitale senza interessi. Un timore fondato se si prende l’imprenditore singolarmente, ma terribilmente deleterio e contrario alla logica se si prendono tutti gli imprenditori insieme. Se tutti gli imprenditori decidessero, contro il loro interesse particolare, di iniziare ad investire, la domanda aggregata salirebbe e il problema della depressione si risolverebbe. Ma è ovvio che questo non accadrà mai perché nessuno rischierà il suo denaro o il denaro preso a prestito. Per questo deve essere lo stato ad investire, visto che nessuno lo fa. in oltre questo ragionamento è ancora così valido in un economia globalizzata per risolvere problemi locali? quei soldi la gente povera probabilmente li spenderebbe per comprarsi beni il più economici possibili che, quindi, spesso provengono da paesi extraeuropei.l’effetto potrebbe risultarne diluito su una più vasta scala, tanto vasta da poter non essere più apprezzabile a livello nazionale. Nell’articolo infatti si parla di food stamp, cioè i buoni alimentari. Inoltre la cosa principale da fare è l’investimento dello stato in infrastrutture e altri beni durevoli e la creazione diretta di posti di lavoro, ad esempio per la manutenzione del patrimonio artistico e ambientale. Aury88 23 febbraio 2012 alle 22:16 quello dei food stamp mi sembra fosse un esempio per spiegare il guadagno economico per lo stato che li emette. però si fa l’esempio anche della piccola opera (la strada da un milione di euro) che si finanzia in altra maniera (soldi, buoni del tesoro ecc ecc), giusto? anche in quest’ultimo caso, nonostante la globalizzaizone e la concorrenza dei mercati emergenti (che spingono gli acquisti dei proprio prodotti a discapito di quelli nazionali) vale questo effetto moltiplicatore? il rischio non è, per una società con un rapporto import/export elevato, di veder uscire velocemente i propri capitali prima che si verifichi un sufficiente ricircolo del denaro che alla fine, mi sembra di capire, è l’elemento che effettivamente determina l’effetto moltiplicatore? grazie guiodic 23 febbraio 2012 alle 22:30 però si fa l’esempio anche della piccola opera (la strada da un milione di euro) che si finanzia in altra maniera (soldi, buoni del tesoro ecc ecc), giusto? anche in quest’ultimo caso, nonostante la globalizzaizone e la concorrenza dei mercati emergenti (che spingono gli acquisti dei proprio prodotti a discapito di quelli nazionali) vale questo effetto moltiplicatore? il rischio non è, per una società con un rapporto import/export elevato, di veder uscire velocemente i propri capitali prima che si verifichi un sufficiente ricircolo del denaro che alla fine, mi sembra di capire, è l’elemento che effettivamente determina l’effetto moltiplicatore? grazie Perché non dovrebbe? Gli operai che lavoreranno alla strada vivranno in Italia, non certo in Cina. Certo, è vero che la concorrenza dei paesi emergenti può ridurre il moltiplicatore. Ma come si risolve il problema? con più investimenti che aiutino le imprese che producono semilavorati, ad esempio. In tal modo esse modernizzeranno la loro produzione riducendo i costi e migliorando il prodotto e diventeranno più competitive. In effetti questo è il vero problema italiano, la bassa “efficienza” del capitale. Bosone di x 23 febbraio 2012 alle 21:09 Aury il fatto che lo stato possa fare deficit stampando moneta e creando ricchezza nel paese non significa che bisogna starsene tutti più rilassati aspettando che ci piova un po’di ricchezza addosso. Bisognerebbe cioè contemporaneamente a una politica economica espansiva perseguire comunque l’efficenza dei fattori produttivi, con un occhio di riguardo all’innovazione e alla ricerca, in modo che il sistema paese sia comunque competitivo verso l’esterno, e abbia quindi una bilancia commerciale almeno in pareggio, in modo da compensare quello che acquistiamo dall’estero. Lo stesso vale per l’efficenza della spesa pubblica, il fatto che ve ne sia la disponibilità non significa che essa vada sprecata, anzi, va condotta sotto una logica di “massimizzazione del profitto” inteso come massimizzazione della ricaduta sociale, investimenti in capitale umano che creeranno a loro volta nuova ricchezza e ripagheranno quella investita. Ne corruzione ne cattedrali del deserto, sono presupposti imprescindibili di qualsiasi sistema che miri al progresso. Aury88 23 febbraio 2012 alle 22:24 sono pienamente d’accordo sopratutto per due motivi: 1) l’Italia non può più stampare moneta a suo piacimento ma è limitata dalla BCE che mi sembra, e giustamente aggiungerei, sia contraria a questo genere di politica economica. 2)lo stampo di moneta nell’era della lira ha già dimostrato di non essere la soluzione anzi spesso è stato il problema. guiodic 24 febbraio 2012 alle 01:55 Dipende, ci sono condizioni in cui stampare moneta non ha effetti inflattivi. Il discorso è più complesso. lbattisti80 24 febbraio 2012 alle 11:39 Vorrei fare una piccola precisazione. Il moltiplicatore della spesa viene “scoperto” da Nicholas Kaldor, il quale poi ne parla a Keynes, e quest’ultimo lo inserirà nella teoria generale. Questo è testimoniato nel libro di Pasinetti “i keynesiani di Cambridge” guiodic 24 febbraio 2012 alle 13:15 Il moltiplicatore fu scoperto da R.Kahn come riferiamo nell’articolo e come dice Pasinetti nel libro da lei citato. Ma non lo dice solo Pasinetti. Lo dice lo stesso Keynes nella Teoria Generale (cap.10): The conception of the multiplier was first introduced into economic theory by Mr. R. F. Kahn in his article on “The Relation of Home Investment to Unemployment” (Economic Journal, June 1931). Quel che fece Kaldor fu applicarlo alla teoria della istribuzione del reddito. Mantione Alessandro 25 febbraio 2012 alle 10:04 Ovviamente d’accordo sui ragionamenti sul “pasto gratis”, il differenziale sul rendimento dei debito sovrano italiano,depurato dalla pressione speculativa, potrebbe servire ad attirare liquidità dall’estero, infine d’accordo sui maggiori costi, per la presenza di una piuttosto diffusa corruzione e sui rimedi, ma perche la spesa statale deve orientarsi prevalentemente verso il settore delle infrastrutture?Alessandro Mantione federico davoli 3 luglio 2012 alle 20:29 dovreste vergognarvi voi che seguite queste idee..se ci troviamo nella crisi attuale è proprio grazie alle teorie folli come queste. è chiaro che qualsiasi bene economico, quindi la maggior parte, hanno un costo per qualcuno e secondo voi solo grazie all’effetto moltiplicatore questo costo si annulla? ma cosa centra il fatto che il milione faccia parte del pil nazionale? le tasse i cittadini le hanno dovute pagare e saranno soldi che non saranno più disponibili in futuro per loro, e questo per voi non è un costo? è semplicemente un costo sostenuto da altri e non da chi direttamente “paga” per costruire la strada. Inoltre non è detto che una strada o una qualsiasi altra infrastruttura sia davvero un investimento: se questa strada non offre alcun servizio concreto a nessuna azienda di produzione, la strada diventa semplicemente un consumo perchè non porta a nessun incremento di ricchezza, visto che nessuno ha “prodotto” ricchezza graie a questa strada. la crisi attuale è stata causata proprio dallo stato e voi ancora vi azzardate a dare la colpa ai liberisti (ai veri liberisti)? svegliatevi che magari è meglio lbattisti80 4 luglio 2012 alle 15:28 grazie per lo stile scevro e accademico. la tua risposta trasuda tutto lo studio e la conoscenza che hai dell’economia. Penso che gli autori e il mondo tutto ascolteranno attentamente le tue considerazioni. grazie davvero. keynesblog 4 luglio 2012 alle 21:17 Se la crisi l’ha creata lo Stato (quale stato poi, visto che è mondiale?) come mai quando nel mondo occidentale esistevano molte più aziende statali, la finanza era controllata e le aliquote fiscali marginali erano molto più alte di oggi, non c’era crisi? Stefano 2 settembre 2012 alle 02:38 Non si scrive “centra” ma “c’entra”. FLAGS OF OUR FATHER 5- LA CIVILTA' DEL LOW COST E DEI BUONI ALIMENTARI (DA TAGLIARE) - VoxPopuli.org 30 aprile 2015 alle 20:17 […] della ricchezza nazionale, con un “effetto moltiplicatore” di 1,76 volte la spesa, come ha testimoniato al Congresso Mark Zandi, capo economista di Moody’s. In uno scenario sociale instabile e potenzialmente esplosivo, […] I commenti sono chiusi."
