["https://keynesblog.com/2021/10/02/anche-draghi-lo-certifica-per-ridurre-il-debito-pubblico-bisogna-aumentare-il-deficit"]
title = "Anche Draghi lo certifica: per ridurre il debito pubblico bisogna aumentare il deficit | Keynes blog"
description = "Quest’anno il disavanzo dei conti pubblici sarà al 9,4% e resterà alto anche nei prossimi due. Eppure, come ci dicono le cifre del governo, il rapporto debito/Pil scenderà. E’ una dimostrazione di quanto siano state sbagliate le politiche europee e le regole – ora sospese – che le prescrivevano. Ma non è detto che questo…"
full_description = "1 Commento Anche Draghi lo certifica: per ridurre il debito pubblico bisogna aumentare il deficit Pubblicato da keynesblog il 2 ottobre 2021 in Economia Quest’anno il disavanzo dei conti pubblici sarà al 9,4% e resterà alto anche nei prossimi due. Eppure, come ci dicono le cifre del governo, il rapporto debito/Pil scenderà. E’ una dimostrazione di quanto siano state sbagliate le politiche europee e le regole – ora sospese – che le prescrivevano. Ma non è detto che questo basterà a farle cambiare di Carlo Clericetti (pubblicato su MicroMega il 30 settembre 2021) Istruttivi i numeri della Nadef (Nota di aggiornamento al documento di economia e finanza). C’è da rallegrarsi per quella crescita al 6% che supera non di poco le precedenti previsioni, certo. Ma soprattutto si farebbe bene a meditare su quello che ci dicono rispetto alle politiche del passato e alle regole europee di bilancio che le hanno guidate. Il governo prevede dunque per quest’anno una crescita del 6%, con deficit di bilancio altissimo, il 9,4%. Accipicchia, ma ce lo possiamo permettere con quel debito pubblico che nel 2020 è arrivato al 155,6% del Pil? Dove arriverà quest’anno? E il prossimo? Beh, quest’anno scenderà, e il prossimo pure. Sono sempre i numeri della Nadef a dircelo. Per quest’anno è stimato al 153,5, per il prossimo al 149,4. Merito di un forte surplus di bilancio? Macché: nel 2022 il deficit sarà ancora del 5,6%, nel 2023 del 3,9 (e il debito scenderà ancora, al 147,9). Può stupirsene solo chi dimentica che stiamo parlando di un rapporto: non del debito in cifra assoluta (che continuerà a salire), ma del suo rapporto con il Pil. Se il denominatore (il Pil) cresce più del numeratore (il debito), il rapporto ovviamente diminuisce. E come mai avviene questo? Perché la spesa pubblica spinge l’economia, con buona pace degli “austeritari”. Certo, c’è un altro fattore fondamentale e sono gli acquisti di titoli della banca centrale, che tengono basso il costo del debito. E’ quello che ci è mancato per un paio di decenni, il lunghissimo periodo – iniziato nel lontano 1992 – in cui la spesa pubblica è sempre stata inferiore alle entrate, indebolendo la crescita, ma il debito aumentava lo stesso perché la spesa per interessi era molto elevata. Il finanziamento monetario del debito non è uno strumento che possa essere usato alla leggera né indefinitamente. Avviene quando la banca centrale stampa moneta per finanziare la spesa pubblica oppure sottoscrive i titoli emessi dal Tesoro. Se è usato a sproposito può avere effetti negativi sul valore esterno della moneta (cioè sul cambio), sulla bilancia dei pagamenti, sull’inflazione. Ma è, appunto, uno strumento di politica economica, che in determinate situazioni può essere necessario usare. L’Italia vi ha rinunciato definitivamente aderendo al Trattato di Maastricht e all’euro. La Banca d’Italia è diventata parte del sistema europeo delle banche centrali che formano la Bce, a cui il Trattato fa esplicito divieto di finanziare gli Stati. Per di più la politica di bilancio veniva ingabbiata nei famosi parametri, resi più stringenti e pervasivi dal 2012, nel corso della precedente grande crisi. In pratica, come negare una bottiglia di vino a un assetato nel deserto sostenendo che il vino fa male. Certo che troppo vino fa male: ma far morire di sete è un’alternativa demenziale. Ci voleva la tragedia della pandemia per fare carta straccia di quel paradigma economico insensato. Tutto l’impianto del Trattato di Maastricht e successive follie è stato gettato alle ortiche. Niente limiti al deficit, un primo abbozzo di debito comune europeo, e soprattutto si finge di prender per buona la giustificazione che la Bce acquisti titoli pubblici per combattere la deflazione – il che in parte è vero – mentre di fatto sta finanziando le spese degli Stati, come del resto tutte le altre banche centrali. I risultati, come si vede, sono buoni. Basteranno a far archiviare definitivamente il paradigma economico di Maastricht, che, bisogna ricordarlo, al momento è solo sospeso? Non è detto. Che certe idee siano sbagliate può non essere un motivo sufficiente per abbandonarle, se sono ritenute funzionali a chi ha un peso politico maggiore. La prossima riforma delle regole europee di bilancio chiarirà se la lezione è stata sufficiente o se si vuole continuare su una strada il cui esito non può che alimentare i populismi e produrre una involuzione della democrazia in senso sempre più autoritario. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f1239233e', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f12392391', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink Navigazione articolo ← Forti e persistenti segnali keynesiani dagli Stati Uniti Il Nobel all’economista che ha scoperto che il salario minimo non crea disoccupazione → Un commento su “Anche Draghi lo certifica: per ridurre il debito pubblico bisogna aumentare il deficit” TUMINI MICHELANGELO 3 ottobre 2021 alle 00:27 L’opinione espressa e praticata da Draghi in correlazione con il pensiero keynesiano, finalmente è operativo e sopratutto accettato, ma senza un’azione di politica fiscale imperniata sui principi dell’art.53 della nostra Costituzione attuati in modo coerente con le riflessioni dei costituenti Scoca-Ruini che contribuirono a scrivere il menzionato articolo, ma che è completamente non applicato tanto che le disuguaglianze prodotte possono essere ridotte soltanto abrogando le circa 860 leggi emanate dopo la legge 825/71 e predisponendo una Riforma Tributaria basata su un nuovo patto sociale e fiscale. Un’idea progetto che sottopongo ai lettori lo si può trovare sul sito dell’Associazione art.53 Scoca-Ruini http://www.art.53.it. I commenti sono chiusi."
