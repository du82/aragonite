full_description = "Global #Covid19: per 95% economisti quarantena ha priorità sul PIL. Zingales: “3 volte il PIL prezzo accettabile per salvare milioni di vite” Di keynesblog 5 aprile 2020 12 commenti Mentre in Italia, a fronte di 15mila morti accertati e di un tassi di contagio che rimane ancora preoccupante, c’è chi già pensa a riaprire tutto, negli Stati Uniti gli economisti hanno le idee ben chiare su come affrontare la situazione: il lockdown va perseguito fino in fondo, anche a costo di una contrazione del […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f17d27377', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); La crisi del #Covid19 è l’occasione per ripensare il capitalismo Di keynesblog 24 marzo 2020 5 commenti di Mariana Mazzucato da The Guardian (trad. Keynesblog.com) Viviamo una crisi di portata mondiale. La pandemia di Covid-19 si sta rapidamente diffondendo in tutti i paesi, con una scala e una gravità che non si vedono dalla devastante influenza spagnola del 1918. A meno che non venga intrapresa un’azione coordinata globale per contenerla, il contagio […] Guido Rossi e la lezione di Keynes Di keynesblog 22 agosto 2017 1 Commento Ieri è morto a 86 anni Guido Rossi, una delle personalità più rilevanti del panorama giuridico ed economico italiano. Alcuni anni fa Rossi pubblicò un saggio a commento di “Possibilità economiche per i nostri nipoti” di John Maynard Keynes (Adelphi 2009, pagg. 52, euro 5,50) la cui sintesi proponiamo di seguito. La Cina, il capitalismo di Stato e la crisi del Washington Consensus Di keynesblog 12 gennaio 2017 22 commenti Chi avrebbe mai scommesso sulla capacità di tenuta delle ricette “neoliberiste” propugnate dal Washington Consensus a quasi dieci anni dall’inizio della crisi economica più grave dopo quella del ’29, che tiene ancora nella morsa gran parte delle economie occidentali? Non molti, pensiamo, ma sta di fatto che la crisi è tuttora trattata come un accidente […] Bill Clinton, il liberista Di keynesblog 16 Maggio 2016 6 commenti Hillary Clinton ha annunciato che, se eletta presidente, incaricherà suo marito Bill di “rivitalizzare l’economia”. Ecco perché non si tratta di una buona scelta. Tratto da “La battaglia contro l’Europa” di Thomas Fazi e Guido Iodice La politica economica di Bill Clinton ha seminato il futuro disastro (e Hillary vuole imitarla) Di keynesblog 3 febbraio 2016 2 commenti Sotto la presidenza di Bill Clinton si crearono le condizioni che hanno portato alla crescita delle bolle e del debito privato, mentre i salari rimanevano stagnanti e i lavoratori perdevano potere contrattuale nel mercato del lavoro. E Hillary intende seguire l’esempio del marito. di Robert Pollin, Political Economy Research Institute, University of Massachusetts, Amherst Piangi per te, Argentina Di keynesblog 23 novembre 2015 3 commenti Con la vittoria di Mauricio Macri alle presidenziali argentine, si conclude il lungo regno dei Kirchner e dei peronisti di sinistra. Un bilancio su questa esperienza è complicato: successi fino al 2008 e cattiva gestione della crisi dopo il 2008. [Video] Joseph Stiglitz: “Non firmate il TTIP” Di keynesblog 30 ottobre 2015 4 commenti Sottrarre la democrazia al controllo dei creditori Di keynesblog 9 settembre 2015 9 commenti Un gruppo di eco­no­mi­sti di fama inter­na­zio­nale ha fir­mato un appello affin­ché i Paesi Mem­bri dell’Unione Euro­pea votino, durante l’Assemblea Gene­rale dell’ONU del 10 set­tem­bre, a favore di una riso­lu­zione per la gestione demo­cra­tica dei debiti sovrani, affin­ché le sorti dei Paesi inde­bi­tati ven­gano sot­tratte al mer­cato dei debiti, come nel caso dell’Argentina prima e della Gre­cia poi. Le svalutazioni servono a poco o nulla Di keynesblog 8 aprile 2015 74 commenti Da circa due anni su questo blog stiamo cercando di far passare un messaggio molto semplice: se il mondo non compra, svalutare serve a poco. E questo implica sia che la svalutazione dell’euro non tirerà il nostro paese fuori dalle secche né che un’eventuale nuova moneta italiana svalutata servirebbe a darci la domanda necessaria alla […] Navigazione articolo ← Articoli più vecchi"
