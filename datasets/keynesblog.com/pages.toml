["https://keynesblog.com/2012/02/24/anche-la-commissione-ue-finalmente-scopre-la-recessione"]
title = "Anche la Commissione UE finalmente scopre la recessione | Keynes blog"
description = "Guerra di cifre tra le previsioni di crescita per l’Europa, diffuse ieri dalla Commissione e quelle (precedenti) del Fondo Monetario Internazionale. A fronte di un arretramento del lo 0.3% stimato dalla prima, il secondo aveva infatti previsto una contrazione dello 0,5% . Sta di fatto che, in ogni caso, si è passati da valutazioni (del…"
full_description = "Anche la Commissione UE finalmente scopre la recessione Pubblicato da keynesblog il 24 febbraio 2012 in Europa, Italia, Lavoro Guerra di cifre tra le previsioni di crescita per l’Europa, diffuse ieri dalla Commissione e quelle (precedenti) del Fondo Monetario Internazionale. A fronte di un arretramento del lo 0.3% stimato dalla prima, il secondo aveva infatti previsto una contrazione dello 0,5% . Sta di fatto che, in ogni caso, si è passati da valutazioni (del novembre scorso) che attestavano una stagnazione dell’economia europea, a valutazioni che ne sanciscono l’inequivocabile recessione. Tutto questo avviene nel mentre che la medesima Europa ha varato il cosiddetto “fiscal compact” con i quali sono stati stabiliti i dettami di una “prussiana” disciplina di bilancio, e nel mentre imperversa la crisi della Grecia , che l’assai la discutibile gestione a livello comunitario sta trascinando su versanti molto pericolosi. Ne avevamo già parlato: i dati forniti dall’UE risultano sistematicamente troppo ottimisti rispetto alla situazione reale, cosicché l’austerità imposta ai paesi deboli viene costantemente sottovalutata nei suoi effetti macroeconomici. I princìpi di austerità fiscale continuano a segnare il passo della politica europea, mentre continua a sopravvivere una Banca Centrale “in cerca d’autore”, e che non può assolvere al compito di prestatore di ultima istanza che dovrebbe legittimarne il ruolo. Non è un caso, pertanto, che nel fornire al massimo dettaglio le cifre di tale contesto, il sole 24 ore tenga a precisare che iniziano a levarsi anche significative voci di dissenso attorno alle rigide linee guida di gestione della crisi impartite da Bruxelles. Ma c’è qualcosa di molto profondo e strutturale che agita le acque europee, e che fa risaltare l’insufficienza di tutta “l’impalcatura” su cui l’Unione è costruita (assenza di unione economica) e che le politiche di austerity non possono che peggiorare. Ce lo esprime in maniera forte e chiara Kemal Dervis in un altro editoriale del 24 ore: “Ora appare evidente come l’importante sfida a carico dell’Eurozona sia riconducibile al fatto che l’unione monetaria non si accompagni a un’unione economica – un fenomeno senza equivalenti nel mondo. Di conseguenza, le divergenze riscontrate in questo periodo in termini di costi di produzione non possono essere compensate dagli aggiustamenti sul tasso di cambio. In assenza di un’elevata inflazione nei Paesi in surplus (almeno al 4% l’anno), l’aggiustamento fa sì che la deflazione nei Paesi in difficoltà produca un calo notevole dei costi di produzione. In pratica, tale deflazione può essere raggiunta solo a fronte di un elevato tasso di disoccupazione e di malcontento sociale. Non è quindi chiaro se l’attuale strategia di austerity e deflazione sia politicamente fattibile, e questo spiega l’enorme incertezza che incombe su tutta Eurolandia.” Nord e Sud d’Europa segnano le principali linee di confine di questi squilibri, mentre Bruxelles si accanisce maggiormente laddove i vincoli alla crescita sono già molto stretti. E’ lo sventurato mondo dei “ Piigs” (Portogallo, Irlanda, Italia, Grecia e Spagna), nel quale già si agita lo spettro ellenico. E che cosa si scopre? Che è in questi paesi che l’accanimento sul mondo del lavoro è più forte – con disegni legislativi che danno mano libera ai licenziamenti – ed è di un vero e proprio “assalto al lavoro” che ci riferisce rassegna.it. E se ciò non bastasse scopriamo, per quel che ci riguarda da vicino, che è proprio l’Italia, con il suo 31% di giovani senza lavoro, a risultare tra i “primi della classe” nelle classifiche della disoccupazione giovanile in buona compagnia con la Spagna (48,7%). Anche le previsioni sulla recessione penalizzano questi paesi. Vorremmo sperare che così non fosse, ma certo che il combinato disposto della crisi, dell’austerity europea e della tendenziale diminuzione della domanda aggregata (già in atto) che potrebbe essere accentuata da politiche di non sostegno all’occupazione, rendono ad oggi assai più credibili le stime del FMI: per l’Italia -2.2% a fronte del -1.3% della Commissione. Articoli: UE pronta a rivedere stime di crescita Il futuro globale della crisi europea Previsioni del Fondo Monetario Internazionale Super-flessibilità in Europa __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f1b938f7f', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1b938fd1', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: Grecia Permalink Navigazione articolo ← Il “pasto gratis” di Keynes Monti, l’esempio irlandese e quello greco →"
