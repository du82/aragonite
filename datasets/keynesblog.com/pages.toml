["https://keynesblog.com/2016/06/01/uno-stimolo-decentralizzato-e-un-nuovo-whatever-it-takes-per-leurozona"]
title = "Uno stimolo decentralizzato e un nuovo “whatever it takes” per l’Eurozona | Keynes blog"
description = 'Il comitato scientifico del think tank Progressive Economy ha premiato ieri a Bruxelles il paper "Why further integration is the wrong answer to the EMU’s problems: the case for a decentralised fiscal stimulus" [la versione preliminare è scaricabile da questo link] di Thomas Fazi (eunews.it/oneuro) e Guido Iodice (Keynesblog.com), quale vincitore del Call for Papers 2016 nella…'
full_description = "17 commenti Uno stimolo decentralizzato e un nuovo “whatever it takes” per l’Eurozona Pubblicato da keynesblog il 1 giugno 2016 in consigliati, Economia, Europa, ibt, segnalazioni Il comitato scientifico del think tank Progressive Economy ha premiato ieri a Bruxelles il paper “Why further integration is the wrong answer to the EMU’s problems: the case for a decentralised fiscal stimulus” [la versione preliminare è scaricabile da questo link] di Thomas Fazi (eunews.it/oneuro) e Guido Iodice (Keynesblog.com), quale vincitore del Call for Papers 2016 nella categoria “Reforming the Economic and Monetary Union”. L’articolo nella sua versione definitiva verrà pubblicato nel prossimo numero del Journal for a Progressive Economy. Pubblichiamo qui un post, apparso sul blog Econopoly del Sole 24 Ore, che espone in sintesi il contenuto del paper premiato. Fazie e Iodice sono gli autori del volume “La battaglia contro l’Europa” di recente pubblicazione. di Guido Iodice e Thomas Fazi In un precedente articolo pubblicato da Econopoly abbiamo evidenziato la necessità di un doppio canale per rilanciare gli investimenti e la domanda in Europa e, lasciandoci alle spalle la crisi, garantire la stabilità dell’eurozona. Il canale “federale”, dicevamo, consiste in una “unione degli investimenti” guidata dalla Banca europea degli investimenti e dalla BCE. In questo articolo vogliamo invece mettere in rilievo il canale principale, quello nazionale, decentralizzato, ed avanzare l’idea di un nuovo “whatever it takes” necessario per rendere davvero “irrevocabile la moneta unica per tutti e ciascuno dei suoi membri”, per citare il presidente della BCE Mario Draghi. Uno stimolo fiscale decentralizzato per l’eurozona Sembrerebbe che stia emergendo un consenso, anche in ambito mainstream, sul fatto che la via d’uscita dalla crisi passa necessariamente per una politica fiscale più espansiva e per un consistente aumento degli investimenti pubblici. Come perseguire tale obiettivo alla luce degli attuali vincoli politici e istituzionali dell’eurozona, però? Come abbiamo sottolineato nel nostro libro “La battaglia contro l’Europa”, le proposte impropriamente definite “federali”, come quella di “superministro del Tesoro” – in realtà un ulteriore controllore dei bilanci nazionali – rappresenterebbero un passo inopportuno e dannoso verso la trasformazione definitiva dell’eurozona in una gabbia basata su un sistema di regole ferree e inflessibili. Non è attraverso le “cessioni di sovranità”, accordate negli ultimi anni all’Unione europea, che l’Unione stessa si potrà consolidare, visto che queste stanno avendo non troppo paradossalmente l’effetto di dividere l’Unione, invece che rafforzarla. Chi ha a cuore l’Europa, quindi, dovrebbe proporre una ricetta opposta, quella di una cessione di sovranità verso il basso, dall’Unione verso gli Stati. Vale a dire “rinazionalizzare” la politica fiscale, permettendo ai paesi in crisi – in primo luogo quelli della periferia – di far salire il loro deficit pubblico. Questa è la soluzione caldeggiata, tra gli altri, da Richard Koo, capo economista del Nomura Research Institute, noto soprattutto per la sua teoria della balance sheet recession, o ‘recessione da deterioramento dello stato patrimoniale’. Per balance sheet recession si intende quel fenomeno che si verifica in seguito allo scoppio di una bolla speculativa, quando imprese e privati, avendo accumulato una grande quantità di debiti nel periodo antecedente alla crisi, si concentrano nel riparare la loro situazione patrimoniale danneggiata anziché nel massimizzare i profitti, rifiutando quindi di assumere altro indebitamento per investimenti o spese, anche in presenza di condizioni diventate favorevolissime (tassi zero o addirittura negativi). Questo è esattamente quanto è successo in seguito allo scoppio della crisi dei subprime, sia negli USA che in Europa. Mentre, però, gli Stati Uniti hanno lasciato crescere il loro deficit federale, compensando l’accresciuta propensione al risparmio dei privati, l’Europa è andata nella direzione opposta, esacerbando così la crisi. Quello che sarebbe necessario fare, pertanto, è accomodare il risparmio desiderato dal settore privato, emettendo temporaneamente più titoli di debito pubblico, ed utilizzare il denaro così ottenuto per realizzare gli investimenti pubblici necessari ad innescare una robusta ripresa. Questo non avrebbe alcun costo per paesi come la Germania, perché in Italia (ma lo stesso vale anche per altri paesi della periferia) la liquidità attualmente inutilizzata del settore privato sarebbe più che sufficiente a finanziare l’incremento del deficit. Il settore privato coglierebbe al volo la possibilità di poter parcheggiare i propri risparmi in titoli di Stato, che rappresentano un investimento sicuro e dal rendimento basso, ma garantito, almeno finché i paesi periferici, come stanno facendo, si opporranno alle discutibili richieste di un tetto al possesso dei titoli di stato da parte delle banche. Il problema semmai è un altro: assicurarsi che una parte consistente del risparmio di un paese “debole” resti in quel paese anziché finire in bund. La maniera più semplice suggerita da Koo per ottenere questo obiettivo sarebbe di rinazionalizzare il mercato dei titoli di Stato, proibendo ai residenti di un certo Stato membro di acquistare i titoli di debito pubblico di altri Stati. Si tratta evidentemente di una proposta provocatoria, ma serve a dare un’idea del principio che si vuole affermare. Una versione più soft di questa regola consisterebbe nell’assegnare una penalizzazione all’acquisto di titoli esteri per incentivare i residenti a investire in quelli domestici. Va da sé che la proposta di Koo, sia nella sua versione “hard” che in quella “soft”, si scontra con uno dei pilastri del mercato unico europeo: vale a dire la libertà di movimento dei capitali. A ben vedere, tuttavia, questo principio generale è già stato violato nei casi di Cipro e della Grecia, che hanno introdotto controlli sui movimenti di capitali al fine di non dover abbandonare l’euro. In altri termini, il principio di libertà di movimento assoluta dei capitali si è già dimostrato in contrasto con l’irreversibilità dell’euro “per tutti i suoi membri”. Si tratta quindi di prevedere meccanismi ordinari che permettano di “ammorbidire” i flussi di capitali in entrata e in uscita al fine di stabilizzare la zona euro. Stabilito l’ammontare del deficit consentito, occorre decidere quale composizione dovrebbe avere. Una regola pratica in tal senso può configurarsi in questo modo: la Commissione europea continua a mantenere gli attuali criteri di sostenibilità delle finanze pubbliche, ma agli Stati è consentito aggiungere al deficit così calcolato una ulteriore quota destinata esclusivamente agli investimenti pubblici o al finanziamento (parzialmente a fondo perduto) di progetti di investimento dei privati, fino al raggiungimento del deficit previsto dal criterio di Koo. Il motivo per cui occorre privilegiare gli investimenti è che l’esperienza ci ha mostrato che altri deficit rischiano di essere inefficaci se non in parte controproducenti. Una politica di deficit pubblico orientata in prevalenza allo stimolo dei consumi, ad esempio, rischia di aumentare le importazioni piuttosto che aumentare l’output nazionale. È questo probabilmente il caso dell’Italia con il bonus fiscale (i cosiddetti “80 euro”), a partire dal maggio 2014. La BCE e il nuovo “whatever it takes” Questa proposta richiede che i titoli di stato siano effettivamente un asset a zero rischi. Di più: in realtà la sopravvivenza dell’euro stesso lo richiede: il fatto che gli spread tra centro e periferia continuino ad essere sostanzialmente maggiori del periodo pre-crisi (pur a fronte di uno stimolo monetario senza precedenti) e che la Grecia (esclusa dal QE e oggetto di un programma di salvataggio) venga ancora considerata dai mercati a rischio di uscita dall’euro, dimostra che l’OMT e il quantitative easing, in quanto misure di emergenza, potrebbero non essere sufficienti a garantire la permanenza di tutti i membri nell’area euro in caso di nuovi shock. Serve quindi uno strumento permanente che assicuri i mercati circa la “fungibilità della moneta”, sempre per citare Mario Draghi. Poiché i titoli di Stato rappresentano la “materia prima” attraverso la quale la BCE crea moneta e, contemporaneamente, rappresentano l’asset più sicuro su cui le banche possono fare conto, a parte le riserve, i titoli di stato devono essere “garantiti” dalla stessa BCE, così da assicurare la stabilità del sistema finanziario. Questa forma di garanzia è inoltre cruciale in una unione monetaria decentralizzata immaginata in questo articolo, poiché gli Stati devono essere sottratti al giudizio dei mercati circa la loro solvibilità o la loro permanenza nell’unione monetaria. D’altra parte garantire i debiti sovrani significa, in ultima analisi, garantire l’irrevocabilità dell’euro stesso. Questa garanzia può prendere una forma molto semplice, in pieno accordo con il vigente statuto della BCE e i trattati. Essa potrebbe essere annunciata in modo simile al programma OMT: La Banca centrale europea è stata istituita per assicurare l’esistenza stessa della moneta unica. L’esperienza ha dimostrato che i differenziali tra i tassi di interesse sui debiti sovrani nell’eurozona costituiscono un fattore di frammentazione e di potenziale pericolo di rottura dell’area euro. Pertanto, nell’ambito del suo mandato, la BCE farà tutto quanto è necessario al fine di contenere i differenziali dei tassi di interesse entro i 30 punti base per tutti i membri dell’eurozona. Un annuncio di questo genere metterebbe al riparo l’eurozona dalla deflagrazione in modo permanente e inoltre ridurrebbe i tassi di interesse a lungo termine più di quanto il QE è riuscito a fare, assicurando così agli Stati membri finanziamenti a basso costo anche dopo la fine del programma di quantitative easing. L’obiettivo di contenimento degli spread (che ipotizziamo a 30 punti base sulla base dei differenziali pre-crisi) non può essere considerata un’agevolazione, né un finanziamento diretto verso gli Stati, almeno non più di quanto lo sia già il quantitative easing. È, semplicemente, una decisione di pura politica monetaria, atta ad eliminare per sempre i rischi di frammentazione dell’area euro. Si potrebbe sollevare l’obiezione che, in questo modo, la BCE si assumerebbe grossi rischi acquistando titoli di paesi potenzialmente insolventi. Questo è irrilevante per due motivi: in primo luogo, così come accaduto con l’annuncio dell’OMT, è probabile che la BCE non debba mettere effettivamente in atto un ulteriore acquisto di titoli “rischiosi” per ottenere il suo obiettivo. L’annuncio, di per sé, indurrebbe i mercati a portare i tassi di interesse verso il differenziale di 30 punti base. In secondo luogo, la BCE non può fallire; come sottolinea un recente rapporto della stessa BCE: Le banche centrali sono protette dall’insolvenza grazie alla loro capacità di emettere moneta, il che significa che possono anche operare con capitale negativo. A ben vedere la BCE ha un solo modo per fallire: lasciare che un paese esca dall’euro innescando un effetto domino che distruggerebbe la moneta unica. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0df67757', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0df677db', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: bce, euro, Mario Draghi, Unione europea Permalink Navigazione articolo ← Ancora sull’Helicopter Money: Money Rain o Money in a Bottle? Ovvero, Prince o i Police? Salario reale e occupazione: Neoclassici, Neokeynesiani e Keynes → 17 commenti su “Uno stimolo decentralizzato e un nuovo “whatever it takes” per l’Eurozona” Uno stimolo decentralizzato e un nuovo “whatever it takes” per l’Eurozona — Keynes blog | O LADO ESCURO DA LUA 1 giugno 2016 alle 11:26 […] via Uno stimolo decentralizzato e un nuovo “whatever it takes” per l’Eurozona — Keynes blog […] roberto romano 1 giugno 2016 alle 13:04 la proposta è interessante e si aggiunge ad altre iniziative. ricordo che P. Leon, S. Ferrari, D. Palma e il sottoscritto hanno realizzato uno studio per conto della cgil che analizzava tutte proposte in campo finanziario ed economico per aggradire il debito pubblico e rilanciare lo sviluppo. Questa proposta si avvicina ad altre e, giustamente, assegna un peso rilevante agli investimenti pubblici. rimane il problema di struttura relativa agli investimenti. Sebbene siano fondamentali nella contabilità nazionale, la capacità dell’offerta di soddisfare siffatta domanda è un problema molto serio; gli investimenti pubblici non sono diversi da quelli privati sul tema, semmai hanno una responsabilità in più per evitare la forbice tra domanda e offerta di investimenti. faccio riferimento al fatto che gli investimenti pubblici dell’Italia, al netto dell’ultimo periodo – scellerato -, non erano poi così distanti della media europea, come quelli privati, ma non per questo il paese ha mostrato andamenti uguali o simili alla media europea. la proposta è molto interessante, ma sarebbe appena il caso di ricordare che i deficit pubblici e/o la maggiore spesa pubblica non solo devono tenere in tensione la domanda effettiva, ma devono anche guidare la ri-specializzazione della base economica del paese. dobbiamo evitare di non “fare i conti senza l’oste” (A. Graziani). quindi proposta molto utile. ma alcune cose le possiamo comunque realizzare anche dentro i criteri (stupidi) europei. per esempio, perché non agganciare questa maggiore o diversa spesa per industrializzare la ricerca pubblica? ricordo anche che il PIL non è mai uguale a se stesso (Sylos Labini), e quindi occorre indagare cosa si nasconde dentro la scatola nera degli investimenti (Rosenberg). comunque complimenti a tutti e due. buon lavoro romano PS: avrei considerato anche l’analisi di Leon di capitalismo e stato… ma è solo una proposta di lettura utile come quella del vostro libro che, ripeto, ho molto apprezzato. claudio 1 giugno 2016 alle 15:41 “Mentre, però, gli Stati Uniti hanno lasciato crescere il loro deficit federale, compensando l’accresciuta propensione al risparmio dei privati, l’Europa è andata nella direzione opposta, esacerbando così la crisi.”………se mi è consentito credo che il problema sia propio questo (ed è tutto un problema politico) gli usa ma per la verita anche l,inghilterra hanno potuto fare politiche espansive propio in virtu del fatto che A) gli usa sono uno stato federale, mentre gli inglesi hanno goduto di vincoli meno stringenti . per cui obbiettivi politici e economici non erano in contrapposizione come nell,area euro. B) credo "
