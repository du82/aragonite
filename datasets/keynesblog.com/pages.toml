title = "Contatti | Keynes blog"
description = "Keynes Blog - Rassegna di idee per capire la crisi e-mail: maynard [chiocciola] keynesblog [punto] com Facebook: https://www.facebook.com/keynesblog Twitter: https://twitter.com/#!/Keynesblog @keynesblog Google+: https://plus.google.com/b/108448390861949791956/"
full_description = "44 commenti Contatti Keynes Blog – Rassegna di idee per capire la crisi e-mail: maynard [chiocciola] keynesblog [punto] com Facebook: https://www.facebook.com/keynesblog Twitter: https://twitter.com/#!/Keynesblog @keynesblog Google+: https://plus.google.com/b/108448390861949791956/ __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f1cc0944c', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1cc094b8', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... 44 commenti su “Contatti” daniele 12 marzo 2012 alle 18:36 Rispondi vorrei sottoporre alla vs attenzione una riflessione sul fatto che il cosiddetto libero mercato consiste – nello sviluppo che sta avendo – nel fare fesso da parte di chi vende – prodotti o servizi – chi è più debole e non ha gli strumenti per essere in grado di non accettare prodotti o servizi inutili o dannosi. La paradossale follia è data della totale assurdità nell’estendere il concetto di libero mercato alle prestazioni lavorative (il cosiddetto mercato del lavoro) cosa ne pensate in proposito? Non si conclude in un vantaggio per i soliti potenti? giovanna bonfili 21 aprile 2012 alle 20:02 Rispondi Perché non si menziona il fenomeno del signoraggio?…oppure mi è sfuggito durante la lettura?Non credo che si possa pensare a Keynes senza riprenderci la sovranità monetaria…Inoltre la teoria può funzionare ma su di un tessuto sociale per lo più sano, mentre quello italiano certamente non lo è. Anzi è del tutto malato, tendenzialmente volto alla criminalità, ad atteggiamenti mafiosi che facilitano il potere di corporazioni mafiose. Comunque sono d’accordo con il commento di Daniele…il consumismo e liberismo sono la stessa cosa… andrea 22 dicembre 2013 alle 19:03 Rispondi Ho letto che le teorie di Keynes sono state mainstream presso gli economisti fino agli anni ’70, quando il fenomeno della stagflazione non riusciva ad essere spiegato con le idee dell’economista inglese, per cui c’è stato un ritorno al liberismo classico. Volevo sapere se oggi gli economisti di scuola keynesiana sono riusciti a spiegare la stagflazione. Enzo 23 agosto 2012 alle 11:18 Rispondi premetto che io non sono nè un economista nè tantomeno ho fatto grossi studi in materia, in questi ultimi periodi spesso mi pongo delle domande per le quali non ho risposte, magari Voi che siete più informati potreste darmi delle risposte o magari aiutarmi a capire,: • se il mercato viene regolato dalla legge della domanda e dell’offerta siamo poi così sicuri che non ci sia qualcuno che può condizionare il mercato stesso? • Nel caso che ci sia qualcuno in grado di condizionare il mercato qual’è il ruolo dello Stato sia esso Italia, Germania, Francia, Spagna, Grecia o Unione Europea? • Si parla molto di debito ma questo debito di chi è, ma soprattutto sotto quali forme è stato contratto? • Perché le grosse Corporation non possono fallire? • Se è vero che i Cittadini di uno Stato sono responsabili per il debito pubblico perche gli azionisti delle grandi Corporation non sono responsabili per i danni causati da una cattiva amministrazione? Queste sono alcune delle domande che mi pongo mi piacerebbe se almeno per qualcuna di queste ci fosse una risposta. Arico Maurizio 10 settembre 2014 alle 23:09 Rispondi Ci provo a darti delle risposte : più’ il mercato e’ grande più’ e difficile condizionarlo , Quindi dobbiamo avere grandi mercati per scongiurare il condizionamento. Il debito pubblico si contrae anche finanziando scuole e ospedali che i cittadini usano a costi bassi , oggi in Italia laurearsi costa poco se dovessimo pagare il costo vero sarebbe intorno a 200.000 euro quindi la differenza tra le tasse che si pagano e i circa 200.000 euro sono fatti con spesa pubblica che genera debito pubblico. Gli azionisti se gli amministratori sbagliano non sono responsabili ma ci perdono i soldi delle azioni che hanno comprato . Spero di averti aiutato a capire Saluti cassandro 2 ottobre 2012 alle 16:22 Rispondi il dilemma x uno come me di matrice keynesiana-diciamodi sinistra è capire che fare se il cavallo non ha fame!!!se il sistema si fa beffa degli stimoli e se gli stimoli sono insuffucienti! anzi dannosi,le montagne di carta…mi chiedo se non sia venuto il tempo di considerare il mantra della crescita come una grande minchiata!!! Angelo 5 novembre 2012 alle 14:11 Rispondi Il denaro è uno strumento inventato dall’uonìmo per facilitare scambi di qualsiasi natura. Nel momento in cui al denaro gli si conferisce più potere del suo stesso inventore (l’uomo) , accade quello che sta accadendo. Banche tradizionali, banche centrali, multinazionali ecc., si sono dotati di notai internazionali chiamati anche camere internazionali di compensazione per spostare somme di denaro. Ora se noi pensiamo che queste cosìdette stanze di compensazione trattano cifre in misura di diverse decine di trilioni di dollari (cifre a dodici zeri) e il pil mondiale nel 2011 si aggirava intorno gli 80 trilioni si capisce che per invertire questo senso di marcia bisogna fare nuovi tipi di discorsi. Quando li sentiremo potremmo dire che abbiano alzato la freccia per una possibile inversione. Giorgio 29 marzo 2013 alle 17:05 Rispondi se io (ma anche una banca) emettessi banconote di Euro false, sarei arrestato e condannato. Se una banca l’emette titoli, titoli di fondi con proproieta di altri titoli, derivati di altri titoli e titoli con scommesse sul valore dei titoli sottostanti tutto è regolare. Tutti questi prodotti, sono lontani sempre più da un valore tangibile ed il cui prezzo si basa sul ciò che gli si attribuisce quando li si scambia. n questo colglierei un parallelo con un biglietto di euro falso che mantiene il suo valore di scambio, sino a che non ci si accorge, che dietro a quel pezzo di carta colorato non c’è un valore. E’ la finanza,baby! Non capisco ma mi adeguo. Però perchè, quando il sistema bancario fa casini giocherellando con quei titoli finanziari, si corre a requisire soldi veri (come in uesti giorni a Cipro) e non si ferma invece il commercio della carta senza valore ed i”falsari” non vanno in galera? rapisarda salvatore 30 agosto 2013 alle 22:06 Rispondi Vorrei segnalare al Professore ed a quanti abbiano la voglia di spiegarmi cosa è successo una semplice domanda come si è riusciti a ridurre la Grecia in queste condizioni da disastro umanitario concedendole aiuti per una somma quasi pari al suo debito pubblico 240 miliardi su 300? E perchè nessuno risponde di questo risultato da “nobel all’incontrario”? Casimiro Corsi 31 agosto 2013 alle 09:21 Rispondi Quello che serve a chi crea denaro dal nulla, BCE una banca privata, e’ creare sempre piu’ debito irredimibile per rendere schiave le nazioni!!!! La Grecia e’ la prima di una lunga serie. luigi fressoia 24 novembre 2013 alle 14:09 Rispondi Luigi Fressoia 23 novembre 22.46.34 HO SPEDITO QUESTA LETTERINA AI GIORNALI Gentile direttore, che sconforto l’arroganza dei bravi ferrotranvieri di Genova. Proprio quei signori, moltiplicati per mille e diecimila in tutt’Italia, sono il problema, la crisi, lo sfacelo dei conti pubblici. Sono queste categorie al riparo del mercato che da quarant’anni mercè il banditismo sindacale hanno preteso assunzioni esagerate, dirigenze irresponsabili, trattamenti svincolati da ogni economia aziendale, gestioni improntate ad abusi, collusioni, clientelismo, voto di scambio, concussione, corruzione e soprattutto sprechi, costi gonfiati due, tre, dieci volte il prezzo vero. Nessun giornale, nessun politico ha il coraggio della verità: questi signori scioperanti ad oltranza, dopo aver prosciugato le casse della nazione, strillano e fanno rivoluzione per continuare l’abuso e il privilegio; “nessun privato e solo pubblico” strillano senza pudore, e lo credo bene, nessuna azienda vera sopporterebbe il loro peso parassitario. “Solo pubblico” è l’arroganza e la pretesa di continuare sulle spalle di chi lavora sul serio, continuare foss’anche fino al tracollo. Misera Italia: invece di rivoltarsi i dipendenti del settore privato e le partite iva (gli sfruttati di oggi), sono i parassiti a minacciare rivoluzione! Grillo -applauditissimo- ha detto che “l’azienda è di chi ci lavora”, benissimo, prendiamoli in parola: proprio perché è vostra provvedete da soli a procuravi lo stipendio coi biglietti venduti e non certo coi nostri soldi (degli enti pubblici), sarebbe esattamente la miglior soluzione liberale. Luigi arch Fressoia pg, archifress@tiscali.it 339.1089814 renzo 19 Maggio 2014 alle 15:50 Rispondi tante parole e poi una volta fatto il versamento non si e’ piu fatto sentire qualcuno lo conosce ???? nuova crisi economica.. 27 giugno 2014 alle 14:03 Rispondi spero di essere nel posto giusto: Vorrei l’opinione di un economista riguardo allo scoppio della probabile bolla speculativa immobiliare cinese.Sarei preoccupato da una nuova crisi economica… Cordiali saluti. Domenico 30 luglio 2014 alle 07:40 Rispondi Ma se usciamo dall euro, il nostro debito potrebbe essere garantito con i beni del patrimonio dello stato, costituendo un fondo , credo che tutto il mondo investirebbe su questo fondo, e non solo una parte potrebbe essere anche garantita dal fondo aureo presso la banca d Italia, quindi ci prendono solo in giro che se usciamo dall euro sarebbe una catastrofe Arico Maurizio 10 settembre 2014 alle 22:58 Rispondi Domanda a proposito del moltiplicatore, ovvero se lo stato spende poi tramite la tassazione ricava i soldi per rifinanziare la spesa , qualcuno mi spiega perché il debito pubblico italiano e anche giapponese continua ad aumentare all’aumentare della spesa pubblica non dovrebbe ridursi o rimanere stabile??? A me sembra che l’idea del molti autore sia come quel tizio che caduto nelle sabbie mobili pensa di uscirne tirandosi egli stesso per i capelli!!! Saluti marco remondini 30 settembre 2014 alle 14:01 Rispondi Keynes aveva ragione nel mondo degli anni ’30. Oggi i suoi ragionamenti mancano di due variabili essenziali: 1° i beni che sono ritenuti essenziali nel nostro stile di vita sono prodotti in gran parte all’estero. 2° la produzione della ricchezza di cui sopra si è spostata dall’occidente al far-est. Per questi motivi tutte le soluzioni da lui proposte rischiano di essere una banale partita di giro. marco remondini 30 settembre 2014 alle 16:36 Rispondi Vorrei aggiungere che l’economia aggregata e cioè (in pratica) PIL-importazioni non è valida dal momento che non si batte più moneta autonoma (varebbe per l’Europa se fosse un’unione compiuta) ma ogni euro negativo di esportazioni-importazioni aumenta il deficit complessivo del Paese. Ciò sarebbe trascurabile solo se fosse minore od uguale a quello del Paese più forte (cioè la Germania). Ruben Adebayor 20 aprile 2015 alle 08:17 Rispondi Una domanda, come è possibile che una persona con un cud da 6000€ e un auto di 7 anni fa facendo l’isee si ritrovi un reddito di 11000? sommano all’importo del cud il valore dell’auto? Fatemi sapere Grazie stella 23 novembre 2015 alle 22:33 Rispondi Il y a longtemps je suis à la recherche d’un prêt entre particuliers ; aujourd’hui je l’ai eu grace à la caisse d’entraide et de solidarité . Ils m’ont offert un prêt de 1.500.000,00$ pour relancer mon industrie de bois . Contactez les et vous serez servis si votre projet est rentable : stelladupure@gmail.com veta01 30 novembre 2015 alle 17:54 Rispondi Sou enfermeira de profissão e após ter-se divorciado com o meu marido solicitei empréstimos junto numerosos de bancos para refazer-me mas rejeitaram-me e decidi encontrar um prestamista específico que poderia fazer-me este empréstimo. Infelizmente para mim, aquando da minha investigação, caí sobre vigaristas que se faziam passar para prestamis