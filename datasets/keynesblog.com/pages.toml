["https://keynesblog.com/2012/02/23/siamo-tutti-greci"]
title = "Siamo tutti greci | Keynes blog"
description = "C’è da chiedersi davvero se, stante l’attuale situazione della Grecia, l’Europa abbia coscienza del suo ruolo e, in primo luogo, se chi, come la Germania, pensa di esprimere una leadership, abbia davvero contezza di che cosa ciò voglia significare. Sono tutti interrogativi leciti, questi, all’indomani della decisione di accordare alla Grecia il secondo prestito e…"
full_description = "Siamo tutti greci Pubblicato da keynesblog il 23 febbraio 2012 in Europa C’è da chiedersi davvero se, stante l’attuale situazione della Grecia, l’Europa abbia coscienza del suo ruolo e, in primo luogo, se chi, come la Germania, pensa di esprimere una leadership, abbia davvero contezza di che cosa ciò voglia significare. Sono tutti interrogativi leciti, questi, all’indomani della decisione di accordare alla Grecia il secondo prestito e a seguito dell’ulteriore declassamento del debito dello stato ellenico confermato a stretto giro. E non sembrano esserci parole più efficaci di quelle usate da Guido Rossi sul Sole 24 ore del 19 febbraio scorso, per definire i contorni di tutta la situazione. “Una danza macabra” è quella che si sta consumando intorno al default di Atene, Rossi non ha dubbi. “La danza, a parer mio, è macabra, poiché da troppo tempo continua inutilmente mentre la stessa Grecia sta via via affondando in una economia senza prospettive e in una politica con provvedimenti di austerity” precisa Rossi. “La verità è che l’Europa è la Grecia” prosegue Rossi “noi siamo la Grecia, noi siamo – ci piaccia a volte e altre no – l’Europa. Infatti, in caso di default greco è già stata ampiamente rilevata l’influenza nefasta che esso avrebbe sull’intero sistema creditizio dell’eurozona, ad incominciare proprio dalle banche tedesche e francesi. Invece, in caso di salvataggio ulteriore della Grecia, le previsioni sulla sua crescita sono talmente negative che il suo PIL degli anni futuri sarà non superiore a quello di paesi in via di sviluppo, ma senza alcuna prospettiva. Ci saranno allora in Europa uno o più paesi arretrati con la stessa sovranità limitata, con la stessa moneta, con le stesse autorità monetarie. Ancora una volta noi saremo la Grecia e l’Europa sarà la Grecia.” E non tarda a rincarare la dose il giorno successivo su Repubblica Marcello De Cecco: “Come possa tutto questo giovare alla ripresa della economia europea e mondiale, i fustigatori della Grecia e, indirettamente, anche dell‘Italia, ce lo devono spiegare. Se dobbiamo credere al Fmi ma anche al nostro governo e naturalmente a quelli dei paesi “virtuosi”, una spinta positiva alla crescita verrà dall’effetto di misure di liberalizzazione dei mercati. Tutti sanno, però, che tali effetti si dispiegano, se pure lo fanno, nel medio termine, mentre a breve funzionano solo le misure keynesiane di rilancio della domanda interna o gli effetti sul commercio estero di una svalutazione, in questo caso dell’euro, se import e export rispondono nella maniera canonica alla variazione del cambio. Nel caso della Grecia quest’ultima ipotesi trova molto scetticismo, per la scarsa capacità di penetrazione delle merci greche, tranne qualche rimarchevole eccezione.” Ma soprattutto “siamo poi certi che Spagna e Italia, i paesi che non possono essere sacrificati, pena lo sfascio del sistema monetario europeo e forse persino di quello mondiale, resterebbero indenni in caso fallisse, in maniera disordinata, la Grecia? A giudicare da come si muovono gli spread ad ogni stormire del vento greco che non sia solo una brezza, c’è da chiederselo.” E quanto potrà ancora durare la luna di miele di Monti con Merkel e Sarkozy, si chiede in ultimo De Cecco. Professore, attento … Leggi l’articolo di Guido Rossi Leggi l’articolo di Marcello De Cecco __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f1b521e2d', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1b521e82', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: Grecia, guido rossi, marcello de cecco Permalink Navigazione articolo ← A proposito di articolo 18: breve storia delle lamentele dei datori di lavoro Il “pasto gratis” di Keynes →"
