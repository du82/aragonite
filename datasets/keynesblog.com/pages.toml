full_description = "Libri Come Mario Draghi ha salvato l’euro Di keynesblog 19 settembre 2020 4 commenti di Francesco Saraceno, tratto da “La Riconquista”, Ed. Luiss Quando Mario Draghi ha lasciato la testa della BCE, nel novembre del 2019, su una cosa i molti estimatori e i pochi detrattori del presidente della BCE si sono trovati d’accordo: durante gli otto anni in cui ha condotto la politica monetaria dell’Eurozona, l’ex governatore della Banca d’Italia […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1937dd4c', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Alessandro Roncaglia, “L’età della disgregazione. Storia del pensiero economico contemporaneo” Di keynesblog 14 marzo 2019 1 Commento Alessandro Roncaglia, L’età della disgregazione. Storia del pensiero economico contemporaneo, Laterza 2019. Pubblichiamo la presentazione dell’autore tenuta presso l’Accademia Nazionale dei Lincei, marzo 2019 Link per acquistare il libro su IBS Il libro che vi presento arriva in libreria in questi giorni, dopo una lunga (e faticosa) fase di gestazione. Si intitola L’età della disgregazione […] A lezione da Keynes, ripensando la macroeconomia. Recensione de “La scienza inutile” di F. Saraceno Di keynesblog 5 dicembre 2018 2 commenti Francesco Saraceno La scienza inutile: Tutto quello che non abbiamo voluto imparare dall’economia Luiss University Press (2018) https://www.luissuniversitypress.it/pubblicazioni/la-scienza-inutile Recensione di Daniela Palma Tra le conseguenze della crisi che ormai da un decennio sta attraversando l’economia mondiale, non si contano solo fallimenti finanziari e una diffusa stagnazione delle attività produttive. Lo stupore con cui la regina […] L’austerità espansiva e i suoi oppositori Di keynesblog 25 gennaio 2018 1 Commento Austerity vs Stimulus: The Political Future of Economic Recovery, a cura di Robert Skidelsky e Nicolò Fraccaroli, Palgrave Macmillan, 178 pagine: http://www.palgrave.com/de/book/9783319504384 L’austerità ha fallito ed è tempo di bilanci. Ma è soprattutto giunto il momento di chiedersi perché, nonostante le politiche di restrizione fiscale abbiano sortito effetti più che negativi sul corso della […] Le illusioni dell’economia dell’equilibrio Di keynesblog 16 gennaio 2018 2 commenti Pubblichiamo la prefazione di Paolo Leon al libro Squilibrio – Il labirinto della crescita e dello sviluppo capitalistico di Roberto Romano e Stefano Lucarelli. Ediesse Libri di Paolo Leon L’economia come scienza compiuta, quando, pur differenziate, le ricerche riposavano su un apparente solido terreno comune, è stata travolta dalla crisi iniziata a settembre 2007. Al […] L’euro è una cosa troppo seria per lasciarla in mano ai soliti europeisti (e ai noeuro) Di keynesblog 20 novembre 2017 5 commenti Nell’identificazione tra moneta unica e politiche liberiste sguazzano i no euro ma anche i fautori dello status quo. Entrambi, l’un contro l’altro armati, fanno finta di non vedere che il problema non è la moneta unica, ma il clima intellettuale che domina in Europa. Idee per cambiare finalmente direzione senza far saltare il continente, in […] Guido Rossi e la lezione di Keynes Di keynesblog 22 agosto 2017 1 Commento Ieri è morto a 86 anni Guido Rossi, una delle personalità più rilevanti del panorama giuridico ed economico italiano. Alcuni anni fa Rossi pubblicò un saggio a commento di “Possibilità economiche per i nostri nipoti” di John Maynard Keynes (Adelphi 2009, pagg. 52, euro 5,50) la cui sintesi proponiamo di seguito. La politica economica al tempo della crisi: da Keynes alla controrivoluzione monetarista e (non) ritorno Di keynesblog 23 Maggio 2017 7 commenti di Amedeo Di Maio e Ugo Marani Il lavoro che segue costituisce uno stralcio dell’Introduzione al volume Politiche economiche e crisi internazionale. Uno sguardo sull’Europa, curato da Amedeo Di Maio e Ugo Marani con contributi di Paul De Grauwe, Amedeo Di Maio, Pasquale Foresti, Guglielmo Forges Davanzati, Nicolò Giangrande, Ernesto Longobardi, Antonio Lopes, Ugo Marani […] Breve storia del pensiero economico – di Alessandro Roncaglia Di keynesblog 23 gennaio 2017 1 Commento In “Economisti che sbagliano- Le radici culturali della crisi” Alessandro Roncaglia affermava nel 2010 che la crisi economica che stiamo ancora vivendo non è comparabile (come si vorrebbe far credere) a un evento iscritto nell’ “ordine naturale delle cose”, ma il prodotto di valutazioni e di scelte di politica economica guidate da una precisa “visione […] La Cina, il capitalismo di Stato e la crisi del Washington Consensus Di keynesblog 12 gennaio 2017 22 commenti Chi avrebbe mai scommesso sulla capacità di tenuta delle ricette “neoliberiste” propugnate dal Washington Consensus a quasi dieci anni dall’inizio della crisi economica più grave dopo quella del ’29, che tiene ancora nella morsa gran parte delle economie occidentali? Non molti, pensiamo, ma sta di fatto che la crisi è tuttora trattata come un accidente […] Navigazione articolo ← Articoli più vecchi"
