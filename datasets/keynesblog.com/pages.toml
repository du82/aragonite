full_description = "Lavoro Il Nobel all’economista che ha scoperto che il salario minimo non crea disoccupazione Di keynesblog 14 ottobre 2021 Sin dalla nascita di Keynes Blog ci siamo occupati di salario minimo e di come sia falsa l’idea mainstream che riduca l’occupazione. Il Nobel per l’Economia di quest’anno è stato assegnato tra gli altri a David Card, uno dei due economisti che per primi hanno studiato, sperimentalmente, gli effetti del salario minimo (l’altro, Alan Krueger, […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f190592de', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Basta salari da fame: le ragioni del salario minimo Di keynesblog 10 dicembre 2019 1 Commento Da molti anni su Keynes blog proponiamo l’introduzione del salario minimo legale. In questo articolo apparso su Etica ed Economia, Marta e Simone Fana illustrano la drammatica situazione dei salari italiani e criticano le posizioni contrarie a questa ormai improrogabile riforma. di Marta Fana e Simone Fana, da eticaeconomia.it La rivoluzione tech non spiega i bassi salari italiani Di keynesblog 19 dicembre 2017 6 commenti Secondo la teoria mainstream i cambiamenti tecnologici (e la globalizzazione) hanno contribuito alla polarizzazione del mercato del lavoro in cui gli strati più bassi della piramide hanno sempre più difficoltà a inserirsi o, una volta inseriti, sono condannati a salari e condizioni di lavoro meno edificanti. I lavoratori capaci di integrarsi o essere integrati in […] Il fallimento del Jobs Act: finiti gli incentivi rimangono voucher e precariato Di keynesblog 29 agosto 2016 5 commenti di Marta Fana da Il Manifesto del 26.8.2016 Sono impietosi gli ultimi dati dell’Osservatorio sul precariato dell’Inps: si assiste a un crollo dei contratti a tempo indeterminato, bilanciato da un aumento dei contratti a termine e di un sempre più diffuso utilizzo dei voucher. Aumentare l’età pensionabile è un costo per il Paese Di keynesblog 24 agosto 2016 7 commenti Aumentare l’età pensionabile ha due effetti molto ovvi: il primo è che toglie lavoro ai più giovani; il secondo è che riduce la produttività dell’economia. Queste due ovvie conclusioni sembrano essere incomprensibili per molti economisti, ma è esattamente ciò che sta succedendo. Il costosissimo flop delle decontribuzioni Di keynesblog 19 aprile 2016 5 commenti Marta Fana e Michele Raitano si propongono di stimare quanto inciderà sul bilancio pubblico la decontribuzione sul costo del lavoro prevista dalla Legge di Stabilità per il 2015. A questo scopo, essi formulano diverse ipotesi su variabili rilevanti fini del calcolo, come la durata media dei nuovi contratti e la distribuzione delle retribuzioni. La conclusione […] Immigrazione e neoliberismo Di keynesblog 31 marzo 2016 20 commenti Perché i paesi occidentali adottano politiche restrittive sull’immigrazione ma poi non le applicano? La risposta la fornisce Milton Friedman. Pensioni e lavoro, le riforme che faranno male al paese Di keynesblog 2 dicembre 2015 17 commenti Il presidente dell’Inps, l’economista Tito Boeri, ha lanciato ieri un allarme inquietante: i nati nel 1980 dovranno lavorare fino a 70-75 anni e godranno di pensioni più basse rispetto a quelle attuali: il 25% in meno, considerando tutto l’arco di vita pensionistica, che grazie all’innalzamento dell’età pensionabile si accorcerà significativamente. Boeri ha anche aggiunto che per […] La disoccupazione in Italia: una carenza di flessibilità o di domanda aggregata? Di keynesblog 21 ottobre 2015 6 commenti di Lorenzo Testa e Antonella Stirati, da economiaepolitica.it Il tasso di disoccupazione italiano continua ad essere a livelli molto elevati, e negli ultimi anni ha raggiunto i massimi storici da quando l’Istat ne effettua la rilevazione. Il governo d’altra parte continua a cercarne la cura nella riduzione delle tutele e diminuzione del costo del lavoro. Il […] Renzi, la disoccupazione giovanile e il sindacato Di keynesblog 12 ottobre 2015 1 Commento di Guglielmo Forges Davanzati * Il tasso di disoccupazione giovanile, che riguarda individui di età compresa fra i 15 e i 24 anni, ha raggiunto, nell’ultima rilevazione ISTAT di giugno, il 44,2%, in aumento di 1,9% rispetto al mese precedente, raggiungendo il livello più alto dal primo anno di stima (il 1977). La rilevazione esclude […] Navigazione articolo ← Articoli più vecchi"
