["https://keynesblog.com/2016/09/09/microfondazioni-e-macrosciocchezze"]
title = "Microfondazioni e macrosciocchezze | Keynes blog"
description = 'Da quando Robert Lucas espose la sua famosa "critica" ai modelli keynesiani, gli economisti si sono convinti che i modelli economici debbano essere necessariamente "microfondati", cioè costruiti sulla base del comportamento dei singoli agenti economici. In realtà, presa di per sé, la critica di Lucas è un consiglio che chiunque dovrebbe accettare: i modelli macroeconomici…'
full_description = "16 commenti Microfondazioni e macrosciocchezze Pubblicato da keynesblog il 9 settembre 2016 in consigliati, Economia, Teoria economica Da quando Robert Lucas espose la sua famosa “critica” ai modelli keynesiani, gli economisti si sono convinti che i modelli economici debbano essere necessariamente “microfondati”, cioè costruiti sulla base del comportamento dei singoli agenti economici. In realtà, presa di per sé, la critica di Lucas è un consiglio che chiunque dovrebbe accettare: i modelli macroeconomici dovrebbero tenere conto del fatto che, se accade qualcosa di nuovo, vi sarà una reazione del sistema economico che potrebbe assorbire o moltiplicare l’effetto dell’evento. In particolare, secondo Lucas, i modelli dovrebbero tenere conto della reazione del sistema economico agli interventi esterni dei policy makers. Non sono solo gli economisti mainstream a pensarlo: un esempio è la cosiddetta “legge di Goodhart”: se la banca centrale provasse a controllare direttamente un certo aggregato monetario, l’economia reagirebbe utilizzando altri mezzi di pagamento, rendendo la misura di quell’aggregato irrilevante e la politica inefficace. Purtroppo molti economisti mainstream, su stimolo dello stesso Lucas, hanno utilizzato questo concetto per concludere che l’economia reagirà in modo tale da vanificare del tutto o in parte qualsiasi intervento del governo. Ad esempio l’equivalenza ricardiana afferma che lo stimolo fiscale in deficit è pressoché inutile perché fa aumentare il debito pubblico e il pubblico, spaventato per le tasse future, incomincerà a risparmiare, annullando l’effetto di stimolo (o per essere più precisi, rendendolo identico a quello che si avrebbe se lo stimolo fosse finanziato con l’aumento delle tasse invece che in deficit). Affermazione alla quale neppure Ricardo credeva e che non trova molti riscontri empirici, ma continuamente citata da tutti quelli che (e sono sempre meno, per fortuna) non credono all’efficacia delle politiche keynesiane. In realtà però nulla impedisce che la reazione del sistema economico si manifesti in direzione favorevole all’intervento del governo: ad esempio, gli imprenditori che vedono il governo investire e quindi la domanda aumentare, potrebbero essere indotti a fare altrettanto (innescando il cosiddetto crowding in). Fin qui si tratta soprattutto di valutazione delle politiche. La critica di Lucas ha però prodotto un germe ben più insidioso a livello teorico: l’obbligo, per ogni modello, di avere delle microfondazioni. Vale a dire, ogni modello economico dovrebbe contenere al suo interno il comportamento microeconomico degli agenti. Da qui l’adozione dei cosiddetti “agenti rappresentativi” di cui parleremo tra un attimo. E’ curioso che l’idea che i modelli “macro” debbano necessariamente essere microfondati non abbia alcun corrispettivo nelle scienze naturali, alle quali l’economia dice di volersi ispirare per rigore. In fisica abbiamo usato e continuiamo ad usare, con enorme successo, modelli che non hanno alcuna microfondazione, ma che studiano le leggi a livello esclusivamente macro. La gravitazione universale newtoniana, la relatività generale, le leggi di Ohm o quelle dei gas non spiegano come si comportano le singole particelle, ma come si comportano gli aggregati. E’ pur vero che i fisici si impegnano nel cercare di conciliare “micro” e “macro” (ad esempio cercando di trovare una teoria quantistica della gravità), ma non per questo considerano inservibili i modelli esclusivamente macro. Le scienze, insomma, vedono nelle “microfondazioni” un ulteriore passo in avanti nella conoscenza, non un prerequisito per dar senso ad un modello. Ma c’è di peggio. I modelli “microfondati” della teoria economica mainstream non lo sono affatto, come lucidamente spiegato in un articolo del blog critical finance dell’economista Jo Michell. Torniamo così agli agenti rappresentativi. I modelli mainstream, spiega Michell, non contemplano milioni di agenti che interagiscono tra loro, ma un unico agente che rappresenta, ad esempio, tutti i consumatori. E’ un po’ come se, per studiare i gas, si immaginasse una sola particella in una scatola e, per di più, che tale particella fosse così grande da occupare l’intera scatola. Insomma, non c’è alcuna “microfondazione”, ma solo un elemento “micro” che viene gonfiato fino a farlo diventare “macro”. Con microfondazioni così è meglio tenersi i modelli non microfondati. Michell punta su un esempio, quello delle formiche. Modelli che simulano il comportamento delle formiche alla ricerca di cibo sono molto comuni in informatica perché permettono di risolvere moltissimi problemi simili, come ad esempio individuare il percorso migliore per compiere un viaggio (il problema del commesso viaggiatore) o individuare i bordi degli oggetti in una fotografia. Questi modelli, o per meglio dire questi algoritmi, si basano non su un agente rappresentativo, di cui si suppongono certe caratteristiche per poi dire che l’intero formicaio si comporta in un certo modo, ma sulla simulazione delle interazioni tra un “agente-tipo” (la formica) e il successivo, o il più prossimo, fino a costruire l’intero formicaio. Quel che accade è che il formicaio acquista comportamenti autonomi se preso nel suo insieme, diversi da quelli delle singole formiche. Insomma, delle “proprietà emergenti” (macro) che nessuna formica (micro) possiede, ma che appartengono solo all’intera comunità di formiche. Le interazioni sono così importanti che – entro certi limiti – possiamo anche mutare il comportamento dell’ “agente-tipo” senza influire sul comportamento complessivo del formicaio in modo sostanziale. Modelli basati sull’interazione tra agenti aprono l’analisi dei sistemi a risultati anche molto differenti tra loro. Ad esempio, se un agente ha un comportamento inaspettato, in certe circostanze questo si propagherà nell’intero sistema, portando ad un risultato sub-ottimale oppure a fallire completamente l’obiettivo. Un esempio in economia sono i fallimenti a catena delle banche, che abbiamo visto all’opera nella crisi del 2007-2008. Oppure il sistema potrebbe, in altre circostanze, riuscire a riassorbire l’errore e raggiungere il risultato ottimale o discostarsene di poco. Esistono nella teoria economica modelli basati sull’interazione tra agenti? Un esempio sono i cosiddetti Agent-based Models (ABM). In questi modelli gli agenti economici sono interconnessi tra loro, ad esempio attraverso i loro stati patrimoniali: la banca A è indebitata con la Banca B che è indebitata con la Banca C, ecc.: eventi catastrofici come i fallimenti a catena non sono una sfortuna indecifrabile, ma un fatto comprensibile, così come sono ben comprensibili gli eventi che permettono di interrompere la catena minimizzando l’effetto del singolo evento. Come nel caso del formicaio, poi, dall’interazione degli agenti “emergono” proprietà del sistema aggregato. Di questi modelli parleremo più approfonditamente in un apposito articolo. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3c19f2f1fc', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3c19f2f261', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: agent-based models, Mainstream, microfondazioni Permalink Navigazione articolo ← Il mainstream scopre la legge di Kaldor-Verdoorn È Deutsche Bank la bomba sotto la sedia del capitalismo → 16 commenti su “Microfondazioni e macrosciocchezze” Fabio 9 settembre 2016 alle 18:42 In realtà ormai è strapieno anche di dsge con agenti eterogenei. Un esempio molto semplice è quello della limited asset market partecipation dove sostanzialmente l’equivalenza ricardiana non funziona (ed è roba vecchia eh, Bilbiie 2006 se non ricordo male)…senza considerare poi che ormai i modelli con patient ed impatient borrowers sono diventati il nuovo mainstream…oramai esistono dsge anche con heterogeneity in production (un esempio è Kahn e Tomas 2013)… Tutto questo per dire che il representative agent (inteso come unico agente) è roba impresentabile ad una qualsivoglia conferenza, ormai non ci crede più nessuno. Per ciò che concerne gli ABM, sembra evidente che in tale letteratura l’approccio delle microfondazioni è per certi versi ancora più integralista (nonostante la presenza di rules of thumb Che determinano il comportamento dei vari agenti in gioco). Onestamente “microfondazioni e macro sciocchezze” sembra non comprendere minimamente quali siano le frontiere della ricerca in macroeconomia. Il fatto che l’agente rappresentativo inteso come lo intendevano i teorici del ciclo reale (o come è inteso nel toy model new-keynesian) abbia fallito è più una questione di eterogeneità che di approccio in termini di microfondazioni. Si può benissimo costruire un modello keynesian che sia microfondato. Salvatore Ladu (@SalvatoreLadu) 11 settembre 2016 alle 16:31 non potrei essere più d’accordo. qua stanno ancora parlando della critica di lucas, quando nelle più importanti riviste di economia vengono già pubblicati paper che non presentano i difetti (per così dire) evidenziati in questo articolo. a me non sembrano molto intenzionati a capire di quello che parlano. guiodic 12 settembre 2016 alle 15:36 Lei è un altro che parla senza avere capito nulla di quanto è scritto nell’articolo. Imbarazzante. mariaromanamongiello 12 aprile 2017 alle 21:52 ciao! ho bisogno di chiederti dei pareri e vedo che te ne intendi, potresti contattarmi in e mail ? guiodic 9 settembre 2016 alle 21:29 l’eterogeneità non c’entra nulla in questo discorso, tant’è che l’esempio delle formiche non ha agenti eterogenei. Mi pare che quello che non ha capito sia lei. Fabio 10 settembre 2016 alle 11:08 No guardi, mi sa che è lei a non aver capito di cosa parla, l’esempio che fate delle formiche di fatto è un esempio di agenti eterogenei. E sa il perché? Perché se fossero omogenei, ovvero si comportassero tutti allo stesso modo, l’outcome macro sarebbe identico all’outcome Micro e invece non è così. Il punto che è che nei modelli tipo ABM (dove formiche e formicaio sono un esempio calzante) ogni agente percepisce uno shock differente (lo shock può essere benissimo inteso come un vettore stocastico di prezzi che cambiano da t a t+1 in maniera differente per ogni agente), ed è proprio quella la fonte della differenza tra outcome macro e outcome micro ( i modelli di Stiglitz, Delli Gatti, Callegati, Dosi etc etc funzionano tutti per buona parte con tale meccanismo). Gli agenti sono eterogenei perché percepiscono gli shock in maniera differente. Ergo l’eterogeneità c’entra, eccome se c’entra! Quello che cercavo di dirle è che in altri impianti modellistici (come i dsge) l’eterogeneità può essere concepita in maniera differente (ovvero agenti con caratteristiche ex ante differenti ma che percepiscono lo stesso tipo di shock). Tutto ciò non implica che una modellistica sia sempre migliore dell’altra, dipende dall’uso che se ne fa (ad esempio i modelli di Stiglitz, Delli gatti, Callegati etc etc. Funzionano molto bene nel descrivere la diffusione delle crisi finanziarie, ma hanno altre limitazioni in termini di valutazione degli impatti ciclici, ovvero di breve periodo, proprio per la questione dell’eterogeneità del vettore degli shock, essendo il seed dello shock stocastico, ci sono risultati di breve periodo differenti per ogni realizzazione del seed). Cerco di concludere in breve: l’agente rappresentativo alla Lucas sta nel mezzo tra l’eterogeneità delle formiche e l’eterogeneità dei dsge, ma in ogni caso è uno strumento desueto nella teoria macroeconomica…. guiodic 12 settembre 2016 alle 15:34 “No guardi, mi sa che è lei a non aver capito di cosa parla, l’esempio che fate delle formiche di fatto è un esempio di agenti eterogenei. E sa il perché? Perché se fossero omogenei, ovvero si comportassero tutti allo stesso modo, l’outcome macro sarebbe identico all’outcome Micro e invece non è così. ” Lei non ha capito davvero un accidenti. Complimenti. E’ incredibile. Fabio 12 settembre 2016 alle 21:17 Senta, se è tanto sicuro di quello che dice argomenti (come ho fatto io) invece di dire “imbarazzante, lei non ha capito davvero un accidenti”… ma lei lo ha mai studiato un dsge o un abm? Lo ha mai letto un paper per intero? Ha mai provato a replicarlo? No perché a quanto si evince da ciò che scrive sembrerebbe di no… Beh, visto che è tanto supponente quanto scarso di agomentazioni provo a chiederglielo in termini espliciti: dove è che il mio discorso è sbagliato? Me lo spieghi perché io sono stato dettagliato, mentre la sua sembra una supercazzola… Le dirò di più, anche gli abm sono microfondati, pensi un po’… rottoli 12 settembre 2016 alle 22:42 Uscendo momentaneamente dal merito dei modelli economici di cui non so molto (effettivamente non ho capito se il teorema di Sonnenschein–Mantel–Debreu si applica solo se gli agenti sono eterogenei o meno). Lei sembra affermare che sempre in ogni sistema se i costituenti sono omogenei il comportamento macroscopico è uguale al comportamento microscopico. Questo è facilmente smentibile in altre scienze. In particolare l’esempio delle formiche è valido infatti per quanto ne sappia la ricerca estremamente efficiente a livello di formicaio non dipende dall’ interazione tra formiche di “caste” differenti ma tra formiche con lo stesso compito e comportamento omogeneo tanto che è possibile modellare a computer questa interazione tra formiche omogenee. Ancora di più questo è vero in fisica (gas perfetti) ma non sono sicuro sia un paragone calzante. In ogni caso la sua affermazione che l’outcome macro sarebbe uguale all’outcome micro non ha, mi sembra, valore generale e anche in economia necessiterebbe di una dimostrazione formale. Fabio 13 settembre 2016 alle 00:57 Allora, andiamo con ordine. Io non sono un fisico, sono un povero ignorante e non ho la minima idea di cosa siano e di come funzionino i gas perfetti (ma sono pronto ad imparare), però qualche DSGE l’ho visto e qualche paper sugli ABM l’ho letto di recente e sono stato chiaro e conciso nello spiegare perché nell’esempio del formicaio gli agenti sono di fatto eterogenei (sia chiaro lungi da me far trapelare il fatto che io sia un guru della macroeconomia). A scanso di equivoci posto qui un estratto del commento precedente, perché evidentemente o non lo ha letto oppure non è chiaro il parallelismo (in questa seconda eventualità mi scuso): “Il punto che è che nei modelli tipo ABM (dove formiche e formicaio sono un esempio calzante) ogni agente percepisce uno shock differente (lo shock può essere benissimo inteso come un vettore stocastico di prezzi che cambiano da t a t+1 in maniera differente per ogni agente), ed è proprio quella la fonte della differenza tra outcome macro e outcome "
