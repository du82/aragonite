["https://keynesblog.com/2016/02/03/la-politica-economica-di-bill-clinton-ha-seminato-il-futuro-disastro-e-hillary-vuole-imitarla"]
title = "La politica economica di Bill Clinton ha seminato il futuro disastro (e Hillary vuole imitarla) | Keynes blog"
description = "Sotto la presidenza di Bill Clinton si crearono le condizioni che hanno portato alla crescita delle bolle e del debito privato, mentre i salari rimanevano stagnanti e i lavoratori perdevano potere contrattuale nel mercato del lavoro. E Hillary intende seguire l'esempio del marito. di Robert Pollin, Political Economy Research Institute, University of Massachusetts, Amherst da The Nation,…"
full_description = "2 commenti La politica economica di Bill Clinton ha seminato il futuro disastro (e Hillary vuole imitarla) Pubblicato da keynesblog il 3 febbraio 2016 in Economia, Global, ibt Sotto la presidenza di Bill Clinton si crearono le condizioni che hanno portato alla crescita delle bolle e del debito privato, mentre i salari rimanevano stagnanti e i lavoratori perdevano potere contrattuale nel mercato del lavoro. E Hillary intende seguire l’esempio del marito. di Robert Pollin, Political Economy Research Institute, University of Massachusetts, Amherst da The Nation, traduzione Faber Fabbris Nel tentativo di accreditarsi verso l’anima più popolare del partito democratico, e di presentare Bernie Sanders come un propugnatore di ingenue fantasie socialiste, Hillary Clinton sta evocando sempre più spesso la presidenza Clinton come l’esempio che intende seguire in tema di politiche economiche. Quando nel dibattito per le primarie democratiche, il 17 gennaio, un giornalista le ha chiesto se avrebbe seguito i consigli di Bill Clinton in tema di economia, ha risposo: “Mi circonderò dei migliori consiglieri disponibili; quando si tratterà di economia, se considerate i risultati ottenuti durante il mandato di mio marito (penso all’aumento generale dei redditi, e al contrasto alla povertà – di portata inedita in tutta la nostra storia recente) be’, avete già la risposta”. È indiscutibile che inversioni di tendenza spettacolari nell’economia statunitense si sono verificate durante la presidenza di Bill Clinton. Solo per ricordare i principali risultati: la riduzione simultanea dell’inflazione e della disoccupazione; la fine della lunga serie dei deficit di bilancio, con tre anni di surplus alla fine del suo secondo mandato; una scalata senza precedenti nelle quotazioni di borsa (la cosiddetta “bolla internet”). Ma queste tendenze devono essere valutate in un contesto più ampio. E prima ancora, si impone la domanda: quanto la Clintonomics ha veramente contribuito al benessere delle classi lavoratrici e degli strati poveri della popolazione? Il punto di partenza per capire il programma economico di Bill Clinton è riconoscere che è il prodotto delle esigenze di Wall Street, come Clinton stesso ha riconosciuto quasi immediatamente dopo la sua elezione. Clinton vinse le elezioni nel 1992 con l’impegno di porre termine alla stagnazione degli ultimi due anni dell’amministrazione di George Bush padre, con un programma tutto basato sul “Prima le persone”. E fondato sulla formazione professionale, l’istruzione, le infrastrutture pubbliche. Ma le priorità di Clinton subirono un drastico riordino nei due mesi di ‘interregno’ fra l’elezione in novembre e l’insediamento nel gennaio 1993; un resoconto preciso e dettagliato di questa involuzione è stato fatto da Bob Woodward, cronista del Washington Post, nel suo libro The Agenda (1994). Come Woodward riporta, solo poche settimane dopo la vittoria alle elezioni, Clinton dichiarava: “noi incarniamo lo spirito dei Repubblicani negli anni di Eisenhower… siamo favorevoli alla riduzione dei deficit, al libero commercio, al mercato dei titoli. Un programma grandioso”. Clinton ammise più tardi che con il suo nuovo obbiettivo di politica economica, “abbiamo aiutato il mercato borsistico, e deluso le persone che ci hanno votato”. Come aveva potuto Bill Clinton cambiare direzione così rapidamente? La risposta è diretta e chiara, ed è stata candidamente fornita da Robert Rubin, copresidente della banca Godman Sachs prima di diventare ministro del tesoro di Clinton. Addirittura prima dell’insediamento del nuovo governo, Rubin spiegava ai membri più progressisti della nuova amministrazione che “i ricchi sono il motore dell’economia e prendono le decisioni che la riguardano”. La borsa ha conosciuto un periodo di fasti durante il mandato di Clinton. Nel 1999, il prezzo medio delle azioni aveva superato di 44 volte i profitti delle società quotate a Wall Street, mentre la media storica dei prezzi delle azioni era di 14 volte i profitti. Anche con la bolla degli anni ’20, le quotazioni avevano raggiunto un valore nominale di ‘sole’ 33 volte i profitti. Prima del tracollo del ’29. Uno dei fattori che più contribuirono al fenomeno fu l’isteria degli speculatori sulle start-up legate ad Internet. Nel 1999, ad esempio, la capitalizzazione borsistica della AOL superò quella della Disney e della Time Warner messe insieme; Priceline.com superò di due volte la United Airlines. La squadra di Clinton creò le condizioni che incoraggiarono queste speculazioni assurde. Per tutta la durata della bolla i consiglieri economici di Clinton, capeggiati da Rubin e dal suo protetto Larry Summers, assicuravano che la regolazione del mercato borsistico era una reliquia, ormai fuori moda, degli anni ’30. Fu l’argomento sul quale fecero leva per smantellare il sistema del Glass-Steagall Act, che regolava le attività finanziarie dai tempi del New Deal. L’Amministrazione Clinton pose quindi le condizioni per il collasso della bolla Internet e la conseguente recessione del marzo 2001, a due mesi appena dalla fine del mandato di Clinton. Le stesse condizioni che avrebbero portato ad una bolla ancora più grave, deflagrata con la crisi finanziaria globale del 2008, e alla Grande Recessione che ne è seguita. Clinton mise in scena lo stesso copione anche in altri settori della politica economica. Con Clinton il bilancio federale passò da deficitario a eccedentario soprattutto perché la spesa pubblica diminuì rispetto al PIL nazionale, mentre la bolla borsistica alimentava una artificiale crescita economica. Una brusca riduzione delle spese militari rispetto al PIL subito dopo la fine della guerra fredda non era un’idea assurda. Ma i tagli alla spesa pubblica rispetto al PIL furono molto ampi in ben altri settori. Fra il 1992 e il 2000, le spese per l’istruzione diminuirono del 24%; quelle per la ricerca del 19%; per la previdenza del 18%; per i trasporti del 10%. Questi tagli erano in palese contraddizione con il “Prima le persone” che aveva animato la campagna di Clinton nel 1992. La linea di Clinton sul commercio internazionale era praticamente identica a quella dei suoi predecessori Repubblicani, tutta presa a magnificare le virtù universali del libero scambio. Clinton si adoperò (immediatamente dopo la presa delle sue funzioni) per mettere in atto la fase finale dell’Accordo per il Libero Commercio nell’America Settentrionale (North American Free Trade Agreement – NAFTA), lanciato dai presidenti Reagan e Bush. Era chiaro all’epoca, ed è diventato ancora più evidente da allora, che i maggiori benefici del NAFTA erano tutti per le imprese, mentre il potere d’acquisto e i salari dei lavoratori americani ne hanno fortemente risentito. Le compensazioni simboliche offerte da Clinton verso il lavoro e l’ambiente sono state complessivamente insignificanti. Oltre al trattato NAFTA, l’amministrazione Clinton non ha fatto niente (o quasi) in favore dei sindacati e dei lavoratori più in generale. Come scrisse nel 1999 David Moberg, giornalista che a lungo si è occupato del mondo del lavoro, “Clinton ha rappresentato gli interessi del mondo del lavoro meno di qualsiasi altro presidente democratico eletto nel XX secolo”. Ovviamente, siccome i sindacati rappresentano il bacino elettorale tradizionale del partito democratico, le loro preoccupazioni non possono essere del tutto ignorate. Clinton promosse un aumento del salario minimo nel 1996-1997, in due tappe, da 4,2 a 5,1 dollari l’ora; è il valore al quale è rimasto fisso per tutto il resto della sua presidenza. Ma questo contenuto aumento non fu nulla rispetto alla caduta disastrosa del valore reale dei salari. Attestato a 5,1 dollari l’ora alla fine del mandato di Clinton, il salario minimo reale [al netto dell’inflazione, n.d.t.] era ancora del 35% inferiore a quello del 1968. E ciò malgrado un’economia più produttiva dell’81% sullo stesso periodo (1968-2000). I sostenitori di Clinton controbattono che, nonostante il basso valore del salario minimo, le famiglie con i redditi più bassi hanno ottenuto benefici consistenti grazie al meccanismo di detrazione fiscale [Earned Income Tax Credit – EITC, dispositivo destinato ai bassi redditi, n.d.t.]. Questa misura, inaugurata da Gerald Ford nel 1975, e rafforzata da Carter, Reagan e Bush, offre redditi integrativi ai lavoratori con i salari più bassi. Clinton seguì i suoi predecessori finanziando ulteriormente l’EITC. Ma contemporaneamente smantellò il programma tradizionale di aiuto alle famiglie, l’AFDC [sistema di assistenza erogante fondi a famiglie senza o a basso reddito, in vigore dal 1935 al 1996, n.d.t.]. La spesa globale destinata dal governo federale al “sostegno alle famiglie” crebbe dunque di pochissimo. Inoltre, i fondi destinati ai buoni pasto gratuiti e ad altre misure di assistenza alimentare furono drasticamente ridotti sotto Clinton, a causa del numero crescente di famiglie che rinunciavano a fare domanda per ottenerli (pur avendone diritto). Il mantra clintoniano sulla “fine dello stato sociale come l’abbiamo finora conosociuto” è stato uno dei fattori che più hanno inciso su questa tendenza. L’attacco dell’ex presidente allo stato sociale stigmatizzava, da una parte, gli utenti dell’assistenza pubblica; dall’altra rendeva praticamente più difficile l’accesso ai servizi pubblici. Con il sistema di assistenza sociale pre-clintoniano, una larga parte dei cittadini che ricevevano buoni pasto beneficiavano allo stesso tempo dei finanziamenti diretti dell’AFDC. Con Clinton, le richieste di pasti alle associazioni caritative private e alle banche alimentari aumentò vertiginosamente. Il tasso di disoccupazione cominciò a diminuire dopo l’insediamento di Clinton nel 1993, raggiungendo il 4% nel 2000, minimo storico da 31 anni. Ma questa crescita dei posti di lavoro dipendeva in larga parte dalla spesa delle famiglie e delle imprese, basata sulla bolla borsistica in piena espansione. Una spesa crescente, finanziata a debito. La disoccupazione riprese a salire subito dopo l’esplosione della bolla, e l’espansione che su di essa riposava crollò nel marzo 2001. Allo stesso tempo le scelte di politica economica di Clinton sul commercio internazionale, il lavoro, il salario minimo e l’assistenza alle famiglie aiutano a capire perché l’inflazione non aumentò mentre la disoccupazione diminuiva. Secondo l’approccio teorico economico standard, il potere d’acquisto dei lavoratori aumenta quando la disoccupazione diminuisce. La conseguenza dovrebbe essere un aumento globale del livello dei salari. Le imprese aumentano quindi i prezzi per coprire i più alti costi di produzione, innescando così una spirale inflazionistica. Questo copione non ha funzionato durante la presidenza Clinton. Il motivo fu chiaramente spiegato dall’allora presidente della Federal Reserve Alan Greenspan, che osservava come i lavoratori fossero stati “traumatizzati” dalla pressione della globalizzazione, le trasformazioni tecnologiche, e un clima sfavorevole alla spesa. L’attuale presidente della Fed Janet Yellen scriveva nel 1996 (da membro del consiglio dei governatori della banca centrale statunitense): “anche se il mercato del lavoro è teso, la paura di perdere il proprio posto di lavoro è viva e vegeta. Le richieste di aumento dei salari restano contenute, anche se il potere d’acquisto dei lavoratori è molto basso”. Qual è il bilancio globale di Clinton sul livello di vita dei lavoratori dipendenti e delle fasce più deboli della popolazione? In otto anni di presidenza Clinton, il salario medio reale dei lavoratori dipendenti (13,60 dollari 2001) era inferiore del 2% rispetto a quello degli anni Reagan e Bush, e quasi del 10% se il confronto risale agli “anni del disagio” di Jimmy Carter. Il tasso medio individuale di povertà, con Clinton al 13,2%, è stato appena migliore del 14% registrato ai tempi di Reagan e Bush. Ma peggio del 11,9%, valore medio dei mandati Nixon, Ford e Carter. Insomma, la presidenza di Bill Clinton non ha fatto praticamente nulla per migliorare le condizioni di vita dei lavoratori e dei poveri. Le concessioni alle classi sociali più basse sono state minime, se non ambigue, mentre la maggior parte dei salari è rimasta sotto il livello della generazione precedente. La ricchezza al sommo della piramide è aumentata senza freni con la speculazione borsistica. Ma l’aumento stratosferico dei prezzi delle azioni, il consumo finanziato a debito, e l’esplosione degli investimenti ha generato un’eredità mortifera. Il tracollo finanziario è cominciato proprio mentre Clinton si crogiolava nei risultati delle sue politiche economiche. Ricordiamocene, ogni volta che in campagna elettorale Hillary Clinton invoca il bilancio del marito per convincerci che è la migliore candidata possibile. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c321300f9b9', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c321300fa4a', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: Bernie Sanders, Bill CLinton, Hillary Clinton, USA Permalink Navigazione articolo ← La bad bank è urgente, ma non basta Bellofiore e Simonazzi su euro ed Europa → 2 commenti su “La politica economica di Bill Clinton ha seminato il futuro disastro (e Hillary vuole imitarla)” Piergiorgio Benfenati 7 febbraio 2016 alle 14:48 C’è di che preoccuparsi dopo la presentazione dei candidati alla futura presidenza degli Stati Uniti d’America… E non è che Obama sia stato uno che si possa rimpiangere in quanto è stato un pessimo presidente che in politica estera ha dimostrato di essere un povero sprovveduto. Nel campo repubblicano, per alcuni argomenti che ha toccato (o almeno quegli argomenti che ci sono stati trasmessi dai pennivendoli di casa nostra) non è che ci si possa rallegrare. Insomma…. si stanno scontrando solo ottusi pigmei! Francesco 2 novembre 2016 alle 22:08 La cosiddetta “deregulation” di Clinton, all’origine della crisi dei mutui subprime. I commenti sono chiusi."
