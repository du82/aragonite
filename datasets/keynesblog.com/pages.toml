["https://keynesblog.com/category/teoria-economica/segnalazioni"]
title = "segnalazioni | Keynes blog"
description = "Post su segnalazioni scritto da keynesblog"
full_description = "segnalazioni In memoria di Salvatore Biasco Di keynesblog 13 novembre 2023 1 Commento Ad un anno dalla scomparsa di Salvatore Biasco, economista allievo di Paolo Sylos Labini, Maurice Dobb, Nicholas Kaldor e Hyman Minsky, la rivista Moneta e Credito ha pubblicato uno speciale in memoriam per ricordare il suo lavoro. Come sottolineato da D’Ippoliti e Roncaglia nell’introduzione “I molteplici contributi di Biasco hanno spaziato dall’economia internazionale alla finanza, […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1bcdf6ae', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); #Covid19: per 95% economisti quarantena ha priorità sul PIL. Zingales: “3 volte il PIL prezzo accettabile per salvare milioni di vite” Di keynesblog 5 aprile 2020 12 commenti Mentre in Italia, a fronte di 15mila morti accertati e di un tassi di contagio che rimane ancora preoccupante, c’è chi già pensa a riaprire tutto, negli Stati Uniti gli economisti hanno le idee ben chiare su come affrontare la situazione: il lockdown va perseguito fino in fondo, anche a costo di una contrazione del […] Tony Thirlwall sul tasso di cambio: “Non è un meccanismo efficiente per equilibrare la bilancia dei pagamenti” Di keynesblog 10 febbraio 2020 2 commenti Anthony Thirlwall è uno dei più noti studiosi di economia internazionale post-keynesiana. In questo articolo pubblicato da Moneta e Credito, analizza la sua teoria sulla crescita vincolata dalla bilancia dei pagamenti. A distanza di molti anni, Thirwall mantiene due argomenti: il primo è che i paesi hanno bisogno di valuta internazionale di scambio (oggi […] Le svalutazioni non sono più quelle di una volta Di keynesblog 17 ottobre 2019 1 Commento Può apparire controintuitivo, ma una svalutazione può tramutarsi in una riduzione delle esportazioni, invece che un’espansione delle stesse. E’ quanto Valentina Bruno e Hyun Song Shin rilevano analizzando i dati dell’export mondiale a livello dettagliato in relazione all’andamento del dollaro. Un apprezzamento del dollaro, e quindi una svalutazione delle altre valute, frena il commercio internazionale, […] L’economia secondo Andrea Roventini, il candidato ministro del M5S Di keynesblog 3 marzo 2018 8 commenti Al di là di come la si pensi sul Movimento 5 Stelle, occorre riconoscere che l’indicazione di Andrea Roventini, docente presso l’Istituto di Economia della Scuola Superiore Sant’Anna di Pisa guidato fino a poco tempo fa da Giovanni Dosi, è una scelta di alto profilo. I suoi principali interessi di ricerca comprendono l’analisi di sistemi […] I mercati sono keynesiani? A Jackson Hole si discute di debito e sostenibilità finanziaria Di keynesblog 28 agosto 2017 4 commenti Durante una recessione i governi non devono preoccuparsi troppo del debito pubblico. E’ quanto sostiene il paper di Alan J. Auerbach e Yuriy Gorodnichenko presentato sabato alla conferenza annuale dei banchieri centrali di Jackson Hole. Secondo i due autori “le politiche fiscali espansive adottate quando l’economia è debole non solo possono stimolare l’output, ma possono anche […] [Segnalazioni] Salari e disuguaglianza, Europa, ruolo nel credito nelle recessioni Di keynesblog 23 agosto 2017 2 commenti Segnaliamo alcuni paper di recente pubblicazione dalla newsletter New Economics Papers on Post Keynesian Economics: Are higher wages good for business? An assessment under alternative innovation and investment scenarios Caiani, Alessandro; Russo, Alberto; Gallegati, Mauro Questo paper mira a indagare l’interazione tra disuguaglianza, dinamiche dell’innovazione e comportamenti di investimento nella definizione dei modelli a lungo […] Gli ottanta anni della Teoria generale di Keynes: perché è ancora un libro attuale Di keynesblog 29 Maggio 2017 5 commenti di Maria Cristina Marcuzzo da Moneta e Credito, vol. 70 n. 277 (marzo 2017), 7-19 Dopo la crisi del 2007-2008 il nome di Keynes è rientrato nella lista degli economisti di cui si raccomanda la lettura e di cui si ritorna a dire che sarebbe opportuno seguire le idee. Dopo un bando durato circa venticinque anni, […] Il mainstream scopre la legge di Kaldor-Verdoorn Di keynesblog 6 settembre 2016 1 Commento La teoria economica dominante non è nuova a incorporare concetti sviluppati dai filoni eterodossi. Isteresi, deflazione da debiti, moneta endogena, crescita endogena sono solo alcuni degli esempi più noti di risultati delle teorie economiche non mainstrean (in particolare l’economia Post Keynesiana) che sono riproducibili in un modello ortodosso. A tale proposito segnaliamo ai lettori il paper Endogenous […] Aumentare l’età pensionabile è un costo per il Paese Di keynesblog 24 agosto 2016 7 commenti Aumentare l’età pensionabile ha due effetti molto ovvi: il primo è che toglie lavoro ai più giovani; il secondo è che riduce la produttività dell’economia. Queste due ovvie conclusioni sembrano essere incomprensibili per molti economisti, ma è esattamente ciò che sta succedendo. Navigazione articolo ← Articoli più vecchi"
