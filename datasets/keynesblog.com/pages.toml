["https://keynesblog.com/2018/05/17/uscire-dalleuro-e-cancellare-il-debito-analisi-delle-proposte-del-contratto-lega-m5s"]
title = "Uscire dall’euro e cancellare il debito? Analisi delle proposte del contratto Lega-M5S | Keynes blog"
description = "Un articolo in cui cerchiamo di spiegare perché sia i noeuro che i proeuro hanno torto Una bozza del contratto di governo tra Lega e M5S - diffusa dalla stampa e poi parzialmente smentita dagli interessati – conterrebbe due proposte shock in campo economico: 1) chiedere alla BCE di “cancellare” 250 miliardi di debito pubblico,…"
full_description = "13 commenti Uscire dall’euro e cancellare il debito? Analisi delle proposte del contratto Lega-M5S Pubblicato da keynesblog il 17 Maggio 2018 in consigliati, Economia, Europa Un articolo in cui cerchiamo di spiegare perché sia i noeuro che i proeuro hanno torto Una bozza del contratto di governo tra Lega e M5S – diffusa dalla stampa e poi parzialmente smentita dagli interessati – conterrebbe due proposte shock in campo economico: 1) chiedere alla BCE di “cancellare” 250 miliardi di debito pubblico, ovvero la parte del debito pubblico detenuta dalla banca centrale; 2) prevedere una procedura per l’uscita di un paese dall’euro. Vediamo in dettaglio gli effetti possibili di tali proposte, avvertendo però che la prima è stata precisata dal responsabile economico della Lega Nord: non si tratterebbe di una vera cancellazione ma solo di uno scomputo ai fini del calcolo del debito/Pil. Ne parliamo in un paragrafo specifico, ma è interessante analizzare che succederebbe se effettivamente il debito fosse cancellato. Cancellare il debito pubblico: “reboot” dell’euro o anticipazione dell’uscita? Si può “cancellare” il debito pubblico detenuto dalla BCE? Facciamo per semplicità prima un esempio che non riguarda l’eurozona. Supponiamo che la banca centrale del Giappone decida di “giubilare” i debiti del governo nei suoi confronti. Una proposta del genere fu avanzata l’anno scorso fa da J. Stiglitz. Ad esempio potrebbe restituire i titoli al governo, oppure restituire il denaro ricevuto alla scadenza del titolo. Una versione più morbida consisterebbe nel trasformate i titoli di stato in “perpetual bonds” su cui pagare solo gli interessi, senza mai più rimborsare il capitale. Cosa accadrebbe? In un primo momento, probabilmente vi sarebbe una forte volatilità soprattutto sul mercato dei cambi. L’ “effetto sorpresa” sarebbe certamente rilevante. Se però l’operazione fosse comunicata bene dalle autorità monetarie, presto tutti si renderebbero conto che quel che è successo è semplicemente un consolidamento di debiti tra due autorità dello stato, quella monetaria e quella fiscale. Non molto diverso da una cancellazione del debito tra padre e figlio: fuori dalla famiglia non cambia nulla. La moneta emessa a seguito dell’acquisto dei bond rimarrebbe comunque un debito della banca centrale, ma ad essa non corrisponderebbe più un credito nei confronti del governo. Allora perché farlo? Secondo alcuni, in questo modo si potrebbero superare le resistenze degli agenti “ricardiani”, ovvero quelli convinti che il governo dovrà rimborsare prima o poi il suo debito e quindi aumenterà le tasse. Tali agenti tendono quindi a risparmiare oggi per pagare le tasse di domani. L’equivalenza ricardiana non vale in generale, tuttavia è possibile che molti ci credano, soprattutto perché bombardati dalla propaganda terroristica sul debito. Cancellare il debito sarebbe equivalente a gettare i soldi dall’elicottero, come proponeva Friedman, per combattere la deflazione. Diversamente da quanto credeva Friedman, tuttavia, gli effetti sull’inflazione non sarebbero chiari e inequivocabili. E’ possibile comunque che cambino le aspettative di inflazione nel breve periodo. Passiamo ora all’eurozona. Qui la situazione è più complessa. Intanto il grosso del debito pubblico non è detenuto dalla BCE in quanto tale, ma dalle singole banche centrali nazionali. Qui però ipotizzeremo, per semplicità, che sia la BCE a detenere direttamente i titoli e che la misura sia adottata per tutti i paesi del’eurozona. Cosa accadrebbe se la BCE decidesse di “cancellare” i titoli di stato dei paesi membri dal suo bilancio? Anche qui, in un primo momento probabilmente vi sarebbe una forte volatilità. Quel che succede dopo dipende interamente dalla percezione dei mercati e del pubblico generale. Ovvero dalle aspettative. Se la cancellazione fosse vista come un “giubileo” dei debiti, al fine di dare più spazio fiscale agli stati membri e far ripartire l’Unione Monetaria quasi “da zero”, i dubbi sulla permanenza dell’euro dei paesi periferici sarebbero fugati e gli spread si contrarrebbero verso lo zero. Dovrebbe però essere reso chiaro a tutti che i titoli di stato in possesso del pubblico (banche, imprese, famiglie) sarebbero comunque onorati senza se e senza ma. Cioè bisognerebbe spiegare senza alcuna possibilità di equivoco che la “cancellazione” del debito pubblico sarebbe solo e soltanto un accordo interno tra i governi dei paesi dell’eurozona e la loro banca centrale, cioè la BCE. Se invece il pubblico avesse la percezione che si è arrivati a tale decisione sotto la pressione degli euroscettici, come primo passo verso la dissoluzione dell’euro, allora l’effetto sarebbe l’opposto. Insomma, le aspettative contano. Si badi che qui parliamo del fatto che il creditore (la BCE) cancella il debito del suo debitore (i governi nazionali) nell’ambito di un “reboot” dell’eurozona. Se invece fosse un governo a decidere di non pagare, semplicemente si tratterebbe di un default. Lo spread salirebbe alle stelle e il paese sarebbe costretto a ricorrere a un piano di aiuti o uscire dall’euro, con tutte le drammatiche conseguenze di un default da ridenominazione anche sul resto del debito pubblico. Due obiezioni spesso si affacciano nel dibattito. Alcuni sostengono che non sia possibile per la BCE condonare il debito pubblico perché così azzererebbe il suo capitale. La BCE infatti dovrebbe iscrivere una perdita in conto capitale e, trovandosi con più debiti (la moneta) che crediti (i titoli di stato), finirebbe con l’avere un capitale negativo. Non è però un grande problema. Una banca centrale non è una banca privata, ma il monopolista della moneta. Semplicemente non può fallire. Difatti: Le banche centrali sono protette dall’insolvenza grazie alla loro capacità di emettere moneta, il che significa che possono anche operare con capitale negativo. (Bunea D. et al., Profit distribution and loss coverage rules for central banks, ECB Occasional Paper Series 169 / April 2016) Altri, gli ultimi epigoni della teoria quantitativa della moneta, invocano l’arrivo dell’iperinflazione da finanziamento monetario. Si tratta di sciocchezze, come i nostri lettori abituali ben sanno. L’inflazione non dipende dalla “stampa” di moneta, ma dalla crescita dei costi: crescita dei salari al di sopra della produttività, svalutazione, ecc. L’unico canale plausibile per un aumento dei prezzi sarebbe la possibile, iniziale, svalutazione dell’euro da “effetto sorpresa”, che però verrebbe riassorbita rapidamente grazie all’“effetto fiducia” dato dall’annullamento delle aspettative di uscita dall’euro. La precisazione di Borghi La bozza di contratto, ha spiegato Claudio Borghi della Lega, non propone un’effettiva cancellazione dei debito pubblico detenuto dalla BCE, ma solo il suo scomputo ai fini della verifica del rispetto dei parametri di Maastricht. Si tratta di una proposta più morbida, ma forse più efficace, perché eviterebbe di gettare i mercati nel dubbio di una possibile uscita dall’euro futura. Questo almeno in teoria, visto che poi il contratto prevede esattamente la possibilità di uscire dall’euro. La procedura per l’uscita dall’euro La bozza propone la creazione di una procedura per l’uscita dall’euro, simile a quella dell’art.50 del Trattato di Lisbona che prevede l’uscita dall’Unione Europea. E’ curioso che tale proposta venga avanzata dagli euroscettici, poiché l’idea in realtà è stata lanciata a più riprese da ambienti conservatori tedeschi vicini a Schauble. Lo stesso ex ministro delle finanze tedesco ipotizzò per la Grecia un’uscita – sia pure temporanea – dalla moneta unica. Per fortuna Tsipras comprese chiaramente che la Grexit sarebbe stata disastrosa. Non si può dire lo stesso dei noeuro italiani. E’ evidente infatti che se un paese può uscire dall’euro, i titoli di stato dei paesi più deboli diventano rischiosi. Si potrebbe quindi facilmente innescare una nuova crisi dei debiti sovrani come nel 2010-2011: lo spread alle stelle e le aspettative di rottura dell’area euro potrebbero diventare stavolta autorealizzanti. Non è un caso che lo spread abbia incominciato a ballare al diffondersi di questa ipotesi. Non ha senso parlare di complotto: semplicemente gli investitori (piccoli e grandi, italiani e non), spaventati dall’ipotesi di uscita dall’euro, vendono titoli italiani per mettere i soldi al sicuro, ad esempio in titoli esteri. Si badi, non siamo nel 2011, quando vi era una situazione di crisi del sistema euro che sfuggiva quasi totalmente al nostro controllo. Oggi si tratta invece di una pena autoinflitta, causata dall’approssimazione e dall’irresponsabilità dei futuri governanti, non di una congiura della speculazione internazionale o degli eurocrati. Né ci pare possa vere senso pretendere che la BCE ci tolga le castagne dal fuoco: sì, Draghi potrebbe provare a calmare le acque intervenendo sui mercati, ma su quale base – giuridica, economica, politica o di buon senso – potrebbe infrangere i criteri del QE (il capital key) per comprare più titoli di un paese che minaccia di uscire dall’euro? Ma le cose stanno persino peggio di così: poiché la BCE non ha il potere di impedire ad un paese di uscire volontariamente dall’euro, non ha modo di modificare le aspettative dei mercati su questo evento. Nel documento finale la proposta è non a caso saltata, ma i mercati ormai tengono d’occhio l’Italia. Non saranno mesi tranquilli. Purtroppo dovremo fare i conti con gli effetti dell’avventatezza di forze politiche che non hanno idea dei pericoli che potrebbero far correre al paese. La strada da seguire non è minare la stabilità dell’eurozona ma quella opposta: rendere effettivamente l’euro irrevocabile tramite una BCE garante dei titoli di debito dei paesi membri dell’euro – che poi sono i principali collaterali per l’emissione monetaria -, titoli che così sarebbero percepiti pienamente come safe-assets. Post scriptum L’immediata diffusione della bozza del contratto M5S-Lega – che doveva rimanere riservata – dovrebbe far riflettere sulla capacità di analisi degli scenari complessi di quanti, per anni, hanno parlato di uscita dall’euro da attuare con un “piano segreto”, da attivare preferibilmente un venerdì sera, a mercati chiusi. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c2537f2c7d9', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c2537f2c866', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: euro, eurozona, noeuro Permalink Navigazione articolo ← Il grafico che spiega queste elezioni Sei punti per uscire dall’austerità, non dall’euro → 13 commenti su “Uscire dall’euro e cancellare il debito? Analisi delle proposte del contratto Lega-M5S” il Senso Critico (@ilsensocritico) 17 Maggio 2018 alle 11:52 Lei scrive: “La strada da seguire non è minare la stabilità dell’eurozona ma quella opposta: rendere effettivamente l’euro irrevocabile tramite una BCE garante dei titoli di debito dei paesi membri dell’euro“. Qui si nasconde il dato politico che però lei non affronta nel post. Chiedo scusa se ne ha già parlato altrove, ma come si fa a convincere il fronte dell’austerity ad accettare questa proposta? Il problema nasce da lì e non credo basti appellarsi alla lungimiranza da statisti, vista l’opposizione che Merkel e soci devono affrontare in patria. Andrea 18 Maggio 2018 alle 14:11 Sono d’accordo. Rendere l’euro moneta sovrana è come tornare indietro nel tempo e convincere i delegati di Bretton Woods ad accettare la proposta di Keyens. Valerio 17 Maggio 2018 alle 12:20 Certo, una BCE garante dei titoli di debito dei paesi membri dell’euro . Ci parli tu con la Merkel? sesto rasi 17 Maggio 2018 alle 14:16 Sapete benissimo che entrambe le cose sono state immediatamente cassate, non fosse altro in quanto praticamente impossibili: sarebbero foriere di morte per fame se solo restassero come delle proposte non smentite. Quindi non è vero che è ” interessante analizzare che succederebbe se effettivamente il debito fosse cancellato”, se non per gettare ulteriore ombra di populisti incapaci sui presunti proponenti. Come se ne avessero bisogno. Meglio essere più costruttivi, anche in veste di polemisti schierati. Schierarsi non va male. Alimentarsi di argomenti solo giocando da “schierati contro” un po’ meno. Uscire dall’euro e cancellare il debito? Analisi delle proposte del contratto Lega-M5S - nuovAtlantide.org 17 Maggio 2018 alle 15:11 […] Pubblicato da keynesblog – 17 maggio 2018 […] Gengiss 19 Maggio 2018 alle 00:05 Ma con moneta sovrana e banca centrale pubblica, cosa ci importerebbe dello spread e dei “mercati” ? I Bot ce li compriamo da soli. Il Giappone ha il debito pubblico più alto del mondo, ma non è un problema perché interno Fabio 19 Maggio 2018 alle 09:23 Il problema sta nel fatto che non esiste una vera moneta sovrana, ma tanti euro che alla fine sono legati alle vecchie monete degli stati membri. Con quali meccanismi, questo è un grande mistero, ma sicuramente non rispecchiano l’andamento dei mercati. I mercati devono fluttuare e cosi pure gli spread, cosa naturale visto l’incertezza che domina nell’economia reale. Sono discorsi da burocratici e da politici, non da economisti, una cosa è certa, che l’Italia ha un peso consistente nel bilancio del’unione europea. L’uscita dall’euro dell’Italia comprometterebbe seriamente la sopravvivenza dell’europa e della stessa moneta. Andrea 27 Maggio 2018 alle 08:58 Quando uno si professa Keynesiano dovrebbe accorgersi quando arriva il lungo periodo. In Italia quando il PCI è diventato PDS. E di li a poco i trattati. Correlazione o causazione? O semplice coincidenza? Per ora ricontrattare i trattati appare impossibile, proporre stanze dei compensazione modello Bretton Woods una pia illusione, visto che Sapelli è saltato e il tira e molla su Savona stanno a solo dimostrare che la Ue non vuole nemmeno sentire della minima possibilità di ridiscutere alcunché. Meglio i fare i mini bot che stanze di compensazioni sui libri. Se poi c’è il buco su gli incassi (non credo) emetti l’euro e te ne freghi della Ue. Raffaele Corsa 28 Maggio 2018 alle 21:59 Ho solo una domanda: se perdi la sovranità monetaria concedendola alla bce in questo sistema capitalistico ultraconnesso e globalizzato credo non avrai mai la possibilità di rimetterti “a pari”. Come risolvere allora il paradosso creato dalla Germania? nemobis 31 Maggio 2018 alle 13:44 Ho letto il “piano B” con delusione: non è nemmeno un documento, è solo una presentazione con tanto di clipart da scuola elementare. Prima di leggere, avevo generosamente ipotizzato che l’uscita dall’euro fosse intesa come una grande “cancellazione dei debiti” a mo’ di antica Roma: un modo per azzerare i risparmi dei ricchi "
