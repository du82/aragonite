["https://keynesblog.com/2016/06/09/salario-reale-e-occupazione-neoclassici-neokeynesiani-e-keynes"]
title = "Salario reale e occupazione: Neoclassici, Neokeynesiani e Keynes | Keynes blog"
description = '''Il prof. Rodolfo Signorino dell'Università di Palermo ci ha gentilmente inviato una dispensa, scaricabile dal link qui sotto, sulle differenze tra le diverse teorie dell'occupazione e del mercato del lavoro nell'economia politica. In particolare la dispensa presenta la differenza tra la teoria neoclassica "pura" e quella sviluppata negli anni '50 dai keynesiani americani, normalmente definita…'''
full_description = "3 commenti Salario reale e occupazione: Neoclassici, Neokeynesiani e Keynes Pubblicato da keynesblog il 9 giugno 2016 in consigliati, Economia, Teoria economica Il prof. Rodolfo Signorino dell’Università di Palermo ci ha gentilmente inviato una dispensa, scaricabile dal link qui sotto, sulle differenze tra le diverse teorie dell’occupazione e del mercato del lavoro nell’economia politica. In particolare la dispensa presenta la differenza tra la teoria neoclassica “pura” e quella sviluppata negli anni ’50 dai keynesiani americani, normalmente definita “sintesi neoclassica-keynesiana”, basata sull’assunzione di salari nominali rigidi verso il basso nel breve periodo, nonché la differenza tra quest’ultima e la Teoria Generale di Keynes. Per meglio guidare il lettore, al testo sono state aggiunte alcune nostre note proprio su questo argomento. Per un confronto diretto Neoclassici-Keynes rimandiamo al nostro articolo: Occupazione: Keynes contro i neoclassici. Scarica: Keynes versus i Classici su disoccupazione involontaria e flessibilità di prezzi e salari, di Rodolfo Signorino L’occasione è perfetta per un consiglio per gli acquisti ai nostri lettori: il manuale di Macroeconomia del prof. Signorino, infatti, (Istituzioni di economia politica vol.2 – Macroeconomia, Giappichelli 2008) è probabilmente uno dei più chiari libri di testo di economia in commercio, profondamente radicato nella tradizione italiana caratterizzata dal pluralismo nell’insegnamento dell’economia. Esso infatti presenta al lettore/studente non solo il paradigma neoclassico e la sintesi neokeynesiana (quindi il “mainstream”), ma anche i “classici” propriamente detti (Smith, Ricardo, ecc.), il Keynes della Teoria Generale e altri filoni eterodossi. Insomma, un volume che non può mancare nella libreria di chi vuole guardare oltre il paradigma dominante senza perdere – anzi guadagnando! – in termini di rigore scientifico, epistemologico e storico. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0e5b9485', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0e5b94d4', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: John Maynard Keynes, Rodolfo Signorino Permalink Navigazione articolo ← Uno stimolo decentralizzato e un nuovo “whatever it takes” per l’Eurozona Paolo Leon contro l’economia mainstream: “E’ un’ideologia” → 3 commenti su “Salario reale e occupazione: Neoclassici, Neokeynesiani e Keynes” Camillo Sirianni 11 giugno 2016 alle 14:50 Manuale sul quale fortunatamente ho avuto il modo di studiare in vista dell’esame di Economia Politica 1. ;) Camillo Sirianni 11 giugno 2016 alle 14:51 E anche 2 claudio 12 giugno 2016 alle 10:36 quasi per diletto mi piace commentare queste 8 pagine, partendo da qualche considerazione la prima è che secondo me il grande vecchio si è costruito una gabbia di ferro (teorica) quasi inattaccabile. un matematico credo che si esprimerebbe in questo modo: A)”il paradigma di keynes e perfetto nel linguaggio dell,economia soprattutto per cio che riguarda la sindrome “di scarsita di domanda effettiva” B)che poi deriva da a, è che non c,è miglior specialista per curare questa sindrome che un dottore che abbia a modello il paradigma keynesiano C)non usare il (P.K) in economia equivarrebbe a cio che un costruttore di case prefabbricate facesse se nel costruire un fabbricato usasse i materiali a disposizione per il primo e secondo piano , e poi volesse costruire altri piani senza usare il materiale disponibile per il terzo piano, perche non di gradimento al costruttore e costruire direttamente il quarto piano chiaramente cio è impossibile , come è impossibile per i neoclassici ed i classici risolvere questa specifica crisi con la loro (non)…visione della realta. ora vorrei commentare questo documento per la parte postata 1) essi (i grafici) fotografano fedelmente una realta ma non la interpretano, sta agli studiosi interpretare i dati (freddi della matematica) cioe essi ci dicono che al tempo (t -zero) una economia è in equilibrio ed i parametri sono ottimali,e l,economia data si puo riperpetuare tale e quale o con variazione quasi nulle, insomma si puo riprodurre. mentre al tempo (t-1) o per shock od altro i parametri cambiano ora questo comporta dei problemi che sono direttamente propozionali (come difficolta) alla capacita o incapacita che ha, chi è preposto alla diagnosi di leggere correttamente la realta per fare si che la cura vada nella direzione di combattere ed eliminare l,anomalia, ora mi sembra di poter dire che i classici e neoclassici (o non hanno capito) oppure peggio non hanno voluto capire la “natura della sindrome economica” e quindi hanno imposto cure che hanno finito per fare danni ingentissime portando interi paesi in vicolo cieco e l,europa intera in una situazione pericolosa. ora è vero vero che i salari sono piu alti rispetto alla attuale produttivita , ma e vero pure che la prima cosa da fare sarebbe una redistribuzione verso il basso della quota salari e soprattutto uno spostamento redistributivo dai redditi piu alti (esempio quelli dei menager che sono inseriti nella quota salari come giustamente fa notare il professor zezza) verso i redditi che hanno una maggiore propensione al consumo,detto in altri termini spendono tutto cio che guadagnano, ma neanche questo basta perche anche se tutta la quota salari sarebbe bene equilibrata tra consumi e rispormio (cioè senza variazioni notevoli) la produttivita rimarrebbe in ogni caso un tantino al di sotto del valore sottostante cioè al valore di (t-1) quindi sempre molto al di sotto della produttivita potenziale (cioè si assesterebbe a valori sottostanti) infatti la logica di classici neoclassici e di adeguarsi ai valori sottostanti attraverso una piu bassa distribuzione dei salari . detto in altri termini stessa quota salario distribuita per piu attori sociali, senza eliminare nemmeno gli squilibri eccessivamente distributivi a favore delle “professionalita” piu alte oppure piu legate alla politica (circoletti privilegiati). un,altra cose non è affatto vero che in una economia diciamo di “stampo” keynesiano (anche se la definizione non e precisa) i salari sono sempre rigidi verso l,alto , in quando anche in queste economia sono sempre i salari ad agganciarsi alla produttivita. non credo che operai e impiegati hanno interessi contrastanti con gli imprenditori onesti quando si tratta di salvaguardare una azienda. I commenti sono chiusi."
