full_description = "Welfare Rileggere Beveridge 73 anni dopo il suo Rapporto Di keynesblog 17 dicembre 2015 4 commenti Michele Colucci ci riporta al dicembre del 1942 quando a Londra venne presentato il Rapporto finale della Commissione sulla riforma delle assicurazioni sociali, presieduta da William Beveridge. Colucci ricostruisce la personalità di Beveridge, ricorda l’enorme successo del suo Rapporto, che ha rappresentato una svolta storica del dibattito sullo Stato sociale e sostiene che esso conserva, […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f1c3e962d', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Qualche illusione statistica sulla spesa pubblica italiana Di keynesblog 8 aprile 2014 5 commenti Social compact/In Italia la spesa sociale è balzata al 28,4%, ma solo a causa del ricorso massiccio alla cassa integrazione. A farla da padrone, nel nostro bilancio, è la previdenza, ma anche su questo le illusioni statistiche sono dietro l’angolo di Felice Roberto Pizzuti Antonella Stirati: “Senza lavoro il reddito minimo è una chimera” Di keynesblog 20 dicembre 2013 2 commenti Intervista di Roberto Polidori da Siderlandia Abbiamo parlato di reddito minimo con Antonella Stirati, economista e professore ordinario di Economia presso la facoltà di Roma Tre, molto conosciuta per le sue ricerche sulla distribuzione del reddito e mercato del lavoro. Il welfare secondo Renzi Di keynesblog 19 novembre 2013 44 commenti Su welfare e pensioni, Matteo Renzi ripropone la vulgata prevalente da alcuni anni che persegue il drastico ridimensionamento del sistema pubblico di Angelo Marano da Sbilanciamoci.info Fermare il declino dei fatti Di keynesblog 13 Maggio 2013 62 commenti Michele Boldrin è stato eletto nuovo presidente di “Fare per Fermare il declino”. Nonostante i suoi titoli di studio siano veri, i fatti che espone non sempre sono altrettanto certificati. E’ il caso di quanto egli ha sostenuto giovedì scorso nella trasmissione di Michele Santoro, dedicata alla scuola pubblica e ai sussidi per quella privata, oggetto del […] Un welfare solo per donne e bambini? Di keynesblog 9 Maggio 2013 3 commenti Interventi selettivi contro la povertà possono portare buoni frutti, ma anche molti rischi. Il primo: rimuovere dalla sfera politica il contrasto alle condizioni che creano la diseguaglianza. Il ri-orientamento del welfare va fatto, ma nella prospettiva di un accentuato impegno alla riduzione delle disuguaglianze nelle condizioni di vita e di un universalismo attento alle differenze […] Le lontane radici della disuguaglianza italiana Di keynesblog 2 aprile 2013 11 commenti Il viaggio nelle idee sbagliate che infestano l’economia – quelle che Paul Krugman chiama “idee scarafaggio” – ci porta alla disuguaglianza. Un fenomeno che dura da vent’anni. di Pier Giorgio Ardeni, da Sbilanciamoci.info L’università sottofinanziata e il declino italiano Di keynesblog 5 febbraio 2013 6 commenti La disoccupazione giovanile in Italia ha raggiunto ormai livelli intollerabili (37%). Le sue cause sono spesso rintracciate in “un eccesso di istruzione”, a fronte di un sistema d’impresa che non richiede manodopera troppo qualificata. Ma le politiche messe in atto per risolvere il problema non fanno altro che assecondare un modello di sviluppo destinato a […] Sanità, scuola e retorica della “razionalizzazione” Di keynesblog 19 dicembre 2012 6 commenti di Guglielmo Forges Davanzati, da Micromegaonline Per “razionalizzazione” si intende un’operazione di politica economica finalizzata a rendere più efficiente il funzionamento di un sistema economico, attraverso il contenimento (o l’azzeramento) degli sprechi. Il termine è talmente abusato nel dibattito italiano da renderlo sostanzialmente vuoto e, al tempo stesso, da renderlo socialmente accettato, dal momento che […] L’Italia spende troppo per la sanità? Neppure per sogno, ecco i dati Di keynesblog 29 novembre 2012 15 commenti Numeri, dati, fatti. E’ da questi che dovrebbe partire non solo la scienza economica ma anche i politici e i professori di economia prestati alla politica. Eppure raramente è così. Secondo Mario Monti il sistema sanitario italiano non è sostenibile. Eppure i dati dicono che non spendiamo affatto più degli altri, anzi. E dicono anche […] Navigazione articolo ← Articoli più vecchi"
