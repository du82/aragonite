description = "Post su Citazioni e testi classici scritto da keynesblog e Jack Gladney"
full_description = "Citazioni e testi classici Marx, il capitalismo e la globalizzazione, 170 anni fa Di keynesblog 21 febbraio 2018 1 Commento Il 21 febbraio 1848 veniva pubblicato a Londra il Manifesto del Partito Comunista di Marx ed Engels. Pubblichiamo alcuni passi del primo capitolo nei quali si analizza lo sviluppo della globalizzazione capitalistica che già 170 anni fa risultava estremamente chiara al filosofo di Treviri. Il testo è un vero e proprio elogio della borghesia nella […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f148636d0', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Il ritorno del Keynesismo militare Di keynesblog 24 novembre 2015 11 commenti “… la guerra ha sempre provocato un’intensa attività industriale. Nel passato la finanza ortodossa ha considerato la guerra come l’unica legittima scusa per la creazione di occupazione tramite la spesa pubblica. Lei, signor Presidente, dopo aver gettato via tali catene, è libero di impegnare nell’interesse della pace e della prosperità la tecnica che finora è stata […] Rimetti a noi i nostri debiti. Ti conviene Di keynesblog 8 luglio 2014 5 commenti Sono in molti coloro che da tempo propongono una (parziale) cancellazione dei debiti tra “centro” e “periferia” come primo passo per la soluzione della crisi dell’eurozona. Ne parla ad esempio Kenneth Rogoff in un articolo pubblicato dal Sole 24 ore. La maggior parte dei proponenti sottolinea che il debito estero è troppo grande per essere ripagato […] I professori che cercano di fermare le riforme Di keynesblog 14 aprile 2014 5 commenti “Io temo che in questi trent’anni le continue prese di posizione dei Professori abbiano bloccato un processo di riforma oggi non più rinviabile per il Paese” (Maria Elena Boschi, ministro delle riforme) Il ministro Boschi è troppo ottimista. Ci sono Professori che cercano di bloccare le riforme da molto più tempo, oltre 80 anni. Ne […] Keynes e i fallaci pressupposti del liberismo darwiniano Di keynesblog 6 febbraio 2014 13 commenti “Liberiamoci dai principi metafisici del liberismo” – scrive Keynes in La fine del Laissez-faire nel 1926 – “Non è una deduzione corretta dai principii di economia che l’interesse egoistico illuminato operi sempre nell’interesse pubblico”. L’evoluzione darwiniana, basata sulla sopravvivenza del più adatto attraverso la morte, la fame e la carestia, non è affatto un buon […] Nicky Kaldor e l’ingenua apologia del cambio flessibile Di keynesblog 5 dicembre 2013 56 commenti Davvero i cambi flessibili sono il migliore dei mondi possibili? L’economista Post Keynesiano Nicholas Kaldor (tra i più prolifici e rilevanti studiosi di questa scuola) ha cambiato radicalmente opinione sui regimi di cambio quando si è trovato di fronte a nuove evidenze. In un paper del 1965 intitolato “The Relative Merits Of Fixed Exchange And […] Franklin Palmiro Roosevelt Di keynesblog 18 novembre 2013 7 commenti Pubblichiamo un breve estratto del noto discorso su “Ceto medio ed Emilia Rossa” del segretario del PCI Palmiro Togliatti, tenuto a Reggio Emilia nel 1946, nel quale riecheggia, quasi esplicitamente, l’ispirazione del New Deal di Franklin Delano Roosevelt. Come rileva Roberto Gualtieri, “il rapporto con i ceti medi, secondo Togliatti, era essenziale, sia per il radicamento […] “Il Grande Déjà vu” delle rassicurazioni economiche Di Jack Gladney 6 novembre 2013 2 commenti di Sebastiano Marino Da metà Settembre 2008 ad oggi non sentiamo altro che parlare di crisi e di recessione su tutti i media. La crisi, esplosa negli Stati Uniti a causa della bolla immobiliare dei mutui subprime, si è poi riverberata in Europa minando seriamente le fragili fondamenta dell’Eurozona e provocando una vera e propria […] Keynes e la macchina stampa soldi Di keynesblog 24 Maggio 2013 30 commenti Per uno strano scherzo della storia, oggi molti attribuiscono a Keynes l’idea che stampare denaro sia la medicina migliore per risolvere una crisi. In realtà l’autore della Teoria Generale la pensava molto diversamente. L’espansione monetaria ha senso se serve a finanziare la spesa pubblica e i bassi tassi di interesse sono utili nella misura in […] Una lezione dalla storia: la crisi del 1929 e la distribuzione del reddito Di keynesblog 16 aprile 2013 4 commenti Marriner S. Eccles su nominato presidente della Federal Reserve da Franklin D. Roosevelt e ricoprì la carica dal novembre 1934 al febbraio 1948. In questo brano, tratto dal suo libro di memorie “Beckoning Frontiers” (New York, Alfred A. Knopf, 1951) illustra il rapporto tra la distribuzione del reddito e la “Grande Depressione”. Le analogie con la […] Navigazione articolo ← Articoli più vecchi"
