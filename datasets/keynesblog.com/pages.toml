full_description = "Italia In memoria di Salvatore Biasco Di keynesblog 13 novembre 2023 1 Commento Ad un anno dalla scomparsa di Salvatore Biasco, economista allievo di Paolo Sylos Labini, Maurice Dobb, Nicholas Kaldor e Hyman Minsky, la rivista Moneta e Credito ha pubblicato uno speciale in memoriam per ricordare il suo lavoro. Come sottolineato da D’Ippoliti e Roncaglia nell’introduzione “I molteplici contributi di Biasco hanno spaziato dall’economia internazionale alla finanza, […] __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f18aae37a', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Come Mario Draghi ha salvato l’euro Di keynesblog 19 settembre 2020 4 commenti di Francesco Saraceno, tratto da “La Riconquista”, Ed. Luiss Quando Mario Draghi ha lasciato la testa della BCE, nel novembre del 2019, su una cosa i molti estimatori e i pochi detrattori del presidente della BCE si sono trovati d’accordo: durante gli otto anni in cui ha condotto la politica monetaria dell’Eurozona, l’ex governatore della Banca d’Italia […] Gli investimenti pubblici nella sanità italiana 2000-2017: una forte riduzione con crescenti disparità territoriali Di keynesblog 1 Maggio 2020 2 commenti di Gianfranco Viesti da Eticaeconomia.it L’emergenza coronavirus sta mettendo in luce le conseguenze del grave sotto-finanziamento del sistema sanitario nazionale (SSN), documentato da molte fonti; da ultimo, con semplicità e chiarezza da Reforming (2020). Sono da tempo disponibili molte analisi economiche del SSN, anche nelle sue articolazioni territoriali: si vedano per tutte quelle, recenti, dell’Ufficio Parlamentare […] #Covid19, sorpresa: la quarantena fa bene all’economia Di keynesblog 27 marzo 2020 9 commenti In queste settimane abbiamo ascoltato economisti, industriali e politici mettere in contrapposizione le conseguenze economiche della “quarantena”* e la tutela della salute. L’argomento, in sintesi, può essere riassunto con “le conseguenze economiche della quarantena sarebbero peggiori di quelle della malattia” o addirittura “morirebbe più gente di fame per per il virus”. Un’idea che, ricordiamolo, stava […] Lo spread, la “gaffe” della Lagarde e gli opposti estremismi Di keynesblog 13 marzo 2020 5 commenti (spiegazione per sovranisti stile stampante magica da una parte, e impenitenti membri della setta dei ricardiani estinti dall’altra). 1. Fatto: ieri la presidente della BCE Christine Lagarde ha detto che non è compito della banca centrale “chiudere gli spread” tra paesi. Questo ha causato un aumento di 60 punti base dello spread tra Italia e […] Basta salari da fame: le ragioni del salario minimo Di keynesblog 10 dicembre 2019 1 Commento Da molti anni su Keynes blog proponiamo l’introduzione del salario minimo legale. In questo articolo apparso su Etica ed Economia, Marta e Simone Fana illustrano la drammatica situazione dei salari italiani e criticano le posizioni contrarie a questa ormai improrogabile riforma. di Marta Fana e Simone Fana, da eticaeconomia.it La riforma del #MES, i limiti dell’architettura dell’euro e il rischio #Italexit Di keynesblog 5 dicembre 2019 3 commenti In questi giorni si sta facendo un gran parlare della riforma del Meccanismo Europeo di Stabilità (MES o EMS in inglese), lo strumento che permette agli stati in difficoltà finanziarie di accedere a linee di credito privilegiate (ad esempio per rispondere ad una crisi bancaria). La discussione purtroppo si è subito infiammata grazie alla componente […] Flat tax, la più neoliberista delle riforme Di keynesblog 29 marzo 2019 2 commenti di Mauro Gallegati, dal Manifesto del 21.3.2019 La flat tax, un’aliquota unica per la tassazione del reddito – come c’era in Italia 100 anni fa – è un provvedimento neo-liberista, screditato dai fatti e senza giustificazione economica. Nei desiderata dei proponenti, la flat tax dovrebbe ridurre la pressione fiscale e, contemporaneamente, il debito pubblico poiché […] Dieci obiettivi contro la recessione Di keynesblog 15 febbraio 2019 3 commenti Il prof. Leonello Tronti ci ha inviato questo suo articolo in risposta ai nostri 15 punti per un programma davvero keynesiano Leonello Tronti* Rispondo volentieri alla richiesta di Keynes Blog segnalando anzitutto la piattaforma unitaria per la legge di bilancio 2019 che CGIL, CISL e UIL hanno consegnato al Governo il 22 ottobre 2018, che […] Una modesta proposta per una politica economica alternativa e realmente keynesiana Di keynesblog 12 febbraio 2019 15 commenti Serve un programma in cui il ruolo dello stato sia centrale per le politiche industriali, che sia socialista nei confronti dei deboli e liberista contro le corporazioni, i forti e i furbi. Navigazione articolo ← Articoli più vecchi"
