full_description = "1 Commento In memoria di Salvatore Biasco Pubblicato da keynesblog il 13 novembre 2023 in Economia, Italia, segnalazioni, Teoria economica Ad un anno dalla scomparsa di Salvatore Biasco, economista allievo di Paolo Sylos Labini, Maurice Dobb, Nicholas Kaldor e Hyman Minsky, la rivista Moneta e Credito ha pubblicato uno speciale in memoriam per ricordare il suo lavoro. Come sottolineato da D’Ippoliti e Roncaglia nell’introduzione “I molteplici contributi di Biasco hanno spaziato dall’economia internazionale alla finanza, passando per l’impegno politico in prima persona. Il lavoro di Biasco ha sempre sottolineato il ruolo centrale della politica economica ma anche la sua natura endogena. In contrasto con le teorie dominanti che attribuiscono le fluttuazioni economiche e le crisi a fattori esterni, Biasco considerava problematica l’idea di un equilibrio stabile di mercato. Il lavoro di Biasco ha gettato luce sull’importante impatto delle variabili finanziarie su quelle reali, ad esempio con articoli sull’endogenità dei cicli valutari e sull’importanza dei flussi lordi di capitali nel sistema monetario internazionale.” Sui cicli valutari rimandiamo in particolare al contributo di Daniela Palma, pubblicando di seguito l’abstract: Salvatore Biasco e l’instabilità dell’economia mondiale nella prospettiva dei “cicli valutari” Con il saggio su “I cicli valutari e l’economia internazionale” di fine anni Ottanta (1987), Salvatore Biasco avvia una importante riflessione teorica sul regime di fluttuazione dei cambi, confutando sulla base di un approccio keynesiano la validità dei modelli di determinazione del tasso di cambio ispirati ai principi di efficienza dei mercati finanziari. A partire da un quadro analitico di determinazione su base finanziaria del tasso di cambio nel quale le scelte di portafoglio degli operatori internazionali avvengono in condizioni di incertezza e di razionalità limitata, l’analisi mette in luce come la finanza speculativa di breve periodo amplifichi i movimenti della fluttuazione, provocando squilibri strutturali dell’economia reale, che retroagiscono sulla dinamica del cambio e concorrono a destabilizzare il quadro macroeconomico. Su questa linea interpretativa l’analisi di Biasco approda successivamente a una lettura del disequilibrio economico che ha caratterizzato la dinamica dello sviluppo mondiale fino al culmine della crisi finanziaria internazionale del 2007-2008, sottolineando il ruolo del dollaro, in quanto valuta di riferimento del sistema monetario internazionale, e il contributo dell’instabilità dei mercati valutari alla crescente fragilità finanziaria che ha investito l’economia capitalistica.Link all’articolo: https://rosa.uniroma1.it/rosa04/moneta_e_credito/article/view/18283 L’intero numero è liberamente consultabile all’indirizzo: https://rosa.uniroma1.it/rosa04/moneta_e_credito/issue/view/1663 __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3a388e6e7e', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: Salvatore Biasco Permalink In ricordo di Luigi Pasinetti Pubblicato da keynesblog il 7 febbraio 2023 in Economia Luigi Pasinetti E’ venuto a mancare alcuni giorni fa Luigi Pasinetti. Economista eterodosso, esponente della scuola sraffiana e post keynesiana, Pasinetti ha insegnato a Cambridge e alla Cattolica di Milano. I suoi contributi più rilevanti sono relativi alla distribuzione del reddito, la teoria del capitale, i modelli di crescita multisettoriale. Il suo nome è legato anche al teorema che afferma l’indipendenza del saggio di profitto dalla propensione di risparmio dei lavoratori.Per ricordarlo, segnaliamo il suo saggio “Critica della teoria neoclassica della crescita e della distribuzione” pubblicato su Moneta e Credito nel 2000. Il saggio esamina le principali teorie della distribuzione del reddito nel loro rapporto con le teorie della crescita economica. In primo luogo, viene considerato l’approccio classico, con particolare attenzione alla teoria ricardiana. Si discute poi la teoria neoclassica, evidenziandone le origini (Bohm-Bawerk, Wicksell, Clark) e il ruolo della funzione di produzione aggregata. Si ricorda poi l’emergere di una teoria “keynesiana” della distribuzione del reddito sulla scia del modello di crescita di Harrod e la sorprendente rinascita della teoria neoclassica (dopo i contributi di Solow e Meade). Ma, come mostra il paper, la teoria neoclassica della distribuzione del reddito manca di coerenza logica e ha fondamenta traballanti, come è stato rivelato dalle severe critiche mosse alla funzione di produzione neoclassica. La letteratura economica mainstream aggira questo problema semplicemente ignorandolo, mentre i modelli di crescita endogena escludono la questione della teoria della distribuzione dalla loro considerazione. Tuttavia, sebbene l’economia mainstream ignori il problema della distribuzione del reddito, si tratta di una questione troppo rilevante e una serie di nuove linee di ricerca, brevemente descritte, tentano nuovi approcci.Link: https://rosa.uniroma1.it/rosa04/moneta_e_credito/article/view/10133 __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3a388e9544', { sectionId: '370373', format: 'inread' }); }); Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink L’attualità di Keynes Pubblicato da keynesblog il 8 febbraio 2022 in Economia, Storia In occasione del decimo anniversario di Keynesblog.com, pubblichiamo questo interessante articolo di Alessandro Bellocchi e Giuseppe Travaglini, tratto da “Nuova Lettera Matematica” del Dicembre 2021. di A. Bellocchi e G. Travaglini, da “Nuova Lettera Matematica”, Dicembre 2021 “Dobbiamo inventare una saggezza nuova per una nuova era. E nel frattempo, se vogliamo fare qualcosa di buono, dobbiamo apparire eterodossi, problematici, pericolosi e disobbedienti agli occhi dei nostri progenitori”. È con queste parole che Keynes conclude nel 1925 il saggio “Sono un liberale?” consegnando ai suoi contemporanei, e a se stesso, le inevitabili domande di ordine economico, politico e sociale che nel nuovo quadro internazionale del primo Novecento si andavano delineando. Il senso ultimo di quel saggio, e la domanda che, oltre a darne il titolo, lo conclude, accompagneranno Keynes negli anni a venire fino alla stesura nel 1936 della Teoria generale dell’occupazione, dell’interesse e della moneta dove darà unitarietà e coerenza alla sua critica della moderna economia monetaria e della capacità di autoregolazione dell’economia di mercato. Continua a leggere »Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: John Maynard Keynes Permalink Nobel per l’Economia 2021: il mainstream scopre il salario minimo Pubblicato da keynesblog il 28 ottobre 2021 in Economia Alessandro Guerriero e Mattia Marasti da Kritica Economica Quest’anno il Premio Nobel per l’Economia – anche se chiamarlo Nobel è impreciso – è stato assegnato a David Card, Guido Imbens e Joshua Angrist. Mentre gli ultimi due sono stati premiati per ricerche metodologiche che hanno consentito una più sottile distinzione tra correlazione e causazione, David Card è stato premiato per i suoi contributi all’economia del lavoro. Uno dei contributi maggiori di Card alla disciplina è di sicuro il suo lavoro sul salario minimo. Giocando proprio sulle motivazioni del Nobel di quest’anno, forse è una correlazione il fatto che ha ricevuto il Nobel proprio nell’anno in cui il salario minimo è tornato a essere un tema caldo. Ne sono un esempio gli sforzi dell’amministrazione Biden per alzare a 15 dollari orari il salario minimo federale. Nel nostro paese una forma di salario minimo era stata in un primo tempo inserita nella bozza del Pnrr dal governo Conte II, salvo poi essere escluso dal governo Draghi. Per la prima volta, però, il segretario di uno dei sindacati confederali, Maurizio Landini, si è detto favorevole all’introduzione della misura. Continua a leggere »Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: David Card, Mainstream, salario minimo Permalink Il Nobel all’economista che ha scoperto che il salario minimo non crea disoccupazione Pubblicato da keynesblog il 14 ottobre 2021 in Economia, Lavoro Sin dalla nascita di Keynes Blog ci siamo occupati di salario minimo e di come sia falsa l’idea mainstream che riduca l’occupazione. Il Nobel per l’Economia di quest’anno è stato assegnato tra gli altri a David Card, uno dei due economisti che per primi hanno studiato, sperimentalmente, gli effetti del salario minimo (l’altro, Alan Krueger, è scomparso recentemente). Pubblichiamo di seguito la traduzione delle motivazioni del premio. Continua a leggere »Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: Premio Nobel, salari, salario minimo Permalink 1 Commento Anche Draghi lo certifica: per ridurre il debito pubblico bisogna aumentare il deficit Pubblicato da keynesblog il 2 ottobre 2021 in Economia Quest’anno il disavanzo dei conti pubblici sarà al 9,4% e resterà alto anche nei prossimi due. Eppure, come ci dicono le cifre del governo, il rapporto debito/Pil scenderà. E’ una dimostrazione di quanto siano state sbagliate le politiche europee e le regole – ora sospese – che le prescrivevano. Ma non è detto che questo basterà a farle cambiare di Carlo Clericetti (pubblicato su MicroMega il 30 settembre 2021) Continua a leggere »Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink 1 Commento Forti e persistenti segnali keynesiani dagli Stati Uniti Pubblicato da keynesblog il 15 Maggio 2021 in Economia Il presidente degli Stati Uniti Joe Biden Pubblichiamo l’introduzione di un brief del Council of Economic Advisers degli Stati Uniti nel quale gli economisti che assistono il presidente americano mettono nero su bianco la fine dell’ideologia neoliberista, fatta di tasse basse, deregolamentazione e riduzione della spesa sociale. L’articolo completo è linkato in fondo a questo post. Negli ultimi quattro decenni, l’idea che tasse più basse, meno spesa pubblica e minori regolamentazioni avrebbero generato una crescita economica più forte ha esercitato un’influenza sostanziale sulla politica pubblica degli Stati Uniti. Durante questo periodo, gli Stati Uniti hanno sottoinvestito in beni pubblici come le infrastrutture e l’innovazione e i guadagni dalla crescita sono maturati in modo sproporzionato per la parte superiore della distribuzione del reddito e della ricchezza. Continua a leggere »Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink 1 Commento 75 anni fa moriva John Maynard Keynes Pubblicato da keynesblog il 21 aprile 2021 in Economia, Storia Il 21 aprile 1946, esattamente 75 anni fa, moriva John Maynard Keynes. Segnaliamo la breve biografia scientifica del grande economista di Cambridge scritta da Andrea Terzi http://www.ateconomics.com/wp-content/uploads/TERZI-A-2008-John-Maynard-Keynes.pdf Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Permalink Più SURE, meno MES Pubblicato da keynesblog il 1 dicembre 2020 in Economia, Europa Alessandro Mangia, Francesco Saraceno da rivistailmulino.it Nel febbraio scorso gli Stati europei si sono trovati in prima linea nel contrastare la crisi del Covid-19 con massicci aumenti della spesa pubblica. L’Europa ha agito da facilitatore con il programma Pepp (programma di acquisto per l’emergenza pandemica) di acquisti di titoli della Bce, con la sospensione delle regole di bilancio e con programmi di prestiti mirati ad alleviare gli sforzi dei governi nel sostenere i due settori in cui gli effetti della crisi sono stati più violenti, sanità e mercato del lavoro. Nei due casi si è scelto di agire seguendo lo stesso principio: le istituzioni europee si indebitano a condizioni favorevoli per poi girare i fondi ai Paesi membri a un tasso, per alcuni di essi, inferiore a quello di mercato. Tuttavia, la scelta del veicolo è stata diversa. Per il mercato del lavoro si è scelto di ricorrere a un meccanismo nuovo, il Sure (Support to mitigate unemployment risks in an emergency); per la sanità è stato invece adattato il Mes, la banca sovrana stabilita nel 2012 per garantire la stabilità della zona euro venendo in soccorso a Paesi in difficoltà sui mercati finanziari. La scelta di adattare il Mes con una di linea di credito detta “pandemica” all’epoca era stata giustificata dall’urgenza. Nonostante le molte critiche che le operazioni del Mes hanno suscitato sin dall’inizio, si affermava che l’utilizzo di un veicolo già esistente avrebbe consentito di canalizzare rapidamente risorse verso sistemi sanitari allo stremo. Tale considerazione si è rivelata erronea, come molti avevano sottolineato fin dall’inizio. Oggi il Sure è operativo ed eroga fondi ai 17 Paesi che hanno scelto di domandarne l’assistenza, mentre nessun Paese ha fatto ricorso alla linea pandemica del Mes. Continua a leggere »Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTumblrE-mailPocketStampaMi piace Caricamento... Tag: esm, Francesco Saraceno, mes, SURE, Unione europea Permalink 3 commenti La manovra economica del governo che pare espansiva e invece non lo è Pubblicato da keynesblog il 30 ottobre 2020 in Economia di Gustavo Piga, da Il sole 24 ore del 22 ottobre 2020 Il nostro Paese ha ed avrà ancora di più nei prossimi mesi un bisogno immenso di crescita economica. Non solo per mantenersi stabile socialmente ma anche finanziariamente: una crescita solida è senza dubbio l’unico modo credibile per garantire infatti anche la discesa del rapporto debito pubblico su PIL. Il Recovery Fund doveva raggiungere proprio questo fine, dare garanzia di stabilità sociale e finanziaria, tramite il finanziamento di maggiori investimenti pubblici. Ma qualcosa sembra non stia funzionando perfettamente, almeno se consultiamo il documento fondamentale per capirne di più, la Nota di Aggiornamento al DEF recentemente pubblicata dal Ministero dell’Economia e delle Finanze. Questa include infatti tre informazioni chiave: la posizione per il 2021-2023 del Governo stabilita con il DEF in aprile, gli effetti aggiuntivi della manovra per il 2021 sul triennio e, infine, il contributo per gli anni 2021-23 dei fondi europei del Recovery. L’analisi complessiva di queste tre dimensioni ci dice della posizione fiscale del Governo e di come questa impatta sull’economia. Continua a leggere »Condividi:FacebookTwitterWhatsAppTelegramPinterestLinkedInRedditTum"
