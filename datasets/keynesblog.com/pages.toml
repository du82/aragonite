full_description = "Programma Keynesiano Basta salari da fame: le ragioni del salario minimo Di keynesblog 10 dicembre 2019 1 Commento Da molti anni su Keynes blog proponiamo l’introduzione del salario minimo legale. In questo articolo apparso su Etica ed Economia, Marta e Simone Fana illustrano la drammatica situazione dei salari italiani e criticano le posizioni contrarie a questa ormai improrogabile riforma. di Marta Fana e Simone Fana, da eticaeconomia.it __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f198bf24d', location: 120, formFactor: '001', label: { text: 'Annunci', }, creative: { reportAd: { text: 'Segnala questo annuncio', }, privacySettings: { text: 'Privacy', } } }); }); Dieci obiettivi contro la recessione Di keynesblog 15 febbraio 2019 3 commenti Il prof. Leonello Tronti ci ha inviato questo suo articolo in risposta ai nostri 15 punti per un programma davvero keynesiano Leonello Tronti* Rispondo volentieri alla richiesta di Keynes Blog segnalando anzitutto la piattaforma unitaria per la legge di bilancio 2019 che CGIL, CISL e UIL hanno consegnato al Governo il 22 ottobre 2018, che […] Una modesta proposta per una politica economica alternativa e realmente keynesiana Di keynesblog 12 febbraio 2019 15 commenti Serve un programma in cui il ruolo dello stato sia centrale per le politiche industriali, che sia socialista nei confronti dei deboli e liberista contro le corporazioni, i forti e i furbi. Navigazione articolo"
