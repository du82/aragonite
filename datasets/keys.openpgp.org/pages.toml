["https://keys.openpgp.org/about/api"]
title = "keys.openpgp.org"
full_description = "Retrieves the key with the given Fingerprint. The Fingerprint may refer to the primary key, or any subkey. Hexadecimal digits MUST be uppercase, and MUST NOT be prefixed with 0x. The returned key is ASCII Armored, and has a content-type of application/pgp-keys. Retrieves the key with the given long KeyID. The KeyID may refer to the primary key, or any subkey. Hexadecimal digits MUST be uppercase, and MUST NOT be prefixed with 0x. The returned key is ASCII Armored, and has a content-type of application/pgp-keys. Retrieves the key with the given Email Address. Only exact matches are accepted. Lookup by email address requires opt-in by the owner of the email address. The returned key is ASCII Armored, and has a content-type of application/pgp-keys. A single key may be submitted using a POST request to /vks/v1/upload. The body of the request must be application/json. The JSON data must contain a single field keytext, which must contain the keys to submit. The value of keytext can be formatted in standard OpenPGP ASCII Armor, or base64. The returned JSON data contains the fields token, key_fpr, and status. The token field contains an opaque value, which can be used to perform request-verify requests (see below). The key_fpr field contains the fingerprint of the uploaded primary key. The status token contains a map of email addresses contained in the key, with one of the values unpublished, published, revoked, or pending, indicating the status of this email address. A key that has been uploaded can be made discoverable by one or more of its email addresses by proving ownership of the address via a verification email. This endpoint requests verification for one or more email addresses. The body of the request must be application/json. The JSON data must include the opaque token value (obtained via /vks/v1/upload) and an addresses field, which is a list of email addresses (not full User IDs) to request verification mails for. It can optionally include a locale field, which is list of locales, ordered by preference, which to use for the verification email. The reply will be the same as for the /vks/v1/upload endpoint, with addresses marked as pending where a verification email has been sent."
year_published = 2025
clearnet = "https://keys.openpgp.org/about/api"
