["https://keys.openpgp.org/about/faq"]
title = "keys.openpgp.org"
full_description = '''No. The federation model of the SKS pool has various problems in terms of reliability, abuse-resistance, privacy, and usability. We might do something similar to it, but keys.openpgp.org will never be part of the SKS pool itself. For the moment, no. We do plan to decentralize keys.openpgp.org at some point. With multiple servers run by independent operators, we can hopefully improve the reliability of this service even further. Several folks offered to help out by "running a Hagrid server instance". We very much appreciate the offer, but we will probably never have an "open" federation model like SKS, where everyone can run an instance and become part of a "pool". This is for two reasons: We require explicit consent to distribute identity information. Identities that aren't email addresses, such as pictures or website URLs, offer no simple way for us to acquire this consent. Note: Some OpenPGP software creates keys with incorrectly formatted email addresses. These addresses might not be recognized correctly on keys.openpgp.org. An email address can only be associated with a single key. When an address is verified for a new key, it will no longer appear in any key for which it was previously verified. Non-identity information will still be distributed for all keys. This means a search by email address will only return a single key, not multiple candidates. This eliminates an impossible choice for the user ("Which key is the right one?"), and makes key discovery by email much more convenient. We use a modern standard called MTA-STS, combined with STARTTLS Everywhere by the EFF, to make sure verification emails are sent out securely. This protects against eavesdropping and interception during delivery. The MTA-STS mechanism only works if supported by the recipient's email provider. Otherwise, emails will be delivered as usual. You can run this test to see if your email provider supports it. If the "MTA-STS" entry on the left isn't a green checkmark, please ask your provider to update their configuration.'''
year_published = 2025
clearnet = "https://keys.openpgp.org/about/faq"
