["https://keys.openpgp.org/about/usage"]
title = "keys.openpgp.org"
full_description = "On this page, we collect information on how to use keys.openpgp.org with different OpenPGP software products. We are still in the process of adding more. If you are missing some, please write to us and we'll try to add it. Keys can be uploaded with GnuPG's --send-keys command, but identity information can't be verified that way to make the key searchable by email address (what does this mean?). This configuration is no longer necessary, but prevents regular certificates from working. It is recommended to simply remove this line from the configuration. For users who want to be extra careful, keys.openpgp.org can be reached anonymously as an onion service. If you have Tor installed, use the following configuration: The Web Key Directory (WKD) is a standard for discovery of OpenPGP keys by email address, via the domain of its email provider. It is used to discover unknown keys in some email clients, such as GpgOL. keys.openpgp.org can be used as a managed WKD service for any domain. To do so, the domain simply needs a CNAME record that delegates its openpgpkey subdomain to wkd.keys.openpgp.org. It should be possible to do this in the web interface of any DNS hoster. Once enabled for a domain, its verified addresses will automatically be available for lookup via WKD. Missing a guide for your favorite implementation? This site is a work-in-progress, and we are looking to improve it. Drop us a line at support at keys dot openpgp dot org if you want to help out!"
year_published = 2025
