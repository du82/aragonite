["https://keys.openpgp.org/about/news"]
title = "keys.openpgp.org"
full_description = "It's been quite a while since the last update. Not a lot happened around keys.openpgp.org during this time, operationally. 😴 But no news is good news in this case: A few bugs were fixed, some software maintenance was perfomed to keep up with the ecosystem. There were no significant outages, we've had some steady growth of users, things are generally working as expected. Hurray! There is, however, an important bit of news: keys.openpgp.org has a governance process now. In particular, there is now a written constitution for the service, which you can find here. Most importantly, there is now a board, who were elected by a community of contributors to the OpenPGP ecosystem. This board currently consists of: The primary responsibility of the board is to make decisions on the future of keys.openpgp.org. Which features should go in, which not? We are having regular meetings at the moment, and progress is slow but steady. We'll be sure to let you know (via this news blog) when anything exciting happens! You can find more info about governance in the repository. You can also reach the board via email at board at keys.openpgp.org. Thanks to everyone using this service! And thanks especially to those who have provided us with feedback, translations, or even code contributions! If you would like to see keys.openpgp.org translated into your native language, please join the translation team over on Transifex. We would appreciate help especially for Russian, Italian, Polish and Dutch. It has been three months now since we launched keys.openpgp.org. We are happy to report: It has been a resounding success! 🥳 The keys.openpgp.org keyserver has been received very well by users, and clients are adopting it rapidly. It is now used by default in GPGTools, Enigmail, OpenKeychain, GPGSync, Debian, NixOS, and others. Many tutorials have also been updated, pointing users our way. A special shout-out here goes to GPGTools for macOS. They implemented the update process so smoothly, the number of verified addresses completely exploded when they released their update."
year_published = 2025
clearnet = "https://keys.openpgp.org/about/news"
