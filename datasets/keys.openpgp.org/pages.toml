["https://keys.openpgp.org/about/privacy"]
title = "keys.openpgp.org"
full_description = "keys.openpgp.org is a community effort. You can find more information about us, and our contact, details here. The public keyserver running on keys.openpgp.org processes, stores, and distributes OpenPGP certificate data. The specific way in which data is processed differs by type as follows: Email addresses of individuals contained in User IDs are personal data. Special care is taken to make sure they are used only with consent, which you can withdraw at any time: We process the cryptographic content of OpenPGP certificates - such as public key material, self-signatures, and revocation signatures – for the legitimate interest of providing the service. This data is not usually collectively available (“as a dump“), but may be handed upon request to third parties for purposes of development or research. If you upload your OpenPGP certificates to the service, you are the source of this data. It is also possible for anyone who has your public OpenPGP certificate to upload them to this service – for example, if you have published them somewhere else, or sent them to someone. This does not include publication of Email Addresses, which are only used with explicit consent as described above. An OpenPGP certificate may contain personal data other than email addresses, such as User IDs that do not contain email addresses, or image attributes. This data is stripped during upload and never stored, processed, or distributed in any way. OpenPGP packet types that were not specifically mentioned above are stripped during upload and never stored, processed or distributed in any way. Data is never relayed to third parties outside of what is available from the public API interfaces, and what is described in this policy and on our about page. This service is available on the Internet, so anyone, anywhere in the world, can access it and retrieve data from it. We will retain your email address linked with your OpenPGP certificates until you remove it. We will remove your Public Key Data if you wish, but note that anyone can re-upload it to the service, in keeping with the “public” nature of this key material."
year_published = 2025
clearnet = "https://keys.openpgp.org/about/privacy"
