title = "Khroma - The AI color tool for designers"
description = "Khroma is the fastest way to discover, search, and save color combos and palettes you'll love."
full_description = "You can search for either hues or types, e.g. red or pastel. You can also mix hues and types e.g. muted yellow or neon blue Single color searches will produce a second color randomly. To search for a second color, connect the first one using with, and, on, &, +. For example: muted & neon violet. Not happy with the results? You can go back and edit your training colors. This will reset your current generator. Edit color selection This contains your personal generator and favorites. Upload on the training page to use your Khroma on other devices or browers. Awesome stuff is on the way: User accounts, manage and share collections, custom templates, sketch plugin, algorithm improvements, and more."
