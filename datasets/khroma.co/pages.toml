["http://www.khroma.co"]
title = "Khroma - AI Color Tool for Designers | Discover and Save Color Palettes"
description = "Khroma is the fastest way to discover, search, and save color combos and palettes you'll love. Discover a personalized AI-powered color tool for designers to find the perfect color scheme."
full_description = "By choosing a set of colors, you'll train a neural network powered algorithm to generate colors you like and block ones you don’t, right in your browser. Khroma has learned from thousands of the most popular human-made palettes accross the internet to produce great combos which you can view as typography, gradient, palette, or custom image. Got something in mind? Khroma's search allows you to search and filter the generator by hue, tint, value, color, as well as hex and rgb values. Create an unlimited library of your favorite combos to reference later. Get color names, hexcodes, rgb values, CSS code, and WCAG accessibility rating of each pair."
