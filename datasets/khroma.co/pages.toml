["https://khroma.co/train"]
title = "Khroma - The AI color tool for designers"
description = "Khroma is the fastest way to discover, search, and save color combos and palettes you'll love."
full_description = "These colors will be used to train a color generator algorthim personalized to you. For best results, choose a wide variety of hues, values, and saturations. Happy picking! Note: For this beta, your data will be saved in localstorage which is only accessible in this browser on this device. You can download/transfer your data later. Yes, 50 sounds like a lot, but quantity ensures Khroma does't mistakenly think you don't like colors you do. The wider the variety, the more possible combinations you'll get!"
