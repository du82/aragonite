full_description = "Selected question Wie werden auf einem Planet mit dezentralen, freien und solidarischen Gesellschaften globale Entscheidungen getroffen? 4 Theses Thesis 1, children below [A] Nach ausführlicher digitaler Diskussion aller Interessierten des Planeten wird digital abgestimmt. Für eine Entscheidung ist eine hohe Mehrheit von z.B. 90% erforderlich. Thesis 2, children below [B] Der Planet ist mehrstufig föderal strukturiert (z.B. Kontinente, Sprachraumgebiete, Regionen). Delegierte mit imperativem Mandat aus den föderierten Gebieten treffen sich und treffen eine Entscheidung im Sinne der delegierenden Gebiete. Thesis 3, children below [C] Je nach Art der Entscheidung wird ein Expert_innenkomitee zusammengestellt (im Konsens oder mit hoher Mehrheit aller Interessierten). Die Expert_innen legen die Fakten anschaulich dar und treffen die Entscheidung. Thesis 4, children below Eine Kombination aus [A], [B] und [C]: Ein Expert_innenkomitee bereitet die Entscheidung durch Bereitstellung von Informationen und einer Empfehlung vor. Es gibt eine globale digitale Diskussion aller Interessierten und danach eine online Abstimmung. Die Delegierten der Föderation entscheiden im Konsens. Nur wenn alle drei Entscheidungswege zum gleichen Ergebnis kommen, wird die Entscheidung umgesetzt. Andernfalls wird weiter diskutiert und/oder die Entscheidungsfrage verändert."
