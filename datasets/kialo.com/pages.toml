description = "Public school classrooms are mandated, sanctioned, and funded by the state. Teachers do not have the right to violate this sanctity with their religious…"
full_description = 'Selected claim, supporting its parent Public school classrooms are mandated, sanctioned, and funded by the state. Teachers do not have the right to violate this sanctity with their religious symbols. Pros Cons Pro claim 1, children below A school that employs a significant number of teachers wearing religious symbols could give off the impression of being a religious school. Pro claim 2, children below Teachers should not be able to manipulate the religious beliefs of children in a public school setting. Pro claim 3, children below Students come from a wide variety of religious backgrounds. If teachers wear religious symbols, students could feel pressured or intimidated into suppressing their own expression of their faith because the authority figure appears to support a different religious view. Con claim 1, children below Limiting constitutional rights requires a very high threshold that is simply not met by the quite minor potential for a religious symbol (that is not indecent or obscene) worn by a teacher to influence students. Con claim 2, children below As long as teachers are not proselytising their beliefs, it should not matter. Con claim 3 The assertion: "teachers should not be allowed to wear religious symbols at school" also refers to private schools, therefore, an argument based purely on public school classrooms is not conclusive whatsoever. Con claim 4 Limiting the ability to wear religious symbols violates basic human rights such as the freedom of religion and expression. Not allowing the teachers to wear religious symbols may cause potential strikes and protests. Even if wearing religious symbols is not allowed, there may be some schools that support certain religions such as Presbyterian school, making it futile to ban these religious symbols'
year_published = 2018
year_updated = 2024
