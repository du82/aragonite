full_description = "Selected claim, opposing its parent American football is too economically important to ban. Pros Cons Pro claim 1, children below With over 25 billion dollars in revenue, the NFL is the largest and economically most important sport in the US. Pro claim 2, children below Football broadcasting rights are critical to the business model for traditional broadcasters trying to compete with streaming services. Pro claim 3, children below Division I football has been found to have a positive impact on state GDP. Pro claim 4, children below College football programs generate revenue for universities. Con claim 1, children below While football plays a large role in the economy, it is still only a fraction of the sports economy ($75 billion dollars in 2019). Con claim 2, children below It is reasonable to assume that a good deal of football spending would move to other areas of the sports economy, and not simply disappear. Con claim 3, children below Historically, the size of the sports economy has been eclipsed by the size of the (until recently largely illegal) sports betting economy. Sports betting is very likely to have an overall negative impact on the economy. Con claim 4, children below The United States spends more per student on football than on mathematics. This misplaced prioritization damages America's economic competitiveness."
