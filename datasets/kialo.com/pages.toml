["https://kialo.com/lawenforcementguidelines"]
title = "Law Enforcement Guidelines | Kialo"
description = "The Law Enforcement Guidelines of Kialo"
full_description = "KIALO LAW ENFORCEMENT GUIDELINES What is Kialo? Kialo is a platform for users to have discussions about topics that matter. Users may post a brief public profile on our website and contribute to debates. Debates are private by default, but users can choose to share them with a limited group or make them available to the public. What Information Kialo Has We collect a limited amount of data from and about our users. This information includes: Contributions that users make to debates. Information users provide about themselves ( e.g., user name, email address, and—if voluntarily provided—a user’s real name, photo, short bio, and social networking accounts). Data about the device, software, and operating system used when accessing Kialo. Internet Protocol addresses. The date and time of requests a user makes to Kialo that yield errors. The name of external devices, file types transferred, and number and size of files transferred while using Kialo. This data is only logged where a request yields errors. Communications between users and Kialo, such as customer service and support inquiries. Email addresses of friends or colleagues that users refer to Kialo. Legal Requirements For Seeking Private Information or Content We disclose account records only as required by applicable law, including the Stored Communications Act, 18 U.S.C. §§ 2701-2712. Private User Information. We only release non-public information about our users in response to valid legal process or a valid emergency request (see below). A valid subpoena issued in connection with an official criminal investigation is required to compel the disclosure of basic subscriber records as defined in 18 U.S.C. § 2703(c)(2). This information may include the name a user provided when signing up for Kialo, the IP address from which the user created their account, the user’s email address, and length of service. A court order issued under 18 U.S.C. § 2703(d) is required to compel the disclosure of other records or information pertaining to the account—not including contents of communications. A 2703(d) court order may also compel disclosure of the basic subscriber records identified above. Contents of Communications. A search warrant issued under the Federal Rules of Criminal Procedure or equivalent state warrant is required for Kialo to disclose the contents of user communications or posts. This includes private debates, communications between users and Kialo, and any other material that users may produce on the service. Please note that Kialo is not permitted by law to disclose contents of user communications to private parties pursuant to civil subpoenas. 18 U.S.C. § 2702. We may provide non-content customer records in response to a valid civil subpoena under appropriate circumstances. User Notice If Kialo is going to release a user’s information, our policy is to provide the user with notice unless we are prohibited from doing so by law or court order (e.g., an order under 18 U.S.C. § 2705(b)). We may disclose users’ information without providing them with prior notice if we believe it’s necessary to prevent imminent and serious bodily harm to a person. Emergency Situations If there is an emergency that involves the danger of death or serious physical harm that Kialo may have information necessary to prevent, law enforcement officers may make an emergency disclosure request via email. All emergency requests must be on law enforcement letterhead and signed by the requesting officer. In order for us to process your emergency request, you must include the following in addition to the information outlined under “Submitting Requests” below. An indication that you are making an emergency request. The identity of the person who is in danger of death or serious physical injury. The kind of emergency. Any specific information requested and why its disclosure is necessary to prevent the harm. Any other details and context that may aid us in making a decision. Preservation Requests Upon receipt of a valid preservation request, we’ll preserve a temporary snapshot of specific account records for 90 days pending service of legal process. We will not disclose those account records until we have received valid legal process. Preservation requests, in accordance with applicable law, should be signed by the requesting official, and include the law enforcement information covered below under “Submitting Requests.” Submitting Requests All requests for user information must include: Either the email address of a user or their username; Details of the specific information being requested and its relationship to an investigation; Requester’s name, title, agency, office, official email address, and direct phone number; and Deadline to respond. Law enforcement may submit requests to Kialo at lawenforcement@kialo.com. Kialo’s acceptance of legal process by this means is for convenience and does not waive any objections, including lack of jurisdiction or proper service. Mutual Legal Assistance Treaties Kialo’s policy is to promptly respond to requests that are issued via U.S. court upon proper service of process either by way of a mutual legal assistance treaty or letter rogatory."
year_published = 2025
