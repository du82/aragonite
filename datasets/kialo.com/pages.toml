title = "Should scientists contribute to Wikipedia? | Kialo"
description = "Wikipedia is an open, general encyclopedia, written and edited by anyone who wishes to participate. Since its establishment in 2001, it has grown to contain…"
full_description = "Selected thesis Should scientists contribute to Wikipedia within their broader area of research? Pros Cons Pro claim 1, children below Scientists have a responsibility to make their findings easily accessible. Pro claim 2, children below Scientists are usually the most knowledgeable persons in their respective fields of research. Pro claim 3, children below One of the jobs of scientists is to communicate their knowledge to the public, Wikipedia is an excellent way of doing so. Pro claim 4, children below Scientists often have a balanced and highly analytical view of the world. Pro claim 5, children below Policy makers who are unfamiliar with a topic may consult Wikipedia to get an overview or learn about a topic relevant to their policy- and decision-making. Hence, it is both important that science information on Wikipedia is of high-quality and scientific contributions to it can have a positive impact on policy. Pro claim 6, children below Wikipedia needs more science-related images to help illustrate scientific subjects. Only scientists have the ability to license study images under CC-BY which enables Wikipedians to add them to articles. Doing so could also be considered to be contributing to Wikipedia. Pro claim 7, children below Wikipedia needs technical contributions from computer scientists and related engineers. Pro claim 8, children below There are lots of very large gaps in Wikipedia's coverage of scientific and science-related topics. Moreover, there are projects dedicated to science contents for scientists to get some help, find places to help, find guidance, prioritize, and so on – most notably WikiProject Science. Pro claim 9, children below Scientists benefit from making editing Wikipedia their hobby. Pro claim 10, children below Scientists have developed and are developing various skills and expertise and this is a place where one's skills will be valued and contribute to society. Con claim 1, children below The state of the art in a field of research should be published in review-papers. Con claim 2, children below Individual contributions to Wikipedia might not help to promote a scientist's career. Con claim 3, children below Scientists will tend to promote their own research and thus are violating the neutrality standards of Wikipedia. Con claim 4, children below Scientists should focus on creating novel research results. Con claim 5, children below Due to it's collaborative nature, Wikipedia is not the right platform for scientists to publish content. Con claim 6, children below Scientists in their respective fields are often biased and favor specific approaches or theories that are not necessarily representative of the field as a whole Con claim 7, children below Even with the massive donations Wikipedia receives, it's unlikely that scientists would receive any of it. So that means they would be working for free, which they shouldn't be put in that unfair position just because they're an expert."
