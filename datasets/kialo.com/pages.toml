description = "The risk of government abuse by outlawing fake news is high."
full_description = '''Selected claim, opposing its parent The risk of government abuse by outlawing fake news is high. Pros Cons Pro claim 1, children below If fake news is made illegal, the government will control the media; this poses several problems. Pro claim 2, children below Making fake news illegal can pose a threat to informational freedom and human rights. Pro claim 3 What counts as fake news and what doesn't is subjective. What to some people is misleading information, to others is the objective truth. Therefore, this will only lead to censorship. For example, countries like Russia will ban what they believe to be "fake" news i.e. Western media while the US will ban Chinese and Russian national media, leading to polarization of media. Con claim 1, children below In a democracy, the government represents the people, so it would be the people's choice to outlaw misinformation. Con claim 2, children below It may be possible to eliminate fake news without allowing government abuse.'''
