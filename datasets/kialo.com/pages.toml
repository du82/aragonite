full_description = "Selected claim, supporting its parent EU states have a shared moral responsibility to help asylum seekers, which includes partaking in a quota system. Pros Cons Pro claim 1, children below The EU owes a duty to refugees fleeing from crisis zones that owe much of their current troubles to a debilitating process of colonization conducted by many EU member states in the 19th and 20th centuries. Pro claim 2, children below The laws and treaties followed by the countries in the EU require them to help asylum seekers. Pro claim 3, children below There is a moral duty to allow asylum seekers in need to live in safety in the EU. Con claim 1, children below The quota scheme - in its currently discussed form - would only apply to people with a good chance of receiving asylum. It would not apply to the many irregular arrivals who have little prospect of receiving protected status. Therefore, the scheme would fail to adequately share the responsibility for dealing with the migrant crisis amongst European states. Con claim 2, children below Central and eastern European states are already saturated taking in a huge number of both refugees and migrants from Ukraine. Con claim 3, children below The primary obligation that EU member states owe is to their own citizenry who have voted the political leadership into office to protect and advance their interests."
