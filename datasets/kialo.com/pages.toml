full_description = "Selected thesis A further referendum should be held on Brexit Pros Cons Pro claim 1, children below People with a legitimate and immediate interest in the result of the referendum (especially EU citizens, UK citizens resident in other EU countries) were not included in the franchise. Pro claim 2, children below In the previous vote the details of what Brexit means were unclear. Pro claim 3, children below David Cameron did not initiate the EU referendum with the caveat that the British people are never allowed to change their minds, nor that they would never be allowed to re-evaluate the decision once made. Pro claim 4, children below The 'Leave' campaign has been subject to heavy criticism of their dealings in the lead-up to the election. Pro claim 5, children below The result was very close to 50-50, with a lot of leave voters expressing their remorse. With the result being so close to a tie, another referendum should be held until a larger percentage of the population is in agreement. Pro claim 6, children below Parliament itself is hopelessly divided and a constitutional crisis may be avoided by a second referendum. Con claim 1, children below A decision has been made. One cannot continue to hold referendums until the result is acceptable. Con claim 2, children below Article 50 has been invoked, Britain will leave the EU whatever the result of a second referendum. Con claim 3, children below We are in a representative democracy for a reason, where the parliament is called upon to decide for the common good. Passing the buck to the population means only taking away the responsibility of making that decision. A second referendum would be a mistake as the first one. Con claim 4, children below If Parliament cements the perception that it knows better than the electorate it is supposed to serve by instituting a second referendum, there will be irrevocable damage to our democracy. If it were to be called the first manifestation of this could be a 