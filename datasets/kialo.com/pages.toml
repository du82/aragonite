["https://www.kialo.com/tour"]
title = "Debate platform powered by reason – A tour of Kialo | Kialo"
description = "Kialo cuts through the noise typically associated with social and online media, making it easy to engage in focused debate and discussion."
full_description = "A debate platform powered by reason Kialo cuts through the noise typically associated with social and online media, making it easy to engage in focused discussion. How does Kialo work? Map discussions, see complex issues clearly Kialo enables you to visualize discussions as an interactive tree of pro and con arguments. At the top is the thesis, which is supported or weakened by pro and con arguments underneath. Each one of these arguments can branch into subsequent arguments that support or attack them in turn. Start a discussion New discussions are private by default and can be seen only by you. Simply write a brief description, set up your thesis (or theses) and add an image. Invite people After creating a discussion, invite others to debate and contribute. Publish the discussion to make it available publicly to all Kialo users. Rate arguments based on their impact Rate theses and all the arguments contained underneath by their impact on their parent argument. Impact Meters indicate these ratings to move impactful arguments to the top. See how the other side thinks By switching Perspective, you can see the entire discussion tree through the eyes of different individuals, opponents or groups to better understand their thinking. Link arguments to multiple locations Easily link arguments – along with any child arguments underneath – to multiple locations. Changes to linked arguments are reflected in all locations. Collaborate without cluttering the discussion Comments remain outside of the official discussion, so you can talk with other people about problems with wording, make suggestions or ask questions about an argument. Review changes, catch up quickly Track all the different types of changes made in a discussion by clicking the blue icons. Pick up where you left off each time you come back to a discussion. Create your own discussion team Kialo enables you to set up teams, invite users, and create discussions that only other team members can see. You can also invite your team to existing discussions. Join the discussion Explore"
