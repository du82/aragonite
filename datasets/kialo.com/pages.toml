["https://www.kialo.com/atlantis-was-an-existing-place-and-can-be-found-41721"]
title = "Atlantis was an existing place and can be found | Kialo"
description = 'For detailed research about the topic please go to: atlantis-together.com  The most likely location is the Richat Structure, called "The Eye of the Sahara",…'
full_description = '''Selected thesis Atlantis was an existing place and it can be found. Global Research: atlantis-together.com/research Pros Cons Pro claim 1 It matches Plato's description very accurately Pro claim 2 The area could be an island if the sealevel would be higher (or the ground level lower) Pro claim 3 The Sahara was green full of rivers and lakes around 12000 BC Pro claim 4 Most cultures talks about a cataclysm and huge flood which happened long time ago. Nasa Research: "11,500-11,000 years ago, when sea level may have jumped by 28 m" Seems like that huge flood did truly happen. Pro claim 5 "Atlantis nesos" (Ἀτλαντὶς νῆσος), literally means "Atlas's Island" Pro claim 6 Huge animals (giant deer and woolly mammoth) extinct also around 12.000 BC Might've happened because of the flood? Pro claim 7 it is difficult to pinpoint such location as where this could be precisely with the technology we have at the moment once feasible may be possible Pro claim 8 This may have been true at one point since the land masses have moved around over the last millions of years Pro claim 9 There are lost Islands in the North sea which could possibly account for a legendary lost continent. livescience.com Pro claim 10 One should seperate the possibility of a once existing (is)land maybe called Atlantis, and the fiction/tales/legends attributed to it. Pro claim 11, children below Except from Plato, Diodorus Siculus also mentions the Atlantians in his 3rd book and places them on the West African region as a Nation in war with the Amazons of Libya. He also mentions the most famous son of Atlas Hesperos died at the Atlas mountains. Also in the legends of Hercules, he is tasked to steal the apples of Hesperides. Hespera>meaning where the sun sets in greek>west. Coincidentally western Africa was also called maghreb by the arabs again meaning where the sun sets. Pro claim 12 Atlantis is found underwater, and about approximately 5% of the seawaters are explored within. Con claim 1 The whole area is around 400 m above sealevel Con claim 2 There is no evidence (yet) which supports this claim Con claim 3 This may just be a mythological creation like big foot Con claim 4, children below Sometimes fantasys seem like something to go after and we do all we can to prove this is the case -- confirmation bias -- regardless of the data Con claim 5 Plato was writing philosophical dialogues and scholars do not think that the stories he told were intended to be read as histories. Con claim 6 Plato made it clear that it was an island and that it sunk. Richat is nowhere near the sea. Con claim 7 Plato said that Atlantis was in the ocean, west from the Pillars of Heracles. Richat is south of the Pillars. Con claim 8 Plato said that after the island sunk, the sea became impassable, suggesting that the ground did not sink much, making the area unsuitable for navigation. Con claim 9 Atlantis became rich thanks to its iron, copper and gold deposits. Ancient Egyptians would have known of these resources and traded with the locals had that been the case. No such mining and trading ever happened. Egyptians were buying tin in Cornwall, surely they would have traded with Mauritania if they knew of its deposits.'''
