["https://kialo.com/copyright"]
title = "Copyright | Kialo"
description = "The Copyright and DMCA Policy of Kialo"
full_description = "KIALO COPYRIGHT AND DMCA POLICY This policy explains how Kialo responds to claims of the unauthorized use of copyrighted text, images, or links to allegedly infringing materials under the Digital Millennium Copyright Act (“DMCA”). The Digital Millennium Copyright Act Section 512 of the DMCA sets out the legal requirements to formally report copyright infringement to a service provider like Kialo. It also explains how the person who posted the content can oppose a notice of alleged infringement by submitting a counter-notice. Do You Have Rights in a Copyrighted Work? Please think carefully before sending us a copyright notice or counter-notice, because the DMCA imposes legal and financial penalties for making fraudulent or bad-faith claims. If you aren’t sure whether you’re the actual copyright holder or if you’re authorized to act on a rights holder’s behalf, check with an attorney before submitting a copyright notice or counter-notice to us. How To Submit a Copyright Notice To send us a notice concerning copyright infringement, you’ll need to provide Kialo the following information: A physical or electronic signature of the copyright owner or a person authorized to act on their behalf (typing your full name will do); Identification of the copyrighted work claimed to have been infringed ( e.g., a copy of or link to your original work or clear description of the materials allegedly being infringed); Identification of the infringing material and information reasonably sufficient to permit Kialo to locate the material on our services ( e.g., a link to the infringing material); Your contact information, including your address, telephone number, and an email address; A statement that you have a good-faith belief that the use of the material in the manner asserted is not authorized by the copyright owner, its agent, or the law; and A statement that the information in the notification is accurate, and, under penalty of perjury, that you are authorized to act on behalf of the copyright owner. You can report alleged copyright infringement by emailing the above information to copyright@kialo.com or (646) 568-9853. You can also mail a copyright notice to: Kialo Inc.Attn: DMCA Agent18 Bridge Street, Ste 4aBrooklyn, NY 11201 How Kialo Responds to Copyright Claims Kialo’s response to notices of alleged copyright infringement may include removing or restricting access to allegedly infringing material. If we remove or restrict access to content in response to a copyright notice, we’ll make a good-faith effort to get in touch with the affected account holder to provide information about the situation, including a copy of the takedown notice and instructions for filing a counter-notification. We will also forward a copy of the copyright notice to Lumen. When You Receive Word of a DMCA Notice If you get a message from us about a DMCA complaint, it means that the content identified in the notice has been removed from Kialo or access to the content on Kialo has been restricted. Please read our message carefully, because it’ll include information about the copyright notice we received and instructions about how to file a counter-notice. How to File a Counter-Notice If you receive a DMCA notification about material you’ve posted and believe that material was misidentified or removed in error, you can file a counter-notice by following the instructions below. To submit a counter-notice, please send us the following information: A physical or electronic signature (typing your full name will do); Identification of the material that has been removed or to which access has been disabled and the location at which the material appeared before it was removed or access to it was disabled (the description from the DMCA notice is enough); A statement under penalty of perjury that you have a good-faith belief that the material was removed or disabled as a result of mistake or misidentification of the material to be removed or disabled; and Your name, address, and telephone number, and a statement that you consent to the jurisdiction of the federal district court for the judicial district in which your address is located, or if your address is outside of the United States, for any judicial district in which Kialo may be found, and that you will accept service of process from the person who provided the copyright notification or an agent of such person. To submit a counter-notice, please respond to our original email letting you know about the removal, and include the above information in the body of your reply. Note: If you re-post material removed in response to a DMCA notification, we may permanently suspend your account. If you believe content was removed in error, please consider filing a counter-notice instead of re-posting the material. After You Submit a Counter-Notice When we receive a valid counter-notice, we’ll promptly forward a copy to the person who sent us the copyright notice. If we aren’t told within 10 business days that the original reporter is seeking a court order to prevent further infringement of the material, we may replace or cease disabling access to the material that was removed. Repeat Infringer Policy Where appropriate, Kialo may warn and suspend repeat infringers. In more serious cases, we may permanently terminate user accounts. Contact We would love to hear from you. Kialo welcomes questions, concerns, and feedback about this policy. If you have suggestions for us, let us know at copyright@kialo.com."
