title = "Should Election Campaigns only be Funded by the Government? | Kialo"
description = "“One of the major challenges to democratic progress”, identified by the 2012 report of the Global Commission on Elections, Democracy and Security “is the need…"
full_description = "Selected thesis Election campaigns should only be funded by the government. Pros Cons Pro claim 1, children below Privately funded elections make it harder for people from less privileged backgrounds to become politicians. Pro claim 2, children below When corporations and wealthy elites are no longer allowed to donate to election campaigns, politicians will not be beholden to their interests. Pro claim 3, children below If each political party gets the same amount of money to spend on elections, smaller parties will be in a position to compete with larger and more entrenched parties. Pro claim 4, children below If elections are not publicly financed, elected politicians have to spend significant amounts of time raising money from donors in order to get re-elected. Con claim 1, children below Citizens have the right to donate to the election campaigns of political parties, which they are deprived of if only governments fund election campaigns. Con claim 2, children below State-funded election campaigns increase the burden on the taxpayer. Con claim 3, children below The public funding of elections further polarises politics by facilitating the rise of parties which are fundamentally opposed to each other and cannot find grounds for compromise. Con claim 4, children below Public funding is unlikely to be allocated fairly across political parties."
