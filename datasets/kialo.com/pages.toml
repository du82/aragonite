title = "Should people with harmful genetic disorders be prevented… | Kialo"
description = "Some people argue for preventing transmission of debilitating conditions, prioritizing well-being. Others emphasize reproductive autonomy, citing advancements…"
full_description = "Selected thesis Society should strongly inhibit people with harmful genetic disorders from reproducing. Pros Cons Pro claim 1, children below Prevents potential suffering for individuals and generations of offspring or the likelihood for such when born as a human. Pro claim 2, children below Reduces potential burden on healthcare systems. Pro claim 3 It may be a way of rationality-based or directed human evolution rather than undirected evolution that could select for traits that are detrimental such as tendencies for diseases that cause early death or not beneficial. Pro claim 4 Antinatalist and overpopulation-related arguments would support measures that inhibit or reduce reproduction at the current size of the human population. Con claim 1, children below Infringes on reproductive rights. Con claim 2, children below May lead to stigmatization of individuals. Con claim 3, children below Limiting reproduction based on genetics might overlook potential contributions or unique strengths these individuals could offer society. Con claim 4, children below Genetic disorders may be fixable in the future using various kinds of gene therapies or be substantially treatable using more conventional therapies. Con claim 5, children below There are ways people with genetic disorders can reproduce without passing on heritable disorders. Con claim 6 Preventing people with genetic disorders from reproducing, could limit the genetic evolution of humankind. What is currently a negative could lead to something more beneficial in the many generations to come. Con claim 7 Eugenics is a bad idea, it tends to be corrupted by racism Con claim 8, children below There are better alternatives to disallowing people with some genetic disorders to reproduce such as educating these people on their responsibility, the likely caused suffering, methods of contraception, and options like child adoption alongside measures to disincentive and discourage them from reproducing. Con claim 9, children below A life, even if hindered by a genetic disability, is infinitely more valuable and enjoyable than one that never existed. Con claim 10, children below Identifying and distinguishing genetic disorders that should be prohibited from those that shouldn't would be difficult and could be problematic as limiting prohibition to only a subset of well-established genetic disorders would be necessary. Con claim 11, children below Many genetic disorders or tendencies for them are not actually inherited – one could instead use prenatal testing to detect actually inherited problematic disorders and abort the fetus if such has been detected. Con claim 12 One could instead use preimplantation genetic diagnosis to select from embryos prior to implantation which also avoids selective abortion. Con claim 13, children below People with such genetic disorders should decide so fully on their own with no actions taken by society. Con claim 14 It could normalize eugenical measures, causing overreach, oppression and harm."
