title = "Open source software is better. | Kialo"
description = "Open source (FOSS) software is software which source code is open to view and to be edited by everyone. It is always free and most of open source software is…"
full_description = '''Selected thesis Open source software is better and more secure. Pros Cons Pro claim 1, children below Open source software usually does not cost the end user any money. Pro claim 2, children below The free and opensource software defends the original values of Internet. Pro claim 3, children below Without a wide audience of impartial reviewers such as open source software has, users must fully trust a corporate entity who may not have the users best interest in mind. Pro claim 4, children below Open source software benefits the tech world. Pro claim 5, children below FOSS allows more rapid or extensive development than closed source because more people can get involved and more of the code can be changed, rather than only extensions that use its APIs. Pro claim 6, children below FOSS accelerates innovation because other developers can build upon, readily reuse and get inspired by existing code. Pro claim 7, children below Open source benefits the science world and scientific progress. Pro claim 8, children below When there is a free and open source software and an equivalent proprietary software, the FOSS will usually "win" over time as in becoming the de-facto standard, dominating the market/usage share, and being the most accessible recommended option. Making a software open source thus enables it to become the best software for a given functionality. Pro claim 9, children below People are more motivated to contribute to platforms that use free software. Pro claim 10, children below Using open source software can help ensure that public entities like the EU, nations, or public institutions do not become too dependent on other actors and maintain their sovereignty.[1][2][3][4][5][6][7] Con claim 1, children below Open source software could have intentional vulnerabilities in the code. Con claim 2, children below Free software isn't as good as paid software. Con claim 3, children below Licensing options for open source software are complex. Con claim 4, children below Software developers need to financially support themselves. Open source software gives little way to do so. Con claim 5, children below Open source can sometimes lead to fragmentation, duplicating work, making standardization more difficult and reducing interoperability among other issues. Con claim 6, children below There may be exceptions in certain areas or types of software.'''
