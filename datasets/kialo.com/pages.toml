full_description = "Selected thesis This mandates third-party age verification for minors on social media, bans all accounts for minors younger than 16, and requires platforms to disclose content and data policies, with penalties for non-compliance. Pros Cons Pro claim 1 Enhances age verification to protect minors. Pro claim 2 Prohibits account creation by under-16s, reducing exposure to harmful content. Pro claim 3 Mandates transparent policies on content and data usage. Pro claim 4 Requires resources and reporting mechanisms for harmful behaviors. Pro claim 5 Allows for civil penalties and legal action against non-compliant platforms. Pro claim 6 Social media has been proven in growing research to be significantly sticky for its behaviorally addicting mechanisms. This mandate reduces the use of social media among minors, thereby protecting them from engaging in negatively reinforcing addicting behaviors. Pro claim 7 Pushes minors to spend more time doing things besides social media. Since social media is the major driver of smartphone hourly usage, this would lower their overall screen time and allow for them to spend time outside or engaging in irrefutably more beneficial activities. Con claim 1 May increase operational costs for social media companies. Con claim 2 Could result in over-censorship or limit freedom of expression. Con claim 3 Might lead to privacy concerns over third-party involvement in age verification. Con claim 4 Enforcement could be challenged by interstate commerce and jurisdictional issues. Con claim 5 Potential for decreased user base for social media platforms. Con claim 6, children below Lessens the ability minors have to find and communicate with friends, peers, and find community. Con claim 7 Infringement on Privacy and Autonomy: The bill proposes extensive parental control and monitoring, potentially infringing on minors' privacy and autonomy. Adolescents need to develop their own digital identities and learn to manage their online presence. Excessive oversight could undermine their ability to navigate and understand the digital world independently. Con claim 8 ‘Age’ is a policy standard that has proven to be quite ineffective ever since adopted. Early teens commit incredible crimes even without much access to the internet, and early teens also get more knowledgeable with/without much access to the internet. Age shouldn't be a metric. Con claim 9, children below Since the most harmful mechanisms of social media are mostly kept unsolved, passing HB 1 will not be efficient while the mandates require strict regulations that can be abused."
