title = "Anarchist Economies: Universal Unit of Account? | Kialo"
description = "Many socialist economy models suggest a universal unit of account: Some of them circulating money as in capitalism, others non-circulating tokens based on…"
full_description = "Selected thesis A working economy needs a Universal Unit of Account Pros Cons Pro claim 1, children below Using a universal unit of account you can ensure equal distribution of resources between regions and individuals. Pro claim 2, children below Markets and prices regulate access to scarce products/services by increasing the prices of scarce products. Pro claim 3, children below Distribution without a universal unit of account is too complicated and thus not possible in real life. Con claim 1, children below A unit of account reduces every product/service to one value, ignoring other important information about the product/service. Con claim 2, children below Most concepts advocating a universal unit of account, also include ideas of work remuneration. Remuneration has negative aspects. Con claim 3, children below The idea of a universal unit of account is based on the idea of exchange on markets. Markets are an indirect method of allocation, which carry the information about needs in a very distorted way. Con claim 4, children below Distribution based on unit of account is confusing and misleading. Con claim 5 Who in their right mind could ever in trust central unit management?!!! Statism is the enemy of free people. Concentrations of power call for a degree of character, integrity and trust that humanity has never demonstrated. Con claim 6 In the context of anarchist economic theories, the concept of a universal unit of account—whether it is a form of circulating money or non-circulating tokens based on hours of work—poses significant challenges and may ultimately undermine the principles of freedom and solidarity that are central to anarchist ideals. An anarchist economy, grounded in the values of decentralization, voluntary cooperation, and mutual aid, may function more effectively without a universal unit of account."
