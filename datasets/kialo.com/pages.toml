description = "The question of whether students should be allowed to use generative AI for assignments is a complex and nuanced one, involving considerations of academic…"
full_description = '''Selected thesis Students should be allowed to use generative AI for assignments. Pros Cons Pro claim 1, children below If students can learn from chatbots, and schools' primary goal is learning, then schools should allow students to use chatbots as a learning tool. Pro claim 2, children below ChatBots can help marginalized students perform better, potentially reducing inequalities in academic achievement. Pro claim 3 We need to prepare students for the employers that already require workers to use assistive AI like ChatBots. Pro claim 4, children below Assignments that can be completed entirely by genAI were always bad. Pro claim 5, children below Allowing students to use genAI on assignments could enable students to waste less time on soon-to-be automated tasks and more time learning and practicing next-generation skills (such as fact-checking, logic-checking, and prompting genAI tools to produce better human-AI outputs). Pro claim 6, children below Enabling students to use generative AI for assignments will encourage the development of the use of technology in schools. Con claim 1, children below Working with other people or certain sources is sometimes a form of cheating. Con claim 2 ChatBots may reinforce certain already dominant forms of expression and writing that further marginalize other forms. Con claim 3, children below Students learn less when using assistive technology like ChatBots than they do when learning without such assistive technology (citation needed). Con claim 4, children below Generative AI does a lot of the thinking for the student, undermining the goal of getting students to think for themselves. Con claim 5 Generative LLMs can undermine students' grades by producing false or misleading outputs (such as citations of papers that do not exist), including plain "hallucinations", which would yield low-quality results. Students could get educated on pitfalls of using genAIs, and their use could be discouraged (but not prohibited). Con claim 6, children below AI assistants may provide information that discourages its user from more comprehensive evaluation of a topic. Con claim 7, children below Using generative AI removes students' need to inquire, investigate, and learn while researching.'''
