description = "Religious individuals use a range of symbols to demonstrate their belief in a certain faith - the cross for Christians, burkas and headscarfs for Muslims,…"
full_description = "Selected thesis Teachers should not be allowed to wear religious symbols at school. Pros Cons Pro claim 1, children below Children need to have a neutral safe space to learn without the religious symbols worn by their teacher influencing their impressionable minds. Pro claim 2, children below Public school classrooms are mandated, sanctioned, and funded by the state. Teachers do not have the right to violate this sanctity with their religious symbols. Pro claim 3 Since all states are secular, even in countries where the majority of the population is Christian, like in my country where schools were forced to remove Christian symbols, so all symbols should not be tolerated either. But this concern seems to only exist in the EU, because in non-Christian countries this issue does not even arise, it is their culture and it should be respected as it should be in the EU. But Con claim 1, children below Banning religious symbols in the classroom discriminates against religions whose symbols are not simply adornments but constitute religious practice. Con claim 2, children below Teachers wearing religious symbols in the classroom is protected under freedom of expression. Con claim 3 the premise of religious freedom in the United States pertains to the allowance of individual expression of one's religion. banning religious symbols in schools violates teachers first amendment right Con claim 4 An impressionable child would tend to learn to treat others the same way you treat them and the encouragement to hide your beliefs is not a good role model for themselves or others Con claim 5 It is insulting to both the children's intelligence and other religions to believe we should hide the fact religion exists in case children like the ideas too much Con claim 6 Banning religious symbols will give the impression that religion is inherently evil or should be kept hidden which isn't the full picture and therefore not a fair education. Con claim 7 Banning religious expression and trying to hide the existence of minority beliefs would be the same thing extremist religious types did to suppress the life-saving discoveries made by science and so would go against the point of secularisation. Con claim 8 A child who is embarrassed or scared to ask about religious symbols which may be the result of such a ban would simply avert their attention to secret online googles which doesn't protect the child's thinking like the ban claims to."
