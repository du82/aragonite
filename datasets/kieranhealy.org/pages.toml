title = "kieranhealy.org"
description = """
I am Professor of Sociology at Duke University. Much of my research has been about the social organization of exchange in human blood and organs, cultural goods, software, and ideas. My current work focuses on the moral order of market society, the effect of models and measurement on social classification, and the link between those two topics. I also work on techniques and methods for data visualization, and some problems in social theory.
Kieran Healy Most of my publications and working papers are available on this site, along with information about classes I teach, various code, data, and related resources, and a quite lot of occasional writing. My Curriculum Vitae has more detail, if you need it."""
