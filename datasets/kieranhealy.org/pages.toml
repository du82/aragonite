full_description = "Publications → Full Curriculum Vitae in pdf format → Google Scholar Profile Books The Ordinal Society. Harvard University Press. · overview Data Visualization. Princeton University Press. · overview Last Best Gifts. University of Chicago Press. · overview Working Papers “Rationalized Stratification.” To appear in Social Stratification (5th Ed.), David Grusky, Nima Dahir and Claire Daviss, eds. New York: Routledge. · abstract · pdf “The Plain Person’s Guide to Plain Text Social Science.” · abstract · pdf “Credit Scores and the Moralization of Inequality.” · abstract Retired Papers “Dealing with Awkward Relations.” · abstract · pdf “The Scottish Verdict.” · abstract · pdf “The Ecology of Open-Source Software Development.” · abstract · pdf Articles and Book Chapters “Organ Entrepreneurs.” The Cambridge Handbook of Law and Entrepreneurship in the United States, D. Gordon Smith, Brian Broughton, and Christine Hurt, eds, Cambridge University Press 2022, pp.268-282. · abstract · pdf “Reply to Putnam-Hornstein et al: On honest mistakes and raceless children.” Proceedings of the National Academy of Sciences December 7, 2021 118 (49) e2116225118 · abstract · pdf “Contact with Child Protective Services is Pervasive but Unequally Distributed by Race and Ethnicity in Large US Counties.” Proceedings of the National Academy of Sciences July 27, 2021 118 (30) e2106272118 · abstract · pdf “Rituals of Childhood.” The State of Families: Law, Policy, and the Meaning of Relationships, Jennifer Reich, ed (2021). New York: Routledge. · abstract “Transformative Treatments.” Noûs 52: 320–335. · abstract · pdf “Visualizing the Baby Boom.” Socius 4: 1-2 · abstract · pdf “Public Sociology in the Age of Social Media.” Perspectives on Politics (2017), 15:771-780. · abstract · pdf “Foreword” to Viviana Zelizer, Morals & Markets: The Development of Life Insurance in the United States, Legacy Edition. Columbia University Press. · abstract · pdf “Fuck Nuance.” Sociological Theory