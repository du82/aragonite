["https://kingsofar.com/2024/12/15/grlwood-drops-defiant-new-album-tears-featuring-the-bold-track-fake"]
title = "GRLwood Drops Defiant New Album TEARS Featuring the Bold Track “Fake” | Kings of A&R"
description = "GRLwood unapologetically rejects toxic behavior, reclaiming individuality. Melodic and pop-inspired with hints of hip-hop, “Fake” has a rhythm that draws you in while delivering a defiant edge of exasperation."
full_description = "GRLwood unapologetically rejects toxic behavior, reclaiming individuality. Melodic and pop-inspired with hints of hip-hop, “Fake” has a rhythm that draws you in while delivering a defiant edge of exasperation. “Fake” is one track from GRLwood’s brand-new album TEARS, released today. The 13 tracks showcase a fresh sound from Rej Forester, a skilled songwriter and producer. GRLwood began in 2016 as Rej Forester’s solo project and is now a duo with drummer Mia Morris. From their hometown of Louisville, Kentucky, to audiences around the globe, the band has amassed over 800,000 monthly listeners. Earlier this year, they released two other albums, Blood and Sweat. The band’s discography includes scream-pop anthems like “I’m Yer Dad” and “I Hate My Mom.” Known for their dynamic live performances and their fearless commitment to challenging the patriarchy, misogyny, and toxic heteronormative ideologies, GRLwood continues to inspire a devoted community of fans. GRLwood’s Fake could find a home on Spotify playlists like Anti Pop, New Noise, Women of Indie, and Indie Riot."
