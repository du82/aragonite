full_description = "Syd Taylor, a singer, songwriter, model, and producer, unveils her latest single, “Honey Comb.” The Detroit-raised artist began writing music at the age of six on guitar and piano and gained recognition as the lead singer of the twin duo Stereo Jane. With 17 years of performing and writing experience, she continues to carve her path as an independent artist. In the summer of 2024, after parting ways with a label deal, Syd began creating music purely for herself. “Honey Comb” is a deeply personal track and a preview of her upcoming solo album, which she has written and produced entirely from her apartment in Los Angeles. Her sound, reminiscent of icons like Lana Del Rey, blends inspiration from The Beatles, Fleetwood Mac, and Nina Simone to create a unique mix of analog and digital elements."
