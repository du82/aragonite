title = "Kings of A&R - Buzz Artists, Music Industry News"
description = "Kings of A&R is a popular blog that highlights new music and social issues. Our platform amplifies advocacy and inspires rhapsody."
full_description = "Bella Rios‘ new single “Right Now” fits well on playlists like Bedroom Pop Vibes, Indie Pop Essentials, Melancholy Hits, and Chill Study Beats. The song captures her final year at Princeton University, reflecting on the present moment. Bella is currently balancing her senior year in Economics with her music career. “My songwriting process is pretty structured, so it all kind of generally follows the same flow. I start with chord progression and I’m the most meticulous about lyrics, so those come last to me. I want to be very precise in what I’m saying because that’s where my ears are drawn as a listener, so I want that to be really honest, authentic, and intentional.” “Right Now” follows the release of her single “Options” and her debut EP Sincerely last spring. The track offers a personal look at Bella’s current experience, making it a relatable addition to her music catalog. Allison Park’s song “Hypocrite” would seamlessly fit into playlists such as Sad Pop Essentials, Late Night Jazz & Pop, Emotional Piano Ballads, Dark Pop Vibes, and Reflections: Introspective Pop. The track, with its haunting and melancholic vibe, showcases Allison’s unique blend of dark pop, modern jazz, and piano ballad elements. A Nashville-based artist originally from Pittsburgh, Allison has spent years honing her craft across different genres, from country music to pop and jazz influences. Her career began opening for legendary acts like The Vogues and The Holidays, and later performing alongside artists like Jason Aldean, Blake Shelton, and Miranda Lambert. At the age of 19, she signed to an independent label and released her EP Listen, with her song “Holding Me” landing at number 30 on Billboard’s Hot AC Tracks chart. After touring with Plain White T’s and moving to Los Angeles, Allison shifted her focus to writing and artist development. Today, she continues to create music with a deep emphasis on authenticity and self-reflection, releasing songs like “Hypocrite” that resonate with listeners on a personal level. Along with her music, she hosts the podcast In Tune with Allison Park, where she explores music and mindfulness, further solidifying her role as both an artist and advocate for creativity in all its forms."
