["https://kingsofar.com/2024/12/08/jeremy-the-harlequins-deliver-haunting-western-rock-anthem-with-how-long"]
title = "Jeremy & The Harlequins Deliver Haunting Western Rock Anthem with ‘How Long?'” | Kings of A&R"
description = "Jeremy & The Harlequins' new single"
full_description = "Jeremy & The Harlequins’ new single “How Long?” is a haunting, anthemic track with a gritty western rock vibe. Its mid-tempo pace and cinematic edge make it a refreshing journey of resilience and longing. “The song is about frustration—feeling like you’re at the end of your rope and stuck in a place you can’t escape,” says frontman Jeremy Fury. “It’s figurative, but in my mind, it felt like being stranded in the middle of the desert, broken down in the Wild West with no help in sight. That imagery stuck with me, and I wanted to channel it into a cowboy song that captures the grit, tension, and determination of trying to find your way out of a seemingly hopeless situation.” Jeremy & The Harlequins recently toured with The Buttertones, and alongside acts like Chuck Prophet, Low Cut Connie, Eli “Paperboy” Reed, and Electric Six. Their music has been featured on Little Steven’s Underground Garage and recognized multiple times as the “Coolest Song in the World.” They have appeared in films such as Edge of Tomorrow and performed live on BBC’s The Andrew Marr Show."
