full_description = "Kings of A&R initially gained a following by featuring artists early in their careers, including now-household names like Lady Gaga. The website may have been the first to share the mega-hit “Apologize” by One Republic, which garnered media attention and also alerted the media to The Killers’ showcase at SXSW. Dean Cramer, the publisher of Kings of A&R, also brought attention to the then-unknown Katy Perry after she was dropped from her label, and tipped off the community about the music act RJS, who achieved a mega top 40 hit with their track “Face Down.” Additionally, the page featured artists such as Gotye, Capital Cities, The Neighborhood, and Twenty One Pilots. Today, our blog amplifies advocacy and inspires rhapsody by not only introducing new music but also shedding light on social issues. KOAR has been selected as one of the top 75 American Music Blogs on the web by Feedspot, top 5 by Scorebig, and with overall #25 ranking based on traffic. We were named a Top 10 Trendsetting Music Blog and selected as one of the top 100 music blogs on the web by Feedspot and the top 75. Also listed as the Ten Best Music Blogs to follow, landing within the top 20 music blogs by blog rank, and was chosen as one of musicians empowered’s top 100 music industry blogs. ———————————————————————————————————————"
