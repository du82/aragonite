full_description = "Indie alternative act The Eiffels have released a music video for their track Beautiful Life. The video features scenes of a party with birthday cakes and cheering, perfectly complementing the song’s energy. Pitchfork describes The Eiffels as “on a quest to chart their own space between rock and pop.” Forbes calls their synth-rock sound “neon grooves,” and Alternative Press highlights their music as “anthemic and vivacious.” The Eiffels’ track “More” was featured as the opening song for Netflix’s The Kissing Booth 2, and their music has appeared in video games like Rock Band 4, MTV, and major publications. Their momentum has led to millions of streams, a spot on Vans Warped Tour, and opening slots for artists like X Ambassadors and Plain White T’s. Their debut EP was the 15th most-added record on U.S. college radio and gained airplay on major stations like KROQ, KLOS, and 91X. Beautiful Life would fit well on Spotify playlists like Indie Pop, Feel-Good Indie Rock, All New Indie, and Dance Party."
