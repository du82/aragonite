["http://kingsofar.com/category/face-to-face"]
title = "Face to Face | Kings of A&R"
description = "Kings of A&R is a popular blog that highlights new music and social issues. Our platform amplifies advocacy and inspires rhapsody."
full_description = "Instagram is losing its popularity. Why? Everybody is on TikTok and people are getting bored of influencer marketing and ads. Instagram went totally corporate. It’s now geared for the politician and the corporation with deep pockets that will spend hundreds of thousands for top shelf placement. It’s for the online celebrity who wants to sell things to followers. It’s nearly impossible for a instagram user to achieve organic reach. When I mean organic reach I’m talking posting content without paid promotion and people coming across your content in a non-targeted way. Instagram is killing organic reach just like Facebook. An artist doesn’t create a FB profile expecting to reaching anybody. Instagram is now trailing facebook with its corporate paid algorithm. “The organic reach on Facebook went from 16% in 2012 to 2.27% in 2015, and it’s only dropping.” Of course these companies don’t want you to build a reach organically. They want you to pay for it, that’s why they are killing organic reach. Before Governor Andrew Cuomo prepares to take his own victory tour on the road after he spared the lives of New Yorkers from covid he has some things to tidy up. That’s investigating the EDM duo The Chainsmokers for playing a outdoor concert. It’s been reported that while commuting in a subway, a concerned citizen showed the governor a video he was appalled by videos showing crowds standing close together at a Hamptons concert over the weekend. Other witnesses saw a crowd of people who were socially distancing with masks. Of course, we know today that events are widely open for interpretation. Regardless, Cuomo says “We have no tolerance for the illegal reckless endangerment of public health,”. Now, it will be interesting to see how this all plays out. Because some notable figures were also billed at this festivity. Goldman Sachs CEO David Solomon and Southampton Town Supervisor Jay Schneiderman’s band performed. Funnily enough, the charity event which was billed Safe and Sound is being called not safe, not sound. The Goldman Sachs CEO and Andrew Cuomo can duke it out and take it to the streets while Kanye keeps the score."
year_published = 2025
