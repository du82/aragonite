full_description = "Emerging artist Carson Cruz introduces his debut track Anything At All, a mix of pop, bedroom pop, and indie pop. Drawing inspiration from Justin Bieber, Harry Styles, Justin Timberlake, Ed Sheeran, and Benson Boone, Cruz shares a personal message of resilience: “When I was younger, I went through situations that hurt me deeply. Even during tough times, I knew I could overcome anything life threw at me. This song is for anyone struggling—at school, at home, or in a relationship. Don’t be afraid to stand tall, leave the past behind, and move forward. Life is full of challenges, but it’s also full of victories. Keep your head high.” Anything At All could find a home on Spotify playlists like Fresh & Chill, Bedroom Pop, Indie Pop & Chill, Pop Right Now, and Young & Free."
