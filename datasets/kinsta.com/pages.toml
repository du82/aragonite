description = "Do you love helping people solve problems? Do you live and breathe WordPress? Come join an amazing culture and team at Kinsta."
full_description = "Careers Kinsta is a premium Application, Database, and Managed WordPress Hosting provider designed for all types of businesses, small or large. We're the first to be exclusively powered by Google Cloud Platform while utilizing an isolated container system. We believe that constant availability and an outstanding user experience are a must. That’s why we always utilize the latest software and most advanced technology to power our infrastructure. Kinsta's motivated team is scattered across the globe The flexibility to work from anywhere fuels motivation and work-life balance, allowing team members to tailor their environments for peak productivity and satisfaction. Being a remote first company also allows us to draw on a pool of international talent, ensuring our quest for superior hosting services is propelled by contributions from only the most exceptional individuals. Life at Kinsta Kinsta is a fun and welcoming place where our team members connect to each other around the things they love: travel, learning new languages, reading, family, pets, and more. Kinsta is also a place where quality work gets done. We expect everyone to be honest and forthright with their ideas and contributions. Day-to-day, we challenge each other to constantly raise the bar, encourage unconventional thinking to achieve innovative breakthroughs, and are passionately committed to surpassing our goals. We're looking for people who can take the initiative and contribute ideas anywhere in the company. We promote continuous learning in a flexible work environment. What we offer Remote working environment Remote expense budget Competitive base salary Paid vacations Flexible PTO so that you can rest and recharge Training budget to support you in your career development How we review and select newcomers You apply for one of our open positions We might ask you to complete a short assessment (a video or a test) We invite you to an initial HR call, so that we can get to know each other We invite you to one or two rounds of more in-depth, technical interviews with the hiring manager and the team If you've successfully passed all interview rounds, you’ll receive an offer from us Once you've accepted our offer, you'll have to pass a background check Welcome on board! Current job openings DevOps Engineer - PHP Specialist We’re looking for an experienced DevOps engineer whose role will center on PHP development for WordPress and related integrations. The engineer will focus on Kinsta's PHP-related ... Job Details Sales Development Representative - AMERS Ready to take on a dynamic role where creativity drives results? We’re on the hunt for a Sales Development Representative in the Americas region who’s passionate about ... Job Details Sales Development Representative - EMEA Ready to take on a dynamic role where creativity drives results? We’re on the hunt for a Sales Development Representative in the EMEA region who’s passionate ... Job Details Sign Up for Job Alerts Be the first to know about our latest opportunities! Sign Up"
