full_description = "About us Kinsta was founded in 2013 with a desire to change the status quo. We set out to create the best hosting platform in the world and that’s our mission. Kinsta is growing Our team is fully distributed around the world. We are always on the hunt for great talent that holds the same values and is as enthusiastic about customer-centric development as we are. Our careers Kinsta is obsessed with performance Imagine a car enthusiast building their dream ride. That's us with hosting. We love what we do and are obsessed with fine-tuning our servers to deliver maximum speeds. Turbocharge your site today Kinsta is the fastest server configuration we've ever had. It's not even close. Speed is so critical to ecommerce. Seth Kravitz CEO at PHLEARN 37 data centers 260 CDN locations Kinsta is global We serve thousands of clients from 128 countries around the globe. The only continent we haven't reached yet is Antarctica. Absolutely fantastic - cannot rate highly enough in terms of speed, support, and UI. Went from WP Engine to Flywheel, then to Kinsta and couldn't be happier. Rebecca Taubert In total, I manage about 70 websites across multiple accounts with varied account types and I can say that I get the same response when I ask a question on a 2-site plan as I do when I ask a similar question from a 40-site plan. Tulio Cardozo IT Manager 37 data centers 2,500 support conversations weekly 125,000+ gigabytes of traffic daily 99.9% guaranteed uptime Kinsta is local Wherever it is on the globe, we like to be locals. That's why we hire a remote support team that covers all time zones. We also provide native-speaking support in 10 languages. Their online chat team responds immediately every time I have tried to make contact. Each time they were able to fix any issues promptly - even in our timezone. Ryan Channing Founder at Blaq Long story short — these folks know how to hire and maintain remote workers. We Work Remotely 2019 Kinsta is diverse Our team is f