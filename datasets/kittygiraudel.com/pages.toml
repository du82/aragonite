full_description = "I generated and adjusted this accessibility statement from the W3C Accessibility Statement Generator Tool. I am committed to ensuring digital accessibility for people with disabilities. I am continually improving the user experience for everyone, and applying the relevant accessibility standards. Measures to support accessibility Kitty Giraudel takes the following measures to ensure accessibility of KittyGiraudel.com: Include accessibility as part of my mission statement. Include accessibility throughout my internal policies. Integrate accessibility into my procurement practices. Conformance status The Web Content Accessibility Guidelines (WCAG) defines requirements for designers and developers to improve accessibility for people with disabilities. It defines three levels of conformance: Level A, Level AA, and Level AAA. KittyGiraudel.com is fully conformant with WCAG 2.1 level AA. Fully conformant means that the content fully conforms to the accessibility standard without any exceptions. Feedback I welcome your feedback on the accessibility of this site. Please let me know if you encounter accessibility barriers on Twitter @KittyGiraudel. Technical specifications Accessibility of this site relies on the following technologies to work with the particular combination of web browser and any assistive technologies or plugins installed on your computer: HTML WAI-ARIA CSS JavaScript These technologies are relied upon for conformance with the accessibility standards used. Dark mode"
