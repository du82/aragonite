["https://kittygiraudel.com/2022/05/21/simple-access-management-with-sanity"]
title = "Simple access management with Sanity | Kitty Giraudel"
description = "I’m Kitty Giraudel, a non-binary trans frontend developer based in Berlin, focused on accessibility and inclusivity."
full_description = '''May 21th, 2022 · ~5 minutes Access management is important to any CMS. Unfortunately, Sanity’s ability to define custom roles is restricted to customers of the business plan. In this article, we will see how to customize the studio based on default roles, something that is possible with all Sanity plans — albeit a little tricky to set up (kind thanks to Knut for showing me the way). Introduction Caveats Accessing the user’s role Updating the desk structure Updating the “Create new document” dialog Updating the search Locking fields for editors Locking actions for editors Bonus: Hiding other tools Introduction Sanity comes with a set of predefined roles for all plans. They are: Administrator: Read and write access to all datasets, with full access to all project settings Editor: Can edit all documents in all datasets within the project Viewer: Can view all documents in all datasets within the project Now for sake of the argument, let’s imagine that our scheme has 2 different types: blogPost and page. We want editors to be able to handle blog posts themselves, but pages should be managed by administrators only. To hide pages away from editors, we need to do a few things: Update the desk structure to hide the page section. Update the “Create new document” dialog so it doesn’t allow creating pages for editors. Update the search to return conditional results based on the role. Locking page fields for editors. Lock page actions for editors. Caveats There are important caveats to take into consideration before implementing this solution: This is purely obfuscation, and does not prevent editors from accessing or even updating documents via the API directly. This is not a secure access management system. This can be spoofed relatively easily by anyone tech-savvy enough to manipulate client-side JavaScript code, so once again, this really is just obfuscation. That being said, if you just want to make sure your editors don’t modify the wrong thing by mistake, this is a good enough solution that is quite simple to implement. Accessing the user’s role It’s not overly advertised, but you can retrieve information about the current Sanity user by importing the dedicated store from part:@sanity/base/user. It provides an asynchronous function getCurrentUser() to get information, as well as an observable we can subscribe to. The object looks like this: { "email": "email@domain.com", "id": "cc4zMBdMk", "name": "Kitty", "profileImage": "https://avatars.githubusercontent.com/u/3948238942?v=4", "provider": "github", "roles": [ { "name": "administrator", "title": "Administrator", "description": "Read and write access to all datasets, with full access to all project settings." } ] } The idea is that upon mounting the studio, we can get information about the current user and store it in a local variable or global object. Let’s create a access.js file and put the following code into it: // access.js import userStore from 'part:@sanity/base/user' export const EDITOR_TYPES = ['blogPost'] export const getCurrentUser = () => { userStore.me.subscribe(user => { window._sanityUser = user || undefined }) } export const isAdmin = (user = window._sanityUser) => user?.roles.map(role => role.name).includes('administrator') export const isNotAdmin = user => !isAdmin(user) Now, we can use our isAdmin and isNotAdmin utility functions to create logic based on the user’s role. Updating the desk structure Sanity comes with its own structure builder, an engine to customize how the CMS menus and panels behave. { "name": "part:@sanity/desk-tool/structure", "path": "./deskStructure.js" } The default structure looks something like this: // deskStructure.js export default () => S.list().title('Content').items(S.documentTypeListItems()) Let’s rework it a bit. For each document type, we want to render it if the current user is an administrator, or if the type is eligible for an editor. We can also update the title of the list based on the role if we want. // deskStructure.js import { getCurrentUser, isAdmin, EDITOR_TYPES } from './access' // Call our function to retrieve the current user first. getCurrentUser() export default () => { const admin = isAdmin() return S.list() .title(admin ? 'Content' : 'Editorial content') .items( S.documentTypeListItems().filter( item => admin || EDITOR_TYPES.includes(item.getId()) ) ) } You can find a similar example in the Sanity documentation, making use of more roles (both default and custom). Updating the “Create new document” dialog Updating the “Create new document” dialog is essentially the same thing (although difficult to find in the docs). We need to implement the new-document-structure part first: { "name": "part:@sanity/base/new-document-structure", "path": "./newDocumentStructure.js" } And then rework it like this: // newDocumentStructure.js import S from '@sanity/base/structure-builder' import { isAdmin, EDITOR_TYPES } from './access' export default () => { const admin = isAdmin() return S.defaultInitialValueTemplateItems().filter( item => admin || EDITOR_TYPES.includes(item.getId()) ) } Updating the search Unfortunately, the studio search cannot really be customized. There is an experimental feature to give more weight to certain results but there is no way to properly ignore some documents from the search. Not all hope is lost though! There is a recent open pull-request to implement that very feature, so hopefully it will get merged soon. Once it’s done, we can programmatically iterate over the documents of our schema to add this ignore flag for the admin-only types for editor users. It will look something like: // schema.js import createSchema from 'part:@sanity/base/schema-creator' import schemaTypes from 'all:part:@sanity/base/schema-type' import blogPost from './blogPost' import page from './page' import { isNotAdmin, EDITOR_TYPES } from './access' export default createSchema({ name: 'default', types: schemaTypes.concat( Object.entries({ blogPost, page }).map(([type, document]) => ({ ...document, // As of writing, this is not yet a production feature. This is still in // development and might not ever reach production. // See: https://github.com/sanity-io/sanity/pull/3253 __experimental_search_ignore: isNotAdmin() && !EDITOR_TYPES.includes(type), })) ), }) Locking fields for editors The readOnly and hidden properties that can be defined on fields accept a function that receives — among other things — the current user. This means it is possible to mark a certain field readonly, or fully hidden, for editors if we want to (as also demonstrated in the documentation). To make sure fields cannot be updated by editors even if they managed to reach a document they’re not supposed to see (which could happen when following a reference or reaching a document via the search), we can automate it. When defining our schema, we iterate over all fields of all documents, and add a readOnly property based on the role. // schema.js import createSchema from 'part:@sanity/base/schema-creator' import schemaTypes from 'all:part:@sanity/base/schema-type' import blogPost from './blogPost' import page from './page' import { isAdmin, EDITOR_TYPES } from './access' export default createSchema({ name: 'default', types: schemaTypes.concat( Object.entries({ blogPost, page }).map(([type, document]) => ({ ...document, fields: document.fields.map(addReadOnly(type)), })) ), }) function addReadOnly(type) { return function (field) { // Block types do not support the `readOnly` property, so we can skip. if (field.type === 'block') return field // If the `readOnly` property is not already defined and the type is for // admins only, we add the `readOnly` property to restrict it for editors. if (typeof field.readOnly === 'undefined' && !EDITOR_TYPES.includes(type)) { field.readOnly = ({ currentUser }) => !isAdmin(currentUser) } // If the fiels is an array, recursively add the `readOnly` property to // nested fields. if (typeof field.of !== 'undefined') { field.of.forEach(addReadOnly(type)) } return field } } Locking actions for editors For the same reason we should prevent editors from updating page fields, we should also prevent them from performing actions on page documents. We can do that by customizing document actions: { "implements": "part:@sanity/base/document-actions/resolver", "path": "./resolveDocumentActions.js" } Then we can write a bit of logic to discard all actions on page documents if the user is not an admin: // resolveDocumentActions.js import defaultResolve from 'part:@sanity/base/document-actions' import { isNotAdmin, EDITOR_TYPES } from './access' export default function resolveDocumentActions(props) { return isAdmin() || EDITOR_TYPES.includes(props.type) ? defaultResolve(props) : [] } Bonus: Hiding other tools Sanity doesn’t make it overly straightforward to manage the tools that appear at the top of the page in the upper menu (like the Desk tool, the media library or the Groq Vision plugin). If we wanted to hide away all tools but the Desk to editors, we would have to do that in our user observer (knowing that the desk is always the first one): import tools from 'all:part:@sanity/base/tool' import userStore from 'part:@sanity/base/user' const getCurrentUser = () => { userStore.me.subscribe(user => { window._sanityUser = user || undefined if (!isAdmin(user)) tools.splice(1) }) } A more thorough check could be done if we wanted to only allow some tools for editors instead of removing them all. Once again though, they could still access these tools by reaching the URL directly, so this is just obfuscation.'''
