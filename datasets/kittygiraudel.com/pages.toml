["https://kittygiraudel.com/2020/01/16/accessible-visibility-react-component"]
title = "An accessible visibility React component | Kitty Giraudel"
description = "I’m Kitty Giraudel, a non-binary trans frontend developer based in Berlin, focused on accessibility and inclusivity."
full_description = '''January 16th, 2020 · ~1 minutes In Cache-Cache CSS (translated by yours truly on this very blog as CSS hide-and-seek), Gaël Poupard offers a bulletproof solution to visually hide some content while keeping it accessible to assistive technologies. In this post, I want to show a teeny-tiny React component to make it more explicit and convenient to use the original utility class. const VisuallyHidden = ({ as: Component, ...props }) => ( <Component {...props} className="sr-only" /> ) VisuallyHidden.defaultProps = { as: 'span' } And here is how you would use it (taking the example from Accessible page title in a single-page React application). const TitleAnnouncer = props => { const [title, setTitle] = React.useState('') // More React code… return <VisuallyHidden as='p' tabIndex={-1}>{title}</VisuallyHidden> } A few comments about the component: Depending on the way you author styles in your application, you could author the relevant styles differently (pure CSS, inline styles, CSS-in-JS…). The as prop is intended to provide a way to change the underlying DOM element that is rendered. We found that span is a good default in most cases, but you might want a p (like we do in our example), a div or something else. Finally, we spread the props so that it is possible to pass other DOM attributes to the underlying element (e.g. tabIndex). Note that we spread before the className prop so we don’t inadvertently override it. Feel free to play with the code on CodeSandbox.'''
