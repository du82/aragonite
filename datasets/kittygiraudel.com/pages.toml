description = "I’m Kitty Giraudel, a non-binary trans frontend developer based in Berlin, focused on accessibility and inclusivity."
full_description = "December 10th, 2020 · From Accessible icon links The <IconLink /> React component aims at rendering icons as links while making them accessible for assistive technologies such as screen-readers. It relies on the <VisuallyHidden /> component. Component const IconLink = props => ( <a {...props}> {props.children} <VisuallyHidden>{props.label}</VisuallyHidden> </a> ) IconLink.propTypes = { children: PropTypes.node.isRequired, label: PropTypes.string.isRequired, href: PropTypes.string.isRequired, } Usage const Twitter = props => ( <svg xmlns='http://www.w3.org/2000/svg' viewbox='0 0 16 16'> <path d='M16 3.538a6.461 6.461 0 0 1-1.884.516 3.301 3.301 0 0 0 1.444-1.816 6.607 6.607 0 0 1-2.084.797 3.28 3.28 0 0 0-2.397-1.034 3.28 3.28 0 0 0-3.197 4.028 9.321 9.321 0 0 1-6.766-3.431 3.284 3.284 0 0 0 1.015 4.381A3.301 3.301 0 0 1 .643 6.57v.041A3.283 3.283 0 0 0 3.277 9.83a3.291 3.291 0 0 1-1.485.057 3.293 3.293 0 0 0 3.066 2.281 6.586 6.586 0 0 1-4.862 1.359 9.286 9.286 0 0 0 5.034 1.475c6.037 0 9.341-5.003 9.341-9.341 0-.144-.003-.284-.009-.425a6.59 6.59 0 0 0 1.637-1.697z' /> </svg> ) const MyComponent = props => ( <IconLink href='https://twitter.com/KittyGiraudel' label='Twitter'> <Twitter /> </IconLink> )"
