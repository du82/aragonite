ad the pleasure of hosting guest authors and would recommend you read their posts! 2024 in review December 31th, 2024 Read article 2024 in review Feature toggles with webpack July 22th, 2024 Read article Feature toggles with webpack From ESLint and Prettier to Biome June 1st, 2024 Read article From ESLint and Prettier to Biome Read more articles Main projects I used to be quite involved in open-source development. I have initiated and contributed to many projects, most of which about Sass or digital accessibility. A11y-dialog Accessibility · 2,400 ⭐️ Look at project A11y-dialog Simplified JavaScript Jargon JavaScript · 2,300 ⭐️ Look at project Simplified JavaScript Jargon Sass Guidelines Sass · 900 ⭐️ Look at project Sass Guidelines Browse more projects Last events I enjoy participating in events and talking at conferences when I find the time. If you would like me to attend one of your events, feel free to get in touch! In the meantime, feel free to have a look at my past talks. Unlocking Inclusivity, by Xena June 1st, 2023 · Berlin Check event Unlocking Inclusivity, by Xena Algolia Developer Experience Podcast January 20th, 2022 · Online Check event Algolia Developer Experience Podcast Paris Web October 4th, 2018 · Paris Check event Paris Web Check more events Dark mode"
