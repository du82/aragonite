full_description = ".Resume__photo{float:left;shape-outside:circle(50%);margin:.5em 1em .5em 0;border-radius:50%;max-width:8em;display:none}.Resume__intro{margin-bottom:2em}.Resume__section{display:flex;flex-direction:column;margin-bottom:2em}.Resume__section>h2{font-style:italic;font-weight:700;margin-bottom:0;margin-top:0}.Resume__section>div{padding-top:.9em}.Resume__section>div>:last-child{margin-bottom:0}.Resume__section>div>:first-child{margin-top:0}.Resume__section h3{font-size:90%}.Resume__section h3 span{margin-left:auto;opacity:.8;font-weight:400;display:block}.Resume__section li{margin:.5em 0}@media print{.Resume{font-size:75%}.Resume__links,.Resume__photo,.no-print{display:none}.Resume__links--print{display:block}}@media (min-width:768px){.Resume__photo{display:block}.Resume__section{margin-bottom:3em;flex-direction:row}.Resume__section>h2{margin-top:revert;padding-right:1.5em;font-size:100%;text-align:right;border-right:1px solid #dd7eb4;margin-right:1.5em;flex:0 0 8em}.Resume__section h3{display:flex}.Resume__section h3 span{font-size:80%;padding-left:1em;display:inline-block;text-align:right}} I am a non-binary trans frontend engineer with over a decade of experience and a strong focus on web digital accessibility, diversity and inclusion. I have spent the last 9 years leading teams and growing engineering departments in a healthy way. My other skills include (but are not limited to) automated testing, frontend performance, web security, documentation, inclusive design and agile practices and methodologies. I also happen to be a former technical writer who loves everything documentation. I have authored two books on CSS and Sass respectively at the start of my career and over 300 technical articles on various popular publications, from CSS-Tricks to Smashing Magazine, from Codrops to Tuts+. As a result, I have great communication skills and a passion for writing all sorts of things. I have done my fair share of open-source work over the years. I am the author of Sass Guidelines, a Sass documentation translated in 13 languages and used by companies all over the world. I have authored and maintained a11y-dialog since 2015, one of the most popular libraries for creating accessible modal dialogs. More contributions and projects can be found on GitHub. Anecdotally, I am a former Google Developer Expert in frontend development as well as a nominee for the Developer of the Year (2015) Net Awards, as well as for the Xena Awards in the Open Source category (2023). Please kindly reach out on LinkedIn for any inquiry. My pronouns are she/her (or acceptably they/them), please kindly respect them. Skills Technology HTML (knowledgeable), CSS (authored 2 books about it), JavaScript, React (main JS framework for the last few years), accessibility (steady theoretical knowledge), security (knowledgeable) Other skills Documentation (tech-writer and passionate), hiring/team building, workplace safety (minorly involved in N26 Works Council formation), agile practices (informed) Experience VP of Engineering @ Scilife Berlin, 2024–present Managing the Engineering department Defining and drive the execution of the engineering roadmap, ensuring timely delivery of high-quality products. Overseeing the architecture, design, and development of the new platform Ensuring best practices in software development, including coding standards, code reviews, testing, and CI/CD processes VP of Engineering @ Cofenster Berlin, 2022–2024 Brought software engineering maturity and processes to the team Organised the Product & Engineering team in cross-functional squads to improve delivery Championed quality topics such as security, scaling, accessibility and compliance Maintained and actively contribute to company-wide documentation, particularly about culture, product and engineering Supported technical initiatives such as compliance and certification acquisition Contributed to the product roadmap and strategy as well as its implementation Took over hiring and onboarding for engineering roles Group Engineering Lead @ Gorillas Berlin, 2021–2022 Helped grow the Product, Design & Engineering organization from a few dozens to over 200 people. Established processes and guidelines for the department (most notably the 360 feedback process, but also absence policies, engineering practices, IT and security guidelines…). Championed accessibility, diversity and inclusion, as well as workspace safety in the organization. Supported officializing the use of the culture-add interview for all roles and helped design and conduct that interview stage. Designed the interviewing process for web engineers (through which over a dozen hires too place), and helped hiring tech recruiters and group leads. Worked with the security team to enable relevant policies and guidelines for the department. Took part in Due Diligence exercises to audit the quality of the organization’ SDLC, architecture and security practices. Lead Web Engineer @ Gorillas Berlin, 2021–2021 Hired as one of the first engineers to build up the Product, Design & Engineering organization at a time where there wasn’t one. Grew the web team to over 10 engineers, whose seniority levels spread from junior to engineering lead. Defined the early web infrastructure such as the adoption of Next.js, Sanity, Cypress, Fela and other frameworks and technologies. Championed accessibility, testing and security in all web projects. Championed diversity and inclusion at the organization level to ensure it grows in solid and healthy bases. Web Tech Lead @ N26 GmbH Berlin, 2018–2020 Grew the web team from 1 to 20+ engineers, now in 4 different offices over the world. Built a culture of feedback, inclusion and respect, now powering a very diverse and high-performing team. Designed and implemented a test automation strategy and deployment pipeline to release multiple projects on a daily basis. Senior Frontend Developer @ N26 GmbH Berlin, 2016–2018 Set up the groundwork for all N26 customer-facing web projects to ever come, now supporting the marketing website, the support center, the N26 webapp, the signup process and more. Installed high quality practices such as security, accessibility and testability, shared with all members of the web team and beyond. Initiated the web docs hub and wrote most of the existing documentation (70,000+ words). Web Developer @ Edenspiekermann Berlin, 2015–2016 Worked on a variety of frontend client projects. Paired with designers on a regular basis to ensure consistency between design deliveries and final implementations. Encouraged authoring guidelines and practices across the organisation, especially around CSS. Started the Edenspiekermann dev blog. Web Developer @ Crédit Agricole Grenoble, 2011–2015 Implemented frontend of a now-retired e-commerce platform. Set up Sass guidelines to author CSS which could scale. Designed Twig (Symfony) architecture to support theming. Developed a simple ad management system in PHP. Projects Notable open-source projects Sass Guidelines, an opinionated styleguide for writing sane, maintainable and scalable Sass translated in 13 languages. Browserhacks, an extensive list of browser-specific hacks. SassDoc, a documentation system for Sass similar to JSDoc for JavaScript. Simplified JavaScript Jargon, a community-driven attempt at explaining JavaScript concepts and buzzwords. a11y-dialog , a script to make modal dialogs accessible to assistive technology users. Find more open-source contributions from me. Achievements Publications Jump Start Sass (© 2016, Learnable Editions) CSS 3 Pratique du Design Web (© 2014, Eyrolles Editions) Honor & Awards Former Google Developer Expert in Web Technologies Web Developer of the Year 2015 Nominee Open Source Xena Awards 2023 Nominee Hobbies Playing Geoguesser, video games and pool, hanging out with my cats, writing, cooking, and the occasional side project that never gets finished. 😅 Dark mode"
