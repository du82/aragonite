rameterf() glTexParameterfv() glTexParameteri() glTexParameteriv() glTexSubImage2D() glUniform1f() glUniform1fv() glUniform1i() glUniform1iv() glUniform2f() glUniform2fv() glUniform2i() glUniform2iv() glUniform3f() glUniform3fv() glUniform3i() glUniform3iv() glUniform4f() glUniform4fv() glUniform4i() glUniform4iv() glUniformMatrix2fv() glUniformMatrix3fv() glUniformMatrix4fv() glUseProgram() glValidateProgram() glVertexAttrib1f() glVertexAttrib1fv() glVertexAttrib2f() glVertexAttrib2fv() glVertexAttrib3f() glVertexAttrib3fv() glVertexAttrib4f() glVertexAttrib4fv() glVertexAttribPointer() glViewport() gl_init_symbols() OpenGL¶ This module is a Python wrapper for OpenGL commands. Warning Not every OpenGL command has been wrapped and because we are using the C binding for higher performance, and you should rather stick to the Kivy Graphics API. By using OpenGL commands directly, you might change the OpenGL context and introduce inconsistency between the Kivy state and the OpenGL state. kivy.graphics.opengl.glActiveTexture(GLenum texture)¶ See: glActiveTexture() on Kronos website kivy.graphics.opengl.glAttachShader(GLuint program, GLuint shader)¶ See: glAttachShader() on Kronos website kivy.graphics.opengl.glBindAttribLocation(GLuint program, GLuint index, bytes name)¶ See: glBindAttribLocation() on Kronos website kivy.graphics.opengl.glBindBuffer(GLenum target, GLuint buffer)¶ See: glBindBuffer() on Kronos website kivy.graphics.opengl.glBindFramebuffer(GLenum target, GLuint framebuffer)¶ See: glBindFramebuffer() on Kronos website kivy.graphics.opengl.glBindRenderbuffer(GLenum target, GLuint renderbuffer)¶ See: glBindRenderbuffer() on Kronos website kivy.graphics.opengl.glBindTexture(GLenum target, GLuint texture)¶ See: glBindTexture() on Kronos website kivy.graphics.opengl.glBlendColor(GLclampf red, GLclampf green, GLclampf blue, GLclampf alpha)¶ See: glBlendColor() on Kronos website kivy.graphics.opengl.glBlendEquation(GLenum mode)¶ See: glBlendEquation() on Kronos we