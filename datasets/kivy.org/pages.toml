title = "Core Abstraction — Kivy 2.3.1 documentation"
full_description = "Table Of Contents Core Abstraction CoreCriticalException Core Abstraction¶ This module defines the abstraction layers for our core providers and their implementations. For further information, please refer to Architectural Overview and the Core Providers and Input Providers section of the documentation. In most cases, you shouldn’t directly use a library that’s already covered by the core abstraction. Always try to use our providers first. In case we are missing a feature or method, please let us know by opening a new Bug report instead of relying on your library. Warning These are not widgets! These are just abstractions of the respective functionality. For example, you cannot add a core image to your window. You have to use the image widget class instead. If you’re really looking for widgets, please refer to kivy.uix instead. exception kivy.core.CoreCriticalException[source]¶ Bases: Exception Audio Event dispatching and state changes Sound Sound.get_pos() Sound.length Sound.load() Sound.loop Sound.pitch Sound.play() Sound.seek() Sound.source Sound.state Sound.stop() Sound.unload() Sound.volume SoundLoader SoundLoader.load() SoundLoader.register() Camera CameraBase CameraBase.index CameraBase.init_camera() CameraBase.resolution CameraBase.start() CameraBase.stop() CameraBase.texture Clipboard OpenGL Image In-memory image loading Saving an image Image Image.anim_available Image.anim_delay Image.anim_index Image.anim_reset() Image.filename Image.height Image.image Image.load() Image.load_memory() Image.nocache Image.on_texture() Image.read_pixel() Image.remove_from_cache() Image.save() Image.size Image.texture Image.width ImageData ImageData.add_mipmap() ImageData.data ImageData.flip_vertical ImageData.fmt ImageData.get_mipmap() ImageData.height ImageData.iterate_mipmaps() ImageData.mipmaps ImageData.rowlength ImageData.size ImageData.source ImageData.width Spelling NoLanguageSelectedError NoSuchLangError SpellingBase SpellingBase.check() Spelling