title = "Welcome to Kivy — Kivy 2.3.1 documentation"
full_description = "Table Of Contents Welcome to Kivy Appendix License Welcome to Kivy¶ Welcome to Kivy’s documentation. Kivy is an open source software library for the rapid development of applications equipped with novel user interfaces, such as multi-touch apps. We recommend that you get started with Getting Started. Then head over to the Programming Guide. We also have Create an application if you are impatient. You are probably wondering why you should be interested in using Kivy. There is a document outlining our Philosophy that we encourage you to read, and a detailed Architectural Overview. If you want to contribute to Kivy, make sure to read our latest Contribution Guide. If your concern isn’t addressed in the documentation, feel free to contact us. Getting Started Introduction Installing Kivy A first App Properties Kv Design Language Events Non-widget stuff Layouts Drawing Packaging Diving in Kivy Project Philosophy Contribution Guidelines FAQ Contact Us Programming Guide Kivy Basics Controlling the environment Configure Kivy Architectural Overview Events and Properties Input management Widgets Graphics Kv language Integrating with other Frameworks Packaging your application Package licensing Tutorials Pong Game Tutorial A Simple Paint App Crash Course API Reference Kivy framework Low level Metrics Animation Application Atlas Kivy Base Cache manager Clock object Compatibility module for Python 2.7 and >= 3.4 Configuration object Context Core Abstraction Audio Camera Clipboard OpenGL Image Spelling Text Text Markup Text layout Video Window Kivy module for binary dependencies. Effects Damped scroll effect Kinetic effect Opacity scroll effect Scroll effect Event dispatcher Event Manager Factory object Garden Geometry utilities Gesture recognition Graphics BoxShadow CGL: standard C interface for OpenGL Graphics compiler Context management Context instructions Framebuffer GL instructions Canvas OpenGL OpenGL utilities Scissor Instructions Shader Stencil instruc