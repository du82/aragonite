description = "kivy.core.window."
full_description = "Table Of Contents Window Keyboard Keyboard.callback Keyboard.keycode_to_string() Keyboard.release() Keyboard.string_to_keycode() Keyboard.target Keyboard.widget Keyboard.window WindowBase WindowBase.add_widget() WindowBase.allow_screensaver WindowBase.always_on_top WindowBase.borderless WindowBase.center WindowBase.children WindowBase.clear() WindowBase.clearcolor WindowBase.close() WindowBase.create_window() WindowBase.custom_titlebar WindowBase.dpi WindowBase.event_managers WindowBase.event_managers_dict WindowBase.flip() WindowBase.focus WindowBase.fullscreen WindowBase.get_gl_backend_name() WindowBase.gl_backends_allowed WindowBase.gl_backends_ignored WindowBase.grab_mouse() WindowBase.height WindowBase.hide() WindowBase.icon WindowBase.keyboard_anim_args WindowBase.keyboard_height WindowBase.keyboard_padding WindowBase.left WindowBase.mainloop() WindowBase.managed_textinput WindowBase.maximize() WindowBase.minimize() WindowBase.minimum_height WindowBase.minimum_width WindowBase.modifiers WindowBase.mouse_pos WindowBase.on_close() WindowBase.on_cursor_enter() WindowBase.on_cursor_leave() WindowBase.on_drop_begin() WindowBase.on_drop_end() WindowBase.on_drop_file() WindowBase.on_drop_text() WindowBase.on_flip() WindowBase.on_hide() WindowBase.on_joy_axis() WindowBase.on_joy_ball() WindowBase.on_joy_button_down() WindowBase.on_joy_button_up() WindowBase.on_joy_hat() WindowBase.on_key_down() WindowBase.on_key_up() WindowBase.on_keyboard() WindowBase.on_maximize() WindowBase.on_memorywarning() WindowBase.on_minimize() WindowBase.on_motion() WindowBase.on_mouse_down() WindowBase.on_mouse_move() WindowBase.on_mouse_up() WindowBase.on_request_close() WindowBase.on_resize() WindowBase.on_restore() WindowBase.on_rotate() WindowBase.on_show() WindowBase.on_textedit() WindowBase.on_textinput() WindowBase.on_touch_down() WindowBase.on_touch_move() WindowBase.on_touch_up() WindowBase.opacity WindowBase.parent WindowBase.raise_window() WindowBase.register_event_manager() WindowBase.release_all_keyboards() WindowBase.release_keyboard() WindowBase.remove_widget() WindowBase.request_keyboard() WindowBase.restore() WindowBase.rotation WindowBase.screenshot() WindowBase.set_custom_titlebar() WindowBase.set_icon() WindowBase.set_system_cursor() WindowBase.set_title() WindowBase.set_vkeyboard_class() WindowBase.shape_color_key WindowBase.shape_cutoff WindowBase.shape_image WindowBase.shape_mode WindowBase.shaped WindowBase.show() WindowBase.show_cursor WindowBase.size WindowBase.softinput_mode WindowBase.system_size WindowBase.to_normalized_pos() WindowBase.top WindowBase.transform_motion_event_2d() WindowBase.ungrab_mouse() WindowBase.unregister_event_manager() WindowBase.width Window¶ Core class for creating the default Kivy window. Kivy supports only one window per application: please don’t try to create more than one. class kivy.core.window.Keyboard(**kwargs)[source]¶ Bases: kivy.event.EventDispatcher Keyboard interface that is returned by WindowBase.request_keyboard(). When you request a keyboard, you’ll get an instance of this class. Whatever the keyboard input is (system or virtual keyboard), you’ll receive events through this instance. Events: on_key_down: keycode, text, modifiersFired when a new key is pressed down on_key_up: keycodeFired when a key is released (up) Here is an example of how to request a Keyboard in accordance with the current configuration: import kivy kivy.require('1.0.8') from kivy.core.window import Window from kivy.uix.widget import Widget class MyKeyboardListener(Widget): def __init__(self, **kwargs): super(MyKeyboardListener, self).__init__(**kwargs) self._keyboard = Window.request_keyboard( self._keyboard_closed, self, 'text') if self._keyboard.widget: # If it exists, this widget is a VKeyboard object which you can use # to change the keyboard layout. pass self._keyboard.bind(on_key_down=self._on_keyboard_down) def _keyboard_closed(self): print('My keyboard have been closed!') self._keyboard.unbind(on_key_down=self._on_keyboard_down) self._keyboard = None def _on_keyboard_down(self, keyboard, keycode, text, modifiers): print('The key', keycode, 'have been pressed') print(' - text is %r' % text) print(' - modifiers are %r' % modifiers) # Keycode is composed of an integer + a string # If we hit escape, release the keyboard if keycode[1] == 'escape': keyboard.release() # Return True to accept the key. Otherwise, it will be used by # the system. return True if __name__ == '__main__': from kivy.base import runTouchApp runTouchApp(MyKeyboardListener()) callback¶ Callback that will be called when the keyboard is released keycode_to_string(value)[source]¶ Convert a keycode number to a string according to the Keyboard.keycodes. If the value is not found in the keycodes, it will return ‘’. release()[source]¶ Call this method to release the current keyboard. This will ensure that the keyboard is no longer attached to your callback. string_to_keycode(value)[source]¶ Convert a string to a keycode number according to the Keyboard.keycodes. If the value is not found in the keycodes, it will return -1. target¶ Target that have requested the keyboard widget¶ VKeyboard widget, if allowed by the configuration window¶ Window which the keyboard is attached too class kivy.core.window.WindowBase(**kwargs)[source]¶ Bases: kivy.event.EventDispatcher WindowBase is an abstract window widget for any window implementation. Parameters: borderless: str, one of (‘0’, ‘1’)Set the window border state. Check the config documentation for a more detailed explanation on the values. custom_titlebar: str, one of (‘0’, ‘1’)Set to ‘1’ to uses a custom titlebar fullscreen: str, one of (‘0’, ‘1’, ‘auto’, ‘fake’)Make the window fullscreen. Check the config documentation for a more detailed explanation on the values. width: intWidth of the window. height: intHeight of the window. minimum_width: intMinimum width of the window (only works for sdl2 window provider). minimum_height: intMinimum height of the window (only works for sdl2 window provider). always_on_top: boolWhen enabled, the window will be brought to the front and will keep the window above the rest. If disabled, it will restore the default behavior. Only works for the sdl2 window provider. allow_screensaver: boolAllow the device to show a screen saver, or to go to sleep on mobile devices. Defaults to True. Only works for sdl2 window provider. Events: on_motion: etype, motioneventFired when a new MotionEvent is dispatched on_touch_down:Fired when a new touch event is initiated. on_touch_move:Fired when an existing touch event changes location. on_touch_up:Fired when an existing touch event is terminated. on_draw:Fired when the Window is being drawn. on_flip:Fired when the Window GL surface is being flipped. on_rotate: rotationFired when the Window is being rotated. on_close:Fired when the Window is closed. on_request_close:Fired when the event loop wants to close the window, or if the escape key is pressed and exit_on_escape is True. If a function bound to this event returns True, the window will not be closed. If the event is triggered because of the keyboard escape key, the keyword argument source is dispatched along with a value of keyboard to the bound functions. New in version 1.9.0. on_cursor_enter:Fired when the cursor enters the window. New in version 1.9.1. on_cursor_leave:Fired when the cursor leaves the window. New in version 1.9.1. on_minimize:Fired when the window is minimized. New in version 1.10.0. on_maximize:Fired when the window is maximized. New in version 1.10.0. on_restore:Fired when the window is restored. New in version 1.10.0. on_hide:Fired when the window is hidden. New in version 1.10.0. on_show:Fired when the window is shown. New in version 1.10.0. on_keyboard: key, scancode, codepoint, modifierFired when the keyboard is used for input. Changed in version 1.3.0: The unicode parameter has been deprecated in favor of codepoint, and will be removed completely in future versions. on_key_down: key, scancode, codepoint, modifierFired when a key pressed. Changed in version 1.3.0: The unicode parameter has been deprecated in favor of codepoint, and will be removed completely in future versions. on_key_up: key, scancode, codepointFired when a key is released. Changed in version 1.3.0: The unicode parameter has be deprecated in favor of codepoint, and will be removed completely in future versions. on_drop_begin: x, y, *argsFired when text(s) or file(s) drop on the application is about to begin. New in version 2.1.0. on_drop_file: filename (bytes), x, y, *argsFired when a file is dropped on the application. New in version 1.2.0. Changed in version 2.1.0: Renamed from on_dropfile to on_drop_file. on_drop_text: text (bytes), x, y, *argsFired when a text is dropped on the application. New in version 2.1.0. on_drop_end: x, y, *argsFired when text(s) or file(s) drop on the application has ended. New in version 2.1.0. on_memorywarning:Fired when the platform have memory issue (iOS / Android mostly) You can listen to this one, and clean whatever you can. New in version 1.9.0. on_textedit(self, text):Fired when inputting with IME. The string inputting with IME is set as the parameter of this event. New in version 1.10.1. add_widget(widget, canvas=None)[source]¶ Add a widget to a window allow_screensaver¶ Whether the screen saver is enabled, or on mobile devices whether the device is allowed to go to sleep while the app is open. New in version 1.10.0. allow_screensaver is a BooleanProperty and defaults to True. always_on_top¶ When enabled, the window will be brought to the front and will keep the window above the rest. If disabled, it will restore the default behavior. This option can be toggled freely during the window’s lifecycle. Only works for the sdl2 window provider. Check the config documentation for a more detailed explanation on the values. New in version 2.2.0. always_on_top is a BooleanProperty and defaults to False. borderless¶ When set to True, this property removes the window border/decoration. Check the config documentation for a more detailed explanation on the values. New in version 1.9.0. borderless is a BooleanProperty and defaults to False. center¶ Center of the rotated window. New in version 1.0.9. center is an AliasProperty. children¶ List of the children of this window. children is a ListProperty instance and defaults to an empty list. Use add_widget() and remove_widget() to manipulate the list of children. Don’t manipulate the list directly unless you know what you are doing. clear()[source]¶ Clear the window with the background color clearcolor¶ Color used to clear the window. from kivy.core.window import Window # red background color Window.clearcolor = (1, 0, 0, 1) # don't clear background at all Window.clearcolor = None Changed in version 1.7.2: The clearcolor default value is now: (0, 0, 0, 1). New in version 1.0.9. clearcolor is an ColorProperty and defaults to (0, 0, 0, 1). Changed in version 2.1.0: Changed from AliasProperty to ColorProperty. close()[source]¶ Close the window create_window(*largs)[source]¶ Will create the main window and configure it. Warning This method is called automatically at runtime. If you call it, it will recreate a RenderContext and Canvas. This means you’ll have a new graphics tree, and the old one will be unusable. This method exist to permit the creation of a new OpenGL context AFTER closing the first one. (Like using runTouchApp() and stopTouchApp()). This method has only been tested in a unittest environment and is not suitable for Applications. Again, don’t use this method unless you know exactly what you are doing! custom_titlebar¶ When set to True, allows the user to set a widget as a titlebar. Check the config documentation for a more detailed explanation on the values. New in version 2.1.0. see set_custom_titlebar() for detailed usage custom_titlebar is a BooleanProperty and defaults to False. dpi¶ Return the DPI of the screen as computed by the window. If the implementation doesn’t support DPI lookup, it’s 96. Warning This value is not cross-platform. Use kivy.metrics.Metrics.dpi instead. event_managers = None¶ Holds a list of registered event managers. Don’t change the property directly but use register_event_manager() and unregister_event_manager() to register and unregister an event manager. Event manager is an instance of EventManagerBase. New in version 2.1.0. Warning This is an experimental property and it remains so while this warning is present. event_managers_dict = None¶ Holds a dict of type_id to list of event managers. Don’t change the property directly but use register_event_manager() and unregister_event_manager() to register and unregister an event manager. Event manager is an instance of EventManagerBase. New in version 2.1.0. Warning This is an experimental property and it remains so while this warning is present. flip()[source]¶ Flip between buffers focus¶ Check whether or not the window currently has focus. New in version 1.9.1. focus is a read-only AliasProperty and defaults to True. fullscreen¶ This property sets the fullscreen mode of the window. Available options are: True, False, ‘auto’ and ‘fake’. Check the config documentation for more detailed explanations on these values. fullscreen is an OptionProperty and defaults to False. New in version 1.2.0. Note The ‘fake’ option has been deprecated, use the borderless property instead. Warning On iOS, setting fullscreen to False will not automatically hide the status bar. To achieve this, you must set fullscreen to False, and then also set borderless to False. get_gl_backend_name()[source]¶ Returns the gl backend that will or is used with this window. gl_backends_allowed = []¶ A list of Kivy gl backend names, which if not empty, will be the exclusive list of gl backends that can be used with this window. gl_backends_ignored = []¶ A list of Kivy gl backend names that may not be used with this window. grab_mouse()[source]¶ Grab mouse - so won’t leave window New in version 1.10.0. Note This feature requires the SDL2 window provider. height¶ Rotated window height. height is a read-only AliasProperty. hide()[source]¶ Hides the window. This method should be used on desktop platforms only. New in version 1.9.0. Note This feature requires the SDL2 window provider and is currently only supported on desktop platforms. icon¶ A path to the window icon. New in version 1.1.2. icon is a StringProperty. keyboard_anim_args = {'d': 0.5, 't': 'in_out_quart'}¶ The attributes for animating softkeyboard/IME. t = transition, d = duration. This value will have no effect on desktops. New in version 1.10.0. keyboard_anim_args is a dict and defaults to {‘t’: ‘in_out_quart’, ‘d’: .5}. keyboard_height¶ Returns the height of the softkeyboard/IME on mobile platforms. Will return 0 if not on mobile platform or if IME is not active. Note This property returns 0 with SDL2 on Android, but setting Window.softinput_mode does work. New in version 1.9.0. keyboard_height is a"
