title = "Effects — Kivy 2.3.1 documentation"
full_description = "Table Of Contents Effects Effects¶ New in version 1.7.0. Everything starts with the KineticEffect, the base class for computing velocity out of a movement. This base class is used to implement the ScrollEffect, a base class used for our ScrollView widget effect. We have multiple implementations: ScrollEffect: base class used for implementing an effect. It only calculates the scrolling and the overscroll. DampedScrollEffect: uses the overscroll information to allow the user to drag more than expected. Once the user stops the drag, the position is returned to one of the bounds. OpacityScrollEffect: uses the overscroll information to reduce the opacity of the scrollview widget. When the user stops the drag, the opacity is set back to 1. Damped scroll effect DampedScrollEffect DampedScrollEffect.edge_damping DampedScrollEffect.min_overscroll DampedScrollEffect.round_value DampedScrollEffect.spring_constant DampedScrollEffect.update_velocity() Kinetic effect KineticEffect KineticEffect.cancel() KineticEffect.friction KineticEffect.is_manual KineticEffect.max_history KineticEffect.min_distance KineticEffect.min_velocity KineticEffect.start() KineticEffect.std_dt KineticEffect.stop() KineticEffect.update() KineticEffect.update_velocity() KineticEffect.value KineticEffect.velocity Opacity scroll effect OpacityScrollEffect Scroll effect ScrollEffect ScrollEffect.displacement ScrollEffect.drag_threshold ScrollEffect.max ScrollEffect.min ScrollEffect.overscroll ScrollEffect.reset() ScrollEffect.scroll ScrollEffect.start() ScrollEffect.stop() ScrollEffect.target_widget ScrollEffect.update() « Kivy module for binary dependencies. Damped scroll effect »"
