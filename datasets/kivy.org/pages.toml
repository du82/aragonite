description = "kivy.clock."
full_description = '''Table Of Contents Clock object Schedule before frame Triggered Events Unscheduling Clock Lifecycle Exception Handling Scheduling from __del__ Threading and Callback Order Advanced Clock Details Default Clock Interruptible Clock Free Clock Free Only Clock Summary Async clock support Clock ClockBase ClockBase.usleep() ClockBaseBehavior ClockBaseBehavior.MIN_SLEEP ClockBaseBehavior.async_idle() ClockBaseBehavior.async_tick() ClockBaseBehavior.frames ClockBaseBehavior.frames_displayed ClockBaseBehavior.frametime ClockBaseBehavior.get_boottime() ClockBaseBehavior.get_fps() ClockBaseBehavior.get_rfps() ClockBaseBehavior.get_time() ClockBaseBehavior.idle() ClockBaseBehavior.init_async_lib() ClockBaseBehavior.post_idle() ClockBaseBehavior.pre_idle() ClockBaseBehavior.tick() ClockBaseBehavior.tick_draw() ClockBaseBehavior.time() ClockBaseBehavior.usleep() ClockBaseFreeInterruptAll ClockBaseFreeInterruptOnly ClockBaseFreeInterruptOnly.async_idle() ClockBaseFreeInterruptOnly.idle() ClockBaseInterrupt ClockBaseInterruptBehavior ClockBaseInterruptBehavior.async_idle() ClockBaseInterruptBehavior.idle() ClockBaseInterruptBehavior.init_async_lib() ClockBaseInterruptBehavior.usleep() ClockBaseInterruptFreeBehavior ClockEvent ClockEvent.callback ClockEvent.cancel() ClockEvent.cid ClockEvent.clock ClockEvent.clock_ended_callback ClockEvent.get_callback() ClockEvent.get_clock_ended_callback() ClockEvent.is_triggered ClockEvent.loop ClockEvent.next ClockEvent.prev ClockEvent.release() ClockEvent.release_ref ClockEvent.tick() ClockEvent.timeout ClockEvent.weak_callback ClockEvent.weak_clock_ended_callback ClockNotRunningError CyClockBase CyClockBase.clock_resolution CyClockBase.create_lifecycle_aware_trigger() CyClockBase.create_trigger() CyClockBase.get_before_frame_events() CyClockBase.get_events() CyClockBase.get_min_timeout() CyClockBase.get_resolution() CyClockBase.handle_exception() CyClockBase.has_ended CyClockBase.has_started CyClockBase.max_iteration CyClockBase.on_schedule() CyClockBase.schedule_del_safe() CyClockBase.schedule_interval() CyClockBase.schedule_lifecycle_aware_del_safe() CyClockBase.schedule_once() CyClockBase.start_clock() CyClockBase.stop_clock() CyClockBase.unschedule() CyClockBaseFree CyClockBaseFree.create_lifecycle_aware_trigger() CyClockBaseFree.create_lifecycle_aware_trigger_free() CyClockBaseFree.create_trigger() CyClockBaseFree.create_trigger_free() CyClockBaseFree.get_min_free_timeout() CyClockBaseFree.schedule_interval() CyClockBaseFree.schedule_interval_free() CyClockBaseFree.schedule_once() CyClockBaseFree.schedule_once_free() FreeClockEvent FreeClockEvent.free mainthread() triggered() Clock object¶ The Clock object allows you to schedule a function call in the future; once or repeatedly at specified intervals. You can get the time elapsed between the scheduling and the calling of the callback via the dt argument: # dt means delta-time def my_callback(dt): pass # call my_callback every 0.5 seconds Clock.schedule_interval(my_callback, 0.5) # call my_callback in 5 seconds Clock.schedule_once(my_callback, 5) # call my_callback as soon as possible (usually next frame.) Clock.schedule_once(my_callback) Note If the callback returns False, the schedule will be canceled and won’t repeat. If you want to schedule a function to call with default arguments, you can use the functools.partial python module: from functools import partial def my_callback(value, key, *largs): pass Clock.schedule_interval(partial(my_callback, 'my value', 'my key'), 0.5) Conversely, if you want to schedule a function that doesn’t accept the dt argument, you can use a lambda expression to write a short function that does accept dt. For Example: def no_args_func(): print("I accept no arguments, so don't schedule me in the clock") Clock.schedule_once(lambda dt: no_args_func(), 0.5) Note You cannot unschedule an anonymous function unless you keep a reference to it. It’s better to add *args to your function definition so that it can be called with an arbitrary number of parameters. Important The class method callback is weak-referenced: you are responsible for keeping a reference to your original object/callback. If you don’t keep a reference, the ClockBase will never execute your callback. For example: class Foo(object): def start(self): Clock.schedule_interval(self.callback, 0.5) def callback(self, dt): print('In callback') # A Foo object is created and the method start is called. # Because no reference is kept to the instance returned from Foo(), # the object will be collected by the Python Garbage Collector and # your callback will be never called. Foo().start() # So you should do the following and keep a reference to the instance # of foo until you don't need it anymore! foo = Foo() foo.start() Schedule before frame¶ New in version 1.0.5. Sometimes you need to schedule a callback BEFORE the next frame. Starting from 1.0.5, you can use a timeout of -1: Clock.schedule_once(my_callback, 0) # call after the next frame Clock.schedule_once(my_callback, -1) # call before the next frame The Clock will execute all the callbacks with a timeout of -1 before the next frame even if you add a new callback with -1 from a running callback. However, Clock has an iteration limit for these callbacks: it defaults to 10. If you schedule a callback that schedules a callback that schedules a … etc more than 10 times, it will leave the loop and send a warning to the console, then continue after the next frame. This is implemented to prevent bugs from hanging or crashing the application. If you need to increase the limit, set the max_iteration property: from kivy.clock import Clock Clock.max_iteration = 20 Triggered Events¶ New in version 1.0.5. CyClockBase.create_trigger() is an advanced method way to defer a callback. It functions exactly like CyClockBase.schedule_once() and CyClockBase.schedule_interval() except that it doesn’t immediately schedule the callback. Instead, one schedules the callback using the ClockEvent returned by it. This ensures that you can call the event multiple times but it won’t be scheduled more than once. This is not the case with CyClockBase.schedule_once(): # will run the callback twice before the next frame Clock.schedule_once(my_callback) Clock.schedule_once(my_callback) # will run the callback once before the next frame event = Clock.create_trigger(my_callback) event() event() # will also run the callback only once before the next frame event = Clock.schedule_once(my_callback) # now it's already scheduled event() # won't be scheduled again event() In addition, it is more convenient to create and bind to the triggered event than using CyClockBase.schedule_once() in a function: from kivy.clock import Clock from kivy.uix.widget import Widget class Sample(Widget): def __init__(self, **kwargs): self._trigger = Clock.create_trigger(self.cb) super(Sample, self).__init__(**kwargs) self.bind(x=self._trigger, y=self._trigger) def cb(self, *largs): pass Even if x and y changes within one frame, the callback is only run once. Unscheduling¶ An event scheduled with CyClockBase.schedule_once(), CyClockBase.schedule_interval(), or with CyClockBase.create_trigger() and then triggered can be unscheduled in multiple ways. E.g: def my_callback(dt): pass # call my_callback every 0.5 seconds event = Clock.schedule_interval(my_callback, 0.5) # call my_callback in 5 seconds event2 = Clock.schedule_once(my_callback, 5) event_trig = Clock.create_trigger(my_callback, 5) event_trig() # unschedule using cancel event.cancel() # unschedule using Clock.unschedule Clock.unschedule(event2) # unschedule using Clock.unschedule with the callback # NOT RECOMMENDED Clock.unschedule(my_callback) The best way to unschedule a callback is with ClockEvent.cancel(). CyClockBase.unschedule() is mainly an alias for that for that function. However, if the original callback itself is passed to CyClockBase.unschedule(), it’ll unschedule all instances of that callback (provided all is True, the default, otherwise only the first match is removed). Calling CyClockBase.unschedule() on the original callback is highly discouraged because it’s significantly slower than when using the event. Clock Lifecycle¶ Kivy’s clock has a lifecycle. By default, scheduling a callback after the Clock has ended will not raise an error, even though the callback may never be called. That’s because most callbacks are like services, e.g. responding to a user button press - if the app is running the callbacks need to service the app and respond to the input, but once the app has stopped or is stopping, we can safely not process these events. Other events always need to be processed. E.g. another thread may request a callback in kivy’s thread and then process some result. If the event is not processed in Kivy’s thread because the app stopped, the second thread may block forever hanging the application as it exits. Consequently, we provide a API (CyClockBase.create_lifecycle_aware_trigger()) for scheduling callbacks that raise a ClockNotRunningError if the clock has stopped. If the scheduling succeeded it guarantees that one of its callbacks will be called. I.e. the new CyClockBase.create_lifecycle_aware_trigger() accepts an additional clock_ended_callback parameter. Normally, callback will be called when the event is processed. But, if the clock is stopped before it can be processed, if the application exited normally (and the app was started) and the event wasn’t canceled, and the callbacks are not garbage collected, then clock_ended_callback will be called instead when the clock is stopped. That is, given these conditions, if ClockNotRunningError was not raised when the event was scheduled, then one of these callbacks will be called - either callback if the event executed normally, or clock_ended_callback if the clock is stopped while the event is scheduled. By default, events can be scheduled before the clock is started because it is assumed the clock will eventually be started when the app starts. I.e. calling CyClockBase.create_lifecycle_aware_trigger() before the clock and application starts will succeed. But if the app never actually starts, then neither of the callbacks may be executed. New in version 2.0.0: The lifecycle was added in 2.0.0 Exception Handling¶ Kivy provides a exception handling manager, ExceptionManager, to handle its internal exceptions including exceptions raised by clock callbacks, without crashing the application. By default when an exception is raised, the app will crash. But, if a handler is registered with the exception manager and the handler handles the exception, the app will not crash and will continue as normal.: from kivy.base import ExceptionHandler, ExceptionManager class MyHandler(ExceptionHandler): def handle_exception(self, inst): if isinstance(inst, ValueError): Logger.exception('ValueError caught by MyHandler') return ExceptionManager.PASS return ExceptionManager.RAISE ExceptionManager.add_handler(MyHandler()) Then, all ValueError exceptions will be logged to the console and ignored. Similarly, if a scheduled clock callback raises a ValueError, other clock events will still be processed normally. If an event’s callback raises an exception, before the exception handler is executed, the callback is immediately canceled. It still is possible for the app to be corrupted if kivy itself is the source of the exception. I.e. even with a handler that ignores exceptions and doesn’t crash, the app may be in a corrupted state if the error originates from within Kivy itself. However, the exception handler can help protect the app from crashing and can help protect against user callbacks crashing the app. Changed in version 2.0.0: Prior to Kivy 2.0.0, an exception raised in a event’s callback would cause the clock to crash and subsequent events may or may not be executed. Even if the exception was handled by an ExceptionHandler, there was no guarantee that some scheduled events would not be skipped. From 2.0.0 onward, if a event’s exception is handled by an ExceptionHandler, other events will be shielded from the exception and will execute normally. Scheduling from __del__¶ It is not safe to schedule Clock events from a object’s __del__ or __dealloc__ method. If you must schedule a Clock call from this method, use CyClockBase.schedule_del_safe() or CyClockBase.schedule_lifecycle_aware_del_safe() instead. Threading and Callback Order¶ Beginning with 1.10.0, all the events scheduled for the same frame, e.g. all the events scheduled in the same frame with a timeout of 0, well be executed in the order they were scheduled. Also, all the scheduling and canceling methods are fully thread safe and can be safely used from external threads. As a consequence, calling CyClockBase.unschedule() with the original callback is now significantly slower and highly discouraged. Instead, the returned events should be used to cancel. As a tradeoff, all the other methods are now significantly faster than before. Advanced Clock Details¶ The following section goes into the internal kivy clock details as well as the various clock options. It is meant only for advanced users. Fundamentally, the Kivy clock attempts to execute any scheduled callback rhythmically as determined by the specified fps (frame per second, see maxfps in config). That is, ideally, given e.g. a desired fps of 30, the clock will execute the callbacks at intervals of 1 / 30 seconds, or every 33.33 ms. All the callbacks in a frame are given the same timestamp, i.e. the dt passed to the callback are all the same and it’s the difference in time between the start of this and the previous frame. Because of inherent indeterminism, the frames do not actually occur exactly at intervals of the fps and dt may be under or over the desired fps. Also, once the timeout is “close enough” to the desired timeout, as determined internally, Kivy will execute the callback in the current frame even when the “actual time” has not elapsed the timeout amount. Kivy offers now, since 1.10.0, multiple clocks with different behaviors. Default Clock¶ The default clock (default) behaves as described above. When a callback with a timeout of zero or non-zero is scheduled, they are executed at the frame that is near the timeout, which is a function of the fps. So a timeout of zero would still result in a delay of one frame or about 1 / fps, typically a bit less but sometimes more depending on the CPU usage of the other events scheduled for that frame. In a test using a fps of 30, a callback with a timeout of 0, 0.001, and 0.05, resulted in a mean callback delay of 0.02487, 0.02488, and 0.05011 seconds, respectively. When tested with a fps of 600 the delay for 0.05 was similar, except the standard deviation was reduced resulting in overall better accuracy. Interruptible Clock¶ The default clock suffers from the quantization problem, as frames occur only on intervals and any scheduled timeouts will not be able to occur during an interval. For example, with the '''
