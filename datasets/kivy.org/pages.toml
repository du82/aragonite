title = "Factory object — Kivy 2.3.1 documentation"
description = "kivy.factory."
full_description = "Table Of Contents Factory object Factory FactoryException Factory object¶ The factory can be used to automatically register any class or module and instantiate classes from it anywhere in your project. It is an implementation of the Factory Pattern. The class list and available modules are automatically generated by setup.py. Example for registering a class/module: >>> from kivy.factory import Factory >>> Factory.register('Widget', module='kivy.uix.widget') >>> Factory.register('Vector', module='kivy.vector') Example of using the Factory: >>> from kivy.factory import Factory >>> widget = Factory.Widget(pos=(456,456)) >>> vector = Factory.Vector(9, 2) Example using a class name: >>> from kivy.factory import Factory >>> Factory.register('MyWidget', cls=MyWidget) By default, the first classname you register via the factory is permanent. If you wish to change the registered class, you need to unregister the classname before you re-assign it: >>> from kivy.factory import Factory >>> Factory.register('MyWidget', cls=MyWidget) >>> widget = Factory.MyWidget() >>> Factory.unregister('MyWidget') >>> Factory.register('MyWidget', cls=CustomWidget) >>> customWidget = Factory.MyWidget() kivy.factory.Factory: FactoryBase = <kivy.factory.FactoryBase object>¶ Factory instance to use for getting new classes exception kivy.factory.FactoryException[source]¶ Bases: Exception « Event dispatcher Geometry utilities »"
