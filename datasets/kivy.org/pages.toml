title = "Graphics — Kivy 2.3.1 documentation"
description = "kivy.graphics."
full_description = "Table Of Contents Graphics The basics GL Reloading mechanism ApplyContextMatrix ApplyContextMatrix.source_stack ApplyContextMatrix.target_stack Bezier Bezier.dash_length Bezier.dash_offset Bezier.points Bezier.segments BindTexture BindTexture.source BorderImage BorderImage.auto_scale BorderImage.border BorderImage.display_border BoxShadow BoxShadow.blur_radius BoxShadow.border_radius BoxShadow.inset BoxShadow.offset BoxShadow.pos BoxShadow.size BoxShadow.spread_radius Callback Callback.ask_update() Callback.callback Callback.reset_context Canvas Canvas.add() Canvas.after Canvas.ask_update() Canvas.before Canvas.clear() Canvas.draw() Canvas.has_after Canvas.has_before Canvas.opacity Canvas.remove() CanvasBase ChangeState ClearBuffers ClearBuffers.clear_color ClearBuffers.clear_depth ClearBuffers.clear_stencil ClearColor ClearColor.a ClearColor.b ClearColor.g ClearColor.r ClearColor.rgb ClearColor.rgba Color Color.a Color.b Color.g Color.h Color.hsv Color.r Color.rgb Color.rgba Color.s Color.v ContextInstruction Ellipse Ellipse.angle_end Ellipse.angle_start Ellipse.segments Fbo Fbo.add_reload_observer() Fbo.bind() Fbo.clear_buffer() Fbo.clear_color Fbo.get_pixel_color() Fbo.pixels Fbo.release() Fbo.remove_reload_observer() Fbo.size Fbo.texture GraphicException Instruction Instruction.flag_data_update() Instruction.flag_update() Instruction.group Instruction.proxy_ref InstructionGroup InstructionGroup.add() InstructionGroup.children InstructionGroup.clear() InstructionGroup.get_group() InstructionGroup.indexof() InstructionGroup.insert() InstructionGroup.length() InstructionGroup.remove() InstructionGroup.remove_group() Line Line.bezier Line.bezier_precision Line.cap Line.cap_precision Line.circle Line.close Line.close_mode Line.dash_length Line.dash_offset Line.dashes Line.ellipse Line.force_custom_drawing_method Line.joint Line.joint_precision Line.points Line.rectangle Line.rounded_rectangle Line.width LoadIdentity LoadIdentity.stack MatrixInstruction MatrixInstruction.matrix MatrixInstruction.stack Mesh Mesh.indices Mesh.mode Mesh.vertices Point Point.add_point() Point.points Point.pointsize PopMatrix PopMatrix.stack PopState PushMatrix PushMatrix.stack PushState Quad Quad.points Rectangle Rectangle.points Rectangle.pos Rectangle.size RenderContext RenderContext.shader RenderContext.use_parent_frag_modelview RenderContext.use_parent_modelview RenderContext.use_parent_projection Rotate Rotate.angle Rotate.axis Rotate.origin Rotate.set() Scale Scale.origin Scale.x Scale.xyz Scale.y Scale.z SmoothEllipse SmoothEllipse.default_texture SmoothLine SmoothLine.overdraw_width SmoothLine.premultiplied_texture() SmoothQuad SmoothQuad.default_texture SmoothRectangle SmoothRectangle.default_texture SmoothRoundedRectangle SmoothRoundedRectangle.default_texture SmoothTriangle SmoothTriangle.default_texture StencilPop StencilPush StencilPush.clear_stencil StencilUnUse StencilUse StencilUse.func_op Translate Translate.x Translate.xy Translate.xyz Translate.y Translate.z Triangle Triangle.points UpdateNormalMatrix VertexInstruction VertexInstruction.source VertexInstruction.tex_coords VertexInstruction.texture gl_init_resources() Graphics¶ This package assembles many low level functions used for drawing. The whole graphics package is compatible with OpenGL ES 2.0 and has many rendering optimizations. The basics¶ For drawing on a screen, you will need : a Canvas object. Instruction objects. Each Widget in Kivy already has a Canvas by default. When you create a widget, you can create all the instructions needed for drawing. If self is your current widget, you can do: from kivy.graphics import * with self.canvas: # Add a red color Color(1., 0, 0) # Add a rectangle Rectangle(pos=(10, 10), size=(500, 500)) The instructions Color and Rectangle are automatically added to the canvas object and will be used when the window is drawn. Note Kivy drawing instructions are not automatically relative to the position or size of the widget. You, therefore, need to consider these factors when drawing. In order to make your drawing instructions relative to the widget, the instructions need either to be declared in the KvLang or bound to pos and size changes. Please see Adding a Background to a Layout for more detail. GL Reloading mechanism¶ New in version 1.2.0. During the lifetime of the application, the OpenGL context might be lost. This happens: when the window is resized on OS X or the Windows platform and you’re using pygame as a window provider. This is due to SDL 1.2. In the SDL 1.2 design, it needs to recreate a GL context everytime the window is resized. This was fixed in SDL 1.3 but pygame is not yet available on it by default. when Android releases the app resources: when your application goes to the background, Android might reclaim your opengl context to give the resource to another app. When the user switches back to your application, a newly created gl context is given to your app. Starting from 1.2.0, we have introduced a mechanism for reloading all the graphics resources using the GPU: Canvas, FBO, Shader, Texture, VBO, and VertexBatch: VBO and VertexBatch are constructed by our graphics instructions. We have all the data needed to reconstruct when reloading. Shader: same as VBO, we store the source and values used in the shader so we are able to recreate the vertex/fragment/program. Texture: if the texture has a source (an image file or atlas), the image is reloaded from the source and reuploaded to the GPU. You should cover these cases yourself: Textures without a source: if you manually created a texture and manually blit data / a buffer to it, you must handle the reloading yourself. Check the Texture to learn how to manage that case. (The text rendering already generates the texture and handles the reloading. You don’t need to reload text yourself.) FBO: if you added / removed / drew things multiple times on the FBO, we can’t reload it. We don’t keep a history of the instructions put on it. As for textures without a source, check the Framebuffer to learn how to manage that case. class kivy.graphics.ApplyContextMatrix(**kwargs)¶ Bases: kivy.graphics.instructions.ContextInstruction target_stack by the matrix at the top of the ‘source_stack’ New in version 1.6.0. source_stack¶ Name of the matrix stack to use as a source. Can be ‘modelview_mat’, ‘projection_mat’ or ‘frag_modelview_mat’. New in version 1.6.0. target_stack¶ Name of the matrix stack to use as a target. Can be ‘modelview_mat’, ‘projection_mat’ or ‘frag_modelview_mat’. New in version 1.6.0. class kivy.graphics.Bezier(**kwargs)¶ Bases: kivy.graphics.instructions.VertexInstruction New in version 1.0.8. Parameters: points: listList of points in the format (x1, y1, x2, y2…) segments: int, defaults to 180Define how many segments are needed for drawing the curve. The drawing will be smoother if you have many segments. loop: bool, defaults to FalseSet the bezier curve to join the last point to the first. dash_length: intLength of a segment (if dashed), defaults to 1. dash_offset: intDistance between the end of a segment and the start of the next one, defaults to 0. Changing this makes it dashed. dash_length¶ Property for getting/setting the length of the dashes in the curve. dash_offset¶ Property for getting/setting the offset between the dashes in the curve. points¶ Property for getting/settings the points of the triangle. Warning This will always reconstruct the whole graphic from the new points list. It can be very CPU intensive. segments¶ Property for getting/setting the number of segments of the curve. class kivy.graphics.BindTexture(**kwargs)¶ Bases: kivy.graphics.instructions.ContextInstruction The BindTexture Instruction will bind a texture and enable GL_TEXTURE_2D for subsequent drawing. Parameters: texture: TextureSpecifies the texture to bind to the given index. source¶ Set/get the source (filename) to load for the texture. class kivy.graphics.BorderImage(**kwargs)¶ Bases: kivy.graphics.vertex_instructions.Rectangle concept of a CSS3 border-image. Parameters: border: listBorder information in the format (bottom, right, top, left). Each value is in pixels. auto_scale: string New in version 1.9.1. Changed in version 1.9.2: This used to be a bool and has been changed to be a string state. Can be one of ‘off’, ‘both’, ‘x_only’, ‘y_only’, ‘y_full_x_lower’, ‘x_full_y_lower’, ‘both_lower’. Autoscale controls the behavior of the 9-slice. By default the border values are preserved exactly, meaning that if the total size of the object is smaller than the border values you will have some ‘rendering errors’ where your texture appears inside out. This also makes it impossible to achieve a rounded button that scales larger than the size of its source texture. The various options for auto_scale will let you achieve some mixes of the 2 types of rendering. ‘off’: is the default and behaves as BorderImage did when auto_scale was False before. ‘both’: Scales both x and y dimension borders according to the size of the BorderImage, this disables the BorderImage making it render the same as a regular Image. ‘x_only’: The Y dimension functions as the default, and the X scales to the size of the BorderImage’s width. ‘y_only’: The X dimension functions as the default, and the Y scales to the size of the BorderImage’s height. ‘y_full_x_lower’: Y scales as in ‘y_only’, Y scales if the size of the scaled version would be smaller than the provided border only. ‘x_full_y_lower’: X scales as in ‘x_only’, Y scales if the size of the scaled version would be smaller than the provided border only. ‘both_lower’: This is what auto_scale did when it was True in 1.9.1 Both X and Y dimensions will be scaled if the BorderImage is smaller than the source. If the BorderImage’s size is less than the sum of its borders, horizontally or vertically, and this property is set to True, the borders will be rescaled to accommodate for the smaller size. auto_scale¶ Property for setting if the corners are automatically scaled when the BorderImage is too small. border¶ Property for getting/setting the border of the class. display_border¶ Property for getting/setting the border display size. class kivy.graphics.BoxShadow(*args, **kwargs)¶ Bases: kivy.graphics.instructions.InstructionGroup New in version 2.2.0. Changed in version 2.3.0: Fixed Canvas management using add(), insert() and remove(). Previously, using them to manage the Canvas had no effect. The base class also changed from Fbo to InstructionGroup. Parameters: inset: bool, defaults to False.Defines whether the shadow is drawn from the inside out or from the outline to the inside of the BoxShadow instruction. size: list | tuple, defaults to (100.0, 100.0).Define the raw size of the shadow, that is, you should not take into account changes in the value of blur_radius and spread_radius properties when setting this parameter. pos: list | tuple, defaults to (0.0, 0.0).Define the raw position of the shadow, that is, you should not take into account changes in the value of the offset property when setting this parameter. offset: list | tuple, defaults to (0.0, 0.0).Specifies shadow offsets in (horizontal, vertical) format. Positive values for the offset indicate that the shadow should move to the right and/or top. The negative ones indicate that the shadow should move to the left and/or down. blur_radius: float, defaults to 15.0.Define the shadow blur radius. Controls shadow expansion and softness. spread_radius: list | tuple, defaults to (0.0, 0.0).Define the shrink/expansion of the shadow. border_radius: list | tuple, defaults to (0.0, 0.0, 0.0, 0.0).Specifies the radii used for the rounded corners clockwise: top-left, top-right, bottom-right, bottom-left. blur_radius¶ Define the shadow blur radius. Controls shadow expansion and softness. Defaults to 15.0. In the images below, the start and end positions of the shadow blur effect length are indicated. The transition between color and transparency is seamless, and although the shadow appears to end before before the dotted rectangle, its end is made to be as smooth as possible. inset OFF: inset ON: Note In some cases (if this is not your intention), placing an element above the shadow (before the blur radius ends) will result in a unwanted cropping/overlay behavior rather than continuity, breaking the shadow’s soft ending, as shown in the image below. border_radius¶ Specifies the radii used for the rounded corners clockwise: top-left, top-right, bottom-right, bottom-left. Defaults to (0.0, 0.0, 0.0, 0.0). inset OFF: inset ON: inset¶ Defines whether the shadow is drawn from the inside out or from the outline to the inside of the BoxShadow instruction. Defaults to False. Note Although the inset mode determines the drawing behavior of the shadow, the position of the BoxShadow instruction in the canvas hierarchy depends on the other graphic instructions present in the Canvas instruction tree. In other words, if the target is in the canvas layer and you want to use the default inset = False mode to create an elevation effect, you must declare the BoxShadow instruction in canvas.before layer. <MyWidget@Widget>: size_hint: None, None size: 100, 100 pos: 100, 100 canvas.before: # BoxShadow statements Color: rgba: 0, 0, 0, 0.65 BoxShadow: pos: self.pos size: self.size offset: 0, -10 blur_radius: 25 spread_radius: -10, -10 border_radius: 10, 10, 10, 10 canvas: # target element statements Color: rgba: 1, 1, 1, 1 Rectangle: pos: self.pos size: self.size Or, if the target is in the canvas layer and you want to use the inset = True mode to create an insertion effect, you must declare the BoxShadow instruction in the canvas layer, immediately after the target canvas declaration, or declare it in canvas.after. <MyWidget@Widget>: size_hint: None, None size: 100, 100 pos: 100, 100 canvas: # target element statements Color: rgba: 1, 1, 1, 1 Rectangle: pos: self.pos size: self.size # BoxShadow statements Color: rgba: 0, 0, 0, 0.65 BoxShadow: inset: True pos: self.pos size: self.size offset: 0, -10 blur_radius: 25 spread_radius: -10, -10 border_radius: 10, 10, 10, 10 In summary: Elevation effect - inset = False: the BoxShadow instruction needs to be drawn before the target element. Insertion effect - inset = True: the BoxShadow instruction needs to be drawn after the target element. In general, BoxShadow is more flexible than box-shadow (CSS) because the inset = False and inset = True modes do not limit the drawing of the shadow below and above the target element, respectively. Actually, you can define any hierarchy you want in the Canvas declaration tree, to create more complex effects that go beyond common shadow effects. Modes: False (default) - The shadow is drawn inside out the BoxShadow instruction, creating a raised effect. True - The shadow is drawn from the outline to the inside of the BoxShadow instruction, creating a inset effect. offset¶ Specifies shadow offsets in [horizontal, vertical] format. Positive values for the offs"
