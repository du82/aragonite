full_description = "KJ PhotographyWer dahinter steckt und wie Du Kontakt aufnehmen kannst, findest Du genau hier.Mein Name ist Katharina Jäger und ich bin die Fotografin hinter KJ Photography. ​ Ich liebe es natürliche Fotos mit Tageslicht zu gestalten, ohne viel Schi Schi und Klimbim. Das gilt für meine Food-Aufnahmen genauso wie für meine Hochzeitsreportagen. ​ Eine unkomplizierte, zielorientierte Arbeitsweise und ein Hauch Kreativität, schon kann es losgehen. Zumindest dann, wenn mein Katerchen Odin nicht gerade andere Flausen im Kopf hat. ​ Wirf doch einfach mal einen Blick auf meine bisherigen Arbeiten: ​ FOODPEOPLEDu hast noch offene Fragen oder möchtest mit mir zusammenarbeiten?Dann freue ich mich auf deine Anfrage, sei es für leckere Foodaufnahmen, eine Hochzeitsreportage oder andere spannende Projekte. ​ Gerne stelle ich Dir einen individuellen Kostenvoranschlag zusammen oder vereinbare mit Dir einen Termin für ein persönliches Kennenlernen. So erreichst du mich am besten:info@kjphotography.de Tel. +49 151 651 233 15"
