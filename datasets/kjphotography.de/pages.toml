full_description = '''Modeshooting mitten in StuttgartKatharina JägerJun 20, 20181 min readUpdated: Jan 9, 2023Ende März hatte ich das Vergnügen eine Modeserie in Stuttgart für einen meiner Kunden zu fotografieren. Bisher hatte ich hauptsächlich Produktaufnahmen für den Onlineshop fotografiert und mich deshalb ganz besonders auf ein Shooting mit Model gefreut. Die Bilder sollten sich an den Street Styles, wie ihr sie auf Instagram sehen könnt, orientieren. Das klingt doch nach richtig viel Spaß oder? :) Mit den frisch gebügelten Teilen und jede Menge guter Laune ging es also schon früh für unser Model, meinen Assistenten und mich nach Stuttgart. Wir hatten ein paar Outfits an verschiedenen Locations vor uns, deshalb wollten wir früh genug in Stuttgart sein bevor die ganze Stadt wach wird. Ich hatte mir vorab schon einige potentielle Locations angeschaut und mit meinem Kunden abgesprochen. Wir haben also bei der großen Treppe am Schlossplatz, in der Fußgängerzone und in einem Café in der Nähe geshootet.Location 1Anni und KatharinaStuttgart EinkaufsmeileShooting in der Einkaufsmeile#pro-gallery-enqcq .gallery-item-container { opacity: 0 } #pro-gallery-enqcq .gallery-item-hover::before { background: transparent !important}try { window.requestAnimationFrame(function() { var ele = document.getElementById('pro-gallery-enqcq'); var pgMeasures = ele.getBoundingClientRect(); var options = (() => "gallerySizeType:px|enableInfiniteScroll:true|titlePlacement:SHOW_ON_HOVER|gridStyle:1|imageMargin:4|galleryLayout:2|isVertical:false|numberOfImagesPerRow:2|gallerySizePx:300|cubeRatio:1|cubeType:fill|galleryThumbnailsAlignment:bottom|thumbnailSpacings:0")(ele); var width = pgMeasures.width; var height = pgMeasures.height; var isIOS = /iPad|iPhone|iPod/.test(navigator?.userAgent); if(isIOS) { width = width; width = width; height = height; height = height; } else { width = width; width = width; height = height; height = height; } pgMeasures = { top: pgMeasures.top, width, height }; var isVertical = options.includes('layoutParams_structure_scrollDirection:"VERTICAL"'); var layoutFixerUrl = '/_serverless/pro-gallery-css-v4-server/layoutCss?ver=2&id=enqcq&items=3613_854_1280|3599_567_850|3724_854_1280|3330_567_850&container=' + pgMeasures.top + '_' + pgMeasures.width + '_' + pgMeasures.height + '_' + window.innerHeight + '&options=' + options; document.getElementById('layout-fixer-style-enqcq').setAttribute('href', encodeURI(layoutFixerUrl)); }); } catch (e) { console.warn('Cannot set layoutFixer css', e); } Außerdem sind wir dann auch noch zur Stuttgarter Oper und in die Nähe des Landtages für ein paar tolle Fotos gewandert. Zum Glück liegen diese Orte ja nicht allzu weit von einander entfernt. ;)Stuttgart SäulengangBeim Shooting in Stuttgart#pro-gallery-fqth0 .gallery-item-container { opacity: 0 } #pro-gallery-fqth0 .gallery-item-hover::before { background: transparent !important}try { window.requestAnimationFrame(function() { var ele = document.getElementById('pro-gallery-fqth0'); var pgMeasures = ele.getBoundingClientRect(); var options = (() => "gallerySizeType:px|enableInfiniteScroll:true|titlePlacement:SHOW_ON_HOVER|gridStyle:1|imageMargin:4|galleryLayout:2|isVertical:false|numberOfImagesPerRow:2|gallerySizePx:300|cubeRatio:1|cubeType:fill|galleryThumbnailsAlignment:bottom|thumbnailSpacings:0")(ele); var width = pgMeasures.width; var height = pgMeasures.height; var isIOS = /iPad|iPhone|iPod/.test(navigator?.userAgent); if(isIOS) { width = width; width = width; height = height; height = height; } else { width = width; width = width; height = height; height = height; } pgMeasures = { top: pgMeasures.top, width, height }; var isVertical = options.includes('layoutParams_structure_scrollDirection:"VERTICAL"'); var layoutFixerUrl = '/_serverless/pro-gallery-css-v4-server/layoutCss?ver=2&id=fqth0&items=3606_854_1280|3512_567_850&container=' + pgMeasures.top + '_' + pgMeasures.width + '_' + pgMeasures.height + '_' + window.innerHeight + '&options=' + options; document.getElementById('layout-fixer-style-fqth0').setAttribute('href', encodeURI(layoutFixerUrl)); }); } catch (e) { console.warn('Cannot set layoutFixer css', e); }Uns hat das Shooting auf jeden Fall jede Menge Spaß gemacht und wir hatten mittags bereits alle Bilder im Kasten. Die finalen Bilder möchte ich euch natürlich nicht vorenthalten, daher kriegt ihr hier einen kleinen Einblick: #Mode #Streetstyle #Portrait #Stuttgart #OutdoorPeople•Mode'''
