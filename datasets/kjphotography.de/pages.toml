["https://www.kjphotography.de/post/fliedersirup-selbstgemacht"]
title = "Blümchen im Glas - Fliedersirup selbstgemacht"
description = "Endlich Zeit für meinen ersten selbst gemachten Fliedersirup"
full_description = '''Blümchen im Glas - Fliedersirup selbstgemachtKatharina JaegerMay 11, 20202 min readDieses Jahr war es endlich so weit. Ich konnte den lecker duftenden lila Blüten nicht mehr widerstehen und habe endlich meinen ersten Fliedersirup gemacht.Das Rezept habe ich aus meinem Backbuch "Apfelduft & Heidelbeerblau" von My Feldt und es ist wirklich super einfach. Man braucht allerdings ein bisschen Geduld, weil das Zupfen der einzelnen Fliederblüten durchaus ein wenig Zeit in Anspruch nimmt. Hier die Zutaten: 10 Fliedertrauben125ml Wasser300g Zucker1El HonigSaft von 1 ZitroneAm Anfang heißt es erstmal zupfen, zupfen, zupfen.Die Fliederblüten werden vorsichtig vom Stiel der Fliedertraube gezupft. Die Stiele würden den Sirup bitter machen und sollten deshalb fein säuberlich entfernt werden. Und auch wenn es etwas mühsam ist, es lohnt sich am Ende wirklich. Vor allem für diejenigen, die den blumigen Duft des Flieders auch nach der Blütezeit noch genießen wollen.Nach dem Gezupfe geht's entspannt weiter. In einem Topf wird das Wasser mit dem Zucker und dem Honig aufgekocht bis sich Zucker und Honig vollständig aufgelöst haben. Jetzt den Zitronensaft hinzugeben und schließlich alles über die Fliederblüten gießen.Ich habe die Blüten in einen hohen Messbecher gegeben, so konnten alle Blüten mit der Flüssigkeit bedeckt werden.Jetzt noch Frischhaltefolie über das Gefäß und ab damit in den Kühlschrank für ca. 3-4Tage. Ich habe jeden Tag ein-/zweimal umgerührt und ein wenig genascht. Der Geschmack hat sich über die Tage hinweg richtig toll entwickelt und auch die Farbe ist von Tag zu Tag intensiver geworden.Lecker, lecker! Am vierten Tag habe ich den Sirup dann mit einem Sieb von den Blüten getrennt. Für die Haltbarkeit habe ich den Sirup noch einmal kurz aufgekocht und dann heiß in eine sterilisierte Flasche gefüllt. Es ergab so ca. 600ml. Ganz sicher kann ich es aber leider nicht mehr sagen, weil ich einen Teil davon gleich mit Sprudelwasser gemischt und getrunken habe. :)In der sterilisierten, geschlossenen Flasche hält er sich im Kühlschrank sicher ein paar Wochen. Der Fliedersirup ist sehr süß und lecker mit Sprudelwasser oder auch trockenem Sekt, ein besonderes Highlight für die nächste Grillparty oder einen entspannten Abend mit euren Liebsten. Rezepte'''
author = "Katharina Jaeger"
