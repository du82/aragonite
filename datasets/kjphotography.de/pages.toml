["https://www.kjphotography.de/post/2018/05/03/kaffeetr%C3%BCffel-klein-aber-oho"]
title = "Kaffeetrüffel - Klein aber Oho!"
description = "Seit vielen Jahren sind sie bei meinen Lieben der Star unter den selbstgemachten Pralinen. Kaum sind sie fertig, sind sie auch schon wieder leer. Zugegeben, ich kann mich meist selbst kaum zurückhalten und die Hälfte verschwindet schön beim Überziehen mit Schokolade... Die kleinen Leckereien haben es sich also redlich verdient hier zu erscheinen. Hier also nun das Rezept zum Versüßen für zuhause: Pralinenmasse:150g Sahne300g Zartbitterkuvertüre1 El Espressopulver (instant) 500g Zartbitterkuvertü"
full_description = "Kaffeetrüffel - Klein aber Oho!Katharina JägerMay 3, 20181 min readSeit vielen Jahren sind sie bei meinen Lieben der Star unter den selbstgemachten Pralinen. Kaum sind sie fertig, sind sie auch schon wieder leer. Zugegeben, ich kann mich meist selbst kaum zurückhalten und die Hälfte verschwindet schön beim Überziehen mit Schokolade... Die kleinen Leckereien haben es sich also redlich verdient hier zu erscheinen. Hier also nun das Rezept zum Versüßen für zuhause: Pralinenmasse:150g Sahne300g Zartbitterkuvertüre1 El Espressopulver (instant) 500g Zartbitterkuvertüre zum Ummanteln Zuerst Kuvertüre für die Pralinenmasse klein hacken und bereit stellen.Sahne langsam im Topf erwärmen und das Espressopulver darin ausgehen lassen.Topf vom Herd nehmen und Kuvertürestückchen hinzugeben. So lange rühren bis die Kuvertüre komplett ausgegangen ist und eine homogene Creme entstanden ist.Nun alles bei Zimmertemperatur abkühlen lassen. Wenn die Creme festgeworden ist mit kleinen Teelöffeln Portionen herausnehmen und zu Kugeln rollen. TIPP: Am besten immer wieder die Hände mit kaltem Wasser kühlen, sonst schmilzt die Masse zu schnell und statt Kugeln habt ihr dann schmierige, unförmige Häufchen. Die Kuvertüre zum Ummanteln klein hacken und 2/3 davon im Wasserbad schmelzen. Den Rest einrühren sobald alles geschmolzen ist und dadurch die Kuvertüre temperieren. Mit einem Löffel in die Schokolade tunken und testtrocknen lassen. Wenn alles schnell trocknet und einen schönen matten Schimmer hat, kann es weitergehen. Ansonsten muss die Kuvertüre noch mehr abkühlen, z.B. indem mehr gehackte Kuvertüre hinzugefügt wird Die vorgefertigten Kugeln jetzt nach und nach mit der temperierten Zartbitterkuvertüre überziehen und auf einem Pralinengitter trocknen lassen. Wer will kann die angetrockneten Kugeln etwas über das Gitter rollen, dann ergibt sich der gleiche Effekt wie im obigen Foto. #Rezept #PralinenRezepte Seit vielen Jahren sind sie bei meinen Lieben der Star unter den selbstgemachten Pralinen. Kaum sind sie fertig, sind sie auch schon wieder leer. Zugegeben, ich kann mich meist selbst kaum zurückhalten und die Hälfte verschwindet schön beim Überziehen mit Schokolade... Die kleinen Leckereien haben es sich also redlich verdient hier zu erscheinen. Hier also nun das Rezept zum Versüßen für zuhause: Pralinenmasse:150g Sahne300g Zartbitterkuvertüre1 El Espressopulver (instant) 500g Zartbitterkuvertüre zum Ummanteln Zuerst Kuvertüre für die Pralinenmasse klein hacken und bereit stellen.Sahne langsam im Topf erwärmen und das Espressopulver darin ausgehen lassen.Topf vom Herd nehmen und Kuvertürestückchen hinzugeben. So lange rühren bis die Kuvertüre komplett ausgegangen ist und eine homogene Creme entstanden ist.Nun alles bei Zimmertemperatur abkühlen lassen. Wenn die Creme festgeworden ist mit kleinen Teelöffeln Portionen herausnehmen und zu Kugeln rollen. TIPP: Am besten immer wieder die Hände mit kaltem Wasser kühlen, sonst schmilzt die Masse zu schnell und statt Kugeln habt ihr dann schmierige, unförmige Häufchen. Die Kuvertüre zum Ummanteln klein hacken und 2/3 davon im Wasserbad schmelzen. Den Rest einrühren sobald alles geschmolzen ist und dadurch die Kuvertüre temperieren. Mit einem Löffel in die Schokolade tunken und testtrocknen lassen. Wenn alles schnell trocknet und einen schönen matten Schimmer hat, kann es weitergehen. Ansonsten muss die Kuvertüre noch mehr abkühlen, z.B. indem mehr gehackte Kuvertüre hinzugefügt wird Die vorgefertigten Kugeln jetzt nach und nach mit der temperierten Zartbitterkuvertüre überziehen und auf einem Pralinengitter trocknen lassen. Wer will kann die angetrockneten Kugeln etwas über das Gitter rollen, dann ergibt sich der gleiche Effekt wie im obigen Foto. #Rezept #Pralinen"
