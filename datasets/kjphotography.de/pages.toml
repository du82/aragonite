["https://www.kjphotography.de/post/2018/04/01/hausgemachte-pasta-strozzapreti"]
title = "Hausgemachte Pasta: Strozzapreti"
description = "Da war es wieder, dieses Verlangen nach selbst gemachter Pasta... Kennt ihr das? Also mich überkommt das von Zeit zu Zeit immer wieder einmal. :D Jetzt mag der ein oder andere sagen, dass das doch wirklich eine Menge Arbeit ist und für solche Späßchen einfach die Zeit fehlt. Das mit der Arbeit mag vielleicht richtig sein, aber die lohnt sich auch wirklich! Als ich das erste Mal meine selbst gemachten Nudeln für ein Abendessen gekocht habe, da wurde es mir klar: All die Mühe ist es eben einfach w"
full_description = 'Hausgemachte Pasta: StrozzapretiKatharina JägerApr 1, 20182 min readUpdated: Mar 18, 2020Da war es wieder, dieses Verlangen nach selbst gemachter Pasta... Kennt ihr das? Also mich überkommt das von Zeit zu Zeit immer wieder einmal. :D Jetzt mag der ein oder andere sagen, dass das doch wirklich eine Menge Arbeit ist und für solche Späßchen einfach die Zeit fehlt. Das mit der Arbeit mag vielleicht richtig sein, aber die lohnt sich auch wirklich! Als ich das erste Mal meine selbst gemachten Nudeln für ein Abendessen gekocht habe, da wurde es mir klar: All die Mühe ist es eben einfach wert! Wenn du diese Goldstücke aus dem Topf holst, mit deiner Lieblingssoße vermischt und die erste Gabel kostest, dann schmeckst du mit einem Happen all die Liebe und Leidenschaft, mit der du den Teig geknetet und geformt hast.Selbst gemachte Nudeln sind einfach etwas ganz, ganz Besonderes!Daher möchte ich mein Pasta-Rezept gerne mit euch teilen.Zutaten: 150-160g Hartweizengries150g Mehl3 Eier1 Prise Salz1 Guter Schluck Olivenöl Sonstiges: Mehl für die Arbeitsfläche, feuchtes Küchenhandtuch, Cakepop-Stiel/ Schaschlik-Spieß, Handtuch zum Trocknen Alle Zutaten in eine Schüssel geben und dann mit einander verkneten. Dann Mehl auf die Arbeitsfläche streuen und den Teig noch einmal mit den Händen kneten bis er schön geschmeidig ist. 30 Minuten bei Zimmertemperatur ruhen lassen. Im Anschluss an die 30 Minuten den Teig noch einmal auf der Arbeitsfläche kneten und dann mit einer Nudelmaschine ausrollen. Das wiederholt ihr ein paar Mal bis der Teig schon gleichmäßig geknetet aussieht. Sobald der Teig fertig ist, kann es losgehen! Kleiner Tip schon einmal vorab: Den Teig, der gerade nicht geformt wird, am besten in ein feuchtes Kuchentuch wickeln, so trocknet er nicht aus und lässt sich wunderbar nach und nach verarbeiten. Ich habe zum Formen der Strozzapreti einen Cakepop-Stiel genommen. Das geht aber sicher auch mit einem Schaschlik-Spieß. :) Am einfachsten ist es, wenn man ein kleines Stück vom Teig abteilt und das zu einer länglichen "Wurst" ausrollt. Die "Teigrolle" wird dann in kleine Stücke unterteilt, je so ca. 3 cm. Für eine Nudel wird dann ein kleines Stück der Teigrolle um den Cakepop-Stiel gewickelt. Wichtig ist, dass es nicht eng aneinander gewickelt wird, sondern mit ein wenig Abstand, sonst habt ihr später Penne statt Strozzapreti. :D Dann den Stiel auf die Arbeitsfläche legen und entlang der Arbeitsfläche rollen. So wird die Teigrolle platter und es entsteht die typische Strozzapreti-Form. Die Nudel kann dann ganz einfach vom Stiel geschoben werden und auf ein frisches Küchenhandtuch zum trocknen gelegt werden. #Pasta #RezeptRezepte'
