["https://www.kjphotography.de/post/2018/03/13/lena-und-tom"]
title = "Lena und Tom trauen sich in München"
description = "Heute gibt es einen kleinen Rückblick auf das Brautpaarshooting von Lena und Tom an der zauberhaften Blutenburg in München-Obermenzing. Die beiden hatten sich dazu entschieden vor der kirchlichen Trauung Paarfotos zu machen und dafür den Blutenburger Schlosspark ausgewählt.Die Blutenburg ist als ehemaliges Jagdschloss mit ihrem kleinen Schlosspark und dem vorgelagerten Weiher eine traumhafte Kulisse. Läuft man einmal um das Anwesen herum, bietet sie eine tolle Abwechslung und die verschiedensten"
full_description = "Lena und Tom trauen sich in MünchenKatharina JägerMar 13, 20181 min readUpdated: Jan 9, 2023Heute gibt es einen kleinen Rückblick auf das Brautpaarshooting von Lena und Tom an der zauberhaften Blutenburg in München-Obermenzing. Die beiden hatten sich dazu entschieden vor der kirchlichen Trauung Paarfotos zu machen und dafür den Blutenburger Schlosspark ausgewählt.Die Blutenburg ist als ehemaliges Jagdschloss mit ihrem kleinen Schlosspark und dem vorgelagerten Weiher eine traumhafte Kulisse. Läuft man einmal um das Anwesen herum, bietet sie eine tolle Abwechslung und die verschiedensten Hintergründe.An diesem Tag hatte es die Sonne wirklich gut mit uns gemeint und uns nach viel Regen eine wunderschöne Zeit beschert. Da macht das Shooting doch gleich viel mehr Spaß! Der Boden war teilweise natürlich noch richtig matschig und nachdem ich mich beim Fotografieren ja auch des Öfteren direkt auf den Boden setze oder lege, durfte ich vor der Kirche noch einmal meine Kleidung wechseln. Was macht man nicht alles für tolle Aufnahmen! :D #Brautpaar #MünchenHochzeit Heute gibt es einen kleinen Rückblick auf das Brautpaarshooting von Lena und Tom an der zauberhaften Blutenburg in München-Obermenzing. Die beiden hatten sich dazu entschieden vor der kirchlichen Trauung Paarfotos zu machen und dafür den Blutenburger Schlosspark ausgewählt.Die Blutenburg ist als ehemaliges Jagdschloss mit ihrem kleinen Schlosspark und dem vorgelagerten Weiher eine traumhafte Kulisse. Läuft man einmal um das Anwesen herum, bietet sie eine tolle Abwechslung und die verschiedensten Hintergründe.An diesem Tag hatte es die Sonne wirklich gut mit uns gemeint und uns nach viel Regen eine wunderschöne Zeit beschert. Da macht das Shooting doch gleich viel mehr Spaß! Der Boden war teilweise natürlich noch richtig matschig und nachdem ich mich beim Fotografieren ja auch des Öfteren direkt auf den Boden setze oder lege, durfte ich vor der Kirche noch einmal meine Kleidung wechseln. Was macht man nicht alles für tolle Aufnahmen! :D #Brautpaar #München"
