["https://www.kjphotography.de/post/2018/03/12/wer-ist-eigentlich-dieser-odin"]
title = "Wer ist eigentlich dieser Odin"
description = "Es gibt da ein ganz besonders flauschiges Wesen, das ich ganz beiläufig auch schon unter meiner Rubrik Über KJ erwähnt hatte.Sein Name ist Odin. Odin ist ein Britischkurzhaar-Kater und sozusagen der König in meinen eigenen vier Wänden. Ich habe ihn seit er ein kleines Fellknäuel war und will ihn auch seither nicht mehr missen. Er ist neugierig, verfressen und hat allerhand Flausen im Kopf. Trotzdem ist er ein echtes Zuckerstück und wickelt nahezu jeden direkt um den Finger - oder eben die Pfote"
full_description = '''Wer ist eigentlich dieser Odin?Katharina JägerMar 1, 20181 min read Es gibt da ein ganz besonders flauschiges Wesen, das ich ganz beiläufig auch schon unter meiner Rubrik Über KJ erwähnt hatte.Sein Name ist Odin. Odin ist ein Britischkurzhaar-Kater und sozusagen der König in meinen eigenen vier Wänden. Ich habe ihn seit er ein kleines Fellknäuel war und will ihn auch seither nicht mehr missen. Er ist neugierig, verfressen und hat allerhand Flausen im Kopf. Trotzdem ist er ein echtes Zuckerstück und wickelt nahezu jeden direkt um den Finger - oder eben die Pfote.Odin klingt irgendwie mystisch?Ja, das stimmt wohl. Den Namen hat er aber nicht einfach so bekommen. Ausgewählt habe ich ihn, weil er wie der nordgermanische Göttervater Odin nur ein Auge hat und schon als Zwergnase die unbändige Kraft eines echten Tigers in sich trug. Irgendwie ist der Name also doch ganz schön passend. Für alle, die sich jetzt fragen, wie er denn nun aussieht, gibt es hier eine kleine Übersicht: OdinOdin grüne SchleifeOdin schlafendOdin #tongueouttuesdayOdin rote SchleifeOdin Baldriankissen#pro-gallery-efq8m .gallery-item-container { opacity: 0 } #pro-gallery-efq8m .gallery-item-hover::before { background: transparent !important}try { window.requestAnimationFrame(function() { var ele = document.getElementById('pro-gallery-efq8m'); var pgMeasures = ele.getBoundingClientRect(); var options = (() => "gallerySizeType:px|enableInfiniteScroll:true|titlePlacement:SHOW_ON_HOVER|gridStyle:1|imageMargin:3|galleryLayout:2|isVertical:false|numberOfImagesPerRow:3|gallerySizePx:300|cubeRatio:1|cubeType:fill|galleryThumbnailsAlignment:bottom|thumbnailSpacings:0")(ele); var width = pgMeasures.width; var height = pgMeasures.height; var isIOS = /iPad|iPhone|iPod/.test(navigator?.userAgent); if(isIOS) { width = width; width = width; height = height; height = height; } else { width = width; width = width; height = height; height = height; } pgMeasures = { top: pgMeasures.top, width, height }; var isVertical = options.includes('layoutParams_structure_scrollDirection:"VERTICAL"'); var layoutFixerUrl = '/_serverless/pro-gallery-css-v4-server/layoutCss?ver=2&id=efq8m&items=3645_1181_1181|3344_1181_1181|3500_1181_1181|3328_1181_1181|4614_1772_1772|3431_1181_1181&container=' + pgMeasures.top + '_' + pgMeasures.width + '_' + pgMeasures.height + '_' + window.innerHeight + '&options=' + options; document.getElementById('layout-fixer-style-efq8m').setAttribute('href', encodeURI(layoutFixerUrl)); }); } catch (e) { console.warn('Cannot set layoutFixer css', e); }Und weil Katzenmamas eben immer verrückt nach ihren Lieblingen sind, hat Odin natürlich einen eigenen Instagram-Account: @Odin.olores . #tierfotografie #OdinoloresOdin'''
