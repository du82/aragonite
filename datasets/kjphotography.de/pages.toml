full_description = "Impressum und DatenschutzVerantwortlich für den Inhalt der Seite: ​ KJ Photography Katharina Jäger Hölderlinstraße 33 73252 Unterlenningen Mobil 0151/65123315 Haftungsausschluss Bilder, Layout, Gestaltung der Internet-Seiten, die verwendeten Grafiken sowie die sonstigen Inhalte sind urheberrechtlich geschützt. Die in dieser Homepage enthaltenen Bilder und Inhalte sind ausschließlich zur Information bestimmt. Verwertung, Speicherung und jede andere Nutzung der Bilder und Inhalte dieser Homepage, die Vervielfältigung der Seiten oder ihrer Inhalte ist nur nach vorheriger schriftlicher Genehmigung durch Katharina Jäger zulässig. Die im Rahmen der Kontaktanfrage erhobenen personenbezogenen Daten werden lediglich zur Erledigung der Geschäftsvorfälle genutzt und nicht an Dritte weitergegeben. ​ Datenschutzerklärung ​ WIDERRUF DER EINWILLIGUNG ZUR DATENVERARBEITUNG Nur mit Ihrer ausdrücklichen Einwilligung sind einige Vorgänge der Datenverarbeitung möglich. Ein Widerruf Ihrer bereits erteilten Einwilligung ist jederzeit möglich. Für den Widerruf genügt eine formlose Mitteilung per E-Mail. Die Rechtmäßigkeit der bis zum Widerruf erfolgten Datenverarbeitung bleibt vom Widerruf unberührt. ​ ​ RECHT AUF BESCHWERDE BEI DER ZUSTÄNDIGEN AUFSICHTSBEHÖRDE Als Betroffener steht Ihnen im Falle eines datenschutzrechtlichen Verstoßes ein Beschwerderecht bei der zuständigen Aufsichtsbehörde zu. Zuständige Aufsichtsbehörde bezüglich datenschutzrechtlicher Fragen ist der Landesdatenschutzbeauftragte des Bundeslandes, in dem sich der Sitz unseres Unternehmens befindet. Der folgende Link stellt eine Liste der Datenschutzbeauftragten sowie deren Kontaktdaten bereit: https://www.bfdi.bund.de/DE/Infothek/Anschriften_Links/anschriften_links-node.html. ​ ​ RECHT AUF DATENÜBERTRAGBARKEIT Ihnen steht das Recht zu, Daten, die wir auf Grundlage Ihrer Einwilligung oder in Erfüllung eines Vertrags automatisiert verarbeiten, an sich oder an Dritte aushändigen zu lassen. Die Bereitste