full_description = '''Wintermode bei 32°C in der Stuttgarter Innenstadt, kein Problem!Katharina JägerAug 13, 20181 min readUpdated: Jan 9, 2023Ja, richtig gelesen! Es ist schon wieder Zeit für Daunenmäntel, Strickjacken und lange Ärmel, zumindest für einen Tag.Vergangene Woche hieß es bei 32°C Winterboots an und ab die Post. Auch diesmal ging es für uns in Stuttgarts Innenstadt. Da gibts aber auch wirklich jede Menge tolle, unterschiedliche Hintergründe auf einem Fleck. Perfekt für abwechslungsreiche Modeaufnahmen im Street Style. Stuttgart FriedrichstraßeStuttgart SchlossplatzKönigsbau Stuttgart#pro-gallery-d44fc .gallery-item-container { opacity: 0 } #pro-gallery-d44fc .gallery-item-hover::before { background: transparent !important}try { window.requestAnimationFrame(function() { var ele = document.getElementById('pro-gallery-d44fc'); var pgMeasures = ele.getBoundingClientRect(); var options = (() => "gallerySizeType:px|enableInfiniteScroll:true|titlePlacement:SHOW_ON_HOVER|gridStyle:1|imageMargin:4|galleryLayout:2|isVertical:false|numberOfImagesPerRow:3|gallerySizePx:300|cubeRatio:1|cubeType:fill|galleryThumbnailsAlignment:bottom|thumbnailSpacings:0")(ele); var width = pgMeasures.width; var height = pgMeasures.height; var isIOS = /iPad|iPhone|iPod/.test(navigator?.userAgent); if(isIOS) { width = width; width = width; height = height; height = height; } else { width = width; width = width; height = height; height = height; } pgMeasures = { top: pgMeasures.top, width, height }; var isVertical = options.includes('layoutParams_structure_scrollDirection:"VERTICAL"'); var layoutFixerUrl = '/_serverless/pro-gallery-css-v4-server/layoutCss?ver=2&id=d44fc&items=3373_1067_1600|3522_1067_1600|3659_1067_1600&container=' + pgMeasures.top + '_' + pgMeasures.width + '_' + pgMeasures.height + '_' + window.innerHeight + '&options=' + options; document.getElementById('layout-fixer-style-d44fc').setAttribute('href', encodeURI(layoutFixerUrl)); }); } catch (e) { console.warn('Cannot set layoutFixer css', e); }Diesmal hatte ich das Vergnügen mit der zauberhaften Sara Bassano zusammen zu arbeiten. Ich hatte sie für meinen Kunden als Model gebucht und war von Anfang an begeistert. Trotz der Hitze sind wir wirklich schnell mit unseren flauschig warmen Outfits vorangekommen und hatten vor allem auch jede Menge Spaß beim Shooting. Ich hatte ja auch Hitze taugliche Kleidung an, was man von Sara nicht so ganz behaupten konnte. :D Wintermode mit Sara BassanoModeshooting in Stuttgart#pro-gallery-8qjsg .gallery-item-container { opacity: 0 } #pro-gallery-8qjsg .gallery-item-hover::before { background: transparent !important}try { window.requestAnimationFrame(function() { var ele = document.getElementById('pro-gallery-8qjsg'); var pgMeasures = ele.getBoundingClientRect(); var options = (() => "gallerySizeType:px|enableInfiniteScroll:true|titlePlacement:SHOW_ON_HOVER|gridStyle:1|imageMargin:4|galleryLayout:2|isVertical:false|numberOfImagesPerRow:2|gallerySizePx:300|cubeRatio:1|cubeType:fill|galleryThumbnailsAlignment:bottom|thumbnailSpacings:0")(ele); var width = pgMeasures.width; var height = pgMeasures.height; var isIOS = /iPad|iPhone|iPod/.test(navigator?.userAgent); if(isIOS) { width = width; width = width; height = height; height = height; } else { width = width; width = width; height = height; height = height; } pgMeasures = { top: pgMeasures.top, width, height }; var isVertical = options.includes('layoutParams_structure_scrollDirection:"VERTICAL"'); var layoutFixerUrl = '/_serverless/pro-gallery-css-v4-server/layoutCss?ver=2&id=8qjsg&items=3327_1067_1600|3410_1067_1600&container=' + pgMeasures.top + '_' + pgMeasures.width + '_' + pgMeasures.height + '_' + window.innerHeight + '&options=' + options; document.getElementById('layout-fixer-style-8qjsg').setAttribute('href', encodeURI(layoutFixerUrl)); }); } catch (e) { console.warn('Cannot set layoutFixer css', e); }Aber jetzt will ich auch nicht zu viel erzählen, sondern viel lieber ein paar Bilder zeigen. Hier gibt es einen kleinen Einblick in die Ergebnisse aus dem Mode-Shooting rund um den Stuttgarter Schlossplatz herum: Mit so tollen Knallfarben muss ein Wintermode-Shooting ja einfach Spaß machen, sogar im Hochsommer! Bestimmt ist der ein oder andere schon einmal an dieser tollen Wand in Stuttgart vorbei gelaufen.Wir waren auf jeden Fall von ihr begeistert. ;)#Streetstyle #Mode #Stuttgart #Outdoor #PortraitPeople•Mode'''
