["https://www.kjphotography.de/post/rhabarberzeit"]
title = "Rhabarberzeit ist Sirupzeit"
description = "Ein schnelles Rezept für alle Rhabarberliebhaber!Jedes Jahr aufs Neue freu ich mich wie Schnitzel, wenn meine Mama stolz verkündet, dass ihr Rhabarber wächst wie wild und bereit ist für die erste Ernte. Dann heißt es Katze einpacken und ab nach Hause, denn die Rhabarbersirup Produktion kann endlich beginnen. Die erste Runde Sirup kochen wir nämlich meistens gemeinsam.Zutaten für ca. 0,75 Liter Sirup:500g Rhabarber250ml Wasser250g ZuckerSaft von 1/2 Zitrone 1 VanilleschoteZubereitung:Rhabarber wa"
full_description = 'Rhabarberzeit ist SirupzeitKatharina JaegerMay 26, 20201 min readEin schnelles Rezept für alle Rhabarberliebhaber!Jedes Jahr aufs Neue freu ich mich wie Schnitzel, wenn meine Mama stolz verkündet, dass ihr Rhabarber wächst wie wild und bereit ist für die erste Ernte. Dann heißt es Katze einpacken und ab nach Hause, denn die Rhabarbersirup Produktion kann endlich beginnen. Die erste Runde Sirup kochen wir nämlich meistens gemeinsam. Zutaten für ca. 0,75 Liter Sirup:500g Rhabarber250ml Wasser250g ZuckerSaft von 1/2 Zitrone 1 VanilleschoteZubereitung:Rhabarber waschen und klein schneiden. Wichtig: Rote Schale dran lassen, dadurch erhält der Sirup seine tolle Farbe.Rhabarber, Zucker und Wasser in einen Topf geben. Das Vanillemark und die "leere" Vanilleschote dazu geben. Alles aufkochen und für 10 Minuten bei mittlerer Hitze köcheln bis der Rhabarber schön weich ist.Den gekochten Rhabarber im Topf zerdrücken und die Flüssigkeit durch einen feinen Sieb in einen neuen Topf abseihen.Den Sirup mit dem Zitronensaft und der Vanilleschote erneut aufkochen und 10 Minuten bei mittlerer Hitze köcheln. Solange bis die Flüssigkeit leicht reduziert ist und der Sirup andickt.Im Anschluss den heißen Sirup direkt in eine sterilisierte Flasche gießen und abkühlen lassen. Fertig!Der Sirup hält sich gekühlt einige Wochen/Monate in der Flasche, sofern er natürlich nicht schon nach 2 Wochen leer getrunken ist. Mit Wasser gemischt ist der Rhabarbersirup eine tolle sommerliche Erfrischung. Er schmeckt aber natürlich auch super lecker in trockenem Sekt als besonderes Schmankerl bei der nächsten Grillparty.Das übrige Kompott, das nach dem Abseihen im Sieb ist, auf gar keinen Fall wegwerfen. Das schmeckt einfach super lecker zu Joghurt, Eis oder als Kuchen. Bei uns gibt es häufig diesen Biskuitboden mit Rhabarber-Kompott, Schmand-Sahne-Topping und Zimt - einfach lecker! :)Rezepte Ein schnelles Rezept für alle Rhabarberliebhaber!Jedes Jahr aufs Neue freu ich mich wie Schnitzel, wenn meine Mama stolz verkündet, dass ihr Rhabarber wächst wie wild und bereit ist für die erste Ernte. Dann heißt es Katze einpacken und ab nach Hause, denn die Rhabarbersirup Produktion kann endlich beginnen. Die erste Runde Sirup kochen wir nämlich meistens gemeinsam. Zutaten für ca. 0,75 Liter Sirup:500g Rhabarber250ml Wasser250g ZuckerSaft von 1/2 Zitrone 1 VanilleschoteZubereitung:Rhabarber waschen und klein schneiden. Wichtig: Rote Schale dran lassen, dadurch erhält der Sirup seine tolle Farbe.Rhabarber, Zucker und Wasser in einen Topf geben. Das Vanillemark und die "leere" Vanilleschote dazu geben. Alles aufkochen und für 10 Minuten bei mittlerer Hitze köcheln bis der Rhabarber schön weich ist.Den gekochten Rhabarber im Topf zerdrücken und die Flüssigkeit durch einen feinen Sieb in einen neuen Topf abseihen.Den Sirup mit dem Zitronensaft und der Vanilleschote erneut aufkochen und 10 Minuten bei mittlerer Hitze köcheln. Solange bis die Flüssigkeit leicht reduziert ist und der Sirup andickt.Im Anschluss den heißen Sirup direkt in eine sterilisierte Flasche gießen und abkühlen lassen. Fertig!Der Sirup hält sich gekühlt einige Wochen/Monate in der Flasche, sofern er natürlich nicht schon nach 2 Wochen leer getrunken ist. Mit Wasser gemischt ist der Rhabarbersirup eine tolle sommerliche Erfrischung. Er schmeckt aber natürlich auch super lecker in trockenem Sekt als besonderes Schmankerl bei der nächsten Grillparty.Das übrige Kompott, das nach dem Abseihen im Sieb ist, auf gar keinen Fall wegwerfen. Das schmeckt einfach super lecker zu Joghurt, Eis oder als Kuchen. Bei uns gibt es häufig diesen Biskuitboden mit Rhabarber-Kompott, Schmand-Sahne-Topping und Zimt - einfach lecker! :)'
