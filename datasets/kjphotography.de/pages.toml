title = "Hallo Herbst, schön dich wiederzusehen!"
description = "Was gibt es Schöneres als Wälder, die in unendlich vielen Rottönen erstrahlen und zeigen, dass endlich der Herbst eingekehrt ist? Also mir fällt da jetzt nichts ein! ;)Die letzten Wochenenden war ich viel in der Natur unterwegs, mal zum Spaziergang, mal zum Bucheckern und Zapfen sammeln in der Heimat, mal für ein Shooting an den Bürgerseen in Kirchheim unter Teck. Und wie jedes Jahr, war ich auch diesmal wieder hin und weg von der Farbenpracht der Natur. Vor allem in der Abendsonne, wenn alles i"
full_description = '''Hallo Herbst, schön dich wiederzusehen!Katharina JägerOct 23, 20181 min readWas gibt es Schöneres als Wälder, die in unendlich vielen Rottönen erstrahlen und zeigen, dass endlich der Herbst eingekehrt ist? Also mir fällt da jetzt nichts ein! ;)Die letzten Wochenenden war ich viel in der Natur unterwegs, mal zum Spaziergang, mal zum Bucheckern und Zapfen sammeln in der Heimat, mal für ein Shooting an den Bürgerseen in Kirchheim unter Teck. Und wie jedes Jahr, war ich auch diesmal wieder hin und weg von der Farbenpracht der Natur. Vor allem in der Abendsonne, wenn alles in ein weiches, warmes Licht getaucht wird, macht es einfach Spaß draußen zu sein! Nachdem ich überall meine Kamera dabei hatte - ja, auch ohne Shooting - dachte ich mir, ich widme dem wunderschönen Herbst einen kleinen aber feinen Blogeintrag. Und zwar einfach, weil der Herbst mir jedes Jahr aufs Neue unglaublich gute Laune macht und meine absolute Lieblingsjahreszeit ist. Lasst euch also mitnehmen auf einen kleinen Ausflug in die Natur und genießt die Stimmung der nachfolgenden Bilder!Bürgerseen Kirchheim unter TeckHerbstliche Waldweg Kirchheim Teck#pro-gallery-67tdn .gallery-item-container { opacity: 0 } #pro-gallery-67tdn .gallery-item-hover::before { background: transparent !important}try { window.requestAnimationFrame(function() { var ele = document.getElementById('pro-gallery-67tdn'); var pgMeasures = ele.getBoundingClientRect(); var options = (() => "gallerySizeType:px|enableInfiniteScroll:true|titlePlacement:SHOW_ON_HOVER|gridStyle:1|imageMargin:4|galleryLayout:2|isVertical:false|numberOfImagesPerRow:2|gallerySizePx:300|cubeRatio:1|cubeType:fill|galleryThumbnailsAlignment:bottom|thumbnailSpacings:0")(ele); var width = pgMeasures.width; var height = pgMeasures.height; var isIOS = /iPad|iPhone|iPod/.test(navigator?.userAgent); if(isIOS) { width = width; width = width; height = height; height = height; } else { width = width; width = width; height = height; height = height; } pgMeasures = { top: pgMeasures.top, width, height }; var isVertical = options.includes('layoutParams_structure_scrollDirection:"VERTICAL"'); var layoutFixerUrl = '/_serverless/pro-gallery-css-v4-server/layoutCss?ver=2&id=67tdn&items=3265_1067_1600|3443_1067_1600&container=' + pgMeasures.top + '_' + pgMeasures.width + '_' + pgMeasures.height + '_' + window.innerHeight + '&options=' + options; document.getElementById('layout-fixer-style-67tdn').setAttribute('href', encodeURI(layoutFixerUrl)); }); } catch (e) { console.warn('Cannot set layoutFixer css', e); }​ Natur'''
