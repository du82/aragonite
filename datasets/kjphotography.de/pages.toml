["https://www.kjphotography.de/post/2019/06/26/holundersirup"]
title = "Holunderblütensirup"
description = "Mai und Juni zählen für mich definitiv zu meinen Lieblingsmonaten, denn dann ist es wieder an der Zeit für lecker duftende Holunderblüten. Jedes Jahr aufs Neue freu ich mich wie ein Schnitzel, wenn ich die ersten weißen Blüten entdecke. Fleißig werden dann wieder Holunderblüten gesammelt und zu Holunderblütensirup verarbeitet, im Teigmantel ausgebacken oder für Kuchen verarbeitet.Nachdem ich letztes Jahr nicht so zufrieden mit meinem Sirup war, habe ich dieses Jahr ein neues Rezept ausprobiert,"
full_description = "HolunderblütensirupKatharina JägerJun 26, 20192 min readUpdated: May 26, 2020Mai und Juni zählen für mich definitiv zu meinen Lieblingsmonaten, denn dann ist es wieder an der Zeit für lecker duftende Holunderblüten. Jedes Jahr aufs Neue freu ich mich wie ein Schnitzel, wenn ich die ersten weißen Blüten entdecke. Fleißig werden dann wieder Holunderblüten gesammelt und zu Holunderblütensirup verarbeitet, im Teigmantel ausgebacken oder für Kuchen verarbeitet.Nachdem ich letztes Jahr nicht so zufrieden mit meinem Sirup war, habe ich dieses Jahr ein neues Rezept ausprobiert, das ich auf Barbaras Blog entdeckt habe. Und das Rezept hat mich wirklich umgehauen. So lecker war mein Holundersirup noch nie, daher will ich euch das Rezept nicht vorenthalten, auch wenn mittlerweile der Holunder schon in vielen Gegenden abgeblüht ist. Die nächste Holunderzeit steht ja quasi schon wieder vor der Tür. Für ca. 1,25l bis 1,5l habe ich folgende Zutaten verwendet:35-45 Holunderblütendolden1 kg Zucker1l Wasser4 Bio-Zitronen 🍋 sterilisierte Flaschen für ca. 1,25l - 1,5l Sirup Und nicht zu vergessen eine Portion Geduld, weil der Sirup ca. 4 Tage lang durchziehen musste.Aber das Warten lohnt sich, versprochen! Nachdem ich fleißig 45 Holunderblütendolden gesammelt habe, hieß es erstmal alle kleinen Tierchen, die noch auf den Dolden zu finden waren, mit der Hand zu entfernen. Das dauert zwar etwas, ist aber super wichtig. Wenn ihr nämlich die Holunderblüten mit Wasser abwascht, entfernt ihr den ganzen Blütenstaub, der dem Sirup später zum einen die gelbe Farbe verleiht, zum anderen auch ein wichtiger Geschmacksträger ist. Letztes Jahr hatte ich dummerweise die Blüten abgewaschen - wenn auch vorsichtig - , was zur Folge hatte, dass der Holundersirup extrem an Intensität einbüßen musste und letztendlich mehr nach Zitrone als nach Holunder geschmeckt hat. Wenn ihr die Dolden vorbereitet habt, könnt ihr mit der Zubereitung beginnen.Dazu Wasser, Zucker und den Zitronensaft von zwei Zitronen in einen Topf geben und so lange kochen, bis der Zucker sich aufgelöst und alles etwas dickflüssiger geworden ist. Die ausgepressten Zitronenhälften können selbstverständlich auch mit in den Topf gegeben werden. Topf nach dem Kochen vom Herd nehmen und bereit stellen.Die anderen beiden Zitronen in Scheiben schneiden und abwechselnd mit den gesäuberten Holunderblütendolden in ein hitzebeständiges Gefäß (mit Verschluss) schichten. Denkt daran, dass die ganze Flüssigkeit auch noch hineinpassen muss, also lieber ein zu großes Gefäß nehmen als ein zu kleines. Ich habe einfach einen weiteren Topf dafür hergenommen. Die Wasser-Zitronen-Zucker-Mischung über die Dolden und die Zitronenscheiben gießen und verschließen. Jetzt heißt es „Geduld haben“. Die Mischung habe ich 4 Tage lang durchziehen lassen. Dabei habe ich jeden Tag einmal kräftig umgerührt und natürlich immer mal wieder ein bisschen vom Sirup genascht. So merkt man zumindest, ob der Geschmack schon intensiv genug ist. :pNach der langen Wartezeit wird der Sirup durch einen Sieb oder ein Tuch in einen Topf gegossen, sodass die reine Flüssigkeit übrig bleibt von den Dolden und den Zitronenscheiben getrennt ist. Den Sirup aufkochen lassen und in die vorbereiteten sterilisierten Flaschen füllen. Fertig! Der Sirup hält sich gut verschlossen sogar einige Monate. Eine offene Flasche am besten im Kühlschrank aufheben und innerhalb von kurzer Zeit aufbrauchen (bei mir sind es in der Regel 2-4 Wochen).#RezeptRezepte"
author = "Katharina Jäger"
year_published = 2019
year_updated = 2020
clearnet = "https://www.kjphotography.de/post/2019/06/26/holundersirup"
