title = "Der Frühling kann kommen!"
description = 'Bald ist es wieder so weit und es heißt "Hallo, Frühling!".Passend dazu habe ich heute einen kleinen Throwback von meinem Frühjahrs-Shooting mit Milena 2017. Ich wollte endlich raus und die tolle Stimmung des Frühlings einfangen.Wir hatten ein paar Outfits dabei, um ein bisschen mehr Spielraum zu haben. Das Portrait-Shooting hat unsere Lachmuskeln auf jeden Fall ganz schön herausgefordert und es sind auch ein paar wirklich tolle Fotos entstanden, oder nicht? ;)   #Portrait #Outdoor #Stuttgart'
