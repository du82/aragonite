["https://www.kjphotography.de/post/baerlauch-tortellini-wild-garlic-tortellini"]
title = "Bärlauch Tortellini - Wild Garlic Tortellini"
description = """
Es ist endlich wieder Bärlauch-Zeit! Dieser Jahr habe ich das erste Mal Pasta mit Bärlauch gefüllt und es war ganz zauberhaft.
Hier geht's zum Rezept."""
full_description = 'Bärlauch Tortellini - Wild Garlic TortelliniKatharina JaegerMar 29, 20203 min read- English version is following afterwards, just scroll :) - Es ist endlich wieder Bärlauch-Zeit!Dieser Jahr habe ich das erste Mal Pasta mit Bärlauch gefüllt und es war ganz zauberhaft. Wie es der Zufall so wollte - und ich rede hier von einem glücklichen Zufall - , sind wir beim Spazierengehen im Wald unerwartet auf ein großes Bärlauchfeld gestoßen. Wir hatten zufällig auch noch eine kleine Tüte dabei, also haben wir 4 Hände voll eingesammelt und sind mit unserem duftenden Schatz im Gepäck wieder nach Hause gelaufen.Nachdem wir seit Langem mal wieder Maultaschen machen wollten und ich zum Geburtstag eine neue Pasta Maschine bekommen hatte, kam Eins zum Anderen und der Bärlauch ist mit in die Maultaschenfüllung gewandert. Lecker, lecker! :D Wir haben dann aber nicht nur Maultaschen gemacht, sondern auch - man ahnt es schon - Tortellini. Nach einer kurzen Kochzeit von 7 Minuten haben wir die Tortellini in selbst gemachter Bärlauchbutter angebraten. Yummy!Nachdem ich das Rezept also ursprünglich für Maultaschen ausgelegt hatte und die Tortellini ein spontanes Nebenprodukt waren, kann es sein, dass das Verhältnis von Nudelteig und Masse nicht ganz aufgeht. Aber das ist natürlich kein Problem, ihr könnt die Reste nämlich beispielsweise wie folgt weiterverarbeiten:Sollte noch Masse übrig bleiben, dann einfach kleine Kugeln rollen und als Hackfleischbällchen in der Pfanne rausbraten. Die kleinen Bällchen snacken wir zuhause dann einfach oder machen dazu Pasta mit Tomatensoße. Wobei sie meist so schnell vernascht sind, dass gar keine Zeit mehr für Pasta bleibt. :DSollte Nudelteig übrig bleiben, dann einfach dünne Streichen schneiden, trocknen und später als Suppennudeln verwenden. Und jetzt genug mit dem Gequatsche, hier kommt das Rezept für die Bärlauch-Tortellini:Pastateig300g Mehl Typ 003 EierMehl und Eier mit den Händen verkneten bis der Teig glatt ist.Teig in Frischhaltefolie wickeln und ruhen lassen.Tortellini-Füllung1 Zwiebel1/2 Bund Petersilie1 Bund Bärlauch150g Spinat (TK)1 Laugensemmel2 El Milch250g Hackfleisch gemischt1 Ei3El JoghurtPrise MuskatnussSalz Pfeffer- Butter zum Braten -Zwiebel würfeln und Petersilie und Bärlauch hackenButter in einer Pfanne erhitzen und Zwiebeln glasig dünsten. Füge die Milch hinzu.Spinat auftauen und Wasser ausdrücken. Anschließend hacken.Laugensemmel in kleine Würfel hacken und erwärmte Milch darüber gießen. 5-10 Min einweichen.Spinat, Ei, Laugenwürfel mit Milch, Petersilie, Bärlauch und 2/3 des Hackfleisches miteinander vermengen.Restliches Hackfleisch mit Joghurt in einem Zerkleinerer mixen bis es eine sämige und glatte Masse ist.Zur Spinatmasse geben, mit Muskatnuss, Salz und Pfeffer würzen und alles gut vermischen.Pastateig ausrollen ca. 2-3 mm Dicke. Dann scheint das Licht leicht durch den Teig durch, ist aber nicht zu dünn, dass er reißt. Ausgerollten Teig in Quadrate schneiden (ca. 5x5cm).In der Mitte des Quadrates ein kleines Häufchen machen. 2 Seiten mit Wasser oder verquirltem Ei bestreichen.Ein Dreieck formen, indem die eine Ecke zur anderen Eckenseite geschlagen wird. Den Rand gut festdrücken, sodass möglichst wenig Luft in dem Dreieck vorhanden ist.Die lange Kante nach oben zur Spitze des Dreiecks schlagen, sodass die Spitze noch ein Stück zu sehen ist.Einen Seitenstrang mit Wasser oder verquirltem Ei anfeuchten und dann die beiden Seitenstränge übereinander schlagen. Dabei hilft es einen Finger zwischen die Mitte und die Seitenstränge zu legen, sodass später auch eine Lücke entsteht.Für ca. 7 Minuten in heißes gesalzenes Wasser geben und ziehen lassen. English Recipe "Wild Garlic Tortellini"Pasta dough300g flour Type 003 eggsKnead flour and eggs with your hands until dough is smooth.Put dough in plastic wrap and put aside.Tortellini filling1 onion1/2 bunch parsley1 bunch wild garlic150g spinach (frozen)1 bun2 tbsp. milk250g minced meat1 egg3tbsp. yoghurtgrated nutmegsaltpepper- butter for roasting -Chop the onion, as well as parsley and wild garlic.Heat up the butter in a pan and steam the onion. Add the milk.Defreeze the spinach and squash it until the water is gone. Chop the spinach afterwards. Dice the bun put the warm milk over it. Let it soak in the milk for approx. 5-10 minutes.Combine spinach, egg, bun with milk, parsley, wild garlic and 2/3 of the minced meat. Combine the rest of the minced meat and the yoghurt in a blender and mix it until smooth. Add it to the spinach, as well as the nutmeg, salt and pepper and combine everything nicely.Roll out the pasta dough until approx. 2-3mm thick.Cut it into small squares (approx. 5x5cm).Add a tiny portion of the filling in the middle of the squares. Coat two sides of the square with water or scrambled egg. Make a triangle out of the square by folding one edge to the other. Try to keep all the air out of the triangle and press the edges tightly. Roll the long side of the triangle to the tip, so that the edge/tip is still visible. Coat one side of the tringle with water or scrambled egg. Fold one side over the other. If you put one finger in the middle of the triangle before crossing the sides will help to keep a gab in the middle of the tortellinis.Cook for approximately 7 minutes in salted water.Rezepte'
