["https://www.kjphotography.de/post/2019/04/27/endlich-b%C3%A4rlauchzeit"]
title = "Endlich Bärlauchzeit!"
description = "Liebt ihr Bärlauch auch so sehr wie ich? Ich muss zugeben, ich bin total verrückt nach diesem grünen Leckerbissen. Und nicht nur ich, nein, fast meine ganze Familie isst Bärlauch für ihr Leben gern. Traditionell eröffnet bei uns zuhause Oma die Bärlauchsaison, indem sie zum Bärlauchpflücken aufruft und die erste Ladung ihrer heiß begehrten Bärlauchbutter für uns macht. Ab da heißt es dann fleißig weiter pflücken und Butter produzieren, es wollen schließlich so einige Bärlauchfans von der leckere"
full_description = "Endlich Bärlauchzeit!Katharina JägerApr 27, 20192 min readLiebt ihr Bärlauch auch so sehr wie ich? Ich muss zugeben, ich bin total verrückt nach diesem grünen Leckerbissen. Und nicht nur ich, nein, fast meine ganze Familie isst Bärlauch für ihr Leben gern. Traditionell eröffnet bei uns zuhause Oma die Bärlauchsaison, indem sie zum Bärlauchpflücken aufruft und die erste Ladung ihrer heiß begehrten Bärlauchbutter für uns macht. Ab da heißt es dann fleißig weiter pflücken und Butter produzieren, es wollen schließlich so einige Bärlauchfans von der leckeren Butter kosten. Angefangen bei mir und meiner Schwester bis hin zu den Tanten, Cousinen und Schwiegereltern...Dieses Jahr konnte ich Oma endlich auch einmal beim Bärlauch-Sammeln begleiten. Als wir am geheimen Bärlauchparadies ankamen, kroch auch schon der (meiner Meinung nach) leckere, knoblauchartige Bärlauch-Geruch ins Näschen. Bärlauch ist ja wegen seines starken Geruchs nicht jedermanns Gewächs, aber so lässt er sich auf jeden Fall leichter von seinen giftigen Doppelgängern, wie Maiglöckchen, unterscheiden. Nachdem wir also mehrere Tüten gesammelt hatten, ging es mit der Beute ab nach hause, um Omas Bärlauchbutter zu machen. Zuhause angekommen hieß es dann also Bärlauch waschen, klein schneiden, mit Butter und ein wenig Salz und Pfeffer vermengen und portionsweise abfüllen. Wir hatten an diesem Tag so viel davon verarbeitet, dass im Anschluss das ganze Haus nach Bärlauch roch. Einfach klasse! :DFür gewöhnlich können wir den ganzen Bärlauch natürlich nicht auf einmal essen, daher frieren wir einen Teil der fertigen Butter und einen Teil des geschnittenen Bärlauchs ein. Das geht problemlos und so hat man beispielsweise auch im Sommer noch etwas von dem leckeren, grünen Zeug für Grillparties oder einfach so zum Naschen.Ich mag meine Bärlauchbutter am liebsten auf einem frischen Steinofenbrot. Sie passt aber zum Beispiel auch super zu Pasta oder Steak. Den gehackten Bärlauch kann man unter anderem für Bärlauchrisotto nehmen oder zum Verfeinern von Blattsalaten. An und für sich also ein tolles, wandelbares Gewächs, das es sich zu testen lohnt! #Rezept #OutdoorRezepte"
