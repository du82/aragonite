["https://kk.org/the-next-one-thousand-years-of-chri"]
title = "The Next One Thousand Years Of Christianity – Kevin Kelly"
full_description = "The Next One Thousand Years Of Christianity Look around you. In any city, even an old one, all that is visible now was not visible a century ago. Old houses get new skins, inside and out. Buildings come and go. Even in the wilderness, individual trees, bushes, and grass thrive and die, while entire ecologies shift across the landscape in a matter of a thousand years. Meadows morph into woods, woods age into mature forests. No matter where you stand, what you see is change. Our short lives blind us to this constant inconstancy. If we accept continual change in the past we must accept continual change in the future. More so because everywhere the rate of change is increasing. This new neck-snapping acceleration is driven primarily by new technologies. As long as change happened over the span of many generations there was no sense of the future as a destination. The “future” arrived only when change sped up until it was noticeable within an individual’s lifetime. When your world was different from your parents, then you had to talk about the future. A relentless avalanche of new technology means that we now live not in the present but in the future. The Christian church has changed significantly over time. The church in the year 1000 AD would not have been very recognizable to an ordinary Christian today. Certainly a core set of beliefs and values would remain unchanged, but much about daily life, spiritual perspective, and church-wide activity would be alien. One measurable and significant example would be the church’s attitude toward Jews. One thousand years ago official church doctrine and widespread popular sentiment declared Jews an anathema and they were treated as subhuman and worse. The fact that today a major supporter of an all Jewish state are conservative Christians would have been a laughable joke in 1000 AD. Or even two hundred years ago. In many other dimensions the church has shifted its course in the last 1,000 years. Ten centuries ago very few Christians were literate, so reading the Bible did not play a large role in everyday church life. Back then one’s denominational belief was almost 100% inherited from one’s parents. The geographically largest denomination was the Nestorian church, which has, for the most part, now disappeared. Sainthood had meaning, as did the concept of purgatory. Monasticism was considered a noble calling. Heretics were executed for public entertainment. There was no sense of an archeological or historical record of Biblical events. The raging religious controversies of the time were not about abortion and homosexuality, but whether the Spirit emanated from the Father and Son, or the Father alone, and whether indulgences (spiritual pardons from priests, often tied to donations) were legitimate. Clearly a devout medieval Christian dropped into a mid-morning service at a progressive church today would not recognize his faith. The strong sensual music, the focus on Bible-reading, the unadorned architecture, the lack of ornate ritual, the conversational tone of the sermon – all would be baffling at best. Getting into a discussion with our visitor would not ease him much either. A contemporary Christian’s familiarity with the Scriptures, their sense of history, their great emphasis on the self, the heavily mediated context of their belief, and even the degree to which fundamental assumptions of their religion have been baked into the culture at large, would confuse the 10th century Christian, who lived in a world where only 18% of the people were fellow believers, even in Europe. Given the extreme rate of change at work in our culture today it seems reasonable and responsible to expect tremendous change in the Christian church in the next 1000 years. Yet who in the church is preparing for this great shift? Where in the church is the needed longterm perspective? What is the scenario for the next 1,000 years of Christianity? As the wisdom in Proverbs 29:18 reminds us, “Without a vision the people perish.” Only 13 Generations One thousand years may seem too distant and remote to even contemplate, particularly for busy folk who have trouble making next summer’s vacation plans. Ten centuries so exceeds our own lifetime that we want to dismiss it as extraneous and unapproachable, and not worth thinking about. On the other hand, everyone understands a generation, and how values and consequences can flow over many generations. The Bible pays attention to generations. 1 Chronicles is full of generational perspectives. A typical generational roster like the following lists 13 familial generations of father to sons: Eleazar was the father of Phinehas, Phinehas the father of Abishua, Abishua the father of Bukki, Bukki the father of Uzzi, Uzzi the father of Zerahiah, Zerahiah the father of Meraioth, Meraioth the father of Amariah, Amariah the father of Ahitub, Ahitub the father of Zadok, Zadok the father of Ahimaaz, Ahimaaz the father of Azariah, Azariah the father of Johanan If the average age of fatherhood is 25 years, then this span of 13 generations will reach more than three centuries. But there is another definition of generation besides father/son that might be helpful. We might count a lifetime as a generation. A generation would go from birth to death, birth to death, and so on for a full 72 years on average. Imagine if we were trying to pass on a treasure and all that was necessary was that one person be alive – if even for a day – during the life of another to transmit it. As long as a person is born before the previous holder dies the generation chain remains unbroken. I recently constructed such a personal generational chain back 1,000 years. I searched for a notable person who died shortly after I was born. A few minutes on Wikipedia turned up the explorer Sven Hedin. I then found a notable person who was born shortly before Hedin died. And then someone born before he died, and so on. With little effort I can arrange a chain of only 13 people that will reach back 1,000 years. Me 1952 Sven Hedin, world explorer 1865 William Hooker, early botanist 1785 James Oglethorpe, founder of the state of Georgia 1696 Pope John the III of Poland 1629 Hieronymmous Praetorius, German composer 1560 Andrea Doria, Italian naval commander 1466 Donatello, Italian artist 1386 Peter IV of Aragon 1319 Duccio, Italian painter 1255 Tankei, Japanese sculptor 1173 Roger de Clare, Earl of Hertford 1116 Coloman of Hungary 1070 Robert 1, Duke of Burgundy 1011 None of the notable luminaries in this chain had actually met, so this unbroken circuit is purely conceptual. I was forced to use notable people who were unlikely to cross paths because we have so few historical birth records for ordinary folk. The further back you go, the fewer personal records of any sort, and the more difficult it becomes to make an optimal generation chain. The only people with recorded birth dates are the famous. However unnamed people in ordinary families could easily form a relational chain with the same span, with a great grandson arriving before the great grandfather dies. We could easily imagine the grandfather picking up the infant, and perhaps in some indirect way transmitting the wisdom of his grandfather to this next generation. We might further imagine a 70-year person standing with his arms outstretched in each direction – from the past of his birth to the future of his death – fingertips touching the previous generation and the following generation. With a chain of outstretched hands, each about 70 years long, we need only line up 13 people, fingertip to fingertip, to have them stretch their lives over 1,000 years. This means that the next 1,000 years is only 13 generations away. Calculated this way it doesn’t seem so distant, because this span of humans could fit around a dinner table. We could hold the list of 13 names, linking us and the year 3000 AD, in our head, much like the list of 13 generations just quoted from 1 Chronicles. In terms of lifetimes – which are steadily increasing due to medical progress – 10 centuries is just next door. The Last 1,000 Years As close as it is, the change we can expect in the next 13 generations will be far greater than the change experienced in the last 13 generations. Most of this change is driven by technology, just as it has been in the past. By far the greatest influence upon the Christian church in the last 1,000 years was the invention, dissemination, and perfection of printing technology. From this innovation flowed literacy, ubiquitous Bibles translated into the local vernacular, universities, historical research, and a culture centered around the book, among many other consequences. Printing transformed the church in many ways, not the least of which was the Protestant revolution. Knowledge was organized by printing technologies into encyclopedias, journals, and societies of experts. These technologies combined with a pursuit of truth and other values fostered by Christian faith to produce the way of thinking we call science, which slowly was refined in the last 400 years. Until the Renaissance, China invented most of the innovations that found their way to Europe. In some cases China invented things 200 to 1,000 years before Europe re-discovered them. China pioneered breakthrough advances like steel, vaccines, suspension bridges, gunpowder, and of course printing and paper. The one invention China never discovered was the scientific method, which was created by the Christianized west, in part because of the sense of order and rational law which permeated the universe depicted in the Bible. Although it was not visible to either medieval monks or illiterate church goers in the year 1000 AD, science was embedded in the values of the Christian church. It took a few generations of technology to expose and release this force. There are most likely other gifts embedded in the Christian perspective that have yet to be uncovered by new technology or Christian-based culture. The job of the present generation is to detect the signs of the next gifts and prepare the church to make the most of them. At the same time of course, these new technologies also bring challenges to the Christian church, as they have in the past. Futurity Where is the Christian church headed in the next 13 generations? It is impossible to predict the details of how 6 billion free-willed souls living on the planet at this moment, together with the ocean of ideas each of these 6 billion minds can generate, will interact with the extreme change offered by this century’s technologies such as genetic engineering, quantum computing, and cognitive sciences. The specifics of the next 1,000 years is unfathomable. But it is not necessary, nor desired, to predict in detail what the world, or Christianity, will be like in 10 centuries. Even if it were possible, it is not evident whether it would be useful. Imagine if you took a time travel trip back to a church in medieval England around the year 1000 AD. You appear at Mass one Sunday and have a chat with the priest afterwards. You could, of course, describe exactly the milieu of the year 2000 AD (cars, internet, rock and roll, medicines, obesity) but what could you tell him about our daily lives that would be useful if he wanted to prepare his church or the church at large for the future? What you’d like are some tools for presenting new perspectives. Three “Thinking Tools” For Aiming Christianity Into The Future: Large-scale trends In the year 1000 an awareness of how literacy would increase and become ubiquitous, and how nations and markets would rise in importance, are two examples of large-scale trajectories that, if accepted at that time, could have prepared the church for what was coming. In the 20th century you didn’t need to know anything about IBM or Apple to understand what computers did to the culture; all you needed to know was that computers would be half as small, and twice as fast every year. We can look for similar trends at work today. In the long-term careers will become more and more specific, if not tailored for specific individuals. In real dollars the cost of food and other necessities has been dropping for centuries. All trends today point toward more leisure, more abundance of choices. We can’t predict what company will win, or what specific technologies will triumph, but we can clearly see that the electronic network of cell phones, TVs, and computers will converge into one global web. Scenarios While we cannot predict what will happen in the far future we do know that whatever happens has to be possible and plausible. We can therefore eliminate the impossible from our forecasts, which leaves us only with the possible. The realm of all that is possible is still a very large pool of potential paths and might include such mysterious (but not physically impossible) inventions as flying cars and invisibility cloaks. The other key thing we know about the future is that whatever it is, every stage between today and then must also be possible and plausible. So the story of the next 1,000 years must make sense every step of the way, and any future where a discontinuous breach is required can be rejected. The result of these conditions is that we can imagine the future as a map of hundreds of possible narratives, each one a coherent story beginning today, each one as likely as the other, all bounded by an edge beyond which lies the impossible. The actual future will occupy a small point inside this boundary. To construct useful scenarios then, we will map out the outer boundaries of plausibility (always remaining just inside the possible), knowing that the actual future will be less extreme than the four corners of extreme plausibility we stake out. So our task is to permit our minds to imagine various coherent stories of the future that are both distinct (pushed to the four corners of plausibility) and still possible. We can then begin to unroll those extreme corners back to today and see what kinds of events, forces, drivers would need to be operating now in order for those scenarios to play out over time. If every Islamic nation today converted to Christianity by 3000 AD, what kind of signs would we need to see now? Likewise, if the US was not a Christian nation in 3000 AD but China was, what trends would we likely detect now? The problem with Christianity is that for the past 1,000 years it has permitted itself only one scenario of the future: the end of the world in our lifetime. In fact, make that 2,000 years. The first generations of Christians believed the future was short lived, and that it would end in their lifetimes. And the 25 lifetime-generations since then have also believed that the future was short and the world would end in their lifetime. Every generation has legitimately seen signs and wonders indicating an immediate end of the world. The scenario was plausible in every century. It might still happen today, in our lifetime. The end "
