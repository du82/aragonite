["https://kk.org/extrapolations/category/food"]
title = "Extrapolations: food"
full_description = "This collection of data includes the following indicators: Crop Acreage, 2014-2025, USDA Meat Production, 1990-2025, USDA Meat Consumption, 1909-2013; 1990-2025, USDA Meat Imports and Exports, 2014-2025, USDA Organic Food Market CAGR 2015-2020, TechSci Organic Food Sales, 1994-2014; 2006-2015, USDA; Organic Trade Association (OTA) Organic Food Acreage, 2003-2014; 2008-2014; 1992-2011, OTA; USDA Organic Acreage as a % of Total, 1995-2050, Steve Savage Organic Food Premiums, 2004-2010, Nielsen/USDA Genetically Engineered Corn and Soy, 2001-2015, USDA Farmers’ Markets, 1994-2015, USDA & LocalHarvest CSA Growth, 1980-2016, LocalHarvest Food-Miles, 1997/2004, 1969, 1980, 2001, Weber & Matthews, Dept. of Defense, Hendrickson, Pirog Farms By Size, 2002-2012, USDA Grocery Delivery Services, 2014 & 2023, Bricks Meets Clicks Income Spent on Food, 1970-2007, USDA % of Food Purchased Away from Home, 1970-2012, USDA Total Spending on Dining Out v. Groceries, 1992-2015, Commerce Dept. % of Dinners Eaten at Home and Made at Home, 1974-2014, NPD Group Food at Home v. Away By Income, 1956-2008, Smith Time Spent Cooking, 1965-2008, Smith In addition to these data sets, I’ve also included a link to a set of scenarios published by the Institute For The Future. The USDA has published a report of 10-year agricultural projections annually at least since 2005. The reports are a business-as-usual projection for crops, livestock, farm income, and agricultural trade. Excerpted below are projections for crop acreage. Includes the following macroeconomic assumptions (annual projections) GDP Disposable personal income Personal consumption expenditures Labor compensation per hour Civilian unemployment rate Nonfarm payroll employees Total population (p.16) Over the long run, steady global economic growth provides a foundation for increasing crop demand, with gains in world consumption and trade. Although crop prices are projected to be below recent records, they remain above pre-2007 levels. U.S. plantings for the eight major crops continue to fall during the second half of the projection period, to about 244 million acres by 2025. Corn and soybeans decrease the most. Increasing yields provide most of the gains in U.S. production."
