["https://kk.org/cooltools/category/maker-tools"]
title = "Maker Tools – Cool Tools"
full_description = "Maker Tools 06/19/18 5 Resistor Kits compared Round up of inexpensive resistor kits 06/12/18 Digital Servo Tester Controller with Voltage Display Cheap board gives you a quick way to play around with servos A cool tool can be any book, gadget, software, video, map, hardware, material, or website that is tried and true. All reviews on this site are written by readers who have actually used the tool and others like it. Items can be either old or new as long as they are wonderful. We post things we like and ignore the rest. Suggestions for tools much better than what is recommended here are always wanted. A weekly newsletter with four quick bites, edited by Tim Leffel, author of A Better Life for Half the Price and The World’s Cheapest Destinations. See past editions here, where your like-minded friends can subscribe and join you. Welcome to the many new subscribers after Nomadico co-founder Kevin Kelly mentioned us at the end of this collection of tips gleaned from 50+ years of travel. It’s hard for me to pick a favorite, but here’s a sample: “In 53 years of traveling with all kinds of people, I’ve seen absolutely no correlation between where you eat and whether you have intestinal problems, so to maximize the enjoyment of local foods, my rule of thumb is to eat wherever healthy-looking locals eat.” (And hey, he was a backpacker in the 1970s!) Someone asked me recently which travel apps would be a nightmare to give up on my phone and I had two: Google Maps and TripIt. Uses for the first are obvious, but TripIt is my second brain when I’m on the move, with transportation tickets, lodging reservations, and advance museum ticket times all saved in one place. As soon as the confirmation hits my e-mail box, it gets automatically forwarded to the app so I don’t have to do anything. I’ve been on the free plan for 12 years, but if you pay $49 a year for Pro you get some extra perks like alerts when a better seat opens up or when the flight price drops. While we’ve now standardized our travel tech around Bluetooth and USB-C, the airlines have gone the other way with luggage and splintered off in multiple directions. Not only are the fees a convoluted mess, but so are the answers to the simple question, “How big can my carry-on bag be?” In the USA you’re usually safe with 45 linear inches (22 X 14 X 9) but some allow a tad more. For European or Asian that could be too large though and you’ll also have to check it or pay extra if it weighs too much. EasyJet only allows the equivalent of 100 linear centimeters (39.6 linear inches) and for Air China your carry-on can only weigh 5 kilograms (11 pounds). Afar has done the research and published the most comprehensive rundown I’ve ever seen."
