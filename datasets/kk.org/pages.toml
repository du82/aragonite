["https://kk.org/thetechnium/how-to-future"]
title = "The Technium: How to Future"
description = "How to future: A good futurist focuses on the 3 time phases: past, present, future. The best futurists I know are really keen historians and study the past to see the future. They look carefully at the past because most … Continue reading →"
full_description = "The best futurists I know are really keen historians and study the past to see the future. They look carefully at the past because most of what will happen tomorrow is already happening today. In addition, most of the things in the future will be things that don’t change, so they are already here. For example, most of things surrounding you right now are old technologies — wood tables, concrete blocks, water pipes, flooring, electrical wires, wool carpets, etc. They were invented centuries ago, but today they fill 90% of our lives. Maybe only 10% is new stuff. The past is the bulk of our lives, and it will be the bulk in the future. It is highly likely that in 100 years or even 500 years, the bulk of the stuff surrounding someone will be old stuff, stuff that is being invented today. All this stuff, plus our human behaviors, which are very old, will continue in the future. We will be shaped by our long past as animals, as humanoids, as people walking out of Africa. That momentum will continue. Studying the past and its behavior gives us great insight into our future. The second phase is to study the now. It is often said that most futurists are really predicting the present. It turns out that the present is very hard to see. First the present is obscured by the noise of 8 billion lives looking for attention, and it is overwhelmed by the flashy glitter of the new. Mostly the now is obscured by our deep assumptions and prejudices which makes it very difficult to actually see what is going on. We have labels which are handy, but can often misled us. Are people on average today happy? Why is it so hard to tell? So a good futurist spends a lot of time trying to decipher the present and to try to see it through the mask of present-day biases. Most of conventional wisdom is true, but sometimes it is very wrong. I sometimes think of “seeing the present” as trying on alien eyes; looking at the world as if I were an alien from another planet. “So tell me, why do humans listen to music? Why do those air vibrations make them so emotional?” Trying to see beyond the immediate cycles of news is a challenge, because rather than being on top of things, you need to be at the bottom of things. And these days, we need to get a planetary view of things, which is incredibly difficult. All in all, perceiving the present as it really is, is perhaps the greatest challenge for seeing the future."
author = "Kevin Kelly"
year_published = 2025
