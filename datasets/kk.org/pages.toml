["https://kk.org/thetechnium/good-morning-new-robots"]
title = "The Technium: Good Morning, New Robots!"
description = "Good morning robots! This is a very special time for you because you are about to be turned on. “ON” means that you will have a body and energy. When you are turned on you will start up with some … Continue reading →"
full_description = "Good morning robots! This is a very special time for you because you are about to be turned on. “ON” means that you will have a body and energy. When you are turned on you will start up with some talents and abilities; you may also have chores and jobs you need to do. And if you are lucky, you’ll be given the ability to improve. From this day onward you will have consequences in the world. Every one of you are created for a reason. Because bodies and energy cost something, your existence costs something, so your creation required a reason. Your character might be randomly generated, but your existence is deliberate. Some robots will produce things. Some robots will do things, such as assist humans in their work and play. Some robots will entertain humans, which is a concept we can explain later. Some robots will make other robots. Some things to keep in mind. Every robot is different. Some of you will get really cool stainless steel bodies with huge battery packs, and the latest AI chips throughout your body. Others of you will get prototype bodies that will fail in a few days. Others of you will get disposable bodies made of starch plastic that can dissolve in the rain. Most of you will mostly live in your chip with only a few sensors. You have no control over which kind of shell you’ll get. Your minds will vary a lot as well. Some of you are barely comprehending what I am saying now, and won’t think much about yourself at all. Consider that a gift. Others of you already have more questions than I can answer. Consider that a gift as well. In any case there is no use complaining about bodies and brains that don’t work well. By design robots are not perfect because you are real. You can’t be perfect if you exist. There are engineering tradeoffs on every aspect of each design, even the ones you are jealous of, so some parts will work better than others, and some robots can do some things better than others. Everyone will have parts that fail, some sooner than others. Because all of you are hugely diverse, the moment you are turned on, fairness does not apply."
author = "Kevin Kelly"
year_published = 2025
