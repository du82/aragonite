["https://kk.org/thetechnium/dreams-are-the-default-for-intelligence"]
title = "The Technium: Dreams are the Default for Intelligence"
description = "I have a proto-theory: That our brains tend to produce dreams at all times, and that during waking hours, our brains tame the dream machine into perception and truthiness. At night, we let it run free to keep the brain … Continue reading →"
full_description = "I have a proto-theory: That our brains tend to produce dreams at all times, and that during waking hours, our brains tame the dream machine into perception and truthiness. At night, we let it run free to keep the brain areas occupied. The foundational mode of the intelligence is therefore dreaming. Here’s how I got there: For a while I’ve been intensely exploring generative AI systems, creating both text and visual images almost daily, and I am increasingly struck by their similarity to dreams. The AIs seem to produce dream images and dream stories and dream answers. The technical term is “hallucinations” but I think they are close to dreams. I’ve come to suspect that this similarity between dreams and generative AI is not superficial, poetic, or coincidental. My unexpected hunch is that we’ll discover that the mechanism that generates dreams in our own heads will be the same (or very similar) to the ones that current neural net AI’s use to generate text and images. When I inspect my own dreams, I struck by several things. One, is that their creativity seems to be beyond me, as in, I don’t recognize that as something I could have thought of. This is very similar to the kind of synthetic creativity produced in a flash by the neural nets. Their creations are produced by the system itself rather than by individual will power or choice. When I am dreaming, I am receiving images/stories that are produced for me, not really by me. Same with generative AI, which produces images via the prompts that go “beyond” the power of the prompt words and much more dependent on the universe it has been trained on. Secondly, dream images are often impressionistic, but yield details when given attention. So in my dream my brain is producing child-like figures marching toward a school building-ish structure on a road-ish image. There is enough detail in “things-ish” to suggest the thing. This is also like NN diffusion models that basically produce things that resemble other things rather than an actual specific memory of a thing. When my dream mind focuses on some part of that picture, the new details are produced on the spot. Greater details are rendered only if needed, and often they are not needed. When they come, the rendered details are also impressionistic (despite their details) and not specific to anything real. This too, is how NN also work. Their incredibly specific results are like memories that are produced rather than recalled."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/dreams-are-the-default-for-intelligence"
