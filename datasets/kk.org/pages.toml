["https://kk.org/streetuse/category/rapid-prototyping"]
title = "Street Use: Rapid Prototyping"
full_description = 'Reader by Kris Bordessa pointed me to this blog post, which describes a neat quick friut picker devised by his/her kids. "A fruit tree – heavy with fruit – was taunting them with ripe morsels high in the branches and out of their reach. Fifteen minutes later, they were successfully nabbing fruit with a homemade fruit picker made of a dowel, a water bottle and a chip-clip." A hair salon and a massage store have set up on the street in China. Who really needs walls? You get a much better view outside than watching a TV. And when it rains, no one goes out shopping anyway. I thought these very long pole nets, invented by these kids in China, are an ingenious solution to a problem of many kids in the developing world: need some money. Their particular problem was that scores of tourists float by in boats going down a scenic river, but they don’t get quite close enough to beg money from. Some tourists would be willing to donate if they could get some money to the boys. The solution is to lash a fishing net to a long bamboo pole which can reach the boats are certain turns. The boys reach their poles out and the tourist deposit the bills. The one in the picture is dropping a red 100 renbi note which is worth about US$8. That’s a big tip for these guys. But the solution is so clever I’d almost be willing to give them something for their effort. The photographer and source for this picture is unknown; I found it at this site of China photos. I tried to track down the provence of this image, but was unsuccessful. It shows some kids using a grocery shopping cart as a make-shift basketball hoop. Very clever! There’s few streets in this part of Kenya, so the bookmobile comes via a camel. This ingenious library is boxed and strapped to a camel. Author Masha Hamilton has accompanied the camels on library trips through Kenya’s isolated Northeastern Province. She writes on her web site: The actual Camel Bookmobile brings books to semi-nomadic people in Northeastern Kenya who live with the most minimal of possessions, suffering from chronic poverty and periodic drought. I visited the region during a period of drought and made several hours-long walks through the African bush with the bookmobile. I cannot describe how moving it was to see the people, particularly children, crowding around as the traveling librarians set up straw mats under an acacia tree and spread out the books. The excitement is palpable.'
