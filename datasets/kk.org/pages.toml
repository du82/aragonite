["https://kk.org/streetuse/category/hybrids"]
title = "Street Use: Hybrids"
full_description = "The students at Eindhoven University of Technology in the Netherlands created a 2.5 metric ton bike bus that has 32 seats. Each rider can pedal. From S. Fridqvist. Japan is famous for the fantastic and various things you can buy in vending machines — often standing in the most incongruous places. China has a few of these as well. This drinking-water vending machine was standing on a tiny back alley in Suzhou, a city near Shanghai. I couldn’t tell where/what it was hooked up to, but many of the homes in this area of the city, which neat and substantial, had no plumbing. So perhaps rather than have a spigot with unlimited water, they decided to meter it out. You bring your 5-gallon jar and fill ‘er up. Don’t know how much it costs. Every couple of weeks I like to check into Jan Chipchase’s latest travels. He’s constantly moving around the world noticing little things, like how we noted our world with little messages using technology. On his blog Future Perfect he posted this nice find in Finland. Key ring board for Helsinki’s Yrjonkatu swimming pool and sauna includes a minature clocks to mark the entry time for each pool goer – anyone staying longer than the one and half hours is charged extra. Or at least they were – the practice of limiting the customer time in the pool hasn’t been used since the 90’s. The board serves multiple purposes. The number of missing keyrings provides a visual snapshot of how many people are currently in the building. And because each key relates to a specific locker it is possible for the attendant to ‘partner up’ pool goers to have neighbouring lockers, increasing the likelyhood of social interaction or in the case of males on the prowl, something more. Unlikely? On men only night? Yeah right. I like the way it serves as a dashboard to the entire spa. I bet it does not last another three years before it is replaced by the standard PC screen. A guy named Chris sent this image and caption to Makezine. Looks like the solar panel flips back so you can drive it, though it must be sensitive to wind gusts."
