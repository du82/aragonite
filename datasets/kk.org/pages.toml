["https://kk.org/truefilms"]
title = "True Films"
full_description = "I present here the best general interest true films I've found. I define true films as documentaries, educational films, instructional how-to's, and what the British call factuals - a non-fiction visual account. As dogged as I have been in tracking down great true films, I have seen only a fraction of the estimated 40,000 that have been made. So I am ready for more. However I will only list true films and documentaries that are available as VHS tape or DVDs at consumer prices. In other words, films that are easy for most people to see upon request. I won't include films that are only shown in theaters, or available via high-priced rentals, or simply out of print. This film is a useful and serious extended prank. An Indian-American kid from New Jersey returned from a guru quest in India convinced gurus were only ordinary people with the job title of “guru.” The documentary begins when he decides to become a fake guru to prove that people only project guru-ness onto ordinary people like himself. He takes the name Kumare, adds a fantasy backstory, plus a made-up religion with made-up rituals and invented yoga moves. Over the span of four months he gathers a room-full of true believers in Arizona (filming the whole time), and teaches them that they “have a guru inside them” and that he is just an illusion. Much to his surprise he finds himself deeply bonding with his students who claim he is really helping them. He’s a pretty good guru! This makes his final “unveiling” or confession to them all the more painful, riveting, and uncomfortable even for viewers. Unlike the prank movie Borat, this one has a point, and it is a complex, unexpected, and subtle point. Are the people who follow him really fools, is Kumare’s deceit really noble, and will the now enlightened disciples be furious or forgiving? The true parable is spellbinding, funny, moving, and profound. A must-see. Take something as simple and ordinary as tea, then dig deeply into its roots to show that it is far more complex, subtle, varied, challenging and interesting than you would have ever believed. That’s the recipe for a delicious documentary, and this one delivers. A fanatical tea drinker in California becomes a connoisseur of fine teas, and then goes on to restore now forgotten traditions of organic artisan tea growing in China. Along the way he reveals the fascinating intricacies of how tea is hand-crafted, almost like a bottle of wine. This low-key journey into the hinterlands of China will completely transform your idea of tea."
