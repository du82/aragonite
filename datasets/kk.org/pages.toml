["https://kk.org/streetuse/category/improvised-technology"]
title = "Street Use: Improvised Technology"
full_description = "Nice piece in the New York Times about a Czech photographer who worked in the 60s and 70s using homemade cameras, one of them shown here. They are a wonderful example of street use. The Times said, “he fashioned them from shoeboxes, toilet-paper rolls and plexiglass, polishing the lenses with toothpaste and cigarette ash.” The guy was a bit of a pervert. He took low-res images of pretty girls on the street, in cafes, and on buses. “His photographs may look naïve, but they’re the product of a carefully orchestrated series of missteps that begins with crude, homemade cameras. As he says in the film, “If you want to be famous, you must do something more badly than anybody in the entire world.”” Still, his cameras are cool. There’s an emerging category of street technology which might be called Jailhouse Tech. The material constraint of a prison inspire fantastic innovation and re-use of made parts. A lot of the devices made in this manner are crude weapons, but others include eating implements, tattoo instruments, music, and other tools. Here are some examples from a prison in Mexico City by Gabriella Gomez-Mont. From the fantastic interview with the artist who works in this prison and who facilitated the photographer who shot these images: Now that it is over and done with I can tell you this. For the eight prisoners that helped us it would have easily meant another extra seven years in jail, and for us instant lock-up until they set bail. Especially because of having in our possession—or even presence–those knives made from the metallic edges of the windows! In there, they menace and kill people with those, we would all gotten into so much trouble if we had been caught with them. I don’t even know if those particular knives that we photographed that day had already been used for some sort of bloody business or not, I preferred not to ask; but it would have been even worse. Dornbracht, a German manufacturer of bath and kitchen fixtures is presenting a exhibit called “Global Street Food” which has removed street food carts from the streets and spotlighted them in a gallery on Dornbracht’s campus."
author = "Kevin Kelly"
year_published = 2025
