["https://kk.org/thetechnium/art-not-art"]
title = "The Technium: Art / Not Art"
description = "Art is extremely hard to define. We honestly don’t know it when we see it. Whatever that thing is, its label as art/not art is very much determined by context.  One experiment suggested that your political leanings correlated with your ease to … Continue reading →"
full_description = "Art is extremely hard to define. We honestly don’t know it when we see it. Whatever that thing is, its label as art/not art is very much determined by context. One experiment suggested that your political leanings correlated with your ease to call something art. A person who is educated and more open-minded will tend to be more inclusive in what they consider art. And even within all that is labeled art there is a huge variety. We tend to say there is good art vs bad art; new art vs old art, and my favorite, first word art vs last word art. This distinction by Michael Naimark reckons the kind of art that is first to explore a medium, or invent the medium, vs the kind of art that optimizes the medium. For example, the earliest rock and roll song versus the best rock and roll song. So art is definitely not just one thing, and not just one dimension. But let’s agree for just one minute that we all want to see more art in the world. Or more good art. How do we increase it? How do we improve it? How do we maximize it if we don’t know what it is and if we don’t even know it when we see it? I don’t have any answers, which bothers me. So I am constructing a poll for myself to see if pushing on the edges of this realm might reveal what is at its center. 1) Imagine there are four black scribbled lines on a white wall. 1a) One is by Picasso; 1b) one is by a two-year old child, 1c) one is by an elephant given rewards for marking; and 1d) one is by a robot given the prompt to make art. They look very similar. Now which ones are art? And how much does the story or origins matter? 2a) A photograph of a water stain on the side of a building taken by Ansel Adams. 2b)A photograph of a water stain on the side of a building taken by blind person. 2c) A water stain on the side of a building that you notice. 2d) A water stain on the side of a building noticed by no one. 3a) A modern digital camera. 3b) The first Kodak brownie camera. 3c) A camera made out of lego. 3d) A working camera made out of lego. 3e) A working camera with a lens made out of ice. 3f) A photograph of a glacier taken with a working camera with a lens made out of ice. 3g) A lens made of glacier ice. 3h) A found piece of glacier ice in the shape of a lens."
author = "Kevin Kelly"
year_published = 2025
