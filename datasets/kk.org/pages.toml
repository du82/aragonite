["https://kk.org/screenpublishing/eprdctn-hour-ge"]
title = "Screen Publishing: #eprdctn Hour Gems"
description = "This week’s #eprdctn hour, moderated by @BookDesignGirl, just concluded. The topic was eReader devices and apps and their unique code rendering issues. These are some gems worth remembering: Misc @amarie – uses TweetChat to focus on conversations with a certain … Continue reading →"
full_description = "This week’s #eprdctn hour, moderated by @BookDesignGirl, just concluded. The topic was eReader devices and apps and their unique code rendering issues. These are some gems worth remembering: @MatthewDiener – “for Kindle/Mobi, @jtallent’s Kindle Formatting points out most of the rendering issues” @BookDesignGirl – “Edges of the images in my .jpg’s were blurry and the [epub] spec said to change to .gif it that was happening. It did the trick.” @ BookDesignGirl – “Tally: @camilcloutier uses center tags @NickRuffilo uses CSS not center tags & I’ve used empty span tags to make text center on iBooks!” @pablod – Previews HTML components of an ePub file in Mobile Safari in the iOS emulator. Note: only good for previewing single pages (not full epub docs) – not a substitute for previewing on an actual iOS device, but in a pinch, it can help. @ BookDesignGirl – “I’ve started embedding fonts. Used http://tinyurl.com/6cw5hoz for current project & it worked fine (knock on wood).” @pablod – “I had to pull out a div with embedded fonts which was causing a rendering issue at page break for a UL within the div in iBooks.” @tinahender – “As a a rule, I do not embed fonts b/c licensing issues are not clear. But if a client asked, I would look into it further.” @pablod – “Alternately, Google.com/webfonts gets around the pesky font licensing issue. Also, theleagueofmoveabletype.com” @biladew – “embed fonts only when necessary. Otherwise generic font faces should give you what you need (serif, sans-serif, etc)” @BookDesignGirl – “We don’t embed b/c of licensing/potential validation issues but did for this project. Times font didn’t work for tweens” @aarontroia – “go to @ebookarchitects bit.ly/lDSNWv and download Font Test, its a really good font embedding example” @BookDesignGirl – “We do InDesign to ePub (either conversion house or in-house) -> edit ePub -> convert to .mobi -> note conversion issues -> go back to epub and edit in Dreamweaver -> .mobi (repeat)”"
author = "Kevin Kelly"
year_published = 2025
