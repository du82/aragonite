["https://kk.org/streetuse/2007/05"]
title = "Street Use: 2007 : May"
full_description = "This is one of a series of images floating around the internet, forwarded to me by Bruce Sterling. It’s labeled as somewhere in Russia, but that might be only a tasteless joke. But in any case it’s a handy lamp. For thousands of years humans have transported heavy goods on their backs using a head held tump line. The loads a fit porter can carry are astonishing. Some can manage 100 kilos (220 pounds), which considering their own body size is incredible. These guys in Nepal can manage both heavy and awkward loads with ingenuity. Keep in mind that the coke bottles below are heavy glass (made to be washed and re-used many times), and are filled. Just one wooden tray would be a load for most of us. I’ve seen these porters pack in refridgerators, heavy lumber, furniture, and mother-in-laws. These photos are by Jeff Greenwald. A discarded flashlight becomes an ideal broom handle. Photographed by Jeff Greenwald.”The little girl with the flashlight broom worked in her mother’s lodge in the village of Chomro, in the Annapurna mountains of Nepal.” The title of this set of photos from the Flickr photo stream of Clear Path International is “Hobby De-Miner”. Clear Path International is a non-profit devoted to serving the survivors of landmines. As the unnamed photographer explains, “We ran into this boy collecting scrap metal from the Vietnam War alongside the road near Da Nang. Often, while searching for scrap, people that do this will find a bomb and attempt to dismantle it and sell the metal. Many are killed or injured.” World traveler and author Jeff Greenwald sent me this photo of a improvised kersone lamp. He writes: “The light bulb/kiwi tin lamp was photographed some years ago in an inn along the southwest coast of Sri Lanka, probably in Hikkaduwa.” Looks dangerous. Probably is. I found this streetuse weapon on Matthias Wandel’s website, where in addition to the air gun he documents his other benign and geeky pursuits, including what he calls his “insane contraptions.” He writes:"
