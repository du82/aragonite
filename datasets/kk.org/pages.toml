["https://kk.org/thetechnium/rights-responsibilities"]
title = "The Technium: Rights / Responsibilities"
description = "We tend to talk about rights without ever mentioning their corresponding duties. Every right needs an obligation to support it. At the very least we have a duty to grant the same rights to others, but more consequentially, rights have … Continue reading →"
full_description = "We tend to talk about rights without ever mentioning their corresponding duties. Every right needs an obligation to support it. At the very least we have a duty to grant the same rights to others, but more consequentially, rights have trade-offs: things we have to do or surrender in order to earn the right. The right to vote entails the duty to pay taxes. The right of free speech entails the duty of using it responsibly, not inciting violence, harm, insurrection. For example, security. Modern security is an attribute of systems. Your thing, your home, your company, cannot maintain security alone outside of a system. Once a digital device is connected, everything it connects with needs to be secure as well. In fact, any system will only be as secure as the weakest part of that system. If your part is 99% secure, but your colleague is only 90% secure, you are actually only 90% secure as well. This small difference is huge in security. There are documented cases where an insecure baby monitor in a household system became the back door to unauthorized entry into that family’s network. In this way, the lax security of one piece sets the security for the whole system Therefore, every part of a system has a duty to maintain the required level of security. Since one part’s security in part determines and impacts all parts’ security, every part of the system can rightfully demand that all parts level up. It is therefore the duty of each part (person, organization) to maintain the proper security. It is not hard to imagine protocols that say you and your devices can’t join this network unless you can demonstrate you have proper security. In short you have the right to connect to the public commons (without permission), but you have the duty to ensure the security of your connection (and the commons as a whole). This is not much different from what most nations say, which is you have a right to use any public road, but you must demonstrate you are responsible for its safety and security by passing a driver’s test. Your right is mobility on the roads; your duty is drive responsibility (no drinking!), and to get a license to prove it."
author = "Kevin Kelly"
year_published = 2025
