["https://kk.org/thetechnium/the-need-for-long-term-research"]
title = "The Technium: The Need for Long-term Research"
description = "I am imagining a type of institution that would specialize in long-range research. These institutions (plural) would manage research that had a 25+ year horizon. This might be “pure” basic research with no apparent value within 25 years, as well … Continue reading →"
full_description = "I am imagining a type of institution that would specialize in long-range research. These institutions (plural) would manage research that had a 25+ year horizon. This might be “pure” basic research with no apparent value within 25 years, as well as long-term longitudinal studies that take 25 years or more to complete. Some programs would be large-scale projects with ambitious decades-long goals. Others would be small individual limited projects with a single PI. Research with a 25-year horizon to either completion or payoff would create a generational research agenda. At first approximation, this is the type of research that universities are supposed to be doing now. However it is rarely done by universities. Rather the typical research project might last 4 years at the longest because that is the max duration of a PhD and post-doc. An average PhD candidate wants their own unique project; they don’t want to continue someone else’s project. So the academic world is a rapid succession of short-lived projects. There are many advantages to this frothy, bubbling, rapid pace, but what we do not get are the results gained from ambitious multi-generation work. There are some hard things that require long-durations to reveal, and many other discoveries that require work beyond the scope of single investigators. Long-range research is the type of work that is sometimes funded by Darpa in the US, NASA, and some international agencies and research programs. Sending telescopes and probes into deep space, or building high-speed particle accelerators are long-lived research agendas. These are also huge-budget projects, with attendant high-profile politics. We need more long-term research projects that require smaller budgets and resources to endure. That would help make them common rather than rare. Some of the research labs of big tech companies (AT&T, Microsoft, IBM, Google) are occasionally engaged in this extended time horizon. This long horizon is harder to justify to their stockholders, so the percentage of long-range research they do is a small fraction of all their research, and it is rarely on the 25-year horizon, but in the mix this longer-term commercial research is helpful and important."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/the-need-for-long-term-research"
