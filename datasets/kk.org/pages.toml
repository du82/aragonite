["https://kk.org/thetechnium/the-myth-of-a-superhuman-ai"]
title = "The Technium: The Myth of a Superhuman AI"
description = "I’ve heard that in the future computerized AIs will become so much smarter than us that they will take all our jobs and resources, and humans will go extinct. Is this true? That’s the most common question I get whenever … Continue reading →"
full_description = "I’ve heard that in the future computerized AIs will become so much smarter than us that they will take all our jobs and resources, and humans will go extinct. Is this true? That’s the most common question I get whenever I give a talk about AI. The questioners are earnest; their worry stems in part from some experts who are asking themselves the same thing. These folks are some of the smartest people alive today, such as Stephen Hawking, Elon Musk, Max Tegmark, Sam Harris, and Bill Gates, and they believe this scenario very likely could be true. Recently at a conference convened to discuss these AI issues, a panel of nine of the most informed gurus on AI all agreed this superhuman intelligence was inevitable and not far away. Yet buried in this scenario of a takeover of superhuman artificial intelligence are five assumptions which, when examined closely, are not based on any evidence. These claims might be true in the future, but there is no evidence to date to support them. The assumptions behind a superhuman intelligence arising soon are: 1. Artificial intelligence is already getting smarter than us, at an exponential rate. 2. We’ll make AIs into a general purpose intelligence, like our own. 3. We can make human intelligence in silicon. 4. Intelligence can be expanded without limit. 5. Once we have exploding superintelligence it can solve most of our problems. In contradistinction to this orthodoxy, I find the following five heresies to have more evidence to support them. 1. Intelligence is not a single dimension, so “smarter than humans” is a meaningless concept. 2. Humans do not have general purpose minds, and neither will AIs. 3. Emulation of human thinking in other media will be constrained by cost. 4. Dimensions of intelligence are not infinite. 5. Intelligences are only one factor in progress. If the expectation of a superhuman AI takeover is built on five key assumptions that have no basis in evidence, then this idea is more akin to a religious belief — a myth. In the following paragraphs I expand my evidence for each of these five counter-assumptions, and make the case that, indeed, a superhuman AI is a kind of myth."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/the-myth-of-a-superhuman-ai"
