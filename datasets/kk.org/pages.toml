["https://kk.org/extrapolations/category/shopping"]
title = "Extrapolations: shopping"
full_description = "In 2016, global shopping center completions were up 11.4% over 2015 levels, despite having slowed over the past few years. However, the pace of development continues to slow, with the number of shopping centers under construction down 22% The majority of added shopping center space came to market in Asia, but The Americas registered the strongest growth, with completion levels up 43.6%, fueled by construction growth in Mexico. In 2016: 17% of retailers planned to open more than 40 stores 67% planned to open no more than 20 Most popular formats for expansion 76% street shops 72% regional shopping malls 45% open air shopping malls 20% transport hubs (airport, railway terminals) 18% outlets 18% retail park 15% concession counters in department stores 8% duty free Global shopping centre completions started to slow (in 2015) as parts of the global retail market witness the effects of an imbalance between significant supply and demand. Despite this, there continues to be exceptional levels of construction, particularly in Asia. Globally, 10.7 million sq m of new space opened in 2015 in the 168 cities we surveyed; this is down on 2014, where 12.1 million sq m of space were completed; and a further 41.9 million sq m is under construction, up from 39 million in 2014. src: CBRE, April 2016 Global Retail ViewPoint – Shopping Centre Development April 2016 [full report here] Global Retail Development Index Shows where retail investment has been most attractive (ranks top 30 countries). These are the top 10 countries in 2017 CC’s note: These rankings are available back to 2004. Could aggregate, if this were of interest to KK. (Started to aggregate a couple years’ of data, but stopped bc I wasn’t sure if it was of interest.) Relig-Shop-Dev-Homes-Extrapolations.xlsx GRDI tab In 2016, European shopping center construction was down 6% overall compared with 2015. Western Europe saw an increase of 15% in new shopping center completions, but this was outweighed by a 17% decline in the UK, as well as a 17% decline in Central and Eastern Europe (which also dropped 11% in 2015). Further declines are expected in 2017."
