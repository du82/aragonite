full_description = "This is a collection of long-term forecasts based on quantitative data from diverse sectors. Long-term means 20 years or more. Diverse means forecasts in a wide range of activities such as transportation, education, food, shelter, entertainment, technology, etc. You can help grow the collection. Please check our list of desired indicators and submit suggestions to extrapolations@kk.org. We're also collecting and crossposting any and all attempts to extrapolate the future on Tumblr and Pinterest. You can follow us on Twitter too. ASK Extrapolate to 2050: Individual daily consumption of all media (web-based and traditional) Individual daily consumption of social media Zenith (a media agency) tracks this info on a global scale (I’ve not found other sources). They’ve only been publishing reports for the last four years, but I found a Recode article that interviews the head of forecasting at Zenith (Jonathan Barnard). This article provides historic data back to 2010, and forecasts to 2019, contrasting North America with the global average. The article was published in May 2017, and Zenith published a new report in 2018 with slightly different data for the last few years and looking forward, but the most recent report does not provide the context of the previous 10 years. For consistency of methodology, I’ve just used the data quoted by Recode for the following extrapolation. [Excerpts from all four published Zenith reports are below, showing the yearly revision to their data. In summary, the estimates become more conservative with each subsequent report up until the latest report, which shows a jump again.] src: Recode, May 2017 “People consumed more media than ever last year — but growth is slowing” figure: Average individual daily media consumption in minutes citing Zenith (appears to be from their 2017 report, including historic data available not freely accessible). Here are excerpts from the press releases for the annual “Media Consumption Forecasts” by Zenith."
