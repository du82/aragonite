title = "Extrapolations: sports and games"
full_description = "Alongside November 2017’s Mobility Report, Ericsson offered some speculations on the effect 5G mobile service might have on sporting event spectators. A range of services may be included in 5G showcases, allowing venue visitors to turn from spectators into participants and enabling them to: State of Sports for Gen Z Kids: Building Lifelong Affection in a Hyper-Competitive Market Generation Z kids are bombarded by a tsunami of highly accessible and enticing alternatives to sports each day. What effect will this have on the long-term outlook for the professional sports industry? How can the sports industry adapt to this reality in a manner that builds a relationship TODAY so that kids will be engaged with sports tomorrow? Rich Luker, the Founder of the ESPN Sports Poll, and Terence Burke, SVP of Research and Editor-in-Chief of KidSay’s Trend Tracker report, will describe a new alliance of the two groups and present the first, ever, “State of Sports for Generation Z” convergenceing kids from 5-17. From Pokemon Go to Esports: Lessons and Opportunities At the 2017 Project Play Summit, experts weigh in on how to assure more free play for kids through technology. What lessons can be learned from the popularity of Pokemon Go and esports? Moderating the session is Jeremy Goldberg, President, LeagueApps. Panelists are Angela Ruggiero, Co-Founder/Managing Director, Sports Innovation Lab; Chris Kluwe, Former NFL Punter; Vikram Grover, Senior Director of Business Development, Niantic; and Rich Luker, Founder, Luker on Trends. Gamelab Barcelona 2017 – Mike Sepso – Shaping eSports right YouTube Mike Sepso is Senior Vice President of Activision Blizzard where he runs Media Networks, a division devoted to creating the best esports experiences for fans across games, platforms and geographies. Prior to joining Activision Blizzard, Mike was the co-founder and president of Major League Gaming (MLG), a global leader in esports, focusing on strategy, key partnerships, corporate development and overseeing all product and technology development, including the launch of MLG.TV. In his conversation with Dot Esports journalist Thiemo Bräutigan, Mike goes through Activision Blizzard’s Esports strategy for the comming years, and comments on the latest news around the Overwatch Global League."
