["https://kk.org/thetechnium/alloception-i-saw-someone-in-there"]
title = "The Technium: Alloception: I Saw Someone In There"
description = "This week an AI researcher at Google announced that he detected a sentient being in one of their AIs and that when he brought this to the attention of Google management, they suspended him. The AI researcher was using a sophisticated … Continue reading →"
full_description = "This week an AI researcher at Google announced that he detected a sentient being in one of their AIs and that when he brought this to the attention of Google management, they suspended him. The AI researcher was using a sophisticated chat bot called LaMDA developed by Google and in the course of conversations with it, he concluded that it had to have some kind of sentience. Not just intelligence but self-awareness. He released edited versions of the conversation log to prove his claims. Not surprisingly, Google management and most AI experts say there is no sentience in this code, and that he is projecting his own considerable biases onto the conversation, just as many others have done on past AIs even more primitive. We have been seeing a ghost in the machine for as long as we have been making machines. But I think this is newsworthy for a very small reason. The researcher’s stature as someone creating the AI gives his claim a little more weight than usual, but his claims are old. In fact the inherent paradox in all claims like this are also as old as AI. What’s new is that because of his stature this paradox can be illustrated in bold, in ALL CAPS, so it can’t be ignored. And that paradox is that WE HAVE NO IDEA WHAT SENTIENCE OR CONSCIOUSNESS IS. We are not even close to having a working practical definition. The fired AI researcher has no metrics. Google management have no metrics. The chorus of AI experts have no metrics. I do not have any metrics. We modern humans have no metrics to decide whether someone — or something — is conscious. It is clear from work with animals that this quality is a gradient, a continuum. Some primates have some qualities of self-awareness, but not others. We are not sure how many dimensions consciousness has, and we have no certainty about what boundaries this may have in humans. Because of the progress we have made in neuroscience and in AI, we believe that intelligence is something different than consciousness and maybe different than sentience (which is about feeling things) which may be different from creativity, but WE ARE NOT SURE. We can show that the qualities in animals are different from ours, and as many AI researchers can show, the qualities in AIs are often drastically different from ours. Some of the qualities, like creativity, do appear in machines, which we are unclear in how that type of creativity is related to ours."
author = "Kevin Kelly"
year_published = 2025
