title = "Extrapolations: Clothing Expenditures and Prices"
full_description = "The Bureau of Labor Statistics tracks apparel expenditures as well as indexed prices (CPI – prices relative to a base year, not actual prices). Apparel includes a broad range of subcategories. Where available, we have also sought item-level data, using men’s Tshirts as an exemplar. Expenditure data is available going back to 1990. CPI data is available going back to 1947. Tshirt CPI data is available back to 1997 (possibly earlier – awaiting clarification from BLS). No forecasts found. Average expenditures per consumer unit in 2014 were $53,495, a 4.7percent increase from 2013 levels, the U.S. Bureau of Labor Statistics reported today. During the same period, the Consumer Price Index (CPIU) rose 1.6 percent(1). In 2013, spending decreased 0.7 percent. Average pretax income per consumer unit increased at about the same pace as expenditures, up 4.8 percent from 2013. Consumer units include families, single persons living alone or sharing a household with others but who are financially independent, or two or more persons living together who share expenses. Note: The “Apparel and Services” category includes apparel and footwear for adults, children, and babies (including sportswear, and uniforms), as well as material for making clothes, shoe repair, alterations, sewing patterns and notions, clothing rental, storage, dry cleaning and sent-out laundry, watches, jewelry, and repairs to watches and jewelry. Src: US. Bureau of Labor Statistics, “Consumer Price Index for All Urban Consumers: Apparel [CPIAPPSL].” Retrieved from FRED, Federal Reserve Bank of St. Louis, November 18, 2015. Men’s shirts and sweaters (SEAA03) Series ID: CUUR0000SEAA03 base period: 1997 Annual average: 1998 100 1999 98.6 2000 98.3 2001 93.9 2002 88.8 2003 85.2 2004 85.3 2005 84.2 2006 84.7 2007 82.53 2008 80.444 2009 80.968 2010 78.642 2011 79.583 2012 82.224 2013 82.876 2014 80.973 Src: “Consumer Price Index – All Urban Consumers.” Custom table, November 19, 2015. Bureau of Labor Statistics."
