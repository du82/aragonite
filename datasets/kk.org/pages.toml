["https://kk.org/thetechnium/future-scarcities"]
title = "The Technium: Future Scarcities"
description = "What kind of things might be scarce in a future world filled with advance AIs and advance science that could probably reverse engineer most things? It is hard to think of something we could not synthesize. In the sci-fi story Dune, … Continue reading →"
full_description = "What kind of things might be scarce in a future world filled with advance AIs and advance science that could probably reverse engineer most things? It is hard to think of something we could not synthesize. In the sci-fi story Dune, the empire revolves around melange spice, which can give users prophetic abilities. Use of the spice is the only way to navigate through the stars. Therefore the planet where the spice is mined becomes a battle ground because this spice is so valuable. Why can’t this spice be synthesized? If a civilization could make inter-galatic travel possible, surely they could replicate this spice’s chemistry and physics. In any coherent plausible future, they would have. They would synthesize the substance near to where they needed it. If it isn’t melange spice, is there anything, say in a thousand years from now, that would be worth traveling to another planet to retrieve? There are currently plans to mine asteroids. The idea is that the concentration of metals is so high in them that is it worth the cost of space construction and shipping to make it more economical than mining and refining on Earth. It is unclear if this will be true. But what if you could hop around planets in our galaxy as easily as we hope around this planet? Is it possible there could be anything on a planet that might make it valuable, like Dune? That is, the conditions on the planet might generate something that could not (easily) be generated in a lab somewhere else? Perhaps there is something about a planet’s position in space that is scarce? Maybe a black hole nearby is needed to produce some form of natural Unobtainium, which is beyond most civilization’s skill set. So this material becomes an inter-galatic scarcity. Except to the more advanced civilizations, to whom it is trivial because they figured out how to mimic the conditions of a black hole. So if it is trivial, then why not manufacture it for cheap and make it widely available? If space hopping was easy, then this material would soon be in stores all over the galaxy."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/future-scarcities"
