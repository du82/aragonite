full_description = "This collection of data includes the following indicators, dates, and sources: unemployment rate, 2010-2060, OECD white collar jobs growth, 1900-2000, AFL-CIO occupations with most job growth (by number and percent), 2014/2024, BLS occupations with the largest job declines (by number and percent), 2014/2024, BLS In addition to these datasets, I’ve noted a couple jobs projections by futurist Thomas Frey, and a study estimating the impacts of future technology on jobs in the next couple decades. Src: OECD. May 2014. “Economic Outlook No 95: Long-term baseline projections” Variable: NAIRU unemployment rate with non-accelerating inflation rate Country: United States Src: Marc Cenedella. January 2010. “Great News! We’ve Become A White-Collar Nation.” Business Insider. Table 1.4 Occupations with the most job growth (raw numbers), 2014 and projected 2024 (Numbers in thousands) Src: Bureau of Labor Statistics. April 2016. “Table 1.4 Occupations with the most job growth, 2014 and projected 2024 (Numbers in thousands).” Employment Projections. Table 1.4 Occupations with the most job growth (percent increase), 2014 and projected 2024 (Numbers in thousands) Src: Bureau of Labor Statistics. April 2016. “Table 1.4 Occupations with the most job growth, 2014 and projected 2024 (Numbers in thousands).” Employment Projections. Table 1.6 Occupations with the largest job declines (raw numbers), 2014 and projected 2024 (Numbers in thousands) Src: Bureau of Labor Statistics. April 2016. “Table 1.6 Occupations with the largest job declines, 2014 and projected 2024” (Numbers in thousands). Employment Projections. Src: Bureau of Labor Statistics. April 2016. “Table 1.5 Fastest declining occupations (percent), 2014 and projected 2024 (Numbers in thousands).” Employment Projections. “The Future Of Employment: How Susceptible Are Jobs To Computerisation?” Carl Benedikt Frey and Michael A. Osborne. September 2013. Oxford University. Abstract: We examine how susceptible jobs are to computerisation. To assess this, we begin by implementing a novel methodology to estimate the probability of computerisation for 702 detailed occupations, using a Gaussian process classifier. Based on these estimates, we examine expected impacts of future computerisation on US labour market outcomes, with the primary objective of analysing the number of jobs at risk and the relationship between an occupation’s probability of computerisation, wages and educational attainment. According to our estimates, about 47 percent of total US employment is at risk. We further provide evidence that wages and educational attainment exhibit a strong negative relationship with an occupation’s probability of computerisation."
