["https://kk.org/streetuse/2007/01"]
title = "Street Use: 2007 : January"
full_description = "The ever-amazing vagabond researcher Jan Chipcase has a wonderful report on the phone charging booths in Uganda. Jan says: Uganda is a country coping with a severe energy crisis resulting in frequent power cuts. In addition, access to mains electricity in rural locations is limited. Given that mobile phones require power, and access to power can be unpredictable – how do people keep their mobile phones and other electrical devices charged? Last July a Nokia research team travelled to Uganda and explored this issue as part of a more in-depth study into shared phone use. There are two forms of mobile phone battery charging services in Kampala – either offered as an additional service by phone kiosk operators or as a stand alone service. It costs 500 Ugandan Shillings (0.2 Euro) to have a battery recharged similar to the price of 2 or 3 phone calls. Whist both services appear to thrive there are a number of barriers to use: customers cannot use their phone whilst the battery is being charged; the customer risks, or perceives the risk that their battery being swapped for an inferior one; a perceived risk of phone theft – signs that suggest service providers are not responsible for loss or theft are evident. For many Ugandan rural communities with no access to mains power car batteries are the primary means of providing electricity to the home. Businesses such as bars also run off car batteries but they are more likely to have their own power generator. A used car battery costs 30 to 40 dollars and can keep a household powered for a month, though in a bar the same battery might last a week. The homes we visited ran electrical items included radios, CD players, television and domestic lighting. On the island of Cozumel, the scuba divers haven near Cancun, Mexico, local residents have devised a trash basket that hovers above ground. I think this design does two things> 1) It raises the garbage above rat height, although they may still be able to get up the slippery pole (rats are amazing). But it must decrease the ease, and keep some of it out of reach. 2) It makes it easy to spot recycleables, like cans and bottles, or even other junk someone else might want."
author = "Kevin Kelly"
year_published = 2025
