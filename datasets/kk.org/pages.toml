["https://kk.org/extrapolations/category/energy"]
title = "Extrapolations: energy"
full_description = "Energy mix forecasts looking out 15 to 35 years are available from a handful of governmental, industry, and independent sources. The excerpts below are preceded by my brief notes, in italic, introducing the source. General consensus: oil, gas, and coal continue to dominate the energy mix. Gas grows substantially; oil and coal are either level or decreasing. Renewables show the highest growth rates. Amongst renewables, solar shows the greatest growth. Energy intensity (or consumption per capita) decreases. In addition to energy mix, the figures below also include forecasts for overall usage, intensity (per capita usage), prices, residential sources, and emissions. The U.S. Energy Information Administration (EIA) presents energy forecasts for a range of cases in its Annual Energy Outlook. The excerpts below refer to the Reference Case, wherein GDP grows at an average annual rate of 2.4%, and current laws and regulations remain basically the same. This is the “business as usual” scenario. Forecasts for five other scenarios are presented in the report, but are not excerpted here. Total primary energy consumption grows in the AEO2015 Reference case by 8.6 quadrillion Btu (8.9%), from 97.1 quadrillion Btu in 2013 to 105.7 quadrillion Btu in 2040 (Figure 18). data available here web chapter here Energy intensity (measured both by energy use per capita and by energy use per dollar of GDP) declines in the AEO2015 Reference case over the projection period (Figure 19). data available here web chapter here Delivered energy consumption decreases at an average rate of 0.3%/year in the residential sector and grows by 0.6%/year in the commercial sector from 2013 through 2040 in the AEO2015 Reference case (Figure 14 and Figure 15). Over the same period, the total number of households grows by 0.8%/year, and commercial floorspace increases by 1.0%/year (Table 4). data available here and here web chapter here End-use energy intensity, as measured by consumption per residential household or square foot of commercial floorspace, decreases in the Reference case as a result of increases in the efficiency of equipment for many end uses (Figure 16 and Figure 17). Federal standards and voluntary market transformation programs (e.g., Energy Star) target uses such as space heating and cooling, water heating, lighting, and refrigeration, as well as devices that are rapidly proliferating, such as set-top boxes and external power supplies. data available here web chapter here"
author = "Kevin Kelly"
year_published = 2025
