["https://kk.org/thetechnium/construction-is-life"]
title = "The Technium: Construction is Life"
description = "When I was growing up in the suburbs, I was bothered by all the construction going on in the big city nearby (New York). Whenever I visited, there were detours, cranes, cement trucks blocking the streets, never-ceasing jackhammers, sidewalks closed, … Continue reading →"
full_description = "When I was growing up in the suburbs, I was bothered by all the construction going on in the big city nearby (New York). Whenever I visited, there were detours, cranes, cement trucks blocking the streets, never-ceasing jackhammers, sidewalks closed, dug-up streets, and buildings going up or being taken down everywhere. The racket, the disruption, and the chaos seemed relentless, and excessive. It was not just one visit, but each time, over many years. The disturbance was slightly annoying, but mostly it made the place seem unfinished, incomplete. I took it as bad planning. Later in life when I lived in a city, like San Francisco, I got to see the construction on a long-term basis, and noticed that just after they would finish paving a street, they would begin ripping it up again for another underground project. It seemed as if “under construction” was a street’s permanent state. And cranes are its default decoration. I kept wondering when they would get their act together and finish the place. Much later in life, when I had a chance to visit a wide variety of places, including those not as prosperous, I realized that construction is a sign of life. If a city, a town, even a building, is not undergoing upgrade, repairs, and new additions, that means it is dying. That constant din of work is the pulse of life for human environments. Jackhammers removing the old are the sound of a city’s metabolism. Neighborhoods that have construction in them are alive; those without it are ill. A place needs at least the work of upgrading and repair to remain healthy in the long-term. Buildings which never get scaffolding for repair, will be taken down or fall down. Cities without construction get bypassed, or hollowed out. Today there are entire countries like China and India which are nation-sized construction sites. Every part of every city or town, even every neighborhood, is chock full of unfinished demolition, detours, cranes, ug-up streets, and on-going construction. Their motto is “we are not done yet.” I recognized this work now as a sign of prosperity, of a healthy metabolism."
author = "Kevin Kelly"
year_published = 2025
