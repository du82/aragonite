title = "Street Use: 2008 : June"
full_description = "Spotted this homemade crab catcher in Bodega Bay, CA. A few milk crates, a couple laundry baskets and some rope! I’m not sure how it works. I think the baskets serve as flexible one-way portals to reach in to remove the crabs stuck in the crate. The crabs probably enter the one crate without a basket and travel to the other 5 via a connecting passage they can’t re-find, and so get stuck. Tom Ritchey, master bike frame builder, sent me these photos of hand-made tools he spotted at bike shops in Rwanda."
