["https://kk.org/ct2"]
title = "ct2"
full_description = "I live near the Pacific, along highway 1, which winds along the length of California (mostly). Two days ago I was riding my bicycle along a coastal path around noon, when coming around a curve in the opposite direction was this apparition. Hey, it was a yellow tandem bike. No there’s more than two. Wait, there are kids. Little kids. Whoa! There are five people riding. Add luggage! They were obviously on long trip but they went by pretty fast, and I did not have a camera. So I googled them. Found their blog. Their story is even more amazing. With gear their bike weights 600 pounds. They’ve ridden 4,000 miles so far and are headed up the coast to Alaska. They left their home in Kentucky with $300 in their pockets. I rode my bicycle across the country once so I know what is involved and man, those kids must be amazing. According to their facebook account, they are scheduled to cross the Golden Gate Bridge today at 10 am. That would be a photo opp. Salon ran a very insightful article on the rise of the new yippies on the right: Glenn Beck is the new Abbie Hoffman. It’s very prescient. The author suggests that like the radical yippies in the 1960s, today’s radicals endorse a similar list of tactics, behaviors, and beliefs. Today’s Right Hippies (Rippies?) follow radicalism, Luddism, anti-science stance, street theatre (or more like broadcast theater), and dropping out (a 60s hippie term). I would add another indicator to their list: The homeschooling movement, which also encourages families to dropout from the public education system. Finally, a favorite book of the rippies is Saul Alinsky’s Rules for Radicals. In October, 2008 an analysis by V. Krebs of Amazon book recommendations, where customers who bought book A, also bought book B, showed that Rules for Radicals was highly correlated with the purchase of other conservative books. The tea partiers are the hippies of our time. True, they tend to be relatively affluent — but so were the hippies. As Tony Hendra once told me, “You had to have a lot of money to take part in the Summer of Love.”"
