["https://kk.org/extrapolations/category/health"]
title = "Extrapolations: health"
full_description = "Market Scope is a research firm that collects data on LASIK procedure rates, and seems to be the primary (if not the only) source for such data. I’ve found an 18-year dataset, 1996-2014 (the last two-years of which were forecast). I’ve contacted Market Scope to inquire if they have long-term forecasts as well. No US forecasts obtained yet. The best academic paper addressing refractive surgery forecasts (in China) suggests that procedure rates are fairly stable in the US. Src: Dan Lindfield and Tom Poole. 2013 February. “Nd:YAG Treatment of Epithelial Ingrowth.” Cataract & Refractive Surgery Today Europe. Citing Market Scope. Number of LASIK (laser-assisted in situ keratomileusis) surgeries in the United States from 1996 to 2014 (in 1,000s). Src: Market Scope via Statista (source inferred via other sources quoting the same numbers and attributing to Market Scope. Statista hides their name behind a paywall) In 2012 U.S. procedure volumes were approximately 700,000 procedures per year. The average price point of $1500 per eye in the United States factors to a total U.S. market size of $1.05 Billion / Year. The model for potential market growth is based on the observation that the laser refractive surgery market in the United States demonstrated saturation at approximately 2.7% penetration, and showed a baseline volume at approximately 1.2% penetration. In this context, market penetration is defined as annual procedure volume compared to the potential candidate pool. Potential U.S. Candidate Pool = Overall Population (310 Million People) x Patients in Treatable Age Group of 18 to 45 Years (36.5%) x Patients with Treatable Refractive Errors (50%) x Patients with Adequate Disposable Income (50%) EQUATION 1: General estimate of United States candidate pool for laser refractive surgery. The result calculates to 28.3 million people. Laser refractive surgery volumes in the United States grew steadily to peak in 2000 at about 1.5 million procedures (eyes). Volume declined during the economic downturn that began in Q4 2001 and rebounded slightly from 2003 through 2007. The U.S. market has not recovered following the macroeconomic downturn of 2008. It stood at approximately 700,000 procedures in 2012. [Citing Market Scope figures given above.]"
