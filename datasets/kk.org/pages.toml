["https://kk.org/home"]
title = "Kevin Kelly – Over the long term, the future is decided by optimists"
description = """
About



YEAR 2025 — 



My project for this year is to outline a scenario for the next 100 years that is full of AI, genetic engineering, constant monitoring, and all the rest – and is a world that I want to live in. I called it the Desirable 100-year Future. I don’t think it is a book; maybe a database, or virtual world, or video. It will probably start as a talk.



Recently I wrote down 450 bits of of advice I wished I had known earlier to share with my children. Each one is like a tweet — a wisdom tweet. Two years ago I put them into a pocket-sized book, called Excellent Advice for Living. 



I am extremely optimistic about the future – despite reading the news. I give my reasons why we should be optimistic in this 12-minute TED talk. I also outline other reasons to be optimistic and why I think the next two decades will be a global boom in this short essay.



My title for Wired is Senior Maverick, a magazine I helped co-found 32 years ago. I occasionally write an article for Wired, but I have no duties there. My most recent article, Picture Limitless Creativity, concerns the rapidly emerging world of AI image generators, and makes the case they are truly creative.



I frequently give presentations and interviews about my life and work and the consequences of technology.








Biography



Contact



Portraits



Disclosure"""
full_description = "About YEAR 2025 — My project for this year is to outline a scenario for the next 100 years that is full of AI, genetic engineering, constant monitoring, and all the rest – and is a world that I want to live in. I called it the Desirable 100-year Future. I don’t think it is a book; maybe a database, or virtual world, or video. It will probably start as a talk. Recently I wrote down 450 bits of of advice I wished I had known earlier to share with my children. Each one is like a tweet — a wisdom tweet. Two years ago I put them into a pocket-sized book, called Excellent Advice for Living. I am extremely optimistic about the future – despite reading the news. I give my reasons why we should be optimistic in this 12-minute TED talk. I also outline other reasons to be optimistic and why I think the next two decades will be a global boom in this short essay. My title for Wired is Senior Maverick, a magazine I helped co-found 32 years ago. I occasionally write an article for Wired, but I have no duties there. My most recent article, Picture Limitless Creativity, concerns the rapidly emerging world of AI image generators, and makes the case they are truly creative. I frequently give presentations and interviews about my life and work and the consequences of technology. Biography Contact Portraits Disclosure Futurism Video is the future of learning. Future of X is a series of 36 lectures on the future that I produced on YouTube for China Mobile, where X equals anything from flying cars to genetic engineering. I write in order to think. I often begin thinking with a post written on my blog, The Technium. I cover technology and conceptual news, and I also post a weekly summary of the interesting things I read that week. My most recent book, The Inevitable, was a New York Times bestseller, and is available in multiple languages. Books Articles Presentations Interviews Cool Tools Five years ago I started a free weekly newsletter, called Recomendo, which delivers 6 very short recommendations each week on Sunday morning. Over 53,000 subscribers get recommendations of great tools, fabulous apps, cool stuff we are watching or listening to, and amazing tips. It has one of the highest open rates of any newsletter in the world. About 20 years ago I launched the website Cool Tools, to review one tool daily. It’s still going strong with one fan review of a cool tool you didn’t know about every day. Some years ago I collected the best tools into a large, oversized, 500-page Whole Earth Catalog-inspired book on paper. The paper book is out of print (used copies can be found) but there is now a downloadable PDF version available. Every week on the Cool Tools podcast I interview someone remarkable and ask them to share their favorite tools. Past episodes are available. We will be migrating to video soon. TRY is a YouTube channel about how I make complicated projects, such as a toy bridge, or a flower press, or an ecosphere. Subscribe to Recomendo Listen to Cool Tools"
