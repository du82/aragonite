 Tools’ Interview by Nick Bilton, Bits, December 10, 2013 Gweek 117: The Whole Earth Catalog for this Century Interview by Mark Frauenfelder, Boing Boing, Oct. 23, 2013 Presentations “Cool Tools for the Maker,” Bay Area Maker Faire 2014 Praise for previous editions of Cool Tools “Cool Tools is what the Whole Earth Catalog always wanted to be.” — Peter Schwartz, futurist, Salesforce “Stewart Brand said that Cool Tools had captured the spirit of the Whole Earth Catalog but without taking on a counterculture and back-to-the-land philosophy. ‘It proves that you can restart the essence of something,’ he said.” — John Markoff, New York Times “Cool Tools is a refreshing antidote to the hype that surrounds the latest hot gadgets. Unimpressed by newness for newness’ sake, Kelly is attracted to objects that have withstood the test of time — and is passing those ideas on to others. It’s a habit he learned while editing and publishing the Whole Earth Catalog, the bible of counterculture do-it-yourselfers who wanted in ‘tools and ideas for the 21st century.'” — Leander Kahney, Wired News “Jeff Bezos is a fan of e-mail newsletters such as Cool Tools, a compendium of technology tips and product reviews written by Kevin Kelly, a co-founder of Wired.” — Brad Stone, author of The Everything Store: Jeff Bezos and the Age of Amazon “Best of the Web” lists Forbes Best of the Web DirectoryAlltop – GadgetsNew York Times Blogs 101 – Technology Toys & Cool Things"
