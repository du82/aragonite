["https://kk.org/thetechnium/overcoming-bias-against-bigness"]
title = "The Technium: Overcoming Bias Against Bigness"
description = "A generation ago a very popular book among progressives was E.F. Schumacher’s Small Is Beautiful. The 1973 book eloquently argued for “small”, that is, human scale things, and railed against big institutions, big systems, big solutions. This small book was … Continue reading →"
full_description = "A generation ago a very popular book among progressives was E.F. Schumacher’s Small Is Beautiful. The 1973 book eloquently argued for “small”, that is, human scale things, and railed against big institutions, big systems, big solutions. This small book was a rousing sermon for anti-bigness, but it was not alone. Fifty years ago anti-bigness was not a fringe sentiment. It was the emerging consensus. Young people on the left were suspicious of big systems like capitalism, the military, the education system, and of course big business. Over time progressives became very wary of big stuff, and today the left of any age is completely allergic to any large scale solution, particularly ones that involve big technology. In fact today, the left holds big tech as public domestic enemy #1. At the same time, conservatives began to question bigness, particularly big government, and big non-profits. In their view the public domestic enemy #1 was the official US government, primarily because it was big. Traditionally conservatives have backed big business, but today as those big business lean more liberal, they find lots to dislike about them too. They will consider breaking up big business primarily because they are big (and liberal). Paradoxically, the prime issue among progressives in this era is climate change. Climate is big. Climate problems are huge, and fixing climate change requires really big solutions. But if you are allergic to bigness, then your solutions can’t be big. That is why most progressives don’t champion big systems solutions for climate, such a geo-engineering. In their view the remedies all come down to individuals changing their personal behavior — recycling, reducing consumption: We can only change the climate by summing up a billion changes in individual virtue. With the same logic many other seemingly big problems are reduced to individual good behavior as well, and not just by progressives. Conservatives preach that any social problem (abortion, crime, poverty) can (and must) be solved by individual virtue and responsibility. There can be no big systems solution. All kind of other social issues such as housing, transportation, education, likewise come down to personal responsibility and “family values” rather than big systems."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/overcoming-bias-against-bigness"
