full_description = "The other day I was slicing a big loaf of dark Italian bread; it is a pleasure of mine to carve thick hunks of hearty bread to ready for the toaster. While I was happily slicing the loaf, the all-American phrase “the best thing since sliced bread” popped into my head. So I started wondering, what was the problem that pre-sliced bread solved? Why was sliced bread considered so great? Shouldn’t the phrase be something like “the best thing since penicillin”, or something like that? What is so great about this thing we now take for granted? My thoughts cascaded down a sequence of notions about sliced bread. It is one of those ubiquitous things we don’t think about."
