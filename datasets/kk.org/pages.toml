["https://kk.org/streetuse"]
title = "Street Use"
full_description = 'This site features the ways in which people modify and re-create technology. Herein a collection of personal modifications, folk innovations, street customization, ad hoc alterations, wear-patterns, home-made versions and indigenous ingenuity. In short -- stuff as it is actually used, and not how its creators planned on it being used. As William Gibson said, "The street finds its own uses for things." I welcome suggestions of links, and contributions from others to include in this compendium. -- KK Street bikes from Panama. They are called priti baiks. The term priti means both “pretty” and also ingenious, or striking. The photographs are taken by Jose Castrellon, who spent time hanging around this subculture of hot rodders. Except these guys are too poor to own a car so they soup up their bikes. Note the air horns, normally found on trucks. His web site says, “Priti Baiks is a series of portraits of men who display tons of creative ingenuity and dedicated a good amount of their meager resources to decorate and equip their humble bicycles.” In much of the developing world, bike technology is significant mobile technology. Bikes are transportation, and offices and shops and stores. The folks at Velowala — velo for “moving” as in velocity and wala for “man” as in the Hindi — collect examples of people using bicycle technology on the streets of India. This wala sells churan, tangy snacks and digestive pills. Many more examples here. Nice piece in the New York Times about a Czech photographer who worked in the 60s and 70s using homemade cameras, one of them shown here. They are a wonderful example of street use. The Times said, “he fashioned them from shoeboxes, toilet-paper rolls and plexiglass, polishing the lenses with toothpaste and cigarette ash.” The guy was a bit of a pervert. He took low-res images of pretty girls on the street, in cafes, and on buses. “His photographs may look naïve, but they’re the product of a carefully orchestrated series of missteps that begins with crude, homemade cameras. As he says in the film, “If you want to be famous, you must do something more badly than anybody in the entire world.”” Still, his cameras are cool.'
author = "Kevin Kelly"
year_published = 2025
