["https://kk.org/streetuse/2008/04"]
title = "Street Use: 2008 : April"
full_description = "What do you do if you have a locked gate but more than one person is permitted to open it? You don’t want multiple keys, in case one is lost/stolen. Then all the keys may need replacing. Instead you can have multiple locks, chained into one long lock. Open any lock to open the gate. This way each person needs to manage their key (and lock). I’ve seen various installations on this solution in different parks in the Bay Area. The students at Eindhoven University of Technology in the Netherlands created a 2.5 metric ton bike bus that has 32 seats. Each rider can pedal. From S. Fridqvist. I’ve lost track of where I found this, but these chimneys look like a last-minute idea. No clue on why they need so many. Perhaps it is a community kitchen? Apparently the norm in South Korea is to post your cell number in the window of your parked car, since in all probability, your car is blocking someone else’s. They will need to call you to move your car. Used to be the numbers were scribbled notes. But Younghee Jung has noticed recently that the practice is becoming formal, and now the numbers get fancy print stickers. The numbers in his photos below are scrambled (by him) at the end. …putting owner’s mobile number printed on the front window seems to be on its way to become a norm for car owners in korea. and often its not a scribbled note anymore. the parking convention in korean cities does require leaving the contact information on the car, as people may have no alternative in resting your car without blocking other cars’ exit route, for instance."
