["https://kk.org/ct2/2007/09/my-life-countdown-1.php"]
title = "ct2: My Life Countdown"
description = "When I was about 29 years old I got a spiritual  “assignment” on an Easter morning in the old city of Jerusalem. According to this assignment my job was to live as if I had only 6 months left to … Continue reading →"
full_description = "When I was about 29 years old I got a spiritual “assignment” on an Easter morning in the old city of Jerusalem. According to this assignment my job was to live as if I had only 6 months left to live. I was in perfect health and in the middle of a ten-year round the world trip, so this interruption was unexpected and strange. I’ve told the full story of that curious mission on the very first episode of This American Life, the public radio storytelling hit, 10 years ago, so I won’t go into further detail because you can hear my account on this streaming audio file from the NPR site. The short version is that what I decided to do in my last 6 months surprised me, and that living with only 180 days in front of me turned out to be harder than I thought. But I did live with a very conscious countdown toward the final day; I remember that last day very well. I am now 55 years old. Like a lot of people in middle age my late-night thoughts bend to contemplations about how short my remaining time is. Even with increasing longevity there is not enough time to do all that I want. Nowhere close. My friend Stewart Brand, who is now 69, has been arranging his life in blocks of 5 years. Five years is what he says any project worth doing will take. From moment of inception to the last good-riddance, a book, a campaign, a new job, a start-up will take 5 years to play through. So, he asks himself, how many 5 years do I have left? He can count them on one hand even if he is lucky. So this clarifies his choices. If he has less than 5 big things he can do, what will they be? Another friend, a musician, told me about a recurring dream he had in which he could see the exact number of days left in his life. His days were numbered, literally. He recounted how invigorating this knowledge was, because while he could never be certain that number was true, it did help him prioritize his choices and defuse his procrastinations. I decided to take the idea of number days seriously, and to revisit my earlier experience of counting down my remaining time on this lovely mortal plane. My hope was that a reckoning of my numbered days would help me account for how I spend each precious 24 hours, and to focus my attention and energy on those few tasks and projects I deem most important to me. Indeed, it might help me decide which ones are most important, which is the harder assignment."
