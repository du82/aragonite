["https://kk.org/extrapolations/100-internet-penetration"]
title = "Extrapolations: 100% Internet Penetration"
full_description = "eMarketer publishes a ~5-year forecast of internet penetration every year. It’s most recent publicly accessible forecast showed a downward revision from the previous year’s forecast. The International Telecommunications Union tracks internet users as a percentage of the global population. Historic data is available back to the mid 1990s. However, when eMarketer’s most recent forecast figures are added, the trendline wiggles. The same type of trendline (2nd order polynomial) then delays saturation until 2040. Adjusting the trendline type (to a 5th order polynomial) gives a better R-squared value, and again brings saturation back to ~2030. src: International Telecommunications Union, 2017 “Global ICT developments, 2001-2017*” [XLS file] Here’s a tidy chart, showing data points, of basically the same data (1997-2017) aggregated at Wikipedia, with separate lines for global, developed world, and developing world: Newsweek projection of when the number of active Facebook users will equal the current (2017) population of the world (7.6B) — 2048 Newsweek’s fine print: The forecast has been calculated only using the annual figures provided by Facebook’s reports since 2004, and does not take into consideration technological progress or demographic changes. CC’s NOTE: In 2048, the UN medium fertility variant projection for world population is 9.7 billion. At 7.6 billion users, that would be about 78% of the projected 2048 population. That would be a big jump from the 26% of global population FB users accounted for in 2017, but still not literally everyone."
