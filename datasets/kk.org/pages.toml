["https://kk.org/thetechnium/101-additional-advices"]
title = "The Technium: 101 Additional Advices"
description = "Six years ago I celebrated my 68th birthday by gifting my children 68 bits of advice I wished I had gotten when I was their age. Every birthday after that I added more bits of advice for them until I … Continue reading →"
full_description = "Six years ago I celebrated my 68th birthday by gifting my children 68 bits of advice I wished I had gotten when I was their age. Every birthday after that I added more bits of advice for them until I had a whole book of bits. That book was published a year ago as Excellent Advice for Living, which many people tell me they read very slowly, just one bit per day. In a few days I will turn 73, so again on my birthday, I offer an additional set of 101 bits of advice I wished I had known earlier. None of these appear in the book; they are all new. If you enjoy these, or find they resonate with your own experience, there are 460 more bits in my Excellent Advice book, all neatly bound between hard covers, in a handy size, ready to gift to a person younger than yourself. – KK • Forget trying to decide what your life’s destiny is. That’s too grand. Instead, just figure out what you should do in the next 2 years. • Aim to be effective, but unpredictable. That is, you want to act in a way that AIs have trouble modeling or imitating. That makes you irreplaceable. • Don’t save up the good stuff (fancy wine, or china) for that rare occasion that will never happen; instead use them whenever you can. • Never hesitate to invest in yourself—to pay for a class, a course, a new skill. These modest expenditures pay outsized dividends. • Read a lot of history so you can understand how weird the past was; that way you will be comfortable with how weird the future will be. • Interview your parents while they are still alive. Keep asking questions while you record. You’ll learn amazing things. Or hire someone to make their story into an oral history, or documentary, or book. This will be a tremendous gift to them and to your family. • If you think someone is normal, you don’t know them very well. Normalcy is a fiction. Your job is to discover their weird genius. • When shopping for anything physical (souvenirs, furniture, books, tools, shoes, equipment), ask yourself: where will this go? Don’t buy it unless there is a place it can live. Something may need to leave in order for something else to come in."
