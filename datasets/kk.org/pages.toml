["https://kk.org/thetechnium/50-years-of-travel-tips"]
title = "The Technium: 50 Years of Travel Tips"
description = "I’ve been seriously traveling for more than 50 years, and I’ve learned a lot. I’ve traveled solo, and I’ve led a tour group of 40 friends. I’ve slept in dormitories and I’ve stayed in presidential suites with a butler. I’ve … Continue reading →"
full_description = "I’ve traveled solo, and I’ve led a tour group of 40 friends. I’ve slept in dormitories and I’ve stayed in presidential suites with a butler. I’ve hitchhiked penniless for months, and I’ve flown by private jet. I’ve traveled months with siblings, and with total strangers. I’ve gone by slow boat and I’ve ridden my bicycle across America, twice. I’ve been to the largest gathering of humans on the planet, and trekked into remotest areas on the planet on my own. I’ve paid for luxury tours, and I’ve done my own self-guided tours. I regularly travel for business, and once I went to Hawaii on a door-prize award. I’ve circumnavigated the globe in only 48 hours, and I traveled uninterrupted for 9 months. I’ve gone first class and third class, sometimes on the same trip. So far I’ve visited half the world’s countries, and usually manage to get far from the capital city when I do. Here is what I know about how to travel. There are two modes of travel; retreat or engage. People often travel to escape the routines of work, to recharge, relax, reinvigorate, and replenish themselves— R&R. In this mode you travel to remove yourself from your routines, or to get the pampering and attention you don’t ordinarily get, and ideally to do fun things instead of work things. So you travel to where it is easy. This is called a vacation, or R&R. The other mode is engagement and experience, or E&E. In this mode you travel to discover new things, to have new experiences, to lean into an adventure whose outcome is not certain, to meet otherness. You move to find yourself by encountering pleasures and challenges you don’t encounter at home. This kind of travel is a type of learning, and of the two modes, it is the one I favor in these tips. Organize your travel around passions instead of destinations. An itinerary based on obscure cheeses, or naval history, or dinosaur digs, or jazz joints will lead to far more adventures, and memorable times than a grand tour of famous places. It doesn’t even have to be your passions; it could be a friend’s, family member’s, or even one you’ve read about. The point is to get away from the expected into the unexpected."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/50-years-of-travel-tips"
