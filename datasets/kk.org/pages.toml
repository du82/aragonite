["https://kk.org/thetechnium/the-missing-monuments-of-silicon-valley"]
title = "The Technium: The Missing Monuments of Silicon Valley"
description = "Today I got a great question from author Joel Dietz, who asked me, “I’m curious why you think California tech culture has never left a legacy of monumental artifacts? The only thing notable in the region is the Stanford mausoleum;  … Continue reading →"
full_description = "Today I got a great question from author Joel Dietz, who asked me, “I’m curious why you think California tech culture has never left a legacy of monumental artifacts? The only thing notable in the region is the Stanford mausoleum; compare this to any previous epoch of human civilization, including the Carnegie-Rockefeller era.” That is a great question. There are many assumptions behind the question, and I tend to also assume them. The first assumption is that there is a Silicon Valley tech culture. Wired magazine began 30 years with the unconventional premise that this tech culture was beginning to be born, and that it would eventually become dominant. At that time in the early 1990s, it was hard to see this culture and it was definitely not mainstream. I define this culture by its eagerness to explore the world, and to investigate the human condition, by making things. It would investigate our mind not by the science of cognition nor art and literature, but by making artifical minds. What you can’t make, you can’t understand or tame. This culture also saw the world in terms of making solutions. The humanities were the first culture, and the sciences were the second culture; I called this the nerd, and third culture. Part of Wired’s agenda was to make nerds cool, to both create and celebrate the celebrities of this emerging culture. We would make heroes from the geeks, and put them on the front cover. The transformation of someone like Bill Gates from a geek who was constantly ridiculed to someone who will probably be remembered for his philanthropy and not Windows, is very much in the mold of a Carnegie, and one indication that there is indeed, finally, a tech culture. And that culture has its core in California, and its anchor in Silicon Valley, but it has outposts along the whole west coast and in places like Austin, TX. So this nerd culture can blossom beyond the borders of routes 101 and 280, but much continues to be born within the Valley. The second assumption is that cultures need to build infrastructure. In some ways this is one of the definitions of civilization: the accumulation of infrastructure. There are civilizations in our deep past, like the ones that native American peoples built, whose infrastructure was not made in stone, and so their contributions have been erased, as those people were erased. But on average, remaking the environment to increase options is what civilizations do, and that means they tend to build, and often build big."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/the-missing-monuments-of-silicon-valley"
