["https://kk.org/extrapolations/esports-industry-evolution"]
title = "Extrapolations: Esports industry evolution"
full_description = "Gamelab Barcelona 2017 – Mike Sepso – Shaping eSports right YouTube Mike Sepso is Senior Vice President of Activision Blizzard where he runs Media Networks, a division devoted to creating the best esports experiences for fans across games, platforms and geographies. Prior to joining Activision Blizzard, Mike was the co-founder and president of Major League Gaming (MLG), a global leader in esports, focusing on strategy, key partnerships, corporate development and overseeing all product and technology development, including the launch of MLG.TV. In his conversation with Dot Esports journalist Thiemo Bräutigan, Mike goes through Activision Blizzard’s Esports strategy for the comming years, and comments on the latest news around the Overwatch Global League. “Esports: Big Buzz or Big Business?” Hashtag Sports, June 2017 YouTube Leading executives from the world of sports business, consumer brands, media and technology engage in a lively debate on whether the industry will deliver on its $1bn promise or, as some predict, will prove to be a false dawn for the sector and its investors. A panel of experts will discuss how the emergence of eSports as a global mainstream phenomenon is driving their own strategies, be it as a marketing vehicle or an investment prospect, while also dissecting the argument of those who doubt the long-term commercial value of the eSports ecosystem. “Booming business of esports sets sights on conquering mainstream audiences” VentureBeat, February 12, 2018 “League of Lawyers: Esports is creating a new class of white-collar jobs” VentureBeat, February 6, 2018 “The Esports Playbook” Nielsen launched an Esports division in August 2017. Their inaugural audience report includes a final chapter called “What’s Next” which talks about the future of esports on linear TV, as well as the future for VR/AR esports. “The who, what and why of the World Esports Association” Polygon, May 2016 Discussion of the formation of the World Esports Association, a league representing competitions organized by ESL (a tournament organizer), and focused only on one game (Counter-Strike: Global Offensive) at the time of launch. One of the goals of the organization is to further professionalized esports by introducing player representation, standardized regulations, and revenue sharing for teams."
