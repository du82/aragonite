["https://kk.org/thetechnium/god-the-superposition"]
title = "The Technium: God, the Superposition"
description = "I find any version about the origins of the cosmos to be implausible and unsatisfactory.  The modern scientific view is that the universe began without any creator, it just sort of emerged from nothing by itself. Or it was hatched … Continue reading →"
full_description = "The modern scientific view is that the universe began without any creator, it just sort of emerged from nothing by itself. Or it was hatched from a prior universe. Or perhaps the rules of the universe created themselves and then myriad multiverses running on those rules compete to evolve the best universe to birth consciousness. Or the cosmos could be some grand simulation running on computers somewhere, created once upon a time. What made the simulation? Alternatively, God made the universe (or the simulation). God started it with a big bang and is letting it unfold in its glories. But then the origins of God are likewise unsatisfactory. Even allowing its origins to be outside of time – time being something that is created – the story does not make sense. What was “before” God, if there was no such thing as time before? Maybe nothing has an origin and everything always was. If there is no such thing as an origin —then what is the source of the immense scale and brilliance of everything in the universe? No matter where we start, we end up with the same illogical notion that there was something that always was, before time, and that everything we understand to be vast and huge and deep was self created from nothing in some way. God, not-God, both are riddled with the same unsatisfying paradoxes. My current definition of God is: that which is absolutely self-created, with no antecedents, no dependencies, no priors. Might be the universe itself, or might be a personality in the sky. I like to think of God – the self-created core of the cosmos – as a superposition. A superposition is a concept in quantum physics which states that light can be both a wave and a particle, both off and on, present or absent at the same time. A cat can be both dead and alive, and you only notice the difference once you observe it. God/not-God is true at once, and the superposition is only settled once you choose which one to see. But the paradox of the origin of our universe is only the beginning. The things that we believe are most important in this reality, such as consciousness, free will, and life – all defy common logic. This is not a matter of insufficient knowledge. It is that they don’t make sense because their causation is circular. The more we know about the fundamental structure of the universe, and our minds, and our consciousness, the clearer it is that these things strangely loop back upon themselves like a snake swallowing its tail. Self-causation is illogical because causation itself is illogical. What happened before there was time? What is before the before? What is bigger: something or nothing? How can free will exist in a lawful universe? These are inherent riddles resting upon paradoxes."
author = "Kevin Kelly"
year_published = 2025
