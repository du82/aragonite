full_description = "Nice piece in the New York Times about a Czech photographer who worked in the 60s and 70s using homemade cameras, one of them shown here. They are a wonderful example of street use. The Times said, “he fashioned them from shoeboxes, toilet-paper rolls and plexiglass, polishing the lenses with toothpaste and cigarette ash.” The guy was a bit of a pervert. He took low-res images of pretty girls on the street, in cafes, and on buses. “His photographs may look naïve, but they’re the product of a carefully orchestrated series of missteps that begins with crude, homemade cameras. As he says in the film, “If you want to be famous, you must do something more badly than anybody in the entire world.”” Still, his cameras are cool."
