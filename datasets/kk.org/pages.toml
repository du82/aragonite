["https://kk.org/extrapolations/category/appearance"]
title = "Extrapolations: appearance"
full_description = "Smart clothing seems to be just around the corner, with several companies already selling specialty items (athletic wear, baby clothes, etc) embedded with sensors. However, quantitative forecasts describing the prevalence of smart clothing in the next 10 years or so are hard to find. Gartner made a forecast to 2016 back in 2014. Tractica has a forecast to 2020. Both forecasts describe millions of units shipped worldwide. Although it’s difficult to extrapolate market penetration, both reports suggest that smart clothing will be more prevalent than wearable devices. Other research firms and analysts are skeptical of such a swift uptake by smart garments, instead forecasting dominance by other wearable devices. Tractica forecasts that smart clothing shipments will grow from 140,000 units in 2013 to 10.2 million units by 2020, while body sensor shipments will decrease from 3.0 million units in 2013 to 1.2 million by 2017, before rising again to 3.1 million units in 2020. Src: Tractica. May 4, 2015. “The Wearable Devices Market is Poised for Expansion into Smart Clothing and Body Sensors.” Executive Summary Chart from above report: [via Global Information] Src: Gartner. November 18, 2014. “Gartner Says in 2015, 50 Percent of People Considering Buying a Smart Wristband Will Choose a Smartwatch Instead.” Note: Angela McIntyre, Gartner research director – gave an interview to The Guardian. Might be available for comment. Growth will be “largely driven by the sales of wrist-based trackers, while hundreds of thousands of connected garments used by professional sports teams showcase wearable technology’s most advanced capabilities.” Hundreds of thousands of thousands of connected garments is hardly a drop in the ocean compared to the millions of Fitbits, Xiaomis, Apple Watches, Jawbones and other devices which will be coining in the revenue by 2020. [emphasis mine] Src: James Stables. November 18, 2015. “Juniper Report Skeptical on Smart Clothing but Says Fitness Trackers are Set to Soar.” Wearable.com."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/extrapolations/category/appearance"
