full_description = "Books New Rules for the New Economy BUY ON AMAZON All stores Amazon Barnes & Noble iBooks Books-A-Million Powell’s IndieBound Summary The thesis of New Rules for the New Economy is that we are now living in an economy based on ideas and communication rather than energy and atoms. Further, this “new” economy has distinct laws or rules so it behaves differently than the previous industrial economy. To do well in the new regime, we need to grasp the new dynamics of information. I reduce the emerging principles to 10 guidelines, and suggest a few strategies for businesses based on each principle. Read New Rules for the New Economy online Praise for New Rules for the New Economy “I loved Kevin Kelly’s ‘New Rules’ article in Wired and prayed for a book-length version. here it is–and it’s a gem. Very short and very sweet, with provocation on every page. Chapter 10 by itself is worth the price of admission many times over.”— Tom Peters “In this short, trenchant book, Kelly explains how the networked economy is turning old economics upside down.”— Time “A shock to the system… Kelly’s elegant description of the new economy may one day rank it alongside The Organization Man as the book that defined an economic era.”— The Wall Street Journal Reviews Five BooksSeth Godin, 2019 USA TodayKevin Maney, Nov. 23, 1999 USA TodaySam Vincent Meddis, Nov. 16, 1998 Salon.comR.U. Sirius, 1998 Wired MagazineMichael Schrage, February 1999 Spike MagazineChris Mitchell Buck’s RestaurantMay 2000 Journal of Internet Banking and CommerceWalter A. Effross, 1998 Business WeekMichael J. Mandel, no. 3600 (Oct. 19 ’98) p. 22+ Other Editions 1998, PaperbackViking, New YorkISBN-10: 014028060XISBN-13: 9780140280609Available from Amazon New Rules for the New Economy1998, HardcoverViking, New YorkISBN-10: 0670881112ISBN-13: 9780670881116Available from Amazon New Rules for the New EconomyPrint MagazineWired, 1997, vol. 5, no. 9Available from Wired 2003, HTMLWhole book in web format 2009, 