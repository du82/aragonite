["https://kk.org/streetuse/2006/08"]
title = "Street Use: 2006 : August"
full_description = "The Payphone Project collects stories, pictures and phone numbers of pay phones from around the world. Payphone on Lake Victoria in Uganda using GSM Technology and Solar Power. Photo sent in by Craig Wheeler, Remkor Technologies South Africa. This guy has discovered several important facts. 1) If you wrap anything in cheap packaging tape, it is almost indestructible. And 2) Matching luggage makes you look very chic. This fellow, photographed in Manhattan by Street Use reader Michael Krakovskiy, accomplishes both goals at once. He’s made his own extremely useful matching luggage from cardboard and tape. In the USSR and Eastern Europe in the 1950s underground night spots would play music pirated from the west. The only media they had were recorders etched into discarded X-ray film. I’ve long sought some images. Researcher Camille Cloutier pointed me to these, collected and posted by József Hajdú. Here’s what he says about them: During the late 1930s and early 1940s the prevalent sound recording apparatus was the wax disk cutter. As a consequence of the lack of materials in the war-time economy, some inventive sound hunters made their own experiments with new materials within their reach. I do not know the name of the inventor who first utilized discarded medical X-ray film as the base material for new record discs; however, the method became so widespread in Hungary that not only amateurs, but the Hungarian Radio made sound recordings on such recycled X-ray films. I felt that those X-ray record albums relate to our contemporary lives in many ways, especially when considering such terms as ‘multimedia’ or ‘recycling’. I copied the X-ray films with their engraved sound-grooves on photosensitive paper and made enlargements of certain details. I was quite lucky to find a considerable amount of similar sound records in private collections. These are also interesting from the visual aspect. By utilizing different photographic processes, I created from them pictures meant to be exhibited in galleries."
author = "Kevin Kelly"
year_published = 2025
