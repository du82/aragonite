["https://kk.org/thetechnium/art-as-an-excuse"]
title = "The Technium: Art As an Excuse"
description = "Humans are born to make stuff. We almost can’t help it. Place us in an empty flat plain and we’ll start building things. Put us on a dried lake bed in the middle of the desert and we’ll build things, take them down … Continue reading →"
full_description = "Humans are born to make stuff. We almost can’t help it. Place us in an empty flat plain and we’ll start building things. Put us on a dried lake bed in the middle of the desert and we’ll build things, take them down and build different stuff next year. We make tools, which make other tools, which can make big stuff, like cities and skyscrapers, and shiny things like space stations and mobile phones. We turn wildernesses into gardens and into farms by inventing devices and breeding plants. And then we make a lot of stuff that seems to have no function other than we like to make it, or like to see it, and like to know about it. That is called Art. What all art has in common is that it is made. Art is created. It is easily understood as a painting on a wall, or a clay sculpture, or a gold necklace. We can touch and keep the art object. In modern times we’ve learned that art can be intangible. It is still created, but it may not be easy to touch or keep. Music was an early intangible form of art; so were dance performances. But if a poetry reading could be created art, maybe any kind of performance could be art. As we got used to performance art, we might see any complicated creation to be art. Today one could say that a billionaire’s project to send 8 people to Mars might be seen as an art project. All art is created but so are tools, and food, and shelters and clothing. We’d call only some faction of those made things — whether tangible or intangible — art. There are some buildings we might call art, and some we would not. Very practical devices that we didn’t call art when bought at a store (like a radio), might be displayed in an art museum later on, for its design. Some clothes might be described as art, while most others are not. What’s the difference? There is one school of art that says art is useless; that it has no function other than its own existence. If that is true, how can something manufactured with a specific practical function, like a hi-fi stereo, turn into art later? Is it because it is no longer practical? There is another school which says that art serves the function of prodding, of goading action, of demanding a response, of forcing the audience into action. So art does have a function."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/art-as-an-excuse"
