["https://kk.org/thetechnium/hill-making-vs-hill-climbing"]
title = "The Technium: Hill-Making vs Hill-Climbing"
description = "There are two modes of learning, two paths to improvement. One is to relentlessly, deliberately improve what you can do already, by trying to perfect your process. Focus on optimizing what works. The other way is to create new areas … Continue reading →"
full_description = "There are two modes of learning, two paths to improvement. One is to relentlessly, deliberately improve what you can do already, by trying to perfect your process. Focus on optimizing what works. The other way is to create new areas that can be exploited and perfected. Explore regions that are suboptimal with a hope you can make them work – and sometimes they will – giving you new territory to work in. Most attempts to get better are a mix of these methods, but in their extremes these two functions – exploit and explore – operate in different ways, and require different strategies. The first mode, exploiting and perfecting, rewards efficiency and optimization. It has diminishing returns, becoming more difficult as fitness and perfection is increased. But it is reliable and low risk. The second mode, exploring and creating, on the other hand, is highly uncertain, with high risks, yet there is less competition in this mode and the yields by this approach are, in theory, unlimited. This trade off between exploiting and exploring is present in all domains, from the personal to the biggest systems. Balancing the desire to improve your own skills versus being less productive while you learn new skills is one example at the personal level. The tradeoff between investing heavily in optimizing your production methods instead of investing in new technology that will obsolete your current methods is an example of that tradeoff at the systems level. This particular tradeoff in the corporate world is sometimes called the “innovator’s dilemma.” The more efficient and excellent a company becomes, the less it can afford to dabble in some new-fangled idea that is very likely to waste investments that can more profitably be used to maximize their strengths. Since statistically most new inventions will fail, and most experiments will not pan out, this reluctance for the unknown is valid. More importantly, if new methods do succeed, they will cannibalize the currently optimal products and processes. This dilemma makes it very hard to invest and explore new products, when it is far safer, more profitable, to optimize what already works. Toyota has spent many decades optimizing small efficient gasoline combustion engines; no one in the world is better. They are at the peak of gas car engines. Any money spent on investing into unproven alternative engines, such as electric motors, would reduce their profits. They would be devolving their expertise and becoming less excellent. They cannot afford to be less profitable."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/hill-making-vs-hill-climbing"
