["https://kk.org/streetuse/2006/09"]
title = "Street Use: 2006 : September"
full_description = "This stunning gallery of improvised household objects from the Soviet Union. Many are utilitarian, but many others are decorative, toys, or personal artistic expressions. These were all collected by a young Russian, Vladimir Archipov. His found objects were produced in the last twenty years and were made in Russia at a time when manufactured items were very hard to get, yet the aspirations for them were growing. The collection began when Archipov found a coat-rack made by his grandfather out of heated and bent toothbrushes. He then saw for the first time the true nature of handmade objects and their lovely beauty. He started collecting stuff from his relatives and friends and then friends of friends. He writes: “There are over a thousand items in my collection today, and they all have three characteristics in common; functionality, a visual uniqueness and the testimony of the author, who is both the creator and the user. They represent an astonishing part of modern folk material culture, but unfortunately, are under the constant threat of ruin, because I do not have the means at my disposal for their proper storage. I have never once, in the eleven years I’ve been collecting them, received any help, support, or even interest from the state.” The website is entirely in Russian, with broken links and a strange navigation scheme, and very little text. However there is an absolutely fabulous book based on Archipov’s collection called Home-Made: Contemporary Russian Folk Artifacts. It is a gorgeous book, a catalog of sorts, with several hundred marvealous objects showcased. Paired with each artifact is the story of how it was made as told by the maker. It is these stories that give a soul to each thing. I highly recommend the book for all street-users. Thanks to reader Michael Krakovskiy for bringing this incredible resource to my attention. We prepared this aerial according to the dimensions published in Radio magazine. But, you know, resonators are everything. THey were made form forks so that the reception would be better. In my opinion it all worked out very well. The effect was noticeable from the very start. Everyone particularly wanted to watch the programmes from Petersburg. My mother had the forks in her cupboard. She bought them when everything was collapsing around us. There wasn’t anything else but forks to buy in the shops then. They weren’t even very good forks, in the practical sense. But they went well with that aerial."
author = "Kevin Kelly"
year_published = 2025
