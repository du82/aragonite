["https://kk.org/streetuse/2006/10"]
title = "Street Use: 2006 : October"
full_description = "In contrast to the almost medieval instant photo process I featured from India, here is a modern update from Turkey. Reader Erik Fitzpatrick writes: My wife and I were in Turkey recently and while we were in the plaza in front of the Aya Sofya (Hagia Sofia) in Istanbul, I noticed this photo vendor. But instead of the old-fashioned kid-with-a-polaroid, this guy had a digital camera and a battery-powered photo printer! Jonathan Schreiber writes: Thought you might enjoy this bike-related street use that Justin found as we were walking from our offices to lunch in Sausalito (CA). A CHP Bike cop was getting a sandwich inside Golden Gate market. This what he used as his bike lock. I’m not sure who much these are actually used. They may be simply a design project. But they look plausible. In fact, I think I’ll make some for guests. You remove the spring from a wooden or plastic spring clothespin, and insert it between two chop sticks — perhaps with a little grove shaved on the chop stick shank. The result is a pair that is easy to use and requires no life-long skill to pick up grains of rice. Quick! A nifty way to store desk utensils without cluttering up the desktop. Make customizable holders with duck tape stuck to the bottom of your desktop. The idea and photos come from benrodian. His instructions: 1. make little duct tape slots for everything you need at your table or desk. (yes, that is a glow-in-the-dark Swiss Army knife) 2. stick everything to the underside of the desk. 3. now everything is right there but the top of your desk/table isn’t cluttered. As far as I can tell this is not a put-on, or hoax, but a legitimate innovation born of desperation. And I believe others have discovered the same solution. (I’m always surprised more people don’t use some kind of hands-free contraption.) If you know more about this particular picture (forwarded to me by Alexander Rose) please email me. Yeah, I’m on a vehicle mash-up jag these days. Here’s another road-warrior-worthy vehicle. Remember those pictures of Mad Max war trucks taken in Iraq by Defensfor Fortis? They were not the first to hack an armored vehichle. Here’s a snapshot of a jury-rigged tank made by GIs in Vietnam. This picture by Ralph Marchese was taken sometime in 1967, of the HHC 3rd/47th Infantry."
