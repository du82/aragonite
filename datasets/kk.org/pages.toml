full_description = "This collection of data includes the following indicators, dates, and sources: passports circulating, 1989-2015, Dept. of State passports issued, 1974-2015, Dept. of State licensed drivers, 1960-2014, Dept. of Transportation biometric ID usage rates in hospitals, 2008-2012, Raymonde Charles et al. voting rate, 1978-2014 & 1964-2014, Census Bureau voter registration, 1966-2014 & 1828-1956, Census Bureau & Congressional Quarterly Press people working in government, 2014/2024, BLS federal laws passed, 1973-2015 & 1947-2013, GovTrack & Brookings Inst. U.S. Passports Circulating (1989-2015) and Issued per Year (1974-2015) Note: As of 1996, passports issued statistics are tabulated for the fiscal year. Note: The Department of State has been issuing exclusively biometric/electronic passports since 2007. Here’s a map showing the state-by-state distribution of Americans with active passports, for the year 2013. The map is based on the State Department data given above for the number of passports issued in the last 10 years, divided by the total US population (per the Census Bureau, minus the ~12 million undocumented residents and ~13 million legal permanent residents who cannot obtain passports). The 2012 American National Election Survey asked survey respondents about what type of government-issued photo identification they possessed. The survey indicates that 6.3% of respondents do not have a valid, government-issued photo ID. Question: Do you have a non-expired Driver’s License? Variable name: dem3_driver Has: 83.9% Does not have: 15.4% Don’t know: 0% Refused: 0.6% Total number of respondents: 6,112 Question: Do you now have a non-expired U.S. passport, or do you not have one? Variable name: dem3_passport Has: 40.8% Does not have: 58.4% Don’t know: 0.2% Refused: 0.6% Total number of respondents: 5,914 Question: (If no valid driver’s license or passport) Do you have another form of non-expired, government issued photo ID, such as a state-issued ID or military ID? Variable name: dem3_govtid Has: 5.9% Does not have: 6.3% Inapplicable: 87.3% Don’t know: 0% Refused: 0.5% Total number of respondents: 5,914"
