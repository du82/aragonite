full_description = "The New York Times asked me (and others) to suggest some things our descendents might be embarrassed about in the future. Things we do now, that might make future generations cringe. Good question! My reply is this short list, which I may add to later as I think of them. Their full list was published here as Future Cringe on Jan 27, 2023. Having your first name decided by your parents will be as unfashionable as having them pick who you marry. In the far future, we’ll be embarrassed that people insisted to have their deceased bodies buried in the ground."
