["https://kk.org/streetuse/category/supreme-low-tech"]
title = "Street Use: Supreme Low Tech"
full_description = "Here’s one way to keep your chickens dry. Pete Betchik of Madison on the Lake, Ohio built a chicken shelter using found materials. “The frame is made from wooden pallets, the roof also is pallet wood. The sides are old steel shelves. The inside is lined with old pizza boxes, the nest box was once used to ship fresh fish to market, and the front door was an industrial clothes dryer front.” Streetside barbers are quite common in India, at least in the smaller towns. A hair cut can certainly wait for good weather. The tools are very portable. Note the cool adjustable head rest on the chairs. This set of pictures comes from Dark Roasted Blend. Spotted this homemade crab catcher in Bodega Bay, CA. A few milk crates, a couple laundry baskets and some rope! I’m not sure how it works. I think the baskets serve as flexible one-way portals to reach in to remove the crabs stuck in the crate. The crabs probably enter the one crate without a basket and travel to the other 5 via a connecting passage they can’t re-find, and so get stuck. Street Use’s Ambassador-at-Large, Todd Lapin, filed this report about street use in Thailand. The contents of this short video clip entitled Train Runs Through Bangkok Market is very hard to describe, but I can assure you it is worth watching. What is most surprising is the speed of recovery. Mr. Lappin writes: Mobile libraries carried on the backs of animals are not new. We covered camelbookmobiles. Here is one using mules in Venezuela as reported on the BBC . They are known as bibliomulas (book mules) and they are helping to spread the benefits of reading to people who are isolated from much of the world around them. The idea of loading mules with books and taking them into the mountain villages was started by the University of Momboy, a small institution that prides itself on its community-based initiatives and on doing far more than universities in Venezuela are required to do by law. Anyone who was not out working the fields – tending the celery that is the main crop here – was waiting for our arrival. The 23 children at the little school were very excited. “Bibilomu-u-u-u-las,” they shouted as the bags of books were unstrapped. They dived in eagerly, keen to grab the best titles and within minutes were being read to by Christina and Juana, two of the project leaders."
