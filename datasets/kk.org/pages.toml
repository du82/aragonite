title = "The Technium: Aliens Are Here on Earth"
description = "There is no Fermi paradox. The aliens are here, visiting Earth. The evidence is blurry, but in a case of Occam’s Razor, alien presence is by far the simplest logical explanation for the evidence we have of unidentified flying objects and … Continue reading →"
full_description = "The evidence is blurry, but in a case of Occam’s Razor, alien presence is by far the simplest logical explanation for the evidence we have of unidentified flying objects and close encounters of various kinds. I have never seen a ufo nor have I had any personal experience with aliens, but I would say that I have no doubts they are here. To me, if we take an unbiased look at all the evidence, it tends to point in one direction: we have visitors. Because there is no other explanation that generally fits what we observe. No where on Earth can humans today create (or even fake) what we see. There is no secret big enough for this to be a planetary-wide dark project. The main counter-argument to accepting the fact of alien visitation is that the evidence is literally blurry, not crystal clear (why be furtive?), ambiguous, and too extraordinary and consequential not to require clean unambiguous levels of proof. If aliens are present, why don’t they land on a lawn with a million cameras close up, walk out in the sunlight, and hand us some cool material we can hold? The main story is that the aliens don’t want to be seen. They want to visit, but not be seen. But in order to inspect us, in order to see anything, they must be visible themselves. In order to pick up photons (to see), their sensor has to be sensitive to photons, and thus seeable. In other words they cannot see us unless we can see them. So they appear briefly to inspect and then disappear. They may be traveling with some kind of cloak, or they may travel in another dimension, or they might travel is some kind of channel that is invisible to us. To get brief moments of viewing, they become visible to some degree. It is possible that what we see is a projection of sorts, a hologram, an artifact that is immaterial in essence, which is why they appear blurry, even close up. I’d also be willing to bet there are no fleshy beings inside. These are machine probes, or maybe teleportation, or virtual presences. Why do otherwise if you could? A ufo is like a cursor, a roving eye that is not really present."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/aliens-are-here-on-earth"
