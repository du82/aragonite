["https://kk.org/thetechnium/scenius-or-comm"]
title = "The Technium: Scenius, or Communal Genius"
description = "[Translations: Italian] Scenius is like genius, only embedded in a scene rather than in genes. Brian Eno suggested the word to convey the extreme creativity that groups, places or “scenes”  can occasionally generate. His actual definition is:  “Scenius stands for … Continue reading →"
full_description = "Scenius is like genius, only embedded in a scene rather than in genes. Brian Eno suggested the word to convey the extreme creativity that groups, places or “scenes” can occasionally generate. His actual definition is: “Scenius stands for the intelligence and the intuition of a whole cultural scene. It is the communal form of the concept of the genius.” Individuals immersed in a productive scenius will blossom and produce their best work. When buoyed by scenius, you act like genius. Your like-minded peers, and the entire environment inspire you. • Mutual appreciation — Risky moves are applauded by the group, subtlety is appreciated, and friendly competition goads the shy. Scenius can be thought of as the best of peer pressure. • Rapid exchange of tools and techniques — As soon as something is invented, it is flaunted and then shared. Ideas flow quickly because they are flowing inside a common language and sensibility. • Network effects of success — When a record is broken, a hit happens, or breakthrough erupts, the success is claimed by the entire scene. This empowers the scene to further success. • Local tolerance for the novelties — The local “outside” does not push back too hard against the transgressions of the scene. The renegades and mavericks are protected by this buffer zone. Scenius can erupt almost anywhere, and at different scales: in a corner of a company, in a neighborhood, or in an entire region. The history of art and science is crammed with episodes of scenius. In modern literature there was the Algonquin Round Table, the Bloomsbury Group, the Inklings in Oxford, UK. In art there was Paris in the 20s, the lofts in Soho, NYC, and Burning Man recently. There was the Vienna Circle in philosophy. In science there was the Lunar Society in England, Building 20 at MIT, or the ever-spreading Silicon Valley, including sub groups like the PayPal Mafia. The legendary Xerox PARC , Bell Labs, and the Skunkworks at Lockheed are often considered corporate scenius."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/scenius-or-comm"
