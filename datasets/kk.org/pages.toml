["https://kk.org/books/excellent-advice-for-living"]
title = "Excellent Advice for Living – Kevin Kelly"
full_description = "Books Excellent Advice for Living All stores Amazon Barnes & Noble iBooks Books-A-Million Powell’s IndieBound Chinese Edition SUMMARY Wise, practical, optimistic life advice from author and leading technology thinker Kevin KellyOn his 68th birthday, Kevin Kelly began to write down for his young adult children some things he had learned about life that he wished he had known earlier. To his surprise, Kelly had more to say than he thought, and kept adding to the advice over the years, compiling a life’s wisdom into these pages. Kelly’s timeless advice covers an astonishing range, from right living to setting ambitious goals, optimizing generosity, and cultivating compassion. He has wisdom for career, relationships, parenting, and finances, and gives guidance for practical matters ranging from travel to troubleshooting.Excellent Advice for Living is aimed primarily at young people, but speaks to all ages. This is the ideal companion for anyone seeking to navigate life with grace and creativity. PRODUCT DETAILSHardcover | $26.00Published by VikingMay 02, 2023 | 224 Pages | 5 x 7 | ISBN 9780593654521 CHINESE EDITIONPaperback｜RMB 69.00Published by CITIC Press September 01, 2023｜236 Pages | ISBN 9787521758634 ITALIAN EDITIONPaperback｜€15.00Published by Il SaggiatoreOctober 10, 2023｜224 Pages | ISBN 9788842832362 JAPANESE EDITIONHardcover｜YEN 1,870Published by Nikkei BPJuly 20, 2024｜248 Pages | ISBN 9784296002108 BLURBS “This book is for any professional, parent, or person. Kevin Kelly always manages to distill experience into memorable, actionable bites of wisdom. I wish more smart people wrote books like this.” — Ryan Holiday “Kevin’s book ‘Excellent Advice for Living’ hit me at the right place and the right time. The book serves as a treasure trove of bite-sized wisdom offering readers an engaging and easily digestible guide to navigating life’s ups and downs.” –John Picciuto, The Wrong Advice Podcast “Full of bangers. Extremely high insight and usefulness per page.” –Rhys Lindmark, The Rhys Show “I absolutely love this book, Excellent Advice for Living.” —Hardeep Kaur, The Architecture of Contemplation “This book is thought-provoking, evergreen, needed, fun, and most of all: might just make us better people.” —Dan Riley, Keep Talking “Of all the books on happiness, purpose, and wisdom that I have read (and authors I’ve hosted on my podcast) this is by far the best distillation of advice for living out there, and the wisdom comes in bite-size quotes for daily consumption, for we have to remind ourselves every day how to live.” —Michael Shermer, Publisher Skeptic magazine, host of The Michael Shermer Show “Kevin has distilled complex and important ideas into simple, actionable advice: a compelling antidote to thinkism.” —Mark Bidwell, host of OutsideVoices with Mark Bidwell podcast “Kevin gives excellent advice for creative living in this book, encouraging us to write to discover what we think. My favorite quote is: Only imperfect beings can make art because art begins in what is broken.” —Joanna Penn, The Creative Penn Podcast “At once heartfelt, illuminating and wise, this evergreen guide to life from eternal optimist Kevin Kelly is also an act of beauty in its generosity of spirit, a gift to us all that is sure to stand the test of time.” —Nina Kins, This is Beauty Podcast “Excellent Advice for Living made me want to stop every few pages and find someone to discuss the things I had just read. It is densely packed with wisdom about things big and small the way that few books are!” —Liberty RPF, Liberty’s Highlights “It’s the book you didn’t know you needed, but now can’t imagine not having read. Wise, practical, and relevant in a fresh way every day.” —Todd Henry, Accidental Creative “Everything I’ve achieved in my professional life I’ve done by standing on the shoulders of giants. Now, the inimitable Kevin Kelly has packed 71 years of timeless wisdom into his new book to help us not only be our best selves at work, but our best selves, period. I wish I’d read this when I was 21.” —Steve Glaveski, Future Squared podcast “Kevin Kelly’s Excellent Advice for Living is an exceptional book that offers readers valuable insights and advice for leading a fulfilling life, drawn from his vast and extraordinary life experiences.” —Srinivas Rao,Host/Founder at The Unmistakable Creative Podcast “This book distills everything that is great about a conversation with Kevin Kelly to its most elemental form.” —Aaron Lammer, The Longform podcast “An inspiring and helpful book, Excellent Advice for Living is a must-have for anyone looking for practical advice on life.” —Sean DeLaney, What Got You There Podcast “Kevin Kelly has managed to pack a lifetime’s worth of well-earned, practical and thought-provoking advice into this short gem of a book. I’ll be gifting it to friends for years to come and leaving copies around my house in the hopes that my kids may find it.” —Greg Campion, Intentional Wisdom podcast “We’re fortunate that Kevin Kelly has taken the time to put so much of his wisdom and excellent advice in this amazing new book!” —Bill Burke, The Optimism Institute “Like the Bible without the stories.” —Cal Fussman, Big Questions podcast “Kevin Kelly’s new book, Excellent Advice for Living, is a must-read for anyone seeking guidance on how to live a fulfilling life. With parables and quotes that focus on what matters most, this book is like a compass that points readers in the right direction. Kelly’s insights and wisdom cover a wide range of topics, including personal relationships, self-improvement, career, and financial success. In short, Excellent Advice for Living is an inspiring and practical guide to living your best life.” —Morgane Michael, Author/Speaker/Podcaster/Educator “Kevin’s advice is so practical and so easy to remember, that I find myself incorporating the wisdom of his book into my daily life -and it works!.” —Joe Byerly, From the Green Notebook Podcast “Excellent Advice for Living is a thought-provoking book. Kevin Kelly offers a treasure trove of practical insights and timeless advice on a wide range of topics, including career, creativity, relationships, and spirituality. Whether you’re just starting out in life or looking to make a fresh start, Excellent Advice for Living is a must-read guide to help you navigate the complexities of the modern world and find your own path to happiness and success.” —Neha Anwar, The Neha Anwar Podcast “A powerful collection of succinct teachings that offers insight into technology, leadership, family dinners, and everything in between. Reading it reminded me of reading Proverbs: the more you sit with each writing, the more you enjoy their depth.” —Henry Kaestner, Faith Driven Entrepreneur “Excellent Advice for Living is a treasure trove of insights that will transform the way you live, work, and relate to others, all wrapped up in easily digestible bites of wisdom to help you live a good life.” —Jonathan Fields, Good Life Project “I keep this book next to my chair in my living room, and read one page to my daughter per day. We then debate them, and discuss which are our favorites (and sometimes, which ones we disagree with). Excellent book worth buying! :)” — Brian Butler Oh, Kevin Kelly is so good. His book “Excellent Advice for Living” might be my most highlighted book ever! Here’s one of my favourite quotes: “Taking a break is not a sign of weakness but a sign of strength”. And with that I’m going to close my computer and go grab a coffee — Jon Ander Beracoechea PRAISE Advance praise for Excellent Advice for Living:“The non-linearity of this list is part of its magic. And one hundred years from now, when so much of the nonsense of our age is forgotten, people will still remember Kevin Kelly and his wisdom.” –Seth Godin“If you don’t find at least seventeen golden nuggets of advice from Kevin Kelly’s list, you’re not awake.” –Daniel Pink“Life essentials from a skilled navigator in an uncertain time.” –Steve Silberman, author of Neurotribes INTERVIEWS Japanese: Three-Part Interview Series, 1, 2, 3Nikkei Business Publications, September 2024 Kevin Kelly, on How to Find Your PurposeOut of Hours: The Podcast, February 19, 2024 Finding Your PathAspen Ideas, June 28, 2023 Excellent Advice for Living From the World’s Leading OptimistReason podcast, June 28, 2023 Wisdom For Humans And Artificial Aliensmansworldbangladesh.com, June 28, 2023 Radio New Zealand, June 26, 2023 Be Generous & UniqueInvest like the Best, June 26, 2023 Ask JBH #61: Kevin KellyJanice Bryant Howroyd, June 14, 2023 Kevin Kelly on Excellent Advice for Living, how optimists create the future, AI risk, and moreWarp Institute, June 5, 2023 #220 Kevin KellyBigger than Us, June 5, 2023203 – Kevin Kelly on Excellent Advice for Living, Playing with AI, and Staying CuriousFuture Fossils with Michael Garfield, June 3, 2023 Kevin Kelly on excellent advice for living—and parentingThe Dad Mindset, June 2, 2023 Episode 34, Beautiful Voyager, May 27, 2023 Kevin Kelly: Be The Only One (YouTube)Disrupt Everything, May 26, 2023 Wisdom for Our FutureQuantum Action, May 25, 2023 Building Blocks of WisdomInnovabuzz Podcast, May 25, 2023 #23 Excellent Advice for Living with Kevin KellyDon’t Panic! We’re All Going to Die, May, 25, 2023 The Power of FailureAwkward Silences, May 24, 2023 The Robert Lane Creative Careers Podcast, May 17, 2023 Futurist, Author, Maker, Tech Advocate, and Radical Optimist, Kevin KellyThe Person You Want to Be, May 16, 2023 Unveiling ‘Excellent Advice for Living’ and the AI RevolutionKevin Lockett Podcast, May 16, 2023 The BoldBrush Show, Episode 38, May 16, 2023 WGN News, May 12, 2023 Life Lessons From Wired Co-Founder Kevin KellyThe Next Big Idea, May 11, 2023 Shaping the Future with the Power of OptimismThe Vance Crowe Podcast, May 10, 2023 The Journey to Radical Optimism: Insights on Family, Personal Branding, and Future Technology with Kevin KellyStretch Four Podcast, May 9, 2023