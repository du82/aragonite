["https://kk.org/books/the-inevitable"]
title = "The Inevitable – Kevin Kelly"
full_description = "Books The Inevitable BUY ON AMAZON All stores Amazon Barnes & Noble iBooks Books-A-Million Powell’s IndieBound Summary From one of our leading technology thinkers and writers, a guide through the twelve technological imperatives that will shape the next thirty years and transform our lives Much of what will happen in the next thirty years is inevitable, driven by technological trends that are already in motion. In this fascinating, provocative new book, Kevin Kelly provides an optimistic road map for the future, showing how the coming changes in our lives—from virtual reality in the home to an on-demand economy to artificial intelligence embedded in everything we manufacture—can be understood as the result of a few long-term, accelerating forces. Kelly both describes these deep trends—flowing, screening, accessing, sharing, filtering, remixing, tracking, and questioning—and demonstrates how they overlap and are codependent on one another. These larger forces will completely revolutionize the way we buy, work, learn, and communicate with each other. By understanding and embracing them, says Kelly, it will be easier for us to remain on top of the coming wave of changes and to arrange our day-to-day relationships with technology in ways that bring forth maximum benefits. Kelly’s bright, hopeful book will be indispensable to anyone who seeks guidance on where their business, industry, or life is heading—what to invent, where to work, in what to invest, how to better reach customers, and what to begin to put into place—as this new world emerges. Advance Praise for The Inevitable “Anyone can claim to be a prophet, a fortune teller, or a futurist, and plenty of people do. What makes Kevin Kelly different is that he’s right. In this book, you’re swept along by his clear prose and unassailable arguments until it finally hits you: The technological, cultural, and societal changes he’s foreseeing really are inevitable. It’s like having a crystal ball, only without the risk of shattering.” — David Pogue, Yahoo Tech “This book offers profound insight into what happens (soon!) when intelligence flows as easily into objects as electricity.” — Chris Anderson, author of The Long Tail “How will the future be made? Kevin Kelly argues that the sequence of events ensuing from technical innovation has its own momentum … and that our best strategy is to understand and embrace it. Whether you find this prospect wonderful or terrifying, you will want to read this extremely thought-provoking book.” — Brian Eno, musician and composer “Kevin Kelly has been predicting our technological future with uncanny prescience for years. Now he’s given us a glimpse of how the next three decades will unfold with The Inevitable, a book jam-packed with insight, ideas, and optimism.” — Ernest Cline, author of Ready Player One “As exhilarating as the most outlandish science fiction novel, but based on very real trends. Kevin Kelly is the perfect tour guide for this life-changing future.” — Mark Frauenfelder, Boing Boing “Creating a fictional future is easy; Kevin Kelly makes a habit of doing the difficult by showing us where we’re actually going. The Inevitable is an eye-opening roadmap for what lies ahead. Science fiction is on its way to becoming science fact.” — Hugh Howey, author of Wool “Automatic must-read.” — Marc Andreessen, co-founder Andreessen Horowitz For media queries, please contact: Kristin MatzenSenior Publicist, Viking and Penguin Books212-366-2226, kmatzen@penguinrandomhouse.com Excerpts The Internet Is Still at the Beginning of Its BeginningHuffington Post, June 6, 2016 Linkedin, June 4, 2016 Reviews ‘The Inevitable’ by Kevin Kelly [Saturday Morning Review]ChurchMag, July 2, 2016 Deeper Reading: The InevitableNext: Economy, O’Reilly, June 2016 Kirkus Review, May 15, 2016 Interviews Episode #83 – Kevin Kelly, The InevitableInnovaBuzz, July 27, 2017 The Inevitable Technologies that will Shape our Future with Kevin KellyTalk of Today w