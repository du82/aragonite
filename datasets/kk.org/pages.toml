["https://kk.org/thetechnium/growth-vs-evolution"]
title = "The Technium: Growth vs Evolution"
description = "We seek personal growth. But when we say “personal growth” we don’t imagine us getting bigger, say gaining weight, or our ego enlarging, our head ballooning, or somehow we becoming giant in some way. Instead when we invoke “personal growth” we … Continue reading →"
full_description = "We seek personal growth. But when we say “personal growth” we don’t imagine us getting bigger, say gaining weight, or our ego enlarging, our head ballooning, or somehow we becoming giant in some way. Instead when we invoke “personal growth” we imagine an evolution where we improve, we get better. We might use the metaphor that we are become more like ourselves, truer to ourself, so maybe in that way you could say that there is “more of us.” But the image of a friend or relative today “growing” and then in 10 years they now have “more of them” is usually not what we seek. More of them may be too much, because it implies more of the parts no one likes. We might settle for “more of the best of them” which brings us back to the idea of evolution and improvement. Metaphorically, we want to be a better version of ourselves in the same space we occupy now, without become a giant ego, or an overbearing giant persona. However when we speak of governmental growth, we immediately imagine government getting “bigger,” gaining weight, becoming obese, enlarging, ballooning, infiltrating until it occupies the space. We don’t tend to imagine government getting better, improving. That is, it accomplishes more, or new things, or it accomplishes better things. What we want, of course, is for government to evolve, to become truer to itself, to accomplish what its goals are with fewer resources, more fairness, generating new benefits. Do we ever see that? We certainly do see many examples of governments in all parts of the world and in history ballooning, growing in the way that the insult “big government” intends, where there are more people doing less, more layers doing less, and more regulations preventing the new and better. But over the long term, we do see examples of governance — social institutions supported by taxes — improving and evolving. Compare any two equivalent shaped governments today versus 100 years ago. Let’s say the small town government of Springfield, USA. What it accomplishes today is fantastically more complicated and sophisticated than 100 years ago. Society has increased in complexity, so the governance has also increased in complexity. (See taxes). Intricate building codes regulate the safety of all those living in homes, which has decreased death and injury. Safety overall is increased, despite the fact that we have more exposure to high powered machines from cars, trucks, tractors, elevators, etc. We all live longer on average in part due to regulations. We have an increased number of services and opportunities were are managed. A libertarian will argue all that goodness has come at the expense of governments being involved in aspects of our lives it was not before: in the way it regulates what we eat, what we wear, how we farm, and so on. This regulatory presence is perceived as a loss of freedom. So the libertarian equation is since the government is present in more aspects of our life it has “grown” from little to big, and our freedom has been reduced from big to little. And sometimes that is true. But not always."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/growth-vs-evolution"
tags = ["archives", "comments", "evolution", "growth", "popular", "postings"]
