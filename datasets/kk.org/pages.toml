title = "The Technium"
full_description = "Summary: Human populations will start to decrease globally in a few more decades. Thereafter fewer and few humans will be alive to contribute labor and to consume what is made. However at the same historical moment as this decrease, we are creating millions of AIs and robots and agents, who could potentially not only generate new and old things, but also consume them as well, and to continue to grow the economy in a new and different way. This is a Economic Handoff, from those who are born to those who are made. It has been nearly a thousand years since we last saw the total number of humans on this planet decrease year by year. For nearly a millennium we have lived with growing populations, and faster rates of growth. But in the coming decades, for the first time in a thousand years, the number of deaths on the planet each year will exceed the number of births. This seems hard to believe at first because superficially there is no evidence for that change in direction. As this chart shows, the line wants to go up. While the fertility of humans has been declining for decades, it was mainly in the developed world, while the rest of the world kept breeding prolifically. But starting a decade ago, even the developing parts of the globe have experienced declines in fertility as they developed. Presently we have evidence that fertility rates are declining everywhere on the planet. And the rate of that fertility decline is starting to plunge much faster than anyone alive expected. The line of fertility wants to go down. The key metric of fertility is the replacement level. If the total fertility rate is below replacement, then over time, the population decreases, because the current humans don’t replace themselves in numbers. Right now in 2025 every developed country except one (Israel) is below replacement and getting lower each year. Some countries in East Asia are so far below replacement that they are already losing population. Nearly every other country in the world is following this pattern of rapidly modernizing, reducing their birth rate in a one-way direction downward. Not a single country anywhere has been able to raise their birth rate above replacement once it dips below that threshold. It’s like a black hole."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium"
