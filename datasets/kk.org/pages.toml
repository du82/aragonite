["https://kk.org/streetuse/2007/09"]
title = "Street Use: 2007 : September"
full_description = "The Brazilian newspaper A Tarde interviewed me about Street Use. Their question: does the street use of technology impact the poor differently than the rich? My answer: “Everyone tries to personalize technology. The poor have time but no money; and the rich have money but no time. So the poor use their time to modify technology and the rich use money to personalize it. I always find what people do with time more interesting than what they do with money.” Over at Treehugger, Warren McLaren has rounded up all the examples of this ingenious, indigenous, “labor-saving” invention that he could find. It is apparent that thousands of people who have to mow the lawn decided there must be an easier way and had exactly the same idea: Why not hook the mower to a bike? And so the bikemower is born in a thousand of garages around the country. Judging from the pictures, they are still in the garages. Most of the pics rounded up by McLaren look as if they were taken at garage sales. I have my doubts that the bike mower is very useful, or easier to use than pushing on your feet. In Uganda, Ken Banks found this ingenious mobile phone booth. He wrote up the caption and posted his picture to Afrigadget, one of my favorite street use sites. His report: I met this phone operator off Kampala Road this afternoon, who was riding round on this bike. Luckily he was a fellow Liverpool supporter so we hit it off straight away – and he let me take a photo of his BodaPhone setup. Pretty neat, and with a spare battery to allow him to stay on the road longer. Uganda is really hotting up on the mobile front, with two new operators about to enter the market towards the end of the year. This prototype of a prototypical street cart is artist Mouna Andraos’ idea. From the artist’s proposal: “An old idea from yesterday’s streets adapted to serve the needs of today’s urban dwellers, the Power Cart is a mobile unit that delivers alternative power to people in the streets. Street vendors have traditionally played an important role in defining the urban environment and often speak to the current social and cultural context of a city. In most parts of the world (and if the weather permits it), the street is a place where social interactions abound and where commerce rules, and street vendors around the globe bring to local populations the things they need right at their door steps. Knife sharpening in India, refills of gas in Africa, fake Gucci bags in Paris and chair massages in New York, the Power Cart looks and feels like another service for the city of today. Need a charge on your cell phone? Your laptop is about to die and you really need to check that email? Or maybe there is no power around you at all? Where ever you might be in the world, hail the Power Cart for a quick fix. Let the Power Cart owner turn the crank for you and get the electricity you need, one minute of cranking at a time.”"
