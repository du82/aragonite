["https://kk.org/streetuse/category/recyle-surprises"]
title = "Street Use: Recyle Surprises"
full_description = "What an elegant design. A wonderfully sleek bicycle is given a motor and gas tank in Cuba to make a motor bike. A close up view with annotations shows a different home-made motor bike in Cuba, collected by Ernesto Oroza. The detail of the soda bottle gas tank is wonderful. This design uses the motor’s rotor to directly power the tire. That’s what Cuban artist and researcher Ernesto Oroza calls these “inventions of neccessity.” For eight years he has collected everyday objects crafted from discards, and re-purposed technology found in Cuba. Where purchased goods are in short supply, people fix their own. He’s shown these re-invented objects in several exhibitions. For instance, here is a razor made with the blade and a pencil. There are others. Check out this set of chairs constructed from broken plastic chairs given a new rebar skeleton. Many of Oroza’s objects were photographed and collected into a booklet called No Waste, which was publshed by Pentagram and is now out of print (available in a handful of libraries). This is all I know: English-Russia says “These days in some parks of St. Petersburg you can meet chandeliers made of used plastic bottles..” A bridge made of cardboard tubes. (First noticed on here.) It’s more of an artpiece than utiltarian structure. Think rain and snow. However the architect, Shigeru Ban, has built many utilitarian structures using low tech cardboard tubes. Protected inside an outer membrane, the tubes keep their strength and preform magnificently. For example, Recycled hi-tech lace curtains. “Seen a few days ago in Cork, Ireland: a sensible use for all that bubble-wrap.” Submitted by Tom Raworth. Reader David Sarpal writes: “My sister is visiting Colombia right now and she happened upon a street vendor who has arrived at an ingenious re-use of a baby carriage as a street vendor.” This foam cushion tied to the worker’s head in India is reputedly a hard hat substitute. The picture is from this humor blog so I don’t know its veracity. It is much more likely a piece of padding to hauling iron pipes since the common way to transport heavy things in india is using the head/spine for support."
