["https://kk.org/thetechnium/chinas-immigrant-energy-underappreciated"]
title = "The Technium: China’s Immigrant Energy, Underappreciated"
description = "There is a significant parallel between China of today and the US a century ago. The parallel is this: Both US and China were/are formed and propelled by the Great Immigrant Experience. The US’s great rise in modernity was energized by … Continue reading →"
full_description = "There is a significant parallel between China of today and the US a century ago. The parallel is this: Both US and China were/are formed and propelled by the Great Immigrant Experience. The US’s great rise in modernity was energized by the tremendous flow of immigrants from elsewhere around the world into its coastal cities. The welcomed migrants brought cheap labor, the unstoppable ambition of very motivated people, vibrant civic urban life with new foods and customs, a diversity of backgrounds and new ideas. It also brought the problems of a clash of cultures, language, prejudices, and expectations. And immigrants came in great numbers. As the US became a nation of immigrants, this melting pot, this collider, this fusion became both the identity and the engine of the country. It is hard to imagine the superpower of the US arriving without immigration. But in China, this immigration is disguised because it is internal immigration. All the movement is domestic so to speak. Great oceans of migrants flow from villages at the far ends of the roads in Yunnan, Inner Mongolia, or Guizhou, and stream into the coastal cities. From the homes where they begin these migrants speak mutually unintelligible languages. The differences in native languages between Inner Mongolia and Yunnan and Guizhou is vast and incomprehensible. They would not understand each other in the cities as they move about without the interlingua of Mandarin. Further afield, migrants from Tibet and Xinjiang don’t speak any kind Chinese at all at home, and among the older people they don’t speak Mandarin at all. (My Uyghur driver in Kashgar, Xinjiang in 2016, who did not speak very good Mandarin, told me that he and his wife had decided that their kids should learn Mandarin in school. He had not.) These immigrants are pouring into cities, thrown to work and live together with strange people with strange accents from Quinghai, Gansu, or Guizhou. Take that marvel of manufacturing, Shenzhen. It is a modern city with a stupendous opera house, magnificent libraries and museums, and 12 million in population, bigger than NYC. None of its 12 million adult inhabitants were born in Shenzhen! None are native; all 12 million are immigrants. Thirty years ago it was just a fishing village; all its current inhabitants (except for a few thousand) are migrants who have just moved there. It is a mega-city of immigrants. And youth: Shenzhen is stocked with millennials. (By age, it’s the hippest city on Earth.) All the 100 other large cities in China with over 1 million population are likewise full of internal immigrants. All the modern stuff that China creates and exports is being made by these immigrants."
author = "Kevin Kelly"
year_published = 2025
