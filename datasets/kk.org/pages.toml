["https://kk.org/cooltools"]
title = "Cool Tools – Cool tools really work. A cool tool can be any book, gadget, software, video, map, hardware, material, or website that is tried and true. All reviews on this site are written by readers who have actually used the tool and others like it. Items can be either old or new as long as they are wonderful. We only post things we like and ignore the rest. Suggestions for tools much better than what is recommended here are always wanted. Tell me what you love."
description = """
Decades of Travel Wisdom/TripIt App/Carry-on Limits            Nomadico issue #145
                    
A weekly newsletter with four quick bites, edited by Tim Leffel, author of A Better Life for Half the Price and The World’s Cheapest Destinations. See past editions here, where your like-minded friends can subscribe and join you.



50+ Years of Travel Wisdom



Welcome to the many new subscribers after Nomadico co-founder Kevin Kelly mentioned us at the end of this collection of tips gleaned from 50+ years of travel. It’s hard for me to pick a favorite, but here’s a sample: “In 53 years of traveling with all kinds of people, I’ve seen absolutely no correlation between where you eat and whether you have intestinal problems, so to maximize the enjoyment of local foods, my rule of thumb is to eat wherever healthy-looking locals eat.” (And hey, he was a backpacker in the 1970s!)



Travel Plans in One Place



Someone asked me recently which travel apps would be a nightmare to give up on my phone and I had two: Google Maps and TripIt. Uses for the first are obvious, but TripIt is my second brain when I’m on the move, with transportation tickets, lodging reservations, and advance museum ticket times all saved in one place. As soon as the confirmation hits my e-mail box, it gets automatically forwarded to the app so I don’t have to do anything. I’ve been on the free plan for 12 years, but if you pay $49 a year for Pro you get some extra perks like alerts when a better seat opens up or when the flight price drops.



A Complete Guide to Carry-on Luggage Restrictions



While we’ve now standardized our travel tech around Bluetooth and USB-C, the airlines have gone the other way with luggage and splintered off in multiple directions. Not only are the fees a convoluted mess, but so are the answers to the simple question, “How big can my carry-on bag be?” In the USA you’re usually safe with 45 linear inches (22 X 14 X 9) but some allow a tad more. For European or Asian that could be too large though and you’ll also have to check it or pay extra if it weighs too much. EasyJet only allows the equivalent of 100 linear centimeters (39.6 linear inches) and for Air China your carry-on can only weigh 5 kilograms (11 pounds). Afar has done the research and published the most comprehensive rundown I’ve ever seen.



Is It Less Safe to Fly Now?



I’ve always been that guy pulling out stats to show how safe flying is compared to getting in a car, but since the administration change in the USA on January 20, I’m feeling a lot less confident. After 16 years with no deadly commercial airline crashes in the USA, we’ve had a whole series of them in just a few weeks, including 67 people dead in D.C. and 10 in Alaska. Those tragedies would inspire most leaders to increase the safety budget and manpower, but instead we’re seeing headlines like “Hundreds of FAA employees fired by Trump administration weeks after midair DC collision.” Full article here.                                02/27/25                                                              Comments (0)"""
full_description = "27 February 2025 Decades of Travel Wisdom/TripIt App/Carry-on Limits Nomadico issue #145 A weekly newsletter with four quick bites, edited by Tim Leffel, author of A Better Life for Half the Price and The World’s Cheapest Destinations. See past editions here, where your like-minded friends can subscribe and join you. 50+ Years of Travel Wisdom Welcome to the many new subscribers after Nomadico co-founder Kevin Kelly mentioned us at the end of this collection of tips gleaned from 50+ years of travel. It’s hard for me to pick a favorite, but here’s a sample: “In 53 years of traveling with all kinds of people, I’ve seen absolutely no correlation between where you eat and whether you have intestinal problems, so to maximize the enjoyment of local foods, my rule of thumb is to eat wherever healthy-looking locals eat.” (And hey, he was a backpacker in the 1970s!) Travel Plans in One Place Someone asked me recently which travel apps would be a nightmare to give up on my phone and I had two: Google Maps and TripIt. Uses for the first are obvious, but TripIt is my second brain when I’m on the move, with transportation tickets, lodging reservations, and advance museum ticket times all saved in one place. As soon as the confirmation hits my e-mail box, it gets automatically forwarded to the app so I don’t have to do anything. I’ve been on the free plan for 12 years, but if you pay $49 a year for Pro you get some extra perks like alerts when a better seat opens up or when the flight price drops. A Complete Guide to Carry-on Luggage Restrictions While we’ve now standardized our travel tech around Bluetooth and USB-C, the airlines have gone the other way with luggage and splintered off in multiple directions. Not only are the fees a convoluted mess, but so are the answers to the simple question, “How big can my carry-on bag be?” In the USA you’re usually safe with 45 linear inches (22 X 14 X 9) but some allow a tad more. For European or Asian that could be too large though and you’ll also have to check it or pay extra if it weighs too much. EasyJet only allows the equivalent of 100 linear centimeters (39.6 linear inches) and for Air China your carry-on can only weigh 5 kilograms (11 pounds). Afar has done the research and published the most comprehensive rundown I’ve ever seen. Is It Less Safe to Fly Now? I’ve always been that guy pulling out stats to show how safe flying is compared to getting in a car, but since the administration change in the USA on January 20, I’m feeling a lot less confident. After 16 years with no deadly commercial airline crashes in the USA, we’ve had a whole series of them in just a few weeks, including 67 people dead in D.C. and 10 in Alaska. Those tragedies would inspire most leaders to increase the safety budget and manpower, but instead we’re seeing headlines like “Hundreds of FAA employees fired by Trump administration weeks after midair DC collision.” Full article here. 02/27/25 Comments (0) 25 February 2025 The Earth and I / Have You Seen My Trumpet? Issue No. 55 Books That Belong On Paper first appeared on the web as Wink Books and was edited by Carla Sinclair. Sign up here to get the issues a week early in your inbox. THE EARTH AND I – IS CLIMATE CHANGE MOVING TOO FAST FOR A NEW BOOK ON CLIMATE CHANGE? The Earth and Iby James Lovelock (editor) and Jack Hudson (illustrator)Taschen2016, 168 pages, 8.5 x 10.9 x 0.8 inches (hardcover) Buy on Amazon It is obviously unfair to dismiss the entire contents of a book for a single tin-eared statement, but the clunker that comes near the end of The Earth and I by Gaia-theory originator James Lovelock is a doozy. The inexplicable passage follows a dozen essays by journalists, a Nobel Prize winner, and several Ivy League professors, who make a pretty good case for both the insignificance of human beings in the universe and their unique ability to end life as we know it here on Planet Earth. In an attempt, then, to give his shell-shocked readers a sliver of hope by celebrating the success of the Montreal Protocol, which banned chlorofluorocarbons in 1989, Lovelock crows about how these ozone-destroying compounds were replaced by hydrofluorocarbons, which, he writes, “are far less harmful to the planetary environment.” Somewhere between the time Lovelock wrote those words and the publication of his book, hydrofluorocarbons were added to the Montreal Protocol’s list of banned substances – eliminating “less harmful” hydrofluorocarbons is expected to keep our warming planet’s temperature from rising by a full half-degree Celsius. The inability of even an authority like Lovelock to keep pace with current events points out how quickly both the science and politics of climate change are a changing. In this light, understanding the holistic view of the planet’s processes – from the weather above us to the meaning of the geological history below our feet – has never been more important. The Earth and I delivers on these topics and more, while Jack Hudson’s engaging illustrations lure us in and invite the eye to linger. Many readers may well be tempted to do just that, but they shouldn’t – at last report, Greenland and Antarctica were melting at alarming fast and irreversible rates. – Ben Marks HAVE YOU SEEN MY TRUMPET? – A HUMOROUS RIDDLE AND WORD-PLAY BOOK FOR KIDS Have You Seen My Trumpet?by Michaël Escoffier (author) and Kris Di Giacomo (illustrator)Enchanted Lion Books2016, 48 pages, 7.9 x 12.3 x 0.5 inches (hardcover) Buy on Amazon The third book in Michaël Escoffier’s and Kris Di Giacomo’s word-play trilogy, Have You Seen My Trumpet?, brings the same silly love of language as their previous two stories, with a healthy dose of humor and animal antics. What I love most about Have You See my Trumpet? (and its predecessor, Where’s the Baboon?), is that it makes a game of reading for both early- and pre-readers. Every page spread has a riddle of a question in which the answer is actually written. For example, the answer to “Who loves guacamole?” is Mole (see what they did there?), who is also pictured in a creature-filled beach scene cuddling an avocado. Though my preschooler doesn’t read yet, she does know some letter sounds and has begun using the answers to each riddle (written in the question in red) for practice. Because the answers are also illustrated, the book gives an added bonus of reading not just words, but facial expressions, body language, and other social cues. A different author/illustrator team could have easily missed the mark with this book as the concept, at face value, could be terribly boring and numbingly basic. But the subtle narrative, exciting vocabulary, and clever illustrations make Have You Seen My Trumpet? a book that is fun for little kids and their grown-ups to read again and again. – Mk Smith Despres 02/25/25 Comments (0) 24 February 2025 Personal Finance Tools for Possibilities: issue no. 126 Once a week we’ll send out a page from Cool Tools: A Catalog of Possibilities. The tools might be outdated or obsolete, and the links to them may or may not work. We present these vintage recommendations as is because the possibilities they inspire are new. Sign up here to get Tools for Possibilities a week early in your inbox. Best financial intro Your Money: The Missing Manual This is the best user-guide to personal finance I’ve found, and I’ve probably read them all. It is certainly the sanest and most level-headed. There are no get rich quick schemes here, just plenty of ways to get rich slowly. Indeed, Get Rich Slowly was the name of author’s very popular personal finance blog, which led to this book. J.D. Roth takes the great investing advice of Andrew Tobias in The Only Investment Guide You’ll Ever Need, and he summarizes the life-earning wisdom in the previously reviewed (and still recommended) book Five Rituals of Wealth and he includes the needed crystalization of priorities found in Your Money or Your Life, and financial motivations from Suze Orman and the Millionaire Next Door and then adds key insights and tips from hundreds of other lesser-known money gurus. Basically, Roth has read every book and blog on money managing, investing, saving, and earning and digests and integrates all this hard-won knowledge into an amazing selection of smart, practical ideas for today. I could hardly turn a page without learning a solid investing tip or two, or a clever way to save a few hundred dollars, or an example of something I already knew, but was looking for a vivid way to teach my kids. I like the fact that Roth emphasizes the value of sharing whatever wealth you have, and keeps returning to the long view. I would not call this an inspirational book (plenty of those on the shelves), nor even a memorable book like the ones mentioned above. Rather it is what is advertised: a day-to-day operating manual for your money. Specific details, sources, methods, tricks. Dip into it when you are stuck, check it before trying something new, re-read it when you think you know it all. I’ve done pretty well financially, and if you were to ask me my practical advice — like what to do tomorrow — I would simply give you this book. It’s slow, but true. — KK Because you earn pre-tax dollars but spend after-tax dollars, a penny saved is actually more than a penny earned. Depending on your tax bracket, you might have to earn $111 , $133, or even $150 to put $100 in your pocket. So if you re in the 25% tax bracket, saving $750 a year is like giving yourself a $1,000 raise!Destroy Existing DebtAfter you’ve stopped using credit and created an emergency fund, then go after your existing debt. Attack it with vigor, throw whatever you can at it. The best way to do this is to use a technique called the debt snowball, which lets you build and maintain debt-destroying momentum. Here’s the basic method: Make a list of your debts in the order you want to destroy them. (You’ll learn a couple of good ways to prioritize debts in a moment.) Set aside a certain amount of money to pay toward debts each month ($500, say). Make the minimum payment on all debts except the first one on your list. Throw every other penny at the first debt on the list. But here’s the key to making the debt snowball work: After you’ve destroyed your first debt, you’ll find you’ve freed up a bit of cash; because one of your debts is gone, you have one less monthly payment. You could take this money and use it for something else, but you re going to do something smarter: keep paying the same total amount, $500 in our example, toward the debt every month.Destroying low-balance debt firstIf you’ve tried following the highest-interest-rate-first advice and still struggle with debt, there’s another way. In his book, The Total Money Makeover, Dave Ramsey advocates an approach to the debt snowball that tackles accounts with low balances first. (Ramsey didn’t invent this method, but he’s popularized it over the past decade.) With this version of the debt snowball, you ignore interest rates when determining the order in which you’ll pay off your debts. All you look at is how much you owe, organizing the debts from smallest balance to largest balance.That’s not to say you shouldn’t try this method: If it works for you, use it! But if you struggle, consider the next method, which is the one that helped me succeed. It might help you to have a visual representation of your debt-paying progress. Try this: take a piece of graph paper and block off squares to represent your debt. (You might use one square for every $ 100, say.) When you make a payment, mark off a square and give yourself a pat on the back. (If you re a geek, build yourself an Excel spreadsheet that does something similar.) These little progress reports are cheesy, but they can keep you on track.This method may not be as quick as paying your high-interest debt first, but it provides tremendous psychological reinforcement. You get some quick wins checking creditors off your list that encourage you to keep at it. Dave Ramsey calls this behavior modification over math, and he’s right: the most important thing when paying off your debts is to, well, pay off your debts; the order in which you do so is irrelevant. Critics of this approach argue that the math doesn’t make sense, and they’re right: If you use this method, you will pay more interest than if you had the discipline to pay off your debts based on interest rate. But humans are complex psychological creatures, not adding machines. We usually know what we ought to do, but that doesn’t mean we always do it. If we were adding machines and always made the best choices, we wouldn’t get into debt in the first place!Protecting Yourself with Parallel CDsWith a CD, one of the biggest risks is that you’ll need to pull your money out before it matures. When you do this, you pay a penalty. The site FiveCentNickel.com suggests that you can decrease this risk with parallel CDs: http://tinyurl.com/parallel-CDs. here’s how it works: Let’s say you have $5,000 you’d like to put into CDs. Instead of opening a single CD and putting that whole amount in it, you’d open multiple CDs, all with the same maturation date. You could open five CDs of $1,000 each, say, or open two with $1,000 and one with $3,000. This gives you a buffer in case you need to get at the moneyearly. If you need $500 for an emergency, for example, you can break just a single $1,000 CD. That way you don’t pay a penalty on the rest of the money you have in CDs, and the penalty will be smaller than what you would have paid if you’d put the whole $5,000 in a single CD.Pay Yourself FirstIf you’re living paycheck to paycheck, saving may seem impossible. You have to pay for things like rent, a car payment, groceries, and maybe even student loans. You’d like to save, but at the end of the month, there’s no money left to set aside. And that’s the problem: Most people try to save something out of what s left over instead of saving first. One of the best ways to build wealth is to set aside a portion of your income for savings before you pay your bills, buy groceries, or do anything else with yourmoney. Here are three reasons to pay yourself first: It makes you the priority. You’re telling yourself that you are more important than the electric company or the landlord. think of the money you put into savings as a down payment on your future. It encourages sound financial habits. Most people spend their money in the following order: bills, fun, savings. But if you bump savings to the front of that list, you can set money aside before you come up with reasons to spend it. That way, since the money is no longer in your checking account to tempt you, you end up spending less.Targeted Savings AccountsMost people work toward several financial goals at once, but keep their money clumped together in a single account. With that setup, it’s easy to forget how much you’ve saved for each goal and to borrowmoney from one goal to pay for something else. In The Six-Day Financ"
