["https://kk.org/cooltools/category/every-day-carry"]
title = "Every Day Carry – Cool Tools"
full_description = "Every Day Carry 05/26/20 Victorinox Recruit Pocketknife Minimal every day carry 12/19/19 EDC Organizer Pouch “Go Bag” Container for your useful everyday carry tools 12/5/19 Favorite Pocket-Size Tools Best everyday carries 07/23/19 3-Inch Widgy Pry Bar Keychain pry bar 07/9/19 14500 Flashlight Battery with Built-In Micro-USB Charging No charger needed to recharge this battery 11/13/18 Storus Smart Money Clip Wallet-free cash & card carry A cool tool can be any book, gadget, software, video, map, hardware, material, or website that is tried and true. All reviews on this site are written by readers who have actually used the tool and others like it. Items can be either old or new as long as they are wonderful. We post things we like and ignore the rest. Suggestions for tools much better than what is recommended here are always wanted. A weekly newsletter with four quick bites, edited by Tim Leffel, author of A Better Life for Half the Price and The World’s Cheapest Destinations. See past editions here, where your like-minded friends can subscribe and join you. Welcome to the many new subscribers after Nomadico co-founder Kevin Kelly mentioned us at the end of this collection of tips gleaned from 50+ years of travel. It’s hard for me to pick a favorite, but here’s a sample: “In 53 years of traveling with all kinds of people, I’ve seen absolutely no correlation between where you eat and whether you have intestinal problems, so to maximize the enjoyment of local foods, my rule of thumb is to eat wherever healthy-looking locals eat.” (And hey, he was a backpacker in the 1970s!) Someone asked me recently which travel apps would be a nightmare to give up on my phone and I had two: Google Maps and TripIt. Uses for the first are obvious, but TripIt is my second brain when I’m on the move, with transportation tickets, lodging reservations, and advance museum ticket times all saved in one place. As soon as the confirmation hits my e-mail box, it gets automatically forwarded to the app so I don’t have to do anything. I’ve been on the free plan for 12 years, but if you pay $49 a year for Pro you get some extra perks like alerts when a better seat opens up or when the flight price drops."
