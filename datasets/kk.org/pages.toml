full_description = "Several years ago on my 68th birthday I wrote up 68 bits of advice for my adult children, and posted them here. Here are the first five bits: The 68 bits were extremely popular, and they were widely shared by others. I was encouraged to write up more bits of wisdom on my following two birthdays, which were also widely shared. They were such a hit that Viking Penguin books thought they should be in a book, and I thought so too. So I gathered the three lists, weeded out the weak ones, polished up the best, and then I wrote an additional 150 more bits of advice, until I had 450 of them. I put them all into a small book you can slip into your pocket. This book, Excellent Advice for Living, is designed to be the perfect gift. I already know it makes a fantastic graduation gift. You can order it on Amazon here. [Follow me on Twitter @kevin2kelly. Join my newsletter Recomendo for 6 recommendations per week.]"
