n, October 14, 2010“The book of the year,” Seth Godin’s Blog Kate Wong, October 2010“What Technology Wants,” Recommended, Scientific American, 303(4), p.97 Presentations TEDxSF, November 16, 2010 Interviews 专访 KK：技术、生命、失控和进化Huxio.com, February 21, 2013 Tech Thinker Kevin Kelly on the Red CouchInside Flipboard, February 21, 2013 Patt Morrison Asks: The Possibilian, Kevin KellyInterview by Pat Morrison, Los Angeles Times, August 13, 2011 Geek TheologianInterview by Katelyn Beaty, Christianity Today, July 15, 2011 What Technology Wants. What Kevin Kelly Says. An interview with Kevin KellyInterview by R.U. Sirius, h+ Magaine, January 19, 2011 Keen On… Kevin Kelly: What Does Kevin Kelly Want? (TCTV), Part IIInterview by Andrew Keen, TechCrunch, January 19, 2011 Keen On… Kevin Kelly: What Does Kevin Kelly Want? (TCTV), Part IInterview by Andrew Keen, TechCrunch, January 18, 2011 Kevin KellyInterview by Erik Hansen, tompeters!, January 6, 2011 RISE #154: A Chat With Kevin Kelly On What Technology Wants & The Power Of 1,000 FansInterview by David Siteman Garland, The Rise To The Top, December 28, 2010 Kevin Kelly on What Technology WantsInterview by Peter Schwartz, GBN in Conversation, December 9, 2010 Kelly on Technology and What Technology WantsInterview by Russ Roberts, EconTalk, November 29, 2010 Ask not what your technology can do for you…Interview by Jamillah Knowles, BBC Outriders, November 23, 2010[mp3] Part One: What Is Life? — Science & the Search for Meaning: 5 QuestionsInterview by Jim Fleming, To The Best Of Our Knowledge, November 21, 2010 TWiT Live Specials 49: Live With Kevin KellyInterview by Leo Laporte, November 17, 2010 Kevin Kelley Interviewed by Rick KleffelThe Agony Column, Litseen, November 15, 2010 Kevin Kelly On Singularity 1 on 1: Technology Doesn’t Want A SingularityInterview by Nikola Danaylov, Singularity Weblog, November 3, 2010 Evolution of TechnologyIn conversation with James GardnerInterview by George Noory, Coast to Coast AM, November 2, 2010 Wired Co-Founder Kevin Kelly on ‘What Technology Wants’Interview by Jennifer Pollock, 7×7, October 24, 2010 Kirkus Q&A: Kevin KellyInterview by Devon Glenn, Kirkus Reviews, October 20, 2010 Kevin Kelly on Tech: the Unabomber was Right; the Amish, tooInterview by Christopher Lydon, Radio Open Source, October 19, 2010 The Tendencies of TechnologyIn conversation with Nicholas Negroponte, David Kirkpatrick, and Nick BiltonModerated by John Hockenberry, Boston Book Festival, October 16, 2010 Kevin Kelly Tells Us What Technology WantsInterview by Bill Frank, Brainstormin’ with Billy the Brain, October 15, 2010 Kevin Kelly and Steven Johnson on Where Ideas Come FromWired, Issue 18.10, September 27, 2010 Kevin Kelly on “What Technology Wants”by David Spark, Techonomy, August 5, 2010. Additional Praise for What Technology Wants “If you are interested the big picture of technology, you need to read this book.”— Danny Hillis, designer of The 10,000-year Clock “It isn’t often that a book is so important and well crafted that I feel compelled to urge everyone to buy it and read it even though I profoundly disagree with aspects of it. What Technology Wants is the best, purest statement of one way of thinking about our era and the future. You can’t understand the most important conversation of our times without reading this book.”— Jaron Lanier, technologist, inventor “Kevin Kelly’s new book is unputdownable. It’s brilliant. It’s necessary.”— Doug Coupland, author of Generation X “This is why it is still worth our time to read books. Kevin Kelly, the clearest-eyed visionary we have about the intersection of culture and technology, has created a tour de force, a book for the ages. It will be several months before I stop bringing this book up with everyone I meet.”— Seth Godin, author of Linchpin “Kevin Kelly has given us a magisterial tome that should be ingested slowly and savored to the last paragraph.”— Tom Peters, co-author of In Search of Excellence “Unparalleled in both depth and breadth, this book is set to become a landmark in modern thinking.”— Brian Eno, muscian and producer “Kevin Kelly’s original and unusual mind has produced an enthralling account of the living, changing `technium’ in which all our lives are immersed. His conclusion is that technology’s evolution is incremental, inevitable and inexorable. This is a book swarming with fresh insights.”— Matt Ridley, author of The Rational Optimist “Here you have the first theory of human history that is reliably predictive, because it extends to before and after humans. The writing is a model of lucidity.”— Stewart Brand, Global Business Network and Whole Earth Discipline “Kevin Kelly’s thesis is spellbinding, lucid, contrary, and ever fantastic: technologies are an expression of a self-organizing universe better understood through the metaphors of biology than engineering. Read it to be startled, read it to be shaken up; read it to transform technophobia into wonder.’— Paul Hawken, author of Blessed Unrest “This is the first book that has made me accept the inevitability of our technologized future, while simultaneously making me feel hopeful about it. This is technology writing at its very best.”— Douglas Rushkoff, author, Program or Be Programmed “Kevin Kelly is one of the world’s best philosophers of technology, and he’s again ahead of the wave with this astonishingly brilliant book. He shows how technology is an outgrowth of human life, and thus it evolves based on its own inherent desires and instincts. It expands the mind’s urge toward connections and unity and, yes, toward goodness and beauty. What a cool insight, at once both useful and optimistic!”— Walter Isaacson, President of the Aspen Institute “What Technology Wants is an inspiring, provocative and sweeping account of how our world works and where it’s going. Kelly wants you to make choices about technology, but he also wants you to understand that technology is making choices about you. It is an extraordinary book.”— Cory Doctorow, BoingBoing “Kevin Kelly is the biggest thinker I know, and What Technology Wants is a breathtakingly big look at what technology is, what it is becoming, and what humans can do about it. It’s a uniquely appealing invitation to rethink the role of technology in the world and our lives. I read it like a connoisseur must savor a rare wine because books this important and this compellingly written don’t come along often.”— Howard Rheingold, author of Smart Mobs “A terrific book. Kelly’s guarded optimism about our technology-empowered future is infectious and persuasive. Anyone who catches a glimpse of the tomorrow presented here will want it, and move mountains to make it happen.”— David Brin, science fiction author “Brave Kevin Kelly says what others are too timid to admit: he sees technology as a life force, a desiring partner. In the embrace of the web that he loves, he wants to give technology what it wants and this book is his theory of its wishes. By making the strong case Kelly opens up the conversation we need to have about technology, determinism, and human choice.”— Sherry Turkle, MIT professor and author of Second Self “This is no mere book about stuff. To Kevin Kelly, life is an extension of matter and energy, the fundamentals of the universe ever since the Big Bang, and technology is an extension of life. From this perspective, humans are not the ultimate but rather intermediate between the born and the made. If you want to expand your mind and way of thinking about life and the cosmos, I can think of no better book than What Technology Wants. Kelly is a master of the Big View.”— Stan Davis, author of Future Perfect “One of the foremost connoisseurs of technology, Kevin Kelly takes us on a wild ride into the living, pumping, networked heart of the world that has grown up around us. Through his eyes we come to see the technium as an evolving ecosystem whose genes are ideas and whose lush varieties form a seventh kingdom of life. This book will immediately become a classic guidepost for anyone wanting to navigate the strange and miraculous ecology in which we now find ourselves.”— David Eagleman, author of SUM “Kevin Kelly’s book more than provokes thoughts–it unleashes geysers of them. This masterful treatise on how technology evolves goes far beyond the conventional hand-wringing or flag-waving to present an original and constructive vision of the world we’ve created and its future.”— Steven Levy, author of The Perfect Thing and Hackers “It’s tough work predicting the future but–now that it’s here grabbing us by the lapels and looking us in the face–someone’s got to do it, and who better than Kevin Kelly? What Technology Wants is provocative and exciting.”— James Gleick, author of Chaos “We humans have achieved sentience and self-awareness via self-organizing systems, beginning with molecules and genes. Our next emerging state is what Kevin Kelly calls the “technium” — a colossal system in which people and machines work together. The focus of What Technology Wants is on how we can work together, with our creations, to make life better for all — humans and creations.”— Craig Newmark, craigslist “In What Technology Wants Kevin Kelly makes a convincing case that technological development is not merely similar to the evolutionary process — it’s an integral part of it. This is an ambitious, thought-provoking book whose bold premise will be discussed and debated for some time to come. Highly recommended.”— Daniel Suarez, author of Daemon Other Editions Hardcover, 416 pagesViking, New YorkISBN: 978-0670022151 Paperback, 416 pagesPenguin, New YorkISBN: 978-0143120179 Kindle (US)Viking, New YorkISBN: 978-1101444467 Kindle (UK, DE, International)Kevin Kelly, PacificaISBN: 978-0972392570 iBookViking, New YorkISBN: 978-1101444467 NookViking, New YorkISBN: 978-1101444467 Audible, 15:10:00Tantor Audio, Old SaybrookISBN: 978-1400168859 Audio CD, 15:10:00Tantor Audio, Old SaybrookISBN: 978-1400118854 Translations