["https://kk.org/books/what-technology-wants"]
title = "What Technology Wants – Kevin Kelly"
full_description = "Books What Technology Wants BUY ON AMAZON All stores Amazon Barnes & Noble iBooks Books-A-Million Powell’s IndieBound Summary “More thriller than primer, this is the best technology book I have ever read.” — Nicholas Negroponte, author of Being Digital In this provocative book, one of today’s most respected thinkers turns the conversation about technology on its head by viewing technology as a natural system, an extension of biological evolution. By mapping the behavior of life, we paradoxically get a glimpse at where technology is headed-or “what it wants.” Kevin Kelly offers a dozen trajectories in the coming decades for this near-living system. And as we align ourselves with technology’s agenda, we can capture its colossal potential. This visionary and optimistic book explores how technology gives our lives greater meaning and is a must-read for anyone curious about the future.— Summary from Viking catalog Praise for What Technology Wants “A sweeping theory of technology . . . consistently provocative and intriguing.”— The Economist “An exuberant book . . . Kelly’s polymath erudition and infectious confidence will prove more than sufficient.”— The Washington Post “Bold . . . engaging . . . A sharp-eyed study of our absorbing need for cars, computers, and gadgets.”— The New York Times Book Review “A fascinating and enjoyable book packed with insight, which should be read by everyone concerned with how technology is shaping humanity.”— New Scientist For media queries, please contact: Kristin MatzenSenior Publicist, Viking and Penguin Books212-366-2226, kmatzen@penguinrandomhouse.com Reviews H+ Magazine, February 24, 2014Review: What Technology Wants by Kevin Kelly, Harry J. Bentham Download the Universe, June 22, 2012Telegraphing What Technology Wants, John Hawks strategy+business, November 22, 2011Best Business Books 2011: Technology, Michael Schrage John Battelle’s Searchblog, November 9, 2011Kevin Kelly’s “What Technology Wants”, John Battell