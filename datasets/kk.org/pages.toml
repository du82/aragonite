["https://kk.org/thetechnium/future-embarrassments"]
title = "The Technium: Future Embarrassments"
description = "Because moral progress is real (we improve our morality over time) new generations will inevitably see moral deficiencies in previous generations. To some degree we can guess and anticipate what they will find embarrassing about us today, but it will … Continue reading →"
full_description = "Because moral progress is real (we improve our morality over time) new generations will inevitably see moral deficiencies in previous generations. To some degree we can guess and anticipate what they will find embarrassing about us today, but it will be impossible to align ourselves fully with their view. The more we are immersed in today’s culture, the harder to see our future. So we just have to get used to the idea that our descendents will find many of the things we do and believe today to be eye-rolling embarrassing. With the caveat that most of these will be wrong, what are some possible future embarrassments?"
