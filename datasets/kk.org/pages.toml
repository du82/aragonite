["https://kk.org/thetechnium/robots-will-make-us-better-humans"]
title = "The Technium: Robots Will Make Us Better Humans"
description = "The paramount reason we put up with the churn of technology — always having to change and confront new problems — is that technology makes us better humans. It always has. Our humanity is something we invented over the course … Continue reading →"
full_description = "The paramount reason we put up with the churn of technology — always having to change and confront new problems — is that technology makes us better humans. It always has. Our humanity is something we invented over the course of a million years. It’s our first and most important “tool”. In fact, we ourselves — humans — are the first wild creations we domesticated, before wheat, corn, dogs, cows and chickens. We’ve been modifying ourselves, and our genes, since day 1. It’s true that most of our behavior is primitive, unchanged, ancient, and no different than our animal cousins. But not all. And it is these different bits that make us human. The 8 billion people alive on the planet today are not the same beings who walked through the Rift Valley millennia ago. We’ve changed our bodies, our minds, and our society. We are more human. When we domesticated fire by learning how to start it and manage it, we used it to cook our food. We took plants we had trouble digesting and figured out how to pre-digest them by cooking them with fire. Fire was among our very first tools. It was definitely a transforming invention. Over time this external stomach provided increased nutrition that helped our brains expand. It also changed our teeth and jaws. Archeologists can identify skulls of humans by our teeth and jaws. But we would not say our teeth are what define us, nor that they make us better. We might argue that having a bigger brain does in part define us. (We named ourselves Homo Sapiens, the brainy animal. ) When we make a list of those things that distinguish us from animals (and from machines) that becomes our working definition of human. If we can expand those same qualities, maybe improve them, then they would make us better humans. At our best, humans display these qualities: fairness, justice, mercy, ingenuity, self-consciousness, long-term thinking, deductive logic, intuition, transcendence, gratitude, imagination, creativity, and most important, empathy."
author = "Kevin Kelly"
year_published = 2025
clearnet = "https://kk.org/thetechnium/robots-will-make-us-better-humans"
