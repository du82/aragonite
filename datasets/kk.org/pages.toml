["http://kk.org/thetechnium/archives/2011/04/bicycle_haiku.php"]
title = "The Technium: Bicycle Haiku"
description = "In 1979 I rode my cheap bicycle from San Francisco to New York, with detours up to Oregon and down to Texas along the way. It took me three months of leisurely riding, with no training up front. I think … Continue reading →"
full_description = "In 1979 I rode my cheap bicycle from San Francisco to New York, with detours up to Oregon and down to Texas along the way. It took me three months of leisurely riding, with no training up front. I think I spent $500 for the whole trip. It was of course, a blazingly glorious journey, and not that hard. My rule of thumb was to never pass on opportunity to snack along the way, mostly as an excuse to stop and chat with whomever was around. I burned through a lot of junk food, but learned a lot about the US. The hardest part of the trip was not bringing my camera. As a former photoholic, this task was impossible, only made bearable by my resolution to do a sketch a day in a notebook instead. For for three months I created a sketch and a haiku per day. Sample pages from the book: A few years ago I printed up a bunch of paper book reproductions for friends, but that print run is almost gone. As an exercise in e-publishing, my webmaster and research assistant Camille Cloutier has migrated the book to the Kindle. So there is now an ebook version of Bicycle Haiku. This bit of amateur art can be diverted to your Kindle on Amazon for $2.99. There is an iBook version as well, but Apple has been slow in putting it up on their store. I enjoyed my ride across the continent so much that afterwards I wanted to produce a short how-to for other potential riders. I posted notices in travelers’s newsletters to locate about 150 other people who had ridden their bikes across and I asked them to fill out a questionnaire about their experience. The questions I asked were the Frequently Asked Questions that most transcontinental riders get along the way. Even though these answers were given 30 years ago, I think they are still valid and useful today. (A fuller more complete set of replies ran in the Whole Earth Review, in PDF here. As you’ll see, anyone can ride a bike across. It doesn’t take much money — food is about your only cost. And there really is no better way to see this country. I hope you do it."
author = "Kevin Kelly"
year_published = 2025
