["https://kk.org/thetechnium/1000_true_fans"]
title = "The Technium: 1,000 True Fans"
description = "This is an edited, updated version of an essay I wrote in 2008 when this now popular idea was embryonic and ragged. I recently rewrote it to convey the core ideas, minus out-of-date details. This revisited essay appears in Tim … Continue reading →"
full_description = "This is an edited, updated version of an essay I wrote in 2008 when this now popular idea was embryonic and ragged. I recently rewrote it to convey the core ideas, minus out-of-date details. This revisited essay appears in Tim Ferriss’ new book, Tools of Titans. I believe the 1,000 True Fans concept will be useful to anyone making things, or making things happen. If you still want to read the much longer original 2008 essay, you can get it after the end of this version. — KK To be a successful creator you don’t need millions. You don’t need millions of dollars or millions of customers, millions of clients or millions of fans. To make a living as a craftsperson, photographer, musician, designer, author, animator, app maker, entrepreneur, or inventor you need only thousands of true fans. A true fan is defined as a fan that will buy anything you produce. These diehard fans will drive 200 miles to see you sing; they will buy the hardback and paperback and audible versions of your book; they will purchase your next figurine sight unseen; they will pay for the “best-of” DVD version of your free youtube channel; they will come to your chef’s table once a month. If you have roughly a thousand of true fans like this (also known as super fans), you can make a living — if you are content to make a living but not a fortune. Here’s how the math works. You need to meet two criteria. First, you have to create enough each year that you can earn, on average, $100 profit from each true fan. That is easier to do in some arts and businesses than others, but it is a good creative challenge in every area because it is always easier and better to give your existing customers more, than it is to find new fans. Second, you must have a direct relationship with your fans. That is, they must pay you directly. You get to keep all of their support, unlike the small percent of their fees you might get from a music label, publisher, studio, retailer, or other intermediate. If you keep the full $100 of each true fan, then you need only 1,000 of them to earn $100,000 per year. That’s a living for most folks."
author = "Kevin Kelly"
year_published = 2025
