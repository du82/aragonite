["https://kk.org/thetechnium/paying-people-to-have-children"]
title = "The Technium: Paying people to have children"
description = "The most intractable problem I see in this century is the coming population implosion. (Climate change is a trackable problem; we know what we have to do.) On average, humans are not replacing themselves today, and beginning in a few … Continue reading →"
full_description = "The most intractable problem I see in this century is the coming population implosion. (Climate change is a trackable problem; we know what we have to do.) On average, humans are not replacing themselves today, and beginning in a few more decades, there will be fewer humans on this planet every year. nless something changes, the population goes to zero in another century. So far, there is no known solution to raising fertility rates once they have sunk below replacement levels. Nothing we have tried anywhere in the world has worked. Free daycare, apartments, and cash bonuses don’t do it. A possible solution to the fertility problem that has not been tried yet is paying families a real lot of money — a can’t-ignore-it amount of money — to have children. Millions of dollars! So far, when countries have awarded cash bonuses to families to have children it has been a few thousand or ten thousand dollars. That amount of bonus has not produced much difference. However if the sum was millions of dollars, it might make a difference. Last year there were about 3.6 million babies born in the US. If each family was paid $1 million dollars per child that is 3.6 trillion dollars in cost. That is almost the total amount of tax income the US collects, so maybe we only pay for the second or third child onward. How could we afford this? How can we NOT afford this? The alternative – clearer and clearer each year – is that beyond the peak global population reached somewhere later this century, without intervention, each year the planet will have fewer and fewer people. The average country will be losing population steadily, headed to zero. Immigration just shuffles the declining population around. We have no positive economic system that works for declining populations. (All economic prosperity in history has come with expanding populations.) However those countries who are able to persuade people to immigrate, or are able to increase their population via raising fertility rates, will have a decided economic advantage."
author = "Kevin Kelly"
year_published = 2025
