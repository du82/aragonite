full_description = "This collection of data includes the following indicators, dates, and sources: violent/property crime rates, 1994-2015, U.S. Dept. of Justice white collar crime prosecutions, 1995-2015, TRAC executions, 1976-2016 & 1608-2002, Death Penalty Info Center adult correctional population, 2014-1980, DoJ incarceration rate, 1925-2014, DoJ and Sourcebook of Criminal Justice Stats state and federal confinement and community facilities, 1979-2005 (quinquennial), DoJ Note: The violent crime figures include the offenses of murder, rape (legacy definition), robbery, and aggravated assault. Note: The property crime figures include the offenses of burglary, larceny-theft, and motor vehicle thefts. Src for 1996-2015: U.S. Department of Justice. Accessed October 24, 2016. “Crime in the United States 2015.” Table 1: Crime in the United States. Src for 1994, 1995: U.S. Department of Justice. Accessed October 24, 2016. “Crime in the United States 1995.” Section II: Crime Index Offenses Reported [PDF] For every 100,000 people in the United States, there are 5,317 arrests that are directly related to white collar crime. In August 2014, it was reported that there were 512 total white collar prosecutions that occurred in the United States. It is estimated that 1 out of every 4 households will become the victim of a white collar crime at some point. More than 88% of white collar crime incidents are never reported to law enforcement agencies, although about half of all incidents are reported to someone, such as a supervisor. White collar crime has been moving away from stealing money from companies to stealing money from people. The most frequently cited charge that leads a prosecution attempt is aggravated identity theft. This charge accounts for 18.6% of the total charges that were filed within the last month. Mail fraud or conspiracy charges to commit offenses that defraud the country are also popular charges that are filed. In total, however, bank fraud and wire fraud are still the most popular white collar offenses that are investigated."
