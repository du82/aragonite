full_description = "Average income growth has been a key reason behind these different trends in the quality of the housing stock. The urbanisation process in China has transferred large numbers of workers from relatively low productivity jobs in the rural sector to higher productivity jobs in urban areas. This movement has been a driver of the rapid growth in incomes in China over the past three decades, which has far exceeded the growth in incomes in India (Graph 7). Over time, Chinese households have chosen to spend their higher income on higher quality dwellings and dwellings with larger floor space and, as a consequence, the share of concrete dwellings and residential floor space per capita has increased. Note: This graphic is a very rough assembly of data reported in mass media publications (not well-cited). src: Reddit user chyken “Comparing average house size in US to Europe, 1950-2015 [OC]” citing US Census, Elle Decor, Apartment Therapy, Not Buying Anything src: Demographia (Wendell Cox), 2006 (data via IA) “International House Sizes” citing Japan Statistical Yearbook, European Housing 2002, Australian Bureau of Statistics, Canadian Home Builders Association, Infometrics. src: Shrink That Footprint, 2013 (date via IA) “How big is a house? Average house size by country” Make extrapolated charts for the following: Monotheism vs. Other & non-affiliated Ecommerce vs. Physical retail sales Global urban population Average house size KEVIN: I’M HAVING TROUBLE UNDERSTANDING WHY THESE LINES DON’T CROSS AT 50%. THESE CURVES DON’T SEEM TO BE DIRECTLY CORRELATED. In this chart, Christians, Muslims, and Jewish adherents are grouped in the Monotheistic adherents category. The red line includes the religiously unaffiliated, Buddhists, Hindus, followers of folk religions, and other religious adherents. Additional methodology on how Pew defined religious groups is available here. 2010 Monotheistic religions Christians 78.3 Jews 1.8 Muslims 0.9 Other Unaffiliated 16.4 Buddhists 1.2 Folk Relions 0.2 Hindus 0.6 Other Religions 0.6"
