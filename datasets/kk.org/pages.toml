["https://kk.org/extrapolations/category/technology"]
title = "Extrapolations: technology"
full_description = "ASK Extrapolate to 2050: Individual daily consumption of all media (web-based and traditional) Individual daily consumption of social media Zenith (a media agency) tracks this info on a global scale (I’ve not found other sources). They’ve only been publishing reports for the last four years, but I found a Recode article that interviews the head of forecasting at Zenith (Jonathan Barnard). This article provides historic data back to 2010, and forecasts to 2019, contrasting North America with the global average. The article was published in May 2017, and Zenith published a new report in 2018 with slightly different data for the last few years and looking forward, but the most recent report does not provide the context of the previous 10 years. For consistency of methodology, I’ve just used the data quoted by Recode for the following extrapolation. [Excerpts from all four published Zenith reports are below, showing the yearly revision to their data. In summary, the estimates become more conservative with each subsequent report up until the latest report, which shows a jump again.] src: Recode, May 2017 “People consumed more media than ever last year — but growth is slowing” figure: Average individual daily media consumption in minutes citing Zenith (appears to be from their 2017 report, including historic data available not freely accessible). Here are excerpts from the press releases for the annual “Media Consumption Forecasts” by Zenith. From the 2018 Report: 2018: 479 minutes per day consuming media 12% more than in 2011 2020: 492 min/day From the 2017 report: 2019: less than 1% growth 2017: same as 2016 2016: 456 min/day 2010: 411 min/day eMarketer and Statista both provide estimates of daily social media consumption. The eMarketer figures cover the US, and the Statista figures are global. Upon first inspection of the data, the Statista figures seem to be roughly 3X higher than eMarketer’s figures, a disparity that does not agree with my understanding of the variation by country (see We Are Social chart below). I’m quite confident that Statista’s data actually comes from marketing firm Global Web Index, and their recent report (which does not include all the historic info available at Statista) makes frequent passing reference to the increasing amount of time users are watching video on social platforms. In reading various qualitative discussions of social media use, I find many sources group YouTube and Facebook minutes of use together under the social category."
