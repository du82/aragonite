["https://kk.org/streetuse/2007/10"]
title = "Street Use: 2007 : October"
full_description = "The wheel itself is a 5 foot diameter hoop of 2 inch tube. It was a bit beyond what I can do so was made for me by The Angle Ring Company . The pulleys on which it runs were custom-made by AED rollers. Everything else was cut, bent and welded in my shed! The engine is a 90cc four stroke from a Chinese quad bike. I was initially going to use the engine/wheel unit from a 50cc scooter but the wheel was too big and the two stroke power delivery can be a bit peaky! The quad engine is fully auto with electric start. The friction drive wheel is the rear wheel from a mini moto. It has a cable-operated disc brake which must be used with extreme caution. The tyre on the outer wheel is three 24 inch mountain bike tyres cut up and pop riveted on. There seems to be no end to the ingenuity of African kids in making up simple toys with wheels. Previously we’ve seen trucks and planes. Here are toy “cars” you can steer without bending down. The kids add long handles to wheels. How cool is that? This pictures were found on Afrigadget. A few artists discovered an apartment-sized vacant space under a mall in Providence, RI, and over several years proceeded to build a living space which they furnished (with things bought at the mall) as an “art piece.” The project was called Trummerkind, which is what the Germans called the children and orphans who lived in alleys and abandonded buildings after WWII. Chief architect of the apartment within the mall was Michael Townsend. He writes on Trummerkind that he got the idea while watching the construction of the mall and noticed the vacant space within it. Starting in 2003 I committed to the idea of creating a luxury apartment in the mall. Life from within the mall was committed to the pursuit of normalcy and the purchase of objects and clothing that would help define me an active participant in the great things the mall has to offer. During the Christmas season of 2003 and 2004, radio ads for the Providence Place Mall featured an enthusiastic female voice talking about how great it would be if you (we) could live at the mall. The central theme of the ads was that the mall not only provided a rich shopping experience, but also had all the things that one would need to survive and lead a healthy life. This, along with a wide variety of theoretical musings about my relationship to the mall – as a citizen and public artists – provided the final catalyst for making the apartment."
author = "Kevin Kelly"
year_published = 2025
