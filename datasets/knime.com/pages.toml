["https://knime.com/success-story/how-allente-built-recommendation-engine-deliver-personalized-content"]
title = "How Allente built a recommendation engine to deliver personalized content | KNIME"
description = "Viewers are increasingly moving away from traditional TV to specialized media providers streaming the exact content they want. Allente offers streaming services, IPTV solutions, and fiber broadband to more than one million customers in Sweden, Norway, Denmark, and Finland."
full_description = "Viewers are increasingly moving away from traditional TV to specialized media providers streaming the exact content they want. Allente offers streaming services, IPTV solutions, and fiber broadband to more than one million customers in Sweden, Norway, Denmark, and Finland. While streaming media providers make huge amounts of content choices available to their customers, searching through the library for content they might like to watch can lead to decision fatigue and hamper the viewer experience. In the age of multiple streaming services, this can mean losing a customer to a competitor. To combat that and provide its viewers a better experience, Allente needed a way to deliver customized recommendations to help its viewers reduce the time to find the videos they would be interested in watching. Allente knew that to achieve this as fast as possible, they would need a data science platform that offered simplicity of setup and use while delivering the analytic depth to explore data, build models, and deploy them within the same platform. As an end-to-end data science platform, KNIME perfectly met these requirements. It was an easy decision for Allente to embrace KNIME as its central data science platform to deliver highly relevant, AI-powered recommendations to its viewers. Together with Redfield, a KNIME partner, Allente set out to build a recommendation engine using KNIME. The first step in building the recommendation engine was to connect to Allente’s main data sources in the cloud and on-premises and make sense of the troves of data they held such as event data, video-on-demand catalog, and sample tables from its legacy Oracle database. With KNIME, they built an automated data pipeline that let them connect to these varied data sources, get the data into the right shape, and categorize it into key customer segments easily in one intuitive, visual workflow environment. Once the key customer segments were defined, Redfield and Allente built and deployed the content recommendation model in the same visual environment offered by KNIME. This involved having the flexibility to code customer segments using Python, optimizing and refining them to improve the accuracy of recommendations, and finally, testing and production, all without switching tools."
