["https://knime.com/success-story/how-anadolu-sigorta-improved-their-fraud-detection-rate-51-knime"]
title = "How Anadolu Sigorta improved their fraud detection rate by 51% with KNIME | KNIME"
description = "Anadolu Sigorta is a privately owned insurance company with offerings in non-life areas, including fire, marine, agriculture, health, and more. With 2,500 agencies in Turkey, the company plays an important role in the development of the insurance industry and in the modernization of the country’s socioeconomic environment."
full_description = "Anadolu Sigorta is a privately owned insurance company with offerings in non-life areas, including fire, marine, agriculture, health, and more. With 2,500 agencies in Turkey, the company plays an important role in the development of the insurance industry and in the modernization of the country’s socioeconomic environment. Backed by a strong capital base and advanced infrastructure, the company takes a pioneering approach to insurance, focused on customer satisfaction and encouraging the spread of insurance awareness throughout the country. Their unchanging principle of paying claims immediately and in full has been a source of confidence for the Turkish community. Fraud is becoming more prevalent across many different industries today, taking place in insurance more than others. Due to the large number of services included in different policy coverages, detecting fraud has become more challenging (and more necessary) for Anadolu Sigorta and others in the business. Insurance fraud can happen in two ways: a report of false or deceptive accident conditions by the policyholder themself or an organized fraudster submitting false reports using the car owner’s information (third-party offense). Anadolu Sigorta processes approximately 3,500 of these transactions a day. A transaction could be a net new claim or claim that needs reprocessing. Each claim must go through several phases or “touch points” (a very complex and time-consuming process) and might need to be processed more than once. Fraudulent claims that relate to property damage or personal injury are also extremely difficult to prove, take a lot of time and research, and could be identified as a false positive. Detecting an organized fraud ring in motor insurance is also done by manual research and can take two to three months to fully investigate. Due to the large amount of services included in insurance coverage, the complexity of processing a claim, and trying to prove the claim, Anadolu Sigorta needed an analytics approach that could streamline, expedite, and simplify the process."
