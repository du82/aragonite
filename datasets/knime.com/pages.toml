full_description = "At KNIME, we develop software to the highest standards of privacy and security that organizations can trust. As an organization, we are aware of our responsibilities to the community, particularly around good governance, social responsibility and the environment. KNIME Software is comprised of KNIME Analytics Platform and KNIME Business Hub. The software is generally installed on an organization’s choice of infrastructure, whether local, cloud or hybrid. This means the software had built-in capabilities designed to leverage an organization’s existing policies and approaches whenever possible. KNIME also provides KNIME Community Teams, KNIME Software as a service (SAAS) for small teams. If you are planning to use the software this way, please refer here for detailed information. Each topic in this document covers KNIME (the company) and KNIME Software being used by an organization on its choice of infrastructure. We are committed to providing safe and secure software. We do this by following industry standards for running an organization (demonstrated by our ISO 27001 certification, available on request here) as well as documenting our Secure Software Development Framework, available here. The software includes comprehensive security capabilities that are highly adaptable to ensure enterprises can implement and test their own security compliance on their usage of KNIME Software. This includes such topics as User and Asset Management, Data Transfer, controlled deployment and extensive monitoring and logging capabilities of all aspects around the running of the software. Extensive examples, best practices and documentation are available. All these measures and established processes ensure that your data and systems are as safe as possible. KNIME does not process your data. The data you process is done via KNIME Software on your chosen infrastructure, and you are in complete control. The company collects only the data necessary for providing and improving its services, adhering to global privacy regulations like GDPR and CCPA. Users that interact with us have control over their data, with options to access, update, or delete personal information at any time."
