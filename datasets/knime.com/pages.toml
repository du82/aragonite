["https://knime.com/success-story/how-audi-forecast-their-supply-chain-with-knime"]
title = "How Audi Forecast Their Supply Chain With KNIME | KNIME"
description = "Struggling with your supply chain management forecasting? Learn how Audi used KNIME to save €30k per year on one automation and reduce debugging expenses by 80%."
full_description = "Getting supply chain management right is the top priority for any business working in manufacturing. If there are too many raw goods coming in, you risk damaged assets through lack of warehouse space to house them. If there aren’t enough raw goods coming in, production gets delayed. Leading automotive company Audi knows better than most that fine-tuning supply chain management forecasts to within an acceptable risk tolerance is a balancing act. But an all important one that keeps the business running like a well-oiled machine. In this article we’ll talk about how Audi used KNIME to create supply chain forecasts that keep production running like clockwork. In the real world, we don’t always have all the data we need on hand to make decisions. That’s when we need to look to predictive AI and modeling to create forecasts. “One problem we often face is the question of how will our stock levels in the warehouses develop over the coming weeks and this is a very important question, because based on this question many decisions in supply chain management and in the steering of our supply chain are made.” Supply chain management decisions are high stakes because they need to be made quickly and one error can cause a huge knock-on impact that can have both balance sheet and P&L impact. For example, if goods are shipped to warehouses without the space to hold them, they could end up being damaged by the elements when stored outside. Or if goods arrive too late, the assembly line may end up lacking necessary parts to complete orders, causing delays. Audi decided to use KNIME to improve the speed and accuracy of their supply chain management forecasting, so they could solve the following problems: Audi has complete data on what supplies they’ve ordered, what parts are needed for production, and what’s currently in production. But two key pieces of information are incomplete: The supply chain forecast Audi built in KNIME uses predictive AI to present the most likely scenario for warehouse stock levels within a confidence range. When stock looks like it may approach the warehouse limit, the team now has enough time to call off orders of goods until there are more sales orders where those goods will be used."
year_published = 2025
