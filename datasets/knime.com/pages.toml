["https://knime.com/blog/students-oklahoma-state-university-competing-internships-siemens-healthineers"]
title = "Students at Oklahoma State University competing for internships at Siemens Healthineers | KNIME"
description = "Oklahoma State University, Siemens Healthineers, and KNIME announced the Predicting and Explaining Injury Severity in Automobile Accidents challenge, where students can compete for an internship at Siemens Healthineers."
full_description = "Stillwater, OK, Austin, TX, Charlotte, NC, November 6, 2023 — Oklahoma State University, Siemens Healthineers, and KNIME, the open source data science company, recently announced the Predicting and Explaining Injury Severity in Automobile Accidents challenge for Prof. Dursun Delen’s students. The students attend Delen’s “MSIS 5633 - Predictive Analytics Technologies” course, offered by the university’s Spears School of Business during the Fall semester. Prof. Delen has selected the theme, task, and data, while KNIME will provide support for the students, professional practical expertise, and awards for the winning teams. This is the first challenge to be jointly organized with a corporate sponsor: Siemens Healthineers will offer members of the winning team the opportunity to intern for 4-8 months in their Customer Finance group in Cary, NC, during Spring or Summer 2024. This comes out of a close collaboration between KNIME and Siemens Healthineers to connect the company’s expanding KNIME community with institutions and lecturers teaching KNIME. In this challenge, students will split into teams of two and will work with large, feature-rich data sources to design and develop predictive and explanatory models to investigate the reasons/factors leading to severe injuries in car crashes. The goal is to provide workflows for model training and predictions, as well as reports to explain these. Projects will be submitted by Nov. 26, 2023, and presented to an assessment committee that will determine the winning teams based on the accuracy, complexity, cleanness, usability, and documentation of their projects. KNIME’s open-source KNIME Analytics Platform has been one of Prof. Delen’s tools of choice for his classes for several years and is the suggested tool for this student challenge. He has actively written about its advantages in multiple outlets like INFORMS ORMS Today magazine and the KNIME Blog. Students who participate in the challenge will have access to KNIME certification exams, textbooks by KNIME Press, and digital participation badges. The top three teams will also be invited to a video award ceremony and will receive trophies and gadget bags. About Oklahoma State University: Oklahoma State University is a modern land-grant university that prepares students for success. OSU has more than 34,000 students across its five-campus system and more than 25,000 on its combined Stillwater and Tulsa campuses, with students from all 50 states and more than 125 nations. Established in 1890, OSU has graduated more than 280,000 students to serve the state of Oklahoma, the nation, and the world. About Siemens Healthineers: Siemens Healthineers pioneers breakthroughs in healthcare. For everyone. Everywhere. Sustainably. The company is a global provider of healthcare equipment, solutions and services, with activities in more than 180 countries and direct representation in more than 70. The group comprises Siemens Healthineers AG, listed as SHL in Frankfurt, Germany, and its subsidiaries. As a leading medical technology company, Siemens Healthineers is committed to improving access to healthcare for underserved communities worldwide and is striving to overcome the most threatening diseases. The company is principally active in the areas of imaging, diagnostics, cancer care and minimally invasive therapies, augmented by digital technology and artificial intelligence. In fiscal 2023, which ended on September 30, 2023, Siemens Healthineers had approximately 71,000 employees worldwide and generated revenue of around €21.7 billion. About KNIME: KNIME software bridges the worlds of dashboards and advanced analytics through an intuitive interface, appropriate for anybody working with data. It empowers more business experts to be self-sufficient and more data experts to push the business to the bleeding edge of modern data science, integrating the latest AI and machine learning techniques. KNIME is distinct in its open approach, which ensures easy adoption and future-proof access to new technologies. facebooktwitterxinglinkedinmailSign up to our mailing list"
