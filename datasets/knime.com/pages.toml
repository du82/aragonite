["https://knime.com/success-story/how-amd-streamlines-and-scales-insight-delivery-to-end-users"]
title = "How AMD streamlines and scales insight delivery to end users | KNIME"
description = "Having access to industry and customer trends allows companies to stay competitive and meet market demands. But gathering market intelligence data comes with a lot of challenges: accuracy and reliability of data sources, ensuring timeliness of the data, the need to collect from multiple and disparate sources, and the need to pull only specific information."
full_description = "Having access to industry and customer trends allows companies to stay competitive and meet market demands. But gathering market intelligence data comes with a lot of challenges: accuracy and reliability of data sources, ensuring timeliness of the data, the need to collect from multiple and disparate sources, and the need to pull only specific information. Once you’re past those battles, you need to tackle data prep: cleaning the data, combining the data, and making it usable. That’s not easy when you’re dealing with very large data sets, especially if you’re working in spreadsheets that can only handle so much. Documentation is also a challenge if the tool you’re using doesn’t allow you to easily retrace your steps and debug errors. These are the everyday challenges of Market Insight Manager Laura Rutledge, and her team at AMD. As a market intelligence team in the semiconductor industry, they analyze total addressable market (TAM) data for strategic business decision making. They deliver this data to the business via Excel flat files/pivots and through automated delivery systems (PowerBI dashboards, etc.). Meaning they need a seamless and fast way to get market data and forecasts over to line of business individuals and other stakeholders. Her team gathers data from multiple sources daily, using third-party data and their own forecasts. They purchase syndicated data (retail and distribution) on a weekly and monthly basis, review supply chain data (e.g., AMD selling components to Dell), and track data through three different stages of the supply chain. Additionally, they use TAM data to size markets, which is then used to calculate AMD market shares by account, geography, and more. Their goal as a team is to ensure they are using the most up-to-date data for their forecasts and present it in a way that provides the entire business with a single source of truth. This is where Laura and her team use KNIME Analytics Platform, a free and open source data analytics tool that can handle large data sets and connect to any data source or database. This makes it much easier for Laura and her team to process the vast amount of data they need daily and consolidate data from different sources. They also use KNIME to clean their data, analyze it, and visualize the results."
