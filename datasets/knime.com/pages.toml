["https://knime.com/about"]
title = "About KNIME | KNIME"
full_description = "Meet the team that aims to advance the impact and understanding of data science through visual programming and being the sober voice in a cluttered and often overhyped space. KNIME is an open source platform built to productionize data science from day 1 by a team with a strong scientific background. Today it has a strong user community of 300,000+ across all industries and in over 60 countries. There’s a general agreement that opening up previously closed or exclusive platforms, processes, tools, organizational boundaries, idea sourcing or funding can speed up innovation. At KNIME, we know that there is something inherently advantageous in the way open platforms and their communities are designed that accelerates data-driven innovation."
