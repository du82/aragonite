["https://knime.com/contributor-of-the-month-hall-of-fame"]
title = "Contributor of the Month | KNIME"
description = "KNIME Community members contributing data science knowledge, best practice, and tips and tricks via blogs, videos, support, and more."
full_description = "This month we highlight the contributions of Dr. Lingbo Liu, a research associate at Harvard University’s Center for Geographic Analysis (CGA). Dr Liu leads the Spatial Data Lab project at the CGA, focusing on the development of advanced geospatial models and an open-source visual programming platform for GeoAI research, as well as training programs to democratize geospatial data science. As part of that work, he and his team have released (and are continuing to actively develop) the Geospatial Analytics Extension for KNIME. This month we celebrate three of our 2024 Just KNIME It (JKI) KNinjas - Toshiyuki Ohfusa, Takanobu Araki, and Yuki Mizukami. Coincidentally, all three are involved with drug discovery research in Japan, but they were selected for their excellent workflow building skill demonstrated throughout each of the 30 challenges presented this year in the JKI program. Check out some of their innovative JKI solutions on the KNIME Community Hub in the links above, and be sure to join the upcoming JKI season 4 - maybe next year the KNinja will be you! This month we have twin awardees from the Twin Cities of Minnesota - Pedro Medina of Haystack Data Solutions, and Nick Haylund of phData. Both Pedro and Nick have been instrumental in organizing KNIME Data Connect events in the Minneapolis / St. Paul area, and have been involved in other ways besides. Pedro’s My Data Guest appearance was a highlight, he’s featured articles about KNIME in his newsletter, and has been a helpful presence on the KNIME forum. Nick, meanwhile, got the phData team involved in the creation of the Alteryx to KNIME Cheatsheet, a key reference for the community. Fabiola Martina, our inductee for December 2024, is an Operational Excellence Manager at Siemens Healthineers in the US. At her company, she served as host for interns from Oklahoma State University, winners of a KNIME student challenge there. She also offered her expertise in a panel discussion at a recent KNIME Summit, and you’ll be able to catch her in an upcoming episode of our podcast, My Data Guest. For her efforts as a key liaison for KNIME between academia and industry, we’re happy to recognize her this month."
