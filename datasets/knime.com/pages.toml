["https://knime.com/events/productionizing-data-apps-0225"]
title = "[L3-DA] Productionizing Data Apps | KNIME"
description = "You have developed a nice data app with KNIME Analytics Platform. What are the next steps to productionize it? In this course we will show you what to do to get your data app up and running, including: testing, deployment on KNIME Business Hub, permissions & versioning, custom styling, orchestration, and more."
full_description = "You have developed a nice data app with KNIME Analytics Platform. What are the next steps to productionize it? In this course we will show you what to do to get your data app up and running, including: testing, deployment on KNIME Business Hub, permissions & versioning, custom styling, orchestration, and more. The course includes sentiment analysis workflows that can be used over any type of text, and a “what country has this flag?” game that is implemented as a data app. Besides learning about data apps in KNIME, you will have multiple workflows that can be adapted to your needs by the end of the course. In the first session of this course, you will learn what needs to be checked before deploying a data app on KNIME Business Hub. In the second session, you will be introduced to KNIME Business Hub — including how to upload workflows and deploy them as data apps or workflow schedules. Next, in the third session, you will learn how to create interactive data apps that can be deployed on KNIME Business Hub and made available as web browser applications. Finally, in the fourth session, you will learn about runtime optimization, workflow orchestration, and general best practices. We wrap up in a fifth session with exercise solutions. This is an instructor-led course consisting of four, 75-minutes online sessions run by our KNIME data scientists and/or solution engineers. Each session has an exercise for you to complete at home and together, we will go through the solution at the start of the following session. The course concludes with a 15 to 30-minute wrap up session. You first need to create an account on the KNIME Learning Store. After you log on to the KNIME Learning Store, clicking on the “Register now” button will take you to the course web page. You should already know how to build workflows and components using KNIME Analytics Platform. Knowledge and expertise equivalent to our advanced KNIME Analytics Platform courses (L2-level) are recommended. You can join the course using the Zoom links found in your LearnUpon course page. Please note that each Zoom link is specific to a particular session. Make sure you have a stable internet connection!"
