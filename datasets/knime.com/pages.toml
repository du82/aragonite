title = "Getting Started Guide | KNIME"
description = "Table of Contents What is KNIME Analytics Platform?Getting set up with KNIME Analytics PlatformBuild your first workflowNodes and workflows"
full_description = 'KNIME Analytics Platform is an open source software with an intuitive, visual interface that lets you build analyses of any complexity level - from automating spreadsheets to ETL to machine learning. A more detailed explanation of the different views in the KNIME Workbench is provided in the KNIME Analytics Platform User Guide. Once you have installed KNIME Analytics Platform, you can start analyzing your data right away. The entry page is the first thing you will see. Here you can access three example workflows to get started, or, if you’re following along with this guide, create your first workflow from scratch. After you created your first empty workflow, you can start by dragging and dropping your data into the workflow editor to read them in and add nodes from the node repository to build your workflow. Each node performs a specific task and helps you proceed quickly into the manipulation, cleaning, and visualization of your data. Connect the node’s ports to let the data flow from left to right into your workflow. Drag and drop a connection into an empty area inside the workflow canvas to display the quick node adding panel. Up to twelve nodes to help you build your workflow easier and faster are suggested. Also, you can search in the panel for all compatible nodes. Click the desired node to add it. You can follow along with this guide by either downloading the workflow and reading the guide to better understand it, or, attempting to build the workflow on your own. Either way, you can access the workflow at any time on KNIME Community Hub. Now let’s say that you have some data that you want to process, analyze and visualize. With the following example workflow, you will read, combine, clean, and summarize data from multiple Excel sheets. Then you will calculate the total volume of a cargo that carries furniture from one house to another. To get started, first download the xls file that contains the data that you are going to use in the workflow. Open your KNIME Analytics Platform and create a new, empty workflow by clicking the "Create new workflow" button on the entry page.'
