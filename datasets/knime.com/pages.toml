["https://knime.com/just-knime-it"]
title = "Just KNIME It! | KNIME"
description = "Data Science Challenges: Workflow Wednesdays with KNIME"
full_description = "Prove your KNIME knowledge and practice your workflow building skills by solving our weekly challenges! Can you become one of our top Just KNIME It! KNinjas? Description: Christmas is right on the corner, and many of those who celebrate it are currently looking for souvenirs and gifts for their loved ones. To facilitate their search, let’s create a data app that allows people to find nearby Christmas markets given an address and a maximum distance. Data app users should be able to visualize the locations, along with their distances from the given address. In our example, we focus on the Berlin Christmas markets of 2023, but feel free to experiment with other geospatial datasets that have information on Christmas markets. Hint: Since the dataset is in German, you can use the Translator component from KNIME Community Hub to translate the addresses.Author: Sanket JoshiDataset: Christmas Market Data in the KNIME Community HubSolution Summary: To solve this challenge, we read the list of Christmas markets in Berlin, translate the column names from German to English, transform the market addresses into geometries that can be plotted on a map, and used in search, and then create a dashboard that allows users to type an address and get a list of the closest Christmas markets. This dashboards also details the distances between the given address and the markets, and plots the markets onto a map. Level: MediumDescription: As a data scientist working in finance, you are tasked with researching the current crypto market. Perform a GET request on the provided API to obtain up-to-date information, convert the data so that each token/crypto has its own row, and extract the name of the crypto, 'marketCapUSD' , and column 'changePercent24Hr' from the JSON body. With this data at hand, obtain the top 10 gainers and losers in the current crypto market and visualize them with a simple tree map. The size of each crypto should be scaled off the market cap, and its color should be determined by whether or not the percent change is positive (green) or negative (red). Hint 1: Use the Generic ECharts View for the tree map. Here's an example of a simple tree map visualization that can be useful. Hint 2: Tree maps usually do not display negative values. One simple way to handle it is to use an absolute value.Author: Thor LandstromSolution Summary: We solve this challenge by performing a GET request to the given API, and then cleaning the result to isolate the names of each crypto and their percent change in value over the previous 24 hours. Next, we select the top 10 crypto markets that gained the most in value and the top 10 crypto markets that lost the most. With this information, we create a simple tree map visualization with colors encoding the gaining and losing markets, such that their sizes in the tree map are also proportional to their gains or losses."
