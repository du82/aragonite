full_description = "Leverage an ever-growing library of extensions, join the global community, contribute to data-driven innovation. Choose from a wide range of extensions developed by the KNIME team for integrating specific functionality like text processing or geospatial; connecting to your favorite data warehouses or lake, third party application, popular machine learning libraries, and more. KNIME’s platform is used in hundreds of use cases across many areas in organizations – in many cases, our partners supplement with their own domain or tool-specific integrations. All partner contributions are vetted by the KNIME team. Data science is a fast moving field with a lot of experimental technology, regularly added and deprecated from data professionals’ toolbelts. Our community members regularly add new features and tech that is not yet widely adopted. Leverage a trusted extension that’s vetted by KNIME, or an experimental extension to tinker with new technology (in these cases, backwards compatibility is not guaranteed). Community extensions are released with an open-source license, whereas a partner extension is either licensed under a non-open source license or requires an additional license of a third party tool to be functional."
