description = "KNIME announces the winners of the 2024 Partner Awards for demonstrating excellence in driving innovation and implementation of customer solutions."
full_description = '''INFOCOM and Equinoxys are the winners of the KNIME Partner and Innovation Partner of the Year 2024 respectively for their outstanding contributions and achievements. The KNIME Partner Team announced the winners of the 2024 KNIME Partner Awards on the first day of the KNIME Spring Summit in Austin. "These awards are a testament to the strength and support of our entire partner network. KNIME is delighted to partner with such dedicated organizations. We are happy to recognize Infocom and Equinoxys for their exceptional achievements, which exemplify the impact our partners can have," says Vincenzo Tursi, Partner Director at KNIME. Join us in celebrating the excellence and innovation demonstrated by these extraordinary individuals and organizations who have truly embraced the KNIME spirit of open collaboration and data-driven success. Congratulations to the winners: KNIME Partner of the Year 2024: INFOCOM INFOCOM takes the KNIME Partner of the Year award for a second year in a row for their exceptional commitment to driving business growth and delivering impactful customer service and solutions using KNIME. Their unwavering focus on customer success and dedication to promoting KNIME through community engagements such as the KNIME Data Talks Japan, and commercial activities continue to make headway for KNIME in the Japanese market. KNIME Innovation Partner of the Year 2024: Equinoxys Equinoxys continues to push the boundaries of innovation and transformation within the US federal government, by applying KNIME's robust capabilities and their deep domain expertise. Equinoxys’ forward-thinking approach has redefined how advanced data analytics can be leveraged at the FDA to increase efficiency and reduce time-to-launch from “3 months to one click.” By contributing their success story to be published on knime.com they are inspiring others to think outside the box. Partners at KNIME Partners are a critical aspect of the KNIME ecosystem, providing the specific industry knowledge and the capabilities that our customers leverage to successfully deploy KNIME in the enterprise, and at scale. Partners drive innovation into our open source ecosystem and they help KNIME provide local support and consulting in locations where there is no KNIME office. If you’re looking for a partner to provide services for you, you can find what you’re looking for in the list of KNIME Trusted Partners. If you're interested in becoming a KNIME Partner, read about the Partner Program benefits. AuthorKNIME TeamfacebooktwitterxinglinkedinmailSign up to our mailing list'''
