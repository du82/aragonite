description = "Our aim is to build the most intuitive and widely-used environment for data science and give the community easy access to powerful capabilities. Would you like to be involved?"
full_description = "Our aim is to build the most intuitive and widely-used environment for data science and give the community easy access to powerful capabilities. Would you like to be involved? Become a member of a highly interactive team and be part of a diverse group of people from a wide range of professional and cultural backgrounds. There are opportunities to seize if you'd like to develop a career at KNIME and we encourage you to be proactive in steering your course. We hire people who are good at what they do. But just as important is that we are a good match so we invest a lot of time in hiring trying to make sure that you feel well with the team. Taking the time to (e)-meet with colleagues and get to know each other is something we value and simply enjoy doing. We regularly organize (e)-meetings and retreats to work on special projects; we also love to barbecue, play shuffle, or take on colleagues for a round of billiards! We do everything we can to make sure that the great things about working in a small company are not lost as KNIME grows: Forming friendships and close bonds with colleagues, learning new skills from each other, and enjoying the feeling of being part of something that could be big. We have captured the KNIME character in words and set this description down as our mission and values. Get a deeper sense of what we do at KNIME and how we do it."
