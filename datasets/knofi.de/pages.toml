["http://knofi.de/feinkost-restaurant"]
title = "Ihr Knofi | Feinkost  Restaurant & Partyservice in Berlin Kreuzberg"
full_description = "Der Feinkostladen in der Bergmannstrasse ist das Stammgeschäft, das die Familie Celik‘s schon seit 1986 als Familienbetrieb führen. Ursprünglich als typisch türkischer Lebensmittelladen mit Fleischerei konzipiert, hat er seitdem einige Wandlungen erfahren. Als Frau Senay Celik, Mitte der 90er Jahre den Betrieb von seinem Vater übernahm, steckte sie gerade in ihrer vegetarischen Phase, woraufhin sie beschloss alles Fleisch aus ihrem Geschäft zu verbannen. Stattdessen verkaufte Sie köstliche Pasten, Käse Crèmes, türkische Salate, orientalische Snacks in eigener Herstellung. Das war der Beginn einer Erfolgsgeschichte, denn mittlerweile hat sich das Feinkostsortiment ausgeweitet: Zum Einem durch den Umbau des Ladens, im Jahr 2010, und dem neuen Platz für den Gastronomie Bereich, mit einer umfangreichen Speisekarte. Überwiegend türkische Speisen, aber auch persische und marokkanische Speisen werden in der eigenen Großküche liebevoll gefertigt. Zwei Vitrinen spiegeln die Vielfältigkeit der mediterranen Küche ab. Ein umfangreiches internationales Weinangebot, hochwertige Öle, besondere Essig Essenzen, ausgewählte Nudelsorten, seltene Gewürze und Salze, wohlschmeckende Schokoladen runden das Feinkost Angebot ab. Zum Zweiten entstand ein Cateringbereich, das für Berlin einzigartig ist, denn Knofi Party Service bringt den Orient nach Hause. Festplatten, Suppen, Hauptgerichte, Desserts & Torten werden geliefert oder stehen zur Abholung bereit, wenn gewünscht vegan, vegetarisch oder lactosefrei. Mittlerweile bietet Knofi auch wieder Fleisch an, nun aber zubereitet, schonend gebraten und geschmort mit auserwählten Zutaten. Für jeden Anlass liefern wir Getränke, Geschirr, Gläser und Servicekräfte. Seit dem Jahr 2000 kam in der Bergmannstrasse, gegenüber des Feinkostladens, noch die sogenannte Bäckerei hinzu, eigentlich ein Bistro & Restaurant. Auch hier locken die vielfältigen Leckereien: Frische Brötchen, Bio Brote, hausgemache Kekse und herzhafte, gefüllte Gebäcke, nach originalen türkischen Rezepten, wie z.B.: Poaca oder Kayik Pike."
year_published = 2025
clearnet = "http://knofi.de/feinkost-restaurant"
tags = ["bistro", "bäckerei", "catering", "feinkost", "feinkost berlin", "knofi", "partyservice", "tel:", "türkisches restaurant"]
language = "en"
