["http://knofi.de/berlin-partyservice"]
title = "Ihr Partyservice in Berlin | Feinkost  Restaurant & Partyservice in Berlin Kreuzberg"
full_description = "Sie wollen feiern? Willkommen bei Knofi Partyservice in Berlin Kreuzberg. Hier sind Sie richtig. Bestellen Sie köstliche Speisen, warm oder kalt, als Fingerfood oder klassisches Buffet. Wir liefern Festplatten für 2-3 Personen oder Hauptspeisen für das nächste Firmen Meeting. Großveranstaltungen, Hochzeiten bis zu mehrtägigen Konferenzen, können wir in Szene setzen, mit köstlichem Essen aus der mediterranen und orientalischen Küche. Für jeden Anlass liefern wir Getränke, Geschirr, Gläser und Servicekräfte. Gerichte die Sie nicht auf der Standardbestellungsliste finden, können jederzeit nachgefragt werden. Wir beraten Sie gerne per Email, telefonisch oder mit Ankündigung auch vor Ort, in der Bergmannstraße 98, 10961 Berlin Kreuzberg. Bitte senden Sie uns Ihre Anfrage per E-Mail, das Partyservice Team wird sich bei Ihnen melden. Wir bieten Bewährtes und lassen uns auf Neues ein. Wir erfüllen Ihre Wünsche."
