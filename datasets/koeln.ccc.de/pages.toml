["https://koeln.ccc.de/updates/2006-08-14_u23-anmeldestatus.html"]
title = "c4 | U23 Anmeldestatus"
description = """
Zu aller erst: Die Anmelder von Sonntag um 13:44:15 und 14:02:46 mögen sichbitte noch einmal anmelden — die Daten sind leider aufgrund einesStromausfalls bei mir verloren gegangen.Andererseits sind alle Plätze inzwischen nahezu doppelt belegt."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum U23 Anmeldestatus Zu aller erst: Die Anmelder von Sonntag um 13:44:15 und 14:02:46 mögen sich bitte noch einmal anmelden — die Daten sind leider aufgrund eines Stromausfalls bei mir verloren gegangen. Andererseits sind alle Plätze inzwischen nahezu doppelt belegt. Wenn Du noch unschlüssig bei der Teilnahme zu unserem diesjährigen U23 bist, solltest Du Dich noch schnell anmelden, denn am Donnerstagmittag machen wir die Anmeldung dicht. Doch sind wir jetzt schon fast doppelt belegt. Auch wenn ich gerne alle Anmelder teilnehmen lassen würde, so passen wir schlicht nicht in den Clubraum rein. Die Teilnehmer vom letzten Jahr werden bestätigen, dass es mit mehr als 40 Leuten zu eng und insbesondere zu warm wird. Deshalb müssen wir sieben… Momentan sieht es so aus, dass wir erst die Anmelder von weiter weg streichen werden – schließlich ist es ein Ziel, dass wir den Nachwuchs im Kölner CCC fördern. Danach werden Teilnehmer von vorigen U23 gestrichen, um neuen Interessenten einen Platz zu bieten (allein die Anmelder vom letzten Jahr machen schon knapp die Hälfte aus). Donnerstagabend schicken wir dann (Bestätigungs- und Absagen-)Mails raus. Bitte nicht jetzt schon enttäuscht sein, falls Du zur primären Ausschlußlist gehörst. Wir versuchen so viel Material wie möglich online zu stellen. Doch auf Video- oder Audioaufnahmen werden wir aufgrund des Aufwands verzichten. Und bei der inzwischen großen Anzahl an CCC-Veranstaltungen hast Du genügend Möglichkeiten mehr über Rechner, Netzwerke und Hacking zu erfahren. by Pylon 2006-08-14T09:34+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
