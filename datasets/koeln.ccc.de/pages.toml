full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Jugendprojekt U23 U23 ist das jährliche Jugendprojekt des CCC Cologne für junge Hacker und Haecksen bis 23 Jahre. In diesem Jahr bieten wir an sechs Terminen Vorträge und Hands-On-Sessions zum Thema „on hacking well“ (in Anlehnung an den Buchklassiker „on writing well“). Durch Vermittlung des Wissens über Hackangriffe können die Teilnehmer selbst Vorkehrungen zur Abwehr treffen. Wer nur „Hacker werden möchte“, dem empfehlen wir unser Wie-werde-ich-Hacker-HOWTO. Das Projekt findet an sechs Samstagen (19. August bis 30. September) jeweils von etwa 16:00 bis 21:00 Uhr in unserem Labor statt. Am Donnerstag, dem 10. August gibt es zusätzlich einen unverbindlichen Informationsabend mit anschließender Anmeldemöglichkeit. Alle Informationen und die Möglichkeit zur Anmeldung gibt es unter http://koeln.ccc.de/u23 by pylon 2006-07-23T02:35+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
