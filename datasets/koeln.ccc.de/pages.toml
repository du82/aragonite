["https://koeln.ccc.de/c4/selbstdarstellung-c4.html"]
title = "c4 | Wir über uns"
description = "Ein kleiner Abriss über die Geschichte des CCC in Köln"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Wir über uns Ein kleiner Abriss über die Geschichte des CCC in Köln Die Geschichte des Kölner Chaos Der Chaos Computer Club Cologne e.V.(im folgenden C4 genannt) ist der westliche Brückenkopf des innovativen Technologieeinsatzes im Rheinland mit allen Features die zum Chaos gehören. Seit 1997 haben sich Chaoten im klassischen Rheinland (Kölsch-Country) zu einem Erfa-Kreis des Chaos Computer Club e.V. zusammengefunden. Auch vorher gab es schon chaos-nahe Gruppen in und um Köln: In den 1980er Jahren waren hier die Computer Artists Cologne (CAC) aktiv. Nach einer kurzen Selbstfindungsphase in den Räumen eines T-Shirtladens (Abgang) wurde der Clubraum v1.0 in einer ehemaligen Kneipe in der Bobstraße in Betrieb genommen. Eine erste Vortragsreihe (Chaos Curriculum Cologne) in den Räumen des Komed stellte den Vorgänger des heutigen OpenChaos dar. Das Chaos-Labor v2.0 befand sich in der Körnerstraße in Köln-Ehrenfeld. Noch heute existieren Gerüchte über ein MUD-Dungeon unserer ehemaligen Räumlichkeiten. Kurz nach dem einjährigen Jubiläum wurden wir jedoch zu groß für die bisherigen Räumlichkeiten und zogen in unsere Räumlichkeiten in der Vogelsanger Straße in Köln-Ehrenfeld. Dort entstanden auch die meisten unserer Projekte. Seit 2012 befindet sich das Chaos-Labor zentral in der Heliosstraße in Köln-Ehrenfeld. by iscs 2002-10-17 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
