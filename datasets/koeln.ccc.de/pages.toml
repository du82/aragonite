full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Sonoj Convention 2024 - Dein Event für Musik und Open Source Die Sonoj Convention 2024 steigt am 19. und 20. Oktober im Chaos Computer Club Cologne, Heliosstr. 6a 50825 Köln, Deutschland. Registriere dich auf https://sonoj.org/2024/. Bereits zum 5. Mal findet in diesem Jahr die Sonoj Convention in den Räumen das Chaos Computer Clubs Cologne statt. Die Konferenz bietet Musikern, Produzenten und anderen Audio-Kreativen eine Plattform für Austausch und kreatives Schaffen. Das Hauptaugenmerk liegt dabei auf der Musik – dem Erschaffen, Teilen und Erleben von Klängen. Die Convention positioniert sich als Alternative zur vorherrschenden Musiklandschaft, die oft suggeriert, dass erfolgreiche Produktion nur mit spezifischer kommerzieller und unfreier Hardware, Software und bestimmten musikalischen und technischen Ansätzen möglich sei. Die Idee des „Industriestandards“ wird kritisch hinterfragt um diese engen Vorstellungen aufzubrechen. Bei der Sonoj steht die Überzeugung im Vordergrund, dass Musik in vielfältiger Weise und mit einer Bandbreite an Werkzeugen und Ansätzen erschaffen werden kann. Die Veranstaltung bietet eine Umgebung, in der die von Marketingabteilungen diktierten Auffassungen von Audioproduktion hinterfragt und Alternativen aufgezeigt werden. In der Sonoj Community geht es darum, Wissen und Fähigkeiten in der Musikproduktion zu vermitteln und zugänglich zu machen. Obwohl der Beitrag von freier und offener Software wertgeschätzt wird, liegt der Fokus klar auf der kreativen Freiheit und den Menschen hinter der Musik. Registriere dich auf https://sonoj.org2024/ für die Sonoj Convention am 19. und 20. Oktober 2024. Wir freuen uns auf dich! by Florob, Sonoj Community 2024-09-17T22:42:42+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
