["https://koeln.ccc.de/ablage/cccebit2002/manifesto.html"]
title = "c4 | CCCeBIT 2002 - das Manifest"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CCCeBIT 2002 - das Manifest 19. März 2002, CeBIT, Hannover 1. Filterung im Jahre 2002 "Fieses gehört verboten!" Die alte Denke macht auch heute nicht vor dem WWW halt. Diese Meinung zieht konsequenter Weise eine Zensur nach sich, die jetzt auch auf ein Medium angewendet wird, das dazu erfunden wurde, Stolpersteine im Kommunikationsweg locker zu umschiffen. Früher konnte man sich damit trösten, daß diejenigen, die lautstark eine wie auch immer geartete Zensur installieren wollten, sofort durch ihr mangelndes Sachverständnis entlarvt werden konnten. Doch je schwerer es einem deutschen Bürokraten gemacht wird, desto energischer reagiert er. Mit der Zeit heizten sich die Zensurideen von Gedankenspielen zu Taten auf. Im Land NRW ist die Landes-Aufsichtsbehörde für den gesetzlichen Jugendschutz (gemäß des Mediendienstestaatsvertrags) die Bezirksregierung Düsseldorf, namentlich der momentane Regierungspräsident Jürgen Büssow. Und der hat - als erster und bisher einziger - den Hebel bei den Internet-Providern angesetzt, die für den Endnutzer den Zugang zu den Diensten bereit stellt, indem er im Oktober letzen Jahres einige Provider aufgefordert hat, einige explizit genannte Webseiten zu filtern. Zu dem Zeitpunkt war die Grundlage, auf der eine solche Aufforderung stand - und ist immer noch - strittig. Dennoch sind diesem sanften Druck mehrere Provider nach einer Anhörung im November gefolgt. Inzwischen entwickelt sich der aus der Glut der Besserwisserei entstandene Funke zu einem ansehnlichen Feuer. Anfang Februar hat die Bezirksregierung 80 Provider in NRW aufgefordert, ihre Liste mit Webangeboten für den Endnutzer nicht zugänglich zu machen. Antworten der Provider, Widerspruch und ggf. Verfahren stehen noch aus, werden aber weichenstellend für die Entwicklung des Netzes in Deutschland sein. 2. Die Provider Von einer zentralen Regierungsstelle, die für die Verwaltung und das Wohl der Bevölkerung eingerichtet wurde, erwartet man ja historisch nichts anderes, als daß sie mit der Zeit versucht, für ihre Untertanen zu Denken und ihnen später selbiges zu verbieten. Doch aus reiner Angst vor einer umstrittenen Aufforderung haben z.B. folgende Provider in einem Akt vorauseilendem Gehorsams direkt gehandelt und bereits kurze Zeit nach dem Gespräch mit der Bezirksregierung in ihr System eine Sperre eingebaut: ISIS in Düsseldorf waren der erste Provider. Kein Wunder, denn hier ist Jürgen Büssow Aufsichtsratsmitglied Ahrens in Lüdinghausen Versatel in Dortmund Vision Consulting in Köln Des weiteren auch Hochschulen: RWTH AAchen Uni Dortmund - hier werden Filterlösungen für mehrere Hochschulen erforscht und getestet FH Köln In den letzten Jahren konnten die Provider nachweisen, daß die Einrichtung einer Sperre nicht nur technisch mit Aufwand und Kosten verbunden ist. Klar, daß sich der Provider als Unternehmer gegen eine solche Sperre wehrt. Da das scheinbar Unaufhaltsame aber jetzt zu kommen scheint, akzeptieren es die Provider wie ein Naturereignis und kümmern sich nicht mehr um die Qualität ihres Produktes, nämlich der Bereitstellung von Internetzugang an ihre Kunden. Wenn die Qualität der Dienstleistung auch aller anderen Konkurrenten am Markt (also der anderen Provider in NRW) ebenfalls sinkt, so können ihm die (meisten) Kunden nicht abwandern. Warum soll er sich also um die Qualität seines Produktes kümmern? 3. Folgen Doch das Netz ist eben kein Produkt wie jedes andere. Es wird immer Methoden und Wege geben, an die verbotenen Inhalte zu gelangen. Und in einer digitalen Welt, in der das Gut Information ohne Qualitätsverlust beliebig oft kopiert und vervielfältigt werden kann, werden eben nur Hindernisse geschaffen, die nicht wirklich aufhalten. Aber es werden für viele Erschwernisse geschaffen, auch für diejenigen, die ein berechtigtes Interesse am Zugriff zu verpönten Daten haben (z.B. Studierende zu Nazi-Seiten). Leider werden solche Hindernisse auch in den Kommunikationsweg gelegt zu Informationen, die zufällig nur in der Nachbarschaft der verpönten Informationen sind. Solcher Kollateralschaden wird zunehmend als akzeptierbar eingeschätzt. 4. CCCeBIT Der CCC will neben Aktivitäten im Netz auch außerhalb des Netzes auf die Feigheit der Provider aufmerksam machen und für einen unzensierten und von Regierungswillkür freien Zugang zum Netz werben. Daher sind die genannten Provider nominiert und werden auf ihr Verhalten von uns angesprochen: Ihnen wird die rote Netzwerkkarte gezeigt! Auf der CeBIT wird der CCC also die Stände der Provider nacheinander in einer Art Schitzeljagd besuchen, die sich durch besonders eifrige Erfüllung der Zensur hervorgetan haben und ihnen den diesjährigen Chaos CeBIT Award verleihen. Angefertigt wurde der diesjährige Preis durch das Künstler/innenkombinat "Panischer Kern nach gepowercycelt". 5. Background Bisher haben sich der CCC und seine Freunde jedes Jahr auf der CeBIT bei einem Aussteller getroffen, der sich im davor vergangenen Jahr durch Ausnutzung oder Erweiterung eines Monopols hervorgetan hat oder dem Netz,den Nutzern oder dem CCC Schaden wollte. Der CCC hat sich aber auch mit dem Aussteller getroffen um im Rahmen einer kleinen Preisübergabe auf den aufgefallenen Mißstand aufmerksam zu machen und direkt mit ihm darüber ein wenig zu reden. Daneben wird die wegen der CeBIT sowieso üppig vorhandene Presse ebenfalls dazu eingeladen, um durch unsere Präsenz und mit nettem Bild- und Textmaterial die Öffentlichkeit zu informieren, was dem CCC bisher gestunken hat. Dieses Treffen dient aber auch dazu, daß sich die CCC-Mitglieder auf der Messe mal untereinander und mit allgemein am Chaos Interessierten treffen. Wenn dabei der Rahmen angenehm mit Konferenzgebäck und Erfrischungsgetränken gestaltet wird, so ist das immer Lebensqualität- und dadurch auch Laune-steigernd. In den letzten Jahren war die CCCeBIT-Aktion bei Siemens, Microsoft und der Telekom bzw. ihren Vorgängern. 6. Links CCC: zum Thema Zensur in NRW http://www.buecherverbrennung.org/ CCC C4 - CCC Köln Chaos Realitätsdienst: Pressemitteilung des CCC http://www.heise.de/tp/deutsch/inhalt/te/11175/1.html 7. Postscriptum Glück gehabt, KPMG! by 2002-09-13 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content 1. Filterung im Jahre 2002 2. Die Provider 3. Folgen 4. CCCeBIT 5. Background 6. Links 7. Postscriptum Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
