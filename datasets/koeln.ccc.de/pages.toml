["https://koeln.ccc.de/ablage/u23/index.html"]
title = "c4 | projekt u23 (2002)"
description = "Dokumentation des Projektes u23 (2002)"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum projekt u23 (2002) Dokumentation des Projektes u23 (2002) u23 project u23 ist ein projekt für junge hacker bis 23 jahre. eine vorgegebene aufgabenstellung ist innerhalb von sechs wochen im team zu lösen. eine unbekannte hardware, schnittstellen, protokolle und webinterfaces müssen beherrscht werden. programmieren, recherchieren und dokumentieren - viele unterschiedliche fähigkeiten sind gefragt. challenge Die aufgabenstellung umfasst zwei teile sowie mehrere randbedingungen. teil 1 bau eines fahrenden oder laufenden roboters, der mittels einer lichtsensitiven einrichtung eine figur auf einem weissen hintergrund erkennt und zu einem pc überträgt. teil 2 aufbauend auf teil 1 der aufgabe soll ein schwarzer barcode ausgelesen werden, der auf dem weissen untergrund aufgedruckt ist. in diesem barcode sind befehle enthalten, die der roboter nach dem scannen ausführen soll. /home eine dokumentation über die arbeit der drei projektgruppen findet sich hier: projektgruppe hackfisch projektgruppe bugs projektgruppe c4-bionic Die Gruppe "bugs" hat einen aufschlussreichen Erfahrungsbericht verfasst: antity von der Gruppe "hackfisch" hat seine Arbeiten zum Thema "Barcode" in einem vorzüglichen PDF-Dokument niedergelegt. /usr/bin/date sechs donnerstagabende von 18 bis 21 uhr sowie ein hackwochenende auf schloss heiligenhoven. ~/.registry anmeldungen sind nicht mehr möglich, da der workshop bereits zu ende ist. interessenten fuer den workshop im naechsten jahr können sich bei unten angegebenen kontaktadresse melden. /root veranstalter ist der Chaos Computer Club Cologne contact kontaktaufnahme über cefalon (at) koeln.ccc.de by cefalon 2003-01-27 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content u23 project challenge /home /usr/bin/date ~/.registry /root contact Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
