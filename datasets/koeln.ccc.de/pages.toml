title = "c4 | spammer-forensics"
description = """
Das schnucki-Projekt beschreibt einen Weg herauszufinden, wie mailadressen ausWebseiten in die Listen der Spammer gelangen und ob Verfremdungen der mailadresse geeignet sind, Spamrobots zu verwirren."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum spammer-forensics Das schnucki-Projekt beschreibt einen Weg herauszufinden, wie mailadressen aus Webseiten in die Listen der Spammer gelangen und ob Verfremdungen der mailadresse geeignet sind, Spamrobots zu verwirren. Das schnucki-Projektd Mailadressen auf Webseiten werden von automatisch arbeitenden Spam-Robots eingesammelt und für Spam-Zwecke verwendet. Das schnucki-Projekt verbindet automatisch generierte Einmal-Adressen auf der Webseite mit der IP eines Benutzerzugriffes. Taucht diese Einmal-Adresse in Spamlisten auf, lässt sich nachvollziehen, auf welchem Host der Spamrobot läuft. Das Projekt beschäftigt sich ausserdem mit der Frage, ob Verfremdungen der mailadresse, also zB schnucki (at) ccc (dot) de eher den Spamrobot oder den Leser der Website verwirren. Aktuelle Ergebnisse Ein kommentierter Auszug aus dem schnucki-Log befindet sich hier. by fd0 2004-01-14 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Das schnucki-Projektd Aktuelle Ergebnisse Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
