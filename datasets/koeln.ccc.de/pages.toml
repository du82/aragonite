title = "c4 | Bitte unterschreiben: Petition zum Verbot der Stimmabgabe mit Wahlgeräten"
description = """
Derzeit läuft ein öffentliches Petitionsverfahren für die ersatzloseStreichung des §35 Bundeswahlgesetz (Stimmabgabe mit Wahlgeräten).  Wirbitten euch diese Petition zu unterstützen."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Bitte unterschreiben: Petition zum Verbot der Stimmabgabe mit Wahlgeräten Derzeit läuft ein öffentliches Petitionsverfahren für die ersatzlose Streichung des §35 Bundeswahlgesetz (Stimmabgabe mit Wahlgeräten). Wir bitten euch diese Petition zu unterstützen. Inzwischen können Petitionen online unterstützt werden. Dazu verwendet der Petitionsausschuss des Bundestags das System des schottischen Parlaments, weshalb die Webseite auch weiterhin dort gehostet ist. Hier geht es direkt zur Petition Freie und geheime Wahlen sind eines der wichtigsten Standbeine unserer Demokratie. Dass die Stimmabgabe durch Wahlgeräte nicht sicher und insbesondere nicht nachvollziehbar ist, hat der CCC in den letzten Wochen gezeigt. Von daher bitten wir euch die Petiton zu unterschreiben, sodass auch in Zukunft unser Wahlsystem manipulationssicher und überprüfbar bleibt. by Pylon 2006-10-28T00:00+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
