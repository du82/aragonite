["https://koeln.ccc.de/ablage/artikel/exmachina.html"]
title = "c4 | EX MACHINA - Ausstellung im Museum für Angewandte Kunst, Köln"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum EX MACHINA - Ausstellung im Museum für Angewandte Kunst, Köln EX MACHINA - Are friends electric? So ähnlich muß es in vergangenen Jahrhunderten auch bei Automata-Ausstellungen zugegangen sein: die Begegnung zwischen Mensch und Maschine, mit elektronischen Hilfsgeistern für alle Lebenslagen. Der Robo, dein Freund und Helfer. Noch bis zum 14. April 2002 zeigt das Kölner Museum für Angewandte Kunst die Geschichte und Zukunft der Roboter in familienfreundlichem Sonntagsnachmittags-Gewand. Doch wo Vaucansons berühmte "Mechanische Ente" bereits im 18. Jahrhundert schwimmen, quacken, mit den Flügeln schlagen, Essen verschlingen und damit das Publikum narren konnte, wirken die Exponate dieser Ausstellung seltsam leblos. Vielleicht, weil den meisten von ihnen, nach 2-monatigem Ausstellungsbetrieb, die Batterien ausgegangen sind und sie nur noch saft- und kraftlos, wie ausgemusterte Krieger, herumstehen. Das ist schade. Wie es überhaupt schade ist, dass einige Stücke es nicht hierhin geschafft haben. Wie z.B. Kismet, der grade in Paderborn gastiert, und ein heimlicher Favorit besonders des weiblichen Publikums zu sein scheint - wie die drei netten englisch-sprachigen Ladies beweisen, die neben mir schon bei einem Hochglanz-Foto dieses KI-Gremlins in Entzücken ausbrechen. Oder ASIMO, der, so die Veranstalter, leider immer noch beim Zoll festhängt. Na ja, dafür sind AIBO und PaReRo gekommen. Es ist ein bisschen wie im Zoo, oder einem Kuriositäten-Kabinett. So bleibt angesichts der mangelnden Bewegungsfreude der Maschinen und der etwas dürftigen technischen Infos in Katalog wie Ausstellungsführer den Besuchern gar nichts übrig als zu menscheln, und Erwartungen auf die Kisten zu übertragen, die sie gefälligst zu erfüllen haben. Der emsige Mähroboter RL 800 begrüßt dann auch die Besucher, in dem er beruhigend surrend den Rasen umzuwuseln verspricht. Der gar nicht putzige Oktoputz hängt jedoch einsatzverweigernd an der Wand herum, Pinochio, der kleine Versuchshumanoide vom Fraunhofer-Institut AiS, gönnt sich eine kleine Verschnaufpause auf seiner mit Spielklötzchen an den Seilen verzierten Präsentationsplattform, und die RoboCupPlayers haben auch gerade Halbzeitpause. Etwas gruseliger wird's dann schon bei CASPAR, dem OP-Robo. So präzise seine lange, feine Spitze auch fräsen mag, man möchte so etwas eigentlich nicht am eigenen Körper herumfummeln lassen. Den hektischen, etwas neurotisch wirkenden ULIXES allerdings auch nicht. Aber der ist ja nur ein Würstchensortierer. Und wenigstens bereit dazu, sich austesten zu lassen. Legt man ihm die Gummi-Würstchen grade aufs Band, sortiert er sie zackig nach Krümmung, liegen sie übereinander, schmollt er und wibbelt aufgeregt hin und her, wie ein Boxer vor dem nächsten Schlag. Der Sony-Vierbeiner AIBO (Artificial Intelligence roBOt) ist autonom und lernfähig, besitzt Berührungssensoren, Mikrofone, eine Kamera, Gleichgewichtssinn, und eine eigene Spracherkennungssoftware, mit der seine Umgebung analysieren und auf sie mit sechs verschiedenen 'Emotionen' reagieren kann. Seine Reaktionen lassen sich durch positive Verstärkung sowie selbst geschriebene Programme steuern, was ihm auch schon eine eigene Liga im RoboCup eingebracht hat. Natürlich gibt es auch einen basketball-spielenden DUNKOBOT von LEGO Mindstorms zu sehen, ebenso wie ein Industrieroboter-Set von Fischertechnik. In der gleichen Ecke stehen auch die Modelle der neuesten persönlichen Service-Robos, der R100 und sein Nachfolger PaPeRo (Partner-typ Personal Robot). Beide haben neben ihrem R2D2-meets-Playmobil-Look und dem damit verbundenen unschlagbaren Niedlichkeitsvorteil aber mehr zu bieten als meep-meep. Ich zitiere mal aus dem Ausstellungsheft: 'Er rollt durch seine Umgebung und sucht menschliche Gesellschaft. Findet er keine, so macht er ein 'Schläfchen' und wartet, dass ihn jemand ruft. Erhält der PaPeRo eine Nachricht, die er einer Person ausliefern soll, so beginnt er, diese Person zu suchen. Er erkennt sie anhand ihres Gesichtes und ruft ihren Namen.' ... Und jetzt alle: 'Süüüüüß!' Oder hier: 'Ist R100 allein, dann überwacht er seine Umgebung und wenn er auf etwas ungewöhnliches wie einen Einbrecher trifft, dann nimmt er ihn auf Video auf und benachrichtigt seinen Besitzer über Internet.' Na, das möcht' ich noch sehen. Richtig knorke wäre es natürlich gewesen, alle diese zuletzt genannten Robos mal live in action sehen zu können, aber das blieb ein Traum. Ein Besucher versuchte PaPeRos Köpfchen (zugegeben, eher unsanft) zu verdrehen ... und wurde sofort zurecht gewiesen. Ok, dreimal pro Tag werden auch zwei Exponate extra vorgeführt, aber in den zwei Stunden, in denen wir dort waren, waren dies nur zwei eher unspektakuläre Geräte. Dass permanente Hilfsbereitschaft auch nerven kann, wissen wir ja spätestens seit den sprechenden Türen von Douglas Adams oder dem Nervbalg in 'A.I.'. Richtig böse wird's allerdings, wenn diese Robo-Viecher auch noch anfangen, Johanna von Koczian's Putzschlager 'Das bisschen Haushalt...' zu schmettern, während sie den Boden wischen. So geschehen bei dem einen live vorgeführten Kandidaten, dem Reinigungs-Robo ST82 R VARIOTECH. 'Treten Sie bitte zurück, ich beginne zu reinigen,' kündigt das Teil sein Vorhaben an. Und schon springt man zur Seite. Stellt sich ihm etwas in den Weg, ertönt ein penetrant servil-freundliches 'Entschuldigen Sie, ich möchte hier reinigen.' Tritt man immer noch nicht zur Seite, wischt es schließlich um einen herum, wie dereinst Mama, und irgendwie wünscht man sich dann, es möge doch auch einmal ein 'Geh mir endlich aus dem Weg, Du ...!' brüllen, aber nein, zu menschlich sollen die Dinger ja auch nicht werden. Das zweite Vorführgerät ist TEODOR, ein Minenentschärfungs-Robo, der seine Bewegungen sehr bedächtig, fast schon elegant tänzerisch, darbietet. Oder wie es ein kleiner Junge ausdrückte: 'Was soll denn das? Ist das alles? Nun ja, das war schon die Haupthalle. Wir suchen immer noch Kraftwerk. Die sollen hier auch irgendwo herumstehen, als Update, im Expo-Remix. Im zweiten Raum noch ein paar Highlights: der Stanford-Arm, noch mehr spinnenartige, hexapodische, Knickarm- oder Lauf-Robos, Elsie & Elmer, die berühmten Schildkröten. Und auch hier gruselt's wieder leicht: Wabot-1, der erste humanoide Roboter von 1973, also quasi Benders Vorfahre. Das Kerlchen schaffte immerhin einen Schritt in 45 Sekunden. Daneben ein künstlicher Arm für Behinderte. Auch nicht richtig vertrauenserweckend. Wo sind bloß Kraftwerk? Wir suchen den dritten Raum, verlaufen uns, landen beinahe in der Abteilung 'Handwerkskunst im Mittelalter.' Nein, hier nicht. Ah, noch 'ne Tür mit Licht. Und es wird dunkel. Genau. Und da stehen sie auch schon, als Leihgabe aus Düsseldorf (ausgerechnet...), neongrün gestreift in schwarzen Boxen, darunter je ein Monitor mit ... nun ja, bisschen Sound dazu wär auch nicht schlecht gewesen. Aber gegenüber, im Kinosaal, läuft ja ein Video. Irgend ein Streifen, der zeigt, wie praktisch Robos sind, die auf Firmenklos neues Klopapier oder Pizzas bringen können. Aha. Wir haben leider nicht mehr die Zeit, auf einen neuen Film oder gar Sounds von Kraftwerk zu warten, und werfen noch einen Blick auf einen Industrie-Robo, der immer wieder das Wort 'ART' zusammenlegt, alles wegschüttet, neurotisch wibbelt, und von vorne anfängt. Wie tiefsinnig. Die elektrischen Fische im Aquarium sind auch entzückend, die Quallen allerdings schon tot - das heißt, hoppla, ihre Batterien wohl einfach nur genauso alle wie die von RHINO, dem Museums-Robo, der abgeschlafft mit seinen vollen, künstlichen Lippen in der Ecke herumsteht. Auch schade, wie so vieles bei dieser Ausstellung, die sicherlich gut gemeint war. Links zu Museum für angewandte Kunst, Köln, Ausstellung "Nika Bertram" 2001-10-03 by nika 2002-09-15 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
