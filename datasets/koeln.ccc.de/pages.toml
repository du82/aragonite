["https://koeln.ccc.de/updates/2006-06-29_openchaos_juni.html"]
title = "c4 | OpenChaos Juni: TRIZ"
description = '''
Triz ist ein russisches Akronym und steht für "Teorija Reschenija               
Isobretatjelskich Zadatch", übersetzt etwa: "Theorie zur Lösung                 
erfinderischer Probleme".'''
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos Juni: TRIZ Triz ist ein russisches Akronym und steht für "Teorija Reschenija Isobretatjelskich Zadatch", übersetzt etwa: "Theorie zur Lösung erfinderischer Probleme". Beobachtet man eine handvoll Werbe-Kreativlingen, wie sie krass spontan in einer locker-fröhlichen Meeting-Runde ihre Gehirnergüsse wild durcheinanderschütten, so nennt man eine solche Veranstaltung "Brainstorming". (Böse Zungen zweifeln jedoch an der Wirksamkeit solcher spontan-lockeren Kreativmeetings. Aber bitte nicht weitersagen!). Was TRIZ mit Brainstorming gemeinsam hat, ist lediglich der Oberbegriff: "Kreativtechnik", also eine Technik, um dem kreativem Genius in uns allen in den Hintern zu treten, dass er viele weltneue und ruhmreiche Ideen ausspucken möge. Im schier unüberschaubarem Feld existierender Kreativtechniken dürfte TRIZ jedoch das genaue Gegenteil von Brainstorming sein: Streng systematisch, auf der Basis wissenschaftlich-methodischer Analysen und mit der präzisen Zielformulierung eines Widerspruchs als IER (Ideales End-Resultat). So ist TRIZ die adäquate Methode zum Lösen technischer Probleme für Wissenschaftler, Ingenieure, Informatiker, etc., kann aber grundsätzlich auch auf anderen Gebieten angewandt werden. Die TRIZ-Methode ist jedoch von vielen erfinderischen Geistern noch bis heute unentdeckt geblieben, wohl weil sie dem realexistierendem Sozialismus entstammt. "Warum zuvor rund 30 Jahre lang kein Westler in Ost-Berlin oder Karl-Marx-Stadt anfragte, wie man mit System erfindet? Weil der Sozialismus doof war. Dachte man...Man hatte seine eigenen Kreativitätstechniken, man schnippte zum Beispiel mit den Fingern und rief Tschaka!" Genrich Saulowitsch Altschuller, geb. 15. Oktober 1926 in Taschkent, Usbekistan war ein russischer Ingenieur und Wissenschaftler. Als Sekretär im Patentamt entwickelte er eine Reihe allgemeiner Prinzipien aus der Analyse von 4000 Patenten, die bei der Erzeugung erfinderischer Ideen behilflich sind und eine systematische Methode ARIZ (Algorithmus zur Lösung erfinderischer Probleme) zur systematischen Vorgehensweise beim Erfindungsprozess. Das heute noch gebräuchliche ARIZ 77 besteht aus einer Liste von über 80 Schritt-für-Schritt-Prozeduren. "...Wie diese Methodik nach der Öffnung des Eisernen Vorhangs in den Westen kam, ist laut Pavel Livotov ("Trisolver" Group, TRIZ-Software) teilweise eine "dunkle Geschichte", die für viel böses Blut in der Szene sorgte. Denn Altschuller hatte seine Lehre von vornherein für jeden offen und kostenlos zugänglich gestaltet, so der Consultant: "Das war eine rein sozialistische Entwicklung. Nirgendwo sonst auf der Welt würden Leute dafür kostenlos so viel Arbeitszeit investieren." Doch nach dem Untergang der UdSSR änderten sich die Sitten. Das kollektive TRIZ-Wissen war in einem Forschungsinstitut in Minsk, der heutigen Hauptstadt Weißrusslands, in eine Art Erfindungs-Datenbank transferiert worden. Das Software-Tool dazu war in Prolog programmiert. Diese Software mit allen Werkzeugen und Patentdaten verschleppten einige Projektleiter in die USA - um TRIZ dort zu versilbern. Von 1990 an feierte die sozialistische Methode im Kapitalismus fröhlich Auferstehung, teils unter dem runderneuerten Namen TIPS, der amerikanischen Abkürzung für genau dasselbe..." (Zitate aus dem Artikel: "Die Meta-Erfindung",* *Brandeins) Der Vortrag findet am 29. Juni statt und beginnt um 20:00 Uhr in den Räumlichkeiten des C4. by al 2006-06-20T17:23+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
