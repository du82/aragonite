["https://koeln.ccc.de/ablage/artikel/hacker-werden.html"]
title = "c4 | Wie-werde-ich-Hacker-HOWTO"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Wie-werde-ich-Hacker-HOWTO "Wie hacke ich?" "Ich möchte hacken lernen." "Was ist eine FAQ"? "Was bedeutet warez?"? "Schickt mir alle Infos über's Hacken!" "Gibt es ein Tutorial zum Hacken lernen?" "Wo bekomme ich <füge hier jede beliebige Datei ein>?" "Wie komme ich an das Passwort für <was auch immer>?" "Wie knacke ich <was auch immer>?" "Kann mir jemand diese bestimmte Datei schicken?" Hört sich das nach dir an? Bist du einer von diesen AOL/metronet/Germany-Net/City-Net-Möchtegern-Typen oder -Lamern, die wissen müssen, wie man Hacken lernt? Und niemand sagt dir was, außer daß du dir eine Axt kaufen solltest und vor allem sendet dir niemand irgendwelche brauchbaren Infos? Oder schwallen dich die Leute dann zu und reden von Kreativität, Technik Nutzung und Verantwortung, von Mitgestalten und der Kommunikationsgesellschaft? Dabei willst du doch nur wissen, wie man das Internet hackt! Keine Sorge! Hier gibt es eine Schritt-für-Schritt Anleitung, wie man Hacker wird. Wenn du diesen Anweisungen bis zum Ende folgst und einen Funken Kreativität besitzt, wirst du ein echter Hacker. Fein, hier kommt also die Schritt-für-Schritt Anleitung. Arbeite sie genau durch und du wirst ein echter Internet-Hacker. Wenn du erstmal mit Internet Hacking zurecht kommst, kannst du dir leicht neue Arbeitsfelder erschließen. Wenn du dies über einen der großen Online-Dienste (z.B. AOL) oder einen Intranet-Provider (z.B. metronet) lesen solltest, ruf' sofort bei denen an und teile ihnen mit, du würdest ihren Service in Zukunft nicht mehr benötigen. Wenn man in AOL ist (oder irgendeinem ähnlichen Service wie z.B. metronet), wird man automatisch als hoffnungsloser Lamer und Loser eingestuft. Möchtest du etwa, daß dir dieser Ruf für den Rest deines Lebens anhaftet? Also: kündigen, bevor es zu spät ist. Ganz nebenbei kann man das Internet nicht von AOL oder einem anderen Onlinedienst aus vernünftig hacken . Besorg' dir einen echten IP-Zugang. Wenn du im Internet hacken willst, benötigst du einen direkten Zugang zum Netz. Den bekommst du in der Regel per PPP. SLIP, Raw IP über ISDN oder X.25 würden es auch tun, aber für den Anfang wollen wir dein armes kleines Gehirn nicht mit zu vielen Informationen auf einmal verwirren. Also besorg' dir einen Internet-Provider mit PPP-Zugang. Bekanntlich läuft der Großteil des Netzes auf Unix-ähnlichen Systemen. Folglich brauchst du auch so ein System. Also lauf' direkt zum nächsten Computerladen und kaufe ein Unix-ähnliches Betriebssystem und einige Bücher über Unix. Am einfachsten (und billigsten) ist es, sich ein Freies System auf CD zu besorgen. Ich empfehle RedHat oder Debian als Linux-Distribution (davon gibt es nämlich mehrere und sie heißen beileibe nicht alle SuSE) bzw. [Open|Free] BSD, wenn es ein "echtes" Unix sein soll. Du hast kein CD-Laufwerk? Nimm gleich eins mit, wenn du schon einmal im Laden bist (echte Hacker haben kein Problem damit, hin und wieder etwas Geld in Hardware zu investieren). Repartitioniere deine Festplatte, um Platz für deine Unix-Partition zu haben. Du benötigst etwa 823 Megabyte. Das sollte für den Anfang reichen. Falls deine Festplatte nicht groß genug für DOS, Windows und dein neues Unix ist, lösche DOS und Windows komplett. Das Zeug wird 'eh nur von Lamern verwendet. Falls deine Platte dann immer noch nicht ausreicht, schnell zurück in den Laden. Lies die Installationsanleitung komplett. Dann lies sie ein zweites mal, weil du wichtige Sachen im ersten Durchgang übersehen hast. Und zur Sicherheit liest du sie am besten noch ein drittes Mal. Installiere Unix auf deinem System. Folge den Anweisungen, die du eben gelesen hast. Installiere alles, vor allem den Netzwerkskram, alles, was mit Programmierung zu tun hat, die Dokumentation, FAQs, man pages usw. Wenn alles installiert ist, reboote und logge dich ein. Arbeite dich durch die Kernel-Docs/FAQ/HOWTO. Lies den Kram ein zweites Mal langsamer, weil du nicht alles beim ersten Mal verstanden hast. Nun kompiliere deinen Kernel neu, um einen eigenen Kernel für dein System zu erstellen. Du weißt immer noch nicht, was ein Kernel ist oder warum du ihn kompilieren sollst? Oder du weißt nicht, wie du das anstellen sollst? Dann hast du den Kram, den du lesen solltest, nicht gelesen oder nicht verstanden. Du bist immer noch ein Lamer und ein Looser, bitte versuche es erneut. Hast du deinen neuen Kernel übersetzt? Fein, dann installiere ihn. Boote mit deinem selbst gebauten Kernel. Wenn dein System sauber bootet, hast du einen Glückwunsch verdient. Du hast etwa 5% auf dem Weg fort aus Lamerland geschafft! Nun, wo dein schönes, neues System läuft, mußt du dich durch alle man pages, HOWTOs, FAQs etc. durcharbeiten. Natürlich wirst du das meiste nicht auf Anhieb verstehen, aber lies auch das, dann weißt du später, wo du nachschlagen kannst. Alles durchgelesen? Gut, dann lies es alles noch einmal. Jetzt spiele ein bißchen mit deinem schönen, neues System herum. Lerne alles darüber, was du in Erfahrung bringen kannst. Verbringe etwas Zeit damit, das System zu erkunden und Dinge auszuprobieren. Dafür solltest du etwa ein Jahr einkalkulieren. (Wenn du niemals bei AOL warst, geht es wohl möglich wesentlich schneller.) Nun konfiguriere dein System für PPP und den Netzzugang. Als du Linux das erste Mal installiert hast, hast du ein paar Netzwerksinformationen eingegeben, das reicht aber nicht. Es gilt wieder viele manpages/FAQs/HOWTOs mehrfach zu lesen. Jetzt mußt du lernen, mit den essentiellen Netztools wie ftp, telnet, archie, sendmail, usw. umzugehen. Spiele mit den Tools ein bißchen im Netz herum. Nein, du bist noch kein Hacker (du hast erst 10% des langen Wegs aus dem Lamerland geschafft), aber du solltest nun möglicherweise genug wissen, um in der Lage zu sein, eine halbwegs intelligente Frage im Netz zu stellen. Der Zeitpunkt, programmieren zu lernen, ist jetzt gekommen. Besorg' dir ein paar Bücher über C, C++, Perl, Unix-Programmierung usw. Lies sie. Lese sie weitere Male, weil das meiste, was du im ersten Durchgang gelesen hast, dich verwirrt hat. Nun spiel' auf deinem System mit Perl, C und C++ herum, bis du programmieren kannst. Übe einige Zeit, bis du zumindest einigermaßen gut bist. Danach übe weitere ein bis zwei Jahre. Als nächstes besorgst du dir alle RfCs und arbeitest sie gewissenhaft durch. Hierin sind die Informationen enthalten, die essentiell sind, wenn du das Netz hacken willst. Wie immer hast du im ersten Anlauf nicht alles verstanden, also nochmal lesen. Subscribe dich jetzt auf einigen Security-Mailinglisten und Newsgroups. Lies sie, wobei du den ganzen Müll ignorieren mußt (Müll von der Sorte, wie du ihn früher gepostet hast). Poste auf keinen Fall irgendetwas, denn was du bisher zu sagen hast, interessiert niemanden. Schau dir das ganze nur ein bis zwei Jahre an. Erkunde das Netz. Probiere herum. Suche Sicherheitslücken. Lies viel Source Code. Programmier einige Hacker-Tools. Nun bist du ein echter Hacker-Anwärter Herzlichen Glückwunsch! Der Weg zum Meisterhacker mag noch weit sein, aber den solltest du nun alleine finden. Dieser ganze Prozeß dauert natürlich einige Zeit, ist aber der schnellste Weg für einen Onlinedienst-Nutzer, um hacken zu lernen. Einige haben nicht die nötigen geistigen Fähigkeiten, alle der oben angeführten Schritte durchzuführen, aber versucht es trotz alledem. Zugegebenermaßen, das ganze mag dich einige Jahre kosten, aber es ist es wert. Eventuell hilft dir auch der Text von Eric weiter. Doobee R. Tzeck basierend auf einem Text von Doug Mclean (madsci@mi.net) by 2002-09-12 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.cc