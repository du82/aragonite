title = "c4 | CCCeBIT 2001 - das Manifest"
description = "Manifesto für die CCCeBIT 2001"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CCCeBIT 2001 - das Manifest Manifesto für die CCCeBIT 2001 Manifesto für die CCCeBIT 2001 1. CCCeBIT Wie einige der Family bereits mitbekommen haben, wird es dieses Jahr wieder ein Chaos-Treffen auf der CeBIT geben. Traditionell besucht der CCC die Firma/den Konzern, der im letzten Jahr besonders unangenehm aufgefallen ist, z.B. durch monopolistisches Verhalten, Kommunikationsverhinderung (z.B. Telekom) oder schlechte Software (z.B. Microsoft) und überreicht einen kleinen (symbolischen) Denkzettel. Diese Treffen hatten auch immer weitere Funktionen: 1.1. Öffentlichkeit für Probleme herstellen Durch die begleitende Presse konnten die Themen und unsere Positionen in die Öffentlichkeit transportiert werden. Gerade auf der CeBIT, dem begehbaren Hochglanzprospekt, in der sich die ganze Branche feiert und mit feuchter Hose sich gegenseitig auf die neusten Erfindungen und Phrasen der Marketingabteilung starrt, bekommt ein Beitrag, der klar formuliert, was alles schief läuft einen besonderen Wert, den auch Journalisten zu schätzen wissen. 1.2. Präsentation der Inhalte mittels einer Aktion gegenüber losen Anhängern Die angekündigten Treffen haben immer auch Leute angesprochen, die a) den CCC mal kennen lernen wollten und b) einfach mal fun haben wollten. Messeigel sind unvergessen - Danke FoeBud! Dabei sollte uns klar sein, daß sicher auch immer script-kiddies dabei sind und Menschen, die - aus welchen Gründen auch immer - uns sehen möchten. Ein solcher Treff sollte als Chance begriffen werden, daß der CCC Inhalte auch passend präsentieren kann. 1.3. Treffen der Chaos Family Nicht zu letzt kommt zu diesem Punkt mal wieder kurz ein Kreis der aktiven Mitglieder zusammen und kann über die CeBIT Erfahrungen austauschen (Denkt an die Standpartytipps!). Ohne Treff sind mal wieder alle auf dem Gelände, laufen aber nur wieder aneinander vorbei (sofern man sich nicht per LPD zufällig in Reichweite bekommt). 2. Wer oder was hat uns geärgert? Lassen wir mal das vergangene Jahr Revue passieren, so hat vielen das Thema Filterung der Inhalte des Internets gestunken. Der CCC tritt mit seinen Geschichten in der Öffentlichkeit sehr Konsequent mit seiner Meinung auf: Filterung ist schlecht, Filterung ist kaum möglich. Doch die Schlinge zieht sich zu. 2.1. Strategisch Laut Informations- und Kommunikationsdienste-Gesetz (IuKDG) können Filter eingesetzt werden. Nur nach herrschender Meinung ist dies im Moment technisch oder finanziell einem Provider nicht zumutbar. Mit der Schaffung von Standard-Software, die für genau diesen Zweck geschrieben wurde und immer mehr dies versucht zu leisten - so schlecht und ungenau das auch geschieht - wird ein Einsatz wahrscheinlicher und vom der Rechtsprechung auch als Möglichkeit anerkannt. Damit werden die Provider in die Verantwortung gezogen, die sie nicht automatisch haben sollten. 2.2. CCC betroffen Gerade der CCC ist ja auch selber betroffen durch Falschdarstellungen, die dazu dienen sollen, den CCC zu diskreditieren. Das dient klar kommerziellen Interessen: Damit wird die kritische Stimme abgewertet, die vor Fehlentwicklungen warnt und somit direkt den Umsatz einiger Firmen betrifft. Vor einiger Zeit war es Microsoft, das den CCC als "malicious hackers" einstuften. Die Antwort des CCC auf solche Angriffe wurde diskutiert - vielleicht sogar zerredet. Ein gewisser Konsens war, nicht mit den Methoden zu reagieren, die sonst von der Gegenseite verwendet werden: Abmahnen oder Klagen. Gesucht wird immer nach alternativen Methoden, gewitzt und trotzdem wirkungsvoll. 3. Smartfilter - Dumbfilter Mit Smartfilter hat Siemens ein System vorgestellt, daß redaktionell bearbeitet, Web-Seiten anhand der URL in thematische Kategorien einsortiert. Die Software wird auf einer Firewall eines Unternehmens installiert und die freigegebenen und gesperrten Kategorien können einzeln konfiguriert werden. Damit ist es den Nutzern "hinter" diesem Filter unmöglich gemacht worden, Informationen aus weiten Teilen des Netzes abzurufen. Der Smartfilter arbeitet dabei mit einer Kategorisierung per Domainnamen, die sich als ungenau herausstellt. Die kategorisierende Stelle wägt ab zwischen Nutzen, eine Domain weiter zu untersuchen oder sie - wie bei www.ccc.de oder koeln.ccc.de - komplett zu sperren. Das drückt das Prinzip aus, daß eine unabhängige Stelle aus dem Inhalt oder nur der Präsentation einer Information, den Zweck und die Verwendbarkeit dieser Information einschätzen kann. Dies ist natürlich nicht möglich. Es ist nicht nur die Sorge um die Moral im Internet und der eigenen Nutzer, sondern es geht in Unternehmen auch darum, die Produktivität der Mitarbeiter nicht mit der ablenkenden Informationsfülle des Netzes zu belasten, was durch einen Blick auf die smartfilter-Webseiten klar wird: "Eine aktuelle Umfrage des W3C unter Managern ergab, daß sich 81% Gedanken über die Auswirkung des Internets auf die Produktivität und 68% über die Ablenkung der Mitarbeiter von der Tagesarbeit machen." (http://www.smartfilter.de/cgi-bin/index.pl?primary=1&secondary=5) Die Kunden sind daher größtenteils Firmen mit großen eigenen Netzen mit Verbindung zum Internet. www.ccc.de ist unter "Criminal Skills" eingeordnet. Damit wird dem CCC indirekt kriminelles Verhalten unterstellt. Eine klare Absage der Einschätzung, daß das auf www.ccc.de verbreitete know-how sowohl für kriminelle Zwecke als auch deren Verhinderung eingesetzt werden kann und eine eindeutige Präjudizierung. Dabei ist smartfilter auch nicht frei von Humor (und Inkonsistenz): http://www.2600.com ist in "Politics, Opinion, Religion". 4. Verleihung an Siemens am ChaosDienstag 4.1 Siemens-Stand Letztes Jahr wurde das Produkt Smartfilter (nur echt mit kleinem TM) von Siemens gefeatured - inzwischen gibt es eine eigene vermarktende Stelle. Der frühere Bereich Anlagenbau und Technische Dienstleistungen (ATD) - jetzt Industrial Solutions and Services (I&S) mit seiner Abteilung ITPS (IT Plant Solutions) ist im Unternehmen der Quell der Softwareprodukte rund um IT-Sicherheit. Dieser stellt in Halle 3 Stand C20 auf der CeBIT aus. Daher eigenet dieser Stand sich als Ansprechpartner für unser Anliegen, der Firma Siemens für Ihr Bemühen, das Internet sauber und die Nutzer dumm zu halten, die Auszeichnung "ChaosCeBITAward 2001" zu überreichen. 4.2 Der Award Am Design des Awards wird noch gefeilt und gebastelt. Es wird dieses Jahr ein Unikat werden, was sich speziell mit dem besprochenen Produkt beschäftigt. 4.3 Termin Termin wird am Dienstag (27. März 2001) nachmittags sein. Details - wenn sie fest stehen - sind ab Montag, 19. März über http://koeln.ccc.de (und http://leitstelle.killall5.de/cccebit01/) zu erfahren sein. Dort werden auch aktuelle Entwicklungen um dieses Event relativ schnell bekannt gemacht werden. Die Planungen sind noch voll im Gange. Zur CeBIT wird auch ein Flyer mitgebracht, der Ort & Datum nochmal bekannt macht und CCClern dazu dienen kann, Interessierte auf das Event hinzuweisen. Am selben Abend findet auch das traditionelle Treffen wieder in Hannover Innenstadt statt (dieses Jahr NICHT im Marlene!) 5. Begründung von Siemens Begründung von Siemens zur Einordnung von www.ccc.de laut Anfrage über http://www.smartfilter.de/cgi-bin/url_send.pl "Auf der genannten Seite finden sich immer wieder Informationen, die kriminelle Aktivitäten ermöglichen. d.h nicht unbedingt, daß der Inhalt an sich kriminell ist. Im Falle des CCC oder l0pht.com ist die Intention zwar Schwachstellen aufzuspüren, um Sie dann zu vermeiden, eine kriminelle Nutzung ist jedoch genauso leicht, wenn nicht sogar leichter. Die Kategorie, unter der die Seite gesperrt ist, heißt dementsprechend auch criminal skills und nicht criminal content. Sollten Sie aus beruflichen Gründen Zugriff auf solche Seiten brauchen, besteht die Möglichkeit, lokal auf dem Proxy der Ihnen Zugang zum Internet vermittelt, die Seite freizuschalten. Wenden Sie sich bitte an Ihren Proxybetreiber. Ihr SmartFilter Team" Unter "criminal skills" versteht smartfilter: >> Anleitungen oder Hinweise auf Methoden, die geeignet sind, illegale Aktivitäten und Verbrechen zu fördern, Seiten, die dazu aufrufen oder die die erforderlichen Fertigkeiten vermitteln. Darin eingeschlossen sind beispielsweise Bombenbauanleitungen, Anleitungen wie man Schlösser knackt, Einbrüche, Vergewaltigungen und Morde begeht, usw. Insbesondere sind auch Seiten enthalten, die sich mit dem Hacken von Computern befassen oder Möglichkeiten bieten, Passwörter zu knacken 6. weitere Infos http://www.smartfilter.de/ http://www.atd.siemens.de/itps/ http://www.atd.siemens.de/itps/events/cebit2001/index_d.htm http://www.smartfilter.de/cgi-bin/index.pl?primary=3&secondary=6 und dann http://koeln.ccc.de und natürlich http://www.ccc.de Halle 3: http://www.cebit.de/cms_bin/254549_halle3.pdf http://leitstelle.killall5.de/cccebit01/ by jens 2002-09-13 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content 1. CCCeBIT 1.1. Öffentlichkeit für Probleme herstellen 1.2. Präsentation der Inhalte mittels einer Aktion gegenüber losen Anhängern 1.3. Treffen der Chaos Family 2. Wer oder was hat uns geärgert? 2.1. Strategisch 2.2. CCC betroffen 3. Smartfilter - Dumbfilter 4. Verleihung an Siemens am ChaosDienstag 4.1 Siemens-Stand 4.2 Der Award 4.3 Termin 5. Begründung von Siemens 6. weitere Infos Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
