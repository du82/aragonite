full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos am 26. Mai: Virtuelle Private Netze Bei dem OpenChaos für den Monat Mai dreht sich diesmal alles um das Thema VPN (Virtual Private Networks). Es soll ein kurzer Überblick über die derzeit gebräuchlichsten Technologien gegeben werden. VPN - Was ist das eigentlich? Welche Software gibt es? Wie funktioniert das ganze? All diese Fragen sollen beim kommenden Open Chaos am 26. Mai geklärt werden. Der Vortag dient als eine Art Einstieg in die Thematik und wird Anhand von konkreten Einsatzszenarios, einige Möglichkeiten von VPNs darlegen. Beginn ist wie gewohnt um 20 Uhr im Chaoslabor. by AmP 2005-05-16T19:30+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
