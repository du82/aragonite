["https://koeln.ccc.de/ablage/vax/index.html"]
title = "c4 | ClubVAX HOWTO"
description = """
Im September 2002 haben im C4 viele  VAXStations Einzug gehalten. Woher die kommen, wie man sie bedient und was man damit alles machen kann erfährst du auf dieser Seite. Aber wie bekommt man dieses wunderschöne Stück Hardware ans Laufen? 
  Ein Erfahrungsbericht vom Marsch durch unbekanntes Gebiet."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum ClubVAX HOWTO Im September 2002 haben im C4 viele VAXStations Einzug gehalten. Woher die kommen, wie man sie bedient und was man damit alles machen kann erfährst du auf dieser Seite. Aber wie bekommt man dieses wunderschöne Stück Hardware ans Laufen? Ein Erfahrungsbericht vom Marsch durch unbekanntes Gebiet. VAX Chaos Seit Anfang September 2002 herrscht im C4 ein regelrechtes "VAX Chaos". Jetzt fragen sich viele bestimmt, WTF ist eine VAX. Die VAX ist ein Computer, der in den Größen "Pizzabox" bis "Kühlschrank" von DEC (Digital Equipment) gebaut wurde. In unserem Fall haben fast alle "C4-VAXen" die amtliche Bezeichnung DEC VaxStation 4000 VLC. Die Invasion Wie kam es nun zu dieser VAX Invasion im c4? Marden hatte durch seinen Kontaktagenten in Amsterdam erfahren, dass die Niederländische Bahn in ihrem Hardwarelager aufräumt und so einiges an älteren VAXen loswerden will. Also haben wir uns einen VW Bus organisiert und die "Mission to Amsterdam" konnte losgehen. Nach einer sehr interessanten Führung durch das Kontrollzentrum und die Serverräume, packen wir 30 VAX 4000 VLC (Pizzaboxen), 3 VAX 4000 200 (kleinere Kühlschränke) und noch ein bisschen Zubehör (größtenteils Kabel) ein. Noch schnell ein paar Sehenswürdigkeiten der Amsterdamer Innenstadt (tolle Coffee Shops habe die da :) genossen und dann ging's Richtung Köln mit unserem VAXcluster auf vier Rädern. Seitdem ist so gut wie jeder zweite C4ler stolzer Besitzer mindestens einer VAX, einige Verrückte haben mitunter jetzt gleich vier von den Dingern zu Hause stehen. Ihr wollt wissen wie die VAX von innen aussieht? Dann klick [hier] Also auf geht es Wenn man sich die Rückseite einer VAX 4000 VLC (so der offizielle Name) mal anschaut, wird man schnell feststellen das man hier mit Standard-PC-hardware keine Chance hat. Anschlüsse für einen VGA Monitor oder ein PS/2 Keyboard wird man hier vergebens suchen. Die einzigen Anschlüsse die einem vertraut vorkommen, ist der Festfrequenzstecker für den Monitor, der 25-Polige, serielle und schliesslich der Centronics SCSI Anschluss. [Hier] gibt es ein Bild von der Rückseite. How to get a VAX 4000 VLC up and running Als erstes braucht man ein VT 100 bzw. VT 420 compatibles Terminal oder einen Terminal Emulator (Free und Shareware gibt es für jedes gängige OS). Windowsnutzer können auch das standardmäßig in Windows enthaltene Hyperterminal verwenden. Das größere Problem ist wahrscheinlich das passende Kabel. Das Terminal wird nämlich über einen 6 MMJ Stecker angeschlossen. Der sieht so ähnlich aus wie ein normaler RJ12 Telefonstecker hat aber 6 Pins und hat die Halterung nicht mittich sondern leicht zur Seite versetzt. Er wird an der Rückseite der VAX in den Consoleport gesteck. Man kann sich ein entsprechendes Kabel entweder kaufen (bei ebay sollte man fündig werden) oder mit etwas Geschick selbst löten. Oder man nimmt halt diese seltsame skizze WICHTIG !!! Vergewissere dich (gerade beim herumprobieren mit selbstgelöteten Kabeln) das der S3-Switch [Bild] auch auf Terminal (oben) und NICHT auf den lokalen Framebuffer steht. Mehr dazu weiter unten. Es gibt zwei Möglichkeiten an ein Kabel zu kommen, entweder man hat ein bisschen Glück und findet einen Telefonstecker mit allen 6 Pins oder man muss ich aus einen TP Netzwerkkabel mit RJ 45 Stecker was selbst basteln. Im ersten Fall muss man nur noch die kleine Plastikhalterung abbrechen damit der Stecker passt und am anderen Ende einen 25-Pol oder 9-Pol D-Sub Stecker anlöten. Um aus einem Netzwerkkabel was passendes zu basteln, muss man an einer Seite des Steckers ein bisschen mit einem starken Messer abschneiden, bis er in die Buchse an der VAX passt. Ein geschickter Hacker schafft es sogar die Halterung zuzuschneiden, dass sie passt. Am besten benutzt man die ganz billigen Stecker ohne Metallhülse. Am anderen Ende lötet man dann wieder ein 25 oder 9 D-Sub Stecker an. Die Pinbelegungen gibt es [hier]. Diese Skizze funktioniert, aber allein die vielen Brücken schrecken mich schon ab. Es funktioniert auch einwandfrei mit der anderen Skizze. Der große Augenblick! Jetzt sollte ein Memory Test (24MB waren damals richtig viel) erscheinen und anschließend (nach SEHR langer Wartezeit) ein Prompt mit ">>>" Herzlichen Glückwunsch die VAX funktioniert. So jetzt mal help eingeben und schon bekommt man eine Auflistung alle Befehle. Mit show dev kann man sich alle erkannten Laufwerke und deren Name und Größe anzeigen lassen. Nachdem man nun die Bezeichnung für z.B. das CD-ROM-Laufwerk kennt, kann man mit boot <device> booten. Die andere Option ist die VAX mit Hilfe einer an den MMJ-Port passenden Tastatur und einem BNC-fähigem Monitor zu betreiben. Wie auf [diesem] Bild zu sehen, kann sogar eine Maus angeschlossen werden. Die VAX lässt sich so auch starten und man bekommt den bekannten Prompt ">>>" Leider konnte ich so aber weder von einer NetBASD-CD starten noch nach der Installation dieses wunderbaren Betriebssystems starten *heul* Ein OS für meine VAX So ganz ohne OS macht das ganze natürlich noch nicht so richtig viel Spass. Es gibt eigentlich nur zwei Alternativen: NetBSD für die, die lieber an UNIX festhalten oder OpenVMS für diejenigen unter euch, die eine größere Herausforderung suchen. Es gibt auch einen OpenBSD-Port für VAXen, der sogar den Framebuffer unterstützt. Diesen Port hat aber bisher keiner von uns getestet. Sollte es mal jemand tun, wird es hier natürlich ein HowTo geben. Da die meisten sich sicherlich für NetBSD entscheiden werden und sich auch auf der NetBSD Seite viele Infos zu der VAX finden, schreib ich hier mal was zu NetBSD. Eine paar Tipps zur Installation von OpenVMS haben wir [hier] aufgeschrieben. Es gibt zwei Möglichkeiten NetBSD auf einer VAX zu installieren, entweder über das Netzwerk oder per SCSI CD-Rom. IMHO ist die Variante mit dem SCSI CD-Rom die einfachere und werde deshalb damit auch beginnen. Da die VAX kein internes CD-Laufwerk hat (sowas war damals noch Luxus) sollte man ein externes beutzen. Es gibt z.B. Varianten von DIGITAL die man an die eingebaute Centronics-SCSI-Schnittstelle anschliesst. Um zu testen ob es funktioniert gibt man am VAX-Prompt: >>> show dev ein. Man sieht nun die Bezeichnung des Devices (DKA400) und die grösse der CD. Wenn keine eingelegt ist, steht da ......... . Was wird installiert? Also ich habe mir von einem NetBSD Server ein Iso-Image gezogen (ca. 60MB) und dieses gebrannt. Die VAX kann, im Gegensatzt zu gleichalten Intelmodellen, mit bootbaren CD's umgehen. Auf den Servern liegt auch immer ein Installationshowto[hier] für die eigentliche Betriebssysteminstallation, deswegen werde ich auf die einzelnen Installationsschritte hier nicht genauer eingehen. Was aber ist an der VAX zu tun? Also VAX einschalten und CD einlegen. Nun kann man mit "show dev" überprüfen, ob auch alles richtig erkannt wurde. Wenn dem so ist, kann man mit "b dka400" von der CD booten. Netzwerkboot? Wenn man kein CD-ROM-Laufwerk besitzt oder man Probleme mit der CD-Installation von NetBSD hat, sollte man die Möglichkeit erwägen, die VAX via Netzwerkboot von einem anderen Server zu booten. Ich konnte diese Möglichkeit bisher leider noch nicht ausprobieren, deshlab kann ich hier vorerst nur auf entsprechende Seiten verweisen: The VAX Network Booting HOTO Auch bei [Google] gibt es natürlich wie (fast) immer hilfe. Sobald ich es erfolgreich geschafft habe, die VAX von einem Linuxrechner via NETBOOT zu booten werde ich hier natürlich ein entsprechendes HowTo uppen. Already Known Bugs Bisher ist ein sehr großes Problem aufgetreten, was bisher weder lokalisiert noch behoben werden konnte. Wenn man die VAX via CD installiert und nachher über pkg_add verschiedene Programme hinzufügt, finden diese nicht die ELF-Binaries. Soll heißen: alle Programme die man nutzen möchte MÜSSEN via pkgsrc installiert werden. Damit dieses funktioniert, muss JEDES Paket kompiliert werden. Das Problem daran ist nur, das so eine VAX fürs Paketekompilieren mehrere Stunden braucht. Mann kann also nicht mal eben ein Programm installieren. Wer eine Lösung für dieses Prblem gefunden hat, kann sich gern mal melden. by mike, rüdiger 2002-10-24 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content VAX Chaos Die Invasion Also auf geht es How to get a VAX 4000 VLC up and running Der große Augenblick! Ein OS für meine VAX Was wird installiert? Netzwerkboot? Already Known Bugs Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
author = "mike, rüdiger"
year_published = 2002
