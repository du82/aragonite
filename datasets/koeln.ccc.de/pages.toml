["https://koeln.ccc.de/c4/faq/index.xml"]
title = "c4 | Frequently Asked Questions"
description = "Was man schon immer wissen wollte, aber nie zu fragen traute - hier wird man geholfen"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Frequently Asked Questions Was man schon immer wissen wollte, aber nie zu fragen traute - hier wird man geholfen Anreise Wie komme ich am besten zum C4 Anreise Wie finde ich den Weg zu Euch? Unser Labor befindet sich in Köln-Ehrenfeld, Heliosstraße 6a, 50° 57'02"N, 6° 54'46"E (WGS84). Wenn die unten stehenden Beschreibungen nicht helfen, kann unter 0221-49 24 120 angerufen und um Hilfe gefragt werden. So kommt man hin: Mit der KVB Haltestelle Venloer Straße/Gürtel der Linien 3 und 4, Ausgang Heliosstr./Bezirksrathaus hoch. Dann um 180°C drehen, die Venloer Straße überqueren und in die gegenüberliegende Heliosstraße gehen. Haltestelle Venloer Straße/Gürtel der Linie 13, runter auf die U-Bahn-Ebene in Richtung 3 und 4, dann am Bahnsteig entlang und in die gleiche Richtung wie bei der Ankunft mit der U-Bahn. Nach ca. 2-3 Minuten Gehzeit kommt auf der rechten Straßenseite (letztes Haus vor dem großen Betonklotz mit Aufschrift "Stayery") das Chaoslabor. Der Eingang befindet sich in der Autoeinfahrt vorne rechts. Mit der Bahn Man fährt mit der S-Bahn/Regionalbahn bis Köln-Ehrenfeld und verlässt den Bahnhof über die Treppe Richtung Venloer Straße. Unten an der Treppe links, am Kiosk vorbei und die Straße überqueren und in die gegenüberliegende Heliosstraße gehen. Nach ca. 2-3 Minuten Gehzeit kommt auf der rechten Straßenseite (letztes Haus vor dem großen Betonklotz mit Aufschrift "Stayery") das Chaoslabor. Der Eingang befindet sich in der Autoeinfahrt vorne rechts. Mit dem Auto Von Norden (A57) und Nordosten (A1) ab dem Kreuz Köln-Nord auf die A57 nach Köln-Innenstadt fahren und die übernächste Ausfahrt (Köln-Ehrenfeld) raus. In der Ausfahrt rechts auf den Ehrenfeldgürtel abbiegen. Der Straße circa 1,5km folgen. Hinter der KVB-Haltestelle Venloer Str./ Gürtel und einer großen Fastfoodkette an der Ampel rechts in die Vogelsanger Straße einbiegen. Geradeaus über die nächste Ampel und dann an der folgenden Kreuzung rechts in die Heliosstraße einbiegen. Wir befinden uns im ersten Haus auf der linken Straßenseite hinter dem Betonklotz mit Aufschrift "Stayery". Fahrtzeit von der Autobahn etwa 5 min. Parken ist auf der Straße möglich. Mit dem Flugzeug Vom Flughafen Köln/Bonn hält unter der Woche die S13 (ca. alle 20 Min.) sowie der RE8 (Richtung Mönchengladbach) ohne Umsteigen nach knapp 20 Minuten Fahrt direkt in Ehrenfeld. Ansonsten ist Umsteigen am Hauptbahnhof (S12, alternativ Trimbornstrasse oder Bf Deutz) angesagt. Von dort aus wie oben erklärt. by doobee, cefalon, amp, Pylon, mangala, TobiX, PEra, zakx, count, snoopy 2012-02-12 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
