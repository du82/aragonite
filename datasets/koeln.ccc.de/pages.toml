full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum hackschiff 2000 Hacken auf dem Schiff: Mit einem Ausflugschiff fuhren wir am 4. August 2000 ab Bonn auf dem Rhein, von 18:00 Uhr bis 3:00 Uhr morgens. Mit einer netten, knackigen Veranstaltung haben wir Interessenten an einer Hackerveranstaltung zur See einen Sommertreffpunkt geboten Willkommen auf dem Hackschiff Das Hackschiff am 4. August 2000 ist gelaufen. Wir werden an dieser Stelle ein paar Bilder und Dokumente zur Nachbereitung zur Verfügung stellen. Wann das nächste Hackschiff ausläuft, ist noch nicht klar, aber wir wollen das Hackschiff zu einer festen Einrichtung im sommerlichen Terminplan des Hackers machen. Im Moment gibt es: Die letzte Version der Hackschiffseite. Die internen Seiten auf dem Schiffsserver. Nicht alle Links funktionieren. Das werden wir nicht ändern. :) Ein Photoalbum auch mit Übersicht. Zwei 360 Grad Bilder aus dem Hackcenter (Java). Die Begruessungsmail by anonymous 2002-09-13 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
