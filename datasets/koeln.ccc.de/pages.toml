title = "c4 | OpenChaos im Januar - SSPE mit J. Hubertz"
description = """
Im ersten Monat dieses frischen Jahres wird am 26. Januar Johannes Hubertz aus Köln
sein verteiles Paketfilter Framework  Simple Security Policy Editor - SSPE vorstellen.
Dieses Software ermöglicht es, Paketfilter an unterschiedlichen Standorten
mit einer einheitlichen Konfiguration zu betreiben.
(Derzeit noch beschränkt auf Linux)"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos im Januar - SSPE mit J. Hubertz Im ersten Monat dieses frischen Jahres wird am 26. Januar Johannes Hubertz aus Köln sein verteiles Paketfilter Framework Simple Security Policy Editor - SSPE vorstellen. Dieses Software ermöglicht es, Paketfilter an unterschiedlichen Standorten mit einer einheitlichen Konfiguration zu betreiben. (Derzeit noch beschränkt auf Linux) Im ersten Monat dieses frischen Jahres wird am 26. Januar Johannes Hubertz aus Köln sein verteiles Paketfilter Framework Simple Security Policy Editor - SSPE vorstellen. Dieses Software ermöglicht es, Paketfilter an unterschiedlichen Standorten mit einer einheitlichen Konfiguration zu betreiben. (Derzeit noch beschränkt auf Linux) In der Vergangenheit hat Johannes auch im Rahmen des Linux-Magazins oder eines GUUG-Treffens die Gelegenheit zur Vorstellung genutzt. Nun auch bei uns. Eintritt kostet das keinen, eine Spende zur Unterhaltung der Infrastruktur ist aber natürlich gern gesehen. Der Vortrag beginnt um 20:00 Uhr in den Räumlichkeiten des C4, welche hier zu finden sind. by thalunil / AmP 2006-01-14T11:50+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
