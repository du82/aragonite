["https://koeln.ccc.de/updates/2005-01-25_gemeinnuetzigkeit.html"]
title = "c4 | Dezenter Hinweis auf unsere Gemeinnützigkeit"
description = """
Wie vielleicht allen bekannt ist, sind wir als Chaos Computer Club Colognee.V. ein gemeinnütziger Verein und auch spendenquittungstauglich. Was unsallerdings aufgefallen ist, <Achtung, hier kommt ein dezenter Hinweis>ist dass dies bisher kaum jemand ausgenutzt hat. Was uns aber auchaufgefallen ist... wir brauchen dringend einen Beamer zur Fortsetzung derOpenChaos-Reihe. </Achtung>"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Dezenter Hinweis auf unsere Gemeinnützigkeit Wie vielleicht allen bekannt ist, sind wir als Chaos Computer Club Cologne e.V. ein gemeinnütziger Verein und auch spendenquittungstauglich. Was uns allerdings aufgefallen ist, <Achtung, hier kommt ein dezenter Hinweis> ist dass dies bisher kaum jemand ausgenutzt hat. Was uns aber auch aufgefallen ist... wir brauchen dringend einen Beamer zur Fortsetzung der OpenChaos-Reihe. </Achtung> Wir bitten um eine Sachspende in Form von einem Beamer (Videoprojektor), oder um eine zweckgebundene Geldspende. Beides gerne auch gebraucht. Schreibt einfach an mail@koeln.ccc.de und man nimmt sich eurer Sachspenden an. by HonkHase 2005-01-25T22:23:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
