["https://koeln.ccc.de/updates/2006-01-23_c4c_video.html"]
title = "c4 | C4 Café im Netzladen"
description = """
Zum ersten 23. diesen Jahres laden wir in den Netzladen ein. Nach einer längeren Pause bieten wir dieses Jahr Themenabende in Bonn an. Aus aktuellem Anlass, der zunehmenden Überwachung des öffentlichen Raums, wollen wir mit euch über Videoüberwachung diskutieren.

Falls ihr Interesse am Thema habt oder einfach einen Abend lang über Technik und Chaos reden wollt, seid ihr herzlich dazu eingeladen.

Club-Mate, Nudelsuppen sowie Kaffee und Netz sind reichlich vorhanden. Das Treffen beginnt ca. 20 Uhr und findet im Netzladen in der Bonner Altstadt, Wolfstr. 10 (im Hinterhof) statt."""
