["https://koeln.ccc.de/ablage/cccebit2004/index.html"]
title = "c4 | CCCeBIT 2004"
description = "CCCeBIT 2004: Keine Totalüberwachung des Autobahnverkehrs!"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CCCeBIT 2004 CCCeBIT 2004: Keine Totalüberwachung des Autobahnverkehrs! CCCeBit 2004: Vitronic hilft Datenkraken Dienstag, 23. März, 15 Uhr Halle 11, Stand A44 Auch dieses Jahr wird es wieder ein Treffen des Chaos geben an dem beliebten Dienstag - kurz vor Ende der Nabelbeschau der Branche - und wieder bei einem Aussteller, der es schafft, Technik so einzusetzen, dass unsere Freiheiten dramatisch beschnitten werden. Das Thema, dem wir uns dieses Jahr annehmen, kommt nicht unerwartet. Dieses Jahr geht es zur Firma Vitronic, die Hersteller der optischen Erfassungstechnik, die automatisch vorbeifahrende Fahrzeuge erfasst und ihr Kennzeichen ausliest, um diese Daten zur Speicherung und weiteren Verwendung mit Ort- und Zeitangaben weiterzugeben. Diese Technik ist bereits installiert in den 300 Erfassungsbrücken des inzwischen bekannten Mautsystems von Toll Collect. Hier werden bereits alle KFZ-Zeichen erkannt und nur die LKW-Daten herausgesucht; die Daten der PKWs werden (angeblich) nicht weiterverarbeitet. Dennoch sind hier die Grundlagen geschaffen worden für eine umfassende Bewegungsdatenerfassung. Die Technik liegt schon bereit. Neu an diesem Erfassungssystem ist der Automatismus. Inzwischen mussten wir uns in den letzten Jahren immer mehr an überwachungskameras gewönen, die vermeintlichen Schutz versprachen, obwohl sie nur selten im Nachhinein halten konnten, was sie versprachen. Die bisherigen Kameras wurden von Menschen beobachtet, die von ihrem Wähterhäuschen eingreifen sollten, sofern etwas ungesetzliches beobachtet wurde. Alles andere sollte ignoriert werden. Die automatische Erfassung und Weiterverarbeitung hat eine neue Qualität. Nicht mehr Menschen beobachten die Monitore, also den Output der Kameras, sondern Maschinen. Diese Maschinen sind so leistungsfähig, sämtliche Daten auszuwerten und somit alle Vorgänge vor den Kameras zu verarbeiten. Der Einzelfall der Beobachtung wird zum Regelfall. Materialien Manifesto: Vitronic erleichtert Datenkraken Hintergrund Der gemeinschaftliche Besuch der CeBIT ist immer mit einer Auszeichnung des CCC an einen ungeliebten Aussteller verbunden, dem CCCeBIT-Award. Der CCC übergibt diesen Preis an ein Unternehmen, das sich im abgelaufenen Jahr oder kommend mit Aktivitäten in Richtung Monopolbildung oder -erhaltung, Einschränkung des Datenschutzes bewegt hat oder einfach auch nur Mist baut. Sonstiges Für Mitglieder: Das abendliche Treffen wird wie jedes Jahr in der Kneipe neben dem traditionellen Treffpunkt stattfinden. Letzte CCCeBITs Die Tradition der CeBIT-Treffen des CCC reicht weit zurück. Nachdem wir in den frühen Neunziger Jahren den Nachfolger des Gilb, namentlich die Deutsche Telekom belagert haben, wurde das irgendwann zu langweilig und es wurden beweglichere Ziele gesucht. CCCeBIT 2001: Herr, Siemens - Ihr Filter stinkt! CCCeBIT 2002: Rote Netzwerkkarte gegen Netzzensur CCCeBIT 2003: IBM: No TCPA! by sam 2004-03-15 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content CCCeBit 2004: Vitronic hilft Datenkraken Materialien Hintergrund Sonstiges Letzte CCCeBITs Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
author = "sam"
year_published = 2004
clearnet = "https://koeln.ccc.de/ablage/cccebit2004/index.html"
