full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum cctv - externes Material der Datenschutzbeauftragten Die Datenschutzbeauftragten Aus der Linkliste der Datenschutzbeauftragten Auf den Webseiten der Datenschutzbeauftragten findet sich hier und da auch was zum Thema Videoüberwachung. Das NRW-Angebot wird gerade aktualisiert, aber auf den anderen Seiten gibt es eine Menge Interessantes zu lesen. Big Brother in NRW Probleme der Videoaufzeichung und -überwachung aus datenschutzrechtlicher Sicht - Dr. Helmut Bäumler Risiken und Grenzen der Videoüberwachung (Entschließung der 59.Konferenz der Datenschutzbeauftragten des Bundes und der Länder vom 14./15. März 2000) Videoüberwachung im öffentlichen Raum - Dr. Thilo Weichert: Stellungnahme anlässlich der Sachverständigenanhörung des Innenausschusses des Deutschen Bundestags am 05.07.2000 in Berlin Volltextsuche Schön und nützlich: Volltextsuche in den Materialien der Datenschützer. Auf dieser Seite kann man die Webangebote des Bundesbeauftragen für den Datenschutz und der Datenschutzbeauftragten der Länder nach Stichwörtern durchsuchen. by jadis 2002-10-06 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Aus der Linkliste der Datenschutzbeauftragten Volltextsuche Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
