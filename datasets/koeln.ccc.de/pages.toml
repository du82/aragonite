["https://koeln.ccc.de/ablage/cctv/index.html"]
title = "c4 | Chaos Circuit Television"
description = """
Der Kölner CCC und andere Gruppen der Chaos-Familiy haben sich mit der
  zunehmenden Überwachung öffentlichen Raumes durch VideoÜberwachung und deren 
  Auswertung beschäftigt. Es ist eine Datenbank entstanden, deren Ergebnisse hier
  dokumentiert sind"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Chaos Circuit Television Der Kölner CCC und andere Gruppen der Chaos-Familiy haben sich mit der zunehmenden Überwachung öffentlichen Raumes durch VideoÜberwachung und deren Auswertung beschäftigt. Es ist eine Datenbank entstanden, deren Ergebnisse hier dokumentiert sind Chaos Circuit Television Wir haben 1999 die massive Installation von Kameras zum Weltwirtschaftsgipfel in Köln zum Anlass genommen, die Überwachung öffentlichen Lebens durch private Sicherheitsdienste und Polizei zu dokumentieren. Mittlerweile sind wir Großteile der Innenstadt abgegangen und haben die erspähten Kameras in einer Datenbank gesammelt. Man kann sich durch ein Foto der Kamera und durch den darunter befindlichen Stadtplan ein Bild machen, wo man derzeit in Köln nicht allein ist. Diese Datenbank ist mittlerweile in XML konvertiert und [hier] erreichbar. Warum tun wir das alles? Zusammen mit anderen Gruppen wollen wir auf die immer weiter umgreifende Überwachung und Privatisierung öffentlicher Räume aufmerksam machen. Wir wollen diskutieren, welchen Nutzen diese Systeme (für wen!) bieten und welche Gefahren daraus für die Bürger erwachsen. Jeder soll mit unserer Datenbank die Möglichkeit haben, sich über die laufende Überwachung in seiner Stadt zu informieren. Der Kölner CCC hat eine Mailingliste eingerichtet, an der sich interessierte Lebensformen beteiligen können. Artikel Geschichte der Kameraüberwachung in Deutschland Gesetzliches Material von Datenschutzbeauftragten Mailingliste Datenbank externe Links Save Privacy Privacy International Überwachungsprojekt in Leipzig Kameraprojekt des Chaos Treffs Bremen (Aktuelle-Kamera.org) by jadis 2002-09-12 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Chaos Circuit Television Artikel externe Links Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
