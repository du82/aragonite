["https://koeln.ccc.de/ablage/curriculum/index.html"]
title = "c4 | c4 - Chaos Curriculum Cologne"
description = """
Das Chaos Curriculum Cologne war eine Vortragsreihe in grossem Rahmen, die wir 1988 in Zusammenarbeit mit dem Komed durchgeführt haben. In drei Veranstaltungen mit jeweils ca. 300 Gästen wurden Fragestellungenzu den gesellschaftlichen Auswirkungen der digitalen Welt behandelt"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum c4 - Chaos Curriculum Cologne Das Chaos Curriculum Cologne war eine Vortragsreihe in grossem Rahmen, die wir 1988 in Zusammenarbeit mit dem Komed durchgeführt haben. In drei Veranstaltungen mit jeweils ca. 300 Gästen wurden Fragestellungen zu den gesellschaftlichen Auswirkungen der digitalen Welt behandelt Im vergangenen Jahr führte der c4 eine Vortragsreihe zu medien- und technikspezifischen Themen durch. Dabei wurden nicht nur die Chancen neuer Entwicklungen, sondern auch die Risiken und Auswirkungen betrachtet. Gleichzeitig wurden Visionen abseits der ausgetretenen Technikpfade aufgezeigt. Der Chaos Computer Club ist eine globale Gemeinschaft, die sich grenzüberschreitend für Informations- sowie Kommunikationsfreiheit ohne Zensur von Staat und Industrie einsetzt, sich mit den Auswirkungen von Technologien auf die Gesellschaft sowie das einzelne Lebewesen beschäftigt. c4 ist der Erfahrungskreis des CCC im Rheinland. Über den c4 und seine Aktionen gibt es unter koeln.ccc.de. Einen Rückblick auf die Veranstaltungen könnt ihr hier lesen. Im Moment sind aufgrund unserer räumlichen Veränderungen weitere Veranstaltungen nicht geplant. Schon durchgeführt: "Internet killed the video star" -- Warum digitale Töne wie MPEG3 die Musikindustrie verändern werden "Wenn dir die Medien nicht gefallen, dann geh doch raus und mach deine eigenen" -- dieses Zitat von Abbie Hoffmann konnte man bisher mit "leichter gesagt als getan" abtun. Zu übermächtig schienen die Medienkonzerne, zu teuer war es für mittellose Idealisten, die Möglichkeiten von Rundfunk oder Musikverlag wahrzunehmen. Aber auch hier verändert das Internet mal wieder alles: Mit dem Musikformat MPEG3 kann jeder im Netz Musik in CD-Qualität anbieten, es entstehen riesige Datenbanken, in denen beinahe sämtliche CDs gespeichert sind und einige Bands verzichten bei der Distribution ihrer Werke schon völlig auf das altmodische Pressen ihrer Sounddaten auf die Silberscheiben. Werden wir nie mehr Platten kaufen? Ist Copyright Diebstahl? Und auf welche Zukunft werden sich Medienkonzerne, Künstler und Konsumenten einstellen müssen? Beachten Sie bitte auch unsere Nachlese dieser Veranstaltung. Dankeschön. Der transparente Mensch im Netz: Was droht Lieschen Mailer und Otto Normalverbrowser? Das Internet -- ein Ort voller Gefahren, keiner ist mehr sicher. So heißt es oft. Und wirklich -- Experten raten zu äußerster Vorsicht, wenn man Wert auf seine Daten legt. Ein weitaus gefählicheres Problem ist die Datenspur, die jeder Internet-Besucher hinter sich herzieht. Ein Internet-Surfer als gefundenes Fressen für Geheimdienste, Direkt-Marketer und andere zweifelhafte Menschen? Andy Müller-Maguhn ist Pressesprecher im Chaos Computer Club e.V. Unter anderem berät er die Enquete-Kommission "Zukunft der Medien" des Deutschen Bundestags. Mit uns spricht er über Gefahren für die Privatsphäre und zeigt Lösungen auf, wie die Datenspur zumindest kleiner wird. Beachten Sie bitte auch unsere Nachlese dieser Veranstaltung. Dankeschön. Karten, die die Welt bedeuten: Goldkontakte im Telefon und auf der Geldkarte Spätenstens seitdem es dem CCC gelungen ist, eine Mobiltelefonkarte von Mannesmann Mobilfunk zu clonen, ist das Thema Chipkarten in aller Munde. Immer mehr Plastikkarten haben nicht nur einen Magnetstreifen auf der Rückseite, sondern glänzen mit einer goldenen Kontaktfläche. Mobiltelefone sind hierbei sicher nicht die einzige Anwendung, aus dem täglichen Leben kennen wir alle auch viele andere, wie Krankenkassen- und Geldkarte. Was kann man mit Chipkarten anstellen? Kann man Telefonkarten aufladen? Ist die Geldkarte sicher und wenn ja, für wen? Beachten Sie bitte auch unsere Nachlese dieser Veranstaltung. Dankeschön. by sam 2002-09-08 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
