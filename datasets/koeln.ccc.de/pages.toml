full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum fnordlicht - illuminating the world Erfahrungsbericht eines Datenreisenden auf der Suche nach der ultimativen Beleuchtung. Erfahrungsbericht eines Datenreisenden auf der Suche nach der ultimativen Beleuchtung. Übersicht Vorgeschichte und generelle Beschreibung Firmware Schaltung & Layout Fotos! Mailingliste FAQ Mailingliste Da jedes noch so kleine Projekt eine Mailingliste haben muss, hat dieses natürlich auch eine, die Adresse ist fnordlicht@koeln.ccc.de. Bitte schaut erst in das Mailinglisten-Archiv, bevor ihr eine Frage stellt. Software Repository Die Firmware wird mit subversion verwaltet, das Repository ist unter http://svn.fnordlicht.de/fnordlicht erreichbar. Einen aktuellen Development-Snapshot bekommt man per: $ svn checkout http://svn.fnordlicht.de/fnordlicht/trunk fnordlicht Eine Kurzeinführung in die Software kann man im Wiki finden. Mittlerweile gibt es eine Reimplementation der Software in C, das Repository ist hier unter http://svn.fnordlicht.de/fnordlicht-ng zu finden. Einen aktuellen Development-Snapshot bekommt man per: $ svn checkout http://svn.fnordlicht.de/fnordlicht-ng/trunk fnordlicht-ng Releases: fnordlicht-ng Firmware 0.1 (C) fnordlicht Firmware 0.2 (Assembler) (Changelog) fnordlicht Firmware 0.1 (Assembler) Der Chaostreff Paderborn hat auch eine Firmware in C geschrieben, die Dokumentation gibts hier, das Repository findet sich unter http://svn.chaos-paderborn.de:7770/fnordlicht/src/ Schaltung & Layout Die folgenden Daten wurden von fd0 (mail) erstellt und unter der CreativeCommons NonCommercial-ShareAlike 2.0 Germany Lizenz veröffentlicht. Diese Daten sind hauptsächlich für die bei U23 verwendeten Bausätze gedacht. Die Rohdaten (=Eagle-Dateien) werden nicht veröffentlicht. PDF-Dateien mit Vorlagen zum Selberätzen gibts auch. fnordlicht power fnordlicht control fnordlicht display serial konverter Schaltung Top (komplett) Top (nur Druc