full_description = "Um die Freiheit von Information, Forschung und Meinungsaustausch zu erhalten findet sich am Ende dieser Seite ein Mirror der zum Verst�ndnis des DVD-Verschl�sselungs-Verfahrens n�tigen Beschreibungen und Sourcen. Dabei ist es uns ein Anliegen, den Einwohnern Deutschlands zu vermitteln, in welcher Form die US-Filmindustrie sie um ihre Rechte zu bringen versucht. Grunds�tzlich zahlt man in Deutschland f�r alle Medien GEMA-Geb�hren, die man f�r das Speichern von Audio und Video benutzen kann. Deshalb gibt es hier auch einen preislich so gro�en Unterschied zwischen Daten- und Musik-Rohlingen. Die GEMA verteilt die eingenommenen Geb�hren dann an die K�nstler und die Filmindustrie. Tats�chlich hat man in Deutschland das Recht, einen in der Videothek geliehenen Film zu kopieren und bis an sein Lebensende immer wieder anzuschauen. Daf�r zahlt man GEMA-Geb�hren f�r das Videoband. Das gleiche gilt f�r Audio-CDs. Die Filmindustrie m�chte aber, da� man Filme kauft und nicht leiht, weil sie dann mehr Geld verdienen. Deshalb haben sie im Nachhinein die VHS-Norm versch�rfen lassen, damit ein Kopieschutz namens Macrovision m�glich wird. Wenn der Videostrahl des Fernsehers von rechts nach links zur�ckgelenkt wird, und wenn er von unten nach oben zur�ckf�hrt, hat man im Videosignal eine Pause. In dieser Pause �bertr�gt Macrovision St�rsignale, die eine Aufnahme per VHS-Rekorder verhindern sollen. Man kann im Einzelhandel Ger�te kaufen, die das wieder r�ckg�ngig machen. G�ngiger Preis sind DM 150. Das bedeutet im Klartext, da� man als Kunde in Deutschland Das Hauptproblem ist, da� Player nur das DVD-Logo tragen d�rfen, wenn sie Region Codes und CSS implementieren. F�r viele Leute w�re DVD als reiner Massenspeicher wichtig, die Filme sind mir z.B. ziemlich egal. Aber auch die Computer-Ger�te m�ssen Region Code und CSS implementieren, auch wenn sie niemals benutzt werden. Und bezahlen mu� daf�r der Kunde. Die Aussagen der Filmindustrie sind, da� CSS unautorisiertes Kopieren verhindern soll. Es stellt sich aber heraus, da� CSS genau das Gegenteil tut, denn man kann trotz CSS eine DVD kopieren, aber anschauen kann man sie sich nicht."
