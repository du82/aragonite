full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CCCeBIT 2002 - Die Rote Netzwerkkarte CCCeBIT: Die Rote Netzwerkkarte Dieses Jahr werden mehrere Preise vergeben an die Provider NRWs, die gefiltert haben. Hier sind schon mal Fotos von den Roten Netzwerkkarten zu finden. Symbol Parallel zu der Roten Karte beim Fußball werden den Providern von uns rote Netzwerkkarten gezeigt. Sie symbolisieren als Aussage ein deutliches "Stopp!" von Nutzern des Netzes gegen die Schwäche der Internetprovider gegenüber der Bezirksregierung. Fotos 519KB 193KB 193KB Bitte anklicken umd eine große Aufnahme zu sehen. Künstler/innenkollektiv Das Künstler/innenkollektiv "Panischer Kern" ist beim C4 beheimatet und hat schon mehrere symbolhafte Darstellungen für den Club und das Netz erarbeitet. Kontakt kann über den C4 hergestellt werden. by 2002-09-13 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content CCCeBIT: Die Rote Netzwerkkarte Symbol Fotos Künstler/innenkollektiv Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
