description = "Geschichte, Arbeit und Ziele des Chaos Computer Club"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Geschichte des CCC Geschichte, Arbeit und Ziele des Chaos Computer Club Chaos Computer Club Der Chaos Computer Club (CCC) wurde 1981 als Treff von Computerenthusiasten gegründet, zu einer Zeit also, als Computer maximal in großen Firmen und Regierungsorganisationen weit verbreitet waren. Die private Beschäftigung mit den Wunderkisten war nicht nur aufgrund des nicht völlig ungehinderten Zugangs schwierig, sondern wurde auch in Teilen der alternativen Szene, zu der sich der CCC durchaus zughörig fühlte, argwöhnisch beäugt. Die Hacker saßen in einer Zeit, in der Angst vor dem Computerstaat dominierte, quasi zwischen allen Stühlen. Der schöpferisch-kritische Umgang mit Technologien stand dadurch von Anfang an im Vordergrund. Seit 1984 gibt der Club die Zeitschrift Datenschleuder heraus und veranstaltet den jährlichen Chaos Communication Congress. 1986 war ein entscheidendes Jahr für den CCC. Im zweiten Wirtschaftskriminalitätsgesetz wurden erstmal einige Varianten des Hacksports unter Strafe gestellt und mit hässlichen Namen wie "Ausspähen von Daten" oder "Computersabotage" bedacht. Für den CCC stellte sich die Frage, wie es weiter gehen sollte: Als kriminelle Vereinigung oder als eingetragener Verein. Aus praktischen Erwägungen entschied sich der Club für die letztere Option und so kam es 1986 zur Gründung des Chaos Computer Club e.V. In seiner Satzung setzt sich der CCC für ein Menschenrecht auf zumindest weltweite ungehinderte Kommunikation ein und verschreibt sich der Förderung von Informationsfreiheit und Transparenz (z.B. in unserer Forderung nach einer maschinenlesbaren Regierung). Er versteht seine Arbyte als Teil einer notwendigen Auseinandersetzung mit den gesellschaftlichen Folgen von Technologien. Der CCC heute ist ein bundesweiter Verein, organisiert in Dezentralen, sogenannten Erfa-Kreisen und Chaos-Treffs. Er betreibt Kommunikationsstrukturen und Medien (Webserver, Mailinglisten) und führt Veranstaltungen durch oder nimmt an solchen teil. Der CCC ist in der Lobbyliste des Deutschen Bundestags eingetragen und wird in dieser Funktion zu Anhörungen und Expertengesprächen geladen. Seit 2002 ist der CCC Gründungsmitglied der European Digital Rights Initiative (EDRi). by jo 2002-09-06 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
