full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos - Öffentliche Veranstaltung Das OpenChaos ist eine Bildungsveranstaltung mit Beschnupperungsoption. Es findet jeden Monat statt. Bildung für Nerds durch OpenChaos Das OpenChaos ist eine Bildungsveranstaltung mit Beschnupperungsoption. Es findet jeden Monat in unseren Räumen in der Heliosstraße 6a statt -- wann das genau ist und um welches Thema es geht steht auf unserer Homepage. Wer den Termin nicht verpassen möchte, kann sich auf unsere Update-Mailingliste eintragen. Am Anfang gibt es in der Regel eine Vorstellungsrunde, damit man sich ein Bild machen kann, mit wem man spricht. Dann gibt es einen Vortrag zu einem Thema, welches aktuell als interessant gilt und danach geht es in allgemeines Palaver und Pläne zum Weltrettung über. Manchmal konsumieren weniger disziplinierte Mitwesen auch Kölsch, die meisten bevorzugen jedoch Mate :) Informationen zu einigen vergangenen OpenChaos Veranstaltungen finden sich im Wiki. by tho/mm 2006-06-10 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
