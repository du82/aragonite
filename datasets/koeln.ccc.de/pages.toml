["https://koeln.ccc.de/ablage/u23-2006/index.html"]
title = 'c4 | Projekt U23 (2006) - "on hacking well"'
description = "Ein spannendes Projekt für junge Hacker und Haecksen."
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Projekt U23 (2006) - "on hacking well" Ein spannendes Projekt für junge Hacker und Haecksen. " Du bist der Meinung, dass alle Informationen frei sein müssen. Du bist überzeugt, dass der Zugang zu Computern und Allem, das einem zeigen kann, wie diese Welt funktioniert, frei und unbegrenzt sein soll. Du bist höchstens 23 Jahre alt. Du suchst Kontakt zu Hackern. Du lässt Dir Lösungen nicht vorsetzen, sondern gehst deinen eigenen Weg. Du möchtest mit engagierten jungen Menschen komplexe Aufgaben im Team lösen. " Projekt U23 (2006) – „on hacking well“ U23 ist ein Projekt für junge Hacker und Haecksen bis 23 Jahre. An sechs Terminen werden die Teilnehmer über Sicherheitslücken, Hackangriffe und daraus schlussfolgernd über deren Vermeidung informiert. Während der Termine werden in einer Vortrags- und Hands-On-Session ausgewählte Sicherheitsprobleme aus dem Bereich Netzwerke, Betriebssysteme und Programmieren näher gebracht. Die gesammelten Erfahrungen sollen als Kompendium zusammen gestellt werden. Voraussetzungen Du solltest nicht älter als 23 Jahre sein und dich für Computer interessieren. Du solltest mit Linux oder einem Unix gearbeitet haben. Du solltest Dich mit einer modernen Programmiersprache wie C, C++, PHP, Perl, ruby oder Python beschäftigt haben. Du kannst Deinen Computer in ein Netzwerk integrieren und Du weißt, was 127.0.0.1/8 heisst. Von Vorteil ist es, wenn Du einen eigenen Laptop besitzt. Termine Am 10. August um 20:00 Uhr findet ein unverbindlicher Informationsabend mit anschließender Anmeldemöglichkeit statt. Dieser Abend ist nicht verpflichtend, es wird dort ein Überblick über den Inhalt des Projekts mit Möglichkeit zum Kennenlernen der Räume und Veranstalter geben. Die offiziellen Termine sind samstags von 16 bis 21 Uhr mit einer einstündigen Pause zwischen 18 und 19 Uhr: 19. August: TCP/IP Grundlagen, Trafficanalyse und Sniffing 26. August: Angriffsmöglichkeiten lokal und remote 2. September: kein offizieller Termin, jedoch Möglichkeit für Mitfahrt und Besuch der mrmcd in Darmstadt Es wird eine gemeinsame Fahrt zu dieser Veranstaltung organisiert. Die Kosten für die Fahrt nach Darmstadt und der Eintritt sind gesondert zu entrichten. Wir werden voraussichtlich einen Reisebus organisieren und Gruppenrabatt auf den Eintritt erhalten. Diese Veranstaltung ist eine gute Möglichkeit, um den Wissensdurst zu stillen und größere Netzwerke aktiv zu erforschen. 9. September: SQL-Injection, PHP-Securityprobleme, XSS und WLan 16. September: Inbound Checking und Exploits 23. September: Rootkits und ähnliche Spielereien, wenn man schon drin ist 30. September: Die Welt da draußen (Vorträge von extern) Ort U23 findet im Labor des Chaos Computer Club Cologne e.V. im Keller der alten Kartonagenfabrik Seybold, Vogelsanger Str. 286 in Köln-Ehrenfeld statt. Mit den meisten Verkehrsmitteln kommt man da problemlos hin (siehe Anfahrtsbeschreibung). Kosten Der Mitmach-Beitrag beträgt €23,– für die sechs Termine. Anmeldung Wir werden nicht mehr als 20 Teilnehmer zulassen. Die Erfahrung mit dem vorigen U23 hat gezeigt, dass es sonst zu voll und unübersichtlich wird. Sollte es mehr als 20 Interessenten geben, werden wir die Teilnehmer auswählen. Die Anmeldung ist bis zum 17. August frei geschaltet. Tutoren Lars “Pylon” (mail) Felix “Psypointer” (mail) Mario “mm” (mail) David “losTrace” (mail) Chris “Hotshot” (mail) Marcel “marcel_” (mail) FAQ Häufig gestellte Fragen zu U23: Lohnt es sich mitzumachen, wenn man an einem Abend keine Zeit hat? Ja, das lohnt sich auf jeden Fall. Die Abende sind in sich geschlossene Themen und können unabhängig voneinander besucht werden. Komm einfach beim Infoabend vorbei. Ich wohne weiter weg, würde aber gerne mitmachen. Gibts so ein Projekt auch in meiner Nähe? Motivier doch deinen lokalen Erfa-Kreis/Chaostreff, auch sowas aufzuziehen oder hilf direkt bei der Organisation mit! Wir können dieses Projekt leider nur im Köln/Aachener Raum anbieten, wollen aber andere Gruppen unterstützen. Ich hab mich angemeldet, aber keine Mail bekommen? Ich hab mich angemeldet aber nichts von euch gehört? Meld dich bitte bei Lars (mail) oder melde dich nochmal an. Kommunikation Teilnehmer werden auf eine Mailingliste zur Kommunikation subscribed. Webseiten zum Mitmachen werden im Wiki abgelegt. Zur synchronen Kommunikation eignet sich der IRC-Channel #u23 auf freenode. Presse Vertreter der Presse wenden sich bitte an Lars Weiler (mail). by pylon, fd0, pallas 2006-07-23 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Projekt U23 (2006) – „on hacking well“ Voraussetzungen Termine Ort Kosten Anmeldung Tutoren FAQ Kommunikation Presse Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
