["https://koeln.ccc.de/ablage/cccebit2001/index.html"]
title = "c4 | CCCeBIT 2001"
description = "CCCeBIT 2001"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CCCeBIT 2001 CCCeBIT 2001 CCCeBIT Wie die letzten Jahre auch, wird es dieses Jahr wieder ein Treffen des CCC auf der CeBIT, der Computerfachmesse in Hannover geben. Traditionell findet es Dienstag nachmittags statt und ist verbunden mit einer Auszeichnung. Der CCC hat dieses Jahr die Firma Siemens ausgewählt, die mit ihrem Produkt smartfilter (TM) ein Softwareprodukt auf den Markt gebracht hat, daß die Nutzung des Internets behindert aufgrund der Filterung von willkürlich kategorisierten URLs. 27. März 2001, 16:00 Uhr Siemens, Halle 3, Stand C20 Gefiltert An dieser Stelle können wir ja unsere Überlegungen und Dokumente veröffentlichen - die Damen und Herren von Siemens können sie nämlich hier nicht sehen: koeln.ccc.de wird auch gefiltert. Falls Sie doch von der Firma Siemens sind oder ein Kunde, der Smartfilter eingesetzt hat, so bedanken wir uns bei Ihnen von dieser Seite aus, daß sie sich die Mühe gemacht haben, den Filter mittels einer anderen Kennung oder eines anderen Zugangs zu umgehen. Dokumente Manifesto - Herr Siemens, Ihr Filter stinkt! Warum es 2001 ein Treffen auf der CeBIT gibt wird hier für Mitglieder und auch Nicht-Mitglieder erklärt und zusammengefasst. Laudatio Diss-Text zu Smartfilter Flyer (46k) Zum Audrucken und weitergeben. Hallenplan mit eingezeichnetem Treffpunkt (30k) als Grafik Fotos Ausgewählte Bilder sind jetzt erst online. Es sind zwar nur fünf, die aber reichen sollten, einen kleinen Eindruck von der Situation am Stand zu bekommen. weiterführende links Smartfilter Siemens ATD Siemens ATD CeBIT 2001 Smartfilter-Abfrage der URL Chaos Computer Club - bundesweit Halle 3 als PDF CCCeBIT 2001 by anonymous 2002-09-13 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content CCCeBIT Gefiltert Dokumente weiterführende links Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
