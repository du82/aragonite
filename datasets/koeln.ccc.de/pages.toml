["https://koeln.ccc.de/updates/2005-08-22_u23_3.html"]
title = "c4 | Jugendprojekt U23"
description = """
U23 ist das Jugendprojekt des CCC Cologne für junge Hacker und
  Haecksen bis 23 Jahre. Dieses Jahr dreht sich alles um das Thema
  Mikrocontroller und Elektronik.  Zunächst wird eine intelligente,
  programmierbare und farbige Lampe unter Anleitung fachkundiger Tutoren
  zusammengebaut, danach die verwendete Hard- und Software sowie das Erstellen
  eines Platinenlayout im einzelnen erklärt.  Anschliessend wird in Gruppen
  entweder an der Firmware des Mikrocontrollers oder an der Ansteuerung
  mehrerer solcher Lampen durch einen Rechner gearbeitet.  Zu diesem Projekt
  möchten wir euch herzlich einladen!"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Jugendprojekt U23 U23 ist das Jugendprojekt des CCC Cologne für junge Hacker und Haecksen bis 23 Jahre. Dieses Jahr dreht sich alles um das Thema Mikrocontroller und Elektronik. Zunächst wird eine intelligente, programmierbare und farbige Lampe unter Anleitung fachkundiger Tutoren zusammengebaut, danach die verwendete Hard- und Software sowie das Erstellen eines Platinenlayout im einzelnen erklärt. Anschliessend wird in Gruppen entweder an der Firmware des Mikrocontrollers oder an der Ansteuerung mehrerer solcher Lampen durch einen Rechner gearbeitet. Zu diesem Projekt möchten wir euch herzlich einladen! Update Das Projekt findet an sechs Donnerstagen (22. September bis 3. November) jeweils von etwa 18:30 bis 22:00 Uhr in unserem Labor statt, am nächsten Donnerstag (15. September) gibt es zusätzlich einen unverbindlichen Informationsabend mit anschliessender Anmeldemöglichkeit. Desweiteren wird die Besichtigung einer vollautomatisierten Platinenfertigungsanlage bei Dortmund angeboten. Alle Informationen und die Möglichkeit zur Anmeldung gibt es unter http://koeln.ccc.de/u23 by fd0 2005-09-08T16:44:00+00:01 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
