description = """
Tronicum stellt am Donnerstag, den 30.06.2005 um 20:00 imChaosLabor die gängigen Email Protokolle (SMTP, POP3, IMAP) vor und gehtauf die Vorschläge (RFCs und Patente) zur Spamreduktion(SPF, RMX, SenderID(tm), MTAMARK) ein."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos Email/SPAM Technologie und Implementationen Tronicum stellt am Donnerstag, den 30.06.2005 um 20:00 im ChaosLabor die gängigen Email Protokolle (SMTP, POP3, IMAP) vor und geht auf die Vorschläge (RFCs und Patente) zur Spamreduktion (SPF, RMX, SenderID(tm), MTAMARK) ein. Tronicum stellt am Donnerstag, den 30.06.2005 um 20:00 im ChaosLabor die gängigen Email Protokolle (SMTP, POP3, IMAP) vor und geht auf die Vorschläge (RFCs und Patente) zur Absenderfälschung (SPF, RMX, SenderID(tm), MTAMARK) ein. Neben den theoretischen Grundlagen (RFCs) die grob skizziert werden, sollen in dem Vortrag auch mögliche Implementationen mit OpenSource Software (postfix, exim, SpamAssassin, bogofilter, greylisting u.ä.) vorgestellt werden. Auch Client-Seitige Tools zur Markierung von SPAM werden angesprochen. Des Weiteren wird die Umsetzung der grossen Freemail Anbieter dargestellt, die teilweise proprietäre Lösungen für SPAM, Viren und Malware entwickelt haben. Auch das wachsende Problem mit DSN (delivery status notifications) wird behandelt. Jeder der sich für Email Technolgie interessiert, ist herzlich eingeladen auch um über die vorgestellten Konzepte bei einer Club Mate im Anschluss an den Vortrag fach-zu-simpeln ... by AmP 2005-06-18T21:30+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
