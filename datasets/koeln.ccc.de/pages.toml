title = "c4 | AS/400 -- Green Screen Geeks"
description = 'Im Chaos Computer Club Cologne (C4) steht seit Anfang 2000 eine Maschine der Kategorie "mittlere Datentechnik".'
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum AS/400 -- Green Screen Geeks Im Chaos Computer Club Cologne (C4) steht seit Anfang 2000 eine Maschine der Kategorie "mittlere Datentechnik". Was ist das alles? Im Chaos Computer Club Cologne (C4) steht seit Anfang 2000 eine Maschine der Kategorie "mittlere Datentechnik". Lustig ist es immer wieder, beinharte Unix-Hacker an den "Green Screen" zu setzen und die erste Reaktion abzuwarten, die da meistens lautet: "Das ist wirklich was ganz anderes". Klar, seitenorientierte Menüs, ein lustiger Editor namens SEU und die Sprache CLP sind nicht jedermanns Sache und sehen auf den ersten Blick so ungewohnt aus, dass Windows und Unix dagegen wie bei der Geburt getrennte Zwillinge wirken. Wir stellen auf diesen Seiten ein paar Informationen zu unserer AS/400 zusammen. Zur Maschine Der C4 besitzt eine IBM AS/400 9402 E04 aus dem Jahre 1994 mit deutschem OS/400. Weitere technische Daten zur Hard- und Software wurden von uns erforscht. Systemdaten Relative System Performance (CPW Value) 1 5.5 Relative System Performance (RAMP-C) 2 1.9 Main Storage (MB) 8-24 Disk Storage (GB) (Maximum) 4.08 Maximum Number of Workstations Twinax | ASCII | LocalTalk 42 | 48 | 31 Communication Lines (Maximum) 8 LAN Adapters (Maximum) 1 Available Card Slots (for I/O Adapters) 3 Number of System I/O Buses 1 Version 3 Processor Group P10 Dokumentation (lokaler Mirror) AS/400 System Concepts and Architecture Dokumentation im WWW IBM: http://www.as400.ibm.com http://publib.boulder.ibm.com Redbooks: AS/400 OS/400 Andere: AS/400 Portal AS/400 News Jeff Gunters AS/400 Seite AS/400 Security Info/400 AS/400 Links AS/400 Welt by c4 2002-09-14 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Was ist das alles? Zur Maschine Systemdaten Dokumentation (lokaler Mirror) Dokumentation im WWW AS/400 Links Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
