full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos im Maerz Trotz immenser Probleme mit unserem Mailserver wird es diesen Monat ein Openchaos geben. Mario redet ueber OpenSource und Linux auf dem Desktop. Der Schwerpunkt des Vortrages liegt dabei auf Gnome 2.14 und Mono Anwendungen. Freie Software hat spaetestens mit Ubuntu den Desktop von Otto-Normal erobert. Alle reden von Beagle, F-Spot, Banshee, Tomboy und dem neuen Gnome 2.14. Es wird kurz auf Open Source eingegangen, anschliessend werden verschiedene Anwendungen ausfuehrlich vorgestellt. Das Openchaos findet wie jeden Monat um ab 20:00 Uhr im C4-Labor statt. by mm 2006-03-29T22:42+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
