["https://koeln.ccc.de/updates/2006-08-22_openchaos_redteam.html"]
title = "c4 | OpenChaos August: Hacking for Security - Penetrationtests"
description = """
Als Penetrationtest, kurz Pentest, bezeichnet man eine
Sicherheitsüberprüfung von Netzwerken unter realitätsnahen Bedingungen.
Hierbei versuchen Sicherheitsexperten, genau wie mögliche Angreifer
auch, gezielt möglichst tief in ein Computersystem einzudringen, um so
Schwachstellen identifizieren zu können. Für den Auftraggeber fördert
ein solcher kontrollierter Einbruchsversuch innerhalb kurzer Zeit höchst
praxisrelevante Ergebnisse zutage."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos August: Hacking for Security - Penetrationtests Als Penetrationtest, kurz Pentest, bezeichnet man eine Sicherheitsüberprüfung von Netzwerken unter realitätsnahen Bedingungen. Hierbei versuchen Sicherheitsexperten, genau wie mögliche Angreifer auch, gezielt möglichst tief in ein Computersystem einzudringen, um so Schwachstellen identifizieren zu können. Für den Auftraggeber fördert ein solcher kontrollierter Einbruchsversuch innerhalb kurzer Zeit höchst praxisrelevante Ergebnisse zutage. Im Rahmen des Vortrags wird Jens Liebchen von RedTeam Pentesting über Penetrationtests in der Praxis informieren. Wie läuft ein Penetrationtest ab? Wer beauftragt Penetrationtests? Welchen Nutzen zieht der Auftraggeber aus einem Penetrationtest? Während des Vortrags werden immer wieder anonymisiert Ergebnisse aus zahlreichen Pentests aufgegriffen und besonders interessante oder auch kuriose Schwachstellen erläutert. Gegen Ende des Vortrags werden Schwachstellen vorgestellt, die man so gut wie in jedem Firmennetzwerk finden kann um den Teilnehmer ein Gefühl für die (Un-)sicherheit von Netzwerken zu geben. Anschliessend an den Vortrag besteht natürlich Raum für Diskussion über verschiedene sicherheitrelevante Themen im Komplex von Penetrationtests. Der Vortrag findet am 31. August statt und beginnt um 20:00 Uhr in den Räumlichkeiten des C4. by mm 2006-08-26T17:23+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
