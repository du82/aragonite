["https://koeln.ccc.de/ablage/u23-2007/index.html"]
title = "c4 | Projekt u23 (2007)"
description = "Ein spannendes Projekt für junge Leute bis 23"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Projekt u23 (2007) Ein spannendes Projekt für junge Leute bis 23 " Du bist der Meinung, dass alle Informationen frei sein müssen. Du bist überzeugt, dass der Zugang zu Computern und Allem, das einem zeigen kann, wie diese Welt funktioniert, frei und unbegrenzt sein soll. Du bist höchstens 23 jahre alt. Du suchst Kontakt zu Hackern. Du lässt Dir Lösungen nicht vorsetzen, sondern gehst deinen eigenen Weg. Du möchtest mit engagierten jungen Menschen eine komplexe Aufgabe im Team lösen. " U23 ist ein Projekt für junge Hacker und Haecksen bis 23 Jahre. An sechs Terminen werden die Teilnehmer in die Welt von Platinen, Mikrocontrollern und externen Ansteuerungen eintauchen. Unter Anleitung von Tutoren baust Du in einer Gruppe Peripherie für das etherrape. Dieses ist ein Mikrocontroller mit Ethernet-Anschluss. Ob nun ein Zustandssensor für Deine Fenster und Türen oder eine Wasserstandsanzeige Deiner Topfpflanzen – hier hast Du die Möglichkeit Deine Ideen umzusetzen. Die Ergebnisse werden im Rahmen eines OpenChaos der Öffentlichkeit vorgestellt. Voraussetzungen Du solltest nicht älter als 23 Jahre sein und dich für Computer interessieren. Alternative Betriebssysteme sollten dich nicht abschrecken. Löterfahrung und Elektronikkenntnisse sind sehr hilfreich, aber nicht notwendig. Die Programmierung des Mikroconntrollers wurde in C unter Linux durchgeführt. Ein wenig Ahnung auf diesem Gebiet wäre nicht verkehrt. Wenn Du einen eigenen Laptop hast, umso besser, aber eine Vorraussetzung ist das nicht. Termine Am 23. April um 20:00 Uhr findet ein unverbindlicher Informationsabend mit anschließender Anmeldemöglichkeit statt. Dieser Abend ist nicht verpflichtend. Wir werden den Chaos Computer Club Cologne bzw. den Chaos Computer Club Darmstadt vorstellen, das etherrape, bisherige Umsetzungen und den groben Ablauf des U23 zeigen. Wer seine Eltern noch überzeugen muss, kann sie ruhig mitbringen. Ansonsten immer montags von etwa 18:00 bis 22:00 Uhr: 7. Mai: 1. Projektabend 14. Mai: 2. Projektabend 21. Mai: 3. Projektabend 28. Mai (Pfingstmontag): Zusatztermin oder kompletter Ausfall 4. Juni: 4. Projektabend 11. Juni: 5. Projektabend 18. Juni: 6. Projektabend 26. Juni: Vorstellung der Ergebnisse in Darmstadt 28. Juni: OpenChaos mit Vorstellung der Ergebnisse in Köln Ort Zum ersten Mal findet U23 parallel an zwei Orten statt: In Köln im Labor des Chaos Computer Club Cologne e.V. im Keller der alten Kartonagenfabrik Seybold, Vogelsanger Str.286 in Köln-Ehrenfeld und in Darmstadt an der Technischen Universität (Stadtmitte), Informatikbau (Piloty-Gebäude), Raum E115. Kosten Der Mitmach-Beitrag beträgt €23,– für alle Abende. Wohin die Überweisung geht, erfährst Du in der Bestätigungsmail, wenn Du zum U23 angenommen bist. Anmeldung Die Anmeldung wurde am 28. April geschlossen. Sorry, Du bist zu spät. Tutoren Alexander “fd0” (mail) (Köln) Lars “Pylon” (mail) (Köln) Lars “cebewee” (mail) (Köln) Michael “shorty” (mail) (Köln) Tobias “TobiX” (mail) (Köln) Christian “HotShot” (mail) (Köln) Julian “codemonk” (mail) (Darmstadt) Tobias “bios” (mail) (Darmstadt) “krikkit” (mail) (Darmstadt) “snafu” (mail) (Darmstadt) “risktaker” (mail) (Darmstadt) FAQ Häufig gestellte Fragen zu U23: Lohnt es sich mitzumachen, wenn man an einem Abend keine Zeit hat? In Köln wird die Anmeldung vermutlich wieder traditionell überlaufen sein. Deshalb werden wir dieses Mal eher nur Personen annehmen, die auch an allen Terminen teilnehmen können. Schließlich ist dieses eine Gruppenarbeit und es wäre unfair gegenüber Deiner Gruppe, wenn Du fehlen würdest. Ich wohne weiter weg, würde aber gerne mitmachen. Gibts so ein Projekt auch in meiner Nähe? Motivier doch deinen lokalen Erfa-Kreis/Chaostreff, auch sowas aufzuziehen oder hilf direkt bei der Organisation mit! Wie Du siehst, bieten wir nun inzwischen in zwei Orten ein U23 an. Ich hab mich angemeldet, aber keine Mail bekommen? Ich hab mich angemeldet aber nichts von euch gehört? Meld dich bitte bei Lars (mail) oder melde dich nochmal an. Ich hab eine Frage zum etherrape selber… Schau dir bitte vorher die Projektseite zum etherrape an. Presse Vertreter der Presse wenden sich bitte an Lars Weiler (mail). by fd0, pylon 2007-04-03 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Voraussetzungen Termine Ort Kosten Anmeldung Tutoren FAQ Presse Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
