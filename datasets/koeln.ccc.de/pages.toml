["https://koeln.ccc.de/ablage/artikel/hacker-howto-esr.html"]
title = "c4 | Wie werde ich ein Hacker"
full_description = 'Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Wie werde ich ein Hacker Deutsche Übersetzung des Textes von Eric S. Raymond "How to become a Hacker" mit einem notwendigen Nachwort des CCC Cologne. Weitere Infos am Ende. Dieser Text ist aus dem letzten Jahrzehnt und, in mancher Hinsicht, ziemlich veraltet. Tips für Programmiersprachen und ähnliches sind möglichst mit einer Prise Skepsis zu beachten. Was ist ein Hacker? Das Jargon-File enthält eine Vielzahl von Definitionen des Begriffes "Hacker", welche hauptsächlich etwas mit technischem Können, einer Freude an der Lösung von Problemen und dem Übertreten von Grenzen zu tun haben. Wenn du aber wissen möchtest, wie man ein Hacker wird , dann sind nur zwei Sachen wirklich wichtig. Zum einen gibt es eine Gemeinschaft, bestehend aus Programmierern und Netzwerk-"Magiern", deren Wurzeln zurück bis in die Zeit der ersten Minicomputer und den frühesten ARPA-Netz-Versuchen reichen. Die Mitglieder dieser Kultur schufen den Begriff "Hacker". Hacker bauten das Internet, Hacker machten das UNIX Betriebssystem zu dem, was es heute ist, Hacker betreiben das Usenet, Hacker brachten das World Wide Web zum Laufen, Hacker schufen noch viel mehr. Wenn du ein Teil dieser Kultur bist, wenn du zu ihrem Sein und ihrer Entwicklung beigetragen hast, wenn andere Mitglieder wissen wer du bist und dich einen Hacker nennen, erst dann bist du auch wirklich ein Hacker. Die Hacker-Weltanschauung ist auf der anderen Seite nicht auf die Softwarehacker-Gemeinschaft beschränkt. Es gibt Strömungen, welche die Haltung der Hacker auf andere Dinge, wie Elektronik oder Musik - eigentlich auf die höchste Stufe des Könnens jeder Kunst oder Wissenschaft - übertragen. Software-Hacker erkennen diese verwandten Seelen an und nennen sie gelegentlich ebenfalls "Hacker". Es gibt sogar Stimmen, die sagen, die Einstellung der Software-Hacker sei absolut unabhängig von dem jeweiligen Medium, mit dem sich der Hacker beschäftigt. In dem Rest dieses Textes wollen wir uns jedoch auf die Eigenschaften und Einstellungen der Softwarehacker und ihre Traditionen konzentrieren, welche den Begriff Hacker ins Leben rief. Cracker Es gibt noch eine andere Gruppe, die sich lautstark als Hacker bezeichnet, diesen Namen aber in keinster Weise verdient. Es sind Menschen (meist pubertierende männliche Wesen), welche einen Spaß daran haben, in Computer einzubrechen und das Telefonnetz zu zerstören. Echte Hacker nennen diese Leute "Cracker" und wollen mit ihnen nichts zu tun haben. Wirkliche Hacker halten Cracker für ein faules, unverantwortliches und nicht besonders schlaues Pack, denn genauso wenig wie man durch das Knacken von Sicherheitscodes ein Hacker wird, wird man durch das Kurzschließen eines Autos zu einem KFZ-Mechaniker. Unglücklicherweise sind viele Journalisten und Schreiber darauf verfallen, das Wort Hacker als Beschreibung für Cracker zu verwenden; dies verärgert echte Hacker ungemein ... Der grundlegende Unterschied ist: Hacker bauen Dinge auf, Cracker zerstören sie. Wenn du ein Hacker werden willst, lies weiter. Wenn du aber ein Cracker werden willst, geh, lies die Newsgroup alt.2600 und bereite dich darauf vor fünf bis zehn Jahre im Knast zu verbringen, nachdem du herausgefunden hast, daß du doch gar nicht so schlau bist, wie du gedacht hast. Und dies ist alles, was ich über Cracker zu sagen habe! Die Einstellung Hacker lösen Probleme und bauen Dinge auf, sie glauben an Freiheit und freiwillige, gegenseitige Hilfe. Um als Hacker akzeptiert zu werden, mußt du dich verhalten als hättest du diese Einstellung. Um dich aber so zu verhalten, als hättest du diese Einstellung, mußt du wirklich an sie glauben. Wenn du nun aber glaubst, die Hacker-Einstellung sei der Schlüssel zu deiner Akzeptanz durch die Gemeinschaft, liegst du falsch. Ein Mensch zu werden, der diese Eigenschaften glaubt und verinnerlicht hat, ist wichtig für dich selbst , sie helfen dir, leichter zu lernen und halten dich motiviert. Genau wie in allen Künsten ist es am effektivsten das Denken der Meister zu imitieren - nicht nur von der Wissensseite, sondern auch von der emotionalen. Die Welt ist voll von faszinierenden Problemen, die alle nur darauf warten, gelöst zu werden. Ein Hacker zu sein, bedeutet jede Menge Spaß, aber es ist eine Art von Spaß, die viel Anstrengung erfordert. Sich anzustrengen, setzt Motivation voraus. Erfolgreiche Athleten bekommen ihre Motivation aus einer Art körperlichen Hochgefühls, wenn sie ihre Körper trainieren oder wenn sie sich bis über ihre Leistungsgrenzen hinaus verausgaben. So ähnlich geht es dem Hacker, er muß eine grundlegende Erregung verspüren, wann immer er ein Problem lösen, seine Fähigkeiten erweitern oder seinen Geist trainieren konnte. Wenn du keine Person bist, die schon von Natur aus so fühlt, mußt du eben eine werden, wenn du ein Hacker werden willst, denn sonst wirst du schnell bemerken, daß deine Hacker-Energie von Ablenkungen wie Sex, Geld oder sozialer Anerkennung verbraucht wird. (Du mußt außerdem eine Art von Glauben in deine eigene Lernfähigkeit entwickeln - einen Glauben, der dich dazu bringt, daß auch, wenn du keinen blassen Schimmer haben solltest, wie du das gesamte Problem lösen kannst, wenn du nur ein kleines Stück löst und davon lernst, du genug gelernt haben wirst um das nächste Stückchen zu lösen - und so weiter, bis du es irgendwann geschafft hast.) Niemand sollte jemals gezwungen sein, ein Problem zweimal zu lösen. Kreative Köpfe sind wertvoll und selten. Sie sollten nicht darauf verschwendet werden, das Rad noch einmal zu erfinden, wenn doch so viele wunderbare neue Probleme darauf warten gelöst zu werden. Um wie ein Hacker zu handeln, mußt du glauben, daß die Zeit, die einem Hacker zum Denken zur Verfügung steht, kostbar ist - so kostbar, daß es beinahe eine moralische Pflicht ist deine Informationen zu teilen, Probleme zu lösen und die Lösung weiterzugeben, damit andere Hacker sich neuen Problemen zuwenden können, anstatt andauernd bereits gelösten wieder aufrollen zu müssen. (Das bedeutet nicht, daß du alle Errungenschaften deiner Kreativität weggeben mußt, obwohl denjenigen, die dies tun, der höchste Respekt entgegengebracht wird. Es ist mit den Hackerwerten vereinbar, genug zu verkaufen, um sich mit Computern, Essen und einem Dach über dem Kopf zu versorgen. Es ist vertretbar Hacker-Fähigkeiten einzusetzen, um eine Familie zu versorgen oder sogar um reich zu werden, solange du nie vergißt, daß du ein Hacker bist, während du all dies tust.) Langeweile und Schufterei sind bösartig. Hacker (generell alle kreativen Leute) sollten niemals gelangweilt sein oder dazu genötigt sein stumpfsinnige, sich ständig wiederholende Arbeit zu tun, weil dies natürlich bedeutet, daß sie nicht das tun, was nur sie tun können - nämlich neue Probleme lösen. Diese Verschwendung schadet allen. Also sind Langeweile und Plackerei nicht nur einfach unangenehm, sondern mehr oder weniger bösartig. Um sich wie ein Hacker zu benehmen, mußt du dies stark genug glauben, um die langweiligen Arbeiten so weit wie möglich wegautomatisieren zu wollen, und das nicht nur für dich selbst, sondern auch für alle anderen Menschen (besonders andere Hacker). (Es gibt eine Ausnahme von dieser Regel. Hacker tun manchmal Sachen, welche auf den ersten Blick langweilig und stumpfsinnig erscheinen, aber in Wirklichkeit dazu dienen zu üben, den Kopf frei zu kriegen, eine Fähigkeit zu erwerben oder eine bestimmte Erfahrung zu erlangen, welche andersartig nicht erreicht werden kann. Aber dies ist absolut freiwillig - niemand, der bei klarem Verstand ist, sollte jemals zu Langeweile gezwungen werden.) Freiheit ist gut. Hacker sind von Natur aus antiautoritär veranlagt. Jeder, der dir Befehle geben kann, kann dich auch davon abhalten das Problem zu lösen, das dich gerade fasziniert - und wird - dies ist einfach die Art, nach der autoritäre Gehirne arbeiten - ein paar furchtbar blödsinnige Gründe finden, damit er dies auch tun kann. Autoritäre Einstellungen müssen bekämpft werden, wo immer sie gefunden werden, damit sie nicht dich und andere Hacker ersticken. (Dies ist nicht das selbe, wie alle Autoritäten zu bekämpfen. Kinder müssen angeleitet werden und Kriminelle aufgehalten werden. Ein Hacker wird darüber hinaus manchen Arten von Autorität zustimmen und sie akzeptieren, wenn er dadurch etwas bekommt, was für ihn wertvoller ist, als die Zeit, die er mit dem Befolgen der Befehle verbringt. Aber dies ist ein begrenzter, beabsichtigter Handel; aber die Art der persönlichen Unterwerfung, die Autoritäten verlangen, kann man nicht mehr als ein Angebot betrachten.) Autorität gedeiht auf dem Boden der Zensur und Geheimhaltung, sie mißtraut freiwilliger Zusammenarbeit und freiheitlicher Aufteilung der Informationen - die einzige "Zusammenarbeit", die sie gerne sehen ist diese, die unter ihrer Kontrolle steht. Wenn du also wie ein Hacker handeln willst, mußt du eine instinktive Feindschaft gegenüber Zensur, Geheimhaltung und dem Einsatz von Gewalt oder Betrug entwickeln, und du mußt bereit sein, nach diesem Glauben zu handeln. Einstellung ist kein Ersatz für Können und Wissen. Um ein Hacker zu sein mußt du diese Einstellung, wenigstens größtenteils, teilen. Aber eine Einstellung nur zu übernehmen macht dich genausowenig zu einem Hacker, wie sie dich zu einem Rock Star oder hervorragenden Athleten machen wird. Um ein Hacker zu werden, benötigst du Intelligenz, Übung, Hingabe, und du wirst viel harte Arbeit vor dir haben. Deshalb mußt du lernen, fremden Einstellung zu mißtrauen und Kompetenz jedweder Art zu respektieren. Hacker werden es nicht zulassen, daß Angeber ihre Zeit verschwenden, aber sie verehren Können - besonders Kompetenz im Hacken, aber Kompetenz generell ist auch gut. Kompetenz in gefragten Fähigkeiten, die nur wenige beherrschen ist besonders gut, und Kompetenz in gefragten Fähigkeiten, die geistige Klarheit, Geschicklichkeit und Konzentration erfordern, ist das absolut Beste. Wenn du Können und Wissen schätzt, wirst du Freude daran haben, sie in dir selbst zu entwickeln - die harte Arbeit und die Hingabe werden von solch einer Intensität sein, daß sie eher einem Spiel ähneln als Schufterei. Dies ist absolut überlebenswichtig, wenn du ein Hacker werden willst. Grundlegende Hacker Fähigkeiten Hackereinstellung ist wichtig, aber Hacker-Fähigkeiten sind es noch viel mehr. Einstellung ist kein Ersatz für Können, und es gibt einen Sammlung von Fähigkeiten, welche du unbedingt haben mußt, bevor irgendein Hacker davon träumen wird, dich einen Hacker zu nennen. Diese Werkzeugkiste des Hackers verändert sich nur langsam. Der Wandel findet in dem Maße statt, indem der technische Fortschritt neue Fähigkeiten erfordert und alte überflüssig macht. Zum Beispiel, ist Maschinensprachprogrammierung früher eine Bedingung gewesen, während HTML bis vor kurzem keine Rolle spielte. Aber Ende 1996 kann man mit ziemlicher Klarheit die folgenden Punkte hinzuzählen: Lerne programmieren. Dies ist natürlich die wichtigste Hackerfähigkeit. 1997 ist die Sprache, die du auf jeden Fall lernen mußt, C (obwohl es nicht diejenige sein sollte, die du als erstes lernst). Aber du bist einfach kein Hacker, oder eben hauptsächlich nur ein Programmierer, wenn du nur eine Sprache kennst - du mußt lernen, Probleme des Programmierens in einer allgemeinen Form zu betrachten, unabhängig von der jeweiligen Umsetzung in die verschiedenen Sprachen. Um ein echter Hacker zu werden, mußt du an den Punkt gelangen, wo du eine neue Sprache innerhalb von Tagen lernen kannst, weil du den Inhalt des Handbuchs direkt zu dem in Beziehung setzen kannst, was du bereits weißt. Dies bedeutet, du solltest viele verschiedene Ansätze, sprich Programmiersprachen, dir zu eigen machen. Neben C, solltest du mindestens LISP und Perl lernen (Java pocht hart auf das Recht hier genannt zu werden). Neben ihrer Bedeutung als die wichtigsten Hackersprachen stellen diese Programmiersprachen sehr differenzierte Annäherungen an die Programmierung da. Es wird dich auf viele, wertvolle Arten bereichern. Ich kann keine genaue und komplette Beschreibung angeben, wie man lernt zu programmieren - dazu ist diese Fähigkeit zu komplex. Aber ich kann dir sagen, daß du mit Büchern und Kursen nicht sehr weit kommen wirst (viele, vielleicht die meisten Hacker haben sich alles selbst beigebracht). Was du tun mußt, ist (a) Programm-Code lesen und (b) Programm-Code schreiben. Programmieren lernen ist, wie in einer natürlichen Sprache gut schreiben zu lernen. Der beste Weg ist Code zu lesen, der von Meistern der Programmierung geschrieben wurde, und dann etwas selber zu schreiben, wieder jede Menge zu lesen und ein bißchen zu schreiben, wieder lesen und diesmal mehr zu schreiben... und dies alles so lange zu wiederholen, bis du beginnst Stärken und Effizienz in deinen Arbeiten zu entwickeln. Guten Programmcode zu finden, der sich zum Lesen eignet, war früher ziemlich schwer, weil es einfach so wenig große Programme als Quelltext für Grünschnäbel zum Lesen und Herumbasteln gab. Dies hat sich dramatisch geändert; kostenlose Software, kostenlose Programmierwerkzeuge und kostenlose Betriebssysteme (alles als Quelltext verfügbar und alles von Hackern geschrieben) ist jetzt weitgehend verfügbar. Was uns nahtlos zu unserem nächsten Thema bringt... Hol dir eins der kostenlosen UNIXe und lerne wie man es benutzt und betreibt. Ich nehme an, du hast einen PC oder kannst auf einen zugreifen (diese Kids von heute haben es so einfach :-)). Der einzige wichtige Schritt, den jeder Newbie in Richtung des Erwerbes von Hackerfähigkeiten tätigen kann, ist es sich eine Kopie von Linux oder von einem der kostenlosen B S D- UNIXe zu besorgen, diese auf einem PC zu installieren und sie zu starten. Klar, es gibt noch andere Betriebssysteme in der Welt außer UNIX. Aber sie werden in binärer Form ausgeliefert - du kannst also den Code weder lesen noch verändern. Unter DOS, Windows oder MacOS hacken zu lernen ist, wie wenn du mit einer Zwangsjacke Ballett tanzen lernen sollst. Außerdem ist UNIX das Betriebssystems des Internet. Während du das Internet benutzen kannst ohne UNIX zu kennen, kann du kein Internet-Hacker sein ohne UNIX zu verstehen. Dies ist der Grund warum die Hacker-Gemeinde heutzutage stark UNIX-zentriert ist. (Dies war nicht immer so, und manche Hacker aus den alten Zeiten sind ganz und gar nicht glücklich damit, aber das Zusammenspiel zwischen UNIX und dem Internet scheint so stark geworden zu sein, daß sogar Microsofts Muskelspiele sie nicht zu trennen vermag.) Um mehr über UNIX zu lernen lies The Loginataka. Wenn du Linux haben möchtest, lies Linux Links. Lerne das Web zu benutzen und HTML-Code zu schreiben. Die meisten Dinge, die die Hacker-Kultur geschaffen hat, arbeiten außerhalb der Sichtweite des Normalsterblichen, hinter den Mauern von Fabriken, Universitäten, Büros ohne Auswirkung auf das Leben der Nichthacker. Das Web ist die eine, große Ausnahme, das große, glänzende Hackerspielzeug, dessen we'
