["https://koeln.ccc.de/updates/2024-11-19_OC_Strahlenforschung_Mondmission.html"]
title = "c4 | OpenChaos am Donnerstag, 28. November: Strahlungsforschung für zukünftige Mondmissionen im Rahmen des Artemis Programms"
description = "Ionisierende kosmische Strahlung ist eine der großen Gefahren für Astronauten im Weltall. Wie kann diese nicht spürbare Gefahr gemessen und sichtbar gemacht werden?"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos am Donnerstag, 28. November: Strahlungsforschung für zukünftige Mondmissionen im Rahmen des Artemis Programms Ionisierende kosmische Strahlung ist eine der großen Gefahren für Astronauten im Weltall. Wie kann diese nicht spürbare Gefahr gemessen und sichtbar gemacht werden? Zum Mond, zum Mars und darüber hinaus – hochenergetische kosmische Strahlung und Sonnenstürme können Körper und Raumschiff schädigen. Außerhalb des schützenden Magnetfelds und der Atmosphäre der Erde bedeutet die ionisierende Strahlung vor allem Gefahr. Um wirksame Schutzmaßnahmen zu entwickeln, müssen zuverlässige Messdaten erhoben werden. Wir freuen uns am Donnerstag, den 28. November, Karel Marsalek bei uns zu begrüßen, den Leiter der Entwicklung elektronischer aktiver Instrumente für die Messung der kosmischen ionisierenden Strahlung im Weltall am Deutschen Zentrum für Luft- und Raumfahrt. Er wird über die Entwicklung, Kalibration, Charakterisierung und Tests der Weltraumhardware sprechen, die zur Detektion von Strahlung an Bord der ISS, auf Satelliten, in der Mondumlaufbahn sowie auf der Mondoberfläche und auf Erkundungsmissionen eingesetzt wird. Im Vortrag wird Karel uns im Kontext der Artemis I Mission auf eine Reise von der Erde zum Mond und wieder zurück mitnehmen, um zu zeigen, wie aufgrund der Messdaten die Schutzeigenschaften der Raumfähren zu evaluiert werden. Das OpenChaos findet am Donnerstag, den 28. November, in den Räumen des Chaos Computer Club Cologne statt. Beginn ist, wie immer, um 20:00 Uhr. Wir freuen uns auf Euch! by thee 2024-11-19T00:42:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
