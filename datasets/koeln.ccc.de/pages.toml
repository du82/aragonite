["https://koeln.ccc.de/updates/2005-12-15_keysigning_cacert.html"]
title = "c4 | OpenChaos im Dezember - Keysigning/CACert"
description = """
In der letzten Woche des Jahres findet ja bekanntlich der 22. Chaos Communication Congress (22C3) statt.Aus diesem Grund wird es zwar kein reguläres OpenChaos geben, dennochwird es am 15. Dezember in den Räumlichkeiten desChaos Computer Club Cologne ein Keysigning und eine CA-Certifizierung geben."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos im Dezember - Keysigning/CACert In der letzten Woche des Jahres findet ja bekanntlich der 22. Chaos Communication Congress (22C3) statt. Aus diesem Grund wird es zwar kein reguläres OpenChaos geben, dennoch wird es am 15. Dezember in den Räumlichkeiten des Chaos Computer Club Cologne ein Keysigning und eine CA-Certifizierung geben. Am 15. Dezember treffen wir uns um 20:00 Uhr zum Keysigning/CACerten im Labor. Nach einem kurzen (ca 20-30 Minuten) Vortrag über Sinn und Zweck von Web of Trust, Public-Key Infrastructure und Kryptographie im Allgemeinen beginnen wir mit der Keysigning Party. Bringt mindestens 2 amtliche Ausweise (Perso, Reise, Führerschein u.ä.) falls Ihr für CACert interessiert seid. Nähere Informationen findet Ihr hier verlinkt. by mangala 2005-12-10T11:50+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
