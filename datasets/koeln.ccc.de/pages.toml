["https://koeln.ccc.de/updates/2025-01-23_OC_PsyLink_neural_interface.html"]
title = "c4 | Open Chaos am 30: Januar. PsyLink: Controlling computers with nerve signals"
description = "At the next OpenChaos Yuni will talk about PsyLink: An open source hardware project that measures nerve/muscle impulses on the skin and uses those to control computers."
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Open Chaos am 30: Januar. PsyLink: Controlling computers with nerve signals At the next OpenChaos Yuni will talk about PsyLink: An open source hardware project that measures nerve/muscle impulses on the skin and uses those to control computers. Dieser Vortrag wird auf Englisch gehalten Deutsche Version am Ende der Seite On the 30th of January 2025, Yuni is going to talk about PsyLink, an open source electrode armband that measures electric signals on the skin and turns them into computer inputs. The talk will discuss why neural interfaces are an important but also tricky subject, and explain how PsyLink turns nerve impulses into keyboard inputs - from the electrical circuits, to the embedded firmware, to the machine learning software that does the signal processing (and about making the software cross-platform using Rust). The OpenChaos will be on Thursday, January 30th, at Chaos Computer Club Cologne. As usual the talk will begin at 20:00. This talk will be held in English. Dieser Talk wird auf English gehalten Beim OpenChaos 30. Januar 2025 erzählt Yuni von PsyLink, einem open source Armband mit Elektroden, welches elektrische Signale auf der Haut ausließt und daraus Computereingaben erzeugt. Yuni wird davon berichten wieso Nervenschnittstellen (neural interfaces) ein wichtiges und auch heikles Thema sind. Außerdem wird im Talk im Detail erklärt werden, wie PsyLink Biosignale zu Tastatureingaben umwandelt, von elektrischen Schaltungen, über die Firmware, bis hin zur Machine-Learning Software zur Signalverarbeitung (und wie die Software mit Rust Plattformunabhängig wurde). Das OpenChaos findet am Donnerstag, den 30. Januar, in den Räumen des Chaos Computer Club Cologne statt und wird auf Englisch gehalten. Beginn ist, wie immer, um 20:00 Uhr. Wir freuen uns auf Euch! by 2025-01-22T21:00:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
