["https://koeln.ccc.de/updates/2006-05-25_openchaos_kulla.html"]
title = "c4 | OpenChaos Mai: Entschwörungstheorie"
description = '''
Am 25. Mai 2006 um 20 Uhr besucht uns in unserer Reihe Open Chaos im  CCC Köln ein Gast von weit her: Daniel Kulla, trampender Wortarbeiter, Autor von "Der Phrasenprüfer. Szenen aus dem Leben von  Wau Holland, Mitbegründer des Chaos Computer Clubs" und Publizist bei  der Zeitschrift Jungle World und im eigenen Verlag, spricht zum Thema  "Nur weil du paranoid bist, heißt das nicht, daß du hinter anderen  her sein mußt: Entschwörungstheorie".'''
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos Mai: Entschwörungstheorie Am 25. Mai 2006 um 20 Uhr besucht uns in unserer Reihe Open Chaos im CCC Köln ein Gast von weit her: Daniel Kulla, trampender Wortarbeiter, Autor von "Der Phrasenprüfer. Szenen aus dem Leben von Wau Holland, Mitbegründer des Chaos Computer Clubs" und Publizist bei der Zeitschrift Jungle World und im eigenen Verlag, spricht zum Thema "Nur weil du paranoid bist, heißt das nicht, daß du hinter anderen her sein mußt: Entschwörungstheorie". Als Theoretiker der Mechanismen von Ent- und Verschwörung zeigt Kulla an aktuellen Beispielen den dringend notwendigen anderen Umgang mit populären Verschwörungstheorien, von Ahmadinedschads Brief an Bush samt Rezeption und die Debatte um Dan Browns Da Vinci Code, über den 11. September 2001 bis zu einer der global am weitesten verbreiteten Ideologien: die Vorstellung einer jüdischen Konspiration, welche über die Kontrolle der amerikanischen Ostküste die Welt beherrscht. In diesem antiimperialistisch konnotierten Bild sind die noch vor 100 Jahren klar getrennten Stränge der Verschwörungstheorie - die antisemitische und die anti-geheimbündlerische - verbunden, so daß es für rechte und linke Vereinfacher und Ideologen, für Nazis und Leninisten gleichermaßen attraktiv geworden ist. Zur "Entschwörung" - also dem Auffinden praktikabler Antworten und Gegenstrategien - müßten Ideologiekritik und faktische Widerlegung gebündelt und die Verschwörungstheorie als eine viel allgemeinere Strategie zur Vereinfachung und Dramatisierung der unübersichtlichen Welt angesehen werden. Die Abgrenzung selbst gerät als problematisch in den Blick, da die Verschwörungstheorie immer auch in den Lücken des rationalistischen Tatsachenfetischismus nisten kann und als ein dialektischer Zwilling aller offizieller Ideologie funktioniert. Der Vortrag findet am 25. Mai statt und beginnt um 20:00 Uhr in den Räumlichkeiten des C4. by johl 2006-05-18T19:40+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
