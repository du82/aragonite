["https://koeln.ccc.de/ablage/cccebit2005/index.html"]
title = "c4 | CCCeBIT 2005"
description = """
CCCeBit 2005: Biometrische Merkmale in Ausweisdokumenten:  sinnlos, gefährlich, teuer"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CCCeBIT 2005 CCCeBit 2005: Biometrische Merkmale in Ausweisdokumenten: sinnlos, gefährlich, teuer CCCeBIT 2005: Biometrische Merkmale in Ausweisdokumenten: sinnlos, gefährlich, teuer Dienstag, 15. März, 16 Uhr Bundesdruckerei, Halle 7, Stand B36 Der CCC erinnert auch dieses Jahr wieder bei der alljährlichen Nabelschau der IT-Branche an den Grundsatz, dass einfache Technikrezepte keine Lösung für soziale Probleme bieten. In diesem Fall geht es um nicht mehr als die Innere Sicherheit und die Totalerfassung der Bevölkerung unter einem pauschalen Terrorismusverdacht. Dieses Ganze soll im Rahmen der neuen Sicherheitstechnik geschehen, bei der biometrische Erkennungsdaten auf Dokumenten gespeichert werden sollen. Diese sollen kontaktlos mittels RFID-Technik bei Grenzübergängen ausgelesen werden, dank internationaler Standardisierung auch bei Einreisen und Ausreisen fremder Länder. Dabei haben wir als CCC nicht nur grundsätzliche Zweifel am Prinzip, massenweise die Identitäten anhand von Biometrischen Merkmalen zu überprüfen. So konnte eine Reihe von Fingerabdruckscannern überlistet werden. Eine massenweisen Anwendung ist aufgrund der Fehlerrate unsinnig, ineffizient und zieht weitere Fragen hinterher, wer bei einer Nichterkennung zur Rechenschaft gezogen wird. Die grundsätzliche Kostenfrage drückt auch weiter. Dieses Jahr geht der CCCeBIT-Award als Anti-Preis an die Bundesdruckerei, wegen der geplanten Einführung der biometrischen Erkennungsmerkmale in Reisedokumenten verbunden mit unsicherer RFID-Technologie. Materialien Manifesto: Flyer zur CCCeBIT 2005 Bilder: Symbolischer Preis Hintergrund Der gemeinschaftliche Besuch der CeBIT ist immer mit einer Auszeichnung des CCC an einen ungeliebten Aussteller verbunden, dem CCCeBIT-Award. Der CCC übergibt diesen Preis an ein Unternehmen, das sich im abgelaufenen Jahr oder kommend mit Aktivitäten in Richtung Monopolbildung oder -erhaltung, Einschränkung des Datenschutzes bewegt hat oder einfach auch nur Mist baut. Sonstiges Für Mitglieder: Das abendliche Treffen wird wie jedes Jahr in der Kneipe neben dem traditionellen Treffpunkt stattfinden. Letzte CCCeBITs Die Tradition der CeBIT-Treffen des CCC reicht weit zurück. Nachdem wir in den frühen Neunziger Jahren den Nachfolger des Gilb, namentlich die Deutsche Telekom belagert haben, wurde das irgendwann zu langweilig und es wurden beweglichere Ziele gesucht. CCCeBIT 2001: Herr, Siemens - Ihr Filter stinkt! CCCeBIT 2002: Rote Netzwerkkarte gegen Netzzensur CCCeBIT 2003: IBM: No TCPA! CCCeBIT 2004: Vitronic hilf Datenkraken by sam 2005-03-15 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content CCCeBIT 2005: Biometrische Merkmale in Ausweisdokumenten: sinnlos, gefährlich, teuer Materialien Hintergrund Sonstiges Letzte CCCeBITs Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
