full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos am 24. Februar: 10 Reasons to Switch to the Z-Shell Alle benutzen die bash. Warum? Weil sie da ist. Aber es gibt ja Alternativen.. ash, csh, tcsh, ksh.. und vor allem: die Z-Shell. Warum sollte man sich diese Shell installieren und ansehen? Es wird anhand von 10+ sehr subjektiven Gründen gezeigt, warum man die zsh mal ausprobieren sollte. Vielleicht werden diese nicht alle Überzeugen, aber es wird hoffentlich nicht schaden, sie zu kennen. Nach seinem erfolgreichen Vortrag zu VIm und Mutt ist Sven Guckes aus Berlin erneut bei uns zu Gast. Der gesamte Vortrag ist auf Mitmachen ausgelegt. Wer ein Notebook hat, wird alles direkt nachvollziehen und ausprobieren können. Bringt also eure Laptops mit! Beginn ist wie gewohnt um 20 Uhr im Chaoslabor. by mangala 2005-02-08T21:45:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
