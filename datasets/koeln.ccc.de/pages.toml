["https://koeln.ccc.de/c4/satzung.html"]
title = "c4 | Vereinssatzung"
description = "Vereinssatzung des Chaos Computer Clubs Cologne e.V."
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Vereinssatzung Vereinssatzung des Chaos Computer Clubs Cologne e.V. Satzung des Chaos Computer Club Cologne (C4) e.V. vom 06.12.2005 Präambel Die Informationsgesellschaft unserer Tage ist ohne Computer nicht mehr denkbar. Die Einsatzmöglichkeiten der automatisierten Datenverarbeitung und Datenübermittlung bergen Chancen, aber auch Gefahren für den einzelnen und für die Gesellschaft. Informations- und Kommunikationstechnologien verändern das Verhältnis Mensch/Maschine und der Menschen untereinander. Die Entwicklung zur Informationsgesellschaft erfordert ein neues Menschenrecht auf weltweite ungehinderte Kommunikation. Der Chaos Computer Club Cologne - nachstehend auch "Verein" oder "Club" genannt - ist eine galaktische Gemeinschaft von Lebewesen, unabhängig von Alter, Geschlecht und Rasse sowie gesellschaftlicher Stellung, die sich grenzüberschreitend für Informationsfreiheit einsetzt und mit den Auswirkungen von Technologien auf die Gesellschaft sowie das einzelne Lebewesen beschäftigt und das Wissen um diese Entwicklung fördert. § 1 - Name, Sitz, Geschäftsjahr (1) Der Verein führt den Namen "Chaos Computer Club Cologne". Der Verein wird in das Vereinsregister eingetragen und dann um den Zusatz "e.V." ergänzt. Der Verein hat seinen Sitz in Köln. (2) Das Geschäftsjahr ist das Kalenderjahr. Das erste Geschäftsjahr beginnt mit der Eintragung des Vereins in das Vereinsregister und endet am 31.12. diesen Jahres. § 2 - Zweck und Gemeinnützigkeit (1) Der Verein fördert und unterstützt Vorhaben der Forschung, Wissenschaft und Bildung, Erziehung, Kunst und Kultur sowie der Völkerverständigung im Sinne der Präambel oder führt diese durch. Der Vereinszweck soll unter anderem durch folgende Mittel erreicht werden: 1. Regelmäßige öffentliche Treffen und Informationsveranstaltungen, 2. Veranstaltungen und/oder Förderung internationaler Kongresse, Treffen sowie Telefonkonferenzen, 3. Öffentlichkeitsarbeit und Telepublishing in allen Medien, 4. Informationsaustausch mit den in der Datenschutzgesetzgebung vorgesehenen Kontrollorganen, 5. Förderung des schöpferisch-kritischen Umgangs mit Technologie, 6. Hilfestellung und Beratung bei technischen Fragen im Rahmen der gesetzlichen Möglichkeiten für die Mitglieder. (2) Der Verein verfolgt ausschließlich und unmittelbar gemeinnützige Zwecke im Sinne des Abschnitts "Steuerbegünstigte Zwecke" der Abgabenordnung. Er darf keine Gewinne erzielen; er ist selbstlos tätig und verfolgt nicht in erster Linie eigenwirtschaftliche Zwecke. Die Mittel des Vereins werden ausschließlich und unmittelbar zu den satzungsgemäßen Zwecken verwendet. Die Mitglieder erhalten keine Zuwendung aus den Mitteln des Vereins. Niemand darf durch Ausgaben, die dem Zwecke des Vereins fremd sind oder durch unverhältnismäßig hohe Vergütungen begünstigt werden. § 3 - Mitgliedschaft (1) Ordentliche Clubmitglieder können natürliche und juristische Personen, Handelsgesellschaften, nicht rechtsfähige Vereine sowie Anstalten und Körperschaften des öffentlichen Rechts werden. (2) Die Beitrittserklärung erfolgt schriftlich oder fernschriftlich (Telefax) gegenüber dem Vorstand. Über die Annahme der Beitrittserklärung entscheidet der Vorstand. Die Mitgliedschaft beginnt mit der Annahme der Beitrittserklärung. (3) Die Mitgliedschaft endet durch Austrittserklärung, durch Tod von natürlichen Personen oder durch Auflösung und Erlöschen von juristischen Personen, Handelsgesellschaften, nicht rechtsfähigen Vereinen sowie Anstalten und Körperschaften des öffentlichen Rechts oder durch Ausschluß; die Beitragspflicht für das laufende Geschäftsjahr bleibt hiervon unberührt. (4) Der Austritt wird durch schriftliche Willenserklärung gegenüber dem Vorstand vollzogen. (5) Die Mitgliederversammlung kann solche Personen, die sich besondere Verdienste um den Club oder um die von ihm verfolgten satzungsgemäßen Zwecke erworben haben, zu Ehrenmitgliedern ernennen. Ehrenmitglieder haben alle Rechte eines ordentlichen Mitglieds. Sie sind von Beitragsleistungen befreit. (6) Fördermitglieder sind passive Mitglieder ohne Stimmrecht in der Mitgliederversammlung. § 4 - Rechte und Pflichten der Mitglieder (1) Die Mitglieder sind berechtigt, die Leistungen des Vereins in Anspruch zu nehmen. (2) Die Mitglieder sind verpflichtet, die satzungsgemäßen Zwecke des Clubs zu unterstützen und zu fördern. Sie sind verpflichtet, die festgesetzten Beiträge zu zahlen. § 5 - Ausschluß eines Mitglieds (1) Ein Mitglied kann durch Beschluß des Vorstandes ausgeschlossen werden, wenn es das Ansehen des Clubs schädigt, seinen Beitragsverpflichtungen nachhaltig nicht nachkommt oder wenn ein sonstiger wichtiger Grund vorliegt. Der Vorstand muß dem auszuschließenden Mitglied den Beschluß in schriftlicher Form unter Angabe von Gründen mitteilen und ihm auf Verlangen eine Anhörung gewähren. (2) Gegen den Beschluß des Vorstandes ist innerhalb einer Frist von zwei Monaten nach Zugang des Ausschließungsbeschlusses die Anrufung der Mitgliederversammlung zulässig. Bis zum Beschluß der Mitgliederversammlung ruht die Mitgliedschaft. Die Mitgliederversammlung entscheidet über die Ausschließung endgültig. § 6 - Beitrag (1) Der Club erhebt einen Aufnahme- und einen Jahresbeitrag. Das Nähere regelt eine Beitragsordnung, die von der Mitgliederversammlung beschlossen wird. (2) Im begründeten Einzelfall kann für ein Mitglied durch Vorstandsbeschluß ein von der Beitragsordnung abweichender Beitrag festgesetzt werden. § 7 - Organe des Clubs Die Organe des Clubs sind: 1. die Mitgliederversammlung 2. der Vorstand. § 8 - Mitgliederversammlung (1) Oberstes Beschlußorgan ist die Mitgliederversammlung. Ihrer Beschlußfassung unterliegen alle in dieser Satzung oder Gesetz vorgesehenen Gegenstände, insbesondere 1. die Genehmigung des Finanzberichtes, 2. die Entlastung des Vorstandes, 3. die Wahl und die Abberufung der Vorstandsmitglieder, 4. die Bestellung von Finanzprüfern, 5. Satzungsänderungen, 6. die Genehmigung der Beitragsordnung, 7. die Richtlinie über die Erstattung von Reisekosten und Auslagen, 8. Beschlüsse über Anträge des Vorstandes und der Mitglieder, 9. die Ernennung von Ehrenmitgliedern, 10. die Auflösung des Clubs und die Beschlußfassung über die eventuelle Fortsetzung des aufgelösten Clubs. (2) Die ordentliche Mitgliederversammlung findet einmal im Jahr statt. Außerordentliche Mitgliederversammlungen werden auf Beschluß des Vorstandes abgehalten, wenn die Interessen des Clubs dies erfordern, oder wenn mindestens 10% der Mitglieder dies unter Angabe des Zwecks und der Gründe schriftlich beantragen. Die Einberufung der Mitgliederversammlung erfolgt schriftlich oder fernschriftlich durch ein Vorstandsmitglied mit einer Frist von mindestens zwei Wochen. Hierbei sind die Tagesordnung bekanntzugeben und ihr die nötigen Informationen zugänglich zu machen. Anträge zur Tagesordnung sind mindestens drei Tage vor der Mitgliederversammlung beim Vorstand einzureichen. Über die Behandlung von Initiativanträgen entscheidet die Mitgliederversammlung. (3) Beschlüsse über Satzungsänderungen und über die Auflösung des Clubs können nur in einer Mitgliederversammlung beschlossen werden, in der diese Tagesordnungspunkte ausdrücklich angekündigt worden sind. Solche Beschlüsse bedürfen zu ihrer Rechtswirksamkeit der Dreiviertelmehrheit der anwesenden Mitglieder. (4) Vorbehaltlich Absatz 3 bedürfen die Beschlüsse einer Mitgliederversammlung der einfachen Mehrheit der Stimmen der erschienenen Mitglieder. (5) Jedes Mitglied hat eine Stimme. Juristische Personen haben einen Stimmberechtigten schriftlich zu bestellen. (6) Die Mitgliederversammlung wird von dem Vorsitzenden, bei seiner Verhinderung von dem stellvertretenden Vorsitzenden oder einem anderen vom Vorstand hierzu bestellten Vorstandsmitglied geleitet. Der Versammlungsleiter ist Protokollführer. Er kann ein anderes Clubmitglied zum Protokollführer bestimmen. Die Mitgliederversammlung kann einen anderen Versammlungsleiter oder einen anderen Protokollführer bestimmen. (7) Auf Antrag eines Mitglieds ist geheim abzustimmen. Über die Beschlüsse der Mitgliederversammlung ist ein Protokoll anzufertigen, das vom Versammlungsleiter und dem Protokollführer zu unterzeichnen ist; das Protokoll ist allen Mitgliedern zugänglich zu machen. § 9 - Vorstand (1) Der Vorstand besteht aus zwei bis sieben Mitgliedern, und zwar: 1. dem Vorsitzenden, 2. einem oder zwei stellvertretenden Vorsitzenden, 3. bis zu vier weiteren Mitgliedern. (2) Vorstand im Sinne des § 26 Abs. 2 BGB sind alle Vorstandsmitglieder. Je zwei Vorstandsmitglieder vertreten den Club gemeinschaftlich. Die Vorstandsmitglieder sind von der Vorschrift des § 181 BGB befreit. (3) Die Amtsdauer der Vorstandsmitglieder beträgt zwei Jahre; Wiederwahl ist zulässig. Die gewählten Vorstandsmitglieder bleiben bis zu ihrer Amtsniederlegung oder Neuwahl im Amt. (4) Besteht der Vorstand aus weniger als zwei Mitgliedern, so sind unverzüglich Nachwahlen durchzuführen. (5) Beschlüsse des Vorstands werden mit der Mehrheit der Stimmen der an der Beschlußfassung teilnehmenden Vorstandsmitglieder gefaßt. Bei Stimmengleichheit gibt die Stimme des Vorsitzenden, bei seiner Verhinderung des an Lebensjahren ältesten stellvertretenden Vorsitzenden den Ausschlag. Der Vorstand ist Dienstvorgesetzter aller vom Club angestellten Mitarbeiter; er kann diese Ausgabe einem Vorstandsmitglied übertragen. (6) Ein vom Vorstand bestimmtes Vorstandsmitglied überwacht als Schatzmeister die Haushaltsführung und verwaltet unter Beachtung etwaiger Vorstandsbeschlüsse das Vermögen des Clubs. Er hat auf eine sparsame und wirtschaftliche Haushaltsführung hinzuwirken. Mit Ablauf des Geschäftsjahres stellt er unverzüglich die Abrechnung sowie die Vermögensübersicht und sonstige Unterlagen von wirtschaftlichem Belang den Finanzprüfern des Clubs zur Verfügung. (7) Die Vorstandsmitglieder sind grundsätzlich ehrenamtlich tätig; sie haben Anspruch auf Erstattung notwendiger Auslagen im Rahmen einer von der Mitgliederversammlung zu beschließenden Richtlinie über die Erstattung von Reisekosten und Auslagen. (8) Der Vorstand kann einen "Wissenschaftlichen Beirat" einrichten, der für den Club beratend und unterstützend tätig wird; in den Beirat können auch Nicht-Mitglieder berufen werden. § 10 - Finanzprüfer (1) Zur Kontrolle der Haushaltsführung bestellt die Mitgliederversammlung einen oder zwei Finanzprüfer. Nach Durchführung ihrer Prüfung geben sie dem Vorstand Kenntnis von ihrem Prüfungsergebnis und erstatten der Mitgliederversammlung Bericht. (2) Die Finanzprüfer dürfen dem Vorstand nicht angehören. § 11 - Auflösung des Clubs Bei der Auflösung des Clubs oder bei Wegfall seines Zwecks fällt das Clubvermögen an den Chaos Computer Club Hamburg e.V., der diese Mittel ausschließlich für gemeinnützige Zwecke verwenden darf. Sollte dieser Verein bei Auflösung des Clubs nicht oder nicht mehr gemeinnützig sein, fällt das Clubvermögen an eine andere von der Mitgliederversammlung zu bestimmende steuerbegünstigte Körperschaft, die das Vermögen zur Förderung der Völkerverständigung zu verwenden hat. Beschlossen auf der Gründungsversammlung am 31.03.1998 Geändert auf der Mitgliederversammlung vom 29.06.1999 Geändert auf der Mitgliederversammlung vom 06.06.2005 by phrekazoid, cefalon 2002-09-22 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Satzung des Chaos Computer Club Cologne (C4) e.V. vom 06.12.2005 Präambel § 1 - Name, Sitz, Geschäftsjahr § 2 - Zweck und Gemeinnützigkeit § 3 - Mitgliedschaft § 4 - Rechte und Pflichten der Mitglieder § 5 - Ausschluß eines Mitglieds § 6 - Beitrag § 7 - Organe des Clubs § 8 - Mitgliederversammlung § 9 - Vorstand § 10 - Finanzprüfer § 11 - Auflösung des Clubs Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
