title = "c4 | guerilla.net"
description = "Daten durch die Luft: guerilla.net"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum guerilla.net Daten durch die Luft: guerilla.net Hacker-Funknetze guerilla.net ist eine weltweit von Hackern verfolgte Strategie, die Netzinfrastruktur zurück in die eigenen Hände zu nehmen, bzw. einen eigenen Netzinfrastruktur aufzubauen. Dies kann über Wireless Ethernet, DECT, Packet Radio, sonstiger Funk, Laser, eigene Kabel, oder auch über ein dynamisch zusammengeschaltetes Netz mit ISDN-Anschlüssen geschehen. Ein Klassiker in diesem Bereich ist das Funknetz Thüringen, aber auch andere (ex) IN -Domains beschäftigen sich damit. Und auch im Kölner CCC gibt es Bestrebungen, Internet selber zu machen. In Bonn sind die Bemühungen um ein Funknetz schon recht konkret. Im Rahmen des Hackschiffs haben mir uns mit dem Problem beschäftigt, mobile Internetversorgung zu basteln. Seitdem hacken wir daran und eplus ist so freundlich, uns dabei zu unterstützen. by Jo 2002-09-28 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
