title = "c4 | CACert im C4"
description = "Der CCC Cologne unterstützt CACert und bietet Assurance an."
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CACert im C4 Der CCC Cologne unterstützt CACert und bietet Assurance an. Zur sicheren Übertragung von Daten via Webbrowser oder E-Mail sollte schon längst bekannt sein, dass nur Verschlüsselung hilft. Dazu werden SSL-Zertifikate verwendet – für den Benutzer macht sich das dadurch bemerkbar, dass in der URL “https” anstatt “http” und ein geschlossenes Schloss in der Statusleiste angezeigt wird. Insbesondere beim Internet-Banking oder beim Online-Kauf kommt Verschlüsselung in Form von SSL zum Einsatz. Bisher musste ein Zertifikat, was auf das Zertifizieren durch eine übergeordnete Instanz basiert, teuer bei einigen Firmen eingekauft werden. Wollte man SSL-Zertifikate für eigene Webseiten einsetzen, konnte man sich auch ein eigenes Zertifikat erstellen. Im Webbrowser wird dieses jedoch als nicht „vertrauenswürdig“ angezeigt, was manche Benutzer an der Sicherheit zweifeln ließ. CACert hat sich zum Ziel gemacht, eine eigene Zertifizerungsstelle aufzubauen, die auf das Vertrauen der Community basiert. Jeder kann daran teil nehmen und durch das „assuren“ lassen von anderen Teilnehmern in der CACert-Community Punkte sammeln. Nach einer bestimmten Anzahl von Punkten kann man sich ein Zertifikat ausstellen lassen und auch selbst andere Leute assuren. Leider wird bisher immer noch kein Webbrowser mit dem CACert-Root-Zertifikat standardmäßig ausgeliefert, doch der Druck auf die Browserhersteller steigt immer mehr, da inzwischen auch einige Organisationen und Firmen auf CACert gewechselt haben. Durch die Installation des CACert-Root-Zertifikats im eigenen Browser werden heute schon sehr viele Webseiten als vertrauenswürdig im Browser akzeptiert. Die Aufnahme des CACert-Root-Zertifikats in die gängigsten Webbrowser ist derzeit das höchste Ziel von CACert. Der CCC e.V. besitzt seit März 2006 ein CACert-Zertifikat, was die vorherige CCC-eigene Zertifizierungsstelle abgelöst hat. Dieses wird auf Webseiten wie z.B. https://www.ccc.de/ oder https://events.ccc.de/ eingesetzt. Der CCC Cologne besitzt seit Juni 2006 ein CACert-Zertifikat als „Tochterinstanz“ vom CCC, wie man bei einem Klick auf das Schloss bei https://koeln.ccc.de/ herausfinden kann. Im CCC Cologne ist eine hohe Anzahl an CACert-Assurern anzutreffen, die Punkte vergeben können. Wer also an einem CACert-Zertifikat für seine eigene Webseite interessiert ist und noch Punkte dafür benötigt, kann ruhig donnerstags zu unseren Kennenlernen-Treffen mit den nötigen Unterlagen vorbei kommen. Für Organisationen und Firmen können wir den Kontakt mit CACert vermitteln, da hier einige weitere Anforderungen (Handels-/Vereinsregisterunterlagen usw.) notwendig sind. by Pylon 2007-01-10T23:10+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
author = "Pylon"
year_published = 2007
clearnet = "https://koeln.ccc.de/updates/2007-01-10_CACert.html"
