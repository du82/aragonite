full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos am 31. März: OpenWrt Vortrag und Workshop Linux auf Hardwareroutern ? OpenWrt ist eine Linux Distribution für Linksys Router, bestehend aus einer kleinen Firmware und Softwarepaketen. Mit OpenWrt lässt sich so mancher kleiner Router in einen echten Linux Server verwandeln. Der Vortrag behandelt die experimentelle Version von OpenWrt, der Vortragende ist im Rahmen seiner Diplomarbeit mit dem Thema befasst und seit einiger Zeit auch als Entwickler im OpenWRT-Projekt involviert. Inhalte: * Welche Vorteile und Nachteile hat OpenWrt im Gegensatz zu der Original Firmware oder anderen alternativen Firmwaredistributionen? * Welche Hardware wird unterstützt und empfohlen? * Wie kann ich am Projekt mitarbeiten? Falls Besucher kompatible Geräte mitbringen, kann anschliessend in einem Workshop OpenWrt auf die Router installiert werden. Beginn ist wie gewohnt um 20 Uhr im Chaoslabor. by mm 2005-03-25T21:45:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
