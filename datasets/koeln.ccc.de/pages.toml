full_description = 'Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Meldungen Open Chaos am 30: Januar. PsyLink: Controlling computers with nerve signals 2025-01-22 At the next OpenChaos Yuni will talk about PsyLink: An open source hardware project that measures nerve/muscle impulses on the skin and uses those to control computers. more 38C3 - Congress Everywhere 2024-12-25 Vom 27.12. bis zum 30.12. findet dieses Jahr der 38. Chaos Communication Congress (38C3) in Hamburg statt. more Kameras Stoppen vor Gericht: Kölner Polizei muss sich für Videoüberwachung des Kölner Stadtgebiets rechtfertigen 2024-11-26 Am 28. November wird am Verwaltungsgericht Köln über die polizeiliche Videoüberwachung verhandelt. Wir laden euch ein der Verhandlung beizuwohnen! more OpenChaos am Donnerstag, 28. November: Strahlungsforschung für zukünftige Mondmissionen im Rahmen des Artemis Programms 2024-11-19 Ionisierende kosmische Strahlung ist eine der großen Gefahren für Astronauten im Weltall. Wie kann diese nicht spürbare Gefahr gemessen und sichtbar gemacht werden? more BigBrotherAwards Public Viewing 2024-10-10 Wasserdichte Recherche, pointierte Reden und Musik als Rahmen: Digitalcourage e.V. verleiht die BigBrotherAwards an die schlimmsten Datenschutz-Saboteur*innen des Jahres. Wir streamen live aus Bielefeld. more Sonoj Convention 2024 - Dein Event für Musik und Open Source 2024-09-17 Die Sonoj Convention 2024 steigt am 19. und 20. Oktober im Chaos Computer Club Cologne, Heliosstr. 6a 50825 Köln, Deutschland. Registriere dich auf https://sonoj.org/2024/. more OpenChaos am Donnerstag, 05. September: Retrogaming mit Laserpointern 2024-09-01 Crowdgaming mit Laserpointern more OpenChaos am Donnerstag, 25. Juli: Digitalisierung des Gesundheitswesens 2024-07-16 Digitalisierung des Gesundheitswesens – vom E-Rezept zur ePA für alle more OpenChaos am Donnerstag, 27. Juni: Künstliche Intelligenz 2024-06-17 Künstliche Intelligenz – Von den Anfängen bis heute und ein Ausblick in die Zukunft. Am 27.06.2024 möchten wir euch zu einem faszinierenden Vortrag über die Welt der Künstlichen Intelligenz (KI) einladen. more ABCCCC: Plattformen und ihre Logiken 2024-05-30 Immer tiefer dringen Plattformen in sämtliche Lebensbereiche ein, um diese nach ihren eigenen Logiken neu zu organisieren. Aber wer profitiert hier eigentlich von wem? more ABCCCC: Freiheit der Informationen und Copyright im Zeitalter der perfekten Kopie 2024-04-24 Mit den digitalen Technologien hat sich das Verhältnis von Original und Kopie massiv gewandelt. Ist die Art und Weise, wie wir als Gesellschaft mit Kopien umgehen noch angemessen? more Tag des offen Hackspace im C4 2024-02-27 Der Chaos Computer Club öffnet am Samstag, dem 02. März 2024, in Hackspaces in vielen Ländern rund um den Erdball seine Türen und hofft auf zahlreichen Besuch. Auch der Chaos Computer Club Cologne e.V. nimmt an dieser Aktion teil. more ABCCCC: Im Spiegel des künstlichen Wir - Reflektionen über KI 2024-02-24 Da künstliche Intelligenz momentan als heilige Kuh durchs Dorft getrieben wird, gibt es scheinbar keinen Bereich, der durch ihren Einsatz nicht noch besser und effizienter gemacht werden soll. more Warum nicht auch mal Demos coden? 2023-11-29 Lust auf ein kreatives Abenteuer in der Welt der Programmierung? Wir laden euch herzlich zu unserem Workshop “Warum nicht auch mal Demos coden?” ein. more OpenChaos am Donnerstag, 30. November: Technologie trifft Kreativität: Demoszene-Jahresüberblick 2023-11-27 Wenn Technologie auf Kreativität trifft: Freut euch auf einen farbenfrohen und inspirierenden Abend beim Openchaos. more OpenChaos am Donnerstag, 26. Oktober: Lightning Talks 2023-10-20 Kommt zum OpenChaos und stellt euer Thema als Lightning Talk (5-15 Minuten) vor! more OpenChaos am Donnerstag, 12. Oktober: … und was macht eigentlich die EU? 2023-10-03 Die Europäische Union (EU) zeigt ein wachsendes Interesse und Engagement für die Gesetzgebung im Bereich des digitalen Lebens. In den letzten Jahren hat die EU verstärkt Maßnahmen ergriffen, um die digitalen Herausforderungen der heutigen Zeit anzugehen und den Schutz der Bürger:innen und ihrer Daten zu gewährleisten. Dieses OpenChaos beschäftigt sich tiefer mit den gerade aktuellen Themen Chatkontrolle, European Health Data Space, dem AI Act sowie noch ein paar gemischten Themen aus dem Bereich der Netzpolitik. Der Vortragende snoopy ist regelmäßig in Brüssel unterwegs um die Ereignisse aus der Nähe zu beobachten. more Sonoj Convention 2023 - Dein Event für Musik und Open Source 2023-09-21 Die Sonoj Convention 2023 steigt am 7. und 8. Oktober im Chaos Computer Club Cologne, Heliosstr. 6a 50825 Köln, Deutschland. Registriere dich auf https://sonoj.org. more CryptoParty im Haus der Geschichte 2023-05-16 Wir veranstalten, im Rahmen der Reihe #DeutschlandDigital, am 21.05.2023 eine CryptoParty im Haus der Geschichte in Bonn. more BigBrotherAwards Public Viewing 2023-04-23 Wasserdichte Recherche, pointierte Reden und Musik als Rahmen: Digitalcourage e.V. verleiht die BigBrotherAwards an die schlimmsten Datenschutz-Saboteur*innen des Jahres. Wir streamen live aus Bielefeld. more International Day Of Open Hackerspaces 2023-03-11 Der Chaos Computer Club öffnet am 25. März 2023 in über 60 Hackspaces in vielen Ländern rund um den Erdball seine Türen und hofft auf zahlreichen Besuch. Auch der Chaos Computer Club Cologne e.V. nimmt an dieser Aktion teil. more C4 Mitglied in Bayern festgenommen 2022-11-17 Wegen der Beteiligung an friedlichen Klimaprotesten wird ein C4-Mitglied ohne Anklage derzeit im Gefängnis in Bayern festgehalten. more OpenChaos am Donnerstag, 27. Oktober: OpenData in der Verwaltung 2022-10-25 Das Kompetenzzentrum OpenData aus dem Bundesverwaltungsamt berichtet über die Lage von OpenData bei den Behörden des Bundes. more Tag des offen Hackspace im C4 2022-08-23 Der Chaos Computer Club öffnet am 27. August 2022 in über 50 Hackspaces in vielen Ländern rund um den Erdball seine Türen un