["https://koeln.ccc.de/ablage/cctv/geschichte2.html"]
title = "c4 | cctv - Geschichte der Kameraüberwachung"
description = """
Geschichte der Kameraüberwachung in Europa sowie deren psychologische 
  Auswirkung bei Bewußtwerdung der Beobachtung"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum cctv - Geschichte der Kameraüberwachung Geschichte der Kameraüberwachung in Europa sowie deren psychologische Auswirkung bei Bewußtwerdung der Beobachtung Geschichte der Kameraüberwachung in Deutschland (Quellen: Legler, Thomas,: Das Recht am eigenen Bild auf der Datenautobahn, in: CR 7/1998; Weichert, Thilo: öffentliche Audio- und Videoüberwachung, in : Datenschutz Nachrichten 1/1999) - 1958 wurde in München eine Verkehrszentrale eingerichtet, an die von stationären Fernsehkameras über 17 Verkehrsschwerpunkte bewegte Bilder übertragen wurden (es folgten weitere Verkehrsüberwachungskameras in München und Hannover) - Hannover war 1976 die erste deutsche Stadt, in der mit 25 ferngesteuerten schwenkbaren Zoom-Kameras der Dauereinsatz der Videotechnik praktiziert wurde (Vorbild London, wo 1974 zur überwachung der großen Verkehrsadern 145 Kameras aufgebaut worden sind). Von da an nicht nur Verkehrsüberwachung: Von Anfang an Konzentration auch auf "Rand- und Problemgruppen" (Mönckebergstraße in Hamburg, Kröpcke in Hannover, Marienplatz München) - Schnelle Entwicklung der Technik sorgte bereits in den 70er Jahren für flächendeckende Kontrolle von Bahnsteigen, Rolltreppen, Tunneln, Kreuzungen, Warenhäusern... - Die seit 1976 bundeseinheitlich ausgebildeten polizeilichen Beweissicherungs- und Dokumentations-Trupps überwachten Demos mit kleinen handlichen Videokameras, mit deren Zoom-Technik gestochene Portraitaufnahmen gefertigt werden konnten. - "Aktion Paddy" von BKA, BND und Bundesamt für Verfassungsschutz zur Absicherung vor Anschlägen in einem Umkreis von 30 km von Heidelberg um das amerikanische NATO-Hauptquartier. Es erfolgte eine Installation von versteckten Hochleistungskameras im öffentlichen Raum. Abbruch nach 6 Monaten ohne erhofften Ermittlungserfolg. Kurz darauf wurde knapp außerhalb des Überwachungsbereiches auf den zuvor mitgeschützten Vier-Sterne-General Kroesen von der RAF ein Anschlag verübt. - Anfang der 80er Jahre automatische Grenzkontrolle am eisernen Vorhang, nach Mauerfall Verlagerung an deutsche Ostgrenze. - 1996 Pilotprojekt in Leipzig zur "Videoüberwachung von Kriminalitätsschwerpunkten", gegen Kfz-Aufbrüche, Taschendiebstähle und Drogenhandel. Vergleichbare Aktivitäten auch an anderen Orten. - Die Polizei ist schon lang nicht mehr die Institution, die diese Technik am umfassendsten einsetzt. Erfassung inzwischen hauptsächlich durch Kommunen. Öffentliche Einrichtungen bis hin zu Hochschulen sehen in dieser Technik eine Möglichkeit, sich selbst ein Stückchen "Sicherheit" (TM) zu schaffen. - In Großbritannien ist in jeder zweiten Kommunalverwaltung eine öffentlich-rechtliche überwachung installiert (CCTV>>Closed Circuit Television). Allein für 1997 und 1998 waren der Aufbau von 20.000 Polizeikameras geplant. Verkaufte Sicherheitskameras: bisher 300.000 (hohe Akzeptanz auch durch Angst vor IRA-Anschlägen erklärbar). - Persönlichkeitsverletzungen können nur aufgrund einer Ehrenverletzungsklage, einer Verletzung des vertraglichen Vertrauensprinzips (breach of confidence) oder des Rechts auf Schutz vor Belästigung und Beängstigung (trespass und nuisnace) verfolgt werden. Abgesehen davon besteht kein Schutz vor Persönlichkeitsverletzungen. - Nicht nur Polizei, auch Privatpersonen überwachen gerne. Im städtischen Raum kann fast von einer flächendeckenden Überwachung gesprochen werden (wegen Privatnützigkeit aber nicht wirklich flächendeckend, systematisch und strategisch). - Schnittstelle zwischen privatem und öffentlichen Bereich bei privaten Sicherheitsunternehmen, die ihr "Beweismaterial" den Sicherheitsbehörden weitergeben. - typische hoheitliche Audio- und Videoüberwachung des Staates wird im Allgemeinen nicht aus den Händen gegeben (auch dieser Bereich ist dem Outsourcing aber zugänglich, wie z.B. in den 3-S-Zentralen der DB>>>Bundesgrenzschutz). Psychologische Auswirkungen bei Bewußtwerdung der Beobachtung: Möglicher Abschreckungseffekt durch Kameraüberwachung, dieser Effekt läßt aber mit der Zeit wieder nach. Sicherheitspolitische Bilanz ist nicht berauschend... Im Beobachtungsraum kommt es zwar zu weniger Delikten (Erfolgsquoten von über 75% Kriminalitätsrückgang). Psychologischer Erfolg nur, wenn auch auf Überwachung hingewiesen wird. Erreicht wird aber keine Verringerung der Delikte, sondern eine Verdrängung und Verlagerung: Werden bestimmte Gebiete sicherer, werden andere dadurch unsicherer. Straftataufklärende Wirkung oft begrenzt: Gezielt vorgehende Täter berücksichtigen mögliche Überwachung (Maskierung, Zerstörung der Geräte). Vor allem kleinere Verstöße, wie asoziales Verhalten etc. werden erfaßt. Sanktionierung schon geringer Ordnungsverstöße fördert zudem die Entwurzelung der Betroffenen und von deren Umfeld. In GB wurde festgestellt, daß die elektronische Überwachung die soziale Verantwortung der Menschen sinken läßt (Erwartung professioneller Intervention, statt selber zu agieren). Angst, bei unsachgemäßer Hilfe zur Rechenschaft gezogen zu werden, da man ja dabei gefilmt wurde. Verdrängung von sozial ausgegrenzten Minderheiten (Punks, Bettler...). Den "rechtschaffenen " BürgerInnen wird eine saubere Stadt geboten, in der sie sich subjektiv sicher fühlen (muß gar nichts mit objektiven Befund zu tun haben...). Ausblick Rasante technische Entwicklung: Mit Sprachdatenbanken können massenhaft Abgleiche gefahren werden. Es ist nur eine Frage der Speicher- und Rechnerkapazität, daß auch bezüglich Gesichtserkennung etc. Abgleiche möglich sind (Fa. NeuroMetric in Florida hat System entwickelt, daß aus einer Menschenmasse pro Sekunde 20 Gesichter herausfiltern kann, diese lassen sich innerhalb von Sekunden mit einer Datenbank mit 50 Millionen Datensätzen abgleichen). Systeme, die in der Lage sind, aufgezeichnete Personen (Demo; Bahnsteig) zu zählen, sind heute schon technischer Standard. Man kann Systeme so programmieren, daß "gekennzeichnete" Personen über mehrere Kameras hinweg verfolgt werden. An der Uni Leeds wird derzeit ein System entwickelt, das von einer Videokamera aufgezeichnetes "normales" Verhalten von "verdächtigen "Verhalten unterscheiden soll. Idee ist, daß ein Dieb mit der Absicht zu stehlen ein Geschäft auf ungewöhnliche - elektronisch detektierbare - Weise betritt (Finanzierung mit 300.000 Pfund) In einer Untersuchung der Uni Hull kam der Soziologe und Kriminologe Clive Norris zu dem Ergebnis, daß die vorhandenen automatischen Erkennungstechniken die britische Regierung in die Lage versetzen könnte, jeden einzelnen Menschen zu kontrollieren (neue Dimension auch durch Einspeisung der Bilder ins Internet) by jadis 2002-10-06 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Geschichte der Kameraüberwachung in Deutschland Psychologische Auswirkungen bei Bewußtwerdung der Beobachtung: Ausblick Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
