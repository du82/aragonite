["https://koeln.ccc.de/updates/2006-07-27_openchaos_juli.html"]
title = "c4 | OpenChaos Juli: Nintendo DS"
description = """
Den europäischen Verkaufsstart des Nintendo DS Lite nehmen wir zum Anlass, das DS mal ein wenig genauer zu betrachten. Wir geben einen Überblick überdie Hardware, Linux auf dem DS, gehackte Firmware, Homebrew Software undWLAN-Scanner, alte und aktuelle Spiele, sowie Emulatoren."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos Juli: Nintendo DS Den europäischen Verkaufsstart des Nintendo DS Lite nehmen wir zum Anlass, das DS mal ein wenig genauer zu betrachten. Wir geben einen Überblick über die Hardware, Linux auf dem DS, gehackte Firmware, Homebrew Software und WLAN-Scanner, alte und aktuelle Spiele, sowie Emulatoren. Mit dem Nintendo Ds hat es "Big N" wieder geschafft, eine Konsole auf den Markt zu bringen, die alle Rekorde bricht. Nintendos Mission, auch die Personengruppen anzusprechen, die bisher eher nicht zu einer portablen Spielkonsole greifen würden, scheint aufzugehen. Wir wollen uns in diesem OpenChaos mit dem HackValue des DS beschäftigen und einige Aspekte der DS-Homebrew-Szene genauer beleuchten. Anschließend gibt es Gelegenheit, die aktuelle FlashMe Firmware auf mitgebrachte DS zu übertragen. Der Vortrag findet am 27. Juli statt und beginnt um 20:00 Uhr in den Räumlichkeiten des C4. by mm 2006-07-26T17:23+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
