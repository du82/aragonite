["https://koeln.ccc.de/ablage/cctv/dsgnrw2.html"]
title = "c4 | cctv - Juristische Grundlagen"
description = "Gesetzliches zum Thema Kameraüberwachung"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum cctv - Juristische Grundlagen Gesetzliches zum Thema Kameraüberwachung Kameraüberwachung - rechtliche Grundlagen Urteil des Bundesverfassungsgerichtes zur Zeit der Volkszählung "Wer unsicher ist, ob abweichende Verhaltensweisen jederzeit notiert und Informationen dauerhaft gespeichert, verwendet und weitergegeben werden, wird versuchen, nicht durch solche Verhaltensweisen aufzufallen. Wer damit rechnet, daß etwa die Teilnahme an einer Versammlung der Bürgerinitiative behördlich registriert wird und daß ihm dadurch Risiken entstehen können, wird möglicherweise auf eine Ausübung seiner entsprechenden Grundrechte (Art. 8,9 GG) verzichten. Dies würde nicht nur die individuellen Entfaltungschancen des einzelnen beeinträchtigen, sondern auch das Gemeinwohl." (BVerFG, NJW 1984, 422) Gesetz betreffend das Urheberrecht an Werken der bildenden Künste und der Photographie Es gilt das Kunsturhebergesetz (KUG) aus dem Jahr 1907 (siehe auch: http://www.lrz-muenchen.de/~rgerling/gesetze/kunsturg.htm) §§ 22-24 und 33 stellen das Verbreiten und Zurschaustellen von Bildnissen ohne Einwilligung des Abgebildeten unter Strafe. Bei Bildern aus dem Bereich der Zeitgeschichte, als Beiwerk, von Versammlungen und Aufzügen, im Interesse der Kunst § 23 KUG) oder der öffentlichen Sicherheit (§ 24 KUG)ist keine Einwilligung nötig. Das derzeitige Datenschutzrecht ist unmodern und überholt. Bild- und Tonträger werden von fast allen allgemeinen Datenschutzgesetzen noch als Akten behandelt (z.B. § 3 Abs. 3 S. 1 BDSG), es wird so getan, als ob es keine Möglichkeit der systematischen Auswertung gäbe (Eine Novellierung des Datenschutzrechts ist in Arbeit). Im privaten Bereich greift das Datenschutzrecht im Bezug auf Kameraüberwachung nicht. Hier kann der Einsatz von Videokameras mit dem Hausrecht begründet werden. Im öffentlichen Raum stellt die Überwachung einen Eingriff in das Recht auf informationelle Selbstbestimmung dar, der einer besonderen ges. Rechtfertigung bedarf. Auszug aus der Novellierung des nordrhein-westfälischen Datenschutzgesetzes: Optisch-elektronische Überwachung Gesetzentwurf im Landtag eingebracht, Stand der Info 12/99 (1) Die nicht mit einer Speicherung verbundene Beobachtung öffentlich zugänglicher Bereiche mit optisch-elektronischen Einrichtungen ist zulässig, soweit diese zur Aufgabenerfüllung oder zur Wahrnehmung des Hausrechts dient und keine Anhaltspunkte dafür bestehen, daß schutzwürdige Interessen betroffener Personen überwiegen. Die Tatsache der Beobachtung ist, soweit nicht offenkundig, den Betroffenen durch geeignete Maßnahmen erkennbar zu machen. (2) Die Speicherung von nach Absatz 1 Satz 1 erhobenen Daten ist zulässig, wenn dies zum Erreichen der verfolgten Zwecke unverzichtbar ist. Die Daten sind unverzüglich zu löschen, wenn sie hierzu nicht mehr erforderlich sind; dies ist in angemessenen Zeitabständen zu prüfen. (3) Werden die gespeicherten Daten einer bestimmten Person zugeordnet und verarbeitet, so ist diese jeweils davon zu benachrichtigen. Von der Benachrichtigung kann in den Fällen abgesehen werden, in denen öffentliche Interessen der Strafrechtspflege oder der Gefahrenabwehr gegenüber dem Benachrichtigungsrecht der betroffenen Person erheblich überwiegen. Was daraus geworden ist: Gesetz zum Schutz personenbezogener Daten Vollständiger Name ist: Gesetz zum Schutz personenbezogener Daten (Datenschutzgesetz Nordrhein-Westfalen - DSG NRW) in der Fassung der Bekanntmachung vom 9. Juni 2000: Gesetz zum Schutz personenbezogener Daten (Datenschutzgesetz Nordrhein-Westfalen - DSG NRW ), Dritter Teil, Besonderer Datenschutz, § 29 b: Optisch-elektronische Überwachung (1) Die nicht mit einer Speicherung verbundene Beobachtung öffentlich zugänglicher Bereiche mit optisch-elektronischen Einrichtungen ist zulässig, soweit dies der Wahrnehmung des Hausrechts dient und keine Anhaltspunkte dafür bestehen, dass schutzwürdige Interessen betroffener Personen überwiegen. Die Tatsache der Beobachtung ist, soweit nicht offenkundig, den Betroffenen durch geeignete Maßnahmen erkennbar zu machen. (2) Die Speicherung von nach Absatz 1 Satz 1 erhobenen Daten ist nur bei einer konkreten Gefahr zu Beweiszwecken zulässig, wenn dies zum Erreichen der verfolgten Zwecke unverzichtbar ist. Die Daten sind unverzüglich zu löschen, wenn sie hierzu nicht mehr erforderlich sind; dies ist in angemessenen Zeitabständen zu prüfen. (3) Werden die gespeicherten Daten einer bestimmten Person zugeordnet und verarbeitet, so ist diese jeweils davon zu benachrichtigen. Von einer Benachrichtigung kann abgesehen werden, solange das öffentliche Interesse an einer Strafverfolgung das Benachrichtigungsrecht der betroffenen Person erheblich überwiegt. by jadis 2002-10-06 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kameraüberwachung - rechtliche Grundlagen Urteil des Bundesverfassungsgerichtes zur Zeit der Volkszählung Gesetz betreffend das Urheberrecht an Werken der bildenden Künste und der Photographie Auszug aus der Novellierung des nordrhein-westfälischen Datenschutzgesetzes: Optisch-elektronische Überwachung Gesetz zum Schutz personenbezogener Daten Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
