["https://koeln.ccc.de/updates/2006-11-08_wcp_erfolg.html"]
title = "c4 | Erste Erfolge: weiter so!"
description = """
Ernennung von Brandenburgs Verkehrsminister Frank Szymanski zum Cottbuser
\tOB wegen Wahleinspruch duch Thomas Langen verschoben: 
\tManipulationsmöglichkeiten an den Wahlcomputer müssen zuerst geklärt werden."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Erste Erfolge: weiter so! Ernennung von Brandenburgs Verkehrsminister Frank Szymanski zum Cottbuser OB wegen Wahleinspruch duch Thomas Langen verschoben: Manipulationsmöglichkeiten an den Wahlcomputer müssen zuerst geklärt werden. Aus der Lausitzer Rundschau von heute: *Ernennung Szymanskis zum Cottbuser OB verschoben* Die Ernennung von Brandenburgs Verkehrsminister Frank Szymanski (SPD) zum Cottbuser Oberbürgermeister soll um acht Tage auf den 29. November verschoben werden. Die für den 21. November geplante Sondersitzung der Stadtverordneten entfalle, weil noch ein Wahlwiderspruch geklärt werden müsse, sagte Stadtsprecher Peter Lewandrowski. Grund des Einspruchs: Der Chaos Computer Clubs (CCC) behauptet, es hätte Manipulationsmöglichkeiten an den Wahlcomputern gegeben. (jas/dpa) Des weiteren gab es Probleme mit dem Server der die öffentliche Petition gegen Wahlmaschinen beherbergt. Eine neue Petition ist zu finden, die vorhandenen Unterschriften werden mit den neuen bei Petitionsende zusammengefügt. Fortführung der Petition Mehr zu dem Serverproblem: www.ccc.de/updates/2006/petitions-probleme by max 2006-11-08T13:45+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
