full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum projekt u23 (2003) projekt u23 (2003) " du bist der meinung, dass alle infomationen frei sein müssen. du bist überzeugt, dass der zugang zu computern und allem, das einem zeigen kann, wie diese welt funktioniert, frei und unbegrenzt sein soll. du bist höchstens 23 jahre alt. du suchst kontakt zu hackern. du lässt dir lösungen nicht vorsetzen, sondern gehst deinen eigenen weg. du möchtest mit engagierten jungen menschen eine komplexe aufgabe im team lösen. " u23 project u23 ist ein projekt für junge hacker bis 23 jahre. eine vorgegebene aufgabenstellung ist innerhalb von sechs wochen im team zu lösen. die 19 teilnehmer teilten sich zu projektbeginn in vier gruppen auf. dabei realisierten 2 gruppen die lösung der aufgabenstellung in C, die beiden anderen gruppen in perl. challenge bei der projektaufgabe 2003 ist das ICMP-protokoll zu verwenden, um damit einen chat zu realisieren. /home dokumentationsseiten der projektgruppen findet man nach und nach hier: projektgruppe foo projektgruppe TCCU projektgruppe IC5MP projektgruppe NETPLAY /usr/bin/date fünf donnerstagabende von 18.30 bis 22 uhr sowie ein externes hackwochenende. das projekt fand vom 6. März bis zum 10. April statt, inklusive eines projektwochenendes vom 21.-23. März auf schloß heiligenhoven. die projektabende wurden in unserem chaoslabor in der vogelsanger strasse 286 in köln-ehrenfeld abgehalten. /root veranstalter von u23 ist der Chaos Computer Club Cologne presse kontaktaufnahme über cefalon (at) koeln.ccc.de by cefalon 2004-01-08 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content u23 project challenge /home /usr/bin/date /root presse Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
