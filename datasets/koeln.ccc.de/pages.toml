["https://koeln.ccc.de/ablage/datenschleuder/radio.html"]
title = "c4 | camp 1999 - das radio HOWTO"
description = """
Was braucht man, um mehr als tausend Hackern mitzuteilen, dass
die Wartezeit für eine warme Dusche ca. 15 Minuten beträgt,
der Morgenkaffee am großen Zelt bereitstellt und jemand eine
mutmaßlich mit Fußpilz befallene Sandale vermisst? - Ganz klar: 
einen UKW-Radiosender."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum camp 1999 - das radio HOWTO Was braucht man, um mehr als tausend Hackern mitzuteilen, dass die Wartezeit für eine warme Dusche ca. 15 Minuten beträgt, der Morgenkaffee am großen Zelt bereitstellt und jemand eine mutmaßlich mit Fußpilz befallene Sandale vermisst? - Ganz klar: einen UKW-Radiosender. " Was braucht man, um mehr als tausend Hackern mitzuteilen, dass die Wartezeit für eine warme Dusche ca. 15 Minuten beträgt, der Morgenkaffee am großen Zelt bereitstellt und jemand eine mutmaßlich mit Fußpilz befallene Sandale vermisst? - Ganz klar: einen UKW-Radiosender." Radio Intergalaktik - Eine Art HOWTO Interessanterweise waren viele Camp-Besucher der Ansicht, bei unserer mit zehn Watt ausgestatteter, auf der Frequenz 93,9 MHz sendender Station "Radio Intergalaktik" handelte es sich um einen Piratensender. Dem war nicht so, denn so einen Sender im Rahmen der derzeit gültigen Gesetze zu organisieren ist einfacher, als man sich das gemeinhin so vorstellt. Naja, ein bisschen Glück braucht man dann auch. Wenn ihr euch ebenfalls als Medienunternehmen betätigen wollt, richtet euch einfach nach dem folgendem erprobten Rezept. 1. Die Initialzündung (aka Schnapsidee) In unserem Fall enstand die Idee im Frühjahr 1999 teilweise in den Kölner CCC-Clubräumen und reifte dann auf einer längeren Straßenbahnfahrt nach Hause heran. Hierbei ist es wichtig, dass man mit der notwendigen Portion Größenwahn und Selbstüberschätzung an das Projekt herangeht, d.h. ruhig schon mal eine ausgeklügelte Programmstruktur planen, auch wenn ihr noch keinen blassen Schimmer habt, wie das ganze zu finanzieren ist. Behaltet in diesem Zusammenhang auch die goldene Regel zur Software-Entwicklung aus F. Brooks' "The Mythical Man-Month" im Hinterkopf: "Plan to throw one away; you will, anyhow". Sie gilt für ein Radio-Projekt entsprechend. 2. Das erste Telefonat Erster Ansprechpartner in Sachen "Veranstaltungsfunk" (so heißt das offiziell) ist die Landesrundfunkmedienanstalt des entsprechenden Bundeslandes. Nach etlichen Telefonaten sollte halbwegs klar sein, an wen ihr einen Antrag stellen könnt und wie dieser auszusehen hat. 3. Der Antrag So ein Antrag variiert von Bundesland zu Bundesland. Auf jeden Fall sollte er von eurer Seite Informationen zu folgenden Fragen beinhalten: Wann? Wo? Wie lange? Was für ein Programm wird gesendet? Wie weit soll das Programm empfangbar sein? Oft ist ein eineinhalb Seiten langes Fax völlig ausreichend. Ihr erhaltet dann nach einiger Zeit eine Sendegenehmigung. Diese Genehmigung ist leider noch keine Frequenzzuteilung, sondern besagt nur, daß ihr berechtigt seid, dieses Projekt durchzuführen. 4. Die Frequenzsuche Nahezu unmöglich, deshalb vergesst es besser, hier einen Antrag zu stellen. Um eine Frequenz zu koordinieren, braucht ihr l. mehr als ein Jahr 2. viele Leute, die den ganzen Tag Briefe und Anträge schreiben und 3. viel Geld. Eine Frequenz zu koordinieren ist ein unglaublich lange dauernder Prozess, denn auch die Behörden der angrenzenden Nachbarstaaten müssen für jede neue Frequenz "Daumen rauf" signalisieren (für unseren Sender, der nur noch ca. 2 km um das Campgelände in Altlandsberg zu empfangen war, musste die benutzte Frequenz durch die polnische Regierung abgesegnet werden). Wenn ihr also weder viel Zeit, Mitarbeiter noch Geld habt, müsst ihr euch an den einzigen Anbieter in Deutschland wenden, der fix und fertig koordinierte Frequenzen im Programm hat: das Rundfunkkundenmanagement der Deutschen Telekom (theoretisch ist auch dieser Markt von der RegTP freigegeben worden, praktisch ist die T Monopolist). Fragt sie nach einem hübschen Angebot. Sie werden euch eins machen, das müsst ihr dann nehmen. Ihr habt mit Kosten zu rechnen, die so um die 3000 DM liegen können (hängt von Dauer und Aufwand ab). Dafür ist in dem Angebot dann auch bereits Anfahrt und Aufbau des Senders und technische Betreuung drin. Diese Betreuung wurde in unserem Fall von dem netten Herrn Erdmann wahrgenommen, der sich auf dem Camp sichtlich wohlfühlte und interessante Details zur Assembler-Programmierung von DDR-Homecomputem der KC-20-Reihe zum besten geben konnte. Auch zwischenzeitlich ausgewählte Special-Interest-Musikbeiträge ("Kampflieder der Arbeiterklasse") fanden seine wohlwollende Zustimmung. 5. GEMA Da ihr natürlich auch Musik spielen wollt, solltet ihr wegen der Legalität und so die GEMA kontaktieren. Da könnte es unter Umständen Schwierigkeiten geben. Für den privaten Rundfunk ist eine obskure GEMA-Zweigstelle in München zuständig, der dort verantwortliche Sachbearbeiter ist nach unseren Recherchen meistens im Urlaub. Die zu zahlende GEMA-Gebühr richtet sich nach dem Musikanteil des Programms, der Zahl der Einwohner im Empfangsgebiet pro Monat und den Werbeeinnahmen. Da wir nur ein paar Tage sendeten und zudem keine Werbung hatten, betrug unser GEMA-Beitrag, nachdem unsere Angaben mit bizarren Formeln behandelt wurden, ganze 1,60 DM. So einen Beitrag zahlt man natürlich gerne. Auch noch nett: "wegen Geringfügigkeit" mussten wir keine GEMA-Listen mit den gespielten Stücken erstellen. 6. Sendetechnik Der am wenigsten aufregendste Teil des ganzen Projekts war erstaunlicherweise die Technik. Wie ein Mitarbeiter des Radioteams nicht müde wurde zu betonen, ist die Technik für einen UKW-Schwarzsender dermaßen simpel, dass sie in der heimischen Garage zusammengestellt werden kann und "im Prinzip in einer Keksdose Platz hat". Bei der richtig legalen Version, die wir hatten, ist das Interface sogar noch kindgerechter gestaltet: Aus dem Sendewagen kamen zwei Kabel, beschriftet mit "Audio links" und "Audio rechts". Diese sind mit den üblichen Haushaltgeräten anzusteuern: einfach Mischpulte, CD-Player, sogenannte "multimediafähige PCs" als MP3-Abspielstationen, Cassetten-Spieler, Vinyl-Plattenspieler und Mikrophone in der richtigen Reihenfolge anschliessen und fertig. 7. Letzte Worte So geht das also mit dem eigenen UKW-Sender. Nur ein paar Wochen Zeit investieren und alles wird gut. Wir hatten ziemlich viel Spaß mit unserem Radiosender. Nach der ersten Euphorie ("Wir haben tatsächlich 24 Stunden am Tag Programm gemacht! Unglaublich!") stellte sich für uns allerdings das erste Problem ein: Wie ist das Projekt "Radio Intergalaktik" auf dem nächsten Camp noch zu toppen? Erste Ideen wie ein eigener Fernsehsender oder der Start eines geostationären Chaos-Satelliten wurden allerdings vorerst unter "eher mittelfristig zu realisierende Projekte" abgelegt. Mal sehen. by Jens Ohlig, Ingo 23.11.1999 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Radio Intergalaktik - Eine Art HOWTO 1. Die Initialzündung (aka Schnapsidee) 2. Das erste Telefonat 3. Der Antrag 4. Die Frequenzsuche 5. GEMA 6. Sendetechnik 7. Letzte Worte Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
author = "Jens Ohlig, Ingo"
year_published = 1999
