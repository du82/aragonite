["https://koeln.ccc.de/ablage/curriculum/nachlese3.html"]
title = "c4 | Nachlese Curriculum: MPEG3"
description = '''
Eine Nachlese des ersten Chaos Curriculum Cologne mit dem Thema"'Internet killed the video star' -- Warum digitale Töne wie MPEG3 die Musikindustrie verändern werden"'''
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Nachlese Curriculum: MPEG3 Eine Nachlese des ersten Chaos Curriculum Cologne mit dem Thema "'Internet killed the video star' -- Warum digitale Töne wie MPEG3 die Musikindustrie verändern werden" Veränderungen in der Musikindustrie durch digitale Töne wie MPEG3 Um denen, die nicht bei uns sein konnten, einen Einblick in die Geschehnisse zu geben, hier (wie immer) eine kleine Zusammenfassung... Kommt doch das nächste mal persönlich vorbei! Das dritte Chaos Curiculum Cologne fand zum letzten Mal in den Räumen des KOMED statt und wird von nun an in den neuen Clubräumen des c4 in Ehrenfeld abgehalten werden. Näheres wie immer auf unseren Websites unter koeln.ccc.de . Als Referent stand uns bei diesem Curriculum der Künstler padeluun aus Bielefeld zur Seite, der seit Mitte der 80er Jahre am Rahmenbau der Kommunikationsgesellschaft mitwirkt und mit Netzwerken arbeitet. MPEG-3: was verändert sich? Welche Möglichkeiten ergeben sich für Kulturschaffende und was passiert mit der Musikindustrie? Im Hintergrund der Veranstaltung hören wir ein MPEG von Erik Satie. Es dauert 15 Std. Mit normalen Tonabspielgeräten nicht möglich, diese Zeit durchzuhalten... Wir könnten die Schallplatte 15x umdrehen- kein schöner Gedanke... MPEG 1, Audio Layer 3, wie es richtig heißen müßte, bietet die Möglichkeit, Daten, je nach Datenbrate, 12fach zu komprimieren, und so mehrere Musik-CDs auf eine Daten-CD zu brennen. 650 MB Rohdaten gehen dabei auf eine Daten-CD. Neben dem technischen Aspekt ist das Copyright ein wichtiger Punkt: In der jetzigen Situation verdienen hauptsächlich die Major-Companies. Das Geld geht erst spät an die Künstler und der Apparat aus Vertrieb, Promotion etc verschluckt einen Großteil der Einnahmen. Als Buchtip dazu von padeluun das Werk: " Copyright oder Copywrong Geistiges Eigentum, kulturelles Erbe und wirtschaftliche Ausbeutung Hrsg: Werner Pieper Der Grüne Zweig 183 ISBN 3-9258 17-82-4 " Natürlich haben die Major-Companies auch mit Verlusten zu kämpfen. Es gibt viele Flops und Verluste und Marketing kosten Geld. Eine Lösung könnte das Internet bieten: das Verlegen wäre hier viel billiger - die Produkte könnten schneller und bequemer beim Kunden sein. Leider steckt das Internet in Deutschland noch in den Kinderschuhen, es ist zu langsam und wird noch von zu wenigen Leuten überhaupt genutzt. Als alternativen Ansatz zur bestehenden Vermarktung der Kunst gibt padeluun zu bedenken, daß es bei Musik auch um die Ethik dieses Kulturgutes geht. Musik könnte auch verschenkt werden. Wichtig könnte die hohe Verbreitungsrate und nicht der finanzielle Profit sein. Die Motivation ist bei einer solchen Haltung eine ganz andere; man muß nicht agieren, um Umsatz zu machen, sondern kann die Musik dahin bringen, wo sie hingehört, ohne finanzielle Interessen oder soziale Zwänge (Biertrinken mit unsympathischen Vertretern der Unterhaltungsindustrie). padeluun stellt die Frage, ob das nicht der eigentliche Wunsch von Kulturschaffenden sei. Das Internet bietet Künstlern die Möglichkeit, ihre Werke einer breiten Masse zugänglich zu machen, ohne finanziell oder inhaltlich abhängig zu sein. Eine Möglichkeit, als Künstler nicht zu verhungern wäre die Schaffung eines "micropayment" durch die User, die er bei Nutzung der Werke anonym entrichtet. Dafür muß ein Bewußtsein geschaffen und Technik entwickelt werden. Aus dem Publikum kamen Einschätzungen der Situation auf der POP-KOMM, wo das Internet in die Ecke der Kriminalität gedrängt wird und die GEMA massiv gegen Verstösse vorgehen will. Die Frage kam auf, wo die eigentliche Revolution oder Gefahr denn nun läge... Musik wurde seit der Erfindung der Kassette kopiert und weitergegeben und wieviele haben schon einen CD-Brenner zu Hause und sind bereit, die bei den noch schlechten Anbindungen herrschenden langen Wartezeiten im Internet in Kauf zu nehmen? Und dann braucht man noch ein besonderes Programm zum Abspielen der MPEGs und die Aktivboxen auf dem Schreibtisch geben doch auch nicht den optimalen Genuß. Anschluß an die Stereo-Anlage... Ach- soviel Arbeit und Warten für ein bißchen Musik... MPEG-3 bloß ein Spielzeug für technikbegeisterte Nerds? Die Major Companies wollen sich aus dem Online-Geschäft erstmal raushalten, befürchten sie doch weitere Verluste auf dem noch unsicheren Boden. Der derzeit von t-online angebotene (und heftig beworbene) Service "music on demand" (= mod = "Musik auf Anfrage") scheint ein zweifelhaftes Vergnügen. Abgesehen von der geschmacklich eher bescheidenen CD-Auswahl und den hohen Kosten (bis zu 50 DM fuer eine CD), bekommt man hier auch noch Spannung geboten: man bezahlt nämlich nur für 1 download auf 1 Festplatte, d.h. eine Kopie für den Rechner der kleinen Schwester ist z.B. nicht mal im Preis inbegriffen. Alles scheint noch auf wackeligen Beinen: die rechtliche Situation erlaubt Kopien zu privaten Zwecken (also etwa eine Stückzahl von 6-7 Stück). Befürchtungen hat man, wie immer, bei großen Mengen. Die neue Technologie macht wie immer Bedenken und führt zu voreiligen Schlüssen. Neue Wege der Verbreitung müssen gefunden werden und ein Bewußtsein für das "Leben im Netz"geschaffen werden und, wie padeluun in seinen Schlußworten feststellte: Verantwortung gehört zu Handeln und man muß immer wieder neu für sich entscheiden, was richtig ist. So sei es... by Jo 2002-10-17 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
