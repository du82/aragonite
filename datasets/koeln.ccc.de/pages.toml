title = "c4 | CCCC: HACKSCHIFF"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum CCCC: HACKSCHIFF Chaos Ahoi Willkommen auf dem Hackschiff Chaos Ahoi, das Hackschiff-Team ist schon ziemlich aufgeregt und hofft auf gutes Gelingen, denn der Countdown läuft jetzt. In den letzten Tagen haben wir ein paar "minor bugs" gefixt. Relevant ist für euch dabei die Anfahrt nach Bonn, bei der uns leider eine schon wieder geänderte Linksabbiegeregelung in der Bundesstadt am Rhein in die Quere kam. Der zweite Punkt bezieht sich auf das Hackschiff selbst: Es ist jetzt größer, schöner und hackerfreundlicher und trägt den bezeichnenden Namen MS Enterprise. Es fährt vom gleichen Ablegeplatz ab. Zu finden ist es ganz leicht: Wenn ihr am Rhein seid, haltet einfach nach dem futuristischsten Schiff dort Ausschau. Wir sagen Dankeschön. Das Hackschiff wird hervorragend unterstützt, von Privatpersonen und Firmen. Die beteiligten Sponsoren haben wir auf der Sponsorenseite zusammengefasst. Interessant dürfte für die Hackschiff-Besucher der Büchertisch auf dem Schiff sein: Bouvier/Gonski bieten Literatur und Software für Hacker. Also das Kleingeld nicht vergessen. :) Das Angebot: was wird geboten? Der Weg zum Hackschiff: Wie komme ich zur Anlegestelle? Der Fahrplan: Wo geht's lang? Die Anmeldung: So sichert ihr euch euren Platz by ljb 2002-09-13 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
