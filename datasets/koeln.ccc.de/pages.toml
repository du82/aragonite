["https://koeln.ccc.de/ablage/archiv.html"]
title = "c4 | Archiv"
description = "Jede Menge Zeugs zum runterladen"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Archiv Jede Menge Zeugs zum runterladen Chaos Computer Club Cologne e.V. Archiv Unser alter Webserver Alte Webseiten. [mehr] Kampf mit Behörden Die Dokumentation unserer Behördenschriftwechsel. Bizarr. [mehr] Datenschleuder Unser Datenschleuder Archiv. Noch nicht allzu vollständig, aber immerhin. [mehr] Seit neuestem gibt es ein umfassendes Archiv auf [ds.ccc.de] Hackschiffseiten Die Seiten des Servers auf dem Hackschiff haben wir natürlich archiviert. [mehr] Geldkarten Spezifikation Die Schnittstellenspezifikation für die ec-Karte Version 2.2 [mehr] chaos communication congress / camp Die Dokumentation zu den Congressen liegt an verschiedenen Stellen im Internet verstreut. Wir selber haben [hier im Archiv] Files von den Kongressen 1994-1997 und 2000. Der FoeBuD hat Datenpakete der Congresse 94-96 konserviert und auf dem zentralen ftp-Server des CCC findet man Congressdoku ab 1999. Vom Camp 1999 haben wir [Bilder Camp 1999] und [Soundschnipsel] von Radio Intergalaktika archiviert. Das ist im wesentlichen auch wieder ein Mirror des zentralen ftp-Server des CCC. Die Files vom Camp 2003 sind im [Medienarchiv] zu finden, und zwar sowohl Bilder als auch die mp3-Files von Radio Subether. Meldungsarchiv Hier gibt es alle CCCC Meldungen zum Nachlesen. [mehr] Die Wahrheit über den DVD-hack "Mit Erschrecken haben wir Ende 1999 zur Kenntnis genommen, daß die DVD-Erkenntnisse der letzten Wochen und Monate plötzlich von allen möglichen Servern verschwanden. Dabei galt doch das Internet immer als Garant für die Freiheit von Informationen -- wenn etwas im Internet veröffentlicht war, kann man es nicht zurückziehen. Um die Freiheit von Information, Forschung und Meinungsaustausch zu erhalten findet sich auf dieser Seite ein Mirror der zum Verständnis des DVD-Verschlüsselungs-Verfahrens nötigen Beschreibungen und Sourcen." [mehr] Lufthansa Deportation Class Im Mai 1999 starb der sudanesische Flüchtling Mohamed Aamir Ageep an Bord einer Lufthansamaschine. Er sollte, durch BGS-Beamte begleitet, in den Sudan abgeschoben werden. Die Beamten hatten ihn gefesselt, ihm einen Motorradhelm aufgesetzt und ihn solange auf den Sitz gedrückt, bis er erstickte. Der Tod dieses Menschen war 1999 Auslöser für die Ausstellung "DeportationClass - gegen das Geschäft mit Abschiebungen". Die im Rahmen dieser Aktion im Netz befindliche Website haben wir [hier] gespeichert. pics In Unmengen Bildern von camp, congress, hal und anderen Veranstaltungen kann man hier stöbern. mp3 Radio Subether (campradio 2003) sounds vom campradio 1999 spacestation5 mp3 hellsbells by cefalon 2002-10-01 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Chaos Computer Club Cologne e.V. Archiv Unser alter Webserver Kampf mit Behörden Datenschleuder Hackschiffseiten Geldkarten Spezifikation chaos communication congress / camp Meldungsarchiv Die Wahrheit über den DVD-hack Lufthansa Deportation Class pics mp3 Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
