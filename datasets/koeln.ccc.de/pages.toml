["https://koeln.ccc.de/ablage/curriculum/nachlese2.html"]
title = "c4 | Nachlese Curriculum: Transparenz im Netz"
description = '''
Eine Nachlese des zweiten Chaos Curriculum Cologne mit dem Thema"Der transparente Mensch im Netz: Was droht Lieschen Mailer und Otto Normalverbrowser?"'''
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Nachlese Curriculum: Transparenz im Netz Eine Nachlese des zweiten Chaos Curriculum Cologne mit dem Thema "Der transparente Mensch im Netz: Was droht Lieschen Mailer und Otto Normalverbrowser?" Der transparente Mensch im Netz "Wenn es ein Phänomen wie das absolut Böse überhaupt gibt, dann besteht es darin, einen Menschen wie ein Ding zu behandeln." Mit diesem Zitat aus John Brunners wegweisendem Roman "Der Schockwellenreiter" eröffnete Andy Müller-Maguhn das zweite Chaos Curriculum Cologne am 20. Juni im Komed. Transparenz im Netz war das Thema und natürlich die Auswirkungen von fehlender oder im Überfluß vorhandener Transparenz auf das tägliche Leben in einer von Phrasen wie "Interaktivität" oder "Multimedia" bestimmten Welt. Andy Müller-Maguhn, Pressesprecher im Chaos Computer Club e.V. und seit längerem mit dem Projekt beschäftigt, den sogenannten Entscheidungsträgern das Denken der Hackerszene nahezubringen, begann mit einem kurzen Abriß über die Entwicklung der Anwenderstrukturen im Netz: Während es in der ersten Phase Computerfreaks waren, die das Netz bevölkerten und es zum reinen Selbstzweck benutzten, kamen relativ schnell Wissenschaftler auf die Idee, das Netz zum Informationssharing zu benutzen, um zum Beispiel Forschungsergebnisse schnell auszutauschen. Ende der 80er Jahre entstand eine neue Gruppe von Netzbewohnern: Die Kommunikationsfreaks, die die Netze als "Strukturverstärker" zu nutzen wußten und sich zum Teil Brechts Radiotheorie verbunden fühlten, wonach jeder Empfänger idealerweise auch ein Sender ist. "Medien von unten" war das Schlagwort bei den Neuen Sozialen Bewegungen, die das Netz zum Austausch von Nachrichten aus Entwicklungsländern oder für die Verbreitung von Meßergebnissen nach dem GAU in Tschernobyl nutzten; aber auch Manager erkannten den Sinn von E-Mail-Diskussionen, die es den Teilnehmern ermöglichten, als Gleichberechtigte zu kommunizieren, wobei Merkmale, die in anderen Diskussionen vielleicht das Brainstorming und die Kreativität der Vorschläge hemmen könnten -- wie Aussehen, Geschlecht, sozialer Rang etc. -- fast völlig nebensächlich wurden. Seit den frühen 90er Jahren und dem Siegeszug von PCs und World Wide Web tauchte verstärkt ein neuer Anwendertypus auf, von Andy M-M leicht überspitzt mit "Mäuseschubser und Computer-Legastheniker" umschrieben. Mit den Ansprüchen "der Computer hat ein Werkzeug zu sein" und "das WWW soll ein besseres Fernsehen sein als das Fernsehen selbst" kam die alteingesessene Hackerszene nicht allzugut zurecht. Es ist noch auszudiskutieren, was aus diesen Ansprüchen folgen kann: Die ganze Welt zu Computerfreaks zu machen, scheint wenig realistisch und wünschenswert. Das Netz als Kulturraum aufzugeben, ist jedoch auch keine Lösung. Die Rezeption des Begriffes "Interaktivität" ist in diesem Zusammenhang ein Schlüssel zum Verständnis dieses Zusammenpralls der (Netz-)Kulturen. Wenn heutzutage von Seiten der Industrie von Interaktivität in den Neuen Medien gesprochen wird, so ist fast immer Auswahlinteraktivität ("Multiple Choice") gemeint. Die Medienmacher geben dem Netzteilnehmer (hier "Konsument" genannt) eine Wahl, die keine ist: "Welches Produkt möchtest du denn kaufen?". Eine Rückkanal-Interaktivität ist viel seltener gegeben, dies ist sogar ein Rückschritt gegenüber den herkömmlichen Medien, die immerhin Leserbriefe akzeptieren. Die vom Chaos Computer Club gewünschte Form der Interaktivität, die sich in einer Kommunikation emanzipierter Teilnehmer findet, scheint nicht geschäftlich verwertbar. Auch der Begriff "Multimedia" wird heutzutage sehr unterschiedlich interpretiert. Die scheinbar allgemeingültige Definition "Integration von Bild und Ton in das WWW-Angebot" ist nur eine Seite: eine bösartige Definition wäre "steigender Banbreitenbedarf bei gleichzeitig sinkendem Niveau": Ton und Bilder für die Massen, in der Tradition von Brot und Spiele. Der Trend zu werbefinanzierten Informationsangeboten statt Kommunikationsforen hält an, erklärt wird dies alles mit dem Argument, der Konusument wolle ja schließlich nichts anderes. Die momentane Lage stellt sich laut Andy Müller-Maguhn etwa so dar: Während es auf der einen Seite die Realitätskonstruktion der Usenet-News und E-Mail-Verteiler gibt, in der sich eine gewisse emanzipierte Kommunikation dur Umgangsregeln und die sogenannte Netiquette etabliert hat, steht auf der anderen Seite das WWW als Anwendung, die als Neuerfindung des Fernsehens positioniert werden soll. Da sich immer mehr Lebensbereiche wie soziale Interaktion in der peer group, Arbeiten, Einkaufen etc. ins Netz verlagern, stellt sich die Frage nach den Leitbildern: Setzt sich das Kanalmodell des Fernsehens durch, das ein Menschenbild propagiert, in der es nur Sender und Sauger, also Konsumenten gibt oder wird das Leitbild für ein im positiven Sinne transparentes Netz das Netzmodell sein, mit ihrer Teilnehmeremanzipation, dem Recht gleichberechtigter Sender oder Empfänger im Diskurs zu sein und dem Anspruch, den Zugang niederschwellig zu halten? Der transparente Mensch im Netz -- dieses Thema stellt auch die Frage nach der informationellen Selbstbestimmung, als nach dem, was traditionell als Datenschutz bezeichnet wird. Der Begriff "informationelle Selbstbestimmung" unterstreicht hierbei die Eigenverantwortlichkeit des Einzelnen; nicht Daten sind es die von einer ominösen Datenschutzbehörde zu schützen sind, sonder jeder und jede ist zumindest theoretisch dafür verantwortlich, welche Daten bekannt werden sollen. In Deutschland ist die "klassische" Sensibilität gegenüber staatlichen Stellen ("Mein Datensatz gehört mir!") dabei noch relativ hoch, wie die Diskussion um die Volkszählung gezeigt hat. Schwieriger wird diese Selbstbestimmung allerdings, wenn die Datenerhebung nicht mehr nachvollziehbar ist. Das System Echolon des US-amerikanischen Gehimdiensts untersucht im Rahmen einer präventiven Rundumüberwachung von Auslandsgesprächen fast alle Telefonverkehrsdaten auf Schlüsseldaten: Eine Selbstbestimmung ist nicht mehr gegeben, es ist quasi unmöglich sich diesem Lauschangriff zu entziehen. Seit diesem Jahr ist auch das Abgreifen der Daten im Internet-Verkehr, wie etwa E-Mails, Teil des Echolon-Systems. Ansätze dagegen, wie etwa der Einsatz von Kryptografieprogrammen für die Massen mit PGP gibt es, aber sie werden noch nicht von einer kritischen Masse von Benutzern eingesetzt. Auch dort, wo die Datenerhebung gekennzeichnet wird, kann es zu Problemen kommen. Gewinnspiele und Kreuzworträtsel dienen offensichtlich der Sammlung von Marketingdaten, aber die Preise dort sind immer noch für viele Menschen attraktiv genug, um dafür ihre Daten preiszugeben. Einen Ausblick auf das, was auf uns zukommen wird, bietet die amerikanische Firma "Dig Dirt, Inc.", im Internet unter http://www.digdirt.com/ zu finden. Gegen Gebühr bietet dieses Unternehmen Einblick in Fahrzeughalterdateien, Wählerverzeichnisse, Krankengeschichten und Telefonbücher. Hier ist Orwells 1984 keine Funktion, sondern ein Service zum bestellen. Aber auch in anderen Bereichen werden Nutzungsdaten bereits vermarktet: Das Kreditkartenunternehmen American Express gab kürzlich bekannt, das das Zahlungsmittelgeschäft mittlerweile nicht mehr den Hauptprofit der Firma ausmache: Gewinn würde hauptsächlich mit dem Verkauf von Kundendaten gemacht werden. Beispiele für beunruhigende Entwicklungen im Bereicht Datenschutz gibt es allerdings auch in Deutschland: Bei Adressverlägen lassen sich ganze Zielgruppen en bloc als Datensätze einkaufen und die umstrittene Telefonbuch-CDROM "D-Info" der Firma Topware bietet auch eine Auflistung der Telefonnummern nach der vermutlichen Sozialstruktur der Wohngegend an (Villenviertel oder sozialer Wohnungsbau). Besonders bedenklich ist in diesem Zusammenhang auch das out-sourcing, die Zentralisierung von Datenbeständen bei externen Dienstleistern. Die vom ehemaligen amerikanischen Präsidentschaftskanditaten und Multi-Millionär Ross Perot gegründete Firma Electronic Data Systems (EDS) bietet hier ein Rundum-Sorglos-Paket an. Mittlerweile speichert EDS die Daten fast aller bedeutenden Fluggesellschaften, mehrerer Banken und kleinerer Länder. Inhaber einer BahnCard finden sich ebenso in der EDS-Datenbank, wie das komplette britische Sozialleistungssystem. Hierbei ist es eigentlich unwichtig, daß EDS nur wenige Kilometer vom Hauptquatier des US-Inlandsgeheimdienstes NSA angesiedelt ist -- allein die Sprengkraft der dort versammelten Daten dürfte bei vielen Begehrlichkeiten wecken. Wer schützt uns da vor unterbezahlten EDS-Mitarbeitern, die schwach werden? Die Aussichten für die Zukunft, die uns im Bereich der Nutzung von Datenspuren erwarten, sind auch nicht gerade rosig: Wahrscheinlich werden neuronale Netzwerke, die anfallenden Datenströme immer besser interpretieren können, in der Datenverabeitung zum Einsatz kommen. In Amerika läuft zur Zeit ein Werbespot für Kreditkarten, in dem ein junger Mann immer die gleichen Holzfällerhemden und Jeans kauft und natürlich mit seiner Karte bezahlt. Eines Tages will er allerdings heiraten und kauft zum ersten Mal in seinem Leben einen Anzug und teure Schuhe. Er hat gerade mit seiner Karte bezahlt, als er ans Telefon gerufen wird. Man bittet ihn, sich zu identifizieren, das Passwort für seine Kreditkarte zu nennen und klärt ihn dann auf, daß man sich eben Sorgen gemacht habe: Derart teure Kleidung passe nicht in sein Nutzerprofil. Der abschließende Slogan "We care for you" ist durchaus ernst gemeint: Die Firma preist die ständige Filterung der Kundendaten durch ein Analyseprogramm als guten Service an. Auch von der staatlichen Seite ist noch einiges zu erwarten: In Zeiten, in denen die organisierte Kriminalität statistisch nachweisbar rückläufig ist, dienen Maßnahmen wie der große Lauschangriff oder allgegenwärtige Überwachungskameras sicher nicht in erster Linie der Verbrechensbekämpfung. Der Bevölkerung soll ein nettes, kuscheliges Gefühl der Sicherheit gegeben werden, ob die Unsicherheit nun faktisch begründbar ist oder nicht: "We care for you" "Ständige Wachsamkeit ist der Preis der Freiheit" schrieb Thomas Jefferson. Auf die Netze und unser Leben übertragen ließe sich sagen: Freiheit ist machbar, man muß nicht unbedingt zur transparenten Datenquelle werden. Der Einsatz von Verschlüsselungssoftware und anonymen Reamilern oder Diensten wie www.anonymizer.com sind Beispiele. Aber bequem ist es nicht, das Recht auf informationelle Selbstbestimmung wahrzunehmen und als Konsum-Variante zum Anklicken wird Datenschutz wohl in der Zukunft eher weniger zu haben sein als jetzt. by Jo 2002-10-17 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
