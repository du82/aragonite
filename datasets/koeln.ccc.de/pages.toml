["https://koeln.ccc.de/updates/2007-02-17_FireWire.html"]
title = "c4 | OpenChaos am 22. Februar: hacking in physically addressable memory"
description = """
Im Rahmen einer Seminar-Arbeit an der RWTH Aachen hat losTrace als
\t\tProof-of-Concept der 0wn3d by an
\t\t\tiPod-Idee (hacking via Direct Memory Access) eine Reihe von Tools entwickelt, die er vorstellen wird."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos am 22. Februar: hacking in physically addressable memory Im Rahmen einer Seminar-Arbeit an der RWTH Aachen hat losTrace als Proof-of-Concept der 0wn3d by an iPod-Idee (hacking via Direct Memory Access) eine Reihe von Tools entwickelt, die er vorstellen wird. "hacking in physically addressable memory": hacking via DMA als Proof-Of-Concept der 0wn3d-by-an-iPod-Idee "Physical access wins", das ist jedem klar, der schon einmal darüber nachgedacht hat. Aber das muss nicht immer z.B. durch Booten eines Betriebssystems oder stehlen der Hardware sein, das kann auch durch direkten Zugriff auf den Hauptspeicher sein. Die Idee, das DMA-feature von FireWire zu missbrauchen ist schon alt und wurde zuerst für lustige (Firestarter) Sachen benutzt. Eine echte Analyse der Problemstellung, via reinem Speicherzugriff ein System zu uebernehmen, gab es aber noch nicht. Deshalb habe ich dieses Thema fuer meine Seminararbeit am i4(Informatik) der RWTH-Aachen gewählt und über die letzten 6 Monate einige Tools entwickelt, die ich, mit Samt einer Analyse des Problems, auf diesem OpenChaos vorstellen werde. Dazu gehören u.a. Programme zum Listen aller Prozesse auf dem Zielsystem mit Argumenten und Environment, das Stehlen von SSH-Private-Keys von SSH-Agents, das Injecten von Code in Prozesse und zuletzt eine interaktive Shell ausschliesslich über DMA. Der Vortrag von losTrace findet am Donnerstag, 22. Februar statt und beginnt pünktlich um 20:00 Uhr in den Räumlichkeiten des C4. Ebenso werden noch verschiedene Sachen zu diesem Thema auf dieser Seite verlinkt. by AmP 2007-02-17T12:30+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
author = "AmP"
year_published = 2007
clearnet = "https://koeln.ccc.de/updates/2007-02-17_FireWire.html"
