full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos im Juli - CCC Historie Im Juli findet ja bekanntlich die What-The-Hack in Holland http://www.whatthehack.org statt. Aus diesem Grund wird es zwar kein reguläres OpenChaos geben, dennoch wird es am 28. Juli in den Räumlichkeiten des Chaos Computer Club Cologne eine Vorführung von Multimedia-Schnippseln geben Im Juli findet ja bekanntlich die What-The-Hack in Holland (www.whatthehack.org) statt. Aus diesem Grunde wird es kein reguläres OpenChaos geben. Dennoch wird es am 28. Juli in den Räumlichkeiten des Chaos Computer Club Cologne eine Vorführung von Multimedia-Schnippseln geben. Es handelt sich hierbei um Material aus den Anfangszeiten des CCC in den 80ern, sowie über Projekte wie Blinkenlights und Arcade. Ihr könnt also gerne am 28. ab 20 Uhr im Club vorbeikommen oder uns natürlich auch gerne auf der What-The-Hack im CCC Village besuchen by AmP 2005-07-07T10:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
