description = """
Wir werfen an diesem Donnerstag einen Blick hinter die Kulissen von Ebay, und haben dazu Axel Gronen eingeladen, als echten Kenner. Themen werden sein: Ebay allgemein und Betrug im Besonderen, Daten- und Verbraucherschutz, Sicherheitsmaßnahmen bzw. Sicherheitslücken.Beginn 20 Uhr, im C4-Labor."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos: Ebay - Security und Datenschutz 27.1.05 Wir werfen an diesem Donnerstag einen Blick hinter die Kulissen von Ebay, und haben dazu Axel Gronen eingeladen, als echten Kenner. Themen werden sein: Ebay allgemein und Betrug im Besonderen, Daten- und Verbraucherschutz, Sicherheitsmaßnahmen bzw. Sicherheitslücken. Beginn 20 Uhr, im C4-Labor. Drei, zwei, eins .. Ebay kennt (fast) jede/r. Wir werfen an diesem Donnerstag mal einen Blick hinter die Kulissen, mit einem echten Ebay-Kenner. Axel Gronen, Autor von "Ebay Dirty Tricks" und Betreiber des unabhängigen Ebay-Info-Portals wortfilter.de, kennt sich auch aus mit den dunkleren Seiten der Macht. Themen seines Vortrags werden sein: Ebay allgemein und Betrug im Besonderen, Daten- und Verbraucherschutz, Sicherheitsmaßnahmen bzw. Sicherheitslücken beim bekanntesten Online-Auktionshaus der Welt. Beginn wie immer um 20 Uhr. by nika 2005-01-23T19:23:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
