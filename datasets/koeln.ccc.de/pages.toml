title = "c4 | Nein zu rechter Gewalt!"
description = "Der C4 wendet sich nach einem Übergriff auf das Naturfreundehaus in Köln-Kalk gegen Nazis."
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Nein zu rechter Gewalt! Der C4 wendet sich nach einem Übergriff auf das Naturfreundehaus in Köln-Kalk gegen Nazis. Nein zu rechter Gewalt! Ein Übergriff auf das Naturfreundehaus in Köln-Kalk in der Nacht vom 28. auf den 29. September hat uns erschüttert! Das Beschmieren der Wände und Fenster mit Naziplakaten und Hakenkreuzen muss als Drohung der Rechtsextremen verstanden werden. Sie richtet sich gegen das Naturfreundehaus, welches auch bundesweit als Ort der Versammlung und Kommunikation dient. Auch der Chaos Computer Club nutzt das Naturfreundehaus als Tagungsort für seine bundesweite Mitgliederversammlung. Die Stimmung in Köln nach der Kommunalwahl mit dem Erfolg der rechtsextremen "Bürgerbewegung Pro-Köln" wird mit dieser Tat weiter vergiftet. Dieser erneute Übergriff kommt in einer Situation, in der sich die rechten Gegner eines gemeinschaftlichen, friedlichen Zusammenlebens im Aufschwung wähnen. Rechtsradikale pochen gerne auf ihrem Recht zur freien Meinungsäusserung. Was sie dabei grundsätzlich übersehen ist jedoch die indiskutable Tatsache, dass Faschismus keine Frage der Meinung oder des Geschmacks ist, sondern ein Verbrechen! Besonders perfide dabei ist es, wenn Nazis sich selbst als "politisch Verfolgte" und "an der freien Meinungsäußerung gehinderte Opfer" ausgeben, um neue Mitglieder zu werben, die sich mit diesem Opferstatus identifizieren. Die Rechtsradikalen haben leider mittlerweile gelernt, der postmodern liberalen Gesellschaft auf der Nase herum zu tanzen, indem sie die demokratischen Strukturen zu ihren eigenen Zwecken missbrauchen. Wenn sie als Gegenwehr des Staates Rundumschläge wie Zensur- und Überwachungsgelüste provozieren, gefährden sie hiermit die Freiheit aller Bürger und Medien. Der CCC wird sich auch weiterhin für die freie Meinungsäußerung aller galaktischen Wesen, die Freiheit aller Bits und Bytes und gegen Zensur im Netz einsetzen. Für uns endet die Freiheit des Individuums (frei nach Rosa Luxemburg) nur da, wo die Freiheit eines anderen gefährdet ist. Rechtsradikale Positionen sind mit den Grundsätzen unseres Vereins nicht vereinbar. Meinungsfreiheit ist eine Verpflichtung und will verteidigt werden. Am 16. Oktober rufen die Nazis zur Demonstration in Kalk auf. Das Bündnis "Köln stellt sich Quer" wird gleichzeitig zeigen, dass Nazis in Köln keinen Platz haben. Wir werden dort sein. by webmaster 2004-10-06 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
