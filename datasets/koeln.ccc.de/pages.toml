["https://koeln.ccc.de/updates/2006-09-27_openchaos_september.html"]
title = "c4 | OpenChaos September: Amateurfunk"
description = """
Leider mal wieder etwas spät die Ankündigung, aber nun steht das Thema fürunser OpenChaos diesen Monat fest: Amateurfunk.  In Zeiten desInternet-Booms und dem Aufkommen des Mobilfunks vor ein paar Jahren schonfast für tot gehalten, entdecken heute viele Bastler und Hacker im Zuge vonWLan-Longshots und RFID-Produkten den Amateurfunk als weiteres Hobby fürsich."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos September: Amateurfunk Leider mal wieder etwas spät die Ankündigung, aber nun steht das Thema für unser OpenChaos diesen Monat fest: Amateurfunk. In Zeiten des Internet-Booms und dem Aufkommen des Mobilfunks vor ein paar Jahren schon fast für tot gehalten, entdecken heute viele Bastler und Hacker im Zuge von WLan-Longshots und RFID-Produkten den Amateurfunk als weiteres Hobby für sich. Macke, der Ausbildungsleiter der „Chaoswelle“, wird in diesem OpenChaos zeigen, welche Faszination hinter dem Hobby Amateurfunk steckt, was für Bedingungen Interessierte erfüllen müssen um dabei mitzumachen, und warum es sich ausgerechnet jetzt lohnt eine Lizenz zu erwerben. Vom technischen her werden wir dabei über Mikrowellen, Helixen, Satelliten, Relais, die Atmosphäre, Sonnenflecken und selbst den Mond sprechen. Natürlich wird auch gefunkt und wer mag darf selbst mal ran. Die Chaoswelle ist eine lose Gruppierung von Amateurfunkern im CCC. Parallel dazu gibt es den „Ortsverband ‚D23 – Freunde des CCC‘“ im Deutschen Amateurfunk-Radio-Club e.V. (kurz DARC). Der Vortrag mit Workshopcharakter findet am Donnerstag, 28. September statt und beginnt pünktlich um 20:00 Uhr in den Räumlichkeiten des C4. by pylon 2006-09-27T01:00+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
