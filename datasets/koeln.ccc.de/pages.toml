full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos Oktober: Kameraüberwachung & Urban Living Auf dem Bahnhof gefilmt, in der KVB, im Supermarkt, die Kamera schreibt die Seriennummer in die Metadaten von Dokumenten. Tronicum bietet einen Überblick wie man überwacht werden kann. Paranoiker sind herzlich willkommen. Auf dem Bahnhof gefilmt, in der KVB, im Supermarkt, die Kamera schreibt die Seriennummer in die Metadaten von Dokumenten. Tronicum macht einen Ausflug in die Welt der Überwachung: Kameraüberwachung, Handyüberwachung, Elektronische Bezahlvorgänge, Metadaten in Dokumenten oder auf Papier, der ePass, etc… Ein weites Feld für Paranoiker. Der Vortrag findet am Donnerstag, 26. Oktober statt und beginnt um 20:00 Uhr in den Räumlichkeiten des C4. by tronicum 2006-10-25T23:00+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
