["https://koeln.ccc.de/ablage/security/iealt.html"]
title = "c4 | Dem Surfer auf der Spur"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Dem Surfer auf der Spur Alternative Fehlerseite im Microsoft Internet Explorer 5.x/6 Beim Internet Explorer (sowohl beim 5.x als auch dem neuen 6) von Microsaft ist eine kleine Funktion drin, die vielen schon sehr auf den Nerv geht. Und zwar fragt der Browser bei einer Eingabe einer Adresse in die Locationbar, die nicht existiert bei Microsoft nach! Das geschieht dann, wenn die Adresse nicht aufgelöst wird (DNS-Error) oder der Server sich aus anderen Gründen nicht meldet. Das ganze läuft auf dem Rechner "auto.search.msn.com" auf. Und man die Jungens von M$ kennt, läuft da garantiert ein script, was die Falscheingaben (z.B. Vertipper) auswertet und M$ hat nette Statistiken. Und die frei Haus für lau. Wenn man in hosts "auto.search.msn.com" auf "213.221.113.45" umleitet (das ist koeln.ccc.de), so erwartet da ein ScriptAlias "resonse.asp" und "results.asp", das auf ein perlscript von mir zeigt und ne kleine Fehlermeldung ausgibt und Links anbietet, die direkt zu div. Suchmaschinen weiterführen (mit Suchstring). Da IE (fast) nur auf Windows (jaja, und Solaris in alter Version und Mac...) existiert, so kann man auch Windoze überreden, auto.search.msn.com umzuleiten. Man muss nur in der Datei \WINDOWS\HOSTS (bzw. bei Windows XP oder Windows 2000 in [Systemverzeichnis]\drivers\etc\hosts ) die Zeile 213.221.113.45 auto.search.msn.com hinzufügen (zwischen IPNr. und Eintrag am besten ein <TAB>!). Viola! Damit kann M$ ein bischen weniger ausspionieren. Und man muß nur noch klicken, um eine Google-Suche durchzuführen. Die kleinen Fehler laufen jetzt auf dem Rechner weltregierung.koeln.ccc.de auf und ich versichere, daß dort kein script, Statistiktool oder Data-Mining-Software (oder irgendwas) läuft, welche Quelle und Daten der Zugriffe oder der Suchanfragen loggt, auswertet oder weitergibt - versprochen! Hier (eine erste, spartanischere Version hier) ist das script im Quellcode (Perl5) und hier gibt es eine Batch-Datei, die die neue Zeile in \WINDOWS\HOSTS hinzufügt. Wer auch uns nicht traut (man kann nie paranoid genug sein...) kann ja das script selber einsetzen. Einfach das script ins cgi-bin-Verzeichnis legen und einen ScriptAlias anlegen. Bei Apache geht das mit folgenden zwei Zeilen in der Datei httpd.conf: ScriptAlias /results.asp /pfad_zu_cgi-bin/results.pl ScriptAlias /response.asp /pfad_zu_cgi-bin/results.pl Dabei sind "pfad_zu_cgi-bin" natürlich auszutauschen um die absolute Pfadangabe zu seinem cgi-bin-Verzeichnis. by CCC Cologne 2002-09-19 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
author = "CCC Cologne"
year_published = 2002
clearnet = "https://koeln.ccc.de/ablage/security/iealt.html"
