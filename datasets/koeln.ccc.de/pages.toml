["https://koeln.ccc.de/c4/veranstaltungen.html"]
title = "c4 | Veranstaltungen"
description = "Eine kleine Aufschlüsselung über die regelmäßigen Veranstaltungen im Chaos Computer Club Cologne."
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Veranstaltungen Nächste Veranstaltungen Jeden Donnerstag (~19 Uhr) Offener Abend Jeden 1. Mittwoch im Monat (19.15 Uhr) Rust User Group Cologne Jeden 3. Mittwoch im Monat (19 Uhr) OSAMC: Open Source Audio Meetup Cologne Eine kleine Aufschlüsselung über die regelmäßigen Veranstaltungen im Chaos Computer Club Cologne. In unseren Räumlichkeiten finden regelmäßig Veranstaltungen statt, die von diversen Gruppen organisert werden, deren Interessen sich mit denen des Chaos Computer Club Cologne überschneiden. Aber auch wenn mal keine Veranstaltung stattfindet ist der C4 an Donnerstagen immer für Besucher offen . Im Normalfall öffnen die Mitglieder den Club ab ca. 18:00 Uhr für alle Interessierten. Es gibt dann kein geplantes Programm sondern C4-Mitglieder und C4-nahe Menschen sind dann anwesend um Erfahrungen auszutauschen, an eigenen Projekten zu arbeiten, sich zu unterhalten, oder das zu tun, worauf sie sonst gerade Lust haben, ganz abhängig von der Person. Je nach Person kann man sich dann über Themen wie z.B. Computer, Programmierung, Elektronik, Technologie, usw. unterhalten. Zudem trifft sich jeden Donnerstagabend die Ortsgruppe der Sportsfreunde der Sperrtechnik Deutschland e.V. im C4, die sich dem zerstörungsfreien Öffnen von Schlössern, oder kurz Lockpicking, als Sport widmet. Der Zweck des Unterfangens ist es nicht sich unberechtigt Zutritt zu Orten zu verschaffen und Menschen die zu diesem Zweck Lockpicking lernen wollen sind nicht willkommen. Die folgenden Veranstaltungen finden zwar regelmäßig statt, es ist aber nicht garantiert, dass sie auch tatsächlich jeden Monat stattfinden. Dazu informiert ihr euch am besten auf der entsprechenden Webseite. OpenChaos Das OpenChaos ist der offene Abend des Chaos Computer Club Cologne und findet jeden Donnerstag statt. Als besonderes Schmankerl bieten wir jeden letzten Donnerstag im Monat einen Vortrag, der sich mit Themen beschäftigt, die den C4 interessieren. Dort kann man sich wie an anderen Donnerstagen auch mit den Anwesenden über das Vortragsthema oder auch beliebige andere Themen unterhalten. Die Vorträge werden in der Regel aufgenommen und oft auch gestreamt, und die Videos danach auf media.ccc.de veröffentlicht. Rust User Group Cologne Meetup Die Rust User Group Cologne, oder einfach RustCologne, veranstaltet jeden ersten Mittwoch im Monat ein Meetup. Dieses Meetup ist im Normalfall auf Englisch und beschäftigt sich mit Themen rund um die Programmiersprache Rust. Dazu gibt es öfter Vortäge die je nachdem auch aufgenommen und auf media.ccc.de veröffentlicht werden. In jedem Fall aber gibt es die Möglichkeit sich über Themen rund um Rust zu unterhalten und zu diskutieren. Auch Menschen, die bisher noch nicht viel Erfahrung in Rust haben, sind natürlich herzlich willkommen. Die Webseite von RustCologne findet ihr hier. Ihre Veranstaltungen werden über Meetup angekündigt. Freier Software Abend Köln (bis auf weiteres pausiert) Diese Veranstaltung ist bis auf weiteres pausiert. Der Freie Software Abend Köln findet jeden zweiten Mittwoch im Montat statt. Am Freien Software Abend sind alle, die an freier Software und offenen Standards interessiert sind, zu Vorträgen und Gesprächen eingeladen. Gäste und neue Teilnehmer, aber auch Menschen, die etwas thematisch passendes vortragen möchten, sind herzlich willkommen. Der Freie Software Abend ist eine Veranstaltung des Freie Software Freunde e.V.. Open Source Audio Meeting Cologne Das Open Source Audio Meeting Cologne, oder einfach OSAMC, ist ein Treffen, das jeden dritten Mittwoch im Monat stattfindet. Es ist ein Treffen für Musikerinnen und Musiker, Programmierer, Hobbyisten und Profis, Anfänger und Experten, Lehrer und Schüler die Interesse an Musik und Open Source Software haben. Das OSAMC beschäftigt sich mit Themen rund um Musikgestaltung mit Open Source und freier Software. Die Webseite findet ihr hier und die Veranstaltungen werden über Meetup angekündigt. by Qb 2019-11-06 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content OpenChaos Rust User Group Cologne Meetup Freier Software Abend Köln (bis auf weiteres pausiert) Open Source Audio Meeting Cologne Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
