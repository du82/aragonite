full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum s/OpenChaos/Rumnerden/ im Februar Im Februar entfällt der monatliche Vortrag, jedoch ist das C4-Labor für Interessenten geöffnet. Zum Einen findet das weibliche Karnevalstreiben am Donnerstag seinen Höhepunkt, jedoch lassen wir uns davon nicht abschrecken. Zum Anderen sind wir erst am Wochenende mit der Renovierung der Clubräume nach einem kleinen Brand fertig geworden, weshalb noch gar nicht sicher war, ob wir überhaupt ein OpenChaos stattfinden lassen könnten. Die Planung ist während der Arbeiten einfach unter gegangen. Wer dem karnevalistischen Treiben ausweichen möchte, kann ab 20:00 Uhr im C4-Labor aufschlagen. by Pylon 2006-02-21T22:42+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
