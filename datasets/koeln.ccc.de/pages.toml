["https://koeln.ccc.de/updates/2007-01-22_openchaos_januar.html"]
title = "c4 | OpenChaos am 25. Januar: IT-Grundschutz"
description = """
Der Vortrag zeigt einen Überblick über das IT-Grundschutzhandbuch desBundesamt für Sicherheit in der Informationstechnik (BSI). Hierbei handelt essich um ein Managementsystem für Informationssicherheit (engl.: InformationSecurity Management System, ISMS), welches Verfahren und Regeln einesUnternehmens beinhaltet, die dazu dienen, Informationssicherheit dauerhaft zusteuern und zu kontrollieren und speziell Vertraulichkeit, Integrität undVerfügbarkeit von Informationen zu gewährleisten."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos am 25. Januar: IT-Grundschutz Der Vortrag zeigt einen Überblick über das IT-Grundschutzhandbuch des Bundesamt für Sicherheit in der Informationstechnik (BSI). Hierbei handelt es sich um ein Managementsystem für Informationssicherheit (engl.: Information Security Management System, ISMS), welches Verfahren und Regeln eines Unternehmens beinhaltet, die dazu dienen, Informationssicherheit dauerhaft zu steuern und zu kontrollieren und speziell Vertraulichkeit, Integrität und Verfügbarkeit von Informationen zu gewährleisten. Manuel Atug (HonkHase) und Daniel Jedecke (Jedi) vom C4 werden den Standard vorstellen und die Vorgehensweise zur Umsetzung anhand der fiktiven Chaos GmbH praktisch aufzeigen. Der Vortrag findet am Donnerstag, 25. Januar statt und beginnt pünktlich um 20:00 Uhr in den Räumlichkeiten des C4. Nachtrag: Wir haben die Folien online zur Verfügung gestellt. Weitere Links gibt es in unserem Wiki. by pylon 2007-01-22T17:45+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
