["https://koeln.ccc.de/updates/2006-11-09_openchaos_november.html"]
title = "c4 | OpenChaos November: Steuern, Messen, Regeln - mit Microcontrollern im Eigenbau"
description = """
Microcontroller eignen sich für vielerlei Aufgaben, egal ob Messen, Steuern,   Regeln. Heutige Microcontroller sind mit Schalt- und PWM-Ausgängen, A/D  Wandlern, Timern, Zählern und Taktfrequenzen bis 20 MHz gut ausgerüstet.  Eines fehlte bisher: Die Ethernet und TCP/IP Anbindung, um auch über das  Internet erreichbar zu sein und mit den 'großen' Rechnern ohne Umwege  kommunizieren zu können. Aber ist ein Microcontroller mit nur 2-4Kb RAM in  der Lage, TCP/IP zu sprechen?"""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos November: Steuern, Messen, Regeln - mit Microcontrollern im Eigenbau Microcontroller eignen sich für vielerlei Aufgaben, egal ob Messen, Steuern, Regeln. Heutige Microcontroller sind mit Schalt- und PWM-Ausgängen, A/D Wandlern, Timern, Zählern und Taktfrequenzen bis 20 MHz gut ausgerüstet. Eines fehlte bisher: Die Ethernet und TCP/IP Anbindung, um auch über das Internet erreichbar zu sein und mit den 'großen' Rechnern ohne Umwege kommunizieren zu können. Aber ist ein Microcontroller mit nur 2-4Kb RAM in der Lage, TCP/IP zu sprechen? Dieser Vortrag zeigt, wie man einen Atmel Microcontroller mit dem Ethernet verbindet und einen TCP/IP-Stack implementiert. Neben der Theorie gibt es auch reichlich Praxis. fd0 (Alexander Neumann) und shorty (Michael Schwab) stellen eine komplette, selbstentwickelte, offene Hardware- und Software-Implementierung, das etherrape, vor, mit der sich vielfältige Aufgaben lösen lassen. Einige Beispiele sind das Erfassen von Temperaturen, Schalten von Geräten, Senden und Empfangen von Infrarot Fernbedienungssignalen, Überwachung von Servern, Steuern von Geräten über RS-485 (z.B. fnordlichter), Abspielen von MP3-Dateien und vieles mehr. Der Vortrag findet am Donnerstag, 30. November statt und beginnt um 20:00 Uhr in den Räumlichkeiten des C4. by fd0 2006-11-09T14:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
