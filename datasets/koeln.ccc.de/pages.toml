title = "c4 | Kameras Stoppen vor Gericht: Kölner Polizei muss sich für Videoüberwachung des Kölner Stadtgebiets rechtfertigen"
description = "Am 28. November wird am Verwaltungsgericht Köln über die polizeiliche Videoüberwachung verhandelt. Wir laden euch ein der Verhandlung beizuwohnen!"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Kameras Stoppen vor Gericht: Kölner Polizei muss sich für Videoüberwachung des Kölner Stadtgebiets rechtfertigen Am 28. November wird am Verwaltungsgericht Köln über die polizeiliche Videoüberwachung verhandelt. Wir laden euch ein der Verhandlung beizuwohnen! Gegenstand der Verhandlung ist der Antrag, die Videoüberwachung im öffentlichen Raum gänzlich einzustellen oder mindestens in erheblichem Umfang zu reduzieren. Bisher wurde bereits in einem Eilverfahren eines Anwohners festgestellt, dass die Polizei Geschäfte und Privatwohnungen durch Fenster mitüberwacht hat. Angesichts der Pläne die Videodaten zukünftig mittels künstlicher Intelligenz und Gesichtserkennung automatisiert auszuwerten, ist davon auszugehen, dass es zu weiteren Verletzungen von Intims- und Privatssphäre der BewohnerInnen Kölns kommen wird. Zudem hat die Polizei nachweislich öffentliche Versammlungen illegal gefilmt und bedroht somit unmittelbar die freie Meinungsäußerung im öffentlichen Raum. Wir laden euch herzlich ein der Verhandlung am Donnerstag beizuwohnen und zu zeigen, dass die Polizei die Grundrechte nicht sang- und klanglos abschaffen kann. Die Verhandlung beginnt am Donnerstag um 10 Uhr im Verwaltungsgericht Köln, Saal 101. Erscheinet zahlreich, bedenkt etwas früher da zu sein, da es durch den Security-Check zu Verzögerungen kommen kann und vergesst nicht euren Personalausweis mitzubringen. by snoopy 2024-11-26T23:42:00+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
