full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum BigBrotherAwards Public Viewing Wasserdichte Recherche, pointierte Reden und Musik als Rahmen: Digitalcourage e.V. verleiht die BigBrotherAwards an die schlimmsten Datenschutz-Saboteur*innen des Jahres. Wir streamen live aus Bielefeld. Spannend, unterhaltsam und gut verständlich werden die "Oscars für Überwachung" (Le Monde) an die größten Datensünder*innen des letzten Jahres vergeben. Eine Jury aus prominenten Bürgerrechtler*innen verleiht jährlich diesen Datenschutz-Negativpreis an Firmen, Organisationen und Politiker*innen. Die BigBrotherAwards bewirken viel: Sie machten zum Beispiel Rabattkarten, Scoring, Mautkameras, Farbkopierer und Handyüberwachung als Gefahr für Grundrechte und Privatsphäre bekannt. Sie warnten schon früh vor der Gesundheitskarte, der Steuer-ID und der Vorratsdatenspeicherung. Schon lange vor den Skandalen bei Lidl, Telekom, Bahn und Co. wurden die BigBrotherAwards an diese Konzerne verliehen. Ein Abend der gelebten Politik mit den Mitteln des Theaters, geschliffener Rede, Musik und Tanz. Gemeinsam mit der Kölner Ortsgruppe von Digitalcourage möchten wir euch zum Public Viewing in unseren Räumlichkeiten einladen. Hinweis: Die BigBrotherAwards Verleihung wird auf Digitalcourage live gestreamt. Das ist auch der Livestream, den wir zusammen in unseren Räumlichkeiten schauen werden. Der Livestream findet am Freitag, den 11. Oktober 2024 in Bielefeld statt, wird aber in den Räumen des Chaos Computer Club Cologne gestreamt. Beginn ist um 18:00 Uhr. Wir freuen uns auf Euch! by snoopy 2024-10-10T00:42:42+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter 