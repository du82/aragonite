["https://koeln.ccc.de/ablage/u23-2005/index.html"]
title = "c4 | Projekt u23 (2005)"
description = "Ein spannendes Projekt für junge Hacker und Haecksen."
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Projekt u23 (2005) Ein spannendes Projekt für junge Hacker und Haecksen. " Du bist der Meinung, dass alle Informationen frei sein müssen. Du bist überzeugt, dass der Zugang zu Computern und Allem, das einem zeigen kann, wie diese Welt funktioniert, frei und unbegrenzt sein soll. Du bist höchstens 23 jahre alt. Du suchst Kontakt zu Hackern. Du lässt Dir Lösungen nicht vorsetzen, sondern gehst deinen eigenen Weg. Du möchtest mit engagierten jungen Menschen eine komplexe Aufgabe im Team lösen. " U23 ist ein Projekt für junge Hacker und Haecksen bis 23 Jahre. An sechs Terminen werden die Teilnehmer in die Welt von Platinen, Mikrocontrollern und LED-Ansteuerungen eintauchen. Zunächst wird unter Anleitung von Tutoren ein fnordlicht bestückt. Nach Erläuterung der Funktionsweise, können in Gruppen unterschiedliche Ansteuerungsmöglichkeiten realisiert werden. Das Ergebnis wird im Rahmen eines OpenChaos der Öffentlichkeit vorgestellt. Interessante Details werden in der Datenschleuder der Fachwelt näher gebracht. Voraussetzungen Du solltest nicht älter als 23 Jahre sein und dich für Computer interessieren. Alternative Betriebssysteme sollten dich nicht abschrecken. Löterfahrung und Elektronikkenntnisse sind sehr hilfreich, aber nicht notwendig. Das Projekt wurde bisher komplett unter Linux entwickelt und programmiert. Ein eigener Computer wird nicht benötigt, Laptops dürfen jedoch gerne mitgebracht werden. Termine Am 15. September um 20:00 Uhr findet ein unverbindlicher Informationsabend mit anschließender Anmeldemöglichkeit statt. Dieser Abend ist nicht verpflichtend, es wird dort eine Vorführung mit ein paar fnordlichtern und einen genaueren Überblick über den Inhalt des Projekts und eine anschliessende Anmeldemöglichkeit geben. Ansonsten immer donnerstags von etwa 18:30 bis 22:00 Uhr: 22. September: 1. Projektabend 29. September: 2. Projektabend 6. Oktober (Herbstferien): 3. Projektabend 13. Oktober (Herbstferien): 4. Projektabend 20. Oktober: OpenChaos zu digitalen Wasserzeichen (kein Projektabend) 27. Oktober: 5. Projektabend 3. November: 6. Projektabend Oktober/November: Besuch der vollautomatischen Platinenfertigungsanlage der Fischer Leiterplatten GmbH in der Nähe von Dortmund (nur für Teilnehmer) November: OpenChaos mit Abschlußpräsentation Ort U23 findet im Labor des Chaos Computer Club Cologne e.V. im Keller der alten Kartonagenfabrik Seybold, Vogelsanger Str.286 in Köln-Ehrenfeld statt. Mit den meisten Verkehrsmitteln kommt man da problemlos hin (siehe Anfahrtsbeschreibung). Mit dem Semesterticket von Aachen aus fährt man bis Köln-Ehrenfeld und ist in 10 Minuten zu Fuss beim Labor. Kosten Der Mitmach-Beitrag beträgt 42,- EUR, dafür bekommst Du einen kompletten fnordlicht Bausatz (Platinen, Kleinteile, Prozessor, Blumentopf), den du dann während des Projekts selbst zusammenbauen und näher kennenlernen wirst und anschliessend behalten kannst. Anmeldung Alle Plätze sind mehr als belegt, sorry. Wenn du direkt benachrichtigt werden möchtest, wenn das nächste U23 stattfindet, trag dich doch in unsere U23-Update-Mailingliste ein. Tutoren Alexander "fd0" (mail) Corinna "pallas" (mail) Lars "cebewee" (mail) Michael "shorty" (mail) David "losTrace" (mail) Lars "pylon" (mail) Martin "masr" (mail) Thorsten "skytee" (mail) Infoposter Wenn du für unser Projekt Werbung machen möchtest (zum Beispiel an deiner Schule oder deiner Uni), häng doch einfach unser tolles U23-Infoposter auf. FAQ Häufig gestellte Fragen zu U23: Lohnt es sich mitzumachen, wenn man an einem Abend keine Zeit hat? Ja, das lohnt sich auf jeden Fall. Du hast ja Internet und kannst dich damit mit deiner Gruppe koordinieren. Komm einfach beim Infoabend vorbei. Ich wohne weiter weg, würde aber gerne mitmachen. Gibts so ein Projekt auch in meiner Nähe? Motivier doch deinen lokalen Erfa-Kreis/Chaostreff, auch sowas aufzuziehen oder hilf direkt bei der Organisation mit! Wir können dieses Projekt leider nur im Köln/Aachener Raum anbieten, wollen aber andere Gruppen unterstützen. Ich hab mich angemeldet, aber keine Mail bekommen? Ich hab mich angemeldet aber nichts von euch gehört? Meld dich bitte bei Alexander (mail) oder melde dich nochmal an. Ich hab eine Frage zum fnordlicht selber... Schau dir bitte vorher die fnordlicht FAQ an Presse Vertreter der Presse wenden sich bitte an Alexander Neumann (mail) Sponsoren Dieses Projekt wird realisiert mit freundlicher Unterstützung von LUMITRONIX LED-Technik GmbH CadSoft Computer GmbH Fischer Leiterplatten GmbH by fd0, pylon, pallas 2005-09-07 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Voraussetzungen Termine Ort Kosten Anmeldung Tutoren Infoposter FAQ Presse Sponsoren Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
