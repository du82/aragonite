["https://koeln.ccc.de/updates/2006-04-12_wikipedia-workshop.html"]
title = "c4 | Wikipedia und C4 in Kooperation"
description = """
Am vergangenen Wochenende fand im Labor des Chaos Computer Club Cologne einWorkshop-Wochenende von Wikipedia-Aktiven statt."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Wikipedia und C4 in Kooperation Am vergangenen Wochenende fand im Labor des Chaos Computer Club Cologne ein Workshop-Wochenende von Wikipedia-Aktiven statt. Insbesondere in der Gruppe des Wikipedia Stammtisch Köln kam vor einigen Monaten der Wunsch auf, sich für ein Wochenende zu treffen und aktiv an Artikeln zu arbeiten. Da dieses durch den Mangel an Computern und Internet im üblichen Stammcafé nicht möglich ist, stellte der Chaos Computer Club Cologne seinen Clubraum zur Verfügung. Es blieb jedoch nicht bei den Wikipedianern rund um Köln, sondern aus dem gesamten Bundesgebiet kamen insgesamt 30 aktive Enzyklopädiemitarbeiter zusammen, um sich auszutauschen, gemeinsam an Artikeln zu arbeiten oder eine Fototour durch Köln und insbesondere Ehrenfeld zu unternehmen. Die Ergebnisse wurden natürlich direkt im Wiki festgehalten. Dass es bei diesem ersten Workshop-Wochenende nicht bleiben wird, ist für alle Beteiligte sicher. Der C4 stellt auch zukünftig seinen Clubraum für kooperative Veranstaltungen gerne zur Verfügung. by Pylon 2006-04-11T23:42+02:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
