title = "c4 | Archiv"
description = "Eine Sammlung unserer bisherigen TÃ¤tigkeiten"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum Abgeschlossene Projekte CCC-Köln Artikel 2002-09-13 Texte, Artikel und Wissensschnipsel des C4 more Datenschleuder 2002-09-18 Beiträge der Kölner Chaos Information Agency (CIA) more Sicherheitshinweise 2002-09-13 Lektionen in Computersicherheit more fnordlicht - illuminating the world 2005-04-23 Erfahrungsbericht eines Datenreisenden auf der Suche nach der ultimativen Beleuchtung. more portscanning is not a crime 2002-11-03 Manche Menschen glauben, dass ein Portscan eine kriminelle Angelegenheit ist. Wir von Chaos Computer Club meinen aber, dass Portscanning im Internet-Alltag eine ganz normale und hilfreiche Angelegenheit ist more spammer-forensics 2004-01-14 Das schnucki-Projekt beschreibt einen Weg herauszufinden, wie mailadressen aus Webseiten in die Listen der Spammer gelangen und ob Verfremdungen der mailadresse geeignet sind, Spamrobots zu verwirren. more Projekt u23 (2007) 2007-04-03 Ein spannendes Projekt für junge Leute bis 23 more geekend schloss heiligenhoven (2006) 2006-01-25 gekeend 2005 auf schloss heiligenhoven more Projekt U23 (2006) - "on hacking well" 2006-07-23 Ein spannendes Projekt für junge Hacker und Haecksen. more Projekt u23 (2005) 2005-09-07 Ein spannendes Projekt für junge Hacker und Haecksen. more CCCeBIT 2005 2005-03-15 CCCeBit 2005: Biometrische Merkmale in Ausweisdokumenten: sinnlos, gefährlich, teuer more CCCeBIT 2004 2004-03-15 CCCeBIT 2004: Keine Totalüberwachung des Autobahnverkehrs! more CCCeBIT 2003 2003-03-13 CCCeBIT 2003: TCPA - Whom do we have to trust today? more projekt u23 (2003) 2004-01-08 projekt u23 (2003) more ClubVAX HOWTO 2002-10-24 Im September 2002 haben im C4 viele VAXStations Einzug gehalten. Woher die kommen, wie man sie bedient und was man damit alles machen kann erfährst du auf dieser Seite. Aber wie bekommt man dieses wunderschöne Stück Hardware ans Laufen? Ein Erfahrungsbericht vom Marsch durch unbekanntes Gebiet. more Internet-Zensur in NRW 2003-05-26 (rev) Nordrhein-Westfalens Regierung sperrt den Zugriff auf Webseiten more CCCeBIT 2002 2002-09-13 CCCeBIT 2002 more projekt u23 (2002) 2003-01-27 Dokumentation des Projektes u23 (2002) more CCCeBIT 2001 2002-09-13 CCCeBIT 2001 more HAL 2001 - Hacking At Large 2002-09-13 Internationales Hackertreffen 2001 in Eschede, Holland more chaos communication camp 1999 2002-09-18 Im August 1999 veranstaltete der CCC ein dreitägiges OpenAir-Hackertreffen Der C4 betrieb einen UKW-Sender und produzierte 100 Stunden Programm. more guerilla.net 2002-09-28 Daten durch die Luft: guerilla.net more distributed portscanning 2002-11-10 Oder: Netzweite Suche nach offenen Datenkanaelen, jenseits von Port 80 more Chaos Circuit Television 2002-09-12 Der Kölner CCC und andere Gruppen der Chaos-Familiy haben sich mit der zunehmenden Überwachung öffentlichen Raumes durch VideoÜberwachung und deren Auswertung beschäftigt. Es ist eine Datenbank entstanden, deren Ergebnisse hier dokumentiert sind more hackschiff 2000 2002-09-13 Hacken auf dem Schiff: Mit einem Ausflugschiff fuhren wir am 4. August 2000 ab Bonn auf dem Rhein, von 18:00 Uhr bis 3:00 Uhr morgens. Mit einer netten, knackigen Veranstaltung haben wir Interessenten an einer Hackerveranstaltung zur See einen Sommertreffpunkt geboten more Brainfuck 2002-09-07 Brainfuck ist eine extrem einfach zu lernende und extrem nervtoetend zu nutzende Sprache, schaetzungsweise aus dem Jahre 1993. Die Sprache kennt zwei mathematische Funktionen (+ und -), Funktionen zum Einlesen und Ausgeben von Zeichen (, und .), die Moeglichkeit, eine Speicherstelle vorwaerts bzw. rueckwaerts zu gehen (> und <), sowie ein spezielles Schleifenkonstrukt ([]). Aus diesen Funktionen besteht der gesamte Sprachumfang von Brainfuck. more c4 - Chaos Curriculum Cologne 2002-09-08 Das Chaos Curriculum Cologne war eine Vortragsreihe in grossem Rahmen, die wir 1988 in Zusammenarbeit mit dem Komed durchgeführt haben. In drei Ve