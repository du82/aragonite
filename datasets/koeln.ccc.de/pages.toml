["https://koeln.ccc.de/ablage/geekend/index.html"]
title = "c4 | geekend schloss heiligenhoven (2006)"
description = "gekeend 2005 auf schloss heiligenhoven"
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum geekend schloss heiligenhoven (2006) gekeend 2005 auf schloss heiligenhoven c4 geekend das geekend auf schloss heiligenhoven ist eine veranstaltung für mitglieder des CCC Cologne und Teilnehmer der vergangen u23-Projekte. die teilnehmerzahl ist limitiert auf 35. location die unterbringung erfolgt in der jugendherberge von schloss heiligenhoven. zusätzlich haben wir im schloss den grossen saal angemietet. program wir werden einige workshops anbieten. bis jetzt sind geplant: etwas mit vaxen (phlay) einführung in erlnag (fukami) esperanto (pallas) lego-roboter bauen (N.N.) fnordlicht hardware (fd0) fnordlicht software "guided walkthrough" (fd0) kollektivgüter und enabling technologies (MM) es wird nur internes netz geben, kein internet. /usr/bin/date wochenende vom 17. bis 19. märz 2006 anreise ab freitag 17 uhr möglich. das wochenende endet am sonntag um etwa 15 uhr nach dem gemeinsamen hausputz. ~/.registry die anmeldung erfolgt durch überweisung des teilnahmebeitrages von 40 EUR (Achtung: Änderung gegenüber dem Vorjahr) auf das konto des CCC Cologne (oder Barzahlung bei cefalon) sowie einer anmeldung via webinterface (es gelten die bekannten default-passwörter). Anmeldestand 13. Februar 2006: 28 Anmeldungen . /root veranstalter ist der Chaos Computer Club Cologne contact fragen zum geekend bitte direkt an cefalon (at) koeln.ccc.de by cefalon 2006-01-25 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content c4 geekend location program /usr/bin/date ~/.registry /root contact Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
