["https://koeln.ccc.de/updates/2007-03-17_FreeWRT.html"]
title = "c4 | OpenChaos am 29. März: FreeWRT als Firmware für WLAN Router / VoIP mit Embedded Systemen"
description = """
Shorty und wbx stellen FreeWRT, eine Linux-Distribution für embedded-Devices, und einige Anwendungen
wie ein Asterisk auf einer solchen Platform vor."""
full_description = '''Chaos Computer Club Cologne e.V. CCC Cologne C4 Archiv Sitemap FAQ u23 Media Impressum OpenChaos am 29. März: FreeWRT als Firmware für WLAN Router / VoIP mit Embedded Systemen Shorty und wbx stellen FreeWRT, eine Linux-Distribution für embedded-Devices, und einige Anwendungen wie ein Asterisk auf einer solchen Platform vor. Auf vielen DSL/WLAN Routern, die man im Fachhandel kaufen kann (z.B. Linksys Router, Netgear WGT634U), läuft ein Linux. Leider liegt es nicht im Interesse der Hersteller dem Endkunden Zugriff auf das System zu geben, damit bleiben die vielfältigen Möglichkeiten die Linux bietet weitgehend ungenutzt. Das FreeWRT Projekt hat sich der Problematik angenommen und eine freie auf Linux basierende Firmware für verschiedene Router und embedded Plattformen entwickelt. Die FreeWRT-Firmware lässt sich sehr leicht installieren und gibt einem volle Kontrolle über das Gerät und die darin vorhandene Hardware wie z.B. der eingebauten WLAN Karte. Zugang per SSH gehören genauso zum Distributionsumfang wie ein Paketemanagementsystem. Dem Benutzer stehen etwa 300 Pakete zur Auswahl wie z.B. Webserver, Proxyserver, VPN Clients und Server, Samba, Anbindung von USB Festplatten und VoIP. Als beispielhafte Anwendung für ein embedded System wird in diesem Vortrag eine Asterisk Telefonanlage vorgestellt die auf einem embedded System läuft und alle Funktionen mitbringt, die man sich von einer vollwertigen VoIP Telefonanlage wünscht. Der Vortrag findet am Donnerstag, 29. März statt und beginnt um 20:00 Uhr in den Räumlichkeiten des C4. by fd0 2007-03-17T13:06+01:00 // <style> .club-status { display:none; } </style> Der Clubstatus wird geladen... Der Club ist offen: It's a secret to everybody. Der Club ist geschlossen: [...] even the word "hopeless" has "hope" in it. Plus, if you rearrange the letters it spells "peeslosh". Der Clubstatus konnte nicht geladen werden. Search content Kontakt Direkter Draht: mail@koeln.ccc.de irc: #cccc auf hackint (web) matrix: #cccc:hackint.org (Bei Anfragen bitte ERST das F.A.Q. lesen.) Datenschutz / Privacy Policy Mastodon Newsletter Oder immer up-to-date mit unserem Newsletter. Zur Newsletter-Anmeldung'''
