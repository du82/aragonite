title = "януари | 2009 | Специалист по всичко"
description = "Молим, членския внос!"
full_description = "Заверка на осигурителна книжка 4 коментара В последните две години не съм работил някъде постоянно. Нямам трудов договор. За проектите по които съм работил съм сключвал граждански договори. Това обаче се оказа, че никак не е достатъчно. Ако доживея до пенсионната възраст вноските удържани по тези договори няма с нищо да ми помогнат, не се зачита и трудов стаж, освен ако нямам един вълшебен тефтер – осигурителната книжка. Как да се сдобиете с такава ли? Отивате в местния клон на НОИ с един от гражданските ви договори и казвате, че искате да ви издадат осигурителна книжка (ОК). Плащате скромна сума и след няколко дни отивате да си я вземете. После обикаляте всички работодатели с които сте сключвали договори. Те попълват съответните данни в книжката и слагат един куп печати за да удостоверят, че наистина сте работили за тях. След това се връщате в НОИ и оставяте книжката за заверка. Към нея прилагате копия на всички граждански договори и служебни бележки за направени вноски. Служител проверява всичката информация дали е вярна, и дали съвпада с тази която е в „базата“ на НОИ. Ако всичко е наред той на свой ред слага поредното количество печати. Накрая почти нищо не може да се различи от хилядите печати един върху друг. Прибирате си заверената книжка и я пазите като една от най-ценните ви вещи. Горният сценарий беше за идеалният случай. Е, моят не беше идеален. Известно време след подаването на книжката за заверка ми се обади служител на НОИ и каза, че иска да се видим. Отидох при него и той ми обясни, че фирмите Х и Y за които съм работил през 200Z година „не са подали данни“ и не може да ми завери книжката. Той им пратил писма, ама едното го върнали, пък другото било доставено, ама пак нямало данни. Ако мога да съдействам. Съгласявам се. Обаждам се по телефона на фирма Х, казват че са получили писмото, но счетоводителката е в отпуска, другата седмица ще подадат данни. Другата фирма е на нов адрес. По-случайност на другия ден щях да се видя с човек от фирмата и взех копие от писмото, което да предам лично. След време пак ми се обаждат по телфона – ама сега фирма Х била подала данните два пъти, пък Y, още не ги били подали. Да им кажа, какъв е новият адрес, от НОИ няма как да разберат! Вече не ми се занимава и не съдействам кой знае колко. Междувременно се запознавам с документа ОТНОСНО: уеднаквяване на практиката при заверяването на осигурителните книжки. Към края има следния текст: =========== ІІІ. Заверяване на осигурителни книжки . . . При липса на подадени данни с декларация образец № 1 “Данни за осигуреното лице” от страна на осигурителите не следва да се отказва заверяване на осигурителните книжки. Заверяването се извършва въз основа на представените от лицата доказателства за получените от тях възнаграждения. На осигурителите се дават задължителни предписания за подаване на данните, налагат се административни наказания, при необходимост се сигнализират и органите на НАП. ========== Разпечатвам въпросния документ и днес пак отивам в НОИ. Oт деня в който подадох книжката за заверка са изминали три месеца. Срещам се със служителя и той ме посреща с репликата „Ти хубаво идваш, ама още няма данни“. Обяснявам, че съм представил абсолютно всички документи – договори, вносни бележки. Вадя безценната разпечатка, прочитам на глас текста цитиран по-горе, и заявявам, че очаквам книжката ми да бъде заверена. Сега, въпреки че ги няма подадени данните. Господинът никак не е доволен и казва, че няма как да ми завери книжката. Пита ме знам ли аз, каква отговорност е това, особенно като ги няма данните. Осведомява ме, че ако не съм съгласен мога да подам жалба. Аз отговарям, че ако трябва ще подам. Той излиза от стаята за малко и след като се върна удари заветните печати. Ура! Сега стискайте ми палци да доживея до 65 или колкото там трябва. Цялата тази работа за мен е необяснима. Защо е необходима тази осигурителна книжка? Всичката информация трябва вече да я има в цифров вид. Как иначе са ми удържали коректно данъците? Хвърлят се купища пари за информационни системи на държавната админинистрация. Да, една част направо се хвърлят за софтуер от една определена компания. И накрая какво – пак в тефтера е истината! Ами в такъв случай да спестим парите за компютри поне и да си караме само на хартия. От личен опит мога да ви кажа, че е напълно възможно в НОИ, НАП и където и да е в държавата да няма абсолютно никаква информация за това, че сте работил в дадена фирма, дори за години след 2000-ната. Аз го разбрах миналата година, когато НАП се опитаха да ми приберат „дължими“ осигуровки, с лихвите, 7 години по-късно! Но това определено заслужава отделна статия, която ме домързя да напиша по време на случката. Не беше само мързел де, има и друга причина. Тук ми се искаше да пиша повече за технически неща – софтуер, електроника. Не ми се щеше да занимавам читателите (колкото и малко да са те) с моите премеждия с държавата. Струва ми се обаче, че е важно да се споделят и историите с КАТ, НАП, НОИ. Най-малкото може да са полезни на някой друг. По-важното е, че повечето от тях са ако не с идеален, то поне с положителен край. Показват, че ако хвърлиш известно количество време и усилия е възможно нещата да станат както трябва, или поне почти както трябва. Че можеш да се бориш за правата си, че положението не е съвсем безнадеждно. От друга страна, ако взема да пиша само такива истории, пак няма да съм много доволен. Затова си въвеждам следното правило: мога да пиша за такива неща, но след всяка „бюрократична“ история трябва да има поне една техническа тема. Да се надяваме, че с времето техническите публикации ще станат много, много повече от „бюрократичните“! Публикувано в Бюрокрация и отбелязано с bureaucracy, NOI, social insurance, Всичко на януари 21, 2009 от rado."
