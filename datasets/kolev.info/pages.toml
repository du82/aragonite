["http://kolev.info/blog/2008/04"]
title = "април | 2008 | Специалист по всичко"
description = "Всестранност и ракетна бързина!"
full_description = "Всяко хлапе знае за Линукс 2 коментара Вчера гледах част от предаването „Това го знае всяко хлапе“ по BTV. За моя изненада на участичката зададоха следния въпрос: „Кое животно е знак на операционната система Линукс?“ (може и да не бяха точно тези думи, цитирам по памет). Споменаването на Линукс по телевизията може само да ме радва, защото това означава, че свободният софтуер е все по-популярен. За съжаление обаче организаторите на предаването не си бяха свършили работата както трябва и според мен въпросът е формулиран некоректно. Линукс е само ядро, един от компонентите на операционна система. Освен ядрото за да имаме функционираща операционна система ни трябват много библиотеки, обвивка, иснтрументи и помощни програми, а вече хората очакват и графична среда. Ричард Столман предлага тази съвкупност от програми да се нарича ГНУ/Линукс, тъй като голяма част тях са разработени от проекта ГНУ. Освен това има много ГНУ/Линукс операционни системи, или различни набори от компоненти, които наричаме дистрибуции. Често в ежедневната реч много от нас използват просто думата Линукс, но обикновено от контекста се разбира дали става въпрос за ядрото или за някоя от ГНУ/Линукс дистрибуциите. Когато е възможно двусмислие обаче, смятам че винаги трябва да се поясни какво точно се има предвид. Горният случай е точно такъв. Според мен по-добре би било да се каже „Кое живото е знакът на Линукс?“, за да не се затормозяват хората незапознати с термина ядро. Употребата на пълен член „операционната система Линукс“ е логически неправилно, тъй като нямо точно една Линукс операционна система, а много ГНУ/Линукс дистрибуции. Всичко това може да ви се струва излишно мрънкане, но както се оказа от тези детайли зависи дали отговорът който сте дали ще се приеме за верен. Във вчерашния случай девойката отговори, че животното е гущер, тъй като очевидно тя е потребител на дистрибуцията Сусе. Водещите и сценаристите обаче се оказаха доста незапознати с темата и обявиха отговорът и за грешен. Верният отговор според тях е пингвин. Скъпи сценаристи на предаването, или който там от екипа подготвя въпросите: на така зададеният въпрос има повече от един верен отговор! Освен Тукс пингвина талисман на Линукс ядрото, и Гийко гущера за които вече споменахме ще се учудите колко още представители на животинския свят ползват ГНУ/Линукс. Та само във Федора проекта има цяла зоологическа градина, дори някои видове за пръв път са били открити там! Ето и списък, който не претендира за изчерпателност*: Лари кравата (Gentoo) Жребецът (Stampede Linux) Пъпи чихуахуато(Puppy Linux) френския таралеж (Hedginux) рибата клоун (Clownix) Боб туканът (Tukaani) риба-християнин (ICHTHUX) * извадил съм жвотните свързани с дистрибуции от http://chl.be/mascots/ Публикувано в Всичко, Софтуер и отбелязано с btv, fun, kids, linux, mascots, Всичко на април 17, 2008 от rado."
