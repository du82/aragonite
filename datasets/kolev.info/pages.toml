["http://kolev.info/blog/2015/03"]
title = "март | 2015 | Специалист по всичко"
description = "Спиро Киров - политехник"
full_description = "Енергийна ефективност, част 1 – ЕНЕРГИЯ, РАБОТА, МОЩНОСТ 1 отговор В предишната ми публикация споменах, че ми се иска да обърна повече внимание на темата за енергийната ефективност. За да можем да си говорим на тази тема е необходимо да разбираме някои основни понятия. Естествено, на първо място това е понятието за енергия. За съжаление напоследък в ежедневния език думата ‘енергия’ се използва най-често в изказа на разни шарлатани, парапсихолози и други подобни. Затова искам изрично да уточня, че тук ще става въпрос само и единствено за физичната величина. Вътрешната енергията на една затворена1 система е показател за способността ѝ да извърши работа. При извършването на работа определено количество енергия се прехвърля от нея в системата върху която се извършва работата. Тук под „извършване на работа“ отново имаме предвид само и единствено понятието от физиката, а не седенето по цял ден пред компютъра в офиса :). Например, ако вие бутнете количката с продуктите в супермаркета и тя се задвижи, то вие сте извършили механична работа (преместване на тяло, под действие на сила) върху количката. В резултата енергията на количката се е увеличила, а вашата е намаляла. Мерната единица за енергия и работа (тъй като работата се изразява в обмен на енергия) в системата SI e джаулът. 1 J е работата, извършена от сила 1 N при преместване на тяло на разстояние 1 m по направление на силата или пък под действието на мощност от 1 W в продължение на 1 s. Освен в джаули енергията може да бъде измерване в kWh (киловатчасове), калории, BTU (британски термални единици) и др. Различните мерни единици се ползват за удобство или по традиция в различни ситуации. 1 калория например е енергията необходима за повишаване на температурата на 1 грам вода с 1 градус Целзий и е равна на около (има доста видове калории!) 4.2 джаула. Киловатчасът е доста по-голяма единица и е равен на 3.6 мегаджаула (MJ) или 3 600 000 джаула и се ползва за измерване на потребената електрическа енергия. Британската термална единица е равна на 1055 джаула и все още се използва често при климатичните системи. Преобразуването от една мерна единица в друга става лесно чрез умножаването с подходящия коефициент. За извършването на дадено количество работа е необходимо определено количество енергия. В много случаи обаче е важно не само дадена работа да бъде свършена, а това да стане бързо. Величината мощност показва скоростта на извършване на работа, или също така консумираната енергия за единица реме. Мощността се измерва във ватове (W), като един ват отговаря на един джаул за една секунда. Други популярни мерни единици за мощност са конската сила (равна на около 0.75kW) и BTU/h2 (британска термална единица на час). Ако например бутате количката с покупки от предния пример, зяпайки витрините, ще изминете разстоянието до касите за 10 минути. Ако обаче закъснявате за работа и се позабързате ще изминете същото разстояние за 1 минута. И в двата случая ще извърщите едно и също количество работа, но във втория ще работите с 10 пъти по-голяма мощност! Поздравления за търпението да прочетете всичко до тук! Знам, че за много хора горните редове са безинтересни и скучни, и само им напонмят за часовете по физика в 7-ми клас. Ако искате обаче да знаете защо имате големи разходи за електричество или отопление и най-вече как да ги намалите, ви гарантирам, че времето прекарано в малко самообучение по темата ще ви се изплати многократно. Очаквайте скоро „Енергийна ефективност, част 2: ТЕМПЕРАТУРА, ТОПЛИННА ЕНЕРГИЯ, ТОПЛИНА“ Повече информация за видовете термодинамични системи може да намерите в Уикипедия. Погледнете също статията за понятието енергия, която е може би доста по-добра от моите писания тук. ↩ Когато чуете някой да казва, че си е монтирал климатик ‘шеснайска’, това означава, че топлинната мощност на климатичната система е 16000 BTU/h или около 4.7kW ↩ Публикувано в Енергийна ефективност на март 26, 2015 от rado."
