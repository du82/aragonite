description = "Абе аз що не седна, ами седя прав?"
full_description = "Тайния живот на машините Вашият отговор Честно казано, за мен е неразбирамо защо на повечето хора не им е любопитно и интересно как работят машините. Аз бих искал да знам, и се опитвам да разбера, как работи всяко нещо около мен. Сега сме заобиколени от толкова много машини, които правят живота ни по-лесен, че само изучавайки тези у дома човек може да си осигури безкрайно забавление. Това е една от причините да харесвам всякакъв вид свободен хардуер и софтуер, защото потребителят има възможността и дори е подканен да погледне „под капака“. Ползата от това, освен задоволяване на любопитството е, че и в такъв случай ще можете сами да ремонтирате или дори подобрите машината. Преди години гледах Дискавъри. За съжаление в последно време много от предаванията са се изродили в някакъв вид „риалити шоута“. Вместо истинска информация как работи или се прави нещо получаваш викания, интриги и друг вид драма, която явно се продава по-добре. Предвид това, когато попаднах на поредицата „Тайния живот на машините“ бях много приятно изненадан. Автор и водещ е англичанинът Тим Хънкин. Смея да твърдя, че знаех как работят повечето от представените машини. Въпреки това изгледах серийките на един дъх и ми бяха много интересни. В тях няма просто сухи факти, а съвсем достъпно е показано не само как работят различните машини, но и историята на тяхното изобретяване и развитие през годините. Всичко това е гарнирано с малко хумор и впечатляваща арт инсталация в края на всеки епизод. Най-хубавото е, че със съгласието на Тим можете да свалите всички епизоди от тук. Приятно гледане! Публикувано в Всичко и отбелязано с Всичко на септември 11, 2012 от rado."
year_published = 2012
