title = "Мини масичка за лаптоп от чам | Специалист по всичко"
description = "Чекай да поправим машината, че нещо не ра̀боти."
full_description = "Мини масичка за лаптоп от чам Вашият отговор Използвани материали: Плот – парчета ламперия от отвора за капандура, който изрязах в навеса на верандата, за по-лесен достъп до покрива. Крака – летви останали от закърпването на покрива над антрето. Широки летви за укрепване на краката – останали от опаковката на климатика. Слепих парчетата ламперия в плот, на който скосих ръбовете на 45 градуса. Другите части бяха сглобени по доста мързлив начин. Намазах допиращите се повърхности с лепило и след това ги прихванах с пирони/кламери с пневматичния такер. След като изсъхна лепилото се получи изключително лека, но доста здрава и стабилна конструкция. Дори може спокойно да се ползва и като табуретка/столче от някой като мен (към 60 кг). В крайна сметка съм доволен от резултата. Размерът на масичката пасва точно на този на лаптопа, събира се в малките пространства между леглото и стената, а и най-вече защото се ползва постоянно. Публикувано в Дърводелство, Рециклиране на март 1, 2015 от rado."
