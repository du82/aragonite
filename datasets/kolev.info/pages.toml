title = "юли | 2009 | Специалист по всичко"
description = "Като не знаеш да ходиш по софийските улици - иди си на село."
full_description = "Край със SMS спама Вашият отговор Преди време смених мобилния оператор който ползвам. Основната причина беше, че Глобул ми пращаха SMS спам. То не бяха печалба на Мерцедеси, телефони, игри – по няколко пъти на ден. Всякакви разговори с представители на фирмата завършваха еднакво – няма начин да се откажеш от тези съобщения – ако си клиент, получаваш! За Мтел знам, че също разпращат, та там не съм и питал. Във Вивател малко се зачудиха на въпроси ми ако се абонирам при тях ще получавам ли спам съобщения. В крайна сметка обещаха, че дори и да се случи ще е много рядко. Та прехвърлих си аз номера към Вивател и до сега да си призная съм доволен клиент. Няма спам, цените са доста добри и като цяло услугата е ОК. Е и те имат някаква хипер необяснима политика на ценообразуване. Примерно за една и съща услуга ако собственик на телефона е юридическо лице цената е чуствително по-ниска, отколкото за физическо. И не, не трябва да има поне 5 абоната на някакъв фирмен план или нещо подобно. Може да е един единствен телефон – ако си фирма, плащаш по-малко. И така до вчера когато получих следното (преведено на кирилица от мен, да не ви мъча): Спечели още днес една страхотна 42″ плазма! Включи се в играта … Тъкмо да се появят в главата ми разни не много приятни мисли и пожелания по адрес на Вивател и „пийп-пийп“ втори SMS: Ако не искаш са получаваш SMS за услуги на БТК, изпрати празен SMS на 188188 – цена 0лв. Малко цъкане по клавиатурата на телфона и на екрана ми вече пише: Здравей! Повече няма да получаваш SMS от Вивател за наши предстоящи игри и забавления. Можело значи! Дано и другите оператори да се усетят, че когато един техен клиент си плаща сметката, то е защото иска да ползва дадена услуга, а не да чете глупав спам за печалби на Мерцедес, VW Поло или каквото е там. Публикувано в Всичко и отбелязано с gsm sms spam vivatel globul, Всичко на юли 31, 2009 от rado."
