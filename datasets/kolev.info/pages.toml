title = "януари | 2011 | Специалист по всичко"
description = "Никакъв идеализъм - само грубо придържане към материалния фактор."
full_description = 'Краен резултат: Глобул глобени с 500 лв. Вашият отговор Поредно и надявам се последно развитие на сагата с Глобул. Част 1 и част 2 се случиха преди повече от година – явно толкова трябва за да се задвижи бюрократично-съдебната машина. Служители от КРС ми се обадиха по телефона и обясниха, че във връзка с моя случай са наложили санкция на Глобул. Те от своя страна я обжалват в съда, та ако мога да отида на делото като свидетел. Съгласих се. Общо взето, ако питате тях, Глобул са по-невинни от Дева Мария и това за което ги санкционират – ама хич изобщо не се е случвало. В офиса в Кърджали имало една единствена служителка, която не знаела каква е процедурата и аз точно на нея съм попаднал. Пък след това, като съм се оплакал, те веднага разрешили проблема. Аз разказах как са протекли нещата от моята гледна точка – че съм говорил с абсолютно всички служители в офиса, и с оператори в кол центъра. Всички те са потвърдили, че това е фирмената политика, наложена "отгоре", а не случайна грешка. От решението на съда можете да видите, че намалят наложената глоба от 1500 на 500 лв. Аз не съм много наясно с правната материя и сигурно си има причина за това, но за мен ефективността на подобни санкции е крайно съмнителна. Дори и сумата от 1500 лв за копрорация с подобен размер е смешно малка и надали ще предизвика някаква промяна в поведението. Отделно покрай целия случай колко надници на служителите от КРС сме платили данъкоплатците, плюс 2-3 командировки до Кърджали, сигурно надвишават наложената глоба. В крайна сметка не съжалявам, че отделих време и усулия за да доведа нещата докрай. Освен това, този опит по нищо не отстъпва на детските "Приказки с поуки" и за мен поне ясно се очертават две: 1. Ако някога ми наложат санкция за нещо в размер по-голям от минималния указан в закона – ще я обжалвам. Имайки предвид, че нямам предишни провинения вероятността съдът да я намали до законовия минимум е голяма. 2. От подобни действия би могло да има и реален резултат. За целта трябва всички или поне повечето потърпевши от нарушения да отделят време и усилия да сигнализират компетентния орган и да се уверят, че той си е свършил работата. Публикувано в Бюрокрация и отбелязано с Всичко, глоба, Глобул, КРС, преносимост, съд на януари 26, 2011 от rado.'
