title = "февруари | 2013 | Специалист по всичко"
description = "Утре в 8 часа се явете в отдел фино боядисване!"
full_description = "Развитие по случая с недостъпна среда Вашият отговор Във връзка с предишните две публикации (1, 2) има малко развитие. Получихме отговори от областната управа и общината. Прилагам ги тук, но с две думи – интересуват се от проблема и препращат копие към компетентния орган. Благодарим за указаната подкрепа! По-важното е, че като минавах от там завчера направо не можах да повярвам на очите си. Имаше сигурно 10 работника, които изкъртиха знаците от средата на тротоара и ги преместиха в градинката встрани или по-близо до пътя. Преди: След: Преди: След: Чакаме и скосяването на бордюрите! Публикувано в Бюрокрация на февруари 1, 2013 от rado."
