title = "октомври | 2009 | Специалист по всичко"
description = "СофГрКомбитус"
full_description = "Глобул вече изискват да представиш договор, за да издадат удостоверение за преносимост 1 отговор Ако отидете в офис на Глобул и поискате да подадете заявление за издаване на удостоверение за преносимост на мобилен номер, то най-вероятно няма да успеете. Ще ви обяснят, че за да се случи това трябва да намерите своето копие от договора, който сте сключили и да го донесете и представите на място в техния офис, за да можели да го сканират! Нямам коментар просто за това отношение към клиентите, пък били те и такива, които искат да се откажат от услугите им. Аз преди време се отказах от един телефон при тях, заради SMS спама. Сега се опитвам да прехвърля още един номер. Въпреки това в момента Глобул имат приемливи за мен оферти за предплатен мобилен интернет, но познайте дали ще се възползвам от тях след днешната случка. Ето моята жалба до КРС: ДО Д­Р ВЕСЕЛИН БОЖКОВ ПРЕДСЕДАТЕЛ НА КОМИСИЯТА ЗА РЕГУЛИРАНЕ НА СЪОБЩЕНИЯТА Ж А Л Б А от Радослав Кирилов Колев Относно издаване на удостоверение за преносимост на мобилен номер Днес (15/10/2009) отидох в офиса на Глобул в гр. Кърджали намиращ се на бул. „Тракия“ 1. Подадох едномесечно предизвестие за това, че не желая да бъде подновяван договорът за мобилни услуги които ползвам. След това поисках и да подам заявление за издаване на удостоверение за преносимост, с което да прехвърля ползваният от мен мобилен номер към друг оператор. Казах, че съм готов да платя всички задължения за ползвани до момента услуги и неустойки в случай, че има такива. Беше ми отказано да подам такова заявление, с мотива, че за да подам заявление трябва да представя на място моят екземпляр от договорът, който съм подписал с Глобул за ползването на въпорсният номер. Аз преди време подадох такова заявление без да представям договора и успешно прехвърлих друг номер, който ползвах от Глобул към друг оператор. На въпросът ми какво е предизвикало изведнъж нуждата да представя договор ми беше отговорено, че това е вътрешно разпореждане от скоро и ако имам въпроси мога да се обадя на оператор на тел. 123. Попитах къде е посочено писмено това изискване, но не получих точен отговор, а че го има някъде на сайта. Обадих се на тел. 123 и обясних ситуацията на оператора. От там потвърдиха за въпросното вътрешно разпореждане да не се приемат заявления за издаване на удостоверения за преносимост, ако клиента не носи със себе си и не представи на място договорът подписан с Глобул. Отново попитах къде точно в текста на Общите условия е посочено въпросното изикване, тъй като и след внимателен прочит на 17­те страници аз не можах да го открия. След изчакване от около 10­-15 минути операторката ми отговори, че се е консултирала с двама колеги и никъде не е записано това изискване, но има вътрешно разпореждане и единственият начин да подам заявление е като представя договорът. Тъй като не успях да открия причина, поради която да съм задължен да представя договорът в момента на подаване на заявлението за издаване на удостоверение за преносимост се върнах в офиса на бул. „Тракия“ 1 и отново изисках да подам въпросното заявление. Пак ми отговориха, че без договорът не може. Аз настоях, че все пак става въпрос за заявление, и аз имам право и държа да заявя това мое желание, а те своето право да ми откажат издаването на удостоверението. Отговорът беше, че е невъзможно да се подаде заявлението, защото така е направена компютърната система и без сканиране на договорът няма как да се образува подобен тип заявка. Поисках хартиена бланка за заявлението, като тази, която попълних при пренасянето на предишния номер. Отговориха ми, че нямат вече хартиени бланки, а всичко става само чрез компютърната система. Все пак, аз написах заявление в свободен текст (вероятно неотговарящо на всички изисквания от процедурата за преносимост на номерата) и поисках да заведат този документ. Отговориха ми, че в момента не могат да ми издадат входящ номер, защото това става централно в София, но ще ме уведомят по телефона, когато има такъв. Това е описанието на ситуацията до момента. В документа „Процедура за преносимост на мобилни номера“, част втора „Стартиране на процедурата по пренасяне на номерата. Заявление за пренасяне на номера/та“ точка 12 съдържа следния текст: „При подаване на заявлението за пренасяне на Номер/а абонатът представя за проверка документи, съгласно Общите условия за взаимоотношения с крайните потребители на Донора. Изискванията не следва да създават необосновани затруднения при пренасяне на номера за потребителите от домейна на преносимост на мобилни номера.“ Смятам, че действията на Глобул са в нарушение на процедурата, защото никъде в Общите условия не е упомената изискването за представяне на договора, а дори и да имаше такава клауза, то за мен това е едно необосновано затруднение. Моля за вашето становище по въпроса, и в случай че смятате жалбата ми за основателна да предприемете действия за отстраняване на нарушенията. Гр. Кърджали 15.10.2009 г. С уважение: Радослав Колев Публикувано в Бюрокрация и отбелязано с Всичко на октомври 16, 2009 от rado."
