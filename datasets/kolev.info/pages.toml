title = "Изрязване на дупка в навес (за програмисти) | Специалист по всичко"
description = "Дупки пробиваме всякакви!"
full_description = "Изрязване на дупка в навес (за програмисти) 11 коментара Тази година на FOSDEM посетих много впечатляваща лекция за FreeCAD и от тогава си търсех някакво оправдание малко да го разцъкам. Аз живея в малка къща с много приятна веранда на югоизточната стена, със страхотен изглед към целия град. Единственият ѝ кусур е, че навесът над нея почти изцяло засенчва прозорците на тези стена. Реших, че искам да изрежа отвор в навеса и в него да заменя керемидите с нещо прозрачно, така че слънчевите лъчи да могат да проникват през прозорците. Целта ми е да се възползвам максимално от слънчевата радиация за отопление през периода от 1-ви октомври до 30-ти април, като евентуално засенчването остане за останалата част на годината. Тази сметка по принцип може да се направи лесно (има и много уеб калкулатори) ако стената е ориентирана точно на юг, но при мен ориентацията е по-скоро югозапад. Трябва да призная, че ми отне известно време докато успея да начертая нещата във FreeCad. Кривата на учене определено е леко стръмна, особено за такъв като мен, който няма опит с никаква друга CAD система (ако изключим разни за електронни схеми и платки). Все още много от концепциите са ми мътни и вероятно ще отнеме доста време докато нещата започнат да се проясняват. В крайна сметка, след няколко итерации на четене, проби и грешки успях да направи прост схематичен 3Д модел на стената, прозорците и навеса. Използвах Sketcher модула за да начертая стената и прозорците в равнината YZ и им добавих ограничение (constraints), за да ги позиционирам и оразмеря в мащаб с реалността. После в равнината XZ начетах една наклонена линия, която екструдирах по оста Y, за да направя повърхността на навеса. Не знам дали това е най-добрият и „правилен“ начин да се направят нещата, но аз това можах да измисля. Една от най-яките възможности на FreeCAD e, че всичко може да се скриптира на Питон. Използвах библиотеката PySolar за да изчисля точната позиция на слънцето в небосклона през интервали от 5 минути за датите 1-ви октомври, 30-ти април и 21-ви декември за локацията на моята къща. След това, със съвсем малко свързващ код начертах линии започващи от горния ляв ъгъл на единия от прозорците в посока слънцето. Жълтите линии са за април, сините за октомври, а червените за 21-ви декември (когато слънцето е най-ниско). Тази визуализация потвърди по доста по-точен и сигурен метод това, което предполагах (базирано на клонящите ми към нула познания по астрономия и емпирични наблюдения на движението на слънцето, проведени на верандата, с бира в ръка). Ако искам да се възползвам от максималната възможна слънчева радиация за отопление през прозорците ще трябва да направя целия навес прозрачен. Питонския ми код е много кратък и с твърдо зададени стойности на координати и положения на прозорците, та надали би бил полезен на някой друг. Все пак, този малък експеримент ме кара да смятам, че FreeCAD би бил една много добра основа за свободна платформа за енергиен анализ на сгради. Не става въпрос само за засенчването – може примерно директно да се смята добивът в kWh на енергия от даден прозорец, загубите през стени, под, таван, вентилация и т.н. Ако вече сте грабнали теслите и трионите и сте се насочили към разрушаването на вашия собствен навес – спрете! Преди това трябва да имате много добра изолация на стените, тавана, пода, дограмите и чак тогава евентуално да помислите за добавянето на някой и друг ват час от слънцето през прозорците. По принцип темета за енергийната ефективност ми е много интересна и се надявам скоро да започна да пиша малко по-систематизирано по нея. Всякакви предложения с какъв прозрачен материал и начин на монтаж може да бъдат заменени керемидите и дървенета ламперия са добре дошли в коментарите – поликарбонат, закалено стъкло, триплекс? Публикувано в Енергийна ефективност на март 16, 2015 от rado."
