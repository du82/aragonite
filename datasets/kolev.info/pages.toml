title = "Ремонт на дървен шкаф – част 1 | Специалист по всичко"
description = "И си оправете звънците!"
full_description = "Ремонт на дървен шкаф – част 1 3 коментара Родителите ми имат един стар дървен шкаф. Покрай разни ремонти се наложи да го изпразним изцяло и изнесем от стаята и се видя, че състоянието му не е особено добро. Краката и дъното му бяха сериозно нападнати от дървояди. Точно в този момент бях решил да си почина известно време от работата пред компютъра и ремонтът на шкафа ми се стори добър проект за разтоварване. Опитах се да снимам основните етапи и да ги кача тук, най-вече за бъдещо вдъхновение, а и малко да се похваля. Ако искате да се научите как се правят подобни неща ви препоръчвам чудесния български блог „Дървени философии“ или необятното количество информация налична на английски. Дъното и краката бяха толкова проядени, че единственият вариант беше да ги заменя изцяло. Останалата част от шкафа третирах с някакъв силно отровен препарат против дървояди. За новото дъно купих сухи дъски на доста висока цена от Baumax в Пловдив. Въобще намирането на хубав дървен материал си е проблем. От дъските слепих плоскост малко по-голяма от необходимия ми размер. След изсъхване на лепилото изшлайфах малко повърхността и третирах профилактично с препарата против дървояди. Маркирах и изрязах плоскостта до точния размер. Пробното поставяне на новото дъно излгежда добре: Старото дъно лягаше върху основата (вижда се следата на припокриване),но аз реших да направя новото на едно ниво с нея. Нямаше никаква пролука по време на монтажа, но след няколко седмици се отвори сигурно 0.5-1мм процеп. По принцип препоръчват дървеният материал за някоя мебел да престои известно време в стаята, където ще се ползва и тогава да се сглобява. Аз нямах търпение да чакам и уж бях купил сухи дъски, но явно не достатъчно. Докато поставях новото дъно забелязах, че някой, някога е ремонтирал гърба на шкафа. Едната плоскост беше заменена с фазер. На принципа „Като ще е гарга – да е рошава“ реших да изработя нова плоскост с която да заменя фазера и да върна близък до оригиналния вид. За целта ми трябваха тънки дъски, които отидох да търся на ‘боклуците’, или където бяхме струпали отпадъците от ремонта на покрива миналата година. Първо намерих една малка костенурка: След това попаднах и на подходящи дъски. Повечето бяха криви или напукани, но подбрах най-добрите парчета и залепих пукнатините. Майка ми беше доста скептична като разбра, че възнамерявам да вградя част от ‘боклуците’ в шкафа ѝ. След като прекарах горните дъски през абрихта вече беше по-спокойна, че знам каво правя и няма да орезиля семейната ценност. Дори след повече от 50 години на покрива след малко обработка дървото може да изглежда като ново. Преди и след: Гърбът е дебел само 5мм и трябваше да отнема доста материал, но тъкмо така успях да поизправя малко нещата. Като страничен ефект се получава това: До сега не бях слепвал толкова тънки дъски, но в крайна сметка резултатът се оказа приличен. Ето и един изглед от вътрешността на шкафа: После укрепих дъното и гърба с няколко летви и ги лакирах: Най-накрая дойде ред да се захвана и с краката. Преди шкафът имаше четири струговани крака, един от които може да се види на първата снимка. Тъй като нямам струг реших да изработя крака подобни на един от орнаментите, така че да изглеждат добре като се съчетаят. Изработих заготовка близка по форма на тези орнаменти. Първоначално мислех да сложа пак четири крака. Предните два с формата на орнамените, а задните просто паралелепипеди. Също мислех краката да са ориентирани по същия начин, както орнаментита в горната част. На тази снимка шкафът е с краката нагоре. Вуйчото на един приятел, който се занимава любителски с дърворезба, изкопира орнаментите върху моите заготовки за крака. Категорично ми отказа всякакво парично заплащане за услугата. В крайна сметка му занесох една бутилка ракия. След известно експериментиране и чудене в крайна сметка реших да направя краката плътни по цялата дължина на страниците. Също завъртях орнамента на 180 градуса, така че да е огледален на горните и добавих една малко по-широка основа с фрезован ръб. Всичко това слепих в един доста масивен крак: Първият крак е готов, остава още един. След това залепих една пукнатина на вратите, ремонтирах и регулирах пантите и куп други дребни неща, които забравих да снимам. Пърият етап е завършен! Долната половина на шкафа вече е върната на мястото си. Ако сте впечатлени от скоростта и лекотата с които работя помислете пак. През това време беше направен основен ремонт на цялото помещение (даже два пъти!). Ще забележите, че краката са видимо по-тъмни от колкото трябва. Получи се така, защото повърхността на дързорезбата беше по-грапава. Дори при използване на един и същ лак по-гладките повърхностите стават по-светли, а по-грапавите по-тъмни. Вижте продължението в част 2. Публикувано в There I fixed it!, Дърводелство на ноември 8, 2017 от rado."
