title = "август | 2008 | Специалист по всичко"
description = "Всестранност и ракетна бързина!"
full_description = "Хъ-ръ-цъ-ръ – или как не се прави лов на глави 1 отговор Днес получих в пощата си следното съобщение: ======= Zdraveite, Nie sme HR Company www.hrcr.bg i iskam da Vi otpravq predlojenie za rabota. Imame klient, za kogoto tursim Development QE. Eto linka na nashata obqva: http://hrcr.bg/live/index.php?id=499,0,0,1,0,0 Ako predlojenieto Vi interesyva, molq da mi izpratite aktyalno CV na angliiski ezik. Mojete da se svurjete s men na tozi e-mail : mnikolova@hrcr.bg i na : 02 923 55 18 Yspeshen den! Miroslava Nikolova HR Consultant Human Relations Consulting Recruitment 20 Serdika str. 1000 Sofia, Bulgaria tel: ++ 359 2 923 55 18 Skype: mnikolova5 www.hrcr.bg ======= По принцип нямам нищо против да получа интересно предложение за работа по електронната поща. Дори напротив. Все пак съм публикувал CV-то си на този сайт (трябва да го направя по-красиво скоро) и работя на свободна практика. Нови проекти винаги са добре дошли. В крайна сметка „ловците на глави“ могат да предложат полезна услуга – както за работодателите, така и за работниците. За това обаче е необходимо да се положат поне минимални усилия. Иначе въпросното „предложение“ си е просто поредният СПАМ. Какво не е наред с това писмо: Написано е на латиница. Търсят Development QE. Някой да поясни. Като цъкна на връзката се отваря празна страница. Може би ако „one of the biggest HR companies in IT field“ си намери един PHP програмист нямаше да е така. Признавам и аз бих се затруднил ако ми се налагаше да работя с удобни и лесно запомнящи се адреси от вида на http://hrcr.bg/live/index.php?id=499,0,0,1,0,0 Искат ми „актуално CV на английски език“. След като ми пращате това на radoslav@kolev.info, да бяхте написали в браузъра си http://kolev.info и щяхте да се сдобиете с такова. Няма никаква информация за това кой е работодателят. И това при положение, че те ме търсят. Последното ми се вижда особенно тъпо. Както в случая, така и в обяви тип „фирма: поверително“. Ако съм някакъв шпионин и толкова много искам винаги мога да разбера кой е работодателят. Ще наема един супер подходящ кандидат, пращам го да ходи на интервюта и той после ми казва. Срещу някакво заплащане разбира се. Да се стига до чак такива крими сценарии обаче обикновено не е необходимо. Особенно в българската ИТ сфера. Обявите са написани толкова специфично, че въобще не е трудно да се играе на „познай фирмата“. Даже играта бързо доскучава ако се ползва помощта на гугъл. Отворям сайта hrcr.bg. Търся си работа по ключова дума „linux“. Да разгледаме първите три резултата: Linux Engineer /A_LX/ Въпрос: Has been providing information technology solutions since 1969. Working across a huge variety of industry sectors, they have earned a reputation for delivering personalised, quality services and solutions that provide immediate productivity, cost savings and flexible resource allocation; They need experienced and ambitious IT specialists to become part of their service support centre in Sofia city. Отговор: Ajilon C++ Software Engineer /T_C++/ Въпрос: Headquarter of the company is in USA and exist from 1993. Bulgarian office was opened in 2003. The size of the company here is more than 150 people and they are recognized leader in providing secure Internet communication solutions for enterprises and government customers of all sizes. Отговор: Tumbleweed Senior Automation Software Engineer /PP_SASE/ Въпрос: a dynamic international software development company, which has developed the industry’s first plug-compatible alternative to Microsoft Exchange on Linux Отговор: PostPath Забелязвате ли нещо в по-горните примери? Oт HRCR съвсем развалят играта, използвайки така наречените „кодове“ за позициите. От горните три виждаме: Т=Tubmleweed, A=Ajilon, PP=PostPath. Можем да предположим, че всеки код съдържа поне първата буква на фирмата, или първите букви – ако името е от няколко думи. Освен това, ако успеем да идентифицираме дори една обява на някоя фирма, то след това можем да откирем всички останали. Явно частта преди подчертавката е фирма, а след нея позиция. И така, някой ще се заеме ли с направата на сайт със залгания? Публикува се обява и посетителите познават коя е фирмата. Всъщност, защо просто някоя от HR фирмите не добави такава функционалност към сайта си, хем ще е по-интересно, хем и за тях ще има процент :). Ъпдейт от днес: ======= Zdraveite, Vchera Vi izpratih predlojenie za rabota za poziciq Development QE, no edva dnes zabelqzah che linka na obqvata, koqto sum Vi izpratila e s prazno sudurjanie. Iskam da Vi se izvinq za tova i da Vi izpratq aktyalniq link: http://hrcr.bg/live/index.php?id=528,0,0,1,0,0 Pozdravi! Miroslava Nikolova . . . ======= Все още не е ясно, какво е Development QE, но линка към обявата вече е работи. Също така, въпросното QE явно е зададено от работодателя, защото присъства и в неговата обява на собствения му сайт. Като стана дума, ето кой си търси QE-и: * The second largest software company in Europe; * Ever since its foundation in 1969, the company is a leader in the field of Software Development; especially in the Enterprise Transaction Systems as well as the SOA WebMethods; * With more than 3600 employees worldwide and offices in 50 countries, the company is searching for personnel for its office in Sofia. Кодът е SG_DQE, което внася малко несигурност в горната ми теория, защото фирмата е Software AG. Ако бях 100% познал, трбваше да е SA_DQE. Бърза проверка показва, че явно просто правилата за формиране на кодовете (или референтни номера, както те ги наричат) не са много твърди и всеки пише както му дойде в момента. Въпросната обява е публикувана както с кодове SA_DQE, така и SG_DQE на различни места. Публикувано в Бюрокрация и отбелязано с Bulgaria, head hunting, HR, IT, Всичко на август 8, 2008 от rado."
