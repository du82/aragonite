title = "юли | 2010 | Специалист по всичко"
description = "Най-малко 200 подводници!"
full_description = 'Развръзката на случая с Глобул 2 коментара Преди доста време писах за премеждията ми с Глобул. Накратко – исках да си сменя мобилния оператор запазвайки номера си. В офиса на Глобул отказаха да ми издадат удостоверение за преносимост поради измислени от тях правила – трябвало да покажа оригинала на моя договор. Пуснах жалба до КРС. В близките седмици нямаше никаква реакция. Тъй като срока на договора изтичаше, а аз не исках да имам още 12 месеца работа с Глобул или пък да загубя номера, изрових заветния смачкан жълт лист. Отивайки с него в офиса приеха заявлението ми за издаване на сертификат за преносимост. След това обаче се оказа, че "имало проблем". Отивам пак в офиса и разбирам, че дължа неустойка от 21.55 лв. Попитах за какво е тази неустойка при положение, че съм платил всички задължения и съм спазил всички срокове за предизвестия и т. н. Обяснението беше, че била за "оставащото време". До изтичнето на 12 месеца от сключването на договора оставахо още около 2 седмици. Забележете обаче, че таксите за всеки месец се предплащат – тоест аз таксата за 12-тия месец вече я бях платил, а това че няма да се възползвам от услугата през тези 2 седмици си е за моя сметка. Колкото и пъти и по каквито и да било начини да се опитвах да обясня това на служителите беше безполезно. Смених тактиката и поисках да ми обяснят точно как са изчислени тези 21.55 лв., тъй като те не отговаряха нито на 1 месечна такса, нито пропорционално на оставащите дни. Не получих обяснение, а само пак ми повториха, че докато не платя парите няма да си получа удостоверението. В крайна сметка платих неустойката. Това за мен си е чисто изнудване! Причината е повече от ясна – притесняват се, че за няколкото дни през които ще трае прехвърлянето аз мога да натрупам сметка, която после да не платя и те ще трябва да ме търсят. Нормално е, когато ти лъжеш и изнудваш клиентите си да очакваш, че те ще ти го върнат. За тях е много по-лесно да ми начислят една незаконна "неустойка" и топката остава у мен – да не съм се притеснявал, ако имало нещо надвнесено, щяли да ми го върнат. Така и стана, получих си парите обратно, минус 2-3 лева за проведени разговори. Но това отне месеци, неколкократни посещения в офиса и нерви. Познавам хора, които въобще не си потърсиха въпросните "неустойки". След още десетина дни звъни мобилният ми телефон и търсят г-н Колев. Обаждат се от КРС – ще идват в Кърджали да извършат проверка по моя случай. Обяснявам им, че съм намерил договора и съм си взел вече удостоверението, но жалбата ми е все още актуална. Уговаряме си среща във фоайето на местен хотел. При срещата ни тримата служители ми се представят показвайки служебни карти и се държат професионално. Аз нося всички документи по случая и устно общо взето повтарям това, което съм описал в жалбата. И според тях няма основание да изискват договора. Казват, че ще отидат на място в магазина да направят проверка, а аз да се скрия в градинката отпред, за да не ме видят. Те ще ми се обадят кога да отида. Така и правим. Аз наблюдавам от градинката как хората от КРС се правят на клиенти. В един момент те изваждат служебните си карти и ме извикват при тях в магазина. Информацията от жалбата ми е потвърдена. И на тях са им поискали екземпляра от договора за да им приемат заявлението за издаване на удостоверение за преносимост. Питат служителките кой е наредил това. Те казват – от централата. Обаждат се на "шефката", която отговаряла за южна България. След като се представи човека от КРС тя се оказа, че била в болнични, пък и въобще не отговаряла за този магазин. Казват ми, че ще съставят констативен протокол и ще ми отговорят писмено относно жалбата. Малко съжалявам, че не останах да видя какво точно ще има в този протокол, но имах друга работа. Както щях да разбера по-късно неговото съдържание е дълбока тайна. След около месец получих от КРС този отговор: За мен той е напълно формален и само преразказва неща, които аз вече много добре знам. Поради това им изпратих следното писмо: –––––––––––- ДО Д-Р ВЕСЕЛИН БОЖКОВ ПРЕДСЕДАТЕЛ НА КОМИСИЯТА ЗА РЕГУЛИРАНЕ НА СЪОБЩЕНИЯТА Във връзка с Ваш изх. №14-00-912/18.11.2009 УВАЖАЕМИ ГОСПОДИН БОЖКОВ, Благодаря за Вашия отговор! Всички факти описани в него са верни, с изключение на това, че представих оригиналният екземпляр от договора на 30.10.2009, а не на 31.10.2009. Това беше и целият проблем – от офиса на Глобул категорично отказаха да приемат моето заявление за преносимост без да представя договора. Бих искал да ми отговорите на най-важните за мен въпроси: 1.Има ли право Глобул да изисква от абонатите да представят оригинала на своето копие от договора преди да приеме заявление за преносимост? 2.Ако отговорът на въпрос 1 е не – какви мерки сте взели за прекратяването на тази практика? Неустойката от 21,55 лева заплатих, защото бях принуден да го направя. Това се случи след като подадох жалбата към Вас и затова не е описано в нея. Беше ми заявено, че докато не заплатя неустойката няма да ми бъде издадено удостоверение за преносимост. Аз смятам, че съм спазил точно всички изисквания от моя договор с Глобул и не дължа неустойка. Поисках по-подробна информация за кой точно период и по каква причина искат да заплатя тази неустойка. В крайна сметка единственото смислено, което получих като отговор е – „има я в компютъра“, докато не я платите няма да ви издадем удостоверението. гр. Кърджали 02.12.2009 С уважение: Р. Колев –––––––––––- Получих този отговор от КРС: и изпратих поредното писмо с въпроси: –––––––––––- ДО Д-Р ВЕСЕЛИН БОЖКОВ ПРЕДСЕДАТЕЛ НА КОМИСИЯТА ЗА РЕГУЛИРАНЕ НА СЪОБЩЕНИЯТА Във връзка с Ваш изх. №14-00-912/06.01.2010 УВАЖАЕМИ ГОСПОДИН БОЖКОВ, Благодаря за изчерпателния отговор на въпрос 1 от предишното ми писмо! Позволявам си да го перефразирам в по-кратък, но запазващ смисъла вид – „Не.“. Поправете ме ако не съм го разбрал правилно. Относно отговорът Ви на въпрос 2 – интересува ме конкретно случаят на отказ да бъде прието заявление описан в моята жалба. Според мен по него са събрани достатъчно доказателства. Освен описанието на случая в жалбата дадох копия на всички документи (договор с Глобул, собственоръчно написано заявление, издаден сертификат, касови бележки) на служителите от КРС при срещата ни след извършването на проверката на 06.11.2009 г. До колкото ми е известно, по време на проверката е установено, че всички обстоятелства описани в моята жалба отговарят на действителността. Също така разполагам с трима свидетели, които могат да потвърдят, че е отказван приема на заявления ако не се представи договора. Във връзка с горното бих искал: 1.Да ми предоставите копие от констативния протокол съставен след извършване на проверката по моята жалба на 06.11.2009 г. Може и в електронен вид на radoslav@kolev.info . В случай, че трябва да заплатя разходи по ксерокопиране или други свързани с изпращането на копия посочете банкова сметка на която да ги преведа, както и необходимата сума; и да отговорите на следните въпроси 2.Събрани ли са достатъчно доказателства по случая на отказ да бъде прието заявление за преносимост описан в моята жалба? 3.В случай, че отговорът на въпрос 2 е „не“, то какви още доказателства са необходими? 4.В случай, че отговорът на въпрос 2 е „да“, то образувано ли е по него административнонаказателно производство срещу нарушителя? 5.В случай, че отговорът на въпрос 4 е „не“, то каква е причината за това? 6.В случай, че отговорът на въпрос 4 е „да“, то какви санкции са били наложени? Неправомерният отказ за прием на заявление за преносимост от Глобул, описан в моята жалба, ми струваше време, пари и неприятни емоции. Поради това се обърнах към Вас с цел разрешаване на проблема, както за моя конкретен случай, така и за случаите на други граждани изпаднали в същата ситуация. Изпращането на жалбата, срещата със служителите от КРС и последвалата кореспонденция с Вас също са разход на време и пари за мен, но аз смятам, че това е „правилният начин“ и изразходваните ресурси са всъщност една добра инвестиция. Тъй като не разполагам с неограничено време и средства се опитвам да изразходвам наличните по най-оптималния начин. Ето защо, след като „вложа“ определено количество в дадено начинание, искам да видя какъв е крайният резултат от моите действия и дали това е била добра или лоша инвестиция. За мен е важно да проследя какъв е реалният резултат от подаването на моята жалба, какви конкретни действия са предприети за прекретяване на неправомерните откази, какви санкции са били наложени и най-вече имали ли са ефект и прекратена ли е практиката да се изискват договорите. Уверявам Ви, че имам предостатъчно много по-интересни занимания от писането на жалби и писма и целта ми не е просто да губя моето или Вашето време. гр. Кърджали 02.12.2009 г. С уважение: Р. Колев –––––––––––- и получих този отговор: В крайна сметка се оказа, че какъв е резултатът от моята жалба е голяма тайна и аз като гражданин не мога да проследя какво се е случило. Може примерно Глобул да са обжалвали в съда или пък санкцията да е в размер на 5 лв. Също така се разбира, че КРС не притежава правомощия да задължи мобилните оператори да спазват „Процедурата за преносимост на мобилни номера“. Като заключение мога само да посъветвам всички да четат "ситния шрифт" при сключване на договори с мобилни оператори, банки и т. н. Не само това, обикновено информацията в договора е доста оскъдна, а най-съществените неща са в така наречените Общи условия. Изчитането на всичко на място в офиса обикновено е невъзможно, затова се подгответе предварително като посетите сайта на фирмата. Друг вариант е да вземете всички материали вкъщи и се върнете на другия ден да подпишете договора. Публикувано в Бюрокрация и отбелязано с Всичко, Глобул, КРС, преносимост на юли 23, 2010 от rado.'
