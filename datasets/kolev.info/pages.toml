["http://kolev.info/blog/author/rado"]
title = "rado | Специалист по всичко"
description = "С математическа точност и ракетна бързина!"
full_description = "Ремонт на дървен шкаф – част 2 5 коментара След първата част се захванах с едно от чекмеджетата. Разглобих го нацяло и залепих наново сглобките. Тъй като те не бяха особено плътни вместо страндартното (поливинилацетатно) лепило за дърво използвах полиуретаново. То се раздува докато съхне и може да запълни малки луфтове. Жлебовете в които влизаше дъното също се бяха отцепили. Направих нови летви които залепих към рамката на чекмеджето с подходящи прорези. Те служат и като водачи, защото върху тях се плъзга самото чекмедже. Оставих ги малко по-дълги и после подрязах, така че да ограничат движението навътре. Горната част на шкафа имаше 2 основни проблема. Гърбът на едното шкафче беше откъртен и имаше голяма пукнатина на ‘тавана’, който е от същите 5мм слепени дъски като гърбовете. Гърбовете на всички шкафчета влизат в П-образна рамка от дъски с жлебове. На две от дъските тук жлебовете бяха откъртени. На горната издялках откъртеното до паралелепилед с длето и залепих подготвена летвичка с подходящ размер. Самата дъска беше твърде добре свързана с останалата част на шкафа и не искам да я махам. Страничната дъска със счупен жлеб едва се държеше, така че я отстраних без проблем и изработих изцяло нова дъска на циркуляра. Тъй като нямаше как да я прихвана със стеги при лепенето малко импровизирах. Гърбът също беше счупен от единия край и имаше 1-2 малки пукнатини. Добавих ново парче (взето от голяма част от тавана, която замених) и залепих напуканото. Тежестите пречат на тънките плоскости да се надигнат в мястото на слепване от силата на стегите. Всичко монтирано на място. На снимката се вижда и как страницата е спукана при долната панта. Свалих вратата за да мога да сложа стеги и залепих пукнатината. Демонтирах тавана изцяло и изрязах около 1/3 от него заради голямата пукнатина. По вече отработения начин залепих нова дъска намерана из ‘боклуците’ останали от ремонта на покрива. Ето и един автопортрет с готовия продукт. След лак цветът е доста близък, но така или иначе тази част няма да се вижда. Двете дупки се падат точно върху стените на шкафчетата и някога в тях е имало дибли закрепващи допълнителни орнаменти върху шкафа. За съжаление те са безследно изчезнали много преди аз да се родя. Новият таван вече монтиран на шкафа. Преди да мога да поставя горната част на шкафа на мястото ѝ трябваше да сменя малко занаята. Между двете половини има гранитен плот, който беше доста издраскан. Искаше ми се да се опитам да го полирам преди да го поставя на мястото му. Проблемът с това е, че гранитът е доста твърд. Специално за целта си поръчах комплект диамантени полиращи дискове от ebay. С внимателна работа с дрелката, така че да не се получат дълбоки задирания изшлайфах драскотините. Дисковете почват от едрина 80 и стигат до 3000. Въпреки, че накрая имах равна повърхност без драскотини тя стана много матова и се загуби красотата на камъка. Тайната към лъскава и огледална повърхност се оказа в използването на специална восъчна полир паста за камъни. Тъй като цялата процедура е доста трудоемка частта, която ще остане под горната част на шкафа ме домързя да я полирам. На тази снимка се вижда разликата, като полираната част отразява асмалъка под който работех.Преди: И след: Сега вече всички части на шкафа могат да се съберат на едно място. Струваше си труда по полировката. Ясно се вижда отражението на шкафа в гранита.Дори фотоапарата може да го фокусира. Сега обратно към дърводелството. Проектът е 99% готов, но както знаем последния 1% отнема 50 процента от времето :). В моя случай най-много отне докато се наканя да довърша последните 3-4 детайла. Един проблем, който се появи след слгабянето на всички части е, че от тежестта средата провисна. В резултат на това вратите взеха да опират и да се отварят много трудно. За да реша този проблем добавих една опора. В средата над двете чемкеджета имаше една изтегляща се масичка, която никога не сме ползвали. След добавянето на опората масичката нямаше как да се сложи вече, затова просто запуших дупката. Бронзовата дръжка на едното чекмедже никога не я е имало. Направих ‘временна’ от дърво, колкото да може да се отваря. Тъй като поговорката, че най-трайните неща са временните явно ще важи и в този случай я приведох в малко по-добър вид. Всички тези довършителни работи са видими на долната снимка. Също така се вижда, че шкафът вече се ползва. Близък план на ‘временната дръжка’. Не знам дали да не направя същата и за другото чекмедже, че да са еднакви.И последно, вратата на долния шкаф също няма дръжка (бях пъхнал една дибла в ключалката, да мога да я отварям), но пък има една дупка. Не можах да измисля особено красиво решение, но запълних дупката с някакъв обков, който имах под ръка и поне по цвят пасва горе-долу. Шкафът е купен втора употреба от баба ми през 50-те години на миналия век, така че не се знае колко е стар точно. Надявам се след това освежаване да изкара поне докато се пенсионирам :). В процеса на работа се уверих, че трябва да си организирам по-добре работилницата. И най-вече, че един истински дърводелски тезгях ще направи удоволствието от подобни дейности още по-голямо. Ето най-нарая в завършен вид. Публикувано в There I fixed it!, Дърводелство на ноември 10, 2017 от rado."
