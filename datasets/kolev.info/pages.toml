["http://kolev.info/blog/2008/07"]
title = "юли | 2008 | Специалист по всичко"
description = "Но мен народът ме издигна ..."
full_description = "Аферата „къси панталони“ – не само в СРС 4 коментара Днес от блога на Пейо разбрах за аферата „къси панталони“. За съжаление въпросната афера се простира далеч извън СРС. Със сигурност подобен проблем има и в сградата на Окръжен съд – Кърджали, а и в „други институции на държавната администрация“. Аз се сблъсках с това миналата година, точно както го е описал Милен Христов – отивайки да си извадя свидетелство за съдимост. Макар и да изглежда смешно въпросът е много сериозен. Ако се абстрахираме от конкретния случай с късите гащи ситуацията е следната – на всеки гражданин може абсолютно произволно да бъде отказан достъп до сградите на съда. Всичко зависи от настроението на пазача – дали е спал добре днес, дали си му симпатичен и т. н. И аз не харесвам подобни несправедливости и се опитах да направя нещо по въпроса. Резултатът е половинчат. Вече можете да влезете с бермуди в сградата на ОС-Кърджали – тествано е. За съжаление така и не получих отговор на последното ми писмо и нищо не е сигурно. Може просто човекът при тестовото влизане да е имал късмет и ако утре отидете вие пак да ви върнат. Аз тогава нямах повече търпение да се занимавам със случая и го оставих така. Скоро ще се опитам да напиша малко за по-генералния проблем, който както разбрах се нарича „мълчалив отказ“. В крайна сметка излиза, че сме задължени да уважаваме съдебната власт, не само това ами и да показваме своето уважение носейки определено облекло (точно какво – не ни казват). Е, ако ме накарат и се наложи може и триредов костюм да облека. За мен обаче е много по-важно какви мисли има в главите на хората, не как са облечени когато се срещаме или какви изпразнени от съдържание обръщения използват. Ако искаш другите да те уважават истински не трябва да ги задължаваш да го правят с нормативен акт – трябва да го заслужиш. Ето и моята кореспонденция с Окръжен съд – Кърджали и Областно звено „Охрана“: Писмо от мен (изпратено чрез сайта http://kardjali.court-bg.org/): ========== Здравейте! Днес се опитах да влезна в съдебната палата. Охраната на входа ме спря и отказа да ме допусне в сградата. Аргументът им беше, че не може да се влиза в сградата с „къси гащи“. Казаха ми, че мога да влезна единствено ако си облека дълъг панталон. Служителите не успяха да ми дадат точна информация къде е описано това изискване, а само че е нареждане „отгоре“. Единственото което можах да намеря на сайта court-bg.org като изискване за облеклото е следното: „Израз на неуважение е влизането в съдебната палата с неприлично облекло, в нетрезво състояние и демонстриране на агресивно или скандално поведение.“ Аз бях облечен с тениска и панталон до коленете. По моя лична преценка, това не е неприлично облекло. Тъй като понятието е доста разтегливо моля да ме насочите към дефиниция на „неприлично облекло“ която вие използвате, така че да мога да съобразя облеклото си при бъдещи посещения в сградата. Предлагам тези изисквания да бъдат описани в информационно табло на входа на сградата. Така за гражданите ще е ясно къде са границите и няма да останат с впечатление, че важи единствено субективната преценка на служителят на смяна. Радослав Колев ========== Отговор от ОС – Кърджали изпратен ми по електронната поща: ========== УВАЖАЕМИ ГОСПОДИН КОЛЕВ, В отговор на Вашето писмо, Ви уведомявам, че организацията на пропускателния режим и охраната на Съдебната палата се осъществява от служители на Главна дирекция „Охрана” при Министерство на правосъдието и съобразно Правила за охраната, вътрешния ред и сигурността на Съдебната палата – гр.Кърджали, утвърдени със Заповед №З-38/26.01.2007г. на Директора на Главна дирекция „Охрана” при Министерство на правосъдието. Според т.8 от същите правила, не се допускат в сградата граждани в неприличен външен вид, в явно нетрезво състояние, с видими психически разстройства и под влияние на наркотични или други упойващи вещества. Контролът за спазване на вътрешния ред, пропускателния режим и охраната на Съдебната палата се осъществяват от дежурните сътрудници по охраната при Областно звено „Охрана” – гр.Кърджали. Съдебен администратор при ОС-Кърджали ========== Уточняващо запитване от мен, пак по електронната поща: ========== Уважаема г-жо/г-це Милушева, Благодаря за бързия отговор! Както съм написал в първото писмо до вас, преди да ви безпокоя с въпросите и предложенията си проверих за изисквания относно облеклото на вашия сайт. Там открих въпросната забрана за неприлично облекло/външен вид. За съжаление във вашия отговор не намерих това, което всъщност най-много ме интересува. Как се определя кое облекло е прилично и кое не? Има ли някъде дефиниция или се разчита на преценката на служителите на Главна дирекция „Охрана“? Смятам, че за да може това правило да се прилага безпристрастно и обективно трябва да има обща пунблично достъпна дефиниция за „неприлично облекло“, която ще е полезно да е описана на табло пред входа или на вашия уеб сайт. Сега дори и да имам най-добрите намерения да спазя изискването, не съм сигурен, че ще успея. Явно моята представа за прилично облекло е различна от това, което изисквате вие. Проблемът е, че за да се съобразя с вашата дефиниция трабва да знам каква е тя. За момента единственото което ми е известно е, че се изисква „дълъг панталон“. Можете ли да потвърдите, че единственото изискване е дълъг панталон? Опасявам се, че ако утре дойда с яркочервен дълъг панталон може отново да бъда върнат, защото примерно цвета е прекалено ярък и предизвикателен. Ще съм благодарен, ако можете да отговорите на въпроса ми. С уважение, Радослав Колев ========== На това писмо не получих никакъв отговор. Поради това изпратих следното до председателя на окръжния съд (хартиено писмо, с обратна разписка): ========== До Председателя на Окръжен съд Кърджали Уважаеми г-н Събев, Във връзка с отказан ми достъп до сградата на ОС-Кърджали изпратих запитване чрез Вашия интернет сайт. Интересувах се от критериите Ви за “неприличен външен вид” по които охраната отказва да допусне гражданин в сградата на съда. Полученият отговор от съдебния администратор при ОС-Кърджали според мен е формален и не отговаря на зададения от мен въпрос. Изпратих уточняващо запитване на което и до сега не съм получил отговор. Горепосоченият факт е причината за моето писмо до Вас. Очаквам да отговорите точно и по същество на зададения от мен въпрос. Приложения: 1. Текст на запитване изпратено на 11.06.2007 г. 2. Отговор от г-жа Милушева получен на 12.06.2007 г. 3. Текст на уточняващ въпрос изпратен на 12.06.2007 г. Адрес за кореспонденция: 6600 Кърджали ул. *********** Радослав Колев 20.07.2007 г. С уважение: Кърджали /Р. Колев/ ========== Получих следният отговор: ========== ========== След което изпратих запитване до ОЗ „Охрана“ (хартиено писмо, с обратна разписка): ========== До Г-н Делчо Ташев Началник на Областно звено “Охрана” гр. Кърджали Уважаеми г-н Ташев, От кореспонденцията ми с Окръжен Съд – Кърджали разбрах, че критериите за “неприличен външен вид” свързани с пропускателния режим за сградата на ОС – Кърджали са от компетенцията на Областно звено “Охрана”. Поради това с настоящето писмо се обръщам към Вас, с цел да получа определение на критерия за “неприличен външен вид”, респективно как се определя кое облекло е прилично и кое не е. Аз не успях да открия точни изисквания на видно място на входа на сградата на ОС – Кърджали или на интернет страницата http://court-bg.org. Бих желал да получа отговор, на зададените от мен въпроси: * Къде са регламентирани критериите за “неприличен външен вид”? * Ако никъде няма нормативно определени критерии, да смятам ли, че се разчита на субективната преценка на служителя на смяна? Приложения: 1. Текст на запитване изпратено на 11.06.2007 г. 2. Отговор от г-жа Милушева получен на 12.06.2007 г. 3. Текст на уточняващ въпрос изпратен на 12.06.2007 г. 4. Повторно запитване до ОС – Кърджали 5. Писмо с изх. № 1054/30.07.2007 г. Адрес за кореспонденция: 6600 Кърджали ул. ******* Радослав Колев 10.08.2007 г. С уважение: Кърджали /Р. Колев/ ========= Получих следният отговор: ========== ========== Изпратих поредното писмо: ========== ДО НАЧАЛНИК СЕКТОР ОЗ “ОХРАНА” – гр. Кърджали Г-н Делчо Ташев Във връзка с Ваш изх. №650 / 20.08.2007 г. Уважаеми г-н Ташев, Благодаря за писмото. За съжаление в него отново не получавам отговор на всички поставени от мен въпроси. Аз много внимателно прочитам писмата които получавам от Вас и ОС – Кърджали и отговарям на всички поставени въпроси или изисквания за уточняваща информация. Моля, и Вие да правите същото. За улеснение номерирам въпросите си: 1. (от предишното ми писмо) Ако никъде няма нормативно определени критерии, да смятам ли, че се разчита на субективната преценка на служителя на смяна? 2. Бихте ли посочили къде точно и в кои мои писма сам казвам, че понятието „неприличен външен вид“ не може да бъде формулирано еднозначно и записано пълно и дословно в нормативен акт? Ако смятах нещо за невъзможно нямаше да ви питам къде и как е направено. Понятието „безопасна скорост“ е също толкова субективно, но в Закона за движение по пътищата е записано, че максималната допустима скорост в населени места е 50 км/ч, извън тях 90 км/ч и т. н. 3. Благодаря за поканата за среща! Давате ли съгласието си да бъде направен аудио/видео запис на нашата среща, който да мога да разпространявам свободно? 4. Бихте ли ме запознали със съдържанието на указанията дадени на служителите Ви във връзка с моя случай за които споменавате във Вашия предишен отговор? Адрес за кореспонденция: 6600 Кърджали ул. ******** Радослав Колев 13.09.2007 г. С уважение: Кърджали /Р. Колев/ ========== Както вероятно се досещате отговор на горното така и не съм получил. Публикувано в Бюрокрация и отбелязано с Bulgarian court, discrimination, no reply, shorts, Всичко на юли 2, 2008 от rado."
