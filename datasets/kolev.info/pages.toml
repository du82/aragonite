full_description = "Развитие по случая с недостъпна среда Вашият отговор Във връзка с предишните две публикации (1, 2) има малко развитие. Получихме отговори от областната управа и общината. Прилагам ги тук, но с две думи – интересуват се от проблема и препращат копие към компетентния орган. Благодарим за указаната подкрепа! По-важното е, че като минавах от там завчера направо не можах да повярвам на очите си. Имаше сигурно 10 работника, които изкъртиха знаците от средата на тротоара и ги преместиха в градинката встрани или по-близо до пътя. Преди: След: Преди: След: Чакаме и скосяването на бордюрите! Публикувано в Бюрокрация на февруари 1, 2013 от rado. Сигнал до Агенция „Пътна инфраструктура“ Вашият отговор Във връзка с предишната ми публикация изпратихме следния сигнал. Други новини относно ремонтa – сигнал за незрящи подлудява кърджалийци! До Председателят на УС на Агенция “Пътна инфраструктура” Копие: До кмета на Община Кърджали До областния управител на област Кърджали СИГНАЛ от Димитър Георгиев Петков и Радослав Кирилов Колев, живущи в град Кърджали. Адрес, телефон и електронна поща за кореспонденция – 6600 Кърджали, ул. *****, тел: *****, radoslav@kolev.info Уважаеми г-н Лазаров, пишем Ви по повод извършеният основен ремонт на бул. “Беломорски” и бул. “Първи май” в град Кърджали, като част от обект „Рехабилитация на път „ПЪТ Е-85 (І-5) “КЪРДЖАЛИ – ПОДКОВА” от км. 342+639,41 до км. 367+427”. Бихме искали да ви уведомим, че при извършването на ремонта на много места е пропуснато скосяването на тротоарите съгласно чл.12 от Наредба 4 за проектиране, изпълнение и поддържане на строежите в съответствие с изискванията за достъпна среда за населението, включително за хората с увреждания (ДВ, бр. 54 от 2009 г.). Такива пропуски могат да се видят примерно на пресечката на ул. “Ардинска”, тротоарите до бившата бензиностанцията „Шел” (сега „Газпром”), при ЖП прелеза на автогарата. Основата на един от стълбовете на светофара на кръстовището в кв. Веселчане се издига над нивото на тротоара и представлява препятствие. При някои от направените скосявания на тротоара, при пешеходната пътека на самото кръстовище, при бензиностанциите OMV, „Петрол” и при паркинга на магазин „Лидъл” нивото не е изравнено с това на пътното платно. Не са направени скосявания на тротоара на автобусните спирки, съгласно чл. 26 от същата наредба. Точно по средата на тротоара в близост до същото кръстовище, който в този участък е доста тесен, са поставени стълбовете на пътни знаци и указателни табели. Това напълно излишно затруднява движението на пешеходците и прави невъзможно придвижването на хора с увреждания в инвалидни колички. Нарушен е чл.6, ал.1, т.2 от горе посочената Наредба 4. Надяваме се, че ще получим отговор на настоящия сигнал по електронна поща или на хартиен носител, както е най-удобно за Вас и най-вече, че ще вземете мерки за отстраняване на описаните проблеми. Прилагаме снимков материал на част от проблемните места. 03.12.2012 г. гр.Кърджали Подпис: (Д.Петков) Подпис: (Р.Колев) Публикувано в Бюрокрация и отбелязано с Всичко на декември 4, 2012 от rado."
