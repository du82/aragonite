title = "Еко-био-хендмейд-рециклирана холна масичка | Специалист по всичко"
description = "По гащета съм, малко е неудобно!"
full_description = "Еко-био-хендмейд-рециклирана холна масичка 1 отговор Представям ви моя проект за масичка, направена от две врати на стар гардероб. Голямата ми гордост е, че при разкроя няма (почти) никакъв отпaдък! Необходими материали – две врати от гардероб (или други правоъгълни плоскости с подходящ размер): Стъпка 1: Отрязваме по един полукръг от двата края на едната врата. Диаметъра е равен на ширината на плоскостта. Аз използвах оберфреза, но ако имате стабилна ръка би трябвало да се справите и със зеге. Плотът на масичката е готов! Стъпка 2: Отрязваме от другата врата две равни части, които ще служат за крака. Останалото ще бъде рафтчето. Не давам точни размери. Аз ги нагодих на око – според плоскостите с които разполагах и колко широка/висока масичка исках да получа. Стъпка 3: Вземаме остатъците от изрязването на плота. На сминката се вижда, че на моите плоскости има фрезовани отвори за панти или нещо подобно, които изрязах да не грозят. Това е и единствената „загуба“. Краката имат същите отвори, но просто ги обърнах навътре, да не се виждат. Подрязваме ги така, че да получим четири ъгълчета. Въпросните ъгълчета, смятах да сложа за допълнителна якост между рафтчето и краката, а и като визуален елемент. В крайта сметка и без тях масата се оказа достатъчно стабилна и красива и ме домързя да ги сложа. Стъпка 4: Прорязваме рафтчето така, че вертикалните елементи да минат през него: На сминката се виждат дупки за дръжка, които имаше на едната врата. Запуших ги с дървени дибли и прецених рязането така, че да останат на рафтчето и да не бият много на очи. Стъпка 5: Сглобяване. Би трябвало да разполагате с нещо подобно на това: Рафтчето, краката и вертикалните подпори са съединени с винтове 3.5х50мм (по съвет на Киро). Те са достатъчно тънки, така че да не разпукат талашита дори и без предварително разпробиване. Плота е закрешен към краката с ъглови сглобки, за да няма по него глави на винтове и дупки. Ето как изглежда сглобената масичка: Стъпка 6: Подобряване на външния вид. Реших да не се опитвам да слагам кант на плота в домашни условия. Също така, цвета на плоскостите беше малко различен от двата края. Вместо това, намазах цялата масичка с лазурен лак, така че всичко да придобие горе-долу един цвят. Смятам, че се получи добре. В последствие се оказа, че лазурният лак не е много устойчив, нанесен върху фурнира. Реших да нанеса поне на плота яхтен лак, така че да е устойчив на надраскване. Това обаче предизвика някаква реакция между двата лака. В крайна сметка изщкурих плота и го лакирах наново, само с яхтен лак. Макар и да стана малко по-различен цвят от останалите, сега вече не се драска и пак като цяло масичката изглежда добре. Имам още доста плоскости останали от този гардероб, така че всякакви идеи за оползотворяването им са добре дошли. За сега освен масичката съм направил и една ъглова етажерка за обувки. Макар и не чак толкова красива, тя е съобразена със всички чупки и стълби и пасва точно в ъгъла на много малкото антре вкъщи. Тогава ме домързя да снимам процеса, но ако на някой му е любопитно мога да кача една снимка на крайния продукт. Публикувано в Дърводелство, Рециклиране на май 1, 2014 от rado."
