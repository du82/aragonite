full_description = "Принтер/скенер/копир Dell 1815dn и Линукс Вашият отговор Наскоро се сдобих с въпросното устройство – принтер, скенер и копир Dell 1815dn. Добра машинка, намираща се на прилична цена от доставчиците на употребявана техника. За да заработи под Линукс принтера (в моя случай Убунту 12.04), сваляте архив с драйвери от тук. Единственият файл, който ви интересува в този архив, е cdroot/Linux/noarch/at_opt/share/ppd/mfp1815ps.ppd. Трябва да го посочите при добавянето на нов принтер, след като автоматичното търсене на драйвер се окаже неуспешно. За сканиране по мрежата, решението е тук. Работи без никакви проблеми. Публикувано в Софтуер, Хардуер на март 1, 2013 от rado."
