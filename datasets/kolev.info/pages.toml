title = "юни | 2008 | Специалист по всичко"
description = "Абе аз що не седна, ами седя прав?"
full_description = "http://bgrun.com – обиколка на България 2 коментара Моят приятел Божко е решил да прави обиколка на Бълария. Планът му е да пробягва по около 50 километра на ден в продължение на месец. Мислех да го придружа първата седмица – с колелото разбира се, трудно бих пробягал такова разстояние. В крайна сметка пак го придружавам, но карайки колата с багажа. Имаше проблем с първоначално уговореният шофьор. Вчера тръгнахме от Кърджали по пътя за Смолян и завършихме в село Леска. Спахме на палатка близо до реката и като цяло беше доста приятно. След като разпънахме лагера на една ливада отидохме в местната кръчма да заредим GPS-a и да пийнем нещо. После на връщане по тъмното малко трудно намерихме точно къде е палатката, но все пак успяхме и спахме на топло и удобно. Аз сега съм в Смолян в хотел-ресторант „СПАРТАК“. Приятно е, а и имат безжичен интернет. Утре живот и здраве се надявам да се изкъпем в минералните басейни на Девин. Официалният сайт за момента е само статичен HTML и е малко неудобно, но ще се опитам скоро да пусна един WordPress и да качваме там по-често новини и снимки. Може и да се пробваме на покажем логовете от GPS-a върху google maps или нещо подобно ама не съм правил до сега такова нещо и не знам точно как е най-добре. Ако живеете някъде по пътя на обиколката, и искате да ви дойдем на гости само се обадете :). Публикувано в Всичко и отбелязано с Bojidar Antonov, Bulgaria, run, sport, tour, Всичко на юни 2, 2008 от rado."
