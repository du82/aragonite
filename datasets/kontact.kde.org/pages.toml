["https://kontact.kde.org/ko/components/akonadi"]
title = "Akonadi - Kontact 제품군"
description = "Akonadi 프레임워크는 가나의 정의의 신에서 이름을 따 왔으며, 앱에 사용자의 개인 정보를 저장, 색인, 접근할 수 있는 중앙 데이터베이스를 제공합니다. 사용자의 이메일, 연락처, 캘린더, 이벤트, 저널, 알람, 메모 등을 저장할 수 있습니다."
full_description = "AkonadiAkonadi 프레임워크는 가나의 정의의 신에서 이름을 따 왔으며, 앱에 사용자의 개인 정보를 저장, 색인, 접근할 수 있는 중앙 데이터베이스를 제공합니다. 사용자의 이메일, 연락처, 캘린더, 이벤트, 저널, 알람, 메모 등을 저장할 수 있습니다.기능공통 PIM 데이터 캐시형식 독립적 디자인확장성일반적인 오프라인 접근, 변경 사항 저장 및 적용일반적인 충돌 감지와 해결프로필별 리소스 그룹화독립된 여러 부분으로 나뉜 항목 처리복사 없이 가져오기 기능동시 접속, UI 클라이언트와 독립적인 백그라운드 활동 가능원격 서버와 이메일, 캘린더, 주소록 동기화시맨틱 데스크톱 환경에서 PIM 데이터 접근 가능압축색인프로세스 외부에서 검색다중 프로세스 디자인충돌 격리시스템 차단 없이 대형 항목 처리IPC를 통한 통신으로 독점적 구성 요소 사용 가능"
