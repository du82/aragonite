["https://kontact.kde.org/uk/components/akonadi"]
title = "Akonadi - Комплекс програм Kontact"
description = "Бібліотека Akonadi, названа на честь богині справедливості — пророчиці у Гані, відповідає на надання програмам доступу до централізованої бази даних для зберігання, індексування та отримання особистих даних користувача. Це стосується електронної пошти, записів контактів, календарів, записів подій, журналів, нагадувань, нотаток та інших даних."
full_description = "AkonadiБібліотека Akonadi, названа на честь богині справедливості — пророчиці у Гані, відповідає на надання програмам доступу до централізованої бази даних для зберігання, індексування та отримання особистих даних користувача. Це стосується електронної пошти, записів контактів, календарів, записів подій, журналів, нагадувань, нотаток та інших даних.МожливостіЗагальний кеш особистих данихНезалежний від типів дизайнМожливість розширенняТиповий автономний доступ, записування і відтворення змінТипове виявлення і розв'язання конфліктівРесурси можна групувати за профілемЗаписи складаються із незалежно отримуваних декількох частинМожливе отримання із нуль-копіюваннямКонкурентний доступ уможливлює фонову активність незалежну від клієнта інтерфейсу користувачаСинхронізація пошти, даних календаря та адресних книг із віддаленими серверамиУможливлює для семантичної інфраструктури стільниці доступ до особистих данихАрхівуванняІндексуванняПошук поза процесамиБагатопроцесове компонуванняІзоляція аварійних ситуаційОб'ємні записи не можуть блокувати усю системуКомпонування за IPC уможливлює використання закритих компонентів"
