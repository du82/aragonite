["https://kontact.kde.org/ca-va/users"]
title = "Per als usuaris - Paquet Kontact"
description = "Kontact: gestioneu els vostres correus, calendaris i contactes des d'una finestra única"
full_description = "Per als usuarisNou a Kontact?Kontact oferix innombrables característiques i opcions. Per a esbrinar-les, podeu llegir alguns manuals:Manual de KontactManual de KMailManual de KOrganizerManual d'AkregatorMés manuals, també en altres idiomes…Vos cal ajuda?Consulteu els subfòrums Kontact i PIM als Fòrums de KDE, potser algú ja ha resolt un problema similar. I, si no, sentiu-vos lliures de preguntar-ho ací!També podeu preguntar al canal d'IRC #kontact del xat Libera. Si preferiu la comunicació per correu electrònic, podeu preguntar en la llista de correu kdepim-users.Heu trobat algun error?En el programari hi ha errors. Si en trobeu en l'aplicació Kontact, si su plau, informeu-ne en el nostre Bugzilla. No informeu d'errors en els fòrums o les llistes de correu: estos informes segurament es passaran per alt o s'oblidaran força prompte per part dels desenvolupadors. Per a assegurar que l'error arriba fins als desenvolupadors i es corregix tan prompte com siga possible, informeu-ne en Bugzilla.Trobeu a faltar alguna característica?L'aplicació Kontact té moltes característiques, però sempre hi ha lloc per a una o dues més. Si teniu una idea d'una millora o trobeu a faltar una característica en l'aplicació Kontact, escriviu un suggeriment en el nostre Bugzilla per tal que els desenvolupadors la troben i la implementen."
year_published = 2025
