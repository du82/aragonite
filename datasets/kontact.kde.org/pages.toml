["https://kontact.kde.org/it/components/korganizer"]
title = "KOrganizer - Suite Kontact"
description = "KOrganizer è un organizzatore avanzato e ricco di funzionalità, un gestore di eventi e di cose da fare che si integra bene con gli altri componenti di Kontact, in particolar modo con KMail."
full_description = "KOrganizerKOrganizer è il componente di Kontact per il calendario e la pianificazione degli eventi. Fornisce gestione degli eventi e delle attività, notifica degli avvisi, esportazione web, gestione di rete trasparente dei dati, pianificazione di gruppo, importazione ed esportazione dei file di calendario e altro ancora. È in grado di lavorare assieme a un'ampia varietà di servizi di calendario, tra cui NextCloud, Kolab, Google Calendar e altri ancora. KOrganizer è completamente personalizzabile in base alle tue esigenze ed è parte integrante della suite Kontact, che rappresenta una soluzione completa per l'organizzazione dei tuoi dati personali. KOrganizer supporta i due standard dominanti per la memorizzazione e lo scambio dei dati di calendario: vCalendar e iCalendar.CaratteristicheSupporto per calendari multipli e liste di cose da fare. Korganizer è in grado di unire in modo trasparente i dati di calendario da file differenti o altre fonti di calendario, per esempio calendari sul web. Essi possono essere opportunamente attivati, disattivati, aggiunti o rimossi dall'interfaccia grafica.Integrazione in Kontact. KOrganizer è completamente integrato in Kontact, l'applicazione completa per la gestione delle informazioni personali. All'interno di Kontact sono disponibili alcune funzionalità aggiuntive come la conversione di messaggi in eventi o cose da fare tramite trascinamento.Modello di memorizzazione. KOrganizer ha un calendario persistente. L'utente non deve preoccuparsi di caricare o salvare il calendario. Le modifiche sono salvate immediatamente su disco. Se il calendario viene modificato esternamente, è immediatamente caricato e aggiornato nella vista. Un meccanismo di blocco gestisce l'accesso concomitante al calendario.Azioni di annullamento e ripetizione. KOrganizer supporta azioni illimitate di annullamento e ripetizione.Integrazione delle cose da fare con la vista agenda. Le cose da fare sono mostrate nelle viste settimanali e giornaliere. Le cose da fare possono essere convertite in eventi trascinandole dall'elenco delle cose da fare alla vista agenda.Allegati per eventi e cose da fare. I riferimenti alle pagine web, ai file locali o i messaggi di posta possono essere allegati agli eventi o alle cose da fare. I dati allegati possono essere facilmente aperti con un singolo clic dalla vista eventi e cose da fare, così come dalla vista di riepilogo o dai compositoriVoce delle cose da fare rapida. Uno speciale campo di input consente di creare rapidamente una cosa da fare senza dover aprire il compositore. Ciò è particolarmente utile per creare più cose da fare in una riga.Voce di evento rapida. Ci sono vari modi per creare eventi dalla vista agenda: possono essere creati eventi type-ahead selezionando un intervallo di tempo e poi semplicemente iniziando a digitare. Verrà aperto il compositore e il testo digitato sarà inserito nel titolo. Opzionalmente, l'editor degli eventi può essere aperto quando la selezione di tempo è terminata e in aggiunta alle solite voci di menu e barre degli strumenti ci sono associazioni di tasti e un menu di contesto per avviare la finestra di dialogo dell'editor.Supporto di stampa. I calendari possono essere stampati utilizzando diversi stili. La stampa supporta anche i colori e la sovrapposizione degli eventi.Integrazione con KMail. KMail supporta direttamente il trasferimento in KOrganizer di inviti e altri allegati di calendario."
year_published = 2025
