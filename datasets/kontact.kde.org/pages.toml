["https://kontact.kde.org/es/components/kmail"]
title = "KMail - El paquete Kontact"
description = "KMail es un cliente de correo electrónico de última generación que se integra bien con proveedores de correo ampliamente usados, como GMail. Proporciona varias herramientas y funciones para maximizar la productividad y hacer que resulte fácil y rápido trabajar con grandes cuentas de correo. KMail implementa una gran variedad de protocolos de correo electrónico: POP3, IMAP y Microsoft Exchange (EWS), entre otros."
full_description = "KMailKMail es el componente de correo electrónico de Kontact, el gestor de información personal integrado de KDE.SeguroSeguro por omisión. La configuración predeterminada compromete más las funciones que la seguridad o la privacidad.Cifrado de extremo a extremo. El uso de OpenPGP y S/MIME está integrado, y un asistente de configuración y generación de claves ayuda al usuario a empezar a usarlos.Transporte cifrado. Por supuesto, se permite la comunicación cifrada SSL/TLS, así como un número de métodos de autenticación, como GSSAPI (Kerberos) y OAuth2.Aislamiento fuerte de contenido HTML. Si el correo electrónico en HTML no se puede evitar, KMail asegura que ninguna referencia externa se pueda ocultar en él para filtrar información o comprometer su privacidad. Además, la protección contra phishing de KMail le avisa cuando detecta enlaces sospechosos en estos mensajes.Protección contra correo no deseado. Si su servidor de correo no se ha preocupado ya por esto, KMail puede integrar detectores de correo no deseado, como SpamAssassin o Bogofilter.PotenteCapacidad de trabajo sin conexión. KMail le permite operar enteramente sin estar conectado a una red sincronizando (opcionalmente) todo su correo localmente.Múltiples identidades. KMail separa las identidades de las cuentas, proporcionándole mucha flexibilidad cuando use sombreros diferentes para múltiples organizaciones.Plantillas. Un flexible sistema de plantillas y fragmentos de texto le asiste para que pueda automatizar ciertas partes de la escritura de mensajes.Multilingüe. La traducción de contenido y la detección automática del idioma del corrector ortográfico integrados le ayudan a manejar contenido en varios idiomas.Compositor productivo. El compositor de correo electrónico de KMail contiene diversas funciones auxiliares para conferirle efectividad, como advertirle que ha olvidado incluir un archivo adjunto, la compresión en línea de archivos adjuntos o el borrado de las imágenes adjuntas.Potente filtrado. Además de la ordenación automática del correo electrónico por múltiples condiciones, el sistema de filtrado de KMail también se puede usar para implementar distintos flujos de trabajo, ya que se puede integrar con aplicaciones externas.Búsqueda y etiquetado. El marcado y el etiquetado de mensajes es de ayuda para clasificar y recuperar información, al igual que las potentes funciones de búsqueda local y remota.Gestión de listas de distribución. Las listas de correo de Mailman se pueden detectar automáticamente, mientras que las operaciones comunes de gestión de listas de distribución están disponibles de forma directa desde KMail.Configuración flexible. Las innumerables opciones de configuración le permiten realizar muchos ajustes en KMail según sus necesidades y deseos.IntegradoInvitaciones iTip. Los mensajes de invitaciones a reuniones se detectan y se ofrecen respuestas rápidas de forma directa, que por supuesto se pueden añadir a KOrganizer.Libreta de direcciones. Además de la completación automática de direcciones de correo usando KAddressBook, KMail también puede usar avatares y preferencias criptográficas desde dicho programa.Mensajes de reservas. KMail puede detectar reservas de vuelos o de hoteles de varios proveedores en el correo y ofrece la posibilidad de añadirlos al calendario.Compatible con los estándaresPermite usar los protocolos de correo estándares IMAP, POP3 y SMTP.Permite el correo electrónico push (IMAP IDLE).Permite la búsqueda completa en carpetas IMAP.Uso nativo de OpenPGP, PGP/MIME y S/MIME en línea.Permite el filtrado Sieve en el servidor."
year_published = 2025
clearnet = "https://kontact.kde.org/es/components/kmail"
