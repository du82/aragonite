["https://kontact.kde.org/eu/components/korganizer"]
title = "KOrganizer - Kontact Suitea"
description = "KOrganizer is a powerful and feature-rich organizer, event and todo manager that integrates well with the rest of Kontact, especially with KMail."
full_description = "KOrganizerKOrganizer Kontact-en egutegi eta antolaketa osagaia da. Ekitaldien eta atazen kudeaketa hornitzen du, alarma jakinarazpenak, webera esportatzea, sarearekiko gardena den datuen maneiua, talde antolaketa, egutegi fitxategiak inportatzea eta esportatzea eta gehiago. Egutegi zerbitzu anitzekin elkarlanean aritzeko gai da, tartean NextCloud, Kolab, Google Calendar eta beste batzuk. KOrganizer, zure beharren arabera, neurrira erabat egokitu dezakezu eta Kontact suitearen zati integral bat da, zein zure datu pertsonalak antolatzeko soluzio oso bat izan nahi duen. KOrganizer-rek egutegi-datuak gordetzeko eta trukatzeko bi estandar nagusiak, vCalendar eta iCalendar onartzen ditu.EzaugarriakSupport for multiple calendars and todo lists. Korganizer can transparently merge calendar data from different files or other calendar data sources for example calendars on the web. They can conveniently be activated, deactivated, added and removed from the graphical user interface.Kontact integration. KOrganizer is fully integrated with Kontact, the complete personal information management application. Within Kontact some additional features are available like conversion of mails to events or todos by drag and drop.Storage model. KOrganizer has a persistent calendar. The user doesn't have to take care of loading or saving the calendar. Changes are immediately saved to disk. If the calendar is changed externally it is automatically loaded and updated in the view. A locking mechanism handles concurrent access to the calendar.Desegin eta berregin. KOrganizer-rek desegin eta berregin mugagabeak onartzen du.Todo integration with agenda view. Todos are shown in the week and day views. Todos can be converted to events by dragging from the todo list and dropping on the agenda view.Attachments for events and todos. References to web pages, local files or mails can be attached to events and todos. The attached data can easily be accessed by a single click from the event and todo views as well as the summary view or the editorsQuick todo entry. A special input field allows to quickly create a todo without needing to open an editor. This is especially handy for creating multiple todos in a row.Quick event entry. There are several ways to create events from the agenda view: Per type-ahead events can be created by selecting a time range and then simply starting to type. An editor will be opened and the type text will be go into the title. Optionally the event editor can be opened when the time selection is finished and in addition to the usual menu and toolbar entries there are key bindings and a context menu to start the editor dialog.Inprimatzeko euskarria. Egutegiak hainbat estilo ezberdin erabiliz inprima daitezke. Inprimatzeak koloreak eta ekitaldiak gainjartzeko ere euskarria du.KMail bateratzea. KMail-ek zuzenean onartzen du KOrganizer-rerako gonbidapenen eta beste eranskin batzuen transferentzia."
