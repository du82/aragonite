["https://kontact.kde.org/pt-pt/components/kmail"]
title = "KMail - Pacote Kontact"
description = "O KMail é um cliente de e-mail topo-de-gama que se integra bem com os fornecedores de e-mail mais usados, como por exemplo o GMail. Oferece muitas ferramentas e funcionalidades para maximizar a sua produtividade e permite lidar com contas de e-mail de grande dimensão de forma simples e rápida. O KMail suporta uma grande variedade de protocolos de e-mail - POP3, IMAP, Microsoft Exchange (EWS) entre outros."
full_description = "KMailO KMail é o componente de e-mail do Kontact, o gestor de informações pessoais integrado do KDE.SeguroSeguro por Omissão. As configurações predefinidas preferem o compromisso de funcionalidades face à segurança ou privacidade.Encriptação Ponto-a-Ponto. O suporte para o OpenPGP e S/MIME vem de base e existe um assistente de configuração e geração de chaves que ajuda os utilizadores nestes passos iniciais.Encriptação do Transporte. A comunicação por SSL/TLS obviamente é suportada, assim como um conjunto de métodos de autenticação como o GSSAPI (Kerberos) ou o OAuth2.Isolamento forte do conteúdo em HTML. Se não puder evitar os e-mails em HTML, o KMail garante que não poderão ser escondidas referências externas que disseminem informação ou comprometam a sua privacidade. Adicionalmente, as protecções contra 'phishing' (burla) do KMail avisam sobre eventuais ligações suspeitas nesses e-mails.Protecção contra Lixo Electrónico. Se o seu servidor de e-mail não tomar conta disto desde já, o KMail consegue integrar algumas aplicações de detecção de lixo electrónico, como o SpamAssassin ou o Bogofilter, a nível local.PoderosoCapacidade para Funcionamento Desligado. O KMail permite-lhe funcionar por inteiro sem ter conectividade de rede, sincronizando (opcionalmente) o seu correio inteiro a nível local.Múltiplas Identidades. O KMail separa as identidades das contas, conferindo-lhe uma grande flexibilidade para usar várias identidades em várias organizações.Modelos. Um sistema flexível para modelos e excertos de texto ajudam-no a automatizar partes da composição dos seus e-mails.Multilingue. O suporte para a tradução de conteúdos e a detecção e verificação ortográfica por parágrafos ajudam-no a lidar com conteúdos em várias línguas.Compositor Produtivo. O compositor de mensagens do KMail vem com muitas pequenas ferramentas utilitárias que o ajudam a ser mais eficiente, como avisá-lo sobre anexos em falta, a compressão de anexos incorporados ou o dimensionamento das imagens em anexo.Filtragem Poderosa. Para além da automatização da organização dos seus e-mails de acordo com um conjunto de condições, o sistema de filtragem do KMail também poderá ser usado para implementar os fluxos de trabalho arbitrários, dado que pode integrar com aplicações externas.Pesquisa e Marcação. A marcação das mensagens ajudam na organização e na recuperação de informações, assim como as funcionalidades poderosas de pesquisa local e remota.Gestão de Listas de Correio. As listas de correio do Mailman podem ser detectadas automaticamente e as operações mais comuns de gestão das listas estão directamente disponíveis dentro do KMail.Configuração Flexível. Existem infinitas opções de configuração que lhe permitem afinar vários aspectos do KMail para se ajustar exactamente às suas necessidades e desejos.IntegradoConvites de iTip. Os e-mails de convites para reuniões são detectados e oferecem respostas rápidas no local, sendo obviamente integradas no KOrganizer.Livro de Endereços. Para além da completação automática do KAddressBook, o KMail também usa os avatars e definições de encriptação do mesmo.E-Mails de Reservas. O KMail consegue detectar reservas de voos ou hotéis nos e-mails de certos fornecedores e oferece-se para os adicionar ao seu calendário.Compatível com as NormasTem suporte para os protocolos-padrão de correio electrónico IMAP, POP3 e SMTP.Suporte para o envio de e-mail proactivo (IMAP IDLE).A pesquisa nas pastas de IMAP é totalmente suportada.Suporte nativo para o OpenPGP incorporado, PGP/MIME e S/MIME.Suporte para a filtragem de correio no servidor por Sieve."
year_published = 2025
clearnet = "https://kontact.kde.org/pt-pt/components/kmail"
