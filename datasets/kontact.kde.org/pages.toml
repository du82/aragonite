["https://kontact.kde.org/it/components/kmail"]
title = "KMail - Suite Kontact"
description = "KMail rappresenta lo stato dell'arte dei programmi di posta elettronica che si integra bene con i fornitori di posta elettronica più utilizzati, come GMail. Fornisce molti strumenti e funzionalità per massimizzare la tua produttività e rende facile e veloce il lavoro con i grossi account di posta. KMail supporta molti protocolli di posta elettronica: POP3, IMAP, Microsoft Exchange (EWS) e altri."
full_description = "KMailKMail è il componente di posta elettronica di Kontact, il gestore delle informazioni personali di KDE.SicuroSicuro in modo predefinito. Le impostazioni predefinite scendono a compromessi sulle funzionalità piuttosto che sulla sicurezza o la riservatezza.Cifratura continua. Supporto incorporato per OpenPGP e S/MIME, e una procedura guidata per la configurazione e la generazione di chiavi che aiuta gli utenti alle prime armi con questi aspetti.Cifratura del trasporto. La comunicazione cifrata SSL/TLS è, ovviamente, supportata, e sono presenti vari metodi di autenticazione, come GSSAPI (Kerberos) o OAuth2.Forte isolamento del contenuto HTML. Se i messaggi in HTML non possono essere evitati, KMail assicura che i riferimenti esterni non vengano nascosti all'interno, con conseguenti fuoriuscite di informazioni o compromissione della tua privacy. In aggiunta, le protezioni antiphishing di KMail ti avvisano sui collegamenti sospetti nei messaggi.Protezione contro lo spam. Se il tuo server di posta elettronica non se ne occupa già, KMail è in grado di integrare localmente i popolari analizzatori di spam quali SpamAssassin o Bogofilter.AvanzatoCapacità fuori linea. KMail ti permette di operare senza alcuna connessione di rete, sincronizzando (opzionalmente) in locale tutta la tua posta elettronica.Identità multiple. KMail separa le identità dagli account, offrendoti molta flessibilità quando ricopri ruoli diversi in più organizzazioni.Modelli. Un sistema di modelli flessibili e di testi preconfezionati ti aiuta ad automatizzare parte della stesura di un messaggio di posta elettronica.Multilingue. Il supporto incorporato alla traduzione e il rilevamento automatico per la correzione ortografica dei paragrafi ti aiutano quando devi gestire il contenuto dei messaggi in più lingue.Compositore produttivo. Il compositore di posta elettronica di KMail è distribuito con tanti piccoli assistenti per rendere il tuo lavoro più efficiente, per esempio l'avviso di allegato mancante, la compressione degli allegati incorporati o il ridimensionamento delle immagini allegate.Filtraggio avanzato. Oltre l'automatizzazione dell'ordinamento dei messaggi sulla base di condizioni multiple, il sistema di filtri di KMail può essere utilizzato anche per implementare flussi di lavoro arbitrari, dato che è integrabile con applicazioni esterne.Ricerca ed etichettatura. L'attribuzione di stati ed etichette aiuta l'ordinamento e il recupero delle informazioni, e lo stesso vale per le capacità avanzate di ricerca locale e remota.Gestione delle mailing list. È possibile rilevare automaticamente le mailing list Mailman, mentre le comuni operazioni per la loro gestione sono disponibili direttamente all'interno di KMail.Configurazione flessibile. Le innumerevoli opzioni di configurazione ti permettono di regolare molti aspetti di KMail, in modo da adattarlo esattamente alle tue necessità e ai tuoi gusti.IntegratoInviti iTip. I messaggi di invito alle riunioni vengono rilevati e offrono risposte rapide, e vengono ovviamente memorizzati all'interno di KOrganizer.Rubrica. Oltre al completamento automatico degli indirizzi da KAddressBook, KMail ne sfrutta anche gli avatar e le preferenze di cifratura.Messaggi di prenotazione. KMail può rilevare le prenotazioni di voli o hotel nei messaggi inviati da certi fornitori e propone di aggiungerli al tuo calendario.Conforme agli standardSupporta i protocolli di posta elettronica standard IMAP, POP3 e SMTP.Supporta il push dei messaggi (IMAP IDLE).Ricerca nelle cartelle IMAP completamente supportata.Supporto nativo OpenPGP in linea, PGP/MIME e S/MIME.Supporto per filtraggio Sieve lato server."
year_published = 2025
