title = "Akregator - Комплекс програм Kontact"
description = "Akregator — програма для читання подач RSS. Програма може автоматично отримувати дані подач RSS з ваших улюблених сайтів і уможливлює читання статей, навіть коли ви не маєте з'єднання з інтернетом. Також програма надає широкі можливості з пошуку та архівування."
full_description = "AkregatorAkregator допоможе вам тримати руку на пульсі подій за допомогою нових статей на сайтах, подібних до KDE Dot News та блогів Planet KDE. Використаною для цього технологією є RSS. Підтримку цієї технології передбачено на багатьох сайтах.МожливостіПростота у користуванніМоже приймати десятки подачМоже сповіщати вас про непрочитані подачіВикористовує вкладки для надання доступу до вбудованого читання статей повністюАрхів подачІмпортування та експортування подач"
