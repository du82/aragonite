["https://kontact.kde.org/fi/components/kmail"]
title = "KMail - Kontact-ohjelmisto"
description = "KMail is a state-of-the-art email client that integrates well with widely used email providers like GMail. It provides many tools and features to maximize your productivity and makes working with large email accounts easy and fast. KMail supports a large variety of email protocols - POP3, IMAP, Microsoft Exchange (EWS) and more."
full_description = "KMailKMail is the email component of Kontact, the integrated personal information manager from KDE.SecureSecure Default. Default settings rather compromise on features than security or privacy.End-to-end Encryption. Support for OpenPGP and S/MIME is built-in, and a setup and key generation wizard aids users in getting started with this.Transport Encryption. SSL/TLS encrypted communication is of course supported, as are a number of authentication methods such as GSSAPI (Kerberos) or OAuth2.Strong isolation of HTML content. If HTML emails can't be avoided, KMail ensures no external references can be hidden in there to leak information or compromise your privacy. Additionally KMail's phishing protections warns about suspicious links in such emails.Spam Protection. If your email server doesn't take care of this already, KMail can integrate popular spam checkers such as SpamAssassin or Bogofilter locally.TehokasOffline Capable. KMail allows you to operate entirely without network connectivity by (optionally) syncing your entire email locally.Useat henkilöydet. KMail erottaa henkilöydet tileistä, mikä antaa joustovaraa eri organisaatiorooleihin .Mallipohjat. Joustava mallipohja- ja tekstileikejärjestelmä tukee sähköpostiviestien automatisointia.Monikielinen. Sisään rakennettu kansainvälistämistuki ja oikeinkirjoituksen tarkistus kappaleittaisella automaattitunnistuksella tukee sinua painiskellessasi monikielisen sisällön kanssa.Productive Composer. KMail's email composer comes with many small helpers to make you more efficient, such as warning about forgotten attachments, inline attachment compression or resizing of attached images.Powerful Filtering. Besides automating the sorting of your emails by a multitude conditions, KMail's filtering system can also be used for implementing arbitrary workflows as it can integrate with external applications.Searching and Tagging. Flagging and tagging of messages aid in sorting and information recovery, and so do the powerful local and remote searching capabilities.Mailing List Management. Mailman mailing lists can be auto-detected and common mailing list management operations are directly available from within KMail.Flexible Configuration. Countless configurations options allow you to tweak many aspects of KMail to exactly your needs and wishes.IntegroituusiTip-kutsut. Tapahtumakutsuviestit tunnistetaan ja niihin tarjotaan pikavastauksia, jotka tietysti välitetään myös KOrganizeriin.Osoitekirja. Paitsi automaattitäydentää KAddressBookin osoitteita, KMail osaa myös käyttää sen avatareja ja salausvalintoja.Booking Emails. KMail can detect flight or hotel reservations in emails from certain providers and offers to add them to your calendar.Standardien mukainenTukee IMAP-, POP3- ja SMTP-sähköpostiyhteyskäytäntöstandardeja.Supports push email (IMAP IDLE).Tukee täysin hakuja IMAP-kansioissa.Natiivi upotetun OpenPGP:n, PGP/MIMEn ja S/MIMEn tuki.Palvelinpuolen Sieve-suodatuksen tuki."
