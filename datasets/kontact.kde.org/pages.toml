["https://kontact.kde.org/ca-va/components/akregator"]
title = "Akregator - Paquet Kontact"
description = "Akregator és un lector de canals RSS. Pot descarregar automàticament els canals RSS dels llocs preferits i permet llegir els articles fins i tot quan esteu fora de línia. També proporciona una funcionalitat de busca avançada i característiques d'arxiu."
full_description = "AkregatorAkregator ajuda a mantindre-vos informats sobre històries noves en llocs web com ara KDE Dot News i els blogs del Planet KDE. La tecnologia utilitzada és RSS i molts llocs la implementen.CaracterístiquesSenzill d'utilitzarPot acceptar dotzenes de canalsPot notificar-vos els canals no llegitsUtilitza les pestanyes per a donar accés a la lectura interna de les històries completesArxiu de canalsImporta i exporta canals Akregator ajuda a mantindre-vos informats sobre històries noves en llocs web com ara KDE Dot News i els blogs del Planet KDE. La tecnologia utilitzada és RSS i molts llocs la implementen. Mantingut pels administradors web de KDE (llista de correu pública). KDE® i el logotip de K Desktop Environment® són marques comercials registrades de la KDE e.V. | Avís legal"
