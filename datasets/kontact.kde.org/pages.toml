["https://kontact.kde.org/fr"]
title = "Suite Kontact - La puissante solution de gestion des données personnelles (PIM)"
description = "Kontact - Gérez tous vos courriels, agendas et contacts dans une seule fenêtre."
full_description = "KMailAugmentez votre productivité avec une application de messagerie riche en fonctionnalités.Plus d'informations KOrganizerOrganisez votre temps ! Gérez vos évènements et vos tâches à faire, planifiez vos réunions et bien plus encore.Plus d'informations AkregatorRestez au courant de l'actualité grâce à notre lecteur de flux « RSS ».Plus d'informations Gérez vos courriels, votre agenda, vos contacts et autres données personnelles avec Kontact. Kontact regroupe tout en un seul endroit et vous aide à gérer vos communications, à organiser votre journée et à travailler avec vos collègues. Devenez plus productif avec Kontact.KontactKontact unifie toutes nos applications « PIM » en une seule fenêtre pour vous offrir la meilleure expérience possible et augmenter votre productivité. Avec Kontact, vous pouvez utiliser tous les outils de notre puissante suite en un seul endroit. Contrairement aux applications Internet propriétaires, nous respectons votre vie privée et prenons en charger les standards ouverts. C'est la raison pour laquelle Kontact vous donne un contrôle total sur vos données. Vous pouvez bien sûr accéder à vos données hors ligne si vous le souhaitez.Plus d'informationsKMailKMail est un client de messagerie ultramoderne s'intégrant parfaitement aux fournisseurs largement utilisés de messagerie électronique comme GMail. Il fournit de nombreux outils et fonctionnalités pour maximiser votre productivité et pour travailler avec de grands comptes de messagerie, de façon simple et rapide. KMail prend en charge une grande variété de protocoles de messagerie, comme « POP3 », « IMAP », « Microsoft Exchange (EWS) » et de nombreux autres.Plus d'informationsKAddressBookKAddressBook vous permet de gérer facilement vos contacts. Il est profondément profondément intégré au reste de Kontact, ce qui vous permet de sélectionner facilement vos contacts lors de l'envoi d'un courriel ou de la création d'une invitation à une réunion.Plus d'informationsKOrganizerKOrganizer est un organisateur, un gestionnaire d'évènements et de tâches à faire, puissant et riche en fonctionnalités, s'intégrant parfaitement avec le reste de Kontact, en particulier avec KMail.Plus d'informationsAkregatorAkregator est un lecteur de flux « RSS ». Il peut télécharger automatiquement les flux « RSS » de vos sites préférés. Il vous permet de lire les articles même lorsque vous êtes hors ligne. Il offre également des fonctionnalités très riches de recherche et d'archivage.Plus d'informationsActualitéSamedi, 9 Novembre 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Plus d'informationsLundi, 2 Septembre 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releasePlus d'informationsJeudi, 4 Juillet 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Plus d'informationsMardi, 7 Mai 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Plus d'informations📢 Afficher toutes les nouvelles"
