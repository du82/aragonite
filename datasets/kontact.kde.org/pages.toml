["https://kontact.kde.org/sl/components/kmail"]
title = "KMail - Kontact Suite"
description = "KMail je najsodobnejši e-poštni odjemalec, ki se dobro integrira s široko uporabljenimi ponudniki e-pošte, kot je GMail. Zagotavlja številna orodja in funkcije za povečanje vaše produktivnosti ter omogoča enostavno in hitro delo z velikimi e-poštnimi računi. KMail podpira veliko različnih e-poštnih protokolov – POP3, IMAP, Microsoft Exchange (EWS) in drugo."
full_description = "KMailKMail je e-poštna komponenta Kontacta, integriranega upravitelja osebnih podatkov iz KDE.VarnoPrivzeto varno. Privzete nastavitve bolj omejujejo funkcije kot varnost ali zasebnost.Šifriranje od konca do konca. Podpora za OpenPGP in S/MIME je vgrajena, čarovnik za nastavitev in generiranje ključev pa uporabnikom pomaga pri začetku tega.Šifriranje transporta. Šifrirana komunikacija SSL/TLS je seveda podprta, prav tako tudi številne metode preverjanja pristnosti, kot sta GSSAPI (Kerberos) ali OAuth2.Močna izolacija vsebine HTML. Če se e-poštnim sporočilom HTML ni mogoče izogniti, KMail zagotavlja, da tam ne bodo skrite nobene zunanje reference, ki bi razkrile informacije ali ogrozile vašo zasebnost. Poleg tega KMailova zaščita pred lažnim predstavljanjem opozarja na sumljive povezave v takih e-poštnih sporočilih.Zaščita pred neželeno pošto. Če vaš e-poštni strežnik za to še ne poskrbi, lahko KMail lokalno integrira priljubljena preverjanja neželene pošte, kot sta SpamAssassin ali Bogofilter.ZmogljivZmogljivo brez povezave. KMail vam omogoča, da delujete popolnoma brez omrežne povezave, tako da (izbirno) lokalno sinhronizirate celotno e-pošto.Več identitet. KMail ločuje identitete od računov, kar vam omogoča veliko prilagodljivosti pri predstavljanju različnih vlog v več organizacijah.Predloge. Prilagodljiva predloga in sistem izrezkov besedila vas podpirata pri avtomatizaciji delov pisanja e-pošte.Večjezično. Vgrajena podpora za prevajanje vsebine in samodejno zaznavanje jezika za preverjanje črkovanja po odstavkih vas podpirata pri obravnavanju vsebine v več jezikih.Produktiven sestavljalnik. KMail-ov e-poštni sestavljalnik ima veliko majhnih pomočnikov, ki vam bodo naredili učinkovitejši, na primer opozorilo o pozabljenih prilogah, stiskanje prilog v vrstici ali spreminjanje velikosti priloženih slik.Zmogljivo filtriranje. Poleg avtomatizacije razvrščanja vaših e-poštnih sporočil glede na številne pogoje se lahko KMailov sistem filtriranja uporablja tudi za izvajanje poljubnih delovnih tokov, saj se lahko integrira z zunanjimi aplikacijami.Iskanje in označevanje. Označevanje in označevanje sporočil pomaga pri razvrščanju in obnavljanju informacij, kakor tudi velike zmogljivosti lokalnega in oddaljenega iskanja.Upravljanje poštnih seznamov. Mailmanove poštne sezname je mogoče samodejno zaznati in običajne operacije upravljanja poštnih seznamov so na voljo neposredno v KMailu.Prilagodljiva konfiguracija. Nešteto možnosti konfiguracije vam omogoča, da prilagodite številne vidike KMaila točno vašim potrebam in željam.IntegriranoPovabila iTip. E-poštna sporočila s povabilom na sestanke so zaznana in ponujajo hitre odgovore na mestu ter se seveda vnesejo v KOrganizer.Addressbook. Poleg samodejnega dopolnjevanja naslova iz KAddressBook, KMail uporablja tudi avatarje in kripto preference od tam.E-poštna sporočila o rezervacijah. KMail lahko zazna rezervacije letov ali hotelov v e-poštnih sporočilih določenih ponudnikov in ponuja, da jih dodate v svoj koledar.Skladno s standardiPodpira standardne poštne protokole IMAP, POP3 in SMTP.Podpira potisno e-pošto (IMAP IDLE).Iskanje v mapah IMAP je v celoti podprto.Domorodna podpora za vdelane OpenPGP, PGP/MIME in S/MIME.Podpora za filtriranje na strani strežnika Sieve."
year_published = 2025
