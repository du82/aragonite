["https://kontact.kde.org/tr/components/korganizer"]
title = "K Organizatör - Kontak Takımı"
description = "K Organizatör; Kontak’ın geri kalanıyla, özellikle K Posta ile iyi tümleşen, güçlü ve zengin özelliklere sahip bir düzenleyici, etkinlik ve yapılacaklar yöneticisidir."
full_description = "K OrganizatörK Organizatör, Kontak’ın takvim ve zamanlama bileşenidir. Olayların ve görevlerin yönetimini, alarm bildirimlerini, Web’e dışa aktarmayı, verilerin ağa saydam bir biçimde işlenmesini, grup planlamasını, takvim dosyalarını içe ve dışa aktarmayı ve daha fazlasını sağlar. NextCloud, Kolab, Google Takvim ve diğerleri dahil olmak üzere çok çeşitli takvim hizmetleriyle birlikte çalışabilir. K Organizatör, gereksinimlerinize göre tümüyle özelleştirilebilir ve kişisel verilerinizi düzenlemek için eksiksiz bir çözüm olmayı amaçlayan Kontak paketinin ayrılmaz bir parçasıdır. K Organizatör, takvim verilerini depolamak ve değiş tokuş etmek için iki yaygın standardı, vCalendar’ı ve iCalendar’ı destekler.ÖzelliklerBirden çok takvim ve yapılacaklar listesi desteği. K Organizatör, farklı dosyalardan veya diğer takvim verisi kaynaklarından, örneğin Web’deki takvimler gibi, takvim verilerini saydam bir şekilde birleştirebilir. Grafiksel kullanıcı arayüzünden kolayca etkinleştirilebilir, devre dışı bırakılabilir, eklenebilir ve kaldırılabilirler.Kontak tümleştirmesi. K Organizatör, eksiksiz kişisel bilgi yönetimi uygulaması olan Kontak ile tümüyle tümleşiktir. Kontak içinde, postaların sürükleyip bırakarak etkinliklere veya yapılacaklara dönüştürülmesi gibi bazı ek özellikler vardır.Depolama modeli. K Organizatör’ün kalıcı bir takvimi vardır. Kullanıcı, takvimi yüklemek veya kaydetmekle uğraşmak zorunda değildir. Değişiklikler hemen diske kaydedilir. Takvim dışarıdan değiştirilirse görünümde kendiliğinden yüklenir ve güncellenir. Bir kilitleme mekanizması, takvime eşzamanlı erişimi yönetir.Geri Al ve Yinele. K Organizatör, sınırsız geri alma ve yinelemeyi destekler.Ajanda görünümüyle yapılacaklar tümleştirmesi. Yapılacaklar hafta ve gün görünümlerinde gösterilir. Yapılacaklar, yapılacaklar listesinden sürüklenip ajanda görünümüne bırakılarak etkinliklere dönüştürülebilir.Etkinlikler ve yapılacak işler için ekler. Web sayfalarına, yerel dosyalara veya postalara yapılan başvurular, etkinliklere ve yapılacak işlere eklenebilir. Eklenen verilere, etkinlik ve yapılacaklar görünümlerinin yanı sıra özet görünümden veya düzenleyicilerden tek bir tıklama ile kolaylıkla erişilebilir.Hızlı yapılacaklar girişi. Özel bir giriş alanı, bir düzenleyici açmaya gerek kalmadan hızlı bir şekilde yapılacaklar oluşturmaya olanak tanır. Bu özellikle art arda birden çok yapılacak işler oluşturmak için kullanışlıdır.Hızlı etkinlik girişi. Gündem görünümünden etkinlik oluşturmanın birkaç yolu vardır: Yazı başına olaylar, bir zaman aralığı seçip ardından yazmaya başlayarak oluşturulabilir. Bir düzenleyici açılacak ve tür metni başlığa girilecektir. İsteğe bağlı olarak olay düzenleyici, zaman seçimi bittiğinde açılabilir ve olağan menü ve araç çubuğu girişlerine ek olarak, düzenleyici iletişim kutusunu başlatmak için düğme bağıntıları ve bir bağlam menüsü vardır.Yazdırma desteği. Takvimler, çeşitli biçemler kullanılarak yazdırılabilirler. Yazdırma aynı zamanda renkleri ve üst üste binen etkinlikleri de destekler.K Posta tümleştirmesi. K Posta, davetlerin ve diğer takvim eklerinin K Organizatör’e doğrudan aktarımını destekler."
