["https://kontact.kde.org/sl/components/kaddressbook"]
title = "KAddressBook - Kontact Suite"
description = "KAddressBook vam omogoča enostavno upravljanje stikov. Je globoko integriran z ostalim Kontactom, kar vam omogoča, da preprosto izberete svoje stike, ko pošiljate e-pošto ali ustvarjate vabilo na sestanek."
full_description = "KAddressBookKAddressBook shranjuje vse osebne podatke vaše družine, prijateljev in drugih stikov. Podpira veliko različnih storitev, vključno z NextCloud, Kolab, Google Contacts, Microsoft Exchange (EWS) ali katerikoli standardni strežnik CalDAV.ZmožnostiZmogljivo iskanje. KAdresbook ima nastavljive filtre in zmogljive možnosti iskanja.Zaznavanje in združevanje podvojenih. KAdressbook lahko najde podvojene stike iz več virov in jih lahko združi v en sam stik.Integracija. Integrira z drugimi komponentami Kontacta, npr. izvozi opomnike za rojstni dan v KOrganizer.Kode QR. KAddressbook lahko prikaže QR kodo za vsak stik, da jo hitro optično prebere v telefon ali pošlje nekomu.Dobra podpora standardov. KAdresbook lahko uvozi in izvaža stike iz in v skoraj vsak standardni imenik.Integracija LDAP. Lahko se poveže z več strežniki LDAP, ki se nato lahko uporabijo za samodejno dokončanje stika pri sestavljanju e-pošte v KMail."
