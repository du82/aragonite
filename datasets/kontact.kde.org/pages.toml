["https://kontact.kde.org/pt-pt"]
title = "Pacote Kontact - A Solução Poderosa de PIM"
description = "Kontact - faça a gestão dos seus e-mails, calendários e contactos dentro de uma única janela"
full_description = "KontactFaça a gestão dos seus e-mails, calendários e contactos dentro de uma única janela.Saber mais KOrganizerOrganize o seu tempo! Faça a gestão dos eventos, itens por-fazer, agende reuniões, entre outras coisas.Saber mais Faça a gestão do seu e-mail, calendário, contactos e outros dados pessoais com o Kontact. O Kontact agrupa tudo em conjunto num único local e ajuda-o a gerir as suas comunicações, organizar o seu dia e trabalhar com os seus colegas. Torne-se mais produtivo com o Kontact.KontactO Kontact unifica todas as nossas aplicações de PIM numa única janela para lhe dar a melhor experiência possível e aumentar a sua produtividade. Com o Kontact, poderá usar todas as ferramentas do nosso pacote poderoso num único local. Ao contrário das aplicações Web proprietárias, valorizamos a sua privacidade e o suporte para padrões abertos, e é por isso que o Kontact lhe dá o controlo total sobre os seus dados. Poderá obviamente aceder aos seus dados desligado da rede, se o desejar.Ler maisKMailO KMail é um cliente de e-mail topo-de-gama que se integra bem com os fornecedores de e-mail mais usados, como por exemplo o GMail. Oferece muitas ferramentas e funcionalidades para maximizar a sua produtividade e permite lidar com contas de e-mail de grande dimensão de forma simples e rápida. O KMail suporta uma grande variedade de protocolos de e-mail - POP3, IMAP, Microsoft Exchange (EWS) entre outros.Ler maisKAddressBookO KAddressBook permite-lhe gerir os seus contactos de forma simples. Está completamente integrado com o resto do Kontact, permitindo-lhe escolher facilmente os seus contactos ao enviar um e-mail ou ao criar um convite para uma reunião.Ler maisKOrganizerO KOrganizer é um organizador, um gestor de eventos e tarefas poderoso e rico em funcionalidades e que se integra bem com o resto do Kontact, especialmente com o KMail.Ler maisAkregatorO Akregator é um leitor de fontes RSS. Consegue transferir automaticamente as fontes de RSS das suas páginas favoritas e permite-lhe ler os artigos mesmo quando está desligado da rede. Fornece também funcionalidades de pesquisa e arquivo poderosas.Ler maisNotíciasSábado, 9 de Novembro de 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Ler MaisSegunda, 2 de Setembro de 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseLer MaisQuinta, 4 de Julho de 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Ler MaisTerça, 7 de Maio de 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Ler Mais📢 Ver todas as notícias"
