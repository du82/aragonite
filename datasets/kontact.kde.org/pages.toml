["https://kontact.kde.org/fi/components/akregator"]
title = "Akregator - Kontact-ohjelmisto"
description = "Akregator on RSS-syötelukija. Se osaa automaattisesti ladata suosikkisivustojesi RSS-syötteet ja antaa lukea artikkelit myös verkkoyhteydettä. Se tarjoaa monipuoliset haku- ja arkistointiominaisuudet."
