full_description = "AkregatorAkregator vam pomaga, da ste obveščeni o novih zgodbah na spletnih mestih, kot sta KDE Dot News in blogih Planet KDE. Uporabljena tehnologija je RSS in številna spletna mesta jo podpirajo.ZmožnostiPreprosta uporabaLahko sprejme na desetine virovLahko vas obvesti o neprebranih virihUporablja zavihke za dostop do notranjega branja celotnih zgodbArhiv virovUvoz in izvoz virov Akregator vam pomaga, da ste obveščeni o novih zgodbah na spletnih mestih, kot sta KDE Dot News in blogih Planet KDE. Uporabljena tehnologija je RSS in številna spletna mesta jo podpirajo. Vzdržujejo skrbniki spleta KDE (javni poštni seznam). KDE® in logotip K Desktop Environment® so registrirane blagovne znamke KDE e.V. | Pravne zadeve"
