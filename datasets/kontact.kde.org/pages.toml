["https://kontact.kde.org/ca-va/get-involved"]
title = "Col·laboreu-hi - Paquet Kontact"
description = "El codi font de Kontact s'estén a través de molts components en molts repositoris: és fàcil perdre's i aclaparar-se si sou nou. Si voleu involucrar-vos en el desenvolupament de Kontact senzillament llegiu els materials enllaçats des d'esta pàgina i poseu-vos en contacte amb nosaltres: vos ajudarem a trobar el camí pel nostre codi base."
full_description = "Col·laboreu-hiEl codi font de Kontact s'estén a través de molts components en molts repositoris: és fàcil perdre's i aclaparar-se si sou nou. Si voleu involucrar-vos en el desenvolupament de Kontact senzillament llegiu els materials enllaçats des d'esta pàgina i poseu-vos en contacte amb nosaltres: vos ajudarem a trobar el camí pel nostre codi base.Comenceu llegint informació sobre el wiki de la comunitat KDE PIM.Oportunitats de faenaBusqueu algunes tasques senzilles per a començar a millorar Kontact? Llavors revises les nostres oportunitats de faena. Hem arreplegat una sèrie de tasques que són bastant senzilles i aïllades i no requerixen una comprensió en profunditat de tota la base de codis i l'arquitectura, un punt d'entrada perfecte en el món de Kontact.Si voleu començar a treballar en alguna tasca, vos la podeu assignar a vosaltres mateixos (a menys que ja estiga assignada a algú altre) i feu-nos-ho saber en els comentaris de davall la tasca.Construcció de l'aplicació Kontact a partir del codi fontSeguiu esta Guia de com començar amb el desenvolupament de Kontact. Conté enllaços cap a moltes altres pàgines wiki útils amb molta informació.També tenim un entorn Docker de manera que podreu desenvolupar i provar Kontact en un aïllament segur de la vostra configuració de producció.Mantindre's en contacte!Els desenvolupadors de Kontact generalment es troben pels canals d'IRC #kontact i #akonadi en el xat de Libera. La majoria dels debats relacionats amb el desenvolupament tenen lloc en la llista de correu kde-pim. Uniu-vos, digueu hola i expliqueu-nos en què vos agradaria ajudar-nos!No sou programador?No és cap problema! Hi ha moltes altres tasques en què podeu ajudar a fer millor Kontact si no coneixeu cap llenguatge de programació!Triatge d'errors: ajudeu-nos a buscar informes d'error incomplets, duplicats o no vàlids en BugzillaLocalització: ajudeu a traduir l'aplicació Kontact al vostre idiomaDocumentació: ajudeu-nos a millorar la documentació d'usuari per a fer l'aplicació Kontact més fàcil d'emprar per als nouvingutsPromoció: ajudeu-nos a promocionar l'aplicació Kontact tant en línia com fora de líniaActualització del wiki: ajudeu a actualitzar la informació present en el wiki, afegir guies d'aprenentatge noves… per a facilitar que altres s'unisquen!Teniu altres idees? Contacteu amb nosaltres!"
year_published = 2025
