["https://kontact.kde.org/tr/components/kmail"]
title = "K Posta - Kontak Takımı"
description = "K Posta, tüm yaygın kullanılan e-posta sağlayıcılarıyla kolaylıkla tümleşen çağdaş bir e-posta istemcisidir. Üretkenliğinizi artırmak için birçok araçlar ve özellikler içerir ve büyük e-posta hesaplarıyla çalışmayı hızlı ve kolay yapar. K Posta, birçok e-posta protokolünü destekler — POP3, IMAP, Microsoft Exchange (EWS) ve çok daha fazlası."
full_description = "K PostaK Posta, KDE’nin tümleşik kişisel veri yönetimi uygulaması olan Kontak’ın e-posta bileşenidir.GüvenliHep güvenli. Öntanımlı ayarlar, daha çok özellik yerine daha güvenli ve gizli bir deneyime öncelik verir.Uçtan uca şifreleme. OpenPGP ve S/MIME desteği gömülü olarak gelir ve bir ayarlama ve anahtar oluşturma sihirbazı kullanıcılara başlarken yardımcı olur.Taşıma şifreleme. SSL/TLS şifrelenmiş iletişim yöntemleri (elbette) desteklenir; bunların dışında GSSAPI (Kerberos) veya OAuth2 desteği de vardır.Güçlü HTML içeriği izolasyonu. HTML e-postalardan kaçışınız yoksa K Posta, bilgi sızdırma veya gizliliğinizi bozma amaçlı hiçbir dış başvurunun olmadığından emin olur. Ek olarak, K Posta’nın oltalama koruması, bu tür e-postalarda olabilecek kuşkulu bağlantılarla ilgili sizi uyarır.İstenmeyen posta koruması. E-posta sunucunuz bununla ilgilenmiyorsa K Posta yerel olarak SpamAssassin veya Bogofilter gibi popüler istenmeyen posta denetleyicilerle tümleşebilir.GüçlüÇevrimdışı çalışabilir. K Posta, tüm e-postalarınızı yerel olarak eşzamanlayarak tümüyle ağ bağlantısı olmadan çalışmanıza izin verir.Çoklu kimlikler. K Posta, kimlikleri hesaplardan ayrı tutar; böylece birden çok organizasyon için çok farklı kimliklere bürünebilirsiniz.Şablonlar. Esnek bir şablon ve metin kırpma sistemi, sizi e-posta yazımınızı otomatikleştirmeniz konusunda yardımcı olur.Çok dilli. Gömülü çeviri desteği ve paragraf başı yazım denetimi dili algılama desteği, siz birden çok dilde e-postalarla uğraşırken işinizi kolaylaştırır.Üretken e-posta yazıcısı. K Posta’nın e-posta yazıcısı, sizin daha efektif çalışmanızı sağlamak için birçok ufak yardımcıyla gelir; örneğin unutulmuş ekler, satır içi ek sıkıştırması veya eklenen görsellerin yeniden boyutlandırılması gibi.Güçlü süzme. K Posta’nın süzgeç sistemi, e-postalarınızı çok sayıda koşula göre otomatikleştirmenin yanı sıra, dış uygulamalarla tümleşebildiğinden, isteğe bağlı iş akışlarını uygulamak için de kullanılabilir.Arama ve etiketleme. İletilerin bayraklanması ve etiketlenmesi, güçlü yerel ve uzak arama yetenekleri; sıralamada ve bilgi kurtarmada size yardımcı olur.Posta listesi yönetimi. Mailman posta listeleri otomatik olarak algılanabilir ve genel posta listesi yönetimi işlemleri doğrudan K Posta içinden kullanılabilir.Esnek yapılandırma. Sayısız yapılandırma seçeneği, K Posta’nın birçok yönünü tam olarak gereksinim ve isteklerinize göre ayarlamanıza olanak tanır.TümleşikiTip davetleri. Toplantı daveti e-postaları algılanıp yerinde hızlı yanıtlar sunulur ve elbette K Organizatör içine beslenir.Adres defteri. K Adres Defteri içinden adresleri otomatik tamamlama desteğinin yanı sıra, K Posta ayrıca avatarları ve şifreleme tercihlerini de oradan alır.Rezervasyon e-postaları. K Posta, çeşitli sağlayıcılardan olan uçuş veya otel rezervasyonlarını algılayabilir ve onları takviminize eklemeyi önerir.Standartlara UygunStandart IMAP, POP3 ve SMTP posta protokollerini destekler.Anlık e-posta iletmeyi destekler (IMAP IDLE).IMAP klasörleri içinde arama tümüyle desteklenir.Yerel satır içi OpenPGP, PGP/MIME ve S/MIME desteği.Sieve sunucu tarafı süzme desteği."
