["https://kontact.kde.org/pl/components/kmail"]
title = "KMail - Pakiet Kontact"
description = "KMail jest najnowocześniejszym klientem poczty elektronicznej, który dobrze integruje się z powszechnie dostępnymi dostawcami poczty, takimi jak GMail. Udostępnia wiele narzędzi i funkcji, które maksymalizują wydajność pracy i sprawiają, że praca z dużymi kontami pocztowymi jest łatwa i szybka. KMail obsługuje wiele różnych protokołów poczty elektronicznej - POP3, IMAP, Microsoft Exchange (EWS) i wiele innych."
full_description = "KMailKMail jest składnikiem poczty elektronicznej Kontactu, zintegrowanego menedżera informacji osobistych, od KDE.BezpiecznyBezpieczne ustawienia domyślne. Ustawienia domyślne są raczej kompromisem w zakresie funkcji niż bezpieczeństwa czy prywatności.Szyfrowanie typu end-to-end. Obsługa protokołów OpenPGP i S/MIME jest wbudowana, a kreator konfiguracji i generowania kluczy pomaga użytkownikom w rozpoczęciu z tym pracy.Szyfrowanie transportu. Komunikacja szyfrowana protokołem SSL/TLS jest oczywiście obsługiwana, podobnie jak wiele metod uwierzytelniania, takich jak GSSAPI (Kerberos) lub OAuth2.Silna izolacja zawartości HTML. Jeśli nie da się uniknąć wysyłania wiadomości HTML, KMail gwarantuje, że nie zostaną w nich ukryte żadne zewnętrzne odnośniki, z których mogłyby wyciec informacje lub któremogłyby naruszyć twoją prywatność. Dodatkowo ochrona KMail przed phishingiem ostrzega przed podejrzanymi linkami w takich wiadomościach.Ochrona przed spamem. Jeśli Twój serwer pocztowy jeszcze o to nie zadbał, KMail może lokalnie zintegrować popularne programy sprawdzające spam, takie jak SpamAssassin czy Bogofilter lokalnie.PotężnyOffline Capable. KMail umożliwia pracę bez połączenia z siecią, poprzez (opcjonalnie) synchronizację całej poczty lokalnie.Wile tożsamości. KMail oddziela tożsamość od konta, co daje Ci dużą elastyczność, gdy posiadasz różne tożsamości w wielu organizacjach.Szablony. Elastyczny system szablonów i wycinków tekstu pomaga w automatyzacji niektórych etapów pisania wiadomości e-mail.Wielojęzykowość. Wbudowana obsługa tłumaczenia treści orazautomatyczne sprawdzanie pisowni dla każdego akapitu wspomagają pracę z treścią w wielu językach.Produktywny Kompozytor. Kompozytor wiadomości KMail posiada wiele małych narzędzi, które zwiększają wydajność pracy, takich jak ostrzeżenia o zapomnianych załącznikach, wbudowana kompresja załączników lub zmiana rozmiaru załączonych obrazów.Potężne filtrowanie. Oprócz automatyzacji sortowania wiadomości e-mail według wielu kryteriów, system filtrowania KMaila może być również wykorzystywany do wdrażania dowolnych przepływów pracy, ponieważ może integrować się z zewnętrznymi aplikacjami.Szukanie i otagowywanie. Flagowanie i tagowanie wiadomości pomaga w sortowaniu i odzyskiwaniu informacji, podobnie jak zaawansowane funkcje wyszukiwania lokalnego i zdalnego.Zarządzanie listami mailingowymi. Listy mailingowe programu Mailman mogą być automatycznie wykrywane, a typowe operacje związane z zarządzaniem listami mailingowymi są dostępne bezpośrednio z programu KMail.Elastyczna konfiguracja. Niezliczone opcje konfiguracyjne pozwalają dostosować wiele aspektów KMaila dokładnie do twoich potrzeb i życzeń.ZintegrowanyZaproszenia iTip. Wiadomości e-mail z zaproszeniem na spotkanie są wykrywane i umożliwiają szybkie odpowiedzi, a także są oczywiście wprowadzane do KOrganizer.Książka adresowa. Poza automatycznym uzupełnianiem adresów z KAddressBook, KMail używa również jej awatarów i preferencji kryptograficznych.Wiadomości o rezerwacjach. Program KMail może wykrywać rezerwacje lotów lub hoteli w wiadomościach e-mail od niektórych dostawców i oferować dodanie ich do twojego kalendarza.Zgodny ze standardamiObsługuje standardowe protokoły pocztowe: IMAP, POP3 i SMTP.Obsługa poczty elektronicznej w trybie push (IMAP IDLE).Pełna obsługa wyszukiwania w folderach IMAP.Natywna obsługa wbudowanych protokołów: OpenPGP, PGP/MIME i S/MIME.Obsługa filtrowania po stronie serwera Sieve."
year_published = 2025
