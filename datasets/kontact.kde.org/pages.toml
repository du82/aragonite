title = "Per als usuaris - Paquet Kontact"
description = "Kontact: gestioneu els vostres correus, calendaris i contactes des d'una finestra única"
full_description = "Per als usuarisNou al Kontact?El Kontact ofereix innombrables característiques i opcions. Per a esbrinar-les, podeu llegir alguns manuals:Manual del KontactManual del KMailManual del KOrganizerManual de l'AkregatorMés manuals, també en altres idiomes...Us cal ajuda?Consulteu els subfòrums Kontact i PIM als Fòrums de KDE, potser algú ja ha resolt un problema similar. I, si no, sentiu-vos lliures de preguntar-ho aquí!També podeu preguntar al canal d'IRC #kontact del xat Libera. Si preferiu la comunicació per correu electrònic, podeu preguntar a la llista de correu kdepim-users.Heu trobat algun error?En el programari hi ha errors. Si en trobeu a l'aplicació Kontact, si su plau, informeu-los al nostre Bugzilla. No informeu d'errors als fòrums o a llistes de correus: aquests informes segurament es passaran per alt o s'oblidaran força aviat per part dels desenvolupadors. Per a assegurar que l'error arriba als desenvolupadors i es corregeix tan aviat com sigui possible, informeu-lo al Bugzilla.Trobeu a faltar alguna característica?L'aplicació Kontact té moltes característiques, però sempre hi ha lloc per una o dues més. Si teniu una idea d'una millora o trobeu a faltar una característica a l'aplicació Kontact, escriviu un suggeriment al nostre Bugzilla per tal que els desenvolupadors la trobin i la implementin."
