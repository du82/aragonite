title = "KAddressBook - Kontact-ohjelmisto"
description = "KAddressBook allows you to manage your contacts easily. It is deeply integrated with the rest of Kontact, allowing you to easily pick your contacts when sending an email or creating a meeting invitation."
full_description = "KAddressBookKAddressBook tallentaa perheesi, ystäviesi ja muiden tuttujesi yhteystiedot. Se tukee laajalti eri palveluja kuten NextCloudia, Kolabia, Google Contactsia, Microsoft Exchangea (EWS) ja standardinmukaisia CalDav-palvelimia.OminaisuuksiaTehokas haku. KAddressBookissa on mukautettavat suodattimet ja tehokkaat hakuominaisuudet.Duplicate detection and merging. KAdressbook can find duplicated contacts from multiple sources can merge them into a single contact.Integration. Integrates with other Kontact components, e.g. exporting Birthday reminders to KOrganizer.QR-koodit. KAddressBook osaa näyttää kullekin yhteystiedolle QR-koodin, jonka voi lukea puhelimeen tai lähettää eteenpäin.Good standard support. KAddresbook can import and export contacts from and to nearly every address book standard.LDAP-integrointi. Osaa yhdistää useampaan LDAP-palvelimeen, joita kaikkia voi käyttää automaattitäydennykseen kirjoitettaessa viestiä KMailissa."
