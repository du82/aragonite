full_description = "KOrganizer«Organizer» zure denbora! Kudeatu ekitaldiak, zereginak, programatu bilerak eta gehiago.Jakizu gehiago Maneiatu zure e-posta, egutegi, kontaktu eta beste datu pertsonal batzuk Kontact erabiliz. «Kontact»ek dena leku batean bildu eta zure komunikazioak kudeatzen, eguna antolatzen eta kideekin lan egiten laguntzen dizu. Izan zaitez emankorragoa Kontact erabiliz.KontactKontact unifies all our PIM applications into a single window to give you the best possible experience and boost your productivity. With Kontact you can use all the tools of our powerful suite in one place. Unlike proprietary web applications we value your privacy and support open standards, which is why Kontact gives you full control over your data. You can of course also access your data offline if you want to.Irakurri gehiagoKMailKMail azken belaunaldiko e-posta bezeroa bat da, GMail gisako erabilera zabaleko e-posta hornitzaileekin ongi bateratzen dena. Produktibitatea maximizatzeko tresna eta ezaugarri asko eskaintzen ditu, eta e-posta kontu handiekin lan egitea erraztu eta azkartzen du. KMail-ek e-posta protokolo ugari onartzen ditu - POP3, IMAP, Microsoft Exchange (EWS) eta gehiago.Irakurri gehiagoKAddressBook«KAddressBook»ek zure kontaktuak erraz kudeatzeko aukera ematen dizu. «Kontact»eko gainerako atalekin sakonki bateratuta egonik, e-posta bat bidaltzean edo bilera baterako gonbidapen bat sortzean zure kontaktuak erraz hautatzen uzten dizu.Irakurri gehiagoKOrganizerKOrganizer is a powerful and feature-rich organizer, event and todo manager that integrates well with the rest of Kontact, especially with KMail.Irakurri gehiagoAkregatorAkregator RSS jario irakurle bat da. Zure gune gogokoetatik RSS jarioak zama-jaitsi ditzake eta artikuluak irakurtzeko aukera ematen dizu, lerroz kanpo zaudenean ere. Gainera bilaketa-funtzionaltasun aberatsak eta artxibatzeko ezaugarriak ditu.Irakurri gehiagoAlbisteakLarunbata, 2024(e)ko azaroak 9September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Irakurri gehiagoAstelehena, 2024(e)ko irailak 2July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseIrakurri gehiagoOsteguna, 2024(e)ko uztailak 4May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Irakurri gehiagoAsteartea, 2024(e)ko maiatzak 7March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Irakurri gehiago📢 Ikusi albiste guztiak"
