["https://kontact.kde.org/pl/components/korganizer"]
title = "KOrganizator - Pakiet Kontact"
description = "KOrganizer to potężny i bogaty w funkcje organizer, menedżer wydarzeń i menedżer rzeczy do zrobienia który dobrze integruje się z pozostałymi elementami Kontact, a zwłaszcza z KMail."
full_description = 'KOrganizatorKOrganizer to komponent kalendarza i terminarza Kontact. Umożliwia on zarządzanie wydarzeniami i zadaniami, powiadamianie o alarmach, eksport do sieci, przejrzystą obsługę danych w sieci, planowanie grupowe, import i eksport plików kalendarza i wiele innych. Może współpracować z wieloma różnymi usługami kalendarzy, w tym z: NextCloud, Kolab, Google Calendar oraz innymi. KOrganizer możesz w pełni dostosować do swoich potrzeb i jest on integralną częścią pakietu Kontact, który stanowi kompletne rozwiązanie do organizowania danych osobowych. KOrganizer obsługuje dwa dominujące standardy przechowywania i wymiany danych między kalendarzami: vCalendar oraz iCalendar.FunkcjeObsługa wielu kalendarzy i list zadań. Korganizer może w przejrzysty sposób łączyć dane kalendarza z różnych plików lub innych źródeł danych kalendarza, np. kalendarzy internetowych. Można je w wygodny sposób aktywować, dezaktywować, dodawać i usuwać za pomocą graficznego interfejsu użytkownika.Integracja z Kontactem. KOrganizer jest w pełni zintegrowany z Kontactem, kompletną aplikacją do zarządzania informacjami osobistymi. W ramach Kontact dostępne są pewne dodatkowe funkcje, takie jak: konwersja wiadomości e-mail na wydarzenia lub zadania metodą "przeciągnij i upuść".Model przechowywania. KOrganizer posiada trwały kalendarz. Użytkownik nie musi dbać o ładowanie i zapisywanie kalendarza. Zmiany są natychmiast zapisywane na dysku. Jeśli kalendarz zostanie zmieniony z zewnątrz, jest automatycznie ładowany i aktualizowany w widoku. Mechanizm blokowania umożliwia równoczesny dostęp do kalendarza.Cofnij i powtórz. KOrganizer obsługuje nieograniczoną liczbę cofnięć i ponowień.Integracja zadań z widokiem planu dnia. Zadania są widoczne w widokach tygodnia i dnia. Zadania można zamieniać na wydarzenia, przeciągając je z listy zadań i upuszczając w widoku terminarza.Załączniki do zdarzeń i zadań. Do zdarzeń i zadań można dołączać odwołania do stron internetowych, plików lokalnych lub wiadomości e-mail. Dostęp do załączonych danych można łatwo uzyskać jednym kliknięciem w widokach zdarzeń i zadań, a także w widoku podsumowania lub w edytorach.Szybkie wprowadzanie zadań. Specjalne pole wejściowe umożliwia szybkie utworzenie zadania bez konieczności otwierania edytora. Jest to szczególnie przydatne przy tworzeniu wielu zadań pod rząd.Szybkie wprowadzanie zdarzeń. Istnieje kilka sposobów tworzenia wydarzeń w widoku terminarza: Wydarzenie można utworzyć wybierając zakres czasu, a następnie po prostu zaczynając wpisywać tekst. Zostanie otwarty edytor, a tekst wpisywany będzie w tytule. Opcjonalnie edytor zdarzeń może zostać otwarty po zakończeniu zaznaczania czasu, a oprócz zwykłych pozycji w menu i na pasku narzędzi dostępne są także przypisania klawiszy oraz menu kontekstowe, które uruchamia okno dialogowe edytora.Obsługa drukowania. Kalendarze można drukować przy użyciu różnych stylów. Drukowanie obsługuje również kolory i nakładające się wydarzenia.Integracja KMail. KMail bezpośrednio obsługuje przesyłanie zaproszeń i innych załączników kalendarza do programu KOrganizer.'
