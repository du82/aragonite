["https://kontact.kde.org/ca-va/download"]
title = "Baixada - Paquet Kontact"
description = "Kontact: gestioneu els vostres correus, calendaris i contactes des d'una finestra única"
full_description = "BaixadaLinuxL'aplicació Kontact ja està disponible a la majoria de les distribucions Linux. Es pot instal·lar directament a partir de Discover, GNOME Software o a partir de la botiga de programari de la vostra distribució.Codi font del llançamentL'aplicació Kontact es publica periòdicament com a part de KDE Gear. Trobareu l'última publicació estable de l'aplicació Kontact entre els arxius tar de l'últim llançament de KDE Gear.Si voleu construir l'aplicació Kontact a partir del codi font, recomanem veure la pàgina com participar, la qual conté enllaços cap a la guia completa sobre com compilar l'aplicació Kontact.FlatpakPodeu instal·lar l'últim Flatpak de Kontact des de Flathub. Els Flatpak experimentals amb les construccions nocturnes de Kontact es poden instal·lar des del repositori Flatpak de KDE.GitKontact s'estén per una multitud de repositoris. Vegeu la nostra pàgina com participar per a obtindre instruccions detallades sobre com obtindre tots els repositoris de Kontact.WindowsActualment estem treballant per adaptar Kontact a Windows. Voleu ajudar-nos? Vegeu com participar i poseu-vos en contacte amb nosaltres!Instal·lacióPer a instal·lar l'aplicació Kontact o un dels seus components com a aplicació autònoma, seguiu les instruccions de la plataforma que esteu utilitzant. La majoria de les plataformes tenen un instal·lador gràfic que es pot utilitzar per a instal·lar paquets de programari. En molts casos s'obrirà automàticament fent clic sobre l'enllaç de baixada o instal·lació per a la vostra plataforma. Hi ha una guia d'aprenentatge genèrica per a instal·lar aplicacions KDE, la qual també es pot aplicar a l'aplicació Kontact.Si utilitzeu Linux, l'aplicació Kontact ja podria estar preinstal·lada en el sistema com a part de la selecció predeterminada. Si no és així, la podeu instal·lar amb l'eina de gestió de paquets de la vostra distribució Linux. Per als detalls, vegeu la seua documentació.En molts casos tindreu l'oportunitat d'instal·lar l'aplicació Kontact de manera modular, d'esta manera podreu decidir instal·lar només el conjunt de components que segur que voleu utilitzar. Les traduccions de la interfície d'usuari sovint també estaran disponibles com a mòdul separat que podeu instal·lar segons les vostres necessitats i preferències.Desinstal·lacióPer a desinstal·lar Kontact, seguiu les instruccions de l'eina de gestió de paquets que heu utilitzat per a instal·lar Kontact junt amb els seus components. Açò eliminarà els components que heu triat sense tocar les dades que heu vist, creat o modificat amb Kontact."
