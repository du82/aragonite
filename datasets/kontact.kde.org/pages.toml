["https://kontact.kde.org/ca/download"]
title = "Baixada - Paquet Kontact"
description = "Kontact: gestioneu els vostres correus, calendaris i contactes des d'una finestra única"
full_description = "BaixadaLinuxL'aplicació Kontact ja està disponible a la majoria de les distribucions Linux. Es pot instal·lar directament a partir del Discover, el GNOME Software o a partir de la botiga de programari de la vostra distribució.Codi font del llançamentL'aplicació Kontact es publica periòdicament com a part de KDE Gear. Podeu trobar la darrera publicació estable de l'aplicació Kontact entre els arxius tar del darrer llançament de KDE Gear.Si voleu construir l'aplicació Kontact a partir del codi font, recomanem veure la pàgina com participar que conté enllaços a la guia completa sobre com compilar l'aplicació Kontact.FlatpakPodeu instal·lar el darrer Flatpak del Kontact des de Flathub. Els Flatpaks experimentals amb les construccions nocturnes del Kontact es poden instal·lar des del repositori Flatpak de KDE.GitEl Kontact s'estén per una multitud de repositoris. Vegeu la nostra pàgina com participar per a obtenir instruccions detallades sobre com obtenir tots els repositoris del Kontact.WindowsActualment estem treballant per adaptar el Kontact al Windows. Voleu ajudar-nos? Vegeu com participar i poseu-vos en contacte amb nosaltres!Instal·lacióPer a instal·lar l'aplicació Kontact o un dels seus components com a aplicació autònoma, seguiu les instruccions de la plataforma que esteu utilitzant per a instal·lar programari. La majoria de les plataformes tenen un instal·lador gràfic que es pot utilitzar per a instal·lar paquets de programari. En molts casos s'obrirà automàticament en fer clic a l'enllaç de baixada o instal·lació per a la vostra plataforma. Hi ha una guia d'aprenentatge genèrica per a instal·lar aplicacions KDE que també es pot aplicar a l'aplicació Kontact.Si empreu el Linux, l'aplicació Kontact ja podria estar preinstal·lada en el sistema com a part de la selecció predeterminada. Si no, la podeu instal·lar amb l'eina de gestió de paquets de la vostra distribució Linux. Vegeu la seva documentació per als detalls.En molts casos tindreu l'oportunitat d'instal·lar l'aplicació Kontact de manera modular, així que podeu decidir instal·lar només el conjunt de components que realment vulgueu utilitzar. Les traduccions de la interfície d'usuari sovint també estaran disponibles com a mòdul separat que podeu instal·lar segons les vostres necessitats i preferències.Desinstal·lacióPer a desinstal·lar l'aplicació Kontact seguiu les instruccions de l'eina de gestió de paquets que heu usat per a instal·lar l'aplicació Kontact i els seus components. Això eliminarà els components que trieu. No tocarà les dades que heu vist, creat o modificat amb l'aplicació Kontact."
