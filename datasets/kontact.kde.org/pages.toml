["https://kontact.kde.org/es/components/kaddressbook"]
title = "KAddressBook - El paquete Kontact"
description = "KAddressBook le permite manejar sus contactos de forma fácil. Está profundamente integrado con el resto de Kontact, proporcionándole una forma fácil de escoger contactos al enviar correo electrónico o crear una invitación para una reunión."
full_description = "KAddressBookKAddressBook guarda todos los detalles personales sobre su familia, amigos y otros contactos. Permite el uso de una amplia variedad de servicios, como NextCloud, Kolab, Contactos de Google, Microsoft Exchange (EWS) o cualquier servidor CalDAV estándar.FuncionalidadesBúsqueda potente. KAddressbook tiene filtros que se pueden configurar y potentes capacidades de búsqueda.Detección y fusión de duplicados. KAdressbook puede encontrar contactos duplicados de múltiples fuentes y fusionarlos en un único contacto.Integración. Se integra con otros componentes de Kontact; por ejemplo, exportando recordatorios de cumpleaños a KOrganizer.Códigos QR. KAddressbook puede mostrar un código QR para cada contacto que se puede escanear rápidamente con el teléfono o enviar a otra persona.Buena compatibilidad con los estándares. KAddressbook puede importar y exportar contactos a casi cualquier estándar de libreta de direcciones.Integración de LDAP. Se puede conectar con múltiples servidores LDAP, que se pueden usar para la terminación automática de contactos al redactar mensajes de correo en KMail."
