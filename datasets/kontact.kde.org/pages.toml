["https://kontact.kde.org/ca-va"]
title = "Paquet de Kontact - La potent solució de PIM"
description = "Kontact: gestioneu els vostres correus, calendaris i contactes des d'una finestra única"
full_description = "KontactGestioneu el correu electrònic, calendaris i contactes des d'una única finestra.Apreneu ne més KMailPotencieu la vostra productivitat amb una aplicació de correu electrònic plena de característiques.Apreneu ne més KOrganizerOrganitzeu el vostre temps! Gestioneu esdeveniments, tasques pendents, cites i més.Apreneu ne més Gestioneu el vostre correu electrònic, calendari, contactes i altres dades personals amb Kontact. Kontact ho agrupa tot en un lloc i us ajuda a gestionar les vostres comunicacions, organitzar el dia i treballar amb els col·legues. Sigueu més productiu amb Kontact.KontactKontact unifica totes les nostres aplicacions PIM en una finestra única per a donar-vos la millor experiència possible i impulsar la vostra productivitat. Amb Kontact podeu utilitzar totes les eines del nostre potent paquet en un sol lloc. A diferència de les aplicacions web propietàries, valorem la vostra privadesa i admetem estàndards oberts, i és per açò que Kontact vos dona un control total de les vostres dades. Per descomptat també podeu accedir a les vostres dades fora de línia si voleu.Llegiu mésKMailKMail és un client de correu electrònic que s'integra bé amb els proveïdors de correu electrònic àmpliament utilitzats com GMail. Proporciona moltes eines i característiques per a maximitzar la vostra productivitat i fa que treballar amb comptes grans de correu electrònic siga fàcil i ràpid. KMail permet una gran varietat de protocols de correu electrònic: POP3, IMAP, Microsoft Exchange (EWS) i més.Llegiu mésKAddressBookKAddressBook us permet gestionar els vostres contactes amb facilitat. Està profundament integrat amb la resta de Kontact, que us permet triar amb facilitat els contactes quan envieu un correu electrònic o creant una invitació a una reunió.Llegiu mésKOrganizerKOrganizer és un organitzador potent ple de característiques, gestor d'esdeveniments i tasques pendents que s'integra bé amb la resta de Kontact, especialment amb KMail.Llegiu mésAkregatorAkregator és un lector de canals RSS. Pot descarregar automàticament els canals RSS dels llocs preferits i permet llegir els articles fins i tot quan esteu fora de línia. També proporciona una funcionalitat de busca avançada i característiques d'arxiu.Llegiu mésNotíciesDissabte, 9 de novembre de 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Llegiu mésDilluns, 2 de setembre de 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseLlegiu mésDijous, 4 de juliol de 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Llegiu mésDimarts, 7 de maig de 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Llegiu més📢 Mostra totes les notícies"
