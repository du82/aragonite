full_description = "KDE 通訊錄KDE 通訊錄可以儲存所有您的家人、朋友及其他聯絡人的個人資訊。它支援很多的服務，包含 NextCloud、Kolab、Google Contacts、Microsoft Exchange (EWS) 或其他標準 CalDAV 伺服器。功能Powerful search. KAddresbook has configurable filters and powerful search capabilities.Duplicate detection and merging. KAdressbook can find duplicated contacts from multiple sources can merge them into a single contact.Integration. Integrates with other Kontact components, e.g. exporting Birthday reminders to KOrganizer.QR codes. KAddressbook can display a QR code for each contact to quickly scan it into your phone or send to someone.Good standard support. KAddresbook can import and export contacts from and to nearly every address book standard.LDAP integration. Can connect to multiple LDAP servers, which can then be used for contact autocompletion when composing emails in KMail."
