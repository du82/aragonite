full_description = "AkregatörAkregatör, KDE Dot News ve KDE Gezegeni blogları gibi sitelerdeki yazılardan kolaylıkla haberdar olmanıza yardımcı olur. Kullanılan teknoloji RSS teknolojisidir ve birçok site bunu destekler.ÖzelliklerKullanımı kolayDüzinelerce beslemeyi işleyebilirOkunmayan beslemelerden sizi haberdar ederYazıların tamamını programın içinde kolaylıkla okumanızı sağlamak için sekmeler kullanırBeslemeler arşiviBeslemeleri içe ve dışa aktar Akregatör, KDE Dot News ve KDE Gezegeni blogları gibi sitelerdeki yazılardan kolaylıkla haberdar olmanıza yardımcı olur. Kullanılan teknoloji RSS teknolojisidir ve birçok site bunu destekler. KDE’ye olan sevginizi gösterin! KDE’yi desteklemek için kitap, kupa, giysi ve başka şeyler satın alın. KDE web yöneticileri (genel posta listesi) tarafından desteklenmektedir. KDE® ve K Masaüstü Ortamı® logosu, KDE e.V.’nin tescilli markalarıdır | Yasal"
