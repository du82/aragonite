["https://kontact.kde.org/sv"]
title = "Kontact-sviten: Den kraftfulla lösningen för personlig informationshantering"
description = "Kontact: Hantera all e-post, kalendrar och kontakter i ett enda fönster"
full_description = "KorganizerOrganisera din tid! Hantera händelser, skapa uppgifter, schemalägg möten med mera.Ta reda på mer Hantera e-post, kalender, kontakter och annan personlig information med Kontact. Kontact grupperar ihop allting på ett ställe och hjälper dig att hantera din kommunikation, organisera dagen och arbeta med kolleger. Bli produktivare med Kontact.KontactKontact förenar alla våra program för personlig informationshantering i ett enda fönster för att ge dig bästa möjliga upplevelse och öka din produktivitet. Du kan använda alla verktyg i vår kraftfulla svit på ett ställe med Kontact. I motsats till tillverkarspecifika webbprogram värdesätter vi din integritet och stöder öppna standarder, vilket är orsaken till att Kontact ger dig fullständig kontroll av din information. Du kan förstås också komma åt informationen nedkopplad om du vill.Läs merKmailKmail är en toppmodern e-postprogram som är väl integrerad med använda i stor utsträckning, såsom GMail. Det tillhandahåller många verktyg och funktioner för att maximera din produktivitet och gör det snabbt och enkelt att arbeta med stora e-postkonton. Kmail stöder ett stort antal e-postprotokoll: POP3, IMAP, Microsoft Exchange (EWS) med flera.Läs merAdressbokAdressboken låter dig enkelt hantera dina kontakter. Den är intimt integrerad med resten av Kontact, vilket låter dig enkelt välja ut kontakter när du skickar e-post eller skapar en mötesinbjudan.Läs merKorganizerKorganizer är en kraftfull och funktionsrik organisatör, händelse- och uppgiftshanterare, som är väl integrerad med resten av Kontact, i synnerhet med Kmail.Läs merAkregatorAkregator är en RSS-kanalläsare. Den kan automatiskt ladda ner RSS-kanaler från dina favoritplatser och låter dig läsa artiklar även när du är nedkopplad. Den tillhandahåller också omfattande sökfunktionalitet och arkiveringsfunktioner.Läs merNyheterlördag, 9 november 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Läs mermåndag, 2 september 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseLäs mertorsdag, 4 juli 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Läs mertisdag, 7 maj 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Läs mer📢 Visa alla nyheter"
