["https://kontact.kde.org/ca-va/components/kontact"]
title = "Kontact - Paquet Kontact"
description = "Kontact unifica totes les nostres aplicacions PIM en una finestra única per a donar-vos la millor experiència possible i impulsar la vostra productivitat. Amb Kontact podeu utilitzar totes les eines del nostre potent paquet en un sol lloc. A diferència de les aplicacions web propietàries, valorem la vostra privadesa i admetem estàndards oberts, i és per açò que Kontact vos dona un control total de les vostres dades. Per descomptat també podeu accedir a les vostres dades fora de línia si voleu."
full_description = "KontactKontact és un paquet de gestió d'informació personal ple de característiques creat per KDE. Kontact unifica totes les nostres aplicacions PIM en una sola finestra de manera que es puguen tractar els vostres correus electrònics, calendaris, notícies i altres dades de forma encara més eficient. També podeu executar cadascun dels components de Kontact com una aplicació independent.Ple de característiquesCreiem que el programari hauria d'adaptar-se als vostres fluxos de treball, en lloc d'obligar-vos a adaptar-vos als seus. Kontact és molt configurable i personalitzable perquè pugueu configurar-lo exactament de manera que treballe per a tu. Consulteu les pàgines individuals dels components de Kontact per a obtindre una visió general de les característiques que poden oferir cadascun d'ells.FlexibleKontact és compatible amb una gran varietat de serveis i protocols de correu electrònic, calendari i llibreta d'adreces i es pot ampliar amb facilitat per a donar suport a serveis addicionals. No cal que canvieu el vostre proveïdor de correu electrònic o migreu el vostre calendari a un altre lloc només per a sincronitzar-lo amb Kontact. Feu que Kontact apunte cap al servei on estan les vostres dades PIM i Kontact les mostrarà i les mantindrà sincronitzades.Kontact també pot importar les vostres dades PIM i alguns paràmetres d'altres paquets PIM com ara Thunderbird i Evolution.SeguretatKontact implementa tots els estàndards de seguretat moderns per a protegir la vostra privadesa. Totes les comunicacions amb servidors remots estan encriptades per defecte utilitzant l'encriptació SSL/TLS estàndard de la indústria. Kontact també té un suport integrat per a signar i xifrar correus electrònics amb GPG i S/MIME i pot verificar automàticament les signatures dels correus electrònics.Kontact està configurat de manera predeterminada per a protegir la vostra privadesa bloquejant la càrrega de contingut extern, respostes automàtiques i altres trucs utilitzats sovint pels estafadors.IntegratTots els components de Kontact estan ben integrats. KOrganizer pot enviar invitacions de reunió a través de comptes de correu electrònic configurats a KMail. KMail lliurarà les invitacions de reunió i vos mostrarà els conflictes amb esdeveniments dels vostres calendaris. Podeu barrejar les vostres tasques pendents i esdeveniments normals en la vista d'agenda de KOrganizer.Codi font lliure i obertKontact és lliure (tant en el sentit de la llibertat d'expressió com de la cervesa debades) i de codi completament obert. Açò significa que el codi font és públic perquè tothom el puga veure, auditar i millorar.Estem orgullosos de la nostra obertura i de l'enfocament en la protecció de la privadesa dels usuaris. Kontact no vos espiarà, no mostrarà cap anunci, no emmagatzemarà les vostres dades confidencials en qualsevol lloc d'un núvol propietari o les compartirà amb ningú més. Vegeu la Política de privadesa del programari KDE per a més detalls."
year_published = 2025
