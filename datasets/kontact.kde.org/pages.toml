["https://kontact.kde.org/fi/components/korganizer"]
title = "KOrganizer - Kontact-ohjelmisto"
description = "KOrganizer on tehokas ja monipuolinen ajan-, tapahtumien- ja tehtävänhallinta, joka integroituu hyvin Kontactin kokonaisuuteen, etenkin KMailiin."
full_description = "KOrganizerKOrganizer on Kontactin kalenteri- ja ajanhallintaosa. Se tarjoaa tapahtumien ja tehtävien hallinnan, hälytykset, viennin verkkoon, tietojen käsittelyn verkossa läpinäkyvästi, ryhmäaikataulutuksen, kalenteritietojen tuonnin ja viennin ja paljon muuta. Ohjelma osaa toimia yhdessä eri kalenteripalvelujen kuten NextCloudin, Kolabin, Googlen kalenterin ja muiden kanssa. KOrganizer on täysin tarpeisiisi mukautettavissa ja on kiinteä osa Kontactia, joka pyrkii tarjoamaan täyden ratkaisun henkilökohtaisiin tiedonhallintaasi. KOrganizer tukee kumpaakin hallitsevaa kalenteritiedon tallennus- ja tiedonvaihtostandardia, vCalendaria ja iCalendaria.OminaisuuksiaSupport for multiple calendars and todo lists. Korganizer can transparently merge calendar data from different files or other calendar data sources for example calendars on the web. They can conveniently be activated, deactivated, added and removed from the graphical user interface.Kontact integration. KOrganizer is fully integrated with Kontact, the complete personal information management application. Within Kontact some additional features are available like conversion of mails to events or todos by drag and drop.Storage model. KOrganizer has a persistent calendar. The user doesn't have to take care of loading or saving the calendar. Changes are immediately saved to disk. If the calendar is changed externally it is automatically loaded and updated in the view. A locking mechanism handles concurrent access to the calendar.Undo and Redo. KOrganizer supports unlimited undo and redo.Todo integration with agenda view. Todos are shown in the week and day views. Todos can be converted to events by dragging from the todo list and dropping on the agenda view.Attachments for events and todos. References to web pages, local files or mails can be attached to events and todos. The attached data can easily be accessed by a single click from the event and todo views as well as the summary view or the editorsQuick todo entry. A special input field allows to quickly create a todo without needing to open an editor. This is especially handy for creating multiple todos in a row.Quick event entry. There are several ways to create events from the agenda view: Per type-ahead events can be created by selecting a time range and then simply starting to type. An editor will be opened and the type text will be go into the title. Optionally the event editor can be opened when the time selection is finished and in addition to the usual menu and toolbar entries there are key bindings and a context menu to start the editor dialog.Tulostustuki. Kalentereita voi tulostaa eri tyyleillä. Tulostus tukee myös värejä ja tapahtumien limittymistä.KMail-integrointi. KMail tukee suoraan kutsujen ja muiden kalenteritapahtumien vientiä KOrganizeriin."
year_published = 2025
clearnet = "https://kontact.kde.org/fi/components/korganizer"
