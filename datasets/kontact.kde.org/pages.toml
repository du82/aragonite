["https://kontact.kde.org/pl/components/kaddressbook"]
title = "Książka adresowa - Pakiet Kontact"
description = "Aplikacja Książki adresowej umożliwia łatwe zarządzanie kontaktami. Jest ona głęboko zintegrowana z pozostałymi elementami Kontact, dzięki czemu można łatwo wybierać kontakty podczas wysyłania wiadomości e-mail lub tworzenia zaproszenia na spotkanie."
full_description = "Książka adresowaKsiążka adresowa przechowuje wszystkie dane osobowe rodziny, przyjaciół i innych kontaktów. Obsługuje wiele różnych usług, w tym NextCloud, Kolab, Kontakty Google, Microsoft Exchange (EWS) lub dowolny standardowy serwer CalDAV.FunkcjeZaawansowane wyszukiwanie Książka adresowa posiada konfigurowalne filtry i rozbudowane możliwości wyszukiwania. możliwości wyszukiwania.Wykrywanie i łączenie duplikatów. Książka adresowa może znaleźć zduplikowane kontakty z wielu źródeł i połączyć je w jeden kontakt.Integracja. Integruje się z innymi komponentami Kontact, np. eksportując przypomnienia urodzinowe do KOrganizer.Kody QR. Książka adresowa może wyświetlać kod QR dla każdego kontaktu, co pozwala szybko zeskanować go do swojego telefonu lub wysłać komuś.Dobry standard obsługi. Książka adresowa może importować i eksportować kontakty z i do prawie każdego standardu książki adresowej.Integracja z LDAP. Może łączyć się z wieloma serwerami LDAP, które następnie można używać do automatycznego uzupełniania kontaktów podczas tworzenia wiadomości e-mail w KMail."
