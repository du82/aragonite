["https://kontact.kde.org/blog"]
title = "Blog - Kontact Suite"
description = "Kontact - handle your emails, calendars and contacts within a single window"
full_description = "Blog September and October in KDE PIMSaturday, 9 November 2024 | KDE PIM TeamHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024. Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2 Read MoreJuly and August in KDE PIMMonday, 2 September 2024 | KDE PIM TeamHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024. Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear release Read MoreMay and June in KDE PIMThursday, 4 July 2024 | KDE PIM TeamHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024. Since the last report 38 people have contributed over 1500 changes to KDE PIM code base. Read MoreMarch and April in KDE PIMTuesday, 7 May 2024 | KDE PIM TeamHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024. Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release. Read MoreJanuary and February in KDE PIMTuesday, 5 March 2024 | KDE PIM TeamHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of January and February 2024. Since the last report, 34 people contributed approximately 1742 code changes, focusing on bugfixes and improvements for the coming 24.02 release based on Qt6. Read MoreNovember and December in KDE PIMSunday,