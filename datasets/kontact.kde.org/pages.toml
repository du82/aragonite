["https://kontact.kde.org/sl/components/kontact"]
title = "Kontact - Kontact Suite"
description = "Kontact združuje vse naše aplikacije PIM v eno okno, da vam zagotovi najboljšo možno izkušnjo in poveča vašo produktivnost. S Kontactom lahko na enem mestu uporabljate vsa orodja našega zmogljivega paketa. Za razliko od lastniških spletnih aplikacij cenimo vašo zasebnost in podpiramo odprte standarde, zato vam Kontact omogoča popoln nadzor nad vašimi podatki. Seveda lahko do svojih podatkov dostopate tudi brez povezave, če želite."
full_description = "KontactKontact je zbirka za upravljanje osebnih podatkov, bogata s funkcijami, ki jo je ustvaril KDE. Kontact združuje vse naše aplikacije upravljanja osebnih podatkov v eno okno, tako da lahko še učinkoviteje obravnavate svojo e-pošto, koledarje, novice in druge podatke. Vsako od komponent Kontacta lahko zaženete tudi kot samostojno aplikacijo.Bogat s funkcijamiVerjamemo, da bi se morala programska oprema prilagajati vašim delovnim tokovom, namesto da bi vas silila, da se prilagajate njihovim. Kontact je zelo nastavljiv in prilagodljiv, tako da ga lahko nastavite točno tako, kot vam ustreza. Oglejte si posamezne strani za Kontactove komponente, da dobite pregled nekaterih funkcij, ki jih lahko ponudi vsaka od njih.PrilagodljivoKontact podpira veliko različnih storitev in protokolov za e-pošto, koledarje in adresarje ter ga je mogoče enostavno razširiti za podporo dodatnih storitev. Ni vam treba spremeniti ponudnika e-pošte ali preseliti svojega koledarja drugam, samo da bi ga sinhronizirali s Kontactom. Preprosto usmerite Kontact na storitev, kjer so vaši osebni podatki, in Kontact jih bo prikazal in ohranil sinhronizacijo.Kontact lahko uvozi tudi vaše osebne podatke in nekatere nastavitve iz drugih zbirk osebnih podatkov, kot sta Thunderbird in Evolution.VarnoKontact podpira vse sodobne varnostne standarde za zaščito vaše zasebnosti. Vsa komunikacija z oddaljenimi strežniki je privzeto šifrirana z uporabo industrijskega standardnega šifriranja SSL/TLS. Kontact ima tudi vgrajeno podporo za podpisovanje in šifriranje e-pošte z GPG in S/MIME ter lahko samodejno preverja podpise e-pošte.Kontact je privzeto nastavljen tako, da ščiti vašo zasebnost z blokiranjem nalaganja zunanje vsebine, samodejnih odzivov in drugih trikov, ki jih pogosto uporabljajo prevaranti.IntegriranoVse komponente Kontacta so med seboj dobro povezane. KOrganizer lahko pošilja vabila na sestanke prek e-poštnih računov, konfiguriranih v KMailu. KMail bo prikazal vabila na sestanke in vam prikazal navzkrižje z dogodki v vaših koledarjih. V pogledu Agenda KOrganizerja lahko mešate svoje naloge in redne dogodke.Prosto in odprtokodnoKontact je prost, brezplačen in popolnoma odprtokoden. To pomeni, da je izvorna koda javno objavljena, da si jo lahko vsak ogleda, pregleda in izboljša.Ponosni smo na svojo odprtost in osredotočenost na varovanje zasebnosti uporabnikov. Kontact ne bo vohunil za vami, ne bo prikazoval nobenega oglasa, vaših občutljivih podatkov ne bo shranil nekje v lastniškem oblaku ali jih delil s kom drugim. Za več podrobnosti glejte Pravilnik o zasebnosti programske opreme KDE."
