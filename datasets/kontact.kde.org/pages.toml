["https://kontact.kde.org/ca-va/components/kmail"]
title = "KMail - Paquet Kontact"
description = "KMail és un client de correu electrònic que s'integra bé amb els proveïdors de correu electrònic àmpliament utilitzats com GMail. Proporciona moltes eines i característiques per a maximitzar la vostra productivitat i fa que treballar amb comptes grans de correu electrònic siga fàcil i ràpid. KMail permet una gran varietat de protocols de correu electrònic: POP3, IMAP, Microsoft Exchange (EWS) i més."
full_description = "KMailKMail és el component de correu electrònic de Kontact, el gestor integrat d'informació personal de KDE.SeguretatSegur de manera predeterminada. Configuració predeterminada amb el compromís en la seguretat i privadesa en lloc de les característiques.Encriptació d'extrem a extrem. El suport per a OpenPGP i S/MIME està integrat, i un assistent de configuració i generació de claus ajuda els usuaris a començar amb açò.Encriptació de transports. La comunicació encriptada SSL/TLS està implementada per descomptat, així com una sèrie de mètodes d'autenticació com GSSAPI (Kerberos) o OAuth2.Aïllament del contingut HTML. Si no es poden evitar els correus electrònics HTML, KMail assegura que no hi ha referències externes que puguen ocultar-se per a filtrar informació o comprometre la vostra privadesa. De manera addicional, les proteccions de pesca de KMail advertixen sobre els enllaços sospitosos en estos correus electrònics.Protecció de correu brossa. Si el servidor de correu electrònic ja no s'encarrega d'açò, KMail pot integrar localment verificadors de correu brossa populars com ara SpamAssassin o Bogofilter.PotentCapacitats fora de línia. KMail permet operar sense connectivitat de xarxa sincronitzant (de manera opcional) tot el vostre correu electrònic sencer localment.Identitats múltiples. KMail separa les identitats dels comptes, donant-vos una gran flexibilitat quan porteu barrets diferents en diverses organitzacions.Plantilles. Un sistema flexible de plantilles i fragments de text permet automatitzar parts de l'escriptura dels correus electrònics.Multiidioma. Suport integrat de traducció del contingut, i verificació ortogràfica per paràgraf, amb detecció automàtica de l'idioma quan es tracta de contingut en diversos idiomes.Redactor productiu. El redactor de correu electrònic de KMail ve amb molts ajudants petits per a fer-vos més eficient, com ara l'avís sobre els adjunts oblidats, la compressió d'adjunts en línia o el canvi de mida de les imatges adjuntes.Filtratge potent. A més d'automatitzar l'ordenació dels correus per una multitud de condicions, el sistema de filtratge de KMail també es pot utilitzar per a implementar fluxos de treball arbitraris, ja que pot integrar-se amb aplicacions externes.Busca i etiquetatge. El marcatge i etiquetatge dels missatges ajuda a ordenar i recuperar informació, i també ho fan les potents capacitats de busca local i remota.Gestió de llistes de correu. Les llistes de correu del Mailman es poden detectar automàticament i les operacions de gestió de les llistes de correu estan directament disponibles en KMail.Configuració flexible. Les incomptables opcions de configuració permeten ajustar molts aspectes de KMail a les vostres necessitats i desitjos.IntegratInvitacions d'iTip. Els correus d'invitació a reunions es detecten i oferixen respostes ràpides en el lloc, i per descomptat s'envien a KOrganizer.Llibreta d'adreces. A més de la compleció automàtica d'adreces de KAddressBook, KMail també utilitza avatars i preferències criptogràfiques des d'allà.Correus de reserves. KMail pot detectar reserves de vol o hotel en els correus electrònics de determinats proveïdors i oferix afegir-los al vostre calendari.Compliment dels estàndardsImplementa els protocols de correu estàndard IMAP, POP3 i SMTP.Implementa el correu electrònic «push» (IMAP IDLE).Permet totalment la busca en les carpetes IMAP.Suport natiu per a OpenPGP en línia, PGP/MIME i S/MIME.Implementa el filtratge Sieve en la banda del servidor."
year_published = 2025
clearnet = "https://kontact.kde.org/ca-va/components/kmail"
