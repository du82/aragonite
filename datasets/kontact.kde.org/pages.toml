["https://kontact.kde.org/tr/components/kaddressbook"]
title = "K Adres Defteri - Kontak Takımı"
description = "K Adres Defteri, kişilerinizi kolaylıkla yönetmenize izin verir. Kontak’ın geri kalanıyla tam olarak tümleşiktir ve bir e-posta gönderirken veya toplantı daveti hazırlarken kişilerinizi kolaylıkla seçebilirsiniz."
full_description = "K Adres DefteriK Adres Defteri; aileniz, arkadaşlarınız ve diğer kişilerin tüm kişisel verilerini depolayabilir. NexCloud, Kolab, Google Kişiler, Microsoft Exchange (EWS) veya herhangi bir CalDAV standardını kullanan sunucuyu destekler.ÖzelliklerGüçlü arama. K Adres Defteri, yapılandırılabilir süzgeçler ve güçlü arama yeteneklerine sahiptir.Yinelenmişleri algılama ve birleştirme. K Adres Defteri, birden çok kaynakta yinelenmiş kişileri bulabilir ve onları tek bir kişiye birleştirebilir.Tümleştirme. Diğer Kontak bileşenleriyle tümleşiktir; örneğin, yaş günü anımsatıcılarını K Organizatör’e dışa aktarabilir.Kare Kodlar. K Adres Defteri, her bir kişi için bir kare kod görüntüleyebilir; böylece onları kolaylıkla telefonunuzdan tarayabilir veya başkalarına gönderebilirsiniz.Mükemmel standartlar desteği. K Adres Defteri, neredeyse bütün adres defteri standartlarından kişileri içe veya dışa aktarabilir.LDAP tümleştirmesi. Birden çok LDAP sunucusuna bağlanabilir; böylece onları K Posta’da e-postalar oluştururken kişileri otomatik tamamlama için kullanabilirsiniz."
year_published = 2025
