["https://kontact.kde.org/es/components/korganizer"]
title = "KOrganizer - El paquete Kontact"
description = "KOrganizer es un organizador potente y repleto de funcionalidades, gestor de eventos y de tareas pendientes que se integra bien con el resto de Kontact, especialmente con KMail."
full_description = "KOrganizerKOrganizer es el componente de calendario y de planificación de Kontact. Proporciona la gestión de eventos y de tareas, notificación de alarmas, exportación web, gestión de datos transparente en red, planificación de grupos, importación y exportación de archivos de calendario y más. Es capaz de trabajar conjuntamente con una amplia variedad de servicios de calendario, como NextCloud, Kolab y Google Calendar, entre otros. KOrganizer se puede personalizar completamente según sus necesidades y es una parte integral del paquete Kontact, que aspira ser una completa solución para la organización de sus datos personales. KOrganizer permite usar los dos estándares dominantes para almacenar e intercambiar datos de calendario, vCalendar e iCalendar.FuncionalidadesUso de múltiples calendarios y listas de tareas pendientes. Korganizer puede fusionar de forma transparente datos de calendario de distintos archivos o de otras fuentes de datos de calendario, como los calendarios web. Se pueden activar, desactivar, añadir y eliminar fácilmente desde la interfaz gráfica del usuario.Integración con Kontact. KOrganizer está totalmente integrado con Kontact, la completa aplicación de gestión de información personal. Dentro de Kontact dispone de algunas funciones adicionales, como la conversión de correo electrónico en eventos o en tareas pendientes mediante arrastrar y soltar.Modelo de almacenamiento. KOrganizer tiene un calendario persistente. El usuario no tiene que preocuparse de cargar ni de guardar el calendario. Los cambios se guardan de forma inmediata en el disco. Si el calendario se cambia externamente, se carga de forma automática y se actualiza en la vista. Un mecanismo de bloqueo se encarga del acceso concurrente al calendario.Deshacer y rehacer. KOrganizer permite un número ilimitado de operaciones de deshacer y rehacer.Integración de tareas pendientes con la vista de la agenda. Las tareas pendientes se muestran en las vistas semanal y diaria. Las tareas pendientes se pueden convertir en eventos arrastrándolas desde la lista de tareas y soltándolas en la vista de la agenda.Adjuntos para eventos y tareas pendientes. Se pueden adjuntar a los eventos y tareas pendientes referencias a páginas web, a archivos locales y a mensajes de correo electrónico. Puede acceder fácilmente a los datos adjuntos mediante un simple clic en las vistas de eventos y de tareas pendientes, así como a la vista de resumen o a los editores.Entrada rápida de tarea pendiente. Un campo de entrada especial permite crear rápidamente una tarea pendiente sin necesidad de abrir un editor. Esto resulta especialmente práctico para crear múltiples tareas pendientes de forma consecutiva.Entrada rápida de evento. Existen varias formas de crear eventos en la vista de la agenda: se pueden crear eventos de escritura anticipada seleccionando un intervalo de tiempo y luego empezando a escribir. Se abrirá un editor y el texto escrito se usará como título. De forma opcional, el editor de eventos se puede abrir al terminar la selección de tiempo. Además de las típicas entradas del menú y de la barra de herramientas, dispone de atajos de teclado y de un menú de contexto para iniciar el diálogo de edición.Impresión. Los calendarios se pueden imprimir usando distintos estilos. La impresión también permite color y eventos que se solapan.Integración con KMail. KMail permite transferir directamente invitaciones y otros adjuntos de calendario a KOrganizer."
