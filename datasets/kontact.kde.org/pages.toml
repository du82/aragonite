["https://kontact.kde.org/sl/components/korganizer"]
title = "KOrganizer - Kontact Suite"
description = "KOrganizer je zmogljiv in s funkcijami bogat organizator, upravitelj dogodkov in opravil, ki se dobro integrira s preostalim Kontactom, zlasti s KMailom."
full_description = "KOrganizerKOrganizer je komponenta koledarja in razporejanja opravil v Kontactu. Omogoča upravljanje dogodkov in nalog, obveščanje o alarmih, spletni izvoz, omrežno pregledno ravnanje s podatki, skupinsko razporejanje, uvoz in izvoz koledarskih datotek in drugo. Lahko deluje skupaj s široko paleto storitev vodenja koledarjev, vključno z NextCloud, Kolab, Google Calendar in drugimi. KOrganizer je popolnoma prilagodljiv vašim potrebam in je sestavni del zbirke Kontact, katere cilj je biti celovita rešitev za organizacijo vaših osebnih podatkov. KOrganizer podpira dva prevladujoča standarda za shranjevanje in izmenjavo koledarskih podatkov, vCalendar in iCalendar.ZmožnostiPodpora za več koledarjev in seznamov opravil. Korganizer lahko pregledno združuje koledarske podatke iz različnih datotek ali drugih virov koledarskih podatkov, na primer koledarjev v spletu. Priročno jih je mogoče aktivirati, deaktivirati, dodati in odstraniti iz grafičnega uporabniškega vmesnika.Integracija Kontakta. KOrganizer je v celoti integriran s Kontactom, popolno aplikacijo za upravljanje osebnih podatkov. V Kontactu so na voljo nekatere dodatne funkcije, kot je pretvorba e-pošte v dogodke ali opravila z metodo povleci in spusti.Model shranjevanja. KOrganizer ima trajni koledar. Uporabniku ni treba skrbeti za nalaganje ali shranjevanje koledarja. Spremembe se takoj shranijo na disk. Če se koledar spremeni zunaj, se samodejno naloži in posodobi v pogledu. Mehanizem za zaklepanje upravlja sočasni dostop do koledarja.Razveljavi in uveljavi. KOrganizer podpira neomejeno število razveljavitev in uveljavitev.Integracija opravil s pogledom dnevnega reda. Opravila so prikazana v tedenskem in dnevnem pogledu. Naloge lahko pretvorite v dogodke tako, da povlečete s seznama opravil in spustite v pogled dnevnega reda.Priponke za dogodke in naloge. Dogodkom in nalogam je mogoče priložiti sklice na spletne strani, lokalne datoteke ali e-poštna sporočila. Do priloženih podatkov je mogoče zlahka dostopati z enim klikom iz pogleda dogodka in opravil ter pogleda povzetka ali urejevalnikovHiter vnos opravil. Posebno vnosno polje omogoča hitro ustvarjanje opravila, ne da bi bilo treba odpreti urejevalnik. To je še posebej priročno za ustvarjanje več opravil zapored.Hitri vnos dogodka. Dogodke lahko ustvarite na več načinov iz pogleda dnevnega reda: Dogodke glede na vrsto vnaprej lahko ustvarite tako, da izberete časovno obdobje in nato preprosto začnete vnašati. Odprl se bo urejevalnik in vneseno besedilo bo pristalo v naslovu. Po želji lahko urejevalnik dogodkov odprete, ko je izbira časa končana in poleg običajnih vnosov menija in orodnih vrstic so na voljo tudi povezave s tipkami in kontekstni meni za zagon pogovornega okna urejevalnika.Podpora za tiskanje. Koledarje je mogoče natisniti v različnih slogih. Tiskanje podpira tudi barve in prekrivajoče se dogodke.Integracija s KMailom. KMail neposredno podpira prenos povabil in drugih prilog koledarja v KOrganizer."
year_published = 2025
