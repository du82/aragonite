["https://kontact.kde.org/es"]
title = "El paquete Kontact - La potente solución para PIM"
description = "Kontact: trabaje con su correo electrónico, calendarios y contactos dentro de la misma ventana"
full_description = "KontactAcceda a todo su correo electrónico, calendarios y contactos desde una única ventana.Saber más KMailAumente su productividad con una aplicación de correo electrónico rica en funciones.Saber más Gestione su correo electrónico, calendario, contactos y otros datos personales con Kontact. Kontact agrupa todo en un único lugar y le ayuda a gestionar sus comunicaciones, organizar su día y trabajar con sus colegas. Sea más productivo con Kontact.KontactKontact unifica todas nuestras aplicaciones PIM en una única ventana para proporcionarle la mejor experiencia y aumentar su productividad. Con Kontact podrá usar todas las herramientas de nuestro potente paquete en un único espacio. Al contrario que las aplicaciones web propietarias, valoramos su privacidad y apoyamos los estándares abiertos, por lo que Kontact le proporciona un completo control sobre sus datos. Por supuesto, también puede acceder a sus datos sin conexión.Leer másKMailKMail es un cliente de correo electrónico de última generación que se integra bien con proveedores de correo ampliamente usados, como GMail. Proporciona varias herramientas y funciones para maximizar la productividad y hacer que resulte fácil y rápido trabajar con grandes cuentas de correo. KMail implementa una gran variedad de protocolos de correo electrónico: POP3, IMAP y Microsoft Exchange (EWS), entre otros.Leer másKAddressBookKAddressBook le permite manejar sus contactos de forma fácil. Está profundamente integrado con el resto de Kontact, proporcionándole una forma fácil de escoger contactos al enviar correo electrónico o crear una invitación para una reunión.Leer másKOrganizerKOrganizer es un organizador potente y repleto de funcionalidades, gestor de eventos y de tareas pendientes que se integra bien con el resto de Kontact, especialmente con KMail.Leer másAkregatorAkregator es un lector de fuentes RSS. Puede descargar automáticamente fuentes RSS de sus sitios favoritos y le permite leer los artículos incluso sin conexión. También proporciona ricas funciones de búsqueda y archivado.Leer másNoticiasSábado, 9 de noviembre de 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Leer másLunes, 2 de septiembre de 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseLeer másJueves, 4 de julio de 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Leer másMartes, 7 de mayo de 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Leer más📢 Ver todas las noticias"
