["https://kontact.kde.org/uk/components/kaddressbook"]
title = "KAddressBook - Комплекс програм Kontact"
description = "За допомогою KAddressBook ви зможете без проблем керувати вашими записами контактів. Програму глибоко інтегровано з рештою Kontact, отже ви зможете легко вибирати записи контактів при надсиланні повідомлення електронної пошти або створення запрошення на засідання."
full_description = "KAddressBookKAddressBook може зберігати усі особисті дані щодо членів вашої сім'я, друзів та інших контактів. У програмі передбачено роботу із широким діапазоном служб, зокрема NextCloud, Kolab, Контактами Google, Microsoft Exchange (EWS) та усіма стандартними серверами CalDAV.МожливостіПотужні можливості з пошуку. У KAddressBook передбачено зручні фільтри та потужні можливості з пошуку.Виявлення та об'єднання дублікатів записів KAddressBook може виявляти дублікати записів, які походять із декількох джерел, і об'єднувати їх до одного запису контакту.Інтеграція. Інтеграція з іншими компонентами Kontact, зокрема експортування нагадувань щодо днів народження до KOrganizer.Коди QR. KAddressBook здатна показувати код QR для усіх записів контактів. Такий код можна легко сканувати за допомогою телефону або надіслати комусь.Добра підтримка стандартів. Програма KAddressBook здатна імпортувати та експортувати дані у майже довільних стандартах зберігання даних адресних книг.Інтеграція із LDAP. Програма може з'єднуватися із декількома серверам LDAP, дані яких згодом використовуватимуться для автоматичного доповнення записів контактів та створення повідомлень у KMail."
