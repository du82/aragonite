full_description = "AkonadiStruktura Akonadi, nazwana na cześć wyroczni bogini sprawiedliwości w Ghanie jest jest odpowiedzialna za dostarczanie aplikacjom scentralizowanej bazy danych do przechowywania, indeksowania i wyszukiwania informacji osobistych użytkownika. Obejmuje to wiadomości e-mail, kontakty, kalendarze, wydarzenia, dzienniki, alarmy, notatki itp.FunkcjeWspólna pamięć podręczna danych PIMProjekt niezależny od typuRozszerzalnośćOgólny dostęp offline, zapisywanie zmian i odtwarzanieWykrywanie i rozwiązywanie konfliktów ogólnychZasoby można grupować według profiluPozycje składające się z wielu niezależnie wyszukiwanych częściMożliwość odzyskiwania bez kopiowaniaRównoczesny dostęp umożliwia działanie w tle niezależnie od klienta UISynchronizacja poczty, kalendarza, książek adresowych z serwerami zdalnymiUmożliwia infrastrukturze pulpitów semantycznych dostęp do danych PIMArchiwizowanieIndeksowanieWyszukiwanie pozaprocesoweProjektowanie wieloprocesoweIzolacja w przypadku awariiDuże elementy nie mogą zablokować całego systemuPowiązanie przez IPC umożliwia stosowanie komponentów zastrzeżonych"
