["https://kontact.kde.org/ca/components/kaddressbook"]
title = "KAddressBook - Paquet Kontact"
description = "El KAddressBook us permet gestionar els vostres contactes fàcilment. Està profundament integrat amb la resta del Kontact, que us permet triar fàcilment els contactes quan envieu un correu electrònic o creant una invitació a una reunió."
full_description = "KAddressBookEl KAddressBook emmagatzema tots els detalls personals de la vostra família, amistats i altres contactes. Permet una gran varietat de serveis, incloent-hi NextCloud, Kolab, Google Contacts, Microsoft Exchange (EWS) o qualsevol servidor estàndard de CalDAV.CaracterístiquesCerca potent. El KAddresbook té filtres configurables i capacitats de cerca potent.Detecció de duplicats i fusió. El KAdressbook pot trobar contactes duplicats de múltiples fonts i els pot fusionar en un contacte únic.Integració. S'integra amb altres components del Kontact, p. ex., exportant recordatoris del dia de naixement al KOrganizer.Codis QR. El KAddressbook pot mostrar un codi QR per a cada contacte per a escanejar-lo ràpidament al telèfon o enviar-lo a algú.Administració estàndard avantatjosa. El KAddresbook pot importar i exportar contactes des de i cap a gairebé tots els estàndards de llibreta d'adreces.Integració LDAP. Es pot connectar a diversos servidors LDAP, que després es poden utilitzar per a la compleció automàtica de contactes quan es redacten correus electrònics al KMail."
year_published = 2025
