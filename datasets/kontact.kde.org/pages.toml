["https://kontact.kde.org/ko/components/kaddressbook"]
title = "KAddressBook - Kontact 제품군"
description = "KAddressBook을 사용하면 연락처를 쉽게 관리할 수 있습니다. Kontact의 나머지와 강력하게 통합되어 있으며, 이메일을 보내거나 초대장을 발송할 때에도 정보를 활용할 수 있습니다."
full_description = "KAddressBookKAddressBook은 가족, 친구, 직장 등 연락처 정보를 저장하고 관리합니다. Nextcloud, Kolab, Google 연락처, Microsoft Exchange(EWS) 및 표준 CalDAV 서버와 연동할 수 있습니다.기능강력한 검색 기능. KAddressBook에는 설정 가능한 필터와 강력한 검색 기능이 있습니다.중복 확인 및 합치기. KAddressBook에서는 여러 곳에서 중복되는 연락처를 하나로 합칠 수 있습니다.통합. KOragnizer에 생일 알림을 추가하는 것과 같은 다른 Kontact 구성 요소와 통합할 수 있습니다.QR 코드. KAddressBook은 휴대폰에서 빠르게 스캔하거나 다른 사람에게 연락처 정보를 보낼 때 QR 코드를 표시할 수 있습니다.표준 지원. KAddressBook에서는 거의 모든 주소록 표준 형식으로 연락처를 가져오고 내보낼 수 있습니다.LDAP 통합. 여러 LDAP 서버에 연결할 수 있으며 KMail에서 메일을 작성할 때 주소 자동 완성에 사용할 수 있습니다)."
