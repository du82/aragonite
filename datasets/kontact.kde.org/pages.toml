["https://kontact.kde.org/pt-pt/components/korganizer"]
title = "KOrganizer - Pacote Kontact"
description = "O KOrganizer é um organizador, um gestor de eventos e tarefas poderoso e rico em funcionalidades e que se integra bem com o resto do Kontact, especialmente com o KMail."
full_description = "KOrganizerO KOrganizer é o componente de calendários e agendas do Kontact. Oferece a gestão de eventos e tarefas, a notificação dos alarmes, exportação para a Web, tratamento dos dados de forma transparente na rede, agendamentos em grupo, importação e exportação de ficheiros de calendários, entre outros. É capaz de funcionar em conjunto com uma grande variedade de serviços de calendários, incluindo o NextCloud, o Kolab, o Google Calendar, entre outros. O KOrganizer é completamente personalizado de acordo com as suas necessidades e faz parte integral do pacote Kontact, pretendendo ser uma solução completa para organizar os seus dados pessoais. O KOrganizer suporta as duas normas dominantes para guardar e trocar os dados do calendário em vCalendar e iCalendar.CaracterísticasSuporte para vários calendários e listas de itens por-fazer. O Korganizer consegue reunir de forma transparente os dados de calendário de vários ficheiros ou outras fontes de dados de calendário, como por exemplo calendários na Web. Os mesmos podem ser convenientemente activados, desactivados, adicionados e removidos na interface do utilizador.Integração com o Kontact. O KOrganizer está completamente integrado no Kontact, a aplicação completa de gestão de informações pessoais. Dentro do Kontact, estão disponíveis algumas funcionalidades adicionais, como a conversão de e-mails para eventos ou itens por-fazer por arrastamento.Modelo de armazenamento. O KOrganizer tem um calendário persistente. O utilizador não tem de tomar conta do carregamento ou gravação do calendário. As modificações são gravadas de imediato para o disco. Se o calendário for modificado a nível externo, será carregado e actualizado de forma automática na janela. Existe um mecanismo de bloqueio que lida com o acesso concorrente ao calendário.Desfazer e Refazer. O KOrganizer suportar a anulação e repetição das várias operações.Integração das tarefas com a agenda. As tarefas ou itens por-fazer são apresentados nas vistas semanais e diárias. Estes podem ser convertidos para eventos se os arrastar da lista de itens por-fazer e os largar na agenda.Anexos para os eventos e itens por-fazer. As referências para as páginas Web, ficheiros locais ou e-mails podem ser anexadas a eventos ou itens por-fazer. Os dados em anexo poderão ser acedidos de forma simples com um simples 'click' nas áreas de visualização dos eventos e itens por-fazer, assim como nas áreas de resumo dos editoresIntrodução rápida de itens por-fazer. Um campo de texto especial permite-lhe criar um item por-fazer sem ter de abrir um editor. Isto é especialmente útil para criar vários itens de uma vez.Introdução rápida de eventos. Existem várias formas de criar eventos a partir da agenda: Poderá criar eventos por escrita prévia, seleccionando um intervalo de datas e começando logo a escrever. Será aberto um editor e o texto escrito irá parar ao título. Opcionalmente, o editor de eventos poderá ser aberto quando terminar a selecção das datas e, para além dos itens de menu e da barra de ferramentas normais, existem combinações de teclas e um menu de contexto para iniciar a janela do editor.Suporte para a impressão. Os calendários poderão ser impressos com vários estilos diferentes. A impressão também suporta as cores e a sobreposição de eventos.Integração com o KMail. O KMail suporta directamente a transferência dos convites e outros anexos de calendário para o KOrganizer."
year_published = 2025
