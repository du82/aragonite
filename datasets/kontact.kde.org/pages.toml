["https://kontact.kde.org/ko/components/akregator"]
title = "Akregator - Kontact 제품군"
description = "Akregator는 RSS 피드 리더입니다. 즐겨찾는 사이트에서 RSS 피드를 자동으로 다운로드하여 오프라인인 상태에서도 글을 읽을 수 있습니다. 다양한 검색 기능과 압축 기능을 제공합니다."
full_description = "AkregatorAkregator는 KDE 닷 뉴스나 플래닛 KDE 블로그와 같은 웹사이트에서 새로운 소식을 구독할 수 있습니다. 많은 사이트에서 지원하는 RSS를 사용합니다.기능간단하게 사용 가능여러 개의 피드 지원읽지 않은 피드 알림전체 글을 읽을 수 있도록 탭 지원피드 압축피드 가져오기와 내보내기 Akregator는 KDE 닷 뉴스나 플래닛 KDE 블로그와 같은 웹사이트에서 새로운 소식을 구독할 수 있습니다. 많은 사이트에서 지원하는 RSS를 사용합니다. KDE에 대한 사랑을 보여 주세요! KDE를 주제로 한 책, 머그, 의류 등 다양한 상품이 있습니다. KDE 웹 마스터 팀(공개 메일링 리스트)에서 관리합니다. KDE®와 K Desktop Environment® 로고는 KDE e.V.의 등록 상표입니다 | 법적 정보"
