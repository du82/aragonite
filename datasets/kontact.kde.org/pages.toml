["https://kontact.kde.org/eu/components/kmail"]
title = "KMail - Kontact Suitea"
description = "KMail azken belaunaldiko e-posta bezeroa bat da, GMail gisako erabilera zabaleko e-posta hornitzaileekin ongi bateratzen dena. Produktibitatea maximizatzeko tresna eta ezaugarri asko eskaintzen ditu, eta e-posta kontu handiekin lan egitea erraztu eta azkartzen du. KMail-ek e-posta protokolo ugari onartzen ditu - POP3, IMAP, Microsoft Exchange (EWS) eta gehiago."
full_description = "KMailKMail Kontact, KDEren informazio pertsonaleko kudeatzaile bateratuaren e-posta osagaia da.SeguruaLehenespen segurua. Ezaugarrien gainetik segurtasuna eta pribatutasuna lehenesten dituzten ezarpenak.Muturren artean zifratzea. OpenPGP eta S/MIME euskarria barnean eraikia du, eta ezarpen bat eta gako sorrerarako morroi batek erabiltzaileei horrekin lehen urratsak ematen laguntzen die.Garraioa zifratzea. SSL/TLS zifratutako komunikazioaren euskarria ere badago noski, baita GSSAPI (Kerberos) edo OAuth2 bezalako autentifikazio metodoak ere.HTML edukiaren isolamendu handia. HTML duten e-postak saihestu ezin badira, «KMail»ek ziurtatzen du kanpoko ezein erreferentzia ezingo dela hortik zehar ezkutatu, zure datuak ezkutuan jakinarazteko edo zure pribatutasuna arriskuan jartzeko. Horrez gainera, «KMail»eko «phishing»-babesek, e-posta horietako lotura susmagarrien berri ematen du.«Spam» babesa. Zure e-postaren zerbitzaria dagoeneko horretaz arduratzen ez bada, «KMail»ek «spam» aztertzaile ezagunak lokalki integratu ditzake, «SpamAssassin» edo «Bogofilter» esaterako.AhaltsuaLerroz-kanpo aritzeko gai. «KMail»ek sare-konektagarritasunik gabe jarduteko aukera ematen dizu, aukera gisa, zure e-posta osoa lokalki sinkronizatuz.Nortasun anizkoitzak. «KMail»ek nortasunak kontuekiko bereizten ditu, erakunde anitzetan ardura ezberdinak eramateko malgutasun handia emanez.Txantiloiak. Txantiloi eta testu-zati sistema malgu batek, zure e-postak idazteko, atalak automatizatzeko euskarria ematen dizu.Eleaniztuna. Barnean eraikitako edukia itzultzeko euskarriak, eta ortografia zuzentzeko paragrafokako hizkuntza antzemate automatikoak eduki eleaniztunarekin aritzeko sostengua ematen dizute.Konposatzaile emankorra. KMail-en e-posta konposatzaileak eraginkorragoa izateko laguntzaile txiki asko dakartza, ahaztutako eranskinei buruz abisua ematea, lerro barruko eranskinak konprimatzea edo erantsitako irudien neurria aldatzeagisakoak.Iragazte ahaltsua. E-postak baldintza ugariren arabera sailkatzea automatizatzeaz gain, KMail-en iragazte-sistema lan-fluxu arbitrarioak ezartzeko ere erabil daiteke, kanpoko aplikazioekin integratu baitaiteke.Bilatzea eta etiketatzea. Mezuetan banderak eta etiketak ipintzea sailkatzen eta informazioa berreskuratzen laguntzen du, baita bilaketa gaitasun lokal eta urruneko ahaltsuek ere.Posta-zerrenda kudeaketa. Mailman posta-zerrendak automatikoki antzeman daitezke eta posta-zerrendak kudeatzeko eragiketa arruntak KMail-en barrua zuzenean erabilgarri daude.Konfigurazio malgua. Konfigurazio aukera zenbatezinek KMail-en alderdi asko zure behar eta desira zehatzetan ezartzeko aukera ematen dizute.BateratuaiTip Invitations. Meeting invitation emails are detected and offer in-place quick responses, and are of course fed into KOrganizer.Addressbook. Besides auto-completing address from KAddressBook, KMail also uses avatars and crypto preferences from there.Erreserba e-postak. KMail-ek hornitzaile jakin batzuen e-postetan hegaldi eta hotel erreserbak antzeman ditzake eta zure egutegian gehitzea eskaintzen du.Estandarra betetzen duenaIMAP, POP3 eta SMTP posta protokolo estandarrak onartzen ditu.«push» e-postaren euskarria du (IMAP IDLE).IMAP karpetetan bilatzeko euskarri osoa.Lerro barruko OpenPGP, PGP/MIME, eta S/MIME berezko euskarria.Zerbitzari aldean «Sieve» iragaztea onartzen du."
