["https://kontact.kde.org/eu/components/kaddressbook"]
title = "KAddressBook - Kontact Suitea"
description = "«KAddressBook»ek zure kontaktuak erraz kudeatzeko aukera ematen dizu. «Kontact»eko gainerako atalekin sakonki bateratuta egonik, e-posta bat bidaltzean edo bilera baterako gonbidapen bat sortzean zure kontaktuak erraz hautatzen uzten dizu."
full_description = "KAddressBook«KAddressBook»ek zure sendiaren, lagunen eta beste kontaktuen xehetasun pertsonal guztiak gordetzen ditu. Zerbitzu aniztasun handia onartzen du, NextCloud, Kolab, Google Contacts, Microsoft Exchange (EWS) edo edozein CalDAV zerbitzari estandar barne.EzaugarriakBilaketa ahaltsua. «KAddressbook»ek iragazki konfiguragarriak eta bilaketa gaitasun ahaltsuak ditu.Bikoiztuak antzeman eta bateratzea. «KAddressbook»ek sorburu anitzetako bikoiztutako kontaktuak aurki ditzake eta kontaktu barrean batera ditzake.Integrazioa. «Kontact»eko beste osagaiekin integratzen da, adib. Urtebetetze oroigarriak KOrganizerrera esportatzeko.QR kodeak. - KAddressBook-ek kontaktu bakoitzaren QR kode bat azaldu dezake, hura zure telefonoarekin azkar eskaneatzeko edo norbaiti bidaltzeko.Estandarren euskarri ona. «KAddressbook»ek helbide-liburu estandar ia guztiekin kontaktuak inportatu eta esportatu ditzake.LDAP integrazioa. LDAP zerbitzari anizkoitzetara konekta daiteke, ondoren, KMailekin e-postak konposatzeko kontaktuak automatikoki osatzeko erabil daitezkeelarik."
