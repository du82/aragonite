title = "Kontact Suite - The Powerful PIM Solution"
description = "Kontact - spravujte poštu, kalendáře a kontakty v jediném okně"
full_description = "KontactHandle all your emails, calendars and contacts within a single window.Chcete se dozvědět více? KOrganizerOrganizer your time! Manage events, todos, schedule meetings and more.Chcete se dozvědět více? Handle your email, calendar, contacts and other personal data with Kontact. Kontact groups everything together in one place and helps you manage your communications, organize your day and work with your colleagues. Become more productive with Kontact.KontactKontact unifies all our PIM applications into a single window to give you the best possible experience and boost your productivity. With Kontact you can use all the tools of our powerful suite in one place. Unlike proprietary web applications we value your privacy and support open standards, which is why Kontact gives you full control over your data. You can of course also access your data offline if you want to.Více informacíKMailKMail is a state-of-the-art email client that integrates well with widely used email providers like GMail. It provides many tools and features to maximize your productivity and makes working with large email accounts easy and fast. KMail supports a large variety of email protocols - POP3, IMAP, Microsoft Exchange (EWS) and more.Více informacíKAddressBookKAddressBook allows you to manage your contacts easily. It is deeply integrated with the rest of Kontact, allowing you to easily pick your contacts when sending an email or creating a meeting invitation.Více informacíKOrganizerKOrganizer is a powerful and feature-rich organizer, event and todo manager that integrates well with the rest of Kontact, especially with KMail.Více informacíAkregatorAkregator is an RSS feed reader. It can automatically download RSS feeds from your favorite sites and allows you to read the articles even when you are offline. Also provides rich search functionality and archiving features.Více informacíNovinkySobota, 9 Listopad 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Více informacíPondělí, 2 Září 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseVíce informacíČtvrtek, 4 Červenec 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Více informacíÚterý, 7 květen 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Více informací📢 Zobrazit všechny novinky"
