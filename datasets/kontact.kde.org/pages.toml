["https://kontact.kde.org/download"]
title = "Download - Kontact Suite"
description = "Kontact - handle your emails, calendars and contacts within a single window"
full_description = "DownloadLinuxKontact is already available on majority of Linux distributions. It can be installed directly from Discover, GNOME Software or your distribution’s software store.Release SourcesKontact is released regularly as part of KDE Gear. You can find Kontact latest stable release among the tarballs from the latest KDE Gear release.If you want to build Kontact from sources, we recommend checking our Getting Involved page which contains links to full guide how to compile Kontact.FlatpakYou can install the latest Kontact flatpak from Flathub. Experimental flatpaks with nightly builds of Kontact can be installed from the KDE Flatpak repository.GitKontact is spread across a multitude of repositories. Check our Getting Involved page for detailed instructions how to get all Kontact repositories.WindowsWe are currently working on bringing Kontact to Windows. Do you want to help us? Check how to get involved and get in touch with us!InstallationTo install Kontact or one of its components as a stand-alone application, follow the instructions of the platform you are using for how to install software. Most platforms have a graphical installer which can be used to install software packages. In many cases it will automatically be opened when clicking the download or install link for your platform. There is a generic tutorial for installing KDE applications which also can be applied to Kontact.If you are using Linux, Kontact might already be pre-installed on your system as part of a default selection. If not, you can install it with the package management tool of your Linux distribution. See its documentation for details.In many cases you will have the opportunity to install Kontact in a modular way, so you can decide to only install the set of components you actually want to use. Translations of the user interface often also will be available as separate module you can install according to your needs and preferences.UninstallationTo uninstall Kontact, follow the instructions of the package management tool you have used to install Kontact and its components. This will remove the components of your choice. It will not touch data you have viewed, created, or modified with Kontact."
