["https://kontact.kde.org/ca"]
title = "Paquet del Kontact - La potent solució de PIM"
description = "Kontact: gestioneu els vostres correus, calendaris i contactes des d'una finestra única"
full_description = "KontactGestioneu el correu electrònic, calendaris i contactes des d'una única finestra.Apreneu ne més KMailPotencieu la vostra productivitat amb una aplicació de correu electrònic plena de característiques.Apreneu ne més KOrganizerOrganitzeu el vostre temps! Gestioneu esdeveniments, tasques pendents, cites i més.Apreneu ne més Gestioneu el vostre correu electrònic, calendari, contactes i altres dades personals amb el Kontact. El Kontact ho agrupa tot en un lloc i us ajuda a gestionar les vostres comunicacions, organitzar el dia i treballar amb els col·legues. Sigueu més productiu amb el Kontact.KontactEl Kontact unifica totes les nostres aplicacions PIM en una finestra única per a donar-vos la millor experiència possible i impulsar la vostra productivitat. Amb el Kontact podeu utilitzar totes les eines del nostre potent paquet en un sol lloc. A diferència de les aplicacions web propietàries, valorem la vostra privadesa i admetem estàndards oberts, i és per això que el Kontact us dona un control total de les vostres dades. Per descomptat també podeu accedir a les vostres dades fora de línia si voleu.Llegiu mésKMailEl KMail és un client de correu electrònic que s'integra bé amb els proveïdors de correu electrònic àmpliament utilitzats com el GMail. Proporciona moltes eines i característiques per a maximitzar la vostra productivitat i fa que treballar amb comptes grans de correu electrònic sigui fàcil i ràpid. El KMail permet una gran varietat de protocols de correu electrònic: POP3, IMAP, Microsoft Exchange (EWS) i més.Llegiu mésKAddressBookEl KAddressBook us permet gestionar els vostres contactes fàcilment. Està profundament integrat amb la resta del Kontact, que us permet triar fàcilment els contactes quan envieu un correu electrònic o creant una invitació a una reunió.Llegiu mésKOrganizerEl KOrganizer és un organitzador potent ple de característiques, gestor d'esdeveniments i tasques pendents que s'integra bé amb la resta del Kontact, especialment amb el KMail.Llegiu mésAkregatorL'Akregator és un lector de canals RSS. Pot descarregar automàticament els canals RSS dels llocs preferits i permet llegir els articles fins i tot quan esteu fora de línia. També proporciona una funcionalitat de cerca avançada i característiques d'arxiu.Llegiu mésNotíciesDissabte, 9 de novembre de 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Llegiu mésDilluns, 2 de setembre de 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseLlegiu mésDijous, 4 de juliol de 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Llegiu mésDimarts, 7 de maig de 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Llegiu més📢 Mostra totes les notícies"
