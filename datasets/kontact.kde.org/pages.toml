["https://kontact.kde.org/sl"]
title = "Kontact Suite – zmogljiva rešitev upravljanja osebnih podatkov"
description = "Kontact - upravljajte svojo e-pošto, koledarje in stike v enem samem oknu"
full_description = "KontactUpravljajte z vsemi e-poštnimi sporočili, koledarji in stiki v enem samem oknu.Preučite več KOrganizerOrganizirajte svoj čas! Upravljajte dogodke, opravila, načrtujte sestanke in še več.Preučite več S Kontactom upravljajte svojo e-pošto, koledar, stike in druge osebne podatke. Kontact združuje vse na enem mestu in vam pomaga upravljati komunikacijo, organizirati dan in delati s sodelavci. Postanite bolj produktivni s Kontactom.KontactKontact združuje vse naše aplikacije PIM v eno okno, da vam zagotovi najboljšo možno izkušnjo in poveča vašo produktivnost. S Kontactom lahko na enem mestu uporabljate vsa orodja našega zmogljivega paketa. Za razliko od lastniških spletnih aplikacij cenimo vašo zasebnost in podpiramo odprte standarde, zato vam Kontact omogoča popoln nadzor nad vašimi podatki. Seveda lahko do svojih podatkov dostopate tudi brez povezave, če želite.Preberite večKMailKMail je najsodobnejši e-poštni odjemalec, ki se dobro integrira s široko uporabljenimi ponudniki e-pošte, kot je GMail. Zagotavlja številna orodja in funkcije za povečanje vaše produktivnosti ter omogoča enostavno in hitro delo z velikimi e-poštnimi računi. KMail podpira veliko različnih e-poštnih protokolov – POP3, IMAP, Microsoft Exchange (EWS) in drugo.Preberite večKAddressBookKAddressBook vam omogoča enostavno upravljanje stikov. Je globoko integriran z ostalim Kontactom, kar vam omogoča, da preprosto izberete svoje stike, ko pošiljate e-pošto ali ustvarjate vabilo na sestanek.Preberite večKOrganizerKOrganizer je zmogljiv in s funkcijami bogat organizator, upravitelj dogodkov in opravil, ki se dobro integrira s preostalim Kontactom, zlasti s KMailom.Preberite večAkregatorAkregator je bralnik virov RSS. Lahko samodejno prenese vire RSS z vaših priljubljenih spletnih mest in vam omogoča branje člankov, tudi kadar niste povezani. Zagotavlja tudi bogato funkcionalnost iskanja in funkcije arhiviranja.Preberite večNoviceSobota, 9. november 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Preberite večPonedeljek, 2. september 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releasePreberite večČetrtek, 4. julij 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Preberite večTorek, 7. maj 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Preberite več📢 Poglej vse novice"
