["https://kontact.kde.org/pt-pt/components/kontact"]
title = "Kontact - Pacote Kontact"
description = "O Kontact unifica todas as nossas aplicações de PIM numa única janela para lhe dar a melhor experiência possível e aumentar a sua produtividade. Com o Kontact, poderá usar todas as ferramentas do nosso pacote poderoso num único local. Ao contrário das aplicações Web proprietárias, valorizamos a sua privacidade e o suporte para padrões abertos, e é por isso que o Kontact lhe dá o controlo total sobre os seus dados. Poderá obviamente aceder aos seus dados desligado da rede, se o desejar."
full_description = "KontactO Kontact é um pacote de gestão de informações pessoais rico em funcionalidades criado pelo KDE. O Kontact unifica todas as suas aplicações de PIM numa única janela para que possa lidar com os seus e-mails, calendários, notícias e outros dados de forma ainda mais eficiente. Também poderá correr cada um dos componentes do Kontact como uma aplicação autónoma.Rico em funcionalidadesAcreditamos que as aplicações se devem adaptar aos seus processos de trabalho, em vez de o obrigar a adaptar-se ao delas. O Kontact é altamente configurável e personalizado, para que o possa configurar da forma exacta que resultar para si. Consulte as páginas individuais dos componentes do Kontact para ter uma visão geral de algumas das funcionalidades que cada um deles pode oferecer.FlexívelO Kontact suporta uma grande variedade de serviços e protocolos de e-mail, calendários e livros de endereços e pode ser estendido facilmente para suportar os serviços adicionais. Não precisa de mudar de fornecedor de e-mail ou migrar o seu calendário para outro local para que o tenha sincronizado no Kontact. Basta apontar o Kontact para o serviço onde estão os seus dados PIM e o Kontact apresentá-los-á e mantê-los-á sincronizados.O Kontact também consegue importar os seus dados de PIM e algumas definições de outros pacotes PIM, como o Thunderbird e o Evolution.SeguroO Kontact tem suporte para todas as normas modernas de segurança para proteger a sua privacidade. Toda a comunicação com os servidores remotos é encriptada por omissão, usando a norma-padrão de encriptação SSL/TLS. O Kontact também tem o suporte de base para a assinatura e encriptação de e-mails com o GPG e o S/MIME e consegue verificar automaticamente as assinaturas dos e-mails.O Kontact está configurado por omissão para proteger a sua privacidade, bloqueando o carregamento de conteúdos externos, as respostas automáticas e outros truques usados frequentemente pelos burlões.IntegradoTodos os componentes do Kontact estão bem integradas em conjunto. O KOrganizer consegue enviar os convites para as reuniões através das contas de e-mail configuradas no KMail. O KMail irá apresentar os convites para as reuniões e mostrar-lhe os conflitos com outros eventos nos seus calendários. Poderá misturar os seus eventos normais e de itens por-fazer na Agenda do KOrganizer.Livre e de Código AbertoO Kontact é livre (no sentido do discurso livre ou livre como a cerveja) e está completamente como código aberto. Isto significa que o código-fonte está público, para que todos vejam, auditem e melhorem.Orgulhamo-nos na nossa abertura e no nosso foco em proteger a privacidade dos utilizadores. O Kontact não o irá espiar, não lhe irá apresentar publicidade, não irá guardar os seus dados mais importantes numa 'cloud' proprietária ou partilhá-los seja com quem for. Veja mais detalhes na Política de Privacidade das Aplicações do KDE."
