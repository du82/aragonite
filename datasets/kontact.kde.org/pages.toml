["https://kontact.kde.org/ca/get-involved"]
title = "Col·laboreu-hi - Paquet Kontact"
description = "El codi font del Kontact s'estén a través de molts components en molts repositoris: és fàcil perdre's i aclaparar-se si sou nou. Si voleu involucrar-vos en el desenvolupament del Kontact simplement llegiu els materials enllaçats des d'aquesta pàgina i poseu-vos en contacte amb nosaltres: us ajudarem a trobar el camí pel nostre codi base."
full_description = "Col·laboreu-hiEl codi font del Kontact s'estén a través de molts components en molts repositoris: és fàcil perdre's i aclaparar-se si sou nou. Si voleu involucrar-vos en el desenvolupament del Kontact simplement llegiu els materials enllaçats des d'aquesta pàgina i poseu-vos en contacte amb nosaltres: us ajudarem a trobar el camí pel nostre codi base.Comenceu llegint informació sobre el wiki de la comunitat KDE PIM.Oportunitats de feinaCerqueu algunes tasques senzilles per a començar a millorar el Kontact? Llavors revises les nostres oportunitats de feina. Hem recollit una sèrie de tasques que són bastant senzilles i aïllades i no requereixen una comprensió en profunditat de tota la base de codis i l'arquitectura, un punt d'entrada perfecte en el món del Kontact.Si voleu començar a treballar en alguna tasca, us la podeu assignar a vosaltres mateixos (a menys que ja estigui assignada a algú altre) i feu-nos-ho saber en els comentaris de sota la tasca.Construcció de l'aplicació Kontact a partir del codi fontSeguiu aquesta Guia de com començar amb el desenvolupament del Kontact. Conté enllaços a moltes altres pàgines wiki útils amb molta informació.També tenim un entorn Docker de manera que podreu desenvolupar i provar el Kontact en un aïllament segur de la vostra configuració de producció.Mantenir-se en contacte!Els desenvolupadors de Kontact generalment es troben pels canals d'IRC #kontact i #akonadi en el xat de Libera. La majoria dels debats relacionats amb el desenvolupament tenen lloc a la llista de correu kde-pim. Uniu-vos, digueu hola i expliqueu-nos en què us agradaria ajudar-nos!No sou programador?No és cap problema! Hi ha moltes altres tasques en què podeu ajudar a fer millor Kontact si no coneixeu cap llenguatge de programació!Triatge d'errors: ajudeu-nos a cercar informes d'error incomplets, duplicats o no vàlids al BugzillaLocalització: ajudeu-nos a traduir l'aplicació Kontact al vostre idiomaDocumentació: ajudeu-nos a millorar la documentació d'usuari per a fer l'aplicació Kontact més fàcil d'emprar per als nouvingutsPromoció: ajudeu-nos a promocionar l'aplicació Kontact tant en línia com fora de líniaActualització del wiki: ajudeu-nos a actualitzar la informació present al wiki, afegir guies d'aprenentatge noves,… per a facilitar que altres s'uneixin!Teniu altres idees? Contacteu amb nosaltres!"
year_published = 2025
