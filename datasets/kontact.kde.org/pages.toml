["https://kontact.kde.org/ko"]
title = "Kontact 제품군 - 강력한 PIM 솔루션"
description = "Kontact - 단일 창에서 이메일, 캘린더, 연락처를 처리할 수 있습니다"
full_description = "Handle your email, calendar, contacts and other personal data with Kontact. Kontact groups everything together in one place and helps you manage your communications, organize your day and work with your colleagues. Become more productive with Kontact.KontactKontact unifies all our PIM applications into a single window to give you the best possible experience and boost your productivity. With Kontact you can use all the tools of our powerful suite in one place. Unlike proprietary web applications we value your privacy and support open standards, which is why Kontact gives you full control over your data. You can of course also access your data offline if you want to.자세한 내용 보기KMailKMail is a state-of-the-art email client that integrates well with widely used email providers like GMail. It provides many tools and features to maximize your productivity and makes working with large email accounts easy and fast. KMail supports a large variety of email protocols - POP3, IMAP, Microsoft Exchange (EWS) and more.자세한 내용 보기KAddressBookKAddressBook을 사용하면 연락처를 쉽게 관리할 수 있습니다. Kontact의 나머지와 강력하게 통합되어 있으며, 이메일을 보내거나 초대장을 발송할 때에도 정보를 활용할 수 있습니다.자세한 내용 보기KOrganizerKOrganizer is a powerful and feature-rich organizer, event and todo manager that integrates well with the rest of Kontact, especially with KMail.자세한 내용 보기AkregatorAkregator는 RSS 피드 리더입니다. 즐겨찾는 사이트에서 RSS 피드를 자동으로 다운로드하여 오프라인인 상태에서도 글을 읽을 수 있습니다. 다양한 검색 기능과 압축 기능을 제공합니다.자세한 내용 보기News2024년 11월 9일 토요일September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2자세한 내용 보기2024년 9월 2일 월요일July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear release자세한 내용 보기2024년 7월 4일 목요일May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.자세한 내용 보기2024년 5월 7일 화요일March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.자세한 내용 보기📢 View all news"
