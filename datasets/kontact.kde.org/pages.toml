full_description = "AkregatorO Akregator ajuda-o a manter-se informado sobre as novas histórias nas páginas Web como o KDE Dot News ou o Planet KDE. A tecnologia usada é o RSS e muitos servidores têm suporte para a mesma.CaracterísticasSimples de usarConsegue aceitar dezenas de fontesConsegue notificá-lo das fontes não lidasUsa páginas separadas para dar acesso à leitura interna das histórias completasArquivo das fontesImportação e exportação das fontes O Akregator ajuda-o a manter-se informado sobre as novas histórias nas páginas Web como o KDE Dot News ou o Planet KDE. A tecnologia usada é o RSS e muitos servidores têm suporte para a mesma. Mantida pelos Administradores Web do KDE (lista de correio pública). O KDE® e o logótipo do Ambiente de Trabalho K® são marcas comerciais registadas da KDE e.V. | Legal"
