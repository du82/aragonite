["https://kontact.kde.org/it/components/kaddressbook"]
title = "KAddressBook - Suite Kontact"
description = "KAddressBook ti permette di gestire i tuoi contatti in modo semplice. Si integra strettamente col resto di Kontact, permettendoti di recuperare facilmente i contatti durante l'invio di un messaggio o la creazione di un invito a una riunione."
full_description = "KAddressBookKAddressBook salva tutti i dettagli personali della tua famiglia, degli amici e di altri contatti. Supporta una grande varietà di servizi, incluso NextCloud, Kolab, Google Contacts, Microsoft Exchange (EWS) o qualsiasi altro server CalDAV standard.CaratteristicheRicerca potente. KAddresbook possiede filtri configurabili e capacità di ricerca avanzate.Individuazione e unione di duplicati. KAdressbook è in grado di trovare i contatti duplicati da più fonti e unirli in un unico contatto.Integrazione. Si integra con gli altri componenti di Kontact, per esempio esportando gli avvisi di compleanno in KOrganizer.Codici QR. KAddressbook può visualizzare un codice QR per ogni contatto per analizzarlo rapidamente col tuo telefono o per inviarlo a qualcuno.Buon supporto degli standard. KAddresbook può importare ed esportare i contatti praticamente da e in qualsiasi rubrica standard.Integrazione LDAP. È in grado di collegarsi a più server LDAP, utilizzabili per il completamento automatico dei contatti durante la composizione dei messaggi di posta elettronica in KMail."
