["https://kontact.kde.org/pt-pt/components/kaddressbook"]
title = "KAddressBook - Pacote Kontact"
description = "O KAddressBook permite-lhe gerir os seus contactos de forma simples. Está completamente integrado com o resto do Kontact, permitindo-lhe escolher facilmente os seus contactos ao enviar um e-mail ou ao criar um convite para uma reunião."
full_description = "KAddressBookO KAddressBook guarda todos os detalhes pessoais da sua família, amigos e outros contactos. Suporta uma grande variedade de serviços, incluindo o NextCloud, o Kolab, o Google Contacts, o Microsoft Exchange (EWS) ou outro servidor-padrão de CalDAV.CaracterísticasPesquisa poderosa. O KAddresbook tem filtros configuráveis e funcionalidades de pesquisa poderosos.Detecção e reunião de duplicados. O KAdressbook consegue descobrir os duplicados de várias fontes e possibilita a sua reunião num único contacto.Integração. Integra com os outros componentes do Kontact, p.ex. a exportação de lembretes de Aniversários para o KOrganizer.Códigos QR. O KAddressbook consegue agora mostrar um código QR para cada contacto, para a sua digitalização rápida pelo seu telemóvel ou para o enviar para alguém.Bom suporte para as normas-padrão. O KAddresbook consegue importar e exportar os contactos de e para quase todas as normas de livros de endereços.Integração com o LDAP. Consegue ligar-se a vários servidores de LDAP, os quais poderão então ser usados para a completação automática de contactos na composição de e-mails no KMail."
