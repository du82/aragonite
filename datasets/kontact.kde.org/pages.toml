["https://kontact.kde.org/fi"]
title = "Kontact-ohjelmisto – tehokas PIM-ratkaisu"
description = "Kontact – hallinnoi sähköpostia, kalenteria ja yhteystietoja yhdestä ikkunasta"
full_description = "Handle your email, calendar, contacts and other personal data with Kontact. Kontact groups everything together in one place and helps you manage your communications, organize your day and work with your colleagues. Become more productive with Kontact.KontactKontact unifies all our PIM applications into a single window to give you the best possible experience and boost your productivity. With Kontact you can use all the tools of our powerful suite in one place. Unlike proprietary web applications we value your privacy and support open standards, which is why Kontact gives you full control over your data. You can of course also access your data offline if you want to.Read moreKMailKMail is a state-of-the-art email client that integrates well with widely used email providers like GMail. It provides many tools and features to maximize your productivity and makes working with large email accounts easy and fast. KMail supports a large variety of email protocols - POP3, IMAP, Microsoft Exchange (EWS) and more.Read moreKAddressBookKAddressBook allows you to manage your contacts easily. It is deeply integrated with the rest of Kontact, allowing you to easily pick your contacts when sending an email or creating a meeting invitation.Read moreKOrganizerKOrganizer on tehokas ja monipuolinen ajan-, tapahtumien- ja tehtävänhallinta, joka integroituu hyvin Kontactin kokonaisuuteen, etenkin KMailiin.Read moreAkregatorAkregator on RSS-syötelukija. Se osaa automaattisesti ladata suosikkisivustojesi RSS-syötteet ja antaa lukea artikkelit myös verkkoyhteydettä. Se tarjoaa monipuoliset haku- ja arkistointiominaisuudet.Read moreNewsSaturday, 9 November 2024September and October in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in September and October 2024.Since the last report, 24 people have contributed over 1100 changes to the KDE PIM code base. We also released a two bugfix releases of the KDE PIM Suite with the Gear releases 24.08.1 and 24.08.2Read MoreMonday, 2 September 2024July and August in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in July and August 2024.Since the last report, 32 people have contributed over 1300 changes to the KDE PIM code base. We also released a new version of the KDE PIM Suite in August with the Gear releaseRead MoreThursday, 4 July 2024May and June in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of May and June 2024.Since the last report 38 people have contributed over 1500 changes to KDE PIM code base.Read MoreTuesday, 7 May 2024March and April in KDE PIMHere's our bi-monthly update from KDE's personal information management applications team. This report covers progress made in the months of March and April 2024.Since the last report, 36 people contributed more than 1300 code changes. Most of the changes will be available in the coming KDE Gear 24.05 release.Read More📢 View all news"
