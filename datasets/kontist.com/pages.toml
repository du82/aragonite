full_description = '''Geld einzahlenSchnell und einfach Geld auf dein Konto ladenIst dein Kontostand knapp? Dann wird es Zeit, dein Konto aufzustocken! Eine Einzahlung ermöglicht es dir, frisches Kapital auf dein Konto zu überweisen, damit bevorstehende Ausgaben abgedeckt werden können. Hier erfährst du, wie du ganz einfach Geld auf dein Kontist-Konto transferieren kannst und welche bequemen Optionen Kontist dir dafür bietet.Geschäftskonto eröffnenWas ist eine Geldeinzahlung?Bei einer Geldeinzahlung handelt es sich um eine Aufladung deines Bankkontos mit Geld. Eine Geldeinzahlung kannst du ganz bequem online oder mit Hilfe einer App erledigen. Wir erklären dir hier, welche Möglichkeiten du hast.Wie zahle ich Geld auf mein Konto ein?Wenn du Geld einzahlen möchtest, hast du folgende Möglichkeiten:SEPA-Überweisung und Echtzeitüberweisung von einem anderen Bankkonto aus,Sofort Geld hinzufügen per Debit- oder Kreditkarte undSofort Geld hinzufügen via Apple- oder Google Pay.Wie funktioniert die sofortige Einzahlung von Geld?Es erfolgt eine schnelle und sofortige Einzahlung auf ein Konto, die normalerweise in Echtzeit verarbeitet wird. Dies bedeutet, dass dir das eingezahlte Geld unmittelbar nach der Transaktion auf deinem Konto zur Verfügung steht. Dadurch hast du die Möglichkeit, schnell und bequem auf Geld zugreifen zu können.SEPA-Überweisung von einem anderen Bankkonto ausNach Eröffnung deines Kontist Geschäftskonto steht dir unmittelbar deine IBAN und BIC zur Verfügung. Diese kannst du einfach in der Mobile App kopieren und im Online Banking deines anderen Bankkontos einfügen. So kannst du direkt eine Überweisung tätigen. Kontist erhebt keine zusätzlichen Gebühren, wenn du auf diesem Wege Geld auf dein Konto lädst.Preise ansehen<img alt="Image" sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F96dfa531-195e-4887-87ee-995d4408b7d6_sepa.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain;object-position:center" loading="lazy"/>Geld hinzufügen über die Kontist App per Debit- oder KreditkarteUm Geld in Echtzeit auf dein Kontist Geschäftskonto einzuzahlen, kannst du ganz bequem eine Debit- oder Kreditkarte nutzen. Dieser schnelle und effiziente Prozess ermöglicht es dir, finanzielle Transaktionen nahtlos und ohne Verzögerung durchzuführen. So kannst du auch sicherstellen, dass die Einzahlung direkt auf dein Kontist Geschäftskonto erfolgt, wodurch du sofortigen Zugriff auf Geld erhältst. So geht's:1. Öffne die Mobile App.2. Tippe oben rechts auf „+“.3. Wähle „Debit- oder Kreditkarte".4. Füge zwischen 50 € und 2.000 € hinzu.5. Gib deine Karteninformationen ein. Das war's.Preise ansehen<img alt="Image" sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4izK5bqstJ99hAS_HomeHeroMockupDE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain;object-position:center" loading="lazy"/>Geld hinzufügen über die Kontist App via Apple- oder Google PayNutze die bequeme und schnelle Option, um Geld auf dein Kontist Geschäftskonto einzuzahlen – einfach über Apple- oder Google Pay! Diese innovative Zahlungsmethode ermöglicht es dir, Beträge in Echtzeit zu überweisen, ohne lange Wartezeiten. Mit nur wenigen Klicks kannst du sicherstellen, dass dein Guthaben immer aktuell ist und du jederzeit auf deine Finanzen zugreifen kannst. So entdeckst du die Leichtigkeit der schnellen Einzahlung:1. Öffne die Mobile App.2. Tippe oben rechts auf „+“.3. Wähle „Google Pay" oder „Apple Pay".4. Füge zwischen 50 € und 2.000 €. Fertig!5. Gib deine Karteninformationen ein. Das war's.<img alt="Image" sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44Y2JbqstJ99oFB_Phone_mockup_money.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain;object-position:center" loading="lazy"/>Genieße maximale Flexibilität: Sobald du ein Kontist Geschäftskonto eröffnest, kannst du sofort via Apple- oder Google Pay Geld auf dein Konto einzahlen und direkt damit Zahlungen tätigen.Geschäftskonto eröffnenDein Geld wird sicher eingezahlt!Dein Kontist Konto wird durch einer Vielzahl von Sicherheitsmaßnahmen geschützt. Hier erfährst du mehr zur Sicherheit bei Kontist.Noch kein Geschäftskonto? Du hast die Wahl:Kontist Free0 €*/ Monat zzgl. UStKontist Free0 €*/ Monat zzgl. UStGeschäftskonto mit virtueller Visa Karte. *Bei monatlichen Transaktion über 300€. Hast du weniger als 300€ Transaktionsvolumina (eingehende und ausgehende Transaktionen gesamt) bezahlst du 2€ / Monat.Apple Pay & Google PayDispokreditKontist Free eröffnenKontist Premium9 €/ Monat zzgl. USt.Kontist Premium9 €/ Monat zzgl. USt.Kombinierbar mit BuchhaltungstoolsAutomatische Steuerrücklagen für Einkommens – und UmsatzsteuerApple Pay, Google Pay & Beleg-ScanPhysische & virtuelle Visa Business Debit KarteKontist Premium eröffnenKontist Buchhaltung29 €/ Monat zzgl. USt.Kontist Buchhaltung29 €/ Monat zzgl. USt.Geschäftskonto + integrierte BuchhaltungPremium Konto inklusiveBuchhaltung mit Hilfe von künstlicher Intelligenz (KI)Physische & virtuelle Visa Business Debit KarteKontist Buchhaltung eröffnenKontist Free0 €*/ Monat zzgl. UStGeschäftskonto mit virtueller Visa Karte. *Bei monatlichen Transaktion über 300€. Hast du weniger als 300€ Transaktionsvolumina (eingehende und ausgehende Transaktionen gesamt) bezahlst du 2€ / Monat.Apple Pay & Google PayDispokreditKontist Free eröffnenKontist Premium9 €/ Monat zzgl. USt.Kombinierbar mit BuchhaltungstoolsAutomatische Steuerrücklagen für Einkommens – und UmsatzsteuerApple Pay, Google Pay & Beleg-ScanPhysische & virtuelle Visa Business Debit KarteKontist Premium eröffnenKontist Buchhaltung29 €/ Monat zzgl. USt.Geschäftskonto + integrierte BuchhaltungPremium Konto inklusiveBuchhaltung mit Hilfe von künstlicher Intelligenz (KI)Physische & virtuelle Visa Business Debit KarteKontist Buchhaltung eröffnenHäufig gestellte FragenWas heißt „Kontist erhebt keine zusätzlichen Gebühren"?Wenn du eine SEPA-Überweisung von einem anderen Bankkonto auf dein Kontist Geschäftskonto tätigst, fallen für dich keine Gebühren für die Einzahlung von Geld an. Jedoch erhebt Kontist darüber hinaus Transaktionsgebühren in Höhe von 0,15 €, falls du Kontist Free oder Premium nutzt und mehr als 10 Transaktionen pro Monat auf deinem Konto verzeichnest. Bei Kontist Buchhaltung entfallen die Transaktionsgebühren gänzlich. Mehr Infos zu den verschiedenen Geschäftskonten und Gebühren findest du hier.Werden Geldeinzahlungen in Echtzeit bearbeitet?Die Verfügbarkeit von Geld auf deinem Konto hängt von der gewählten Einzahlungsmethode ab. Bei einigen Methoden erfolgt die Verfügbarkeit sofort, während es bei anderen bis zu 5 Werktagen dauern kann. Bei Kontist werden alle Geldeinzahlungen in Echtzeit bearbeitet.Wie viel kostet eine Geldeinzahlung?Eine Geldeinzahlung mittels SEPA-Überweisung ist kostenlos. Beachte jedoch, dass bei der anderen Bank Gebühren anfallen können. Eine Geldeinzahlung in der App ist bei der ersten Nutzung kostenlos, ab der zweiten Nutzung fällt eine Gebühr von 2,9 % des aufzuladenden Geldbetrags an. Die Gebühr wird direkt von deinem Kontist Konto eingezogen. Die Geldeinzahlung in der App ist jedoch für uns teurer, da das Geld sofort auf deinem Konto zur Verfügung gestellt wird. Andere Methoden, um dein Konto aufzuladen, sind kostengünstiger.Kann ich eine Geldeinzahlung in der Mobile und Web App durchführen?Für eine SEPA-Überweisung von einen anderen Bankkonto auf dein Kontist Geschäftskonto spielt es für uns keine Rolle, auf welchem Wege du die Überweisung durchführst. Nutzt du allerdings die Geldeinzahlung-Funktion, so kannst du dies aktuell nur über die Mobile App durchführen.Welche Karten werden für die Einzahlung akzeptiert?Visa und Mastercard-Karten, die eine 16-stellige Kartennummer haben.Wo finde ich weiterführende Informationen?In den Allgemeinen Geschäftsbedingungen (AGB) der Solaris AG findest du weitere Informationen zur Sofort-Einzahlung auf deinem Konto.'''
