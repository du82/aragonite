KurzbeschreibungKontist ist ein 2016 gegründetes FinTech-Unternehmen aus Berlin, das sich darauf spezialisiert hat, Solo-Selbstständigen und Freiberuflern das Leben bei den Themen Banking, Buchhaltung & Steuern zu erleichtern.Der Seriengründer Christopher Plantener war selbst jahrelang als Freelancer unterwegs und konnte keine Bank dazu motivieren, spezielle Angebote für Selbstständige auf den Markt zu bringen. Deswegen entschied er sich kurzerhand, in Zusammenarbeit mit der Solaris selbst eine Lösung anzubieten.Mit Erfolg: Das Konzept einer App, über die sich Banking, Buchhaltung und Steuern unkompliziert regeln lassen, lockte internationale Investoren an. Die letzte Finanzierungsrunde im März 2021 brachte 25 Millionen Euro ein. Von Ende 2020 bis Mitte 2022 teilte sich Christopher Plantener die Kontist-Führung mit Benjamin Esser.Seit Mitte 2022 ist Kontist Teil von Ageras. Mit anderen Unternehmen wie Tellow, Billy, Salary und Zervant verbunden. Gemeinsam strebt Ageras danach, die Art und Weise zu verändern, wie kleine Unternehmen und Freiberufler*innen in der schnelllebigen Geschäftswelt erfolgreich sind.Fakten zu SelbständigenWir haben untersucht, welchen bürokratischen Belastungen Selbständige und Gründer gegenüberstehen und welche Kosten dadurch indirekt verursacht werden.Hier geht es zu den Umfrageergebnissen.Pressematerial<img alt="logo" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F70af0f06-b81d-4189-ba64-3d4b4a9ce74f_BrandImages.svg%3Fauto%3Dcompress%2Cformat&amp;w=96&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F70af0f06-b81d-4189-ba64-3d4b4a9ce74f_BrandImages.svg%3Fauto%3Dcompress%2Cformat&amp;w=256&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F70af0f06-b81d-4189-ba64-3d4b4a9ce74f_BrandImages.svg%3Fauto%3Dcompress%2Cformat&amp;w=256&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box