width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung23. Feb. 2023💡 Das musst du wissen:Scheinselbstständigkeit ist sehr gefährlich und kann sowohl den Auftraggeber als auch den Auftragnehmer in den finanziellen Ruin stürzen. Es passiert nicht selten, dass sich Existenzgründer Beratung von außen holen, wenn sie in bestimmten Kompetenzbereichen Hilfe brauchen. In solchen Situationen sollten sich sowohl Auftraggeber als auch Auftragnehmer versichern, dass sie die Zusammenarbeit so gestalten, dass kein Kriterium der Scheinselbstständigkeit erfüllt ist.Thema im Detail:1 - Definition: Was bedeutet Scheinselbstständigkeit?2 - VIDEO - Scheinselbstständigkeit: die große Gefahr3 - Was deutet auf eine Scheinselbstständigkeit hin?3.1 - Beispiele4 - Arbeits- und Steuerrechtliche Konsequenzen4.1 - Folgen für den Auftraggeber4.2 - Folgen für den Auftragnehmer5 - Scheinselbstständigkeit vermeiden – Wie?Definition: was bedeutet Scheinselbstständigkeit?Ein sehr häufiges Thema bei Selbstständigen und Kleinunternehmern ist die Scheinselbstständigkeit. Der Grund dafür ist, dass es in Deutschland keine festen Kriterien für Scheinselbstständigkeit gibt. Auftraggeber und auch Auftragnehmer sollten stets prüfen, ob sie dem Risiko der Scheinselbstständigkeit ausgesetzt sind. Die finanziellen Konsequenzen bei einer Scheinselbstständigkeit sind gravierend. Es kann im schlimmsten Fall dazu kommen, dass der Arbeitgeber verpflichtet wird, die Sozialversicherungsbeiträge der letzten Jahre nachzuzahlen (dies kann rückwirkend für bis zu 30 Jahre sein).Um Scheinselbstständigkeit besser zu erklären, werden wir zuerst den Unterschied zwischen Selbstständigen und Arbeitnehmern aufzeigen.Selbstständige können wählen, ob sie Aufträge annehmen wollen oder nicht. Einen Auftrag, den Selbstständige annehmen, muss nicht auch von ihnen selber ausgeführt werden. Dies können auch Angestellte für sie erledigen. Sie verfügen meistens über alles Nötige (Fahrzeuge, Maschinen usw.) um einen Auftrag eigenständig erledigen zu machen.Arbeitnehmer auf der anderen Seite haben nicht die gleiche Freiheit wie Selbstständige. Arbeitnehmer gehören zum Betrieb des Arbeitgebers und erledigen die vom Arbeitgeber erteilten Tätigkeiten in einer bestimmten Zeit, Dauer und an einem bestimmten Ort. Durch das Verbot des Arbeitgebers oder aufgrund der langen Arbeitszeiten ist es für Arbeitnehmer meistens nicht möglich, noch für einen anderen Arbeitgeber tätig zu sein.Was passiert aber, wenn du einen Vertrag als Selbstständiger hast, aber der Auftraggeber dich wie einen Arbeitnehmer behandelt? Hier ist immer entscheidend, was auch wirklich während der Tätigkeit durchgeführt wird. Wenn die Tätigkeit auf eine Arbeitnehmer-typische Weise erfolgt und ganz nach dem Wunsch des Arbeitgebers, müssen auch Personen, die Selbstständig sind, als Arbeitnehmer angesehen werden.In diesem Fall handelt es sich um die sogenannte „Scheinselbstständigkeit“, da es nur so scheint, dass eine selbstständige Tätigkeit behauptet wird, wenn in der Realität die Personen jedoch als Arbeitnehmer beschäftigt werden.VIDEO - Scheinselbstständigkeit: die große GefahrWas deutet auf eine Scheinselbstständigkeit hin?Für Selbstständige, die kein abhängiges Arbeitsverhältnis haben, gibt es nicht die Abführungspflicht von Renten- und Arbeitslosenversicherungen. Weiterhin müssen sie keine Beiträge an die Sozialversicherung leisten. Da der deutsche Staat auf keine Steuereinnahmen verzichten möchte, wird Scheinselbstständigkeit nicht toleriert, wenn eine abhängige Beschäftigung verdächtigt wird. Um die Art der Beschäftigung zu ermitteln, muss meistens ein komplexer Entscheidungsprozess durchgeführt werden. Falls du dir nicht über die Art der Beschäftigung sicher bist, kann dir die Clearingstelle der Deutschen Rentenversicherung dabei helfen. Wenn die Rentenversicherung einen Verdacht auf Scheinselbstständigkeit hat, musst du ihn ernst nehmen, weil bei Falschangaben große Nachzahlungen drohen. Wenn also eine Person wie ein selbstständiger Unternehmer auftritt (zum Beispiel mit Werkvertrag), aber seine Aufgaben wie ein beschäftigter Arbeitnehmer erledigt, liegt eine Scheinselbstständigkeit vor. Indizien dafür sind:Feste ArbeitszeitenUnmittelbare Weisungsbefugnis des AuftraggebersFeste BezügeAnspruch auf UrlaubFeste Integration in Prozesse und sonstige Infrastruktur des AuftraggebersBeispiele für ScheinselbstständigkeitEine Designagentur beschäftigt auf freiberuflicher Basis eine ehemalige Angestellte nach einer Elternzeit. Durch die Zeit kehrt der Alltag zurück und der Arbeitsumfang wird einem Vollzeitjob gleich. Nun hat sie keine Zeit für andere Kunden mehr, da sie ständig in der Agentur ist, spontan Aufträge erledigt und ihre Grafikprogramme und Rechner benutzt. Konsequenz: In diesem Fall besteht ein großes Risiko, dass ein Verdacht auf Scheinselbstständigkeit aufkommt. Die Scheinselbstständige wäre verpflichtet, die Lohnsteuer und SV-Beiträge für die letzten 3 Monate zu zahlen und der Arbeitgeber eventuell auch für weiter zurückliegende Zeiten.Ein LKW-Fahrer ist lange arbeitslos und bekommt dann ein Angebot, als selbstständiger Fahrer zu arbeiten. Sein Auftraggeber gibt ihm einen Transporter zur Verfügung und ausreichende Aufträge. Die Spedition entscheidet selbst, wann die Aufträge erledigt werden müssen und integriert den Fahrer fest in ihre Transportplanung. Konsequenz: Da also der Auftraggeber in diesem Fall den Transporter zur Verfügung stellt und die Aufgaben nach ihrem Plan erfolgen, liegt hier eine Scheinselbstständigkeit vor.Arbeits- und Steuerrechtliche KonsequenzenEine Überprüfung, ob es sich um eine Scheinselbstständigkeit handelt oder nicht, kann von dir selber beantragt werden, aber auch vom Finanzamt oder der Rentenversicherung, wenn bei ihnen ein Verdacht besteht. Falls du also einen Verdacht hast, dass du durch die Arbeitsbedingungen des Auftraggebers als Scheinselbstständiger eingestuft werden könntest, kannst du die Rentenversicherung um eine freiwillige Prüfung bitten. Wenn die Rentenversicherung oder das Finanzamt einen Verdacht äußert, kann dies für dich eine Betriebsprüfung bedeuten. Wird eine Scheinselbstständigkeit festgestellt, zieht das folgende arbeits- und steuerrechtliche Folgen nach sich:Bei der Feststellung einer Scheinselbstständigkeit können ehemalige Selbstständige ihren Arbeitnehmerstatus einklagen. Wenn der Scheinselbstständiger beim Arbeitsgericht erfolgreich ist, wird er auf einmal ein regulärer Angestellter, mit allen Pflichten und Rechten (inklusive Sozialversicherungspflicht).Arbeitnehmer und Arbeitgeber haften zusammen für Nachzahlungen als Gesamtschuldner. Alle SV- und Lohnsteuerbeiträge müssen nachgezahlt werden.Der Auftraggeber muss die Sozialversicherungsbeiträge für den ganzen nachgewiesenen Zeitraum nachzahlen. Der Auftragnehmer haftet für die nicht gezahlte Beiträge von den maximal 3 vergangene Monaten.Wenn eine Scheinselbstständigkeit festgelegt wird, kann die Zusammenarbeit nicht mehr weitergeführt werden. In diesem Fall müssen beide - Auftraggeber und Auftragnehmer - mit finanziellen und rechtlichen Konsequenzen rechnen, was manche Unternehmen auch in die Insolvenz treiben kann.Folgen für den AuftraggeberNach der Beurteilung wird der Auftraggeber zum Arbeitgeber und muss allen entsprechenden Zahlungs- und Haftungsverpflichtungen nachkommen:Der Auftraggeber muss alle Arbeitnehmer- und Arbeitgeber-Sozialversicherungsbeiträge für maximal der letzten 4 Jahren nachzahlen.Das Finanzamt kann die Nachzahlung der Lohnsteuer für die letzten vier Jahre anfordern.Falls Vorsatz nachgewiesen wird, kann es zu Bußgeldern und Gefängnisstrafen kommen. Im schlimmsten Fall müssen Rückzahlungen für die letzten 30 Jahre geleistet werden, was für die meisten Unternehmen das finanzieller Aus darstellt.Für den Fall, dass es sich bei dem Mitarbeiter um keinen Unternehmer handelt, werden die Umsatzsteuer-Ausweisungen auf seiner Rechnung unwirksam. Das heißt, dass der Auftraggeber zu keinem Vorsteuerabzug berechtigt war und muss die abgezogene Vorsteuerbeträge für alle Kalenderjahre zurückzahlen.Nach der Feststellung der Scheinselbstständigkeit muss der Auftraggeber den Auftragnehmer alle Rechte zugestehen, wie sie auch alle anderen Mitarbeiter in seinem Unternehmen haben.Folgen für den AuftragnehmerAuf der anderen Seite, wird der Scheinselbstständige nachträglich den Status als Arbeitnehmer erhalten, was das Ende seiner Selbständigkeit bedeutet. Dies sind die Folgen für die Auftragnehmer bei Scheinselbstständigkeit:Der Scheinselbstständige wird alle Rechte erhalten, die auch alle anderen Mitarbeiter des Unternehmens haben. Dazu gehören zum Beispiel Urlaubsanspruch, Kündigungsschutz usw. Weiterhin ist er berechtigt, Nettogehaltszahlungen in Höhe des vorherigen Honorars zu erhalten.Da beide - der Auftraggeber und Auftragnehmer - gemeinsam schuldig angesehen werden, kann der Arbeitgeber die Nachzahlung der Sozialversicherungsbeiträge für die letzten 3 Monate vom zukünftigen Gehalt des Arbeitnehmers abziehen. Die Beitragshöhe hängt vom Honorar ab, welches jetzt durch das Nettogehalt ersetzt wird.Als Scheinselbstständiger bist du auch die in deinen Rechnungen ausgewiesene Umsatzsteuer schuldig. Es ist aber möglich, eine Berichtigung nachträglich zu machen, falls die Steuerausweisung als ungültig erklärt wird.Im Falle einer Scheinselbstständigkeit wird deine unternehmerische Tätigkeit beendet und du musst diese beim zuständigen Finanzamt bzw. Gewerbeamt abmelden.Ab diesem Moment ist auch die Mitgliedschaft in der Industrie- und Handelskammer beendet.Scheinselbstständigkeit vermeiden – Wie?Um Scheinselbstständigkeit zu vermeiden, solltest du den Arbeitsvertrag sowie den Arbeitsalltag so gestalten, dass so wenige unten genannten Kriterien wie möglich erfüllt sind:Alle Anweisungen des Auftraggebers müssen befolgt werdenDie Arbeit wird nicht auf den eigenen Namen oder der eigenen Rechnung gemachtBestimmte Arbeitszeiten, die in dem Unternehmen gelten, müssen befolgt werdenEs werden die gleichen Aufgaben gemacht, welche auch Festangestellte des Unternehmens machenEs müssen detaillierte und regelmäßige Berichte über die Leistungen an den Auftraggeber abgegeben werdenDer Arbeitsplatz ist in den Räumen des Auftraggebers oder in einem anderen Ort, den der Auftraggeber bestimmt und nicht z.B. dein Homeoffice (siehe unseren Artikel Arbeiten von Zuhause aus - Der Traum vom Home Office)Vom Auftraggeber zur Verfügung gestellte Hardware und Software müssen benutzt werden, die ihn auch ermöglichen, alles zu überwachen und zu kontrollierenEs wird nicht mehr als Selbstständiger in der Geschäftswelt gearbeitet. Das heißt, es wird keine Werbung mehr gemacht, keine Briefpapiere und Visitenkarten gedruckt, sowie auch keine neuen Kunden akquiriert usw.Das Wichtigste ist, dass du als Selbstständiger deine unternehmerische Entscheidungsfreiheit hast und das unternehmerische Risiko selber trägst.ThemenübersichtSteuerwissen > Steuerbasis für den Start in die SelbstständigkeitSteuernummer beantragenUnternehmensform wählenGewerbe anmeldenFragebogen zur steuerlichen ErfassungKleinunternehmerregelungEinnahmen-Überschuss-Rechnung (EÜR)Liebhaberei (bald erhältlich)Ist- und SollversteuerungScheinselbstständigkeit (hier bist du gerade)Stundensatz berechnenRechnungen schreibenNebengewerbe anmeldenSteuererklärungen Basics für Selbstständige'
