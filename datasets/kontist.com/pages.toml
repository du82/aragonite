full_description = '''Was sind die Nutzen eines Geschäftskontos für Selbstständige?Banking Basics für Selbstständige<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung21. März 2019blog.last_updated_placeholder 13. Aug. 2023💡 Das Wichtigste in Kürze Für Selbstständige ist es wichtig, ein Geschäftskonto neben dem privaten Girokonto zu eröffnen. Ein Geschäftskonto hilft dir dabei, deine wirtschaftliche Lage besser einschätzen zu können. Es lohnt sich, geschäftliche Rücklagen zu bilden. Sie helfen einem dabei, z. B. Werbung zu schalten, Akquise zu betreiben, oder Angestellte zu bezahlen.Ein Geschäftskonto hilft dir dabei, deine beruflichen Ausgaben und Einnahmen so zu trennen, dass du am Jahresende im Prinzip nur zwei Listen hast, die du mit Hilfe deiner Kontoauszüge und entsprechenden Belegen versteuerst. Private und geschäftliche Ausgaben über ein einziges Konto sorgen schnell für Verwirrung und Intransparenz.Insgesamt lässt einen die getrennte Kontoführung nicht nur besser finanziell planen und die Buchhaltung einfacher gestalten, sie hilft einem vor allem dabei, die eigene Selbstständigkeit leichter zu strukturieren.Ein klassisches Geschäftskonto ist meistens mit Kosten verbunden. Online-Banken bieten oft kostenlose Geschäftskonten an.Inhaltsverzeichnis1 - Selbstständig sein ohne Geschäftskonto ist wie Handwerken ohne HammerVideo: 5 Gründe warum du ein spearates Geschäftskonto brauchstGrund 1: Überblick über deine wirtschaftliche LageGrund 2: Finanzielle PlanungGrund 3: Vereinfachte BuchhaltungGrund 4: Erhöhte Transparenz in privaten AusgabenGrund 5: Mehr Struktur in deiner Selbstständigkeit2 - Klarer Kopf und mehr Zeit fürs WesentlicheFür jeden berufstätigen Menschen kommt die Frage im Laufe der Zeit zwangsläufig irgendwann auf: Brauche ich ein separates Konto neben meinem privaten Konto? Ist man selbstständig, ist man mit dieser Frage umso dringender konfrontiert. Denn wer nicht immer nur ein und dieselbe monatliche Gehaltsabrechnung erhält, hat sicher schon mal komplett die Übersicht verloren. Das passiert besonders dann, wenn es am Geschäfts-Jahresende darum geht, Steuererklärungen und Belege an das Finanzamt zu schicken, obwohl alle Geldtransfers auf einem Konto gelandet sind. Das ist nur einer von vielen Gründen, die für die separate Kontoführung sprechen.Selbstständig sein ohne Geschäftskonto ist wie Handwerken ohne HammerWir geben dir fünf gute Gründe, wieso es besonders für Selbstständige wichtig ist, ein Geschäftskonto neben dem privaten Girokonto zu eröffnen. Video: 5 Gründe warum du ein separates Geschäftskonto brauchstGrund 1: Überblick über deine wirtschaftliche LageEin Geschäftskonto hilft dir dabei, deine wirtschaftliche Lage besser einschätzen zu können. Gerade in der Selbstständigkeit hat man oft viele unterschiedliche Kunden, denen man unterschiedliche Leistungen in Rechnung stellt. TippWenn du hier den Überblick nicht verlieren willst, ist es einfacher, alle beruflichen Rechnungen über ein separates Konto laufen zu lassen, zumal das Finanzamt fortlaufende Rechnungsnummern fordert.Ein Überblick über Rechnungen und Kunden zeigt dir auch, welche Rechnungen schon eingegangen sind und wie deine Gesamtbilanz aussieht sowie wann es notwendig ist, weitere Akquise zu betreiben oder es Zeit ist, Rücklagen zu bilden.Außerdem hat man gerade, wenn man nach ein paar Monaten wieder auf seine Konto-Auszüge guckt schon mal vergessen, ob das Mittagessen, dass man mit der Girokonto-Karte im Lieblingsrestaurant gezahlt hat, ein Geschäftliches oder ein Privates war.Wenn dir das häufiger passiert, ist das auf jeden Fall ein Indikator dafür, dass eine getrennte Kontoführung für dich sinnvoll ist.Denn dann triffst du die Entscheidung zwischen privat und geschäftlich schon in dem Moment, in dem du die Bezahlung tätigst und musst nicht dein Gedächtnis anstrengen.Grund 2: Finanzielle PlanungAuf welcher Grundlage kannst du bewusst und mit gutem Gewissen entweder Sparziele, geschäftliche Rücklagen oder größere geschäftliche Ausgaben planen?Das kann man eigentlich nur dann, wenn man eine genaue Übersicht darüber hat, wie viel monatlich auf dem Geschäftskonto und auf dem privaten Konto übrigbleibt.TippWenn beruflich mal eine Flaute ansteht und man eine Dürrephase überwinden muss oder bewusst für eine Zeit nicht arbeitet, lohnt es sich, geschäftliche Rücklagen gebildet zu haben. Sie helfen einem dabei, z. B. Werbung zu schalten, Akquise zu betreiben, oder Angestellte zu bezahlen.Auch im Privaten kann man sich bei besserer Kontoführung nicht nur bequemer zurücklehnen, sondern auch deutlichere Sparziele für außergewöhnliche Ausgaben setzen. So kannst du dir z. B. deinen lang ersehnten Traum finanzieren und dir endlich eine Hühnerfarm auf den Malediven kaufen. Auch langfristige Sparziele kann man mit dieser Kontohaltung besser im Auge behalten, in dem man z.B. ein extra Depot zum privaten Girokonto hinzufügt. Geschäftlich zu sparen kann einem außerdem gegebenenfalls Steuervorteile einbringen. Grund 3: Vereinfachte BuchhaltungGeht es dir so wie den meisten, dann willst du vermutlich am liebsten den Kopf in den Sand stecken, wenn es mal wieder so weit ist, die Steuer zu machen. Also lieber vorsorglich handeln. Ein Geschäftskonto hilft dir dabei, deine beruflichen Ausgaben und Einnahmen so zu trennen, dass du am Jahresende im Prinzip nur zwei Listen hast, die du mit Hilfe deiner Kontoauszüge und entsprechenden Belegen versteuerst. AchtungWenn du nur ein Privatkonto für die Buchhaltung nutzt, musst du außerdem jede private Buchung als solche kennzeichnen. Das ist ein riesen Mehraufwand. Anders sind berufliche Einnahmen und Ausgaben von vornherein klar kategorisiert und dann auch für das Finanzamt besser nachvollziehbar. Das spart dir eine Menge Überlegungen und bringt Ruhe in den Ablauf deiner Steuer. Ein smartes Bankkonto und innovative Buchhaltung in einer App?Das kann Kontist! Mit unserem Geschäftskonto hast du ab sofort einen besseren Überblick über deinen Finanzen. Zudem lässt sich auch deine Buchhaltung mit Hilfe von KI (Künstliche Intelligenz) in Handumdrehen erledigen!Jetzt entdeckenGrund 4: Erhöhte Transparenz in privaten AusgabenWenn man mal ehrlich ist, macht man sich selbst nicht so wirklich viele Gedanken darüber, wie viel man im Monat eigentlich so privat ausgibt. Mal ein schneller Blick auf die Kontoübersicht, um sich zu vergewissern, dass irgendwie doch noch genug da ist, um den Kurzurlaub zu buchen, und das war's. Wenn sich hier aber private und geschäftliche Ausgaben vermischen, vergisst man häufig, dass am Monatsende vielleicht doch noch die eine oder andere berufliche Rechnung aussteht und schon sitzt man fest und kann den Urlaub doch nicht mehr so genießen. Selbst wenn man einen guten Überblick über wichtige Termine für Selbstständige hat, ist es nicht einfach, diese auch bei jedem mal Geldabheben im Auge zu haben. Außerdem ist es auch interessant nachzuvollziehen, was es eigentlich ist, für das man monatlich am meisten im Privaten ausgibt. So kann man nach einer gewissen Zeit ein gutes Mittelmaß an privaten monatlichen Ausgaben ermitteln und sich diesen Betrag, bei getrennten Konten, jeden Monat auf das private Girokonto überweisen. Grund 5: Mehr Struktur in deiner SelbstständigkeitInsgesamt lässt einen die getrennte Kontoführung nicht nur besser finanziell planen und die Buchhaltung einfacher gestalten, sie hilft einem vor allem dabei, die eigene Selbstständigkeit leichter zu strukturieren.Eine klare Organisation ist dann auch die Basis dafür, dass du dich besser auf das Wesentliche bei deiner Arbeit konzentrieren kannst, und so auch für dich selbst besser und produktiver vorankommst.Wenn das System Struktur von einem einfordert, ist das zwar erstmal etwas einzwängendes, aber es kann gleichzeitig auch einen strukturierenden Rahmen kreieren, den man positiv für sich nutzen kann.<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenKlarer Kopf und mehr Zeit fürs WesentlicheDie bessere Organisation deiner Selbstständigkeit durch getrennte Kontoführung gibt dir letztlich mehr Zeit, auch mal eine kreative Pause einzulegen, und dich inspirieren zu lassen, ohne dass es dich danach wieder unter Zeitdruck bringt. So hast du auch mehr Muße, Entspannung und Zeit für dein Privatleben übrig. Wenn du dich auf die Suche nach der richtigen Lösung für dein geschäftliches Bankkonto machst, solltest du dir vorher die Preise und den Service, den dir Banken dafür bieten genauer angucken. Ein klassisches Geschäftskonto ist nämlich meistens mit Kosten verbunden. InfoWie Vergleiche von angebotenen Geschäftskonten zeigen, muss man meistens mit Kosten für die Zurverfügungstellung von Bankkarten und einer monatlichen Gebühr von bis zu 50 € rechnen.Gleichzeitig erhält man den gleichen Service wie Privatkunden und wird als Selbstständiger oder Freiberufler eigentlich indirekt diskriminiert, wie auch eine Öko-Test-Umfrage von 2014 gezeigt hat.AchtungMan kann sich natürlich auch dafür entscheiden, ein privates Girokonto fürs Geschäftliche zu nutzen. Allerdings verbieten immer mehr Banken-AGBs explizit die Nutzung des privaten Kontos für berufliche Zwecke.Eine zweite Option ist, ein Girokonto bei einer Online- oder Direktbank zu eröffnen. Die sind meistens gratis und können leicht eröffnet werden. Dort hast du allerdings nicht den Beratungsservice einer herkömmlichen Filialbank und kannst auch nicht so einfach Kredite beantragen.Mit dem Aufkommen der Online und Direktbanken haben viele herkömmliche Banken sich zwar der Digitalisierung geöffnet. Aber richtig innovativ gehen sie mit selbständigen Kunden immer noch nicht um.Geht es um Geschäftskonten für Selbstständige und kleinere Unternehmen, ist alles, was einem bisher angeboten wird, die einfache Kontoführung, die im Zweifel auch noch mit Extrakosten verbunden ist.Abgesehen davon wird man als Selbstständiger auch häufig von vornherein als nicht verlässliche Einnahmequelle eingestuft.Das erschwert einem nicht nur die Kontoeröffnung, sondern zeigt auch nicht von besonders großer Wertschätzung.ThemenübersichtBanking > Banking Basics für SelbstständigeDas Girokonto - Alles was du über Girokonten wissen solltestWas sind die Nutzen eines Geschäftskontos für Selbstständige? (hier bist du gerade)Digitale Kontoeröffnung - wie eröffne ich online ein Konto?'''
