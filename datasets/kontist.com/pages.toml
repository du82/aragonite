full_description = 'Was kann man alles von der Steuer absetzen?Steuern sparen in der Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung11. Nov. 2022blog.last_updated_placeholder 27. Jan. 2023💡Das Wichtigste in Kürze:Als selbständiger in Deutschland kannst du zahlreiche Ausgaben steuerlich absetzen. Dazu zählen zum Beispiel Betriebskosten, Fahrzeugkosten, Arbeitsmittel und Versicherungen. Durch diese Absetzungen reduzierst du deine Steuerlast und optimierst deinen Gewinn. Informiere dich gründlich. Es lohnt sich meistens, um alle Vorteile optimal nutzen zu können.Thema im Detail:1 - Betriebsausgaben (bzw. Werbungskosten)1.1 - Beispiele für Betriebsausgaben1.2 -Beispiele für Werbungskosten2 - Sonderausgaben2.1 - Beispiele für Sonderausgaben3 - Außergewöhnliche Belastungen3.1 - Beispiele für außergewöhnliche Belastungen4 - Was kann man pauschal absetzen?4.1 - Kinderfreibeträge4.2 - Entlastungsbetrag für Alleinerziehende4.3 - Altersentlastungsbetrag5 - Sonstige Kosten, die du von der Steuer absetzen kannst5.1 - Verluste5.2 - Ausländische Steuern5.3 - Handwerker & haushaltsnahe Dienstleistungen6 - Was muss ich als Selbstständiger das Jahr über beachten bzw. erledigen?7 - Gut zu wissenAls Steuerfachangestellter bekomme ich aus meinem Familien- und Freundeskreis natürlich ständig die Frage, was man alles von der Steuer absetzen könne. Am liebsten hätte ich schon lange eine Liste erstellt, die ich dann nur noch aushändigen müsste.Ganz so einfach ist das Ganze aber leider nicht. Die Berechnung unserer Einkommensteuer ist relativ komplex und es gibt viele Schritte in der Berechnung. Auf jeder Stufe können unterschiedliche Ausgaben angesetzt werden, um Steuern zu sparenDeshalb möchte ich die Berechnung einmal Schritt für Schritt durchgehen und wir klären auf jeder Stufe, welche Ausgaben du berücksichtigen darfst.Eine abschließende Aufzählung ist leider unmöglich, da es zu viele Eventualitäten und Sonderregelungen für verschiedene Menschengruppen gibt. Wenn ich hier auf jede Sonderregelung eingehen würde, wird dieser Artikel länger als das Einkommensteuergesetz.“Wer die Pflicht hat, Steuern zu zahlen, der hat auch das Recht, Steuern zu sparen.”Helmut Schmidt, ehem. BundeskanzlerBetriebsausgaben (bzw. Werbungskosten)Als erstes müssen wir für unsere Steuererklärung unseren Gewinn ermitteln. Das machen wir als Selbstständige zum Beispiel mit der Einnahmenüberschussrechnung, in der wir alle Einnahmen zusammenrechnen und von ihnen die Betriebsausgaben abziehen.Wenn du Steuern sparen möchtest, ist der erste Schritt also, den eigenen Gewinn “klein zu rechnen” - z.B. indem du möglichst viele Betriebsausgaben berücksichtigst. Getreu nach dem Motto: Am meisten Steuern sparst du, wenn du nichts hast und nichts verdienst.Grundsätzlich kannst du alle Kosten berücksichtigen, die im Zusammenhang mit deinen Einnahmen stehen. Dazu gehören neben Wareneinkäufen, den Gehältern für deine Mitarbeiter und Fremdleistungen auch Reisekosten, Fortbildungskosten, Büromiete usw.Übrigens können auch Angestellte alle Kosten berücksichtigen, die im Zusammenhang mit ihren Einnahmen (also ihrem Gehalt) entstehen. Da Arbeitnehmer kein Unternehmen besitzen, heißen die Ausgaben auch nicht Betriebsausgaben. Bei Ihnen sind es die Werbungskosten (nicht zu verwechseln mit Werbekosten).Beispiele für BetriebsausgabenArbeitsmittel, Bürobedarf, Telefon- und Internetkosten, BürobedarfBetriebs- und GeschäftsausstattungLöhne, Gehälter, FremdleistungenBeiträge zu Berufsverbänden und Vereinen, die mit deiner selbständigen Tätigkeit im Zusammenhang stehenSeminare, FachliteraturFahrtkosten für Geschäftsreisen, Kfz-Kosten für den FirmenwagenWerbungbetriebliche Versicherungen (Bsp: Berufshaftpflichtversicherung)➡️ Mehr dazu, findest du in unserem Guide: Betriebsausgaben absetzen.Beispiele für WerbungskostenArbeitsmittel, die überwiegend beruflich genutzt werden (Laptop, Büroeinrichtung etc.)Fahrtkosten zum ArbeitgeberFortbildungskosten (selbst bezahlte Seminare, Fachliteratur)Beiträge an den BerufsverbandBewerbungskostenKontoführungsgebühren für das Gehaltskontoeingeschränkt: Arbeitszimmer zu Hauseeingeschränkt: BerufsausbildungAchtung!Immer wieder werden die Begriffe Einnahmen und Einkünfte miteinander verwechselt. Das Steuerrecht unterscheidet die Begriffe aber ganz klar voneinander. Die Einnahmen sind das Geld, das auf dem Konto eingeht (also das Gehalt oder der Umsatz). Einkünfte sind die Einnahmen abzüglich der Betriebsausgaben bzw. Werbungskosten.SonderausgabenWenn alle Einkunftsarten addiert werden, erhält man den Gesamtbetrag der Einkünfte. Zu diesem Gesamtbetrag zählen also alle steuerpflichtigen Einkünfte wie zum Beispiel deine Selbständigkeit, dein Angestelltenverhältnis, deine Mieteinkünfte oder auch die Zinseinkünfte.Von diesem Betrag kannst du die sogenannten Sonderausgaben und außergewöhnlichen Belastungen abziehen.Sonderausgaben sind private Ausgaben, die steuerlich begünstigt sind, um sie für uns attraktiver zu machen. Der Staat möchte also, dass wir Geld für diese Zwecke ausgeben. Der größte Posten besteht dabei aus Vorsorgeaufwendungen.Beispiele für SonderausgabenBeiträge für die Altersvorsorge (private und gesetzliche Rentenversicherungen)Beiträge zur Kranken- und PflegeversicherungBeiträge für andere ausgewählte Versicherungen (Bsp: Haftpflichtversicherung, Unfallversicherung)SpendenUnterhaltszahlungen an die Exfrau oder den Exmanngezahlte KirchensteuerKosten für die Erstausbildung➡️ Hier findest du vertiefende Informationen: Sonderausgaben von der Steuer absetzenAußergewöhnliche BelastungenOb du es glaubst oder nicht: Der deutsche Gesetzgeber ist tatsächlich an Gerechtigkeit interessiert und möchte, dass alle Steuerpflichtigen gleichmäßig belastet werden. Das heißt nicht, dass jeder gleich viel Geld zahlen soll, sondern, dass jeder ein gleich großes Opfer erbringen soll. Oder negativer formuliert: Jeder soll im gleichen Maße leiden.Es gibt aber immer wieder Situationen im Leben, die überraschend auftreten und die eine unvorhergesehene hohe finanzielle Belastung nach sich ziehen.Um trotz dieser unvorhergesehenen Kosten für Gerechtigkeit zu sorgen, können sogenannte außergewöhnliche Belastungen steuerlich berücksichtigt werden.Abhängig von deinem Einkommen und deiner Familiensituation wird dir ein bestimmter Betrag zugemutet, den du nicht in der Steuererklärung berücksichtigen darfst. Alle Beträge, die diesen Betrag übersteigen, gelten als außergewöhnlich und dürfen vom Gesamtbetrag der Einkünfte abgezogen werden. Eine genaue Berechnung und Erläuterung der zumutbaren Belastung findest du auf der Seite der Vereinigten Lohnsteuerhilfe.Gerade bei den außergewöhnlichen Belastungen ist es unmöglich, eine abschließende Liste aller absetzbaren Kosten zu erstellen. Grundsätzlich können alle Kosten, die “außer der Reihe” anfallen, als außergewöhnliche Belastung in Frage kommen. So kann zum Beispiel sogar gezahltes Lösegeld unter bestimmten Voraussetzungen in der Steuererklärung geltend gemacht werden.Beispiele für außergewöhnliche BelastungenKrankheitskosten wie zum Beispiel Arztkosten und Medikamente (wenn diese nicht von der Krankenversicherung übernommen werden)BeerdigungskostenPflegekosten für die eigenen Eltern, wenn die Leistungen von keiner Versicherung übernommen werden (inkl. Pflegeheimkosten)Unterhaltskosteneingeschränkt: Kosten für die Berufsausbildung des eigenen Kindes➡️ Hier findest du vertiefende Informationen: Außergewöhnliche Belastungen absetzenWas kann man pauschal absetzen?Die Betriebsausgaben bzw. Werbungskosten, die Sonderausgaben und außergewöhnlichen Belastungen sind die Ausgaben, die wohl den größten Schwankungen unterliegen.Neben diesen tatsächlichen Ausgaben gibt es noch einige Pauschalen und Freibeträge, die du in deiner Steuererklärung berücksichtigen kannst, unabhängig davon welche Kosten dir tatsächlich entstanden sind und wie hoch sie waren.KinderfreibeträgeWenn du Kinder hast, kannst du einen Kinderfreibetrag in deiner Einkommensteuererklärung berücksichtigen. Dieser Freibetrag sorgt dafür, dass ein bestimmter Geldbetrag nicht versteuert werden muss. Dieser Freibetrag wird allerdings mit dem gezahlten Kindergeld verrechnet. Das Finanzamt schaut also, welche Alternative für dich günstiger ist und berücksichtigt entweder den Kinderfreibetrag oder das steuerfreie Kindergeld.Durch den progressiven Einkommensteuertarif ist der Kinderfreibetrag erst ab einem bestimmten Einkommen (etwa 35.000-45.000 Euro Jahreseinkommen pro Ehepartner) günstiger als das Kindergeld. Solltest du weniger verdienen, wird der Kinderfreibetrag nicht berücksichtigt. Du erhältst aber das Kindergeld und musst es nicht versteuern.Entlastungsbetrag für AlleinerziehendeWenn du dein Kind allein erziehst, hast du seit einigen Jahren die Möglichkeit neben dem Kinderfreibetrag einen Entlastungsbetrag für Alleinerziehende in der Steuererklärung geltend zu machen.Die Voraussetzungen für diesen Entlastungsbetrag sind:Anspruch auf Kindergeld oder KinderfreibetragDas Kind gehört zu deinem HaushaltDu musst alleinstehend sein. Wenn du einen neuen Lebenspartner hast, giltst du nicht mehr als alleinstehend.Dein Kind benötigt eine Steueridentifikationsnummer, die du in der Anlage “Kind” einträgst.AltersentlastungsbetragRenten und Pensionen werden nur zum Teil versteuert. Wenn du allerdings noch Arbeitslohn beziehst und älter als 64 Jahre bist, musst du dein komplettes Einkommen versteuern.Da es ungerecht wäre, alte Menschen zu bestrafen, wenn sie noch arbeiten möchten, gibt es den Altersentlastungsbetrag, der allen Steuerpflichtigen gewährt wird, wenn sie älter als 64 Jahre alt sind.Der genaue Betrag ändert sich von Jahr zu Jahr (weil sich auch der Besteuerungsanteil der Renten jedes Jahr ändert).➡️ Hier findest du vertiefende Informationen: Pauschalen und Steuerfreibeträge für SelbstständigeSonstige Kosten, die du von der Steuer absetzen kannstDa das Einkommensteuergesetz sehr umfangreich ist, gibt es viele Ausgaben, die du steuerlich berücksichtigen kannst. In diesem Artikel versuche ich lediglich die wichtigsten Positionen vorzustellen.Grundsätzlich solltest du dich bei der Steuererklärung jederzeit hinterfragen, ob deine Arbeit überhaupt noch ökonomisch sinnvoll ist. Es macht in den wenigsten Fällen Sinn eine Stunde länger an der Steuererklärung zu sitzen, um noch weitere 10 Euro Steuern zu sparen.Folgende drei Positionen können aber unter Umständen ebenfalls einen großen Effekt auf deine Steuerlast haben:VerlusteVerluste können für dich als Selbständiger wirklich hervorragend sein. Es gibt wenige Dinge, die deine Steuerlast mehr mindern können als richtig schöne Verluste. Ganze Unternehmen werden gekauft, weil sie so hohe Verluste angehäuft haben.Die Verlustverrechnung zwischen unterschiedlichen Einkunftsarten, ist recht leicht erklärt: Wenn du zum Beispiel als Angestellter 40.000 Euro/Jahr verdienst und in deiner nebenberuflichen Selbständigkeit 10.000 Euro Verlust gemacht hast, musst du nur 30.000 Euro versteuern. Da dir im Anstellungsverhältnis die Steuer aber gleich vom Gehalt abgezogen wurde, bekommst du eine Steuererstattung.Zusätzlich kannst du, wenn du in einem Jahr insgesamt Verluste gemacht hast, diese Verluste vor- und zurücktragen. Wenn du im Jahr 2018 einen Verlust von 20.000 Euro gemacht hast, kannst du einen Teil davon für das Jahr 2017 berücksichtigen oder den Verlust mit den Gewinnen im Jahr 2019 verrechnen.Verluste sind also nicht pauschal schlecht und können auch durchaus gezielt verursacht werden (z.B. durch Investitionen). Wenn du mehr darüber erfahren möchtest, solltest du unseren Artikel lesen, in dem ich beschreibe, was du kurz vor Jahresende noch aktiv tun kannst um Steuern zu sparen.Ausländische SteuernAuch wenn es nur einen kleinen Teil von euch betreffen wird: Das Einkommen, das du bereits im Ausland versteuert hast, musst du meistens nicht mehr in Deutschland versteuern. Oder du kannst wenigstens die gezahlte Steuer in deiner (deutschen) Steuererklärung anrechnen lassen.Was du konkret machen kannst, steht in den sogenannten Doppelbesteuerungsabkommen (DBA), die zwischen den beiden betroffenen Ländern vereinbart wurden. Da dieses Thema alles andere als einfach ist, empfehle ich dir dringend einen Steuerberater, wenn du im Ausland Geld verdienst.Handwerker & haushaltsnahe DienstleistungenSolltest du deine Wohnung oder dein Haus von einem Handwerker renovieren lassen, kannst du 20 Prozent des Arbeitslohns von der Steuer absetzen. Dafür sollte der Lohnanteil in der Rechnung explizit aufgeführt sein.Das Besondere daran:Du kannst den Betrag nicht irgendwo ansetzen sondern direkt von der Steuer abziehen (maximal 1.200 Euro). Eine 5.000 Euro Handwerkerrechnung bedeutet also 1.000 Euro weniger Steuern (20% von 5.000 Euro).TippDer Steuerabzug ist nur möglich, wenn du eine Rechnung bekommen hast und das Geld überweist. Barzahlungen werden vom Finanzamt nicht anerkannt.Gleiches gilt für haushaltsnahe Dienstleistungen (Bsp: Reinigung der Wohnung, Kinderbetreuung, Gartenarbeiten), die ebenfalls mit 20 Prozent direkt von der Steuerschuld abgezogen werden k'
