full_description = 'The Kontist appFinance management at your fingertipsThe Kontist App combines a business bank account with smart features that make life easier for independent entrepreneurs. Manage your finances on your phone, wherever you are.Try Kontist nowTry Kontist nowInstant & constant accessKontist is designed for your smartphone and saves you time and energy starting with the sign up. You can open an account quickly through the app using video-ID.After a few minutes you can already access all functions 24/7, 365 days a year. From now on, your bank is always there where you are – at home, on the go or in your favourite café.Open your Kontist bank account (German video)<img alt="Graphic" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F2e527da5-6bd3-47b1-8dc0-a81a5845c47e_always-there-illustration.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F2e527da5-6bd3-47b1-8dc0-a81a5845c47e_always-there-illustration.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%252F2e527da5-6bd3-47b1-8dc0-a81a5845c47e_always-there-illustration.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Your complete financial overviewThe Kontist app does not only contain everything you’d want from a banking app, it simplifies your finance management in unique ways.<img alt="Graphic" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F68fe6388-9383-4ef1-80bf-fd4869993f7e_Yours%2B%252B%2BPapers_EN.svg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 1x" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F68fe6388-9383-4ef1-80bf-fd4869993f7e_Yours%2B%252B%2BPapers_EN.svg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Banking BasicsCheck your balance and transfer cash comfortably from your smartphone.Ordering your cardManage your Kontist Visa Business Debit Card directly from the app.Categorising transactionsTag your incoming and outgoing transactions to easily prepare everything for accounting.Accounting BoosterLet your accounting synchronize with Kontist in real time and automate the bulk of your administration.Automated tax forecastsKontist calculates your expected tax payments with every transaction so you’ll always know your true net income.Tax managementCash for income and sales tax is set aside automatically in dedicated sub accounts, so you’ll avoid unpleasant surprises.Start banking with Kontist and keep track of your finances with ease.Open accountReal time bankingKontist offers 100% transparency over your transactions. Nothing happens to your money without your knowledge.Receive real time push notifications about everything that happens in your account.Always be informed, when your card is being used.Never forget a receipt again. The Kontist accounting booster reminds you at every payment to scan the bill.Open account now<img alt="Image" sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F73e7d061-da85-4c15-994b-c392d81f4541_95e2b4b4-fb68-43c4-91a3-67cf004c810c_app-notification.gif%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain;object-position:center" loading="lazy"/>Secure bankingThe Kontist app is not just quick and comfortable, it also protects your data and money optimally.Safe LoginThe app supports you in creating a secure password. Face ID and Touch ID are also fully supported.Safe cardsYou can report your card as stolen, block and unblock it on demand or change the PIN with just a few taps in the app.Safely informedAnytime something happens with your account or your Visa Card is used you’ll instantly get a push notification on your smartphone.Safe from prying eyesKontist’s preview screen is blurred when switching between apps, shielding your sensitive banking information from unwanted attention.Live SupportHelp is never far with the Kontist app. The integrated chat connects you straight to our customer support team who will aid you quickly in all matters.<img srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5dkJ5bqstJ993wu_Frame427322734.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=256&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5dkJ5bqstJ993wu_Frame427322734.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5dkJ5bqstJ993wu_Frame427322734.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="rounded-full" loading="lazy"/>Hi! Our team at Kontist is here to help you with any questions you might have.Philipp from Kontist'
