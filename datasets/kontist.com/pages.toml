full_description = 'Fahrtkosten absetzen & KilometerpauschaleSteuern sparen für Selbstständige<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung14. Nov. 2022blog.last_updated_placeholder 26. Jan. 2023💡 Das Wichtigste in Kürze:Um deine Fahrtkosten als Selbstständige oder Selbstständiger abzusetzen, kannst du entweder eine Pauschale nutzen oder die tatsächlichen Kosten ansetzen.Du hast die Möglichkeit, eine Kilometerpauschale für Dienstreisen zu nutzen. Für Fahrten zu deiner Arbeitsstätte kommt die Entfernungspauschale zur Anwendung.Wie du deine Fahrtkosten absetzen kannst, hängt unter anderem von deinem Transportmittel ab. So macht es einen Unterschied, ob du ein privates Fahrzeug, einen Firmenwagen oder öffentliche Verkehrsmittel nutztThema im Detail:1 - Welche Fahrtkosten können Selbstständige absetzen?2 - Eigener PKW vs. Firmenwagen3 - Pauschale oder Betriebsausgaben – wie kannst du Fahrtkosten absetzen?4 - Entfernungspauschale & Kilometerpauschale für Selbstständige4.1 - Was ist der Unterschied zwischen der Entfernungspauschale und der Kilometerpauschale?4.2 - Mit welchen Fahrzeugen ist die Entfernungspauschale anwendbar?4.3 - Wie berechnet sich die Entfernungspauschale?4.4 - Wann können Selbstständige die Kilometerpauschale nutzen?4.5 - Wie berechnet sich die Kilometerpauschale für Freiberufler?5 - Können Selbstständige die Fahrtkosten für Hin- und Rückfahrt absetzen?6 - Tatsächliche Fahrtkosten als Betriebsausgaben absetzenArbeitnehmerinnen und Arbeitnehmer können ihre Fahrtkosten in der Steuererklärung geltend machen. Aber wie sieht es eigentlich aus, wenn du selbstständig bist? Wir zeigen dir, wie du als Selbstständige oder Selbstständiger Fahrtkosten absetzen und so Steuern sparen kannst.Welche Fahrtkosten können Selbstständige absetzen?Wenn dir als Selbstständige*r, als Freiberufler*in oder als Kleinunternehmer*in betriebliche Fahrtkosten anfallen, dann kannst du diese immer steuerlich geltend machen. Sogar manche private Fahrtkosten kannst du absetzen.Die Fahrt zur Arbeitsstätte: Das kann dein eigenes Büro, aber auch ein Coworking Space sein. Fahrten zu Kundinnen und Kunden sowie andere DienstreisenDienstfahrten deiner Mitarbeiterinnen und MitarbeiterKrankheitsbedingte Fahrten: Sowohl aufgrund von eigener Krankheit als auch bei Krankheitsfällen von nahen Angehörigen können Fahrtkosten anfallen. Diese kannst du unabhängig von deiner beruflichen Tätigkeit von der Steuer absetzen. Du gibst diese Kosten als „außergewöhnliche Belastung“ an. Enge Familienmitglieder kannst du im Krankenhaus besuchen und die Fahrtkosten dafür absetzen. In diesem Fall muss ein Arzt oder eine Ärztin die medizinische Notwendigkeit für deinen Besuch bescheinigen.<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenEigener PKW vs. FirmenwagenOb und wie du deine Fahrtkosten als Selbstständiger oder Selbstständige absetzen kannst, hängt unter anderem von deinem Fahrzeug ab. Nutzt du gelegentlich ein privates Fahrzeug, kannst du nur eine Pauschale nutzen.Anders sieht es aus, wenn dein Fahrzeug zum Betriebsvermögen gehört oder du es sowohl privat als auch beruflich nutzt. Drei unterschiedliche Fälle sind denkbar:Bei einer betrieblichen Nutzung von weniger als 10 % gilt dein Fahrzeug als Privatvermögen. Bei einer gemischten Nutzung (zwischen 10 % und 50 % privater Nutzung) entscheidest du selbst, ob das Fahrzeug zum Privat- oder Betriebsvermögen zählen soll.Ab einer betrieblichen Nutzung von mehr als 50 % gehört dein Fahrzeug automatisch zum Betriebsvermögen. Alle anfallenden Kosten kannst du dann als Betriebsausgaben absetzen. Deine privaten Fahrten musst du hingegen versteuern. Dazu kannst du deine Fahrten mithilfe eines Fahrtenbuches dokumentieren. Einfacher ist es jedoch, die 1%-Regelung anzuwenden. Dabei wird der offizielle Bruttolistenpreis deines Fahrzeugs zugrunde gelegt. Jeden Monat wird dann 1 % davon als geldwerter Vorteil angerechnet.Info1% des Bruttolistenpreises wird monatlich als Umsatz versteuertZusätzlich dazu: 0,03% pro Kilometer zwischen Wohnung und TätigkeitsstätteDadurch wird Privatnutzung pauschal berechnetPro: ist meist bequemer.Contra: tatsächliche Kosten können höher sein.VIDEO: Firmenwagen oder Privatwagen? Wie du die betriebliche Nutzung eines Privat-Kfz behandelstPauschale oder Betriebsausgaben – wie kannst du Fahrtkosten absetzen?Es gibt zwei Möglichkeiten, wie du als Selbstständige oder Selbstständiger deine Fahrtkosten absetzen kannst:Du nutzt die Entfernungspauschale und die Kilometerpauschale für Selbstständige. Mit deren Hilfe kannst du deine Fahrtkosten schnell und unkompliziert absetzen. In manchen Fällen ist es sinnvoller oder gar notwendig, deine Fahrtkosten genau zu berechnen. Das ist zum Beispiel dann der Fall, wenn deine tatsächlichen Kosten die Pauschale übersteigen. Die Anwendung beider Möglichkeiten sehen wir uns im Folgenden im Detail an. So kannst du entscheiden, wie du deine Fahrtkosten als Freiberuflerin oder Freiberufler am besten von der Steuer absetzt.Entfernungspauschale & Kilometerpauschale für SelbstständigeBeginnen wir mit der bequemeren Möglichkeit: Anstatt jede Fahrt einzeln zu dokumentieren, kannst du deine Fahrtkosten als Selbstständiger oder Selbstständige einfach über eine Pauschale abrechnen.Was ist der Unterschied zwischen der Entfernungspauschale und der Kilometerpauschale?Die Entfernungspauschale wird inoffiziell auch als Pendlerpauschale bezeichnet. Sie bezieht sich ausschließlich auf die Entfernung zwischen deiner Wohnung und deiner Arbeitsstätte. Das ist für dich nur interessant, wenn du nicht von zuhause aus arbeitest, sondern zum Beispiel ein eigenes Büro hast. Auch wenn du regelmäßig bei einem festen Kunden oder einer Kundin arbeitest, kann dies als Arbeitsstätte gelten. Als Definition gilt, dass du dort mindestens ein Drittel deiner Arbeitszeit oder zwei volle Tage pro Woche arbeitest.Bei Dienstreisen hingegen kommt die Kilometerpauschale zum Einsatz. Diese wird auf Basis der tatsächlich gefahrenen Kilometer berechnet.Mit welchen Fahrzeugen ist die Entfernungspauschale anwendbar?Die Entfernungspauschale für Selbstständige gilt natürlich für Fahrten mit dem Auto. Du kannst sie sowohl bei Fahrten mit deinem privaten Fahrzeug als auch mit dem Firmenwagen ansetzen.Doch auch andere Transportmittel kannst du bei der Berechnung der Pauschale mit einbeziehen. Dazu gehören zum Beispiel Fahrten mit den öffentlichen Verkehrsmitteln, mit dem Motorroller, dem Motorrad, aber auch mit dem Fahrrad. Sogar, wenn du zu deinem Arbeitsplatz zu Fuß gehst, kannst du die Pauschale ansetzen.Wie berechnet sich die Entfernungspauschale?Für die Entfernungspauschale werden 30 Cent pro Kilometer angesetzt. Das gilt jedoch – wie der Name schon sagt – für die Entfernung von deiner Wohnung zum Arbeitsplatz. Die tatsächlich gefahrene oder gelaufene Strecke ist dabei nicht relevant.Bei der Berechnung der Entfernungspauschale legst du deine tatsächlichen Arbeitstage zugrunde. Warst du also krank oder hast zu Hause gearbeitet, kannst du für diese Tage keine Kosten ansetzen. Auch ist nur eine Fahrt pro Arbeitstag anrechenbar. Hast du an einem Tag mehrere Fahrten zwischen deinem Zuhause und deiner Arbeitsstätte gemacht, wird dies nicht berücksichtigt. Die Pauschale ist zudem gedeckelt: Du kannst nur bis zu 4.500 € pro Jahr absetzen. Zu guter Letzt gilt es zu beachten, dass du für deine Berechnung die kürzeste Straßenverbindung anwenden musst. Ausnahme: Du kannst nachweisen, dass du eine längere (oder kürzere) Strecke regelmäßig nutzt und dadurch eine Zeitersparnis entstanden ist.Gut zu wissenSeit dem 1. Januar 2021 beträgt die Entfernungspauschale für Selbstständige (und Arbeitnehmer*innen) ab dem 21. Kilometer 35 Cent pro Kilometer. Ab dem 1. Januar 2022 wurde sie noch einmal auf 38 Cent pro Kilometer erhöht. Diese Änderung ist Teil des Klimapakets der Bundesregierung. Gelten soll dies bis 2026.Diese Erhöhung bezieht sich nur auf die Entfernungspauschale, nicht auf die Kilometerpauschale!Wann können Selbstständige die Kilometerpauschale nutzen?Alle dienstlichen Fahrten mit deinem privaten Fahrzeug (also wenn das Fahrzeug im Privatvermögen ist) lassen sich über die Kilometerpauschale absetzen. Dazu gehören zum Beispiel Kundentermine oder Dienstreisen.Dienstfahrten mit einem Firmenfahrzeug (also wenn es im Betriebsvermögen ist) werden hingegen als Betriebsausgaben angesetzt. Diese kannst du also nicht über die Kilometerpauschale absetzen. Auch Fahrten mit den öffentlichen Verkehrsmitteln werden vom Finanzamt im Rahmen der Pauschale nicht anerkannt. Hierfür kannst du ebenfalls die tatsächlich angefallenen Kosten als Betriebsausgaben ansetzen.Wie berechnet sich die Kilometerpauschale für Freiberufler?Die Kilometerpauschale für Selbstständige beträgt 2022 und 2021 pro Kilometer 30 Cent. 20 Cent pro Kilometer kannst du mit anderen motorisierten Fahrzeugen wie Motorrädern oder Mofas absetzen, die mehr als 25 km/h fahren dürfen. Im Gegensatz zur Entfernungspauschale sind Strecken, die du etwa mit dem Fahrrad oder zu Fuß zurücklegst, nicht absetzbar. Unternimmst du eine Dienstreise, dann kannst du anhand deines Fahrtenbuchs einfach dokumentieren, wie viele Kilometer du zurückgelegt hast. Diese multiplizierst du dann mit den 30 beziehungsweise 20 Cent.Können Selbstständige die Fahrtkosten für Hin- und Rückfahrt absetzen?Berechnungsgrundlage für die Entfernungspauschale (also für den Weg zu deiner Arbeitsstätte) ist die einfache Fahrt. Liegt deine Arbeitsstätte also 10 km entfernt, dann kannst du auch nur 10 km pro Tag anrechnen – und nicht etwa 20 km für die Hin- und Rückfahrt. Bei einer Dienstfahrt zählt hingegen nicht die Entfernung, sondern die tatsächlich gefahrenen Kilometer.Tatsächliche Fahrtkosten als Betriebsausgaben absetzenDie Nutzung der Entfernungs- und Kilometerpauschale ist die bequemste Art, deine Fahrtkosten als Selbstständige oder Selbstständiger von der Steuer abzusetzen. Natürlich hast du aber auch die Möglichkeit, deine tatsächlichen Fahrtkosten abzusetzen.Das ist dann besonders einfach, wenn du mit den öffentlichen Verkehrsmitteln wie der Bahn, dem Bus oder dem Flugzeug Dienstfahrten unternimmst. Deine Ausgaben entsprechen dann den Ticketkosten. Anhand der Tickets lassen sich deine Ausgaben also direkt nachweisen. Dasselbe gilt für einen Leihwagen – hier kannst du ebenfalls einfach deine Quittung aufbewahren.Etwas komplizierter wird es, wenn du deine tatsächlichen betrieblichen Fahrtkosten mit einem PKW nachvollziehen möchtest. Einerseits musst du dafür natürlich Tankquittungen sammeln. Die Kosten für Benzin sind aber nicht die einzigen, die für ein Fahrzeug anfallen. Auch die Abschreibungen für dein Fahrzeug, Zinsen, Reparaturen und Versicherungen solltest du mit einbeziehen. All diese Kosten addierst du und teilst sie durch die Kilometer, die du in dem betreffenden Jahr gefahren bist. Unter Umständen kannst du so mehr als 30 Cent pro Kilometer absetzen. Für deinen privaten PKW gilt die Deckelung von 4.500 € nämlich nicht!ThemenübersichtSteuerwissen > Steuern sparen: Was können Selbstständige von der Steuer absetzen?Betriebsausgaben absetzenReisekosten absetzen & VerpflegungsmehraufwandFahrtkosten absetzen & Kilometerpauschale (hier bist du gerade)Arbeitszimmer absetzen & Homeoffice PauschaleAußergewöhnliche Belastungen absetzenSonderausgaben absetzenSteuerfreibeträge und Pauschalen'
