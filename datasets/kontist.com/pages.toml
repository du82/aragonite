full_description = 'Fragebogen zur steuerlichen Erfassung ausfüllen: So gehst du vorSteuergrundlagen für den Start in deine Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung24. Feb. 2023💡 Das musst du wissen:Der Fragebogen zur steuerlichen Erfassung ist ein wichtiges Formular. Du füllst es zum Start deiner Selbstständigkeit aus oder wenn du gründest.Unter anderem betrifft der Fragebogen zur steuerlichen Erfassung Kapitalgesellschaften, Personengesellschaften und Einzelunternehmen.Den Fragebogen findest du im ELSTER-Portal und kannst ihn bequem online ausfüllen und abschicken.Beim Ausfüllen passieren oft Fehler, vor allem bei der Schätzung künftiger Gewinne und der Umsatzsteuer.Gute Vorbereitung und unsere Ausfüllhilfe schützen dich vor Stolperfallen und sparen dir Zeit und Ärger.💡 So gehst du vor:Registriere dich bei ELSTER.Richte dir am besten ein Geschäftskonto ein, damit du den Überblick über private und berufliche Finanzen behältst.Lege vor dem Ausfüllen wichtige Unterlagen rund um deine Selbstständigkeit und deine Finanzen bereit (diese unterscheiden sich je nach Rechtsform). Fülle den Fragebogen mit unserer Ausfüllhilfe aus und sende ihn digital an dein Finanzamt – fertig!Inhaltsverzeichnis1 - Wer muss den Fragebogen zur steuerlichen Erfassung ausfüllen?2- So findest du den richtigen Fragebogen2.1 - Welchen Fragebogen muss ich auswählen?3 - Die 5 häufigsten Fehler, die du vermeiden solltest3.1 - Fehler Nr. 1: Gewinnprognose falsch ansetzen3.2 - Fehler Nr. 2: Kleinunternehmerregelung ausschließen3.3 - Fehler Nr. 3: Soll-Versteuerung auswählen3.4 - Fehler Nr. 4: Privatkonto angeben3.5 - Fehler Nr. 5: Fragebogen unvorbereitet ausfüllen4 - Fragebogen zur steuerlichen Erfassung: Ausfüllhilfe und Schritt-für-Schritt-Anleitung4.1 - Punkte 1 bis 3: Allgemeine Daten4.2 - Punkte 4 und 5: Steuerliche Beratung4.3 - Punkt 6: Bisherige persönliche Verhältnisse4.4 - Punkte 7 bis 11: Angaben zum Unternehmen4.5 - Punkt 12: Bisherige betriebliche Verhältnisse4.6 - Punkt 13: Einnahmen4.7 - Punkt 14: Gewinnermittlung4.8 - Punkt 15: Freistellungsbescheinigung4.9 - Punkt 16: Lohnsteuer4. 10 - Punkt 17 und 18: Umsatzsteuer4. 11 - Punkt 19: One-stop-Shop4. 12 - Punkt 20: Umsätze über das Internet4.13 - Punkt 21: UnterlagenWer muss den Fragebogen zur steuerlichen Erfassung ausfüllen?Bei bestimmten beruflichen Veränderungen begegnet er dir: der Fragebogen zur steuerlichen Erfassung. Er ist immer dann auszufüllen, wenn du dich selbstständig machen oder gründen möchtest. Konkret ist das Formular relevant, wenn duein Gewerbe angemeldet hast,dich als Freiberufler selbstständig machen willst oderein Start-up gründen möchtest.All diese Pläne müssen beim Finanzamt gemeldet werden. Der Fragebogen zur steuerlichen Erfassung dokumentiert, dass du deiner Anmeldepflicht beim Finanzamt nachgegangen bist. Der Fragebogen erfüllt noch eine andere wichtige Funktion: Damit beantragst du eine Steuernummer und Umsatzsteuer-Identifikationsnummer, sofern du noch keine besitzt. Eine Steuernummer oder USt-ID ist unter anderem die Voraussetzung dafür, dass du deine Leistungen abrechnen kannst – sie gehört auf jede Rechnung.Außerdem benötigt das Finanzamt den Fragebogen, um dein Einkommen korrekt zu besteuern. Welche Angaben in das Formular gehören und wie du es richtig ausfüllst, erfährst du in dieser Übersicht.So findest du den richtigen FragebogenWenn du ein Gewerbe beim Gewerbeamt anmeldest, informiert dich das Finanzamt per Brief über deine Pflicht zum Ausfüllen des Erfassungsbogens. Dafür hast du in der Regel bis zu vier Wochen Zeit. Unser Tipp: Warte nicht auf den Brief vom Finanzamt und fülle den Erfassungsbogen proaktiv im Anschluss der Gewerbeanmeldung aus. Dadurch sparst du enorm viel Zeit und bekommst wesentlich schneller deine Steuernummer bzw. USt-ID.Selbstständige ohne Gewerbe müssen auf jeden Fall selbst aktiv werden.In beiden Fällen findest du den Fragebogen zur steuerlichen Erfassung beim Online-Finanzamt ELSTER. Seit 2021 ist es möglich, das Formular dort online auszufüllen und digital einzureichen. TippDu bist noch nicht bei ELSTER registriert? Dann ist jetzt eine gute Gelegenheit. Denn das Finanzamt akzeptiert die meisten Formulare nur noch digital. Je nachdem, welche Registrierungsform du wählst, planst du am besten etwas mehr Zeit ein – die Verifizierung kann bis zu zwei Wochen dauern.Welchen Fragebogen muss ich auswählen?Nach dem Login findest du unter „Formulare und Leistungen“ den Punkt Fragebogen zur steuerlichen Erfassung. Darunter siehst du verschiedene Formulararten. Welcher Fragebogen für dich infrage kommt, hängt von der Rechtsform deiner künftigen Tätigkeit ab.Es gibt Fragebögen für EinzelunternehmenKapitalgesellschaften oder GenossenschaftenKörperschaften nach ausländischem RechtPersonengesellschaften oder PersonengemeinschaftenBeteiligungen an einer Personengesellschaft oder einer PersonengemeinschaftDie Inhalte der Formulare unterscheiden sich erheblich. In diesem Artikel gehen wir auf den Fragebogen zur steuerlichen Erfassung für Einzelunternehmen ein. Diesen Erfassungsbogen wählst du, wenn du freiberuflich oder gewerblich tätig bist.TippBei manchen Tätigkeiten ist die Entscheidung zwischen freiberuflich und gewerblich schwierig. Du sparst dir beim Ausfüllen des Formulars Zeit, wenn du dich im Vorfeld über die Art deiner Tätigkeit informierst.Die 5 häufigsten Fehler, die du vermeiden solltestMit den Angaben auf dem Fragebogen stellst du wichtige Weichen für deine Tätigkeit. Das Finanzamt ermittelt zum Beispiel anhand deiner Gewinnprognose die Höhe deiner Steuervorauszahlungen. Oft geht es dabei um beachtliche Beträge. Deshalb ist es wichtig, Stolperfallen zu vermeiden. Die folgende Übersicht bewahrt dich vor den 5 häufigsten Fehlern.Fehler Nr. 1: Gewinnprognose falsch ansetzenWenn du den Fragebogen zur steuerlichen Erfassung ausfüllst, ist eine der schwierigsten Aufgaben dabei die Angabe einer Gewinnprognose. Das Finanzamt erwartet von dir eine grobe Einschätzung, welche Gewinne du in den nächsten zwei Jahren erzielen wirst. Damit berechnet das Finanzamt die Vorauszahlungen für verschiedene Steuern wie Einkommen- und Gewerbesteuer. Das bedeutet:Kalkulierst du zu niedrig, fallen deine Vorauszahlungen zwar gering aus. Dafür wartet unter Umständen beim Jahresabschluss eine hohe Nachzahlung auf dich. Kalkulierst du großzügiger, zahlst du erst einmal höhere Steuern. Läuft dein Geschäft schleppender als erwartet, werden die Vorauszahlungen allerdings zur finanziellen Belastung. Ganz schön tricky, oder? Nimm dir Zeit für deine Prognose und versuche, so realistisch wie möglich zu kalkulieren. Hast du deine Gewinnprognose abgegeben, beobachte deine Gewinnentwicklung. TippVorauszahlungen lassen sich unterjährig nach oben oder unten anpassen, falls deine Berechnungen zu sehr von den tatsächlichen Gewinnen abweichen.Fehler Nr. 2: Kleinunternehmerregelung ausschließenNeben deinem Gewinn musst du deine Umsätze im Gründungs- und im Folgejahr schätzen. Je nach Höhe deiner Umsätze darfst du die Kleinunternehmerregelung wählen und stellst deine Rechnungen ohne Umsatzsteuer aus.Das hat Vor- und Nachteile, die wir in einem separaten Artikel unter die Steuerlupe nehmen. Ein wichtiger Vorteil, wenn du gerade gründest und mit niedrigen Umsätzen startest, ist die Vereinfachung beim Thema Umsatzsteuer.VorsichtEntscheidest du dich gegen die Kleinunternehmerregelung, erlegst du dir von Anfang an mehr steuerliche Pflichten auf. Außerdem bist du fünf Jahre lang an deine Entscheidung gebunden. Wäge deshalb genau ab, ob du die Kleinunternehmerregelung wirklich von vornherein ausschließen willst.Fehler Nr. 3: Soll-Versteuerung auswählenSchließt du die Kleinunternehmerregelung aus, stellst du deine Rechnungen mit Umsatzsteuer und führst diese an das Finanzamt ab. Zu welchem Zeitpunkt das passiert, entscheidest du bereits beim Ausfüllen des Fragebogens zur steuerlichen Erfassung. Du hast du die Wahl zwischen der Soll- und der Ist-Versteuerung: Bei der Soll-Versteuerung führst du die Umsatzsteuer ab, nachdem du deinen Kund*innen eine Rechnung gestellt hast. Bei der Ist-Versteuerung führst du die Umsatzsteuer erst ab, wenn deine Rechnung bezahlt wurde.Für viele Selbstständige ist die Ist-Versteuerung die bessere Wahl. Damit sparst du dir, in Vorleistung zu gehen und hast mehr Sicherheit für deine Liquidität.Fehler Nr. 4: Privatkonto angebenFür Steuervorauszahlungen und -erstattungen benötigt das Finanzamt eine Bankverbindung von dir. Es steht dir frei, dein Privat- oder ein Geschäftskonto anzugeben. Du machst dir jedoch das Leben leichter, wenn du statt deines privaten Girokontos ein Geschäftskonto für deine Selbstständigkeit nutzt. So behältst du den Überblick über private und berufliche Einnahmen und Ausgaben. Fehler Nr. 5: Fragebogen unvorbereitet ausfüllenDen steuerlichen Erfassungsbogen auszufüllen, kostet Zeit. Denn das Finanzamt will vieles sehr genau wissen. Unklare oder fehlende Angaben führen zu Rückfragen. Doch Unklarheiten sind vorprogrammiert, da der umfangreiche Fragebogen zur steuerlichen Erfassung an vielen Stellen Fragen aufwirft.Mit unserer Schritt-für-Schritt-Anleitung weißt du, was auf dich zukommt und kannst dich vorbereiten. Das spart Zeit beim Ausfüllen und im besten Fall vermeidest du Rückfragen vom Finanzamt.Fragebogen zur steuerlichen Erfassung: Ausfüllhilfe und Schritt-für-Schritt-AnleitungBevor du mit deiner neuen Tätigkeit durchstarten kannst, sind genau drei Schritte nötig:Schritt 1: Rufe den passenden Fragebogen in ELSTER auf.Schritt 2: Fülle das Formular online aus – unsere Ausfüllhilfe zeigt dir, worauf du achten solltest.Schritt 3: Prüfe alle Angaben und Anhänge und sende den Fragebogen an das Finanzamt – etwa vier bis sechs Wochen später erhältst du deine Steuernummer bzw. USt-ID und darfst offiziell loslegen.Bist du ready? Dann steigen wir jetzt in den ELSTER-Fragebogen ein. Übrigens: Der kleine runde Button oben links zeigt dir deinen Fortschritt an. Und die folgende Übersicht verrät dir, wie du die einzelnen Abschnitte richtig ausfüllst.TippWenn du rund um den Fragebogen zur steuerlichen Erfassung Hilfe benötigst oder Fragen hast, schau auf unserem YouTube-Kanal vorbei. Dort findest du hilfreiche Antworten und eine ausführliche Videoanleitung.Punkte 1 bis 3: Allgemeine DatenZum Aufwärmen stellt dir das Finanzamt eine einfache Aufgabe: Trage deine persönlichen Daten ein. Am schnellsten geht es, wenn du die Daten aus deinem ELSTER-Profil übernimmst. Im nächsten Schritt trägst du deine Steuernummer ein. Hast du schon einmal eine Steuererklärung abgegeben, verwendest du die Steuernummer aus deinem Bescheid. Benötigst du noch eine Steuernummer, kannst du sie mit dem Formular beantragen. Du brauchst die Steuernummer unter anderem für deine Rechnungen oder für Korrespondenz mit dem Finanzamt. Dein zuständiges Finanzamt findest du mit einer Google-Suche heraus.AchtungDie Steuernummer ist leicht zu verwechseln mit der Steuer-Identifikationsnummer, die jeder Mensch entweder bei der Geburt oder nach dem Zuzug nach Deutschland bekommt.Weitere Informationen, die das Finanzamt in diesem Abschnitt abfragt:Religion: Wichtig für die Berechnung der KirchensteuerFamilienstand und Angaben zu Ehegatt*innen oder eingetragenen Lebenspartner*innen: Wichtig etwa bei gemeinsam Veranlagten Ausgeübter Beruf: Dein aktueller Beruf Adresse: Damit ist dein beruflicher Hauptwirkungsort gemeint, bei Selbstständigen entspricht die Firmenadresse häufig der WohnadresseTelefon, E-Mail und Internet: Diese Angaben sind freiwillig, die Informationen können die Kommunikation mit dem Finanzamt vereinfachen Bankverbindung: Hier gibst du deine Kontoverbindung an – ein Geschäftskonto ist gesetzlich kein Muss, erleichtert dir aber die Übersicht über deine ZahlungsströmePunkte 4 und 5: Steuerliche BeratungWenn du dich steuerlich beraten lässt, gibst du in diesem Abschnitt den Namen, die Adresse und die Kontaktdaten deiner Steuerberaterin oder deines Steuerberaters an – oder die Daten der Kontist Steuerberatung.Entscheidest du dich außerdem für eine Empfangsbevollmächtigung, läuft die Kommunikation mit dem Finanzamt direkt über deine Steuerberatung. Willst du dich selbst um deine Steuern kümmern? Dann lässt du Punkt 4 und 5 leer.Punkt 6: Bisherige persönliche VerhältnisseBist du in den letzten zwölf Monaten innerhalb Deutschlands umgezogen oder war in den vergangenen drei Jahren ein anderes Finanzamt für deine Einkommensteuer zuständig, trägst du die entsprechenden Informationen unter Punkt 6 ein.Punkte 7 bis 11: Angaben zum UnternehmenIn den folgenden Abschnitten dreht sich alles um deine Zukunftspläne. Zunächst beschreibst du in wenigen Worten und möglichst eindeutig, was du beruflich machst. Fasse dich kurz, es stehen dir nur knapp 200 Zeichen zur Verfügung. Beispiele:„selbstst. Texter und Berater für Social Media“ für Selbstständige„Handel mit Musikinstrumenten“ für GewerbetreibendeOb du freiberuflich oder gewerbetreibend bist, ist für das Finanzamt im Hinblick auf steuerliche Pflichten wichtig. Außerdem will das Amt deinen Firmennamen und den Beginn dei'
