full_description = 'Steuerwissen für SelbstständigeWissenswertes über Steuern für deine sorglose Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung24. Feb. 2023Um die Grundlagen des deutschen Steuerrechts zu verstehen, musst du kein Steuerprofi sein. Mit diesem Wissen erleichterst du dir deine Buchhaltung und vermeidest unschöne Nachzahlungen (für die Tricks und Feinheiten solltest du jedoch Experten ranlassen). Hier haben wir Wissenswertes gesammelt, um dich dabei zu unterstützen. Unsere Artikelsammlungen:1️⃣ Steuerbasis für den Start in deine Selbstständigkeit2️⃣ Was können Selbstständige von der Steuer absetzen?3️⃣ Alles Wissenswerte zur Umsatzsteuer1️⃣ Steuerbasis für den Start in deine SelbstständigkeitBei der Gründung eines Unternehmens gibt es einige steuerliche Aspekte, die du berücksichtigen musst. In der folgenden Artikelsammlung klären wir auf:Steuernummer beantragen: Ein erster Schritt bei der Gründung eines Unternehmens ist die Beantragung einer Steuernummer. Diese benötigst du, um steuerliche Angelegenheiten abzuwickeln und Rechnungen auszustellen. Den Antrag kannst du beim zuständigen Finanzamt stellen.Unternehmensform wählen: Mögliche Rechtsformen sind zum Beispiel Freiberufler, Gewerbetreibender, GmbH oder AG. Jede Rechtsform hat ihre eigenen Vor- und Nachteile. Es ist daher wichtig, dich gut zu informieren und die für dein Unternehmen passende Rechtsform zu wählen.Gewerbe anmelden: Bevor du als gewerbetreibende*r Selbstständige*r starten kannst, musst du dein Gewerbe beim zuständigen Gewerbeamt anmelden. Dabei machst du verschiedene Angaben, wie zum Beispiel die Art des Gewerbes und die Anschrift des Betriebs. Steuerlich gesehen ist es wichtig, dass du dich beim Finanzamt als Gewerbetreibende*r anmeldest. Außerdem solltest du dir über die damit verbundenen steuerlichen Pflichten im Klaren sein. Wie die Abgabe einer Gewerbesteuererklärung und Vorauszahlungen der Gewerbesteuer (in den meisten Fällen). Fragebogen zur steuerlichen Erfassung: Es ist ein wichtiger Schritt bei der Gründung eines Unternehmens, insbesondere wenn das Unternehmen als Gewerbebetrieb oder Freiberufler eingestuft wird. Der Fragebogen dient dazu, Informationen über das Unternehmen zu sammeln und die steuerliche Registrierung beim zuständigen Finanzamt vorzunehmen. Kleinunternehmerregelung: Die Kleinunternehmerregelung ermöglicht, von der Umsatzsteuer befreit zu sein, wenn du mit deinen jährlichen Umsätzen unter einer gewissen Grenze bleibst. Hier solltest du jedoch überprüfen, ob du die Regelung nutzen kannst und v.a. ob sich dies langfristig lohnt. Denn als Kleinunternehmer*in kannst du keine Vorsteuer ziehen, hast aber wesentlich weniger Aufwand.Ist- und Sollversteuerung: Diese Besteuerungsarten beziehen sich auf die Berechnung der zu zahlenden Umsatzsteuer. Hier hast du die Wahlmöglichkeit zwischen der Ist- und Sollversteuerung. Die Sollversteuerung (nach vereinbarten Entgelten) ist der Normalfall. Die Umsatzsteuer muss direkt nach der Rechnungsstellung abgeführt werden. Also zahlst du dem Finanzamt Geld, das sich noch gar nicht auf deinem Konto eingegangen ist. Die Istversteuerung (nach vereinnahmten Entgelten) ist für Selbstständige die bessere Variante. Hier führst du die Umsatzsteuer erst dann ab, wenn das Geld vom Kunden auf deinem Konto eingegangen ist.Scheinselbstständigkeit: Hast du z.B. nur einen einzigen großen Auftraggeber, giltst du meist als scheinselbstständig. Dies kann steuerliche Konsequenzen haben und sollte daher vermieden werden.Stundensatz berechnen: Der Stundensatz ist ein wichtiger Faktor für die Preisgestaltung bei deiner Selbstständigkeit. Es gibt verschiedene Methoden, um den Stundensatz zu berechnen. Worauf du dabei v.a. achten solltest sind: arbeitsfreie Tage durch Urlaub oder Krankheit, Kosten für Arbeitsmaterialien etc., Sozialversicherungsbeiträge und der Gewinnaufschlag. Es ist wichtig, hier realistisch und angemessen zu rechnen, um profitabel arbeiten zu können. Gleichzeitig kann ein zu hoher Stundensatz dazu führen, dass du in höhere Steuerklassen rutschst und somit mehr Steuern zahlst.Rechnungen schreiben: Eine Rechnung enthält Informationen über erbrachte Leistungen und die damit verbundenen Kosten. Wichtig ist, diese korrekt und vollständig auszustellen, um rechtliche Probleme zu vermeiden. Steuerlich gesehen ist es wichtig, dass die Rechnungen alle erforderlichen Angaben enthalten. Nur so kannst du ggf. die Ausgaben als Betriebsausgaben absetzen.Nebenberufliche Selbstständigkeit: Das ist eine Form der Selbstständigkeit, bei der du neben dem Beruf eine eigene Tätigkeit aufnimmst. Zum Beispiel, um die eigene Kreativität auszuleben oder um sich ein zweites Standbein aufzubauen. Steuerlich gesehen musst du hier einiges berücksichtigen, wie z.B. die Einkommensgrenzen für die Gewinnermittlung und die Möglichkeit, Betriebsausgaben geltend zu machen.➡️ Mehr dazu, findest du in unserer Artikelsammlung zum Thema: Steuergrundlagen für den Start in deine Selbstständigkeit2️⃣ Was können Selbstständige von der Steuer absetzen?Als Selbstständige*r kannst du eine Vielzahl von Ausgaben von der Steuer absetzen. Alles, was du dazu wissen musst, findest du hier: Betriebsausgaben: Diese umfassen alle Ausgaben, die notwendig sind, um dein Unternehmen zu betreiben. Dazu gehören z.B. Büromaterial, Werbekosten, Miete, Strom, etc.Außergewöhnliche Belastungen: Hierunter fallen Ausgaben, die aufgrund deiner beruflichen Tätigkeit entstehen und über das normale Maß hinausgehen. Beispiele hierfür sind Krankheitskosten.Firmenwagen und Fahrtkosten: Wenn du einen Firmenwagen besitzt und nutzt, kannst du die Kosten (z.B. Leasing, Versicherung, etc.) von der Steuer absetzen. Auch Fahrtkosten zwischen Wohnung und Arbeitsplatz können als Betriebsausgaben geltend gemacht werden.Verpflegungsmehraufwand / Reisekosten: Bist du beruflich viel unterwegs, kannst du die Kosten für Verpflegung und Übernachtung absetzen.Homeoffice Pauschale und Arbeitszimmer: Arbeitest du viel von zu Hause aus, hast du mehrere Möglichkeiten, entstandene Kosten geltend zu machen. Das hängt von deiner Tätigkeit oder den Räumlichkeiten ab. Am einfachsten ist die Nutzung der neuen Homeoffice-Pauschale.Steuerfreibeträge und Pauschalen: Hierzu gehören z.B. der Gewerbesteuerfreibetrag, die Entfernungspauschale oder der steuerfreie Grundbetrag. Du kannst aber auch die Betriebsausgabenpauschale nutzen. Meist sind die tatsächlichen Ausgaben jedoch höher, sodass du diese besser einzeln in der Steuererklärung angibst. Denn für die meisten Berufsgruppen ist diese Pauschale auf 1.200€ gedeckelt.Sonderausgaben: Zu den Sonderausgaben zählen u.a. Spenden, Beiträge zur Krankenversicherung oder Altersvorsorge sowie die Kirchensteuer. ➡️ Mehr dazu, findest du in unserer Artikelsammlung zum Thema: Steuern sparen: Was können Selbstständige von der Steuer absetzen?3️⃣ Alles Wissenswerte zur UmsatzsteuerHier erfahren Sie die Grundlagen der Umsatzsteuer, wie sie Selbstständige betrifft, und erhalten wertvolle Tipps, um Ihren steuerlichen Pflichten effektiv nachzukommen:Umsatzsteuer: Die Umsatzsteuer ist eine Abgabe, die auf den Verkauf von Produkten und Dienstleistungen in der Europäischen Union erhoben wird. Umsatzsteuer-ID beantragen: Selbstständige müssen, wie anderen Unternehmen, beim Finanzamt eine Umsatzsteuer-Identifikationsnummer beantragen, um Umsatzsteuer abführen zu können. Umsatzsteuervoranmeldung: Selbstständige müssen regelmäßig eine Umsatzsteuervoranmeldung abgeben, in der sie die Umsatzsteuer an das Finanzamt melden (meistens monatlich oder vierteljährlich). Vorsteuer berechnen: Es bedeutet, den Betrag der Steuer zu berechnen, der auf einen Einkauf bei einem Unternehmer anfällt. Dieser Betrag kann dann vom Unternehmer beim Finanzamt als Vorsteuer geltend gemacht werden. Beim Vorsteuer berechnen ist es wichtig, dass die entsprechenden Steuersätze beachtet werden, um den richtigen Betrag zu ermitteln.Umsatzsteuererklärung: Es ist ein Dokument, das vom Steuerzahler an das Finanzamt übermittelt wird, um Umsatzsteuer zu berechnen und zu zahlen. Es enthält Angaben zu den Umsätzen, die vom Steuerpflichtigen erzielt wurden, sowie zu den Umsatzsteuervorauszahlungen, die vom Steuerpflichtigen geleistet wurden.Zusammenfassende Meldung: Die zusammenfassende Meldung ist ein Steuererklärungsformular, mit dem Unternehmen die Umsatzsteuer, die sie an andere Unternehmen im Inland gezahlt haben, an das Finanzamt melden können.Reverse-Charge-Verfahren: Bestimmung des Mehrwertsteuergesetzes, die es Unternehmen ermöglicht, die Umsatzsteuer beim Käufer statt beim Verkäufer abzuführen. Dieses Verfahren ist in bestimmten Branchen, wie beispielsweise der Bauwirtschaft, üblich, in denen die normalen Verfahren nicht angewendet werden können. Der Abnehmer trägt die Umsatzsteuer nicht nur an den Finanzbehörden ab, sondern erfasst auch die Umsatzerlöse und die Umsatzsteuer in seiner Buchhaltung. Auf diese Weise wird sichergestellt, dass die Umsatzsteuer richtig erfasst wird.➡️ Mehr dazu, findest du auf der Übersicht: Alles Wissenswerte zum Thema Umsatzsteuer'
