0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="rounded-none" loading="lazy"/>Always there for you<img alt="icon" srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2FZ5tOgpbqstJ9-CEO_Bank.svg%3Fauto%3Dcompress%2Cformat&amp;w=128&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2FZ5tOgpbqstJ9-CEO_Bank.svg%3Fauto%3Dcompress%2Cformat&amp;w=256&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2FZ5tOgpbqstJ9-CEO_Bank.svg%3Fauto%3Dcompress%2Cformat&amp;w=256&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="rounded-none" loading="lazy"/>Secure LimitsProtecting your privacyKontist is committed to protecting your personal information and ensuring that you are in control of your data.There have been big changes in data in 2018, with PSD2 and GDPR, two major EU regulations relevant to banks, coming into force more or less at the same time. PSD2 mandates access for third parties to bank account information and GDPR creates a framework for protecting personal data based on individual consent. Although it sounds like the two are in conflict - one mandating access and the other mandating privacy - we see this as an opportunity. It’s an opportunity for you as a customer to have full access to your banking data, and the choice to share it with third parties for a richer, more personal banking experience- while also retaining control over what personal data gets shared. The two laws complement each other, and we believe that clear privacy regulations are what make trust in open banking possible. Full list of changes resulting from the GDPRSee our terms and conditionsSolaris' data processing policy'''
