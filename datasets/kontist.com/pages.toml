full_description = '''Security and KontistIt has never been easier and more secure to manage your business finances as a freelancer. A number of safety measures guarantee that your money, your account and your business information are always protected.You can choose to log in to your account with fingerprint and face recognition. These unique biological features are far more difficult to copy or steal than traditional passwords.Multi-factor authentication for transactionsIn addition to your username and password, you have to enter a unique, temporary valid TAN in order to confirm money transfers. This code is sent by SMS to the verified mobile phone number attached to your account.Task-switching privacyWhen switching between apps on your mobile device, the preview image of the Kontist App is blurred, so that sensitive information such as your account balance doesn't appear in the multitasking view.Full ControlCard blocking on demandYou can lock your Visa business debit card, in the Kontist App with just one click. Unlocking is just as easy, as is changing your card's PIN.Virtual card securityKontist meets Visas high security standard, which allows us to issue you a virtual card as part of our account. Since your virtual Visa card only exists as a card number in the App, it cannot be stolen.Security on-the-goFor every transaction in your bank account or on your Kontist card, you'll get a push notification so you know what's happening with your money and can react immediately.Jailbroken/ rooted devices are outTo protect your account and sensitive finance data, we do not allow rooted or jailbroken devices as they intentionally disable default security mechanisms of the operating systems.How we protect your moneySolaris is a german full-service bank licensed by the German Federal Financial Supervisory Authority (BaFin) and the European Central Bank (ECB).<img alt="icon" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5dZ-JbqstJ993oA_Banking.p