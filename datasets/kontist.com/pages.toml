description = "Als Selbstständiger stehst du vor der Wahl der passenden Unternehmensform? Wir helfen bei der Entscheidung und erklären die Vor- und Nachteile der einzelnen Optionen."
full_description = 'Unternehmensformen für Selbstständige: Die richtige Rechtsform wählenSteuergrundlagen für den Start in deine Selbstständigkeit <img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung24. Feb. 2023💡 Das Wichtigste in Kürze:Die Rechtsform beeinflusst viele Aspekte deines Unternehmens – zum Beispiel deine Haftung, das nötige Startkapital, die Außenwirkung und die Möglichkeit zur Beteiligung durch Investoren.Die beliebteste Rechtsform in Deutschland ist das Einzelunternehmen, gefolgt von der GmbH.Welche Rechtsform du für dein Unternehmen wählst, hat auch auf die Besteuerung einen großen Einfluss. 💡 So gehst du vor:Überlege dir, ob du allein oder zusammen mit weiteren Personen gründen möchtest.Plane langfristig: Wo siehst du dein Unternehmen in fünf oder zehn Jahren? Deine Rechtsform sollte deine Unternehmensziele widerspiegeln.Informiere dich zu wichtigen Kriterien wie der Haftung, dem Startkapital, der Steuerbelastung, dem Aufwand etc. Schaue dir an, welche Rechtsform Unternehmen gewählt haben, welche deinem ähnlich sind.Bist du dir unsicher? Dann lasse dich bei der Wahl der Rechtsform beraten.Hast du dich für eine Rechtsform entschieden, musst du dein Unternehmen anmelden. Je nach Rechtsform ist dies zum Beispiel beim Finanzamt, beim Gewerbeamt, im Handelsregister, bei der Industrie- und Handelskammer sowie bei der Berufsgenossenschaft notwendig.Inhalstverzeichnis1 - Rechtsformen in der Übersicht1.1 - Rechtsformen als Tabelle2 - Unternehmensgründung: Welche Rechtsform ist die richtige?2.1 - Team- oder Einzelgründung2.2 - Steuerliche Vor- & Nachteile3 - Unternehmensformen: Unterschiede erklärt3.1 - Kapitalgesellschaften3.2 - Personengesellschaften4 - Einzelunternehmen als Rechtsform für eine Unternehmensgründung4.1 - Gewerbe4.2 - Freie Berufe (Freiberufler*in)VIDEO: Freiberufler oder Gewerbe? Unterschiede erklärt!4.3 - Handwerk5 - Kleinunternehmer und Kleingewerbe: Was ist zu beachten?6 - Anmeldung der Unternehmensformen6.1 - Freiberufliche Tätigkeit6.2 - GbR6.3 - Kaufmann, OHG oder Kapitalgesellschaften7 - Kann die Rechtsform gewechselt werden?Rechtsformen in der ÜbersichtWenn du ein Unternehmen gründest, ist die Wahl der Rechtsform eine deiner ersten Entscheidungen. Weil die Rechtsform die Zukunft deines Unternehmens beeinflusst, solltest du dich zuvor gut informieren. Aus diesen Rechtsformen kannst du bei deiner Gründung wählen:Unternehmensformen von Einzelunternehmen: Kaufmann e.K.freiberuflich oder gewerbetreibend SelbstständigerUnternehmensformen von Kapitalgesellschaften:Gesellschaft mit beschränkter Haftung (GmbH)GmbH & Co KGAktiengesellschaft (AG)Kommanditgesellschaft auf Aktien (KGaA) Unternehmergesellschaft (UG)Unternehmensformen von Personengesellschaften:Gesellschaft bürgerlichen Rechts (GbR)Kommanditgesellschaft (KG)Offene Handelsgesellschaft (OHG)Partnerschaftsgesellschaft (PartG)Partnerschaftsgesellschaft mit beschränkter Berufshaftung (PartG mbB)InfoEinige dieser Unternehmensformen sind in Deutschland eher selten. Deshalb sind diese für dich vielleicht weniger relevant. Aktiengesellschaften sind beispielsweise meist große Unternehmen. In Deutschland waren im Jahr 2020 nur 7.389 von rund 3,03 Millionen Unternehmen AGs.Rund 70 % der deutschen Unternehmen werden als Einzelunternehmen (also zum Beispiel als Freiberufler*in, Gewerbetreibende*r oder Kaufmann) geführt und sind damit die mit Abstand beliebteste Rechtsform. Dahinter befindet sich mit rund 15 % die GmbH und mit 5 % die GbR.Rechtsformen als TabelleKriterien Einzelunternehmen (gewerbetreibend) Einzelunternehmen (freiberuflich) GmbH GbR UGMindestkapital 0 € 0 € 25.000 € 0 € 1 €Einzelgründung möglich ja ja ja nein jaPersönliche Haftung ja ja nein ja neinEinkommensteuer ja ja nein ja neinGewerbesteuer ja nein ja ja jaKleinunternehmerregelung möglich ja ja ja ja jaGeschäftskonto rechtlich notwendig nein nein ja ja jaUnternehmensgründung: Welche Rechtsform ist die richtige?Damit du dich für die richtige Rechtsform entscheiden kannst, musst du die richtigen Fragen stellen. Denn Rechtsformen für Unternehmen unterscheiden sich in unterschiedlichen Punkten. Manche davon sind für dich wahrscheinlich sehr relevant, andere davon weniger – ganz abhängig davon, was deine Pläne sind. Folgende Kriterien solltest du bei deiner Wahl mit einbeziehen:Die Höhe deines Startkapitals: Je nachdem, wie viel Kapital du zu Beginn in dein Unternehmen stecken kannst und willst, bieten sich unterschiedliche Rechtsformen an. Für eine GmbH musst du zum Beispiel ein Mindestkapital von 25.000 € vorweisen können. Eine UG kannst du theoretisch schon mit 1 € gründen. Andere Rechtsformen – wie etwa die GbR – benötigen gar kein Startkapital. Auch bei einer freiberuflichen oder gewerblichen Tätigkeit als Einzelunternehmer*in musst du kein Startkapital mitbringen.Die Haftung: Gerade wenn es in deinem Unternehmen um hohe Summen geht, wird die Frage der Haftung relevant. Dabei geht es darum, ob und in welchem Umfang du gegenüber Gläubigern mit deinem privaten Vermögen haftest. Als freiberuflicher oder gewerbetreibender Einzelunternehmer haftest du zum Beispiel mit deinem ganzen Privatvermögen. Bei einer Kapitalgesellschaft wird hingegen nur die Einlage der Gesellschafterinnen und Gesellschafter herangezogen.Die Außenwirkung: Abhängig von der Art deines Unternehmens kann deine Rechtsform auf Kund*innen, Geschäftspartner*innen oder Investor*innen unterschiedlich wirken. Als GmbH machst du beispielsweise einen sehr professionellen Eindruck. Auf kleinere Privatkund*innen wirkt diese Rechtsform aber vielleicht einschüchternd und unpersönlich.Der Firmenname: Bei den meisten Rechtsformen kannst du deinen Firmennamen frei wählen. Anders sieht es beim freiberuflichen oder gewerbetreibenden Einzelunternehmen aus: Hier muss dein Vor- und Nachname im Firmennamen enthalten sein.Die Investor*innen: Vor deiner Gründung solltest du dir Gedanken machen, ob eine Investition von außen in deine Firma möglich sein sollte. Das ist zum Beispiel bei der GmbH der Fall, nicht aber bei einer GbR oder einem Einzelunternehmen.Die Veröffentlichungspflicht: Als Einzelunternehmen, GbR oder OHG bist du nicht verpflichtet, deine Bilanzen zu veröffentlichen. Mit einer GmbH hingegen musst du deinen Jahresabschluss öffentlich zugänglich machen. Der Aufwand: Nicht zuletzt hast du bei der Anmeldung mancher Rechtsformen einen höheren Aufwand als bei anderen. Während du etwa als Einzelunternehmen schnell und einfach gründen kannst, musst du mit einer Kapitalgesellschaft wie einer GmbH viele Schritte durchlaufen. Zum Beispiel ist der Gang zum Notar oder zur Notarin und der Eintrag ins Handelsregister notwendig. Auch was die Buchführung angeht, hast du als Einzelunternehmen einen geringeren Aufwand. Du kannst dann (bis zu einem Umsatz von 600.000 € oder 60.000 € Jahresüberschuss) statt der doppelten die einfache Buchhaltung wählen.Team- oder EinzelgründungBei einer Einzelgründung hast du die maximale Freiheit und kannst dein Unternehmen ganz nach deinen Vorstellungen aufbauen. Mit einer Teamgründung teilst du dir hingegen das Risiko und bringst Personen mit unterschiedlichem Background und Kompetenzen zusammen. Abhängig von deinen Plänen, deiner Erfahrung und deiner Persönlichkeit können beide Optionen attraktiv sein.Auch die Wahl der Rechtsform deines Unternehmens beeinflusst die Anzahl der Mitgründerinnen und Mitgründer. So kannst du als Team andere Rechtsformen wählen als mit einer Einzelgründung. Folgende Möglichkeiten hast du:Einzelgründung möglich:Freiberufliches oder gewerbetreibendes EinzelunternehmenKaufmann e.K.Gesellschaft mit beschränkter Haftung (GmbH)Unternehmergesellschaft (UG) 1-Personen-AGTeamgründung möglich:Gesellschaft mit beschränkter Haftung (GmbH)Unternehmergesellschaft (UG)Offene Handelsgesellschaft (OHG)Kommanditgesellschaft (KG)Aktiengesellschaft (AG)Kommanditgesellschaft auf Aktien (KGaA)Wenn eine freiberufliche Tätigkeit ausgeübt wird: Gesellschaft bürgerlichen Rechts (GbR)Partnerschaftsgesellschaft (PartG)Partnerschaftsgesellschaft mit beschränkter Berufshaftung (PartG mbB)Steuerliche Vor- & NachteileWährend die Besteuerung des Gewinns von Personengesellschaften immer im Rahmen der Einkommensteuererklärung erfolgt, ist die Besteuerung bei Kapitalgesellschaften immer unabhängig. Bei Personengesellschaften kann etwa ein Verlust der Gesellschaft die Steuerbelastung des Ehepartners oder der Ehepartnerin ausgleichen, da die Unternehmensform personenbezogen ist. Dies ist bei Kapitalgesellschaften nicht möglich. Hier gilt die Gesellschaft als eigenständige juristische PersonAuch im Steuersatz kann es zwischen den einzelnen Unternehmensformen zu erheblichen Unterschieden kommen. Wir vergleichen im Folgenden einmal exemplarisch das Einzelunternehmen mit der GmbH.Steuern im EinzelunternehmenMit einem Einzelunternehmen musst du drei Arten von Steuern abführen: die Einkommensteuer, die Gewerbesteuer sowie die Umsatzsteuer. Es gibt jedoch Ausnahmen. Bei einer freiberuflichen Tätigkeit zahlst du keine Gewerbesteuer. Nutzt du die Kleinunternehmerregelung, wirst du zudem von der Umsatzsteuer befreit. Hast du vor allem Privatkundinnen und Privatkunden, kannst du so günstigere Preise als deine Konkurrenz anbieten.Steuern in der GmbHMit einer GmbH zahlst du 15 % Körperschaftsteuer, ungefähr 15 % Gewerbesteuer (das hängt vom Gewerbesteuerhebesatz deiner Gemeinde ab) sowie den Solidaritätszuschlag in Höhe von 5,5 % auf den Gewinn.Viele Unternehmerinnen und Unternehmer gründen eine GmbH, weil sie so Steuern sparen möchten. Tatsächlich kann die GmbH gegenüber dem Einzelunternehmen steuerlich vorteilhaft sein. Das ist vor allem dann der Fall, wenn du höhere Einnahmen hast. Der Körperschaftsteuer von 15 % steht schließlich eine Einkommensteuer von bis zu 45 % Höchststeuersatz gegenüber. Hast du allerdings ein niedriges Einkommen, profitierst du als Einzelunternehmen von einem Freibetrag von 10.908 € jährlich (Stand 2023). Bei der GmbH spielt dieser keine Rolle.Beispiel 1:Du machst mit deinem Unternehmen 10.000 € Gewinn. Sonst hast du keine weiteren Einnahmen.Als GmbH zahlst du nun 15 % Körperschaftsteuer, also 1.500 €. Als Einzelunternehmen profitierst du von dem Freibetrag und zahlst keine Steuer.Beispiel 2: Du machst mit deinem Unternehmen 100.000 € Gewinn. Zusätzlich hast du noch ein hohes weiteres Einkommen und fällst dadurch in den Höchststeuersatz von 45 %.Als GmbH bezahlst du unverändert 15 % Körperschaftsteuer, also 15.000 €. Als Einzelunternehmen zahlst du nun 45 % Einkommenssteuer, also 45.000 €. Fazit: Mit welcher Unternehmensform du mehr Steuern sparen kannst, hängt von deinem Einkommen beziehungsweise deinen Gewinnen ab. Es lohnt sich, vor der Wahl deiner Rechtsform alles einmal durchzurechnen oder dich steuerlich beraten zu lassen.Unternehmensformen: Unterschiede erklärtWenn du anstatt dem Einzelunternehmen eine andere Unternehmensform wählen möchtest, hast du die Wahl zwischen der Gründung einer Personengesellschaft und einer Kapitalgesellschaft. Der Unterschied lässt sich schon aus dem Namen der jeweiligen Rechtsform herauslesen: Während die Personengesellschaft personenbezogen ist, ist die Kapitalgesellschaft kapitalbezogen. Im Gegensatz zur Personengesellschaft gilt eine Kapitalgesellschaft als juristische Person und ist so unabhängig von den Gesellschafterinnen und Gesellschaftern. Das bedeutet zum Beispiel, dass das Unternehmen selbst Besitz erwerben oder vor Gericht auftreten kann. KapitalgesellschaftenAnders als bei Personengesellschaften ist bei der Gründung einer Kapitalgesellschaft ein Stammkapital notwendig. Wie hoch dieses ausfällt, richtet sich ganz nach der gewählten Rechtsform. Innerhalb der Kapitalgesellschaften gibt es folgende Rechtsformen, die am gängigsten sind:GmbHAGGmbHDie Gemeinschaft mit beschränkter Haftung (GmbH) ist eine der am häufigsten gewählten Unternehmensformen. Sie zeichnet sich dadurch aus, dass für die Gründung 25.000 Euro Stammkapital benötigt werden. Außerdem ist nur ein Gesellschafter oder eine Gesellschafterin notwendig. Zur Gründung benötigst du einen notariell beurkundeten Vertrag und eine Eintragung ins Handelsregister. Innerhalb der GmbH gibt es neben den Geschäftsführer*innen auch eine Gesellschafterversammlung und, ab 500 Mitarbeitenden, einen Aufsichtsrat.TippSeit 2008 kannst du mit nur einem Euro eine sogenannte Unternehmergesellschaft (auch Mini-GmbH genannt) gründen. Auch diese gehört zu den Kapitalgesellschaften, du bist also nicht mit dem privaten Vermögen haftbar. Es gibt hierbei jedoch einen Haken: Bei der Unternehmergesellschaft musst du pro Jahr mindestens 25 Prozent des Jahresüberschusses zurücklegen, bis die Summe von 25.000 Euro erreicht ist. Sobald dies der Fall ist, kann sie in eine normale GmbH umgewandelt werden.AGDie Aktiengesellschaft (AG) ist nach Unterschrift eines notariell beglaubigten Vertrags im Handelsregister eingetragen. Zur Gründung benötigst du nur eine Person und mindestens 50.000 Euro Grundkapital. Das Grundkapital muss bei der Gründung vollständig aufgebracht werden. Bei einer AG dürfen, wie der Name bereits vermuten lässt, Akt'
