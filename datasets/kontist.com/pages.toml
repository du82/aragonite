title = "EÜR in ELSTER ausfüllen | Kontist"
description = "Leitfaden für die Erstellung der Einnahmen-Überschuss-Rechnung in ELSTER"
full_description = 'Die Einnahmen-Überschuss-Rechnung bei ELSTER korrekt ausfüllen – ein Leitfaden<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung11. Juni 2023💡Das musst du wissen:Die EÜR ist eine Art der Gewinnermittlung, die die meisten Selbstständigen nutzen.Ausnahmen gibt es, wenn du als Gewerbetreibende*r mehr als 60.000 Euro Jahresgewinn beziehungsweise 600.000 Euro Jahresumsatz erwirtschaftest – denn so wirst du bilanzierungspflichtig. Freiberufler*innen können die EÜR in der Regel immer nutzen, auch mit mehr Gewinn oder Einnahmen.Inhaltsverzeichnis1 - Was ist die EÜR?2 - Angaben zum Betrieb3 - Die Betriebseinnahmen: Was dir zugeflossen ist4 - Ausgaben in der EÜR richtig und vollständig eintragen5 - Gewinnermittlung mittels EÜR bei ELSTER: Letzte Schritte6 - Sonstige Angaben und die Anlage SZIn unserem Artikel über ELSTER bin ich darauf eingegangen, was du bei ELSTER so alles machen kannst. Das Wichtigste ist dabei bei fast allen Selbstständigen letzten Endes die Gewinnermittlung, die meist mittels der Einnahmen-Überschuss-Rechnung erfolgt.Was ist die EÜR?Die Einnahmen-Überschuss-Rechnung (EÜR) ist ein knapp 30 Seiten langes Formular mit vielen Zeilen, von denen für die allermeisten Freelancer nur wenige wirklich relevant sind. Ergänzend zum Hauptformular EÜR wollen wir auch die Anlagen AVEÜR und SZ kurz anreißen. Die EÜR wird zusammen mit der Einkommensteuererklärung eingereicht und dient als Mittel zur Gewinnermittlung. Sie umfasst vier Bereiche:Angaben zum BetriebErfassung der EinnahmenErfassung der AusgabenGewinnermittlungAchtungBitte beachte: Nur für Landwirte wichtige Punkte sowie sehr selten gebrauchte Angaben werden hier nicht tiefergehend erläutert. Stattdessen soll diese Übersicht vor allem Freiberuflern und den meisten Solo-Selbstständigen (auch mit Gewerbe) helfen. In vielen Fällen ist auch nur ein Bruchteil des ganzen Formulares für dich relevant.Angaben zum BetriebDie Angaben zum Betrieb sind für jedes Unternehmen einzeln zu erfassen. Auch die EÜR muss insgesamt für jedes deiner Unternehmen gemacht werden. Unter den Angaben sind:die Steuernummer, die Art des Betriebes, diverse selbsterklärende Angaben sowie die Unternehmensform. Wichtig ist die Unterscheidung zwischen dem Einzelunternehmer und dem Freiberufler. Sollte dein Wirtschaftsjahr vom Kalenderjahr abweichend sein, wird auch das hier angegeben. Allerdings ist ohne Anzeige beim Finanzamt das Wirtschaftsjahr auch immer das Kalenderjahr – unabhängig vom Gründungszeitpunkt.In Zeile 9 und 10 gibst du ferner an, ob du deinen Betrieb aufgegeben hast oder Grundstücke aus dem Betriebsvermögen veräußert hast. Die Betriebseinnahmen: Was dir zugeflossen istDie Zeilen 11 bis 22 beschäftigen sich mit den Einnahmen, die größtenteils auch selbsterklärend sind. Einfach zu begreifen sind die Zeilen 11 und 12 (gilt nur für Kleinunternehmer) und die Zeilen 14 und 15: Hier trägst du deine steuerbaren Einnahmen (also netto) und die nicht steuerbaren Einnahmen (umsatzsteuerbefreite Leistungen) ein.Die Zeile 16 ist also etwas komplexer. Sie umfasst die eingenommene Umsatzsteuer sowie die Umsatzsteuer auf unentgeltliche Wertabgaben. Das umfasst aus deinem Betrieb entnommene und genutzte Leistungen und Waren. Bei Waren ist der Einkaufswert zuzüglich Nebenkosten als Bemessungsgrundlage für die Umsatzsteuer anzuführen, bei Leistungsentnahmen (Maschinen- oder PKW-Nutzung für private Zwecke etwa) ist es deutlich komplizierter. Hier hilft in vielen Fällen ein Steuerberater, bei der PKW-Nutzung helfen die 1-Prozent-Regelung beziehungsweise das Fahrtenbuch. In Zeile 17 kommt die vom Finanzamt erstattete Umsatzsteuer, in Zeile 18 kommen Erlöse aus Veräußerungen aus dem Anlagevermögen (falls vorhanden). Angesetzt wird hier der Teilwert, also das, was ein Dritter (noch) für den Gegenstand netto zahlen würde. Zeile 19 enthält den Netto-Wert der privaten KFZ-Nutzung eines Firmenfahrzeugs und Zeile 20 beschäftigt sich mit den Netto-Werten der Sach- und Leistungsentnahmen. InfoBargeldentnahmen oder Überweisungen auf das Privatkonto sind hingegen keine Entnahmen in diesem Sinne.Die Zeile 21 (Auflösungen von Rücklagen und Ausgleichsposten) wird dich vermutlich nicht betreffen.Ausgaben in der EÜR richtig und vollständig eintragenDie Ausgaben sind wichtig, denn sie schmälern den Gewinn. Die richtige Dokumentation deiner Kosten samt Nachweisen ist deshalb stets oberste Buchhaltungspflicht.Zeile 23 umfasst zunächst die Pauschalausgabenbeträge für bestimmte selbstständige und freie Berufe. AchtungDu kannst grundsätzlich nur die Pauschale oder deine tatsächlichen Kosten geltend machen. Die Zeilen 24 und 25 sind nur für Landwirte interessant. Die Zeile 26 umfasst Netto-Kosten für Waren, Rohstoffe und Hilfsstoffe zuzüglich der Nebenkosten für die Beschaffung derselben. Zeile 27 umfasst die Kosten für bezogene Fremdleistungen (im Rahmen deines Unternehmens), also beispielsweise einen engagierten Freelancer, der dir half oder ähnliches. Die Kosten sind netto anzusetzen. Zeile 28 umfasst die Gesamtheit deiner Personalkosten für fest angestellte Mitarbeiter: Bruttolohn zuzüglich Lohnsteuer zuzüglich Versicherungsbeiträge sowie andere Nebenkosten.Die Zeilen 29 bis 45 (32 bis 40 fehlen) beschäftigen sich mit Abschreibungen. Zeile 43 ist die, in der du die Netto-Kosten deiner geringwertigen Wirtschaftsgüter einträgst (bis je 801 Euro netto). Die anderen Zeilen umfassen etwa reguläre Abschreibungen für Abnutzung nach AfA-Tabelle oder auch die Auflösung von Sammelposten. Hier gehört dann auch die Anlage AVEÜR zu. Sie umfasst Übersichten zu Sammelposten, beweglichen Wirtschaftsgütern und so weiter. Es handelt sich um dein Anlageverzeichnis.Zeile 46 ist der Miet- und Pachtaufwand (netto) für betrieblich genutzte Räume – also Büro, Lager, Laden und so weiter.Zeile 47 umfasst die Aufwendungen für eine Zweitwohnung, so sie denn nötig ist. Zeile 48 ist für die Grundsteuer und Aufwendungen zur Instandhaltung betrieblich genutzter Grundstücke (und nicht etwa von gemieteten Räumen).Die Zeilen 49 bis 66 sind größtenteils selbsterklärend: Es handelt sich um die unbeschränkt abzugsfähigen Betriebsausgaben wie Fortbildungskosten und Telefonkosten. InfoWichtig: Bei Internet und Telefon ist nur der geschäftlich genutzte Anteil anzusetzen, wenn beides auch privat genutzt wird. Beim Arbeiten daheim ist dies wohl der Fall. Lediglich Zeile 65 ist etwas komplexer und beschäftigt sich mit Rücklagen, stillen Reserven und Ausgleichsposten. Die Zeile ist für die wenigsten relevant und eine Behandlung hier würde den Rahmen sprengen.Die Zeilen 67 bis 71 sind die beschränkt abzugsfähigen Betriebsausgaben. Es handelt sich um Ausgaben, deren maximal steuerlich geltend zu machende Höhe vom Gesetz festgeschrieben ist. Darunter sind Bewirtungskosten für Geschäftspartner, Geschenke und die Verpflegungsmehraufwendungen.Die Zeilen 81 bis 87 sind die Kosten im Zusammenhang mit Fahrten und Fahrzeugen (Zeile 72 bis 80 fehlen). Zeile 88 ist die Gesamtheit deiner Betriebsausgaben. Du bist nun fast fertig!Gewinnermittlung mittels EÜR bei ELSTER: Letzte SchritteEs folgt die Gewinnermittlung. Einnahmen und Ausgaben werden hier eingetragen. Zusätzlich ist in den Zeilen 91 bis 93 Platz für nicht steuerpflichtige Einnahmen, etwa staatliche Leistungen und bestimmte Versorgungsleistungen im öffentlichen Dienst.Es folgen nicht abzugsfähige Betriebsausgaben, welche im Gabler Wirtschaftslexikon recht gut erklärt sind. Dann folgen Investitionsabzugsbeträge.Die Zeilen 102 bis 108 sind steuerrechtlich kompliziert. Es ist für den Laien nicht sinnvoll, sich hier selbst zu versuchen. Allerdings treffen die Punkte auch für die wenigsten Freelancer oder auch Gewerbetreibenden zu.In Zeile 109 findet sich dann endlich dein steuerpflichtiger Gewinn (oder auch Verlust). Du hast es schon fast geschafft! Sonstige Angaben und die Anlage SZZeile 110 betrifft nur Personengesellschaften und ist für dich hoffentlich irrelevant. Die Zeilen 121 bis 124 umfassen wieder Rücklagen und stille Reserven – nach wie vor ein Thema für sich. Wichtig sind allerdings 125 und 126: Hier sind deine Entnahmen und Einlagen zu dokumentieren, wenn du Einzelunternehmer*in bist. Es handelt sich beispielsweise um vom Privatgegenstände, die du in deine Firma eingelegt hast (anzusetzen mit dem Restwert, der auch noch abgeschrieben werden kann) und um Barentnahmen. Bareinlagen und -entnahmen sind dabei natürlich gewinnneutral.Nun gibt es noch die Anlage SZ, die sich mit Schuldzinsen befasst. Schuldzinsen entstehen beispielsweise, wenn die Entnahmen die Barreserven übersteigen und so ein Dispokredit zustande kommt. Die hierauf zu zahlenden Zinsen sind von den Betriebsausgaben abzuziehen. Am besten kommst du gar nicht in die Situation …Und nun hast du es wirklich geschafft! Deine EÜR für 2021 steht. Und das Meiste hast du hoffentlich nicht mal ausfüllen müssen. ThemenübersichtSteuerwissen > Steuerbasis für den Start in die SelbstständigkeitSteuernummer beantragenUnternehmensform wählenGewerbe anmeldenFragebogen zur steuerlichen ErfassungKleinunternehmerregelungEÜR: Einnahmen-Überschuss-Rechnung (hier bist du gerade)Liebhaberei (bald erhältlich)Ist- und SollversteuerungScheinselbstständigkeitStundensatz berechnenRechnungen schreibenNebengewerbe anmeldenSteuererklärungen Basics für Selbstständige'
