full_description = 'SteuererklärungenSteuererklärungen - Basics für Selbständige<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung10. Apr. 2023Das musst du wissen:Die Steuererklärung gehört nicht zwingend zu den Lieblingsbeschäftigungen, ist sie doch vor allem mit Bürokratie, dem Suchen von Belegen und dem Durchschauen von scheinbar komplizierten Regel verbunden. Als Selbstständiger bist du allerdings zur Abgabe einer Steuererklärung verpflichtet und hast grundsätzlich zwei Möglichkeiten: Selber machen oder einen Steuerberater suchen und bezahlen. In beiden Fällen ist ein mindestens rudimentäre Verständnis der Natur einer deutschen Steuererklärung sinnvoll. Denn mit ein bisschen Wissen um gewisse Regeln und Möglichkeiten sowie mit Übung im Zusammenhalten von Papier erscheint der Moloch Steuererklärung sehr bald als zähmbare Fleißaufgabe.Inhaltsverzeichnis:1 - Die drei Großen: Einkommensteuer, Gewerbesteuer und Umsatzsteuer1.1 - Die Einkommensteuer – Königin unter den Steuern1.2 - Als Gewerbetreibender die Gewerbesteuer bezahlen1.3 - Der „durchlaufende Posten“: Die Umsatzsteuer2 - Die Gewinnermittlung: EÜR oder Bilanz?2.1 - Absetzbarkeit von Beträgen zum Sparen von Steuern3 - Die Fristen bei der Steuererklärung4 - Steuererklärungen selbstständig machen oder einen Steuerberater beauftragen?Die drei Großen: Einkommensteuer, Gewerbesteuer und UmsatzsteuerWichtig ist zunächst die Unterscheidung zwischen diesen drei Steuerarten, denn nicht jeder Selbstständige zahlt alle Steuern. Am relevantesten und häufigsten ist nämlich die Einkommensteuer. Die zahlt jeder, der ein Einkommen oberhalb des Steuerfreibetrages hat. Umsatzsteuer und Gewerbesteuer fallen hingegen ab einer gewissen Umsatzgröße und bei bestimmten Rechtsformen an. Die Einkommensteuer – Königin unter den SteuernDie Einkommensteuer ist die Besteuerung des Einkommens und damit die Besteuerung des Gewinns abzüglich der Sonderausgaben (außergewöhnliche Belastungen, Krankenversicherung etc.). Ein Einkommen, welches niedriger als der Steuerfreibetrag in jenem Jahr ist, ist steuerfrei. Im Jahr 2019 beträgt dieser Steuerfreibetrag beispielsweise 9.168 Euro. 2018 waren es hingegen 9.000 Euro. Die Einkommensteuererklärung ist von jedem Selbstständigen einzureichen, da eine Verpflichtung zur Einkommensteuererklärung besteht. Diese betrifft jeden, der Einkünfte aus Land- und Forstwirtschaft (Anlage L), aus einem Gewerbebetrieb (Anlage G) oder eben aus selbstständiger Arbeit (Anlage S) erzielt. Darüber hinaus wird dich das Finanzamt in aller Regel dazu verpflichten, deine Einkommensteuererklärung in elektronischer Form einzureichen.Die Einkommensteuer wird in Höhe von 6 bis 42 Prozent zuzüglich Solidaritätszuschlag und gegebenenfalls Kirchensteuersatz fällig – je nach persönlichem Steuersatz, der sehr von der Höhe deines Einkommens abhängt. Als Gewerbetreibender die Gewerbesteuer bezahlenAnlage G beschäftigt sich mit deinen Gewerbeeinnahmen. Ob du welche hast, hängt davon ab, ob du ein Gewerbe hast. Bei vielen Selbstständigen ist dies der Fall. Ausgenommen sind Leute, die den sogenannten Freien Berufen angehören, wobei es auch hier nebst eindeutigen Fällen wie Ärzten und Schriftstellern einigen Interpretationsspielraum gibt. Viele Selbstständige müssen als Gewerbesteuer zahlen, Freiberufler hingegen nicht.Die Gewerbesteuer wird ab einem Gewerbeertrag von 24.500 Euro im Jahr fällig. Der Gewerbeertrag ist dabei der Gewinn. Liegt dieser Gewinn aus deinem Gewerbe niedriger als 24.500 Euro, zahlst du auch keine Gewerbesteuer. Ansonsten berechnet sich die Gewerbesteuer aus dem zu versteuernden Gewerbeertrag x 3,5 % x Hebesatz. Der Hebesatz variiert je nach Gemeinde und liegt circa zwischen 200 und 900, was Faktoren zwischen 2 und 9 entspricht. Die zu zahlende Gewerbesteuer wird vollständig auf die Einkommensteuer angerechnet, sodass keine doppelte Belastung von Einkünften auftritt. Darüber hinaus wird die Gewerbesteuer quartalsweise fällig, nachdem sie das erste Mal für dein Gewerbe ermittelt wurde. Das heißt, dass quartalsweise eine Vorauszahlung fällig wird, wobei über die Steuererklärung nach Jahresende gegebenenfalls korrigiert wird.Die Gewinnermittlung: EÜR oder Bilanz?Einkommensteuer wird auf den Gewinn gezahlt und der muss ermittelt werden. Die Einnahmen-Überschuss-Rechnung ist dabei deutlich leichter durchzuführen als eine Bilanz. Die EÜR ist nämlich eine Gewinnermittlungsrechnung, die einfach alle Betriebsausgaben von den Betriebseinnahmen abzieht. Was übrig bleibt ist der Gewinn – und der wird versteuert. Die EÜR ist denkbar einfach durchzuführen und ist im Grunde das Mindestmaß an Buchhaltung, das du beherrschen solltest. Gewerbliche Unternehmer können bis zu einem Gewinn von 60.000 Euro im Jahr beziehungsweise einem Umsatz von 600.000 Euro im Jahr entscheiden, ob sie eine EÜR oder eine Bilanz aufstellen. Freiberufler können immer die EÜR nutzen. Eine Bilanz wird hingegen bei so ziemlich jedem anderen Selbstständigen und Unternehmer fällig. Hier werden Aktiva und Passiva verrechnet, wobei das an dieser Stelle zu weit führen würde. Der Einfachheit sei dir deshalb empfohlen, wenn möglich von der EÜR Gebrauch zu machen. Eine Bilanz wird ohnehin nur dann interessant, wenn du ein Unternehmen hast, welches auch stille Reserven, Verschuldungen, offene Forderungen und vieles mehr in den Büchern stehen hat. Hier kann sie dann dabei helfen, einen besseren Überblick über die gesamte finanzielle Lage des Unternehmens zu erhalten. Für einzeln agierende Selbstständige und Freiberufler ist sie hingegen selten notwendig oder sinnvoll. Absetzbarkeit von Beträgen zum Sparen von SteuernAbsetzen lassen sich sehr, sehr viele Posten,. Grundsätzlich geht es darum, die zu versteuernden Einkünfte zu verringern, sodass entsprechend weniger Steuern gezahlt werden. Als erstes sind hier Betriebsausgaben beziehungsweise Werbungskosten zu nennen. Sie meinen alles, was an Kosten aufgewandt wird, damit du arbeiten und Gewinn erwirtschaften kannst. Darunter fallen unter anderem, aber nicht ausschließlich:- Arbeitsmittel- Fachliteratur- Fahrtkosten- gezahlte Löhne- Fortbildungskosten- Kontoführungsgebühren für das GeschäftskontoSehr viele andere Posten sind ebenfalls vollständig oder teilweise steuermindernd. Nun kommen noch Sonderausgaben und gegebenenfalls außergewöhnliche Belastungen hinzu. Unter den Sonderausgaben sind etwa Beiträge zur Kranken- und Haftpflichtversicherung, Aufwendungen für die private Altersvorsorge und Spenden. Unter den außergewöhnlichen Belastungen sind unter anderem Kosten für Beerdigungen, Krankheitskosten und Pflegekosten. Es gilt hier allerdings, dass dir eine gewisse Summe als zumutbar zugeschrieben wird. Diese liegt, in Abhängigkeit von deinem Einkommen bei mindestens 767 Euro. Jeder Cent über deiner persönlichen Zumutbarkeitsgrenze ist absetzbar. Die Fristen bei der SteuererklärungDie Fristen bei der Steuerklärung variieren. Machst du sie selbst, hast du bis zum 31. Juli des Folgejahres Zeit (gilt ab Steuerjahr 2018; davor bis zum 31. Mai). Ist ein Steuerberater mit deinem Papier beschäftigt, hat dieser bis zum 28. Februar des nachfolgenden Jahres Zeit (die Abgabe für das Jahr 2019 muss dann bis zum 28. Februar 2021 erfolgen). Wenn du diese Frist nicht einhalten kannst, solltest du vor Ablauf der Frist eine Verlängerung beantragen. Dieser wird in der Regel stattgegeben, wodurch sich die Frist bis zum Jahresende verlängert. Du solltest deinen Antrag allerdings begründen. Verstreicht die Frist, kann das Finanzamt dich unter anderem mit Bußgeldzahlungen belegen, deren Höhe im Ermessen des Finanzamt liegen. Die Maximalsumme beträgt 25.000 Euro. Grundsätzlich ist es also sinnvoll, pünktlich zu sein, um keine Nachteile zu erfahren.Steuererklärungen selbstständig machen oder einen Steuerberater beauftragen?Die Fähigkeit, selbst eine komplette Steuererklärung ausfüllen zu können und entsprechend vom Absetzen von Posten Gebrauch zu machen, ist bares Geld wert. Wenn deine finanzielle Situation recht simpel ist (nur Einnahmen aus einer Quelle; Betriebsausgaben sind leicht zu definieren und Sonderausgaben sind eindeutig), dann darfst du dir zutrauen, deine Steuererklärung selber anzufertigen. Dies kannst du beispielsweise über ELSTER tun. Dabei handelt es sich um das elektronische Portal des Finanzamtes. Hier machst du deine Steuererklärungen, deine EÜR und sonstiges einfach elektronisch. Nachweise für angegebene Ausgaben musst du nur nachreichen, wenn das Finanzamt nachfragt. Du solltest sie also dringend aufbewahren. Wenn du einen Steuerberater beauftragst, dann gibst du bei diesem einfach alle Rechnungen und sonstige Nachweise ab und verlässt dich darauf, dass er das beste für dich herausholt. Dabei ist davon auszugehen, dass er mehr Ahnung hat und weniger Fehler macht als du, insofern du bezüglich Steuererklärungen weder Erfahrung noch Wissensdurst hast. Du musst es also selbst entscheiden. Aber im Grunde ist die Steuererklärung einfach nur ein sehr langweiliges Spiel mit vielen Regeln, bei dem es darum geht, verschiedene Posten richtig zuzuordnen.ThemenübersichtSteuerwissen > Steuerbasis für den Start in die SelbstständigkeitSteuernummer beantragenUnternehmensform wählenGewerbe anmeldenFragebogen zur steuerlichen ErfassungKleinunternehmerregelungEinnahmen-Überschuss-Rechnung (EÜR)Liebhaberei (bald erhältlich)Ist- und SollversteuerungScheinselbstständigkeitStundensatz berechnenRechnungen schreibenNebengewerbe anmeldenSteuererklärungen Basics für Selbstständige (hier bist du gerade)'
