title = "Alles was du als Freelancer über Steuern wissen musst | Kontist"
description = "Steuern sind nicht unbedingt des Freelancers Lieblingsthema. Außer natürlich man ist Steuerberater. Für alle anderen, haben wir hier die wichtigsten Infos, rund ums Thema Steuern, für dich einfach erklärt und zusammengefasst."
full_description = 'Was sollte man über Steuern wissen wenn man eine neue selbstständige Tätigkeit anfängt?Steuerbasis für den Start in deine Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung23. Feb. 2023💡 Das musst du wissen:Für jeden Selbstständigen ist das Abgeben einer Einkommensteuererklärung Pflicht. Der entsprechende Steuersatz dafür setzt sich aus der Höhe des Gewinns sowie den mindernden Werbungs- oder weiteren abzusetzenden Kosten zusammen. Auf die finale Einkommensteuersumme müssen zusätzlich 5,5% Solidaritätszuschlag bezahlt werden.Jeder Freiberufler ist weiterhin umsatzsteuerpflichtig und muss den entsprechenden Umsatzsteuersatz auf seine Ware bzw. Dienstleistung bezahlen. Allerdings kann er sich so auch die auf andere Anschaffungen gezahlte Umsatzsteuer zurückholen. Für das Zahlen und Zurückholen der Umsatzsteuer muss eine in der Regel monatliche Umsatzsteuervoranmeldung gemacht werden.Kleinunternehmer können sich durch Gebrauch der Kleinunternehmerregelung von dem Ausweisen der Umsatzsteuer befreien lassen.Abhängig von ihrer Rechtsform, müssen alle Selbstständige eine von ihrem Wohnort abhängige Gewerbesteuer bezahlen. Lediglich Freiberufler sind von dieser Zahlung befreit. Der Gewerbesteuersatz liegt bei 3,5% und muss noch mit dem ortsgebundenen Hebesatz multipliziert werden.Für angestellte Mitarbeiter muss die Lohnsteuer abgeführt werden.Thema im Detail:Die EinkommensteuerDer SolidaritätszuschlagFlexibilität ist gefragtUmsatzsteuerSoll- und Ist-VersteuerungDie UmsatzsteuervoranmeldungDie KleinunternehmerregelungDie GewerbesteuerDie Lohnsteuer für AngestellteZusammenfassung RechenbeispielWeitere Themen für den Start in deine SelbstständigkeitDie EinkommensteuerAus selbstständiger Arbeit erwirtschaftete Einkünfte müssen dem Finanzamt in der Einkommensteuererklärung offengelegt werden. Das ist Pflicht für jeden Freiberufler. Stichtag für die Abgabe der Steuererklärung ist der 31. Mai des Folgejahres. Ab der Steuererklärung 2019 (in der das Jahr 2018 abgerechnet wird) wurde die Frist um zwei Monate auf den 31. Juli verschoben. Bis zu vier Jahre kann man seine Steuererklärung nachreichen.In Deutschland ist man bis zu einem jährlichen Einkommen von 8.820€ von der Einkommensteuer befreit. Alles was darüber hinaus verdient wird, muss versteuert werden. Die Einkommensteuer berechnet sich abhängig von den jährlichen Einnahmen aus selbstständigen Tätigkeiten. Je mehr du also als Freelancer verdienst, desto mehr Steuern (Einkommensteuer) musst du zahlen. Deinen individuellen Steuersatz kannst du dir auf der Seite des Bundesfinanzministeriums ausrechnen lassen.Rechenbeispiel EinkommensteuerGehen wir einmal von Paul aus, der freiberuflich als Fotograf arbeitet. Er schätzt, dass er im nächsten Jahr rund 50.000€ aus seiner freiberuflichen Tätigkeit verdienen wird.50.000€ (Vorsteuer-)Gewinn * 25% Steuersatz = 12.561€ Steuerschuld.Von diesem Betrag kann Paul aber nun noch einige seiner Kosten absetzen. Darunter fallen Gelder für Arbeitsmittel, ohne die er seine selbstständige Tätigkeit nicht angemessen ausüben könnte. Aber auch ein Firmenwagen oder die Beiträge zur Krankenversicherung können geltend gemacht werden. Zu beachten ist hier, dass nicht die Kosten, die man für die Anschaffung gezahlt hat, einfach wieder zurückgezahlt werden, sondern dass sie anhand von Pauschalen den zu versteuernden Betrag mindern.<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenDer SolidaritätszuschlagSeit 1991 muss der sogenannte Solidaritätszuschlag, kurz Soli, bezahlt werden. Ursprünglich geplant, um nach der Wiedervereinigung den ostdeutschen Ländern beim Aufbau ihrer Wirtschaft zu helfen, kann der Soli heute auch für andere Belange des Bundeshaushaltes genutzt werden. Genau das ist auch der Grund, warum viele Deutsche fordern, den Solidaritätszuschlag wieder abzuschaffen - bisher jedoch ohne Erfolg.Der Soli hat den festen Satz von 5,5% und wird auf die Summe der zu zahlenden Einkommensteuer angerechnet. Allerdings nur, wenn die Summe mehr als 972€ im Jahr beträgt. Alles darunter ist von der Zahlung des Solis befreit.Rechenbeispiel SolidaritätszuschlagBei Paul sieht das so aus:(Vorsteuer-) Gewinn: 50.000€ Zu zahlende Einkommenssteuer: 12.561€ 5,5% Soli auf 12.561€ Einkommensteuer: 690,85€Flexibilität ist gefragtDie Krux an der Einkommensteuer für Freelancer ist: Der zu zahlende Steuersatz setzt sich aus den gesamten Einkünften aus 12 Monaten, also einem Jahr, zusammen. Doch nur in den seltensten Fällen können Selbstständige so genau sagen, wie viel sie in einem Jahr verdienen werden.Die Einkünfte sind von vielen Faktoren abhängig, wie der Auftragslage oder auch der Preisgestaltung. Hier heißt es flexibel sein. Du solltest regelmäßig deine Einkünfte im Blick haben und den Steuersatz entsprechend des monatlichen Geldflusses anpassen. So läufst du nicht Gefahr, bei der nächsten Steuererklärung eine böse Überraschung in Form einer Nachzahlung zu erleben.UmsatzsteuerJeder Selbstständige ist prinzipiell auch umsatzsteuerpflichtig. Das heißt, er muss auf seine angebotenen Waren oder Dienstleistungen eine Umsatzsteuer an das Finanzamt zahlen. Zusätzlich muss eine jährliche Umsatzsteuererklärung abgegeben werden. Hierfür gilt die gleiche Frist wie für die Einkommensteuererklärung.Für die Umsatzsteuer, gerne auch Mehrwertsteuer genannt, gibt es zwei Sätze: ermäßigte 7% sowie reguläre 19%. Welcher Satz auf dich zutrifft, ist von der Art deiner Dienstleistung bzw. deines Produktes abhängig, mit dem du dein Geld verdienst. Prinzipiell gilt für Lebensmittel, Bücher, Zeitungen, Kunstgegenstände und Hotelübernachtungen der ermäßigte Steuersatz von 7%, doch können hier auch urheberrechtlich geschützte Texte und andere Dienstleistungen reinfallen. Wer sich nicht ganz sicher ist, sollte mit seinem Steuerberater bzw. dem Finanzamt Rücksprache halten.Das Gute an der Umsatzsteuer ist, dass man sie nicht nur selber zahlen muss, sondern auch auf eigene Ausgaben zurückverlangen kann. Gerade bei Existenzgründern fallen in der Anfangszeit oftmals viele Kosten an. Computer beispielsweise, oder auch die erste Büroeinrichtung.Für diese Anschaffungen zahlen wir zwar den Bruttopreis, also inklusive Umsatzsteuer, können aber genau diesen Betrag in der Umsatzsteuervoranmeldung auch wieder von der Steuer absetzen. Somit zahlt man letztendlich nur den Netto-Preis, ohne die veranschlagten 7% respektive 19%.Soll- und Ist-VersteuerungBei der Zahlung der Umsatzsteuer unterscheidet man zwischen der Soll- und Ist-Versteuerung. Die Soll-Versteuerung bedeutet, dass du die Umsatzsteuer für teilweise oder komplett erbrachte Leistungen schon an das Finanzamt zahlen musst, auch wenn du die Leistung noch gar nicht bezahlt bekommen hast. Da du als Freiberufler aber auch gerne mal ein wenig auf das Begleichen deiner Rechnungen warten musst, heißt das, dass du die Zahlung der Umsatzsteuer vorstrecken musst – was bei manchen Aufträgen eine nicht unerhebliche Summe wäre.Deswegen gibt es die Möglichkeit, die Ist-Versteuerung zu beantragen. Hier wird nur dann die Umsatzsteuer gezahlt, wenn die entsprechende Rechnung schon beglichen wurde. Voraussetzung dafür ist unter anderem jedoch, dass der Nettoumsatz des letzten Jahres bei nicht mehr als 500.000€ lag.Die UmsatzsteuervoranmeldungDamit das Finanzamt nicht so lange auf die Steuereinkünfte durch Unternehmer warten muss, wurde die Umsatzsteuervoranmeldung eingeführt. In dem zwei Seiten langen Dokument müssen monatlich die Einkünfte – und Ausgaben – aus der Umsatzsteuer angegeben werden. Das hat auch für Unternehmer Vorteile. Einerseits verteilt sich die Steuerschuld nicht über ein ganzes Jahr, wodurch ein besserer Überblick über die Steuerausgaben geschaffen wird und Engpässe in der Zahlung am Ende des Jahres vermieden werden können. Andererseits kann auch die auf Anschaffungen gezahlte Umsatzsteuer monatlich zurückverlangt werden.Stichtag für die Abgabe sowie die Zahlung ist immer der 10. des Folgemonats, also für den April muss bis spätestens zum 10. Mai eine Umsatzsteuervoranmeldung gemacht werden. Die Abgabe muss online erfolgen, über die Steuersoftware ELSTER. Die monatliche Zahlung gilt für die ersten zwei Jahre bei einer Existenzgründung sowie, wenn die monatliche Steuerschuld aus der Umsatzsteuer bei mehr als 7.500€ liegt. Wenn die Steuerschuld weniger als diese Summe beträgt, kann die Voranmeldung vierteljährlich abgegeben werden.Allerdings trifft dies nicht auf alle Berufsgruppen zu. So sind beispielsweise medizinische Berufe von der Zahlung der Umsatzsteuervoranmeldung befreit. Auch Unternehmer, deren Umsatzsteuer im vergangenen Jahr weniger als 1.000€ betrug, müssen nur einmal im Jahr die Umsatzsteuererklärung abgeben.Und schließlich können Kleinunternehmer dem Abführen der Umsatzsteuer sowie der regelmäßigen Umsatzsteuervoranmeldung komplett entgehen, wenn sie von der Kleinunternehmerregelung Gebrauch macht.Die KleinunternehmerregelungAls Kleinunternehmer hast du die Option, von der Kleinunternehmerregelung Gebrauch zu machen und dich so von der Zahlung der Umsatzsteuer zu befreien. Das macht unter anderem dann für dich Sinn, wenn du keine großen Anschaffungen für deine freiberufliche Tätigkeit hast und dir somit auch nicht die gezahlte Umsatzsteuer zurückholen kannst. Weiterhin sparst du dir natürlich die Zeit, die du für die Buchhaltung und die Voranmeldung aufwenden müsstest.Kleinunternehmer bist du, wenn dein Gewinn aus dem vorangegangenen ganzen Jahr bei nicht mehr als 22.000€ lag. Zusätzlich dürfen deine Einnahmen im laufenden Jahr die Grenze von 50.000€ voraussichtlich nicht überschreiten. Falls sie das doch tun, bist du ab dem Folgejahr kein Kleinunternehmer mehr und musst auf deine selbstständige Tätigkeit die Umsatzsteuer bezahlen.Die GewerbesteuerJe nach deiner gewählten Rechtsform musst du zusätzlich noch eine Gewerbesteuer zahlen. Das gilt für Einzelunternehmer, Personen- und Kapitalgesellschaften, also alle Selbstständigen, die ihre Einkünfte über einen Gewerbeschein abrechnen.Allein Freiberufler sind in der Regel davon befreit. Dabei ist die Unterscheidung zwischen einem Gewerbetreibenden und einem Freiberufler oft eine Gratwanderung. Eindeutig freiberuflich sind Ärzte, Heilpraktiker, Anwälte, Hebammen und Architekten. Auch Berufe mit einer künstlerischen, erziehenden oder schriftstellerischen Tätigkeit fallen in die Kategorie der freien Berufe. Das lässt schon mehr Auslegungsspielraum und oft kommt es hier nur auf die richtige Formulierung gegenüber dem Finanzamt an. Denn letztendlich wird genau dort entschieden, ob du als Freiberufler oder Gewerbetreibender eingestuft wirst.Einzelunternehmer und Personengesellschaften können den jährlichen Freibetrag von 24.500€ auf die Gewerbesteuer anrechnen. Somit zahlst du die Gewerbesteuer nur, wenn dein Gewinn aus der freien Tätigkeit höher als 24.500€ ist. Und auch dann musst du nur den Gewinn, den du abzüglich des Freibetrags gemacht hast, besteuern.Die Höhe der zu zahlenden Gewerbesteuer wird von der Gemeinde festgesetzt, in der dein Arbeitssitz liegt. Zusätzlich ist die Summe von deinen Einkünften abhängig. Die Gewerbesteuer muss jährlich zusammen mit der Einkommen- sowie Umsatzsteuererklärung abgegeben werden. Vorab muss die zu erwartende Gewerbesteuer, auf ein Vierteljahr heruntergerechnet, als Vorauszahlung geleistet werden. Fristen hierfür sind stets der 15. Februar, Mai, August sowie November.Rechenbeispiel GewerbesteuerPaul ist Einzelunternehmer, daher kann er den Freibetrag für die Gewerbesteuer abziehen. Gehen wir wieder von seinen 50.000€ (Vorsteuer-)Gewinn aus, muss er nur noch auf die restlichen 25.500€ die Gewerbesteuer anrechnen. Dieser Wert wird nun mit dem einheitlichen Steuersatz der Gewerbesteuer von 3,5% multipliziert:25.500€ Gewinn * 3,5% Gewerbesteuersatz = 892,50€Diese Summe muss nun noch mit dem individuellen Hebesatz (oder auch Hundertsatz) der Gemeinde multipliziert werden. Paul wohnt in Frankfurt, wo ein Hebesatz von 460 anfällig wird:892,50€ * 460 Hebesatz für Frankfurt / 100 = 4.105,50€ GewerbesteuerDie Lohnsteuer für AngestellteWenn du dich selbstständig gemacht hast, kannst du natürlich auch Mitarbeiter beschäftigen. '
