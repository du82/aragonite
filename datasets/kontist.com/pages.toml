title = "Das Girokonto - Alles was du über Girokonten wissen solltest | Kontist"
description = "Jeder von uns hat ein Girokonto. Doch welche gibt es und braucht man eines, wenn man selbstständig ist? Das erklären wir dir hier!"
full_description = 'Das Girokonto - Alles was du über Girokonten wissen solltestBanking Basics für Selbstständige<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung22. März 2019blog.last_updated_placeholder 14. Sept. 2023💡 Das Wichtigste in Kürze Vom Girokonto zu unterscheiden sind andere Konten, wie zum Beispiel Sparkonten, Kreditkartenkonten, Tagesgeldkonten oder Festgeldkonten.Sparkonten sind immer Guthabenkonten und auch Girokonten sind reine Guthabenkonten, wenn du keinen Dispokredit eingeräumt bekommen hast. Als Anlageform oder um sein Geld zu „parken” ist das Girokonto also gänzlich ungeeignet. Die Europäische Zentralbank (EZB) erhebt von Banken Strafzinsen, die ihr Geld bei ihr anlegt. Der Verlust geht an Privatpersonen weiter, die ihr Geld bei der Bank anlegen. Bevor du dich für eine Bank entscheidest, solltest du dir klar machen, was für dich wichtig ist und worauf du verzichten kannst. Neben den Kontoführungsgebühren können noch Kosten für Überweisungen, Kontoauszüge, SMS-TAN, Rücklastschriften usw. entstehen. Einige Girokonten sind erst kostenlos, wenn du einen bestimmten regelmäßigen Geldeingang verzeichnen kannst. Ein Filialnetz mit Niederlassungen in Top-Lagen ist teurer und am Ende müssen die Kunden der Bank dafür bezahlen - sei es nun in Form von Kontoführungsgebühren oder negativen Zinsen. Geldabhebungen und Überweisungen sind nicht immer bei allen Banken kostenlos.Wenn du eine Kreditkarte hast, musst du bei einigen Banken jährliche Kreditkartengebühren von bis zu 600,00 Euro zahlen. Beim Dispokredit solltest du vor allem auf die Zinshöhe achten. Aktuell sollte dieser nicht über 7,0-8,0% liegen. Es gibt spezielle Girokonten für Studenten, Girokonten für Selbstständige oder Angebote für Rentner.Bei Eröffnung eines Kontos braucht man eine positive SCHUFA.Kontoeröffnung dauert meist einige Tage.Ein Wechsel der Bank ist heutzutage sehr einfach mit dem Kontowechselservice, das mittlerweile die Banken gesetzlich verpflichtend anbieten müssen.Kostenlose Girokonten werden heutzutage nur noch sehr beschränkt angeboten.Es lohnt sich, die Angebote mehrerer Banken zu vergleichen und das richtige Konto für sich zu finden.Inhaltsverzeichnis1 - Unterschiedliche Konten für unterschiedliche Zwecke1.1 - Was ist ein Guthabenkonto?1.2 - Zinsen auf dem Girokonto1.3 - Eine ganz neue Gefahr: Strafzinsen2 - Die richtige Bank fürs Girokonto finden2.1 - Kosten des Girokontos2.2 - Service vor Ort und persönliche Ansprechpartner2.3 - Digitalisierung und Online-Service2.4 - Funktionen (Lastschriften, Daueraufträge etc.)2.5 - Filialnetz2.6 - Kreditkarte2.7 - Dispokredit3 - Girokonten für besondere Zielgruppen3.1 - Girokonto für Jedermann3.2 - Girokonto für Studenten3.3 - Girokonto für Selbstständige4 - Girokonto eröffnen - Worauf du achten solltest4.1 - Exkurs: Was ist die SCHUFA?4.2 - Dauer der Kontoeröffnung4.3 - Welche Unterlagen du für die Kontoeröffnung brauchst5 - Girokonto wechseln - Was du bei einem Wechsel beachten solltest5.1 - Wie viele Girokonten du betreiben darfst6 - Prämien zur Kontoeröffnung7 - Welche Kosten können bei Girokonten entstehen?7.1 - Kontoführungsgebühren vs. kostenloses Girokonto7.2 - Kostenloses Girokonto ohne Mindestgeldeingang8 - FazitEin smartes Bankkonto und innovative Buchhaltung in einer App?Das kann Kontist! Mit unserem Geschäftskonto hast du ab sofort einen besseren Überblick über deinen Finanzen. Zudem lässt sich auch deine Buchhaltung mit Hilfe von KI (Künstliche Intelligenz) in Handumdrehen erledigen!Jetzt entdeckenSeinen Namen hat das Girokonto aus dem Italienischen. Giro bedeutet Kreis oder Umlauf, wodurch auch schon klar wird, für welche Art Bankgeschäfte Girokonten am besten geeignet sind. Es ist normalerweise das Umlaufkonto, auf dem alle Zahlungen eingehen und von denen laufend Beträge abgebucht werden. Bei Angestellten ist es das typische Gehaltskonto und bei Selbstständigen und Unternehmen das Geschäftskonto, das für alle Geldeingänge und -ausgänge verwendet wird. Da die meisten Zahlungsvorgänge in unserem Alltag elektronisch abgewickelt werden, hat inzwischen nahezu jeder mindestens ein Girokonto. Gehaltszahlungen, die Miete für die Wohnung, Kreditraten, Krankenkassenbeiträge oder Steuerzahlungen werden ausschließlich elektronisch über das Girokonto abgewickelt. Wenn wir Konten mit dem reinen Bargeldverkehr vergleichen, ist ein Girokonto das Portemonnaie. Unterschiedliche Konten für unterschiedliche ZweckeVom Girokonto zu unterscheiden sind andere Konten, wie zum Beispiel Sparkonten,Kreditkartenkonten,Tagesgeldkonten oderFestgeldkonten. Sparkonten, wie zum Beispiel die früher sehr beliebten Sparbücher, Tageskonten oder Festgeldkonten sind in erster Linie dafür da Geld anzusparen. Es ist nicht üblich, regelmäßige Zahlungsverpflichtungen von diesen Konten zu begleichen, weshalb solche Vorgänge in der Regel auch mit hohen Kosten verbunden sind. Dafür ist aber das Guthaben auf solchen Konten in der Regel höher verzinst als auf einem Girokonto. Wenn wir Konten mit dem reinen Bargeldverkehr vergleichen, sind Sparkonten vergleichbar mit einem Sparschwein. Kreditkartenkonten sind die Konten, die gewöhnlicherweise hinter Kreditkarten stehen. Bei der klassischen Kreditkarte hast du ein bestimmtes Kreditlimit und kannst die Kreditkarte bis zu dieser Höhe verwenden. Einmal im Monat bekommst du eine Abrechnung und der gesamte Betrag wird von deinem Girokonto abgebucht und der (Kreditkarten-)Kredit wird so wieder getilgt. Seit einigen Jahren gibt es immer mehr Misch- und Zwischenformen, wie zum Beispiel Prepaid- Kreditkarten, die nur mit Guthaben funktionieren, Kreditkarten, hinter denen ein Ratenkredit steht und pro Monat immer nur eine kleine Rate des in Anspruch genommenen Kredits von deinem Girokonto abgebucht wird oder auch Kreditkarten, die kein eigentliches Kreditkartenkonto haben, sondern bei denen alle Zahlungen direkt vom Girokonto abgebucht werden. Dadurch hast du alle Vorteile, die Kreditkarte mit sich bringen, nimmst aber keine Schulden (= Kredit) auf. Wenn wir Kreditkartenkonten mit dem Bargeldverkehr vergleichen, handelt es sich nicht um das Portemonnaie oder das Sparschwein, sondern eher um einen Kumpel, mit dem du zusammen unterwegs bist, den du jedes Mal anpumpen musst, wenn du etwas bezahlen möchtest. Was ist ein Guthabenkonto?Das Gegenteil zum klassischen Kreditkartenkonto ist das sogenannte Guthabenkonto. Das Guthabenkonto ist keine eigene Kontenform, es ist ein Sammelbegriff für Konten, bei denen es keine Überziehungsmöglichkeiten gibt. Es ist also nur möglich Guthaben auf dem Konto zu haben. InfoSparkonten sind immer Guthabenkonten und auch Girokonten sind reine Guthabenkonten, wenn du keinen Dispokredit eingeräumt bekommen hast. Selbst Prepaid-Kreditkarten, die du vor Verwendung aufladen musst und die du nicht überziehen kannst, können als Guthabenkonten bezeichnet werden. Zinsen auf dem GirokontoIn der Regel gibt es keine oder nur sehr geringe Zinsen auf das Girokonto. Durch die, inzwischen schon sehr lange Niedrigzinsphase werden bei den führenden Banken in der Regel nicht mehr als 0,0-0,2% Zinsen gezahlt. Wenn du nun noch berücksichtigst, dass von diesen Zinsen 25 % Kapitalertragsteuer einbehalten wird (Bedingung: kein Freistellungsauftrag), sollte klar werden, dass die Zinserträge nie nennenswerte Höhen erreichen werden.AchtungAls Anlageform oder um sein Geld zu „parken” ist das Girokonto also gänzlich ungeeignet. Es kann zwar sein, dass du in der Quartalsabrechnung ein paar Euro gutgeschrieben bekommst, allerdings solltest du dir Gedanken machen, wenn du zu viel Geld auf dein Girokonto bekommst. Das bedeutet im Umkehrschluss nämlich auch, dass du eine Menge Geld auf dem Girokonto liegen hast, dass du auch deutlich gewinnbringender anlegen könntest. Selbst wenn du schnell auf das Geld zugreifen können musst, solltest du höhere Geldbeträge nicht auf dem Girokonto lagern. Für solche Fälle eignen sich besonders Tagesgeldkonten. Ein solches Konto kannst du bei fast jeder Bank als Zusatzkonto beantragen und du erhältst mit aktuell bis zu 1,0% deutlich mehr Zinsen als auf dem Girokonto.Eine ganz neue Gefahr: StrafzinsenDu bringst dein Geld zur Bank und nach einem Jahr sind aus 10.000 Euro 9.900 Euro geworden? Geld dafür zu bezahlen, dass man sein Geld zur Bank bringt, damit sie damit arbeiten kann? Das war noch vor einigen Jahren vollkommen unvorstellbar, ist jetzt aber Realität. Die Europäische Zentralbank (EZB) verlangt von den Geschäftsbanken Strafzinsen, die ihr Geld bei ihr anlegt. Diese negativen Zinsen auf Guthaben von aktuell 0,75 % (Stand: 09/2022) werden schon von vereinzelten Banken auch an die Privatkunden weitergegeben. Bisher sind fast nur Privatpersonen betroffen, die über 100.000 Euro auf dem Konto haben, aber die Banken geraten durch die negativen Zinsen immer weiter unter Druck und man kann davon ausgehen, dass auch bald auf geringere Vermögen Strafzinsen anfallen, wenn die EZB die Negativzinsen nicht bald aufhebt. Die richtige Bank fürs Girokonto findenDie Frage nach der richtigen Bank kann ich - welch Überraschung - nicht pauschal beantworten. Dafür sind die persönlichen Bedürfnisse und Präferenzen einfach zu unterschiedlich. Während die einen unbedingt auf kostenlose Bargeldabhebungen in Südamerika angewiesen sind, hat der andere noch nie in seinem Leben die Münchener Vorstadt verlassen und möchte seinen Bankberater aber jedes Jahr persönlich auf dem Oktoberfest treffen. Genau so haben Studenten, Arbeitnehmer und Selbstständige ganz unterschiedliche Bedürfnisse und brauchen deshalb unterschiedliche Girokonten. Wir von Kontist konzentrieren uns zum Beispiel ganz klar auf Selbstständige und Unternehmen und arbeiten daran, dass perfekte Konto für Selbstständige zu entwickeln. Dass wir dabei nicht alle Bedürfnisse von Rentnern auf Mallorca erfüllen, ist vollkommen klar. Für diese Zielgruppe gibt es andere Angebote. Bevor du dich also für eine Bank entscheidest, solltest du dir klar machen, was für dich wichtig ist und worauf du verzichten kannst. Die folgenden Kriterien könnten dabei eine entscheidende Rolle spielen: Kosten des Girokontos Service vor Ort und persönliche Ansprechpartner Digitalisierung und Online-Service Funktionen (Lastschriften, Daueraufträge etc.) Filialnetz Kreditkarte Dispokredit Diese Liste ließe sich noch erheblich verlängern, aber ich denke, dass du mit diesen Punkten schon einen guten Überblick bekommen kannst. Kosten des GirokontosDie Kosten eines Girokontos sind für Viele ein ganz zentrales Kriterium bei der Kontowahl. Doch leider lassen sich die Kosten für ein Konto nicht immer ganz leicht vergleichen, da es mehrere Stellen gibt, an denen Banken abkassieren. Neben den Kontoführungsgebühren können noch Kosten für Überweisungen, Kontoauszüge, SMS-TAN, Rücklastschriften usw. entstehen.Ich kann dir nur empfehlen, dass du ganz genau hinschaust, wenn die Kostenstruktur zu unübersichtlich ist und zu viel Kleingedrucktes enthält. Kontist steht für eine klare und faire Preisgestaltung, bei der die Kontoführung und alle grundlegenden Funktionen kostenlos sind.Pauschal kann man durchaus sagen, dass Direktbanken ohne eigenes Filialnetz günstiger sind als klassische Banken. Bei Preisvergleichen, die du schnell im Internet findest, solltest du immer darauf achten, ob das kostenlose Girokonto unter Umständen nur eine kurzfristige Neukundenaktion ist. Wenn ein Konto nur für Neukunden kostenlos ist, Bestandskunden aber Gebühren bezahlen müssen, kannst du davon ausgehen, dass auch dein Konto nicht dauerhaft kostenlos bleiben wird. TippEinige Girokonten sind erst kostenlos, wenn du einen bestimmten regelmäßigen Geldeingang verzeichnen kannst. Achte also darauf, ob das kostenlose Girokonto eventuell an Bedingungen geknüpft sind und ob du sie (dauerhaft) erfüllst. Service vor Ort und persönliche AnsprechpartnerGerade für ältere Menschen und für Geschäftskunden, die immer wieder kurzfristige Kredite benötigen (z.B. im Immobilienbereich), ist ein persönlicher Ansprechpartner vor Ort von großem Wert. Er kümmert sich um alle Anliegen und ist sowohl telefonisch als auch persönlich immer erreichbar, wenn du Fragen hast. Wenn du aber als Digitaler Nomade um die Welt reist und nur selten länger als vier Wochen an einem Ort bist, ist dir ein persönlicher Ansprechpartner für dein Girokonto wahrscheinlich egal. Oder dir ist zumindest egal, ob er in Villingen-Schwenningen oder im indischen Call-Center sitzt. VorsichtNicht vergessen solltest du aber, dass ein Filialnetz mit Niederlassungen in Top-Lagen teuer ist und am Ende die Kunden der Bank dafür bezahlen - sei es nun in Form von Kontoführungsgebühren oder negativen Zinsen. Digitalisierung und Online-ServiceDie Zukunft liegt in der Vernetzung. Der Trend, den man in nahezu jeder Branche beobachten kann, macht auch nicht vorm Banking halt. Wozu solltest du noch Überweisungsträger ausfüllen und in der Filiale abgeben, wenn du auch alles mit einer App auf deinem Sma'
