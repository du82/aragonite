mo%2FZ5CqXJbqstJ99uFA_Group427322855.png%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5CqXJbqstJ99uFA_Group427322855.png%3Fauto%3Dformat%2Ccompress&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5CqXJbqstJ99uFA_Group427322855.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5CqXJbqstJ99uFA_Group427322855.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain;object-position:center" loading="lazy"/>Wie kannst du deine Rechnungen und Belege einfach einreichen?Direkt teilen per AppMit einem Klick kannst du deine Belege direkt mit der Kontist-App teilen und einer Transaktion zuordnen.Your browser does not support the video tag.Weiterleitung per E-MailHast du eine Rechnung oder einen Beleg per E-Mail erhalten? Leite die E-Mail einfach an belege@kontist.com weiter, und wir gleichen sie mit deinen Transaktionen ab. Unser Tipp: Du kannst beim Versenden deiner Ausgangsrechnungen belege@kontist.com im BCC angeben, damit wir die Rechnung speichern und bei Zahlungseingang abgleichen können. Oder du richtest direkt eine automatische Weiterleitung in deinem Mailpostfach ein und die Arbeit erledigt sich von alleine.Your browser does not support the video tag.Was passiert nachdem du deine Rechnungen und Belege weitergeleitet hast?Automatischer AbgleichMit unserer OCR-Texterkennung werden alle Belege automatisch mit deinen bestehenden und zukünftigen Transaktionen abgeglichen.Manueller BelegabgleichWenn deine Belege nicht automatisch abgeglichen werden konnten, hast du in der Web-App die Möglichkeit sie manuell zuzuordnen.Prüfen und BuchenDeine Transaktionen werden geprüft und gebucht. Das Team der Kontist Steuerberatung sorgt dafür, dass alles richtig zugeordnet wird.Warum ist es wichtig, für jede Transaktion Belege zu haben?Steuern korrekt an das Finanzamt abführen.Ausgaben ohne Belege gelten nicht als Ausgaben. Dadurch erhöhen sich deine Mehrwertsteuer- und Einkommensteuerzahlungen.Reduziere dein Risiko von Fehlern und Gebühren.Korrekte Berechnung deines Nettogewinns.Erlange ein besseres Verständnis für deine Solo-Selbstständigkeit.Triff bessere Entscheidungen für dein Unternehmen.Steuern korrekt an das Finanzamt abführen.Korrekte Berechnung deines Nettogewinns.Ausgaben ohne Belege gelten nicht als Ausgaben. Dadurch erhöhen sich deine Mehrwertsteuer- und Einkommensteuerzahlungen.Erlange ein besseres Verständnis für deine Solo-Selbstständigkeit.Reduziere dein Risiko von Fehlern und Gebühren.Triff bessere Entscheidungen für dein Unternehmen.Live SupportBrauchst du Hilfe oder weitere Unterstützung? Lies unseren Helpdesk-Artikel zur Belegverwaltung oder schreibe uns!<img srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5dkJ5bqstJ993wu_Frame427322734.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=256&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5dkJ5bqstJ993wu_Frame427322734.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ5dkJ5bqstJ993wu_Frame427322734.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="rounded-full" loading="lazy"/>Hi! Unser Team von Kontist hilft dir bei allen Fragen weiter.Philipp von Kontist'
