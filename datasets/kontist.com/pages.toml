ntist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ4jMtpbqstJ99hOV_AccountswitchserviceMockupUK.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain;object-position:center" loading="lazy"/>No account yet? You can choose:Kontist Free€0*/ month plus VATKontist Free€0*/ month plus VATBusiness account with virtual Visa card. *For monthly transaction over €300. If you have less than €300 transaction volume (total incoming and outgoing transactions) you pay €2 / month.Apple Pay & Google PayOverdraftGet Kontist FreeKontist Premium€9/ month plus VATKontist Premium€9/ month plus VATCan be combined with bookkeeping toolsAutomatic tax reserves for income tax and VATApple Pay, Google Pay & receipt scanningPhysical & virtual Visa Business Debit cardGet Kontist PremiumKontist Bookkeeping€29/ month plus VATKontist Bookkeeping€29/ month plus VATBusiness bank account + integrated bookkeepingPremium banking includedAI-supported bookkeepingPhysical & virtual Visa Business Debit CardGet Kontist BookkeepingKontist Complete€79/ month plus VATKontist Complete€79/ month plus VATBusiness bank account + integrated bookkeeping + business tax returnsPremium banking includedBookkeeping & business tax returnsPhysical & virtual Visa Business Debit CardGet Kontist CompleteKontist Free€0*/ month plus VATBusiness account with virtual Visa card. *For monthly transaction over €300. If you have less than €300 transaction volume (total incoming and outgoing transactions) you pay €2 / month.Apple Pay & Google PayOverdraftGet Kontist FreeKontist Premium€9/ month plus VATCan be combined with bookkeeping toolsAutomatic tax reserves for income tax and VATApple Pay, Google Pay & receipt scanningPhysical & virtual Visa Business Debit cardGet Kontist PremiumKontist Bookkeeping€29/ month plus VATBusiness bank account + integrated bookkeepingPremium banking includedAI-supported bookkeepingPhysical & virtual Visa Business Debit CardGet Kontist BookkeepingKontist Complete€79/ month plus VATBusiness bank account + integrated bookkeeping + business tax returnsPremium banking includedBookkeeping & business tax returnsPhysical & virtual Visa Business Debit CardGet Kontist CompleteFAQ's? Gladly answered!What does Qwist GmbH have to do with the account switch service?We have joined forces with Qwist GmbH to make this service possible for you. Qwist GmbH handles the account switch service.How long does it take to switch accounts?The online application for the bank account switch only takes 10 minutes. After you have confirmed your request, we need 5-7 working days to notify all payment partners involved. Please note that some merchants or payment institutions may need more time to process your new bank details.How much does the account switch service cost?The account switch service is free of charge.How are direct debits and standing orders transferred?We will show you a list of your direct debits and you can choose which ones you want to transfer to Kontist and which ones you want to keep on your old account.Unfortunately, you currently have to delete standing orders in your old account yourself and set them up again with Kontist. But don't worry - Qwist will show you an overview so that you don't forget anything.I have had a Kontist account for a long time. Can I still use the account switch service?Yes, you can! Simply go directly to our account switch service page and transfer all your direct debits and standing orders to your Kontist account.I would like to use the account switch service for my former private bank account. Is this possible?You can use the switch service for a bank account previously used for private purposes. Please note that the Kontist account is purely a business account and may not be used for private purposes.Where can I find further information?We have summarized all the information for you briefly and concisely in our Help Center. Take a look right now!'''
