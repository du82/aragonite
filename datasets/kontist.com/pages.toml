full_description = 'Kontist BlogFor freelancers, entrepreneurs, small businesses and everyone else doing new work.Self-employmentDo freelancers and self-employed need to worry about GDPR?Last year, the topic of GDPR continued to become more and more important than ever for business owners, freelancers and the self-employed and of course - none more so than those in the digital space. In many ways, we are coming to understand GDPR and the European approach to privacy and data protection essentially turns every business and person into a data business or a data set. And yes, freelancers and the self-employed DO need to worry about that.1. März 2022<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc12850_Fraud.svg&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F00c388d4-2375-4f75-b815-57577bc1285