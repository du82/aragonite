description = "Erfahren Sie die Grundlagen der Umsatzsteuer, wie sie Selbstständige betrifft, und erhalten Sie wertvolle Tipps, um Ihren steuerlichen Pflichten effektiv nachzukommen."
full_description = 'Alles Wissenswerte zur Umsatzsteuer für SelbstständigeUmsatzsteuerregelungen für Selbstständige<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung20. März 2023💡 Das Wichtigste in KürzeDie Umsatzsteuer ist eine der wichtigsten Einnahmequellen des deutschen Staates. Alle Unternehmer, Selbständigen und Freelancer sind umsatzsteuerpflichtig, es sei denn sie fallen unter die sogenannte Kleinunternehmerregelung, die sie von der Umsatzsteuerpflicht entbindet.Jeder, der in Deutschland lebt, ist tagtäglich damit in der einen oder anderen Weise konfrontiert. Es geht um die Umsatzsteuer, die auf (fast) alle Produkte und Dienstleistungen erhoben wird, in der Regel in der Höhe von 19, und in Ausnahmefällen von 7 Prozent. Wenn du einkaufen gehst, passiert das ganz automatisch und die meisten achten wahrscheinlich nicht weiter darauf. Aber auf (fast) jedem Kassenbon ist die Mehrwertsteuer berechnet und ausgewiesen.Bist du als Selbständiger oder Freelancer tätig, hast ein eigenes Unternehmen musst du dich zwangsläufig ausführlicher mit diesem Thema auseinandersetzen, denn in Deutschland gibt es ganz klare Regeln, wie das mit der Umsatzsteuer zu funktionieren hat. Inhaltsverzeichnis1 - Für alle Steuerbegeisterten – zunächst ein kleiner, geschichtlicher Exkurs2 - Die heutige Umsatzsteuer im Detail3 - Die Umsatzsteuer gilt als:3.1 - Verkehrs- bzw. Verbrauchssteuer oder anders ausgedrückt: Auf was wird die Umsatzsteuer berechnet?3.2 - Gemeinschaftssteuer oder anders ausgedrückt: Wer erhält die Umsatzsteuer?3.3 - Indirekte Steuer oder anders ausgedrückt: Wer muss Umsatzsteuer bezahlen?4 - Für wen gilt die Umsatzsteuerpflicht?4.1 - Ausnahme5 - Wie läuft das mit der Umsatzsteuer nun genau?6 - Ein ganz simples Rechenbeispiel7 - Was ist die Umsatzsteuer-Identifikationsnummer (USt-ID) und wer benötigt sie?8 - Die Umsatz-SteuererklärungAlle Kriterien, die sich auf den Umgang mit der Umsatzsteuer beziehen, werden im Umsatzsteuergesetz (UStG) geregelt, zum Beispiel die Pflichten in Bezug auf die Rechnungsstellung, die Umsatzsteuervoranmeldung und die Umsatz-Steuererklärung sowie der Vorsteuerabzug. Auch in welchen Fällen wie viel Umsatzsteuer berechnet werden muss, das ist dort aufgelistet.Für alle Steuerbegeisterten – zunächst ein kleiner, geschichtlicher ExkursNicht ganz uninteressant für dich ist vielleicht, kurz in die Geschichte der Umsatzsteuer abzutauchen. Nach dem Ende des Ersten Weltkriegs hatte Deutschland hohe, durch den Krieg verursachte, Schulden. Um den maroden Staatshaushalt zu sanieren, wurde 1918 quasi die erste Umsatzsteuer eingeführt. Mit einem Satz von 0,5 % noch relativ gering, stieg sie bis zum Jahr 1951 auf 4 % an, wieder auf Grund eines Krieges.Damals war die Umsatzsteuer allerdings noch anders strukturiert, man bezeichnete sie als „Allphasen-Brutto-Umsatzsteuer“, das heißt es wurde wie heute auch jeder Warenverkauf in der Produktionskette besteuert, den Vorsteuerabzug gab es aber noch nicht.Das hatte einen bestimmten Effekt: Innerhalb einer Produktionskette sammelte sich immer mehr Steuer auf dem jeweiligen Produkt an. Ähnlich dem Zinseszins, denn Steuer wurde auf Steuer berechnet, und das umso mehr, je öfter beispielsweise ein Produkt in der Produktionskette weiter verkauft wurde. Also, Produkte mit einer längeren Produktionskette wurden dadurch überproportional besteuert. 1968 verabschiedete man sich von diesem Modell und führte die „Allphasen-Netto-Umsatzsteuer mit Vorsteuerabzug“ ein – entsprechend dem noch heute gültigen Modell. Der Steuersatz wurde mit 10 % festgelegt. Zusätzlich bemühte man sich, die Umsatzsteuer in der damaligen EG (heute EU) und damit den europäischen Handel zu vereinheitlichen.Dieses neue Modell beinhaltete: Auch weiterhin wird jeder Warenweiterverkauf in einer Produktionskette besteuert. Der Unterschied aber: Unternehmen können die Umsatzsteuer, die für sie beim Wareneinkauf anfällt, von der beim Warenverkauf eingenommenen Umsatzsteuer abziehen. Das bedeutet für dich als umsatzsteuerpflichtiger Selbständiger, dass du nur den Differenzbetrag ans Finanzamt zahlen musst bzw. zurückerstattet bekommst, je nachdem welcher Posten höher ist. Das ist der so genannte Vorsteuerabzug, durch den sich in einer Produktionskette keine Steuer mehr auf den Produkten anhäuft (wie im alten Modell). Das heißt, dass immer nur der Mehrwert versteuert werden muss. Daher kommt übrigens auch der Begriff Mehrwertsteuer. Dieses neue Modell der Umsatzsteuer brachte zwar mehr Aufwand mit sich, ist aber dafür wesentlich gerechter.Nochmal zusammengefasst & kurz erwähnt: Die Umsatzsteuer wird, gerade umgangssprachlich, häufig mit dem Begriff Mehrwertsteuer gleichgesetzt. Auch auf Belegen und Kassenbons ist sie als MwSt. ausgewiesen. Im Gesetz ist aber der Begriff Umsatzsteuer determiniert. Der Begriff Mehrwertsteuer wird – wie eben erwähnt - von der Art der Besteuerung abgeleitet, denn die Umsatzsteuer wird nach dem sogenannten „Mehrwertprinzip“ berechnet. Dieser Mehrwert ist der Wertzuwachs, den sich ein Unternehmen durch seine Leistung erschafft.Die heutige Umsatzsteuer im DetailDie Umsatzsteuer lässt sich verschiedenartig definieren - hier sind ein paar Unterscheidungskriterien aufgelistet.Die Umsatzsteuer gilt als:Verkehrs- bzw. Verbrauchssteuer oder anders ausgedrückt: Auf was wird die Umsatzsteuer berechnet?Die Umsatzsteuer wird auf den Warenverkehr und Dienstleitungen erhoben und trifft letztlich den Verbraucher.Gemeinschaftssteuer oder anders ausgedrückt: Wer erhält die Umsatzsteuer?Sie kommt dem Bund, Ländern und Gemeinden zu unterschiedlichen Teilen zu Gute und stellt eine große Einnahmequelle für den Staat dar.Indirekte Steuer oder anders ausgedrückt: Wer muss Umsatzsteuer bezahlen?Sie wird von Unternehmen auf die Konsumenten abgewälzt. Das heißt nichts anderes, als dass Unternehmen zwar auf die verkauften Waren und Dienstleitungen Umsatzsteuer ans Finanzamt abführen, der Endverbraucher aber jedoch für die Steuerlast aufkommen muss. Somit gilt die Umsatzsteuer eigentlich als Endverbrauchersteuer , da sich die Endverbraucher die Umsatzsteuer im Rahmen des Vorsteuerabzugs nicht vom Finanzamt zurückerstatten lassen können.Nochmal zusammengefasst:Unternehmen behalten von ihren Verkäufen rein den Nettopreis, die darauf anfallende Umsatzsteuer führen sie ans Finanzamt ab. Parallel machen Unternehmer die Umsatzsteuer beim Finanzamt geltend, die auf eingekaufte Waren oder Dienstleistungen anfällt (Vorsteuer). Deswegen ist die Umsatzsteuer für Unternehmen ein durchlaufender Posten, der sich Gewinn- bzw. Verlustneutral auswirkt.Für wen gilt die Umsatzsteuerpflicht?Umsatzsteuerpflicht – zugegeben ein etwas beängstigender Begriff. Leider kommt man als Unternehmer um diese Pflicht nicht herum und eigentlich ist es auch leicht erklärt bzw. ergibt es sich auch schon aus dem vorherigen Abschnitt: Die Umsatzsteuerpflicht gilt für alle Unternehmen. Für den Verkauf von Waren oder für Dienstleistungen müssen sie die Umsatzsteuer berechnen und diese auf der Rechnung ausweisen.AusnahmeDas ist die so genannte Kleinunternehmerregelung. Als Kleinunternehmer kannst du dich nach § 19 UStG von der Umsatzsteuerpflicht befreien lassen, bist dann also nicht mehr Umsatzsteuerpflichtig, wenn du im vergangenen Kalenderjahr weniger als 17.500 Euro und im aktuellen weniger als 50.000 Jahresumsatz erwirtschaftet hast. Das bedeutet, du musst keine Umsatzsteuer auf deinen Rechnungen ausweisen und daher logischerweise auch nichts an das Finanzamt abführen. Außerdem musst du keine Umsatzsteuervoranmeldungen für das Finanzamt tätigen, hast also weniger organisatorischen Arbeitsaufwand für dein Unternehmen. Als Nachteil könnte gesehen werden, dass du nicht Vorsteuerabzugsfähig bist, also nicht gegenrechnen kannst. Falls du mit deinem Unternehmen große Gewinnerwartungen innerhalb kurzer Zeit hast, solltest du dir das gut überlegen und eventuell mit einem Steuerberater sprechen. Nur am Rande sei hier noch erwähnt, dass spezielle Berufsgruppen wie zum Beispiel Ärzte generell von der Umsatzsteuer befreit sind.Zusammenfassung: Wie läuft das mit der Umsatzsteuer nun genau?Die Umsatzsteuer wird – von einigen Ausnahmen abgesehen - auf alle Waren / Produkte und Dienstleistungen fällig. Der Umsatzsteuersatz in Deutschland beträgt seit 2007 regulär 19 Prozent bzw. ermäßigt 7 Prozent. Zu diesen steuerermäßigten Waren und Dienstleistungen zählen zum Beispiel: Lebensmittel, Bücher, Zeitungsartikel, Kunstgegenstände, Theateraufführungen, Eintrittskarten für Museen, Zirkusvorstellungen, Hotelübernachtungen, Fahrten im öffentlichen Nahverkehr oder Taxifahrten. Zudem gibt es auch gänzlich umsatzsteuerfreie Produkte und Dienstleistungen. Dazu gehören unter anderem Porto oder die Dienstleistungen von Kleinunternehmern (siehe oben).Zu beachten ist:Diese Ausnahmeregelungen mit dem ermäßigtem Steuersatz von 7 Prozent sind sehr vielfältig und oft schwer zu fassen. In diesem Falle solltest du dich im Vorfeld schlau machen, ob für dich eine dieser Sonderregelungen gilt. Eine Auflistung aller Gegenstände, die dem ermäßigten Steuersatz zugerechnet werden, findest du zum Beispiel im Umsatzsteuergesetz oder du informierst dich beim Finanzamt.Ein listiges Detail:Beispielsweise beim Fast Food gelten doch tatsächlich zwei Steuersätze und zwar je nachdem, wo du es konsumierst: Verzehrst du einen Hamburger, einen Döner oder Pommes im Fastfood-Restaurant beträgt die Steuer 19 Prozent. Bestellst du deine Mahlzeit als „Take-away“ fallen nur 7 Prozent an.Ein ganz simples RechenbeispielDu hast beispielsweise einen kleinen Auftrag für einen deiner Kunden in der Höhe von 96 Euro Netto erledigt:96 Euro Netto zzgl. 19 % USt. = 18,24 = Gesamt-Rechnungsbetrag von 114,24 Euro (Brutto), die du deinem Kunden stellst.Du erhältst eine Rechnung von einem deiner Lieferanten bzw. du kaufst etwas für dein Business in der Höhe von 14,80 Euro Brutto:14,80 Brutto inklusive 19 % USt. = 2,36 Euro (Vorsteuer)Du müsstest dann an das Finanzamt bezahlen: 18,24 – 2,36 = 15,88 EuroWas ist die Umsatzsteuer-Identifikationsnummer (USt-ID) und wer benötigt sie?Der Bürokratie sei Dank – zusätzlich zur Steuernummer (bzw. Steuer-ID) gibt es nämlich noch die Umsatzsteuer-Identifikationsnummer (USt-ID). Dies ist eine eigenständige Nummer und sie wurde zur eindeutigen Kennzeichnung jedes Unternehmens in der EU eingeführt, das heißt sie ist für diejenigen relevant, die ihre Waren und/oder Dienstleistungen über die europäischen Landesgrenzen hinweg anbieten bzw. kaufen (grenzüberschreitender Handel). Diese Nummer ist für dich in diesem Fall zwingend erforderlich und auf deinen Rechnungen unbedingt immer anzugeben. Sie ermöglicht so die bessere Abwicklung von Geschäften zwischen den EU-Ländern. Du kannst sie schriftlich oder online beim Bundeszentralamt für Steuern (www.bzst.bund.de) beantragen. Hierfür gelten die gesetzlichen Bestimmungen des § 27a UStG. Für den Erhalt einer USt-ID musst du bei einem deutschen Finanzamt bereits umsatzsteuerlich geführt werden.Bist du als Selbständiger oder Unternehmer ausschließlich in Deutschland tätig, reicht die Angabe deiner „normalen“ Steuernummer, zum Beispiel bei der Rechnungsstellung.Die Umsatz-SteuererklärungDein zuständiges Finanzamt legt fest, wann du jeweils eine Umsatzsteuervoranmeldung abgeben musst (monatlich, quartalsweise oder nur einmal im Jahr). Diese Meldung beinhaltet eine Auflistung deiner Umsätze und der Vorleistungen, also deine gestellten Kunden- und deine bezahlten Lieferantenrechnungen. Die jeweils enthaltene Umsatzsteuer und die Vorsteuer werden dann miteinander verrechnet. Eine Differenz musst du ans Finanzamt abführen bzw. bekommst du vom Finanzamt zurückerstattet, je nachdem welcher Posten überwiegt.Zusätzlich zu den regelmäßigen Umsatzsteuervoranmeldungen musst du einmal im Jahr zusammen mit deiner Einkommenssteuererklärung eine Umsatzsteuererklärung machen. In dieser werden alle Umsatz- und Vorsteuerbeträge des betreffenden Geschäftsjahres abschließend aufsummiert. Da du ja durch die Voranmeldungen übers Jahr schon alles aufgelistet hast, kommt es dann nur noch zu eventuellen kleineren Korrekturen, zum Beispiel im Falle von Fehl- oder nachträglich korrigierten Buchungen. Das Ergebnis der Umsatzsteuerjahreserklärung ist auch die Grundlage dafür, wie oft du im kommenden Geschäftsjahr eine Umsatzsteuervoranmeldung abgeben musst: Ist dein individueller Umsatzsteuerbetrag im Vorjahr bei über 7.500 Euro gewesen, musst du künftig monatlich eine Voranmeldung machen. Liegt er zwischen 1.000 Euro und 7.500 Euro gilt eine quartalsweise, bei unter 1.000 Euro eine jährliche Abgabe der Umsatzsteuervoranmeldung (die dann eigentlich mit der Jahresabrechnung gleichzusetzen ist).ThemenübersichtSteuerwissen > Alles Wissenswerte zur Umsatzsteuer (hier bist du gerade)Umsatzsteuer-ID beantragenUmsatzsteuervoranmeldungVorsteuer berechnenUmsatzsteuererklärungZusammenfassende Meldung (ZM)Reverse-Charge-Verfahren'
