full_description = "Allgemeine Geschäfts­bedingungen für die Nutzung des Kontist ServicesWir, die Kontist GmbH, Boxhagener Straße 77-78, 10245 Berlin (im Folgenden „Kontist GmbH“, „Kontist“ und „wir“), haben einen Service entwickelt, der unter kontist.com und weiteren Domains (wie die Webseiten nachfolgend „Kontist Plattform“ genannt) sowie als mobile Applikation (nachfolgend „Kontist App“) heruntergeladen oder online genutzt werden kann (die Kontist App sowie die Kontist Plattform nachfolgend zusammen als „Kontist Service“ bezeichnet).Unser Angebot richtet sich ausschließlich an Unternehmer im Sinne des § 14 BGB.Der Kontist Service ermöglicht Geschäftskunden den Abruf, die Verwaltung und Aufbereitung von Finanzinformationen sowie die Durchführung von Transaktionen, insbesondere im Rahmen der sog. mobilen Kontoführung. Des Weiteren:KontoführungLastschriften (Ausgehend)ÜberweisungenLiquiditätsteuerung durch Kategorisierung von Einkommen und AusgabenBildung von SteuerrücklagenAnbindung an BuchhaltungssoftwareNutzung einer virtuellen und physischen Visa Business Debit KarteZur Nutzung des Kontist Services kann man durch Abschluss eines Vertrages über die Einrichtung und Nutzung eines Girokontos mit der Solaris SE (im nachfolgenden „Bank“) ein Geschäftskonto eröffnen, sowie von der Solaris SE eine Visa Business Debit-Karte beziehen. Wir werden Sie („Endnutzer“) rechtzeitig und in angemessener Form über die jeweiligen Einzelheiten der Leistungen des betreffenden Kontist Service beziehungsweise der betreffenden Bank, die Bedingungen der Inanspruchnahme deren Leistung sowie die ergänzenden vertraglichen Bedingungen informieren.Die genaue Leistungsbeschreibung der einzelnen Services ist auf der Webseite Kontist Terms abrufbar.1. Geltungsbereich1.1 Diese Nutzungsbedingungen gelten für Ihre Nutzung des Kontist Services mit sämtlichen Inhalten, Funktionen, Diensten und Regeln innerhalb des Vertragsverhältnisses zwischen Ihnen und uns. Allgemeine Geschäftsbedingungen von Ihnen werden nur dann Vertragsbestandteil sein, wenn wir dies ausdrücklich schriftlich miteinander vereinbart haben.1.2 Neben diesen Nutzungsbedingungen gelten die allgemeinen Geschäftsbedingungen der Drittanbieter (wie z.B. anderer Online- und Mobile-Banking-Dienstleister) und Kreditinstitute, über die Sie uns den Zugriff auf Ihre Daten gestatten sowie deren Nutzung für die Nutzung des Kontist Services erforderlich sind. Hierzu gehört insbesondere die der Solaris SE, bei der Sie zum Zwecke der Nutzung des Kontist Services ein Konto eröffnen, für die folgende Bedingungen gelten:Preis- und Leistungsverzeichnis KontistAllgemeine Geschäftsbedingungen Bookkeeping & CompleteAGB der Solaris SEAllgemeine Geschäftsbedingungen Solaris SEKundeninformationen zur Datenverarbeitung der Solaris SE Preis- und Leistungsverzeichnis Solaris SEAnlage: Preise für Sonderleistungen im Zusammenhang mit Kontist Solaris SEBedingungen für das Online-Banking Solaris SEBedingungen für geduldete Kontoüberziehungen Solaris SEBedingungen für den Überweisungsverkehr Solaris SEBedingungen für Zahlungen mittels Lastschrift im SEPA-Basislastschriftverfahren Solaris SEBedingungen für die Debitkarte Solaris SEBedingungen für Zahlungen über die virtuelle Debitkarten Solaris SESonderbedingungen für das 3D Secure-Verfahren Solaris SESonderbedingungen für Google PaySonderbedingungen für Apple Pay Solaris SEInformationen zur Einlagensicherung Solaris SEVorvertragliche Informationen bei im Fernabsatz geschlossenen Verträgen über Finanzdienstleistungen Solaris SEDispokredit-Bedingungen Solaris SE2. Vertragsgegenstand2.1 Gegenstand des Vertrages ist die Nutzung des Kontist Services.2.2 Mit dem Kontist Service können Sie ein Geschäftskonto bei der Solaris SE aufmachen und die Ausstellung einer Visa Business Debit Karte beantragen.2.3 Die Kontoinformationen werden verschlüsselt übermittelt.2.4 Wir verwenden für den Zugriff auf die Finanzinformationen Schnittstellen, die von der Deutschen Kreditwirtschaft bzw. den jeweiligen Zahlungsdiensten zur Verfügung gestellt werden sowie weitere geeignete, sichere Verfahren zum Abruf der Finanzinformationen.2.5 Wir sind stets um eine uneingeschränkte Nutz- und Verfügbarkeit des Kontist Services bemüht, können dafür jedoch keine Garantie übernehmen. Wir werden uns nach besten Kräften um eine Verfügbarkeit der Dienste von 97 % (Service-Level-Agreement, „SLA“) im Jahresmittel bemühen. Sie erkennen an, dass der Zugang zu den Diensten aus technischen (z. B. Störungen, Wartungen) oder außerhalb des Einflussbereichs liegenden (z. B. höhere Gewalt, Drittverschulden) Gründen zeitweilig beschränkt sein kann. Werden Wartungsarbeiten erforderlich und steht der Kontist Service deshalb nicht zur Verfügung, werden wir Sie hierüber nach Möglichkeit rechtzeitig informieren. Ausfälle des Kontist Services, die auf Wartungsarbeiten zurückzuführen sind, werden nicht auf die SLAs angerechnet.3. Registrierung für den Kontist Service und Eröffnung eines Girokontos3.1 Die Nutzung des Kontist Service setzt die Registrierung bei Kontist voraus. Der Vertragsschluss vollzieht sich wie folgt:3.1.1 Zunächst laden Sie von dem jeweiligen Anbieter mobiler Applikationen die Kontist App herunter. Kontist erfragt die in erforderlichen Aufschaltkriterien verifiziert die von Ihnen genannte E-Mail-Adresse, Mobil-Telefonnummer und fragt die Rechtsform ab.3.1.2 Nach Eingabe der Rechtsform vervollständigen Sie den Registrierungsprozess. Durch Klicken auf den „Weiter“-Button bei der Passwort Auswahl akzeptieren Sie sowohl die Allgemeinen Geschäftsbedingungen von Kontist als auch diejenigen der Bank (Solaris SE), bei der Sie zum Zwecke der Nutzung des Kontist Services ein Girokonto eröffnen, sowie möglicherweise die Ausstellung einer Business Debit Karte beantragen. 3.1.3 Mit der Registrierung übermittelt Kontist Ihnen einen personalisierten “Freunde werben Freunde” (FwF) Link, über welchen Sie Kontist weiterempfehlen können.3.1.4 Überprüfung der Identität natürlicher PersonenKontist leitet die Kunden, bei denen es sich um natürliche Personen handelt, im Namen der Bank zu den jeweils angebotenen Möglichkeiten der Identitätsüberprüfung. Die Identitätsüberprüfung wird im Auftrag der Bank ggf. durch einen externen Dienstleister durchgeführt. Die Bank bedient sich für die Überprüfung der Identität natürlicher Personen der Videoidentifikation durch IDnow.3.1.5 Überprüfung der Identität juristischer PersonenDie Überprüfung der Identität juristischer Personen kann entweder von der Bank selbst oder einem zuverlässigen Dritten anhand eines Handelsregisterauszuges sowie Ausweiskopien durchgeführt werden.3.2 Zudem erfordert die Nutzung des Kontist Services, dass Ihr Smartphone mit Ihrem Kontist Nutzerkonto verknüpft wird. Die Verknüpfung stellt einen starken Authentifizierungsgrad sicher, der benötigt wird, um den Kontist Service anbieten zu können. Die Authentifizierung durch den Kunden erfolgt durch ein Passwort/PIN für die App (Wissen), sowie durch das Smartphone (Besitz). Die initiale Verknüpfung vollzieht sich wie folgt: Zunächst wird die App auf dem Smartphone installiert. Sie kreieren wie oben beschrieben ein Kontist Nutzerkonto. Sodann wird ein Einmal-Code per SMS an die von Ihnen angegebene Telefonnummer gesendet. Sie geben diesen Einmal-Code in die dafür vorgesehene Maske der App ein. Durch das Eintippen des Codes wird das Smartphone mit dem Konto verknüpft.3.3 GirokontoDie Nutzung des Kontist Service setzt den Abschluss eines Vertrages über die Einrichtung und Nutzung eines Girokontos mit der Bank voraus. Durch den Girovertrag verpflichtet sich die Bank, für den Kunden ein Konto einzurichten, eingehende Zahlungen dem Konto gutzuschreiben und abgeschlossene Überweisungsaufträge zu Lasten dieses Kontos abzuwickeln. Das Girokonto wird als Kontokorrent-Konto von der Bank geführt. Der Vertragsschluss zur Kontoeröffnung vollzieht sich wie folgt:3.3.1 Wir erheben die folgenden Daten im Kontoantrags-Prozess:RechtsformGeburtsort, Datum, StaatsangehörigkeitAdresseMobilnummerInformationen zu FATCA/CRSInformationen zum wirtschaftlichen Zweck des KontosNatürliche Personen werden daraufhin aufgefordert die Videoidentifizierung durchzuführen. Bei erfolgreicher Identifikation kann der Kunde durch Klicken auf „Konto eröffnen“ den Kontoantrag abschließen.Juristische Personen werden daraufhin aufgefordert Ausweisdokumente abzufotographieren. Bei erfolgreicher Identifikation kann der Kunde durch Klicken auf „Konto eröffnen“ den Kontoantrag abschließen.3.3.2 Die Bank eröffnet das Girokonto oder verweigert dies, sollten Sie der Erfüllung der Sorgfaltspflichten nach § 3 Abs. 1 Nr. 1 bis 3 GwG nicht ausreichend nachkommen und informiert Kontist entsprechend. Dieser Vorgang kann einige Stunden in Anspruch nehmen.4. KostenKontist bietet seine Leistungen in verschieden kostenlosen und kostenpflichtigen Varianten an. Die Höhe der zu leistenden Entgelte für die Dienstleistungen des Kontist Services ergibt sich aus dem aktuellen Preis- und Leistungsverzeichnis.Die genannten Entgelte sind zuzüglich der gesetzlichen Umsatzsteuer geschuldet.5. Nutzung des Kontist Services, Kommunikation, Änderung von Informationen5.1 Die Kommunikation mit Ihnen erfolgt grundsätzlich über die Kontist App (insbesondere in Bezug auf die Bereitstellung von Kontoauszügen), per E-Mail und die Kontist Plattform, sowie unseren Kundensupport.5.2 Sie haben die Möglichkeit, folgende Informationen in Ihrem Nutzerkonto eigenhändig zu verändern:E-MailMobilnummerMeldeanschrift5.3 Bei einer Änderung der E-Mail-Adresse oder der Mobilnummer werden diese erneut durch Kontist verifiziert.5.4 Für alle anderen Änderungen bitten wir Sie, sich beim Kundensupport von Kontist zu melden, z.B. bei Namensänderung (nach Hochzeit).5.5 Die Kontonutzung richtet sich nach den Allgemeinen Geschäftsbedingungen der Bank sowie der dazugehörigen Leistungsbeschreibung der Bank.5.6 Die Kartennutzung richtet sich nach den Allgemeinen Geschäftsbedingungen der Bank.5.7 Die Kündigung und die Kontoschließung sind grundsätzlich an Kontist zu richten. Kontist wird die Bank entsprechend informieren. Haben Sie bereits ein Referenzkonto hinterlegt, so wird ein vorhandenes Guthaben auf dieses überwiesen. Ansonsten werden wir Sie bitten, uns zu diesem Zweck ein Referenzkonto mitzuteilen.6. Datenschutz und DatenabrufInformationen zum Datenschutz und Datenabruf finden Sie in unserer Datenschutzerklärung.7. Pflichten des Nutzers7.1 Sie sind selbst für die Geheimhaltung und Sicherheit Ihrer Zugangsdaten zum Kontist Service verantwortlich. Das bedeutet, dass Sie Ihre Zugangsdaten für den Zugang zum Kontist Service geheim halten müssen, nicht weitergeben dürfen, keine Kenntnisnahme durch Dritte dulden oder ermöglichen sowie die erforderlichen Maßnahmen zur Gewährleistung der Vertraulichkeit ergreifen, z. B. indem Sie ein sicheres Passwort aus Zahlen, Buchstaben und Sonderzeichen verwenden und Ihr Passwort regelmäßig ändern.7.2 Sie sorgen dafür, dass die von Ihnen angegebene E-Mail-Adresse ab dem Zeitpunkt der Registrierung erreichbar und ein Empfang von E-Mails nicht unmöglich ist, z. B. aufgrund von Weiterleitung, Stilllegung oder Überfüllung des E-Mail-Kontos.7.3 Bei einem Missbrauch Ihres Nutzerkontos, einem entsprechenden Verdacht oder bei Verlust Ihrer Zugangsdaten sind Sie verpflichtet, uns dies per E-Mail unverzüglich anzuzeigen.7.4 Sie werden die entsprechenden Vorkehrungen treffen, die von Ihnen im Rahmen der Nutzung des Kontist Service eingegebenen, hochgeladenen und gespeicherten Daten und Inhalte regelmäßig und gefahrentsprechend zu sichern sowie eigene Sicherungskopien zu erstellen, um bei Verlust der Daten und Informationen die Rekonstruktion derselben zu gewährleisten.7.5 Bei der Nutzung des Kontist Service müssen Sie alle anwendbaren Gesetze und sonstigen Rechtsvorschriften der Bundesrepublik Deutschland beachten.7.6 Es ist verboten, Angriffe auf die Funktionsfähigkeit des Kontist Service vorzunehmen, wie bspw. das massenhafte Versenden von E-Mails (SPAM), Hacking-Versuche, Brute-Force-Attacken, der Einsatz oder das Versenden von Spionagesoftware, Viren und Würmern.7.7 Sofern Sie gegen diese Regeln in Ziffer 7.5 und 7.6 verstoßen, sind wir berechtigt, Sie zu verwarnen, temporär zu sperren oder ggf. sogar vollständig von der Nutzung des Kontist Service auszuschließen.7.8 Sie verpflichten sich genügend Guthaben auf dem Konto zu haben, um alle Forderungen gegenüber Kontist zu begleichen. Die Forderungen werden per Lastschriftverfahren von Ihrem Konto abgebucht. Sollte Ihnen ein Überziehungskredit durch die Bank eingeräumt worden sein, gelten die entsprechenden Vertragsbedingungen der Bank für den Überziehungskredit. Sollten Sie Forderungen gegenüber Kontist nicht ausgleichen können, behält sich Kontist die vorübergehende Sperrung des Kontos, sowie weitere rechtliche Schritte vor. 8. Haftungsfreistellung8.1 Sie stellen uns von sämtlichen Ansprüchen, einschließlich Schadensersatzansprüchen, frei, die andere Nutzer oder sonstige Dritte, einschließlich Behörden, gegen uns wegen der Verletzung ihrer Rechte durch die Nutzung des Kontist Service durch Sie geltend machen. Sie übernehmen alle angemessenen Kosten, einschließlich der für die Rechtsverteidigung entstehenden angemessenen Kosten, die uns aufgrund einer Verletzung von Rechten Dritter durch Sie entstehen. Alle weitergehenden Rechte sowie Schadensersatzansprüche von uns bleiben unberührt. Sie haben das Recht nachzuweisen, dass uns tatsächlich geringere Kosten entstanden sind.8.2 Kontist haftet nicht für den Missbrauch von Inhalten, die aus der Kontist App in die Zwischenablage kopiert wurden.8.3 Die vorstehenden Pflichten gelten nur dann, soweit Sie die betreffende Rechtsverletzung zu vertreten haben. Das heißt, wenn Sie wissentlich oder willentlich oder die im Verkehr erforderliche Sorgfalt außer Acht gelassen haben.9. Laufzeit und Beendigung des Vertrages9.1 Der Vertrag über die Nutzung des Kontist Service wird auf unbestimmte Zeit geschlossen.9.2 Sie können den Vertrag