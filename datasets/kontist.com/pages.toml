full_description = 'Arbeitszimmer richtig absetzen & Homeoffice-PauschaleSteuern sparen für Selbstständige<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung11. Nov. 2022blog.last_updated_placeholder 27. Jan. 2023💡 Das Wichtigste in Kürze:Wenn du über ein Arbeitszimmer verfügst, dann kannst du die Kosten dafür von der Steuer absetzen. Stellt der Raum den Mittelpunkt deiner Tätigkeit dar, sind deine Ausgaben vollständig abziehbar. Falls nicht, besteht eine Höchstgrenze von 1.250 € pro Jahr.Arbeitest du ohne eigenes Arbeitszimmer von zuhause, kannst du die Homeoffice-Pauschale anwenden. Darüber kannst du maximal 600 € jährlich abziehen.Möchtest du die tatsächlichen Kosten für dein Arbeitszimmer absetzen, benötigst du dafür Nachweise. Für die Pauschale genügt eine Dokumentation deiner Homeoffice-Tage.Thema im Detail:1 - Was ist ein Arbeitszimmer und was dürfen Selbstständige absetzen?1.1 - Mittelpunkt der beruflichen Tätigkeit1.2 - Häusliche Betriebsstätte für Selbstständige2 - Werbungskosten oder Betriebsausgaben: Wie wird das Arbeitszimmer steuerlich behandelt?3 - Welche Raum- und Ausstattungskosten werden anerkannt?4 - Brauche ich Nachweise, um mein Arbeitszimmer als Selbstständiger abzusetzen?5 - Homeoffice und Arbeitszimmer während der Corona-Krise: Welche steuerlichen Regelungen gelten?6 - Gilt die Homeoffice-Pauschale für Selbstständige und Freiberufler?7 - Wie hoch ist die Homeoffice-Pauschale bei selbstständiger Tätigkeit?8 - Können auch nebenberuflich Selbstständige die Homeoffice-Pauschale in Anspruch nehmen?Was ist ein Arbeitszimmer und was dürfen Selbstständige absetzen?Bist du selbstständig und arbeitest von Zuhause? Oder erledigst du zumindest einen Teil deiner beruflichen Tätigkeit in deiner Wohnung? Dann weißt du bestimmt, dass du für dein häusliches Arbeitszimmer als Freiberufler oder Freiberuflerin in bestimmten Fällen Kosten von der Steuer absetzen kannst. Dabei handelt es sich um Betriebsausgaben – das sind solche Ausgaben, die deinen Unternehmensgewinn mindern. Dadurch wiederum sparst du Steuern. Im Folgenden erklären wir dir, wie das funktioniert.Starten wir direkt einmal mit der Grundsatzfrage: Was ist überhaupt ein häusliches Arbeitszimmer? Zählt dazu schon die Arbeitsecke im Schlafzimmer? Oder der zum Büro umfunktionierte Küchentisch? Ob dein Arbeitsplatz wirklich vom Finanzamt als häusliches Arbeitszimmer anerkannt wird, hängt von folgenden Faktoren ab:Einbindung in die häusliche SphäreDein häusliches Arbeitszimmer gehört – wie es der Name schon sagt – zu deinem Wohnraum. Es handelt sich dabei um einen separaten Raum in deiner Wohnung, der über eine eigene Tür verfügt. Wenn du zum Beispiel nur eine Ecke deines Wohnzimmers als Arbeitsplatz nutzt, gilt dies nicht als Arbeitszimmer. Du kannst dann auch keine Kosten dafür absetzen (hier kommt die Homeoffice-Pauschale ins Spiel – mehr dazu unten!). Wo sich der Raum befindet, ist hingegen nicht relevant. Du kannst dein Arbeitszimmer als Selbstständiger oder Selbstständige auch im Keller oder im Dachboden einrichten. Entscheidend ist nur, dass diese an deine Wohnung angebunden sind.Funktion und Art der NutzungNutzt du als Freiberuflerin oder Freiberufler ein Arbeitszimmer, muss aus dessen Einrichtung klar die berufliche Nutzung hervorgehen. Es sollte also büromäßig ausgestattet sein oder – zum Beispiel bei einem künstlerischen Beruf – deine Arbeitsmaterialien enthalten. Haushaltsgegenstände, Kinderspielzeug und Fernseher solltest du aus deinem Arbeitszimmer entfernen! Umfang der NutzungEntscheidend für die Anerkennung als Arbeitszimmer ist, dass du dieses auch wirklich für die Arbeit nutzt. Nur bis zu 10 % private Nutzung lässt das Finanzamt als Spielraum zu.<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenMittelpunkt der beruflichen TätigkeitErfüllt dein Arbeitszimmer als Freiberufler oder Freiberuflerin all diese Voraussetzungen? Dann kannst du deine Kosten für den Raum von der Steuer absetzen.Wie viel du für dein häusliches Arbeitszimmer als Selbstständiger oder Selbstständige aber tatsächlich ansetzen kannst, hängt von einem weiteren Faktor ab. Relevant ist es nämlich für das Finanzamt, ob dieses den Mittelpunkt deiner beruflichen Tätigkeit darstellt. Konkret bedeutet das, dass du dort die Aufgaben erledigst, die für deinen Beruf entscheidend sind. Wenn das der Fall ist, dann kannst du alle entstandenen Kosten geltend machen. Wenn nicht, dann gibt es eine Grenze von 1.250 € pro Jahr. Dies gilt auch nur dann, wenn dir kein anderer Arbeitsplatz gestellt wird.Wie viel Zeit du in deinem Arbeitszimmer verbringst, ist in diesem Zusammenhang nicht entscheidend. Es geht wirklich nur darum, ob du deine Haupttätigkeit dort ausführst. Die dortige Arbeitszeit kann aber natürlich ein Indiz dafür sein. Verbringst du nur eine halbe Stunde am Tag in deinem Arbeitszimmer, handelt es sich wahrscheinlich nicht um deinen Tätigkeitsmittelpunkt.Beispiele: Bist du als Autorin oder Autor selbstständig und schreibst in deinem häuslichen Arbeitszimmer, dann kannst du alle deine Kosten steuerlich absetzen.Bist du allerdings Lehrerin oder Lehrer, dann befindet sich der Mittelpunkt deiner Tätigkeit nicht in deinem Arbeitszimmer, sondern im Klassenraum. Wird dir von deinem Arbeitgeber kein Arbeitsplatz zur Verfügung gestellt (zum Beispiel für die Unterrichtsvor- und -nachbereitung), kannst du bis zu 1.250 € absetzen. Tipp:Wenn mehrere Personen aus demselben Haushalt das Arbeitszimmer nutzen, dann gilt die Höchstgrenze von 1.250 € pro Person. Nutzen du und dein Partner oder deine Partnerin also dasselbe Zimmer, könnt ihr gemeinsam maximal 2.500 € absetzen.Häusliche Betriebsstätte für SelbstständigeUnter Umständen handelt es sich bei deinem Arbeitszimmer sogar um eine häusliche Betriebsstätte. Sollte das der Fall sein, dann kannst du alle Kosten dafür vollständig von der Steuer absetzen. Das gilt auch dann, wenn es nicht den Mittelpunkt deiner Tätigkeit darstellt. Voraussetzung dafür ist, dass der Raum über einen separaten Eingang verfügt. Für die Einstufung als Betriebsstätte spricht es ebenfalls, wenn dort reger Publikumsverkehr herrscht. Du empfängst dort also regelmäßig Kund*innen oder Geschäftspartner*innen. Auch die Beschäftigung von familienfremden Angestellten in dem Raum unterstützt den Charakter einer Betriebsstätte.Werbungskosten oder Betriebsausgaben: Wie wird das Arbeitszimmer steuerlich behandelt?Ob du die Ausgaben für deinen häuslichen Arbeitsplatz als Werbungskosten oder Betriebsausgaben geltend machst, hängt von deiner Anstellungsart ab. Hast du ein häusliches Arbeitszimmer als Freiberufler oder Selbstständiger, dann handelt es sich um Betriebsausgaben. Angestellte mit Arbeitszimmer setzen die Kosten als Werbungskosten ab. Im Prinzip läuft es aber auf dasselbe hinaus: Die Kosten mindern dein Einkommen beziehungsweise deinen Betriebsgewinn. Auf diese Weise musst du weniger Steuern zahlen. Welche Raum- und Ausstattungskosten werden anerkannt?Möchtest du als Selbstständige oder Selbstständiger dein Arbeitszimmer absetzen, dann kannst du dabei eine ganze Reihe an Kosten berücksichtigen. Folgende gehören dazu:Anteilige Miete & Nebenkosten: Du berechnest die anteilige Miete und Nebenkosten (inklusive Strom, Gas und Heizung) ganz einfach auf Basis der Größe deines Arbeitszimmers. Beispiel: Deine Wohnung ist 50 m² groß und du bezahlst 500 € Miete inklusive Nebenkosten. Dein Arbeitszimmer hat eine Größe von 10 m². Das entspricht 20 % deiner Wohnungsgröße. Damit kannst du auch 20 % deiner Miete und Nebenkosten ansetzen: also 100 €. Einrichtung:Bist du selbstständig mit Büro im eigenen Haus oder der eigenen Wohnung, darfst du dessen Einrichtung steuerlich absetzen. Dazu gehören Möbel wie dein Schreibtisch, der Bürostuhl, Regale und Schränke, aber auch Teppiche, Vorhänge etc.Unter anderem kannst du auch folgende Kosten anteilig geltend machen:ReinigungskostenHausratversicherungUmzugskostenFinanzierungskosten, wenn sich dein Arbeitszimmer in deiner Eigentumswohnung befindetAchtung:Teure Kunstgegenstände, die du für die Dekoration deines Arbeitszimmers kaufst, kannst du nicht als Betriebsausgabe geltend machen. Brauche ich Nachweise, um mein Arbeitszimmer als Selbstständiger abzusetzen?Du musst mit deiner Steuererklärung keine Nachweise mehr einreichen. Wenn du deine tatsächlichen Kosten als Betriebsausgaben absetzen möchtest, kann das Finanzamt aber Nachweise von dir einfordern. Deshalb solltest du alle relevanten Belege aufbewahren. Dazu gehören zum Beispiel:eine Skizze deiner Wohnung mit Flächenangabeneine Skizze deines Arbeitszimmers mit Einrichtungsgegenständendein Mietvertragdeine NebenkostenabrechnungenBelege für die Anschaffung von EinrichtungsgegenständenRechnungen für Renovierungsarbeiten, Reinigung etc. Nachweis über Versicherungen Bei einer Eigentumswohnung können noch Nachweise für Anschaffungskosten, Finanzierungskosten, Instandhaltungskosten, Grundsteuer etc. notwendig sein.Homeoffice und Arbeitszimmer während der Corona-Krise: Welche steuerlichen Regelungen gelten?Das Homeoffice hat während der Coronapandemie einen regelrechten Boom erfahren. Darauf hat auch der Gesetzgeber reagiert und zum 1. Januar 2020 die sogenannte Homeoffice-Pauschale eingeführt. Davon profitierst du auch dann, wenn du kein eigenes Arbeitszimmer hast. Um die Pauschale ansetzen zu können, musst du lediglich an dem betreffenden Tag von zuhause aus gearbeitet haben. Wenn du die Homeoffice-Pauschale abziehst, kannst du nicht mehr deine tatsächlichen Ausgaben für dein häusliches Arbeitszimmer geltend machen – und vice versa. Für die Pauschale spricht, dass sie besonders einfach anzuwenden ist. Wenn du deine tatsächlichen Kosten berechnest, kannst du jedoch unter Umständen mehr Steuern sparen. Das ist dann der Fall, wenn diese höher ausfallen als die Pauschale. Endgültig entscheiden musst du dich übrigens nicht. Du kannst in jedem Jahr neu wählen, ob du die Pauschale oder die tatsächlichen Betriebsausgaben abziehen möchtest. Gilt die Homeoffice-Pauschale für Selbstständige und Freiberufler?Die Homeoffice-Pauschale kannst du als Selbstständige*r oder Freiberufler*in genauso in Anspruch nehmen wie als Arbeitnehmer*in. Bist du selbstständig tätig, solltest du dokumentieren, welche Tage du im Homeoffice gearbeitet hast. Wie hoch ist die Homeoffice-Pauschale bei selbstständiger Tätigkeit?Die Homeoffice-Pauschale für Selbstständige ist identisch mit der für Arbeitnehmer*innen. Du kannst seit 2020 für jeden Tag, an dem du von zuhause arbeitest, 5 € als Betriebsausgaben geltend machen. Das gilt auch, wenn du an Wochenenden arbeitest. Allerdings ist die Pauschale für das Jahr 2022 auf 600 € gedeckelt. Das bedeutet, dass du maximal 120 Tage pro Jahr ansetzen kannst. Info:Die Homeoffice-Pauschale für Selbstständige und Arbeitnehmer*innen war zunächst nur für die Jahre 2020 und 2021 geplant. Voraussichtlich soll sie nun aber entfristet werden. Ab 2023 erhöhen sich die ansetzbaren Kosten auf 6 € pro Tag zu maximal 210 Tagen - somit sind höchstens 1.260 € absetzbar.Können auch nebenberuflich Selbstständige die Homeoffice-Pauschale in Anspruch nehmen?Prinzipiell kannst du auch als nebenberuflich Selbstständiger oder Selbstständige die Homeoffice-Pauschale in Anspruch nehmen. Voraussetzung dafür ist lediglich, dass du an dem entsprechenden Tag nur von zuhause aus gearbeitet hast. Wenn du zum Beispiel am Vormittag zuhause deiner selbstständigen Tätigkeit nachgehst und am Nachmittag zu deinem Arbeitgeber oder deiner Arbeitgeberin ins Büro fährst, kannst du die Pauschale für diesen Tag nicht ansetzen. ThemenübersichtSteuerwissen > Steuern sparen: Was können Selbstständige von der Steuer absetzen?Betriebsausgaben absetzenReisekosten absetzen & VerpflegungsmehraufwandFahrtkosten absetzen & KilometerpauschaleArbeitszimmer absetzen & Homeoffice Pauschale (hier bist du gerade)Außergewöhnliche Belastungen absetzenSonderausgaben absetzenSteuerfreibeträge & Pauschalen'
