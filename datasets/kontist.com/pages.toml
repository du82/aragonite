title = "Rechnungsvorlage - Rechnungen als Freelancer korrekt schreiben | Kontist"
description = "Das Schreiben von Rechnungen gehört zum Alltag von Selbstständigen. Erfahren Sie hier, was in einer korrekten Rechnung enthalten sein muss und was Sie dabei beachten sollten."
full_description = 'Rechnungen als Selbstständiger richtig schreiben - eine RechnungsvorlageSteuerbasis für den Start in die Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung24. Feb. 2023💡 Das musst du wissen:Rechnungen gehören zu den wichtigsten Belegen in der Welt der Buchführung. Sie müssen nach klar definierten Anforderungen erstellt werden und zehn Jahre lang aufbewahrt werden (nach der gesetzlichen Aufbewahrungsfrist für geschäftliche Dokumente). Die Rechnung muss spätestens 6 Monate nach der erbrachten Leistung ausgestellt werden, um gültig zu sein. Es spielt auch keine Rolle, ob der Empfänger eine Privatperson oder ein Unternehmen ist. Mit Rechnungen erhältst du nicht nur deine Honorare, sondern belegst auch deine Einnahmen gegenüber dem Finanzamt. Um Fehler und mögliche unangenehme Situationen mit deinen Kunden zu vermeiden, ist es am besten, eine Mustervorlage für die Rechnung zu benutzen. Wenn du eine fehlerfreie Rechnungsvorlage hast, wirst du viel Zeit sparen und kannst sicher sein, dass keine Fehler in der Rechnung bezüglich der Anforderungen zu finden sind.Das Thema im Detail:1 - Pflichtangaben1.1 - Der Name und die Anschrift1.2 - Steuernummer oder Umsatzsteuer-Identifikationsnummer1.3 - Datum, an dem die Rechnung ausgestellt ist1.4 - Eine fortlaufende Rechnungsnummer1.5 - Menge, Art und Umfang der Lieferung oder Leistung1.6 - Der Zeitpunkt der Lieferung und der Zahlung1.7 - Steuersatz, Steuerbetrag und Entgelt1.8 - Entgeltminderungen, die im Voraus vereinbart sindVIDEO: Rechnung schreiben in der Kontist-App2 - Aufbewahrungsfrist3 - KleinunternehmerAls Freiberufler schreibst du jeden Monat Rechnungen an deine Kunden. Du stellst deine erbrachten Dienstleistungen oder deine verkauften Waren in Rechnung. Denn nur so kannst du auch Einnahmen erzielen. Von daher stellt die Rechnung ein wichtiges Dokument für dich dar und bedeutet für dich den Zugang zu Einkommen. Aus diesem Grund ist es gut, eine Rechnungsvorlage zu haben.Wir erklären dir im Folgenden, was die Bestandteile einer rechtsgültigen Rechnung sind und was du genau beachten musst.Sollte ein Vertrag bereits alle Angaben enthalten, die eine Rechnung beinhalten muss, kann er auch schon als Rechnung angesehen werden. Es ist nicht notwendig, dass das Wort „Rechnung“ im Dokument explizit genannt ist, um als Rechnung zu gelten. Die Rechnung muss nicht ein einziges Dokument sein, sondern kann auch aus mehreren Dokumenten bestehen. Es ist nur wichtig, dass in wenigstens einem Dokument das gesamte Entgelt und die Umsatzsteuer dafür klar und deutlich ausgewiesen sind.Meistens werden Rechnungen auf Papier gebracht, aber sie können auch per Fax oder per E-Mail verschickt werden. Wichtig zu beachten ist, dass der Empfänger dem elektronischen Versand der Rechnung zuerst zustimmen muss. Diese Zustimmung hat keine besonderen Anforderungen. Es ist genügend, ein allgemeines Einverständnis mit dem Rechnungsempfänger zu haben. Wenn der Rechnungsempfänger keinen Widerspruch erklärt, kannst du davon ausgehen, dass er nichts dagegen hat, die Rechnungen elektronisch zu erhalten.Pflichtangaben - diese Anforderungen muss die Rechnung erfüllenAls Freiberufler bist du dazu verpflichtet, eine Rechnung für deine Leistungen zu erstellen. Wenn du das nicht machst, kann dein Kunde vor Gericht gehen und sein Recht auf eine Rechnung durchsetzen. Die Rechnung muss bestimmte Pflichtangaben beinhalten, sonst ist sie nicht rechtsgültig. Es kann passieren, dass der Kunde bei einer fehlerhaften Rechnung das Geld nicht zahlt oder die Zahlung verzögert. Aus diesem Grund solltest du immer darauf achten, deine Rechnungen fehlerfrei zu verschicken. Es lohnt sich, die Zeit dafür zu nehmen und am Besten zu Beginn der Selbstständigkeit eine entsprechende Rechnungsvorlage zu erstellen. Mit einer Vorlage kannst du sicher sein, dass du alle wichtigen Angaben auf der Rechnung hast.Folgende Angaben müssen auf allen Rechnungen zu finden sein:Der Name und die AnschriftUm eine gültige Rechnung zu schreiben, müssen die vollständige Namen und Anschriften beider Vertragspartner genannt sein. Jedoch gibt es Ausnahmen, z.B. wenn der Betrag der Rechnung nicht höher als 250 Euro ist. Solch eine Rechnung wird auch als "Kleinbetragsrechnung" bezeichnet. Eine weitere Ausnahme stellen Fahrausweisen dar. In diesen Fällen musst du die Anschrift des Leistungsempfängers nicht in die Rechnung schreiben. Es gibt auch einen speziellen Fall, wenn dein Vertragspartner im Ausland ist. Da manche Unternehmen Postfächer oder Großkundenanschriften haben, solltest du die Adresse in diesem Fall gründlich prüfen. Am besten ist es, um eine Bestätigung der Anschrift für die Rechnung zu bitten.Steuernummer oder Umsatzsteuer-IdentifikationsnummerDie Rechnung ist nicht gültig, wenn sie deine Steuernummer oder Umsatzsteuer-Identifikationsnummer nicht enthält. Es wird empfohlen, falls verfügbar, immer deine Umsatzsteuer-Identifikationsnummer zu verwenden und zusätzlich die des Vertragspartners. Auf diese Weise riskierst du deinen Steuervorteil nicht und bist immer auf der sicheren Seite. Es gibt auch manche Fälle, bei denen es Pflicht ist, beide USt-ID-Nr., von dir und deinem Vertragspartner, in die Rechnung zu schreiben. Dazu gehören zum Beispiel Dauerverträge (Mietverträge), Agenturgeschäfte und vor allem, wenn dein Auftraggeber aus dem EU-Ausland kommt.Datum, an dem die Rechnung ausgestellt istDas Ausstellungsdatum ist bei jeder Rechnung unverzichtbar.Eine fortlaufende RechnungsnummerJede Rechnung, dessen Betrag mehr als 250,00 Euro ist, muss eine fortlaufende Rechnungsnummer haben. Diese Nummer kannst du nach deinem Wunsch gestalten. Es ist nur wichtig, dass die Nummer fortlaufend und einzigartig ist. Die Rechnungsnummer kannst du durch die Kombination von Nummern und Buchstaben gestalten, zum Beispiel 1702-15-De, aber auch mit Nummernkreisen. Bei Nummernkreisen ist es nur wichtig, Lücken zu vermeiden (zum Beispiel 26, 27, 28,…). Ein weiterer Tipp für Nummernkreise ist es, Buchstaben anstatt von Ziffern zu benutzen, zum Beispiel „B 0825 – N – 0156 – 15“ („B“ steht für Bayern, „N“ für Nürnberg, „0156“ ist die fortlaufende Rechnungsnummer und „23“ ist das Jahr 2023).Menge, Art und Umfang der Lieferung oder LeistungAuf der Rechnung müssen die Leistungen oder Waren ganz genau bezeichnet werden. Es ist erlaubt, Sammelbezeichnungen zu verwenden, wie z. B. Spirituosen, Büromöbel, Beschläge, usw. Allerdings reichen allgemeine Bezeichnungen, wie z. B. Geschenkartikel nicht aus. Wenn du Leistungen auf die Rechnung stellst, musst du sie gut beschreiben, sodass sie eindeutig zugeordnet werden können.Der Zeitpunkt der Lieferung und der ZahlungMeistens ist die Angabe des Monats, indem die Lieferung oder Zahlung erfolgen soll, ausreichend. Falls das genaue Datum noch nicht festgelegt ist, musst du eine Schätzung des Termins angeben.Steuersatz, Steuerbetrag und EntgeltJede Leistung muss einzeln auf der Rechnung stehen. Dies ist vor allem wichtig bei Umsätzen, die verschiedenen Steuersätzen unterliegen. Es muss immer deutlich sein, mit welchem Steuersatz du deine Leistung erbracht hast, also 19 %, 7 % oder 0 %. Auf der Rechnung sollten immer der Netto- und der Bruttobetrag angeführt sein. Wenn der Kunde die Rechnung sieht, sollte er sofort erkennen können, welchen Betrag er zahlen muss.Entgeltminderungen, die im Voraus vereinbart sindDazu gehören Skonti, Boni oder Rabatte. Diesen Betrag kannst du prozentual angeben, aber auch als Netto- und Bruttowert. Ein Beispiel ist „2 % Skonto auf die Zahlung bis...“.VIDEO: Rechnung schreiben in der Kontist-AppAufbewahrungsfristJede Rechnung, die du erhältst oder schreibst, musst du zehn Jahre lang aufbewahren.KleinunternehmerWenn du ein Kleinunternehmer bist, dann darfst bzw. musst du nach der Kleinunternehmerregelung keine Umsatzsteuer in deinen Rechnungen ausstellen. Diese Kleinunternehmerregelung bietet dir Vorteile wie zum Beispiel:Der steuerliche Verwaltungsaufwand wird deutlich vereinfacht. Da du auf deinen Rechnungen keine Umsatzsteuer ausweisen musst, musst du auch keine Umsatzsteuervoranmeldungen abgeben. Das spart dir viel Zeit.Ohne die Umsatzsteuer kannst du deine Dienstleistungen oder Produkte an Privatkunden viel günstiger anbieten, sodass du im Vergleich zu größeren Unternehmen im Vorteil bist. Auf der anderen Seite hast du so auch die Möglichkeit, deinen Verkaufspreis und die Marge zu erhöhen. Hier ist aber Vorsicht geraten, da du mit höheren Gewinnen die Umsatzgrenze überschreiten könntest.Die Kleinunternehmerregelung hat aber auch Nachteile, wie zum Beispiel, dass du als Kleinunternehmer keine Vorsteuer (also Mehrwertsteuer) geltend machen kannst und es so schwieriger bei größeren Investitionen hast, weil du die Gesamtkosten bezahlen musst.Für den Fall, dass dein Auftraggeber im Ausland ist, gelten die gleichen Regeln für die Rechnung wie auch im Inland. Der einzige Unterschied ist, dass du auf der Rechnung keine Umsatzsteuer ausweisen musst, falls dein Kunde eine gültige Umsatzsteuernummer in dem EU-Land, in dem er niedergelassen ist, hat. Das heißt, dass der Rechnungsbetrag als eine Nettosumme dargestellt werden kann (es fällt keine Umsatzsteuer an). Jedoch müssen deine Umsatzsteuer-Identifikationsnummer und die deines Kunden auf der Rechnung sein.Um eine gültige Rechnung für das EU-Ausland zu haben, muss sie folgendes beinhalten:Dein vollständiger Name und deine komplette AnschriftDeine Umsatzsteuer-IdentifikationsnummerDer vollständige Firmenname und die komplette Anschrift deines KundenDas RechnungsdatumDie fortlaufende RechnungsnummerDie Umsatzsteuer-Identifikationsnummer deines KundenDer Rechnungsbetrag und der LieferungszeitpunktDer Hinweis für die internationale Bankverbindung und auf die UmsatzsteuerfreiheitWenn du deinen Kunden aus dem EU-Ausland eine umsatzsteuerfreie Rechnung erstellst, musst du immer die dazugehörige Rechtsgrundlage angeben. Weiterhin muss in der Rechnung auch erwähnt werden, wenn der Auftraggeber eventuelle Steuerpflichten hat. Diese Information kannst du auch rein formal und in deutscher Sprache angeben. Allerdings wäre es besser, diese Information in englischer oder der Landessprache des Kunden zu schreiben. Es ist sinnvoll, Rechnungsvorlagen für die verschiedenen Sprachen zu haben (sehr wahrscheinlich reicht eine Rechnungsvorlage auf Deutsch und eine auf Englisch vollkommen aus).Beim internationalen Zahlungsverkehr ist es wichtig zu wissen, dass die Rechnung auf jeden Fall die IBAN deines Bankkontos enthalten soll sowie die BIC/SWIFT Codes. (Weitere Informationen zum europäischen Zahlungsverkehr erhältst du in einem anderen Artikel von uns: Was Du über SEPA und die Möglichkeiten des europäischen Zahlungsverkehrs wissen musstDer beste Weg, mögliche Fehler bei der Rechnungserstellung zu vermeiden ist es, eine Rechnungsvorlage zu haben. Bei der Erstellung der Vorlage musst du gut aufpassen, dass du keine Fehler machst. Also, überprüfe die Vorlage ganz genau, sodass du sie später für alle Rechnungen ohne schlechtes Gewissen benutzen kannst. Rechnungsvorlagen kannst du auch sehr leicht im Internet finden. Es gibt viele Seiten, die kostenlose Vorlagen anbieten. In verschieden Formaten, wie z. B. Word, Excel, usw. Rechnungsvorlagen zu haben, erleichtert dir das Leben erheblich. Ein weiterer Tipp ist es, dein Logo auf der Rechnung zu zeigen. So zeigst du auch, dass du was von Corporate Design verstehst.ThemenübersichtSteuerwissen > Steuerbasis für den Start in die SelbstständigkeitSteuernummer beantragenUnternehmensform wählenGewerbe anmeldenFragebogen zur steuerlichen ErfassungKleinunternehmerregelungEinnahmen-Überschuss-Rechnung (EÜR)Liebhaberei (bald erhältlich)Ist- und SollversteuerungScheinselbstständigkeitStundensatz berechnenRechnungen schreiben (hier bist du gerade)Nebengewerbe anmeldenSteuererklärungen Basics für Selbstständige'
