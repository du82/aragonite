["https://kontist.com/taxator"]
title = "Taxator: Einkommensteuer-Rechner für Selbstständige | Kontist"
description = "Der Taxator ist ein einfacher Steuerrechner für Selbstständige, der es dir erlaubt, in ein paar Minuten deinen Einkommensteuersatz zu berechnen."
full_description = "TaxatorSteuerrechner für SelbstständigeDer Taxator ist ein einfacher Steuerrechner für Selbstständige, der es dir erlaubt, in ein paar Minuten deinen Einkommensteuersatz zu berechnen.Jetzt loslegen💡 Der Taxator gibt dir eine Orientierung für deinen Steuersatz. Er ersetzt aber nicht eine detaillierte Steuererklärung oder die Beratung eines Steuerberaters.Themenübersicht1 - Einkommensteuer berechnen wenn man selbstständig ist2 - Der Einkommensteuerrechner - der ultimative Taxator!3 - Was wird gefragt?3.1 - Wie viel Umsatz wirst du in diesem Jahr machen?3.2 - Wie hoch sind deine Betriebsausgaben (monatlich)?3.3 - Wie hoch sind deine sonstigen Bruttoeinkünfte?3.4 - Bist du in der Kirche?3.5 - Bist du verheiratet? Wenn ja, wie viel wird dein Partner dieses Jahr verdienen?3.6 - Wie viel bezahlst du für deine Altersvorsorge?3.7 - Hast du Kinder? Wenn ja, wie viele?4 - VIDEO: Einkommensteuer einfach berechnen5 - Wozu kannst du den Taxator noch nutzen?Einkommensteuer berechnen wenn man selbstständig istDie Einkommensteuer ist eine der wichtigsten Einnahmequellen der meisten Staaten. Allein 2014 hat der deutsche Staat über 200 Milliarden Euro durch die Einkommensteuer eingenommen, was ungefähr ein Drittel der Gesamteinnahmen durch die Steuer in Deutschland ausgemacht hat (destatis). Wenn du 2022 als Selbstständiger mit deinem Einkommen den Freibetrag von 10.347 € im Jahr überschreitest, musst du wie jede juristisch gesehene “natürliche Person” die Einkommensteuer an das entsprechende Finanzamt abtreten.Als Selbstständige haben wir es allerdings nicht so einfach wie als Angestellte...denn Angestellte bekommen einfach eine Steuerklasse vom Finanzamt zugewiesen und ihre Steuern sind auf ihrem Lohnzettel bereits von ihrem Gehalt abgezogen wenn es am Monatsende auf dem Konto landet. Als Selbstständiger fällt man nicht direkt in Steuerklassen. Die Einkommensteuer errechnet sich aus deinem Jahresgewinn.Das führt häufig zu Verwirrung und endet häufiger als gewollt damit, dass man horrende Summen nachzahlen muss und sogar die eigene Selbstständigkeit in Gefahr bringt. Als Freiberufler kann es auch schwierig sein, genau im Voraus zu wissen, wie viele Aufträge man dieses Jahr an Land ziehen kann und wie viel Profit man mit ihnen erreichen wird - wie kann man also hier die Einkommenssteuer schon vorher berechnen?Was das ganze noch weiter kompliziert, sind andere Faktoren, die bestimmen wie hoch der Betrag sein wird, den du in Form der Einkommensteuer dem Allgemeinwohl beisteuerst (Kinder, Kirche, Soli etc.). Und selbst Steuerberater haben es manchmal schwer, sich durch den Dschungel an Regelungen und neuen Gesetzen zu schlagen und auf dem Laufenden zu bleiben.Wie kann man also gewährleisten, dass man das mit der Einkommensteuerberechnung richtig macht? Welche Faktoren muss man berücksichtigen? Und muss man dazu zwangsläufig den langwierigen und teuren Weg über den Steuerberater gehen, um eine erste Einschätzung zu bekommen?Der Einkommensteuerrechner - der ultimative Taxator!Wir haben hierfür extra einen Steuerrechner für dich entwickelt, mit dem du nach ein paar Fragen deinen ungefähren Steuersatz ermitteln kannst. Selbst wenn dieser natürlich nicht die genaue Berechnung eines Steuerberaters ersetzt, kannst du den Wert nehmen, um eine ungefähre Orientierung dafür zu erlangen, wie viel du für deine Steuern zurücklegen musst - du kannst einen relativ zuverlässigen Indikator für deinen Einkommensteuersatz errechnen.Den Wert kannst du dann mit der Zeit immer genauer anpassen, sodass du irgendwann auch ein genaueres Bild darüber hast, wie viel von deinen Einkünften eigentlich für dich übrig bleibt. Wir rechnen damit, dass wir für ungefähr 80 Prozent der typischen Freelancer und Selbstständigen in Deutschland einen Richtwert für ihre Steuerrücklagen errechnen können.Was wird gefragt?Damit der Taxator eine Einschätzung zu deiner Steuerlast ausspucken kann, musst du ihn zunächst mit ein paar Infos füttern, die ausschlaggebend dafür sind wie hoch dein Steuersatz ausfallen wird.Wie viel Umsatz wirst du in diesem Jahr machen?Die wichtigste Frage betrifft zunächst deinen erwarteten Umsatz für dieses Steuerjahr. Aufgrund des progressiven Steuersystems in Deutschland, variiert dein Steuersatz mit der Höhe deiner Einkünfte. Sobald du den für 2022 angesetzten Freibetrag von 10.347€ an Einkünften überschritten hast, wird ein Prozentsatz auf deine Einkünfte angewendet, den du an das Finanzamt abführen musst, wobei der Eingangssteuersatz zur Zeit bei 14% und der Spitzensteuersatz bei 45% liegt. Deswegen ist es wichtig, im ersten Schritt in etwa zu bestimmen, wie viel du in diesem Steuerjahr verdienen wirst.Wenn du nicht genau absehen kannst, wie hoch deine Einkünfte sein werden, orientiere dich am besten am letzten Jahr und schlag im Zweifel noch etwas mehr drauf, da Optimismus an dieser Stelle zu konservativeren Steuerschätzungen führt. So hast du am Ende des Jahres nicht zu wenig bezahlt und kannst dich eventuell sogar noch über etwas Gespartes freuen.Wie hoch sind deine Betriebsausgaben (monatlich)?Weiterhin möchten wir gerne von dir wissen, wie hoch deine Betriebsausgaben monatlich sind. Denn diese senken letztlich deinen Gewinn und können so von der Steuer abgesetzt werden und deinen Steuerbetrag runtersetzen. Hier geht es um alle Ausgaben, die durch deine unternehmerische Tätigkeit entstehen, wie z.B. deine Mietausgaben für einen Coworking-Platz, oder ein Büro, Ausgaben für Leasing, Anschaffung eines neuen Computers, Telefon- und Internetkosten, Werbekosten, KFZ-Kosten, Waren oder Rohstoffe, Beiträge, Gebühren oder Versicherungen (die Krankenversicherung fällt hier nicht rein), Externe Dienstleistungen und Angestellte, Meetings im Restaurant, Reisekosten, Business-Outfit.Solltest du dir über die Gesamtkosten nicht im Klaren sein, versuche doch einmal eine Zahl neben jeden dieser Punkte zu setzen. Manche Ausgaben hängen auch von deiner spezifischen Tätigkeit ab und bei manchen Ausgaben bleibt es dem Finanzamt vorbehalten, ob sie sie als Betriebsausgaben akzeptiert werden oder nicht. Mit der Zeit kriegt man in diesen Fragen aber immer mehr Routine. Wenn du gerade am Anfang deiner Selbstständigkeit stehst, solltest du dich gut informieren, was du alles von der Steuer absetzen kannst und die unsicheren Kandidaten erstmal nicht fest mit einrechnen bis du besser weißt, was das Finanzamt erlaubt und was nicht.Wie hoch sind deine sonstigen Bruttoeinkünfte?Es gibt mittlerweile immer mehr Menschen, die sich nebenberuflich selbstständig machen und nebenher noch als Angestellte arbeiten. Oder du besitzt eine Immobilie oder andere Kapitalanlagen, durch die du weitere Einkünfte beziehst. Um diese Einkünfte geht es in dieser Frage, weil sie auch ausschlaggebend für deinen Einkommensteuersatz sind.Ein smartes Bankkonto und innovative Buchhaltung in einer App?Das kann Kontist! Mit unserem Geschäftskonto hast du ab sofort einen besseren Überblick über deinen Finanzen. Zudem lässt sich auch deine Buchhaltung mit Hilfe von KI (Künstliche Intelligenz) in Handumdrehen erledigen! Erfahre hier mehr.Bist du in der Kirche?Zu welchem Gott du betest, ist hier irrelevant. Der Taxator muss aber wissen, ob du Mitglied der Organisation Kirche bist. Wieso? Als Mitglied einer Kirche unterstützt du diese meistens auch durch einen finanziellen Beitrag. Dieser finanzielle Beitrag wird in Deutschland Kirchensteuer genannt und an den Staat zusammen mit deiner Einkommensteuer abgetreten.Die Kirchensteuer wird von den Finanzämtern der Bundesländer gesammelt und bemisst sich auf der Grundlage der Einkommensteuer und der Grundsteuer. Für unsere Bemessung nehmen wir die konservative Schätzung von 9%, damit wir sichergehen können, dass du nicht zu wenig zurücklegst (in manchen Bundesländern liegt die Steuer bei 8%).Bist du verheiratet? Wenn ja, wie viel wird dein Partner dieses Jahr verdienen?Wenn du verheiratet oder in einer eingetragenen Lebenspartnerschaft bist, könnt ihr vom Ehegattensplitting profitieren, was dazu führt, dass das von euch zu versteuernde Einkommen zu gleichen Teilen auf eure beiden Einkünfte verteilt wird. Dadurch kann man einiges an Steuern sparen, erst recht wenn die zu splittenden Einkünfte sehr weit auseinander liegen. Deswegen solltest du dem Taxator auch sagen, wie viel dein Partner dieses Jahr verdienen wird, um eine bessere Bemessung zu gewährleisten.Wie viel bezahlst du für deine Altersvorsorge?Auch deine Beiträge für die Altersvorsorge kannst du in Teilen von der Steuer absetzen. Seit 2022 beträgt der Höchstbetrag, den man von seiner Altersvorsorge von den Steuern absetzen kann 25.639 Euro. Die gezahlten Beiträge wirken sich dann mit 94 % steuermindernd aus.Hast du Kinder? Wenn ja, wie viele?Diese Frage gehört natürlich auch ins Repertoire der Grundfragen für die Berechnung deines Steuerbetrags. Denn hast du Kinder, tust du dem Staat und der Gesellschaft gut und das soll ja bekanntlich belohnt sein. Also, je mehr Kinder, desto geringer dein Steuerbetrag. Das ganze wird durch den Kinderfreibetrag oder das Kindergeld ermessen und hat einen zwar nicht erheblichen, aber doch gewissen Effekt auf deinen Steuersatz.... und was jetzt?Wenn du diese Fragen beantwortet hast, hast du die Eckpfeiler für die Berechnung deines Einkommensteuersatzes gesetzt und kannst den Taxator vor sich hin schnurren hören, während er rechnet, um deinen Indikator auszuspucken.VIDEO: Einkommensteuer einfach berechnenWozu kannst du den Taxator noch nutzen?Dadurch, dass im deutschen Steuersystem das Zuflussprinzip gilt, werden die Steuer nur auf die Beträge berechnet, die auch tatsächlich auf dein Konto eingegangen sind.Wenn du also durch eine größere Rechnung auf einmal mit einem bedeutend höheren Steuersatz konfrontiert wärest, kannst du dir überlegen, die Rechnung erst im Folgejahr zu stellen. Und um dir diese Art von Rechnung zu erleichtern, kannst du den Taxator benutzen und unterschiedliche Werte für dein Einkommen angeben."
