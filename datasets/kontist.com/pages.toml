full_description = 'Wie kann ich eigentlich eine Steuernummer beantragen?Steuerbasis für den Start in die Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung9. Feb. 2023blog.last_updated_placeholder 24. März 2023Das musst du wissen:Jede Person in Deutschland bekommt eine Steuernummer, sobald er oder sie eine Steuererklärung abgibt. Diese Nummer dient der eindeutigen Kennzeichnung von Privatpersonen oder Unternehmen.Wenn es die Steuernummer nicht gäbe, wäre das Finanzamt nicht in der Lage, seine Arbeit ohne großen Aufwand und logistisches Durcheinander zu erledigen.Wer Unternehmer*in ist, muss diese beim Finanzamt beantragen. Das machst du, indem du den Fragebogen zur steuerlichen Erfassung ausgefüllt bei deinem zuständigen Finanzamt einreichst.Seit dem 01.01.2021 musst du den Fragebogen vier Wochen, nachdem du mit deiner Selbstständigkeit startest, eingereicht haben.Deine Steuernummer sollte auf jedem wichtigen Dokument, wie zum Beispiel deinen Rechnungen oder deiner Steuererklärung, zu finden sein.Für dich als Selbständige*n ist es also wichtig, eine Steuernummer zu beantragen. Denn ohne eine Steuernummer kannst du auch keine Rechnung schreiben! Thema im Detail1 - So musst du deine Steuernummer beantragen2 - VIDEO: Steuernummer beantragen - Schritt für Schritt3 - Wo findest du die Steuernummer?4 - Wer braucht eine Steuernummer?5 - Ein wichtiger Tipp für alle Selbständigen6 - Steuernummer beantragen - FazitSo musst du deine Steuernummer beantragenSeit dem 01.01.2021 bist du dazu verpflichtet, innerhalb von 4 Wochen nach Aufnahme deiner selbstständigen Tätigkeit, den Fragebogen zur steuerlichen Erfassung abzugeben. Indem du diesen elektronisch ausfüllst und beim zuständigen Finanzamt einreichst, erhältst du automatisch deine Steuernummer per Post. Für dieses Vorhaben musst du dich zunächst bei ELSTER, dem Online-Portal der Finanzämter, registrieren. Plane hierfür ein paar Tage ein, da du vom Finanzamt postalisch einen Registrierungscode zugeschickt bekommst und dich hiermit verifizieren musst. Sobald die Registrierung erfolgreich war, beantragst du deine Steuernummer über das Online-Dokument Fragebogen zur steuerlichen Erfassung.In diesem Fragebogen musst du eintragen, welchen Gewinn du erwartest und wie hoch du den Umsatz einschätzt. Die Antwort des Finanzamts mit der Steuernummer kannst du nach 2 bis 6 Wochen erwarten.WICHTIG FÜR DICHBevor du den Fragebogen ausfüllst, solltest du dir unbedingt Gedanken darüber machen, ob du Freiberufler*in ODER Gewerbetreibende*r bist. Denn das hat große Auswirkungen auf deine steuerlichen Verpflichtungen.VIDEO: Steuernummer beantragen - Schritt für SchrittWo findest du die Steuernummer?Die Steuernummer besteht aus verschiedenen Codes. In Deutschland besteht das vereinheitliche Bundesschema der Steuernummer zur elektronischen Übermittlung aus 13 Ziffern, wovon die ersten 4 auf das Bundesfinanzamt hinweisen. Wenn du deine Steuernummer herausfinden willst, kannst du einfach auf deinem letzten Einkommenssteuerbescheid nachsehen. Dort kannst du sie oben links finden. Wundere dich nicht, wenn die Steuernummer auf dem Einkommensteuerbescheid weniger als 13 Stellen hat. Jedes Bundesland hat sein eigenes Standardschema hierfür festgelegt.Wenn du diesen Bescheid nicht hast, kannst du auch einfach das Finanzamt anrufen und dich dort erkundigen. Wenn du eine Steuererklärung machen musst und noch immer auf die Steuernummer wartest, kannst du sie auch ohne die Nummer machen und das Finanzamt wird dir spätestens bei der Zusendung deines Bescheids eine Nummer zuordnen.Die Steuernummer ist allerdings nicht zu verwechseln mit der individuellen Steueridentifikationsnummer, die wirklich jede (Privat-)Person in Deutschland hat und die auch lebenslang gültig ist.Diese wurde erst 2007 eingeführt und wird direkt nach der Geburt oder nach dem Zuzug nach Deutschland zugeteilt bzw. wurde allen älteren Bürgern der Bundesrepublik Deutschland im Jahr 2007 zugeordnet. Möchtest Du mehr erfahren? Lies unseren Blog Post dazu: Was ist die Steueridentifikationsnummer?Wer braucht eine Steuernummer?Die Steuernummer muss auf jedem offiziellen Schreiben drauf sein, besonders bei der Einkommensteuererklärung. Weiterhin müssen auch alle Rechnungen diese Nummer beinhalten.Jede Person, die sich selbstständig machen will, braucht eine Steuernummer. Das ist recht logisch, da du als Selbstständige*r natürlich Steuern abführen musst. Diese Nummer musst du bei jedem Zahlungsverkehr angeben.Achtung!Es ist wichtig zu beachten, dass die Steuernummer und die Steuer-Identifikationsnummer vollkommen verschiedene Nummern bzw. Nachweise sind.Die Steuernummer ist wohnortsbezogen und ändert sich immer dann, wenn du in eine andere Stadt, Gemeinde bzw. in einen anderen Bezirk ziehst. Sie wird beim Finanzamt für alle Anfragen verwendet (Lohnsteuer, Einkommensteuer, Gewerbe- und Umsatzsteuer) und du kannst dich auch als Unternehmer mit ihr ausweisen. Die Steuer-Identifikationsnummer hingegen bleibt dir ein Leben lang zugeteilt und verändert sich nie. Sie ist die Grundlage für die Einreichung von Steuererklärungen und der Erstellung von Lohnsteuerbescheinigungen.Ein wichtiger Tipp für alle SelbstständigenDu startest mit deinem eigenen Business, beantragst nun deine Steuernummer und solltest auch von Anfang an deine Finanzen gut im Griff haben. Dazu zählt auch, dass du ein eigenes Geschäftskonto haben musst. Sicherlich denkst du, dass du am Anfang doch einfach dein Privatkonto nutzen kannst. Lass dir von uns den Tipp geben, dass dies keine gute Idee ist.Erstens mögen das die Banken gar nicht, wenn du dein privates Konto plötzlich für deine selbstständige Tätigkeit nutzt (und ja, sie werden es früher oder später bemerken!) und werden dich darauf hinweisen, dass die Nutzung für geschäftliche Aktivitäten nicht erlaubt ist.Natürlich werden sie dir anbieten, bei ihnen ein kostenpflichtiges Geschäftskonto zu eröffnen (und die Gebühren sind in der Regel recht hoch im Vergleich zu Privatkonten). Außerdem verlangt auch das Finanzamt eine klare Trennung deiner privaten von deinen geschäftlichen Finanzen. Möchtest Du mehr dazu erfahren? Dann lies unseren Blog Artikel Muss man als Selbständiger eigentlich ein Geschäftskonto führen? Oder reicht ein Privatkonto?.Jetzt fragst du dich wahrscheinlich: “Wo kann ich ein gutes und kostengünstiges Geschäftskonto eröffnen?” Kennst du das Geschäftskonto von Kontist? Kontist ist eine Konto-App, die neben den normalen Funktionen eines Geschäftskontos ein intelligentes Finanzmanagement integriert.Neben den klassischen Bankvorgängen (wie zB. Überweisungen/ Daueraufträgen) hast du die Möglichkeit, deine Transaktionen zu kategorisieren, deine Buchhaltung zu integrieren, deine Steuern zu berechnen und diese zu verwalten. Und natürlich hast du immer die 100%-ige Transparenz über alle deine Ausgaben und Einnahmen.Steuernummer beantragen - FazitDas Wörtchen Steuernummer löst bei vielen ein beängstigendes Gefühl aus. Dabei stellt die Steuernummer eine sehr gute und nützliche Sache dar und nicht nur ein notwendiges Übel. Als Unternehmer*in hast du sowieso keine Wahl. Du brauchst deine Steuernummer, um Rechnungen zu schreiben und so richtig durchstarten zu können. Also, worauf wartest du noch? 😊ThemenübersichtSteuerwissen > Steuerbasis für den Start in die SelbstständigkeitSteuernummer beantragen (hier bist du gerade)Unternehmensform wählenGewerbe anmeldenFragebogen zur steuerlichen ErfassungKleinunternehmerregelungEinnahmen-Überschuss-Rechnung (EÜR)Liebhaberei (bald erhältlich)Ist- und SollversteuerungScheinselbstständigkeitStundensatz berechnenRechnungen schreibenNebengewerbe anmeldenSteuererklärungen Basics für Selbstständige'
