h:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung10. Nov. 2022blog.last_updated_placeholder 25. Jan. 2023💡 Das Wichtigste in Kürze:Außergewöhnliche Belastungen sind unvorhergesehene Ausgaben wie Pflege-und Krankheitskosten, die du privat tätigen musst und von der Steuer absetzen kannst.Das Steuerrecht unterscheidet allgemeine und besondere außergewöhnliche Belastungen.Damit außergewöhnliche Belastungen deine Steuerlast senken, gibst du sie in der Steuererklärung an.Zu den außergewöhnlichen Belastungen gehören die Krankheitskosten. Du kannst Medikamente oder Behandlungen absetzen, die medizinisch notwendig und ärztlich verordnet sind.Besondere außergewöhnliche Belastungen, wie Kosten für die Pflege von Angehörigen oder Unterhaltszahlungen, lassen sich bis zu einem bestimmten Betrag ebenfalls steuerlich ansetzen.Einige außergewöhnliche Belastungen sind erst steuerlich relevant, wenn sie deine zumutbare Belastung überschreiten. Die Höhe dieser Belastung richtet sich nach deinem Einkommen.Inhaltsverzeichnis:1 - Definition: Was sind außergewöhnliche Belastungen?2 - Was unterscheidet allgemeine und besondere außergewöhnliche Belastungen?3 - Allgemeine außergewöhnliche Belastungen: Beispiele3.1 - Welche Krankheitskosten sind steuerlich absetzbar?3.2 - Welche Krankheitskosten sind nicht absetzbar?3.3 - Gelten Reisekosten als außergewöhnliche Belastung?3.4 - Was ist mit Kosten für nicht anerkannte Heilmethoden?3.5 - Krankheitskosten: Außergewöhnliche Belastung oder Betriebsausgabe?4 - Was sind besondere außergewöhnliche Belastungen?4.1 - Pflegekosten4.2 - Pflegepauschbetrag4.3 - Behindertenpauschbetrag4.4 - Bestattungskosten4.5 - Was sind sonstige außergewöhnliche Belastungen?5 - Sind Unterhaltszahlungen besondere außergewöhnliche Belastungen?5.1 - Unterhalt an (volljährige) Kinder5.2 - Unterhalt an andere Personen6 - Wo werden außergewöhnliche Belastungen in der Steuererklärung eingetragen?7 - Wie wird die zumutbare Belastung ermittelt?8 - Wie kann ich die zumutbare Belastungsgrenze überschreiten?Du bist top organisiert und hast deine Kostenplanung im Griff? Manchmal kommen trotzdem ungeplante Kosten auf Selbstständige zu. Die gute Nachricht: Einige davon kannst du genauso wie deine Betriebs- und Sonderausgaben steuerlich geltend machen. Welche außergewöhnlichen Belastungen du steuerlich ansetzen kannst und was es dabei zu beachten gibt, erfährst du hier.Definition: Was sind außergewöhnliche Belastungen?Was außergewöhnliche Belastungen sind, definiert das Einkommensteuergesetz (EStG): Der Gesetzgeber versteht darunter besondere Umstände, unter denen deine privaten Ausgaben höher sind als gewöhnlich.Moment, was heißt hier gewöhnlich? Das bedeutet, das Finanzamt vergleicht deine Situation mit der von Steuerzahlenden, die dir in folgenden Punkten ähnlich sind:Einkommen,Famillienstand,Kinderanzahl.Hast du aus unvermeidbaren Gründen mehr Ausgaben als deine „Steuer-Twins“, geht das Finanzamt von außergewöhnlichen finanziellen Belastungen aus. Praktisch: Diese Belastungen senken deine Steuerlast, obwohl sie nichts mit deiner selbstständigen Tätigkeit zu tun haben.Beispiel:Du musst häufiger als andere eine ärztliche Fachperson aufsuchen oder spezielle Medikamente nehmen, die deine Krankenversicherung nicht übernimmt. Die Kosten dafür sind außergewöhnliche Belastungen. Sofern sie deine individuelle zumutbare Belastung überschreiten, kannst du die Arznei- und Arztkosten von der Steuer absetzen.Bevor wir die zumutbare Belastung klären, gehen wir auf allgemeine und besondere außergewöhnliche Belastungen ein.Was unterscheidet allgemeine und besondere außergewöhnliche Belastungen?Belastung ist Belastung – das Finanzamt unterscheidet allerdings zwischen allgemeinen und besonderen außergewöhnlichen Belastungen.Allgemeine außergewöhnliche BelastungenBesondere außergewöhnliche BelastungenGrundlage§ 33 EStG§§ 33a, 33b EStGAb wann absetzbar?Ab überschreiten der individuellen zumutbaren Belastung in unbegrenzter Höhe. Voraussetzung: EinzelnachweiseAb dem ersten Cent bis zu einem bestimmten Pausch- oder Höchstbetrag. Voraussetzung: Belastung ist gesetzlich definiertBeispielKrankheitskostenPflegepauschbetragAllgemeine außergewöhnliche Belastungen: BeispieleSelbstständige wissen, wie wertvoll Gesundheit ist. Und was es kostet, sie wiederherzustellen. Immerhin: Viele dieser Kosten sind allgemeine außergewöhnliche Belastungen. Krankheitskosten oder Kurkosten reduzieren also deine Steuerlast.AchtungDamit du Krankheitskosten steuerlich absetzen kannst, müssen sie deine individuelle zumutbare Belastung übersteigen. Wie diese Grenze ermittelt wird, erfährst du am Ende des Artikels.Welche Krankheitskosten sind steuerlich absetzbar?Typische Beispiele für steuerlich relevante Krankheitskosten sind Kosten, die du für ärztliche Behandlungen trägst oder Zuzahlungen zu verschriebenen Arzneimitteln, Heil- und Hilfsmitteln.Folgenden Heilkosten für ambulante oder stationäre Behandlungen im Krankenhaus, bei (fach-)ärztlichem Personal oder Heilpraktizierenden kannst du absetzen:Unterbringung im Krankenhaus oder PflegeheimAugen-Laser-OperationAkupunkturverordnete Massagen oder PhysiotherapieKuraufenthalteZu den absetzbaren verschreibungspflichtigen Arznei-, Heil- und Hilfsmitteln zählen unter anderem:BrilleZahnersatzRollstuhlHörgeräteZuzahlungen zu verordneten MedikamentenAufwendungen für künstliche BefruchtungAchtung:Krankheitskosten gehören in deine private Einkommensteuererklärung. In deiner laufenden Buchhaltung lässt du sie unberücksichtigt.Die Ausgaben müssen entweder durch eine anerkannte Krankheit oder durch einen Unfall entstanden sein. So schreibt es § 64 EStDV (Einkommensteuer-Durchführungsverordnung) vor.Darin ist geregelt, wann du dem Finanzamt einen speziellen Nachweis für Krankheitskosten erbringen musst.In manchen Fällen fordern die Finanzbehörden ein amtsärztliches Gutachten oder eine ärztliche Bescheinigung eines medizinischen Dienstes der Krankenversicherung. Es gibt aber gute Nachrichten – in diesen vier Fällen erleichtert der Gesetzgeber dir den Papierkram:Für eine Augen-Laser-Operation brauchst du kein amtsärztliches Attest.Wenn du chronisch krank bist und ständig spezielle Medikamente benötigst, reicht die einmalige Vorlage einer Verordnung. Hat ein Augenarzt festgestellt, dass du eine Brille benötigst, genügt in den Folgejahren die Sehschärfenbestimmung durch einen Augenoptiker.Erstattungsmitteilungen der privaten Krankenkasse oder ein Beihilfebescheid einer Behörde werden als Nachweis anerkannt.Welche Krankheitskosten sind nicht absetzbar?Damit du Krankheitskosten absetzen kannst, müssen Medikamente oder Behandlungen medizinisch notwendig und ärztlich verordnet sein.Die Kosten für eine Schönheits-OP sind meist nicht absetzbar. Außerdem sind nur selbstgetragene Kosten als außergewöhnliche Belastung absetzbar. Kosten, die die Krankenkasse erstattet oder übernimmt, bleiben unberücksichtigt.Weitere Kosten, die das Finanzamt nicht als steuermindernd durchgehen lässt:Vorbeugende Maßnahmen wie eine Zahnreinigung.Aufwendungen für eine Diätverpflegung, wenn du aufgrund einer Glutenunverträglichkeit auf bestimmte Nahrungsmittel ausweichen musst.Zusatzgebühren im Krankenhaus für einen Pay-TV-Sender oder einen WLAN-Zugang.Gelten Reisekosten als außergewöhnliche Belastung?Reisekosten sind laut Steuerrecht Krankheitskosten. Das ist kein Tippfehler: Es geht dabei um Kosten, die im Zusammenhang mit Krankheiten entstehen. Zwei Beispiele zeigen, was das bedeutet:Musst du eine weite Fahrt zu einem Spezialkrankenhaus unternehmen, darfst du diese Aufwendung steuerlich berücksichtigen. Das gilt auch für den Fall, wenn dein*e Partner*in, oder dein Kind eine längere Zeit im Krankenhaus verbringen müssen. Die Kosten für deine Besuchsfahrten sind absetzbar.TippLass dir eine Bescheinigung des behandelnden Krankenhauses ausstellen, mit der Bestätigung, dass deine Besuche zur Heilung beitragen.Was ist mit Kosten für nicht anerkannte Heilmethoden?Manche Menschen entscheiden sich für alternative Heilmethoden. Ob diese Kosten als außergewöhnliche Belastungen bei der Steuer berücksichtigt werden, hängt vom Einzelfall ab.Gute Chancen für die Anerkennung hast du, wenn du mit einer amtsärztlichen Bescheinigung folgendes nachweisen kannst:Die Kosten waren unausweichlich.Die Heilmethode hat dein Leiden gelindert.Krankheitskosten: Außergewöhnliche Belastung oder Betriebsausgabe?Es gibt eine wichtige Besonderheit – die Berufskrankheit. Bist du infolge deiner beruflichen Tätigkeit erkrankt, kannst du wählen. Entweder setzt du die Krankheitskosten als außergewöhnliche Belastung von der Steuer ab oder verbuchst sie als Betriebsausgabe.Für deine Selbstständigkeit ist die zweite Variante fast immer günstiger. Deshalb schaut das Finanzamt hier ganz genau hin. Besprich dich also am besten im Vorfeld mit deiner Steuerberatung. Was sind besondere außergewöhnliche Belastungen?Neben allgemeinen gibt es besondere außergewöhnliche Belastungen. Dazu gehört etwa die Pflege von Angehörigen mit besonderen Bedürfnissen oder die Ausbildungsfinanzierung eines Kindes.Im Gegensatz zu allgemeinen sind die besonderen Belastungen im Gesetz definiert. Für sie gelten Höchst- oder Pauschbeträge. Im Folgenden fassen wir die wichtigsten Fakten zusammen.Achtung:Absetzbar sind alle Kosten, die unter der Grenze des jeweiligen Höchst- oder Pauschbetrags liegen – und zwar bereits ab dem ersten Cent. Was über den Pauschbetrag hinausgeht, ist nicht abzugsfähig.PflegekostenPflegst du neben deiner selbstständigen Tätigkeit Angehörige mit besonderen Bedürfnissen im eigenen Haus? Dann kannst du die dabei entstehenden Kosten absetzen.Das ist zum Beispiel der Fall, wenn du dich um Menschen mit Behinderung, pflegebedürftige Personen oder um Hinterbliebene kümmerst. Die Steuererleichterung gilt auch, wenn du selbst gepflegt werden musst.AchtungDie Pflegebedürftigkeit musst du nachweisen. Dafür benötigst du eine Bescheinigung der Pflegekasse oder des privaten Pflegeversicherers.Zu den Pflegekosten zählen auch die Aufwendungen für ein Pflegeheim. Sie sind allerdings nur absetzbar, wenn der Aufenthalt aufgrund einer Krankheit notwendig geworden ist. Gleiches gilt für die Pflegekosten in einem Altenheim oder durch eine ambulante Pflegekraft im eigenen Haus.PflegepauschbetragEine andere Möglichkeit, Pflegekosten als außergewöhnliche Belastungen für die Steuer geltend zu machen, ist der Pflegepauschbetrag. Dafür benötigst du keine Belege. Wichtig für die Pauschale ist der Pflegegrad der zu pflegenden Person. Seit 2021 liegt der Pauschbetrag bei 1.800 Euro.In diesem Artikel über Steuerfreibeträge und Pauschalen für Selbstständige erfährst du alles über Voraussetzungen und Maximalbeträge.InfoDen Pauschbetrag gibt es nur für unentgeltliche Pflege. Kümmern sich mehrere Personen um die Pflege, wird der Pauschbetrag anteilig berechnet. Pflegst du zwei Angehörige, verdoppelt sich der Betrag.BehindertenpauschbetragAls Mensch mit Behinderung darfst du frei entscheiden, ob du einzelne Kosten im Zusammenhang mit deiner Behinderung nachweisen willst, oder den Behindertenpauschbetrag nutzt. Im ersten Fall setzt du die Kosten als außergewöhnliche Belastung von der Steuer ab, wenn sie deine zumutbare Belastung übersteigen. Im zweiten Fall richtet sich die Pauschale nach dem Grad der Behinderung (GdB).AchtungEntscheidest du dich für den Behindertenpauschbetrag, kannst du keine weiteren Pflegekosten als außergewöhnliche Belastung geltend machen.Der Behindertenpauschbetrag gleicht diese typischen Aufwendungen aus: Ausgaben für die Unterstützung bei gewöhnlichen und fortlaufenden Alltagsaufgaben,Kosten für einen gesteigerten Wäschebedarf,Aufwendungen für die Pflege.Kommen spezielle Aufwendungen hinzu, kannst du sie zusätzlich zum Behindertenpauschbetrag als allgemeine außergewöhnliche Belastung ansetzen. Das sind unter anderem Kosten fürOperationen,den behindertengerechten Umbau deines Wohnraums,Fahrtkosten bei Schwerbehinderung.TippMusst du größere Aufwendungen wie Heimkosten selbst tragen, landest du schnell über dem Behindertenpauschbetrag. Dann ist es besser, die tatsächlichen Kosten nachzuweisen und als außergewöhnliche Belastungen anzugeben. Du kannst dich mit jedem Steuerjahr neu entscheiden, welche Alternative dir den größeren Steuervorteil bringt.BestattungskostenWer einen lieben Menschen verliert, durchlebt eine schwere Zeit. Zur psychischen Belastung kommen oft auch eine finanzielle hinzu. Sind die Kosten für eine Beerdigung höher als der Nachlass oder Ersatzleistungen, können Hinterbliebene diese absetzen. Eine Ersatzleistung ist zum Beispiel das Sterbegeld einer Unfallversicherung der verstorbenen Person.Diese Kosten sind absetzbar: Grabstätte,Sarg oder Urne,Blumen und Kränze,Todesanzeigen.Und diese nicht:Trauerkleidung,Bewirtung der Trauergäste,Reisekosten anlässlich der Trauerfeier.Was sind sonstige außergewöhnliche Belastungen?Neben allgemeinen und besonderen außergewöhnlichen Belastungen findest du in der'
