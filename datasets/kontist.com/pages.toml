title = "Ist- und Sollversteuerung - Unterschiede & Auswirkungen für Selbstständige | Kontist"
description = "Die Unterschiede zwischen Ist- und Sollversteuerung können für Selbstständige enorm wichtig sein. Was du dazu wissen musst und welche Auswirkungen die beiden Varianten haben, erfährst du hier."
full_description = 'Ist-Versteuerung vs. Soll-Versteuerung – die Vor- und NachteileSteuerbasis für den Start in die Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung19. Feb. 2023💡 Das musst du wissen:Wenn du mit deinem Unternehmen Einnahmen machst, dann musst du in den meisten Fällen Umsatzsteuer abführen. Das kann zu zwei unterschiedlichen Zeitpunkten geschehen:Soll-Versteuerung: Die Umsatzsteuer wird abgeführt, nachdem du deine Rechnung geschrieben hast. Das ist unabhängig davon, wann du das Geld von deinen Kund*innen tatsächlich erhältst.Ist-Versteuerung: Die Umsatzsteuer wird abgeführt, nachdem du das Geld von deinen Kund*innen erhalten hast. Bei der Soll-Versteuerung handelt es sich im Steuerjargon um „Besteuerung nach vereinbarten Entgelten“, bei der Ist-Versteuerung um „Besteuerung nach vereinnahmten Entgelten“. 💡 So gehst du vor:Du möchtest in ein anderes Modell wechseln? Das musst du beachten:Als Freiberufler*in kannst du immer zwischen der Soll- und Ist-Versteuerung wechseln.Für die Ist-Versteuerung von Gewerbetreibenden gibt es eine Grenze. Sie können diese dann nutzen, wenn sie einen Umsatz von weniger als 600.000 € pro Jahr beziehungsweise einen Gewinn von unter 60.000 € pro Jahr verzeichnen. Bei deiner Gründung wählst du deine Versteuerung im Fragebogen zur steuerlichen Erfassung aus. Möchtest du nach der Gründung das Modell wechseln, musst du ein formloses Schreiben an dein Finanzamt schicken. Darin gibst du an, welche Versteuerung du in Zukunft nutzen möchtest. In dem Schreiben musst du deinen Namen, deine Steuernummer und das Datum des gewünschten Wechsels (am besten zum Jahreswechsel) erwähnen. Als Gewerbetreibende*r solltest du auch deinen Umsatz angeben, um Rückfragen zu vermeiden.Inhaltsverzeichnis1 - Ist-Versteuerung1.1 - Beispiel für die Anwendung von Ist-Versteuerung1.2 - Vorteile der Ist-Versteuerung1.3 - Nachteile der Ist-Versteuerung2 - Soll-Versteuerung2.1 - Beispiel für die Anwendung von Soll-Versteuerung2.2. - Vorteile der Soll-Versteuerung2.3 - Nachteile der Soll-Versteuerung3 - Vergleich von Ist- und Soll-Versteuerung3.1 - Unterschiede zwischen den Methoden3.2 - Empfehlung für die Wahl der VersteuerungsmethodeIst-VersteuerungDie Ist-Versteuerung des Umsatzes geschieht immer erst dann, wenn Kund*innen deine Rechnung bezahlt haben.Beispiel für die Anwendung von Ist-VersteuerungBeispiel: Du stellst im April eine Rechnung über 1.000 € netto plus 190 € Umsatzsteuer aus. Dein Kunde bezahlt die Rechnung aber erst im August. Du musst dementsprechend bis zum 10. September oder 10. Oktober (bei Dauerfristverlängerung) die 190 € Umsatzsteuer an das Finanzamt überweisen.In den ersten beiden Jahren nach deiner Gründung musst du die Umsatzsteuer-Voranmeldung monatlich abgeben. Bleibt die Höhe der Umsatzsteuer im zweiten Jahr unter 7.500 €, wechselst du in die vierteljährliche Zahlung.InfoDurch die Corona-Pandemie kann seit 2021 die Umsatzsteuervoranmeldung von Gründer*innen auch nur vierteljährlich abgegeben werden. Hierfür muss man einfach den entsprechenden Haken im Fragebogen zur steuerlichen Erfassung setzen. Diese Regelung gilt bis 2026 und ist freiwillig. Sollte jedoch die voraussichtliche Umsatzsteuerlast über 7.500 Euro betragen oder im Laufe des Jahres tatsächlich bei über 7.500 Euro liegen, muss monatlich abgegeben werden.TippUm Zeit zu gewinnen, kannst du eine Dauerfristverlängerung beantragen. Dann musst du bei monatlicher Zahlung nicht mehr bis zum 10. des nächsten Monats, sondern bis zum 10. des übernächsten Monats bezahlen.Vorteile der Ist-VersteuerungDie Ist-Versteuerung hat einen ganz klaren Vorteil: Du musst erst Steuern an das Finanzamt abführen, wenn du Geld von deinen Kundinnen und Kunden erhalten hast. Das ist aus zwei Gründen vorteilhaft:Mit der Ist-Versteuerung bleibst du liquide, weil du nur Geld bezahlst, das du bereits auf dem Konto hast. Wenn du selbständig bist, kennst du das bestimmt: Manchmal kann es länger dauern, bis das Geld ankommt – und im schlimmsten Fall werden Aufträge gar nicht bezahlt. Die Ist-Versteuerung sorgt dafür, dass du unabhängig von der Zahlungsmoral deiner Kundinnen und Kunden bist. Denn gerade bei größeren Aufträgen kann die Umsatzsteuer sehr hoch ausfallen. Die Ist-Versteuerung vereinfacht deine Buchhaltung, wenn du dafür eine Steuer-App nutzt. Du kannst die Umsatzsteuer dann einfach automatisch aus deinen Geldeingängen berechnen lassen. Nachteile der Ist-VersteuerungEinen Nachteil hat die Ist-Versteuerung für Freelancer und kleinere Unternehmen nicht. Sogar die Beantragung ist sehr einfach, da du sie formlos erledigen kannst. Du musst also einfach nur einen kurzen Brief an das Finanzamt schicken. Für Unternehmen mit sehr vielen Rechnungsposten kann die Ist-Versteuerung einen höheren administrativen Aufwand bedeuten. Für sie ist es einfacher, die Umsatzsteuer gleich abzuführen. Ansonsten müssten sie jeden Rechnungsposten zweimal bearbeiten. Dabei handelt es sich allerdings meist um große Firmen mit hohem Umsatz, welche ohnehin die Soll-Versteuerung nutzen müssen.Soll-VersteuerungBeispiel für die Anwendung von Soll-VersteuerungDu stellst einem Kunden eine Rechnung im Juli aus. Der Nettobetrag hat eine Höhe von 2.000 €, dazu kommen 380 € Umsatzsteuer.Weil bei dir die Soll-Versteuerung angewandt wird, musst du die Umsatzsteuer auch für den Monat Juli abführen. Die Versteuerung richtet sich dann nämlich nach dem Rechnungsdatum. Fällig ist die Umsatzsteuer immer am 10. des Folgemonats.Konkret bedeutet das: Du musst bis zum 10. August (oder bis 10. September, wenn du eine Dauerfristverlängerung hast) 380 € an das Finanzamt überweisen. Nun kann es aber sein, dass du das Geld von deinem Kunden erst danach erhältst – zum Beispiel im Oktober. Du gehst bei der Soll-Versteuerung also in Vorkasse. Dafür solltest du über ausreichend liquide Mittel verfügen.Vorteile der Soll-VersteuerungDie Soll-Versteuerung kann deinen administrativen Aufwand verringern. Das ist aber nur dann der Fall, wenn du sehr viele Rechnungen schreibst. Du führst die Umsatzsteuer dann einfach direkt beim Ausstellen der Rechnungen ab.Nachteile der Soll-VersteuerungDie Soll-Versteuerung kann zu Liquiditätsengpässen führen. Das liegt daran, dass du auch dann Steuern abführen musst, wenn du noch keinGeld von deinen Kund*innen erhalten hast.Vergleich von Ist- und Soll-VersteuerungUnterschiede zwischen den MethodenDer Unterschied zwischen der Soll-Versteuerung und der Ist-Versteuerung ist schnell erklärt. Mit dieser Eselsbrücke kannst du es dir gut merken: Bei der Ist-Versteuerung bezahlst du erst die Umsatzsteuer, wenn du das Geld von deinen Kundinnen und Kunden erhalten hast. Du überweist also Geld an das Finanzamt, das schon da IST. Bei der Soll-Versteuerung führst du die Umsatzsteuer ab, nachdem du deine Rechnung gestellt hast. Du überweist also Geld an das Finanzamt, das dein Kunde oder eine Kundin dir (zumindest in den meisten Fällen) erst noch überweisen SOLL. Empfehlung für die Wahl der VersteuerungsmethodePrinzipiell gilt für Unternehmen und Selbstständige die Soll-Versteuerung. Besonders wenn du neu gegründet hast, solltest du jedoch in der Regel zur Ist-Versteuerung wechseln – wenn du diese nicht schon bei der Gründung gewählt hast. Denn so kommst du nicht in Zahlungsnot, wenn Kund*innen die Rechnung einmal nicht begleichen oder wenn der Umsatzsteuerbetrag sehr hoch ausfällt. Auf diese Weise kannst du die Zahlungsfähigkeit deines Unternehmens sicherstellen.ThemenübersichtSteuerwissen > Steuerbasis für den Start in die SelbstständigkeitSteuernummer beantragenUnternehmensform wählenGewerbe anmeldenFragebogen zur steuerlichen ErfassungKleinunternehmerregelungEinnahmen-Überschuss-Rechnung (EÜR)Liebhaberei (bald erhältlich)Ist- und Sollversteuerung (hier bist du gerade)ScheinselbstständigkeitStundensatz berechnenRechnungen schreibenNebengewerbe anmeldenSteuererklärungen Basics für Selbstständige'
