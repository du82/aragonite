full_description = 'Nebengewerbe anmelden: nebenberuflich, als Student, arbeitssuchend, Azubi, usw.Steuerbasis für den Start in die Selbstständigkeit<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2Ff231b792-cf18-4653-bbaa-e927017a4ee4_Melchior_avatar_2023.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung21. Feb. 2023Das Wichtigste in Kürze:Das Nebengewerbe ist ein Gewerbe, welches du anmelden kannst, aber nicht in Vollzeit oder hauptberuflich ausüben darfst. Das heißt, dass du diese Tätigkeit nicht mehr als 20 Stunden pro Woche ausüben kannst. Jedoch spielt das bei dem Finanzamt keine Rolle, denn für das Finanzamt ist Gewerbe gleich Gewerbe. Beim Gewerbeamt unterscheidet sich nicht die Anmeldung des Nebengewerbes von der Anmeldung des Gewerbes.Thema im Detail:1 - Meldepflicht2 - Kosten und Gebühren3 - Nebengewerbe: Einzelfälle3.1 - Angestellte3.2 - Beamte3.3 - Azubis3.4 - Studenten3.5 - Arbeitslose4 - Steuererklärungspflicht5 - Schritt für Schritt AnleitungMeldepflichtSelbstständige, die zu den Freiberuflern gehören (wie zum Beispiel Rechtsanwälte, Ärzte, Künstler usw.) sind nicht verpflichtet, eine Gewerbeanmeldung zu machen. Wenn du aber kein Freiberufler bist, hast du die Pflicht, dein Gewerbe auch anzumelden. Die Anmeldung sollte nicht später als 14 Tage nach Beginn der Tätigkeit durchgeführt werden. Dazu ist es ausreichend, das GewA1-Formular auszufüllen (persönlich, schriftlich oder auch elektronisch).<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenKosten und GebührenDie Kosten für die Anmeldung, egal ob für das Gewerbe oder Nebengewerbe, betragen je nach Standort des Gewerbeamtes zwischen 10-65 Euro. Bei der Anmeldung musst du nur angeben, ob du ein Haupt- oder Nebengewerbe anmeldest und was der Zweck des Gewerbes ist.Nach der Anmeldung wird das Gewerbeamt das Finanzamt und die Industrie- und Handelskammer (IHK) informieren. Anschließend wird dir das Finanzamt einen steuerlichen Erfassungsbogen schicken, welchen du ausfüllen musst. Wenn du ein Gewerbe erfolgreich angemeldet hast, erhältst du einen Gewerbeschein.Achtung:Wer ohne Gewerbeschein gewerbliche Tätigkeiten ausübt, riskiert weitaus höhere Bußgelder als die Gebühr für die Gewerbeanmeldung. Als ein Gewerbetreibender bist du außerdem verpflichtet, ein Mitglied bei der Industrie- und Handelskammer (IHK) oder einer anderen Kammer (wie z. B. der Handwerkskammer) zu sein. Hierfür musst du jährliche Gebühren zahlen, die nach Unternehmensgröße variieren. Der Mindestgrundfreibetrag für im Handelsregister eingetragene Firmen beträgt aktuell 120 Euro sowie für Kleingewerbetreibende 30 Euro. (Stand April 2023)Neben der Gebühr können auch, abhängig von der Art des Gewerbes, andere Kosten während der Gewerbeanmeldung auftreten. Manchmal brauchst du gewisse Genehmigungen, um ein bestimmtes Gewerbe betreiben zu dürfen.Egal, ob du ein Gewerbe oder Nebengewerbe führst, die Gewerbesteuer ist für dich Pflicht. Wichtig für diese Steuer ist der Freibetrag von 24.500 Euro im Jahr. Wenn du diesen Freibetrag nicht überschreitest, bist du von der Gewerbesteuer befreit. Jedoch gilt dieser Freibetrag nicht für Kapitalgesellschaften, sondern nur für Personengesellschaften und Einzelunternehmer. Die Gründung eines Nebengewerbes bedeutet, dass du ab diesem Zeitpunkt nebenberuflich selbstständig bist. Die einzige Institution, für welche das auch interessant ist, ist die Krankenkasse. Wenn du ein nebenberuflicher Selbstständiger bist und bestimmte Grenzen nicht überschreitest, musst du auch keine zusätzlichen Krankenversicherungsbeiträge entrichten.Wenn du nicht mehr als 20 Stunden pro Woche arbeitest, wird die Krankenkasse deine Tätigkeit nicht als hauptberufliche Selbstständigkeit betrachten, sondern wird deine Tätigkeiten als Nebengewerbe einstufen. Dies hat zur Folge, dass du keine Krankenversicherung zusätzlich abschließen musst.Nebengewerbe: Einzelfälle je BerufsgruppeBei jeder Berufsgruppe gibt es Besonderheiten bei der Anmeldung eines Nebengewerbes, die du beachten musst:AngestellteWenn du ein Nebengewerbe neben deinem Angestelltenverhältnis anmelden möchtest, musst du folgende Voraussetzungen erfüllen:Du darfst nicht Konkurrent zu deinem Arbeitgeber seinDeine Arbeitsleistung in dem Hauptjob darf nicht darunter leiden. Deine Nebentätigkeit darf dich nicht besonders erschöpft oder müde machenDu darfst keine Mittel von deinem Arbeitgeber einsetzenDiese Nebentätigkeit solltest du deinem Arbeitgeber melden. Wenn du in Teilzeit arbeitest und ein Nebengewerbe führen möchtest, ist es empfohlen, eine Statusfeststellung bei der Krankenversicherung zu machen, da die wöchentlichen Einnahmen gering und die Arbeitszeit kurz ist. Aus diesem Grund wirst du höchstwahrscheinlich die Krankenversicherung aus deinem nebengewerblichen Einnahmen zahlen.BeamteEin Nebengewerbe kannst du auch als Beamter anmelden. Als ein Beamter hast du einen Sonderstatus. Anstatt eines Arbeitsverhältnisses, haben Beamte Treue- und Dienstverhältnisse. Es wird empfohlen, dass die nebengewerbliche wöchentliche Arbeitszeit nicht mehr als 1/5 deiner Dienstzeit beträgt und die Einnahmen nicht mehr als 40 % des jährlichen Endgrundgehalts sind. Weiterhin, hast du neben der Meldepflicht auch die Genehmigungspflicht. Deine Nebentätigkeit kann von dem Dienstherren untersagt werden. Jedoch dürfen die Gründe für die Verweigerung nicht willkürlich sein. Das Gesetz schreibt vor, dass die Genehmigung untersagt werden kann, nur wenn die Nebentätigkeit auch dienstliche Interessen beeinträchtigt.AzubisDu kannst ein Nebengewerbe auch als ein Auszubildender anmelden. Hier gelten die gleichen Vorschriften wie auch bei Angestellten.Besondere Vorsicht ist aber bei der Berufsausbildungsbeihilfe (BAB) geraten. Sie rechnet mit allen Einkünften, also auch Einkünften aus der nebenberuflichen Tätigkeit. Es wird empfohlen, sich mit der zuständigen Arbeitsagentur abzusprechen.StudentenAls Student kannst du auch ein Nebengewerbe anmelden, aber hier ist es besonders wichtig, dass du die wöchentliche Arbeitszeitgrenze von 20 Stunden nicht überschreitest. Andernfalls wirst du deinen Status als Student verlieren und verlierst auch so die studentische Krankenversicherung, die ca. 120 Euro pro Monat kostet. Falls du jedoch nicht älter als 25 bist und noch familienversichert, musst du keinen Beitrag für die Krankenversicherung zahlen.In diesem Fall dürfen auch deine monatlichen Einkommen nicht mehr als 450 Euro betragen. Es ist erlaubt nur zweimal pro Jahr (zwei Monate) diese Grenze zu überschreiten. Wenn dir die studentische Versicherung kündigt, musst du dich dann selbst versichern. Die Beiträge für die Versicherung hängen von deinem Umsatz ab und betragen zwischen 200 und 800 Euro pro Monat.ArbeitsloseAuch wenn du arbeitslos bist, kannst du ein Nebengewerbe anmelden. Wenn du aber mehr als 15 Stunden pro Woche arbeitest, wirst du nicht mehr als arbeitssuchend gelten. Die Hinzuverdienstgrenze liegt hier bei 165 Euro / Monat. Wenn diese Grenze überschritten wird, dann bist du nicht mehr arbeitslos, sondern sozialversicherungspflichtig.Info:Das Finanzamt macht keine Unterscheidung zwischen dem Nebengewerbe und dem Hauptgewerbe, wenn es um die Steuerberechnung geht (wenn die Kleinunternehmerregelung nicht angewendet ist). Die Einkünfte, die durch das Nebengewerbe erzielt worden sind, werden also auf die gleiche Weise versteuert wie bei einem Hauptgewerbe.SteuererklärungspflichtBeim Nebengewerbe gibt es natürlich auch die Pflicht, eine Steuererklärung abzugeben. Es ist nicht wichtig, dass diese Tätigkeit nur nebenberuflich ausgeübt wird. Bei der Steuererklärung für das Nebengewerbe ist es wichtig zu beachten, dass zu der Einkommensteuererklärung auch eine Einnahme-Überschuss-Rechnung (EÜR) vorgelegt werden muss. Weiterhin muss auch die Anlage G beigefügt werden, für die Ermittlung von Gewinnen oder Verlusten aus einem Gewerbebetrieb. Auch die Umsätze müssen immer aufgelistet und eingereicht werden. Meistens fallen aber die Nebengewerbebetreiber unter die Kleinunternehmerregelung und haben im ersten Jahr nicht mehr als 22.000 Euro Gewinn und im zweiten Jahr nicht mehr als 50.000 Euro. Eine Jahresumsatzsteuererklärung ist in diesem Fall völlig ausreichend.<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenSchritt für Schritt: So gehst du vor, um ein Nebengewerbe anzumeldenIm ersten Schritt solltest du prüfen, ob du überhaupt ein Nebengewerbe anmelden musst, da es die „Freien Berufe“ gibt, welche keinen Gewerbeschein benötigen, um ausgeübt zu werden. Falls die Tätigkeit, die du ausübst, zu den freien Berufen gehört, bist du nicht verpflichtet, ein Gewerbe anzumelden. Du musst deine Tätigkeit dann nur dem Finanzamt melden. Beispiele hierfür sind Journalisten, Ärzte, Ingenieure, Musiker, Lehrer, Architekten, Rechtsanwälte, Wissenschaftler usw. Wenn das Nebengewerbe nicht das Ziel hat, einen Gewinn zu erzielen und es sich nur um ein Hobby handelt, muss natürlich auch in diesem Fall kein Nebengewerbe angemeldet sein.Wenn du geklärt hast, ob du ein Nebengewerbe anmelden musst, solltest du jetzt die Erlaubnis deines Arbeitgebers (falls angestellt) einholen. Erst dann kannst du auch dein Nebengewerbe anmelden.Im nächsten Schritt sollte geprüft werden, ob du ein Gewerbe oder ein Kleingewerbe anmelden musst. Meistens handelt es sich um Kleingewerbe, wenn ein Nebengewerbe angemeldet wird. In diesem Fall muss kein Eintrag in das Handelsregister vorgenommen werden.Jetzt solltest du prüfen, welches Amt für dich zuständig ist. Da dies nicht einheitlich in Deutschland geregelt ist, sind die örtlichen Bestimmungen ausschlaggebend. Informationen darüber sind meistens auf der Homepage der jeweiligen Gemeinde zu finden. In der Regel wird das Gewerbeamt zuständig sein.Nun musst du dich um das Ausfüllen des Antrag kümmern. Meistens kann ein Formular im Internet heruntergeladen werden, mit welchem du dein Nebengewerbe anmelden kannst. Es gibt kein spezielles Formular für die Anmeldung des Nebengewerbes. Es muss nur bejaht werden, dass es sich um ein Nebengewerbe handelt. In dem meisten Fällen muss das Formular zum Amt mitgebracht werden, aber in manchen Städten wird alles Online durchgeführt (zum Beispiel Berlin).Im nächsten Schritt solltest du notwendige Unterlagen sammeln. Der Personalausweis ist immer vorzuzeigen. Weiterhin können auch weitere Dokumente erforderlich sein, wie zum Beispiel eine Gewerbeerlaubnis, ein polizeiliches Führungszeugnis usw. Falls du ein ausländischer Selbstständiger bist, brauchst du auch eine Aufenthaltsgenehmigung.Werde bei dem Amt persönlich vorstellig. Es ist aber mit Wartezeiten zu rechnen und eine gewisse Zeit, den Antrag zu bearbeiten. In diesem Schritt musst du auch eine Gebühr entrichten, die sich von Stadt zu Stadt unterscheidet (von 10 bis 65 Euro)Zum Schluss wird deine Anmeldung für das Nebengewerbe auch an eine Handelskammer weitergeleitet, falls es so vom Gesetz vorgeschrieben ist, welche dann eine Mitgliedschaft ausstellen wird. Falls du auch Mitarbeiter einstellen willst, musst du auch die Bundesagentur für Arbeit kontaktieren. Beim Finanzamt musst du deine Tätigkeit ebenso anmelden.Also, wenn du dich in Vollzeit selbstständig machen willst, hat das viele Risiken. Falls etwas mit deinem Geschäft nicht funktioniert, kannst du vor dem finanziellen Ruin stehen. Deshalb beginnen viele lieber mit einem Nebengewerbe, welches sie neben dem'
