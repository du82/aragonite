x-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung21. Sept. 2023💡 Das Wichtigste in KürzeBuchhaltung betrifft alle Selbstständigen, Kleinunternehmer*innen und Unternehmen, die Steuern zahlen.Die Buchführung ist die Grundlage für die Ermittlung deines Gewinns und dient dem Finanzamt zur Berechnung deiner Steuern.Je nachdem, welche Art von Business du hast, kommt für dich entweder die einfache oder die doppelte Buchführung infrage. Es ist für die Buchhaltung wichtig, alle Geschäftsvorfälle korrekt zu erfassen und sauber zu dokumentieren – so schützt du dich vor Nachzahlungen oder Strafen.Buchführung klingt angestaubt, doch die Buchhaltung kannst du heute bequem digital erledigen – damit reduzierst du Fehlerquellen und sparst Zeit im Alltag. Thema im Detail:1 - Buchhaltung: Für Selbstständige der beste Einkommensnachweis2 - Was ist Buchhaltung und welchen Zweck erfüllt sie?2.1 - Was bringt Buchhaltung für Selbstständige?2.2 - Ist die Buchhaltung für mich Pflicht?2.3 - Müssen Kleinunternehmerinnen und Kleinunternehmer Buchhaltung machen?3 - Die Grundlagen der Buchhaltung einfach erklärt3.1 - Wichtige Grundbegriffe der einfachen Buchhaltung4 - Wie mache ich meine Buchhaltung4.1 - Einfache Buchhaltung4.2 - Doppelte Buchhaltung4.3 - Was ist die vorbereitende Buchhaltung?5 - Effizienztipps für Selbstständige: Buchhaltung zur Routine machenSchritt 1: Einfach oder doppelt?Schritt 2: Mach dich mit den Basics vertrautSchritt 3: Vergleiche ToolsSchritt 4: Finde deinen FlowSchritt 5: Entwickle eine Routine6 - Pro-Tipp: Finde einen starken Partner für deine BuchhaltungFAQ zur Buchhaltung für Selbstständige<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenBuchhaltung: Für Selbstständige der beste EinkommensnachweisAuf die Frage nach ihrem Verdienst haben Angestellte schnell eine Antwort parat: Die monatliche Gehaltsabrechnung zeigt schwarz auf weiß, was regelmäßig auf ihrem Konto landet. Doch wie können Selbstständige ihr Einkommen nachweisen, wenn zum Beispiel Banken oder potenzielle Vermieter*innen sich dafür interessieren? Ganz einfach: Indem sie ihre Buchhaltung erledigen. Wenn du dich selbstständig machen möchtest, ist die Buchhaltung eines der wichtigsten Themen, das dich von Anfang an beschäftigen wird. Für einen entspannten Einstieg in die Buchhaltung findest du hier die wichtigsten Fakten über deinen neuen, treuen Begleiter.TippSelbstständige sind selbstverständlich mehr als ihre Buchhaltung. Damit du neben deinen Finanzen ausreichend Zeit hast, um dich weiterzuentwickeln, haben wir eine übersichtliche Roadmap für dich: Dort siehst du auf einen Blick, worauf dein Fokus liegen sollte und wie du dich bestmöglich vorbereitest.Was ist Buchhaltung und welchen Zweck erfüllt sie?Ob freiberuflich oder selbstständig: Buchhaltung ist eine wichtige Aufgabe für alle, die ein eigenes Business führen. Wenn du deinen Lebensunterhalt selbst bestreitest, musst du alle Vorgänge im Zusammenhang mit geschäftlichen Finanzen dokumentieren. Dadurch verschaffst du dir einen Überblick über deine finanzielle Situation und deine Gewinne. Deine Buchhaltung ist außerdem steuerlich relevant: Denn du lieferst damit dem Finanzamt alle Informationen, die für die Berechnung deiner Steuern wichtig sind.Definition von BuchhaltungDie Buchhaltung ist die Dokumentation und Auswertung aller finanziellen Geschäftsvorgänge. Sie dient dazu, den Gewinn von Selbstständigen oder Unternehmen und ihre Steuern zu ermitteln. Dafür werden alle Zahlungen und Einnahmen erfasst, die im Zusammenhang mit der geschäftlichen Tätigkeit getätigt bzw. generiert werden.Es gibt verschiedene Arten von Buchhaltung, zum BeispielLohnbuchhaltungBilanzbuchhaltungDebitorenbuchhaltungAnlagenbuchhaltungFinanzbuchhaltungWir konzentrieren uns auf die Finanzbuchhaltung, die für die meisten Selbstständigen und Kleinunternehmer*innen relevant ist.Was bringt Buchhaltung für Selbstständige?Das alles machst du natürlich nicht zum Spaß, sondern um deinen Gewinn zu ermitteln und eine Basis für wichtige Finanzberechnungen und -berichte zu schaffen. Mithilfe der Buchhaltung erstellst du unter anderem deinebetriebswirtschaftliche Auswertung (BWA)Einnahmen-Überschuss-Rechnung (EÜR)Gewinn-und-Verlustrechnung (GuV)Steuererklärungen für das Finanzamt (Einkommen-, Gewerbe- und Umsatzsteuererklärung)Würdest du keine Buchhaltung machen, müsste das Finanzamt dein Einkommen schätzen. Das würde dazu führen, dass dir vermutlich höhere Steuern berechnet werden als mit einer ordentlichen Buchhaltung zu zahlen gewesen wären.Ist die Buchhaltung für mich Pflicht?Wenn es um Buchhaltung geht, fällt oft die Frage: Besteht für mich eine Buchführungspflicht? Für die Antwort ist zunächst eine Begriffsabgrenzung notwendig. Denn Buchführungspflicht und Pflicht zur Buchhaltung meint nicht das gleiche.Grundsätzlich müssen alle Selbstständigen und Unternehmen ihre Buchhaltung erledigen – nur so können sie dem Finanzamt gegenüber Steuern erklären. Um ihre Finanzen zu dokumentieren, dürfen Selbstständige die einfache Buchführung wählen, also die EÜR.Unter der Buchführungspflicht versteht man die gesetzliche Pflicht für Unternehmen wie UGs oder GmbHs und einige Selbstständigen, ihre Gewinne nach den Grundsätzen der doppelten Buchführung zu erfassen. Diese Pflicht besteht nur unter bestimmten Voraussetzungen.InfoAlles, was du über die doppelte Buchführung wissen musst, haben wir in einem eigenen Leitfaden zusammengefasst.Ob für dich die doppelte Buchführung Pflicht ist – man spricht alternativ von Betriebsvermögensvergleich, Doppik oder Bilanzierung – oder du deine Gewinne per EÜR ermitteln darfst, hängt unter anderem davon ab, ob du im Handelsregister eingetragen bist und wie hoch Gewinn und Umsatz sind. Eine gesetzliche Buchführungspflicht gilt für Unternehmen und Selbstständige mit einem Jahresumsatz vonmehr als 600.000 € und einem Gewinn über 60.000 €. Ausnahmen gelten dabei für bestimmte freie Berufe wie Ärzt*in oder Anwält*in. Für Kapitalgesellschaften wie eine GmbH oder eine AG gilt die Pflicht zur doppelten Buchführung dagegen immer.Müssen Kleinunternehmerinnen und Kleinunternehmer Buchhaltung machen?Wenn dein Umsatz im vergangenen Jahr höchstens 22.000 € betrug und du im laufenden Jahr voraussichtlich maximal 50.000 € Umsatz machst, gilt für dich die Kleinunternehmerregelung. In diesem Fall besteht keine Pflicht für die doppelte Buchhaltung. Kleinunternehmer und Kleinunternehmerinnen sollten ihre Belege und Rechnungen dennoch erfassen und dokumentieren. Das ist unter anderem notwendig, um herauszufinden, ob du die Kleinunternehmerregelung im nächsten Jahr wieder anwenden darfst. Es genügt allerdings, wenn du die einfache Buchhaltung anwendest.Ein smartes Bankkonto und innovative Buchhaltung in einer App?Das kann Kontist! Mit unserem Geschäftskonto hast du ab sofort einen besseren Überblick über deinen Finanzen. Zudem lässt sich auch deine Buchhaltung mit Hilfe von KI (Künstliche Intelligenz) in Handumdrehen erledigen!Jetzt endeckenDie Grundlagen der Buchhaltung einfach erklärtBevor wir in die verschiedenen Aufgaben der Buchhaltung einsteigen, klären wir noch die wichtigsten Begriffe und Grundlagen und werfen einen Blick auf die Hauptelemente deiner Buchführung. Mit den folgenden drei Punkten solltest du dich am besten so früh wie möglich auseinandersetzen, denn sie betreffen jede Form der Buchhaltung:Belege sind wichtige Werkzeuge für die Buchführung. Sie dienen als Nachweis für deine Einnahmen und Ausgaben und liefern wichtige Informationen, die du für deine Buchhaltung benötigst.Für die Aufbewahrung von Belegen, die Ermittlung deines Gewinns und Meldungen ans Finanzamt gelten bestimmte Fristen, die du kennen solltest. Viele Selbstständige müssen beispielsweise alle drei Monate die Umsatzsteuervoranmeldung ans Finanzamt übermitteln und dafür ihre Buchhaltung auf den aktuellen Stand bringen.Neben den Fristen gibt es weitere Regeln, die du kennen solltest. Dazu gehören zum Beispiel die Grundsätze ordnungsgemäßer Buchführung und Dokumentation (GoBD). Außerdem gelten für die Buchführung weitere Gesetze wie das Einkommensteuergesetz, das Umsatzsteuergesetz und die Abgabenordnung.AchtungDie GoBD sind Vorschriften und gesetzliche Regelungen, die zum Beispiel die Aufbewahrungspflichten deiner Belege betreffen. Sie legen außerdem fest, dass die Tools, die du für die Buchhaltung einsetzt, unter anderem revisionssicher sein müssen.➡️ Was das alles bedeutet und was du noch dazu wissen solltest, erfährst du in unserem YouTube-Video zu den GoBD.Wichtige Grundbegriffe der einfachen BuchhaltungDu fragst dich, warum man überhaupt von Buchhaltung spricht? Das liegt daran, dass Geschäftsvorgänge früher handschriftlich in verschiedenen Büchern festgehalten wurden. Weitere Begriffe rund um die Buchhaltung fassen wir hier für dich zusammen:Eine Buchung ist der Vorgang, mit dem ein Geschäftsvorfall erfasst wird. Dieser Begriff spielt vor allem bei der doppelten Buchführung eine Rolle, bei der es verschiedene Konten gibt: Ein Buchungssatz zeigt an, welche Konten von einer Buchung betroffen sind. Bei der einfachen Buchführung tauchen alle Buchungen auf dem Kontoauszug deines Geschäftskontos auf.Einnahmen sind alle Zugänge auf deinem Geschäftskonto. Das können Rechnungsbeträge sein, die deine Kund*innen dir überweisen, Erlöse für verkaufte Waren oder Zinserträge.Ausgaben sind dagegen Abgänge finanzieller Mittel von deinem Geschäftskonto. Sie kommen zustande, wenn du für Dienstleistungen und Waren bezahlst oder Kreditraten tilgst.Der Gewinn ist der Betrag, der von deinem Umsatz nach Abzug aller Kosten übrig bleibt. Am Ende des Geschäftsjahres hast du einen Gewinn erwirtschaftet, wenn deine Einnahmen die Ausgaben übersteigen. Sind deine Ausgaben jedoch höher als deine Einnahmen, machst du Verlust.Wie mache ich meine Buchhaltung?Im Prinzip geht es bei der Buchhaltung darum, alle relevanten Einnahmen und Ausgaben in Form von Belegen zusammenzutragen und sie zentral zu erfassen. Dafür stehen Selbstständigen verschiedene Tools wie digitale Buchhaltungsprogramme zur Verfügung.Welche Schritte im Einzelnen notwendig sind, damit du deine Buchhaltung führen kannst, und wie du deine Belege buchen musst, hängt davon ab, ob du die einfache oder die doppelteBuchhaltung anwendest.Einfache BuchhaltungBei der einfachen Buchführung entsteht während eines Geschäftsjahres die EÜR: Grundlage dafür sind deine monatlichen Kontoauszüge. Anhand der Bankkontobewegungen dokumentierst du alle Einnahmen und Ausgaben, die innerhalb des Monats angefallen sind. Die Frequenz dafür gibt die Umsatzsteuer vor. Das bedeutet: Deine Buchhaltung musst du laufend erledigen, und zwar spätestens, wenn die Umsatzsteuervoranmeldung fällig wird. Die gesamte EÜR reichst du dann im Folgejahr mit deiner Einkommensteuererklärung beim Finanzamt ein.InfoTipps für die EÜR und wie du sie in Elster erstellst, fasst unser EÜR-Ratgeber für dich zusammen.Doppelte BuchhaltungDas sind die wichtigsten Fakten zur doppelten Buchführung:Grundlage für die Doppik ist die Bilanz. Dabei spielen nicht nur Einnahmen und Ausgaben, sondern Vermögen und Kapital eine Rolle. Rechnungen sind als Forderung zu buchen, sobald du sie stellst. Bei Zahlungseingang fasst du diese Buchung dann noch einmal an – deshalb heißt es doppelte Buchführung.Die Tabelle fasst die wichtigsten Fakten noch einmal zusammen.Art der BuchhaltungGrundlageWann wird gebucht? Einfache BuchführungKontoauszugBei Einnahmen und Ausgaben gilt das Datum auf dem Kontoauszug – steuerlich sind Rechnungen deshalb erst relevant, wenn die Zahlung eingeht (Zufluss-Abfluss-Prinzip).Doppelte BuchführungBilanzEntscheidend ist das Leistungsdatum, nicht der Zahlungseingang. Leistungen buchst du als Forderung, sobald du eine Rechnung stellst.VorsichtWenn du besonders gut verdienst, fordert dich das Finanzamt irgendwann dazu auf, zur doppelten Buchführung zu wechseln. Oder du wechselst freiwillig. Denk in jedem Fall daran: Die doppelte Buchführung erfordert neben der Bilanz zusätzlich eine BWA.Was ist die vorbereitende Buchhaltung?Selbst'
