full_description = "Informationen zum Datenschutz Wir freuen uns über Ihren Besuch auf unserer Webseite. Nachfolgend möchten wir Sie über den Umgang mit Ihren Daten gem. Art. 13 DSGVO informieren.Gemeinsam Verantwortliche gem. Art. 26 i.V.m. Art. 4 Nr. 7 DSGVO für die Verarbeitung von personenbezogenen Daten, die bei dem Besuch dieser Webseite erfasst werden, sind:Verantwortliche – Kontist GmbH Boxhagener Straße 77-78 10245 Berlinsupport@kontist.com Datenschutzbeauftragter: datenschutz nord GmbHZweigstelle Berlin-CharlottenburgKurfürstendamm 21210719 Berlinoffice@datenschutz-nord.de Verantwortliche – Kontist Service GmbH Boxhagener Straße 77-78 10245 Berlinsteuern@kontist.comDatenschutzbeauftragter: datenschutz nord GmbHZweigstelle Berlin-CharlottenburgKurfürstendamm 21210719 Berlinoffice@datenschutz-nord.de Verantwortliche – Kontist Steuerberatungsgesellschaft mbH Bitterfelder Straße 104129 Leipzig juri.preis@steuerberatung.kontist.comDatensicherheitUm Ihre Daten vor unerwünschten Zugriffen möglichst umfassend zu schützen, treffen wir technische und organisatorische Maßnahmen. Wir setzen auf unseren Webseiten ein Verschlüsselungsverfahren ein. Ihre Angaben werden von Ihrem Rechner zu unserem Server und umgekehrt über das Internet mittels einer TLS-Verschlüsselung übertragen. Sie erkennen dies in der Regel daran, dass in der Statusleiste Ihres Browsers das Schloss-Symbol geschlossen ist und die Adresszeile mit https:// beginnt.DatenverarbeitungsprozesseNutzungsdatenWenn Sie unsere Webseite besuchen, speichern wir auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO temporär sogenannte Nutzungsdaten. Die Nutzungsdaten verwenden wir zu statistischen Zwecken, um die Qualität unserer Webseite zu verbessern. Wir verwenden diese Informationen außerdem, um den Aufruf unserer Webseite zu ermöglichen, zur Kontrolle und Administration unserer Systeme sowie zur Verbesserung der Gestaltung der Webseite. Diese von uns verfolgten Zwecke stellen zugleich das berechtigte Interesse im Sinne von Art. 6 Abs. 1 lit. f DSGVO dar. Der Datensatz besteht aus:dem Namen und der Adresse der angeforderten Inhalte,dem Datum und der Uhrzeit der Abfrage,der übertragenen Datenmenge,dem Zugriffsstatus (Inhalt übertragen, Inhalt nicht gefunden),der Beschreibung des verwendeten Webbrowsers und des Betriebssystems,dem Referral-Link, der angibt, von welcher Seite Sie auf unsere gelangt sind,der IP-Adresse des anfragenden Rechners, die so verkürzt wird, dass ein Personenbezug nicht mehr herstellbar ist.Cookie-EinsatzAuf unserer Webseite setzen wir Cookies ein. Cookies sind kleine Textdateien, die im Internetbrowser bzw. vom Internetbrowser auf dem Computersystem des Nutzers gespeichert und ausgelesen werden können. Sie erlauben es, Informationen über einen bestimmten Zeitraum vorzuhalten und den Rechner des Besuchers zu identifizieren. Dies erleichtert die Navigation und macht unsere Webseite benutzerfreundlicher. Cookies helfen uns auch, besonders beliebte Bereiche unserer Webseite zu identifizieren. Man unterscheidet zwischen Session-Cookies, die wieder gelöscht werden, sobald Sie ihren Browser schließen und permanenten Cookies, die über die einzelne Sitzung hinaus gespeichert werden.Einige Cookies sind zur Nutzung unserer Webseite erforderlich. Diese Cookies nutzen wir nicht für Analyse-, Tracking- oder Werbezwecke. Teilweise enthalten diese Cookies lediglich Informationen zu bestimmten Einstellungen und sind nicht personenbezogen. Sie können auch notwendig sein, um die Benutzerführung, Sicherheit und Umsetzung der Seite zu ermöglichen. Wir nutzen diese Cookies auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO, basierend auf unserem berechtigten Interesse, grundlegende Funktionen der Webseite anbieten zu können, um die Aufrechterhaltung der Funktionalität zu gewährleisten. Sie können Ihren Browser so einstellen, dass er Sie über die Platzierung von Cookies informiert. So wird der Gebrauch von Cookies für Sie transparent. Sie können Cookies zudem jederzeit über die entsprechende Browsereinstellung löschen und das Setzen neuer Cookies verhindern. Bitte beachten Sie, dass unsere Webseiten dann ggf. nicht angezeigt werden können und einige Funktionen technisch nicht mehr zur Verfügung stehen. Darüber hinaus setzen wir auf Basis Ihrer Einwilligung auf unserer Webseite auch technisch nicht-erforderliche Cookies ein. Zum Einsatz dieser Cookies weisen wir Sie im Folgenden gesondert hin.Genutzte Cookies auf kontist.com: IntercomGoogle Tag ManagerFacebook ConnectHotjarLinkedIn AnalyticsGoogle AnalyticsAmplitudePrismicUnsere Cookie-Policy ist hier abrufbar.Cookie-Einwilligung - Usercentrics Unsere Webseite nutzt eine Cookie-Consent-Technologie, um Ihre Einwilligung zur Speicherung bestimmter Cookies auf Ihrem Endgerät einzuholen und diese datenschutzkonform zu dokumentieren. Anbieter der verwendeten Consent-Management-Lösung ist die Usercentrics GmbH (im Folgenden „Usercentrics“). Wenn Sie unsere Webseite besuchen, werden folgende personenbezogene Daten an Usercentrics übertragen:Ihre Einwilligung(en) bzw. der Widerruf Ihrer Einwilligung(en)Ihre IP-AdresseInformationen über Ihren BrowserInformationen über Ihr EndgerätZeitpunkt Ihres Besuchs auf der WebseiteDes Weiteren speichert Usercentrics ein Cookie in Ihrem Browser, um Ihnen die erteilten Einwilligungen bzw. deren Widerruf zuordnen zu können. Rechtsgrundlage für die Datenverarbeitung ist Art. 6 Abs. 1 lit. c DSGVO. Der Einsatz von Usercentrics erfolgt, um die gesetzlich vorgeschriebenen Einwilligungen für den Einsatz von technisch nicht-notwendigen Cookies einzuholen und die entsprechenden Einwilligungen nachzuweisen (vgl. Art. 7 Abs. 1, Art. 5 Abs. 2 DSGVO). Ziel ist es, die Präferenzen unserer Nutzer zu kennen und entsprechend umzusetzen sowie diese zu Nachweiszwecken zu dokumentieren.Kontoeröffnung Wenn Sie unsere Finanzdienstleistungen in Anspruch nehmen möchten, können Sie auf unserer Webseite ein Geschäftskonto bei unserer Partnerbank – der solarisBank AG („solarisBank“) –eröffnen. Hierfür schließen Sie mit der solarisBank über unsere Webseite einen Vertrag über die Einrichtung und Nutzung eines Girokontos. Damit die solarisBank ein solches Konto in Ihrem Auftrag anlegen kann, werden durch uns folgende Daten erhoben:VornameNachnameGeburtsortGeburtsdatumStaatsangehörigkeitWohnanschriftName, Geburtsdatum und Wohnsitz aller VerfügungsberechtigtenMobilfunknummerSteuerinformationenWirtschaftlicher Zweck des Kontosbei einer juristischen Person oder einer PersonengesellschaftFirma, Name oder BezeichnungRechtsformRegisternummer soweit vorhandenAnschrift des Sitzes oder der HauptniederlassungNamen der Mitglieder des Vertretungsorgans oder der gesetzlichen Vertreter; ist ein Mitglied des Vertretungsorgans oder der gesetzliche - Vertreter eine juristische Person, dann zusätzlich deren Firma, Name oder Bezeichnung Rechtsform, Registernummer soweit vorhanden und - - Anschrift des Sitzes oder der HauptniederlassungMobilnummerName, Geburtsdatum und Wohnsitz des VerfügungsberechtigtenIm Rahmen der gemeinsamen Verantwortlichkeit gemäß Art. 26 DSGVO werden diese Daten an die solarisBank übermittelt und dort gespeichert. Zuvor müssen Sie sich je nach Rechtsform per Video Ident oder Handelsregisterauszug legitimieren. Wir und die solarisBank arbeiten mit IDnow, einem zuverlässigen Dritten, zusammen um Ihnen die Möglichkeit der Videoidentifikation zu geben. Zur Bestätigung einer Überweisung sendet die solarisBank Ihnen eine SMS-TAN, welche in der App eingegeben werden muss. Nach Eröffnung des Kontos haben Sie über die Kontist App/Web App Zugriff auf ihr Konto und können Finanztransaktionen bei der solarisBank ausführen. Wir verwenden zu dieser Datenübertragung eine aktuelle und nach neustem Stand der Technik verschlüsselte Verbindung und speichern die für die Nutzung des Kontist Services relevanten Daten in einem sicheren Rechenzentrum. Rechtsgrundlage für die Datenverarbeitung ist Art. 6 Abs. 1 lit. b DSGVO (vorvertragliche Maßnahmen und Vertragserfüllung).Zugangsgeschützter Bereich Unter „Login“ können sich Kontist-Kunden auf unserer Webseite anmelden, um in den Web-App-Bereich zu gelangen. Hierzu ist das zuvor im Registrierungsprozess festgelegte persönliche Passwort sowie die zugehörige Kunden-E-Mail-Adresse einzugeben. Die Datenverarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO (Vertragserfüllung) bzw. auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO in dem Interesse, unseren Kunden die Dienste und Informationen des zugangsgeschützten Bereichs/der Web-App zur Verfügung zu stellen. Kommunikationsservices - IntercomSie haben die Möglichkeit, mit uns postalisch, telefonisch oder per E-Mail in Kontakt zu treten. Außerdem können Sie die auf unserer Webseite bereitgestellte Live-Chatfunktion Intercom des US-amerikanischen Anbieters Intercom Inc. (im Folgenden „Intercom”) nutzen. Hierbei werden folgende Ihrer Daten an uns übermittelt und gespeichert:Vorname, NachnameE-Mail-AdresseInhalt der Anfrage/KommunikationOrt, IP-AdresseBrowserbesuchte Webseite Die Verarbeitung der personenbezogenen Daten dient uns zur Bearbeitung der Kontaktaufnahme sowie zur Kundeninteraktion. Intercom bietet uns die Möglichkeit, entsprechend den Nutzer-Erwartungen schneller und direkter in Verbindung zu kommen sowie Anfragen zu verarbeiten. Mit Intercom können wir Nutzern, sofern dies zulässig ist, Nachrichten per Live-Chat, E-Mail, SMS oder auch Push-Nachrichten schicken. Damit das möglich ist, müssen wir über eine Schnittstelle unsere Kontaktinformationen zu den Nutzern mit Intercom synchronisieren. Die Nutzung von Intercom ist optional und dient der Verbesserung und Beschleunigung unseres Kunden- und Nutzerservices.Rechtsgrundlage für die Verarbeitung der Daten ist Art. 6 Abs. 1 lit. f DSGVO. Wir haben ein berechtigtes Interesse daran, im Kontakt mit den Nutzern der Webseite zu sein und gestellte Fragen schnell und effizient zu beantworten. Zielt die Anfrage auf den Abschluss eines Vertrages ab, so ist zusätzliche Rechtsgrundlage für die Verarbeitung Art. 6 Abs. 1 lit. b DSGVO. Die Datenverarbeitung ist dann zur Durchführung (vor-)vertraglicher Maßnahmen erforderlich. Die Daten Ihrer Anfrage löschen wir nach 3 Monaten. Weitere Informationen finden Sie in den Datenschutzhinweisen und Nutzungsbedingungen von Intercom. Kontaktaufnahme/Terminvereinbarung – Calendly Wenn Sie unser Dienstleistungsportfolio kennenlernen möchten, können Sie mit uns Kontakt aufnehmen und ein Beratungsgespräch buchen. Hierzu haben Sie auf unserer Webseite die Möglichkeit, Termine mit uns zu vereinbaren. Für die Terminbuchung nutzen wir das Tool Calendly des US-amerikanischen Unternehmens Calendly LLC (im Folgenden: „Calendly“). Zum Zweck der Terminbuchung können Sie die hierfür benötigten Daten (Name, E-Mail-Adresse, Handynummer) und den Wunschtermin in die dafür vorgesehene Maske eintragen. Auf freiwilliger Basis können Sie uns dort auch eine Nachricht zur Vorbereitung auf das Gespräch hinterlassen. Die eingegebenen Daten werden für die Planung, Durchführung und ggf. für die Nachbereitung des Termins verwendet. Ihre Daten werden nach abschließender Bearbeitung des Termins gelöscht. Dies ist der Fall, wenn sich aus den Umständen entnehmen lässt, dass die Beratung beendet ist, diese zu keinem Erfolg führte und voraussichtlich auch nicht mehr führen wird und sofern keine gesetzlichen Aufbewahrungspflichten entgegenstehen. Rechtsgrundlage für die Datenverarbeitung ist Art. 6 Abs. 1 lit. f DSGVO. Wir haben ein berechtigtes Interesse an einer möglichst unkomplizierten Terminvereinbarung mit Interessenten und Kunden. Zielt Ihre Anfrage auf den Abschluss eines Vertrages ab, so ist zusätzliche Rechtsgrundlage für die Verarbeitung Art. 6 Abs. 1 lit. b DSGVO. Die Datenverarbeitung ist dann zur Durchführung (vor-)vertraglicher Maßnahmen erforderlich. Weitere Informationen finden Sie in den Datenschutzhinweisen von Calendly. Newsletter-AbonnementAuf unserer Webseite haben Sie die Möglichkeit, unseren Newsletter zu abonnieren. Wir benötigen hierfür Ihre E-Mail-Adresse. Rechtsgrundlage der Datenverarbeitung ist Art. 6 Abs. 1 lit. a DSGVO (Einwilligung), die Sie uns nach der Newsletter-Anmeldung mit einem Klick auf den entsprechenden Link in der Bestätigungs-E-Mail erteilen (sog. Double-Opt-in-Verfahren). Die Anmeldung wird erst wirksam, wenn Sie auf den Link in der Bestätigungs-E-Mail geklickt haben. Die Daten werden so lange gespeichert, wie Ihre Einwilligung Bestand hat. Diese können Sie jederzeit mit Wirkung für die Zukunft widerrufen. Nutzen Sie hierfür einfach den Link zur Abbestellung am Ende jeder E-Mail oder senden Sie eine E-Mail an privacy@kontist.com. Ihre E-Mail-Adresse wird dann aus dem Verteilersystem gelöscht.Im Rahmen der Newsletteranmeldung speichern wir über die bereits genannten Daten hinaus weitere Daten, sofern diese erforderlich sind, damit wir nachweisen können, dass Sie unseren Newsletter bestellt haben. Dies kann die Speicherung der vollständigen IP-Adresse zum Zeitpunkt der Bestellung bzw. der Bestätigung des Newsletters umfassen, sowie eine Kopie der von uns versendeten Bestätigungsmail. Die entsprechende Datenverarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO in dem Interesse, über die Rechtmäßigkeit des Newsletterversands Rechenschaft ablegen zu können. PresseverteilerSie haben die Möglichkeit, sich per E-Mail an press@kontist.com für unseren Presseverteiler anzumelden. Hierfür benötigen wir lediglich Ihre E-Mail-Adresse. Rechtsgrundlage für die Verarbeitung der Daten ist Art. 6 Abs. 1 lit. f DSGVO. Wir haben ein berechtigtes Interesse daran, mit den Medien und ihren Vertretern in Kontakt zu stehen und auf unsere Themen und Arbeit aufmerksam zu machen. Wenn Sie keine Presseinformationen mehr erhalten wollen und uns dies mitteilen, löschen wir Ihre Daten aus unserem Verteiler. Online-Bewerbung - GreenhouseUm sich auf eine offene Stelle bei uns zu bewerben, steht Ihnen auf unserer Webseite das Online-Bewerbungssystem Greenhouse des US-Anbieters Greenhouse Software, Inc. zur Verfügung. Die Übertragung Ihrer Daten und der mitgesendeten Dateianhänge erfolgt über eine verschlüsselte Verbindung. Zusätzlich bieten wir Ihnen die Möglichkeit an, sich per E-Mail zu bewerben. Ihre Bewerbungsdaten werden intern an die für die ausgeschriebene Stelle zuständigen Personen weitergeleitet. Alle Beteiligten behandeln Ihre Bewerbungsunterlagen mit der gebotenen Sorgfalt und absolut vertraulich. Die Daten, die Sie uns im Rahmen Ihrer Bewerbung preisgegeben haben, benutzen wir zur Bewerberauswahl. Rechtsgrundlage für die Datenverarbeitung ist § 26 Abs. 1 BDSG (Entscheidung über die Begründung eines Beschäftigungsverhältnisses).Nach Abschluss des Auswahlverfahrens werden die von Ihnen für das konkrete Auswahlverfahren gemachten Angaben und die übersandten Unterlagen spätestens nach sechs Monaten gelöscht, sofern wir keinen Arbeitsvertrag mit Ihnen geschlossen haben. Für den Fall, dass wir Ihre Bewerbung auch bei anderen oder zukünftigen Stellenausschreibungen berücksichtigen dürfen"
