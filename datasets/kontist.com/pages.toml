 of incorporating a business or partnership, or changing the formation of one, was how that it would increase the tax burden or in the very least complicate it. For those who have or will consider a change from freelancer to corporation, or more specifically evolving business partnerships - here is the overview of these changes.<img sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2F58a384fa3c669668eeff317708e07011d0c08080_kate-bailey.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="positio