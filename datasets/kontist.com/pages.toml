00%;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung27. Aug. 2023💡 Das Wichtigste in KürzeDie doppelte Buchführung ist eine Form der Buchhaltung, bei der jeder Geschäftsvorfall doppelt gebucht wird.Wer in Deutschland zur doppelten Buchführung verpflichtet ist, richtet sich nach der Rechtsform, dem Eintrag ins Handelsregister und der Umsatz- und Gewinnhöhe. Selbstständige müssen in der Regel keine doppelte Buchhaltung anwenden, können sich allerdings freiwillig dafür entscheiden.Die doppelte Buchführung ist vorteilhaft für Selbstständige oder KMU, die ihre wirtschaftliche Entwicklung im Blick behalten oder Investoren von ihrer Kreditwürdigkeit überzeugen wollen.Das Prinzip der doppelten Buchführung setzt Fachwissen über Buchhaltung, Bilanzierung und Steuern voraus. Wer sie anwenden will, kann die komplexen Buchhaltungsaufgaben auslagern.Thema im Detail1 - Was ist doppelte Buchführung? Definition und Bedeutung2 - Was bedeutet doppelte Buchführung für Selbstständige und KMU?3 - Für wen ist die doppelte Buchführung Pflicht?3.1 - Gibt es Ausnahmen?4 - Wichtige Grundlagen der doppelten Buchführung4.1 - Die Grundprinzipien der doppelten Buchführung4.2 - Techniken und Elemente der doppelten Buchführung: So funktioniert‘s4.3 - Bücher und Nebenbücher4.4 - Bilanz und GuV4.5 - Die Konten in der doppelten Buchführung4.6 - Doppelte Buchführung: Beispiel5 - Was müssen Selbstständige bei der doppelten Buchführung beachten?5.1 - Vorteile und Nachteile der doppelten Buchführung für Selbstständige5.2 - Schritt-für-Schritt-Anleitung: So implementieren Selbstständige die doppelte Buchführung6 - Mit Unterstützung profitieren Selbstständige von doppelter BuchführungFAQ rund um die doppelte Buchführung<img srcSet="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1080&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fkontist-demo.cdn.prismic.io%2Fkontist-demo%2F3a30e6a6-85e7-4365-a64e-a9c4eb7fc781_newsletter-example-img.svg&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Kontist NewsletterErhalte alle Neuigkeiten über die Kontist App! Smartes Banking, innovative Buchhaltung sowie viele, hilfreiche Tipps für Selbstständige direkt in dein Postfach!Zum Newsletter anmeldenWas ist doppelte Buchführung? Definition und BedeutungWenn du dich selbstständig machst oder ein kleines oder mittleres Unternehmen (KMU) gründest, begegnet dir früher oder später die doppelte Buchführung. Bevor wir alle Fragen dazu beantworten, klären wir zunächst die Basics.InfoDie doppelte Buchführung ist eine bestimmte Form der Buchführung und wird auch doppelte Buchhaltung oder Doppik genannt. Anders als bei der einfachen Buchführung – der Einnahmen-Überschussrechnung (EÜR) – wird jeder Geschäftsvorfall doppelt erfasst: auf einem Konto und einem Gegenkonto. Das Ziel ist, dadurch am Ende des Jahres eine ausgeglichene Bilanz zu erreichen. Was bedeutet doppelte Buchführung für Selbstständige und KMU?Für viele KMU und für einige Selbstständige ist die doppelte Buchführung fester Bestandteil ihres Controllings. Zwar bedeutet „doppelt“ tatsächlich mehr Aufwand im Business-Alltag. Allerdings bietet diese Form der Buchführung einige Vorteile im Kontext der Geschäftsführung. Sie kann dir sogar an anderer Stelle Zeit und Geld sparen. Die doppelte Buchführung spielt zum Beispiel eine wichtige Rolle für die finanzielle Transparenz in der Buchhaltung: Das doppelte Buchen von Geschäftsvorfällen ist wie ein Kontrollmechanismus und gibt dir eine vollständige und nachvollziehbare Darstellung deiner betrieblichen Finanzen. Damit behältst du deinen wirtschaftlichen Erfolg im Blick und kannst dein Budget besser planen. Außerdem stellt eine doppelte Buchhaltung sicher, dass deine Bilanzsumme ausgeglichen ist und du mögliche Fehler frühzeitig erkennst. Eine fehlerfreie doppelte Buchhaltung ist unter anderem wichtig, weil sie die Grundlage für deinen Jahresabschluss und die damit verbundene Bilanz und die Gewinn- und Verlustrechnung (GuV) bildet.InfoDie Bilanz ist zentrales Element der doppelten Buchführung. Sie ist ihre Grundlage und gleichzeitig ihr Ergebnis. Grundsätzlich lässt sich an der Bilanz die finanzielle Lage eines Unternehmens ablesen. Sie wird zu Beginn und zum Ende eines Geschäftsjahres erstellt. Die Schlussbilanz eines Jahres muss dabei identisch mit der Eröffnungsbilanz des Folgejahres sein. Für wen ist die doppelte Buchführung Pflicht?Wer zur doppelten Erfassung von Buchungen verpflichtet ist, regelt das Handelsgesetzbuch (HGB) in § 238. Demnach entscheiden die Rechtsform, der Eintrag in das Handelsregister und die Höhe von Umsatz und Gewinn über die Pflicht für die doppelte Buchführung. Beispiele für Unternehmen und Personen, die ihre Geschäftsvorfälle doppelt erfassen müssen, sind unter anderem:Kapitalgesellschaften wie GmbHs oder AGsPersonengesellschaften wie KGs oder OHGsEinzelunternehmen: Doppelte Buchführung ist verpflichtend bei mehr als 600.000 € Umsatz oder 60.000 € Gewinn in zwei aufeinanderfolgenden Geschäftsjahren.Gibt es Ausnahmen?Info➡️ Tipps für die EÜR und wie du sie in Elster erstellst, fasst unser EÜR-Ratgeber für dich zusammen.Für Gewerbetreibende ohne Handelsregistereintrag gelten die genannten Umsatz- und Gewinngrenzen: Sie sind befreit, wenn ihr Umsatz im vergangenen Jahr unter 600.000 € lag oder der Vorjahresgewinn die Grenze von 60.000 € nicht überschritten hat.Ein smartes Bankkonto und innovative Buchhaltung in einer App?Das kann Kontist! Mit unserem Geschäftskonto hast du ab sofort einen besseren Überblick über deinen Finanzen. Zudem lässt sich auch deine Buchhaltung mit Hilfe von KI (Künstliche Intelligenz) in Handumdrehen erledigen!Jetzt entdeckenAchtungEntscheidest du dich im Rahmen deiner Selbstständigkeit freiwillig für die doppelte Buchführung, bist du drei Jahre lang an deine Entscheidung gebunden. Wichtige Grundlagen der doppelten BuchführungBevor wir uns der Frage widmen, ob sich die doppelte Buchführung für deine Selbstständigkeit lohnen könnte, schauen wir uns die Grundprinzipien und Techniken der doppelten Buchhaltung an.Die Grundprinzipien der doppelten BuchführungDas wichtigste Prinzip kennst du jetzt bereits: Jeder Vorgang muss doppelt gebucht werden. Wie das funktioniert, erfährst du im nächsten Abschnitt. Vorher erläutern wir für dich vier weitere Prinzipien, an denen sich die doppelte Buchführung orientiert:Bilanzwahrheit: Jede Transaktion soll genau erfasst und dokumentiert werden, um eine wahrheitsgemäße Bilanz zu gewährleisten.Bilanzklarheit: Alle Finanzdaten sollen so aufbereitet sein, dass die Bilanz und andere Abschlüsse klar und verständlich sind.Bilanzkontinuität: Die doppelte Buchführung soll kontinuierlich und über einen längeren Zeitraum geführt werden, um Vergleichbarkeit zu gewährleisten.Bilanzidentität: Die Werte in der Eröffnungsbilanz eines Wirtschaftsjahres sollen mit den Werten der Schlussbilanz des vorangegangenen Wirtschaftsjahres übereinstimmen. InfoDie genannten Prinzipien gibt das Handelsgesetzbuch vor. Es handelt sich dabei um die Grundsätze ordnungsgemäßer Bilanzierung. Da die doppelte Buchführung eng mit der Bilanz zusammenhängt, unterliegt sie ebenfalls diesen Grundsätzen. Techniken und Elemente der doppelten Buchführung: So funktioniert‘sEinige Elemente der doppelten Buchführung sind dir in diesem Artikel bereits begegnet: Konto und Gegenkonto, Soll und Haben, Bilanz und GuV. Außerdem gibt es sogenannte Bücher.Wie all das zusammenhängt, klären wir jetzt auf – und zeigen dir, wie die doppelte Buchführung in der Praxis funktioniert.Bücher und NebenbücherFalls du dich gefragt hast, warum es Buchführung heißt: Vor der Digitalisierung wurden Geschäftsvorfälle in großen Büchern festgehalten. Heute müssen Unternehmen zwar immer noch „Buch führen“, allerdings funktioniert das bequem per Software.Ganz verschwunden sind die Bücher allerdings nicht. Geschäftsvorfälle müssen heute noch immer in Büchern eingetragen werden. Bei der doppelten Buchführung gibt es das Grundbuch, in dem alle Geschäftsvorgänge chronologisch erfasst werden, ähnlich wie in einem Journal,das Hauptbuch, in dem alle Vorgänge verschiedenen Sachkonten zugeordnet werden, unddie Nebenbücher, die als Ergänzung für das Hauptbuch dienen und zusätzliche Details zu einzelnen Buchungen enthalten oder die Buchungen für einzelne Kunden bündeln.Bilanz und GuVWer zur doppelten Buchführung verpflichtet ist, schließt diese am Ende des Jahres mit einem Jahresabschluss ab. Er enthält die Bilanz und die GuV.Die Bilanz stellt alle Vermögenswerte und Schulden eines Unternehmens gegenüber und ist eine Momentaufnahme der wirtschaftlichen Situation des Unternehmens.Die GuV ist ein Bestandteil der Bilanz und stellt Aufwendungen und Erträge gegenüber. Aus der Summe ergibt sich die Höhe der Gewinne oder Verluste, die ein Unternehmen erzielt hat.Die Konten in der doppelten BuchführungUm die Vermögenswerte und Schulden für die Bilanz sowie die Aufwände und Erträge für die GuV gegenüberstellen zu können, werden die Werte in sogenannten Konten eingetragen. Dabei handelt es sich nicht um Girokonten, sondern um virtuelle Konten. Für die Doppik sind zum einen die Bestandskonten für die Bilanz relevant, die der Aktiva- oder Passiva-Seite der Bilanz zugeordnet sind. Sie geben Auskunft darüber, wofür Geld eingesetzt wird und woher es kommt:Aktiva sind Vermögenswerte deines Unternehmens. Die Aktivseite der Bilanz betrifft Geschäftsvorfälle, die deine Ausgaben betreffen, zum Beispiel für Immobilien, Maschinen oder Produktionsmittel.Unter Passiva versteht man Eigenkapital, Fremdkapital, Verbindlichkeiten und Rückstellungen – die Passivseite der Bilanz gibt also Aufschluss über die Vermögensherkunft. Für einen besseren Überblick werden die Bestandskonten der Aktiv- und Passivseite in der Regel weiter unterteilt, etwa in Konten für Verbindlichkeiten, Kasse, Anlagen oder Grundstücke.Neben den Bestandskonten der Bilanz gibt es die Erfolgskonten für die GuV, die sich in Aufwand- und Erlöskonten unterteilen. Auf diese Konten werden alle Geschäftsfälle gebucht, die den Gewinn oder Verlust eines Unternehmens aktiv beeinflussen. Sie werden jährlich auf 0 gesetzt. Am Ende des Jahres werden Aufwände und Erträge gegengerechnet. Ein Plus bedeutet Gewinn, ein Minus bedeutet Verlust. Die Erfolgskonten der GuV sind Teil der Bilanz und stehen auf der Passivseite – denn sie beeinflussen das Eigenkapital des Unternehmens.Jedes Konto, egal ob Bestands- oder Erfolgskonto, verfügt über eine Soll- und über eine Haben-Seite. Grafisch werden Bilanz- und GuV-Konten oft als T-Konto visualisiert – also als zweispaltige Tabelle, bei der die linke Spalte die Soll- und die rechte Spalte die Haben-Seite darstellt.InfoBei Bestandskonten auf der Aktivseite werden Zahlungszuflüsse im Soll gebucht und Zahlungsabflüsse im Haben. Auf der Passivseite wird genau umgekehrt gebucht.Doppelte Buchführung: BeispielWichtig bei der doppelten Buchführung ist, dass jeder Geschäftsvorfall auf zwei Konten gebucht wird, damit die Bilanz ausgeglichen ist. Zum einen muss die Verwendung von Mitteln festgehalten werden und zum anderen, woher die Mittel kommen.Damit du dir den Prozess der doppelten Buchführung besser vorstellen kannst, sehen wir uns ein vereinfachtes Beispiel an. Nehmen wir an, du bist selbstständige Grafikdesignerin und hast dieses Jahr deinen ersten großen Auftrag abgeschlossen. Auf der Aktivseite des Bestandskontos „Bank“ steht bereits ein Wert von 10.000 € aus dem vergangenen Wirtschaftsjahr. Dieser Wert findet sich ebenfalls auf der Passivseite im Eigenkapitalkonto.Du stellst eine Rechnung und dein Kunde zahlt dir 5.000 €. Auf deinem Erlöskonto „Honorare“ und auf der Soll-Seite deines Bestandskontos „Bank“ verbuchst du 5.000 €.Angenommen, du hast keine Ausgaben mehr, dann ergibt sich aus der GuV ein Gewinn von 5.000 €. Die 5.000 € werden auf der Passivseite deiner Bilanz im Eigenkapitalkonto als Haben verbucht.Die Aktiv- und Passivseite ist damit ausgeglichen: Die Bilanzsumme beider Seiten beträgt 15.000 €.AchtungIn der Praxis ist die doppelte Buchführung meist wesentlich umfangreicher. Wenn du zum Beispiel Software oder Hardware kaufst, musst du Abschreibungen beachten. Nimmst du dann noch einen Kredit auf, wird es schnell noch komplexer.Was müssen Selbstständige bei der doppelten Buchführung beachten?Wenn du eine Gründung planst oder dich selbstständig machen möchtest, solltest du frühzeitig prüfen, ob eine Pflicht zur doppelten Buchführung für dich besteht. In der Regel sind sie nicht dazu verpflichtet – d'
