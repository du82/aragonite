ist-demo%2FZ6Xdr5bqstJ9-WMs_HOME_IPHONE_HERO_DE.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain;object-position:center" loading="lazy"/>Das Kontist GeschäftskontoDein Konto für einen perfekten Start für dein Business.Egal ob du als Freiberufler selbständig bist, in einer GbR bist oder eine GmbH oder UG hast.Kontist bietet für alles eine Lösung. Mit persönlichem Kundenservice in deutscher und englischer Sprache.Kostenloses Konto eröffnen<img alt="feature Graphic" sizes="100vw" srcSet="/_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44POZbqstJ99n_a_VerticalCardFront.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44POZbqstJ99n_a_VerticalCardFront.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44POZbqstJ99n_a_VerticalCardFront.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44POZbqstJ99n_a_VerticalCardFront.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44POZbqstJ99n_a_VerticalCardFront.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44POZbqstJ99n_a_VerticalCardFront.png%3Fauto%3Dformat%2Ccompress%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image/?url=https%3A%2F%2Fimages.prismic.io%2Fkontist-demo%2FZ44POZbqstJ99n_a_VerticalCardFront.png%3