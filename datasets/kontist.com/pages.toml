;min-height:100%;max-height:100%;object-fit:cover" class="rounded-full" loading="lazy"/>Melchior NeumannKontist Steuerberatung21. Feb. 2023blog.last_updated_placeholder 20. Apr. 2023💡 Das Wichtigste in Kürze:Gewerbe anmelden ist ein essentieller Schritt für Selbstständige in Deutschland. Damit registrierst du deine berufliche Tätigkeit offiziell beim Gewerbeamt und erhältst die Gewerbeanmeldung, die rechtliche Sicherheit bietet und steuerliche Pflichten, aber auch Vorteile bringt.Tipps:Bereite alle notwendigen Unterlagen vor (Personalausweis, Meldebescheinigung, etc).Beachte die Anmeldefristen, um Bußgelder zu vermeiden.Informiere dich über eventuelle Branchen- oder Berufsspezifische Besonderheiten, die für dich und deine Tätigkeit gelten.Thema im Detail1 - Rechtsformen bei der Gewerbeanmeldung1.1 - Abweichungen bei den Personengesellschaften1.2 - Abweichungen bei den Kapitalgesellschaften2 - Prüfen, ob du überhaupt eine Gewerbeanmeldung brauchst2.1 - Art deiner Tätigkeit2.2 - Anmeldung als Freiberufler2.3 - Selbständigkeit ohne Gewinnerzielungsabsicht2.4 - Achtung: Du bist bereits selbständig, wenn...2.5 - Der große Irrtum mit dem Kleingewerbe2.6 - Verwechslung mit der Kleinunternehmerregelung3 - Der richtige Zeitpunkt - Wann muss das Gewerbe angemeldet werden?3.1 - Ausgaben vor der Gewerbeanmeldung4 - Was du vor der Gewerbeanmeldung erledigen solltest5 - Die Gewerbeanmeldung5.1 - Formular zur Gewerbeanmeldung5.2 - Geschäftsidee bzw. angemeldete Tätigkeit5.3 - Name des Unternehmens5.4 - Kleingewerbe im Nebenerwerb anmelden5.5 - Gewerbe online anmelden5.6 - Kosten der Gewerbeanmeldung6 - Was nach der Gewerbeanmeldung alles auf dich zukommt6.1 - Anmeldung beim Finanzamt6.2 - Brauche ich einen Steuerberater?6.3 - Kammerzugehörigkeit bei der IHK/HWK6.4 - Eintragung ins Handelsregister6.5 - Sonstige Anmeldungen6.6 - Berufsgenossenschaft - gesetzliche Unfallversicherung6.7 - Bundesagentur für Arbeit6.8 - Krankenversicherung7 - Gewerbe ummelden oder abmeldenDie meisten Gründer haben schon einmal etwas von der Gewerbeanmeldung gehört und denken deshalb zuerst daran ein Gewerbe anzumelden. Doch hier begehen viele schon den ersten Fehler. Denn es gibt Situationen, in denen eine Gewerbeanmeldung schlichtweg falsch ist und später zum Nachteil für dich werden kann.Deshalb setzen wir in unserer Schritt-für-Schritt Anleitung einen Schritt davor an.Rechtsformen bei der GewerbeanmeldungBevor wir mit dem ersten Schritt der Gewerbeanmeldung starten, sollte ich das Thema Rechtsformen ansprechen. Dieser Artikel richtet sich in erster Linie an Einzelunternehmer, die ihr Gewerbe anmelden möchten. Da die Gründungsprozesse bei den unterschiedlichen Rechtsformen sehr unterschiedlich verlaufen können, würde dieser Leitfaden mehr verwirren als helfen, wenn ich versuchen würde, alle Rechtsformen in einem Durchgang zu besprechen.Im Wesentlichen unterscheidet man zwischen EinzelunternehmenPersonengesellschaftenKapitalgesellschaften.Abweichungen bei den PersonengesellschaftenPersonengesellschaften sind fast immer Gründungsteams, in denen sich alle Gründer (= Gesellschafter) aktiv einbringen möchten und planen, gemeinsam ein Unternehmen aufzubauen. Die bekanntesten Rechtsformen sind:die GbR (Gesellschaft bürgerlichen Rechts)die OHG (Offene Handelsgesellschaft)die KG (Kommanditgesellschaft).Der wesentliche Unterschied zum Einzelunternehmen ist - welch Überraschung - die Anzahl der Gründer. Der Prozess, um das Gewerbe anzumelden, ähnelt dem Prozess der Einzelunternehmen sehr stark. Hinzu kommt aber noch die Einigung und Einbindung der Gründer. Oder kurz: Die Gründer brauchen vor der eigentlichen Gewerbeanmeldung einen Gesellschaftsvertrag, in denen Pflichten, Aufgaben, Risiken und Gewinnverteilung geregelt werden.Je nachdem, wie aufwendig die gewählte Rechtsform ist (GbR = sehr schlank, KG = viele gesetzliche Bestimmungen), müssen dabei mehr oder weniger rechtliche Formalien erfüllt werden.Abweichungen bei den KapitalgesellschaftenKapitalgesellschaften unterscheiden sich in ihrer rechtlichen Struktur deutlich von Einzelunternehmen.Wenn du eine solche Gesellschaft gründest, erschaffst du rechtlich gesehen eine vollkommen neue Persönlichkeit. Aus diesem Grund werden Kapitalgesellschaften auch juristische Personen genannt. Diese Personen können selbstständig am Geschäftsverkehr teilnehmen und du könntest sogar selbst mit deiner Kapitalgesellschaft Rechtsgeschäfte abschließen. So etwas wäre mit einem Einzelunternehmen undenkbar.Die am häufigsten verwendeten Kapitalgesellschaften in Deutschland sind:die UG (Unternehmergesellschaft)die GmbH (Gesellschaft mit beschränkter Haftung)die AG (Aktiengesellschaft)Um ein solches rechtliches Gebilde zu erschaffen, brauchst du auf jeden Fall einen notariell beurkundeten Gründungsvertrag und ein Geschäftskonto. Die Eintragung im Handelsregister beim örtlichen Amtsgericht ist deutlich aufwendiger. Wenn du planst, eine Kapitalgesellschaft zu gründen, wird dir der folgende Text nicht wirklich weiterhelfen.Normalerweise hilft dir der Notar, der sich um die Beurkundung des Gesellschaftsvertrags kümmert, auch bei allen anderen Gründungsfragen. Wenn du gar keine Ahnung von der Thematik hast, solltest du dir am besten einen Notar suchen, der Teil einer Kanzleigemeinschaft ist, in der auch Steuerberater aktiv sind. Durch einen solchen Zusammenschluss hast du alle Ansprechpartner an einem Ort und kannst sichergehen, dass alle Aspekte der Gründung beachtet werden.Schritt 1: Prüfen, ob du überhaupt eine Gewerbeanmeldung brauchstNicht jede Selbstständigkeit erfordert eine Gewerbeanmeldung. Rein rechtlich betrachtet musst du nur ein Gewerbe anmelden, wenn deine zukünftigen Einnahmen vom Finanzamt als “Einkünfte aus Gewerbebetrieb” klassifiziert werden.Grundsätzlich gibt es zwei Gründe, die das Finanzamt dazu veranlassen könnte, dein Unternehmen nicht als Gewerbe anzusehen. Das ist immer der Fall, wenndie Art deiner Tätigkeit keine gewerbliche Tätigkeit ist oderdu mit deiner Selbständigkeit keinen Gewinn erzielen möchtest.Art deiner TätigkeitFreiberufliche Tätigkeiten unterliegen nicht der Gewerbeordnung und müssen somit nicht als Gewerbe angemeldet werden. Wenn du also Freiberufler bist, kannst du hier aufhören zu lesen. Du musst weder ein Gewerbe anmelden noch musst du später Gewerbesteuer zahlen.Doch welche Berufe als freiberufliche Tätigkeit und welche als gewerblich eingestuft werden, lässt sich nicht immer ganz trennscharf voneinander unterscheiden. Im § 18 EStG (Einkommensteuergesetz) sind einige Berufe aufgezählt, die immer als freiberuflich gelten (sogenannte Katalogberufe):Ärzte, Zahnärzte und TierärzteRechtsanwälte, Patentanwälte und NotareVermessungsingenieure und IngenieureArchitektenWirtschaftsprüfer, Steuerberater beratende Betriebswirte, vereidigte BuchprüferHeilpraktiker und KrankengymnastenJournalisten, Dolmetscher Bildberichterstatterweitere BerufeDazu kommen Berufe mit ähnlichen Aufgabenbereichen und Tätigkeiten, die wissenschaftlich, künstlerisch, schriftstellerisch, unterrichtend oder erzieherisch sind.Wie dir sicherlich auffällt, lassen diese rechtlichen Regelungen einen großen Interpretationsspielraum zu und es gibt Berufe, die nicht ganz eindeutig als freiberuflich eingeordnet werden können.Die Differenzierung zwischen gewerblicher und freiberuflicher Tätigkeit ist vor allem wegen der Gewerbesteuer entscheidend. Freiberufler sind grundsätzlich von der Zahlung der Gewerbesteuer befreit und müssen somit auch keine Gewerbesteuererklärung abgeben.Das bedeutet aber nicht, dass Gewerbetreibende in Summe tatsächlich mehr Steuern zu zahlen haben. Da die gezahlte Gewerbesteuer fast vollständig auf die private Einkommensteuererklärung angerechnet werden kann, sorgt die Gewerbesteuerpflicht unterm Strich nur dafür, dass Gewerbetreibende Gewerbesteuer an die zuständigen Gemeinden zahlen müssen und im Gegenzug den (fast) gleichen Betrag weniger Einkommensteuer zahlen.Dieses ganze Vorgehen wirkt auf dem ersten Blick typisch deutsch und bürokratisch - und tatsächlich hat das Ganze rein politische Gründe. Die Gewerbesteuer steht voll und ganz den Gemeinden zu, in denen der Gewerbetreibende seinen Sitz hat. Die Einkommensteuer steht hingegen dem Bund, den Ländern und den Gemeinden gemeinsam zu.Da die Gemeinden in den kommenden Jahren wahrscheinlich nicht auf ihre wichtigste Einnahmequelle verzichten werden, wird sich an dem aktuellen System zeitnah auch nichts ändern.Anmeldung als FreiberuflerDass Freiberufler kein Gewerbe anmelden müssen, heißt nicht, dass sie sich um gar nichts kümmern müssen. Sie können sich lediglich den Gang zum Gewerbeamt sparen.Stattdessen solltest du direkt zu Schritt 5 springen und den Fragebogen zur steuerlichen Erfassung ausfüllen und an das Finanzamt senden. Als Freiberufler musst du das eigenständig tun, da der Fiskus, anders als bei Gewerbetreibenden, ansonsten nichts von deiner Neugründung erfährt.Eine Eintragung im Handelsregister ist für Freiberufler ebenfalls nicht notwendig. Wenn das Unternehmen eines Freiberuflers so groß wird, dass es einen “in kaufmännischer Weise eingerichteten Geschäftsbetrieb” erfordert, handelt es sich in der Regel nicht mehr um eine freiberufliche Tätigkeit, sondern um eine unternehmerische Tätigkeit. In diesem Fall müsste ein Gewerbe angemeldet werden. Wann dies der Fall ist, erfährst du weiter unten im Abschnitt über das Handelsregister.Meistens sind Freiberufler keine Pflichtmitglieder in der Industrie- und Handelskammer oder in der Handwerkskammer, da viele Berufsstände eigene Kammern haben (Bsp: Rechtsanwaltskammer, Architektenkammer oder Steuerberaterkammer).Selbständigkeit ohne GewinnerzielungsabsichtWenn du mit einem Hobby Geld verdienst, musst du nicht zwingend eine Tätigkeit anmelden. Als Freiberufler oder Gewerbetreibender wirst du erst angesehen, wenn du tatsächlich eine Gewinnerzielungsabsicht hast und deine Tätigkeit auf Dauer ausübst.Wenn du in deiner Freizeit also gerne schreibst und deine Texte in deinem privaten Blog veröffentlichst, bist du kein Unternehmer. Auch nicht, wenn du gelegentlich Spenden oder andere Zuwendungen von treuen Lesern bekommst, diese aber nie deine Ausgaben decken.Das Finanzamt spricht in diesem Fall von Liebhaberei und stuft die Tätigkeit als Hobby ein. Wenn der ein oder andere Euro dabei erzielt wird, ist das grundsätzlich unproblematisch, solange du keine dauerhaften Gewinne erzielst. Allerdings darfst du im Gegenzug die Kosten für das Webhosting, Programmierarbeiten oder Fotorechte auch nicht als Betriebsausgaben geltend machen.Achtung: Du bist bereits selbständig, wenn...Gerade das Internet hat in den letzten Jahren viele Konstellationen möglich gemacht, in denen Menschen zunächst nur einem Hobby nachgegangen sind und später nicht nur Einnahmen sondern auch (hohe) Gewinne erzielt haben.Grundsätzlich kannst du davon ausgehen, dass du selbstständig bist, wenn du eine Tätigkeit dauerhaft ausübst und damit ein Einkommen erzielst. Du musst diese Tätigkeit auf jeden Fall anmelden und die Einkünfte versteuern. Das gilt sowohl für YouTuber, für Blogger mit geschäftsmäßig ausgerichteten Blogs, für Instagram-Kanäle, die über Werbebuchungen finanziert werden oder auch für Onlinehändler auf eBay, Amazon oder Nischenseiten wie zum Beispiel Kleiderkreisel.Wenn du mit deiner Onlinetätigkeit selbständig bist, solltest du dich unbedingt mit dem Thema beschäftigen und deine Selbständigkeit anmelden. Eine Steuerprüfung im Nachhinein kann richtig teuer werden.Der große Irrtum mit dem KleingewerbeIch höre und lese immer wieder die Frage, wie man Kleingewerbe anmeldet. Häufig wird die Frage dann von einer Diskussion über Steuerbefreiungen oder -erleichterungen für Kleingewerbetreibende begleitet.Ich weiß nicht, woher der Mythos kommt, aber ein Kleingewerbe ist kein anderes Gewerbe und die Anmeldung läuft genau wie bei jedem anderen Unternehmen auch. Es gibt grundsätzlich auch keine Steuererleichterungen.Es geht sogar noch weiter: Das Wort "Kleingewerbe" gibt es so im Steuer- und Handelsrecht gar nicht.Wenn man nach einer Definition für Kleingewerbe sucht, findet man vor allem die Auslegung, dass Kleingewerbe Unternehmen sind, die nicht vom Handelsgesetz erfasst werden. Gemeint sind damit Einzelunternehmen, die nicht kaufmännisch geführt werden müssen. Ob man wirklich als Kleingewerbe einzustufen ist, kann leider nicht so einfach beantwortet werden. Dies hängt von vielen Kriterien ab und ist nicht einmal gesetzlich geregelt. Als Richtwerte können bspw. die Anzahl der Mitarbeiter und die Höhe der Umsätze herangezogen werden. Als vereinfachtes Beispiel könnte man sagen, dass bei einem Umsatz von unter 250.000 Euro und die Beschäftigung von weniger als 5 Mitarbeitern für ein Kleingewerbe sprechen. Sollten jedoch 100 Mitarbeiter beschäftigt werden, so sprechen die Gründe gegen ein Kleingewerbe.Für die Gewerbeanmeldung spielt das jedoch keine Rolle. Auch Kleingewerbe müssen ein Gewerbe anmelden. Lediglich auf die Eintragung im Handelsregister kann verzichtet werden.Verwechslung mit der Kleinunternehm'
