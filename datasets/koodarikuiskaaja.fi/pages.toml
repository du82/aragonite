["https://koodarikuiskaaja.fi/mista-on-kyse"]
title = "Mistä on kyse? – Koodarikuiskaaja"
description = "Tässä on kyse devaajista, jotka haluaisivat edetä urallaan ja päästä vaativampiin projekteihin, mutta se tarkoittaisi parikoodaamista, tiimityötä, asiakaspalavereita, esiintymistä, projektivastuuta tai jotain muuta, mikä tuntuu mahdottomalta."
full_description = "Tässä on kyse niistä lukuisista hyvistä ideoista ja tärkeistä mielipiteistä, jotka jäivät sanomatta, kun lauseiden ”Olisiko kenelläkään mitään lisättävää?” ja ”Jahas, no mennääs sitten eteenpäin.” välissä oli vain viiden sekunnin painostava hiljaisuus. Tässä on kyse niistä hetkistä, kun kutsu palaveriin tai kehityskeskusteluun saapuu. Sähköpostin kilahtaessa kädet hikoavat välittömästi ja alkaa vähän ahdistaa. Tässä on kyse kaikista niistä tilanteista, joissa heikompi tietämys on voittanut vahvoilla mielipiteillään paremman ymmärryksen mutta hiljaisen äänen. Tässä on kyse devaajista, jotka haluaisivat edetä urallaan ja päästä vaativampiin projekteihin. Se tarkoittaisi parikoodaamista, asiakaspalavereita, esiintymistä, projektivastuuta tai jotain muuta, mikä tuntuu mahdottomalta. Tässä on kyse siitä, että työelämässä välttämättömiä taitoja ovat empaattisuus, kohtaaminen, vuorovaikutus ja tiimityö. Näitä ei opeteta oikein missään. Näihin ei valmenneta juuri mitenkään. Näiden oppiminen yksin on joko työlästä tai mahdotonta. Siitä tässä on kyse. Siksi täällä ollaan. Tavoitteenani on nostaa 1000 devaajan tasoa Katson tason nousseen, kun: aiemmin vaikea asia muuttuu vähän helpommaksi rimaa voi hilata jälleen pikkuisen korkeammalle uskallus lisääntyy, ahdistus vähenee ura, projekti, yritys, tilanne nytkähtää eteenpäin uusi ovi aukeaa. Joidenkin elämässä vaikutus on suuri, joidenkin pieni. Kaikkien elämässä se on kuitenkin eteenpäin vievä. Tällaisia tasonnousuja on tapahtunut ”Elisasta oli valtavan iso apu omalla urallani. Aloittaessani esihenkilön tehtävissä Evermadella, ei meillä ollut vakiintuneita toimintatapoja esihenkilönä toimimiseen. Yhtäkkiä itselläni oli kymmenhenkinen tiimi johdettavana ja paljon uutta opeteltavaa. Elisan kanssa sparrailu auttoi hahmottamaan omaa roolia, ja mihin oli tärkeää keskittyä. Elisan ymmärrys toimialasta sekä luovien henkilöiden ja kehittäjien kanssa työskentelystä oli valtava etu. Sain konkreettisia työkaluja arjen työhön ja erilaisten tilanteiden kohtaamiseen.” – Jenni Soudunsaari, Evermade ”Elisan kurssit koskettavat taitoja, joita jokainen tarvitsee työssään (ja työn ulkopuolella) – ihmistaitoja. Meidän työyhteisössä järjestimme Elisan kanssa koulutuksen, jonka aiheena oli palautteenanto ja vastaanottaminen. Saimme koulutuksesta mahtavia tuloksia sekä loistavaa palautetta henkilöstöltämme.” – Laura Toropainen, New Things Co ”Erittäin hyvin vedetty :D! Nämä ovat selvästi sulle intohimoaiheita ja se näkyy taustatyön laajuudessa sekä kyvystä yhdistellä eri konsepteja ja lähteitä toisiinsa käytännön ongelmien ratkaisemiseksi. Ja nimenomaan se käytännönläheisyys tuo minusta suurimman arvon – on yllättävän innostavaa tajuta, että hähmäisiin ja ikäviin sosiaalisen elämän ongelmiin on myös olemassa tutkimusta, työkaluja ja valmiiksi pureskeltua ajattelua ratkaisuksi!” – tiiviskurssiosallistuja, Arado ”Arvostin meidän yhteistyössä sitä, että toimit minun tukena teknologiatiimin organisaatiomuutoksen murrosvaiheessa. Kuuntelit ja annoit arvokasta palautetta. Kiitos siitä!” – Veronica Rinnelä, Mezzoforte Kuulostaako tarpeelliselta, hyödylliseltä tai muuten vain kiinnostavalta? Suuntaa lukemaan lisää blogin puolelta. Sukella aiheeseen podcastia kuuntelemalla. Tutustu koodarikuiskaajaan. Tarkista palvelut ja ota yhtyettä."
