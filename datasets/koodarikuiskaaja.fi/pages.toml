["https://koodarikuiskaaja.fi/blogi/haastattelu-kirjoittava-asiantuntija-parjaa-paremmin"]
title = "Haastattelu: Kirjoittava asiantuntija pärjää paremmin - Koodarikuiskaaja"
description = "Kirjoittaminen liittyy kaikkeen. Monen asiantuntijan työstä yllättävän iso osa on kirjoittamista, vaikka siihen ei yleensä kiinnitetä huomiota."
full_description = "Haastateltavana on Mirjami Haimelin, Reaktorilla sisältösuunnittelijana työskentelevä ammattikirjoittaja, joka on kirjoittanut yhdessä Satu Rämön kanssa kaksi pian ilmestyvää kirjaa: Kynä – Kaikki tärkeä kirjoittamisesta Kynä – Tehtäviä oman äänen löytämiseen Mirjami, miksi kynään tarttuminen on niin vaikeaa? Noh, yleensä ei tarvitse kauaa jutella ihmisen kanssa, kun keskusteluun putkahtaa joku alakoulun äikän aine tai muu lapsuuden tai nuoruuden kokemus. Meitä leimaa kirjoittajina hyvin paljon kouluaikoina saatu palaute. Kokemus kirjoittamisesta saattaakin rajoittua tiettyihin vaikeaksi koettuihin formaatteihin, ja niiden perusteella homma voi tuntua tahmealta ja epämukavalta. Se vääristää koko käsitystä kirjoittamisesta ja siitä, mitä kaikkea teksteillä voi tehdä. Kirjoitusblokit liittyvät monesti psykologisiin syihin. Sitä pelkää epäonnistuvansa ja ajattelee, että mokaa, jos ei osu kerralla maaliin. Silloin kannattaa miettiä, mikä on pahinta, mitä voisi käydä. Jos vaikka asiakas sanoo, että ei tätä tekstiä voi käyttää, niin mikäs siinä, sitten se pitää kirjoittaa uusiksi. Samalla voi myöntää, että tämä oli mulle vaikeaa ja pyytää jotakuta auttamaan. Kannattaa myös yrittää tunnistaa kipukohtia: miksi juuri tämä tekstilaji tuottaa mulle vaikeuksia? Sijoittuuko sen tekeminen esimerkiksi sellaiseen kohtaan, että teksti pitää kirjoittaa aina kiireessä tai muuten stressaavassa tilanteessa? Vai onko taustalla jotain sellaista, ettei oikeasti tiedä, mitä asiasta pitäisi sanoa? Moni myös pelkää, ettei osaa pilkkuja tai yhdyssanoja. Tai että oma viesti ei tule tekstimuodossa ymmärretyksi oikein. Ajatellaan jo lähtökohtaisesti, että olen huono enkä osaa. Tosiasiassa kirjoittaminen on taito, jota kuka tahansa voi kehittää. Pala kerrallaan sitä voi ottaa haltuun. Kuinka kirjoittajana sitten voi kehittyä? Harjoittelemalla! Kirjoittamalla ja lukemalla paljon, ja mahdollisimman erilaisia tekstejä. Lukeminen on järkevää jo oman ajattelun kehittymisen takia, mutta sitä kannattaa tehdä myös tietoisesti, kirjoittajan housut jalassa. Kun olet lukenut tekstistä vaikka alun, pysähdy ja mieti, miten se oli rakennettu. Toimiko se, oliko se hyvä? Tuntuiko se vaikealta vai herättikö se uteliaisuuden? Pikkuhiljaa oma analysointitaito kehittyy ja tekstin taju vahvistuu. Kannattaa myös aktiivisesti osallistua toisten kirjoittamiseen. Tarjoudu esimerkiksi lukijaksi työkaverille. Siinä ei tarvitse osata mitään ihmeellistä – riittää, kun pystyy sanomaan, että ”mä en tajua tätä kohtaa, olisiko sulla tähän joku esimerkki”. Kaikki kanssa-ajattelu vie eteenpäin. Henkilökohtaisesti ärsyynnyn sellaisesta puheesta, että kirjoittaminen olisi joku maaginen taito, joka joko on tai ei ole. Tietenkään kaikista ei tule Finlandia-voittajia tai loisteliaita viestijöitä – toisilla ihan kiistatta on sellaista virtuositeettia, mikä on muiden tavoittamattomissa. Mutta sellaiseen ei edes pidä pyrkiä. Pitää katsoa omaa taitotasoaan ja kavuta omia tikapuita ylöspäin. Omat kirjoittamisen tavat on mahdollista löytää. Osittain kyse on itsetuntemuksen kasvattamisesta. Esimerkiksi mulle kirjallinen ilmaisu on usein vaivatonta, kun taas vaikka spontaanin puheenvuoron pitäminen palaverissa uusien ihmisten edessä voi olla tuskallista. Kannattaakin miettiä, mikä on itselle kirjoittajana realistista, mistä on oikeasti hyötyä ja mistä kirjoittamisessa voisi saada nautintoa ja elämyksiä. Ja sitten mennä sitä kohti. Samalla oma suhde kirjoittamiseen tervehtyy ja elpyy. Miksi jokaisen asiantuntijan olisi hyvä osata kirjoittaa? Kirjoittaminen liittyy kaikkeen. Monen asiantuntijan työstä yllättävän iso osa on kirjoittamista, vaikka siihen ei yleensä kiinnitetä huomiota. Dokumentaatio, Slack-viestintä, asiakassähköpostit – ne on kaikki kirjallista viestintää, kirjoittamista. Tai jos suunnitellaan vaikka digitaalisia palveluja, aika harvassa on sellaiset, joissa ei olisi yhtään tekstiä tai joita tehdessä ei tarvita kirjallista viestintää. Koodikin on omanlaistaan kieltä. Itse ajattelen, että moni yritys on tavalla tai toisella mukana myös tarinankerrontabisneksessä. Työhön liittyvän kirjoittamisen määrä tuntuu vain kasvaneen, vaikka esimerkiksi videon ja audion on sanottu vähentävän kirjoitetun tekstin merkitystä. Jopa Instagram on vahvasti tekstimedia – kuvat yksinään ei riitä. Teksti ei ole koskaan vain pintasilaus, joka lopuksi huitaistaan viittä vaille valmiiseen tuotteeseen, vaan se on kokonaisuudessa ihan yhtä keskeisessä roolissa kuin kaikki muukin suunnittelu. On tosi onnetonta, jos joku maailmanluokan tuote kompastuu epäselviin tai vääränlaisiin teksteihin. Lisäksi asiantuntijan kannattaa muistaa, että kirjoittaminen tuo mukanaan paljon mahdollisuuksia. Kirjoittamalla voi vaikuttaa yhteiskunnallisiin asioihin, jakaa tietoa ja opettaa, markkinoida, vahvistaa omaa asiantuntijuutta, nostaa esiin epäkohtia ja osallistua julkiseen keskusteluun. Kyse ei ole siitä, etteikö viesteille ja vaikuttamiselle olisi paikkoja. Tarvitaan tilaisuuteen tarttumista. Mutta onko pakko, jos ei tahdo? Jos ei koskaan tartu mahdollisuuteen kirjoittaa, jättää tärkeiden keskustelujen käymisen toisille. Tilan ottavat ne, joille se ei ole niin hirveän vastenmielistä. Omaa kirjoitusmotivaatiota on fiksua tarkastella. Me puhutaan Kynä-kirjoissa ulkoisista ja sisäisistä motivaatiotekijöistä ja niiden eroista. Kestävään ammatilliseen kehittymiseen vaaditaan, että on myös jotain sisäistä motivaatiota ulkoisten kannustimien lisäksi. Sitä ei voi pakottaa, mutta sitä voi houkutella. Jotakuta voi esimerkiksi motivoida se, että kirjoittaminen on työelämätaitona arvokas. Jos on kaksi identtistä asiantuntijaa, joista toinen kykenee viestimään fiksusti ja persoonallisesti, se pötkii pidemmälle. Kirjoittaminen ei ole mikään pikku nyanssi vaan sitä voi soveltaa vaikka mihin. Kannattaa aloittaa vaikka listaamalla, mitä kaikkia tekstejä on kirjoittanut parin viikon sisään. Ja mitä kaikkea voisi vielä kirjoittaa. Työelämä on nykyään aika henkilövetoista, asiantuntijatyö etenkin, ja siinä kontekstissa kirjoittaminen on loistava työjuhta. Jos lakaisee kirjoittamisen vaikeuden koko ajan maton alle tai ajattelee, että mä en nyt vaan osaa eikä mun tarvitsekaan, se on yhdenlaista itsepetosta. Jos oikeasti haluaa kehittyä, pitää uskaltaa tehdä asialle jotain. Miten voi päästä eteenpäin? Kirjoittaminen nähdään usein yksinäisenä puuhana, ja vaikeaa se onkin, jos jää yksinään nyhväämään ja tuskailemaan. Kimppakirjoittaminen voi auttaa, samoin puhuminen. Nykäise joku työkaveri sivuun ja kysy, saisitko selittää hänelle yhden jutun auki. Puhuessa saa usein langanpäästä kiinni, ja esille siivilöityy kaikkein tärkeimmät jutut. Sitten voi aloittaa kirjoittamalla niistä. Muutenkin kaikenlaiseen ristiintekemiseen ja -kommentointiin on hyvä totuttaa itseään. Myönteinen sosiaalinen paine puskee tehokkaasti eteenpäin. Muita metodeita on esimerkiksi laittaa kylmästi kello laulamaan ja päättää, että nyt kirjoitan 15 minuuttia mitä vaan. Samalla sisäisestä sensuurista on pakko päästää irti. Kunhan vain jotenkin saa raakatekstiä paperille; siinä vaiheessa ei jaeta tyylipisteitä. Editointi on sitten ihan oma työvaiheensa, jota ei kannata tehdä samaan aikaan kun kirjoittaa ensimmäistä versiota. Lisäksi työtä kannattaa viipaloida. Jos edessä on iso urakka ja tuijottaa vain jossain kaukana häämöttävää lopputulosta, jalat menee varmasti spagetiksi. Mutta jos pilkkoo kokonaisuuden pikku suupaloiksi ja vielä visualisoi työtä jollain itselle luontevalla tavalla, maaliin pääseminen alkaa näyttää jo realistisemmalta. Mitkä on tyypillisiä vaaran paikkoja kirjoittajalle? Kirjoittaminen on aina tasapainoilua. Usein kun asiat vaikeutuvat, myös teksti vaikeutuu, ja sen kanssa kannattaa olla varuillaan. Tekstistä tulee äkkiä etäistä, kun aletaan puhua toimijoista, tahoista ja puitteista. Tällaiset sanat on tyhjiä: ne tarvitsee ympärilleen paljon muita sanoja, jotta tekstiin rakentuu ylipäätään joku merkitys. Monesti hyvissä teksteissä uskalletaan puhua konkreettisesti, eikä se tarkoita lukijan aliarvioimista. Yleisesti ottaen kannustan pyrkimään pois kädenlämpöisestä ja kirjoittamaan rohkeasti. Konkretiaa ja vertauskuvia kannattaa hakea omiin teksteihinsä ihan arkipäiväisistä asioista. Esimerkiksi yksi pilvi-infraihminen avasi omaa työnkuvaansa kertomalla työmatkastaan: aina kävellessään Hämeentien loputtoman tietyömaan ohitse hän ajattelee, että siinä ne kuopsuttaa sitä kaivantoa kuukaudesta toiseen – ja että sehän on just niin kuin hänen oma duuninsa. Kaivamista ja korjaamista. Konkreettisen ja abstraktin yhdistely on asioiden laittamista mittasuhteisiin, ja sellainen palvelee aina lukijaa. Ihan niin kuin hyvässä journalismissa – jos puhutaan vaikka Venäjän oppositiosta, siinä kohtaa hyvä toimittaja pysähtyy ja kertoo lukijalle, minkä suuruisesta joukosta on kyse. Mun mielestä hyvä teksti on monenlaisten asioiden risteymäkohta. Siinä on usein sekä tunnetta että tietoa, ja sen kirjoittaminen vaatii sekä inspiraatiota että rutiinia. Kuten sanottu, kyse on tasapainon hakemisesta, ja kirjoittajan tasapainoaisti kehittyy kirjoitetun merkkimäärän myötä. Vaarallisinta kai kuitenkin on, jos ei ensinkään uskalla tai välitä kirjoittaa. Lähde liikkeelle pienin askelin – mieti, mitkä jutut kertoisit aiheesta kaverillesi viinilasin ääressä. Nappaa niistä kiinni ja ala kirjoittaa. Syvenny aiheeseen: Kentältä ja konepellin alta"
