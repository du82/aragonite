title = "Kuka tämä on? - Koodarikuiskaaja"
description = "Aloitetaan ihan ensiksi kertomalla, että kuka minä en ole. En ole terapeutti, psykologi tai muu mielenterveyteen erikoistunut asiantuntija. En ole"
full_description = "Aloitetaan ihan ensiksi kertomalla, että kuka minä en ole. En ole terapeutti, psykologi tai muu mielenterveyteen erikoistunut asiantuntija. En ole kouluttautunut kasvatustieteisiin, puheoppiin tai aivokemiaan. En ole käynyt NLP-kursseja tai osaa muitakaan taikatemppuja. Tämähän menee hienosti. Mikä hitto minä sitten olen? Olen IT-alan pariin päätynyt avarakatseinen humanisti. Olen entinen viestinnän ja markkinoinnin ammattilainen, nykyään kouluttaja, kirjoittaja ja puhuja. Olen ihmisistä syvästi kiinnostunut kehittämis- ja kehittymishaluinen yrittäjä. Olen tehnyt erilaisissa tehtävissä töitä IT-alan firmojen kanssa kohta vuosikymmenen ja siten päätynyt työskentelemään monenlaisten devaajien kanssa. Mikä hulluus minuun oikein iski, kun perustin koodarikuiskaajan? Viestintä- ja markkinointivuosien aikana olen oppinut ymmärtämään IT-alan toimintaympäristöä ja devaajien arkitodellisuutta. Sykähdyttävistä kohtaamisista ja syvällisistä keskusteluista olen havainnut ne alati vaativammaksi muuttuvan työelämän kipupisteet, joiden kanssa devaajat painivat arjessaan. Useimmiten nämä kipupisteet liittyvät tilanteisiin, joissa on tarve kohdata ja olla vuorovaikutuksessa toisten ihmisten kanssa. Olen havainnut, että näihin tilanteisiin tarvittaisiin työkaluja ja toimintavarmuutta. Minulla on molempia. Ei näitä asioita ole opetettu koulussa. Ei ole tutkintoa, jonka toisesta päästä ulos pullahtaisi ensiluokkainen ihmisten kohtaaja, esimerkillinen konfliktitilanteiden hallitsija, taitava neuvottelija, itsevarma puhuja ja tiimityötalentti. Siksi näitä taitoja on harjoiteltava työelämässä. Siksi olen kuiskaaja Katalysoin ja edesautan yksilöiden kasvua siitä pisteestä käsin, missä he ovat. Kylvän epäilyksen siemeniä, uusien ajatusten aihioita. Kannustan ja tuen kohti muutosta, joka on usein hankala ja kivulias. Toimin vastin- ja kokeilukappaleena, peilinä, harjoittelualustana. Olen turvallinen ja luotettava ympäristö, joka mahdollistaa uskaltamisen. Opetan, koulutan ja konsultoin. Miksi tulen toimeen nimenomaan devaajien kanssa? En tiedä. Ehkä sillä on jotain tekoa sen kanssa, että olen matemaattinen ja looginen ongelmanratkaisija rakastan Roomeja, pakohuoneita, Civilizationia ja lautapelejä nautin hyvistä oluista ja viskeistä nauran kuiville puujalkavitseille olen hyväntahtoinen humanisti. Tai sitten ei. Millaista kanssani on tehdä yhteistyötä? ”Yhteistyö Elisan kanssa oli sujuvaa ja tehokasta. Saimme paljon arvokkaita viestinnän keinoja käyttöömme, joita hyödynnämme jokapäiväisissä kohtaamisissa.” – Marika Lecklin, Codento ”Etsimme ammattitaitoista kouluttajaa, joka pystyisi auttamaan erityisesti vuorovaikutuksessa ja kommunikoinnissa. Elisa huomioi koulutuksissaan kerta toisensa jälkeen yksilölliset tarpeemme ja kutitteli aivonystyröitämme siten, että opit ovat aidosti siirtyneet päivittäiseen arkeemme. Suosittelen vahvasti Elisaa, jos etsit inhimillistä, ammattitaitoista, kokenutta ja juuri sinun tarpeitasi kuuntelevaa kouluttajaa vuorovaikutukseen ja kommunikointiin liittyen. Oli kyseessä sitten pidempi koulutus tai yksittäinen työpaja.” – Aleksis Tulonen, Taiste ”Elisalla on kyky räätälöidä sisällöt juuri asiakkaan kontekstiin sopivaksi ja hänen ymmärryksensä konsulttiorganisaation toiminnasta on arvokas tekijä. Lisäksi yhteistyöpalaverit Elisan kanssa tuovat varmasti energiaa, lämpöä ja naurua päivään eli koulutusta järjestävälle taholle lopputulos on win-win.” – Aliisa Holkko, Silo.AI ”Yhteistyö Elisan kanssa on ollut niin kommunikaation kuin käytännön järjestelyiden osalta aina sujuvaa ja mutkatonta. Kokemuksesta voin sanoa, että Elisa tekee työtään täydellä sydämellä, kuuntelee asiakkaan tarpeita ja tarjoaa jokaiselle osallistujalle uusia, hyödyllisiä oivalluksia elämään.” – Laura Pohjola, Taiste Voisinko auttaa sinua, tiimiäsi tai työntekijöitäsi? Varmasti. Ota yhteyttä, niin selvitetään miten: elisa@koodarikuiskaaja.fi"
