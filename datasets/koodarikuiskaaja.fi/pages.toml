full_description = "Nykyään monella toimialalla tarvitaan oman toimialan osaamisen lisäksi ohjelmointiosaamista, ja on hyvin tavallista, että tätä tarvetta täytetään ostamalla konsultointia. Konsultti tarkoittaa erityisesti ohjelmistotuotannossa jonkin osaamisalueen asiantuntijaa, joka myy työtään – tai jonka työtä myydään – asiakasyritykselle, jolta kyseisen alueen osaamista puuttuu. Konsultin rooliin liittyy monenlaisia odotuksia, eikä vähiten konsultilla itsellään. Kun siirryin itse aikanaan tuotetalosta, Nokiasta, konsultiksi Reaktorille, koin hienoista painetta olla välittömästi asiakkaalle arvokas. Järkeilin, että asiakas maksaa osaamisestani paljon rahaa, joten minun pitäisi mahdollisimman nopeasti osoittaa olevani tehdyn investoinnin arvoinen. Aika ja kokemus ovat kuitenkin osoittaneet, että konsultin supertaito ei ole se, miten nopeasti konsultti pystyy ratkomaan asiakkaan ongelmat tai sanomaan jotain todella viisasta. Paljon suurempaan arvoon nousee taito kuunnella, aito halu ymmärtää asiakkaan tilannetta syvällisesti, kyky käydä vaikeita keskusteluja ja rohkeus kertoa asiakkaalle vaikeitakin asioita. Näiden taitojen omaksuminen ei tapahdu sormia napsauttamalla. Konsultti pyrkii luottamussuhteeseen Kun asiakas ostaa konsultointia, hän ostaa usein valmista ratkaisua tai osaamista käsiparitunteina ja ostohetkellä pyritään sanoittamaan tarkasti mitä halutaan. Todellisuudessa konsultin työhön sisältyy paljon sellaisen potentiaalisen arvon tuottamista, jota ei vielä aloittaessa tiedetä, sanota tai osata sanoa ääneen. Jonkinlainen esimerkki tällaisesta ei-toiminnallisesta arvosta Reaktorin toteuttamissa hankkeissa voisi liittyä vaikkapa lentokoneen istuimissa olevaan viihdejärjestelmään. Tällainen järjestelmä on työläs päivittää, joten ratkaisu kannattaa toteuttaa niin, että se tarvitsee päivittää mahdollisimman harvoin. Sähköisen ylioppilaskoejärjestelmän täytyy puolestaan olla äärimmäisen toimintavarma, sillä yksikään koe ei saa joutua hukkaan. Ei riitä että toteutetaan hienoja ominaisuuksia uusimmalla teknologialla, vaan toimintojen toteuttamisen lisäksi konsultin on ensiarvoisen tärkeää ymmärtää, mitkä asiat tuovat asiakkaalle arvoa ja mitkä riskit ovat erityisen tärkeitä välttää. Todella arvokasta voi olla myös kertoa asiakkaalle, mitä ongelmia kannattaa ylipäätään ratkaista tietojärjestelmällä. Voisiko vaikkapa kerran kuussa tapahtuvaan päivityksen tekoon olla edullisempi ratkaisu se, että joku ihminen hoitaa päivityksen tarvittaessa käsin? Arvoa voi tuottaa myös vähentämällä kustannuksia. Monipuolinen ymmärrys käsillä olevan asian ratkaisusta syntyy sitä mukaa, kun keskusteluja käydään, asioita avataan ja pohditaan. Kokonaiskuva tulee harvoin tietoon yhdeltä istumalta tai pelkkää speksiä lukemalla. Osa piilossa olevasta arvosta, taustalla vaikuttavista tekijöistä tai vielä asiakkaalle itselleenkin tuntemattomista näkökulmista valkenee vasta, kun luottamus on niin vahvaa, että keskustelut syvenevät. Sitä edellyttää kyky kuunnella, käydä rakentavaa vuoropuhelua – ja lopulta tuoda myös rohkeasti ratkaisuideoita ja mahdollisuuksia. On hyvä oppia olemaan sinut sen kanssa, että ihan joka minuutti ei tarvitse syntyä odotukset ylittäviä neuvoja ja ratkaisuja. Jos on kiire syöksyä ratkaisuihin, jää usein kuulematta paljon sellaista, joka lopulta muuttaisi tehtyä ratkaisua merkittävästi. Siksi sen jälkeenkin, kun asia tuntuu olevan jo aivan selvä, saattaa olla hyvä idea yrittää kysyä vielä vähän lisää ja kuunnella vielä vähän tarkemmin. Ei riitä, että konsultti on oikeassa Suhteen luominen on tärkeää myös siksi, että vasta luottamussuhteessa on mahdollista olla asiakkaan kanssa eri mieltä. Ei riitä, että konsultti tietää olevansa oikeassa tai että hänellä on täydellinen ratkaisu. Jos asiakas ei ole valmis ottamaan sitä vastaan tai kuulemaan sitä, neuvo on hyödytön. Usein olemme valmiit kuulemaan erimielisiä näkemyksiä vasta sellaiselta ihmiseltä, johon luotamme. Jos konsulttina saapuu paikalle ja havaitsee vartissa ratkaisun ongelmaan, jonka parissa asiakas on paininut vuosia, on syytä pysähtyä. Onko asia todella näin yksinkertainen? Mitä en ymmärrä tai tiedä? Mitä ratkaisuun, sovellusalueeseen, yrityksen politiikkaan, menneisyyteen, asioiden riippuvuussuhteisiin, tms. liittyvää en vielä hahmota? Miksi he eivät ole hoksanneet tai panneet toimeen näin yksinkertaista ratkaisua itse? Kyky kertoa asiakkaalle tämän olevan väärässä tai rohkeus ehdottaa toisenlaista ratkaisua vaatii paitsi luottamussuhdetta asiakkaaseen myös kykyä sietää konfliktin uhkaa. Usein jätämme sanomatta ja tekemättä, koska pelkäämme vastapuolen pahoittavan mielensä tai suuttuvan. Konsultin työ vaatii siis paitsi itseluottamusta, mutta myös kykyä sietää erimielisyyksiä. Lopulta sellaiset asiakassuhteet ovat parhaita, joissa on kohdattu vaikeuksia ja selvitetty ne. Suhde on vahvempi, kun se on kestänyt myös hankaluuksia. Tätä on itsekin pitänyt harjoitella, kun perusluonteeltani olen kuitenkin enemmän konfliktien välttelijä. Siihen kuitenkin oppii ja tottuu. Kun kiitosten aika tulee, asiakas on usein ollut todella tyytyväinen kahteen asiaan: siihen että häntä kuunneltiin ja ymmärrettiin, ja siihen että hänelle lisäksi kerrottiin rohkeasti myös asioita joista hän oli aluksi eri mieltä. Jarkko Kailanto Jarkko työskentelee Reaktorilla valmentajana ja kouluttajana. Hän kouluttaa sekä asiakkaille että reaktorilaisille tiimijohtamisen, tiimityön, fasilitoinnin ja konsultoinnin taitoja – muun muassa konsulttikoulussa. Hän on tehnyt töitä tiimien kanssa lähes 20 vuoden ajan ja on erittäin kiinnostunut siitä, mikä tiimityössä ja johtajuudessa todella toimii, mikä motivoi ihmisiä tekemään parhaansa yhteisen tavoitteen hyväksi. Twitterissä: @jarkkokailanto LinkedInissä: Jarkko Kailanto Internetissä: coachjarkko.com Töissä: Reaktor Syvenny aiheeseen: Kentältä ja konepellin alta"
