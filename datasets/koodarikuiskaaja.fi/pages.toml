["https://koodarikuiskaaja.fi/aihepiiri/kentalta-ja-konepellin-alta"]
title = "Kentältä ja konepellin alta - Koodarikuiskaaja"
description = """
Tämä aihepiiri on vähän niin kuin se laatikko, jossa on kaikenlaista hyödyllistä tai arvokasta, jolle ei oikein mitään muutakaan paikkaa ole. Laatikosta saattaa joskus löytää sen, mitä lähti etsimään. Todennäköisemmin löytää jotain muuta hyödyllistä, jota ei etsinyt, koska ei sillä hetkellä tajunnut vielä tarvitsevansa. Tai sitten eksyy puoleksi tunniksi lukemaan vanhoja kirjeitä.
Tähän sekatavaralaatikkoon kertyy ainakin:

oivalluksia tapahtumista ja tapaamisista
poimintoja kirjoista ja keskusteluista
kurkistuksia taustoihin ja takahuoneeseen
katsaukset maailman menoon
vierailut muihin kanaviin
kokemukset ja kuulumiset
ja ehkä pari hassua eläinvideota.

Tänne voi tulla myös vierailemaan. Haluatko jakaa osaamistasi tai ajatuksiasi? Nakkaa minua sähköpostilla: elisa@koodarikuiskaaja.fi"""
full_description = "Oliko pomosi Nordic Business Forumissa 2024 27.9.2024 Jos pomosi oli NBF:ssä, hän on luultavasti nyt altis erilaisille kehitysideoille. Nappaa tästä tärppilista ensi maanantaipalaverin agendalle. Pelastetaan palaverit! 10.8.2023 Kutsutaanko palaveriin hyvin paljon ihmisiä, varmuuden vuoksi? Agendaa ei ole, aihe on epämääräinen ja tarkoitusta ei tiedä kukaan? Eikö kukaan ei kuuntele, vaan tekee palaverin aikana muita töitä? Pelastetaan palaverit! “Mitä tehdä tilanteessa, jossa…” 20.6.2023 Puhujat ja kouluttajat saavat yleisöltä usein erittäin hyviä, joskin todella yleisluontoisia kysymyksiä. Minulla kesti hyvin kauan oivaltaa, miksi vastaaminen tuntui usein niin haparoivalta ja miksi kysyjän ilme ei aina näyttänyt erityisen tyytyväiseltä. Vieraskynä: No-code ja low-code muuttavat myös kehittäjän arkea 25.5.2022 / Milla Heikkilä No-code ja low-code laajenevat myös liiketoimintalähtöiseen ohjelmistokehitykseen. Devaajat, jotka osaavat kuunnella asiakkaan ja yrityksen tarpeita, soveltaa ja ennen kaikkea kommunikoida muiden kanssa, pärjäävät silti jatkossakin. Vieraskynä: Itsensä johtamista perkeleellä 12.4.2021 / Mikael Siirtola ”Itsemyötätunto on tiivistettynä sitä, että kohtelee itseään niin kuin kohtelee parasta kaveriaan silloin, kun tällä on todella vaikeaa. Kuulostaa helpolta, mutta on yllättävän vaikeaa, jos on tottunut olemaan itseään kohtaan todella armoton ja ankara”, kirjoittaa Mikael Siirtola. Vieraskynä: Konsultti kuuntelee enemmän kuin neuvoo 4.3.2021 / Jarkko Kailanto ”Järkeilin, että asiakas maksaa osaamisestani paljon rahaa, joten minun pitäisi mahdollisimman nopeasti osoittaa olevani tehdyn investoinnin arvoinen. Aika ja kokemus ovat kuitenkin osoittaneet, että konsultin supertaito ei ole se, miten nopeasti konsultti pystyy ratkomaan asiakkaan ongelmat tai sanomaan jotain todella viisasta.” Ylen Ina Mikkolan Tilipäivä: Irti huijarisyndroomasta 5.11.2020 Hiljattain Ylen Tilipäivä-ohjelmassa oli vieraana koodari Juuso Haapanen ja aiheena oli ”irti huijarisyndroomasta”. Myös koodarikuiskaaja piipahti linjoilla videotervehdyksen muodossa"
