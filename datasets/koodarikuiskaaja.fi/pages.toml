["https://koodarikuiskaaja.fi/blogi/nama-lukisin-tai-kuuntelisin-uudelleen-max-romantschuk"]
title = "Nämä lukisin (tai kuuntelisin) uudelleen – Max Romantschuk - Koodarikuiskaaja"
description = """
Max on Verkkokauppa.comin IT-osaston kehityspäällikkö ja noin 30 devaajan esimies. Hän rakentaa tiimejä, rekrytoi, fasilitoi ja mahdollistaa – sekä johtaa tunteita, viestintää ja vuorovaikutusta. Jatkuvasta oppimisesta kiinnostunut ja vähän kaikesta innostunut Max lukee paljon niin töihin kuin elämäänkin liittyen. Vapaa-ajallaan hän myös pelaa lautapelejä, puuhastelee konemusajuttuja ja harrastaa ruoanlaittoa, sekä kasvattaa kaksia kaksosia.
Töissä: Verkkokauppa.com / max.romantschuk@verkkokauppa.com
Telegramissa: Maxromantschuk
LinkedInissä: Max Romantschuk
Kuuntele myös Maxin vierailu Koodarikuiskaajan podcastissa."""
full_description = "Verkkokauppa.comin Head of Development Max Romantschuk on moniulotteisesti utelias tyyppi. Kun keskustelimme kirjoista, kävi ilmi, että hän on lukenut (ja kuunnellut) paljon sekä sellaista, mitä minäkin olen lukenut – mutta myös paljon sellaista, mistä en ollut koskaan kuullutkaan! Siksi pyysin Maxia evästämään kesälomakautemme luku- ja kuuntelusuosituksilla. Listaan valikoitui hyvin erilaisia teoksia ja luentoja, joita yhdistää yksi asia. Ne ovat jääneet syystä tai toisesta Maxin mieleen ja hän lukisi tai kuuntelisi ne uudelleenkin. Anna palaa, Max! Kirjoja The Martian – Andy Weir Goodreads | Amazon The Martian kertoo astronautti Mark Watneysta, joka jää yksin Marsiin. Hänen täytyy yrittää selviytyä hyvin rajallisilla resursseilla täysin elottomalla planeetalla, jolta ei ole poispääsyä. Kirja tuli tunnetuksi Matt Damonin tähdittämästä elokuvasta. Pidätkö avaruudesta? Tykkäsitkö Ihmemies McGyveristä? Kiinnostaako fysiikka ja kemia edes pinnallisesti? Ymmärrätkö, että pieruhuumori on täysin OK kun aikuinen käyttää sitä vastuullisesti ja harkiten? OK, lue tämä kirja. The Martian kiteyttää hyvin tyydyttävällä tavalla sen mahtavan fiiliksen, jota tunnet kun olet kludgettanut jotain kasaan niillä resursseilla, jotka sulla on, ratkaiset ongelman, ja voit kohdata seuraavan haasteen. PS. Leffa oli jepa, kirja on loistava. Leffa kun on tehty poliittisesti korrektiksi tavalla, jota kirjan ei tarvinnut olla. © Randall Munroe xkcd – The Martian Hackers: Heroes of the Computer Revolution – Steven Levy Goodreads | Amazon Ei siitä ole kauaakaan, kun nörtti oli ulkopuolisen ja omituisen ihmisen leima. Viimeisen viidentoista vuoden aikana tietokoneiden ja internetin vallankumous on muuttanut maailmaa pysyvästi. Tämä teos nostaa esiin ne uraa uurtaneet tyypit, jotka raivasivat tietä ja tekivät internetistä sen, mikä se on nyt. Henkilönä, joka syntyi noin 30 vuotta liian myöhään ja 8750 kilometriä liian kaukana hackerikulttuurin kehdosta, jouduin tyytymään parhaaseen vaihtoehtoon: Steven Levyn 1984 julkaistuun Hackers-kirjaan. Siitä opin muun muuassa Applen, Microsoftin ja Free Software Foundationin perustajien ensimmäisistä askelista tietokoneiden parissa, tai mun lapsuusiän idoleista, Ken ja Roberta Williamsista, jotka perustivat Sierra Onlinen ja kehittivät ensimmäisiä graafisia seikkailupelejä. Kirja on hyvin laaja ja rönsyilevä aiheiden osalta, mutta samantasoiseen historiikkiin en vielä ole muualla törmännyt, joten suosittelen tätä. Turn the Ship Around!: A True Story of Turning Followers into Leaders – L. David Marquet Goodreads | Amazon Johtamisesta on kirjoitettu kirja jos toinenkin, mutta tämä teos vie johtamisen veden alle. David Marquet on kokenut laivaston johtaja, joka nimitettiin USS Sante Fe -ydinsukellusveneen kapteeniksi. Hänen tehtävänään oli saada miehistö toimimaan saumattomasti ja virheettömästi yhteen. Tämä on kirja, joka todellakin pistää ajattelemaan johtamisen perusperiaatteita. Niin monessa ympäristössä oletetaan, että johtamisessa on kyse siitä, että kerrotaan ihmisille, mitä heidän pitää tehdä. Marquet kääntää koko asian päälaelleen. Hän osoittaa kokemuksen kautta, että jopa ydinsukellusveneessä voidaan rakentaa itseohjautuva organisaatio, jossa osallistetaan ihmisiä ja saadaan heidät kehittämään asioita. A History of the World – Andrew Marr Goodreads | Amazon Andrew Marrin teos vie kuulijan seikkailulle muinaisiin ja vähemmän tunnettuihin sivilisaatioihin, sekä käsittelee vaikutusvaltaisia historiallisia hahmoja, jotka ovat merkittävästi vaikuttaneet siihen, miltä elämämme tänään näyttää. Teoksen saa myös kirjana, mutta äänikirjan on lukenut BBC:n radiotoimittaja ja näyttelijä David Timson. Andrew Marrin katselmointi maailmanhistoriasta on siitä kiehtova, että vaikka se käsittelee perinteisellä tavalla historian suurmiehiä (ja naisia), se tekee niin hyvin inhimillisen linssin kautta. Monesti kun käsitellään johtajia, keskitytään vain heidän työpersoonaansa. Marr on kirjassaan valinnut laajemman linjan, joka tuo näiden historiallisten henkilöiden inhimillisyyttä esiin. Jos Gandhi pystyi olemaan ilkeä perheelleen, ehkä minunkaan ei tarvitse olla täydellinen? Luentoja A History of Russia: From Peter the Great to Gorbachev Goodreads | Audible | The Great Courses Venäjä on edelleen ja on aina ollut yksi maailman suurvalloista. Silti se on useimmille vieras, emmekä tunne Venäjän historiaa kovinkaan tarkasti. Tässä luentosarjassa tutkitaan, miten historian vaiheet ovat muovanneet Venäjää ja sen kansakuntaa. Vaikka koulussa pitikin oppia kaikenlaista itänaapurista, niin harvemmin sitä tulee sukellettua syvemmälle tähän todella ison ja kulttuurillisesti rikkaan maan historiaan. Mark Steinberg tuo historian eloon tavalla, joka auttaa ymmärtämään mitä kaikkea on läpikäyty niin johtajien kuin kansan näkökulmassa viimeiset 300 vuotta. Kurssi kertoo mitkä taustatekijät johtavat melko erilaiseen kulttuuriin ja kansan tapaan nähdä johtajia verrattuna omaamme. Big History: The Big Bang, Life on Earth, and the Rise of Humanity Goodreads | Audible | The Great Courses Kuinka kosmologia, geologia, antropologia, biologia ja historia muodostavat yhden yhteisen tarinan, joka on koko planeettamme historia? Tämä 48 luentoa punovat yhteen kaiken alkuräjähdyksestä ihmiskunnan kehitykseen ja sen yli. Kuulin tästä ekan kerran muistaakseni Bill Gatesin blogissa tai haastattelussa. Luentosarjan kuunteleminen oli naurettavan nautinnollista ihmiselle, joka on on utelias vähän kaikesta. Big History -luennot muodostavat yhtenäisen tarinan, joka alkaa alkuräjähdyksestä, jonka ansiosta tähdet pystyivät syntymään, jonka ansiosta tuli painavampia elementtejä, supernovia, ja sitten planeettoja, jonka ansiosta pystyi syntymään orgaanista kemiaa, jonka ansiosta elämää, jonka ansiosta monisoluista elämää… Niin, jos jaksoit tähän asti, olisi tässä kohtaa parempi siirtyä kuuntelemaan tota luentosarjaa. Varoituksen sana: Jos sinulla on tapana käyttää lausetta “tosta tulikin mieleen”, tämän kuuntelu ei ainakaan paranna asiaa. Max Romantschuk Max on Verkkokauppa.comin IT-osaston kehityspäällikkö ja noin 30 devaajan esimies. Hän rakentaa tiimejä, rekrytoi, fasilitoi ja mahdollistaa – sekä johtaa tunteita, viestintää ja vuorovaikutusta. Jatkuvasta oppimisesta kiinnostunut ja vähän kaikesta innostunut Max lukee paljon niin töihin kuin elämäänkin liittyen. Vapaa-ajallaan hän myös pelaa lautapelejä, puuhastelee konemusajuttuja ja harrastaa ruoanlaittoa, sekä kasvattaa kaksia kaksosia. Töissä: Verkkokauppa.com / max.romantschuk@verkkokauppa.com Telegramissa: Maxromantschuk LinkedInissä: Max Romantschuk Kuuntele myös Maxin vierailu Koodarikuiskaajan podcastissa. Syvenny aiheeseen: Kentältä ja konepellin alta"
