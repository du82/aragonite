["https://koodarikuiskaaja.fi/blogi/vieraskyna-itsensa-johtamista-perkeleella"]
title = "Vieraskynä: Itsensä johtamista perkeleellä - Koodarikuiskaaja"
description = """
Mikael on norsukuiskaaja, scrum master of the universe ja maailmanparantaja. Hän kirjoittaa kirjaa norsuratsastajista ja korporaatiokrokotiileista sekä saarnaa vuorilla sen puolesta, että yrityksissä otettaisiin ihmiset paremmin huomioon. Vapaa-ajallaan Mikael pelaa videopelejä ja lukee omien sanojensa mukaan keskinkertaista scifi-kirjallisuutta.
LinkedInissä: Mikael Siirtola
Kuuntele myös: Vuorisaarna"""
full_description = "”Senkin tunari! Miks sä et osaa? Miks sä aina teet näin? Etkö sä tiedä että joka päivä kuolee monta ihmistä, koska sä oot vaan huono ja laiska. Jengi hei menettää lähimmäisiään sun takia, etkö yhtään mieti miltä niistä tuntuu! VOISIT NYT EDES VÄHÄN YRITTÄÄ.” Onko tässä otettu Evil Inc -opit käyttöön ja annetaan palautetta alaiselle raivoisasti huutaen? Ei onneksi. Tai no onneksi ja onneksi. Minä se tässä vain ruoskin itseäni. Näin olen joskus puhunut itelleni. Oikeasti. Seuraavat kaksi kappaletta sisältävät lähinnä taustoja, miksi kirjoitan tätä ja miten ite löysin itsekritiikin konseptina. Asiasisältö alkaa sen jälkeen. Avautuminen alkaa Kirjoitan tätä tekstiä 7:08 sunnuntaina aamuyöstä. (Ei, tämä ei ole mun normaali aika herätä, en ole aamuihminen. Mun voittajan tunti on siinä 9–10 välillä.) Mutta kirjotan tässä tätä sinulle, jolla on tosi ankara sisäinen ääni. Haluan auttaa sinua ja herättää sinut miettimään, miten puhut itsellesi. Yksinkertaisesti siksi, että henkinen väkivalta ei ole ikinä hyvästä – eikä se ole oikein edes itseä kohtaan. Me ollaan ihania ihmisiä ja ansaitaan hellyyttä. Myös itseltä itselle. On olemassa parempi tapa puhua itselle, tai niin minä ainakin uskon ja siksi kirjotan tätä. Sain viime syksynä burnoutin. Ulkoisesti asiat oli tosi hyvin. Sisäisesti olin ihan rikki. Minulle diagnosoitiin masennus ja ahdistus. Uskon, että iso osa niistä johtui juuri mun sisäisestä puheesta itselleni. Ei minulle huudettu töissä – tai siis muiden kuin itseni toimesta. Mutta se sisäinen ääni huusi sitten senkin edestä. Tämän kirjoittaminen sattuu vähän, mutta se on ihan okei. Asia on minulle tärkeä, vaikka liippaakin läheltä sydäntä. Nyt olen taas töissä ja käyn terapiassa, eli olen jotenkin kai vielä työkykyinen. Pahemminkin olisi voinut käydä. Olen kiitollinen lähimmäisten (etenkin mun rakkaan Elinan) ja työkavereiden sekä yhteisön tuesta. Olen aina jotenkin puskenut itseäni. Se puskeminen on tuottanut ihan hyvät E:n paperit lukiossa, pääsin opiskelemaan sinne minne halusin, valmistuin 5,5 vuodessa yliopistosta ja sitten menin ensimmäiseen isoon korporaatioduuniin. Löysin agilen, sain koeajalla kenkää, mutta pääsin jaloilleni ja nyt mun ura on kai jonkun mielestä ollut ihan nousujohteinen. Puskemisen ansiosta? Vai siitä huolimatta? Sitten sain paniikkikohtauksen lokakuussa 2020 ja tuli toi diagnoosi. Se sai pysähtymään. xkcd: Survivorship Bias Löysin itsekritiikin konseptin oikeastaan sitä kautta, että huomasin, että mulle on tosi vaikeaa ottaa vastaan kiitosta. Vaikka monet jutut meni ihan hyvin töissä, niin tuntui aina siltä, että se ei oikein riittänyt itselle ja itseni mielestä ne meni ihan paskasti. Aihe tuli esiin jo Nonviolent Communicationia ja Responsibility Processia lukiessa, mutta varsinainen herääminen tuli lukiessa Ronnie Grandellin kirjaa Irti itsekritiikistä. Kyyneleet nousi silmiin. Eli mitä se itsekritiikki sitten on? Jotta voi ymmärtää itsekritiikkiä, pitää ymmärtää ihmisen mielen toimintaa. Meillä on mekanismi nimeltä suojareaktio. Kun jotain yllättävää ja välitöntä toimintaa vaativaa tapahtuu, niin suojareaktio menee usein ihmisellä päälle. Tämä on tosi hyödyllistä, jos pitää vaikka äkkiä väistää kohti kiitävää autoa. Silloin ei ole aikaa ajatella syntyjä syviä, vaan autoa olisi syytä väistää tai käy huonosti. Tässä tehtävässä suojareaktio on varsin loistava asia! Itsekritiikki toimii vähän samalla tavalla eli se ohjaa meidän huomiota asiaan, joka on jollain tavalla huonosti. Sen tehtävä on saada meidät havaitsemaan kehityskohdat ja ongelmat, eikä siinä ole varsinaisesti mitään pahaa. Valitettavan usein me ollaan kuitenkin aivan liian ankaria itsellemme. Katsotaan itsekritiikkiä kahden eri esimerkin avulla. Maailmanloppu vai mahdollisuus oppia Devaaja vie muutokset testiympäristöön ja rikkoo sen täysin. Viallinen koodi joudutaan poistamaan. Vanhempi kollega tulee paikalle korjattuaan asian ja huutaa: “Mitä sä oot mennyt tekemään, oot sä kyllä yks tunari?! Yritätkö sä ees tehdä töitä? Yliopistossa sait kyllä leikkiä, mut täällä työelämässä ei tommosta katella! Mä meen ilmottamaan tästä sun esihenkilölle. Nuoriso on pilalla!” Tai sitten hän voisi sanoa: “Hei, nyt kun tää meidän testiympäristö hajosi, niin muut eivät saaneet hyväksymistestituloksiaan ja niiden työ keskeytyi. Se on ikävää, kun meillä on deadline puskemassa päälle ja muakin vähän stressaa nyt. Voinko mä näyttää sulle miten ajat omalla koneella tarvittavat testit, että voit varmistaa, että sun koodi toimii ennen kuin viet sitä eteenpäin? Mä haluan, että opit hyviä koodaustapoja ja kehityt tämmöseks kokeneeks kaveriks, kuin mää. Sussa on paljon potentiaalia! Älä hätäile, virheitä sattuu kaikille.” Kuinka voit puhua itsellesi kuin lapsellesi? Seuraava esimerkki on varastettu jostain kirjasta, en vain muista, että mistä. Ajatellaan vaikka lasta, joka juoksee kadulle katsomatta sivuilleen. Kun lapsen vanhempi näkee lapsen juoksevan kohti vaaraa ja säikähtää, niin hän saattaa toimia tällä tavalla (en suosittele tätä tapaa!). Vanhempi huutaa: “Hei, mitä sä oikeen teet senkin idiootti! Enkö oo sanonut sata kertaa, että tielle ei juosta?! Nyt heti huoneeseen häpeämään. Miten ihmeessä mä oon voinu synnyttää tommosen nuijan! Et saa karkkia kahteen viikkoon! Hyi!” Tai sitten hän voisi sanoa: “Hei, kun juoksit tuohon kadulle, etkä katsonut sivulle, niin se oli vaarallista, koska sieltä olisi voinut tulla auto ja sulle olisi voinut käydä tosi huonosti. Olet mulle maailman tärkein ja rakkain ihminen, enkä haluaisi, että sulle kävis mitään, koska se ois musta tosi kurjaa. Voidaanko jutella, miten toi tie ylitettäisiin jatkossa turvallisesti, jotta sinulle ei vaan sattuis haaveria?” Kummassakin esimerkissä on kaksi tyyliä puhua toiselle: ankara ja sellainen, joka ei oikein anna suuntaa ja toinen, lempeämpi, joka antaa suunnan paremmalle toiminnalle. Näin me voidaan puhua myös itse itsellemme. Harmittavan usein olen huomannut, että monet hyvät ja fiksut tyypit, puhuu itselleen tuolla ekalla tavalla. Rajansa kaikella Tämä ei nyt tarkoita sitä, etteikö saisi olla yhtään itsekriittinen. On ihan hyvä välillä miettiä, että mitä tuli tehtyä, etenkin, jos tuli tehtyä jotain tyhmää. Sitä kannattaa kuitenkin tehdä vähän itsemyötätuntoisemmin. Se auttaa pääsemään yli itsensä sättimisestä ja kohti sitä, että alkaa miettiä mikä meni pieleen ja miten ehkä jatkossa kannattaisi toimia toisin. Auttaa ainakin minua! Haaste on kuitenkin siinä, että me ollaan tapoihin kangistuneita otuksia. Tämä on hyvä juttu tietyissä asioissa, koska tavat säästävät energiaa. Harmittavan usein myös itsekritiikki on opittu tapa. Siitä voi olla alkuun vaikea päästä eroon, kun se on juurtunut niin syvälle ja on se automaatio, mikä meissä luonnollisesti syntyy. Lisäksi useat itsekriittiset tyypit ovat hyvin menestyneitä (ei sen ansiosta, vaan siitä huolimatta, uskon minä). Siitä saattaa syntyä myös pelko, että jos vähentäisi sitä sisäistä itsekritiikkiä ja olisi itselleen lempeämpi, niin sitten sitä vaan laiskottelisi kaiket päivät, eikä tekisi mitään fiksua, eikä voisi pitää niitä korkeita tavoitteita, jotka on itselleen asettanut. Mutta ei hätää! Ronnie Grandell mainitsi Parempi elämä -podcastissa, että on tehty tutkimuksia, joissa havaittiin, että ihmiset, jotka harrastavat itsemyötätuntoa voivat olla ihan yhtä menestyneitä ja heillä voi olla ihan yhtä korkeita tavoitteita, kuin itsekriittisillä tyypeillä. Kuten sanottu, tämä ei nyt tarkoita sitä, etteikö saisi olla yhtään itsekriittinen. Ennen kaikkea täytyy olla tarkkana, ettei vaan lähde soimaamaan itseään omasta itsekriittisyydestä. Tämä on helppo sudenkuoppa, josta pääsee infinite loopiin. Onneksi myös ihmisen sisäistä koodia voi refaktoroida. Se on vain vähän monimutkaisempaa, kuin parin rivin commit, cash in ja go home. Itsemyötätunnon ytimessä on myönteinen minäpuhe Itsemyötätunto on tiivistettynä sitä, että kohtelee itseään niin kuin kohtelee parasta kaveriaan silloin, kun tällä on todella vaikeaa. Siinä missä itsekritiikki ohjaa meidän keskittymistä usein tosi kapealle alueelle ja suurentelee ongelmaa, itsemyötätunto auttaa ymmärtämään kokonaisuutta. Esimerkiksi kerran erään johdon konsultin projektisuunnitelmakalvoissa oli kirjoitettu “next sex months” “next six month”:in sijasta. Tämä paljastui konsultille johtoryhmän palaverissa. Henkilöt hekottelivat virheelle ja konsulttia vähän nolotti, mutta asiasta selvittiin. Tällaisen tilanteeseen jälkeen saattaa helposti olla itsekriittinen olo, erityisesti jos on siihen taipuvainen. Voi tuntua siltä, että “tää oli nyt tässä, maailma loppuu, kaikki pitää mua ihan pellenä ja ootnmaailman huonoin ihminen”. Itsemyötätuntoisuudesta tietävä tyyppi voisi keskeyttää tällaisen minäpuheen ja sen sijaan voisi puhua itselleen näin. “Hei, se oli tosi tärkee palsu ja on hyvin inhimillistä, että sua harmittaa, että siihen tuli tommonen virhe. Mutta ehkä se nolo kirjoitusvirhe powerpointeissa, jotka esitit johtoryhmälle, ei ollutkaan kuitenkaan maailmanloppu. Ehkä sun koko uskottavuus ei kaadu yhteen kirjoitusvirheeseen ja et olekaan maailman huonoin ihminen, vaikka susta saattaa just nyt tuntua siltä. Se on inhimillistä ja okei! Sulle kävi nyt tämmönen virhe, niitä sattuu kaikille. Upeeta, että sattui vaan tuollainen virhe, eikä mikään sen pahempi. Ehkäpä ens kerralla laitan vielä slidet kollegalle oikoluettavaksi ja laitanpa backlogiin powerpointin hajonneen oikoluvun laittamisen päälle. Nyt voitaisiin juoda kuppi kahvia rauhassa, että jaksetaan iltapäivä vielä.” Miten eroon itsekritiikistä käytännössä? Minulle itselleni parhaiten on toiminut se, että olen miettiny asiaa aktiivisesti ja koittanut kiinnittää siihen huomiota. Annan nyt yhden esimerkin omasta elämästä lauantaina 23. tammikuuta klo 6:31. Minulla on nyt viimeiset pari viikkoa ollut sellainen ongelma, että en saa unta aamusta, eli herään jossain kuuden, seitsemän maissa vaikka herätys on 8:40. Tämä on johtanut siihen, että saan vähän vähemmän unta ja olen vähemmän perillä asioista, kuin olisin paremmilla unilla. Klo 6:31 lauantaina minua jonkin verran harmitti, että en saanut enää nukuttua, mutta tuntui siltä, että ei tuu uni silmään. Rupesin siinä sitten miettimään potentiaalisen palaavan konsultin läppärioptioita. Havahduin omiin työajatuksiin, koska nyt on viikonloppu ja nyt pitäisi keskittyä palautumiseen. Burnoutista vielä toipuvana palautuminen olisi erittäin tärkeää. Onnistuin tällä kertaa olemaan itsemyötätuntoinen, enkä soimannut itseäni (yleensä epäonnistun tässä). Sanoin itelleni jotenkin näin: “Mikael, sinulla on kova meno päällä ja oot pitkästä aikaa motivoitunut töihin. Se on ihan okei, että kun heräät, rupeat funtsimaan näitä työjuttuja. Nyt ois kuitenkin tärkeää ajatella jotain muuta.” Sitten pyörin 15 minuuttia sängyssä, nousin ylös, kun kehoon keskittyminen ei tuonut unta silmään ja ohjasin ajatukset tämän blogitekstin kirjoittamiseen – sekä rupesin kirjoittamaan tätä! Tämä oli minun oma kokemukseni omasta mielestäni onnistuneesta, itsemyötätuntoisesta suhtautumisesta itseen. Se on vaatinut sen, että on tullut tutuksi itsemyötätunnon konseptin kanssa (kuten sinä nyt, kun olet lukenut tämän tekstin), kiinnittänyt asiaan huomiota ja ruvennut harjoittelemaan toisenlaista tapaa puhua itselle. Itsemyötätuntoharjoitus Ronnie Grandellilta Tässä on vielä mun lempiharjoite Ronnie Grandellin kirjasta Irti Itsekritiikistä – löydä terve suhde itseesi. Tämä on minun lemppari sen takia, että oon nörtti ja tämä tuo mulle mieleen suojeliuksen, jolla karkotan itsekritiikin ankeuttajaa pois elämästäni. Harjoitus menee vapaasti lainaten kutakuinkin näin. Istu rennossa asennossa. Sulje silmät ja anna katseen levätä. Hengitä pari kertaa rauhallisesti ja syvään. Tuo mieleesi hahmo, joka herättää sinussa turvallisuutta ja lämpöä. Se voi olla joku, jonka tunnet tai fiktiivinen hahmo tai eläin. (Suojelius!) Keskity hahmoon ja mieti, mitä fiiliksiä nousee. Tuleeko turvallisuutta, lämpöä, rentoutumista mieleen tai kehoon? Jos herää mielekkäitä fiiliksiä tai kokemuksia, niin jatka mielikuvan kanssa. Jos tuntuu epämiellyttävältä vaihda hahmoa. Pane merkille hahmon kasvot: onko se ymmärtäväinen, hymyilevä, iloinen tai jotain muuta? Viihdyttekö yhdessä? Kuvittele sanovasi hahmolle: “toivon että sinulla olisi kaikki hyvin”. Voit kuvitella, että hahmo sanoo tämän sinulle takaisin sanoin tai elein. Anna mielikuvan astua taka-alalle ja siirrä huomiosi takaisin hengitykseesi. Voit muutaman kerran hengittää rauhallisesti ja vähän syvempään. Avaa silmät ja palaa huoneeseen. Lopuksi kiitä itteäs harjoituksen tekemisestä. Tällä teolla olet edistänyt hyvinvointiasi. Mikael Siirtola Mikael on norsukuiskaaja, scrum master of the universe ja maailmanparantaja. Hän kirjoittaa kirjaa norsuratsastajista ja korporaatiokrokotiileista sekä saarnaa vuorilla sen puolesta, että yrityksissä otettaisiin ihmiset paremmin huomioon. Vapaa-ajallaan Mikael pelaa videopelejä ja lukee omien sanojensa mukaan keskinkertaista scifi-kirjallisuutta. LinkedInissä: Mikael Siirtola Kuuntele myös: Vuorisaarna Syvenny aiheeseen: Kentältä ja konepellin alta"
