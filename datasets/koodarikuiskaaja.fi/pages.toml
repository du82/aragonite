["https://koodarikuiskaaja.fi/aihepiiri/puhu-paattaja-puolellesi"]
title = "Puhu päättäjä puolellesi – Koodarikuiskaaja"
description = """
Onko pakko, enkö saisi vain keskittyä työhöni?
Ikävä pilata bileet, mutta vastaus on yksiselitteisesti: et.
Kukaan yksilö tässä maailmassa ei tule selviämään hautaan saakka ilman, että joutuu kertaakaan perustelemaan näkökantaansa. Tai jos uskot olevasi sellainen, niin siinä tapauksessa suuntaa internetin vihreämmille laitumille ja sulje tämä ikkuna. Mutta me muut kuolevaiset joudumme vähän väliä tilanteeseen, jossa on ihan pakko saada muut näkemään asiat siitä kulmasta, josta haluamme.
Välillä ”muut” on kehityskeskustelussa pöydän yli meitä tiukasti silmiin tuijottava pomo. Toisinaan se on vastaan inttävä kollega (tai puoliso). Usein se on palaverissa pullavatia kohti kurkottava asiakas, jolla on vahvat mielipiteet mutta vähän tietämystä.
Mitä lasittuneempi katse pöydän toisella puolella on, sitä kylmempi hiki selkäpiitä pitkin valuu norona alas. Mikä on, kun ei faktat riitä? Mitä muuta voin tähän enää muka lisätä?"""
full_description = "Vaikuttaako tämä vittuilulta? 13.2.2025 Miltei minkä tahansa kysymyksen voi saada kuulostamaan vittuilulta, jos se on tarkoitettu vittuiluksi. Samaan tapaan miltei minkä tahansa kysymyksen voi tulkita vittuiluksi, vaikka se ei sitä olisi. Paljon riippuu siitä, miten kysymyksen esittää. Jokainen meistä on joskus jankuttaja 10.4.2024 Mitä enemmän kannamme huolta tai turhautumista, sitä todennäköisemmin itse kustakin kuoriutuu jankuttaja. Toistamme itseämme kuulluksi tulemisen toivossa. Jos jankuttaminen ei kuitenkaan tunnu auttavan, mitä kannattaisi tehdä? Kuka nyt totuudesta voi suuttua? 13.12.2022 Totuus sattuu ja hävettää, mikä aiheuttaa tuohtumista, puolustelua ja jopa hyökkäämistä. Siksi ennen kritiikin esittämistä kannattaakin tutkia, kestääkö suhde jo kritiikin, onko taustatyöt tehty tarkasti ja onko sanat aseteltu riittävän hienotunteisesti. Luo luottamusta antamalla itsellesi tarkemmat takarajat 11.9.2020 Epämääräisten lupausten, venyvien aikataulujen ja jatkuvan kiireen keskellä asiakkaat eivät ole tottuneet siihen, että joku lupaa jotain selkeää – saati pitää sen. Asiakastyössä luotettavuus rakentuu neljästä osasta 1.7.2020 Luotettavuus (trustworthiness) on uskottavuuden (credibility), toimintavarmuuden (reliability) ja läheisyyden (intimacy) summa jaettuna itsekkyydellä (self-orientation). Se selittää, miksi välittäminen on tärkeämpää kuin olla aina oikeassa. Kaikuluotaa itsellesi lisää tietoa 2.4.2020 Kaikuluotaus antaa kuulijan ymmärtää, että en nyt ihan ymmärtänyt tätä. Silti kaiku ei väitä, että toinen olisi selittänyt asian jotenkin huonosti. Se pyytää tarkennusta, mutta samalla jättää avoimeksi sen, mitä lisätietoa tai paljonko vastaajalta odotetaan. Voisiko sitten kuitenkin sanoa joskus ihan vaan suoraan ei? 18.2.2020 Entäs, kun sanoin kerran asiakkaalle vaan että ei ja asiakas otti sen oikein hyvin, niin romuttaako tämä sun Joo, ja -työkalun tarpeellisuuden? Vakuuta yleisösi seisomalla vakuuttavasti 27.9.2019 Olisi tietysti kiva, jos pelkällä puheen sisällöllä olisi väliä. Me emme kuitenkaan luontaisesti luota puhujaan, jonka kehonkieli ei herätä luottamusta ja jonka olemus viestii epävarmuutta. Onni on se, että olemme syntyneet seisomaan vakuuttavasti."
