title = "Onko aina pakko puhua? - Koodarikuiskaaja"
description = "On. Mutta kunnollinen kommunikaatio ei ole tyhjän puhumista, päälle puhumista eikä kuuroille korville puhumista.  Eikö muka?"
full_description = "On. Mutta kunnollinen kommunikaatio ei ole tyhjän puhumista, päälle puhumista eikä kuuroille korville puhumista. Eikö muka? Vaikuttaako tämä vittuilulta? 13.2.2025 Miltei minkä tahansa kysymyksen voi saada kuulostamaan vittuilulta, jos se on tarkoitettu vittuiluksi. Samaan tapaan miltei minkä tahansa kysymyksen voi tulkita vittuiluksi, vaikka se ei sitä olisi. Paljon riippuu siitä, miten kysymyksen esittää. Ajatella! Jakso 76 / 26.1.2025 Jokainen meistä ajattelee. Emme ehkä kuitenkaan tule ajatelleeksi, että ajatteleminen on taito, jota voi kehittää. Huippuajattelijaksi ei siis synnytä, sellaiseksi tullaan. Mutta miten? Vieraana on Lauri Järvilehto."
