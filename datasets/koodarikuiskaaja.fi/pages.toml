title = "Vieraskynä: Konsultti kuuntelee enemmän kuin neuvoo - Koodarikuiskaaja"
description = """
Jarkko työskentelee Reaktorilla valmentajana ja kouluttajana. Hän kouluttaa sekä asiakkaille että reaktorilaisille tiimijohtamisen, tiimityön, fasilitoinnin ja konsultoinnin taitoja – muun muassa konsulttikoulussa. Hän on tehnyt töitä tiimien kanssa lähes 20 vuoden ajan ja on erittäin kiinnostunut siitä, mikä tiimityössä ja johtajuudessa todella toimii, mikä motivoi ihmisiä tekemään parhaansa yhteisen tavoitteen hyväksi.
Twitterissä: @jarkkokailanto
