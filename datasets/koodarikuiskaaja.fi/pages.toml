["https://koodarikuiskaaja.fi/podcast"]
title = "Koodarikuiskaajan podcast - Koodarikuiskaaja"
description = "Koodarikuiskaajan podcast käsittelee vuorovaikutuksen ja itsetuntemuksen teemoja, jotka liittyvät tavalla tai toisella teknisten asiantuntijoiden arkeen."
full_description = "Koodarikuiskaajan podcast on tehty uteliaille teknisille asiantuntijoille, joita kiinnostavat vuorovaikutuksen ja itsetuntemuksen teemat. Jaksoissa käsitellään erilaisia teknologia-alan arkeen liittyviä ihmisaiheita ja vieraina on mielenkiintoisia tyyppejä. Jos kuuntelet podcastia mieluummin jollakin äppylällä, niin valitse tästä omasi. Ajatella! Jakso 76 / 26.1.2025 Jokainen meistä ajattelee. Emme ehkä kuitenkaan tule ajatelleeksi, että ajatteleminen on taito, jota voi kehittää. Huippuajattelijaksi ei siis synnytä, sellaiseksi tullaan. Mutta miten? Vieraana on Lauri Järvilehto. Koodarikuiskaajan Ask Me Anything Jakso 75 / 15.12.2024 Mitä tapahtuu, kun antaa vastuun jakson sisällöstä kuulijoille ja ulkopuoliselle haastattelijalle? Se selviää vain tekemällä juuri niin. Haastattelijana koodarikoomikko Antti Akonniemi. Tämä ei ole lakineuvontaa Jakso 74 / 24.11.2024 Lakikieli on usein koukeroista, ja monisivuisissa sopimuksissa pyritään estämään kaikki mahdolliset riskit. Miksi ja miten niin moni juttu sovitaan, vaikka juristien välinen viestintä ei ole erityisen sovittelevaa? Jakson vieraana on Jussi Kari. Miten tehdään mammutista ketterä? Jakso 73 / 27.10.2024 Mammutin ketteröittäminen kuulostaa koululaisvitsiltä, mutta onkin arkisen todellisuuden kuvaus SOK:n muutosmatkasta. Miten muutosta tehdään? Kuinka muutosvastarinta kohdataan? Missä piilee muutoksen onnistumisen kriittinen kynnys? Vieraana on Sebastian Nyström. Vuorokauden sähkökatkon päässä kuuroudesta Jakso 72 / 29.9.2024 Saavutettavuusasiat on hyvin helppo sivuuttaa, kunnes ne muuttuvat henkilökohtaisiksi. Saavutettavuus konkretisoitui ihan uudella tavalla jakson vieraalle, kun hän kuuroutui aikuisena. Vieraana on Kimja Muru. Jaksatko työssäsi jouluun? Jakso 71 / 25.8.2024 Kesälomien juuri päätyttyä olo on energinen, mutta mitä tapahtuu, kun päivät lyhenevät ja syksyn kiireet yllättävät? Onko työtahti sillä tavalla kestävää, että sitä jaksaa jouluun, seuraavaan kesälomaan, saati eläkeikään saakka? Vieraina ovat Janne Järvinen ja Jari Hakulinen."
