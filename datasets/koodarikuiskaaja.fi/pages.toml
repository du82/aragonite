["https://koodarikuiskaaja.fi/blogi/voiko-olla-kunnollista-kommunikaatiota"]
title = "Voiko olla kunnollista kommunikaatiota? – Koodarikuiskaaja"
description = "Omien ja muilta lainattujen kokemusten mukaan työelämän kommunikaatio-ongelmat ovat muun muassa tällaisia."
full_description = "Omien ja muilta lainattujen kokemusten mukaan työelämän kommunikaatio-ongelmat ovat muun muassa tällaisia. Tyhjän puhumista Turhia palavereita toisensa perään. Puheenvuoroja, joissa ei sanota mitään oikeaa. Jargonia, eksyttämistä, ylimielisyyttä tai alentuvuutta. On toki tilanteita, joissa selkeästi ja suoraan puhuminen on vaikeaa tai jopa mahdotonta. Siitä huolimatta paljon olisi tehtävissä, jotta oppisimme puhumaan kunnolla. Kunnolliseen kommunikaatioon ei kuulu tyhjän puhuminen, vaan puhe on tarkoituksenmukaista, yleisönsä huomioivaa, kunnioittavaa, rakentavaa ja asioita eteenpäin vievää. Päälle puhumista Muka-keskusteluja, joissa huudetaan vuoron perään omia näkemyksiä toisia kuuntelematta. Kohtaamisia, joissa pyritään jyräämään toisen yli omalla agendalla. Hyökkäämistä, puolustuskannalla olemista, toisen bussin alle työntämistä, itsensä nostamista muita polkemalla. Kuuntelu ja kohtaaminen ovat vaikeita ja jokainen epäonnistuu niissä välillä. Tähän tautiin ei auta kuin harjoittelu sekä turvallinen, luottamukseen perustuva työilmapiiri. Konflikteilta ei voi välttyä, mutta rakentava konflikti hoidetaan vuoropuheluna ei päälle huutamalla. Kuuroille korville puhumista Haluttomuutta kuunnella ja ymmärtää kuulemaansa. Kyvyttömyyttä nähdä toinen ihminen ihmisenä ja asettua hänen asemaansa. Toisaalta välinpitämättömyyttä tai tietämättömyyttä siitä, etteivät omat sanat mene perille asti. Tehottomia viestintätapoja, -keinoja ja -kanavia. Ihan aina ei olla edes perillä siitä, että yleisö ei kuuntele. Eikä olla perillä siitäkään, eivätkö he halua kuunnella vai ymmärrä kuulemaansa vai eikö viesti ole koskaan edes saavuttanut kohdeyleisöään. Saatetaan unohtaa, että saneleminen ei ole osallistamista. Ei osata kysyä palautetta, eikä osata ottaa sitä vastaan. Onhan tässä aika paljon tekemistä vielä, että tiedottaminen vaihtuisi vuorovaikuttamiseksi ja vaikutukset alkaisivat näkyä. Ja joskus ongelma on se, ettei ylipäätään puhuta On myös lähtökohtaisesti vaikeaa asettautua kommunikaatiotilanteeseen. Koska ihmiset välttelevät vaikeita tilanteita, on vaan tosi paljon helpompi jättää asiat sanomatta. Antaa tilanteiden tulehtua kaikessa rauhassa pinnan alla. Tai sitten sanotaan jotain, mitä ei tarkoiteta tai tarkoitetaan ihan jotain muuta, kuin mitä sanotaan. Kaikissa kohtaamissani työtyytyväisyyskyselyissä yhdeksi kehityskohteeksi nostettiin sisäinen viestintä, mutta mitä sen pitäisi olla, että se olisi hyvää ja sitä olisi riittävästi? Miten irtisanoutumiset eivät tulisi johdolle yllätyksenä? Kuinka tiimit saataisiin työskentelemään tehokkaammin yhteen? Miten oppisimme kohtaamaan, kuuntelemaan ja keskustelemaan? Mistä löytyy empaattisuus? Kas siinäpä työnsarkaa. Voisinkohan auttaa? Syvenny aiheeseen: Puhu päättäjä puolellesi"
author = "Elisa Heikura"
