full_description = "Vaikuttaako tämä vittuilulta? 13.2.2025 Miltei minkä tahansa kysymyksen voi saada kuulostamaan vittuilulta, jos se on tarkoitettu vittuiluksi. Samaan tapaan miltei minkä tahansa kysymyksen voi tulkita vittuiluksi, vaikka se ei sitä olisi. Paljon riippuu siitä, miten kysymyksen esittää. Vieraskynä: Vaikeat keskustelut – Tie syvempään ymmärrykseen ja kasvuun 27.1.2025 / Juha Takkinen Vaikeat keskustelut herättävät pelkoa ja epävarmuutta. Silti ne ovat myös mahdollisuuksia oppia sekä itsestämme että toisista. Vaikeiden keskustelujen kohtaaminen on onneksi myöstaito, jota voi kehittää. Miksi se kuulostaa kuulustelulta? 14.1.2025 Oletko joskus esittänyt jollekulle täysin viattoman ja vilpittömän “miksi”-kysymyksen ja saanut vastaasi puolustuskannalle heittäytyneen ihmisen vastahyökkäyksen? Syy saattaa löytyä kyseenalaistamistaustasta, häpeästä tai tyytymättömyydestä omaan toimintaan. “No, se nyt on, mitä se on” 13.12.2024 “No joo, mutta ei siitä sen enempää”, “Sellaista sattuu” ja “Jaa, mun täytyykin tästä lähteä.” On monia tapoja vähätellä omaa kokemustaan ja päättää keskustelu. Ehkä ei kuitenkaan kannattaisi. Ihmiset ärsyttävät ja se on ihan ok 8.11.2024 Ärsyttävyys kuuluu elämään, ja sitä on syytä suorastaan odottaa. Ärsytyksen ilmestyminen ei ole merkki siitä, että kaikki on mennyt pilalle, vaan merkki siitä, että kaikki on niin kuin kuuluukin olla. Kontekstin kertominen parantaa keskustelun laatua 9.10.2024 Konteksti, eli miksi juuri meille kerrotaan juuri tämä asia, parantaa keskustelun laatua. Kertoja saa paremman vastineen kertomukselleen, ja kuulija jaksaa ja osaa kuunnella paremmin. Oliko pomosi Nordic Business Forumissa 2024 27.9.2024 Jos pomosi oli NBF:ssä, hän on luultavasti nyt altis erilaisille kehitysideoille. Nappaa tästä tärppilista ensi maanantaipalaverin agendalle. “Mä olen vaan rehellinen!” 12.9.2024 Jos tarkoituksemme on käydä antoisaa keskustelua, ei riitä, että on rehellinen. On oltava myös rakentava, myötätuntoinen ja ymmärtäväinen. Ilman näitä rehellisyys todennäköisesti aiheuttaa vain tuhoa."
