["https://koodarikuiskaaja.fi/blogi/vaikuttaako-tama-vittuilulta"]
title = "Vaikuttaako tämä vittuilulta? - Koodarikuiskaaja"
description = "Kysymyksen voi saada kuulostamaan vittuilulta, jos se on sellaiseksi tarkoitettu. Paljon riippuu siitä, miten kysymyksen esittää."
full_description = "Koodarikuiskaajan Slackissa eräs asiantuntija kysyi kerran, että “Voinko kysyä työhaastattelussa tällaisen kysymyksen, vai vaikuttaako se liian vittuilulta?” Kysymystä siinä sitten yhdessä ruodimme ja analysoimme, että vaikuttaako vaiko eikö vaikuta. Yksi erittäin hyvä kommentti keskusteluun tuli Tero Ykspetäjältä: “Kyllähän nuo on hyviä kysymyksiä, varsinkin jos haluat olla töissä organisaatiossa, jossa tuollaisten kyselyä ei oteta vittuiluna – jo reaktio kysymyksiin voi kertoa paljon työympäristöstä.” Olin (ja olen edelleen) Teron kanssa samaa mieltä. Koin silti, että asiaa oli syytä hieman avata ja monipuolistaa. Siksi piirtää humpsautin lennossa alla olevan, erittäin hienon nelikentän. Vaikuttaako vittuilulta vs. oliko se vittuilua Aika paljon riippuu siitä, miten kysymyksen esittää. Miltei minkä tahansa kysymyksen voi saada kuulostamaan vittuilulta, jos se on tarkoitettu vittuiluksi. Samaan tapaan miltei minkä tahansa kysymyksen voi tulkita vittuiluksi, vaikka se ei sitä olisi. Asiaa voi siis lähestyä nelikenttänä, jossa sekä kysyjän että vastaanottajan asenne ratkaisevat, mikä otetaan vittuiluna ja mikä ei. Määrittelen, että jos kysymys on vilpitön, silloin sitä ei ole tarkoitettu vittuiluksi. Jos puolestaan tausta-asenne on tuomitseva, silloin kysymys on tarkoitettu vittuiluksi. Jees ja käy järkeen – luonnollisia viestinnän lopputuloksia Mikäli kysyjän tarkoitus ja vastaanottajan tulkinta ovat linjassa, niin siinä ei ole mitään kummallista. Jos kysymys on vilpitön ja se otetaan vilpittömänä vastaan, eli siihen vastataan asiallisesti, silloin viestinnässä ei ole mitään ihmeellistä. Jos puolestaan kysymys on asennoitunut ja siinä on vittuileva sävy, käy järkeen, että vastapuoli menee asiasta puolustuskannalle tai kokee kysymyksen asiattomaksi. Jos siis oma kysymys tulkitaan vittuiluksi, on syytä kurkistaa peiliin: mikä oma asenne kysymyksen takana oikeastaan olikaan. Jos käy ilmi, että muka viattoman kysymyksen sisuksissa on kasapäin tuomitsemista, kyseenalaistamista ja arvostelua, ei voi syyttää vastapuolta, jos hän kokee kysymyksen vittuiluksi. OMG – armeliaisuusperiaatetta vai ymmärtämättömyyttä? Alkujaan ajattelin omg-laatikon niin, että jos jollekulle vittuillaan päin naamaa ja hän pystyy silti vastaamaan kysymykseen asiallisesti, kyseessä on ensiluokkainen kommunikoija. Hänellä on riittävästi itsetuntoa olla provosoitumatta, kykyä soveltaa armeliaisuusperiaatetta ja ylipäätään henkistä kanttia ottaa vastaan kyseenalaistamista neutraalisti ja ammattitaitoisesti. Näin jälkikäteen olen miettinyt, että omg-laatikon voi selittää myös ymmärtämättömyys. On täysin mahdollista, että vastaaja ei ymmärrä tai tunnista kysymyksen olevan vittuilua ja näin ollen reagoi siihen ikään kuin se ei olisi. Joka tapauksessa ajattelen, että kunkin meistä olisi hyvä pyrkiä olemaan ottamatta asioita vittuiluna – olivatpa ne sitä tai eivät. SOS – vastaajalla on työtä tehtäväksi Mikäli kysymystä ei (vilpittömästi!) ole tarkoitettu vittuiluksi ja se sellaiseksi silti tulkitaan, tilanne kertoo siitä, että vastapuolella olisi itsereflektion paikka. On täysin mahdollista ja aika luonnollistakin, että kysymys on vienyt puolustuskannalle syystä tai toisesta. Silti useimpien meistä tulisi ammattimme puolesta olla itsestämme sen verran tietoisia, että pystyisimme analysoimaan omia reaktioitamme lennossa ja välttämään tähän ruutuun päätymisen. Itse asiassa elämästä tulee ylipäätään helpompaa, jos opimme tunnistamaan tämän laatikon olemassaolon ja välttämään sinne joutumista. Tässä tehtävässä voi auttaa: Armeliaisuusperiaatteen soveltaminenHanlonin partaveitsen soveltaminen“Mitä muuta tämä voisi tarkoittaa?” -kysymyksen esittäminen itselleenHengittäminen ja aikalisätTarina, jota itselleni tapahtuneesta sepitän -työkaluTilanteelle antamienne tulkintojen tarkasteleminenOmien tunteidensa hyväksyminen ja käsitteleminen Ole rehellinen itsellesi Alan olla yhä enemmän sitä mieltä, että kaiken viestinnän onnistumisen salaisuus on rehellisyys itseä kohtaan. Aika usein viestintä kompastelee siihen, kun sanamme ja aikomuksemme ovat ristiriidassa keskenään. Yritämme olla ystävällisiä, kun oikeasti meitä kiukuttaa.Puemme viestimme nättiin muotoon, vaikka todellisuudessa tarkoituksemme on kritisoida.Emme tunnusta itsellemmekään, mitä ihan oikeasti pohjimmiltaan tarkoitamme. Siksi viestijän tärkein työkalu on peili. Kun riittävän usein ja riittävän syvällisesti analysoi, mitä oikeastaan onkaan tekemässä, on suurempi todennäköisyys onnistua tehtävässään. TL;DR: Vittuilun nelikenttä – vaikuttaako vittuilulta vai oliko se vittuilua? Kysymyksen esitystapa vaikuttaa paljon.On luonnollista, että kysyjän tarkoitus ja vastaanottajan tulkinta ovat linjassa: vilpittömään kysymykseen vastataan asiallisesti ja vittuilu koetaan asiattomaksi.Jos kysymyksesi tulkitaan vittuiluksi, tarkista oma asenteesi kysymyksen takana.Kunkin meistä olisi hyvä pyrkiä olemaan ottamatta asioita vittuiluna – olivatpa ne sitä tai eivät.Vittuiluun voi vastata asiallisesti, jos on riittävästi itsetuntoa olla provosoitumatta, kykyä soveltaa armeliaisuusperiaatetta ja ylipäätään henkistä kanttia ottaa vastaan kyseenalaistamista neutraalisti ja ammattitaitoisesti.Jos kysymystä ei (vilpittömästi!) ole tarkoitettu vittuiluksi ja se silti tulkitaan sellaiseksi, vastapuolella olisi itsereflektion paikka.Aika usein viestintä kompastelee siihen, kun sanamme ja aikomuksemme ovat ristiriidassa keskenään. Siksi viestijän tärkein työkalu on peili. Syvenny aiheeseen: Puhu päättäjä puolellesi"
