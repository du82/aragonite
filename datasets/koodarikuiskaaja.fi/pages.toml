["https://koodarikuiskaaja.fi/mita-maksaa"]
title = "Mitä maksaa? - Koodarikuiskaaja"
description = "Koodarikuiskaajan osaamista voi ostaa koulutusten muodossa sekä viestinnän tiiviskurssina. Kysy myös tarjous pitkäjänteisemmästä henkilöstön kehittämisestä."
full_description = "Aiheet Mikä aihe olisi juuri nyt tärkeä, hyödyllinen tai kiinnostava? Teknisten asiantuntijoiden kommunikaatio – keskenään ja muille kohdeyleisöille Palautteen antaminen, vastaanottaminen ja pyytäminen Vaikeat keskustelut ja kuunteluopit panttivankineuvottelijoilta Itsetuntemus ja muiden ymmärtäminen Huijarisyndrooma ja sen selätys Vastuunotto ja ongelmanratkaisu Kaikki sisältöni ovat konkreettisia ja käytännönläheisiä. Kuten yksi koodari palautteessaan sanoi: ”tarpeettomasti todellisuutta sumentava jargon ja mystiikka loistaa poissaolollaan”. Esiinnyn sekä suomeksi että englanniksi. Toteutustapa ja kesto Mikä toteutus sopii teille parhaiten tai mikä on tapahtuman kesto? Keynote (0,5–1 h) – inspiroiva puheenvuoro, tarinoita, ideoita ja oivalluksia Koulutus (1–2,5 h) – vuorovaikutteinen koulutus, teoriaa, pohdintaa ja tehtäviä Workshop (3–6 h) – ohjattu työpaja, asioiden työstämistä yhdessä oppien Hinnat Etätoteutus TKU, TRE, pk-seutu Muu Suomi Keynote 2300 € 2700 € 3100 € Koulutus 2800 € 3200 € 3600 € Workshop 3300 € 3700 € 4100 € Hinnat sisältävät matkakulut ja mahdolliset majoitukset. Hintoihin lisätään alv 25,5 %. Koulutuksillani on aina tyytyväisyystakuu. Osallistujien kokemuksia koulutuksista ja workshopeista Tiiviskurssi 4-10 hengen tiimille Tiiviskurssille kannattaa laittaa kerralla kokonainen tiimi, paitsi jos tiimi on tolkuttoman iso. Osallistujamäärän tulee olla korkeintaan 10, jotta saadaan oikeita asioita aikaan. Tiiviskurssin sisältöaiheita ovat: Kieli viestintävälineenä eli miksi viestintä epäonnistuu Kysymisen ja kuuntelemisen periaatteet Palautteen antaminen ja vastaanottaminen Konfliktit ja muut epämukavat kärhämät Luottamuksen rakentaminen ja suhteiden kehittäminen Tavoitteellinen viestintä eli kannattaako olla onnellinen vai oikeassa Sisältö vaihtelee hieman riippuen siitä, onko kyseessä sisäinen ohjelmistokehitystiimi vai koostuuko tiimi ohjelmistokonsulteista. Kurssi koostuu neljästä 2-3 tunnin koulutuksesta, jotka järjestetään kerran kuussa. Lisäksi jokaiseen sisältöön kuuluu esitehtävä, purkutehtävä ja tunnin reflektiopuhelu sekä raportti esihenkilölle. Tiiviskurssin hinta Toteutus Hinta kuukaudessa Kokonaishinta Etäopetus 2300 € 9 200 € Lähiopetus Turussa, Tampereella tai pk-seudulla 2500 € 10 000 € Lähiopetus väliasemilla tai muualla Suomessa 2900 € 11 600 € Hinnat sisältävät matkakulut ja mahdolliset majoitukset. Hintoihin lisätään alv 25,5 %. Tiiviskurssilla on tyytyväisyystakuu. Osallistujien kokemuksia tiiviskurssista Strategisen konsultoinnin valmennusohjelma Tämä 12 viikon intensiivinen valmennusohjelma on suunnattu ohjelmistokonsultille, joka todella haluaa kehittää omia konsultointitaitojaan ja oppia kehittämään asiakassuhdetta strategisesti. Viikkokohtainen työmäärä on maltillinen, mutta mitä enemmän konsultti paneutuu tehtäviin ja sitoutuu tavoitteiden saavuttamiseen, sitä enemmän hän myös ohjelmasta saa. Kokonaisuudella on kolme tavoitetta: Vahvistaa konsultin ja asiakkaan välistä luottamusta ja kehittää asiakassuhdetta. Lisätä konsultin ymmärrystä asiakkaan strategisista tavoitteista ja omasta roolista osana asiakkaan kokonaiskuvaa. Tukea konsultin ja asiakkuusvastaavan välistä työskentelyä, laajentaa ja syventää asiakkuutta sekä miettiä asiakkaan tulevaisuutta asiakkaan tarpeista käsin. Ohjelman hinta on 3500 € + alv / konsultti. Fasilitointi Kasvukipuja tiimissä, isoja teemoja käsiteltäväksi tai tarvetta puhua vaikeista asioista? Kaipaatko päivän vetäjäksi ulkopuolista innostajaa, joka huolehtii päivän kulusta? Fasilitoin erilaisia keskusteluja ja workshopeja lempeän jämäkästi ja energisen pedantisti. Fasilitointi (3–6 h) suunnitteluineen maksaa 2900 € + alv. Hinta sisältää matkakulut. Huom! Vastaan vain fasilitoinnista, en fasiliteeteista. Eli paikan ja tarjoilujen järjestäminen jää tilaavan tahon vastuulle. Koodarikuiskaaja as a Service Jos kaipaat järeämpää ja pitkäjänteisempää henkilöstön kehittämistä, on syytä istua alas ja tehdä perusteellinen suunnitelma. Kuukausilaskutteinen koodarikuiskaaja tulee paikan päälle, päivystää digikanavissa, kouluttaa, valmentaa ja fasilitoi esimiehiä, tiimejä sekä yksilöitä, kunnes tavoitteet on saavutettu. Haaveillaan yhdessä, mihin kaikkeen voimmekaan pystyä! Näin Koodarikuiskaaja auttoi Evermadea ”Kun ymmärsin kaipaavani apua ihmisiin ja viestimiseen liittyvissä teemoissa, ei tarvinnut kahta kertaa miettiä että mihin olla yhteydessä. Koodarikuiskaaja-as-a-service tyyppisen palvelun myötä Elisa vietti Evermadella 1-2 päivää viikossa seuraavat 1,5 vuotta ja voi veljet, että se auttoi. Elisan kanssa kehitimme esihenkilötyötä, loimme prosesseja, laitoimme tiimejämme vähän uuteen uskoon ja loimme huolenpitomalleja ihmisillemme. Vaikutukset näkyvät vielä vuosienkin päästä ja en usko että olisimme yhtiönä siellä missä nyt olemme, ilman Elisan tärkeää panosta noina vuosina. Arvio: 10/10 ja papukaijamerkki.” – Julius Haukkasalo, toimitusjohtaja, Evermade ”Evermade oli kasvamassa voimakkaasti, ja henkilöstön hyvinvointi teemana oli jäänyt vähän muutosten varjoon. Elisan avulla saimme kirkastettua etenkin esihenkilötyötä sekä turvallisen työpaikan käytäntöjä. Henkilökohtaisesti Elisan apu oli korvaamatonta – sparrailu tiukoissa tilanteissa auttoi tuoretta esihenkilöä valtavasti ja lämpimät aidot kohtaamiset avasivat minulle myös uutta suuntaa omalla työuralla.” – Kirsi Maijala, Head of People and Culture, Evermade ”Mikään ei ole vaikeampaa, kuin muuttaa yrityksen kulttuuria. Olemme Evermadella vaalineet aina ihmisten hyvinvointia ja jaksamista. Kriittisessä kasvuvaiheessa emme kuitenkaan selvinneet muutoksesta omin voimin ja tämä näkyi ihmisten hyvinvoinnissa. Loimme Elisan avulla koko organisaation huolenpitomallin, jonka avulla saimme oikaistua tilanteen ja luotua uudenlaisen ihmiskeskeisen kasvua kestävän yrityskulttuurin. Työn vaikutukset näkyvät meidän arjessa vielä useiden vuosien ja yrityksen koon tuplaantumisen jälkeenkin.” – Jaakko Alajoki, CTO, Evermade Tuumasta toimeen Nakkaa sähköposti osoitteeseen: elisa@koodarikuiskaaja.fi"
