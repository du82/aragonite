["https://koodarikuiskaaja.fi/tietosuojaseloste"]
title = "Tietosuojaseloste - Koodarikuiskaaja"
description = "Täällä koodarikuiskaaja.fi-osoitteessa imperiumia rakentaa Elisa Heikura ja olen vastuussa tietosuojastasi siinä missä viihtyvyydestäsikin."
full_description = "Kuka tästä on vastuussa? Täällä koodarikuiskaaja.fi-osoitteessa imperiumia rakentaa Elisa Heikura ja olen vastuussa tietosuojastasi siinä missä yleisestä viihtyvyydestäsikin. Kaikki kysymykset tietosuojaan liittyen voi lähettää joko osoitteeseen elisa@koodarikuiskaaja.fi tai saa sitä soitellakin: 041 435 9191. Ja jos ihan rehellisiä ollaan, niin on tässä taustalla myös Elisa Heikura Oy (Y-tunnus 2905069-3). Mitä henkilötietoa kerään ja miksi Kommentit Jos jätät sivustolle kommentin (Ja todellakin toivon, että jätät!), sivusto kerää kommenttilomakkeessa olevat tiedot (nimi, sähköpostiosoite ja itse viesti), sekä IP-osoitteen ja selaimen versiotiedot roskaviestien tunnistamisen helpottamiseksi. Nämä säilyvät verkkopalvelussa niin kauan kuin se on pystyssä. GDPR-kielellä kommenttien käsittelyperusteena on suostumus – eli jos jokin jättämäsi kommentti alkaa sinua kovasti kaduttaa, niin poistan sen kyllä pyynnöstäsi. IP-osoitteen ja selaimen versiotietojen osalta käsittelyperusteena on kuitenkin rekisterinpitäjän oikeutettu etu (niitä käytän roskapostin estämiseen). Evästeet Evästeitä hyödynnetään sivuston analytiikassa. GDPR-kielellä myös evästeiden tallentaminen perustuu suostumukseesi. Analytiikka Tutkailen vierailijoideni määrää ja aktiviteetteja Google Analyticsin avulla. Sen perusteella en pysty erottamaan yksittäistä kävijää toisesta, vaikka seisoisitte kuinka harvassa. Pystyn vain sanomaan, että tämä sisältö kiinnosti ja tuo selvästikään ei. Google Analytics hyödyntää evästeitä ja nämä tiedot poistuvat selaimesta vuoden kuluttua. Koska en voi tunnistaa yksittäisiä kävijöitä Google Analyticsistä, ne eivät myöskään ole GDPR:n mukaisia henkilötietoja. Muilta sivustoilta upotettu sisältö Tämän sivuston artikkelit voivat sisältää upotettua sisältöä (esimerkiksi videoita, kuvia tai sosiaalisen median sisältöä). Toisilta sivustoilta tuodun sisällön klikkaaminen tai selaaminen on verrattavissa siihen, että kävisit itse kolmannen osapuolen sivustolla. Nämä sivustot voivat kerätä tietoa sinusta, käyttää evästeitä, lisätä kolmannen osapuolen seurantaevästeitä ja monitoroida vuorovaikutustasi upotetun sisällön kanssa, mukaan lukien vuorovaikutuksen seuranta, jos ja kun olet kirjautunut käyttäjänä sivustolle. Toisin sanottuna en voi vaikuttaa siihen, mitä nämä kolmannet osapuolet seuraavat, koska se ei ole hyppysissäni. Mutta pyrin lisäämään vain sellaista sisältöä, johon itsekin luotan. Mitä oikeuksia sinulla on omaan tietoosi Mikäli olet jättänyt kommentteja tai ostanut verkkokursseja, voit pyytää koostetiedostoa kaikesta henkilötiedosta, jonka olet antanut. Voit myös pyytää henkilötietojesi poistoa. Oikeus omien tietojen poistoon ei koske sellaista henkilötietoa, joka on säilytettävä ylläpidollisista, juridisista tai tietoturvaan liittyvistä syistä. Tietosuoja-asetuksen mukaisesti sinulla on myös tarkistusoikeus (oikeus tarkistaa rekisteriin sinusta tallentamani henkilötiedot ja korjata virheellisiä tietoja tai täydentää niitä) sekä vastustamisoikeus (oikeus vastustaa henkilötietojesi käsittelyä, mikäli epäilet, että käsittelen tietojasi laittomasti tai ilman oikeutta siihen). Oikeus peruuttaa suostumus Kuten ehkä huomasit, tyypillisin käsittelyperusteeni henkilötiedoille on – GDPR-kieltä käyttäen – suostumus. Jos näihin tietoihin viitaten lausut minulle ääneen taikasanat “peruutan suostumukseni” (tai lähetät siitä minulle sähköpostia tai muuta kirjallista viestintää), poistan tietosi nopeammin kuin sanot “simsalabim”. Mistä saan tietosi? Kaikki tietosi tulevat sinulta itseltäsi tai sitten selaimesi kertoo ne taikajärjestelmilleni evästeiden avulla. Tarkempia tietoja siitä, mitä tietoja saan milloinkin, löydät yltä. Missä tietosi sijaitsevat ja minne ne lähetetään? Koodarikuiskaaja.fi sijaitsee Seravo Oy:n (Y-tunnus 2392019-2) palvelimilla Suomessa. Tietojasi ei luovuteta mihinkään tietosuojaan leväperäisesti suhtautuvaan maahan, kuten EU:n ulkopuolelle. Kommentteja saatetaan tarkistaa automatisoidun roskapostiestopalvelun kautta. Muuten tietoa ei lähetetä minnekään eikä kenellekään. Automaattinen päätöksenteko ja profilointi En käsittele tietojasi automaattisen päätöksenteon eli profiloinnin avulla. Ihan itse teen päätökset. Paitsi ylläoleva automaaginen roskapostiesto. Askarruttaako? Ota yhteyttä: elisa@koodarikuiskaaja.fi Oikeus tehdä valitus tietosuojaviranomaiselle Jos käsittelin tietojasi mielestäsi epäreilusti tai jotain muuta jäi hampaankoloon, sinulla on oikeus myös valittaa tietosuojavaltuutetulle. Tietosuojavaltuutetun sivut löydät osoitteesta tietosuoja.fi."
