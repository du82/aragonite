["https://koodarikuiskaaja.fi/blogi/oliko-pomosi-nordic-business-forumissa-2024"]
title = "Oliko pomosi Nordic Business Forumissa 2024 - Koodarikuiskaaja"
description = "Jos pomosi oli NBF:ssä, hän on nyt altis erilaisille kehitysideoille. Nappaa tästä tärppilista ensi maanantaipalaverin agendalle."
full_description = "Tämän vuoden Nordic Business Forumissa keskeisiä teemoja olivat: rohkea johtaminen muuttuvassa ja epävarmassa ympäristössäerityislaatuinen asiakaskokemus ja syvä inhimillisyys kilpailuetuna sekäkeskittyminen ja rohkeus tehdä strategisia valintoja, olipa kyse sitten yrityksen tavoitteista, brändistä tai oman osaamisen kehittämisestä. Jos pomosi oli Nordic Business Forumissa, häntä on siis kahden päivän ajan kylvetetty erilaisilla näkökulmilla, teorioilla ja ideoilla siitä, mitä organisaatiossa kannattaisi juuri nyt tehdä. Jos sinulla puolestaan on ollut jo pidempään mielessä jonkinlainen kehitysehdotus, nyt saattaa olla oivallinen hetki ottaa asia puheeksi. Tässä tärppilista erilaisia kehitysideoita, joille pomosi saattaa tämän NBF-tapahtuman jäljiltä olla erityisen avoin. Oman osaamisen kehittäminen Koetko, että tarvitsisit uusia taitoja ja kaipaisit koulutusta? Haluaisitko päivittää osaamistasi seuraavalle tasolle tai ottaa urallasi uusia aluevaltauksia? Pelottaako, että AI vie työsi tai että et pärjää tekoälymurroksessa ja haluaisit turvata tulevaisuuttasi oppimalla sitä lisää? Jos pomosi oli hereillä seminaarissa, hän tietää, että tulevien vuosien aikana organisaatioiden on kehitettävä henkilöstön osaamista merkittävästi. Sekä tekoälyyn liittyen että ylipäätään. Koska tekoäly korvaa ja automatisoi triviaaleja työvaiheita, henkilöstöltä vapautuu aikaa tehdä muita asioita ja sen seurauksena ihmisillä täytyy olla sekä intoa että taitoa ottaa näitä uusia asioita haltuun. Lisäksi läpi seminaarin painotettiin, että ihmisissä on paljon piilossa olevaa potentiaalia, jonka hyödyntäminen tekee työntekijöistä onnellisempia, motivoituneempia ja sitoutuneempia. Jos siis koet, että et pääse hyödyntämään parasta itseäsi työssäsi, nyt on juuri se hetki, kun tästä asiasta kannattaa puhua esihenkilön kanssa. Aiheeseen liittyneet puheenvuorot Adam Grant: The Science of Achievement and Surfacing Hidden PotentialLiz Wiseman: Are Your Leaders Geniuses or Genius Makers?Sanna Suvanto-Harsaae: Why and How CEOs and Executive Teams SucceedMorten Hansen: From Talent Development to Results: The Five Disciplines of Corageous Leaders Tavoitteiden vähentäminen ja keskittyminen Tuntuuko siltä, että organisaatiossanne on liian monta tavoitetta yhtä aikaa? Aloitetaanko enemmän kuin saadaan valmiiksi? Onko omalla työpöydälläsi kasoittain tehtäviä, joiden pariin et lainkaan ehdi? Haluaisitko selkeyttää työnkuvaasi ja tavoitteitasi? Tämä kestosuosikki NBF-aiheissa oli esillä jälleen tänäkin vuonna. Erityisen painavasti asiasta puhui Sanna Suvanto-Harsaae, joka painotti, että johtajat ja johtoryhmät epäonnistuvat usein siksi, että heillä on liian monta tavoitetta yhtä aikaa. Hän kehotti keskittymään ja pitämään huolta, että valittuja tavoitteita on vähän, mutta ne ovat isoja ja merkityksellisiä. Saman aiheen puolesta puhui myös Morten Hansen, jonka puheenvuorossa yksi rohkean johtajuuden kulmakivista on kyky sanoa ei. Jos siis pomosi yrittää ehdottaa jälleen yhtä kehitysprojektia tai tavoitetta entisten rinnalle, häntä voi muistuttaa siitä, mitä Sanna ja Morten juuri opettivat. Aiheeseen liittyneet puheenvuorot Sanna Suvanto-Harsaae: Why and How CEOs and Executive Teams SucceedMorten Hansen: From Talent Development to Results: The Five Disciplines of Corageous Leaders Yrityksen palautekulttuurin kehittäminen Saatko tarpeeksi palautetta ja onko palaute laadukasta? Hymistelläänkö organisaatiossa ja jätetäänkö vaikeita asioita sanomatta? Siedetäänkö alisuoriutumista, tuleeko ihmisille potkuja puskan takaa tai onko kenties pomolle itselleen erittäin vaikea antaa palautetta? Olisiko ylipäätään palautekulttuurissa kehittämistä? Juuri nyt pomollasi on todennäköisesti mielessään, miten Kim Scott puhui radikaalin suoruuden puolesta. Scott opetti, että meidän täytyy sekä välittää henkilökohtaisesti että haastaa suoraan toisiamme, jos haluamme kehittää turvallisen, reilun ja toimivan työyhteisön. Myös Sanna Suvanto-Harsaae mainitsi, että liiallinen kiltteys ja sen takia sanomatta jätetyt asiat vahingoittavat itse asiassa enemmän kuin asioiden ottaminen reilusti puheeksi. Hampurilaismallin hylkäämisestä mainitsivat sekä Kim Scott että Adam Grant, joten jos joku vielä tarjoilee palautehamppareita, niin nyt niistä kannattaa viimeistään hankkiutua eroon. Lisäksi pomosi on itse luultavasti valmiimpi ottamaan vastaan palautetta nyt, kun hän on kuunnellut painavia sanoja siitä, miten: johtajien täytyy johtaa itseään ensinitsereflektointi ja oman haavoittuvuutensa kanssa työskentely on tärkeää jajohtaja voi monella eri tavalla olla tahtomattaan ja vahingossa henkilöstön potentiaalin tukahduttaja. Aiheeseen liittyvät puheenvuorot Kim Scott: Fostering Collaboration through Radical CandorLiz Wiseman: Are Your Leaders Geniuses or Genius Makers?Adam Grant: The Science of Achievement and Surfacing Hidden PotentialSanna Suvanto-Harsaae: Why and How CEOs and Executive Teams SucceedBrené Brown: Cultivating Meaning and Connection Asiakaskokemuksen kehittäminen Koetko, että organisaatiossa asiakas (sisäinen tai ulkoinen) välillä unohtuu? Menevätkö organisaation prosessit, yrityksen tavoitteet, ihmisten oma etu tai mukavuus, arkinen kiire ja häsellys tai jokin muu asiakkaan tyytyväisyyden edelle? Tuntuuko siltä, että kilpailijat juoksevat ohi oikealta ja vasemmalta? Sinun ei tarvitse kuin kuiskata pomollesi kaksi sanaa: “unreasonable hospitality”. Kohtuuttomasta vieraanvaraisuudesta puhui Will Guidara, ravintolamoguli, joka nosti Eleven Madison Parkin maailman parhaaksi ravintolaksi ensiluokkaisen asiakaspalvelun avulla. Hänen puheensa sai allekirjoittaneen itkemään, niin koskettava, inhimillinen ja inspiroiva se oli. Joten jos juuri nyt pomosi ei mieti kuumeisesti, miten organisaatiosi voisi palvella asiakkaitaan paremmin, niin se on jo ihme. Epäilen, että hän karkasi keskiviikkona ennen aikojaan ja missasi tämän puheen. (Onneksi hän voi vielä katsoa sen tallenteena 90 päivää.) Kun maailmassa on epävarmuutta, meidän täytyy entistä tarkemmin miettiä, miksi teemme sitä, mitä teemme. Kuinka voimme pitää huolta, että asiakkaat pitää meistä (ja yrityksen brändistä) niin paljon, että he puhuvat meistä hyvää muillekin? Aiheeseen liittyvät puheenvuorot Will Guidara: Customer Experience as an Unfair Competitive AdvantageSteven Van Belleghem: Customer-Focused Leadership in a Digital WorldBozoma Saint John: Building Badass Brands Ihmistaitojen tärkeys Brené Brown sanoi koko seminaarin päättäneessä haastattelussa: “There are things that are always going to be uniquely human. Unfortunately most people are not good at those things.”– Brené Brown Eli on olemassa asioita, jotka tekevät ihmisistä uniikisti ihmisen. Asioita, joita tekoäly ei tavoita, korvaa tai tee tarpeettomaksi. Mutta valitettavasti moni meistä on aika huono juuri niissä asioissa, jotka tekevät ihmisestä ihmisen (niin paradoksaalista kuin se onkin). Itse asiassa moni meistä arvostaa, korostaa ja hyödyntää itsessään enemmän niitä asioita, jotka tekevät meistä “robottimaisen”: loogista ajattelua ja matemaattista ongelmanratkaisua, prosessien laatimista ja noudattamista, kategorisointia, tunteiden häivyttämistä ja oman haavoittuvuuden etäännyttämistä. Kuitenkin tulevaisuudessa ihmisen rooli on olla yhä enenevässä määrin ihminen: sotkuinen, inhimillinen, haavoittuva, luova, kokeva, tunteva ja elävä. Jotta ihmiset voivat vahvistaa omaa ihmisyyttään, se tulee vaatimaan valtavia määriä itsereflektiota, nöyryyttä, metakongitiota sekä tunne- ja viestintätaitoja. Joten jos tuntuu siltä, että näissä asioissa olisi tekemistä joko itsellä, tiimillä, työyhteisöllä tai pomolla, niin juuri nyt olisi hyvä hetki miettiä, mitä asialle voisi tehdä. Pidetään huolta, että ihmisyys, koko kauneudessaan ja kamaluudessaan, on jatkossakin ihmisten oma asia. Aiheeseen liittyneet puheenvuorot: Brené Brown: Cultivating Meaning and ConnectionAdam Grant: The Science of Achievement and Surfacing Hidden PotentialLiz Wiseman: Are Your Leaders Geniuses or Genius Makers? Maanantaipalaverin agenda uusiksi Pomollasi on pääsy seminaaritallenteisiin 90 päivän ajan. Poimi listasta mielenkiintoiset ja kysy, voisitteko katsoa puheenvuorot yhdessä koko tiimin voimin. Keskustelkaa siitä, mitä tämä tarkoittaa teidän tiiminne tai organisaationne näkökulmasta. Miten voisitte yhdessä viedä näitä teemoja ja kehityskohteita eteenpäin? Lisäksi voit aina työntää pomosi lounaalle minun kanssani – tai tulla itse! Olen syvästi samaa mieltä Brené Brownin kanssa. Juuri nyt on se hetki, kun ihmisyys ja siihen liittyvät taidot ovat meille äärimmäisen keskeisiä. Nakkaa sähköposti, niin jutellaan asiasta lisää: elisa@koodarikuiskaaja.fi Tiedämme jo, miksi nämä ovat tärkeitä. Nyt jäljellä on vain se kaikkein vaikein, eli asioiden vieminen käytäntöön. Mitä sinä tekisit seuraavaksi? Tule jutulle Koodarikuiskaajan Slackiin! Syvenny aiheeseen: Kentältä ja konepellin alta"
