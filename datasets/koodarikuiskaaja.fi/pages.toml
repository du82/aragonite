["https://koodarikuiskaaja.fi/aihepiiri/paivita-sun-softia"]
title = "Päivitä sun softia - Koodarikuiskaaja"
description = """
Ensin tullaan tietoiseksi, sitten aletaan kehittää
Päivitämme tietokoneet uusiin muutaman vuoden välein, käyttöjärjestelmät ja ohjelmistot harva se päivä. Silti unohdamme välillä tarkistaa, millä tolalla on se ohjelmointi, joka meitä päivästä toiseen ohjaa.
Kommunikaatiomme laatu ei ole ihan täysin omissa käsissämme. Kuinka kuuntelemme, kohtaamme ja ymmärrämme muita, ei ole tyystin tietoisen mielen valinta. Ja vaikka kuinka niin haluaisimme välillä uskoa, emme ole aivan suvereenisti oman käytöksemme ohjaksissa.
Lapsuudesta nykyhetkeen kerätty erilaisten sääntöjen, uskomusten ja toimintatapojen kokoelma päättää yllättävän pitkälle, kuinka toimimme kussakin tilanteessa. Hyvä uutinen on se, että muutumme ja kasvamme läpi elämän. Omaan ohjelmointiin on mahdollista tietoisesti vaikuttaa. Siksi tärkein työ ihmis- ja viestintätaitojen parantamiseksi tehdään korvien välissä."""
full_description = "Ihmiset ärsyttävät ja se on ihan ok 8.11.2024 Ärsyttävyys kuuluu elämään, ja sitä on syytä suorastaan odottaa. Ärsytyksen ilmestyminen ei ole merkki siitä, että kaikki on mennyt pilalle, vaan merkki siitä, että kaikki on niin kuin kuuluukin olla. Sinä ≠ ajatuksesi 13.6.2024 Kaikki ajatuksesi eivät ole totta. Sinä et ole yhtä kuin ajatuksesi. Siinä se kaikessa lyhykäisyydessään. Mutta miksi nämä näkökulmat kannattaisi sisäistää? Kun tunne ottaa vallan, ajattelu ja viestintä kompastelevat 8.3.2024 Kun meissä ottaa vallan joku äänekkäämpi tunne, keskittymisemme kiinnittyy siihen. Omat tunteemme ja tarpeemme vaativat huomiomme. Emme enää pysty asettumaan toisen ihmisen asemaan. Näissä hetkissä viestintä alkaa yleensä kompastella. Kuinka perfektionismista pääsee eroon 12.12.2023 Perfektionismi saattaa uuvuttaa, jähmettää, estää oppimista ja kehittymistä, vaikeuttaa tarkoituksenmukaista etenemistä ja ylipäätään aiheuttaa vitkuttelua, ahdistusta ja stressiä. Mutta miten siitä pääsee eroon? Perfektionismista on enemmän haittaa kuin hyötyä 11.9.2023 Moni mieltää perfektionismin salaa hyväksi asiaksi. Tässä mielikuvassa on kuitenkin virhe. Perfektionistia ei nimittäin aja eteenpäin terve halu olla hyvä ammattilainen ja tehdä huippulaadukasta työtä. Sen sijaan perfektionismin ytimessä on jatkuvasti jäytävä pelko riittämättömyydestä. On vaarallista tavoitella virheettömyyttä 18.1.2023 Jos joku ei tee koskaan virheitä, se voi toki teoriassa tarkoittaa, että kyseessä on ylijumalaa muistuttava ylivertainen olento. Sitäkin todennäköisempää on kuitenkin se, että kyseessä on ihminen, joka pelaa varman päälle ja hioo työtään loputtomasti. Parempaa palautetta saa pyytämällä 9.11.2022 Pyydä tarkkaa ja täsmällistä palautetta asiasta, jonka olet itse valinnut kehityskohteeksesi. Silloin toisen on helpompi antaa hyödyllistä ja konkreettista palautetta, ja sinun on helpompi ottaa se vastaan ja käyttää sitä itsesi kehittämiseen."
