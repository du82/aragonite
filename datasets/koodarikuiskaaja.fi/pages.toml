["https://koodarikuiskaaja.fi/blogi/mita-tehda-tilanteessa-jossa"]
title = "“Mitä tehdä tilanteessa, jossa…” - Koodarikuiskaaja"
description = "Puhujat ja kouluttajat saavat yleisöltä usein erittäin hyviä, joskin todella yleisluontoisia kysymyksiä. Miksi niihin vastaaminen on niin vaikeaa?"
full_description = "Puhujat ja kouluttajat saavat yleisöltä usein erittäin hyviä, joskin todella yleisluontoisia kysymyksiä. Itse olen saanut koulutusten päätteeksi esimerkiksi tällaisia: “Mitä tehdä, jos tiimikaveri on tosi hankala?”“Miten antaa palautetta pomolle, jolla on vahva temperamentti?”“Mitä koulutuksia pitäisi käydä, että oppisi keskustelemaan?”“Miten auttaa kollegaa, jolla on huijarisyndrooma?”“Mitä kun kysyn avoimen kysymyksen ja saan silti lyhyen vastauksen?” Erinomaisia kysymyksiä. Ja melkein mahdottomia vastata niin, että kysyjä olisi tyytyväinen. Minulla kesti hyvin kauan oivaltaa, miksi vastaaminen tuntui usein niin haparoivalta ja miksi kysyjän ilme ei aina näyttänyt erityisen tyytyväiseltä. Sitten näin tämän Esther Perelin reelsin ja lamppu syttyi: View this post on Instagram A post shared by Esther Perel (@estherperelofficial) Haaste ilman kontekstia on vaikea ratkaista Jokaisen yllä olevan kysymyksen takana on tarina, joka sisältää ihan valtavasti kontekstia. Mikä tilanne on? Millainen suhde on? Millainen vastapuoli on (kokonaisuutena)? Mitä on jo kokeiltu? Millaisia rakenteellisia mahdollisuuksia, prosesseja tai työkaluja on työnantajan puolelta käytössä? Mitä tarkoittaa hankala, temperamentti tai “oppia keskustelemaan”? Millaisessa tilanteessa keskustelua käydään? Mitä pitäisi saada aikaan, mikä on tavoite? Konteksti vaikuttaa ihan kaikkeen. Banaali esimerkki on vaikkapa “otan osaa”. Hautajaisissa fraasi kuuluu asiaan, häissä se on joko täysin sopimaton kommentti tai – jos nyt ei hyvä, niin – kohtuullinen vitsi. Konteksti vaikuttaa sanavalintoihin, sävyihin, työkaluihin ja taktiikoihin, valittujen strategioiden järeyteen ja lähestymistavan valintaan. Jopa täysin varmoilta tuntuvat strategiat, kuten vaikka empaattinen kuunteleminen, eivät yksinkertaisesti aina toimi. Lisää haastetta tuo ihmisten erilaisuus Ihmisasiat ovat ikävän moniulotteisia ja toisin kuin ykkösten ja nollien kanssa, harmaan sävyjä löytyy valtavasti. Sama työkalu voi toimia toisen ihmisen kanssa täydellisesti ja toisen kanssa taas katastrofaalisen huonosti. Sama työkalu saman ihmisen kanssa voi toimia toisena päivänä erinomaisesti ja toisena päivänä kehnosti. Työkalu voi toimia hyvin tai huonosti jopa riippuen siitä, kuka työkalua käyttää. Annapa siinä sitten yksiselitteinen vastaus. Meidän on miltei mahdotonta tietää etukäteen, miten kukakin reagoi mihinkin. Sain nuorena asiakaspalvelijana kerran huudot asiakkaalta, kun toivotin hänelle mukavaa päivänjatkoa. Enpä olisi ennalta osannut arvata, että tällainen toivotus voisi mennä niin pahasti pieleen. Siksi tehoavan neuvon antaminen yleisluontoiseen kysymykseen on… haasteellista. Mutta mites ne helpot neuvot koulutuksissa? Koulutuksissa annan paljon yleisluontoisia neuvoja, kuten: Vältä mutta-sanan käyttöä, etenkin jos toinen on vihainen tai ei todennäköisesti halua kuulla viestiä.Korvaa miksi-kysymykset mitä/miten-kysymyksillä, etenkin asiakassuhteen alkuvaiheessa.Älä käytä universaalisanoja (aina, ei koskaan) palautetta antaessa. Eikö tämä ole vähän kyseenalaista, jos samaan aikaan tiedostan, että yleisluontoisten neuvojen antaminen on hyvin vaikeaa? On ja ei. Ajattelen, että viestinnän ja vuorovaikutuksen saralla, kuten monilla muillakin elämän osa-alueilla, on olemassa monissa tilanteissa päteviä perusperiaatteita. Ne eivät päde aina ja kaikkialla, mutta ne pätevät riittävän usein, jotta jos ei ole ihan varma, mitä kannattaisi kokeilla, niistä kannattaa aloittaa. Perusperiaatteet helpottavat liikkeelle pääsyä ja niiden kanssa pääsee suhteellisen pitkälle. Vasta kokemus kerryttää tietoa siitä, missä tilanteissa ja kenen kanssa nämä neuvot eivät toimi. Silloin päästään soveltamaan, etsimään muita vaihtoehtoja ja luomaan uusia lähestymistapoja. Se puolestaan onnistuu paremmin, kun tuntee tarinan ja ymmärtää kontekstin. TL;DR Yleisluontoiseen kysymykseen on vaikea vastata, jos konteksti ei ole tiedossa Konteksti vaikuttaa kaikkeen.Mikään tekniikka ei toimi aina.Monissa tilanteissa päteviä perusperiaatteita on olemassa.Kokemus kertoo, missä tilanteissa ja kenen kanssa ne eivät toimi.Kontekstin ymmärtäminen auttaa, kun pitää soveltaa, etsiä vaihtoehtoja ja luoda uusia lähestymistapoja. Syvenny aiheeseen: Kentältä ja konepellin alta"
author = "Elisa Heikura"
year_published = 2023
year_updated = 2024
