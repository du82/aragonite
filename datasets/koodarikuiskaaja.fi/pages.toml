title = "Kentältä ja konepellin alta - Page 2 of 3 - Koodarikuiskaaja"
description = """
Tämä aihepiiri on vähän niin kuin se laatikko, jossa on kaikenlaista hyödyllistä tai arvokasta, jolle ei oikein mitään muutakaan paikkaa ole. Laatikosta saattaa joskus löytää sen, mitä lähti etsimään. Todennäköisemmin löytää jotain muuta hyödyllistä, jota ei etsinyt, koska ei sillä hetkellä tajunnut vielä tarvitsevansa. Tai sitten eksyy puoleksi tunniksi lukemaan vanhoja kirjeitä.
Tähän sekatavaralaatikkoon kertyy ainakin:

oivalluksia tapahtumista ja tapaamisista
poimintoja kirjoista ja keskusteluista
