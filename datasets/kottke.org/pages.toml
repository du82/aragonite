["http://www.kottke.org/25/02/how-elon-musk-executed-his-takeover-of-the-federal-bureaucracy"]
title = "How Elon Musk Executed His Takeover of the Federal Bureaucracy"
description = "This is excellent reporting by the Times (although at times it makes Musk’s actions sound heroic rather than unconstitutional, criminal, and treasonous) on how Elon Musk took over a huge chunk of the US government, which he still controls today. It"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! This is excellent reporting by the Times (although at times it makes Musk’s actions sound heroic rather than unconstitutional, criminal, and treasonous) on how Elon Musk took over a huge chunk of the US government, which he still controls today. It began at a Republican fundraiser in September of 2023: Mr. Musk made clear that he saw the gutting of that bureaucracy as primarily a technology challenge. He told the party of around 20 that when he overhauled Twitter, the social media company that he bought in 2022 and later renamed X, the key was gaining access to the company’s servers. Wouldn’t it be great, Mr. Musk offered, if he could have access to the computers of the federal government? Seasoned conservative operatives like Stephen Miller and Russell Vought helped educate Mr. Musk about the workings of the bureaucracy. Soon, he stumbled on an opening. It was a little-known unit with reach across the government: the U.S. Digital Service, which President Barack Obama created in 2014 after the botched rollout of healthcare.gov. Mr. Musk and his advisers � including Steve Davis, a cost cutter who worked with him at X and other companies � did not want to create a commission, as past budget hawks had done. They wanted direct, insider access to government systems. They realized they could use the digital office, whose staff had been focused on helping agencies fix technology problems, to quickly penetrate the federal government � and then decipher how to break it apart. They began their move on the digital service unit earlier than has previously been reported, The Times found, while President Joseph R. Biden Jr. was still in office � giving them the ability to operate on Mr. Trump’s first day. The team is now moving faster than many of the legal efforts to stop it, making drastic changes that could be hard to unwind even if they are ultimately constrained by the courts. Mr. Musk’s associates have pushed out workers, ignored civil service protections, torn up contracts and effectively shuttered an entire agency established by Congress: the U.S. Agency for International Development."
