full_description = '''When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! The War on Cars debuts an ad that extolls the freedom of cycling. “Who’s really more free? People beholden to traffic, gas prices, and the high cost of owning and maintaining a car or those who are able to choose another way?” I find it ironic that this video precedes the post about Jason's car troubles, and all the commenters sharing similar stories. One of the (many) joys of biking is zipping along a bike lane past a long row of cars stuck in traffic. I liked that. Because I ride my bike everyday. But it also felt a bit half-baked. Could they have thrown me a bone and had lady liberty wear a helmet? Hello! In order to comment or fave, you need to be a current kottke.org member. If you'd like to sign up for a membership to support the site and join the conversation, you can explore your options here. Note: If you are a member and tried to log in, it didn't work, and now you're stuck in a neverending login loop of death, try disabling any ad blockers or extensions that you have installed on your browser...sometimes they can interfere with the Memberful links. Still having trouble? Email me! In order to comment or fave, you need to be a current kottke.org member. Check out your options for renewal. This is the name that'll be displayed next to comments you make on kottke.org; your email will not be displayed publicly. I'd encourage you to use your real name (or at least your first name and last initial) but you can also pick something that you go by when you participate in communities online. Choose something durable and reasonably unique (not "Me" or "anon"). Please don't change this often. No impersonation. Note: I'm letting folks change their display names because the membership service that kottke.org uses collects full names and I thought some people might not want their names displayed publicly here. If it gets abused, I might disa