full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! A broad range of Americans are organizing a 24-hour economic boycott on February 28th to protest the ongoing actions of the Trump administration and to send a message to corporate America. From The People’s Union USA website, here are the details: The idea is to show corporate America, using the thing they best understand (money), how much power Americans have when collectively organized. Organizers have billed this as an initial move (“if they don’t listen…we make the next blackout longer”) and have planned follow-up economic actions. In a 1953 speech called On the Future of the American Negro, W.E.B. Du Bois spoke about wealth inequality and his vision for measuring prosperity: Work is service, not gain. The object of work is life, not income. The reward of production is plenty, not private fortune. We should measure the prosperity of a nation not by the number of millionaires but by the absence of poverty, the prevalence of health, the efficiency of the public schools, and the number of people who can and do read worthwhile books. While listening to an episode of Scene on Radio’s excellent series on Capitalism, I learned about an economic measure called the labor share of national income. From The Guardian: This week, the Bureau of Labor Statistics released its latest estimate for the share labor receives of national income for the first quarter of 2024. The statistics shows the income workers receive compared with the productivity their labor generates. According to BLS, this income share has declined for non-farm workers from about two-thirds, 64.1% in the first quarter of 2001, to 55.8% in the first quarter of 2024. Roughly speaking, in the first quarter of 2024, workers received ~56% of the income generated by their labor and 44% went to capital (ownership & shareholders). Here’s a graph that shows the labor share of national income from 1947 to 2016 so you can get some idea of the decline that’s happened:"
