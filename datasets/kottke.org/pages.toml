a target (who is supposed to change behavior)

a demand ("""
full_description = '''When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! From Choose Democracy and Build the Resistance, Boycott Central is a fledgling resource about boycotts. I found this checklist of requirements for effective boycotts really interesting & useful: They go on to note that most of the recent boycotts, including the Feb 28th one, do not meet these criteria — but that we shouldn’t despair: “boycotts take some time to organize well”. As others have noted, the activism & organizing muscles of many Americans have atrophied in recent years, and it will take time to get ourselves into shape. Boycotts are like anything else…you need to practice in order to get better. Yes. I hope seasoned activists don't get all caught up in the (all too common on the Left) "you're not doing it right" trap. Because I'm afraid that we're going to need a hell of a lot more than a one-day boycott before things get better. People being confused and arguing over this simple boycott are nothing compared to what it will take to organize successful (read: massive) general strikes. Paired with learning to boycott and strike, we also need to learn mutual aid as a proactive and consistent practice within the resistance. Boycotting and striking lead to hardship—and that is something many of us aren't used to when we can have any inconvenience remedied with overnight delivery. People will need help with rides, food, babysitters, mental health support, lodging, etc. The Montgomery Bus Boycott lasted 381 days, but only because of mutual aid, the Montgomery Improvement Association's guidance to continue evolving strategies, especially involving alternative transport, and grassroots community organizations, such as the Club from Nowhere, led by Georgia Gilmore, which used food both to feed families who had no time to prepare meals due to longer commutes and to raise money for the boycott. Before the real work even begins, we could all offer to share a lasagna—"I made too much!"—with an upstairs/next door neighbor, offer a ride to the store—"I'm going there anyway!"—or offer to babysit for a family that seems to be running on empty. These acts of community will build muscle memory—for you and for them.'''
