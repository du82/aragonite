["https://kottke.org/tag/podcasts"]
title = "kottke.org posts about podcasts (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! NPR’s Embedded podcast has a three-episode series from reporter Zach Mack about a year-long effort to convince his dad that all the conspiracy theories he (his dad) believes are bogus, in an attempt to save his family. Reporter Zach Mack thinks his dad has gone all in on conspiracy theories, while his father thinks that Zach is the one being brainwashed. In 2024, after the latest round of circular arguments, they decided to try something new, an attempt to pull each other out of the spell each of them thinks the other is under. You can listen to all three episodes at the NPR website for Embedded or wherever you get your podcasts. This abridged companion article covers the same ground as the podcast. When I asked my dad whether he feels like the odd man out, he answered somberly, “It’s painful at times. It’s very sad for me.” So what happens when your family and your friends don’t respect your beliefs? Perhaps you reach for a higher purpose — something existential. This came up in a conversation with Charlie Safford, a researcher who designs therapeutic techniques for people who believe in far-right conspiracy theories. He believes that conspiracy theories are fundamentally emotional coping mechanisms. “Even if your father doesn’t put the pieces together, there is some awakening of his own mortality that might be contributing to all of this,” he told me. “One of the ways that you come to terms is to look back and say, ‘Did my life have meaning?’” The appeal of QAnon & conspiracy theories is simple: they turn politics & public health (boring things that happen *to* you) into something active and engaging: your own personal Da Vinci Code hunt for a secret truth. I finished the last half of Shōgun, James Clavell’s 1200-page 1975 historical novel, on my recent vacation, riveted the entire time. I loved reading it and possibly enjoyed it more than Hulu’s TV series (which is saying something). The TV version hews pretty closely to the text but the major difference is in the amount of detail and explanation available to the book’s readers. There’s just so much more intrigue & plotting in the book and the reader is much more aware of what’s going on than in the show (the reader has access to the inner dialogue of multiple characters), but without sacrificing any of the suspense or drama. And the end of the book is devastating — I was completely gutted by it."
