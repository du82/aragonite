["https://kottke.org/tag/Covid-19"]
title = "kottke.org posts about Covid-19 (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! From David Wallace-Wells, a reminder that those who were considered alarmists at the beginning of the pandemic were ultimately proved right — it actually was an alarming situation. Today, the official Covid death toll in the United States stands at 1.22 million. Excess mortality counts, which compare the total number of all-cause deaths to a projection of what they would have been without the pandemic, run a little higher — about 1.5 million. In other words, the alarmists were closer to the truth than anyone else. That includes Anthony Fauci, who in March 2020 predicted 100,000 to 200,000 American deaths and was called hysterical for it. The same was true of the British scientist Neil Ferguson, whose Imperial College model suggested that the disease might ultimately infect more than 80 percent of Americans and kill 2.2 million of us. Thankfully, the country was vaccinated en masse long before 80 percent were infected… I’m also going to point out that those who were labeled alarmists about the impact of Donald Trump’s presidencies were also “closer to the truth than anyone else”, certainly closer than all those centrist “pundits”. I’m particularly thinking of those who knew when they woke up on November 9th to a Trump victory that Roe v Wade was toast and that Americans’ civil rights would be taken away and were called “hysterical” (there’s that word again) for saying so. Hey, everyone. I just wanted to update you on what’s been happening here at KDO HQ. As you might have noticed (and if my inbox is any indication, you have), I have pivoted to posting almost exclusively about the coup happening in the United States right now. My focus will be on this crisis for the foreseeable future. I don’t yet know to what extent other things will make it back into the mix. I still very much believe that we need art and beauty and laughter and distraction and all of that, but I also believe very strongly that this situation is too important and potentially dangerous to ignore. And it is largely being ignored by a mainstream press that has been softened up by years of conservative pushback, financial pressures, and hollowing out by Facebook & Google. But I have an independent website and a platform, and I’m going to use it the way that I have always used it: to inform people about the truth of the world (as best as I understand it) and what I feel is important."
