title = "kottke.org posts about QAnon (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Sean Donnelly’s mother got sucked into the world of QAnon conspiracy theories, so he made a little video about it, including documenting some bets he made with her about whether or not Biden would still be in office 3 months after the inauguration or if Tom Hanks & Oprah would soon be arrested for pedophilia. Remember when Baby Boomers were all concerned that the internet was going to be harmful for their Gen X and Millennial children and grandchildren? And now all these Boomers are getting brainwashed by Facebook and Fox News? Good stuff. :| See also QAnon, Conspiracy Theories, and the Rise of Magical Thinking, What Can You Do About QAnon?, Sacha Baron Cohen Says Tech Companies Built the “Greatest Propaganda Machine in History”, Living in a Conspiracy Nation, In Search of a Flat Earth, and My Dad, the Facebook Addict. (via waxy) Over the past several months, documentary filmmaker Kirby Ferguson has been making a series of videos about conspiracy theories, including This is Not a Conspiracy Theory, Trump, QAnon and The Return of Magic (which I posted about here), and Constantly Wrong: The Case Against Conspiracy Theories, as well as this analysis of the tactics of infowar. Just before the election, he made a video for the NY Times (embedded above): What Can You Do About QAnon? In particular, Ferguson singles out humiliation by ridicule as something to avoid when attempting to bring QAnon supporters back to reality. Instead, he suggests staying in contact, sharing relevant information, asking questions, and being patient. But as Open Culture points out: “After the violence of January 6, however, it’s reasonable to ask whether we need something more than coddling and patience.” (via open culture) Over the summer, members of the QAnon cult started to take over the “Save the Children” movement on Instagram & Facebook, eventually luring lifestyle influencers into spreading the cult’s message. From the NY Times:"
