title = "kottke.org - home of fine hypertext products"
description = "The Trump administration is restoring jobs for dozens of fired National Park Service employees and hiring nearly 3,000 additional seasonal workers, following an uproar over an aggressive plan to downsize the agency."
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! The Guardian profiled a number of people fired from the agencies that manage federal lands - the US Forest Service, Bureau of Land Management, etc. — purged from their jobs by the Trump/Musk administration. Victoria Winch, US Forest Service wilderness forestry technician, Flathead national forest, Spotted Bear ranger district, adjacent to Glacier national park, Montana: People come on to these lands to hunt, to feed their families. People are allowed to get firewood. Outfitters, who are a big part of the local economy, use these trails. But every single field person at Spotted Bear was terminated. Those trails won’t get cleared this year. And it takes less than one season for them to be totally impassable. We were very, very busy with public interaction, conversations, giving directions, educating. I would come up on folks quite often who were either lost or having some sort of emergency, and I’m also a member of two mountain rescue teams in the area. I really loved seeing so many different people from different walks of life. Being able to be a part of that wilderness experience that people are having was really, truly magical. Other fired federal land and National Park employees have been sharing their stories with media and on social media, highlighting how little these purges are about saving money and much more about all the services and benefits that Americans will be losing that we paid for. (Their stories also highlight the lies about employees not being fit for their jobs being used as the pretext to fire them. And the lack of due process. And, and, and…) Here are a few of those stories. Today I lost my dream job as a permanent park ranger in the NPS. I’m still in shock, and completely devastated. I have dedicated my life to being a public servant, teacher, and advocate for places that we ALL cherish. I have saved lives and put my own life at risk to serve my community."
