["https://kottke.org/tag/Mark%20Zuckerberg"]
title = "kottke.org posts about Mark Zuckerberg (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Facebook, Instagram, and Threads are ditching third-party fact-checkers in favor of a Community Notes program inspired by X, according to an announcement penned by Meta’s new Trump-friendly policy chief Joel Kaplan. Meta is also moving its trust and safety teams from California to Texas. It’s time to get back to our roots around free expression and giving people voice on our platforms. Here’s what we’re going to do: 2/ Simplify our content policies and remove restrictions on topics like immigration and gender that are out of touch with mainstream discourse. 3/ Change how we enforce our policies to remove the vast majority of censorship mistakes by focusing our filters on tackling illegal and high-severity violations and requiring higher confidence for our filters to take action. 4/ Bring back civic content. We’re getting feedback that people want to see this content again, so we’ll phase it back into Facebook, Instagram and Threads while working to keep the communities friendly and positive. 5/ Move our trust and safety and content moderation teams out of California, and our US content review to Texas. This will help remove the concern that biased employees are overly censoring content. 6/ Work with President Trump to push back against foreign governments going after American companies to censor more. The US has the strongest constitutional protections for free expression in the world and the best way to defend against the trend of government overreach on censorship is with the support of the US government. It’ll take time to get this all right and these are complex systems so they’ll never be perfect. But this is an important step forward and I’m looking forward to this next chapter! I wildly underestimated how quickly the big media and social media companies were going to kowtow to the incoming president. From The NY Times: Meta’s move is likely to please the administration of President-elect Donald J. Trump and its conservative allies, many of whom have disliked Meta’s practice of adding disclaimers or warnings to questionable or false posts. Mr. Trump has long railed against Mr. Zuckerberg, claiming the fact-checking feature treated posts by conservative users unfairly."
