["https://kottke.org/tag/Charlotte%20Alter"]
title = "kottke.org posts about Charlotte Alter (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! We are in a spectacularly unprecedented moment in our nation’s history. If you do not believe that is the case, perhaps these two recent news reports in completely sober (and even socially conservative) publications will persuade you. Charlotte Alter reports from my home state of Wisconsin for Time magazine: In more than seven dozen interviews conducted in Wisconsin in early September, from the suburbs around Milwaukee to the scarred streets of Kenosha in the aftermath of the Jacob Blake shooting, about 1 in 5 voters volunteered ideas that veered into the realm of conspiracy theory, ranging from QAnon to the notion that COVID-19 is a hoax. Two women in Ozaukee County calmly informed me that an evil cabal operates tunnels under the U.S. in order to rape and torture children and drink their blood. A Joe Biden supporter near a Kenosha church told me votes don’t matter, because “the elites” will decide the outcome of the election anyway. A woman on a Kenosha street corner explained that Democrats were planning to bring in U.N. troops before the election to prevent a Trump win. This matters not just because of what these voters believe but also because of what they don’t. The facts that should anchor a sense of shared reality are meaningless to them; the news developments that might ordinarily inform their vote fall on deaf ears. They will not be swayed by data on coronavirus deaths, they won’t be persuaded by job losses or stock market gains, and they won’t care if Trump called America’s fallen soldiers “losers” or “suckers,” as the Atlantic reported, because they won’t believe it. They are impervious to messaging, advertising or data. They aren’t just infected with conspiracy; they appear to be inoculated against reality. Democracy relies on an informed and engaged public responding in rational ways to the real-life facts and challenges before us. But a growing number of Americans are untethered from that. “They’re not on the same epistemological grounding, they’re not living in the same worlds,” says Whitney Phillips, a professor at Syracuse who studies online disinformation. “You cannot have a functioning democracy when people are not at the very least occupying the same solar system.”"
