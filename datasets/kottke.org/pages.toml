["http://www.kottke.org/tag/business"]
title = "kottke.org posts about business (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! A broad range of Americans are organizing a 24-hour economic boycott on February 28th to protest the ongoing actions of the Trump administration and to send a message to corporate America. From The People’s Union USA website, here are the details: The idea is to show corporate America, using the thing they best understand (money), how much power Americans have when collectively organized. Organizers have billed this as an initial move (“if they don’t listen…we make the next blackout longer”) and have planned follow-up economic actions. Historian Timothy Ryback, the author of Takeover: Hitler’s Final Rise to Power who also wrote the popular article How Hitler Dismantled a Democracy in 53 Days, has a new piece in The Atlantic about Adolf Hitler’s relationship with the rich German industrialists who helped him rise to power, many of whom subsequently “ended up in concentration camps”. He was among the richest men in the world. He made his first fortune in heavy industry. He made his second as a media mogul. And in January 1933, in exchange for a political favor, Alfred Hugenberg provided the electoral capital that made possible Adolf Hitler’s appointment as chancellor. Before Hugenberg sealed his pact with Hitler, a close associate had warned Hugenberg that this was a deal he would come to regret: “One night you will find yourself running through the ministry gardens in your underwear trying to escape arrest.” And from later in the piece, he describes how German businessmen participated in enslavement and murder: For the industrialists who helped finance and supply the Hitler government, an unexpected return on their investment was slave labor. By the early 1940s, the electronics giant Siemens AG was employing more than 80,000 slave laborers. (An official Siemens history explains that although the head of the firm, Carl Friedrich von Siemens, was “a staunch advocate of democracy” who “detested the Nazi dictatorship,” he was also “responsible for ensuring the company’s well-being and continued existence.”)"
