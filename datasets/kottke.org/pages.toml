title = "kottke.org posts about journalism (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Karen Attiah wrote a short opinion piece about how the nationwide assault on diversity, equity and inclusion led by conservatives is actually aimed at resegregation and how being precise in our language about what’s happening is crucial. These facts, taken together, point to the removal of Black people from academic, corporate and government spaces: resegregation. People are vowing to push back with their wallets — to shop at Costco and boycott Target, for example. But I believe the fight starts with language. Journalists have a role and an obligation to be precise in naming what we are facing. Frankly, I wish the media would stop using “DEI” and “diversity hiring” altogether. Any official, including the president, who chooses to blame everything from plane crashes to wildfires on non-White, non-male people should be asked whether they believe that desegregation is to blame. Whether they believe resegregation is the answer. We need to bring back the language that describes what is actually happening. When I write about difficult or contentious topics where I want to take great care to not be misunderstood and to be as accurate as I can be, I always think about this piece by history professor Michael Todd Landis on the language we use to talk about the Civil War & slavery. Specifically, let us drop the word “Union” when describing the United States side of the conflagration, as in “Union troops” versus “Confederate troops.” Instead of “Union,” we should say “United States.” By employing “Union” instead of “United States,” we are indirectly supporting the Confederate view of secession wherein the nation of the United States collapsed, having been built on a “sandy foundation” (according to rebel Vice President Alexander Stephens). In reality, however, the United States never ceased to exist. The Constitution continued to operate normally; elections were held; Congress, the presidency, and the courts functioned; diplomacy was conducted; taxes were collected; crimes were punished; etc. Yes, there was a massive, murderous rebellion in at least a dozen states, but that did not mean that the United States disappeared."
year_published = 2011
