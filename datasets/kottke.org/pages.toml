full_description = '''When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Whoa, HBO has made a third installment of Eyes on the Prize, the landmark series on the American Civil Rights Movement. The trailer is above and you can watch the six-part series on HBO or Max right now. The first two series, which are amongst the best television ever aired, covered events from 1954–1965 (part one) and 1965–1985 (part two). Eyes on the Prize III covers significant events from 1977-2015, including: Featured participants include Angela Davis, Al Sharpton, congressman Kweisi Mfume, Kimberlé Crenshaw, Al Gore, Black Lives Matter co-founders Alicia Garza and Patrisse Cullors, and dozens of other activists, scholars, and politicians. Eyes on the Prize III is, as the title suggests, a formal sequel to Eyes on the Prize II, a six-hour exploration of the “aftermath” of the Civil Rights Movement that makes it very clear that the movement has never ended, just as its real concerns were never fully resolved. It’s an emotional, inspiring and righteously angry series of vignettes that looks backward, while very clearly intending to reflect upon and instigate conversations about our fraught current moment. The series isn’t perfect, but it’s utterly essential, sometimes feeling disheartening for the immediacy of that necessity. Hello! In order to comment or fave, you need to be a current kottke.org member. If you'd like to sign up for a membership to support the site and join the conversation, you can explore your options here. Note: If you are a member and tried to log in, it didn't work, and now you're stuck in a neverending login loop of death, try disabling any ad blockers or extensions that you have installed on your browser...sometimes they can interfere with the Memberful links. Still having trouble? Email me! In order to comment or fave, you need to be a current kottke.org member. Check out your options for renewal. This is the