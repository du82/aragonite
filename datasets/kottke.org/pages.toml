["http://www.kottke.org/tag/David%20Wallace-Wells"]
title = "kottke.org posts about David Wallace-Wells (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! From David Wallace-Wells, a reminder that those who were considered alarmists at the beginning of the pandemic were ultimately proved right — it actually was an alarming situation. Today, the official Covid death toll in the United States stands at 1.22 million. Excess mortality counts, which compare the total number of all-cause deaths to a projection of what they would have been without the pandemic, run a little higher — about 1.5 million. In other words, the alarmists were closer to the truth than anyone else. That includes Anthony Fauci, who in March 2020 predicted 100,000 to 200,000 American deaths and was called hysterical for it. The same was true of the British scientist Neil Ferguson, whose Imperial College model suggested that the disease might ultimately infect more than 80 percent of Americans and kill 2.2 million of us. Thankfully, the country was vaccinated en masse long before 80 percent were infected… I’m also going to point out that those who were labeled alarmists about the impact of Donald Trump’s presidencies were also “closer to the truth than anyone else”, certainly closer than all those centrist “pundits”. I’m particularly thinking of those who knew when they woke up on November 9th to a Trump victory that Roe v Wade was toast and that Americans’ civil rights would be taken away and were called “hysterical” (there’s that word again) for saying so. I’m just going to go ahead and say it right up front here: if you had certain expectations in May/June about how the pandemic was going to end in the US (or was even thinking it was over), you need to throw much of that mindset in the trash and start again because the Delta variant of SARS-CoV-2 has changed the game. I know this sucks to hear,1 but Delta is sufficiently different that we need to reset and stop assuming we can solely rely on the vaccines to stop Covid-19 from spreading. Ed Yong’s typically excellent piece on how delta has changed the pandemic’s endgame is helping me wrap my head around this."
