["https://kottke.org/tag/death"]
title = "kottke.org posts about death (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! 80 years ago today, the Nazi death camp at Auschwitz-Birkenau was liberated. An estimated 1.1 million people (Jews, Poles, Russian POWs, Roma) were murdered at Auschwitz-Birkenau between 1940 and 1945, and this date was subsequently chosen by the United Nations as International Holocaust Remembrance Day. The IRemember Wall is a unique and meaningful opportunity for you to participate in an online commemorative activity marking International Holocaust Remembrance Day. By joining our IRemember Wall, your name will be randomly matched to the name of a Holocaust victim from our Central Database of Shoah Victims’ Names, and will appear together on the Wall. You can also choose a specific name to remember and match with on the Wall from our Central Database of Shoah Victims’ Names, which contains over 4.8 million names of Holocaust victims. As he does every year, illustrator Christoph Niemann drew the person he matched with and shared the story of her life. This year I was paired with Astro Cofino. We have very little biographical information: she was born in 1930 in Athens, her parents were called Benoua and Mairy. The first thing that caught my eye when I saw Astro’s photo was a little brooch she’s wearing: it looks like a comet, and I can’t help but thinking that it was meant as a reference to her name? Astro is maybe 11 or 12 in the picture, she smiles, with a tiny hint of giddiness in her eyes. Here’s Astro’s information from Yad Vashem’s database — she was murdered by the Nazis at Auschwitz when she was 14. It’s been awhile since I’d checked in on one of my favorite YouTube channels, Great Art Explained. In the past year, curator James Payne has done videos on Duchamp, Manet, Magritte, and that one painting by Caspar David Friedrich (you know the one). But this one, on Vincent van Gogh’s final painting, particularly caught my attention:"
