["https://kottke.org/25/02/0046034-what-do-you-do-after"]
title = "What do you do after you accidentally kill a child? This is..."
description = "The worst Thursday of Ryan Nickerson’s life started like any other. But he's had to live with its consequences every day since."
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! What do you do after you accidentally kill a child? This is wonderfully written….but also very hard to read. A worthy read. Not one to take in before a work meeting, like I just did (must dry these eyes), but I'm better because of it. The forgiveness and grace on display in the piece are next level. Two and a half years ago I was hit by a car while biking home, and although I was pretty badly injured (lost my pinky, among other things), I always have said that I wouldn’t trade places with the driver. He had a pretty bad Monday, too. Where I live, privacy concerns prevented him from having any idea of my condition. He saw me lifted into the ambulance on a spinal board, leaving a pool of blood underneath where my head had been. For all he knew, I could be dead. I wasn’t at my best, but I did begin to recover quickly. A few days later, I was doing a photo shoot with local media covering my injuries, and advocacy for safer streets, when he happened to go past again. I’m so glad he did. He stopped, we hugged, I could see the relief in his eyes that I was okay. I bear him no ill will. I remember hearing an interview with a woman many years ago on NPR who started a support network for people who had accidentally killed or injured another person. Apparently it has grown and is now called the Hyacinth Fellowship. While I wish there was no need for such an organization, I am glad they exist. Hello! In order to comment or fave, you need to be a current kottke.org member. If you'd like to sign up for a membership to support the site and join the conversation, you can explore your options here. Note: If you are a member and tried to log in, it didn't work, and now you're stuck in a neverending login loop of death, try disabling any ad blockers or extensions that you have installed on your browser...sometimes they can interfere with the Memberful links. Still having trouble? Email me!"
