Ferguson zeros in on the divide"""
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Kirby Ferguson, creator of the Everything Is a Remix and This Is Not a Conspiracy Theory video series, has a new video out that attempts to explain the rise of QAnon, conspiracy theories, and magical thinking in America. Ferguson zeros in on the divide between two different ways people make sense of a complex, chaotic, and uncertain world: evidence seeking and magical thinking. All of us employ both of these techniques to help ease our anxiety about the world, but those who tend towards magical thinking arrive at explanations that are based primarily on instinct, emotion, feelings, and gut reaction while evidence seekers mostly rely on scientific and empirical reasoning. 1. Obsession with symbols and codes (e.g. pizza as a “deep state” code for child trafficking) 2. Dot connecting (e.g. linking 5G with Covid-19) 3. Behind every event is a plan concocted by a person (e.g. Soros and the “deep state” conspiracy) 4. Purity (e.g. the Satanic panic and heavy metal music) 5. Apocalypse is nigh (e.g. the “deep state” again) 6. Preoccupation with good and evil (e.g. liberals are not only wrong but evil) For me, the key quote about magical thinking is this one for late in the video: “These are not systems of knowledge, and they cannot build solutions. They can only criticize and second-guess.”"
