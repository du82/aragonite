title = "kottke.org posts about Nathan Zed (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Nathan Zed argues that a lack of effort and vulnerability has made art, media, design, music, and architecture boring — that everything has the “soulless, monotonous no-personality vibe”. But artists like Tyler, the Creator; Chappell Roan; Doechii; and Kendrick Lamar are making trying cool again. It has become uncool to just try. Like, just to put in some effort. Don’t do too much, okay, it’s embarrassing — just be nonchalant, be cool, be effortless. This has made everything boring! Everyone is too scared to try because that would be vulnerable. I feel like only now are we seeing a shift back to people putting in effort and being rewarded for it."
