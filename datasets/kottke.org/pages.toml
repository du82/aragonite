["https://kottke.org/tag/black%20holes"]
title = "kottke.org posts about black holes (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Kurzgesagt is back with another video about black holes; it has the innocuous-seeming title of The Easiest Way To Build a Black Hole. But the main topic of the video is the speculation that universes (like ours!) might exist within black holes. Black holes might create infinite universes while destroying time and space. Everything in existence could be black holes, all the way down. We might live inside a black hole that is inside a black hole, that is inside a black hole. But let’s start at the beginning and build a black hole out of air. The first part of the script is based on the empirical fact that, somewhat intriguingly, the observable universe seems to have the exact size and mass that would be required to make a black hole as big as the observable universe itself. The second, completely independent proposal we explore is the idea that our Universe could be born from the singularity of a black hole, and that in turn the universe that contains that black hole could be born from a black hole itself. If so, universes in later generations of this process could be better fitted to produce an abundance of black holes, in a sort of “natural selection” towards efficient black hole production. NASA used one of their supercomputers to model what it would look like if you flew into a supermassive black hole. (You can watch the simulation in a 360° view on YouTube. I bet it looks great on a VR rig like Apple Vision Pro.) The movies begin with the camera located nearly 400 million miles (640 million kilometers) away, with the black hole quickly filling the view. Along the way, the black hole’s disk, photon rings, and the night sky become increasingly distorted — and even form multiple images as their light traverses the increasingly warped space-time. In real time, the camera takes about 3 hours to fall to the event horizon, executing almost two complete 30-minute orbits along the way. But to anyone observing from afar, it would never quite get there. As space-time becomes ever more distorted closer to the horizon, the image of the camera would slow and then seem to freeze just shy of it. This is why astronomers originally referred to black holes as “frozen stars.”"
