title = "“The Covid Alarmists Were Closer to the Truth Than Anyone Else”"
description = """
From David Wallace-Wells, a reminder that those who were considered alarmists at the beginning of the pandemic were ultimately proved right — it actually was an alarming situation.

Today, the official Covid death toll in the United States stands at 1.22"""
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! From David Wallace-Wells, a reminder that those who were considered alarmists at the beginning of the pandemic were ultimately proved right — it actually was an alarming situation. Today, the official Covid death toll in the United States stands at 1.22 million. Excess mortality counts, which compare the total number of all-cause deaths to a projection of what they would have been without the pandemic, run a little higher — about 1.5 million. In other words, the alarmists were closer to the truth than anyone else. That includes Anthony Fauci, who in March 2020 predicted 100,000 to 200,000 American deaths and was called hysterical for it. The same was true of the British scientist Neil Ferguson, whose Imperial College model suggested that the disease might ultimately infect more than 80 percent of Americans and kill 2.2 million of us. Thankfully, the country was vaccinated en masse long before 80 percent were infected… I’m also going to point out that those who were labeled alarmists about the impact of Donald Trump’s presidencies were also “closer to the truth than anyone else”, certainly closer than all those centrist “pundits”. I’m particularly thinking of those who knew when they woke up on November 9th to a Trump victory that Roe v Wade was toast and that Americans’ civil rights would be taken away and were called “hysterical” (there’s that word again) for saying so. Hello! In order to comment or fave, you need to be a current kottke.org member. If you'd like to sign up for a membership to support the site and join the conversation, you can explore your options here. Note: If you are a member and tried to log in, it didn't work, and now you're stuck in a neverending login loop of death, try disabling any ad blockers or extensions that you have installed on your browser...sometimes they can interfere with the Memberful links. Still having trouble? Email me!"
