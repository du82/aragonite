["http://www.kottke.org/tag/Star%20Wars"]
title = "kottke.org posts about Star Wars (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! I don’t know about you, but I’m ready to watch an earnest show about an ultimately successful revolution against a fascist government. It will be interesting to see in this political climate whether Disney+ is the place to watch such a thing. Watching these expert restorers mend & refresh a pair of vintage Star Wars posters (neither of which features the logo we’re familiar with today and one of which is signed by the designer) is both fascinating and relaxing. It’s like the posters are having a spa day: bit of a soak, a gentle scrub, some light bodywork, and voila, you’re brand new. (via meanwhile) Laura Olin’s newsletter of “art, internet, and ideas” is a favorite of mine (subscribe here), and I appreciated her comments from this morning on why sci-fi and fantasy movies work for moments like these. I’ve never thought of myself as a person who’s particularly into sci fi or fantasy. But on the worst days — and yesterday was one — I find myself thinking of the essential lessons of art in that genre. Maybe because a lot of it is about people in dire situations making stark moral choices for a larger good — and for various reasons World War II parables aren’t really going to do it anymore, at least in America. We saw Rogue One in the theater soon after Trump’s first election and I took some strength from the image of (vague spoilers) Felicity and Diego on the beach, sacrificing themselves to give everything thereafter a chance. I’ve been thinking of the Battlestar Galactica reboot of the W. Bush years, with the fighter pilots touching a portrait of a comrade on a fallen planet on their way out to battle; of Stellan Skarsgard’s speech and “one way out” in Andor, which you must watch; of Katniss touching three fingers to her lips in a salute special to her community, and a crowd of people she can’t even see saluting back; of the fundamental text that is “Why must we go on?” / “Because there’s some good in this world, Mr. Frodo, and it’s worth fighting for.” Is all this cringe? Undoubtedly; but I think we’ve entered a time that requires deep earnestness. (I hope to come back to this paragraph in four years and feel I was being overly dramatic about how bad things might get but I suspect I will not.)"
