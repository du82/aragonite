["http://www.kottke.org/tag/burgers"]
title = "kottke.org posts about burgers (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Joining Carl’s Jr. and White Castle, Burger King is adding a tastes-like-beef veggie burger to their menu. This week, Burger King is introducing a version of its iconic Whopper sandwich filled with a vegetarian patty from the start-up Impossible Foods. The Impossible Whopper, as it will be known, is the biggest validation — and expansion opportunity — for a young industry that is looking to mimic and replace meat with plant-based alternatives. The roll-out will start in the chain’s St. Louis restaurants and then proceed nationwide if all goes well. Here’s a commercial in which hardcore BK fans can’t tell the Impossible Whopper from their beloved beef version: As an increasingly conflicted omnivore, I would be perfectly happy if all low- to mid-end burgers were replaced by veggie clones — I don’t care that the Quarter Pounder I eat once every three months is beef…I just want it to taste like a Quarter Pounder — and then high-end burgers (the ones where you can tell the difference and you eat only rarely) were made from humanely raised beef for which consumers pay an appropriate price that accurately reflects the true-cost accounting of their production. A meat burger that costs a dollar is just being paid for in other ways by someone or something else. From America’s Test Kitchen and Dan Souza, the editor-in-chief of Cook’s Illustrated, a YouTube series called What’s Eating Dan? In each episode, Souza picks a different food — pizza, rice, salmon — shares some of the science involved, and then shows us the best way to cook it. For starters, I’d suggest the first episode on burgers and a more recent one on mushrooms: Big news around these parts: the Shake Shack is coming out with their first cookbook next week. Shake Shack: Recipes & Stories details how the Shake Shack came about and spills the beans with recipes for almost all of the food, burgers, chicken sandwiches, and fries included. According to Eater, the recipes have been tweaked for the home cook:"
