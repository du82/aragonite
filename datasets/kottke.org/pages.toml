["https://kottke.org/tag/Twitter"]
title = "kottke.org posts about Twitter (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! In the MIT Technology Review, Mat Honan makes two points about changes in the world of social media with both Bluesky and Threads seeing massive growth in November accelerated by the election and people leaving Twitter. The era of everyone having a uniform social media experience is ending. And that’s good. The first is that tech and politics are just entirely enmeshed at this point. That’s due to the extreme extent to which tech has captured culture and the economy. Everything is a tech story now, including and especially politics. The second point is about what I see as a more long-term shift away from centralization. What’s more interesting to me than people fleeing a service because they don’t like its politics is the emergence of unique experiences and cultures across all three of these services, as well as other, smaller competitors. I loved Twitter early on when it felt like everyone was building their own communities, and then it stopped feeling like that, and then it got worse and worse. For the most part, it seems like my better friends from Twitter went to Threads, but I can’t really figure out the vibe over there, which is annoying because I’m too old to make new friends. I’m on Bluesky and like it very much. One of the more helpful features is letting individual users create their own Starter Packs, so if you want to, for example follow a community of Carly Rae Jepsen fans, you can do that really easily because I made a starter pack for you. The successful social media network is an aquarium. The influencers and posters are the denizens — jellyfish, filter feeders, sharks, octopuses, rays, squid, clownfish, and so on. The lurkers are the visitors, marveling at the shape and color of the aquarium’s denizens. Threads is also unbalanced as an ecosystem, skewed toward Brands, a particularly noxious infraclass of influencer that is nonetheless profitable for the network. But for Threads to be valuable to Brands — more valuable than, say, TikTok — there needs to be a strong base of lurkers. Most lurkers will tolerate Brands, but Brands themselves aren’t a draw. They’re just the gift shop at the aquarium."
year_published = 2013
year_updated = 2020
