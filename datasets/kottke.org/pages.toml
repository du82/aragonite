["http://www.kottke.org/tag/lists"]
title = "kottke.org posts about lists (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! From Choose Democracy and Build the Resistance, Boycott Central is a fledgling resource about boycotts. I found this checklist of requirements for effective boycotts really interesting & useful: They go on to note that most of the recent boycotts, including the Feb 28th one, do not meet these criteria — but that we shouldn’t despair: “boycotts take some time to organize well”. As others have noted, the activism & organizing muscles of many Americans have atrophied in recent years, and it will take time to get ourselves into shape. Boycotts are like anything else…you need to practice in order to get better. Kevin Kelly is the biggest traveller I know and he recently shared some of the advice he’s learned over his 50+ years on the road. Here are a few of my favorites: If you hire a driver, or use a taxi, offer to pay the driver to take you to visit their mother. They will ordinarily jump at the chance. Co-sign on the food tour. I’ve been doing this for the past few years and it’s such a good way to orient yourself in a new place. The most significant criteria to use when selecting travel companions is: do they complain or not, even when complaints are justified? No complaining! Complaints are for the debriefing afterwards when travel is over. Sketchy travel plans and travel to sketchy places are ok. Take a chance. If things fall apart, your vacation has just turned into an adventure. Perfection is for watches. Trips should be imperfect. There are no stories if nothing goes amiss. It is always colder at night than you think it should be, especially in the tropics. Pack a layer no matter what. I packed a warm layer for my recent trip to Mexico and was shocked that I didn’t need it for the whole 10 days I was there. The hard-to-accept truth is that it is far better to spend more time in a few places than a little time in a bunch of places. To book a train anywhere in the world outside your home country, your first stop should be The Man in Seat 61, a sprawling website which will conveniently help you book the train you want."
year_published = 2010
