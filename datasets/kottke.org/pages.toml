["https://kottke.org/tag/movies"]
title = "kottke.org posts about movies (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Hey look at this, a media diet post that’s not months and months since the last one! Phew, it’s a been a long-ass six weeks since the beginning of the year, hasn’t it? Here’s a list of what I’ve been reading, watching, listening to, and experiencing to help get me through the days. Nosferatu (2024). Not usually a fan of horror movies, but I liked this a lot. Great acting and cinematography. (A-) Shōgun by James Clavell. This took a bit to get fully into, but I was riveted for the last 600-800 pages, even though I knew what was going to happen from having seen the TV show. So much more delicious detail in the book though. A great reading experience. (A) September 5. Loved this. Solid journalism thriller in the vein of Spotlight, The Post, and All the President’s Men. (A) Silo (season two). In agreement with many other viewers that the middle of the season was not all that compelling, but the final two episodes were great. (B+) Not Like Us. For whatever reason, I ignored the Drake/Kendrick feud, so I got to this late but wow. “Hey, hey, hey, hey, run for your life…” (A) Arca Tulum. Eating at this sort of restaurant should yield exclamations like “I’ve never tasted anything quite like this”. I thought this at least three times at Arca. But also: a pile of rocks is not the ideal plate for messy food. (A-) Aldo’s. This is a Mexican gelato chain and they had a Biscoff-flavored gelato that was so good that I went back for it three more times. (A) Antojitos La Chiapaneca. This is the only restaurant I ate at twice in Tulum — their al pastor tacos are so good. (A) The Serviceberry by Robin Wall Kimmerer. A quick read but very relevant to what’s happening in the world right now. In keeping with the theme, I left the book at my hotel for someone else to read. (B+) Abruzzo. Mario Carbone created the menu for this Italian place at the Newark Airport. I had the penne vodka and I think it was the best thing I have ever eaten at an airport? Is it insane that I kinda want to plan a trip with an EWR connection so that I can have it again? P.S. the Tripadvisor reviewers haaaated this place. (A)"
