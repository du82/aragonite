full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Hello and happy Saturday from the US eastern seaboard! If you’re a regular reader of the site, please consider supporting my efforts so I can continue running one of the best independent blogs out there. You can choose from three levels of annually recurring support. For pennies a day, you can become one of kottke.org’s 1000 True Fans. Please, don’t make me have to start a rambling 2-hour podcast... I've got a voice built for text! Honestly if you’re even reading this, you’re probably a superfan of the site. If that’s the case, I would be beyond grateful for your contribution at this level. Cheers! The misfits. The troublemakers. You busted your ass & sold your company. Now invest in independent media w/ a bonkers contribution that’ll keep ’er running until an expanding Sun engulfs the Earth in billions of years. Are there other ways to contribute? If you're unable to use a credit card or would like to pay some other way, you can send a one-time payment via PayPal or Stripe. (You can also do a one-time payment via Memberful by signing up for a membership and then immediately cancelling it, i.e. turning off auto-renew) If you'd like to send along startup stock options, a personal check, magic beans, or fresh-baked cookies, email me and we’ll figure something out. Do you support Apple Pay? Sure do...it's built in to the Memberful checkout process. It takes less than 20 seconds to sign up for a membership using Apple Pay — it's so easy. Are there gift subscriptions? Yes, you can gift kottke.org memberships to friends and loved ones. Here are the links for the yearly memberships: $30/yr, $60/yr, $120/yr, or $600/yr. Once the gift giver has paid for the membership, the gift recipient will receive an email inviting them to sign up for free. The gift recipient will be responsible for adding a payment method before the next renewal period if they'd like keep the membership going past the initial year."
