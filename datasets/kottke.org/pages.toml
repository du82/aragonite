full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Meet Vincent LeVine. He’s the subject of “My Dad, the Facebook Addict”, a short documentary by his son Dylan. He started off using Facebook normally, keeping up with the news and chatting with friends, but evolved into a fierce meme warrior stocked with a “nuclear arsenal” of memes at the ready to destroy anyone who wants to come at him. I can have a meme war with anybody and destroy them. And I’ve done it! People actually bail at the end and go, “Who is this guy? He’s got like every meme ever produced on the internet! He can knock us out with his memes!” And I do, I have tons of memes, I just keep memeing them to death until they just surrender because they just can’t do it anymore. They don’t have the memes that I have. Vincent is very entertaining and it was difficult to not just quote all of his lines in the video. You can check out his Facebook account for yourself or watch his technique for hygienically blowing out birthday cake candles."
