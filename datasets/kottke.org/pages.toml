full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! For the past several months, I’ve been working on a new web app/site called Stellar. Stellar helps you discover and keep track of your favorite things online. If you like playing around on Twitter or Flickr, you’ll probably enjoy Stellar. There are a few dozen people using Stellar right now and some of them seem pretty enthusiastic about it, so I’m encouraged to open the site up a bit more. As of just this minute, you’ll be able to do a few things with Stellar: 1. View people’s fave pages. For example here are my faves, Meg Hourihan’s faves, Dennis Crowley’s faves, Matt Haughey’s faves, Ainsley Drew’s faves, Heather Armstrong’s faves, Anil Dash’s faves, etc. You can find others by browsing around the site a bit. You can also look at the “best of” pages, a person’s items faved by others…here are my items faved by others. 2. Sign up to reserve your preferred username and request an invite to the beta. FYI: I’m letting people in reeeeally sloooowly so even if you sign up right away it might be awhile before you get in. And that’s about it for now. You’ll be hearing more about Stellar in the next few days/week/months here on kottke.org, but you can also follow the Stellar Twitter account for updates. Thanks."
