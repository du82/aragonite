title = "kottke.org posts about 2020 election (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! I posted this as a Quick Link earlier today but decided it needed its own post. Stacey Abrams & Lauren Groh-Wargo of Fair Fight have written an opinion piece in the NY Times about how they increased Democratic votes in Georgia over the past decade, leading to flipping both Senate seats in the 2020 election. They are sharing their approach and framework so that others can apply it in their states. Georgians deserved better, so we devised and began executing a 10-year plan to transform Georgia into a battleground state. As the world knows, President Biden won Georgia’s 16 electoral votes in November, and the January runoff elections for two Senate seats secured full congressional control for the Democratic Party. Yet the result wasn’t a miracle or truly a surprise, at least not to us. Years of planning, testing, innovating, sustained investment and organizing yielded the record-breaking results we knew they could and should. The lessons we learned can help other states looking to chart a more competitive future for Democrats and progressives, particularly those in the Sun Belt, where demographic change will precede electoral opportunity. We realize that many people are thinking about Stacey’s political future, but right now we intend to talk about the unglamorous, tedious, sometimes technical, often contentious work that creates a battleground state. When fully embraced, this work delivers wins — whether or not Donald Trump is on the ballot — as the growth Georgia Democrats have seen in cycle after cycle shows. Even in tough election years, we have witnessed the power of civic engagement on policy issues and increases in Democratic performance. This combination of improvements has also resulted in steady gains in local races and state legislative races, along with the continued narrowing of the statewide loss margin in election after election that finally flipped the state in 2020 and 2021."
