title = "kottke.org posts about Old Custer (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! We all know that the microwave oven was invented by Raytheon’s Percy Spencer in 1945. What this video presupposes is, maybe it was invented to thaw out frozen hamsters? And somehow James Lovelock, who formulated the Gaia hypothesis, is involved? (via @fourfoldway) We all know that Slinkys walk down stairs, alone or in pairs. What this video presupposes is, maybe that’s not the best way to play with them? Who knew that you could treat a Slinky kind of like a yo-yo or juggling ball? Here’s a slightly shorter video of equally impressive tricks. Founding Fathers is a full-length documentary film about the history of hip hop narrated by Public Enemy’s Chuck D. Everyone knows that hip hop originated in the Bronx. What this film presupposes is, maybe it didn’t? Maybe hip hop started even earlier than commonly thought in places like Brooklyn with DJs like Grandmaster Flowers. I don’t know if this film ever found release anywhere…it’s not even on IMDB or Wikipedia. (via @sampotts) Everyone knows that the square of the hypotenuse of a right triangle is equal to the sum of the squares of the other two sides. What this video presupposes is, fuck yeah math! Everyone knows that The Karate Kid is the story of Daniel LaRusso, an undersized new-kid-in-school who, with the help of a wise mentor and unconventional training in the martial arts, is able to triumph over a gang of bullies picking on him. What this video presupposes is, maybe Daniel is the real bully? To no one’s surprise, Johnny advances to the final round and karma catches up with Daniel when his leg is injured by the boy he wantonly attacked on the soccer field. However, just as Johnny is about to be awarded his trophy, Daniel is granted unnatural strength by the demon sorcerer Miyagi, enabling him to defeat Johnny and win the tournament in an upset. See also more revisionist history of beloved media: Hermione Granger as the real hero of the Harry Potter books and Tim Carmody’s The Iceman List, which is about “classic movie antagonists who were actually pretty much right all along”."
