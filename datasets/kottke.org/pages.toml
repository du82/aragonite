["http://www.kottke.org/tag/Eyes%20on%20the%20Prize"]
title = "kottke.org posts about Eyes on the Prize (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Whoa, HBO has made a third installment of Eyes on the Prize, the landmark series on the American Civil Rights Movement. The trailer is above and you can watch the six-part series on HBO or Max right now. The first two series, which are amongst the best television ever aired, covered events from 1954–1965 (part one) and 1965–1985 (part two). Eyes on the Prize III covers significant events from 1977-2015, including: Featured participants include Angela Davis, Al Sharpton, congressman Kweisi Mfume, Kimberlé Crenshaw, Al Gore, Black Lives Matter co-founders Alicia Garza and Patrisse Cullors, and dozens of other activists, scholars, and politicians. Eyes on the Prize III is, as the title suggests, a formal sequel to Eyes on the Prize II, a six-hour exploration of the “aftermath” of the Civil Rights Movement that makes it very clear that the movement has never ended, just as its real concerns were never fully resolved. It’s an emotional, inspiring and righteously angry series of vignettes that looks backward, while very clearly intending to reflect upon and instigate conversations about our fraught current moment. The series isn’t perfect, but it’s utterly essential, sometimes feeling disheartening for the immediacy of that necessity. The fantastic civil rights documentary Eyes on the Prize will soon be available for viewing on public media and online. WORLD Channel and PBS will begin airing the 14-part series in early April. The first part of the series, covering the civil rights movement from 1954-1965, will also be available to watch online starting in mid-April. Check out the press release for more info. Eyes on the Prize, created by Executive Producer Henry Hampton, is an award-winning and critically-acclaimed in-depth documentary series on civil rights in America. Hampton set out to share his vision of what he called “the remarkable human drama that was the Civil Rights Movement” through the experiences and challenges of those fighting for justice. Produced by Blackside Inc, Eyes on the Prize tells the definitive story of the civil rights era from the point of view of the ordinary men and women whose extraordinary actions launched a movement that changed the fabric of American life and embodied a struggle whose reverberations continue to be felt today."
