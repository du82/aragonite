It stands to reason: the more y"""
full_description = '''When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! David Lynch is not having any of that “you need to struggle or be tortured in order to be creative” stuff. In this video compilation, the director talks about how poor mental health inhibits art & creativity. It stands to reason: the more you suffer, the less you want to create. If you’re truly depressed, they say you can’t even get out of bed, let alone create. It occupies the whole brain, poisons the artist, poisons the environment; little room for creativity. Open Culture has more on how Lynch uses transcendental meditation to improve his mental health…and a great anecdote about the one time Lynch tried therapy: In one Charlie Rose interview, a clip from which appears in the video, he even tells of the time he went to therapy. The beginning of this story makes it in, but not the end: Lynch asked his new therapist “straight out, right up front, ‘Could this process that we’re going to go through affect creativity?’ And he said, ‘David, I have to be honest with you, it could” — whereupon Lynch shook the man’s hand and walked right back out the door. Hello! In order to comment or fave, you need to be a current kottke.org member. If you'd like to sign up for a membership to support the site and join the conversation, you can explore your options here. Note: If you are a member and tried to log in, it didn't work, and now you're stuck in a neverending login loop of death, try disabling any ad blockers or extensions that you have installed on your browser...sometimes they can interfere with the Memberful links. Still having trouble? Email me! In order to comment or fave, you need to be a current kottke.org member. Check out your options for renewal. This is the name that'll be displayed next to comments you make on kottke.org; your email will not be displayed publicly. I'd encourage you to use your real name (or at least your first name and