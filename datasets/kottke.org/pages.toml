["http://www.kottke.org/tag/film%20school"]
title = "kottke.org posts about film school (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! For the final video in their current series, Taylor Ramos & Tony Zhou of Every Frame a Painting tackle one of the fundamental questions in filmmaking: where do you put the camera? I was especially struck by Greta Gerwig’s comments about camera movement in two of her films: Well, I kind of had an image of Lady Bird that I wanted it to be almost like stained glass windows in churches, because it is Catholic school and all of that. I was thinking of everything as a presentation within a frame. But then when I got to Little Women, I had the opposite feeling. I felt like I wanted the camera to be alive and curious and a dancer. Like I almost wanted the camera to start young and then get older, like the girls did. I wanted to camera to start young and then get older, like the girls did — that’s pretty brilliant. The full interview with Gerwig is available here. So that’s all for now from Every Frame a Painting…hopefully they will be back soon with a new project because I truly love their perspective on how films are made. So first of all, before you watch this analysis of Chris Marker’s fantastic La Jetée, you should watch the film itself if you’ve never seen it. It’s 28 minutes long, entirely in black & white, and is a “speculative fiction masterpiece” done with “422 photos, a voiceover, and a score”. You can find it streaming at Amazon, Apple, Criterion Channel, or Kanopy. You will not regret it. And then come back and watch this analysis/appreciation by Evan Puschak. Billy Wilder (Sunset Boulevard, The Apartment, Some Like It Hot) was both a great director and a great writer. In this video essay, Taylor Ramos & Tony Zhou examine how Wilder balanced the verbal, dramatic, and situational ironies of his scripts with making it all work on the screen, emotionally and structurally. I just got back from the XOXO Festival and one of things that happened was that Taylor Ramos and Tony Zhou showed their new short film The Second and their first new Every Frame A Painting video essay in eight years!! And now the video essay is on YouTube:"
