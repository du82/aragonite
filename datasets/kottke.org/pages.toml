title = "Legendary actor Gene Hackman has died at the age of 95. Hack..."
description = "Authorities say Oscar-winning actor Gene Hackman, his wife and their dog were found dead in their New Mexico home. Foul play is not suspected, however authorities did not release any details of the circumstances of their deaths and say an investigation is ongoing."
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Legendary actor Gene Hackman has died at the age of 95. Hackman, his wife Betsy Arakawa, and their dog were found dead at their home yesterday. “Foul play was not suspected.” The fact that the dead dog was found in a closet and there were two other dogs still alive and on the property makes it especially confounding. The Royal Tenenbaums is one of my favorite films. Hackman played such a great charlatan in that film. I heard somewhere not long ago — maybe Jamelle Bouie's podcast — that Hackman never changed his hair, barely used makeup, and didn't rely on wardrobe (standard uniforms for military roles, ordinary clothes for most everything else), and yet he was distinct in every role. Has anyone ever acted better with the corner of their eyes? And he used his voice so well. He never seemed miscast but that just shows how he could make any kind of role his own. Just amazing. It’s at least a possibility that his wife killed herself after her husband died. If so, how tragically beautiful and sad. That she killed the family dog, even more so. If it is a death plus suicide, it reminds me of Johnny Cash and his wife (June?). Once she was gone, his will to live was gone and he was dead like a week later, if I'm remembering it correctly. Not a suicide but close. The dog thing seems inexplicable. Hopefully the wife wasn't nuts, killed them both then herself. We may never know. A lot of assumptions about Betsy Arakawa. Maybe she had a medical emergency. Maybe Hackman put the dog in the closet to keep it from bothering her while he went for help. Maybe the stress killed him on the way out the door. Hello! In order to comment or fave, you need to be a current kottke.org member. If you'd like to sign up for a membership to support the site and join the conversation, you can explore your options here. Note: If you are a member and tried to log in, it didn't work, and now you're stuck in a neverending login loop of death, try disabling any ad blockers or extensions that you have installed on your browser...sometimes they can interfere with the Memberful links. Still having trouble? Email me!"
