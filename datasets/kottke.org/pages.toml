title = "kottke.org posts about music (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Apple TV+ is streaming an 8-hour remix of the Severance theme by ODESZA that is perfect music for your innie to refine macrodata to. The workday-long video is a 23-minute mix that’s looped and set to footage from the show. Legit adding this to the work music rotation. (via @margarita.bsky.social) I can already tell this is going to be my favorite thing of the day: Doechii singing and rapping about anxiety over Gotye’s Somebody That I Used To Know from 2019. If you didn’t know she could sing, well you do now. If my math is right, Doechii was 21 in this video, living in NYC, vlogging about going to thrift stores (on her old YouTube channel that only has a little over 9,000 subscribers), and working hard on her music. I think it paid off? P.S. This video from 2015 of Doechii in high school singing Do You Want to Build a Snowman? with her friends is super sweet. Hey look at this, a media diet post that’s not months and months since the last one! Phew, it’s a been a long-ass six weeks since the beginning of the year, hasn’t it? Here’s a list of what I’ve been reading, watching, listening to, and experiencing to help get me through the days. Nosferatu (2024). Not usually a fan of horror movies, but I liked this a lot. Great acting and cinematography. (A-) Shōgun by James Clavell. This took a bit to get fully into, but I was riveted for the last 600-800 pages, even though I knew what was going to happen from having seen the TV show. So much more delicious detail in the book though. A great reading experience. (A) September 5. Loved this. Solid journalism thriller in the vein of Spotlight, The Post, and All the President’s Men. (A) Silo (season two). In agreement with many other viewers that the middle of the season was not all that compelling, but the final two episodes were great. (B+) Not Like Us. For whatever reason, I ignored the Drake/Kendrick feud, so I got to this late but wow. “Hey, hey, hey, hey, run for your life…” (A)"
