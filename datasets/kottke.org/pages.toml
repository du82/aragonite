["http://www.kottke.org/tag/potatoes"]
title = "kottke.org posts about potatoes (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! I don’t know exactly what this is, but it appears to be an ad for Lay’s potato chips made by Jimmy Kimmel Live? But whatever, it’s great: a Groundhog Day-inspired clip starring Ned Ryerson (Stephen Tobolowsky) himself that’s perfect for hawking a bajillion different flavors of potato chips. (via @ironicsans) If you were left hungry by the food in season two of The Bear, Binging With Babish has got you covered. In this video, he recreates the potato chip omelette that Sydney makes in the second-to-last episode of the season. And then, he makes an adjacent dish, José Andrés’s tortilla española with potato chips. Just to contrast, here’s Andrés making it: Double yum. See also How to Make Perfect Soft-Scrambled Eggs, Hey, Let’s Watch Jacques Pépin Fry Eggs (and make omelettes), and 59 Ways to Cook Your Eggs. John Green shares his technique for roasting potatoes while fighting “the creeping sense of dread” that many of us may be experiencing right now. All right, let’s make some potatoes. You want enough potatoes that they will sustain the sack of flesh that contains your soul for several hours. And ideally you want these little red potatoes, which you then cut into sixths — or eighths if they’re too big. Don’t overthink the size of your potato wedges but also don’t underthink it. This is the key not just for cooking but also for most things. I am a little embarrassed (and surprised!) at how up my alley this is, but behold: the winners of the Potato Photographer of the Year competition for 2021. (via @jackisnotabird) I went to the newish Barcade in Chelsea last night to get some dinner and play Star Wars (and Ms. Pac-Man and Tetris and Donkey Kong) and discovered their tater tots are shaped like Tetris pieces: ИOM ИOM ИOM. You can get these tots from a company called US Foods; they call them Puzzle Potatoes. Their sell sheet for the product is a wonder of corporate wishful thinking masquerading as marketing."
