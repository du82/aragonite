["http://www.kottke.org/tag/Brooke%20Harrington"]
title = "kottke.org posts about Brooke Harrington (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! The central point of Dr. Brooke Harrington’s essay about the destabilization of “basic systems we count on to make our society function” over the past month is bang on: This promises to be a tough way for Americans to learn a critical fact too often overlooked: that one of our country’s greatest and least-appreciated assets has been public faith and trust in a variety of highly complex systems staffed by experts whose names we’ll never know. In fact, high levels of trust used to be one of our superpowers in the United States: specifically, that meant trust in our government to operate with reasonable competence and stability and without the kind of corruption that has hobbled other societies. It stands to reason: the more you suffer, the less you want to create. If you’re truly depressed, they say you can’t even get out of bed, let alone create. It occupies the whole brain, poisons the artist, poisons the environment; little room for creativity. But his assertion can be easily extended to how instability in one’s life leads to an inability to live fully. Stability and lack of corruption allows people to live their lives, make art, engage in commerce with each other, build families, and strive to be their best, authentic selves. The US has never been completely stable or uncorrupt, but we’re at real risk of losing something incredibly valuable here…and it’ll be difficult to get it back when it’s too far gone."
