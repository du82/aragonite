description = "Over the past several months, documentary filmmaker Kirby Ferguson has been making a series of videos about conspiracy theories, including This is Not a Conspiracy Theory, Trump, QAnon and The Return of Magic (which I posted about here), and Constantly"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Over the past several months, documentary filmmaker Kirby Ferguson has been making a series of videos about conspiracy theories, including This is Not a Conspiracy Theory, Trump, QAnon and The Return of Magic (which I posted about here), and Constantly Wrong: The Case Against Conspiracy Theories, as well as this analysis of the tactics of infowar. Just before the election, he made a video for the NY Times (embedded above): What Can You Do About QAnon? In particular, Ferguson singles out humiliation by ridicule as something to avoid when attempting to bring QAnon supporters back to reality. Instead, he suggests staying in contact, sharing relevant information, asking questions, and being patient. But as Open Culture points out: “After the violence of January 6, however, it’s reasonable to ask whether we need something more than coddling and patience.” (via open culture)"
