["https://kottke.org/tag/racism"]
title = "kottke.org posts about racism (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Whoa, HBO has made a third installment of Eyes on the Prize, the landmark series on the American Civil Rights Movement. The trailer is above and you can watch the six-part series on HBO or Max right now. The first two series, which are amongst the best television ever aired, covered events from 1954–1965 (part one) and 1965–1985 (part two). Eyes on the Prize III covers significant events from 1977-2015, including: Featured participants include Angela Davis, Al Sharpton, congressman Kweisi Mfume, Kimberlé Crenshaw, Al Gore, Black Lives Matter co-founders Alicia Garza and Patrisse Cullors, and dozens of other activists, scholars, and politicians. Eyes on the Prize III is, as the title suggests, a formal sequel to Eyes on the Prize II, a six-hour exploration of the “aftermath” of the Civil Rights Movement that makes it very clear that the movement has never ended, just as its real concerns were never fully resolved. It’s an emotional, inspiring and righteously angry series of vignettes that looks backward, while very clearly intending to reflect upon and instigate conversations about our fraught current moment. The series isn’t perfect, but it’s utterly essential, sometimes feeling disheartening for the immediacy of that necessity. For the Atlantic, Adam Serwer writes about the Great Resegregation, the attempt by the Trump administration to reverse the civil rights movement. If the Great Resegregation proves successful, it will restore an America past where racial and ethnic minorities were the occasional token presence in an otherwise white-dominated landscape. It would repeal the gains of the civil-rights era in their entirety. What its advocates want is not a restoration of explicit Jim Crow segregation—that would shatter the illusion that their own achievements are based in a color-blind meritocracy. They want an arrangement that perpetuates racial inequality indefinitely while retaining some plausible deniability, a rigged system that maintains a mirage of equal opportunity while maintaining an unofficial racial hierarchy. Like elections in authoritarian countries where the autocrat is always reelected in a landslide, they want a system in which they never risk losing but can still pretend they won fairly."
