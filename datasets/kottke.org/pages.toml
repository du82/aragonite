["https://kottke.org/threads/guidelines"]
title = "Community Guidelines for Kottke.org"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! This is a list of things for you to keep in mind when participating in comment threads on kottke.org. I have lots of thoughts about the type of community I'd like to encourage here, but I'll try to keep this short (😬). This document is as much for me as it is for you; I'll be referring back to it as a guide for my own conduct often. First off: be kind, constructive, curious, and respectful when commenting, especially when disagreeing. Interpret the words of others as generously as possible. Listening to each other is the invisible work we can do to improve any online discussion space. Sometimes not saying anything is the right thing to add to a thread — and an opportunity to listen and reflect. That said, if you feel like you have something to share, go for it! There are three types of feedback I get often via email or social media that I love: 1) when someone sends me a link related to something I've shared (often with a short explanation/summary), 2) when a reader with expertise about something I've posted about shares their knowledge/perspective, or 3) when someone tells a personal story or shares an experience they had related to a post or link. When readers share this sort of constructive feedback, it improves the original post so much...that's what I want to happen with comments on kottke.org. The internet is full of places for people to go to express their opinions or argue about others' opinions, so I'd like to steer away from that here. If we can prioritize talking about facts, sharing stories, experiences, and expertise over opinions, it'll make for better, more informative threads. I'd also like folks participating in threads to think a little bit less about what you might want out of making a comment and a little bit more about how your comment might help improve the community's understanding of the topic at hand. Disagreement, even strenuous disagreement, is welcome. Just make sure you keep the other things on this list in mind when doing so. Civil and respectful disagreement is possible and we will practice it here."
year_published = 2025
