The astonishing turn of events could scramble international affairs in Europe and around the glo"""
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Trump just kicked Ukrainian President Volodymyr Zelenskyy out of the White House after berating him for being “disrespectful” in the Oval Office. The astonishing turn of events could scramble international affairs in Europe and around the globe. During his visit with Trump, Zelenskyy had planned to sign the deal allowing the U.S. greater access to Ukraine’s rare earth minerals, then hold a joint news conference. Instead, Ukraine’s leader left the White House shortly after Trump shouted at him, showing open disdain. Untouched salad plates and other lunch items were being packed up outside the Cabinet room, where the lunch between Trump and Zelenskyy and their delegations was supposed to have taken place. “You’re gambling with World War III, and what you’re doing is very disrespectful to the country, this country that’s backed you far more than a lot of people say they should have,” Trump told Zelenskky. My god, Trump and Vance are just total fucking assholes. The US is openly aligning themselves with Russia against Ukraine and Europe, a major shift in international relations that dates back to the 1940s. I am so embarrassed to be an American right now. Vance: And do you think that it’s respectful to come to the Oval Office of the United States of America and attack the administration that is trying to prevent the destruction of your country? Zelensky: First of all, during the war, everybody has problems, even you. But you have nice ocean and don’t feel now, but you will feel it in the future. Trump: Don’t tell us what we’re going to feel. We’re trying to solve a problem. Don’t tell us what we’re going to feel. Trump: Because you’re in no position to dictate that. Remember this: You’re in no position to dictate what we’re going to feel. We’re going to feel very good. Zelenskyy’s English is obviously not super strong but Trump sounds like a 