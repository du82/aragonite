["https://kottke.org/tag/Kirby%20Ferguson"]
title = "kottke.org posts about Kirby Ferguson (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Kirby Ferguson has released the final and “definitive” full-length version of his fantastic Everything is a Remix video series (transcript). Memes are remixing. You take a photo, you repurpose it, then someone else tries it, then there’s a flood of everyone trying out combinations, including remixing other memes. When you take something old and use it in something new, that’s remixing. It might just seem like just copying, but it’s actually something much more. Remixing can empower you be more creative. Remixing allows us to make music without playing instruments, to create software without coding, to create bigger and more complex ideas out of smaller and simpler ideas. You don’t need expensive tools to remix, you don’t need a distributor, you don’t even need skills or… good judgment. Everybody can remix and everybody does. From our songs and games and movies and memes, to how we train computers to create, to the way we sense of reality, to the evolution of life itself, everything is definitely a remix. In this final installment of Everything is a Remix, Kirby Ferguson offers his perspective on image generation with AI, how it compares to human creativity, and what its role will be in the future. In watching the part about the anxiety in the creative community about these image generators, I was reminded of what Ted Chiang has said about fears of technology actually being fears of capitalism. It’s capitalism that wants to reduce costs and reduce costs by laying people off. It’s not that like all technology suddenly becomes benign in this world. But it’s like, in a world where we have really strong social safety nets, then you could maybe actually evaluate sort of the pros and cons of technology as a technology, as opposed to seeing it through how capitalism is going to use it against us. I agree with Ferguson that these AI image generators are, outside the capitalist context, useful and good for helping humans be creative and express themselves. Tools like Midjourney, DALL-E, and Stable Diffusion allow anyone to collaborate with every previous human artist that has ever existed, all at once. Like, just think about how powerful this is: normal people who have ideas but lack technical skills can now create imagery. Is it art? Perhaps not in most cases, but some of it will be. If the goal is to get more people to be able to more easily express and exercise their creativity, these image generators fulfill that in a big way. But that’s really scary — power always is."
year_published = 2025
