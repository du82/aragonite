["https://kottke.org/tag/video"]
title = "kottke.org posts about video (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Whoa, HBO has made a third installment of Eyes on the Prize, the landmark series on the American Civil Rights Movement. The trailer is above and you can watch the six-part series on HBO or Max right now. The first two series, which are amongst the best television ever aired, covered events from 1954–1965 (part one) and 1965–1985 (part two). Eyes on the Prize III covers significant events from 1977-2015, including: Featured participants include Angela Davis, Al Sharpton, congressman Kweisi Mfume, Kimberlé Crenshaw, Al Gore, Black Lives Matter co-founders Alicia Garza and Patrisse Cullors, and dozens of other activists, scholars, and politicians. Eyes on the Prize III is, as the title suggests, a formal sequel to Eyes on the Prize II, a six-hour exploration of the “aftermath” of the Civil Rights Movement that makes it very clear that the movement has never ended, just as its real concerns were never fully resolved. It’s an emotional, inspiring and righteously angry series of vignettes that looks backward, while very clearly intending to reflect upon and instigate conversations about our fraught current moment. The series isn’t perfect, but it’s utterly essential, sometimes feeling disheartening for the immediacy of that necessity. I don’t know about you, but I’m ready to watch an earnest show about an ultimately successful revolution against a fascist government. It will be interesting to see in this political climate whether Disney+ is the place to watch such a thing. Apple TV+ is streaming an 8-hour remix of the Severance theme by ODESZA that is perfect music for your innie to refine macrodata to. The workday-long video is a 23-minute mix that’s looped and set to footage from the show. Legit adding this to the work music rotation. (via @margarita.bsky.social) I can already tell this is going to be my favorite thing of the day: Doechii singing and rapping about anxiety over Gotye’s Somebody That I Used To Know from 2019. If you didn’t know she could sing, well you do now."
