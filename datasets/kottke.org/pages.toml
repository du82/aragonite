["http://www.kottke.org/tag/Ukraine"]
title = "kottke.org posts about Ukraine (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Here’s a straightforward description of Trump’s “ambush” of Volodymyr Zelenskyy from Heather Cox Richardson: Today, President Donald Trump ambushed Ukraine president Volodymyr Zelensky in an attack that seemed designed to give the White House an excuse for siding with Russia in its war on Ukraine. Vice President J.D. Vance joined Trump and Zelensky in the Oval Office — his attendance at such an event was unusual — in front of reporters. Those reporters included one from Russian state media, but no one from the Associated Press or Reuters, who were not granted access. In front of the cameras, Trump and Vance engaged in what Josh Marshall of Talking Points Memo called a “mob hit,” spouting Russian propaganda and trying to bully Zelensky into accepting a ceasefire and signing over rights to Ukrainian rare-earth minerals without guarantees of security. Vance, especially, seemed determined to provoke a fight in front of the cameras, accusing Zelensky, who has been lavish in his thanks to the U.S. and lawmakers including Trump, of being ungrateful. When that didn’t land, Vance said it was “disrespectful” of Zelensky to “try to litigate this in front of the American media,” when it was the White House that set up the event in front of reporters. Unlike many media outlets reporting on this, Richardson ties this into a previous attempt by Trump to negotiate with Zelenskyy, which ended in Trump’s first impeachment: Zelensky came across Trump’s radar screen when, in July 2019, Trump tried to force Zelensky to say he was opening an investigation into Hunter Biden in order to smear Biden’s father Joe Biden before the 2020 election. Only after such an announcement, Trump said, would he deliver to Ukraine the money Congress had appropriated to help Ukraine fight off Russia’s 2014 invasion. Zelensky did not make the announcement. A whistleblower reported Trump’s phone call, leading to a congressional investigation that in turn led to Trump’s first impeachment. Schiff led the House’s impeachment team."
