full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! From astronomer Yuri Beletsky, a photo of Comet C/2024 G3 (ATLAS) arching over ESO’s Paranal Observatory in Chile. The nucleus of Comet ATLAS (C/2024 G3) held together during a brutal perihelion but not for long. Lionel Majzik of Hungary was the first to report and record dramatic changes in the comet between January 18th and 19th. The bright, strongly condensed head rapidly became more diffuse, a sure sign that its nucleus was disintegrating based on past observations of crumbling comets. His superb sequence, photographed remotely from Chile, clearly reveal the dramatic transformation, which was later confirmed by Australian observers. The tail will be visible for a few days after the breakup — such comets are called “headless wonders” by astronomers. (via @philplait.bsky.social) For his book Feed the Planet: A Photographic Journey to the World’s Food (Bookshop), George Steinmetz travelled the world with his drone, spending “a decade documenting food production in more than 36 countries on 6 continents, 24 US states, and 5 oceans”. In striking aerial images, he captures the massive scale of 21st-century agriculture that has sculpted 40 percent of the Earth’s surface. He explores the farming of staples like wheat and rice, the cultivation of vegetables and fruits, fishing and aquaculture, and meat production. He surveys traditional farming in diverse cultures, and he penetrates vast agribusinesses that fuel international trade. From Kansas wheat fields to a shrimp cocktail’s origins in India to cattle stations in Australia larger than some countries, Steinmetz tracks the foods we eat back to land and sea, field and factory. He takes us places that most of us never see, although our very lives depend on them. I was reminded recently of Stephen Voss’s lovely book, In Training: a book of bonsai photos (Amazon). Voss has a number of bonsai photo prints for sale as well as some videos of bonsai on his blog. This one is of a tree called Goshin, which has been in training since 1953:"
