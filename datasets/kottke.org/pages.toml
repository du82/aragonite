["https://kottke.org/25/03/jd-vance-chastised-by-vermont-snow-reporter"]
title = "Good Trouble: JD Vance Chastised by Vermont Snow Reporter"
description = "JD Vance, fresh off of helping his boss ambush & insult a foreign leader in the White House yesterday afternoon, is on vacation in Vermont with his family this weekend and will be skiing at Sugarbush Resort in Warren, VT, a 15-minute drive from where I li"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! JD Vance, fresh off of helping his boss ambush & insult a foreign leader in the White House yesterday afternoon, is on vacation in Vermont with his family this weekend and will be skiing at Sugarbush Resort in Warren, VT, a 15-minute drive from where I live. This morning, Sugarbush snow reporter Lucy Welch took the opportunity to make some good trouble by sending out a message of resistance against Vance and the administration he represents. The message went out via email to all Sugarbush daily report subscribers and appeared on the website for a brief time before it was removed. Here is the text of her message: Mar 1st, 2025, 6:49 AM: Today of all days, I would like to reflect on what Sugarbush means to me. This mountain has brought me endless days of joy, adventure, challenges, new experiences, beauty, community, and peace. I’ve found that nothing cures a racing mind quite like skiing through the trees and stopping to take a deep breath of that fresh forest air. The world around us might be a scary place, but these little moments of tranquility, moments I’ve been fortunate enough to enjoy as a direct result of my employment here, give me, and I’d guess you, too, a sense of strength and stability. This fresh forest air, is, more specifically fresh National Forest air. Sugarbush operates on 1745 acres of the Green Mountain National Forest. Right now, National Forest lands and National Parks are under direct attack by the current Administration, who is swiftly terminating the positions of dedicated employees who devote their lives to protecting the land we love, and to protecting us while we are enjoying that land. This Administration also neglects to address the danger, or even the existence of, climate change, the biggest threat to the future of our industry, and the skiing we all so much enjoy here. Burlington, VT is one of the fastest-warming cities in the country, and Vermont is the 9th fastest-warming state. The National Oceanic and Atmospheric Association (NOAA), a resource I use every day for snow reporting, is crucial in monitoring extreme weather events and informing public safety measures, and is also experiencing widespread layoffs and defunding at the hands of the Administration."
