["https://kottke.org/05/02/kottke-micropatron"]
title = "Doing Kottke.org As a Full-Time Job"
description = """
I recently quit my web design gig and — as of today — will be working on kottke.org as my full-time job. And I need your help.

I’m asking the regular readers of kottke.org (that’s you!) to become micropatrons of kottke.org by contributing a m"""
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! I recently quit my web design gig and — as of today — will be working on kottke.org as my full-time job. And I need your help. I’m asking the regular readers of kottke.org (that’s you!) to become micropatrons of kottke.org by contributing a moderate sum of money to help enable me to edit/write/design/code the site for one year on a full-time basis. If you find kottke.org valuable in any way, please consider giving whatever you feel is appropriate. This will be a one-time “fund drive” lasting 3 weeks, you may make contributions via PayPal, credit card, or check, there will be some great gifts as an incentive for you to give (more details here), and your contributions will be the primary means of support for the site. And yes, I have absolutely no idea if this will work and I’m completely nervous and exhilarated by the challenges ahead. If you’re uncertain as to whether you want to become a kottke.org micropatron, please read on. I’m going to explain what it is I’ll actually be doing, why I’m doing it, how the site might change, and what I’ll be doing with your hard-earned money. Why are you doing this? I’ve been self-publishing on the web for almost 10 years now, first with a little site on my school’s web server, then on various ISP accounts, then 0sil8, and finally kottke.org for the last 7 years (almost). Looking back on it all, this little hobby of mine has been the most rewarding, pleasurable, maddening, challenging thing in my life. I’ve met so many nice, good people, formed valued relationships with some of them, traveled to distant lands (and New Jersey), procured jobs & other business opportunities, discovered new interests, music, movies & books, and lots of other stuff, all for putting a little bit of me out there for people to see. And yet, I almost quit last spring. The site was getting out of hand and wasn’t fun anymore. It was taking me away from my professional responsibilities, my social life, and my relationship with my girlfriend. There was no room in my life for it anymore. As you can imagine, thinking of quitting what had been the best thing in my life bummed me right the hell out."
