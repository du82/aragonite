["http://www.kottke.org/tag/crying%20at%20work"]
title = "kottke.org posts about crying at work (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! Coldplay tapped Spike Jonze & Mary Wigmore to direct the music video for a song called All My Love from their latest album and the pair decided to turn it into an early 99th birthday celebration of Dick Van Dyke. Van Dyke danced a bit, sung a bit, was swarmed by his family, and ruminated on nearing the end of his life: I’m acutely aware that I could go any day now, but I don’t know why it doesn’t concern me. I’m not afraid of it. I have the feeling — totally against anything intellectual I have — that I’m gonna be alright. The video is really quite moving — what a splendid human. Watch until the end, when Chris Martin composes a song on the spot for an absolutely delighted Van Dyke. (via @danielgray.com) Before I clicked play on the video embedded above of 1000 musicians playing Learn to Fly by the Foo Fighters, I assumed it was going to be kind of a mess, a muddled wall of sound. Instead, I was surprised to hear something almost magical, a rock anthem played with the fullness of a orchestra or chorus, the band and the crowd merged into a single, gorgeously layered entity. I was moved by it, almost immediately. All those drummers pounding away on their drum kits in unison! You can check out this playlist for more 1000 musician versions of rock songs, including Seven Nation Army (White Stripes), We Will Rock You (Queen), and Smells Like Teen Spirit (Nirvana): I also have to say that these videos hit me harder now, 15 months into a global pandemic that kept my family and I separated from all but a narrow slice of the world, than they would have before, especially now that things are starting to loosen up a bit and I am able to safely socialize with other vaccinated folks in person. Seeing thousands of people collectively engaged something so joyful is both a reminder of what we lost during the pandemic and what we stand to gain if we can manage to contain the virus worldwide. I think this is the reason why this video of a flash mob performing Ode to Joy went viral early on in the pandemic. All the feels. (another great find via openculture)"
year_published = 2009
