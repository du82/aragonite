["http://www.kottke.org/tag/science"]
title = "kottke.org posts about science (kottke.org)"
full_description = "When you buy through links on kottke.org, I may earn an affiliate commission. Thanks for supporting the site! I loved this short thread from Andrew Miller about how his pediatrician wife helps parents who are skeptical of vaccinating their children change their minds. So my wife is a pediatrician and works in some hospitals with high vaccine and intervention hesitation (suburban ones). She has found *tremendous* success by just letting the families know she will have to document the higher risk of specific, and often fatal illness, in the chart of their child. She explains that if their child goes to the ER, the ER might not think to ask about routine newborn care that the parents opted out of, so by putting it in the chart she might be saving the child from this very specific thing. But just as important it makes it feel REAL to the parents. She identifies and describes the specific thing that their child is now more likely to die from. In detail, including symptoms to watch out for. It’s not abstract. It’s visceral. From David Wallace-Wells, a reminder that those who were considered alarmists at the beginning of the pandemic were ultimately proved right — it actually was an alarming situation. Today, the official Covid death toll in the United States stands at 1.22 million. Excess mortality counts, which compare the total number of all-cause deaths to a projection of what they would have been without the pandemic, run a little higher — about 1.5 million. In other words, the alarmists were closer to the truth than anyone else. That includes Anthony Fauci, who in March 2020 predicted 100,000 to 200,000 American deaths and was called hysterical for it. The same was true of the British scientist Neil Ferguson, whose Imperial College model suggested that the disease might ultimately infect more than 80 percent of Americans and kill 2.2 million of us. Thankfully, the country was vaccinated en masse long before 80 percent were infected… I’m also going to point out that those who were labeled alarmists about the impact of Donald Trump’s presidencies were also “closer to the truth than anyone else”, certainly closer than all those centrist “pundits”. I’m particularly thinking of those who knew when they woke up on November 9th to a Trump victory that Roe v Wade was toast and that Americans’ civil rights would be taken away and were called “hysterical” (there’s that word again) for saying so."
