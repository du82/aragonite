title = "SafetyNet: Google's tamper detection for Android ·  Yiannis Kozyrakis ~ blog"
description = """
This post is part of a series:
 Inside SafetyNet part 1 (Oct 2015) Inside SafetyNet part 2 (Feb 2016) Inside SafetyNet part 3 (Nov 2016) How to implement Attestation securely using server-side checks (my blog, Cigital blog) SafetyNet Playground (POC server-side implementation) Play Store - Android source - PHP source  What is SafetyNet The Android Pay application got released a few days ago. Some people using rooted devices discovered that it refused to work."""
full_description = '''SafetyNet: Google's tamper detection for Android A deep dive into SafetyNet internals - Google's tamper detection system for Android ikoz 17 Sep 2015 #android #safetynet This post is part of a series: Inside SafetyNet part 1 (Oct 2015) Inside SafetyNet part 2 (Feb 2016) Inside SafetyNet part 3 (Nov 2016) How to implement Attestation securely using server-side checks (my blog, Cigital blog) SafetyNet Playground (POC server-side implementation) Play Store - Android source - PHP source What is SafetyNet The Android Pay application got released a few days ago. Some people using rooted devices discovered that it refused to work. This is because it uses a new Google Play Services feature: SafetyNet attestation. SafetyNet attestation is Google telling the app their opinion regarding the CTS compatibility status of a device. CTS normally stands for Compatibility Test Suite, which is a suite of tests a device must pass, prior to release, to be allowed to include Google Play Services. It means something different in the SafetyNet context, like ‘the device is currently in a non-tampered state’. Tampered state has multiple definitions and can include ‘being rooted’, ‘being monitored’ or ‘being infected with malware’. ‘CTS compatible’ does not mean vulnerability-free. Google does not check if a device is up to date or vulnerable to public exploits, as part of the SafetyNet service. It checks if it has been tampered compared to an expected normal and safe state. One can argue that this is what application developers want: Vulnerability status of the device would be useful to end users but not so much to developers. The reason is that this is unrealistic: If an application refused to run on vulnerable devices, very few apps would work even in the most recent Android devices. SafetyNet is about assuring app developers that the device is ‘safe to run’, as opposed to ensure end users the device is ‘secure’ - different target group, different goals. Google obviously didn’t want to use a very loaded term like rooting or tamper detection, so it went with the neutral “CTS compatible”. Using SafetyNet attestation SafetyNet Attestation is a newish feature, at least for 3rd party application developers. Any application developer can use it in his app. The process has a few steps: An application calls SafetyNetApi.attest(). This is provided by the Google Play Services SDK. The request uses GoogleApiClient to reach the Google servers. The request must include a nonce. This is very important to prevent replay attacks. Best practice is for a server to generate this nonce and send it to the device to use in the request. Google responds with the attestation result. This is in JSON Web Signature (JWS) format - a type of signed JSON object. The response includes the various signatures and the following: "ctsProfileMatch": true|false The developer needs to verify the fields of the response manually. The signature of the response can also be verified by Google itself using another API call, and this is the best practice. Assuming the response is verified, if ctsProfileMatch is true, then the developer can be have a degree of certainty that the device has not been tampered (..is CTS compatible). What is interesting is that the response can also be verified on the developer’s server. An app can grab the JWS attestation response and send it to the application server it normally connects to. That server can then directly ask Google to verify the JWS signature (or do it itself) and proceed to act on the results on the server side, for example deny API access to the client. This is good design: security decisions happen on the server, not the client. Even if the client is manipulated, the server will refuse to provide services. From what I can tell, in AndroidPay, the attestation result is used as a parameter in pretty much every wallet & pay API. Having said that, this doesn’t mean that the attestation system can’t be fooled - a malicious environment could feed tampered data to the collectors. Moreover, it doesn’t mean that the attestation result is always fresh.. But better something than nothing. Developers can find instructions on using this feature here: https://developer.android.com/training/safetynet/index.html But how does it all work? SafetyNet System Design SafetyNet is a data collection system used by Google to gather security-related information from 1 billion Play-enabled Android devices. The idea is that Google Play Services, a closed-source package on the device starts an always-running service named snet. This service frequently collects various pieces of data from the device and sends it back to Google. Google uses this information for multiple purposes, such as ecosystem analysis and threat profiling of devices. It turns out that based on the collected information, Google is in a position to determine if a device is being tampered in a multitude of ways. Google maintains this information and knows at any point in time if a specific device is in a suspicious state. Attestation is how this information is exposed to 3rd party developers. When an application performs an attestation request, Google sends back a signed response that includes its decision about “CTS compatibility”, based on analysis of information previously collected from the device. The actual analysis of the collected data is done server-side, leaving less room for manipulation; again good security design. Of course, understanding the which pieces of data are collected could mean that someone could eventually develop a hooking system that constantly feeds snet with ‘non-malicious’ information. However, this is not trivial: The mechanism used to update snet is very flexible, as discussed below. Google does not disclose how exactly it determines “CTS compatibility” based on the collected data. For much of this data it is not very obvious what would constitute ‘safe’ and what not. For example, if Google collects a list of all the paths of files in the filesystem, an attacker would have to figure out what to hide by trial and error. Even though he would be able to make educated guesses, he wouldn’t know what exactly Google is looking for. SafetyNet internals When a 3rd party application wants to do an attestation request, it calls com.google.android.gms.safetynet.SafetyNetApi;->attest(mGoogleApiClient, nonce), the attest method of the Play Services SDK included in the app. This library transacts with the com.google.android.gms.safetynet.internal.ISafetyNetService service running on the device through Binder. The SafetyNetService is one of the Google Play Services. The service handling code is packaged in the Google Play Services package that ships with Google-endorsed Android devices and is updated through the Play Store. However, digging a bit deeper reveals a very interesting trick: The actual implementation of snet is not inside any APKs. The SafetyNet service reaches out to a Google server and downloads a binary package with the code. It goes to great lengths to validate the integrity of the package, for example using hardcoded certificates (pinning). This binary package is essentially a JAR file that contains a classes.dex file with java bytecode. Play Services caches it in dalvik-cache (snet.dex) and loads it dynamically using reflection. This is very convenient for Google: The actual implementation of the collection methods can be very easily updated, even without pushing apps through Google Play. Here are two versions of the package: https://www.gstatic.com/android/snet/12042014-1626247.snet https://www.gstatic.com/android/snet/07172015-2097462.snet These files are not obfuscated in any way (not even using ProGuard) - although Google Play packages are. After talking to members of the Android Security Team, it appears this is done on purpose: they want an implementation than can be easily reviewed. My guess is that they want to make sure that people know they are not collecting sensitive/privacy related information. Obfuscation could cast doubts. As you can see from the package dates, parts of this system are not new at all - SafetyNet exists since at least December 2014 but it’s been considerably enhanced in recent versions. This JAR file holds the implementation of the com.google.android.snet.Snet class. The enterSnet method is where the fun begins - this is what Play Services call through reflection. Google downloads security-related code in more occasions. For example, Android devices also download a native shared library named droidguard and run it, but let’s leave that for another post. EnterSnet The system is very modular: snet can be started by Play Services using a configuration file that defines which collection modules will be used. Not all of them are enabled by default. Let’s see what each of these modules does in more detail: default_packages This creates a list of the preferred packages for certain actions and reports back which packages are used for web browsing and package installations. It specifically checks if the preferred web browser is com.android.browser or com.android.chrome. I can assume this is done to detect situations where a user has authorised a non-standard browser that could be a malware - Google could maintain a list on their backend. su_files Reports back if the files /system/bin/su or /system/xbin/su exist. If they do, it is a clear indication of tampering. I do hope that the attestation result is not solely based on this check - although there’s evidence it plays a major role. On a non-infected, just rooted device, moving these files elsewhere seems to result in a positive attestation result. The same result is achieved via actions like “Disable SuperSU”. Maybe Google is being extra cautious. settings Collects various security-related fields from android.provider.Settings$Secure or android.provider.Settings$Global depending on the OS version. Settings collected include the values of variables like adb_enabled, install_non_market_apps, isKeyguardSecure(), getNotificationVisibility(), lock_screen_lock_after_timeout, lockscreen.password_type, lock_pattern_autolock. Obviously all these are indications that something might be ‘interesting’ about the device. locale Reports back the current locale configuration of the device. I assume this is done so that they can risk profile users according to locality and adjust their thresholds as needed. ssl_redirect This is an interesting module. It tries to establish if the device correctly follows SSL redirects. It collects information like the type of the active connection, the DNS servers in use, the available connections. It then creates a request to the following hosts: http://accounts.google.com, http://www.google.com, http://pubads.g.doubleclick.net - using random user agent, even mimicking an iPhone, having ‘follow redirects’ disabled. All these hosts redirect to HTTPS versions of the sites and the module collects the Location HTTP header from the redirect response. It then does the same request again, this time following the redirects. After the redirects reports back the IP and hostname of the the final endpoint host. This second request is even done randomly using either ApacheHTTPclient classes or HttpURLConnection(!) Some people asked for more information about the doubleclick.net domain. This is a domain used to serve advertisements to applications and the service is owned by Google. I can only assume this is also an attempt to detect if an ad-blocker is installed. ssl_handshake This anothere very interesting module. It attempts to figure out if communications can be intercepted in a number of ways, such as via having an SSL-Kill-Switch app installed. The code attempts to contact three hosts: accounts.google.com, www.google.com, pubads.g.doubleclick.net For each host the following algorithm is followed and all results of every step are captured, along with any possible errors. The module attempts an SSL socket connection using an ‘accept-all’ TrustAllX509TrustManager. The peer certificates are retrieved The code finds all TrustManagers of the system Each found TrustManager is initialized with no trust anchors and the checkServerTrusted() method is executed on the retrieved certificate chain. This would normally throw exceptions but under most SSL Kill Switch implementations it will not. The code verifies if exceptions are thrown (great check) TheDefaultHostnameVerifier is used to verify the hostname of the connection Then the module manually validates the certificate chain, also checking if any certificates use MD5withRSA algorithm and public keys shorter than 2048 bits. For each received certificate in the chain, the module checks if the issuer exists in the CA store of the system (/system/etc/security/cacerts) OR if it has been added by the user (/data/misc/keychain/cacerts-added) The module also includes a hardcoded, pinned intermediate certificate for Google and checks if it matches one of the received chain certificates Finally the Enhanced Key Usage Object Identifiers of the leaf certificate are also retrieved and compared with a hardcoded list (!) After all these checks, all the information as to whether the connections succeeded, what were the received certificates, if chain validation and trust checks passed, is sent back to Google. mx_record For each of the DNS server set up on the device, the gmail.com hostname is resolved and the MX servers are collected, along with the full DNS response. I assume this exists in order to detect if the device is configured in a way that lets attackers intercept emails. sslv3_fallback Connects to https://www.google.com using an SSL Socket initiated with TLS, making use of SNI extensions and SessionTicket features. It gathers if the socket was connected and if hostname verification passes. If the connection doesn’t go through, it is retried using SSLv3 instead of the modern TLS features mentioned above. The module collects all resulting artifacts and error messages. This module is obviously designed to detect network related attacks like SSL downgrade. proxy Collects whether there are proxies configured on the device, what are their IP addresses and if these IPs are local IPs for the device. This tries to establish if there is a traffic-snooping malware on the device (some malware - and ad-blockers - work using proxies) or if the communication is sent to external known-bad locations. selinux_status Collects if SELinux support is available on the device (if /sys/fs/selinux/enforce is present) and if it is in enforcing mode (via reading the contents of that file) If SELinux is in non-enforcing mode on newer Android versions it is a clear indication that something fishy is going on. sd_card_test Attempts to understand if the SD card has been tampered with. This creates a JPEG file named gmsnet2.jpg on the SD card, fills it with some hard-coded content. IT then analyses if the length of the file matches a hard-coded value and verifies if the writ'''
