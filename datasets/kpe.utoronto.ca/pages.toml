["https://kpe.utoronto.ca/about/governance"]
title = "Governance | UofT - Faculty of Kinesiology & Physical Education"
description = "The Faculty of Kinesiology and Physical Education is somewhat unique within U of T, in that it has responsibility for both curricular programs (BKIN, MSc, MPK & PhD) and co-curricular activities (campus recreation, intercollegiate and intramural athletics and community programming)."
full_description = "The Faculty of Kinesiology and Physical Education is somewhat unique within U of T, in that it has responsibility for both curricular programs (BKIN, MSc, MPK & PhD) and co-curricular activities (campus recreation, intercollegiate and intramural athletics and community programming).This is reflected in a pyramid governance structure: Faculty Council (FC) has overall jurisdiction over all programs (except for the co-curricular budget); the Council of Athletics and Recreation (CAR) has jurisdiction over the co-curricular programs on the St. George campus and others of a university-wide nature.Athletics councils/committees at UTM & UTSC are responsible for athletics programs on their own campuses."
year_published = 2025
