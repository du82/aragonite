["https://kpe.utoronto.ca/academics-researchcurrent-studentsgraduate-studies/graduate-tuition-fees-and-funding"]
title = "Graduate Tuition, Fees and Funding | UofT - Faculty of Kinesiology & Physical Education"
description = "Master of Professional Kinesiology Program (MPK)MPK TuitionMPK Year 1 tuition fees for 2024-25 are $10,550 for domestic students and $41,850 for international students, plus UHIP, ancillary and incidental fees.MPK Year 2 tuition fees for 2024-25 are $5,275 for domestic students and $20,925 for international students, plus UHIP, ancillary and incidental fees."
full_description = "Master of Professional Kinesiology Program (MPK)MPK TuitionMPK Year 1 tuition fees for 2024-25 are $10,550 for domestic students and $41,850 for international students, plus UHIP, ancillary and incidental fees.MPK Year 2 tuition fees for 2024-25 are $5,275 for domestic students and $20,925 for international students, plus UHIP, ancillary and incidental fees.For a full breakdown of the fees, visit the University’s Student Accounts website.Students in professional master’s programs typically self-fund their educational expenses through a variety of programs including student loans, student lines of credit, personal savings and employment income.Learn more about how funding works for professional programsLoansStudents in the MPK program are eligible for government student loans such as the Ontario Student Assistance Program (OSAP) or other provincial loans. Students who are eligible for government loans may also qualify for the University of Toronto Financial Aid (UTAPs) grant.Students who are Canadian citizens, permanent residents, or protected persons may be eligible for financial assistance from their provincial or territorial governments.Learn more about other loans and student lines of creditScholarships and GrantsMPK students can apply for Ontario Graduate Scholarships (OGS). The value of the OGS is $5,000 per session. Thus, awardees may receive $10,000 for two consecutive sessions or $15,000 for three consecutive sessionsLearn more about Ontario Graduate ScholarshipsThe application deadline for the Ontario Graduate Scholarship for 2025-26 is March 17, 2025.The University also has comprehensive scholarship programs that recognize outstanding achievement at different levels of study.Use the Award Explorer tool to explore the diverse funding opportunities available at the University.Master of Arts and Master of Science Program (MA and MSc)MA/MSc TuitionMA and MSc tuition fees for students entering in 2023-24 are $6,700 for domestic students and $30,350 for international students, plus UHIP, ancillary and incidental fees.MA and MSc tuition fees for students who entered in 2024-25 are $6,860 for domestic students and $30,350 for international students, plus UHIP, ancillary and incidental fees.International students must pay international student fees unless they are a Canadian Citizen or a Permanent Resident.For a full breakdown of the fees, visit the University’s Student Accounts website.The Graduate Department of Kinesiology at the University of Toronto provides research-stream graduate students with a base funding package equivalent to $8,500 plus tuition and incidental fees for years 1 - 2 of the full-time MA and MSc programs. The funding package may include funds from a variety of sources, including University of Toronto Fellowship (UTF) stipend, teaching assistantship hours, research assistantship stipend, and internal and external awards.REQUIREMENTS FOR FUNDINGStudents must be in good standing and be making progress towards completion of their degree and be registered in order to receive the graduate funding. In all cases, graduate students will not receive any less than the minimum funding guarantee unless they waive a portion of the income (eg. TA position).EXTERNAL AWARDSIn cases where students in the funded cohort receive an external, competitively reviewed award valued at or over $15,000 per annum (e.g., OGS, SSHRC, NSERC, CIHR) that award will stand in lieu of the stipend portion of the funding package from the Department. The Department will, to acknowledge the excellence of award recipients, offer a top-up equivalent to 10% of the award value (to MSc students) each year that they hold the external award and remain in the funded cohort. These students continue to be eligible to work as a teaching or research assistants if they wish to.Doctor of Philosophy Program (PhD)PhD TuitionPhD tuition fees for 2024-25 are $6,210 for domestic and international students, plus UHIP, ancillary and incidental fees.For a full breakdown of the fees, visit the University’s Student Accounts website.PhD FundingThe Graduate Department of Kinesiology at the University of Toronto provides doctoral graduate students with a base funding package equivalent to $17,750 plus tuition and incidental fees for years 1- 4 of the full-time PhD program.The funding package may include funds from a variety of sources, including University of Toronto Fellowship (UTF) Stipend Award, Teaching Assistantship Hours, Research Assistantship Stipend, Departmental Awards, Teaching Assistant positions and/or Research Assistant positions, Internal and External Awards.PhD Direct-Entry FundingThe direct-entry PhD option will be five years in length. It will include a guaranteed base funding package equivalent to $17,750 plus tuition and incidental fees for years 1 - 5 of the full-time direct-entry PhD program. The funding package may include funds from a variety of sources, including University of Toronto Fellowship (UTF) Stipend, Teaching Assistant positions and/or Research Assistant positions, Internal and External Awards.REQUIREMENTS FOR FUNDINGStudents must be in good standing and be making progress towards completion of their degree and be registered in order to receive the graduate funding. In all cases, graduate students will not receive any less than the minimum funding guarantee unless they waive a portion of the income (eg. TA position).EXTERNAL AWARDSIn cases where students in the funded cohort receive an external, competitively reviewed award valued at or over $15,000 per annum (e.g., OGS, SSHRC, NSERC, CIHR) that award will stand in lieu of the stipend portion of the funding package from the Department. The Department will, to acknowledge the excellence of award recipients, offer a top-up equivalent to 15% of the award value (to PhD students) each year that they hold the external award and remain in the funded cohort. These students continue to be eligible to work as a teaching or research assistants if they wish to."
