["https://kpe.utoronto.ca/aboutworking-kpestaff-training/mandatory-health-and-safety-awareness-training"]
title = "Mandatory Health and Safety Awareness Training | UofT - Faculty of Kinesiology & Physical Education"
description = "Legislation in Ontario requires all workers and supervisors to complete Basic Health and Safety Awareness Training. This applies to all appointed staff and faculty, PRA and sessional instructors, teaching assistants, post docs, work-study students, coaches and any casual staff, whether unionized or non-unionized. It is a condition of employment that everyone complete this training. It is a mandatory part of the onboarding process for all new employees."
full_description = "Legislation in Ontario requires all workers and supervisors to complete Basic Health and Safety Awareness Training. This applies to all appointed staff and faculty, PRA and sessional instructors, teaching assistants, post docs, work-study students, coaches and any casual staff, whether unionized or non-unionized. It is a condition of employment that everyone complete this training. It is a mandatory part of the onboarding process for all new employees. The training program takes about 20 minutes to complete and can be accessed via the University's Environmental Health & Safety website. Note that an essential step in this process is the requirement for the staff member who has completed the program to confirm that they have completed the training and this step must be completed online. In order to accurately track employee’s training result, please ensure you use your U of T e-mail address, UTORid or Personnel # at the end of the training session. Please speak with your supervisor if you require one or do not know your UTORid or personnel number. If you require assistance accessing the link, using the online registration system or confirming completion of the training, please contact: Ainsley Scott, HR Generalist (ainsley.scott@utoronto.ca) or Vindra Gooljar, HR Administrator (vindra.gooljar@utoronoto.ca). Visit the Office of Environmental Health & Safety's FAQ page for more information regarding mandatory training or contact them at ehs.office@utoronto.ca. This provincially mandated training should be completed during regular working hours. For anyone who does not have access to a computer, managers can direct staff to one of the following KPE locations to access the program or to complete the confirmation: - Benson Rm 330 (computer lab) - Warren Stevens Rm 1097 (casual staff office) or Rm 1060 (program area workstations) - Varsity Centre pavilion front desk (sign out the laptop and use the Zimmerman Rm or media gondola, as available) - Goldring Centre (second floor hoteling stations)"
