["https://kpe.utoronto.ca/facility/athletic-centre"]
title = "Athletic Centre | UofT - Faculty of Kinesiology & Physical Education"
description = "READ THE LATEST UPDATE ON OUR HEALTH & SAFETY MEASURES"
full_description = '''55 Harbord St., Toronto, ON M5S 2W6 416-978-3436 READ THE LATEST UPDATE ON OUR HEALTH & SAFETY MEASURESAbout the Athletic CentreThe Athletic Centre is located on the west side of the University of Toronto's St. George campus, right at the intersection of Spadina Ave. and Harbord St. This historic facility is comprised of the Warren Stevens Building and the Clara Benson Building, housing seven gymnasia, three indoor pools, a strength and conditioning centre, indoor track and field house, dance studio, squash courts, and more. The Athletic Centre is a multi-purpose facility used for academic learning, recreational workouts and activities, registered programs and instruction, child and youth programming, intramurals, and special events. The Athletic Centre is home to the following University of Toronto Varsity Blues intercollegiate sports: Swim, Track & Field, Cross Country, Water Polo, Squash, Fencing, Badminton, Wrestling, and Tennis.Hours of OperationBuilding and Office HoursMonday to Friday: 7 a.m. - 11 p.m.Saturday & Sunday: 9 a.m. - 5 p.m.Open Gym Schedule (September 3 to December 24, 2024):Click here for all Open Gym workout info at the SCC, Bruce Kidd Field House, Weightlifting Zone and more! Strength & Conditioning Centre (SCC)Weightlifting Zone (WLZ)Bruce Kidd Field House (Periphery)Monday to Friday:7:00 a.m. to 9:00 p.m.Monday:8:00 a.m. to 1:00 p.m.3:00 p.m. to 5:00 p.m. Tuesday/Thursday:10:00 a.m. to 12:00 p.m.3:00 p.m. to 5:00 p.m.6:00 p.m. to 9:00 p.m. Wednesday:8:00 a.m. to 1:00 p.m. Friday8:00 a.m. to 12:00 p.m.4:00 p.m. to 9:00 p.m.Monday to Friday:7:00 a.m. to 11:00 p.m.Saturday to Sunday:9:00 a.m. to 5:00 p.m.Saturday to Sunday:11:00 a.m. to 4:00 p.m.Saturday to Sunday:9:00 a.m. to 5:00 p.m.Building entryCards must be scanned to gain accessTCards or Sport & Rec membership cards must be scanned at the turnstile to access our facilities. Cards are not transferrable. If you have have lost or forgotten your card, please visit our customer experience staff for assistance or visit our FAQs.Effective May 21, 2024, all Sport & Rec members are required to scan their TCard or membership card at the SCC entrance to gain access to the space. Visit our Open Gym page for more information. When visitingCheck here for the latest updates on our health and safety measures. Access to the Athletic Centre for Sport and Rec programming is available from the Classic Ave. entrances and Harbord St. entrances. Registered program participants are asked to arrive no earlier than 15 minutes prior to the start of their program time slot. Be mindful of your scheduled time in the facility. Please ensure you enter and leave the facility within your allotted time to allow our staff to sanitize between usage periods for all users. Your allotted time includes time at your programmed activity and prompted use of showers and changerooms. Propping outside doors open to facilitate unauthorized entry jeopardizes the security of the facility and will result in suspension of membership privileges. Facility detailsThe Athletic Centre is home to seven gymnasia, three pools, a strength and conditioning centre, indoor track, field house, dance studio, cardio machines, tennis and squash courts and more. Gyms & Courts Sports gym - Double gymnasium with retractable bleachers seating 600 guestsUpper gym - Single gymnasium Lower gym - Gymnastics facility Bruce Kidd Field House - Includes: 200m indoor track, 4 courts, 6+ squat racks, strength & cardio equipmentStrength and conditioning centre (SCC) - Includes: free weights, squat racks, strength & cardio equipment Weightlifting Zone (WLZ) - Includes: free weights, kettlebells, medicine balls, strength training equipmentSquash and Table Tennis courts - Includes: 9 squash courts, 2 table tennis courts Pools Varsity pool (50m) - Eight-lane, Olympic-sized 50-metre pool with an adjacent teaching pool and seating galleryBenson pool (25yd) - Six-lane, 25-yard pool Multi-Purpose & Fitness Facilities Dance studio - Includes: wood flooring, mirrors, permanent bars, and sound systemPedal Zone - Indoor cycling facility Lockers, Changing Rooms, and Washrooms Change rooms are located in the basement. There are large accessible men’s and women’s change rooms with private cubicles for changing and showering as well as open areas. Lockers are available for rent here. Privacy/family change rooms are also located in the basement and have two private change rooms for changing, open showers (bathing attire required) and two single user washrooms nearby. There is a small cubicle for changing outside the 25-yard pool and two single user washrooms located inside the pool area that can be used when the pool is open.Additional single user washrooms are located by the Strength and Conditioning Centre, the Dance Studio and the Weightlifting Zone. Travelling Parking Metered, street parking is available around the periphery of the Athletic Centre. There is also an underground parking lot across the street at Graduate House, 60 Harbord St. This parking lot can be accessed by traveling north on Spadina Ave. or east on Glen Morris Ave. Bike Racks Bike racks are available in front of the Athletic Centre on Harbord St. and behind on Classic Ave. Public Transit (TTC) The Athletic Centre is a 7-minute walk south of Spadina Subway Station or is accessible by the 510 Spadina Streetcar or the 94 Wellesley Bus. RentalsMany spaces within the Athletic Centre is available for rentals, including the gyms, courts, pools, lecture rooms, and more. Visit our Rentals page for more details and pricing. U of T student clubs and groups are able to book facility space here. Questions?Contact us at 416-978-3436 and press "0" to speak with a customer experience representative or email us at sportandrec@utoronto.ca. Explore Sport & Rec Programs and ActivitiesMental and physical wellness is crucial to having a healthy life and supporting academic success, and we are here to help you develop and maintain an active lifestyle. Sport and Rec has a variety of programs and activities, such as:Group workout classesOpen gymRecreational sportsCompetitive sportsAquaticsRegistered programsChild and youth programsFIND AN ACTIVITY THAT IS RIGHT FOR YOU!'''
