["https://kpe.utoronto.ca/academics-researchcurrent-studentsgraduate-studiesgraduate-program-requirements/program-0"]
title = "Program Requirements | UofT - Faculty of Kinesiology & Physical Education"
description = "MA Requirements as of September 2022 The MA in Kinesiology is designed as a two-year, full-time program involving a combination of coursework and original research. The purpose of the Master of Arts is intended to broaden students’ understanding of the various aspects of kinesiology from a social sciences and/or humanities disciplinary perspective, as well as to provide them with the necessary scholarly and technical research skills so that they may pursue a high-quality research project."
full_description = "MA Requirements as of September 2022 The MA in Kinesiology is designed as a two-year, full-time program involving a combination of coursework and original research. The purpose of the Master of Arts is intended to broaden students’ understanding of the various aspects of kinesiology from a social sciences and/or humanities disciplinary perspective, as well as to provide them with the necessary scholarly and technical research skills so that they may pursue a high-quality research project. The research project will culminate in the presentation of a formal written thesis and oral defence. courses 0.5 FCE in Methods/Methodology 1.0 FCE in Kinesiology Category A 1.0 FCE other courses Graduate Seminar Course (attendance required in all Graduate Seminars) Notes: FCE = full course equivalent [1.0 FCE can mean either one full course or two (0.5) half courses] Additional Requirements A thesis proposal written under the supervision of a thesis committee and its oral defence before an examination committee. An original thesis written under the supervision of a thesis committee and its oral defence before an examination committee. Annual meeting of student and supervisory committee. MSc Requirements as of September 2013 The MSc degree program in Kinesiology is designed as a two-year program consisting of a combination of course work (2 FCEs) and original research. The program is intended to broaden the students' understanding of the various interdisciplinary aspects of the kinesiology as well as to provide them with the necessary scholarly and technical research skills so that they may pursue a high quality research project. The research project will culminate in the presentation of a formal written thesis and final oral defence. Courses 0.5 FCE in Kinesiology 0.5 FCE Statistics or Methodology course (in Kinesiology or other Department) 1.0 FCE in Kinesiology or another Department Graduate Seminar Course Notes: FCE = full course equivalent [1.0 FCE can mean either one full course or two (0.5) half courses] Additional Requirements A thesis proposal written under the supervision of a thesis committee and its oral defence before an examination committee. An original thesis written under the supervision of a thesis committee and its oral defence before an examination committee. Annual meeting of student and supervisory committee. Prior to September 2013 The MSc degree program in Exercise Sciences is designed as a two-year program consisting of a combination of course work (2.5FCE) and original research. The program is intended broaden the students' understanding of the various interdisciplinary aspects of the exercise sciences as well as to provide them with the necessary scholarly and technical research skills so that they may pursue a high quality research project. The research project will culminate in the presentation of a formal written thesis and final oral defence. Overview 1.0 FCE required courses 1.5 FCE elective courses Thesis and defence of the thesis 1.0 FCE Required Courses: Each student must complete ONE of the following 0.5 FCE courses, depending on their stream: Biophysical: EXS 5503H Adaptations to Habitual Activity Sociocultural: EXS 5518H Theoretical Issues in the Study of Physical Activity and Health Behavioural: Students must take at least one of the following: EXS5513H, EXS5516H, EXS5520H or EXS5521H. Each student must complete a 0.5 FCE statistics/research methods course at the graduate level. Please consult the School of Graduate Studies calendar/departmental websites for such courses. 1.5 FCE Elective Courses:Each student must complete a 0.5 FCE graduate course in Exercise Sciences in addition to the EXS required course. Each student must complete a 0.5 FCE graduate course from a department outside Exercise Sciences in addition to their statistics/research methods course. Each student must complete a 0.5 FCE graduate course of their choice, including EXS courses. Find additional information on program requirements in the KIN Student Handbook."
year_published = 2025
