title = "Facilities & Memberships | UofT - Faculty of Kinesiology & Physical Education"
description = "FacilitiesThe Faculty of Kinesiology & Physical Education operates a range of activity spaces for sport and recreation, academic and research programs, and programs for children and youth across our facilities:"
full_description = 'FacilitiesThe Faculty of Kinesiology & Physical Education operates a range of activity spaces for sport and recreation, academic and research programs, and programs for children and youth across our facilities:Athletic CentreGoldring Centre for High Performance Sport Varsity Centre and ArenaBack Campus fieldsRobert Street fieldsUniversity of Toronto students pay mandatory athletic incidental fees and are a priority in our Sport & Rec facilities; they inform and govern our decision-making processes involving the provision of sport and recreational programs and services.MembershipsREMINDER: All U of T students who have paid KPE athletic incidental fees for the term are automatically members of the Athletic Centre, Goldring Centre for High Performance Sport, and Varsity Centre. This includes part-time and full-time undergraduate and graduate students. Check out the Student & Member Code of Conduct for our policies on accessing and using our facilities. All community members are welcome to take part in programming provided that they are aware that student priority programming may limit access to certain facility areas or hours.Learn more about our membership plans (18+) to access Sport & Rec facilities and programming. We also offer specific programming for children & youth (ages 4-17 years).Questions?Contact us at 416-978-3436 and press "0" to speak with a customer experience representative or email us at sportandrec@utoronto.ca.'
