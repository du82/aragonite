["https://kpe.utoronto.ca/aboutworking-kpestaff-training/leadership-development"]
title = "Leadership Development | UofT - Faculty of Kinesiology & Physical Education"
description = "Part-time staff and volunteers play a very important role in delivering the Faculty's programs and services to students, other members and the public in accordance with our mission, values and guiding principles. As a condition of employment, staff are required to attend the training as outlined below. Casual staff will be paid an hourly training rate for attending. Work-study students are paid at the work-study pay rate."
full_description = "Part-time staff and volunteers play a very important role in delivering the Faculty's programs and services to students, other members and the public in accordance with our mission, values and guiding principles. As a condition of employment, staff are required to attend the training as outlined below. Casual staff will be paid an hourly training rate for attending. Work-study students are paid at the work-study pay rate. Training will take place in the Faculty's Athletic Centre (55 Harbord Street, in the Benson Wing) or Varsity Centre (299 Bloor Street West). All volunteer and casual staff training information is coordinated through the Faculty’s human resources and payroll office. To contact us, email kpe.dean@utoronto.ca or call 416-946-3060. If you require assistance using our on-ine registration system, please contact the main office at 416-978-3436. For additional leadership resources on campus, please visit the Student Life website."
