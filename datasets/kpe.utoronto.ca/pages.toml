description = "BKin students in Year 3 of their undergraduate program have the opportunity to gain early conditional graduate admission on a competitive basis to the Master of Teaching (MT) program from the Ontario Institute for Studies in Education (OISE). Students who successfully complete their Combined Degree Program, will have earned two University of Toronto degrees (i.e. BKin and MT), and be recommended to the Ontario College of Teachers for a Certificate of Qualification, which certifies them to teach in Ontario schools."
