title = "Future Students | UofT - Faculty of Kinesiology & Physical Education"
description = "Imagine a place that applies a physical cultural, biophysical and behavioural lens to all aspects of movement, from overcoming injury and managing disease to health promotion and high performance athletics. At the University of Toronto, kinesiology is all of this and so much more."
full_description = "Imagine a place that applies a physical cultural, biophysical and behavioural lens to all aspects of movement, from overcoming injury and managing disease to health promotion and high performance athletics. At the University of Toronto, kinesiology is all of this and so much more.It's understanding how physical activity moves you, improves you, how it challenges us as individuals and impacts us as a society.Public attention has never been more focused on the importance of physical activity to the health and well-being of each of us individually, and of the communities and society in which we live.Our unique programs will give you the opportunity to acquire knowledge and skills about physical activity, health and the interactions between the two, and prepare you to play a leadership role in translating knowledge into practice in an equitable and inclusive way.Through excellence in research, teaching and practice, we educate and graduate a diverse student body who become productive contributors and leaders in their fields.Discover kinesiology in all its facets at the University of Toronto."
