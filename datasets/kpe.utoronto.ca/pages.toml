["https://kpe.utoronto.ca/aboutgovernance/faculty-council"]
title = "Faculty Council | UofT - Faculty of Kinesiology & Physical Education"
description = "As the main governing body for the Faculty of Kinesiology and Physical Education, Faculty Council creates and amends the by-laws governing the business of Council and its committees; oversees, approves and refers back decisions, motions, proposals, and recommendations from the committees; reports to the Governing Council of the University through the dean; and considers operational plans, budget proposals, and other recommendations from the Council of Athletics and Recreation. Faculty Council exercises its duties and powers under the provisions of the University of Toronto Act."
full_description = "As the main governing body for the Faculty of Kinesiology and Physical Education, Faculty Council creates and amends the by-laws governing the business of Council and its committees; oversees, approves and refers back decisions, motions, proposals, and recommendations from the committees; reports to the Governing Council of the University through the dean; and considers operational plans, budget proposals, and other recommendations from the Council of Athletics and Recreation. Faculty Council exercises its duties and powers under the provisions of the University of Toronto Act.Faculty Council is composed of the president of the University; the vice-president and provost; the dean of the Faculty of Kinesiology and Physical Education; the vice, associate and assistant deans of the Faculty; the chief administrative officer; all teaching staff and professors emeritae/of the Faculty; the registrar of the Faculty; one professional librarian; representatives of the Council on Athletics and Recreation; representatives of the Kinesiology and Physical Education Undergraduate Association and the Kinesiology and Physical Education Graduate Society; and representative activity instructors, students, administrative and technical support staff, and alumni. Faculty Council Constitution Document Faculty Council Bylaws The following standing committees report to Faculty Council:Admission (Undergraduate) – responsible for the selection of students to the undergraduate program and makes recommendations on the award of Admission scholarships.Appeals (Undergraduate) – final level of appeal within the Faculty for academic appeals by undergraduate students, subject to the right of appeal to the Governing Council.Curriculum (Undergraduate) – responsible for the curriculum of the undergraduate programs.Graduate – responsible for all policies and practices concerning the Graduate Department of Kinesiology.Research - responsible for recommending policies and practices regar