uctor - apply by March 23Camp UofT Coordinator - apply by March 23 Customer & Membership Services Document Customer Experience Assistant - Apply by February 28, 2025.pdf Fitness & Performance Document Fitness & Performance Part-Time Coach - Apply by February 28, 2025 Document Fitness & Performance SCC Lead Facilitator - Apply by February 28, 2025 Document Fitness & Performance SCC Facilitator - Apply by February 28, 2025 Intramurals &Tri-CampusTri-Campus League Coach jobs:No positions available at this time. Intramurals Referee and Game Manager jobs:No positions available at this time. Intramurals team and admin jobs:No positions available at this time. Physical Activity, Full Time (Casual)No positions available at this time.Physical Activity Facilitators (PAF)No positions available at this time.Physical Activity - MoveU MoveU Volunteer - Ongoing Physical Activity- Adult Sport InstructionNo positions available at this time. Academic OpportunitiesParticipate in our academic opportunities to advance innovation, research, and discovery in the intersection of health and movement.Office of the Registrar and Student Services (ORSS)The Faculty's Office of the Registrar and Student Services hires students to assist with select programs and initiatives. These roles are only open to undergraduate and graduate students who are currently enrolled in degree programs at the Faculty. Opportunities will be posted in this section when they become available. Document Night Porter - 2025 Reach Ahead Program - Apply by February 28, 2025 Document 2025-26 KPE Connect Peer Mentor - Apply by March 3, 2025 Document 2025-26 KPE Undergraduate Student Ambassador - Apply by March 17, 2025 Document 2025-26 KPE Equity Programming and Workshop Assistant - Apply by March 31, 2025 KINectionsKINections is a student engagement program run by the Faculty of Kinesiology & Physical Education. KINections work study and volunteer roles are only open to undergraduate and graduate students who are currently 