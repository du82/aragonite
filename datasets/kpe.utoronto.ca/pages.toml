description = "Membership Plans & Pricing If you’re a registered student paying incidental fees, you already have access to many of Sport & Rec's facilities, programs and"
full_description = '''Membership Plans & Pricing If you’re a registered student paying incidental fees, you already have access to many of Sport & Rec's facilities, programs and services. Just show your TCard!Whether you're a student, senior, or alumni, we offer special rates on our gym memberships:Community (18+ years)Available to all. Must be minimum 18 years of age.Membership OptionsMembership Rates1 Day$21.091 Week$63.2730 Days$118.071 Term (starting each Sep, Jan, May semester)*$399.69*Academic Year (Sep 1, 2024 to Apr 30, 2025)*$732.23*1 Year$1,001.94 ($83.49 monthly)*Daily adjusted feeAlumni 1st/2nd Year, Student-Plus, Seniors 65+1st & 2nd Year U of T AlumniUniversity of Toronto alumni who have recently graduated from an undergraduate or graduate program within the past two years. For status verification, you can inquire at the Athletic Centre or Goldring Centre, or email the Sport & Rec team.Student Plus (in-person only)Currently enrolled as a student at an accredited college, university, or trade school. Both full-time and part-time students are eligible. Individuals enrolled in continuing education courses are also eligible. You must provide valid proof of your student status which may include student ID card, tuition receipt or class schedule. Seniors (65+)Photo ID must be presented with date of birth.Membership OptionsMembership Rates1 Day$21.091 Week$63.2730 Days$118.071 Term (starting each Sep, Jan, May semester)*$258.88*Academic Year (Sep 1, 2024 to Apr 30, 2025)*$520.53*1 Year$649.91 ($54.15 monthly)*Daily adjusted feeAlumni 3+, Staff/Faculty, U of T Affiliate, Post Docs, Co-residentU of T ALUMNIUniversity of Toronto alumni include individuals who have graduated from an undergraduate or graduate program, or who have completed at least 4 undergraduate credits or one year of graduate school. For status verification, you can inquire at the Athletic Centre or Goldring Centre, or email the Sport & Rec team.U of T Staff and FacultyCurrent part-time or full-time U of T staff or faculty. A recently dated letter of employment must be presented at time of purchase.U of T Affiliate (in-person only)Staff of the University Health Network, U of T Affiliated Teaching Hospitals, CAMH, Jane Goodall Institute, Royal Ontario Museum, and U of T Medical Residents. A recently dated Letter of Employment must be presented at time of purchase.Post Doc (in-person only)Post-docs must present a recently dated letter on faculty or department letterhead indicating post doctoral status. Offer or Acceptance of Employment letters are also valid.Co-resident (in-person only)Available to individuals residing with a fee paying U of T student or current Sport & Rec member. Both individuals must present a bill or driver's license displaying the same address when purchasing the membership.Membership OptionsMembership Rates1 Day$21.091 Week$63.2730 Days$118.071 Term (starting each Sep, Jan, May semester)*$302.20*Academic Year (Sep 1, 2024 to Apr 30, 2025)*$560.00*1 Year$806.96 (67.24 monthly)*Daily adjusted feeGoldring Centre MembershipThis membership grants access solely to the strength and conditioning centre, drop-in programs, and activity spaces at the Goldring Centre. Registration for adult instructional programs, IMPACT Training and access to the Sport Medicine Clinic is not included.Membership OptionsMembership Rates1 Day$21.0930 Days$63.65 1 year$763.80 ($63.65 monthly) Sport & Rec One Year Monthly Deduction1-year membership commitment with convenient automatic monthly payments.Membership Eligibility Membership RatesAlumni 1st/2nd Year, Seniors 65+, Student-Plus$59.46 ($713.52 yearly)Alumni, Staff/ Faculty, U of T Affiliates, Post Doc, Co-resident$72.54 ($870.48 yearly)Community 18+$88.84 ($1066.08 yearly)Joining Sport & Rec Purchase or renew your membership in two ways: In Person at the Athletic Centre, Goldring Centre for High Performance Sport or Varsity Centre Online through the Sport & Recreation Online Portal Membership CancellationTo cancel your membership, please fill out our cancellation request form. Within 10 daysFull refunds are given upon cancellation of memberships within 10 days of the purchase date. After 10 daysA pro-rated refund will be provided from the date of the request minus a $22.12 + HST administrative fee. To request a refund for an earlier period, valid medical documentations must be provided listing the date of illness/injury. No refunds, holds or extensions are provided due to closures, schedule changes or facility availability.Monthly Memberships It is the member’s responsibility to cancel their membership before the next billing cycle if they do not wish to continue. Cancellation requests for our monthly deduction memberships must be received 10 days before the start of the next billing month. Once a monthly payment has been processed, no refunds or prorated refunds will be issued, regardless of usage or cancellation within that billing period.Membership BenefitsJoin today with no contracts, no annual fees and no enrollment fees! Find your fit with Sport & Rec and enjoy incredible benefits with your membership: Access to Multiple FacilitiesA wide variety of programs and activities available at the Athletic Centre, Goldring Centre for High Performance Sport, Varsity Centre, Robert Street Field and Back Campus Fields.Open Gym & Strength TrainingState-of-the-art gym equipment at over four open gym and weightlifting spaces.AquaticsDaily drop-in swims at the Athletic Centre's Olympic-size 50-yard and 25-yard pools, offering lane swimming, fun swim, diving and more! Drop-In SportsOrganized drop-in sports, including basketball, skating and soccer, with bookable court times for badminton, table tennis, squash and tennis (limited availability).Group FitnessUnlimited access to 30+ weekly group fitness classes, including barre, yoga, cardio dance party, and more.Inclusive ProgramsWomen-only and inclusive hours and programming, including open gym, drop-in sports and aquatics.Programming for the FamilyMembers can bring their children at no cost during family drop-in programming. Instructional ProgramsAccess to adult registered instructional classes, including tennis, gymnastics, skating, boxing and swimming, is available at an additional cost. Membership PerksMember perks with local partners and discounts for Junior Blues and Camp U of T programs.Questions?Contact us at 416-978-3436 and press "0" to speak with a customer experience representative or email the Sports & Rec team.'''
