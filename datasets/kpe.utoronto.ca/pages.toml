["https://kpe.utoronto.ca/aboutstudent-outreach/equity-diversity-inclusion-and-belonging"]
title = "Equity, Diversity, Inclusion and Belonging | UofT - Faculty of Kinesiology & Physical Education"
description = "READ THE LATEST UPDATE ON OUR HEALTH & SAFETY MEASURES"
full_description = "READ THE LATEST UPDATE ON OUR HEALTH & SAFETY MEASURESAbout Sport & Recreation's EDIB teamWe are a group of undergraduate and graduate students from across campus who plan, motivate and implement positive student-led initiatives that promote equity, diversity, inclusion, and belonging (EDIB), and physical/mental health. The team develops and implements events and projects related to sport and physical activity through student-staff partnerships. Upcoming EventsHike Series with LHTOMonthly from April to OctoberSport & Rec's EDIB team, Diversity Moves Us, is partnered with Let's Hike T.O. to host a series of hikes and urban walks throughout the warmer months of the year. These special hikes will leave from around the St. George Campus and will take students on a journey through local streets, green spaces, and ravines. You're invited to come connect, learn, build community and friendships, and enjoy gentle movement outdoors together. These hikes are intended for UofT students currently enrolled or returning in Fall 2024.Free for U of T students!Learn more about our Hike Series with LHTOAbout our Workshops & ProgramsTrans Pool HoursThursdays from 5:35 - 6:50 p.m.Location: Benson 25yd PoolA dedicated swim time for trans, gender-non-conforming, gender-exploring, nonbinary and two-spirit students and members only.Free for U of T students & Sport & Rec members!Learn more about Drop-in Trans Pool HoursDrop-in VogueReturning Fall 2024Location: Goldring Fitness StudioTell your story through the legendary movement of vogueing. In these beginner friendly drop-in sessions with Vogue dancer Snoopy, you will learn and practice the 5 elements of vogue dance - cat walk, duck-walk, hand performance, floor performance, and spins and dips. Feel the beat, werq the runway, and drop with ferocity - 10's! 10's! 10's! across the board! Classes are free for U of T students & Sport & Rec members!Learn more about Drop-in Vogue DanceFunding Student-Led Diversity & Equity Initiatives Since 2021The EDIB team oversees the Equity Ideas Fund. Student groups can apply for up to $500 in funding for initiatives related to equity, diversity, inclusion, and belonging, which are then considered within the scope and parameters of the Faculty’s Equity Ideas Fund approval process. Apply to the Equity Ideas Fund here! Contact the Equity Ideas Fund Team for any questionsContact UsQuestions? Contact the EDIB Team!"
