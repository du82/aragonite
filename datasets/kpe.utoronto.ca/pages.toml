title = "Filming and Photoshoots | UofT - Faculty of Kinesiology & Physical Education"
description = "All filming requests require approval from Faculty’s Public Relations and Communications office before arrangements for filming and/or a photo shoot can be made. External requests should be made a minimum of 15 business days in advance of a desired filming day. Internal requests can be made with 5 days notice. All requests should include specifics such as purpose of the filming, desired locations and size of film crew. Filming and photography of students is prohibited unless advance written permission from the student has been provided to the Faculty."
full_description = "All filming requests require approval from Faculty’s Public Relations and Communications office before arrangements for filming and/or a photo shoot can be made. External requests should be made a minimum of 15 business days in advance of a desired filming day. Internal requests can be made with 5 days notice. All requests should include specifics such as purpose of the filming, desired locations and size of film crew. Filming and photography of students is prohibited unless advance written permission from the student has been provided to the Faculty. A contract and proof of liability insurance may be required. Requests for use of the Faculty’s properties for a film location or commercial film shoot, are to be directed to the university’s office of Campus Events."
