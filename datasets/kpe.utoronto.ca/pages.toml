["https://kpe.utoronto.ca/aboutworking-kpe/staff-training"]
title = "Staff Training | UofT - Faculty of Kinesiology & Physical Education"
description = "Casual staff and volunteers play a very important role in delivering the Faculty's programs and services to students, other members of the University community and the public in accordance with our mission, vision, values and guiding principles. As a condition of employment, staff are required to participate in and/or attend the training as communicated by their supervisor or manager. Casual staff will be paid an hourly training rate for attending. Work-study students are paid at the work-study pay rate.Training courses include:"
full_description = "Casual staff and volunteers play a very important role in delivering the Faculty's programs and services to students, other members of the University community and the public in accordance with our mission, vision, values and guiding principles. As a condition of employment, staff are required to participate in and/or attend the training as communicated by their supervisor or manager. Casual staff will be paid an hourly training rate for attending. Work-study students are paid at the work-study pay rate.Training courses include: Mandatory Training Mandatory Health and Safety Awareness Training Legislation in Ontario requires all workers and supervisors to complete Basic Health and Safety Awareness Training. This applies to all appointed staff and faculty, PRA and sessional instructors, teaching assistants, Post Docs, work study students, coaches and any casual staff, whether unionized or non-unionized. It is a condition of employment that everyone completes this training. It is a mandatory part of the onboarding process for all new employees unless they have already completed it elsewhere. https://ehs.utoronto.ca/basic-health-and-safety-training/ Accessibility The Accessibility for Ontarians with Disabilities Act (AODA) is a piece of legislation in the Province of Ontario aimed at making the places you work, live and learn as accessible as possible. Compliance with the AODA Customer Service Standards legislation is required and reported. http://aoda.hrandequity.utoronto.ca/service-resources/ Required Training Essential information about working in the Faculty. Review the KPE Staff Resource Guide and the Faculty’s Sport and Recreation Activity Guide for a full understanding of programs and services offered by the Faculty. Sexual Violence Education and Prevention Module The University of Toronto has made available online sexual violence education and prevention training to all students, staff and faculty members. Completion is strongly encouraged and constitutes an important step toward creating a campus environment in which all members of the University community can study, work and live free from sexual violence. Select the appropriate link below, based on your role at the University of Toronto: a. Staff https://q.utoronto.ca/enroll/CNT877 b. Faculty https://q.utoronto.ca/enroll/MBBRLF c. Student https://q.utoronto.ca/enroll/FYA7K4 Emergency Response Training Required for all new employees, designated first aiders and anyone who hasn’t taken an Emergency Response Training in the past 2-3 years. The training prepares staff for emergencies that may arise on our premises because of the amount of physical activity people engage in here. The training covers 911 know-how and activation of designated first aiders; emergency action plans for each facility/location we use; evacuation procedures; other emergency resources on campus; and documentation and follow up, including information about who to contact. Optional Training First Aid & CPR Training Required for all employees who have first aid in their descriptions, e.g., facilities staff, pool staff, clinic staff, child and youth instructors, movement instructors, SCC staff, program monitors, and customer and membership services staff). CPR training should be renewed annually, and First Aid training done at least every three years. Training on first aid situations specific to your job will be provided by managers/supervisors to ensure that staff members are prepared to respond promptly and appropriately. Leadership Development For additional leadership resources on campus, please visit the Student Life website. Lynda.com As a current student, staff, or faculty member at University of Toronto, you have access to Lynda.com, an online learning resource with high-quality instructional videos taught by recognized experts. Using your UTORid to log in, you may choose from more than 1,400 online self-paced courses that cover a wide range of topics. Identify, Assist, Refer Educational Module In this online training program participants learn how to recognize key indicators that a student may be struggling with a mental health issue, how to begin a supportive conversation with the student of concern, and how to make the most appropriate referral to campus and/or community resources. The training program is provided by U of T's Health and Wellness Centre and is available to students, staff and faculty. Training takes 20 minutes and participants will be issued a certificate that they may share with anyone they report into to validate their participation."
year_published = 2025
