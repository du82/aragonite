["https://kpe.utoronto.ca/academics-researchcurrent-studentsgraduate-studies/graduate-seminars-and-development-series"]
title = "Graduate Seminars and Development Series | UofT - Faculty of Kinesiology & Physical Education"
description = "Graduate Seminar Series Graduate Professional Development WorkshopsThe Graduate Department of Kinesiology offers monthly graduate seminars featuring speakers from across U of T and Canada. Speakers present on a broad variety of topics. Please note that dates and topics are subject to change. Both the Graduate Seminar Series and Graduate Professional Development Workshops count towards SRM3335H and SDM4445H."
full_description = "Graduate Seminar Series Graduate Professional Development WorkshopsThe Graduate Department of Kinesiology offers monthly graduate seminars featuring speakers from across U of T and Canada. Speakers present on a broad variety of topics. Please note that dates and topics are subject to change. Both the Graduate Seminar Series and Graduate Professional Development Workshops count towards SRM3335H and SDM4445H. For more information regarding Graduate Seminars and what to do if a session is missed, please see the KIN Graduate Handbook. A formal announcement will be sent out via email the week of the seminar.Graduate Professional Development WorkshopsThe Graduate Department of Kinesiology holds a series of workshops designed to support MA, MSc and PhD students during their program.Past topics have included:Grant and Scholarship ApplicationsManaging Projects, Committees, and TimelinesEthical Considerations in (Graduate Student) ResearchWriting for your ThesisEffective Conference/Classroom PresentationsAnti-Racism WorkshopGraduate Student Elevator SpeechesOpen Access and Knowledge MobilizationPlease note: Sessions will run from 10 a.m.- 12 p.m. on Fridays in BN 307. Attendance at the graduate seminar course is required for students in the first two years of their program; please ensure that you have scheduled your other commitments to accommodate this course/program requirement.Academic Success WorkshopsThe Graduate Department of Kinesiology will be offering a variety of Academic Success Workshops throughout the 2024-2025 academic year facilitated by Liam O'Leary, Learning Strategist and Special Guests. These session require registration prior to the workshop. Please watch out for workshop announcements from the KPE Graduate office email. Graduate Seminar Series & Professional Development Workshops 2024-2025September 2024 Friday September 13: Professional Development: Writing Successful Scholarship Applications (session will be followed by tour of research labs organized by Research Services Office)October 2024 Friday, October 4: Faculty Members - 5min PresentationsFriday, October 11: Professional Development - Research Ethics & Academic IntegrityFriday, October 25: Research Presentation - Dr. Kyle Rich, Brock University – Centre for Sport Policy StudiesNovember 2024 Friday, November 8: Research Presentation – Dr. Juan Pons Bauza, University of the Balearic Islands, SpainFriday, November 22: Research Presentation - Centre for Sport-Related Concussion Research, Innovation and Knowledge December 2024Friday, December 6: Professional Development: Technology in Kinesiology ResearchJanuary 2025Friday, January 10: Research Presentation - Dr. Stuart Wilson, Queen's UniversityFriday, January 24: Professional Development: Publishing and the Peer Review ProcessFebruary 2025Friday, February 7: Research Presentation - Mental Health and Physical Activity Research CentreTitle: From Investigation to Impact: The Research Evolution in Mental Health and Physical ActivitySpeakers: Catherine Sabiston, Melissa deJonge, Michael JorgensenFriday, February 28: Research Presentation - Dr. Rebecca Bassett Gunter, York UniversityMarch 2025Friday, March 7: Professional Development: Conducting Systematic and Scoping ReviewsSpeaker: Erica NekolaichukMake-up SessionFriday, March 14: Research Presentation - Professor Ching-Lin Wu, National Chung Hsing University, TaiwanApril 2025Friday, April 25: Professional Development: Careers Within and Beyond AcademiaSpeaker: Daniel Santa Mina - Daniel Santa MinaAcademic Success Workshops 2024-2025March 2025Juggling PrioritiesDate and Time: Monday, March 31, 2025 from 2 - 3 p.m.Location: WS2007Facilitators: Liam O'Leary, KPE Learning StrategistWho should attend? All KPE graduate studentsRegister HereApril 2025Preparing for the Comprehensive ExamDate and Time: Monday, April 28, 2025 from 2 - 3:30 p.m.Location: WS2007Facilitators: Liam O'Leary, KPE Learning Strategist and Taleah Clarke, KPE Graduate Program CoordinatorWho should attend? Doctoral students who have not yet completed their comprehensive requirementsRegister HereWriting Groups 2024-2025Inked: the HS Writing CollectiveInked: the HS Writing Collective is a graduate writing group hosted and organized by the Health Sciences Writing Centre. Inked supports three weekly, in-person/hybrid graduate writing sessions during the academic year. Sessions begin in September, but you are welcome to join at any time during the year.Inked offers a collaborative and distraction-free environment where you can work on your current writing projects, presentations, and/or teaching. Sessions are structured with frequent opportunities for breaks and one-on-one writing support. Most importantly, the sessions allow you to focus on your work with built-in accountability and social support for writing with others. Coffee and snacks are provided.If you are interested in joining one of our sessions, please email Michael Cournoyea, Asst. Professor, Teaching Stream, HSWC."
