["https://kpe.utoronto.ca/aboutstudent-outreach/moveu"]
title = "MoveU | UofT - Faculty of Kinesiology & Physical Education"
description = "MoveU is a tri-campus initiative at the University of Toronto with teams on the St. George, Scarborough and Mississauga campuses. At MoveU, our goal is to encourage physical activity and promote a healthy active lifestyle while allowing students to explore their environment and interact with their peers. MoveU teams on St. George, Scarborough and Mississauga campuses hold special events, give away fitness focused swag and can point you in the right direction to the find the class or activity that’s best for you."
full_description = '''MoveU is a tri-campus initiative at the University of Toronto with teams on the St. George, Scarborough and Mississauga campuses. At MoveU, our goal is to encourage physical activity and promote a healthy active lifestyle while allowing students to explore their environment and interact with their peers. MoveU teams on St. George, Scarborough and Mississauga campuses hold special events, give away fitness focused swag and can point you in the right direction to the find the class or activity that’s best for you. Services Want to add some physically active fun to your event? MoveU has an amazing crew ready to improve your students' experience! Fill out the MoveU request form to book MoveU for your next campus event. MoveU has an amazing crew standing by to help you incorporate some fun and physical activity into your events! Programs Move with Us Move with us is a new 6-week program for women which introduces students to our physical activity spaces at Sport & Rec! We'll take you on tour of our facilities and physical activity spaces, pair you up with a new work-out buddy for the duration of the session to work-out and explore the space with, and give participant's the oppotunity to try out some of our other programs, like drop-in sports and group fitness classes! Participants who attend at least six sessions during a program period will receive a "Welcome to Sport & Rec" prize sponsored by Under Armour! Find out more at moveu.ca/movewithus! MoveU.HappyU Looking to reduce symptoms of stress, depression and anxiety? MoveU.HappyU is the program for you! This free 6 week program offers behaviour change coaching and exercise training to students for mental health support. Events and Activities MoveU Skate Series Join us for an evening of skating! We’ve got free hot chocolate, skate rentals, and a killer playlist - what more could you ask for? Adaptive skating equipment is available! If you require adaptive skate equipment, or have any other accessibility needs, please email sportandrec@utoronto.ca. To find our next skate night and get information on more fun events and activities, follow us on instagram @moveuoft or check out our website at moveu.ca. Questions? Reach us at moveucrew@utoronto.ca. Sport & Rec Facility Tours Want to get to know our spaces a bit better? We'll take you on a tour of our facilities and tell you all about the programs we offer. Mobile MoveU Add some physical activity to your event or workshop! We'll connect you with our partners at Sport & Rec or Hart House to host a physical activity class for your group! Choose from a variety of different activities, including dance (Zumba, Cardio Dance Party, Bollywood X, Barre, and K-pop), strength training (e.g. Big HIIT), mindfulness and yoga. MoveU Anywhere No matter where you are, we hope you’re staying safe and getting some daily physical activity! Need inspiration for your movement breaks? Check out MoveU Anywhere, our series of practical workout videos that you can do in your own spaces, no matter how small. MoveU Outreach Booths Having an event? We'd love to come! We'll set up an information booth to promote physical activity programming, events and activities on campus brought to you by MoveU and our partners at Sport & Rec, Hart House, and Diversity Moves Us. Movement Break Videos Incorporate a MoveU Movement Break video into your classes or workshops to reactivate the mind and body. These 3-minute videos encourage students to take a break from sitting and get active to re-energize. Students who participate in movement breaks are better able to focus and primed for academic success! Can't find what you're looking for? Contact the MoveU crew at moveucrew@utoronto.ca and we'll work with you to create a unique experience for you and a group of friends/your student group! To learn more about MoveU's programs and services, please visit moveu.ca'''
year_published = 2025
