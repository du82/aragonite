["https://kpe.utoronto.ca/aboutstudent-outreachdiversity-equity/move-culture-series"]
title = "Move with Culture Series | UofT - Faculty of Kinesiology & Physical Education"
description = "READ THE LATEST UPDATE ON OUR HEALTH & SAFETY MEASURESLearn about our Move with Culture Series!Sport & Rec's EDIB team, Diversity Moves Us, hosts a series of workshops throughout the year to offer students a positive and safer space to learn and participate in culturally relevant physical activity. All workshops are open to all students excited to learn and participate.Check out our upcoming and previous events below."
full_description = "READ THE LATEST UPDATE ON OUR HEALTH & SAFETY MEASURESLearn about our Move with Culture Series!Sport & Rec's EDIB team, Diversity Moves Us, hosts a series of workshops throughout the year to offer students a positive and safer space to learn and participate in culturally relevant physical activity. All workshops are open to all students excited to learn and participate.Check out our upcoming and previous events below.Upcoming EventsMark your Calendars and Join Us!Move with Culture: Métis Jigging Date: February 27, 4:30 - 6 p.m.Location: Goldring Fitness StudioJoin Alicia Blore (Métis Strings) and Megan Southwell (Toronto Métis Jiggers) in Métis jigging! Métis jigging is an upbeat and energetic style of dance that fuses First Nations footwork and rhythm with European step dancing. It is a socially centred style of dance done to Métis fiddle music and proudly shared by Métis communities across the Homelands. Come dance Red River jigging, partner dancing, and social (group) dancing all to Alicia’s vibrant live fiddle music!Learn more about Metis JiggingPrevious EventsMissed it? Don't worry, they'll be back soon!Move with Culture: Kizomba Date: Thursday, November 21, 4:30-6:30 p.m.Location: Goldring Fitness StudioDiscover the magic of Kizomba in our workshop, designed to introduce you to this captivating dance. We'll start with a brief exploration of the history of Kizomba, giving you insight into its roots and cultural significance. Then, we'll dive into the basics, teaching you the essential hold and a few foundational steps. No prior dance experience or knowledge is required—just bring your enthusiasm and a willingness to learn! This workshop is perfect for anyone curious about Kizomba or looking to explore a new way to connect with others on the dance floor. Move with Culture: Pow-wow Hip Hop Date: Wednesday, September 28, 4:30-6:30 p.m.Location: Goldring Fitness StudioHart House Hip Hop Education and Move with Culture present a cultural mash-up centering on the foundations of traditional Pow Wow dancing. The workshop will empower, educate and engage participants in movement and culture by incorporating various techniques from all styles of Pow Wow dance set to the beats of hip-hop music. Gain a greater appreciation for Indigenous cultures, learn about their ceremonies and traditions with this unique delivery of Pow Wow dance.Instructor Nichole Leveck is a Wyandot artist from Toronto. She has been a fancy shawl and jingle dress dancer for more than 13 years and has been teaching for more than eleven years at various organizations throughout the Greater Toronto Area. She's been featured dancing in music videos and performed at the 2019 Polaris Music Prize Gala. Nichole strives to be a positive role model within the Indigenous community of Toronto.Move with Culture: CapoeiraDate: Wednesday, January 25, 4-6 p.m.Location: Goldring Fitness StudioThis beginner friendly Capoeira workshop combines martial arts, dance, rhythm and culture!In the 16th century, African slaves in Brazil disguised Capoeira as a dance in order to hide combat and self-defence training among the slave population. Contra Mestre Falcao - Kirk McFarlane will introduce you to this traditional Afro-Brazilian movement, and challenge your body in new ways - focusing on strength, coordination, flexibly and endurance.Move with Culture: Afro-Caribbean Dance Date: Thursday, October 24, 4-5:30 p.m.Location: Goldring Fitness StudioDance to the music of the Caribbean culture in this fun and energetic dance class! Learn fundamental Caribbean dance movements as well as a dance routine. This class is perfect for beginner to advance learners."
