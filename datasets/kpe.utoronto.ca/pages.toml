["https://kpe.utoronto.ca/academics-researchconferences-seminars-symposia/bodies-knowledge"]
title = "Bodies of Knowledge | UofT - Faculty of Kinesiology & Physical Education"
description = "The University of Toronto’s Kinesiology and Physical Education Graduate Society (KPEGS) will hold its annual Bodies of Knowledge (BOK): Moving Research Forward conference on May 10, 2024."
full_description = "The University of Toronto’s Kinesiology and Physical Education Graduate Society (KPEGS) will hold its annual Bodies of Knowledge (BOK): Moving Research Forward conference on May 10, 2024.About the ConferenceBoK is a conference run by graduate students, for graduate students, covering a broad spectrum of inter and multi-disciplinary issues related to health, sport, and physical activity. All subject areas are encouraged to submit an abstract. BoK’s purpose is to help trainees develop their research aptitude, presentation skills, and build a network through a program that gives them time to talk and have discussions about their work. To accomplish this objective and foster reflexive awareness, the conference features keynote speakers and student panelists specializing in knowledge translation and implementation sciences.Who Should Attend?The 2024 BoK conference is open to all graduate and undergraduate students (research and professional) and researchers. Programmers, policymakers and others are also encouraged to attend.The cost to register and submit an abstract is FREE thanks to the gracious support of the Faculty of Kinesiology & Physical Education and the U of T KPE Graduate Society. You do not need to submit an abstract to attend - please submit a registration form if you plan to attend and support your colleagues. Conference Programme2024 BoK Conference ProgrammeGet in TouchFor more information and to register, please visit the 2024 Bodies of Knowledge Conference website.Questions? Looking to get involved?Please e-mail BOK Coordinators: Email Jonathan AguileraEmail Sinan Osman"
