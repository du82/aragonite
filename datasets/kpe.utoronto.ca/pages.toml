["https://kpe.utoronto.ca/about/sponsorship-policies-guidelines"]
title = "Sponsorship Policies & Guidelines | UofT - Faculty of Kinesiology & Physical Education"
description = "Sponsorship Policies & Guidelines  The Faculty of Kinesiology and Physical Education has sponsorship policies in place which reflect the University of Toronto and the Faculty’s mission and principles. Below are the policies and guidelines for companies and organizations interested in participating as a sponsor with the Faculty."
full_description = "Sponsorship Policies & Guidelines The Faculty of Kinesiology and Physical Education has sponsorship policies in place which reflect the University of Toronto and the Faculty’s mission and principles. Below are the policies and guidelines for companies and organizations interested in participating as a sponsor with the Faculty. Sponsorship Policy The following policies reflect the principles that shape the Faculty’s relationship with sponsors. These policies confirm the commitment of the University of Toronto to programs of the highest caliber, and to continue sponsorship partnerships with the private sector within a framework defined by the University’s academic mission and its fundamental values. In addition to this document, the Faculty will adhere to all applicable University of Toronto Sponsorship policies. The Faculty values and will protect its integrity, autonomy and academic freedom and will not enter into sponsorships that would compromise these fundamental principles. The Faculty’s solicitation of sponsorship is informed and consistent with academic priorities established by Faculty Council and the appropriate University processes. The Faculty will endeavor to establish partnerships with corporations that have established codes of conduct that uphold the values of the University. The revenue generated by sponsorship will be used to advance the Faculty’s mission, by way of identified academic and co-curricular priorities. The Faculty will not solicit or contract for sponsorships or advertising partnerships with companies whose principal or majority interest is the production, marketing or sale of tobacco products, cannabis products or products related to the acts of smoking or vaporizing. Any sponsorships with alcoholic beverage companies (including but not limited to breweries, wineries, and spirits manufacturers) are subject to the following conditions: No lifestyle advertising will be involved in alcohol sponsorship communications. Alcoholic beverage company branding will not be predominant in communications. Communications featuring the alcoholic beverage company will relate to the Faculty program or event that the sponsorship is attributed to. Alcoholic beverage brand support should not make up more than a minor share (25%) of the total corporate sponsorship revenue of the Faculty and its programs. The Faculty will not solicit or accept sponsorship promoting a substance or procedure the use of which would likely be viewed as doping by the World Anti-Doping Association or the CCES. Any proposals from companies promoting natural health products (NHPs) will be reviewed by the Dean of the Faculty and the Medical Director of the Sport Medicine Clinic before being considered for sponsorship of the Faculty or events associated with the Faculty. All digital signage advertising will conform to the Faculty’s Sponsorship Policy. The Director of Communications or designate must approve all artwork prior to its posting and may refuse any advertising messages deemed to be contrary to the Faculty’s mission. Groups within the Faculty may request promotional space for Faculty-related programming from the Communications Office. If the activity to be promoted relates directly to the Faculty and the artwork is accepted for posting, there will be no charge. On occasion, the Faculty may consider campus-wide initiatives relevant to its mandate. University groups and activities not affiliated with the Faculty must purchase advertising space or in kind value at the community rate. Sponsor campaign content must be appropriate for general audiences e.g. film content must be rated PG or lower. Any sponsor campaigns containing imagery of food or beverages must be appropriate for display in facilities promoting physical activity and sport. All rentals of facilities operated by the Faculty of Kinesiology and Physical Education will adhere to this Sponsorship Policy. Rental clients are required to obtain approval for all rental-related sponsors from the Faculty’s Sponsorship and Strategic Partnership Manager prior to the rental date. Academic Event Sponsorship – Best Practice Guidelines The following guidelines reflect the principles that shape the Faculty’s relationship with academic event sponsors. These guidelines confirm the commitment of the University of Toronto to programs of the highest caliber, and work to continue sponsorship partnerships with the private sector within a framework defined by the University’s academic mission and its fundamental values. 1. The Faculty values and will protect its integrity, autonomy and academic freedom and will not enter into sponsorships that would compromise these fundamental principles. Sponsorship and commercial interests must not influence: Identification of learning needs Development of educational and academic objectives Selection of all persons and parties that control the content of and registration for educational and academic activities Selection of educational and academic methods Evaluation of educational and academic activities 2. Events and initiatives that enhance academic programs or the academic experience may be sponsored. 3. Non-peer reviewed conferences and publicly accessible conferences may be sponsored. 4. Hospitality receptions may be sponsored. 5. Sponsors may not advise on or mandate the selection or presentation of content, including speakers at academic events. 6. Commercial displays at academic events should not be influenced by sponsors of the event. Commercial displays and materials should be in a separate room from educational activities. 7. Academic event sponsors may not directly pay for: Event speakers Speakers travel Lodging expenses Meal expenses Hospitality arrangements 8. Sponsors must not mandate utilization of services or products as a condition of support and/or funding. 9. Academic events should have sponsorship from multiple sources. 10. Faculty members with research sponsorship/s from a business or organization, speaking at academic events should disclose in the event communications: The full name of the Faculty member/s The role of the Faculty member/s The name of the commercial entity with which the individual/s has the relationship The nature of the relationship between the individual/s and the commercial entity 11. Event sponsors should be recognized by logo or name only on the following platforms: Event web page Presentation slides Hyperlinks (so long as disclaimers are in place, indicating that the University of Toronto is not responsible for the linked content) Speeches Brochures and booklets Posters"
year_published = 2025
