["https://kpe.utoronto.ca/david-l-macintosh-sport-medicine-clinic"]
title = "David L. MacIntosh Sport Medicine Clinic | UofT - Faculty of Kinesiology & Physical Education"
description = "The David L. MacIntosh Sport Medicine Clinic services are available to U of T students and the general public with a sport or exercise-related injury or inquiry.  Masks are available upon request.  Appointments will be in-person, while some sport physician appointments will be offered virtually at the discretion of the treating physician (within Ontario)."
full_description = "The David L. MacIntosh Sport Medicine Clinic services are available to U of T students and the general public with a sport or exercise-related injury or inquiry. Masks are available upon request. Appointments will be in-person, while some sport physician appointments will be offered virtually at the discretion of the treating physician (within Ontario).To ensure your visit with us is as safe as possible, please review the safety guidelines in place for in-person visits. Patients will be seen by appointment only. Please call 416-978-4678 to book an appointment.Due to construction, the north entrance is closed. Please use the south entrance to access the clinic. The reception is now located in room 418.About UsThe David L. MacIntosh Sport Medicine Clinic has been treating sport-related injuries in the University of Toronto community for over 80 years. Our services are available to anyone with sport or exercise-related injuries or inquiries.A comprehensive sport medicine care facility, the clinic's staff includes certified athletic therapists, sport and manual physiotherapists, sport massage therapists, sport physicians, and an orthopaedic surgeon. Each professional is committed to offering an exceptional quality of care to help you get back in action faster.This is a teaching clinic for our professional staff. You may be seen by an undergraduate or post-graduate student in addition to the supervising clinician.In memory of Dr. David L. MacIntoshThe sport medicine clinic at the University of Toronto is named after Dr. David L. MacIntosh, a pioneer in the orthopaedic surgery. Dr. MacIntosh had a career of over 50 years. He developed several landmark procedures that helped thousands of people with arthritis and injuries to bones and tendons. Dr. MacIntosh began to work with young athletes in the 1950's at Hart House. He was team physician for the varsity football and hockey teams for 25 years. As a teaching professor he deeply influenced three generations of medical students and surgical trainees. The clinic was renamed in honour of Dr. MacIntosh in 1990.Donations to the clinic can be made online and through the Faculty's office of Alumni Affairs and Advancement."
year_published = 2025
