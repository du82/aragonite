["https://kpe.utoronto.ca/academics-researchcurrent-studentsundergraduate-studies/bkin-learning-abroad-options"]
title = "BKin Learning Abroad Options | UofT - Faculty of Kinesiology & Physical Education"
description = "Some of the most valuable learning happens beyond our walls, and we encourage all students to take advantage of the many international opportunities available. Dive into an exciting learning adventure! It will enable you to shape how you see and relate to the world."
full_description = "Some of the most valuable learning happens beyond our walls, and we encourage all students to take advantage of the many international opportunities available. Dive into an exciting learning adventure! It will enable you to shape how you see and relate to the world.When can I go?You can do multiple learning abroad opportunities throughout your time at U of T. You can go for as little as a few days to a full-academic year. You can go on exchange to a partner university at any time, but it’s recommended to go in the winter term of the 3rd year. You can also take courses or do research abroad in the summer for a few weeks.Where can I go and what can I study?You will find learning abroad opportunities in over 40 different countries and in various areas of interest. You can also take the opportunity to improve your language skills or explore a new topic.KPE 401 - International development through sportKPE offers a 6-week summer course in Sports for Development including a 2-week field trip in Jamaica. Check out our KPE 401 webpage for more information about the program.course Exchange programsListed below are some popular destinations for exchange, with examples of courses. Exchange programs don’t have program fees and tuition is paid to U of T. A full listing of learning abroad opportunities can be found on the University of Toronto Learning Abroad websiteKU Leuven (Belgium) Founded in 1425, KU Leuven is one of Europe’s most innovative universities and world's top 10 in Sports. Some courses offered in English are below and you can also do a research internship during one or two semesters. Check out a cool video from KU Leuven and find more information about the program on KU Leuven's website. Social Movement SciencesDevelopmental Movement SciencesTraining and Coaching SwimmingPublic Policy and Organization of SportSport Management and MarketingSociocultural Analysis of Sports and LeisureEuropean Sports History Nanyang Technological University (Singapore) Experience the interdisciplinary and innovative approach of the Sport Science & Management program in a beautiful and green campus. Visit NTU's website for more information.Fundamentals of Sport InjuriesPhysical Activity and Leisure for Special PopulationsEnvironmental Exercise PhysiologySport Nutrition Sport Marketing and SponsorshipSeminars in Current Issues of SportManagement of Sport OrganizationsSport Technology Innovation and EntrepreneurshipSport and Culture in Singapore: A Sociological PerspectiveSport in Society University College, Dublin (Ireland) Broaden your knowledge of the management and delivery of international sport, fitness and exercise in Ireland’s global and largest University. Check out UCD's website to learn more about their programs. Illness and Injury in SportOptimization of Human PerformanceExercise in the Life SpanNutrition for Health and Exercise Financial Management of SportSports ManagementInformation TechnologySports MarketingEconomics of SportDigital Sports Marketing University of Birmingham (England) Experience a science-based program and state-of-art Sport, Exercise and Rehabilitation Sciences facilities. For more information, visit the School's website.Exercise MetabolismSports NutritionMotor Control in SportsHuman Cardiovascular & Respiratory Control in ExerciseEnvironmental PhysiologySport Psychophysiology University of Edinburgh (Scotland) Study in one of the world’s top 20 universities and in the historic heart of Edinburgh. Check out the School of Education and Sport website to learn more about their course offerings.Motor ControlSports NutritionEnvironmental PhysiologyExercise Prescription for RehabilitationChildren’s Health and WellbeingPhysical Education PerspectivesManaging the Coaching Process​​​​​​Sports DevelopmentSport, Media and SocietySports and Recreation: Operations ManagementUnderstanding Physical Culture: Philosophical and Sociological Perspectives University of Otago (New Zealand) Explore and study in Dunedin, a city with vibrant student life surrounded by stunning scenery. Visit Otago's website to learn more about their sport and exercise sciences programs.Performance AnalysisSkill Acquisition across the LifespanAthletic Conditioning and RehabilitationCoaching, Leadership and MentoringActive Living and EnvironmentExercise for Clinical PopulationsSport and Health PolicySport Development and ManagementSport MediaSport Technology University of Queensland (Australia) Ranked 3rd in the world, the School of Human Movement and Nutrition Sciences is located in the beautiful St. Lucia campus. Check out the School's website for more information.Motor Control & LearningHealth & Fitness through Diet & ExerciseTeaching Games and SportSupportive Learning EnvironmentsLiteracy and Numeracy in Health and Physical EducationYouth, Sport and Physical CultureThe Olympic Movement & SocietySports Leadership in Diverse CommunitiesSport and Physical Activity in Society: Historical to Contemporary PerspectivesHistory of Sport and Physical Activity in Australian Society Loughborough University (England) Rated the best university in the world for sports-related subjects for the sixth year running (QS World University Rankings by Subject 2017, 2018, 2019, 2020, 2021 and 2022). Notable sporting personalities that have passed through Loughborough include world-record breaking athletes such as Sebastian Coe and Paula Radcliffe, as well as World Cup-winning England rugby coach Clive Woodward. Check out Loughborough University's website to learn more about their programs. Critical Perspectives in Sport Management Coaching Process and Practice Sport, Diversity and Social Justice Body Composition and Physiological Measurement Human Performance at Environmental Extremes Current Themes in Sport and Exercise Psychology Applied Psychology in Competitive Sport Psychology for Physical Educators summer research Exchange programsYou can get hands-on research experience abroad and receive 1.0 FCE. Research placements are full-time and last between 8 and 12 weeks. You pay tuition to U of T (no program fees) and there is $ 3,000 in funding. On top of that, you can also apply for needs-based funding (IE Awards) and the Globalink Research Awards.University of Toronto Summer AbroadThe Summer Abroad is a fee-paying program that offers U of T students the chance to complete a full-year Arts & Science credit overseas in 4-6 weeks. For more information, please visit the University of Toronto Summer Abroad website.Can I get credits?You can transfer credits back to U of T as KPE or elective courses. The course equivalency will be pre-assessed after you discuss your study plan with a KPE advisor. Make sure you start this process as early as possible for a well-designed study abroad plan and successful credit transfer.Can I get funding?There are several funding opportunities available. If you're going on an exchange program, you can apply for needs-based funding – IE Awards from the Centre for International Experience. You may also be eligible for IE Awards+ if going on any activity organized by U of T (e.g. faculty-led program, research placement, Summer Abroad program). Summer research exchange programs offer $ 3,000 in funding and there is also the Globalinks Research Award (GRA). You can find more information on funding at the Learning Abroad website.How and when do I apply?CIE Exchange programs You will need to submit your resume and transcript, and answer some questions on your motivation to go abroad. Applications are done through CIE Exchange Portal and you will find more information about the process on the Exchange webpage. We also recommend doing a study plan with the courses you intend to take. Make sure you discuss this with your advisor at KPE for pre-assessment.Application deadlines:Application deadlines for 2024-25 are to be confirmed. Summer Abroad Programs Applications are done through the Summer Abroad Portal and run from December to February. There is a $200 application fee and bursaries and awards are available to partially cover the program costs. For more information on the application process and deadline, please visit the Summer Abroad website. Why learning abroad?With businesses, economies and communities interconnected, an international experience will put you on top of your game. As you learn to navigate and live out of your comfort zone, this invaluable experience will boost your academic profile and provide a professional advantage by giving your resume an international edge. Become a global citizen while gaining hands-on experience in your field. You will be exposed to different cultures, backgrounds, and forms of teaching by studying alongside an international community of students and professors. You’ll learn to bridge cultural divides while honing your ability to adapt, connect and work with individuals and groups from around the world. Not only will you gain global experience, but you will also acquire a global perspective.Connect with usEarly planning is required for a successful learning abroad experience. Email the KPE International Exchange office."
