["https://kpe.utoronto.ca/academics-researchcurrent-studentsundergraduate-studies/bkin-research"]
title = "BKin Research | UofT - Faculty of Kinesiology & Physical Education"
description = "BKIN Research Courses: KPE390Y/490Y/495HBKin Research will put you on the leading edge of advancements in the field of Kinesiology and Physical Education. Available for upper year students, you have the opportunity to learn about the research process and conduct a research study. Collaborate on defining the research question, collecting and analyzing data, and interpreting the findings. Applications are now open for KPE495!What can you expect from BKin Research?"
full_description = "BKIN Research Courses: KPE390Y/490Y/495HBKin Research will put you on the leading edge of advancements in the field of Kinesiology and Physical Education. Available for upper year students, you have the opportunity to learn about the research process and conduct a research study. Collaborate on defining the research question, collecting and analyzing data, and interpreting the findings. Applications are now open for KPE495!What can you expect from BKin Research?Work alongside a professor, gaining hands-on experience conducting researchChallenge assumptions; test new ideasDevelop critical reading and academic writing skillsLearn research processes and methodologiesConduct data collection and analysesPresent research findings at the Annual Bertha Rosenstadt National Undergraduate Research ConferenceCourse RegistrationStudents are advised to contact potential faculty advisors as soon as possible as each faculty member can accept only a limited number of students.​​​​The application process consists of completing an online form with two steps - prerequisite and advisor-student agreement forms. Students are not able to enrol themselves in these courses on ACORN, but will be added to the course by Registrar’s Office staff once the enrolment forms are received and approved. Please contact us at undergrad.kpe@utoronto.ca if you have any questions about the application process.DeadlinesFull-year courses (Y courses, 2024-2025): was Monday, August 19, 2024Winter course (S course, 2025W): Monday, November 25, 2024TCPS-2 Core Tutorial: Monday, September 30, 2024Conference Abstract: Monday, March 03, 2025Conference: Friday, March 28, 2025Final Paper: Friday, April 24, 2025Template application forms for your reference: Prerequisite form Advisor-Student Agreement Form Complete the online application form for BKin Research courses now"
