["https://kpe.utoronto.ca/aboutworking-kpestaff-training/first-aid-and-cpr-training"]
title = "First Aid and CPR Training | UofT - Faculty of Kinesiology & Physical Education"
description = "Airway Management (Pool Staff only) This five-hour Lifesaving Society advanced first aid module will teach participants about barrier devices, oropharangeal airways, VVAC suctioning, and oxygen delivery.Prerequisites: a current Red Cross, Lifesaving Society or St. John Ambulance Standard First Aid certificate. A photocopy must be brought to the course.Requirement: for Lifeguard and Pool Supervisor positions."
full_description = "Airway Management (Pool Staff only) This five-hour Lifesaving Society advanced first aid module will teach participants about barrier devices, oropharangeal airways, VVAC suctioning, and oxygen delivery.Prerequisites: a current Red Cross, Lifesaving Society or St. John Ambulance Standard First Aid certificate. A photocopy must be brought to the course.Requirement: for Lifeguard and Pool Supervisor positions. CPR - Basic Rescuer Re-certification This is a re-certification course in Basic Rescuer CPR (Level C).Prerequisites: a Red Cross, Lifesaving Society, St. John Ambulance or Heart and Stroke Foundation Basic Rescuer CPR (Level C). A photocopy must be brought to the course.Requirement: for all designated first aiders. Standard First Aid and CPR Re-certification This course is a re-certification of Standard First Aid, a legislated requirement for designated first aiders. A full course must be taken every other re-certification (every 6 years). 1-day re-certs may be taken between. Re-certification must occur within the same governing body. We offer Red Cross and Lifesaving Society re-certifications.Prerequisites: a Red Cross, Lifesaving Society, St. John Ambulance SFA where a full course was last taken.Requirement: for all designated first aiders. For course dates and times, visit recreation.utoronto.ca. Current KPE Staff qualify for reduced rates / reimbursement for first aid and CPR."
