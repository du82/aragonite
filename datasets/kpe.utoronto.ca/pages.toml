["https://kpe.utoronto.ca/child-youth-programs"]
title = "Child & Youth Programs | UofT - Faculty of Kinesiology & Physical Education"
description = "Learn about Child & Youth Programs at Sport & Rec!Introduce your child to the experience of U of T through our Sport & Rec programs for children and youth. Research shows that kids who have fun while participating in physical activity are more likely to stay active and healthy for life! Leverage our world-class facilities and expert staff to bring movement, physical literacy, and an active lifestyle to your children all year round."
full_description = 'Learn about Child & Youth Programs at Sport & Rec!Introduce your child to the experience of U of T through our Sport & Rec programs for children and youth. Research shows that kids who have fun while participating in physical activity are more likely to stay active and healthy for life! Leverage our world-class facilities and expert staff to bring movement, physical literacy, and an active lifestyle to your children all year round.Child and Youth Programming Overview:Camp U of TWith a variety of camp programs available for children aged 4 to 16, Camp U of T offers a broad range of experiences and opportunities to try new things, make new friends, and learn new ways to enjoy sport, recreation, and play.Learn more about Camp U of TJunior BluesU of T Junior Blues offers a variety of classes on land, in water, and on ice designed to teach children and youth the physical literacy skills they need to be active and healthy for life. Learn more about Junior BluesHigh-Performance AcademiesDesigned by the Varsity Blues head coaches at the University of Toronto, the High-Performance Academy provides talented young athletes with a uniquely integrated approach to sports development.Learn more about High-Performance AcademiesQuestions?Contact us at 416-978-3436 and press "1" to speak with a customer experience representative or email the Sport & Rec team. To contact the Child & Youth program teams, email the Junior Blues team or email the Camp U of T team.'
