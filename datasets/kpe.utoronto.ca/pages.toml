["https://kpe.utoronto.ca/accessibility"]
title = "Accessibility | UofT - Faculty of Kinesiology & Physical Education"
description = "Our CommitmentIt is the University of Toronto’s goal to create a community that is inclusive of all persons and treats all members of the community in an equitable manner. In creating such a community, the University aims to foster a climate of understanding and mutual respect for the dignity and worth of all persons.In working toward this goal, the Faculty of Kinesiology and Physical Education will strive to advance our culture, programs, operations and spaces to enable accessibility, reconciliation, equity, inclusivity, belonging and fulfillment."
full_description = "Our CommitmentIt is the University of Toronto’s goal to create a community that is inclusive of all persons and treats all members of the community in an equitable manner. In creating such a community, the University aims to foster a climate of understanding and mutual respect for the dignity and worth of all persons.In working toward this goal, the Faculty of Kinesiology and Physical Education will strive to advance our culture, programs, operations and spaces to enable accessibility, reconciliation, equity, inclusivity, belonging and fulfillment.For more information, please review the University's Statement of Commitment Regarding Persons with Disabilities.Questions?For questions and feedback about the accessibility of content on www.kpe.utoronto.ca, including alternate-format requests, please contact us by email at comm.kpe@utoronto.ca – we welcome your feedback at any time.General questions or concerns related to the Accessibility for Ontarians with Disabilities Act can be directed to the University of Toronto's Accessibility for Ontarians with Disabilities Act (AODA) Office. Accommodation RequestsAcademicCase-by-case accommodations are provided for students enrolled in academic programs at the Faculty of Kinesiology & Physical Education through regular support and accommodation processes, including for students with a disability.All accommodation requests must be submitted to the Faculty's Office of the Registrar and Student Services. Please email undergrad.kpe@utoronto.ca (undergraduate students) or grad.kpe@utoronto.ca (graduate students) to discuss your accessibility needs. Students registered with Accessibility Services should continue to contact Accessibility Services to receive accommodations and supports.Sport & Recreation ProgramsFor individuals attending sport and recreation programs offered by the Faculty of Kinesiology & Physical Education, please take a few moments to fill out our Accommodation Request Form. The questions primarily ask about activities and facilities you are interested in. Alternatively, you may contact our Accommodations Facilitator by email at matt.srutwa@utoronto.ca or by phone at 416-978-3436. We will reach out to you shortly and set up an initial meeting and review the questions on the form. Building AccessWarren Stevens Building (Athletic Centre)There are two accessible entrances to the Warren Stevens Building, also known as the Athletic Centre. Powered, glass doors are approached by a level pathway. The entrances face north. An additional accessible entrance with powered, glass doors entrance is located off of Classic Avenue, approached by a level pathway. The entrance is located under a concrete awning, facing south, and can be found opposite an accessible parking spot.Clara Benson BuildingThere is an accessible entrance to the Clara Benson Building on Huron Street. A powered, glass door is approached by a level pathway. The entrance faces east.However, access to the second floor is through an elevator located at the end of a corridor that connects the Clara Benson building to the Warren Stevens building. The third floor can currently only be reached by stairs.The Faculty is currently renovating the Clara Benson Building to increase accessibility by adding an elevator and making layout changes to ensure all floors and spaces are fully accessible.Goldring Centre for High Performance SportThere is an accessible main entrance to the Goldring Centre for High Performance Sport. A powered, glass door is approached by a level pathway on the south end of the building. This entrance faces east.An additional accessible entrance is located at the north end of the building. However, this entrance is currently not available due to construction work.Another entrance with a powered glass door is available at the rear of the building, approached via a pathway between Woodsworth College and the Goldring Centre for High Performance Sport. The pathway can be accessed from St. George Street. Varsity CentreThere is an accessible main entrance located in the Varsity Pavilion. A powered glass door is approachable by a low-slope covered pathway from Devonshire. The entrance faces west and is recognizable from the street by the modern colonnade leading to the doorway.An additional entrance is located on the north end of the Varsity Centre. A powered door is approached by level sidewalk. The entrance faces north and is clearly visible from the Bloor street. It is adjacent to the Varsity box office."
year_published = 2025
