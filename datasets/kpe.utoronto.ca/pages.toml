["https://kpe.utoronto.ca/academics-researchcurrent-studentsundergraduate-studies/minor-global-leadership"]
title = "Minor in Global Leadership | UofT - Faculty of Kinesiology & Physical Education"
description = "Applications are NOW open - apply before May 31, 2025, at 11:59 p.m. ET"
full_description = "Applications are NOW open - apply before May 31, 2025, at 11:59 p.m. ETNow, more than ever, the world needs principled, inclusive, and empathetic global leaders. The Minor in Global Leadership is U of T’s first tri-campus, interdivisional, multidisciplinary undergraduate community of diverse and globally agile, problem solvers and launched in September 2023. It will leverage the strengths of the University of Toronto’s three campuses, the diversity of the student body, experiential learning, and opportunities for global engagement, both locally and abroad.Check out the Global Experiences website for more information about the courses, mode of program delivery and learning outcomes for the Minor in Global Leadership.Eligibility and How to ApplyEnrolment RequirementsThe Minor in Global Leadership encourages a diverse pool of applicants and strongly welcomes applications from Indigenous Peoples, Black and racialized persons, women, persons with disabilities, people of diverse sexual orientations and gender identities, people from varying faith groups, and/or students who are economically disadvantaged or first in their family to attend university.The program is open to all U of T undergraduate students who: First-year undergraduate KPE students who have completed a minimum of 4.0 FCEs or, Second-year undergraduate KPE students who have completed a minimum of 8.0 FCEs, Has a minimum average GPA of 2.7 across an applicant's best 3.0 completed credits, and Has a minimum of 4 semesters of study remaining to complete core requirements and all necessary electives Previous leadership experience is not a requirement. There are many ways to understand leadership and gain experience as a part of this program.Applicants are encouraged to have:An interest in the study of leadership, global and cultural perspectivesA willingness to engage with students from diverse backgrounds, experiences, and disciplines of study Enrolment Period Apply from February 1 - May 31, 2025, at 11:59 pm ETCheck results between June 21 - July 20, 2025.Enrol by August 10, 2025. How to Apply Step 1: Submit a request on ACORNLog on to ACORNSelect Academics – Enrol & Manage – ProgramSelect “Add a Program”Enter the Program code: PEMINGLOBConfirm your requestIf the status next to the program code changes to “REQUESTED – you have applied for admission to this Program”, you have successfully completed Step 1.Step 2: Provide supplemental informationSubmit your supplementary application by May 31, 2025 at 11:59 pm ET. The supplementary application is available here.Step 3: Check results of your requests to see if you have been invited to enrol in the Minor in Global LeadershipBeginning on the “Check Results” date listed above, log on to ACORNSelect Academics – Enrol & Manage – Program.A list of your programs will appear.Check the status next to your program. If the status is:INVITED – You have been offered admission to this program and you can move onto the next stepREFUSED – You have been denied admission into this programREQUESTED – Check back again. Your program request is being processed by the department.Step 4: Accept the invitation to enrol in the Minor in Global LeadershipIf you have been INVITED, you can accept or decline the invitation in ACORN by August 15, 2025. If the status next to the program code changes to ACTIVE, you are enrolled in this program, and you have successfully completed all the steps to enrol. Course RequirementsStudents in the Minor in Global Leadership will complete 3 core global leadership courses in sequence, plus elective courses within each participating division:GLB201H5 (0.5 FCE) Global Leadership: Past, Present, Futures: YEAR 2GLBC0H3 (0.5 FCE) Global Leadership: Theory, Research, and Practice: YEAR 3GLB401Y1 (1.0 FCE) Global Leadership: Capstone Project: YEAR 4Divisional course electives (2.0 FCE): YEAR 2-4WHICH DIVISIONAL COURSE ELECTIVES CAN I COMPLETE?KPE 300 Physical Culture and Social InequalityKPE 302 Media, Health and Exercise SciencesKPE 305 Geographies and Environments of Health and Physical CulturesKPE 307 Olympic and Paralympic StudiesKPE 321 Population HealthKPE 335 Sports LawKPE 355* Interpersonal Theory in Kinesiology & Physical EducationKPE 401 International Development Through SportKPE 403 Gender/s, Sexualities and SportKPE 404 Illness, Disease and Physical CultureKPE 405 Race, Indigeneity and Physical CultureKPE 406 Sport in Popular CultureKPE 408 Sport and the “War on Terror”KPE 409 Sport, Physical Activity and Human RightsKPE 455* Kinesiology & Physical Education in SocietyKPE 495* Independent Study* Courses with an asterisk have varying topics and will only count towards the Global Leadership Minor if the focus of study/in-field experience is on an international, global or Indigenous topic. CAN I COUNT THE ELECTIVE COURSES TOWARDS BOTH THE MINOR IN GLOBAL LEADERSHIP AND THE CERTIFICATE IN GLOBAL KINESIOLOGY & PHYSICAL EDUCATION?No. Elective courses used for the Minor in Global Leadership cannot also be used toward the Certificate in Global Kinesiology & Physical Education."
