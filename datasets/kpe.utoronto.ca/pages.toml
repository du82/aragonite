["https://kpe.utoronto.ca/academics-researchcurrent-studentsgraduate-studies/graduate-forms"]
title = "Graduate Forms | UofT - Faculty of Kinesiology & Physical Education"
description = "Supervisory Committee Forms:"
full_description = "Supervisory Committee Forms: Supervisory Committee Form This form should be brought to your first supervisory committee meeting. On this form you will list the names of all members of your supervisory committee along with their email addresses. Once the form is complete, return it to the graduate office at grad.kpe@utoronto.ca.Annual Supervisory Committee Meeting FormThis form should be brought to your yearly supervisory committee meeting. All fields on this form must be completed and it is recommended that student’s keep a copy for their records. Once the form is complete, return it to the graduate office at grad.kpe@utoronto.ca.Course Enrolment Forms: Add/Drop Course Form Use this form for those courses external to the Graduate Department of Kinesiology for which you cannot enroll using ROSI. Permission to enrol is required from your home department as well as the instructor offering the course. This form can also be used to withdraw from a course after the course drop deadline has passed. Once the form is complete, return it to the graduate office at grad.kpe@utoronto.ca. Research and/or Reading Course (KIN7001H/KIN7002H) Use this form to request either and Independent Reading (KIN7001H) or Independent Research (KIN7002H) course. Approval is required before the course may begin and all field on this form must be completed. Once the form is complete, return it to the graduate office at grad.kpe@utoronto.ca. Conference Reimbursement Form This form may be used to request reimbursement for travel to a conference. Students may claim a maximum of $250 (Canadian) with the appropriate receipts, once each academic year. Once the form is complete, return it to the Graduate Office. A reminder that claims for airfare must be accompanied by boarding passes as well as receipts. Please provide receipts for only those items you are claiming. Defence Forms:Please read the information regarding your upcoming defence in the Graduate Department of Kinesiology Handbook. Confirmation of Thesis Proposal Defence Form All students are required to have this form completed and signed by their supervisory committee and return it to the Graduate Department of Kinesiology (grad.kpe@utoronto.ca /BN110) within three weeks following the proposal defence date. Thesis Approval Form Formal approval of the thesis is required by the supervisory committee prior to initiating the Master’s Final Defence or the PhD Departmental Defense for doctoral candidates. Once your committee has read and approved your thesis return the completed form to the graduate office at grad.kpe@utoronto.ca. Master's Thesis Final Defence Request Form All master's students are required to complete this form and return it to the Graduate Department of Kinesiology (grad.kpe@utoronto.ca /BN110) at least four weeks in advance of the prospective defence date along with following supporting documentation: a pdf of the completed thesis, a signed Thesis Approval Form, and a copy of the external examiner’s c.v. PhD Departmental Defence Request Form All doctoral students are required to complete this form and return it to the Graduate Department of Kinesiology (grad.kpe@utoronto.ca /BN110) at least four weeks in advance of the prospective defence date along with following supporting documentation: a pdf of the completed thesis and a signed Thesis Approval Form. PhD Final Oral Examination Request Form This form and all supporting documentation MUST be emailed to Graduate Department (grad.kpe@utoronto.ca) a minimum of 8 weeks prior to the Final Oral Examination (FOE). Supporting documentation includes: pdf of final thesis, c.v of External Appraiser, and Remote Participation Attestation Form for virtual FOE. FOE Remote Participation Attestation Form If you will be participating in a virtual Final Oral Examination, please submit this form along with the PhD Final Oral Examination Request Form and supporting documentation to the graduate office at grad.kpe@utoronto.ca.Travel Reimbursement Forms: Conference Reimbursement Form This form may be used to request reimbursement for travel to a conference. Students may claim a maximum of $250 (Canadian) with the appropriate receipts, once each academic year. Once the form is complete, return it to the Graduate Office. A reminder that claims for airfare must be accompanied by boarding passes as well as receipts. Please provide receipts for only those items you are claiming."
