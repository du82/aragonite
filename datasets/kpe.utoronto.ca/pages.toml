["https://kpe.utoronto.ca/aboutgovernance/council-athletics-and-recreation-car"]
title = "Council of Athletics and Recreation (CAR) | UofT - Faculty of Kinesiology & Physical Education"
description = "Overview The Council of Athletics and Recreation (CAR) is one of the oldest continuing student governance bodies at the University of Toronto, with a history dating back more than 100 years. It has jurisdiction over the co-curricular sport and recreation programs on the St. George Campus, as well as university-wide programs such as Intramurals."
full_description = "Overview The Council of Athletics and Recreation (CAR) is one of the oldest continuing student governance bodies at the University of Toronto, with a history dating back more than 100 years. It has jurisdiction over the co-curricular sport and recreation programs on the St. George Campus, as well as university-wide programs such as Intramurals. Composed of students, administrative staff, alumni, and facility users, CAR is responsible for overall athletics and recreation policy, including the allocation of funds to program areas, staffing policy, and rental and fees policy. CAR is a Standing Committee of the KPE Faculty Council. Students enjoy constitutional parity on the 30-member Council, and participation in CAR is a fantastic means to get involved in the on-campus governance process. Nominations for the 2023-24 Council of Athletics and Recreation We are currently seeking nominations for the 2023-24 Council of Athletics and Recreation. The deadline for submissions is September 22, 2023 at 5 p.m. Positions to be filled include: 2 professional Faculty student 1 part-time undergraduate student 1 graduate student 2 KPE admin staff To nominate, please complete and email the corresponding nomination form to wendy.kane@utoronto.ca. CAR student nomination form CAR staff nomination form"
