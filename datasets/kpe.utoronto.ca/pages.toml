["https://kpe.utoronto.ca/academics-researchcurrent-studentsundergraduate-studies/bkin-course-enrolment-and-registration"]
title = "BKin Course Enrolment and Registration | UofT - Faculty of Kinesiology & Physical Education"
description = "Enrolment and Registration ResourcesPlease review the registration handbooks, timetables and information below for details about course enrolment and registration.2024-25 Fall and Winter"
full_description = '''Enrolment and Registration ResourcesPlease review the registration handbooks, timetables and information below for details about course enrolment and registration.2024-25 Fall and Winter 2024-25 Fall and Winter Registration Guide (Updated Nov 8, 2024)2024-25 Sessional Dates Course Enrolment FAQBKin Timetables Academic Calendar BKin Tuition, Fees and Awards2024-25 Fall & Winter Fees & Refund ScheduleWhat's New in 2024-25 Fall and Winter Session? The 2024-2025 Academic Calendar will be available on the Academic Calendar webpage.Links to academic timetables are available on the BKin Timetables webpage.Search for an appropriate other division elective using Timetable Builder. See p. 16 in the 2024-25 Fall and Winter Registration Guide for more information.See How to Use Timetable BuilderKPE is offering new courses in the 2024-2025 academic session. KPE476H1 - Clinical Exercise Programming | Category C | Fall & WinterKPE433H1 - Occupational Health and wellness | Category B | WinterIn-person ODP courses (ODP100H1, ODP200H1 and ODP300H1) are scheduled for late August 2024. See below under "Outdoor Project Update (ODP)" for specific dates.See the ODP Enrolment section (p.15) in the 2024-25 Fall and Winter Registration Guide and the Sessional Dates - 2024-25 Fall and Winter for more information.Check out the KPE Academic Calendar and p.4 in the 2024-25 Fall and Winter Registration Guide for more detail.New Tri-Campus Minor in Global Leadership program has launched. See detail about the program on the KPE Minor in Global Leadership website.In-person learningThe University of Toronto delivers academic programs through an in-person learning environment. All students should therefore plan to attend on-campus activities in-person in order to successfully complete their program/ degree unless: (i) students have been approved by the University to participate in off-campus activities (such as study abroad or work terms), or (ii) the calendar entry for a program/degree explicitly states that no in-person activities are required. While the University strives to maintain an in-person learning environment, the University reserves the right to alter the manner in which it delivers its courses and co-curricular opportunities in response to health and safety emergencies and public health guidance. Fall/Winter 2024-25 Enrolment and Registration Enrolment and Registration BasicsEnrolment for KPE courses on ACORN will begin on July 9, 2024 at 6 a.m. ET.Registration details and sessional dates can be found in 2024-25 Fall and Winter Registration Guide.A finalized listing of Fall-Winter courses can be found on the BKin Timetables webpage.A summary of basic enrolment and registration information is provided below. Refer to the full 2024-25 Fall and Winter Registration Guide for detailed course enrolment and registration procedures.KPE COURSE ENROLMENT The first day for all undergraduate students to enrol in KPE courses is July 9, 2024 at 6 a.m. ET.Enrol in courses via ACORN system.Please visit the Timetables webpage for course offering information. ST. GEORGE CAMPUS ARTS & SCIENCE ENROLMENT The first day for KPE undergraduate students to enrol in St. George Campus Arts & Science courses on ACORN is July 31, 2024 at 6 a.m. ET.For more information about course registration and timetables, please visit the Arts & Science website.U OF T AT SCARBOROUGH COURSE ENROLMENTInformation about courses offered at UTSC is available on the UTSC website.Course enrolment for unrestricted UTSC academic courses will begin on ACORN starting August 2, 2024 at 6 a.m. ET. Some UTSC courses may be open for early registration, so try to add them before the published registration dates. U OF T AT MISSISSAUGA COURSE ENROLMENTInformation about courses offered at UTM is available on the UTM website.Course enrolment for unrestricted UTM courses will begin on ACORN starting August 2, 2024 at 6 a.m. ET.Course requirementsStudent who enrol in courses where they do not meet the course pre-requisites, co-requisites or have completed an exclusion, will be removed from the course. The Academic Calendar is a tool you can use to see the requirements for each course.Pre-Requisite A course that you must have taken and passed before starting a certain course, to ensure that you're prepared. Pre-requisites for each course can be found in the Academic Calendar.Co-RequisiteA course or requirement that a student must take at the same time they are completing another course or requirement (unless it has already been taken. Co-requisites are listed on the Academic Calendar. ExclusionSome courses overlap in content. This can be because the same kind of material may be offered in the context of different areas of study, or because there may be certain similar course material that is offered at different levels of difficulty, or because some courses have content that used to be offered in an older and now “retired” course. When reading a course description, if a student sees a course listed under “exclusions” that includes a course they already have credit for, they should not normally take this course. You will be removed from any courses if you have an exclusion. If, due to special permission via a petition, you remain in the course, the new course will not count for degree credit and will be marked “Extra”. Exclusions are listed on the Academic Calendar. STUDENT STATUS: FULL-TIME VS. PART-TIMEFULL TIME STATUSFor the 2024-25 session, you will be assigned full time status by default. Full-time status is defined as enrolment in 3.0 – 6.0 Full Credit Equivalents (FCEs).PART TIME STATUSYou may request to change to part-time status if your course load on ACORN is 2.5 FCEs or less. To request a change to part time status for the academic year:Email undergrad.kpe@utoronto.ca. Ensure that you include your full name, student number and your request to move to part time status for the 2024-25 academic year.COURSE LOAD AND WAIT LIST LIMITSFull-time students can be enrolled in a maximum of 6.0 FCEs. Of these 6.0 FCEs a maximum of 2.0 FCEs may be waitlisted courses.Part-time students can be enrolled in a maximum of 2.5 FCEs. Of these 2.5 FCEs a maximum of 2.0 FCEs may be waitlisted courses.MAXIMUM TERM COURSE LOAD You may enrol and/or waitlist in a maximum of seven (7) academic courses per term within the limits noted above. Term overloads above seven (7) courses may be requested by petition but are highly discouraged. COURSE OVERLOADSIf you wish to enrol in more than 6.0 FCEs for the 2024-25 session you must petition for permission to enrol in a course overload. You must have a GPA of 2.7 or higher in the preceding year to be considered for an overload.Petition forms are available on the Petitions webpage.Tuition FeesPROGRAM VS. PER-COURSE FEESTuition fee charges depend on a student’s course enrolments as of the published fee capture dates.By default, all students will be set to full time program fee tuition charges for 2024-25 academic session. Students who are enrolled in 3.5 credits or less as of the fee capture dates may request to pay tuition fees on a per course basis. Visit the KPE Fees and Awards webpage for full details about capture dates and tuition fee charges. TUITION FEE INVOICEYou can view and print a tuition fee invoice on ACORN in mid-July.DEADLINE TO PAY OR DEFER TUITIONYou must pay or defer your fees by the deadline, or you will be removed from courses on ACORN. The deadline to make the Minimum Require Payment for Registration OR defer fees if you are receiving OSAP is August 27, 2024. ONLINE TUITION FEE DEFERRALStudents who are approved for OSAP or other provincial government funding may request a temporary tuition fee deferral, which allows them to be fully registered in their courses while delaying the minimum payment deadline until the end of September.To defer your tuition fees:Login to ACORN. Click on Tuition Fee Deferral and follow the instructions.REFUNDSThe refund deadline for courses and term withdrawal is much earlier than the published drop deadlines.Refund amounts will be based on your course load as of the fee capture dates and the date you cancel (drop) your course on ACORN. Visit the Student Accounts website for full details about refund deadlines and procedures. OSAP FUNDINGOSAP funding is available to you if:You are a Canadian citizen, permanent resident, or protected person.You have financial need.You are registered in an eligible program with a full-time course load in each term. (You cannot average the course load over 2 terms).Early OSAP applications are necessary to be eligible for tuition fee deferrals.Returning students should apply for OSAP by the end of May. New students should apply by mid-June. OSAP’s application is available online at OSAP website.For detailed information about applying for OSAP visit the Enrolment Services website. Outdoor Project Update (ODP) ODP REGISTRATIONODP registration takes place via the ACORN system. Please refer to the Registration Information website for more information about enrolment dates and timetables. ODP scheduleFees for the Outdoor Projects will be charged to your tuition invoice as ancillary fees. Once you add an ODP course to your timetable the fee will appear as follows. The deadline to pay these fees will align with tuition fee payment deadlines and procedures.ODP100H1: August 26 - 28, 2024 ODP200H1: August 26 - 28, 2024 (P101) or August 28 - 30, 2024 (P102)ODP300H1: August 28 - 30, 2024ODP301H1: Early May 2025 (TBD)ODP302H1: January 10 - 12, 2025 (P101) or January 17 - 19, 2025 (P102)ODP INFORMATION SURVEYSStudents will receive an email prior to the start of the Outdoor Project requesting completion of an online survey on the ODP Quercus website. Be prepared to provide relevant medical information, dietary restrictions, and emergency contact information prior the deadline noted in the email.Detailed COURSE INFORMATION AND EQUIPMENT LISTSOutdoor project course outlines including camp descriptions, clothing and equipment lists will be available on the ODP Quercus website prior to departure.CANCELLATION & REFUNDSODP course enrolments must be cancelled on ACORN by the published ancillary fee refund deadline for a full refund. Refer to the Student Accounts website for published refund deadlines. Students wishing to cancel their ODP after these deadlines should contact undergrad.kpe@utoronto.ca for assistance. KPE290H1 Transition KPE290H1 is no longer offered. The course code of Research Design and Evaluation: Qualitative Approaches (formerly KPE290H1) has been changed to KPE391H1. Former CourseLast OfferingReplacementKPE290H1 Research Design and Evaluation: QuaWinter 2023 KPE391H1 Research Design and Evaluation: Qualitative ApproachesKPE391H1 is a required course, therefore students who have not completed KPE290H1 are required to complete KPE391H1 to fulfill the program requirement.Please review Degree Explorer for information about your program of study and degree completion progress. Students admitted in 2022 or later can enroll in KPE391H1 in their second year or third year as they desire. If you need assistance with course enrolment planning, KPE Student Advisors are available to meet with you. You can book an appointment with a Student Advisor via the online Academic Advising Appointment booking site. If you have questions or need assistance with booking an appointment, contact the KPE Office of the Registrar and Student Services at undergrad.kpe@toronto.ca or 416-978-3183. Certificates at the Faculty of Kinesiology and Physical Education KPE is now offering seven certificates. A course can only count towards one BKin certificate and a maximum of 3 certificates are allowed. Certificates are to be completed in conjunction with the BKin degree and you declare which certificates you qualify for in your final term of your degree.Please check out the KPE Academic Calendar for details.Certificate in Clinical Movement SciencesCertificate in Foundational Sciences and Research Certificate in Global Kinesiology and Physical Education (U of T Global Scholar)Certificate in Mental Health and Physical Activity Certificate in Physical Activity InstructionCertificate in Social and Environmental Justice Certificate in Sport Sciences Students declare which certificates they have completed in their final term of their degree. You will receive an email with next steps. In the meantime, if you have any questions, please contact the Office of the Registrar and Student Services for further information: undergrad.kpe@utoronto.ca Interprofessional Education (IPE) The University of Toronto Interprofessional Education (IPE) curriculum is focused on the development of specific values and core competencies across eleven health professional programs (dentistry, medical radiation sciences, medicine, nursing, occupational therapy, pharmacy, kinesiology and physical education, physician assistant, physical therapy, social work and speech-language pathology). The knowledge, skills/behaviours and attitudes developed through the IPE curriculum enable students to provide collaborative relational-centred care in an interprofessional context.Students who entered the BKIN and BPHE degree programs in 2012, 2013, 2014 and 2015 must successfully complete the IPE curriculum, which includes attendance in two (2) learning activities from a wide range of options available in students' third and fourth years.IPE Program of Study Requirements1) PRA600H1 Teamwork: Your Future in Healthcare or PRA602H1 (IPE elective of choice)2) PRA601H1 IPE elective of choiceIt is highly recommend that graduating students complete their IPE requirements by the fall term of their graduating year and by the end of February at the latest.PRA600H1 - Teamwork: Your Future in HealthcareKPE undergraduate students may attend this introductory learning activity which powerfully brings together the entire cohort of health science students in striking Convocation Hall. As a part of the activity, Faculty members demonstrate different ways in which healthcare teams can deliver interprofessional care. Students also hear the account of a patient/client’s journey through the healthcare system, giving them the opportunity to reflect on the healthcare profession they have chosen, as well as how they can be vital members of an interprofessional team.Registration: Sign up for the activity on the IPE websiteConflicts: Students who have a direct course conflict with this session should either delay PRA600H1 or complete a second IPE elective (PRA602H1) to replace PRA600H1.PRA601H1/PRA602H1 - Interprofessional Education ElectiveIn third and/or fourth year KPE undergraduate students are required to complete at least one IPE elective activity of their choice, or two IPE electives if they do not attend PRA600H1. Options may include but are not limited to the following activities: Conflict in Interprofessional Life, Eating Disorders, Dying and Death, Traumatic Brain Injury, etc.KPE undergraduate students'''
