["http://kpe.utoronto.ca/academics-research/conferences-seminars-symposia/public-seminars-symposia"]
title = "Public Seminars & Symposia | UofT - Faculty of Kinesiology & Physical Education"
description = "Public SymposiaThe Faculty offers free public events aimed at addressing current – and sometimes controversial – topics in sport, physical activity, and health. We encourage members of the public, journalists, experts and colleagues to attend and engage in these thought-provoking discussions.Following is a list of past symposia with available descriptions and video summaries."
full_description = "Public SymposiaThe Faculty offers free public events aimed at addressing current – and sometimes controversial – topics in sport, physical activity, and health. We encourage members of the public, journalists, experts and colleagues to attend and engage in these thought-provoking discussions.Following is a list of past symposia with available descriptions and video summaries.kpe science café: sports betting in canada On January 23, 2025, the Faculty hosted a discussion on the issue of sports betting in Canada as part of KPE's Science Café series, exploring the topic from a psychological, cultural and legislative lens.Watch the recording of the KPE Science Café panel, Risking More than a Game: The Consequences of Sports Betting in Canadakpe science café: enhancing cancer care through diet and exercise On November 18, 2024, the Faculty hosted a discussion on research and strategies to enhance cancer care through diet and exercise as part of the KPE's Science Café series.Watch the recording of the KPE Science Café panel, Nourish and Move: Enhancing Cancer Care Through Diet and ExerciseBook Launch: How climate change is changing sport (May 2024)On May 9, 2024, the KPE Faculty hosted the Toronto launch of Madeleine Orr's new book, Warming Up: How Climate Change is Changing Sport.The symposium featured a panel, led by sport ecologist Madeleine Orr, that discussed the impact of climate change on organized sports and potential solutions.Watch the recording of the book launch and discussion of Madeleine Orr's book, Warming Up: How Climate Change is Changing SportThe Inaugural Peter Donnelly Lecture in Sport Policy Studies (February 2024)On March 21, 2024, the Faculty hosted the inaugural Peter Donnelly Lecture in Sport Policy Studies, titled Open Spaces and Social Good: Removing Obstacles to Sport and Physical Activity.The symposium celebrated Dr. Donnelly's legacy of teaching and featured a keynote address by Dr. Parissa Safai on inclusive access to physical activity.Watch the recording of the inaugural Peter Donnelly lecture Open Spaces & Social Good: Removing Obstacles to Sport and Physical Activity KPE Science Café: Championing Change in Sport (November 2023)On November 22, 2023, the Faculty hosted a discussion on the latest advancements in concussion research, as part of the KPE's Science Café series.In the Championing Change in Sport symposium, panelists evaluated efforts to reduce the burden of concussions and explored ways to minimize concussion risks.Watch the recording of the KPE Science Café panel, Championing Change in Sport: Examining Progress and Insights in Concussion Research KPE Science Café: Achieving Safe Sport (February 2023)On February 2, 2023, the Faculty hosted a panel that discussed how to realize the promise of safe sport in Canada, as part of the KPE's Science Café series.In the symposium, titled Achieving Safe Sport, a panel of experts shared their recommendations for education, policy, complaint and support processes, and funding in sports.Watch the recording of the KPE Science Café panel, Achieving Safe Sports: Next Steps and Key RecommendationsThe Inaugural Dr. Brian Pronger Lecture (November 2022)On November 15, 2022, the Faculty hosted the inaugural Dr. Brian Pronger Lecture on Sexual Diversity Studies, featuring a keynote address by Dr. Genevieve Rail.The symposium, titled In My Queer Zone: “Vulnerable” Bodies and Carnal Knowledge in Cancer’s Margins, celebrated Dr. Progrer's legacy of teaching and social justice in sport and physical activity. Watch the recording of the inaugural Brian Pronger lecture, In My Queer Zone: “Vulnerable” Bodies and Carnal Knowledge in Cancer’s MarginsOptimizing Nutrition Through Exercise (March 2019)On March 5, 2019, the Faculty hosted a panel discussion, where researchers shared their insights on practical strategies that anyone can use to improve their health.The symposium, titled Optimizing Nutrition Through Exercise, addressed the relationship between physical activity and nutrition.Watch the recording of the Optimizing Nutrition Through Exercise PanelMobilizing Change (March 2018)On March 1, 2018, the Faculty hosted a free symposium called Mobilizing Change; the eleventh installment of its annual public research series.The symposium focused on the importance of accessibility in sport and recreation, as well as the significance of physical activity across the lifespan.Watch the recording of the Mobilizing Change panelEx/Cancer: The Benefits of Exercise After a Cancer Diagnosis (April 2017)On April 6, 2017, the Faculty hosted a panel titled Ex/Cancer: The Benefits of Exercise After a Cancer Diagnosis.The symposium discussed the benefits of physical activity for cancer survivors, while offering strategies on how to start and stick with an exercise program.Watch the recording of the Ex/Cancer: The Benefits of Exercise After a Cancer Diagnosis panel discussionSport, Sex and Identity (April 2016)In April 2016, the Faculty hosted a panel discussion, led by Olympic medalist Mark Tewksbury, titled Sport, Sex and Identity.The symposium featured a keynote address by Prof. Bruce Kidd and discussed the impact of sports in cultural identity, gender roles, and human rights.Watch the recording of the Sport, Sex and Identity panel discussion From good to gold: Science and technology in high-performance sport (May 2015)In May 2015, the Faculty hosted a showcase on Sports Physiology, titled From good to gold: Science and technology in high performance sport.The symposium explored the relationship between physiology, sports, psychology, and technology in high-performance athletes. Watch the recording of From good to gold: Science and technology in high-performance sport presentationMind Matters: From concussion to recovery (May 2014)In May 2014, the Faculty hosted a panel discussion on the latest findings on concussion research, titled Mind Matters: From concussion to recovery.The symposium addressed the physiology, treatment, psychological effects, and policies surrounding traumatic brain injury and recovery.Watch the recording of the Mind Matters: From concussion to recovery panel discussionExtreme Environments, Extraordinary Feats: How far can we push ourselves? (December 2013)In December 2013, the Faculty hosted a seminar titled, Extreme Environments, Extraordinary Feats: How Far Can We Push Ourselves? seminar. The symposium discussed how human physiology can adapt to and receive the impact of extreme environmental, physical, and psychological conditions.Watch the recording of the Extreme Environments, Extraordinary Feats: How far can we push ourselves? symposium The Heights of Human Performance: The Symbiosis of Brain and Body (May 2013)In May 2013, the Faculty hosted a brain-body communications conference titled The Heights of Human Performance: The Symbiosis of Brain and Body.The symposium featured a panel of athletes, professors, and researchers who discussed the principles of brain-body mechanics in Olympic, visual, and technological contexts. Watch the recording of The Heights of Human Performance: The Symbiosis of Brain and Body panel discussionWhat Happened to Walking? Encouraging Active School Travel in Toronto (December 2012)In December 2012, the Faculty hosted a panel on active travel for children, titled What Happened to Walking? Encouraging Active School Travel in Toronto.The symposium shared examples in downtown Toronto where walking has become safer and more enjoyable due to better transportation infrastructure. Watch the recording of the What Happened to Walking? Encouraging Active School Travel in Toronto panelThe Olympic Athlete: What it Takes to Get to the Games (April 2012)In April 2012, the Faculty hosted a panel discussion on the road to the Olympics, titled The Olympic Athlete: What it Takes to Get to the Games.The symposium featured a keynote address by Olympic champion Alexandra Orlando, and discussed competitive sports from the perspective of coaches, researchers, and athletes.Watch the recording of The Olympic Athlete: What it Takes to Get to the Games panel discussion and lecturePhysical Activity: The Best Medicine? (December 2011)In December 2011, the Faculty hosted a panel, featuring a keynote address by Globe and Mail report André Picard, titled Physical Activity: The Best Medicine?The symposium explored the risks and benefits of physical activity, how regular exercise helps improve public health, and how exercise can increase depression and improve mental health.Watch the recording of the panel and keynote address of Physical Activity: The Best Medicine?Game Misconduct: Violence, Abuse and Young Athletes (May 2011)In May 2011, the Faculty hosted the inaugural event for its Health Speakers series, titled Game Misconduct: Violence, Abuse and Young Athletes.The symposium featured a panel, moderated by Steve Paikin from TVO's The Agenda, which discussed the rising tide of violence in sport and its effect on Canadian youth. Watch the recording for the panel discussion of Game Misconduct: Violence, Abuse and Young Athletes"
year_published = 2025
