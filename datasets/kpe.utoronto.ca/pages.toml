description = "In December 2011, Ira Jacobs, Dean of the Faculty of Kinesiology and Physical Education (KPE) commissioned a review of the University of Toronto Sport Model. The review was tasked to a committee and the report was submitted to the Dean in April 2012.The first phase of consultation, regarding the intercollegiate and club programs within the sport model, occurred from November 9 to December 5, 2012."
full_description = "In December 2011, Ira Jacobs, Dean of the Faculty of Kinesiology and Physical Education (KPE) commissioned a review of the University of Toronto Sport Model. The review was tasked to a committee and the report was submitted to the Dean in April 2012.The first phase of consultation, regarding the intercollegiate and club programs within the sport model, occurred from November 9 to December 5, 2012. The second phase of consultations ran from February 19, 2013 until March 27, 2013. This phase of consultations focused on possible criteria that could be used to create categories within the intercollegiate and club sport models and a service model that could support a four category sport model.The third phase resulted in the finalization of the intercollegiate component of the sport model. The remaining phases, which address intramurals and tri-campus intramurals, were completed in the summer of 2014.For more information about the University of Toronto Sport Model please contact the Vice Dean, Programs, Ashley Stirling."
