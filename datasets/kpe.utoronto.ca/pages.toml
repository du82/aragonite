["https://kpe.utoronto.ca/academics-research/research-units-labs-centres/training-and-enhancing-motor-performance-outcomes"]
title = "Training and Enhancing Motor Performance Outcomes Lab | UofT - Faculty of Kinesiology & Physical Education"
description = "Mission: The TEMPO Lab aims to discover and understand how to enhance a person’s ability to learn motor skills. We study factors that optimize motor learning such as, augmented feedback, non-invasive brain stimulation, and aerobic exercise, in typically developing individuals and people living with stroke."
full_description = "Mission: The TEMPO Lab aims to discover and understand how to enhance a person’s ability to learn motor skills. We study factors that optimize motor learning such as, augmented feedback, non-invasive brain stimulation, and aerobic exercise, in typically developing individuals and people living with stroke. We use techniques such as behavioural testing, magnetic resonance imaging, and non-invasive brain stimulation. These approaches allow us to better understand the brain’s capacity for, to determine biomarkers that predict, and to elucidate neural mechanisms that underlie, learning.Key Themes:Motor learningMusic perception and productionStroke recovery and rehabilitationNeuroplasticityBiomarkersScientific TeamDirectorJoyce L Chen, PhDMSc studentsAndrea Hung, BScUndergraduate studentsAran Bains, KPE 390Research CoordinatorKay-Ann AllenResearch PhysiotherapistEllen CohenPrevious TraineesDana Swarbrick, MSc studentNirsan Kunaratnam, MSc studentTimothy Lam, MSc student, Research Assistant​Shinya Fujii, post-doctoral fellow, presently Assistant Professor, Keio University, JapanAshley Schipani, undergraduate summer student, Wilfred Laurier UniversityPayal Gandhi, undergraduate co-op student, University of WaterlooAlvina Siu, undergraduate summer student, McMaster UniversityAyeesha Tasneem, undergraduate summer student, University of TorontoKanako Sugita, visiting student, JapanTea Lulic, Research AssistantResearchCurrent ProjectsEffects of cardiovascular exercise on motor learningWe are studying how to naturally facilitate learning-dependent neuroplasticity through aerobic exercise. Aerobic exercise naturally induces the release of various neurochemicals that may promote neuronal growth and signaling to support motor learning. The pairing of high intensity aerobic exercise after motor skill acquisition enhances skill retention. We are studying whether baseline fitness influences these effects, and whether we can translate these fundamental research findings to help musicians enhance their performance.Effects of transcranial direct current stimulation on motor learningTranscranial direct current stimulation, tDCS, is a technology that directly modulates neuroplastic mechanisms related to learning via stimulation of the cortex through the scalp. Combining tDCS with practice may enhance a person’s capacity for motor learning. Our fundamental research aims to understand how tDCS exerts its effects, and what kind of performance advantages it may yield. Towards a personalized approach to stroke motor recovery using transcranial direct current stimulationThe application of tDCS combined with physical therapy has the potential to enhance the recovery of movements more than therapy alone (i.e. without the stimulation). While tDCS may ‘work’, it doesn’t seem to work for everyone. We believe a personalized approach to tDCS is required to maximize the effects of therapy for each person. We are testing whether a biomarker of motor recovery from stroke, the amount of damage to the corticospinal tract, predicts treatment response to tDCS. Stroke survivors perform goal-directed reaching while receiving different types of tDCS. The movements are tracked with motion capture systems to allow for a fine-grained analysis of tDCS effects on kinematics. PublicationsGoogle ScholarEducational OpportunitiesI am looking for highly motivated students to join the TEMPO Lab. Interested individuals should contact Professor Chen with a cover letter indicating their background and research interests, a curriculum vitae, and an unofficial copy of their transcript. Tell me why research in the TEMPO Lab interests you, and what kind of projects you want to pursue.I am accepting MSc and PhD degree students through the Faculty of Kinesiology and Physical Education. I am also affiliated with the Rehabilitation Sciences Institute.I am accepting undergraduate students who want to volunteer, do a work study internship, and/or do an undergraduate research project as part of their course work. ContactJoyce L Chen, PhDAssistant ProfessorFaculty of Kinesiology and Physical EducationUniversity of Toronto 55 Harbord StreetToronto, ON M5S 2W6Email: joycelynn.chen@utoronto.caPhone: 416-946-5394SupportNSERCHeart and Stroke Foundation"
year_published = 2025
clearnet = "https://kpe.utoronto.ca/academics-research/research-units-labs-centres/training-and-enhancing-motor-performance-outcomes"
