["https://kpe.utoronto.ca/aboutworking-kpe/launch-leadership"]
title = "Launch to Leadership | UofT - Faculty of Kinesiology & Physical Education"
description = "About the Launch to Leadership ProgramLaunch to Leadership assists U of T students in gaining health and fitness certifications for employment within the sport and recreation field. This program is intended for students who self-identify as 2SLGBTQ+, nonbinary, trans, racialized, Indigenous, a newcomer,  an international student, disabled/a person with disabilities, a religious minority, and/or low-income backgrounds."
full_description = "About the Launch to Leadership ProgramLaunch to Leadership assists U of T students in gaining health and fitness certifications for employment within the sport and recreation field. This program is intended for students who self-identify as 2SLGBTQ+, nonbinary, trans, racialized, Indigenous, a newcomer, an international student, disabled/a person with disabilities, a religious minority, and/or low-income backgrounds. Get reimbursed for certification courses to support your career development!Successful applicants will be eligible for partial to full reimbursement for certification courses such as Standard First Aid, Fitness Instructor Certifications, Aquatic Leadership Qualifications, and Coaching certifications AND a networking meeting with one of the hiring managers. Certification courses offered within U of T Sport & Rec will be given preference.There are a range of roles in sport and recreation that require certifications, from aquatic instructors to sport coaches. Get a better understanding of the types of roles available and their certification requirements so you can plan your path to certification or explore the certification courses offered by Sport & Rec. Thanks to a generous donation from Glenn H. Carter, the Glenn H. Carter Water Safety Instruction and Certification Fund was created to invest in the future of water safety and to empower students to make a positive impact in their communities. This fund is an integral part of the Launch to Leadership program and is dedicated to supporting students who aspire to become lifeguards or swim instructors by providing financial support to access aquatics certification courses. To access this funding, please submit an application to the Launch to Leadership program. THE WINTER application period IS NOW CLOSED. Spring/summer applications will open in early spring. Application overview:The Launch to Leadership program is open to current U of T students enrolled in part-time or full-time studies.Limited spaces are available.Applications will be accepted on a rolling basis until the closing deadline (Feb 24 Winter Applications) or until the funds are allocated. APPLY HERE The Application ProcessAfter filling out the Launch to Leadership application form, successful applicants will be contacted by a staff member to confirm details and provide available course options to register in.The process for Winter 2025 reimbursement starts when the application is now open (apply here) (available until Feb 24) . To be eligible for reimbursement, you must follow these four simple steps after being contacted by our staff:Once notified that you have qualified for the grant, register and pay for the course. The course must be completed by March 30, 2025.Attend and successfully complete the course.Submit proof of certification.Fill out our follow-up survey.Contact the EDIB Sport & Rec Team for any Questions."
