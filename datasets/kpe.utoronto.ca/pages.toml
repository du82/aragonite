["https://kpe.utoronto.ca/academics-researchcurrent-studentsundergraduate-studies/bkin-field-learning"]
title = "BKin In-Field Learning | UofT - Faculty of Kinesiology & Physical Education"
description = "BKin In-Field Learning helps you put theory into practice by working alongside and learning from some of the very best in the field."
full_description = "BKin In-Field Learning helps you put theory into practice by working alongside and learning from some of the very best in the field. Available for third, fourth and fifth-year students, these In-Field Learning opportunities occur as a part of elective upper year courses where you develop skills through job shadowing, and assisting with day-to-day workplace activities under the supervision of a mentor. In the classroom, theoretical knowledge and core competencies of professional practice are addressed.While in the field you’ll have access to practical experiences and unrivaled mentorship from experts in health-care, sport and physical activity institutions. Plus, we provide invaluable research opportunities and the chance to see how some of the largest and most diverse school boards and community centres operate.What you can expect to achieve from in-field learning:Learn through experienceIntegrate classroom learning with hands-on practiceExplore different fields of practiceGauge the fit of potential careers pathsDevelop personal and professional skills that will build your resume and make you stand out to future employersAcademic Course InformationStudents interested in applying for a BKIN In-Field Learning are encouraged to review the course outlines prior to registration. BKIN In-Field Learning will prepare you for graduate programs and placements, which are a natural stepping stone to your career.KPE355Y – Interpersonal Theory in Kinesiology & Physical EducationKPE455Y – Kinesiology & Physical Education in Society What types of in-field placements can I take?In-Field Learning placements are offered in five key areas related to the field of kinesiology and physical education: *Areas of practice are determined and confirmed on an annual basis and are subject to change.Faculty Attained In-Field Learning PartnershipsThe Faculty maintains meaningful relationships with over one hundred community partners who offer their mentorship to KPE students, while simultaneously conducting outreach to develop new partnerships within the community. Once the application opens, students are able to view a list of Faculty attained partnerships and rank preferences by logging into the placement system with their UTORid. For more information on this process, please see the How do I apply? section below. Student Attained In-Field Learning Partnerships Students are able to submit a proposal for a student attained in-field learning placement if the opportunity/organization of interest is not reflected on the Faculty list.If you are interested in securing your own in-field learning placement opportunity, please email placements.kpe@utoronto.ca to request the application form. What is the structure of the course (KPE355/455)? Opportunity to transform theory from the classroom to in-field practiceIn-field learning provides students with a unique opportunity to apply theoretical knowledge in a safe and supportive learning environment100 hours of in-field experience from September - MarchStudents complete an average of 5 hours per week on-site during their in-field learning courseMulti-modal course structure combines in-field experiences with lectures and tutorials to amplify learningStudents are supported by lectures and tutorials, providing an opportunity for critical reflection of in-field learning experiencesSupervised mentorship by a qualified professionalMentors have a minimum of 3 years of post-education experience in a field related to kinesiology and physical education Activities and tasks related to kinesiology and physical educationCommunity partners/mentors and the Faculty work together to ensure the learning objectives for each in-field learning placement relate to what is being covered in the BKin curriculum What are the prerequisite requirements to take KPE355/455? Please carefully review the below requirements, student responsibilities and matching criteria prior to submitting an application. Open to Upper-Year KPE StudentsIn-field learning is open to all students who will be registered in year 3 of studies or higher during the academic year that the course takes place Commitment to ParticipationThough attached to an academic course, KPE355 and KPE455 are unique in their involvement of community partners. As community partners/mentors expect students to attend their in-field learning placement once matched, applications to in-field learning are viewed as a firm commitment to full participation in the course, barring extenuating circumstancesAncillary Fee for Participation Due to the high level of additional resources and administrative support required for the success of this course, students are required to pay a $260.10 ancillary fee (for 2024-25 academic session) which will be billed on ACORN following course registration Student and Mentor Matching Criteria You are not able to use in-field learning experience/hours towards requirements/credits/hours for other experiential learning opportunities (work study, internship, directed research, etc.)You are able to participate in other experiential learning opportunities during your in-field learning courses (work study, internship, directed research, etc.), but it is your responsibility to ensure different mentorship/supervision for other opportunities In order to provide students with diverse opportunities and experiences, you are unable to be matched with the same mentor for both KPE355 and KPE455 ​​​​​You may not receive financial compensation for in-field learning hours, due to university insurance policies You may not receive in-field learning mentorship/supervision by a family member or family friend If in a clinical placement (physiotherapy, chiropractic, etc.), you may not receive treatment from your mentor/matched organization for the duration of in-field learning How to Apply to a BKin In-Field Learning PlacementDeadlinesApplications for the 2024-25 academic session opened on May 22, 2024 at 12 p.m. ET.Once the application opens, you will be able to view the complete list of placement opportunities offered for the upcoming academic year. You will not be able to see the list of placements until this time. The deadline to submit your application was Monday, June 10, 2024, 5 p.m. The Application Process Log in to the placement system using your UTORid Applications opened on Wednesday, May 22, 2024 at noon, 12 p.m. At this time, you will be able to view all in-field learning opportunities. We are unable to disclose the list of placement options until the application opens. Carefully review the in-field learning placements offeredThe Faculty maintains over one hundred community partners, each with distinct opportunities to support your personal and professional development.Think about why you are applying for an in-field learning placement. Are you interested in exploring a new field? Are there skills you would like to develop? Then think about how the various learning objectives within each opportunity can support your goals. Also, be sure to make note of important details listed such as location and hours. If you will require accommodations during placement, please ensure you are registered with Accessibility Services. Once you have a letter outlining your accommodations, e-mail placements.kpe@utoronto.ca for further support. Make use of resources to strengthen your applicationYou will be required to submit a resume as part of your application. Investing time to strengthen it is important, as it is the first impression a potential mentor will have of you. Here are some resources to support you through this process: Book an appointment with the Career Educator by logging into CLNxAttend resume workshops, drop-ins and other career support offered through the Career Centre and/or KPE Student Support ServicesAccess Lynda online tutorials with your UTORidUse online tools such as Zety to help format your resume Submit your rankings, resume, and applicationAll components of your application for in-field learning placements were due by Monday, June 10, 2024, 5 p.m. In order for your application to be processed, all components must be submitted. You are able to update your rankings and application as often as you would like prior to this date. Reach out to all mentors you have been matched with to set up an interview Match results were announced to you and potential mentors by Thursday, June 13, 2024. It is your responsibility to reach out to every mentor you are matched with to set up an interview. Submitting an application signifies a meaningful commitment to the community partners that you have ranked, which requires your follow-through. Complete interview(s) and indicate your post-interview interest on the placement system Interviews with the mentors you have been matched took place between Friday, June 14, 2024 and Tuesday, July 2, 2024. Students and mentors are both required to indicate yes or no on the application system after the completion of each interview. If unmatched after completing round one, proceed to round two of matchingIt is possible that you may not be matched following the first application round. If this happens, you are able to rank your top 5 choices out of the spaces that are still available. Round two of matching is only open to those who were unmatched in round one. Sign the student/mentor agreement formOnce matched, you and your mentor are both required to review the student-mentor agreement form on the application system, and check the box indicating agreement. Enrolment in KPE355Y or KPE455Y*After you have been matched and completed the above steps, you will be automatically enrolled in KPE355Y1 or KPE455Y1 on ROSI by the Registrar's Office.*Enrolment in KPE455Y1 is only available to students who have successfully completed KPE355Y1If you have any questions, email placements.kpe@utoronto.ca for assistance."
