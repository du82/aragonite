["https://kpe.utoronto.ca/academics-researchcurrent-studentsundergraduate-studies/bkin-tuition-fees-and-awards"]
title = "BKin Tuition, Fees and Awards | UofT - Faculty of Kinesiology & Physical Education"
description = "What's New?The Fall-Winter session fee billing (September to April) will start July 15, 2024.Tuition fee invoices for the 2024-25 session will be available on ACORN.Click on the 'Show Invoice' button from the financial account screen.Detailed fee payment instructions are"
full_description = "What's New?The Fall-Winter session fee billing (September to April) will start July 15, 2024.Tuition fee invoices for the 2024-25 session will be available on ACORN.Click on the 'Show Invoice' button from the financial account screen.Detailed fee payment instructions are available on the U of T Student Accounts website.Tuition payments made within Canada can be processed through a Canadian financial institution.Payments made from outside of Canada can be completed through Convera and Flywire.You may pay tuition fees using Visa or Mastercard via ACORN. A 2.5% Convenience Fee applies.Undergraduate students enrolled in 3.5 Full Credit Equivalents (FCE) or less during the 2024-25 session may request an adjustment to pay tuition fees on a per course basis.Please email the KPE undergraduate office with your full name and U of T student ID number for more information.There are three types of undergraduate tuition fee schedules at the University of Toronto:Domestic (Ontario Resident) Tuition FeesDomestic (Non-Ontario Resident) Tuition Fees International Tuition Fees.If you have been billed Domestic (Non-Ontario Resident) tuition fees but are eligible to be billed Domestic (Ontario Resident) tuition fees due to your residency status, you can request a tuition fee billing change by submitting your request with the required documentation to Student Accounts. More detail is available on the Student Accounts website.You can enroll in courses but your registration status has to be changed to “Registered” by your division’s Pay or Defer to Register deadline. Otherwise, your sessional registration will be “Financially Cancelled”, and your course enrolment will be cancelled.Dates to RememberThe deadline for students to pay the Minimum Required Payment to Register amount displayed on the 2024-25 tuition invoice is August 27, 2024.The deadline for students receiving government financial aid (OSAP) to defer their fees on ACORN is August 27, 2024. Unpaid fall term balances must be paid by September 30, 2024, and unpaid winter term balances must be paid by November 30, 2024. Service charges begin on unpaid fall term fees as of mid-October (date TBD), and on unpaid winter term fees as of mid-December (date TBD). Fee adjustments will be considered based on student course loads listed on ACORN as of the September 16, 2024, and January 17, 2025 fee determination dates.Tuition FeesFees for 2024-25In accordance with the Ministry of Training, Colleges and Universities (MTCU) guidelines, fees charged to KPE undergraduate students will be based on their academic course enrolment (including waitlisted courses) as of the published fee determination dates in the fall and winter terms. The table below explains how tuition and incidental fees will be charged in the 2024-25 session.Course LoadTuitionIncidental fees4.0 – 6.0 FCECharged on a program fee basisFull-time rate3.0 – 3.5 FCECharged on a per course basisFull-time rate0.5 – 2.5 FCECharged on a per course basisPart-time rateProgram fees are charged on a flat rate basis to students enrolled in 4.0 FCE (Full Credit Equivalents) or more during the 2024-25 session as of the published fee determination dates. Most KPE undergraduate students will be set to full-time program-based fees on ACORN by default at the start of the registration period.Students who enrol in course loads lower than 4.0 FCE as of the fee determination dates may request an adjustment to course-based fees.It is recommended that students request this adjustment before the Minimum Required Payment to Register (MPR) deadline of August 27, 2024. To make a request please contact the KPE undergraduate office with your full name and U of T student ID number from your UTmail+ account.Fee adjustments will be considered based on student course loads listed on ACORN as of the September 16, 2024 and January 17, 2025 fee determination dates.Detailed fee schedules for all KPE undergraduate students are available on the U of T Student Accounts website. Tuition Payment and Deferrals Payment and Service Charge TimelinesStudents may pay their fees on a session (Sep - Apr) or per-term basis. Per-term payments are based on the fall term (Sep -Dec) and winter term (Jan - Apr) tuition charges that appear on a student’s ACORN invoice.The payment deadlines depend on whether or not a student is eligible for government financial aid (OSAP) and has deferred their fees on ACORN. Fees that have not been paid by the published payment deadlines are subject to monthly service charges.DeadlineNo government financial aid (no deferral active on ACORN)Government financial aid eligible (deferral active on ACORN)Minimum Payment to Register DueAugust 27, 2024N/A – Defer fees on ACORN by August 27, 2024Unpaid Fall Term Fees DueSeptember 30, 2024September 30, 2024Service Charges Begin on Unpaid Fall Term FeesMid-October (date TBD)Mid-October (date TBD).Unpaid Winter Term Fees DueNovember 30, 2024End of January (date TBD).Service Charges Begin on Unpaid Winter Term FeesMid-December (date TBD).Mid-February (date TBD).Financial Holds Begin on ACORN for Unpaid 2024-25 Session BalancesApril 30, 2025April 30, 2025Payment and deferral ProceduresInvoicesStudents can view their fee invoice and the Minimum Required Payment to Register (MPR) on the ACORN system.To generate a tuition invoice, login to ACORN and click on the ‘View Invoice’ button in the 'Finances' panel.PaymentTuition payments made within Canada can be processed through a Canadian financial institution, or by credit card for a 2.5% Convenience Fee.Payments made from outside of Canada can be completed through Convera and Flywire.The Student Receivables & Accounting Office does not accept payments by wire transfer and/or demand draft/money order and reserves the right to hold or return these payments.Detailed fee payment instructions are available on the U of T Student Accounts website.Tuition deferrals based on government financial aidStudents receiving government financial aid (OSAP) may request a temporary tuition fee deferral by the August 27, 2024 deferral deadline. The deferral allows students to achieve registered status before OSAP funds are deposited into their account on ACORN.Deferrals can be requested by logging into ACORN and clicking on the 'Tuition Fee Deferral' section of the ‘Finances’ panel. You must be eligible for government financial aid to activate a deferral on ACORN.For more information about OSAP payment procedures visit the U of T Student Accounts website.Tuition deferrals based on scholarship/award fundingStudents receiving scholarship/award funding from the University of Toronto or an external award that will be paid to the U of T may request a tuition deferral if arrears from previous sessions are cleared and the award amount is greater than the Minimum Payment to Register amount on the ACORN invoice.Student’s requesting a deferral based on scholarship/award funding must provide the KPE Registrar’s Office with a copy of the scholarship/award letter, a print out of their ACORN tuition invoice and a completed Request to Register Without Payment form by the August 27, 2024 deferral deadline.Detailed tuition deferral instructions are available on the U of T Student Accounts website.Other deferralsFor information and procedures related to tuition deferrals based on third party sponsorship and tuition waivers for staff and dependents of staff, please visit the U of T Student Accounts website.Tuition Refunds Tuition and incidental fee refunds are subject to deadlines that are much earlier than the majority of course drop deadlines. Please refer to the KPE refund schedules posted on the U of T Student Accounts website for details.Program fee refundsProgram fee refunds are only issued if a student withdraws from all courses by the deadlines published in the refund schedule.Students who wish to explore options for program fee refunds should make an appointment with the Registrar’s Office staff as early as possible for assistance.Course-based fee refundsStudents paying tuition fees on a per course basis may be eligible for refunds for dropped courses. Refund rates for courses decline rapidly as the term advances. It is best to make decisions about dropping courses as early as possible in the term to maximize the potential refund.Refund ProceduresInformation about refund procedures for credit balances on ACORN is available on the U of T Student Accounts website.Financial Aid Complete financial aid procedures and resource listings are available on the U of T University Registrar's Office website. Key funding sources and procedures are highlighted below.Ontario Government Financial AidThe Ontario Student Assistance Program (OSAP) provides need-based financial assistance to Ontario residents who are Canadian citizens or permanent residents. Students in full-time course loads of 60 per cent or greater in both terms are considered for both federal and provincial interest-free student loans to assist with educational and living expenses. Information and online application forms are available on the OSAP website.University of Toronto Advance Planning for Students (UTAPS)All full-time students who are Canadian citizens or permanent residents and who are assessed by OSAP as requiring maximum assistance and whose assessed need is not fully covered by OSAP will automatically be considered for this non-repayable grant. Full details about the UTAPS program are available on the U of T University Registrar's Office website.University of Toronto Work Study ProgramThe Work Study Program provides students with the opportunity to develop their knowledge, skills and experience through paid work on-campus. For more information about the Work Study program visit the U of T University Registrar's Office website.Grant ApplicationsOntario residents with unmet financial need beyond their OSAP funding may apply for grants administered by the KPE Registrar's Office. Applications are due by November 1 for consideration in the first round of grants. Electronic application forms will be available on ACORN early in the fall term. Awards and Scholarships The Faculty of Kinesiology and Physical Education offers a wide variety of academic, leadership, and need-based awards to recognize outstanding student achievement. Award descriptions are available in the Undergraduate Program Calendar. Admission ScholarshipsThe Faculty of Kinesiology and Physical Education and U of T offer a variety of admission scholarships ranging from $1,000 to $10,000. Scholarship descriptions are available in the Undergraduate Program Calendar.A separate award application is not required for KPE admission awards. The completed Statement of Interest will be used to determine leadership based admission scholarships.U of T Need-Based Admission AwardsSeveral need-based admission awards are offered by the University of Toronto which require an additional application. For information about these awards, please visit the U of T University Registrar's Office website.Upper Year HonoursEach year a variety of academic and leadership awards are offered to continuing undergraduate students of the Faculty of Kinesiology and Physical Education. Please refer to the Undergraduate Program Calendar for more information about the awards offered.Upper year leadership awards require an application. Application forms are sent to all registered KPE students via email in early Spring of each year. Dean's Student Leadership AwardThe Dean’s Student Leadership Award recognizes students who have demonstrated exceptional leadership in the programs of the Faculty of Kinesiology and Physical Education. Award details and nomination forms are available in January of each year.Athletic AwardsUndergraduate students who compete on a Varsity team are eligible for a variety of athletic awards. Please refer to the Awards and Financial Aid section of the Varsity Blues website for more information.Other AwardsA comprehensive listing of internal and external award competitions available to students studying at the University of Toronto is available on the U of T University Registrar's Office website ​​at the following links.University of Toronto Award Competitions"
year_published = 2025
