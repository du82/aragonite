["https://kpe.utoronto.ca/academics-researchcurrent-studentsgraduate-studiesgraduate-program-requirements/phd-program"]
title = "PhD Program Requirements | UofT - Faculty of Kinesiology & Physical Education"
description = "PhD Requirements as of September 2013The PhD degree program is designed as a four-year program consisting of the completion of course work (1.5 FCE) and other requirements. Students are encouraged to develop a program of study that will enhance their basic understanding of critical areas of study within Kinesiology and have a direct impact on their research program."
full_description = "PhD Requirements as of September 2013The PhD degree program is designed as a four-year program consisting of the completion of course work (1.5 FCE) and other requirements. Students are encouraged to develop a program of study that will enhance their basic understanding of critical areas of study within Kinesiology and have a direct impact on their research program. Doctoral students are also expected to further develop their scholarly and technical research skills so that they may pursue a high quality research project culminating in the presentation of a major formal written dissertation and an internal and external oral defence of their research.Please note that doctoral students must have completed all degree requirements exclusive of final departmental and Senate oral defences by the end of their third year in order to continue in the PhD program. Course Requirements1.0 FCE in Kinesiology or another Department0.5 FCE Statistics or Methodology course (in Kinesiology or other Department)Graduate Seminar Course Additional RequirementsWritten and Oral Comprehensive Examinations.A thesis proposal written under the supervision of a thesis committee and its oral defence before an examination committee.Internal defence of an original thesis written under the supervision of a thesis committee and its oral defence before an examination committee.Senate defence of an original thesis written under the supervision of a thesis committee and its oral defence before an examination committee.Annual meeting of student and supervisory committee.Notes: FCE = full course equivalent [1.0 FCE can mean either one full course or two (0.5) half courses]Direct-Entry PhD Degree RequirementsThe PhD degree (Direct Entry) program is designed as a five-year program consisting of the completion of course work (2.5 FCE) and other requirements. Students are encouraged to develop a program of study that will enhance their basic understanding of critical areas of study within Kinesiology and have a direct impact on their research program. Doctoral students are also expected to further develop their scholarly and technical research skills so that they may pursue a high quality research project culminating in the presentation of a major formal written dissertation and an internal and external oral defence of their research. Course Requirements2.0 FCE in Kinesiology or another Department0.5 FCE Statistics or Methodology course (in Kinesiology or other Department)Graduate Seminar Course Additional RequirementsWritten and Oral Comprehensive Examinations.A thesis proposal written under the supervision of a thesis committee and its oral defence before an examination committee.Internal defence of an original thesis written under the supervision of a thesis committee and its oral defence before an examination committee.Final Oral Exam (defence) of an original thesis written under the supervision of a thesis committee and its oral defence before an examination committee.Annual meeting of student and supervisory committee.Notes: FCE = full course equivalent [1.0 FCE can mean either one full course or two (0.5) half courses]Prior to September 2013 (PhD)The PhD degree program is designed as a four-year program consisting of a combination of course work (3.0FCE), written and oral comprehensive examinations, and original research. Students are encouraged to develop a program of study that will enhance their basic understanding of critical areas of study within Kinesiology and have a direct impact on their research program. Doctoral students are also expected to further develop their scholarly and technical research skills so that they may pursue a high quality research project culminating in the presentation of a major formal written dissertation and an internal and external oral defence of their research. Please note that doctoral students must have completed all degree requirements exclusive of final departmental and Senate oral defences by the end of their 3rd year in order to continue in the PhD program. Overview1.0 FCE required courses2.0 FCE elective coursesComprehensive examinations (both written and oral)Thesis and defence of the thesis 1.0 FCE Required Courses:Each student must complete ONE of the following 0.5 FCE courses, depending on their stream: Biophysical: EXS 5503H Adaptations to Habitual ActivitySociocultural: EXS 5518H Theoretical Issues in the Study of Physical Activity and HealthBehavioural: Students must take at least one of the following: EXS 5513H, EXS 5516H, EXS 5520H or EXS 5521H. Each student must complete a 0.5 FCE statistics/research methods course at the graduate level. Please consult the School of Graduate Studies calendar/departmental websites for such courses.2.0 FCE Elective Courses:Each student must complete 1.0 FCE graduate courses in Exercise Sciences in addition to the EXS required course. Each student must complete a 0.5 FCE graduate course from a department outside Exercise Sciences in addition to their statistics/research methods course. Each student must complete a 0.5 FCE graduate course of their choice, including EXS courses. Find additional information on program requirements in the KIN Student Handbook."
