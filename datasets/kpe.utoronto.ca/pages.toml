["https://kpe.utoronto.ca/academics-researchcurrent-studentsundergraduate-studies/information-first-year-bkin-students"]
title = "Information for First Year BKin Students | UofT - Faculty of Kinesiology & Physical Education"
description = "Welcome to the Faculty of Kinesiology and Physical Education!The faculty, staff and students at KPE look forward to helping you transition into your first year of university. Staff in the KPE Office of the Registrar and Student Services will be available throughout the summer for consultation regarding any issues you may experience.Talk to us early - we are here to help!"
full_description = '''Welcome to the Faculty of Kinesiology and Physical Education!The faculty, staff and students at KPE look forward to helping you transition into your first year of university. Staff in the KPE Office of the Registrar and Student Services will be available throughout the summer for consultation regarding any issues you may experience.Talk to us early - we are here to help!Welcome from the Dean Congratulations on taking the first step in what will be an engaging, inspiring and rewarding journey! You're entering a program that has long history of preparing students to address themajor challenges of our day, at one of the best universities in the world. Public attention has never been more focused on the importance of physical activity to the health and well-being of each of us individually, and of the communities and society in which we live. ​​​​Through our unique programs, you will be given the opportunity to acquire knowledge and skills to play a leadership role in translating that knowledge into practice in an equitable and inclusive way. Outstanding professors, staff, facilities and collaborating organizations are what make our program so great, along with our well-recognized track record of impactful equity, diversity and inclusion initiatives. Our courses are taught by scholars and scientists who bring their expertise and research into the classrooms and teaching labs. As part of your academic course work, you will participate in practical experiences that give you a chance to experience and apply the theories you learn in the classroom. As a student, you have access to the excellent academic resources U of T has to offer, as well as our Sport & Recreation programs and facilities for your own personal engagement in physical activity and sports. I encourage you to take advantage of the many resources our Faculty and University have to offer. The staff members at the Registrar’s Office are keen to help you achieve your academic goals, so don’t hesitate to reach out.Best wishes for a successful and fulfilling first year of studies in the University of Toronto’s Faculty of Kinesiology and Physical Education.Gretchen Kerr,Dean, Faculty of Kinesiology and Physical Education First-Year Welcome GuideThe First-Year Welcome Guide is your main resource for information about key dates, financial aid, housing, course enrolment, tuition fee payment, and key supports at the University of Toronto. We will send you an email when the welcome guide is ready.Click the link below for the PDF version or navigate using the content headings.2025-26 First-Year Welcome Guide (Coming Soon) BKin Course Timetable 2025-26 (Coming Soon) 2025-26 KPE Sessional Dates (Coming Soon)Ready: Preparing for your first yearKey Dates2025 May 1: Deadline to accept your offer of admission to BKin program for international studentsJune 1: Deadline to accept your offer of admission to BKin program for domestic studentsApril - June: Apply for OSAP FundingJune - August: Residence placements sent to qualified applicantsEarly July: Participate in the New Student Welcome SessionTBA: Enrol in your KPE academic Fall '25 & Winter '26 courses on ACORN starting at 6 a.m. ETTBA: Enrol in other division elective course for Winter '26 on ACORN starting at 6 a.m. ETTBA: Tuition fee payment/deferral deadline for the Fall/Winter session. TBA: OrientationTBA: Class being in F (Fall '25 0.5 credit) and Y (Fall '25/Winter '26 1.0 credit) coursesTBA: Student Services FairTBA: Waitlists for F and Y courses close at end of dayTBA: Last day to enrol in F and Y coursesTBA: Program/course fee freeze date (F and Y courses)TBA: No classes - Thanksgiving holidayTBA: No classes - Fall Reading WeekTBA: Last day to drop F coursesTBA: Last day for most regularly scheduled classes in F and Y courses (for Fall term).TBA: Final exams in F courses. Term tests in Y coursesTBA: University closed for Winter Holidays2026TBA: University re-opens & S and Y Academic classes beginTBA: Last day S term course waitlists operationalTBA: Last day to enrol in S courses & Last day to register for the S termTBA: Program/Course fee determination date (S courses)Late January to Early February: Deferred examinations from December 2025January 31: Last date to confirm intention to graduate at June ConvocationTBA: Last date for deletion of Y academic coursesTBA: Family Day - University ClosedTBA: Winter Reading Week; no classesTBA: Last date for petitions which pertain to June 2024 graduationTBA: Last date for deletion of S section code academic courses from academic record and academic grade point averageTBA: Academic classes endTBA: Study BreakTBA: Examination period for KPE and A&S academic coursesTBA: Good Friday - University ClosedMay TBA: Deferred Examinations from April 2025TBA: Presidential Holiday - University Closed; No ClassesTBA: Victoria Day - University ClosedEnable your JOINid Your JOINid gives you access to the University of Toronto’s online applicant community. Enable your JOINid and check the Join U of T site regularly for updates on the status of your application, and any additional information you may need to provide. Please visit the Join U of T website for more information. Accept your Offer of Admission Accept your offer of admission before it expires – follow the instructions in your online admission offer. Places in our program can’t be guaranteed after the acceptance deadline. Accept early and confirm the University has received your response by checking your status at the Join U of T website. Apply for Transfer Credits (if applicable) Transfer Credit Application & Assessment: This application is for current U of T Faculty of Kinesiology & Physical Education students who have taken a post-secondary level course prior to joining the Bachelor of Kinesiology for credit towards their undergraduate program. There is a $31.75 fee to have your transfer credit application evaluated. Check the Transfer Explorer website for information about how your courses from another university may transfer. If you have Advanced Placement (AP) or International Baccalaureate (IB) courses from high school, visit U of T Transfer Credit website to understand how they may transfer to your current degree. STEP 1: PAYMENT Head to the first floor of the Athletic Centre at the Customer and Membership Services Main Office (55 Harbord St.) to make your payment.Clearly state you are paying for a Transfer Credit Application & Assessment ($31.75). You will receive an email with your proof of payment.STEP 2: SUBMIT REQUEST AND PROOF OF PAYMENTSubmit both the completed the Transfer Credit Analysis & Assessment request and proof of payment via the online submission site. Please do NOT fax, drop off or mail in forms.If you have any questions about submitting a request or paying a processing fee, contact the KPE Office of the Registrar and Student Services before submitting the request at KPE Undergraduate Program. STEP 3: FINAL ASSESSMENT RESULTS ARE COMMUNICATEDAn email will be sent confirming your transfer credit analysis & assessment request. Be sure to check your UTMail+ email daily and respond to any requests from the KPE Office of the Registrar and Student Services as soon as possible.If a transfer credit has been approved, you will see this reflected on your ACORN academic history and degree explorer. If you have any questions about understanding your ACORN academic history and/or how to use degree explorer, please book an appointment with an Academic Advisor.You can book an appointment with a Student Advisor via the online Academic Advising Appointment booking site. If you have questions or need assistance with booking an appointment, contact the KPE Office of the Registrar and Student Services at KPE Undergraduate Program or 416-978-3183. Participate in the New Student Welcome Session You are invited to participate in the New Student Welcome Session taking place in early July. In this session, you will receive instructions for course selection and registration. To register, please RSVP to the invitation sent to your email address.Set up your UTORid and UTmail+ (U of T email) It is important to set up your UTORid and UTmail+ before the first day of classes in the fall term. UTORIDYour UTORid is your digital student credential and provides access to online services like:email (UTmail+)course content on QuercusMicrosoft365 applicationslibrary resourceswebinarsnetwork services for international studentsWiFi for those on campus and more.Once your UTORid is activated your JOINid becomes your UTORid.UTMAIL+All U of T students are given a U of T email address through the UTmail+ service. It’s your responsibility to activate and maintain this account.All official University correspondence will be sent to this address. You should also use your UTmail+ account to contact your instructors, staff and other students. This new email address will be automatically updated on your ACORN record. It’s your responsibility to check your UTmail+ account daily.To set up your UTORid and UTmail+, you must be prepared to submit a digital photograph and provide current legal status and identity documents. Learn more information about procedures and required documentation. Pick up your TCard Your TCard is your official University of Toronto photo identification and a TCard is needed to access labs, meal plans and other facilities on campus. After successfully activating your UTORid and UTmail+, book an in-person appointment at the TCard Office to pick up your TCard and attend the TCard appointment with your required documentation. Your documentation must be original and unexpired.Book a TCard appointment at: clnx.utoronto.caFind more information on picking up your TCard on the TCard website. Finalize your Housing: U of T Housing Services RESIDENCE PLACEMENTSIf you maintained your Residence Guarantee, residence placements will be sent to eligible admitted students from June through to August.You’ll receive one formal placement of residence. It’s important that you respond to your residence placement by the deadline stated in the residence placement email. Be sure to check the email account you’ve registered in ACORN, including any junk/spam folders.Messages from the University will only be sent to your new U of T student email address (UTmail+) once it’s active. So make sure you activate your UTmail+ (U of T email). For more information about activating UTMail+, please see "Set up your UTORid and UTmail+" above.To maintain the Residence Guarantee, you must:Submit the First Year Residence Application on StarRez by March 31, 2025 by 11:59 p.m. ETReceive and accept an admission offer from the University by June 1, 2025.CHECK YOUR RESIDENCE APPLICATION STATUSYou can follow the status of your residence application in StarRez.If you meet the residence guarantee criteria and haven’t received placement by mid-August, please email the U of T Housing Services.OFF-CAMPUS HOUSINGTo explore your off-campus housing options, including independent student residences, please visit the U of T Housing Services website. Apply for Financial Aid The University’s Assurance of Financial SupportThe University of Toronto is committed to ensuring that students who are offered admission will have the financial support necessary to allow them to enter and complete their program. This assurance is based on the assumption that Canadian citizens, permanent residents and protected persons will first access the government aid for which they are eligible. For Ontario residents, unmet need is assessed based on OSAP because it provides a uniform method of assessing student need. Unmet need for students from other Canadian provinces is assessed based on the result of their provincial government's student aid programs. Complete financial aid procedures and resource listings are available on the U of T University Registrar’s Office website.THE ONTARIO STUDENT ASSISTANCE PROGRAMThe Ontario Student Assistance Program (OSAP) provides need-based financial assistance to Ontario residents who are Canadian citizens, permanent residents or protected persons (recognized convention refugees). Students with recognized full-time course loads are considered for both federal and provincial interest-free student loans and grants to assist with educational and living expenses. For more information, visit the OSAP website. UNIVERSITY OF TORONTO Financial Aid (UTAPS)UTAPS is for full-time students who receive the maximum government financial aid available but whose funding still doesn't cover all their university costs. UTAPS helps fill the financial gap. Ontario residents must be receiving OSAP to be considered. If you're receiving financial aid from another Canadian province, territory or a First Nations band, you may be eligible for UTAPS too. Full details about this program are available on the U of T University Registrar’s Office website.OTHER PROVINCE FINANCIAL ASSISTANCEStudents who are Canadian citizens, permanent residents, or protected persons (recognized convention refugees) outside of Ontario may be eligible for financial assistance from their provincial government. Applications are usually available in late May or early June. For more information, visit the U of T University Registrar’s Office website.FACULTY OF KINESIOLOGY AND PHYSICAL EDUCATION GRANTSOntario residents with unmet financial need beyond their OSAP funding may apply for grants administered by the KPE Registrar’s Office. Applications are due on ACORN by November 1 for consideration in the first round of grants. For full application instructions please visit the U of T University Registrar’s Office website.OTHER GRANTS AND AWARDSA comprehensive list of other grants, recognition awards and scholarships is available on the Award Explorer website. FINANCIAL AID FOR STUDENTS WITH DISABILITIESStudents with permanent disabilities may receive funds through the Canada Student Grant for Persons with Permanent Disabilities as part of their OSAP funding. In addition, grants are available through the Ontario Bursary for Students with Disabilities (BSWD) and the Canada Student Grant for Services and Equipment for Persons with Permanent Disabilities to help with disability-related supports and services for students with permanent or temporary disabilities. More information is available from the U of T University Registrar’s Office website.Set: Enrolling in your coursesGet to Know ACORN The Accessible Campus Online Resource Network (ACORN) is U of T’s user-friendly and intuitive student web service. ACORN is your main tool for accessing course registration, student account information and student life resources.ACORN ACCESSAccess ACORN using your JOINid/UTORid and password. Your JOINid becomes your UTORid once your TCard is set up. Login via the ACORN website.ACORN ALLOWS YOU TO:Find the courses you need by course code or title using an easy search systemUse an ‘enrolment cart’ to plan your course enrolmentsAdd, drop and modify your course en'''
