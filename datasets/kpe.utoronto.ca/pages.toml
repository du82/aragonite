description = "The Sports Hall of Fame is administered by the Faculty of Kinesiology and Physical Education with the assistance of the T-Holders' Association. It was established in 1987 as part of an ongoing effort to record and celebrate a legacy of athletic excellence at U of T."
full_description = "The Sports Hall of Fame is administered by the Faculty of Kinesiology and Physical Education with the assistance of the T-Holders' Association. It was established in 1987 as part of an ongoing effort to record and celebrate a legacy of athletic excellence at U of T.The permanent Hall of Fame display is located in the A. Gordon Stollery Atrium of the Goldring Centre for High Performance Sport, located at 100 Devonshire Place. It was launched as a digital, interactive display in 2014 to honour all Hall of Fame inductees. View the online Sports Hall of Fame at halloffame.utoronto.ca.For any questions about the Hall of Fame, please contact alumni.kpe@utoronto.ca. Submit a NominationAnyone with an interest in Varsity athletes is invited to submit a nomination for the U of T Sports Hall of Fame. For more information or to nominate an athlete, builder, or team to be inducted into the Hall of Fame, please contact alumni.kpe@utoronto.ca.Support the Hall of FameDonations to support this proud tradition are appreciated: donate.utoronto.ca/hall-of-fame.Hall of Fame Pins and PendantsIf you are a Hall of Fame member, please go to https://is.gd/HallofFamePins and submit your request to receive your pin or pendant. as a mark of your place in U of T’s outstanding athletic legacy."
