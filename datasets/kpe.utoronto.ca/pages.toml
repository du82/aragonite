["https://kpe.utoronto.ca/academics-researchconferences-seminars-symposiapublic-seminars-symposia/kpe-science-cafe-0"]
title = "KPE Science Café: The Consequences of Sports Betting | UofT - Faculty of Kinesiology & Physical Education"
description = "On January 23, 2025, the Faculty hosted a thought-provoking panel discussion on sports betting in Canada as part of KPE's Science Café series."
full_description = "On January 23, 2025, the Faculty hosted a thought-provoking panel discussion on sports betting in Canada as part of KPE's Science Café series.The discussion was moderated by Peter Donnelly and explored the topic from a number of angles, from how betting companies leverage psychological strategies to boost their profits to how sports betting undermines the integrity of sports and pressures athletes to manipulate outcomes. With a special appearance by Senator Marty Deacon, the panel also discussed proposed legislation that aims to create a framework for sports betting advertising.Explore KPE Resources and Research Studies on Sports Betting in Canada PanelistsThe Honourable Senator Marty Deacon was appointed to the Senate of Canada in 2018 and represents the Waterloo region. Prior to her appointment, Senator Deacon served the youth in her community as an educator, consultant and administrator. Alongside her professional career, Senator Deacon has volunteered extensively as an advocate for sport and education.Bruce Kidd is the co-founder of the Campaign to Ban Ads for Gambling, which seeks to persuade the Canadian Parliament to ban ads for sports betting and other forms of gambling, in the same way and for the same health reasons it previously banned ads for tobacco and cannabis. He is the University Ombudsperson, a Professor Emeritus of Sport Policy at the University of Toronto's Faculty of Kinesiology and Physical Education, and the chair of the Academic Guidance Panel of the Future of Sport in Canada Commission.Steve Joordens is a professor in the Department of Psychology at University of Toronto Scarborough. Initially trained as a cognitive psychologist, performing research related to human memory and the distinction between conscious and unconscious influences, his research has shifted to focus on the effective use of educational technologies in general. Darrell Adams is currently the head coach of the Varsity Blues football team at the University of Toronto. He has an extensive track record in coaching at the professional and collegiate level: prior to coaching at U of T, Adams served as the associate head coach with the Waterloo Warriors and defensive line coach and strength and conditioning coordinator with the Carleton Ravens. Adams has also worked with the Hamilton Tiger-Cats in the CFL and served as a guest coach for a number of CFL teams. Peter Donnelly is a Professor Emeritus at the University of Toronto's Faculty of Kinesiology and Physical Education. His research interests include sport politics and policy issues, sport subcultures, children’s rights and athletes' rights in sport, and mountaineering (history). He is the founding Director of the Centre for Sport Policy Studies (1999-2021) and a member of Ban Ads for Gambling."
