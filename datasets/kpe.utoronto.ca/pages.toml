["https://kpe.utoronto.ca/academics-research/office-registrar-and-student-services"]
title = "Office of the Registrar and Student Services | UofT - Faculty of Kinesiology & Physical Education"
description = "Our team in the KPE Office of the Registrar and Student Services is looking forward to helping you. We are available throughout the year for consultation regarding any difficulties you may experience, even if they are not related to academics. We are here to equip you with the supports and services you need to succeed throughout your academic career."
full_description = '''Our team in the KPE Office of the Registrar and Student Services is looking forward to helping you. We are available throughout the year for consultation regarding any difficulties you may experience, even if they are not related to academics. We are here to equip you with the supports and services you need to succeed throughout your academic career.How to Contact UsGeneral Inquiries: Email the KPE Undergraduate office | 416-978-7347Graduate Students: Email the KPE Graduate office | 416-946-3645Recruitment and Admission InquiriesAre you a future student that has questions about our undergraduate and graduate programs? Connect with our Recruitment and Admissions team by phone or email:Recruitment and Admissions: Email the KPE Recruitment office | 416-978-0278Hours and Location The Office of the Registrar and Student Services is currently providing services through a combination of virtual and in-person delivery. We are located at 320 Huron Street, in the Clara Benson building in BN110, behind the yellow door.The office is open:Monday - Thursday: 8:30 a.m. - 12 p.m. and 1 - 4:30 p.m.Please note the office is closed daily from 12 p.m. - 1 p.m., Monday - Thursday.Friday: 8:30 a.m. - 12 p.m.Mailing AddressThe official mailing address for KPE's Office of the Registrar and Student Services is:Faculty of Kinesiology and Physical EducationOffice of the Registrar & Student Services55 Harbord St.Toronto, ON M5S 2W6Canada Fax NumberThe fax number for KPE's Office of the Registrar and Student Services is: 416-971-2118Registrar's ServicesThe Office of the Registrar and Student Services offers a variety of services to Kinesiology students, including:Degree Audits If you have any questions or concerns about degree planning and progression, or your Degree Explorer assessment, we recommend that you make an appointment with a Student Advisor by emailing the KPE Undergraduate office. KPE e-NewsElectronic newsletters are sent to all KPE students by email on a regular basis. These newsletters contain important and time-sensitive information about procedures, policies, deadlines etc. It is your responsibility to check and read your UTmail+ account regularly.Letters of ConfirmationA Letter of Confirmation, also referred to as a Proof of Enrolment, Confirmation of Enrolment or Enrolment Verification, is an official document that will state your enrolment in courses for a specific academic session. You may need a Letter of Confirmation for an RESP, scholarships, employment or immigration purposes.The information that can be included on your Letter of Confirmation includes:Faculty of study (Faculty of Kinesiology & Physical Education)Program of study (Bachelor of Kinesiology)Year of study (Year 1, Year 2, Year 3, Year 4)Course load (full-time, part-time)Enrollment status (invited, registered)Start date and end date of chosen academic sessionSTEP 1Review these steps to generate a Letter of Confirmation on ACORN.If you are unsure if the Letter of Confirmation is the letter you are looking for, please email undergrad.kpe@utoronto.ca and provide details on what you are requesting and for what purposes (e.g. bank request, insurance, study permit). RESP Forms / Other enrolment confirmation forms Registered Education Saving Plan confirmation forms for the current academic session can be completed and signed in person at no extra charge. Confirmations for the next academic session will be completed after a student’s academic year and standing have been determined in mid-July. All pre-filled forms should be submitted to the online form submission site. Please do not fax or mail forms. Please submit your RESP form with a filename as follows:FirstName LastName student id number RESP form.pdf(example: "John Smith 1001231234 RESP form.pdf") Letters of Permission Letter of Permission is for current KPE students who would like to take courses from another university for credit towards their Bachelor of Kinesiology degree during their studies in the Bachelor of Kinesiology. There is a $42 fee for the Letter of Permission evaluation. Request a Letter of Permission by following these steps:STEP 1: PAYMENT Head to the first floor of the Athletic Centre at the Customer and Membership Services Main Office (55 Harbord St.) to make your payment.Clearly state you are paying for a Letter of Permission ($42.00). You will receive an email with your proof of payment.STEP 2: SUBMIT REQUEST AND PROOF OF PAYMENTSubmit both the completed Letter of Permission Request and proof of payment via the online submission site. Please do NOT fax, drop off or mail in forms or proof of payment. Change of Name or Gender You may use this form to make one of the following changes in your official academic record:Correct a mistake in your nameAdd, remove, or change middle name(s) or middle initial(s)Change your name to something different from your formal legal name (i.e. preferred name)Change your name prior to graduationChange your name on an existing diploma or certificate (requires supporting documentation)Change your genderDownload the Change of Name or Gender Request FormPlease do not fax or mail forms. All completed forms should be emailed to undergrad.kpe@utoronto.ca.Change your preferred display name on Quercus and your U of T email. Changes represented will display after approximately 24 hours. Submission of Standard First Aid and CPR-C Certificate (PAO900H1) Submit your Standard First Aid and CPR-C certificate (SFA and CPR-C) via the online submission form: SFA and CPR-C Certificate submissionPlease submit your with a filename as follows: "student id number FirstName LastName SFA and CPR-C".(example: 1001231234 John Smith SFA and CPR-C.pdf".)Review KPE Program Requirements: PAO 900H Standard First Aid and CPR Level C. Continuation of Interest-Free Status - Schedule 2 Form Past recipients of OSAP funding who are studying full-time and are not receiving OSAP funding for the current year can complete a Schedule 2 Form in the KPE Registrar's Office. It is best to complete these forms by the end of October.TranscriptsCurrent students and recent alumni can order official transcripts online using the ACORN system. A valid UTORid and password are required to login.Pre-UTORid alumni can order official transcripts online using Alumni Transcripts. A valid student number and PIN are required to login.Fees apply per transcript. Courier options are available for a higher fee to ensure quick delivery. More information about ordering transcripts is available through Transcript Services.'''
