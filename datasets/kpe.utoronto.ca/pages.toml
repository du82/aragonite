["https://kpe.utoronto.ca/about/working-kpe"]
title = "Working at KPE | UofT - Faculty of Kinesiology & Physical Education"
description = "Are you looking for challenging, meaningful work in a supportive and diverse environment? Work where the world comes to think, discover and learn.  Consider a career at the Faculty of Kinesiology and Physical Education (KPE) at the University of Toronto. Join one of the largest employers on campus, in our mission to advance healthy living through inclusive movement."
full_description = "Are you looking for challenging, meaningful work in a supportive and diverse environment? Work where the world comes to think, discover and learn. Consider a career at the Faculty of Kinesiology and Physical Education (KPE) at the University of Toronto. Join one of the largest employers on campus, in our mission to advance healthy living through inclusive movement.The University of Toronto is proudly recognized as one of Greater Toronto's Top Employers (2025), Canada’s Best Diversity Employers (2024), and Canada’s Greenest Employers (2024).By applying to work at KPE, you will have the opportunity to participate in health and movement-centered research, help impart excellent graduate and undergraduate programs in our interdisciplinary areas, deliver co-curricular physical activity and sports programs, or support our students representing the University of Toronto as part of our Varsity Blues athletes. Faculty PositionsTenure steam, continuing teaching stream, and contractually limited-term appointments of one year or longer are posted to the University's Faculty Opportunities page. NOW HIRING: We are currently inviting applications for a tenure stream appointment in human biomechanics, at the rank of assistant professor. The deadline to apply is January 23, 2025.We are also inviting applications for a tenure stream appoint in biostatistics, at the rank of assistant professor or associate professor. The deadline to apply is January 23, 2025.Explore faculty positions at U of TStaff PositionsEmployment opportunities for appointed staff roles within the Faculty are posted to the University's Careers at U of T website. Staff roles for our Sport & Recreation team, as well as our academic team, are posted to the site.Explore staff positions at U of TStudent and Casual PositionsThe Faculty of Kinesiology and Physical Education is one of the largest employers on campus, with hundreds of part-time, casual and work study employment opportunities for students from all faculties. Whether a paid casual staff member, a work-study student, or a volunteer, students can apply their learning toward the University’s Co-Curricular Record (CCR).The Faculty also offers student staff training through a variety of required and recommended courses. Hiring managers will communicate which courses staff must take based on the area of the Faculty in which they will work.Explore student and casual job opportunities at the FacultyThe University of Toronto is strongly committed to diversity within its community and especially welcomes applications from racialized persons / persons of colour, women, Indigenous / Aboriginal People of North America, persons with disabilities, LGBTQ persons, and others who may contribute to the further diversification of ideas."
year_published = 2025
