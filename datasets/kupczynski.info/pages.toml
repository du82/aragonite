title = "Diagnose SSD failures | Igor Kupczyński"
description = "Igor Kupczyński on software engineering."
full_description = 'How to minitor health of SSD drives, case study on my failed Kingston SUV500MS480G.I use my old Samsung Series 7 ultrabook for some personal tasks. It originally had 120 GB SSD, but I’ve upgraded it recently to Kingston 480GB SSD.I’ve first installed Ubuntu 18.04, but then upgraded to 18.10. Everything seem fine, but after few hours of usage and a restart it started complaining about invalid file permissions. I don’t have logs, as at this point I though — ok, a botched upgrade — we can reinstall, no big deal. Reinstalling is not a big deal, because most of the data is in the cloud already, and I maintain a collection of scripts to setup the software I need.Then after a week, ubuntu failed to start. I’ve boot a live usb, mounted the drive and fsck.ext4 it. There were some errors, but not too many. After that, ubuntu started again, but only in a text mode — GDM failed to started.At this point, I’ve started suspecting the new SSD. But how to check if your SSD maybe faulty?Badblocks? #The SSDs use wear leveling, contain redundant blocks and employ various techniques to improve their reliability and increase their live span. It means that the physical address and the logical one exposed to the operating system is different. The translation being done by the disk controller.It also means that the traditional techniques, like using badblocks are not really useful — the disk controller may detect a read failure and reroute the block somewhere else.Not only it doesn’t help, it may even hurt the drive as writing and reading the same block over and over again increases the wear of the drive.There is not that much info on the internet on the usage of badblocks with SSDs. This stackexchange comment is a little gembadblocks is probably not the best tool to unleash on an SSD as internally, the a read-write cycle of a single (small 512 Byte) badblocks level-block will cause the SSD to reallocate/erase a large (512 KiB) SSD-level block again and again, leading to excessive wear and tear (See The Anatomy of an SSD). One should probably set the blocksize: badblocks -b 524288. A supersimple test is trying to read the entire SSD using dd if=/dev/sda of=dev/null. There may be vendor-specific tools too, check the Internet. My Samsung diagnostics didn’t bark though.David TonhoferAnd an answer belowSSDs manage their own bad blocks internally and also use wear levelling to distribute use; the block addresses sent to the system are virtual. Therefore, none of those blocks should test bad, and if they do, some functioning of the drive has failed.S.M.A.R.T #Most modern hard drives have a built-in monitoring system called S.M.A.R.T. It monitors the various parameters of the drive and exposes various metrics about the drive. It also allows to run a self-check test.To work with S.M.A.R.T. on linux we use smartmontools.First we need to install themsudo apt install smartmontools Then we can use it to display basic infosudo smartctl --info /dev/sda More details are available with the --all (or -a).Testing the drive #S.M.A.R.T. allows to run a self-test on the drive. There are three types of the test — short, long and captive (details in the manual). I was interested in the long onesudo smartctl -t long /dev/sda It gives you an estimation when the test will be done. Then you can query the result of the test (and other attributes recorded by the drive).sudo smartctl -a /dev/sda I’ve run the test a couple of times with few hours between them. I’ve also accessed the data between the runs (I was curious how critical the failure was).Here is one of the early results:smartctl 6.6 2017-11-05 r4594 [x86_64-linux-4.17.0-kali1-amd64] (local build) Copyright (C) 2002-17, Bruce Allen, Christian Franke, www.smartmontools.org === START OF INFORMATION SECTION === Device Model: KINGSTON SUV500MS480G Serial Number: 50026B77821C2188 LU WWN Device Id: 5 0026b7 7821c2188 Firmware Version: 003056RA User Capacity: 480,103,981,056 bytes [480 GB] Sector Sizes: 512 bytes logical, 4096 bytes physical Rotation Rate: Solid State Device Form Factor: 2.5 inches Device is: Not in smartctl database [for details use: -P showall] ATA Version is: ACS-4, ATA8-ACS T13/1699-D revision 6 SATA Version is: SATA 3.1, 6.0 Gb/s (current: 6.0 Gb/s) Local Time is: Mon Oct 29 22:23:43 2018 UTC SMART support is: Available - device has SMART capability. SMART support is: Enabled === START OF READ SMART DATA SECTION === SMART overall-health self-assessment test result: PASSED General SMART Values: Offline data collection status: (0x00) Offline data collection activity was never started. Auto Offline Data Collection: Disabled. Self-test execution status: ( 0) The previous self-test routine completed without error or no self-test has ever been run. Total time to complete Offline data collection: ( 5) seconds. Offline data collection capabilities: (0x71) SMART execute Offline immediate. No Auto Offline data collection support. Suspend Offline collection upon new command. No Offline surface scan supported. Self-test supported. Conveyance Self-test supported. Selective Self-test supported. SMART capabilities: (0x0003) Saves SMART data before entering power-saving mode. Supports SMART auto save timer. Error logging capability: (0x01) Error logging supported. General Purpose Logging supported. Short self-test routine recommended polling time: ( 2) minutes. Extended self-test routine recommended polling time: ( 5) minutes. Conveyance self-test routine recommended polling time: ( 0) minutes. SCT capabilities: (0x003d) SCT Status supported. SCT Error Recovery Control supported. SCT Feature Control supported. SCT Data Table supported. SMART Attributes Data Structure revision number: 48 Vendor Specific SMART Attributes with Thresholds: ID# ATTRIBUTE_NAME FLAG VALUE WORST THRESH TYPE UPDATED WHEN_FAILED RAW_VALUE 1 Raw_Read_Error_Rate 0x002f 100 100 000 Pre-fail Always - 14737 5 Reallocated_Sector_Ct 0x0033 100 100 010 Pre-fail Always - 2 9 Power_On_Hours 0x0032 100 100 000 Old_age Always - 81 12 Power_Cycle_Count 0x0032 100 100 000 Old_age Always - 67 100 Unknown_Attribute 0x0032 100 100 000 Old_age Always - 116608 101 Unknown_Attribute 0x0032 100 100 000 Old_age Always - 18880 170 Unknown_Attribute 0x0032 100 100 000 Old_age Always - 2 171 Unknown_Attribute 0x0032 100 100 000 Old_age Always - 0 172 Unknown_Attribute 0x0032 100 100 000 Old_age Always - 0 174 Unknown_Attribute 0x0032 100 100 000 Old_age Always - 7 175 Program_Fail_Count_Chip 0x0032 100 100 000 Old_age Always - 0 176 Erase_Fail_Count_Chip 0x0032 100 100 000 Old_age Always - 0 177 Wear_Leveling_Count 0x0032 100 100 000 Old_age Always - 42 178 Used_Rsvd_Blk_Cnt_Chip 0x0002 100 100 000 Old_age Always - 1 180 Unused_Rsvd_Blk_Cnt_Tot 0x0002 100 100 000 Old_age Always - 1288 183 Runtime_Bad_Block 0x0032 100 100 000 Old_age Always - 0 187 Reported_Uncorrect 0x0033 100 100 000 Pre-fail Always - 2 194 Temperature_Celsius 0x0022 034 100 000 Old_age Always - 34 (Min/Max 22/38) 195 Hardware_ECC_Recovered 0x0032 100 100 000 Old_age Always - 14737 196 Reallocated_Event_Count 0x0032 100 100 000 Old_age Always - 2 197 Current_Pending_Sector 0x0032 100 100 000 Old_age Always - 0 199 UDMA_CRC_Error_Count 0x0012 100 100 000 Old_age Always - 0 201 Unknown_SSD_Attribute 0x0032 100 100 000 Old_age Always - 0 204 Soft_ECC_Correction 0x0032 100 100 000 Old_age Always - 14735 231 Temperature_Celsius 0x0032 100 100 000 Old_age Always - 0 233 Media_Wearout_Indicator 0x0032 100 100 000 Old_age Always - 377 234 Unknown_Attribute 0x0032 100 100 000 Old_age Always - 221 241 Total_LBAs_Written 0x0032 100 100 000 Old_age Always - 264 242 Total_LBAs_Read 0x0032 100 100 000 Old_age Always - 96 250 Read_Error_Retry_Rate 0x0032 100 100 000 Old_age Always - 14735 SMART Error Log Version: 0 No Errors Logged SMART Self-test log structure revision number 0 Warning: ATA Specification requires self-test log structure revision number = 1 Num Test_Description Status Remaining LifeTime(hours) LBA_of_first