description = "Igor Kupczyński on software engineering."
full_description = "Conference notes.Geecon 2018 was an important event in Center- and Eastern- European JVM conference agenda. It was over a year since I’ve attended my last non-elastic related event so I thought it is a great venue to pick up some ideas and look where the industry is heading nowadays. And what a great venue it was!In this pots I’ll present mostly raw notes I’ve took during the talks. If some of the ideas stick with me, I may explore and refine them later on. Oh, there where 4 concurrent talks at most of the slots, so I can cover only a subset. So the notes are uncomplete and may be misleading. Proceed at your own risk :)Table of ContentsGeeCON #10BoothsDay 1Innovate or Die … or Don’tA War of Words: Self-Awareness for IntrovertsCreating Secure Software: Benefits from Cloud ThinkingWhat the annotations done to us?gRPC vs RESTStarting with Ethereum, a developer approachFn Project — an open source container native FaaS platformKotlin coroutinesConference partyDay 2Demystifying Java 9 featuresThe future of JavaA crash course in modern hardwareModern SQL: evolution of a dinosaurEngineering architectureUsing an open source library? Beware of vulnerabilities!Nothing but Models: Quest for the Roots of ComplexityManage Yourself!Day 3Deep dive into the Eclipse OpenJ9 GC technologiesClass Data SharingJava Memory Model Unlearning ExperienceBlockchain more than BitcoinNoSQL Means No Security?QWERTY or DVORAK? Debunking the Keyboard Layout MythsUsing Reactive APIsConclusionsGeeCON #10 #It was a tenth, anniversary GeeCON. Hence the cake:I think it was a great event, with lot of interesting talks and good speakers. I had a very good time and feel it was three days well spend. Props for the organizing committee for all their hard work on GeeCON over the years.Booths #Well, I’ve attended most of the sessions, so I didn’t really have the time to visit and chat with majority of the folks there, but a honorable mention goes to zooplus. They are main pet-product supplier for some of my friends and I was surprised to learn that then have an office in Krakow with few dozens of software engineers :).A lot of big financial institutions were present, it’s good to see they base a sizable chunk of their IT operations in Poland. It is a tendency that we’ve seen for quite some time, but looks like with Brexit it is not slowing down.Allegro which is headquarterd in Poznań, my home town, and has offices in 6 or 6 major Polish cities was quite strong.Scala-wizards from Virtuuslab where also present, hence the nice stickers.Day 1 #Innovate or Die … or Don’t #Main sponsor — EY — keynote.A War of Words: Self-Awareness for Introverts #Second keynote.A strange talk, coming from Cliff Click, based on his realization that he can’t process emotions and talk at the same time — find the right words at the same time. The talk gave some examples of emotional responses of an introvert during various stressful situations, like being verbally assaulted or … salary negotiations.Story about emotions when someone shouts at youCan’t do verbal and emotional processing at the same timeI don’t have any words until I’ve processed the emotionsSolution: memorize beforehandI need space. I’m leaving. and leaveFind some peaceAftermath Stress doesn’t go away so I want to attack someone (dog, friend, someone safe to attack)solution: physical activity to let the adrenaline bun outkept what happened: a fool attacked me; move on; what can I learn?talk to his bosstalk to your fiends (or whatever makes you sort it our)More storiesBrainstorm: ack the loud persons (“Tom, I’ve heard youve suggested XYZ”), make space for the quite folks (“Anyone else wants to chime in?”)AspectsFarmer - enjoys hard work (“today I built a house”)Wizard - “smart work” (“got that guy working today”)Worrier - enjoys fight and its spoils (salesmen, ceos, layers)Know your and other strengths, compensate for the weaknesse.g. programmers / introverts are usually not warriorsppl labelsgreen (safe to be around)red (unsafe; unreasonable demands); not “bad in general”, but “bad for me”yellow :: folks in the middlechange comes from within (even if I love someone I can’t change them; and vice versa)you can’t read someone else mind => broken expectations, speak up maybe they will changesalary negationsHR job is to get your skills at a good price, no emotions, no hard feelingbut for you it is your level of lifeack it is a fight / conflict; polite, but still a fightprepare for the fight :: preparationknow thy worth (glassdoor, books on negotiation and interviewing)BATNAtrain the warrior muscle :: practice - get the partner to play the HR door (power seat, office) - play out the negotiations - ack your emotions when you get the low-ball - you don’t need to ans “how much do you make”, you can say “I look for XYZ, I contribute ABC, etc.”)Creating Secure Software: Benefits from Cloud Thinking #Nice talk from Daniel Sawano. He preached the concept of rotating secrets often, and reiterated some important concepts in cloud apps security.Cloud12th factor appcloud-native (designed to be run on pass)Configurationstore the configuration in the environmentas opposed to in code (no audit trail, no idea who has an access to it)not in resource files (same problems as with code; even if it lives only on server; encrypting the files create new set of problems — where to put the encryption key)the platform creates the env and injects the credentials to the envaudit trail managed by the platformno sharing secrets (only sys-admins see the secrets not the devs)encryption is still not solvedInterlude: Confidentiality Integrity Availability — CIASeparate processesRun your app as a separate stateless processesstateless processesavailability (easy to add / remove instances)integrity (easy to kill misbehaving instances)separate deployment and runningso you can run processes with low privilege userprinciple of least privilegecommunicate via backend servicesbecause app can be stateless (the state is in the backend service)stateless leads to, again, A and Iadministrative tasksinstead of terminal or sql access create admini processes or apisLoggingUse logging as a servicelogging to disk — challengesmay contain sensitive informationaccess not controlled, no audit trail, possible illegal accesssimilar problems as with resource filesI — how do we know if the log file was not changed or deletedA — if the appp is replaced the logs are lostlogging as a servicesend the logs straight to the service that accepts the log eventsthe logging framework should support it (don’t write a new one)Solves CIAThe three R’s of enterprise secRotatethe secrets every few minutes or hoursRepaveservers and apps every few hoursfrom a known good state (base image, container, etc.)rolling deployments to eliminate downtime (start new, kill old)burn old instancesrepave the host as wellRepairfew hours after a patch is availableno incremental updatesapplies to both os and apps, dependenciesDiff from the classic deployment: to minimize the risk you increase the changethe system that stays static for a long of time is a good targetever changing software is the nemesis of the persistent threatsSolutions:ValutBookbit.ly/secure-by-designComments:Basics/core but I liked itI should watch the talk from previous yeargood paceclear structureWhat the annotations done to us? #This talk by Adam Warski from software mill was dear to my heart. How the modern frameworks abuse annotations and offered some alternatives, especially in the java 8+ world.@adamwarski reveals at #geecon that annotations are not only ugly. They were also tested on animals! #petclinic #spring pic.twitter.com/XiY4vctGwd— Jarek Ratajski (@jarek000000) May 9, 2018successful java featuretransformed java programming in a positive waybut don’t we go to far?historyintro 2004replaced xmlwhy?express metadataclasses, methods fields description @Entityexpressing cross cutting concerns @Transactionalorchestrated thee application @Injecteasy to introduceseparation (@, coloring)close to the referenced elementsinspectable statically and at run timepopular is not always bestAdam claims that in java <= 7 world @@@ are the local optimum — better than xml or dynamic typing; maybe there is something even better in java 8+?@@@ - is an embedded mini language, interpreted at runtimecan’t be mixed with the language (e.g. no for loops, et.c)we end up programming the annotation interpreters with annotationsPatterns that emergedfear of new … ()DI, we delegate instance creation to the containersalt: manual dependency injections (new, per-package scope), also see Jakub Nabrdalik talk on hexagonal architecturefear of public static void main()class path scanningthe container picks stuff automatically, e.g. mongo integration; convenient for rapid bootstrapping at the convenience of the readertrade certainty & control for fast and convent bootstrapexplorability is important; @annotations cloud itcode should be easy to navigatego to definitionunderstand what services are used, whats the ordering, etc.metadata mappingentities, json, endpointsmaps java model to some external thingyalt (picture)just use javametadata is first classsingle language for code and meta-datacan be generated programmaticallyannotationmania.com Thanks to @Annotations, @Progress in @UnstoppableJarek Ratajski on the same subjectAre ppl actually doing it?sparkjava.comjooq.orgfunctional web framework in spring 5langsscalamacros && implicitsceylontype-safe metamodelgRPC vs REST #Two software engineers:Alex Borysov from GoogleMykyta Protsenko from RokuNicely paced talk, one of the speakers acted as a gRPC fanboy and the other as someone who is satisfied with REST. They took turns speaking and illustrated the talk with an elaborate demo. I enjoyed that one.RESTnot json over httpstate transfer (client has the state, server is stateless)gRPCrpc frameworkhttps2 is transport protocolcncf.iogRPC is not RMIDo we compare apple to oranges?uServicesdiscoverload balancefault tolerancelet’s write some code RESTgRPCis about APIs, you start with protobuf descriptionthen :magic: code generationnon-blocking api: stream observer for async callsstreaming responsesJavaRX ???deadline propagationzipkin for distributed tracingdemoStarting with Ethereum, a developer approach #Note for future reader — it’s 2018 and a day without crypto/blockchain is a day wasted.Nevertheless, nice talk from Nicolas Fränkel — presented smart contract basics and with an extensive live demo.Blockchain propertiesImmutableTransparent…Top 10 by market cap coinmarketcap.commost interesting stuff you can do with bitcoin: buy and selleth allows you to code on a blockchainthen deploy on the blockchainthen call from outside of the brokchainEVMaccount typesexternally owned accountcontracteth is like a database, just state, nothing happens of its ownyou can interact via transactionstransactions to contracts are similar to stored procedureetherum byte codesolidity to generate the byte codestatic typesinheritancelibrariesuser defined typesremix: super basic cloud idepure function - no writes on the blockchainyou pay for writesdeploymenthow to test? test network vs real networkrikebytruffletesting “framework”Fn Project — an open source container native FaaS platform #David Delabassee from Oracle presented Fn, a function-as-a-service from Oracle.Kotlin coroutines #Marcin Moskała presented this new feature of Kotlin. He actually did a deep dive, and showed how the corutines are implemented.Conference party #The talks ended in the evening and a party in Hala Główna followed. I had a good time and some interesting conversations with other conference attendees. However, I think this was the weakest part of the event 👎. The pub was nice and hipster, but the music was too loud to sustain a good conversation and the speakers’ dinner was held at the same time in a different place. I feel like the split was a bit artificial and alienated the speakers. Now, I don’t mind an extra speakers’ dinner, but it cloud have been held on the day #2. Don’t get me wrong, I had a good time and really enjoyed the conversations, but I feel it cloud have been so much better.Day 2 #Demystifying Java 9 features #Very thoughtful talk by Ionut Balosin. He listed some of the important java 9 features and presented his benchmark results. Good talk both as a tour of the features and in giving suggestions on when to use them.private interface methodsprivate iface methods ==> invokespecial opcodedefault is not a bytecode keyword, only at the java code levelprivate static interface methods ==> invokestatic (same as other static calls)/an example of private interface method in deference in lambda, but too fast to follow with notes/strings in java 9-XX:+CompactStrings is enabled by defaultwhich means LATIN1 is used if possible and UTF16 if not (the default pre java 9)BTW the string max size for UTF16 is Integer.MAX_VALUE / 2string constructionit tries latin1, if it fails switches to utf16, so if you have a lot of utf16 there is a perf costso if majority of the strings are utf16 consider disabling compact stringschar[]: if byte backed latin1 string is asked for char or char[] there is a perf cost due to conversion; the impact is minimal thoughString.eqauls()if the coders are different no need to compare bytes :)no downsides to thatthere are some improvements in string concatenationsnot always string builder is usedthe strategy is being selected at runtime, not at the byte code level, so there maybe even more optimizations in the futurestack walker apilazy stack frame accesslimit depthfilter framessuper useful and performant for deep stack tracescollection factory methodsList.of()a lot of redundant methods (with 0 to 10 arguments; 11+ varargs)when you call a method with varargs there is an overhead with allocation of an array on stackalso there are custom List1 and List2 wrappers without an array (array in java is an array of references, so this way we skip additional dereferencing)offers better performance than unmodifiable listSet.of()similarMap.of()similar (but for pirs)Thread.onSpinWait()suggests that the thread busy waits on a condition, that will happen shortlyhint for a schedulerit compiles to x86 PAUSE instructiondelays, but doesn’t release the CPU spliceContended locks in Java 9improved performance with synchronized methods (when a critical section exclusivity is guarded by a monitor).The future of Java #Tobi Ajila introduced projects Valhalla and Panama. I’m super excited about Valhalla :)current challengesmem latency is the biggest challenge in cpu performancecompliment latency tableidentityobjects have identity, if the state changes it is still the same objectbut you not always need that, but you always pay the priceproblem with references - pointer chasingsynchronizationevery object can be locked, so every object needs a monitorimagine the object array, each object has a header and a monitorhardware prefetchseq access with a primitive array prefetches next itemswith objects "
