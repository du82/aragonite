["https://kupczynski.info/posts/chamberconf"]
title = "Chamberconf 2016 | Igor Kupczyński"
description = "Igor Kupczyński on software engineering."
full_description = "The only fixed item on the schedule is the time of the diner!I’ve just came back from Chamberconf 2016. It is quite an unusual conference on the Polish Java scene. It is small — around 80 people total. It is held in a palace, this year in Pałac Łagów. But most importantly, there are no sponsors and the form is not very strict.The idea is to promote and facilitate informal discussions around the topics covered by speakers or any other JVM or CS related topcis. I think this year they met the expectations. There where some nice talks and tons of good discussions.Some interesting subjects I’d like to explore more:More ponies! Jarek Pałka gave a short intro to the pony lang. I like its approach to avoid deadlocks and synchronization issues during compilation time.Fun with Arrows playing with railway oriented programming in scala. Some interesting concepts, but I definitely need more time and focus to digest them.no-server architectures by Jarek Ratajski — he does some cool stuff with ScalaJS and browser clients. They communicate without a server (actually, it is a thin jetty acting as a router), there is no DB, it is all event driven and with a very weird persistence (or no persistence at all, depending on how do you look at it). And Jarek does this while working for a insurance firm in Switzerland. Nice :-)This was a good fun and I’m happy that I’ve attended. Props for the organizers for making it happen 🦄!Plus we had tank bots!Final battleA video posted by Chamberconf 2016 (@chamberconf16) on Mar 6, 2016 at 6:46am PST>> Home"
