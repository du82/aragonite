title = "Learning VIM with Spacemacs | Igor Kupczyński"
description = "Igor Kupczyński on software engineering."
full_description = '''I just don’t grok the vi (yet).Three weeks ago, I’ve ditched most of my emacs config and installed spacemacs. The main driver was that I wanted to try modal editing instead of emacs key chords. I could’ve tried vim of course, but I’m already invested in emacs and feel at home there.Evil-mode #Luckily, there is a brilliant vim emulation in emacs, called evil mode. I didn’t want to spend too much time configuring it though plus I have no idea which vim plugins ported to emacs are worth looking at, so I’ve given spacemacs a go. Spacemacs is a distribution of emacs preconfigured with evil and with an extensive documentation.Actually, I’m positively surprised how polished it is. Note: I’m using develop branch. Whether you’re an emacs user who wants to try vim-style editing or a vim user who wants to switch to emacs and its superior package ecosystem (well, I just <3 magit) then spacecmacs is worth giving a shot.Note to future self: doom-emacs is another evil-preconfigured distribution which gets a lot of good feedback recently.Zen of Vim #The only problem is that I just don’t know vim :) Of course, I can change a config option on a remote server or scroll through a config file. But my vim knowledge is super limited, I don’t know useful shortcuts or even the philosophy.I’ve found this a nice post on StackOverflow about the Zen of vim. This motivated me to go through the first series of wonderful vim screencast by Derek Wyatt. My notes form the videos are below in case I’ve ever need to reference them.How do I like it so far? #Well, the modal editing is quite a change. I think that after three weeks I’m still a bit less efficient. Actually, the navigation in normal mode feels quite efficient, even if I don’t have the muscle memory yet. I struggle a bit more with writing (like this blog post), the mental shift from modeless, chord-full editing is a bit harder.On the upside, there is a good IntelliJ plugin emulating vim, so I can work on my muscle memory more :) I use IntelliJ to write Java / Scala at work.Again, the Derek Wyatt’s set of videos was super helpful (I’ve checked the novice, for now, once I’m comfortable with that I’ll probably go further).What’ve started as an experiment, to see if there is a better way may become may permanent mode of operation. Stay tuned.Learning to vi #Favorites #Some of my favorite vi / spacemacs tricks* # — search for word under cursor forward / backwards.qa q @a — start recording macro under a, finish recording, replay. Of course emacs has macros as well, but the vi-style shortcuts are super easy to remember and I use them more often.:%s/from/to/g — search and replace in the buffer. Optional c for confirmation.C-v — visual block selection. Also, the commands you perform work in a multicursor way.. — repeat last editing command.Vim Videos by Derek Wyatt #http://derekwyatt.org/vim/tutorials/BASIC Movement (Screencast 1) #KeyDescriptionh j k larrows0 $start / end of linew Wnext word / WORDe Eend of word / WORDb Bstart of word / WORD backwardsge gEend of previous word / WORDf<char>follow — search for next occurrence of F<char>follow backwardst<char>until — similar to f but places the cursor beforeT<char>until backwards;repeat f/F/t/T movementgggo to the topword: keyword, doesn’t include ., _ and other special charactersWORD: up to next spacecount<operator>: the movement commands can take count before themBASIC Movement (Screencast 2) #KeyDescriptionC-f C-bfull page forward / backwardC-u C-dhalf page up / downH M Lhead / middle / last line on screengg Gtop / bottom17Ggo to line 17* #search for word under cursor forward / backward (then n / N)/<term> ?<term>search for forward / backwardszzcenter on screenBasic Movement (Screencast 3) #KeyDescription]] [[next / previous { in 0th column][ []next / previous } in 0th colunn%matching parentesis:markslist current marksm<char>mark position as '<char>jump to line of mark at ^\<char>jump to line and column of mark ''jump to previous locationBasic Editing (Screencast 1) #KeyDescriptioni Istart inserting under the cursor / at the beginning of the linea Aappend after the cursor / the lineo Oopen line below / above currentx Xdelete / backspaced<motion>delete (e.g. dw delete word)dddelete line.repeat last editing commandc<motion>change (e.g. cw change word)Cchange to the end of the lineRreplace (overwrite) moderreplace character under cursorssubstitute (replace a character and put you into insert mode)Schange whole lineBasic Editing (Screencast 2) #KeyDescriptionyy Yyank liney<motion>yank ppaste after (cursor / line)Ppaste before (cursor / line)J gJjoin line / without spacev Vvisual selection by character / lineC-vvisual block (then I to insert at the beginning, etc.)gvre-do last visual selectionWorking with many files #A bit less useful from spacemacs perspective, but surprisingly most of the keys still work; I’ve aggregated the screencasts hereVimeo #1Vimeo #2 (not applicable to spacemacs)Vimeo #3 (about windows, surprisingly applicable)KeyDescription:lslist buffers (helm in spacemacs):b <name>switch to (w/o name to alt buffer, in vim this is :b#):bd <name>delete (current buffer without name)C-wleader key for windows, usually equivalent to SPC w in spacemacs, noted otherwiseC-w o SPC w monly buffer (maximize buffer in spacemacs):sp :split (<fname>)split horizontallyC-w s SPC w -.same:vsp :vsplit (<fname>)split verticallyC-w v SPC w /.sameSPC w Mexchange windows (the closes equivalent to C-w x in vim)C-w hjklswitch to window right / down / up / left (accepts count)C-w HJKLmove window right / down / up / leftC-w c SPC w dclose window (delete window in spacemacs)C-w p SPC w wprevious window (other window in spacemacs)Why, oh WHY, do those #?@! nutheads use vi? #Another zen-of-vim style article.Always exit back to normal mode.Use . to repeat the last editing command.% matches the other parenthesis, sure. But what if you’re not on a one? It will go forward until it finds a parenthesis and then goes it is matching pair. It is nice combined with editing, like c or d.i, a — motions, but can be only used after c, d or v. i> is inner angle bracket block, e.g. di> delete inner angle bracket block. a is similar, but also deletes the parenthesis. This can be used with ', ", {, (, [, < or B (for block), t (for tag), w (for word).Similarly, s — only after c d v. E.g dst — delete surrounding tag, ds> — delete surrounding angle brackets, etc.So, i inner + s surrounding = a.zz zt zb — scroll current line to the center / top / bottom.> — intend region selected by next motion, e.g. >aB intend current block.]p — paste and auto intend.Spacemacs #KeyDescriptionSPC f e dopens ~/.spacemacsSPC t Lenables line wrappingSPC f fopens fileSPC t nshows line numberSPC bshows action for bufferSPC b dkills current bufferSPC TABcycle between open buffersSPC SPCM-xOrg mode #KeyDescriptionSPC a o oshows org mode agenda, dset deadline for the current TODO, sset schedule for the current TODOSPC m RETinsert headline (inherit from above)C-c C-ttoggle status for TODOC-c [add this buffer to agenda listC-c ]remove this file from agenda list, Aarchive a TODO item, Rrefile an archived itemDoom emacs #KeyDescriptionSPC p popen projectSPC SPCopen other file in the same projectSPC ,switch to workspace bufferSPC w vsplit windows side-by-sideC h/j/k/lmove between windowsSPC w cclose the windowSPC o nneotreeSPC o tterminal>> Home'''
