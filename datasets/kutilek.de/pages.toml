full_description = "Comic Jens Comic Jens was an ugly free handwriting font that has now evolved into the beautiful FF Uberhand typeface family, the largest family of casual handwriting fonts available today. If you absolutely want to read about the ugly version, follow this link: Comic Jens Free Not everyone recognizes a hommage when they see one Clash of the comic font giants: Hannes von Döhren (Comic Serif), Vincent Connare (Comic Sans), Jens Kutílek (Comic Jens), Martin Wenzel (FF Duper). Photo by Andreas Seidel Comic Jens is a trademark of Jens Kutílek. Font software © 2008—2024 by Jens Kutílek."
