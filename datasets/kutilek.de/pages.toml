["https://www.kutilek.de"]
title = "Jens Kutílek"
description = "The personal website of Jens Kutílek, font technology expert and font tools developer, type designer, graphic designer."
full_description = "Hello,my name is Jens. Jens Kutilek (he/him). That’s an unlikely combination of a Scandinavian first name and a Czech last name. But I’m German and live in Berlin. I speak German and English. A graphic designer by trade, my field of expertise is font technology and typeface design. I work as type engineer at LucasFonts. Contact & Privacy policy If you find any of my free fonts or scripts useful, you may consider buying me a coffee through Ko-Fi. Thank you! Meet me in person If you’re in Berlin, you could regularly find me at the Typo† design conference and at the Typo­stamm­tisch. Apart from that, I also travelled quite a lot to typography events like the ATypI conference, TypoDay† or Robothon. Well, at least before I had kids, and before the Corona pandemic happened. Social networks You can find me on Mastodon and Instagram."
