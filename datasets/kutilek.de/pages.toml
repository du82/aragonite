DIN 91379 Sudo is one of the first fonts to support the new European standard DIN 91379, “a normative subset of Unicode Latin characters, sequences of base characters and diacritic signs, and special characters for use in names of persons, legal entities, products, addresses etc.” Examples of sequences required by DIN 91379 to be supported by compliant fonts and systems. Koeberlin Latin S & M Sudo supports the Latin S and M character sets defined by Christoph Koeberlin. According to Hyperglot 0.7.2, Sudo v2.2 supports 438 Latin, Cyrillic, and Greek languages: Abaza Abron Abua Acheron Achinese Acholi Achuar-Shiwiar Adamawa Fulfulde Adangme Adyghe Afar Afrikaans Aghul Aguaruna Ahtna Akoose Alekano Aleut Alonquin Amahuaca Amarakaeri Amis Anaang Andaandi, Dongolawi Angas Anufo Anuta Arabela Aragonese Arbëreshë Albanian Archi Asháninka Ashéninka Perené Asturian Atayal Avaric Awa-Cuaiquer Awing Baatonum Bafia Bagirmi Fulfulde Balante-Ganja Balinese Balkan Romani Bambara Banjar Baoulé Bari Basque Bassari Batak Dairi Batak Karo Batak Mandailing Batak Simalungun Batak Toba Belarusian Bemba (Zambia) Bena (Tanzania) Bezhta Biali Bikol Bini Bislama Boko (Benin) Bomu Bora Borana-Arsi-Guji Oromo Borgu Fulfulde Bosnian Breton Buginese Bulgarian Bushi Candoshi-Shapra Caquinte Caribbean Hindustani Cashibo-Cacataibo Cashinahua Catalan Cebuano Central Aymara Central Kurdish Central Nahuatl Central-Eastern Niger Fulfulde Cerma Chachi Chamalal Chamorro Chavacano Chayahuita Chechen Chiga Chiltepec Chinantec Chokwe Chuukese Cimbrian Cofán Cook Islands Māori Cornish Corsican Creek Crimean Tatar Croatian Czech Danish Dargwa Dehu Dido Dimli Duala Dutch Dyan Dyula Eastern Arrernte Eastern Maninkakan Eastern Oromo Efik English Erzya Ewondo Fanti Faroese Fijian Filipino Finnish French Friulian Ga Gagauz Galician Ganda Garifuna German Gheg Albanian Gilbertese Gonja Gooniyandi Gourmanchéma Guadeloupean Creole French Gusii Gwichʼin Haitian Hani Hassaniyya Hausa Hawaiian Hiligaynon Hopi Huastec Hun