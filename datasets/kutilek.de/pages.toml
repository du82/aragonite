full_description = '''Sudo A free font for coders by Jens Kutílek Sudo on Mac OS X (Python syntax in TextMate) Sudo is also hinted for good screen display on Windows. Sudo on Windows (Python syntax in UltraEdit) In 2009 I wasn’t satisfied with the available text editor fonts and decided to draw my own: Sudo. Over the last years I used it as my main font in the Terminal, as well as my text editor font for coding on Mac and Windows. Whenever something bugged me, I refined the design and could instantly evaluate if a change was an improvement. Get Sudo Download the latest Sudo release for free. Contains desktop and web fonts, as well as variable fonts. Source files are available on GitHub. Sudo is licensed under the SIL Open Font License. For version info, check the font log. If you are not sure yet, have a look at the glyph proof for Sudo Regular (PDF, 486 kB). Sudo is mono­spaced Sudo is monospaced: All letters have the same width across all weights. There are many reasons why most programmers still prefer monospaced fonts. All letters have the same width in all weights. Proportional alternates are available for some letters via OpenType layout features. Sudo is not mono­spaced Sudo is monospaced, but not only monospaced! It comes with its sibling family, Sudo UI. Sudo UI is also based on a 16 pixel grid and retains the great legibility of Sudo (mono). Sudo is legible Sudo is legible: Different character categories are differentiated by height and alignment. Letters are easily discernable from numbers by height alone Coders still love their dotted zeroes. When some letter forms are ambiguous in prosa, we can easily read them because we know the context. But when coding, all characters have to be unmistakably recognizable. It is common to add serifs to an uppercase I or a hook to the lowercase l. I don’t care very much for dotted or slashed zeroes, so I decided to make all numbers one line width smaller than the uppercase letters. They still stand out enough because m