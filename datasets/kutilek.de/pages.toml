full_description = "Privacy Policy I am not interested in your personal data. That being said, whenever you visit any website, some data is inevitably sent to the webserver. This data is being used in the way described below. By visiting www.kutilek.de, or ‘this website’, you agree to the terms of the current privacy policy. The privacy policy may change at any time without prior notice. Contact Information Responsible for this website: Jens Kutílek Togostraße 76 13351 Berlin webmail@kutilek.de +49 30 62208149 @jenskutilek Web Hosting This website is hosted on a dedicated server by Hetzner Online AG. The server is located at Falkenstein, Saxonia, Germany. The webserver software keeps access and error log files to guarantee the proper operation of the website. The log files are storing the following pieces of information: the IP address from which a request was made the date and time of the request the requested URL the URL of any other webpage which referred you to this website an identification of the browser and operating system you use the status of the request Your IP adress is anonymized by setting the final octet to 0, so that your visit of this website can not be assigned to a specific computer. The server deletes its log files after 4 weeks. Hetzner Online AG may be able to inspect the traffic between your network and this server. Use an SSL-encrypted connection whenever possible and refer to Hetzner Online’s privacy policy. Cookies This website does not use any cookies, period."
