["https://www.kutilek.de/comic-jens/free-de"]
title = "Comic Jens"
description = "A handwriting font by Jens Kutílek."
full_description = "Comic Jens Free Eine Schrift von Jens Kutilek | English version Nur zum Spaß hatte ich 2008 versucht, meine »Handschrift« mit der Maus in den Computer zu zeichnen und einen kompletten Font daraus zu machen. Den Anlaß zur Veröffentlichung der Schrift unter dem Namen Comic Jens gab ein Fontblog-Artikel zur Comic Sans – woraufhin Jürgen Siebert meiner Schrift einen eigenen Artikel, »Neue Alternative zur Comic Sans«, widmete. Innerhalb eines Monats luden über 1400 Menschen den Font herunter. Version 2.0 der Comic Jens wurde am 13. Mai 2010 veröffentlicht. In ihr wurden einige Kritikpunkte an den Buchstabenformen behoben, sie war nun im TrueType-Format und brachte erweiterte Sprachunterstützung mit (inklusive Kyrillisch und Griechisch, mehr als WGL4), mehr OpenType-Features und verbesserte Bildschirmdarstellung. Details sind dem Schriftmuster-PDF zu entnehmen. Comic Jens auf der Kerning Conf 2013 in Nina Stössingers Vortrag Comic Jens wurde in der Page 12/2008 zum Titelthema »Typo-Klassiker & Alternativen« vorgestellt. Radio Fritz interviewte mich im August 2008 zum Thema, warum Comic Sans eine so vielgehaßte Schrift ist. Comic Jens neben Comic Sans auf einem Ladenschild in Wittmund. Foto: Inka Strotmann. Kommentare [...] in the same vein, but not as obnoxious for some kind of reason.»mhd« Die Comic Jens ist eine wunderbare Alternative zur Hölle, also los los und Comic Sans endlich im Giftschrank lassen.Gregor Nathanael Meyer A free and quite nice alternative to The Font Which Must Not Be Named.Florian Pichler Comic Jens ist für mich die beliebteste Schrift, wenn es um verspielte Layouts geht.Internet Echo Comic Jens verwenden und so tun, als sei nichts gewesen.Gerrit van Aaken At last. A font that takes everything you loathed about Comic Sans and makes it much, much worse.Darryn King If this starts being used, someone please kill meTony Brooks Comic Jens is a trademark of Jens Kutílek. Font software © 2008—2024 by Jens Kutílek."
