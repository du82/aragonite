["https://kutilek.de/sudo-font"]
title = "Sudo Coding Font"
description = "Monospaced and proportional font families for code and UI. Free to use and modify."
full_description = '''Sudo A free font for coders by Jens Kutílek Sudo on Mac OS X (Python syntax in TextMate) Sudo is also hinted for good screen display on Windows. Sudo on Windows (Python syntax in UltraEdit) In 2009 I wasn’t satisfied with the available text editor fonts and decided to draw my own: Sudo. Over the last years I used it as my main font in the Terminal, as well as my text editor font for coding on Mac and Windows. Whenever something bugged me, I refined the design and could instantly evaluate if a change was an improvement. Get Sudo Download the latest Sudo release for free. Contains desktop and web fonts, as well as variable fonts. Source files are available on GitHub. Sudo is licensed under the SIL Open Font License. For version info, check the font log. If you are not sure yet, have a look at the glyph proof for Sudo Regular (PDF, 486 kB). Sudo is mono­spaced Sudo is monospaced: All letters have the same width across all weights. There are many reasons why most programmers still prefer monospaced fonts. All letters have the same width in all weights. Proportional alternates are available for some letters via OpenType layout features. Sudo is not mono­spaced Sudo is monospaced, but not only monospaced! It comes with its sibling family, Sudo UI. Sudo UI is also based on a 16 pixel grid and retains the great legibility of Sudo (mono). Sudo is legible Sudo is legible: Different character categories are differentiated by height and alignment. Letters are easily discernable from numbers by height alone Coders still love their dotted zeroes. When some letter forms are ambiguous in prosa, we can easily read them because we know the context. But when coding, all characters have to be unmistakably recognizable. It is common to add serifs to an uppercase I or a hook to the lowercase l. I don’t care very much for dotted or slashed zeroes, so I decided to make all numbers one line width smaller than the uppercase letters. They still stand out enough because most code is in lowercase anyway. Sudo doesn’t have ligatures I’m not particularly fond of ligatures in coding fonts. In my opinion, in many cases they are hindering readability. Sudo does support Powerline status bars out of the box, though. Powerline in vim/iTerm. Sudo makes use of the “Contextual Alternates” OpenType layout feature: It formats hexadecimal numbers (starting with 0x) with shorter uppercase letters, so they are at the same height as the numbers. Contextual alternates for hexadecimal numbers. You can control those alternates in your editor’s settings, e.g. in Visual Studio Code by adding "editor.fontLigatures": "'calt'" to your settings.json. Sudo is space-efficient Sudo is space-efficient: Its letter width is only 44% of the font size. For comparison: Consolas (r.) has a letter width of 55%. The width of all letters is 44% of the font size. This allows you to fit more code in the same space. For example, the character width in other fonts is between 55% (Consolas) and 60% (Courier). This is a topic for debate, for when the letter width becomes too narrow, you need to increase the font size to keep the text readable, there are limits to the usefulness of condensed letterforms. Sudo has been designed on a pixel grid for a font size of 16 pixels, but works well in other sizes as well. Sudo is unique Coder’s quotes: Some programming languages use acute and grave accents in lieu of proper opening and closing quotes. In Sudo, the standalone accents are enlarged. Similar signs like ‘greater than’ and ‘single french quote’ are differentiated by size and alignment. This is a first: As far as I know, Sudo is the first and only font to feature what I like to call ‘coder’s quotes’. Some programming languages use the acute and grave accents as a replacement for opening or closing quotes. The standalone accents in Sudo are much bigger than the ones on the accented letters and work well together with the straight and typographic quotes. Sudo is standards-compliant DIN 91379 Sudo is one of the first fonts to support the new European standard DIN 91379, “a normative subset of Unicode Latin characters, sequences of base characters and diacritic signs, and special characters for use in names of persons, legal entities, products, addresses etc.” Examples of sequences required by DIN 91379 to be supported by compliant fonts and systems. Koeberlin Latin S & M Sudo supports the Latin S and M character sets defined by Christoph Koeberlin. According to Hyperglot 0.7.2, Sudo v2.2 supports 438 Latin, Cyrillic, and Greek languages: Abaza Abron Abua Acheron Achinese Acholi Achuar-Shiwiar Adamawa Fulfulde Adangme Adyghe Afar Afrikaans Aghul Aguaruna Ahtna Akoose Alekano Aleut Alonquin Amahuaca Amarakaeri Amis Anaang Andaandi, Dongolawi Angas Anufo Anuta Arabela Aragonese Arbëreshë Albanian Archi Asháninka Ashéninka Perené Asturian Atayal Avaric Awa-Cuaiquer Awing Baatonum Bafia Bagirmi Fulfulde Balante-Ganja Balinese Balkan Romani Bambara Banjar Baoulé Bari Basque Bassari Batak Dairi Batak Karo Batak Mandailing Batak Simalungun Batak Toba Belarusian Bemba (Zambia) Bena (Tanzania) Bezhta Biali Bikol Bini Bislama Boko (Benin) Bomu Bora Borana-Arsi-Guji Oromo Borgu Fulfulde Bosnian Breton Buginese Bulgarian Bushi Candoshi-Shapra Caquinte Caribbean Hindustani Cashibo-Cacataibo Cashinahua Catalan Cebuano Central Aymara Central Kurdish Central Nahuatl Central-Eastern Niger Fulfulde Cerma Chachi Chamalal Chamorro Chavacano Chayahuita Chechen Chiga Chiltepec Chinantec Chokwe Chuukese Cimbrian Cofán Cook Islands Māori Cornish Corsican Creek Crimean Tatar Croatian Czech Danish Dargwa Dehu Dido Dimli Duala Dutch Dyan Dyula Eastern Arrernte Eastern Maninkakan Eastern Oromo Efik English Erzya Ewondo Fanti Faroese Fijian Filipino Finnish French Friulian Ga Gagauz Galician Ganda Garifuna German Gheg Albanian Gilbertese Gonja Gooniyandi Gourmanchéma Guadeloupean Creole French Gusii Gwichʼin Haitian Hani Hassaniyya Hausa Hawaiian Hiligaynon Hopi Huastec Hun