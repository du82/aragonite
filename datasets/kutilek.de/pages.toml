["https://www.kutilek.de/fleiss/sexpistols"]
title = "Die Sex Pistols und die Situationistische Theorie by Jens Kutílek"
full_description = 'Hausarbeit Die Sex Pistols und die Situationistische Theorie Jens Kutílek September 2004 Hochschule für Bildende Künste Braunschweig Die Situationistische Internationale Übersicht Die Situationistische Internationale (S. I.) existierte als Gruppe von 1957 bis 1972 und hatte über 70 Mitglieder. Zu ihren Anliegen gehörte die Aufhebung der Grenze zwischen Kunst und Alltagsleben ebenso wie eine grundlegende Umgestaltung der Stadtstrukturen und der gesellschaftlichen Normen. Gegründet wurde die S. I. im Jahr 1957 in Norditalien. Es schlossen sich dabei die von Asger Jorn gegründete Bewegung für ein Imaginäres Bauhaus, die von Guy Debord\index{Debord, Guy} gegründete Lettristische Internationale und die Psychogeografische Gesellschaft London, deren einziges Mitglied Ralph Rumney\index{Rumney, Ralph} war, zusammen. Weitere Einflüsse waren COBRA, Dada, Surrealismus und Fluxus. Das Journal „Internationale Situationniste“ definierte das Wort situationistisch als „bezogen auf die Theorie oder praktische Aktivität des Konstruierens von Situationen“. Das gleiche Journal definierte Situationismus als „einen bedeutungslosen Ausdruck, fälschlicherweise abgeleitet vom obigen. Es gibt keinen Situationismus, was eine Doktrin zur Interpretation der vorhandenen Tatsachen bedeuten würde. Der Begriff ,Situationismus` wurde offensichtlich von Antisituationisten geschaffen“. Es wurden verschiedene Aktionen und Ausstellungen realisiert, von denen etwa New Babylon von Constant\index{Constant}\index{Nieuwenhuys, Constant|see{Constant}} große Aufmerksamkeit erregten. Mitglieder der S. I. waren zahlreiche Künstler und Künstlerinnen wie etwa Jacqueline de Jong,\index{de Jong, Jacqueline} Hans Platschek\index{Platschek, Hans} und Michèle Bernstein.\index{Bernstein, Michèle} Immer wieder kam es zu Meinungsverschiedenheiten innerhalb der Gruppe, die zu Austritten, Ausschlüssen und Abspaltungen führten. Meist betrafen diese Meinungsverschiedenheiten verschiedene Kunstauf”|fassungen und Strategien der Aktionen. Guy Debord (1931 – 1994) war eine zentrale Figur der S. I. In Cannes fielen ihm 1951 die Lettristen auf, die der Uraufführung eines Filmes eines ihrer Mitglieder, Isidore Isou,\index{Isou, Isidore} beiwohnen wollten und deswegen angereist waren. Debord befaßte sich in der Folge intensiv mit den Möglichkeiten des experimentellen Kinos. Er führte situationistische Begriffe, die weiter unten erläutert sind, in die Diskussion um die Kunst beziehungsweise die Umgestaltung des gesellschaftlichen und alltäglichen Lebens ein. Als sein Hauptwerk gilt „Die Gesellschaft des Spektakels“ (1967). (Quellen: \citet{wikisi}, \citet{wikisien}) Situationistische Begriffe Die Situation Die Kunst der Zukunft wird eine Umwälzung von Situationen sein, oder sie wird nichts sein. Guy Debord, 1952\index{Debord, Guy}\bigskip Das Wort „Situation“ im Sinne der S. I. bezog sich auf eine Idee, die schon länger in Philosophie, Wissenschaft und Kunst herangereift war. Sartre\index{Sartre, Jean-Paul} sah das Leben als Aneinanderreihung verschiedener gegebener Situationen, die das Individuum, sein Bewußtsein und seinen Willen, beeinflussen, und mit denen sich das Individuum wiederum auseinandersetzen muß \citep{perfectsound}. Die Alltagswelt schien eine Abfolge von Augenblicken: Momente der Liebe, des Hasses, der Poesie, Frustration, Tätigkeit, des Ergebens, Entzückens, der Erniedrigung, Gerechtigkeit. Um die Welt zu verändern, mußte man das Leben verändern. Die S. I., eines derer Ziele es war, die Grenze zwischen Kunst und Alltagsleben aufzuheben, folgerte für die Kunst der Zukunft, in der Person von \citet{si-grund}: „Wir müssen versuchen, Situationen zu konstruieren, d. h.~kollektive Stimmungen, eine Gesamtheit von Eindrücken, die die Beschaffenheit eines Moments bestimmen.“ Der Künstler der Zukunft würde also ein Konstrukteur von Situationen sein. Die Gesellschaft des Spektakels Wo das „Spektakel“ herrscht, werden alle Aspekte der Kultur, alle Erfahrungen und Erlebnisse des Individuums gefiltert und durch Medien ersetzt, um die Interessen derer zu schützen und zu verbergen, die die wahre Macht innehaben. In seinem Buch „Die Gesellschaft des Spektakels“ \citep{dgds} gibt Debord keine konkrete Definition des Begriffs Spektakel. Er beschreibt es in seinen realen Erscheinungsformen und paraphrasiert den ersten Satz von Marx’\index{Marx, Karl} Kapital: „Das ganze Leben in den Gesellschaften, in welchen die modernen Produktionsbedingungen herrschen, erscheint als eine ungeheure Sammlung von Spektakeln.“ Er begreift das Spektakel als gesteigerte Form des Fetischismus nach Marx: „Das Prinzip des Warenfetischismus ist es …, das sich absolut im Spektakel vollendet, wo die sinnliche Welt durch eine über ihr schwebende Auswahl von Bildern ersetzt wird, welche sich zugleich als das Sinnliche schlechthin hat anerkennen lassen.“ (zit. n. \citet{jw20-2001}) Eine Formulierung, die als zusammenfassende Definition des modernen Spektakels gelesen werden kann, findet sich erst in Debords Text „Kommentare zur Gesellschaft des Spektakels“ (1988): das Spektakel sei „die Selbstherrschaft der zu einem Status unverantwortlicher Souveränität gelangten Warenwirtschaft und die Gesamtheit der neuen Regierungstechniken, die mit dieser Herrschaft einhergehen.“ Larry Law schreibt in „Images And Everyday Life“: Unser ganzes Leben ist umgeben von einer immensen Ansammlung von Spektakeln. Dinge, die einst direkt erlebt wurden, werden nun durch Stellvertreter erlebt. Sobald eine Erfahrung aus der realen Welt herausgenommen wird, wird sie ein Gebrauchsartikel. Als Gebrauchsartikel schadet das Spektakuläre dem Realen. Es wird ein Ersatz für Erfahrung. Jost Müller \citep{jw37-2001} beschreibt die Definition des Spektakels aus dem Buch „Empire“ von Michael Hardt und Antonio Negri folgendermaßen: Hardt und Negri definieren das Spektakel als einen Apparat aus Bildern und Vorstellungen, der zugleich diffus und integriert ist und dessen Aufgabe darin besteht, trennend und vereinheitlichend den öffentlichen Diskurs und die öffentliche Meinung zu produzieren und zu regulieren. Es handelt sich hierbei um eine Manipulation ohne Manipulator oder, in den Worten einer älteren Auf” fassung des Ideologischen ausgedrückt, um den sozialen Kitt der neuen imperialen Ordnung, der die pyramidale Konstitution innerhalb des durch eine Vielzahl sich kreuzender Repräsentations- und Machtverhältnisse gekennzeichneten Netzwerks zusammenhält. Das Spektakel zerstöre jede kollektive Form der Gesellschaft, indem es die sozialen Akteure individualisiert und dennoch in eine Uniformität des Handelns und Denkens drängt, die den realen Herrschaftsprozess zu stabilisieren verspricht. In der sozialstaatlichen Alimentierung des Proletariats sah Debord einen integralen Bestandteil des modernen Spektakels. Neben die Entfremdung in der Produktion trete „der entfremdete Konsum“ als „eine zusätzliche Pflicht für die Massen“ \citep{dgds}. Weitere Quelle: \citet{wikisien} Détournement Détournement kann man mit Zweckentfremdung oder Entwendung übersetzen: Die Bilder des Systems zweckentfremden und sie gegen das System einsetzen. Eine Definition aus „Internationale Situationniste“, Ausgabe 1, Juni 1958, lautet: Kurzfassung der Formel: Zweckentfremdung von ästhetischen Fertigteilen. Integration aktueller oder vergangener Kunstproduktionen in eine höhere Konstruktion des Milieus. In diesem Sinne kann es weder eine situationistische Malerei noch eine situationistische Musik, wohl aber eine situationistische Anwendung dieser Mittel geben. Zweckentfremdung ist quasi die Kehrseite der Rekuperation, bei der radikale Ideen und Bilder zum Gebrauchsgegenstand werden. Die Bilder des Spektakels werden verändert und zerrüttet, damit, statt daß sie den Status Quo zu unterstützen, sich ihre Bedeutung verändert und sie eine radikalere oder gegenteilige Aussage bekommen. Eine solche situationistische Methode wird heute beispielsweise von „Culture Jammers“ und „Adbusters\footnote{\url{http://adbusters.org/}}“ benutzt, die etwa eine Nike-Werbung zweckentfremden und dadurch in diesem Fall darauf hinweisen wollen, daß Nike seine Produktion in Billiglohnländer der Dritten Welt ausgelagert hat. Quellen: \citet{wikisien}, \citet{kwdada} Rekuperation To survive, the spectacle must have social control. It can recuperate a potentially threatening situation by shifting ground, creating dazzling alternatives— or by embracing the threat, making it safe and then selling it back to us Larry Law, „The Spectacle—The Skeleton Keys“\index{Law, Larry}\bigskip Ha! You think it’s funny?Turning rebellion into money? The Clash, „White Man In The Hammersmith Palais.“\index{Law, Larry}\bigskip „Mit dem Begriff der Rekuperation versuchten die Situationisten jenen Prozess zu fassen, in dem subversive Praxis für die Modernisierung der bestehenden Verhältnisse funktionialisiert wird.“ \citep{jw44-2000} Das Spektakel kämpft nicht gegen es bedrohende revolutionäre oder radikale Ideen, sondern macht sie sich zu eigen, verpackt sie neu und macht eine Produkt daraus, das als Wirkung die bestehenden Verhältnisse stützt, statt sie anzugreifen. Ein Beispiel dafür könnte ironischerweise die Ausstellung über die S. I.~sein, die 1989 in Paris, Boston und der ICA-Galerie in der London Mall gezeigt wurde. Originale der situationistischen Manifeste und zeitgenössische S. I.-beeinflußte Arbeiten wie Schallplatten, Fanzines, Flugblätter und Propagandamaterial wurden als Ausstellungsstücke im Museum für den Konsum durch das Kunst-Establishment gezeigt. Ein zeitlich ausgedehnteres Beispiel ist der Club The Hacienda\index{Hacienda} in Manchester (1982 – 1997). Er war kommerziell sehr erfolgreich und Ausgangspunkt von Trends in Musik und Design, deren Auswirkungen heute noch zu spüren sind. Den Namen des Clubs hatte der Inhaber, Fernsehmoderator und Musikgeschäftsmann Tony Wilson\index{Wilson, Tony} aus dem Werk von Ivan Chtcheglov\index{Chtcheglov, Ivan} „Formular für einen neuen Urbanismus“ (1953) entliehen. Wilsons Plattenfirma Factory Records war einer der Sponsoren der erwähnten Ausstellung des ICA im Jahre 1989 (zusammen mit der Brauerei Beck’s). 1996 fand ein Symposium über das „Vermächtnis der situationistischen Revolte“ in der Hacienda statt. Außerdem hatte Wilson viel Geld in eine Sammlung S. I.-bezogener Kunstwerke, darunter Debords\index{Debord, Guy} „Psychogeografischer Stadtplan von Paris“ von 1953, investiert. Allein finanziell gesehen war solch eine Investition eine gute Entscheidung. 1976 waren die Sex Pistols in der Lesser Free Trade Hall in Manchester aufgetreten. Im Publikum befanden sich Ian Curtis,\index{Curtis, Ian} Bernard Albrecht\index{Albrecht, Bernard} und Peter Hook.\index{Hook, Peter} Inspiriert durch die Performance der Band gründeten sie ihre eigene Band Warsaw,\index{Warsaw} später umbenannt in Joy Division.\index{Joy Division} 1981 ist Ian Curtis tot, Joy Division ist New Order,\index{New Order} und ihre Plattenfirma Factory plante, The Hacienda zu eröffnen. Tony Wilson war ebenfalls bei jenem Konzert 1976 dabeigewesen und hatte McLarens\index{McLaren, Malcolm} Karriere mit großem Interesse verfolgt. Also war es nur passend, daß in der Hacienda das nächste große Jugendphänomen entstehen würde: Acid House. Die aufkommende Dance-Kultur war eine weitere Do-It-Yourself-Bewegung, der es um Freiheit durch Transzendenz des Alltagslebens ging, diesmal durch Tanzen und Ecstasy. Weitere Quellen: \citet{perfectsound} Punk in England Die Anfänge Die Anfänge des Punk vor dem Auftauchen der Sex Pistols stellen sich als eine komplett andere Situation als die spätere Zeit des Punk dar. 1975 herrschte in England eine starke Rezession. Die Arbeitslosenzahlen hatten den höchsten Stand seit dem zweiten Weltkrieg erreicht. Entsprechend herrschte Wut, Unzufriedenheit und Zukunftsangst als Stimmung vor. Die englische Musikszene war dominiert von „Superstars“ und Stadionrock. Wie auch bei den Alternativ-Musikern und -Konsumenten in den USA hatten die Themen und der Lebenswandel der Stars überhaupt nichts mehr mit der Erlebniswelt der Hörer zu tun. Ambitionierte Bands wurden von den Stars abgeschreckt durch die perfekte Beherrschung der Instrumente sowie die extrem teure Technik, ohne die es, so wurde der Eindruck erweckt, nicht gehe. Die Rolling Stones\index{Rolling Stones} wurden schon 1975 als „Opas auf der Bühne“ gesehen, trotz ihres früheren „Rebellentums“. In dieser Situation schwappte die Punk-Welle aus New York nach London. Das war schon relativ schnell, denn bevor die Welle die amerikanische Provinz erreichte, würde Punk in New York schon wieder passé sein. Die neue Devise lautete: Wer etwas zu sagen hat, braucht keine ausgefeilte Technik dafür, sondern nimmt eine Gitarre, lernt zwei Akkorde und gründet eine Band. Durch die abgerissene Kleidung wollte man zeigen, daß man aus der Arbeiterklasse kam oder zumindest mit ihr solidarisch war. Die Punks sahen sich als „gesellschaftlichen Abfall“, als Außenseiter, die von allem genug hatten, und sie waren stolz darauf. In Kellerlokalen, Pubs und Discos wurden wieder Liveauftritte veranstaltet. Obwohl das Stichwort „Arbeitslosenrock“ wohl nur ein Klischee ist, war es dennoch tatsächlich so, daß der, der auf der Bühne stand, aus der gleichen Schicht kam wie das Publikum. Jugendliche konnten für ein paar Pfund Eintritt eine Band hören, die von für sie relevanten Themen sang, und noch dazu tanzen und Spaß haben. Politisch war das nur im Sinne einer direkten Politik, wie Meinungsbildung und Sensibilisierung des Publikums für es selbst betreffende Anliegen und Ideen. Jedoch versuchten verschiedene Gruppen, den Punk „von außen“ zu politisieren und instrumentalisieren. Punk aus situationistischer Sicht Soweit war Punk eine Situation im Sinne der Situationisten, wie sie sich ohne Hilfe des Künstlers der Zukunft bilden konnte. Dies würde sich mit der Gründung der Sex Pistols ändern. Doch schon jetzt zeigte sich das Prinzip der Rekuperation. Nämlich von Seiten der Medien, der Politik und der Musikindustrie. Punk war eine potentielle Bedrohung für alle drei. Der Musikindustrie entgingen Einnahmen von Konzerten und Tonträgerverkäufen, denn die Konzerte der Punks waren selbstorganisiert, Plattenverträge hatten sie nicht, und wenn es Aufnahmen von den Bands gab, wurden sie auf selbstbespielten Kassetten verkauft. Bei den Medien war die bedrohte Sparte vor allem die Musikpresse. Die Fanzines, die sie belächelt hatte, wurden von engagierten Fans geschrieben und erreichte teilweise einen höheren Schreibstandard als die kommerziellen Musikmagazine. Ganz sicher waren die Fanzines relevanter für die Punks. Die Zeitungen mußten ebenfalls etwas tun, denn alles, was die staatliche Ordnung angreift, greift auch die Presse an. Während die Musikpresse zuerst versuchte, die Fanzines abzuqualifizieren, dann aber über Punk berichtete und den Trend förderte, wurden von den Zeitungen die vereinzelten Unruhen und Krawalle zum Skandal und alle Punks zu gewalttätigen Asozialen hochstilisiert. Tat'
