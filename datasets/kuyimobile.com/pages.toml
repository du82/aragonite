full_description = '''PRIVACY STATEMENT Last Updated: April 28, 2018 PLEASE READ THIS PRIVACY STATEMENT CAREFULLY BEFORE USING THIS WEB SITE OR ANY Kuyi Mobile PRODUCT. This Privacy Statement is applicable to all Kuyi Mobile Web sites and other sites on the Internet and World Wide Web owned and operated by Kuyi Mobile, and all services provided thereon, including all Kuyi Mobile Forums (collectively, unless noted otherwise, the "Services"). Kuyi Mobile respects the privacy concerns of all users of the Services. Kuyi Mobile also recognizes the valuable potential of technology to help people communicate with the companies whose Web sites they visit, particularly through customer databases. Responsible use of the information you share with Kuyi Mobile is paramount. In order to help you understand how the information you provide Kuyi Mobile will be used, the following guidelines have been created. PERSONALLY IDENTIFIABLE INFORMATION In order to use certain portions of the Services (i.e., Kuyi Mobile Store, Kuyi Mobile Forums), you may be required to register and create an account with Kuyi Mobile. There is no cost to create an Kuyi Mobile Account but you will be asked to choose a member name (please select a name other than your real name; also, please do not select the name of a real person), password, and provide certain personal information about yourself, such as your real name, age, address, telephone number, occupation and e-mail address. If you do provide Kuyi Mobile with personally identifiable information, we will take all reasonable and appropriate steps to protect this information. Kuyi Mobile will not disclose, share, sell or rent personally identifiable information to any third party without your prior consent. Please note that your member name will be available to other members of the Kuyi Mobile community while you participate in certain Kuyi Mobile Forums. At your discretion, you may also choose to create a public profile for yourself which will be available to the public (other members of the Kuyi Mobile community). Public profiles are managed entirely by you and you are solely responsible for the profile's content and its "public" or "private" status on the Kuyi Mobile Sites. You may access, edit or delete your public profile by signing in to your account and clicking on "My Public Info." Children under 13 years of age are prohibited from creating a public profile. Other than registration information, you may be asked to provide certain personal information in connection with your use of or participation in certain promotions such as entering sweepstakes, contests, surveys, newsletters, etc, ("Special Promotions"). In these instances, you will be informed of the intended use(s) of the requested information. CHILDREN UNDER 13 YEARS OF AGE Kuyi Mobile respects the privacy of children of all ages. Kuyi Mobile particularly recognizes the sensitivity of personal information concerning children under the age of 13 and therefore provides this special notice to parent(s) or guardian(s) regarding the collection and use of information collected from children in this age group. Generally speaking, Kuyi Mobile will not collect and maintain any personally identifiable information from children under 13 years of age without first obtaining consent from that child's parent or guardian. If a child under 13 years of age wishes to create a Kuyi Mobile Account, or participate in a Special Promotion, the child will be asked to provide a limited amount of personally identifiable information (no more information than is reasonably necessary to enable that child to participate in the activity or Special Promotion) along with his/her parent or guardian's e-mail address. Kuyi Mobile will then send an e-mail (the "Initial Notification") to the Parent indicating the information that the child is requested to provide, the intended use(s) of the information and information on how the parent or guardian can, at their election, delete the child's information from Kuyi Mobile's database or records. Upon receipt of the Initial Notification, a parent or guardian may respond back to Kuyi Mobile to (a) activate the child's Kuyi Mobile Account, or (b) delete the child's Kuyi Mobile Account and cause all information collected to be automatically deleted. By activating the child's Kuyi Mobile Account, the parent or guardian may consent to Kuyi Mobile's maintaining the limited personally identifiable information collected from the child, using the information as stated in the Initial Notification, and allowing the child to access the Forums. If an Kuyi Mobile Account is not activated or deleted by the parent or guardian within 30 days of the Initial Notification, the information collected from the child is automatically deleted from Kuyi Mobile's database. Once an Kuyi Mobile Account is activated by a parent or guardian, subsequent e-mails will be sent to the parent or guardian's e-mail address each time a child participates in a Special Promotion. Some Special Promotions such as sweepstakes require that the child provide additional personally identifiable information for purposes of verifying eligibility for entry into the promotion or fulfilling prize awards to winners. These subsequent e-mails to the parent will inform the parent of the characteristics of the Special Promotion and where the parent may view more information about the Special Promotion. Kuyi Mobile will use reasonable efforts to delete a child's information from Kuyi Mobile's files upon request. Parents are instructed on the procedure for deleting a child's information in the Initial Notification. After activating a child's account, a parent or guardian should refer to the "How to review, update or delete you or your child's personal information" section of this document, found below. Parents are encouraged to spend time online with their children to become familiar with the types of content available on the Kuyi Mobile Sites and the Internet in general. Control tools are available from online services and software manufacturers to create a safe environment for children. NON-PERSONALLY IDENTIFIABLE INFORMATION As part of the registration process to create an Kuyi Mobile Account or to participate in a Special Promotion, you may be asked to provide certain information about yourself which does not personally identify you. For example, you may be asked to provide information concerning your music or other entertainment preferences, purchasing habits, and the like. Kuyi Mobile requests this information in order to enhance your online experience by understanding you better and to also make you aware of new services, programs or offers in which you may be interested. In general, you can use the Services (except the Kuyi Mobile Store and Kuyi Mobile Forums) while remaining anonymous. However, in some cases, Kuyi Mobile may still be able to collect certain non-personally identifiable information about your use of the Services. For example, Kuyi Mobile might collect information concerning the type of Internet browser you are using, the type of computer operating system you are using, the domain name of your Internet service provider and/or the Web site or advertisement from which you linked to the Kuyi Mobile site. When you visit one of the Kuyi Mobile Sites or advertisements appearing thereon, or use one or more of the Services, we may use an industry-wide technology called "cookies" which stores certain information on your computer and which will allow us to customize your experience to better match your interests and preferences or simply facilitate your signing in to use the Services. Most browsers will allow you to erase cookies from your computer hard drive, block acceptance of cookies, or receive a warning before a cookie is stored. Please refer to your browser instructions or help screen to learn more about these functions. In general, Kuyi Mobile may use non-personally identifiable information to improve and enhance the Services. However, from time to time, Kuyi Mobile may share this information with other entities in aggregate, non-personal form to show general demographic and preference information among users of the Kuyi Mobile Sites. OTHER SENSITIVE INFORMATION Whenever you give Kuyi Mobile sensitive information (e.g., credit card numbers), Kuyi Mobile will take all commercially reasonable steps to protect such information by establishing a secure connection with your Web browser. Kuyi Mobile employs an industry-wide technology known as a secure-socket-layer ("SSL") to protect the transmission of payment information to the Site. Unless otherwise specified herein, credit card numbers are used only for payment processing and are not retained for marketing or any other purposes. POSTINGS TO FORUMS All postings, whether in a chat room, on message boards or other method of communication within the Forums will generally be available to and freely accessible by other users of the Kuyi Mobile Forums. Therefore, users should not expect that any information they post will be kept private or confidential and are encouraged to exercise discretion when using the Kuyi Mobile Forums. Additionally, your member name will always be posted in conjunction with your post in the Kuyi Mobile Forums. HYPERLINKS The Kuyi Mobile Sites may contain links to or advertisements concerning other Web sites. Other sites may also reference, advertise, or link to Kuyi Mobile Sites. Kuyi Mobile is not responsible for the privacy practices or the content of such other sites and expressly disclaims all liability associated with your use of and the content on such other sites. CONSENT TO PROCESSING By providing any personal information to the Kuyi Mobile Sites, all users, including without limitation, users in the member states of the European Union, fully understand and unambiguously consent to the collection and processing of such information in the Philippines. HOW TO REVIEW, UPDATE OR DELETE YOUR OR YOUR CHILD'S PERSONAL ACCOUNT INFORMATION As part of your use of the Services, you are responsible for maintaining and updating, as applicable, your Registration Information with current and complete information. You may edit and delete portions of your Kuyi Mobile Account information or delete the Kuyi Mobile Account entirely. To do this, visit the first page after signing in to your account, known as the lobby, and click on "Account Info" to make such changes or deletions. If you are the parent or guardian of a child under 13 years of age, you need to ask your child for his/her password in order to access his/her account information and edit or delete the account. Kuyi Mobile is dedicated to protecting your personal information and welcomes comments and questions on this policy. You may e-mail your questions or comments to:info(at)kuyimobile(dot)com. Kuyi Mobile reserves the right to change this policy at any time by notifying guests of the existence of a new privacy policy. © 2009 Kuyi Mobile, All rights reserved website privacy policy | terms of service | site map | company information'''
