full_description = "Television In Netflix’s ‘Running Point,’ Max Greenfield Is the Nice Jewish Boy Who Just Might Get Kate Hudson to Convert Lior Zaltzman News Beloved ‘Saba’ Shlomo Mantzur Survived the Farhud in Iraq But Didn’t Survive Hamas Captivity Lior Zaltzman kveller Submission Guidelines By Kveller Staff We are always accepting submissions from new writers. To submit, please email submissions@kveller.com with “Submission” somewhere in the subject line. Include a brief bio and a pitch or complete original article you’d like us to consider, either attached as a Word doc or pasted into the body of the email. We are looking for pieces that reflect the diversity of experiences of raising Jewish kids, covering topics like rituals and holidays, pop culture and current events, baby naming to bar/bat mitzvahs and everything in between. Not everything needs to be explicitly about parenting (because parents are people too, you know) but everything should have a strong Jewish angle. Suggested word count is 700-1000 words. We do not accept previously published work. If you are sending the piece to multiple publications, please notify us immediately if it’s been accepted elsewhere. Please send only one submission at a time. Hot tip: The best way to get a sense of what we’re looking for is to read the website — thoroughly! Kveller Staff The Kveller staff is made up of the hard-working folks behind your favorite Jewish parenting website, Kveller, of course. window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'Kveller_textad', baseDivId: 'pb-slot-text-ad', } ], true); }); window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'teads', baseDivId: 'pb-slot-teads', } ], true); }); if ( ! window.matchMedia('(min-width: 1050px)').matches ) { window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-4', bas