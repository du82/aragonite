["https://www.kveller.com/introducing-a-little-bit-schmaltzy-kvellers-community-cookbook"]
title = "Introducing 'A Little Bit Schmaltzy,' Kveller's Community Cookbook – Kveller"
description = "Do you have a synagogue sisterhood cookbook at home? Those magical spiral-bound treasure troves full of recipes and anecdotes about how to cook delicious Jewish dishes and how to keep a Jewish home? A sisterhood cookbook is more than just a guide for cooks, but a beautiful, spiral-bound artifact — oil-splattered and dog-eared from use […]"
full_description = "Television In Netflix’s ‘Running Point,’ Max Greenfield Is the Nice Jewish Boy Who Just Might Get Kate Hudson to Convert Lior Zaltzman News Beloved ‘Saba’ Shlomo Mantzur Survived the Farhud in Iraq But Didn’t Survive Hamas Captivity Lior Zaltzman cooking Introducing ‘A Little Bit Schmaltzy,’ Kveller’s Community Cookbook This treasure trove of beloved Jewish recipes is available for a limited time. By Kveller Staff Dec 3, 2024 Do you have a synagogue sisterhood cookbook at home? Those magical spiral-bound treasure troves full of recipes and anecdotes about how to cook delicious Jewish dishes and how to keep a Jewish home? A sisterhood cookbook is more than just a guide for cooks, but a beautiful, spiral-bound artifact — oil-splattered and dog-eared from use — and more than anything, it’s a preserver of the spirit of community. Here at Kveller, we love our community — the readers who have been with us for over a decade since our founding and the ones who have joined us more recently. And we love how our community has been there for each other, helping to name babies, alleviate worries and share Jewish pride (and the many, many opinions on the latest Jewish TV show). So we wanted to create an artifact that honors this community and channels its beautiful spirit. Enter the first ever Kveller community cookbook, “A Little Bit Schmaltzy.” In our new spiral-bound (we had to!) cookbook, you will find recipes from our diverse readers and their families, along with the stories that make these dishes so special: mouth-watering Persian gondi, holiday meatballs, warm comforting apple cake that was baked in the Warsaw ghetto, a gefilte fish that carries on the memory of a lifelong friendship. How do you get this limited edition cookbook? Anyone who donates $40 (or more!) to Kveller between today and December 8 will get a copy of “A Little Bit Schmaltzy” shipped right to your home. Can we ask? It's important to us to keep the warm, joyfully Jewish community on Kveller accessible for all. Reader donations help us do just that. Can you spare a few to keep Kveller free? (We'll love you forever.) Support Us As a nonprofit, your support helps keep the Kveller community thriving so we can continue sharing the stories that connect and inspire Jewish families like yours. Donate to get a copy of “A Little Bit Schmaltzy”. Kveller Staff The Kveller staff is made up of the hard-working folks behind your favorite Jewish parenting website, Kveller, of course. window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'Kveller_textad', baseDivId: 'pb-slot-text-ad', } ], true); }); window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'teads', baseDivId: 'pb-slot-teads', } ], true); }); if ( ! window.matchMedia('(min-width: 1050px)').matches ) { window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-4', baseDivId: 'pb-slot-incontent-3', } ]); }); } if ( ! window.matchMedia('(min-width: 1050px)').matches ) { window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-5', baseDivId: 'pb-slot-incontent-4', } ]); }); } The Latest Why I Keep the Nazi Armbands From My Jewish Grandfather’s Mementos Carly Ornstein Television In Netflix’s ‘Running Point,’ Max Greenfield Is the Nice Jewish Boy Who Just Might Get Kate Hudson to Convert Lior Zaltzman News Beloved ‘Saba’ Shlomo Mantzur Survived the Farhud in Iraq But Didn’t Survive Hamas Captivity Lior Zaltzman window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-1', baseDivId: 'pb-slot-incontent-1', } ]); }); Most Popular jewish celebrities Why Is Robert Downey Jr. Wearing a Chai Necklace? News Shiri Bibas Is Finally Home Television A New Must-Watch Israeli Show Is Now Streaming on Netflix News The B