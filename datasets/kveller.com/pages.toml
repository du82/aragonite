title = "A Sneak Peek of Disney's 2024 Hanukkah Merch Is Here – Kveller"
description = "When you wish upon a star… sometimes Hanukkah comes early! Last week, Disney released a preview of some of its 2024 holiday season merchandise that will drop in their stores in September. (This year, Hanukkah begins on the evening of December 25, 2024, and ends on the night of January 2, 2025.) Following last year’s […]"
full_description = "Television In Netflix’s ‘Running Point,’ Max Greenfield Is the Nice Jewish Boy Who Just Might Get Kate Hudson to Convert Lior Zaltzman News Beloved ‘Saba’ Shlomo Mantzur Survived the Farhud in Iraq But Didn’t Survive Hamas Captivity Lior Zaltzman Holidays A Sneak Peek of Disney’s 2024 Hanukkah Merch Is Here Last year, Disney set the bar very high with their largest Hanukkah collection ever. But did they deliver this year? By Evelyn Frick Jul 1, 2024 via Getty, Canva When you wish upon a star… sometimes Hanukkah comes early! Last week, Disney released a preview of some of its 2024 holiday season merchandise that will drop in their stores in September. (This year, Hanukkah begins on the evening of December 25, 2024, and ends on the night of January 2, 2025.) Following last year’s Disney holiday line, which purported to have the “largest Hanukkah collection to date,” and which we at Kveller generally enjoyed, the bar was high. So, did Disney deliver this year? The sneak peek includes five Hanukkah-related items which lean into the coziness of the holiday season. First up, we’ve got Festival of Lights Minnie ears which are very cute until you realize they’re recycled from the 2023 merchandise season. On the one hand, maybe they were so popular Disney needed to bring them back. But on the other hand, get more creative, Disney! The rest of the drop includes a Hanukkah blanket, mug, menorah wall hanging and “stylin'” PJ pants. All the designs include Mickey and Minnie either playing dreidel or hugging surrounded by menorahs, dreidels, gelt, sufganiyot and flowers. The design color palette is, surprise, surprise, blue, yellow and white. “The colors may make it easier to find in a store, but this collection would be so much more exciting with some purples and oranges and other shades,” Kveller deputy managing editor Lior Zaltzman said of last year’s also blue and yellow Disney Hanukkah collection. The kvetch still stands this year. Can we ask? It's important to us to keep the warm, joyfully Jewish community on Kveller accessible for all. Reader donations help us do just that. Can you spare a few to keep Kveller free? (We'll love you forever.) Support Us Overall, the naturalistic style and sketchbook aesthetic of the 2024 Disney Hanukkah collection preview is nice. It’s pleasant to look at, has a wide appeal and, you know, isn’t offensive. But with the wide swath of Christmas sweaters, Mickey and Minnie ears, home decor, plushies, stockings and more, the Hanukkah section feels comparatively… feh. Fingers crossed that the best of the Disney Hanukkah collection is yet to be part of our world. Evelyn Frick Evelyn Frick (she/her or they/them) is a writer and comedian and an editorial assistant for Kveller's sister site Alma. window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'Kveller_textad', baseDivId: 'pb-slot-text-ad', } ], true); }); window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'teads', baseDivId: 'pb-slot-teads', } ], true); }); if ( ! window.matchMedia('(min-width: 1050px)').matches ) { window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-4', baseDivId: 'pb-slot-incontent-3', } ]); }); } if ( ! window.matchMedia('(min-width: 1050px)').matches ) { window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-5', baseDivId: 'pb-slot-incontent-4', } ]); }); } The Latest Why I Keep the Nazi Armbands From My Jewish Grandfather’s Mementos Carly Ornstein Television In Netflix’s ‘Running Point,’ Max Greenfield Is the Nice Jewish Boy Who Just Might Get Kate Hudson to Convert Lior Zaltzman News Beloved ‘Saba’ Shlomo Mantzur Survived the Farhud in Iraq But Didn’t Survive Hamas Captivity Lior Zaltzman window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refr