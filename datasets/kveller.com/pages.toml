full_description = "Television In Netflix’s ‘Running Point,’ Max Greenfield Is the Nice Jewish Boy Who Just Might Get Kate Hudson to Convert Lior Zaltzman News Beloved ‘Saba’ Shlomo Mantzur Survived the Farhud in Iraq But Didn’t Survive Hamas Captivity Lior Zaltzman October 7 Join Us in Sharing Support for Yarden Bibas Help us show Yarden that he's not alone. By Kveller Staff Feb 26, 2025 via Getty Images Since October 7, 2023, we’ve seen images we will never forget, and have heard stories that will stick with us forever. We’ve cried tears of incredible sadness and bittersweet joy. And through it all there has been the Bibas family: Shiri, Yarden, Ariel and Kfir. We saw ourselves in Shiri, fiercely protecting her little boys as they were taken hostage into Gaza. We held our own kids tightly, wondering what a child that small could possibly be thinking. We dared to have hope that the family would return alive. We wept for Yarden when he arrived home to a world without his beloved wife and sons. Today, the Bibas family buried Shiri, Ariel and Kfir in a private funeral. Yarden somehow gathered the strength to speak about Shiri and the boys. And after his own ordeal — being kidnapped and held hostage for more than a year — he apologized to his family that he couldn’t protect them. Jewish parents around the world in particular feel a special connection with Yarden. He is one of us; his children came to feel like our own children. Last year when Rachel Goldberg-Polin, herself an international face of the hostage families, lost her son Hersh, the incredible community of Jewish parents on Kveller came together to show their support. Today, let’s tap into that power again. Fill out this form with your message of support for Yarden, and show him that he is not — and never will be — alone. Can we ask? It's important to us to keep the warm, joyfully Jewish community on Kveller accessible for all. Reader donations help us do just that. Can you spare a few to keep Kveller free? (We'll love you forever.) Support Us Kveller Staff The Kveller staff is made up of the hard-working folks behind your favorite Jewish parenting website, Kveller, of course. window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'Kveller_textad', baseDivId: 'pb-slot-text-ad', } ], true); }); window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'teads', baseDivId: 'pb-slot-teads', } ], true); }); if ( ! window.matchMedia('(min-width: 1050px)').matches ) { window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-4', baseDivId: 'pb-slot-incontent-3', } ]); }); } if ( ! window.matchMedia('(min-width: 1050px)').matches ) { window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-5', baseDivId: 'pb-slot-incontent-4', } ]); }); } The Latest Why I Keep the Nazi Armbands From My Jewish Grandfather’s Mementos Carly Ornstein Television In Netflix’s ‘Running Point,’ Max Greenfield Is the Nice Jewish Boy Who Just Might Get Kate Hudson to Convert Lior Zaltzman News Beloved ‘Saba’ Shlomo Mantzur Survived the Farhud in Iraq But Didn’t Survive Hamas Captivity Lior Zaltzman window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-1', baseDivId: 'pb-slot-incontent-1', } ]); }); Most Popular jewish celebrities Why Is Robert Downey Jr. Wearing a Chai Necklace? News Shiri Bibas Is Finally Home Television A New Must-Watch Israeli Show Is Now Streaming on Netflix News The Bibas Family: ‘We Don’t Want Revenge, We Want Shiri and the Hostages Back’ motherhood Shiri, Ariel and Kfir Bibas Deserved a Better World window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-box-2', baseDivId: 'pb-slot-incontent-2', } ]); }); Kveller Instagra