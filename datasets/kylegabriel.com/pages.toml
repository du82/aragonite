title = "Automation – Projects | Kyle Gabriel"
full_description = "Mushroom Cultivation Automation: From Foraging to Fruiting September 3, 2021May 13, 2022 Automation Cultivation Mushroom Mycodo Raspberry Pi Last Updated: April 13, 2022 Mushrooms are a unique and often mysterious organism. They’re not quite plants and not quite animals. As a fungus, mushrooms represent a distinct evolutionary lineage. Fungi grow as a single-cell yeast form (used in beer, wine, and bread making) and multi-cellular, thread-like mycelia that often produce fruiting bodies (mushrooms) and sclerotia (e.g. truffles), and are responsible for the decomposition of the vast majority of dead plant matter. Understanding life cycle of mushroom fungi is a valuable skill if you wish to harness this knowledge for mushroom cultivation. Read More “Mushroom Cultivation Automation: From Foraging to Fruiting” →"
