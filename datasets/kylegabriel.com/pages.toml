["https://kylegabriel.com/projects/2019/03/outdoor-lorawan-gateway.html"]
title = "Outdoor LoRaWAN Gateway – Projects | Kyle Gabriel"
description = "March 20, 2019May 26, 2021Outdoor LoRaWAN Gateway"
full_description = "LoRaWAN Raspberry Pi Wireless7 Comments I’ve been heavily involved with sensors and remote sensing for many years. Recently, I’ve become intrigued with remote sensing, and began my exploration with LoRaWAN. However, to start experimenting with sensor nodes, I would need a gateway to receive all my node transmissions (as well as send back any data to the nodes). Below is how I built and implemented my outdoor LoRaWAN Gateway. Bill of Materials PartQuantityPurchaseRaspberry Pi 3 B+ or Raspberry Pi 41Amazon, AmazonMicro SD Card (32 GB)1AmazonLoRaGo PORT Multi-channel LoRaWAN Gateway1Sandbox Electronics915 MHz 8 dBi LoRaWAN Antenna1Embedded WorksIP67 Weatherproof Enclosure1AmazonAntenna Mast Clamp1AmazonPassive Power Over Ethernet (PoE) Injector2AmazonWaterproof Panel Mount RJ45 Connector1AmazonNEMA Box Vent2AmazonAntenna Tripod Mount1AmazonWeatherproof Cable Glands1Amazon12-volt 5-Amp Power Adapter1AmazonAdjustable Voltage Regulator1Amazon50 Feet CAT-7 Cable1AmazonSHT31 Temperature/Humidity Sensor1Amazon Construction Positioning the components on the back plate of the enclosure was simple enough. There was a lot of room to work with, and I gave consideration to how heat would rise in the case. The Pi was positioned relatively low, with the temperature/humidity sensor positioned near the top to obtain potentially the most extreme conditions of the case. An antenna mast mount was used to secure both the enclosure and the antenna to a 2-inch steel pipe. This pipe was then fixed to a satellite tripod mount. Rubber washers were used both inside and outside of the enclosure to prevent water intrusion through the mount holes. #foogallery-gallery-1835 .fg-image { width: 300px; } Raspberry Pi and the LoRaGo PORT Multi-channel LoRaWAN Gateway (Sandbox Electronics) being positioned on the back plate of the enclosure.The 8 dBi antenna that looks and feels just like a lightsaber.An antenna mast clamp to connect the outdoor enclosure and antenna to a 2-inch steel pole. Two vents were installed, with one higher than the other to facilitate airflow that would arise from the heat generated by the Pi and gateway hardware. The 12 volts from the PoE injector was regulated to 5 volts to power the Pi. The LAN was connected from the PoE injector directly to the Pi to provide network connectivity. WiFi could also have been used, however this is often not as reliable as a wired connection. The gateway hardware attached directly to the Pi for both communication and power. The antenna from the gateway exited the enclosure through a weatherproof cable gland and connected to the antenna. The gateway was bolted to a plywood deck and the CAT-7 ethernet cable was connected to a router to provide internet access for the gateway to send data to The Things Network. This setup could also be modified for use with a custom-built LoRaWAN receiver if one wished to build their own network (i.e. if there was no internet access and all data was fed to a local server). #foogallery-gallery-1838 .fg-image { width: 300px; } Completed gateway with Raspberry Pi, LoRaWAN gateway, power over ethernet (PoE) adapter, adjustable buck converter regulated at 5-volts, a SHT31 temperature and humidity sensor, and weatherproof ethernet cable gland to enable power and data transmission.Two downward-facing NEMA vents were used to prevent moisture or heat build-up in the enclosure.Completed gateway with satellite mount and 2-inch steel pole affixed to a plywood deck. Both data and 12 volts is transmitted over the ethernet cable. The area surrounding this gateway is heavily wooded, however I’ve successfully received transmissions from a mile away. The property this is on is only 26 acres, so it easily covers the entire property. Projects that use this gateway Remote Radiation Monitoring (2019)LoRaWAN Tracker and Mapper (2019)Check out the Projects page to see the most up-to-date list. Affiliate links I participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means for sites to earn advertising fees by advertising and linking to Amazon.com, and I make a commission for sales made through affiliate links posted on this website. Kyle Gabriel"
year_published = 2020
year_updated = 2020
clearnet = "https://kylegabriel.com/projects/2019/03/outdoor-lorawan-gateway.html"
