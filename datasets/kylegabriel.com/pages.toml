full_description = "Automated Hydroponic System Build June 3, 2020August 28, 2022 Automation Cultivation Hydroponic Mycodo Raspberry Pi Last Updated: August 28, 2022 Hydroponic farming is a method of growing crops without soil, with the main benefits of environmental and nutrient control, water conservation, and reduction of labor. This technique relies on a number of technologies that the principles of automation can be applied in order to improve yield and consistency. In this article and accompanying video, I’ll show you how to built a hydroponic system with basic components and automate it using the open source software Mycodo running on a Raspberry Pi single board computer. Read More “Automated Hydroponic System Build” →"
