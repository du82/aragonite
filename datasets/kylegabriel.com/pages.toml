["https://kylegabriel.com/projects/2019/08/remote-radiation-monitoring.html"]
title = "Remote Radiation Monitoring – Projects | Kyle Gabriel"
description = "August 19, 2019May 8, 2020Remote Radiation Monitoring"
full_description = "Automation LoRaWAN Raspberry Pi Wireless6 Comments Radiation is the transmission of energy through space in the form of a particle or wave. These can be generated by instruments or produced naturally. One of the most common uses of radiation is from radionuclides, or radioactive isotopes, that release radiation during decay, or degradation. These radioactive materials are often used for cancer therapy, research, and energy production. The danger radiation exposure poses to humans can be quite significant, as it’s both invisible and the effects may not be immediately noticeable. Couple that with the growing number of nuclear power plants being built and the fact governments and corporations have not always being forthcoming about the details of radioactive release incidents (e.g. the Chernobyl nuclear disaster), having the ability to detect radiation levels may prove useful for detecting a radioactive release before the public is notified or verifying publicly-released dose information. I spent a while working as an R1 university radiation safety specialist, where I acquired many great skills and experiences, which included handling radioisotopes, monitoring human exposure (dosimetry), overseeing the proper disposal of radioisotopes, and participating in first-responder training and exercises that prepared me and my team in the event of a radiological release or an incident with a radiological dispersal device (dirty bomb). These experiences led me to appreciate the power of radiation and the risks associated with it. Since the Fukushima radiation release, many hobbyists began implementing radiation monitoring systems to track the global spread of radiation that emanated from Japan. Some of these projects lead to public monitoring programs that still operate today. Device Development Below is how I implemented a remote radiation monitor that relays radiation levels to two public radiation maps, Safecast and Geiger Counter World Map, for a total cost of approximately $150 (minus the cost of the LoRaWAN gateway). More details can be found here if you would like to implement your own radiation monitor. My requirements for the monitoring system: Battery-poweredLow power operationData transmission from a remote locationSmall low-power display in case power/internet is not availableAutomatic upload to public radiation maps I chose the Moteino Mega with the RMF95 LoRaWAN transceiver as the development platform, and the MightyOhm Geiger Counter 1.0 with a SBM-20 Geiger-Müller tube for the sensor. A battery pack with three AA batteries was used to power the entire system, and a Pelican Case (model 1050) was used to house all the components so it could be safely deployed outside. The serial transmit pin of the Geiger counter was connected to the serial receive pin of the Moteino Mega to receive counts per minute (CPM) and microSieverts per hour (μSv/hr) measurements as a string and parse them into number values. A pin of the Moteino Mega was used to power the Geiger counter. Since the Geiger counter only draws 10 mA, this could be wired directly to the pin, as this amount doesn’t exceed the current rating of the pin. This allows the Moteino Mega to depower the Geiger counter and remain in a low-power sleep mode until the next measurement and LoRaWAN transmission. An I2C 128×64 OLED display was added for the ability to read the radiation level from the device. A LoRaWAN gateway I built previously was used to receive transmissions from the Moteino Mega. Live Radiation Data View the live radiation levels recorded by this device:Safecast measurement (user 1920)GMC Map measurements (user 22044260632) The entire system is housed in the Pelican case. The 3x AA battery holder is positioned under the Geiger counter. Closer view of the 128×64 OLED display. The Pelican case is weatherproof, allowing the unit to be placed outside for extended durations. This system is currently undergoing a long-duration test that acquires measurements for 1 minute and transmits every hour. I’ll be updating this article with statistics once the batteries have died. GMC Map showing my local radiation counts per minute. GMC Map list of most recently-logged counts per minute. Safecast map showing my local radiation counts per minute. Safecast list of most recently-logged counts per minute. Kyle Gabriel"
