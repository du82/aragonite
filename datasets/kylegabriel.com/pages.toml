["https://kylegabriel.com/projects/2020/06/automated-hydroponic-system-build.html"]
title = "Automated Hydroponic System Build – Projects | Kyle Gabriel"
description = "June 3, 2020August 28, 2022Automated Hydroponic System Build"
full_description = "Automation Cultivation Hydroponic Mycodo Raspberry Pi174 Comments Last Updated: August 28, 2022 Hydroponic farming is a method of growing crops without soil, with the main benefits of environmental and nutrient control, water conservation, and reduction of labor. This technique relies on a number of technologies that the principles of automation can be applied in order to improve yield and consistency. In this article and accompanying video, I’ll show you how to built a hydroponic system with basic components and automate it using the open source software Mycodo running on a Raspberry Pi single board computer. Watch the video Automated Hydroponic System Build on YouTube Many of the aspects that make hydroponic farming so efficient can also make it challenging to implement. Water and nutrients must be provided in a balanced ratio while being constantly monitored and adjusted as plants develop. Temperature regulation can also become a problem since the circulating water system acts as a heat pump. Additionally, the microbial communities that can benefit or harm your crops are now competing in an aqueous rather than a terrestrial environment, sending us even further into unknown and potentially dangerous territory. And to make matters worse, if you have a prolonged power outage, you may need to manually water or have a generator to keep the water pump going, else you may injure your crops. Even with these challenges, there are several aspects that make hydroponics attractive (Barbosa et al. 2015). An optimal amount of nutrients can be supplied directly to plant roots in an immediately-usable form. Plants can be grown in areas with poor soil or limited space, or grown vertically to maximize plant density. Water waste is reduced by recirculating it back into the system. There’s also no need to worry about weeds. Although there are a number of different hydroponic and cultivation techniques, this article explores only one of the ways to build a hydroponic system and apply principles of automation to monitor and regulate it. This is meant primarily to demonstrate the process of applying automation techniques, which can be adapted to many other systems. And while the hydroponic system I built is relatively small, it’s a modular design that can be scaled to different growing spaces, be it a small grow tent or a large commercial greenhouse. Table of Contents 1 Support 2 Introduction 2.1 Hydroponic System Automation Features 3 Disclosures 4 Materials & Parts List 4.1 Tools (Essential) 4.2 Tools (Non-Essential) 4.3 Base Hydroponic System 4.4 Planting 4.5 Environmental Monitoring and Regulation System 4.6 Power Control Box 4.7 Water Condition Sensing 4.8 Water Dosing 4.9 Water Flow and Level Sensing 4.10 Air Condition Sensing 4.11 Electrical Power Sensing 4.12 3D Printed Parts 5 Building the Hydroponic System 5.1 Frame 5.2 Water Channels 5.3 Water Input 5.4 Water Collection 5.5 Airflow 5.6 Lighting 6 Building the Automation Hardware 6.1 Control Panel 6.1.1 Connecting the Sensors, LCD, and Pump 6.1.2 Connecting the Float Switch 6.1.3 Connecting the RJ45 Surface Mount Jack 6.2 Liquid Solution Dispensing 6.3 Sensor Sample Reservoir 6.4 Water Flow Sensing 6.5 Electrical Current Sensing 6.6 Power Control Box 7 Installing and Configuring the Automation Software 7.1 Install Raspberry Pi Operating System 7.2 Install Mycodo 7.3 Port Forwarding 7.4 Configuring Mycodo 7.4.1 Adding and Configuring Inputs 7.4.2 Adding and Configuring Outputs 7.4.3 Calibration 7.4.4 Adding and Configuring Functions 7.4.4.1 Grow Light Schedule 7.4.4.2 Electrical Conductivity and pH Regulation 7.4.4.3 Vapor Pressure Deficit Regulation 7.4.4.4 Configure Email Notification/Alert Settings 7.4.4.5 Email Notification for Air Temperature 7.4.4.6 Email Notification for Water Level 7.4.4.7 Exhaust Timer 7.4.4.8 DSLR Camera Timelapse 7.4.5 Adding and Configuring the LCD 7.4.6 Adding and Configuring the Camera 7.4.7 Adding and Configuring a Dashboard 7.5 Automation Epilogue 8 Plant Cultivation 8.1 Biocontrol 8.2 Planting Seeds 8.3 Maturation 8.4 Harvest 9 Future Directions 10 Log In to View My System 11 References Support If you find this article or video useful or you use Mycodo and want to support my future work and software development, consider becoming a Patron at patreon.com/kylegabriel Introduction Raspberry Pi 4 single board computer (courtesy of WC) At the core of this automated hydroponic system is the Raspberry Pi single board computer. This $35 computer is only the size of a deck of playing cards, but it has all the components you would find in a full computer, including CPU, RAM, video/audio output, USB, WiFi, Bluetooth, Ethernet, and micro SD slot. The most important feature of the Raspberry Pi for our application is its general purpose input-output (GPIO) pins, which will be used to connect inputs, such as switches and sensors to measure the environment, and outputs such as pumps and relays to move liquids and control electrical devices that will manipulate the environment. Until recently (this month, in fact), the major Achilles Heel of the Raspberry Pi has been an inability to boot from external storage devices, forcing the use of a micro SD card. Micro SD cards were designed for cameras where there are minimal read/write operations. Running a full Linux operating system along with a time-series database recording measurements severely reduces the life expectancy of the SD card and reduces the stability of the system due to file system corruption. In May 2020, firmware that allows the Raspberry Pi 4 to natively boot from an external storage device entered beta. This drastically improves its stability and suitability in critical automation applications. The software which will be installed on the Raspberry Pi to automate the hydroponic system is a free and open source software package I’ve developed, Mycodo, which is essentially a universal tool for environmental measuring, monitoring, and manipulation, and has been used for a number of interesting and diverse applications. Mycodo is a user-friendly yet powerful tool for building automation into almost any system. Below is a brief overview of the functionality that will be configured in Mycodo to operate as a hydroponic system controller: Hydroponic System Automation Features Measure water conditions: pH, electrical conductivity, temperature, level, and flow.Measure air conditions: temperature, humidity, vapor pressure deficit, and carbon dioxide (CO2).Control relays to modulate lights, air exhaust fan, and humidifier.Control four peristaltic pumps to dispense specific volumes of solutions: acid, base, nutrient A, and nutrient B.Automatically adjust water to target pH range by dispensing acid/base solutions.Automatically adjust water to target electrical conductivity range by dispensing nutrient solutions.Automatically adjust air to target humidity, temperature, and CO2 concentration ranges by modulating an exhaust fan and humidifier.Automatically regulate air vapor pressure deficit (VPD) with a humidifier and exhaust fan, using a PID controller.Use timers to schedule grow lights, air exhaust, and a DSLR camera shutter for high quality time-lapse photography.E-mail alert notifications if select measurements fall outside acceptable ranges (e.g. temperature too high, water level too low, water flow has stopped, etc.).Measure electrical energy usage with a transformer to automatically calculate operating costs.Use the Raspberry Pi Camera to monitor plants with a live video stream and conduct time-lapse photography of plant growth.Configure dashboards with gauges, graphs, camera feed, and other widgets to view all relevant data on a single page.Forward port 443 through your router to the Raspberry Pi to be able to access the Mycodo web interface from anywhere with internet access (using a user login system for security). Disclosures I reached out to Atlas Scientific to ask if they would be willing to contribute to this project, and they were kind enough to donate 4 peristaltic pumps, an electrical conductivity sensor kit, and a pH sensor kit. I’ve used Atlas Scientific instruments for years and have incorporated support for several of their sensors and pumps into Mycodo, all prior to this project. I’d like to thank them for their donations and for making quality products. Additionally, I earn a commission from qualifying purchases. What this means is if you click a link on my site to a product and purchase it, I may earn a small commission, without any additional cost to you. Please consider using these links if you would like to support my work and see more like it in the future. Materials & Parts List Each part of building and operating the hydroponic system will be covered in detail. As needs vary, so too will the choice of materials one incorporates into his or her system. The materials list below is only meant to provide a complete list of the components used in this particular build. Tools (Essential) These tools are the minimum required to build this system, unless you want to adopt some creative fabrication techniques. DescriptionPurchaseSoldering IronAmazonSolderAmazonSaw or Dremel with Cutting KitAmazon, AmazonHeat GunAmazonCordless DrillAmazonDrill Bit Set (16-Piece)AmazonStep Drill Bit (1/4 to 1 3/8 in.)Amazon1 3/4 in. Hole Saw BitAmazonScrewdriver SetHardware StoreThread Seal TapeHardware Store Tools (Non-Essential) These tools aren’t required to build the system but are useful for verifying measurements and tuning the system. DescriptionPurchasePhotosynthetically active radiation (PAR) MeterAmazonClamp Electrical Current MeterAmazon Base Hydroponic System These are the components necessary to build the base hydroponic system that can operate to grow crops but will need to be manually operated. The materials further below will automate various parts of the system. DescriptionPurchaseQuantityGrow TentAmazon1Grow LightAmazon1Microtube GrommetAmHydro6MicrotubeAmHydro62 in.