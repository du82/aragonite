Gang Wall PlateHome Depot12-Channel Relay Module (Mechanical, 10-Amp)Amazon12-Channel Relay Module (Solid State, 2-Amp)Amazon114 Gauge Copper WireHome Depot1 Spool Water Condition Sensing These materials enable various water chemistry to be measured and provides feedback for the water dosing system. DescriptionPurchaseQuantityAtlas Scientific PT-1000 Temperature Sensor KitAmazon1Atlas Scientific EZO Carrier Board (for Temperature Sensor)Amazon1Atlas Scientific pH Sensor KitAmazon1Atlas Scientific Electrical Conductivity Sensor KitAmazon1Aquarium Specimen ContainerAmazon1 Water Dosing These materials enable the water chemistry to be adjusted by dispensing different liquid solutions. DescriptionPurchaseQuantityAtlas Scientific Peristaltic PumpAmazon4Silicone Tubing (ID 3 mm x OD 5 mm)Amazon11/8 in. Hose Barb UnionAmazon1 Pack12-Volt 5-Amp DC Power Supply and Female Barrel ConnectorAmazon1 Water Flow and Level Sensing These materials enable the measuring of water conditions that allow for the system to be monitored for proper operation. DescriptionPurchaseQuantityAtlas Scientific Flow MeterAtlas Scientific1Atlas Scientific Flow Meter TotalizerAmazon1Atlas Scientific EZO Carrier BoardAmazon11/4 in. O.D. x 3/8 in. MIP NPTF Push-to-Connect Adapter FittingHome Depot23/8 in. FIP Brass Pipe Coupling FittingHome Depot2Water Level Float Switch with Pipe MountAmazon1Assorted Resistor KitAmazon1 Air Condition Sensing These materials enable various air conditions to be measured. DescriptionPurchaseQuantityHTU21DF Temperature/Humidity Sensor (or AM2315, SHT31, etc. See Supported Sensors)Amazon, Amazon, Amazon, DFRobot, DFRobot1Dupont Crimping Tool and ConnectorsAmazon1MH-Z19B CO2 SensorAmazon, Tindie1UART to USB Converter (USB Interface)Amazon1 Electrical Power Sensing These materials enable the amount of power consumed by the system to be measured. DescriptionPurchaseQuantityAnalog-to-Digital ConverterAmazon, DFRobot1AC Current Sensor with Split Transformer or Greystone CS-650-R1