title = "Security – Projects | Kyle Gabriel"
full_description = "Moto Security System November 19, 2009August 30, 2019 Security Building a vehicle security system has been in mind for a while, however, a recent surge in motorcycle thefts from my university has forced me to pick up the pace with development. What this circuit does is diable the fuel pump, once the bike’s power is turned on from the ignition, until a magnet must be passed over a hidden reed switch to activate a latching relay. This latched relay will continuously power the fuel pump until a) the ignition is turned off, b) the engine kill-switch is used, or c) a button on the handlebar is pressed that silently resets the circuit (without killing the engine). An LED is used to quickly identify whether power is going to the fuel pump. Read More “Moto Security System” →"
