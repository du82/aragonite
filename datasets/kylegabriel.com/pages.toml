["https://kylegabriel.com/projects/2019/04/lorawan-tracker-and-mapper.html"]
title = "LoRaWAN Tracker and Mapper – Projects | Kyle Gabriel"
description = "April 4, 2019May 26, 2021LoRaWAN Tracker and Mapper"
full_description = "Automation LoRaWAN Microcontroller Wireless4 Comments LoRaWAN is a great long-distance, low-power transmission protocol. One of the questions that often comes up after deploying a gateway and nodes is “what’s the greatest distance I can successfully transmit between my gateway and node?” You could watch your Application traffic on The Things Network as you move to strategic locations and see if packets appear. However, an automated approach to this could save time and allow you to cover more ground. To do this, you’ll need a node with a GPS to send its location and software to aggregate the received data on a map to show the node transmission locations. This way you can have the node automatically transmit at a rapid interval as you walk, cycle, or drive to various locations. TTN Mapper is a web-based mapping software that does this from data transmitted to The Things Network. However, the issue with TTN Mapper is it does not update in real-time, requiring up to a day to see if your transmissions were successfully received. This limits it’s usefulness if you’re trying to determine transmission distance as you’re on the move, such as I like to do while driving. To overcome this limitation, I developed mapping software that receives the location data from The Things Network and displays it in real-time on a map in a web browser on your phone, tablet, or computer. This map can even display your current location if you permit location sharing. The backend of the software runs in a docker container and has been successfully built and tested on both a Raspberry Pi and a desktop PC running a 64-bit version of Ubuntu. Features The TTGO T-Beam development platform, based on the ESP32, with GPS, WiFi, Bluetooth, LoRaWAN, and an OLED display. Multiple map layers, including topology, streets, and satellite (Bing API key required for satellite)Automatically acquires new data and adds markers to the mapTracking tool to use device GPS to place marker of current position (and direction) on map (requires allowing location permission for browser/phone)Scale bar on edge of mapSSL/HTTPS (required for location tracking)Measuring tool for measure distances between pointsMap stays focused on the same point across page refreshesClicking gateway or data point markers pops up information about them The hardware I chose for the node was the TTGO T-Beam with an OLED display, which I developed tracking software that works for both TTN Mapper and my TTN Tracker software. More information, including hardware, code, and setup instructions can be found at the following links:TTGO T-Beam TTN Tracker: kizniche/ttgo-tbeam-ttn-trackerTTN Web Tracker: kizniche/ttn-trackerOutdoor LoRaWAN Gateway #foogallery-gallery-1856 .fg-image { width: 225px; } Web browser view of TTN Tracker with the gateway (blue marker) and points where the tracking node successfully transmitted to the gateway (red marks).Distance can be measured from any number of points from within the map.Information about both the gateways and the nodes can be viewed by selecting a marker.There are also several map layers to choose from, including topographic and satellite. Affiliate links I participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means for sites to earn advertising fees by advertising and linking to Amazon.com, and I make a commission for sales made through affiliate links posted on this website. Kyle Gabriel"
