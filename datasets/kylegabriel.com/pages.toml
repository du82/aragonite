title = "About – Kyle Gabriel"
full_description = "Hi, I’m Kyle Gabriel. I’m a microbiologist and hobbyist engineer who enjoys building useful and interesting things. Many of my projects are open source so you can use and learn from my designs. Please consider sponsoring my work. I’m also a research scientist at Kennesaw State University, where I work developing novel methods and products for microbial control, brewing science, chemistry analytics, mushroom cultivation, remote sensing, robotics, and other areas. I am passionate about topics that range from biodiversity and health, to informatics and robotics. I believe technological advancement should play a vital role in improving quality of life, by promoting health in both society and the environment. Profiles GithubYoutubeInstagramTwitterLinkedInPatreonHackaday.ioThingiverseOSH Park Experience OWNER/PRESIDENT, SCIENTIFIC SOLUTIONS, LLCKennesaw, Georgia, 2019 – PresentSpecializes in scientific consultation and engineering services.Engineered and manufactured the Automated Particle Counter, a large particle flow cytometer for automated counting and dispensing of living organisms in a liquid solution, and the Automated Flying Insect Aspirator, an aspirator for automated counting and dispensing of living flying insects into collection vessels. RESEARCH SCIENTISTBioInnovation LaboratoryKennesaw State University, Kennesaw, Georgia, 2017 – PresentMy work primarily involves the development of novel microbial control methods, beer and fermentation analytics, and mushroom cultivation, among other interests. The BioInnovation laboratory at Kennesaw State University was started in 2017 to develop new intellectual property that draws from a wide range of fields, including engineering, software development, biology, chemistry, and more. RADIATION SAFETY SPECIALISTGeorgia State University, Atlanta, Georgia, 2013 – 2014Managed a campus-wide radiation safety program, facilitating radioactive materials research and protecting people and the environment from adverse effects of radiation. Conducted radioactive contamination surveys and dose monitoring. Educated faculty, staff, and students of radiation hazards, compliance, and safety protocols. Developed safety protocols and training exercises for handling radioactive material. Implemented and managed a radionuclide inventory and tracking system.Emergency and hazardous material incident-responder for GSU and the Atlanta area. Trained in handling biological, chemical, radiological, and other hazardous materials in Level A hazmat personal protective equipment (PPE). Regularly participated in training exercises. Used first responder equipment to detect and analyze known and unknown materials (such as the MiniRAE VOC monitor, Impact 4 gas monitor, combustible gas detector, Geiger counters, Jerome mercury vapor analyzer, pH analyzers, and the FirstDefender AhuraFD). WEB DEVELOPERGeorgia State University, Atlanta, Georgia, 2013 – 2014Managed a multisite WordPress environment where navigation and content was the primary emphasis, for the university’s research and environmental health and safety websites. Produced audio/video lecture series from raw recordings. Created graphics and manipulated photographs. Developed dynamic PDF documents, including laboratory door sign generators, radiation contamination surveys, responsive laboratory inspection checklists, and training request and completion forms, among others. Education DOCTOR OF PHILOSOPHY (Ph.D.) BIOLOGY, MICROBIOLOGYGeorgia State University, Atlanta, Georgia, 2017 MASTER OF SCIENCE (M.S.) BIOLOGY, MICROBIOLOGYGeorgia State University, Atlanta, Georgia, 2013 BACHELOR OF SCIENCE (B.S.) BIOLOGYFlorida Atlantic University, Boca Raton, Florida, 2010 MARINER TRAININGChapman School of Seamanship, Stuart, Florida, 2004 Publications Parker, Ryan A., Kyle T. Gabriel, Kayla D. Graham, Bethany K. Butts, Christopher T. Cornelison. 2022. Antifungal Activity of Select Essential Oils against Candida auris and Their Interactions with Antifun