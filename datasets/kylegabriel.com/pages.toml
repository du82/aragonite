title = "Travel | Kyle Gabriel"
description = "Exploration"
full_description = 'En Moto al Sur (2010-11) A solo motorcycle journey from the modern age into ancient Latin America. Living day-to-day for 5 months while traveling 17,000 miles throughout the US, Mexico, and Central America. IntroductionFinal PreparationsSic InfitCon Amigos en la PlayaUp the CoastThe Expense of SafetyMisty Mountain CanyoneeringTail of the Dragon– Photo Update –Boxingkick on the GulfMexico-boundWindy on the GulfThe Mayan Ruins at PalenqueThe Mayan Ruins at Uxmal, Chichen Itza, Cobá, and Tulum– Route Update –Belize and Guatemala– Video Update –Río Dulce to Guatemala CitySanta Cruz, Cobán, and TikalThe Mayan Ruins at TikalSan Cristóbal de las Casas to GuadalajaraGuadalajara to DenverMy Birthday And The Local Flavor of DenverA White Elephant In The RoomViva el Deseo!Reflections on 5 Months on the Road Halpatiokee (2010) A motorcycle trip to spend a summer night under the stars and a day in the forests of Halpatiokee Nature Preserve in Stuart, Florida. This was a trial of the gear I would be carrying for the above trip, En Moto al Sur, a few months later. Backpacking New Zealand (2006-07) Skipping winter entirely in 2006, I flew to the southern hemisphere to backpack across New Zealand’s south island with my pal Phil. Cross Country: Dunedin to HectorOtago PeninsulaCherry-picking in AlexandraMotueka Cove {"@context":"http:\/\/schema.org\/","@id":"https:\/\/kylegabriel.com\/travel\/#arve-youtube-v9xvcea89ow","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/V9xVCea89Ow?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} Sailing the Atlantic (2006) My summer as a crew member aboard the 41-foot schooner Exodus. Our goal was to sail out of south Florida waters, northward to leave hurricane alley before the hurricane season began. We were out at sea for a week before a leaking fuel injection pump brought us in to dock in Brunswick, Georgia. Due to logistics, this would be as far north as we would make it this season. After a road trip to Texas and Arkansas, I returning briefly to Florida before jettisoning to New Zealand. Moto Europe (2005) On two BMW 1150R motorcycles, my mother and I traveled throughout Germany, France, Switzerland, Lichtenstein, and Austria. Photo AlbumRiver Surfing (Munich, Germany)Salle de Coqs (Obernai, France)Swiss AlpsBlack Forest'
