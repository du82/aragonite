title = "Mushroom Cultivation Automation: From Foraging to Fruiting – Projects | Kyle Gabriel"
description = "September 3, 2021May 13, 2022Mushroom Cultivation Automation: From Foraging to Fruiting"
full_description = "Automation Cultivation Mushroom Mycodo Raspberry Pi11 Comments Last Updated: April 13, 2022 Mushrooms are a unique and often mysterious organism. They’re not quite plants and not quite animals. As a fungus, mushrooms represent a distinct evolutionary lineage. Fungi grow as a single-cell yeast form (used in beer, wine, and bread making) and multi-cellular, thread-like mycelia that often produce fruiting bodies (mushrooms) and sclerotia (e.g. truffles), and are responsible for the decomposition of the vast majority of dead plant matter. Understanding life cycle of mushroom fungi is a valuable skill if you wish to harness this knowledge for mushroom cultivation. There are a variety of edible mushrooms that can be readily cultivated. Button/portobello, oyster, shiitake, and lion’s mane are a few common and hardy species for which reliable cultivation methods have been developed. However, there are a few specific skills and techniques that are necessary if you wish to go through the process of foraging wild mushrooms to cultivating them. This article and accompanying video will demystify this process by demonstrating how mushroom cultivation can be performed with a minimal skill set and budget. Watch the video Mushroom Cultivation Automation on YouTube Table of Contents 1 Support 2 Introduction 2.1 Mycodo Features in this Project 3 Disclosures 4 Materials & Parts List 4.1 Tools 4.2 Laminar Flow Hood 4.3 Isolation & Culture Materials 4.4 Base Mushroom Cultivation System 4.5 Environmental Monitoring and Regulation System 4.6 Electrical Power Control and Sensing 5 Building the Laminar Flow Hood 5.1 Frame 5.2 Air Filter Adapter 5.3 Assembly 5.4 Operation 6 Building a Regulated Mushroom Cultivation Environment 6.1 Control Panel 6.2 Power Control 6.3 Tent and Environmental Control 7 Software Setup 7.1 Install Raspberry Pi OS 7.2 Install Mycodo 7.3 Configure Mycodo 7.3.1 System Information Page 7.3.2 Input Page 7.3.2.1 Temperature and Humidity Sensor Input 7.3.2.2 Carbon Dioxide Sensor Input 7.3.2.3 Power Monitor Input 7.3.3 Live Measurements Page 7.3.4 Output Page 7.3.4.1 WiFi Power Strip Output 7.3.4.2 Fan Speed Control PWM Output 7.3.4.3 Photo Time-lapse Light Output 7.3.5 Settings: Alert Page 7.3.6 Function Page 7.3.6.1 LCD Display Function 7.3.6.2 Humidity Regulation PID Function 7.3.6.3 Carbon Dioxide Regulation Function 7.3.6.4 Low Humidity Email Alert Function 7.3.7 Camera Page 7.3.8 Dashboard Page 8 Mushroom Cultivation 8.1 Foraging Mushrooms 8.2 Growth Media Preparation 8.3 Culture Isolation 8.4 Culture Propagation 8.5 Spawn Production 8.6 Bulk Substrate Production 8.7 Bulk Substrate Colonization 8.8 Mushroom Primordia Formation 8.9 Mushroom Fruiting 9 Fried Oyster Mushroom Recipe 10 Future Directions 11 References Support If you find this article or video interesting, useful, or you use Mycodo and want to support my future work and software development, consider becoming a GitHub Sponsor or Patron, or making a donation. Introduction Among Eukaryotic organisms, mushrooms belong to the Kingdom Fungi, which is distinct from the two other well-known Kingdoms, Plantae (plants) and Animalia (animals). Interestingly, fungi are more closely related to animals than plants. Fungi are most commonly found as yeasts, molds, and mushrooms. Although they share many similarities, their life cycles can differ significantly. Fungi that produce mushrooms typically have three distinct phases of their growth cycle: 1) colonization as filamentous mycelia, 2) primordia or pre-mushroom formation, and 3) fruiting body or mushroom formation. Each growth stage often requires specific environmental conditions for initiation and to grow optimally. The most influential conditions are air temperature, humidity, and carbon dioxide (CO2) concentration. These growth cycle changes are often a natural response to the change in seasonal conditions that promote producing mushrooms. By harnessing this knowledge, we can optimize conditions to promote specific growth stages. To do this, we will rely on sensors to measure our environmental conditions and relays to control devices to modulate these conditions, then create feedback loops with these inputs and outputs to regulate conditions to our desired state. The hardware is inexpensive off-the-shelf components and the software is a custom environmental control system I developed, Mycodo, and is free and open source. Below is an overview of some of the features of the system we will set up, but do check out GitHub for a full list of features. Mycodo Features in this Project Measure air conditions: temperature, humidity, and carbon dioxide concentration.Control relays to operate a humidifier, air pump for sampling carbon dioxide, and lighting for time-lapse photography.Generate a pulse-width modulated (PWM) output signal to control fan speed for fresh air exchange.Automatically adjust air to target humidity and carbon dioxide concentration ranges by modulating the fan and humidifier.Use timers to schedule light & camera captures for time-lapse photography.Send e-mail alert notifications if measurements fall outside acceptable ranges (e.g. temperature, humidity, or carbon dioxide too high or low).Use the Raspberry Pi Camera to monitor mushrooms with live images and conduct time-lapse photography of growth.Configure dashboards with gauges, graphs, camera, and other widgets to view all relevant data on a single page.Forward port 443 through your router to the Raspberry Pi to be able to view and control the system with the Mycodo web interface from anywhere with internet access (with a user login system for security). Disclosures I reached out to Atlas Scientific to ask if they would be willing to contribute to this project, and they were kind enough to donate a temperature/humidity sensor. I’ve used Atlas Scientific instruments for years and have incorporated support for several of their sensors and devices. I’d like to thank them for their donation and for making quality products. Additionally, I earn a commission from qualifying purchases. What this means is if you click a link on my site to a product and purchase it, I may earn a small commission, without any additional cost to you. Please consider using these links if you would like to support my work and see more like it in the future. Materials & Parts List As needs vary, so too will the choice of materials one incorporates into a system build. The materials list below is only meant to provide a complete list of the components I used in this particular build. Tools DescriptionCircular SawMetal-cutting circular saw bladeCordless DrillDrill Bit Set (16-Piece)Countersink Drill Bit12-inch Bar ClampsHex Key Wrench SetDupont Crimping Tool and ConnectorsSoldering Iron3D Printer Laminar Flow Hood DescriptionPurchaseQuantity2020 Extruded Aluminum Rail (1 Meter Span)Amazon102020 6mm T-Slot Corner BraceAmazon142020 6mm Straight Rail ConnectorAmazon42020 6mm M5 T-NutAmazon70M5-0.8 x 8 mm BoltAmazon70Fan UnitAmazon1HEPA Filter (24 inch x 24 inch)Amazon12-foot x 3-foot Poster Frame (for plastic panels)Local Store3 or 42-foot x 2-foot x 3/4-inch PlywoodHardware Store11/2-inch Wood ScrewHardware Store12Weather Stripping with AdhesiveAmazon1Varnish and Paint BrushHardware Store1 small canSilicon SealantHardware Store1 tubeVariable Transformer/Variac (Optional)Amazon1Digital Multimeter with Current Transformer (Optional)Amazon1Custom 3D-Printed Case for Digital MultimeterFree 3D Model Download1 Isolation & Culture Materials DescriptionPurchaseQuantityNitrile GlovesAmazon1 boxEthanol or Isopropyl AlcoholAmazon1 bottle#11 Scalpel Blades with Metal HandleAmazon1Reusable Glass Petri DishesAmazon10Reusable Metal Petri Dish SleeveAmazon1Pressure CookerAmazon1Paraffin FilmAmazon1 boxAluminum FoilAmazon1 rollScissors or Trauma ShearsAmazon, Amazon1Powered Light Dry Malt ExtractAmazon1 lb bagPowered AgarAmazon1 bottleBird SeedAmazon1 bagMushroom Culture (Foraged or Purchased)1GL45 Glass BottleAmazon2 packWide Mouth Jars (20 oz)Amazon1 packMilligram Digital ScaleAmazon1Weigh BoatsAmazon1 packMeasuring CupAmazon1 Base Mushroom Cultivation System DescriptionPurchaseQuantityGrow Tent (24 x 24 x 36 inch)Amazon1HumidifierAmazon180 mm PC Fan with Power AdapterAmazon1 Environmental Monitoring and Regulation System DescriptionPurchaseQuantityRaspberry Pi Zero 2 WAmazon1Custom 3D-Printed Mount for Raspberry Pi ZeroFree 3D Model Download1Ultra-Small Pi Terminal Breakout ModuleAmazon1Micro USB Power SwitchAmazon1Micro SD Card (32 GB)Amazon1DIN RailAmazon1DIN Rail Terminal Block KitAmazon1 KitTerminal Block JumpersAmazon1 PackDIN Rail Mounting AdaptersAmazon1 PackCamera Clamp MountAmazon1Raspberry Pi High Quality Camera Module with 6 mm LensRaspberyPi.org1Raspberry Pi Zero Camera Ribbon Cable (mini)Amazon1Raspberry Pi Camera Camera Ribbon Cable (full-size)Amazon1Raspberry Pi Ribbon Cable AdapterAdafruit1Temperature and Humidity SensorAmazon, Amazon, Amazon, Amazon, DFRobot, DFRobot1MH-Z19B Carbon Dioxide Gas SensorAmazon, Tindie1Dupont Crimping Tool and ConnectorsAmazon1Project Box Enclosure (approx. 8 x 5 x 3 inch)Amazon120 character, 4 line I2C LCD DisplayAmazon, DFRobot1Jumper Wire KitAmazon1 packCable GlandsAmazon1 PackElectronically Controlled Duct Fan (4 inch)Amazon1Fan Speed Control BoardOSH Park3Panel Mount Audio Jack (for Fan Speed Control Board)Amazon1 PackAir Filter (4 inch)Amazon1Ducting (4 inch)Amazon1 Electrical Power Control and Sensing These materials enable the control of electrical devices and monitor the amount of power consumed by the system. Description3-Outlet Smart WiFi Power StripOr search the database of Tasmota-supported devices to find an alternative Building the Laminar Flow Hood A laminar flow hood creates a stream of clean, sterile air for you to work in that prevents contaminating microorganisms in the air from coming into contact with what you’re working on. This is an essential piece of equipment when working with microorganisms and mushroom cultures because it significantly reduces the chances of contamination. During the process of cultivating mushrooms, you may be working with sterile agar Petri plates, sterile spawn substrates, sterile growth substrates, and of course mushroom cultures. Any number of microorganisms that normally exist in the air can land on these surfaces and begin growing. These contaminating microorganisms can compete with your mushroom culture by consuming the same growth substrate your mushroom culture is growing on, and in some cases can inhibit the growth of your mushroom culture, produce toxins, release spores, or cause other negative effects from their growth. By using a laminar flow hood with a quality high-efficiency particulate air (HEPA) filter, contamination can be reduced or eliminated entirely. There are three main parts of this laminar flow hood: the frame, HEPA filter, and fan. Frame Extruded aluminum rail was used to create a 2 foot x 2 foot x 2.5 foot frame. The frame can be positioned either vertically or horizontally with the blower fan and filter to provide either a 2 x 2 foot or 2 x 2.5 foot working area surface. Corner braces were used to attach the rails using hex huts and rail channel pieces. Adhere a strip of weather stripping between the top of the frame and the HEPA filter to make an air-tight seal. Plastic sheets from poster frames were cut to fit within the rails and foam insulation was used to secure the plastic to the frame and make a seal. Since there will be positive pressure due to the inflow of sterile air from the HEPA filter, this does not need to be completely air-tight, so this insulation is mainly to improve the rigidity of the thin plastic walls. Air Filter Adapter Whether you use the same fan I used or something else, the outflow opening of the fan may not be exactly the size of the HEPA filter. Therefore, you may need to construct an adapter to mate the opening of your fan output to the HEPA filter. I created a simple adapter plate by cutting a piece of plywood to the outer dimensions of the 2 x 2 foot HEPA filter, then used a circular saw to plunge-cut the inner opening to 1 inch smaller than the size of the fan. I then cut 1-inch strips and screwed these as a rail around the entire inner edge for the fan to rest on. Countersink your screws to allow weatherstripping to seal against the wood. Varnish can be used to seal the wood and silicon calk can be used to seal the wooden joints. Last, soft weatherstripping was affixed to the adapter’s edges that come into contact with the fan box and HEPA filter to make an air-tight seal between the blower fan and the HEPA filter. Assembly To assemble the flow hood, place the frame upright on a sturdy surface at a good height for comfortably working in. Ensure there is enough clearance above the frame for the HEPA filter and fan to be attached. Next, place the HEPA filter on top of the frame. Place the adapter on top of the filter. Last, place the fan on top of the adapter. Last, ensure a good seal is made on all sides between the frame and HEPA filter, between the HEPA filter and adapter plate, and between the adapter plate and fan. Additionally, you can extend the life of your HEPA filter by installing a coarse filter on the fan to filter larger particles. I found a 12 x 12 x 1 inch filter fit perfectly over the opening of my fan box opening. Operation The airflow should be just enough to provide a steady flow of air out of the opening of the hood. The fan I’m using has three speeds, however I found the lowest speed still produced too much air flow. Therefore, I installed a variable transformer, or variac, to reduce the voltage to the fan, and thus further slowed the speed. I know there will be many who will mention that a variable-frequency drive is what should be used for a brushless motor such as this and a variac can potentially damage the motor by allowing the motor to slip and draw too much current. However, I already had a variac and since it has an output outlet, it required no rewiring. I found ~90 volts AC (normally 120) produced an ideal fan speed, and at that voltage, I measured no increased current consumption with an in-line power meter I constructed. Furthermore, as this is a fan, the air flow over the motor is more than adequate to remove any additional heat that may be generated from any inefficiencies introduced. Alternatively, you can achieve a slower air flow by simply using a shim to introduce a small opening between the fan and HEPA filter to allow some air to escape, effectively lowering the air pressure, resulting in less air passing through the filter and a lower air flow in the hood. Building a Regulated Mushroom Cultivation Environment Next, we’ll construct a simple humidity- and carbon dioxide-regulated chamber for colonizing and fruiting mushrooms. I will not include temperature regulation since this chamber is inside my temperature-regulated house, but this may be required if your ambient temperature is too high for what yo"
