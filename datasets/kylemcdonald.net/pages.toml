title = "Kyle McDonald"
description = "Transformirror 2023  with Daito Manabe and Rhizomatiks  Real-time text to image and text to music powering an AI-driven interactive mirror. When everything is imagined by the AI, from the music to the imagery, the prompts, and even the title of the piece, what does it feel like to look in the mirror?"
full_description = '''Kyle McDonald @kcimc studio@kylemcdonald.net Biography Kyle McDonald is an artist working with code. He crafts interactive installations, sneaky interventions, playful websites, workshops, andtoolkits for other artists working with code. Exploring possibilities of new technologies: to understand how they affect society, to misuse them, and build alternative futures; aiming to share a laugh, spark curiosity, create confusion, and share spaces with magical vibes. Working with machine learning, computer vision, social and surveillance tech spanning commercial and arts spaces. Previously adjunct professor at NYU's ITP, member of F.A.T. Lab, community manager for openFrameworks, and artist in residence at STUDIO for Creative Inquiry at CMU, and YCAM in Japan. Work commissioned and shown around the world, including: the V&A, NTT ICC, Ars Electronica, Sonar, Todays Art, and Eyebeam. Selected Work Transformirror 2023 with Daito Manabe and Rhizomatiks Real-time text to image and text to music powering an AI-driven interactive mirror. When everything is imagined by the AI, from the music to the imagery, the prompts, and even the title of the piece, what does it feel like to look in the mirror? videotext Generative MV 2023 with Daito Manabe and Rhizomatiks A music video using image-to-image technology to dynamically change the background in real time, in response to text input by the audience. It is based on the green screen footage of the song “Perspective” performed at the 2020 online concert. ICCproject pageexhibitionphotos Voice In My Head 2023 with Lauren McCarthy Exploring the implications for AI to listen and intervene in your social experience in real-time, augmenting your personality. The piece begins with an onboarding session where you place a bud in your ear and the voice asks you to reflect on the inner voice you were born with. What if it could be more caring? Less obsessive? Less judgmental? More helpful? What if you could change your inner monologue? project pagetrailerpodcast interview Unlearning Language 2022 with Lauren McCarthy and Yamaguchi Center for Arts and Media An interactive installation and performance that uses machine learning to provoke us to find new understandings of language, undetectable to algorithms. project pageperformancevideo Amends 2022 A series of sculptures designed to mitigate emissions from Ethereum NFT marketplaces. Amends will go on sale when Ethereum transitions away from proof-of-work. The work is priced to fund complete carbon mitigation, supplied by three partners—each with different approaches to carbon dioxide removal and emissions prevention. sitecodevideogray areaLACMAinvestor junkieoutlandmonopolinterdependencedigitally rare Crypto Therapy 2022 A group therapy session for people working through their feelings around crypto. We ask questions about our confusion, excitement, frustration, financial anxiety, or even changing friendships due to the complex phenomenon of cryptocurrencies and NFTs. eventone-act playwriteuppresentation Ethereum Emissions 2021 A bottom-up estimate of the energy use and emissions of the Ethereum blockchain. Experiments in cultural intervention in the form of a technical research articles and realtime dashboards. What are the affordances and limitations of research alone? A response to a year of hand-wringing and mud-slinging in the digital arts, asking: how bad is it, really? sitecodepodcast interview Siren 2021 with Annie Lewandowski Audiovisual installation exploring the songs of three humpback whales, recorded by Annie Lewandowski and pioneering bioacoustician Katy Payne. Lighting design backed by ML as an aid for deeper listening. Projected on derelict fishing gear, recovered from areas where they represent the primary threat to cetaceans. video at mass mocavideo at invisible dogvideo at martha's vineyardvideo at cornellphotos Facework 2020 Game that imagines a world where face analysis is key to the latest gig economy app. As a Faceworker, the player is given an opportunity to interrogate in realtime how computer vision and machine learning tools work — to playfully grow an intuition for what it means to see like a machine, and to understand how machines can fail. Created with support from Mozilla Foundation. sitecodewriteupreview by mark wilson Vibe Check 2020 with Lauren McCarthy Appropriates common surveillance tools including face recognition and expression analysis to catalog the emotional effect exhibition visitors have on one another. Some are identified as evoking expressions of happiness, disgust, sadness, surprise, or boredom. Upon entering the exhibition, visitors are playfully alerted to who these people are, and as they leave, they may find they've earned this distinction themselves. project pagecodedocumentation nvidia-co2 2020 Command-line tool for showing real time gCO2eq emissions estimates in various formats (equivalent sea ice lost per hour, grams of beef consumed, number of light bulbs, etc) combining CPU and GPU usage. A tool for researchers and hobbyists, playfully intervening at the site of one of the most commonly used debugging/monitoring tools used for machine learning. code Innards 2019 Collection of abstract shapes was produced by a recurrent neural network trained on SVG emoji vector art, generating new "emoji" character by character. The layout is inspired by Roger Coqart. siteon hyperallergic Pattern Radio 2019 with Google Creative Lab Working with a decade of underwater recordings collected by NOAA to visualize humpback whale songs. Techniques from computer vision, signal processing, machine learning, all converge to push the creative potential of machine-aided listening of contemporary performers in a 11 million year old cultural practice. sitefrontend codeanalysis codewriteup discrete figures 2018 with Rhizomatiks Internationally touring dance performance. Exploring the relationships between the performing arts and mathematics, giving rise to mathematical entities that engage with the bodies of human dancers onstage. Collecting a custom dance dataset and training a new network for generation of abstract dance-like movement. sitevideowriteupcode ICEspy 2018 Concerned you may know an ICE employee? Use this helpful app to check. Just point your camera and press the photo button. We'll check against hundreds of ICE employee photos from LinkedIn and show you the closest match. A direct subversion of face recognition technology to watch those who wield power without responsibility. sitevideo NSynth Super 2018 with Magenta Synthesizer for exploring neural interpolations of sonic textures. Four knobs for controlling "reference" sounds and a touchscreen for blending between them using the NSynth algorithm. Contributed to conceptual and interaction design, and wrote the synthesis engine and initial user interface. sitecodemaking of videodemo video Man and Woman In The Middle 2017 with Lauren McCarthy We each wrote scripts to intercept and modify or reply to text messages from each other, in the hope of syncing our different communication styles and developing a better relationship and conversation. infophotos How We Act Together 2016 with Lauren McCarthy Prompts you to perform small gestures of social interaction repeatedly until exhausted. Your action triggers a video stream of all the previous participants performing the same action back at you. If you perform longer than anyone before you, your own gesture gets added at the end of the stream. sitereview by joanne mcneilreview by paolo ruffino Bird Sounds 2016 with Google Creative Lab Thousands of bird sounds, organized using machine learning. Similar bird sounds are placed close together, producing a sonic map that produces unexpected connections between different species. introprojectvideo The Infinite Drum Machine 2016 with Google Creative Lab Thousands of everyday sounds, organized using machine learning. Experimenting with alternative interfaces for exploring sound libraries and serendipitous opportunities for musical improvisation and composition. introprojectvideo Terrapattern 2016 with Golan Levin, David Newbury, et al Similar-image search for satellite photos. An open-source tool for discovering "patterns of interest" in unlabeled satellite imagery—a prototype for exploring the unmapped, and the unmappable. Click an interesting spot on Terrapattern's map, and it will find other locations that look similar. sitetalknew yorkerpop sci Highsight 2015 A virtual bungee jump through a real space. Visitors are strapped into a harness and a VR headset showing a live stream from a camera on a wire. The camera meanders through a playful diorama before dropping through the bottom of the box and into the crowd. videocodephotos Exhausting a Crowd 2015 A crowdsourced description of 12 hours in Piccadilly Circus, London, inspired by the classic 60-page piece of experimental literature from Georges Perec, “An Attempt at Exhausting a Place in Paris”, written from a bench over three days in 1974. sitecodeon hyperallergicon citylabon creators project pplkpr 2014 with Lauren McCarthy An app that tracks, analyzes, and auto-manages your relationships. It uses GPS and subtle changes in heart rhythm to keep track of when you're coming and going and determine your emotional state. The data is connected to people you interact with to determine who should be auto-scheduled into or out of your life. siteon hyperallergicon edgadgeton techcrunchon canon animalon wiredon fastcoon independenton fortureon cnbc Augmented Hand Series 2014 with Chris Sugrue and Golan Levin Real-time interactive software system that presents playful, dreamlike, and uncanny transformations of its visitors' hands. It consists of a box into which the visitor inserts their hand, and a screen which displays their "reimagined" hand—for example, with an extra finger, or with fingers that move autonomously. documentationcodevideoon canon wired Serendipity 2014 A map showing ephemeral connections created by simultaneous listens: every second a few people hit "play" on the same song, at the same time. Developed during inaugural media artist residency at Spotify. siteon gizmodoon engadgeton the vergeon quartz Who Pays Artists? 2014 A sounding board for artists to anonymously share stories about what they've been paid for, and by whom. An intervention and conversation starter in the ongoing dialog about money in the context of the arts. websitecodeon animalnyon artnet Social Soul 2014 with Lauren McCarthy An immersive digital experience inspired by the question: how does it feel to be inside someone else's social media stream? Starts with the stream of the person visiting, then uses a custom algorithm to match participants, displaying their social stream instead. After exiting, users and their connected "soulmate" receive a tweet encouraging offline conversation. videophotoscodeon gizmodoon psfk Noodle 2014 with Lauren McCarthy A crowdsourced robot with the inputs and outputs of a computer but the thoughts and feelings of a person. Noodle uses a natural language interface to program mechanical turk workers, providing them with a body for influencing the real world. instructablecode Sharing Faces 2013 For eight months we shared photos between Anyang, Korea and Yamaguchi, Japan. Visiting the installation at either location would match your expression and pose in realtime with these photos of someone else who once stood in front of the installation. Thousands of people visited the work, and saw themselves reflected in the face of another person. videoon apapcodeon canon vergeon wiredon psfk Conversnitch 2013 with Brian House An eavesdropping lamp/lightbulb that livetweets conversations, using a small microphone with a Raspberry Pi that records audio snippets and uploads them to Mechanical Turk for automated transcription. videocodephotoson wiredon salonon the vergeon abajournal us+ 2013 with Lauren McCarthy A Google Hangout app that analyzes speech and facial expressions to improve conversation. Speech to text is handled by the Chrome Speech API, linguistic analysis is based on LIWC and inspired by linguistic style matching research, facial analysis is based on the Hangouts Face API. project pageon neuralstart hangoutvideocodeon huffpoon fastcoon vault Going Public 2013 A one month performance coinciding with the Twitter IPO, where my Twitter profile is made publicly accessible by allowing anyone to tweet as "me" simply by direct messaging me a tweet prepended with a "~" (tilde). original postcodetwitteron mashable FriendFlop 2013 with Lauren McCarthy A browser extension for Chrome that scrambles the identities on your Twitter or Facebook timelines, dissolving your biases and reminding you that everyone is saying the same shit anyway. original postcodeextension page Open Fit 2013 with Lisa Kori Open source software that investigates several approaches to generating custom tailored pants patterns. Open Fit Lab is an experimental event where we use this software for on-the-spot generation and creation of custom clothes. websitecodevideophotoson creators project Roseheading 2013 Endless glitch facets of a "fractured, frozen" mosaic, a metaphor for our data in the cloud. Commissioned by xo. project pagecode Social Roulette 2013 with Jonas Jongejan and Jonas Lund A game with "a 1 in 6 chance of deleting your Facebook account", in fact a hoax that was shut down by Facebook for suggesting the possibility that your account is yours to play games with. websitecodeoriginal postfollowup poston techcrunchon bbcon yahoo newson huffington poston laughing squidon betabeaton the next webon cnet news Light Leaks 2013 with Jonas Jongejan A scattered array of fifty mirror balls reflect light from three projectors, filling a room completely with small reflections, casting patterns that fill the visitor's peripheral vision. Creating a curious space that alternates between a meditative state, and an uneasy imbalance. instagramvideocodeat click festivalphotos Inbox Zero Residency 2013 A one-week residency aimed at clearing my inbox, treating email answering as art, daily digital life as readymade performance. Daily reports on Twitter, supported by GaOk in Seoul. textfirst tweet RAM Dance Toolkit 2013 with YCAM A toolkit for dancers to communicate with each other in virtual environments. Includes functions to access, recognize, and process motion data to support creation of various scenes, and to provide realtime feedbacks to dancers with code, easily. videoproject pagecodetutorial ExR3 2013 with Elliot Woods An anamorphic analog interactive installation that exists coherently in a fractured, mirrored version of a reflected room visible from four points within the real space. videophotoson creators project Reflections 2013 Sculpture for holiday window display at Barneys New York. Inspired by visual aesthetic of "Light Leaks", the sculpture was designed with three.js and Rhino, fabricated from a milled foam base, with generative patterns projected'''
