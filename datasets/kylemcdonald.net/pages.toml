["https://kylemcdonald.net/psac"]
title = "People Staring at Computers"
description = "The Secret Service raids an artist's apartment at Apple's request."
full_description = "In 2011 I published a series of photos taken with the laptops in two New York City Apple Stores, as part of my ongoing exploration of surveillance, face analysis, and computer-mediated interaction. In response, Apple contacted the Secret Service and they raided my apartment. After censoring the work online, Apple did not pursue a civil case against me. And after a few months long investigation by the Secret Service, Assistant United States Attorney Judith Philips declined to prosecute me. Ten years later, this work is still an important reference point for my art practice. I continue to work with faces and to reflect on privacy and surveillance in a new era dominated by machine learning. In 2016 I filed a Freedom of Information Act (FOIA) request to learn more about what happened behind the scenes in 2011. I received a response over a year later. The full FOIA response offers an inside look: scrawled notes on the phone with Apple, descriptions of a Special Agent scrolling through my social media, justifications for a search warrant, a detailed closing report. But it is mostly boring minutiae: multiple pages of paperwork for every piece of hardware that was seized, separate lines documenting every time evidence was withdrawn and returned to the locker. In 2011 I was still under the false belief that all varieties of law enforcement are designed to protect the public from harm. It was a sign of my privilege, and of my naive faith in the system. How many other people have pointed the Secret Service to incriminating evidence on their own laptop, and literally given them passwords in an effort to help? I thought we were all on the same side. In some ways this is a story about how I began to learn that law enforcement is there to protect some specific people (and companies), and not the general public as I imagined. My own blindness and immaturity comes through in some other funny ways. The fact that I never once thought to pick a pseudonym and reply to all the comments, just for fun, shows how deep I was into the idea of having a unified online persona. I didn't really address this until Going Public in 2013, where I let anyone tweet using my account. At the end of that project, I nearly had a breakdown as my online identity fractured and dissolved."
