title = "Human Computer Integration Lab (Lopes' Lab) at University of Chicago"
full_description = "We engineer interactive devices that integrate directly with the user's body—we believe these devices are the natural succession to wearable interfaces. One example of our human-computer integration is our work on interactive devices based on electrical muscle stimulation (EMS). These devices electrically actuate the user's body, enabling touch/forces in VR, or allowing everyday objects to teach their users how they should be operated—our wearables achieve this without the weight and bulkiness of conventional robotic exoskeletons. These devices gain their advantages, not by adding more technology to the body, but from borrowing parts of the body as input/output hardware, resulting in devices that are not only exceptionally small, but that also implement a novel interaction model, in which devices integrate directly with the body. We have been able to generalize this concept to new modalities, including novel ways to interface with a user's sense of temperature, smell, touch and even rich-skin sensations. We think bodily-integrated interactive devices are beneficial as they enable new modes of reasoning with computers, going beyond just symbolic thinking (reasoning by typing and reading language on a screen). While this physical integration between human and computer is beneficial in many ways (e.g., faster reaction time, realistic simulations in VR/AR, faster skill acquisition, etc.), it also requires tackling new challenges, such as improving the precision of muscle stimulation or the question of agency: do we feel in control when our body is integrated with an interface? We explore these questions, together with neuroscientists, by understanding how our brain encodes the feeling of agency to improve the design of this new type of integrated interfaces. Moreover, we are also exploring how novel computer-interfaces can provide assistance and promote attitude change in critical societal challenges, namely reducing electronic waste; such as by changing our relationship with technology, or by pushing forward e-waste reuse via computationally-driven recycling."
