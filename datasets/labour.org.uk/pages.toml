["https://labour.org.uk/about-us"]
title = "About Us – The Labour Party"
description = "The Labour Party delivers for working people."
full_description = "About Us The Labour Party delivers for working people. Labour has changed Britain for the better, with achievements that have made a lasting difference to people’s lives across our country. How we work The Labour Party is a democratic, membership organisation. There are various ways you can get involved to campaign with Labour and deliver real change for Britain. Find your local Labour representative here. Your local Labour teams Constituency Labour Party (CLP) Your CLP is your local party based on your constituency. It’s a hub of activity and community organising. Via your CLP, you can choose the members from your area to represent you at Annual Conference and you can help select your parliamentary candidate. Branch Labour Party (BLP) Many CLPs organise themselves into smaller units called branches which get to choose the local council candidates to represent your area. What does Labour believe in? The Labour Party was formed to give ordinary people a voice and improve lives. Over the last 100 years, Labour has built a proud history of achievements in power, and now Keir Starmer has set out five missions for the next Labour government. Why join Labour? As a Labour member, you’ll be a key part of our diverse movement of hundreds of thousands of people across Britain, dedicated to delivering a fairer, better society. You’ll also have a say in our policy and have the opportunity to vote in internal elections. We’ll provide you with all the tools and resources to get involved in events and campaign days, to help elect Labour candidates. And if you want to, one day, you can even stand for election yourself as an official Labour Party candidate. Join Labour today Labour history Labour's Legacy How past Labour governments built Britain's future Learn more Our groups and networks Learn more Our affiliated trade unions Learn more Socialist Societies Learn more Join Labour Become a member Every person is entitled to feel safe from harm and prejudice. Our code of conduct and complaints process"
