["https://labour.org.uk/about-us/affiliated-unions"]
title = "Affiliated Unions – The Labour Party"
description = "Associated Society of Locomotive Engineers (railways – drivers, operational supervisors and staff)"
full_description = "Labour People Keir Starmer Cabinet Groups Affiliated Unions The Labour Party was formed out of the trade union movement to give working people their own political voice. The link from the workplace to the party through the affiliated trade unions is what makes it unique to this day. This link is more important than ever as we work together to tackle the urgent problems we face as a country, from stagnating wages to failing public services. Labour Unions is the umbrella organisation that coordinates the activities of the 11 trade unions who affiliate to the Labour Party. For more information or to receive updates, visit LabourUnions.org.uk or find out why you should join a trade union below. Affiliated Unions Explore the different groups affiliated with the Labour Party. ASLEF Associated Society of Locomotive Engineers (railways – drivers, operational supervisors and staff) Link Open Community A union for workers in all industries and sectors: from steel, education and justice to the self-employed. Link Open CWU Communication Workers Union – post and telecommunications Link Open FBU Fire Brigades Union – firefighters and other workers within fire and rescue services Link Open GMB For general workers in public and private sectors Link Open MU Musicians Union – performers, writers and teachers in the music industry Link Open NUM National Union of Mineworkers Open TSSA Transport Salaried Staffs’ Association – railways, London Underground, travel, haulage, shipping Link Open UNISON The public service union for all those providing services to the public whether employed in the public, private or voluntary sectors Link Open Unite For general workers in the public and private sectors Link Open USDAW Union of Shop, Distributive and Allied Workers – retail, distributive and related industries Link Open Why you should join a trade union Trade unions give power to working people and enable employees to speak with one voice to their employer. They also help us to have a strong presence in every workplace and community up and down the country. Join a Labour-affiliated union today. Dignity Trade unions give power to working people. They enable employees to speak with one voice to their employer – making us stronger together than we are alone. Rights Workers in unionised workplaces are less likely to lose their job, and are likely to have better than average maternity, paternity and redundancy policies. Higher and more equal pay Union members earn 10% more than non-members. Women are also more likely to get paid the same as men for doing the same or similar work. Representation Unions provide access to legal advice on employment matters and can represent you at any employment tribunal. They support and represent members who are the victims of discrimination, harassment or bullying. The Labour Family From the beginning trade unionists have been at the heart of our party. By working together we have changed Britain for the better from the NHS to the welfare state. Visit Labour Unions for more information"
