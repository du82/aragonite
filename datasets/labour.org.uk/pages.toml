full_description = "About Us / Socialist Societies Socialist Societies There are many Socialist Societies affiliated to Labour, all with a unique perspective and all fighting for a fairer Britain. The Socialist Societies are policy experts, community networks and grassroots campaigners who enrich the Labour movement with a link to wider society and a wealth of experience. They give Labour members a stronger sense of belonging within the Party, and help them find their political home and voice. Socialist Societies also organise collectively to play a full part in Labour Party democracy and policy making, and make their presence felt on the doorsteps through joint campaign days. Explore the societies below to see how you can get involved, or follow them on Twitter via @SocialistSocs. For our online course on Labour’s Socialist Societies and the wider Labour movement, visit Achieve. BAME Labour Link Open East and South East Asians for Labour Link Open Christians on the Left Link Open Disability Labour Link Open The Fabian Society Link Open Jewish Labour Movement Link Open Labour Animal Welfare Society (LAWS) Link Open Labour Business Link Open Labour Campaign for International Development Link Open Labour Housing Group Link Open Labour Movement for Europe Link Open Labour Party Irish Society Link Open Labour Women’s Network Link Open LGBT+ Labour Link Open National Union of Labour and Socialist Clubs Link Open Scientists for Labour Link Open Socialist Education Association Link Open SERA – Labour’s Environment Campaign Link Open The Socialist Health Association Link Open The Society of Labour Lawyers Link Open"
