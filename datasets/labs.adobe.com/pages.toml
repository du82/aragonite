["https://labs.adobe.com/projects/magnetic-type"]
title = "Adobe Labs | Project Magnetic Type"
description = "Create magnetic fusions with Type & Vectors"
full_description = "Technologies showcased on Adobe Labs are subject to change, and Adobe makes no commitment that these technologies will be made commercially available.Your use of the Adobe Labs site is governed by the Adobe Terms of Use.Privacy Policy | Cookie preferencesCopyright © 2024 Adobe. All rights reserved. Graphic design projects often include combining shapes with text. Yet the process of merging shapes with text can present challenges during the editing process, especially when the shapes associated with the text no longer align. Correcting this issue requires a lot of tedious repositioning and alignment — even for the most advanced designers. Project Magnetic Type lets anyone attach and instantly fuse any shape — even hand-drawn calligraphy — to a piece of live digital text. Adobe’s AI technology allows fluid binding of shapes to text without distorting the original text’s aesthetics or its text-editability. This tech uses object detection models to enable easy extraction of swashes from any calligraphic image, which can be fused with any live type to give it a similar look. It provides flexibility when attaching and detaching shapes or objects, and expands a designer’s creativity when developing text-based content including logos or ads."
