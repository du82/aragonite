title = "Adobe Labs | Project Vector Edge"
description = "Assets in the real world"
full_description = "Technologies showcased on Adobe Labs are subject to change, and Adobe makes no commitment that these technologies will be made commercially available.Your use of the Adobe Labs site is governed by the Adobe Terms of Use.Privacy Policy | Cookie preferencesCopyright © 2024 Adobe. All rights reserved. When creating graphic designs, designers commonly struggle to visualize what assets will look like in their intended real-world settings, such as billboards, t-shirts, or coffee mugs. Project Vector Edge provides designers and their teams with the ability to visualize, make edits, and collaborate on 2D designs within 3D environments during the design process. Using AI and vector graphic projection technologies, this project automatically projects 2D design assets onto surfaces in 3D environments, true-to-scale and in high resolution, so designers and stakeholders can visualize how assets will look in the real world."
