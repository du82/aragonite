["https://labs.adobe.com/projects/clever-composites"]
title = "Adobe Labs | Project Clever Composites"
description = "AI-powered Automatic Object Compositing"
full_description = "Technologies showcased on Adobe Labs are subject to change, and Adobe makes no commitment that these technologies will be made commercially available.Your use of the Adobe Labs site is governed by the Adobe Terms of Use.Privacy Policy | Cookie preferencesCopyright © 2024 Adobe. All rights reserved. Perhaps you visited the Eiffel Tower but missed out on that picture of you standing right in front of it. With Project Clever Composites’ new image compositing feature you can make that once-in-a-lifetime shot a reality since this Sneak makes it easy to add yourself into any background. While compositing images into backgrounds is a common task in image editing software, compositing an object from one image into a background can be a time-consuming and difficult process. This typically involves several manual tasks, including searching for the right image, carefully cutting out the desired object, and manually editing the object’s color, tone, and scale. Project Clever Composites uses AI and automation to transform this tedious process into an essentially drag and drop action. Now with just few clicks, you can achieve a realistic composite image. AI makes it easy to quickly identify an object suitable for adding to a background image, automatically cut out the object, adjust its color and size for consistency with the background, and then generate appropriate shadows by analyzing the background lighting."
