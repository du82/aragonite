title = "Arduino Labs"
description = "Lightweight editor for MicroPython"
full_description = "Arduino Lab for MicroPython is a lightweight editor for MicroPython programs, supporting connecting a board, code upload, file transfer and provides an interactive REPL shell. You haven’t used MicroPython on Arduino boards before? Take a look at our tutorials to get started. Program MicroPython right in your browser by using the online version of Arduino Lab for MicroPython. Install by simply unzipping in a folder the compressed file (based on your platform) and launching the executable file inside the folder. You can find the source code in this repository. Previous releases can be found here. This is an experimental pre-release software, please direct any questions to Github issues."
