["https://labs.arduino.cc/en/labs/micropython-package-installer"]
title = "Arduino Labs"
description = "A tool for installing MicroPython packages on Arduino boards."
full_description = "MicroPython Package Installer for Arduino is a cross-platform tool that streamlines the process of finding, downloading and installing MicroPython packages on compatible Arduino boards. It runs on macOS, Linux, and Windows. It connects to Arduino’s official MicroPython package index and to MicroPython’s official micropython-lib repository to find packages. You can also install a package from a custom URL. Click the button below to open the downloads page where you can find the application for your operating system. Install it by simply extracting the the compressed zip file into a folder and launching the executable file inside that folder. On Debian and Windows this will start the installation process whereas on macOS you can directly launch the extracted app bundle. This project is sponsored by Arduino. This is an experimental pre-release software, please direct any questions only to Github issues. You can find the source code in this repository"
year_published = 2025
clearnet = "https://labs.arduino.cc/en/labs/micropython-package-installer"
