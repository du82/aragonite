["https://labs.arduino.cc/en/labs/micropython-installer"]
title = "Arduino Labs"
description = "A tool to easily install MicroPython on supported Arduino boards."
full_description = "“MicroPython Installer” is a standalone tool to install the MicroPython firmware on supported Arduino boards. It automatically detects the connected boards, downloads the latest MicroPython firmware for it and installs it. All with just one mouse click. This project is sponsored by Arduino. This is an experimental pre-release software, please direct any questions only to Github issues. Install by simply extracting the the compressed zip file into a folder and launching the executable file inside that folder. On Debian and Windows this will start the installation process whereas on macOS you can directly launch the contained app."
