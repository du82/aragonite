full_description = "An open source robot based on Nano 33 BLE / BLE Sense / 33 IoT / RP2040 Connect. Built with very low cost components. Not sophisticated but functional. Arduino’s Include Robot is a 3d printed programmable robot designed to teach junior students about robotics in a simple and funny way. The full documentation and source code of Arduino sketches running in the robot are available in this repo. It’s programmed via Scratch programming language, a tool created at the MIT to teach software programming to young students. In order to send instructions to the robot you will need a customized version of Scratch available on line at: Arduino Scratch lab"
