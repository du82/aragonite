["https://labs.detectify.com/tag/xss"]
title = "XSS Archives - Labs Detectify"
full_description = 'Security guidanceXSS using quirky implementations of ACME http-01Some hosting providers implemented http-01 having one part of the challenge key reflected in the response. This resulted in a huge amount of websites being vulnerable to XSS just because of their quirky implementation of the http-01 ACME-challenge. September 04, 2018Read article Ethical HackingSolutions to the Twins of Ten XSS challengeA couple of weeks ago I put up a small challenge for a specific XSS problem, called Twins of Ten. The idea was to find a payload that was limited to ten characters, these characters would repeat once and you could expand it to how many pairs you wanted. The challenge was to both find the shortest payload but also find a way around the XSS Auditor inside Chrome / Safari. July 14, 2015 <img alt="" sizes="(min-width: 1024px) 25vw, (min-width: 768px) 50vw, 100vw" srcSet="/_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2Fuploads%2F2013%2F02%2F18134241%2FFrans-Rosen.png&amp;w=256&amp;q=75 256w, /_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2Fuploads%2F2013%2F02%2F18134241%2FFrans-Rosen.png&amp;w=384&amp;q=75 384w, /_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2Fuploads%2F2013%2F02%2F18134241%2FFrans-Rosen.png&amp;w=640&amp;q=75 640w, /_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2Fuploads%2F2013%2F02%2F18134241%2FFrans-Rosen.png&amp;w=750&amp;q=75 750w, /_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2Fuploads%2F2013%2F02%2F18134241%2FFrans-Rosen.png&amp;w=828&amp;q=75 828w, /_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2Fuploads%2F2013%2F02%2F18134241%2FFrans-Rosen.png&amp;w=1080&amp;q=75 1080w, /_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2Fuploads%2F2013%2F02%2F18134241%2FFrans-Rosen.png&amp;w=1200&amp;q=75 1200w, /_next/image/?url=https%3A%2F%2Flabsdetectifycom.cdn.triggerfish.cloud%2