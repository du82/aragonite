["https://laforge.gnumonks.org/projects/open-hardware"]
title = "Open Hardware Projects | LaForge's home page"
description = """
Next to the various software projects, I'm also developing electronics.
Some of those projects are available as open hardware projects:

Active Projects

simtrace
Osmocom SIMtrace is a project to allo"""
full_description = "Open Hardware Projects Next to the various software projects, I'm also developing electronics. Some of those projects are available as open hardware projects: Active Projects simtrace Osmocom SIMtrace is a project to allow protocol tracing of the interface between a (U)SIM card and a phone. It consists of hardware and associated device firmware as well as host software. I did a proof-of-concept based on a generic SAM7 development board, after which Kevin Redon did the actual PCB board layout, and I the firmware and host software. For more information see https://bb.osmocom.org/trac/wiki/SIMtrace Inactive Projects Openmoko Neo1973 + FreeRunner At Openmoko, I was working on the electrical design of the Neo1973 (GTA01) and FreeRunner (GTA02) smartphones. The schematics of those phones had been publicly released, and are still available from https://wiki.openmoko.org/ osmo-e1-xcvr This is a small project to build an experimetation board for the IDT28V2081 E1/T1/J1 transceiver, ready to be connected to an external microcontroller. Full EAGLE design files, schematics and layout are released. More information can be found at https://openbsc.osmocom.org/trac/wiki/osmo-e1-xcvr osmo-lea6t This is a small evaluation boad for the u-blox LEA-6T timing GPS receiver. Full EAGLE design files, schematics and layout are released. More information can be found at https://openbsc.osmocom.org/trac/wiki/osmo-lea6t-gps openpcd In the aftermath of the overly-privacy-invasive legislation after the 9/11 attacks in 2001, governments around the world decided to add a RFID chip into all passports. Little was known to most poeople about the underlying communication technology of 13.56 MHz based magnetic coupling systems (ISO 14443, ISO 15693). In order to provide a platform for mor applied research with the technology, my friends Milosch, Brita and I set out to develop an open hardware RFID reader for 13.56 MHZ RFID systems - and called it OpenPCD where PCD is a term from the spec (Proximity Coupling Device). There later was an OpenPCD2 project of which I was no longer part of. openpicc After we did OpenPCD for the RFID reader side, there was some work on implementing a simulator for the RFID card side, which is known as OpenPICC. My involvement was much less than in OpenPCD More information can be found at https://www.openpcd.org/OpenPICC_RFID_Emulator_Project osmo-sdr The osmo-sdr was a project to build a wide-range affordable USB SDR, at a time before BladeRF, HackRF One or even rtl-sdr. We used the Elonics E4000 tuner chip, attached to an Atmel AT91SAM3U (the first widely available Cortex-M3 with high-speed capable USB device controller). The hardware was designed by SR-Sytems, the FPGA code developed by Maintech. I only wrote the E4000 driver portion of it, which continues to live on as part of rtl-sdr these days."
author = "Harald Welte"
year_published = 2024
