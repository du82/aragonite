sti viedä eteenpäin parempaa työkulttuuria!#comp-lvgpmxm7__item-j9plerjk svg [data-color="1"] {fill: #DD2D21;} Nimeään suurempi podcast, joka ei ole vain lähtijöille tai irtisanoutumista pohtiville, vaan ihan jokaiselle. Upeat hostit tuntuvat niin samanhenkisiltä (itseni kanssa), ja huomaan usein ajattelevani, että heidän kanssaan olisi varmasti helppo ystävystyä :). Viisaita, lempeitä, pohdiskelevia ja topakoita Naisia – ja aiheet superajankohtaisia. Kiitos Lähtijät.Ota yhteyttäOnko mielessäsi yhteistyöprojekti, josta haluaisit keskustella? Tai kenties haluaisit jakaa meille mielipiteesi podcastin jaksosta? ​ Olemme täällä sinua varten – jätäthän yhteystietosi, niin palaamme asiaan mahdollisimman pian.Ota yhteyttä MediassaMillaista hyvän johtajuuden tulisi olla?Suuri johtajuustutkimuksemme on täällä! Millaista on osaava johtajuus? Miten se edistää työhyvinvointia ja asiantuntijoiden sitoutumista? Vastaamme myös siihen, millaisia kustannuksia puutteellinen johtaminen aiheuttaa organisaatiolle ja miten se ilmenee päivittäisessä elämässä. Raportti jatkaa siitä mihin aiemmat tutkimuksemme jäivät. Ne osoittivat selvästi, että johtajuuden ongelmat ovat Suomessa palkkaakin yleisempi syy irtisanoutumiselle. Tutustu tuloksiin ja katso, vastaavatko ne omia kokemuksiasi.Lataa raportti YritysyhteistyöKeskustelu työelämän kehittämisestä käy vilkkaana – miten organisaatiosi haluaa olla siinä mukana?​Yhteistyö Lähtijöiden kanssa on investointi, joka huomataan ja jota asiantuntijat arvostavat. Ota yhteyttä ja liity hyvään seuraan!Lue lisää SomeseinäKumppanit'
