["https://www.lahtijat.fi/tarinamme"]
title = "TARINAMME | Lähtijät"
full_description = 'Ilmiö, joka kasvoi kokoaan suuremmaksiLähtijät on intohimoprojekti, joka löysi nopeasti yleisönsä: työelämän haasteiden käsittelylle oli tilausta. Tämä on tarina siitä, miten ystävien kesken nauhoitettu podcast nousi maanlaajuiseksi ilmiöksi.Miksi ihmiset lähtevät?Lähtijät sai alkunsa, kun sen perustajat Liisa Holma, Ulla Jones ja Minna Ruusuvuori kiinnostuivat vuonna 2021 alkaneesta erikoisesta tapahtumaketjusta: ihmiset lähtivät työpaikoilta aiempaa enemmän – korona-ajan epävarmasta ilmapiiristä huolimatta. Ilmiö vaikutti olevan yhteydessä maailmanlaajuiseen Great Resignation -trendiin. Pandemia sai monet pysähtymään ja huomaamaan, että työpaikan toimintatavat ja omat arvot eivät olleet yhteensopivia. Asiantuntijat eivät osanneet sanoa, näkyikö ilmiö myös Suomessa: osittain pienen väkiluvun vaikutuksesta meillä ei juuri uskalleta puhua julkisesti lähtöön vaikuttavista syistä. Kolmikko halusi nostaa aiheen yleiseen keskusteluun ja käynnisti podcastin, jonka materiaalina toimivat Lähtijöiden keräämät tosielämän tarinat. Tarinoita on kertynyt yhteensä jo satoja – niiden teemat osoittavat, että yrityksissä on vakavia haasteita erityisesti johtajuuden ja työkulttuurin saralla.Ota yhteyttäOnko mielessäsi yhteistyöprojekti, josta haluaisit keskustella? Tai kenties haluaisit jakaa meille mielipiteesi podcastin jaksosta? Olemme täällä sinua varten – jätäthän yhteystietosi, niin palaamme asiaan mahdollisimman pian.Ohta yhteyttä Liisa HolmaUlla JonesMinna RuusuvuoriLähtijät-tiimiLähtijät-podcastin juontavat Liisa Holma, Ulla Jones ja Minna Ruusuvuori. Heitä yhdistää ihmislähtöisyys ja halu ymmärtää työelämän ilmiöitä pintaa syvemmältä.Liisa HolmaOlen Liisa Holma, tulevaisuuskestävän ja menestyvän liiketoiminnan puolestapuhuja. Lähtijöissä olen toimitusjohtaja ja yksi perustajista. Työkenttäni on laaja: olen konsulttiyritys Un/knownin perustajaosakas ja toimitusjohtaja, sekä perheyritys Pa-Hun omistaja ja hallituksen jäsen. Lisäksi toimin mentorina, sparraan ja teen puhekeikkoja. Olen urallani kehittänyt liiketoimintaa, strategiaa ja asiakaskokemusta useissa eri johtaja-, konsultti-, ja hallitustehtävissä. Osaamiseni ydintä on strateginen muutos, asiakaskokemus sekä suurten organisaatioiden toiminta ja logiikka. Konsulttina rakennan asiakkaiden kanssa kannattavaa, asiakaslähtöistä liiketoimintaa ja palveluita. Johtaessani tiimejä niin suurissa kuin pienissäkin yrityksissä olen huomannut, miten suuri merkitys ihmisten hyvinvoinnilla ja motivaatiolla on yrityksen kaikkiin osa-alueisiin. Tarvitsemme työssä yhä enemmän luovuutta ja innovaatiotaitoja – näissä syvä asiantuntemus yhdistyy rohkeuteen, haavoittuvuuteen ja psykologiseen turvallisuuteen. Tämä kiinnostus ihmislähtöistä bisnestä kohtaan on vienyt minut myös mukaan kirjoittamaan kirjaa "Menestys syntyy asiakaskokemuksesta – B2B johtajan opas". Haluan olla mukana luomassa työelämää, jossa hyvinvoivat, luovat ihmiset rakentavat menestyviä yrityksiä ja parempaa huomista. Ulla JonesOlen Ulla Jones, päivätyöltäni johtajuusvalmentaja. Toimin tällä hetkellä kahdessa roolissa, rakentaen sitouttavan johtajuuden kehittämiseen erikoistunutta konsultointiyritys Ultima Leadia ja vetäen Postilla Välittävä johtaja -koulutusohkelmaa ohjelmajohtajana ja esihenkilöiden kouluttajana Postilla. Olen myös ACC-sertifioitu coach – ja intohimoinen hyvän johtamisen ja työkulttuurin puolestapuhuja. Lähtijät-podissa olen se, joka ei halua sukeltaa liian syvälle synkkiin aiheisiin ja aina hakee ratkaisukeskeisesti myönteisiä vaihtoehtoja. Innostun ja kiinnostun, mutta suorasukaisten mielipiteiden esittäminen ei ole minulle ominaista. Minulle läheisiä teemoja ovat työssä jaksaminen, työn ja vapaa-ajan tasapainottaminen, tiimien rakentaminen ja kehittäminen, tulosten tuottaminen ilman paineistusta sekä suorituskeskeisyyden tunnistaminen ja sen kestävä kanavointi. Aloitin urani konsulttipuolella, mutta olen viime vuodet työskennellyt isoissa yrityksissä. Ultima Leadin myötä pääsen yhdistämään kokemukseni asiakkaidemme hyödyksi. Minulla on kokemusta isojen ja pienten tiimien johtamisesta sekä linjaorganisaatiossa että matriisissa. Tyytyväisyysmittauksissa tiimini ovat aina raportoineet korkeaa motivaatiota ja sitoutumista. ​ Omassa arjessani etsin tasapainoa, rytmiä ja rutiineja yrittäjän arkeeni. Olen hyötynyt päiväkirjan pitämisestä ja säännöllisistä hengitysharjoituksista tukea työpäivistä palautumiseen. Minulle kantava oppi on muuttaa hyvät oivallukset tavoiksi sen sijaan, että tavoittelisin jotakin äärimmäistä määränpäätä. Minna RuusuvuoriOlen Minna Ruusuvuori, energinen kasvujohtaja ja asiakasarvoa tuottavan myynnin ja markkinoinnin puolestapuhuja. Minulla on lähes 25 vuoden kokemus myynnin, markkinoinnin ja kasvun johtamisesta, pääosin teknologia-alalta. Matkaan mahtuu myös henkilöstön kehittämisen ja rekrytoinnin konsultointitehtäviä sekä liiketoiminnan kehityshankkeita. Päivätyössäni rakennan myynti- ja markkinointijohtajan sekä partnerin roolissa kasvua ohjelmistotalo Taitopilvessä. Luotsaan myös toimitusjohtajana ja yhtenä perustajaosakkaista sisältömarkkinointiyritys Hear Hear Mediaa. Lähtijöissä olen yksi perustajista ja toimin hallituksen puheenjohtajana. Teen lisäksi puhekeikkoja ja toimin mentorina. Sydämeni sykkii asiakaskokemukselle ja menestyksen rakentamiselle erityisesti B2B -puolella. Olen ollut mukana modernisoimassa teknologiabrändejä asiakaskeskeisemmiksi, ja ollut mukana kirjoittamassa Suomen ensimmäistä B2B-asiakaskokemusta käsittelevää teosta "Menestys syntyy asiakaskokemuksesta – B2B-johtajan opas". Olen intohimoinen inhimillisen ja ihmiskeskeisen johtamisen puolestapuhuja. Tiimillä, joka on täynnä onnellisia ja motivoituneita ihmisiä voi valloittaa vaikka maailman. Kotiseutuni Pohjois-Karjala on henkinen sielunmaisemani, josta kumpuavat myös arvoni: rehtiys, rehellisyys, ahkeruus ja inhimillisyys. Ulla ja Liisa ovat nimenneet minut uuden ajan Hannu Karpoksi, sillä en karta vaikeitakaan työelämän aiheita ja haluan edistää oikeudenmukaisuutta. LumipalloefektiPodcastin jaksoja oli aluksi tarkoitus julkaista vain kymmenen. Pian Lähtijät oli kuitenkin noussut Suomen kuunnelluimmaksi työelämäpodcastiksi, ja siitä kohistiin kaikissa Suomen valtamedioissa. Sittemmin Lähtijät on jatkanut taivaltaan julkaisemalla uutta sisältöä jo yli kuudenkymmen jakson verran. Se on myös tuottanut tutkimustietoa siitä, miksi työpaikoilta lähdetään ja mitä se maksaa. Uusin, vuonna 2024 julkaistu tutkimus käsittelee sitouttavan johtamisen erityispiirteitä. Tutkimuksen ja tarinallisuuden yhdistäminen on Lähtijöiden perusta: jaksoissa yhdistyvät aina keskustelevuus, tosielämän kertomukset ja asiantuntijavieraiden mukanaan tuomat näkökulmat.Podcastista työelämämediaksiLähtijöiden teemat ovat laajentuneet koskemaan monimuotoisesti työelämän haasteita. Kolmikko on pitänyt kiinni siitä, että asioita on käsiteltävä moniulotteisesti ja eteenpäinvievästi: sensaatiohakuisuus tai sormien osoittelu ei kuulu ryhmän agendaan . Lähtijät on ollut alusta asti enemmän kuin podcast. Nykyisin se profiloituu yhä enemmän työelämä- ja vaikuttajamediana, joka puhuu eri kanavissa paremman työelämän puolesta. Lähtijät on työntekijän asialla, mutta tekee myös aktiivista yritysyhteistyötä rakentaakseen siltoja, pyrkien näin vaikuttamaan keskustelukulttuuriin myös sisältä päin. Työ on vasta alussa – mutta positiivinen lumipalloefekti on jo nyt Suomalaisella mediakentällä ennennäkemätön.'
