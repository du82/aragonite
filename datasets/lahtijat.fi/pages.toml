description = "Lähtijät on Suomen kuunnelluin työelämäpodcast ja vaikuttajamedia. Tuomme  julkiseen keskusteluun työelämän vaiettuja teemoja, joihin lukeutuvat työpaikoilta lähtemisen syyt sekä johtajuuteen ja yhdenvertaisuuteen liittyvät haasteet. Tuotamme myös aiheeseen liittyvää tutkimusta ja osallistumme aktiivisesti keskusteluun medioissa ja somekanavissa. Rakentavan ja empaattisen keskustelun myötä haluamme paitsi kohdistaa valokeilan työelämän kipukohtiin, myös tarjota työkaluja niiden korjaamiseksi."
full_description = 'Puheenvuoro paremman työelämän puolestaLähtijät on vaikuttajamedia ja Suomen kuunnelluin työelämäpodcast. Tuomme rohkeasti julkiseen keskusteluun työelämän vaiettuja teemoja, joihin lukeutuvat työpaikoilta lähtemisen syyt sekä johtajuuteen ja yhdenvertaisuuteen liittyvät haasteet. Tuotamme myös aiheeseen liittyvää tutkimusta ja osallistumme aktiivisesti keskusteluun medioissa ja somekanavissa. Rakentavan ja empaattisen keskustelun myötä haluamme paitsi kohdistaa valokeilan työelämän kipukohtiin, myös tarjota työkaluja niiden korjaamiseksi.Kuuntele podcastia Uusi johtajuustutkimuksemme on julkaistu! Tutustu raporttiin täälläLataa tutkimus nytSähköposti*Lataa raporttiTarinoita solmukohdista – ja niiden ratkaisuistaLähtijät-podast lähestyy työelämän haastavia aiheita anonyymien, tosielämän tarinoiden kautta. Juontajat Liisa Holma, Ulla Jones ja Minna Ruusuvuori käsittelevät niitä yhdessä asiantuntijavieraiden kanssa – ja kertovat avoimesti myös omista kokemuksistaan. Puhumme asioista rohkeasti suoraan ja sensuroimatta, mutta emme syyllistä. Haluamme rakentaa siltoja ja auttaa etsimään ratkaisumalleja. Podcastia on kuunneltu jo yli neljännesmiljoona kertaa ja se on nostettu esille kaikissa Suomen valtamedioissa. Vuonna 2023 Lähtijät palkittiin Human Power -kisan kategoriassa Vuoden ihmisläheinen työelämäteko.#comp-lvgpmxm7__item1 svg [data-color="1"] {fill: #DD2D21;} Lähtijät-podcast on parasta, mitä tämän maan työelämässä on tapahtunut aikoihin. Tämä voisi olla jokaisen työelämässä mukana olevan perehdytystä. Siinä samalla jokaisen yritysjohtajan ja hallituksen pakollista "pysytään ajan hermolla"-oppimatkaa. Itse asiassa, saisi olla jo koulutuksissa ihan oma kurssinsa 😃#comp-lvgpmxm7__item-j9ples3e svg [data-color="1"] {fill: #DD2D21;} Lähtijät nostaa esille tärkeitä aiheita ja pohtii, miten voisimme tehdä työelämästä paremman ihan meille kaikille. Sekä alaisten, johtajien että johtajien johtajien olisi hyvä kuunnella tätä podia, jotta voisimme aidosti viedä eteenpäin parempaa työkulttuuria!#comp-lvgpmxm7__item-j9plerjk svg [data-color="1"] {fill: #DD2D21;} Nimeään suurempi podcast, joka ei ole vain lähtijöille tai irtisanoutumista pohtiville, vaan ihan jokaiselle. Upeat hostit tuntuvat niin samanhenkisiltä (itseni kanssa), ja huomaan usein ajattelevani, että heidän kanssaan olisi varmasti helppo ystävystyä :). Viisaita, lempeitä, pohdiskelevia ja topakoita Naisia – ja aiheet superajankohtaisia. Kiitos Lähtijät.Ota yhteyttäOnko mielessäsi yhteistyöprojekti, josta haluaisit keskustella? Tai kenties haluaisit jakaa meille mielipiteesi podcastin jaksosta? ​ Olemme täällä sinua varten – jätäthän yhteystietosi, niin palaamme asiaan mahdollisimman pian.Ota yhteyttä MediassaMillaista hyvän johtajuuden tulisi olla?Suuri johtajuustutkimuksemme on täällä! Millaista on osaava johtajuus? Miten se edistää työhyvinvointia ja asiantuntijoiden sitoutumista? Vastaamme myös siihen, millaisia kustannuksia puutteellinen johtaminen aiheuttaa organisaatiolle ja miten se ilmenee päivittäisessä elämässä. Raportti jatkaa siitä mihin aiemmat tutkimuksemme jäivät. Ne osoittivat selvästi, että johtajuuden ongelmat ovat Suomessa palkkaakin yleisempi syy irtisanoutumiselle. Tutustu tuloksiin ja katso, vastaavatko ne omia kokemuksiasi.Lataa raportti YritysyhteistyöKeskustelu työelämän kehittämisestä käy vilkkaana – miten organisaatiosi haluaa olla siinä mukana?​Yhteistyö Lähtijöiden kanssa on investointi, joka huomataan ja jota asiantuntijat arvostavat. Ota yhteyttä ja liity hyvään seuraan!Lue lisää SomeseinäKumppanit'
