["https://www.lahtijat.fi/tutkimus"]
title = "TUTKIMUS | Lähtijät"
full_description = "Perspektiivejä työelämän haasteisiinMiksi asiantuntijat lähtevät työpaikoilta? Mitä se maksaa organisaatiolle? Millaista on hyvä johtajuus, joka kasvattaa hyvinvointia ja sitouttaa osaajia? Olemme keränneet Suomessa ennennäkemättömän määrän dataa niin anonyymien haastattelujen kuin kyselytutkimustenkin muodossa. Ne maalaavat kuvan Suomesta, jossa johtamistaidot ovat merkittävä haaste niin ihmisten hyvinvoinnin kuin tuottavuudenkin näkökulmasta. Tulokset ovat tilastollisesti merkitseviä. Tutustu raportteihin aiheista, joka koskettavat meitä kaikkia.KumppanitOta yhteyttäOnko mielessäsi yhteistyöprojekti, josta haluaisit keskustella? Tai kenties haluaisit jakaa meille mielipiteesi podcastin jaksosta? Olemme täällä sinua varten – jätäthän yhteystietosi, niin palaamme asiaan mahdollisimman pian.Ohta yhteyttä Kestävämpää työelämää 2024: sitoutumista edistävä johtajuusLähtijöiden aiemmat tutkimukset osoittivat selvästi, että esihenkilöiden riittämättömät johtajuustaidot ovat suurin syy irtisanoutumisille Suomessa. Uusi raporttimme vastaa tästä luonnollisesti seuraavaan jatkokysymykseen: miten hyvä ja huono johtajuus eroavat toisistaan? Se, miten yrityksiä johdetaan on sekä kansanterveyden että Suomen talouden näkökulmasta keskeinen asia. Syvennymme tutkimuksessa siihen, millä tavoin korkeatasoinen esihenkilö lisää hyvinvointia ja kasvattaa asiantuntijoiden sitoutumista. Vastaavasti arvioimme myös huonon johtajuuden kustannuksia organisaatiolle.Lataa tutkimus nytSähköposti*Lataa raportti Kestävämpää työelämää 2023: Miksi me lähdemme ja mitä se maksaa?Lähteminen on ilmiö, jonka vaikutukset kansantalouteen ja yritysten menestyksen edellytyksiin ovat merkittävät. Lähtijät toteutti keväällä 2023 kahdeksan yhteistyökumppanin kanssa tutkimuksen, jonka tavoitteena oli ymmärtää aihetta laajemmin, ja tarjota ratkaisun avaimia kestävämmän työelämän rakentamiseksi. Tulokset ovat hätkähdyttäviä. 70% on harkinnut työpaikan vaihtoa viimeisen vuoden aikana. Yleisin irtisanoutumisen syy lähes 3000 vastauksen perusteella on esihenkilön puutteelliset johtamistaidot. Työntekijän kokemuksesta riippuen irtisanoutuminen maksaa yritykselle 6-14 kuukauden palkkaa vastaavan summan.Lataa tutkimus nytSähköposti*Lataa raportti"
