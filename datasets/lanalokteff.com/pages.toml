title = "Lana Lokteff - About"
full_description = "Lana was born of Russian American ancestry. She is the host of Radio 3Fourteen and contributes political/social commentary in the form of articles and videos. Additionally, she offers her view on current news & entertainment in Red Ice TV's livestream show on Saturdays. Lana also owns her own organic clothing line called Lana's Llama. She is passionate about European identity politics, ancestral traditions and health. She lives with her husband in Sweden and part time in America."
