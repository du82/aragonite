["https://landchad.net"]
title = "LandChad.net"
description = """
This is LandChad.net, a site dedicated to turning internet peasants into Internet Landlords by showing them how to setup websites, email servers, chat servers and everything in between.
Starting a website is something that can be done in a lazy afternoon and costs pocket change.
Most of the internet’s problems could be solved if more people had their own personal platforms, so the objective of this site is to guide any normal person through the process of installing a website."""
full_description = "This is LandChad.net, a site dedicated to turning internet peasants into Internet Landlords by showing them how to setup websites, email servers, chat servers and everything in between. Starting a website is something that can be done in a lazy afternoon and costs pocket change. Most of the internet’s problems could be solved if more people had their own personal platforms, so the objective of this site is to guide any normal person through the process of installing a website. Start a website This is the basic “course.” Follow these quick tutorials and you’ll have a fully functioning basic web page on the domain name of your choice. ⏳ This “basic course” can take as little as an hour or even less. Get a Domain Name [basic] Get a Server [basic] Connect Your Domain and Server with DNS Records [basic] Setting Up an NginX Webserver [basic] Certbot and HTTPS [basic] “Build your own platform!” AlpsAlps is a simple and extensible webmail. It offers a web interface for IMAP, SMTP and other upstream servers.[service] CalibreA public or private digital library.[service] CgitA hyperfast web frontend for git repositories.[service] CoturnA STUN and TURN server that allows users to perform WebRTC calls while being behind NATs.[service] DnsmasqHost your own DNS server to block ads and social media.[service] DokuWikiA simple wiki with clean syntax and no databases.[service] ejabberdA chat server based on XMPP.[service] FosspayA self-hosted payment and donation gateway interfaced with Stripe.[service] Git ServerHosting your own basic git server.[service] GiteaA fully-featured Github-like git website for serious software projects and communities.[service] i2pA private and uncensorable web-layer similar to Tor.[service] IRCSelf-hosting the Internet's classic chat protocol.[service] JitsiVideo-chat software.[service] Matrix DendriteA faster server implementation of Matrix.[service] Matrix SynapseAn encrypted chat server sleek and accessible even to normies.[service] MoneroThe ideal private cryptocurrency for the Internet.[service] Monero NodeContribute to the Monero network.[service] MumbleOpen Source, Low Latency, High Quality Voice Chat.[service] NextcloudA free and private Google Drive-like cloud storage system.[service] PeerTubeYour own self-hosted video-site also compatible with Activity Pub.[service activity-pub] PleromaA federated Twitter-like microblogging system.[service activity-pub] ProsodyA minimalist XMPP chat server.[service] RadicaleA private calendar, contact and to-do list system.[service] RainloopA graphical website for accessing a mail server.[service] RSS BridgeCreates RSS feeds for normie sites like Facebook.[service] SearXNGPolls dozens of search engines to give you private and complete search results.[service] TorSet your site up privately on the 'dark web.'[service] TransmissionDecentralized file-sharing with BitTorrent.[service] WireguardFast, Modern, Secure VPN Tunnel[service] YarrA self-hosted, web-based feed aggregator[service] Host your own services, social media and more. Setup an Email Server This is the email “course”. Follow these modules to learn how to setup an email server headache free. ⏳ This entire “email course” may take about an hour. The approval for opening email ports with your VPS should take no less than a day. Sending and Receiving Email [mail] Setup rDNS [mail] Validate Email with DNS Records [mail] Setting up an E-mail Inbox [mail] Harden your E-mail Server [mail] Maintaining a Server Tips and articles on mastering your server and learning about GNU/Linux systems administration. Certbot on Standalone Domains and Subdomains[server] Cronjobs[server] GeminiA minimalist alternative to HTTP with a modern twist.[server] Log on with SSH Keys[server] Maintaining a Server[server] OpenAlias[server] Page Quality[server] Requiring Passwords for Webpages (HTTP Authentication)[server] Rsync: Upload and Sync Files and Websites[server] Self hosting[server] Server-Side Scripting with CGI[server] SSH - Advanced Usage[server] Using UFW as a Firewall[server] Support LandChad.net BTC: bc1q9f3tmkhnxj8gduytdktlcw8yrnx3g028nzzsc5 XMR: 84RXmrsE7ffCe1ADprxLMHRpmyhZuWYScDR4YghE8pFRFSyLtiZFYwD6EPijVzD3aZiEpg57MfHEr1pGJNPXyJgENMnWrSh"
