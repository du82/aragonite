["https://landezine.com/send-us-your-project"]
title = "Send us your work —  Landscape Architecture Platform | Landezine"
description = "Landezine is the most visited website in landscape architecture and features the largest collection of landscape projects online. Landscape architects are welcome to submit built projects, office profiles or job advertisements. Manufacturers are welcome to send their products relevant to the work of landscape architects. Not every submission we get is necessarily published, we review and […]"
full_description = "Landezine is the most visited website in landscape architecture and features the largest collection of landscape projects online. Landscape architects are welcome to submit built projects, office profiles or job advertisements. Manufacturers are welcome to send their products relevant to the work of landscape architects. Not every submission we get is necessarily published, we review and curate everything before publishing. Before you spend a lot of time preparing the material, you can simply send a link to the project on your website, via the following form. Our editors will review it and let you know in case they wish to feature it. Publishing a project is free of charge. If you have material ready in a folder, please upload it via this link. Office Finder is used by several thousands of people per month. Ensure you are included when your next client will be searching for landscape architects. Send us the link to your office website and the editors will review your work. We’ll let you know in case they wish to feature your profile in the Office Finder. While we will gladly review your website, publishing an office profile comes with a price. Hello! We just published our new web site! It has not be translated in english yet but soon will be. Check it out and let mw know if you would like to feature any of our projet. we are a small canadian firm working all across the territory. We love children’s environnent and working with first nation community. Would love to ear from you! Have a great day. We have dozens of projects we would like to show, in hopes you would post 1 or 2. We have downloaded your file structure but thought you all could visit our site before we complete the submission folders for each project. Thanks! Hi we are interested in posting a job advertisment for a position within our office on Landzine- can you tell me how much it costs to do this, the duration of the add , etc etc I look forward to hearing from you! Hello, Our company is the leading Russian manufacturer of urban furniture, outdoor sports complexes and HoReCa furniture.We would like to show our products on your website.Please check our website and give your answer."
