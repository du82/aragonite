["https://landezine.com/design-for-forest"]
title = "Design For Forest —  Landscape Architecture Platform | Landezine"
description = "Every landscape architect should be well-aware of the role of forests both in environmental and social sense. Forests are dark and seem wild, so clearings feel liberating and secure. Visibility is low which makes forest misterious or even terrifying. One can get lost pretty quickly, so paths are of paramount importance. For landscape architects forests may be attractive as there are more tools for playing with the natural light and volumes."
full_description = "Every landscape architect should be well-aware of the role of forests both in an environmental and social sense. When writing this, COP26 in Glasgow has just brought us new promises concerning global forest preservation, and we have yet to see if they will prove fiction or reality. Speaking about fiction, in myths, forests often represent a magical space where both good and evil can reside. Across the centuries, forests were a great source of astonishment for painters and authors, most notably perhaps romanticism in the 19th century. In the 20th century, we somehow managed to inhabit them with all sorts of evil forces, remember so many crime stories, or movies like Blairwitch Project, Apocalypse Now, Deliverance … Forests are dark and seem wild, so clearings feel liberating and secure. Visibility is low, which makes the forest mysterious or even terrifying. One can get lost pretty quickly, so paths are of paramount importance. To landscape architects, forests may be attractive to design as there are more tools for playing with the natural light and volumes. As the selection of the projects below can prove, landscape architects can bring forests closer to people in a meaningful and careful way. We maintain what we appreciate, and empowering bonds between landscapes and people is one of the most important tasks of our profession. In our interview with the well-known Dutch office Karres en Brands, Sylvia Karres said that their approach to designing the Loenen Cemetery extension was to act as “a guest in the forest, rather than dominate it”. I suppose that can set the frame for observing a couple of poetic examples and examples that demonstrate different approaches to designing forests. It is not that often that landscape architects would be hired to design a forest where there has been none. It is a bit easier if such a project is located in a climate where vegetation growth is turbocharged by warm temperatures and a lot of water. TK Studio designed The Metro-Forest Project in Bangkok, Thailand, where an abandoned site of 2-hectares (4.75 acres) now hosts approximately 60,000 trees of more than 279 unique species."
year_published = 2025
