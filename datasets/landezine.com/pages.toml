["https://landezine.com/enscape-recommendation-how-marpa-empowers-client-collaboration"]
title = "How Landscape Firm Marpa Empowers Client Collaboration with Real-Time Visualization —  Landscape Architecture Platform | Landezine"
description = "Written by: Dinnie Muslihat / Cover Image: Ridge Walk Project by Marpa Rendering technology is gaining traction in the landscape architecture industry as it’s helped redefine how architects and designers conceptualize and communicate ideas. From streamlining workflows to better client engagement, its impact resonates across the profession, including with the firm Marpa. Integrating Enscape into […]"
full_description = 'Rendering technology is gaining traction in the landscape architecture industry as it’s helped redefine how architects and designers conceptualize and communicate ideas. From streamlining workflows to better client engagement, its impact resonates across the profession, including with the firm Marpa. Marpa is a landscape architecture and construction firm based in Boulder, Colorado. They use the real-time rendering plugin Enscape to visualize landscapes, facilitate better collaboration, and provide an engaging experience for clients. Before implementing Enscape into their workflow, the team used Vectorworks to render. Although it made model renderings, they needed something that could provide a type of environmental quality with plant objects, lighting, and textures—something that a strong rendering engine could show. Marpa discovered Enscape when collaborating with a firm that was already using it. Over a virtual meeting, they visualized interior design and outdoor patios. The live modeling was what piqued project manager Brian Deck’s interest. “That was the first time I’d heard of it, and I was immediately interested. Once we got it, I started to play around with it. I even spread it to other team members who could use it in their work,” he shares. “It’s intuitive, and placing objects is helpful, especially when working on landscape visuals dominated by trees and plants.” <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-104267 lazyload" src="https://landezine.com/wp-content/uploads/2024/02/enscape-advertorial-marpa-ridge-3-1270x714.jpg" alt="" width="1270" height="714" srcset="https://landezine.com/wp-content/uploads/2024/02/enscape-advertorial-marpa-ridge-3-1270x714.jpg 1270w, https://landezine.com/wp-content/uploads/2024/02/enscape-advertorial-marpa-ridge-3-630x354.jpg 630w, https://landezine.com/wp-content/uploads/2024/02/enscape-advertorial-marpa-ridge-3-768x432.jpg 768w, https://landezine.com/wp-content/uploads/2024/02/enscape-advertorial-marpa-ridge-3.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" />'
