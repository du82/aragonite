title = "Elevate Landscape Designs with Enscape’s New Animated Vegetation Assets —  Landscape Architecture Platform | Landezine"
description = "Adding 3D assets to your landscape design scene can make all the difference during a presentation. It provides a more lifelike representation of the design, allowing clients and stakeholders to understand the project better. Enscape is a real-time visualization plugin that enables you to create landscape renderings with ease and speed. Their latest release, Enscape […]"
full_description = 'Adding 3D assets to your landscape design scene can make all the difference during a presentation. It provides a more lifelike representation of the design, allowing clients and stakeholders to understand the project better. Enscape is a real-time visualization plugin that enables you to create landscape renderings with ease and speed. Their latest release, Enscape 4.0, features a fresh collection of animated vegetation assets. Enscape introduced animated vegetation assets into the Enscape Asset Library in version 2.8. They are 3D models for walkthroughs and videos that move when the camera is in motion in Enscape. The new set of assets features trees, bushes, and flowers specific to Mexico, as well as the northern climate and desert regions. There are 178 new variations added to the collection. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-106061 lazyload" src="https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-1-1270x714.jpg" alt="" width="1270" height="714" srcset="https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-1-1270x714.jpg 1270w, https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-1-630x354.jpg 630w, https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-1-768x432.jpg 768w, https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-1.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" /> Animated vegetation assets add a level of realism. Like in real life, you can make the trees flutter or make the leaves move with a slight gust of wind. The animation happens automatically, so all you have to do is start Enscape to see your landscaping come to life. You can manage the intensity and direction from which the wind comes with the wind controls. You will find it under the Enscape Visual settings. <img decoding="async" class="alignnone size-medium wp-image-106062 lazyload" src="https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-6-560x800.jpg" alt="" width="560" height="800" srcset="https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-6-560x800.jpg 560w, https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-6-716x1024.jpg 716w, https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-6-768x1098.jpg 768w, https://landezine.com/wp-content/uploads/2024/04/enscape-recommendation-april-vegetation-6.jpg 864w" sizes="(max-width: 560px) 100vw, 560px" />'
