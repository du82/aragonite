["https://landezine.com/environment-for-revit-recommendation-bim-the-planting-more-than-3d"]
title = "BIM the Planting – More Than 3D —  Landscape Architecture Platform | Landezine"
description = "How Landscape Architects Can Leverage Data-Rich BIM Models For Better Planting Plans Are 3D models enough for today’s landscape architecture projects? The landscape architecture industry is experiencing a surge in BIM adoption. A key driver is the growing demand for data-rich projects. In recent years, we have seen how this need for more detailed plans […]"
full_description = 'The landscape architecture industry is experiencing a surge in BIM adoption. A key driver is the growing demand for data-rich projects. In recent years, we have seen how this need for more detailed plans led to 3D models replacing 2D drawings. However, just 3D models alone are no longer sufficient. Landscape architects must provide a significant amount of additional meta-data to ensure the design meets project goals, such as sustainability, time, and budget. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-109786 lazyload" src="https://landezine.com/wp-content/uploads/2024/07/environment-for-revit-recom-july-2024-4-1270x665.jpg" alt="" width="1270" height="665" srcset="https://landezine.com/wp-content/uploads/2024/07/environment-for-revit-recom-july-2024-4-1270x665.jpg 1270w, https://landezine.com/wp-content/uploads/2024/07/environment-for-revit-recom-july-2024-4-630x330.jpg 630w, https://landezine.com/wp-content/uploads/2024/07/environment-for-revit-recom-july-2024-4-768x402.jpg 768w, https://landezine.com/wp-content/uploads/2024/07/environment-for-revit-recom-july-2024-4.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" /> Plant selection is a great example of this challenge. The specific data required for each species varies greatly, depending on the project, considering factors like region, water needs, cost, and sunlight requirements. On their own, Basic 2D and 3D shapes cannot keep up with the amount of data required for the project: Additional layers of data must be added. However, the process of enriching the planting elements with all the necessary information is far from being smooth. As of now, landscape architects have only two ways of incorporating plant data into their BIM workflows. Some rely on external data providers, but this approach limits the design flexibility since the data is closed-source and proprietary. Others build their own databases based on experience, literature, and local nurseries. However, the process of converting this data into BIM models with rich planting parameters remains a daunting task, typically requiring both advanced Revit skills AND a significant time investment.'
year_published = 2025
