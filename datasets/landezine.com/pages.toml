["https://landezine.com/forest-typologies"]
title = "Forest Typologies —  Landscape Architecture Platform | Landezine"
description = "Forests are ecosystems, usually acknowledged as spaces with the least human intervention, however, not many of us have been in touch with a virgin forest and its feralness. For most, forest means recreational or urban woods in the vicinity where we stroll and unwind or a mountain forest where we hike or climb. People growing […]"
full_description = "Forests are ecosystems, usually acknowledged as spaces with the least human intervention, however, not many of us have been in touch with a virgin forest and its feralness. For most, forest means recreational or urban woods in the vicinity where we stroll and unwind or a mountain forest where we hike or climb. People growing up without such contact find it hard to imagine the concept of nature other than what they see as green in the city and seeing the forest through an image other than that produced by media. And so, the mental images of a forest are different, depending on our surroundings and encounters. The word “forest” is also used as a greenwashing device, similar to “park” is often used to name shopping centres. These misappropriations of words diverge their semantics and can further change their perception. What are the forest typologies that landscape architecture (check out this selection of forest design projects by Zaš Brezar) deals with? Looking at the forest typologies, we can classify them by the scale of cultural appropriations, maintenance and proximity to urban structures. At the top, closest to the natural ecosystem, would be the virgin forest with no specific intervention, followed by a production forest managed by services of forestry with less specific interventions. Forest as a recreational ground, calls for basic infrastructure, safe paths and wayfinding. Forest as a retreat, needs a clearing. A special category is a sacred forest, throughout instilled with culture and meaning yet expressed with minimal intervention. In the proximity of urban centres, we find urban forest parks, and lastly, a completely man-made forest and its full appropriation. There are numerous landscape architecture projects with nature paths bringing the forest closer to people, interpreting them, and making them attractive with lookouts and other structures. In nature and forest paths, perhaps Georges Descombes champions this typology with the principle ‘Doing Almost Nothing’ and The Swiss Way project. In this article, we focus on retreats, sacred, urban, man-made and forest appropriations."
year_published = 2025
clearnet = "https://landezine.com/forest-typologies"
tags = ["21st", "african", "alternative", "appropriations", "architecture", "architectures:", "articles", "articles,", "ashtrays+", "association:"]
language = "en"
internal-references = ["none"]
external-references = ["6dd13403.sibforms.com", "arpente.re", "bloesemtuinarchitecten.be", "citydesign.it", "deerconcrete.com", "docs.google.com", "facebook.com", "forestofimagination.org.uk", "gabriellahirst.com", "grant-associates.uk.com", "grijsen-international.com", "instagram.com", "kverlag.com", "landezine-award.com", "landezine.wetransfer.com", "landscapeforms.com", "linkedin.com", "maps.google.com", "mertins-hamburg.de", "metalco.it"]

["https://landezine.com/area-recommendation-roundly-and-squarely"]
title = "Roundly and Squarely —  Landscape Architecture Platform | Landezine"
description = "The design and manufacture of DAHLIA and LILAS is an unequivocal illustration of AREA focus on outlines. Square or round, those two litter bins use the right quantity of material: everything they are is enough. Their elegant and sober style is also virtuous, for it also means environmentally friendly and economically wise. Their design is […]"
full_description = 'The design and manufacture of DAHLIA and LILAS is an unequivocal illustration of AREA focus on outlines. Square or round, those two litter bins use the right quantity of material: everything they are is enough. Their elegant and sober style is also virtuous, for it also means environmentally friendly and economically wise. Their design is a universal answer to the rising need for cleanliness in public spaces. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-106206 lazyload" src="https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main1-832x1024.jpg" alt="" width="832" height="1024" srcset="https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main1-832x1024.jpg 832w, https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main1-630x776.jpg 630w, https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main1-768x946.jpg 768w, https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main1.jpg 1137w" sizes="(max-width: 832px) 100vw, 832px" /> In an ever-densified city, where cars are less and less present, life thrives in public spaces: people read, eat, talk, drink, rest etc. Therefore it is not a surprise to see the need for clean street furniture rise in order to collect the litter created by those new practices. The simplicity of the DAHLIA and LILAS litter bins allows installations in large numbers while avoiding visual clutter and reducing costs. They are simple to use and install, they can be matched with any environment and/or street furniture. Being square, DAHLIA is absolutely ideal for continuous and aligned installations. Being round, LILAS will blend in discreetly with any curvy trail. <img decoding="async" class="alignnone size-large wp-image-106207 lazyload" src="https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main2-767x1024.jpg" alt="" width="767" height="1024" srcset="https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main2-767x1024.jpg 767w, https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main2-599x800.jpg 599w, https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main2-768x1026.jpg 768w, https://landezine.com/wp-content/uploads/2024/04/area-recommemdation-roundly-main2.jpg 1048w" sizes="(max-width: 767px) 100vw, 767px" />'
