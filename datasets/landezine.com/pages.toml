["https://landezine.com/mmcite"]
title = "mmcité —  Landscape Architecture Platform | Landezine"
description = "An established brand known for its unmistakeable, cutting-edge design philosophy, mmcité is involved in the design, development and realisation of innovative street furniture projects around the world, with a portfolio including benches, litter bins, bicycle stands and shelters. All its designs are underpinned by the common thread of a signature aesthetic and the fulfilment of […]"
full_description = "An established brand known for its unmistakeable, cutting-edge design philosophy, mmcité is involved in the design, development and realisation of innovative street furniture projects around the world, with a portfolio including benches, litter bins, bicycle stands and shelters. All its designs are underpinned by the common thread of a signature aesthetic and the fulfilment of all possible user requirements. Major emphasis is placed on the use of high-functioning materials, which have to work in any environment and withstand the most demanding conditions. mmcité is not just a supplier of quality street furniture, but also a partner to anyone who wants to make public space into something extraordinary. The list of honours the brand has accumulated over its 25 years in the industry includes Good Design, Red Dot, iF Design, EDIDA and Czech Grand Design awards. You will find mmcité products in great European cities such as London, Prague, Copenhagen, Budapest and Paris, as well as in North and South America. mmcité street furniture has even found a place at the summit of Mont Blanc, the Dubai Water Canal, Paris Charles de Gaulle Airport, and at the American headquarters of Google and Uber. The firm currently has 10 branches and 32 distributors around the world, and alongside its original home base in the Czech Republic also offers its own studio, mmcité design, led by David Karásek in partnership with leading domestic and international design talent. mmcité is also a founding member of the newly formed Association of Czech Industrial Design."
