["https://landezine.com/call-for-entries-the-tenth-edition-of-lila-landezine-international-landscape-award"]
title = "Call for Entries: the Tenth Edition of LILA – Landezine International Landscape Award —  Landscape Architecture Platform | Landezine"
description = "Landezine is calling landscape architects and architects to submit their built projects to the tenth edition of the LILA – Landezine International Landscape Award. There are more than 50 possible recognitions (shortlists, special mentions, awards). All shortlisted entries will be published on the front page of the LILA website. All entries will be published on […]"
full_description = "Landezine is calling landscape architects and architects to submit their built projects to the tenth edition of the LILA – Landezine International Landscape Award. There are more than 50 possible recognitions (shortlists, special mentions, awards). All shortlisted entries will be published on the front page of the LILA website. All entries will be published on the LILA website on its own page with full material. Winners will be promoted on Landezine all year round and also in Landezine and LILA newsletters. We are honoured that four outstanding professionals joined Landezine for the tenth LILA jury. They will be evaluating built projects. Maria Goula – Professor of Landscape Architecture, Cornell University, New York, USSotiria Kornaropoulou – Architect at 51N4E, BEMartin Rein-Cano – Founder of Topotek 1, DE, CHFrançois Vadepied – Founder of Wagon Landscaping, FR 1. Built Landscapes – any landscape project built after 1/1/2020, regardless of its function and context – small, large, private, public, urban, rural, parks, squares, streets, infrastructure, residential, housing, campuses, corporate, gardens, hospitality, schools, playgrounds, cemeteries, memorials and others. 2. NEW: Landscape and Architecture – in this category, LILA focuses on the relationship between landscape and architecture, their unique dialogue and projects as a whole, regardless of typology, size, context and use. Projects need to be built after 1/1/2020. The recognition is shared between landscape architects and architects involved in the project. 3. Revisited Landscapes – Any landscape project completed before 1/1/2010 can be submitted to this category. The winners and special mentions will be selected by the invited jury. 4. The LILA Honour Award and LILA Office Award will be selected by the editors of Landezine and are not open for submissions. 5. LILA Portfolio Award for students and young professionals will also be selected by the editors of Landezine and is open for submission via the LILA website. More info here."
