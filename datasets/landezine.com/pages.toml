full_description = "The Jury of the Streetlife Design Competition, organized by Landezine in partnership with Streetlife, the Dutch urban furnicher designers, selected ten finalists. The winners will be announced at the award ceremony on March 28, which will take place in Leiden, Netherlands, where the finalists will present their work. The works of students and young professionals […] Andrew Grant founded his practice, Grant Associates in 1997, which grew into an international design studio with offices in Bath and Singapore. His most significant work, Gardens by the Bay, won the Building Project of the Year Award at the 2012 World Architecture Festival and continues to be one of the most visited places designed […] The book Forest Urbanisms brings together underlying ideas, the concept of forest urbanism, and global practices and research that engage with forests through a critical and nuanced lens. Using the world is forest as the guiding principle, the authors put the forest in a central role of the spatial organization across regions, scales and quantities – from a solitary tree to an interplay of buildings and trees. This expanding notion of forest expects new morphologies and typologies of forest urbanism. The authors open the controversies regarding humankind’s relations to forests and offer thinking tools past the greenwashing paradigms. We share the news of the passing of a highly influential landscape architect. His extensive body of work will continue to inspire and leave a lasting impact. Our condolences go out to his family, friends, and colleagues. Born in New York City, M. Paul Friedberg earned a B.S. in 1954 in ornamental horticulture at Cornell […] The interview with Chloe and Michael Humphreys focuses on the work of The Landscape Studio. They began working in Nairobi in 2014 and in the years, their practice produced numerous private and public projects across Africa, that in essence and with minimal material means, embody the beauty of the locality. Embracing constraints is their design […]"
