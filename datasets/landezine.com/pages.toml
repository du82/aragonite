["https://landezine.com/grijsen-recommendation-seniors-benches-for-public-spaces"]
title = "Ageing Population Calls For Senior’s Benches For Public Spaces —  Landscape Architecture Platform | Landezine"
description = "In public spaces, you can relax, meet and move around. Especially for seniors, it is important that they can use suitable furniture in public spaces. With an ageing population, there is an increasing need for furniture for this group of residents in certain areas. Accessible And Comfortable Furniture For All Senior’s benches are an important […]"
full_description = 'In public spaces, you can relax, meet and move around. Especially for seniors, it is important that they can use suitable furniture in public spaces. With an ageing population, there is an increasing need for furniture for this group of residents in certain areas. Senior’s benches are an important addition to outdoor benches in public areas, as they are specifically designed with the comfort and needs of the elderly in mind. The main distinguishing feature is the raised seat height, which is about 10 cm higher than standard outdoor benches. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-108318 lazyload" src="https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-1-1270x715.jpg" alt="" width="1270" height="715" srcset="https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-1-1270x715.jpg 1270w, https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-1-630x355.jpg 630w, https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-1-768x432.jpg 768w, https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-1.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" /> This higher seat height makes it much easier for seniors to sit down and stand up comfortably, without undue effort or discomfort. In addition, senior’s benches have armrests, giving seniors extra support and stability when sitting down and standing up. The senior’s bench Chat with disabled space also has a possibility to sit next to someone in a wheelchair. Or you can use the space to put down a zimmer frame. <img decoding="async" class="alignnone size-large wp-image-108319 lazyload" src="https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-2-1270x953.jpg" alt="" width="1270" height="953" srcset="https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-2-1270x953.jpg 1270w, https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-2-630x473.jpg 630w, https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-2-768x576.jpg 768w, https://landezine.com/wp-content/uploads/2024/06/grijsen-recommendation-seniors-2.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" />'
