["https://landezine.com/california-is-burning-rethinking-the-wildland-suburban-interface"]
title = "California is Burning: Rethinking the Wildland/ (Sub)urban Interface —  Landscape Architecture Platform | Landezine"
description = "This article by Kelly Shannon and Donielle Kaufman was first published on 9 January 2018. With the recent fires around Los Angeles, we are bringing it into focus again in early 2025 as it sheds light on processes and hidden corners of the context that brought about California's 'wildfire epidemic'."
full_description = 'editor’s note: This article by Kelly Shannon and Donielle Kaufman was first published on 9 January 2018. With the recent fires around Los Angeles, we are bringing it into focus again as it sheds light on processes and hidden corners of the context that brought about California’s ‘wildfire epidemic’. Drought. Flood. Fire. These, known as the ‘seasons’ of California, are more and more often regularly experienced rather than extreme exceptions as depicted in dystopian novels or film noir. The underbelly of the ‘Golden State’ is one of earthquakes, mudslides and wildfires, the latter of which has been creating ever-larger waves of evacuees and climate refugees. Traditionally, floods and mudslides had been in the late fall and winter; drought and fire had reliably been in late summer and early fall. Until 2017, no major fire had ever bewitched the state in December, at least since the California Department of Forestry and Fire Protection (Cal Fire) began keeping records in 1932. After surveying in-progress damage, Governor Jerry Brown proclaimed that destructive and deadly wildfires in winter are “the new normal” for natural disasters. It has become clear, amongst enlightened politicians, but as well, fire ecologists, urbanists and developers, that nothing less than a revolution in land management and humankind’s relationship to fire is a both a moral responsibility and necessity for survival. <img decoding="async" class="alignnone size-large wp-image-39838 lazyload" src="http://www.landezine.com/wp-content/uploads/2018/01/Thomas-Fire-near-Ojai-1270x847.jpg" alt="" width="1270" height="847" srcset="https://landezine.com/wp-content/uploads/2018/01/Thomas-Fire-near-Ojai-1270x847.jpg 1270w, https://landezine.com/wp-content/uploads/2018/01/Thomas-Fire-near-Ojai-630x420.jpg 630w, https://landezine.com/wp-content/uploads/2018/01/Thomas-Fire-near-Ojai-768x512.jpg 768w, https://landezine.com/wp-content/uploads/2018/01/Thomas-Fire-near-Ojai.jpg 1500w" sizes="(max-width: 1270px) 100vw, 1270px" />'
year_published = 2025
