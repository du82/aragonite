["https://landezine.com/forest-urbanisms-new-non-human-and-human-ecologies-for-the-21st-century-by-bruno-de-meulder-and-kelly-shannon"]
title = "Forest Urbanisms: New Non-human and Human Ecologies for the 21st Century by Bruno De Meulder and Kelly Shannon —  Landscape Architecture Platform | Landezine"
description = "The book Forest Urbanisms brings together underlying ideas, the concept of forest urbanism, and global practices and research that engage with forests through a critical and nuanced lens. Using the <i>world is forest</i> as the guiding principle, the authors put the forest in a central role of the spatial organization across regions, scales and quantities – from a solitary tree to an interplay of buildings and trees. This expanding notion of forest expects new morphologies and typologies of forest urbanism. The authors open the controversies regarding humankind's relations to forests and offer thinking tools past the greenwashing paradigms."
full_description = "The peer-reviewed design research book is part of the Landscape and Architecture Projections series, published by Leuven University Press and edited by Kelly Shannon and Bruno De Meulder. The LAP series presents radical design practices that respond to pressing socio-political, ecological, and spatial issues. The book Forest Urbanisms brings together underlying ideas, the concept of forest urbanism, and global practices and research that engage with forests through a critical and nuanced lens. Following the foreword by Antoine Picon, the editors and authors, Kelly Shannon and Bruno De Meulder, make a case for forest urbanism in twenty points. Using the world is forest as the guiding principle, they put the forest in a central role of the spatial organization across regions, scales and quantities – from a solitary tree to an interplay of buildings and trees. This expanding notion of forest expects new morphologies and typologies of forest urbanism. The authors open the controversies regarding humankind’s relations to forests and offer thinking tools past the greenwashing paradigms. The next chapters explore hands-on projects, including some well-known, alongside smaller-scale yet immensely impactful initiatives, community-led practices, and strategic forest planning projects. Further, they highlight research and projects that challenge conventional ecological urban policies, advocating for neo-Indigenous, and unconventional knowledge systems, as well as participatory governance, projecting us toward an Urban Forest Age—one that transcends property boundaries and considers habitats from India, Australia, and the Americas to Europe, adapting forest perspectives to local conditions. At large, the book shows alternatives that move beyond using forests to demonize urban development and pose the why and how forest urbanism should and could be done. We present a Q&A with Bruno De Meulder and Kelly Shannon below. Additionally, you are invited to explore Forest Urbanisms in full through open access or a physical copy."
year_published = 2025
