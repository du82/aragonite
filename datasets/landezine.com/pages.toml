["https://landezine.com/gifizsee-in-offenburg-by-bhmp"]
title = "Gifizsee in Offenburg by BHMP —  Landscape Architecture Platform | Landezine"
description = "The open landscape around the Gifiz lake, particularly the peninsula, plays a significant recreational role in Offenburg and its region. The peninsula was transformed into an attractive recreational zone within the “Gifiz Park,” offering a variety of uses and better access to the lake. Extensive earthworks create new boundaries and spaces, enhancing the spatial experience […]"
full_description = "The open landscape around the Gifiz lake, particularly the peninsula, plays a significant recreational role in Offenburg and its region. The peninsula was transformed into an attractive recreational zone within the “Gifiz Park,” offering a variety of uses and better access to the lake. Extensive earthworks create new boundaries and spaces, enhancing the spatial experience on the peninsula. The renaturation of the flood channel extends the natural landscape up to the street. The peninsula is now structured in various areas, ranging from more extensive to more intensive usage. The extensive area is characterized by a “meadow valley”, a vast grassy area scattered with trees. Other zones include the “recreational meadow” with sports facilities, a fitness trail and a large play landscape, as well as the “landscape arena” with terraces at the tip of the peninsula. The play landscape, themed “Island Hopping”, fits into the overall design of the peninsula with its open landscape and earthworks. A key design element is the EPDM edging, which frames the play landscape and shapes the various “islands.” It also allows for the creation of climbing hills. Gravel and rocks in various sizes are incorporated into the playground. For instance, a circular path of fine gravel surrounds the play islands, flanked by low hedge plantings that provide spatial structure. Additional gravel beds with different stone types connect to the circular path. The “landscape arena” at the tip of the peninsula is multifunctional and can be used for neighbourhood festivals or similar events. It is framed by earthworks that reach a maximum height of 1.8 meters at their highest point, tapering off to ground level at the sides. On the southern-facing slope, concrete blocks form a grandstand-like seating area. A special highlight are the grass and gravel terraces along the waterfront that offer an attractive space by the water and can be used for a variety of activities."
year_published = 2025
