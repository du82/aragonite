["https://landezine.com/area-recommendation-michigan-chaise-longue"]
title = "Michigan Chaise Longue Wins Design Prize for Modern Furniture + Lighting —  Landscape Architecture Platform | Landezine"
description = "In 1949, the Museum of Modern Art (MoMA) organized the “Prize Design for Modern Furniture & Lightning”, exhibiting the most outstanding examples of the furniture industry, stimulating production by manufacturers for the mass market. Seven decades later, Global Design News and The Chicago Athenaeum have revived this historic event. And we’re proud to have won […]"
full_description = 'In 1949, the Museum of Modern Art (MoMA) organized the “Prize Design for Modern Furniture & Lightning”, exhibiting the most outstanding examples of the furniture industry, stimulating production by manufacturers for the mass market. Seven decades later, Global Design News and The Chicago Athenaeum have revived this historic event. And we’re proud to have won an award for this third edition with our Michigan chaise longue. The awards gala was held last week in Athens. An exhibition dedicated to the winners of this 3rd edition is being held at “L’européan Center” 74, rue Mitropoleo in Athens until November 10, 2024. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-112305 lazyload" src="https://landezine.com/wp-content/uploads/2024/10/AREA_ADV_Michigan_chaise_longue_01NEW-1270x869.jpg" alt="" width="1270" height="869" srcset="https://landezine.com/wp-content/uploads/2024/10/AREA_ADV_Michigan_chaise_longue_01NEW-1270x869.jpg 1270w, https://landezine.com/wp-content/uploads/2024/10/AREA_ADV_Michigan_chaise_longue_01NEW-630x431.jpg 630w, https://landezine.com/wp-content/uploads/2024/10/AREA_ADV_Michigan_chaise_longue_01NEW-768x526.jpg 768w, https://landezine.com/wp-content/uploads/2024/10/AREA_ADV_Michigan_chaise_longue_01NEW-1536x1051.jpg 1536w, https://landezine.com/wp-content/uploads/2024/10/AREA_ADV_Michigan_chaise_longue_01NEW.jpg 2000w" sizes="(max-width: 1270px) 100vw, 1270px" /> The MICHIGAN chaise longue embodies AREA’s core idea: in an increasingly dense city, public space should be viewed as an extension of living areas. Since its founding in 1987, AREA has committed to ensuring that urban furniture offers the same comfort and seating options as home furniture. Like all our chairs, tables, and low tables, the MICHIGAN chaise longue represents the concept of INSIDE/OUTSIDE. Transitioning furniture from private spaces to public ones will gradually help people feel at home in their city. Why is this important? As society reflects on mobility policies, it’s equally essential to consider “static facilities.” These elements provide a crucial respite from the hectic pace of urban life.'
