full_description = 'It’s been fat 4 years since sea organs were built as a enrichment of the Zadar’s Riva-waterfront. The movement of the waves pushes air through the pipes, and makes them whistle. 35 Pipes are hidden in marble staircase, each one is tuned differently, and sometimes can be very loud. Sound comes out from two lines of holes as you can see on a pictures bellow. The area around the staircase was designed as a pier for uploading tourists on a big cruiser ships. What makes the whole Sea organ experience even more harmonic is the fact, that is the only place in this part of a waterfront, where one can easily access the sea. {"@context":"http:\/\/schema.org\/","@id":"https:\/\/landezine.com\/198\/#arve-youtube-hdrcqr_ljse-2","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/hDRCqR_ljsE?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} Project: Sea Organs Designer: Nikola Bašič withIvan Stamać dipl. inž. (sound) Location: Zadar / Croatia Hydraulics: Prof. dr. Vladimir Andročec Organ pipe design: Mr. Tomislav Faullend Heferer'
