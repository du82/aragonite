["https://landezine.com/anna-marly-garden-by-arpentere"]
title = "Anna Marly Garden by Arpentere —  Landscape Architecture Platform | Landezine"
description = "A Garden on the Beltway Covering some sections of the Parisian beltway is innovative! This is what we did with this 13 000 m² garden (including 6 000 m² on a slab), which gives back a significant amount of space to local inhabitants. All without noticing the passing cars a few meters below. As a […]"
full_description = "Covering some sections of the Parisian beltway is innovative! This is what we did with this 13 000 m² garden (including 6 000 m² on a slab), which gives back a significant amount of space to local inhabitants. All without noticing the passing cars a few meters below. As a real link between Paris and its direct suburbs, the conception of this project included reflexions on how to harmonize the different levels of an environment traditionally dedicated to cars. It posed the question of adapting the slab that covers the beltway to a suitable type of floor. Also, the idea of accessibility was at the chore of our concerns. In the Jardin Anna Marly non-constructed soils meet with the slab and drier layers overlap concrete. In order to avoid storing unwanted waters that could dangerousely increase the weight of this elevated structure, a drainage system with a layer of clay balls has been designed. The natural ecosystem that would fit best, and even floorish on such a site, has then been found in the well-known Fontainebleau woods, a large forest directly connected to the Greater Paris Area. There, dry lands are home to wooded moors, a young forest that invades open spaces with pioneed tree species. Because of its colours, its resilience and its ability to thrive on poor soils, the Fontainebleau ecosystem has been a great source of inspiration to the Jardin Anna Marly’s plant design. In what we can call “glades”, islands of vegetation bring shadow and create a rythm between paths and spaces designed for rest. Some rocks harmoniously integrate themselves in this moorland landscape. As their weight was a topical issue in the conception of this garden, we decided to have these rocks made of concrete by a craftman from Southern France. Hence their lightness does not pose any problem. On top of that, real tree trunks dot the landscape, embodying new kinds of urban furnitures on which kids can climb. Local inhabitants were happy to benefit from this new space and wanted to garden here. Hence a large and sunny strip has been set up for them to have vegetables: nowadays, tomatoes and squashes grow there!"
year_published = 2025
clearnet = "https://landezine.com/anna-marly-garden-by-arpentere"
