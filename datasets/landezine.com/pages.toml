title = "Introducing Booth: Taking the Best of the Indoors Out —  Landscape Architecture Platform | Landezine"
description = "Booth is designed to create interaction spaces that are fresh yet familiar, taking the warmth, comfort and intimacy of a widely enjoyed indoor seating experience and reimagining it for the outdoors. New from Landscape Forms, it’s a social and friendly design, intended to define spaces that bring people together and encourage closeness and quality conversation. […]"
full_description = 'Booth is designed to create interaction spaces that are fresh yet familiar, taking the warmth, comfort and intimacy of a widely enjoyed indoor seating experience and reimagining it for the outdoors. New from Landscape Forms, it’s a social and friendly design, intended to define spaces that bring people together and encourage closeness and quality conversation. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-114608 lazyload" src="https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-3-1270x847.jpg" alt="" width="1270" height="847" srcset="https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-3-1270x847.jpg 1270w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-3-630x420.jpg 630w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-3-768x512.jpg 768w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-3-1536x1025.jpg 1536w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-3.jpg 2000w" sizes="(max-width: 1270px) 100vw, 1270px" /> “Booth was inspired by our profound need as humans to anchor ourselves in outdoor spaces,” describes Landscape Forms Chief Creative Officer, Kirt Martin. “We’ve taken the familiar typology of an indoor booth, and brought it outdoors — giving people an intuitive, welcoming and intimate space to come together to work, dine or socialize. It creates a room within a room outdoors, and it’s never been done before this way.” <img decoding="async" class="alignnone size-large wp-image-114609 lazyload" src="https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-2-1270x811.jpg" alt="" width="1270" height="811" srcset="https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-2-1270x811.jpg 1270w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-2-630x402.jpg 630w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-2-768x490.jpg 768w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-2-1536x981.jpg 1536w, https://landezine.com/wp-content/uploads/2024/12/recommendation-booth-december-2.jpg 2000w" sizes="(max-width: 1270px) 100vw, 1270px" />'
