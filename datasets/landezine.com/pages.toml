["https://landezine.com/building-trust-an-interview-with-andrew-grant"]
title = "Building Trust: An Interview with Andrew Grant —  Landscape Architecture Platform | Landezine"
description = "Andrew Grant founded his practice, Grant Associates in 1997, which grew into an international design studio with offices in Bath and Singapore. His most significant work, Gardens by the Bay, won the Building Project of the Year Award at the 2012 World Architecture Festival and continues to be one of the most visited places designed […]"
full_description = "Andrew Grant founded his practice, Grant Associates in 1997, which grew into an international design studio with offices in Bath and Singapore. His most significant work, Gardens by the Bay, won the Building Project of the Year Award at the 2012 World Architecture Festival and continues to be one of the most visited places designed by a landscape architect. Beyond his design work, Grant is a Visiting Professor at the University of Sheffield and an Honorary Fellow of the Royal Institute of British Architects (RIBA). He also serves on the National Infrastructure Commission Design Group in the UK. In his hometown of Bath, he chairs the Bathscape Landscape Partnership and is a member of the Bath World Heritage Site Advisory Board. In 2023, Bath Spa University awarded Grant an Honorary Doctorate of Letters. Additionally, he co-founded the pop-up festival Forest of Imagination, which engages the community in reimagining urban spaces and their connection to nature. In the interview we opened topics about his beginnings and formative ideas, positioning and standing point, design and work process and where Andrew Grant finds excitement. Let’s start with your “formative project”, The Earth Centre in Doncaster. At the turn of the millennium, when environmental issues were becoming hot, this education and entertainment centre was designed in an awareness shift towards a more sustainable future. Even though it is a beautiful project, it unfortunately went bust. What have you learned while working on this project? I learned so much on the Earth Centre. It was a visually stunning and educational project that taught me that imagining the future is at the heart of landscape architecture. It also gave us more confidence to speak to the narratives of sustainability, while developing a deeper understanding of the technicalities of sustainable landscape design. Having a team with a lot of complementary skills but with a shared vision, gives us the ability to break down barriers and shape history. This was a very collaborative project and we worked closely with brilliant designers and artists – building trust and all working together towards our vision was key. One of the most powerful outtakes for me was that we can restore devastated landscapes by opening the door to nature’s regenerative power. And sadly, one of the final learnings was that however worthy an idea, it is always subject to the whims of politics and finance."
