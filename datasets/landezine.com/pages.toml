title = "Hey Bin —  Landscape Architecture Platform | Landezine"
description = "The Hey Bin is an urban totem designed to optimise waste management in a clean and sustainable way. Made from machined, bent and welded sheet steel, its robust structure guarantees durability and functionality. The combination of wood on the front and back gives it qualities that facilitate its integration in both landscape and commercial settings. […]"
full_description = "The Hey Bin is an urban totem designed to optimise waste management in a clean and sustainable way. Made from machined, bent and welded sheet steel, its robust structure guarantees durability and functionality. The combination of wood on the front and back gives it qualities that facilitate its integration in both landscape and commercial settings. Its top, in the form of a hut, prevents objects from being deposited on it, thus maintaining the hygiene of the environment. To facilitate maintenance, it has a front opening system with a hinged door that makes it easy to remove and insert the collection bag. It is installed by means of screws anchored to the pavement. Terms By accessing the website at http://landezine.com/, you are agreeing to be bound by these terms of service, all applicable laws and regulations, and agree that you are responsible for compliance with any applicable local laws. If you do not agree with any of these terms, you are prohibited from using or accessing this site. The materials contained in this website are protected by applicable copyright and trademark law. Use Licence Permission is granted to temporarily download one copy of the materials (information or software) on Landezine Media d.o.o.’s website for personal, non-commercial transitory viewing only. This is the grant of a licence, not a transfer of title, and under this licence you may not: modify or copy the materials; use the materials for any commercial purpose, or for any public display (commercial or non-commercial); attempt to decompile or reverse engineer any software contained on Landezine Media d.o.o.’s website; remove any copyright or other proprietary notations from the materials; or transfer the materials to another person or “mirror” the materials on any other server. This licence shall automatically terminate if you violate any of these restrictions and may be terminated by Landezine Media d.o.o. at any time. Upon terminating your viewing of these mate