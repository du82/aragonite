["https://landezine.com/casa-montessori-orff-school-by-straub-thurmayr"]
title = "Casa Montessori & Orff School by Straub Thurmayr —  Landscape Architecture Platform | Landezine"
description = "We live in a time of thrilling but also challenging tumultuous change in which a return to social solidarity, tolerance and participation increasingly gains in importance. We see landscape architecture as having the potential power to manage social conflicts and migration, establish debates, and live democracy. The implementation of this proposition includes establishing new local communities through […]"
full_description = "We live in a time of thrilling but also challenging tumultuous change in which a return to social solidarity, tolerance and participation increasingly gains in importance. We see landscape architecture as having the potential power to manage social conflicts and migration, establish debates, and live democracy. The implementation of this proposition includes establishing new local communities through education and intercultural exchange. Against the current global challenges of sustainable development, climate change and migrations, this project demonstrates that small-scale interventions can play a vital role as a catalyst for the welcome and lived integration. The Casa Montessori & Orff School is a small prairie school that offers an authentic Montessori program in Winnipeg, Canada. Following Maria Montessori’s inclusive teachings, the school is a home for families of diverse ethnic and cultural backgrounds, including recent immigrants. Children of this school, ages 2-12, learn to expect equal opportunities and treatment, irrespective of ethnic origin, skin colour, gender, sexual orientation, religion, or nationality, based on democratic principles and tolerance. The school has moved to a new location in an industrial area. Since then, the school has worked on a plan to improve the exterior environment according to the school‘s pedagogical concept. How is it possible to translate a pedagogical concept into space or even how to create a miracle for children, teachers and butterflies today? Playing, teaching and learning amongst living plants still seems to be the archetypical notion of a ‘good learning place’ – a setting in which all the senses and even the soul is stimulated in a playful and creative way. Many thousands of years ago, gigantic ice masses moved stones from the far north, perhaps even originating as far as the Hudson Bay. We then collected these erratic blocks and fieldstones from prairie pasturelands. Quarry operators donated alluvial sands and unscreened overburden, which glacial melting water had deposited close to the city thousands of years ago. A former sugar beet factory provided industrial ‘waste’ of crushed limestone used in the sugar beet processing. This sedimentary material is rich in fossils and documents the impressive diversity of organisms that inhabited Ordovician seas. We got permission to transplant endangered tall grasses from a restoration area, using cultural knowledge of building houses out of tall grass sod. We dropped hints of this lost nature into the school’s landscape. The whole site is a stage for illusions and can be interpreted as a place of study or as a field of magical dreams."
year_published = 2025
