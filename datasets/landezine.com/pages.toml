description = "Connect 1. To connect, link, or interlace 2. (+with) To establish a relationship or connection (with), to bridge a gap Terra 1. Earth: our planet, soil 2. To root: to feel at home The concept focuses on connecting the outdoor space with the earth. This urban garden, originally entirely paved, is being transformed into a […]"
full_description = "Connect 1. To connect, link, or interlace 2. (+with) To establish a relationship or connection (with), to bridge a gap The concept focuses on connecting the outdoor space with the earth. This urban garden, originally entirely paved, is being transformed into a greener and more vibrant space. The existing tiles are removed and strategically placing new paving with open joints. This allows plants to flourish between the tiles, which will gradually take on a natural green appearance over time. Additionally, the connection between indoor and outdoor spaces is emphasized through terra-pink paving. This color aligns with the redesigned interior, where pink is a central element. For this project, a custom shade was developed in collaboration with Ebema. Landscape Architecture: Bloesem Year completed: 2021 Photo credits: Senne & Eefje Manufacturer of urban or play equipment: Tiles by Ebema"
