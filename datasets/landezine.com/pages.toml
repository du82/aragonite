["https://landezine.com/durbanis"]
title = "Durbanis —  Landscape Architecture Platform | Landezine"
description = "At Durbanis, we believe we are more than just creators and manufacturers of urban and outdoor furniture. We are driven by a passion for design and by the desire to be part of the encounters that happen in public spaces. From our base in Banyoles, we design and develop furniture with a distinctive character, combining […]"
full_description = "At Durbanis, we believe we are more than just creators and manufacturers of urban and outdoor furniture. We are driven by a passion for design and by the desire to be part of the encounters that happen in public spaces. From our base in Banyoles, we design and develop furniture with a distinctive character, combining consistency, attractiveness, and harmony with the environment, aiming to inspire a global audience. We work to enhance the quality of public spaces and facilities that are constantly evolving, such as green areas, educational centres, sports facilities, and parks. These are spaces that share our understanding of wellness, freedom, and respect for the surrounding environment. Our products accompany users in transit areas, community spaces, squares, shopping centres, train stations, and airports, creating designs that shape and transcend hybrid spaces where private and public coexist. Our commitment is to sustainability. We produce furniture that respects nature, reduces our footprint, and supports a truly circular economy. We carefully select materials that can be reintroduced into the industry in a clean, environmentally friendly way. Excellence guides every stage of our process, from product creation to manufacture and lifecycle. We collaborate with designers, landscape architects, experts, and other professionals who share our values, working together to create elegant solutions that enrich public spaces."
