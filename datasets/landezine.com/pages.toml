title = "Solari Workstation —  Landscape Architecture Platform | Landezine"
description = "Much more than a basic picnic table, the ‘Solari’ solar workstation brings a unique combination of a stylish workstation, illuminated dining table, phone charging point, 120V AC power supply and internet access point to any outdoor location, all in a single, fully integrated unit, free from any connection to mains AC supply. On college campuses, […]"
full_description = 'Much more than a basic picnic table, the ‘Solari’ solar workstation brings a unique combination of a stylish workstation, illuminated dining table, phone charging point, 120V AC power supply and internet access point to any outdoor location, all in a single, fully integrated unit, free from any connection to mains AC supply. On college campuses, the ‘Solari’ workstation provides a convenient space for students to meet with their friends, enjoy a snack, catch up or continue working away from the confines of their room or library knowing that they can always charge up their laptop or mobile devices without leaving the bench. In the evening, overhead lights come on automatically at dusk, extending the time for studying and socializing well into the night in a safe, well-lit environment. The large 78” x 63” overhead canopy which houses the 440W PV cells and four overhead LED lights, helps to give a more intimate feel to the space compared with an exposed table and offers some protection from rain and bright sunlight. In municipal parks and recreation areas, the ‘Solari’ solar-powered picnic table becomes a high visibility focal point for social gatherings, picnics and parties with the convenience of phone charging, AC power outlets, night illumination, WiFi hotspot and Bluetooth speakers to add to the enjoyment and extend gatherings well into the evening. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-115082 lazyload" src="https://landezine.com/wp-content/uploads/2022/11/solari-work-station-archatrak-2-1270x846.jpg" alt="" width="1270" height="846" srcset="https://landezine.com/wp-content/uploads/2022/11/solari-work-station-archatrak-2-1270x846.jpg 1270w, https://landezine.com/wp-content/uploads/2022/11/solari-work-station-archatrak-2-630x420.jpg 630w, https://landezine.com/wp-content/uploads/2022/11/solari-work-station-archatrak-2-768x512.jpg 768w, https://landezine.com/wp-content/uploads/2022/11/solari-work-station-