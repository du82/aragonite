["https://landezine.com/durbanis-outdoor-furniture-roc"]
title = "Roc —  Landscape Architecture Platform | Landezine"
description = "Roc is a family of street furniture inspired by the ‘Trencadís’ system of Catalan modernist architecture. The three-dimensional surfaces are used as a fragmented mosaic, with each piece having a different geometry depending on its location. The set is made of cast concrete and includes seats, benches with backrests and planters. The seating version is […]"
