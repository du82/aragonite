["https://landezine.com/climate-changed-waters-unsettled"]
title = "Climate Changed & Waters (un)Settled —  Landscape Architecture Platform | Landezine"
description = "During all the media coverage—particularly in the United States—of Hurricanes Harvey (Category 4, 17 August-1 September), Irma (Category 5, 30 August-12 September), Jose (Category 4, 5-22 September) and Maria (Category 5, 16-30 September), the flooding and subsequent trail of destruction in Houston and southeast Texas, South Florida and the Caribbean, there was ceaseless talk of […]"
full_description = 'During all the media coverage—particularly in the United States—of Hurricanes Harvey (Category 4, 17 August-1 September), Irma (Category 5, 30 August-12 September), Jose (Category 4, 5-22 September) and Maria (Category 5, 16-30 September), the flooding and subsequent trail of destruction in Houston and southeast Texas, South Florida and the Caribbean, there was ceaseless talk of the ‘catastrophic,’ ‘historic’ and ‘unprecedented’ scale of the events. There was virtually no discussion of climate change, ill-conceived urbanization and the racial inequalities embedded within it, threats to human health and natural ecologies, the need to upgrade severely dilapidated infrastructure or even the continuing practices of 21th century colonialism (evident in much of the tourism-dependent Caribbean with Dutch, French, British and American ‘territories’). <img decoding="async" width="1200" height="880" class="alignnone wp-image-38952 size-large lazyload" style="filter: invert(0);" src="http://www.landezine.com/wp-content/uploads/2017/10/01_Harvey_flood_urbanization.jpg" srcset="https://landezine.com/wp-content/uploads/2017/10/01_Harvey_flood_urbanization.jpg 1200w, https://landezine.com/wp-content/uploads/2017/10/01_Harvey_flood_urbanization-630x462.jpg 630w, https://landezine.com/wp-content/uploads/2017/10/01_Harvey_flood_urbanization-768x563.jpg 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> Yet, for decades, science evinces that the world has become significantly warmer: experts have numbers to back their claims. Since humankind has burned so much oil, gas and coal, we are responsible for massive clouds of CO2 and methane in the air. The structure of those molecules traps heat, thus warming the planet. As a consequence, there are heavier rainfalls and stronger winds (along with drier forests and fields—fueling droughts and forest fires elsewhere). With regards to hurricanes, warmer air can hold more moisture. In the case of Harvey, the Gulf of Mexico waters have become warmer (4° C above average in August) and with a deep layer of warm water that the hurricane fed upon as it neared the coast. Scientists say that climate change is causing extreme weather events, including torrential rain, to happen with greater intensity and frequency. Sea level rise, coupled with storm surges are resulting in repetitive flooding in areas of low-lying urbanization, all the more compounded by greater areas of impervious surfaces resulting in more runoff. As well, the odds are changing: 100-year (an area with a 1-in-100 chance of a flood event in any given year) and 500-year flood plains have been rendered obsolete due to climate change. Federal flood maps, made by the Federal Emergency Management Agency (FEMA) are not cognizant of reality; they rely on outdated historic data and not projections for the future. In 2015, the Obama administration updated flood-risk standards for the first time since the 1970s, incorporating climate models and sea-level rise into calibrations for building elevations. The new standard required federally funded buildings in flood plains to be built at higher elevations, especially for critical infrastructure like hospitals and fire stations. On 15 August, Trump erased the standards with one line (Sec. 6. Executive Order 13690 of January 30, 2015 (Establishing a Federal Flood Risk Management Standard and a Process for Further Soliciting and Considering Stakeholder Input), is revoked) buried in the ‘Executive Order on Establishing Discipline and Accountability in the Environmental Review and Permitting Process for Infrastructure.’ The policy change mirrors broader principles, since the Trump administration does not accept human-induced climate change.'
year_published = 2025
clearnet = "https://landezine.com/climate-changed-waters-unsettled"
