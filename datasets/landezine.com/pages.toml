["https://landezine.com/durbanis-recommendation-versatile-uhpc-tables-transform-a-college-courtyard"]
title = "Versatile UHPC Tables Transform a College Courtyard —  Landscape Architecture Platform | Landezine"
description = "The Tour tables have been installed in the outdoor courtyard of Gomarus College in Drachten as part of a project designed by Buss Ontwerp. These tables, made of UHPC (Ultra High Performance Concrete), combine a lightweight aesthetic with a robust structure, providing a versatile environment for lunch, outdoor study, or student relaxation throughout the year. […]"
full_description = 'The Tour tables have been installed in the outdoor courtyard of Gomarus College in Drachten as part of a project designed by Buss Ontwerp. These tables, made of UHPC (Ultra High Performance Concrete), combine a lightweight aesthetic with a robust structure, providing a versatile environment for lunch, outdoor study, or student relaxation throughout the year. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-117242 lazyload" src="https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-1-1270x846.jpg" alt="" width="1270" height="846" srcset="https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-1-1270x846.jpg 1270w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-1-630x420.jpg 630w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-1-768x512.jpg 768w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-1-1536x1024.jpg 1536w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-1.jpg 2000w" sizes="(max-width: 1270px) 100vw, 1270px" /> The design of the Tour table stands out for its balance between functionality and aesthetics. Its monoblock structure, consisting of a continuous surface with integrated benches, eliminates the need for anchors and simplifies installation. Its slim profile conveys a sense of visual lightness without compromising stability, allowing it to blend naturally into the school environment. <img decoding="async" class="alignnone size-large wp-image-117243 lazyload" src="https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-2-1270x845.jpg" alt="" width="1270" height="845" srcset="https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-2-1270x845.jpg 1270w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-2-630x419.jpg 630w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-2-768x511.jpg 768w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-2-1536x1021.jpg 1536w, https://landezine.com/wp-content/uploads/2025/02/durbanis-recommendation-gumares-2.jpg 2000w" sizes="(max-width: 1270px) 100vw, 1270px" />'
