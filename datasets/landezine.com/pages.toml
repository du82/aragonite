["https://landezine.com/area"]
title = "Aréa —  Landscape Architecture Platform | Landezine"
description = "Enriching the urban experience with the ambition to improve daily life in the public space is Aréa’s purpose since its creation in 1987. No designer, no manufacturer, no publisher, our curiosity led us to become a designer of street furniture solutions. We tirelessly observe people, the city and its uses with a structuring conviction: the […]"
full_description = 'Enriching the urban experience with the ambition to improve daily life in the public space is Aréa’s purpose since its creation in 1987. No designer, no manufacturer, no publisher, our curiosity led us to become a designer of street furniture solutions. We tirelessly observe people, the city and its uses with a structuring conviction: the only social network of the future is called the human being. Without a priori or dogma, we create with the leitmotif of democratic design, aesthetic and functional furniture within everyone’s reach. After having drawn, prototyped, tested, modified, and fully manufactured our products, we distribute them with the same simple and exemplary requirement: no stock, no intermediary and price transparency. {"@context":"http:\/\/schema.org\/","@id":"https:\/\/landezine.com\/area\/#arve-youtube-bm-6csbik9e-2","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/bm-6csbiK9E?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"}'
