["https://landezine.com/job-landscape-architect-in-gloucestershire-uk"]
title = "Job: Landscape Architect in Gloucestershire UK —  Landscape Architecture Platform | Landezine"
description = "We are looking for a talented & enthusiastic landscape architect to join our team in Gloucestershire after some brilliant new commissions. We are an award winning young practice, committed to the integration of sustainable design in this Climate Emergency, to create amazing & resilient places for people. Reconnecting people with nature is one of our […]"
full_description = "We are looking for a talented & enthusiastic landscape architect to join our team in Gloucestershire after some brilliant new commissions. We are an award winning young practice, committed to the integration of sustainable design in this Climate Emergency, to create amazing & resilient places for people. Reconnecting people with nature is one of our great challenges – working with imaginative clients and creative disciples of architecture, engineering and ecology we form intrinsic links between these collaborators to deliver innovative, biodiverse and beautiful places. In 2022 we won 3 national landscapeinstitute awards including ‘outstanding overall winner’ for our trailblazing work on Lovedon Fields – adding to our 15 national Landscape Institute awards over the past 8 years. We strongly believe in the importance of personal development and encourage staff to participate in CPD events/trips and relevant training courses and provide mentorship on the Pathway to Chartership alongside involvement volunteering for the Landscape Institute. We have a lively social calendar including Europe wide study trips, work socials and provide a flexible + supportive working environment. Candidates should be able to demonstrate excellent skills in design and detailing from concept through to completion and have a minimum one years’ post degree experience. You will need to be proficient in the use of AutoCAD & Adobe Creative Suite with REVIT experience advantageous – good hand drawing and graphic skills essential. To apply, please send your digital application including your CV, covering letter and portfolio, to info@bdlandarch.com closing date 14th March."
year_published = 2025
