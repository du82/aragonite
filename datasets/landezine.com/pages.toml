["https://landezine.com/area-recommendation-on-the-individual-scale"]
title = "On the Individual Scale: In the Beginning Was the Chair —  Landscape Architecture Platform | Landezine"
description = "With this range of street furniture, we wanted to give the city the emotion and light of our schoolboy memories. Simple and welcoming, with no frills, Antibes and Nice adopt a compactness that embodies Aréa’s thinking on the individual scale of street furniture. Ottoman, chair, stool, counter … Are we talking about indoor or outdoor […]"
full_description = 'With this range of street furniture, we wanted to give the city the emotion and light of our schoolboy memories. Simple and welcoming, with no frills, Antibes and Nice adopt a compactness that embodies Aréa’s thinking on the individual scale of street furniture. Ottoman, chair, stool, counter … Are we talking about indoor or outdoor furniture? Indeed, in terms of twenty-first-century street furniture, does the sense of this border not stop or is it a historical beginning? It is the conviction of Aréa to restate its leitmotif through the Antibes and Nice ranges: to allow everyone in the public space to find the intimacy and conviviality that one feels at home. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-114442 lazyload" src="https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-1-776x1024.jpg" alt="" width="776" height="1024" srcset="https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-1-776x1024.jpg 776w, https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-1-606x800.jpg 606w, https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-1-768x1013.jpg 768w, https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-1.jpg 1061w" sizes="(max-width: 776px) 100vw, 776px" /> This range also materializes our certainty that the densification of cities requires the availability of a new scale of street furniture. Extrapolated from that of a chair, the Antibes and Nice design is compact and highly transparent. Aesthetic, affordable and welcoming, their components embody democratic design and meet the aspirations and needs of city dwellers in search of a fresh breath of air and a calmer rhythm of life. <img decoding="async" class="alignnone size-large wp-image-114445 lazyload" src="https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-4-1270x778.jpg" alt="" width="1270" height="778" srcset="https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-4-1270x778.jpg 1270w, https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-4-630x386.jpg 630w, https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-4-768x471.jpg 768w, https://landezine.com/wp-content/uploads/2024/12/area-rec-antibes-december-4.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" />'
