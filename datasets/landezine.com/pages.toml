full_description = "Strat is characterised by the modularity of its models and the dynamism of its zigzag facetted front. Strat benches have a strong architectural character, emphasising the consistency of the moulded concrete material from which they are made. The family comprises three elements: Strat 80, 200 and Curve, the 200 model can be fitted with certified wooden seat and armrests for greater comfort and warmth. It is easy to install by placing it on the pavement, with the option of anchoring it to the ground using threaded bolts. Terms By accessing the website at http://landezine.com/, you are agreeing to be bound by these terms of service, all applicable laws and regulations, and agree that you are responsible for compliance with any applicable local laws. If you do not agree with any of these terms, you are prohibited from using or accessing this site. The materials contained in this website are protected by applicable copyright and trademark law. Use Licence Permission is granted to temporarily download one copy of the materials (information or software) on Landezine Media d.o.o.’s website for personal, non-commercial transitory viewing only. This is the grant of a licence, not a transfer of title, and under this licence you may not: modify or copy the materials; use the materials for any commercial purpose, or for any public display (commercial or non-commercial); attempt to decompile or reverse engineer any software contained on Landezine Media d.o.o.’s website; remove any copyright or other proprietary notations from the materials; or transfer the materials to another person or “mirror” the materials on any other server. This licence shall automatically terminate if you violate any of these restrictions and may be terminated by Landezine Media d.o.o. at any time. Upon terminating your viewing of these materials or upon the termination of this licence, you must destroy any downloaded materials in your possession whether in electronic or printed format.