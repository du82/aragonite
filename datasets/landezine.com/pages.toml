["https://landezine.com/forest-intercalations"]
title = "Forest Intercalations —  Landscape Architecture Platform | Landezine"
description = """
Collectively, all humans experience 8 billion days in 24 hours. That is about 22 million years lived in one day.
When one starts to think about time in that way, it seems inevitable to envision the collective impact of human life on Earth."""
full_description = "Collectively, all humans experience 8 billion days in 24 hours. That is about 22 million years lived in one day. When one starts to think about time in that way, it seems inevitable to envision the collective impact of human life on Earth. While the term Anthropocene has been rejected by the International Commission on Stratigraphy as a geological epoch that would mark the conclusion of the Meghalayan Age of the Holocene Epoch, the Anthropocene Working Group (AWG) agrees that it needs to be formalized. Ideally, the Anthropocene would be defined by a ‘golden spike,’ a standard unit in the Geological Time Scale, with the most significant and globally synchronous marker being the artificial radionuclides spread worldwide by thermonuclear bomb tests from the 1950s. While the value of the term as a geological epoch is still debated, it has proven useful in other discourses. At the same time, the term Anthropocene has been widely critiqued for being too human-centric or too generalized for entire population to bear the guilt. It has been substituted with alternatives like Capitalocene or Chthulucene. Regardless of what the anthropogenic impact might be called in the future, its full scope has yet to unfold. We collectively spend millions of years day by day, until one day, nothing on the planet remains in its first-hand raw form. All the ‘rock’ is discarded concrete mixed with rubbish, poured back into previously hollowed-out mountains; no water is fresh anymore; no seas exist without a certain percentage of microplastics; and all materials on the market bear a Generation-n mark, a vintage-recycle. AWG will probably vote on anthropocene epoch again in 440 million years. This introduction serves to justify putting Anthropocene in focus—outdated as it may seem—or, to borrow Donna Haraway’s relationship with the term, “what and whom the Anthropocene collects in its refurbished netbag might prove potent for living in the ruins.” In this article, we briefly explore intercalations: paginated exhibition, a books-as-exhibitions series co-edited by Anna-Sophie Springer and Etienne Turpin in conjunction with The Anthropocene Project by Haus der Kulturen der Welt (HKW) in 2013/2014. The series so far includes six intercalations: paginated exhibition booklets, freely available at K. Verlag, with the latest edition, Decapitated Economies, due in March 2025. This time, we focus on contributions from The Word for World is Still Forest (2017), a publication that may be of particular interest to landscape architects."
