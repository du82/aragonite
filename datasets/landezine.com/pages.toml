["https://landezine.com/gronningen-bispeparken-by-sla"]
title = "Grønningen-Bispeparken by SLA —  Landscape Architecture Platform | Landezine"
description = "In Copenhagen’s new climate park form radically follows nature Copenhagen’s latest and most radical climate park, Grønningen-Bispeparken, transforms a derelict, barren grass area into a cohesive 20,000 m2 lush, playful, biodiverse, and art-filled urban nature park for all. Grønningen-Bispeparken is not a romantic promenade park but a transformative paradigm shift in urban development, where form […]"
full_description = "Copenhagen’s latest and most radical climate park, Grønningen-Bispeparken, transforms a derelict, barren grass area into a cohesive 20,000 m2 lush, playful, biodiverse, and art-filled urban nature park for all. Grønningen-Bispeparken is not a romantic promenade park but a transformative paradigm shift in urban development, where form follows nature and architecture’s foremost task is to create spaces for life – all life. In 2020, following a competitive tender, the City of Copenhagen appointed Danish nature-based design studio SLA to transform the 20,000 m2 outdoor areas of Grønningen-Bispeparken – a 1950s social housing estate. Located in Copenhagen’s Nordvest neighbourhood, the task was to transform the housing estate’s outdoor areas from derelict, unsafe, and barren grass lawns into a new climate park that would secure the area against thunderstorms and flooding while also adding social, natural, and cultural values to the neighbourhood and its residents. The new park design took the values and ideals of the original green areas, designed by legendary Danish landscape architect C.Th. Sørensen (1893-1979), and updated them to encompass the needs and aspirations of a modern city. Utterly transformed today, the original green areas had fallen into unsafe disrepair with no activities, usages, or play areas for the local kids and residents. The existing grass lawn was unable to manage or contain rainwater – resulting in veritable ‘rainwater motorways’ during thunderstorms – while also being very low on plant variation, wildlife, and biodiversity. To address these challenges, SLA designed Grønningen-Bispeparken to be Copenhagen’s most radical nature-based climate adaptation project to date. By letting the form of the park follow the processes of nature, SLA created an interconnected series of 18 bioswales throughout the sloping green areas that can collect, contain, and infiltrate more than 3,000 m3 of rainwater falling in the park and the adjacent courtyards and streets."
