["https://landezine.com/environment-for-revit-recommendation-harnessing-bim-technology"]
title = "Harnessing BIM Technology For Landscape Architecture —  Landscape Architecture Platform | Landezine"
description = "Ragnhild Lied Børke, Landscape architect at StudioNSW Landscape architect Ragnhild Lied Børke at StudioNSW about Environment for Revit® “It felt like unlocking a new, bigger, and more versatile toolbox, specifically designed for efficient collaboration and workflows across different disciplines.” Says Ragnhild Lied Børke, the only landscape architect among 19 partners at StudioNSW, the Norwegian architecture […]"
full_description = '“It felt like unlocking a new, bigger, and more versatile toolbox, specifically designed for efficient collaboration and workflows across different disciplines.” Says Ragnhild Lied Børke, the only landscape architect among 19 partners at StudioNSW, the Norwegian architecture firm. This plug-in is tailored to provide landscape architects with the necessary tools in Revit®, allowing for smoother workflows and better collaboration across phases and disciplines. Arch-Intelligence, an Israeli company, has developed the Environment for Revit® plug-in. This powerful software enables users to create detailed digital BIM models of terrain, topography, curbs, retaining walls, and vegetation, among other features. “I have worked as a landscape architect for many years and have used various programs, including Civil 3D. It’s an application I’ve always struggled with, both in terms of functionality and visual appearance. Looking at these triangulations for days on end can be overwhelming and cause discomfort,” expresses Børke. In the ongoing housing project “Kornhaven” in Hamar, Norway, Børke has been able to utilize many of her newly acquired skills. The project includes a diverse range of properties and lush outdoor areas, and is being adapted and built on a former industrial site that allowed for new higher construction due to the presence of large grain silos in the past. As a landscape architect, Børke notes that she is often at the mercy of other architects working on different stages of the project before and after her. In that process, the model has to flow seamlessly between many disciplines in order to enrich and complement each other. Previously, this process required long hours of conversion, importing, and exporting imperfect files using outdated digital tools. However, with Environment for Revit®, these issues are no longer a concern. <img fetchpriority="high" decoding="async" class="alignnone wp-image-97285 size-full lazyload" src="https://landezine.com/wp-content/uploads/2023/07/arch-intelligence-recommendation-july-23-1.jpg" alt="" width="627" height="441" />'
year_published = 2025
clearnet = "https://landezine.com/environment-for-revit-recommendation-harnessing-bim-technology"
