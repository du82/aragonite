["https://landezine.com/hatsinanpuisto-by-loci"]
title = "Hatsinanpuisto by Loci —  Landscape Architecture Platform | Landezine"
description = "Hatsinanpuisto is a new, diverse public urban park that brings nature into the urban environment. Located in the greater Helsinki metropolitan area close to Leppävaara train station, the area is bordered by busy roads and the railway. It is home to nearly 80 000 people and a daily commute of more than 50 000. The […]"
full_description = "Hatsinanpuisto is a new, diverse public urban park that brings nature into the urban environment. Located in the greater Helsinki metropolitan area close to Leppävaara train station, the area is bordered by busy roads and the railway. It is home to nearly 80 000 people and a daily commute of more than 50 000. The area is crossed by Monikonpuro, a small creek of local value. The creek is a valuable trout habitat and a highly flood-prone urban stream. The plan highlights contrasts between natural and urban and blurs the boundaries between them. The concept highlights the dynamics of urban environment and nature: an area that had previously been an “in-between space” is transformed into a pleasant park where nature and urban structure meet and merge. The park significantly increases the recreational possibilities of the area. Flowing water is the central element of the design. The landscape architecture of the park is influenced by water level fluctuations and supports the dynamic cycle of nature. The design is based on the Monikonpuro creek as the attraction and backbone of the area, with the aim of supporting the biodiversity of the water body and protecting the trout population. Paths, trails and bridges provide places to experience the park at different times of the year and at different water levels. The floodplains have been designed to remain dry in the event of regular flooding. During a major flood most of the park is submerged. High retaining walls bordering the plots support and protect them from flooding. The walls are integrated into the landscape architecture of the park with connecting seating platforms. They invite people to socialize and lounge by the water, even at times of flood. The vegetation along the creek is chosen with flood sensitivity in mind: planting design is made to cope with changing climates, such as drier and hotter summers and possible flooding of the river. From a technical point of view, the main design challenges are ensuring the stability of the stream area during flooding. The creek bed has been moved in stages during the different construction phases to protect the water quality and build the new final bed at the same time. The design is carried out in collaboration with stakeholders and experts in the fields of stream biology and trout habitat. Along with designing the park and giving new life to the area, the creek is improved to provide better habitat conditions for trout."
year_published = 2025
