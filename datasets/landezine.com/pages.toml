["https://landezine.com/buranbanen-activity-park-by-agraff-arkitektur"]
title = "Buranbanen Activity Park by Agraff Arkitektur —  Landscape Architecture Platform | Landezine"
description = "The industrial and working-class history of the Buran neighborhood has inspired the design of the park. The color use, play structures, and art expressions are intended to give a somewhat rough and industrial feel. The areas are filled with creative design, unexpected, colorful, and playful elements—beautifully framed by lush, green, and flowering vegetation. Preserving the […]"
full_description = "The industrial and working-class history of the Buran neighborhood has inspired the design of the park. The color use, play structures, and art expressions are intended to give a somewhat rough and industrial feel. The areas are filled with creative design, unexpected, colorful, and playful elements—beautifully framed by lush, green, and flowering vegetation. Preserving the surrounding tree rows was a key to grounding the project to the site, while also strengthening the spatial experience of the park. Rockets, old factory chimneys with wild grasses, giant tin can shaped sculptures that you can crawl through, and children of all ages playing games, doing sports and having fun emerge as we stroll through the park, passing berry bushes and fruit trees. Buran is an old working-class district that has become one of Trondheim’s most urban and diverse neighborhoods. The project was selected as a model project in Circular Economy in Landscape Architecture, published by the NLA (Norwegian Landscape Architects Association) in 2023, and was nominated for the Trondheim Municipality Building Style Award in 2024. Achieving a good mix of functions was very important designing the park. By creating opportunities for both children and adults to play near each other, and even together, the park thrives with life and energy. The park is designed so that the different activity areas are in contact and overlap with each other. Then spontaneous encounters occur and different types of activity and movementa are taking place in the same landscape space. We want to create an experience of everything happening in the park, and making all visitors feel included, even just observing the activities from a distance. Several seating areas are placed around the activity spaces, to include a wider range of users and facilitating longer stays in the activity park. Another key focus was to make the park safer and more accessible. The terrain has been gently sloped to improve visibility, and the large existing trees have been complemented by a low wildflower meadow. Lighting was also an essential element, improving safety, functionality, and creating an atmospheric experience."
