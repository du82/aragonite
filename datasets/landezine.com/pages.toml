["https://landezine.com/international-african-american-museum-by-hood-design-studio"]
title = "International African American Museum by Hood Design Studio —  Landscape Architecture Platform | Landezine"
description = "In 2016, Hood Design Studio began a collaborative journey for the African Ancestors Memorial Gardens in Charleston, bringing together a diverse group of artists, academics, historians, activists, architects, and civic leaders. Their discussions shaped the gardens, harmonizing voices while respecting the sacredness of Gadsden’s Wharf and supporting the emerging museum. The site’s historical significance is […]"
full_description = "In 2016, Hood Design Studio began a collaborative journey for the African Ancestors Memorial Gardens in Charleston, bringing together a diverse group of artists, academics, historians, activists, architects, and civic leaders. Their discussions shaped the gardens, harmonizing voices while respecting the sacredness of Gadsden’s Wharf and supporting the emerging museum. The site’s historical significance is honored with a stainless steel band symbolizing Gadsden’s Wharf and a brick-paved strip tracing the former storehouse where enslaved individuals suffered. A boardwalk with kneeling figures connects the past and present through polished granite walls. At Gadsden’s Wharf’s edge, one’s gaze extends to Sullivan’s Island and beyond. A water feature pays tribute to the Atlantic Passage, revealing and concealing figures in its flow, encouraging reflection on history and dialogue for the present and future. These gardens draw inspiration from local and global African diaspora landscapes, providing serene spaces for meaningful discourse and contemplation."
