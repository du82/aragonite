["https://landezine.com/about-us"]
title = "About Us —  Landscape Architecture Platform | Landezine"
description = "Landezine was started in the summer of 2009. Since then, it has been showcasing landscape architecture projects made by landscape architects and architects from around the globe. Today, Landezine is an internationally renowned and, by numbers, the most visited landscape architecture website. More than 5,000 visitors from all over the world visit landezine.com every day. […]"
full_description = "Landezine was started in the summer of 2009. Since then, it has been showcasing landscape architecture projects made by landscape architects and architects from around the globe. Today, Landezine is an internationally renowned and, by numbers, the most visited landscape architecture website. More than 5,000 visitors from all over the world visit landezine.com every day. In 2016 we expanded our network and empowered our voice in the global community by launching LILA, Landezine International Landscape Award. LILA aims to recognize the most interesting and progressive practices from the field of landscape architecture. This development and expansion of our activities wouldn’t have been possible without the invaluable expertise of Robert Schäfer, who joined our team as an adviser. Robert studied Landscape Architecture and Journalism, founded Topos Magazine in 1992 and was in charge of Garten+Landschaft Magazine between 1984 and 2014. As a land arch student I find your site invaluable. I was wondering whether a new category on memorials would be useful down the left navigation bar. Dear Georgina, we actually have it, but is merged with the cemeteries category. Find it here: http://www.landezine.com/index.php/landscapes/landscape-architecture/realized-projects/cemeteries-memorials/ I don’t know if it is on purpose or not, when I look in projects and chose a filter at Filter landscapes by, I can only pick one at the time. Either I can look for Cities and squares, or places in the Netherlands. It reloads every time making it not possible to have multiple filters on at the same time. Is there something that can fix this? I love using the site for inspiration in my own projects! With great admiration for the work you have done to spread the beauty of this profession, I would like to pose an idea to improve the experience on the website. As of now, under the “Offices” section, there is no possibility to filter by country. I believe it would be a great resource, both for professionals and the public alike, to be able to see which offices are near you. Either if you are looking for work in a certain part of the world, or looking to hire, Landezine could become the site of reference for that matter."
year_published = 2025
