["https://landezine.com/bellitalia-recommendation-marte"]
title = "Marte – Elegance and Majesty —  Landscape Architecture Platform | Landezine"
description = "What can help make surrounding landscapes and outdoor walks pleasantly inspiring? Having beautiful planters that beautify our cities, our daily walks, and our always feeling safe. The pandemic made everybody realize how great it is to spend some time outdoors in the cities. With this, we believe that urban design is essential to redefine public […]"
full_description = 'What can help make surrounding landscapes and outdoor walks pleasantly inspiring? Having beautiful planters that beautify our cities, our daily walks, and our always feeling safe. The pandemic made everybody realize how great it is to spend some time outdoors in the cities. With this, we believe that urban design is essential to redefine public spaces, create pedestrian areas and limited access zones for cars, and transform cities into welcoming places for all citizens. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-68439 lazyload" src="https://landezine.com/wp-content/uploads/2021/11/other-photos-1-1270x846.jpg" alt="" width="1270" height="846" srcset="https://landezine.com/wp-content/uploads/2021/11/other-photos-1-1270x846.jpg 1270w, https://landezine.com/wp-content/uploads/2021/11/other-photos-1-630x420.jpg 630w, https://landezine.com/wp-content/uploads/2021/11/other-photos-1-768x512.jpg 768w, https://landezine.com/wp-content/uploads/2021/11/other-photos-1.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" /> And if you’re someone who enjoys spending time outdoors, it’s no surprise that you’ve come across a number of beautiful landscapes and breathtaking views. With that, Bellitalia also wanted to do its part by giving a collection of beautiful planters because we need more flowers in our cities, all over the world. <img decoding="async" class="alignnone size-large wp-image-68440 lazyload" src="https://landezine.com/wp-content/uploads/2021/11/other-photos-2-1270x846.jpg" alt="" width="1270" height="846" srcset="https://landezine.com/wp-content/uploads/2021/11/other-photos-2-1270x846.jpg 1270w, https://landezine.com/wp-content/uploads/2021/11/other-photos-2-630x420.jpg 630w, https://landezine.com/wp-content/uploads/2021/11/other-photos-2-768x512.jpg 768w, https://landezine.com/wp-content/uploads/2021/11/other-photos-2.jpg 1400w" sizes="(max-width: 1270px) 100vw, 1270px" /> The planters in our Pianeti collection are equipped with a water reserve system, overflow drainage, and a hole for the passage of electrical and/or hydraulic systems. Each planter is equipped with three brackets for handling with bands or chains, made of reconstituted natural marble stone or white granite and polished or bush-hammered finish.'
