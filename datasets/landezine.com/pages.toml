["https://landezine.com/job-assistant-or-associate-professor-in-landscape-architecture-university-of-manitoba"]
title = "Job: Assistant or Associate Professor in Landscape Architecture, University of Manitoba —  Landscape Architecture Platform | Landezine"
description = "The Department of Landscape Architecture, Faculty of Architecture, invites applications from outstanding candidates for a full-time tenure-track (probationary) or tenured position at the Assistant or Associate Professor rank, commencing August 1, 2025, or on a date mutually agreed upon. Salary and rank will be commensurate with experience and qualifications. Candidates will be committed to excellence […]"
full_description = "The Department of Landscape Architecture, Faculty of Architecture, invites applications from outstanding candidates for a full-time tenure-track (probationary) or tenured position at the Assistant or Associate Professor rank, commencing August 1, 2025, or on a date mutually agreed upon. Salary and rank will be commensurate with experience and qualifications. Candidates will be committed to excellence in teaching and research in landscape architecture, with an interest and ability to work with allied disciplines and apply innovative and creative approaches to their work. Duties include instructing studios and lecture courses in the Master of Landscape Architecture program and the Landscape + Urbanism option of the undergraduate Environmental Design program. The teaching load will consist of two studios and one lecture course or one studio and two lecture courses each academic year, and graduate student supervision. The position also requires the appointee to engage in scholarly activities, encompassing applied scholarship, creative work, professional practice, or research, and to provide service within the University and/or the broader community. Further specifics about activities and criteria for excellence related to teaching, scholarship, and service are outlined in more detail in the Faculty of Architecture Guidelines for Tenure and Promotion pdf. The appointee will report to (and be assigned teaching duties by) the Head of Landscape Architecture. A qualification for professional licensure by the Canadian Society of Landscape Architects (CSLA) is also an asset but not required. To be considered for the position of Associate Professor, candidates must demonstrate a record of high-quality scholarship, recognized leadership, and evidence of successful teaching in line with the Faculty of Architecture Guidelines for Tenure and Promotion. The Faculty of Architecture at the University of Manitoba is dedicated to excellence in the design of the human environment. We offer an undergraduate program in Environmental Design and fully accredited graduate programs in Landscape Architecture, City Planning, Architecture and Interior Design, as well as a PhD program in Design and Planning. We aim to provide an inspiring learning environment based on ethical principles and profound knowledge to prepare students for the complex demands confronting practitioners in the design disciplines. Additional information about the Department of Landscape Architecture can be obtained from https://umanitoba.ca/architecture/department-landscape-architecture."
