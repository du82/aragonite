["https://landezine.com/invisible-infrastructures-putting-landscape-architecture-on-the-moon"]
title = "Putting Landscape Architecture on the Moon —  Landscape Architecture Platform | Landezine"
description = "The landscape architecture profession, young as it seems, is backed up by a long line of planners, practitioners, and academics, connected in chambers, networks and local contexts. However, landscape architecture still sees a problem with the profession’s visibility. This is contrary to Susan and Geoffrey Jelicoe’s prediction in 1975 that: “the world is moving into […]"
full_description = "The landscape architecture profession, young as it seems, is backed up by a long line of planners, practitioners, and academics, connected in chambers, networks and local contexts. However, landscape architecture still sees a problem with the profession’s visibility. This is contrary to Susan and Geoffrey Jelicoe’s prediction in 1975 that: “the world is moving into a phase when landscape design may well be recognised as the most comprehensive of the arts”, landscape architecture finds itself in the gap between “the discipline’s own perception of its potential for addressing many of today’s societal challenges and the actual way in which landscape architecture is viewed by society in general”. We are speaking with Elke Mertens from Neubrandenburg University of Applied Sciences (DE) and Richard Stiles from TU Vienna (AT) about the strategy needed to take, and address the ‘hidden infrastructures’ that need to be invigorated in order to put landscape architecture at the heart of society’s discourse by leaving the safe-zone bubble. Where does the LA Visibility initiative come from? Who is working in the background, what institutions and associations are involved, and who are the individuals participating in this endeavour to put the landscape architecture profession at the forefront? This is still a small initiative trying to grow larger. It can be traced back to discussions the editorial team of the Teaching Landscape books had. We wish to point out ‘invisible infrastructure’, namely the way in which professions are embedded in their societal context. This eventually led to a joint paper. While there is no-one working in the background, almost everyone who we have talked to agrees that there is a real problem with profession visibility, especially at a time of the climate and biodiversity crises. When you say taking the LA profession on the Moon, you mean focusing attention on it vertically — from the power and influence zone, politics, wider society, the immediate local surroundings, and academia, working in different sectors. What are the steps to connecting all these dots?"
year_published = 2025
clearnet = "https://landezine.com/invisible-infrastructures-putting-landscape-architecture-on-the-moon"
