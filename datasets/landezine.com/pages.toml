["https://landezine.com/aldgate-a-twisted-ribbon-crawling-through-the-city-of-london-by-carve"]
title = "Aldgate. A Twisted Ribbon Crawling Through the City of London by Carve —  Landscape Architecture Platform | Landezine"
description = "City and Play Aldgate, located in the heart of the City of London, could have easily become a space dominated by corporate use―where people rush through on their way to work or briefly spend lunch breaks glued to their phones. Without thoughtful intervention, it would remain underused outside of peak hours.  To prevent this, Carve, […]"
full_description = "Aldgate, located in the heart of the City of London, could have easily become a space dominated by corporate use―where people rush through on their way to work or briefly spend lunch breaks glued to their phones. Without thoughtful intervention, it would remain underused outside of peak hours. To prevent this, Carve, in collaboration with Townshend Landscape Architects, carefully designed and inaugurated in 2024 a dynamic and vibrant public realm that acts as a crossroad between movement, playfulness, and community life―intended for both relaxation and active use to coexist. At the heart of Aldgate’s urban transformation is a twisted bright coloured ribbon that weaves through the street-scape, continuously changing form. Its triangular section twists and takes on different shapes: a bench to rest, a playful crawling bridge, table tennis, exercise equipment, or even an outdoor stage for events, performances, and role-playing games. A long table that invites convivial lunch breaks or birthday celebrations, while open areas foster spontaneous gatherings and playful encounters. This space intentionally blurs traditional functional preconceptions: is it for kids to play, or adults to gather? A relaxed hangout spot, or an outdoor space for informal work meetings? There is no right or wrong answer, it is all of these and more. The ribbon’s bold red and orange hues give a unique character the public space, creating a striking contrast with urban environment while perfectly complementing the surrounding greenery. It not only lights up the urban landscape, but also, with its captivating shapes and multiple uses, transforms it into something unexpected and attractive. Shaping the twists in the steel ribbon presented a unique challenge which the contractor handled exceptionally well. The connections between the ribbon pieces were carefully crafted to be smooth and seamless, remaining invisible from every angle of the triangular components. The incorporation of wooden planks as seating areas required precision and expertise. Each joint was carefully considered to maintain the integrity of the design while creating a flawless, uninterrupted flow. Another challenge was navigate around the dense network of infrastructure beneath the project site, including cables, pipes, and the Victorian tunnel. All of this allowed our team to work together and successfully realize this unique element, transforming the space into something truly special."
year_published = 2025
