full_description = 'Landscape Forms is the industry leader in integrated solutions of high-design site furniture, advanced LED lighting, structure, and custom environments. For more than 50 years we have developed and created solutions that help designers and other clients achieve beautiful, functional landscapes that enhance the experience of outdoor space. Our secret is simple. Design, Culture and Craft drive everything we do. Landscape Forms solutions include a wide range of elements from adaptive outdoor structures to seating, shelters and custom environments, to bike racks and bollards, litters and LED lights. Our solutions are evidence – and experience–based. We pursue ongoing dialog with the movers and shakers in design and sponsor intelligence-gathering events and apply our findings to designing and manufacturing products that address the needs of our customers and emerging issues in the landscape. We are a North American-based company that since our founding in 1969 has earned a reputation for exceptional products and service. Our headquarters and primary manufacturing facility are located in Kalamazoo, Michigan. Also, part of our brand group are Kornegay Design, located in Phoenix, Arizona, Loll Designs, located in Duluth, Minnesota, and Summit Furniture located in Monterey, California. We have sales representatives throughout North America, South America, the United Kingdom, Australia, the United Arab Emirates and Asia and have formed global marketing partnerships with select companies that share our commitment to design. {"@context":"http:\/\/schema.org\/","@id":"https:\/\/landezine.com\/landscape-forms\/#arve-vimeo-413961815-2","type":"VideoObject","embedURL":"https:\/\/player.vimeo.com\/video\/413961815?dnt=1&app_id=122963&transparent=0&title=1&byline=0&portrait=0&autoplay=0"} {"@context":"http:\/\/schema.org\/","@id":"https:\/\/landezine.com\/landscape-forms\/#arve-vimeo-338013296-2","type":"VideoObject","embedURL":"https:\/\/player.vimeo.com\/video\/