description = "Informed by the interplay of impeccable lines, perfect circles and conical forms, the pure geometry of Moment finds expression in sculptural luminaires that are at once artful and practical, elegant and elemental. Created in collaboration between Landscape Forms and Spanish design studio Yonoh, the bold utilitarian simplicity of Moment celebrates the power of restraint, enhancing […]"
full_description = 'Informed by the interplay of impeccable lines, perfect circles and conical forms, the pure geometry of Moment finds expression in sculptural luminaires that are at once artful and practical, elegant and elemental. Created in collaboration between Landscape Forms and Spanish design studio Yonoh, the bold utilitarian simplicity of Moment celebrates the power of restraint, enhancing the vitality of the spaces it illuminates. <img fetchpriority="high" decoding="async" class="alignnone size-large wp-image-114283 lazyload" src="https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-1-1270x847.jpg" alt="" width="1270" height="847" srcset="https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-1-1270x847.jpg 1270w, https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-1-630x420.jpg 630w, https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-1-768x512.jpg 768w, https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-1-1536x1025.jpg 1536w, https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-1.jpg 2000w" sizes="(max-width: 1270px) 100vw, 1270px" /> “This was our first outdoor lighting project and we were thrilled to partner with the experienced designers and engineers at Landscape Forms to bring it to life,” says Alex Selma, Yonoh founder and one of the lead designers on the project. “Our goal at the outset was to create an impressively modern product that would be at home in almost any setting, and I think we achieved that.” <img decoding="async" class="alignnone size-large wp-image-114284 lazyload" src="https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-2-1270x847.jpg" alt="" width="1270" height="847" srcset="https://landezine.com/wp-content/uploads/2024/12/landscape-forms-rec-moment-december-2-1270x847.jpg 1270w, https://landezine.com/wp-co