["https://landezine.com/folly-forest-by-straub-thurmayr"]
title = "Folly Forest by Straub Thurmayr —  Landscape Architecture Platform | Landezine"
description = "Strathcona School is located in one of Winnipeg’s most impoverished districts providing a schoolyard which typically consists of asphalt, lawn and a play structure. Fostering a vision of holistic community “health and learning”, Folly Forest hopes to induce multi-layered transformations that would ultimately culminate in a stimulating outdoor environment for children and a vital public […]"
full_description = "Strathcona School is located in one of Winnipeg’s most impoverished districts providing a schoolyard which typically consists of asphalt, lawn and a play structure. Fostering a vision of holistic community “health and learning”, Folly Forest hopes to induce multi-layered transformations that would ultimately culminate in a stimulating outdoor environment for children and a vital public open space for the neighbourhood. The design intends to allow children and families to gain physical, social, emotional, and intellectual outdoor experiences. Folly Forest demonstrates the immense potential of landscape architecture as a spatial and social transformer. The total cost for the metamorphosis of the fifty years old asphalt is $20 per square meter. The controlled reuse, the second life of materials and their transformation into a new context, is key to this project. Folly Forest proves that projects do not need to have million-dollar budgets or use vast amounts of resources. 1. Perforate the Asphalt 2. Plant Trees 3. Fill Gaps 4. Sow Native Grasses 5. Welcome People and Earthworms The concept of perforating the existing asphalt showcases how a simple measure can take ecological and aesthetical effects and turn them into the formative design element. The ‘star-shaped fugues’ create free spaces for trees, water infiltration, soil organisms, plant communities, insect habitats, and all of which are on the ground where people go by foot, by bike or by service vehicle. The existing grassy cracks are integrated into this concept. According to this principle, the fugues became a composed piece of everyday ecology and biodiversity. Bricks, logs, asphalt, and stones – four materials and two colours are the main elements on the ground. Silvery wooden beams and rusty cauldrons became objets trouvés and serve as ‘jackstraws’ and ‘lookout towers for earthworms.’ All materials are recycled or renewable. The star-shaped tree discs are pockets of good growing conditions to ensure that the trees feel comfortable in this environment. All tree discs are covered with permeable materials, with space has been left between the stones and logs for plants to grow. There is always enough space for life and freedom within limits between the gaps."
