full_description = "With nearly 40 years of experience, Maglin designs and manufactures contemporary outdoor site furniture solutions that are aesthetically pleasing while durable enough to thrive outdoors in all seasons. From benches, bollards, bike racks, and receptacles, to panels, planters, tables, chairs, custom projects, and more – we strategically configure and thoughtfully customize adaptable solutions that will enhance any area. Maglin’s modular outdoor collections offer landscape architects and designers the freedom to design scalable site furniture solutions. The Ogden, Pixel, and Flexx Collections are responsive furniture lines that easily adapt to site plans and create a customized look within a range of standard products. Standard Collections like ALUM, Foro, and Kontur add modern style to sites, with stylish movable and stationery pieces that invite groups to inhabit spaces in creative ways. Why choose Maglin? It’s not about us…it’s about you. We exist to support the site furniture needs of landscape architects who create inspired public spaces. Our purpose is to serve our clients by continually offering new and expanding product lines while reinforcing sustainability as a core pillar of our business. To demonstrate our commitment to transparency in manufacturing and materials, we offer Environmental Product Declarations (EPDs) for most of our products."
