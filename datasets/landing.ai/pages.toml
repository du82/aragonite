["https://landing.ai/blog/improving-clinical-diagnoses-with-a-computer-vision-ai-app"]
title = "Computer Vision in Clinical Pathology: AI Improving Diagnoses"
description = "Learn how Dr. Brian Cone used LandingLens to create a computer vision model for clinical pathology to deploy as an app to his team, streamlinig tumor detection."
full_description = 'Over the past month, our team has worked with several subject matter experts (SMEs) to build out custom AI computer vision applications to help them with their everyday workflows. After using LandingLens to train and test models quickly, these users worked with the newly released Python Library to build computer vision apps of their own. In each case, we were able to hack together a working prototype in less than an hour. This has led to several breakthroughs as these SMEs have brought concepts to life in a working proof of concept, like using computer vision in clinical pathology to improve diagnoses with AI. One computer vision case in particular that has received a lot of attention in the medical world is that of Dr. Brian Cone, a Computational Pathologist based in Los Angeles. Pathology, the study of disease on a cellular level, involves the examining tissues and cells with microscopes to diagnose and treat various medical conditions. Dr. Cone and his team spend their time characterizing the “morphology” of tissues and cells to help better diagnose issues. Dr. Cone grew tired of manually reviewing whole slide images (WSI), which are digitized glass slides containing tissue samples. Dr. Cone started looking for faster solutions that would streamline his workflow and allow him and his team to focus on corner cases. He then found LandingLens, the computer vision platform from LandingAI. By using our newly released Visual Prompting approach, he was able to train unique models to look for specific disease characteristics. Once he got the model working, he was able to utilize our APIs to deploy that model on his own app, which is now being used to quickly classify large numbers of WSI images—normally thousands of hours of work—instantaneously. Let’s take a look at one of Dr. Cone’s real-life use cases. In this example, Dr. Cone has several images of lung tissue, and he’s trying to determine whether they’re cancerous or not. <img decoding="async" class="aligncenter" src="https://landing.ai/wp-content/uploads/2023/07/pathology_1.gif" width="80%" />'
author = "Whit Blodgett"
year_published = 2023
year_updated = 2025
clearnet = "https://landing.ai/blog/improving-clinical-diagnoses-with-a-computer-vision-ai-app"
tags = ['7px;"', "agentic", "analysis", "analyze", "andrew", 'arrow"', "background", "brief:", "building", "case:"]
