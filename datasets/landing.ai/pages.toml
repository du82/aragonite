["https://landing.ai/blog/using-ai-to-reduce-false-positives-and-line-stoppages-for-the-automotive-industry"]
title = "How to Reduce False Positives in the Automotive Sector with AI"
description = "Surface inspection ensures quality in the automotive sector. Read how to reduce false positives & line stoppages for the global automotive industry with AI."
full_description = "Are you wondering how to reduce false positives in the global automotive industry? Surface inspection is one of the major tasks to ensure quality in the automotive sector, wherein a wide variety of global automotive systems, subsystems and parts need to be inspected for defects such as auto-body scratches and part defects like panel splits, cracks, inner-fin defects, defective automotive vents, etc. While the automotive industry has adopted traditional machine-vision technology widely over the last few decades, it suffers from limited accuracy when there are variances in how a specific type of surface defect manifests itself. This leads to a high number of false positives such that defects that don’t exist are flagged. These shortcomings of traditional machine-vision systems have significant cost implications for the automotive industry. Every so-called defective part that the machine-vision system flags must be either re-inspected by a human worker or scrapped (depending on the economics of the situation), which invariably adds to the total cost of quality (or non-conformance.) Further, auto OEMs and their Tier 1 suppliers may have instituted standard operating procedures that recommend stopping an assembly line if the number of defects that the machine-vision system flags exceed a predetermined threshold over a specific time period. These stoppages result in lower throughput, lost productivity and understandably frustrated workers. We have demonstrated to our customers that AI-powered vision performs much better than the traditional rule-based machine vision in drastically lowering (up to 90% in some cases) the number of false positives generated. In turn, this reduces the need for unnecessary manual inspections, speeds up the inspection process, reduces the number of line stoppages and improves throughput and productivity. Powered by our AI visual inspection platform, we have two categories of products for automotive OEMs and their Tier 1 suppliers: (a) Visual Inspection – For detection of cracks, dents, holes, and real-time video inference to identify defects on glossy auto bodies or parts, and (b) Scalable personalized coaching – For assembly-line workers to ensure adherence to standard operating procedures or increase productivity. These products have several key advantages:"
author = "LandingAI"
year_published = 2020
year_updated = 2023
