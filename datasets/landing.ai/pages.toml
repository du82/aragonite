["https://landing.ai/partners/use-visual-ai-models-to-detect-defects-with-landinglens-on-snowflake"]
title = "Use Visual AI Models to Detect Defects with LandingLens on Snowflake"
full_description = '''In this quickstart, we'll use LandingLens — a Native App available in the Snowflake Marketplace — to create a computer vision model that detects defects in components from a manufacturing environment. After completing this quickstart, users can use the concepts and procedures from this quickstart to build Object Detection, Segmentation, and Classifications models in LandingLens. LandingLens is a cloud-based Visual AI platform. LandingLens empowers users to create and train Visual AI models even if you don't have a background in AI, machine learning, or computer vision. LandingLens guides you through the process of uploading images, labeling them, training models, comparing model performance, and deploying models. To users who are familiar with machine learning, LandingLens offers advanced tools to customize the model training process. LandingLens supports advanced deployment options including cloud deployment as well as Docker and LandingEdge, LandingAI's edge-deployment solution. Access to the LandingLens app is available by request. To request the app, follow the instructions below: After you've requested the app and been granted access it, follow the instructions below to install it in Snowflake: Now that you've installed the LandingLens app, you are ready to get the sample images. LandingAI provides a set of sample images as an "app" that can be downloaded from the Snowflake Marketplace. You will use these images to train a computer vision model in LandingLens that detects manufacturing defects. Now that you've loaded the sample dataset into your Snowflake account, you're ready to create a computer vision model using those images in LandingLens. Now that all of the images are in the LandingLens project and have classes assigned to them, train a computer vision model. When you train a model, you give the labeled images to a deep learning algorithm. This allows the algorithm to "learn" what to look for in images. The right side panel opens and shows the model training progress. This process can take a few minutes.'''
