title = "LandingAI Launches LandingLens, a Snowflake Native App, on Snowflake Marketplace - LandingAI"
description = "LandingAI’s LandingLens to help unlock the full potential of data for joint customers     [SAN FRANCISCO], [JUNE 4, 2024] — LandingAI today announced at Snowflake’s annual conference, Snowflake Data Cloud Summit ‘24, that it has launched LandingLens in Snowflake Marketplace. LandingAI’s Snowflake native app simplifies the creation and deployment of computer vision AI projects, natively […]"
full_description = "LandingAI’s LandingLens to help unlock the full potential of data for joint customers [SAN FRANCISCO], [JUNE 4, 2024] — LandingAI today announced at Snowflake’s annual conference, Snowflake Data Cloud Summit ‘24, that it has launched LandingLens in Snowflake Marketplace. LandingAI’s Snowflake native app simplifies the creation and deployment of computer vision AI projects, natively within customers’ Snowflake accounts. “I’m thrilled about deepening our partnership with Snowflake by integrating the LandingLens app directly into the Snowflake Marketplace,” said Andrew Ng, founder of LandingAI. “This step is a big deal for us—it means that users can now use our AI-driven computer vision technology right within Snowflake’s data platform. By offering LandingLens natively, we’re making it easier for our customers—and Snowflake’s—to adopt and benefit from advanced AI tools. This move is designed to streamline how our technology is deployed and boost efficiency, which helps to drive real, measurable improvements in industries like manufacturing, healthcare, and beyond.” LandingAI and Snowflake have partnered to leverage Snowflake’s Data Cloud, enhancing the capabilities of their joint customers to utilize their data more effectively. Through this partnership, customers can train and deploy models directly within Snowflake as User-Defined Functions or as Snowflake Native Applications. This integration improves efficiency and drives innovation in sectors such as manufacturing, healthcare, and life sciences. The collaboration provides businesses with the tools to create tailored AI solutions, helping them address specific challenges and improve decision-making processes. “We are elated to introduce Landing AI’s innovative Native App, LandingLens, to the Snowflake Marketplace,” said Prasanna Krishnan, Head of Collaboration and Horizon, Snowflake. “This integration aligns perfectly with our mission to mobilize the world’s data, offering our users a seamless and powerful solution to leverage AI-driven computer vision capabilities directly within our platform. It demonstrates how businesses can unlock the full potential of their data, by bringing applications and AI models to their data and running them within the security and governance perimeter of their Snowflake account.“"
