["https://landing.ai/case-studies/omniab"]
title = "OmniAb Case Study: Leveraging AI in Drug Discovery"
description = "Explore how OmniAb leveraged AI in drug discovery using LandingLens to boost inspection throughput by 10X, resulting in 30% more potential discoveries."
full_description = "Bob Chen, PhD., Sr. Director of System Engineering for OmniAb, and his team are discovering innovative antibody therapeutics by using their xPloration® platform to capture images of millions of single B cell assays. This evaluation requires expert judgment through manual visual review by experts. By automating this manual process with LandingLens, Bob’s team was able to leverage AI in their drug discovery and development process, increasing inspection throughput by up to 10X and identifying 30% more potential hits than visual inspection alone. “We are excited by the positive impact our partnership has generated. The ease of use of LandingLens has democratized AI to other parts of our company and has enabled us to use AI in additional use cases,” Bob said. OmniAb’s mission is to enable the rapid development of innovative therapeutics by pushing the frontiers of drug discovery technologies. They provide the world’s leading pharmaceutical companies with cutting-edge technologies, such as diverse antibody repertoires from transgenic animals and high-throughput screening technologies. OmniAb’s xPloration® screening platform uses automated microscopes to capture images of millions of B cells interacting with reporter cells or beads. These pictures are then analyzed to determine if individual B cells express antibodies having the desired function. Those desirable B cells are then efficiently recovered for further study. The criteria for what qualifies for further study are multi-faceted and require expert judgment. These microscopic images are analyzed in multiple color channels, and the interactions between the antibodies and targeted cells are difficult to detect to untrained eyes since the appropriate interactions require analyzing overlapping color channels. This process requires manual review by scientists with PhDs who visually inspect these images and apply rules from their defect book to identify appropriate cells. The manual visual inspection is fairly accurate in the beginning of an experiment. However, the review process would slow over time due to human fatigue and concern for cell health. Since the team works with live cells, they have limited inspection time. Often the team would cut the inspection short due to time limitations."
author = "LandingAI"
year_published = 2023
year_updated = 2025
