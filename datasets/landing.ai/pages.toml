title = "LandingLens Demo with Benchmarks | Retinopathy of Prematurity - LandingAI"
description = "This video demonstrates how to use LandingLens to train a computer vision model for a multiclass classification project using an open-access retinopathy of prematurity dataset. It covers the end-to-end process, including data preparation, model training with custom augmentations, performance evaluation, and deploying the model for API-based inference. LandingLens achieves a F1 score of 92 on […]"
full_description = '<iframe title="LandingLens Demo with Benchmarks | Retinopathy of Prematurity | Computer Vision Classification" width="1080" height="608" src="https://www.youtube.com/embed/VdKMtaXacmA?feature=oembed" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> This video demonstrates how to use LandingLens to train a computer vision model for a multiclass classification project using an open-access retinopathy of prematurity dataset. It covers the end-to-end process, including data preparation, model training with custom augmentations, performance evaluation, and deploying the model for API-based inference. LandingLens achieves a F1 score of 92 on the test set as compared to 83 published by the original authors that provided the data.Original paper with links to download the dataset: https://www.nature.com/articles/s41597-024-03362-5 Citation:Zhao, X., Chen, S., Zhang, S. et al. A fundus image dataset for intelligent retinopathy of prematurity system. Sci Data 11, 543 (2024). https://www.nature.com/articles/s41597-024-03362-5 LandingAI’s cutting-edge software platform makes computer vision easy for a wide range of applications across all industries <img width="24" height="24" decoding="async" class="mega-menu-img" style="margin-right: 8px; vertical-align: middle;" src="/wp-content/uploads/2023/02/icon_automotive.svg" />Automotive <img width="24" height="24" decoding="async" class="mega-menu-img" style="margin-right: 8px; vertical-align: middle;" src="https://landing.ai/wp-content/uploads/2023/02/icon_energy.svg" />Electronics <img width="24" height="24" decoding="async" src="/wp-content/uploads/2023/02/icon_food.svg" style="margin-right: 8px; vertical-align: middle;" class="mega-menu-img"/>Food & Beverage <img width="24" height="24" decoding="async" src="/wp-content/uploads/2023/04/medical-imagery-icon.svg" style="margin-right