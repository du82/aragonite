["https://landing.ai/blog/unlocking-landingais-computer-vision-capabilities-on-snowflake"]
title = "Unlock LandingAI's Computer Vision Capabilities on Snowflake"
description = "Explore LandingAI’s integration with Snowflake to access advanced visual AI and computer vision tools. See how LandingLens transforms data processing."
full_description = 'Leverage LandingAI’s visual AI platform to process images and videos at scale, all within the secure, governed boundary of the Snowflake Data Cloud. <img decoding="async" class="size-large wp-image-25834175 aligncenter" src="https://landing.ai/wp-content/uploads/2024/06/image-1024x707.png" alt="" width="70%" srcset="https://landing.ai/wp-content/uploads/2024/06/image-1024x707.png 1024w, https://landing.ai/wp-content/uploads/2024/06/image-980x677.png 980w, https://landing.ai/wp-content/uploads/2024/06/image-480x332.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1024px, 100vw" /> LandingAI announced the most sophisticated Native App during the Snowflake Data Cloud Summit 24, available now in the Snowflake Marketplace — it is the very first (Visual AI) Native App that is fully hosted on Snowpark Container Services. By offering LandingLens as a Native App, Snowflake and LandingAI have deepened their partnership and boosted Visual AI in the Data Cloud. Customers will now have the ability to leverage powerful Snowflake compute with configurable GPU resources to train deep learning, visual AI models directly in their Snowflake environment using LandingAI’s flagship product, LandingLens, with no data ever leaving the platform. Let’s walk through a typical visual AI workflow in LandingLens. As a real-world example, we’ll train a visual AI model to classify histopathology images to determine if they are: Normal, Benign, or Invasive. Models like this can augment medical professionals’ ability to detect and diagnose with more accuracy and consistency. <img decoding="async" class="size-large wp-image-25834193 aligncenter" src="https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m.png" alt="" width="70%" srcset="https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m.png 1288w, https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m-300x116.png 300w, https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m-1024x394.png 1024w, https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m-768x296.png 768w, https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m-1080x416.png 1080w, https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m-1280x493.png 1280w, https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m-980x377.png 980w, https://landing.ai/wp-content/uploads/2024/06/Captura-de-pantalla-2024-06-03-a-las-4.03.16 p.m-480x185.png 480w" sizes="(max-width: 1288px) 100vw, 1288px" />'
