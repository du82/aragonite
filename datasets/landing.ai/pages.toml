["https://landing.ai/tech-brief/how-to-integrate-deep-learning-into-existing-platforms"]
title = "Deep Learning Integration: Integrate into Existing Platforms"
description = "Explore Landing AI’s tech brief on integrating deep learning into existing platforms, enhancing efficiency and capability. Learn more online today!"
full_description = "For decades, industrial automation and machine vision have helped manufacturers improve process control and product quality. Both technologies aim to remove human error and subjectivity with tightly controlled processes based on well-defined, quantifiable parameters. MV has become an essential tool for improving manufacturing productivity and throughput, while reducing waste and driving revenue growth. MV includes technology and methods to extract information from an image. It’s a mature segment of the industrial automation landscape that substitutes human visual sense with a camera and computer to perform inspection and many other tasks such as guidance, localization, counting, gauging, measurement, and identification. In contrast, deep learning (DL) is relatively new on the scene, having over the last 5–10 years become a useful machine learning (ML) tool that can be applied in MV system implementation and integration in the industrial automation environment. Before delving into the key factors that must be considered when deploying DL in existing MV applications, it is important to understand the difference not only between MV and DL but also artificial intelligence (AI) and computer vision (CV). Some would argue that the term “artificial intelligence” has been widely misused in the industrial automation environment, especially as it relates to MV. AI really is a science. John McCarthy, who coined the term back in the 1950s, noted that AI is the science and engineering of making intelligent machines. However, the term is often erroneously used in today’s MV marketplace as a substitute for describing the execution of an AI technique called DL. AI encompasses ML and DL. ML encompasses DL, and CV encompasses MV. While CV is a science, some use the term to describe DL/AI techniques for object classification, which helps computers to “see” perceptively, in a way that mimics humans and the learning process. However, the science and academic part of CV include much more than that. Historically, MV is a subset of CV and AI, with its practical implementation mostly focused on industrial automation."
author = "LandingAI"
year_published = 2023
year_updated = 2024
