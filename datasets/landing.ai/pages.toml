["https://landing.ai/blog/enhance-shelf-share-calculation-in-retail-stores-using-ai-powered-computer-vision"]
title = "AI-Powered Computer Vision Enhances Retail Shelf Share Calculation"
description = "Discover how AI-powered computer vision can enhance shelf share calculation in retail stores. Leverage the benefits of AI and computer vision in retail."
full_description = "In the retail industry, a frequent issue is how products are positioned on store shelves. Each store must adhere to contractual agreements that mandate a specific percentage of certain brands to be displayed. To address this challenge, certain companies focus on manually counting products to determine the share of different brands on supermarket shelves. This process often involves monitoring prices, identifying missing items, and more. In this article, we delve into the benefits of LandingLens, a cloud-based computer vision platform developed by LandingAI. By utilizing LandingLens, Marvik.ai, a cutting-edge machine learning solution provider, streamline and enhance the shelf share calculation process, ultimately saving clients’ valuable time and resources. A product’s share refers to the percentage of the number of products displayed on a shelf that belong to the product in question. In order to calculate the share, it is necessary to have a series of images showing the region of interest (the entire shelf) and then, for each image, count each particular product, avoiding duplicates due to overlapping images, to then determine the share of each brand and its products. The following figure shows an example to illustrate the problem. One of the main difficulties of this problem is the scalability of the solution. The more different products there are, the greater the likelihood of errors and the more tedious the manual work becomes. Suppose you are one of the people that calculates the share, and you start with one type of product (e.g. toothpaste). In the beginning, you are slowly identifying all the different products, and get overwhelmed. Once you work with ten, or twenty different shelves, it gets easier to identify different brands and products, and now you become an expert in recognizing all the different products for each brand. Although it took you some time, you are now able to detect all the different brands displayed on the shelves with low effort. When a new product of the same category comes on the market, it is not difficult to learn to recognize it very quickly."
author = "Marvik and Landing AI"
