["https://landing.ai/blog/charting-new-horizons-landingai-welcomes-ceo-dan-maloney-to-spearhead-next-era-of-innovation"]
title = "New Horizions at LandingAI: Andrew Ng Welcomes CEO Dan Maloney"
description = "LandingAI announces a new chapter as Dan Maloney steps into the CEO role. Learn how his leadership, alongside Andrew Ng, will shape the company's future."
full_description = "I am thrilled to announce that Dan Maloney is becoming the Chief Executive Officer (CEO) of LandingAI, and I will step into the company’s Executive Chairman role. Since Dan joined two years ago as the company’s Chief Operating Officer (COO), his leadership across the company has been instrumental to LandingAI serving more customers and better than ever. Dan played an integral role in all of our key initiatives, including the launch of our self-service offering with LandingLens available for any vision application builder to use, establishing dozens of strategic and channel partnerships, increasing our focus on serving developers, and improving our operational excellence; even as we continue to innovate on Visual AI technology. Our products now serve customers in manufacturing, life sciences, consumer products, retail, media and entertainment, geospatial imagery, infrastructure, and other industry sectors. I’ve been delighted at the creativity and utility of many of these applications, which range from inspecting semiconductors to estimating the value of art! Today, users can use LandingLens to build Visual AI solutions faster than ever, and we continue to innovate with offerings such as Domain-Specific Large Vision Models and an open-source VisionAgent that writes code for your Visual AI tasks. We’re expanding our ecosystem integration, partnering with Snowflake and other industry leaders to seamlessly deliver our cutting-edge tools directly to customers’ existing data environments. Generative AI has already revolutionized text data processing – and through that, changed the world. We are now in the early phases of a revolution in visual data processing, which will be just as impactful. In numerous companies, a lot of image and video data is either not collected, discarded shortly after collection, or stored without creating much value. But as better Visual AI technology becomes available to create meaning from this data, this will change. In my ongoing role as Executive Chairman, I will continue to help drive the company’s Visual AI deep tech, while also partnering with Dan and the executive team on the company’s strategy and key decisions."
