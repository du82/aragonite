title = "Python Tutorial: Playing Card Detection & Suits Recognition (SDK)"
description = "Learn how to detect suits in playing cards using Python. This tutorial covers playing card detection and card recognition, with code examples in our SDK."
full_description = "LandingAI offers code samples in our software development kit (SDK) to help you learn how to effectively deploy computer vision Models you’ve built in LandingLens. This tutorial explains how to use the Python Detect Suits in Poker Cards sample in the SDK to run an application that detects suits in playing cards. In this tutorial, you will use a web camera to take images of playing cards for suit recognition. An Object Detection Model developed in LandingLens (and hosted by LandingAI) will then run inference on your images. This example is run in a Jupyter Notebook, but you can use any application that is compatible with Jupyter Notebooks. Clone the LandingAI Python repository from GitHub to your computer. This will allow you to later open the webcam-collab-notebook Jupyter Notebook, which is in the repository. Tip: You can use other methods to clone repositories. For more information, check out the GitHub documentation. Tip: Don’t like the photo? You can replace it by running the Acquire Image from Camera code cell again. Running the Run the Object Detection Model on LandingLens Cloud code cell initiates the Model in LandingLens to run inference on your image. Then, when you run the Visualize Results code cell, an image displays below the cell. This is your original image, with the predictions from the LandingLens Model overlaid on top. The prediction includes the bounding box, the name (Class) of the object detected, and the Confidence Score of the prediction. Run the next code cell, which is Process Results to Count the Number of Suits. When you run this code, the application counts how many objects were detected that had a confidence score higher than 50%. The count displays below the code cell. For example, in the screenshot below, the application counted four Diamonds that met the threshold criteria. Congrats! You have now successfully run a LandingLens Model and made predictions! You can now customize the code cells to create your own application! LandingAI’s cutting-edge software platform makes computer vision easy for a wide range of applications across all industries"
