["https://landing.ai/blog/build-your-custom-computer-vision-app-with-python-library"]
title = "Build a Custom Computer Vision App Using Python - Tutorial"
description = "Learn to build a custom computer vision app with Python in this tutorial. Discover how to deploy a model & use the LandingAI-Python library to predict images."
full_description = 'In this tutorial, you will learn how to build a simple “Open Door Detector” app with the computer vision platform, LandingLens. You will then learn how to deploy it to the cloud and use the landingai-python library to predict new images from your terminal. If you use Zoom—or any other video conferencing tool—this custom computer vision software model could be used to automatically detect if you left your door open in the background! First, let’s start off by creating a new Object Detection Project in LandingLens and using the webcam to upload some pictures. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Captura-de-pantalla-2023-06-26-a-las-12.22.34.png" width="100%" /> After you open the Upload pop-up window, you can click the blue circular icon to take a picture. Take a few photos with your door open, and a few with the door closed. LandingLens requires at least 10 labeled images to train a model, so make sure you get at least 10 photos. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Screenshot2023-06-26-a-las-12.23.33.png" width="100%" /> Then create a Class and name it “Open Door”. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Captura-de-pantalla-2023-06-26-a-las-12.25.01.png" width="100%" /> Use the labeling tool (bounding box) to label the door when it’s open. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Captura-de-pantalla-2023-06-26-a-las-12.26.24.png" width="100%" /> Once you’re done, click the Train button in the upper right corner. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Captura-de-pantalla-2023-06-26-a-las-12.27.20.png" width="60%" /> Once the model is done training, click the Save button in the Models panel. You can name it something like “My Model”. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Captura-de-pantalla-2023-06-26-a-las-12.28.12.png" width="100%" /> To deploy the model, click the Deploy button in the Models panel. A pop-up window opens, prompting you select either Cloud Deployment or Edge Deployment. Keep Cloud Deployment selected and click the plus sign at the bottom of the pop-up window to create an endpoint. An endpoint is the virtual location where the model will run inference. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Captura-de-pantalla-2023-06-26-a-las-12.29.07.png" width="100%" /> Now make sure My Model is selected and click Deploy to deploy the model to that endpoint. <img decoding="async" class="aligncenter" style="border: 1px solid #CCCCCC;" src="https://landing.ai/wp-content/uploads/2023/06/Captura-de-pantalla-2023-06-26-a-las-12.32.09.png" width="50%" /> Congratulations! You’ve deployed your first model.'
author = "Dillon Laird"
