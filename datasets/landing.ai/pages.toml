["https://landing.ai/blog/automotive-door-panel-assembly-inspection-using-x-ray-image"]
title = "X-Ray Automotive Assembly Inspection Improved with LandingAI"
description = "Learn how the LandingLens platform transformed an X-ray automotive inspection process, achieving 99.7% accuracy & significantly reducing inspection times."
full_description = 'Efficiency and accuracy are crucial factors in the automotive manufacturing industry, and this globally renowned automotive company (manufacturer) stands at the forefront of the sector delivering unrivaled quality and innovation, recognizing the need for automation in their manual inspection of their vehicle doors. To address this challenge, they sought the expertise of FPT, a global IT consulting and service provider, and a LandingAI Platinum Partner. FPT and LandingAI collaborated to implement a game-changing computer vision solution that improved accuracy from 50% to 99.7% and cut down their automotive inspection time from 3 minutes to 3 seconds.Explore how LandingLens, the cloud-based computer vision platform from LandingAI, can optimize your manufacturing process, saving you time and money. The manufacturer was facing a few challenges with inspecting screws inside vehicle doors. Screws could potentially be installed in the wrong position, cross-threaded, or missing altogether. Additionally, these screws were installed inside the vehicle door, so operators viewed X-ray scans of each door. Despite human inspectors dedicating up to 3 minutes per door inspection, manual inspections only yielded 50% to 60% accuracy. They recognized the need for a more efficient and reliable solution. FPT, in collaboration with LandingAI, implemented a cutting-edge computer vision solution to the production line. By utilizing the LandingLens platform, FPT uploaded X-ray images of both correctly and incorrectly installed screws. The team then labeled the X-ray automotive images, distinguishing them as either “Good” or “Not Good” using a Classification Project in LandingLens. The computer vision model was trained on this labeled dataset, fine-tuned as necessary, and finally deployed. <img decoding="async" class="size-medium wp-image-10817 aligncenter" src="https://landing.ai/wp-content/uploads/2023/11/IMG_2479-1-1.webp" alt="" width="60%" /> The implementation of LandingLens delivered exceptional outcomes for the manufacturer. The system now provides operators with a clear “OK” or “NG” (“Not Good”) output, achieving an impressive accuracy rate of 99.7% within a rapid inspection time of 2-3 seconds per door.By automating the automotive assembly inspection process, they significantly reduced the number of escaped defective door parts. This proactive approach eliminated the need for costly quarantine measures and reactive reinspection, resulting in annual savings exceeding $200,000. Moreover, the LandingLens solution effectively mitigated door recalls and potential safety risks, preserving the reputation of the manufacturer’s brand.'
