s://landing.ai/wp-content/uploads/2024/05/grayish-check.svg"> FAQs What are credits? Credits are a form of currency on the LandingLens platform and can be used for training a model or running inferences (for example, through the Predict functionality).In the free plan, there is a 1000 maximum credit usage each month. In the Visionary plan, there are 5000 credits included in the monthly subscription; any additional credit usage will be charged at $0.01/credit. There is a maximum 500,000 credit usage per month on the Visionary plan. Learn More What can I spend my credits on? Credits can be used for training models or making predictions. A credit is equal to 1 image trained or 1 image inferenced (used for prediction). For example, with a 1000 credit package you can: Train a project with 200 images. This will cost 200 credits and leave you with a remaining balance of 800 credits. Test 10 images using the Predict function by dragging and dropping images into the Predict window. This will cost 10 credits and the remaining balance will be 790. Deploy the model to a cloud endpoint and begin sending images to the API endpoint. Each image sent to the endpoint will cost 1 credit. For Custom Training, changes in the settings will impact the cost of each image trained and inferences. What if I go over my allotted credits? In the free plan, you will not be able to run a training or inference once you reach the 1000 credit limit. In the Visionary plan, you will be charged in arrears for any credits used over the monthly 5000 credits included in your $50/month subscription. Credits used beyond the 5000 credits will be charged at $0.01/credit. Do credits rollover at the end of the billing cycle? Credits do not rollover each month for the free plan or the Visionary plan. What's the difference between commercial and noncommercial use? “Noncommercial” means not primarily intended for or directed towards commercial advantage or monetary compensation. What is an Active Project Download and how does it work? Active Project Downloads – when purchased, a project in LandingLens allows a user to download models for use with LandingEdge, Docker (container-deploy) or alternative deployment options As provided in an Order Form, an organization can be allocated a number of active projects eligible for download during the subscription period depending on their plan. “Project” is defined in LandingLens and shall mean the task of investigating a specific solution or use case resulting in a model. A Customer may fine-tune multiple versions of the model for that project. A user can then activate a project through LandingLens which will in turn unlock the feature that allows the user to download any models for an unlimited number of times in the active project in question during the subscription period. Subject to the license provisions of the Master Services Agreement or equivalent (MSA), Models downloaded pursuant to an Enterprise MSA may be used by the subscriber for Customer’s commercial purposes. Once activated, each project is deducted from the available number of active projects purchased. If a project is deactivated during the subscription period, then that project will not be automatically reactivated upon renewal of the subscription and the deactivated project will not count against the active projects available in the subsequent, renewed subscription period.'''
