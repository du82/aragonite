["https://landing.ai/cookie-policy"]
title = "Cookie Policy - LandingAI"
full_description = "Cookie Policy We use cookies and other technologies to make our website work, help us improve services and the user experience or to advertise. In visiting our site, you consent to the use of these cookies and other technologies. Our website uses these kinds of cookies: Session cookies: These cookies are used to retain information for the duration of your visit, for example if you’re completing more than one form you only need to provide your information once. LandingAI tracking cookie: These cookies are used to recognize repeat visitors to the site and record specific browsing information (e.g. how you arrive, pages you view, options you select, information you enter and paths you take). Google Analytics Cookies: LandingAI uses Google Analytics cookies to store information, such as what time a visit occurred, whether the visitor has been to the site before, and what site referred the visitor to the web page. The cookies report website trends. They do not identify individual visitors. A different set of cookies is used for each website, and visitors are not tracked across multiple sites. In addition to disabling cookies users can also install the Google Analytics Opt-out Add-on, which prevents Google Analytics from collecting information about website visits. To find out more visit https://www.google.com/analytics/learn/privacy.html LinkedIn: LandingAI uses LinkedIn tags to monitor website behavior to collect and use information for online advertising, please visit: https://www.linkedin.com/legal/privacy-policy if you are a LinkedIn member and wish to opt out of this tracking, you can opt out by login in to your account and going to your Privacy settings. This will opt you out from LinkedIn data collection and targeting cookies on any computers, mobile devices and browsers you use to visit third party sites, provided you have logged onto LinkedIn. To opt out: You can block or delete cookies by changing your browser settings – please refer to your browser’s ‘help’ functionality for advice, or to find out more you can visit https://www.allaboutcookies.org/manage-cookies/index.html. Please note that should you block all cookies, you may not be able to access all areas of our site. If you block our cookie, your use of our site during a session should not be adversely affected."
