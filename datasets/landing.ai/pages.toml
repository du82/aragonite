["https://landing.ai/blog/develop-a-real-time-computer-vision-application-utilizing-live-cams"]
title = "Real-Time Computer Vision Application Utilizing Live Cams"
description = "This tutorial shows you how to develop a real-time computer vision application that counts the number of surfers at a surf spot via a live stream surf cam."
full_description = 'This tutorial shows you how to use LandingLens to build a machine learning model that counts the number of surfers at a surf spot via a live stream surf cam. If you’re a surfer, this helps you find out how crowded a particular spot is so you can avoid the crowd! We’ll use the landingai-python library to run a deployed model on the live stream to get real time updates. <img decoding="async" class="aligncenter" style="border: 2px solid #A9A9A9; padding: 1px;" src="https://landing.ai/wp-content/uploads/2023/07/Captura-de-pantalla-2023-07-20-a-las-9.49.39.png" width="60%" /> We want to download frames from the video stream so we can label them for training a model. This is easy to do with the landingai-python library! Just pass the video stream playlist file (the URL is provided in the code below, to find out more about the playlist files check this website out), and save the frames. And that’s it! If you are interested, you can easily save a video file instead of frames as well by calling the following method on your FrameSet There are several different zooms, the more zoomed out image is more difficult to see the surfers so make sure to capture images from several zoom levels. <img decoding="async" class="aligncenter" style="border: 2px solid #A9A9A9; padding: 1px;" src="https://landing.ai/wp-content/uploads/2023/07/Captura-de-pantalla-2023-07-20-a-las-9.56.24.png" width="60%" /> <img decoding="async" class="aligncenter" style="border: 2px solid #A9A9A9; padding: 1px;" src="https://landing.ai/wp-content/uploads/2023/07/Captura-de-pantalla-2023-07-20-a-las-9.57.34.png" width="60%" /> The surfers are fairly small in the image, if you cannot tell if it’s a surfer just don’t label it for now to avoid confusing the model. Later on we will average the surfer count from many predictions to get a more accurate estimate. <img decoding="async" class="aligncenter" style="border: 2px solid #A9A9A9; padding: 1px;" src="https://landing.ai/wp-content/uploads/2023/07/Captura-de-pantalla-2023-07-20-a-las-9.58.28.png" width="60%" /> Once you’ve labeled about 10, hit the train button! On our first run you can see we don’t get great performance:'
