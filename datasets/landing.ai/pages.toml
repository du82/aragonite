title = "COMMUNITY PARTICIPATION TERMS OF USE & CODE OF CONDUCT - LandingAI"
full_description = "COMMUNITY PARTICIPATION TERMS OF USE & CODE OF CONDUCT GeneralThe LandingAI Community (the “Community”) is an online community comprised of blogs, discussion forums, document and information sharing about LandingAI’s computer vision cloud services and technology provided by Landing AI, Inc. and its subsidiaries (“LandingAI”). The purpose of the Community is to provide a forum for interested users of LandingAI’s computer vision cloud services and related technology, as well as for participants in LandingAI programs and user groups to exchange information and to generally build enthusiasm for LandingAI’s computer vision cloud services. User’s Acceptance of Terms of UseThese Community Participation Terms of Use (“Terms of Use”) shall govern your access, visits and participation in the Community. These Community Participation Terms of Use are in addition to (and form a part of) the LandingAI Website Terms of Use. By registering for a Community account, by using or visiting the Community, you are subject to these Community Participation Terms of Use. If you are participating in the Community on behalf of an entity, organization, or company, you represent and warrant that you have the authority to bind that entity, organization, or company to these Terms and that you agree on behalf of that entity, organization, or company to be bound by these Terms. If you do not agree to all of the Terms of Use, you should not access, visit or participate in the Community. LandingAI reserves the right to modify, suspend or terminate the Community and/or these Community Participation Terms of Use from time to time at its sole discretion and without notice. LandingAI reserves the right to refuse access to the Community to anyone, at any time, without notice, and for any reason. The Community is provided on an AS IS and AS AVAILABLE basis. LandingAI will not be liable to you or any third party for any claims or actions arising or resulting from your use, visit, or participation in the Community and for any modification, suspension, or termination of the Community, or termination of your access to the Community. Some participants may post Internet website links in the Community forum. LandingAI is not responsible for the content on the websites associated with these links. In addition, LandingAI reminds you that some content and links on the Internet may contain inappropriate material, such as malware or adult content that is not suitable for children or may be offensive to some users. Participation in this Community.To participate in the LandingAI Community, you must: Agree to these Terms, and you hereby represent and warrant to us that: you are at least 18 years of age; you have not previously been suspended or removed from our Community; and your registration and your use of the Community complies with all applicable laws and regulations. Agree that you will be responsible for all activity that occurs under your access credentials, including anything you contribute. Provide current, accurate, and complete information about yourself during the account registration process. Use reasonable efforts to prevent unauthorized access to or use of the Community and to preserve the confidentiality of your username or email address and password, and any device that you use to access the Community. You are solely responsible for maintaining the confidentiality of your password. Keep your LandingAI Community account information up to date, accurate and complete. Consent to the collection, processing and storage by LandingAI of your personal information in accordance with the terms of LandingAI’s Privacy Policy. Community GuidelinesWe have a few community guidelines that we ask people to adhere to. When the guidelines are unclear, we expect the spirit of the guidelines to be followed. Be considerate. Your work will be used by other people, and you in turn will depend on the work of others. Any decision you take will affect users and colleagues, and you should take those consequences into account when making decisions. Be patient. This mostly applies to forums, mailing lists, and code contributions (i.e. asynchronous forms of communication). Communities are often built on volunteer time both from participants and organizers. It is possible that your question or code contribution or suggestion might not receive an immediate response. Be patient and consider the norms of the community. One reminder ping is welcome, many reminder pings in rapid succession are not a good display of patience. Similarly, posting the same question in multiple threads is frowned upon and should not be done. Be respectful. Not all of us will agree all the time, but disagreement is no excuse for poor behavior and poor manners. We might all experience some frustration now and then, but we cannot allow that frustration to turn into a personal attack. It’s important to remember that a community where people feel uncomfortable or threatened is not a productive one. We expect members of the LandingAI community to be respectful when communicating with other community members, as well as with people outside the LandingAI community. Be nice. Please be courteous, respectful and polite to fellow community members. Communicate effectively. Clear communication can help to avoid misunderstandings. Remember that words and phrases can be interpreted differently depending on people’s backgrounds. It’s better to ask for clarification than to make assumptions. Disagreements, social and technical, are normal, but we expect participants in the Community to resolve disagreements constructively. Please avoid flame wars, trolling, personal attacks, and repetitive arguments. Ask for help when unsure. Nobody is expected to be perfect in this community. Asking questions early avoids many problems later, so questions are encouraged, though they may be directed to the appropriate forum. Those who are asked should be responsive and helpful. ConductYou must abide by the following rules of conduct and you explicitly agree not to, and not to permit any third party to: use the Community for any purpose that is unlawful or prohibited by these Terms of Use; intentionally submit or transmit inaccurate information through the Community; impersonate or pretend to be anyone else while using the Community; use the Community in any way that could damage, disable, overburden, or impair any of the Community, or interfere with anyone else’s use of any of the Community; attempt to gain unauthorized access to LandingAI services, through hacking, password mining or any other means; attempt to reverse engineer any portion of any of LandingAI’s services or technology or attempt to infringe the intellectual property rights of others in any way; obtain or attempt to obtain any materials or information through any means not intentionally made available through the Community; attempt to circumvent any content-filtering techniques we employ or attempt to access any feature or area of our Community or services that you are not authorized to access; introduce any malicious or technologically harmful material into the Community or post any computer programs that contain destructive features, such as viruses, worms or Trojan horses. Do not employ any type of bots for the use of scrolling, showing multiple screens, or other activities that might disrupt online communication. develop or use any third-party applications that interact with our Community without our prior written consent, including any scripts designed to scrape or extract data from our Community; and post, publish, or distribute any defamatory, obscene, infringing or other unlawful material or information in the Community including any offensive language. engage in personal attacks or any type of “flaming” of other users. Do not “troll,” i.e., post topics or opinions that are designed to provoke a negative response from one or more specific users. engage in disruptive activity in the Community, including persistent off-topic contributions or comments, or statements that might incite other users to violate these guidelines or participate in illegal activities. contribute content that contains photos, software or other material protected by intellectual property laws, rights of privacy or publicity, or any other applicable law unless you own or have rights to these materials. misrepresent the source of anything you contribute. attempt to gain unauthorized access to any portion of the LandingAI Website or LandingAI services, whether through hacking, password mining, or any other means. LandingAI reserves the right to remove at any time, without notice, any contribution that violates these guidelines. LandingAI also reserves the right at any time, without notice, to ban a user who has violated these rules of conduct from any or all Community forums. Third Party Content. The Community may contain links to or from third-party websites. LandingAI has no control over the content or privacy policies of third-party websites that you may link to from the Community or their advertisers. If you visit a linked website, be aware that the third party operating any such website may have access to any information you submit via that website. LandingAI is not responsible for any third party’s failure to establish or abide by its or our Privacy Policy. Check the privacy policy for each website that you visit prior to submitting any personal information. Links to third-party websites do not imply endorsement of the websites by LandingAI. User Content Companies — Your Content: If you are using the Community on behalf of a company, you may be able to upload, post, or otherwise submit (“Submit”) content. LandingAI claims no ownership of your company content. You or your third-party licensor, as applicable, retain all copyright, patent, and trademark rights to any company content that you post on or through the Community. Messages: The Community may allow Users to send me