["https://landing.ai/blog/ai-in-latin-america"]
title = "AI Hub in Latin America: First International Office in Colombia"
description = "Exciting news! Colombia is poised to become an AI hub and our Medellín office is set to be the Latin American headquarters for 3 companies in our AI ecosystem."
full_description = "We are excited to announce the opening of our office in Medellín, Colombia. The office will serve as the Latin American headquarters for three of the companies in our AI ecosystem: LandingAI, deeplearning.ai, and AI Fund. We will continue to expand the office as new companies are created within the ecosystem. Colombia is on a trajectory to become a hub of AI in Latin America. AI is still in its infancy. Although Silicon Valley and Beijing are currently leading the way in AI, with the UK and Canada also emerging as innovation hubs, there are still opportunities for every major country. Colombia has been making smart moves building up its tech ecosystem. For example, earlier this month, the Colombian Ministry of IT and Communications launched a program to train 4,413 students in machine learning, Python, deep learning and other AI subjects. The World Economic Forum has also opened its first Latin American Centre for the Fourth Industrial Revolution in Medellín to identify and update public policies for AI and other emerging technologies. We are proud to bet on Colombia and support the growth of the Colombian and the broader Latin American AI community. We are able to share our AI ecosystem and Silicon Valley know-how with Medellín; we’re equally thrilled for our Silicon Valley team to be learning from the Medellín community. Local knowledge and innovation shared with a global community is what will catapult the technology forward. Our Colombian office has been operating for a year and is already 40 employees strong. We’re attracting great talent from all around the world — we just hired team members from Poland, Egypt, Bangladesh, and Chile! They’re working on projects across all of our organizations: LandingAI is collaborating with organizations worldwide, empowering companies to jumpstart AI and realize practical value. Working with manufacturing partners in Latin America, LandingAI is using computer vision technology to enhance operations and drive real business results."
author = "LandingAI"
year_published = 2019
year_updated = 2023
