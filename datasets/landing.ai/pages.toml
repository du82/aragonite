full_description = '<iframe title="Andrew Ng On AI Agentic Workflows And Their Potential For Driving AI Progress" width="1080" height="608" src="https://www.youtube.com/embed/q1XFm21I-VQ?start=333&#038;feature=oembed" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> In this Luminary Talk given during Dev Day at Snowflake Summit 2024, Landing AI Founder and CEO Andrew Ng talks about AI agentic workflows and how they could drive more AI progress than even the next generation of foundation models. He describes major agentic workflow design patterns — such as reflection, tool use, planning, and multi-agent collaboration — and why they’re a powerful tool for developing LLM-based applications. Introductory remarks are offered by Snowflake CEO Sridhar Ramaswamy. LandingAI’s cutting-edge software platform makes computer vision easy for a wide range of applications across all industries <img width="24" height="24" decoding="async" class="mega-menu-img" style="margin-right: 8px; vertical-align: middle;" src="/wp-content/uploads/2023/02/icon_automotive.svg" />Automotive <img width="24" height="24" decoding="async" class="mega-menu-img" style="margin-right: 8px; vertical-align: middle;" src="https://landing.ai/wp-content/uploads/2023/02/icon_energy.svg" />Electronics <img width="24" height="24" decoding="async" src="/wp-content/uploads/2023/02/icon_food.svg" style="margin-right: 8px; vertical-align: middle;" class="mega-menu-img"/>Food & Beverage <img width="24" height="24" decoding="async" src="/wp-content/uploads/2023/04/medical-imagery-icon.svg" style="margin-right: 8px; vertical-align: middle;" class="mega-menu-img" />Medical Devices <img width="24" height="24" decoding="async" src="/wp-content/uploads/2023/04/medical-devices.svg" style="margin-right: 8px; vertical-align: middle;" class="mega-menu-img"/>Life Sciences <img width="15" height="1