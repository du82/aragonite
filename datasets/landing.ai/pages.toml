["https://landing.ai/about-us"]
title = "About Landing AI: Andrew Ng's Leading AI Company"
description = "Landing AI, founded by Andrew Ng, is a leading AI company dedicated to transforming industries with cutting-edge technology and innovation. Learn all about us."
full_description = 'About Us LandingAI helps companies across all industries take advantage of their vast set of vision data to build, deploy and scale Visual AI solutions. Our Founding Story LandingAI™ delivers cutting-edge Visual AI solutions that empower customers to unlock the value of visual data. With visual data sets, companies realize the value of AI and move AI projects from proof-of-concept to production. Guided by a data-centric AI approach, LandingAI’s flagship product, LandingLens™, is a Visual AI platform that enables users to build, iterate, and deploy Visual AI solutions quickly and easily. With data quality being key to the success of production AI systems, LandingLens™ allows users to achieve optimal data accuracy and consistency. Additionally, LandingAI is a pioneer in the field of domain-specific Large Vision Models (LVMs) and Large Multimodal Models (LMM), which enhance the ability to process and understand visual data at scale, making sophisticated Visual AI tools more accessible and efficient. Founded by Andrew Ng, co-founder of Coursera, founding lead of Google Brain, and former chief scientist at Baidu, LandingAI is uniquely positioned to lead the development of AI that benefits all. <img decoding="async" src="https://landing.ai/wp-content/uploads/2022/10/img_team_culture.png" width="418" height="464" alt="Image of LandingAI team" class="wp-image-6344 aligncenter size-full" /> Team Culture We are a diverse team of passionate visionaries who are dedicated to democratizing the power of AI. We are inspired by the promise of the next generation of AI in shaping the way we live, work, and play. Our culture is fast-paced, collaborative, and constantly learning. Our work environment is open so our teams feel the freedom to identify the best solutions to the many questions that most are not asking. LandingAI Principles LandingAI Principles (LAPs) are a codification of our way of work. Similar to our DNA, these principles guide us in our work and provide us with a framework for our decision making – be it customer engagement, product development, hiring and talent management, business operations, or sales & support. These principles are intended to align our thought process as leaders of the organization and influence our way of working with people and teams across locations and with businesses. <img decoding="async" width="124" height="104" src="https://landing.ai/wp-content/uploads/2019/06/Focus-Icon.png" alt="" title="Focus-Icon" class="wp-image-1345" /> Focus on customers We start with the customer and work backwards to earn and preserve customer trust. While we pay attention to competitors and listen to our advisors, our sole focus is to make our customers successful. <img decoding="async" width="149" height="91" src="https://landing.ai/wp-content/uploads/2019/06/Run-Icon.png" alt="" title="Run-Icon" class="wp-image-1355" /> Move Fast We believe in our work’s ability to change human lives. Because the cost of indecisioncan be more than the cost of a wrong decision, we emphasize high-speed decision making and execution while insisting on the highest standards. <img decoding="async" width="115" height="108" src="https://landing.ai/wp-content/uploads/2019/06/Diver.png" alt="" title="Diver" class="wp-image-1353" /> Dive deep We dive deep to understand the problem, enforce accountability, and drive clarity. We are flexible in using our skills to do whatever it takes to achieve our goal and no task is beneath us. <img decoding="async" width="109" height="108" src="https://landing.ai/wp-content/uploads/2019/06/Grit-Icon.png" alt="" title="Grit-Icon" class="wp-image-1354" /> Have grit We exhibit firmness of character and indomitable spirit when faced with challenges. We consistently back ourselves and inspire our teams to power through the low moments. <img decoding="async" width="129" height="97" src="https://landing.ai/wp-content/uploads/2019/06/Shaking-Hands.png" alt="" title="Shaking-Hands" class="wp-image-1356" /> Earn trust We build an environment of trust. We hyperfocus on inclusiveness, honest and direct communication, ownership, and being vocally self-critical. We care and watch out for each other. We’re humble individually and proud together. <img decoding="async" width="97" height="111" src="https://landing.ai/wp-content/uploads/2019/06/Bear.png" alt="" title="Bear" class="wp-image-1352" /> Stay hungry We are eager to solve challenging problems and acquire new skills. We understand that staying on the bleeding edge is hard work and we are committed to invest in our continual development. Meet Our Leadership <img decoding="async" width="336" height="337" src="https://landing.ai/wp-content/uploads/2022/10/headshot_Andrew_Ng.png" alt="Photo of Andrew Ng" title="headshot_Andrew_Ng" srcset="https://landing.ai/wp-content/uploads/2022/10/headshot_Andrew_Ng.png 336w, https://landing.ai/wp-content/uploads/2022/10/headshot_Andrew_Ng-300x300.png 300w, https://landing.ai/wp-content/uploads/2022/10/headshot_Andrew_Ng-150x150.png 150w" sizes="(max-width: 336px) 100vw, 336px" class="wp-image-6341" /> Andrew Ng <img width="34" height="34" decoding="async" style="vertical-align: middle; margin-right: 0px;" src="https://landing.ai/wp-content/uploads/2025/01/Linkedin-About-strong.webp" />Executive Chairman and Founder <img decoding="async" width="336" height="337" src="https://landing.ai/wp-content/uploads/2022/10/headshot_Dan_Maloney.png" alt="Photo of Dan Maloney" title="headshot_Dan_Maloney" srcset="https://landing.ai/wp-content/uploads/2022/10/headshot_Dan_Maloney.png 336w, https://landing.ai/wp-content/uploads/2022/10/headshot_Dan_Maloney-300x300.png 300w, https://landing.ai/wp-content/uploads/2022/10/headshot_Dan_Maloney-150x150.png 150w" sizes="(max-width: 336px) 100vw, 336px" class="wp-image-6340" /> Dan Maloney <img decoding="async" style="vertical-align: middle; margin-right: 0px;" src="https://landing.ai/wp-content/uploads/2025/01/Linkedin-About-strong.webp&quot;" />CEO <