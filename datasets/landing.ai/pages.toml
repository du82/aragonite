["https://landing.ai/blog/automatic-defect-classification-in-wafer-fabrication"]
title = "Auto Defect Classification in Semiconductor Wafer Fabrication"
description = "Discover how LandingLens revolutionizes wafer fabrication with automatic defect classification, allowing manufacturers to maximize yield and reduce costs."
full_description = "Semiconductor and MEMS manufacturers around the world are maximizing their yield and reducing expenses through the use of LandingLens. These manufacturers empower advanced technologies and elevate everyday experiences. By implementing automatic defect classification solutions, one of leading manufacturer has achieved a remarkable labor cost reduction of at least 80% wherever these solutions are utilized. The importance of yield in the semiconductor industry cannot be overstated. It determines the number of usable chips that can be obtained from a single wafer. A high yield translates to greater profitability for manufacturers, while a low yield results in wasted resources and loss of money. As chips become more advanced and production volumes increase, yield becomes even more crucial. Even a slight improvement in yield can have a significant impact on profitability. That’s why semiconductor manufacturers invest heavily in cutting-edge wafer fabrication techniques, process control, and defect detection to enhance their yield. In this article, we explore how LandingLens, the cloud-based computer vision platform from Landing AI, can optimize your fabrication process, saving you time and money. Chip makers often use many machines across each fab to capture images of anomalies on wafers throughout the many stages of the fabrication process. However, these machines cannot accurately classify the anomalies into the correct defect categories. This defect information is crucial for yield enhancement teams to improve production yield and sometimes determine whether a chip should be discarded due to critical defects. To obtain this valuable information, manufacturers rely on a manual process where a team of inspectors in each fab reviews the images. Unfortunately, this process is slow, expensive, and prone to accuracy issues. It requires a team of twelve inspectors working in shifts around the clock to handle the volume of images from a single fab. The manufacturer was searching for an automated solution to this problem, but had yet to find a technology that met their precision requirements until they found LandingLens"
author = "Quinn Killough"
year_published = 2023
year_updated = 2025
clearnet = "https://landing.ai/blog/automatic-defect-classification-in-wafer-fabrication"
