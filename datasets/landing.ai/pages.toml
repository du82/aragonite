["https://landing.ai/blog/simplifying-object-counting-with-visionagent"]
title = "Simplifying Object Counting with VisionAgent - LandingAI"
description = "Object Counting with Visual AI has wide-ranging applications across numerous fields. In retail, automated shelf auditing systems count products to maintain optimal stock levels. In manufacturing, counting components on assembly lines ensures quality control and detects production anomalies. Medical researchers use cell counting in microscopic images for disease diagnosis and drug development. In safety and […]"
full_description = "Object Counting with Visual AI has wide-ranging applications across numerous fields. In retail, automated shelf auditing systems count products to maintain optimal stock levels. In manufacturing, counting components on assembly lines ensures quality control and detects production anomalies. Medical researchers use cell counting in microscopic images for disease diagnosis and drug development. In safety and security, counting people in crowded spaces helps manage occupancy levels and ensures compliance with safety regulations. Traditionally, object counting with computer vision has been a complex process requiring significant expertise. Developers typically collect and label extensive datasets, select and train machine learning models (often CNNs), and implement post-processing logic. This approach involves data preprocessing, model architecture design, validation, and deployment coding. The multi-step workflow makes implementing such a solution time-consuming and resource-intensive for many organizations. VisionAgent, the generative Visual AI application builder from LandingAI, makes tasks such as object counting for common objects quite simple by leveraging state-of-the-art vision language models (SOTA VLM models) and combining them with an agentic framework to generate custom code for your use case. This innovative approach kickstarts your project in minutes as compared to benchmarking different models for your use case and investing significant time and resources into adapting new models for your ecosystem. Let’s go through a practical application: inventory management for soda cans. Imagine you’re tasked with creating a system to monitor soda can inventory in a storage facility. The goal is to automate calculating the inventory percentage based on a maximum capacity of 35 cans, and determine if restocking is necessary. When approaching this Visual AI use case, it’s crucial to formulate clear, detailed instructions — just as you would for a junior software engineer. For our soda can inventory system, we want the AI model to identify and count the cans, calculate the percentage of inventory based on our full capacity of 60 cans, and provide a status indicating whether the inventory is healthy or needs restocking."
author = "Fatima Salehbhai"
year_published = 2024
year_updated = 2024
clearnet = "https://landing.ai/blog/simplifying-object-counting-with-visionagent"
