["https://landing.ai/blog/southern-california-edisons-use-of-computer-vision-and-aerial-inspections"]
title = "Southern California Edison’s Use of Computer Vision and Aerial Inspections - LandingAI"
description = "“It increases efficiency, productivity and it increases our ability to identify issues in a much faster way, so it’s very exciting. This doesn’t mean we’re not going to need inspectors, it just means that the AI and ML models identify structures with deterioration right away so they can be inspected first.” Alyssa Grigoryan, SCE principal […]"
full_description = '“It increases efficiency, productivity and it increases our ability to identify issues in a much faster way, so it’s very exciting. This doesn’t mean we’re not going to need inspectors, it just means that the AI and ML models identify structures with deterioration right away so they can be inspected first.” Southern California Edison (SCE), a major utility provider in California, faces challenges such as wildfires, aging infrastructure, and ensuring grid reliability. To mitigate these risks, SCE has adopted drone technology and artificial intelligence (AI) for aerial inspections. These technologies are transforming how SCE monitors its infrastructure, reducing the time and risks associated with traditional inspections. By pairing drones with AI, SCE identifies hazards faster, ensures rapid repairs, and protects both its workers and the public. SCE’s vast service area, spanning over 50,000 square miles, includes high-fire-risk regions where maintaining infrastructure is critical. Traditional inspection methods, like on-foot patrols and pole climbing, were slow, labor-intensive, and hazardous. SCE needed an innovative solution to address wildfire risks and aging equipment more effectively. The utility’s adoption of drones and AI streamlined inspections, enabling quicker responses to potential issues and improving safety. <img decoding="async" class="size-large wp-image-25835075 aligncenter" src="https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m-1024x530.png" alt="" width="60%" srcset="https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m-1024x530.png 1024w, https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m-300x155.png 300w, https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m-768x398.png 768w, https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m-1080x559.png 1080w, https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m-980x508.png 980w, https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m-480x249.png 480w, https://landing.ai/wp-content/uploads/2024/10/Captura-de-pantalla-2024-10-08-a-las-3.44.52 p.m.png 1108w" sizes="(max-width: 1024px) 100vw, 1024px" />'
