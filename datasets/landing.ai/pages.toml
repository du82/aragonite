["https://landing.ai/blog/create-a-cell-colony-counting-app-and-use-it-on-your-mobile"]
title = "Create a Cell Colony Counting App: Automated CFU Counter"
description = "Build and deploy a cell colony counting app in minutes, then use it on your mobile device. Get started with LandingLens for free and streamline your workflow!"
full_description = 'Counting colony-forming units (CFUs) is a common technique used in microbiology to estimate the number of viable microorganisms present in a sample. When viewed in a Petri dish, CFUs can look like small dots. To overcome these challenges, you can create an automated CFU counter using the computer vision Model in LandingLens, deploy it, and then run inference on a mobile browser. But what does this actually look like? Let’s walk through an example of how you can create and deploy a cell colony counting app in just minutes with LandingLens. Create an Object Detection in LandingLens. Don’t have LandingLens? No worries, sign up for free here! Upload a few photos of your Petri dishes that have cell colonies. For best results, use photos that match what you’ll be using in the real-world. Remember: good data in, good data out! <img decoding="async" class="aligncenter" src="https://landing.ai/wp-content/uploads/2023/06/Screen-Shot-2023-06-09-at-14.10.03.png" width="80%" /> Create a Class for the cell colonies. When you label an image, the label assigns this Class to the labeled pixels. Use the annotation tools in LandingLens to label the cell colonies. If you created an Object Detection Project, you’ll use a bounding box to draw a square around each colony. <img decoding="async" class="aligncenter" src="https://landing.ai/wp-content/uploads/2023/06/Screen-Shot-2023-06-09-at-14.10.15.png" width="70%" /> After you label all your images, click Train. During training, LandingLens takes the images and labels you provided and “teaches” your Model to detect the labeled regions. <img decoding="async" class="aligncenter" src="https://landing.ai/wp-content/uploads/2023/06/Screen-Shot-2023-06-09-at-14.10.41.png" width="40%" /> <img decoding="async" class="aligncenter" src="https://landing.ai/wp-content/uploads/2023/06/Screen-Shot-2023-06-09-at-14.10.50.png" width="80%" /> After you train your Model, you’re ready to deploy it. Deploying means you put the Model in a virtual location so that you can later send images to the Model for it to make predictions on.'
author = "Kai Yang and Bianca Ragsdale"
year_published = 2023
year_updated = 2025
