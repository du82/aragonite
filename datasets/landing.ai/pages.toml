["https://landing.ai/news/landingai-announces-general-availability-of-landinglens-as-snowflake-native-app-on-snowflake-marketplace"]
title = "LandingAI Announces General Availability of LandingLens as Snowflake Native App on Snowflake Marketplace - LandingAI"
description = "Empowering Organizations to Harness Visual AI Directly within the Snowflake AI Data Cloud  [Palo Alto, Calif.] [Nov. 12, 2024] — LandingAI, a pioneer in visual AI, today announced at Snowflake’s annual developer conference, BUILD 2024, the general availability (GA) of LandingLens, its Snowflake Native App, via Snowflake Marketplace. This major milestone marks the culmination of […]"
full_description = "[Palo Alto, Calif.] [Nov. 12, 2024] — LandingAI, a pioneer in visual AI, today announced at Snowflake’s annual developer conference, BUILD 2024, the general availability (GA) of LandingLens, its Snowflake Native App, via Snowflake Marketplace. This major milestone marks the culmination of extensive testing and refinement, enabling businesses to seamlessly integrate advanced computer vision capabilities within their existing Snowflake accounts. The LandingLens Snowflake Native App provides users with an intuitive platform to create, train, and deploy AI models for computer vision projects without the need to migrate data or compromise security. With LandingLens, organizations in sectors such as manufacturing, healthcare, and life sciences can enhance quality control processes, streamline operations, and achieve higher accuracy—all directly within the Snowflake AI Data Cloud. “We are excited to make LandingLens generally available to all Snowflake users through the Snowflake Marketplace,” said Dan Maloney, CEO at LandingAI. “This step aligns with our mission to democratize AI by embedding powerful tools into platforms where data already resides. The integration is designed to remove barriers for organizations wanting to leverage visual AI for real-world applications, simplifying deployment and accelerating innovation.” The announcement coincides with a keynote by Andrew Ng, Founder and Executive Chairman of LandingAI, at Snowflake’s annual developer conference, BUILD 2024, where he will explore the evolving role of AI agents, the power of unstructured data, and the transformative potential of integrating AI-driven technologies into various industries. His talk will underscore the increasing importance of AI tools that facilitate automation and application development. The launch of LandingLens as a Snowflake Native App exemplifies the shared vision between LandingAI and Snowflake to empower businesses with advanced tools that elevate data use and processing. By offering LandingLens on Snowflake Marketplace, LandingAI streamlines AI deployment and enables organizations to tap into the power of visual AI directly within their Snowflake environment, all while maintaining data privacy and compliance."
