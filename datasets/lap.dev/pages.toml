["https://lap.dev/floem"]
title = "Floem - Cross-platform GUI framework for Rust"
description = "Cross-platform GUI framework for Rust with performance and developer ergonomics"
full_description = '''Floem is cross-platform GUI framework for Rust 🦀. It aims to be extremely performant while providing world-class developer ergonomics. Supporting both GPU and CPU rendering, Floem gives you performance that's closest to bare metal. Also primitives are provided to help the developer to write performant UI code without too much effect. Supports Windows, macOS and Linux with rendering using wgpu. In case a GPU is unavailable, a CPU renderer powered by tiny-skia will be used. The entire library is built around reactive primitives inspired by leptos_reactive. The reactive "signals" allow you to keep your UI up-to-date with minimal effort, all while maintaining very high performance. The view tree is only run once, safeguarding you from accidentally creating a bottleneck in a view generation function that slows down your entire application. Floem also provides tools to help you write efficient UI code, such as a virtual list. Using Taffy, the library provides the Flexbox (or Grid) layout system, which can be applied to any View node. Don't want the default look? You can change pretty much anything you want using the styling API, or install a third-party theme.'''
year_published = 2025
