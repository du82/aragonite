title = "Lapce - Lightning-fast and Powerful Code Editor"
description = "Lightning-fast and Powerful Code Editor"
full_description = '''Native GUI and Rust powered performance, we as developers know what you need for an essential tool like a code editor. Write code with joy in Lapce. Native GUI with GPU acceleration in Floem, no more waiting on launching the editor, and any lag on your keystroke will be treated as a bug and get fixed. You can connect to a remote machine seamlessly, with a "local" experience, benefiting from an identical environment with your production server, or utilizing the full performance of the remote machine. We also have Lapdev which can help manage your remote dev environments. Code syntax highlighting using Tree-sitter, much faster and better than regex based highlighting. Also with built-in LSP support, to give you code intelligence like code completion, diagnostics and code actions etc. Vim users, we've got you covered! Built-in support for a Vim like editing experience, without a plugin. You can write a plugin for Lapce with any programing language that compiles to WASI. Choose a familiar language for writing a plugin without learning a new language.'''
