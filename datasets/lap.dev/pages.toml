["https://lap.dev/blog/full-stack-development-in-rust"]
title = "Full Stack Development in Rust"
description = "We used Rust for everything in Lapdev, and we'd like to talk how nice it was."
full_description = '''Lapdev consists of a few components at different layers of the stack, and we've used Rust for all the them, including web frontend, web backend, server daemon, and an SSH/HTTP proxy. You may argue that Typescript/Javascript could have been a better choice for things like web frontend since it's the dominant language there, with lots of available libraries you can pick from. But for us, Rust has been nicer for reasons that I'll talk about below. When people talk about Rust, their first impression is that Rust is a system language. You'd probably be surprised to hear me say Rust is actually a very good language for full stack development. Rust indeed came out as a system language with memory safety without a garbage collector. But being a system language doesn't prevent Rust to be shining in developing "high level" applications. With its wonderful type system, and more and more crates, Rust is fit for lots of different areas of development. The frontend uses Leptos to provide a single page web application. Signal is something we love to use as they are Copy. SeaORM is used for talking to the database. SeaORM uses sqlx under the hood which is a pure Rust implementation for different database drivers. Also, the migration bits can be written in Rust code, where normally you'd need to write the migration scripts in SQL in other ORM tools. For the RPC part, we use tarpc. We prefer tarpc over gRPC because you can define the schema in code, rather than in a separate language such as .proto. We're just trying to write everything in Rust, because you get all the goodies from the compiler and ecosystem, e.g., type checks at compile time, and auto completion from rust-analyzer etc. All the types that need to be serialised/deserialised are put in a "common" crate so that whichever part of the system needs that type can import it, and then the compiler will make sure there can't be data inconsistently anywhere in the code. And whenever you're adding/removing a field from that struct, you know for sure the compiler can point you all the places that need to be changed, which gives the developer peace of mind, i.e. fearless refactoring.'''
year_published = 2025
clearnet = "https://lap.dev/blog/full-stack-development-in-rust"
