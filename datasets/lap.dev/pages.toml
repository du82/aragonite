full_description = '''Using the Devcontainer specification, you can define your dev environment as code. Open your dev environment and start to code instantly. Lapdev cloud uses powerful gaming CPUs to provide high single core performance which is essential for development. No more "it works on my machine". Using the Devcontainer open specification, Lapdev allows you to define your development environment as code. Onboarding developers to new projects don't need hours or days to prepare the environment on their machines. They can start to code instantly. Want to share your work-in-progress with your team? Just provide them with a direct URL to your workspace. You can also set it to public, allowing anyone with the link to view it. Need to review a PR while working on your own branch? Simply open a new workspace - no need to stash or commit your current changes. Lapdev offers a browser-based IDE right out of the box, but you can also use your preferred tools like VSCode, JetBrains IDEs, or Lapce. Alternatively, you can SSH directly into the environment and use editors like Vim or Emacs. VSCode can connect through SSH Remote plugin, and JetBrains IDEs can connect via JetBrains Gateway SSH connection. Or you can directly SSH in, and use Vim or Emacs. There’s also a browser version of VSCode out of the box.'''
