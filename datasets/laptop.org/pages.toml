["https://laptop.org/aboutolpc"]
title = "About OLPC – OLPC"
full_description = "OLPC was born with the unique purpose of facilitating access to technology as a way to combat the educational gap with the most underprivileged children in the world, understanding education as a powerful means toward social transformation. The program began at the Massachusetts Institute of Technology (MIT) in 2005, and, since its inception, OLPC has provided more than 3 million educational laptops to children around the world. OLPC is a 501(c)(3) non-profit organization, founded and based in the US whose mission is to provide any learner in the world access to educational opportunities through digital technology as new channels of learning, sharing, and self-expression so they can discover their theories to build their knowledge. We began 15 years ago because there was nothing available for children, especially those in more vulnerable situations. Today we have gone back to our core fundamentals which are learning through technology, not the technology in itself. Technology is a means, not an objective. We are back to enable development of higher level thinking skills. The objective is to enable learning opportunities so children can transform their environments, societies and realities."
year_published = 2025
clearnet = "https://laptop.org/aboutolpc"
