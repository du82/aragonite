title = "Older Work | Lara Hogan"
description = "Lara Hogan, Management Coach and Trainer"
full_description = "Quoted in the Press How to develop a performance improvement plan that might actually work (The Globe and Mail) 5 Questions You Should Ask A New Boss Right Away (Yahoo! news) Want the perfect manager? Here’s how to build one. (American Press Institute) It’s Time to Rethink Your 1:1 Meetings (The M Dash) 4 things to look for in a job—besides more money—that could make you happier (Fortune) Is It OK To Tell Your Boss That You're Unhappy At Work? (Huffington Post) How To Make Sure Your Work Is Noticed (Without Being Obnoxious) (Huffington Post) Your brain on progress (Increment Magazine) The 7 Conflict Styles Of People You Argue With At Work (Huffington Post) The 7 Personalities Of Bad Bosses Who Think They're Good Bosses (Huffington Post) Cut Your Colleagues Some Slack This Election Week (Huffington Post) It's Impossible To Focus On Work When The World Is On Fire (Huffington Post) 3 Signs Your Co-Worker May Be Secretly Struggling Right Now (Huffington Post) 5 Big Mistakes Managers Make When Delivering Bad News To Employees (Huffington Post) How 5 people spent their vacation days during the coronavirus pandemic (Fortune) The Best Christmas Gift For Bosses Is Totally Free (Huffington Post) How To Deal With A Boss Who Micromanages Your Work From Home (Huffington Post) Citigroup stands out in Congress’s diversity report on the banking industry (Fortune) These tools and easy tricks can help anyone master their schedule (Fast Company) The 4 Biggest Mistakes First-Time Managers Make (And How To Avoid Them) (Huffington Post) Nudging Toward Inclusion (Fortune) Where Women’s Empowerment Means Deadlifting 300 Pounds (New York Times) Learning and Exploring on 100% Day (New York Times) Why We Need Women in Tech (Popular Mechanics) 15 Practical Design Tweaks For Your Website In 2015 (Forbes) Writing Your brain on progress Strategies for nurturing that feel-good sense of accomplishment when doing largely invisible work. How to be a sponsor when you're a developer (Lead Dev) If you’re not a manager, but you’ve wondered how you can help someone else grow in their career, this article is for you. Four steps to identifying your new role (Lead Dev) Prioritizing your wants and needs to make sure your next career move is the right one. An introduction to correcting—and preventing—compensation inequity Are you fairly paying and promoting members of minoritized groups in your organization? Find frameworks and strategies to do so in this edition of Increment Magazine. Demystifying Public Speaking ©2016, published by A Book Apart Don’t think public speaking is for you? It is—whether you’re bracing for a conference talk or a team meeting. Demystifying Public Speaking helps you identify your fears and effectively face them, so you can make your way to the stage (big or small). Get clear, practical advice through every step, from choosing a topic and creating a presentation, to gathering and distilling feedback, to event-day prep. You’ll feel confident and equipped to step into the spotlight. Foreword for JavaScript for Web Designers I was blown away by Mat Marquis’ JavaScript for Web Designers, and honored when he asked me to write the foreword. If staring down JavaScript leaves you unsteady, take heart. Mat Marquis is at your side, offering a detailed yet approachable tour around this essential language. Make your way through plenty of practical examples, as you pick up syntax rules, the fundamentals of scripting, and how to handle data types and loops. You’ll emerge clear-eyed and confident—and ready to get to work. Helping VIPs Care About Performance (24 Ways) “What metric(s) do your VIPs care about?” This question is often met with blank stares and raised eyebrows. But it’s also our biggest clue to what we need to do to help empower others to care about performance and work on it. Every organization and executive is different. This means that three major things vary: the primary metrics VIPs care about; the language they use about measuring success; and how change is enacted. By clueing in to these nuances within your organization, you can get a huge leg up on crafting a successful pitch about performance work. Building a Device Lab, the book At Etsy, Destiny Montague and I built a device lab with 30+ devices and iterated upon the lab as we learned more about how developers and designers use it. Building upon our workshop, Destiny Montague and I wrote this book to help others build out their labs as a product for their coworkers. Performance: Showing Versus Telling (A List Apart) Take your message to the next level. Help those around you feel the impact that performance has on your overall user experience. Showing is so much more compelling than telling; showcasing the real user experience is much more powerful than staring at numbers or bar charts. So how can we show performance? Use videos of your site loading, and wall monitors! This article shows you how. The Pastry Box Project I contributed a monthly article to The Pastry Box Project. My posts: Support women-authored tech books Exit-Voice Dynamics in the Tech Industry: How women in tech have had it up to here with this nonsense Non-linear career trajectories Celebrating our achievements On changing your name The high road Mean time to “women in tech” Behind every great woman On having a totally reasonable amount of self confidence Working in Tech with a Chronic Illness On quitting Foreword for Brave New Girls Brave New Girls is a collection of young adult sci-fi tales featuring tech-savvy heroines, from starship mechanics to hackers to electrical engineers and beyond. All proceeds will be donated quarterly to a scholarship fund for girls through the Society of Women Engineers. I was fortunate enough to be invited to write a foreword for the book. Designing for Performance I’m the author of Designing for Performance. This practical introduction to performance from a designer and front-end developer perspective has been featured in Netmag’s “Need list” and reviewed on CSS-Tricks. It covers: The basics of page speed: requests and how browsers render content, and how it impacts your site, brand, and users Optimizing images, HTML, CSS, and fonts for performance Implementing responsive web design with an eye on performance Tactics for weighing aesthetic choices and their performance impact Tools for measuring and iterating on performance Methods for shaping an organization’s performance culture The book is available for purchase from O'Reilly in both ebook and print version. I'm donating all of the proceeds from the book to various charities focused on supporting underrepresented people in tech. You can also read the book online for free. Calendar Hacks (Code as Craft) As an engineering manager, there’s one major realization you have: managers go to lots of meetings. After chatting with a bunch of fellow engineering managers at Etsy, I realized that people have awesome hacks for managing their calendars and time. I wrote up the best ones from a recent poll of Etsy engineering managers. Front End Performance series (O'Reilly Programming Blog) Web Performance Is User Experience Image Performance HTML and CSS Performance Responsive Web Design Performance Iterate on Performance In this series of posts, I focus on the basics for optimizing the number and size of requests it takes to load your site quickly. As you build out sites, sometimes you’ll make choices that favor page load time, other times you’ll make choices that favor aesthetics. The key is to always be thinking in terms of user experience–including performance–and what will have the biggest impact for your site. The first two articles were also cross-posted on Forbes Technology (1, 2). Etsy's Device Lab (Code as Craft) I share how we built Etsy’s mobile device testing lab, complete with communication techniques, challenges like power supply, what we learned about how to make it intuitive for developers and designers to use, and pictures! Improving UX Through Front-End Performance (A List Apart) In this front-end performance 101, I walk through designing and coding for performance, focusing on optimizing requests and how to measure the results. Complex table responsive design I used nth-of-type:before and colspan*=x in media queries to creatively display table headers and context on smaller screen sizes in this responsive web design technique. Improve UX By Tracking Errors (Smashing Magazine) Tracking and optimizing error messages will help you measurably improve your website’s UX. I detail implementation, data gathering and analysis to help you figure out how to improve your error message drop rates. This article was also included in the book UX Practical Techniques. See the article within the book here. A Primer on A/B Testing (A List Apart) Data is an invaluable tool for web designers who are making decisions about the user experience. A/B tests, or split tests, are one of the easiest ways to measure the effect of different design, content, or functionality. A/B tests allow you to create high-performing user experience elements that you can implement across your site. This article details techniques and examples to help get you started. Interviews The M Dash - It’s Time to Rethink Your 1:1 Meetings The M Dash interviewed me for tips to make your weekly 1:1 the most impactful meeting of your week. Huffington Post: How To Pick The Perfect 'Fun Fact' For Icebreaker Questions If you’ve ever panicked when it’s your turn to share a “fun fact about yourself” at work, you’re not alone. I and five other career experts revealed a different strategy for picking what to reveal in getting-to-know-you exercises, and how to design a reduced-stress icebreaker experience. Intercom podcast We covered a range of topics including planning your one-on-ones, navigating team friction, giving successful feedback, and building your network of support. PM for the Masses We started with a brief conversation about coaching and how it’s different than mentoring, then launched into a real coaching session! Huffington Post: Is It OK To Tell Your Boss That You're Unhappy At Work? There are four questions you should ask yourself to determine whether a conversation with your manager could help change how you are feeling: What’s the No. 1 thing you need right now, such as rest, support or clarity? If you could wave a magic wand and change one thing about your work, what would it be? What’s the No. 1 thing your manager cares or worries about, such as attrition or deadlines? Where’s the overlap between what your manager cares about and what you need? The Digital Workplace podcast We talked about what it’s like to be managers in the “digital age,” particularly when it comes to facilitating digital meetings. We also talked a bit about humans’ core needs at work and how to switch between mentoring, coaching, and sponsoring your teammates. For the Love of Work podcast Anyone can create meaningful change at work, even you. Yes, you! You don’t need positional authority to practice leadership. The secret is learning how to wield influence. Spot the difference between authority and power, and learn how to use your new skill set for good, regardless of your job title. From creator to coach: Founders share lessons from the transition to CEO While there’s no one right way to navigate the transition to CEO, there are lessons to be learned from other founders who have made the shift successfully. The Changelog: Leading leaders who lead engineers The majority of our conversation focuses on the four primary hats leaders and managers end up wearing; mentoring, coaching, sponsoring, and delivering feedback. We also talk about knowing when you’re ready to lead, empathy and compassion, and learning to lead. Coding Sans podcast on performance reviews We talked through building feedback delivery skills from the ground up, the step-by-step process of writing and delivering performance reviews, preparation tips, mistakes you might make, and more. Distributed: the secret to being a successful manager Are companies setting up their managers for success? What are BICEPS? How do you assemble your colleagues like a management Voltron? I talked with Matt Mullenweg, CEO of Automattic, on his podcast. Productivity & Engineering Podcast by Veamly Whether you are a seasoned engineering manager or a software engineer considering the option way down the road, there are certain aspects of management that make the job tough especially with what’s going on with the world right now. Veamly’s CEO Emna Ghariani sat down with me to discuss the essence of building resilient teams that rise in times of crisis. Scaling Software Teams Podcast A resilient manager is the foundation of every successful team. How do you become a more resilient manager? In this episode, I provided Wes with some 1:1 coaching on his management style and uses the BICEPS framework to help him better understand resistance patterns he may see in his daily work. Programming Leadership: Rise of the Resilient Manager Are you a resilient manager? Do you want to become one? In this episode of Programming Leadership, Marcus and I discuss what it means to be a resilient manager. We discuss some effective management skills and thought processes, and introduced Marcus to the idea of the manager Voltron. Huffington Post: The 4 Biggest Mistakes First-Time Managers Make (And How To Avoid Them) “Generally, when we become a manager, we are just trying to do our best, and the shortcut to doing our best is, ‘Well, what would I want in this situation? What would I need?’ It’s very natural to leap from that to assuming that everybody else is going to want or need the same needs that you do.” But it turns out: that doesn’t work! Humans+Tech Podcast In this episode of the Humans + Tech podcast, we cover how to get feedback from your team, dealing with times of crisis, a gross metaphor for growth, and so much more. CodeNewbie: How to be a good manager and a good employee You can be an amazing developer, but a terrible manager. We discuss why becoming a manager isn’t necessarily a promotion, and some of the most important skills people need to not only be good managers, but in any supporting role. Presentable podcast We discuss the qualities that help teams thrive and how you can contribute whether you’re a leader … or aspire to be. Track Changes podcast Focus on Core Needs: I joined Paul and guest host Gina Trapani to chat about my new book and about leadership in the workplace. I walked through a framework for managing different types of people and gave tips on how to adapt your management style. I also gave Paul some useful advice on where he should sit in the office and explained why moving desks can be so traumatic. Strong Feelings podcast Did your first management gig come with a small pay bump and zero training? Ours too! But being good at doing a job doesn’t mean you’ll automatically be good at managing people doing it. We cover: why there’s more to ma"
