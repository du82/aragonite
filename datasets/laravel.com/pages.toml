["https://laravel.com/docs/12.x/console-tests"]
title = "Console Tests - Laravel 12.x - The PHP Framework For Web Artisans"
description = "Laravel is a PHP web application framework with expressive, elegant syntax. We’ve already laid the foundation — freeing you to create without sweating the small things."
full_description = '''In addition to simplifying HTTP testing, Laravel provides a simple API for testing your application's custom console commands. To get started, let's explore how to make assertions regarding an Artisan command's exit code. To accomplish this, we will use the artisan method to invoke an Artisan command from our test. Then, we will use the assertExitCode method to assert that the command completed with a given exit code: You may use the assertNotExitCode method to assert that the command did not exit with a given exit code: Of course, all terminal commands typically exit with a status code of 0 when they are successful and a non-zero exit code when they are not successful. Therefore, for convenience, you may utilize the assertSuccessful and assertFailed assertions to assert that a given command exited with a successful exit code or not: Laravel allows you to easily "mock" user input for your console commands using the expectsQuestion method. In addition, you may specify the exit code and text that you expect to be output by the console command using the assertExitCode and expectsOutput methods. For example, consider the following console command: If you are utilizing the search or multisearch functions provided by Laravel Prompts, you may use the expectsSearch assertion to mock the user's input, search results, and selection: You may also assert that a console command does not generate any output using the doesntExpectOutput method: The expectsOutputToContain and doesntExpectOutputToContain methods may be used to make assertions against a portion of the output: When writing a command which expects confirmation in the form of a "yes" or "no" answer, you may utilize the expectsConfirmation method: If your command displays a table of information using Artisan's table method, it can be cumbersome to write output expectations for the entire table. Instead, you may use the expectsTable method. This method accepts the table's headers as its first argument and the table's data as its second argument:'''
