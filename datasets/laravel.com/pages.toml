["https://laravel.com/docs/12.x/controllers"]
title = "Controllers - Laravel 12.x - The PHP Framework For Web Artisans"
description = "Laravel is a PHP web application framework with expressive, elegant syntax. We’ve already laid the foundation — freeing you to create without sweating the small things."
full_description = '''Instead of defining all of your request handling logic as closures in your route files, you may wish to organize this behavior using "controller" classes. Controllers can group related request handling logic into a single class. For example, a UserController class might handle all incoming requests related to users, including showing, creating, updating, and deleting users. By default, controllers are stored in the app/Http/Controllers directory. To quickly generate a new controller, you may run the make:controller Artisan command. By default, all of the controllers for your application are stored in the app/Http/Controllers directory: Let's take a look at an example of a basic controller. A controller may have any number of public methods which will respond to incoming HTTP requests: Once you have written a controller class and method, you may define a route to the controller method like so: When an incoming request matches the specified route URI, the show method on the App\Http\Controllers\UserController class will be invoked and the route parameters will be passed to the method. Controllers are not required to extend a base class. However, it is sometimes convenient to extend a base controller class that contains methods that should be shared across all of your controllers. If a controller action is particularly complex, you might find it convenient to dedicate an entire controller class to that single action. To accomplish this, you may define a single __invoke method within the controller: When registering routes for single action controllers, you do not need to specify a controller method. Instead, you may simply pass the name of the controller to the router: You may generate an invokable controller by using the --invokable option of the make:controller Artisan command: Or, you may find it convenient to specify middleware within your controller class. To do so, your controller should implement the HasMiddleware interface, which dictates that the controller should have a static middleware method. From this method, you may return an array of middleware that should be applied to the controller's actions:'''
