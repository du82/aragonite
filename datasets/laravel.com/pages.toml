title = "Legal - Laravel - The PHP Framework For Web Artisans"
description = "Laravel is a PHP web application framework with expressive, elegant syntax. We’ve already laid the foundation — freeing you to create without sweating the small things."
full_description = '''This Trademarks and Logos use policy (the "Policy") is based on the Ubuntu trademark policy and published under the CC-BY-SA license. You are welcome to base your own project trademark policies off it, just let others use your changes and give credit to the Ubuntu project as the original source! The objective of the Policy is to encourage widespread use of the Laravel trademarks by the Laravel community while controlling that use in order to avoid confusion on the part of Laravel users and the general public, to maintain the value of the image and reputation of the trademarks and to protect them from inappropriate or unauthorised use. The sections below describe what is allowed, what isn't allowed, and cases in which you should ask permission. Any verbal mark starting with the letters "Laravel" is sufficiently similar to one or more of the trademarks that permission will be needed in order to use it. All verbal trademarks of Laravel, all distinctive signs used in commerce by Laravel to designate his products or services related to Laravel are collectively referred to as the "Trademarks". Laravel is built by, and largely for, its community. We share access to the Trademarks with the entire community for the purposes of discussion, development and advocacy. We recognize that most of the open source discussion and development areas are for non-commercial purposes and will allow the use of the Trademarks in this context, provided: Building on Laravel or for Laravel. If you are producing new software which is intended for use with or on Laravel, you may use the Trademark in a way which indicates the intent of your product. For example, if you are developing a system management tool for Laravel, acceptable project titles would be "System Management for Laravel" or "Laravel Based Systems Management". We would strongly discourage, and likely would consider to be problematic, a name such as LaravelMan, Laravel Management, LaraMan, etc. Furthermore, you may not use the Trademarks in a way which implies an endorsement where that doesn't exist, or which attempts to unfairly or confusingly capitalise on the goodwill or brand of the project.'''
