["https://laravel.com/docs/starter-kits"]
title = "Starter Kits - Laravel 12.x - The PHP Framework For Web Artisans"
description = "Laravel is a PHP web application framework with expressive, elegant syntax. We’ve already laid the foundation — freeing you to create without sweating the small things."
full_description = "To give you a head start building your new Laravel application, we are happy to offer application starter kits. These starter kits give you a head start on building your next Laravel application, and include the routes, controllers, and views you need to register and authenticate your application's users. While you are welcome to use these starter kits, they are not required. You are free to build your own application from the ground up by simply installing a fresh copy of Laravel. Either way, we know you will build something great! To create a new Laravel application using one of our starter kits, you should first install PHP and the Laravel CLI tool. If you already have PHP and Composer installed, you may install the Laravel installer CLI tool via Composer: Then, create a new Laravel application using the Laravel installer CLI. The Laravel installer will prompt you to select your preferred starter kit: After creating your Laravel application, you only need to install its frontend dependencies via NPM and start the Laravel development server: Once you have started the Laravel development server, your application will be accessible in your web browser at http://localhost:8000. Our React starter kit provides a robust, modern starting point for building Laravel applications with a React frontend using Inertia. Inertia allows you to build modern, single-page React applications using classic server-side routing and controllers. This lets you enjoy the frontend power of React combined with the incredible backend productivity of Laravel and lightning-fast Vite compilation. Our Vue starter kit provides a great starting point for building Laravel applications with a Vue frontend using Inertia. Inertia allows you to build modern, single-page Vue applications using classic server-side routing and controllers. This lets you enjoy the frontend power of Vue combined with the incredible backend productivity of Laravel and lightning-fast Vite compilation. The Vue starter kit utilizes the Vue Composition API, TypeScript, Tailwind, and the shadcn-vue component library."
