["https://laravel.com/docs/12.x/http-client"]
title = "HTTP Client - Laravel 12.x - The PHP Framework For Web Artisans"
description = "Laravel is a PHP web application framework with expressive, elegant syntax. We’ve already laid the foundation — freeing you to create without sweating the small things."
full_description = '''Laravel provides an expressive, minimal API around the Guzzle HTTP client, allowing you to quickly make outgoing HTTP requests to communicate with other web applications. Laravel's wrapper around Guzzle is focused on its most common use cases and a wonderful developer experience. To make requests, you may use the head, get, post, put, patch, and delete methods provided by the Http facade. First, let's examine how to make a basic GET request to another URL: The get method returns an instance of Illuminate\Http\Client\Response, which provides a variety of methods that may be used to inspect the response: The Illuminate\Http\Client\Response object also implements the PHP ArrayAccess interface, allowing you to access JSON response data directly on the response: In addition to the response methods listed above, the following methods may be used to determine if the response has a given status code: The HTTP client also allows you to construct request URLs using the URI template specification. To define the URL parameters that can be expanded by your URI template, you may use the withUrlParameters method: If you would like to dump the outgoing request instance before it is sent and terminate the script's execution, you may add the dd method to the beginning of your request definition: Of course, it is common when making POST, PUT, and PATCH requests to send additional data with your request, so these methods accept an array of data as their second argument. By default, data will be sent using the application/json content type: When making GET requests, you may either append a query string to the URL directly or pass an array of key / value pairs as the second argument to the get method: If you would like to send data using the application/x-www-form-urlencoded content type, you should call the asForm method before making your request: You may use the withBody method if you would like to provide a raw request body when making a request. The content type may be provided via the method's second argument:'''
year_published = 2025
