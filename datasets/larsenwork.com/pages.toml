["https://larsenwork.com/easing-gradients"]
title = "Easing Gradients"
description = "Supercharge your gradients with non-linear color mix and custom color spaces."
full_description = '''Linear gradients often have hard edges where they start and/or end. We can avoid those by controlling the color mix with easing functions. Gradients under text/ui are used to increase contrast but should often be as invisible as possible. The examples below have the same amount of blackness behind the text. When transitioning between colors the edges become prominent if we don't ease-in-out of it. The image fade-out on my frontpage uses this technique too. I believe that there are many designs out there that could benefit from this approach, including the Spotify player shown below (click to see the big picture). Create and preview your own easing gradients in CSS. Note that the CSSWG syntax isn't supported in any browsers yet. Help me by tweeting about it, star/contribute on GitHub or donate to my fundraiser for Ethiopia Health Aid Inc. I wrote about it in detail on CSS-Tricks and would love to do a conference talk 😉 or two about it. Fortunately Chris Coyier and others liked the idea and Eric Meyer made a CSSWG proposal where the syntax was refined and you can chime in with your ideas/suggestions. Until that happens 🤞 you can use the postCSS-easing-gradients plugin which is more powerful than the editor above. What the plugin and the editor do is add a bunch of intermediate color-stops to create a "low poly" version of the easing function. The end result is ok for now and a lot prettier in relevant use cases.'''
year_published = 2025
clearnet = "https://larsenwork.com/easing-gradients"
