["https://larsenwork.com/monoid"]
title = "Monoid"
description = "Monoid is a customizable, minimal + legible font optimized for coding. It's customisable with ligatures, alternates and class based positioning."
full_description = '''Monoid is customizable and optimized for coding with bitmap-like sharpness at 12px/9pt even on low res displays. Semi-condensed and distinguishable glyphs with short ascenders + descenders, big apertures and supersized operators + punctuation. Monoid comes in regular, bold, oblique and retina versions with >750 latin, greek, cyrillic, ligature, alternate and Powerline glyphs. Monoid + Font Awesome = Monoisome. See the icons directly in your code. <i class="fa fa-thumbs-o-up"></i> becomes <i class="fa fa-thumbs-o-up"></i> Test it in the "test" example. Can be turned off <!-- --> <-- ->> <<- -> <- => <=> <==> ==> <== >>= =<< -- := =:= == !== != <= >= // /** /* */ && .& || !! :: >> << ¯\_(ツ)_/¯ __ ___ .. ... Instructions, supported editors, fontlog (versions, dates, authors + roadmap) and more in the readme. Alternates $ 0 1 l LineHeight XS S M L XL Tracking Tight ½Tight Normal ½Loose Loose Ligatures On Off Download Monoisome GitHub if (tweeted || facebooked) { gratitude += 1; } if (githubStarred) { karmaBalance = true; } else { $('we').say('ok'); }'''
year_published = 2025
