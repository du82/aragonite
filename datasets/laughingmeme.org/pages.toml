description = "There are a number of new sites (as well as a number of sites from the last few generations of start ups, some ideas keep getting re-invented) that purport to be my online identity because they aggregate and/or link to the various online externalizations. (e.g. about.me)"
full_description = "Project Idea: Accolad.es (working title) Nov 11, 2010 • Kellan There are a number of new sites (as well as a number of sites from the last few generations of start ups, some ideas keep getting re-invented) that purport to be my online identity because they aggregate and/or link to the various online externalizations. (e.g. about.me) Someone should build a site that instead of pulling in just links, or pulling in recent content (recency is so boring) pulled in my top rated content: highest rated Tweets, most interesting photos, highest rated Quora questions (oh wait, they don’t have an API, never mind), most linked blog posts, etc. And all, you know, pretty, with a decent stable URL. I think that would be a useful little service if someone wanted to build it. (p.s. accolad.es is already registered, bummer)"
