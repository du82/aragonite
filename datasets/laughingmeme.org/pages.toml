["https://laughingmeme.org/2011/01/24/tip-flickr-standard-photo-response-as-slideshow"]
title = "Tip: Flickr standard photo response as slideshow | Kellan Elliott-McCrea: Blog"
description = "We’ve been doing a ton of hacking recently on our Taste Test experiment, which in turn reminds me a lot of an ill-fated Flickr project, “Top Explorers”. (to anyone who still has Flickr SVN access the code should still be there) Computers have made dumb consensus and simple popularity so trivially simple to implement, that projects to explicit hilight individual voice really intrigue me."
full_description = "Tip: Flickr standard photo response as slideshow Jan 24, 2011 • Kellan We’ve been doing a ton of hacking recently on our Taste Test experiment, which in turn reminds me a lot of an ill-fated Flickr project, “Top Explorers”. (to anyone who still has Flickr SVN access the code should still be there) Computers have made dumb consensus and simple popularity so trivially simple to implement, that projects to explicit hilight individual voice really intrigue me. Anyway I got inspired last weekend to spend a little while coding up a primitive Top Explorers implementation that would run over the API and on top of Pig. And as part of that I resorted to one of my favorite hacks for visualizing Flickr API results, the “standard photo response as slideshow” hack. Not sure it was ever documented, but you can call it with the form: http://www.flickr.com/show.gne?api_method=$method_name&method_params=param1|paramvalue1;param2|paramvalue2 The canonical example of this is [kittens from galleries](http://www.flickr.com/show.gne?apimethod=flickr.photos.search&methodparams=in*gallery 1;text kittens), but I was just using it to help visualize variations on [recent photos sorted by interestingness](http://www.flickr.com/show.gne?apimethod=flickr.photos.search&methodparams=mintakendate 1295664643;maxtakendate 1295758800;sort interestingness-desc;safe*search 1). With any luck I’ll actually have some interesting Top Explorers results soon as well."
