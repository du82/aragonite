title = "Shipping, it gets harder | Kellan Elliott-McCrea: Blog"
description = "Love this quote from Borthwick regarding news.me and shipping:"
full_description = "Shipping, it gets harder May 7, 2011 • Kellan Love this quote from Borthwick regarding news.me and shipping: “I ran a new product development group within a large company and I would like to dispel the simplistic myth that big companies don’t innovate. There is innovation occurring at many big companies. The thing that big companies really struggle to do is to ship.” – John Borthwick – news.me People ask me why I focus so relentlessly on shipping as opposed to the rest of the software development life cycle. In part because it’s hard. It’s often the hard problem. And it gets harder the longer you do it, aka it gets harder the more important the thing you’ve built is."
