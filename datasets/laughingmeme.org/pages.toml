["https://laughingmeme.org/2011/05/05/the-brooklyn-problem"]
title = "The Brooklyn Problem | Kellan Elliott-McCrea: Blog"
description = "I was honored to speak as part of the rapid fire keynotes Thursday morning at Where 2.0 (4/21), and gave a brief (even briefer then originally planned) talk on “The Brooklyn Problem”."
full_description = 'The Brooklyn Problem May 5, 2011 • Kellan I was honored to speak as part of the rapid fire keynotes Thursday morning at Where 2.0 (4/21), and gave a brief (even briefer then originally planned) talk on “The Brooklyn Problem”. The slides: **[Solving the "Brooklyn Problem" ](http://www.slideshare.net/kellan/solving-the-brooklyn-problem "Solving the "Brooklyn Problem" ")** View more [presentations](http://www.slideshare.net/) from [Kellan ](http://www.slideshare.net/kellan) The video: Folks have told me they enjoyed the talk, and found it inspiring and informative, which is immensely gratifying. I was personally frustrated with myself as I wasn’t as prepared as I like to be, and I made a number of last minute cuts from the talk that made it feel more disjointed then I liked. This can be summarized in the #protip: When the organizers give you a chance at a dry run to get to know the stage and the equipment, do it! Additionally I didn’t get to talk about the work of Aaron Beppu who recently joined our search team tackling relevance ranking, did the bulk of the backend work on this project as his bootcamp project, and whose final implementation is significantly more complex and interesting, or Fred Blau, who is currently working on our internationalization effort, but who rewrote our auto-complete implementation to use sequence ids instead of timing for a much smoother interface.'
