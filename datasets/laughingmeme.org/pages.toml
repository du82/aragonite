full_description = '"Sorry! We did something wrong." – Twitter, on suspending my account. Jun 2, 2011 • Kellan Yes, you did. But I’ll mostly forgive it when you un-suspend my account. For the record, I was attempting to re-follow Albert Wenger (that subscription seemingly having been lost somewhere along the way) when they suspend my account. Apparently that was suspicious. Wondering if I’ve got the lowest account number to be suspended or is this a common thing? Note to self: we need to get back to working on decentralized communication technologies. update: I’m back! Dunstan also got suspend, which makes it seem likely it was a bug affecting low numbered accounts.'
