["https://laughingmeme.org/2011/12/29/15-minutes-spent-sleuthing-the-case-of-the-missing-fab-com-engineering-team"]
title = "15 Minutes Spent Sleuthing the Case of the Missing Fab.com Engineering Team | Kellan Elliott-McCrea: Blog"
description = "Stumbling onto this Fab.com 2011 retrospective, reminded me of something that’s been puzzling me. While I knew a bunch of great folks going to work for Fab.com, including Lori Dorn and Beth Ferreira, I didn’t know any of their geeks. Which is odd in a small tech scene like New York."
full_description = "15 Minutes Spent Sleuthing the Case of the Missing Fab.com Engineering Team Dec 29, 2011 • Kellan Stumbling onto this Fab.com 2011 retrospective, reminded me of something that’s been puzzling me. While I knew a bunch of great folks going to work for Fab.com, including Lori Dorn and Beth Ferreira, I didn’t know any of their geeks. Which is odd in a small tech scene like New York. Turns out the geeks are True Sparrow Systems, they appear to be a boutique Rails shop, they’re based in Pune, India, and described as co-founders. And Jason Goldberg did his last company, socialmedian, with them as well. Mystery solved."
