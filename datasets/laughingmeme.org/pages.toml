["https://laughingmeme.org/2011/01/23/ville-noun"]
title = "ville, noun | Kellan Elliott-McCrea: Blog"
description = "A small post-geographic organizational unit, roughly analogous to a 20th century nuclear family, as distinct from a guild or tribe. Coined in the early Zynga upload arcologies to describe 4-6 members running a shared synapse net aka someone who would help you find a lost cow. All members of an upload archeology running the same consensus reality."
