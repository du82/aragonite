description = "Launch 2016 here: launch.devpost.com/"
full_description = '''Back to all discussions Sagiv Ofek • about 10 years ago How come there is no easy way to form a team here? So many hackers but not a single way to form a team, suggest ideas, browse project etc... any suggestion on the best way to collaborate ? 5 comments Launch Media Manager • about 10 years ago Sagiv this is definitely a feature we wish CP had. The way we will be managing teams is through submissions at the event. The founder of CP will be there, so you can chat with him in person about it. Sagiv Ofek • about 10 years ago will love to. the whole purpose of hackathon is to meet other people, form a team around a great idea and hack. the only option i have at the moment is to manually visit each person, ask them what they do and hopefully find a match. Launch Media Manager • about 10 years ago Sagiv, we completely feel your pain. Lets chat offline at the event about how Launch can manage this portion of the event better next year. Sagiv Ofek • about 10 years ago sounds good. I also suggest to dedicate "pre pitch" time where anyone can go on-stage, present an idea and anyone who like it can join the team. that's the best way that anyone can hear all the ideas in one place. Roojuta Lalani • about 10 years ago I found you! Lets team up @sagiv. My email is roojuta99@yahoo.co.in Comments are closed.'''
