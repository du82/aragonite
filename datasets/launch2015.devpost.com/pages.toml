title = "LAUNCH Hackathon 2015: Launch 2016 here: launch.devpost.com/ - Devpost"
description = "Launch 2016 here: launch.devpost.com/"
full_description = '''Back to all updates about 10 years ago Start your draft today, and Mentors Hi, two important announcements for those in attendance at the Launch Hackathon: 1) Start your draft of your submission today so that we know about your team. To start your draft, visit http://launch2015.challengepost.com and log in. Hit the "Enter A Submission" button (which you'll see after you've Registered for the hackathon). Fill in whatever details you can, but especially the name of your submission, then hit the "save as draft" button toward the bottom. You'll be able to come back and edit it before you officially submit it. If you have any questions about the platform, come to the ChallengePost booth by the stage. 2) Mentors are here, including some technical folks and some investors. If you're interested, send an email mentors@launch.co and mention your table number, your names, and what type of help you're looking for.'''
