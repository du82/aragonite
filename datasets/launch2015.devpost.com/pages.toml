["https://launch2015.devpost.com/updates"]
title = "LAUNCH Hackathon 2015: Launch 2016 here: launch.devpost.com/ - Devpost"
description = "Launch 2016 here: launch.devpost.com/"
full_description = '''almost 10 years ago Announcing the winners The votes are in! Go to the gallery to congratulate the winners and check out all of the excellent submissions. Even though the competition is over, don't stop hacking. Use your portfolio to keep your project up to date and get feedback from fellow makers. about 10 years ago 15 minutes left to submit! Hi all, there are 15 minutes left to submit. If you have not yet submitted at http://launch2015.challengepost.com please do so now so that you are not made ineligible. Thanks! about 10 years ago 40 Minutes Left to Submit! Hi Launch Hackers! Submissions close at 1 pm. That's about 40 minutes from now. Please submit with time to spare so that you are sure you'll be eligible! about 10 years ago Important: Sunday Morning Update Good morning Launch Hackers! First, you are awesome and you will finish. You can do it – we know you will! Here is how today's submissions and judging will work: 1) Deadline 1pm You need to submit your entry on the Launch Hackathon ChallengePost site before the 1pm deadline in order to be eligible for prizes. We've asked you to create a draft already so that we can get a sense of the numbers of submission, but creating a draft is NOT the same as submitting your entry. Please go back to your draft, fill it out completely with a… Read more about 10 years ago Important: Saturday night update Hi Launch hackers! Some important info and reminders: 1) Just a reminder to start your online submission draft today, so that we know how many teams are submitting and can plan accordingly. A draft is just a placeholder; you'll need to officially submit your finalized entry online before tomorrow's 1 pm deadline. (Early judging starts at Noon for those who get theirs in by then.) FYI, once you've officially submitted online, you may still edit your entry up until the submission deadline. 2) On the submission form, don't forget to fill out your table number field, select the sponsor prizes you are applying for… Read more about 10 years ago Launch Festival Chat Room For those of you who don't know, there's a chat room at http://www.launchfestival.com/chat and then click into the Hackathon room. See you in there! about 10 years ago Start your draft today, and Mentors Hi, two important announcements for those in attendance at the Launch Hackathon: 1) Start your draft of your submission today so that we know about your team. To start your draft, visit http://launch2015.challengepost.com and log in. Hit the "Enter A Submission" button (which you'll see after you've Registered for the hackathon). Fill in whatever details you can, but especially the name of your submission, then hit the "save as draft" button toward the bottom. You'll be able to come back and edit it before you officially submit it. If you have any questions about the platform, come to the ChallengePost… Read more about 10 years ago Quick Update from @jason I'm super excited that we've broken 900 participants in the fifth LAUNCH Hackathon -- we're closing registration! We're done! It's going to be epic... here's a couple of housekeeping things: 1/It's going to be a lot of fun, but this is businesss hackathon NOT a party. We're all here to learn, do seriously kick-ass work and win prizes -- as well as have a good time. 2/No spectators: if you don't code or you don't design you will be bounced from the event. Every year a couple of folks try to sneak in to do recruiting, sales or other annoying… Read more about 10 years ago Admittance The hackathon team has been hard at work today. Collectively, we have vetted over 600 registered participants. If you did not receive an email today from ChallengePost/LAUNCH you have been accepted to the event. Congratulations, we are very excited to have you in attendance. If you did receive an email from ChallengePost/LAUNCH you have not been accepted yet. We need an updated profile pic and a portfolio piece we can review. The purpose of these activities is to ensure that we are creating a best-in-class event for our valued participants and sponsors. We have been very impressed with the quality… Read more about 10 years ago January 14, 2015 We would like to thank all of you for signing up for LAUNCH Hackathon. We are working hard to make this the best hackathon in the Bay. We are looking to fill this event with the best design and developer talent. Help us out by sharing this link with all of your friends. http://bit.ly/Launchhackathon Thanks & looking forward to meeting all of you! brett@launch.co'''
