["https://launch2015.devpost.com/updates/2962-important-saturday-night-update"]
title = "LAUNCH Hackathon 2015: Launch 2016 here: launch.devpost.com/ - Devpost"
description = "Launch 2016 here: launch.devpost.com/"
full_description = "Back to all updates about 10 years ago Important: Saturday night update Hi Launch hackers! Some important info and reminders: 1) Just a reminder to start your online submission draft today, so that we know how many teams are submitting and can plan accordingly. A draft is just a placeholder; you'll need to officially submit your finalized entry online before tomorrow's 1 pm deadline. (Early judging starts at Noon for those who get theirs in by then.) FYI, once you've officially submitted online, you may still edit your entry up until the submission deadline. 2) On the submission form, don't forget to fill out your table number field, select the sponsor prizes you are applying for (qualifying details for each are on the homepage), and also be sure to tag all of the languages and technologies in your stack. Make your online submission great because people will be interested in seeing it. 3) Judging: During judging Sunday, you will remain at your table numbers while judges come to you. You'll pitch them and show what you've built. (See this article, How to Present a Succesful Hackathon Demo, for advice on pitching.) You'll also be able to ask judges questions and get mentoring advice to make this experience as valuable as possible! If you have any questions about the platform, come to the ChallengePost table. Thanks and happy hacking!"
