.io/findingthelittlethings/92d5d8b6-6bcb-4196-a6b8-5fc4a53b6228_laura-with-flowers.png?ixlib=gatsbyFP&amp;auto=compress%2Cformat&amp;fit=max&amp;w=1446&amp;h=1446 1446w,https://images.prismic.io/findingthelittlethings/92d5d8b6-6bcb-4196-a6b8-5fc4a53b6228_laura-with-flowers.png?ixlib=gatsbyFP&amp;auto=compress%2Cformat&amp;fit=max&amp;w=1678&amp;h=1678 1678w,https://images.prismic.io/findingthelittlethings/92d5d8b6-6bcb-4196-a6b8-5fc4a53b6228_laura-with-flowers.png?ixlib=gatsbyFP&amp;auto=compress%2Cformat&amp;fit=max&amp;w=1946&amp;h=1946 1946w,https://images.prismic.io/findingthelittlethings/92d5d8b6-6bcb-4196-a6b8-5fc4a53b6228_laura-with-flowers.png?ixlib=gatsbyFP&amp;auto=compress%2Cformat&amp;fit=max&amp;w=2048&amp;h=2048 2048w" alt="Illustrator Laura Heine"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Hi, I'm LauraI'm an illustrator based in Stuttgart, Germany with a soft spot for colours, flowers and the little things in life. I come from a family of artists and grew up between brushes, pastel chalks and canvas. Painting and drawing has always been a part of me. After a few years as an UX-Designer at an agency I therefore decided in 2020 to freelance as an illustrator in part time. Now I work with publishers and also accept private commissions. It all started with Finding the Little Things – my Instagram Account and Etsy Shop. Apart from a few sketches with pen and paper my drawing process is entirely digi