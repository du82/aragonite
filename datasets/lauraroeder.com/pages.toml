["https://lauraroeder.com/why-i-trust-my-remote-team-completely-and-what-to-do-if-you-dont-trust-yours-c8c0ff22d623"]
title = "Why I Trust My Remote Team Completely (And What To Do If You Don’t Trust Yours) | by Laura Roeder | littlefish"
description = "When I launched my first software startup, MeetEdgar, I was pregnant with my first child. As a new mom I had no idea what to expect as far as what my maternity leave needs would be, so I asked every…"
full_description = "Why I Trust My Remote Team Completely (And What To Do If You Don’t Trust Yours)Laura Roeder·FollowPublished inlittlefish·4 min read·May 13, 2016--7ListenShareKristina & Tom from Team Edgar, feeling very trustworthyWhen I launched my first software startup, MeetEdgar, I was pregnant with my first child. As a new mom I had no idea what to expect as far as what my maternity leave needs would be, so I asked every entrepreneur mom I could find what I should do. Based on their advice, I decided to take 3 months off entirely after my son was born. (Yes, ENTIRELY!)My son was born Jan on 30th, 2015. Here’s what our growth looked like while I was on leave:February: $74,489 MRRMarch: $93,704 MRRApril $109,858 MRRDuring the 3 months I was on leave we cracked the $100k monthly recurring mark, the $1m annual recurring mark and our MRR increased by 47%!So do I have a team that I totally trust, who definitely doesn’t need my poking and prodding to do amazing work and grow our company? I think that’s some pretty strong evidence that the answer is yes.The first step to building a team that you trust is to only hire people that you trust. A LOT. From day one.As soon as trust is lost, you can’t have a working relationship with that person. People have said to me about their employees, “I think she’s stealing from me,” or, “I think he’s just messing around on facebook all day and not doing any real work.” (This is especially common on distributed teams like ours.)Are you kidding me??? If you really don’t trust an employee, you need to end that relationship right now!This is a two-way street, by the way — I’m also shocked to learn how often employees put up with late paychecks, horrible treatment, and blatant lies from their bosses. Who wants to work like that?Team Edgar, photobooth styleAt Edgar, we give employees full access from day one. Credit cards, passwords, the whole kit and caboodle. You don’t need to “earn my trust;” that would be a waste of time. I won’t hire you unless you already have it.I’m not saying this always works out perfectly — I’ve never had anything like major embezzlement happen, but I have had people who lost my trust. And they don’t work with me anymore. But that is EXTREMELY rare.I assume that everyone on my team wants to do their best work and wants the company to succeed as much as possible.(Again, why would you keep anyone around who you feel doesn’t care about the company’s success??) There are so many lousy companies out there, and so many talented people who do the bare minimum to get by because that’s what their company has inadvertently encouraged them to do.Companies encourage “bad” behavior in so many ways.Micromanaging and redoing work is one of the biggest ones. People learn that their time is wasted anyway because someone else is just going to redo it their own way, so why even try?Not genuinely taking contributions from the team is another common way to encourage less than the best. Simply saying that you have an “open door” policy is nowhere near enough. People need to be asked for their feedback repeatedly, and then they need to see that those ideas are actually being put into action. (Or even better, just let people implement their own ideas without a huge chain of permission.) If that doesn’t happen, they’re obviously going to stop offering up their best ideas.Busywork is another performance killer. This includes useless, never-ending meetings, redundant and excessive documentation; and expecting “butts in seats” even if people have nothing to do. They’re all ways to guarantee that your team will slack off as soon as you step away. No one has any motivation to excel at work that they consider a waste of time.Basically, the way to encourage people to do great work when you’re not there managing every little step is to LET them. Don’t hire someone who doesn’t possess massive intrinsic motivation to show up and improve their craft every day.Hire writers who love to write. Coders who love to code. Customer support staff who get a deep satisfaction from solving people’s problems.If you hire people who love their work and give them the tools they need to do it, trusting your team will never become an issue.Laura Roeder is the founder of content distribution tool MeetEdgar."
