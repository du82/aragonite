title = "Distributed Teams Don’t Have to Be Asynchronous Teams | by Laura Roeder | littlefish"
description = "Our team is at MeetEdgar is remote, AKA distributed, AKA work-from-home (if you’re not into startup jargon.) That means we don’t have any kind of central office, and that everyone works from their…"
full_description = "Distributed Teams Don’t Have to Be Asynchronous TeamsLaura Roeder·FollowPublished inlittlefish·4 min read·May 26, 2016--1ListenShareOur team is at MeetEdgar is remote, AKA distributed, AKA work-from-home (if you’re not into startup jargon.) That means we don’t have any kind of central office, and that everyone works from their own home, coffee shop, or coworking space.When you hear about distributed teams, you’re often hearing about global teams. Jason Fried’s Basecamp and Matt Mullenweg’s Automattic are two great examples of that. They’re teams that we really look up to and have learned a ton from — but they’re still very different from us. Their global workforces mean they’ve developed a new, asynchronous style of working (meaning their workers’ schedules don’t necessarily overlap).At MeetEdgar, we’ve done something a little different.We’ve found that distributed teams don’t have to be asynchronous teams. We still do our work together; we’re just physically apart.Here are the rules of success that have worked for our team of 18!Have a strict time zone boundaryWe only hire Pacific Time through Eastern Time. Period. As a remote team it is VERY tempting to make special exceptions for talent outside of this zone. Maybe you’ve talked to a candidate outside of your normal range who promises they’re a night owl who would love to work on the same schedule as the US team. I’ve gone down this road and it just doesn’t work.The problem with one person outside of your time zones is that that ONE person alone has the power to turn your team asynchronous. You now have to change your entire rhythm of communication to accommodate that one person. They can’t make the daily standup time and they can’t participate in important discussions on slack. Resist the temptation!Modify work based on quiet periodsWhen teams are mixed between east coast and west coast, each gets a natural time of day when things are quiet. We’ve found that flowing with this, rather than resisting it, is great for our productivity. Our west coasters have meetings in the morning, then are free to get focused work done in the afternoon when they aren’t being pulled into discussions, while our east coast employees get the opposite.Keep regular working hoursAt our company, “work from home” does not mean “work whenever.” We have a central document with everyone’s working hours translated in the different time zones, but we all work around a 9–5 schedule. If someone needs to modify their hours, they give the team a heads-up first.Stick to regular meeting schedulesOur teams have Monday planning meetings, Friday retrospectives, and daily check-ins (as well as a company-wide, all-hands video meeting on Mondays). As a remote company, this regular meeting rhythm is crucial to stick to. Without regular communication it’s easy to start feeling like a lone warrior. Plus, seeing your team once a day via video helps reinforce the fact that you’re working with other humans, not just names in a chat channel!Slack as a punch cardYou know that big punch card you use to clock in and clock out? (Is that still a thing, or is it just in cartoons?) We do that with slack. We have a special channel where we let the team know when we’re stepping out or for a break or having lunch.As a remote team, slack serves as our virtual office. If you’re signed on to slack, you’re in the building! Green if you’re available to chat, red if you’re not.Keep conversations public and accessibleWe have a general rule that unless something has a reason to be private, it should be public. That’s why we use slack rooms for conversations instead of private messages or emails. This helps keep information accessible and fast-moving, but it also speaks to our culture.This policy lets everyone know that our company asks questions, collaborates, and discusses decisions as a practice. When questions are invisible or hidden in PMs, new team members don’t feel comfortable asking them and don’t build a habit around transparent communication. This also creates a general feeling that we’re all working together — the buzz is visible.(If you’re wondering if all this slack-ing can get overwhelming, the answer is yes! That’s why we also encourage muting most channels.)Pair programmingYou can still pair program on a remote team! Our dev team loves Screenhero for working together. We also use this tool during our interview process so we can really see what it’s like to work side by side with a candidate.All together nowMake a conscious effort to keep your distributed team from feeling like they’re anything other than together. By working around a centralized schedule, having regular team-wide meetings, and using technology to create the feeling of a virtual office, your remote team never has to feel remote.Find more articles like this one on our blog!"
