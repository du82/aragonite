["https://lauraroeder.com/narrative-non-fiction-podcasts-that-arent-about-murder-6cd14c35080d"]
title = "The Top 45 Narrative Non-Fiction Podcasts that AREN’T About Murder | by Laura Roeder | littlefish"
description = "When it comes to podcasts, I’m looking for an incredible story. A narrative thread, some cliffhangers, and to really capture my attention it has to be a true story. The defining podcast of this genre…"
full_description = "The Top 45 Narrative Non-Fiction Podcasts that AREN’T About MurderLaura Roeder·FollowPublished inlittlefish·10 min read·Sep 20, 2021--2ListenShareAlways Be ListeningI love podcasts, but I hate interview podcasts. I know, it’s weird! But I can’t be the only one.When it comes to podcasts, I’m looking for an incredible story. A narrative thread, some cliffhangers, and to really capture my attention it has to be a true story.The defining podcast of this genre is the very famous Serial (which is excellent, for the record). But it’s a murder podcast. And sometimes you just don’t want a story about a real human being killing another real human being, ya know?So, straight from a professional podcast listener, here’s my list of excellent, gripping narrative format podcasts that are NOT about murder. (And are all 100% true!)These are vaguely ranked from must-listen to meh. But I only included podcasts on this list that I finished and would recommend. (Believe it or not, there are a ton more I listened to that didn’t make the cut!)The Dream Season OneI haven’t met a human yet who didn’t absolutely love this podcast. Listen to Season One. LISTEN TO IT. This is at the top of the list for a reason!The Trojan Horse AffairDAMN this was good, and co-created by the creator of Serial you expect nothing less. Education is a common theme on this list, so a podcast that follows an education story with some truly jaw-dropping moments is sitting right at #2. I don’t even want to tell you what it’s about because the topic doesn’t sound that juicy, BUT IT IS. Just listen.The Missing Crypto QueenThis is one of the most bananas real-life podcasts you will ever hear, so many great cliffhangers that left me dying for the next episode. The Bulgarian crypto beauty pageant is too good to be real, and a scene you will never forget.The RetrievalsDoes anyone else associate books and podcasts with where you were when you consumed them? I listened to this one while wondering around Tokyo so it has a deep association for me. Anyway, this one hit me hard. It kind of manages to capture what’s F’ed about being a woman in America. I’m not even going to tell you what it’s about. Must listen.Exit ScamI had to put this one below Crypto Queen because the stories are bizarrely similar. This is a different shady crypto founder who also disappears. The production value isn’t as excellent as Crypto Queen, but still a really interesting story.The Gateway: Teal SwanThis podcast absolutely haunted me and I still think about it (and get mildly creeped out) all the time. It’s a deep dive into Teal Swan, a “self help” leader who focuses on suicidal people. She is a deeply fascinating character, and since I’m a big self-help reader myself I loved exploring some of the darker sides of this world.No CompromiseI would honestly say this podcast is a must-listen for every American, especially if you feel confused by Trump supporters. No Compromise reveals a LOT about America, including how many of our state representatives are “out” white supremacists. I was also fascinated to learn about Christian Reconstructionism. (Google it or listen to the podcast!)Chameleon: Hollywood Con QueenThis is one of the most “holy shit that’s too incredible to be true” stories on this list. Plus it has a great surprise twist!The Shrink Next DoorA top pick because it’s so fascinating and insane it’s hard to believe it’s real!Believe in MagicI’m putting this above Scamanda because no one does audio storytelling like the BBC and this is a very similar story that got way less press. Some absolute jaw-dropping moments here. Just full on banger of a scam podcast!ScamandaOh this one was GOOD. Lots of deep juicy interviews, lots of WTF moments, and it just keeps getting worse and worse. If you love scams it’s a must-listen.I’m Not a MonsterThis one is pretty unforgettable — a white American mom joins ISIS and takes her kids with her — WTF? This is a really well done podcast with in-depth reporting of what happened, including recordings of propaganda videos made by her kids. Disturbing AF . . . but no one (OK, none of the main characters) gets murdered, hey-o!Gangster Capitalism: The College Admissions Scandal I find “gangster capitalism” a really dumb name, don’t let it deter you from listening to this excellent podcast!California CityI LOVE A GOOD SCAM. And this show is all about a scam that’s gone on for decades (and still goes to this day!) selling land with no value in the middle of nowhere. The best part was probably discovering how the company lets the useless land go to auction when the taxes are no longer paid, buys it again, then sells it to another sucker.I Was Never ThereWhat if you were raised on a hippie “back to the land” farm and then in a punk house? And then, as an adult, you made a podcast about it with your mom? That’s basically what the score is in I Was Never There. Ostensibly about a missing person, but I loved diving into the mother/daughter relationship and portrait of a unique place/time/movement.Uncover Season 1: Escaping NXIVMCults are right up there with scams on my favorite topics list, and I gobbled up stories from a few different sources about NXIVM. This one was the best — a great, creepy, complex story told right from how it started.Startup Season 1: GimletThere have been a lot of seasons of Startup, some much better than others. This is the original, and the best. Truly captured the raw emotions of the emotional journey of starting a company.Startup: Success AcademyThis is the second best season of Startup, even though it’s one of the least “entrepreneurial” seasons. I found learning about Success Academy fascinatingShell GameAI talking to customer service, AI talking to children, AI talking to AI! The premise of this one is a journalist makes an AI clone of himself and releases it into the wild. Definitely gave me a deeper understanding of how AI works, and had a lot of funny moments.The Mysterious Mr EpsteinHey I said these didn’t involve murder, other horrific crimes are fair game!HoaxedSATANIC PANIC. Another fav topic right up there with cults and scams! This podcast from Alexi Mostrous (see also Sweet Bobby) covers a modern Satanic Panic case set in the London suburbs. Includes a fun chase through Morocco!Filthy RitualIf you loved Hoaxed, listen to Filthy Ritual next. It’s very glam with Hampstead Heath and Suriname. Memorable characters, wacky hijinks and scams, scams, scams!Surviving Y2KI have to say this one falls under the “Dan Taberski podcasts where nothing much happens” umbrella. However the narrative arc weaving his coming out with Y2K is just some of the finest podcasting of all time. And that’s from someone who (clearly) LISTENS TO A LOT OF PODCASTS.Dolly Parton’s AmericaHonestly I’m cheating by including this one as I doesn’t really have a strong narrative, it’s more of a collection of Dolly-related themes. However, the lesbian interpretation of Jolene is one of the many shining moments that make the whole series well worth a listen.Sick: Season 1I like creepy stuff, what can I say? This one is a fertility doctor who used some “unorthodox” methods, and what happened in the aftermath.Rabbit HoleHonestly this one starts out really captivating then fizzles a bit, but I still made it to the end. It’s basically an exploration of how some of the extreme right-wing ideas on the internet spread, with a Q-Anon primer thrown in for good measure.Tiffany Dover is DeadOh, you like podcasts about Q-Anon? Then you’ll probably be into this one about Covid misinformation! This goes deep on how a verifiably false story is able to spread deep and wide on the good ol’ internet. A great reminder not to believe everything you read (or see) online. (See also Death by Conspiracy on this topic.)Heaven’s GateOK I’m stretching the “not about a murder” definition here a bit, but I will maintain that this is about a cult, not a murder. Really well done and gave me a deeper perspective on something that felt like just random odd news trivia before.Nice White ParentsI had a strong personal interest in this one as I attended schools just like the ones discussed on the show, where “nice white parents” go in to change (and insert their children) into schools in low income communities. The show explored a lot of interesting themes on race, class, and how they get tied into education.Sold a StoryThrowing another education one in — this one isn’t the most exciting on the list (if you want the most exciting education one it’s DEFINITELY The Trojan Horse Affair) but it was a pretty interesting story about how these big decisions get made like how to teach kids to read.Sweet BobbySweet Bobby is basically the ultimate catfishing story. Plus it’s kind of a follow-along whodunnit, as I’ll give a minor spoiler and let you know the catfisher is someone we are introduced to in the story. It was pretty painful at times to listen to the “mark” insist that she was not gullible, as she was incredibly gullible and believed some absolutely outrageous stories from the catfisher. Ultimately it’s a twisty story about someone who had years of her life taken away in a very strange way.Do You Know MordechaiI’m sticking this under Sweet Bobby because it’s the same topic but I thought Sweet Bobby was a bit better (sorry!). Still, this story is well worth a listen and a different slant than Bobby because this one leaves you feeling quite sympathetic with the catfisher. Best moment is all the victims of the catfisher banding together to make their own crackpot detective team!Defining DiegoProbably the most wholesome one on my list. This examines all different sides of international adoption, from an American mother and grown son who was adopted from Guatemala. I learned a ton and there were some really unforgettable deeply emotional parts of the story. Definitely cried while listening.Sent AwayTeen treatment facilities! Scams, abuse, craziness — so up my alley. This podcast explores the whole industry from the insane way kids are kidnapped in the middle of the night to the lack of government oversight on the facilities.The 13th StepThe title refers to the “13th step” of 12 step programs which is hooking up with people from 12 step programs! This contains some disturbing stories of sexual assault, fair warning. The podcast covers a lot of ground of the underbelly of treatment facilities, how they’re run, government programs, and the whole drug treatment world. Super interesting.Dear AlanaAgain we dodge the not-murder classification just barely with one about suicide. But really it’s about conversion therapy which I generally find fascinating. This one is unique as they had a lot of the main character’s journals that the show recreates with an actor.ToxicThis one could have gone a bit deeper in the storytelling and journalism, but still worth a listen overall to understand more about the insanity that is Britney Spears’ conservatorship.A Very British CultAbout a cult that got people to . . . sit on zoom calls all day? Made me think damn you really can get people to do ANYTHING, how boring! A different cult angle from the others on this list that’s, well, Very British. Also if some of the others are too intense for you, this one stayed pretty tame.My Year in MensaI suspect you’ll either find the host of this podcast hilarious or outrageously annoying. I’m on team hilarious, and the air horn never got old. This is the only one on the list that would also fall into the comedy genre. Not my usual thing, but entertaining overall.Death by ConspiracyOK this one is clearly about a death . . . but it’s not a murder, he died from Covid! Gotcha! This was an interesting exploration of someone who fell into the covid conspiracy rabbit hole, and it definitely gave me insight as to how it happens. If you’re into this topic, you may also want to check out We Were Three, but honestly I didn’t love it enough to make this list.BetrayalNot about murder, just sexual assault of a minor! This is like listening to outrageously juicy gossip, and I love how the wronged wife banded together with the victim of her husband’s abuse instead of blaming her. If you think YOUR ex is bad, this podcast will cheer you right up!SouthlakeThis one caught my attention because everyone who went to the University of Texas like I did knows someone from Southlake, a suburb of Dallas. If you’ve ever wondered how people started the wild theory that “critical race theory” is being taught in elementary schools, this podcast gets to the bottom of it.Inconceivable TruthThis paternity mystery had some good twists and turns as well as really lovely heart-warming moments. It just didn’t linger with me as much as some others on this list, but if you’re interested in DNA/family stuff give this one a listen.Missing Richard SimmonsI have to spoil this one in advance and warn you that nothing happens. This a podcast with no resolution, not even close. But at this point I am a Dan Taberski superfan and will listen to anything he does, and this was no exception.Fed UpThis is a fun one but at the bottom of the list for a reason. I definitely enjoyed the drama of two influencer’s instagram feud, but the podcast is about as surface as it sounds and the story doesn’t really go anywhere. Still, this is one of the only podcasts mentioned that contains zero dark themes so I thought it deserved a place on the list!Added in December 2024: Shell Game, Defining Diego, Sold a Story, A Very British Cult, Filthy Ritual, Scamanda, Believe in Magic, The 13th Step, The Retrievals, Dear Alana, Inconceivable TruthPlus, Two Honorable Mentions That Didn’t Fit the ListIn The Dark: Season Two (Curtis Flowers)This one is sort of about murder, although gory details never appear. It’s really about the complex, incredibly length case of the man who was tried six times for the same crime. It’s riveting storytelling about race and the criminal justice system in America, and it’s a true must-listen.Bone Valley is another excellent one if you’re interested in social justice.Beach Too Sandy, Water Too WetAnd on a very, very different note (what was I thinking putting this after the Curtis Flowers podcast??) this is one isn’t about murder, but it also isn’t narrative. It’s a brother and sister reading yelp reviews, and it thoroughly cracks me up every time."
