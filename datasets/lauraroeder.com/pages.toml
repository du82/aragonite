full_description = "About Laura RoederLaura Roeder·FollowPublished inlittlefish·2 min read·Mar 14, 2017--1ListenShareI’m Laura Roeder, founder and CEO of MeetEdgar and Paperbell.Since I was 22, I’ve been an independent entrepreneur. I’ve always felt most at home in the small business community, and that’s why I’ve always been focused on giving other entrepreneurs the tools they need to be totally independent.In 2009, I founded LKR Social Media, where I taught business owners how to harness the power of social media marketing and create their own online fame. I was named one of the top 100 entrepreneurs under 30 in 2011, 2013, and 2014, and I even spoke about entrepreneurship at the White House!(My weekly newsletter of social media tips, guides, and news has grown to over 100,000 readers, too, if you wanna check that out.)Then Edgar changed EVERYTHING.In 2014, we launched Edgar, a tool we designed to make it easier than ever for marketers to share their best evergreen content on social. Now Edgar’s helping thousands of users manage their social media, the company has grown by a few dozen amazing people, and I’ve got my hands as full as ever!I started this blog so that I could share my experiences as a founder, from revealing the contents of our internal employee handbook and the virtues of being a quitter to showing what it’s REALLY like to be a woman in tech. Whether you’re curious about what it’s like to manage a company like mine or you’re an entrepreneur yourself, here’s hoping this gives you some insight into what it’s like being a little fish in a very big pond!"
