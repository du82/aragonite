full_description = "Laurenloprete@gmail.com · twitter · medium · linkedin ExperienceCash App • RemoteDesign Director - Design Systems · August 2023 –PresentLeading the team responsible for the roll out of Cash Apps design system, which supports product on web, native app, and desktop. Focused on adoption and elevating craft. DROPBOX • San Francisco / SEATTLESenior Design Manager - Design Systems · October 2019 –PresentLeading the team responsible for a cross-platform, branded design system, which supports Dropbox core products on web, native app, and desktop. Focused on evangelizing adoption, migration, and community contribution models. Our system supports tokens, components, patterns, navigation, and IA principles. Currently managing seven designers.Expedia • SAN FRANCISCOLead Systems Designer · September 2018­–October 2019Strategic lead on the Design Systems team focused on unifying the end-to-end experience across platforms and Expedia Group brands. Lead redesign efforts on cross-product search, discovery, and global navigation. Facilitated design sprints cross-functionally. Influenced and collaborated with product and engineer across platforms.Senior Product Designer / Design Manager [player-coach] · January 2015­–September 2018Product designer for both iOS and Android platforms. Collaborated across product, design, and engineering. Designer on shopping path rewrites, universal checkout, and account creation. Redesign of global navigation across web and apps. Facilitated design sprints across the US and APAC, identifying key features for personalized travel experiences.CALIFORNIA COLLEGE OF THE ARTS • SAN FRANCISCO Web Designer · June 2013­–Jan 2015Lead designer focused on user experience, Information architecture, wireframing, and front-end design for school sites. Initiated brand standards across web and print-based communications. Art direction for marketing collateral.WEST OFFICE EXHIBITION DESIGN • OAKLANDUser Interface Designer · February 2012–April 2013D