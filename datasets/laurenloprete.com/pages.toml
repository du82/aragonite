full_description = "Scroll I’m a multi-disciplinary design leader that loves to talk about design systems, build things with my hands, and challenge current ways of working. My career has focused on up-leveling the craft of designers and the quality of user experiences. I thrive on cross-functional teams in strategic, player-coach roles. Currently, I lead the design systems team at Cash App. We maintain a cross-platform toolkit of foundational design decisions, platform-agnostic tokens, UI components, and patterns that are leveraged by teams across our product ecosystem. Previously, I led the design systems team at Dropbox, and before that I was a designer on design systems at Expedia. Recently, I spoke at Figma’s Schema Conference about Building Your Sphere of Influence and at Clarity Conference about Design System's Burnout. Let’s talk: Laurenloprete@gmail.com · twitter · medium · linkedin home"
