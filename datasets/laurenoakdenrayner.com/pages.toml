full_description = '''2017 in review: progress, problems, and predictions December 27, 2017December 28, 2017 ~ laurenoakdenrayner ~ 9 Comments 2017 was cool. Medical AI progressed apace, the AI community grew up some and got a bit creative, and I made some predictions that mostly held up to vague scrutiny. Exploring the ChestXray14 dataset: problems December 18, 2017December 18, 2017 ~ laurenoakdenrayner ~ 97 Comments A couple of weeks ago, I mentioned I had some concerns about the ChestXray14 dataset. I said I would come back when I had more info, and since then I have been digging into the data. I've talked with Dr Summers via email a few times as well. Unfortunately, this exploration has only increased my concerns about the dataset. Blog plans for 2018 December 9, 2017December 10, 2017 ~ laurenoakdenrayner ~ 2 Comments I have been doing a fair bit of thinking about the blog, and wanted to clue you all in on some changes. I had intended to finish my "The End of Human Doctors" series before moving on to anything else, and I even let some really cool topics pass me by to maintain continuity. It … Continue reading Blog plans for 2018 Do machines actually beat doctors? ROC curves and performance metrics December 6, 2017January 5, 2018 ~ laurenoakdenrayner ~ 41 Comments Deep learning research in medicine is a bit like the Wild West at the moment; sometimes you find gold, sometimes a giant steampunk spider-bot causes a ruckus. This has derailed my series on whether AI will be replacing doctors soon, as I have felt the need to focus a bit more on how to assess … Continue reading Do machines actually beat doctors? ROC curves and performance metrics'''
