full_description = "No Doctor Required: Autonomy, Anomalies, and Magic Puddings July 4, 2022 ~ laurenoakdenrayner ~ 8 Comments Fully autonomous medical AI is here, but are we treating it with the caution it deserves? Hi, I’m Lauren! A mini-guide for when your colleague comes out as trans. March 30, 2022April 5, 2022 ~ laurenoakdenrayner ~ 12 Comments For international transgender day of visibility, I thought I would put together a little guide for how to react to a colleague coming out as trans, nonbinary, or otherwise gender diverse. AI has the worst superpower… medical racism. August 2, 2021 ~ laurenoakdenrayner ~ 55 Comments Medical AI can detect the racial identity of patients from x-rays. This is extremely concerning, and raises urgent questions about how we test medical AI systems. 2020 and 2021 on the blog, for some reason with more emojis than strictly necessary January 2, 2021January 2, 2021 ~ laurenoakdenrayner ~ 4 Comments For those who don't know, I was on parental leave for almost all of 2020. Not only did this mean almost no research time, but it meant no blogging time as well. Of course, there were plenty of benefits! 😍👶😍👶😍👶😍👶😍👶😍👶😍👶😍👶😍 I still got 5 blog posts done this year, which I'm pretty amazed about given … Continue reading 2020 and 2021 on the blog, for some reason with more emojis than strictly necessary Docs are ROCs: a simple fix for a “methodologically indefensible” practice in medical AI studies. December 8, 2020 ~ laurenoakdenrayner ~ 21 Comments The way we currently report human performance systematically underestimates it, making AI look better than it is. It’s complicated. A deep dive into the Viz/Medicare AI reimbursement model. September 24, 2020September 24, 2020 ~ laurenoakdenrayner ~ 15 Comments CMS will reimburse an AI stroke detection model through Medicare/Medicaid. It is so darn complicated that it deserves a much deeper look. The medical AI floodgates open, at a cost of $1000 per patient. September 6, 2020September 9, 2020 ~ laurenoakdenrayner ~ 23 Comments AI is finally getting paid, apparently at a rate of $1000 per patient. What?"
