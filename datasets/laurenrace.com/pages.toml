["https://laurenrace.com/info/full-bio-lauren-race"]
title = "Full Bio - Lauren Race - Lauren Race"
description = 'I’m an accessibility designer, crafting and evaluating accessible experiences. I combine human-centered, multisensory, and co-design methods through product design, design systems/foundations, UX research, design reviews/WCAG audits, upskilling design orgs, and design strategy and innovation. My design journey began focusing on the visual, attending Pratt Institute to learn art and design and working as an artContinue reading "Full Bio – Lauren Race"'
full_description = "Full Bio – Lauren Race I’m an accessibility designer, crafting and evaluating accessible experiences. I combine human-centered, multisensory, and co-design methods through product design, design systems/foundations, UX research, design reviews/WCAG audits, upskilling design orgs, and design strategy and innovation. My design journey began focusing on the visual, attending Pratt Institute to learn art and design and working as an art director for over a decade. To shift from the brand to the user, I earned my master’s at NYU’s Interactive Telecommunications Program (ITP) in Tisch School of the Arts. There, I fell in love with accessibility design and expanded my design practice to include all sensory modalities. A multisensory approach removes access barriers for people with disabilities learning through touch, sight, and/or audio. Outside of work, I’m a volunteer at the Andrew Heiskell Braille & Talking Book Library’s Dimensions Lab where I develop nonvisual art and design techniques. I also teach graduate-level accessibility design at NYU ITP."
