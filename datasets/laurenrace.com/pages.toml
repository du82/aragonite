title = "Teaching - Lauren Race"
description = 'Teaching Graduate Courses Multisensory Design 10.20.2022 – PresentNYU ITP Developed and taught a brand new curriculum where we took a multisensory approach to design, making interfaces more accessible to disabled users. Students learned how to design for the senses (think tactile controls combined with atmospheric sounds and olfactory or taste experiences), while they gained anContinue reading "Teaching"'
full_description = "Teaching Teaching Graduate Courses Multisensory Design 10.20.2022 – PresentNYU ITP Georgina Kleege and Fayen d’Evie petting Purrlow, a cat-sized, rectangular fur pillow with a tail that purrs and smells like cat shampoo Student final project by Tom Xia, Shauna Wu, Vera Zhong, and Queenie Huang. “Omakase is an unusual dining experience where you are served a plate of visually ambiguous food to explore without tasting.” Developed and taught a brand new curriculum where we took a multisensory approach to design, making interfaces more accessible to disabled users. Students learned how to design for the senses (think tactile controls combined with atmospheric sounds and olfactory or taste experiences), while they gained an understanding of the assumptions we make about our users’ sensory preferences.Multisensory Design Class Website Museum Accessibility 1.30.2020 – 5.7.2020New York University TA’ed a course with Dr. Amy Hurst and Dr. Anita Perr, led reading discussion sessions, assisted with homework assignments and grading, and mentored final project for team that addressed accessibility of artifacts behind glass. Museum Accessibility Class Website Workshops Nonvisual Drawing 5.17.2022 – PresentAndrew Heiskell Braille & Talking Book Library Twitter NYC Two workshop drawings, Andrew Heiskell Braille & Talking Book Library In this hands-on nonvisual drawing workshop, we arranged still life scenes and figures using 3D touch objects and wooden mannequins. We explored tactile drawing techniques, such as continuous line and negative space, using Sensational Blackboards, ball point pens, and computer paper. Reviewing types of tactile media, Twitter NYC Nonvisual Soldering 2.28.2020 – 3.1.2020NYU ITP Seeking to learn how we can design curricula to increase access to learning soldering non-visually, we designed and evaluated a nonvisual soldering curriculum with a three-day workshop led by the founder of the Blind Arduino Project, Dr. Joshua Miele. Soldering Workshop Details Nonvisual Arduino 12.19.2019Andrew Heiskell Braille & Talking Book Library We taught a nonvisual Arduino workshop which revealed the complexities of designing textual descriptions and tactile graphics for Blind Arduino workflows. The findings led to design recommendations for future accessible electronics learning materials. Arduino Workshop Details Intro to Tactile Design 08.22.2019 – 8.16.2020A11y NYCfrogHunter CollegeAndrew Heiskell Braille& Talking Book LibraryMaryland School for the BlindNYC Media Lab Summit 2019NYU DesignLabNYU IDMNYU ITP Describing the best scenarios for making tactile graphics at A11y NYC Promoted inclusive design and accessibility awareness by framing tactile design as a useful collaborative tool and use case, provided hands-on experience by inviting attendees to design and produce their own tactile designs using microcapsule paper and a fuser. Using Sharpies to add carbon to microcapsule paper at frog Attendees touching example microcapsule tactile graphics at NYC Media Lab Summit 2019 No longer having access to NYU’s microcapsule fuser during Covid lockdown, I covered alternative tactile graphic design techniques using found materials to create Do It Yourself tactiles at home. We pressed pencils into paper on top of cutting boards to create reverse tactile graphics and scissors, glue, found objects, and hot glue to create raised collages."
