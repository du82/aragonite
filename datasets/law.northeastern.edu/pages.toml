bsolute best way to ensure that you graduate with the skills you’ll use daily in your career. We also offer dozens of courses designed to help you further hone those skills and develop focused abilities in the areas that interest you most, from corporate transactions to collective bargaining. Examples of skills-based courses include: Accounting and Finance for Lawyers Advanced Legal and Interdisciplinary Research Alternative Dispute Resolution Amicus Curiae Project Civil Rights and Restorative Justice Clinic Community Business Law Clinic Community Economic Development Seminar: Sustainable Income Development Constitutional Litigation Corporate Finance Domestic Violence Clinic Estate Planning Evidence International and Foreign Legal Research Immigrant Justice Clinic IP CO-LAB Lab Seminar in Applied Design and Legal Empowerment Law Practice Management Seminar: Access to Justice Legal Interviewing and Counseling Legal Research Workshop Legal Writing Workshop Master Class in Legal Design Negotiation Poverty Law and Practice Clinic Pretrial Civil Practice and Advocacy Prisoners’ Rights Clinic Public Health Legal Clinic Public Service Internship Quantitative Methods Transactional Drafting Seminar Trial Practice US Legal Research Upper-Level Courses"
