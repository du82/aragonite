description = "Quick Facts"
full_description = "Home / Admissions Admissions If you want rich, meaningful legal experiences working in the real world with real cases and clients — try us. Home / Admissions Admissions If you want rich, meaningful legal experiences working in the real world with real cases and clients — try us. Try us, Northeastern University School of Law If you like to try things, to really test things out — try us. If you want to craft your own education, chart your own path to legal practice — again, try us. With decades of experience in integrating theory and practice, Northeastern is the unparalleled leader in providing students with practical legal training. Be a leader, too — try NUSL. JD A rigorous curriculum, exceptional professors and unmatched experiential learning opportunities fuel Northeastern’s one-of-a-kind JD program. Learn More FlexJD The FlexJD allows you to complete flexible, part-time remote coursework on your own schedule combined with limited, required in-person instruction on our Boston campus. Learn More On-Campus LLM Take advantage of On-Campus LLM programs that are global, flexible and dynamic. Learn more Online LLM An industry-informed, globally focused online program taught by Northeastern faculty and working lawyers. Learn More Programs for Non-Lawyers Master the skills and language of the law necessary to advance your career through on-campus and online programs designed for working professionals. Learn more Visiting Scholars We are not currently accepting applications but look forward to welcoming legal scholars from across the globe in the near future. Learn more Quick Facts Tried and True We’re the top law school for experiential education with a deep commitment to social justice located in a world-class city. Of course, you want to know more. Here’s a start ... Faculty Our faculty is comprised of leading scholars and practitioners. They can’t wait to find out what makes you tick. Class Stats Everyone loves to compare apples to apples but keep in mind this is a law school where we’re most interested in what’s at your core. Annual Fees Financing your legal education shouldn’t give you an ulcer. Talk to us about financial aid options. About Our Students All Pathways Julius Halstead ’19 Associate, Goulston & Storrs, Boston Read My Story Alison Bolivar ’11"
