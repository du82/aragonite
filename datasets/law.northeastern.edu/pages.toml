["https://law.northeastern.edu/admissions/jd/admissions-policy"]
title = "Admissions Policy - School of Law"
full_description = "Chase Strangio ’10 Deputy Director for Transgender Justice, ACLU’s LGBT & HIV Project, New York Read My Story Home / Admissions / JD / Admissions Policy Admissions Policy Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us At Northeastern University School of Law, our mission is to fuse theory and practice with ethical and social justice ideas so that students understand what it is lawyers do, how they should do it and the difference they can make in the lives of others. We strive to produce lawyers who see the practice of law as a way to realize their goals, to find meaning and purpose in life, and to be of service to others in ways that are intellectually satisfying and personally rewarding. To be eligible for admission, a candidate must have earned a bachelor’s degree from an accredited college or university by the time of law school matriculation. In making admission decisions, Northeastern University School of Law gives weight to the undergraduate GPA, LSAT score and other factors candidates bring to the process. For example, in making admissions decisions, the Admissions Committee considers letters of recommendation, essays, graduate training, special academic distinctions or honors, difficulty of the academic program completed, work experience and significant achievement in nonacademic activities or public service. If it appears that an applicant experienced disadvantages that adversely affected her or his past performance, this is considered in assessing the applicant’s potential to distinguish himself or herself in the study and practice of law. Northeastern seeks a student body with a broad set of interests, backgrounds, life experiences and perspectives. Such diversity is important in a law school which must train its graduates not only to analyze and interpret the law, but also to reflect on competing viewpoints, advance arguments persuasively in a variety of forums and develop policies affecting a broad range of people. Historically, the School of Law’s diverse student body has produced graduates who have worked internationally, served all segments of society, and who have become leaders in many fields of law. Exposure to a wide array of ideas, outlooks and experiences is an important part of our students’ educational and professional development. Through the admissions process, the law school seeks to select students who will attain the highest standards of professional excellence and integrity, and who will bring vision, creativity and commitment to their professional endeavors. To ensure compliance with American Bar Association (ABA) reporting requirements, our law school includes an optional question on applicants' ethnic identity. This information is treated with confidentiality and has no impact on the admission decision-making process or your application file. We value fairness and inclusivity in our admissions process and thank you for your cooperation in providing this optional information to meet ABA standards. Apply Now Request Information Viewbook Types of Admission First-Year JD Applicants Our signature JD program includes almost a year of full-time legal work experience. FlexJD Applicants Our part-time, online and on-campus FlexJD program offers students a flexibile option to earn a JD. Foreign-Trained Lawyers Northeastern welcomes applications for the JD program from students who already hold a degree from a law school outside the US. Transfer Applicants Northeastern welcomes qualified applicants who have completed their first year of study at another ABA-approved law school. Visiting Students Students from other ABA-accredited law schools can apply to our visiting student program. Pathways to Success All Pathways Chase Strangio ’10 Deputy Director for Transgender Justice, ACLU’s LGBT & HIV Project, New York Read My Story Regina Fountain ’19"
