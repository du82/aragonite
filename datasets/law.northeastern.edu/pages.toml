["https://law.northeastern.edu/academics/programs/jd/jdx-certificates/sustainability-and-climate-change"]
title = "Sustainability and Climate Change - School of Law"
full_description = "Home / Academics / Programs / JD / JD x Certificates / Sustainability and Climate Change Sustainability and Climate Change Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources JD x Graduate Certificate in Sustainability and Climate Change As a lawyer, you need to understand the needs and goals of your clients and the context for the legal work you are doing. To provide you with the big picture in a specific area of expertise, Northeastern University School of Law offers a range of certificates that are interdisciplinary, bringing together the unique strengths of our law school and global university, and our leadership in experience-based education. With a JD x Graduate Certificate in Sustainability and Climate Change Policy, you’ll multiply the options open to you as a lawyer and develop real expertise. The interdisciplinary Graduate Certificate in Sustainability and Climate Change Policy, offered by the School of Public Policy and Urban Affairs within the College of Social Science, is designed to prepare students for the dynamic, evolving landscape of climate and sustainability policy. The program encompasses a wide range of courses including those focused on sustainable energy, climate solutions, energy democracy, environmental law, energy law and policy, energy justice and more. Given the growing need in every organization, including private sector, public sector and nonprofits, for professionals with knowledge and training in how to respond to the rapidly changing policy and regulatory frameworks in climate and sustainability, the Graduate Certificate in Sustainability and Climate Change Policy will prepare you to hit the ground running on day one of your legal career. Sample Courses Cities, Sustainability and Climate Change Climate and Development Energy Law and Policy Energy Justice: Theory, Law and Policy for a Just, Clean Energy Transition Energy Law and Policy Environmental Law Food Systems and Public Policy International Environmental Policy >> Requirements Candidates interested in this certificate program must independently apply and gain admission to the certificate through the College of Social Sciences and Humanities. Additional Sustainability and Climate Change Opportunities The Center for Public Interest Advocacy and Collaboration (CPIAC) takes the lead in infusing the law school’s public interest mission into all facets of the student experience. While supporting the law school’s long-standing commitment to social justice, the center also pilots programs and initiatives that address broader justice issues. The Northeastern Environmental Law Society (NELS) is an organization dedicated to promoting awareness about environmental concerns, issues, and problems within the legal community. Our goals are to bridge the communication and information gap between the scientific and political/legal communities and to enhance the law school experience for students interested in environmental issues and environmental justice confronting Boston, Massachusetts and other regions. Concentrations and course offerings may vary by campus and/or by program modality. Please consult with your advisor or admissions coach for the course availability each term at your campus or within your program modality. Certain options within the program may be required at certain campuses or for certain program modalities. Please consult with your advisor or admissions coach for requirements at your campus or for your program modality."
