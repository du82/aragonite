title = "Employers and Partners - School of Law"
full_description = "Home / Employers and Partners Employers and Partners Employers and Partners Employers and Partners Services for Employers Post Jobs Interview Students Offer a Co-op Program Information and Employer Requirements Co-op Employer FAQs The Office of New Markets Events Employers and Partners Services for Employers Post Jobs Interview Students Offer a Co-op Program Information and Employer Requirements Co-op Employer FAQs The Office of New Markets Events The Value of Being Involved Law firms and organizations of all types and sizes that partner with Northeastern University School of Law enjoy a mutually beneficial relationship, resulting in high-quality, cost-effective legal assistance and efficient, diversified recruitment opportunities. As a result of our Cooperative Legal Education Program, our students have much more practical experience than those from other law schools. From the moment they begin their studies, Northeastern students tackle real client work through our unique Legal Skills in Social Context program, learning valuable lawyering skills while preparing for the complex challenges of their first co-op. By the time they graduate, our students already have almost a year of full-time work experience under their belt. Northeastern students are motivated, capable, mature and intelligent, and they can handle the responsibility of delivering real value on projects of critical importance to your business. We greatly appreciate our partners and the opportunities they provide to our students, and we work to ensure that a proper match is made and that all parties are satisfied with each engagement. For more information or to become an employer or partner, please contact the Center for Co-op and Career Development. Symplicity Login Post Jobs Contact Us"
