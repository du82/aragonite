title = "The Action Lab at the Center for Health Policy and Law - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / The Action Lab at the Center for Health Policy and Law The Action Lab at the Center for Health Policy and Law Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes The Action Lab at the Center for Health Policy and Law With Professor Leo Beletsky at the helm, The Action Lab at the Center for Health Policy and Law is guided by a vision of a healthier, more just society, and advances criminal justice reform through a public health lens. Engaging with academic, community, public and private partners, it informs responses to today’s most critical community challenges. This includes reducing drug overdose; improving access to effective, safe and cost-effective healthcare; and aligning law enforcement practices with public health goals. True to Northeastern University School of Law’s mission, The Action Lab at the Center for Health Policy and Law portfolio provides experiential learning opportunities to prepare the next generation of leaders in legal, health and social policy profession. Follow us on Twitter"
