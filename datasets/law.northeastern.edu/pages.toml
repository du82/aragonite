["https://law.northeastern.edu/academics/centers/global-law-and-justice"]
title = "Center for Global Law and Justice - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / Center for Global Law and Justice Center for Global Law and Justice Center for Global Law and Justice Center for Global Law and Justice About Us Events Fall Speaker Series Valerie Gordon Human Rights Lecture For Students Initiatives News Center for Global Law and Justice About Us Events Fall Speaker Series Valerie Gordon Human Rights Lecture For Students Initiatives News The Center for Global Law and Justice at Northeastern University School of Law employs innovative and collaborative approaches to address the most urgent global challenges of our time. We focus on global injustice and diverse forms of inequality and subordination through our commitments to promoting human rights, humanitarianism, climate justice, fair governance and democracy. Our work is guided by Northeastern University’s distinguished international law faculty and enhanced by collaborations with scholars and practitioners worldwide. We combine scholarship and practice with a keen commitment to the training of the next generation of advocates and scholars. Our approach is interdisciplinary, strategic and grounded in an appreciation for community leadership and experiential learning. Contact Us Join Our Mailing List Center Launch Event CGLJ hosted an official launch event at Northeastern University’s John D. O’Bryant African American Institute on October 24. The event featured an address by Justice Natalia Ángel Cabo of the Constitutional Court of Colombia. The afternoon program also offered an opportunity to learn more about the center’s vision, upcoming projects and how it aims to shape the future of global justice. Fall 2024 Speaker Series CGLJ hosted an inaugural speaker series this fall, Issues in Human Rights and Humanitarian Law, that was open to the Northeastern University community and the general public. Guest speakers included: Tom Dannenbaum, associate professor of international Law at The Fletcher School at Tufts University; Karen Engle, Minerva House Drysdale Regents Chair in Law and founder and co-director of the Bernard and Audre Rapoport Center for Human Rights and Justice at the University of Texas at Austin School of Law; Vasuki Nesiah, professor of practice at the New York University Gallatin School of Individualized Study; James Cavallaro, professor of the practice at Wesleyan University and co-founder and executive director of the University Network for Human Rights; and Miriam Ticktin, professor of anthropology and director of the Center for Place, Culture and Politics at CUNY Graduate Center. Partners and Initiatives International Social and Economic Rights Project (iSERP) iSERP is an informal, international network of lawyers, judges, other human rights advocates, and academics focusing on Social & Economic Rights (SER). Program on Human Rights and the Global Economy The Program on Human Rights and the Global Economy (PHRGE) is the center of human rights research and scholarship at Northeastern University School of Law. PHRGE provides many opportunities for faculty, law graduates and current students to work on promoting and implementing human rights, particularly economic, social and cultural rights. Program on the Corporation, Law and Global Society The Program on the Corporation, Law and Global Society fosters interdisciplinary research and discussion among scholars, policymakers and advocates to examine the corporation as an institutional form with social significance akin to the state, the family or the city. CGLJ in the News Local Abortion Restrictions Preempted in New Mexico “In the whack-a-mole post-Dobbs world, every state can interpret its own parameters of state preemption,” writes Professor Martha Davis in her latest piece for the State Court Report. Can Sanctuary Cities Survive the Second Trump Administration? In a piece for the State Court Report, Professor Martha Davis examines the avenues available to cities to preserve local autonomy in the face of looming changes to federal immigration policy. Professor Martha Davis Co-Authors Amicus Brief in New Mexico Environmental Protection Case Professor Martha Davis is of counsel on an amicus brief filed in a New Mexico case, Atencio v. State, in which plaintiffs assert that state of New Mexico and other state defendants violated the plaintiffs’ rights under the New Mexico Constitution by continuing to authorize and promote oil and gas production without assuring protection of the environment. Where Do We Go From Here? Northeastern Law’s Centers of Excellence Explore the Ramifications of the 2024 Presidential Election Northeastern Law’s five centers of excellence recently convened a panel to explore the potential ramifications of the 2024 presidential election. Recent Video and Photo Galleries 2025 Daynard Roundtable: Azadeh Shahshahani View Photos CGLJ Speaker Series James Cavallaro View Photos Center for Global Law and Justice Launch Event Video View Video Center for Global Law and Justice Launch Event View Photos “Siege Starvation: A War Crime of Societal Torture” View Video"
