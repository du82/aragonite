["https://law.northeastern.edu/experience/lssc"]
title = "Legal Skills in Social Context - School of Law"
description = "LSSC Celebrates 20 Years of Social Justice Impact in Legal Training"
full_description = "Home / Experiential Learning / Co-op / Legal Skills in Social Context Legal Skills in Social Context Experiential Learning / Co-op Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success Legal Skills in Social Context The Legal Skills in Social Context program offers both first-year students and nonprofit or government organizations an extraordinary opportunity to work together on a social justice project. Students are introduced to the core skills of effective team lawyering and given an opportunity to put them into practice through an extensive legal research project on behalf of a public-service partner organization. The course is taught by a team of full-time faculty with assistance from upper-level student fellows. Students gain experience conducting legal research, writing clear and persuasive legal documents, performing client representation duties and practicing critical analysis and oral skills while working as a team. Organizations that might not otherwise have the resources for these important projects, come away with high-quality work products, such as plans, impact reports and practitioner’s manuals that can be implemented to achieve social justice objectives. Information for Students Information for Partners LSSC Celebrates 20 Years of Social Justice Impact in Legal Training For more than two decades, every Northeastern law student has participated in Legal Skills in Social Context (LSSC), our unique first-year social justice program that prepares students to use law as a tool for social change. Participating clients, faculty and students reflect on the program’s history and impact."
