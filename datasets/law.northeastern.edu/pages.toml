title = "Application Process - School of Law"
full_description = "Home / Admissions / FlexJD / Application Process Application Process Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us FlexJD Applications Process To be eligible for admission, a candidate must have a bachelor’s degree from an accredited college or university by the time of law school matriculation in August. Students must have strong academic credentials and the ability to transfer their classroom learning into practical legal skills. While no specific field of undergraduate study or prior work experience is required, the mastery of oral and written communication skills, a capacity for independent research and the ability to analyze problems and to exercise critical judgment are essential to successful legal study. In making a determination with respect to each application, we consider academic criteria, including undergraduate grades and LSAT score, as well as other accomplishments, work experience, significant community involvement, the personal statement, recommendations from individuals who know the candidate well and any other relevant information. Admissions decisions for the FlexJD program are made on a rolling basis. The School of Law does not offer binding early decision (ED) or early action (EA) options for FlexJD applicants. Online Information Sessions During our information sessions, we'll share information about the FlexJD application process and tell you more about what sets Northeastern Law apart — from our innovative Cooperative Legal Education Program (co-op) to our commitment to social justice and our supportive atmosphere. Tuesday, March 25 – 5:00 PM (ET) – Register Here Monday, April 22 – 5:00 PM (ET) – Register Here Transfer Applicants Northeastern welcomes qualified applicants who have completed their first year of study at another ABA-approved law school. >> Learn more Apply Request Information Application requirements To apply, submit the following: Application by May 1 Résumé Personal statement Current CAS report that includes LSAT score(s) (no more than 5 years old), one letter of recommendation, and all required transcripts There is no application fee. Contact Us If you have any questions about the FlexJD, please schedule an appointment with an enrollment specialist. Phone: (617) 203-7228 Email: FlexJD@northeastern.edu Disclosures Some law schools may not accept transfer credits from this program. Students applying to the FlexJD program should check with the jurisdictions in which they may seek admission to the bar to ensure that graduation from this program will make them eligible for taking the bar exam and being admitted to the bar in those jurisdictions. Because of the limits certain states place on the use of distance education, FlexJD students cannot currently sit for the bar exam in New York or Alabama. For detailed information on professional licensure disclosures, please visit our Professional Licensure Disclosure Page. For questions regarding professional licensure, please contact Associate Teaching Professor and Assistant Dean of the Bar Success Program Antoinette Coakley at a.coakley@northeastern.edu. Character and Fitness Requirements In addition to a bar examination, there are character, fitness, and other qualifications for admission to the bar in every U.S. jurisdiction. Applicants are encouraged to determine the requirements for any jurisdiction in which they intend to seek admission by contacting the jurisdiction. Addresses for all relevant agencies are available through the National Conference of Bar Examiners. Meet Our Faculty Aliza Hochman Bloom Assistant Professor of Law Yale University, BA 2005 Columbia University School of Law, JD 2009 View Profile Sharon Persons Associate Teaching Professor and Director, Law Library Columbia University, BA 1992 Stanford Law School, JD 1996 Simmons College Graduate School of Library and Information Science, MLIS 2004 View Profile Victoria McCoy Dunkley Associate Teaching Professor University of Texas at Arlington, BA 2004 University of Texas at Arlington, MBA 2004 Vanderbilt University Law School, JD 2009 University of Houston Law Center, LLM 2013 View Profile Bruce Jacoby Clinical Professor of Law; Director, Intellectual Property Law Clinic Friends World College, BA 1974 University of Connecticut School of Law, JD 2003 View Profile Martha Davis University Distinguished Professor of Law; Co-Director, Center for Global Law and Justice; Co-Director, Program on Human Rights and the Global Economy; Faculty Director, NuLawLab Harvard University, AB 1979 Trinity College, Oxford University, MA 1981 University of Chicago, JD 1983 View Profile Sonia Rolland Professor of Law Institut d'Études Politiques de Paris (France), BA 1999 Université Paris-10 (France), MA 2000 University of Michigan, JD 2003 Cambridge University (UK), PhD 2009 View Profile All Faculty"
