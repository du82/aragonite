["https://law.northeastern.edu/faculty/coakley"]
title = "Coakley, Antoinette - School of Law"
full_description = "Antoinette Coakley Associate Teaching Professor and Assistant Dean of the Bar Success Program Education Harvard-Radcliffe College, AB 1992 Harvard Law School, JD 1995 Cornell University, Diversity and Inclusion Certificate 2022 Bio Professor Coakley, an educator and corporate transactional attorney with more than 25 years of experience, joined the law school faculty in 2022 as associate teaching professor and assistant dean of the Bar Success Program. Prior to Northeastern, Professor Coakley served as director of business and regulatory law for Retail Business Services, a division of Ahold Delhaize, a multi-billion dollar international grocery retail company operating supermarkets and e-commerce retail operations in the US and in Europe, including Stop & Shop, Giant, Giant/Martin’s, Food Lion and Hannaford supermarket chains, the Peapod online grocery service and Peapod Digital Labs (eCommerce and digital support services). During her tenure at the Ahold Delhaize companies, Professor Coakley served as a trusted legal advisor and strategic thought partner to her business partners on a diverse array of commercial and regulatory matters, including contract negotiation, vendor policies and dispute resolution, antitrust and contracts compliance training, antitrust litigation and government inquiries, data monetization deals, data privacy matters, regulatory and corporate compliance matters. Prior to working for the Ahold Delhaize companies, Professor Coakley was a corporate associate at the law firm of Ropes & Gray in Boston. A native of Boston, Professor Coakley is active in her community. She currently serves as a board member and clerk for CommonWealth Kitchen, a Boston nonprofit food business incubator that assists small local food businesses (primarily minority and women-owned) to be successful. She is a former director and co-chair of the board of directors of The Freedom House, a local Boston nonprofit that helps inner-city youth create pathways to success through education, community service and leadership development. Professor Coakley graduated cum laude from Harvard-Radcliffe College, with an AB degree in government, earned her JD from Harvard Law School and is an alumna of Boston Latin Academy. In 2022, she completed a Diversity and Inclusion Certificate Program at Cornell University. Fields of Expertise Commercial Law Corporate Law Negotiation Antoinette Coakley Associate Teaching Professor and Assistant Dean of the Bar Success Program Contact Email a.coakley@northeastern.edu Tel 617.373.7620 Curriculum Vitae"
