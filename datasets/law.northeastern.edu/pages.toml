full_description = "Home / Academics / Areas of Study / Privacy Privacy Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Privacy Are you concerned about Big Tech companies tracking your every move online? Do you worry that the government has the technological tools to surveil and arrest peaceful protestors? If so, you may just find your niche in privacy law and policy. What are the laws and policies — and what should they be moving forward — governing the commercial and governmental use of digital technologies, artificial intelligence and other tools of surveillance? As a Northeastern student, you’ll have unrivaled opportunities to explore these questions and more through dynamic courses, clinics and co-ops across the globe. Check out our Center for Law, Information and Creativity (CLIC), where “the future is just a CLIC away.” At Northeastern, you’ll have unparalleled opportunities to dive into privacy law and position yourself as a leader in the field. Apply Now Interdisciplinary Advantage JD x Certificates Bioethics and the Law Criminal Justice Employment Law Employment Law Health Law Information Privacy Law Information Security Law Inside Counsel Laboratory Seminar in Applied and Critical Legal Design Law and Biotechnology Law and Technology AI Ethics (PHIL 5010) Big Data for Cities (PPUA 5262) Consumer Behavior (MKTG 6226) Cyberlaw: Privacy, Ethics and Digital Rights (CY5240) Data Management in Healthcare (HINF 5102) Digital Marketing (MKTG 6222) Information Ethics (PHIL 5005) Introduction to Health Informatics and Health Information Systems (HINF 5101) Marketing Research (MKTG 6210) Perspectives on News Media Ethics and Diversity(JRNL 6202) Personal Health Interface Design and Development (HINF 5300) Security and Resilien