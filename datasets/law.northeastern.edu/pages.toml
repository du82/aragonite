["https://law.northeastern.edu/admissions/flexjd"]
title = "FlexJD - School of Law"
full_description = '''Home / Admissions / FlexJD FlexJD A top legal education that's flexible for today's professionals. Request Information Apply Now Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Download Program Overview Northeastern Law’s full-time, on-campus trajectory to pursue a law degree doesn’t fit everyone. We get it. That’s why we developed the FlexJD — an ABA-accredited, part-time, primarily online program to meet the needs of working professionals. The flexibility of the FlexJD program and hybrid format provide access to students across the nation who are eager to take advantage of Northeastern Law’s signature Cooperative Legal Education Program and rigorous curriculum but are not necessarily based in the Boston area. Why choose the FlexJD program? You don’t have to leave your full-time job Designed for working professionals like you, earn your JD part time in 4 years with a flexible hybrid format. You can earn your JD from home with limited visits to campus The majority of coursework is offered online (live classes, two nights per week as well as asynchronous classes) with limited Law On Campus intensives (six total, four days each). You can build your résumé while you earn your JD Get hands-on, real-world experience through our unparalleled co-ops and experiential learning opportunities. You can tailor your JD to your career goals Choose from a variety of electives in areas like intellectual property, international law, public health law and more. Northeastern by the Numbers Ranked in the top 50 universities in the United States (U.S. News and World Report) Ranked in the top 15 most innovative universities (U.S. News and World Report) A+ Grade for practical training awarded by The National Jurist/preLaw Request Information Apply Now Download Program Overview To learn more about Northeastern Law’s FlexJD program, complete the form to the right and download the program overview information sheet. You can also call us at 617.203.7228 to talk with one of our admissions representatives or schedule an appointment to speak with us. hbspt.forms.create({ region: "na1", portalId: "3935539", formId: "f965ddb8-c900-476f-bf5f-cde262f4d7e2" }); Key Program Information Upcoming Term Fall 2025 Application Deadline May 1, 2025** Total Annual Tuition $48,761* *Scholarships and financial aid are available for qualifying students. Please visit the financial aid page to learn more. **The Fall 2026 application will be released in early September 2025. FlexJD Program Format Remote, Online Instruction The majority of the FlexJD program instruction is conveniently delivered through dynamic, remote coursework and complemented by periodic on-campus intensives. The remote coursework incorporates weekly live, online courses with self-paced, recorded coursework that you complete on your own schedule. For the fall 2024 semester, live, online courses will be scheduled two evenings per week.* The dynamic remote coursework includes reading and writing assignments, assessments and discussion board contributions. *Eastern time. Exceptions to schedules may occur. On-Campus Intensives If you live in the Boston area, great. You already know how much New England has to offer. For those of you who want to spend more time in this vibrant city, take your first “T” ride or catch a Boston Red Sox or Celtics game while in town for Law On Campus intensives. During these required, on-campus intensives, held at Northeastern’s Boston area campuses, you’ll meet your classmates and faculty in person and build upon the foundation you have created online. Beginning with orientation and continuing through graduation, the required on-campus intensives provide unparalleled opportunities to develop a strong sense of community and shared goals while advancing your legal education. Over the course of the four-year FlexJD program, you are required to complete six on-campus intensives bound to the curriculum, each approximately four days long and scheduled around weekends. Three of these intensives will occur during the first-year curriculum, with the remaining three periods take place in the upper-level years (the last two during your final two semesters). >> Learn more about Law On Campus Four-Year Curriculum In the FlexJD program, your courses will be spread over four years rather than the full-time, three-year JD program, allowing you to balance your professional and personal commitments with pursuing your law degree. As a FlexJD student, you’ll experience Northeastern’s foundational first-year JD curriculum. You’ll also have access to a broad range of opportunities and upper-level courses, including clinical and skills-based courses to build your professional skills. See FlexJD curriculum here. The FlexJD program is an 11 semester cohorted program that commences in the fall semester and ends with the summer semester. After your four years, you’ll be ready to sit for the bar** and practice law — armed with unparalleled depth of knowledge and an abundance of legal experience. FlexJD students also have the support of dedicated FlexJD faculty and staff, as well as 24-7 technical support. Students have an opportunity to apply to switch to the full-time program after the 1L curriculum, upon approval of the academic dean. >> View FlexJD Currciulum **Students applying to the FlexJD program should check with the jurisdictions in which they may seek admission to the bar to ensure that graduation from this program will make them eligible for taking the bar exam and being admitted to the bar in those jurisdictions. Because of the limits certain states place on the use of distance education, FlexJD students cannot currently sit for the bar exam in New York or Alabama. Signature Cooperative Legal Education Program You are required to complete one semester-long co-op, which will be a field placement with concurrent enrollment in a reflections seminar. One additional semester-long practical experience is also required, which could be a co-op, field placement, or approved experiential project. Each practical experience must total a minimum of 275 hours of work during the non-academic semester. This means that the only course you are required to take while they are on co-op, is a reflections seminar course during your second co-op (in your third summer). Aside from that course, you will focus solely on your co-op during each experiential term (2 total). On average, FlexJD students complete 20 hours of co-op work each week. Based on current FlexJD co-ops, we’ve typically seen this broken down into 1–2 hours per week during traditional hours (9 am–5 pm) and 18–19 hours per week during personal time Throughout your time at Northeastern Law, you will benefit from one-on-one guidance from an experienced advisor in the Center for Co-op and Career Development. Together, you’ll chart a strategy through the co-op program designed to help you gain the relevant experience, comprehensive skills and professional networking contacts to forge a meaningful and fulfilling path through law school and beyond. Additionally, you’ll have access to a network of over 1,000 co-op employers in 40 states and 71 countries, plus you are welcome to find your own co-op positions as well. Download our co-op overview to learn more about FlexJD co-ops including a list of recent FlexJD co-op employers and examples of co-ops that FlexJD students have recently completed. Questions? Schedule an appointment to speak with a Northeastern Law admissions representative. Schedule Appointment Application Requirements To apply, ensure the following have been submitted: Application by May 1, 2025* Résumé Personal statement Optional Essay Responses Current CAS report that includes LSAT score(s) (no more than 5 years old), one letter of recommendation, and all required transcripts There is no application fee. Apply now! Review Application Process Download Application Checklist * The Fall 2026 application will be released in early September 2025 FlexJD Student Testimonials “With the assistance of my co-op advisor, I found a co-op with a judge in Cambridge juvenile court. For this co-op, I negotiated the hours I would be in-person and the number of hours I would work from home. So, when I’m in person at court, I observe procedures, trials and hearings. When I’m at home, I’m working on legal writing and research projects for the judge. Please let me know if you have any questions!” - Jalon F. ’25 “I came across Northeastern’s FlexJD program and was immediately drawn to its flexibility. I ended up choosing FlexJD for this reason—flexibility. I was further attracted to the social justice-focused curriculum, co-op program, and overall sense of community Northeastern Law offered.” - Rachel V. ’25 “The main reason I chose Northeastern was because of co-op. While working full time in a non-legal job, I am still able to get the co-op legal experience as part of the curriculum. It’s also been great to make connections with other students in the program, who work in so many different fields. I know some people in my Legal Skills in Social Context law office are in finance, some people are paralegals, some work in land ownership offices, some work in labs that do blood testing and others are firefighters. You get to learn so much about people’s lives and how everything that you do intersects somewhere legally. You make connections with people who become not only your friends, but are also imperative to your legal education and career.” - Ellie F. ’26 Check Out More Student Stories Request Information Complete the form below to get more information on the FlexJD program and connect with a member of our admissions team. hbspt.forms.create({ region: "na1", portalId: "3935539", formId: "5f900d21-08e9-4ccd-a2c0-8758a8b418c6" });'''
