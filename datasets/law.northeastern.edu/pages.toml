full_description = "Home / Academics / Programs / JD / Dual Degrees Dual Degrees Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Dual-Degree Programs for JD Students The School of Law’s dual-degree programs offer students a dynamic opportunity to focus on interdisciplinary study. Our partnerships with Tufts University School of Medicine and Vermont Law School provide students with access to two outstanding, specialized programs — both leaders in their respective fields. And, our dual-degree programs within Northeastern University allow students to take advantage of the world-class resources here on our own campus. Other Programs Applicants interested in pursuing a specific area of study in connection with or related to their legal studies at Northeastern may make arrangements to pursue a second degree concurrently, either through other colleges at Northeastern or with independent colleges or universities in the Greater Boston area. The applicant must gain approval of the dean in advance and assume the responsibility and burden of making the necessary arrangements. Apply Now Areas of Study JD x Certificates JD/MBA Business Administration JD/MS and JD/PhD in Criminal Justice JD/MSA/MBA in Professional Accounting JD/MPH with Northeastern University Bouvé College of Health Sciences JD/MPH with Tufts University School of Medicine JD/MPP in Public Policy"
