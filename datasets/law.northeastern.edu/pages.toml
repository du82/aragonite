["https://law.northeastern.edu/academics/areas-of-study/immigration"]
title = "Immigration - School of Law"
full_description = "Home / Academics / Areas of Study / Immigration Immigration Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Immigration With so much political and media attention focused on immigration, there’s a lot to unpack and understand. That’s why Northeastern Law offers a dynamic mix of courses and hands-on opportunities to explore this complex field of law. In our Immigrant Justice Clinic, you’ll represent real-life clients, handling applications for asylum, U-visas, T-visas and other forms of relief. There are also opportunities to travel to the border with Mexico to assist with refugee and asylum cases and to explore your specific focus areas through independent studies. In our clinic, in courses taught by faculty who are renowned immigration scholars and advocates and through co-ops across the globe, you’ll have unparalleled opportunities to dive into immigration law and position yourself for leadership in the field. You can also engage with our Center for Global Law and Justice and the Program on Human Rights and the Global Economy. Together, they focus on global injustice and diverse forms of inequality and subordination through commitments to promoting human rights, humanitarianism, climate justice, fair governance and democracy. Apply Now Interdisciplinary Advantage JD x Certificates Crimmigation Human Rights in the United States Immigration Law Information Security Law International Human Rights and the Global Economy Laboratory Seminar in Applied and Critical Legal Design Law and Economic Development Law and Inequality Refugee and Asylum Law ACLU, Immigrants’ Rights Project Demissie & Church Florence Immigrant and Refugee Rights Project Fragomen Goss Associates Greater Boston Legal Services, Immigration Unit Khanbabai Immigration Law Mintz MT Law National Immigrant Justice Center Northwest Immigrant Rights Project Parker Gallini Project Citizenship Students for Immigration Justice Clinics Immigrant Justice Clinic Domestic Violence Clinic Prisoners’ Rights Clinic Centers, Institutes and Programs Center for Global Law and Justice Center for Health Policy and Law Center for Law, Equity and Race (CLEAR) Center for Public Interest Advocacy and Collaboration NuLawLab Program on Human Rights and the Global Economy Representative Faculty Hemanth Gundavaram Clinical Professor Associate Dean for Academic Affairs Director, Clinical Programs Director, Immigrant Justice Clinic View Profile Anne Georges Interim Co-Director, Immigrant Justice Clinic View Profile Rachel Rosenbloom Professor of Law View Profile"
