["https://law.northeastern.edu/academics/centers/health-law"]
title = "Center for Health Policy and Law - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / Center for Health Policy and Law Center for Health Policy and Law Center for Health Policy and Law Center for Health Policy and Law About Us Health Law Scholars News Events Annual Conference Annual Lecture Academic Programs Affiliated Courses Center for Health Policy and Law About Us Health Law Scholars News Events Annual Conference Annual Lecture Academic Programs Affiliated Courses We Have a Healthy Interest in Making the World a Better Place At Northeastern University School of Law, we focus on health law through a dynamic, interdisciplinary approach that integrates a wide variety of practical and research interests. Our Center for Health Policy and Law provides a rich context for students and researchers interested in public health law, health and human rights, health governance, health care financing, drug law, intellectual property, bioethics, healthcare delivery law and the regulation of our health care systems. It is guided by faculty with diverse areas of expertise and is affiliated with an array of university-wide institutes, programs and experiential learning opportunities. In addition to offering a broad curriculum in health and public health law, the center sponsors conferences, lectures, colloquia, the Health Law Student Association and workshops that introduce students to career opportunities in the growing field of health law and policy. Students benefit from the school’s signature Cooperative Legal Education Program. With opportunities extended by more than 1,100 employers, all JD students are guaranteed three full-time work experiences. For those students interested in careers in health law, there are opportunities to spend co-ops working with NGOs, law firms, government offices and companies that specialize in health-related fields. Students in the JD program are offered two outstanding dual-degree MPH program options: with Tufts University School of Medicine as well as Northeastern University’s Bouvé College of Health Sciences. The School of Law and Bouvé share a number of faculty appointments in both healthcare and law, providing students with an integrated approach to both teaching and experiential opportunities. JD students may also opt to earn a certificate in health policy and law. Students in the LLM program are offered a special concentration in health policy and law, which is designed to meet the needs of lawyers who want to enhance their practical skills and substantive knowledge as well as lawyers aiming to enter the field. This in-depth program helps prepare lawyers who aim to work with health care providers and insurers, government regulatory agencies, firms handling pharmaceutical products liability and toxic tort cases, and NGOs and community-based organizations in the United States and abroad, among others. All Northeastern law students and faculty are also invited to join in the work of the university’s outstanding institutes and programs dedicated to health law, including the Public Health Advocacy Institute (PHAI), the Program on Human Rights and the Global Economy (PHRGE), the Center for Health Policy and Healthcare Research, the Institute for Health Equity and Social Justice Research, the Domestic Violence Institute (DVI), and the Action Lab. In addition, upper-level students may participate in one of the school’s health-related clinics, including the Domestic Violence Clinic, Poverty Law and Practice Clinic and the Public Health Legal Clinic. In recognition of the law school's leadership in this field, U.S. News and World Report ranks Northeastern No. 7 for health care law. Join Our Mailing List Follow @NUSLHealth Contact Us Northeastern University School of Law is ranked No. 7 for health care law in U.S. News & World Report’s 2025 rankings. Partners and Initiatives The Action Lab The Action Lab focuses on the role of criminal law, abusive policing and the broader criminal justice system as a structural determinant of health. The lab generates knowledge, translates knowledge into policy and implements programs on the ground to improve public health through criminal justice reform. Salus Populi Salus Populi: Educating the Judiciary about the Social Determinants of Health is a project in collaboration with the Center for Health Policy and Law at Northeastern University School of Law and the Institute for Health Equity and Social Justice Research at Northeastern University that seeks to provide guidance and training to judges on the impact of the law on the social determinants of health. Public Health Law Watch The Public Health Law Watch (PHLW) is a collaborative initiative of the George Consortium. PHLW focuses on identifying potential legislative and regulatory changes at the federal, state and local level that have the potential to impact public health. CHPL in the News The Man Who Took On Big Tobacco Has a New Target: Sports Betting, TIME profiles Professor Richard Daynard, president of Northeastern Law’s Public Health Advocacy Institute, and his pioneering efforts to hold the sports betting industry accountable for gambling addiction. The article highlights his decades-long work in public health litigation, drawing parallels to his successful legal battles against Big Tobacco. It also offers a fascinating glimpse into his early years, tracing the experiences that shaped his passion for public health litigation. Report by Act for Public Health Partnership Calls for Court-Centered Strategy for Protecting Public Health In new report on protecting public health in the courts, the Act for Public Health partnership calls for a variety of action steps, including research, education, coordination with allies and an increased focus by public health on the nomination and election of judges. Northeastern Law and Tufts Medical Center to Establish Amy J. Reed Collaborative to Promote Medical Device Safety Northeastern Law and Tufts Medical Center are joining together to establish the Amy J. Reed Collaborative for Medical Device Safety to analyze data from tens of thousands of medical devices to identify safety risks and develop legal tools to address them. Where Do We Go From Here? Northeastern Law’s Centers of Excellence Explore the Ramifications of the 2024 Presidential Election Northeastern Law’s five centers of excellence recently convened a panel to explore the potential ramifications of the 2024 presidential election."
