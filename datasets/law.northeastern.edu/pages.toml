["https://law.northeastern.edu/academics/centers/clear"]
title = "Center for Law, Equity and Race - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / Center for Law, Equity and Race Center for Law, Equity and Race Centers, Institutes and Programs Centers, Institutes and Programs Center for Law, Equity and Race About Us Affiliated Programs Judicial Programs Fellowships Gants Judicial Scholarship Events Hope Lewis Distinguished Lecture News Civil Rights and Restorative Justice Project Criminal Justice Task Force Centers, Institutes and Programs Center for Law, Equity and Race About Us Affiliated Programs Judicial Programs Fellowships Gants Judicial Scholarship Events Hope Lewis Distinguished Lecture News Civil Rights and Restorative Justice Project Criminal Justice Task Force Center for Law, Equity and Race (CLEAR) Worldwide, recent attention on the role of law and legal systems in creating and perpetuating seemingly intractable racial inequalities and disparities provide an opportunity to create real change. At Northeastern Law, the Center for Law, Equity and Race (CLEAR) brings together our pioneering programs and faculty — long engaged in theoretical and translational research, innovative pedagogy and collaborations with external communities — to address today’s challenges and provide tomorrow’s solutions for the nation’s most complex social challenges. As one of the law school’s five Centers of Excellence, CLEAR offers an interdisciplinary convening space for faculty and students across the university who want to have an impact on these issues. Two dynamic programs are at the core of the CLEAR’s work: the nationally recognized Civil Rights and Restorative Justice Project (CRRJ), led by Professor Margaret Burnham, and the highly regarded Criminal Justice Task Force (CJTF), led by Professor Deborah Ramirez. These projects have a common goal—building from historical memory and working to address the racial injuries of the past through the use of law, teaching, techniques of restorative justice and community partnerships. Both share a methodological focus on law as it intersects with history and other disciplines, resulting in deeply interdisciplinary investigations of race, law and justice. CLEAR nurtures existing networks and actively engages in creating new ones that support its mandate to enrich and inform the national discourse on reparative justice and criminal justice reform and build additional strength in racial justice research and practice. It thrives through its internal partners at the law school, including students engaged in co-ops and clinics and faculty who are leaders in combatting injustice. It supports learning exchanges with other partners as well, such as reform-minded public officials, and hosts interdisciplinary residencies, fellows and a variety of events and workshops. In these ways and more, CLEAR expands the capacity of collaborators and supports new areas of research on questions of racial redress, including projects of restorative justice, transitional justice and reparations. Recent News Northeastern Law Ranked in Top 10 for Racial Justice In recognition of its national leadership in creating transformative programs and hands-on initiatives, Northeastern University School of Law has been ranked No. 9 for racial justice in the fall 2024 issue of preLaw magazine. Download the CLEAR Brochure Read the CLEAR 2023 Annual Report Read the CRRJ 2023 Annual Report Exploring Pauli Murray’s Legacy: A Talk with Professor Lisa A. Crooms-Robinson On February 7, 2025, Northeastern University School of Law’s Center for Law, Equity and Race (CLEAR) hosted a talk with Professor Lisa A. Crooms-Robinson, about her latest archival research into the life and teachings of Rev. Dr. Anna Pauline “Pauli” Murray. Honoring MLK: CLEAR Explores the Past and Future of Labor Movements in the US To mark Martin Luther King Jr. Day, CLEAR hosted a panel discussion about Dr. King’s connection to the labor movement, and about the current challenges facing labor movements in the United States. A Jim Crow-Era Cold Case Researched by Northeastern Students Is the First Set of Records To Be Released Under New Law The NARA’s new federal archive “marks an important moment in the movement to learn about — and learn from — the atrocities of the Jim Crow era,” says Margaret Burnham, director of Northeastern Law’s Civil Rights and Restorative Justice Project (CRRJ) tells Northeastern Global News. “Rendering federal records widely available will make it possible to teach from this material, fully integrate this history in our national narrative, and better assist the families and communities that bear the weight of these past harms.” Northeastern Law Launches Hope Lewis Distinguished Lecture CLEAR is proud to announce the launch of the Hope Lewis Distinguished Lecture, honoring the late Professor Hope Lewis, a globally renowned legal scholar, human rights advocate and beloved Northeastern Law professor from 1992 until her untimely passing in 2016. Recent Video and Photo Galleries Reconstructed Blackness: Race, Identity and Belonging in the Life and Work of Pauli Murray View Photos Dr. King and Labor: Connecting Past and Present View Video CLEAR Conference Day 2 View Video Imperiled Democracy: The Unfinished Promise of Democracy and the Role of Racial Justice Centers View Photos CLEAR Conference Day 1 View Video Saying ‘Tyre Nichols’ Name View Photos"
