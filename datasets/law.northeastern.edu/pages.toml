title = "Transfer Credits - School of Law"
full_description = "Home / Academics / Programs / JD / Transfer Credits Transfer Credits Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Transfer Credits Study Abroad Transfer Credits Transfer credits toward the Juris Doctor degree are accepted upon satisfactory completion of course work in an ABA-approved study abroad program; approval to enroll in any study abroad programs must be obtained in advance from the Dean of Students and Assistant Dean of Academic Affairs. Please be advised that to meet the ABA residency requirement, a student must be enrolled in at least 10 credit hours of course work and receive at least a “C” for credit to transfer. Transfer Student Credits A student in good academic standing at an ABA-accredited law school who has completed a first year of law school may apply as a transfer student to Northeastern. Ordinarily, a transfer student will have completed the following classes during the first year of law school prior to gaining admission to Northeastern: Civil Procedure Constitutional Law Contracts Criminal Justice/Criminal Law Property Legal Writing Torts Individuals who have not completed the above courses may be admitted subject to an individual transcript assessment and the possible requirement that they take specified courses, as determined by Dean of Students and Assistant Dean of Academic Affairs. Northeastern does not generally grant credit for upper-level courses taken in addition to first-year requirements or over the summer. At most, Northeastern will honor 34 semester credit hours earned at another ABA-accredited law school. Transfer Credit from Other ABA Law Schools Students may earn credit toward the Juris Doctor when enrolling in courses in other law schools; advance permission from the ADean of Students and Assistant Dean of Academic Affairs is required. For credit to transfer, a student should take course(s) that are not offered at the Northeastern and course(s) that enhance their career goals. A student must also receive at least a grade of “C” in the course(s). Non-JD Transfer Credit Students who entered in 2019 or earlier may earn a total of six credit hours toward the Juris Doctor by successfully completing graduate-level, non-law offerings in other branches of the university; students who entered in 2020 or thereafter may earn a total of 12 credit hours toward the Juris Doctor by successfully completing graduate-level, non-law offerings in other branches of the university.* A student must first secure the approval of the Dean of Students and Assistant Dean of Academic Affairs before registering for such courses. The student must demonstrate, to the Dean of Student’s satisfaction, that such non-law offerings will contribute to his or her professional development or will advance career-related goals. *Students should refer to their Student Handbook for specific policies. Northeastern Students as Non-matriculant Visiting Students Northeastern students attending another ABA-approved law school as third-year, non-matriculant visiting students may have credits earned transferred to their Juris Doctor. Northeastern remains the home institution from which the JD is earned and all NUSL requirements must be fulfilled. Pathways to Success See All Pathways Tai-Lyn Parboosingh ’22 Associate, Lydecker, Los Angeles Read My Story Ashley L’Etoile ’19"
