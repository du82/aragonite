["https://law.northeastern.edu/experience/co-op"]
title = "Co-op - School of Law"
full_description = "Home / Experiential Learning / Co-op / Co-op Co-op Experiential Learning / Co-op Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success The Incomparable Co-op: Full-Time Work Experiences. Countless Opportunities. When it comes to giving students the opportunity to learn by doing, there’s simply no place like Northeastern. Our signature Cooperative Legal Education Program guarantees you three, full-time legal work experiences. No other law school program comes close — indeed, The National Jurist/preLaw awarded Northeastern Law an A+ grade for practical legal training in 2024. While other law schools might give students the chance to work over the summer or experience a part-time internship or externship, only Northeastern integrates full-time employment into its curriculum, giving you opportunities to: Collaborate full time with working lawyers, contributing to the resolution of actual cases for real clients Make an impact in a professional setting just about anywhere in the world, from New York to South Africa Try out a variety of work environments and explore diverse areas of the law in depth You’ll graduate from Northeastern in three years — the same amount of time as peers at other law schools. But in those three years you will do much more than study the law; you’ll gain the experiences you need to graduate with clear direction, a deep professional network and a resume that stands out from the crowd. How it works After your first year of study, you’ll alternate between classroom and co-op until you graduate with three, full-time professional experiences under your belt. Where you’ll go Clerk for a judge in Boston. Assist lawyers at a private firm in San Francisco. Conduct research for a trial in The Hague. Work for a human rights organization in Kenya. With more than 1,100 co-op employers in 40 states and co-ops completed in 55 countries, NUSL lets you tailor your experience to your professional interests and travel the world on co-op if you choose. What you’ll get The benefits of co-op extend far beyond graduating with an impressive resume. You and your peers will bring lessons learned on co-op into the classroom, creating a vibrant intellectual exchange that builds with each new experience. You may end up accepting a full-time position with one of your co-op employers, as a significant number of our graduates do. Most important, you’ll have the experience to know exactly where you want to go in your career and the confidence and credentials to get there. Apply Now Request Information Co-op Student FAQs Pathways to Success All Pathways Andrew Glincher ’84 Chairman Emeritus, Nixon Peabody, Boston Read My Story Mayumi Grigsby ’15"
