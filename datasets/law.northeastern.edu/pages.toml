["https://law.northeastern.edu/about/belonging"]
title = "Belonging - School of Law"
full_description = "Home / About / Belonging Belonging About About Dean’s Welcome History and Mission Accreditation Quick Facts Belonging Consumer Information Organizational Chart Equal Opportunity Policy Senior Leadership Staff Directory About Dean’s Welcome History and Mission Accreditation Quick Facts Belonging Consumer Information Organizational Chart Equal Opportunity Policy Senior Leadership Staff Directory Northeastern Law Welcomes All to Our Community Fostering a community of belonging is essential to the advancement of Northeastern University’s mission of teaching and research. Our university is stronger as a result of the varied backgrounds, experiences and perspectives that all members of our global community bring to the pursuit of knowledge. Embracing this pluralism is not the work of one office, department or academic unit. It is a shared responsibility that spans disciplines and boundaries. At Northeastern Law, we believe that the legal profession has a responsibility to promote belonging for all individuals, regardless of their background, identity or experience. We work to promote social justice and enhance understanding of the law’s impact on individuals, organizations and communities. We understand the crucial role that law plays in creating and combatting systems of oppression. Our mission is to equip our students with the knowledge, skills and perspectives needed to navigate these complex issues and prepare our students to be leaders in this effort. At Northeastern Law, we believe that by doing this work together, we can create a more just and equitable legal system and society. Meet Dean James Hackney James Hackney was appointed dean of Northeastern University School of Law on July 1, 2018; he joined the faculty in 1992. Dean Hackney is committed to recruiting and retaining diverse faculty as well as students. Dean Hackney fondly recalls his own days as a member of the Black Law Students Association during his law school years and continues to prioritize belonging as dean of Northeastern Law. Meet Associate Dean for Belonging and Student Affairs Kiana Pierre-Louis Associate Dean Kiana Pierre-Louis, a lawyer by training, welcomes community members to reach out to her. She works closely with Dean James Hackney and the associate deans to set the strategic vision for the law school and actively engages faculty, staff and students to ensure that all community members feel supported and have a sense of belonging. Associate Dean Pierre-Louis facilitates trainings and promotes activities that embrace diverse individuals and a wide range of beliefs, ideas and opinions. Community Comes First Alumni/ae of Color Network The Alumni/ae of Color Committee is a subcommittee of the Alumni/ae Association Board of Directors. Occasionally, they plan joint networking and programmed events with related student organizations. The committee co-manages the Denise Carty-Bennia Memorial Bar Awards process each spring. Denise Carty-Bennia Memorial Bar Awards Each year, Northeastern Law provides a number of bar awards to selected third-year students through an application process. Reviewers of these applications always reflect on how inspiring it is to see that so many Northeastern law students have dedicated themselves to improving the social and political issues that affect our communities. Black Law Students Association Spirit of Valerie Gordon Book Award In conjunction with the annual Valerie Gordon Human Rights Lecture, the Black Law Students Association Spirit of Valerie Gordon Book Award is presented to the first-year BLSA member who wins this writing competition. Student Organizations Students at Northeastern Law participate in more 30 student organizations — more than a third of these are affinity groups. Student led, these groups provide opportunities for personal and professional connections, often holding social and networking events as well as providing service to the greater community. Northeastern Law Puts Ideas into Action Center for Law, Equity and Race (CLEAR) CLEAR brings together our pioneering programs and faculty — long engaged in theoretical and translational research, innovative pedagogy and collaborations with external communities — to address today’s challenges and provide tomorrow’s solutions for the nation’s most complex social challenges. Learn More Civil Rights and Restorative Justice Project (CRRJ) CRRJ seeks justice for civil rights crimes between 1930 and 1970. Most recently, it launched the Burnham-Nobles Digital Archive, one of the most comprehensive digital archives of racial homicides collected to date. Learn More Center for Public Interest Advocacy and Collaboration The Center for Public Interest Advocacy and Collaboration (CPIAC) takes the lead in infusing the law school’s public interest mission into all facets of the student experience. Learn More Discover a Community of Belonging at Northeastern John D. O’Bryant African American Institute Supporting students of African origin and engaging the broader university community in developing student leaders. Learn More Name and Gender Marker Students who wish to change their name or gender marker in Northeastern systems without having legally done so begin the process through the LGBTQA Resource Center. Learn More Office for University Equity and Compliance The Office for University Equity and Compliance leads efforts to maintain the university’s compliance with all federal, state and local laws pertaining to anti-discrimination, the Americans with Disabilities Act and Title IX. The OUEC is responsible for investigating and resolving all complaints of discrimination, harassment, and retaliation at Northeastern. Learn More Social Justice Resource Center The Social Justice Resource Center is a hub of innovative, justice-minded thinking, collaboration and action on campus that aspires to contribute to the common good. Learn More Policies and Procedures Check out our policies, procedures and important documents. Learn More Incoming Class Statistics - Fall 2024 4,163 Applications Received 265 Enrolled 69% Women 30% Students of Color 29% LGBTQ+ Faculty Full-time total (including specialists): 59 Women 66% Men 34% Faculty of Color 36% News"
