["https://law.northeastern.edu/pathway/alison-bolivar-11"]
title = "Alison Bolivar ’11 - School of Law"
full_description = "“ I bring a lot more to the table because of my legal background. Alison Bolivar ’11 Northeastern allowed Alison Bolivar to see the world. “My background was in finance and banking,” says Alison, who wanted to leverage that business experience with a law degree to build a career in international business. She chose Northeastern for the program’s flexibility. “I love traveling and learning about other cultures. I’ve been to 50 countries, worked for an executive recruiting firm in China, and am conversational in Chinese and Spanish,” she notes. “In choosing Northeastern, I was able to go back overseas through my co-ops.” Alison went on to head her own company, Anji Investment Group, representing US-based real estate development companies with capital raising and marketing strategies, securing substantial financial commitments for projects. “I’m a matchmaker. I brought together foreign investors and American companies who need capital,” says Alison, who has now transferred those matchmaking skills to owning a franchise of a leading pre-school musical education program for young families in the United Kingdom. Co-op Kangxin Partners, Beijing, China Alison completed a detailed analysis of China’s role within the global system for intellectual patent protection. 2L: Study Abroad Alison studied with American University’s Program in Geneva, Paris, London and Brussels — a program where students travel to different cities and take courses with both US and local professors and visit international organizations. Electives Bankruptcy Estate and Gift Tax Evidence Income Tax International and Foreign Legal Research Law of Financial Institutions Quantitative Methods Secured Transactions Co-op Fidelity International, London, England Alison analyzed proxy statements for annual and extraordinary meetings for the equity holdings of Fidelity’s retail and institutional client portfolios. Activities Human Rights Caucus International Law Society Co-op US Bankruptcy Court, San Diego, California Alison drafted bench memoranda on an assortment of both substantive and procedural problems addressing bankruptcy court today. Co-op Glass, Lewis & Company, San Francisco, California Alison analyzed multinational corporations’ regulatory filings and offered voting recommendations to the world’s largest institutional investors. After Graduation Principal, Las Vegas Investment Group, Las Vegas, Nevada Next Managing Director and Co-Founder, Anji Investment Group, London, England Now Principal, Nine Elms Kids, London, England"
