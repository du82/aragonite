full_description = "Home / Academics / Centers, Institutes and Programs / Initiative for Energy Justice Initiative for Energy Justice Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Getting into the Weeds for Grassroots Between the grassroots communities at the frontlines of the climate justice fight and the policymakers who determine the rules and regulations that govern clean energy there is often a deep and dark gap in terms of information and evidence. To shine light on that space, Professor Shalanda Baker ’05 joined forces with Shiva Prakash ’16 and Subin DeVar in 2019 to launch the Initiative for Energy Justice. The Kresge Foundation and Surdna Foundation provided seed funding to the Initiative, which is sponsored by Northeastern University in conjunction with the Sustainable Economies Law Center."
