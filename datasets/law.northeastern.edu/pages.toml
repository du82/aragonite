["https://law.northeastern.edu/public-interest/curriculum-and-co-op"]
title = "Curriculum and Co-op - School of Law"
full_description = "Josh Greenberg ’93 Vice President of Government Relations, Boston Children’s Hospital, Boston Read My Story Home / Public Interest Law / Curriculum and Co-op Curriculum and Co-op Public Interest Law Public Interest Law Center for Public Interest Advocacy and Collaboration Clinics and Centers Curriculum and Co-op Post-Graduate Success Pro-Bono Opportunities Public Interest Law Support Student Honors Public Interest Law Center for Public Interest Advocacy and Collaboration Clinics and Centers Curriculum and Co-op Post-Graduate Success Pro-Bono Opportunities Public Interest Law Support Student Honors Social Justice in Theory and Action Grounded in social justice, our curriculum offers a broad range of courses — from Welfare Law to Problems in Public Health Law — focused on legal areas that disproportionately affect the underrepresented and minorities in our society. In your first year, you’ll dive into social justice work by taking Legal Skills in Social Context, a yearlong program that teaches basic lawyering skills by addressing real social issues and culminates in a social justice project for a community-based or public service organization. You can also explore public interest law through our extensive co-op network, which provides access to hundreds of organizations changing lives globally in a number of ways. Approximately 85 percent of our students fulfill the school’s public interest requirement through a co-op, working for legal services and advocacy groups such as the American Civil Liberties Union and the NAACP or government and judiciary organizations including the National Labor Relations Board and the International Criminal Tribunal for the former Yugoslavia. And, if you want to focus in a specific area — for example, health law and policy or poverty law and economic justice, take a look at our interdisciplinary JD x certificates. For those of you who want dig even deeper, we offer a number of dual-degree programs, including public health and environmental law. Pathways to Success All Pathways Josh Greenberg ’93 Vice President of Government Relations, Boston Children’s Hospital, Boston Read My Story Diana Howat ’22"
