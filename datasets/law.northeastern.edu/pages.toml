["https://law.northeastern.edu/experience/clinics"]
title = "Clinics - School of Law"
full_description = "Home / Experiential Learning / Co-op / Clinics Clinics Experiential Learning / Co-op Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success Lesson in Law. Lessons in Life Assist people with limited resources in tackling the legal hurdles of starting their own businesses. Help overturn wrongful convictions from the civil rights era. Represent domestic violence survivors in complex family law cases. Northeastern’s clinics seek to provide justice in particularly transformative ways, from promoting smart health policies to providing a voice — and a chance — for underprivileged populations through no-cost legal advice and representation. By participating in one or more of our clinics, you will not only develop the skills to become an effective lawyer and build a strong foundation to pursue public interest work — you’ll have the chance to improve others’ lives before earning your JD. 25 Hours Per Week. A Lifetime of Benefits. As a clinic participant, you’ll dedicate 25 hours each week to real cases while working alongside faculty experts with significant experience in their fields. You’ll supplement and enhance the skills you develop while on co-op, gain unique insight from your faculty mentors and experience firsthand the tremendous impact you can have as a lawyer. Each year more than 100 Northeastern Law students participate in clinics, contributing more than 25,000 hours of legal assistance annually to people and populations with significant need. U.S. News & World Report ranks Northeastern No. 23 for clinical programs. For more information, contact: Professor Hemanth C. Gundavaram Director, Clinical Programs; h.gundavaram@northeastern.edu 617.373.6802 Clinics Civil Rights and Restorative Justice Community Business Domestic Violence Housing Rights Advocacy Clinic Immigrant Justice Intellectual Property Law Clinic Prisoners’ Rights Public Health"
