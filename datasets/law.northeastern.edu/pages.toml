title = "Support CPIAC - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / Center for Public Interest Advocacy and Collaboration (CPIAC) / Support CPIAC Support CPIAC Centers, Institutes and Programs Centers, Institutes and Programs Center for Public Interest Advocacy and Collaboration (CPIAC) Affiliated Programs Contact Us Events Faculty Pro Bono Opportunities Projects Student Engagement Support CPIAC Centers, Institutes and Programs Center for Public Interest Advocacy and Collaboration (CPIAC) Affiliated Programs Contact Us Events Faculty Pro Bono Opportunities Projects Student Engagement Support CPIAC Make a Gift to the Center for Public Interest Advocacy and Collaboration (CPIAC) The purpose of the CPIAC fund is to support the center in fulfilling its commitment to legal practice in support of the public interest and social justice, while also reimagining and empowering social justice practice. The fund will provide support for general operations, travel to conferences, and sponsorship of conferences or events. Support the Brian Flynn Memorial Fund for Social Justice Lawyering The Brian Flynn Memorial Fund for Social Justice Lawyering honors an outstanding law school alumnus and an exemplar with the potential to inspire every Northeastern student pursuing public interest work. Throughout his career, Brian was a leading advocate for some of the commonwealth’s most vulnerable groups, particularly in the fields of welfare and employment. Brian was incredibly modest and never sought the spotlight. He was also — when informed shortly before his death that a fund would be established in his memory — moved to know his legacy would continue to support the incredible social justice advocacy of generations of NUSL students. We who remember him with admiration and affection believe his story should be told and remembered. Make a Gift to the CPIAC Fund Brian Flynn Memorial Fund for Social Justice Lawyering"
