full_description = "Home / Admissions / FlexJD / Financial Counseling Financial Counseling Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Financing Your Education Northeastern University School of Law partners with AccessLex to provide admitted and current students with resources for personalized counseling. Admitted and current students can receive individual financial counseling throughout each school year. All Access Lex services are no cost and are available from the time you receive your letter of admission through graduation to becoming a NUSL alumnus/alumna. The AccessLex counseling service options can be found on the following web pages: AccessConnex by AccessLexSM gives you free access to a team of Accredited Financial Counselors, who can answer your financial questions about borrowing strategies, loan terms, repayment options, credit, and more. Through our partnership with AccessLex Institute, you can schedule free and unlimited calls with one of their counselors at a time that works for you! Scholarship Databank helps students maximize the affordability of a law degree and assists them in making wise financial decisions, by making it easier for students to find money to help pay for law school and lower their student loan burdens by providing a list of vetted scholarships. MAX by AccessLex® is the free personal finance program designed exclusively for law students. Learn top financial strategies with in-person MAX by AccessLex® and online learning options, one-on-one financial coaching from Accredited Financial Counselors, and over $300,000 in scholarship incentives each year to keep you motivated! From paying for law school to investing for your retirement —– and every step in between — let MAX be your guide! AccessLex is an independent institute that partners with Northeastern University School of law to provide financial counseling to law students. If you are seeking support for specific internal NUSL financial aid, please contact us at lawfinaid@northeastern.edu or 617.373.4620. Entrance and exit loan counseling are provided by the Federal Student Aid division of the Department of Education. These requirements are completed electronically at studentaid.gov. In addition to the above services provided by AccessLex, NUSL financial aid staff are available for student loan counseling at any time during your law school career. Scholarships Loans Public Interest Law Support Additional Resources for Current Students Resources for Alumni/ae Contact Us Contact Financial Aid If you have questions about the financial aid application process, you are welcome to contact our financial aid team at 617.373.4620 or lawfinaid@northeastern.edu."
