title = "Poverty Law and Economic Justice - School of Law"
full_description = "Home / Academics / Areas of Study / Poverty Law and Economic Justice Poverty Law and Economic Justice Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Poverty Law and Economic Justice If you want to make a difference in the world, there’s no better place to study law and engage with social justice advocates than Northeastern Law — one of the nation’s top public interest law schools. Steadily increasing income and wealth inequality, both vertical (between rich and poor) and horizontal (between identity groups within different tiers), is a defining trend of recent decades. Poverty law practice is one response to these trends. Poverty law concerns all aspects of the legal and social problems confronting poor people including denial of government benefits to which they are entitled, lack of access to adequate housing, abusive treatment in low-wage labor markets, invidious discrimination in education, and others. Poverty lawyers challenge and resist economic inequality through direct client representation, collective representation and systemic advocacy in courts and the political process. Northeastern Law faculty are nationally recognized leaders in this field, and our in-school and co-op offerings are widely admired. Apply Now Interdisciplinary Advantage JD x Certificates Consumer Law Disrupt the Cradle-to-Prison Pipeline—Restorative Justice Education Law Human Rights in the United States Immigration Law Juvenile Courts: Delinquency, Abuse and Neglect Labor Law I and II Laboratory Seminar in Applied and Critical Legal Design Law and Economic Development Law and Inequality Legal Skills in Social Context Race and the Law Social Welfare Law ACLU of Alaska Children’s Law Center of Massachusetts Conservation Law Fou