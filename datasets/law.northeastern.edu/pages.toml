["https://law.northeastern.edu/academics/centers/cpiac/cpiac-projects"]
title = "CPIAC Projects - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / Center for Public Interest Advocacy and Collaboration (CPIAC) / CPIAC Projects CPIAC Projects CPIAC’s Cradle-to-Prison (C2P) project hosted a half-day conference in November, 2019, that brought together advocates and organizers interested in dismantling the pipeline. Centers, Institutes and Programs Centers, Institutes and Programs Center for Public Interest Advocacy and Collaboration (CPIAC) Affiliated Programs Contact Us Events Faculty Pro Bono Opportunities Projects Student Engagement Support CPIAC Centers, Institutes and Programs Center for Public Interest Advocacy and Collaboration (CPIAC) Affiliated Programs Contact Us Events Faculty Pro Bono Opportunities Projects Student Engagement Support CPIAC Dismantling the Cradle-to-Prison Pipeline CPIAC's flagship research initiative, the Cradle-to-Prison Pipeline Project (C2P Project), launched in 2019 with a Northeastern University Tier 1 grant, is a collaboration among CPIAC; Northeastern University’s College of Arts, Media and Design (CAMD); and its Department of Sociology and Anthropology at the College of Social Sciences and Humanities. The project is building a holistic model of contributors to mass incarceration in Massachusetts to identify and validate policy interventions. It will also provide a model for other states while connecting stakeholders to facilitate identification of collective interest and scalable solutions. Beyond Northeastern University, the project is strengthened by engagement and collaboration with people currently and formerly incarcerated, practicing lawyers, policy advocates, nonprofit organizations and people impacted by the family regulation system. Since its launch, the C2P Project’s work has highlighted perspectives born of lived experience. Among its endeavors have been a project in collaboration with formerly incarcerated people and the nonprofit Everyday Boston, resulting in video narratives by formerly incarcerated people sharing their experiences; a survey of hundreds of currently incarcerated people in Massachusetts jails and prisons about their youth experiences with systems that contribute to incarceration and their views on needed changes — with results of phase 1 published in “Criminalizing a Rough Life: A Survey of Systems Involvement Among Incarcerated People in Massachusetts”; creation of a website, cradle2prison.info, housing resources for the public, advocates and policymakers; and numerous student research projects — many in collaboration with Northeastern Law’s Legal Skills in Social Context (LSSC) program — on topics such as school discipline, police in schools, the family regulation system, houselessness and others. The C2P project also organizes events to gather advocates and inform the public around issues of concern — including, most recently, a collaborative event with Citizens for Juvenile Justice and CAMD School of Journalism initiative The Family Project, entitled, “I Am Not a Bad Parent,” featuring parents involved with the family regulation system and a premiere of CAMD journalism student documentaries. In 2022, the project was awarded a Northeastern Impact Engine Grant to expand its work supporting advocates dedicated to dismantling the cradle-to-prison pipeline. Numerous gaps in data collected or reported by relevant public agencies are a recurrent obstacle to advocates and policymakers advancing effective solutions to counter incarceration's contributors. The Impact Engine Grant will specifically support the project to build and pilot an online data tool as a one-stop, interactive resource for advocates addressing this hurdle. “CPIAC is thrilled to be able to channel Impact Engine support into a cutting-edge tool to empower advocates,” explained Professor Lucy Williams, faculty director of CPIAC. “With this grant, the Cradle-to-Prison Pipeline Project will address an urgent need for data access, and in so doing will continue to advance advocates’ critical work dismantling the systems that feed incarceration.” The Cradle-to-Prison Pipeline Project will hold its second conference on March 31, 2023. Learn more at the project website, cradle2prison.info. Please email cpiac@northeastern.edu if you would like to get involved. Resources: Visit www.cradle2prison.info/resources See Something, Frame Something Project Launched with a Northeastern University Tier 1 research grant in 2021, The See Something, Frame Something Project is an interdisciplinary research initiative involving CPIAC and the Center for Information and Creativity (CLIC) at Northeastern Law, and Northeastern’s College of Arts, Media and Design (CAMD), College of Social Sciences and Humanities (CSSH), and Khoury College of Computer Sciences. The project explores the legal and societal implications of state-private collaboration in surveillance of marginalized communities. The See Something, Frame Something Project will hold its first conference, on the theme of Data and (Dis)Obedience, at Northeastern University on March 15, 2023. Video and Photo Galleries 2024 Daynard Roundtable: Christian Snow View Photos 2023 Daynard Roundtable: Hema Sarang-Sieminski ’05 View Photos Data Democratization: Building Strategies to Disrupt and Dismantle the Cradle-to-Prison Pipeline View Photos 2023 Daynard Roundtable: Derecka Purnell View Photos 2023 Daynard Roundtable: Derecka Purnell View Video 2023 Daynard Community Conversation: Derecka Purnell View Video Gig Workers’ Rights, the Future of Employment and the Future of Democracy View Video A Conversation with William Allen: Correcting a Fundamental Unfairness Through the Clemency Process View Photos A Conversation with William Allen: Correcting a Fundamental Unfairness Through the Clemency Process View Video Past Projects Time to Vote Research Project Long waits at the polls and other voting challenges can undermine the right to vote. With crucial national and local elections regularly being decided by razor-thin margins, unequal allocation of electoral resources and subsequent voter disenfranchisement are one of this era’s most pressing civil rights issues. The Northeastern University Time to Vote project was a research collaboration among Northeastern Law's Center for Public Interest Advocacy and Collaboration (CPIAC), Civil Rights and Restorative Justice Project and NuLawLab; Northeastern University's College of Social Sciences and Humanities (Dukakis Center for Urban and Regional Policy and Political Science Department), College of Arts, Media and Design and Charlotte, North Carolina campus; and partner organizations across the U.S. The project gathered data about voters’ wait times and other obstacles to voting access to assist efforts for equitable electoral resource distribution. Voting rights advocates have long pointed to disparities in wait times and voting access, including persistent racial disparities. In response to a gap in precise quantitative data to better evidence these obstacles and disparities, the Time to Vote project developed a smartphone-based app that voters can use to measure the time they spend waiting to vote and provide information about other voting challenges they may have encountered. The project also conducted a survey of voters in the 2020 federal election which, notably, revealed significant differences in voters’ willingness to wait based on race and gender — with Black women willing to wait longest. Read coverage of the Time to Vote Project’s survey findings in The Washington Post."
