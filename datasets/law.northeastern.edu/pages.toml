["https://law.northeastern.edu/academics/programs/jd/dual-degrees/public-health-bouve"]
title = "Public Health - Bouvé - School of Law"
full_description = "Home / Academics / Programs / JD / Dual Degrees / Public Health - Bouvé Public Health - Bouvé Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources JD/MPH with Northeastern University Bouvé College of Health Sciences The JD/MPH dual-degree program with Bouvé College of Health Sciences brings together interdisciplinary faculty from the School of Law, School of Business, College of Social Sciences and the Humanities and the Khoury College of Computer and Information Sciences with expertise in collaborating with diverse urban populations to provide students with the practice-based knowledge, skills and experience needed to address public health problems and assume leadership roles in the field. Northeastern offers the nation’s premier Cooperative Legal Education Program. Students in the JD/MPH program are required to satisfy the law school’s co-op requirements and must complete at least one co-op related to public health. Students in the dual-degree program may pursue the law school’s concentration in Health Policy and Law and Bouvé’s concentration in Urban Health. Possible Patterns of Attendance Semester JD‐MPH NU Bouve After 1L 1L Fall Classes 1L Spring Classes Summer JD Co‐op + HEPP Fall NU Bouve Spring NU Bouve Summer JD Classes Fall JD Co‐op + Bouve Practicum Spring JD Classes Summer JD Co‐op + Capstone Fall JD Co‐op Examples of JD Courses in the Program Administrative Law Bioethics and Law Domestic Violence Clinic Drug Law and Policy Health Law Problems in Public Health Law Public Health Advocacy Clinic Reproductive Rights, Justice and Health Social Welfare Law Examples of MPH Courses in the Program Public Health Core Courses: Society, Behavior and Health; Public Health Administration and Policy; Environmental Health; Epidemiology; Biostatistics Urban Health Core Courses: Principles and History of Urban Health; Urban Community Health Assessment; Race, Ethnicity and Health; Health Education and Program Planning Evaluating Health Care Quality Economic Perspectives on Health Policy Health Advocacy Strategic Management and Leadership in Health Program Evaluation Food, Food Policy and Health Public Health Nutrition Global Health Advances in Measuring Health Behavior Critical Appraisal of Research Literature Community Based Participatory Research Qualitative Methods in Health and Disease Social Epidemiology JD/MPH Capstone In addition to satisfying all other degree requirements, all students in the JD/MPH program must complete an Urban Health Capstone Project. This project provides students with the opportunity to work on-site in a range of diverse public health practice settings reflective of their dual interests in law and urban public health. Students integrate their knowledge and skills in a major research, program planning, or policy development project. Students are supported in the design and implementation of the Capstone Project by a committee of public health faculty and content specific experts. Admission To be admitted to the dual-degree program, students must be admitted to both Northeastern University School of Law and Bouvé College of Health Sciences. Students should apply online to the School of Law through LSAC. The application for the MPH program is available at: Apply Yourself (AY). The AY application fee and GRE requirements are waived for JD/MPH students. The JD/MPH program also accepts applications during a student’s first or second year of law school at Northeastern or from students transferring to Northeastern. Admission to the School of Law does not guarantee admission to the MPH program. Both applications must be submitted by March 1 for those applying to the dual-degree program. Additional information is available on the MPH program website. Apply Now Areas of Study JD x Certificates"
