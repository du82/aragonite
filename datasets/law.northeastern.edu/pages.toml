["https://law.northeastern.edu/academics/journals"]
title = "Journals - School of Law"
full_description = "Home / Academics / Journals Journals Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Doing the Write Thing Northeastern University School of Law is home to two unique and exceptional journals. Northeastern University Law Review The Northeastern University Law Review is a student-run publication that engages all topics of legal scholarship, with special attention given to articles that show the connections among public interest, innovation, and the practical application of law. It is published twice a year and includes articles by legal and interdisciplinary academics, attorneys and law students. Journal of Legal Education Northeastern University School of Law is co-editor of the Journal of Legal Education (ISSN 0022-2208), a quarterly publication of the Association of American Law Schools. The primary purpose of the Journal is to foster a rich interchange of ideas and information about legal education and related matters, including but not limited to the legal profession, legal theory and legal scholarship. With a readership of more than 10,000 law teachers and about 500 subscribers, the Journal offers an unusually effective medium for communication to the law school world. Co-editors Dean Jeremy Paul and Professor Margaret Woo welcome manuscripts (including responses to articles recently published in the Journal), books for review and suggestions for improvement of the Journal. Unsolicited book reviews generally will not be accepted. Manuscripts submitted to the Journal must not be under consideration by another publication and are subject to double-blind peer review. For information about submissions, please contact Professor Jeremy Paul. The views expressed in the Journal are those of the authors and should not be attributed to the Association, the institutions with which the authors are affiliated or the editors. Northeastern University Law Review Read the current issue"
