title = "On-Campus LLM - School of Law"
full_description = "Home / Academics / Programs / On-Campus LLM On-Campus LLM Academics Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Take the Next Step in Your Legal Career The School of Law offers a suite of LLM programs that are global, flexible and dynamic. Whether it’s unlocking the mysteries of the US legal system, working side by side with US lawyers, honing your expertise in a particular field of law or qualifying for a US bar examination, the Northeastern LLM helps lawyers achieve their personal and professional goals. The On-Campus LLM offers a rigorous curriculum that will provide you with a comprehensive foundation in legal theory and practice as well as the freedom to explore and refine your career interests. All students participate in nine months of classroom instruction; an additional three-month co-op is available to qualified students. On-Campus LLM students may choose the General Program, which offers maximum flexibility to let you take the courses you want and need — to academically prepare for a US bar exam or to do whatever you choose as a lawyer who wants to make a difference — or one of our concentrations, which provide a competitive advantage in specific fields of interest. Whichever path you choose, you’ll come away with new or enhanced skills and talents, including: powerful written and oral communication skills sophisticated techniques for translating complex situations into key elements strategies for listening to — and truly hearing —other people’s opinions anticipating pitfalls and providing solutions comfort with ambiguity and the skills to help teams work through thorny issues Co-op The School of Law educates our JD and On-Campus LLM students who opt for the 12-month program through academically rigorous coursework integrated with our signature Cooperative Legal Education Program (co-op). Placement opportunities may include law firms, companies, clinics, courts, government agencies, community organizations or advocacy groups. Guided by the LLM professional development advisor, you'll define your professional objectives and identify a co-op opportunity that meets your unique goals. Independence LLM students have an opportunity to undertake an independent research project in an area of law they are interested in exploring and complete a research paper under the guidance of a Northeastern law faculty member, either in conjunction with an upper-level seminar or as independent study. Timeline On-Campus LLM: nine-months On-Campus LLM with co-op: 12 months All students start in September. Students are encouraged to apply by April 1. Apply Now Request Information Viewbook Online LLM General Program, Concentrations and Dual MBA Degree General Program Most on-campus students opt for the General Program because it provides the most flexibility to take the courses they want in pursuit of their professional interests and personal aspirations. Many LLM students also choose the General Program to qualify for a bar examination in one of the United States jurisdictions (Massachusetts or New York, for example) that admit lawyers trained outside the US. Whether you are a US or internationally trained lawyer looking for individualized professional growth or a candidate for a US bar exam, the General Program offers a foundation for you to advance your professional goals and to make a difference in the world. Curriculum The General LLM Program, which requires the completion of 24 credits, features: A Minimum of Required Courses: LLM students in the General Program who obtained their first law degree outside the US benefit from two foundational courses: Introduction to American Law and Legal Institutions and Introduction to Legal Research and Writing, which provide the background knowledge and basic skills needed to succeed in the US law school environment and in the global practice of law. A Maximum of Elective Courses: LLM students in the General Program enroll in upper-level JD courses based entirely on your personal interests and career goals, including the desire to qualify for a US bar exam. If you wish, you may focus your studies in a particular substantive area, such as corporate law, commercial law, trade law, public international law, intellectual property or international human rights. Co-op: All Experiential LLM students in good academic standing spend a term completing a full-time legal practice experience. Co-op is an integral part of the Experiential LLM curriculum – no less important than your 24 credits of course work. Northeastern has developed placement opportunities with law firms engaged in advocacy work, nonprofits, government agencies, community organizations, NGOs and other advocacy groups around the world. Where students go on co-op — in the world and where within the profession — is up to them. The LLM Professional Development Advisor works with students to define where they want to go on co-op and refine how they present their qualifications. Our goal is to help students find the co-op opportunities that best meet their unique goals. More About Electives Northeastern University School of Law offers a broad choice of courses across a wide range of fields. If you wish, you may focus your studies in a particular substantive or practice area. Some of the areas in which you might focus are: Business, Commercial and Trade Law Constitutional and Comparative Constitutional Law Criminal Law Health and Social Insurance Law Human Rights Law Intellectual Property Law Labor and Employment Law Law and Economic Development Property Law Public International and Comparative Law Health Policy and Law Concentration The LLM concentration in Health Policy and Law is designed to meet the needs of lawyers working in the area of health policy and law who are looking to enhance their practical skills and substantive knowledge as well as lawyers aiming to enter the field. With the implementation of the US Affordable Care Act and the proliferation of global health challenges and increasingly complex issues of bioethics, this is a dynamic and ever-expanding field of legal practice. This in-depth program helps prepare lawyers who aim to work with health care providers and insurers, government regulatory agencies, firms handling pharmaceutical products liability and toxic tort cases, and NGOs and community-based organizations in the United States and abroad, among others. In addition to enrolling in the wide range of health law-related courses offered by the School of Law, LLM students may benefit from the university’s interdisciplinary expertise by taking relevant courses in the Bouvé College of Health Sciences, the D’Amore-McKim School of Business, and the College of Social Sciences and Humanities. LLM candidates are also encouraged to participate in events and activities sponsored by Northeastern’s Center for Health Policy and Law. Curriculum The concentration in Health Policy and Law, which requires the completion of 24 credits, features: A Minimum of Required Courses: All LLM students specializing in Health Policy and Law take Health Law and at least two courses of their choosing, including: Bioethics and the Law Current Issues in Health Law and Policy Drug Law and Policy Health Law Fraud and Abuse International Health Law Problems in Public Health Law Public Health Law Clinic LLM students specializing in Health Policy and Law who obtained their first law degree outside the US benefit from two foundational courses: Introduction to American Law and Legal Institutions and Introduction to Legal Research and Writing, which provide the background knowledge and basic skills needed to succeed in the US law school environment and in the global practice of law. A Maximum of Elective Courses: LLM students concentrating in Health Policy and Law may take other health law-related courses of their choosing from a select list (see sample list of course options below). Students must also complete a paper on a health law topic. Co-op: All Experiential LLM students in good academic standing spend a term completing a full-time legal practice experience. Co-op is an integral part of the Experiential LLM curriculum – no less important than your 24 credits of course work. Northeastern has developed placement opportunities with law firms engaged in advocacy work, nonprofits, government agencies, community organizations, NGOs and other advocacy groups around the world. Where students go on co-op — in the world and where within the profession — is up to them. The LLM Professional Development Advisor works with students to define where they want to go on co-op and refine how they present their qualifications. Our goal is to help students find the co-op opportunities that best meet their unique goals. Sample Course Offerings in Health Policy and Law Administrative Law Advanced Legal and Interdisciplinary Research Antitrust Law Basic Income Taxation Bioproperty Disability Law Economic Perspectives on Health Policy (at Bouvé, semester-long course) Elder Law Environmental Law Global AIDS Seminar Human Rights in the Global Economy Human Behavior, Legal Doctrine & Policy Design Intellectual Property Patent Law Private Litigation for Social Justice Reproductive Rights and the Law Social Welfare Law State and Local Government Law Recommended courses offered through the Bouvé College of Health Sciences (HPL students may take four credits of graduate-level courses not listed as law school courses): Economic Perspectives on Health Policy (also listed above) Environmental Law Evaluating Health Care Quality Global Health Classroom: Health Policy Principles and History of Urban Health Public Health Administration and Policy Race, Ethnicity, and Health in the United States Society, Behavior, and Health Strategic Management and Leadership in Health Care The (in)Visibility of (dis)Ability in Society Not all courses are offered each academic year. Consult the course catalog available from the Office of Academic and Student Affairs for specific information about when courses are offered. Human Rights and Economic Development Concentration Candidates for the LLM degree have the opportunity to concentrate in Human Rights and Economic Development. Both US and internationally trained lawyers are invited to join in the School of Law’s commitment to promote social, cultural and economic rights. Curriculum The concentration in Human Rights and Economic Development, which requires the completion of 24 credits, features: A Minimum of Required Courses: All LLM students concentrating in Human Rights and Economic Development take one of the following core courses as well as at least two additional courses from the list of core courses or sample course offerings listing below: Community Economic Development Human Rights in the United States Human Rights, the Environment, Development and Community Resilience Human Rights, IP and Access to Medicines International Human Rights and the Global Economy International Law Law and Economic Development LLM students concentrating in Human Rights and Economic Development who obtained their first law degree outside the US benefit from two foundational courses: Introduction to American Law and Legal Institutions and Introduction to Legal Research and Writing, which provide the background knowledge and basic skills needed to succeed in the US law school environment and in the global practice of law. A Maximum of Elective Courses: LLM students concentrating in Human Rights and Economic Development enroll in JD upper-level courses (see sample list of courses related to human rights and economic development below). Students must also complete a co-op or paper related to human rights and/or economic development. Co-op: All Experiential LLM students in good academic standing spend a term completing a full-time legal practice experience. Co-op is an integral part of the Experiential LLM curriculum – no less important than your 24 credits of course work. Northeastern has developed placement opportunities with law firms engaged in advocacy work, nonprofits, government agencies, community organizations, NGOs and other advocacy groups around the world. Where students go on co-op — in the world and where within the profession — is up to them. The LLM Professional Development Advisor works with students to define where they want to go on co-op and refine how they present their qualifications. Our goal is to help students find the co-op opportunities that best meet their unique goals. Sample Course Offerings in Human Rights and Economic Development Civil Rights and Restorative Justice Clinic Community Business Law Clinic Comparative Law: Law, Markets and Democracy in East Asia Creative and Innovative Economies: IP, Community Development, and Sustainable Business Practice Current Issues in Health Law and Policy Global Energy Justice Immigrant Justice Clinic Immigration Law International and Foreign Legal Research International Environmental Law International Trade Refugee and Asylum Law Reproductive and Sexual Rights and Health Social Welfare Law Not all courses are offered each academic year. Consult the course catalog available from the Office of Academic and Student Affairs for specific information about when courses are offered. International Business Law Concentration Candidates for the LLM degree have the opportunity to concentrate in International Business Law. Students have the ability to focus on how law and business interact in a global context. The concentration is designed for lawyers aiming to practice in the complex and constantly evolving world of business across national borders. Curriculum The concentration in International Business Law, which requires the completion of 24 credits, features: A Minimum of Required Courses: All LLM students concentrating in International Business Law are required to take one course from the following core courses as well as at least two additional courses from the list of core courses or sample course offerings listed below: International Business Transactions International Trade Law and Economic Development LLM students concentrating in International Business Law who obtained their first law degree outside the US benefit from two foundational courses: Introduction to American Law and Legal Institutions and Introduction to Legal Research and Writing, which provide the background knowledge and basic skills needed to succeed in the US law school environment and in the global practice of law. Students must also complete a co-op or paper related to international business law. A Maximum of Elective Courses: LLM students concentrating in International Business La"
