["https://law.northeastern.edu/academics/programs/jd"]
title = "JD - School of Law"
full_description = "Home / Academics / Programs / JD JD Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Live it. Learn it. A rigorous curriculum, exceptional professors and unmatched experiential learning opportunities fuel Northeastern’s one-of-a-kind academic enterprise. You’ll synergistically learn complicated legal concepts, solve real legal problems and develop research, analysis, writing and debate expertise. You’ll spend your first year diving deeply into the fundamentals of the American legal system, taking required courses such as Civil Procedure, Constitutional Law, and Property Law. Through the yearlong Legal Skills in Social Context course, you’ll develop essential skills — from legal research to client representation — and then put them into practice through a social justice community project. Through upper-level electives such as Intellectual Property, International Law and Public Health Law, you’ll build expertise in the areas you’re most passionate about. Along the way, you’ll be mentored and taught by exceptional faculty who publish in leading law journals and are hands-on pro bono practitioners. In just three years, you’ll be ready to practice law — armed with unparalleled depth of knowledge and more legal experience than graduates of any other law school. Patterns of Attendance After your first year of study, you’ll alternate between academic and co-op terms until you graduate with nearly a year of full-time legal work experience. This chart outlines the patterns of attendance to give you a better sense of how your three co-ops will fit into your three years at Northeastern University School of Law. You will have the opportunity to request your preferred rotation during your first year. Rotation A Rotation B 1L Year Fall Academic Term Academic Term Spring Academic Term Academic Term 2L Year Summer Academic Term Co‐op Term Fall Co‐op Term Academic Term Spring Academic Term Co‐op Term 3L Year Summer Co‐op Term Academic Term Fall Academic Term Co‐op Term Spring Co‐op Term Academic Term Apply Now Request Information Viewbook Pathways to Success See All Pathways Andrew Glincher ’84 Chairman Emeritus, Nixon Peabody, Boston Read My Story Mayumi Grigsby ’15"
