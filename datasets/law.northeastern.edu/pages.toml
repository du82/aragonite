title = "Center for Law, Information and Creativity (CLIC) - School of Law"
full_description = '''Home / Academics / Centers, Institutes and Programs / Center for Law, Information and Creativity (CLIC) Center for Law, Information and Creativity (CLIC) Center for Law, Information and Creativity (CLIC) Center for Law, Information and Creativity (CLIC) Academic Programs Faculty Faculty Fellowship Program Events IAPP Certification News Publications Support CLIC Center for Law, Information and Creativity (CLIC) Academic Programs Faculty Faculty Fellowship Program Events IAPP Certification News Publications Support CLIC The Future Is Just A CLIC Away ... The Center for Law, Information and Creativity (CLIC) combines the study of information and creativity with Northeastern University School of Law’s social justice mission. CLIC is a unique environment attracting diverse scholars, lawyers, students, creators, innovators, start-up ventures and established companies to study the regulation of intellectual property and technology with the aim of promoting progress. Faculty affiliated with CLIC teach courses and conduct research in information security, privacy regulation, entertainment and media law, intellectual property, internet and e-commerce, lawyering and entrepreneurship, and creative communities. Through the School of Law’s signature Cooperative Legal Education Program, CLIC provides guidance to students who seek internships with clients and organizations that are navigating the dynamic world of technology regulation, creative and scientific development, privacy, security and entrepreneurship. Northeastern's intellectual property program was awarded an “A+” in the spring 2023 issue of preLaw magazine. The magazine takes into account a law school's breadth of curricular offerings when compiling the rankings. Northeastern Law has also been ranked as a Tier 1 “Privacy School” by the International Association of Privacy Professionals (IAPP). CLIC aims to have a public impact through its research, teaching, program development and partnerships. CLIC’S On-Campus Collaborators: NuLawLab Network Science Institute Center for Resilience Studies College of Social Sciences and Humanities Cybersecurity and Privacy Institute Sustainability and Data Science Computer Science and Information Studies School of Criminology and Criminal Justice Department of Health Sciences D’Amore-McKim School of Business Ethics Institute Khoury College Information Design and Visualization (program) College of Arts, Media and Design College of Engineering School of Journalism Women's, Gender, and Sexuality Studies Program Follow CLIC on Twitter Follow CLIC on Mastodon Sign up for CLIC’s Mailing List Donate to CLIC Contact Us Northeastern received an A+ grade from preLaw/The National Jurist for its intellectual property program — only 12 law schools nationwide received this top grade. Contact Us Telephone 617.373.2683 X @NUSLclic Mailing Address 302 Knowles 416 Huntington Avenue Boston, Massachusetts 02115 Staff Directory Professor Alexandra Roberts Faculty Director al.roberts@northeastern.edu 617.373.6406 Affiliated Courses Select courses in intellectual property include: Bioproperty Branding Law and Practice Creative & Innovative Economies: IP, Community Development, Sustainable Business Practice Copyright Law Information Security Law Internet Law Entertainment Law Global AIDS Policy Seminar Intellectual Property Intellectual Property Law Clinic Intellectual Property Transactions Practice Law Practice Technology and the Legal Profession Patent Law Trademark Law Latest News Could James Bond Lose the 007 Name Because of a Trademark Claim? A Legal Expert Says It’s Not That Simple “The James Bond entities have been somewhat litigious in the past, so they’re not going to take somebody else’s use lying down,” Professor Alexandra Roberts tells Northeastern Global News. Authentic Fakes? Dupes between Law & Heritage Podcast Alert: Professor Alexandra Roberts joined A Fashion Law Dinner Party with Felicia Caponigri to unpack "dangerous dupes" and the legal nuances of influencers’ communication. Don’t miss this insightful discussion! Sean ‘Diddy’ Combs’ Case Spawns Podcasts, Docuseries and News Specials “The #MeToo movement marked the start of a reckoning in the entertainment industry and the Combs prosecution feels like the latest chapter in that story,” Professor Alexandra Roberts tells Women’s Wear Daily. Northeastern Law and Tufts Medical Center to Establish Amy J. Reed Collaborative to Promote Medical Device Safety Northeastern Law and Tufts Medical Center are joining together to establish the Amy J. Reed Collaborative for Medical Device Safety to analyze data from tens of thousands of medical devices to identify safety risks and develop legal tools to address them. Recent Video and Photo Galleries They’re Playing Our Song (Without Our Permission): Music Law on the Campaign Trail View Video They’re Playing Our Song (Without Our Permission): Music Law on the Campaign Trail View Photos SLANTED: Stories and Songs with Simon Tam and The Slants View Photos'''
