full_description = "March 12 @ 1:00 pm - 2:00 pm Fostering Belonging…Global Immigration and Employment Compliance in the Tech Industry Join the Office of New Markets for a Lunch & Learn event featuring Maya Sherr ’09, head of DEI, global immigration and compliance at MathWorks. March 13 @ 4:30 pm - 6:00 pm Mood Machine: The Rise of Spotify and the Costs of the Perfect Playlist CLIC welcomes writer and author Liz Pelly to discuss her recently released book, Mood Machine: The Rise of Spotify and the Costs of the Perfect Playlist. March 13 @ 6:00 pm - 8:00 pm “The Strike”: Screening and Conversation Experience the gripping, award-winning documentary “The Strike,” a film that tells the remarkable true story of the largest hunger strike in US history. March 18 @ 6:00 pm - 8:00 pm Not All In: Race, Immigration, and Health Care Exclusion in the Age of Obamacare Join Northeastern Law’s Center for Health Policy and Law for a book launch with Professor Tiffany Joseph. March 25 @ 6:00 pm - 8:00 pm Danielle Ponder Musical Tribute to Hope Lewis Join the Center for Law, Equity and Race for the launch of the Hope Lewis Distinguished Lecture, featuring a musical tribute by award-winning R&B singer-songwriter Danielle Ponder ’11. March 26 @ 12:45 pm - 2:00 pm Hope Lewis Distinguished Lecture: Gay McDougall 240 Dockser Hall, Northeastern University School of Law 65 Forsyth St., Boston, MA, United States Gay McDougall, distinguished scholar-in-residence at Fordham Law’s Leitner Center for International Law and Justice, will deliver the inaugural Hope Lewis Distinguished Lecture. April 3 @ 3:00 pm - 5:00 pm Valerie Gordon Human Rights Lecture Anne Orford, Melbourne Laureate Professor and Michael D Kirby Chair of International Law at Melbourne Law School, will deliver the 30th annual Valerie Gordon Human Rights Lecture. April 9 @ 6:00 pm - 8:00 pm Connections 2025 Join us for Connections, the law school’s largest networking event. April 18 @ 8:15 am - 5:00 pm Three Years After Dobbs — The Reproductive Justice Landscape The Center for Health Policy and Law will host its 2025 conference on Friday, April 18, offering critical insights into the state of reproductive rights three years after the Dobbs v. Jackson decision. The conference will feature a keynote address by Professor Khiara M. Bridges of Berkeley Law, a prominent scholar on race, class and reproductive rights."
