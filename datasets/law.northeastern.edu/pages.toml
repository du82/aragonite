["https://law.northeastern.edu/academics/programs/jd/dual-degrees/professional-accounting"]
title = "Professional Accounting - School of Law"
full_description = "Home / Academics / Programs / JD / Dual Degrees / Professional Accounting Professional Accounting Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources JD/MSA/MBA in Professional Accounting This Northeastern University program offers students with non-accounting undergraduate degrees the opportunity to earn a JD from the School of Law and a joint master of science in accounting and master of business administration (MSA/MBA) from the D’Amore-McKim School of Business. The four-year program is particularly effective preparation for those seeking careers in taxation, corporate finance or mergers and acquisitions. The program takes advantage of Northeastern’s unique and dynamic co-op program to provide students with multiple opportunities for real-world, experiential learning – one with a public accounting firm and others with a law department, firm, government office or judge. Some of the licensing requirements for the CPA apprenticeship can be satisfied by co-op, and members of the Massachusetts bar are automatically exempted from the business law section of the CPA examination. JD/MSA/MBA candidates must first complete the 1L and 2L program in the School of Law, followed by the 15-month program in the D’Amore-McKim School of Business. Students then return to the School of Law for their final law school terms. The Business Law and Professional Ethics course is waived for students completing the JD/MSA/MBA program. Possible Patterns of Attendance Semester JD‐MSA‐MBA After 2L JD‐MSA‐MBA After 2L 1L Fall Classes Classes 1L Spring Classes Classes Summer JD Co-op JD Classes Fall JD Classes JD Co‐op Spring JD Co-op JD Classes Summer Business Classes Business Classes Fall Business Classes Business Classes Spring Business Classes & The Accounting & Law Co‐op Business Classes & The Accounting & Law Co‐op Summer Business Classes Business Classes Fall JD Classes JD Co-op Spring JD Classes (Change of Rotation) JD Classes Examples of Relevant JD Electives Antitrust Basic Income Taxation Business Bankruptcy Collaborative Businesses Corporate Finance Corporations Employment Law — Compensation, Benefits and Retirement Employment Law — Job Security and Rights Inside Counsel Intellectual Property International Business Transactions International Trade Negotiation Secured Transactions Securities Regulation Examples of MSA/MBA Courses in the Program Customer Value and the Enterprise Financial Management Managing the Organization Strategic Planning for the Future Taxation of Individuals and Business Entities Examples of Law Co-ops Bank of America EMC Corporation Federal Communications Commission Federal Reserve Bank of Boston Fidelity Investments Goodwin Procter Greenberg Traurig National Association of Broadcasters Nixon Peabody, Boston Ocean Spray One Laptop Per Child Partners Health Care Raytheon Company Seyfarth Shaw WGBH WilmerHale Examples of Accounting Co-ops Deloitte Ernst & Young KPMG PricewaterhouseCoopers Admission Candidates for the JD/MSA/MBA program must independently apply and gain admission to the School of Law and the D’Amore-McKim School of Business. Admission to one school does not ensure admission to the other. Law students must apply to the MSA/MBA program during the fall of their second year for enrollment in the spring. Students enrolled in the law school who are interested in pursuing this dual degree should contact the Offices of Academic and Student Affairs during their first year for further information. Visit the D’Amore-McKim School of Business for more information on the JD/MSA/MBA program. Further details on the professional accounting program may be obtained by contacting: Julie Chasse Director, Graduate Tax and Accounting Programs D’Amore-McKim School of Business 412 Dodge Hall 360 Huntington Avenue Boston, MA 02115 Phone: 617.373.4621 E-mail: j.chasse@northeastern.edu Apply Now Areas of Study JD x Certificates"
