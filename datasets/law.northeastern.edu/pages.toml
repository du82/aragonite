title = "Events - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / Center for Public Interest Advocacy and Collaboration (CPIAC) / Events Events Centers, Institutes and Programs Centers, Institutes and Programs Center for Public Interest Advocacy and Collaboration (CPIAC) Affiliated Programs Contact Us Events Faculty Pro Bono Opportunities Projects Student Engagement Support CPIAC Centers, Institutes and Programs Center for Public Interest Advocacy and Collaboration (CPIAC) Affiliated Programs Contact Us Events Faculty Pro Bono Opportunities Projects Student Engagement Support CPIAC Join us in Promoting Social Justice! Coffee Hours The Center for Public Interest Advocacy and Collaboration hosts regular gatherings for coffee and conversation. We provide coffee and treats in the sun room (1st floor library). No registration is necessary. Watch the Weekly Wire for announcements of upcoming Coffee Hours. Recent coffee hour speakers have hailed from: Immigrant Detention Conditions Project of Massachusetts Law Reform Institute and Prisoners Legal Services Movement for Family Power City Life/Vida Urbana Muslim Justice League Greater Boston Legal Services Suggestions for future topics or guests? Please let us know! Email cpiac@northeastern.edu. Comment Parties In partnership with student groups, CPIAC periodically sponsors comment-generating parties on rules such as a Department of Health and Human Services proposal that would have negative implications for LGBTQ+ foster youth and a HUD proposal that would put 55,000 children at risk of eviction due to living with undocumented family members. If you would like to receive word of upcoming comment parties, let us know! Upcoming Events March 13, 2025 6:00 pm to 8:00 pm “The Strike”: Screening and Conversation April 3, 2025 3:00 pm to 5:00 pm Valerie Gordon Human Rights Lecture April 18, 2025 8:15 am to 5:00 pm Three Years After Dobbs — The Reproductive Justice Landscape"
