full_description = "Home / Alumni/ae Alumni/ae Alumni/ae Alumni/ae Benefits Stay Connected Alumni/ae Association Regional Chapters Reunion and Alumni/ae Weekend Brown Forum for Women in the Law Speed Mentors Conference Materials Practitioner-in-Residence Program News and Events Zoomin’ In Zoomin’ Out Books by Graduates Contact Us Alumni/ae Benefits Stay Connected Alumni/ae Association Regional Chapters Reunion and Alumni/ae Weekend Brown Forum for Women in the Law Speed Mentors Conference Materials Practitioner-in-Residence Program News and Events Zoomin’ In Zoomin’ Out Books by Graduates Contact Us Graduation is Just the Beginning As a graduate, you carry the mission, teachings and experience of Northeastern University School of Law with you as you work to make an impact in communities around the world. No matter how much you grow in your career or where in the world you go, we want to maintain close ties with you. We offer you opportunities to advance your career through advisory services and job search tools, help you network with classmates and older and younger graduates, and provide mentorship and support to a current student. It's easy to stay connected with your law school. Read Northeastern Law magazine, keep in touch using a range of social media, attend special on- and off-campus events and meet fellow graduates through our secure online community. More than 8,000 strong worldwide, Northeastern Law alums are a powerful and valuable group of colleagues and friends. Make a Gift Submit a Class Note Submit Your Address Update Join Your Local Alumni/ae Chapter Northeastern Law Magazine Financial Aid Resources Alumni/ae in the News Mary Bonauto ’87 to Deliver Special Presentation at Brown Forum for Women in the Law Conference Legendary gay rights advocate Mary Bonauto ’87 will deliver a special presentation at Northeastern Law’s 17th annual Brown Forum for Women in the Law Conference on May 1, 2025. Not All Sunshine and Roses: A Bates Journey In an interview wi