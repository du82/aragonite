way with new or enhanced skills and talents, including: powerful written and oral communication skills sophisticated techniques for translating complex situations into key elements strategies for listening to — and truly hearing —other people’s opinions anticipating pitfalls and providing solutions comfort with ambiguity and the skills to help teams work through thorny issues Co-op The School of Law educates our JD and On-Campus LLM students who opt for the 12-month program through academically rigorous coursework integrated with our signature Cooperative Legal Education Program (co-op). Placement opportunities may include law firms, companies, clinics, courts, government agencies, community organizations or advocacy groups. Guided by the LLM professional development advisor, you'll define your professional objectives and identify a co-op opportunity that meets your unique goals. Independence LLM students have an opportunity to undertake an independent research project in an area of law they are interested in exploring and complete a research paper under the guidance of a Northeastern law faculty member, either in conjunction with an upper-level seminar or as independent study. Timeline On-Campus LLM: nine months On-Campus Experiential LLM with co-op: 12 months All students start in September. Students are encouraged to apply by April 1. Apply Now Request Information Viewbook Online LLM Take Our Virtual Tour Take our Virtual Tour Meet Our Faculty Wallace Holohan Senior Clinical Specialist and Director, Prisoners’ Rights Clinic Fitchburg State University, BA 1976 View Profile Sonia Rolland Professor of Law Institut d'Études Politiques de Paris (France), BA 1999 Université Paris-10 (France), MA 2000 University of Michigan, JD 2003 Cambridge University (UK), PhD 2009 View Profile Margaret Woo Professor of Law Brown University, AB 1979 New York University, JD 1983 Georgetown University, LLM 1989 View Profile Rashmi Dyal-Chand Professor of Law; Vice Provost for Academic 