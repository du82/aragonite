["https://law.northeastern.edu/admissions/flexjd/financial-aid"]
title = "Financial Aid - School of Law"
full_description = "Home / Admissions / FlexJD / Financial Aid Financial Aid Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us FlexJD Financial Aid The School of Law has a number of financial assistance programs to ensure you’ll get the support you need to earn a top-rate legal education. We are pleased to provide information about tuition scholarships, loans and additional resources. We also suggest you check out our curated list of financial aid links at the bottom of this page for information on outside scholarships and writing competitions. How to Apply At Northeastern Law, we are committed to providing access to all admitted students. We recognize that most students require financial assistance to cover the cost of attending law school; our job is to make that process as smooth as possible for you. The law school offers financial assistance through federal and institutional aid programs. In order to be considered for these programs, students must complete the financial aid process each year. All applicants requesting need-based financial assistance (federal loans, institutional scholarships/grants) are required to submit the FAFSA (Free Application for Federal Student Aid) by the stated filing dates to ensure priority consideration. If you are not eligible for federal financial aid, please contact the Office of Financial Aid to submit a statement of income to be considered for non-federal need-based grants and scholarships. First-Year Applicants Some students mistakenly believe they must wait for a decision on their admission application before beginning their aid application. It is important that any student interested in receiving aid apply by the priority application dates. To be considered for all sources of financial assistance students must complete the Free Application for Federal Student Aid (FAFSA). Northeastern Law does NOT require parental information on the FAFSA. Applicants should file this form through the federal government’s website: studentaid.gov. Northeastern’s federal institution code is 002199. The priority filing date for FAFSA is February 15. Current Students The Office of Financial Aid staff are committed to supporting you throughout your time in the FlexJD program and beyond. We encourage you to seek us out if you have questions about your assistance package, changes in your financial situation and for information about loans, loan repayment or any other financing options available to you. We would like to remind you that: You must fill out a FAFSA for each year you plan to be on financial assistance by the stated filing dates to ensure priority consideration. You may apply for additional scholarships (endowed scholarships) through the Office of Financial Aid for your upper-level years of law school. Check out our Loan Deferral and Forgiveness Program if you plan to pursue a public interest law career. Conditional Scholarships Northeastern University School of Law does not award scholarships that may be reduced or eliminated based on law school academic performance other than failure to maintain good academic standing. Loans Additional Resources for Current Students Request Info Types of Aid Merit-based Tuition Scholarships The School of Law offers merit-based tuition awards to select admitted applicants. These decisions are made through a committee process and take into consideration factors such as leadership skills, years of work experience, academic achievements and overcoming adversity. Merit-based scholarships can only be applied to tuition. Northeastern University Law Grants Northeastern University Law Grants (NULG) are tuition scholarships awarded to first-year students based on need. Recipients of this institutionally funded program are not required to repay this award. The Office of Financial Aid determines all NULG award decisions. To be eligible, you must be an admitted student and file a FAFSA. Endowed Scholarships A variety of modest need-based tuition scholarships are awarded annually to upper-level students; some of these scholarships have very specific eligibility criteria. The application process for these named scholarships is separate and distinct from the application for financial aid. The application process for these scholarships is separate and distinct from the application for financial aid. Endowed scholarships are awarded each fall. The application will be posted in the Weekly Wire during the beginning of the fall term. Outside Scholarships Outside organizations offer limited scholarships for prospective and current law students. We encourage you to explore our list of outside scholarships. Federal Student Loans To be eligible for this loan, you must file a FAFSA and be eligible for federal aid. Under this program, a law student may borrow as much as $20,500 per academic year up to a maximum indebtedness of $138,500 over the student’s entire educational career. The Federal Unsubsidized Loan is a non-need-based loan program. Federal Direct Unsubsidized Loans have an interest rate of 5.28%. The standard repayment period is for 10 years. Federal Graduate Plus Loans To be eligible for this loan, you must file a FAFSA and be eligible for federal aid. Students can borrow the PLUS loan to supplement the Federal Unsubsidized loans that are currently available. The Federal Graduate PLUS Loan has a fixed interest rate of 6.28%. A basic credit check is performed. Repayment can be 10-25 years based on the amount borrowed. To apply for the PLUS loan, you must complete the Graduate Plus Loan Application on StudentLoans.gov using your FSA ID and password. Co-op Stipends The School of Law awards limited co-op stipends to eligible students completing public interest co-ops. Support comes from the school's Fund for the Public Interest and other stipend programs. Stipends have allowed co-op students to represent immigrants seeking political asylum, tenants fighting to prevent eviction, women seeking shelter from domestic violence, children trying to obtain educational services, mothers seeking child support payments, inmates challenging overcrowded prison conditions and more. FlexJD Financial Aid Frequently Asked Questions How do I apply for financial aid? All students interested in being considered for financial aid must fill out the Free Application for Federal Student Aid (FAFSA), available at studentaid.gov. Northeastern’s federal institution code is 002199. If you are not eligible for federal financial aid, please contact the Office of Financial Aid to submit a statement of income to be considered for non-federal need-based grants and scholarships. Is there a deadline to apply for aid? Northeastern Law’s priority financial aid filing deadline is February 15. Students can apply for aid after the priority deadline, but because we have limited need-based funding it is best to apply before the deadline. How do I receive my refund? All financial aid funds flow through the student’s tuition account at the university. Once all charges for the term have been satisfied, any excess from financial aid funds can be released and will be automatically distributed directly to the student. If you wish to receive a direct transfer to your personal bank account, make sure to complete the Direct Deposit form in your Student Hub portal. Checks are mailed to the student’s address if they have not completed a direct deposit form (see instructions below). Funds cannot be released to a student any earlier than the first day of the term. As such, it is important that each student adequately prepares to meet their living expenses through at least the first week of each term. How do I get my funds? In order for your funds to be direct deposited into your bank account, you must complete the Direct Deposit Form. You can do this by logging into your Student Hub account. Under “Resources,” select “Financial Services.” You will see a link called “Direct Deposit Form.” Please complete and submit. How do I put my loans into deferment once I am in law school? For students needing verification of enrollment, please visit the Registrar’s website. Are my scholarships conditional? Northeastern University School of Law does not award scholarships that may be reduced or eliminated based on law school academic performance other than failure to maintain good academic standing. Financial Aid Links Informational and Scholarship Searches CollegeNET FASTWEB Scholarship Search FinAid! The SmartStudent Guide to Financial Aid Government Links US Department of Education Financial Aid FAFSA on the Web Federal Student Aid Selective Service System Internal Revenue Service (forms & publications) Contact Financial Aid If you have questions about the financial aid application process, you are welcome to contact our financial aid team at 617.373.4620 or lawfinaid@northeastern.edu. Kenneth Kaufman ’15 Vice President and Counsel, Wellington Management, Boston Read My Story Golda Philip JD/MPH ’08"
