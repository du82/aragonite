["https://law.northeastern.edu/experience"]
title = "Experiential Learning / Co-op - School of Law"
full_description = "Home / Experiential Learning / Co-op Experiential Learning / Co-op Experiential Learning / Co-op Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success Experiential Learning / Co-op Co-op Interactive Map Plan Your Co-ops Contact Us Clinics Civil Rights and Restorative Justice Clinic Community Business Clinic Domestic Violence Clinic Housing Rights Advocacy Clinic Immigrant Justice Clinic Intellectual Property Law Clinic Prisoners’ Rights Clinic Public Health Advocacy Clinic Legal Skills in Social Context Information for Students Information for Partner Organizations News and Announcements Faculty and Fellows Fellowship Skills-Based Courses Pathways to Success Don’t Try This At Home Experience really does make a difference — and when it comes to giving students the opportunity to learn by doing, there’s simply no place like Northeastern. Our signature Cooperative Legal Education Program (co-op) guarantees you almost a year of full-time work experience. No other law school program comes close. Over the past few years, most law schools have come to recognize the importance of hands-on legal experiences. At the edges of their programs, they’ve added clinics or externship programs. But, only Northeastern offers co-op. That one difference makes all the difference. With more than five decades of experience in integrating theory and practice, Northeastern is the unparalleled leader in providing students with practical experience. By integrating co-ops into your law school experience, Northeastern enables you to graduate with polished legal skills, valuable connections in your field and the confidence and resume of a legal professional. Traditional hands-on learning experiences — including clinics, moot court competitions, law journals and simulation courses — enable you to explore different areas of the law and hone your legal skills. These invaluable opportunities are all part of the mix at Northeastern and virtually every other law school. But more than any other factor, your Northeastern co-ops will help you determine where to apply your talents and build the skills to step confidently into the legal career of your choice. And you will not be alone in the process. From the moment you step onto campus, you will receive one-on-one guidance from an advisor in the Center for Co-op and Career Development. You'll design a personal learning path in which you gain the relevant experience and comprehensive skills demanded by the 21st century economy. Pathways to Success All Pathways Nana Adu ’23 Law Clerk, Fried Frank, New York Read My Story Luke Blackadar ’14"
