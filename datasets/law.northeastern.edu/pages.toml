["https://law.northeastern.edu/academics/areas-of-study/race-and-the-law"]
title = "Race and the Law - School of Law"
full_description = "Home / Academics / Areas of Study / Race and the Law Race and the Law Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Race and the Law If you want to join in the national conversation about race and the law and make an impact, there is no better community of scholars and champions to engage with than the faculty, staff and students at Northeastern Law. Our Civil Rights and Restorative Justice Project (CRRJ) is a national leader in investigating and documenting lynchings and the massive breakdown in law enforcement in the South during the Jim Crow era. Our Center for Law, Equity and Race (CLEAR) brings together our pioneering programs and faculty — long engaged in theoretical and translational research, innovative pedagogy and collaborations with external communities — to address today’s challenges and provide tomorrow’s solutions for the nation’s most complex social challenges. Through the CRRJ Clinic, you can investigate cold cases, work on reports and recommendations related to racism and ending police brutality and take part in CRRJ’s wide range of conferences dealing with racism, reparations and restorative justice. You can also join in the work of our Criminal Justice Task Force, which is focused on addressing policies and practices in the criminal justice system that disenfranchise the most vulnerable members of society, or our Center for Public Interest Advocacy and Collaboration’s projects related to voter disenfranchisement and disrupting the school-to-prison pipeline. Our faculty also incorporate issues of race and the law into a wide range of courses and our community regularly comes together to discuss critical issues and produce meaningful blueprints to creating change. Apply Now Interdisciplin