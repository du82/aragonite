["https://law.northeastern.edu/academics/programs/non-lawyers"]
title = "Programs for Non-Lawyers - School of Law"
full_description = "Home / Academics / Programs / Programs for Non-Lawyers Programs for Non-Lawyers Academics Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Master the skills and language of the law to advance your career. The School of Law offers a variety of programs for non-lawyer professionals. Each program is committed to enhancing your understanding of the law and helping you become indispensable to your employer when it comes to navigating complex legal terrain. Master of Science in Media Advocacy The Master of Science (MS) in Media Advocacy enhances students’ abilities to lead and contribute to mission advancing efforts for a wide variety of organizations – from advocacy and lobbying organizations, trade and labor groups, and nonprofit entities, to strategic communication and government affairs departments. Created through a collaboration between the School of Journalism and School of Law, the degree uniquely combines foundations in governmental structures and the legal system with sophisticated training in the latest communication techniques. These include social media, web communications and videography, as well as data analytics and data-driven storytelling. Master of Legal Studies (MLS) Become an expert in your industry’s legal issues. Online Programs for Non-Lawyers The School of Law offers online programs to help non-lawyer professionals enhance their understanding of the law and become indispensable to their employers when it comes to navigating complex legal and regulatory terrain. Master of Legal Studies (MLS) A distinctive program for the aspiring professional eager to obtain the tools, skills and expertise to thrive and grow in your industry Graduate Certificate in Business Law To provide professionals in large and small enterprises with an ability to recognize and leverage the laws that regulate business organizations and transactions Graduate Certificate in Health Law If you work in the healthcare industry and are looking to expand your legal knowledge, but are not quite ready to pursue a master’s degree Graduate Certificate in Human Resources (HR) Law Responding to an increasing need for professionals with a solid understanding of the laws and regulations that govern employee management. Graduate Certificate in Intellectual Property Law Designed to provide professionals who work in intellectual property, technology transfer, licensing, as well as inventors and entrepreneurs, with the skills they need to recognize and protect intellectual property rights. Data Privacy Fundamentals Data Privacy Fundamentals is designed to introduce data privacy to a wide audience and help each participant see how data privacy has evolved as a compelling concern to public and private organizations as well as individuals. Meet Our Faculty Karl Klare George J. and Kathleen Waters Matthews Distinguished University Professor and Professor of Law Columbia University, BA 1967 Yale University, MA 1968 Harvard University, JD 1975 University of Pretoria, LLD 2015 View Profile Quisquella Addison Assistant Teaching Professor; CLEAR Faculty Fellow Mount Holyoke College, BA 2002 Benjamin N. Cardozo School of Law, JD 2011 View Profile Rose Zoltek-Jick Associate Teaching Professor and Associate Director, Civil Rights and Restorative Justice Project University of Toronto, BA 1977 Osgoode Hall Law School, LLB 1981 Harvard University, LLM 1986 View Profile Andrew Haile Assistant Teaching Professor Middlebury College, BA 2007 Boston College Law School, JD 2015 View Profile Margaret Burnham University Distinguished Professor of Law; Director of Reparations and Restorative Justice Initiatives; Director, Civil Rights and Restorative Justice Project; Faculty Co-Director, Center for Law, Equity and Race (CLEAR) Tougaloo College, BA 1966 University of Pennsylvania, LLB 1969 View Profile Kristin Madison Professor of Law and Health Sciences; Associate Dean for Academic Programs University of California, Berkeley, BA 1992 Yale University, JD 2000 Stanford University, PhD 2001 View Profile All Faculty"
