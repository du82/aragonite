["https://law.northeastern.edu/academics/centers/crrj"]
title = "Civil Rights and Restorative Justice Project - School of Law"
full_description = '''Home / Academics / Centers, Institutes and Programs / Civil Rights and Restorative Justice Project Civil Rights and Restorative Justice Project Centers, Institutes and Programs Centers, Institutes and Programs Center for Law, Equity and Race About Us Affiliated Programs Judicial Programs Fellowships Gants Judicial Scholarship Events Hope Lewis Distinguished Lecture News Civil Rights and Restorative Justice Project Criminal Justice Task Force Centers, Institutes and Programs Center for Law, Equity and Race About Us Affiliated Programs Judicial Programs Fellowships Gants Judicial Scholarship Events Hope Lewis Distinguished Lecture News Civil Rights and Restorative Justice Project Criminal Justice Task Force Civil Rights and Restorative Justice Project The Civil Rights and Restorative Justice (CRRJ) Project, founded by University Distinguished Professor Margaret Burnham, addresses harms resulting from the massive breakdown in law enforcement in the South from 1930 through 1970. This was a time of great political protest and turmoil as African Americans and their allies militantly rejected Jim Crow, second-class citizenship and economic exploitation. CRRJ conducts research into the nature and extent of anti-civil rights violence and works with members of a diverse community – prosecutors, lawmakers, victims – that is seeking genuine reconciliation through legal proceedings, law reform and private investigations. CRRJ works with these groups to assess and develop a range of policy approaches, including criminal prosecutions, truth and reconciliation proceedings, and legislative remedies. On the research front, CRRJ’s work aims to develop reliable data with which to analyze events of anti-civil rights violence and to support research into the history and current significance of anti-civil rights violence. The two components of CRRJ’s program are research and remediation. Scholars from a range of disciplines – including law, criminal justice, history, sociology, and political science – are engaged in CRRJ’s empirical research, the main program of which is compiling and analyzing information about anti-civil rights harms The research program also encompasses CRRJ’s work on cold Civil Rights-era cases. The remediation program assesses and supports policy measures to redress the harms, including prosecution, truth and reconciliation proceedings, state pardons and apologies by state and private entities who bear responsibility for the harms. Look and Listen >> Read “Let the Records Show” in the winter 2023 Northeastern Law magazine >> Read “Resurrection” in the summer/fall 2010 Northeastern Law magazine >> Download the CRRJ 2023 Year End Annual Report >> Watch “The Trouble I’ve Seen,” an award-winning documentary about CRRJ’s work, narrated by legendary civil rights leader Julian Bond >> Visit the photo gallery featuring Toni Morrison’s appearance at CRRJ’s Martin Luther King celebration Who We Are Founder and Director Professor Margaret Burnham m.burnham@northestern.edu Associate Director Rose Zoltek-Jick r.zoltek-jick@northeastern.edu 617.373.4947 Program Coordinator Jennifer True j.true@northeastern.edu 617.373.3088 Managing Director, Center for Law, Equity and Race Deborah Jackson de.jackson@northeastern.edu 617.373.4066 Communication Specialist Catherine McGloin c.mcgloin@northeastern.edu 617.373.6133 Historian Jay Driskell j.driskell@northeastern.edu 617.373.4488 Join Our Mailing List Read Our Blog Donate to CRRJ CRRJ on Bluesy CRRJ on Facebook CRRJ on Instagram Watch CRRJ Professor Margaret Burnham Retro Report Short Documentary, “Ida B. Wells and the Long Crusade to Outlaw Lynching,” (Released February 15, 2024). Professor Margaret Burnham Receives the 2023 Hillman Prize for Book Journalism (May 9, 2023) Live from the New York Public Library: Reconstructing the Violence of Jim Crow with Margaret A. Burnham and Saidiya Hartman (October 20, 2021) C-SPAN Interview: Q&A with Margaret Burnham, "By Hands Now Known" (October 15, 2022) Professor Margaret Burnham, author of By Hands Now Known: Jim Crow’s Legal Executioners, talks about the largely unknown Black victims of racial violence in the South between the early to mid-twentieth century. “History is Lunch: Margaret A. Burnham, "By Hands Now Known: Jim Crow’s Legal Executioners",” (October 12, 2022). History is Lunch Event Hosted by the Mississippi Department of Archives & History >> Watch Video A Fireside Chat with Professors Margaret Burnham and Deborah Ramirez, co-directors of Northeastern Law’s New Center for Law, Equity and Race (CLEAR). Brown Forum | Women in the Law Conference Keynote (May 13, 2022) A Conversation Between Professor Margaret Burnham and Professor Régine Jean-Charles Northeastern University’s Annual Event Honoring Dr. Martin Luther King, “A Tribute to the Dream: Voting Rights and the ‘Threat to Justice Everywhere,’” (January 17, 2022) Digital Short:“The War at Home,” PBS | American Experience (April 14, 2021) ) A Tribute to the Dream: The Need for 'Good Trouble' January 2021 Murder in Mobile (January 2019) A documentary short film about race, murder and one family’s search for the truth seventy years later. In 1948, in Mobile, Alabama, a black man named Rayfield Davis was beaten to death by a white man who was not prosecuted. The crime was forgotten until 2012, when Northeastern Law’s Civil Rights and Restorative Justice Project (CCRJ) assigned student Chelsea Schmitz ’13 to investigate. Watch this remarkable story of justice served at long last. “Northeastern Program Uncovers the Stories Behind the Victims Of Lynching and Other Racial Violence in the Jim Crow Era” WGBH's Greater Boston (May 2, 2018). “Great-Grandson of Lynching Victim Faces the Past: "This is American History" (CBS Evening News, April 10, 2018) CRRJ Featured on Higher Ground, WHDH Channel 7, Boston (October 18, 2015) Professor Margaret Burnham on CCTV America Professor Burnham discusses the significance of Nobel Peace award shared by Indian and Pakistani activists (October 10, 2014) The Trouble I've Seen Northeastern University Documentary Narrated by Julian Bond, Former Chairman of the NAACP (2013) CITYLINE Interview with Director Rebecca Miller (February 17, 2013) Interview with director Rebecca Miller discussing the video documentary, The Trouble I’ve Seen, which was produced for Northeastern Law’s Civil Rights and Restorative Justice project. CRRJ In the News “A Black Soldier Receives a Full Military Funeral — 83 Years After His Death. Here Is His Story,” NGN Magazine (April 25, 2024). “CRRJ Director Gives Talk at SXSW 2024,” CRRJ News Announcement (March 2024) “83 Years After His Killing, a Black Soldier Gets an Army Funeral,” The New York Times (March 25, 2024). “Column: Justice for a Black Soldier After 80 Years, With Help From These Lawyers,” Reuters (March 20, 2024). “Pvt. Albert King Receives Full Military Service, 83 Years After His Murder,” CRRJ News Announcement (March 2024). “Wu Announces Research Teams for Task Force on Reparations,” Bay State Banner (January 24, 2024). “Northeastern Law Team Selected as Research Partner by Boston’s Task Force on Reparations,” Northeastern Law News Announcement (January 24, 2024). “'Behind the Blue': Uncovering truth with Civil Rights and Restorative Justice-Kentucky,” University of Kentucky News (February 6, 2024). “Black Soldier Killed During Jim Crow Era Now Honored With Historical Marker in N.C.,” NPR (December 13, 2023). “A Durham Moment: ‘We Can Only Inspire Young Folks if We Teach the Truth’,” 9th Street Journal (December 5, 2023). “By Hands Now Known Wins The Hurston/Wright Legacy Award,” CRRJ News Announcement (October 26, 202). “Margaret Burnham is 2023 Governor’s Awards in the Humanities Honoree,” Northeastern Law News Announcement (October 2, 2023). “Burnham, Bonauto and Kauffman to be Inducted into MLW Hall of Fame,” Northeastern Law News Announcement (August 29, 2023). “Study Finds Springfield Race Riot Site Meets Criteria To Be National Park,” State Journal-Register (June 15, 2023). “Posthumous Pardon Hearing To Be Held in Joe James Case,” CRRJ News Announcement (April 2023). “Restoring Justice and Setting the Record Straight,” Morgan Lewis News Announcement (January 20, 2023). “Black WWII Soldiers Asked a White Woman for Doughnuts. They Were Shot." The Washington Post (January 15, 2023). “Lost, but Not Forgotten: The Story of Denna and Estella Strickland,” Atlanta Daily World (January 6, 2023). “Army Corrects the Record About a Black Soldier Killed by a White Sergeant in 1941,” The New York Times (December 10, 2022). “Northeastern Professor’s New Novel Explores Civil Rights-Era Cold Case,” News@Northeastern (November 16, 2022). “The U.S. Thinks ‘It Can’t Happen Here.’ It Already Has,” The New York Times (October 18, 2022). Video: “Q&A with Margaret Burnham, "By Hands Now Known",” C-SPAN (October 15, 2022). “Noted Lawyer to Speak in Birmingham on Sunday about ‘Jim Crow’s Legal Executioners’,” Birmingham Times (October 15, 2022). Video: “History is Lunch: Margaret A. Burnham, "By Hands Now Known: Jim Crow’s Legal Executioners",” History is Lunch Event Hosted by the Mississippi Department of Archives & History (October 12, 2022). “The Most Consequential Project We Have.’ New Archive Gives Voice to Forgotten Victims of Lynching,” News@Northeastern (October 7, 2022). “Law Professor Unearths Cases of Racial Violence from the Jim Crow Era,” NPR’s “Fresh Air” (September 27, 2022). “1,000 Racial Homicides Investigated in Unprecedented Burnham-Nobles Digital Archive,” Northeastern Law News Announcement (September 27, 2022). “Jim Crow’s Forgotten History of Homicides,” The New York Times (September 21, 2022). “How the Jim Crow South Encouraged Racial Policing by Those With ‘No Legal Authority,” News@Northeastern (September 20, 2022). “Chicago Humanities Festival announces fall headliners, including Patti Smith, Jessica Lange and Chelsea Manning,” Chicago Tribune (September 13, 2022). “Professor Margaret Burnham’s New Book, By Hands Now Known, Challenges Our Understanding of the Jim Crow Era,” Northeastern Law News Announcement (September 12, 2022). “Finalists for the 2022 Kirkus Prize are Revealed,” Kirkus (September 8, 2022). “30 Books We Can’t Wait for This Fall,” Los Angeles Times (August 30, 2022). “By Hands Now Known: Jim Crow’s Legal Executioners,” Publishers Weekly (August 2022). “Writers to Watch: Fall 2022 Nonfiction Debuts,” Publishers Weekly (July 29, 2022) “Algiers Remembers Edwin Williams, Sr.,” WWL-TV (June 23, 2022). “Northeastern’s Racial Redress and Reparations Lab Is Creating a Tool for Lawmakers To Pursue Racial Redress,” News@Northeastern (June 15, 2022). “Two Years After George Floyd’s Murder, Has Anything Changed in Policing?,” News@Northeastern (May 25, 2022). “Remembering Bob Moses, 1935–2021,” The Nation (July 26, 2021). “Albert King is Not Forgotten,” The Washington Post Magazine (May 28, 2021). “Call For Action: The Guilty Verdicts in Derek Chauvin’s Trial Were Just the Beginning,” News@Northeastern (April 22, 2021). “Derek Chauvin’s Guilty Verdict Is a Step Toward Justice and Police Reform–but It’s Not the End of Racism in the US,” News@Northeastern (April 22, 2021). Digital Short:“The War at Home,” PBS | American Experience (April 14, 2021). “Payback for Pain and Loss: Reparations for Relatives of Lynching Victims?,” Mississippi Center for Investigative Reporting (November 24, 2020). “Reparations ‘Essential’ to Addressing Systemic Racial Injustice, Speakers Say,” News@Northeastern (November 17, 2020). “72 Years Before George Floyd, This Police Killing Sparked National Protests,” Experience Magazine (November 12, 2020). “The John Lewis Legacy: Protecting the Right to be Free from Racist Policing,” CRRJ Blog (July 30, 2020). “A Black Man Accused of Rape, a White Officer in the Klan, and a 1936 Lynching That Went Unpunished,” The Washington Post (July 19, 2020). “Unearthing the Stories of Yesterday’s George Floyds,” The Boston Globe (July 17, 2020). “Don’t Touch Your Face: Pandemic Within a Pandemic,” Foreign Policy Podcast (June 15, 2020). “US Police Brutality Protests,” Al-Jazeera (June 2020). “Todd & Weld LLP Provides Support to CRRJ in Honor of George Floyd,” Northeastern Law News Announcement (June 4, 2020). “How Do Today’s Black Lives Matter Protests Compare to the Civil Rights Movement of the 1960s?,” News@Northeastern (June 4, 2020). “The Half Was Never Told: Honoring George Floyd,” CRRJ Blog (June 2, 2020). “A Black Man was Killed in Georgia, Should the Case be Tried as a Hate Crime?,” News@Northeastern (May 21, 2020). “Was Ahmaud Arbery Lynched and Why Does it Matter?,”CRRJ Blog (May 9, 2020). “Boy Scout Sex-Abuse Suit Involving Floridian Could Open Floodgates for More Victim Claims,” Miami Herald, January 6, 2020. “Mellon Foundation Awards $750,000 to Northeastern Law’s Civil Rights and Restorative Justice Project,” Northeastern Law News Announcement (September 17, 2019). “Toni Morrison’s Influence Extends Beyond Literature,”Northeastern News (August 9, 2019). “Ford Foundation Funds CRRJ Archive,” Northeastern Law Magazine (August 21, 2019). “Toni Morrison’s Influence Extends Beyond Literature,” News@Northeastern (August 9, 2019). “Murder in Mobile Hits the Red Carpets,” News@Northeastern (June 20, 2019). “NJ Teens That Tweeted Their Civil Rights Bill Into Law Will Now Lobby for Federal Funding,” Fox News (March 8, 2019). “‘From Students in High School All the Way to the President’s Desk.’ How a Government Class Fought for the Release of Unsolved FBI Civil Rights Case Files,” The Washington Post (February 23, 2019). “Teens Tweet Trump, Find Senate Ally, Score Civil Rights Win,” Associated Press (February 23, 2019). “The Healing Project: Finding Justice for Families of Victims of Injustice,” The Louisiana Weekly (November 26, 2018). “Mobilian Honored With Street Dedication 70 Years After His Murder,” WSFA (August 18, 2018). “Recalling Their Names: Mobile Honors Victims of Jim Crow-Era Killings,” AL.com (August 18, 2018). “After Seven Decades, Alabama Honors Jim Crow-Era Victims,” News@Northeastern (August 18, 2018). “Memorializing Racially-Motivated Deaths Beyond Lynchings,” The American Homefront Project (August 14, 2018). “A Black Family Confronts a 70-Year-Old Killing and a White Man’s Exoneration,” The Washington Post (August 11, 2018). “Mobile Street Name to Honor Jim Crow-Era Murder Victim,” Miami Herald (July 24, 2018). “Northeastern Program Uncovers the Stories Behind the Victims Of Lynching and Other Racial Violence in the Jim Crow Era,” WGBH's Greater Boston (May 2, 2018). “Lynching Memorial Forces Us to Confront Our Racist Past — And Present,” WBUR's Cognoscenti (May 2, 2018). “Descendant Of Slave Owner: Lynching Memorial Brings To Light A 'Buried Narrative',” KERA News (April 28, 2018). “Harvey Church Honors Black Man Killed by Police in Gretna 70 Years Ago,” The Times-Picayune (April 28, 2018). “Gretna Family One Step Closer to Justice Decades After Police Killing of Black Man,'''
