["https://law.northeastern.edu/academics/programs/flexjd"]
title = "FlexJD - School of Law"
full_description = "Home / Academics / Programs / FlexJD FlexJD Academics Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources FlexJD. Part-time, online and on-campus, JD delivery. Full-time Northeastern Law experience. Northeastern Law’s full-time, on-campus trajectory to pursue a law degree doesn’t fit everyone. We get it. That’s why we are offering our part-time, online and on-campus FlexJD. As a FlexJD student, you’ll learn complicated legal concepts, solve real legal problems and develop research, analysis, writing and debate expertise. You’ll first immerse yourself in the fundamentals of the American legal system, taking required courses such as Civil Procedure, Constitutional Law and Property Law. Through the Legal Skills in Social Context course, you’ll also develop essential skills necessary for good lawyering— legal research, drafting, oral communication, and teamwork and collaboration — and have an opportunity to put those skills to use on behalf of a public interest organization. Through upper-level electives, you’ll build expertise in the areas you’re most passionate about. Along the way, you’ll be mentored and taught by exceptional faculty who publish in leading law journals and are hands-on pro bono practitioners. Sample Course Schedule* YEAR 1 Term Course Format Fall Torts LOC + Distance Fall Legal Writing Workshop Distance Fall Legal Skills in Social Context Social Justice Component Distance Spring Legal Writing Workshop Distance Spring Legal Skills in Social Context Social Justice Component LOC + Distance Spring Criminal Justice LOC + Distance Summer Property Distance Summer Contracts Distance YEAR 2 Fall Civil Procedure LOC + Distance Fall Constitutional Law LOC + Distance Spring Co-op and Field Placement Seminar Summer Professional Responsibility Distance Summer Elective Distance YEAR 3 Fall Elective LOC + Distance** Fall Elective Distance Fall Elective Distance Spring Elective Distance Spring Elective Distance Spring Elective Distance Summer Experiential Semester YEAR 4 Fall Elective Distance Fall Strategies for Bar Success LOC + Distance Spring Strategies for Bar Success: Advanced Skills LOC + Distance Spring Elective Distance Spring Elective Distance td.wpdt-cell {border-left:none!important;border-right:none!important;}.wpdt-fs-000013 { font-size: 13px !important;} .wpdt-bc-FFE7D8 { background-color: #FFE7D8 !important;} .wpdt-ff-000000 { font-family: inherit !important;} .wpdt-bc-EBF8EE { background-color: #EBF8EE !important;} .wpdt-bc-EDFAFE { background-color: #EDFAFE !important;} *Subject to change **LOC = Law on Campus FlexJD Curriculum The FlexJD requires 83 credit hours of instruction for graduation over four years. The typical student course load is eight to nine credits per term. Your required first-year courses are spread out over four terms (rather than the two terms in the full-time JD program). In your first two terms, you’ll take part in the Legal Skills in Social Context program, along with one podium course each term. You will then take two podium courses in each of the next two terms. Representative course sequence to begin the program: Apply Now Request Information LOC Info for FlexJD Students Fall (LAW 6106) Torts 4 Credits Torts This course introduces students to theories of liability and the primary doctrines limiting liability, which are studied both doctrinally and in historical and social context. The course includes a brief consideration of civil remedies for intentional harms, but mainly focuses on the problem of accidental injury to persons and property. It also provides an introductory look at alternative systems for controlling risk and allocating the cost of accidents in advanced industrial societies. (LAW 6165) LSSC: Legal Research and Writing Component 2 Credits LSSC: Legal Research and Writing Component Competent and effective legal research and writing skills are the foundation for students’ success in law school and in their legal careers. In LSSC’s Legal Analysis, Research and Writing component, students learn about the organization of the American legal system, the sources and construction of laws, and how the application of laws may vary with the specific factual situation. Students learn how to research the law to find applicable legal rules, how to analyze and apply those rules to a factual situation, and how to communicate their legal analysis clearly and concisely to different audiences. May be repeated once. (LAW 6160) Legal Skills in Social Context 2 Credits Legal Skills in Social Context The LSSC Social Justice component immediately applies students’ legal research and writing skills in using law as a tool for social change. LSSC links students’ pre-law school thinking with the new legal culture in which they find themselves. In the first semester, they begin by forging their own team lawyering dynamic in discussing assigned readings and in preparing, and presenting, several advocacy exercises and written assignments. In the second semester, students apply and consolidate their new legal research and writing skills in addressing an intensive real-life social justice project for a selected client organization. LSSC student teams develop their legal and cooperative problem-solving skills and knowledge while producing real client work of a quality that far exceeds the ordinary expectations of first-year law students. May be repeated once. Spring (LAW 7516) Legal Writing Workshop 3 Credits Legal Writing Workshop Focuses on strengthening and expanding writing and analytical skills through assignments and exercises that involve objective, advisory, and/or persuasive writing. Reviews essential skills of effective legal writing while simultaneously exposing students to the myriad documents that lawyers draft in practice. Asks students to draft an array of legal documents, which may include office memoranda, client letters, demand letters, jury instructions, pleadings, and/or trial or appellate briefs. Writing completed for this course that satisfies the upper-level writing requirement may be used to fulfill that requirement. (LAW 6160) Legal Skills in Social Context 2 Credits Legal Skills in Social Context The LSSC Social Justice component immediately applies students’ legal research and writing skills in using law as a tool for social change. LSSC links students’ pre-law school thinking with the new legal culture in which they find themselves. In the first semester, they begin by forging their own team lawyering dynamic in discussing assigned readings and in preparing, and presenting, several advocacy exercises and written assignments. In the second semester, students apply and consolidate their new legal research and writing skills in addressing an intensive real-life social justice project for a selected client organization. LSSC student teams develop their legal and cooperative problem-solving skills and knowledge while producing real client work of a quality that far exceeds the ordinary expectations of first-year law students. May be repeated once. (LAW 6103) Criminal Justice 4 Credits Criminal Justice In this course, students are introduced to the fundamental principles that guide the development, interpretation and analysis of the law of crimes. They are also exposed to the statutory texts—primarily the Model Penal Code, but also state statutes. In addition, students are introduced to the rules and principles used to apportion blame and responsibility in the criminal justice system. Finally, students examine the limits and potential of law as an instrument of social control. Summer (LAW 6105) Property 4 Credits Property This course covers the major doctrines in American property law, including trespass, servitudes, estates in land and future interests, landlord-tenant relationships, nuisance, and takings. Students are introduced to rules, policies, and current controversies. (LAW 6102) Contracts 5 Credits Contracts This course examines the legal concepts governing consensual and promissory relationships, with emphasis on the historical development and institutional implementation of contract theory, its relationship and continuing adaptation to the needs and practice of commerce, and its serviceability in a variety of non-commercial contexts. Topics covered include contract formation, the doctrine of consideration, remedies for breach of contracts, modification of contract rights resulting from such factors as fraud, mistake and unforeseen circumstances, and the modern adaptation of contract law to consumer problems. This course also introduces students to the analysis of a complex statute: the Uniform Commercial Code. Fall (LAW 6100) Civil Procedure 5 Credits Civil Procedure Introduces students to the procedural rules that courts in the United States use to handle noncriminal disputes. Designed to provide a working knowledge of the Federal Rules of Civil Procedure and typical state rules, along with an introduction to federalism, statutory analysis, advocacy, and methods of dispute resolution. Examines procedure within its historical context. (LAW 6101) Constitutional Law 4 Credits Constitutional Law Studies the techniques of constitutional interpretation and some of the principal themes of constitutional law: federalism, separation of powers, public vs. private spheres, equality theory and rights analysis. The first part of the course is about the powers of government. The second part is an in-depth analysis of the 14th Amendment. Attribute(s): NUpath Societies/Institutions For the remaining upper-level required credits, the curriculum maximizes flexibility for part-time FlexJD students. Additionally, you are able to take any currently offered courses available to full-time students. Co-op Requirements One semester-long co-op, which will be a field placement with concurrent enrollment in a reflections seminar that total 8 credits One additional semester-long practical experience, which could be a co-op, field placement, or approved experiential project. Each practical experience must be for a minimum of 275 hours of work during the non-academic semester. An additional 1,000 hours of relevant work experience. For more information about curricular, co-op and other requirements for the School of Law’s FlexJD program, visit the Northeastern University Academic Catalog. Contact Us If you have any questions about the FlexJD, please schedule an appointment with an enrollment specialist. Phone: 617.203.7228 Email: FlexJD@northeastern.edu Pathways to Success All Pathways Jay Wang ’08 Senior Legal Counsel, Blizzard Entertainment, Taipei City, Taiwan Read My Story Caroline Kelley ’17"
