["https://law.northeastern.edu/event/mood-machine"]
title = "Mood Machine: The Rise of Spotify and the Costs of the Perfect Playlist - School of Law"
description = "CLIC welcomes writer and author Liz Pelly to discuss her recently released book, Mood Machine: The Rise of Spotify and the Costs of the Perfect Playlist."
full_description = "Northeastern School of Law’s Center for Law, Information, and Creativity (CLIC) welcomes writer and author Liz Pelly to discuss her recently released book, Mood Machine: The Rise of Spotify and the Costs of the Perfect Playlist. Speaker: LIZ PELLY Writer and Author In Mood Machine, Pelly explores the origins of the music streaming service Spotify and its seismic impact on the music industry. Through interviews with former Spotify employees and musicians, Mood Machine tackles what has changed since music has become increasingly playlisted, personalized,and autoplayed, and addresses the gross inequities at the heart of the modern record business. Pelly also highlights the artist-led fight for better models, pointing toward what must be done collectively to revalue music and create sustainable systems. From a legal perspective, Mood Machine highlights challenges presented by platform economies, the lack of legislation addressing 21st century payola and the role of collective organizing in the face of Big Tech. Light refreshments will be served! All are welcome, though RSVP preferred. Mar 13, 2025 4:30 pm to 6:00 pm Register Online"
