["https://law.northeastern.edu/public-interest/post-graduate-success"]
title = "Post-Graduate Success - School of Law"
full_description = "Ingrid Nava ’03 Associate General Counsel, Service Employees International Union, Washington, DC Read My Story Home / Public Interest Law / Post-Graduate Success Post-Graduate Success Public Interest Law Public Interest Law Center for Public Interest Advocacy and Collaboration Clinics and Centers Curriculum and Co-op Post-Graduate Success Pro-Bono Opportunities Public Interest Law Support Student Honors Public Interest Law Center for Public Interest Advocacy and Collaboration Clinics and Centers Curriculum and Co-op Post-Graduate Success Pro-Bono Opportunities Public Interest Law Support Student Honors Standing Up for Those in Need As a law school at the forefront of training lawyers who are committed to social justice, we’re proud that, on average, Northeastern law graduates work in legal services, advocacy organizations or public defender offices at rates far exceeding the national average, which hovers around 5 percent (according to the ABA). Our students are also highly successful at obtaining prestigious post-graduate fellowships, including Skadden Fellowships and Equal Justice Works Fellowships. If you’re interested in pursuing a career in public interest law, our Center for Co-op and Career Development offers a range of programs and services to help you get started. These include: Career counseling Informational programs and workshops Job fairs Job listings Post-graduate success can certainly be yours, but who else will share in your success? Whether you fight for individuals, families or entire communities, your Northeastern Law degree gives you the ability to make a difference anywhere in the world. How you use your degree is up to you. Among our many graduates who are national leaders in public interest law: Maggie Hassan ’85, US Senator, New Hampshire; Former Governor, New Hampshire Maura Healey ’98, Governor, Commonwealth of Massachusetts; Former Attorney General, Commonwealth of Massachusett Brigitte Amiri ’99, Deputy Director, Reproductive Freedom Project, ACLU Mary Bonauto ’87, Civil Rights Project Director, Gay & Lesbian Advocates & Defenders; 2014 MacArthur “Genius” Chase Strangio ’10, Staff Attorney, American Civil Liberties Union (ACLU) LGBT and HIV Project Marie-Therese Connolly ’84, Founder, Elder Justice Lab; 2011 MacArthur “Genius” Richard Burnes ’80, Chair, The American LGTBTQ+ Museum; Former Executive Director, Lesbian, Gay, Bisexual & Transgender Community Center (New York) Janet Bond Arteron ’77, US District Court Judge for the District of Connecticut (retired) Kevin Cathcart ’82, Executive Director, Lambda Legal (retired) William “Mo” Cowan ’94, US Senator (retired); Chief Legal and External Affairs Officer, Devoted Health Margot Botsford ’73, Associate Justice, Supreme Judicial Court of Massachusetts (retired) Richard Griffin ’81, Former General Counsel, National Labor Relations Board Dana Fabe ’76, Chief Justice, Supreme Court of Alaska (retired) Victoria Roberts ’76, US District Court Judge for the Eastern District of Michigan (retired) Urvashi Vaid ’83, LGBT Civil Rights Leader; Director, Engaging Tradition Project at the Center for Gender and Sexuality Law at Columbia Law School (deceased) Pathways to Success All Pathways Ingrid Nava ’03 Associate General Counsel, Service Employees International Union, Washington, DC Read My Story Mary Bonauto ’87"
