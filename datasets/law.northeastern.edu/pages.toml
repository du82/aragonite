title = "Accreditation - School of Law"
full_description = "Home / About / Accreditation Accreditation About About Dean’s Welcome History and Mission Accreditation Quick Facts Belonging Consumer Information Organizational Chart Equal Opportunity Policy Senior Leadership Staff Directory About Dean’s Welcome History and Mission Accreditation Quick Facts Belonging Consumer Information Organizational Chart Equal Opportunity Policy Senior Leadership Staff Directory Accreditation Northeastern University School of Law was accredited by the American Bar Association in 1969 and admitted to membership in the Association of American Law Schools in 1970. Since reopening in 1968, we have received wide recognition, both for the success of our innovative program and the leadership of our graduates. For more information, please contact: Council of the Section of Legal Education and Admissions to the Bar American Bar Association 321 North Clark Street Chicago, IL 60654 Phone: 312.988-6738 Northeastern University does not condone discrimination on the basis of race, color, religion, religious creed, genetics, sex, gender identity, sexual orientation, age, national origin, ancestry, veteran or disability status. Moreover, the university will not ignore any form of discrimination or harassment, including sexual harassment of any member of the Northeastern community. Nor will Northeastern condone any form of retaliatory activity against any person who brings a complaint of discrimination or harassment, or who cooperates in a complaint investigation. To obtain a handbook containing the university’s nondiscrimination policies and its grievance procedures, or to make inquiries, please contact: Office of Institutional Diversity and Equity Northeastern University 360 Huntington Avenue, 125 Richards Hall Boston, MA 02115 Phone: 617.373.2133 TTY: 617.373.5814 Fax: 617.373.4146"
