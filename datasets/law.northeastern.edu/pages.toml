title = "Learning Outcomes - School of Law"
full_description = "Home / Academics / Learning Outcomes Learning Outcomes Academics Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Learning Outcomes In accordance with American Bar Association guidelines, Northeastern Law has established learning outcomes for its JD program. JD Learning Outcomes Know and Understand the Law: What Lawyers Comprehend Analyze, Reason and Solve Problems: How Lawyers Think Apply the Means and Modes of Effective Communication: How Lawyers Communicate Demonstrate Awareness of and Recognize the Roles and Ethical, Professional and Business Norms of Law: What Lawyers Do Demonstrate Team Lawyering Skills, Manage Conflict, and Forge Relationships: How Lawyers Work Together Understand Law in Social Context: How Lawyers Situate Their Work to Mitigate Systems of Historical Injustice Demonstrate Aptitude for Factual and Legal Investigation and Research: How Lawyers Gather and Organize Information Incorporate Interdisciplinary and International Thinking into Legal Analysis: How Lawyers Utilize Other Disciplines and Global Perspectives Other Learning Outcomes LLM Know and Understand the Law: What Lawyers Comprehend Analyze, Reason and Solve Problems: How Lawyers Think Apply the Means and Modes of Effective Communication: How Lawyers Communicate Demonstrate Awareness of and Recognize the Roles and Ethical, Professional and Business Norms of Law: What Lawyers Do Demonstrate Team Lawyering Skills, Manage Conflict, and Forge Relationships: How Lawyers Work Together Understand Law in its Social Context: How Lawyers Situate Theair Work Demonstrate Aptitude for Factual and Legal Investigation and Research: How Lawyers Gather and Organize Information Incorporate Interdisciplinary and International Thinking into Legal Analysis: How Lawyers Utilize Other Disciplines and Global Perspectives MLS Gain an understanding of the American legal system (local, state, federal), legal reasoning and the vocabulary of the law. Learn how to conduct legal research and analyze and distinguish between various legal sources, including case law, statutes, and regulations. Develop the skills to determine when it is appropriate to turn to legal counsel, and how to communicate with counsel verbally and in writing. Understand how laws and regulations affect your workplace and how your workplace can respond strategically to the regulatory environment and any legal challenges. JD x Graduate Certificates Graduate Certificate in Health Law and Policy Students will demonstrate an understanding of laws and policies related to health and health care. Students will demonstrate an understanding of how health law and policy are shaped by the perspectives offered by one or more other academic disciplines. Students will demonstrate the ability to compose a substantial written work in the area of health law and policy. Students will demonstrate the ability to apply their knowledge of laws and policies related to health and health care in experiential settings, such as a co-op placement. Graduate Certificate in Legal Design Students will demonstrate an understanding of design methods as applied to legal and social problem-solving. Students will demonstrate an understanding of how legal design is shaped by the perspectives offered by one or more academic disciplines. Students will demonstrate the ability to either compose a substantial written work in the area of legal design, or significantly advance a legal design project through their contributions. Students will demonstrate the ability to apply their legal design knowledge and skills in experiential settings, such as a co-op placement. Graduate Certificate in Poverty Law and Economic Justice Students will demonstrate an understanding of laws and policies related to poverty and economic justice. Students will demonstrate an understanding of how policy related to poverty and economic justice is shaped by the perspectives offered by one or more other academic disciplines. Students will demonstrate the ability to compose a substantial written work in the area of poverty law and economic justice. Students will demonstrate the ability to apply their knowledge of laws and policies related to poverty and economic justice in experiential settings, such as a co-op placement. Graduate Certificate in Privacy Law Students will demonstrate an understanding of laws and policies related to information privacy and data protection. Students will demonstrate an understanding of how information privacy and data protection law and policy are shaped by the perspectives offered by one or more other academic disciplines. Students will demonstrate the ability to compose a substantial written work in the area of information privacy and data protection. Students will demonstrate the ability to apply their knowledge of laws and policies related to information privacy and data protection in experiential settings, such as a co-op placement. Graduate Certificate in Human Rights Students will demonstrate an understanding of human rights law norms and processes. Students will demonstrate an understanding of how one or more other academic disciplines utilize human rights law and contribute to its development. Students will demonstrate the ability to compose a substantial written work in the area of human rights law or international comparative law. Students will demonstrate the ability to apply their knowledge of laws and policies related to human rights law and international comparative law in experiential settings, such as a co-op placement. Graduate Certificate in Women, Gender, Sexuality and the Law Students will demonstrate an understanding of laws and policies related to sexuality, gender, and the law. Students will demonstrate an understanding of how policy relating to sexuality, gender, and the law is shaped by the perspectives offered by one or more other academic disciplines. Students will demonstrate the ability to compose a substantial written work in the area of sexuality, gender, and the law. Students will demonstrate the ability to apply their knowledge of laws and policies related to sexuality and gender in experiential settings, such as a co-op placement. Apply Now Dual Degrees JD x Certificates"
