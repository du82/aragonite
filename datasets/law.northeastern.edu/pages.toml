["https://law.northeastern.edu/academics/programs/jd/dual-degrees/business-administration"]
title = "Business Administration - School of Law"
full_description = "Home / Academics / Programs / JD / Dual Degrees / Business Administration Business Administration Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources JD/MBA In partnership with the D’Amore-McKim School of Business (DMSB), the JD/MBA dual-degree program is a powerful combination that positions candidates to operate with equal facility in the increasingly interdependent legal and business spheres. This program offers an accelerated four-year program in which students concurrently earn an MBA through DMSB and a JD through the School of Law. This dual-degree program takes advantage of Northeastern’s unique and dynamic co-op program, which provides students with opportunities for real-world, experiential learning at the intersection of law and business. JD/MBA candidates must complete the first and last years of the program in the School of Law. The year of business courses in the D’Amore-McKim School of Business may be taken during either the second or third year. Possible Patterns of Attendance Semester JD‐MBA After 1L JD‐MBA After 1L JD‐MBA After 2L JD‐MBA After 2L 1L Fall Classes Classes Classes Classes 1L Spring Classes Classes Classes Classes Summer JD Classes JD Co‐op JD Classes JD Co‐op Fall MBA MBA JD Co‐op JD Classes Spring MBA MBA JD Classes JD Co‐op Summer MBA MBA JD Co‐op JD Classes Fall JD Co‐op JD Classes MBA MBA Spring JD Classes JD Co‐op MBA MBA Summer JD Co‐op JD Classes MBA MBA Fall JD Classes JD Co‐op JD Co‐op JD Co‐op Spring JD Co‐op JD Classes JD Classes JD Classes Examples of JD Courses in the Program Antitrust Business Bankruptcy Corporate Finance Corporations Employment Law — Compensation, Benefits and Retirement Employment Law — Job Security and Rights Environmental Law Intellectual Property Law Patent Law Securities Regulation Examples of MBA Core Courses in the Program Financial Management Managing the Organizationt Social Impact of Business Strategic Planning for the Future Examples of MBA Elective Courses in the Program International Financial Management Management of Small Business Enterprises Managing Professional and Teams Mergers and Acquisitions Negotiations Social Entrepreneurship The Chief Executive Officer Examples of JD/MBA Co-ops Bank of America EMC Corporation Federal Communications Commission Federal Reserve Bank of Boston Fidelity Investments GBH Goodwin Procter Greenberg Traurig Mass General Brigham National Association of Broadcasters Nixon Peabody, Boson Ocean Spray Cranberries One Laptop Per Child Raytheon Company Seyfarth Shaw WilmerHale Admission Candidates for the JD/MBA program must independently apply and gain admission to the School of Law and the D’Amore-McKim School of Business. Admission to one school does not ensure admission to the other. Candidates may apply to both schools prior to matriculation at the law school, or students may wait until they are enrolled in the School of Law before seeking admission to the D’Amore-McKim School of Business. During either the first or second year of law school, students may apply to the MBA program for enrollment the following September. For enrolled law students applying to the MBA program, the GMAT and GRE are not required of those students who supply LSAT score in the 75th percentile or higher. A student not yet enrolled in the JD program, may apply to the MBA program for enrollment following admission to both programs and completion of the first year of law school. Students enrolled in law school who are interested in pursuing this dual degree should contact the Office of Academic and Student Affairs, during the fall of their first or second year for further information. MBA Admissions and Application Requirements Further details on the MBA portion of the JD/MBA program may be obtained by contacting: Dena Snyder Associate Director of Graduate Recruitment and Admissions D’Amore-McKim School of Business 360 Huntington Avenue, 350 Dodge Hall Boston, Massachusetts 02115-5000 Phone: 617.373.8877 Email: de.snyder@northeastern.edu JD Admissions and Application Requirements The LSAT requirement for the JD program is waived for applicants who have taken the GMAT or GRE and scored in the 85th percentile or higher, who also have a 3.5 cumulative GPA or higher. Applicants submitting GMAT or GRE scores should submit all test results from the last five years. Further details on the JD portion of the JD/MBA program may be obtained by contacting: Office of Admissions, Northeastern University School of Law 101 Knowles, 416 Huntington Avenue Boston, MA 02115 Email: lawadmissions@northeastern.edu Apply Now Areas of Study JD x Certificates"
