["https://law.northeastern.edu/admissions/flexjd/tuition-and-budgeting"]
title = "Tuition and Budgeting - School of Law"
full_description = '''Home / Admissions / FlexJD / Tuition and Budgeting Tuition and Budgeting Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Tuition and Budgeting Today, most law students require financial assistance to cover the cost of attending law school; our job is to make that process as smooth possible for you. In this section of our website, we offer some tools to assist you in determining the cost of the FlexJD program at Northeastern University School of Law and resources for planning and budgeting for your legal education. We are here to help you through this process, so please contact Financial Aid if you would like to talk about the options available to you. Apply Request Information Preparing for Law School Examine Your Spending Habits As mentioned in the Student Expense Budgets section, the allowances for living expenses are quite moderate. This generally mandates that students examine their spending habits and resolve to eliminate consumer debt items (credit cards, car expenses, etc.) so that they may live within the budget. Review Your Credit Record Many students will look towards supplemental loan programs to assist in meeting their educational costs. These loan programs are based upon the credit worthiness of the borrower — and generally, that is the student. As such, it is important that applicants' credit histories are clean. Here are some steps you can take to improve your credit record: Make payments on time, and make at least the minimum monthly payments. Limit the number of credit accounts you have, your total available credit, and how much of the available credit you use. Request a copy of your credit report once a year. This way, you can clear up any errors that may appear on your report. Applicants who are unsure of their history should contact one of the national credit bureaus to obtain a copy of their credit report. The three main credit bureaus include: Experian, Equifax and Trans-Union. If you have had credit difficulties, remember that it takes time to rebuild good credit. You must demonstrate responsible credit behavior. Student Expense Budgets As most students utilize loans to assist them in meeting the cost of education, it is important that all students try to manage their costs to the best of their ability to minimize the amount that may have to be borrowed. FlexJD Estimated Student Expense Budget 2024-2025 Tuition $47,112 Living Expenses/Transportation $24,000 Books and Supplies $2,250 Student Activity Fee $51 Loan Origination Fees $198 Annual tuition will be evenly distributed over three semesters (fall, spring and summer) for FlexJD students. Items Not Covered Federal regulations mandate that the student expense budget include only education-related expenses. The Living Allowance and Transportation is set at $2,000 per month. If you think that your personal living and transportation expenses exceed $2,000, please contact the Office of Financial Aid. Students living at home with their parents receive a monthly budget of $685 for personal living and transportation expenses. There are many items that students incorrectly assume are included in the student expense budget. Items not covered include: Consumer Debt: The budget does not allow for consumer debt such as monthly credit card payments. Automobile Expenses: The budget does not include allowances for car payments, insurance and monthly parking. Students should examine their need for an automobile while attending law school. Moving Expenses: Students moving into the Boston area from outlying areas may incur moving expenses. These cannot be built into the student expense budget. Bar Expenses: While expenses related to taking the bar exam are not allowed to be added into the student expense budget, there are lenders that do provide loans to assist in meeting these costs. BUDGET INCREASES Health Insurance Health insurance is an additional cost that will automatically appear on your fall bill. The 2024–2025 rate for the university’s health insurance has not been set. You may opt out of the university’s plan by completing a health insurance waiver on the StudentHub portal. After the waiver is successfully processed, the fee will deducted from the fall bill. Direct Costs of Obtaining a First Professional License This allowance may be provided one time per student to pay for both the Multistate Professional Responsibility Exam (MPRE) and one bar examination fees. These fees must be paid during a period of enrollment and not after, even if the exam is after the end of the period of enrollment. You must provide documentation of paid fees. This does not include fees paid for any bar preparation course. Students must bring documented receipts to the Office of Financial Aid during their enrollment period in order to obtain a budget increase. If you plan to take the bar exam in more than one state, consult the Office of Financial Aid. Computer Purchase Budgets can be increased one time during a student’s tenure for a computer purchase. Students must provide documentation of payment for the computer to the Office of Financial Aid. The maximum allowed for a computer purchase budget increase is $2,000. Childcare Expenses Budgets may be increased for certain dependent childcare/daycare expenses. Documentation of expenses must be submitted to the Office of Financial Aid. Students should contact the office directly to discuss which specific childcare expenses warrant a budget increase. Billing FlexJD Charges During your first, second and third years, the tuition for the FlexJD program will be distributed evenly across three semesters (fall, spring, and summer). In your fourth year, your yearly tuition will be distributed evenly across two semesters, fall and spring. Your $500 tuition deposit will be applied to your first tuition bill. Additionally, all students will be assessed a health insurance charge in the fall term, regardless of whether they are in class or on co-op. Bills must be satisfied by the first day of the term. Students who anticipate financial assistance to aid them in meeting their financial obligations should work with the Office of Financial Aid to ensure that late fees/financial blocks do not occur. Students who have not satisfied their bill may be refused university services. Such services may include, but are not limited to, registration, ability to take finals, access to grades and library privileges. Additionally, the university will assess late fees for unpaid balances. Health Insurance The Commonwealth of Massachusetts requires that all students have appropriate health care insurance. Thus, the university must assess a fee for this coverage. (The fee is paid to a third party.) Students may waive this coverage and avoid this charge by demonstrating comparable coverage. The fee for health insurance (unless waived) is billed in the fall term only — for the year. Students will receive instructions on how to waive the health insurance fee on their fall bill. Credits Financial aid that has been awarded to a student will appear as an anticipated credit on the student’s bill. Financial aid would include Northeastern University School of Law grants and scholarships as well as Federal Stafford and Graduate PLUS loans. Additional information on billing issues may be obtained by calling the University’s Student Accounts office at 617.373.2270. Payment Plan Northeastern University offers monthly payment plans, which are administered through Nelnet Campus Commerce. The monthly payment plan allows you to divide your educational costs into smaller, more manageable, installments. In using this plan, it can reduce your need to borrow, thereby, reducing the overall cost of education and can be combined with your financial aid award or other financing options. Because the payment plan is not a loan, you do not have to pay interest, only an enrollment fee of $35 per term. To enroll in a payment plan, or learn more, please visit northeastern.afford.com or call 855.217.0551. Refunds from Financial Aid All financial aid funds flow through the student’s tuition account at the university. Once all charges for the term have been satisfied, any excess from financial aid funds can be released and will be automatically distributed directly to the student. If you wish to receive a direct transfer to your personal bank account, make sure to complete the Direct Deposit form in your Student Hub portal. Checks are mailed to the student’s address if they have not completed a direct deposit form (see instructions below). Funds cannot be released to a student any earlier than the first day of the term. As such, it is important that each student adequately prepares to meet their living expenses through at least the first week of each term. Direct Deposit In order for your funds to be direct deposited into your bank account, you must complete the Direct Deposit Form. You can do this by logging into your Student Hub account. Under Resources, select Financial Services. You will see a link called Direct Deposit Form. Please complete and submit the form. Withdrawals and Reduced Course Loads Students contemplating a withdrawal should discuss its implications for their billing and financial aid with the director of financial aid. Students who fail to register properly for an academic period in which they were anticipated to attend OR fail to properly register with the Center for Co-op and Career Development for their co-op rotation are automatically considered to have withdrawn from the institution. Financial aid for these periods will automatically be canceled. Refunds Refunds are granted only on the basis of a formal withdrawal from the FlexJD program; non-attendance does not constitute withdrawal. Seat deposits are nonrefundable. The impact of withdrawing from the FlexJD program on other types of billing and financial aid depends upon the timing of a student’s formal withdrawal. Tuition refunds are granted in accordance with the following schedule: Tuition Refunds 2021-2022 Academic Year and Thereafter FlexJD First-Year Students* Official Withdrawal Percentage of Tuition Refunded Week 1 80% Week 2 60% Week 3 40% Week 4 20% After Week 4 0% *Students in the FlexJD program are considered first-year students for their first four terms: fall, spring, summer and fall. Tuition Refunds 2021-2022 Academic Year and Thereafter FlexJD Upper-Level Students** Official Withdrawal Percentage of Tuition Refunded Week 1-3 100% Week 4 60% Week 5 40% After Week 5 0% **Students in the FlexJD program are considered upper-level students starting with the fifth term, when upper-level curriculum begins. Financial aid will be adjusted for any withdrawal based upon the withdrawal date and the type of financial aid. School of Law Funds (merit and need-based scholarships) These funds will be adjusted at the same percentage as the tuition refunded. Federal Funds (Federal Stafford Loans and Federal Graduate Plus Loans) These funds are subject to the federal government’s Return of Title IV Funds calculation. If a student has attended through the 60% point of the term, all federal funds, for the term, have been "earned" and therefore do not need to be adjusted. If the withdrawal occurs prior to the 60% point, a calculation must be completed to determine what percent of funds have been "earned." Federal Work-Study Federal Work-Study is not subject to this calculation. However, a student cannot work past their withdrawal date. Alternative Loan Funds These funds may have to be adjusted depending upon a student's total cost of attendance for the year. Reduced Course Loads Reduced course loads require petition of, and approval by, the Office of the Dean. Students who receive approval to enroll in a reduced course load and who are receiving financial aid would have their aid eligibility reviewed. Students must be enrolled at least half time to be eligible for any federal financial assistance. School-based funds (Merit and Need-Based Scholarships) will be adjusted proportionally to the enrollment/tuition assessed. Federal funds may be adjusted to ensure that a student does not exceed his/her student expense budget. A student contemplating a reduced course load should discuss the impact on their financial aid with the Director of Financial Aid. Pathways to Success All Pathways Andrew Glincher ’84 Chairman Emeritus, Nixon Peabody, Boston Read My Story Tram Nguyen ’13'''
