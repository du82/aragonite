title = "NuLawLab - School of Law"
full_description = "Home / Academics / Centers, Institutes and Programs / NuLawLab NuLawLab Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes The NuLawLab is the interdisciplinary innovation laboratory at Northeastern University School of Law. It is a leader in the emerging global legal design movement. Its programs, projects, seminars, and research allow the law school to build cross-disciplinary teams and community-based partnerships focused on transforming legal education, the legal profession and the delivery of legal services. We do this work as one of the nation’s leading public interest law schools in order to provide our students with the knowledge and skills to be the legal inventors of the future. Follow us on Twitter"
