title = "Visiting Scholars - School of Law"
full_description = "Home / Admissions / Visiting Scholars Visiting Scholars Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Visiting Scholars Northeastern University School of Law regularly invites legal research scholars from around the globe to participate in the intellectual life of the law school. Visiting scholars enjoy access to law school and university facilities, including libraries and research databases, and avail themselves of the opportunity to attend faculty colloquia and community lectures and to audit courses. Priority will be given to scholars from institutions with which Northeastern Law has an established collaborative relationship. Once a research visit is approved, Northeastern Law will help facilitate the visa application process for those scholars needing a visa. Northeastern does not provide financial support or housing for visiting scholars. In lieu of private office space, which is generally unavailable, scholars are provided space to work in the Law Library. Scholars interested in visiting Northeastern should fill out and submit the Visiting Scholar application form and upload a CV. (Note: the proposal and statement are part of the application form; they should not be separately uploaded.) The application will be reviewed by Whitney Wotkyns, Director of LLM, Study Abroad and International Student Services. The personal statement should state when the scholar intends to visit, why the scholar is interested in Northeastern, and what the scholar intends to research during the visit. The fee for Visiting Scholars is $2,500 for up to six months and $5,000 for up to 12 months. Apply Now Pay $50 application fee Meet Our Faculty Sharon Persons Associate Teaching Professor and Director, Law Library Columbia University, BA 1992 Stanford Law School, JD 1996 Simmons College Graduate School of Library and Information Science, MLIS 2004 View Profile James Hackney Dean and Professor of Law University of Southern California, AB 1986 Yale University, JD 1989 View Profile Nicholas Horan Associate Teaching Professor and Assistant Dean, Academic Success Program Northeastern University, BA 2005 Northeastern University School of Law, JD 2009 View Profile Wendy Parmet Matthews Distinguished University Professor of Law and Faculty Director, Center for Health Policy and Law; Professor of Public Policy and Urban Affairs, Northeastern University School of Public Policy and Urban Affairs Cornell University, BA 1979 Harvard University, JD 1982 View Profile Erin Islo Assistant Professor of Law Haverford College, BA KU Leuven, MA Yale Law School, JD View Profile Kristin Madison Professor of Law and Health Sciences; Associate Dean for Academic Programs University of California, Berkeley, BA 1992 Yale University, JD 2000 Stanford University, PhD 2001 View Profile View All Faculty"
