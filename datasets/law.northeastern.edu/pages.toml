["https://law.northeastern.edu/academics/areas-of-study/labor-and-employment-law"]
title = "Labor and Employment Law - School of Law"
full_description = "Home / Academics / Areas of Study / Labor and Employment Law Labor and Employment Law Academics Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Academics Programs Areas of Study Centers, Institutes and Programs Journals Academic Resources Interdisciplinary Advantage Learning Outcomes Labor and Employment Law Northeastern is nationally recognized for training students in labor and employment law who go on to leadership roles at every level of labor and employment practice across the nation. Our graduates have served in high-level positions with the National Labor Relations Board (NLRB), including general counsel and regional director, as well as many who have served in other capacities with the NLRB, the U.S. Department of Labor and state agencies. Unions across the nation have relied upon Northeastern Law graduates, including those who have served as in-house legal counsel to the United Auto Workers and other leading unions. Northeastern Law graduates represent management, unions, government, wage-theft advocacy groups, and individual employees in disputes from local grievances up to cases before the United States Supreme Court. Northeastern Law’s extensive classroom offerings prepare you to utilize the co-op program’s unparalleled opportunities to gain hands-on experience in firms, union general counsel offices, immigrant worker centers and regulatory agencies. Although labor and employment law has always been a vibrant field at the cutting edge of social justice and economic policy issues, now is a particularly exciting time to study it as traditional forms such as industrial collective bargaining confront emerging problems of the post-industrial, “gig” world-of-work. Our program pays special attention to the impact of work organization and work law on women, people of color and other historically excluded social groups. Apply Now Interdisciplinary Adva