title = "Programs for Non-Lawyers - School of Law"
full_description = "Home / Admissions / Programs for Non-Lawyers Programs for Non-Lawyers Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Master the skills and language of the law to advance your career. The School of Law offers a variety of programs for non-lawyer professionals. Each program is committed to enhancing your understanding of the law and helping you become indispensable to your employer when it comes to navigating complex legal terrain. Master of Science in Media Advocacy The Master of Science (MS) in Media Advocacy enhances students’ abilities to lead and contribute to mission advancing efforts for a wide variety of organizations – from advocacy and lobbying organizations, trade and labor groups, and nonprofit entities, to strategic communication and government affairs departments. Created through a collaboration between the School of Journalism and School of Law, the degree uniquely combines foundations in governmental structures and the legal system with sophisticated training in the latest communication techniques. These include social media, web communications and videography, as well as data analytics and data-driven storytelling. Master of Legal Studies (MLS) Become an expert in your industry’s legal issues. Online Programs for Non-Lawyers The School of Law offers online programs to help non-lawyer professionals enhance their understanding of the law and become indispensable to their employers when it comes to navigating complex legal and regulatory terrain. Master of Legal Studies (MLS) A distinctive program for the aspiring professional eager to obtain the tools, skills and expertise to thrive and grow in your industry Graduate Certificate in Business Law To provide professionals in large and small enterprises with an ability to recognize and leverage the laws that regulate business organizations and transactions Graduate Certificate in Health Law If you work in the healthcare industry and are looking to expand your legal knowledge, but are not quite ready to pursue a master’s degree Graduate Certificate in Human Resources (HR) Law Responding to an increasing need for professionals with a solid understanding of the laws and regulations that govern employee management. Graduate Certificate in Intellectual Property Law Designed to provide professionals who work in intellectual property, technology transfer, licensing, as well as inventors and entrepreneurs, with the skills they need to recognize and protect intellectual property rights. Data Privacy Fundamentals Data Privacy Fundamentals is designed to introduce data privacy to a wide audience and help each participant see how data privacy has evolved as a compelling concern to public and private organizations as well as individuals. Meet Our Faculty Rose Zoltek-Jick Associate Teaching Professor and Associate Director, Civil Rights