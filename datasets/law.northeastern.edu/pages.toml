["https://law.northeastern.edu/pathway/julius-halstead-19"]
title = "Julius Halstead ’19 - School of Law"
full_description = "“ The co-op program exposes you to a variety of legal opportunities, and then it’s up to you to take ownership of your career. Julius Halstead ’19 Julius Halstead was one of those kids who just knew he wanted to be a lawyer. In high school, he interned with a local congressman and a county executive in his hometown of Bel Air, Maryland. During his senior year, Julius was selected to serve as a page in the Maryland General Assembly. Not surprisingly, he headed to Penn State with the idea of majoring in political science, but ended up double majoring, with the addition of philosophy. His mother, a minister, suggested philosophy so he would know how to “think a thought all the way through.” When it came time to choose a law school, Northeastern and its co-op program were at the top of his list. “Coming straight from undergrad, I was looking for the school that would give me the most exposure to different kinds of law,” says Julius. “They call it the practice of law for a reason. One of the most valuable lessons I learned on co-op is that you have to be able to take feedback and apply it constructively going forward.” Julius used his co-ops to explore his growing interests in litigation and employment law. After clerking with a federal judge, he decided to pursue a summer associate position with Goulston & Storrs, a national law firm known for its collaborative culture. “The co-op program exposes you to a variety of legal opportunities, and then it’s up to you to take ownership of your career,” says Julius. Co-op Ogletree, Deakins, Nash, Smoak & Stewart, Boston, Massachusetts For his first co-op, Julius researched legal issues such as disability laws, burden-shifting frameworks in employment discrimination claims, and wage and hour issues to support attorney efforts in client advocacy. Electives American Legal Thought Labor Law I Legislation and Regulation Whistleblower Law Co-op US Court of Appeals for the First Circuit, Boston, Massachusetts Julius drafted bench memos involving both criminal and civil cases to assist the judge in reaching well-supported legal conclusions. Activities Black Law Students Association Frederick Douglass Moot Court Competition Co-op Goulston & Storrs, Boston, Massachusetts As a summer associate at an Am Law 200 firm, Julius drafted a memo outlining obligations and provisions of the Massachusetts Paid Family Medical Leave law to help the firm guide its clients through the compliance process. Teaching Assistant Criminal Law Academic Success Program Independent Study Julius worked with the Massachusetts Black and Latino Legislative Caucus on a project that assessed the success of past bills in the areas of criminal justice and economic development with the goal of making recommendations about the viability and success of future legislation. Co-op Greater Boston Legal Services, Boston, Massachusetts Julius wanted to experience a client-focused co-op, so he chose the employment law unit of Boston’s largest legal services organization. He represented clients at unemployment insurance hearings, where he introduced evidence, examined and cross-examined the parties involved, and made closing statements. Now Associate, Goulston & Storrs, Boston, Massachusetts Result A lawyer who views litigation through a philosopher’s lens."
year_published = 2025
year_updated = 2023
