["https://law.northeastern.edu/giving"]
title = "Giving - School of Law"
full_description = "Home / Giving Giving Giving Giving Giving Your Generosity Changes Lives Your gift supports Northeastern Law students who rely on scholarships to attend law school, undertake career-building public interest law co-ops and enroll in experiential learning opportunities through our top-ranked legal clinics or Centers of Excellence. You also provide critical funds for the mission-driven work of faculty, staff and programs focused on social justice. These are just a few recent examples of what is possible with the help of philanthropic support: This fall, we welcomed 225 students to the 1L class. Collectively, they have a median GPA of 3.73 and a median LSAT of 163 — the highest academic profile in our history. In the current academic year, we are able to provide 91% of our students with financial aid. Our bar passage rate for first-time takers in Massachusetts last July was an impressive 95.7%. In summer 2024, 61 students were selected for prestigious summer associate positions in big law firms; more than 50% of those selected for these coveted positions were students of color. Salus Populi reduces public health inequalities across the U.S. by educating judges and lawyers about how the law effects the health of people and communities – this first-of-its-kind program has informed 660 members of the judiciary since 2021. This fall, we officially launched the Center for Global Law and Justice. We now have five Centers of Excellence that leverage the power of law across global human rights, public health, racial justice, public interest and IP/technology to create positive change. The Immigrant Justice Clinic is partnering with Boston Children’s Hospital to support children and adolescents on asylum applications, temporary protected status, work authorizations and motions to change venue. Our students continue to excel at obtaining prestigious fellowships. Most recently, two students in the class of 2024 were awarded Equal Justice Works Fellowships and one student was awarded a Skadden Fellowship. Every Gift Makes a Difference Below are a few of the key funds that help Northeastern Law thrive as a national leader in educating the best-prepared law students in the country. To learn more about these funds and many others, please visit our secure giving site or call Lindsey Sadonis, Director of Development and Alumni/ae Relations, at 617.373.5745. Annual Fund The Annual Fund enables the law school to advance our social justice mission and support all aspects of the student experience, such as financial aid, experiential learning, faculty recruitment and retention and much more. Givelber-Subrin Public Interest Law Co-op Fund The Givelber-Subrin Public Interest Law Co-op Fund provides crucial support to students who accept unfunded public interest co-ops. The Center for Global Law and Justice Through our commitment to promoting human rights, humanitarianism, climate justice, fair governance and democracy, this new Center of Excellence employs innovative and collaborative approaches to address the most urgent global challenges of our time. Law Clinic Fund Northeastern Law’s clinical program epitomizes the transformative power of experiential legal education, leaving an enduring legacy of social impact, advocacy and impact. Contact Us Lindsey Sadonis Director of Development and Alumni/ae Relations l.sadonis@northeastern.edu 617.373.5745 Mielle Marquis Director of Alumni/ae Engagement and Initiatives m.marquis@northeastern.edu 617.373.3819 Iyanna Williams Associate Director for Major Gifts iy.williams@northeastern.edu 617.373.2399 Julianne Griffin Administrative Assistant ju.griffin@northeastern.edu 617-373-4869 Join us in educating the lawyers of tomorrow with a gift in support of Northeastern today. Ways to Give Instructions for Credit Cards, Mailed Gifts and Wire Transfers."
