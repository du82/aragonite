nfer with the Office of Academic and Student Affairs about credit transfers. Transfer of Credits Students who are enrolled in the JD/MPH dual degree and who take certain designated Tufts University School of Medicine courses are awarded up to 12 credits towards their JD. Students who are not enrolled in the JD/MPH program may take up to 4 credits in certain designated Tufts University School of Medicine courses with the advance permission of the Assistant Dean for Academic and Student Affairs. For information about the transfer of credits, contact the Office of Academic and Student Affairs. Additional information is available on the Tufts website. Apply Now Areas of Study JD x Certificates"
