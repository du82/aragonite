["https://law.northeastern.edu/academics/programs/jd/jdx-certificates/privacy-law"]
title = "Privacy Law - School of Law"
full_description = "Home / Academics / Programs / JD / JD x Certificates / Privacy Law Privacy Law Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources JD x Graduate Certificate in Privacy Law As a lawyer, you need to understand the needs and goals of your clients and the context for the legal work you are doing. To provide you with the big picture in a specific area of expertise, Northeastern University School of Law offers a range of certificates that are interdisciplinary, bringing together the unique strengths of our law school and global university, and our leadership in experience-based education. With a JD x Graduate Certificate in Privacy Law, you’ll multiply the options open to you as a lawyer and develop real expertise. Information privacy law is a rapidly growing legal field. And yet, to date, approximately only a quarter of US law schools have classes devoted to privacy or information security. The demand for information privacy lawyers is growing exponentially, with privacy offices in nearly every large company and every governmental agency. The number of privacy and information security laws grows yearly, with states and the federal government independently enacting multiple and overlapping statutes to protect and manage the diverse forms of data required to conduct business, serve communities, and live in our digital world today. The interdisciplinary Graduate Certificate in Privacy Law encompasses a wide range of courses in data management and privacy, information ethics, internet law, marketing, consumer behavior and more. Through courses, co-ops, clinics and writing a substantial paper, your studies will be grounded in the context of law and gain laser-focused knowledge, industry-informed observations and unique insights, both from your law professors and from faculty and colleagues across our global university. If you want to deepen your knowledge and develop their expertise in the field of privacy law the Graduate Certificate in Privacy Law will position you for launching a career on this exciting new frontier. Sample Courses Artificial Intelligence Ethics Cyberlaw: Privacy, Ethics and Digital Rights Consumer Behavior Data Management in Healthcare Data Privacy Compliance in the 21st Century Information Privacy Law Information Security Law Internet Law Perspective on Journalism Ethics Science, Technology and Public Policy Related Clinics Intellectual Property Law Clinic Sample Co-ops ACLU of Massachusetts, Boston, Massachusetts ACLU, Technology and Liberties Project, Washington, DC Alexion Pharmaceuticals, Inc., Boston, Massachusetts Alnylam Pharmaceuticals, Cambridge, Massachusetts edX Inc., Cambridge, Massachusetts Electronic Frontier Foundation, San Francisco, California Electronic Privacy Information Center (EPIC), Washington, DC Federal Trade Commission, Division of Privacy and Identity Protection, Washington, DC Federal Trade Commission, Western Region, San Francisco, California Future of Privacy Forum, Washington, DC IBM, Cambridge, Massachusetts International Association of Privacy Professionals (IAPP), Portsmouth, New Hampshire National Employment Lawyers Association (NELA). Washington, DC National Employment Lawyers Association, Employee Rights Advocacy Institute for Law and Policy, Oakland, California New York University, Langone Health, Office of General Counsel (New York, NY) OneTrust, Sandy Springs, Georgia Plum Voice, Boston, Massachusettws Prince, Lobel, Tye, Data Privacy and Security Practice, Boston, Massachusetts Progress Software Corporation, Bedford, Massachusetts Traackr, Inc., Boston, Massachusetts Vertex Pharmaceuticals, Privacy Department, Boston, Massachusetts Wellframe, Boston, Massachusetts >> Requirements Additional Privacy Law Opportunities The Center for Law, Information and Creativity (CLIC) combines the study of innovation and creativity with Northeastern University School of Law’s social justice mission. CLIC is a unique environment attracting diverse scholars, lawyers, students, creators, innovators, start-up ventures and established companies to study the regulation of intellectual property and technology with the aim of promoting progress. The Intellectual Property Society is comprised of students interested in intellectual property law and its role in our society. In addition to holding meetings several times a year, the society invites speakers to discuss cutting-edge intellectual property issues and careers in intellectual property. The Law and Information Society (LIS) largely focuses on promoting regulatory frameworks for privacy and technology. The mission of LIS is to promote an open dialogue around the impact that the information revolution has on our society, including recent advances in technology and privacy that have drastically altered our ability to communicate, convey and consume information and shape our discussions surrounding privacy and technology laws. Additional Privacy Law Certificate Northeastern law students may become Certified Information Practice Professionals (CIPP) through the International Association of Privacy Professional’s (IAPP) Privacy Pathways program. Concentrations and course offerings may vary by campus and/or by program modality. Please consult with your advisor or admissions coach for the course availability each term at your campus or within your program modality. Certain options within the program may be required at certain campuses or for certain program modalities. Please consult with your advisor or admissions coach for requirements at your campus or for your program modality."
