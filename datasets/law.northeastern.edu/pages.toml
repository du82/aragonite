title = "Academics - School of Law"
description = "At Northeastern Law, our rigorous curriculum is infused with opportunities for you to collaborate and cooperate with faculty and fellow students as you unpack the complexities of legal theory and explore law and justice in action."
full_description = "Home / Academics Academics When it comes to integrating compelling courses with practical legal training, Northeastern Law is the unparalleled leader. Explore Programs Home / Academics Academics When it comes to integrating compelling courses with practical legal training, Northeastern Law is the unparalleled leader. Explore Programs Collaborate. Cooperate. Contemplate. At Northeastern Law, our rigorous curriculum is infused with opportunities for you to collaborate and cooperate with faculty and fellow students as you unpack the complexities of legal theory and explore law and justice in action. As you contemplate the role of law in society and your own professional aspirations, you will have the opportunity to take advantage of our interdisciplinary curriculum by enrolling in cutting-edge courses taught by faculty who are the forefront of legal innovation, research and action. This is not a law school that expects you to sit quietly in the back row — we want to hear your thoughts, debate the thorny issues and collaborate on ways to use law to broaden the boundaries of what we can achieve together. JD A rigorous curriculum, exceptional professors and unmatched experiential learning opportunities fuel Northeastern’s one-of-a-kind academic enterprise. Learn More FlexJD The FlexJD allows you to complete flexible remote coursework on your own schedule combined with limited, required in-person instruction on our Boston campus. Learn More On-Campus LLM Take advantage of On-Campus LLM programs that are global, flexible and dynamic. Explore Program Online LLM An industry-informed, globally focused online program taught by Northeastern faculty and working lawyers. Learn More Programs for Non-Lawyers Master the skills and language of the law necessary to advance your career through on-campus and online programs designed for working professionals. Learn More Faculty Explore our faculty’s current research and advocacy. Patricia Williams University Distinguished Professor of Law and Humanities Wellesley College, BA 1972 Harvard University, JD 1975 View Profile Antoinette Coakley Associate Teaching Professor and Assistant Dean of the Bar Success Program Harvard-Radcliffe College, AB 1992 Harvard Law School, JD 1995 Cornell University, Diversity and Inclusion Certificate 2022 View Profile Jeremy Paul Professor of Law Princeton University, BA 1978 Harvard University, JD 1981 View Profile Catherine Lizotte Associate Teaching Professor Saint Anselm College, BA 2000 Suffolk University Law School, JD 2006 View Profile See All Faculty Stats and Facts Percentage of Northeastern law JD students who graduate with almost a year of legal experience 100% Ranking for practical training by The National Jurist/preLaw A+ Number of countries in which students have completed co-ops 55+ Centers of Excellence Find out how you can become involved with our interdisciplinary centers. Center for Global Law and Justice (CGLJ) Center for Health Policy and Law (CHPL) Center for Law, Equity and Race (CLEAR) Center for Law, Information and Creativity (CLIC)"
