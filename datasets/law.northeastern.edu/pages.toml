full_description = "Home / Academics / Areas of Study Areas of Study Academics Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources At Northeastern, we believe that experience and exploration are paramount in your journey as a law student and future lawyer. As you consider various fields of law, you may choose to home in on an area of study that resonates with your professional passions and goals. Our interdisciplinary approach includes courses, co-ops, clinics, dual degrees, certificates and a wide variety of opportunities to participate in — and partner with — our centers, institutes and programs, and with student organizations. And, our renowned faculty are always ready to talk over an idea or provide advice on courses, co-ops and more. If our list of areas of study isn’t your list, just let us know and we will help you tailor a program of study and experience that will provide a meaningful and exciting path for you through law school and on to a fulfilling career. Apply Now Interdisciplinary Advantage JD x Certificates Business Law Criminal Justice Health Policy and Law Human Rights Immigration Intellectual Property and Technology Labor and Employment Law Poverty Law and Economic Justice Privacy Race and the Law"
