title = "Interdisciplinary Advantage - School of Law"
full_description = "Home / Academics / Interdisciplinary Advantage Interdisciplinary Advantage Academics Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD FlexJD On-Campus LLM Online LLM Programs for Non-Lawyers Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Northeastern’s Interdisciplinary Advantage Throughout your legal career, you’ll be working with professionals trained in other disciplines. Whether you are representing doctors and nurses, working for a small biotech company or working in a government policy position, you need to know how to work with other professionals and understand their fields. That’s why at Northeastern we are serious about interdisciplinary education, offering cuttting-edge certificates, which each have a strong interdisciplinary perspective. That’s also why many members of our faculty have training in other disciplines, and appointments in other colleges, and why all students can take credits in the university outside of the law school. JD students may also do one of their co-ops in a non-legal setting, working as a lawyer alongside engineers, human rights advocates, environmental regulators or finance professionals. Faculty Innovators The School of Law is well known for its innovative approach to legal education. Over the past five decades, we have built the nation’s leading experiential law program. Throughout that time, our faculty have collaborated with our co-op employers as well as colleagues across all disciplinary boundaries on a wide range of interdisciplinary programs and research projects, including our Centers of Excellence and nationally recognized institutes and programs. The commitment of our faculty, many of whom have advanced degrees in multiple fields and joint appointments with other schools within the university, to interdisciplinary education helps to ensure that our students know how to speak to and successfully work with all types of professionals. JD x Certificates Lawyers need to understand the needs and goals of their clients and the context for the legal work they are doing. To provide JD students with the big picture in a specific area of expertise, Northeastern University School of Law offers a range of certificates that are interdisciplinary, bringing together the unique strengths of our law school and global university, and our leadership in experience-based education. Through courses, co-ops, clinics or writing a substantial paper, certificate programs are grounded in the context of law and layered with laser-focused knowledge, industry-informed observations and unique insights, both from law professors and from faculty and colleagues across our global university. With a JD x certificate, students multiply the options open to them as lawyers and develop real expertise in their field of choice. Check out our certificates: Health Law and Policy Human Rights Law Legal Design Poverty Law and Economic Justice Privacy Law Sustainability and Climate Change Women, Gender, Sexuality and the Law Dual-Degree Programs The School of Law’s dual-degree programs offer JD students a dynamic opportunity to focus on interdisciplinary study. Our partnerships with Tufts University School of Medicine and Vermont Law School provide students with access to three outstanding, specialized programs — all leaders in their respective fields. And, our dual-degree programs within Northeastern University allow students to take advantage of the world-class resources here on our own campus. Check out our dual-degree programs: Business Administration Criminal Justice Professional Accounting Public Health-Bouvé College of Health Sciences Public Health-Tufts University School of Medicine Public Policy Apply Now Areas of Study JD x Certificates Pathways to Success All Pathways Staci Rubin JD/MPH/MELP ’10 Commissioner, Commonwealth Utilities Commission, Boston Read My Story Christine Wahr JD/MPH ’13"
