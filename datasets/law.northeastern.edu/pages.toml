["https://law.northeastern.edu/admissions/flexjd-law-on-campus"]
title = "FlexJD - Law on Campus - School of Law"
full_description = 'Home / Admissions / FlexJD – Law on Campus FlexJD - Law On Campus On-campus intensives are designed to advance your legal education. Request Information Apply Now Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us During the required Law On Campus intensives, you’ll meet your classmates and faculty in person and build upon the foundation you’ve created online. Beginning with orientation and continuing through graduation, the required Law On Campus sessions will provide unparalleled opportunities to develop a strong sense of community and shared goals while advancing your legal education. Law On Campus Overview Over the course of the four-year FlexJD program, you are required to complete six Law On Campus (LOC) sessions bound to the curriculum, each approximately four days long and scheduled around weekends. Three of these in