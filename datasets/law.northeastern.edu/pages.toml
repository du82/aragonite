["https://law.northeastern.edu/academics/programs/jd/dual-degrees/public-health-tufts"]
title = "Public Health - Tufts - School of Law"
full_description = "Home / Academics / Programs / JD / Dual Degrees / Public Health - Tufts Public Health - Tufts Academics Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources Academics Areas of Study Programs JD First-Year Curriculum Upper-Level Curriculum JD x Certificates Dual Degrees Degree Requirements Interdisciplinary Advantage Learning Outcomes Centers, Institutes and Programs Journals Academic Resources JD/MPH with Tufts University School of Medicine Both the School of Law and Tufts University School of Medicine have long traditions of emphasizing the relationship between public policy and public health, offering students exposure to faculty members who have extensive experience. Our two schools’ shared global perspective and commitment to active citizenship and interdisciplinary scholarship translate into a rich intellectual milieu in which to engage in critical thinking and focus on complex, population-based approaches to health. Students in the JD/MPH dual-degree track must satisfy the law school's co-op requirement and must complete at least one co-op related to public health. Possible Patterns of Attendance Semester JD‐MPH Tufts After 1L JD‐ MPH Tufts After 2L D‐ MPH Tufts After 2L 1L Fall Classes Classes Classes 1L Spring Classes Classes Classes Summer JD Co-op JD Co‐op JD Classes Fall Tufts JD Classes JD Co‐op Spring Tufts JD Co-op JD Classes Summer JD Classes + ALE JD Classes JD Co‐op Fall JD Co‐op Tufts Tufts Spring JD Classes Tufts Tufts Summer JD Co‐op JD Classes + ALE JD Classes + ALE Fall JD Classes JD Co‐op JD Co‐op Examples of Northeastern Courses in the Program Administrative Law Bioethics and Law Bioproperty Current Issues in Health Law and Policy Disability Law Domestic Violence Clinic * Drug Law and Policy Elder Law Environmental Law Global AIDS Policy Seminar Health Law International Human Rights and the Global Economy Juvenile Courts: Delinquency, Abuse and Neglect Law and Economic Development Negotiation Nonprofit Organizations Poverty Law & Practice Clinic* Private Litigation in the Public Interest Problems in Public Health Law Natural Resources Law Public Health Advocacy Clinic Refugee and Asylum Law Reproductive and Sexual Rights and Health Social Welfare Law Health Care Fraud and Abuse State and Local Government Tufts Applied Learning Experience Examples of Tufts Courses in the Program Corporate Management of Environmental Issues Determinants of Food Policy Health, Ethics and Policy and Food and Nutrition Policy: Institutions, Analysis and Action Global Food and Nutrition Policy Global Nutrition Programs Intro to Global Health and Development Health Care Organization: Budgeting & Management Humanitarian Aid in Complex Emergencies International Environmental Policy International Nutrition Programs Management, Planning, and Control of Nutrition and Health Programs and Organizations Health Claims and the Food Industry Public Health Economics Advanced Public Health Economics Public Health Assessment: Data, Determinants and Systems Public Health Action: Programs, Policy and Advocacy Public Health and Health Care: Politics, Policies and Programs Race, Culture and Ethnicity Seminar in Government and Family Social Policy for Children and Families Fundamentals of Public Policy Climate Change Policy and Planning? Community Development, Planning and Politics? Negotiation and Conflict Resolution? ** only available to students matriculating for their JD Examples of Co-ops in Public Health Breakstone, White, Leif, Boston Cambridge and Somerville Legal Services Elder Law, Cambridge Centre for Policy Alternatives, Colombo, Sri Lanka Cetrulo & Capone, Boston Cheyenne River Sioux Tribe, Indian Child Welfare Program, Eagle Butte, S.D. Cheyenne River Sioux Tribe, Legal Department, Eagle Butte, S.D. Citizens For Juvenile Justice