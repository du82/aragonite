title = "FlexJD Student Testimonials - School of Law"
full_description = "Home / Admissions / FlexJD Student Testimonials FlexJD Student Testimonials Admissions Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Admissions JD Admissions Policy Admitted Students Application Process Visits and Events Tuition and Budgeting Financial Aid Financial Counseling FAQS Student Ambassadors FlexJD Admitted Students Application Process Tuition and Budgeting Financial Aid Financial Counseling FAQs Law On Campus Student Ambassadors Student Testimonials On-Campus LLM Admitted Students Application Process LLM Visits and Events FAQs Online LLM Programs for Non-Lawyers Master of Legal Studies Master of Science in Media Advocacy Graduate Certificate Programs Data Privacy Fundamentals Visiting Scholars Contact Us Student Testimonials Rachel Vierra ’25 “When deciding where to apply to law school, I had to make the difficult decision of whether or not I was willing to give up my full-time job. I started looking into part-time programs that would allow me the ability to both work and pursue a legal education. I came across Northeastern’s FlexJD program and was immediately drawn to its flexibility. Ultimately, I ended up choosing FlexJD for this reason—flexibility. I was further attracted to the social justice focused curriculum, co-op program, and overall sense of community Northeastern Law offered. Now that I am about halfway through my 1L year in the program, I can confidently say the FlexJD program was the right choice for me to pursue my legal education. While the courses do require time outside of class to prepare and complete assignments, the workload has been compatible with my employment. The FlexJD schedule allows for this flexibility in determining one’s schedule. I like to do my assigned reading and lecture videos on the weekend and have found this to work best with my schedule. However, other students like to spread the coursework out throughout the week. The small class size has allowed for ample opportunity to form meaningful relationships with one another and our professors. The LSSC program, unique to Northeastern Law, fostered a wonderful community among the FlexJD students. The support from this community has made the transition and “grind” of law school much more manageable. Our class, diverse in backgrounds and personalities, has become very close and these friendships have been some of the most rewarding parts of law school. Further, this small class size allowed for more intentional relationships with professors. I have been able to get to know all the instructors personally and have benefitted immensely from their knowledge and passion for their respective subjects.” Read more Jalon Fowler ’25 “My professor really went above and beyond to make us feel comfortable, to provide supplementary information and to make us feel welcome. The class was tough, but we felt like she was pushing us in a positive way and, as a result, we really grasped the content. On co-op, while I’m writing, I think about the corrections and feedback that she provided to me, and it makes a difference in the work I produce. With the assistance of my co-op advisor, I found a co-op with a judge in Cambridge juvenile court. For this co-op, I negotiated the hours I would be in-person and the number of hours I would work from home. So, when I’m in person at court, I observe procedures, trials and hearings. When I’m at home, I’m working on legal writing and research projects for the judge.” Ellie Fiskio ’26 “The main reason I chose Northeastern was because of co-op. While working full time in a non-legal job, I am still able to get the co-op legal experience as part of the curriculum. It’s also been great to make connections with other students in the program, who work in so many different fields. I know some people in my Legal Skills in Social Context law office are in finance, some people are paralegals, some work in land ownership offices, some work in labs that do blood testing and others are firefighters. You get to learn so much about people’s lives and how everything that you do intersects somewhere legally. You make connections with people who become not only your friends, but are also imperative to your legal education and career.” Contact Us If you have any questions about the FlexJD, please schedule an appointment with an enrollment specialist. Phone: 617.203.7228 Email: FlexJD@northeastern.edu This program is approved by the American Bar Association. Pathways to Success All Pathways Tram Nguyen ’13 State Representative, 18th Essex District, Massachusetts Read My Story Joshua Demers ’17"
