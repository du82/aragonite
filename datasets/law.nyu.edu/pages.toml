description = "Fall 2024 Tax Policy and Public Finance Colloquium Tuesdays, 4:15 p.m. - 6:15 p.m., Furman Hall 310 Professor Daniel Shaviro"
full_description = '''Fall 2024 Tax Policy and Public Finance Colloquium Tuesdays, 4:15 p.m. - 6:15 p.m., Furman Hall 310 Professor Daniel Shaviro The Colloquium offers students the opportunity to pursue tax policy and theory, along with related issues of public economics, at an advanced level. The primary focus of the Colloquium will be papers and works in progress by scholars from around the country, including NYU faculty. Students attend the afternoon Colloquium and participate in its discussions. In addition, each week the morning seminar component examines the paper scheduled for presentation at the Colloquium, including background issues that may help in understanding it. Students must prepare a short comment paper in 3 of the 13 weeks focusing on the upcoming paper, and submit to the conveners of the Colloquium a proposed question for the author in each week (after Week 1) when they are not submitting a comment paper. In addition, each student will make brief opening comments about the paper that is being discussed at two of the six private sessions. Daniel Shaviro Wayne Perry Professor of Taxation New York University School of Law 40 Washington Square South New York, NY 10012 Telephone: (212) 998-6187 Fax: (212) 995-4341 shavirod@mercury.law.nyu.edu http://danshaviro.blogspot.com/ September 10 Ellora Derenoncourt, Princeton University "Wealth of Two Nations: The US Racial Wealth Gap, 1860-2020" "Online appendix for "The racial gap, 1860-2020"" September 24 Andrew Hayashi, University of Virginia Law School "The Federal Architecture of Income Inequality" October 8 Manasi Deshpande, University of Chicago Economics Department "The (Lack of) Anticipatory Effects of the Social Safety Net on Human Capital Investment" October 22 Louis Kaplow, Harvard Law School "Optimal Income Taxation and Charitable Giving" November 12 Alex Zhang, Emory University School of Law "Fiscal Citizenship and Taxpayer Privacy" November 26 Natasha Sarin, Yale Law School "Broken Budgeting" -