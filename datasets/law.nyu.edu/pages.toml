["https://law.nyu.edu/centers/judicial"]
title = "The Institute of Judicial Administration at NYU School of Law"
description = "The IJA at NYU Law, founded in 1952, is dedicated to the continuing education of judges and to serving as a non-partisan, non-ideological forum for the study of ideas on improving the administration of practice."
full_description = '''Oral History of Distinguished American Judges The Oral History of Distinguished American Judges memorializes the contribution of the men and women who make the US judiciary a bulwark of freedom. This project goes beyond their written opinions to focus on education, careers, influences, and views of the judicial role. Each video interview has an accompanying annotated transcript. Together, these interviews form a definitive resource on the American judiciary, not just for legal scholars, but for all those interested in our system. About the Institute Founded in 1952, the Institute of Judicial Administration at New York University School of Law (IJA) is dedicated to the judiciary and continues today as a leader in judicial education and a forum for non-partisan thinking and discussion about the administration of justice. The work of the Institute has become ever more critical with the proliferation of federal and state laws, the increasing workload and public profile of the courts, process changes ushered in by the pandemic, and the growth in adjudicative bureaucracies. The Institute is operated by staff under the guidance of Faculty Director Professor Samuel Estreicher.The Board of Advisors of the Institute consists of distinguished state and federal jurists, law scholars and practitioners, and Dean Troy McKenzie who formerly served as faculty co-director of IJA. The Board is chaired by Evan R. Chesler, Cravath, Swaine & Moore LLP. To donate to the Institute of Judicial Administration, click here. Some Past Events: IJA's 29th Annual William J. Brennan, Jr. Lecture on State Courts and Social Justice featuring Hon. Melissa Hart, Colorado Supreme Court Tuesday, January 28, 2025 | The Institute of Judicial Administration hosted the 29th Annual William J. Brennan, Jr. Lecture on State Courts and Social Justice featuring Hon. Melissa Hart, Colorado Supreme Court on Our Legal Institutions Must Change. But How? If you missed it, you can read about it here or watch below. IJA Faculty Director, Samuel Estreicher, Dwight D. Opperman Professor of Law: See Professor Estreicher's remarks at the 26th Annual Federalist Society Faculty Conference Jan. 9, 2025 in San Francisco in Discussion: South Africa v. Israel Case: Allegations of Israeli Genocide in Gaza. See Professor Estreicher's article "Supreme Court to Review Second Circuit Decision Striking Down 'Deemed Consent' Law Reaching PLO and PA for Making Payments to 'Martyrs' Who Injure or Kill US Nationals", New York Law Journal, Jan. 6, 2025 Professor Estreicher joined an amici brief with IJA Board Member Daniel M. Sullivan, at the Supreme Court in Loper Bright Enterprises v. Raimondo (22-451). View Recent Publications by IJA Faculty Director Samuel Estreicher. Read our newsletter, the IJA Report. See Past Programs'''
