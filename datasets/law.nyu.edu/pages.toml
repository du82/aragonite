["https://law.nyu.edu/about/whynyulaw/community"]
title = "The NYU Law Community | NYU School of Law"
full_description = "Why NYU Law Community 1L Year Academics Learn by Doing The NYU Law Community Join a community that supports your goals, whatever they are. With dedicated faculty and administrators, 80+ student groups, and a strong alumni network, you’ll make connections that last a lifetime. Watch: Professor Alina Das '05 on why she enjoys teaching at her alma mater Faculty Who Care Our faculty are experts who drive the conversation on pressing issues of the day—and make time to mentor and collaborate with students. First-year students get to know faculty outside the classroom in small, informal reading groups. Students can also work as research and teaching assistants or connect with faculty through directed research or journals. Some students even collaborate on scholarship with faculty. For example, Professor Christopher Jon Sprigman and Samantha Hedrick ’19, a student in his Advanced Copyright class, co-wrote a recent article on how courts can better apply the copyright infringement standard. Watch: Emma Schwartz ’22 on how NYU Law faculty and staff helped her navigate the clerkship process Student Support Our dedicated administrators help you succeed academically and professionally. Academic Services and Registration will work with you to design and plan the curriculum you want. Student Affairs team offer offers guidance when you need it and helps connect you with the greater Law School community. The Office of Student Financial Services offers counseling on optimal ways to finance your education. See our Financial Support page for more about scholarships and our Loan Repayment Assistance Program (LRAP Plus). The Academic Careers Program helps interested students position themselves for a future professorship. The Office of Career Services offers personalized career advising and facilitates a wealth of firm receptions and recruiting events and the Public Interest Law Center supports those interested in public service careers. The Judicial Clerkship Office counsels students individually and guides them through the clerkship application process. A Home Away from Home The Law School has two high-rise apartment-style residence halls, D’Agostino Hall and Hayden Hall, that offer students a variety of living arrangements. Options include studio and one-bedroom apartments, or private rooms in shared two- or three-bedroom apartments. Family housing accommodations are also available, but in limited quantity. You can live on campus during the academic year or in the summer— even before starting law school. Watch: Samah Mcgona Sisay '18 on how the Women of Color Collective enhanced her NYU Law experience Student Organizations Whether it’s the Art Law Society or the Law and Business Association, it doesn’t take long to find a student group that matches your interests and experiences. Watch Sara Moss '74 on working with students in the Sara Moss Women’s Leadership Training Program Alumni Network The NYU Law alumni network, more than 45,000 strong, is an invaluable resource both during and after your law school years. The alumni ranks include leaders in private legal practice, government, nonprofits, entertainment, real estate, finance, the judiciary, sports, and social enterprise. Many of them return to NYU Law to interact with current students as adjunct professors and as lecturers and panelists at numerous events."
