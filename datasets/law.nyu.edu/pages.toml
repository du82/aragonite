title = "Center for Labor and Employment Law | NYU School of Law"
description = "The Center for Labor and Employment Law was created in 1996 to establish a nonpartisan forum for the debate and study of the policy and legal issues involving the employment relationship."
full_description = "The Center for Labor and Employment Law was created in 1996 to establish a nonpartisan forum for the debate and study of the policy and legal issues involving the employment relationship. Events June 9-10, 2025 Join the NYU Center for Labor and Employment Law’s lead conference on labor and employment law and policy. The new Republican administration has garnered more support from working Americans and some labor unions than in decades. Despite concerns in some quarters about the President’s style and willingness to discard or radically alter the existing playbook, that willingness also presents a historic opportunity for entertaining new approaches in workplace law and policy. Register here today! Webinar Thursday, February 13, 2025 Corporate and Union Political Activism Increasingly, we are seeing a rise of corporate and union political activism on foreign policy and broader social issues beyond constituent work interests. What does this mean for workers, shareholders, customers, and staff with views that do not always align with their company's or union's political stances? What are the fiduciary and legal obligations and constraints, if any? Is there a need for a change in public policy? Join a balanced dialogue across corporate law and labor law experts on the handling of these issues. Register Here Speakers: Prof. Aneil Kovvali, Prof. Edward Rock, John F. Ring, Melinda Holmes, and Rory Lancman Faculty Director Professor Samuel Estreicher in the News: Second Circuit Rebuffs Starbucks Strategy of Seeking Rank-and-File Employee Discovery in Labor Law Injunction Proceeding, June 4, 2024. Diminished NLRB 'Drowning' In Cases, Litigation, Chair Says, May 23, 2024. Organizing Principles: Prof. Samuel Estreicher and Jack Samuel '23 argue that century-old federal labor laws give gig workers the right to engage in collective action, including union campaigns, without fear of antitrust liability, May 21, 2024. Faculty Director Samuel Estreicher, Dwight D. Opperman Professor of Law at New York University leads the Center for Labor & Employment Law. See Professor Estreicher in the News The NYU Labor & Employment News Read our most recent edition."
