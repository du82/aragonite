full_description = "Watch: Students talk about what makes NYU Law special Our Community Our Community 1L Year 1L Year Academics Academics Learn by Doing Learn by Doing At NYU Law, you’ll learn to think critically and creatively—skills you need to succeed, whether you plan to practice in a firm, start your own business, or devote yourself to public service. How We Approach Legal Education Academics Without Boundaries NYU Law is at the forefront of interdisciplinary research and teaching, with special strengths in law and philosophy, economics, politics, history, and social theory. The result: Students get a deeper understanding of real-world problems. Experiential Learning Our 40+ clinics and externships give you the chance to get firsthand experience representing clients in areas as different as immigration and innovation. And with 80+ student organizations, you’ll be able to get involved in whatever interests you. Faculty Who Care You won’t see your professors only behind a lectern at NYU Law. Our faculty are leading scholars and top experts in their fields who drive the conversation on pressing issues of the day—and make time to mentor and collaborate with students. Support When You Need It Whatever your goals, NYU Law is committed to helping you reach them. Our dedicated administrators offer you guidance in just about every area, including academics, financing your education, and navigating your career path."
