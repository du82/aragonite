title = "Academics | NYU School of Law"
description = "At New York University School of Law, academics are about more than just coursework; they are about interdisciplinary intellectual dialogue, first-hand lawyering, and clinical experiences—and always, a global approach to training the leaders of tomorrow."
full_description = "Academics Degrees Offered Academic Advising Lawyering Clinics Colloquia For LLM Students Fellowships facebook linkedin twitter instagram youtube Course Catalog Course Catalog Areas of Study Areas of Study Registrar Registrar Exams Exams At New York University School of Law, academics are about more than just coursework; they are about interdisciplinary intellectual dialogue, first-hand lawyering, and clinical experiences—and always, a global approach to training the leaders of tomorrow. How to Navigate Law School Whether you're a 1L, 2L, 3L, or LLM, consult these year-by-year roadmaps to be sure that you're heading in the right direction. Areas of Study Explore our Areas of Study to get a sense of our academic specialties and the faculty that teach them—as well as the centers, colloquia, lectures and student organizations that underscore them. Antitrust, Intellectual Property & Information Cities & Land Use Constitutional, Civil Rights, & Democracy Corporate & Commercial Criminal Justice Environmental Family, Gender, & Sexuality Global & International Human Rights Immigration Labor & Employment Law and Security Legal Theory, History, & the Social Sciences Litigation & Procedure Regulation & Public Policy Taxation Graduate Programs Our Graduate Division—one of the largest and most diverse in the nation—offers nine different full-time LLM degrees. NYU Law also offers: A JSD program An Advanced Certificate in Law and Business An Advanced Professional Certificate in Taxation The Executive LLM in Taxation for lawyers (online) The MSL in Taxation for accountants and non-lawyers who have at least three years of professional experience with substantive tax issues (online) Joint MS Degree with NYU Tandon The MS in Cybersecurity Risk and Strategy offered jointly by NYU Law and NYU Tandon School of Engineering is a one-year, low-residency degree for experienced professionals seeking to deepen their understanding of cybersecurity risk and strategy. Joint MS Degree with NYU Wagner The MS in Health Law and Strategy offered jointly by NYU Law and NYU Wagner Graduate School of Public Service is a one-year, low-residency degree for experienced professionals from health-related fields looking to enhance their ability to make strategic decisions for their organizations. (Acquiescence from the American Bar Association is being sought.)"
