["https://law.nyu.edu/news/forum-state-attorneys-general-trump-policies"]
title = "In an NYU Law Forum, state AGs discuss relations with the federal government in the Trump era | NYU School of Law"
description = "On February 5, amid the Trump administration’s push to dramatically transform the federal government, an NYU Law Forum, sponsored by Latham & Watkins, convened a panel representing the attorneys general of three states to react to fast-moving developments in Washington, DC."
full_description = "On February 5, amid the Trump administration’s push to dramatically transform the federal government, an NYU Law Forum, sponsored by Latham & Watkins, convened a panel representing the attorneys general of three states to react to fast-moving developments in Washington, DC. Vanita Gupta ’01 Moderated by Vanita Gupta ’01, distinguished scholar in residence; the discussion featured panelists Phil Weiser ’94, Colorado’s attorney general; Jennifer Levy ’96, New York state’s first deputy attorney general in New York; and Matthew Platkin, New Jersey’s attorney general. The panel discussed multiple state lawsuits filed against the White House and the Department of Government Efficiency, including those opposing the Trump administration’s funding freezes and attempt to end birthright citizenship. The participants explored the legal ramifications for diminished federal enforcement of civil rights and environmental laws, and also considered issues where states and the federal government can common ground, including the opioid epidemic and the harmful impact of social media on youth mental health. Addressing NYU Law students in the audience, each panelist made a pitch for the benefits of starting a legal career at a state attorneys general’s office. “We really have a misallocation of legal talent in this country and you can have a huge impact early in your career,” said Platkin. “It is, I think, where the action is right now—regardless of who’s in Washington.” Selected remarks from the panel discussion: Phil Weiser ’94 Phil Weiser: “The states have their own sovereign authority and a federal government that is seeking to do things, like limiting transgender care or tell us how to run our diversity inclusion programs—those are going to raise profound issues. We’re going to stand our ground, we’re going to stand on principle, and we’re going to defend our states’ rights to govern—in our case, [the] people of Colorado….So there are going to be disputes. My job is to defend Colorado law. We have protections in Colorado for gender-affirming care. We also don’t want to be commandeered by the federal government. We’re going to defend Colorado law and the people of Colorado.” (video 1:10:41) Matthew Platkin Matthew Platkin: “The president in the [Office of Management and Budget executive order freezing funding for multiple federal agencies] didn’t cite to a single body of law supporting what he did. They’re not even trying to use the legal authority under the potential for a president to impound funds. So there’s a legal fight we’re going to have….Presidents have broad powers, but they are not kings. They cannot rewrite a constitution or overwrite laws. So if he wants to have debate about any of the issues….he’s entitled to put forth legislative tools or work with Congress or use his administrative tools….He hasn’t even tried to win the argument or political debate through the appropriate channels.” (video 33:09) Jennifer Levy ’96 Jennifer Levy: “[T]he cares that we’re going to end up litigating are going to be the cases that are studied in law school in ten, 20 years, because [they’re] completely unprecedented. The things that we are going to have to try to challenge in courts because there’s nowhere else. It hasn’t been done before. So it’s a great time to work in an attorney general’s office.” (video 59:27) Watch the full video of the NYU Law Forum: Posted February 27, 2025 RELATED LINKS: NYU Law Forum experts debate presidential power to hire and fire NYU Law website, 2/5/25 State of the administrative state? Time will tell, say experts at NYU Law Forum NYU Law website, 11/25/24"
year_published = 2025
clearnet = "https://law.nyu.edu/news/forum-state-attorneys-general-trump-policies"
