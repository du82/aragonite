["https://law.nyu.edu/alumni/alumniassociations"]
title = "Alumni Associations and Clubs | NYU School of Law"
full_description = "Law Alumni Association The Law Alumni Association (LAA) is an integral part of the educational, intellectual and social life at New York University School of Law. Upon graduation, all alumni automatically become members of the LAA and will receive invitations to all events sponsored by the LAA, including the LAA/LACA/Public Interest Law Center Benefit, lectures, receptions, and various recent graduate events. Law Alumni of Color Association The Law Alumni of Color Association (LACA), formerly known as the Black, Latino, Asian Pacific American Law Alumni Association, serves as the umbrella organization for all of NYU School of Law’s alumni of color. In 2016, the association changed its name to more wholly represent all of its members. Founded over 40 years ago, LACA promotes and supports the professional development and general advancement of the Law School’s alumni and students of color, and seeks to more fully involve alumni, students and faculty of color in the educational, social, and intellectual life of the Law School. This organization further serves as a powerful vehicle through which professional and personal ties are cultivated."
