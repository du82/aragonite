["https://law.nyu.edu/news/nyu-law-top-legal-scholars-2024"]
title = "Six NYU Law professors named among top 100 legal scholars in 2024 ranking | NYU School of Law"
description = "Six NYU Law faculty members are among the top 100 legal scholars of 2024 in a ranking compiled by researchers at George Mason University. Institutionally, NYU Law ranked second among all law schools for the greatest number of scholars making the list, in a three-way tie with UC Berkeley Law and Harvard Law School."
full_description = "Six NYU Law faculty members are among the top 100 legal scholars of 2024 in a ranking compiled by researchers at George Mason University. Institutionally, NYU Law ranked second among all law schools for the greatest number of scholars making the list, in a three-way tie with UC Berkeley Law and Harvard Law School. The primary ranking selected the most influential legal scholars of 2024 by assessing those currently producing top scholarship, based on their total number of citations in law review articles published between 2018 and 2020. Those ranking in the top 100 included NYU Law’s Professor Maggie Blackhawk (ranked 43rd), Cynthia Estlund, Crystal Eastman Professor of Law (49th); Jeanne Fromer, Walter J. Derenberg Professor of Intellectual Property Law (71st); Professor Daniel Hemel (16th); Christopher Scott Hemphill, Moses H. Grossman Professor of Law (59th); and Richard Revesz, dean emeritus and AnBryce Professor of Law (95th). For the second year, the study included a separate ranking of scholars that was weighted for co-authorship: sole authors of papers received greater weight for each paper citation, while for papers with multiple authors, credit was awarded in diminishing proportion to the number of co-authors. In this list, several faculty members ranked significantly higher, including Blackhawk (ranked 23rd), Estlund (29th), and Revesz (73rd). The study, which has published rankings for three years, also highlighted broader legal issues, including the increased number of women in the 2024 rankings, the expected potential impact of COVID-19 on future rankings, and the role of generative AI in legal scholarship. Posted February 21, 2025"
