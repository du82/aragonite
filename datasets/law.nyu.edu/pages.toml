full_description = "Benedict Kingsbury’s broad, theoretically grounded approach to international law closely integrates work in legal theory, political theory, and history. José Enrique Alvarez is the former president of the American Society of International Law. Gráinne de Búrca has written widely on questions of European constitutional law and governance, human rights and discrimination, and international relations. Kevin Davis focuses his current research on contract law, anticorruption law, and the general relationship between law and economic development. Faculty Courses Centers For Students All Areas of Study Taking on the World With an unsurpassed faculty and extraordinary range in the global and international curriculum, the Law School prepares students to succeed in every kind of future career in a fast-changing, deeply interconnected, and frequently contentious world. The global curriculum includes courses developing foundational thinking in the history and theory of public international law and global governance, exceptional depth in human rights and global justice as well as environmental law (including climate change) and public interest lawyering and policy, entire programs offered in Latin America and Europe (NYU Law Abroad), leading Centers on East Asia and on national and international security law, premier programs on intellectual property & antitrust and on international arbitration & litigation, the pathbreaking Guarini Global Law & Tech, and excellent coverage of core practice areas ranging from global business law and corporate compliance, to international trade and investment and anti-corruption, to international taxation, dispute resolution, and international organizations law. NYU Law’s faculty bring to global legal issues interdisciplinary expertise in economics, sociology, philosophy, history, and critical scholarship. Hauser faculty, fellows, and students from around the world teach, study, and collaborate in New York, and along with our international LLM and JSD students, contribute immensely to our dynamic international community. A strong set of clinics and externships takes advantage of our superb New York location. Public interest summer funding ensures interested JD students can pursue opportunities abroad. To learn more, go to Global Programs."
