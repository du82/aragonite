full_description = "Please select a link below to view our academic calendar: 2024-2025 Block Schedule (PDF: 767 KB) (13 Week Semesters) 2025-2026 Block Schedule (PDF: 767 KB) (13 Week Semesters) Classes canceled due to holidays must be made up according to the Holiday Make-up Schedule. Please see the link below for the make-up schedule. Fall 2024 Holiday Make-Up Schedule (PDF: 284 KB) Spring 2025 Holiday Make-Up Schedule (PDF: 330 KB) Computation of Credit Hours According to ABA Rules, a “credit hour” is an amount of work that reasonably approximates: (1) not less than one hour of classroom or direct faculty instruction and two hours of out-of-class student work per week for fifteen weeks, or the equivalent amount of work over a different amount of time; or (2) at least an equivalent amount of work as required in subparagraph (1) of this definition for other academic activities as established by the institution, including simulation, field placement, clinical, co-curricular, and other academic work leading to the award of credit hours. For purposes of this Standard, fifty minutes suffices for one hour of classroom or direct faculty instruction. An “hour” for out-of-class student work is sixty minutes. The fifteen-week period may include one week for a final examination. For courses taken elsewhere in the University toward a Law degree, Law students will earn credits calculated as above (rounded down to the nearest quarter credit)."
