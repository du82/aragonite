["https://law.nyu.edu/careerservices/alumni"]
title = "Alumni Services | NYU School of Law"
full_description = '''The Office of Career Services (OCS) offers assistance to NYU Law alumni undertaking job or career transitions. Alumni can access: Job Listings On our Career Services Manager (CSM) website, jobs are searchable by geographic location, employer type, and practice area, etc. (Note: We cannot guarantee the reputation or professional standing of employers posting job listings.) OCS Alumni Publications The CSM Career Resources Library includes a number of comprehensive alumni publications, which we encourage you to review as you engage in your career search. To access any of these publications, log into your CSM/Symplicity account, click the "Resources" link at the top, click the "Career Resources Library" card, and then enter a keyword search for "Alumni." Guide to Resources for the Legal Job Search The Road to an Alternative Career Top Tips for Making a Transition to a New Practice Area Returning to the Workplace: How, When, Where? A Bibliography Job Search Tips & Resources for Recent Graduates Job Search Tips & Resources for Experienced Graduates Individual Career Counseling The OCS also offers alumni career counseling. Please e-mail a summary of your current situation (including the type of transition you are contemplating, your geographic parameters, any steps you may already have undertaken, and the specific topics you would like to discuss) to law.alumnicareers@nyu.edu. Please include a copy of your most up-to-date résumé (in a format other than pdf). A counselor will assess the information you have provided and either schedule an appointment or direct you to appropriate resources to be used in preparation for an appointment. (Alumni undertaking a search primarily in the public interest or government sector should contact the Public Interest Law Center at http://www.law.nyu.edu/publicinterestlawcenter for assistance.) (Please note: Alumni career information may be shared within and between the OCS and PILC and, when warranted, with the Office of Student Financial Services, the Office of Development and Alumni Relations, the Offices of the Vice Dean or Dean, the Office of the NYU General Counsel, and any other appropriate Law School or University offices.) For Recent Graduates LexisNexis Law School Graduate Program. After graduation, you may continue accessing lexisnexis.com/LawSchool with your student ID for ongoing free use of Lexis+®, including most of the products and features you've used as a student, through December 31 of your graduation year. No registration is required. Westlaw's Career related databases are available free-of-charge to NYU Law graduates for one year after graduation. Please use your student password to access these resources. More Law School Career-Related Services Judicial Clerkship Office (JCO) devotes significant resources to help graduates find judicial clerkship positions. Please register on CSM/Symplicity under the "Clerkships" tab and review the Judicial Clerkship Handbook and Appendices. Email Michelle Cherande, Assistant Dean, at michelle.cherande@nyu.edu to schedule an appointment or for counseling/advising related questions. Email Jim Nesbitt, Associate Director, at james.nesbitt@nyu.edu for technical questions such as creating applications on OSCAR, sending recommendation letters, etc. The Academic Careers Program is designed to help prepare members of the New York University School of Law community for careers in law teaching. Public Interest Law Center (PILC) provides career counseling, including advice on fellowship and job search strategies. PSJD (formerly PSLawNet) is an online clearinghouse of public interest and government job listings. NYU Law alumni can register for free. Office of Development & Alumni Relations offers graduates a forum in which to re-engage, connect and maintain ties long after graduation. More NYU Career-Related Services NYU School of Professional Studies offers programs, courses, and certificates in a wide range of professionally oriented areas of study. NYU Alumni Relations helps reconnect graduates who wish to find old friends, attend social and professional events, exchange ideas, and access career networking information.'''
