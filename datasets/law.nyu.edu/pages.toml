full_description = 'Standard 509 of the American Bar Association (ABA) requires law schools to make certain consumer information publicly available. Much of the information is included in NYU Law’s most recent ABA Standard 509 Information Report, which was released by the ABA in December 2019. Below is a guide to the categories of information that can be found in that report or elsewhere on the NYU website. For categories that appear in both the ABA report and on the website (e.g., tuition, fees, and living costs) the information on the website may be more current. Admissions data Standard 509 Information Report JD entering class profile Tuition, fees, and living costs Standard 509 Information Report Student expense budget Financial aid Standard 509 Information Report Financial aid Conditional scholarships and retention data NYU Law does not award scholarships that are conditional on law school academic performance; therefore we do not post an ABA "conditional scholarship retention worksheet." Refunds NYU Office of the Bursar - refunds Enrollment and attrition data/graduation rate Standard 509 Information Report Number of full-time and part-time faculty, librarians, and administrators Standard 509 Information Report Curricular offerings Course descriptions and search Areas of study Dual degree programs Class sizes, number of seminar, clinical, and co-curricular offerings Standard 509 Information Report Course descriptions and search Academic calendar Current year calendar and block schedule Academic requirements General requirements Degree requirements Library resources Standard 509 Information Report Library home page Facilities Buildings and campus map Housing Employment outcomes Three years of comparative employment data Bar passage outcomes report NYU Law Bar Passage Report 2025 (PDF: 620K) Criteria for transfer of credit earned at another institution Transfer and non-matriculant admissions information Credit requirements for dual degree candidates Accreditation