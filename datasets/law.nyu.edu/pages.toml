["https://law.nyu.edu/alumni/alumnibenefitsandresources"]
title = "NYU School of Law Alumni Benefits and Resources | NYU School of Law"
description = "The Office of Alumni Relations and Development is pleased to offer a wide variety of benefits and services to NYU School of Law graduates, some of which require an NYU Alumni Card. The NYU Alumni Card is offered in both digital or physical format, and is free for all degree holding alumni. For detailed information on the many benefits available to NYU Law alumni, please follow the links below."
full_description = "The Office of Alumni Relations and Development is pleased to offer a wide variety of benefits and services to NYU School of Law graduates, some of which require an NYU Alumni Card. The NYU Alumni Card is offered in both digital or physical format, and is free for all degree holding alumni. For detailed information on the many benefits available to NYU Law alumni, please follow the links below. For more information on benefits available to all NYU alumni, please visit the University Alumni Benefits page. Admissions Recommendations Alumni Authors' Project Auditing Classes Career Services Children of Alumni Undergraduate Admissions Discount Movie and Theater Tickets Jack H. Skirball Center for the Performing Arts Law Alumni Association Membership Law School Library Visitor Information Networking (Online Alumni Directory) NYU Alumni Card NYU Athletic Facilities NYU Book Centers and Computer Store Ordering Academic Attire Pro Bono Virtual Events and Podcasts Admissions Recommendations Alumni who would like to offer their support of a Law School applicant can send a letter of reference to: Nick Vagelatos 22 Washington Square North New York, NY 10011 nick.vagelatos@nyu.edu While all of our candidates receive equal consideration, letters of support from Law School alumni will be placed in the prospective student’s academic file. Alumni Authors' Project The NYU Professional Bookstore has recently created an alumni authors section and encourages alumni who have written books to submit them for consideration. Once submitted, the Bookstore will review books to ensure they are reasonably priced and appropriate for a retail outlet. Once books have passed the review, they will be shelved. Please send your name and the title of your book to bookstore.law.alumni@nyu.edu. Auditing Classes Alumni with JD degrees For information regarding auditing classes, please contact the Office of Records and Registration: Office of Records and Registration Furman Hall, Room 400 (212) 998-6040 www.law.nyu.edu/recordsandregistration law.registration@nyu.edu Alumni with LLM degrees A student who has been awarded the LLM degree by NYU School of Law may take a maximum of three additional courses (which will appear on their transcript) without becoming a candidate for another degree. Such a student must submit a Post-LLM Degree Study Request form to the Office of Records and Registration for permission to register, and must make payment and fulfill all of the requirements for each course, including the taking of in-class examinations via Exam Soft, the submission of required papers, and THES for take-home exams. For more information, click here. Children of Alumni Undergraduate Admissions An alumni admissions hotline has been created especially for alumni inquiries. Call the Alumni Admissions Hotline at (212) 998-4556 to receive undergraduate admissions information for a prospective NYU student; to learn about NYU admissions, receptions, and recruitment presentations; or to find out more about NYU campus tours for prospective students and parents. Discount Movie and Theater Tickets Alumni with a current NYU Alumni Card may use NYU's Ticket Central, located in The Kimmel Center on the corner of Washington Square South and LaGuardia Place (566 LaGuardia Place, use West Side Entrance), to purchase discount movie tickets and to obtain ticket vouchers to select Broadway and off-Broadway shows. Some restrictions apply. Call (212) 998-4949 or visit the Ticket Central website for more information. Jack H. Skirball Center for the Performing Arts The Jack H. Skirball Center for the Performing Arts is part of NYU's Kimmel Center for University Life, located at LaGuardia Place and Washington Square South. With its downtown location, seating for over 850, and state-of-the-art technology for new media and broadcast capabilities, the Skirball Center is a much sought after performing arts space, serving NYU's renowned arts programs and acting as a magnet for performance groups from around the world. NYU alumni who present a valid NYU Alumni Card are entitled to a 10% discount to most performances at the Skirball Center. Tickets must be purchased at the Skirball Box Office, and there are no refunds or exchanges on tickets once purchased. Please note that discounts are available only at the Box Office, and discounted tickets may not be reserved in advance by telephone or online. Alumni discounted seats are limited, so get yours early! For upcoming shows and more Box Office hours and location, call (212) 992-8484 or visit nyuskirball.org. Law Alumni Association Membership The Law Alumni Association (LAA) is an integral part of the educational, intellectual and social life at New York University School of Law. Upon graduation, all alumni automatically become members of the LAA and will receive invitations to all events sponsored by the LAA, including the LAA/LACA/Public Interest Law Center Benefit, lectures, receptions, and various recent graduate events. Some events, including Reunion classes, provide CLE credits. Law School Library Visitor Information NYU Law School alumni wishing to access the Law Library must be sponsored by the Law School’s Alumni Relations Office. To request visitor sponsorship, please email us at law.alumni@nyu.edu. Once sponsorship is approved, the library will issue an electronic Visitor's Pass. Networking Connect with Alumni in the Violet Network You're invited to join the Violet Network, NYU's new online platform. This virtual network facilitates knowledge sharing, networking, and mentorship among NYU students and NYU alumni. Sign up today! NYU Athletic Facilities NYU alumni can purchase a gym membership by visiting 404 Fitness (404 Lafayette Street) or the Palladium Athletic Facility (140 E 14th Street) during membership office hours with a valid photo ID. A single membership provides access to all NYU fitness locations: 404 Fitness, Palladium, Brooklyn, and the brand-new Paulson Center. If you have any questions, please see the Athletics Membership page. NYU Book Centers and Computer Store NYU alumni enjoy discounts on full-priced apparel and gifts at our Campus Bookstore or online shop. If you would like to shop in-store, you must present your NYU Alumni Card in order to receive the alumni discount. Alternatively, if you’d like to shop online, you may email alumni.benefits@nyu.edu to receive a discount code. *Does not include discounts on textbooks, medical books, or items in the NYU Computer Store, and discounts cannot be combined with other store sales or promotions Other restrictions may apply Ordering Academic Attire To order your collegiate cap and gown, please contact Paul Reilly at (516) 781-0348 or pjreill@aol.com. Prices are as follows: Gown: $593.40 Hood: $145.00 Cap/Tassel: $125.70 Total: $864.10 Order custom regalia Connect to Pro Bono via Paladin The Law School has partnered with Paladin, a service founded by Felicity Conrad ’13 that connects lawyers with personalized pro bono opportunities. For NYU Law students and graduates, this service is free of charge. Whether you are a recent graduate or had years of practice, work as a solo practitioner or at a firm, Paladin can connect you with pro bono opportunities in your community. They have created a special sign-up page for NYU Law students and alumni."
