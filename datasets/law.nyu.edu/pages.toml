["https://law.nyu.edu/alumni/giving"]
title = "Giving to NYU Law | NYU School of Law"
full_description = "The NYU School of Law has been a force in legal education since its founding in 1835. To maintain our course we rely on you, our students, alumni and friends, to support the Law School. Your gifts help us provide funding for program development, financial aid for students, public interest support, clinics and student-run organizations. Find out about the many ways to give to NYU Law. How will my gift make a difference? Annual Fund: The Annual Fund provides essential unrestricted support for the Law School’s highest priorities including scholarships, student journals, clinics, academic resources, technological improvements, the law library and more. Public Service: The Law School has committed to fund summer grants providing all interested first year and second year students with a $5,500 - $7,500 stipend for a 10-week Public Interest Summer Internship Grant. Loan Repayment Assistance Program (LRAP): The LRAP program provides nearly 500 graduates working in public service with full tuition and student loan repayment under specific guidelines, which are reviewed annually."
