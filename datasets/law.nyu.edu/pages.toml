title = "Diversity and Inclusion | NYU School of Law"
description = "What is diversity and inclusion? Diversity and inclusion are two closely related values at NYU School of Law. “Diversity” refers to the makeup of an institution, striving to ensure that a wide variety of sociocultural identities are represented at all levels. Mere presence of diversity is not enough; “inclusion” refers to the creation of a vibrant and welcoming place to learn and grow through infrastructure, initiatives, programming, and support."
