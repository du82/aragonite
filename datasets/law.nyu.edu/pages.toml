["https://law.nyu.edu/event-planning"]
title = "Event Planning at NYU Law | NYU School of Law"
description = "Event planning checklist"
full_description = "Event planning checklist NYU Law faculty, administrators, and students should request rooms and anticipated event services (e.g. media services, catering) as early in the planning process as possible via the following links: Event room requests Classroom requests Classroom requests for a given semester are reviewed after the add/drop period ends. The academic schedule for a given semester is not finalized until this period ends; until the course schedule is finalized, classes can still change times and locations. Classroom requests at the beginning of the Spring and Fall semesters will be reviewed one week before your requested date. After the add/drop period ends, requests will be reviewed on an ongoing basis. Please note classrooms assigned for non-credit-bearing programs may be changed to accommodate courses. Review AV and media production prices and policies: Quick guide to prices and services Production policies and procedures Review NYU campus access rules and request visitor access for speakers, VIPs, and guests who are not current NYU employees or students Campus safety personnel are required to be stationed at the 108 West Third Street entrance to D'Agostino Hall for the duration of all events in Lipton Hall and Faculty Club. Campus safety personnel are also required to escort visitors to the Law School who are accompanied by government agency law enforcement and security personnel. Please use this link to request campus safety services: NYU ServiceLink List your program on the Law School’s event calendar Contact Michael Orey from our Communications team if you plan to invite press Contact the Dean’s Office Institutional Events team if you plan to invite the Dean to speak at your programs or if you invite speakers from local, national or foreign governmental agencies to your programs New York University encourages all event conveners to abide by the Green Events Standard, particularly for events with 50 or more participants. Plan your events according to the NYU Green Events Standard Please do not schedule any events during the Forum block on Wednesdays from 1:10 p.m. to 2:25 p.m. You can review the block schedule here. Please submit all room and service requests no later 5:00 p.m. on Monday, at least two weeks before your event date. Please note that we prioritize room and service requests for NYU School of Law classes and programs. Our space request form will walk you through many of the above steps. However, if you have additional questions about services after you complete the room request form, please use the information below: Media services (microphones, recording, hybrid format, etc.): law.production@nyu.edu Catering orders: Plated Furniture set-up for catered events: the Chartwells team will reach out to you Furniture set-up for non-catered events: AdministrativeService@mercury.law.nyu.edu Event planners who need general advice about coordinating events at the Law School may email questions to the Dean’s Office Institutional Programming and Governance team at law.events@nyu.edu."
