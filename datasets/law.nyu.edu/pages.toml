["https://law.nyu.edu/centers/financialinstitutions"]
title = "Center for Financial Institutions | NYU School of Law"
description = "More than 170 nations regulate their economies through central banks. NYU's Center for Financial Institutions was established to study their nature and operations. The center includes perspectives drawn from law, economics, political science, history, and sociology. It encourages scholarly research on central banks, collects and disseminates information relating to their powers and activities, and facilitates discussion among bank officials and scholars in related fields through regular conferences and colloquia."
full_description = "More than 170 nations regulate their economies through central banks. NYU's Center for Financial Institutions was established to study their nature and operations. The center includes perspectives drawn from law, economics, political science, history, and sociology. It encourages scholarly research on central banks, collects and disseminates information relating to their powers and activities, and facilitates discussion among bank officials and scholars in related fields through regular conferences and colloquia. The director of the center is Stuyvesant P. Comfort Professor of Law Geoffrey Miller. The Center has been designed to accomplish three major goals: The collection and dissemination of information related to central banks and financial systems. The facilitation of discussion among central bankers, scholars, and those in related fields by simplifying the process by which information is gathered and distributed. The encouragement of scholarly research on central banks and financial systems."
