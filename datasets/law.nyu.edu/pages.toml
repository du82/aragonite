["https://www.law.nyu.edu/financialaid"]
title = "Financial Aid | NYU School of Law"
description = "Key Information The LRAP Application for 2025 is now available! Recent graduates should contact the Office of Student Financial Services to schedule time to discuss eligibility. Supporting documents needed for your application can be found on the Application Checklist."
full_description = "Key Information The LRAP Application for 2025 is now available! Recent graduates should contact the Office of Student Financial Services to schedule time to discuss eligibility. Supporting documents needed for your application can be found on the Application Checklist. What and where is Albert? Albert is the University’s online student information system where students can see class listings, grades, financial aid information, view your Bursar account, and receive news from the Registrar. Access Albert through NYUHome. On our website you will find information about the various types of financial aid available to you, including institutional awards, federal and private loans, and external scholarship opportunities. The amount of aid available, the form in which it is given, and the conditions for its awarding depend on a number of factors, including law school policies, as well as federal and state regulations, all of which may be modified at any time. There is no guarantee that the particular programs, fee structures, or policies will remain unchanged. NYU School of Law devotes substantial resources to financial aid, including institutional grants, scholarship programs, and our Loan Repayment Assistance Program (LRAP). Legal education is a significant investment of time, effort, and money. It should be approached with a full understanding of both the benefits and the costs. NYU School of Law evaluates admissions applications without considering family financial strength or ability to pay. The majority of students in US law schools finance their legal education with loans—federal and private. Most US citizens or permanent residents are eligible for federal Unsubsidized and/or Graduate PLUS loans. Private student loans are available to US citizens or permanent residents and international students, if eligible. We encourage you to review the information on our website and contact us with any questions."
