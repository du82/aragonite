["https://law.nyu.edu/events/acls-ccj-sandeep-vaheesan-book-talk-democracy-power-history-electrification-united-states"]
title = "ACLS & CCJ Sandeep Vaheesan Book Talk: Democracy in Power: A History of Electrification in the United States | NYU School of Law"
description = "The Antitrust and Competition Law Society (ACLS) and Center on Civil Justice (CCJ) are pleased to cohost a lunch talk featuring Sandeep Vaheesan, Legal Director at the Open Markets Institute, discussing his recent book, Democracy in Power: A History of Electrification in the United States. In this book, Vaheesan examines the transformation of America's energy industry during the 1930s, highlighting how public ownership and rural electric cooperatives emerged as alternatives to private financial control. He also offers insights into the bureaucratic challenges and private resistance faced during this transition and presents a forward-looking blueprint for publicly managed decarbonization.This event will provide a unique opportunity to explore the intersections of antitrust law, public policy, and energy reform. Attendees will gain a deeper understanding of the historical context of public utilities and their relevance to contemporary discussions on energy democracy and sustainability.Lunch will be provided - RSVP and see additional information here!"
full_description = "NYU Law Events Wednesday, March 5, 2025 ACLS & CCJ Sandeep Vaheesan Book Talk: Democracy in Power: A History of Electrification in the United States 12:00–1:00 p.m. Furman Hall, Classroom 216 245 Sullivan Street NY ,10012 (view map) Add to Google Calendar The Antitrust and Competition Law Society (ACLS) and Center on Civil Justice (CCJ) are pleased to cohost a lunch talk featuring Sandeep Vaheesan, Legal Director at the Open Markets Institute, discussing his recent book, Democracy in Power: A History of Electrification in the United States. In this book, Vaheesan examines the transformation of America's energy industry during the 1930s, highlighting how public ownership and rural electric cooperatives emerged as alternatives to private financial control. He also offers insights into the bureaucratic challenges and private resistance faced during this transition and presents a forward-looking blueprint for publicly managed decarbonization.This event will provide a unique opportunity to explore the intersections of antitrust law, public policy, and energy reform. Attendees will gain a deeper understanding of the historical context of public utilities and their relevance to contemporary discussions on energy democracy and sustainability.Lunch will be provided - RSVP and see additional information here! CLE Credit Available: No Event Contact(s): Morgan Carter , mmc10117@nyu.edu"
year_published = 2025
