["http://www.law.nyu.edu/centers/transnational"]
title = "Center for Transnational Litigation, Arbitration, and Commercial Law | NYU School of Law"
description = "The place where academics meet the demands of transnational legal practice"
full_description = '''The place where academics meet the demands of transnational legal practice The Intesa Sanpaolo Center for Transnational Litigation, Arbitration, and Commercial Law has been established to advance the study and practice of international business transactions and the way to solve related disputes either through litigation or arbitration. As commercial transactions become increasingly international, it is vital to the legal and business communities to understand and analyze the practices and legal principles that govern relationships between firms and between firms and consumers in the international arena. Subjects such as the appropriate degree of harmonization of domestic laws, sovereign and private lending to developing nations, choice of law in commercial transactions, the proper scope of international arbitration and litigation, and the role of private groups in promulgating principles that have international application will inevitably increase in importance in the immediate future, and both attorneys and their clients who are involved in projects that transcend national boundaries must have an increased understanding and appreciation of the implications of these areas. What's New Arbitration in Corporate Disputes Involving Consumers: An Analysis of Austria's Current Arbitration Law and Recent Law Proposal While shareholder disputes are generally arbitable under Austrian law, this is currently severely limited by Section 617 of the Austrian Code of Civil Procedure ("ACCP"). Intesa Sanpaolo Center for Transnational Litigation, Arbitration, and Commerical Law hosts 5th Intergenerational Arbitration Symposium The Intesa Sanpaolo Center for Transnational Litigation, Arbitration, and Commercial Law is glad to announce that it will host, together with SciencesPo Law School, the 5th edition of the Intergenerational Arbitration Symposium. Professor Franco Ferrari contributes to German language commentary on the United Nations Convention on Contracts for the International Sale of Goods Professor Franco Ferrari, the Director of NYU School of Law’s Intesa Sanpaolo Center for Transnational Litigation, Arbitration, and Commercial Law, has just published a commentary on the United Nations Convention on Contracts for the International Sale of Goods (CISG). NYU's Center for Transnational Litigation, Arbitration, and Commercial Law hosts arbitration conference in Shanghai NYU's Center for Transnational Litigation, Arbitration, and Commercial Law is glad to announce that it will host, together with the Shanghai International Dispute Resolution Center, the Commercial Arbitration Research Center of the Shanghai International Arbitration Center (SHIAC), and Jincheng Tonga & Neal Law Firm (JT&N) an in-person event titled “Who Owns International Arbitration." Professor Franco Ferrari submits an amicus curiae brief in two matters pending before the Supreme Court of the United States NYU Law's Center for Transnational Litigation, Arbitration, and Commercial Law is glad to announce that its Executive Director, Professor Franco Ferrari, submitted an amicus curiae, co-authored with Professor Andrea Bjorklund from McGill University, in the matters CC/Devas Ltd. et al. v. Antrix Corp. Ltd. et al., case number 23-1201, and Devas Multimedia Pvt. Ltd. v. Antrix Corp. Ltd. et al., case number 24-17, pending before the Supreme Court of the United States. 2025 Hague Conference of Private International & PCA summer internship The Center for Transnational Litigation, Arbitration, and Commercial Law is pleased to announce that both the Hague Conference on Private International Law and the Permanent Court of Arbitration (PCA) will each again be offering a summer internship for students who have or can obtain NYU PILC grants. Professor Franco Ferrari publishes a paper in French on the importance of the seat of arbitration Professor Franco Ferrari, the Director of NYU School of Law's Center for Transnational Litigation, Arbitration, and Commercial Law, has just published a paper in French on the importance of the law of the seat in the peer-reviewed Revue de droit international et de droit comparé (L'importance du siège de l'arbitrage, Revue de droit international et de droit comparé (2024) 225-251). NYU's Center for Transnational Litigation, Arbitration, and Commercial Law hosts a talk on the CISG's interpretation and application by Italian Supreme Court Justice Francesco Cortesi The Center for Transnational Litigation, Arbitration, and Commercial Law is glad to announce that on October 7, 2024, Honorable Justice Cortesi will give a talk titled “The Interpretation and Application of the CISG: the Good, the Bad, and the Ugly”. The EU in the Gulf region, a seminar with Luigi Di Maio, EU Special representative for the Gulf region - an event of the NYU School of Law's Center for Transnational Litigation, Arbitration, and Commercial Law The Center for Transnational Litigation, Arbitration, and Commercial Law is glad to be able to invite you to a seminar titled "The EU in the Gulf Region" with the participation of Mr. Luigi Di Maio, the EU Special Representative for the Gulf Region. NYU School of Law's Center for Transnational Litigation, Arbitration, and Commercial Law hosts seminar on "Restituting Nazi-Confiscated Art: A Restatement" NYU School of Law’s Center for Transnational Litigation, Arbitration, and Commercial Law is glad to be able to announce that on September 16, 2024, it will host a seminar titled “Restituting Nazi-Confiscated Art: A Restatement”.'''
year_published = 2025
