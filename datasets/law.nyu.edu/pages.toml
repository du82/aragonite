full_description = "Students Registrar Course Selection Financial Aid Student Groups Journals Library Academic Calendar facebook linkedin twitter instagram youtube Academics Academics Student Life Student Life Career Resources Career Resources More for LLMs More for LLMs Common Requests See grades or financial info Find graduation requirements Request a budget adjustment Reserve meeting space Academic credit for journal work Register for classes Student writing How to Navigate Law School Are you on track to reach your goals? Consult this year-by-year list of important student mileposts and you can stop worrying about when to look for a summer job, what to do about the substantial writing requirement, and how to sign up for the Bar. Who Can Help with Questions about... Academic Advising Assistant Dean Michelle Kirkland and her team in Academic Services and Registration can help you with registration and course assignments, the course evaluation process, transcripts, records maintenance, and more. Contact law.acadservices@nyu.edu. Academic Integrity and Curriculum Vice Dean for Curriculum Randy Hertz oversees the implementation of degree requirements and course scheduling and can help you with concerns related to academic integrity or curriculum. Contact randy.hertz@nyu.edu. Academic and Student Support Dean of Students and Assistant Dean for Diversity and Inclusion Lindsay Kendrick and her Student Affairs team offer academic support (including advisement, tutoring, leave of absence requests, etc.), counseling, and counseling referrals. Contact law.studentaffairs@nyu.edu. Bar Exam Assistant Dean Michelle Kirkland and her team in Academic Services and Registration can help you with all bar exam-related questions. Contact law.acadservices@nyu.edu. Career and Employment (Private Sector) Assistant Dean Pamela Mittman and her team can help you with questions that arise with employer interviews or summer positions, Early Interview Week, etc. Contact law.careers@nyu.edu. Clerkships Assistant Dean of Clerkships Michelle Cherande and her team in the Judicial Clerkship Office can help you with issues related to clerkship applications and interviews. Contact Michelle.Cherande@nyu.edu. Clinics or Externships Associate Dean for Experiential Education and Clinical Programs Deborah Archer oversees clinical and externship offerings and can help with concerns related to clinical courses or externships. Contact deborah.archer@nyu.edu. Disability Accommodations The NYU Moses Center for Accessibility and Inclusive Culture works with students to determine appropriate and reasonable accommodations that support equal access to education. The Moses Center can help with classroom, housing, facilities, or other related support or accommodations. Contact Robyn Weiss at rew8@nyu.edu. Diversity and Inclusion Assistant Dean for Diversity and Inclusion and Dean of Students Lindsay Kendrick and her Diversity and Inclusion team support and promote community diversity, inclusiveness, and belonging across a range of areas, including student life. Contact Lindsay.Kendrick@nyu.edu. Financial Aid The financial aid team, led by Senior Director Joel Schoenecker, can help answer questions about the various types of financial aid available to you, including institutional awards, federal and private loans, LRAP, and external scholarship opportunities. Contact law.finaid@nyu.edu Graduate Affairs Senior Director Barbara Landress and her team in Graduate Affairs help LLM students with adjustment to a US law school, academic policies and procedures, course selection, bar exam eligibility, and personal and academic difficulty. Contact law.graduateaffairs@nyu.edu. Graduate Tax Program Faculty Director Brant Hellwig and this team at the Graduate Tax Program can help answer graduate-tax related questions. Contact law.taxprogram@nyu.edu. Housing Director of Student Life Nancy Mah-Chau and her team help students with housing-related issues, such as concerns about roommates or neighbors, use of common areas, religious or other accommodations, etc. Contact law.reslife@nyu.edu. Lawyering Program Director Andy Williams can help with issues related to instruction or instructors in the Lawyering Program. Contact williamsa@mercury.law.nyu.edu. Public Service Assistant Dean Lisa Hoyes and her team at the Public Interest Law Center can help with personal or financial implications regarding public service as well was public sector employment and interviewing. Contact pilc.info@nyu.edu."
