["https://law.nyu.edu/giving/campaign"]
title = "Campaign: Lead the Way | NYU School of Law"
description = "Watch Lead the Way: Building the Future of NYU Law"
full_description = "Watch Lead the Way: Building the Future of NYU Law Our Lead the Way Campaign has raised a record-setting total of $540 million and provides a tremendous investment in the future of NYU Law. The generosity of our alumni and other supporters will help NYU Law to remain a true leader in legal education, with an outstanding faculty that prepares our students to be at the forefront of the legal profession, addressing the most pressing issues of our time. We are deeply grateful. —DEAN TREVOR MORRISON (9/23/21) SUPPORTING STUDENT SUCCESS NYU Law has expanded the amount of aid it offers to make law school more affordable and accessible to all students. We are working hard to ensure that students have the support they need to become leaders in their fields. Since 2012, the year before the Campaign began, the Law School has increased the percentage of 1L students receiving scholarships from 32.5 percent to 66 percent. The total number of JD and LLM students receiving aid has risen from 593 in 2012 to 986 in 2021. We have established 82 new named JD and LLM scholarships, and deepened our support for existing scholarship programs. Public Interest Law Center Summer Funding Grants, which guarantee funding for all first- and second-year students who work in public service, have been increased for both 1Ls and 2Ls. Our Loan Repayment Assistance Program for alumni working in public service is now one of the most generous in the nation; most participants with an annual salary of up to $100,000 have no monthly payment on their law school loans. BUILDING AN EVEN STRONGER FACULTY The Law School has appointed 23 new faculty members since 2013—including 17 in tenured or tenure-eligible positions—to its deep bench of influential scholars and expert practitioners. These gifted teachers are leaders in a wide range of fields, including constitutional law, corporate governance and finance, criminal law, environmental justice, and intellectual property. Their work helps make the Law School an engine for thought leadership. DEVELOPING CUTTING-EDGE CENTERS Our centers and programs make an impact by applying big ideas to today's biggest issues. Since the start of the Campaign, the Law School has added 15 new centers and increased support for others. Among the areas they cover: national security; policing; climate change; diversity and inclusion; law and social entrepreneurship; corporate finance and governance; tax law; and race, inequality, and the law. SUPPORTER SPOTLIGHTS These alumni and supporters know the worth of an NYU Law education, and their generous contributions enable the Law School to build on its tradition of excellence. Thanks especially to the co-chairs of our Campaign John M. Desmarais ’88, David A. Tanner ’84, Elana B. Wilf Tanzman ’12, as well as Kenneth Raisler '76, the chair of the law school’s development committee of the board of trustees. READ MORE ABOUT THESE DEDICATED CONTRIBUTORS"
