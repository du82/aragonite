["https://law.nyu.edu/academics/colloquia/lawphilosophy/colloquium"]
title = "Colloquium in Legal, Political, and Social Philosophy | NYU School of Law"
description = "Each week, a legal theorist or moral or political philosopher presents a paper to the group, which consists of students, faculty from the Law School and other departments of NYU, and faculty from other universities. Each week’s paper is posted at least a week in advance on this page; participants are expected to have read the paper in advance."
full_description = "Each week, a legal theorist or moral or political philosopher presents a paper to the group, which consists of students, faculty from the Law School and other departments of NYU, and faculty from other universities. Each week’s paper is posted at least a week in advance on this page; participants are expected to have read the paper in advance. All are welcome at the public sessions of the colloquium, which take place on Thursdays, in Lester Pollock Colloquium Room, Furman Hall, 9th floor, from 4:00 to 7:00 pm. Non-NYU-affiliated people should contact Omar Andron at owa207@nyu.edu to arrange building access. Students taking the course for credit: Students enrolled in the Colloquium meet separately with the conveners for an additional two-hour seminar on Wednesdays. One hour is devoted to a review of the preceding Thursday’s colloquium discussion, and one hour to preparation for the colloquium the following day. Students are asked to write short reaction papers weekly, and each student is asked to make two or more oral presentations to the seminar during the term. Assessment is based on participation, reaction papers, presentations, and a final term paper. Admission to the seminar is only by permission of the conveners. Students wishing to take the colloquium for credit should send their applications via e-mail to Omar Andron <owa207@nyu.edu> between July 1 and July 31, stating their background in law and philosophy and their interest in the colloquium. The application should use the subject line: Colloquium in Legal, Political, and Social Philosophy Application for Fall 2024. Please indicate which program you are enrolled in. Students not in the School of Law or Department of Philosophy at NYU should check with Academic Services about eligibility to register. Colloquium 2025 Professors Liam Murphy and Samuel Scheffler August 28th Michael Otsuka, Rutgers University September 4th Christine Korsgaard, Harvard University September 11th Japa Pallikkathayil, University of Pittsburgh September 18th Melissa Schwartzberg, NYU September 25th Cecile Laborde, Oxford University October 9th T.M. Scanlon, Harvard University October 16th Deborah Hellman, University of Virginia October 23rd Lucas Stanczyk, Harvard University October 30th Miranda Fricker, NYU November 6th Jeremy Waldron, NYU November 13th Olúfẹ́mi Táíwò, Georgetown University November 20th Wendy Salkin, Stanford University Past papers Fall 2024 Fall 2023 Fall 2022 Fall 2021 Fall 2020 Fall 2019 Fall 2018 Fall 2017 Fall 2016 Fall 2015 Fall 2014 Fall 2011 Fall 2010 Fall 2009 Fall 2007 Fall 2006 Fall 2005 Fall 2003 Fall 2002 Fall 2001"
