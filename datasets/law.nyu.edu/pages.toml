["https://www.law.nyu.edu/areasofstudy/constitutional"]
title = "Constitutional, Civil Rights, & Democracy | NYU School of Law"
description = "Faculty Courses Centers For Students All Areas of Study Defining Freedom NYU Law features one of the most diverse and distinguished co"
full_description = "Richard Pildes is a leading scholar of constitutional law and a specialist in legal issues affecting democracy. Rachel Barkow focuses on applying administrative and constitutional law to the administration of criminal justice. Kenji Yoshino is a specialist in constitutional law, antidiscrimination law, and law and literature. Helen Hershkoff is co-author of Civil Procedure: Cases and Materials. Richard Epstein is director of the Classical Liberal Institute. Dean Emeritus Trevor Morrison served as associate counsel to President Barack Obama. Samuel Issacharoff is one of the pioneers in the law of the political process; he co-authored the Law of Democracy casebook. Faculty Courses Centers For Students All Areas of Study Defining Freedom NYU Law features one of the most diverse and distinguished constitutional law faculties in the world. NYU faculty approach constitutional law from a remarkably wide range of methodological and topical perspectives, bridging theory and practice. The curriculum features a vast array of offerings, from fundamental courses covering constitutional structure, rights, and interpretation, to seminars on presidential power and sex discrimination, to clinics on public policy, civil rights, and racial justice. NYU faculty have led the way in creating new areas of constitutional research and practice, like the Law of Democracy and International and Comparative Constitutionalism, and they have been among the most prominent voices on compelling questions of contemporary constitutionalism such as same-sex marriage and executive power in the post-9/11 world. Beyond their scholarship and teaching, many NYU faculty are actively engaged in constitutional litigation and in shaping public policy and debate, and a number have held high-level positions in government. Whatever their specific interests in constitutional law, NYU students will find multiple faculty members with experience, expertise, and enthusiasm to engage. Additional opportunities for students interested in constitutional law abound. Student organizations like the American Constitution Society and the Federalist Society, along with journals like the Review of Law & Social Change and the Journal of Law and Liberty, facilitate lively intellectual debate about constitutional issues spanning the political spectrum. The Brennan Center for Justice, a powerhouse policy institute, involves NYU students in its research and litigation and host regular events with practitioners and legal scholars. The long-standing Arthur Garfield Hays Civil Liberties Program supports 3L students committed to civil liberties. Faculty Courses Centers For Students All Areas of Study Defining Freedom NYU Law features one of the most diverse and distinguished constitutional law faculties in the world. NYU faculty approach constitutional law from a remarkably wide range of methodological and topical perspectives, bridging theory and practice. The curriculum features a vast array of offerings, from fundamental courses covering constitutional structure, rights, and interpretation, to seminars on presidential power and sex discrimination, to clinics on public policy, civil rights, and racial justice. NYU faculty have led the way in creating new areas of constitutional research and practice, like the Law of Democracy and International and Comparative Constitutionalism, and they have been among the most prominent voices on compelling questions of contemporary constitutionalism such as same-sex marriage and executive power in the post-9/11 world. Beyond their scholarship and teaching, many NYU faculty are actively engaged in constitutional litigation and in shaping public policy and debate, and a number have held high-level positions in government. Whatever their specific interests in constitutional law, NYU students will find multiple faculty members with experience, expertise, and enthusiasm to engage. Additional opportunities for students interested in constitutional 