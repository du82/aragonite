title = "Fellowships | NYU School of Law"
description = "Current Students The Arthur Garfield Hays Civil Liberties Program, founded in 1958, awards fellowships to a small group of third-year students committed to civil liberties. Information about other fellowships for current students can be found in the Records and Registration section."
full_description = "Current Students The Arthur Garfield Hays Civil Liberties Program, founded in 1958, awards fellowships to a small group of third-year students committed to civil liberties. Information about other fellowships for current students can be found in the Records and Registration section. Post-Graduates Academic fellowships—including the Berkowitz Fellowship, the Furman Academic Fellowship Program, the Gruss Scholar-in-Residence program, the Law and Economics Fellowship program, the Open Society Presidential Fellowship, and the Samuel I. Golieb Fellowship in Legal History—offer post-graduates pursuing careers in academia the chance to work on their scholarship and be active members of the NYU Law community. Information about other post-graduate public interest fellowships can be found in the Public Interest Law Center section. Scholarships For Current 1L Students 1Ls with a passion for a particular field of study can seek additional opportunities in the form of scholarships and fellowships: Association for Senior Debate Fellowships Criminal Justice Center Fellowships Derrick Bell Scholarship for Public Service Furman Academic Scholars Program Galgay Fellowships in Bankruptcy and Reorganization Law Latham & Watkins Award in Technology and Law Lawrence Lederman Fellowships in Law and Economics NYU Cyber Scholars Program Program on Corporate Compliance Enforcement Fellowship Trans Rights & Representation Scholarship For Current 2L Students Looking toward their third year, 2Ls should consider taking advantage of these NYU Law programs: Arthur Garfield Hays Civil Liberties Program Furman Academic Scholars Program Latham & Watkins Award in Technology and Law NYU Cyber Scholars Program Program on Corporate Compliance Enforcement Fellowship Trans Rights & Representation Scholarship"
