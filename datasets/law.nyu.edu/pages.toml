title = "Institute for Corporate Governance & Finance | NYU School of Law"
full_description = "Co-Director Robert Jackson, Dean Troy McKenzie, Deputy Attorney General Lisa Monaco, Jennifer Arlen, and Co-Director Ed Rock. Co-Director Ed Rock. Donna Anderson and Brian Schorr at the 2023 Spring Roundtable Chancellor Kathaleen McCormick gives the Distinguished Jurist Lecture. Co-Director Robert Jackson, Commodities Futures Trading Commission Chairman Rostin Behnam, and Senior Research Fellow Allison Herren Lee. Ed Rock introduces the conference on REITS in a Time of Disruption. About Us In any significant corporate governance controversy, the de facto “deciders” are the largest institutional investors. This new balance of power sets the policy and research agenda. The Institute for Corporate Governance & Finance was launched in 2016 to address these issues, taking advantage of the concentration of finance, talent, and activity in New York and at New York University. Whatever the issue—activist shareholders, short-term versus long-term investment horizons, compensation, control contests, going private, spinoffs, etc.—the central questions should be “what do the big institutions think?” and “what should the big institutions think?” The Institute gathers the key individuals in academia, government, corporations, asset management, and private practice into conversation with the goal of providing the community with practical answers to address real-world issues. See Annual Report Upcoming Events Tuesday, March 18, 4:30 to 6:00 p.m. Iconic Delaware Cases: Corwin Lipton Hall, D'Agostino Hall Reception to follow. RSVP Tuesday, April 1, 4:30 to 6:00 p.m. Deal Day: Project Manifest - the Restructuring of Global Indemnity Insurance Lipton Hall, D'Agostino Hall Reception to follow. RSVP Thursday, April 10 4:30 to 6:00 p.m. Revlon at 40 Lipton Hall, D'Agostino Hall Reception to follow. Thursday, May 1, 9:30 to 4:00 p.m. Spring Roundtable: Advanced Notice Bylaws Lipton Hall, D'Agostino Hall Invitation Only Event Spotlight In October, ICGF hosted a Fireside 