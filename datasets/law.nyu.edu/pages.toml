["https://law.nyu.edu/global/law-abroad-and-exchange"]
title = "JD Law Abroad and Exchange | NYU School of Law"
description = "At NYU Law, outbound study abroad programming for JD students aims to help students develop global fluency—sensitivity to different legal cultures and contexts, linguistic ability, and the flexibility to work effectively across jurisdictions. For JD students, there are two types of outbound semester-long programs currently available:"
full_description = 'At NYU Law, outbound study abroad programming for JD students aims to help students develop global fluency—sensitivity to different legal cultures and contexts, linguistic ability, and the flexibility to work effectively across jurisdictions. For JD students, there are two types of outbound semester-long programs currently available: NYU Law Abroad gives JD students the opportunity to spend a semester immersed in the law and legal culture of another part of the world through an academic program designed and administered by the Law School in cooperation with local partners. The abroad sites are located in Buenos Aires and Paris, and offered in the spring semester only. The NYU Law Exchange program allow NYU Law students to directly enroll at one of our nine foreign partner universities spanning three continents. Exchange students have regular access to the host institution’s facilities, including law libraries and campus resources. Students may participate in an exchange program during either semester of their 2L year or during the Fall semester of their 3L year. Foreign students nominated by our partner schools are also eligible to apply to NYU Law as incoming exchange students. For more information on incoming exchange, please visit "Incoming Exchange Students." Program Administration and Application NYU Law Abroad and Exchange are administered by the Office of Global Programs at NYU School of Law. The application cycle runs annually, with admission to both programs considered through the same application process. Eligibility and selection criteria for both programs are likewise identical. For more information, please visit “Application and Enrollment Process.” Program Cancellation The programs may be canceled or suspended if we were unable to rely on the partner schools and/or host institution offering a meaningful educational experience comparable to that in New York, or to ensure the safety and well-being of students and members of the NYU community. Should the program be canceled, students would receive an email communication from the School notifying them of the decision and indicating any actions necessary. Withdrawal and Refunds An opportunity will be provided for students to withdraw in the following circumstances: If changes are made in the course offerings or other significant aspects of the program; If, prior to the commencement or during the course of the program, a US State Department Travel Warning or Alert covering program dates and destinations is issued for the country in which the program will be conducted. Should the program be canceled or a student choose to withdraw due to any of the circumstances listed above, all monies paid will be refunded within 20 days of withdrawal/cancellation with the exception of room and board payments utilized prior to the date of withdrawal/cancellation. Program Update The application for Spring 2022 NYU Law Abroad in Buenos Aires and Paris will run from August 23 through September 4, 2021. JD students in the classes of 2022 and 2023 are encouraged to apply. For more information, please visit our Application and Enrollment page.'
year_published = 2025
