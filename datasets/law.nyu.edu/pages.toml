["https://law.nyu.edu/centers/tax-law-center"]
title = "Tax Law Center | NYU School of Law"
full_description = '''The Tax Law Center at NYU Law seeks to protect and strengthen the tax system through rigorous, high-impact legal work in the public interest. The legal choices that shape the tax system can be complex and opaque for people who are not tax experts, but they can have profound impacts, including on how much revenue the tax system raises and who pays tax. Private interests often invest heavily in shaping these choices. The Tax Law Center aims to be a strong public interest voice weighing in on these technical yet consequential tax law issues. To do so, the Center provides technical input on tax legislation, comments on tax regulations, and submits amicus briefs in tax litigation, with the aim of improving the integrity of the tax system, saving and raising revenues, and advancing equity. Sign up for our newsletter Read Tax Law Center blog DOGE Efforts Create Major Risks for Taxpayers–and May Generate Criminal and Civil Penalties With discussions of unprecedented and potentially illegal disclosure of confidential tax information related to DOGE accelerating, the Tax Law Center has compiled information on the tax code’s protections against political interference and misuse of taxpayer information. In our latest post, we discuss the potential legal risks, including potentially violating the rights of millions (or even hundreds of millions) of taxpayers and racking up potentially billions of dollars (or even hundreds of billions or more) in fines payable by the government. We also discuss risks beyond the tax system, such as stopping valid Social Security and other benefit payments, inadvertently triggering large-scale data breaches, and partisan use of data for personal gain or to target enemies. The full text is included below. Additional comments from Tax Law Center Faculty Director Lily Batchelder can be found on X and Bluesky. This is part of an ongoing series of explainers on taxpayer protections. For more, see: Understanding Taxpayer Privacy Protections Under Section 6103 and Related Statutes DOGE Access to Tax Data and Systems Creates Major Risks for Taxpayers — and May Carry Criminal and Civil Penalties for Anyone Violating the Laws Protecting Taxpayers Understanding the Tax System’s Protections Against Political Interference in the Tax Code What Loper Bright and Moore Mean for Tax The Tax Law Center and the American Tax Policy Institute hosted a virtual event focused on the impact that these two Supreme Court decisions will have on the tax system, including reflection on underappreciated aspects of these otherwise much-discussed cases. The event featured panel discussions on each case and closing reflections from former Assistant Treasury Secretaries for Tax Policy Lily Batchelder and Eric Solomon. View the full event information and event recording. Modernizing Partnership Taxation September 25, 2024 Miles Johnson, Sophia Yan, Chye-Ching Huang, and Grace Henley Partnership tax reform should be a key part of the current and upcoming tax policy debate, with large parts of the 2017 Tax Cuts and Jobs Act set to expire at the end of 2025. Partnerships are a large and growing slice of the economy, representing almost 30 percent of business income in the United States. But partnership tax rules today have some critical weaknesses that generate wasteful planning, undermine equity, and reduce revenue. A new policy proposal from The Tax Law Center and The Hamilton Project examines the current structure of partnership taxation and presents a selection of reform proposals. Read a summary here and the full proposal here. The Tax Law Center and the Hamilton Project held an event, featuring U.S. Senate Finance Chair Ron Wyden, to lay out the scope of the partnership tax challenge for policymakers and discuss what changes should be considered. View the recording here. Moore v. United States at the Supreme Court The Tax Law Center has published resources to help readers understand the landmark tax case at the Supreme Court: New analysis on the decision and accompanying blog post: "Everyone agrees the Moores lost at the Supreme Court — except their counsel" NYU Law Forum event: Chye-Ching Huang and other experts discussed the legal, economic, and ethical issues the Moore case presents. The Tax Law Center's amicus brief, co-authored with Professors Ari Glogower, David Kamin, Rebecca Kysar, and Darien Shanske The “Tealbook”: Options to Broaden the US Tax Base A raft of tax loopholes and preferential treatments totaling $1.5 trillion shrink the tax base, lose revenues, and attract tax avoidance and evasion instead of productive investment. With a major year for tax policy looming in 2025, the Tax Law Center aims to deepen the conversation by providing detailed options for potential changes that go beyond simply ending, extending, or modifying the provisions of the 2017 tax law. Our new online tool allows users to learn about current holes in the tax system, filter policy options by topic, and find links to information and analysis including revenue estimates where available. Download a PDF version here. Tax Law Center's Blog Read our full blog on Medium Treasury and the IRS issue important new guidance regarding direct pay for clean energy credits March 11, 2024 The Clean Hydrogen Tax Credit: Why Induced Emissions Must be Considered February 28, 2024 How Treasury and the IRS have the authority to eliminate a little-known tax subsidy for executives’ personal use of corporate jets February 22, 2024 Sign up for our mailing list to receive notifications of new blog posts and updates from the Tax Law Center Recent Work How large businesses use partnerships to create tax deductions out of thin air: An explainer on related party basis shifting July 26, 2024 Tax Law Center Staff and Miles Johnson Comment on Notice 2024-54 and Forthcoming Guidance Regarding Partnership Related-Party Basis Shifting Transactions July 17, 2024 Comment Regarding Stock Repurchase Excise Tax Proposed Regulations June 21, 2024 Duncan Hardell, Chye-Ching Huang, Mike Kaercher, Kelsey Merrick, and Thalia Spinrad View all Press Highlights June 20, 2024 Supreme Court upholds a tax on corporate wealth held overseas Los Angeles Times Quoted: Chye-Ching Huang’s statement in response to the decision in Moore v. US. June 20, 2024 Justices uphold Trump tax on overseas investments in win for Biden CNN Quoted: Chye-Ching Huang’s statement in response to the decision in Moore v. US. June 12, 2024 Campaign Underway to Repeal the Corporate Transparency Act Tax Notes (Subscription Required) Mentioned: The Tax Law Center’s amicus brief on National Small Business United et al. v. U.S. Department of the Treasury. View all'''
year_published = 2025
