["https://law.nyu.edu/centers/grunin-social-entrepreneurship"]
title = "Grunin Center for Law and Social Entrepreneurship | NYU School of Law"
full_description = "Creating ways for law and lawyers to drive positive change in the world Launched in 2017, the Grunin Center for Law and Social Entrepreneurship is a global leader in the field of law and social entrepreneurship. The mission of the Grunin Center is to enhance the community of lawyers and legal institutions purposefully engaged in social entrepreneurship, impact investing, and sustainable development, and to accelerate their effective participation in these fields. The Grunin Center, led by Faculty Director Deborah Burand, is uniquely positioned to bridge the gaps between legal practitioners, scholars, educators, and law students. As part of its work, the Center: Educates students and lawyers about legal issues. Learn about our resources. Leads path-breaking conversations to advance the fields. Learn about our Conference. Invests in the success of students who are interested in applying their legal skills to the fields. Learn about student opportunities. Celebrates the contributions of legal practitioners, scholars, and students to the fields. Learn about student prizes and professional prizes. Subscribe to our Newsletter Follow us on LinkedIn The Grunin Center for Law & Social Entrepreneurship is made possible through a generous endowment from NYU School of Law graduates Jay Grunin ’67 and Linda Kalmanowitz Grunin ’67, and the Jay and Linda Grunin Foundation, as well as the generous support of the White & Case Social Entrepreneurship Fund. NYU Law School is grateful to the Grunins and to White & Case for their immense generosity and partnership."
