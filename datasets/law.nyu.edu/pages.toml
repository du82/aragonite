["https://law.nyu.edu/academics/colloquia/usasia-colloquium"]
title = "US Asia Law Institute Colloquium: Globalization, International Law and East Asia Law | NYU School of Law"
description = "Professor José E. Alvarez Professor Frank Upham FALL 2024 Thursdays 4:45PM-6:45PM LAW-LW.12761.001 2 credits"
full_description = 'Professor José E. Alvarez Professor Frank Upham FALL 2024 Thursdays 4:45PM-6:45PM LAW-LW.12761.001 2 credits This two credit colloquium will meet weekly during the fall semester of 2024. Background readings and invited guests will address select issues concerning international and comparative law involving some of the countries, societies, and regional organizations in East Asia. As indicated in the tentative syllabus below, it will include discussion of contemporary developments with respect to human rights (including gender discrimination), comparative constitutional and corporate law, same sex marriage, and US-China economic or national security tensions Fall 2024 Schedule of Presenters September 12: Class 3 Guest #1: Shitong Qiao, “Governing with Platforms: The Rise of Copyright on China’s Internet” September 19: Class 4 Guest #2: Teemu Ruskola “The Unmaking of the Chinese Working Class: The Limits of Global Capitalism” October 10: Class 7 Guest #3 Matthew Erie, “Adversarial Comparativism” October 17: Class 8 Guest #4: Bruce Aronson “Designing a New Framework to Regulate Hostile Takeovers in a Changing Japan” October 24: Class 9 Guest #5: Ben Liebman [topic to be determined] November 7: Class 11 Guest #6: Peter Dutton “Taiwan’s Status under International Law” November 14: Class 12 Guest #7: Xuan W. Tay Topic: "How National Narratives Shape the Sovereign of Nation-States" - Anyone wishing to attend any particular session of the Colloquium (IN PERSON) above should email Stephany Ramos (Stephany.ramos@nyu.edu) to see about space availability.'
