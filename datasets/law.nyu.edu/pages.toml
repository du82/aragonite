["https://law.nyu.edu/areasofstudy/tax"]
title = "Taxation | NYU School of Law"
description = "Faculty Courses Centers For Students All Areas of Study A Giant in Tax Law For nearly 70 years, NYU School of Law has set the pace in tax law, boasting a"
full_description = "Daniel Shaviro is the author of Fixing US International Taxation and Decoding the US Corporate Tax. Lily Batchelder is the Robert C. Kopple Family Professor of Law and an affiliated professor at the NYU Wagner School of Public Service. David Kamin '09 is an expert on the federal budget. Faculty Courses Centers For Students All Areas of Study A Giant in Tax Law For nearly 70 years, NYU School of Law has set the pace in tax law, boasting a widely revered graduate tax program and offering more tax courses than any other school. The Law School’s extensive tax faculty has scholarly interests ranging from partnership transactions to tax policy to transfer pricing planning and disputes. The tax program also hosts adjunct professors, many of whom practice with New York City’s top firms, as well as Global Visiting Professors, rounding out an impressive roster of faculty. Keeping pace with the ever-growing global economy is essential, and the diverse courses and lectures at the Law School, along with frequent tax-related events, ensure that students stay informed. The annual Tillinghast Lecture on International Taxation and the NYU/KPMG Lecture on Current Issues in Taxation, for example, invite scholars and practitioners from around the world to engage with students in different forums. Tax law degree programs include the JD/LLM in Taxation Program, LLM Full-Time or LLM Part-Time, Executive LLM Program, MSL in Taxation, and the International Taxation Program—providing a range of options for JD students, practicing lawyers, and non-lawyers to explore the technical intricacies and policy implications of the tax law. Read the memo to NYU Law 1L students from the Tax area group. Daniel Shaviro is the author of Fixing US International Taxation and Decoding the US Corporate Tax. Lily Batchelder is the Robert C. Kopple Family Professor of Law and an affiliated professor at the NYU Wagner School of Public Service. David Kamin '09 is an expert on the federal budget."
