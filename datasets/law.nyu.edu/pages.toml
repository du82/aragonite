["https://law.nyu.edu/events/displacement-beyond-borders-legal-protections-climate-refugees-migrants-burning-planet"]
title = "Displacement Beyond Borders: Legal Protections for Climate Refugees & Migrants on a Burning Planet | NYU School of Law"
description = "Co-Hosted by the International Refugee Assistance Project at NYU Law, Environmental Law Society, and Law Students for Human RightsWhat is the state of climate refugee-hood and migration in 2025? This panel will bring together expert speakers and practitioners to provide an outlook on how international law has evolved to protect climate refugees and where it still fails to do so – as well as what promising approaches there are for bolstering these protections. It will also consider the greatest challenges to establishing comprehensive protections for climate refugees and migrants in a world where climate change impacts are rapidly accelerating, countries are failing to meet their climate goals, and there is a surge in right-wing nativist and xenophobic politics across the Global North. It will also practically address how law students can get involved through their studies and careers in advancing protections for people displaced by climate change, by taking action from the local to the national and international levels."
full_description = "NYU Law Events Wednesday, March 5, 2025 Displacement Beyond Borders: Legal Protections for Climate Refugees & Migrants on a Burning Planet 7:00–8:15 p.m. Vanderbilt Hall, Smart Classroom 204 40 Washington Square South NY ,10012 (view map) Add to Google Calendar Co-Hosted by the International Refugee Assistance Project at NYU Law, Environmental Law Society, and Law Students for Human RightsWhat is the state of climate refugee-hood and migration in 2025? This panel will bring together expert speakers and practitioners to provide an outlook on how international law has evolved to protect climate refugees and where it still fails to do so – as well as what promising approaches there are for bolstering these protections. It will also consider the greatest challenges to establishing comprehensive protections for climate refugees and migrants in a world where climate change impacts are rapidly accelerating, countries are failing to meet their climate goals, and there is a surge in right-wing nativist and xenophobic politics across the Global North. It will also practically address how law students can get involved through their studies and careers in advancing protections for people displaced by climate change, by taking action from the local to the national and international levels. CLE Credit Available: No Event Contact(s): Corina Kramer , ck3895@nyu.edu"
