ons in Indonesia during a post-college fellowship. She wanted to study law so she could help more people but was unsure… Sateesh Nori ’01 on what he learned advocating for NYC tenants Even when Sateesh Nori ’01 was a law student, he wasn’t sure he ultimately wanted to practice law. He was debating whether to get a teaching certificate instead of taking the bar exam when he saw a posting for a job at the Legal Aid Society… Emily Loeb ’09 draws on DOJ experience to lead Jenner & Block’s congressional investigations practice When Emily Loeb ’09 was a new lawyer in the Civil Rights Division of the US Department of Justice (DOJ), she received advice from a mentor that has shaped her career, she says: Evaluate potential career moves not as steps to a goal, but based on the… Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Next page ›› Last page Last »"
