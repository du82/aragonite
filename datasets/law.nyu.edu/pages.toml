title = "Race and Inequality Colloquium | NYU School of Law"
description = "Professor Deborah N. Archer Professor Vincent M. Southerland Spring 2025 Thursdays - 2:35pm - 4:35pm LAW-LW.10540.001"
full_description = "Professor Deborah N. Archer Professor Vincent M. Southerland Spring 2025 Thursdays - 2:35pm - 4:35pm LAW-LW.10540.001 2 Credits The Race and Inequality Colloquium will explore the role the law plays in the oppression of people of color in America, serving as a driver of racial discrimination and inequality. But the law also has a powerful potential to overcome racial inequality. Much of our nation’s history can be understood through this lens. As America continues to wrestle with structural racism and its impacts, understanding the potential and the limitations of the law as a tool for racial justice remains one of the most critical and urgent questions facing our country. Each week, students in the Colloquium will have the opportunity to engage with the work of leading scholars and advocates working in the field of racial justice. The Colloquium invites racial justice scholars to discuss their works-in-progress and advocates to discuss current campaigns. February 6, 2025 José Argueta Funes, UC Berkley Law <!--td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}--> Origin Stories in Property Law February 27, 2025 Olatunde Johnson, Columbia Law School Equal Protection and Structural Race Draft is available upon request. Please contact Deborah Archer at deborah.archer@nyu.edu. March 13, 2025 Allegra McLeod, Georgetown Law Abolition & Environmental Justice April 10, 2025 Guy-Uriel Charles, Harvard Law School TBA Questions? Please contact Damaris Marrero at damaris.marrero@nyu.edu or call 212-998-6473."
