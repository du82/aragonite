["https://law.nyu.edu/centers/zimroth"]
title = "Zimroth Center | NYU School of Law"
full_description = '''Peter Zimroth Faculty Director Rachel Barkow About the Center The Center's mission is to promote good government practices in criminal matters, with a special focus on the exercise of prosecutorial power and discretion. It pursues this mission through a mix of academic and public policy research, and litigation advocacy. The academic and public policy components analyze good criminal justice practices at all levels of government, produces scholarship and policy reports on criminal justice issues, and hosts symposia and conferences to address significant topics in criminal law and procedure and enhance the public dialogue on criminal justice matters. The litigation component uses the center’s research and experience with criminal justice practices to inform courts in important criminal justice matters, particularly in cases in which exercises of prosecutorial discretion create significant legal issues. Research & Scholarship Read our research on using executive clemency to mitigate the spread of COVID-19 in correctional facilities. Read "Disrupting the Cycle: Reimagining the Prosecutor's Role in Reentry." Read "Establishing Conviction Integrity Programs in Prosecutors' Offices,"'''
