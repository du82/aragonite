["https://www.law.nyu.edu/housing"]
title = "Housing | NYU School of Law"
description = "window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'UA-129311788-1');"
full_description = "window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'UA-129311788-1'); Many JDs and LLMs—and some faculty—live just a few steps from classes in NYU Law’s on-campus accommodations. D'Agostino Hall and Hayden Hall, our two high-rise apartment-style residence halls, offer students a variety of living arrangements. The majority of students have their own private rooms in shared two- or three-bedroom apartments. Studio and one-bedroom apartments are also options. Family housing accommodations are available, but in limited quantity. Great Locations D’Agostino Hall is located across from the Law School, and Hayden Hall is a short three-block walk to class. Around-the-Clock Staff and Services Both high-rise buildings have 24-hour front desk staff and services (announcement of guests, help with lockouts, etc.), and maintenance staff. State-of-the-Art Communications In the high-rise buildings, rooms feature high-speed wireless internet, cable television, and telephone systems with voicemail and call waiting. Utilities and Furnishings Rates include all utilities (heat, air conditioning, electricity, water, and gas). All apartments are furnished. Other Amenities Study rooms Laundry rooms Computer labs Business centers Terraces and lounges Bike storage (Hayden Hall exterior courtyard lottery) Common recreation rooms (pool table, dart board, foos-ball, ping-pong table and piano room) Energy Star-rated appliances and support other green initiatives, such as mixed recycling and composting Are Your Looking For? Work Requests Housing Applications and Forms Emergency and Fire Safety FAQ"
