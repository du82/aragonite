["http://www.law.nyu.edu/jdadmissions/dualdegreeprograms"]
title = "Dual Degree Programs | NYU School of Law"
description = "New York University School of Law offers a number of dual degree programs with other graduate schools at the University. This unique opportunity enables students to complete a JD and earn a Master’s degree in four years, or complete the JD in five semesters while pursuing a PhD. Students may not complete the joint degree in fewer than seven full time semesters. Of those seven semesters students must be in residence at the law school for a minimum of five semesters. No credits taken prior to matriculation at NYU School of Law can be counted towards the JD degree."
full_description = "New York University School of Law offers a number of dual degree programs with other graduate schools at the University. This unique opportunity enables students to complete a JD and earn a Master’s degree in four years, or complete the JD in five semesters while pursuing a PhD. Students may not complete the joint degree in fewer than seven full time semesters. Of those seven semesters students must be in residence at the law school for a minimum of five semesters. No credits taken prior to matriculation at NYU School of Law can be counted towards the JD degree. Applications may be made simultaneously to both schools or a student may apply to the second school until their third semester at either school. Admission to one degree program does not depend upon nor guarantee admission to the second degree program; all admissions decisions are made independently. Candidates must familiarize themselves with admissions policies and follow all application procedures for each individual school or program. Dual Degrees JD/LLM in International Law JD/LLM in Taxation JD/MA or PhD JD/MBA JD/MPA or JD/MUP JD/MSW Harvard University Princeton University"
