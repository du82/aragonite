["https://law.nyu.edu/centers/pollackcenterlawbusiness"]
title = "Pollack Center for Law & Business | NYU School of Law"
full_description = "Professor Stephen Choi co-directs the Pollack Center. > Read about our leadership The center hosts luncheons, seminars, and conferences featuring top academics and practitioners. > See the calendar The center supports student and graduate fellows. > Read more Co-director David Yermack comments at the 2014 NYU Law/Penn Conference on Law & Finance. > More on our events Over the summer, students can apply to the APCLB Program to gain graduate-level business school training. > Read more The Pollack Center for Law & Business is a unique shared venture between the New York University School of Law and the Leonard N. Stern School of Business. The center is designed to enrich the professional education of students of law and business and to facilitate joint teaching in order to involve leaders in banking, business, and law in the intellectual life of the University. The center does this through sponsorship of meetings, conferences, and dinners. The center’s founding director is William Allen, who, before joining the faculties of both the law school and the business school in the fall of 1997, served as Chancellor of the Delaware Court of Chancery (a court most often referred to as “the Supreme Court of corporate law”). Chancellor Allen chose NYU Law because, as he explained, “New York is the nation’s financial and legal center, and NYU is becoming a preeminent center for scholarship and teaching in those areas.” The center is currently directed by Stephen Choi, Murray and Kathleen Bring Professor of Law at the NYU School of Law, and David Yermack, Albert Fingerhut Professor of Finance and Business Transformation at the NYU Stern School of Business. Professors Choi and Yermack have continued the rich programming offered by the Pollack Center and have expanded the center’s mission to include academic research, data acquisition, and data hosting. Their research focuses on SEC regulation and corporate governance. David Yermack photo © Greg Benson Securities Enforcement Empirical Database (SEED) The Securities Enforcement Empirical Database (SEED) tracks and records information for SEC enforcement actions filed against public companies. Certificate Program in Law & Business (ACLB) The ACLB Program gives law students the tools they need to understand business structures in order to better process corporate transactions. Read about this unique opportunity. Upcoming Events Corporate Governance Luncheon Law & Finance Seminar Series Law & Business Calendar NYU/Penn Conference"
