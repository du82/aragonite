description = "One-Year, Low-Residency Programs Master of Science in Cybersecurity Risk and Strategy Offered jointly by NYU Law and NYU Tandon School of Engineering, the MS in Cybersecurity Risk and Strategy Program is for experienced professionals seeking to deepen their understanding of cybersecurity risk and strategy.  Format: Hybrid (on campus and online)"
full_description = "One-Year, Low-Residency Programs Master of Science in Cybersecurity Risk and Strategy Offered jointly by NYU Law and NYU Tandon School of Engineering, the MS in Cybersecurity Risk and Strategy Program is for experienced professionals seeking to deepen their understanding of cybersecurity risk and strategy. Format: Hybrid (on campus and online) Master of Science in Health Law and Strategy Offered jointly by NYU Law and NYU Wagner Graduate School of Public Service, the Master of Science in Health Law and Strategy is for experienced professionals from health-related fields looking to enhance their ability to make strategic decisions for their organizations. Format: Hybrid (on campus and online) Other Programs The Master of Studies in Law (MSL) in Taxation is an entirely online, part-time degree program for accountants and financial professionals. It is specifically designed to enhance the intellectual and professional toolkit of those who advise on the tax aspects of sophisticated business transactions. Format: Online. Institute for Executive Education NYU Law’s Institute for Executive Education creates legal programs for organizations and individuals at the intersection of business, policy, and strategy. Our courses empower professionals, giving them fluency across disciplines and a deeper context for decision making. Format: On campus or online."
