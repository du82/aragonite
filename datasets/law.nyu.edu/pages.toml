["https://law.nyu.edu/events/nyu-law-forum-department-justice-then-and-now"]
title = "NYU Law Forum—The Department of Justice Then and Now | NYU School of Law"
description = "RSVP HerePresidents have long pursued policy prerogatives through the Department of Justice, but traditionally there’s been a clear dividing line between those and DOJ enforcement decisions. At this Forum, experts who have served in senior positions in the White House and DOJ will assess the degree to which that has now changed. Among the topics they’ll discuss: What is the origin of and reason for DOJ’s measure of independence? How has this worked as a practical matter given the department’s mix of political and career employees, and how is the current administration observing those lines? What lessons should we draw from the case against Mayor Eric Adams? And what can other institutional actors, including judges and legislators, do in response to the unfolding developments?Co-hosted by the Reiss Center on Law and Security, NYU LawPanelistsVanita Gupta ’01, Distinguished Scholar in Residence, NYU Law; Associate Attorney General of the US, 2021-24Lisa Monaco, Distinguished Scholar in Residence, Reiss Center on Law and Security, NYU Law; Deputy Attorney General of the US, 2021-25Breon Peace ’96, US Attorney, Eastern District of New York, 2021-25ModeratorTrevor Morrison, Dean Emeritus, Eric M. and Laurie B. Roth Professor of Law, and Faculty Co-Director, Reiss Center on Law and Security, NYU Law; Associate White House Counsel, 2009"
full_description = "NYU Law Events Wednesday, March 5, 2025 NYU Law Forum—The Department of Justice Then and Now 1:10–2:25 p.m. Vanderbilt Hall, Greenberg Lounge 40 Washington Square South New York, NY ,10012 (view map) Add to Google Calendar RSVP HerePresidents have long pursued policy prerogatives through the Department of Justice, but traditionally there’s been a clear dividing line between those and DOJ enforcement decisions. At this Forum, experts who have served in senior positions in the White House and DOJ will assess the degree to which that has now changed. Among the topics they’ll discuss: What is the origin of and reason for DOJ’s measure of independence? How has this worked as a practical matter given the department’s mix of political and career employees, and how is the current administration observing those lines? What lessons should we draw from the case against Mayor Eric Adams? And what can other institutional actors, including judges and legislators, do in response to the unfolding developments?Co-hosted by the Reiss Center on Law and Security, NYU LawPanelistsVanita Gupta ’01, Distinguished Scholar in Residence, NYU Law; Associate Attorney General of the US, 2021-24Lisa Monaco, Distinguished Scholar in Residence, Reiss Center on Law and Security, NYU Law; Deputy Attorney General of the US, 2021-25Breon Peace ’96, US Attorney, Eastern District of New York, 2021-25ModeratorTrevor Morrison, Dean Emeritus, Eric M. and Laurie B. Roth Professor of Law, and Faculty Co-Director, Reiss Center on Law and Security, NYU Law; Associate White House Counsel, 2009 CLE Credit Available: No Event Contact(s): Ian Anderson , ian.anderson@nyu.edu"
year_published = 2025
