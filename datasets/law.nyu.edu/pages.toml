["https://law.nyu.edu/magazine"]
title = "Law School Magazine 2024 | NYU School of Law"
full_description = "THE 2024 ONLINE EDITION OF THE LAW SCHOOL’S ANNUAL MAGAZINE (VOLUME XXXIV) The McKenzie Memo News in Brief Ideas People The Conversation Celebrations Closing Statements ALL ISSUES The McKenzie Memo Dean Troy McKenzie ’00 offers his perspective on this issue, noting that innovation and impact remain central to the Law School's mission. News in Brief Talia Scott ’25 wins a David Prize, Inez Milholland (1912) appears on Broadway, and the Deans’ Cup returns to NYU Law. Cool Head in the Capitol Hakeem Jeffries ’97 talks with Dean Troy McKenzie ’00 about meeting the challenges facing American democracy. Broader Horizons With new courses, novel strategies, and a wider reach, NYU Law’s clinical education program continues to innovate. Barrister Without Borders Amal Clooney LLM ’01, one of the world’s leading human rights litigators, discovered her passion at NYU Law. Lex Machina Can law regulate artificial intelligence? Should it? Faculty members tackle questions raised by the AI revolution. The Conversation On campus and online, the Law School hosted a wide spectrum of discussions probing today’s most pressing issues. Closing Statements A Q&A with former hoops star Jamila Wideman ’03, senior VP of player development at the NBA. People AnBryce Turns 25 A gala evening celebrated the impact of the trailblazing scholarship program founded by Beatrice Welters and Anthony Welters ’77. DOJ at PCCE Anniversary As the Program on Corporate Compliance and Enforcement turned 10, the Justice Department unveiled a new initiative. Family Defender Founded by David Shalleck-Klein ’16, the Family Justice Law Center takes on New York City's Administration for Children's Services. Winning Peace and Compensation Emily Stephens Naphtal ’15 opened her own firm to fight for clients who have experienced workplace harassment or discrimination. Service at Sea Annie Vodhanel Preis ’13 didn't expect to find a career in the Navy Judge Advocate General’s Corps. But she’s glad she did. In Memoriam: Wayne Hannah Dentons partner Wayne Hannah Jr. ’57 was an NYU Law life trustee and a strong supporter of the Root-Tilden-Kern Program. Revesz at the White House Dean Emeritus Richard Revesz has played a key role in the Biden administration's push to modernize regulatory review. Celebrating Entrepreneurs NYU Law's Entrepreneurship & Venture Capital Program rolled out its new name by showcasing three alumni company founders. Dealmaker As the M&A deals get bigger, the stress mounts. Paul, Weiss partner Laura Turano ’11, LLM ’12 keeps her cool. An Advocate for LGBTQ Rights A senior staff attorney with the ACLU's LGBTQ & HIV Project, Li Nowlin-Sohl ’11 tells how a recent victory changed a client's life. In Memoriam: Paul Chevigny Through trial work and extensive scholarship, Paul Chevigny cast a spotlight on abuses of police power. In Memoriam: Carol Robles-Román The career of Carol Robles-Román ’89 spanned government service, higher education, judicial matters, and civil rights. For a Just Environment The new Environmental Justice Laboratory targets the intersection of environmental harm and racial inequality. New Approaches to Public Safety The city of Minneapolis turns to the Policing Project to evaluate its alternatives to traditional policy. Environmental Advocate Kate Sinding Daly ’97 focuses on empowering communities affected by environmental harms. Helping Things Take Flight Sean Burton ’97 balances his work in real estate development with a role overseeing Washington, DC's airports. In Memoriam: Holly Maguigan Holly Maguigan's study of the criminal trials of battered women transformed the understanding of family violence. In Memoriam: Warren Sinsheimer After a career in law and business, Warren Sinsheimer LLM ’57 founded the Partnership for Children’s Rights. Newly Aboard Angela Libby ’11, Steven Steinman ’93, and Jennifer Wu ’04 became the newest members of NYU Law's Board of Trustees. Policing Project to Public Service As part of a Justice Department trial team, Sonny Onyekweli ’16 helped secure a major victory for Florida children with disabilities. Judge to DOJ For Helena Heath ’87, her passion for social justice advocacy began in second grade. On the Leading Edge A chance encounter brought Zelma Acosta-Rubio MCJ ’89 to NYU Law and shaped the rest of her career. In Memoriam: Richard Stewart A preeminent scholar of administrative law, Richard Stewart also held leading public interest roles in environmental law. In Memoriam Remembering NYU Law community members who passed away during the last academic year. Ideas Better Living Through Bankruptcy Michael Ohlrogge uses empirical data to demonstrate how bankruptcy law can help address environmental harms. Checks and Balances Daniel Harawa argues for considering race in Fourth Amendment search-and-seizure cases. Justice in Theory and Practice Sophia Moreau brings together law and philosophy to counter systemic discrimination. Organizing Principles Samuel Estreicher and Jack Samuel ’23 argue that century-old federal labor laws give gig workers the right to unionize. Catching Spills Kevin Davis and Florencia Marotta-Wurgler ’01 examine the ripple effects of rigorous EU privacy laws. An Eye on Private Equity Gregg Polsky champions fairer approaches to taxing the compensation taken by private equity firms. Antisemitism, Jewish Identity, Law Deborah Malamud’s seminar explores issues deeply rooted in history and her scholarship. Practicing Change A prolific scholar and award-winning teacher, Devon Carbado explores the intersection of law, race, and inequality. Ready for Class Patrice Wylly ’15, LLM ’18 brings her passion for tax and teaching back to NYU Law. Out of Fashion Clayton Gillette looks to the history of the Garment District to assess the impact of remote work on cities. Fighting for Families Christine Gottlieb ’97 leads the Family Defense Clinic as its impact grows wider. Celebrations Bonding at Scholarship Reception At the annual Scholarship Reception, NYU Law student scholars met with the donors who support their studies. Advancing Gender Justice NYU Law Women honored Sandra Park ’02 with the group's Alumna of the Year award. Scholars & Donors Graduating scholars had a warm sendoff from the donors who supported their law school journey. Weinfeld Gala Honors Alfred Engelberg ’65 This year's Weinfeld Award recognized a pioneering intellectual property lawyer and entrepreneur. Purpose and Service The annual Spring Dinner of the Law Alumni of Color Association brings together hundreds of alumni, faculty, students, and prospective students. Family Tradition Many new graduates shared the excitement of Convocation with family members who are also NYU Law alumni. Reminiscing at Reunion NYU Law welcomed alumni back to campus with a lively weekend of social events and topical discussions. Advocating for Intersex Youth Shana Knizhnik ’15 received OUTLaw's 2024 Alum of the Year award. New Coif Members At the Order of the Coif's annual ceremony, Judge Raymond Lohier ’91 was the honorary inductee. NYU Law Convocation 2024 Faculty, family members, and friends proudly greeted the Law School's newest alumni. Please send your comments to law.magazine@nyu.edu. | See the magazine masthead."
