["https://www.law.nyu.edu/jdapplicants/transfersandnonmatriculants"]
title = "Transfer and Nonmatriculant (Third-Year Visitor) Admissions Information | NYU School of Law"
description = "Transfer Admission The application filing deadline for transfer applicants is June 15 including all supporting materials. Transfer applicants are admitted for the fall term on a full-time basis only, must have completed first-year coursework by June 30 in order to be eligible to apply, and are not eligible to apply if more than five years have elapsed since they last attended law school."
full_description = "Transfer Admission The application filing deadline for transfer applicants is June 15 including all supporting materials. Transfer applicants are admitted for the fall term on a full-time basis only, must have completed first-year coursework by June 30 in order to be eligible to apply, and are not eligible to apply if more than five years have elapsed since they last attended law school. Applicants for transfer must have completed one full year of study (28-33 credits) and be in good standing at a law school that is a member of the Association of American Law Schools or is approved by the Section on Legal Education of the American Bar Association. Applicants whose law school credits fall outside of the 28-33 credit range must submit a statement explaining why they fall outside the range. Candidates who are currently enrolled in a part-time program who have not completed the entire year of law school by June 30 are not eligible to apply to transfer. A maximum of 30 credits will be applied toward the JD degree at NYU School of Law. Transfer Application and Deadlines The online application for fall 2025 will be available May 1. The application filing deadline for transfer applicants is June 15 including all supporting materials. Transfer Application Components Law School Transcript: Applicants must submit official transcripts, including grades for all first-year coursework. Incomplete transcripts or copies of transcripts received as part of the LSAC's Credential Assembly Service (CAS) will not meet this requirement. Official transcripts must be sent directly from the law school in which the applicant is currently enrolled. NOTE: We prefer electronic submission of all supporting documents including official law school transcripts, undergraduate transcripts and all Dean's certifications. Please have your academic institution send electronic documents to law.moreinfo@nyu.edu. If your academic institution is unable to submit the necessary paperwork electronically, they may mail them directly to: Office of JD Admissions, 139 MacDougal Street, New York, NY 10012. Undergraduate Transcript: An official transcript should be included from the school that granted the applicant's baccalaureate degree. Copies of transcripts received as part of the LSAC's Credential Assembly Service (CAS) will not meet this requirement. Official transcripts must be sent directly from the applicant's undergraduate school. Credential Assembly Service (CAS) Report: We must receive applicants' Credential Assembly Service (CAS) report directly from the Law School Admission Council (LSAC). LSAC provides its service to applicants for five years requiring a $45 per report fee to have the CAS report. (including undergraduate transcript(s) and LSAT score(s), if available) sent to NYU School of Law. For more information, please go to LSAC.org. NYU School of Law will not accept photocopies or faxes of score reports sent directly from the law school in which the applicant is currently enrolled. Standardized Test Scores: If an applicant has a valid LSAT score, the score(s) must be submitted. A writing sample is required for those applicants who submit a LSAT score. Valid LSAT scores and writing samples will be submitted as part of the CAS report. Applicants are required to submit GRE scores if they submitted GRE scores to the law school at which they completed their first year of law school. GRE scores must be sent to NYU Law directly from ETS. The law school code for NYU School of Law for both LSAC and ETS is 2599. Law School Certification: This form should be completed by the dean of students or administrative officer with access to official records at the law school the applicant attends. College Questionnaire: This form should be completed by the dean of students or administrative officer with access to official records at the undergraduate school from which the applicant received a baccalaureate degree. Recommendation: Two recommendations are required to complete your admissions application. At least one of the two letters must be written by a law professor at your current law school. The Committee on Admissions requires the use of the LSAC Letter of Recommendation (LOR) Service. Please do NOT submit duplicate letters directly to NYU School of Law. Personal Statement: Applicants should include a personal statement with their applications on a subject of their choice. The personal statement should be double spaced and no more than 500 words. Resume: Applicants are required to submit a resume. Checklist for a Complete Transfer Application Application Application Fee: $85 Official Law School Transcript Official Undergraduate Transcript LSAC Credential Assembly Service Report Standardized Test Score(s) Law School Certification College Questionnaire Two Letters of Recommendation, including at least one from a current law school professor. Personal Statement Resume Nonmatriculant (Third-Year Visitor) Admission Students who have completed two full years (approximately 55 credits) and need no more than 30 additional credits to complete requirements for graduation at other ABA approved law schools, may apply to NYU School of Law as nonmatriculated students. Applicants must also have permission from the law school that they are attending to enroll as nonmatriculants. Nonmatriculant (Third-Year Visitor) students may matriculate in either the fall and/or spring semester on a full-time basis only. Nonmatriculant (Third-Year Visitor) Application and Deadlines The online application for fall 2025 nonmatriculant admission will be available May 1. The application filing deadline for fall nonmatriculant applicants is June 15 including all supporting materials. The online application for spring 2026 nonmatriculant admission will be available September 1. The application filing deadline for spring nonmatriculant applicants is November 1. All supporting materials must be received by November 1. Nonmatriculant (Third-Year Visitor) Application Components Law School Transcript: Applicants must submit official transcripts, including grades for at least three semesters of coursework. In some cases, applicants will be asked to submit grades from their fourth semester's work before a final decision is reached. Official transcripts must be sent directly from the law school in which the applicant is currently enrolled. NOTE: We prefer electronic submission of all supporting documents including official law school transcripts and all Dean's certifications. Please have your academic institution send electronic documents to law.moreinfo@nyu.edu. If your academic institution is unable to submit the necessary paperwork electronically, they may mail them directly to: Office of JD Admissions, 139 MacDougal Street, New York, NY 10012. Law School Certification: This form, including permission to enroll at NYU School of Law, should be completed by the dean of students or administrative officer who has access to official student records at the law school from which the applicant will receive a JD degree. Personal Statement: Applicants should submit a statement addressing their reasons for wishing to attend NYU School of Law as a nonmatriculant (third-year visitor).The personal statement should be double spaced and no more than 500 words. Resume: Applicants are required to submit a resume. Checklist for a Complete Nonmatriculant (Third-Year Visitor)Application Application Application Fee: $85 Official Law School Transcript Law School Certification Personal Statement Resume Note for Foreign-Educated LLM Students: Foreign attorneys, including foreign attorneys who are LLM students at ABA-approved law schools and/or foreign attorneys who hold LLM degrees from ABA-approved law schools, may not transfer into nor gain any advanced standing in NYU School of Law's JD program. If interested in JD study at NYU School of Law, they must apply to and, if admitted, enroll in and complete the full three-year JD program. Foreign-educated LLM students who are currently matriculated at NYU School of Law may apply to the JD program and receive advanced standing. Interested students must take either the Law School Admissions Test (LSAT) or the GRE by January and apply as entering first-year JDs by February 15. NYU LLM students who are admitted as entering JDs will receive a year of advanced standing credits at the successful completion of their first year. LLM students who are interested in applying for advanced standing are required to meet with a member of the Office of Career Services for further understanding of how advanced standing will affect their job search. Note for applicants in the European Union: Please see Data Privacy Notice for Prospective Students in the E.U. NONDISCRIMINATION POLICY New York University does not discriminate on the basis of race, creed, color, religion, sex, sexual orientation, gender and/or gender identity or expression, marital or parental status, pregnancy, national origin, ethnicity, shared ancestry or ethnic characteristic, citizenship status, veteran or military status, age, disability, genetic information or any other legally protected basis in its programs and activities. The following person has been designated to handle inquiries regarding the University’s non-discrimination policies: Mary Signor Title IX Coordinator and Assistant Vice President, Office of Equal Opportunity 665 Broadway, 12th Floor New York, NY 10003 She may be contacted via telephone at 212.998.2352. The information, policies, and academic and scholarship programs described in this publication may be subject to change."
