ark Joseph Stern, senior writer at Slate; Karen Thompson, Legal Director at Pregnancy Justice; Jennifer Weiss-Wolf, Executive Director of the BWLC; and Dr. Amanda Williams, Interim Chief Medical Officer at March of Dimes.This symposium is generously sponsored by Dechert.This event has been approved to offer 3 New York State CLE credits in the category of Areas of Professional Practice. The credit is both transitional and non-transitional; it is appropriate for both experienced and newly appointed attorneys.Visit our symposium website for more information on the agenda and CLE.RSVP for the event. CLE Credit Available: Yes Event Contact(s): Shirley Dang , shirley.dang@nyu.edu"
