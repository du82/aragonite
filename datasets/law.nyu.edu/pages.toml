["https://law.nyu.edu/areasofstudy/law-security"]
title = "Law and Security | NYU School of Law"
description = "Faculty Courses Centers For Students All Areas of Study Managing a Complex World NYU Law is at the forefront of law and security issues, with two cutting-edge centers a"
full_description = "Ryan Goodman is a faculty director of the Reiss Center on Law and Security. Margaret Satterthwaite is the faculty director of the Robert and Helen Bernstein Institute for Human Rights. Richard Pildes is one of the nation’s leading scholars of constitutional law and a specialist in legal issues affecting democracy. David Golove specializes in the constitutional law of foreign affairs. Faculty Courses Centers For Students All Areas of Study Managing a Complex World NYU Law is at the forefront of law and security issues, with two cutting-edge centers and leading experts specializing in issues vital to global security. The Reiss Center on Law and Security is a non-partisan multidisciplinary research institute founded in 2003 at NYU School of Law. It is focused on cultivating an informed dialogue, educating the next generation of leaders, and fostering groundbreaking research on the vital legal, policy, and strategic questions that will shape the national security field for years to come. The Reiss Center studies national security law and practice against the backdrop of an era defined by significant change—from geopolitical developments to rapid technological advances—as well as enduring challenges. Its program areas include Domestic Law, Policy and Process; Use of Force and Emerging Security Threats; and National Security in a Shifting Geopolitical Context. The NYU Center for Cybersecurity, a collaboration between the Law School and NYU Tandon School of Engineering, addresses questions at the meeting point of security and technology: How should the government and private parties interact when it comes to cybersecurity? What kind of legal and technical framework will enable companies to shore up their digital defenses? And what is the appropriate level of risk management for private companies? The two schools have achieved national leadership in the development of interdisciplinary research, teaching, and public outreach to address these vexing questions. They created classes that are cross-listed in the schools of engineering and law, and established a one-year Master of Science in Cybersecurity Risk and Strategy Program for professionals who seek to deepen their understanding of cybersecurity risk and strategy."
year_published = 2025
clearnet = "https://law.nyu.edu/areasofstudy/law-security"
