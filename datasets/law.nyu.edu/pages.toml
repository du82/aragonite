ruary 24, 12:40–2:00 P.M. Jacob Goldin, Stanford University Preference Identification Under Inconsistent Choice / Which Way to Nudge? Uncovering Preferences in a Behavioral Age Location: Room 208, Vanderbilt Hall, 40 Washington Square South Wednesday, March 23, 12:40–2:00 P.M. Ben Handel, UC Berkeley Decision-Making in Insurance Markets: Consumer Choice Frictions and Market Design, based on the following papers: Benjamin R. Handel and Jonathan T. Kolstad, Health Insurance for \"Humans\": Information Frictions, Plan Choice, and Consumer Welfare. Benjamin R. Handel, Adverse Selection and Inertia in Health Insurance Markets: When Nudging Hurts. Benjamin R. Handel, Jonathan T. Kolstad, and Johannes Spinnewijn, Information Frictions and Adverse Selection: Policy Interventions in Health Insurance Markets. Benjamin R. Handel and Jonathan T. Kolstad, Getting the Most from Marketplaces: Smart Policies on Health Insurance Choice.​ Location: Room 208, Vanderbilt Hall, 40 Washington Square South WEDNESDAY, April 20, 12:40–2:00 P.M. Frank Schilbach, MIT Alcohol and Self-Control: A Field Experiement in India Location:Room 208, Vanderbilt Hall, 40 Washington Square South Fall 2015 September 11, 12:35–1:55 p.m. Cass Sunstein, Harvard Law School “Does Active Choosing Promote Green Energy Use? Experimental Evidence” Location: Room 405, Vanderbilt Hall, 40 Washington Square South September 23, 12:40–2:00 p.m. Sendhil Mullainathan, Harvard University Human and Machine Intelligence, talk based in part on Prediction Policy Problems. Location: Room 202, Vanderbilt Hall, 40 Washington Square South December 2, 12:40–2:00 p.m. Andrei Shleifer, Harvard University Stereotypes Location: Room 216, Vanderbilt Hall, 40 Washington Square South"
