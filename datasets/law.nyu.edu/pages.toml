full_description = "Overview Founded: 1835 in New York City Dean: Troy McKenzie '00 Academic Year Calendar: Semester Degree Programs Offered: JD, LLM, JSD JD Student Body: 1,370 full-time day students (no part-time or evening) Centers and Institutes: 30+ Clinics: 40+ Student-run Publications: 10 Student Organizations: 80+ Fall 2024 Entering JD Class Profile* 436 full-time day students (no part-time or evening) LSAT Score: 75th percentile: 173 50th percentile: 172 25th percentile: 169 Undergraduate GPA: 75th percentile: 3.96 50th percentile: 3.91 25th percentile: 3.80 Who They Are: 100+ colleges represented 32 states including DC 59 percent women 44 percent students of color 72 percent out of college one to four years 8 percent out of college five or more years 7 percent hold advanced or professional degrees Beyond the Numbers The admissions process is highly selective and seeks to enroll candidates of exceptional ability. The Committee on Admissions makes decisions after considering all the information in an application. There are no combination of grades and scores that assure admission or denial. Please see our Standards for Admission for a more complete understanding of the review process. *NYU Law JD Admissions office complied with the requirements of the Supreme Court’s Students for Fair Admissions, Inc v. President and Fellows of Harvard College decision. Individual race and ethnicity data was suppressed from all applicant materials reviewed by the Committee on Admissions during the application review and selection process. The statistical make-up of the enrolling class was tabulated after all admissions decisions were finalized and post JD Orientation. Class of 2023 Employment 64.80% Law Firms 32.64% Public Interest/Government/Judicial Clerkships 2.33% Corporate/Academic About 20% of each graduating class eventually clerks. Median Salaries $215,000 Median Law Firm Salary $215,000 Median Overall Salary See Employment Data for Recent Graduates. Public Service The Law School's Loan Repayment Assistance Program eases the burden of debt repayment obligations for those choosing careers in public service. More than 500 JD graduates in public service now have their debt burden paid in full or in part by NYU Law. In 2023, 394 students received Public Interest summer funding grants to work in 12 countries. Dual Degrees JD/LLM in International Law JD/LLM in Taxation JD/MA or PhD in Economics, History, Philosophy, or Politics JD/MA in French Studies JD/MA in Latin American and Caribbean Studies JD/MBA JD/MPA or JD/MUP JD/MSW Harvard University Princeton University For more information, see the ABA Standard 509 Information Report (PDF: 356 KB)"
