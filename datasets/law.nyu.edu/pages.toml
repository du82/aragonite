["https://law.nyu.edu/centers/chrgj-center-for-human-rights-global-justice"]
title = "The Center of Human Rights and Global Justice - NYU"
description = "Empowering communities, advocating for justice, and driving change worldwide. Join us in our mission for human rights, environmental protection, and social equity."
full_description = "promoting innovative ideas and practices. The Center for Human Rights and Global Justice is a leading action-research hub that contributes to the global human rights project through scholarship, education, field building, advocacy, and legal practice. Across a wide range of issue areas and projects, we collaborate closely with partners from diverse geographies and disciplines on the new ideas, practices, and strategies that are needed to address existential challenges to human rights and global justice. Learn More reimagining human rights for the twenty-first century. We nurture ideas, actions, and connections that promote rights-based solutions to ecological emergencies, technological disruptions, deepening inequalities, threats to democracy and peace, and other urgent challenges to global governance and justice. We pursue initiatives that expand and catalyze the collective capacity of the human rights field. We deepen collaborations among communities of thought and practice from around the world, train future human rights thinkers and doers, and disseminate promising approaches to global justice research and advocacy. Climate & environment ▸ Future of human rights & governance ▸ Human rights movement ▸ Prevention & conflict ▸ Inequalities ▸ Technology & human rights ▸ staying current. Events MOTH Festival of Ideas & FORGE Gathering at NYU Law A dynamic week of interdisciplinary exploration, innovation, and collaboration. The Center will host a weeklong series of events through the More-Than-Human Life (MOTH) Festival of Ideas 2025 and the Future of Human Rights and Governance (FORGE) Gathering 2025, bringing together global thought leaders, advocates, and scholars to explore the most pressing issues of our time, like climate change and biodiversity loss. Taking place at NYU Law, this dynamic week of innovation, and collaboration will run from March 10 to March 15, 2025. Hosted by the Earth Rights Action and Research (TERRA) and the FORGE programs, both gatherings include closed-door, interactive scholar-practitioner sessions, as well as sessions open to the public in the evenings. March 10-15, 2025 Highlights César Rodríguez-Garavito awarded Future Observatory Fellowship Climate & Environment César Rodríguez-Garavito is one of four pioneering researchers awarded a Future Observatory Fellowship for his work on More-Than-Human-Rights to explore the intersection of design and the natural world. The work will be featured in a major exhibition at the Design Museum, opening June 2025, highlighting cutting-edge installations. Read story Highlights Racial justice, climate justice, and reparations: Haiti as an exemplary case Climate & Environment Movements for climate justice and movements for reparations for colonial harms can reinforce each other. Haiti’s climate vulnerability speaks to these connections. Written by Sienna Merope-Synge for Open Global Rights. Read article Highlights Pablo de Greiff briefs UN Security Council on Ukraine Prevention & Conflict Pablo de Greiff, Commissioner of the Independent International Commission of Inquiry on Ukraine, addressed the United Nations Security Council during an Arria Formula meeting. Watch briefing learn, connect, or contribute. Explore our platform to find resources, stay informed about events, connect with like-minded individuals and organizations, and discover how you can play a role in shaping the future of human rights and global justice. TERRA Program & Clinic ▸ Global Justice Clinic GJC ▸ Get involved ▸ Students ▸ Events ▸ Opportunities board ▸"
