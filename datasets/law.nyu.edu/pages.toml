["https://law.nyu.edu/centers/laweconomics"]
title = "Center for Law, Economics, and Organization | NYU School of Law"
full_description = "Jennifer Arlen is a faculty co-director of the center. Florencia Marotta-Wurgler is a faculty co-director of the center. John Ferejohn is an academic adviser to the center. Marcel Kahan is an academic adviser to the center. The Center for Law, Economics and Organization promotes interdisciplinary research and teaching in law and economics. It showcases the Law School's faculty, research, colloquia and course offerings, and fellowship programs in law and economics. The center is co-directed by Jennifer Arlen '86, Norma Z. Paige Professor of Law, and Florencia Marotta-Wurgler '01, Boxer Family Professor of Law. Professors Ryan Bubb, John Ferejohn, Marcel Kahan, Lewis Kornhauser, and Geoffrey Miller serve as academic advisers for the center. Program on Corporate Compliance and Enforcement The Program on Corporate Compliance and Enforcement promotes more effective corporate and white-collar enforcement and corporate compliance programs through research and meaningful engagement between the public and private sectors. Contact the Center Center on Law, Economics and Organization 40 Washington Square South, Room 41 New York, NY 10012 (212) 992-8821 Jennifer Arlen is a faculty co-director of the center. Florencia Marotta-Wurgler is a faculty co-director of the center. John Ferejohn is an academic adviser to the center. Marcel Kahan is an academic adviser to the center."
