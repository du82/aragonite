["https://law.nyu.edu/news/shalanda-young-distinguished-scholar-in-residence"]
title = "Former OMB director Shalanda Young joins NYU Law as distinguished scholar in residence | NYU School of Law"
description = "Shalanda Young, former director of the US Office of Management and Budget (OMB), has joined NYU Law as a distinguished scholar in residence, Dean Troy McKenzie ’00 announced on February 20. “We welcome her tremendous expertise and perspective on timely issues such as appropriations, impoundment of funds, the nation’s fiscal stability, and the current tax debate,” McKenzie said in an email to the NYU Law community."
full_description = "Shalanda Young, former director of the US Office of Management and Budget (OMB), has joined NYU Law as a distinguished scholar in residence, Dean Troy McKenzie ’00 announced on February 20. “We welcome her tremendous expertise and perspective on timely issues such as appropriations, impoundment of funds, the nation’s fiscal stability, and the current tax debate,” McKenzie said in an email to the NYU Law community. “She is eager to engage with students,” he added, noting that Young will be guest lecturing in a range of courses in the Spring semester. Shalanda Young As OMB director, Young served as a member of President Joe Biden’s cabinet and the National Security Council. She managed the federal government’s annual $7 trillion budget, including the development of Biden’s four budgets and their presentation before Congress each year. She was a lead negotiator for the Fiscal Responsibility Act of 2023, which averted a debt default and lifted the nation’s debt ceiling. Before joining OMB, Young spent nearly 15 years with the US House Committee on Appropriations, ultimately serving as staff director. In that role, she led the committee responsible for funding the federal government and setting spending priorities across a broad range of programs, including housing, food safety, border security, defense, and international aid. A Louisiana native, Young holds a BA from Loyola University New Orleans and an MHA from Tulane. She began her career in Washington as a Presidential Management Fellow at the National Institutes of Health. She is currently a Pritzker Fellow at the University of Chicago Institute of Politics. While at the Law School, Young will be affiliated with the Tax Law Center at NYU Law. Posted February 20, 2025 RELATED LINK “Shalanda Young discusses her role leading the Office of Management and Budget” NYU Law website 12/20/24"
year_published = 2025
