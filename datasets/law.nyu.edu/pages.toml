title = "Academic Careers Program | NYU School of Law"
description = "If you are considering a career in legal academia, there is no better place to prepare than at NYU Law. We have a long track record of successfully placing NYU Law alumni and affiliates in teaching positions in the United States and abroad."
full_description = "If you are considering a career in legal academia, there is no better place to prepare than at NYU Law. We have a long track record of successfully placing NYU Law alumni and affiliates in teaching positions in the United States and abroad. At NYU Law, you'll have outstanding professors, who will advise and mentor you. You'll have access to unparalleled resources, including one-on-one counseling, regular events, hands-on assistance for when you're on the market, and support from NYU Law alumni and former affiliates in legal teaching. Our annual Scholarship Clinic covers topics related to law teaching and our Job Camp gets you ready for the recruiting season. We offer extensive assistance to those on the law teaching market, including review of CVs and FAR Forms, an NYU Book of candidate CVs that is circulated to the hiring committees of American law schools, and information about hiring committees and hiring needs. Register for ACP ACP resources are available to NYU Law students, alumni and current affiliates (including Acting Assistant Professors and fellows). Registration Form If you have any questions, please contact law.academiccareers@nyu.edu. Job Outcomes NYU alumni and affiliates have successfully secured law teaching jobs around the country and abroad. Here's where they are teaching now: US Law Teaching Placements International Law Teaching Placements"
