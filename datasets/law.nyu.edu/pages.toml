["https://law.nyu.edu/global/contact-us"]
title = "Contact Us | NYU School of Law"
description = "If you need to know more about... JD Law Abroad & Exchange Programs and Language Instruction: law.globalstudents@nyu.edu  Moots and GlobaLex: law.global@nyu.edu"
full_description = "If you need to know more about... JD Law Abroad & Exchange Programs and Language Instruction: law.globalstudents@nyu.edu Moots and GlobaLex: law.global@nyu.edu Hauser Faculty, Fellows, or Scholars: law.global@nyu.edu LLM degree programs, academic advising, student life: law.graduateaffairs@nyu.edu Staff Biographies Colleen Johnson Associate Director for the Hauser Global Law School Program and Global Programs colleen.johnson@nyu.edu Colleen Johnson manages the administration of Global Faculty appointments and Distinguished Global Fellows visits and works closely with the Hauser team on matters related to the Global Fellows Program and Hauser Global Scholars. She coordinates events for Hauser and Graduate Affairs, oversees funding for international moot court competitions, and collaborates regularly on GlobaLex. She is a resource for Global Faculty, Fellows, and for our LLM students on academic matters, and acclimating to the Law School, University, and NYC. Colleen holds a BA in Psychology from the University of Illinois at Urbana-Champaign, an MS in Counseling and Student Development from Eastern Illinois University, and a certificate in Events and Convention Management from the NYU School of Professional Studies. She previously worked for the Office of Career Services, where she assisted with the coordination of on- and off-campus interview programs. Barbara Landress Senior Director of Graduate Affairs and Global Programs barbara.landress@nyu.edu Barbara oversees the Office of Graduate Affairs which provides academic services and student affairs programming to LLM and Exchange students, and collaborates on Law Abroad and other global programming. She advises students on course selection, bar eligibility requirements, opportunities for scholarly work, student life, and resources at the Law School and University. Barbara came to the Law School in 2009 from Hunter College of the City University of New York, where as Director of Pre-Law Programs she worked to enhance opportunities for undergraduate students interested in law and public policy. Earlier in her career, she served as a Trial Attorney with the Civil Rights Division of the US Department of Justice, and as a Law Clerk to Judge Norma L. Shapiro of the US District Court for the Eastern District of Pennsylvania. Barbara holds a doctoral degree in Hebrew and Comparative Literature, and has taught modern Hebrew literature in translation at NYU’s College of Arts and Science. She has translated a memoir and literary criticism to English, and is the author of Her Glory All Within (Academic Studies Press 2012) on Israeli and American literary feminism. José M. Machado Sikorski Assistant Director, Hauser Global Law School Program law.global@nyu.edu José Machado Sikorski assists with administration of the Global Faculty, Global Fellows, Distinguished Global Fellows, GlobaLex, and Hauser Scholars programs. He provides support for international visitors including visa application processes, welcoming and onboarding, trouble-shooting, and integration into the NYU Law academic community. José also plans and executes events, fields inquiries from prospective applicants, and performs day-to-day office duties. Prior to coming to NYU, José served as the Office Manager for Academic Programs for Excellence, an educational program serving under-represented students as well as Technology and Payroll Assistant at the University of Kansas, his alma mater. Outside of the office, he enjoys ballroom dancing, web development, and Japanese food. Becca Naylor-Sánchez Assistant Director, Graduate Affairs and Global Programs becca.naylor@nyu.edu Becca works closely with LLM students to provide academic advising and student affairs programming. She also oversees the inbound and outbound student exchange populations and supports NYU Law Abroad operations in Buenos Aires and Paris. Before joining the team, Becca received a BA in English Literature from the University of Arizona and an MA in International Education from NYU. She previously served as an Assistant Director at the University of Arizona where she oversaw the development and implementation of an online campus for international students and worked with more than a dozen dual degree partnerships. Prior to this, she worked as an academic advisor at the NYU College of Arts and Science and taught English in Prague, Czech Republic. When not at the office, Becca loves trying new hole-in-the-wall restaurants and exploring different neighborhoods around NYC. Un Kyung Park Director of the Global Visitors Program law.global@nyu.edu Un Kyung Park is part of the Hauser Global Law School Program team that welcomes four distinct and important groups to NYU Law every year: the Hauser Global Scholars, Global Fellows, Global Faculty and Distinguished Global Fellows. Un Kyung is primarily responsible for the Global Fellows Program and serves as special adviser for the Hauser Global Scholars. In addition, she is also happy to work with international law students and occasional global visitors. Prior to joining NYU School of Law, she worked as a corporate lawyer in Chicago and San Francisco. Un Kyung enjoys learning about different cultures and especially sampling cuisines from all around the world. Nathaly Rugel Assistant Director, Graduate Admissions & Affairs nathaly.rugel@nyu.edu With responsibilities across admissions and student services, Nathaly assists with the recruitment and selection of graduate students for our post-JD degrees, playing an active role in advising incoming and current students; and developing, implementing, and assessing programs that enhance our LLM students’ experience. Nathaly received her BA from Pace University and a MA from Brooklyn College. Before joining NYU, she served as Assistant Director, Graduate Academic Services at Georgetown University Law Center, where she supported the international and LLM adjuncts with their faculty appointments and the graduate courses they taught. Earlier in her career, she was the Director of International and Non-JD Programs at the University of Florida Levin College of Law, where she advised incoming and current LLM students and assisted with institutional engagement activities. In her spare time, she enjoys learning about different languages and cultures, visiting art museums, sampling cheeses from around the world, and hiking with her boyfriend and their two dogs. Calvin Tsang Administrative Aide to the Office of Graduate Affairs law.graduateaffairs@nyu.edu Calvin Tsang provides administrative support to LLM and exchange students. He can answer your questions about the LLM degree program, LLM student life, mechanics of course registration, and connect you to various resources around NYU and NYC. Calvin has been with OGA since the Spring of 2019. After earning a BA in dance, Calvin moved to New York City to pursue a performing career. Since 2011, Calvin has performed all over NYC with companies including Beth Liebowitz and Artists, Brendan Drake Choreography, Tiny Trip, and Linked Dance Theatre. While performing and choreographing, Calvin also worked in arts education as an administrator and most recently ran the Dancing Classrooms program in NYC before joining the Office of Graduate Affairs at NYU School of Law. Amy Wilson Associate Director for Law Abroad and Global Programs amy.wilson@nyu.edu Amy Wilson manages the operation of NYU Law Abroad programs in Buenos Aires and Paris, as well as all inbound and outbound international exchange programs, which span JD and LLM populations. She also coordinates the non-credit courses Spanish for Lawyers and Haitian Creole for Lawyers, and handles ABA compliance for study abroad and externships. If you need to know more about... JD Law Abroad & Exchange Programs and Language Instruction: law.globalstudents@nyu.edu Moots and GlobaLex: law.global@nyu.edu Hauser Faculty, Fellows, or Scholars: law.global@nyu.edu LLM degree programs, academic advising, student life: law.graduateaffairs@nyu.edu"
