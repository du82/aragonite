["https://law.nyu.edu/centers/belonging"]
title = "Meltzer Center for Diversity, Inclusion, and Belonging | NYU School of Law"
full_description = "Kenji Yoshino and Justice Ruth Bader Ginsburg Justice Sonia Sotomayor and Kenji Yoshino Kenji Yoshino and Anthony Appiah Lauren Rivera and David Glasgow Mahzarin Banaji Katharine Phillips and Kenji Yoshino Brian Welle and Anthony Thompson Sherrilyn Ifill and Kenji Yoshino David Glasgow and Dolly Chugh Chris Hayes and Kenji Yoshino The Meltzer Center for Diversity, Inclusion, and Belonging offers rare expertise at the intersection of two fields: diversity, equity, and inclusion (DEI) and the law. A research center at one of the world's most diverse academic institutions, we aim to advance thought leadership on DEI and the law; support the NYU Law community; and share knowledge with external organizations. What Makes Us Different We know the law. At a time of significant legal attacks on DEI programs, we help build legal literacy in the DEI profession and advance DEI solutions that account for emerging legal risks. We strive for the universal. Understanding that universal programs are both legally sound and achieve wide support, we focus on DEI frameworks that build a culture of inclusion for people of all identities and backgrounds. We combine rigor and practicality. While dedicated to research-backed approaches to DEI, we develop all our ideas through engagements with organizations, including Fortune 500 companies, professional services firms, and leading non-profits. Advancing DEI Initiative The Advancing DEI Initiative is a project of the Meltzer Center for Diversity, Inclusion, and Belonging, committed to making information on the intersection of law and DEI accessible to supporters of DEI. This website offers resources, including a DEI litigation tracker, to orient users to the DEI legal landscape. The tracker captures lawsuits likely to affect workplace DEI practices. Follow us on LinkedIn Kenji Yoshino and Justice Ruth Bader Ginsburg Justice Sonia Sotomayor and Kenji Yoshino Kenji Yoshino and Anthony Appiah Lauren Rivera and David Glasgow Mahzarin Banaji Katharine Phillips and Kenji Yoshino Brian Welle and Anthony Thompson Sherrilyn Ifill and Kenji Yoshino David Glasgow and Dolly Chugh Chris Hayes and Kenji Yoshino"
