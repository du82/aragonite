["https://law.nyu.edu/studentorganizations"]
title = "Student Groups | NYU School of Law"
full_description = "Student groups play a vibrant and essential role in fostering community life at NYU Law. The diverse list of student groups includes organizations focused on academic disciplines, cultural and identity-based initiatives, leisure activities, volunteer opportunities, and much more. Student groups are open to all students at NYU School of Law and are committed to non-discrimination and anti-harassment. Alternative Breaks Alternative Breaks provides NYU Law students with an opportunity to volunteer with public service organizations across the country while fostering institutional and personal relationships with these same organizations. American Constitution Society Student chapter of the nation's foremost progressive legal organization, committed to advancing multi-racial, representative democracy. nyulawacs@gmail.com Antitrust and Competition Law Society (ACLS) The Antitrust & Competition Law Society (ACLS) provides NYU Law students with a welcoming platform to learn about antitrust, explore diverse career opportunities in the field, connect with other students and professionals, and engage in dialogue about contemporary antitrust issues. antitrustsoc.nyulaw@gmail.com Asian-Pacific Allied Law Students Association (APALSA) APALSA provides social programming, community events, networking, and professional development opportunities that center the experiences of Asian-Pacific Islander NYU Law community to strengthen bonds and foster an inclusive space on campus. apalsalawnyu@gmail.com Art Law Society The Art Law Society was launched in 2011 with the mission to facilitate conversations among art law practitioners, academics, students, and artists. Artlawsociety@nyu.edu Asia Law Society ALS supports students interested in professional opportunities in Asia and/or practices related to Asia, culminating in an annual delegation trip to an Asian city in spring. als.nyu@gmail.com Black Law Students Association (BLSA) New York University School of Law is the home of the founding BLSA chapter, established over forty-five years ago to promote the advancement of black law students. BLSA organizes social events to welcome incoming students and throughout the year to provide a welcomed break for students. Brazilian Legal Society NYU Law’s Brazilian community, representing LLM, JD, and JSD students, aims to bring together the NYU Law community with practitioners, scholars, and civil society to establish a forum for discussing Brazil’s legal, economic, and social challenges. See Brazilian Legal Society. bls.nyulaw.board@gmail.com Chinese Law Student Association We are NYU Law CLSA, a community focused on serving the unique needs Chinese law students in the U.S., covering online community, experience sharing, skill enhancement, and activity exchange. nyulawclsa-group@nyu.edu Christian Law Student Association Community of Christian students or students interested in learning about Christianity. clsa@nyu.edu Dean's Cup The Deans’ Cup is an annual charity basketball game between the law schools of Columbia University (CLS) and New York University (NYU). First held in 2002, the game raises money for public interest and community service organizations at both universities. Defender Collective Defender Collective offers educational and community-building opportunities for students interested in working in public defense. As part of the Collective, students can sign up for our mentorship program to learn more about what a career in PD looks like, attend talks with professors and practicing attorneys in the PD field, and meet other like-minded peers at community events. defendercollective@gmail.com Disability Allied Law Students Association DALSA is NYU Law's affinity group for people with disabilities and their allies. The focus of our group is on all disabilities including physical disabilities, mental health, sensory impairments, learning disabilities, communication disorders, intellectual and developmental disabilities, and other impairments that substantially limit major life activities. Education Law & Policy Society EdLaw’s mission is to prepare its members to be leaders in the education reform movement, working toward ensuring a quality education for all. edlaw@nyu.edu Environmental Law Society The Environmental Law Society is a hub for students interested in environmental law, providing opportunities to connect with each other, faculty, and practitioners through fun events and engaging projects. nyu.environmentallawsociety@gmail.com Ending the Prison Industrial Complex (EPIC) Ending the Prison Industrial Complex (EPIC) is an abolitionist student organization @NYULaw. The Prison Teaching Project is dedicated to sharing knowledge with incarcerated people about how to navigate and utilize the legal system. nyulawepic@gmail.com European Legal Society (EULS) EULS brings together law students who are interested in exploring European and transatlantic legal and political developments. euls@nyu.edu Financial Regulation Society We are focused on financial regulation. finregsociety@nyu.edu First Generation Professionals First Generation Professionals (FGP) is a student-led group that supports students who are the first in their families to attend law school and students who come from working class backgrounds. With Special Thanks to FGP 2024-2025 Sponsors- Gold Tier: King & Spalding; Morgan, Lewis & Bockius; Proskauer Rose; Schulte Roth & Zabel. Silver Tier: Kramer Levin Naftalis & Frankel; Linklaters; Mckool Smith; Morrison & Foerster; Ropes & Gray. Bronze Tier: Clifford Chance; Gibson Dunn; Jenner & Block; Skadden, Arps, Slate, Meagher & Flom; Kirkland & Ellis; White & Case. fgp-group@nyu.edu Florida Law Society The Florida Law Society connects students with Florida’s legal community, creating a space for both Florida natives and those looking to build their careers in the Sunshine State. Through career development, networking events, and a strong support network, we help students build the skills and relationships they need to thrive in Florida's legal market—while offering a familiar and welcoming environment at NYU Law. nyufloridalawsociety@nyu.edu GVAP The Gender Violence Advocacy Project (GVAP) works in various ways to support survivors of domestic violence. Health Law and Policy Society (HLPS) Health Law and Policy Society (HLPS) strives to promote discussion of issues of health law and policy at NYU School of Law and at NYU in general, build a sense of community among students interested in health law and policy, and facilitate networking and career advancement of NYU students in the fields of health law and health policy. health-law-and-policy-society@nyu.edu High School Law Institute The New York University High School Law Institute (“HSLI”) is a student-run organization that serves talented and motivated high school students throughout New York City. Alongside our sister program at Columbia Law School, we offer free, yearlong academic programming in constitutional law, criminal law, and speech and debate on Saturdays from 10 AM to 1 PM nyu.hsli@gmail.com HIV Law Society HIV Law Society provides direct legal services to low income individuals infected with HIV/AIDS. Our primary pro bono activity is conducting intake for the Housing Works Legal Clinic. nyuhivlawsociety@gmail.com Hoop-reme Court The Hoop-reme Court is a student-run group which organizes pickup basketball games. hoopreme.court@nyu.edu I-PREP I-PREP brings unemployed New Yorkers to campus to practice their interviewing skills with law student volunteers in mock interviews. This year, I-PREP will coordinate with AHRC-NYC to assist individuals with intellectual and developmental disabilities who are seeking entry-level jobs. Identity Documents Project The Identity Documents Project (IDP) is a 501(c)(3) non-profit and student organization which assists transgender, gender non-conforming, and intersex (TGNCI) individuals obtain legal name changes and identity documents that display the correct name and gender marker. As a non-profit, we provide professional-quality services to our clients, train our advocates, and raise funds to assist TGNCI individuals in paying the fees for obtaining new documentation. As a student organization, we hold events to build community. If/When/How: Lawyering for Reproductive Justice We are a chapter of a national nonprofit network of abortion and reproductive rights lawyers and law students fighting for reproductive justice. if.when.how.nyu@gmail.com Immigrant Rights Project The NYU Law Immigrant Rights Project is a group of law students committed to the rights of all non-citizens. nyulawirp@gmail.com, nyu-irp-group@nyu.edu Intellectual Property & Entertainment Law Society NYU's IPELS is a student-run organization that seeks to promote the study and practice of intellectual property law and entertainment law within the law school community. We pride ourselves on our interdisciplinary approach, housing four distinct committees: Fashion Law, Tech Law, Entertainment Law, and Patent Law. International Arbitration Association NYU International Arbitration Association (IAA) is a student-run organization that promotes the community of NYU students, faculty, and alumni interested in international arbitration and dispute resolution through relevant and interesting programming and facilitating professional development. international_arbitration_association-group@nyu.edu International Law Society International Law Society (ILS) is a longstanding NYU Law student organization that seeks to supplement the global curriculum of both JD and LLM students interested in careers with an international scope through lectures, coffee chats, issue specific discussion groups, and career and academic panels. international-law-society-group@nyu.edu IRAP NYU IRAP is a global legal aid and advocacy organization working to create a world where refugees and all people seeking safety are empowered to claim their right to freedom of movement and a path to lasting refuge. irap.nyulaw@gmail.com Japanese Law Society Group of NYU Law students interested in legal developments in Japan. nyulawjp@gmail.com JD/MBA Association The JD/MBA Association at New York University is an organization that serves the interests of students pursuing both a Juris Doctor (JD) and a Master of Business Administration (MBA). nyujdmbaassn@gmail.com Jewish Law Students Association The Jewish Law Students Association (JLSA) serves as a spiritual, academic, and social resource to celebrate Jewish culture and heritage at the NYU School of Law. jlsa@nyu.edu Knitting Club Club for students to build community and learn fiber crafts such as knitting and crochet together. nyuknittingclub@nyu.edu Latinx Law Students Association (LaLSA) The purpose of LaLSA is to serve as a space where Latinx students and allies at NYU Law can find community and support as we navigate law school and the legal profession. nyu.law.lalsa@gmail.com Latin American Arbitration Society (LAAS) LAAS is a dynamic student organization dedicated to advancing the field of Latin American commercial and investment arbitration. Our mission is to create a vibrant platform for the discussion of regional issues and the exchange of ideas to elevate arbitration practice in Latin America and among the international community. nyulaw.laas.contact@nyu.edu Law & Business Association The Law & Business Association provides opportunities for students to learn about and interact with various disciplines relating to law and business through hosting events with different law firms including panels on various practice areas, lunch and learns, and networking events. lba-group@nyu.edu Law and Government Society (LGS) The NYU Law & Government Society (LGS) is dedicated to creating and cultivating a community of students who are interested in government work. Law & Political Economy Association LPE provides a social and academic group for students who are interested in left-leaning activism and academia. lpe-group@nyu.edu Law Revue Law Revue is the annual musical parody of life at NYU Law that is written, produced, and performed entirely by law students. The show enjoys an annual attendance of more than 1,500 students, alumni, faculty, and friends. Every year Law Revue looks for writers, actors, singers, dancers, musicians, and technical crew to help make the production a success. Students of all levels of talent and experience are encouraged to participate. NYULawRevue@gmail.com Law Students for Climate Accountability Law Students for Climate Accountability is a student-led organization that seeks to amplify the roles and responsibilities of the legal industry in our current climate crisis. Law Students for Economic Justice Law Students for Economic Justice (LSEJ) is a law student group dedicated to supporting labor movements, union organizing, and more. Nyucoalition@gmail.com Law Students for Human Rights LSHR aims to provide students with first-hand exposure to work on substantive human rights matters. Law Students for Justice in Palestine Law Students for Justice in Palestine (LSJP) is NYU Law's home for education, discussion, and activism promoting the rights of the Palestinian people. Law Students of Catan On Fridays at 7PM, Law Students of Catan can be found playing board games and enjoying food and drink in the basement of D'Agostino Hall. Everyone is welcome at any time, and newcomers are especially encouraged to come and see what all the fuss is about! Law Women NYU Law Women promotes the success of women in the legal field, while also advocating for women’s rights and gender justice locally and globally. nyulawwomen@gmail.com Learned Foot The purpose of Learned Foot is to bring the NYU community closer together through soccer. Learned Foot provides an opportunity for both JD and LLM students to play pick up soccer throughout the year. May It Please The Cork The Organization will facilitate closer social links among Students of all backgrounds and experience levels and assist Students in discovering the types of wine they enjoy most. The Organization also seeks to enable Students to converse knowledgeably about wine in a variety of professional settings, such as in casual conversation at networking events, during the law firm interview process, at law firm offer dinners, at professional development/CLE events, at law firm client dinners, and at non-profit fundraising events. Mental Health Law & Justice Association The Mental Health Law and Justice Association at New York University School of Law is committed to increasing awareness of and decreasing stigma related to mental health in the justice system, the legal profession, and law school. We aim to facilitate this change by being a resource for mental health supports and information, as well as hosting panels on the changing landscape of mental health awareness in the profession, and trainings to provide concrete skills for working with clients with mental health needs. Middle Eastern/North African Law"
