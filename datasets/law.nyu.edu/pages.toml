["https://law.nyu.edu/about/whynyulaw/academics-without-boundaries"]
title = "Academics | NYU School of Law"
full_description = "Why NYU Law Our Community 1L Year Academics Learn by Doing Academics without Boundaries Whatever you’re interested in—global law, public interest, technology, law and business, or another specialty—NYU Law has it. The Law School is at the forefront of interdisciplinary research and teaching, with special strengths in law and philosophy, economics, politics, history, and social theory. We also offer an unsurpassed array of courses in international, comparative, and foreign law. Watch: Daniel Francis JSD '20 on the strength of International Law at NYU Global In an increasingly interconnected economy and geopolitical landscape, international legal issues are more crucial than ever. NYU Law’s global programs offer unparalleled preparation for taking on these challenges and opportunities. Seasoned and well-connected faculty share their expertise in the areas of international commercial law, economic development, global climate change, transitional justice, World Trade Organization disputes, antiterrorism, cybersecurity, and many others. The Hauser Global Law School Program, established in 1995, incorporates non-US and transnational legal perspectives throughout the Law School’s curriculum and brings the world’s leading faculty to NYU to teach alongside their US-based counterparts. The Guarini Institute for Global Legal Studies facilitates opportunities to explore global legal issues through many programs and initiatives, including NYU Law Abroad—which offers specially designed programs in Buenos Aires and Paris combining classroom study with practical experience—and traditional exchange programs. Watch: Alice Thai ’18 on how the Jacobson Program in Law and Business enhanced her NYU Law experience Law and Business Whether you plan to be at a firm, a bank, or a corporation, NYU Law offers a comprehensive range of law and business courses. In Law and Business classes, students explore corporate law, compliance and enforcement, intellectual property, social impact and entrepreneurship, land use, labor and employment law, and other specialties. The Lawyering Program for 1Ls includes a business and financial literacy module, and NYU Law has long offered Accounting for Lawyers and Corporate Finance for business-oriented students. The Jacobson Leadership Program in Law and Business prepares exceptional students to pursue high-level careers where law and business meet. It features a business law clinic and interdisciplinary courses that unite faculty and students from the Law School and the Stern School of Business to focus on current real-world case studies. Students can also delve deeper with dual degrees, including a JD/MBA, JD/ MA or PhD in economics, and JD/LLM in international law or taxation. An Advanced Professional Certificate in Law and Business is available, too. The NYU Law Venture Fund offers grants, internships, and seed-stage funding for current students and alumni entrepreneurs. Watch: Professor Margaret Satterthwaite '99 on how public service is core to NYU Law's identity A Public Service Ethos The Law School’s comprehensive public service infrastructure is second to none. Whether you ultimately work in the public sector or in private practice, you can benefit from the personal and skill-building rewards of public interest work as a student. The Public Interest Law Center (PILC) coordinates and promotes NYU Law’s public interest and government service activities and also offers individual career counseling. Its Public Interest Summer Funding Program guarantees funding for all first- and second-year students who want to work in public interest and government positions at organizations as varied as the ACLU Capital Punishment Project, the UN International Law Commission, and the Sierra Club. PILC’s Public Interest Legal Career Fair is the largest career fair of its kind in the nation. The Root-Tilden-Kern Scholarship Program, NYU’s oldest public interest scholarship awards full tuition to 20 scholars selected for their academic merit, leadership potential, and commitment to working in public service. The Latinx Rights Scholarship offers full-tuition support to students who intend to pursue careers serving Latinx communities. The Furman Public Policy Scholarship Program provides specialized training and advising to selected students pursuing careers in public policy, offering full-tuition support and experience-based opportunities. The Arthur Garfield Hays Civil Liberties Program offers 3L fellowships that facilitate internships with civil liberties and other human rights organizations. Our recently enhanced Loan Repayment Assistance Program (LRAP Plus), which helps ease the burden of debt repayment obligations for qualified graduates, is one of the most generous in the nation. Watch: Professor Jason Schultz on why NYU Law is a great place to study technology law Law and Technology NYU Law prepares students for innovative careers in law and technology. Our alumni have served as general counsel for major players such as Twitter, Verizon, Reddit, Dropbox, and Grubhub. Courses represent a range of tech-related topics. Artificial Intelligence, Machine Learning: Impact on Work and Workers considers AI’s effects on employees. Digital Currency, Blockchains, and the Future of Financial Services looks at the emerging role of digital currencies and blockchains in money, banking, and the real economy. Information Privacy Law surveys the legal framework pertaining to information privacy in the United States. The class is taught by Senior Fellow Ira Rubinstein of the Information Law Institute, which studies law, policy, and social norms defining and affecting the flow of information in a digitally networked society. The Internet Contracts Seminar addresses the rights of millions of users regarding the personal information they share online. NYU Law has cultivated a robust cybersecurity specialty. In addition to taking the Cybersecurity Law and Technology Seminar, students can apply for the NYU Cyber Scholars Program. Offered by the NYU Center for Cybersecurity—a collaboration between NYU Law, NYU Tandon School of Engineering, and other NYU schools and departments—the program helps you develop an interdisciplinary understanding of cybersecurity issues. The Guarini Global Law & Tech program takes an interdisciplinary approach to the exploration of legal and regulatory tech-related issues on a global scale. You can develop your own global perspective in classes such as Global Tech Law: Selected Topics Seminar and the Human Rights, Civil Society, and the Internet in China Seminar. Dual Degrees NYU Law offers a number of dual degree programs with other graduate schools at the University. This unique opportunity enables students to complete a JD and earn a Master’s degree in four years, or complete the JD in five semesters while pursuing a PhD. JD/LLM in International Law JD/LLM in Taxation JD/MA or PhD in Economics, Philosophy, or Politics JD/MA in French Studies JD/MA in Latin American and Caribbean Studies JD/MBA JD/MPA or JD/MUP JD/MSW Harvard University Princeton University Areas of Study Among the 16 broad areas of study in the NYU Law curriculum, some of the most popular are corporate and commercial; environmental; global and international; antitrust, intellectual property and information; regulation and public policy; and taxation."
