["https://law.nyu.edu/events/marden-competition-final-round-0"]
title = "Marden Competition: Final Round | NYU School of Law"
description = '''On behalf of the Marden Moot Court Board, we are pleased to invite you to the annual Marden Competition: Final Round on Wednesday, March 12, at 5:00 p.m., in Lipton Hall!Judge Gregory G. Katsas (District of Columbia Circuit), Judge Lucy Koh (Ninth Circuit), and Judge Toby J. Heytens (Fourth Circuit) will preside.In the case in question, a small business owner named Lenny Levinson sued LendSmart, a lending company, under Title III of the Americans with Disabilities Act ("ADA"), seeking an injunction for discriminating on the basis of a loan applicant's disability. The contested issues that students will be arguing are (1) whether a standalone website qualifies as a “public accommodation” under Title III of the ADA, and (2) whether Title III of the ADA prohibits a lender from imposing a higher loan interest rate based on a borrower’s disability.'''
full_description = '''NYU Law Events Wednesday, March 12, 2025 Marden Competition: Final Round 5:00–7:00 p.m. Lipton Hall, D'agostino Hall 110 W 3rd St New York, NY ,10012 (view map) Add to Google Calendar This event is not open to the public. On behalf of the Marden Moot Court Board, we are pleased to invite you to the annual Marden Competition: Final Round on Wednesday, March 12, at 5:00 p.m., in Lipton Hall!Judge Gregory G. Katsas (District of Columbia Circuit), Judge Lucy Koh (Ninth Circuit), and Judge Toby J. Heytens (Fourth Circuit) will preside.In the case in question, a small business owner named Lenny Levinson sued LendSmart, a lending company, under Title III of the Americans with Disabilities Act ("ADA"), seeking an injunction for discriminating on the basis of a loan applicant's disability. The contested issues that students will be arguing are (1) whether a standalone website qualifies as a “public accommodation” under Title III of the ADA, and (2) whether Title III of the ADA prohibits a lender from imposing a higher loan interest rate based on a borrower’s disability. CLE Credit Available: No Event Contact(s): Max Schneider , mrs9991@nyu.edu'''
