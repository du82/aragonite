["https://law.nyu.edu/events/bwlc-symposium-collateral-damage-dobbs-womens-health-beyond-abortion-care"]
title = "BWLC Symposium: The Collateral Damage of Dobbs on Women’s Health: Beyond Abortion Care | NYU School of Law"
description = "RSVP for the event.When the Supreme Court overturned Roe v. Wade, it upended half a century of established jurisprudence – leaving in its wake a convoluted legal landscape, and eliminating access to vital reproductive care for millions. The fallout includes a wider range of health issues affecting women undergoing cancer treatment, using assisted fertility, entering menopause, and more. Our symposium will address the new risks, challenges, and potential windows for progress in this era.Panelists include BWLC Fellows-in-Residence Jennifer S. Hendricks, Professor of Law and Co-Director of the Juvenile and Family Law Program at Colorado Law and Dr. Sharon Malone, Chief Medical advisor at Alloy Women’s Health; Jamie R. Abrams, Professor of Law and Director of Legal Rhetoric Program at Washington College of Law; Dr. Michele Bratcher Goodwin, Linda D. & Timothy J. O'Neill Professor of Constitutional Law and Global Health Policy and Co-Faculty Director of the O'Neill Institute for National and Global Health Law at Georgetown Law; Nicole Huberfeld, Edward R. Utley Professor of Health Law at Boston University; Margaret E. Johnson, Professor of Law and Director of the Bronfein Family Law Clinic at University of Baltimore School of Law; Alexis McGill Johnson, President and CEO of the Planned Parenthood Federation of America; Melissa Murray, Frederick I. and Grace Stokes Professor of Law and Faculty Director of the Birnbaum Women’s Leadership Center at NYU Law; Kimberly Mutcherson, Beck Chair at Temple Law School, Professor of Law at Rutgers Law School and former BWLC Fellow-in-Residence; Dr. Versha Pleasant, Clinical Assistant Professor, Director, Breast Health & Cancer Genetics Clinic at University of Michigan; Mark Joseph Stern, senior writer at Slate; Karen Thompson, Legal Director at Pregnancy Justice; Jennifer Weiss-Wolf, Executive Director of the BWLC; and Dr. Amanda Williams, Interim Chief Medical Officer at March of Dimes.This symposium is generously sponsored by Dechert.This event has been approved to offer 3 New York State CLE credits in the category of Areas of Professional Practice. The credit is both transitional and non-transitional; it is appropriate for both experienced and newly appointed attorneys.Visit our symposium website for more information on the agenda and CLE.RSVP for the event."
