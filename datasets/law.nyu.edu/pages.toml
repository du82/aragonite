["https://law.nyu.edu/areasofstudy/cities-and-land-use"]
title = "Cities & Land Use | NYU School of Law"
description = "Faculty Courses Centers For Students All Areas of Study From Urban Affairs to Decentralization New York C"
full_description = "Roderick Hills Jr. teaches and writes in public law areas with a focus on the law governing division of powers between central and subcentral governments. Katrina Wyman has undertaken case studies of the evolution of emissions trading, property rights in fisheries, and taxi licenses. Daniel Hulsebosch’s scholarship ranges from early modern England to the 19th-century United States. Faculty Courses Centers For Students All Areas of Study From Urban Affairs to Decentralization New York City is an ideal place to study Cities and Land Use; it is both a case study and a crossroads for cutting-edge research in affordable housing, rental supply and income growth, utility costs, and protecting multifamily housing from natural disasters. Faculty in this area harbor diverse interests and an enthusiasm for interdisciplinary work. Vicki Been ’83 focuses her scholarship on the intersection of land use, urban policy and housing. Roderick Hills, for example, writes on public law, including land use regulation, with a focus on the common theme of decentralization; Katrina Wyman’s interests include rights in natural resources such as fisheries and air, and the evolution of the New York City taxi medallion; and Daniel Hulsebosch’s expertise, from the early modern British empire to 19th-century United States, explores the relationships between migration, territorial expansion, transnational sources of law, and the development of legal institutions and doctrines. Outside of the classroom, the NYU Law community is actively engaging with questions shaping cities and land use law. Our renowned Furman Center for Real Estate & Urban Policy regularly publishes research examining the state of cities across the nation, keeping its finger on the pulse of evolving trends and asking incisive questions of our policies and leaders. The Frank J. Guarini Center on Environmental, Energy, and Land Use Law also offers opportunities for students to pursue specialized postgraduate research fellowships."
