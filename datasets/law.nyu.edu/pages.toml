title = "Legal History Colloquium | NYU School of Law"
description = "Professor David Golove Professor Noah Rosenblum Fall 2024 Alternate Wednesdays 4:45-6:45 p.m. Vanderbilt Hall, Room 208 LAW-LW.11160.001"
full_description = 'Professor David Golove Professor Noah Rosenblum Fall 2024 Alternate Wednesdays 4:45-6:45 p.m. Vanderbilt Hall, Room 208 LAW-LW.11160.001 2 credits The colloquium will alternate between public and private sessions. In the public sessions, the colloquium will discuss works-in-progress by historians or legal scholars. In the private sessions, the moderators and students will discuss reading materials that provide context for the upcoming public papers. Students will submit response papers before each public session. Fall 2024 Schedule of Presenters September 11 Jonathan Gienapp, Associate Professor of History and Associate Professor of Law, Stanford University “Against Constitutional Originalism” We will be covering Chapters 4 and 5. For the reading materials, please email Professor Noah Rosenblum at nr2267@nyu.edu and myself at dg4480@nyu.edu. September 25 Mary Ziegler, Martin Luther King Jr. Professor of Law, UC Davis School of Law “Comstockery: How Government Censorship Gave Birth to the Law of Reproductive Freedom, and May Again Threaten It” October 9 Sarah Seo, Michael I. Sovern Professor of Law, Columbia Law School & Visiting Professor of Law, NYU School of Law “"Kindred to Treason": Conspiracy laws in the United States” October 23 Anna O. Law, Associate Professor of Political Science & Herbert Kurz Chair of Constitutional Rights, CUNY Brooklyn College "Controlling Internal US Borders in the 19th Century" November 6 Stephen Holmes, Walter E. Meyer Professor of Law, NYU School of Law "Flesh of Our Flesh: Imperial Ambition and Republican Strategy in the U.S. Constitution" November 20 Jane Manners, Assistant Professor of Law, Temple University Beasley School of Law "THE EQUITABLE CONSIDERATION OF CONGRESS AND THE PRIVATE LAW OF PUBLIC RELIEF" November 27 Caitlin B. Tully, Samuel I. Golieb Fellow in Legal History, NYU School of Law "Constitutional Law in Crisis"'
