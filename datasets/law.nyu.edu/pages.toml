description = "This budget governs the total amount of aid (loans or a combination of grants and loans) that is available to a student in any given year. Students may not borrow in excess of the approved budget. Each year the budget is adjusted to reflect changes in costs and expenses.  This budget is estimated and subject to modification."
full_description = "This budget governs the total amount of aid (loans or a combination of grants and loans) that is available to a student in any given year. Students may not borrow in excess of the approved budget. Each year the budget is adjusted to reflect changes in costs and expenses. This budget is estimated and subject to modification. 2024-25 Estimated Student Expense Budget Tuition $79,954 Health, Registration, Service, and Tech Fees $3,198 Housing $20,930 Food $6,870 Books and Supplies $1,600 Health Insurance (basic) $4,177 Transportation $1,188 Loan Fees $220 TOTAL $118,137 Note for International Students: In addition to the standard educational expenses associated with the NYU Law School cost of attendance, international students should expect added financial obligations related to relocation and transition to studying in the U.S. (i.e., VISA fees, SEVIS, international travel, settling in, etc.). For your reference, we have included a list of some of the estimated fees incurred by a typical NYU international student: Estimated U.S. Visa Application Fee: $185 Estimated SEVIS Fee: $220-$350 Estimated NYU Global Services Fee: $90-$100 per semester Estimated Early Arrival Daily Housing Rate: $66-$136 *Estimated Early Arrival Health Insurance Fee: $368-$409 *Students should include charges for early arrival health insurance in their estimated budget, unless they have approved alternative coverage. Please contact the NYU Office of Student Health Insurance directly for more information about health insurance charges at (212) 443-1020 or health.insurance@nyu.edu. In addition to the above fees, expenses for international travel and costs associated with settling into a new residence in a foreign country can vary widely depending upon individual circumstances. International students should expect that they will need to cover such additional expenses [not included in the standard Student Expense Budget] of at least $1,500 to $5,000."
