["http://www.law.nyu.edu/furmanprogram"]
title = "Furman Academic Program | NYU School of Law"
full_description = "The Furman Academic Program is designed to train future law professors. Participants in the program receive resources and mentorship to prepare them for successful careers as legal academics. Furman Scholars are current JD students who show exceptional promise as future legal academics. Furman Fellows are NYU Law graduates actively pursuing an academic career. The signature aspect of the Furman Program is its attention to mentoring. During law school, Furman Scholars have a graduate school experience within the broader law school community. Each Furman Scholar gets a faculty mentor upon admission; two additional faculty members join that team by graduation. When Furmans go on the law-teaching market, they have a great deal of preparation and support behind them. Furmans also become part of an extraordinary professional network. Furman alumni have joined the faculty of more than a dozen of the nation’s top law schools. Others have gone on to prestigious positions in government, NGOs, and law firms. Most Furmans have one or more top clerkships. For more information, see the Program's placement record."
