title = "Hauser Global Law School Program | NYU School of Law"
description = "FACULTY   FELLOWS   SCHOLARS   DISTINGUISHED FELLOWS   EVENTS"
full_description = "Faculty Faculty Fellows Fellows Scholars Scholars Distinguished Fellows Distinguished Fellows Events Events About Hauser About Hauser Established in 1995 with a generous gift from Rita and Gustave Hauser, NYU’s Hauser Global Law School Program comprises four distinct and important groups: the Hauser Global Scholars, Global Fellows, Global Faculty, and Distinguished Global Fellows. Hauser Global Scholars are graduate law students selected from around the world who receive full scholarships each year. Hauser Global Fellows are academics, lawyers, government officers, and postdoctoral scholars who spend up to one year in residence at NYU Law working on personal research projects. Hauser Global Faculty are renowned international academics and practitioners who specialize in a wide range of legal subjects and are invited to teach specially designed courses, conduct research, and interact with each other and with faculty, students, and alumni. Hauser Distinguished Global Fellows are notable intellectual figures who visit the Law School for two or three weeks, and share their expertise with the community by giving lectures and contributing to other educational and scholarly events. The Hauser Program, jointly with the Guarini Institute, expands NYU Law's global and international opportunities by providing financial assistance for students participating in International Moot Court Competitions and also supports GlobaLex, an electronic legal publication dedicated to international and foreign law research. In addition, each year the Law School also welcomes a select group of Visiting Doctoral Researchers, who are candidates enrolled in a doctoral degree program at another institution abroad who wish to benefit from spending one year of their research at NYU. The Visiting Doctoral Researchers Program is administered by the JSD Program. The Hauser Global Law School Program celebrated its 25th anniversary by bringing together current and former faculty, scholars, fellows and alumni to examine the theme of “The International Order Under Challenge.” The Hon. Michael Kirby AC CMG, co-chair of the Human Rights Institute of the International Bar Association and former justice of the High Court of Australia, was the keynote speaker in conversation with Dr. David M. Malone, UN under-secretary-general and rector of the United Nations University. Previous anniversary events have featured keynote speeches by Koen Lenaerts, vice-president of the Court of Justice of the European Union, Nobel Peace Prize winner Mohamed ElBaradei LLM ’71, JSD ’74, LLD ’04, former Secretary General of the United Nations Kofi Annan, former President of France Valery Giscard d’Estaing, and former President of the Dominican Republic Dr. Leonel Fernández. Gustave Hauser passed away on February 14, 2021, at the age of 91. Read more about Hauser."
