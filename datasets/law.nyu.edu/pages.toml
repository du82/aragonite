title = "Birnbaum Women's Leadership Center | NYU School of Law"
full_description = "The Honorable Elena Kagan, Associate Justice of the Supreme Court of the United States, in conversation with BWLC Faculty Director Melissa Murray at the inaugural Sidney Shainwald Public Interest Lecture at NYU Law, an event hosted by the BWLC The Honorable Elena Kagan, Associate Justice of the Supreme Court of the United States, talks with BWLC Fellows at the inaugural Sidney Shainwald Public Interest Lecture at NYU Law, an event hosted by the BWLC 1L Women's Leadership Fellows from the Class of 2027 with BWLC Leadership, including Executive Director Jennifer Weiss-Wolf, co-founder Sara Moss ’74, and Lead Coach Morenike Williams, in January 2025 Panelists Kimberly Mutcherson, Jenice Fountain, Irin Carmon, Karen Thompson, and Mary Ziegler during the September 2024 Personhood and Pregnancy event, co-hosted by the BWLC and Reproductive Justice Clinic together with Pregnancy Justice Dr. Sharon Malone, NYT columnist Jamelle Bouie, BWLC Executive Director Jennifer Weiss-Wolf, Former U.S. Attorney General Eric Holder, BWLC Faculty Director Melissa Murray, and Yale Law’s Genevieve Scott, Reva Siegel, and Cilla Smith in January 2024 BWLC Faculty Director Melissa Murray and Leadership Conference President Maya Wiley during the BWLC's annual symposium in February 2024 NYU Law's Peggy Cooper Davis, BWLC Visiting Fellow-in-Residence Kimberly Mutcherson, Georgetown Law's Aderson Francois, and Penn Carey Law's Serena Mayeri during the BWLC's Reconstructing the Reconstruction Amendments symposium in February 2024 Current and former BWLC Fellows, Reproductive Justice Clinic (RJC) students and alumni with BWLC and RJC leadership during celebratory reception in April 2024 1L Women's Leadership Fellows, with BWLC Executive Director Jennifer Weiss-Wolf, at the New Museum in January 2024 BWLC Executive Director and 50 Years of Ms. contributor Jennifer Weiss-Wolf in conversation with journalist Irin Carmon, Ms. Foundation’s Shawnda Chapman, and Joanne Smith of Girls for Gender Equity at the Center for Brooklyn History in September 2023 April 2023 symposium participants Victoria Nourse, Irin Carmon, Ria Tabacco Mar ’08, Chisun Lee, Dr. Jamila Perritt, BWLC Executive Director Jennifer Weiss-Wolf, and Jessica Valenti April 2023 symposium attendees listen to BWLC Faculty Director Melissa Murray in conversation with Jessica Valenti BWLC co-founder Sheila Birnbaum ’65, Faculty Director Melissa Murray, Executive Director Jennifer Weiss-Wolf, and founding supporter Sara Moss ’74 at the BWLC’s April 2023 symposium on Women’s Rights and Backsliding Democracies BWLC Faculty Director Professor Melissa Murray, BWLC Executive Director Jennifer Weiss-Wolf, and MSNBC host Chris Hayes following an NYU Law Forum on The Future of Abortion, Privacy Rights, and Equality in November 2022 During a visit to the White House in June 2022, BWLC Faculty Director Melissa Murray, BWLC Executive Director Jennifer Weiss-Wolf, and other scholars met with Vice President Kamala Harris to discuss privacy issues following the Dobbs ruling. Michele Bratcher Goodwin, BWLC Faculty Director Melissa Murray, Lourdes Rivera, Monica Simpson, Jennifer Weiss-Wolf, and Kathy Spillar following the Abortion is Essential to Democracy panel in April 2022 Moderator Michele Bratcher Goodwin, BWLC Faculty Director Melissa Murray, and Lourdes Rivera during the Abortion is Essential to Democracy panel in April 2022 Panelists Rabia Belt, Elaine Weiss, and Martha Jones during “That Important Trust”: Suffrage & Citizenship 100 Years After the Nineteenth Amendment in February 2020 “That Important Trust”: Suffrage & Citizenship 100 Years After the Nineteenth Amendment panelists Julie Suk, Kristen Clarke, and Diana Kasdan '01 BWLC Faculty Director Melissa Murray in conversation with Dahlia Lithwick during BWLC's Nineteenth Amendment symposium Faculty Director Melissa Murray with panelists Dina Bakst, Alex Baptiste, Gillian Thomas, Congressman Jerry Nadler, and Carmelyn Malalis during Long Overdue: Eradicating Pregnancy Discrimination & Other Barriers to Workplace Equality, in November 2019 BWLC Faculty Director Melissa Murray and Professor Kim Taylor-Thompson during From Anita Hill to Christine Blasey Ford: Looking Back and Looking Forward in October 2018 The Birnbaum Women’s Leadership Center — formerly the Birnbaum Women’s Leadership Network — works to advance women’s-focused leadership and ensure the success and centrality of women in public life and the law. We carry out our mission through three core pillars of service: we provide top-notch leadership development opportunities for NYU Law students that invest in their success in law school and beyond; we spur innovative thinking and serve as a hub for thought leadership about gender equity at NYU Law and in the broader legal community; and we bring research, advocacy, and media expertise to bear to ensure gender equity in the workplace and society. Call for Applications: BWLC Fellows-in-Residence, AY 2025-26 The Birnbaum Women’s Leadership Center invites applications for Fellows-in-Residence for the 2025-26 academic year. Ideal candidates are legal scholars with sabbatical funding who seek to undertake research and writing, organize events, and otherwise collaborate on projects focused on women’s rights and gender equity and justice. Applications will be accepted through March 31, 2025. Please visit the Job Opportunities page for more details. BWLC 2024 Annual Summary The BWLC is pleased to present our annual summary, showcasing our work across leadership development, as a hub for thought leadership, and our strategic public leadership efforts over the past year. Read the report. Report Spotlight The Birnbaum Women’s Leadership Center launched its inaugural report, Make The Connection: Gender and Democracy, in September 2024. Inspired by the BWLC’s annual symposium series, Make The Connection is intended to help philanthropy leaders counter rising authoritarianism and address the intersection of gender and democracy. Make The Connection was produced with the support of the Ford Foundation. Event Spotlight On September 9, 2024, the BWLC proudly hosted the inaugural Sidney Shainwald Public Interest Lecture at NYU Law. The Honorable Elena Kagan, Associate Justice of the Supreme Court of the United States, joined BWLC Faculty Director Melissa Murray to discuss topics such as gender representation in the Supreme Court, the evolution of the shadow docket, judicial ethics, and Justice Kagan’s early experiences clerking for Justice Marshall. Watch the recording. Press Highlights Is This the One Issue That Can Transcend Political Lines? Katie Couric Media Author: Jennifer Weiss-Wolf, Birnbaum Women’s Leadership Center Why Split-Ticket Voters Must Keep Trump Accountable On Abortion Time Author: Jennifer Weiss-Wolf, Birnbaum Women’s Leadership Center Navigating Gen X Parenthood, Politics and the 2024 Election’s Hard Lessons Ms. Magazine Author: Jennifer Weiss-Wolf, Birnbaum Women’s Leadership Center In New York, a constitutional amendment provides election fodder for the left and the right ABC News Expert: Jennifer Weiss-Wolf, Birnbaum Women’s Leadership Center View all › Join our mailing list Follow us on Twitter Follow us on LinkedIn Follow us on Instagram"
