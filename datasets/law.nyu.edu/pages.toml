full_description = "Ryan Bubb, Professor of Law Tatiana Homonoff, Assistant Professor of Economics and Public Policy Theresa Kuchler, Assistant Professor of Finance Co-sponsored by the NYU Department of Economics, School of Law, Stern School of Business, and Wagner Graduate School of Public Service, the Behavioral Economics and Public Policy Workshop brings together scholars from across units at NYU who are interested in applying insights from behavioral economics and psychology to inform law and policy. Each workshop will feature a presentation and discussion of recent scholarly work in the area. If you would like to be added to the workshop e-mail list, please e-mail lara.maraziti@nyu.edu. SPRING 2019 February 28, 4:00-5:30 p.m. Matthew Notowidigdo, Northwestern University Department of Economics Title: “Take-up and Targeting: Experimental Evidence from SNAP” Location: Room 326, Furman Hall, 245 Sullivan Street Tuesday, March 12, 4:00-5:50 p.m. [Joint session with Tax Policy and Public Finance Colloquium] Tatiana Homonoff, NYU Wagner School Title: \"Program Recertification Costs: Evidence from SNAP\" Location: Room 208, Vanderbilt Hall, 40 Washington Square South March 14, 4:00-5:30 P.M. Peter Ganong, University of Chicago, Harris School of Public Policy Title: \"Why Do Borrowers Default on Mortgages?\" Location: Kaufman Management Center (KMC), Room 4-90, 44 West 4th Street March 28, 4:00-5:30 P.M. Camelia Kuhnen, UNC Kenan-Flagler Business School Title: \"Expectations Uncertainty and Household Economic Behavior\"\u0003 Location: Kaufman Management Center (KMC), Room 4-90, 44 West 4th Street FALL 2018 September 27, 4:00-5:30 P.M. Andrew Caplin, New York University Department of Economics Title: Framing as Information Design Location: Room 326, Furman Hall, 245 Sullivan Street October 4, 12:30-2:00 P.M. (*Lunch provided at noon) Justin Sydnor, Wisconsin School of Business Title: The Structure of Health Incentives: Evidence from a Field Experiment Location: NYU Wag