title = "DALSA General Body Meeting | NYU School of Law"
description = "Join the Disability Allied Law Students Association (DALSA) for our first General Body Meeting of the semester! DALSA is NYU Law's affinity group for people with disabilities and their allies. Our focus is on all disabilities including physical disabilities, mental health, sensory impairments, learning disabilities, communication disorders, intellectual and developmental disabilities, and other impairments that substantially limit major life activities. We aim to provide space and community for folks with disabilities and to advance change to better support students with disabilities at NYU Law.We invite all students with disabilities and allies interested in joining us to come, chat, and enjoy a lunch provided by DALSA. We plan to welcome returning and new members of our community, discuss plans for the semester, and open up a discussion about attendees' interests and concerns broadly. The meeting should last about an hour."
