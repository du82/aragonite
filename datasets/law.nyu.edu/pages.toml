["https://law.nyu.edu/graduateaffairs/academics"]
title = "Academics for LLM and Exchange Students | NYU School of Law"
description = "For questions about academic issues concerning your program, your first point of contact should be the Office of Graduate Affairs. The Office of Graduate Affairs advises LLM and Exchange students on all academic inquiries including course schedules, course loads, cross-registration,  compatibility of classes, completion of requirements, earning the LLM degree, and requests for optional practical training.  The Office of Graduate Affairs also resolves issues concerning the rules and regulations of the LLM program."
full_description = "For questions about academic issues concerning your program, your first point of contact should be the Office of Graduate Affairs. The Office of Graduate Affairs advises LLM and Exchange students on all academic inquiries including course schedules, course loads, cross-registration, compatibility of classes, completion of requirements, earning the LLM degree, and requests for optional practical training. The Office of Graduate Affairs also resolves issues concerning the rules and regulations of the LLM program. Students may also wish to consult Susan Chung, Director of Graduate Lawyering. Specialized questions about a particular area of law may best be directed to the Faculty Director of each LLM program who also serves as an academic advisor to LLM students. Our faculty is known for its accessibility and we encourage students to approach faculty members with course-related questions via e-mail or during their office hours. We encourage you to contact the Office of Graduate Affairs at law.graduateaffairs@nyu.edu or at Furman Hall, Suite 340. Students are welcome on a walk-in basis or may schedule an appointment by writing to law.graduateaffairs@nyu.edu. Please note that students in the Tax LLM Program who seek academic advice should consult the Graduate Tax Office in Furman Hall, Suite 340 Sullivan Street, 3rd Floor. You may contact the Tax Office by e-mail at law.taxprograms@nyu.edu and by phone at (212) 998-6150."
year_published = 2025
