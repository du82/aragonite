["https://law.nyu.edu/areasofstudy/criminal"]
title = "Criminal Justice | NYU School of Law"
description = "Faculty Courses  Centers For Students All Areas of Study Real-World Training With several criminal law clinics, myriad advanced cours"
full_description = "Rachel Barkow is faculty director of the Peter L. Zimroth Center on the Administration of Criminal Law. Bryan Stevenson's TED Talk received more than 3.8 million views. Barry Friedman is director of the Policing Project. David Garland is the author of the award-winning book Peculiar Institution: America's Death Penalty in an Age of Abolition. Faculty Courses Centers For Students All Areas of Study Real-World Training With several criminal law clinics, myriad advanced courses in substantive and procedural criminal law, internship opportunities, and influential policymakers and practitioners regularly converging on Washington Square, students interested in a career in criminal law have unparalleled opportunities to get a tangible understanding of the specialty. Criminal law at NYU is a rich discipline that begins with the first-year course in Criminal Law, which covers general principles of criminal responsibility. Top scholars who teach first-year Criminal Law include: Rachel Barkow, Erin Murphy, and Stephen Schulhofer. Second-year students can take courses in evidence or criminal procedure. Most law schools have only one course in criminal procedure—at NYU, students can choose from four. Upper-level courses in substantive and procedural criminal law include Business Crime, Federal Criminal Law, and Juvenile Justice. And those interested in getting practical, hands-on training can take clinics such as Criminal Defense and Reentry Clinic. Our faculty are leaders in their fields, from capital punishment to the administration of law. They explore critical issues in meting out justice through centers such as the Peter L. Zimroth Center on the Administration of Criminal Law, the Reiss Center on Law and Security, and the Brennan Center for Justice. Rachel Barkow is faculty director of the Peter L. Zimroth Center on the Administration of Criminal Law. Bryan Stevenson's TED Talk received more than 3.8 million views. Barry Friedman is director of the Policing Project. David Garland is the author of the award-winning book Peculiar Institution: America's Death Penalty in an Age of Abolition."
