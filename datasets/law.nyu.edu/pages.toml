["http://www.law.nyu.edu/corporatecompliance"]
title = "Program on Corporate Compliance and Enforcement | NYU School of Law"
full_description = "Deputy Attorney General Lisa Monaco offering remarks on behalf of the Department of Justice concerning corporate criminal enforcement policy. (September 15, 2022) Attorney General Eric Holder delivers an address on corporate crime and compliance. Deputy Attorney General Sally Quillian Yates announces new DOJ corporate enforcement guidelines (the “Yates Memo”). Securities and Exchange Commission Chair Mary Jo White addresses a new model for SEC enforcement. Jeh Johnson, Partner at Paul, Weiss, Rifkind, Wharton & Garrison, and former Secretary of Homeland Security, delivers keynote address on global cyber threats. Securities and Exchange Commission Chair Jay Clayton speaks at a roundtable discussion on the SEC’s enforcement priorities. Lisa Osofsky, Director, U.K. Serious Fraud Office, delivers a keynote address on the future of SFO enforcement. Deputy Attorney General Rod Rosenstein delivers a keynote address on deterring corporate crime. Mark Steward, Director of Enforcement and Market Oversight, U.K. Financial Conduct Authority, delivers a keynote address on expanding individual accountability for corporate misconduct. Former U.S. Attorney Preet Bharara reflects upon his time as a United States Attorney. Assistant Attorney General Makan Delrahim introduces a new model for incentivizing antitrust compliance programs. Kenneth Blanco, Acting Assistant Attorney General, Criminal Division, U.S. Department of Justice, delivers morning keynote at conference on the FCPA and OECD Anti-Bribery Convention. Business Law in the Public Interest The Program on Corporate Compliance and Enforcement at NYU School of Law promotes more effective corporate and white-collar enforcement and corporate compliance programs through research and meaningful engagement between the public and private sectors. Founded by Faculty Director Jennifer Arlen '86, PCCE shapes optimal enforcement policy, guides companies and institutions in improving their compliance programs, and enhances education in the fields of enforcement and corporate compliance. Read our annual report. Our Keynote Speakers Since our inception in 2014, PCCE has hosted numerous conferences, both in the US and abroad, bringing together prominent lawyers and judges to discuss important issues facing firms and enforcement officials. PCCE also has served as a venue for enforcement officials to give important policy speeches, including: US Attorney General Deputy Attorneys General Assistant Attorneys General Chairs of the Securities and Exchange Commission Chair of the Commodities Future Trading Commission Directors of Enforcement, SEC and CFTC Directors of the UK's Serious Fraud Office Former Secretary of Homeland Security Acting Director of the Financial Crimes Enforcement Network Superintendents of the NY State Dept. of Financial Services Recent Events Watch: Our Fireside Chat with SEC Chair Gary Gensler Scholarship Spotlight Research Handbook on Corporate Crime and Financial Misdealing (edited by Jennifer Arlen) brings together 13 original chapters by leading scholars that examine how to deter corporate misconduct through public enforcement and private interventions. Scholars from a variety of disciplines present both theoretical and empirical analyses of organizational and individual liability for corporate crime, liability for foreign corruption, securities fraud enforcement, compliance, corporate investigations, and whistleblowing."
