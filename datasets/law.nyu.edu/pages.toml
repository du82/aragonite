["https://www.law.nyu.edu/jddualdegreeprograms/jdma"]
title = "JD/PhD and JD/MA Programs | NYU School of Law"
description = "New York University School of Law (Law) and Graduate School of Arts and Science (GSAS) offer coordinated dual degree programs leading to a Juris Doctor (JD) and either a PhD or MA degree in two Arts and Science disciplines: Economics Politics Law and GSAS also offer dual degree programs leading to a JD and MA in the following disciplines:"
full_description = "New York University School of Law (Law) and Graduate School of Arts and Science (GSAS) offer coordinated dual degree programs leading to a Juris Doctor (JD) and either a PhD or MA degree in two Arts and Science disciplines: Economics Politics Law and GSAS also offer dual degree programs leading to a JD and MA in the following disciplines: French Studies Latin American and Caribbean Studies Law and GSAS also offer dual degree programs leading to a JD and PhD in the following disciplines: American Studies Biology Classics Comparative Literature Computer Science English French German Hebrew and Judaic Studies Italian Studies Mathematics Middle Eastern and Islamic Studies Music Neural Science Philosophy Physics Psychology (Cognition and Perception) Sociology Spanish Students enrolled in these dual degree programs will work closely with faculty advisors in both the School of Law and GSAS to develop an integrated program of study and research. The programs are particularly aimed at students interested in pursuing academic careers. We expect that students who complete the JD/PhD program will be strong candidates for faculty positions in both law schools and in arts and sciences programs. The JD/MA programs provide rigorous interdisciplinary training for students interested in legal academia, but also for students who plan to pursue other career paths related to law. These coordinated programs reduce the amount of time required to complete both degrees. The School of Law will count 12 credits of GSAS coursework toward the total of 83 credits required for the JD degree, typically allowing dual degree students to complete their JD coursework in five semesters rather than the usual six. All coursework must be approved by the respective program to count towards the dual degree program. Likewise, some law school coursework will count toward the PhD and MA program requirements, allowing students to accelerate the completion of those degrees. For students in the JD/MA program, both degrees are typically conferred at the end of four years (eight semesters) rather than the usual five years to complete both degrees separately. For students in the JD/PhD program, the JD is typically conferred at the end of the fourth year, while the student continues to complete the PhD requirements. Prospective dual degree students must apply independently to both the School of Law and GSAS and be admitted to both. Current law students or GSAS doctoral students may apply to enter a dual degree program during their first year. Students looking to start the JD/PhD program at GSAS should inquire with the School of Law about the program sequence. Please refer to the GSAS website for information regarding funding for PhD candidates. Students interested in a dual degree program are encouraged to contact Amy Chu, Senior Director of Academic Services and Registration at the School of Law (acadservices@exchange.law.nyu.edu or 212-998-6020) or Tania Barnes at GSAS (tania.barnes@nyu.edu) for more information. For questions regarding admission to the JD program, please contact the Office of JD Admissions at law.moreinfo@nyu.edu or (212) 998-6060."
year_published = 2025
clearnet = "https://www.law.nyu.edu/jddualdegreeprograms/jdma"
