["https://law.nyu.edu/global/guarini-institute"]
title = "Guarini Institute for Global Legal Studies | NYU School of Law"
description = "ABOUT THE INSTITUTE GUARINI GLOBAL LAW & TECH GLOBAL LAW FOR STUDENTS The Guarini Institute for Global Legal Studies, founded in 2018, extends and raises to a new level the international law programs and initiatives at NYU Law that have long made the Law School a leader in global legal innovation."
full_description = "About the Institute About the Institute Guarini Global Law & Tech Guarini Global Law & Tech Global law for Students Global law for Students The Guarini Institute for Global Legal Studies, founded in 2018, extends and raises to a new level the international law programs and initiatives at NYU Law that have long made the Law School a leader in global legal innovation. It facilitates student experience in NYU Law Abroad, including its platforms in Buenos Aires and Paris, international moot courts, and GlobaLex. The Institute also sponsors the International Conference Series; works jointly with numerous NYU Law centers including the Jean Monnet Center for International and Regional Economic Justice and its Emile Noël Lecture Series; and integrates the scholarship of the Law School’s Global and International faculty. Its major substantive programs include interdisciplinary study of transnational legal and regulatory issues and of the technology-driven transformation of legal services and global legal practice, ensuring that graduates are equipped with the skills that will be at a premium in a legal profession that continues to evolve. Specific initiatives housed within the Guarini Institute include Guarini Global Law & Tech, Planetary Futures, and the Global Public Investment Funds Forum."
