["http://www.law.nyu.edu/housing/faq"]
title = "Frequently Asked Questions | NYU School of Law"
description = "As an incoming student, can I get housing? Is there family housing? What type of housing is available? What are my chances of getting a studio? Is smoking allowed in the residence halls? Which building do the majority of first-year students live in? What furnishings are provided? Can I stay in New York University School of Law housing during the summer/holidays/winter break?"
full_description = "As an incoming student, can I get housing? Is there family housing? What type of housing is available? What are my chances of getting a studio? Is smoking allowed in the residence halls? Which building do the majority of first-year students live in? What furnishings are provided? Can I stay in New York University School of Law housing during the summer/holidays/winter break? Is Hayden Hall far away? What happens if I am assigned with an apartmentmate I don’t like? Is housing coed? Are pets allowed? How safe is the neighborhood? What are the housing rates? What is the phone service? What services are included in the housing fees? Is there a meal plan? 1. As an incoming student, can I get housing? As long as all payment and application deadlines are met, housing is available for all entering students if applying for a shared space only (see below for family housing limitations). Applications are automatically sent to students who have been admitted & deposited to New York University School of Law. 2. Is there family/partner housing? Yes! Please be advised, however, that our housing for family/partner is limited. While we have family/partner housing spaces for incoming students, the demand may exceed available spaces. 3. What type of housing is available? Studio, one-bedroom, two-bedroom and three-bedroom apartments are available within our residences. Our website contains information detailing options and rates for the apartment types available in our two high-rises (Hayden Hall and D'Agostino Hall). 4. What are my chances of getting a studio? In your housing options information, you will notice that a small number of studios are available. A portion of those available are suitable for family housing. D’Agostino Hall has very few available studios. Understandably, current students eligible to reserve a space during the Lottery will deplete the supply of some studios. 5. Is smoking allowed in the residence halls? The University is a smoke free campus. Accordingly, smoking is prohibited in all School of Law residence halls (apartments, common areas, terraces, balconies, etc.). Any resident or guest wishing to smoke must exit the building to do so in the designated smoking area. 6. Which building do the majority of first year students live in? First year law students live in both Hayden Hall and D'Agostino Hall. 7. What furnishings are provided? You are provided with a bed, desk, dresser (drawer space), table, and chairs. Kitchens include a refrigerator, oven, 4-burner stove, sink, and cabinets. Microwaves are not provided. Bathrooms have both tub and shower. D'Agostino bedrooms have wall lighting. All apartments have air conditioning. Bedrooms in Hayden Hall do not have overhead lighting. Halogen lamps are prohibited in all University residence halls. University furniture may not be removed from the apartments. 8. Can I stay in School of Law housing during the summer/holidays/winter break? All School of Law residences remains open over the University Winter Break and between semesters. School of Law residences remain open during the summer. Summer housing applications are available in February. 9. Is Hayden Hall far away? No. Maps may deceptively indicate that the Hayden Hall is a far distance from Vanderbilt. Hayden Hall is less than a 10 minute walk from Vanderbilt Hall (Center of Law School campus). 10. What happens if I am assigned with an apartment-mate I don’t like? Our experience shows us that this level of commitment and maturity results in remarkably few situations of apartment-mate incompatibility. However, when apartment-mates conclude that their living situation is incompatible, the Office of Residential Life, staffed with professional staff & Community Advisors, will mediate any conflicts. 11. Is housing coed? Yes, our residence halls are coed. General assignments are based on sex. Students may choose to designate an individual apartment to be coed. 12. Are pets allowed? As stated in the Housing License, which all residents signed, pets are not allowed in student apartments. Keeping or caring for pets or animals in any residence hall is not permitted with the exception of fish in a tank no larger than ten gallons, dogs identified as service animals, or emotional support animals previously approved by the Moses Center for Accessibility and Inclusive Culture. The owner of any emotional support/service animal is ultimately responsible for the animal's actions. As such, students must ensure proper noise control, hygiene, and care of their approved emotional support/service animal so that it is not disruptive to the educational pursuits of the community. Failure to do so, may result in University conduct action. 13. How safe is the neighborhood? Urban living requires that one is constantly alert, aware of their surroundings and follows basic safety precautions. Our high-rise buildings have 24-hour Door Attendants and NYU Campus Safety provides 24-hour security services. 14. What are the housing rates? Your license is for the full academic year; billing is by semester. Rates vary according to apartment type. 15. What is the phone service? NYU Net is the telephone service for all D'Agostino Hall and Hayden Hall residents. Features include touch-tone, unlimited local usage, voice-mail, and call-waiting services. There is no installation charge or required security deposit. 16. What services are included in my housing fees? Hayden Hall and D'Agostino Hall are equipped with study spaces, terraces, computer labs, WiFi, game room, local phone service, and University cable TV. Electric and gas service for all NYU School of Law residences is included in the housing rate. 17. Is there a meal plan? Meal Plan options are available."
