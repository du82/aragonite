description = "The Engelberg Center on Innovation Law & Policy at NYU School of Law examines the key drivers of innovation as well as the law and policy that best support innovation."
full_description = "Engelberg Center on Innovation Law & Policy: NYU School of LawAbout the Engelberg CenterFeatured ResearchCompetitionLitigationIan Ayres, Scott Hemphill, and Abraham L. WickelgrenShorting Your Rival: Negative Ownership as an Antitrust RemedyAntitrust authorities often have difficulty predicting whether a merger of rivals will enhance or degrade competition.Read MoreAll Engelberg Center ResearchOur PodcastsHealth Care at Reasonable Cost: The Goals of the Hatch-Waxman Act as Seen from 2024 This episode is audio from the Goals of the Hatch-Waxman Act as Seen from 2024 panel from the Engelberg Center's Hatch-Waxman at 40 and Beyond Symposium. It was recorded on September 26, 2024.Listen nowEngelberg Center for StudentsThe Engelberg Center on Innovation Law & Policy provides a unique, interdisciplinary environment where scholars can examine the key drivers of innovation as well as the law and policy that best support innovation.Students are involved in the Engelberg Center in a number of ways. They participate in events, engage with members of the Center, and work as fellows on research and projects. They can also take introductory and advanced courses on a range of topics that connect with the Center’s work.Learn MoreIn the NewsAll Engelberg Center News3D Printed Gunfight: Matthew Larosiere v. Cody Wilson in Copyright Battle 3D Printing Industry | February 19, 2025 | Michael WeinbergA dispute over 3D printed gun files could have wider implications for copyright lawAI-Generated Slop Is Already In Your Public Library 404 Media | February 04, 2025 | Jennie Rose HalperinLibrarians say that taxpayers are already paying for low quality AI-generated ebooks in public libraries.An N.H.L. Team Quickly Moved to Utah. Renaming It Is Taking Longer. The New York Times | January 30, 2025 | Jeanne FromerThe U.S. Patent and Trademark Office has rejected several proposed new names for the Utah Hockey Club, formerly the Arizona Coyotes.Toolkit aims to help museums share