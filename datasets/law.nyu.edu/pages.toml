["http://www.law.nyu.edu/node/29142"]
title = "Applying for Housing | NYU School of Law"
description = "Access the NYU Law Housing Portal and apply for the 2023-2024 academic year"
full_description = "Access the NYU Law Housing Portal and apply for the 2023-2024 academic year What you need to know to complete a housing application: University Identification Number: Only those students who have confirmed their intent to enroll and been assigned a University Identification number (UID) can apply for housing. Permanent Mailing Address: If you do not have a permanent address, please provide the address of where you receive mail. Current Mailing Address: This address will be used to correspond with you until you move into Law School housing. Valid Until: Please include the last date you may be reached at your current mailing address. Family/Partner Housing is available for couples where at least one adult is an NYU student. The student member of the family is the licensee and is responsible for the entire apartment rent. Family housing is also available for families with children. Family/partner housing is limited and subject to availability. Room Type Preference: Indicate the building and type of apartments you would prefer in order of preference. Price variations may reflect apartment view, amenities, and square footage. We encourage you to review the Rates & Options prior to submitting your application. Apartment-mate Preference: Specific apartment-mates may be requested (indicate the name and ID number) but cannot be guaranteed. Apartment-mate requests must be mutual, and each apartment-mate must submit an individual application. Lifestyle Profile: Please note information that may be helpful in assigning you an apartment and apartment mate(s). This information will be considered and accommodated if an appropriate match is available. The Office of Residential Life is unable to accept requests based upon race, religious creed, color, national origin, sexual orientation, age, or marital or parental status. Smoking is prohibited in all School of Law residence halls (apartments, common areas, terraces, balconies, etc.). Request for Reasonable Accommodations: In accordance with the Americans with Disabilities Act, New York University will provide accessible housing for a student eligible to reside in School of Law housing. All accommodations are determined on a case-by-case basis according to documented disability-related need and prevailing standards. In order to be considered for disability-related accessible housing, you must review the Informational Packet for Requesting Accessible Housing and Reasonable Housing Accommodations, complete the Request for Disability-Related Accessible Housing and return it to the NYU Moses Center for Accessibility and Inclusive Culture, 726 Broadway, 2nd Floor, New York, NY 10003, ATTN: Reasonable Housing Accommodations. You can also call 212-998-4980(/voice/TTY). Information provided to the Moses Center is kept confidential and only will be shared within the University as is necessary to evaluate the request. License Duration: Check the license type box on the application indicating the length of agreement. Cancellation Requests: Student cancellation information. Emergency Contact: Please provide a person's name for us to contact in case of an emergency. Confirmation of Assignment: The Office of Residential Life will confirm your assignment by sending you a Notification of Assignment via email to your NYU email account. License: All applicants must agree to the conditions of the Housing License. Early Arrival: Students with a confirmed housing assignment may apply to arrive prior to the August 26, 2023 check-in date (August 23, 2023 for JD1 students) by submitting an Early Arrival Application. The early arrival application will be available starting in June, and will begin processing early arrival housing assignments via email the second week of July and weekly thereafter."
