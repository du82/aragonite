["https://law.nyu.edu/students/career-resources"]
title = "Career Resources | NYU School of Law"
description = "Whatever career path you want to pursue, NYU Law is there to help you take the next step."
full_description = "Whatever career path you want to pursue, NYU Law is there to help you take the next step. Private Sector The Office of Career Services offers one of the most extensive placement programs in the country, organizing numerous career panels, job search skills workshops, webinars, networking events, practice interviews, and individual coaching sessions for students. Public Service The Public Interest Law Center provides the most comprehensive public service infrastructure of any law school in the nation, offering a wide variety of funding opportunities and career planning programs to students and alumni. NYU Law's culture of public service is pervasive: about half of the first-year class spends the summer working in public interest internships. Clerkships The Judicial Clerkship Office offers individual counseling and guidance for those students and alumni interested in clerking. Each year on average about 130 graduates clerk, and about 20% of each graduating class eventually clerks. NYU has launched a Clerkship Diversity Program that provides faculty and alumni mentoring and advice designed to support students typically underrepresented in the clerkship process. Academic Careers The Academic Careers Program offers individual counseling, support, information, and special programming to those interested in teaching law. The Furman Program is unique in its commitment to training individuals to obtain and hold jobs at the very top levels of the legal academy. The Samuel I. Golieb Fellowship Program is the oldest legal history program of its kind. What if you're undecided? Don't worry if you're not sure what career you want. You have time to decide. Begin by thinking about what sparks your interest. What was your favorite 1L class? What student groups do you belong to? What events have you enjoyed attending? Why did you apply to law school in the first place? Once you have a sense of the answers, reach out to academic advising to make a counseling appointment. They are happy to help you."
