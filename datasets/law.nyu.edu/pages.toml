oot Court Board (MCB) is not only a moot court competition team, but also a journal. Each year MCB… Student Spotlight: Kiley Burns ’25 Tell us about your experience as professional development co-chair of NYU Law Women. Serving as professional development co-chair of Law Women has been an incredibly rewarding experience. The Law Women Board is a supportive, fun group of women and… Student Spotlight: Aidan McGirr ’25 IILJ Joyce Lowinson Scholar Tell us about your educational background. What brought you to studying law at NYU? When doing one of those connect-the-dots paintings, the image never really makes sense until you have all of the dots together. That is… Student Spotlight: Ian Leach ’25 Tell us what it's been like taking on a new role as editor-in chief of NYU Law Review. It's been a very exciting whirlwind since I was elected last month. We've already kicked off our articles and online selection process, we're working directly… Student Spotlight: Alex Nehrbass ’25 What is your favorite part about being an NYU Law student? In a lot of ways, coming to NYU has felt like finding my way home. I was born in New York City to a Russian mother and German father who’d only recently immigrated to the US, and we… Student Spotlight: Lily Liu ’25 You graduated from NYU Gallatin with a BA in Politics through Art History, and serve as publicity chair of the Art Law Society. Tell us about your interest in the connection between art and law. Growing up in an artistic family, I have always been… Pagination Current page 1 Page 2 Page 3 Page 4 Next page ›› Last page Last »"
