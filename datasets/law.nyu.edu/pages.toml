["http://www.law.nyu.edu/housing/emergencyandfiresafety"]
title = "Emergency and Fire Safety | NYU School of Law"
description = "The New York Education Law 6438 (Kerry Rose Sprinkler Notification Law) requires all NYS institutionally-owned or operated housing facilities, to disclose to students, a description of the facility’s fire safety system. For information regarding the sprinkler systems in each NYU residence hall, please go"
full_description = "The New York Education Law 6438 (Kerry Rose Sprinkler Notification Law) requires all NYS institutionally-owned or operated housing facilities, to disclose to students, a description of the facility’s fire safety system. For information regarding the sprinkler systems in each NYU residence hall, please go here. Fire Safety Procedures Fire safety is something that the entire University community takes very seriously. Please be sure to familiarize yourself with the fire procedures of your building. Know the location of all stairwells and exits so that you know how to exit from anywhere in the building and the location of pull stations. Whenever the fire alarm in the building sounds, you must evacuate immediately. If, however, your door is hot to the touch, remain inside, seal the door with wet towels, and contact the Front Desk by phone or intercom immediately to report your location. As you are exiting the building at the sounding of any fire alarm, please knock on apartment doors on your way to the nearest stairwell to help alert fellow residents to the potential danger. Once you have exited the building, please move away from the building and follow the directions of personnel from Residence Services, NYU Campus Safety and the New York Fire Department. You will be permitted to re-enter the building once all danger is gone. If residents must remain out of the building for an extended time, staff members will direct you to an alternate, safe location. All our residential facilities are located only minutes away from NYFD stations; therefore, trained fire-fighting personnel will respond quickly to any alarm activation. Please do not try to fight a fire yourself; leave this to the experts and remove yourself from danger. The fire alarm in both D'Agostino and Hayden is a coded interior fire alarm system and when activated, alarms sound throughout the building. Alarms are activated by any of the following: hallway smoke detector, heat detector, sprinkler waterflow, and pull stations. Apartment smoke detectors serve as local alarms in your apartment only. If an apartment smoke detector is activated by cooking, please open your apartment windows to air out your apartment.If an apartment smoke detector is activated by cooking, please open your apartment windows to air out your apartment. Do not open the door leading to the hallway as this may trigger the building system alarm, thereby initiating NYFD response.Do not open the door leading to the hallway as this may trigger the building system alarm, thereby initiating NYFD response. When the air has cleared in your apartment, your apartment smoke detector alarm will silence and reset automatically. Hayden and D’Agostino Halls have fire safety sprinklers throughout. This includes all public spaces and the kitchens and bedrooms in every apartment. Please review the University's Fire Safety Guidelines. These guidelines were developed in response to a recently re-written New York City building code which mandates that building owners prepare and distribute such a document. Links The following websites are great resources for further information about fire prevention and safety: New York Fire Department Fire Safety & the Use of Candles High-Rise Fire Safety If you have any questions or concerns regarding fire safety, please contact the Office of Facilities Services located in Hayden Hall or at law.housingfacilities@nyu.edu."
year_published = 2025
clearnet = "http://www.law.nyu.edu/housing/emergencyandfiresafety"
