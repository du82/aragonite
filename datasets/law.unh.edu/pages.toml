title = "Student Competition | Franklin Pierce School of Law"
description = "IDEA Student IP Writing Competition The Law Review of the Franklin Pierce Center For Intellectual Property is proud to announce our Annual IDEA Student Intellectual Property Writing Competition."
full_description = "IDEA External Student IP Writing Competition IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property is proud to announce our Annual IDEA Student Intellectual Property Writing Competition. We are looking for external, publishable papers addressing compelling issues in intellectual property law. Competition Details To be eligible for consideration, the paper must focus on intellectual property law and have been written solely by a student at another law school. Submissions should be double-spaced (except for footnotes, which should be single-spaced). The font size should be 12 point at a minimum. All margins should be one inch at a minimum. Students should follow the format presented in The Bluebook: A Uniform System of Citation (21st ed.). Electronic submissions are strongly preferred, though paper submissions also will be accepted. The deadline for submitting notes is August 1, 2024. The awards include: 1st prize - $500 and publication in IDEA®; 2nd prize - $200. Entry Form Entry Form for 2024 Contact Information: IDEA Student Intellectual Property Writing Competition IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property, University of New Hampshire Franklin Pierce School of Law 2 White Street Concord, NH 03301."
