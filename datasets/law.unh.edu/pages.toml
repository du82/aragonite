title = "Advanced Standing Program | Franklin Pierce School of Law"
description = "UNH Law offers highly qualified foreign trained lawyers advanced standing admission to its J.D. program. This program allows foreign lawyers to earn their J.D. in two years. This program is ideal for international lawyers who are also seeking admissi"
full_description = '''UNH Franklin Pierce offers highly qualified foreign trained lawyers advanced standing admission to its J.D. residential program. This program allows foreign lawyers to earn their J.D. in two years. This program is ideal for international lawyers who are also seeking admission to practice law in the United States, particularly because New Hampshire is a uniform bar examination jurisdiction. Apply Now Through LSAC Program Highlights Applicants may transfer in up to 28-transfer qualifying credits for prior law study. Advanced Standing applicants do not need to take the LSAT or another entrance exam for admission, however, if applicable, must take the TOEFL/IELTS test and achieve a satisfactory score. Students follow a rigorous course of study that prepares them for practice and the bar exam, including: Administrative Process Article II Sales Business Associations Civil Procedure Contracts* Constitutional Law Criminal Law Criminal Process Evidence Torts The Legal Profession* Legal Research and Information Literacy* Legal Writing I* Legal Writing II Professional Responsibility Property Upper Level Skills Upper Level Writing Wills, Trust & Estates A clinic or J.D. legal residence of no more than 4 credits The courses designated with * may not be satisfied by law study at another institution, except in unusual circumstances. Request Information .captcha { padding-bottom: 1em !important; } .wForm .captcha .oneField { margin: 0; padding: 0; } // initialize our variables var captchaReady = 0; var wFORMSReady = 0; // when wForms is loaded call this var wformsReadyCallback = function () { // using this var to denote if wForms is loaded wFORMSReady = 1; // call our recaptcha function which is dependent on both // wForms and an async call to google // note the meat of this function wont fire until both // wFORMSReady = 1 and captchaReady = 1 onloadCallback(); } var gCaptchaReadyCallback = function() { // using this var to denote if captcha is loaded captchaR