title = "UNH Sports Law Review | Franklin Pierce School of Law"
description = "The UNH Sports Law Review provides a platform for scholars in the sports law community to publish works on pressing issues within the ever-growing area of sports law."
full_description = 'The UNH Sports Law Review is published annually during the Spring semester. The primary purpose of the UNH Sports Law Review is to provide a platform for scholars in the sports law community to publish works on pressing issues within the ever-growing area of sports law. Prior issues of UNH Sports Law Review Rights and Permissions Any questions, comments, or concerns about rights and permissions for our journal should be directed to Professor Michael McCann at Michael.McCann@law.unh.edu. Contact Us Michael.McCann@law.unh.edu (603) 513-5254 Submission Guidelines We are currently accepting submissions for Volume 5 on a rolling basis. Please email all submissions, accompanied by a resume/CV, to Nicole Sterste, Editor-in-Chief, at nicole.sterste@law.unh.edu. Any questions regarding submission guidelines and publishing should be directed to nicole.sterste@law.unh.edu. Authors can also submit here Michael McCann Breaks Down NCAA ProposalWednesday, December 06, 2023 Michael McCann, Director of the Sports and Entertainment Law Institute at UNH Franklin Pierce, Law Professor, and Legal Analyst at Sportico, breaks… Learn More Announcement for the UNH Sports Law Review Publications of Volume 2Thursday, September 28, 2023 The UNH Sports Law Review just published Volume 2, Issue 1 (2023). Learn More Final Call for Papers: UNH Sports Law Review Vol. 2Friday, February 10, 2023 The UNH Sports Law Review is making its final call for article submissions for its second issue. The final day to submit articles will be on 2/28/23… Learn More Call for Papers: UNH Sports Law Review Vol. 2Tuesday, November 01, 2022 The UNH Sports Law Review is calling for article submissions for its second issue. There will be a second call for articles made on 2/2/23, and the… Learn More UNH Sports Law Review Volume 1, Issue 1Friday, August 12, 2022 We are proud to announce the first edition of the UNH Sports Law Review is published. Volume 1, Issue 1 is focused on "Current Issues in… Learn More UNH Sports Law Review 2022-2023 Editorial BoardTuesday, March 22, 2022 We are proud to announce the 2022-23 Editorial Board of the UNH Sports Law Review! Learn More The Legal Impact: UNH Sports Law ReviewWednesday, February 23, 2022 3L Dylan Harriger, Founding Editor-in-Chief for the UNH Sports Law Review, discusses the role of law journals, the breadth of subjects covered under… Learn More UNH Sports Law Review Journal Launches Inaugural IssueFriday, February 18, 2022 As a 2L, Dylan Harriger, J.D. Candidate ’22, co-founded the Student Sports Law Network with fellow law students from Florida State, Loyola, and the… Learn More UNH Sports Law Review Inaugural Editorial BoardWednesday, February 16, 2022 We are excited to announce the inaugural editorial board for the UNH Sports Law Review, congratulations to all of them! Learn More Call for Papers: Current Issues in Collegiate Athletics Tuesday, January 25, 2022 The UNH Sports Law Review is a new student-run publication focusing on pressing issues within the realm of sports law. The purpose of the Sports Law… Learn More'
