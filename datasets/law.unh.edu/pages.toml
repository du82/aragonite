["https://law.unh.edu/2024-intellectual-property-summer-institute"]
title = "2024 Intellectual Property Summer Institute | Franklin Pierce School of Law"
description = "The Intellectual Property Summer Institute hosted by the world-renowned Intellectual Property law school, UNH Franklin Pierce School of Law and co-sponsored by the premier patent licensing firm, Marconi."
full_description = "2024 Intellectual Property Summer Institute Concord, New Hampshire Session 1: June 7-10 Session 2: June 11-14 Register Now Professionals Law students from other law schools What is IPSI? IPSI provides students and lawyers with a unique opportunity to access world-class faculty, researchers, and industry professionals and learn about today’s trending topics in intellectual property to stay in the know and ahead of the curve. What You’ll Experience Engage with industry leaders at Fortune 500 companies and Am Law 100 firms and our expert faculty and alumni as they give you an insider's look into the future of IP. Participate in professionalism events with in-the-trenches leaders from different companies and firms all over the world. Immerse yourself in the art and science of the study of IP by taking a “deep dive” into cutting-edge topics that are changing the way we interact with the world. Check out our class offerings! Session 1: June 7-10 Intellectual Property Taxation 9AM - 12PM EST Professor Mary LaFrance, Professor of IP Law, University of Nevada at Las Vegas Students will learn the principles of federal income taxation that are relevant to the creation, acquisition, exploitation, disposition, and infringement of different kinds of intellectual property. Upon completing the course, they will be able to identify tax issues arising from a client’s activities related to intellectual property, explain the relevant principles to clients, and advise clients on the necessity of obtaining expert tax advice regarding those activities. Pharmaceutical Patents: Drug Wars: Patent Protection in the Life Sciences Industry 1:30PM - 4:30PM EST Professor Rich Kurz, Partner, Haug Partners In the life sciences industry, which encompasses pharmaceuticals and biopharmaceuticals, patent protection and exclusivity rights are of critical importance. For industry innovators, patents and exclusivity rights are essential for companies and academic institutions to protect and recoup the very substantial research and development investments that are made to discover and develop new medicines and biologics that can treat and cure ailments, diseases, and other medical conditions. For generic drug and biosimilar manufacturers, challenging those patents—and the financial incentives to do so—allows them to manufacture and market affordable medicines with relatively small investments. The Federal Courts, U.S. Congress, and U.S. Food and Drug Administration (FDA) have created a body of case law, statutes, and regulations that are tailored to this industry. These laws and regulations provide both incentives to innovators to bring new products to market, and also incentives to those who seek to market generic equivalents or biosimilars of the products before the innovators’ patent rights and exclusivities expire. This course will delve into many of the laws and regulations that should be understood by anyone who is interested in patent litigation, prosecution, or licensing in the life sciences industry. Session 2: June 11-14 INTRO to digital brand protection 9AM - 12PM EST Professor Brian Winterfeldt, Founder and Principal, Winterfeldt IP Group This course will offer an overview of how trademarks are represented in the digital world, from domain names and websites to cutting-edge technologies such as NFTs, AI and the metaverse, and the specialized strategies needed to protect them across all online spaces. The course will also offer practical guidance on developing holistic intellectual property portfolios that integrate digital brand protection, exploring the specific needs of a variety of industries and business concerns. Monetizing Intellectual Property: Strategies and Techniques Utilized by Leading Companies 9AM - 12PM EST Professor Ilkka Rahnasto, President, Avanci Broadcast; former Head of Intellectual Property, Nokia This course considers how companies with varying business models use their intellectual property to create value for their respective company. The course will cover patent, trademark, and copyright monetization, illustrating how IP is used to create revenue. More specifically, the course will cover patent licensing monetization, trademarks and franchising, and music licensing. The course will have industry speakers from various companies. Artificial Intelligence and the Future of the Law: Perspectives from Industry 1:30PM - 4:30PM Professor Micky Minhas, IP Center Executive Director, UNH Franklin Pierce; Senior Vice President, Marconi; former Chief Patent Counsel, Microsoft Data is often referred to as “the new oil” – while unrefined it holds no value, properly gathered and used it powers entire industries. The collection, use, and marketing of personal data is one of the most significant resources of our time. The limits of using data are typically governed by an evolving body of privacy, copyright and trade secret laws. Increasingly, national security is also being used as a reason to limit the exploitation of data. This course will explore the various legal regimes that apply to regulate data, its use in artificial intelligence, large language models, copyright and fair use, privacy, property, and security, and where there are gaps and overlaps. The course will discuss how the use of AI is treated at the local, national, and international level, and what conflicts and public policy questions result. Fashion Law 1:30PM-4:30PM EST Professor Dawn Buonocore, VP, Enforcement and AGC, Calvin Klein Students will study the main subject areas that comprise “Fashion Law”, including licensing, privacy and security, international intellectual property portfolio management, domain portfolio management, sustainability and claim substantiation, anti-counterfeiting, social media/advertising, virtual goods and use of AI. Through in-depth exposure to each of these areas, students will be able to navigate complex real world brand issues, manage risk analysis, and have a working understanding of how intellectual property interfaces with fashion brands. Students will also be given an infrastructure and step-by-step guide with which to establish or improve an existing brand protection program. In class hours will be satisfied through topic specific presentations with outlines and summaries of pertinent law and its application along with the review and discussion of recent case law, administrative guidelines, and cutting-edge fact patterns currently in the news. Each topic will be analyzed and presented from the perspective of US based outside counsel, followed by the corporate perspective from the US (Americas), EMEA and APAC, as applicable. Out-of-class hours will be dedicated to the review of case law, white papers, Green Guidelines, FTC and US Customs regulations, and industry/trade association articles. ASIPI Designated Professor: Fabrizio Modica We are excited to announce that Fabrizio Modica will be the designated professor representing ASIPI at IPSI 2024. Modica will participate in all 6 courses at the IP Summer Institute. About: Modica is a lawyer with a background in Intellectual Property Law, holding degrees from Catholic University of Asuncion and Austral University of Buenos Aires, including an LLM and a PhD. He is a Partner at Bareiro Modica Law Firm in Paraguay and a visiting professor and researcher at various universities in the American region, specializing in IP law. He additionally serves as Vice President of the Paraguayan Association of Intellectual Property Agents (APAPI), Chair of the University Rol Committee for IP Development, and Secretary of the ASIPI Academy of the Inter-American Association of Intellectual Property (ASIPI). IPSI Micro-credentials As an exciting feature of IPSI courses, attendees may earn a micro-credential and badge for their participation! Intellectual Property Summer Institute (IPSI) ASIPI Scholarship Opportunities UNH Franklin Pierce is proud to enter into an exclusive agreement with the Inter-American Association of Intellectual Property (ASIPI) that will launch intellectual property leaders across Latin America through an educational partnership and scholarships for ASIPI members. Our IPSI program will be offering 3 full tuition scholarships every year from 2023-2028. Learn More Meet Your Academic IP Leader Micky Minhas, JD/LLM '97 Director, Franklin Pierce Center for Intellectual Property Micky Minhas is Senior Vice President at the Marconi Group, an intellectual property licensing and investment firm based in Dallas, Texas. As part of the Marconi management team, he plays a vital role supporting Marconi’s vision of transforming the fundamentals of intellectual property licensing through providing better ways to share patented technology. Before joining Marconi in March 2020, Micky was Chief Patent Counsel for Microsoft, managing the Microsoft patent group since 2012. Micky managed a team of over one hundred patent professionals who were primarily responsible for outbound and inbound intellectual property licensing, patent strategy, patent acquisitions and divestitures. He also managed patent preparation and prosecution of patents and was responsible for Microsoft’s conflicts, indemnification and prelitigation practice. During his time, Microsoft had a significant patent licensing business resulting in significant revenue for the company, as well as placement of Microsoft products on Android based mobile devices. Prior to Microsoft, Micky served for 13 years as Vice President of Intellectual Property Strategy at Qualcomm in San Diego, California. There, Micky was responsible for establishing the company’s 4G patent portfolio as well as intellectual property aspects of Qualcomm’s mergers and acquisitions practice. As part of his time with Qualcomm, Micky was based in Munich, Germany where he managed the company’s patent opposition practice. Micky holds a BS in Electrical Engineering from Marquette University (’89), an MS in Electrical Engineering from George Washington University (’93) and a JD and LLM from the University of New Hampshire School of Law (’97), where he continues to work as the Director of the Franklin Pierce Center for Intellectual Property. Need more information? Contact us at ip.center@law.unh.edu FAQs expand all Who should attend? This program is for legal professionals, recent law school graduates, law students entering their 2L or 3L year, and current UNH Franklin Pierce School of Law graduate students. UNH Franklin Pierce MIP alums are also invited to join the program. When will it run? All sessions will be held in-person in the Concord, NH from June 7-14. What will I gain by enrolling? Gain expertise in a specific area of the law from experts in the field which will allow you to standout in the marketplace and make connections in the industry. Each class is 1 credit for students enrolled in our degree programs. Is financial aid available? UNH Franklin Pierce law students can consult the Financial Aid webpage. Visiting law students should consult with financial aid at their home law schools. How much will it cost? Students taking courses for credit can find pricing at https://www.unh.edu/business-services/tuitlaw US participants taking courses not-for-credit will be charged $750 per course. International participants taking courses not-for-credit will be charged $500 per course. Travel and Lodging Information Attendees are responsible for all travel and lodging costs associated with attending IPSI. IPSI courses will be held in Concord, NH. Travel By Air Manchester-Boston Regional Airport (MHT) is 24 miles south of Concord and Boston's Logan Airport (BOS) is 70 miles south of Concord. Manchester-Boston Regional Airport (MHT) Logan Airport (BOS) By Bus Concord Coach Lines offers multiple daily connections between Concord, Logan Airport, and Boston's South Station. Concord Coach Lines Boston's South Station By Train Amtrak offers regularly scheduled routes into Boston, arriving at the South Station terminal. You may then take the bus from South Station to Concord. Amtrak South Station Where to Stay Hotel Accommodations Name Address Phone Best Western 97 Hall St., Concord, NH Pet friendly (603) 228-4300 Centennial Hotel 96 Pleasant St., Concord, NH The historic hotel is located in downtown Concord. It offers complimentary wireless Internet access. At the hotel you can dine at the popular Granite Restaurant & Bar and savor decadent dishes inspired by French, Mediterranean and Asian culinary styles. Room amenities include Terry Cloth full-length robe and plush slippers, and 32 “LCD TV with DVD/VCR. It also offers a 24 hours fitness center. The hotel is approximately a 3-minute drive to the law school. (603) 227-9000 Comfort Inn 71 Hall St., Concord, NH (603) 226-4100 Courtyard Marriott 70 Constitution Ave., Concord, NH (603) 225-0303 Concord Fairfield Inn by Marriott 4 Gulf St., Concord, NH The hotel is locate in Concord, NH. From the hotel you can walk to the Common Man Restaurant. It is located minutes from Downtown Concord with boutique shops and eclectic dining. The hotel offers an indoor pool and whirlpool and fitness center. The hotel also serves complimentary breakfast. There is free internet access throughout the hotel. Check in begins at 3:00pm and Check out is at 12:00pm (noon). The hotel is approximately a 6-minute drive to the law school. (603) 224-4011 Hampton Inn 515 South St., Bow, NH UNH Franklin Pierce Law rate $109 per night. The hotel is located in Bow, NH just off Interstates 89 and 93 and less than 1 mile from Concord, New Hampshire’s capital. The hotel offers free hot breakfast buffet every day. Every room includes free internet access and a 32-inhc HDTV. The hotel also has a heated indoor swimming pool and a gym/fitness center. Check in begins at 3:00pm and Check out is at 12:00pm (noon). The hotel is approximately an 8-minute drive to the law school. The hotel is currently undergoing renovations so certain areas of the hotel may be closed to the public. (603) 224-5322 Holiday Inn 172 N. Main St., Concord, NH Within walking distance to campus, approx. 8 blocks. (603) 224-9534 Hotel Concord 11 S. Main St., Concord, NH The hotel is located in the heart of downtown Concord with close proximity to the State House and many shops and restaurants. Light breakfast fare, such as pastries, fruit, juices, coffee and tea, is offered every morning. Room amenities include 55 to 65-inch flat-screen TVs, Alexa-enable devices, and complimentary high-speed internet. It also offers a gym that is open 24 hours a day. The hotel is approximately a 5-minute drive to the law school. (603) 504-3500 Red Roof Inn 516 Route 106 S, Loudon, NH 6 miles from campus Pet friendly (603) 225-8399 Residence Inn by Marriott 91 Hall St., Concord, NH Pet friendly (603) 226-0012 Tru by Hilton 406 South Main Street, Concord, New Hampshire The hotel is located off I-93 and near I-89. New Hampshire State House and New Hampshire Historical Society are within 10 minutes, and UNH Franklin Pierce School"
