["https://law.unh.edu/about/mission"]
title = "Mission | Franklin Pierce School of Law"
description = "The law school’s mission is: [T]o provide its students with the best possible legal education. UNH Franklin Pierce is a community of scholars, oriented towar"
full_description = "The law school’s mission is: To provide its students with the best possible legal education. UNH Franklin Pierce is a community of scholars, oriented towards the practice of law, who teach, learn, and empower others to contribute productively to a global legal system. Students from around the world with diverse experiences engage in active, practice-based learning in small, cooperative, and interactive learning environments. While traditional areas of law and emerging specialties are taught, the intellectual property law curriculum, one of the broadest in the country, is continually emphasized and improved. Graduates are highly capable, confident professionals who will serve clients, employers, and the public with integrity and excellence. The university articulates its mission as follows: The University of New Hampshire is the state’s public research university, providing comprehensive, high-quality undergraduate programs and graduate programs of distinction. Its primary purpose is learning: students collaborating with faculty in teaching, research, creative expression, and service. The university has a national and international agenda and holds land-grant, sea-grant, and space-grant charters. From its main campus in Durham, its college in Manchester, and the Franklin Pierce School of Law in Concord, the University serves New Hampshire and the region through continuing education, cooperative extension, cultural outreach, economic development activities, and applied research. The university is distinguished by its commitment to high quality undergraduate instruction, select excellence in graduate education, relatively small size, a location in a beautiful and culturally rich part of the seacoast of New England and a strong sense of responsibility for this special place, a commitment to serving the public good, and our emergence over the past decade as a significant research institution. The dedication of our faculty to the highest academic standards infuses all we do with the excitement of discovery. The law school and university’s missions and strategic visions are compatible and, indeed, complementary. Therefore, though the law school has transitioned from a private, independent law school to a public university law school, its core mission remains providing an academic program guided by sound legal education principles."
