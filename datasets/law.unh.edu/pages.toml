["https://law.unh.edu/academics/journals/idea"]
title = "IDEA | Franklin Pierce School of Law"
description = "IDEA: The Law Review of the Franklin Pierce Center for Intellectual Property"
full_description = "IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property IDEA is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA has provided practical articles relating to patent, copyright, trademark, trade secret, unfair competition, general intellectual property, and law and technology issues from around the world. To view previous issues of IDEA, visit the Franklin Pierce Center for Intellectual Property's IP Mall. Contact Us Email: idea@law.unh.edu Phone: (603) 228-1541 Fax: (603) 513-5238 expand all Rights and Permissions To discuss the rights and permissions policies of this publication, or to request rights and permissions to use content in any manner, please contact Professor Jon Cavicchi or call 603-513-5139. Subscriptions Please download and mail/fax a completed Subscription Form with check to: IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property University of New Hampshire Franklin Pierce School of Law 2 White Street Concord, NH 03301 USA Back issues can be ordered from: William S. Hein & Co., Inc. 2350 North Forest Road Getzville, NY 14068 If you have any questions about or problems with your subscription, please contact subscriptions@law.unh.edu. Submission Guidelines Thank you for your interest in publishing with IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property. IDEA welcomes intellectual property-related articles, commentaries, and essays that offer novel, thoughtful, well-researched, timely, practical, and/or controversial viewpoints. Authors in the legal, business, scientific, corporate, and technology disciplines are encouraged to submit their intellectual property-related articles, commentaries, and essays for possible publication. Preferred topics of interest are domestic and international patent, copyright, trademark, trade secret, unfair competition, licensing, technology transfer, and other intellectual property issues. For citations and general questions of style, please follow The Bluebook: A Uniform System of Citation (19th ed.) and The Chicago Manual Of Style (16th ed.). Articles are not limited in length. Submissions can be made via Scholastica, Expresso or via e-mail. Submissions made via e-mail should be in one of the following formats: Microsoft® Word (preferred), WordPerfect®, or Rich Text Format (RTF). Authors may also submit via mail, but must include four copies of the article, commentary, or essay. Graphics should be submitted in Microsoft® Visio® or PowerPoint® format. Authors are responsible for obtaining any necessary permission to use graphics in publication. Materials submitted for consideration become the property of IDEA and will not be returned. Submissions or questions should be addressed to: IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property ATTN: Lead Articles Editor University of New Hampshire Franklin Pierce School of Law Two White Street Concord, NH 03301 USA About IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property, formerly IDEA: Intellectual Property Law Review (ISSN 0019-1272) is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA has provided practical articles relating to patent, copyright, trademark, trade secret, unfair competition, general intellectual property, and law and technology issues from around the world. The journal's mission is to be recognized worldwide as the premier intellectual property publication providing practical articles which address new, controversial, and potential developments in intellectual property and related fields. The History of IDEA The Franklin Pierce Center for Intellectual Property at the University of New Hampshire School of Law is home to IDEA: The Law Review of the Franklin Pierce Center for Intellectual Property — one of the oldest intellectual property publications in the world. During the 2012–2013 academic year, IDEA published its 53rd volume. IDEA's history began in 1957, the year the Patent, Trademark & Copyright Journal of Research & Education was first issued by the Patent, Trademark and Copyright (PTC) Research Foundation. Established in 1949 as a nonprofit foundation at George Washington University, the well-known PTC Research Foundation is now the research and educational arm of the Academy of Applied Science relating to intellectual property, including patents, trademarks, copyrights, and scientific or technical information. Many current intellectual property practitioners, academicians, industrialists, and government officials may have forgotten the genesis of the PTC Research Foundation. The PTC was founded by the patent section of the American Bar Association and was formed to serve the United States and the world at large. In 1973, Robert Rines founded the Franklin Pierce Law Center with a specialty in training lawyers in the area of intellectual property law. That same year, the Law Center also became the home of the PTC Research Foundation and IDEA. In 1999, the Academy, recognizing the importance of continuously advancing education, knowledge, and understanding of the law as it affects the progress of science and the useful arts in innovative processes, became the official home for the PTC Research Foundation. IDEA remained a Pierce Law publication at the time of the relocation of the PTC in 1999, where it continues to serve as a well-respected intellectual property law review of academic note with interdisciplinary and practical features. In 2010, Franklin Pierce Law Center became the University of New Hampshire School of Law. In 1977, the publication first incorporated IDEA in its title. In 2002, the journal’s name was changed from IDEA: Journal of Law and Technology to its current name, IDEA: The Intellectual Property Law Review. Though the name of the journal has changed a few times over the years, the journal continues to provide practical articles that address new, controversial, and potential developments in intellectual property law. Moreover, the publication continues to provide a forum for domestic and international authors to publish cutting-edge articles on intellectual property law topics. IDEA External Student IP Writing Competition IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property has held an Annual IDEA Student Intellectual Property Writing Competition for decades. We are looking for external, publishable papers addressing compelling issues in intellectual property law. More details IDEA Volume 65: Associate Editors' Notes Announcement Friday, February 14, 2025 In this blog, we want to showcase our Associate Editors' notes and recognize their hard work throughout the drafting process. Learn More IDEA Volume 65, Number 1 Tuesday, December 17, 2024 IDEA is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA ha... Learn More IDEA Volume 65, Special E-Issue Thursday, September 26, 2024 This year, The University of New Hampshire Franklin Pierce School of Law and the Inter-American Association of Intellectual Property (ASIPI) announced... Learn More IDEA External Student IP Writing Competition 2024 Winners Thursday, September 05, 2024 IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property is thrilled to announce the winners of our Annual IDEA Student Intellect... Learn More IDEA Volume 64, Number 3 Monday, June 17, 2024 IDEA is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA ha... Learn More IDEA Volume 64, Number 2 Wednesday, March 20, 2024 IDEA is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA ha... Learn More IDEA Volume 64, Number 1 Wednesday, January 03, 2024 IDEA is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA ha... Learn More IDEA Volume 64: Associate Editors' Notes Announcement Tuesday, December 05, 2023 In this blog, we want to showcase our Associate Editors' notes and recognize their hard work throughout the drafting process. Learn More IDEA Volume 63, Number 3 Wednesday, June 21, 2023 IDEA is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA ha... Learn More IDEA Volume 63, Number 2 Tuesday, March 28, 2023 IDEA is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA ha... Learn More Pagination Current page 1 Page 2 Page 3 Next page ›› Last page Last »"
