full_description = '''In recognition of mastery in their studies of sports law or entertainment law, University of New Hampshire Franklin Pierce School of Law students can earn a sports law certificate or an entertainment law certificate (or both). A UNH Franklin Pierce certificate in sports law or entertainment law is a valuable resource for our students when they interview with sports and entertainment law employers. The certificate signifies the student is ready to practice in the sports or entertainment law fields and demonstrates the potential for excellence as a sports lawyer or entertainment lawyer. Each certificate requires completion of 15 credit hours in core and related courses, and a grade of a B- or better in every certificate course. Students may satisfy up to three credits of each certificate’s requirements by participating in a relevant legal residency, summer job or internship, or law school clinic that aids in the development of skills and experiences relevant to the practice of sports or entertainment law. Appropriate topics, industries, and practice areas include but are not limited to intellectual property, licensing, contracts, antitrust, employment law, labor law, advertising law, media law, broadcasting law, video game/Internet law, apparel/fashion law, equipment law, alternative dispute resolution, immigration law, transactional work, or general litigation. Professor Michael McCann is the program director. Apply Now Through LSAC Request Information .captcha { padding-bottom: 1em !important; } .wForm .captcha .oneField { margin: 0; padding: 0; } // initialize our variables var captchaReady = 0; var wFORMSReady = 0; // when wForms is loaded call this var wformsReadyCallback = function () { // using this var to denote if wForms is loaded wFORMSReady = 1; // call our recaptcha function which is dependent on both // wForms and an async call to google // note the meat of this function wont fire until both // wFORMSReady = 1 and captchaReady = 1 on