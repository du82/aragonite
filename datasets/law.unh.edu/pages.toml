["https://law.unh.edu/about/diversity-inclusion/sba-statement-diversity-equity-inclusion"]
title = "SBA Statement on Diversity, Equity, and Inclusion | Franklin Pierce School of Law"
description = "The UNH Law Student Bar Association (SBA) supports the Black Lives Matter movement. We condemn the brutal murders of Breonna Taylor, Tony McDade, Ahmaud Arbery, David McAtee, George Floyd, Rayshard Brooks, and so many others."
full_description = "The UNH Law Student Bar Association (SBA) supports the Black Lives Matter movement. We condemn the brutal murders of Breonna Taylor, Tony McDade, Ahmaud Arbery, David McAtee, George Floyd, Rayshard Brooks, and so many others. As law students and future lawyers, we are charged with working to improve the administration of justice in our communities. We understand that we have a duty to actively dismantle systemic injustice and structural racism. Our profession plays a critical role in eliminating inequity and discrimination, and it is incumbent upon us to work together and create an inclusive, tolerant, and just society. As we continue to strive toward this goal, the SBA renews its commitment to implement antiracist initiatives and promote justice at UNH Law in conjunction with our administration, faculty, staff, student organizations, and individual members. In solidarity, Katie A. MosherSBA President (on behalf of a majority of the SBA Board of Governors)"
year_published = 2025
