["https://law.unh.edu/academics/degrees-certificates/jd-certificates/health-law-policy"]
title = "Health Law and Policy | Franklin Pierce School of Law"
description = "The Certificate in Health Law and Policy provides students the opportunity to graduate with the legal and regulatory essentials necessary to practice in the emerging and dynamic field of health law."
full_description = '''The Certificate in Health Law and Policy provides students the opportunity to graduate with the legal and regulatory essentials necessary to practice in the emerging and dynamic field of health law. Students gain a unique understanding of the health care marketplace through a focused core curriculum and the opportunity to select optional course credits, legal residencies, capstones and other independent projects that result in a complete and interdisciplinary health law experience. The University of New Hampshire Health Law and Policy Programs, in collaboration with the Warren B. Rudman Center for Justice, Leadership and Public Policy, provides additional live programming in the area of health law and policy to enhance the curriculum experience of certificate students. Students must complete the following course and interdisciplinary work to receive a Certificate in Health Law and Policy: Health Law: Health Law and Policy (3 credits) offered by the University of New Hampshire Franklin Pierce School of Law: This course provides a general introduction to the law and policy of health care delivery in the United States. Health Law: Health Law and Industry Regulation (3 credits) offered by the University of New Hampshire Franklin Pierce School of Law: This course provides students the practical and detailed regulatory knowledge base necessary to practice in the area of health law by teaching how the health care delivery system is regulated from a business perspective. bioInnovation Research Collaboration and the Law (2 credits): This innovative course highlights the intersection of health, intellectual property and business law and is a collaboration between UNH Law and industry partners BioFabUSA and the Advanced Regenerative Manufacturing Institute (ARMI). The course features contributions from law faculty in business, health and intellectual property focus areas, and includes insight and lectures from outside experts. Students enrolled in the course will survey legal issues critical to the translation of an invention to its commercialization as a biomedical product. A January kickoff celebration for the course featuring Dean Kamen. The course is led by oversight from adjunct professor and UNH Law graduate Leslie Sullivan-Stacey. Sullivan-Stacey brings a unique skill set to the University of New Hampshire Franklin Pierce School of Law. Before joining as Adjunct Professor to co-lead the development of bioInnovation Research Collaboration and the Law, she was Director of the Office for Clinical and Translational Research at Cincinnati Children’s Hospital Medical Center. She previously served as President/CEO of a widely respected international voluntary health agency for a rare fatal disease where she launched a national clinic network and liaison program to create a structure for clinical trials. Sullivan-Stacey also served as VP, Secretary and General Counsel of a multinational corporation. She graduated from the University of New Hampshire Franklin Pierce Franklin Pierce School of Law in 1992. Current Issues in Health Law and Policy, Writing Seminar (2 credits): This course teaches students current issues in health law, benefits and coverage through an analysis of the Affordable Care Act. Additional courses approved by the Director of Health Law and Policy related to the diverse field of health law and policy offered by University of New Hampshire Franklin Pierce School of Law or the University of New Hampshire graduate programs in public health, business, public policy or analytics. Law courses include, but are not limited to, Business Associations, Contract Drafting, Privacy, Tax, Antitrust, Patent Law Trademark, IP Valuation, Employment Law, Immigration Law, Access to Justice, In-House Counsel and Statutory Interpretation. Up to 3 credits of the coursework requirements may be satisfied by a for-credit legal residency or law-school clinic that aids in the development of skills and experience relevant to health law and policy. Apply Now Through LSAC Request Information .captcha { padding-bottom: 1em !important; } .wForm .captcha .oneField { margin: 0; padding: 0; } // initialize our variables var captchaReady = 0; var wFORMSReady = 0; // when wForms is loaded call this var wformsReadyCallback = function () { // using this var to denote if wForms is loaded wFORMSReady = 1; // call our recaptcha function which is dependent on both // wForms and an async call to google // note the meat of this function wont fire until both // wFORMSReady = 1 and captchaReady = 1 onloadCallback(); } var gCaptchaReadyCallback = function() { // using this var to denote if captcha is loaded captchaReady = 1; // call our recaptcha function which is dependent on both // wForms and an async call to google // note the meat of this function wont fire until both // wFORMSReady = 1 and captchaReady = 1 onloadCallback(); }; // add event listener to fire when wForms is fully loaded document.addEventListener("wFORMSLoaded", wformsReadyCallback); var enableSubmitButton = function() { var submitButton = document.getElementById('submit_button'); var explanation = document.getElementById('disabled-explanation'); if (submitButton != null) { submitButton.removeAttribute('disabled'); if (explanation != null) { explanation.style.display = 'none'; } } }; var disableSubmitButton = function() { var submitButton = document.getElementById('submit_button'); var explanation = document.getElementById('disabled-explanation'); if (submitButton != null) { submitButton.disabled = true; if (explanation != null) { explanation.style.display = 'block'; } } }; // call this on both captcha async complete and wforms fully // initialized since we can't be sure which will complete first // and we need both done for this to function just check that they are // done to fire the functionality var onloadCallback = function () { // if our captcha is ready (async call completed) // and wFORMS is completely loaded then we are ready to 