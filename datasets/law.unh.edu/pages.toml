["https://law.unh.edu/admissions/graduate-admissions/admissions-faqs"]
title = "Admissions FAQs | Franklin Pierce School of Law"
description = "Information about Law Graduate School admissions"
full_description = "What You Want to Know expand all Admissions What graduate programs do you offer? We offer specialized LL.M. degrees in Intellectual Property, Commerce and Technology and International Criminal Law and Justice. We have interdisciplinary Master’s programs in: Intellectual Property, Commerce and Technology and International Criminal Law and Justice. We also offer one-semester Graduate Certificates in Intellectual Property, and Commerce and Technology. Am I a good fit? The LL.M. program is ideal for domestic and foreign-trained attorneys seeking specialized training. The Intellectual Property Master’s degree program is a good fit for domestic and foreign engineers, scientists or business professionals who want a specialized degree. The International Criminal Law and Justice Master’s program is designed for professionals, students and scholars in diplomatic, criminal, military or law enforcement communities around the globe. What are the admission requirements? You can find a detailed list of requirements on our How to Apply page. Do I need a law degree to be admitted into the master’s program? You do not need a law degree. We welcome applicants for a variety of educational and professional backgrounds! What is the cost of tuition? Detailed information about tuition and fees. Please feel free to contact us at admissions@law.unh.edu if you have additional questions about tuition or fees. Will I be required to take the LSAT examination? There is no entrance exam required for admissions. You do not need to take the LSAT or the GRE. Is work experience required? No work experience is necessary. Students who are just beginning their professional journey and students with decades of experience are welcome to apply. We take a holistic approach to application review and look at each applicant individually. Who is exempt from the language proficiency requirement? You may be exempt if you received your undergraduate degree from a college or university where English was the medium language of instruction. Since I am in the United States, will you accept photocopies of my academic documents from an institution based in a foreign country? We understand the challenges associated with submitting original documents for institutions based outside the United States. While we are able to accept copies of your documents for admissions purposes, official documents issued directly by your university will be required prior to matriculation. Should my transcripts be evaluated before I submit them? International applicants who wish to submit evaluated transcripts are encouraged to use the credential evaluation service provided by LSAC or WES. All transcripts must be translated to English prior to submission. Am I required to register for the LSAC LL.M. Credential Assembly Service? No, we do not require applicants to register for the LSAC LL.M. Credential Assembly Service. All applicants are welcome to apply online through our website. Applicants applying to multiple schools are encouraged to use LSAC's Credential Assembly Service as the service may save you time and money by allowing you to submit to LSAC only one set of official credentials and translations. When can I begin the program? Students have the option to enroll in the fall (August) for our residential programs. Online programs have fall and spring (January) entry. Please see how to apply for specific entry terms and application deadlines. UNH Law has rolling admissions, so it is best to apply early. Late applicants are evaluated if time and space permit. International applicants to residential programs should complete their application by June 1 in order to allow time for the visa process. When are classes scheduled? Classes are typically scheduled Mondays through Fridays during the morning and early afternoon. What if I am not sure if the online program is right for me? Students may “try out” UNH Law’s graduate law online programs by registering for online courses (up to 9 credits) as a nondegree student. To apply to take a course as a nondegree student, please complete an application and submit a transcript that reflects completion of at least an undergraduate degree. International applicants should also provide proof of English language ability. Nondegree students may apply to the program at any time with approval from the program chair. Academics How many credits are necessary to complete the degree? The LL.M. degree requires 24 credits. The Master’s degree requires 30 credits. The Graduate Certificate requires 15 credits. Am I eligible to participate in an internship/externship? Internships and externships are not a part of the LL.M. and Master’s programs. However, students interested in gaining hands-on work experience are eligible to participate in legal clinics, such as our Intellectual Property Transaction Clinic and our International Technology Transfer Institute. May I transfer to the Juris Doctor program after matriculating in the Master’s or LL.M. program? Students enrolled in the Master’s or LL.M. program may apply to the J.D. program after completing their first semester. Also, UNH Franklin Pierce offers highly qualified foreign trained lawyers advanced standing admission to the J.D. program. After completion of the LL.M. program, will I be eligible to take a bar examination? Many LLM students at UNH Franklin Pierce have a goal to sit for a US bar exam. UNH Franklin Pierce’s in-person LLM programs in Intellectual Property and Commerce and Technology are not designed as preparation programs for a US bar exam. However, the programs offer a flexible curriculum that allows students to design a course of study that may afford eligibility to sit for a state bar exam. It is important to know that each state has its own rules regarding eligibility to sit for the bar exam. For more information about admissions requirements in each state, please visit the Comprehensive Guide to Bar Admission Requirements. Historically, New York has the most attainable eligibility requirements for internationally-trained lawyers who are graduates of a one-year LLM program. Most LLM graduates from UNH Franklin Pierce and other schools across the US attempt the New York bar exam. Other states with a concentration of LLM applications include California and Washington State. In addition, Massachusetts, Connecticut, and Colorado all have requirements that may be attainable through one of the in-person LLM programs offered at UNH Franklin Pierce. Students interested in preparing for a US bar exam should work closely with their academic advisor, the director of the academic success program, and their faculty mentor to discuss their individual program plan and design a study plan that balances bar preparation with course requirements for specialization in their given field of study (either intellectual property or commerce and technology law). In addition, LLM students are eligible to participate in other bar-related services provided through the academic success program, such as group workshops and one-on-one counseling. What is OPT and how does it work? Optional Practical Training (OPT) allows students in the USA on an F-1 visa the opportunity to obtain hands-on work experience (employment) in areas related to their academic major for up to 12 months after completing their degree program. Students must complete one year of academic study by the date the OPT approval begins. The UNH Office of International Students and Scholars will assist students with applying for OPT. The UNH Franklin Pierce School of Law Career Services Office will support students through the OPT job search and application process. What Career Services are available to graduate law students? Our Career Services Office provides a range of comprehensive services to LLM and graduate law students related to the job search process. These services include group workshops, 1:1 meetings with career counselors, resume samples and individual review, support with cover letters, mock interviews, job postings, an alumni directory, lists of organizations that have hired LLM and master’s students in the past, and an internal website with practice area summaries, how-to-guides, and more. Student Life What are my housing options? There are a variety of housing options in the Concord area. Admitted students are given access to a Housing Guide and to Places4Students where they can view a list of available housing from local landlords. You will need a username and password to access the housing list. All instructions are posted on the housing website. The law school has also reserved some housing for international graduate law students. For more information, please contact the admissions office. Are scholarships or other financial assistance options available to international students? Yes! Applicants for residential programs are eligible for partial tuition scholarships. Priority will be given to individuals who apply before May1. To be considered for a scholarship, applicants must also request a scholarship under the financial assistance section in the application. A limited number of partial tuition scholarships are also available for students in our online graduate law programs. Priority will be given to individuals who apply by July 1 for the fall semester and by November 15 for the spring semester. Scholarships decisions are based on both merit and financial aid. Please indicate in your application that you would like to be considered for financial aid. Federal financial aid is available to U.S. citizens or permanent residents of the United States. Eligible students must complete a FAFSA form online, and a financial aid award letter will be sent to qualified students shortly thereafter."
