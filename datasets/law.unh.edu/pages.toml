title = "Sports Law | Franklin Pierce School of Law"
description = "In recognition of mastery in their studies of sports law or entertainment law, University of New Hampshire School of Law students can earn a sports law certificate."
full_description = '''In recognition of mastery in their studies of sports law or entertainment law, University of New Hampshire Franklin Pierce School of Law students can earn a sports law certificate or an entertainment law certificate (or both). A UNH Franklin Pierce certificate in sports law or entertainment law is a valuable resource for our students when they interview with sports and entertainment law employers. The certificate signifies the student is ready to practice in the sports or entertainment law fields and demonstrates the potential for excellence as a sports lawyer or entertainment lawyer. Professor Michael McCann is the sports law certificate program director and Professor Alexandra Roberts is the entertainment law certificate program director. Sports Law Certificate (15 credits) Core Courses* Three of the following courses: College & Amateur Sports Law Intellectual Property Issues in Sports & Entertainment Law International, Comparative & Olympics Sports Law Intro to US Sports Betting Law and Regulation Name, Image, and Likeness: The Controversy of Identity Licensing in Sports Pro Sports & the Law Sports Law & Investigative Reporting Other courses taken to total 15 credits* Advertising Law Antitrust Law Contract Design Copyright Law Copyright Licensing Dispute Resolution e-Commerce & the Law Employment Law Estate Planning Family Law First Amendment Law Fundamentals of Intellectual Property Law Health Law Immigration Law In-House Counsel Intellectual Property Management Law Practice Management Labor Law Personal Income Taxation Trademarks & Deceptive Practices Videogaming/Internet Law Wills, Trusts & Estates A specially approved graduate course in another UNH school At the discretion of the sports law certificate director (Professor McCann), credit toward the certificate might be awarded for relevant legal residencies, externships and independent projects. Apply Now Through LSAC Request Information .captcha { padding-bottom: 1em !important; } .wFor