["https://law.unh.edu/about"]
title = "A Community of Students and Scholars | Franklin Pierce School of Law"
description = "The University of New Hampshire Franklin Pierce School of Law is an intimate, innovative law school, committed to developing students who enjoy challe"
full_description = "A Community of Students and Scholars The University of New Hampshire Franklin Pierce School of Law is an intimate, innovative law school, committed to developing students who enjoy challenging dialogue from the first moments of orientation, embrace practice-based learning, and stand ready to join the ranks of alumni who are global leaders in intellectual property, general practice, public interest and social justice, and commerce and technology. Our Legal Residency program allows students to work in their fields of interest for up to a full semester while receiving credit and our Daniel Webster Scholar program is the only practice-based bar exam alternative in the nation. Our faculty consists of practitioners experienced in their fields of interest. Accredited by the American Bar Association, UNH Franklin Pierce is located in Concord, New Hampshire, home to the state's legislature, state offices, as well as local, state and U.S. federal courts. Concord is just an hour's drive from Boston, and we are located less than an hour from mountains, lakes and the Atlantic Ocean. Why UNH Franklin Pierce? Beyond our world-renowned and A+ rating in intellectual property law by prelaw magazine, UNH Franklin Pierce is one of the best American Bar Association-accredited law schools in the nation. While we know rankings are important to prospective students, we also believe a law school experience should be innovative, rewarding, and ahead of the curve. Learn more Powerhouse Powerhouse You’ll leave here with what it takes to succeed. Why UNH Franklin Pierce? About UNH School of Law Why UNH Franklin Pierce? Mission Diversity & Inclusion ABA Consumer Information Accreditation Nondiscrimination Statement More Information Office of the Dean Podcast Communications & Marketing Employment Learn More About UNH Law Visit Us Apply Now Donate Inquire"
