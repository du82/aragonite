full_description = "The University of New Hampshire Law Review As one of three scholarly journals produced by University New Hampshire Franklin Pierce School of Law students, the University of New Hampshire Law Review publishes articles of general legal interest exploring questions of law and unsettled legal issues. University of new hampshire Law Review IDEA IDEA®: The Law Review of the Franklin Pierce Center for Intellectual Property, formerly IDEA: Intellectual Property Law Review (ISSN 0019-1272) is published three times a year by the students of the University of New Hampshire Franklin Pierce School of Law. For more than 50 years, IDEA has provided practical articles relating to patent, copyright, trademark, trade secret, unfair competition, general intellectual property, and law and technology issues from around the world. IDEA UNH Sports Law Review The UNH Sports Law Review is published once a year during the Spring semester. The annual publication is accompanied by a Symposium that allows authors to share their work and receive comments and questions from the law school community and the general public. The primary purpose of the UNH Sports Law Review is to provide a platform for scholars in the sports law community to publish works on pressing issues within the ever-growing area of sports law. UNH Sports Law Review"
