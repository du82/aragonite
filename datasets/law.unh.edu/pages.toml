["https://law.unh.edu/academics/degrees-certificates/hybrid-jd"]
title = "Hybrid JD | Franklin Pierce School of Law"
description = "Stay in your home. Stay in your job. Earn your JD primarily online. Join the first and only ABA-approved Hybrid Juris Doctor (JD) Program with a focus"
full_description = "Hybrid JD Stay in your home. Stay in your job. Earn your JD primarily online. Join the first and only ABA-approved mostly online juris doctor (JD) Program with a specialized focus: Intellectual Property, Technology, and Information Law or Health and Life Sciences Law. Apply Now Through LSAC Request Information UNH Franklin Pierce is offering the first and only ABA-approved, part-time non-residential Juris Doctor (JD) program with a specialized focus of legal study. Students will choose from one (or both) of two concentrations: Intellectual Property, Technology, and Information Law; or Health and Life Sciences Law. Both concentrations serve to highlight the intersection of intellectual property and health/life sciences law. Regardless of whether you choose to pursue one or both concentrations of legal study, you can earn your JD within the same credit requirements and time commitment. This one-of-a-kind program allows JD students to complete required coursework primarily online with minimal in-person immersion period requirements at either our Concord, NH campus or at select locations across the U.S. in as little as three years (or longer if your schedule requires). Because relocating or leaving your job isn’t always an option—but getting the education you’ve dreamed of should be. This mostly online law degree was created for professionals working in intellectual property (IP), technology, healthcare, life sciences, and related fields. UNH Franklin Pierce is considered the IP Powerhouse and has consistently been top-rated in IP law. Supported by an internationally recognized faculty, this program is meant to prepare students for legal careers in the modern global economy. Non-residential and residential JD students alike receive the same key opportunities, including: devoted full-time faculty resources student services and bar exam passage preparation curriculum and clinic opportunties academic support and career services admissions standards and scholarship consideration This Hybrid JD program is meant to help make professional futures a reality—regardless of where you’re located. UNH Franklin Pierce has always been rooted in tradition, but we’re far from traditional. And we recognize that the demands of today do not always accommodate the models of yesterday. The mostly online JD program maintains ABA Standards. Students applying should check with the jurisdictions where they plan to seek admission to the bar to ensure their eligibility; graduates of this program will be eligible to take the bar in New Hampshire. Request Information How to Apply Find Courses Benefits for Law Firms Contact Email: Hybrid.JD@law.unh.edu Phone: (603) 945-1802 Bloomberg Law 2022 Law School Innovation Program Award Winner for Innovation & Pedagogy Read Bloomberg Law's analysis of the Hybrid JD program: ANALYSIS: These Innovators Are Reinventing Law School Pedagogy The Princeton Review Award Winner for Best Online JD Programs at Law School 2025 Learn about the creation of the Hybrid JD program on The Legal Impact Podcast's Inside Law Admissions Series Watch Our Informational Webinars Hear UNH Franklin Pierce Dean Megan Carpenter and Hybrid JD students share the benefits of the innovative Hybrid JD program.Watch the Archived Videos latest news Bloomberg Law:ANALYSIS: These Innovators Are Reinventing Law School Pedagogy Above the Law:Largest and Most Diverse Class in a Decade at UNH Franklin Pierce School of Law ABA Landslide:Legal Education: A Call to Action (by Dean Megan Carpenter) IAM MagazineTo Educate Lawyers Who Change the World, We Cannot Let this Crisis Go to Waste (by Dean Megan Carpenter) Diversity in Action:Legal Ease: Hybrid JD program allows flexibility in where and when students learn Inside Higher Ed:Faculty and Pedagogy in the Hybrid J.D. ASIPI Scholarship Opportunities UNH Franklin Pierce is proud to enter into an exclusive agreement with the Inter-American Association of Intellectual Property (ASIPI) that will launch intellectual property leaders across Latin America through an educational partnership and scholarships for ASIPI members. Our Hybrid JD program will be offering 1 full tuition scholarship every year from 2023-2028. Learn More CURRICULUM CURRICULUM Curriculum Maps: Class of 2025 Class of 2026 Class of 2027 Regardless of whether you choose to pursue one or both concentrations of legal study, you can earn your JD within the same credit requirements and time commitment. To graduate, students must take the following: Experiential Classes – minimum 6 credits Advanced Writing – minimum 2-3 credits Bar Readiness Classes – minimum 6 credits Immersion Requirements: Fall – 2 required immersions Spring – 1 required immersion Summer – 1 required immersion *Curriculum maps may be updated with a minimum of one semester notice to students. ADDITIONAL INFORMATION expand all ONLINE DELIVERY & RESIDENTIAL REQUIREMENTS The Hybrid JD Program allows students to remain in their jobs and homes while earning their JD because the curriculum requires them only to come to campus or other locations for select and well-planned periods of in-person learning each term (fall term—two periods of 3-5 days each, spring & summer terms—one period of 3-5 days). The balance of the curriculum—as well as other crucial areas of student engagement, such as career services and academic support—will be done remotely, either synchronously or asynchronously. Online instruction and coursework will include: live and pre-recorded video lectures reading and writing assignments assessments discussion board contributions Learning management system orientation and 24/7 tech support will be provided, as well as virtual office hours and 1-to-1 real-time engagement opportunities with faculty and fellow students. The curriculum is designed to be year-round, 10 semesters total, lasting 3.5 years. Regardless of whether you choose to pursue one or both concentrations of legal study, you can earn your JD within the same credit requirements and time commitment. Additionally, Hybrid JD students will have the opportunity to participate in UNH Franklin Pierce’s legal residency program during their final year in the program. At all times, whether in-person or on-line, as a member of UNH Franklin Pierce, our part-time Hybrid JD students will experience the same high-caliber JD experience that generates practice-ready attorneys that our full-time, residential JD students enjoy. Intellectual Property, Technology, and Information Law Concentration IP is the legal framework around human creativity, invention, and innovation. Through this program students are given the tools and resources needed to support the inventors and technologists, startups and corporations building the future. Legal experts in this field are in hot demand, and UNH Franklin Pierce will set you up to lead the way. We are the IP powerhouse in legal education. Students in the IP concentration will take program-focused courses beginning their 1L year. IP-specific courses include Fundamentals of IP, Trademark, Patents, and Trade Secrets, as well as 30+ credits of electives leading to graduation. To graduate, students must complete a minimum of 85 credits, which will include 6 credits of Experiential Classes, 2-3 credits of Advanced Writing, and 6 credits of Bar Readiness Classes. UNH Franklin Pierce’s Franklin Pierce Center for Intellectual Property is a world-renowned IP program, and our students graduate ready to hit the ground running. Our IP program includes leading scholars and practitioners in the core IP fields of patent law, copyright law, trademark law, privacy, internet law, and law and technology. Our students adapt their legal expertise to constantly changing technologies and economies. Our alumni create IP strategy as professors, policymakers, government officials, and corporate lawyers in more than 80 different countries around the globe. Health and Life Sciences Concentration Health and life sciences law addresses the connected pathways of business, IP, healthcare delivery, and regulatory planning to drive sustainable strategies from ideation to implementation. This concentration will address the development, distribution, and regulation of biological products and services, including biotech, biologics, and pharmaceuticals. Instructors will train students to become subject-matter experts and strategic thinkers. Through this program students are given the tools and resources needed to support the scientists, medical professionals, technologists, startups, and corporations building the future. Students in the Life Sciences concentration will take program-focused courses beginning their 1L year. Life Sciences-specific courses include Fundamentals of IP, Fundamentals of Healthcare, Drug & Device Law, Patents, and Trade Secrets, as well as 30+ credits of electives leading to graduation. To graduate, students must complete a minimum of 85 credits, which will include 6 credits of Experiential Classes, 2-3 credits of Advanced Writing, and 6 credits of Bar Readiness Classes. Regardless of whether you choose to pursue one or both concentrations of legal study, you can earn your JD within the same credit requirements and time commitment. FAQ The Who 1. What is an intellectual property or technology professional? More than 50 years ago, UNH Franklin Pierce pioneered the study of law for the information age. Intellectual Property law is the study of how the results of human creativity are treated in the legal system—how they are used, owned, bought, sold, and so much more. It also looks at how that treatment impacts individuals and institutions both personally and professionally. Companies rely on specialized legal counsel to navigate the intricacies of IP, acquisitions, and privacy in the global marketplace. Additionally, attorneys with a specialization in trademark, copyright and patent law are highly desirable with increased innovation and content creation. Especially in the digital age, human creativity intersects with technology. And understanding how to protect its creation, governance, security, and privacy is more important than ever. IP and technology professionals are a diverse and dynamic group, including but not limited to those working in education, healthcare, engineering, entertainment, licensing, technology development, new ventures, finance, and other industries. 2. What is a Health or Life Sciences professional? Healthcare is one of the most critical issues facing society today. Lawyers in this space need to be poised to help shape and manage innovations and policies affecting the life science and healthcare industry as it expands and transforms. Health and life sciences law has expanded relevance as we face unprecedented national and global health risks, transformative therapeutic breakthroughs, and novel care delivery models. Lawyers are increasingly relied on to advise individuals, corporations, organizations, and governments to improve healthcare and biopharma while navigating regulatory and system complexities. UNH Franklin Pierce’s Health Law & Policy Program will prepare you to enter a field that continues to experience rapid growth. The future of healthcare policy and regulation is one of the most important challenges facing us today – after completing this program, you will be poised to help craft and manage strategies impacting the healthcare and biopharma marketplace as it transforms and evolves. Our courses focus on the policies shaping, economics driving and regulations governing our healthcare and life sciences delivery systems, including the many legal disciplines required to understand and excel in your practice area. You will gain an understanding of the healthcare marketplace and graduate with the legal and regulatory essentials necessary to lead in this emerging and dynamic field. 3. Who are the instructors in this program? Our professors are world experts in IP, technology, health, and life sciences law. They draft legislation, advise global leaders on IP valuation, launch startups, analyze the latest sports law issues, help emerging economies transition to an information economy, lead scholarship on privacy and data, and shape and manage policies affecting the healthcare delivery system. Quite simply, they help inventors, scientists, and clinicians change the world. In addition to our full-time faculty, you will also learn from industry experts from around the world (many who are alumni themselves). Like learning patent strategy from Microsoft’s former Chief Patent Counsel or learning how branding can transform an industry from Pepsi’s Chief Counsel for Global Trademarks or how to bring a tissue engineered product to market from regulatory experts in the field. The What Our curriculum consists of both standard law school 1L topics to ensure a solid and fundamental understanding of the law along with focused curriculum on intellectual property, technology and information law and health and life sciences law. Please see the 'curriculum' tab above for further details. The When 1. When are the residential/in-person components to the program? The program follows the UNH Franklin Pierce academic calendar. Residential time is limited to one or two on-campus (or other locations) visits each semester. While not participating in in-person learning, Hybrid JD students are consistently engaged in virtual education and collaborative learning. The residential/in-person periods will be the same each semester: Fall semester residential session: 5 days in August 4 days in October Spring semester residential sessions: 4-5 days in March Summer semester residential session: 4 days in May Each residential day will contain roughly 9 hours of class time, as well as time for non-classroom activities, such as individual sessions with Career Services staff. Students should expect to be in class from 8 AM on the first day of immersion until 5 PM on the last day of immersion. 2. Am I responsible for my own travel and hotel costs? You are responsible for arranging your own travel (e.g. airfare). We are able to help with planning and recommendations. You are responsible for hotel and transportation costs, although we have negotiated hotel room blocks so students can take advantage of the best rates. 3. When must I pay my tuition and fees? For payment and tuition information, please visit our Business Services website: https://www.unh.edu/business-services/billnpay The Where 1. Where are the in-person immersion period courses held? Presently, all residential/in-person immersion period courses are held at our law school building, 2 White St, Concord, NH 03301. Other locations will be scheduled for future immersion periods. Online asynchronous courses are accessible at any time via our Learning Management System. These courses are designed to open by module and most allow you to complete your work at any time during the week. Some courses may have a limited number of synchronous online components, wh"
