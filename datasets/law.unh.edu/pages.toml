["https://law.unh.edu/admissions/financial-aid/international-funding-resources"]
title = "International Funding Resources | Franklin Pierce School of Law"
description = "Here is a list of some outside scholarship resources we have compiled. These are some, but not all, of scholarships available outside of UNH Franklin Pierce School of Law."
full_description = "Here is a list of some outside scholarship resources we have compiled. These are some, but not all, of scholarships available outside of UNH Franklin Pierce School of Law. General Scholarship Search Portals EducationUSA Edupass Fastweb IIE Find a Scholarship or Program World Learning International Student Organization of America (ISOA): ISOA provides a detailed list of organizations which offer scholarships and grants to international students based upon factors such as background and area of interest. Jen Pereira Assistant Director of Financial Aid Office hours: Monday - Friday, 8:00 a.m. to 4:30 p.m., EST Phone: (603) 513-5105 Email: financialaid@law.unh.edu Schedule an Appointment expand all Other funding resources for international students IIE Fulbright Foreign Student Program Amideast Fulbright Foreign Student Program International Student Loan Ford Foundation International Fellowships Program (IFP) Rotary Grants World Bank Scholarships Program SCHOLARSHIPS FOR WOMEN American Association of University Women (AAUW): AAUW helps women around the globe break through barriers and pursue their dreams of obtaining graduate degrees or making an impact in their communities. International Fellowships are awarded for full-time study in the U.S. to women who are not U.S. citizens or permanent residents in the amount of $18,000 (Master’s/First Professional Degree Fellowship). Margaret McNamara Memorial Fund (MMMF): Offers “Education Grants for Women Who Make a Difference.” LLM-Specific Scholarship Opportunities Postgrad Solutions Global LL.M. Study Bursary: Postgrad Solutions offers two global and U.S. LL.M. study bursaries per year of £500 each to international and UK students who have been accepted to an LL.M. Program in the U.S. or abroad. Eligible candidates must have already accepted an offer at the chosen institution where they intend to pursue the LL.M. LLMGuide.com Scholarship Search Engine Country or Regional Scholarships expand all Latin America Organization of American States Rowe Fund Loans: The Rowe Fund is an educational loan program of the Organization of American States (OAS) that helps citizens from Latin America and Caribbean OAS Member States finance their studies or research in accredited universities across the United States by awarding interest-free loans of up to US$15,000 dollars. CONICYT – Chile: Scholarships awarded to citizens and permanent residents of Chile. Applicants can apply for these scholarships to either start or continue studies leading to a master’s or PhD degree at leading institutions abroad. Colfuturo – Colombia: Colfuturo facilitates access for Colombian students to more study opportunities and enables them to contribute with their experiences of studying abroad to the economic and social development of Colombia. Once students have graduated from their programs abroad, they must return to Colombia within one year of finishing their programs in order to qualify for a scholarship comprising a 50% waiver of the loan. Fundacao Estudar – Brazil: This program offers young students scholarships to support them in studies in undergraduate, graduate exchange, graduate and executive education. Instituto Ling - Brazil: Instituto Ling/EAGV-LLM offers partial scholarships to Brazilians who have been accepted to an LL.M. Program in the U.S. or Europe and can demonstrate a need for funding. Individual amounts of funding vary, but a typical award is approximately $5,000 - $10,000. Europe and Eurasia American-Scandinavian Foundation (ASF) - Scandinavia: ASF offers funding to citizens of Denmark, Finland, Iceland, Norway, or Sweden to pursue study or research programs (typically at the graduate level) in the U.S. for up to one year. DAAD Scholarships for German Citizens - Germany: The German Academic Exchange Service (DAAD) is a publicly funded independent organization of higher education institutions in Germany. Each year DAAD, its Regional Branch Offices, its Information Centers, and DAAD Professors around the globe provide information and financial support to over 67,000 highly qualified students and faculty for international research and study. Finlandia Foundation National P.J.C. Lindfors Legal Studies Fund: Awards for citizens of Finland who have applied to, been accepted to, or are enrolled in an ABA-approved U.S. law school. Fondo Per Studenti Italiani (The Italian Student Fund): A not-for-profit corporation that offers financial aid to Italian university graduates, who wish to attend a post-graduate course (Master or Ph.D.) in the United States. Fundación Rafael del ino: Scholarships for Spanish graduate students who plan to pursue graduate-level study in Spain or abroad. Kosciuszko Foundation Fellowships & Grants for Polish Citizens: Funding for Poles residing in Poland who seek to pursue postgraduate studies abroad. White & Case Annual Business Law Scholarship: Scholarship for economically disadvantaged law students in France to study abroad. India Parekh Family Foundation: Two scholarships will be awarded to students in the United States who are seniors in high school or current college students, who are actively enrolled in college as of September 2021. The student must be of Indian origin and must demonstrate academic and personal excellence. The one-time $1,000.00 check will be awarded to help defray the cost of tuition, room and board, or books for Two students. The Central Sector Scheme of National Overseas Scholarship: The goal is to facilitate the low income students belonging to the Scheduled Castes, Denotified Nomadic and Semi-Nomadic Tribes, Landless Agricultural Labourers and Traditional Artisans category to obtain higher education viz., Master degree or Ph.D courses by studying abroad thereby improving their Economic and Social status. Inlaks Shivdasani Foundation: Scholarships are granted to Indian students to read at top rated American, European and UK institutions for a full-time Masters, M.Phil or a Doctorate program. The scholarship covers full tuition fees, adequate living expenses and one-way travel allowance and health allowance. Applications open February 15th, 2022."
