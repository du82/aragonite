["https://law.unh.edu/academics/registrar"]
title = "Registrar | Franklin Pierce School of Law"
description = "The Office of the Registrar is responsible for maintaining students' official academic records, course scheduling and registration, exam scheduling and administration, bar certification, and Veteran certification. The Registrar's Office also issues p"
full_description = "The Office of the Registrar is responsible for maintaining students' official academic records, course scheduling and registration, exam scheduling and administration, bar certification, and Veteran certification. The Registrar's Office also issues parking permits, lockers, reissued diplomas, as well as transcripts. Academic Calendar External Room Rentals Contact Us 2 White Street Concord, NH 03301law.registrar@law.unh.edu Phone: (603) 513-5295 Fax: (603) 513-5289 expand all Diploma Reissue Graduates may obtain a UNH Law diploma by completing the Diploma Reissue Request Form. The fee for a reissued diploma is $75 (United States) and $175 (international). Reissued diplomas take approximately three months. If you have questions concerning your UNH Law diploma, please email Law.Registrar@law.unh.edu or call (603) 513-5295 Ordering Instructions DIPLOMA REISSUE REQUEST FORM Document Request Certification of Degree (Alumni) To request a Degree Certification, please send an email to the Registrar's Office, registrar@law.unh.edu, with the following information: Request for Degree Certification in email subject line Your full name as it appeared during attendance Your year of graduation A telephone number where you can be reached during the day The name and address of the individual/firm/corporation/institution the certification should be mailed to Please allow 5 business days from the time the request is received for processing. Degree Certification Letters contain: student name, degree student was seeking and/or degree received, dates of attendance, academic standing, date degree conferred and the University of New Hampshire School of Law ABA approval date. Enrollment Verification (Current Students) Request enrollment verification/deferments from UNH Registrar Forms and Schedules Download forms and Schedules Locker Request Form Official Transcripts The University of New Hampshire has partnered with Credentials Solutions to accept online transcript orders. Students and alumni can order their official transcripts 24 hours a day, 7 days a week. Transcripts can be sent electronically or mailed in hard copy, depending on the preference of the recipient. Fees Cost is $3.00 for an electronic transcript or $6.00 for a hard copy, plus optional shipping charges. More information can be found on the transcript ordering page. Webcat (Current students) Order through Webcat: Click Student Records -> Transcript -> Request Official Transcript to order. Online (Alumni) Order online from Credentials Solutions, the authorized provider for University of New Hampshire transcripts. Check Transcript Order Status Contact Credentials Solutions at (847) 716-3005 with any questions regarding transcript orders. Written Request Contact Records & Graduation for information on submitting a written request. Unofficial Transcripts View unofficial transcript on Webcat. Login to Webcat Select Student Records Select Transcript Select Academic Transcript Contact Records & Graduation for additional assistance. Exam Information Exam Conflict Form Exam Accommodations for English as a Second Language (ESL) Students Electronic BlueBook exam software UNH Law's Electronic Exam Policy: UNH Law students have the option of using Electronic Bluebook (EBB) software to type their final exams. EBB, offered by CompuTest, LLC, is fully compatible with Macs. The option of taking exams via laptops is offered to students as a convenience and privilege, not as a right. Making sure your equipment is in good working order and knowing how to use the program is the student's responsibility. Students choose this option at their own risk and should be prepared to hand write their exam in case of an unforeseen problem. Please note the following: Any attempt to disable or tamper with the security features of EBB will result in an Honor Code complaint being lodged against the student. If, for any reason, a student cannot continue typing their exam using EBB software, he or she must hand write the remainder of the exam. On exam day, students must arrive 15 minutes prior to the start of an exam. Laptops must be turned on and running EBB at least 10 minutes prior to the start of an exam. If EBB is not running 10 minutes prior to the start of an exam, said exam must be written by hand. Only essay portions of an exam will be administered on EBB. EBB will not be offered for take home exams. Use of EBB for exams is at the professor's discretion. The Student Handbook is a wealth of information containing policies, procedures, academic rules & course descriptions generally used by the University of New Hampshire School of Law. Bar Information Each state administers its own bar examination. The agency responsible for the examination varies from state to state, as do the dates when the examination is offered. We encourage you to review the requirements needed for the bar application as early as possible. Please see the individual state for more information. Register to take the bar exam in a given state: Northeast Connecticut Massachusetts Maine New Hampshire New York Rhode Island Vermont Mid-Atlantic District of Columbia Delaware Maryland New Jersey Pennsylvania Virginia Southeast Alabama Arkansas Florida Georgia Kentucky Louisiana Mississippi North Carolina Oklahoma South Carolina Tennessee Texas West Virginia Midwest Illinois Indiana Iowa Kansas Michigan Minnesota Missouri Nebraska North Dakota Ohio South Dakota Wisconsin West/Rocky Mountains Alaska Arizona California Colorado Hawaii Idaho Montana Nevada New Mexico Oregon Utah Washington Wyoming Other U.S. Jurisdictions Guam Northern Mariana Islands Palau Puerto Rico Virgin Islands Student Handbook and Academic Rules Student Handbook To view a recent version of our Student Handbook, select the appropriate button below. STUDENT HANDBOOK Academic Rules and Course Descriptions To find our complete academic rules, and available course descriptions, click the button below. ACADEMIC RULES & COURSE DESCRIPTIONS Notaries and Justices of the Peace Notaries:legally authorized to witness signatures, and certify documents Jon R. Cavicchi Kathy Fletcher Sue Frost Paul LaClair"
