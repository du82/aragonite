title = "Financial Aid | Franklin Pierce School of Law"
description = "We know attending law school as a J.D. or graduate student is a significant financial investment. We want to help you find ways to make it more affordable."
full_description = '''Making Your Investment More Affordable We know attending law school as a J.D. or graduate student is a significant financial investment. We want to help you find ways to make it more affordable. At UNH Franklin Pierce, students will find a broad range of merit and need-based scholarships. In fact, the vast majority of admitted students are offered scholarships at the time of admission, and more than 90 percent of students qualify for student loans. Our Office of Financial Aid is ready to assist you. We do everything we can to make UNH Franklin Pierce an affordable investment. We offer individualized counseling with a focus on finding the best way to fund your legal education. Let us help you explore your options. How It Works For Admitted Students We begin processing financial aid awards for newly admitted students in early February. Students are notified via email when your eligibility for financial aid has been determined. You'll be able to view the details of the award in Webcat through the MyUNH online portal. Scholarships and student loans are typically paid to your account in two equal installments, half for fall semester, half for spring semester. For Returning Students Financial aid awards are processed on a rolling basis beginning in February. Your scholarship, if applicable, and student loans are posted to your financial aid award in two equal disbursements, half for fall semester, half for spring semester. Contact Us Jen Pereira Assistant Director of Financial Aid Office hours: Monday - Friday, 8:00 a.m. to 4:30 p.m., EST Phone: (603) 513-5105 Email: financialaid@law.unh.edu Make an Appointment expand all Complete your Free Application for Federal Student Aid To apply for federal financial aid, you must complete the Free Application for Federal Student Aid (FAFSA). The FAFSA requires information from your (and your spouse’s) tax return from the last completed tax year. As a graduate student, you are considered independent, therefore no parental tax information is required. You must complete a new FAFSA each academic year to reapply for financial aid. UNH Title IV School Code: 002589 When completing the FAFSA form it is important to indicate our Title IV school code, which will display as “UNH, Durham, NH”. This allows the federal processor to send your FAFSA information to the University of New Hampshire. The above Title IV school code is good for all UNH campuses. Types of Aid Federal Financial Aid Graduate students who are enrolled in a degree program at least half time who are a U.S citizen or an eligible non-­citizen may be considered for federal financial aid. Graduate students are eligible for two types of federal aid resources: federal loans and work study. The Federal Direct Unsubsidized Loan is available to graduate students regardless of financial need. Students must complete the Free Application for Federal Student Aid (FAFSA) to receive Federal Unsubsidized loan funding. The Federal Direct Unsubsidized Loan offers eligible graduate students up to $20,500 annually. For the 2023-2024 academic year, the Federal Direct Unsubsidized Loan for graduate students has a fixed interest rate of 7.05% with a loan processing fee of 1.057% deducted from the loan at the time of disbursement. The interest rate is a fixed rate for the life of the loan. Federal Work Study utilizes federal funds to provide employment opportunities to graduate students who demonstrate financial need. Several departments hire students to work on campus, including Admissions, Security, the Library, and as teaching assistants. Work Study funds are awarded automatically to all eligible students and can be viewed in your financial aid award online via Webcat. Students cannot begin working until all hiring documents have been processed by Human Resources. Work study funds are not applied towards tuition bills, instead students are issued the proceeds earned in a biweekly paycheck. The Direct Graduate PLUS Loan is a federal loan that graduate or professional students can use to help pay for tuition and other expenses up to the cost of attendance. Aid awards typically include an estimated Grad PLUS loan to indicate the amount of additional funding you may apply for through the Grad PLUS loan. The 2023-2024 Federal Direct Graduate PLUS Loan has a fixed interest rate of 8.05% and a 4.228% origination fee, which is deducted from the loan at the time of disbursement. You are advised to exhaust Direct Unsubsidized Loan eligibility before borrowing in the Graduate PLUS Loan program, as the Grad PLUS loan carries a higher interest rate and processing fee. Applying for the Direct Graduate PLUS loan To receive a Federal Direct PLUS Loan, students must first file the Free Application for Federal Student Aid (FAFSA). After filing the FAFSA, students can apply for the Federal Direct Graduate PLUS Loan by completing a separate loan application at https://studentaid.gov/. Approval for the Direct Graduate PLUS Loan is based on good credit. A credit check will be processed on your request, and you will be notified immediately if you are approved or if an endorser is required. The university will be updated within 1-2 business days and your account will be updated to show that a credit check has come back positive. To finalize the loan, you will also need to complete an additional Master Promissory Noteand Grad PLUS Loan Entrance Counseling before the loan will pay to the University. Both steps can also be completed at https://studentaid.gov/, again selecting UNH – Durham as the school you are attending. All federal loan documents will be processed under this campus, though we will still receive your application and loan documents at the Law School campus. Federal Student Loan Requirements All students who borrow funds through either of the Federal Loan Programs (Federal Direct Loans) for the first time are required to complete an Entrance Loan Counseling session and a Master Promissory Note (MPN) before any funds will be disbursed to their student account. The Master Promissory Note (MPN) is a legal document in which you promise to repay your loan(s) and any accrued interest and fees to the U.S. Department of Education. It also explains the terms and conditions of your loan(s). Loan promissory notes are valid for ten years. Entrance Counseling is an interactive online session designed to inform you about the responsibilities and obligations associated with borrowing Federal Direct Loans. This counseling helps ensure that you understand your rights as a borrower, the importance of repaying your loans, and the various repayment options available to you. How to complete the Master Promissory Note (MPN) and Entrance Counseling: Log in to StudentAid.gov: Visit the U.S. Department of Education's Federal Student Aid website at www.studentaid.gov. Sign in with Your FSA ID: Use your Federal Student Aid (FSA) ID to log in. Select "Complete MPN": Once logged in, select the "Complete MPN" option and follow the on-screen instructions to complete the MPN for your loan program. Select "Complete Counseling": Once logged in, select the "Complete Counseling" option and choose "Entrance Counseling." Follow the instructions to complete the counseling session. Exit Counseling The U.S. Department of Education requires that all students who have separated and have used federal loans while in attendance at UNH complete an “Exit Interview”. This Loan Counseling Session is designed to inform you, the borrower, of your rights and responsibilities. Failure to complete the exit interview may result in a hold that will delay any future requests for transcripts from the university. The Direct Loan Exit Interview is available online at www.studentaid.gov. When you complete this form online, the information will automatically be sent to UNH and your lenders. In order to complete exit counseling, you will need to have the following information available: -FSA Username and password - Your social security number and driver's license number - Name, address, phone number of your expected employer - Name of the guaranty agency who guaranteed your student loans - Name of your lender - Name, address, and phone number of next of kin and two references whom the lender could contact if they should lose contact with you You can also view your borrower history, including your individual loan amounts, total loan debt, and guarantor/lender information. How to Complete Exit Counseling: Visit StudentAid.gov: Start by going to the U.S. Department of Education's Federal Student Aid website at www.studentaid.gov. Log in with Your FSA ID: Use your Federal Student Aid (FSA) ID to log in. Select "Complete Counseling": Once logged in, choose the "Complete Counseling" option and select "Exit Counseling." Follow the instructions to complete the counseling session. Cost of attendance and living expenses Tuition Information Books and supplies: $1,000* Transportation expenses: $1,200* Living expenses: $13,182* Miscellaneous - includes health insurance and other expenses: $4,440* *These figures are estimates because they are different for each student's circumstances. Your cost of living is variable. The good news is that housing costs in the immediate Concord area, since it is a small city, are typically lower than a large metropolitan area. About two-thirds of our students live in apartments within walking distance. Others choose to commute from greater distances. Check out the wide range of housing options in the Concord area. Scholarships - J.D. At UNH Franklin Pierce, our goal is to expand access to legal education to broad sectors of society and we offer several scholarships and grants in support of that goal. Every admitted JD student is automatically considered for the following awards: Dean’s Scholarships The Dean’s Scholarship is merit-based and awarded to admitted students with strong academic credentials (LSAT and GPA). The Dean’s Scholarship can range up to $41,000 for NH residents and $49,000 for non-residents. Access and Equity Grants Access and Equity grants are awarded to select admitted students from diverse backgrounds who bring strengths to the UNH Franklin Pierce law community. A few examples of these strengths include overcoming obstacles/adversity, employment, advanced degrees, and unique skills. Karl F. Jorda (STEM) Scholarship Recognizing the importance of STEM students in the practice of law, the Karl F. Jorda Scholarship is awarded to highly qualified STEM students who plan to pursue patent law or other IP specialties. The namesake for this scholarship was a longtime professor and renowned IP expert who leaves a significant legacy at UNH Franklin Pierce. Council on Legal Education Opportunity Legally Inspired Cohort (CLIC) Fellows Program Demonstrating its commitment to diversity, equity, and inclusion, UNH Franklin Pierce has partnered with the Council on Legal Education Opportunity, a national non-profit organization founded in 1968 to expand opportunities for minority and low-income students to attend law school. The CLIC Fellows program is a highly-competitive, ground-breaking program to identify, recruit, and train law school applicants who possess both the academic aptitude and leadership skills to attend UNH Franklin Pierce as a partner school. After successfully completing CLEO’s Pre-Law Summer Institute, up to five CLIC Fellows will be offered admission and attend UNH Franklin Pierce with at least half-tuition scholarship support. For more details and to apply please visit: (cleoinc.org) Practice-Ready Scholarship At UNH Franklin Pierce, we pride ourselves on providing a legal education that develops our students into “practice-ready” attorneys. As a sponsor of the college American Mock Trial Association Championships, Practice-Ready scholarships will be awarded to students who participate in American Mock Trial Association undergraduate competitions. Up to five scholarships with a total pool of $50,000 will be offered on a rolling basis each year. Please email the Admissions team after submitting your application if you are eligible and desire to be considered for this scholarship. New England Regional Tuition Break In partnership with the New England Board of Higher Education, UNH Franklin Pierce participates in the New England Regional Student Program which provides tuition savings based on residency in designated New England states and the law school program in which one is enrolled. For more information please visit: Tuition Break Online Database (nebhe.org) Law Preview Scholarships Sponsored By Lexis Nexis Law Preview (the nation's largest law school prep course) has teamed up with Lexis Nexis, one of the world’s leading online research providers, to provide Law Preview Scholarships to select members of our entering class. Lexis Nexis has generously agreed to help entering students prepare for the unique challenges they will face during their 1L year at UNH Franklin Pierce by paying the cost of tuition for a law school prep course. Review the Law Preview Scholarship information to see if you meet the scholarship criteria. Additional Scholarships and Grants Douglas J. Wood Chairman's Scholarships Wood scholars are selected from rising 2Ls who did not receive merit scholarships upon matriculation and who have demonstrated academic excellence, keen writing ability and service to the law school. The award for a Wood scholarship varies. These scholarships are funded from a donation by 1976 alumnus and former chairman of the board of the UNH School of Law, Douglas J. Wood, through a gift he received for distinguished service to a client. Endowed Scholarships Endowed scholarships have been established to honor alumni and friends of the UNH Law community and are available to entering and returning students who meet the specific criteria. Need-based Options The majority of funding for law school is acquired through student loans. Some are granted on a need-based determination. All require a good credit history. See the Loans section for complete information on federal, direct and private loans. On-campus employment is an option for students. Rudman Scholars Program Two rising 2L students with an interest in public service are eligible for scholarships worth up to $10,000, summer stipends for qualified public service, and additional leadership training through the law school’s Warren B. Rudman Center. U.S. Military Veteran/GI Bill® UNH Law is proud to support our veterans as a Yellow Ribbon participating school. GI Bill® is a registered trademark of the U.S. Department of Veterans Affairs (VA). More information about education benefits offered by the VA is available at the official U.S. government website. You may continue your scholarship search at: FinAid FastWeb UNH Fellowships Office The Law School Admission Council American Bar Association Legal Opportunity Scholarship Application SCHOLARSHIP DATABANK l ACCESSLEX Scholarships - Graduate Programs Residential Graduate Law Scho'''
