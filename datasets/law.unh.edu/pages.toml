["https://law.unh.edu/academics/journals/university-new-hampshire-law-review"]
title = "The University of New Hampshire Law Review | Franklin Pierce School of Law"
description = "The University of New Hampshire Law Review, formerly published under the title Pierce Law Review, replaced the peer-reviewed journal RISK: Health Safety and Environment."
full_description = 'The University of New Hampshire Law Review, formerly published under the title Pierce Law Review, replaced the peer-reviewed journal RISK: Health Safety and Environment. As one of two scholarly journals produced by University New Hampshire School of Law students, the UNH Law Review publishes articles of general legal interest exploring questions of law and unsettled legal issues. Read Past and Present Volumes on the UNH Scholars Repository Contact Us For a subscription or any hardcopy communications, please send address to: Business Manager The Univ. of New Hampshire Law Review Univ. of New Hampshire School of Law 2 White Street Concord, New Hampshire 03301 For any questions please email lawreview@law.unh.edu expand all About History The University of New Hampshire Law Review, formerly published under the title Pierce Law Review, replaced the peer-reviewed journal RISK: Health Safety and Environment. As one of two scholarly journals produced by University New Hampshire School of Law students, the UNH Law Review publishes articles of general legal interest exploring questions of law and unsettled legal issues. Our editing process shows great respect to the author’s voice and expertise and therefore emphasizes minimal textual and structural edits, while maximizing clarity. The Law Review’s primary focuses are to ensure every claim in a piece is fully and accurately supported, and to assess citations for their currency, accuracy, and conformance to Bluebook rules. Authors are provided with an Executive Editor to regularly report on the progress of a given article and provide particularized feedback. The University of New Hampshire Law Review publishes two to three issues per year and has published articles by such noted scholars as: Erwin Chemerinsky, Joshua E. Kastenberg, Lisa Heinzerling, Joan Costa-Font, Stephen Black, John D. Hutson, Robert C. Sarvis, Seth Barrett Tillman, Sanford Levinson, Gaytri Kachroo, Stephen B. Bright, Randolph N. Jonakait, Patrick Woods, and Calvin Massey. Submissions The University of New Hampshire Law Review accepts submissions year-round. While we prefer to receive submissions electronically, we also accept hard copy submissions. For those interested in submitting electronically, please use Scholastica, ExpressO, or send us a direct email to lawreview@law.unh.edu For hard copy submissions, please address your correspondence to: University of New Hampshire School of Law ATTN: UNH Law Review 2 White Street Concord, NH 03301 Further instructions for submitting In submitting your article, please include a cover letter and a copy of your curriculum vitae (or resume). Cover Letters should include your article’s title, word count, a brief description of the article, your name, contact information, and any other information that may be helpful in the selection process. Formatting Electronic submissions are preferred in Microsoft Word format, although we do accept PDF formats. If you have questions about the format, please inquire prior to your submission. Student Articles and Notes The University of New Hampshire Law Review accepts students’ scholarly works, but holds them to the same standards as any other author. Policies Publication Copyright The copyright in the article shall remain with the article’s author(s). Licensing, Reproduction, Distribution Authors grant to the Law Review a license to publish, print, reprint, post, and otherwise disseminate the article in any and all mediums. Specifically, authors grant to the Law Review: (a) an exclusive right of first publication provided, however, that an author may post drafts of the article on SSRN, ExpressO, Scholastica, or any other similar means of peer-review distribution, so long as the author notifies the Law Review; and (b) a nonexclusive right of publication thereafter. This non-exclusive license includes the right to authorize the electronic reproduction of the article by LexisNexis, Westlaw, Hein Online, or any similar electronic database, to authorize others to reproduce the article for noncommercial or educational purposes, and to transfer or sublicense the rights granted within our publishing agreement to the Law Review. Any reproduction of articles, including, but not limited to, publication, posting, or excerption in print or on the Internet, shall give attribution to the article’s original publication in the Law Review, using an appropriate method of citation such as: Originally published in [Volume] U.N.H. L. Rev. [Start Page] ([Year]). Franklin Pierce School of Law Hosts Leading Voices in Legal Education at Annual UNH Law Review Symposium One-day live and streaming event focuses on risk taking and reform in legal education Monday, December 04, 2023 On January 26, University of New Hampshire (UNH) Law Review hosts its annual Symposium online and in-person at UNH Franklin Pierce’s main building loc... Learn More UNH Franklin Pierce School of Law and the Warren B. Rudman Center for Justice, Leadership and Public Service Host Symposium on Election Law Friday, October 14, 2022 In a few short weeks, millions of voters across the country will go to the polls and cast their ballots in the 2022 midterm elections. This year’s ele... Learn More UNH Franklin Pierce Hosts Government Officials, Civic Leaders, and Renowned Scholars at Annual UNH Law Review Symposium Friday, September 16, 2022 One-day live and streaming event focuses on Contemporary Issues in Election Law Learn More Call for Papers: Contemporary Issues in Election Law Friday, July 01, 2022 The University of New Hampshire Law Review (UNHLR) and the Warren B. Rudman Center for Justice, Leadership & Public Service seek proposals for the UNH... Learn More UNH Law Review Volume 21 Editorial Board Friday, March 18, 2022 Announcing The University of New Hampshire Law Review editorial board for Volume 21! Learn More UNH Law Review Symposium: The War on Drugs 50 Years Later Wednesday, November 03, 2021 On October 29, 2021, the University of New Hampshire Law Review held their Symposium, "The War on Drugs 50 Years Later." Watch the recording here! Learn More UNH Law Review Call for Papers: The War on Drugs 50 Years Later Wednesday, June 09, 2021 CALL FOR PAPERS IS CLOSED! This Symposium will consider a broad range of papers that address state and/or federal drug-related legislation, policy imp... Learn More UNH Law Review Volume 20 Editorial Board Wednesday, March 24, 2021 Announcing The University of New Hampshire Law Review editorial board for Volume 20! Learn More UNH Law Review Volume 19 Editorial Board Thursday, October 08, 2020 Announcing The University of New Hampshire Law Review editorial board for volume 19! Learn More'
