["https://law.unh.edu/academics/degrees-certificates/masters-degrees"]
title = "Master's Degrees | Franklin Pierce School of Law"
description = "As a graduate student at UNH Law, you can map out your own path, collaborating with your advisor to determine the best courses and real-world work"
full_description = "Master's Degrees As a graduate student at UNH Law, you can map out your own path, collaborating with your advisor to determine the best courses and real-world work opportunities for a fulfilling law school experience. Our Master’s Degree program paves the way for you to become a respected specialist in your field or to earn expert credentials in the global landscape. Intellectual Property M.I.P. With more than 40 years of experience as an IP powerhouse, UNH Law and the Franklin Pierce Center for Intellectual Property boast a talented faculty, a global network of influential IP practitioners, and a rich array of IP resources and programs. Learn more International Criminal Law & Justice M.I.C.L.J. If you are looking to be at the forefront when it comes to grappling with the widening scope of international criminal law, this online program is for you. Learn more Commerce & Technology M.C.T.L. Our Commerce and Technology program is built at the intersection of business and law to tackle evolving legal issues facing new business and e-commerce in the global information age economy. Learn more Additional Information Tuition and Financial Aid Application Requirements Request Information Virtual Tour"
