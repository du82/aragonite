["https://law.unh.edu/about/why-unh-franklin-pierce"]
title = "Why UNH Franklin Pierce? | Franklin Pierce School of Law"
description = "Beyond our U.S. News and World Report  Top 10 distinction in intellectual property law, UNH Law is among the top 100 American Bar Association-accredited law schools in the nation. While we know rankings are important to prospective students, we also"
full_description = "Powerhouse We believe a law school experience should be innovative, rewarding, and ahead of the curve. We are proud to be New Hampshire’s law school and the pioneering law school for the information age. Students at UNH Franklin Pierce are immersed in the legal profession from their first day. Our programs are designed to offer relevant and practice-based knowledge, skills, and values so that when students graduate, they join a network of successful alumni who work in more than 80 countries. Graduate With Confidence You’ll leave here with what it takes to succeed. Client-ready skills. An unparalleled education you can only get from small class sizes and learning from experienced lawyers. On-the-job experience in legal residencies and clinics. We outperform our peers when it comes to what matters most – helping you obtain a high quality legal job. New Hampshire was the first state in the Northeast to adopt the Uniform Bar Exam. UNH Franklin Pierce graduates who take the UBE in N.H. earn a portable score that can be transferred to more than 25 states across the country. Our alumni practice in 48 states and in more than 80 countries."
