title = "ABPI & Franklin Pierce School of Law Partnership | Franklin Pierce School of Law"
description = "Learn about UNH Franklin Pierce School of Law's Intellectual Property programs, degrees, and certificates, including LLM, Master's, Graduate Certificate, Hybrid JD, and IP Summer Institute."
full_description = '''ABPI & Franklin Pierce School of Law Partnership Welcome ABPI Members! ABPI and the Franklin Pierce School of Law, a globally renowned American institution recognized for its tradition and excellence in Intellectual Property education, have established a partnership. This collaboration aims to enhance the professional development of IP practitioners, providing ABPI members with greater opportunities to meet the challenges of the global market. For more information about this partnership, visit https://abpi.org.br/en/franklin-pierce-2/ or contact sarah.dorner@law.unh.edu. Check out our partnership story in ABPIs newsletter! ABPI October 2024 Newsletter Through the Franklin Pierce-ABPI partnership, ABPI members are eligible for partial tuition scholarships to the following programs: Master of Laws in Intellectual Property (LLM) Designed for U.S. and foreign lawyers, students learn from industry and scholarly experts at the forefront of the field. Experience hands-on learning through clinics like the Intellectual Property and Transaction Clinic and the International Technology Transfer Institute. Program Details: Available in both on-campus and online formats. The on-campus program is completed fulltime between August to May. The online program has start dates in August and January and can be completed fulltime in one calendar year, or part-time in up to three years. Learn More Master's in Intellectual Property Designed specifically for non-law professionals, the MIP degree provides a deep and practical understanding of IP issues crucial in today’s competitive global landscape. A bachelor’s degree is required. Program Details: Available in both on-campus and online formats. The on-campus program is completed fulltime between August to May. The online program has start dates in August and January and can be completed fulltime in one calendar year, or part-time in up to five years. Learn More Graduate Certificate in Intellectual Property Designed for lawyers, students, and other professionals from various sectors, the Graduate Certificate in IP provides a specialized curriculum that equips you with essential knowledge and skills to work with IP in your respective fields. Program Details: Available in both on-campus and online formats. The on-campus program begins in August and ends in December. The online program has start dates in January and August and can be completed on a part-time schedule in up to 5 semesters. Learn More Intellectual Property Summer Institute (IPSI) Each summer, IPSI provides law students and legal professionals with a unique opportunity to deep dive into cutting-edge IP topics with world-class faculty, researchers, and industry professionals at Fortune 500 companies and Am Law 100 firms. Students gain expertise into today's trending IP topics and network within in-the-trenches leaders from different companies and firms all over the world. The short-term program (up to two weeks) typically takes place in June or July. Learn More Hybrid Juris Doctor (JD) in Intellectual Property, Technology, and Information Law Stay in your home. Stay in your job. Earn a JD. The one and only ABA-approved Hybrid JD in IP, Technology, and Information Law prepares students to navigate the complexities of technology and information law. Program Details: The program combines online learning with four in-person immersions per year (August, October, March, and June), ensuring that students receive a comprehensive education tailored to the growing demands of the legal field. The mostly online Hybrid JD starts in August and takes three to three and a half years to complete. Learn More Request Information .captcha { padding-bottom: 1em !important; } .wForm .captcha .oneField { margin: 0; padding: 0; } // initialize our variables var captchaReady = 0; var wFORMSReady = 0; // when wForms is loaded call this var wformsReadyCallback = function () { // using this var to denote if wForms is loaded wFORMSReady = 1; // cal