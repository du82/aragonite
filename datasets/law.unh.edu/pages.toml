["https://law.unh.edu/academics/academic-specialties"]
title = "Academic Specialties | Franklin Pierce School of Law"
description = "Our curriculum is not one-size-fits-all. Our students' experiences are designed to support long-term success in the legal field. Our curricular pathways, certif"
full_description = "Our curriculum is not one-size-fits-all. Our students' experiences are designed to support long-term success in the legal field. Our curricular pathways, certificate and dual-degree options, graduate degrees, and experiential learning opportunities are robust and intentional. We succeed when our students succeed. Explore Our Academic Specialties Intellectual Property UNH Franklin Pierce has one of the most respected and comprehensive patent law and practice programs in the country. Intellectual Property Public Interest & Social Justice At the Warren B. Rudman Center for Justice, Leadership and Public Service, our Public Policy and Social Justice program immerses you in today’s pressing policy issues. Public Interest & Social Justice Health Law & Policy Health care is one of the most critical issues facing society today. Lawyers need to be poised to help shape and manage policies affecting the health care delivery system as it expands and transforms. Health Law & Policy Sports & Entertainment Law Come to a place where it’s commonplace to have wide-ranging, thoughtful discussions with top players in sports and entertainment law on contemporary legal issues. Sports & Entertainment Law International Criminal Law & Justice UNH Franklin Pierce's online International Criminal Law and Justice program addresses fast-paced developments in the globalization of commerce, terrorism, human rights, and criminal law, especially over the past 30 years. International Criminal Law & Justice Commerce & Technology As we do more business online, our economy is changing. We face daily challenges created by new products and services, an increase in electronic commerce, and the growing proliferation of cybercrime. Commerce & Technology Graduate Programs As a graduate student at UNH Franklin Pierce, you can map out your own path, collaborating with your advisor to determine the best courses and real-world work opportunities for a fulfilling law school experience. Graduate Programs"
year_published = 2025
