title = "Media Inquiries | Yale Law School"
full_description = "Contact the Office of Public Affairs The Office of Public Affairs provides a range of services to print and broadcast media requesting information about the Law School, its faculty, research, students, staff, and programs.Filming or photography on Yale Law School premises by the news media or other organizations/commercial entities is not permitted without prior permission from the Yale Law School Office of Public Affairs. No press may enter Law School buildings without prior permission from the Office of Public Affairs. See below for more information on photography and filming on campus.Direct all media inquiries and faculty interview requests to publicaffairs.law@yale.edu. Please include in the body of your email the name of your publication, deadline, and the specific issue you are seeking comment on. View a list of staff contacts."
