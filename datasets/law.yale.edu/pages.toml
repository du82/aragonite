["https://law.yale.edu/our-school-location"]
title = "Our School & Location | Yale Law School"
full_description = "Discover Our Campus Yale Law School occupies one city block in the heart of Yale University and downtown New Haven. The University, as a vital part of the downtown area, has played a role in its redevelopment, supporting local merchants and attracting national retailers.New Haven offers many diversions. Strolling down the streets around the Law School, you will pass shops, clubs, and restaurants to suit any taste or budget. The rich cultural life includes Yale Repertory and the Long Wharf theaters as well as a host of music venues. Many parks and public beaches are easily accessible from the campus.New Haven is also a city of neighborhoods, from Wooster Square — New Haven’s “Little Italy,” widely known for its brick-oven pizza — to East Rock, a tree-lined enclave of Victorian homes and specialty shops, where many students choose to live.Law students have many opportunities to become involved with the New Haven community through a variety of student organizations and volunteer projects. Through the School’s clinical and experiential learning programs, students provide legal representation to those who cannot afford private attorneys’ fees in areas ranging from landlord-tenant law to immigration. Every year, a number of law students become so involved in the New Haven community that they choose to stay after graduation, working in local government, schools, or businesses. Every person at YLS seems to have about a dozen hidden talents and hundreds of insights. Every conversation was a chance to learn something new about the world. I loved being around thoughtful, perceptive people who challenged and encouraged me on a daily basis. Davis Parker|Class of 2024"
