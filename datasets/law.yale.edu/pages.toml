["https://law.yale.edu/admissions/jd-admissions"]
title = "JD Admissions | Yale Law School"
full_description = "The Juris Doctor Program At Yale Law School, students immerse themselves in big ideas, work closely with leading scholars, and gain incredible hands-on experience serving clients and communities in New Haven, across the country, and around the world.Yale Law School’s small student-faculty ratio creates exceptional learning experiences, including the 1L small group. During their first semester, students are assigned to a small group of 16-18 people for one of their four classes and take their first-semester classes together. This cohort helps students develop bonds with their peers and close connections to faculty.Students have countless opportunities to engage in research and writing under the supervision of the Law School’s world-renowned faculty. As part of the J.D. degree program, every student works closely with the faculty to complete two major research papers, and some students go on to publish their work. Yale Law School offers a variety of clinics and centers that provide opportunities to focus on specific areas of law, from veterans’ rights to criminal justice and environmental protection. Students can enroll in a clinic as early as the second semester of their first year. There is no shortage of ways for students to engage with the law, explore their interests, and learn the critical skills needed to lead and serve.The Tsai Leadership Program offers robust, cross-disciplinary training that enhances the traditional law school curriculum. Students can take courses including accounting and corporate finance, ethical decision-making, and organizational leadership, along with varied mentoring and professional development opportunities. The program equips students with the intellectual foundation and skills that are applicable and transferable to any career, including paths outside of traditional lawyering.Beyond the classroom, students have the opportunity to work with faculty members as research and teaching assistants and collaborate with peers through a thriving network of student organizations and journals. Yale Law School students leave law school with a broad skill set that provides unlimited career possibilities and personal and professional connections that last a lifetime."
