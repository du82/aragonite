title = "Centers & Workshops | Yale Law School"
full_description = "Abdallah S. Kamel Center for the Study of Islamic Law and Civilization Abdallah S. Kamel Center for the Study of Islamic Law and Civilization The Center's Kamel Lectures feature speakers from a range of disciplines who examine Islamic law and civilization. Brodie Center for Jewish and Israeli Law Brodie Center for Jewish and Israeli Law The Howard Wexler Brodie ’93 Center for Jewish and Israeli Law supports research and engagement with Jewish law, Israeli law, and their intersection. Center for Academic Freedom and Free Speech Center for Academic Freedom and Free Speech The Center for Academic Freedom and Free Speech (CAFFS) aims to become a leading hub for academic freedom and free speech and seeks to safeguard these values for future generations. Center for Global Legal Challenges Center for Global Legal Challenges GLC promotes the understanding of international law, national security law, and foreign affairs law. Global Health Justice Partnership Global Health Justice Partnership GHJP promotes research, projects, and academic exchanges in the areas of law, health, and human rights. Gruber Program for Global Justice and Women’s Rights Gruber Program for Global Justice and Women’s Rights The Gruber Program includes lectures, fellowships, and seminars on global justice and women's rights, including the Global Constitutionalism Seminar. Information Society Project Information Society Project ISP addresses the implications of the Internet and new information technologies for law and society. John M. Olin Center for Law, Economics and Public Policy John M. Olin Center for Law, Economics and Public Policy The Olin Center facilitates the scholarly work of the Yale law and economics faculty and supports student interest and research in the field. Justice Collaboratory Justice Collaboratory The Justice Collaboratory brings together scholars and researchers to work on issues related to institutional reform, policy innovation, and advancement in criminal 