["https://law.yale.edu/leadership/resources/mentorship-networking"]
title = "Mentorship and Networking | Yale Law School"
full_description = "A Dynamic Alumni Community Yale Law School graduates have always pursued an extraordinary range of careers, many of them unconventional, yet all of them compelling. The Tsai Leadership Program at Yale Law School supports its students and alumni with dedicated and customized resources designed to magnify the many trajectories that students can pursue, for any career they choose. The program harnesses the power of the dynamic Yale Law School alumni network to provide students with critical connections and inspiring mentors from a diverse array of industries and life backgrounds, including those who have found pathways outside of traditional legal practice.With more than 13,000 alumni of Yale Law School, there is no shortage of engaged graduates who are eager to impart their wisdom by providing support, advice, and guidance to students as they explore and discover their possibilities and embrace their full potential.The mentorship component of the Tsai Leadership Program features unique mentorship events, professional networking opportunities, and the individualized cultivation of connections between students and graduates. The Law School also offers students access to an innovative platform called The Courtyard — a digital community that makes it easy for students to connect with alumni all over the world.In addition, Yale Law School provides a high-touch career advising experience through a partnership between The Tsai Leadership Program and the Law School’s Career Development Office. The Tsai Leadership Program bolsters counseling resources with individually tailored advising on nonlegal career tracks, working with students as they evaluate goals, select courses, explore professional pathways, and navigate job searches. Yale Law School students receive the full support of the YLS community as they discover and pursue their professional and leadership potential. Alumni Leaders Alumni Leaders Paul Breloff ’06 A Lifelong Learner Read More Jacquelyn 