full_description = "Members of the Yale Law School community can submit an event to the YLS online calendar. Your event will also automatically be included in:YLS Weekly Events email on Mondays. Deadline: Previous Friday at 4 p.m.YLS Daily Events email on Tuesdays–Fridays.Deadline: Previous day at 5 p.m. READ EVENT POLICIES BEFORE PLANNING AN EVENT How to Submit: Log in to submit an eventStarred fields are required.There is a character limit for event titles.An event description that includes the speakers, format, and topic of the event is required.Scroll down to the bottom of the screen and select “Needs Review” from the drop-down beside Save As.Click SaveOnce your event is submitted, it will be reviewed and approved by the Office of Public Affairs before going live on the website.See detailed instructions YLS Student Organization EventsPlease start in your group’s portal on the Yale Connect platform.Events listed on the Yale Connect calendar can also be seen on the YLS calendar if they are tagged to “YLS Website.”Direct questions about Yale Connect to the Office of Student Affairs. Additional NotesEvents posted on the YLS calendar are viewable by the public. We recommend you use an RSVP tool or list an email contact to distribute Zoom links.Event organizers planning to invite press to an event on the Law School campus must notify the Office of Public Affairs in advance for approval.If you are outside the YLS community, please email the Office of Public Affairs for more information.For AV support and services, please submit an AV request form. Have a Question?Contact Us"
