full_description = "The community at YLS is absolutely incredible. You have the opportunity to learn from some of the smartest legal minds in the world while forming meaningful relationships with your classmates. Adam Henderson|Class of 2023 Home Studying Law at Yale Clinical and Experiential Learning Our Clinics Policing, Law, and Policy Clinic The Policing, Law, and Policy Clinic focuses on translating cutting-edge empirical research on policing reform into real-world policies. Students take part in drafting model legislation, regulations, white papers, testimony, and other materials.Instructors:Tracey MearesJorge X. Camacho Ways to Engage Our Clinics Yale Law School offers more than 30 clinics that provide students with hands-on, practical experience in the law on a diverse range of subject matters. Read More About Clinics Simulation Yale Law School offers a suite of innovative simulation courses based on real-world case studies. Learn about Simulation Courses Centers and Workshops Yale Law School enhances the intellectual life of its academic community by sponsoring a variety of centers, programs, and workshops, inspired by the interests of its faculty and students. Our Intellectual Centers The community at YLS is absolutely incredible. You have the opportunity to learn from some of the smartest legal minds in the world while forming meaningful relationships with your classmates. Adam Henderson|Class of 2023"
