["https://law.yale.edu/about-yale-law-school/new-haven-and-region/dining-and-shopping"]
title = "Dining and Shopping | Yale Law School"
full_description = "Restaurants New Haven has a tantalizing array of restaurants ranging from Belgian to Cuban, from the restaurant that invented the hamburger and the best pizza this side of Italy. The list below focuses on restaurants within walking distance or a short ride from the Law School and is by no means comprehensive.Restaurants near Yale Law School on Google MapsNew Haven Restaurant GuidesInfo New Haven Dining GuideVisit New Haven Restaurant SearchConnecticut Insider Home About Yale Law School New Haven and The Region Dining and Shopping Restaurants New Haven has a tantalizing array of restaurants ranging from Belgian to Cuban, from the restaurant that invented the hamburger and the best pizza this side of Italy. The list below focuses on restaurants within walking distance or a short ride from the Law School and is by no means comprehensive.Restaurants near Yale Law School on Google MapsNew Haven Restaurant GuidesInfo New Haven Dining GuideVisit New Haven Restaurant SearchConnecticut Insider Section Menu New Haven and the Region Neighborhoods Dining and Shopping Sports & Recreation Music, Dance, and Theater Museums Accommodations Archie Moore’s (Sports Bar)Ashley’s Ice CreamAtelier Florian (Oyster Bar and Belgian)Atticus Bookstore and CafeAu Chalet (Swiss)BAR (Pizza and Brewpub)Barcelona Wine Bar (Spanish)Claire’s Corner Copia (Vegetarian)Elm City Social (Cocktails/Gastropub)G Café (Bakery and Lunch)Geronimo (Tequila Bar and Southwest Grill)Harvest Wine Bar & Restaurant (New American)Heirloom (Modern American)House of Naan (Indian)Hunan House (Chinese)Junzi (Chinese)La Cosinita (Mexican)L’Orcio (Italian)Louis’ Lunch (Burgers)The Luke (Brasserie)Mamoun’s Falafel (Middle Eastern)Mezcal (Mexican)Miso (Japanese) Midpoint Instanbul (Modern Mediterranean)Modern ApizzaOlea (Spanish)Olmo (American, Bagels, Breakfast to Go)Pacifico (Nuevo Latino)The Pantry (Breakfast)Frank Pepe Pizzeria NapoletanaPrime 16 (Burgers, Brewpub)Ramen Kuro ShiroRudy's (Bar/Restaurant)Sally's ApizzaSandra's Next Generation (Soul Food)September in Bangkok (Thai)Shake ShackSherkaan (Indian Street Food)South Bay Mediterannean Kitchen (Mediterranean)Taste of China (Chinese)Tre Scalini Ristorante (Italian)Union League Café (Continental)Yorkside (Pizza/Greek)Zaroka (Indian)Zinc (Modern American) Shopping The city offers a range of shopping, from the practical to the luxurious. You'll find supermarkets, pharmacies, and discount outlets in every neighborhood, as well as favorites like Patagonia and Urban Outfitters on Broadway, just two blocks from the Law School. If you're looking for something special, there are one-of-a-kind boutiques, galleries, and gift shops to explore. IKEA is a few miles away for low-cost home furnishings.Broadway & York Streets (two blocks) This area offers books, Yale souvenirs, jewelry, fashion, outdoor clothing and equipment, cosmetics, homemade ice cream, delicious food 24 hours a day, and more. Stores include The Yale Bookstore, Grey Matter Books, Apple, Lululemon, Ashley's Ice Cream, and J. Crew.Chapel Street (four blocks) A great street for window shopping with boutique stores carrying gifts, art, jewelry, fine clothes, and more. Chapel Street is home to Hull’s Art Supplies and Framing, EBM Vintage, and Derek Simpson Goldsmith. When you need a rest, stop at Atticus Bookstore/Café or The Book Trader for a sandwich served on freshly baked bread.Marketplace of Hamden (4.4 miles) Shopping options range from discount clothing and household goods to groceries and office supplies. Plan to stock up on all the essentials at stores such as Staples, Old Navy, T.J. Maxx, Petco, Modell's, Super Stop & Shop supermarket and more.North Haven Universal Drive (5 miles) This area features BJ’s, Target, and Home Depot. You will also find Michael’s Crafts, PetSmart, DSW, Red Lobster, Dick's Sporting Goods, Barnes and Noble, and a large multiplex cinema.Westfield Connecticut Post Mall (11 miles) You will find department stores such as Macy’s and Target, clothing for adults and children at Gap, H&M, and Express, jewelry shops, cosmetics, cell phones, housewares, a movie theatre, a food court, and much more.Clinton Crossing Outlet Center (23 miles) - More than 70 stores for premium discount shopping, including Polo Ralph Lauren, Nike, Tommy Hilfiger, Saks Off 5th, Kenneth Cole, BCBG, Gap, Bose, and Coach. Categories include designer fashions and sportswear, shoes, children's fashions, gifts and specialty items, luggage and leather goods, housewares and home furnishings."
