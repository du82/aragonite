title = "Homepage | Yale Law School"
description = "Located in New Haven, Connecticut, Yale Law School is one of the world’s premier law schools. It offers an unmatched environment of excellence and educational intimacy in the form of world renowned faculty, small classes, limitless opportunities for clinical training, and strong encouragement of public service."
full_description = "Constitutional Law The Law School is renowned as a center for scholarship in constitutional law, and prominent scholars are well represented on the School’s faculty. View Constitutional Law Corporate & Commercial Law The Law School offers a strong curriculum in corporate and commercial law as well as joint and doctoral degree programs. View Corporate & Commercial Law Criminal Justice Yale Law School offers a rich academic experience studying criminal law through many different lenses. View Criminal Justice Environmental Law Outstanding faculty, new curricular offerings, and strong partnerships are part of our expanded environmental law and policy program. View Environmental Law Human Rights Law A diverse program of human rights activities that serve students and scholars at Yale and contribute to the development of human rights. View Human Rights Law International Law The Law School’s longstanding international tradition occupies a central place in its intellectual life. View International Law Law & Economics The Law School is at the heart of a movement to expand the once-narrow field of law and economics. View Law & Economics Law & Health Examining how law and policy affect individual and public health, the health care industry, and health governance. View Law & Health Law Teaching Our Law Teaching Program provides current students and post-graduate fellows with training and information about careers in academia. View Law Teaching Legal History The history of law offers indispensable insights into the character of our legal systems. View Legal History Public Interest Law Yale Law School has a strong tradition of service in the public interest. Most YLS students perform public service activities during their time here. View Public Interest Law Technology & Media Law Information Society Project (ISP) is an intellectual center addressing the implications of the Internet and new technologies. View Technology & Media Law Scholars Convene for Inaugural Free Speech Conference Reflecting on Woodward Report A conference held at Yale Law School convened scholars for a conversation about academic freedom and free speech to mark the 50th anniversary of Yale’s Woodward Report on freedom of expression. Scholars Convene for Inaugural Free Speech Conference Reflecting on Woodward Report"
