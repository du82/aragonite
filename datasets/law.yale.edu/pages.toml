["https://law.yale.edu/admissions"]
title = "Admissions & Financial Aid | Yale Law School"
description = "Student Body Receiving Need-Based Aid"
full_description = 'Alexander Komarov LLM A student perspective on criminal law, financial aid, and getting an LL.M. at Yale Law School. Susanna D. Evarts ’18 A student perspective on the Worker and Immigrant Rights Advocacy Clinic at Yale Law School. The point I keep making to folks that ask me what the best part was of being a Yale Law student, it’s community. And it really is the community I found there. That community stays with you for your whole life.” Corey Booker ’97|U.S. Senator Home Admissions & Financial Aid A Place for Thought and Action For two centuries, Yale Law School has been a leader in legal education, providing students with an extraordinary intellectual environment in which to study law. Our community is committed to world-class scholarship, professional excellence, and service to others. From the first class meeting to the final gathering at Commencement, you’ll learn from faculty of unmatched talent and qualifications alongside an extraordinary group of classmates. Our curriculum spans traditional "black-letter" classes, cutting-edge legal theory, and interdisciplinary courses. Students undertake independent writing projects following their own academic interests or organize reading groups around a specific topic.Yale Law School offers roughly 30 clinics that provide hands-on, practical experience in the law on a diverse range of subject matters. The Tsai Leadership Program trains students to be numerate, tech-savvy global citizens by bringing leading experts to our classrooms and providing an abundance of robust curricular and programmatic opportunities. Conferences and panels throughout the year provide additional opportunities to explore ideas about the law and its role in society.With a vast array of courses, an unparalleled clinical program, and countless opportunities outside the classroom, students are empowered to chart their own course and launch impactful careers. YLS by the Numbers Yale Law School offers an unmatched intellectual environment with numerous opportunities for students to immerse themselves in the law and make a positive impact on society. Learn more about what sets Yale Law School apart as a leader in legal education. By the Numbers J.D. Admissions JD Admissions An unmatched environment of excellence and educational intimacy Graduate Programs Graduate Admissions Students from all over the world come to Yale Law School to deepen their understanding of the law. Cost & Financial Aid Financial Aid Resources and programs designed to make it possible for students to pursue their legal education at Yale Take a Virtual Tour of YLS Explore our campus and learn more about academics, student life, clinics, admissions, financial aid, and more. Take the tour Discover YLS and New Haven 74% Student Body Receiving Need-Based Aid 64% Student Body Receiving Scholarship ~$30K Average J.D. Scholarship Student and Alumni Profiles LISTEN TO OUR STORIES Lexi Smith ’22 A student perspective on studying animal and environmental law at Yale Law School. Alexander Komarov LLM A student perspective on criminal law, financial aid, and getting an LL.M. at Yale Law School. Susanna D. Evarts ’18 A student perspective on the Worker and Immigrant Rights Advocacy Clinic at Yale Law School. The point I keep making to folks that ask me what the best part was of being a Yale Law student, it’s community. And it really is the community I found there. That community stays with you for your whole life.” Corey Booker ’97|U.S. Senator'
