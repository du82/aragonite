["https://law.yale.edu/leadership/about/reading-groups"]
title = "Reading Groups | Yale Law School"
full_description = "About Tsai Leadership Program Reading Groups In addition to its curriculum, the Tsai Leadership Program hosts several reading groups throughout the academic year. Organized by students and sponsored by the Dean or another member of the faculty, reading groups bring together a small number of students and industry leaders — often Yale Law alumni — to create unique opportunities to engage deeply with specific topics outside of a traditional classroom setting.Reading groups play a vital role in fostering intellectual curiosity, facilitating in-depth discussion, and creating a collaborative and interactive learning environment. The range of topics reflects the Leadership Program’s commitment to offering a rich and multifaceted law school experience and promoting the academic interests of the groups’ student leaders.These groups often explore the intersection of law, business enterprise, leadership, and public policy, further equipping students with skills and insights needed to address current global challenges. Through them, students have the opportunity to delve into specialized areas of law, collaborate with esteemed faculty and alumni, and contribute to the vibrant scholarly community that defines Yale Law School.Current Reading Groups“Policy, Finance, and the Real Economy: Finding Pathways to Net Zero” — Brian Deese ’09, Former Director of the National Economic Council, and Mark Wiedman ’96, Head of the Global Client Business, BlackRock“Post-Dobbs Strategy” — Fatima Goss Graves ’01, President and CEO, National Women’s Law CenterPrevious Reading Groups“Countering Domestic Extremism” — Robert Post ’77, Sterling Professor of Law“How to Be an Effective Policymaker” — Cristina Rodríguez ’00, Leighton Homer Surbeck Professor of Law and Counselor to the Dean“Leadership Ethics” — Amy Schulman ’89, Managing Partner, Polaris Partners“Leading in Crisis” — Joseph Tsai ’90, Co-founder and Chairman, Alibaba Group“Navigating Public Sector Careers & Leadership” — Cristina Rodríguez ’00, Leighton Homer Surbeck Professor of Law and Faculty Director of the Ludwig Program in Public Sector Leadership“Securing a Human-Centric Future in an Algorithmic Age” — John P. McCormick ’95, Investor and Former Senior Managing Director, Blackstone “These are student-initiated and student-led. It gives the students a chance to bring in some of the leading figures on these topics to discuss questions that are important to them. I learned a great deal from taking part and I know the students did as well.” Dean Heather K. Gerken"
year_published = 2025
