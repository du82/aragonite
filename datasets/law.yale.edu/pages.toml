full_description = "Welcome to Yale Law School! Tours led by current students at Yale Law School depart from the main entrance at 127 Wall Street every Monday and Friday during the academic year. Attendees must register in advance.You can also explore our virtual tour. Yale is the finest law school in the country, and as a result, we are able to admit students who will become leaders in the country, and indeed around the world, in many fields. David Schleicher|Professor of Law Home About Yale Law School Visit The Law School Take a Tour Welcome to Yale Law School! Tours led by current students at Yale Law School depart from the main entrance at 127 Wall Street every Monday and Friday during the academic year. Attendees must register in advance.You can also explore our virtual tour. Section Menu Visit & Directions Take a Tour Text-Based Virtual Tour Directions Take a Virtual Tour of YLS Explore our campus and learn more about academics, student life, clinics, admissions, financial aid, and more. Take the tour Discover YLS and New Haven Guided Tours of Yale University The Mead Visitor Center is the front door of Yale University and welcomes its visitors from around the world. It is located at 149 Elm Street, across from the New Haven Green. Drop by for information about Yale or to take a guided walking tour led by Yale College undergraduates. For more information, contact the Visitor Information Center at (203) 432-2300. Yale is the finest law school in the country, and as a result, we are able to admit students who will become leaders in the country, and indeed around the world, in many fields. David Schleicher|Professor of Law"
