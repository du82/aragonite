["https://law.yale.edu/studying-law-yale/clinical-and-experiential-learning"]
title = "Clinical and Experiential Learning | Yale Law School"
full_description = "Harley F. Etienne MSL A student perspective on the M.S.L. program and the inspiring community at Yale Law School. Home Studying Law at Yale Clinical and Experiential Learning A Robust and Unique Clinical Program Yale Law School has one of the most robust clinical programs in the country. Unlike most other schools, students can begin taking clinics—and appearing in court—during the spring of their first year. Clinic students represent real clients with real legal problems (not in simulations or role-playing exercises), and are supervised by senior faculty members, with whom they often develop close and lasting mentoring relationships.Opportunities abound in the Jerome N. Frank Legal Services Organization—a single law firm that currently houses nine clinics, including the Samuel Jacobs Criminal Justice Clinic and the Ludwig Center for Community and Economic Development. In addition to the complete list of clinics and projects, a number of other centers and programs also offer experiential learning opportunities. Simulation courses are also offered in such areas as Appellate Advocacy, Corporate Crisis Management, and Negotiating and Drafting M&A Agreements. 30+ clinics 90% of students participate in clinics 24 centers 12 workshops Ways to Engage Our Clinics Yale Law School offers more than 30 clinics that provide students with hands-on, practical experience in the law on a diverse range of subject matters. Read More About Clinics Simulation Yale Law School offers a suite of innovative simulation courses based on real-world case studies. Learn about Simulation Courses Centers & Workshops Yale Law School enhances the intellectual life of its academic community by sponsoring a variety of centers, programs, and workshops, inspired by the interests of its faculty and students. Our Intellectual Centers Clinic News Featured News In The Press News Service Matters: How Yale Law School Clinics Change the World From modest beginnings, the clinical program at the Law School has grown into one of the school’s crown jewels. Service Matters: How Yale Law School Clinics Change the World News Podcast: Marisol Orihuela Fights for Mental Health Justice Podcast: Marisol Orihuela Fights for Mental Health Justice News Class Assignment in Affordable Housing Now Under Construction Class Assignment in Affordable Housing Now Under Construction News Clinic Files Petition in California Highway Construction Case Clinic Files Petition in California Highway Construction Case View All Featured News Podcast: Marisol Orihuela Fights for Mental Health Justice Podcast: Marisol Orihuela Fights for Mental Health Justice News Farmworkers Sue for Abuse of Migrant Worker Program at Connecticut Farm Farmworkers Sue for Abuse of Migrant Worker Program at Connecticut Farm News Class Assignment in Affordable Housing Now Under Construction Class Assignment in Affordable Housing Now Under Construction News Lowenstein Clinic and Partners Publish Report on Family Separations at U.S. Border Lowenstein Clinic and Partners Publish Report on Family Separations at U.S. Border News Clinic Files Petition in California Highway Construction Case Clinic Files Petition in California Highway Construction Case News MFIA Clinic Helps Journalist Uncover Jail Secrets MFIA Clinic Helps Journalist Uncover Jail Secrets All Clinic News Yale Daily News Lamont Proposal to End Free Texts for Incarcerated People Weakens Historic CT Law Lamont Proposal to End Free Texts for Incarcerated People Weakens Historic CT Law CT Insider In Connecticut’s Criminal Courts, The Wait for Justice Becomes ‘Part of the Punishment’ In Connecticut’s Criminal Courts, The Wait for Justice Becomes ‘Part of the Punishment’ The Intercept Trump is Saying the Quiet Part Out Loud: Federal Prisons are Purposely Inhumane Trump is Saying the Quiet Part Out Loud: Federal Prisons are Purposely Inhumane The Atlantic Government Workers Cannot Be Fired for their Political Views — A Commentary by John Langford ’14 and