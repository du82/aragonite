["https://law.yale.edu/launchpad"]
title = "Yale Law School Launchpad Scholars Program | Yale Law School"
full_description = "It’s the perfect program for you if you are struggling with having that extra push toward your dreams. Kira Burns|Launchpad Scholar Launch Your Future The Launchpad Scholars Program equips participants with the tools and resources needed to apply to any law school they choose Like Minds A look at the start of the second year of the Launchpad Scholars Program Breaking Down Barriers The first cohort of 25 Launchpad Scholars spent a week at Yale Law School in June for a week of mock classes, workshops, and other events Have Questions? Detailed answers about the program, application, and more Welcome The Yale Law School Launchpad Scholars Program, powered by Latham & Watkins, is focused on increasing opportunity and access to education and the legal profession. With rising law school application costs and other barriers limiting access to the legal profession, a law degree can be out of reach for some students. This innovative program aims to ensure that excellent applicants from all backgrounds can maximize their potential as law students and legal professionals, empowering them to become leaders in their future careers.The Launchpad Scholars Program is designed to meet talented, prospective applicants where they are, provide the knowledge and skills they need to apply to and enroll in law school, thrive while there, and go on to become leaders in their chosen fields. At no cost, Launchpad provides participants with application and career readiness support, substantial LSAT preparation, attorney and law student mentorship, and other resources that will prepare participants to apply to any law school of their choosing. Discover the Program About the Program LSAT preparation, workshops, mentorship, a weeklong residential program, and more. Learn About Launchpad How to Apply Information on the application process, key dates, and eligibility. Apply Now FAQs Answers to your most-asked questions. Get the Details Apply to the Program Applications to the Launchpad Scholars Program 2025-2026 cycle are now open. We invite interested applicants to submit an application. Apply Now Info sessions Sponsorship Learn more about our sponsor Latham & Watkins LLP. It’s the perfect program for you if you are struggling with having that extra push toward your dreams. Kira Burns|Launchpad Scholar"
