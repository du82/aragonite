title = "Summer Public Interest Fellowship (SPIF) | Yale Law School"
full_description = 'About Summer Fellowship Aid / SPIF Yale supports one of the most expansive programs of summer public interest work in the law school world. In the summer of 2024, we provided financial support to many students through the Summer Public Interest Fellowship (SPIF) program. We will continue this program for the summer of 2025 supporting Yale students working in public interest, government, and not-for-profit organizations."As an older student with previous educational and asset debt, the impulse was strong to prioritize the financial benefits of working at a firm over the valuable public interest experiences that would help me as an aspiring civil rights lawyer. SPIF not only allayed those fears for me, it helped me to make a contribution to a public interest organization working with meager means, in addition to allowing such organizations to benefit from the unique talent and drive of YLS students. While my summer colleagues struggled to obtain funding for their work, I felt extremely lucky to have SPIF on my side."- Viviane Scott, J.D. Candidate, Class of 2014In the summer of 2024 SPIF awards supported YLS student work at more than 100 diverse organizations and agencies including:'
