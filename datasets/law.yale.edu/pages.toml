at the Future Holds, Carnegie Endowment Conference Center, Washington, DC,Dec. 14, 2012• “The Health Care Case,” AALS Annual Conference,New Orleans, LA, Jan. 6, 2013• “Sexual Freedom and the Constitutional Text,” Conference on Liberty/Equality: The View from Roe’s 40th and Lawrence’s 10th Anniversaries, UCLA Law School, Jan. 19, 2013• “Verdi’s High C,” Conference on Constitutional Foundations, University of Texas, Austin, TX, Feb. 15, 2013• “Non-Originalist Uses of History,” Conference on the New Originalism, Fordham Law School, NY, Mar. 2, 2013Publications• The First Amendment Is An Information Policy, 41 HOFSTRA L. REV. 1 (2012)• The Dangerous Thirteenth Amendment, 112 COLUM. L. REV. 1459 (2012) (with S. Levinson)• Room for Maneuver: Julie Cohen’s Theory of Freedom in the Information State, 6 JERUSALEM REV. LEGAL STUD. 79 (2012)• What It Will Take for Barack Obama to Become the Next FDR, THE ATLANTIC ONLINE, Nov. 1, 2012• How Obama Can Prevent Another Debt-Ceiling Crisis, THE ATLANTIC ONLINE, Dec. 9, 2012Robert A. BurtLectures And Addresses• Jewish Medical Students Association, Yale Medical School, New Haven, Symposium on “Religious Freedom and Male Circumcision,” Oct. 31, 2012• Yale Medical School Bioethics Program, New Haven, Symposium on “What Is a Good Death,” Nov. 5, 2012• Greenwall Foundation Bioethics Faculty Scholars Program, New York, “Constructing a Career: Looking Back,” Nov. 29, 2012• Yale Institute for the Study of Anti-Semitism, New Haven, Commentary on Richard Weisberg’s lecture, “Flexiphobia,” Dec. 3, 2012• Renaissance Weekend, Charleston, SC, “Injustice and the Book of Job,” Dec. 29, 2012• Zuckerman Mind, Brain, Behavior Institute, Columbia University, New York, NY, “The Insanity Offense,”Apr. 5, 2013Other Professional Highlights• Visiting Senior Research Scientist, Zuckerman Mind, Brain, Behavior Institute, Columbia University, New York, NY, Jan. 1–June 30, 2013• Advisory Board, Dance for PD, Mark Morris Dance Company, Brooklyn, NYGuido Calabresi