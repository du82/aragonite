["https://law.yale.edu/student-life/career-development/alumni"]
title = "For Alumni | Yale Law School"
full_description = "Resources to Make Informed Career Decisions CDO offers individualized, comprehensive, and versatile support to YLS alumni at all stages of their careers.Our support includes one-on-one counseling and strategizing, resume and cover letter review, and mock interviews. We also offer a large variety of internal and external resources for alumni at every stage of career, and at every juncture of potential job and career transition.We encourage YLS alumni who have not yet done so to join the Courtyard, YLS’s online community – as well as to take a look at the alumni portions of our website, and to make use of our resources and support, which address all stages of career transition and exploration. We are committed to opening our doors to the students who have the most to gain from this School and the most to give to the world, regardless of their means. Heather K. Gerken|Dean and Sol & Lillian Goldman Professor of Law"
