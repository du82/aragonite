["https://law.yale.edu/study-law-yale/alumni-student-profiles"]
title = "Alumni & Student Profiles | Yale Law School"
full_description = "Ross Puritty ’26 Army veteran Ross Puritty ’26 discusses how his time at West Point served as a laboratory in learning how to lead people. He also shares how veterans enrich student life at Yale Law School. Emily Elledge ’26 After piloting Ospreys in the Marine Corps, Emily Elledge ’26 pivoted to law school as a new challenge. She discusses how the law provides a different way to serve her country. James Geraghty ’80 Geraghty discusses his career in the biotechnology industry and the risks and rewards of developing drugs for rare genetic diseases. He also shares his thoughts on managing in a crisis. Becca Heller ’10 Heller, CEO and co-founder of the International Refugee Assistance Project (IRAP), discusses the challenges of starting a nonprofit as a law student and how she learned to become a leader. Frank Jimenez ’91 Jimenez, the Vice President and General Counsel of GE HealthCare, talks about the support he found at the Law School and the importance of giving back. Leondra Kruger ’01 Kruger, a Justice on the Supreme Court of California, speaks about how Yale prepared her for a job in which she gets to think deeply about the law and be of service. Nabiha Syed ’10 Syed, the Executive Director of the Mozilla Foundation, describes how law school gave her the freedom to pursue a different legal career path. My Khanh Ngo ’17 Ngo, a Staff Attorney at the ACLU Immigrants’ Rights Project, recounts her clinical work on the 2017 travel ban and how experiential education prepared her for a career in the public interest. Cory Booker ’97 Booker, a U.S. Senator, talks about the ways Yale Law School launched his political career and taught him to make connections across the aisle. Guido Calabresi ’58 Beloved professor, former dean, and alumnus, Judge Guido Calabresi speaks poignantly about his decades at the Law School. Ana Mier Valdivia ’26 A Navy lieutenant discusses attending Yale Law School through the Navy’s Law Education Program while she remains on active duty."
