["https://law.yale.edu/admissions/nondiscriminationtitle-ix-statements"]
title = "Nondiscrimination, Title IX, & Clery Act Statements | Yale Law School"
full_description = "Home Admissions & Financial Aid Nondiscrimination, Title IX, & Clery Act Statements Yale University’s Nondiscrimination, Title IX, and Clery Act Statements The University is committed to basing judgments concerning the admission, education, and employment of individuals upon their qualifications and abilities and affirmatively seeks to attract to its faculty, staff, and student body qualified persons of diverse backgrounds. University policy is committed to affirmative action under law in employment of women, minority group members, individuals with disabilities, and protected veterans. Additionally, in accordance with Yale's Policy Against Discrimination and Harassment, and as delineated by federal and Connecticut law, Yale does not discriminate in admissions, educational programs, or employment against any individual on account of that individual's sex, sexual orientation, gender identity or expression, race, color, national or ethnic origin, religion, age, disability, status as a special disabled veteran, veteran of the Vietnam era or other covered veteran. Inquiries concerning Yale's Policy Against Discrimination and Harassment may be referred to the Office of Institutional Equity and Accessibility (OIEA): W.L. Harkness Hall, 3rd Floor, Room 303, 100 Wall Street, New Haven, CT 06511; 203.432.0849; equity@yale.edu.Title IX of the Education Amendments of 1972 protects people from sex discrimination in educational programs and activities at institutions that receive federal financial assistance. Questions regarding Title IX may be referred to the University's Title IX Coordinator, Elizabeth Conklin, at 203.432.6854 or at titleix@yale.edu, or to the U.S. Department of Education, Office for Civil Rights, 8th Floor, Five Post Office Square, Boston MA 02109-3921. Telephone: 617.289.0111, Fax: 617.289.0150, TDD: 800.877.8339, or Email: ocr.boston@ed.gov.In accordance with the Jeanne Clery Disclosure of Campus Security Policy and Campus Crime Statistics Act (Clery Act) as well as other applicable federal and state laws, the University publishes an annual campus security and fire safety report. This report contains three years' worth of campus crime statistics concerning crimes committed within the geographical limits of the University as defined by the Clery Act; security policy statements; fire safety information; and a description of where students, faculty and staff should go to report crimes. The fire safety section of the annual report contains information on current fire safety procedures and if any fires occurred within an on campus student housing facility. You may request a copy from the Office of Administration, P.O. Box 208322, New Haven, CT 06520-8230, or by contacting Yale Public Safety at 203-432-4400. A copy is also available online."
year_published = 2025
clearnet = "https://law.yale.edu/admissions/nondiscriminationtitle-ix-statements"
