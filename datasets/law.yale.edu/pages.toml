["https://law.yale.edu/leadership/private-sector"]
title = "Michael S. and Alexa B. Chae Initiative in Private Sector Leadership | Yale Law School"
full_description = "“The best way I can describe my leadership journey is one of being a perpetual student and recognizing the ever-present necessity to evolve. You never stop growing. - Nicholas Turner, Class of 1996 Michael S. and Alexa B. Chae Initiative in Private Sector Leadership The Chae Initiative in Private Sector Leadership was founded by Michael Chae '97 and Alexa Chae '97. Read more about our Founders. Part of The Tsai Leadership Program at Yale Law School, the Michael S. and Alexa B. Chae Initiative in Private Sector Leadership provides focused educational and professional development to Yale Law School students who aspire to nontraditional careers and leadership roles in the private sector. The Chae Initiative helps prepare students for careers in areas such as business, finance, investing, management consulting, and entrepreneurship.Many Yale Law School alumni enjoy careers in the private sector outside of traditional lawyering. The Chae Initiative advises students as they master the intellectual foundations of numeracy through courses such as financial modeling, statistics, accounting, and data science. The Chae Initiative also supports professional development through programming on the values, ethics, skills, and theories of management and leadership across a wide spectrum of private sector organizations.The Chae Initiative's core philosophy is to empower Yale Law students to be professionally ready and capable of translating theory into practice, to obtain a firm grasp of business principles, to be nimble in the face of complex business issues and innovation, and to engage in ethical decision-making within a global business environment. The Chae Initiative is premised on the notion that a law degree is an all-purpose thinking and problem-solving degree and provides a crucial foundation that will serve graduates for many business leadership roles. The Faculty Director for the Chae Initiative in Private Sector Leadership is Professor of Law John Morley '06. Become a Chae Fellow Yale Law School J.D. students may apply to become Chae Fellows of the Chae Initiative in Private Sector Leadership. Fellows will embark on uniquely devised plans comprised of curricular and extracurricular offerings that are suited to their individual interests and goals in private sector careers and leadership, developed in consultation with the Faculty Director, John Morley, and Executive Director, Mary Herrington. Chae Fellows will also have access to professional skills-training workshops directly relevant to careers in finance, management consulting, entrepreneurship, and other private sector professional roles, mentorship opportunities with leading alumni professionals in the private sector, and career advising sessions to address their goals.To learn more see Chae/Ludwig Fellows page. Alumni Leaders Alumni Leaders Paul Breloff ’06 A Lifelong Learner Read More Jacquelyn Rebekka Bonner ’03 Leading for Its Own Sake Read More Basha Rubin ’10 On the Job Training Read More Gary Stewart ’99 Doing What You’re Born to Do Read More Allegra Lawrence-Hardy ’96 Aligning Your Authentic Self Read More Joseph C. Tsai ’90 The Evolution of a Leader Read More Krishna Rao ’11 When Finance and Technology Meet Read More Amy Schulman ’89 Seeing Others Succeed Is a Win-Win Read More Laura Arnold ’00 Diving Deep for Data-Driven Change Read More Frank R. Jimenez ’91 Building Others up to Succeed Read More Lynn Neuner ’92 Loving What You Do Has Its Rewards Read More Ian Solomon ’02 A Student and Teacher of Leadership Read More William Kennard ’81 Leadership Is a Team Sport Read More Rhonda McLean ’83 Journey Fueled by Legacy Read More Michael S. Chae ’97 Seeking Truth and Finding Leadership Read More Arthur J. Ochoa ’95 Leadership Journey Paved by Community Programs Read More Yasmin Cader ’92 Following Her Heart to Fight for Justice Read More B. Marc Allen ’02 When Personal and Professional Interest Collide Read More Gregory Fleming ’88 Leadership Starts with People Read More Kimberley Harris ’96 Leadership Is More Than Being in Charge Read More Bryan Leach ’05 From the Courtroom to the Boardroom Read More Siri Marshall ’74 Realizing the Power of Leadership Read More Nicholas Turner ’96 The Right Road Is Usually the Hardest Read More Carla Anderson Hills ’58 A Wide-ranging Career in Government Read More Thomas H. Glocer ’84 A Career Guided by Curiosity and Innovation Read More PreviousNext “The best way I can describe my leadership journey is one of being a perpetual student and recognizing the ever-present necessity to evolve. You never stop growing. - Nicholas Turner, Class of 1996"
