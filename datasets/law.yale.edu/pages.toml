["https://law.yale.edu/giving/give-now/planned-giving"]
title = "Planned Giving | Yale Law School"
full_description = "Planned giving makes it easy to leave a lasting legacy to Yale Law School. Whether you are planning for retirement, looking to provide for a loved one, or seeking to maximize your gift, you can support Yale Law School while meeting your goals. There are many ways to make a planned gift for Yale Law School, including methods that offer significant financial and tax benefits. You can:Make a bequest of cash, securities, or other propertyDesignate a specific dollar amount, a particular asset, or a fixed percentage of your estate for the Law SchoolLeave all or a portion of your residuary estate to the Law School after providing for your other beneficiariesCreate a charitable gift annuity or charitable remainder trust, securing income for you and a loved one while finding income tax savingsName Yale Law School as a beneficiary of your retirement plan or IRAWe are happy to help you decide which kind of planned gift is right for you. Please contact Kristen Rozansky, Associate Dean, at (203) 432-0439. For more information on types of planned gifts, you can also visit Yale University’s planned giving website."
year_published = 2025
