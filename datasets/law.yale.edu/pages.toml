title = "Programs and Funding Opportunities | Yale Law School"
full_description = "A Broad Array of Programming The Office of Student Affairs sponsors a broad array of programming, focused both on academics and on health and wellness. Our First-Year Programming series known as Orientation 2.0 seeks to guide students through their first year and provide them with the information they need to best take advantage of their Yale education, both inside and outside of the classroom. We understand that students arrive at Yale Law School with many different backgrounds and experiences, and this series is designed to ensure that the transition to law school is as smooth as possible. YLS provides unparalleled opportunities for you to act on your passions and begin tackling challenging issues long before graduation. It has been such a privilege to not only have these opportunities, but also be able to work beside and learn from peers in these efforts. Class of 2024|Dena Shata"
