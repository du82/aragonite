title = "About the Program | Yale Law School"
description = """
Up to the Challenge?Through the continuous pursuit of excellence and innovation, we seek to empower the leaders of tomorrow.
                Play Video"""
full_description = "“Create a new path for yourself where you can rise or fall on your own merits. Find work that has a mission that compels you and has constant moral relevance to you. - Bryan Leach, Class of 2005 A New Generation of Leaders Yale Law School has a 200-year history of generating leaders who blaze their own paths and effect change around the globe. Now, in response to the pressing issues of a world in constant flux, we’ve developed a transformative program inspired by our restless spirit. The Joseph C. Tsai Leadership Program at Yale Law School equips our students with the robust, cross-disciplinary skill set needed to address the most vexing global challenges in order to create a more equitable and just future for all.This unique Program is fueled by ideas and innovation, grounded in meaningful service, and infused with principle and purpose. While a Yale Law School degree has always been rooted in broad-gauged thinking, The Tsai Leadership Program expands and modernizes our curriculum, giving it a breadth and depth that enhances a traditional legal education. We train students to be numerate, tech-savvy global citizens by bringing the leading experts to our classrooms and providing an abundance of robust curricular and programmatic opportunities. Our goal is to ensure the next generation of dynamic leaders has the knowledge and professional training required to confront and embrace the biggest challenges of an ever-evolving world.For Entrepreneurs — Litigators — Public ServantsThe curriculum includes numeracy courses such as accounting, corporate finance, and statistics; ethical decision-making; and emerging issues related to technological change, big data, and globalization. Students are able to hone professional management skills through specialized intensives, boot camps, and workshops. The Program also brings mentors-in-residence to campus to advise students on the many paths available to a graduate of Yale Law School. All of these opportunities are open to every Yale Law student, no matter what career path they choose.The Tsai Leadership Program empowers a new generation of mission-driven, multidimensional leaders who champion excellence, effectiveness, and ethics as they drive the world forward. In this Program, you’ll find an environment for hearts and minds to converge; a determination to develop a curriculum for the next century; and a community composed of wide-ranging, diverse, engaged individuals. Up to the Challenge?Through the continuous pursuit of excellence and innovation, we seek to empower the leaders of tomorrow. Play Video Program Highlights Curriculum Our curriculum prepares students for their last jobs, not just their first. The program saturates the Law School with engaging classes and professional training opportunities to better equip students for any career they choose. Learn More Mentorship & Networking With more than 13,000 alumni in our community, there is no shortage of engaged graduates who are eager to provide support, advice, and guidance to students as they explore their futures and embrace their full potential. Learn More Faculty & Staff The Tsai Leadership Program is led by a dedicated team of Yale Law School faculty and staff with an impressive range of expertise across a variety of subject areas and professional experiences. Learn More “Create a new path for yourself where you can rise or fall on your own merits. Find work that has a mission that compels you and has constant moral relevance to you. - Bryan Leach, Class of 2005 More to Know Ludwig Program in Public Sector Leadership The Ludwig Program in Public Sector Leadership is premised on the notion that those serving in the public sector should be flexible, broad-gauged thinkers who make empirically grounded decisions and are deeply committed to a vibrant democracy and the well-being of others. Read More Chae Initiative in Private Sector Leadership The Chae Initiative in Private Sector Leadership empowers students to obtain a firm grasp of business principles, to be nimble in the face of complex business issues and innovation, and to engage in ethical decision-making within a global business environment. Read More Entrepreneurship and Innovation Clinic Clinic students provide legal counsel to for-profit and nonprofit entrepreneurs on the various transactional issues that arise from starting, managing, and developing their businesses as they establish and grow new ventures. Read More Alumni Leaders Alumni Leaders Paul Breloff ’06 A Lifelong Learner Read More Jacquelyn Rebekka Bonner ’03 Leading for Its Own Sake Read More Basha Rubin ’10 On the Job Training Read More Reginald Dwayne Betts ’16 Succeeding Against All Odds Read More John Koskinen ’64 Leading in a Crisis Read More Sushma Soni ’90 The Importance of Mentorship Read More Gary Stewart ’99 Doing What You’re Born to Do Read More Ahilan T. Arulanantham ’99 A Fighter for Justice Read More Allegra Lawrence-Hardy ’96 Aligning Your Authentic Self Read More Joseph C. Tsai ’90 The Evolution of a Leader Read More Krishna Rao ’11 When Finance and Technology Meet Read More Amy Schulman ’89 Seeing Others Succeed Is a Win-Win Read More Laura Arnold ’00 Diving Deep for Data-Driven Change Read More Richard Buery Jr. ’97 A Child Will Lead Them Read More Frank R. Jimenez ’91 Building Others up to Succeed Read More Lynn Neuner ’92 Loving What You Do Has Its Rewards Read More Ian Solomon ’02 A Student and Teacher of Leadership Read More William Kennard ’81 Leadership Is a Team Sport Read More Reshma Saujani ’02 Choosing Bravery Over Perfection Read More Gene Ludwig ’73 Creating a More Equitable World Read More Rhonda McLean ’83 Journey Fueled by Legacy Read More Michael S. Chae ’97 Seeking Truth and Finding Leadership Read More Arthur J. Ochoa ’95 Leadership Journey Paved by Community Programs Read More Yasmin Cader ’92 Following Her Heart to Fight for Justice Read More B. Marc Allen ’02 When Personal and Professional Interest Collide Read More Conchita Cruz ’16 A Purpose-filled Journey Read More Gregory Fleming ’88 Leadership Starts with People Read More Kimberley Harris ’96 Leadership Is More Than Being in Charge Read More Bryan Leach ’05 From the Courtroom to the Boardroom Read More Siri Marshall ’74 Realizing the Power of Leadership Read More Nicholas Turner ’96 The Right Road Is Usually the Hardest Read More Carla Anderson Hills ’58 A Wide-ranging Career in Government Read More Thomas H. Glocer ’84 A Career Guided by Curiosity and Innovation Read More Lily Fan ’04 From Law School to Documentary Film Producer Read More PreviousNext"
