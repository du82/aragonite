["https://law.yale.edu/about-yale-law-school"]
title = "About Yale Law School | Yale Law School"
full_description = "The students at YLS are not only unique, incredibly smart, and passionate but also extremely caring and always determined to offer their support. I have made lifelong friends who have been there for me throughout my time here, and who will remain a very important part of my life forever. Evelin Caro Gutierrez|Class of 2022 Home About Yale Law School One of the World’s Premier Law Schools Located in New Haven, Connecticut, Yale Law School offers a vibrant environment of excellence and educational intimacy in the form of world renowned faculty, small classes, limitless opportunities for clinical training, and strong encouragement of public service. The Law School is small by design; its impact on the world is measured by its accomplished graduates and its ongoing scholarship and outreach through numerous centers and projects.For students, the experience is unparalleled. The faculty-student ratio supports a vast array of courses and opportunities for independent research and student-organized seminars. Students get practical training by representing real clients in clinics starting in their first year.Yale Law School is unique among law schools in that it produces leaders across every sector of society: distinguished deans and faculty members at law schools across the country and the world; industry CEOs and corporate counsels; founders of nongovernmental organizations and other nonprofit entities; entrepreneurs; government servants in federal, state, and local offices and the judiciary — just a few areas in which our alumni's talent, passion, and dedication have made a difference.With a vast array of courses, a robust clinical program, and meaningful experiences outside the classroom, Yale Law graduates are empowered to chart their own course and equipped with a supercharged ability to tackle the most pressing problems of our time. 1824 Founded 5:1 Student-faculty ratio 74% of students receive need-based financial aid 89 undergraduate institutions represented Explore More Virtual Tour Explore our campus and learn more about academics, student life, clinics, admissions, financial aid, and more. Read More Study of Law Explore all that Yale Law School has to offer — academics, degree programs, clinics, courses, and more. Studying Law at Yale Student Life Our vibrant community offers countless ways for students to engage with each other and the City of New Haven through classes, conferences, events, and volunteering. Student Life At A Glance At A Glance Learn more about the history of Yale Law School and other interesting facts. Office of the Dean Office of the Dean The Office of Dean Heather Gerken and other information about administration officers. Offices & Services Offices & Services A list and overview of the offices and services offered at Yale Law School. Visit & Directions Visit & Directions Come visit the school in person by setting up a visit and tour. New Haven & The Region New Haven & The Region Learn more about New Haven, a lively, small urban center between New York and Boston. Celebrating 200 Years Celebrating 200 Years Delve into our history and explore material from our rich archives gathered in 2024, our bicentennial year. YLS by the Numbers Yale Law School offers an unmatched intellectual environment with numerous opportunities for students to immerse themselves in the law and make a positive impact on society. Learn more about what sets Yale Law School apart as a leader in legal education. By the Numbers The students at YLS are not only unique, incredibly smart, and passionate but also extremely caring and always determined to offer their support. I have made lifelong friends who have been there for me throughout my time here, and who will remain a very important part of my life forever. Evelin Caro Gutierrez|Class of 2022"
