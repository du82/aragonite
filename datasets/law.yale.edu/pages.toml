["https://law.yale.edu/admissions/financial-aid/financial-health-wellness"]
title = "Financial Health & Wellness | Yale Law School"
full_description = "Financial Health and Wellness Through digital outreach efforts, engaging workshops, and personalized face-to-face counseling sessions, the Financial Aid Office is working to spark a conversation on financial literacy by proactively building relationships with students and alumni in everything they do.The Financial Aid Office offers one-on-one, individualized counseling sessions for students to discuss their specific financial situations, loan obligations, and repayment options. While this opportunity is offered across the continuum of enrollment, it is geared primarily toward 3Ls. The meetings are a great way for students to learn about the different federal loan repayment options as well as the generous programs offered after graduation, like the Career Option Assistance Program (COAP). COAP provides substantial post-graduation assistance to graduates who choose lower paying career paths. On average, forty-five percent of all students with academic year loan debt will transition into the program.YLS Financial Aid partners with AccessLex Institute a nonprofit dedicated to legal education, to bring MAX by AccessLex, a free personal finance program designed exclusively for law students!In addition, the Financial Aid Office also sponsors a series of financial wellness workshops throughout the academic year. Workshops are recorded and posted here after each event."
