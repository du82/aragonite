["https://law.yale.edu/giving/give-now/yale-law-school-fund"]
title = "Yale Law School Fund | Yale Law School"
full_description = "Annual Giving sustains and promotes the core functions and initiatives that make YLS a leader in legal education. These critical gifts, which constitute roughly 10 percent of the Law School’s yearly revenue, provide essential ongoing support for the Law School, especially the clinics, many of which are not endowed. In most years, the Dean looks to these funds to create new classes, fund new initiatives, and find new ways to support our students. In challenging years, like 2020-2021, these funds ensure that the Law School can stay the course, pushing forward its mission without laying off staff or sacrificing the quality of our students’ experience. This is where the commitment of our alumni to the YLS mission shines particularly brightly and every gift matters. If you have a specific area you feel passionate about, you can also choose to designate your gift. Areas include:Financial Aid/COAPClinical ProgramsLillian Goldman Law LibraryTeaching and ResearchDiversity and InclusionGraduate Programs Make a gift to the Yale Law School Fund today."
