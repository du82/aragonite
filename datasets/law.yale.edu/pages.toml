["https://law.yale.edu/about-yale-law-school/offices-services/academic-affairs"]
title = "Academic Affairs | Yale Law School"
full_description = "Contact Us Monica Maldonado, Associate Dean for Academic Affairs, supports the Deputy Deans in all curricular matters and works with students on a variety of academic issues.To schedule a meeting with Dean Maldonado: https://calendly.com/monicamaldonadoE-mail Dean Maldonado: monica.maldonado@yale.eduDuring add/drop period, Dean Maldonado is available for ten-minute appointments. After add/drop period, Dean Maldonado is available for fifteen-minute appointments.For general academic questions, please email lawacademics@yale.edu Academic Advising General course selection questionsGraduation requirements/Degree Audit issuesJoint Degree optionsAcademic Permissions (underload/overload)Leave of Absence counselingSatisfactory Academic Progress concernsClassroom concernsStudy strategies Disability Accommodations Student Accessibility Services (SAS) is the office at Yale responsible for responding, approving, and facilitating accommodations for students with disabilities.SAS meets individually with students to discuss their specific disability and potential accommodations to remove disability-related barriers to their academic settings.Student Accessibility Services: https://sas.yale.edu/Requesting Accommodations: https://sas.yale.edu/students/first-timeBar Exam AccommodationsRequesting bar exam accommodations can be a rigorous and lengthy process that varies from state to state. YLS students who are considering applying for bar exam accommodations are advised to begin researching their jurisdiction’s accommodation application process and deadlines during their 2L year.For general form instructions and accommodation request forms for all states, please visit the Bar Information for Applicants with Disabilities page on the ABA website. Coker Fellow Selection Process Every spring, the small group faculty for the upcoming fall semester select teaching assistants, known as Coker Fellows, to work with 1L students. Students who will be third-year students (or the equivalent) in fall are eligible to apply.The primary responsibilities of Coker Fellows are: supervising memoranda, briefs, and other first-term writing projects collaborating with ILAW instructors providing or coordinating instruction in legal writing and research assisting the small-group professor in devising first-term assignments and programs counseling members of the small group and helping them adjust to law school arranging social events and visits to courts, agencies, and other institutions and managing the small group social budget attending training sessions the spring and fall, as well as check-in meetings throughout the fall semesterMore information about the application process is sent out to all 2L students in the spring.For Fall 2025, the following faculty are slated to teach a small group: Constitutional Law: Balkin, Driver, Gewirtz, Kronman, Moyn, Post, Rodriguez, Whittington Contracts: Listokin, Markovits, Sanga Torts: RamakrishnanStudents who are not selected as Coker Fellows may be interested in serving as Teaching Assistants for the 1L section professors. Prizes The law school awards annual prizes for papers, coursework, and work performed in clinics. For descriptions of prizes available, please see pages 147-150 of the YLS Bulletin. Students and Professors submit nominations through an online portal in late May through June 30th each year. More information is sent by the Deputy Dean to the law school community each May. Reading Group Proposals Reading Group Proposals are accepted in the fall for the spring term and the summer for the fall term. Guidelines, deadlines, and the proposal form can be found here. YLS Research Assistant & Teaching Assistant Positions/ Yale Teaching Fellowship Program Search for open RA and TA law school positions here: https://fellows.law.yale.edu/General information about Teaching Fellows can be found here: https://gsas.yale.edu/teaching-fellow-programSearch for TF opportunities at the University here: Graduate Student Teaching OpportunitiesPermission for a law student to work as a Teaching Fellow in the college should be requested by the college department via e-mail to monica.maldonado@yale.edu1L students are prohibited from any University employment during their fall semester. University student employment is capped at 19 hours per week."
