["https://law.yale.edu/student-life/career-development/employment-data"]
title = "Employment Data | Yale Law School"
full_description = "Student & Alumni Employment Stats Yale Law students are among the most sought after in the nation by employers of all types. Our alumni are prominent both within and outside of the legal profession. They work in private practice, ranging from one-person offices to major firms; in federal, state, and local government, including Congress, the Office of the President, and the judiciary; in law teaching and administration; in public service settings; for corporations and businesses; and for nonprofit organizations.In accordance with the ABA guidelines, the Class of 2023 Employment Chart depicts the employment of our Class of 2023 at ten months after graduation. Use the links on the right sidebar to view post-graduate data for the Classes of 2022 and 2021.Our Summer Employment Charts reflect what employment sectors our students have worked in after their first year and second year of law school. CDO produces a Judicial Clerkship Employment Chart containing the number of graduates reporting a clerkship at various times after graduation as well as the total number of clerkships obtained by graduates in each class year. Each spring, CDO collects information about our graduates five years after their law school graduation as reflected in the Five Years After Graduation Chart. Most people think there is a giant gap between doing academic work and doing real practice work. This law school has relentlessly refused to accept that gap. And you see it every day. Heather Gerken|Dean and Sol & Lillian Goldman Professor of Law"
