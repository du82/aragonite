["https://law.yale.edu/chinmayi-arun-0"]
title = "Chinmayi Arun | Yale Law School"
description = "Chinmayi Arun is a Lecturer in Law, Research Scholar in Law, and Executive Director of the Information Society Project at Yale Law School. Her research focuses on platform governance, social media, algorithmic decision-making, the data economy, and privacy, all within the larger universe of questions raised by law’s relationship with the information society. Before arriving at Yale, Arun was Assistant Professor of Law at two of the most highly regarded law schools in India."
full_description = "Chinmayi Arun Lecturer in Law (spring term), Research Scholar in Law, and Executive Director of the Information Society Project Education B.A., LL.B., NALSAR University of Law, 2006LL.M., London School of Economics and Political Science, 2009LL.M., Yale Law School, 2020 Courses Taught Language and Power Chinmayi Arun is a Lecturer in Law, Research Scholar in Law, and Executive Director of the Information Society Project at Yale Law School. Her research focuses on platform governance, social media, algorithmic decision-making, the data economy, and privacy, all within the larger universe of questions raised by law’s relationship with the information society. Before arriving at Yale, Arun was Assistant Professor of Law at two of the most highly regarded law schools in India. During that time, she also founded and led the Centre for Communication Governance at National Law University Delhi. Arun has served as a Human Rights Officer (temporary appointment) at the United Nations, where she worked on questions of privacy, online speech, and artificial intelligence, as well as on advisory committees of international bodies like UNESCO and UN Global Pulse."
