full_description = "The Executive Committee of the YLSA strengthens the Yale Law School community worldwide by connecting alumni with each other, current students, and Yale Law School. The Executive Committee is composed of a diverse body of approximately 200 leaders and honorary members from a range of class years, professions, and geographical locations. The Executive Committee meets in New Haven twice a year to discuss a wide range of matter of importance to YLS and its alumni community.As a member of the Executive Committee you may be asked to serve on one of its five specialized subcommittees. These committees are the Liaison Committee, Regional Committee, Nominating Committee, Planning Committee, and Awards Committee. You can find out more about the meaningful roll each of these committees plays below. Membership of Executive Committee9 officers, each serving a three-year term, staggered to preserve continuity (Officers serve the same role for both the YLSA and the Executive Committee)3 classes of 20 Term Members, each serving a three-year term1 Graduating Class Member (for each graduating class), serves a three-year terms as one of the 20 term membersAdministrators of the Law School, serve as ex officio Executive Committee membersHonorary lifetime members of the committee include former Executive Committee chairpersons and Award of Merit recipients"
