["https://law.yale.edu/about-yale-law-school/visit-directions"]
title = "Visit & Directions | Yale Law School"
full_description = "We are committed to opening our doors to the students who have the most to gain from this School and the most to give to the world, regardless of their means. Heather K. Gerken|Dean and Sol & Lillian Goldman Professor of Law Home Admissions & Financial Aid JD Admissions Learn More About YLS Visit the Law School Located in New Haven, Connecticut, just 1.5 hours from New York City and 3 hours from Boston, Yale Law School welcomes visitors to our campus, especially prospective students. You will find the Law School in the Sterling Law Building on the 410-acre Yale campus, with its impressive neo-Gothic architecture, extensive athletic and recreational facilities, and 26 libraries.Downtown New Haven is also a short walkable block away, and offers restaurants, shops, bookstores, and a lively night life. To learn more about the city, visit Living in New Haven.Explore the Yale Law School campus and learn more about academics, student life, clinics, admissions, financial aid, and more in our virtual tour. Take a Virtual Tour of YLS Explore our campus and learn more about academics, student life, clinics, admissions, financial aid, and more. Take the tour Discover YLS and New Haven Visit & Directions Take a Tour Take a Tour Explore the Law School and Yale University Directions Directions Resources for your trip to New Haven Admissions Meet Our Admissions Team We look forward to hearing from you New Haven and the Region Yale Law School is at the heart of the city of New Haven—a lively, small urban center between New York City and Boston. New Haven and the Region The New Haven Green is the heart of downtown, and home to free cultural events like the International Festival of Arts and Ideas, Music on the Green, and the New Haven Jazz Festival. New Haven and the Region The Law School is part of downtown New Haven, close to bookstores, boutiques, art galleries, restaurants, and entertainment. New Haven and the Region Chapel Street in downtown New Haven has a wide variety of restaurants and shops. New Haven and the Region Year-round, seasonal farmer’s markets held throughout New Haven are a great place to buy fresh, local produce. New Haven and the Region The shops on Broadway, around the corner from the Law School, cover all of the essentials from books, to clothes, to coffee. New Haven and the Region New Haven is home to several museums and a vibrant arts community, all within the greater downtown area. New Haven and the Region Ask a group of locals which pizza they like better, Sally’s or Pepe’s, and you’ll witness a debate as fierce as any Red Sox vs. Yankees discussion. New Haven and the Region Modern Apizza on State Street is not in New Haven’s Little Italy district, but is often named in the same breath as the originators of New Haven-style pizza: Pepe’s and Sally’s. We are committed to opening our doors to the students who have the most to gain from this School and the most to give to the world, regardless of their means. Heather K. Gerken|Dean and Sol & Lillian Goldman Professor of Law"
