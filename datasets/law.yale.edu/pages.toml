title = "Areas of Study | Yale Law School"
full_description = "Constitutional Law The Law School is renowned as a center for scholarship in constitutional law, and prominent scholars are well represented on the School’s faculty. View Constitutional Law Corporate & Commercial Law The Law School offers a strong curriculum in corporate and commercial law as well as joint and doctoral degree programs. View Corporate & Commercial Law Criminal Justice Yale Law School offers a rich academic experience studying criminal law through many different lenses. View Criminal Justice Environmental Law Outstanding faculty, new curricular offerings, and strong partnerships are part of our expanded environmental law and policy program. View Environmental Law Human Rights Law A diverse program of human rights activities that serve students and scholars at Yale and contribute to the development of human rights. View Human Rights Law International Law The Law School’s longstanding international tradition occupies a central place in its intellectual life. View International Law Law & Economics The Law School is at the heart of a movement to expand the once-narrow field of law and economics. View Law & Economics Law & Health Examining how law and policy affect individual and public health, the health care industry, and health governance. View Law & Health Law Teaching Our Law Teaching Program provides current students and post-graduate fellows with training and information about careers in academia. View Law Teaching Legal History The history of law offers indispensable insights into the character of our legal systems. View Legal History Public Interest Law Yale Law School has a strong tradition of service in the public interest. Most YLS students perform public service activities during their time here. View Public Interest Law Technology & Media Law Information Society Project (ISP) is an intellectual center addressing the implications of the Internet and new technologies. View Technology & Media Law I’ve been continually inspired by how my classmates have built unexpected careers that are so firmly rooted in the collaborative outlook, dedication, intellectual curiosity, and engagement we shared at Yale. I’m a stronger entrepreneur because I try to infuse the organizations I build with these YLS values. Jane Park ’96|CEO & Entrepreneur"
