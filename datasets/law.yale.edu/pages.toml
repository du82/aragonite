["https://law.yale.edu/about-yale-law-school/visit-directions/directions"]
title = "Directions | Yale Law School"
full_description = "Yale Law School's Sterling Law Building occupies the block bounded by Grove, York, Wall, and High Streets at the heart of the Yale campus in downtown New Haven, Connecticut. By Car From I-95Southbound: Take exit 47 for I-91 North in New Haven; follow directions below.Northbound: Take exit 48 for I-91 North in New Haven (left exit); follow directions below. From I-91Take Exit 3 off I-91 (from North or South). The exit ramp becomes Trumbull Street. Follow Trumbull to the fifth stoplight and take a left onto Prospect Street.Continue straight onto College StreetTake the first right onto Wall Street.After passing High Street, the Law School will be on the right. View these directionsFrom the Merritt Parkway:Take exit 59 for New Haven/Woodbridge.Turn right onto Whalley Avenue and continue until it merges with Elm Street.Turn left onto College Street.Turn left onto Wall Street.(Alternatively, you may take a left from Elm Street onto York Street, which borders the Law School to the west).View these directions Parking Metered parking is available on York and Grove Streets and on others in the vicinity; the main entrance to the Law School (127 Wall Street) is closest to the corner of Wall and High Streets. Wall and High Streets are open to pedestian traffic only. By Air Bradley International Airport in Hartford (BDL) is a major international airport accommodating most major airlines with direct flights to all major cities. It is located about 45 minutes north of New Haven.Tweed-New Haven Airport (HVN) offers service on Avelo Airlines to over a dozen cities. It is located about 10 minutes from downtown New Haven.New York City-area airports John F. Kennedy (JFK), LaGuardia (LGA), and Newark (EWR) are between 1.5 and 2 hours from New Haven. All airports are served by Connecticut Limousine shuttle service. Connections from the New York airports to Metro North/Amtrak can be made by taking (sometimes complex) public transportation:JFK: AirtrainLaGuardia: NYC MTA BusNewark: New Jersey Transit also, direct connection to Amtrak By Rail Trains run regularly to New Haven from New York City (via Metro-North Railroad or Amtrak) and from Boston (via Amtrak). Maps Interactive Yale Campus Map Sterling Law Building Floorplan"
