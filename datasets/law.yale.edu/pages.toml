["https://law.yale.edu/rick-antle"]
title = "Rick Antle | Yale Law School"
description = "Rick Antle is a Professor (Adjunct) of Law at Yale Law School and the William S. Beinecke Professor of Accounting at the Yale School of Management, where he served as Senior Associate Dean from 1999 to 2005. Antle received his Ph.D. from Stanford University, and began his academic career as a member of the faculty at the University of Chicago."
full_description = "Rick Antle Professor (Adjunct) of Law (spring term) Education Ph.D. (Business), Stanford University, 1981B.S., Oklahoma State University, 1975 Courses Taught Financial Reporting: A Legal Perspective Financial Accounting Rick Antle is a Professor (Adjunct) of Law at Yale Law School and the William S. Beinecke Professor of Accounting at the Yale School of Management, where he served as Senior Associate Dean from 1999 to 2005. Antle received his Ph.D. from Stanford University, and began his academic career as a member of the faculty at the University of Chicago. He is an expert in areas involving the interface of accounting, finance and economics. His widely cited research has focused on such topics as executive compensation and performance evaluation, resource allocations within firms, and the industrial organization of the auditing industry. Rick was an associate editor of Contemporary Accounting Research and was on the editorial boards of the Accounting Review, Journal of Accounting Research, Review of Accounting Studies, British Accounting Review, and the Journal of Business Finance and Accounting. With Stanley J. Garstka, he co-authored Financial Accounting (South-Western, 2004), a textbook that was used at all levels (including executive programs) for the first course in accounting.Rick is a co-founder of Ross, Jeffrey & Antle LLC, a financial services firm, and Compensation Valuation, Inc., a firm specializing in valuing employee stock options for financial reporting. He is the sole member of 217 Canner Associates, LLC, the trustee for the liquidating trusts of the Greenwich Sentry Fund and Greenwich Sentry Partners Fund, two feeders to Bernard L. Madoff Investment Securities. He was a director of Smith Breeden Associates, where he served on the Audit and Compensation Committees. His consulting engagements have involved hedge fund valuation, financial reporting, auditing standards, auditor independence, and capital budgeting."
year_published = 2025
clearnet = "https://law.yale.edu/rick-antle"
