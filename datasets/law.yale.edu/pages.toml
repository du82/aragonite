title = "Alumni Leaders | Yale Law School"
full_description = "Illuminating Unconventional Paths This ever-changing world demands intellectually curious and empathetic leaders who are equipped to serve society’s evolving needs. The dynamic Yale Law School alumni community serves as an incredible example of the many dimensions of leadership. Our graduates illuminate the many pathways open to students, inspiring them to leave their own mark and build their own legacy. Read more about the unique paths and experiences of Yale Law School alumni. Alumni Leaders Paul Breloff ’06 A Lifelong Learner Read More Jacquelyn Rebekka Bonner ’03 Leading for Its Own Sake Read More Basha Rubin ’10 On the Job Training Read More Reginald Dwayne Betts ’16 Succeeding Against All Odds Read More John Koskinen ’64 Leading in a Crisis Read More Sushma Soni ’90 The Importance of Mentorship Read More Gary Stewart ’99 Doing What You’re Born to Do Read More Ahilan T. Arulanantham ’99 A Fighter for Justice Read More Allegra Lawrence-Hardy ’96 Aligning Your Authentic Self Read More Joseph C. Tsai ’90 The Evolution of a Leader Read More Krishna Rao ’11 When Finance and Technology Meet Read More Amy Schulman ’89 Seeing Others Succeed Is a Win-Win Read More Laura Arnold ’00 Diving Deep for Data-Driven Change Read More Richard Buery Jr. ’97 A Child Will Lead Them Read More Frank R. Jimenez ’91 Building Others up to Succeed Read More Lynn Neuner ’92 Loving What You Do Has Its Rewards Read More Ian Solomon ’02 A Student and Teacher of Leadership Read More William Kennard ’81 Leadership Is a Team Sport Read More Reshma Saujani ’02 Choosing Bravery Over Perfection Read More Gene Ludwig ’73 Creating a More Equitable World Read More Rhonda McLean ’83 Journey Fueled by Legacy Read More Michael S. Chae ’97 Seeking Truth and Finding Leadership Read More Arthur J. Ochoa ’95 Leadership Journey Paved by Community Programs Read More Yasmin Cader ’92 Following Her Heart to Fight for Justice Read More B. Marc Allen ’02 When Personal and Professional Interest Collide Read More Conchita Cruz ’16 A Purpose-filled Journey Read More Gregory Fleming ’88 Leadership Starts with People Read More Kimberley Harris ’96 Leadership Is More Than Being in Charge Read More Bryan Leach ’05 From the Courtroom to the Boardroom Read More Siri Marshall ’74 Realizing the Power of Leadership Read More Nicholas Turner ’96 The Right Road Is Usually the Hardest Read More Carla Anderson Hills ’58 A Wide-ranging Career in Government Read More Thomas H. Glocer ’84 A Career Guided by Curiosity and Innovation Read More Lily Fan ’04 From Law School to Documentary Film Producer Read More"
