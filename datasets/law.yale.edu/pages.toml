["https://law.yale.edu/anne-l-alstott"]
title = "Anne L. Alstott | Yale Law School"
description = "Anne Alstott is the Jacquin D. Bierman Professor at Yale Law School. She holds a secondary appointment as Professor, Yale Child Study Center, and is a Faculty Affiliate at the Yale Institution for Social and Policy Studies. From 2008 to 2011, she was the Manley O. Hudson Professor at the Harvard Law School."
full_description = "Anne L. Alstott Jacquin D. Bierman Professor in Taxation Education J.D., Yale Law School, 1987A.B., Georgetown University, 1984 Curriculum Vitae Courses Taught Federal Income Taxation Family, State, and Market Corporate Taxation Anne Alstott is the Jacquin D. Bierman Professor at Yale Law School. She holds a secondary appointment as Professor, Yale Child Study Center, and is a Faculty Affiliate at the Yale Institution for Social and Policy Studies. From 2008 to 2011, she was the Manley O. Hudson Professor at the Harvard Law School.Professor Alstott studies public policy toward children and families and, more broadly, public policy over the life cycle. She is the author of a number of books, including The Public Option (with Ganesh Sitaraman, Harvard University Press, 2019), A New Deal for Old Age (Harvard University Press, 2016), No Exit: What Parents Owe Children and What Society Owes Parents (Oxford University Press, 2004), and The Stakeholder Society (with Bruce Ackerman, Yale University Press,1999).Her articles have been published in the Harvard Law Review, the Yale Law Journal, the Columbia Law Review, and other journals. She has written or co-written pieces for The New York Times, the Los Angeles Times, the Huffington Post and Slate and has appeared on NPR's “Marketplace” and “On Point.”Professor Alstott received a J.D. from the Yale Law School in 1987 and an A.B. in Economics, summa cum laude, Phi Beta Kappa (junior year), and with Departmental Honors, from Georgetown University in 1984 at age 20. She worked as an associate at Sullivan & Cromwell from 1987 to 1990 and as an Attorney-Advisor in the U.S. Treasury Department's Office of Tax Policy, Office of Tax Legislative Counsel, from 1990 to 1992.She began her teaching career at Columbia University School of Law, where she taught from 1992 to 1996. She joined the Yale Law School faculty with tenure in 1997 and remained there until 2008, when she left to join the Harvard Law School faculty, again with tenure. In 2011, she returned to Yale.Professor Alstott has won five teaching awards. In 1995, she won the Willis Reese Award for Excellence in Teaching at Columbia. In 1998, 2004, 2012, and 2017, she won the Yale Law Women’s Faculty Excellence Award.Photo by Karissa van Tassel News Publications News July 9, 2024 | ABC News New report critiques UK transgender youth care research study A white paper co-authored by Jacquin D. Bierman Professor Anne Alstott ’87, which criticizes the Cass Review on gender-affirming care, was highlighted. New report critiques UK transgender youth care research study July 1, 2024 White Paper Addresses Key Issues in Legal Battles over Gender-Affirming Health Care A new white paper from The Integrity Project provides an evidence-based critique of a recent independent review that has become central to U.S. litigation regarding health care for transgender youth. White Paper Addresses Key Issues in Legal Battles over Gender-Affirming Health Care April 24, 2024 Anne Alstott ’87 Elected to American Academy of Arts & Sciences Professor Anne Alstott ’87 has been elected to the 2024 class of the American Academy of Arts & Sciences. Anne Alstott ’87 Elected to American Academy of Arts & Sciences June 14, 2023 | Los Angeles Times Pride as Resistance: LGBTQ+ People Struggle Against Right-Wing War on Their Legal Rights Jacquin D. Bierman Professor Anne Alstott ’87 comments on the federal court ruling blocking enforcement of a Florida law banning gender-affirming care for transgender adolescents. Pride as Resistance: LGBTQ+ People Struggle Against Right-Wing War on Their Legal Rights February 13, 2023 Report Challenges Court Decision on PrEP and Public Health A new report from a team of medical, public health, and legal experts challenges a federal court decision regarding Pre-Exposure Prophylaxis (PrEP), a highly effective biomedical measure for preventing HIV. Report Challenges Court Decision on PrEP and Public Health January 22, 2023 | Peste Magazine LGBTQ Exceptionalism Is A Dangerous Double-Standard — A Commentary by Anne Alstott ’87 and Meredithe McNamara Anne Alstott ’87 is the Jacquin D. Bierman Professor at Yale Law School. LGBTQ Exceptionalism Is A Dangerous Double-Standard — A Commentary by Anne Alstott ’87 and Meredithe McNamara October 18, 2022 Solomon Center Panel Examines Care for Trans and Nonbinary Patients A panel co-hosted by the Solomon Center, “Care for Trans Patients: Legal and Policy Challenges Around Access to Gender-Affirming Care,” included the perspectives of attorneys, academics, and doctors. Solomon Center Panel Examines Care for Trans and Nonbinary Patients August 29, 2022 Amicus Brief Filed to Defend Gender-Affirming Care in Alabama Professors from Yale Law School, Yale School of Medicine, Yale Child Study Center, University of Alabama at Birmingham, and University of Texas Southwestern filed an amicus brief regarding Alabama's legislative ban on gender-affirming care for adolescents. Amicus Brief Filed to Defend Gender-Affirming Care in Alabama August 25, 2022 | JAMA Pediatrics Scientific Misinformation Is Criminalizing the Standard of Care for Transgender Youth — A Commentary by Anne Alstott ’87 et al. Anne Alstott is the Jacquin D. Bierman Professor at Yale Law School. Scientific Misinformation Is Criminalizing the Standard of Care for Transgender Youth — A Commentary by Anne Alstott ’87 et al. July 19, 2022 | AP Academics Attack Florida Plan to Limit Transgender Treatment Jacquin D. Bierman Professor in Taxation Anne Alstott ’87 is one of the authors of a new expert analysis that refutes a Florida Medicaid agency report on transgender care. Academics Attack Florida Plan to Limit Transgender Treatment Pagination Current page 1 Page 2 Page 3 Page 4 BooksThe Public Option: How to Expand Freedom, Increase Opportunity, and Promote Equality (Harvard University Press, 2019) (with Ganesh Sitaraman).A New Deal for Old Age: Toward a Progressive Retirement (Harvard University P