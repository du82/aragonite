full_description = "Yale Law School Latin American Legal Studies Latin American Legal Studies at Yale Law School encompass a range of programs. At their core is the faculty-centered seminar known as SELA, which promotes independent, interdisciplinary, theoretical legal research in Latin America. The Owen Fiss Latin American Linkage Program is an innovative student exchange between Yale Law School and seven top law schools in Argentina, Brazil, and Chile. The Colección de Ciencias Jurídicas, or Legal Science Collection, is a Spanish-language book series of works by Yale Law School faculty. The Latin American Series at Yale Law School is a lecture series that brings distinguished scholars and practitioners from the region to the law school."
