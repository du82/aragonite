["https://law.yale.edu/admissions/jd-admissions/apply-yale-law-school"]
title = "Apply to Yale Law School | Yale Law School"
full_description = "Join Our Community Yale Law School is a place where students immerse themselves in important ideas and have a multitude of opportunities to put those ideas into practice. Our distinctive approach to legal education is rooted in a commitment to academic excellence, a focus on innovation, and a passion for service. With hundreds of courses taught by world-renowned faculty, dozens of legal clinics and academic centers, and an innovative leadership curriculum, the Law School provides its students with many opportunities to gain the skills necessary to make a positive impact in the world and follow any career path they choose. As Dean Heather K. Gerken has said, the Law School must find talented individuals wherever they are and provide them with the necessary financial support to ensure that a legal education is accessible to students from all backgrounds. For this reason, all of our financial support is need-based and includes full-tuition scholarships for students with the highest need as well as a comprehensive loan repayment program for those who choose lower paying careers. Our consistent goal is to lower the barriers that limit access to law school and the legal profession. Every year, we select approximately 200 remarkable new students to join more than 13,000 alumni and build upon this exceptional legacy. Our admissions process is selective and we are committed to a holistic review of every application we receive. There is no cut-off for grade point averages or test scores and no single part of an application is determinative. We seek students with a record of academic excellence, professional distinction, and exceptional accomplishments who are eager to immerse themselves in our community. We look for people who will contribute meaningfully to the Law School, both inside and outside the classroom. Successful applicants should be open-minded and able to have conversations with people with whom they disagree; collegial, professional, and respectful in all of their interactions; highly ethical and aware of their responsibilities as future members of the legal profession; resilient and determined in the face of obstacles; and passionate about contributing to the communities around them. We encourage all applicants to learn more about our application process and the components of our application. You can also connect with the Admissions team in many ways to learn more."
