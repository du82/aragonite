title = "Safety & Security | Yale Law School"
full_description = "The safety and security of our community is paramount. Yale Law School has a Crisis Management Team prepared to assemble in the event of any emergency and coordinates closely with the University, which provides resources and expertise on campus safety. Police should be called in the event of an emergency immediately by dialing 911. Yale Police non-emergency dispatch can be reached at 203-432-4400.Joseph Bleehash oversees security at Yale Law School. Building Access and Hours Sterling Law Building (SLB) hours are 8 a.m. to 8 p.m. Monday-Friday for members of the Yale Community. Sterling Law Building is open only to Law School students on weekends. Baker Hall hours are 8 a.m. to 6 p.m. for the Yale Community. Students and faculty can access the first and fourth floors of Baker Hall, SLB, and Law Library from 7 a.m. to midnight. All classrooms and conference rooms, seminar rooms, and lounges in SLB are closed to all students between midnight and 7 a.m. except for rooms 129 and 109, which are available to students 24/7. Baker Hall residents have access to the second and third floors 24/7.Members of the Yale Law School community must carry their Yale photo ID card at all times to scan into the Sterling Law Building (SLB) and Baker Hall. The main SLB entrance at 127 Wall Street will require entrants to scan Yale ID cards at the outdoor and the indoor card readers. Other SLB and Baker Hall entryways will remain accessible to community members via outdoor Yale ID card readers, including during evenings and weekends. Individuals who do not have a Yale ID card and have an appointment at the Law School will be required to sign in and present government-issued photo identification at the 127 Wall Street entrance, with limited exceptions. Safety & Health Contacts Important ContactsPolice & Fire Emergency911Campus Police (non-emergency)203-432-4400New Haven Police Department (non-emergency)203-946-6316Yale-New Haven Hospital119Yale Law School Security Guard203-432-8284Yale University Campus Security203-785-5555University Security Nighttime Safe Rides203-432-6330University Security Walking Escort Service203-432-9255Yale Health - Acute Care203-432-0123Yale Mental Health & Counseling (on-call clinician available 24/7)203-432-0290Yale Facilities (emergency repairs)203-432-6888International Travel Emergencies(International SOS, Yale's travel assistance provider)1-215-942-8478Yale Environmental Health & Safety203-785-3555"
