["https://law.yale.edu/abdi-aidid"]
title = "Abdi Aidid | Yale Law School"
description = "Abdi Aidid is a Visiting Associate Professor of Law at Yale Law School and an Assistant Professor at University of Toronto Faculty of Law. He researches and teaches in the areas of privacy, law & technology and civil adjudication."
full_description = "Abdi Aidid Visiting Associate Professor of Law Education LL.M., University of Toronto Faculty of Law, 2021J.D., Yale Law School, 2016B.A., University of Toronto, 2013 Courses Taught Privacy and Data Governance Intellectual Property Law's Artificial Intelligence Future Abdi Aidid is a Visiting Associate Professor of Law at Yale Law School and an Assistant Professor at University of Toronto Faculty of Law. He researches and teaches in the areas of privacy, law & technology and civil adjudication.He received his B.A. from the University of Toronto, his J.D. from Yale Law School, and his LL.M from the University of Toronto. Aidid was previously a litigator at Covington & Burling LLP in New York and Davies Ward Phillips & Vineberg LLP in Toronto, and most recently served as the VP, Legal Research at Blue J, where he oversaw the development of machine learning-enabled research and analytics tools.His book The Legal Singularity: How Artificial Intelligence Can Make the Law Radically Better (with Benjamin Alarie) was published in 2023. His scholarship has appeared in or will appear in University of Toronto Law Journal, the Georgetown Journal of Legal Ethics, the Fordham Law Review, the Journal of Law & Equality, and other journals."
