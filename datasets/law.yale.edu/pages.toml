["https://law.yale.edu/akhil-reed-amar"]
title = "Akhil Reed Amar | Yale Law School"
description = "Akhil Reed Amar is Sterling Professor of Law and Political Science at Yale University, where he teaches constitutional law in both Yale College and Yale Law School. After graduating from Yale College, summa cum laude, in 1980 and from Yale Law School in 1984, and clerking for Judge (later Justice) Stephen Breyer, Amar joined the Yale faculty in 1985 at the age of 26. He is Yale’s only living professor to have won the University’s unofficial triple crown — the Sterling Chair for scholarship, the DeVane Medal for teaching, and the Lamar Award for alumni service."
full_description = "Akhil Reed Amar Sterling Professor of Law and Political Science Education J.D., Yale Law School, 1984B.A., Yale University, 1980 Curriculum Vitae Courses Taught Constitutional Law Reading the Constitution: Substance and Method Akhil Reed Amar is Sterling Professor of Law and Political Science at Yale University, where he teaches constitutional law in both Yale College and Yale Law School. After graduating from Yale College, summa cum laude, in 1980 and from Yale Law School in 1984, and clerking for Judge (later Justice) Stephen Breyer, Amar joined the Yale faculty in 1985 at the age of 26. He is Yale’s only living professor to have won the University’s unofficial triple crown — the Sterling Chair for scholarship, the DeVane Medal for teaching, and the Lamar Award for alumni service.Amar’s work has won awards from both the American Bar Association and the Federalist Society, and he has been cited by Supreme Court justices across the spectrum in more than four dozen cases — tops among non-emeritus scholars. He regularly testifies before Congress at the invitation of both parties; and in surveys of judicial citations and/or scholarly citations, he typically ranks among America’s five most-cited mid-career legal scholars. He is a member of the American Academy of Arts and Sciences and has written widely for popular publications, including The New York Times, The Washington Post, The Wall Street Journal, Time, and The Atlantic. He was an informal consultant to the popular TV show The West Wing and his scholarship has been showcased on many broadcasts, including The Colbert Report, Morning Joe, AC360, 11th Hour with Brian Williams, Fox News @ Night with Shannon Bream, Fareed Zakaria GPS, Erin Burnett Outfront, and Constitution USA with Peter Sagal.He is the author of more than a hundred law review articles and several books, most notably The Bill of Rights (1998 — winner of the Yale University Press Governors’ Award), America’s Constitution (2005 — winner of the ABA’s Silver Gavel Award), America’s Unwritten Constitution (2012 — named one of the year’s 100 best nonfiction books by The Washington Post), and The Constitution Today (2016 — named one of the year’s top ten nonfiction books by Time magazine). His latest and most ambitious book, The Words That Made Us: America’s Constitutional Conversation, 1760-1840, came out in May 2021. He has recently launched a weekly podcast, Amarica’s Constitution. A wide assortment of his articles and op-eds and video links to many of his public lectures and free online courses may be found at akhilamar.com. News News February 9, 2025 | The New York Times Why Federal Courts May Be the Last Bulwark Against Trump Sterling Professor of Law and Political Science Akhil Reed Amar ’84, and Arthur Liman Professor of Law Judith Resnik examine the lawsuits filed by state attorneys general, unions, and nonprofits against President Donald Trump. Why Federal Courts May Be the Last Bulwark Against Trump January 21, 2025 | The New York Times 22 States Sue to Stop Trump’s Birthright Citizenship Order Sterling Professor of Law and Political Science Akhil Reed Amar ’84 analyzed the birthright citizenship executive order. 22 States Sue to Stop Trump’s Birthright Citizenship Order December 20, 2024 | The New York Times Trump Moves to Replace Officials Whom New Presidents Traditionally Leave Alone Sterling Professor of Law and Political Science Akhil Reed Amar ’84 discussed presidential authority. Trump Moves to Replace Officials Whom New Presidents Traditionally Leave Alone October 31, 2024 Rosenkranz Originalism Conference Held at Yale Law School The Rosenkranz Originalism Conference featured a keynote address by Judge Neomi Rao of the U.S. Court of Appeals for the D.C. Circuit. Rosenkranz Originalism Conference Held at Yale Law School October 31, 2024 “Our Past and Our Future”: Alumni Reunite During Bicentennial Year Capping Yale Law School’s bicentennial year, Alumni Weekend 2024 brought more than 1,400 alumni and guests to New Haven. “Our Past and Our Future”: Alumni Reunite During Bicentennial Year October 29, 2024 Professor Akhil Reed Amar Awarded a 2024 Barry Prize Professor Akhil Reed Amar ’84 has been awarded one of 10 Barry Prizes from the American Academy of Sciences and Letters. Professor Akhil Reed Amar Awarded a 2024 Barry Prize October 9, 2024 | The Wheelhouse (WNPR) A Look at the Controversial Electoral College Sterling Professor of Law and Political Science Akhil Reed Amar ’84 examines the Electoral College. A Look at the Controversial Electoral College August 26, 2024 | The New York Times How a Federal Court in New Orleans Is Driving the Conservative Agenda Sterling Professor of Law and Political Science Akhil Reed Amar ’84 was quoted about recent rulings by the Fifth Circuit Court. How a Federal Court in New Orleans Is Driving the Conservative Agenda August 13, 2024 | The Washington Post Schumer’s Presidential Immunity Fix Will Only Make Things Worse Sterling Professor of Law and Political Science Akhil Reed Amar ’84 discussed presidential immunity. Schumer’s Presidential Immunity Fix Will Only Make Things Worse July 20, 2024 | The Washington Post Tossing Trump’s Case Was Risky for Judge Cannon — At Least for Now Sterling Professor of Law and Political Science Akhil Reed Amar ’84 spoke about Judge Aileen M. Cannon’s decision to dismiss Donald Trump’s classified documents case. Tossing Trump’s Case Was Risky for Judge Cannon — At Least for Now Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9"
