["https://law.yale.edu/leadership/public-sector"]
title = "Carol and Gene Ludwig Program in Public Sector Leadership | Yale Law School"
full_description = "“Yale Law School has been the cornerstone that has allowed me to do everything I’ve done in life, from becoming a lawyer to government service to building businesses and pushing for positive change for low- and moderate-income communities. - Gene Ludwig, Class of 1973 Carol and Gene Ludwig Program in Public Sector Leadership The Ludwig Program in Public Sector Leadership was founded by Gene Ludwig '73 and Carol Ludwig. Read more about our Founders. Part of The Tsai Leadership Program at Yale Law School, the Carol and Gene Ludwig Program in Public Sector Leadership provides focused educational and professional support to Yale Law students who aspire to nontraditional careers and leadership roles in the public sector. The Ludwig Program helps prepare students for careers in areas such as government, nonprofits, and other institutions focused on serving the public.The mission of the Ludwig Program is to ensure that Yale Law students are capable of translating principle into practice; can display a firm grasp of the political, economic, civic, and operational dimensions of policy work; and are well-equipped to engage in ethical reflection and decision-making. The Ludwig Program is premised on the notion that those who serve in the public sector should be flexible, broad-gauged thinkers who make empirically grounded decisions and are deeply committed to a vibrant democracy and the well-being of others.The Faculty Directors for the Ludwig Program in Public Sector Leadership are Cristina Rodríguez ’00, Leighton Homer Surbeck Professor of Law, and Jacob Hacker, Stanley B. Resor Professor of Political Science in the Faculty of Arts and Sciences at Yale University and a Resident Faculty Fellow of the Institution for Social and Policy Studies at Yale. Become a Ludwig Fellow Yale Law School J.D. students may apply to become Fellows of the Ludwig Program in Public Sector Leadership. Ludwig Fellows will work to attain the literacies and professional skills necessary to serve as effective public sector leaders and are able to take advantage of the foundational coursework at the Law School generally as well as specialized offerings supported through the program. Ludwig Fellows will also have access to professional skills-training workshops and mentorship opportunities outside of the regular curriculum and take part in the Ludwig Citizenship and Equality Lecture Series, which brings speakers to campus to address the ethics of citizenship and public service. Fellows will develop individual plans, comprised of curricular and extracurricular offerings, suited to their individual interests and goals in consultation with Faculty Directors, Cristina Rodriguez and Jacob Hacker, and Executive Director, Margie Adler.To learn more see Chae/Ludwig Fellows page. Alumni Leaders Alumni Leaders Jacquelyn Rebekka Bonner ’03 Leading for Its Own Sake Read More Basha Rubin ’10 On the Job Training Read More Reginald Dwayne Betts ’16 Succeeding Against All Odds Read More John Koskinen ’64 Leading in a Crisis Read More Sushma Soni ’90 The Importance of Mentorship Read More Ahilan T. Arulanantham ’99 A Fighter for Justice Read More Laura Arnold ’00 Diving Deep for Data-Driven Change Read More Richard Buery Jr. ’97 A Child Will Lead Them Read More Frank R. Jimenez ’91 Building Others up to Succeed Read More Ian Solomon ’02 A Student and Teacher of Leadership Read More William Kennard ’81 Leadership Is a Team Sport Read More Gene Ludwig ’73 Creating a More Equitable World Read More Rhonda McLean ’83 Journey Fueled by Legacy Read More Yasmin Cader ’92 Following Her Heart to Fight for Justice Read More B. Marc Allen ’02 When Personal and Professional Interest Collide Read More Conchita Cruz ’16 A Purpose-filled Journey Read More Nicholas Turner ’96 The Right Road Is Usually the Hardest Read More Carla Anderson Hills ’58 A Wide-ranging Career in Government Read More PreviousNext “Yale Law School has been the cornerstone that has allowed me to do everything I’ve done in life, from becoming a lawyer to government service to building businesses and pushing for positive change for low- and moderate-income communities. - Gene Ludwig, Class of 1973"
