["https://law.yale.edu/giving/give-now/how-make-gift"]
title = "How to Make a Gift | Yale Law School"
full_description = 'Make a Gift You can make a gift to Yale Law School in a variety of ways.Make a gift online using our secure site.Make a gift by check, payable to "Yale Law School" and mailed to:Yale Law SchoolP.O. Box 208329New Haven, CT 06520-8329Make a gift via Donor-Advised Fund by selecting Yale University EIN 06-0646973. If you have any questions, please contact Alumni Engagement & Development at ylsfund@yale.edu or (203) 436-8895.Make a gift via cash wire by contacting Alumni Engagement & Development at ylsfund@yale.edu or (203) 436-8895. Learn more about wire giftsMake a gift of securities or mutual fund shares by instructing your bank or broker to contact Karen Kustra in Yale University’s Planned Giving Office at (866) 219-0885. Learn more about giving securitiesMake a gift via credit card over the phone at (203) 432-6080 or toll-free at (866) 848-3148.If your company or firm offers a matching gift program, you can increase the value of your gift to YLS. Contact your human resources or employee relations office for the necessary forms.Types of GiftsOne-Time Gifts The most common gift to YLS is through the Yale Law School Fund. These current-use dollars can be unrestricted, or can be designated for areas such as financial aid or clinical programs. Learn more about one-time giftsRecurring Gifts Set up a gift that charges a credit card as often as monthly. Note: Your first payment is charged the day you submit a recurring gift.Multi-Year Gift Intentions Make a gift today and pay it off in annual installments over as many as five years. If your gift is in honor of your reunion, the full amount of your gift intention will count towards your class’ Reunion Gift Campaign.Planned Gifts Leave a lasting legacy through bequests, gift annuities, trusts or IRA distributions. Learn more about planned giving'
