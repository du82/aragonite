["https://law.yale.edu/its-faqs"]
title = "IT FAQs | Yale Law School"
description = "Visit the YLS ITS service catalog for other available services."
full_description = '''Visit the YLS ITS service catalog for other available services. Current Students FAQ How do I connect to Yale WiFi? For information and instructions for connecting to Yale WiFi, click here. How do I download a copy of Microsoft Office 365 desktop apps? Law Students can download a copy of Microsoft Office for Mac or Windows free of charge. To do so, follow these instructions to install Office for “Non-managed device users”. How do I change my Yale password? You can change your Yale password at www.yale.edu/netid Where can I activate my password using a PIN number given to me by YLS IT? Your new Yale password can be activated with a PIN at www.yale.edu/netid. How can I print to YLS printers? Yale Law School uses the University-wide printing system called BluePrint which is powered by Papercut.Printing information for law students is available at https://www.law.yale.edu/printing. This includes configuration instructions for printing from your personal computer, common issues, and a list of Law School printers.Complete list of Papercut printer locations. How do I add funds or get a refund on my printing account? Students are granted access to a shared print account for their academic printing needs. Print jobs charged to this account are directly billed to YLS IT. Students needing to add funds to their print account for personal printing activities can add funds online (you must be on-campus or connected to the Yale VPN to access this site).When printing, if you have any issues such as a failed print job, please submit a request a refund for a failed print job (you must be on-campus or connected to the Yale VPN to access this site). How do I map to my journal’s network shared drive? Instructions for mapping shared network drives What is VPN and where can I get it? Yale VPN (Virtual Private Network) is a way to securely access a remote network. Yale VPN allows eligible individuals to access Yale resources from a non-Yale internet source as if they were directly connected to the campus network.The Yale VPN is connected via Cisco AnyConnect Secure Mobility Client. This can be downloaded at the Yale software site.Additional instructions for connecting to the VPN How do I access my Yale Law School Email Account? Yale Law School email can be accessed at outlook.com/yale.edu How do I forward my Yale email to another account, like Gmail? Forwarding mail from your Yale Office 365 mail account to another email account such as Gmail is not recommended. Security features, such as encryption, may be lost when forwarding. In addition, the Gmail Send As feature no longer works with Office 365, so you must log in to your Yale Office 365 account to send messages with your Yale email address.On Office 365 (outlook.com/yale.edu) 1. In a browser, go to outlook.com/yale.edu and log in with your full Yale email address and password. 2. Click the Settings Icon (a Gear Icon) in the upper right corner of the screen and select Mail from the My app settings menu. 3. Click Inbox and sweep rules from the left pan and Click the + (plus) button from the Inbox Rules section. 4. The "New Inbox Rule" window pops up. 5. You can enter a custom name for the rule in the Name field (e.g. Forwarding). Under Apply this rule... First, select [Apply to all messages] from the drop down list for When the message arrives, and: box. 6. Next, select "Redirect the message to..." from the drop down list for "Do the following:" box. 7. The Address Book window pops up, in the Redirect the message to field at the top, type in the email address that you want your email messages to be redirected to, then click OK. 8. Back at the New Inbox Rule window. You can click the Save button at the bottom right corner. The forwarding rule will take immediate effect. It is not retroactive to emails already received. How do I set up Yale email on my smartphone? It is recommended that you use the Outlook App on iPhone or Android to view your Yale email on your smartphone.Outlook for iOSOpen Outlook for iOSIf it is your first time, enter your full email address, then tap Add AccountIf not, open the Menu > tap Settings > Add Account > Add Email AccountEnter your email account password and tap Sign InVerify your identity using DUOAccept any prompts for permission you may receiveSwipe through the features and you’re now ready to use Outlook for iOS!Outlook for AndroidOpen the Outlook appIf this is the first account you are setting up in Outlook, click the Get Started buttonIf this is not the first account you are setting up in Outlook, click the gear icon in the upper right side of the app and select Add AccountOn the Add Account screen, enter your full email address, for example (first.last@yale.edu) and then tap ContinueOn the Yale screen asking for your work or school account, enter your full email address and password and tap Sign inVerify your account using DUOOn the Account Added screen tap SkipOutlook will now begin syncing your Mail, Calendar Items and Contacts How do I configure my email program (e.g. Outlook, Apple)? Note--Most modern web browsers support access to outlook.com/yale.edu which does not require the installation of an email program and can be accessed securely from public computers.Outlook 2019/2021 and Outlook 365 (PC)If you don't have a Startup Dialog box as the instructions suggest, go to File (or Office button) then Account settings to find the Account Configuration window instructed by the second step.Outlook 2019/2021 (Mac) Apple MailContact YLS IT. Outlook is the recommended mail client for use with Office 365.If you need assistance, please contact the YLS IT Services help desk at (203) 432-0821 during business hours. Can I get training on specific software like Office or Photoshop? LinkedIn Learning is an online software training service that is free for all Yale users. Your Yale NetID and password should give you access. How can I request an audio/visual recording of a class? Class recording requests are NOT taken via email. These requests should be placed on the AV Requests Calendar.Please consider the following:Recording requests should be made at least 24 hours in advance of the class.Written permission from the instructor is required.Recordings of classes should only be requested for absences because of either religious observance or a school-related trip.Personal audio or video recordings of classes are not allowed without prior written permission of the instructor. Can I borrow AV equipment (e.g. camera, microphone etc)? Please email law.av@yale.edu to make arrangements for borrowing AV equipment. Can I borrow a laptop or computing equipment? YLS IT has a limited number of Windows and macOS laptops and other equipment, such as computer cameras and external CD drives. Please stop by the Student Helpdesk on L2 of the Law Library or contact us at law.help@yale.edu to make arrangements.'''
year_published = 2025
