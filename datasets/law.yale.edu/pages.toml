["https://law.yale.edu/bruce-ackerman"]
title = "Bruce Ackerman | Yale Law School"
description = "Bruce Ackerman is Sterling Professor of Law and Political Science at Yale, and the author of nineteen books in political philosophy, constitutional law, and public policy. He is a Commander of the French Order of Merit, a member of the American Law Institute and the American Academy of Arts and Sciences. The American Philosophical Society has awarded him the Henry Phillips Prize for lifetime achievement in Jurisprudence, especially noting his exploration of the great turning points in American constitutional history in his three volume series, We the People."
full_description = "Bruce Ackerman Sterling Professor of Law and Political Science (on leave, fall 2024) Education LL.B., Yale Law School, 1967B.A., Harvard University, 1964 Curriculum Vitae Courses Taught The Civil Rights Era Comparative Constitutional Law Constitution of the Modern Republic Constitutional Law The Constitution: Philosophy, History, and Law Social Justice Bruce Ackerman is Sterling Professor of Law and Political Science at Yale, and the author of nineteen books in political philosophy, constitutional law, and public policy. He is a Commander of the French Order of Merit, a member of the American Law Institute and the American Academy of Arts and Sciences. The American Philosophical Society has awarded him the Henry Phillips Prize for lifetime achievement in Jurisprudence, especially noting his exploration of the great turning points in American constitutional history in his three volume series, We the People. His award-winning early work, Social Justice in the Liberal State, continues to provoke contemporary controversy.His scholarship has had a global impact. He has been named a Leading Global Thinker by Foreign Policy magazine, and has been awarded an Honorary Doctorate from the University of Trieste, Italy, for his contributions to comparative constitutional law. Before the Next Attack (2006) served as a basis for the reform of the French constitution dealing with emergency powers. The Stakeholder Society (with Anne Alstott) has served as the basis for reform initiatives in Brazil, Britain, and elsewhere that guarantee every person a fair share of the nation’s wealth by providing them with a “citizen stake” consisting of a substantial cash grant as they reach maturity.His recent book, Revolutionary Constitutions (Harvard: 2019) puts the worldwide constitutional crisis in historical perspective by comparing the postwar experience of countries as different as France, India, Iran, Italy, Israel, Poland, South Africa, and the United States — and suggests that these nations have a good deal to learn from one another in confronting the current assault on checks-and-balances. His arguments have generated a world-ranging discussion, provoking the publication of four Symposium volumes in which leading academics and jurists from around the world have greatly enriched comparative constitutional understanding. For the relevant volumes, see the curriculum vitae.More recently, he has published The Postmodern Predicament (Yale: 2024), dealing with the fundamental ways the internet revolution is transforming the struggle for a meaningful life — from the very first moment that a youngster picks up his first cellphone. Ackerman argues that 20th-century existentialists, like Simone de Beauvoir and Jean-Paul Sartre, offer crucial insights into the shattering challenges of the internet age — and follows their lead in proposing a series of decisive reforms that promise to reduce — if not eliminate -- the clear and present danger to constitutional democracy in the postmodern world.Read Professor Ackerman's Personal Biographic Statement. News Publications News February 13, 2025 | The Guardian Trump’s Illegitimate Power Grab Brings U.S. Closer to Dictatorship Sterling Professor of Law and Political Science Bruce Ackerman ’67 analyzed presidential power. Trump’s Illegitimate Power Grab Brings U.S. Closer to Dictatorship February 10, 2025 | The New York Times Welcome to America’s Fourth Great Constitutional Rupture Sterling Professor of Law and Political Science Bruce Ackerman ’67 was cited about the transformation of constitutional order. Welcome to America’s Fourth Great Constitutional Rupture January 26, 2025 | Morning Shot (OMNY) How Many of Trump’s Executive Orders Will Make It Through Sterling Professor of Law and Political Science Bruce Ackerman ’67 discussed the executive actions signed by President Trump during his first week in office. How Many of Trump’s Executive Orders Will Make It Through January 21, 2025 | NBC News ‘Appalling’: Current and Former Prosecutors Lament Trump’s Jan. 6 Pardons Sterling Professor of Law and Political Science Bruce Ackerman ’67 discussed presidential pardon power. ‘Appalling’: Current and Former Prosecutors Lament Trump’s Jan. 6 Pardons November 22, 2024 | Newsweek How Trump Could Skirt Congress to Geet His Cabinet Picks Through Sterling Professor of Law and Political Science Bruce Ackerman ’67 discussed the president-elect’s cabinet picks. How Trump Could Skirt Congress to Geet His Cabinet Picks Through November 22, 2024 | The New York Times The ‘Landslide’ That Wasn’t: Trump and Allies Pump Up His Narrow Victory Sterling Professor of Law and Political Science Bruce Ackerman ’67 spoke about the upcoming president’s legislative agenda. The ‘Landslide’ That Wasn’t: Trump and Allies Pump Up His Narrow Victory November 18, 2024 | Project Syndicate Trump Won, but Trumpism Did Not — A Commentary by Bruce Ackerman ’67 Bruce Ackerman ’67 is Sterling Professor of Law and Political Science at Yale. Trump Won, but Trumpism Did Not — A Commentary by Bruce Ackerman ’67 November 14, 2024 | Correio Braziliense Biden and Trump Have Cordial Meeting and Hint at Smooth Transition Sterling Professor of Law and Political Science Bruce Ackerman ’67 spoke about the incoming U.S. presidential cabinet and constitutional law regarding presidential term limits. This article is in Portuguese. Biden and Trump Have Cordial Meeting and Hint at Smooth Transition August 26, 2024 | Politikon (France) Comment faire pour que les gens votent mieux? Deliberation Day (Yale: 2002), co-authored by Sterling Professor of Law and Political Science Bruce Ackerman ’67, was highlighted for its real-world implications for France and the broader European community. Comment faire pour que les gens votent mieux? August 24, 2024 | Correio Braziliense (Brazil) Kamala Harris and Donald Trump Enter the Final Stretch of the Campaign Sterling Professor of Law and Political Science Bruce Ackerman ’67 spoke about the upcoming presidential election. This interview is in Portuguese. Kamala Harris and Donald Trump Enter the Final Stretch of the Campaign Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 … Last page 12 img { margin-right:50px; } BooksRevolutionary Constitutions, Harvard University Press: May, 2019When Melvin the Camel Meets Donald Trump (with Cody Visnick), 2017We the People, Vol. 3: The Civil Rights Revolution, Harvard University Press: (2014) The Decline and Fall of the American RepublicHarvard University Press: 2010 Before the Next AttackYale University Press: 2006. The Failure of the Founding FathersHarvard University Press: 2005. Deliberation Day (with James Fishkin)Yale University Press: 2004. Voting with Dollars (with Ian Ayres)Yale University Press: 2002. The Stakeholder Society (with Anne Alstott)Yale University Press: 1999.(German translation: Campus, 2001). La Politica del Dialogo LiberalGedisa: 1999The Case Against Lameduck ImpeachmentSeven Stories Press: 1999.We the People, Vol 2: TransformationsHarvard University Press: 1998. (Chinese: Law Press China, 2003).Is NAFTA Constitutional? (with David Golove)Harvard University Press: 1995.The Future of Liberal RevolutionYale University Press: 1992. German: Ein neuer Anfang fuer Europa, Siedler: 1993. Spanish: Ariel, 1995. Polish: Terminus, 1996.We the People, Vol 1: FoundationsHarvard University Press: 1991. French: Au Nom du Peuple, Calmann-Levy, 1998.Reconstructing American LawHarvard University Press: 1984. Spanish: Del Realismo Al Constructivismo Juridico, Ariel: (1989)Clean Coal/Dirty Air (with Hassler)Yale University Press: 1981.Social Justice in the Liberal StateYale University Press: 1980. Italian: Il Mulino, 1984; Spanish: Centro de Estudios Constitutionales, 1993.Private Property and the ConstitutionYale University Press: 1977.The Uncertain Search for Environmental Quality (with Rose-Ackerman, Sawyer and Henderson)Free Press: 1974Edited VolumesStephen Skowronek,