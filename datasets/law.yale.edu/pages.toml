["https://law.yale.edu/centers-workshops/yale-center-law-and-philosophy"]
title = "Yale Center for Law and Philosophy | Yale Law School"
full_description = "Based at Yale Law School, the Center was founded in 2005 as a joint venture with the Yale Philosophy Department. It aims to encourage advanced work, including research degrees, at the interface of philosophy and law. Members of both faculties are affiliated with the Center, as are a number of regular and occasional visitors.The Center's program includes regular workshops and conferences, attracting leading philosophers of law from around the world. A selection of conference papers is freely available on this website. The Center also helps to coordinate courses across the Law School and the Philosophy Department."
