["https://law.yale.edu/admissions/cost-financial-aid/post-graduate-loan-repayment/about-coap"]
title = "About COAP | Yale Law School"
full_description = "About the Career Options Assistance Program Yale Law School has long encouraged its graduates to pursue public service activities. Rising educational debt burdens and stagnant public sector salaries, however, increasingly deter graduates from choosing public interest careers. Large debt and low salaries also discourage career options in academia and some types of private practice.To give financial expression to the Law School’s commitment to a full range of career opportunities, Yale established the Career Options Assistance Program (COAP) in 1989 to provide substantial post-graduation assistance with educational loan repayment for graduates who choose lower paying positions.Since its inception, more than 2,200 Yale Law School graduates have participated in COAP and received over $94 million in benefits. COAP remains the most generous loan repayment program available to law school students and the example after which many other programs are modeled.For Classes of 2024 and beyond, employers must certify compliance with Yale Law School's Nondiscrimination Policy. Contact Information:financialaid.law@yale.edu(203) 432-1688 Today is a wonderful time to be blessed with legal training and to be able to go out and take on the enormous challenges of a difficult world — with an aspiration to lead tempered by humility at the complexity, difficulty, discipline, and self-sacrifice inherent in the task. Ben W. Heineman, Jr.|Class of 1971"
