title = "The Tsai Leadership Program | Yale Law School"
description = "For 200 years, Yale Law School has graduated leaders who blaze their own unique paths and effect global change. In keeping with our restless spirit, The Tsai Leadership Program builds on this remarkable legacy of excellence and innovation."
full_description = "“When the time is right, trust yourself to pursue an audacious dream or goal, and trust your training. You have the chance to take these risks when others don’t because you’ve had the privilege of attending YLS. - Bryan Leach, Class of 2005 Letter from Dean Gerken For 200 years, Yale Law School has graduated leaders who blaze their own unique paths and effect global change. In keeping with our restless spirit, The Tsai Leadership Program builds on this remarkable legacy of excellence and innovation. Read More Multidimensional Leaders Across Every Sector Ludwig Program in Public Sector Leadership The world needs leaders fueled by purpose and guided by both the heart and mind. The Ludwig Program in Public Sector Leadership prepares students for careers in the public sector and equips them with the skills they need to make a difference in the lives of others. Learn More Chae Initiative in Private Sector Leadership Today's corporations and startups demand empathetic individuals who are mission-driven. The core aim of the Chae Initiative is to train wide-ranging, professionally skilled, ethical thinkers who can address complex business challenges with a cross-disciplinary skill set. Learn More Up to the Challenge? If you’re committed to tackling the biggest challenges of our time and determined to leave your mark, you belong here. Play Video “When the time is right, trust yourself to pursue an audacious dream or goal, and trust your training. You have the chance to take these risks when others don’t because you’ve had the privilege of attending YLS. - Bryan Leach, Class of 2005"
