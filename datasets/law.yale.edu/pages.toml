title = "Financial Aid Support | Yale Law School"
full_description = "Home Admissions & Financial Aid Financial Aid Yale Law School's financial aid policies and programs are designed to make it possible for students to pursue their legal education at Yale regardless of their financial circumstances.Using a combination of loans and scholarship grants, we make every effort to provide students with the difference between their resources—such as family resources, summer earnings and student savings—and the cost of attending Yale. 71% of our J.D. student body received some form of financial aid in the 2023-2024 academic year, and 62% qualified for Law School scholarship grants, which are awarded solely on the basis of financial need.For more details on JD financial aid policies and procedures, please refer to the 2024-2025 JD Financial Aid Handbook.UPLOAD REQUIRED FINANCIAL AID DOCUMENTS HERE Director of Financial Aid Jackie Outlaw explains the financial aid process. The Hurst Horizon Scholarship Program eliminates tuition for J.D. students with the greatest financial need. Kath Xu ’20 talks about financial aid at Yale Law School Alexander Komarov ’20 LLM talks about financial aid at Yale Law School Financial Aid Timeline for Academic Year 2024-2025 7/31/24Deadline to pay first term bill for Fall 2023 tuition and fees8/1/24Deadline for COAP Loan Forgiveness for second half of 2024 due11/30/25Deadline to pay second term bill for Spring 2025 tuition and fees1/15/25Deadline for COAP Loan Forgiveness for first half 2025 due2/1/25FAFSA and FAAST open for 2025-2026 applications2/1/25Summer Public Interest Fellowships (SPIF) Part I applications due3/15/25Application Deadline Incoming Students (FAFSA and FAAST)3/15/25Summer Public Interest Fellowships (SPIF) Part II applications due4/15/25Application Deadline Continuing Students (FAFSA and FAAST)5/5/25Deadline for Submitting All Additional Required Documents - New Admits5/14/25Bar loans must be approved by lenders to be COAP eligible6/15/25Deadline for submitting Notifications 