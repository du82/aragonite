title = "Law, Environment & Animals Program | Yale Law School"
full_description = "Welcome to the Law, Environment & Animals Program Learn about LEAP’s vision and work. Climate Change & Animal Agriculture LEAP explores how litigation in U.S. courts might help address the climate harms of industrial animal agriculture In the Classroom Humanity’s treatment of animals raises vital legal, political, moral, and scientific issues. Learn about YLS animal law courses “When We Talk About Animals” Podcast A series of in-depth conversations with leading thinkers on the big questions animals raise about what it means to be human Get Involved Attend events. Become a LEAP Student Fellow. Sign up for our newsletter. Learn about these and more ways to get involved The Law, Environment & Animals Program (LEAP) at Yale Law School is dedicated to two overarching goals. First, we aim to inspire impactful learning and scholarship about the deep legal, scientific and moral questions that humanity’s treatment of other animals raise. Second, we aim to empower Yale scholars and students to produce positive legal and political change for animals, people, and the environment upon which they depend.Join our newsletter."
