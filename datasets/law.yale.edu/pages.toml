title = "Regional Alumni Associations | Yale Law School"
full_description = "The Yale Law School Association consists of all graduates of the school. It was founded to strengthen ties among graduates and between graduates and the Law School. The Yale Law School Associations throughout the United States and abroad provide social, intellectual, and professional opportunities for graduates. Graduates living in a particular region are automatically members of that regional or international association. Steering committees or individual YLS graduates, together with the Law School, plan events for the area alumni. Whether it is a discussion with one of the Law School's innovative faculty members, a panel discussion featuring California’s three YLS alumni Supreme Court Justices, or any number of other possibilities, Yale Law School alumni maintain important connections with each other and with their alma mater."
