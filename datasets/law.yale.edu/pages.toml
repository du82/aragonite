["https://law.yale.edu/muneer-i-ahmad"]
title = "Muneer I. Ahmad | Yale Law School"
description = "Muneer Ahmad is Sol Goldman Clinical Professor of Law at Yale Law School. He co-teaches in the Worker and Immigrant Rights Advocacy Clinic (WIRAC). In WIRAC, he and his students represent individuals, groups and organizations in both litigation and non-litigation matters related to immigration, immigrants’ rights, and labor, and intersections among them. He has represented immigrants in a range of labor, immigration, and trafficking cases, and for three years represented a prisoner at Guantanamo Bay; he has written on these and related topics."
full_description = '''Muneer I. Ahmad Sol Goldman Clinical Professor of Law Education J.D., Harvard Law School, 1996A.B., Harvard University, 1993 Courses Taught Refugee and Immigration Law, Policy and Practice in Crisis Worker & Immigrant Rights Advocacy Clinic Muneer Ahmad is Sol Goldman Clinical Professor of Law at Yale Law School. He co-teaches in the Worker and Immigrant Rights Advocacy Clinic (WIRAC). In WIRAC, he and his students represent individuals, groups and organizations in both litigation and non-litigation matters related to immigration, immigrants’ rights, and labor, and intersections among them. He has represented immigrants in a range of labor, immigration, and trafficking cases, and for three years represented a prisoner at Guantanamo Bay; he has written on these and related topics. In the Transnational Development Clinic, Professor Ahmad and his students work on projects designed to identify productive sites for intervention for U.S.-based lawyers in global poverty work. This included work regarding the rights of street vendors in India, the barriers faced by immigrant communities in sending remittances to their home countries, access to essential medicines, institutional accountability among international financial institutions, and advocacy on behalf of workers displaced by changes in trade policy. His scholarship examines the intersections of immigration, race, and citizenship in both legal theory and legal practice. Previously, he was Professor of Law at American University Washington College of Law. Prior to joining the faculty at American in 2001, he was a Skadden Fellow and staff attorney at the Asian Pacific American Legal Center in Los Angeles. He clerked for the Hon. William K. Sessions III in the U.S. District Court for the District of Vermont. News News January 17, 2025 | The New York Times Why Trump’s Second-Term Agenda Could Hinge on the Court He Hates the Most Sol Goldman Clinical Professor of Law Muneer I. Ahmad discussed injunctions and Supreme Court jurisdiction. Why Trump’s Second-Term Agenda Could Hinge on the Court He Hates the Most October 9, 2024 Service Matters: How Yale Law School Clinics Change the World From modest beginnings, the clinical program at the Law School has grown into one of the school’s crown jewels. Service Matters: How Yale Law School Clinics Change the World April 30, 2024 Podcast: Professor Muneer Ahmad Defends Immigrant Rights and “Clinical Heresy” In this episode of "Inside Yale Law School," Professor Muneer Ahmad discusses the remarkable achievements of the Worker and Immigrants Rights Advocacy Clinic, from grounding a plane at JFK to stop a deportation to fighting for young immigrants at the Supreme Court. Podcast: Professor Muneer Ahmad Defends Immigrant Rights and “Clinical Heresy” May 2, 2022 Clinical Education at Yale Law School Celebrates 50 Years Faculty, students, and alumni recently gathered to celebrate the 50th anniversary of clinical education and the Jerome N. Frank Legal Services Organization at Yale Law School. Clinical Education at Yale Law School Celebrates 50 Years July 26, 2021 Home Is Here Yale Law School faculty, alumni, and students look back at a tumultuous four years fighting for a more just immigration system. Home Is Here April 27, 2021 Yale Teach-In Series Reflects on the Path Forward After the Chauvin Verdict A series of three teach-ins involving Law School faculty, staff, alumni, and affiliates presented an opportunity for the Yale community to reflect and come together in the wake of the trial of former Minneapolis police officer Derek Chauvin. Yale Teach-In Series Reflects on the Path Forward After the Chauvin Verdict April 20, 2021 | Law.com Low-Wage Earners in Spotlight as Employment Litigation Targets Alleged Wage Theft Sam Hull ’22 is quoted, and William O. Douglas Clinical Professor of Law Michael Wishnie ’93 and Sol Goldman Clinical Professor of Law Muneer Ahmad are mentioned, in a Law.com article about a lawsuit alleging wage theft and racial discrimination against Latino workers at a Connecticut business. Low-Wage Earners in Spotlight as Employment Litigation Targets Alleged Wage Theft November 18, 2020 | Law360 NY Judge Slams Feds For 'Ignoring' Justices' DACA Revival William O. Douglas Clinical Professor of Law Michael Wishnie ’93, Sol Goldman Clinical Professor of Law Muneer Ahmad, Clinical Associate Professor of Law Marisol Orihuela ’08, and students from the Worker and Immigrant Rights Advocacy Clinic are mentioned in a Law360 article about new efforts by the Trump administration to curtail DACA. NY Judge Slams Feds For 'Ignoring' Justices' DACA Revival November 15, 2020 | NPR / Morning Edition Acting DHS Secretary Lacked Authority To Suspend DACA Program, Judge Rules Sol Goldman Clinical Professor of Law Muneer Ahmad was interviewed on NPR about the Trump administration’s efforts to roll back DACA and the role of the Worker and Immigrant Rights Advocacy Clinic at Yale Law School. Acting DHS Secretary Lacked Authority To Suspend DACA Program, Judge Rules August 28, 2020 | Law360 Immigrants, States Say Wolf Lacks Authority To Limit DACA William O. Douglas Clinical Professor of Law Michael Wishnie ’93, Sol Goldman Clinical Professor of Law Muneer Ahmad, and Clinical Associate Professor of Law Marisol Orihuela ’08 and the Jerome N. Frank Legal Services Organization are mentioned in a Law360 article about the latest developments in the Trump administration’s efforts to roll back the Deferred Action for Childhood Arrivals program. Immigrants, States Say Wolf Lacks Authority To Limit DACA Pagination Current page 1 Page 2 Page 3'''
