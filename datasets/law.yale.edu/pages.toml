["https://law.yale.edu/giving/our-work-and-impact/justice"]
title = "For Justice | Yale Law School"
full_description = "At Yale Law School, we don’t choose between theory and practice. We excel at both, putting ideas into action to make a positive difference in our communities, across the country, and in every corner of the globe. We are committed to the use of the law as an instrument of social, economic, and political change, and our clinics, centers, and programs are immersed in today’s critical justice issues. Our clinical faculty and students work creatively and tirelessly to change not only individual lives, but entire systems. Our centers and programs engage with the most important issues of our time, working on research and initiatives that shape public policy and lead to real-world impact.From improving the lives of veterans and immigrants to tackling criminal justice reform, from investigating international human rights abuses to protecting civil rights, our students don’t sit on the sidelines; they make headlines. Yale Law School relies on the critical support of alumni and friends to ensure our students and faculty can press forward in their trailblazing work. Will you support our clinics and centers by making a gift today? The people of YLS were the highlight of my experience. I learned something new every day from such brilliant and inspiring classmates. I’ve made so many lifelong friends and can't wait to see how they change the world. Nick Fernandez|Class of 2024"
