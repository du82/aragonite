, Apr. 6, 2013• Delivered remarks at the Harold H. Koh Portrait Unveiling, Yale Law School, New Haven, CT, Apr. 11, 2013• Attended the APALSA/NALSA/SALSA (Asian Pacific American Law Students Association/Native American Law Students Association/South Asian Law Students Association) Alumni Banquet, and introduced Justice Goodwin Liu of the California Supreme Court, Keynote Speaker, New Haven, CT, Apr. 12, 2013• Introduced Justice Marta Cartabia of the Italian Constitutional Court at an informal luncheon sponsored by the Yale Law Women and the Catholic Law Students Association, and at a seminar at the Law School, Apr. 14, 2013Publications• Obituary, Ronald Dworkin—legal philosopher, TIME Magazine, Mar. 4, 2013Other Professional Highlights• Received honorary degree, Laurea Honoris Causa in Giurisprudenza (Doctor of Laws), at the opening of the academic year, University of Brescia, and delivered a lecture on “Federalism: Causes and Consequences,” Brescia, Italy, Jan. 21, 2013• Received Award of Distinction for Leadership and Professional Excellence at the 10th Anniversary Gala Dinner of ALMA (Association of Italian LL.M. Graduates), and spoke on “Formalism and Functionalism,” New York, NY, Jan. 24, 2013• Judged Final Argument of the Eighth Annual Immigration Law Moot Court Competition, with Honorable Ilana Rovner, U.S. Court of Appeals for the 7th Circuit, and Honorable Robert Katzmann, U.S. Court of Appeals for 2nd Circuit, New York University School of Law, Feb. 24, 2013• Dedicatee of the 70th Volume of the Annual Survey of American Law, New York University School of Law. Spoke in reply to comments by Dean Richard L. Revesz, Theodore F. Kelly, Editor-in-Chief, New York University Annual Survey of American Law, Kenneth S. Abraham, Akhil R. Amar, The Honorable Robert A. Katzmann, The Honorable Judith S. Kaye, Vincenzo Varano, and Kenji Yoshino, held at New York University School of Law, Feb. 26, 2013• Visited Northwestern University School of Law as the 2013 Howard J. Tr