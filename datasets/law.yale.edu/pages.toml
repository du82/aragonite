["https://law.yale.edu/giving/our-work-and-impact/future-leaders"]
title = "For Future Leaders | Yale Law School"
full_description = "Our commitment to equal access means that we open our doors to those students who have the most to gain from this School and the most to give to the world, regardless of their means. Yale Law School has long been a leader in providing need-based financial aid, ensuring that our remarkable students have the chance to attend Yale no matter their financial circumstances. We want to provide the freedom for our students to pursue any career path they choose through additional scholarship and resources. Your support will provide life-changing resources directly to our students, equipping them to go out and change the world. Make a gift to support our students today. Because of the support I received from the Career Options Assistance Program (COAP), a group of YLS students and I were able to start the world’s first nonprofit organization providing legal aid to persecuted refugees seeking resettlement in safe countries. Rebecca Heller|Class of 2010"
