full_description = "YLS provides unparalleled opportunities for you to act on your passions and begin tackling challenging issues long before graduation. It has been such a privilege to not only have these opportunities, but also be able to work beside and learn from peers in these efforts. Class of 2024|Dena Shata Home Studying Law at Yale Academic Calendar & Resources Explore This Section Academic Calendar & Bulletin A listing of important resources for students, faculty, and staff, including the academic calendar and the YLS Bulletin.Fall 2024–Spring 2025 Calendar (current)Fall 2025–Spring 2026 CalendarFall 2023-Spring 2024 CalendarFall 2022–Spring 2023 CalendarSpring 2022 CalendarFall 2021 CalendarYale Law School Bulletin Academic Support & Resources Yale Law School offers a number of academic support resources for students looking to develop and improve upon their academic skills. View a list of legal writing, research, case reading, classroom, and exam resources.Academic Affairs Resources Events Calendar Yale Law School holds countless events each semester. Keep up to date with the latest activities happening in the building and our community. View Yale Law School EventsConnect with YLS social media Registrar’s Office The Registrar's Office upholds the academic policies of Yale Law School and coordinates registration, enrollment, and graduation.Visit the Registrar's Office websiteYLS:CoursesOrder a transcriptForms & Policies Career Development Office CDO’s main goal is to educate students and alumni on the diverse career paths open to them as graduates of the Yale Law School.Visit the CDO websiteCounseling Services Lillian Goldman Law Library The Lillian Goldman Law Library contains one of the world’s finest collections of printed legal materials and a growing array of online sources.Visit the Library websiteLibrary ServicesScholarship Repository Office of Student Affairs The Office of Student Affairs exists to support Yale Law School students. The office provides academic advising, supports student groups and journals, promotes student life and community building activities, and acts as the primary resource for students seeking to find balance in their law school experience. About OSA Meet the OSA Staff YLS provides unparalleled opportunities for you to act on your passions and begin tackling challenging issues long before graduation. It has been such a privilege to not only have these opportunities, but also be able to work beside and learn from peers in these efforts. Class of 2024|Dena Shata"
