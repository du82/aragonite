["https://law.yale.edu/about-yale-law-school/office-dean"]
title = "Office of the Dean | Yale Law School"
full_description = "I am proud to say that Yale manages to open doors that are unexpected for many foreign law students. Diane Desierto ’09 LLM, ’11 JSD Home About Yale Law School Office of The Dean A Message from the Dean At Yale Law School we educate lawyers and leaders in a fashion that is completely distinctive. We aim to train you for your last job, not just your first. Our graduates are broad-gauged, wide-ranging thinkers who blaze pathways in every sector of society. Their career paths are as varied and eclectic as they are. Some take a traditional lawyering path, while others work in Hollywood, Washington, D.C. and Silicon Valley. Our graduates found companies and nonprofits. They work in the White House and on Wall Street. Their potential is limitless; their impact is powerful.With our world-renowned faculty and remarkable student body, there is no better place to learn how to think. This is a place where ideas matter, and theory is taught at the highest level. Yale Law School houses the most sophisticated and eclectic faculty in the country, an unmatched faculty-student ratio, and an intellectual experience that is truly unparalleled.The Law School is just as ambitious about practice. Our clinics do work of an unrivaled scope and ambition. Ninety percent of our students enroll in clinics, and an extraordinary number of our faculty either run clinics or do substantial experiential work. There are more than three dozen legal clinics who do cutting-edge work and dozens of innovative programs and centers serving their communities and effecting change across the country and throughout the world. Our students don’t just volunteer for organizations; they found them. Our community doesn’t sit on the sidelines; we make headlines.There’s never been a better time to be a part of this community and ready yourself for the challenges ahead.Sincerely,Heather GerkenDean and Sol & Lillian Goldman Professor of LawYale Law School Inside Yale Law School Podcast Hosted by Dean Heather K. Gerken, Inside Yale Law School offers a window into the rich academic life of Yale Law School. Listen to the podcast Related Content More About Dean Gerken Visit Dean Gerken's faculty page to see her full biography and scholarship. Dean Gerken News Officers of Administration Biographies of the Deputy, Associate, and Assistant Deans at Yale Law School. Officers of Administration Contact the Dean’s Office How to get in touch with the Dean’s Office. Contact the Dean’s Office I am proud to say that Yale manages to open doors that are unexpected for many foreign law students. Diane Desierto ’09 LLM, ’11 JSD"
year_published = 2025
clearnet = "https://law.yale.edu/about-yale-law-school/office-dean"
