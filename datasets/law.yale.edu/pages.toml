["https://law.yale.edu/clinics/our-clinics/community-lawyering-clinic"]
title = "Community Lawyering Clinic | Yale Law School"
full_description = "The Criminal Justice Clinic has given me the unique opportunity to represent a client in court as a first-year law student. Experiential learning has been the most meaningful part of law school so far, and it has exposed me to the criminal justice system first-hand. Destiny Lopez|Class of 2021 Home Studying Law at Yale Clinical and Experiential Learning Our Clinics Community Lawyering Clinic About the Clinic The Community Lawyering Clinic represents individuals and grassroots organizations, coalitions, and campaigns that are banding together to enforce their rights, build power, and establish laws and policies that promote economic justice in Connecticut. Students may appear in court and agency proceedings, before legislatures and commissions, in the media, and at community meetings. Students will work in collaboration with community members and groups, taking direction from clinic partners about what types of legal interventions are needed and thinking flexibly and creatively about the role of lawyers.Students will handle both litigation and non-litigation matters in the clinic. Through their representation of clients in litigation matters, students will develop foundational litigation-oriented lawyering skills such as interviewing and counseling, formulating a case theory, drafting pleadings and briefs, negotiating with adversaries, and advocating in court. Non-litigation matters will involve alternative forms of lawyering, including policy and legislative analysis, drafting, and advocacy; strategic planning and advising; media advocacy; public records requests; community education; and other types of legal work necessary to secure meaningful, durable changes outside the courtroom. Clinical FacultyJason Parkin Ways to Engage Our Clinics Yale Law School offers more than 30 clinics that provide students with hands-on, practical experience in the law on a diverse range of subject matters. Read More About Clinics Simulation Yale Law School offers a suite of innovative simulation courses based on real-world case studies. Learn about Simulation Courses Centers and Workshops Yale Law School enhances the intellectual life of its academic community by sponsoring a variety of centers, programs, and workshops, inspired by the interests of its faculty and students. Our Intellectual Centers The Criminal Justice Clinic has given me the unique opportunity to represent a client in court as a first-year law student. Experiential learning has been the most meaningful part of law school so far, and it has exposed me to the criminal justice system first-hand. Destiny Lopez|Class of 2021"
