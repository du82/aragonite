["https://law.yale.edu/stephanie-abrutyn"]
title = "Stephanie Abrutyn | Yale Law School"
description = "Stephanie Abrutyn is a Visiting Clinical Lecturer in Law at Yale Law School. She also serves as Counsel at Dentons US LLP, resident in the Washington, D.C., and New York offices. She is a veteran litigator and advisor with more than 25 years of experience as in-house counsel and leadership at media companies such as HBO, WarnerMedia, Grid, Tribune Company, and ABC, Inc."
full_description = "Stephanie Abrutyn Visiting Clinical Lecturer in Law Education B.A., Colgate University, 1988J.D., University of Pennsylvania Law School, 1991 Courses Taught Media Freedom and Information Access Clinic Stephanie Abrutyn is a Visiting Clinical Lecturer in Law at Yale Law School. She also serves as Counsel at Dentons US LLP, resident in the Washington, D.C., and New York offices. She is a veteran litigator and advisor with more than 25 years of experience as in-house counsel and leadership at media companies such as HBO, WarnerMedia, Grid, Tribune Company, and ABC, Inc.Abrutyn regularly advises media companies on the full range of legal issues that arise in the production and distribution of content, and handles sensitive claims, complex litigation, and regulatory and compliance issues in a wide range of matters spanning intellectual property, libel and privacy, technology, antitrust, and commercial disputes. She is a frequent speaker, panelist, and author on issues relating to media and First Amendment law.Abrutyn received her B.A. from Colgate University and her J.D. from the University of Pennsylvania Law School. She is admitted to practice law in Maryland, the District of Columbia, and New York."
