title = "Student News & Opinion | Yale Law School"
full_description = "Home Student Life Student News & Opinion This page highlights notable accomplishments and activities of current students — including clinic cases, honors, awards, student events, media mentions, books published, fellowships received, and community service. If you are a current student, we encourage you to submit story ideas and photos for inclusion on this page. If you have recently published an op-ed, were cited or quoted in the media, or published a paper, please tell us about it here. Student prizes are awarded annually. News February 21, 2025 Student Brings Back Medal and Inspiration from Invictus Games Jarek Neczypor ’25 won a bronze medal in the international games for wounded, injured, and sick service members and veterans and witnessed the healing potential of adaptive sports. Student Brings Back Medal and Inspiration from Invictus Games February 12, 2025 At Student Community Lunches, Conversation is on the Menu At monthly Community Lunch events, students can share a meal while creating new connections and getting to know each other better. At Student Community Lunches, Conversation is on the Menu February 7, 2025 Law Students Tackle Big Hurdles to Small Claims An organization for Yale undergraduates started by Law School students Chad Borgman ’25 and Katherine Salinas ’25 aims to help litigants navigate the challenging small claims system in Connecticut. Law Students Tackle Big Hurdles to Small Claims January 22, 2025 Q&A: LEAP Student Fellow Thomas Peterson ’26 Explains How Shareholders Can Push For Sustainability Thomas Peterson ’26 discusses using shareholder advocacy to push companies to address greenhouse gas emissions from industrial animal agriculture. Q&A: LEAP Student Fellow Thomas Peterson ’26 Explains How Shareholders Can Push For Sustainability January 17, 2025 Students Document Reports of Abuse at Immigration Detention Center Fact finding by the student-run Yale Civil Rights Project bolstered a complaint to federal authorities against a Louisiana immigration detention center. Students Document Reports of Abuse at Immigration Detention Center January 14, 2025 LEAP Invites Applicants for an Animal Agriculture Accountability Project Fellow This LEAP fellow will prepare an assessment of potential litigation strategies challenging industrial animal agriculture’s negative externalities. LEAP Invites Applicants for an Animal Agriculture Accountability Project Fellow January 13, 2025 LEAP Invites Applications for 2025 Student Grant Program Applications for the grants, open to Yale graduate students and undergrads, are due March 28. LEAP Invites Applications for 2025 Student Grant Program December 2, 2024 Yale Beats Harvard — And Football Teams Can Cite It It's football, not footnotes, at the annual law journal editors’ game. Yale Beats Harvard — And Football Teams Can Cite It November 27, 2024 Alexander Bickel, Who Defined Supreme Court Paradox, Gets New Consideration The Yale Law School faculty member declared the Supreme Court a “deviant institution” and left scholars to reconcile its place in American democracy for decades since. Alexander Bickel, Who Defined Supreme Court Paradox, Gets New Consideration November 26, 2024 Students Hit the Trail and Find Community Through New Club Through the Yale Law School Hike Club, students connect with nature and each other. Students Hit the Trail and Find Community Through New Club Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 … Last page 82"
