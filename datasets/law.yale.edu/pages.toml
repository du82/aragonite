["https://law.yale.edu/student-life/health-wellness"]
title = "Health & Wellness | Yale Law School"
full_description = "Wellness at Yale Law School At Yale Law School, we care deeply about our students thriving individually and collectively. As a small community of about 650, it’s important that everyone feels known and supported.Law school is hard. And, despite rigorous academic demands, life keeps happening: family and partner obligations, finding friends and community, daily admin, and seeking personal and professional meaning and direction. We are committed to helping you take care of yourself mentally, physically, socially, emotionally and financially. YLS promotes mental health and wellness in a number of ways: assistance in finding a clinical therapist; social events; and workshops on stress, grief, time management, sleep hygiene and more. Beyond YLS, the Yale campus and New Haven community offer a plethora of options for feeling whole and well. Clinical CounselorYou may also meet with our clinical therapist Mia Wilson for confidential drop-in sessions or short-term therapy or to discuss if therapy is a right step for you. A session's focus can range from academic concerns to personal or social matters. All sessions are free and available to YLS students no matter their insurance status. Make an appointment online.Mia can also be reached by email at mia.wilson@yale.edu or by phone at 203-432-2574. Wellness Programming The Office of Student Affairs offers ways for students to come together through a variety of wellness activities. Visit the OSA Events Calendar to view upcoming events."
