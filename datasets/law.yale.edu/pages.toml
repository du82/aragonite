ributes by Dean Richard L. Revesz, Ted Kelly, Chief Judge Robert A. Katzmann, Professor Akhil Amar, Professor Kenneth S. Abraham, Professor Kenji Yoshino, Professor Vincenzo Varano, and Chief Judge Judith S. Kaye, in New York University Annual Survey of American Law, Vol. 70 (2014) (Dedicated to Judge Guido Calabresi)Amy ChuaLectures And Addresses• “The Triple Package: Women in Business and Politics,” Keynote Speech for The Gloss Magazine, Look the Business Gala in Connection with Vodafone, Mansion House, Dublin, Ireland, Oct. 22, 2014• “What Really Defines and Drives Success?: In Conversation with Amy Chua, Jeff Yang, and Vivian Louie,” Harvard Asian American Alumni Alliance Summit 2014, Cambridge, MA, Oct. 26, 2014• “Fireside Chat with Amy Chua,” Morgan Stanley,New York, NY, Oct. 30, 2014• “Change Your Beliefs: Parenting, Education, and Self-Esteem,” Ciudad de las Ideas Festival, Puebla, Mexico, Nov. 8, 2014• “The Triple Package” (with Jed Rubenfeld), Salisbury Forum, Salisbury, CT, Nov. 14, 2014• “Creativity and Education,” Chosun Conference: Global Leaders Forum 2014, Seoul, Korea, Nov. 20, 2014• “The Triple Package” (with Jed Rubenfeld), The Mark Twain House, Hartford, CT, Jan. 29, 2015• “Creativity, Individualism, and Confucian Values,” Southern Connecticut State University, New Haven, Feb. 1, 2015• “The Triple Package” (with Jed Rubenfeld), Writers in the Loft, The Music Hall, Portsmouth, New Hampshire, Feb. 5, 2015• “Creativity, Leadership, and Confucian Values,” Central Connecticut State University, New Haven, Feb. 8, 2015• “Fresh Off the Boat: Conversation with Amy Chua, Awkwafina, Jay Smooth,” The Greene Space, New York, NY, Feb. 9, 2015• “The Triple Package,” Bernstein Wealth Management Luncheon, Merion Cricket Club, Haverford, PA,Feb. 10, 2015• “The Triple Package,” Harvard and Princeton Clubs of Philadelphia, Racquet Club, Philadelphia, Feb. 10, 2015• “The Triple Package: How Cultural Values Drive Success,” Charles E. Smith Jewish Day School, Rockville