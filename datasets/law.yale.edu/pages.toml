merican Law Institute’s Principles of the Law, Civil Liability for Artificial Intelligence project. Professor Ketan Ramakrishnan Named to Civil Liability for Artificial Intelligence Project February 3, 2025 Faculty Spotlight: Professor David Schleicher In a Q&A, Professor David Schleicher discusses the legacy of a major Supreme Court case on eminent domain, why a revolt against property taxes will make the housing crisis worse, and how his teaching blends legal theory and policy analysis. Faculty Spotlight: Professor David Schleicher January 14, 2025 Podcast: Keith Whittington Tells Why Free Speech Can't Be Taken for Granted On “Inside Yale Law School,” Professor Keith Whittington discusses the heightened interest in academic freedom and free speech issues on university campuses and leading a new Law School center on these topics. Podcast: Keith Whittington Tells Why Free Speech Can't Be Taken for Granted December 20, 2024 Yale Law School Mourns the Loss of Edward J. Phelps Professor of Law and Economics George L. Priest George L. Priest, the Edward J. Phelps Professor of Law and Economics at Yale Law School, died on Dec. 17, 2024 at the age of 77. Yale Law School Mourns the Loss of Edward J. Phelps Professor of Law and Economics George L. Priest December 4, 2024 Faculty Spotlight: Professor John D. Morley ’06 A Q&A with Professor John D. Morley ’06 on his time at YLS, his interest in organizational theory, and his work as faculty director of the Chae Initiative in Private Sector Leadership. Faculty Spotlight: Professor John D. Morley ’06 December 2, 2024 Professor Joshua Macey Receives Award for Best ESG Paper An article co-authored by Associate Professor of Law Joshua Macey ’17 has received a 2024 Berkeley Center for Law and Business Best Paper Award. Professor Joshua Macey Receives Award for Best ESG Paper November 27, 2024 Celebration Commemorates Professor Alan Schwartz’s Lifetime of Scholarship Yale Law School honored Sterling Professor Emeritus of Law Alan Sc