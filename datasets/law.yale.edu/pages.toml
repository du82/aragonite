["https://law.yale.edu/our-faculty/faculty-activities-scholarship/summer-2015-faculty-activities"]
title = "Summer 2015 Faculty Activities | Yale Law School"
full_description = 'Faculty Activities by Season Yale Law School’s renowned and distinguished faculty members consistently engage in an extraordinary range of activities and scholarship. Read the extensive list of faculty activities and accomplishments —from lectures given to books published to honors and awards received—by browsing our academic archives on the right, reading our faculty news feed below, or viewing the Yale Law Report. Read commentaries in the popular press and other news clips on our In the Press page. Summer 2024Summer 2023Summer 2022Summer 2021Summer 2020Summer 2019Summer 2018Summer 2017Summer 2016Summer 2015Summer 2014Summer 2013Summer 2012 Winter 2025Winter 2024Winter 2023Winter 2022Winter 2021Winter 2020Winter 2019Winter 2018Winter 2017Winter 2016Winter 2015Winter 2014Winter 2013Winter 2012 Bruce AckermanLectures And Addresses• “Three Paths to Constitutionalism–and their Authoritarian Alternatives,” Distinguished Lecture in the Social Sciences, Wissenschaftszentrum, Berlin,Nov. 6, 2014• “A General Theory of Constitutionalism and theCrisis of the European Union,” Daimler Lecture, American Academy in Berlin, Jan. 29, 2015• “Is There a Progressive Future for America?,” Inaugural Lecture in the “What’s Up America” series, sponsored by the Bundeszentrale fuer Politische Bildung of the Federal Republic, Berlin, Mar. 12, 2015• “Reactionary Constitutional Moments,” Symposium on We the People: the Civil Rights Revolution, Jerusalem Review of Legal Studies, Hebrew University in Jerusalem, Mar. 27, 2015Publications• Preface, DELIBERATION DAY (with James Fishkin), Japanese edition: 2015• Europa, hilf dir selbst! (Europe, Take Care of Yourself!), SUEDDEUTSCHE ZEITUNG, Feb. 21–22, 2015• Congress, Don’t Be Fooled; Obama Still Believes in Unlimited War, N.Y. TIMES, Feb. 11, 2015• What We Can Learn from the French About Terrorism, HUFFINGTON POST, Jan. 9, 2015• Like the Emancipation Proclamation, Obama’s Order Forces Democracy, L.A. TIMES, Nov. 23, 2014• Obama’s Illegal War, WASH. POST, Nov. 7, 2014• Podcast: “American Foreign Policy, Iran and the Constitution,” with Louis Fisher and Jeff Rosen, Constitution Center, Mar. 12, 2015, available athttp://blog.constitutioncenter.org/2015/03/podcast-american-foreign-policy-iran-and-the-constitution/• Hillary Clinton’s Bad Beginning, HUFFINGTON POSt,Apr. 13, 2015• What Shinzo Abe Wants from Washington—And Why He Shouldn’t Get It, HUFFINGTON POST, Apr. 22, 2015Ian AyresLectures And Addresses• “The Rule of Probabilities” (with Barry Nalebuff), at “Who Knows?: Law in an Information Society. A Festschrift in Honor of Richard Craswell,” Stanford Law School, Feb. 2015Publications• Beyond Diversification: The Pervasive Problem of Excessive Fees and Dominated Funds in 401(k) Plans (with Quinn Curtis), 124 YALE L.J. 1346 (2015)• Protecting Consumer Investors by Facilitating "Improved Performance’ Competition (with Quinn Curtis), 2015 U. ILL. L. REV. 1 (2015)• Anti-Herding Regulation (with Joshua Mitts), 5 HARV. BUS L. REV. 1 (2015)• Evidence and Extrapolation: Mechanisms for Regulating Off-Label Uses of Drugs and Devices (with Ryan Abbott), 64 DUKE L. J. 377 (2014)• Effect of Perineal Self-Acupressure on Constipation: The PSAC Randomized, Controlled Trial (with Ryan Abbott, Ed Hui & Ka-Kit Hui), J. GEN. INTERNAL MED. (Nov. 2014)• When Whites Get a Free Pass: Research Shows White Privilege is Real, N.Y. TIMES, Feb. 24, 2015• Ending Excessive Police Force Starts with New Rules of Engagement, WASH. POST, Dec. 25, 2014 (with Daniel Markovits)• Obama, the Least Lame President?, N.Y. TIMES, Dec. 22, 2014 (with John Fabian Witt)Other Professional Highlights• Amicus curiae brief in Texas Department of Housing and Community Development, et al. v. The Inclusive Communities Project, Inc., Supreme Court No. 13-1731Jack M. BalkinLectures And Addresses• Keynote Address: “The Causes of Political Dysfunction,” Conference on “Is it Time to Rewrite the Constitution?,” University of Wisconsin, Madison, Nov