["https://law.yale.edu/study-law-yale/degree-programs/graduate-programs"]
title = "Graduate Programs | Yale Law School"
description = "Yale Law School’s graduate programs are truly global — both in the breadth of resources available through Yale Law School and in the composition of our student body. Students enjoy small class sizes and the camaraderie of graduate and J.D. students, the intimacy of a small program, and a close relationship with the Yale Law School faculty.The Law School admits a limited number of graduate students each year to pursue studies in law beyond the first professional degree."
full_description = "Yale Law School’s graduate programs are truly global — both in the breadth of resources available through Yale Law School and in the composition of our student body. Students enjoy small class sizes and the camaraderie of graduate and J.D. students, the intimacy of a small program, and a close relationship with the Yale Law School faculty.The Law School admits a limited number of graduate students each year to pursue studies in law beyond the first professional degree. Graduate DegreesThe Master of Laws (LL.M.) program encompasses one year of full-time study. Admission is generally open only to those committed to a career in teaching law.The Doctor of the Science of Law (J.S.D.) program is a select doctoral program open only to graduates of the LL.M. program at Yale Law School.The Master of Studies in Law (M.S.L.) program is for a small number of non-lawyers who wish to obtain a basic familiarity with legal thought and to explore how law relates to their discipline. It is a one-year terminal program designed for those who do not desire a professional law degree. Admission is generally open only to doctoral degree holders and doctoral candidates in fields other than law, or working journalists (with at least a bachelor's degree).The Ph.D. in Law is a doctoral program offered in conjunction with Yale University's Graduate School of Arts and Sciences. It is designed to prepare J.D. graduates for careers as legal scholars and teachers through coursework and the production of a substantial body of original academic research and writing. The program is only open to students who have already earned a J.D. from an accredited U.S. law school. Other ProgramsLearn more about:Visiting Researcher Program Joint Degree Programs Omar Yousef Shehabi LLM A student perspective on the LLM program, international law, and law teaching at Yale Law School. Thomas Kadri PhD A student perspective on the Ph.D. in Law program and his research on tort liability. Fernando Loayza Jordán LLM A student perspective on the LLM program and studying tax law at Yale Law School."
year_published = 2025
