["https://law.yale.edu/admissions/jd-admissions/transfer-visiting-applicants"]
title = "Transfer & Visiting Applicants | Yale Law School"
full_description = "Transfer Applicants Yale Law School welcomes applications for transfer admission for students currently enrolled in the first year of law school. An undergraduate degree and an outstanding record at an accredited law school are prerequisites. Transfer applications will be considered only between the applicant's first and second years of law school, as incoming transfer students must complete two years of work at Yale Law School. The transfer application for the Class of 2027 will be available through the Law School Admission Council (LSAC) in May 2025. The Law School requires applicants to submit their applications through the LSAC electronic application service included as part of a Law School Credential Assembly Service (CAS) subscription. Transfer applications must be accompanied by a non-refundable $85 application fee. If you would like to request a need-based fee waiver of your Yale Law School application fee, you may request one by filling out this brief form. Need-based fee waivers are generously granted, and parental information is not requested as part of the fee waiver application. Additionally, we will automatically waive our transfer application fee for individuals who were offered a place on our waitlist in a prior admission cycle."
