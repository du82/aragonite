["https://law.yale.edu/admissions-financial-aid/jd-admissions/connect-us"]
title = "Connect with Us | Yale Law School"
full_description = "Lillian Goldman Law Library There are many great ways to connect with the YLS Admissions Office! Fill out our Inquiry Form and join our mailing list, so we can keep in touch with you about the Law School and our admissions process. You can also request a need-based fee waiver and learn more about YLS by visiting Yale Law School by the Numbers. To learn more about YLS and the admissions process, sign up to attend an upcoming recruiting event—including small 'office hour' sessions with the admissions deans—or schedule a phone appointment to speak with an admissions representative. We invite you to learn more about the student experience at YLS by asking a question of our current students. And of course, you can listen to Dean Ingber’s podcast, Navigating Law School Admissions with Miriam & Kristi, which is an excellent resource for prospective law school applicants. When I came to law school, I never imagined that I would be an advocate and decision-maker as early as my second semester of law school. The clinical program at YLS empowers students to experience lawyering outside of the classroom by interacting with clients and making decisions. Michelle Fraling|Class of 2023"
