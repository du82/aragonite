["https://law.yale.edu/admissions-financial-aid/jd-admissions/yale-law-school-numbers"]
title = "Yale Law School by the Numbers | Yale Law School"
full_description = 'The Criminal Justice Clinic has given me the unique opportunity to represent a client in court as a first-year law student. Experiential learning has been the most meaningful part of law school so far, and it has exposed me to the criminal justice system first-hand. Destiny Lopez|Class of 2021 Home Admissions & Financial Aid JD Admissions Yale Law School by the Numbers Yale Law School offers an unmatched intellectual environment with numerous opportunities for students to immerse themselves in the law and make a positive impact on society. Our innovative curriculum trains future lawyers and leaders to tackle the biggest challenges of our time. As you consider which law school best fits your goals, we invite you to review this webpage, which highlights information about our impressive student body, world-renowned faculty, academic and extracurricular experiences, wide variety of career paths available to graduates, extensive clinics and programs, excellent financial aid and support, and remarkable alumni community.No set of metrics could ever fully capture our exceptional academic community, but we are committed to providing detailed, transparent information so you can make an informed decision about the right law school for you. We believe this data showcases what sets Yale Law School apart as a leader in legal education.For a deeper look into life at Yale Law School and the New Haven region, here are a few ways to further explore everything Yale Law School has to offer:Browse the website and follow us on social media.Take a virtual tour or in-person tour of the campus.Listen to the Inside Yale Law School podcast with Dean Heather K. Gerken and the Navigating Law School Admissions podcast.Watch and read profiles of students and alumni speaking about their Law School experience.Connect with our Admissions team.American Bar Association All law schools, including Yale Law School, submit information to the American Bar Association, which creates a Standard 509 Information Report for every school annually with information on curricular offerings, financial aid, enrollment, tuition, faculty, and admissions. To view reports by school and year, visit the ABA website. Additional Consumer Information is available here. Topics Covered J.D. AdmissionsGraduate ProgramsFinancial Aid & Hurst Horizon ScholarshipsAcademicsFaculty Career OutcomesThe Student Experience & Life in New HavenThe Law LibraryAlumni EngagementThe Tsai Leadership Program J.D. Admissions Yale Law School students are academically excellent, contribute meaningfully to their communities, and are diverse in many ways. The information below provides only a small window into the Class of 2027. Another important source for class statistics is the ABA 509 report. However, please note that the ABA defines certain terms differently than Yale Law School. We have included our definitions below. Admissions & Academic Stats4,449 applicants204 J.D. students matriculated (this includes students who were admitted in a prior admissions cycle and deferred admission to the fall of 2024)86% yield on new offers (unlike the ABA 509 report, this includes students who accepted their offer and deferred to a future class) Median GPA: 3.96 (range: 3.22 to 4.27)Median LSAT: 174 (range: 155 to 180)Median GRE: Verbal Reasoning – 167; Quantitative Reasoning – 163; Analytical Writing – 5.5 (includes 24 students)24% first generation college students (first generation of their immediate families to graduate from a four-year college, university, or its equivalent) and/or low income34% first generation professionals (first generation of their immediate families to attend any graduate or professional school program)19 veterans and service members (9% of the class) 56% women50% students of color22% LGBTQ+Students representing 86 undergraduate institutions Fun Facts Outside the NumbersThis year’s class includes an attendee of Le Cordon Bleu, the holder of multiple patents for fighting cyberbullying, and an election analytics expert! Learn more about our remarkable 1L class and the admissions process at Yale Law School. Incoming class profile J.D. admissions Graduate Programs Each year, the Law School admits a small number of graduate students from around the world to pursue studies in law beyond the first professional degree. Students enjoy the camaraderie of their fellow J.D. and graduate law students, the intimacy of a small program, and close relationships with the Yale Law School faculty. During the 2024–2025 academic year, the Law School welcomed 1 Ph.D. student, 26 LL.M. students, 8 J.S.D. students, and 2 M.S.L. students. Graduate students hail from 25 different countries and 6 continents and their interests range from cyber law to constitutional law to language rights to election law to environmental and international law. Financial Aid & Hurst Horizon Scholarship Yale Law School’s Financial Aid Office awards scholarships based on financial need and individual circumstances, and Yale Law is one of only two law schools in the country to award aid based on need alone. For a full breakdown of the cost of attendance, visit the Financial Aid website.In 2022–2023, Yale Law School launched the Hurst Horizon Scholarship Program, which provides full-tuition scholarships to every student whose family income falls below the federal poverty line. In 2023–2024, the program expanded to include students whose family income falls below 200% of the federal poverty line. In 2024–2025, 89 students are receiving full-tuition Hurst Horizon Scholarships.The Hurst Horizons Scholarship Program bolsters our exceptional financial-aid program. In 2023–2024:71% of the student body received need-based financial aid, which includes both loans and scholarships.62% of the student body received a scholarship as part of their financial aid award. The average scholarship awarded to J.D. students was ~$38K.Students from the Class of 2023 graduated with an average loan amount of ~$143K.Each year, dozens of students are awarded funding from the Safety Net Fund to cover unexpected emergencies, including expenses related to medical and dental care, childcare, stolen property, and emergency travel. “Entering law school, I grappled with the choice between going into the private sector and helping my family financially or going into the public sector and helping families like mine through policy change. This program has eliminated the distinction between these two choices.”— Alphonse Simon ’24 on the Hurst Horizon Scholarship Program Read more Additional Financial SupportYale Law School’s financial support isn’t limited to financial aid. We also provide robust support for students doing public-interest work over the summer and after graduation, fund students’ academic work, and offer a loan-forgiveness program that supports students in a broad range of careers. Through the Summer Public Interest Fellowship (SPIF) program and the Schell Center’s Kirby Simon Summer Fellowship Program, 192 students were awarded funding for 2022 summer internships in the U.S. and abroad. We proudly offer significantly more post-graduate public interest fellowships per student than any other law school in the country, enabling an average of 34 graduates each year to work for the public-interest organization of their choice on our dime. Learn more in the Careers section below.We also provide generous financial support for students’ academic research, travel, and conference participation. Career Options Assistance ProgramThe Career Options Assistance Program (COAP), Yale Law School’s loan repayment program, provides generous assistance with educational loan repayment for graduates who choose lower paying positions. COAP has many key features, including significant flexibility. What makes COAP most distinctive is that, unlike our peers’ loan-forgiveness programs, it supports graduates taking low-paying jobs across sectors and is not confined to a particular type of public interest work.Since its inception, more than 2,000 Yale Law School graduates have participated in COAP and received more than $58 million in benefits. In 2021:Despite the federal government’s pause on loan repayment, which decreased the number of participants, ~370 graduates participated in COAP and ~$5 million was awarded to pay back graduates’ loans.Graduates worked at a wide array of organizations, including:Law schools and universities in the U.S. and abroadNonprofits and NGOsSmall law firmsChurches and religious organizationsMedia organizationsGovernmentIGOs and humanitarian organizationsSelf-employedKey Resources2024–2025 J.D. Financial Aid HandbookCost of AttendanceHow Need-Based Aid WorksInformation for Prospective & Admitted StudentsInformation for Current Students Academics With hundreds of courses taught by world-renowned faculty and a thriving network of legal clinics and intellectual centers, Yale Law School provides many ways for students to gain the knowledge and skills necessary to make an impact on the world at large. Yale Law School boasts a remarkable faculty–student ratio and invites a wide range of scholars and practitioners to teach in New Haven. Read more about Studying Law at Yale.192 courses offered last year153 courses with under 25 peopleOnly 3 classes with more than 100 students5:1 student ratioMore than 30 clinics and dozens of centers, programs, and workshopsUnparalleled Freedom & FlexibilityStudents enjoy far more freedom at YLS to choose their classes than they do at peer schools. For the majority of our peers, 1Ls must take required courses for most of their first year. At Yale, students are able to select their courses as soon as they reach their second semester. Yale Law School is also unusual in that students can enroll in a clinic during the second semester of their first year. Yale Law School’s strong student–faculty ratio creates truly unparalleled learning experiences, including: The 1L Small GroupDuring their first semester, students are assigned to a “small group” of 16–18 people for one of their four classes and take all of their first semester classes together. This cohort is a formative experience that helps students develop community bonds with their peers and strong connections to faculty. Numerous opportunities to serve as research or teaching assistantsIn the 2021–2022 academic year, there were ~350 research assistant opportunities and ~50 first-term teaching assistant opportunities. The chance to do serious intellectual work with faculty in your chosen fieldStudents have the opportunity to work with faculty on two major writing projects before they graduate: a substantial paper and a supervised analytic writing (SAW). Read more about academic collaborations between faculty and students. "After my 1L fall term, I get to choose all of my own classes. And being able to join a clinic this spring and start helping people right away — it’s just incredible.”— Margo Darragh ’25 Read more GradingYale Law School fosters an environment of collaboration rather than competition. All first-term courses are graded on a credit/fail basis. After that, classes are graded on an honors / pass / low pass / fail basis with the option to take certain classes credit / fail.Clinics Our clinics are known for doing extraordinarily ambitious and wide-ranging work. In addition to serving individuals within the community, Yale Law School’s clinics have won three nationwide injunctions in the last few years, and their work regularly makes national headlines. Yale Law School’s clinical program is unique in that many academic faculty teach clinics as part of their regular teaching commitments. More than 30 clinics with a variety of topics and areas of focus including criminal law, health law, entrepreneurship, and many more.Unlike most other schools, students can begin taking clinics — and appearing in court — during the spring of their first year and can remain in that clinic for a full 5 semesters.Nearly 90% of our students take advantage of this unique opportunity to combine theory with practice; many students take more than one clinic.Centers & ProgramsThe intellectual life at Yale Law School is enriched by dozens of centers, programs, and workshops that serve as hubs for critical scholarly work and make a difference in communities in New Haven, around the country, and globally. This work cuts across many disciplines, giving students abundant opportunities to engage with their interests outside of the classroom. View the full list. “The faculty here don’t just teach you the rigid rules of the law. They really push your thinking in terms of understanding why the law exists in its current form, what effects the law has on the broader society, and they also push you to creatively think through how you can change the law for the better.”— Henock Dory ’24 Read more Faculty The Yale Law School faculty is as broad ranging in its interests and expertise as it is distinguished. It includes prominent scholars of economics, philosophy, sociology, and history, as well as leading specialists in many areas of law. The scholarship of our faculty elevates innovative ideas, serves as foundational texts in a variety of scholarly fields, and engages with some of the most urgent questions facing the world today. Learn more about faculty activities and scholarship or read the latest clips in the press.70 tenure and tenure-track faculty 150+ visiting and non-full-time faculty who teach a diverse array of courses every yearMany faculty members direct centers and programs, supervise clinics, and run engaging workshops that enhance the intellectual life of the School.One of the most influential law faculties in the country in terms of scholarly impact and citations Our faculty includes former prosecutors, public defenders, State Department officials, and Supreme Court advocates, and are frequently recognized with prestigious awards for their scholarship and service. “At Yale Law School, we think hard about law, with freedom to challenge basic assumptions embedded within our legal institutions and to construct new frameworks. The best thing about teaching here is getting to do that alongside such inspiring students, unparalleled in intellectual depth, breadth of experience, flexibility, and humaneness.”— Monica Bell ’09, Professor of Law Read more Career Outcomes Yale Law School graduates pursue a range of diverse career paths that make an impact across every sector of society. We train lawyers’ lawyers and lawyers writ large. Our graduates are entrepreneurs, nonprofit founders, litigators, CEOs, and public servants. They are Cabinet officials and city council members; environmentalists and inventors; Hollywood agents and U.S. attorneys; poets and coders. Read more about our alumni leaders. The Career Development Office (CDO) provides support and resources to students as they navigate career choices, including one-on-one counseling, career education and job search programming, and interview '
