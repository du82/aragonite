full_description = "Services to Help Students Thrive Yale Law School and Yale University provide a range of services to help our students thrive during their years in school. After all, even in law school, life continues outside the classroom. Explore the range of services available. Visit the Office of Student Affairs page for more information. View the OSA Staff page to get in touch with us.We are available by phone at 203-432-7979 and email osa@yale.edu Monday-Friday, 9:00 a.m. to 5:00 p.m. Upcoming Events Mar 7 Health & Wellness Yoga with Soul Sweat 1:30PM - 2:30PM Health & Wellness Yoga with Soul Sweat Mar 10 Table Talks with OSA: Grow and Gather 12:10PM - 1:00PM Table Talks with OSA: Grow and Gather Mar 11 Coffee Connections 12:00PM - 1:30PM Coffee Connections Mar 27 YLS Trivia Night 5:30PM - 7:00PM YLS Trivia Night Apr 4 Health & Wellness Yoga with Soul Sweat 1:30PM - 2:30PM Health & Wellness Yoga with Soul Sweat Apr 10 JD Class of 2025 Photo 6:00PM - 7:30PM JD Class of 2025 Photo Apr 14 Student Community Lunch Series 12:00PM - 1:00PM Student Community Lunch Series Between my colleagues and students, showing up for work means that I will have my premises challenged, my ideas tested, and my creativity spurred three times before I finish my morning coffee. David Schleicher|Professor of Law"
