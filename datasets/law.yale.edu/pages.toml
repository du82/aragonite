title = "Current Students | Yale Law School"
full_description = "Current Students: Applying For Financial Aid At Yale Law School, the financial aid process is personal. We recognize that traditional financial aid applications and forms only tell part of our students’ stories. Thus, we encourage students to meet with a financial aid staff member to discuss any financial circumstances not reflected on their applications and to share financial challenges or changes that occur throughout their enrollment. Our small class size allows us to work with students individually and to provide confidential one-on-one counseling to everyone who requests it. For more details on JD financial aid policies and procedures, please refer to the 2024-2025 JD Financial Aid Handbook.TO UPLOAD REQUIRED FINANCIAL AID DOCUMENTS, PLEASE CLICK HERE."
