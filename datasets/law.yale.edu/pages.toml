["https://law.yale.edu/centers-workshops/oscar-m-ruebhausen-fund"]
title = "The Oscar M. Ruebhausen Fund | Yale Law School"
full_description = "About the Fund The Oscar M. Ruebhausen Fund at Yale Law School provides an extraordinary opportunity for students and faculty to undertake innovative projects, research, conferences, publications and programs that foster intellectual vitality, creativity and analytical rigor at the Law School.Established in 2005 as part of a $30 million gift from the estate of Oscar M. Ruebhausen ’37, one of the largest gifts in the history of American legal education, the Oscar M. Ruebhausen Fund supports projects and programs proposed by students and faculty. Its purpose is to provide not general support but rather incremental benefits to the Law School for specific objectives. The Fund seeks to enhance the intellectual life of the Law School, particularly through support of collaborative work and interdisciplinary research. It also seeks to further the School’s leadership in developing innovative responses to changing societal needs and opportunities and in acting as a voice of reason, fairness and decency.The Oscar M. Ruebhausen Fund Committee meets twice a semester during the academic year and accepts proposals on a rolling basis."
