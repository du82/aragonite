["https://law.yale.edu/admissions/cost-financial-aid/how-need-based-aid-works"]
title = "How Need-Based Aid Works | Yale Law School"
full_description = "How We Determine Your Financial Aid We believe that administering our financial aid based on need alone is critical to ensuring that all students who are admitted to Yale will have the ability to enroll regardless of any financial limitations they may have at the outset. Need-based aid allows us to direct our institutional resources to the students who truly require and will benefit most from them, and it helps maintain socio-economic diversity at the Law School. By applying the same pre-set principles to all students, we are able to bring transparency and consistency to our financial aid process. These concepts of equity, fairness, and universal access – which underlie need-based aid – reflect the values of the Yale Law School community. We deliver aid through a process that meets the criteria of federal regulations and institutional policies while serving the needs of students in a fair and equitable manner. Please refer to the 2024-2025 JD Financial Aid Handbook for more details.As stated in our 2024-2025 JD Financial Aid Handbook, we expect students to provide the Financial Aid Office with accurate information about their financial situation and notify us of any significant changes whenever they occur; meet the deadlines and submit all requirements and reporting responsibilities promptly and carefully; and, if requested submit additional documentation for the purposes of reconciling discrepancies, providing clarification of application data, or if selected for federal or institutional verification purposes. In addition, federal regulations require that the University report any information that indicates that an applicant may have engaged in fraud or other criminal misconduct in connection with his or her federal loan application. The information will be reported to the Inspector General of the U.S. Department of Education or other law enforcement officials. Please note: For non-U.S. Citizens, the information on the Student visa form and the financial aid application must correspond. If the information varies, it must be corrected or it will be reported to the Office of International Students and Scholars.Example of Award Packaging ParametersYLS determines financial need and offers aid to meet that need based on the following two-part calculation:Cost of Attendance1(i.e. Budget)minus contribution (student + parent+ spouse)2= student's amount of financial needNeed is then filled with a set amount of unit loan funds and then by a Yale Law School Institutional ScholarshipStudent's amount of financial needminus unit loans3 (based on class year)= YLS Institutional scholarships award1 Includes tuition, fees, health insurance, and an allotment for living expenses2 Combination of student assets, income, and, if applicable, spouse and parent resources3 Unit loan amounts are established annually and vary by class yearAward Packaging ParametersAcademic year financial aid consists of need-based grants and loans. The primary goal of our financial aid program is to ensure that all admitted students can afford to attend Yale Law School regardless of their financial resources. We determine the financial aid offers based on a budget of tuition and fees plus allowances for living expenses, books, and travel.The process of applying for financial aid differs for both new admit students and continuing students, as well as for those students only seeking loan support versus those seeking a full financial aid package of both loans and scholarships.Financial Aid SupportUsing a combination of loans and grants/scholarships, we make every effort to provide students with the difference between their resources (such as family resources, summer earnings, and student savings) and the cost of attending Yale Law School.For the 2023-2024 academic year, 71% of our J.D. student body received some form of financial aid, and 62% qualified for Law School institutional scholarships. For students on scholarship the median amount is approximately $37,964, and 80% receive approximately $20,000 or more. In total, Yale Law School disbursed $14 million in institutional support to its J.D. candidates."
year_published = 2025
