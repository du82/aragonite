["https://law.yale.edu/admissions-financial-aid/financial-aid/hurst-horizon-scholarship-program"]
title = "Hurst Horizon Scholarship Program | Yale Law School"
full_description = "Yale Law School awards full-tuition scholarships to eligible J.D. students with significant financial need through the Soledad ’92 and Robert Hurst Horizon Scholarship Program. The Hurst Horizon Scholarship Program builds upon the Law School’s robust financial aid offerings by providing substantial additional support to the students who need it most. These scholarships will ensure that J.D. students with the highest need can fully immerse themselves in the rich academic experience and benefit from the resources and opportunities that Yale Law School has to offer. Hurst Horizon Scholarships will be awarded to students whose family income is up to 200% of the federal poverty guidelines and whose assets are below $150,000. Students who meet the financial requirements will automatically receive a scholarship that will fully cover the cost of tuition, fees, and health insurance.Please read our FAQs below for more information about the Hurst Horizon Scholarships or contact the Yale Law School Financial Aid Office. For more details on J.D. financial aid policies and procedures, please refer to the 2024–2025 J.D Financial Aid Handbook."
