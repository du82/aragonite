["https://law.yale.edu/info/alumni/alumni-glance/alumni-faqs"]
title = "Alumni FAQs | Yale Law School"
full_description = '''About Alumni Engagement Where is the Alumni Engagement & Development Office located? Alumni Engagement & Development is now located in the Connecticut Financial Center, which is located at 157 Church Street on the New Haven Green. The office is located on the 12th floor and is generally open on weekdays from 8:30 am - 5:00 pm. If I have a question not listed here, how can I find an answer? Please contact the Alumni Engagement & Development Office. What is the demographic composition of Yale Law School's alumni community? You can find more information about alumni demographics here. Stay Connected How do I update my address? Your contact information can be updated quickly and easily online. How can I contact with classmates? In September 2019, Yale Law School launched The Courtyard, an online engagement community and alumni directory. The platform provides new ways for YLS alumni and students to connect and foster the ties first established in the courtyard at 127 Wall Street and throughout the Law School community. Learn more about The Courtyard. If you need assistance, please email thecourtyard.law@yale.edu.Additionally, you can also use the Yale University Online Alumni Directory to search for classmates. If you have not done so already, you will need to register as a member. If you need assistance accessing or navigating the Online Alumni Directory, send an email to the Yale Alumni Association at yaa@yale.edu and someone will reach out to you shortly. How can I submit my class notes for the Yale Law Report? Class notes can be sent to your Class Secretary. Click here for your secretary's contact information. How can I sign up to receive the Yale Law Report? The Yale Law Report is mailed twice a year to all Yale Law School alumni who have not “opted out” of mailings. If you do not currently receive the Law Report, we may have an outdated address on file for you. To submit a current address, go to the Update Your Contact Information page and fill in your new information. If you would like to change your mailing status from “opt out,” please contact Alumni Engagement at (203) 432-1690 or alumni.law@yale.edu. How can I sign up to receive YLS Alumni e-Newsletters? The YLS e-Newsletter is sent several times a year to all Yale Law School alumni who have not “opted out” of emails. If you do not currently receive the e-Newsletter, we may have an outdated email address on file for you. To submit a current email address, go to the Update Your Contact Information page and fill in your new information. If you would like to change your email status from “opt out,” please contact Alumni Engagement at (203) 432-1690 or alumni.law@yale.edu. Alumni Events When is my next class reunion? Please read plans for Alumni Weekend 2024 here. Are there any YLS events going on in my area? We have regional associations all around the U.S. and abroad. View upcoming events by region. Learn more about regional associations. How do I sign up to receive alumni event invitations? Invitations for regional and class-specific Yale Law School alumni events are sent to all YLS alumni who have not “opted out” of receiving mail and/or email correspondence. If you do not currently receive regional event invitations, we may have an outdated email and/or mailing address on file for you. To submit your current addresses, go to the Update Your Contact Information page and fill in your new information. If you would like to change your mailing status from “opt out,” please contact the Alumni Affairs Office at (203) 432-1690 or alumni.law@yale.edu. Alumni Services Does YLS offer M/CLE credit to alumni? Yale Law School is an accredited CLE provider for New York. Some of our New York City, Washington, DC, and California events offer M/CLE credit to attendees; if M/CLE is going to be offered for an event, it is described in the invitation. As a YLS graduate, do I have access to the YLS library? Alumni visitors to the law school are welcome to make use of the law library. Please contact our visiting page, or contact us for more information. How do I get an alumni email address? You can learn more about YaleMail, permanent email for alumni, here. How can I become affiliated with another class? You may affiliate with a class other than the one in which you graduated. In this situation, we add an affiliated ("social") class year to your records so that you receive relevant class invitations and notifications. Send an email to alumni.law@yale.edu with your request, or call the Alumni Engagement Office at (203) 432-1690 and a staff member will be able to help you. Career Services Does the Career Development Office (CDO) offer services to YLS alumni? Yes. The Career Development Office offers a number of services for alumni. In addition, active members of The Courtyard community are ready to serve as a resource for other alumni and students to discuss their career choices, industry expertise, or provide networking and mentoring opportunities. How can I sign up to get involved with students or student organizations, such as the Federalist Society or the American Constitution Society? You can become a member of The Courtyard. Students are able to search The Courtyard community when they are seeking alumni mentors. Can I join The Courtyard AND the Yale University Career Network? Yes. YLS graduates can choose to join either or both of these networks. YLS graduates interested in assisting members of the YLS community should join The Courtyard. YLS graduates may also work with members of the larger Yale University Community through the Yale Career Network. Giving to YLS How can I make a gift to the Law School? You can find information on how to give to Yale Law School at the Giving to Yale Law School page. Resources How do I request a transcript? Alumni needing copies of their transcript should contact the YLS Registrar’s Office. The phone number is (203) 432-1678. How do I request a duplicate diploma? Alumni needing copies of their diploma should contact the Diploma Office. How do I request a certification of graduation form? Alumni needing a certification of graduation form should contact the YLS Registrar’s Office. The phone number is (203) 432-1678. Where can I get YLS graduation robes? Yale contracts its regalia through Oak Hall Cap & Gown. The phone number is (800) 223-0429. More information can be found here: https://commencement.yale.edu/cap-gown.Alumni attending commencement at another university should note that, when notified ahead of time, the hosting university often arranges to rent hoods for members of the faculty and the university's Board of Trustees. Where can I buy YLS merchandise and apparel? You may purchase officially licensed YLS merchandise from Campus Customs.'''
year_published = 2025
clearnet = "https://law.yale.edu/info/alumni/alumni-glance/alumni-faqs"
