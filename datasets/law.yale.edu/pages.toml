["https://law.yale.edu/leadership/our-community/faculty-staff"]
title = "Faculty and Staff | Yale Law School"
full_description = "The Tsai Leadership Program is led by a dedicated team of Yale Law School faculty and staff with an impressive range of expertise across a variety of subject areas and professional experiences. To reach a member of the program, please direct inquiries to YLS.leadership@yale.edu. Faculty Directors John Morley ’06Faculty DirectorMichael S. and Alexa B. Chae Initiative in Private Sector LeadershipJohn Morley is Augustus E. Lines Professor of Testamentary Law at Yale Law School and a leading expert on the regulation and structure of investment funds, including mutual funds, private equity funds, and hedge funds. His research on investment funds is one application of a broader interest in the law and economics of organization. Morley’s other research on organization includes a study of why law firms collapse and a history of the common law trust as a substitute for the corporate form. He also writes about the law of trusts and estates and serves as the reporter for the Uniform Directed Trust Act. At Yale Law School, Morley has taught classes on business organizations, securities regulation, trusts and estates, and investment management regulation. Prior to joining the Yale Law School faculty, Morley was a member of the faculty at the University of Virginia School of Law and the Executive Director of the Center for the Study of Corporate Law at Yale Law School. He received undergraduate degrees in political science and economics from the University of Utah and his law degree from Yale Law School. Cristina Rodríguez ’00Faculty DirectorCarol and Gene Ludwig Program in Public Sector LeadershipCristina Rodríguez is the Leighton Homer Surbeck Professor of Law at Yale Law School. Her fields of research include constitutional law and theory, immigration law and policy, administrative law and process, and citizenship theory. In recent years, her work has focused on constitutional structures and institutional design. Her latest book, The President and Immigration Law (Oxford University Press, September 2020), co-authored with Adam Cox, explores the long history of presidential control over immigration policy and its implications for the future of immigration law and the presidency itself. Rodríguez joined Yale Law School in 2013 after serving for two years as Deputy Assistant Attorney General in the Office of Legal Counsel at the U.S. Department of Justice. She was on the faculty at the New York University School of Law from 2004–2012 and has been a Visiting Professor of Law at Stanford, Harvard, and Columbia Law Schools. She is a non-resident fellow at the Migration Policy Institute in Washington, D.C., a member of the American Law Institute, and a past member of the Council on Foreign Relations. In 2020, she was elected to the American Academy of Arts and Sciences. She earned her B.A. and J.D. degrees from Yale and attended Oxford University as a Rhodes Scholar, where she received a Master of Letters in Modern History. Following law school, Rodríguez clerked for Judge David S. Tatel of the U.S. Court of Appeals for the D.C. Circuit and Justice Sandra Day O’Connor of the U.S. Supreme Court. Jacob S. Hacker ’00 Ph.D.Faculty DirectorCarol and Gene Ludwig Program in Public Sector LeadershipJacob S. Hacker is Stanley Resor Professor of Political Science at Yale University. A regular policy advisor and expert commentator, he is the author or co-author of six books, numerous journal articles, and a wide range of popular writings on American politics and public policy. His latest book, written with Paul Pierson, is Let Them Eat Tweets: How the Right Rules in an Age of Extreme Inequality. Previously, the two wrote American Amnesia: How the War on Government Led Us to Forget What Made America Prosper—a New York Times Book Review Editor’s Choice and a best business book of 2016 according to Strategy+Business. Their 2010 bestseller Winner-Take-All Politics: How Washington Made the Rich Richer and Turned Its Back on the Middle Class recast the debate over U.S. economic inequality, showing how the rise of the super rich in the United States is closely linked to American politics and policy. In addition, Professor Hacker is the author of a prize-winning book on health care reform (The Road to Nowhere), a widely cited study of America’s public-private framework of social benefits (The Divided Welfare State), and a prescient popular-audience book on American insecurity (The Great Risk Shift), first published in 2006 and expanded, revised, and reissued in 2019. Professor Hacker is also known for his research and writings regarding health policy, especially his development of the so-called public option. A member of the American Academy of Arts and Sciences, his recent honors include election to the American Academy of Political and Social Science as the 2021 Robert A. Dahl Fellow and the 2020 Robert Ball Award of the National Academy of Social Insurance. Senior Distinguished Fellow in Residence Luke Bronin ’06Visiting Lecturer in Law and Tsai Leadership Senior Distinguished Fellow in Residence Luke Bronin is a Visiting Lecturer in Law and Tsai Leadership Senior Distinguished Fellow in Residence at Yale Law School and most recently served two terms as Mayor of Hartford, Connecticut. Bronin, who took office in 2016 and was re-elected in 2019, led Hartford through the most severe fiscal crisis in the city’s history and the COVID-19 pandemic. Among other achievements, his administration restored fiscal stability and attracted significant economic development investment. His administration focused on building opportunity for Hartford residents through numerous initiates, including the establishment of the Hartford Youth Service Corps and Reentry Welcome Center. From 2013 to 2015, Bronin was General Counsel to then-Governor of Connecticut Dannel P. Malloy. As the Governor's chief legal counsel, he was deeply involved in the development of law and policy addressing gun violence, criminal justice reform, homelessness, and environmental protection, as well as management of the judicial nominations process. He served in the Obama administration as Deputy Assistant Secretary for Terrorist Financing and Financial Crimes at the U.S. Department of the Treasury, where he was previously Senior Advisor to the Deputy Secretary. Bronin was an officer in the U.S. Navy Reserve, and served as a member of the military’s anti-corruption task force during his deployment to Afghanistan in 2010-2011. Bronin’s private sector experience includes serving as Partner at Hinckley Allen, a multi-service law firm, and at the Hartford Financial Services Group, Inc. Bronin received a B.A. from Yale College and an M.Sc. from the University of Oxford, where he was a Rhodes Scholar. He holds a J.D. from Yale Law School. Staff Mary J. L. HerringtonCo-Head, The Tsai Leadership ProgramExecutive Director, Michael S. and Alexa B. Chae Initiative in Private Sector Leadership Mary J. L. Herrington is Co-Head of The Tsai Leadership Program and the Executive Director of the Chae Initiative in Private Sector Leadership at Yale Law School. Prior to coming to Yale, Herrington was at Columbia Law School, where she managed its organizational leadership initiative with Columbia Business School, the JD/MBA careers program, and programs on legal practice areas, investment banking, management consulting, and investment management. A former corporate attorney at Paul, Weiss and Norton Rose Fulbright, she resided in London for nearly a decade, where she founded two media and event design and production companies. She is admitted to the New York Bar and is a member of the Asian American Bar Association of New York and the National Asian American Bar Association. Herrington earned her J.D. from the University of Pennsylvania Law School, her B.A. from Columbia University, and studied English Literature at Cambridge University. Margie AdlerCo-Head, The Tsai Leadership ProgramExecutive Director, Carol and Gene Ludwig Program in Public Sector Leadership Margie Adler is Co-Head of the Tsai Leadership Program and Executive Director of the Ludwig Program in Public Sector Leadership at Yale Law School. Margie graduated with a B.A. from Harvard University, completed the general course program at the London School of Economics and Political Science and earned a J.D. from Columbia Law School. She practiced law in New York at Cleary, Gottlieb where she worked on domestic and international financial transactions with a focus on securities regulation and corporate governance. Margie lived in London and Singapore, each for several years. Most recently, Margie served as Managing Director of Alumni Relations at the Yale School of Management, where she also served on the Council on Anti-Racism and Equity. She also serves as President of the ACLU of Connecticut."
