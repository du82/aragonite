full_description = 'Yale Law School IT will assist students with the purchase of technology, including computers and other accessories. This is processed through a one-time COAP eligible loan through Financial Aid, with no out of pocket costs to the student. Available to Students Standard FeaturesStudents may take a one-time COAP eligible loan through Financial Aid for up to $3000 toward the purchase of technology, including computers, monitors, or other accessoriesThrough ITS, students may opt to purchase any Apple computer or any computer available through GovConnection or Dell, requiring no money up front. Laptop will be purchased by ITS and resold to the student. Billing will be done through student’s bursar account and will be funded by the loan through Financial Aid.Special pricing is available on these computer models - please note that some models may take 3-4 weeks or longer to arrive:Lenovo T14 (G5 AMD Ryzen 5, 16 GB RAM, 512 GB SSD, 14" display, 4-year premier support plus warranty) - $1525.01Lenovo P14s (G5 AMD Ryzen 7 Pro, 32 GB RAM, 1TB SSD, 14" display, 4-year premier support plus warranty) - $1749.12Lenovo P14s Ultra (G5 Intel Ultra 7 vPro, 32 GB RAM, 1TB SSD, 14.5" display, 4-year premier support plus warranty) - $2153.60Lenovo Z13 (G2 AMD Ryzen 7 Pro, 32 GB RAM, 1TB SSD, 13" touch display, 4-year warranty including accidental damage protection, keep your drive) - $2027.88Lenovo X1 Carbon (G12 Intel Ultra 7, 32 GB RAM, 1TB SSD, 14" display, 4-year premier support plus warranty) - $2060.6713" MacBook Air (Apple M3 chip, 16GB RAM, 512 GB SSD, 4-year AppleCare+) (available in silver, space gray, midnight, or starlight) - $1742.1313" MacBook Air (Apple M3 chip, 16 GB RAM, 1 TB SSD, 4-year AppleCare+) (available in silver, space gray, midnight, or starlight) - $1933.4415" MacBook Air (Apple M3 chip, 16GB RAM, 512 GB SSD, 4-year AppleCare+) (available in silver, space gray, midnight, or starlight) - $1965.3515" MacBook Air (Apple M3 chip, 16 GB RAM, 1 TB SSD, 4-year AppleCare+) (available in silver, space gray, midnight, or starlight) - $2156.7814" MacBook Pro (Apple M3 chip, 16 GB RAM, 512 GB SSD, 4-year AppleCare+) - $2146.14 (available in Silver or Space Gray)14" MacBook Pro (Apple M3 chip, 16 GB RAM, 1 TB SSD, 4-year AppleCare+) - $2358.84 (available in Silver or Space Gray)14" MacBook Pro (Apple M3 Pro chip, 18GB RAM, 1TB SSD, 4-year AppleCare+) - $2677.89 (available in Silver or Space Black)16" MacBook Pro (Apple M3 chip, 36 GB RAM, 512 GB SSD, 4-year AppleCare+) - $3347.9016" MacBook Pro (Apple M3 chip, 36 GB RAM, 1 TB SSD, 4-year AppleCare+) - $3539.33List last updated 07.23.2024Please contact YLS IT for quotes on other configurations or models.User RequirementsMust be active YLS student.Using this ServiceComplete this form. Get This ServiceAvailable to all YLS studentsGet HelpContact YLS Information Technology ServicesPhone: 203-432-0821Email: law.help@yale.eduWalk in: L2 Monday - Friday 8:30AM - 4:30PMSubmit request online: helpdesk.law.yale.edu'
