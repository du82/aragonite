["https://law.yale.edu/giving/our-work-and-impact/ideas"]
title = "For Ideas | Yale Law School"
full_description = "Yale Law School is a world leader in legal education. What makes us unique? Our small classes, our brilliant students, our world-class faculty, our wide-ranging curriculum, and our engaged community all combine to create a vibrant intellectual environment. Our students luxuriate in ideas, they debate and disagree, and they forge lifelong relationships with classmates, professors, and alumni. Help us continue to enrich the Law School’s dynamic intellectual community as we lead the way in legal education. Please consider making a gift today. Alumni support for programs like Access to Law School and the Racial Justice Center makes sure that Yale students are able to serve the city that is our home. Your contributions help bring justice, opportunity, and power to the people of New Haven. James Forman Jr.|Class of 1992; J. Skelly Wright Professor of Law"
