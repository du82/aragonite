["https://law.yale.edu/clinics/our-clinics/civil-rights-advocacy-clinic"]
title = "Civil Rights Advocacy Clinic | Yale Law School"
full_description = "The magic of Yale Law School was not learning individual cases. It was giving you the tools to understand what was happening right now, situate it in history, and then feel confident that you could change the future.” Nabiha Syed ’10 Home Studying Law at Yale Clinical and Experiential Learning Our Clinics Civil Rights Advocacy Clinic About the Clinic The goal of the Civil Rights Advocacy Clinic is to encourage students to become independent thinkers able to engage multiple avenues of persuasion simultaneously to push for structural change in service of criminal justice reform and democratic function. The clinic provides a real-world laboratory for students to tackle pressing issues related to criminal justice and inequality using a coordinated and interdisciplinary array of advocacy tools including strategic litigation, administrative advocacy, coalition building, media, and communications.The clinic is directed by Clinical Lecturer in Law Avery Gilbert. Gilbert is also a Partner at Engage Strategies. She has 20 years of experience in strategic advocacy including state and federal policy advocacy as well as social justice and impact litigation. Gilbert previously worked at the Center for a Sustainable Advocacy, analyzing the savings impacts of President Clinton’s Climate Change Tax Incentives and as an associate at Boies, Schiller & Flexner, LLP, litigating complex commercial disputes involving a wide range of antitrust, contract, intellectual property, and tort claims. She has since built an impact litigation practice to reduce mass incarceration. Gilbert also worked with the United States Senate Judiciary Committee and with the New York State Attorney General’s Office, where she helped craft a multi-state greenhouse gas litigation strategy. Gilbert holds a J.D. from New York University School of Law and a B.A. from Skidmore College. Professor of Law Issa Kohler-Hausmann is the faculty sponsor of the clinic. Press & Media “Voices that weren’t heard on Election Day,” an op-ed in the Connecticut Post by clinic student Lauren Beccue ’23, who has been working on voting rights issues in Connecticut along with Kyle Bright ’23.Learn about the Fines and Fees Freedom Fund, a new organization built by Alejandra Uría ’23 and Liam Grace-Flood from the ground up through the clinic. Ways to Engage Our Clinics Yale Law School offers more than 30 clinics that provide students with hands-on, practical experience in the law on a diverse range of subject matters. Read More About Clinics Simulation Yale Law School offers a suite of innovative simulation courses based on real-world case studies. Learn about Simulation Courses Centers and Workshops Yale Law School enhances the intellectual life of its academic community by sponsoring a variety of centers, programs, and workshops, inspired by the interests of its faculty and students. Our Intellectual Centers The magic of Yale Law School was not learning individual cases. It was giving you the tools to understand what was happening right now, situate it in history, and then feel confident that you could change the future.” Nabiha Syed ’10"
year_published = 2025
