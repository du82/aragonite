full_description = "Who Uses COAP? From 1989 through 2022, more than 2,000 Yale Law School graduates have participated in COAP, receiving over $58 million in benefits.YLS alumni in COAP have recently worked for (among many others):The U.S. State DepartmentThe ACLUHuman Rights WatchPrivate firms in Washington, D.C., Jackson, Mississippi, and Seattle, WashingtonThe Texas Defender ServiceThe New York State Attorney GeneralThe NAACP Legal Defense FundNote: Deferred students should refer to COAP terms specific to the class year to which they were originally admitted. I’m very proud of how much this institution has done over our history. But there is always more work to be done. We always have our eye on what the curriculum should look like for the next 100 years.” Heather K. Gerken|Dean and Sol & Lillian Goldman Professor of Law"
