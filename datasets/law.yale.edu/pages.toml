title = "Clinical and Experiential Learning | Yale Law School"
full_description = "Teddy Ray ’24 A second-career student reflects on his YLS experience, including Complex Civil Litigation, and his hopes for afterward. Omar Yousef Shehabi LLM A student perspective on the LLM program, international law, and law teaching at Yale Law School. Henock Dory ’24 A student reflects on the diverse YLS community and his experience in BLSA and working on the Yale Law & Policy Review. Home Studying Law at Yale Clinical and Experiential Learning A Robust and Unique Clinical Program Yale Law School has one of the most robust clinical programs in the country. Unlike most other schools, students can begin taking clinics—and appearing in court—during the spring of their first year. Clinic students represent real clients with real legal problems (not in simulations or role-playing exercises), and are supervised by senior faculty members, with whom they often develop close and lasting mentoring relationships.Opportunities abound in the Jerome N. Frank Legal Services Organization—a single law firm that currently houses nine clinics, including the Samuel Jacobs Criminal Justice Clinic and the Ludwig Center for Community and Economic Development. In addition to the complete list of clinics and projects, a number of other centers and programs also offer experiential learning opportunities. Simulation courses are also offered in such areas as Appellate Advocacy, Corporate Crisis Management, and Negotiating and Drafting M&A Agreements. 30+ clinics 90% of students participate in clinics 24 centers 12 workshops Ways to Engage Our Clinics Yale Law School offers more than 30 clinics that provide students with hands-on, practical experience in the law on a diverse range of subject matters. Read More About Clinics Simulation Yale Law School offers a suite of innovative simulation courses based on real-world case studies. Learn about Simulation Courses Centers & Workshops Yale Law School enhances the intellectual life of its academic community by sponsoring a v