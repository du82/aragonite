title = """
LCC-Win: A free compiler system for Windows Operating Systems by
Jacob Navia"""
full_description = "Here you can download the lcc-win32 or the lcc-win64 C compiler system. The system is self contained: you do not need anything else to get started programming in C in the Win32 environment. You get All the binaries and the associated header files etc, are contained in an auto-installable executable that will create all the needed directory structure. This software is not freeware, it is copyrighted by Jacob Navia. It's free for non-commercial use, if you use it professionally you have to have to buy a licence. If you plan to use lcc-win in courses of programming in your University, contact us for special educational rates. Contact us if you want a special adopted compiler system or if you plan to use it as a back end for a language implementation. It is used in several backends for languages like Eiffel, SQL and others. Logiciels/informatique started in 1991. Our company specializes in compilers and compiler related research and development. We have developed the lcc-win32 compiler since 1995, distributing it worldwide. We customize the compiler to suit the needs of companies that need an embedded compiler, or a JIT (Just In Time compiler), or companies that want to generate C and implement some other language on top of it."
