full_description = "we are a london based community laptop orchestra, open to anyone who's interested in getting involved. no experience is required. only a laptop. whatsapp _______________________ christmas rehearsal - 17.12.2024 7pm - hackney '< :) _______________________ our last rehearsal was 12.11.2024 at the British Library Cafe! roles _______________________ developers you want to build tools for the others to use in performances (participation in concerts optional to preferance - some people just want to code!). _______________________ visuals you want to create and design reactive visuals to set performances to. _______________________ physicals you want to make physical sounds with your laptop, this can be using a microphone or simply the sound of you tapping. _______________________ controllers you want to play using software created for the performances. this involves learning and spending time with someone elses software."
