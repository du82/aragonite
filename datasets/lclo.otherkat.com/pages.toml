title = "manifesto"
full_description = "the london community laptop orchestra is a community run laptop orchestra for london folks to make sounds in a variety of unusual places. the lclo is a community orchestra where anyone can participate. our politics are explicit because they need to be. sound art spaces can be sexist, homophobic, racist and facist. we aim to be active in breaking those stereotypes. click me to go home! the london community laptop orchestra is a community run laptop orchestra for london folks to make sounds in a variety of unusual places. the lclo is a community orchestra where anyone can participate. our politics are explicit because they need to be. sound art spaces can be sexist, homophobic, racist and facist. we aim to be active in breaking those stereotypes."
