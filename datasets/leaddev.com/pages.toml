description = "Bernie Miles is a technology exec with over 20 years of experience in the e-commerce and fintech sectors. He has held leadership roles at prominent companies, including Expedia, Hotels.com, Klarna, and Wayfair. In December 2021, he was appointed CTO at PPRO, a global provider of local payments infrastructure. In this role, Bernie oversees a global […]"
full_description = "Bernie Miles Bernie Miles is a technology exec with over 20 years of experience in the e-commerce and fintech sectors. He has held leadership roles at prominent companies, including Expedia, Hotels.com, Klarna, and Wayfair. In December 2021, he was appointed CTO at PPRO, a global provider of local payments infrastructure. In this role, Bernie oversees a global engineering team across Munich, Berlin, London, São Paulo, Córdoba, Luxembourg and Singapore, focusing on scaling PPRO’s platform to support the company’s rapid growth trajectory. His extensive technology leadership and product development background has been instrumental in advancing cross-border payment technologies and fostering financial inclusion. Bernie also advises tech scale-ups, guiding investors, CTOs, CPOs, and founders. With experience in e-commerce, payments, re-platforming, and scaling teams, he offers expertise in navigating scaling tech whilst supporting global growth. From engineer to executive: Leading the shift and inspiring business-minded tech teams Explore the journey from engineering leader to CTO, with insights on bridging technology and business strategy, leading with influence, and fostering business-minded tech teams. Bernie Miles Video Share: More from Bernie Miles"
