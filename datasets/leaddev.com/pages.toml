title = "Bill Doerrfeld - LeadDev"
full_description = '''Bill Doerrfeld Bill is a tech journalist and thought leader specializing in state-of-the-art technologies in the enterprise IT space. Bill is a tech journalist and thought leader specializing in state-of-the-art technologies in the enterprise IT space. He is Editor in Chief for Nordic APIs, a knowledge center for API practitioners. He has also written for CIO.com, DevOps.com, Cloud Native Now, Acceleration Economy, and other publications. Through his work, he strives to tackle complex problems to advance the industry. He lives and works with his family in Portland, Maine. How AI generated code compounds technical debt “I don't think I have ever seen so much technical debt being created in such a short period of time" Bill Doerrfeld Carving out time for large-scale engineering chores Determine what to prioritize, set out a path, and be prepared for some hiccups along the way. Kent Wills Bill Doerrfeld Framing AI rollouts in the right light How can you introduce AI into teams in a way that doesn't invite unrest within your org? It starts with presenting it in the right light. Bill Doerrfeld How DX Core 4 aims to unify developer productivity frameworks Can it bring together DORA, SPACE, and DevEx, to help inform diverse stakeholders? Bill Doerrfeld Migrating to microservices at MACH-speed How to successfully lead a microservices migration. Bill Doerrfeld Cooking up a culture of continuous learning Continuous learning is an important part of building a collaborative culture. Bill Doerrfeld Motivating engineers with customer outcomes With Jack Tam, SVP and CTO at Intuit Mailchimp. Bill Doerrfeld Retaining engineering talent in a chaotic market With Bloomberg's global head of engineering, Adam Wolf. Bill Doerrfeld Be careful with ‘open source’ AI Open source AI models may be appealing for developers, but there are still plenty of complex risks to assess. Bill Doerrfeld The cost of the great developer tool consolidation Navigating a shrinking landscape. Bill Doerrfeld Encouraging a passion for productivity In this edition of DirectorPlus, Neha Batra, VP of Engineering at GitHub, explains how she creates a culture of productivity. Bill Doerrfeld Neha Batra Using AI to make a “sci-fi” developer experience The future of AI-assisted development is so greenfield it’s neon-green, says Dana Lawson, CTO at Netlify. Bill Doerrfeld WebAssembly is still waiting for its moment Can it break through? Bill Doerrfeld PostgreSQL: The database that quietly ate the world How the open source database slowly but surely infiltrated the enterprise as a go-to, developer-friendly choice. Bill Doerrfeld Share: More from Bill Doerrfeld twitter linkedin personal website'''
