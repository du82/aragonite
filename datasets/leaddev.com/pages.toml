full_description = '''About LeadDev About LeadDev Welcome to LeadDev. Engineering leaders have never been under more pressure to deliver results with fewer resources and tighter timelines. Optimizing software delivery is both a technical and social challenge. LeadDev explores all of the ways that you can improve the effectiveness of your software delivery ecosystem: your team, working methods, and technology. Established in 2015 as a global series of events, and expanded online in 2020, LeadDev.com now hosts thousands of free articles and videos that can help you improve your performance and that of your entire engineering org. Ways to get involved with LeadDev Register on LeadDev.com to get free access to all content Subscribe to a newsletter to receive weekly original articles from engineering leaders Attend a LeadDev in-person conference Attend a webinar Join or start a local LeadDev meetup Join the LeadDev Slack and contribute to the community Don’t miss out Get weekly engineering leadership content in your inbox. #gform_wrapper_44[data-form-index="0"].gform-theme,[data-parent-form="44_0"]{--gf-color-primary: #7864FF;--gf-color-primary-rgb: 120, 100, 255;--gf-color-primary-contrast: #fff;--gf-color-primary-contrast-rgb: 255, 255, 255;--gf-color-primary-darker: #4632CD;--gf-color-primary-lighter: #AA96FF;--gf-color-secondary: #fff;--gf-color-secondary-rgb: 255, 255, 255;--gf-color-secondary-contrast: #585e6a;--gf-color-secondary-contrast-rgb: 88, 94, 106;--gf-color-secondary-darker: #F5F5F5;--gf-color-secondary-lighter: #FFFFFF;--gf-color-out-ctrl-light: rgba(255, 255, 255, 0.1);--gf-color-out-ctrl-light-rgb: 255, 255, 255;--gf-color-out-ctrl-light-darker: rgba(194, 194, 209, 0.35);--gf-color-out-ctrl-light-lighter: #F5F5F5;--gf-color-out-ctrl-dark: #585e6a;--gf-color-out-ctrl-dark-rgb: 88, 94, 106;--gf-color-out-ctrl-dark-darker: #585e6a;--gf-color-out-ctrl-dark-lighter: rgba(88, 94, 106, 0.65);--gf-color-in-ctrl: #fff;--gf-color-in-ctrl-rgb: 255, 255, 255;--gf-