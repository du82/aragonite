full_description = '''Event sponsorship & digital marketing solutions What is LeadDev? LeadDev is where Senior Engineering Leadership comes to learn, discover new solutions, and find ways to improve the effectiveness of their engineering teams. Engineering leaders hate sales and marketing. Does that sound familiar? Engineering leaders trust LeadDev to provide them with valuable content. By partnering with us, you can meaningfully connect with this difficult-to-reach audience. Get in touch Why partner with us? We understand how to position your company’s solutions to drive demand from engineering leaders. Work with us to create a campaign to achieve your most challenging objectives: Lead GenerationSecure meetings at the event with key prospects during dedicated networking sessions Product ShowcaseRun live demos with prospects at the event to showcase your solutions Relationship BuildingMake meaningful connections with key decision-makers from the engineering leadership community Thought LeadershipBespoke speaking opportunities will position your brand as a key supporter and educator of the market Brand AwarenessGet brand exposure to our 50,000+ strong leadership audience from the get-go Request a prospectus 50k+ Global community of engineering leaders 86% Of our audience are directly involved with/have influence over key procurement decisions 1 million Unique visitors to LeadDev.com Our solutions Event sponsorshipConnect with thousands of engineering leaders in-person at our flagship events. Networking & editors dinnersA highly targeted opportunity that guarantees quality face time with senior engineering leaders who match your ICP. Research, surveys and reportsWork with our content experts to build a piece of research that provides real value to our audience whilst subtly positioning your brand as a solution to engineering challenges. WebinarsPublish excellent content with our team. Have a speaker participate in a panel discussion alongside industry experts, capturing leads from all registrants. Bespoke and pre-programmed options available. AdvertisingEnsure your brand is front of mind for our global community of engineering leaders, with advertising opportunities across weekly newsletters and the website leaddev.com. Build your package Our audience Job titles Engineering Managers Directors/VPs of Engineering and CTOs Tech Leads Very senior ICs Senior Software Engineers Industries Software e-commmerce Financial services Media & entertainment Retail Consulting Healthare Company size 1000+ : 47% 500–999 : 10% 250–499 : 11% 100–249: 15% <100: 17% Our clients include Contact us #gform_wrapper_22[data-form-index="0"].gform-theme,[data-parent-form="22_0"]{--gf-color-primary: #7864FF;--gf-color-primary-rgb: 120, 100, 255;--gf-color-primary-contrast: #fff;--gf-color-primary-contrast-rgb: 255, 255, 255;--gf-color-primary-darker: #4632CD;--gf-color-primary-lighter: #AA96FF;--gf-color-secondary: #fff;--gf-color-secondary-rgb: 255, 255, 255;--gf-color-secondary-contrast: #585e6a;--gf-color-secondary-contrast-rgb: 88, 94, 106;--gf-color-secondary-darker: #F5F5F5;--gf-color-secondary-lighter: #FFFFFF;--gf-color-out-ctrl-light: rgba(255, 255, 255, 0.1);--gf-color-out-ctrl-light-rgb: 255, 255, 255;--gf-color-out-ctrl-light-darker: rgba(104, 110, 119, 0.35);--gf-color-out-ctrl-light-lighter: #F5F5F5;--gf-color-out-ctrl-dark: #fff;--gf-color-out-ctrl-dark-rgb: 255, 255, 255;--gf-color-out-ctrl-dark-darker: #585e6a;--gf-color-out-ctrl-dark-lighter: rgba(88, 94, 106, 0.65);--gf-color-in-ctrl: #fff;--gf-color-in-ctrl-rgb: 255, 255, 255;--gf-color-in-ctrl-contrast: #585e6a;--gf-color-in-ctrl-contrast-rgb: 88, 94, 106;--gf-color-in-ctrl-darker: #F5F5F5;--gf-color-in-ctrl-lighter: #FFFFFF;--gf-color-in-ctrl-primary: #7864FF;--gf-color-in-ctrl-primary-rgb: 120, 100, 255;--gf-color-in-ctrl-primary-contrast: #112337;--gf-color-in-ctrl-primary-contrast-rgb: 17, 35, 55;--gf-color-in-ctrl-primary-darker: #4632CD;--gf-color-in-ctrl-primary-lighter: #AA96FF;