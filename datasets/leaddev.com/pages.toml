["https://leaddev.com/careers"]
title = "Careers - LeadDev"
description = "About LeadDev LeadDev is the home for engineering leadership. We provide the leaders of the tech industry with a variety of content that drives them to be better and build better. Through articles, panel discussions, roundtables, and both virtual and in-person conferences, LeadDev has become an essential destination for engineering leaders who want to scale […]"
full_description = "Careers Careers About LeadDev LeadDev is the home for engineering leadership. We provide the leaders of the tech industry with a variety of content that drives them to be better and build better. Through articles, panel discussions, roundtables, and both virtual and in-person conferences, LeadDev has become an essential destination for engineering leaders who want to scale themselves and create impact. At LeadDev we have a culture of continuous improvement, and this has never been better reflected than in our successful transition from pure-play events company to digital publisher. You will be joining LeadDev at an incredibly exciting time, with opportunities to progress your career and skillset amongst a high-performing and supportive team. Open positions We don’t have any positions open at the moment What is it like to work at LeadDev? A people-first approach is at the core of our values. We are known for threading inclusion into everything we do, caring about the details, and delighting our community of engineering leaders. This all translates to the way we treat our staff. We are currently a close team of 30 people. A small team means that everyone has a valuable role in the business and is integral to our continuing growth and success. Your voice will be listened to and supported, and your impact on what we do will be recognised. We operate in a remote-first culture and understand the importance of autonomy over your work. But this doesn’t mean a lack of supportive management. To help you do your best work and grow in your role, you’ll get coaching and feedback from your manager in regular operational catch-ups and in-depth 1:1s. For visibility across teams, an All Hands is held every Monday morning to bring everyone in the company together. Our team is based all over the UK and we come together in person on a monthly basis. The fundamentals Remote-first culture Regular and required team get-togethers in London with UK travel covered Flexible working hours A tailored career path with actionable goals All equipment for your remote setup provided inc. an Apple MacBook £700 training budget per annum £50 reading budget Paid sick leave that covers mental and physical health Cycle to work scheme Wellbeing support service Generous leave entitlement: 29 days holiday including a day off for your birthday and Christmas shutdown, plus bank holidays, and increasing with tenure Nest pension scheme (up to 3% of your salary on a matched basis)"
