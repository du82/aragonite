["https://leaddev.com/community/chris-stokel-walker"]
title = "Chris Stokel-Walker - LeadDev"
full_description = "Chris Stokel-Walker Chris Stokel-Walker is a freelance journalist based in the UK. Chris Stokel-Walker is a contributor for LeadDev. A UK journalist based in Newcastle, he is the author of TikTok Boom: China’s Dynamite App and the Superpower Race for Social Media, and YouTubers: How YouTube shook up TV and created a new generation of stars. What went wrong at Sonos? And what can we learn from a disastrous app redesign? Chris Stokel-Walker How DeepSeek upended everything The Chinese AI model has called into question a whole host of assumptions for the tech industry. Chris Stokel-Walker ChatGPT can get an engineering degree. What do we do now? A study into how well generative AI can do at university examinations poses questions for hiring, employee retention, and development. Chris Stokel-Walker Why AI is creating more demand for managers New research suggests that the adoption of AI is adding layers to organizational hierarchies. Chris Stokel-Walker Should JavaScript really be split in two? A radical new proposal for JavaScript has divided opinion over who stands to benefit. Chris Stokel-Walker Breaking down the WordPress drama A dispute has riven the WordPress community in half, how does this impact developers? Chris Stokel-Walker Why you shouldn’t move fast and break things It’s an oft-repeated motto within the industry – but a severely limited way to build good software. Chris Stokel-Walker Tech hiring might finally be bouncing back Say it quietly, but there are signs of stabilization in the tech hiring market. Chris Stokel-Walker Beware of founder mode Everyone's talking about founder mode, but what impact will this idea have on software engineers? Chris Stokel-Walker How worried should we be about that tech stock crash? What was that noise? Chris Stokel-Walker Why Elixir is one of the hottest programming languages to learn The 2024 Stack Overflow survey highlighted little-known Elixir as the second-most desired programming language to learn. Chris Stokel-Walker Why it sucks to be a junior developer right now Or are we overreacting? Chris Stokel-Walker The CrowdStrike disaster is a lesson about testing What’s been dubbed the world’s biggest IT outage should be a wakeup call to the industry. Chris Stokel-Walker Why Zig is one of the hottest programming languages to learn A recent Stack Overflow survey revealed Zig is highly-admired and developers are highly-paid – but why? Chris Stokel-Walker Are UK developers too risk averse? The UK languishes far behind the United States when it comes to building successful software businesses. Chris Stokel-Walker What Andreesen Horowitz got wrong about engineering management The venture capitalists are coming for your BS jobs. Chris Stokel-Walker How the end of non-compete agreements impacts engineers Did the FTC just change the game? Chris Stokel-Walker AI models can’t understand code. Does that matter? New research highlights how little large language models understand about the code they are churning out. Should we care? Chris Stokel-Walker Researchers say generative AI isn't replacing devs any time soon Can large language models solve complex software engineering tasks? Not yet according to a recent study. Chris Stokel-Walker Researchers say generative AI isn't replacing devs any time soon AI skill threat has been building through the developer ranks...but is there anything to fear? Chris Stokel-Walker What you need to know about Biden’s AI executive order US President Joe Biden has announced a sweeping executive order covering artificial intelligence. Here’s everything you need to know about how the US government is looking to regulate the technology. Chris Stokel-Walker Generative AI is changing how computer science is taught From ChatGPT to GitHub Copilot, AI is becoming part of the software developer toolbelt. What does that mean for how we teach computer science students? Chris Stokel-Walker Is this the end of hypergrowth for the tech sector? If tech’s untrammeled period of growth is in fact coming to an end, it's time to start rethinking your management approach. Chris Stokel-Walker Here’s why you shouldn’t treat employee mental health as a mental health problem Simply trying to tackle the issue as it happens is not a sustainable solution, says new research. Chris Stokel-Walker Are you ready for pay transparency? New pay transparency laws are spreading across the globe, how should you prepare? Chris Stokel-Walker What does the end of affirmative action mean for engineering managers? A landmark US Supreme Court decision on ending affirmative action in education could have massive widespread effects for diversity and inclusion efforts in the corporate world. Here’s what engineering managers need to know. Chris Stokel-Walker How to handle layoff survivors’ guilt While it's not the same as losing your job, being left to pick up the pieces after a round of layoffs comes with its own challenges. How do those who remain stay sane? Chris Stokel-Walker The case for and against building ChatGPT into your developer workflow It’s been touted as a revolutionary timesaver – but what about the errors? We asked developers to make the case for and against using AI tools like ChatGPT to help them code. Chris Stokel-Walker The old Twitter is gone Morale has plummeted as the company has rapidly changed from a well-respected engineering organization to a punchline under the leadership of Elon Musk. Chris Stokel-Walker How to survive the tech layoffs storm Mass layoffs are taking place at the biggest of big tech firms – but how do you brush yourself off and keep going? Dot-com crash survivors tell LeadDev how to weather the storm. Chris Stokel-Walker What the Californian pay transparency laws mean for engineering managers California’s Senate Bill 1162 will force hundreds of thousands of businesses to share staff pay data publicly – but what does that mean for staff, and the wider working world? Chris Stokel-Walker Share: More from Chris Stokel-Walker twitter"
