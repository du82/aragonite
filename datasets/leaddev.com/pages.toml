["https://leaddev.com/community/kelli-korducki"]
title = "Kelli Korducki - LeadDev"
description = "Kelli is a writer and editor whose work examines the intersection of technology, work, and relationships."
full_description = "Kelli Korducki Kelli is a writer and editor whose work examines the intersection of technology, work, and relationships. Kelli Korducki is a writer and editor whose work examines the intersection of technology, work, and relationships. She lives in New York City. How the scales tipped against tech workers The bosses are back in charge and expectations for what a job in tech looks like is changing rapidly. Is the industry losing its lustre? Kelli Korducki Tech’s war on middle management is just getting started The middle manager class is under attack. Is it still fit for purpose, or are engineering teams due a reshuffle? Kelli Korducki The relentless rise of the PIP The dreaded performance improvement plan (PIP) is becoming a more popular management tool than ever, but do they actually work? Kelli Korducki Meta and the great DEI rollback Once an emblem of inclusivity, Meta has officially joined tech’s anti-DEI bandwagon. Kelli Korducki Factorio and the promise of better software engineering Just why is the complex factory-building video game so appealing to software developers and can it help them get better at their jobs? Kelli Korducki Who’s afraid of ghost jobs The technology industry is haunted by them, but why do companies post ghost jobs and can managers do anything to exorcise them? Kelli Korducki The problem with RTO FOMO Do younger developers really want to get back into the office? Kelli Korducki DEI is under threat, can you fight back? Corporate DEI initiatives may be on life support, but there are steps progressive leaders can take to keep them on track and improve the health of their organizations. Kelli Korducki What to do when everyone’s sick of meetings The rise of remote work has created meetings, lots more meetings, and engineers are getting fed up. Kelli Korducki Preparing your team for a tense election season And should we even talk about politics at work in the first place? Kelli Korducki Why you don’t have to wait for the California ‘right to disconnect’ law Fighting back against an always-on working culture Kelli Korducki Bringing your whole (strategic) self to work What is strategic authenticity, and why does it sound like an oxymoron? Kelli Korducki How the AI boom is bringing Silicon Valley back from the brink Is Silicon Valley so over, or is it back? Kelli Korducki Learning the right lessons from that Cloudflare firing video How not to go viral for all the wrong reasons. Kelli Korducki Why resisting return-to-office mandates is futile Managers are being tasked with enforcing unpopular RTO mandates, while their teams try to keep a grip on their newfound autonomy. Is resistance futile? Kelli Korducki Share: More from Kelli Korducki linkedin"
