 !timeout; clearTimeout( timeout ); timeout = setTimeout( later, wait ); if ( callNow ) func.apply( context, args ); }; } const debouncedTriggerPostRender = debounce( function() { triggerPostRender(); }, 200 ); if ( visibilityTestDiv && visibilityTestDiv.offsetParent === null ) { const observer = new MutationObserver( ( mutations ) => { mutations.forEach( ( mutation ) => { if ( mutation.type === 'attributes' && visibilityTestDiv.offsetParent !== null ) { debouncedTriggerPostRender(); observer.disconnect(); } }); }); observer.observe( document.body, { attributes: true, childList: false, subtree: true, attributeFilter: [ 'style', 'class' ], }); } else { triggerPostRender(); } } );} ); /* ]]> */ Estimated reading time: 5 minutes This October, an event took place that could have single-handedly threatened the productivity of the entire global tech industry. The Czech developer Wube Software released Space Age, a reinvention of its eight-year-old marquee game, Factorio. Since Factorio’s initial release in 2016, it has amassed a devoted cult following. Tech industry giants such as Elon Musk and OpenAI co-founder Andrej Karpathy are vocal fans of the game. Shopify CEO Tobias Lütke lets employees expense copies of it. Factorio has become so closely linked with its fanbase of software developers and technologists that, when Space Age garnered a record-setting 91,801 players in the first week of its launch, PC Gamer writer Jonathan Bolding quipped, “I’m expecting the world’s IT infrastructure to collapse and innovation to stagnate any day now.” What makes Factorio so uniquely appealing to software developers – and tech CEOs – boils down to its similarities with a developer’s work – without the meetings and OKRs. Fans say Factorio effectively gamifies the logical and iterative processes associated with building software, while also providing a low-pressure environment for collaboration. Some say playing Factorio may even help developers become better at their jobs. The appeal of building factories Factorio is an open-ended game where an astronaut stranded on a distant planet builds an ever-expanding factory of mining drills, robot arms, conveyor belts and assembly machines to ultimately construct a means of escape. But escape is not really the point; building a factory of increasing scale, efficiency, and complexity is. In the game, technological progress demands that ever-more resources be arranged into an increasingly convoluted supply chain. This forces the player to undertake tasks much like what developers might do for a living: Design systems that solve problems, and then scale them if they can. Along the way, the game also raises familiar programming concerns: Is the factory elegant or spaghetti-like? Is there room to grow? Is it a mess that needs to be taken apart and reassembled from scratch? The quest to build an ever-more-perfect machine has spawned a thriving community of factory builders, who swap save files of megaprojects and compare livestreams online. London • June 16 & 17, 2025 Speakers Gergely Orosz, Camille Fournier and Lara Hogan confirmed. See who else is speaking Lukas Kubiak, a gaming consultant for The End of the Sun, based in Poland, first heard about Factorio from a developer friend. “The premise intrigued me: Start with nothing, gather resources, and build increasingly complex systems to automate production. It felt like the ultimate sandbox for anyone who loves efficiency and creative problem-solving,” Kubiak said. “Plus, it’s just plain fun to turn chaos into order – a feeling every developer can relate to when wrangling code.” “It’s almost like you’re solving a puzzle, like in programming where you’re trying to find an optimal solution, or you build a piece of functionality to accomplish a certain task,” echoed Tim Abramson, a full-stack developer at a small SaaS software startup in Milwaukee, Wisconsin who began playing Factorio around 2018 after learning about it on Reddit. Abramson explained that, as the game progresses and the scope of tasks expands, earlier designs may become inefficient or obsolete. The player must then choose to adapt to these flaws or redesign their systems, relying on strategic planning to avoid disarray. “There’s something really satisfying about that optimization,” Abramson said. Because the game relies on constructing and scaling multiple interconnected systems, it offers “nearly infinite opportunities to experience rewarding progress across a number of different dimensions,” said David Wolever, the Toronto-based CTO of RxFood.co. Players have free rein to advance the quality and scope of their factory’s technology or tinker to make their factory bigger. These processes incorporate “fun reward loops which involve some combination of mundane work, aesthetic creativity, spatial problem-solving, logic, and optimization,” explained Wolever. These reward loops also compel the player to keep going, and going, and going. (In a joking nod to the game’s addictive qualities, it has earned t'''
