full_description = "Culture Culture Establishing a positive engineering culture Latest Performance review mistakes and how to avoid them They roll around every year, but it always feels like people could do a better job at executing them. Here’s some common mistakes to avoid. Meg Adams How the scales tipped against tech workers The bosses are back in charge and expectations for what a job in tech looks like is changing rapidly. Is the industry losing its lustre? Kelli Korducki 4 ways to help senior engineers grow toward mastery Helping knowledgable, skilled engineers take the extra step toward mastery means avoiding micromanaging traps. Dan Abel Make it count; A no-nonsense guide to engineering metrics for the busy leader Gain practical insights on engineering metrics that help busy leaders prioritize effectively, address delivery challenges, and measure team performance to maximize impact and productivity. Editor’s picks The problem with RTO FOMO Do younger developers really want to get back into the office? Kelli Korducki Cooking up a culture of continuous learning Continuous learning is an important part of building a collaborative culture. Bill Doerrfeld Build a productive code review culture Code reviews can be tense and stressful if done incorrectly. Avoid bikeshedding and set good cultural standards with these nine simple steps. Ara Ramanathan Trust is the ultimate driver of engineering excellence How can you improve the level of trust in your teams to bolster performance and encourage an inclusive culture. Guillermo A. Fisher London • June 16 & 17, 2025 Speakers Gergely Orosz, Camille Fournier and Lara Hogan confirmed Find out more Essential reading How to build an intentional culture Don’t leave your culture up to chance. Curate your principles and values intentionally to build high-performing, harmonious teams. Vadim Ohrimenko On our Culture playlist Culture, Clarity, Velocity This session explores how leaders can examine proposed changes and prepare their teams to move from a culture that impedes progress to one that enables strategic change. Conference Happy teams don’t leave To retain talent, engineering leaders need to establish an engaging culture within their teams From hurdles to highways: Crafting a collaborative experimentation ecosystem at GetYourGuide Discover how GetYourGuide transformed its experimentation platform, navigating challenges to build a streamlined, collaborative, and innovative ecosystem for efficient testing and creativity. Conference Content sponsored by Harness How to build a culture of accountability in your teams In this panel, we’ll discuss what a culture of accountability actually looks like in practice, and the role of the engineering leader in encouraging a culture of accountability, not blame, in busy developer teams. Webinar Content sponsored by Split Fostering a culture of experimentation in your engineering teams How can engineering leaders help their reports find joy in their work? The festival of engineering leadership Explore the event London • June 16 & 17, 2025 More about Culture Meta and the great DEI rollback Once an emblem of inclusivity, Meta has officially joined tech’s anti-DEI bandwagon. Kelli Korducki Help teams thrive during organizational change Organizational change can rock the foundations of any team. But knowing the reasoning behind the shift can open all sorts of doors. Jack Franklin Imposter syndrome and how to overcome it Many people have wrestled with imposter syndrome. Here’s what to do if you are feeling these self-doubts creep up. Dileep Marway A blueprint for async work environments An asynchronous-first culture can be difficult to cultivate in an age where synchronous communication is so highly valued. Michael Tempest Translating code quality into business impact Yes, it can be done. Adam Tornhill The problem with RTO FOMO Do younger developers really want to get back into the office? Kelli Korducki Making experimentation easy Lowering the bar to entry. Leemay Nassery Trust is the ultimate driver of engineering excellence How can you improve the level of trust in your teams to bolster performance and encourage an inclusive culture. Guillermo A. Fisher 1 2 3 … 19 Next Page Top Culture videos Effective communication: Mastering growth-oriented feedback Discover strategies for delivering feedback that builds trust and openness. Learn science-backed techniques to make feedback constructive, approachable, and growth-focused, helping teams unlock their full potential. Exhausted but not burned out: A manager’s story of how to get the team through a tough project Discover strategies for leading high-stress projects without burnout. Learn how prioritising team well-being, resilience, and self-compassion fosters sustainable success even under intense pressure. Breaking barriers: Embracing neurodiversity in tech Discover the importance of neurodiversity in tech, with actionable strategies to foster inclusivity and empower colleagues with hidden disabilities for a more supportive workplace. Feedback for intercultural teams – Where is the map? Explore techniques for delivering culturally sensitive feedback, with practical tips to improve communication, foster growth, and boost performance in today’s diverse, intercultural team environments. From hurdles to highways: Crafting a collaborative experimentation ecosystem at GetYourGuide Discover how GetYourGuide transformed its experimentation platform, navigating challenges to build a streamlined, collaborative, and innovative ecosystem for efficient testing and creativity. How to talk to everyone: Connecting with your reporting chain Explore effective ways to build trust and rapport in distributed teams, using strategies to maintain connection and support across organizational layers and remote setups. Level up the whole party, not just the hero Optimize team dynamics by treating everyone as vital to success – not just the ‘hero.’ Discover how small, intentional choices drive equitable growth and organic leadership. Backwards compatible – Lessons from a quarter century in software Explore career lessons from a 25-year journey in software development. Learn about growth, leadership, and the power of kindness to shape lasting impact in engineering. 1 2 3 … 15 Next Page"
