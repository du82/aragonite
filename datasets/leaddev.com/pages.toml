full_description = "Career development Career development Taking the next step in your career Latest What is a product engineer? Get an engineer who can do both Product engineers keep one hand in the codebase and another in the world of product design. Josh Fruhlinger Skills you need to become a well-rounded engineering manager Being an engineering manager who can juggle it all in any organization means honing skills like delegation, mentorship, and coaching. Sai Chiligireddy 4 ways to help senior engineers grow toward mastery Helping knowledgable, skilled engineers take the extra step toward mastery means avoiding micromanaging traps. Dan Abel Strategies to hone commercial awareness and drive business outcomes Learn effective strategies for enhancing commercial awareness in tech teams, turning engineering into a business driver through alignment, impactful initiatives, and stakeholder engagement. Editor’s picks Engineering leadership is not just about code If you’re looking to move into an engineering leadership position, you’ll have to do more than brush up on code! Jack Franklin Your 30-60-90-day plan as a new manager Franziska Hinkelmann How to find and become a great engineering mentor Mentoring is a great way to boost your career. Here’s everything you need to know about getting a mentor, and becoming one yourself. Addy Osmani How to navigate unexpected role changes At one point or another, you may have to face an unexpected role change. It might not be what you want, but there are ways to make it work. Vaidehi Joshi London • June 16 & 17, 2025 Speakers Gergely Orosz, Camille Fournier and Lara Hogan confirmed Find out more Essential reading Learning to enjoy the career progression journey Reaching a management position in the tech industry is hard work. It’s important to remember to enjoy the journey and celebrate victories big and small along the way. Stu Cavill How to keep up with tech trends and upskill sustainably Addy Osmani On our Career development playlist There and back again – A cautionary tale about entering middle management Explore the realities of middle management through a journey of promotion, stress, and self-reflection, offering guidance on finding the right leadership path. Conference Unconventional paths in tech: Leveraging your strengths to find your place n this talk, Mitra Raman will take a look at the many paths that engineers can take on their leadership journey. Conference Career vectors for technical leaders Mix and match skills to become the best technical leader that you can be. The path from Director to CTO: How to follow it, or how to mentor it This talk is aimed at both aspiring Chief Technology Officers and those who are in a position to mentor future CTOs. Explore the journey from a Director of Engineering role to a CTO, focusing on the skills and experiences needed for this transition and how experienced leaders can guide others on this path. Conference Content sponsored by X-Team Essential soft skills you need to succeed as an engineer There is a big focus on technical expertise in software engineering – but soft skills are equally as important. Which ones are crucial to master and how can you do this? Webinar The festival of engineering leadership Explore the event London • June 16 & 17, 2025 More about Career development How to balance competing threads of work As you become more senior in your career, you’ll start to find yourself juggling competing priorities more and more. Vaidehi Joshi 5 ways quiet introverts can thrive at work Corporate environments may feel like they are made by and for extroverts. So how can introverts leverage their innate skills to get ahead? Tim Cigrand Do managers still need to be hands on? While remaining hands-on is naturally tempting for engineers, it’s not always the most effective way to lead. Gary Stevens Gut-based engineering leadership is failing Why instinct isn’t enough for stakeholders who need clear, actionable answers. Himanshu Saxena Factorio and the promise of better software engineering Just why is the complex factory-building video game so appealing to software developers and can it help them get better at their jobs? Kelli Korducki From false urgency to strategic leadership Move away from false urgency and instill a culture of strategic influence. Maxime Najim What engineering managers need to know for 2025 Here are 9 things you need to know as we move into 2025. Scott Carey 10 engineering leadership newsletters you need to know about In an age where information is all too abundant, newsletters are a nice way to get the right insights for you and your leadership journey. Anastasija Kovacevic 1 2 3 … 23 Next Page Top Career development videos The OSS maintainer to staff engineer pipeline Discover how lessons from open source software maintenance shape effective staff engineers. This talk explores key insights on scaling, influence, and collaboration learned from OSS projects. What’s my job again? Developing self-management The more we move up the org chart, the less input we’ll get from our own managers, and the more we need to expand our range as a leader to be successful. Revolutionizing engineer growth: the tech-powered blueprint for careers clarity at ASOS As engineering leaders, it’s our job to make the folks in our team the most effective that they can be and to grow them to their full potential. Content sponsored by X-Team Essential soft skills you need to succeed as an engineer There is a big focus on technical expertise in software engineering – but soft skills are equally as important. Which ones are crucial to master and how can you do this? How to become a staff+ engineer What do you need to be able to demonstrate to get promoted to a staff engineer? How to completely fail at learning Hywel Carver asks, are you being asked to do more with less? Are hiring ambitions lower than they were a couple of years ago? Are you finding it slow and painful to adopt new technologies? If the answer to any of these questions is yes, this talk is for you. I’ve got the power: Career growth, today and beyond Lena Reinhard will help you not just celebrate and reflect on what you learned on this day full of practical advice from experienced leaders: She will also make space for you to operationalize turning these lessons into actions. Tackling Software Engineering Leaders’ Dual Mandate Operational excellence has been engineering leaders’ mandate since the beginning. But, success in the business world has shifted over the past two decades, making software delivery the key driver. This revenue generation change added a new mandate for the engineering leader: Driving Business Outcomes. 1 2 3 … 17 Next Page"
