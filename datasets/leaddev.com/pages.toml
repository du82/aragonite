description = "Meg Adams is an experienced technology leader sought out by multi-billion dollar companies like Estée Lauder, Etsy, and Condé Nast to create cultures of high performance and high engagement within their engineering teams. She is passionate about deepening the community of workplaces and infusing the everyday with joy and purpose, all while increasing profitability. Meg […]"
full_description = "Meg Adams Meg is Senior Director of Engineering at The New York Times. Meg Adams is an experienced technology leader sought out by multi-billion dollar companies like Estée Lauder, Etsy, and Condé Nast to create cultures of high performance and high engagement within their engineering teams. She is passionate about deepening the community of workplaces and infusing the everyday with joy and purpose, all while increasing profitability. Meg is also a trusted advisor to remarkable women when it comes to career development and negotiation. Performance review mistakes and how to avoid them They roll around every year, but it always feels like people could do a better job at executing them. Here's some common mistakes to avoid. Meg Adams How to keep high performers engaged and growing Managing high performers can be equal parts daunting and exciting. Using these four tips to help keep your reports engaged. Meg Adams Market your team’s success for wider impact Making sure your team's wins are visible garners a lot of advantages. Here's how to do it right. Meg Adams The key to quickly unblocking decision-making Unlock quick decision-making by evaluating what you know, what you don't know, and, based on those things, hypotheses you can make. Meg Adams Provide growth opportunities for your team this summer Summer is the time for holiday. With so many people going on leave, how can you split up tasks to make sure everything is completed on time? Meg Adams Collaborate effectively using the power of agreements Make sure that you and your reports are on the same page by establishing clear agreements. Here are some ways to do that. Meg Adams How to bring about positive cultural change in your team Looking to influence your team culture? Try this framework. Meg Adams 3 strategies for driving organizational change Introducing change to your organization can feel like an uphill battle, but it doesn’t have to. Here are some tactics to implement for more successful transitions. Meg Adams Leading as the most experienced engineer in the room Your domain expertise is essential to your job, but it just might be one of the things getting in the way of you being a truly great engineering leader. Meg Adams Share: More from Meg Adams twitter linkedin personal website"
