["https://leafletjs.com/reference.html"]
title = "Documentation - Leaflet - a JavaScript library for interactive maps"
full_description = '''Leaflet API reference This reference reflects Leaflet 1.9.4. Check this list if you are using a different version of Leaflet. Map Usage example Creation Options Events Map Methods Modifying map state Getting map state Layers and controls Conversion methods Other methods Map Misc Properties Panes UI Layers Marker DivOverlay Popup Tooltip Raster Layers TileLayer TileLayer.WMS ImageOverlay VideoOverlay Vector Layers Path Polyline Polygon Rectangle Circle CircleMarker SVGOverlay SVG Canvas Other Layers LayerGroup FeatureGroup GeoJSON GridLayer Basic Types LatLng LatLngBounds Point Bounds Icon DivIcon Controls Zoom Attribution Layers Scale Utility Browser Util Transformation LineUtil PolyUtil DOM Utility DomEvent DomUtil PosAnimation Draggable Base Classes Class Evented Layer Interactive layer Control Handler Projection CRS Renderer Misc Event objects global switches noConflict version MapThe central class of the API — it is used to create a map on a page and manipulate it. Usage example // initialize the map on the "map" div with a given center and zoom var map = L.map('map', { center: [51.505, -0.09], zoom: 13 }); Creation Factory Description L.map(<String> id, <Map options> options?) Instantiates a map object given the DOM ID of a <div> element and optionally an object literal with Map options. L.map(<HTMLElement> el, <Map options> options?) Instantiates a map object given an instance of a <div> HTML element and optionally an object literal with Map options. Options Option Type Default Description preferCanvas Boolean false Whether Paths should be rendered on a Canvas renderer. By default, all Paths are rendered in a SVG renderer. Control options Option Type Default Description attributionControl Boolean true Whether a attribution control is added to the map by default. zoomControl Boolean true Whether a zoom control is added to the map by default. Interaction Options Option Type Default Description closePopupOnClick Boolean true Set it to false if you don't want popups to close when user clicks the map. boxZoom Boolean true Whether the map can be zoomed to a rectangular area specified by dragging the mouse while pressing the shift key. doubleClickZoom Boolean|String true Whether the map can be zoomed in by double clicking on it and zoomed out by double clicking while holding shift. If passed 'center', double-click zoom will zoom to the center of the view regardless of where the mouse was. dragging Boolean true Whether the map is draggable with mouse/touch or not. zoomSnap Number 1 Forces the map's zoom level to always be a multiple of this, particularly right after a fitBounds() or a pinch-zoom. By default, the zoom level snaps to the nearest integer; lower values (e.g. 0.5 or 0.1) allow for greater granularity. A value of 0 means the zoom level will not be snapped after fitBounds or a pinch-zoom. zoomDelta Number 1 Controls how much the map's zoom level will change after a zoomIn(), zoomOut(), pressing + or - on the keyboard, or using the zoom controls. Values smaller than 1 (e.g. 0.5) allow for greater granularity. trackResize Boolean true Whether the map automatically handles browser window resize to update itself. Panning Inertia Options Option Type Default Description inertia Boolean * If enabled, panning of the map will have an inertia effect where the map builds momentum while dragging and continues moving in the same direction for some time. Feels especially nice on touch devices. Enabled by default. inertiaDeceleration Number 3000 The rate with which the inertial movement slows down, in pixels/second². inertiaMaxSpeed Number Infinity Max speed of the inertial movement, in pixels/second. easeLinearity Number 0.2 worldCopyJump Boolean false With this option enabled, the map tracks when you pan to another "copy" of the world and seamlessly jumps to the original one so that all overlays like markers and vector layers are still visible. maxBoundsViscosity Number 0.0 If maxBounds is set, this option will control how solid the bounds are when dragging the map around. The default value of 0.0 allows the user to drag outside the bounds at normal speed, higher values will slow down map dragging outside bounds, and 1.0 makes the bounds fully solid, preventing the user from dragging outside the bounds. Keyboard Navigation Options Option Type Default Description keyboard Boolean true Makes the map focusable and allows users to navigate the map with keyboard arrows and +/- keys. keyboardPanDelta Number 80 Amount of pixels to pan when pressing an arrow key. Mouse wheel options Option Type Default Description scrollWheelZoom Boolean|String true Whether the map can be zoomed by using the mouse wheel. If passed 'center', it will zoom to the center of the view regardless of where the mouse was. wheelDebounceTime Number 40 Limits the rate at which a wheel can fire (in milliseconds). By default user can't zoom via wheel more often than once per 40 ms. wheelPxPerZoomLevel Number 60 How many scroll pixels (as reported by L.DomEvent.getWheelDelta) mean a change of one full zoom level. Smaller values will make wheel-zooming faster (and vice versa). Touch interaction options Option Type Default Description tapHold Boolean Enables simulation of contextmenu event, default is true for mobile Safari. tapTolerance Number 15 The max number of pixels a user can shift his finger during touch for it to be considered a valid tap. touchZoom Boolean|String * Whether the map can be zoomed by touch-dragging with two fingers. If passed 'center', it will zoom to the center of the view regardless of where the touch events (fingers) were. Enabled for touch-capable web browsers. bounceAtZoomLimits Boolean true Set it to false if you don't want the map to zoom beyond min/max zoom and then bounce back when pinch-zooming. Map State Options Option Type Default Description crs CRS L.CRS.EPSG3857 The Coordinate Reference System to use. Don't change this if you're not sure what it means. center LatLng undefined Initial geographic center of the map zoom Number undefined Initial map zoom level minZoom Number * Minimum zoom level of the map. If not specified and at least one GridLayer or TileLayer is in the map, the lowest of their minZoom options will be used instead. maxZoom Number * Maximum zoom level of the map. If not specified and at least one GridLayer or TileLayer is in the map, the highest of their maxZoom options will be used instead. layers Layer[] [] Array of layers that will be added to the map initially maxBounds LatLngBounds null When this option is set, the map restricts the view to the given geographical bounds, bouncing the user back if the user tries to pan outside the view. To set the restriction dynamically, use setMaxBounds method. renderer Renderer * The default method for drawing vector layers on the map. L.SVG or L.Canvas by default depending on browser support. Animation Options Option Type Default Description zoomAnimation Boolean true Whether the map zoom animation is enabled. By default it's enabled in all browsers that support CSS3 Transitions except Android. zoomAnimationThreshold Number 4 Won't animate zoom if the zoom difference exceeds this value. fadeAnimation Boolean true Whether the tile fade animation is enabled. By default it's enabled in all browsers that support CSS3 Transitions except Android. markerZoomAnimation Boolean true Whether markers animate their zoom with the zoom animation, if disabled they will disappear for the length of the animation. By default it's enabled in all browsers that support CSS3 Transitions except Android. transform3DLimit Number 2^23 Defines the maximum size of a CSS translation transform. The default value should not be changed unless a web browser positions layers in the wrong place after doing a large panBy. Events Layer events Event Data Description baselayerchange LayersControlEvent Fired when the base layer is changed through the layers control. overlayadd LayersControlEvent Fired when an overlay is selected through the layers control. overlayremove LayersControlEvent Fired when an overlay is deselected through the layers control. layeradd LayerEvent Fired when a new layer is added to the map. layerremove LayerEvent Fired when some layer is removed from the map Map state change events Event Data Description zoomlevelschange Event Fired when the number of zoomlevels on the map is changed due to adding or removing a layer. resize ResizeEvent Fired when the map is resized. unload Event Fired when the map is destroyed with remove method. viewreset Event Fired when the map needs to redraw its content (this usually happens on map zoom or load). Very useful for creating custom overlays. load Event Fired when the map is initialized (when its center and zoom are set for the first time). zoomstart Event Fired when the map zoom is about to change (e.g. before zoom animation). movestart Event Fired when the view of the map starts changing (e.g. user starts dragging the map). zoom Event Fired repeatedly during any change in zoom level, including zoom and fly animations. move Event Fired repeatedly during any movement of the map, including pan and fly animations. zoomend Event Fired when the map zoom changed, after any animations. moveend Event Fired when the center of the map stops changing (e.g. user stopped dragging the map or after non-centered zoom). Popup events Event Data Description popupopen PopupEvent Fired when a popup is opened in the map popupclose PopupEvent Fired when a popup in the map is closed autopanstart Event Fired when the map starts autopanning when opening a popup. Tooltip events Event Data Description tooltipopen TooltipEvent Fired when a tooltip is opened in the map. tooltipclose TooltipEvent Fired when a tooltip in the map is closed. Location events Event Data Description locationerror ErrorEvent Fired when geolocation (using the locate method) failed. locationfound LocationEvent Fired when geolocation (using the locate method) went successfully. Interaction events Event Data Description click MouseEvent Fired when the user clicks (or taps) the map. dblclick MouseEvent Fired when the user double-clicks (or double-taps) the map. mousedown MouseEvent Fired when the user pushes the mouse button on the map. mouseup MouseEvent Fired when the user releases the mouse button on the map. mouseover MouseEvent Fired when the mouse enters the map. mouseout MouseEvent Fired when the mouse leaves the map. mousemove MouseEvent Fired while the mouse moves over the map. contextmenu MouseEvent Fired when the user pushes the right mouse button on the map, prevents default browser context menu from showing if there are listeners on this event. Also fired on mobile when the user holds a single touch for a second (also called long press). keypress KeyboardEvent Fired when the user presses a key from the keyboard that produces a character value while the map is focused. keydown KeyboardEvent Fired when the user presses a key from the keyboard while the map is focused. Unlike the keypress event, the keydown event is fired for keys that produce a character value and for keys that do not produce a character value. keyup KeyboardEvent Fired when the user releases a key from the keyboard while the map is focused. preclick MouseEvent Fired before mouse click on the map (sometimes useful when you want something to happen on click before any existing click handlers start running). Other Events Event Data Description zoomanim ZoomAnimEvent Fired at least once per zoom animation. For continuous zoom, like pinch zooming, fired once per frame during zoom. Methods Method Returns Description getRenderer(<Path> layer) Renderer Returns the instance of Renderer that should be used to render the given Path. It will ensure that the renderer options of the map and paths are respected, and that the renderers do exist on the map. Methods for Layers and Controls Method Returns Description addControl(<Control> control) this Adds the given control to the map removeControl(<Control> control) this Removes the given control from the map addLayer(<Layer> layer) this Adds the given layer to the map removeLayer(<Layer> layer) this Removes the given layer from the map. hasLayer(<Layer> layer) Boolean Returns true if the given layer is currently added to the map eachLayer(<Function> fn, <Object> context?) this Iterates over the layers of the map, optionally specifying context of the iterator function. map.eachLayer(function(layer){ layer.bindPopup('Hello'); }); openPopup(<Popup> popup) this Opens the specified popup while closing the previously opened (to make sure only one is opened at one time for usability). openPopup(<String|HTMLElement> content, <LatLng> latlng, <Popup options> options?) this Creates a popup with the specified content and options and opens it in the given point on a map. closePopup(<Popup> popup?) this Closes the popup previously opened with openPopup (or the given one). openTooltip(<Tooltip> tooltip) this Opens the specified tooltip. openTooltip(<String|HTMLElement> content, <LatLng> latlng, <Tooltip options> options?) this Creates a tooltip with the specified content and options and open it. closeTooltip(<Tooltip> tooltip) this Closes the tooltip given as parameter. Methods for modifying map state Method Returns Description setView(<LatLng> center, <Number> zoom, <Zoom/pan options> options?) this Sets the view of the map (geographical center and zoom) with the given animation options. setZoom(<Number> zoom, <Zoom/pan options> options?) this Sets the zoom of the map. zoomIn(<Number> delta?, <Zoom options> options?) this Increases the zoom of the map by delta (zoomDelta by default). zoomOut(<Number> delta?, <Zoom options> options?) this Decreases the zoom of the map by delta (zoomDelta by default). setZoomAround(<LatLng> latlng, <Number> zoom, <Zoom options> options) this Zooms the map while keeping a specified geographical point on the map stationary (e.g. used internally for scroll zoom and double-click zoom). setZoomAround(<Point> offset, <Number> zoom, <Zoom options> options) this Zooms the map while keeping a specified pixel on the map (relative to the top-left corner) stationary. fitBounds(<LatLngBounds> bounds, <fitBounds options> options?) this Sets a map view that contains the given geographical bounds with the maximum zoom level possible. fitWorld(<fitBounds options> options?) this Sets a map view that mostly contains the whole world with the maximum zoom level possible. panTo(<LatLng> latlng, <Pan options> options?) this Pans the map to a given center. panBy(<Point> offset, <Pan options> options?) this Pans the map by a given number of pixels (animated). flyTo(<LatLng> latlng, <Number> zoom?, <Zoom/pan options> options?) this Sets the view of the map (geographical center and zoom) performing a smooth pan-zoom animation. flyToBounds(<LatLngBounds> bounds, <fitBounds options> options?) this Sets the view of the map with a smooth animation like flyTo, but takes a bounds parameter like fitBounds.'''
