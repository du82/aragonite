["https://leafletjs.com/2016/07/16/leaflet-1.0-rc2.html"]
title = "Announcing Leaflet 1.0-rc2 - Leaflet - a JavaScript library for interactive maps"
full_description = '← Back to the list of blog posts Announcing Leaflet 1.0-rc2 Posted on 16 July 2016 by Yohan Boniface Here comes the second release candidate for Leaflet 1.0, the most stable Leaflet version ever! Leaflet 1.0-rc2 is mainly bug fixing, with two notable exceptions. The full list of changes is in the 1.0.0-rc2 changelog as usual. Notable changes Event refactoring: thanks to an initial work from @fab1an, coordinated by @perliedman, the events are greatly optimized: they are faster, and consume less memory. New L.Tooltip class: started as a port of Leaflet.Label plugin to Leaflet core, and then reworked, this new class allows to display small tooltips attached to map features. The API is very similar to what Leaflet.Label was (with some exceptions in options naming and default values), so the upgrade path from Leaflet.Label to L.Tooltip should be straightforward, and we encourage you to do so while upgrading your Leaflet to 1.0. More in the 1.0.0-rc2 changelog. What’s left for 1.0.0-final The Leaflet team is very happy about the progress from rc1 to rc2, but not all features were tackled. Notably, the scroll zoom with an Apple Magic Mouse has proven to be very tricky to debug (especially since not all members of the team have access to one). Getting a good experience when scroll-zooming with this particular device had been planned for rc2 but ultimately it was pushed back for 1.0.0-final. While there are no big features planned, a few but mischievous and tricky bugs are left - such as subpixel offset, CSS trickery, zoom vibration. Leafdays The core team being spread all over Europe, we are doing so called “Leafdays” from time to time to remotely work together during one full day. Here is a debug session with @perliedman screen sharing: Next face-to-face session will be during FOSS4G in Bonn, in August, and we hope to see you there. Will this be the final 1.0 release session? Get the release candidate As with previous releases, you can use the CDN: <link rel="stylesheet" href="https://unpkg.com/leaflet@1.0.0-rc.2/dist/leaflet.css" /> <script src="https://unpkg.com/leaflet@1.0.0-rc.2/dist/leaflet.js"></script> A non-minified version of the javascript file is also available as: <script src="https://unpkg.com/leaflet@1.0.0-rc.2/dist/leaflet-src.js"></script> The release is also available through NPM (npm install leaflet@rc), GitHub download, and CDN download. We discourage using Bower. Use it, enjoy it, and please report any issue to help preparing the final Leaflet 1.0 release! Best, The “Leafteam”'
