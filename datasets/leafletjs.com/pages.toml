title = "Announcing Leaflet 1.0.3 - Leaflet - a JavaScript library for interactive maps"
full_description = "← Back to the list of blog posts Announcing Leaflet 1.0.3 Posted on 23 January 2017 by Iván Sánchez Ortega Leaflet 1.0.3 is now out, with about a dozen bugfixes since 1.0.2. One of the main highlights is the handling of dblblick events for web browsers which support PointerEvents. Until now, the only browser which used PointerEvents were Internet Explorer and Edge; but now that Chrome has enabled support in version 55, the Leaflet code for checking for double clicks and touchscreens had to change. Leaflet 1.0.3 also improved the performance and behaviour of L.Canvas rendering, backported a few fixes for Internet Explorer 8, and some miscellaneous fixes. The full list of changes can be found on the changelog. As usual, check the downloads page to get this release. Cheers, The Leaflet team."
