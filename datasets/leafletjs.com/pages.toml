title = "Plugins - Leaflet - a JavaScript library for interactive maps"
full_description = 'table.plugins td > p { margin-top: 0; margin-bottom: 0; } .repo-data{ margin-top: 10px; white-space: nowrap; } .repo-data > img { height: 20px; max-width: none; margin-right: 5px; } Leaflet Plugins database While Leaflet is meant to be as lightweight as possible, and focuses on a core set of features, an easy way to extend its functionality is to use third-party plugins. Thanks to the awesome community behind Leaflet, there are literally hundreds of nice plugins to choose from. Tile & image layers Basemap providers Basemap formats Non-map base layers Tile/image display Tile load Vector tiles Overlay data Overlay data formats Dynamic data loading Synthetic overlays Data providers Overlay Display Markers & renderers Overlay animations Clustering/decluttering Heatmaps DataViz Overlay interaction Edit geometries Time & elevation Search & popups Area/overlay selection Map interaction Layer switching controls Interactive pan/zoom Bookmarked pan/zoom Fullscreen Minimaps & synced maps Measurement Mouse coordinates Events User interface Print/export Geolocation Miscellaneous Geoprocessing Routing Geocoding Plugin collections Integration Frameworks & build systems 3rd party Develop your own Tile & image layers The following plugins allow loading different maps and provide functionality to tile and image layers. Basemap providers Basemap formats Non-map base layers Tile/image display Tile load Vector tiles Basemap providers Ready-to-go basemaps, with little or no configuration at all. PluginDescriptionDemoMaintainer Azure Maps Leaflet plugin A leafletjs plugin that makes it easy to overlay all the different tile layers available from the Azure Maps. Supports using an Azure Maps subscription key or Azure Active Directory for authentication. Demo Ricky Brundritt Bing Maps Layer Add Bing Maps tiles to your Leaflet Map. Requires Leaflet v1.0.0.beta.2 or later. Demo Gregor MacLennan Esri Leaflet A set of tools for using ArcGIS services with Leaflet. Support for map services, feature layers, ArcGIS Online tiles and more. Patrick Arlt L.GridLayer.GoogleMutant Displays Google maps (with minimal artifacts thanks to a DOM mutation observer technique). Demo Iván Sánchez L.MapkitMutant Displays Apple’s MapkitJS basemaps. Iván Sánchez L.TileLayer.HERE Displays map tiles from HERE maps. Demo Iván Sánchez L.TileLayer.Kartverket Provides easy setup of the tile layers from Kartverket (The Norwegian Mapping Authority) Kultur og naturreise Leaflet.ChineseTmsProviders Contains configurations for various Chinese tile providers — TianDiTu, MapABC, GaoDe, etc. Demo Tao Huang Leaflet.GIBS NASA EOSDIS GIBS imagery integration. The plugin provides 96 daily updated layers with satellite imagery and science parameters. Demo Alexander Parshin Leaflet.KoreanTmsProviders Contains configurations for various (South) Korean tile providers — Daum, Naver, VWorld, etc. Seong Choi Leaflet.Spain.WMS Provides easy setup for several Web Map Services (WMS) layers for Spain (PNOA, IGN base, Catastro, etc), from Spanish mapping agencies. Patricio Soriano Leaflet.TileLayer.HERE Displays tiles from HERE maps. Wanderson Souza Leaflet-Tilelayer-Hong-Kong Displays Hong Kong map tiles from Hong Kong GeoData Store provider. spaceflighter Leaflet.TileLayer.Mierune Displays tiles from Mierune map. Demo Mierune Leaflet.TileLayer.Swiss Displays national maps of Switzerland using map tiles from Swisstopo. Demo Roman Karavia leaflet-providers Contains configurations for various free tile providers — OSM, OpenCycleMap, Stamen, Esri, etc. Demo leaflet-extras members PolarMap.js JavaScript library for displaying tiles from ArcticWebMap, a free tile provider with OSM data in multiple Arctic polar projections. Includes lower-level API for deeper integration with other Leaflet plugins. GeoSensorWeb Lab SuperMap Leaflet SuperMap Leaflet is a Leaflet plugins for working with SuperMap service types. Support for SuperMap services, tiles and more. Demo SuperMap Basemap formats Plugins for loading basemaps or GIS raster layers in common (albeit non-default) formats. PluginDescriptionDemoMaintainer allmaps-leaflet Allmaps plugin for Leaflet. This plugin allows displaying georeferenced IIIF images on a Leaflet map. 100,000s of (historical) maps are available through IIIF, across libraries, archives and museums worldwide. The plugin works by loading Georeference Annotations and uses WebGL to transform images from a IIIF image server to overlay them on their correct geographical position. See allmaps.org for more information. Demo Allmaps azgs-leaflet A set of small plugins for Leaflet, including WFS-GeoJSON layer with filtering, a hover control for GeoJSON, and an Esri tile layer. AZGS cartodb-leaflet Official CartoDB plugin for Leaflet. Vizzuality GeoRasterLayer Display small and large GeoTIFF files with configurable resolution. Built for simplicity and performance. Integrates with GeoBlaze, a JavaScript raster analysis library. Demo Daniel J. Dufour L.TileLayer.WMTS A simple WMTS Tile Layer plugin for Leaflet. Demo Alexandru Calin Leaflet.bpg TileLayer with .bpg image format decoding. Andrzej Zaborowski Leaflet.CanvasLayer.Field Loads and styles raster files (geotiff & asciigrid formats). It includes a ScalarField layer (for DTM, temperature…) and VectorFieldAnim (an animated layer for wind, currents…). See the examples Demo Víctor Velarde Leaflet GeoJSON Encoded Extends the L.GeoJSON layer using Google polyline encoding algorithm, allowing an optimized data transfer. Geobricks Leaflet.ImageOverlay.OGCAPI A client for the (untiled) OGC API Maps draft specification. Demo Iván Sánchez Ortega Leaflet.NonTiledLayer.WCS Display raster data from Web Coverage Services. Rasters can be styled and queried in the client. Demo Stuart Matthews Leaflet.projwmts Adding WMTS services (GUGiK Poland). Demo Geoportal Poland Leaflet.TileLayer.MBTiles Loads .mbtiles tilesets. Demo Iván Sánchez leaflet.TileLayer.WMTS Add WMTS (IGN) layering for leaflet. Alexandre Melard leaflet.wms Enhanced WMS support for Leaflet, including single-tile/untiled layers, shared WMS sources, and layer identify via GetFeatureInfo. Demo S. Andrew Sheppard Leaflet-2gis Adds support for 2GIS tile layer Demo Eugene Mikhalev leaflet-geotiff Display raster data from geoTIFF files as images or direction arrows. Rasters can be styled and queried in the client. An optional clipping mask can be applied, e.g. to restrict DEMs to land areas. Demo Stuart Matthews leaflet-tilejson Adds support for the TileJSON specification to Leaflet. Per Liedman TileLayer.GeoJSON A TileLayer for GeoJSON tiles. Glen Robertson Non-map base layers Sometimes you don’t want to load a map, just big custom images. Really big ones. PluginDescriptionDemoMaintainer Leaflet.TileLayer.IIP Add support for IIPImage layers in Leaflet. Demo Emmanuel Bertin leaflet-fractal Renders some fractals (Mandelbrot set, Julia set and some others) using 2D canvas Demo Alexander Parshin Leaflet-IIIF A IIIF (International Image Interoperability Framework) viewer for Leaflet. Demo Jack Reed leaflet-rastercoords Renders large tiled images generated with gdal2tiles-leaflet. Image raster coordinates can be used to set markers, etc. Demo Commenthol TileLayer.DeepZoom A TileLayer for DeepZoom images. Al Farisi TileLayer.Gigapan A TileLayer for Gigapan images. Dan Sherman TileLayer.Zoomify A TileLayer for Zoomify images. Demo Bjørn Sandvik Tile/image display The following plugins change the way that tile or image layers are displayed in the map. PluginDescriptionDemoMaintainer Leaflet.Control.DetailLevel Display tiles at higher-than-retina (hdpi) resolutions, by real-time modification of the zoomOffset. Useful for mapping sources which drastically change map style between different zoom levels. Increasing the zoomOffset by too much does slow down the browser, as the number of displayed tiles grows exponentially with the zoomOffset. Demo Wessel Valkenburg Leaflet.Control.Opacity Make multiple tile layers transparent. Demo Yasunori Kirimoto Leaflet.Control.SideBySide A Leaflet control to add a split screen to compare two map overlays. Demo Digital Democracy leaflet-custom-headers Leaflet Custom Headers is an extension to L.TileLayer that allows you to add custom headers to HTTP requests when loading tiles. fifogipo Leaflet.DistortableImage Enable users to scale, rotate, and distort images on Leaflet maps. Demo Public Lab Leaflet.DistortableVideo Enable users to scale, rotate, and distort videos on Leaflet maps. Demo Roni Karilkar Leaflet.ImageOverlay.Arrugator Displays reprojected ImageOverlays, given four control points and a proj4js projection function. Demo Iván Sánchez Ortega Leaflet.ImageOverlay.Rotate Displays rotated, scaled and skewed (but not rubbersheeted) ImageOverlays, given three control points. Demo Iván Sánchez Ortega Leaflet.Multispectral Provides multispectral channel manipulation and processing tools (such as NDVI or other remote sensing methods) for Leaflet image layers using pure client-side JavaScript. It uses image-sequencer via an ImageOverlay filter() function. Demo Public Lab Leaflet.NonTiledLayers A Leaflet layer for non-tiled overlays. Demo PTV Logistics Leaflet.OpacityControls Simple Leaflet controls to adjust the opacity of a map layer. Demo Jared Dominguez leaflet-rotate Adds rotation functionality to leaflet map panes Demo Raruto Leaflet.TileLayer.Canvas Render tiles as canvas elements. GIAP Leaflet.TileLayer.ColorFilter A simple and lightweight Leaflet plugin to apply CSS filters on map tiles. Demo Cláudio Kawakani Leaflet.TileLayer.Colorizr A Leaflet TileLayer which can modify colors by RGBA code. Hinrich Riedel Leaflet.TileLayer.ColorPicker A Leaflet TileLayer with getColor(latLng). Demo Yuzo Matsuzawa Leaflet.TileLayer.GL Applies custom WebGL shaders to each tile in a tilelayer. Demo Iván Sánchez Leaflet.TileLayer.GLColorScale TileLayer that uses WebGL to colorize floating-point pixels according to a specified color scale. Demo David Schneider Leaflet.TileLayer.GLOperations WebGL TileLayer: Colorize floating-point pixels, mouse event handlers for pixel values, hillshading, contours, transitions, filter and do calculations on multiple layers. Demo Thorbjørn Horgen Leaflet.TileLayer.Mask A TileLayer with mask effect. Demo Yuzo Matsuzawa Leaflet.TileLayer.PixelFilter A TileLayer which can filter and replace pixels by RGB code. Demo GreenInfo Network TileLayer.BoundaryCanvas Allows you to draw tile layers with arbitrary polygonal boundary. HTML Canvas is used for rendering. Alexander Parshin TileLayer.Grayscale A regular TileLayer with grayscale makeover. Ilya Zverev Tile Load The following plugins change the way that tile layers are loaded into the map. PluginDescriptionDemoMaintainer Leaflet.EdgeBuffer Buffer tiles beyond the edge of the viewport, for Leaflet 1.0. Demo Alex Paterson Leaflet.FeatureGroup.LoadEvents FeatureGroup that supports the "loading" and "load" events (for v0.7.*). Demo G. Lathoud Leaflet.FunctionalTileLayer Allows you to define tile layer URLs using a function. Even works with asynchronous sources, using promises. Ishmael Smyrnow Leaflet.GridLayer.FadeOut Fades out grid layers and tilelayers when they are removed, making basemap changes smoother (for 1.0.0). Demo Iván Sánchez Leaflet.loading A simple control that adds a loading indicator as tiles and other data are loaded. Demo Eric Brelsford Leaflet.MultiTileLayer Allows to compose a TileLayer from several tile sources. Each source is active only on a defined set of zoomlevels. Mattias Bengtsson leaflet.offline Allow tiles to be stored in an database for offline access. Demo Allart Kooiman Leaflet.TileCorrection Allow tiles to be loaded in an different crs from map’s and start at a custom zoom. Allart Kooiman Leaflet.TileLayer.Fallback Replaces missing Tiles (HTTP 404 Not Found Error) by scaled up equivalent Tiles from lower zooms. Demo ghybs TileLayer.Cordova For use with Cordova/Phonegap, adds tile caching onto local device storage, switching between offline and online mode. Greg Allensworth TileLayer.PouchDBCached Allows all Leaflet TileLayers to cache into PouchDB for offline use. Demo Iván Sánchez Ortega Vector tiles Plugins to display vector tiles. PluginDescriptionDemoMaintainer Basemaps with Vector Tiles Vector Tiles plugin for Leaflet. Use the power of the MapTiler SDK to access their catalog of professionally created multi-lingual vector tile basemaps. You can also use it for vector tile data overlays. Demo J. Lurie | MapTiler geojson-vt Efficient library for slicing GeoJSON data into vector tiles on the fly. Mapbox Hoverboard Render vector tiles on canvas with leaflet (geojson, topojson, and protobuf). Compatible with Leaflet 0.7.x only. Demo Tristan Davies Leaflet.MapboxVectorTile A Leaflet Plugin that renders Mapbox Vector Tiles on canvas. Compatible with Leaflet 0.7.x only. Demo SpatialDev maplibre-gl-leaflet Loads a maplibre-gl-js map as a Leaflet layer MapLibre Leaflet.VectorGrid Display gridded vector data (GeoJSON or TopoJSON sliced with geojson-vt, or protobuf vector tiles) in Leaflet 1.0.0. Demo Iván Sánchez Leaflet.VectorTileLayer A Leaflet layer for displaying vector tiles. Very similar to Leaflet.VectorGrid except for styling: a single style can be specified for all layers while VectorGrid requires knowing layer names in advance. For Leaflet 1.0.0. Joachim Kuebart leaflet-geojson-vt Displaying the vector tiles of GeoJSON data on the fly on leaflet Demo Tek Kshetri protomaps-leaflet Lightweight vector map rendering + labeling and symbology for Leaflet (supporting pmtiles and pbf format) Demo Protomaps Overlay data The following plugins provide new ways of loading overlay data (GIS vector data): points, lines and polygons. Overlay data formats Dynamic data loading Synthetic overlays Data providers Overlay data formats Load your own data from various GIS formats. PluginDescriptionDemoMaintainer Leaflet.BetterFileLayer The definitive plugin to load your spatialized files into leaflet. Demo Gabriel Russo Leaflet.encoded Use encoded polylines in Leaflet. Jieter Leaflet.FileGDB Put an ESRI File GeoDatabase onto your map as a layer. Calvin Metcalf Leaflet.FileLayer Loads files (GeoJSON, GPX, KML) into the map using the HTML FileReader API (i.e. locally without server). Mathieu Leplatre Leaflet.geoCSV Leaflet plugin for loading a CSV file as geoJSON layer. Iván Eixarch Leaflet GPX GPX layer, targeted at sporting activities by providing access to information such as distance, moving time, pace, elevation, heart rate, etc. Demo Maxime Petazzoni Leaflet LayerJSON Simple way for transform any JSON data source in a Leaflet Layer, load JSON data in layer and minimize remote requests with caching system. Demo Stefano Cudini Leaflet.MultiMarkers A Leaflet plugin for displaying a large number of highly customizable markers, such as those from a CSV file read using Papa Parse. Demo mfhsieh Leaflet.Shapefile Put a shapefile onto your map as a layer. Demo Calvin Metcalf Leaflet-BetterScale A'
