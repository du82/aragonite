["https://leafletjs.com/2015/07/15/leaflet-1.0-beta1-released.html"]
title = "Announcing Leaflet 1.0 beta 1 - Leaflet - a JavaScript library for interactive maps"
full_description = '← Back to the list of blog posts Announcing Leaflet 1.0 beta 1 Posted on 15 July 2015 by Vladimir Agafonkin Over the past year, we set out on an ambitious quest to implement pretty much all the features Leaflet users have been asking for years, while heavily focusing on performance, code cleanup and stabilizing the API. It was an extremely challenging road with many bumps, but now we’re finally approaching the finish line. Today, I’m happy and proud to announce the release of Leaflet 1.0 beta 1, our first formal release after more than a year of work and a thousand commits by 36 contributors. What’s new 1.0 will be the best Leaflet release ever, bringing a huge amount of improvements and bugfixes. Highlights of the release include: huge performance improvements, especially for vector layers flyover animations (zooming and panning in a curve with map.flyTo) fractional zoom level support (map.setZoom(12.34)) much nicer tile loading with less flickering custom pane management (including multiple vector layer panes) better support for non-standard projections more accessibility features lots of bugfixes and stability improvements A much more detailed list of changes can be found in the changelog (beware, it’s a long read). Beta cycle and upgrading The release sports a number of minor breaking API changes, and some of the plugins will have to be updated. To make the upgrade less painful, we’re doing a short beta cycle before the final 1.0 to allow users and plugin developers to catch up to the changes while we find and fix remaining issues. A lot of effort since the last stable release has been put into refactoring. Many changes that we made are not visible to users, but make the source code much simpler and easier to understand and also open up many new possibilities for our wonderful community of plugin developers. Basically, half of Leaflet code was fully rewritten under the hood, and now the codebase is ready for some pretty extreme extensions (who just said “rotation” and “WebGL”?). We plan to write a comprehensive 1.0 upgrade guide before the release. Meanwhile, if something breaks after you upgrade to 1.0-beta, please look through the changelog. If you can’t find the corresponding breaking change, please file a GitHub issue. The API reference for 1.0 is temporarily available here. It’s built from Leaflet gh-pages-master branch — fixes and additions are welcome! Get the new release Test out the new release on your app, and help us catch remaining issues to bring the final 1.0 close to perfection! You can use our CDN: <link rel="stylesheet" href="http://cdn.leafletjs.com/leaflet-1.0.0-b1/leaflet.css" /> <script src="http://cdn.leafletjs.com/leaflet-1.0.0-b1/leaflet.js"></script> The release is also available through NPM, Bower, and GitHub download. Thank you I’m incredibly thankful to everyone who made this release possible — by using the library, spreading the word about it, reporting issues and sending your contributions. Your help is invaluable! Special thanks to Iván Sánchez, Yohan Boniface, John Firebaugh, Dave Leaver, Patrick Arlt, Per Liedman, Jake Wilson and Steve Kashishian for lots of amazing contributions and support throughout the last year. All these people are now a part of the core Leaflet team. Keep’em coming! Love, Vladimir.'
