title = "November 2005 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "56,7 km of snowy hell 56,7 km of snowy hell Orig­i­nal­ly uploaded by Kaeru.Last night I had to get from Den Bosch to Utrecht. Pub­lic trans­port decid­ed to break down, we had a crazy snow storm, and the longest traf­fic jam total in Dutch his­to­ry (over 800 km at it’s height). My only option: take a taxi. Togeth­er with a south kore­an busi­ness man, who’d already missed his flight four times, I was in traf­fic for over three hours over a trip that’s less than 60 kms long. Crazy, crazy stuff! Here’s some shots of a snowy A2. Posted on November 26, 2005July 21, 2008Categories ArticlesTags Info.nl, photos, travel, work5 Comments on 56,7 km of snowy hell Uitrengebied M’n meis­je schoot een foto van een mooi bord in Den Haag. De daaropvol­gende Google search was dikke pret! Tech­no­rati: uitrenge­bied, Den Haag Posted on November 18, 2005July 21, 2008Categories ArticlesTags fun, photos Visual Complexity A great site that col­lects all kinds of com­put­er gen­er­at­ed infor­ma­tion graph­ics. Via iaslash.org. Tech­no­rati: Visu­al Com­plex­i­ty, infode­sign, infor­ma­tion graphics Posted on November 17, 2005July 21, 2008Categories ArticlesTags design, information design, websites “Sim­ple and open wins” – Dick Hardt, OSCON 2005 Keynote — Iden­ti­ty 2.0 Posted on November 11, 2005July 21, 2008Categories ArticlesTags events, open standards, quotes, simplicity, web 2.0 Sxip — Indentity 2.0 I final­ly got around to watch­ing this great pre­sen­ta­tion on the future of iden­ti­ty on the web. The con­cept is explained in an excel­lent way and the style is dynam­ic and humor­ous. I’d love to pull of a pre­sen­ta­tion like this some day. Tech­no­rati: Sxip, pre­sen­ta­tion, open source, iden­ti­ty, web 2.0 Posted on November 11, 2005July 21, 2008Categories ArticlesTags identity, open source, open standards, presentations, web 2.02 Comments on Sxip — Indentity 2.0 Dan Please peo­ple. Lay off the Dan Brown. I can’t com­mute with­out see­ing at least one per­son read­ing a book of his. If you’re inter­est­ed in crack­pot the­o­ries about tem­plars, Jesus and San­gre­al – just pick up Holy Blood, Holy Grail (Brown stole bor­rowed all his Da Vin­ci Code ‘rev­e­la­tions’ from that book any­way). If you’re real­ly inter­est­ed in what con­spir­a­cy the­o­ries can do to a per­son, read Foucalt’s Pen­du­lum – a much, much bet­ter way to spend your time reading. Tech­no­rati: Dan Brown, books Posted on November 11, 2005July 21, 2008Categories ArticlesTags books, forteana, reading"
