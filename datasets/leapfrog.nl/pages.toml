["https://leapfrog.nl/blog/archives/2006/08"]
title = "August 2006 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "links for 2006-08-31 ChangeTh­is :: What is Open Source Marketing? A pret­ty cool man­i­festo (slight­ly dat­ed but still on top­ic) on the trans­for­ma­tion mar­ket­ing will have to go through if it wants to remain rel­e­vant in an open source world. (tags: open­source mar­ket­ing man­i­festo open­source­mar­ket­ing adver­tis­ing) Per­fect­ing Your Personas An intro­duc­to­ry piece on mak­ing the most of your per­sonas. Good overview / checklist. (tags: Coop­er per­sonas UX IxD user­ex­pe­ri­ence inter­ac­tion­de­sign goals) Posted on August 31, 2006Categories Links Geotagging on Flickr: flaky Flickr launched its geo­t­ag­ging feau­ture a few days ago. Today I came across a few rav­ing posts on Tech­n­Crunch, so I decid­ed to give it a go. I’ve been geo­t­ag­ging my pho­tos using Plazes for a while now (has it been more than a year already? This pho­to seems to prove as much.) I enjoyed doing that but it was always a bit involved. Also, geo­t­ag­ging becomes real­ly use­ful and fun once lots of peo­ple start doing it. That wasn’t real­ly hap­pen­ing yet so I’m excit­ed about Flickr inte­grat­ing it. My first impres­sion of their map-dri­ven inter­face was pos­i­tive. It’s tucked away in the orga­nize sec­tion though; I won­der whether they’ll include some bits in the indi­vid­ual pho­to pages soon. For instance: a lit­tle map show­ing the loca­tion where the shot was tak­en and an easy way to add geo­t­ags (maybe even allow oth­ers to do it for me?) I’d like this most­ly because now the map isn’t real­ly social (in the sense that it shows an aggre­ga­tion of geo­t­agged shots, just my own.) Update: I found the social fla­vored map here; a bit under­whelm­ing, but fun. How­ev­er: although Flickr proud­ly sports “gam­ma” at the top of its logo, the tech­nol­o­gy still lags behind. It’s beta qual­i­ty at best. New­ly tagged pho­tos don’t appear on the map after a reload; per­haps Flickr doesn’t like me chang­ing the tags out­side of the map inter­face? Update: edit­ting geo­pri­va­cy set­tings on batch­es gives back strange results too, these pho­tos should show up on the map some­where near Baarn, but they don’t. Weird… Also, I think not being able to “snap” a batch of pho­tos to a city I found through the search inter­face is a usabil­i­ty issue. Adding pho­tos to loca­tions I haven’t iden­ti­fied in Plazes (and thus don’t show up as hotspots on the map yet) becomes arbi­trar­i­ly. Call me a meta­da­ta nut, but I real­ly want to add my pho­tos of Jurjen’s pret­ty street Zwarte­hand­spoort in Lei­den to the exact street, not drop them some­where in the vicin­i­ty of the city Leiden. Con­clu­sion: a promis­ing addi­tion to every­one’s favourite social pho­to shar­ing site, poised to make geo­t­ag­ging ready for the big time, but not exact­ly there yet due to some tech­ni­cal and design issues. Anoth­er update: after rum­mag­ing through the help forums, I learnt that indeed, Flickr doesn’t automag­i­cal­ly pick up on new­ly geo­t­agged pho­tos from oth­er ser­vices (such as Plazes.) You need to re-import them (as described in this post). This sucks big time, Flickr seems to think that only pho­tos that have been tagged inside the sys­tem mat­ter. Think again! (Of course all this is prob­a­bly sim­ply due to tech­ni­cal lim­i­ta­tions, which is no excuse, but still…) Posted on August 30, 2006July 22, 2008Categories ArticlesTags bugs, Flickr, geotagging, photos, reviews, tagging5 Comments on Geotagging on Flickr: flaky"
