title = "November 2006 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "links for 2006-11-30 Stroomt Jour­nal — Edi­tie 2006.04 Evert Sto­bbe van SNS Bank over ‘Co-cre­ation economics’. (tags: co-cre­ation econ­o­my evert­sto­bbe SNS SNS­Bank Stroomt) The New York­er : fact : content In-depth pro­file of game design god Will Wright. Of par­tic­u­lar inter­est are the sources of inspi­ra­tion for his games and to read how one of the few indus­try lead­ing game design­er that has actu­al cre­ative free­dom is incred­i­bly iso­lat­ed at the same time. (tags: Will­Wright gamedesign games gam­ing sims sim­u­la­tions pro­files spore design) on social soft­ware (28 April 2004, Interconnected) Over two year old post by Matt Webb describ­ing all the aspects that go into explain­ing social soft­ware to non-experts and train­ing them in use and design. Lots of inter­est­ing leads to fol­low up on here. (tags: social­soft­ware Mat­tWebb resources primer iden­ti­ty pres­ence rela­tion­ships con­ver­sa­tions groups rep­u­ta­tion shar­ing) Bokar­do — Social Web Design » Digg’s Dis­in­cen­tive High­lights Social Design Issues Clearly Joshua Porter high­lights issues Digg is hav­ing with their design. They’ve changed an algo­rithm, and now the com­mu­ni­ty is push­ing back. Porter writes: “The issues are social ones, prob­a­bly unpre­dictable in any straight­for­ward way.” (tags: Joshua­Porter Digg social­soft­ware design algo­rithms gam­ing incen­tives social­me­dia) Posted on November 30, 2006Categories Links links for 2006-11-28 Pileus: The Flickr Umbrella “The wi-fi con­nect­ed umbrel­la with a built-in cam­era takes pic­tures and uploads them on to the pho­to-shar­ing web­site Flickr.com. Users can browse through pho­tos, as they would online, by twirling the umbrel­la to the left or right.” (tags: umbrel­la ubi­comp tan­gi­ble tan­gi­ble­com­put­ing ambi­ent ambi­ent­com­put­ing Flickr YouTube design via:iskander) Game Inter­ac­tion Design Pat­tern Library: Usability Repos­i­to­ry of game design pat­terns that enhance usabil­i­ty or acces­si­bil­i­ty. By Eelke Folmer, via the IxDA list. (tags: IxD inter­ac­tion­de­sign gamedesign pat­terns usabil­i­ty acces­si­bil­i­ty games gam­ing) Con­sumer Reports Web­Watch Inves­ti­ga­tions: Web Cred­i­bil­i­ty: How Do Peo­ple Eval­u­ate a Web Site’s Credibility? A large study on how peo­ple eval­u­ate a site’s cred­i­bil­i­ty shows that peo­ple pri­mar­i­ly base their judge­ment on visu­al design and use very few ‘hard’ cri­te­ria. This is espe­cial­ly true for sites of finan­cial ser­vices providers. (tags: cred­i­bil­i­ty research stud­ies visu­alde­sign) Posted on November 28, 2006Categories Links"
