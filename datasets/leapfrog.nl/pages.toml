full_description = "links for 2006-03-31 ABC News: Mis­sion Impos­si­ble: In Search of Strangers in New York City A nice exam­ple of game the­o­ry in action — 6 pairs of peo­ple try to find each oth­er in NYC. (tags: gamethe­o­ry psy­chol­o­gy NYC newyorkc­i­ty) Newsweek Cov­er Sto­ry Tack­les Social Search, Tag­ging and Relat­ed Issues — ResourceShelf Newsweek did a web 2.0 piece, LIS site ResourceShelf com­ments: “Some­one needs to tell the writ­ers of this sto­ry that tag­ging is not a taxonomy.” (tags: IA LIS Newsweek web2.0 tag­ging folk­sonomies social­soft­ware) Why UX Should Mat­ter to Soft­ware Com­pa­nies :: UXmatters Pabi­ni Gabriel-Petit makes the case for UX in soft­ware devel­op­ment: “The bar is set high­er than it’s ever been before. Invest­ing in user expe­ri­ence will help a com­pa­ny excel and ensure its success.” (tags: UX soft­ware inno­va­tion mar­ket­ing usabil­i­ty design devel­op­ment research) Dig­i­tal Web Mag­a­zine — Just Build It: HTML Pro­to­typ­ing and Agile Development A nice bal­anced piece on the advan­tages and dan­gers of pro­to­typ­ing and agile dev: “HTML pro­to­typ­ing and full-on agile devel­op­ment of Web appli­ca­tions are increas­ing­ly viable options that help min­i­mize com­mu­ni­ca­tion gaps and assump­tions and deliv­er more ac (tags: agile devel­op­ment pro­to­typ­ing agilede­vel­op­ment deliv­er­ables) idea­sonideas » Blog Archive » Design­ers must write “Design is not sole­ly visu­al. Those who believe it is, make an uncon­scious deci­sion to con­fine them­selves sole­ly to craft.” Via Bart. (tags: writ­ing design draw­ing com­mi­ca­tion) Dan Brown’s Greenonions.com » Web 2.0, refram­ing Web 1.0 Thought­ful analy­sis of the cur­rent web 2.0 hype by Dan Brown. Dis­cuss­es the “new” metaphors for the web (web as plat­form and web as net­work) and what it means for IA. (tags: IA metaphors web2.0) Posted on March 31, 2006Categories Links"
