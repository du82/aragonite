["https://leapfrog.nl/blog/archives/2005/09"]
title = "September 2005 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "Jesse James Garrett is coming to Amsterdam User Expe­ri­ence guru Jesse James Gar­rett will give a full day sem­i­nar on user expe­ri­ence design on Novem­ber 7 of this year. The entrance fee is a bit steep, but I’m sure it’ll be worth it. Accord­ing to Peter Boers­ma, the event is a must for IA’s and UX design­ers, so it’s hard to resist going! Blurb from the Adap­tive Path site: Using Jesse James Garrett’s renowned “Ele­ments of User Expe­ri­ence” and “Nine Pil­lars of Suc­cess­ful Web Teams” mod­els, you’ll learn how to design web­sites & prod­ucts that meet your users’ and your orga­ni­za­tion’s needs through apply­ing user-cen­tered design principles.I added this event to Upcoming.org! Tech­no­rati: Jesse James Gar­rett, UX, Adap­tive Path Posted on September 26, 2005July 21, 2008Categories ArticlesTags Adaptive Path, Jesse James Garrett, UX Loosdrecht Harms Sinaas­ap­pelka­non Orig­i­nal­ly uploaded by Kaeru.Uit­je met het werk was de bom. Vooral Har­m’s sinaas­ap­pelka­non was dikke pret! Posted on September 23, 2005July 21, 2008Categories ArticlesTags Harm, Info.nl, Loosdrecht, photos, sinaasappelkanon1 Comment on Loosdrecht Listen to Slemper on 3voor12 If you like elec­tron­i­ca (in the vein of Square­push­er, Aphex Twin and the like,) then you real­ly should check out the excel­lent Slem­per live set that is avail­able on 3voor12. His album is due out lat­er this year, I’m sure it’ll kick ass. Tech­no­rati: Slem­per, music, elec­tron­i­ca, 3voor12 Posted on September 20, 2005July 21, 2008Categories ArticlesTags 3voor12, electronica, music, Slemper3 Comments on Listen to Slemper on 3voor12 112711683005280332 This year the first Euro­pean Infor­ma­tion Archi­tec­ture Sum­mit will be held in Brus­sels, Bel­gium on Octo­ber 15–16. I’ll be there to present a poster togeth­er with Almar van der Krogt on an inter­est­ing nav­i­ga­tion con­cept we devel­oped for a large mar­ket­ing web­site. If you’re an IA, or are involved in the struc­tur­ing of infor­ma­tion for online media, then this is def­i­nite­ly the event for you! Update: added the tag ‘Euro IA Sum­mit 2005’ Tech­no­rati: IA, Infor­ma­tion Archi­tec­ture, IA Sum­mit, ASIS&T, Euro IA Sum­mit 2005, Euro IA 2005 Posted on September 19, 2005July 21, 2008Categories ArticlesTags ASIS&T, Euro IA Summit 2005, IA, IA Summit, information architecture2 Comments on 112711683005280332"
