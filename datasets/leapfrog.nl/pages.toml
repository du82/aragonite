["https://leapfrog.nl/blog/archives/2006/12"]
title = "December 2006 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "I’ve submitted an XTech 2007 proposal Togeth­er with Edgar, I’ve sub­mit­ted a pro­pos­al for the upcom­ing XTech 2007 in Paris, France. The talk we’re aim­ing for would basi­cal­ly be a large­ly war sto­ries from our work design­ing and devel­op­ing large scale web­sites that adhere to web stan­dards and acces­si­bil­i­ty guide­lines and are pub­lished and man­aged using an enter­prise CMS’s (such as Trid­ion, GX, IBM LWWCM or what have you). Not the sex­i­est of sub­jects, but one we’re well versed in and can give plen­ty of prac­ti­cal advice on. Feed­back from the review com­mit­tee is due Feb­ru­ary 2007. Wish us luck! Posted on December 21, 2006July 22, 2008Categories ArticlesTags accessibility, CMS, Info.nl, presentations, Talks, web standards, XTech links for 2006-12-20 Wire­less: Can mobile phones give you ‘pres­ence?’ — Tech­nol­o­gy & Media — Inter­na­tion­al Her­ald Tribune A short piece on mobile social soft­ware such as Jaiku. The writer took the trou­ble to inter­view some knowl­edge­able peo­ple such as Jyri Enge­strom and Danah Boyd. (tags: jaiku plazes social­soft­ware mobile) For­get WYSIWYG edi­tors — use WYSIWYM instead | 456 Berea Street Roger Johans­son looks at an alter­na­tive to WYSIWYG edi­tors that allows con­tent edi­tors to mark up text with mean­ing in stead of styling. Might help in keep­ing sites with CMS’s behind them accessible. (tags: wysi­wyg wysi­wym acces­si­bil­i­ty edi­tors cms markup seman­tics Roger­Jo­hans­son) Shirky: Com­mu­ni­ties, Audi­ences, and Scale “[…] one of the design chal­lenges for social soft­ware is in allow­ing groups to grow past the lim­i­ta­tions of a sin­gle, dense­ly inter­con­nect­ed com­mu­ni­ty while pre­serv­ing some pos­si­bil­i­ty of shared pur­pose or participation […]” (tags: ClayShirky social­soft­ware com­mu­ni­ties audi­ences scale groups growth) more social soft­ware (3 April 2003, Interconnected) I’m read­ing lots of ‘old’ stuff on social soft­ware late­ly. Here’s one piece by Matt Webb that gives a taste of how cut­ting edge this stuff was in 2003. (tags: social­soft­ware Mat­tWebb) slices of the (2 April 2003, Interconnected) Entries for learn­ing more on social soft­ware by Matt Webb. (tags: Mat­tWebb social­soft­ware) a quick some­thing on (22 Novem­ber 2002, Interconnected) Matt Webb on clas­si­fy­ing groups in push and pull, tel­ic and atelic. (tags: social­soft­ware Mat­tWebb) the idea of a social (19 Novem­ber 2002, Interconnected) “We can look at tech­nolo­gies that were suc­cess­ful with­out mean­ing to be, look at social envi­ron­ments that give results with being forced, and inves­ti­gate what fac­tors in the sub­strate made this pos­si­ble. And then, hope­ful­ly, build some ourselves.” (tags: social­soft­ware Mat­tWebb) lasts fri­days social (12 Novem­ber 2002, Interconnected) Post-social soft­ware sem­i­nar post. (tags: Mat­tWebb social­soft­ware) All about flow — (37signals) These descrip­tions of flow states sound famil­iar to me, most­ly from prac­tis­ing mar­tial arts. (tags: mar­tialarts flow gam­ing) Five steps to a bet­ter design port­fo­lio, by Jef­frey Veen Jef­frey Veen gives some point­ers on how to cre­ate a good portfolio. (tags: design port­fo­lios Jef­freyVeen how­to tips) Shirky: Sit­u­at­ed Software I’m reread­ing Shirky on social soft­ware. This piece describes how Clay’s think­ing was influ­enced by a class he taught at NYU. (tags: sit­u­at­ed­soft­ware social­soft­ware teach­ing edu­ca­tion com­mu­ni­ties ClayShirky) Shirky: Social Soft­ware and the Pol­i­tics of Groups On encod­ing soft­ware with polit­i­cal bar­gains and how that influ­ences the groups and users that use it. (tags: ClayShirky social­soft­ware pol­i­tics groups com­mu­ni­ties) Posted on December 20, 2006December 20, 2006Categories Links"
