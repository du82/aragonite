full_description = "Finished Florence The last few shots from Flo­rence are up. Here’s the first new one in the set. Now it’s on to Venice, almost done! Fun fact: Flo­ren­tine police use Seg­ways to get around the station! Posted on July 30, 2006July 22, 2008Categories ArticlesTags photos, travel, vacation links for 2006-07-29 Social­text Releas­es First Com­mer­cial Open Source Wiki | Social­text Enter­prise Wiki (tags: social­soft­ware social­text wiki open­source news) Black Belt Productivity A GTD blogs includ­ing inter­views with peo­ple’s expe­ri­ences with imple­ment­ing the system. (tags: blogs GTD inter­views) Get­ting Things Done Out­look Add-In Support A GTD-plu­g­in for Outlook. (tags: GTD Out­look plu­g­ins soft­ware tools pro­duc­tiv­i­ty) Thing­tag­ging: Pic­tures of objects Nifty; this site col­lects all thing­tagged objects on Flickr that are also reg­is­tered with Thinglink. (tags: thinglinks thing­tag­ging tag­ging inter­netofthings blog­jects mashup remix api) A to G A lit­tle app that exports your Mac address book to CSV and imports it to Gmail. (tags: Gmail adress­book Mac Apple soft­ware OSX tools appli­ca­tions) Posted on July 29, 2006Categories Links2 Comments on links for 2006-07-29 A few more shots of Florence Despite the heat and humid­i­ty this evening I got around sort­ing through a few more pho­tos tak­en in Flo­rence. Around 50 new ones have been added to the set. You can start at the first new one here. I’d like to treat you to a nice exam­ple of serendip­i­ty. Here’s a pho­to I took of some stained glass win­dows depict­ing the agnus dei: Now check out this pho­to by Rich Nur­combe… Weird. Posted on July 27, 2006July 22, 2008Categories ArticlesTags forteana, photos, travel, vacation, weirdness YouTube is a spam machine! Recent­ly, I was try­ing to import some con­tacts from Gmail to YouTube. After going through a Plaxo dia­log to select all my con­tacts, I assumed the next step would be to see who of those con­tacts were on YouTube. I thought wrong, in stead the ser­vice has e‑mailed every address I import­ed (almost 200) an invi­ta­tion to con­nect with me with­out my explic­it con­sent. Nat­u­ral­ly, I’m quite upset about the whole sit­u­a­tion and have decid­ed to at least offer my apolo­gies for both­er­ing any­one with this spam. If you’ve received a YouTube invi­ta­tion from frog1980 and thought it was inap­pro­pri­ate, I’m very sor­ry to have unwont­ed­ly both­ered you. Also, I hope some­one of YouTube reads this and will make it a point to recon­sid­er the way import­ing con­tacts works. Spam­ming my friends with­out my con­sent is not a cool thing to do. Posted on July 26, 2006July 22, 2008Categories ArticlesTags apologies, elsewhere, Gmail, Plaxo, spam, YouTube7 Comments on YouTube is a spam machine!"
