title = "October 2005 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "How Much Is YOUR Blog Worth? My blog is worth $1,693.62. How much is your blog worth? Fun­ny lit­tle cal­cu­la­tor to deter­mine the worth of your blog. Appar­ent­ly based on the Weblogs Inc. — AOL deal. Via Ben Met­calfe. Tech­no­rati: blog­ging, tech­no­rati, busi­ness Posted on October 31, 2005July 21, 2008Categories ArticlesTags blogging, business, fun, money1 Comment on How Much Is YOUR Blog Worth? Dutch Skies There’s plen­ty of pho­tos of the sky on Flickr, but lets be hon­est — skies and clouds are just so pret­ty, and the Dutch skies are the pret­ti­est of all. Tom thought the same, so he’s start­ed a group called ‘Hol­landse Lucht­en’ — Dutch Skies. Here’s my first con­tri­bu­tion. Tech­no­rati: sky, Flickr Updat­ed to cor­rect some typos. Posted on October 19, 2005July 21, 2008Categories ArticlesTags Flickr, friends, Netherlands, photos, skies1 Comment on Dutch Skies Claiming my feed at Feedster No Need to Click Here — I’m just claim­ing my feed at Feedster Posted on October 17, 2005Categories Articles Landing Pages: Merging Differences Our poster pre­sen­ta­tion at the Euro IA Sum­mit was a lot of fun. We had some good spir­it­ed dis­cus­sion on our con­cept of Land­ing Pages. If you’re inter­est­ed, have a look at the poster here (A4 PDF, 420 KB), or have a look at the shot on Flickr… Tech­no­rati: Euro IA 2005, Land­ing Pages Posted on October 16, 2005July 21, 2008Categories ArticlesTags downloads, Euro IA Summit 2005, IA, information architecture, landing pages, posters, presentations Keynote Speech – Andrew Dillon — Euro IA Summit 2005 Here’s my notes from Andrew Dil­lon’s keynote at the Euro IA Summit: Big IA has a future; lit­tle IA does not. Geen IA vs. UX – niet jezelf definiëren aan de hand van wat je niet bent. Data is stored, infor­ma­tion is expe­ri­enced. Design to lever­age nat­ur­al ten­den­cies. Din­gen hoeven niet direct bruik­baar te zijn. Web 2.0: van iets wat gemaakt is, naar iets wat je zelf maakt… User: from recip­i­ent to par­tic­i­pant, co-own­er and co-design­er. User Human. UX design – niet: this is how I like it. Weg bewe­gen van craft-based werk, geen con­sis­tente kwaliteit, geen sys­tem­atiek in werk, weinig vooruit­gang, bedreigd door snelle veran­derin­gen in omgev­ing. Ambi­gu­i­ty has it’s mer­its. You don’t have to strict­ly define it (IA). No more heroes, some peo­ple may even think Jakob Nielsen’s a lia­bil­i­ty… Organ­i­sa­tion, cura­tion and inter­ac­tion of infor­ma­tion. Cura­tion is a prob­lem. The archi­tec­tures are our the­o­ries. Find­abil­i­ty is the new usabil­i­ty – but where’s the archi­tec­ture in that? Beyond nav­i­ga­tion: pat­tern­ing, wrap­ping, anchor­ing, emer­gent struc­ture. ‘Virus of the mind’; infor­ma­tion breeds. Cohill, 1991, infor­ma­tion archi­tec­ture & the design project – IA as a new kind of project man­ag­er. Real design: respect expe­ri­ence – aug­ment life. Usabil­i­ty is a design val­ue, like accessibility. Tech­no­rati: Euro IA Sum­mit 2005, IA, Infor­ma­tion Archi­tec­ture, IA Sum­mit, Euro IA 2005 Posted on October 15, 2005July 21, 2008Categories ArticlesTags Euro IA Summit 2005, events, IA, information architecture, notes, presentations2 Comments on Keynote Speech – Andrew Dillon — Euro IA Summit 2005"
