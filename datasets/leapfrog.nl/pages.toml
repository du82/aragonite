title = "September 2006 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "links for 2006-09-29 The Sec­ond Life Her­ald » Look­ing up Taco Rubio at the Upskirt Museum Not safe for work, but pret­ty inter­est­ing: an inter­view with the guy / girl who set up a muse­um in SL exhibit­ing screen­shots of avatar’s privates. (tags: avatar sex games gam­ing mmog cul­ture sec­ondlife) Bokar­do — Social Web Design » 99% of Web Design Books are Not Joshua Porter points out that a lot of stuff that’s known under the name of web design is actu­al­ly more like web devel­op­ment. Design­ing for the web should be about design­ing for end-users not (like devel­op­ment) about solv­ing tech­ni­cal problems. (tags: design web­de­sign devel­op­ment web­de­vel­op­ment web Joshua­Porter web­dev) [BEEP]: Adding design process attrib­ut­es to patterns Col­league Peter con­tem­plates on what hap­pens when you add process attrib­ut­es to pat­terns. This could poten­tial­ly be a very pow­er­ful way of doing bot­tom-up planning. (tags: Peter­Boers­ma pat­terns process IA IxD) Collectivate.net — ‘jour­nalisms’ — The “elec­tric­i­ty” of future participation A first look at the future inter­net of things. Ques­tions the preval­ing opti­mism around the new social­i­ty between objects and humans. Good even hand­ed criticism. (tags: inter­netofthings blog­jects spimes every­ware ubi­comp tan­gi­ble­com­put­ing ambi­ent­com­put­ing find­abil­i­ty) The Prin­ci­pals of Play | Metrop­o­lis Magazine About the edu­ca­tion­al val­ue of games: “[V]ideo games are [not] good teach­ers, but […] play­ing good video games is often good learn­ing”. Also con­tains some inter­est­ing thoughts on games being at the fore front of IxD. (tags: learn­ing edu­ca­tion games gam­ing gamedesign play teach­ing) Cre­at­ing Con­tent Man­age­ment Cul­ture [PDF] Dan Brown describes how he went about chang­ing a com­pa­ny’s atti­tude towards con­tent man­age­ment and a new CMS. Short but sweet, nice and practical. (tags: .pdf con­tent­man­age­ment cul­ture cor­po­rate CMS IA infor­ma­tion­ar­chi­tec­ture tech­nol­o­gy) Posted on September 29, 2006Categories Links"
