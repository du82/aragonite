["https://leapfrog.nl/blog/archives/2006/02"]
title = "February 2006 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "Edgeio launches Devel­op­ment of an open plat­form for list­ings con­tin­ues with yes­ter­day’s launch of Edgeio. This ser­vice picks up on blog post that are marked as a list­ing using a Micro­for­mat-like tag and col­lects them on a web­site for users to search through. They have some nifty inter­faces in place to allow you to zoom in on list­ings that are close to you. One thing they haven’t addressed yet (but are aware of) is the prob­lem of fake list­ings and spam. Struc­tured Blog­ging is work­ing in the same field, but from a dif­fer­ent angle (focussing on the blog­gers, not the site that col­lects list­ings). I wrote about them ear­li­er over here (in Dutch). The biggest chal­lenge for the Edgeio crew is prob­a­bly gain­ing crit­i­cal mass to be able to com­pete with the likes of eBay. Every­one was blog­ging about this yes­ter­day, here are some of the posts: TechCrunch » Edgeio Launches Read/WriteWeb: edgeio launch­es with same goals as Struc­tured Blogging WeBreak­Stuff » Edgeio launches GigaOM : » Edgeio Launch­es, Finally Rus­sell Beat­tie Note­book — Play­ing with EdgeIO Posted on February 28, 2006July 21, 2008Categories ArticlesTags blogging, Edgeio, microformats, semantic web, tagging, web 2.01 Comment on Edgeio launches Rojo redesign revisited Are Rojo read­ing my blog? In any case, they’ve fixed the issue I talked about ear­li­er in this post. Huz­zah! Posted on February 28, 2006July 21, 2008Categories ArticlesTags blogging, Rojo, usability links for 2006-02-28 Trust and Blame :: UXmatters Whit­ney Que­sen­bery crash­es his Palm and won­ders: who’s to blame? Should design­ers take respon­si­bil­i­ty for the con­se­quences of prod­ucts that break down? (tags: trust blame UX Palm mobile user­ex­pe­ri­ence respon­si­bil­i­ty) Posted on February 28, 2006Categories Links links for 2006-02-27 Pig­Pog­P­DA | PigPog Get­ting things done using a Mole­sk­ine Pock­et Reporter and a vari­a­tion on the GTD sys­tem. I won­der if I’m dis­ci­plined enough to do this. (tags: pro­duc­tiv­i­ty GTD mole­sk­ine notes) Posted on February 27, 2006Categories Links"
