full_description = "Off to Indonesia Well, tomor­row I’m off to Indone­sia. I’ll be there for four whole weeks! Hell yeah. :-D Our (me and my girlfriend’s) trav­el plans include Sin­ga­pore, Java, Bali, Lom­bok and Sulawe­si. Per­haps I’ll post some news here now and again when I’m check­ing my e‑mail in an inter­net shack. Or maybe I’ll upload some pho­tos to Flickr. We’ll see! I’ll leave you now with a pho­to from last year’s trip to the ‘gordel van smaragd’. Tech­no­rati: Indone­sia, vaca­tion, trav­el Posted on July 29, 2005Categories Articles Delicious Library This post at Engad­get lead me to Deli­cious Library. A Mac app that lets you scan bar­codes on your books and games and such using a web­cam. It then cre­ates a cat­a­logue of all your stuff and does all kinds of cools stuff with it, such as give you rec­om­men­da­tions, and let you track which books you’ve loaned to your friends. There’s an inter­view with the mak­ers too, includ­ing a look at how the UI evolved, but it’s offline right now. Too bad… Tech­no­rati: Deli­cious Library, inter­view, UI, inter­face Posted on July 28, 2005April 21, 2008Categories ArticlesTags Delicious Library, interface, interview, UI Keys to effective meetings Mae­da has four com­mon sense but good advice on how to make the most of your meet­ings. Tech­no­rati: meet­ings, advice, how to, man­age­ment Posted on July 28, 2005Categories Articles Blinksale I just signed up for a free account at Blinksale, the light weight billing app from Firewheel Design, and I must say: it looks real­ly nice. The UI is clean, clean, clean. I’m going to study this and refer to it for exam­ples for a long, long time… Tech­no­rati: Blinksale, UI, Firewheel Design, inter­face Posted on July 27, 2005Categories Articles2 Comments on Blinksale Putpixel Just a quick link to a new blog that’s popped up: my old Utrecht School of Arts bud­dy Jac­co has start­ed chron­i­cling his cre­ation of some badass ‘Aleph‑X’ ampli­fiers. Great stuff! Tech­no­rati: Aleph‑x, ampli­fiers, Jac­co Flen­ter, Put­pix­el Posted on July 25, 2005Categories Articles"
