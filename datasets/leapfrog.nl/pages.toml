["https://leapfrog.nl/blog/archives/2006/10"]
title = "October 2006 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "links for 2006-10-28 Wired News: Next Game Con­troller: Your Phone Report on research into aug­ment­ed real­i­ty games using mobile phones, such as AR Ten­nis. It’s clear these types of games have a future, pro­vid­ed they’ll move away from simulation. (tags: Wii games nin­ten­do mobi­legam­ing mobile gamedesign aug­ment­e­dreal­i­ty AR blue­tooth) Wel­come to Scrybe I love the accent on this video of a new pro­duc­tiv­i­ty app that looks pret­ty promis­ing. Lots of zoom­ing inter­face stuff going on, as well as plen­ty of thought on mod­ern knowl­edge work­ers’ needs for cross-plat­form infor­ma­tion sharing. (tags: info­cloud pro­duc­tiv­i­ty zoom­ing inter­face appli­ca­tions Scrybe GTD) Design­ing the Com­plete User Expe­ri­ence (PDF) Slides of the pre­sen­ta­tion Veen gave on d.Construct 2006. Still look­ing for the pod­cast, but there’s some nice insights on mov­ing beyond usabil­i­ty here regardless. (tags: .pdf Jef­freyVeen usabil­i­ty user­ex­pe­ri­ence UX pre­sen­ta­tions) Mobile games plat­forms explained Well writ­ten and acces­si­ble primer on mobile game for­mats or plat­forms. Not many techy details, but just enough info to get the ley of the land. (tags: mobi­legam­ing mobile plat­forms for­mats primer overview) Mobile news, Can mobile play­ers mobi­lize gam­ing?, Pock­et Gamer Short news item on the Open Mobile Spec­i­fi­ca­tion, which could solve a num­ber of mobile game devel­op­ment woes. Basi­cal­ly the spec will lessen the need for com­pat­i­bil­i­ty test­ing, which is good. (tags: Open­Mo­bile­Spec­i­fi­ca­tion OMS mobile mobi­legam­ing gam­ing plat­forms for­mats) Gama­su­tra — Mobile Edi­to­r­i­al: A Vision of Mobile Gam­ing in 2016 Geeky edi­to­r­i­al paint­ing a pic­ture of the future of mobile enter­tain­ment, where the mobile device will be the media hub of the home, espe­cial­ly in less devel­oped coun­tries. Seems to trans­plant the media cen­tre dream to the mobile plat­form, I’m not convinc (tags: GEC plat­forms mobile gam­ing enter­tain­ment mobi­legam­ing future trends) The Big Here (Kevin Kel­ly — Help Wanted) Kevin Kel­ly presents the Long Now’s cousin: the Big Here. Con­tains a list of ques­tions to deter­mine how aware you are of your sur­round­ings and its work­ings. Also con­tains the idea of a cool tool that would help you to answer these questions. (tags: long­now bighere KevinKel­ly loca­tion mobile local aware­ness envi­ron­ment) Posted on October 28, 2006Categories Links"
