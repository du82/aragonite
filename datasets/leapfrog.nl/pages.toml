full_description = "Web 2.0 redux “Web 2.0 means get­ting bought by Yahoo.”- Pro­jec­tion­ist: A tumblelog Posted on December 12, 2005July 21, 2008Categories ArticlesTags fun, quotes, web 2.0, Yahoo! Yahoo! buys del.icio.us Wow. Yahoo! con­tin­ues on it’s shop­ping spree. Now they’ve bought social book­mark ser­vice del.icio.us. I guess I’m just glad I’ve already got an account with del.icio.us — oth­er­wise I’d have to strug­gle through Yahoo!‘s hor­ri­ble sign up process… Con­grats, del.icio.us! Post on Yahoo! Search blogPost on del.icio.us blogPost on Plasticbag.orgPost on You’re It! Update: Dan Saf­fer writes about all the users bemoan­ing the takeover. Posted on December 10, 2005July 21, 2008Categories ArticlesTags del.icio.us, news, web 2.0, Yahoo! Web 2.0 Web 2.0, prop­er noun The name giv­en to the social and tech­ni­cal sophis­ti­ca­tion and matu­ri­ty that mark the— Oh, screw it. Mon­ey! Mon­ey mon­ey mon­ey! Mon­ey! The money’s back! Ha ha! Mon­ey! — The Dev­il’s Dic­tio­nary (2.0) Tech­no­rati: Web 2.0, humor, mon­ey Posted on December 8, 2005July 21, 2008Categories ArticlesTags fun, humor, quotes, web 2.0 Screens in train!? Screens in train!? Orig­i­nal­ly uploaded by Kaeru.NS (Dutch Rail­way) decides TV screens are the best way to sell WiFi on board of their trains. Sigh… Posted on December 7, 2005July 21, 2008Categories ArticlesTags NS, photos, travel, WiFi Xbox 360 Xbox 360 Orig­i­nal­ly uploaded by Kaeru.Last thurs­day I got to try out the new Xbox 360 before it launched in the Nether­lands. The wire­less con­troller was nice, the graph­ics of both games I tried were as good as was to be expect­ed. But sad­ly — no inno­va­tions in game­play. I would’ve loved to see some mas­sive online games in action. That had to wait to after the launch of course. Some more shots over at Flickr. Posted on December 4, 2005July 21, 2008Categories ArticlesTags gaming, Microsoft, photos, Xbox 360"
