["https://leapfrog.nl/blog/archives/2007/01"]
title = "January 2007 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "links for 2007-01-30 Dan Brown’s Greenonions.com » Quick n’ dirty Visio callout Found this a while back and am still using it (albeit slight­ly tweaked; I’m not using a cir­cle but an auto-siz­ing round­ed box). Handy for quick first pass annotations. (tags: doc­u­men­ta­tion Visio wire­frames pro­to­typ­ing how­to call­outs) Posted on January 30, 2007Categories Links links for 2007-01-27 GigaOM » … but will Spore sell? I do think Will Wright’s new game will sell. Maybe not as much as The Sims, but cer­tain­ly more than Black & White. Time will tell… (tags: spore thes­ims sim­c­i­ty Will­Wright games gam­ing gamedesign sales mar­ket­ing busi­ness sim­u­la­tions) Keep­ing Pace with Change — Box­es and Arrows: The design behind the design A look at Intu­i­tect, IxD and IA soft­ware which sounds pret­ty good. It’s an add-on for Visio, which I actu­al­ly don’t like, because I’ve nev­er liked work­ing in it (although I do it a lot). (tags: Visio Intu­i­tect IxD IA soft­ware reviews doc­u­men­ta­tion tools wire­frames flow­charts sitemaps dia­grams) Life With Alacrity: Dun­bar Triage: Too Many Connections A piece on strate­gies for cop­ing with too many con­nec­tions in your social net­work, both cul­tur­al and tech­ni­cal. It’s clear there’s no easy solu­tion for man­ag­ing a large social network. (tags: social­net­works social­soft­ware dun­bar dun­bar­num­ber com­mu­ni­ties) Life With Alacrity: Dun­bar, Altru­is­tic Pun­ish­ment, and Meta-Moderation “in any group process look for the com­mons, allow par­tic­i­pants to par­tic­i­pate in iden­ti­fing defec­tors; deter­mine what the costs are for such iden­ti­fi­ca­tion […] and encour­age par­tic­i­pa­tion in the com­mon good by pun­ish­ing those who do not par­tic­i­pate in s (tags: dun­bar coop­er­a­tion col­lab­o­ra­tion social­soft­ware social­net­works dun­bar­num­ber rep­u­ta­tion par­tic­i­pa­tion mod­er­a­tion com­mu­ni­ties) Life With Alacrity: Cheers: Belong­ing­ness and Para-Social Relationships A piece on how humans have a need to feel like they belong to a group and how they can have rela­tion­ships with fic­ti­tious per­sons (para-social rela­tion­ships). This can influ­ence the amount of ‘real-world’ con­tacts you are able to keep track of. (tags: dun­bar­num­ber dun­bar social­soft­ware belong­ing­ness rela­tion­ships social­net­works) Life With Alacrity: Dun­bar & World of Warcraft Analy­sis of group sizes in World of War­craft and oth­er MMOGs. Dif­fer­ence in size sug­gests dif­fer­ent costs of main­tain­ing rela­tion­ships and returns from being part of a group. (tags: MMOGs mmorpgs social­soft­ware social­net­works com­mu­ni­ties games gam­ing dun­bar dun­bar­num­ber play WoW) Life With Alacrity: Dun­bar Num­ber & Group Cohesion More analy­sis of groups in MMOGs: “keep­ing a large group cohe­sive requires sig­nif­i­cant­ly more time in social “groom­ing”.” (tags: cohe­sion groups MMOGs mmorpgs col­lab­o­ra­tion coop­er­a­tion social­soft­ware social­net­works games gam­ing play) Posted on January 27, 2007Categories Links"
