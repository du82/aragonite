title = "May 2006 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "links for 2006-05-30 Long Now Dis­cuss > View top­ic — 02006–04-14 > Jim­my Wales — Vision: Wikipedia and the … Jim­my Wales talks about the vision behind wikipedia and the future of free cul­ture at the Long Now Foundation. (tags: com­mu­ni­ty freecul­ture wiki wikipedia open Jim­my­Wales Long­Now­Foun­da­tion) Posted on May 30, 2006Categories Links MacBook at a glance So today I dropped by both Apple stores that have recent­ly sprung up in the cen­tre of my home­town to check out the new Mac­Book. My thoughts in a nutshell: The shiny screen isn’t as shiny as the xblack ones on Sony’s Vaios, I actu­al­ly kind of liked it. The mat­te fin­ish on the black Mac­Book real­ly does get all oily and smudgy, like Derek already point­ed out a while ago. The new key­board looks great. The spac­ing between the keys doesn’t both­er me since I have big hands, but the flat sur­face of the keys is an annoy­ance. Inter­est­ing­ly, the guy at the shop told me that the new key­board is sup­posed to pre­vent the keys from touch­ing the screen when closed – which is the only real prob­lem I have with my cur­rent 12” iBook G4. All in all it looks like a real­ly sweet piece of hard­ware. Nev­er­the­less I think I’ll wait to see what prob­lems spring up with the first gen­er­a­tion and when those are fixed, prob­a­bly take the plunge. Posted on May 28, 2006July 22, 2008Categories ArticlesTags Apple, MacBook, reviews2 Comments on MacBook at a glance links for 2006-05-20 How Amer­i­can are Star­tups? (plasticbag.org) Coates com­ments on Paul Gra­ham’s XTech talk. Is his take on star­tups esse­nial­ly a polit­i­cal one, or does it spring from expe­ri­ence? Coates thinks the lat­ter is the case and goes on to explore suit­able places for star­tups to spring up. (tags: star­tups paulgra­ham Tom­Coates busi­ness cul­ture europe unit­ed­states us cal­i­for­nia sil­i­con­va­l­ley) apophe­nia: anti-social net­works legislation Danah Boyd wor­ries about new leg­is­la­tion that bans youth from access­ing social media sites. Are there organ­i­sa­tions aimed at defend­ing social soft­ware users’ rights? (tags: rights leg­is­la­tion youth social­soft­ware social­me­dia social­net­works social­book­mark­ing cul­ture law pol­i­tics social) :Ben Met­calfe Blog » Blog Archive » Fol­low up to New Sci­en­tist arti­cle on Mashups Met­calfe objects to a New Sci­en­tist arti­cle focussing on the secu­ri­ty prob­lems with mashups. He thinks that mashups are too exper­i­men­tal for them to be con­cerned about hack­ers and such. Reg­u­la­tion would only sti­fle their devel­op­ment at this stage. (tags: mashups secu­ri­ty new­sci­en­tist hack­ing reg­u­la­tion Ben­Metcalfe) Flickr me news­pa­pers | And all that Malarkey Malarkey wants you to upload exam­ples of news­pa­pers to Flickr and tag them newspapertypography. (tags: news­pa­per­ty­pog­ra­phy news news­pa­pers typog­ra­phy Flickr) TechCrunch » Blog Archive » Google Note­book Launch­es: Ho-Hum Michael Arring­ton reviews Google Note­book and won­ders why they haven’t includ­ed tag­ging. My guess is they’ve delib­er­ate­ly gone with a sin­gle cat­e­go­ry per post-scheme to set GN apart from the com­pe­ti­tion. How­ev­er, I agree that this results in a far greater (tags: Google GoogleNote­book del.icio.us social­book­mark­ing tag­ging tags cat­e­gori­sa­tion cat­e­gories IA usabil­i­ty) Sim­pleBits | Intro­duc­ing Cork’d Dan Ceder­holm talks about his recent­ly launched project Cork’d — a social wine tast­ing site. Great idea, nice clear design, I’ve signed up and will give it a try soon. (tags: Cork’d devel­op­ment design social wine) Mac­world: First Look: Apple’s new MacBook A review of the new Mac­Book. Peo­ple seem to dis­agree whether the fol­low­ing are improve­ments: shiny screen, new spaced out keys and mat­te fin­ish on the black mod­el. I’ll check them out myself soon. (tags: apple lap­top review mac mac­book) Posted on May 20, 2006Categories Links"
