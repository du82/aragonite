full_description = "Mobile gaming directions Yes­ter­day we had anoth­er fun and inter­est­ing IA Cock­tail Hour. Thanks to the kind folk at Media Cat­a­lyst for the hos­pi­tal­i­ty and Olly and Boyd for their pre­sen­ta­tions. I thought I’d put up the slides of my short talk on where I think (non-con­sole) mobile gam­ing is or should be head­ed. I’ve added some notes, so there’s more than just pret­ty pic­tures to look at. If you have any thoughts to share, don’t hes­i­tate to do so! Posted on June 30, 2006July 22, 2008Categories ArticlesTags gaming, IA, information architecture, mobile, presentations1 Comment on Mobile gaming directions links for 2006-06-29 Jef­frey Zeld­man Presents : Flick’d Away Zeld­man has a nasty expe­ri­ence with Flickr. He seems to have missed the noti­fi­ca­tions Flickr sends out before your account expires, but I do agree that hid­ing all but the most recent 200 pho­tos is a bit sil­ly. It always annoyed me. (tags: Flickr usabil­i­ty) TechCrunch » Blog Archive » Automat­tic now offers enter­prise Word­Press support Automat­tic offers Word­Press sup­port and cus­tomiza­tion to enter­prise users. Inter­est­ing con­struc­tion. I’ve been involved in set­ting up a few Word­Press blogs in an enter­prise con­text and cus­tomiza­tion was one of the main issues we came up against. (tags: Word­Press enter­prise Automat­tic sup­port cus­tomiza­tion blog­ging) Posted on June 29, 2006Categories Links1 Comment on links for 2006-06-29 links for 2006-06-28 D*I*Y Plan­ner Hip­ster PDA Edi­tion | D*I*Y Planner Excel­lent tool for get­ting organized. (tags: GTD pro­duc­tiv­i­ty Mole­sk­ine) Putting peo­ple first » Play Today — an Expe­ri­en­tia report on the lat­est trends in elec­tron­ic toys and games A report on the state of elec­tron­ic play. Via Peter. (tags: gam­ing play games research report) Posted on June 28, 2006Categories Links More Rome photos I final­ly had the sta­mi­na to go throught the rest of my Rome pho­tos. Anoth­er near 50 shots are in the set over at Flickr now. Next up is Florence! Here’s my favorite of this batch: Posted on June 25, 2006July 22, 2008Categories ArticlesTags photos, travel, vacation"
