title = "Leapfrog. Kars Alfrink's home on the web, since 2000."
description = "Dr. Kars Alfrink's personal website - Postdoctoral researcher at TU Delft focusing on contestable AI"
full_description = "Dr. Kars Alfrink is a postdoctoral researcher at TU Delft, focusing on contestable AI. His research investigates how to design public artificial intelligence systems so that they remain subject to societal control. Before entering academia, Kars spent more than 15 years as an interaction design consultant, entrepreneur, and community organizer, experiences that now shape his research. He combines extensive practical expertise in digital product design with critical sociopolitical theory to create more democratic public AI systems. His current work examines the relationship between AI contestability and digital infrastructure sovereignty. By exploring data centers and computing resources, Kars investigates how societies can achieve meaningful independence from global tech oligopolies while addressing the practical and political implications of limited compute. This research builds on his previous investigations into contestable AI systems, expanding the focus from application-level interventions to issues of infrastructure ownership and control. His project ‘People’s Compute’ explores how constructive human-computer interaction design research methods can be adapted to study the politics of AI infrastructure and collective self-determination. Before his academic career, Kars cofounded and codirected Hubbub, a boutique design agency specializing in playful design. His commitment to social justice in technology led him to cofound Tech Solidarity NL, a grassroots community of Dutch tech workers advocating for more just and equitable technology. He also initiated the Dutch edition of This Happened, a series of events focused on the stories behind interaction design. Kars holds a PhD from TU Delft (2024) and an MA in interaction design from the Utrecht School of the Arts (2002). He is based in Utrecht, the Netherlands. Kars can be found online at the usual places, including Bluesky, Mastodon, and LinkedIn. Send email to ‘kars’ care of this domain."
