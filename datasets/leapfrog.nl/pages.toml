title = "June 2005 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "MIT Weblog Survey Tech­no­rati: MIT, weblog, sur­vey Posted on June 30, 2005July 21, 2008Categories ArticlesTags blogging, surveys Dutch ABC spotted! At first I was quite scep­ti­cal about the exis­tence of our (The Nether­lands’) very own Alien Big Cat, but now, both pho­tos and videos have surfaced. Pan­tera, a foun­da­tion ded­i­cat­ed to the defence of big cats in Europe, have made it their mis­sion to find and cap­ture the alleged puma (which they’ve named ‘Win­nie the Poohma’) roam­ing the ‘Hoge Veluwe’ alive. As opposed to Dutch police, who just want to shoot the ani­mal, because it pos­es too great a threat to the public. Look­ing at the film and pic­tures, to my untrained eye it does appear that the ABC is feline. How­ev­er, I have my doubts about its size. The images have been tak­en at a con­sid­er­able dis­tance, and there is hard­ly any­thing to in the sur­round­ings to com­pare the cat against. Also, some experts have spo­ken out, say­ing that the ABC can’t be a puma, because it’s the wrong col­or. Love how that works: first there is no puma, because there’s no hard evi­dence. Now there’s evi­dence, but the cat’s no puma, because the color’s wrong! Anoth­er inter­est­ing fact is that Dutch author­i­ties are study­ing the video made by Pan­tera, to make sure they’re no fake. The same author­i­ties that have been putting expen­sive per­son­nel on the Hoge Veluwe for days, to pro­tect the public! Tech­no­rati: ABC, alien­big­cats, forteana, cryp­to­zo­ol­o­gy Posted on June 28, 2005July 21, 2008Categories ArticlesTags ABC, cryptozoology, forteana, news Geslaagd! Mijn broert­je is ges­laagd. Hij studeerde grafisch ontwer­pen aan de WDKA in Rot­ter­dam. Zijn twee afs­tudeer­pro­jecten zijn vet: Een extreem min­i­male huis­sti­jl voor de Europeesche Unie, bestaande uit (bij­na) blan­co brief­pa­pi­er, envelop­pen, kaart­jes etc. en een grote bos sjablo­nen waarmee je de dragers zelf van invulling kan voorzien. Het paspoort geeft uit­leg over alle sjablo­nen. Mooi! Een samen met een studiegenoot ver­vaardigd mag­a­zine rond het the­ma “Rot­ter­dam Water­stad”, welke ver­vol­gens ver­scheurd is en in oran­je plas­tic bak­ste­nen in de Maas is gegooid. Van de actie hebben ze en video gemaakt, en is ver­slag gedaan in het Rot­ter­dams stadsnieuwsblad. Foto’s van de diplo­ma-uitreik­ing en het werk van Ties op Flickr. Tech­no­rati: Ties Alfrink, WDKA, Willem de Koon­ing Academie Posted on June 28, 2005July 21, 2008Categories ArticlesTags design, family, photos"
