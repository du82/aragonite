full_description = "links for 2006-04-28 Phaidon Design Clas­sics — Phaidon Press Incred­i­ble book con­tain­ing 999 design clas­sics. Must have, to buy, etc. (tags: book design clas­sics tobuy art) talks (21 April 2006, Interconnected) Huz­zah! Matt Webb will be speak­ing at Reboot 8. His talk was one of the high­lights last year, look­ing for­ward to his talk on “Mak­ing Senses”. (tags: sens­es Mat­tWebb reboot reboot8 con­fer­ences) Fla­men­co Home The appar­ent grandad­dy of facetted nav­i­ga­tion sys­tems has gone open source. Some of the demo’s are real­ly nice exam­ples of the pow­er of facets. (tags: facets search nav­i­ga­tion IA open­source infor­ma­tion­ar­chi­tec­ture) Mediamatic.net — Read­er for RFID Workshop “Radio fre­quen­cy iden­ti­fi­ca­tion is a tech­nol­o­gy that is now rapid­ly devel­op­ing. […] to what uses can this tech­nol­o­gy be applied that are not in the logis­ti­cal realm? […] This read­er com­piles a num­ber of resources on the tech­ni­cal and philo­soph­i­cal asp (tags: read­er RFID mobile tech­nol­o­gy phi­los­o­phy) Posted on April 28, 2006Categories Links links for 2006-04-26 Wiley::Mobile Inter­ac­tion Design This book looks inter­est­ing, a look at what it means to do inter­ac­tion design for the mobile plat­form. I’ve read the first chap­ter. The style is slight­ly aca­d­e­m­ic and the approach is quite comprehensive. (tags: mobile IxD inter­ac­tion­de­sign books tobuy) Posted on April 26, 2006Categories Links Random brick writings An awe­some ran­dom phe­nom­e­non in Woer­den, the Nether­lands: Just after mov­ing into his new vil­la, André van Zuilen noticed the word “dick” on the front of his house. An act of van­dal­ism by a dis­grun­tled con­struc­tion work­er or coincidence*? Orig­i­nal arti­cle in Dutch over at AD.nl. Via Edwin. We all know there’s no such thing as a coin­ci­dence right? Posted on April 24, 2006July 22, 2008Categories ArticlesTags bricks, forteana, news, weirdness2 Comments on Random brick writings"
