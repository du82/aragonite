["https://leapfrog.nl/blog/archives/2005/08"]
title = "August 2005 - Leapfroglog"
description = "A weblog by Kars Alfrink."
full_description = "Flickr Magazine More fun with Flickr! Cre­ate your own mag­a­zine cov­er from a Flickr pho­to. Via the great Flick­r­Blog. Tech­no­rati: Flickr Posted on August 31, 2005Categories Articles4 Comments on Flickr Magazine Singapore Sin­ga­pore Orig­i­nal­ly uploaded by Kaeru.The first batch of pho­tos tak­en dur­ing my vaca­tion are up. I’ve put 35 shots of Sin­ga­pore in the Indone­sia 2005 set. Enjoy! Posted on August 30, 2005Categories Articles Pervert Een meis­je wordt sex­ueel gein­timideert in een NYC metro. Wat doet ze? Ze pakt haar cam­er­a­phone, neemt een foto van hem en zet deze op Flickr. Wie had gedacht dat deze pho­to­shar­ing com­mu­ni­ty ooit gebruikt zou wor­den als opsporingsmedium… Tech­no­rati: Flickr Posted on August 30, 2005Categories Articles Waar is Kars? Pret met Plazes. Je kan nu een where is… pag­i­na mak­en. Bek­ijk de mijne hier: http://beta.plazes.com/whereis/Kars/ Tech­no­rati: Plazes Posted on August 30, 2005Categories Articles2 Comments on Waar is Kars? Play Play Orig­i­nal­ly uploaded by Kaeru.Terug in NL! Ben druk door de 1000+ foto’s heen aan het neuzen voor een def. “Indone­sia 2005”-set maar deze kon ik jul­lie niet onthouden. :-) Posted on August 28, 2005Categories Articles Guantanamo Plaze Wow. A new plaze over at Plazes: Guan­tanamo Bay Naval Sta­tion. More evi­dence that this way cool loca­tion based ser­vice is tak­ing off… Tech­no­rati: Plazes Posted on August 28, 2005Categories Articles3 Comments on Guantanamo Plaze Ulu Watu monkey Ulu Watu mon­key Orig­i­nal­ly uploaded by Kaeru.Anoth­er sam­ple of my vaca­tion snaps. When I get back I’ll spend some time mak­ing a nice selec­tion to upload to Flickr. For now the mon­key’ll have to do. Posted on August 26, 2005Categories Articles Laatste dagen Ik maak me klaar om terug te gaan. Zit nu in een inter­net­café in Tun­jun­gan Plaza, een grote mall. Van­mid­dag gaan we nog even langs een fotograaf voor gezel­lige groeps­fo­to’s, en vanavond wordt er eerst naar de kerk gegaan en daar­na gegeten en gezon­gen in een karaoke-bar. Dikke pret dus. Mor­gen vliegen we rond drie uur ‘s mid­dags uit Surabaya naar Jakar­ta. Van­daar naar Sin­ga­pore en ver­vol­gens de lange, lange vlucht naar A’dam. Gelukkig heeft SA hippe in-flight enter­tain­ment con­soles, waar je uit maar­lief­st der­tig ver­schil­lende films kan kiezen om ze ver­vol­gens wan­neer je maar wil te bek­ijken. Joy. Tot snel! Posted on August 26, 2005Categories Articles"
