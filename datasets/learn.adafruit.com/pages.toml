["https://learn.adafruit.com/category/stemma"]
title = "Adafruit Learning System"
full_description = "All Categories STEMMA WHAT IS STEMMA? STEMMA is a plug-and-play board and sensor system that lets you quickly plug together various devices and accessories, without any soldering! STEMMA uses 3-pin cables for simple analog and digital devices, like relays and buttons. For more complex sensors and displays, we use a 4-wire I2C connection. For larger boards and devices we use a Grove-compatible connector, for smaller ones we use a Qwiic-compatible connector called STEMMA QT. As all STEMMA sensors have level shifting and voltage regulation, you can use them safely with any 3 to 5V power and logic device - from microcontrollers like Arduino-compatibles, to full Linux single board computers like the Raspberry Pi. We even have USB to I2C adapters that let you connect STEMMA devices directly to a computer without any microcontroller programming required! Then, use our Arduino or CircuitPython/Python libraries and examples to easily get your electronics project working on any platform with STEMMA and STEMMA QT. To explore all your plug-and-play options, Check out our full list of STEMMA Compatibles. If you want to learn more about STEMMA, the Adafruit STEMMA & STEMMA QT guide by Lady Ada will have everything you need. USB MIDI Host2Host By John Park Beginner New Adafruit Metro RP2350 By Tim C 1 Beginner New Adafruit DAC7578 - 8 x Channel 12-bit I2C DAC By Liz Clark Beginner New Adafruit LPS28 Pressure Sensor By Liz Clark Beginner New Adafruit INA228 I2C Power Monitor By Liz Clark 2 Beginner New Adafruit VCNL4200 Long Distance IR Proximity and... By Liz Clark 2 Beginner Your browser does not support the video tag. This links to the guide Feather RP2350 Audio Reactive Video Synth. Feather RP2350 Audio Reactive Video Synth By Liz Clark 11 Intermediate Adafruit INA3221 Breakout By Liz Clark 5 Beginner QT Py CH32V203 eInk / ePaper Daily Calendar and Clock By Liz Clark 12 Intermediate ScoutMakes DRV5032 Hall Sensor By Lalindra Jayatilleke 1 Beginner Adafruit D