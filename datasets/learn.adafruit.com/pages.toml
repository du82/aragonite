["https://learn.adafruit.com/adafruit-metro-rp2350/arduino-ide-setup"]
title = "Arduino IDE Setup | Adafruit Metro RP2350 | Adafruit Learning System"
description = 'Choo! Choo! This is the RP2350 Metro Line, making all station stops at "Dual Cortex M33 mountain", "528K RAM round-about" and "16 Megabytes of Flash town". This train is piled high with hardware that complements the Raspberry Pi RP2350 chip to make it an excellent development board for projects that want Arduino-shape-compatibility or just need the extra space and debugging ports.'
full_description = "Adafruit Metro RP2350 by Tim C published February 19, 2025, last edited February 26, 2025 posted in Adafruit Products Raspberry Pi Arduino Compatibles CircuitPython STEMMA Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Install CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input Analog Input NeoPixel I2C I2S Audio SD Card HSTX Display Arduino IDE Setup Arduino Usage Blink NeoPixel I2C Scan Test SD Card Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Metro RP2350 Out of Stock 1 New Beginner Product guide Arduino IDE Setup The Arduino Philhower core provides support for RP2350 microcontroller boards. This page covers getting your Arduino IDE set up to include your board. Arduino IDE Download The first thing you will need to do is to download the latest release of the Arduino IDE. The Philhower core requires version 1.8 or higher. Arduino IDE Download Download and install it to your computer. Once installed, open the Arduino IDE. Adding the Philhower Board Manager URL In the Arduino IDE, and navigate to the Preferences window. You can access it through File > Preferences on Windows or Linux, or Arduino > Preferences on OS X. The Preferences window will open. In the Additional Boards Manager URLs field, you'll want to add a new URL. The list of URLs is comma separated, and you will only have to add each URL once. The URLs point to index files that the Board Manager uses to build the list of available & installed boards. Copy the following URL. https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json Add the URL to the the Additional Boards Manager URLs field (highlighted in red below). If you already have a board support package in that field, type a comma at the end then add the address above. Both will then be loaded by the Arduino IDE. Click OK to save and close Preferences. Add Board Support Package In the Arduino IDE, click on Tools > Board > Boards Manager. If you have previously selected a board, the Board menu item may have a board name after it. In the Boards Manager, search for RP2040. Scroll down to the Raspberry Pi Pico/RP2040 by Earle F Philhower, III entry. Click Install to install it. Installing a new board package can take a few minutes. Don't click Cancel! Once installation is complete, click Close to close the Boards Manager. Install the Absolute Newest Version of the Board Support Package Support for the Metro RP2350 was just merged in, so until there is a new release for the board support package, you'll need to do a manual installation of the main branch of the Arduino Philhower core. The core has instructions on how to manually install the repository for the latest version. Enter these commands into a terminal: Copy Text mkdir -p ~/Arduino/hardware/pico git clone https://github.com/earlephilhower/arduino-pico.git ~/Arduino/hardware/pico/rp2040 cd ~/Arduino/hardware/pico/rp2040 git submodule update --init cd pico-sdk git submodule update --init cd ../tools python3 ./get.py mkdir -p ~/Arduino/hardware/pico git clone https://github.com/earlephilhower/arduino-pico.git ~/Arduino/hardware/pico/rp2040 cd ~/Arduino/hardware/pico/rp2040 git submodule update --init cd pico-sdk git submodule update --init cd ../tools python3 ./get.py Choose Your Board In the Tools > Boards menu, you should now see Raspberry Pi RP2040/RP2350 Boards (in sketchbook). Navigate to the Raspberry Pi RP2040/RP2350 Boards menu. You will see the available boards listed. From the menu, choose Adafruit Metro RP2350. If there is no serial Port available in the dropdown, or an invalid one appears - don't worry about it! The RP2350 does not actually use a serial port to upload, so its OK if it does not appear if in manual bootloader mode. You will see a serial port appear after uploading your first sketch. Now you're ready to begin using Arduino with your RP2350 board! Page last edited February 18, 2025 Text editor powered by tinymce. HSTX Display Arduino Usage"
