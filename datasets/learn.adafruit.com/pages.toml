["https://learn.adafruit.com/adafruit-feather-rp2040-with-usb-type-a-host/exploring-your-first-circuitpython-program"]
title = "Exploring Your First CircuitPython Program | Adafruit Feather RP2040 with USB Type A Host | Adafruit Learning System"
description = "The Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. There is a PIO peripheral that can be used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device."
full_description = '''Adafruit Feather RP2040 with USB Type A Host by Liz Clark and 1 other contributor Contributors: Tim C published April 25, 2023, last edited February 23, 2025 last major update February 21, 2025 posted in Hacks Adafruit Products Arduino Compatibles Feather/ Feather Boards Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Power Management CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input NeoPixel I2C USB Host Device Info USB Host Read Data Arduino IDE Setup Arduino Usage Blink I2C Scan Test USB Host Device Info Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart Featured Products view all Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart 13 Updated Beginner Product guide Exploring Your First CircuitPython Program First, you'll take a look at the code you're editing. Here is the original code again for the LED blink example (if your board doesn't have a single-color LED to blink, look instead at the NeoPixel blink example): Download File Copy Code import board import digitalio import time led = digitalio.DigitalInOut(board.LED) led.direction = digitalio.Direction.OUTPUT while True: led.value = True time.sleep(0.5) led.value = False time.sleep(0.5) import board import digitalio import time led = digitalio.DigitalInOut(board.LED) led.direction = digitalio.Direction.OUTPUT while True: led.value = True time.sleep(0.5) led.value = False time.sleep(0.5) Imports & Libraries Each CircuitPython program you run needs to have a lot of information to work. The reason CircuitPython is so simple to use is that most of that information is stored in other files and works in the background. The files built into CircuitPython are called modules, and the files you load separately are called libraries. Modules are built into CircuitPython. Libraries are stored on your CIRCUITPY drive in a folder called lib. Download File Copy Code import board import digitalio import time import board import digitalio import time The import statements tells the board that you're going to use a particular library or module in your code. In this example, you imported three modules: board, digitalio, and time. All three of these modules are built into CircuitPython, so no separate library files are needed. That's one of the things that makes this an excellent first example. You don't need anything extra to make it work! These three modules each have a purpose. The first one,board, gives you access to the hardware on your board. The second, digitalio, lets you access that hardware as inputs/outputs. The third, time, let's you control the flow of your code in multiple ways, including passing time by 'sleeping'. Setting Up The LED The next two lines setup the code to use the LED. Download File Copy Code led = digitalio.DigitalInOut(board.LED) led.direction = digitalio.Direction.OUTPUT led = digitalio.DigitalInOut(board.LED) led.direction = digitalio.Direction.OUTPUT Your board knows the red LED as LED. So, you initialise that pin, and you set it to output. You set led to equal the rest of that information so you don't have to type it all out again later in our code. Loop-de-loops The third section starts with a while statement. while True: essentially means, "forever do the following:". while True: creates a loop. Code will loop "while" the condition is "true" (vs. false), and as True is never False, the code will loop forever. All code that is indented under while True: is "inside" the loop. Inside our loop, you have four items: Download File Copy Code while True: led.value = True time.sleep(0.5) led.value = False time.sleep(0.5) while True: led.value = True time.sleep(0.5) led.value = False time.sleep(0.5) First, you have led.value = True. This line tells the LED to turn on. On the next line, you have time.sleep(0.5). This line is telling CircuitPython to pause running code for 0.5 seconds. Since this is between turning the led on and off, the led will be on for 0.5 seconds. The next two lines are similar. led.value = False tells the LED to turn off, and time.sleep(0.5) tells CircuitPython to pause for another 0.5 seconds. This occurs between turning the led off and back on so the LED will be off for 0.5 seconds too. Then the loop will begin again, and continue to do so as long as the code is running! So, when you changed the first 0.5 to 0.1, you decreased the amount of time that the code leaves the LED on. So it blinks on really quickly before turning off! Great job! You've edited code in a CircuitPython program! What Happens When My Code Finishes Running? When your code finishes running, CircuitPython resets your microcontroller board to prepare it for the next run of code. That means any set up you did earlier no longer applies, and the pin states are reset. For example, try reducing the code snippet above by eliminating the loop entirely, and replacing it with led.value = True. The LED will flash almost too quickly to see, and turn off. This is because the code finishes running and resets the pin state, and the LED is no longer receiving a signal. To that end, most CircuitPython programs involve some kind of loop, infinite or otherwise. What if I Don't Have the Loop? If you don't have the loop, the code will run to the end and exit. This can lead to some unexpected behavior in simple programs like this since the "exit" also resets the state of the hardware. This is a different behavior than running commands via REPL. So if you are writing a simple program that doesn't seem to work, you may need to add a loop to the end so the program doesn't exit. The simplest loop would be: Download File Copy Code while True: pass while True: pass And remember - you can press CTRL+C to exit the loop. See also the Behavior section in the docs. Page last edited June 21, 2024 Text editor powered by tinymce. Creating and Editing Code Connecting to the Serial Console'''
