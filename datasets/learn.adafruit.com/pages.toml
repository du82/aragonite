["https://learn.adafruit.com/adafruit-tb6612-h-bridge-dc-stepper-motor-driver-breakout"]
title = "Overview | Adafruit TB6612 1.2A DC/Stepper Motor Driver Breakout Board | Adafruit Learning System"
description = 'Fire four solenoids, spin two DC motors or step one bi-polar or uni-polar stepper with 1.2A per channel (3A peak) using the TB6612. These are perhaps better known as "the drivers in our assembled Adafruit Motorshield or Motor HAT." We really like these dual H-bridges, so if you want to control motors without a shield or HAT these are easy to include on any solderless breadboard or perma-proto.'
full_description = '''Adafruit TB6612 1.2A DC/Stepper Motor Driver Breakout Board by lady ada published April 01, 2015, last edited January 22, 2025 posted in Adafruit Products Robotics & CNC Breakout Boards/ Motor Controls Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Assembly Arduino Use: Stepper Motors Python & CircuitPython: Stepper Motors Python Docs Downloads Single page Feedback? Corrections? Featured Products view all Your browser does not support the video tag. Adafruit TB6612 1.2A DC/Stepper Motor Driver Breakout Board $6.95 Add to Cart Stepper motor - NEMA-17 size - 200 steps/rev, 12V 350mA $14.00 Add to Cart Small Reduction Stepper Motor - 5VDC 32-Step 1/16 Gearing $4.95 Add to Cart Small Reduction Stepper Motor - 12VDC 32-Step 1/16 Gearing $4.95 Add to Cart DC Toy / Hobby Motor - 130 Size $1.95 Add to Cart 62 Intermediate Product guide Overview Fire four solenoids, spin two DC motors or step one bi-polar or uni-polar stepper with 1.2A per channel using the TB6612. These are perhaps better known as "the drivers in our assembled Adafruit Motorshield or Motor HAT" We really like these dual H-bridges, so if you want to control motors without a shield or HAT these are easy to include on any solderless breadboard or perma-proto. Your browser does not support the video tag. We solder on TB6612 onto a breakout board for you here, with a polarity protection FET on the motor voltage input and a pullup on the "standby" enable pin. Each breakout chip contains two full H-bridges (four half H-bridges). That means you can drive four solenoids, two DC motors bi-directionally, or one stepper motor. Just make sure they're good for 1.2 Amp or less of current, since that's the limit of this chip. They do handle a peak of 3A but that's just for a short amount of time, about 20 milliseconds. What we like most about this particular driver is that it comes with built in kick-back diodes internally so you dont have to worry about the inductive kick damaging your project or driver! There's two digital inputs per H-bridge (one for each half of the bridge) as well as a PWM input per driver so you can control motor speed. Runs at 2.7V-5V logic. The motor voltage is separate from the logic voltage. Good for motor voltages from 4.5V up to 13.5V! This wont work well for 3V motors. Comes as one assembled and tested breakout plus a small strip of header. You'll need to do some light soldering to attach the header onto the breakout PCB. Arduino, motors, and power supply not included. Page last edited April 01, 2015 Text editor powered by tinymce. Pinouts'''
