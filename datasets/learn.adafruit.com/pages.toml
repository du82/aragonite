full_description = "All Categories Circuit Playground Stop breadboarding and soldering - start making immediately! Adafruit's Circuit Playground is jam-packed with LEDs, sensors, buttons, alligator clip pads and more. Build projects with Circuit Playground in a few minutes with the drag-and-drop MakeCode programming site, learn computer science using the CS Discoveries class on code.org, jump into CircuitPython to learn Python and hardware together, or even use Arduino IDE. Circuit Playground Bluefruit is our third board in the Circuit Playground series, another step towards a perfect introduction to electronics and programming. We've taken the popular Circuit Playground Express and made it even better! Now the main chip is more powerful, and comes with Bluetooth Low Energy support for wireless connectivity. To learn more about this board check out Adafruit Circuit Playground Bluefruit Circuit Playground Express is a powerful processor with 10 NeoPixels, mini speaker, InfraRed receive and transmit, two buttons, a switch, 14 alligator clip pads, and lots of sensors: capacitive touch, IR proximity, temperature, light, motion and sound. This board supports MakeCode, CircuitPython, and Arduino. To learn more about this board check out Adafruit Circuit Playground Express Circuit Playground Classic is the original classic Circuit Playground, which is not as powerful or featured. It is designed to be used with Arduino IDE and code.org CS Discoveries only. It does not run MakeCode or CircuitPython, and does not have Infrared support (which is why we made the Express!). To learn more about this board check out Introducing Circuit Playground A whole wide world of electronics and coding is waiting for you, and it fits in the palm of your hand. Bluefruit Classic Express Adafruit Circuit Playground Tri-Color E-Ink Gizmo By Kattni Rembor 17 Beginner Your browser does not support the video tag. This links to the guide Circuit Playground Bluefruit Automatic Bike Brake Light. Circui