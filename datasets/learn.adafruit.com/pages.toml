["https://learn.adafruit.com/adafruit-cc3000-wifi"]
title = "Overview | Adafruit CC3000 WiFi | Adafruit Learning System"
description = 'For low-power microcontroller WiFi, check out the Adafruit CC3000 breakouts and shields. The CC3000 hits that sweet spot of usability, price and capability. It uses SPI for communication (not UART!) so you can push data as fast as you want or as slow as you want. It has a proper interrupt system with IRQ pin so you can have asynchronous connections. It supports 802.11b/g, open/WEP/WPA/WPA2 security, TKIP & AES. A built in TCP/IP stack with a "BSD socket" interface. TCP and UDP in both client and server mode, up to 4 concurrent sockets.'
full_description = '''Adafruit CC3000 WiFi by Rick Lesniak published September 16, 2013, last edited March 08, 2024 posted in Adafruit Products Arduino Compatibles Breakout Boards/ WiFi Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Assembly and Wiring CC3000 Breakout CC3000 Shield Connections Using the CC3000 buildtest WebClient ntpTest InternetTime GeoLocation SmartConfig SendTweet Firmware Upgrades Downloads FAQ Single page Feedback? Corrections? Featured Products view all RP-SMA to uFL/u.FL/IPX/IPEX RF Adapter Cable $3.95 Add to Cart 2.4GHz Dipole Swivel Antenna with RP-SMA - 2dBi $6.95 Add to Cart 2.4GHz Dipole Swivel Antenna with RP-SMA - 5dBi $8.95 Add to Cart 30 Intermediate Product guide Overview The CC3000 WiFi module from Texas Instruments is a small silver package which finally brings easy-to-use, affordable WiFi functionality to your Arduino projects.It uses SPI for communication (not UART!) so you can push data as fast as you want or as slow as you want. It has a proper interrupt system with IRQ pin so you can have asynchronous connections. It supports 802.11b/g, open/WEP/WPA/WPA2 security, TKIP & AES. A built in TCP/IP stack with a "BSD socket" interface supports TCP and UDP in both client and server mode, with up to 4 concurrent socket connections. The CC3000 does not support "AP" mode, it can connect to an access point but it cannot be an access point. The CC3000 is available from Adafruit As a Breakout Board, and as an Arduino Shield. Both the shield and the breakout board have an onboard 3.3V regulator that can handle the 350mA peak current, and a level shifter to allow 3 or 5V logic level. The antenna layout is identical to TI's suggested layout and we're using the same components, trace arrangement, and antenna so the board maintains its FCC emitter compliance (you'll still need to perform FCC validation for a finished product, but the WiFi part is taken care of). Even though it's got an onboard antenna we were pretty surprised at the range, as good as a smartphone's. The shield also features a MicroSD socket, and a reset button.AND, the shield supports the Arduino SPI passthrough header pins, so it's compatible with the Mega, Leonardo, and Due, right out of the box - no rewiring necessary! Just solder closed the MISO, SCK, and MOSI jumpers on the back of the shield. Page last edited August 31, 2013 Text editor powered by tinymce. Assembly and Wiring'''
