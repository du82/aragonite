["https://learn.adafruit.com/adafruit-hdc3021-precision-temperature-humidity-sensor"]
title = "Overview | Adafruit HDC302x Precision Temperature & Humidity Sensor | Adafruit Learning System"
description = "This Adafruit HDC3021 Precision Temperature & Humidity Sensor breakout features the highest accuracy & precision one we've see so far! It has the TI HDC302x series chip with typical 0.5% accuracy for the RH sensor (with 0.19% long-term drift) and ±0.1°C typical accuracy for the temperature sensor. All at a very nice price."
full_description = '''Adafruit HDC302x Precision Temperature & Humidity Sensor by Liz Clark published July 16, 2024, last edited January 22, 2025 posted in Adafruit Products Sensors/ Temperature & Humidity Arduino Compatibles CircuitPython STEMMA Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts CircuitPython and Python Python Docs Arduino Arduino Docs WipperSnapper Downloads Single page Feedback? Corrections? Primary Products Adafruit HDC3022 Precision Temperature & Humidity Sensor $8.95 Add to Cart Featured Products view all Adafruit HDC3022 Precision Temperature & Humidity Sensor $8.95 Add to Cart STEMMA QT / Qwiic JST SH 4-pin Cable - 100mm Long $0.95 Add to Cart STEMMA QT / Qwiic JST SH 4-pin to Premium Male Headers Cable $0.95 Add to Cart STEMMA QT / Qwiic JST SH 4-pin Cable with Premium Female Sockets Out of Stock JST SH 4-pin Cable with Alligator Clips - STEMMA QT / Qwiic $2.95 Add to Cart 7 Beginner Product guide Overview As of September 23, 2024 – We've upgraded this sensor to now be the "HDC3022" rather than the "HDC3021". It is completely the same other than it now has a white PTFE filter cover that should not be removed and will keep your sensor nice and clean. Adafruit stocks a large number of Temperature/Humidity sensors, so you're probably wondering why another one? Well, this Adafruit HDC3021 Precision Temperature & Humidity Sensor breakout features the highest accuracy & precision one we've see so far! It uses the TI HDC302x series chip with typical 0.5% accuracy for the RH sensor (with 0.19% long-term drift) and ±0.1°C typical accuracy for the temperature sensor. All at a very nice price. This sensor has a true I2C interface for easy interfacing with only two wires (plus power and ground!). That makes it preferable to the janky DHT11/DHT22 sensors. The sensor is 5V safe, so you can use 1.8V to 5V power and logic levels without the need for shifters, so you can power and communicate with it using any microcontroller or microcomputer. With 4 selectable I2C addresses, you can have multiple sensors on one bus - unlike many other fixed-address T/RH sensors. We've written full-featured Arduino and CircuitPython / Python libraries, so whether you have an 8-bit microcontroller or a quad-core Raspberry Pi, you will be able to quickly get data from the sensor for your environmental monitoring needs. The libraries can setup the sensor rate/power, heater, alerts, offsets, and read data or NIST tracking ID. Such a lovely chip - so we spun up a breakout board with the HDC3021 and some supporting circuitry such as pullup resistors and capacitors. To make things even easier, we've included SparkFun Qwiic compatible STEMMA QT connectors for the I2C bus so you don't even need to solder! QT Cable is not included, but we have a variety in the shop. If you prefer working on a breadboard, each order comes with one fully assembled and tested PCB breakout and a small piece of header. You'll need to solder the header onto the PCB, but it's fairly easy and takes only a few minutes even for a beginner. Please note: this sensor comes with a protective polyamide sticker on top, please remove before usage! Page last edited October 02, 2024 Text editor powered by tinymce. Pinouts'''
