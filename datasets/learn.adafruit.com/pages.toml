["https://learn.adafruit.com/adafruit-max17048-lipoly-liion-fuel-gauge-and-battery-monitor"]
title = "Overview | Adafruit MAX17048 LiPoly / LiIon Fuel Gauge and Battery Monitor | Adafruit Learning System"
description = "The Adafruit MAX17048 LiPoly / LiIon Fuel Gauge and Battery Monitor connects to your Lipoly or LiIon battery and it will let you know the voltage of the cell and decodes the non-linear voltage to get you a valid percentage as well. To use, connect a 1S 3.7-4.2V Lithium Ion or Polymer battery to one of the JST 2 PH ports. Use the I2C interface and our Arduino or CircuitPython/Python library code to read the voltage and percentage whenever you like. There are various alerts, low power modes that can be customized as desired."
full_description = "Adafruit MAX17048 LiPoly / LiIon Fuel Gauge and Battery Monitor by Liz Clark published September 07, 2022, last edited January 22, 2025 last major update March 04, 2024 posted in Adafruit Products Arduino Compatibles CircuitPython Breakout Boards/ Batteries/Power STEMMA Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Python & CircuitPython Python Docs Arduino Arduino Docs WipperSnapper Downloads Single page Feedback? Corrections? Primary Products Adafruit MAX17048 LiPoly / LiIon Fuel Gauge and Battery Monitor $5.95 Add to Cart Featured Products view all Adafruit MAX17048 LiPoly / LiIon Fuel Gauge and Battery Monitor $5.95 Add to Cart STEMMA QT / Qwiic JST SH 4-Pin Cable - 50mm Long Out of Stock STEMMA QT / Qwiic JST SH 4-pin Cable with Premium Female Sockets Out of Stock STEMMA QT / Qwiic JST SH 4-pin to Premium Male Headers Cable $0.95 Add to Cart JST SH 4-pin Cable with Alligator Clips - STEMMA QT / Qwiic $2.95 Add to Cart STEMMA QT / Qwiic JST SH 4-pin Cable - 100mm Long $0.95 Add to Cart 22 Beginner Product guide Overview Low cost Lithium Polymer batteries have revolutionized electronics - they're thin, they're light, they can be regulated down to 3.3V and they're easy to charge. On your phone, there's a little image of a battery cell that tells you the percentage of charge - so you know when you absolutely need to plug it in and when you can stay untethered. The Adafruit MAX17048 LiPoly / LiIon Fuel Gauge and Battery Monitor does the same thing. Connect it to your Lipoly or LiIon battery and it will let you know the voltage of the cell, it does the annoying math of decoding the non-linear voltage to get you a valid percentage as well! Since this nice chip is I2C, it works with any and all microcontroller or microcomputer boards, from the Arduino UNO up to the Raspberry Pi. And you don't have to worry about logic level, as the gauge runs with 3.3V or 5.0V power and logic equally fine. To use, connect a 1S 3.7-4.2V Lithium Ion or Polymer battery to one of the JST 2 PH ports (either one). Then use the included JST PH jumper cable to connect to your boost converter, Feather, whatever! Use the I2C interface and our Arduino or CircuitPython/Python library code to read the voltage and percentage whenever you like. There are various alerts, low power modes that can be customized as desired. To get you going fast, we spun up a custom-made PCB in the STEMMA QT form factor, making it easy to interface with. The STEMMA QT connectors on either side are compatible with the SparkFun Qwiic I2C connectors. This allows you to make solderless connections between your development board and the MAX17048 or to chain it with a wide range of other sensors and accessories using a compatible cable. QT Cable is not included, but we have a variety in the shop Page last edited March 08, 2024 Text editor powered by tinymce. Pinouts"
