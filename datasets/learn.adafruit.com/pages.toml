["https://learn.adafruit.com/adafruit-feather-rp2040-with-usb-type-a-host/circuitpython"]
title = "CircuitPython | Adafruit Feather RP2040 with USB Type A Host | Adafruit Learning System"
description = "The Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. There is a PIO peripheral that can be used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device."
full_description = '''Adafruit Feather RP2040 with USB Type A Host by Liz Clark and 1 other contributor Contributors: Tim C published April 25, 2023, last edited February 23, 2025 last major update February 21, 2025 posted in Hacks Adafruit Products Arduino Compatibles Feather/ Feather Boards Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Power Management CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input NeoPixel I2C USB Host Device Info USB Host Read Data Arduino IDE Setup Arduino Usage Blink I2C Scan Test USB Host Device Info Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart Featured Products view all Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart 13 Updated Beginner Product guide CircuitPython CircuitPython is a derivative of MicroPython designed to simplify experimentation and education on low-cost microcontrollers. It makes it easier than ever to get prototyping by requiring no upfront desktop software downloads. Simply copy and edit files on the CIRCUITPY drive to iterate. CircuitPython Quickstart Follow this step-by-step to quickly get CircuitPython running on your board. Download the latest version of CircuitPython for this board via circuitpython.org Click the link above to download the latest CircuitPython UF2 file. Save it wherever is convenient for you. To enter the bootloader, hold down the BOOT/BOOTSEL button (highlighted in red above), and while continuing to hold it (don't let go!), press and release the reset button (highlighted in red or blue above). Continue to hold the BOOT/BOOTSEL button until the RPI-RP2 drive appears! If the drive does not appear, release all the buttons, and then repeat the process above. You can also start with your board unplugged from USB, press and hold the BOOTSEL button (highlighted in red above), continue to hold it while plugging it into USB, and wait for the drive to appear before releasing the button. A lot of people end up using charge-only USB cables and it is very frustrating! Make sure you have a USB cable you know is good for data sync. You will see a new disk drive appear called RPI-RP2. Drag the adafruit_circuitpython_etc.uf2 file to RPI-RP2. The RPI-RP2 drive will disappear and a new disk drive called CIRCUITPY will appear. That's it, you're done! :) Safe Mode You want to edit your code.py or modify the files on your CIRCUITPY drive, but find that you can't. Perhaps your board has gotten into a state where CIRCUITPY is read-only. You may have turned off the CIRCUITPY drive altogether. Whatever the reason, safe mode can help. Safe mode in CircuitPython does not run any user code on startup, and disables auto-reload. This means a few things. First, safe mode bypasses any code in boot.py (where you can set CIRCUITPY read-only or turn it off completely). Second, it does not run the code in code.py. And finally, it does not automatically soft-reload when data is written to the CIRCUITPY drive. Therefore, whatever you may have done to put your board in a non-interactive state, safe mode gives you the opportunity to correct it without losing all of the data on the CIRCUITPY drive. Entering Safe Mode To enter safe mode when using CircuitPython, plug in your board or hit reset (highlighted in red above). Immediately after the board starts up or resets, it waits 1000ms. On some boards, the onboard status LED (highlighted in green above) will blink yellow during that time. If you press reset during that 1000ms, the board will start up in safe mode. It can be difficult to react to the yellow LED, so you may want to think of it simply as a slow double click of the reset button. (Remember, a fast double click of reset enters the bootloader.) In Safe Mode If you successfully enter safe mode on CircuitPython, the LED will intermittently blink yellow three times. If you connect to the serial console, you'll find the following message. Copy Text Auto-reload is off. Running in safe mode! Not running saved code. CircuitPython is in safe mode because you pressed the reset button during boot. Press again to exit safe mode. Press any key to enter the REPL. Use CTRL-D to reload. Auto-reload is off. Running in safe mode! Not running saved code. CircuitPython is in safe mode because you pressed the reset button during boot. Press again to exit safe mode. Press any key to enter the REPL. Use CTRL-D to reload. You can now edit the contents of the CIRCUITPY drive. Remember, your code will not run until you press the reset button, or unplug and plug in your board, to get out of safe mode. Flash Resetting UF2 If your board ever gets into a really weird state and CIRCUITPY doesn't show up as a disk drive after installing CircuitPython, try loading this 'nuke' UF2 to RPI-RP2. which will do a 'deep clean' on your Flash Memory. You will lose all the files on the board, but at least you'll be able to revive it! After loading this UF2, follow the steps above to re-install CircuitPython. Download flash erasing "nuke" UF2 Page last edited November 08, 2024 Text editor powered by tinymce. Power Management Installing the Mu Editor'''
