title = "USB Host Device Info | Adafruit Feather RP2040 with USB Type A Host | Adafruit Learning System"
description = "The Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. There is a PIO peripheral that can be used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device."
full_description = '''Adafruit Feather RP2040 with USB Type A Host by Liz Clark and 1 other contributor Contributors: Tim C published April 25, 2023, last edited February 23, 2025 last major update February 21, 2025 posted in Hacks Adafruit Products Arduino Compatibles Feather/ Feather Boards Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Power Management CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input NeoPixel I2C USB Host Device Info USB Host Read Data Arduino IDE Setup Arduino Usage Blink I2C Scan Test USB Host Device Info Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart Featured Products view all Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart 13 Updated Beginner Product guide USB Host Device Info The main use case for this Feather is to act as a USB host. There are quite a few examples in the Adafruit TinyUSB Library to get you started. In the example below, you'll run the device info test to read the info from your attached USB device. You will need to have a USB device, such as a mouse or keyboard, to plug into the USB type A port on the Feather. Install Adafruit_TinyUSB Library To use your Feather as a USB host, you'll need to install the Adafruit TinyUSB library. It can be installed using the Library Manager in the Arduino IDE. Click the Manage Libraries ... menu item, search for Adafruit TinyUSB, and select the Adafruit TinyUSB Library: If asked about dependencies, click "Install all". If the "Dependencies" window does not come up, then you already have the dependencies installed. If the dependencies are already installed, you must make sure you update them through the Arduino Library Manager before loading the example! Install Pico PIO USB Library Additionally, you'll need to install the Pico PIO USB library. Click the Manage Libraries ... menu item again, search for PIO USB, and select the Pico PIO USB library: Board Upload Settings In the Tools menu, select Adafruit Feather RP2040 USB Host under Board. For CPU Speed, you'll need to select 120 MHz or 240 MHz. Finally, under USB Stack, select Adafruit TinyUSB. Device Info Example You can open the device info example in the Arduino IDE by navigating to File -> Examples -> Adafruit TinyUSB Library -> DualRole -> Simple and select device_info. Download File Copy Code /********************************************************************* Adafruit invests time and resources providing this open source code, please support Adafruit and open-source hardware by purchasing products from Adafruit! MIT license, check LICENSE for more information Copyright (c) 2019 Ha Thach for Adafruit Industries All text above, and the splash screen below must be included in any redistribution *********************************************************************/ /* This example demonstrates use of both device and host, where * - Device run on native usb controller (roothub port0) * - Host depending on MCUs run on either: * - rp2040: bit-banging 2 GPIOs with the help of Pico-PIO-USB library (roothub port1) * - samd21/51, nrf52840, esp32: using MAX3421e controller (host shield) * * Requirements: * - For rp2040: * - [Pico-PIO-USB](https://github.com/sekigon-gonnoc/Pico-PIO-USB) library * - 2 consecutive GPIOs: D+ is defined by PIN_USB_HOST_DP, D- = D+ +1 * - Provide VBus (5v) and GND for peripheral * - CPU Speed must be either 120 or 240 Mhz. Selected via "Menu -> CPU Speed" * - For samd21/51, nrf52840, esp32: * - Additional MAX2341e USB Host shield or featherwing is required * - SPI instance, CS pin, INT pin are correctly configured in usbh_helper.h */ /* Host example will get device descriptors of attached devices and print it out via * device cdc (Serial) as follows: * Device 1: ID 046d:c52f Device Descriptor: bLength 18 bDescriptorType 1 bcdUSB 0200 bDeviceClass 0 bDeviceSubClass 0 bDeviceProtocol 0 bMaxPacketSize0 8 idVendor 0x046d idProduct 0xc52f bcdDevice 2200 iManufacturer 1 Logitech iProduct 2 USB Receiver iSerialNumber 0 bNumConfigurations 1 * */ // USBHost is defined in usbh_helper.h #include "usbh_helper.h" // Language ID: English #define LANGUAGE_ID 0x0409 typedef struct { tusb_desc_device_t desc_device; uint16_t manufacturer[32]; uint16_t product[48]; uint16_t serial[16]; bool mounted; } dev_info_t; // CFG_TUH_DEVICE_MAX is defined by tusb_config header dev_info_t dev_info[CFG_TUH_DEVICE_MAX] = { 0 }; void setup() { Serial.begin(115200); #if defined(CFG_TUH_MAX3421) && CFG_TUH_MAX3421 // init host stack on controller (rhport) 1 // For rp2040: this is called in core1's setup1() USBHost.begin(1); #endif // while ( !Serial ) delay(10); // wait for native usb Serial.println("TinyUSB Dual Device Info Example"); } #if defined(CFG_TUH_MAX3421) && CFG_TUH_MAX3421 //--------------------------------------------------------------------+ // Using Host shield MAX3421E controller //--------------------------------------------------------------------+ void loop() { USBHost.task(); Serial.flush(); } #elif defined(ARDUINO_ARCH_RP2040) //--------------------------------------------------------------------+ // For RP2040 use both core0 for device stack, core1 for host stack //--------------------------------------------------------------------+ //------------- Core0 -------------// void loop() { } //------------- Core1 -------------// void setup1() { //while ( !Serial ) delay(10); // wait for native usb // configure pio-usb: defined in usbh_helper.h rp2040_configure_pio_usb(); // run host stack on controller (rhport) 1 // Note: For rp2040 pico-pio-usb, calling USBHost.begin() on core1 will have most of the // host bit-banging processing works done in core1 to free up core0 for other works USBHost.begin(1); } void loop1() { USBHost.task(); Serial.flush(); } #endif //--------------------------------------------------------------------+ // TinyUSB Host callbacks //--------------------------------------------------------------------+ void print_device_descriptor(tuh_xfer_t *xfer); void utf16_to_utf8(uint16_t *temp_buf, size_t buf_len); void print_lsusb(void) { bool no_device = true; for (uint8_t daddr = 1; daddr < CFG_TUH_DEVICE_MAX + 1; daddr++) { // TODO can use tuh_mounted(daddr), but tinyusb has an bug // use local connected flag instead dev_info_t *dev = &dev_info[daddr - 1]; if (dev->mounted) { Serial.printf("Device %u: ID %04x:%04x %s %s\r\n", daddr, dev->desc_device.idVendor, dev->desc_device.idProduct, (char *) dev->manufacturer, (char *) dev->product); no_device = false; } } if (no_device) { Serial.println("No device connected (except hub)"); } } // Invoked when device is mounted (configured) void tuh_mount_cb(uint8_t daddr) { Serial.printf("Device attached, address = %d\r\n", daddr); dev_info_t *dev = &dev_info[daddr - 1]; dev->mounted = true; // Get Device Descriptor tuh_descriptor_get_device(daddr, &dev->desc_device, 18, print_device_descriptor, 0); } /// Invoked when device is unmounted (bus reset/unplugged) void tuh_umount_cb(uint8_t daddr) { Serial.printf("Device removed, address = %d\r\n", daddr); dev_info_t *dev = &dev_info[daddr - 1]; dev->mounted = false; // print device summary print_lsusb(); } void print_device_descriptor(tuh_xfer_t *xfer) { if (XFER_RESULT_SUCCESS != xfer->result) { Serial.printf("Failed to get device descriptor\r\n"); return; } uint8_t const daddr = xfer->daddr; dev_info_t *dev = &dev_info[daddr - 1]; tusb_desc_device_t *desc = &dev->desc_device; Serial.printf("Device %u: ID %04x:%04x\r\n", daddr, desc->idVendor, desc->idProduct); Serial.printf("Device Descriptor:\r\n"); Serial.printf(" bLength %u\r\n" , desc->bLength); Serial.printf(" bDescriptorType %u\r\n" , desc->bDescriptorType); Serial.printf(" bcdUSB %04x\r\n" , desc->bcdUSB); Serial.printf(" bDeviceClass %u\r\n" , desc->bDeviceClass); Serial.printf(" bDeviceSubClass %u\r\n" , desc->bDeviceSubClass); Serial.printf(" bDeviceProtocol %u\r\n" , desc->bDeviceProtocol); Serial.printf(" bMaxPacketSize0 %u\r\n" , desc->bMaxPacketSize0); Serial.printf(" idVendor 0x%04x\r\n" , desc->idVendor); Serial.printf(" idProduct 0x%04x\r\n" , desc->idProduct); Serial.printf(" bcdDevice %04x\r\n" , desc->bcdDevice); // Get String descriptor using Sync API Serial.printf(" iManufacturer %u ", desc->iManufacturer); if (XFER_RESULT_SUCCESS == tuh_descriptor_get_manufacturer_string_sync(daddr, LANGUAGE_ID, dev->manufacturer, sizeof(dev->manufacturer))) { utf16_to_utf8(dev->manufacturer, sizeof(dev->manufacturer)); Serial.printf((char *) dev->manufacturer); } Serial.printf("\r\n"); Serial.printf(" iProduct %u ", desc->iProduct); if (XFER_RESULT_SUCCESS == tuh_descriptor_get_product_string_sync(daddr, LANGUAGE_ID, dev->product, sizeof(dev->product))) { utf16_to_utf8(dev->product, sizeof(dev->product)); Serial.printf((char *) dev->product); } Serial.printf("\r\n"); Serial.printf(" iSerialNumber %u ", desc->iSerialNumber); if (XFER_RESULT_SUCCESS == tuh_descriptor_get_serial_string_sync(daddr, LANGUAGE_ID, dev->serial, sizeof(dev->serial))) { utf16_to_utf8(dev->serial, sizeof(dev->serial)); Serial.printf((char *) dev->serial); } Serial.printf("\r\n"); Serial.printf(" bNumConfigurations %u\r\n", desc->bNumConfigurations); // print device summary print_lsusb(); } //--------------------------------------------------------------------+ // String Descriptor Helper //--------------------------------------------------------------------+ static void _convert_utf16le_to_utf8(const uint16_t *utf16, size_t utf16_len, uint8_t *utf8, size_t utf8_len) { // TODO: Check for runover. (void) utf8_len; // Get the UTF-16 length out of the data itself. for (size_t i = 0; i < utf16_len; i++) { uint16_t chr = utf16[i]; if (chr < 0x80) { *utf8++ = chr & 0xff; } else if (chr < 0x800) { *utf8++ = (uint8_t) (0xC0 | (chr >> 6 & 0x1F)); *utf8++ = (uint8_t) (0x80 | (chr >> 0 & 0x3F)); } else { // TODO: Verify surrogate. *utf8++ = (uint8_t) (0xE0 | (chr >> 12 & 0x0F)); *utf8++ = (uint8_t) (0x80 | (chr >> 6 & 0x3F)); *utf8++ = (uint8_t) (0x80 | (chr >> 0 & 0x3F)); } // TODO: Handle UTF-16 code points that take two entries. } } // Count how many bytes a utf-16-le encoded string will take in utf-8. static int _count_utf8_bytes(const uint16_t *buf, size_t len) { size_t total_bytes = 0; for (size_t i = 0; i < len; i++) { uint16_t chr = buf[i]; if (chr < 0x80) { total_bytes += 1; } else if (chr < 0x800) { total_bytes += 2; } else { total_bytes += 3; } // TODO: Handle UTF-16 code points that take two entries. } return total_bytes; } void utf16_to_utf8(uint16_t *temp_buf, size_t buf_len) { size_t utf16_len = ((temp_buf[0] & 0xff) - 2) / sizeof(uint16_t); size_t utf8_len = _count_utf8_bytes(temp_buf + 1, utf16_len); _convert_utf16le_to_utf8(temp_buf + 1, utf16_len, (uint8_t *) temp_buf, buf_len); ((uint8_t *) temp_buf)[utf8_len] = '\0'; } /********************************************************************* Adafruit invests time and resources providing this open source code, please support Adafruit and open-source hardware by purchasing products from Adafruit! MIT license, check LICENSE for more information Copyright (c) 2019 Ha Thach for Adafruit Industries All text above, and the splash screen below must be included in any redistribution *********************************************************************/ /* This example demonstrates use of both device and host, where * - Device run on native usb controller (roothub port0) * - Host depending on MCUs run on either: * - rp2040: bit-banging 2 GPIOs with the help of Pico-PIO-USB library (roothub port1) * - samd21/51, nrf52840, esp32: using MAX3421e controller (host shield) * * Requirements: * - For rp2040: * - [Pico-PIO-USB](https://github.com/sekigon-gonnoc/Pico-PIO-USB) library * - 2 consecutive GPIOs: D+ is defined by PIN_USB_HOST_DP, D- = D+ +1 * - Provide VBus (5v) and GND for peripheral * - CPU Speed must be either 120 or 240 Mhz. Selected via "Menu -> CPU Speed" * - For samd21/51, nrf52840, esp32: * - Additional MAX2341e USB Host shield or featherwing is required * - SPI instance, CS pin, INT pin are correctly configured in usbh_helper.h */ /* Host example will get device descriptors of attached devices and print it out via * device cdc (Serial) as follows: * Device 1: ID 046d:c52f Device Descriptor: bLength 18 bDescriptorType 1 bcdUSB 0200 bDeviceClass 0 bDeviceSubClass 0 bDeviceProtocol 0 bMaxPacketSize0 8 idVendor 0x046d idProduct 0xc52f bcdDevice 2200 iManufacturer 1 Logitech iProduct 2 USB Receiver iSerialNumber 0 bNumConfigurations 1 * */ // USBHost is defined in usbh_helper.h #include "usbh_helper.h" // Language ID: English #define LANGUAGE_ID 0x0409 typedef struct { tusb_desc_device_t desc_device; uint16_t manufacturer[32]; uint16_t product[48]; uint16_t serial[16]; bool mounted; } dev_info_t; // CFG_TUH_DEVICE_MAX is defined by tusb_config header dev_info_t dev_info[CFG_TUH_DEVICE_MAX] = { 0 }; void setup() { Serial.begin(115200); #if defined(CFG_TUH_MAX3421) && CFG_TUH_MAX3421 // init host stack on controller (rhport) 1 // For rp2040: this is called in core1's setup1() USBHost.begin(1); #endif // while ( !Serial ) delay(10); // wait for native usb Serial.println("TinyUSB Dual Device Info Example"); } #if defined(CFG_TUH_MAX3421) && CFG_TUH_MAX3421 //--------------------------------------------------------------------+ // Using Host shield MAX3421E controller //--------------------------------------------------------------------+ void loop() { USBHost.task(); Serial.flush(); } #elif defined(ARDUINO_ARCH_RP2040) //--------------------------------------------------------------------+ // For RP2040 use both core0 for device stack, core1 for host stack //--------------------------------------------------------------------+ //------------- Core0 -------------// void loop() { } //------------- Core1 -------------// void setup1() { //while ( !Serial ) delay(10); // wait for native usb // configure pio-usb: defined in usbh_helper.h rp2040_configure_pio_usb(); // run host stack on controller (rhport) 1 // Note: For rp2040 pico-pio-usb, calling USBHost.begin() on core1 will have most of the // host bit-banging processing works done in core1 to free up core0 for other works USBHost.begin(1); } void loop1() { USBHost.task(); Serial.flush(); } #endif //--------------------------------------------------------------------+ // TinyUSB Host callbacks //----------------------------------------------------------'''
