["https://learn.adafruit.com/adafruit-10-dof-imu-breakout-lsm303-l3gd20-bmp180"]
title = "Introduction | Adafruit 10-DOF IMU Breakout | Adafruit Learning System"
description = "Everything you need to know to get started with Adafruit's 10-DOF (10 degrees of freedom) breakout board.  You can use this board to measure altitude, orientation, acceleration, angular velocity using the L3GD20 Gyro, LSM303 Accelerometer/Compass, and BMP180 Altitute & Temperature sensor"
full_description = "Adafruit 10-DOF IMU Breakout by Kevin Townsend published November 29, 2013, last edited March 08, 2024 posted in Sensors Adafruit Products Breakout Boards/ Accel, Gyro, & Magnetometers Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Introduction Connecting It Up Software Design Files F.A.Q. Single page Feedback? Corrections? Featured Products view all L3GD20H Triple-Axis Gyro Breakout Board - L3GD20/L3G4200 Upgrade $12.50 Add to Cart 27 Intermediate Product guide Introduction Please note that there is a small cosmetic error on the first revision of these boards (shown above). The straight X arrow for the accelerometer should be pointing in the opposite direction, towards the right. This will be fixed in the next run of these boards. Adafruit's 10DOF (10 Degrees of Freedom) breakout board allows you to capture ten (err, eleven!) distinct types of motion or orientation related data. After testing a lot of combinations of sensors, we settled on the following devices that we think offer the best results and the least amount of hassle: LSM303DLHC - a 3-axis accelerometer (up to +/-16g) and a 3-axis magnetometer (up to +/-8.1 gauss) on a single die L3GD20 - a 3-axis gyroscope (up to +/-2000 dps) BMP180 - A barometric pressure sensor (300..1100 hPa) that can be used to calculate altitude, with an additional on-board temperature sensor Related LinksThe Adafruit 10DOF board and library reuses the existing Adafruit drivers for the LSM303DLHC (accelerometer and magnetometer), the L3GD20 (gyroscope) and the BMP180 (pressure/altitude sensor). For information about these particular drivers, consult the following learning guides: LSM303DLHC Learning Guide L3GD20 Learning Guide BMP180 Learning Guide This breakout is basically just a smooshed together version of all three so anything you can do with those libraries/guides will follow here. Page last edited March 08, 2024 Text editor powered by tinymce. Connecting It Up"
