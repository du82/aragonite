title = "Adafruit Learning System"
full_description = "All Categories AdaBox If you're here, it's because you were given the gift of electronics with an AdaBox! You are a beginner who is getting started with your AdaBox or you just want to relive what it's like being a beginner at electronics again. But most of all, you want to learn how to build and make stuff with electronics! Gone are the days where you need thousands of dollars of equipment and lots physics/math background. Nowadays, if you want to learn to work with electronics, you can jump right in for $100 or less, and any sort of computer. And we're talking about learning a lot of electronics - from the basics of analog to the complexities of firmware. With a good pack of parts, you can build a base of knowledge that will take you from your first blinking LED to someone who can start prototyping and inventing custom products. AdaBox 021 By John Park 52 Beginner Your browser does not support the video tag. This links to the guide MEMENTO Camera Quick Start Guide. MEMENTO Camera Quick Start Guide By Anne Barela 18 Beginner Set up Web Workflow on the Adafruit MEMENTO By M. LeBlanc-Williams 14 Beginner Your browser does not support the video tag. This links to the guide Face Tracking Robot with MEMENTO. Face Tracking Robot with MEMENTO By Brent Rubell 19 Intermediate MEMENTO Focus Stacking By John Park 12 Beginner Facial Detection and Recognition with MEMENTO By Brent Rubell 18 Intermediate Your browser does not support the video tag. This links to the guide DIY IoT Doorbell Camera with MEMENTO. DIY IoT Doorbell Camera with MEMENTO By Brent Rubell 29 Beginner Your browser does not support the video tag. This links to the guide MacroPad Remote Procedure Calls over USB to Control Home Assistant. MacroPad Remote Procedure Calls over USB to Control... By M. LeBlanc-Williams 53 Advanced Matrix Portal M4 Boxing Interval Timer By Trevor Beaton 8 Beginner AdaBox 020 By John Park 31 Beginner Scrambled Number Security Keypad By Anne Barela 23 Beginner Ada