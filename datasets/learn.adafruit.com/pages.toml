full_description = "All Categories Feather The Adafruit Feather are a complete line of development boards from Adafruit that are both standalone and stackable. They're able to be powered by lipo batteries for on-the-go use or by their micro-USB plugs for stationary projects. Feathers are flexible, portable, and as light as their namesake. We also carry a complete line of accessories and Feather Wings to stack boards and add room for prototyping. At its core, the Adafruit Feather is a complete ecosystem of products - and the best way to get your project flying. Feather Boards FeatherWings Adafruit Feather RP2350 with HSTX By Liz Clark 5 Beginner Updated Your browser does not support the video tag. This links to the guide Feather RP2350 Audio Reactive Video Synth. Feather RP2350 Audio Reactive Video Synth By Liz Clark 11 Intermediate TFT Spirit Board By Tim C 5 Beginner Your browser does not support the video tag. This links to the guide Zelda Echoes Of Wisdom Tri Rod. Zelda Echoes Of Wisdom Tri Rod By Ruiz Brothers 2 Beginner Your browser does not support the video tag. This links to the guide LEGO-Compatible Servo Mounts. LEGO-Compatible Servo Mounts By Ruiz Brothers 9 Beginner Blinka Says Tabletop Arcade Game By Tim C 2 Beginner ESP32-S3 BLE RS-232 Controller By Liz Clark 4 Beginner Adafruit ESP32-C6 Feather By Liz Clark 3 Intermediate Grill Thermometer Dashboard By John Park 4 Beginner Your browser does not support the video tag. This links to the guide Feather RP2040 DVI CircuitPython Day 2024 Countdown Clock. Feather RP2040 DVI CircuitPython Day 2024 Countdown... By Liz Clark 3 Beginner Your browser does not support the video tag. This links to the guide Feather ESP32-S3 TFT CircuitPython Day 2024 Countdown Clock. Feather ESP32-S3 TFT CircuitPython Day 2024... By Liz Clark 5 Beginner ESP32-S3 BLE iOS Media Controller By Liz Clark 15 Beginner MP3 Playback with CircuitPython By Jeff Epler 13 Beginner Your browser does not support the video tag. This links to the g