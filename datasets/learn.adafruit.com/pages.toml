["https://learn.adafruit.com/adafruit-feather-rp2040-with-usb-type-a-host/overview"]
title = "Overview | Adafruit Feather RP2040 with USB Type A Host | Adafruit Learning System"
description = "The Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. There is a PIO peripheral that can be used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device."
full_description = '''Adafruit Feather RP2040 with USB Type A Host by Liz Clark and 1 other contributor Contributors: Tim C published April 25, 2023, last edited February 23, 2025 last major update February 21, 2025 posted in Hacks Adafruit Products Arduino Compatibles Feather/ Feather Boards Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Power Management CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input NeoPixel I2C USB Host Device Info USB Host Read Data Arduino IDE Setup Arduino Usage Blink I2C Scan Test USB Host Device Info Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart Featured Products view all Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart 13 Updated Beginner Product guide Overview You're probably really used to microcontroller boards with USB, but what about a dev board with two? Two is more than one, so that makes it twice as good! And the Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. Now you might be thinking "hey waitaminute, the RP2040 doesn't have two USB port peripherals??? and you'd be correct! But what it does have is a nifty PIO peripheral that can be (ab)used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device. This work is originally by sekigon on GitHub, and if you're using the Pico C/C++ SDK, that's still the recommended library to use. Check out the TinyUSB 'dual role' examples for some things you can do! For example, datalogging to a USB Key. Or reading from another device/microcontroller that has USB CDC serial interface. Or creating an HID re-mapper. Or connecting to weird devices that require firmware-updates like the Cypress EZ-USB based Intellikeys communications board. Note that this is definitely a firmware hack: you will need to dedicate the second ARM core and both PIO peripherals to just handling the USB messages, but we find that it does work fairly well, or at least as well as most microcontroller's USB Host peripherals! We also include a 1 Amp boost converter based on the TPS61023 so you can run from Lipo battery and get a nice clean 5V output for the USB devices. The booster has the enable pin tied to one of the extra GPIO on the RP2040 so power can be manually turned on and off to hard-reset whatever is connected. At the Feather's heart is an RP2040 chip, clocked at 133 MHz and at 3.3V logic, the same one used in the Raspberry Pi Pico. This chip has 264K of RAM and is paired with a whopping 8MB of external QSPI FLASH! There's even room left over for a STEMMA QT connector for plug-and-play of I2C devices! To make it easy to use for portable projects, we added a connector for any of our 3.7V Lithium polymer batteries and built-in battery charging. You don't need a battery, it will run just fine straight from the USB Type C connector. But, if you do have a battery, you can take it on the go, then plug in the USB to recharge. The Feather will automatically switch over to USB power when it's available. Here're some handy specs! You get: Measures 2.0" x 0.9" x 0.28" (50.8mm x 22.8mm x 7mm) without headers soldered in Light as a (large?) feather - 6.3 grams RP2040 32-bit Cortex M0+ dual core running at ~133 MHz @ 3.3V logic and power 264 KB RAM 8 MB SPI FLASH chip for storing files and CircuitPython/MicroPython code storage. No EEPROM Tons of GPIO! 21 x GPIO pins with following capabilities: Four 12-bit ADCs (one more than Pico) Two I2C, Two SPI, and two UART peripherals, we label one for the 'main' interface in standard Feather locations 16 x PWM outputs - for servos, LEDs, etc Built-in 200mA+ lipoly charger with charging status indicator LED Pin #13 red LED for general purpose blinking RGB NeoPixel for full-color indication. On-board STEMMA QT connector that lets you quickly connect any Qwiic, STEMMA QT or Grove I2C devices with no soldering! Both Reset button and Bootloader select button for quick restarts (no unplugging-replugging to relaunch code) USB Type C connector lets you access built-in ROM USB bootloader and serial port debugging USB Type A connector for USB host capability. D+ on GPIO 16, D- on GPIO 17 5V Boost converter, up to 1 Amp peak output for USB peripheral power, with 500mA resettable fuse. Enable on GPIO 18. 3.3V Power/enable pin 4 mounting holes 12 MHz crystal for perfect timing. 3.3V regulator with 500mA peak current output Page last edited November 08, 2024 Text editor powered by tinymce. Pinouts'''
