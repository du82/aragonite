["https://learn.adafruit.com/adafruit-audio-bff"]
title = "Overview | Adafruit Audio BFF | Adafruit Learning System"
description = "The Audio BFF is designed to fit onto the back of any QT Py or Xiao board. Onboard is a MAX98357 audio amplifier and picoblade-compatible connector for plugging in a 4 or 8 ohm speaker. We use A1 for the audio data, A2 for wordselect clock, and A3 for bitclock. The SD card connects over the SPI port: MOSI, MISO and SCK plus A0 for card select."
full_description = '''Adafruit Audio BFF by Liz Clark published July 19, 2023, last edited January 22, 2025 posted in Adafruit Products Arduino Compatibles CircuitPython Breakout Boards/ Storage Breakout Boards/ Amplifiers/Sound Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts CircuitPython Python Docs Arduino Arduino Docs Downloads Single page Feedback? Corrections? Primary Products Adafruit Audio BFF Add-on for QT Py and Xiao $5.95 Add to Cart Featured Products view all Adafruit Audio BFF Add-on for QT Py and Xiao $5.95 Add to Cart Molex PicoBlade 2-pin Cable - 200mm $0.95 Add to Cart Speaker - 40mm Diameter - 4 Ohm 5 Watt $4.95 Add to Cart 512MB micro SD Memory Card $4.95 Add to Cart 10 Beginner Product guide 💕 1 Overview Our QT Py boards are a great way to make very small microcontroller projects that pack a ton of power - and now we have a way for you to turn many QT Py boards into powerful audio play projects that are super small! We call this the Adafruit Audio BFF - a "Best Friend Forever". When you were a kid, you may have learned about the "buddy" system; well, this product is kinda like that! A board that will watch your QT Py's back and give it more capabilities. This PCB is designed to fit onto the back of any QT Py or Xiao board, it can be soldered into place or use pin and socket headers to make it removable. Onboard is a MAX98357 audio amplifier and picoblade-compatible connector for plugging in a 4 or 8 ohm speaker. We use A1 for the audio data, A2 for wordselect clock, and A3 for bitclock. The SD card connects over the SPI port: MOSI, MISO and SCK plus A0 for card select. This pinout will work with ESP32 series, nRF52840, and RP2040 chipset boards. It won't work with the ATSAMD21 'original 'QT Py because those pins on the SAMD21 are not I2S capable. However, you could cut and rewire the traces to connect to the I2S pads if desired - personally, we recommend just upgrading to an RP2040 QT Py instead. We include some header that you can solder to your QT Py. You can also pick up an Itsy Bitsy short female header kit to make it removable but compact, you'll just need to trim down the headers to 7 pins long. Comes as an assembled and tested PCB For any QT Py or Xiao boards Contains a MAX98357 3 Watt audio amplifier pre-configured for 'stereo' mix output and 9 dB gain which will work great for any project. Use any micro SD card that supports SPI mode with one CS pin. Connect to the speaker output with a picoblade-compatible 2-pin cable. We recommend this 3W 4 ohm speaker There are various Arduino / CircuitPython / MicroPython libraries can be used to talk to the SD card and I2S amplifier. Speaker, microSD memory card, and QT Py are not included. Page last edited March 08, 2024 Text editor powered by tinymce. Pinouts'''
