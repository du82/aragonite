["https://learn.adafruit.com/adafruit-20w-stereo-audio-amplifier-class-d-max9744"]
title = "Overview | Adafruit 20W Stereo Audio Amplifier - MAX9744 | Adafruit Learning System"
description = "Pump up the volume with this 20W stereo amplifier! This slim little board has a class D amplifier onboard that can drive 2 channels of 4-8 ohm impedance speakers at 20W each. Power it with 5-12VDC using the onboard DC power jack and plug stereo line level into the 3.5mm stereo headphone jack and jam out with ease. Since it's class D, its completely cool-running, no heat sinks are required and it's extremely efficient - up to 93% efficiency makes it great for portable or battery powered rigs."
full_description = "Adafruit 20W Stereo Audio Amplifier - MAX9744 by lady ada published March 12, 2014, last edited January 20, 2025 posted in Adafruit Products Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Assembly Basic Test Analog Control Arduino Digital Control Python & CircuitPython Python Docs Downloads Single page Feedback? Corrections? Featured Products view all Stereo 20W Class D Audio Amplifier - MAX9744 $19.95 Add to Cart Stereo 3.5mm Plug/Plug Audio Cable - 6 feet $2.95 Add to Cart Right-Angle 3.5mm Stereo Plug to Pigtail Cable $1.95 Add to Cart 12V 5A switching power supply $24.95 Add to Cart 8 x AA battery holder with 5.5mm/2.1mm Plug and On/Off Switch $5.95 Add to Cart 8 x AA battery holder $2.95 Add to Cart Panel Mount 10K potentiometer (Breadboard Friendly) Out of Stock 46 Intermediate Project guide Overview Pump up the volume with this 20W stereo amplifier! This slim little board has a class D amplifier onboard that can drive 2 channels of 4-8 ohm impedance speakers at 20W each. Power it with 5-12VDC using the onboard DC power jack and plug stereo line level into the 3.5mm stereo headphone jack and jam out with ease. Since it's class D, its completely cool-running, no heat sinks are required and it's extremely efficient - up to 93% efficiency makes it great for portable or battery powered rigs. We like the MAX9744 amplifier at the heart of this board because its very easy to use, but it also has both analog and digital volume control capability. Use a single 1KΩ pot (we include one) to adjust volume analog-style. Or hook it up to your favorite microcontroller and send I2C commands to set 64-steps of volume amplification. Some great stats about the MAX9744 Power from 4.5V-14V DC voltage Up to 93% efficient (88-93% typical) 20mA quiescent current (or put into shutdown for 1uA quiescent) Up to 29.5dB max gain Use DC or AC coupled line-level input, up to 3Vpp Filterless Spread-Spectrum Modulation LowersRadiated RF Emissions from Speaker Cables 20W Stereo Output (4Ω, VDD = 12V, THD+N = 10%) Low 0.04% THD+N Integrated Click-and-Pop Suppression Short-Circuit and Thermal-Overload Protection We took this lovely chip and wrapped it up into a breakout for you, with polarity-protection, jacks and terminal blocks, i2c level shifting, and a spot to solder in a volume pot. Each order comes with one MAX9744 breakout board with all surface-mount parts fully assembled and tested. We also include 3 x 2pin and 1 x 3pin terminal blocks, a 470uF power filter capacitor and 1KΩ trim pot. To use this board, a little soldering is required to attach the terminal blocks and other components, but its fairly easy and expect it should take less than 15 minutes. Page last edited March 12, 2014 Text editor powered by tinymce. Pinouts"
