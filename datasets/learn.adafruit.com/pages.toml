["https://learn.adafruit.com/adafruit-feather-rp2040-with-usb-type-a-host/arduino-ide-setup"]
title = "Arduino IDE Setup | Adafruit Feather RP2040 with USB Type A Host | Adafruit Learning System"
description = "The Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. There is a PIO peripheral that can be used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device."
full_description = '''Adafruit Feather RP2040 with USB Type A Host by Liz Clark and 1 other contributor Contributors: Tim C published April 25, 2023, last edited February 23, 2025 last major update February 21, 2025 posted in Hacks Adafruit Products Arduino Compatibles Feather/ Feather Boards Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Power Management CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input NeoPixel I2C USB Host Device Info USB Host Read Data Arduino IDE Setup Arduino Usage Blink I2C Scan Test USB Host Device Info Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart Featured Products view all Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart 13 Updated Beginner Product guide Arduino IDE Setup The Arduino Philhower core provides support for RP2040 microcontroller boards. This page covers getting your Arduino IDE set up to include your board. Arduino IDE Download The first thing you will need to do is to download the latest release of the Arduino IDE. The Philhower core requires version 1.8 or higher. Arduino IDE Download Download and install it to your computer. Once installed, open the Arduino IDE. Adding the Philhower Board Manager URL In the Arduino IDE, and navigate to the Preferences window. You can access it through File > Preferences on Windows or Linux, or Arduino > Preferences on OS X. The Preferences window will open. In the Additional Boards Manager URLs field, you'll want to add a new URL. The list of URLs is comma separated, and you will only have to add each URL once. The URLs point to index files that the Board Manager uses to build the list of available & installed boards. Copy the following URL. https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json Add the URL to the the Additional Boards Manager URLs field (highlighted in red below). Click OK to save and close Preferences. Add Board Support Package In the Arduino IDE, click on Tools > Board > Boards Manager. If you have previously selected a board, the Board menu item may have a board name after it. In the Boards Manager, search for RP2040. Scroll down to the Raspberry Pi Pico/RP2040 by Earle F Philhower, III entry. Click Install to install it. Installing a new board package can take a few minutes. Don't click Cancel! Once installation is complete, click Close to close the Boards Manager. Choose Your Board In the Tools > Boards menu, you should now see Raspberry Pi RP2040 Boards (possibly followed by a version number). Navigate to the Raspberry Pi RP2040 Boards menu. You will see the available boards listed. Navigate to the Raspberry Pi RP2040 Boards menu and choose Adafruit Feather RP2040 USB Host. If there is no serial Port available in the dropdown, or an invalid one appears - don't worry about it! The RP2040 does not actually use a serial port to upload, so its OK if it does not appear if in manual bootload mode. You will see a serial port appear after uploading your first sketch. Now you're ready to begin using Arduino with your RP2040 board! Troubleshooting If you have any strange errors after updating the Raspberry Pi Pico/RP2040 by Earle F Philhower, III board support package (BSP) from the boards manager you may need to start with a fresh install of the BSP. Close out of the Arduino IDE and navigate to your Arduino packages folder: C:\Users\[username]\AppData\Local\Arduino15\packages and delete the /rp2040 folder. After that, open the Arduino IDE and follow the steps above for installing the BSP. The errors should not occur. Page last edited October 02, 2024 Text editor powered by tinymce. USB Host Read Data Arduino Usage'''
