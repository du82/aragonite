title = "Overview | Getting Started with MyoWare Muscle Sensor | Adafruit Learning System"
description = "This tutorial will show you how to get up and running with the MyoWare Muscle Sensor."
full_description = '''Getting Started with MyoWare Muscle Sensor by Kate Hartman and 1 other contributor Contributors: Becky Stern published January 27, 2016, last edited January 27, 2016 posted in Sensors/ Biometric Wearables Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Preparing the Sensor Circuit Code Placing Electrodes Sensor Values What's Next Single page Feedback? Corrections? Featured Products view all MyoWare 2.0 Muscle Sensor Out of Stock Muscle Sensor Surface EMG Electrodes - H124SG Covidien $4.95 Add to Cart Adafruit Feather 32u4 Basic Proto $19.95 Add to Cart Adafruit USB Isolator - 100mA Isolated Low/Full Speed USB $34.95 Add to Cart Silicone Cover Stranded-Core Wire - 2m 26AWG Red $0.95 Add to Cart Silicone Cover Stranded-Core Wire - 2m 26AWG Black $0.95 Add to Cart Adafruit Feather 32u4 Bluefruit LE $29.95 Add to Cart Multi-Colored Heat Shrink Pack - 3/32" + 1/8" + 3/16" Diameters $4.95 Add to Cart 92 Beginner Project guide Overview Want to activate your project by flexing a bicep, raising an eyebrow, or clenching a fist? The MyoWare Muscle Sensor can help you make that happen. This sensor uses EMG (electromyography) to sense the electrical activity of your muscles. It then converts that into a varying voltage that can be read on the analog input pin of any microcontroller. What you will need for this exercise: MyoWare Muscle Sensor EMG Electrodes Adafruit Feather 32u4 Basic Proto (or any other Arduino-compatible that has analog input pins) breadboard a strip of (3) male/male jumper wires silicone cover stranded core wire Adafruit USB isolator USB mini cable USB micro cable E6000 or Quick Hold adhesive (optional) zip tie Before you begin, please review and understand the following prerequisite guides: Adafruit Feather 32u4 Basic Proto Adafruit guide to excellent soldering MyoWare muscle sensor datasheet Page last edited January 21, 2016 Text editor powered by tinymce. Preparing the Sensor'''
