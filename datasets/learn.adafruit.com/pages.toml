["https://learn.adafruit.com/adafruit-vl53l4cd-time-of-flight-distance-sensor"]
title = "Overview | Adafruit VL53L4CD Time of Flight Distance Sensor | Adafruit Learning System"
description = "The Adafruit VL53L4CD Time of Flight Sensor is another great Time of Flight distance sensor from ST in the VL5 series of chips, this one is great for shorter distances. The sensor contains a very tiny invisible laser source and a matching sensor that can detect time of flight. The sensor is small and easy to use in any robotics or interactive project."
full_description = '''Adafruit VL53L4CD Time of Flight Distance Sensor by Liz Clark published March 23, 2022, last edited January 21, 2025 posted in Adafruit Products Sensors/ Proximity CircuitPython Programming/ MicroPython / CircuitPython STEMMA Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Python & CircuitPython Python Docs Arduino Arduino Docs WipperSnapper Downloads Single page Feedback? Corrections? Primary Products Your browser does not support the video tag. Adafruit VL53L4CD Time of Flight Distance Sensor - ~1 to 1300mm $14.95 Add to Cart Featured Products view all Your browser does not support the video tag. Adafruit VL53L4CD Time of Flight Distance Sensor - ~1 to 1300mm $14.95 Add to Cart STEMMA QT / Qwiic JST SH 4-Pin Cable - 50mm Long Out of Stock JST SH 4-pin Cable with Alligator Clips - STEMMA QT / Qwiic $2.95 Add to Cart STEMMA QT / Qwiic JST SH 4-Pin Cable - 200mm Long Out of Stock STEMMA QT / Qwiic JST SH 4-pin to Premium Male Headers Cable $0.95 Add to Cart STEMMA QT / Qwiic JST SH 4-pin Cable - 100mm Long $0.95 Add to Cart 14 Beginner Product guide Overview Your browser does not support the video tag. The Adafruit VL53L4CD Time of Flight Sensor is another great Time of Flight distance sensor from ST in the VL5 series of chips, this one is great for shorter distances. The sensor contains a very tiny invisible laser source and a matching sensor. The VL53L4CD can detect the "time of flight", or how long the light has taken to bounce back to the sensor. Since it uses a very narrow light source, it is good for determining distance of only the surface directly in front of it. Unlike sonars that bounce ultrasonic waves, the 'cone' of sensing is very narrow. Unlike IR distance sensors which try to measure the amount of light bounced, the VL53 is much more precise and doesn't have linearity problems or 'double imaging' where you can't tell if an object is very far or very close. This breakout ships with a protector over the sensor. It must be removed before use! See details below. This is another 'big sister' of the VL6180X ToF sensor and can handle about ~1 to 1300mm of range distance: basically it combines the short range of the VL6180X in that it can sense up to the body of the sensor, with the increased range of the VL53L0X, which can handle about 50mm to 1200mm of range distance. The sensor is small and easy to use in any robotics or interactive project. Since it needs 2.8V power and logic, we put the little fellow on a breakout board with a regulator and level shifting. You can use it with any 3-5V power or logic microcontroller with no worries. Works great with the 3.3V logic level of a Feather or Raspberry Pi, or the 5v level of a Metro 328 or Arduino Uno. This breakout is ready to work with most common microcontrollers or SBCs. And since it speaks I2C, you can easily connect it up with two data wires plus power and ground. As if that weren't enough, we've also added SparkFun qwiic compatible STEMMA QT connectors for the I2C bus so you don't even need to solder. Just wire up to your favorite micro with a plug-and-play cable to get ToF data ASAP. For a no-solder experience, just wire up to your favorite micro, like the STM32F405 Feather using a STEMMA QT adapter cable. The Stemma QT connectors also mean the VL53L4CD can be used with our various associated accessories. QT Cable is not included, but we have a variety in the shop Communicating to the sensor is done over I2C with an API written by ST, they have an Arduino library with an example for communication here. Removing the Protective Tape Be careful when removing the tape! You don't want to damage the sensor. Using tweezers (or some other appropriate tool), CAREFULLY remove the protective tape over the sensor, as seen in the image below. There is a small tab on the side of the tape that you can use to remove it. Page last edited March 08, 2024 Text editor powered by tinymce. Pinouts'''
