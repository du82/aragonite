["https://learn.adafruit.com/adafruit-feather-rp2040-with-usb-type-a-host/the-circuitpy-drive"]
title = "The CIRCUITPY Drive | Adafruit Feather RP2040 with USB Type A Host | Adafruit Learning System"
description = "The Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. There is a PIO peripheral that can be used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device."
full_description = '''Adafruit Feather RP2040 with USB Type A Host by Liz Clark and 1 other contributor Contributors: Tim C published April 25, 2023, last edited February 23, 2025 last major update February 21, 2025 posted in Hacks Adafruit Products Arduino Compatibles Feather/ Feather Boards Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Power Management CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input NeoPixel I2C USB Host Device Info USB Host Read Data Arduino IDE Setup Arduino Usage Blink I2C Scan Test USB Host Device Info Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart Featured Products view all Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart 13 Updated Beginner Product guide The CIRCUITPY Drive When CircuitPython finishes installing, or you plug a CircuitPython board into your computer with CircuitPython already installed, the board shows up on your computer as a USB drive called CIRCUITPY. The CIRCUITPY drive is where your code and the necessary libraries and files will live. You can edit your code directly on this drive and when you save, it will run automatically. When you create and edit code, you'll save your code in a code.py file located on the CIRCUITPY drive. If you're following along with a Learn guide, you can paste the contents of the tutorial example into code.py on the CIRCUITPY drive and save it to run the example. With a fresh CircuitPython install, on your CIRCUITPY drive, you'll find a code.py file containing print("Hello World!") and an empty lib folder. If your CIRCUITPY drive does not contain a code.py file, you can easily create one and save it to the drive. CircuitPython looks for code.py and executes the code within the file automatically when the board starts up or resets. Following a change to the contents of CIRCUITPY, such as making a change to the code.py file, the board will reset, and the code will be run. You do not need to manually run the code. This is what makes it so easy to get started with your project and update your code! Note that all changes to the contents of CIRCUITPY, such as saving a new file, renaming a current file, or deleting an existing file will trigger a reset of the board. Boards Without CIRCUITPY CircuitPython is available for some microcontrollers that do not support native USB. Those boards cannot present a CIRCUITPY drive. This includes boards using ESP32 or ESP32-C3 microcontrollers. On these boards, there are alternative ways to transfer and edit files. You can use the Thonny editor, which uses hidden commands sent to the REPL to read and write files. Or you can use the CircuitPython web workflow, introduced in Circuitpython 8. The web workflow provides browser-based WiFi access to the CircuitPython filesystem. These guides will help you with the web workflow: CircuitPython on ESP32 Quick Start CircuitPython Web Workflow Code Editor Quick Start Page last edited June 21, 2024 Text editor powered by tinymce. Installing the Mu Editor Creating and Editing Code'''
