title = "Overview | Adafruit INA219 Current Sensor Breakout | Adafruit Learning System"
description = "The INA219B breakout board will solve all your power-monitoring problems. Instead of struggling with two multimeters, you can use this breakout to measure both the high side voltage and DC current draw over I2C with 1% precision."
full_description = '''Adafruit INA219 Current Sensor Breakout by lady ada and 1 other contributor Contributors: Kattni Rembor published October 26, 2012, last edited January 22, 2025 last major update September 21, 2023 posted in Adafruit Products Arduino Compatibles Breakout Boards/ Batteries/Power STEMMA Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Assembly Wiring Arduino Code Library Reference Arduino Library Docs Python & CircuitPython Python Docs WipperSnapper Downloads Single page Feedback? Corrections? Featured Products view all INA219 High Side DC Current Sensor Breakout - 26V ±3.2A Max $9.95 Add to Cart STEMMA QT / Qwiic JST SH 4-pin Cable - 100mm Long $0.95 Add to Cart STEMMA QT / Qwiic JST SH 4-pin to Premium Male Headers Cable $0.95 Add to Cart Premium Male/Male Jumper Wires - 40 x 6" (150mm) $3.95 Add to Cart Full Sized Premium Breadboard - 830 Tie Points Out of Stock Your browser does not support the video tag. Adafruit INA219 FeatherWing $7.95 Add to Cart Adafruit METRO 328 Fully Assembled - Arduino IDE compatible Out of Stock 74 Beginner Product guide Overview The INA219B breakout board and the INA219 FeatherWing will solve all your power-monitoring problems. Instead of struggling with two multimeters, you can use this breakout to measure both the high side voltage and DC current draw over I2C with 1% precision. As if that weren't enough, we've now also added SparkFun qwiic compatible STEMMA QT connectors for the I2C bus so you don't even need to solder the I2C and power lines. Just wire up to your favorite micro using a STEMMA QT adapter cable. The Stemma QT connectors also mean the INA219 can be used with our various associated accessories. QT Cable is not included, but we have a variety in the shop. Why the High Side? Most current-measuring devices such as our current panel meter are only good for low side measuring. That means that unless you want to get a battery involved, you have to stick the measurement resistor between the target ground and true ground. Since the voltage drop across the resistor is proportional to the current draw, this means that the ground reference will change with varying current. Having a shifting ground reference can cause problems for many circuits. The INA219B chip is much smarter - it can handle high side current measuring, up to +26VDC, even though it is powered with 3 or 5V. It will also report back that high side voltage, which is great for tracking battery life or solar panels. How does it work? A precision amplifier measures the voltage across the 0.1 ohm, 1% sense resistor. Since the amplifier maximum input difference is ±320mV this means it can measure up to ±3.2 Amps. With the internal 12 bit ADC, the resolution at ±3.2A range is 0.8mA. With the internal gain set at the minimum of div8, the max current is ±400mA and the resolution is 0.1mA. Advanced hackers can remove the 0.1 ohm current sense resistor and replace it with their own to change the range (say a 0.01 ohm to measure up 32 Amps with a resolution of 8mA) Note that when switching inductive loads, the instantaneous voltage levels may greatly exceed steady-state levels due to inductive kickback. Chip damage can occur if you do not take precautions to protect against inductive spikes. There are two versions of this board - the STEMMA QT version shown above, and the original header-only version shown below. The code works the same on both! Page last edited July 10, 2024 Text editor powered by tinymce. Pinouts'''
