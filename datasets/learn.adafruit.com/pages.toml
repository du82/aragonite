["https://learn.adafruit.com/adafruit-feather-rp2040-with-usb-type-a-host/factory-reset-2"]
title = "Factory Reset | Adafruit Feather RP2040 with USB Type A Host | Adafruit Learning System"
description = "The Adafruit Feather RP2040 with USB Host is double-the-fun of our other Feather RP2040 boards, with a USB Type A port on the end for connecting USB devices to. There is a PIO peripheral that can be used to emulate a USB host peripheral. You get to keep the main USB port for uploading, debugging, and data communication, while at the same time sending and receiving data to just-about-any USB device."
full_description = '''Adafruit Feather RP2040 with USB Type A Host by Liz Clark and 1 other contributor Contributors: Tim C published April 25, 2023, last edited February 23, 2025 last major update February 21, 2025 posted in Hacks Adafruit Products Arduino Compatibles Feather/ Feather Boards Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Power Management CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input NeoPixel I2C USB Host Device Info USB Host Read Data Arduino IDE Setup Arduino Usage Blink I2C Scan Test USB Host Device Info Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart Featured Products view all Adafruit Feather RP2040 with USB Type A Host $17.50 Add to Cart 13 Updated Beginner Product guide Factory Reset The Feather RP2040 USB Host ships running code that performs a USB device scan to quickly test the USB host functionality and get enumeration data in the Serial Monitor. It's lovely, but you probably had other plans for the board. As you start working with your board, you may want to return to the original code to begin again, or you may find your board gets into a bad state. Either way, this page has you covered. Completing a factory reset will erase your board's firmware which is also used for storing CircuitPython/Arduino/Files! Be sure to back up your data first. Step 1. Download the factory-reset.uf2 file Save the following file wherever is convenient for you. You will need to access it to copy it to your board. Click to download Adafruit Feather RP2040 USB Host Factory Reset.uf2 Step 2. Enter RP2040 bootloader mode Entering the RP2040 bootloader is easy. Complete the following steps. Before you start, make sure your microcontroller is plugged into USB port to your computer using a data/sync cable. Charge-only cables will not work! To enter the bootloader: Press and hold the Boot button down. Don't let go of it yet! Press and release the Reset button. You should still have the Boot button pressed while you do this. Continue holding the Boot button until you see the RPI-RP2 drive appear. You can now release but Boot button. Step 3. Drag UF2 file to RPI-RP2 Navigate to the folder where you downloaded the factory-reset.uf2 file from Step 1. Drag the factory-reset.uf2 file to the RPI-RP2 drive. The RPI-RP2 drive will disappear. The board will automatically reboot. You can use it to quickly test the USB host functionality and get enumeration data in the Serial Monitor. You've successfully returned your board to a factory reset state! Flash Resetting UF2 If your board ever gets into a really weird state and doesn't even show up when loading code, try loading this 'nuke' UF2 which will do a 'deep clean' on your Flash Memory. You will lose all the files on the board, but at least you'll be able to revive it! Download the file below, and follow the instructions in Step 2 and Step 3 above to load this UF2. Then, start again at Step 1 to return your board to factory reset state. Download flash erasing "nuke" UF2 Page last edited October 02, 2024 Text editor powered by tinymce. USB Host Device Info Downloads'''
