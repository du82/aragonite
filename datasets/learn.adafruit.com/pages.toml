["https://learn.adafruit.com/adafruit-metro-rp2350/analog-input"]
title = "Analog Input | Adafruit Metro RP2350 | Adafruit Learning System"
description = 'Choo! Choo! This is the RP2350 Metro Line, making all station stops at "Dual Cortex M33 mountain", "528K RAM round-about" and "16 Megabytes of Flash town". This train is piled high with hardware that complements the Raspberry Pi RP2350 chip to make it an excellent development board for projects that want Arduino-shape-compatibility or just need the extra space and debugging ports.'
full_description = '''Adafruit Metro RP2350 by Tim C published February 19, 2025, last edited February 26, 2025 posted in Adafruit Products Raspberry Pi Arduino Compatibles CircuitPython STEMMA Save New Favorite × Please sign in to include this guide in your list of favorites. You will be redirected back to this guide once you sign in, and can then save this guide as one of your favorites. Close Download Overview Pinouts Install CircuitPython Installing the Mu Editor The CIRCUITPY Drive Creating and Editing Code Exploring Your First CircuitPython Program Connecting to the Serial Console Interacting with the Serial Console The REPL CircuitPython Libraries CircuitPython Documentation Recommended Editors Advanced Serial Console on Windows Advanced Serial Console on Mac Advanced Serial Console on Linux Troubleshooting Frequently Asked Questions Welcome to the Community! CircuitPython Essentials Blink Digital Input Analog Input NeoPixel I2C I2S Audio SD Card HSTX Display Arduino IDE Setup Arduino Usage Blink NeoPixel I2C Scan Test SD Card Factory Reset Downloads Single page Feedback? Corrections? Primary Products Adafruit Metro RP2350 Out of Stock 1 New Beginner Product guide Analog Input Your microcontroller board has both digital and analog signal capabilities. Some pins are analog, some are digital, and some are capable of both. Check the Pinouts page in this guide for details about your board. Analog signals are different from digital signals in that they can be any voltage and can vary continuously and smoothly between voltages. An analog signal is like a dimmer switch on a light, whereas a digital signal is like a simple on/off switch. Digital signals only can ever have two states, they are either are on (high logic level voltage like 3.3V) or off (low logic level voltage like 0V / ground). By contrast, analog signals can be any voltage in-between on and off, such as 1.8V or 0.001V or 2.98V and so on. Analog signals are continuous values which means they can be an infinite number of different voltages. Think of analog signals like a floating point or fractional number, they can smoothly transiting to any in-between value like 1.8V, 1.81V, 1.801V, 1.8001V, 1.80001V and so forth to infinity. Many devices use analog signals, in particular sensors typically output an analog signal or voltage that varies based on something being sensed like light, heat, humidity, etc. Analog to Digital Converter (ADC) An analog-to-digital-converter, or ADC, is the key to reading analog signals and voltages with a microcontroller. An ADC is a device that reads the voltage of an analog signal and converts it into a digital, or numeric, value. The microcontroller can’t read analog signals directly, so the analog signal is first converted into a numeric value by the ADC. The black line below shows a digital signal over time, and the red line shows the converted analog signal over the same amount of time. Once that analog signal has been converted by the ADC, the microcontroller can use those digital values any way you like! Potentiometers A potentiometer is a small variable resistor that you can twist a knob or shaft to change its resistance. It has three pins. By twisting the knob on the potentiometer you can change the resistance of the middle pin (called the wiper) to be anywhere within the range of resistance of the potentiometer. By wiring the potentiometer to your board in a special way (called a voltage divider) you can turn the change in resistance into a change in voltage that your board’s analog to digital converter can read. To wire up a potentiometer as a voltage divider: Connect one outside pin to ground Connect the other outside pin to voltage in (e.g. 3.3V) Connect the middle pin to an analog pin (e.g. A0) Hardware In addition to your microcontroller board, you will need the following hardware to follow along with this example. Potentiometer Your browser does not support the video tag. STEMMA Wired Potentiometer Breakout Board - 10K ohm Linear For the easiest way possible to measure twists, turn to this STEMMA potentiometer breakout (ha!). This plug-n-play pot comes with a JST-PH 2mm connector and a matching $3.95 In Stock Add to Cart Wire Up the Potentiometer Connect the potentiometer to your board as follows. Potentiometer GND to Metro GND (black wire) Potentiometer wiper to Metro A0 (white wire) Potentiometer positive to Metro 3.3V (red wire) Reading Analog Pin Values CircuitPython makes it easy to read analog pin values. Simply import two modules, set up the pin, and then print the value inside a loop. You'll need to connect to the serial console to see the values printed out. In the example below, click the Download Project Bundle button below to download the necessary libraries and the code.py file in a zip file. Extract the contents of the zip file, open the directory CircuitPython_Templates/analog_pin_values/ and then click on the directory that matches the version of CircuitPython you're using and copy the contents of that directory to your CIRCUITPY drive. Your CIRCUITPY drive should now look similar to the following image: Download Project Bundle Copy Code # SPDX-FileCopyrightText: 2021 Kattni Rembor for Adafruit Industries # SPDX-License-Identifier: MIT """CircuitPython analog pin value example""" import time import board import analogio analog_pin = analogio.AnalogIn(board.A0) while True: print(analog_pin.value) time.sleep(0.1) # SPDX-FileCopyrightText: 2021 Kattni Rembor for Adafruit Industries # SPDX-License-Identifier: MIT """CircuitPython analog pin value example""" import time import board import analogio analog_pin = analogio.AnalogIn(board.A0) while True: print(analog_pin.value) time.sleep(0.1) View on GitHub Now, rotate the potentiometer to see the values change. What do these values mean? In CircuitPython ADC values are put into the range of 16-bit unsigned values. This means the possible values you’ll read from the ADC fall within the range of 0 to 65535 (or 2^16 - 1). When you twist the potentiometer knob to be near ground, or as far to the left as possible, you see a value close to zero. When you twist it as far to the right as possible, near 3.3 volts, you see a value close to 65535. You’re seeing almost the full range of 16-bit values! The code is simple. You begin by importing three modules: time, board and analogio. All three modules are built into CircuitPython, so you don't need to download anything to get started. Then, you set up the analog pin by creating an analogio.AnalogIn() object, providing it the desired pin using the board module, and saving it to the variable analog_pin. Finally, in the loop, you print out the analog value with analog_pin.value, including a time.sleep() to slow down the values to a human-readable rate. Reading Analog Voltage Values These values don't necessarily equate to anything obvious. You can get an idea of the rotation of the potentiometer based on where in the range the value falls, but not without doing some math. Remember, you wired up the potentiometer as a voltage divider. By adding a simple function to your code, you can get a more human-readable value from the potentiometer. You'll need to connect to the serial console to see the values printed out. In the example below, click the Download Project Bundle button below to download the necessary libraries and the code.py file in a zip file. Extract the contents of the zip file, open the directory CircuitPython_Templates/analog_voltage_values/ and then click on the directory that matches the version of CircuitPython you're using and copy the contents of that directory to your CIRCUITPY drive. Your CIRCUITPY drive should now look similar to the following image: Download Project Bundle Copy Code # SPDX-FileCopyrightText: 2021 Kattni Rembor for Adafruit Industries # SPDX-License-Identifier: MIT """CircuitPython analog voltage value example""" import time import board import analogio analog_pin = analogio.AnalogIn(board.A0) def get_voltage(pin): return (pin.value * 3.3) / 65535 while True: print(get_voltage(analog_pin)) time.sleep(0.1) # SPDX-FileCopyrightText: 2021 Kattni Rembor for Adafruit Industries # SPDX-License-Identifier: MIT """CircuitPython analog voltage value example""" import time import board import analogio analog_pin = analogio.AnalogIn(board.A0) def get_voltage(pin): return (pin.value * 3.3) / 65535 while True: print(get_voltage(analog_pin)) time.sleep(0.1) View on GitHub Now, rotate the potentiometer to see the values change. Now the values range from around 0 to 3.3! Note that you may not get all the way to 0 or 3.3. This is normal. The example code begins with the same imports and pin setup. This time, you include the get_voltage helper. This function requires that you provide an analog pin. It then maps the raw analog values, 0 to 65535, to the voltage values, 0 to 3.3. It does the math so you don't have to! Finally, inside the loop, you provide the function with your analog_pin, and print the resulting values. That's all there is to reading analog voltage values using CircuitPython! Page last edited February 17, 2025 Text editor powered by tinymce. Digital Input NeoPixel'''
