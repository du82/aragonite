ears he has created eight popular online training courses taken by nearly two hundred thousand students globally. Adrian is obsessed with helping his students learn and develop in the most efficient and effective way possible and draws on over two decades of technology design, implementation and fault-finding experience. Outside work Adrian loves home automation, green technology, UAV flying and cats. Course Curriculum INTRODUCTION & SCENARIO Available in days days after you enroll Preview Public Introduction (6:00) Preview Finding and Using the Course Resources (14:31) Preview Site tools and features (8:36) Preview Scenario - Animals4life (13:28) Preview Connect with other students and your instructor (3:10) Preview COURSE UPGRADES - SAVE $ WHEN ADDING MORE COURSES Start SHARED LESSONS [SHAREDALL] [ASSOCIATESHARED] etc... Start 🚨 READ ME 🚨 - ENABLE EMAIL UPDATES (IT'S WORTH IT) Course Fundamentals and AWS Accounts Available in days days after you enroll Preview AWS Accounts - The Basics (11:33) Start [DEMO] ACCOUNTS - STEP1 - Creating GENERAL AWS Account (14:44) Preview Multi-factor Authentication (MFA) (8:25) Start [DEMO] ACCOUNTS - STEP2 - Securing GENERAL AWS Account (9:44) Start [DEMO] ACCOUNTS - STEP3 - Creating a Budget (6:46) Start [DOITYOURSELF] Creating the Production Account (4:59) Preview Identity and Access Management (IAM) Basics (13:01) Start [DEMO] ACCOUNTS - STEP4 - Adding IAMADMIN to GENERAL Account (12:36) Start [DEMO] ACCOUNTS - STEP4 - Adding IAMADMIN to PRODUCTION Account (10:17) Start IAM Access Keys (7:10) Start [DEMO] Creating Access keys and setting up AWS CLI v2 tools (17:43) Networking and Technical Fundamentals (moved to dedicated course) Available in days days after you enroll Start TECH FUNDAMENTALS CONTENT (!!PLEASE READ ME!!) Domain 6: Management and Security Governance [SCS-C02] Available in days days after you enroll Start AWS Organizations (12:56) Start [SHAREDALL] [DEMO] AWS Organizations (19:48) Start Service Control Policies (S