927432-top { padding-top: 60px; } .b-167927432-bottom { padding-bottom: 60px; } } Course Information-----This course is up-to-date with the latest (April 30 2024) AZ-500 exam.-----The Microsoft Certified Azure Security Engineer can really give you the edge in today's market. It covers security features and products for a big selection of Azure services, and is very hands-on focused, covering skills you can use to secure Azure solutions in the real world.Throughout this course you'll gain lots of experience configuring and deploying secure Azure solutions. I don't want you to just pass the exam. I want you to have a deep understanding of how and why you would use these Azure security services.You will complete hands-on demos using click-to-deploy resources, and practice with case studies and quizzes, so you can work confidently as an Azure Security Engineer.Who Can Take This Course?This course has been designed for students of all different types of backgrounds. We will progressively build knowledge and experience working with a variety of services, is such a way that will help you to gain familiarity with core products and features, before we move to more advanced services and configuration.You do not have to have completed AZ-104 or AZ-305 to take this course - everything required to learn is included.If you've never worked with Azure or any cloud provider before, you may also be interested in my free Getting Started with Azure course). .b-167927433-top { padding-top: 22.400000000000002px; } .b-167927433-bottom { padding-bottom: 22.400000000000002px; } .b-167927433-content_width { width: 710px; } .b-167927433-background_color { background-color: #FFFFFF; } .b-167927433-heading_text_color { color: #36414D; } .b-167927433-lecture_name_background_color { background-color: #F9FAFD; } .b-167927433-section_name_background_color { background-color: #EFEFF5; } @media screen and (min-width: 768px) { .b-167927433-top { padding-top: 40px; } .b-167927433-bottom { padding-botto