full_description = '''.b-190147749-top { padding-top: 5.6000000000000005px; } .b-190147749-bottom { padding-bottom: 5.6000000000000005px; } .b-190147749-alignment { text-align: center; } .b-190147749-content_width { max-width: 668px; } .b-190147749-image_overlay { opacity: 1; } .b-190147749-background_color { background-color: #EFEFF5; } .b-190147749-heading_text_color { color: #FFFFFF; } .b-190147749-button_border_radius { border-radius: 25px; } .b-190147749-subheading_text_color { color: #FFFFFF; } .banner .b-190147749-heading_text_color { color: #FFFFFF } .banner .b-190147749-subheading_text_color { color: #FFFFFF } .banner__button.b-190147749-button_border_radius { border-radius: 25; } @media screen and (min-width: 768px) { .b-190147749-top { padding-top: 10px; } .b-190147749-bottom { padding-bottom: 10px; } } .bl { width: 100%; } AZ-700 Microsoft Azure Network Engineer Associate CertificationAvailable now for EARLY ACCESS, while still under development.25% off discount only available with coupon code: HURRYUP. Get 25% off with Early Access ($30 USD) .b-190147750-top { padding-top: 33.6px; } .b-190147750-bottom { padding-bottom: 33.6px; } .b-190147750-text_color { color: #36414D; } .b-190147750-content_width { max-width: 590px; } .b-190147750-background_color { background-color: #F5F5F8; } .b-190147750-heading_text_color { color: #36414D; } .block__text .b-190147750-text_color { color: #36414D } .block__text .b-190147750-content_width { width: 590px; } .block__text .b-190147750-heading_text_color h1, .block__text .b-190147750-heading_text_color h2, .block__text .b-190147750-heading_text_color h3, .block__text .b-190147750-heading_text_color h4, .block__text .b-190147750-heading_text_color h5, .block__text .b-190147750-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-190147750-top { padding-top: 60px; } .b-190147750-bottom { padding-bottom: 60px; } } Course Information-----EARLY ACCESS NOW AVAILABLE. Please note that this course is not yet complete.I'm working hard to finish this course for you as soon as possible. As thanks for your patience while I hurry up, you can get a 25% discount during early access until the course launches in full. You must enter code 'HURRYUP' for the 25% discount to apply.Full course launch ETA is Feb/March.-----The Microsoft Certified Azure Network Engineer helps elevate your networking skills. It covers networking services and skills that matter for security, administrators, architects, and application developers. This course dives deep into Azure networking services & is very hands-on focused.Throughout this course you'll gain lots of experience that will help you both design and implement networking in Azure.Networking really matters. Whether the solution you manage in Azure is private or public, it will rely on networking services of some form.Jump into this course to master these crucial skills. I don't want you to just pass the exam. I want you to have a deep understanding of how and why you would use these key Azure networking services.You will complete hands-on demos using click-to-deploy resources, and practice with case studies and quizzes, so you can work confidently as an Azure Network Engineer.Who Can Take This Course?This course has been designed for students of all different types of backgrounds. We will progressively build knowledge and experience working with a variety of services, is such a way that will help you to gain familiarity with core products and features, before we move to more advanced services and configuration.You do not have to have completed AZ-104 to take this course (though it does help) - I include all fundamentals, resources, and the context you need whatever your background.If you've never worked with Azure or any cloud provider before, you may also be interested in my free Getting Started with Azure course. .b-190147751-top { padding-top: 22.400000000000002px; } .b-190147751-bottom { padding-bottom: 22.400000000000002px; } .b-190147751-content_width { width: 710px; } .b-190147751-background_color { background-color: #FFFFFF; } .b-190147751-heading_text_color { color: #36414D; } .b-190147751-lecture_name_background_color { background-color: #F9FAFD; } .b-190147751-section_name_background_color { background-color: #EFEFF5; } @media screen and (min-width: 768px) { .b-190147751-top { padding-top: 40px; } .b-190147751-bottom { padding-bottom: 40px; } } .block__curriculum__section__title.b-190147751-section_name_background_color { background-color: #EFEFF5; } .block__curriculum__section__list__item.b-190147751-lecture_name_background_color { background-color: #F9FAFD; } Course Curriculum Introduction Available in days days after you enroll (Coming Soon) Welcome to the Course Start Shared Lessons Start About AZ-700 Exam Updates Start Let's Connect (3:21) Start Special Offers! Read Me... Start (Coming Soon) Following Along with this Course Available in days days after you enroll (Coming Soon) About this Section Start (Coming Soon) Working with Azure Subscriptions Start (Coming Soon) Demo - Explore your Lab Environment Start (Coming Soon) Working with Virtual Machines Start (Coming Soon) Working with Azure App Service Start (Coming Soon) Azure Networking Overview Start (Coming Soon) Virtual Network Essentials Available in days days after you enroll (Coming Soon) Network Addressing Fundamentals Start [SHARED] Virtual Networks (11:19) Start [SHARED] Demo - Configuring a VNet (5:31) Start [SHARED] IP Addressing (11:00) Start [SHARED] Demo - Create a Public IP Address and NAT Gateway (6:20) Start [SHARED] Network Security Groups (NSG) (14:20) Start [SHARED] Demo - Configure NSGs (10:20) Start [SHARED]