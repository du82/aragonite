full_description = ".b-144042453-top { padding-top: 22.400000000000002px; } .b-144042453-bottom { padding-bottom: 22.400000000000002px; } .b-144042453-alignment { text-align: center; } .b-144042453-content_width { max-width: 668px; } .b-144042453-image_overlay { opacity: 1.0; } .b-144042453-background_color { background-color: #EFEFF5; } .b-144042453-heading_text_color { color: #FFFFFF; } .b-144042453-button_border_radius { border-radius: 25px; } .b-144042453-subheading_text_color { color: #FFFFFF; } .banner .b-144042453-heading_text_color { color: #FFFFFF } .banner .b-144042453-subheading_text_color { color: #FFFFFF } .banner__button.b-144042453-button_border_radius { border-radius: 25; } @media screen and (min-width: 768px) { .b-144042453-top { padding-top: 40px; } .b-144042453-bottom { padding-bottom: 40px; } } .bl { width: 100%; } AZ-400 MicrosoftDevOps Engineer Expert Certification Enroll for $80 .b-144042454-top { padding-top: 33.6px; } .b-144042454-bottom { padding-bottom: 33.6px; } .b-144042454-text_color { color: #36414D; } .b-144042454-content_width { max-width: 590px; } .b-144042454-background_color { background-color: #F5F5F8; } .b-144042454-heading_text_color { color: #36414D; } .block__text .b-144042454-text_color { color: #36414D } .block__text .b-144042454-content_width { width: 590px; } .block__text .b-144042454-heading_text_color h1, .block__text .b-144042454-heading_text_color h2, .block__text .b-144042454-heading_text_color h3, .block__text .b-144042454-heading_text_color h4, .block__text .b-144042454-heading_text_color h5, .block__text .b-144042454-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-144042454-top { padding-top: 60px; } .b-144042454-bottom { padding-bottom: 60px; } } Course Information-----This course is up-to-date with the latest (May 2 2023) AZ-400 exam.-----The Microsoft Certified DevOps Expert exam provides you with a massive wealth of knowledge and skill about DevSecOps tools and processes.This is NOT just a course about Azure DevOps.You'll learn about Azure DevOps, GitHub, Git, Git management tools, security scanning tools (like OWASP ZAP, and Mend Bolt), and much more.Throughout this course I'm confident you'll gain all the knowledge and skills needed to pass the AZ-400 exam. But more importantly, I've designed the content to help you understand what DevSecOps is. So you can apply this knowledge, even if you go on to use other tools and technologies. .b-144042455-top { padding-top: 33.6px; } .b-144042455-bottom { padding-bottom: 33.6px; } .b-144042455-text_color { color: #36414D; } .b-144042455-content_width { max-width: 590px; } .b-144042455-background_color { background-color: #ffffff; } .b-144042455-heading_text_color { color: #36414D; } .block__text .b-144042455-text_color { color: #36414D } .block__text .b-144042455-content_width { width: 590px; } .block__text .b-144042455-heading_text_color h1, .block__text .b-144042455-heading_text_color h2, .block__text .b-144042455-heading_text_color h3, .block__text .b-144042455-heading_text_color h4, .block__text .b-144042455-heading_text_color h5, .block__text .b-144042455-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-144042455-top { padding-top: 60px; } .b-144042455-bottom { padding-bottom: 60px; } } Who Can Take This Course?This course has been designed for students of all different backgrounds. You do not need to be a developer. We will progressively build your knowledge and experience working various DevSecOps tools and concepts. You'll start out with source control, and progressively build your own CICD pipelines, adding more and more capabilities like automated testing, and automated security.Throughout a lot of this course you'll use resources like the Aus-E-Mart web application to help you gain a real hands-on understanding. You'll learn to work with real code, and build custom app packages, add libraries, and deploy to services like Azure Container Instances and Azure Web Apps. We'll do this with as many of the free tier services as possible, so you can own and showcase your own lab environment, while still keeping costs very low.Please do be sure you've completed the free Getting Started with Microsoft DevOps course first. As this will give you an understanding of important fundamentals, and help you to setup some free accounts (GitHub and Azure DevOps) that you'll use throughout this course. .b-144042456-top { padding-top: 22.400000000000002px; } .b-144042456-bottom { padding-bottom: 22.400000000000002px; } .b-144042456-content_width { width: 710px; } .b-144042456-background_color { background-color: #FFFFFF; } .b-144042456-heading_text_color { color: #36414D; } .b-144042456-lecture_name_background_color { background-color: #F9FAFD; } .b-144042456-section_name_background_color { background-color: #EFEFF5; } @media screen and (min-width: 768px) { .b-144042456-top { padding-top: 40px; } .b-144042456-bottom { padding-bottom: 40px; } } .block__curriculum__section__title.b-144042456-section_name_background_color { background-color: #EFEFF5; } .block__curriculum__section__list__item.b-144042456-lecture_name_background_color { background-color: #F9FAFD; } Course Curriculum Welcome to the Course Available in days days after you enroll Welcome to the Course (3:33) Preview About AZ-400 Exam Updates Preview Let's Connect (3:21) Preview Spec