practice exam which mirrors real-world conditions. TECHNICAL FOUNDATIONS AND AWS: The course covers the essential architectural concepts as they relate to AWS but also covers the core AWS products featured in the exam in some depth. Topics covered include:- Identity and Access Management (IAM) Simple Storage Service (S3) Elastic Compute Cloud (EC2) Virtual Private Cloud (VPC) Autoscaling and Launch Templates Database Solutions including DynamoDB, RDS and Aurora Application Services (SNS, SQS, Kinesis, IOT, SES, Step Functions) Serverless Architecture (Lambda & API Gateway) Monitoring, Deployment and Security ALWAYS ACCURATE/ALWAYS UP TO DATE: I pride accuracy and so commit to keeping the content up to date with regular updates as AWS announces new products or features. Updates will be included in your one-time course purchase so you can study at your own pace. By the end of this course, you will be able to confidently pass the associate-level AWS Certified Solutions Architect exam and start getting access to some of the best paying careers in the industry. COURSE OUTCOMES Be ready to sit and pass the SAA-C03 exam with confidence Confidence in technical interviews for that SA Role Be able to design local, global, elastic architectures in AWS that are secure, cost-effective, resilient, efficient and adhere to AWS best practices. Understanding and appreciation for technical fundamentals which AWS products and services rely on Practical experience of:- Building in AWS Evolving architectures in AWS and implementing serverless applications LevelUp your career in terms of $ and project opportunities A foundation for the AWS Professional or Specialty level certifications BY THE NUMBERS Created and taught by an experienced instructor 100,000's of students across a total of 8 previous AWS Courses Instructor rating of over 99.5%. 20 years+ of Consultancy experience 40+ IT certifications, including all current AWS ones 60+ Hours of teaching over ~231 lessons ~22 Hours of exciting demos 130 real-world like practice exam questions over 2 real-exam-like practice exams 150 Section summary questions designed for knowledge retention Professional level production values, excellent quality, high-end audio, clear accent and vibrant visuals throughout. Dedicated Exam and Question technique lessons to ensure exam success. All learning aids and demo lesson assets available for download at any time MONEY BACK GUARANTEE The course offers excellent value for the one time enrollment fee. You will gain full access to the materials, which will receive constant updates for the lifetime of the SAA-C03 certification. I'm so confident in the value, I offer a 14-day unconditional money-back guarantee. All I ask is that you contact me and give me some feedback on what you didn't like. Your Instructor Adrian Cantrill Adrian is an experienced Solutions Architect and technical trainer specialising in cloud and emerging technologies. Over the past 6 years he has created eight popular online training courses taken by nearly two hundred thousand students globally. Adrian is obsessed with helping his students learn and develop in the most efficient and effective way possible and draws on over two decades of technology design, implementation and fault-finding experience. Outside work Adrian loves home automation, green technology, UAV flying and cats. Course Curriculum INTRODUCTION & SCENARIO Available in days days after you enroll Preview Public Introduction (4:04) Preview Finding and Using the Course Resources (14:31) Preview Site tools and features (8:36) Preview AWS Exams (17:32) Preview Scenario - Animals4life (13:28) Preview Connect with other students and your instructor (3:10) Preview COURSE UPGRADES - SAVE $ WHEN ADDING MORE COURSES Start SHARED LESSONS [SHAREDALL] [ASSOCIATESHARED] etc... Preview 🚨 READ ME 🚨 - ENABLE EMAIL UPDATES (IT'S WORTH IT) Course Fundamentals and AWS Accounts Available in days days after you enroll Preview AWS Accounts - The basics (11: