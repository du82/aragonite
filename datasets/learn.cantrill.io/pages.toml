es (9:26) DNS & DNSSEC Available in days days after you enroll Start DNS #1 - What does DNS do (2:56) Start DNS #2 - Why does DNS need a complex architecture (13:19) Start DNS #3 - How DNS actually works ... walking the tree (8:46) Start DNS #4 - What happens when a domain is registered? (4:27) Start DNSSEC #1 - Why do we need DNSSEC (11:08) Start DNSSEC #2 - How DNSSEC Works within a Zone (17:34) Start DNSSEC #3 - DNSSEC Chain of Trust (8:16) Start DNSSEC #4 - DNSSEC Root Signing Ceremony (7:53) Containers & Virtualization (MORE COMING SOON) Available in days days after you enroll Start Kubernetes 101 (11:27) Backups & DR (MORE COMING SOON) Available in days days after you enroll Start Recovery Point Objective (RPO) & Recovery Time Objective (RTO) (16:54) Data Formats & Configuration Formats (MORE COMING SOON) Available in days days after you enroll Start YAML aint markup language (YAML) 101 (6:12) Start Javascript Object Notation (JSON) 101 (4:25) Cloud Computing 101 Available in days days after you enroll Start What is Cloud Computing? (13:30) Start Public vs Private vs Multi vs Hybrid Cloud .. (8:38) Start Cloud Service Models (IAAS, PAAS, SAAS) (10:25) Frequently Asked Questions When does the course start and finish? The course starts now and never ends! It is a completely self-paced online course - you decide when you start and when you finish. How long do I have access to the course? How does lifetime access sound? After enrolling, you have unlimited access to this course for as long as you like - across any and all devices you own. What if I am unhappy with the course? We would never want you to be unhappy! If you are unsatisfied with your purchase, contact us in the first 30 days and we will give you a full refund. off original price! The coupon code you entered is expired or invalid, but the course is still available! Get started now! TECH-Fundamentals-FREE Coupon Discount Free TECH 101 Course - because fundamentals should be free or pay in installments: F