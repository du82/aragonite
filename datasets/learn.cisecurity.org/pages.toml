["https://learn.cisecurity.org/cis-cat-lite"]
title = "CIS-CAT Lite"
description = "CIS-CAT Lite is the free assessment tool developed by the CIS (Center for Internet Security, Inc.). CIS-CAT Lite helps users implement secure configurations for multiple technologies."
full_description = "Is your organization a U.S. State, Local, Tribal, or Territorial (SLTT) or other non-federal U.S. government institution (including public education and critical infrastructure)? CIS-CAT Lite is the free assessment tool developed by the CIS (Center for Internet Security, Inc.). CIS-CAT Lite helps users implement secure configurations for multiple technologies. With unlimited scans available via CIS-CAT Lite, your organization can download and start implementing CIS Benchmarks in minutes. Compare the key features of CIS-CAT Lite and CIS-CAT Pro to understand the differences between the various versions: ^ By submitting the form, I have reviewed the CIS Privacy Notice, which details the way in which CIS utilizes personal data, including the use of standard web beacons and cookies. * Indicates required fieldIf you experience any issues during registration, please contact us at learn@cisecurity.org."
