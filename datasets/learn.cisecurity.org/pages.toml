title = "CIS Controls CIS-RAM"
description = "Is your organization a U.S. State, Local, Tribal, or Territorial (SLTT) or other non-federal U.S. government institution (including public education and critical infrastructure)?"
full_description = "Is your organization a U.S. State, Local, Tribal, or Territorial (SLTT) or other non-federal U.S. government institution (including public education and critical infrastructure)? The Center for Internet Security Risk Assessment Method (CIS RAM) is an information security risk assessment method that helps organizations implement and assess their security posture against the CIS Critical Security Controls (CIS Controls) cybersecurity best practices. The CIS RAM Family of Documents provides instructions, examples, templates, and exercises for conducting a cyber risk assessment. Developed by HALOCK Security Labs in partnership with CIS, CIS RAM provides three separate security approaches to support different levels of organizational capability. ^ By submitting the form, I have reviewed the CIS Privacy Notice, which details the way in which CIS utilizes personal data, including the use of standard web beacons and cookies. * Indicates required fieldIf you experience any issues during registration, please contact us at learn@cisecurity.org."
