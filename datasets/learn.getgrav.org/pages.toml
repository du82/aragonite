["https://learn.getgrav.org/17/advanced/grav-development/grav-15-upgrade-guide"]
title = "Upgrading from Grav <1.6 | Grav Documentation"
description = "Grav documentation"
full_description = "WARNING: Upgrading Grav directly to the latest version works, but is not fully supported and will likely cause your site to break! The easiest way to upgrade older versions of Grav is to create a copy of your site into a Linux/Unix server which has PHP 7.3 installed and supports SSH login to access CLI commands. This guide also works with Linux subsystem for Windows 10, but if you do not have it installed, you may have to download and rename the update packages manually. PHP 7.3 was chosen because of it is the only version of PHP which can be used for all the versions of Grav. You may also use PHP 7.1 or 7.2, but going that only allows you to upgrade Grav up to v1.6.31. At that point you would need to switch to PHP 7.3 or 7.4 before continuing the upgrade process. PHP 8 should only be used after upgrading to Grav 1.7 or later version. This guide includes instructions to upgrade Grav, and the most commonly used packages: Problems, Error, Form, Email, Login and Admin. For every other plugin, make sure that they are still maintained and that it supports both Grav 1.6 and the latest version of Grav. As of writing this guide, almost all actively maintained plugins should fit into this category. The safest plugins are those, which have been updated after Grav 1.7.0 release (01/18/2021) or have been confirmed to work in Grav 1.7. Your theme and any custom or unmaintained plugins will need more work. Any custom code should be checked through to make sure it still works with the current versions of Grav and PHP. The same is true with Markdown, YAML and twig files as the latter versions of the libraries have fixes which catch the errors, usually meaning that parsing of broken files will fail. Newer versions of Grav provide tools to check these files, but the checks do not catch all the issues, so some testing is also needed. This part assumes that you have already made a copy of your site and the CLI commands work. Windows users who do not have Linux subsystem installed need to download the files manually and rename them."
