["https://learn.getgrav.org/16/admin-panel/faq"]
title = "FAQ | Grav Documentation"
description = "Grav documentation"
full_description = "This FAQ is intended to provide useful tutorials, tips, and tricks to help you get the most out of the Admin plugin. Manual installation is not the recommended method of installation, however, it is still possible to install the admin plugin manually. Basically, you need to download each of the following plugins individually: Extract each archive file into your user/plugins folder, then ensure the folders are renamed to just admin/, login/, form/, and email/. Then proceed with the Usage instructions below. When you first install the Admin plugin, you will be prompted to create an admin user when you point your browser at your site. This is a simple web form that ensures at least one admin user has been created. You can easily add other users but it requires a bit of work in the terminal/command prompt to do. From your terminal, access the root of the Grav site you'd like to add users to, and type the following command: This will initiate a series of prompts to guide you through the creation of a new user. These include creating a user name, password, email address, and setting the new user's permissions level. You will need to have a user name consisting of between 3 and 16 characters which can include lowercase letters, numbers, underscores, and hyphens. Uppercase letters, spaces, and special characters are not allowed for the user name. At one point during the creation process you will be asked to choose a set of permissions for the new user. There are currently three options: User data is stored in SITE_ROOT/user/accounts/ and each user is given a YAML file containing that user's login information and other details. Here is an example of the data contained within a user account file. For example this could be the content of SITE_ROOT/user/accounts/tester.yaml. You can edit this information directly to the user's YAML file, or by selecting your user avatar from the sidebar of the admin. This will take you to a page where you can easily manage user information. For security reasons, user passwords are stored as a hash. If you would like to change your password, we recommend doing so from within the admin."
