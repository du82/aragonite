["https://learn.getgrav.org/17/advanced/flex/custom-types"]
title = "Custom Directory Types | Grav Documentation"
description = "Grav documentation"
full_description = "For many sites, the main reason for using Flex Directories is to be able to define your own custom data types, which are neither simple or small enough to fit into configuration or suitable to be represented as individual pages. Flex Directories solve this issue for you. Since Flex Types use the common design principles to both configuration and pages, it is really easy to convert your existing configuration and pages to use Flex. You may also have existing forms in the site, which you'd want to manage from the Administration Panel, or maybe you want to display selected comments in your site. These forms can also be converted to use Flex. The base of a Flex Type is its Blueprint. The blueprint defines both the form and the fields of the object. It also has some additional configuration, which can be used to customize the directory and its objects, where it shows up in Admin Panel and ACL. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
