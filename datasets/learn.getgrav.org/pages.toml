["https://learn.getgrav.org/17/admin-panel/page"]
title = "Pages | Grav Documentation"
description = "Grav documentation"
full_description = "The Pages page gives you quick editorial access to your site's content. This is where you can access a page's editor, delete pages, create new pages, and find out if a page is visible at a glance. Accessing the Pages functionality requires an access.admin.super or access.admin.pages.list permission, see User Accounts and User Groups If you frequently create or modify content on your site, this area of the admin will become very familiar to you. Three buttons line the top of the Pages administrative panel. The Back button sends you back to the Dashboard, while the Add Page and Add Modular buttons initiate the creation of new pages for your site. The Add Page button creates a non-modular page for your site. Once selected, a popup will appear enabling you to enter a Title and Folder Name, assign a Parent Page and Display Template, as well as to set whether the page should be visible or hidden. Once you have filled out this information, selecting Continue will take you to the new page's editor. We will cover the Page Editor in more detail in a following guide. Whether a page is visible or not in these settings only has an effect on navigation. A page's ability to be visited by a browser is determined by the page's publishing settings. The second button along the top of the Pages area of the admin allows you to add a modular subpage to your site. Modular pages are different from regular pages because they are actually a collection of pages, arranged and displayed as one page. This button specifically lets you create subpages and assign them to a parent modular page. Once you have filled out this information, selecting Continue will take you to the new page's editor. We will cover the Page Editor in more detail in a following guide. The pages list that appears in this area gives you quick access to all of your current pages, as well as an at-a-glance method for seeing whether or not the pages are visible. Selecting the title of any page will take you directly to that page's editor. The big X icon to the right of each page lets you delete the page."
