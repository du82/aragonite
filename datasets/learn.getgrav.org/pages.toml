["https://learn.getgrav.org/16/admin-panel/plugins/options"]
title = "Options | Grav Documentation"
description = "Grav documentation"
full_description = "The Admin Panel plugin has a set of options of its own accessible in the Plugins area of the admin. To reach them, simply navigate to Plugins > Admin Panel and select the title link for the plugin called Admin Panel. This will open a page filled with useful options to help you customize your experience with the Admin. The top of the Admin Panel options page gives you some information about the Admin Panel plugin. This includes the plugin author, homepage, and license, in addition to other links and information to help you find additional information and report any bugs. The Basics section of this page gives you a set of options to help you define your experience within the Admin. This includes being able to change the text that appears at the top of the sidebar, create a custom path to the administrator, and more. This section of the page lets you customize the items that appear in the main dashboard of the admin. Not a fan of the News Feed and want to get rid of it? Want to streamline your dashboard down to one or two sections you love? This is where you can do that. You can enable or disable specific types of notifications from this section. You can turn off feed update notifications, as well as notifications for plugins and/or themes. One of the Admin's great features is its ability to track and display traffic information from the Admin's dashboard. This section of the Admin plugin's options gives you the ability to enable or disable traffic tracking, and configure how that data is displayed. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
