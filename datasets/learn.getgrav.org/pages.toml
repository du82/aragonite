["https://learn.getgrav.org/17/admin-panel/page/editor"]
title = "Editor (Content) | Grav Documentation"
description = "Grav documentation"
full_description = "The Page Editor in the admin is a powerful text editor and page manager that enables you to create your page's content (including media files), its publishing and taxonomy options, settings, overrides, and theme-specific options. Accessing the Pages functionality requires an access.admin.super or access.admin.pages.list permission, see User Accounts and User Groups Tabs that appear in the Page Editor are not universal. There are a default set of form fields that are commonly found in Grav themes, however these can vary between themes. The admin pulls form field information from a number of sources including the theme and the template used for the specific page. The tabs and options represented in this documentation are by default. Theme developers have the ability to add their own options to these tabs, or even to do away with these tabs and replace them with something entirely different. We are documenting a common-case scenario based on the Antimatter theme to serve as an example. In this page, we will go over the features and functionality found in the Content tab of the Page Editor. Along the top of the page, you will find the administrative controls that enable you to save, delete, copy, and move your page. Additionally, you can hit the Back button to get back to the main Pages area of the admin. The Save and Delete buttons are pretty self-explanatory. They save and delete the currently-accessed page, respectively. Selecting the Move button activates a popup that gives you the ability to assign a new parent to the page. You have the same option in the Advanced tab. Copy creates a duplicate of your current page, appending a -2 (or other numeric prefix if -2 is already in use) to the end of the folder name. You can change both the folder name and title as you see fit. The title of a page is typically set during that page's creation, however you can edit it after the fact here. Note that changing the page's title here will not have a direct impact on the folder name (which is used for navigation purposes) but it will change what people see on the front end."
