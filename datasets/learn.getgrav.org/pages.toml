["https://learn.getgrav.org/17/admin-panel/plugins"]
title = "Plugins | Grav Documentation"
description = "Grav documentation"
full_description = "The Plugins area of the admin is where you can go to manage your plugins, add new ones, remove existing ones, and quickly access links to documentation and other information. In this page, we will explore this area of the admin in detail, including how to activate and deactivate installed plugins, and add new ones with ease. Accessing the Plugins functionality requires an access.admin.super or access.admin.plugins permission. The Controls area at the top of the page gives you the ability to add new plugins, as well as check for updates for existing ones. The Add button takes you to a page listing all of the currently available Grav plugins, enabling you to view their information and install them by selecting the Install button to the right of the plugin. The icon indicates that the plugin is created and supported by the Grav team. Plugins without this icon were created by third-party developers. This area of the Plugins administrator shows you, at a glance, which plugins are presently installed on your Grav site. Additionally, you can enable and disable these plugins by selecting the toggle icon to the right of each plugin. Selecting the chevron icon will give you more information about the plugin, including its author, project home page and bug tracker, as well as its license and a brief description. You can also quickly access the plugin's readme file for additional information and usage guide. You can also click the plugin's name to go to a more-detailed page including the plugin's settings area where you can configure the plugin. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
