["https://learn.getgrav.org/16/advanced/debugging"]
title = "Debugging & Logging | Grav Documentation"
description = "Grav documentation"
full_description = "When developing themes and plugins, there is often a need to display debugging information. Grav has powerful debugging capabilities via a variety of features: Grav comes with a great tool to make this effort easier called via a Debug Bar. This feature is disabled by default, but can be turned on either globally or for your development environment only via the system.yaml configuration file: The first time you enable it, the debug bar might appear as a little Grav icon in the bottom left of the page. Clicking that will show the full debug bar. The PHP Debug Bar still provides an overall processing time as well as memory usage, but it now has several tabs that provide more detailed information. The first tab is for Messages and you can use this to help debug your Grav development process by posting information to this tab from your code. Along with Request, Exceptions, and Configuration information, you can also see a detailed breakdown of Grav timing in the Timeline panel: If you are trying to debug some PHP, for example a custom plugin you are developing, and wish to quickly examine some object or variable, you can use the powerful dump() command. This accepts basically any valid PHP variable and will output the results in a nicely formatted and colorized display in your browser. You can also display Twig variables from your Twig templates. This is done in a similar fashion, but the results are displayed in the Messages panel of the Debug Bar. This feature is disabled by default, but can be turned on either globally or for your development environment only via the system.yaml configuration file: It's possible to output multiple dump commands at the same time but it can get confusing to tell them apart. Add static text like this: To display variables before a page is returned by Grav or in case no page refresh occurs such as when using AJAX there is another alternative. By using a single line of Javascript any variable can be displayed in your browser's developer console, for example:"
