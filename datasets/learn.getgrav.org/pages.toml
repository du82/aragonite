["https://learn.getgrav.org/17/advanced/flex/using/collection"]
title = "Flex Collection | Grav Documentation"
description = "Grav documentation"
full_description = "Collection provides a few useful methods, which can be used to render the output, fetch objects, filter and sort and so on. NOTE: In twig there is a {% render %} tag, which should be used instead of calling the method directly. This will allow JS/CSS assets from the collection to work properly. All of these methods return a modified copy of the collection. The original collection remains unchanged. limit( start, limit ): Collection Return subset of collection starting from start and including only limit number of objects. TIP: If you're using sort(), it is recommended to reverse the ordering in there as it saves an extra step. first(): Object | false Sets the iterator to the first object in the collection and returns this object. last(): Object | false Sets the iterator to the last object in the collection and returns this object. slice( offset, length ): array Extracts a slice of length elements starting at position offset from the Collection. group( property ): array Group objects in the collection by a property and return them as associated array. hasProperty( property ): array Returns a list of key: boolean pairs whether object with key has property defined or not. setProperty( property, value ): Collection Set new value to the property for every object in the collection. WARNING: This method modifies the object instances shared between all the collections, if that is not intended, please copy() collection before using this method. defProperty( property, default ): Collection Define default value to the property for every object in the collection. WARNING: This method modifies the object instances shared between all the collections, if that is not intended, please copy() collection before using this method. unsetProperty( property ): Collection Remove value of the property for every object in the collection. WARNING: This method modifies the object instances shared between all the collections, if that is not intended, please copy() collection before using this method."
