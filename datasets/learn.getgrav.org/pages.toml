["https://learn.getgrav.org/16/admin-panel/dashboard/configuration-site"]
title = "Configuration (Site) | Grav Documentation"
description = "Grav documentation"
full_description = '''The Configuration page gives you access to your site's System and Site configuration settings. Additionally, you can view a breakdown of your server's properties in a number of areas including PHP, SQL, server environment, and other various components that determine how your site operates. The Configuration requires an access.admin.super or access.admin.configuration && access.admin.configuration_site access level. The Site tab enables you to customize the settings found in the /user/config/site.yaml file. This tab gives you access to options and fields that determine site-related variables, such as the name, default author, and metadata used in your site. This section is where you set the basic properties of content handling for your site. The home page, default theme, and various other content display options are set here. Page summaries are a great way to give a small preview of a page's content. You can use a delimiter in the page to set a "cut off" point between the summary content, and the full body content of the page. These settings give you the ability to Metadata is an important part of a page's behind-the-scenes makeup. It can improve SEO, how your links appear in various search engines and social feeds, and more. You can set various metadata properties here. Redirects and routing have never been easier. Just set it all up in this section, and you're good to go. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes.'''
