["https://learn.getgrav.org/16/advanced/multisite-setup"]
title = "Multisite Setup | Grav Documentation"
description = "Grav documentation"
full_description = "Grav has preliminary multisite support available. However, CLI commands as well as the Admin plugin still need to be updated to fully support multisite configurations. We will continue to work on this in subsequent releases of Grav. A multisite setup allows you to create and manage a network of multiple websites, all running on a single installation. Grav has built-in multisite support. This functionality extends the basic environment configuration, which lets you define custom environments for your production and development sites. A full multisite setup gives you the power to change the way how and from where Grav loads all its files. The most important thing you will need to run a Grav multisite network is good website hosting. If you are not planning to create many sites and do not expect many visitors, then you can get away with shared hosting. However, due to the nature of multisites, you’d probably need a VPS or dedicated server as your sites grow. Before you begin, you’ll want to be sure your web server is capable of running multiple websites i.e., you have access to your Grav root directory. This is essential since serving multiple websites from the same installation is based on a setup.php file located in your Grav root. Once created, the setup.php is called every time a user requests a page. In order to serve multiple websites from one single installation, this script (roughly speaking) has to tell Grav where the files (for the configurations, themes, plugins, pages etc.) for a specific subsite are located. If you choose sub-directories or path based URLs for subsites, then the only thing you need is to create a directory for each subsite in the user/sites directory containing at least the required folders config, pages, plugins, and themes. If you choose sub-domains for structuring your website network, then you will have to configure (wildcard) sub-domains on your server in addition to the setup of your subsites in your user/sites directory. For subsites accessible via sub-domains copy the setup_subdomain.php file, otherwise for subsites accessible via sub-directories the setup_subdirectory.php file into your setup.php."
