["https://learn.getgrav.org/16/admin-panel/introduction"]
title = "Introduction | Grav Documentation"
description = "Grav documentation"
full_description = "The Administration Panel plugin for Grav is a web GUI (graphical user interface) that provides a convenient way to configure Grav and easily create and modify pages. This will remain a totally optional plugin, and is not in any way required or needed to use Grav effectively. In fact, the admin interface provides an intentionally limited view to ensure it remains easy to use and not overwhelming. Power users will still prefer to work with the configuration files directly. The Adminstration Panel is quite an ambitious plugin with lots of functionality that will give you a lot of power and flexibility when building out your Grav sites. So if you have any questions, problems, suggestions or find one of those rare bugs in it, please use one of the following ways to get support from us. For bugs, features, improvements, please ensure you create issues in the admin plugin GitHub repository. First ensure you are running the latest Grav version, 1.7.46 or later. This is required for the admin plugin to run properly. Check for and upgrade to new Grav versions like this (-f forces a refresh of the GPM index): The admin plugin actually requires the help of 3 other plugins, so to get the admin plugin to work you first need to install the login, forms, and email plugins. These are available via GPM, and because the plugin has dependencies you just need to proceed and install the admin plugin, and agree when prompted to install the others: With the latest version of the Admin, you will be prompted to create an admin user account when you point your browser to your site. You must complete this step to ensure straight away a valid admin user is under your control. The user information is stored in the user/accounts/ folder of your Grav installation. You can edit the values manually or via the Admin plugin itself. You can also create new users manually or via the bin/plugin login newuser CLI command. More information is contained in the Admin FAQ. The default pattern for users (system.username_regex) is only lowercase characters, digits, dashes, and underscores. Usernames must be between 3 - 16 characters in length."
year_published = 2025
