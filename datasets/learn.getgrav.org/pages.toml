title = "Dashboard | Grav Documentation"
description = "Grav documentation"
full_description = "The Dashboard serves as a hub of information for the Administration Panel plugin. From this one page, you can check traffic statistics, maintenance information, Grav updates, create new backups, see the latest page updates, as well as to quickly clear Grav's cache. The Dashboard content will change depending on the user permissions. For example, giving access.admin.super unlocks everything. If that access level is not granted, access.admin.maintenance allows cache clearing and updates. access.admin.pages allows access to pages. access.admin.statistics allows display of the site page view statistics. Along the top of the Dashboard, you will find two buttons. The first of which initiates a clearing of the Grav cache. Clicking the main Clear Cache button will wipe the entire cache, including any caching of assets and images. Using the drop-down feature to the right, you can choose from specific types of cache clearing processes. For example, if you only want to clear the image cache without disrupting any other cached data, you can do so here. The second button initiates an update check for your site. This includes any supported plugins, themes, and Grav itself. If new updates are discovered, you receive a notification on the Dashboard. This isn't the only method Grav has for checking for new updates. Update checks are also triggered whenever a new page in the admin is loaded, and cached for one day. If you clear all of Grav's cache and load a new page in the admin, an update check will automatically take place. The Maintenance and Page View Statistics sections give you quick access to important information about your site. On the Maintenance side, you can see a percentage graph letting you know how many of Grav's bits and pieces are completely up-to-date. If new updates are available, an Update button will appear that enables you to perform a one-click update for all plugins and themes. This button will not update Grav itself, which notifies you about a required update just above the Maintenance and Page View Statistics sections."
