["https://learn.getgrav.org/16/admin-panel/extending/admin-events"]
title = "Admin Event Hooks | Grav Documentation"
description = "Grav documentation"
full_description = "The Admin plugin has multiple event hooks that can be used during the Grav Lifecycle. See the general plugin documentation for using event hooks in the Plugins chapter. The Admin plugin fires various tasks, depending on user interaction. Tasks might include logout, login, save, 2faverify, etc. After the task completes, this event hook fires. While creating a new page, this event is fired after the header data is initially set to allow plugins to programmatically manipulate the frontmatter. Use admin event onAdminSave() to manipulate the page object data $object before it is saved to the filesystem. When creating a folder via the panel, this event fires immediately after creating the new folder and performing a standard cache clear. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
