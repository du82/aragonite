["https://learn.getgrav.org/17/advanced/flex/custom-types/blueprint"]
title = "Blueprint | Grav Documentation"
description = "Grav documentation"
full_description = "Basic structure of Flex Blueprint contains title, description and type, which describe the type and three sections: config, blueprints and form, which describe different aspects from the directory type. To create your own custom Directory, you need to start by naming your type (filename) and filling in the title and description. After creating the file and filling in the basic information, the next step is to either copy your existing form or to add some fields into the file. WARNING: It is better not to use the simple list format to describe the fields as described in Create a simple single form. Also do not pass process section of the form to this file, it will not be used by Flex. The form looks the same regardless if it was taken from a page or from a configuration, plugin or theme blueprint file. This is the main blueprint for every object in your directory and it should contain all the fields defined in the object. Think it as a form that is displayed to the administrator. WARNING: Be careful when you modify a blueprint for existing Flex Type. Make sure objects you have already saved are compatible with the new version of the blueprint - meaning that you should be able to both save and display the older objects. We are not quite done yet. There is still two things that needs to be done to make the Directory to work: we need to configure the data storage layer and define the fields to display in the Admin List view. We can do both of those inside config section. Config section is the most complicated part of Flex Blueprint, though a lot of it is just to allow customization. It contains data, admin and site sections. There are two mandatory sections in the configuration: config.data.storage and config.admin.list.fields. The latter defines fields displayed inside admin list view. Data storage on the other hand defines how the data will be stored. Flex Directory is highly customizable. You can use your own object, collection and index PHP classes to add your own behavior. Additionally, you can configure the storage layer to best fit your needs. Directory also has it's default ordering and search functionality."
