title = "Flex Object | Grav Documentation"
description = "Grav documentation"
full_description = "NOTE: In twig there is a {% render %} tag, which should be used instead of calling the method directly. This will allow JS/CSS assets from the object to work properly. hasProperty( property ): bool Returns true if the object property has been defined and has a value (not null). WARNING: This method modifies the object instance shared between all the collections. If that is not intended, please clone the object before using this method. WARNING: This method modifies the object instance shared between all the collections. If that is not intended, please clone the object before using this method. WARNING: This method modifies the object instance shared between all the collections. If that is not intended, please clone the object before using this method. Note: There are two deny values: denied (false), not set (null). This allows chaining multiple rules together when the previous rules were not matched.` search(string, [properties], [options] ): float Search a string from the object, returns weight between 0 and 1. getStorageKey(): string Get a unique storage key (within the directory) which is used for figuring out the filename or database id. getDefaultValue( name, [separator] ): mixed Returns default value suitable to be used in a form for the given property. getDefaultValues(): array Returns default values suitable to be used in a form for the given property. getFormValue( name, [default], [separator] ): mixed Returns raw value suitable to be used in a form for the given property. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
