["https://learn.getgrav.org/17/advanced/backups"]
title = "Backups | Grav Documentation"
description = "Grav documentation"
full_description = "The backup system in Grav has been completely rewritten for Grav 1.6 to provide more features and functionality. The improvements include: For backwards compatibility, the default configuration mimics the system prior to Grav 1.6, however, it does now have a 5GB limit by default for backup space. You should copy the default configuration file (system/config/backups.yaml) to your `user/config/ If you use the admin plugin, and save the configuration, the user/config/backups.yaml file will be created automatically. An array of profiles can be configured. The Default Site Backup profile is configured similarly to the default Grav backup in previous versions. By default, the backup is not automatically processed by the scheduler, but you can set schedule: true and configure the schedule_at: option with a preferred cron expression. This is covered in more details in the Cli Console -> Grav Command section, but here's an example of running the backup manually: Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
