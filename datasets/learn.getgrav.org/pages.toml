["https://learn.getgrav.org/17/advanced/flex/using"]
title = "Using Flex Objects | Grav Documentation"
description = "Grav documentation"
full_description = "Flex Objects is designed to be easy to use. Displaying collection and groups in your pages can mostly be done from Twig templates. By default, flex-objects page type takes two URL parameters, directory and id. They are used to navigate directories. Example URLs look like this: TIP: You can pass your own parameters inside flex and use them in your collection and object template files. Both Collections and Objects support rendering their output in HTML. Output can be customized with two parameters: layout and context. Layout allows you to set custom looks, for example you can have list of cards and then more detailed output for details. Context allows you to pass variables to be used in the template files. Each type has two folders, one for rendering collection and one for rendering object. The files inside are layouts, named after the filename. In our example, we have default layout for both the collection and the object. Collection template flex/contacts/collection/default.html.twig is responsible for rendering all the objects in the collection. Rendered output is cached by default. Cache key is defined by the collection and the context passed to the render() method. WARNING: If context contains non-scalar values, caching will be turned off. Try to keep the context as simple as possible! TIP: If the rendered HTML has dynamic content, render cache can be disabled from the Twig template by {% do block.disableCache() %}. Object template flex/contacts/object/default.html.twig is responsible for rendering a single object. Rendered output is cached by default. Cache key is defined by the object and the context passed to the render() method. WARNING: If context contains non-scalar values, caching will be turned off. Try to keep the context as simple as possible! TIP: If the rendered HTML has dynamic content, render cache can be disabled from the Twig template by {% do block.disableCache() %}. By using custom layouts, you can create an infinite amount of different views into both of your collections and objects."
year_published = 2025
clearnet = "https://learn.getgrav.org/17/advanced/flex/using"
