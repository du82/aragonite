["https://learn.getgrav.org/17/advanced/environment-config"]
title = "Environment Configuration | Grav Documentation"
description = "Grav documentation"
full_description = "Grav has the ability to extend the powerful configuration capabilities for different environments to support different configuration for development, staging, and production scenarios. Up to Grav 1.6 environments were stored in user/ folder. Grav 1.7 moves environments to user/env/ to make environments easier to maintain. It is highly recommended that you move all the environments into this new location on your existing sites. What this means is that you can provide as little or as much configuration changes per environment as needed. A good example of this is the Debug Bar. By default, the new Debug Bar is disabled in the core system/config/system.yaml file, and also in the user override file: If you wanted to turn it on, you can easily enable it in your user/config/system.yaml file, however a better solution might be to have it enabled for your development environment when accessing via localhost, but disabled on your production server. where localhost is the hostname of the environment (this is what the host you enter in your browser, e.g. http://localhost/your-site) and your configuration file contains: Similarly, you may want to enable CSS, Link, JS and JS Module Asset Pipelining (combining + minification) for your production site only (user/env/www.mysite.com/config/system.yaml): If your production server was reachable via http://www.mysite.com then you could also provide configuration specific for that production site with a file located at user/env/www.mysite.com/config/system.yaml. Of course, you are not limited to changes to system.yaml, you can actually provide overrides for any Grav setting in the site.yaml or even in any plugin configuration! If you are using the Grav Scheduler, be aware of it using the localhost environment and therefore its configuration. To override a plugin configuration YAML file is simply the same process as overriding a regular file. If the standard configuration file is located in: Then you can override this with a setting that only overrides specific options that you want to use for local testing:"
