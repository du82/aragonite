["https://learn.getgrav.org/17/admin-panel/dashboard/configuration-system"]
title = "Configuration (System) | Grav Documentation"
description = "Grav documentation"
full_description = '''The Configuration page gives you access to your site's System and Site configuration settings. Additionally, you can view a breakdown of your server's properties in a number of areas including PHP, server environment, and other various components that determine how your site operates. The System tab enables you to customize the settings found in the /user/config/system.yaml file. These settings affect how many of the primary system-related features of Grav operate. The site's home page, caching settings, and more can be configured here. These settings are separated into several sections, each focusing on a specific aspect of Grav's operation. This section is where you set the basic properties of content handling for your site. The home page, default theme, and various other content display options are set here. HTTP header options can be set in this section. This is useful for browser-based caching and optimization. Markdown makes up the bulk of Grav's page content. This section gives you options to enable Markdown Extra, as well as to set how Grav handles Markdown. Grav's integrated caching feature helps make it one of the fastest flat-file CMS options out there. You can configure your site's primary caching functions in this section. This section focuses on Grav's Twig templating feature. You can set Twig caching, debug, and change detection settings here. You can set how Grav handles error reporting and display here. This is a useful tool to have during site development. Like error handling, Grav's integrated debugging tools give you the ability to locate and troubleshoot issues. This is especially useful during development. This section determines how Grav handles media content. Image quality and other media handling options are configured here. Caching images that have already been optimised (outside of Grav) could result in the output file being a much larger filesize than the original. This is due to a bug in the Gregwar image library and not directly related to Grav (see this open issue for more information). The alternative is to set "Cache All Images" to No'''
