["https://learn.getgrav.org/17/advanced/flex/administration"]
title = "Administration | Grav Documentation"
description = "Grav documentation"
full_description = "If you have been using Admin Panel in Grav 1.7, you have already used Flex Objects. The best examples are Accounts and Pages, which are great examples what can be done with Flex. By default, Flex Administration is invisible to the user. In order to see a Directory, it has to be enabled. Enabled directories can show up either on Navigation Menu, inside a Flex Objects menu item, or even inside other plugins. We are interested in the Directories option inside the plugin, which lists all the detected Flex Directories. Just select the directories you're interested in and make sure the toggle is set to Enabled. By default, the Flex Objects navigation menu item contains all the Flex Directories that have been enabled in your site. Some Flex Directories choose to hide from this list and show up elsewhere. Accounts and Pages are good examples of this. In Content Listing you can browse through the objects, use Search, and change Ordering. Additionally each object has Actions, notably Edit and Delete. You can also add new objects by using the Add button at top of any page. Next to it is also the Configuration button to change directory-wide settings. In Configuration you can change configuration, which changes the behavior of the whole directory. Usually caching is among these options. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
