["https://learn.getgrav.org/17/admin-panel/dashboard/profile"]
title = "Profile | Grav Documentation"
description = "Grav documentation"
full_description = "The profile page in the admin enables you to view and update your individual profile settings. This is where your avatar, email address, name, language, and more are set. For administrators, this is also where you can adjust the groups and permission levels for individual users. Accessing the profile page is simple. Once you are logged in to the admin, you can access your profile by selecting the area of the sidebar with your avatar image and name. This will take you directly to your own profile. Additionally, administrators will enjoy the ease of jumping to another user's profile page by appending admin/user/example to their site's URL. Replacing example with the username of the user they wish to edit profile information and/or permissions for. The Profile area of the admin gives you a quick, styled look at your avatar, name, and title. Your avatar is automatically generated through Gravatar, a global avatar service that enables you to upload a single profile image and use it across multiple sites and services. If you don't have an image uploaded to Gravatar, or if you'd prefer to use an image of your choosing, you can upload an image here by dragging and dropping the image file into the Drop Your Files Here or Click This Area section of the page. You can also click the area to bring up a file chooser that will enable you to find, select, and upload an image file from your system. Once you have a new image uploaded, simply select the Save button in the upper-right corner of the page. The Account section of the profile page is where you can update your contact information, name, language, and more. You are not able to edit your Username here, as this is tied directly to where your user information is stored, but you can edit anything else you need to. 2-Factor Authentication provides an extra layer of security for your website. Find out more about this feature in the Security area of this guide. Administrators will find the permissions area especially useful. This is where you can configure exactly what a user will be able to access and do within the administrator."
