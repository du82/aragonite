full_description = "This section contains a walk-through on how to quickly enable an existing Flex Directory and how to display it within the Grav admin. In our examples we are using the Contacts Flex Directory which comes included with the Flex Objects Plugin for demonstration purposes. Towards the bottom of the page you will see the Directories configuration setting. This setting lists all detected Flex Directories in your project. In the Advanced Content Editor ensure your frontmatter contains the flex.directory of contacts as follows: TIP: If you do not specify Flex Directory, the page will list all directories instead of displaying entries from a single directory. Found errors? Think you can improve this documentation? Simply click the Edit link at the top of the page, and then the icon on Github to make your changes."
