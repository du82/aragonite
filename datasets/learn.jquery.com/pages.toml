["https://learn.jquery.com/ajax/key-concepts"]
title = "Key Concepts | jQuery Learning Center"
full_description = '''Key Concepts Proper use of Ajax-related jQuery methods requires understanding some key concepts first. link GET vs. POSTThe two most common "methods" for sending a request to a server are GET and POST. It's important to understand the proper application of each. The GET method should be used for non-destructive operations — that is, operations where you are only "getting" data from the server, not changing data on the server. For example, a query to a search service might be a GET request. GET requests may be cached by the browser, which can lead to unpredictable behavior if you are not expecting it. GET requests generally send all of their data in a query string. The POST method should be used for destructive operations — that is, operations where you are changing data on the server. For example, a user saving a blog post should be a POST request. POST requests are generally not cached by the browser; a query string can be part of the URL, but the data tends to be sent separately as post data. link Data TypesjQuery generally requires some instruction as to the type of data you expect to get back from an Ajax request; in some cases the data type is specified by the method name, and in other cases it is provided as part of a configuration object. There are several options: link textFor transporting simple strings. link htmlFor transporting blocks of HTML to be placed on the page. link scriptFor adding a new script to the page. link jsonFor transporting JSON-formatted data, which can include strings, arrays, and objects. Note: As of jQuery 1.4, if the JSON data sent by your server isn't properly formatted, the request may fail silently. See http://json.org for details on properly formatting JSON, but as a general rule, use built-in language methods for generating JSON on the server to avoid syntax issues. link jsonpFor transporting JSON data from another domain. link xmlFor transporting data in a custom XML schema. Consider using the JSON format in most cases, as it provides the most flexibility. It is especially useful for sending both HTML and data at the same time. link A is for AsynchronousThe asynchronicity of Ajax catches many new jQuery users off guard. Because Ajax calls are asynchronous by default, the response is not immediately available. Responses can only be handled using a callback. So, for example, the following code will not work: 1 2 3 4 5 6 7 var response; $.get( "foo.php", function( r ) { response = r;}); console.log( response ); // undefined Instead, we need to pass a callback function to our request; this callback will run when the request succeeds, at which point we can access the data that it returned, if any. 1 2 3 $.get( "foo.php", function( response ) { console.log( response ); // server response}); link Same-Origin Policy and JSONPIn general, Ajax requests are limited to the same protocol (http or https), the same port, and the same domain as the page making the request. This limitation does not apply to scripts that are loaded via jQuery's Ajax methods. Note: Versions of Internet Explorer less than 10 do not support cross-domain AJAX requests. The other exception is requests targeted at a JSONP service on another domain. In the case of JSONP, the provider of the service has agreed to respond to your request with a script that can be loaded into the page using a <script> tag, thus avoiding the same-origin limitation; that script will include the data you requested, wrapped in a callback function you provide. link Ajax and FirebugFirebug (or the Webkit Inspector in Chrome or Safari) is an invaluable tool for working with Ajax requests. You can see Ajax requests as they happen in the Console tab of Firebug (and in the Resources > XHR panel of Webkit Inspector), and you can click on a request to expand it and see details such as the request headers, response headers, response content, and more. If something isn't going as expected with an Ajax request, this is the first place to look to track down what's wrong. Ajax jQuery's Ajax-Related Methods Last Updated April 23, 2024 Suggestions, Problems, Feedback? Open an Issue or Submit a Pull Request on GitHub'''
