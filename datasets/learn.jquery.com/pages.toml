["https://learn.jquery.com/using-jquery-core/faq/how-do-i-get-the-text-value-of-a-selected-option"]
title = "How do I get the text value of a selected option? | jQuery Learning Center"
full_description = '''How do I get the text value of a selected option? Select elements typically have two values that you want to access. First there's the value to be sent to the server, which is easy: 1 2 $( "#myselect" ).val();// => 1 The second is the text value of the select. For example, using the following select box: 1 2 3 4 5 6 7 <select id="myselect"> <option value="1">Mr</option> <option value="2">Mrs</option> <option value="3">Ms</option> <option value="4">Dr</option> <option value="5">Prof</option></select> If you wanted to get the string "Mr" if the first option was selected (instead of just "1") you would do that in the following way: 1 2 $( "#myselect option:selected" ).text();// => "Mr" How do I check/uncheck a checkbox input or radio button? How do I replace text from the 3rd element of a list of 10 items? Last Updated April 23, 2024 Suggestions, Problems, Feedback? Open an Issue or Submit a Pull Request on GitHub'''
