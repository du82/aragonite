title = "Ajax Events | jQuery Learning Center"
full_description = '''Ajax Events Often, you'll want to perform an operation whenever an Ajax request starts or stops, such as showing or hiding a loading indicator. Rather than defining this behavior inside every Ajax request, you can bind Ajax events to elements just like you'd bind other events. For a complete list of Ajax events, visit Ajax Events documentation on docs.jquery.com. 1 2 3 4 5 6 7 8 // Setting up a loading indicator using Ajax Events$( "#loading_indicator" ) .ajaxStart(function() { $( this ).show(); }) .ajaxStop(function() { $( this ).hide(); }); Working with JSONP Plugins Last Updated April 23, 2024 Suggestions, Problems, Feedback? Open an Issue or Submit a Pull Request on GitHub'''
