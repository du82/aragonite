["https://learn.jquery.com/using-jquery-core/faq/how-do-i-pull-a-native-dom-element-from-a-jquery-object"]
title = "How do I pull a native DOM element from a jQuery object? | jQuery Learning Center"
full_description = 'How do I pull a native DOM element from a jQuery object? A jQuery object is an array-like wrapper around one or more DOM elements. To get a reference to the actual DOM elements (instead of the jQuery object), you have two options. The first (and fastest) method is to use array notation: 1 $( "#foo" )[ 0 ]; // Equivalent to document.getElementById( "foo" ) The second method is to use the .get() function: 1 $( "#foo" ).get( 0 ); // Identical to above, only slower. You can also call .get() without any arguments to retrieve a true array of DOM elements. How do I replace text from the 3rd element of a list of 10 items? Events Last Updated April 23, 2024 Suggestions, Problems, Feedback? Open an Issue or Submit a Pull Request on GitHub'
