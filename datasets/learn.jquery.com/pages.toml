title = "How do I select an item using class or ID? | jQuery Learning Center"
full_description = 'How do I select an item using class or ID? This code selects an element with an ID of "myDivId". Since IDs are unique, this expression always selects either zero or one elements depending upon whether or not an element with the specified ID exists. 1 $( "#myDivId" ); This code selects an element with a class of "myCssClass". Since any number of elements can have the same class, this expression will select any number of elements. 1 $( ".myCssClass" ); A jQuery object containing the selected element can be assigned to a JavaScript variable like normal: 1 var myDivElement = $( "#myDivId" ); Usually, elements in a jQuery object are acted on by other jQuery functions: 1 2 3 var myValue = $( "#myDivId" ).val(); // Get the value of a form input. $( "#myDivId" ).val( "hello world" ); // Set the value of a form input. link Related Articles Selecting Elements Working with Selections Frequently Asked Questions How do I select elements when I already have a DOM element? Last Updated April 23, 2024 Suggestions, Problems, Feedback? Open an Issue or Submit a Pull Request on GitHub'
