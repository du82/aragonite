["https://learn.jquery.com/plugins"]
title = "Plugins | jQuery Learning Center"
full_description = "Plugins A jQuery plugin is simply a new method that we use to extend jQuery's prototype object. By extending the prototype object you enable all jQuery objects to inherit any methods that you add. As established, whenever you call jQuery() you're creating a new jQuery object, with all of jQuery's methods inherited. The idea of a plugin is to do something with a collection of elements. You could consider each method that comes with the jQuery core a plugin, like .fadeOut() or .addClass(). You can make your own plugins and use them privately in your code or you can release them into the wild. There are thousands of jQuery plugins available online. The barrier to creating a plugin of your own is so low that you'll want to do it straight away! For details on how to create jQuery UI plugins via the Widget Factory, refer to How To Use the Widget Factory. Finding & Evaluating Plugins How to Create a Basic Plugin Publishing jQuery Plugins to npm Advanced Plugin Concepts Ajax Events Finding & Evaluating Plugins Last Updated April 23, 2024 Suggestions, Problems, Feedback? Open an Issue or Submit a Pull Request on GitHub"
