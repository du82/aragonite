["https://learn.jquery.com/code-organization/feature-browser-detection"]
title = "Feature & Browser Detection | jQuery Learning Center"
full_description = '''Feature & Browser Detection link Can I Use This Browser Feature?There are a couple of common ways to check whether or not a particular feature is supported by a user's browser: Browser Detection Specific Feature Detection In general, we recommend specific feature detection. Let's look at why. link Browser DetectionBrowser detection is a method where the browser's User Agent (UA) string is checked for a particular pattern unique to a browser family or version. For example, this is Chrome 39's UA string on Mac OS X Yosemite: 1 Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/39.0.2171.99 Safari/537.36 Browser UA detection may check this string for something like "Chrome" or "Chrome/39" or any other part the developer feels identifies the browser they intend to target. While this seems to be an easy solution, there are several problems: link Other browsers other than your target may have the same issue.If we target a specific browser for different functionality, we implicitly exclude any browser we did not account for. This is also not future-proof. If the browser we target receives a bug fix or change, we may not be able to discern between a "working" and "non-working" UA string. We may also need to update our test for each new release. This isn't a maintainable solution. link User Agents are unreliable.User Agents are set by the client browser. In the early days of the web, browsers would mimic each others' UA strings in order to bypass exactly this type of detection. It is still possible that a browser with very different capabilities may mimic just the portion of the UA string you're targeting. The UA string is also user-configurable. While the user may change this string, the browser's feature support remains the same. In general, we do not recommend UA string-based feature detection. link Specific Feature DetectionSpecific feature detection checks if a specific feature is available, instead of developing against a specific browser. This way, developers can write their code for two cases: the browser does support said feature, or the browser does not support said feature. Developing against specific features, instead of developing against a specific browser, not only clears up the peripheral logic of your application, but also makes your job easier as a developer. We recommend specific feature detection over UA string detection. Now how would you go about doing that? link How to go about feature detectionThere are several ways to go about feature detection: Straight JavaScript A Helper Library link Straight JavaScriptLet's take a look at how to check whether or not a <canvas> element exists in a specific browser, without using a helper library. We do this by specifically querying whether the method or property exists: 1 2 3 4 5 6 7 8 9 // We want to show a graph in browsers that support canvas,// but a data table in browsers that don't.var elem = document.createElement( "canvas" ); if ( elem.getContext && elem.getContext( "2d" ) ) { showGraph();} else { showTable();} This is a very simple way to provide conditional experiences, depending on the features present in the user's browser. We can extract this into a helper function for reuse, but still have to write a test for every feature we're concerned about. This can be time-consuming and error-prone. Instead you might be interested in using a helper library. link A Helper LibraryThankfully, there are some great helper libraries (like Modernizr) that provide a simple, high-level API for determining if a browser has a specific feature available or not. For example, utilizing Modernizr, we are able to do the same canvas detection test with this code: 1 2 3 4 5 if ( Modernizr.canvas ) { showGraphWithCanvas();} else { showTable();} For more in-depth information on Modernizr, feel free to check out their documentation. link Performance ConsiderationsSo, while the Modernizr syntax is great, it can end up being quite cumbersome to have several conditionals. Secondly, we're sending the code for both conditions to every browser, regardless if we'll need it or not. If you're using Modernizr, we highly encourage you to use the build configurator, a tool that allows you to create custom builds of the library. You can exclude checks you don't need, which will save bytes and reduce the time it takes the page to load. Running every check that Modernizr can do, even when you don't need them, can slow down the page load. link Other Resourceslink Feature Detection Tools modernizr — Conditionally check to see if a specific feature is available in a browser. html5please — Use the new and shiny responsibly. html5please API — An API you can query to see how good (or bad) support for a specific feature is. caniuse — Browser compatibility tables for HTML5, CSS3, SVG, etc. link Helpful Articles Browser Feature Detection Using Modernizr to detect HTML5 and CSS3 browser support Polyfilling the HTML5 gaps by Addy Osmani Feature, Browser, and Form Factor Detection: It's Good for the Environment by Michael Mahemoff Keep Things DRY Deferreds Last Updated April 23, 2024 Suggestions, Problems, Feedback? Open an Issue or Submit a Pull Request on GitHub'''
