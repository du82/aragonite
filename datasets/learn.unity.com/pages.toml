full_description = '''.unity-learn_svg__st0{fill:#fff}.unity-learn_svg__st1{fill:#ccc}My LearningPathwaysBrowseLiveEducator HubSearchLearn with PathwaysBuild all the skills you need to master Unity with these free online Pathways - courses designed by Unity creators, for Unity creators.Choose the right Pathway for youRecently updated!Unity Essentials2 weeksFoundational+600 XPNew to Unity? This guided learning Pathway includes everything you need to get started.Unity Essentials Pathway Junior Programmer12 weeksFoundational+3000 XPReady to code? This guided learning Pathway will take you from zero to job-ready!Junior Programmer Pathway Creative Core10 weeksBeginner+3000 XPReady for more? Level up your core understanding of Unity with the creative aspects of the engine.Creative Core Pathway VR Development6 weeksBeginner+600 XPReady to develop for VR? This guided learning Pathway will prepare you for a job in the VR industry!VR Development Pathway Mobile AR Development8 weeksFoundational+600 XPReady to create AR experiences? In this learning pathway, you'll develop AR apps compatible with iOS and Android devices!Mobile AR Development PathwayTestimonials“Extremely satisfying. The idea that I could program a game seemed completely beyond my reach at the beginning of my journey. Now it seems well within my grasp.”- Junior Programmer graduateTestimonials“Very well designed: you learn almost without realizing it. I have done other Unity courses, many paid, and they were much more confusing and less motivating.”- Unity Essentials graduateThe map to achieving your goalsUnity Pathways build on each other from skill to skill, making the journey to your learning goals a matter of following the path.Our structured learning paths take self-studying to the next levelUnity Pathways have been expertly engineered to optimize your learning experience, teaching you exactly what you need to know, when you need to know it, with a step-by-step curriculum.Mission checkpointsEach Pathway contains discrete missions. Already familiar with the material? Test your skills to skip past each checkpoint.XP pointsEarn XP points for each tutorial you complete. The more points you gain, the closer you are to becoming a Unity pro.Learn communityJoin the community of fellow Unity learners to share progress and motivation, ask questions, and speak to the Unity Learn team.Pathway badgeFor each Pathway you complete, you earn a shareable digital credential.Unlock assetsComplete mission checkpoints to unlock Unity asset packs that can be used in your project.Testimonials“I really enjoyed it because it was easy to follow and you had a completed project at the end.”- Unity Essentials graduateTestimonials“Empowering. Invigorating. Confidence building. I really like how the pathways not only focus on tactical skills but how to think about coding, about learning, about problem solving. Most courses, even at university levels, struggle with giving people foundational critical thinking skills in the topic area. I wouldn't have been able to be making games right now if it weren't for these courses!”- Unity Essentials and Junior Programmer graduateShowcaseSee what other students are creatingEach Pathway includes assignments to put your new skills into practice and share your work. To inspire you, here are some projects other students have created.Space Shooterhttps://github.com/PaigeWelton/SpaceShooter Did a simple derivation on the classic Asteroids to demonstrate all the aspects of OOP. 7913413787Created within Junior ProgrammerFactory Crane GameGitHub: https://github.com/JosephBabel/Factory-Crane-Game itch.io: https://josephbabel.itch.io/factory-crane-game For my final submission of this pathway I wanted to go beyond the requirement and create something that would look good for my portfolio. Here is where you can find my implementation of the four pillars of object-oriented programming: GameManager.cs - Encapsulation with private setters for properties that influence difficulty. Also abstraction with methods such as PauseGame() and EndGame() can be found here. Item.cs and ItemFragile.cs - Inheritance with ItemFragile inheriting from Item, and polymorphism with an OnDrop() method that is overridden for ItemFragile. Base items will lose value when dropped, while fragile items will break when dropped. 2110931949Created within Junior ProgrammerChicken LoopI came to this part of course in Thursday and decided to participate in a game jam on upcoming weekend. So this project I made both for game jam and to submit it here. It was made for two days so code is not perfect but I think I have accomplished all requirements for this course task. I have Polymorphism, Inheritance, Encapsulation and Abstraction. I have marked this places in code with according comments. Source files can found here: https://github.com/MarkianovNikita/MiniJam92 And the playable build you can download from here: https://overlordnikita.itch.io/chicken-loop Here I describe some part of the code in Google document: https://docs.google.com/document/d/1h2AKl7lyNb0ecFQAEdgcxbqec4HgbxLJwiJQCmghtes/edit?usp=sharing 344911605Created within Junior ProgrammerLearning SupportAccelerate your learning journey with additional resources and live projects to build your skills, test your knowledge, and immerse yourself in the real-time 3D community.For EducatorsTeach PathwaysIf you’re an educator hoping to support students to complete Pathways, you can find planning resources (including syllabi, scope and sequences, lesson plans, and more) in the For Educators section throughout the Pathways.Explore more teaching resourcesLanguageEnglishDeutsch日本語FrançaisPortuguês简体中文EspañolРусский한국어SocialLearningPathwaysCoursesProjectsTutorialsEducator HubLiveLive SessionsPreviously recordedEducation PlansStudentsEducatorsInstitutionsCertificationsResourcesUnity Asset StoreCommunityDocumentationUnity FAQLearn FAQUnityUnity.comNewsletterBlogEventsUnity PlayCopyright © 2025 Unity TechnologiesLegalPrivacy PolicyCookiesDo Not Sell My Personal InformationCookies Settings"Unity", Unity logos, and other Unity trademarks are trademarks or registered trademarks of Unity Technologies or its affiliates in the U.S. and elsewhere (more info here). Other names or brands are trademarks of their respective owners.'''
