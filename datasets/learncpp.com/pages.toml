title = "17.x — Chapter 17 summary and quiz – Learn C++"
description = "Your email address will not be displayed"
full_description = '''17.x — Chapter 17 summary and quizAlex October 5, 2015, 4:20 pm PDT January 6, 2025(adsbygoogle=window.adsbygoogle||[]).push({});Chapter ReviewFixed-size arrays (or fixed-length arrays) require that the length of the array be known at the point of instantiation, and that length cannot be changed afterward. C-style arrays and std::array are both fixed-size arrays. Dynamic arrays can be resized at runtime. std::vector is a dynamic array.The length of a std::array must be a constant expression. Most often, the value provided for the length will be an integer literal, constexpr variable, or an unscoped enumerator.std::array is an aggregate. This means it has no constructors, and instead is initialized using aggregate initialization.Define your std::array as constexpr whenever possible. If your std::array is not constexpr, consider using a std::vector instead.Use class template argument deduction (CTAD) to have the compiler deduce the type and length of a std::array from its initializers.std::array is implemented as a template struct whose declaration looks like this:template<typename T, std::size_t N> // N is a non-type template parameter struct array;The non-type template parameter representing the array length (N) has type std::size_t.To get the length of a std::array:We can ask a std::array object for its length using the size() member function (which returns the length as unsigned size_type).In C++17, we can use the std::size() non-member function (which for std::array just calls the size() member function, thus returning the length as unsigned size_type).In C++20, we can use the std::ssize() non-member function, which returns the length as a large signed integral type (usuallystd::ptrdiff_t).All three of these functions will return the length as a constexpr value, except when called on a std::array passed by reference. This defect has been addressed in C++23 by P2280.To index a std::array:Use the subscript operator (operator[]). No bounds checking is done in this case, and passing in an invalid index will result in undefined behavior.Use the at() member function that does subscripting with runtime bounds checking. We recommend avoiding this function since we typically want to do bounds checking before indexing, or we want compile-time bounds checking.Use the std::get() function template, which takes the index as a non-type template argument, and does compile-time bounds checking.You can pass std::array with different element types and lengths to a function using a function template with the template parameter declaration template <typename T, std::size_t N>. Or in C++20, use template <typename T, auto N>.Returning a std::array by value will make a copy of the array and all elements, but this may be okay if the array is small and the elements aren’t expensive to copy. Using an out parameter instead may be a better choice in some contexts.When initializing a std::array with a struct, class, or array and not providing the element type with each initializer, you’ll need an extra pair of braces so that the compiler will properly interpret what to initialize. This is an artifact of aggregate initialization, and other standard library container types (that use list constructors) do not require the double braces in these cases.Aggregates in C++ support a concept called brace elision, which lays out some rules for when multiple braces may be omitted. Generally, you can omit braces when initializing a std::array with scalar (single) values, or when initializing with class types or arrays where the type is explicitly named with each element.You can not have an array of references, but you can have an array of std::reference_wrapper, which behaves like a modifiable lvalue reference.There are a few things worth noting about std::reference_wrapper:Operator= will reseat a std::reference_wrapper (change which object is being referenced).std::reference_wrapper<T> will implicitly convert to T&.The get() member function can be used to get a T&. This is useful when we want to update the value of the object being referenced.The std::ref() and std::cref() functions were provided as shortcuts to create std::reference_wrapper and const std::reference_wrapper wrapped objects.Use static_assert whenever possible to ensure a constexpr std::array using CTAD has the correct number of initializers.C-style arrays were inherited from the C language, and are built-in to the core language of C++. Because they are part of the core language, C-style arrays have their own special declaration syntax. In an C-style array declaration, we use square brackets ([]) to tell the compiler that a declared object is a C-style array. Inside the square brackets, we can optionally provide the length of the array, which is an integral value of type std::size_t that tells the compiler how many elements are in the array. The length of a C-style array must be a constant expression.C-style arrays are aggregates, which means they can be initialized using aggregate initialization. When using an initializer list to initialize all elements of a C-style array, it’s preferable to omit the length and let the compiler calculate the length of the array.C-style arrays can be indexed via operator[]. The index of a C-style array can be either a signed or an unsigned integer, or an unscoped enumeration. This means that C-style arrays are not subject to all of the sign conversion indexing issues that the standard library container classes have!C-style arrays can be const or constexpr.To get the length of a C-style array:In C++17, we can use the std::size() non-member function, which returns the length as unsigned std::size_t.In C++20, we can use the std::ssize() non-member function, which returns the length as a large signed integral type (usuallystd::ptrdiff_t).In most cases, when a C-style array is used in an expression, the array will be implicitly converted into a pointer to the element type, initialized with the address of the first element (with index 0). Colloquially, this is called array decay (or just decay for short).Pointer arithmetic is a feature the allows us to apply certain integer arithmetic operators (addition, subtraction, increment, or decrement) to a pointer to produce a new memory address. Given some pointer ptr, ptr + 1 returns the address of the next object in memory (based on the type being pointed to).Use subscripting when indexing from the start of the array (element 0), so the array indices line up with the element.Use pointer arithmetic when doing relative positioning from a given element.C-style strings are just C-style arrays whose element type is char or const char. As such, C-style strings will decay.The dimension of an array is the number of indices needed to select an element.An array containing only a single dimension is called a single-dimensional array or a one-dimensional array (sometimes abbreviated as a 1d array). An array of arrays is called a two-dimensional array (sometimes abbreviated as a 2d array) because it has two subscripts. Arrays with more than one dimension are called multidimensional arrays. Flattening an array is a process of reducing the dimensionality of an array (often down to a single dimension).In C++23, std::mdspan is a view that provides a multidimensional array interface for a contiguous sequence of elements.Quiz timeQuestion #1What’s wrong with each of these snippets, and how would you fix it?a)#include <array> #include <iostream> int main() { std::array arr { 0, 1, 2, 3 }; for (std::size_t count{ 0 }; count <= std::size(arr); ++count) { std::cout << arr[count] << ' '; } std::cout << '\n'; return 0; }Show SolutionThe for-loop has an off-by-one error, and tries to access the array element with index 4, which does not exist.Solution: the conditional in the for loop should use < instead of <=.b)#include <iostream> void printArray(int array[]) { for (int element : array) { std::cout << element << ' '; } } int main() { int array[] { 9, 7, 5, 3, 1 }; printArray(array); std::cout << '\n'; return 0; }Show Solutionarray decays to a pointer when it is passed to printArray(). Range-based for-loops can’t work with a pointer to an array because the size of the array isn’t known.Solution: use std::array instead, which doesn’t decay.c)#include <array> #include <iostream> int main() { std::cout << "Enter the number of test scores: "; std::size_t length{}; std::cin >> length; std::array<int, length> scores; for (std::size_t i { 0 } ; i < length; ++i) { std::cout << "Enter score " << i << ": "; std::cin >> scores[i]; } return 0; }Show Solutionlength is not a constant expression, and cannot be used to define the length of std::array.Solution: use a std::vector instead.Question #2In this quiz, we’re going to implement Roscoe’s potion emporium, the finest potion shop in the land! This is going to be a bigger challenge.Implement a program that outputs the following:Welcome to Roscoe's potion emporium! Enter your name: Alex Hello, Alex, you have 85 gold. Here is our selection for today: 0) healing costs 20 1) mana costs 30 2) speed costs 12 3) invisibility costs 50 Enter the number of the potion you'd like to buy, or 'q' to quit: a That is an invalid input. Try again: 3 You purchased a potion of invisibility. You have 35 gold left. Here is our selection for today: 0) healing costs 20 1) mana costs 30 2) speed costs 12 3) invisibility costs 50 Enter the number of the potion you'd like to buy, or 'q' to quit: 4 That is an invalid input. Try again: 2 You purchased a potion of speed. You have 23 gold left. Here is our selection for today: 0) healing costs 20 1) mana costs 30 2) speed costs 12 3) invisibility costs 50 Enter the number of the potion you'd like to buy, or 'q' to quit: 2 You purchased a potion of speed. You have 11 gold left. Here is our selection for today: 0) healing costs 20 1) mana costs 30 2) speed costs 12 3) invisibility costs 50 Enter the number of the potion you'd like to buy, or 'q' to quit: 4 You can not afford that. Here is our selection for today: 0) healing costs 20 1) mana costs 30 2) speed costs 12 3) invisibility costs 50 Enter the number of the potion you'd like to buy, or 'q' to quit: q Your inventory contains: 2x potion of speed 1x potion of invisibility You escaped with 11 gold remaining. Thanks for shopping at Roscoe's potion emporium! The player starts with a randomized amount of gold, between 80 and 120.Sound fun? Let’s do it! Because this will be hard to implement all at once, we’ll develop this in steps.> Step #1Create a Potion namespace containing an enum named Type containing the potion types. Create two std::array: an int array to hold the potion costs, and a std::string_view array to hold the potion names.Also write a function named shop() that enumerates through the list of Potions and prints their numbers, names, and cost.The program should output the following:Here is our selection for today: 0) healing costs 20 1) mana costs 30 2) speed costs 12 3) invisibility costs 50 Show HintHint: We show a method for iterating through an enumeration using a range-based for-loop in lesson 17.6 -- std::array and enumerations.Show Solution#include <array> #include <iostream> #include <string_view> namespace Potion { enum Type { healing, mana, speed, invisibility, max_potions }; constexpr std::array types { healing, mana, speed, invisibility }; // An array of our enumerators // We could put these in a struct, but since we only have two attributes we'll keep them separate for now // We will explicitly define the element type so we don't have to use the sv suffix constexpr std::array<std::string_view, max_potions> name { "healing", "mana", "speed", "invisibility" }; constexpr std::array cost { 20, 30, 12, 50 }; static_assert(std::size(types) == max_potions); // ensure 'all' contains the correct number of enumerators static_assert(std::size(cost) == max_potions); static_assert(std::size(name) == max_potions); } void shop() { std::cout << "Here is our selection for today:\n"; for (auto p: Potion::types) std::cout << p << ") " << Potion::name[p] << " costs " << Potion::cost[p] << '\n'; } int main() { shop(); return 0; }> Step #2Create a Player class to store the player’s name, potion inventory, and gold. Add the introductory and goodbye text for Roscoe’s emporium. Get the player’s name and randomize their gold.Use the “Random.h” file in lesson 8.15 -- Global random numbers (Random.h) to make randomization easy.The program should output the following:Welcome to Roscoe's potion emporium! Enter your name: Alex Hello, Alex, you have 84 gold. Here is our selection for today: 0) healing costs 20 1) mana costs 30 2) speed costs 12 3) invisibility costs 50 Thanks for shopping at Roscoe's potion emporium! Show Solution#include <array> #include <iostream> #include <string_view> #include "Random.h" namespace Potion { enum Type { healing, mana, speed, invisibility, max_potions }; constexpr std::array types { healing, mana, speed, invisibility }; // An array of our enumerators // We could put these in a struct, but since we only have two attributes we'll keep them separate for now // We will explicitly define the element type so we don't have to use the sv suffix constexpr std::array<std::string_view, max_potions> name { "healing", "mana", "speed", "invisibility" }; constexpr std::array cost { 20, 30, 12, 50 }; static_assert(std::size(types) == max_potions); // ensure 'all' contains the correct number of enumerators static_assert(std::size(cost) == max_potions); static_assert(std::size(name) == max_potions); } class Player { private: static constexpr int s_minStartingGold { 80 }; static constexpr int s_maxStartingGold { 120 }; std::string m_name {}; int m_gold {}; std::array<int, Potion::max_potions> m_inventory { }; public: explicit Player(std::string_view name) : m_name { name }, m_gold { Random::get(s_minStartingGold, s_maxStartingGold) } { } int gold() const { return m_gold; } int inventory(Potion::Type p) const { return m_inventory[p]; } }; void shop() { std::cout << "Here is our selection for today:\n"; for (auto p: Potion::types) std::cout << p << ") " << Potion::name[p] << " costs " << Potion::cost[p] << '\n'; } int main() { std::cout << "Welcome to Roscoe's potion emporium!\n"; std::cout << "Enter your name: "; std::string name{}; std::getline(std::cin >> std::ws, name); // read a full line of text into name Player player { name }; std::cout << "Hello, " << name << ", you have " << player.gold() << " gold.\n\n"; shop(); std::cout << "\nThanks for shopping at Roscoe's potion emporium!\n"; return 0; }> Step #3Add the ability to purchase potions, handling invalid input (treat any extraneous input as a failure). Print the player’s inventory after they leave. The program should be complete after this step.Make sure you test for the following cases:User enters an invalid potion number (e.g. ‘d’)User enters a valid potion number but with extraneous input (e.g. 2d, 25)We cover invalid input handling in lesson 9.5 -- std::cin and h'''
