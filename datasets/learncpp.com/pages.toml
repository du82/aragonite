full_description = '22.x — Chapter 22 summary and quizAlex May 3, 2017, 11:28 am PDT January 6, 2025(adsbygoogle=window.adsbygoogle||[]).push({});A smart pointer class is a composition class that is designed to manage dynamically allocated memory, and ensure that memory gets deleted when the smart pointer object goes out of scope.Copy semantics allow our classes to be copied. This is done primarily via the copy constructor and copy assignment operator.Move semantics mean a class will transfer ownership of the object rather than making a copy. This is done primarily via the move constructor and move assignment operator.std::auto_ptr is deprecated and should be avoided.An r-value reference is a reference that is designed to be initialized with an r-value. An r-value reference is created using a double ampersand. It’s fine to write functions that take r-value reference parameters, but you should almost never return an r-value reference.If we construct an object or do an assignment where the argument is an l-value, the only thing we can reasonably do is copy the l-value. We can’t assume it’s safe to alter the l-value, because it may be used again later in the program. If we have an expression “a = b”, we wouldn’t reasonably expect b to be changed in any way.However, if we construct an object or do an assignment where the argument is an r-value, then we know that r-value is just a temporary object of some kind. Instead of copying it (which can be expensive), we can simply transfer its resources (which is cheap) to the object we’re constructing or assigning. This is safe to do because the temporary will be destroyed at the end of the expression anyway, so we know it will never be used again!You can use the delete keyword to disable copy semantics for classes you create by deleting the copy constructor and copy assignment operator.std::move allows you to treat an l-value as r-value. This is useful when we want to invoke move semantics instead of copy semantics on an l-value.std::unique_ptr is the smart pointer class that you should probably be using. It manages a single non-shareable resource. std::make_unique() (in C++14) should be preferred to create new std::unique_ptr. std::unique_ptr disables copy semantics.std::shared_ptr is the smart pointer class used when you need multiple objects accessing the same resource. The resource will not be destroyed until the last std::shared_ptr managing it is destroyed. std::make_shared() should be preferred to create new std::shared_ptr. With std::shared_ptr, copy semantics should be used to create additional std::shared_ptr pointing to the same object.std::weak_ptr is the smart pointer class used when you need one or more objects with the ability to view and access a resource managed by a std::shared_ptr, but unlike std::shared_ptr, std::weak_ptr is not considered when determining whether the resource should be destroyed.Quiz timeExplain when you should use the following types of pointers.1a) std::unique_ptrShow Solutionstd::unique_ptr should be used when you want a smart pointer to manage a dynamic object that is not going to be shared.1b) std::shared_ptrShow Solutionstd::shared_ptr should be used when you want a smart pointer to manage a dynamic object that may be shared. The object won’t be deallocated until all std::shared_ptr holding the object are destroyed.1c) std::weak_ptrShow Solutionstd::weak_ptr should be used when you want access to an object that is being managed by a std::shared_ptr, but don’t want the lifetime of the std::shared_ptr to be tied to the lifetime of the std::weak_ptr.1d) std::auto_ptrShow Solutionstd::auto_ptr has been deprecated and was removed in C++17. It should not be used.Explain why move semantics is focused around r-values.Show SolutionBecause r-values are temporary, we know they are going to get destroyed after they are used. When passing or returning an r-value by value, it’s wasteful to make a copy and then destroy the original. Instead, we can simply move (steal) the r-value’s resources, which is generally more efficient.What’s wrong with the following code? Update the program to be best practices compliant.3a)#include <iostream> #include <memory> // for std::shared_ptr class Resource { public: Resource() { std::cout << "Resource acquired\n"; } ~Resource() { std::cout << "Resource destroyed\n"; } }; int main() { auto* res{ new Resource{} }; std::shared_ptr<Resource> ptr1{ res }; std::shared_ptr<Resource> ptr2{ res }; return 0; }Show Solutionptr2 was created from res instead of from ptr1. This means that you now have two std::shared_ptr each independently trying to manage the Resource (they are not aware of each other). When one goes out of scope, the other will be left with a dangling pointer.ptr2 should instead be initialized with ptr1 instead of from res. This will allow both ptr1 and ptr2 to share ownership of res. std::make_shared() should be used instead of manual dynamic allocation.#include <iostream> #include <memory> // for std::shared_ptr class Resource { public: Resource() { std::cout << "Resource acquired\n"; } ~Resource() { std::cout << "Resource destroyed\n"; } }; int main() { auto ptr1{ std::make_shared<Resource>() }; auto ptr2{ ptr1 }; return 0; }Next lesson23.1Object relationshipsBack to table of contentsPrevious lesson22.7Circular dependency issues with std::shared_ptr, and std::weak_ptr(adsbygoogle=window.adsbygoogle||[]).push({});'
