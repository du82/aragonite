title = "11.5 — Default arguments – Learn C++"
description = "Your email address will not be displayed"
full_description = '''11.5 — Default argumentsAlex August 6, 2007, 4:38 pm PDT November 10, 2024(adsbygoogle=window.adsbygoogle||[]).push({});A default argument is a default value provided for a function parameter. For example:void print(int x, int y=10) // 10 is the default argument { std::cout << "x: " << x << '\n'; std::cout << "y: " << y << '\n'; }When making a function call, the caller can optionally provide an argument for any function parameter that has a default argument. If the caller provides an argument, the value of the argument in the function call is used. If the caller does not provide an argument, the value of the default argument is used.Consider the following program:#include <iostream> void print(int x, int y=4) // 4 is the default argument { std::cout << "x: " << x << '\n'; std::cout << "y: " << y << '\n'; } int main() { print(1, 2); // y will use user-supplied argument 2 print(3); // y will use default argument 4, as if we had called print(3, 4) return 0; }This program produces the following output:x: 1 y: 2 x: 3 y: 4 In the first function call, the caller supplied explicit arguments for both parameters, so those argument values are used. In the second function call, the caller omitted the second argument, so the default value of 4 was used.Note that you must use the equals sign to specify a default argument. Using parenthesis or brace initialization won’t work:void foo(int x = 5); // ok void goo(int x ( 5 )); // compile error void boo(int x { 5 }); // compile errorPerhaps surprisingly, default arguments are handled by the compiler at the call site. In the above example, when the compiler sees print(3), it will rewrite this function call as print(3, 4), so that the number of arguments matches the number of parameters. The rewritten function call then works as per usual.Key insightDefault arguments are inserted by the compiler at site of the function call.Default arguments are frequently used in C++, and you’ll see them a lot in code you encounter (and in future lessons).When to use default argumentsDefault arguments are an excellent option when a function needs a value that has a reasonable default value, but for which you want to let the caller override if they wish.For example, here are a couple of function prototypes for which default arguments might be commonly used:int rollDie(int sides=6); void openLogFile(std::string filename="default.log");Author’s noteBecause the user can choose whether to supply a specific argument value or use the default value, a parameter with a default value provided is sometimes called an optional parameter. However, the term optional parameter is also used to refer to several other types of parameters (including parameters passed by address, and parameters using std::optional), so we recommend avoiding this term.Default arguments are also useful in cases where we need to add a new parameter to an existing function. If we add a new parameter without a default argument, it will break all existing function calls (which aren’t supplying an argument for that parameter). This can result in a lot of updating of existing function calls (and may not even be possible if you don’t own the calling code). However, if we add a new parameter with a default argument instead, all existing function calls will still work (as they will use the default argument for the parameter), while still letting new calls to the function specify an explicit argument if desired.Multiple default argumentsA function can have multiple parameters with default arguments:#include <iostream> void print(int x=10, int y=20, int z=30) { std::cout << "Values: " << x << " " << y << " " << z << '\n'; } int main() { print(1, 2, 3); // all explicit arguments print(1, 2); // rightmost argument defaulted print(1); // two rightmost arguments defaulted print(); // all arguments defaulted return 0; }The following output is produced:Values: 1 2 3 Values: 1 2 30 Values: 1 20 30 Values: 10 20 30 C++ does not (as of C++23) support a function call syntax such as print(,,3) (as a way to provide an explicit value for z while using the default arguments for x and y. This has three major consequences:In a function call, any explicitly provided arguments must be the leftmost arguments (arguments with defaults cannot be skipped).For example:void print(std::string_view sv="Hello", double d=10.0); int main() { print(); // okay: both arguments defaulted print("Macaroni"); // okay: d defaults to 10.0 print(20.0); // error: does not match above function (cannot skip argument for sv) return 0; }If a parameter is given a default argument, all subsequent parameters (to the right) must also be given default arguments.The following is not allowed:void print(int x=10, int y); // not allowedRuleIf a parameter is given a default argument, all subsequent parameters (to the right) must also be given default arguments.If more than one parameter has a default argument, the leftmost parameter should be the one most likely to be explicitly set by the user.Default arguments can not be redeclared, and must be declared before useOnce declared, a default argument can not be redeclared in the same translation unit. That means for a function with a forward declaration and a function definition, the default argument can be declared in either the forward declaration or the function definition, but not both.#include <iostream> void print(int x, int y=4); // forward declaration void print(int x, int y=4) // compile error: redefinition of default argument { std::cout << "x: " << x << '\n'; std::cout << "y: " << y << '\n'; }The default argument must also be declared in the translation unit before it can be used:#include <iostream> void print(int x, int y); // forward declaration, no default argument int main() { print(3); // compile error: default argument for y hasn't been defined yet return 0; } void print(int x, int y=4) { std::cout << "x: " << x << '\n'; std::cout << "y: " << y << '\n'; }The best practice is to declare the default argument in the forward declaration and not in the function definition, as the forward declaration is more likely to be seen by other files and included before use (particularly if it’s in a header file).in foo.h:#ifndef FOO_H #define FOO_H void print(int x, int y=4); #endifin main.cpp:#include "foo.h" #include <iostream> void print(int x, int y) { std::cout << "x: " << x << '\n'; std::cout << "y: " << y << '\n'; } int main() { print(5); return 0; }Note that in the above example, we’re able to use the default argument for function print() because main.cpp #includes foo.h, which has the forward declaration that defines the default argument.Best practiceIf the function has a forward declaration (especially one in a header file), put the default argument there. Otherwise, put the default argument in the function definition.Default arguments and function overloadingFunctions with default arguments may be overloaded. For example, the following is allowed:#include <iostream> #include <string_view> void print(std::string_view s) { std::cout << s << '\n'; } void print(char c = ' ') { std::cout << c << '\n'; } int main() { print("Hello, world"); // resolves to print(std::string_view) print('a'); // resolves to print(char) print(); // resolves to print(char) return 0; }The function call to print() actually calls print(char), which acts as if the user had explicitly called print(' ').Now consider this case:void print(int x); // signature print(int) void print(int x, int y = 10); // signature print(int, int) void print(int x, double y = 20.5); // signature print(int, double) Default values are not part of a function’s signature, so these function declarations are differentiated overloads.Related contentWe discuss function overload differentiation in lesson 11.2 -- Function overload differentiationDefault arguments can lead to ambiguous matchesDefault arguments can easily lead to ambiguous function calls:void foo(int x = 0) { } void foo(double d = 0.0) { } int main() { foo(); // ambiguous function call return 0; }In this example, the compiler can’t tell whether foo() should resolve to foo(0) or foo(0.0).Here’s a slightly more complex example:void print(int x); // signature print(int) void print(int x, int y = 10); // signature print(int, int) void print(int x, double y = 20.5); // signature print(int, double) int main() { print(1, 2); // will resolve to print(int, int) print(1, 2.5); // will resolve to print(int, double) print(1); // ambiguous function call return 0; }For the call print(1), the compiler is unable to tell whether this resolve to print(int), print(int, int), or print(int, double).In the case where we mean to call print(int, int) or print(int, double) we can always explicitly specify the second parameter. But what if we want to call print(int)? It’s not obvious how we can do so.Default arguments don’t work for functions called through function pointers AdvancedWe cover this topic in lesson 20.1 -- Function Pointers. Because default arguments are not considered using this method, this also provides a workaround to call a function that would otherwise be ambiguous due to default arguments.Next lesson11.6Function templatesBack to table of contentsPrevious lesson11.4Deleting functions(adsbygoogle=window.adsbygoogle||[]).push({});'''
