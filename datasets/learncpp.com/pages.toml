y) enough to at least pay the hosting fees and maybe buy ourselves a Hawaiian pizza and a pint of Newcastle every once in a while*. (* Beer and programming don’t mix. Please code responsibly.)If you find this site’s content useful, consider making a donation. All donations go to web hosting fees (currently about $1200/yr) and help keep the site free for everybody. Thanks to everyone who has made a donation!via Paypal Endorsements Dr. Robert C.A. Goff, MCSD, MCDBA, MCSE, Consulting and Training in Microsoft Technologies:I just finished reading through your C++ Tutorial. It’s wonderful. I have taught C++ to college students and have examined many, many intro books on the subject. Your tutorial is the clearest and most comfortable coverage available.Syam from Trinidad:It’s crazy how perfect this website explains C++ concepts and teaches programming. I read the book Practice and Principle [by Bjarne Stroustrup, the creator of C++] and it was rather confusing…. This website makes it clear the first time, and they explain everything you need to know. Somehow they know what I don’t know, and what I need to know. It’s almost like my future self went back in the past to teach me what mistakes I will make.Tony Vice:The author of this [website] is an absolute legend.Advertising on LearnCpp.comLearnCpp.com is not accepting any text-link advertising at this time.ContactContact FormName: Please enter at least 2 characters Email: Please enter a valid email Enter number 736: Please enter the correct number Message: Please enter at least 10 characters Submit"
