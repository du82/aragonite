title = "4.11 — Chars – Learn C++"
description = "Your email address will not be displayed"
full_description = '''4.11 — CharsAlex June 9, 2007, 7:07 pm PDT December 1, 2024(adsbygoogle=window.adsbygoogle||[]).push({});To this point, the fundamental data types we’ve looked at have been used to hold numbers (integers and floating points) or true/false values (Booleans). But what if we want to store letters or punctuation?#include <iostream> int main() { std::cout << "Would you like a burrito? (y/n)"; // We want the user to enter a 'y' or 'n' character // How do we do this? return 0; }The char data type was designed to hold a single character. A character can be a single letter, number, symbol, or whitespace.The char data type is an integral type, meaning the underlying value is stored as an integer. Similar to how a Boolean value 0 is interpreted as false and non-zero is interpreted as true, the integer stored by a char variable are intepreted as an ASCII character.ASCII stands for American Standard Code for Information Interchange, and it defines a particular way to represent English characters (plus a few other symbols) as numbers between 0 and 127 (called an ASCII code or code point). For example, ASCII code 97 is interpreted as the character ‘a’.Character literals are always placed between single quotes (e.g. ‘g’, ‘1’, ‘ ‘).Here’s a full table of ASCII characters:CodeSymbolCodeSymbolCodeSymbolCodeSymbol0NUL (null)32(space)64@96`1SOH (start of header)33!65A97a2STX (start of text)34”66B98b3ETX (end of text)35#67C99c4EOT (end of transmission)36$68D100d5ENQ (enquiry)37%69E101e6ACK (acknowledge)38&70F102f7BEL (bell)39’71G103g8BS (backspace)40(72H104h9HT (horizontal tab)41)73I105i10LF (line feed/new line)42*74J106j11VT (vertical tab)43+75K107k12FF (form feed / new page)44,76L108l13CR (carriage return)45-77M109m14SO (shift out)46.78N110n15SI (shift in)47/79O111o16DLE (data link escape)48080P112p17DC1 (data control 1)49181Q113q18DC2 (data control 2)50282R114r19DC3 (data control 3)51383S115s20DC4 (data control 4)52484T116t21NAK (negative acknowledge)53585U117u22SYN (synchronous idle)54686V118v23ETB (end of transmission block)55787W119w24CAN (cancel)56888X120x25EM (end of medium)57989Y121y26SUB (substitute)58:90Z122z27ESC (escape)59;91[123{28FS (file separator)60<92\124|29GS (group separator)61=93]125}30RS (record separator)62>94^126~31US (unit separator)63?95_127DEL (delete)Codes 0-31 and 127 are called the unprintable chars. These codes were designed to control peripheral devices such as printers (e.g. by instructing the printer how to move the print head). Most of these are obsolete now. If you try to print these chars, the results are dependent upon your OS (you may get some emoji-like characters).Codes 32-126 are called the printable characters, and they represent the letters, number characters, and punctuation that most computers use to display basic English text.If you try to print a character whose value is outside the range of ASCII, the results are also dependent upon your OS.Initializing charsYou can initialize char variables using character literals:char ch2{ 'a' }; // initialize with code point for 'a' (stored as integer 97) (preferred)You can initialize chars with integers as well, but this should be avoided if possiblechar ch1{ 97 }; // initialize with integer 97 ('a') (not preferred)WarningBe careful not to mix up character numbers with integer numbers. The following two initializations are not the same:char ch{5}; // initialize with integer 5 (stored as integer 5) char ch{'5'}; // initialize with code point for '5' (stored as integer 53)Character numbers are intended to be used when we want to represent numbers as text, rather than as numbers to apply mathematical operations to.Printing charsWhen using std::cout to print a char, std::cout outputs the char variable as an ASCII character:#include <iostream> int main() { char ch1{ 'a' }; // (preferred) std::cout << ch1; // cout prints character 'a' char ch2{ 98 }; // code point for 'b' (not preferred) std::cout << ch2; // cout prints a character ('b') return 0; }This produces the result:ab We can also output char literals directly:std::cout << 'c';This produces the result:c Inputting charsThe following program asks the user to input a character, then prints out the character:#include <iostream> int main() { std::cout << "Input a keyboard character: "; char ch{}; std::cin >> ch; std::cout << "You entered: " << ch << '\n'; return 0; }Here’s the output from one run:Input a keyboard character: q You entered: q Note that std::cin will let you enter multiple characters. However, variable ch can only hold 1 character. Consequently, only the first input character is extracted into variable ch. The rest of the user input is left in the input buffer that std::cin uses, and can be extracted with subsequent calls to std::cin.You can see this behavior in the following example:#include <iostream> int main() { std::cout << "Input a keyboard character: "; // assume the user enters "abcd" (without quotes) char ch{}; std::cin >> ch; // ch = 'a', "bcd" is left queued. std::cout << "You entered: " << ch << '\n'; // Note: The following cin doesn't ask the user for input, it grabs queued input! std::cin >> ch; // ch = 'b', "cd" is left queued. std::cout << "You entered: " << ch << '\n'; return 0; }Input a keyboard character: abcd You entered: a You entered: b If you want to read in more than one char at a time (e.g. to read in a name, word, or sentence), you’ll want to use a string instead of a char. A string is a collection of sequential characters (and thus, a string can hold multiple symbols). We discuss this in upcoming lesson (5.7 -- Introduction to std::string).Extracting whitespace charactersBecause extracting input ignores leading whitespace, this can lead to unexpected results when trying to extract whitespace characters to a char variable:#include <iostream> int main() { std::cout << "Input a keyboard character: "; // assume the user enters "a b" (without quotes) char ch{}; std::cin >> ch; // extracts a, leaves " b\n" in stream std::cout << "You entered: " << ch << '\n'; std::cin >> ch; // skips leading whitespace (the space), extracts b, leaves "\n" in stream std::cout << "You entered: " << ch << '\n'; return 0; }Input a keyboard character: a b You entered: a You entered: b In the above example, we may have expected to extract the space, but because leading whitespace is skipped, we extracted the b character instead.One simple way to address this is to use the std::cin.get() function to perform the extraction instead, as this function does not ignore leading whitespace:#include <iostream> int main() { std::cout << "Input a keyboard character: "; // assume the user enters "a b" (without quotes) char ch{}; std::cin.get(ch); // extracts a, leaves " b\n" in stream std::cout << "You entered: " << ch << '\n'; std::cin.get(ch); // extracts space, leaves "b\n" in stream std::cout << "You entered: " << ch << '\n'; return 0; }Input a keyboard character: a b You entered: a You entered: Char size, range, and default signChar is defined by C++ to always be 1 byte in size. By default, a char may be signed or unsigned (though it’s usually signed). If you’re using chars to hold ASCII characters, you don’t need to specify a sign (since both signed and unsigned chars can hold values between 0 and 127).If you’re using a char to hold small integers (something you should not do unless you’re explicitly optimizing for space), you should always specify whether it is signed or unsigned. A signed char can hold a number between -128 and 127. An unsigned char can hold a number between 0 and 255.Escape sequencesThere are some sequences of characters in C++ that have special meaning. These characters are called escape sequences. An escape sequence starts with a ‘\’ (backslash) character, and then a following letter or number.You’ve already seen the most common escape sequence: '\n', which can be used to print a newline:#include <iostream> int main() { int x { 5 }; std::cout << "The value of x is: " << x << '\n'; // standalone \n goes in single quotes std::cout << "First line\nSecond line\n"; // \n can be embedded in double quotes return 0; }This outputs:The value of x is: 5 First line Second line Another commonly used escape sequence is '\t', which embeds a horizontal tab:#include <iostream> int main() { std::cout << "First part\tSecond part"; return 0; }Which outputs:First part Second part Three other notable escape sequences are:\’ prints a single quote\” prints a double quote\\ prints a backslashHere’s a table of all of the escape sequences:NameSymbolMeaningAlert\aMakes an alert, such as a beepBackspace\bMoves the cursor back one spaceFormfeed\fMoves the cursor to next logical pageNewline\nMoves cursor to next lineCarriage return\rMoves cursor to beginning of lineHorizontal tab\tPrints a horizontal tabVertical tab\vPrints a vertical tabSingle quote\’Prints a single quoteDouble quote\”Prints a double quoteBackslash\\Prints a backslash.Question mark\?Prints a question mark.No longer relevant. You can use question marks unescaped.Octal number\(number)Translates into char represented by octalHex number\x(number)Translates into char represented by hex numberHere are some examples:#include <iostream> int main() { std::cout << "\"This is quoted text\"\n"; std::cout << "This string contains a single backslash \\\n"; std::cout << "6F in hex is char '\x6F'\n"; return 0; }Prints:"This is quoted text" This string contains a single backslash \ 6F in hex is char 'o' WarningEscape sequences start with a backslash (\), not a forward slash (/). If you use a forward slash by accident, it may still compile, but will not yield the desired result.Newline (\n) vs. std::endlWe cover this topic in lesson 1.5 -- Introduction to iostream: cout, cin, and endl.What’s the difference between putting symbols in single and double quotes?Text between single quotes is treated as a char literal, which represents a single character. For example, 'a' represents the character a, '+' represents the character for the plus symbol, '5' represents the character 5 (not the number 5), and '\n' represents the newline character.Text between double quotes (e.g. “Hello, world!”) is treated as a C-style string literal, which can contain multiple characters. We discuss strings in lesson 5.2 -- Literals.Best practiceSingle characters should usually be single-quoted, not double-quoted (e.g. 't' or '\n', not "t" or "\n"). One possible exception occurs when doing output, where it can be preferential to double quote everything for consistency (see lesson 1.5 -- Introduction to iostream: cout, cin, and endl).Avoid multicharacter literalsFor backwards compatibility reasons, many C++ compilers support multicharacter literals, which are char literals that contain multiple characters (e.g. '56'). If supported, these have an implementation-defined value (meaning it varies depending on the compiler). Because they are not part of the C++ standard, and their value is not strictly defined, multicharacter literals should be avoided.Best practiceAvoid multicharacter literals (e.g. '56').Multicharacter literal support sometimes causes problems for new programmers. Consider the following simple program:#include <iostream> int add(int x, int y) { return x + y; } int main() { std::cout << add(1, 2) << '/n'; return 0; }The programmer expects this program to print the value 3 and a newline. But instead, on the author’s machine, it outputs the following:312142 The issue here is that the programmer accidentally used '/n' (a multicharacter literal consisting of a forward slash and an 'n' character) instead of '\n' (the escape sequence for a newline). The program first prints 3 (the result of add(1, 2)) correctly. But then it prints the value of '/n', which on the author’s machine had the implementation-defined value 12142.WarningMake sure that your newlines are using escape sequence '\n' , not multicharacter literal '/n'.Key insightNote that if we’d double-quoted the output "/n", the program would have printed 3/n, which is still wrong, but much less confusing.Here’s another example:#include <iostream> int main() { int x { 5 }; std::cout << "The value of x is " << x << '\n'; return 0; }This program outputs exactly as you expect:The value of x is 5 But this output isn’t nearly exciting enough, so we decide to add an exclamation point before the newline:#include <iostream> int main() { int x { 5 }; std::cout << "The value of x is " << x << '!\n'; // added exclamation point return 0; }Because '!\n' is a multicharacter literal, this program now prints:The value of x is 58458 That’s probably not what you were expecting.What about the other char types, wchar_t, char8_t, char16_t, and char32_t?Much like ASCII maps the integers 0-127 to American English characters, other character encoding standards exist to map integers (of varying sizes) to characters in other languages. The most well-known mapping outside of ASCII is the Unicode standard, which maps over 144,000 integers to characters in many different languages. Because Unicode contains so many code points, a single Unicode code point needs 32-bits to represent a character (called UTF-32). However, Unicode characters can also be encoded using multiple 16-bit or 8-bit characters (called UTF-16 and UTF-8 respectively).char16_t and char32_t were added to C++11 to provide explicit support for 16-bit and 32-bit Unicode characters. These char types have the same size as std::uint_least16_t and std::uint_least32_t respectively (but are distinct types). char8_t was added in C++20 to provide support for 8-bit Unicode (UTF-8). It is a distinct type that uses the same representation as unsigned char.You won’t need to use char8_t, char16_t, or char32_t unless you’re planning on making your program Unicode compatible. wchar_t should be avoided in almost all cases (except when interfacing with the Windows API), as its size is implementation-defined.Unicode and localization are generally outside the scope of these tutorials, so we won’t cover it further. In the meantime, you should only use ASCII characters when working with characters (and strings). Using characters from other character sets may cause your characters to display incorrectly.Next lesson4.12Introduction to type conversion and static_castBack to table of contentsPrevious lesson4.10Introduction to if statements(adsbygoogle=window.adsbygoogle||[]).push({});'''
