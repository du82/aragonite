title = "11.8 — Function templates with multiple template types – Learn C++"
description = "Your email address will not be displayed"
full_description = '''11.8 — Function templates with multiple template typesAlex June 17, 2021, 5:46 pm PDT December 18, 2024(adsbygoogle=window.adsbygoogle||[]).push({});In lesson 11.6 -- Function templates, we wrote a function template to calculate the maximum of two values:#include <iostream> template <typename T> T max(T x, T y) { return (x < y) ? y : x; } int main() { std::cout << max(1, 2) << '\n'; // will instantiate max(int, int) std::cout << max(1.5, 2.5) << '\n'; // will instantiate max(double, double) return 0; }Now consider the following similar program:#include <iostream> template <typename T> T max(T x, T y) { return (x < y) ? y : x; } int main() { std::cout << max(2, 3.5) << '\n'; // compile error return 0; }You may be surprised to find that this program won’t compile. Instead, the compiler will issue a bunch of (probably crazy looking) error messages. On Visual Studio, the author got the following:Project3.cpp(11,18): error C2672: 'max': no matching overloaded function found Project3.cpp(11,28): error C2782: 'T max(T,T)': template parameter 'T' is ambiguous Project3.cpp(4): message : see declaration of 'max' Project3.cpp(11,28): message : could be 'double' Project3.cpp(11,28): message : or 'int' Project3.cpp(11,28): error C2784: 'T max(T,T)': could not deduce template argument for 'T' from 'double' Project3.cpp(4): message : see declaration of 'max' In our function call max(2, 3.5), we’re passing arguments of two different types: one int and one double. Because we’re making a function call without using angled brackets to specify an actual type, the compiler will first look to see if there is a non-template match for max(int, double). It won’t find one.Next, the compiler will see if it can find a function template match (using template argument deduction, which we covered in lesson 11.7 -- Function template instantiation). However, this will also fail, for a simple reason: T can only represent a single type. There is no type for T that would allow the compiler to instantiate function template max<T>(T, T) into a function with two different parameter types. Put another way, because both parameters in the function template are of type T, they must resolve to the same actual type.Since both a non-template match and a template match couldn’t be found, the function call fails to resolve, and we get a compile error.You might wonder why the compiler didn’t generate function max<double>(double, double) and then use numeric conversion to type convert the int argument to a double. The answer is simple: type conversion is done only when resolving function overloads, not when performing template argument deduction.This lack of type conversion is intentional for at least two reasons. First, it helps keep things simple: we either find an exact match between the function call arguments and template type parameters, or we don’t. Second, it allows us to create function templates for cases where we want to ensure that two or more parameters have the same type (as in the example above).We’ll have to find another solution. Fortunately, we can solve this problem in (at least) three ways.Use static_cast to convert the arguments to matching typesThe first solution is to put the burden on the caller to convert the arguments into matching types. For example:#include <iostream> template <typename T> T max(T x, T y) { return (x < y) ? y : x; } int main() { std::cout << max(static_cast<double>(2), 3.5) << '\n'; // convert our int to a double so we can call max(double, double) return 0; }Now that both arguments are of type double, the compiler will be able to instantiate max(double, double) that will satisfy this function call.However, this solution is awkward and hard to read.Provide an explicit type template argumentIf we had written a non-template max(double, double) function, then we would be able to call max(int, double) and let the implicit type conversion rules convert our int argument into a double so the function call could be resolved:#include <iostream> double max(double x, double y) { return (x < y) ? y : x; } int main() { std::cout << max(2, 3.5) << '\n'; // the int argument will be converted to a double return 0; }However, when the compiler is doing template argument deduction, it won’t do any type conversions. Fortunately, we don’t have to use template argument deduction if we specify an explicit type template argument to be used instead:#include <iostream> template <typename T> T max(T x, T y) { return (x < y) ? y : x; } int main() { // we've explicitly specified type double, so the compiler won't use template argument deduction std::cout << max<double>(2, 3.5) << '\n'; return 0; }In the above example, we call max<double>(2, 3.5). Because we’ve explicitly specified that T should be replaced with double, the compiler won’t use template argument deduction. Instead, it will just instantiate the function max<double>(double, double), and then type convert any mismatched arguments. Our int parameter will be implicitly converted to a double.While this is more readable than using static_cast, it would be even nicer if we didn’t even have to think about the types when making a function call to max at all.Function templates with multiple template type parametersThe root of our problem is that we’ve only defined the single template type (T) for our function template, and then specified that both parameters must be of this same type.The best way to solve this problem is to rewrite our function template in such a way that our parameters can resolve to different types. Rather than using one template type parameter T, we’ll now use two (T and U):#include <iostream> template <typename T, typename U> // We're using two template type parameters named T and U T max(T x, U y) // x can resolve to type T, and y can resolve to type U { return (x < y) ? y : x; // uh oh, we have a narrowing conversion problem here } int main() { std::cout << max(2, 3.5) << '\n'; // resolves to max<int, double> return 0; }Because we’ve defined x with template type T, and y with template type U, x and y can now resolve their types independently. When we call max(2, 3.5), T can be an int and U can be a double. The compiler will happily instantiate max<int, double>(int, double) for us.Key insightBecause T and U are independent template parameters, they resolve their types independent of each other. This means T and U can resolve to different types, or they can resolve to the same type.However, this example doesn’t work right. If you compile and run the program (with “treat warnings as errors” turned off), it will produce the following result:3 What’s going on here? How can the max of 2 and 3.5 be 3?The conditional operator (?:) requires its (non-condition) operands to be the same common type. The usual arithmetic rules (10.5 -- Arithmetic conversions) are used to determine what the common type will be, and the result of the conditional operator will also use this common type. For example, the common type of int and double is double, so when the (non-condition) operands of our conditional operator are an int and a double, the value produced by the conditional operator will be of type double. In this case, that’s the value 3.5, which is correct.However, the declared return type of our function is T. When T is an int and U is a double, the return type of the function is int. Our value 3.5 is undergoing a narrowing conversion to int value 3, resulting in a loss of data (and possibly a compiler warning).So how do we solve this? Making the return type a U instead doesn’t solve the problem, as max(3.5, 2) has U as an int and will exhibit the same issue.In such cases, return type deduction (via auto) can be useful -- we’ll let the compiler deduce what the return type should be from the return statement:#include <iostream> template <typename T, typename U> auto max(T x, U y) // ask compiler can figure out what the relevant return type is { return (x < y) ? y : x; } int main() { std::cout << max(2, 3.5) << '\n'; return 0; }This version of max now works fine with operands of different types. Just note that a function with an auto return type needs to be fully defined before it can be used (a forward declaration won’t suffice), since the compiler has to inspect the function implementation to determine the return type.For advanced readersIf we need a function that can be forward declared, we have to be explicit about the return type. Since our return type needs to be the common type of T and U, we can use std::common_type_t (discussed in lesson 10.5 -- Arithmetic conversions) to fetch the common type of T and U to use as our explicit return type:#include <iostream> #include <type_traits> // for std::common_type_t template <typename T, typename U> auto max(T x, U y) -> std::common_type_t<T, U>; // returns the common type of T and U int main() { std::cout << max(2, 3.5) << '\n'; return 0; } template <typename T, typename U> auto max(T x, U y) -> std::common_type_t<T, U> { return (x < y) ? y : x; }Abbreviated function templates C++20C++20 introduces a new use of the auto keyword: When the auto keyword is used as a parameter type in a normal function, the compiler will automatically convert the function into a function template with each auto parameter becoming an independent template type parameter. This method for creating a function template is called an abbreviated function template.For example:auto max(auto x, auto y) { return (x < y) ? y : x; }is shorthand in C++20 for the following:template <typename T, typename U> auto max(T x, U y) { return (x < y) ? y : x; }which is the same as the max function template we wrote above.In cases where you want each template type parameter to be an independent type, this form is preferred as the removal of the template parameter declaration line makes your code more concise and readable.There isn’t a concise way to use abbreviated function templates when you want more than one auto parameter to be the same type. That is, there isn’t an easy abbreviated function template for something like this:template <typename T> T max(T x, T y) // two parameters of the same type { return (x < y) ? y : x; }Best practiceFeel free to use abbreviated function templates with a single auto parameter, or where each auto parameter should be an independent type (and your language standard is set to C++20 or newer).Function templates may be overloadedJust like functions may be overloaded, function templates may also be overloaded. Such overloads can have a different number of template types and/or a different number or type of function parameters:#include <iostream> // Add two values with matching types template <typename T> auto add(T x, T y) { return x + y; } // Add two values with non-matching types // As of C++20 we could also use auto add(auto x, auto y) template <typename T, typename U> auto add(T x, U y) { return x + y; } // Add three values with any type // As of C++20 we could also use auto add(auto x, auto y, auto z) template <typename T, typename U, typename V> auto add(T x, U y, V z) { return x + y + z; } int main() { std::cout << add(1.2, 3.4) << '\n'; // instantiates and calls add<double>() std::cout << add(5.6, 7) << '\n'; // instantiates and calls add<double, int>() std::cout << add(8, 9, 10) << '\n'; // instantiates and calls add<int, int, int>() return 0; }One interesting note here is that for the call to add(1.2, 3.4), the compiler will prefer add<T>(T, T) over add<T, U>(T, U) even though both could possibly match.The rules for determining which of multiple matching function templates should be preferred are called “partial ordering of function templates”. In short, whichever function template is more restrictive/specialized will be preferred. add<T>(T, T) is the more restrictive function template in this case (since it only has one template parameter), so it is preferred.If multiple function templates can match a call and the compiler can’t determine which is more restrictive, the compiler will error with an ambiguous match.Next lesson11.9Non-type template parametersBack to table of contentsPrevious lesson11.7Function template instantiation(adsbygoogle=window.adsbygoogle||[]).push({});'''
