title = "7.7 — External linkage and variable forward declarations – Learn C++"
description = "Your email address will not be displayed"
full_description = '''7.7 — External linkage and variable forward declarationsAlex January 3, 2020, 10:40 am PST December 11, 2024(adsbygoogle=window.adsbygoogle||[]).push({});In the prior lesson (7.6 -- Internal linkage), we discussed how internal linkage limits the use of an identifier to a single file. In this lesson, we’ll explore the concept of external linkage.An identifier with external linkage can be seen and used both from the file in which it is defined, and from other code files (via a forward declaration). In this sense, identifiers with external linkage are truly “global” in that they can be used anywhere in your program!Key insightIdentifiers with external linkage are visible to the linker. This allows the linker to do two things:Connect an identifier used in one translation unit with the appropriate definition in another translation unit.Deduplicate inline identifiers so one canonical definition remains. We discuss inline variables and functions in lesson 7.9 -- Inline functions and variables.Functions have external linkage by defaultIn lesson 2.8 -- Programs with multiple code files, you learned that you can call a function defined in one file from another file. This is because functions have external linkage by default.In order to call a function defined in another file, you must place a forward declaration for the function in any other files wishing to use the function. The forward declaration tells the compiler about the existence of the function, and the linker connects the function calls to the actual function definition.Here’s an example:a.cpp:#include <iostream> void sayHi() // this function has external linkage, and can be seen by other files { std::cout << "Hi!\n"; }main.cpp:void sayHi(); // forward declaration for function sayHi, makes sayHi accessible in this file int main() { sayHi(); // call to function defined in another file, linker will connect this call to the function definition return 0; }The above program prints:Hi! In the above example, the forward declaration of function sayHi() in main.cpp allows main.cpp to access the sayHi() function defined in a.cpp. The forward declaration satisfies the compiler, and the linker is able to link the function call to the function definition.If function sayHi() had internal linkage instead, the linker would not be able to connect the function call to the function definition, and a linker error would result.Global variables with external linkageGlobal variables with external linkage are sometimes called external variables. To make a global variable external (and thus accessible by other files), we can use the extern keyword to do so:int g_x { 2 }; // non-constant globals are external by default (no need to use extern) extern const int g_y { 3 }; // const globals can be defined as extern, making them external extern constexpr int g_z { 3 }; // constexpr globals can be defined as extern, making them external (but this is pretty useless, see the warning in the next section) int main() { return 0; }Non-const global variables are external by default, so we don’t need to mark them as extern.Variable forward declarations via the extern keywordTo actually use an external global variable that has been defined in another file, you also must place a forward declaration for the global variable in any other files wishing to use the variable. For variables, creating a forward declaration is also done via the extern keyword (with no initialization value).Here is an example of using variable forward declarations:main.cpp:#include <iostream> extern int g_x; // this extern is a forward declaration of a variable named g_x that is defined somewhere else extern const int g_y; // this extern is a forward declaration of a const variable named g_y that is defined somewhere else int main() { std::cout << g_x << ' ' << g_y << '\n'; // prints 2 3 return 0; }Here’s the definitions for those variables:a.cpp:// global variable definitions int g_x { 2 }; // non-constant globals have external linkage by default extern const int g_y { 3 }; // this extern gives g_y external linkageIn the above example, a.cpp and main.cpp both reference the same global variable named g_x. So even though g_x is defined and initialized in a.cpp, we are able to use its value in main.cpp via the forward declaration of g_x.Note that the extern keyword has different meanings in different contexts. In some contexts, extern means “give this variable external linkage”. In other contexts, extern means “this is a forward declaration for an external variable that is defined somewhere else”. Yes, this is confusing, so we summarize all of these usages in lesson 7.12 -- Scope, duration, and linkage summary.WarningIf you want to define an uninitialized non-const global variable, do not use the extern keyword, otherwise C++ will think you’re trying to make a forward declaration for the variable.WarningAlthough constexpr variables can be given external linkage via the extern keyword, they can not be forward declared as constexpr. This is because the compiler needs to know the value of the constexpr variable (at compile time). If that value is defined in some other file, the compiler has no visibility on what value was defined in that other file.However, you can forward declare a constexpr variable as const, which the compiler will treat as a runtime const. This isn’t particularly useful.Note that function forward declarations don’t need the extern keyword -- the compiler is able to tell whether you’re defining a new function or making a forward declaration based on whether you supply a function body or not. Variables forward declarations do need the extern keyword to help differentiate uninitialized variables definitions from variable forward declarations (they look otherwise identical):// non-constant int g_x; // variable definition (no initializer) int g_x { 1 }; // variable definition (w/ initializer) extern int g_x; // forward declaration (no initializer) // constant extern const int g_y { 1 }; // variable definition (const requires initializers) extern const int g_y; // forward declaration (no initializer)Avoid using extern on a non-const global variable with an initializerThe following two lines are semantically equivalent:int g_x { 1 }; // extern by default extern int g_x { 1 }; // explicitly extern (may cause compiler warning)However, your compiler may issue a warning about the latter statement, even though it is technically valid.Remember when we said compilers have the leeway to issue a diagnostic for things they find suspicious? This is one of those cases. Conventionally, extern is applied to a non-const variable when we want a forward declaration. However, adding an initializer makes the statement a definition instead. The compiler is telling you that something seems amiss. To correct it, either remove the initializer (if you intended a forward declaration) or remove the extern (if you intended a definition).Best practiceOnly use extern for global variable forward declarations or const global variable definitions.Do not use extern for non-const global variable definitions (they are implicitly extern).Quick summary// Global variable forward declarations (extern w/ no initializer): extern int g_y; // forward declaration for non-constant global variable extern const int g_y; // forward declaration for const global variable extern constexpr int g_y; // not allowed: constexpr variables can't be forward declared // External global variable definitions (no extern) int g_x; // defines non-initialized external global variable (zero initialized by default) int g_x { 1 }; // defines initialized external global variable // External const global variable definitions (extern w/ initializer) extern const int g_x { 2 }; // defines initialized const external global variable extern constexpr int g_x { 3 }; // defines initialized constexpr external global variableWe provide a comprehensive summary in lesson 7.12 -- Scope, duration, and linkage summary.Quiz timeQuestion #1What’s the difference between a variable’s scope, duration, and linkage? What kind of scope, duration, and linkage do global variables have?Show SolutionScope determines where a variable is accessible. Duration determines when a variable is created and destroyed. Linkage determines whether the variable can be exported to another file or not.Global variables have global scope (a.k.a. file scope), which means they can be accessed from the point of declaration to the end of the file in which they are declared.Global variables have static duration, which means they are created when the program is started, and destroyed when it ends.Global variables can have either internal or external linkage, via the static and extern keywords respectively.Next lesson7.8Why (non-const) global variables are evilBack to table of contentsPrevious lesson7.6Internal linkage(adsbygoogle=window.adsbygoogle||[]).push({});'''
