title = "11.7 — Function template instantiation – Learn C++"
description = "Your email address will not be displayed"
full_description = '''11.7 — Function template instantiationAlex June 17, 2021, 5:50 pm PDT August 21, 2024(adsbygoogle=window.adsbygoogle||[]).push({});In the previous lesson (11.6 -- Function templates), we introduced function templates, and converted a normal max() function into a max<T> function template:template <typename T> T max(T x, T y) { return (x < y) ? y : x; }In this lesson, we’ll focus on how function templates are used.Using a function templateFunction templates are not actually functions -- their code isn’t compiled or executed directly. Instead, function templates have one job: to generate functions (that are compiled and executed).To use our max<T> function template, we can make a function call with the following syntax:max<actual_type>(arg1, arg2); // actual_type is some actual type, like int or double This looks a lot like a normal function call -- the primary difference is the addition of the type in angled brackets (called a template argument), which specifies the actual type that will be used in place of template type T.Let’s take a look at this in a simple example:#include <iostream> template <typename T> T max(T x, T y) { return (x < y) ? y : x; } int main() { std::cout << max<int>(1, 2) << '\n'; // instantiates and calls function max<int>(int, int) return 0; }When the compiler encounters the function call max<int>(1, 2), it will determine that a function definition for max<int>(int, int) does not already exist. Consequently, the compiler will implicitly use our max<T> function template to create one.The process of creating functions (with specific types) from function templates (with template types) is called function template instantiation (or instantiation for short). When a function is instantiated due to a function call, it’s called implicit instantiation. A function that is instantiated from a template is technically called a specialization, but in common language is often called a function instance. The template from which a specialization is produced is called a primary template. Function instances are normal functions in all regards.NomenclatureThe term “specialization” is more often used to refer to explicit specialization, which allows us to explicitly define a specialization (rather than have it implicitly instantiated from the primary template). We cover explicit specialization in lesson 26.3 -- Function template specialization.The process for instantiating a function is simple: the compiler essentially clones the primary template and replaces the template type (T) with the actual type we’ve specified (int).So when we call max<int>(1, 2), the function specialization that gets instantiated looks something like this:template<> // ignore this for now int max<int>(int x, int y) // the generated function max<int>(int, int) { return (x < y) ? y : x; }Here’s the same example as above, showing what the compiler actually compiles after all instantiations are done:#include <iostream> // a declaration for our function template (we don't need the definition any more) template <typename T> T max(T x, T y); template<> int max<int>(int x, int y) // the generated function max<int>(int, int) { return (x < y) ? y : x; } int main() { std::cout << max<int>(1, 2) << '\n'; // instantiates and calls function max<int>(int, int) return 0; }You can compile this yourself and see that it works. A function template is only instantiated the first time a function call is made in each translation unit. Further calls to the function are routed to the already instantiated function.Conversely, if no function call is made to a function template, the function template won’t be instantiated in that translation unit.Let’s do another example:#include <iostream> template <typename T> T max(T x, T y) // function template for max(T, T) { return (x < y) ? y : x; } int main() { std::cout << max<int>(1, 2) << '\n'; // instantiates and calls function max<int>(int, int) std::cout << max<int>(4, 3) << '\n'; // calls already instantiated function max<int>(int, int) std::cout << max<double>(1, 2) << '\n'; // instantiates and calls function max<double>(double, double) return 0; }This works similarly to the previous example, but our function template will be used to generate two functions this time: one time replacing T with int, and the other time replacing T with double. After all instantiations, the program will look something like this:#include <iostream> // a declaration for our function template (we don't need the definition any more) template <typename T> T max(T x, T y); template<> int max<int>(int x, int y) // the generated function max<int>(int, int) { return (x < y) ? y : x; } template<> double max<double>(double x, double y) // the generated function max<double>(double, double) { return (x < y) ? y : x; } int main() { std::cout << max<int>(1, 2) << '\n'; // instantiates and calls function max<int>(int, int) std::cout << max<int>(4, 3) << '\n'; // calls already instantiated function max<int>(int, int) std::cout << max<double>(1, 2) << '\n'; // instantiates and calls function max<double>(double, double) return 0; }One additional thing to note here: when we instantiate max<double>, the instantiated function has parameters of type double. Because we’ve provided int arguments, those arguments will be implicitly converted to double.Template argument deductionIn most cases, the actual types we want to use for instantiation will match the type of our function parameters. For example:std::cout << max<int>(1, 2) << '\n'; // specifying we want to call max<int>In this function call, we’ve specified that we want to replace T with int, but we’re also calling the function with int arguments.In cases where the type of the arguments match the actual type we want, we do not need to specify the actual type -- instead, we can use template argument deduction to have the compiler deduce the actual type that should be used from the argument types in the function call.For example, instead of making a function call like this:std::cout << max<int>(1, 2) << '\n'; // specifying we want to call max<int>We can do one of these instead:std::cout << max<>(1, 2) << '\n'; std::cout << max(1, 2) << '\n';In either case, the compiler will see that we haven’t provided an actual type, so it will attempt to deduce an actual type from the function arguments that will allow it to generate a max() function where all template parameters match the type of the provided arguments. In this example, the compiler will deduce that using function template max<T> with actual type int allows it to instantiate function max<int>(int, int), so that the type of both function parameters (int) matches the type of the provided arguments (int).The difference between the two cases has to do with how the compiler resolves the function call from a set of overloaded functions. In the top case (with the empty angled brackets), the compiler will only consider max<int> template function overloads when determining which overloaded function to call. In the bottom case (with no angled brackets), the compiler will consider both max<int> template function overloads and max non-template function overloads. When the bottom case results in both a template function and a non-template function that are equally viable, the non-template function will be preferred.Key insightThe normal function call syntax will prefer a non-template function over an equally viable function instantiated from a template.For example:#include <iostream> template <typename T> T max(T x, T y) { std::cout << "called max<int>(int, int)\n"; return (x < y) ? y : x; } int max(int x, int y) { std::cout << "called max(int, int)\n"; return (x < y) ? y : x; } int main() { std::cout << max<int>(1, 2) << '\n'; // calls max<int>(int, int) std::cout << max<>(1, 2) << '\n'; // deduces max<int>(int, int) (non-template functions not considered) std::cout << max(1, 2) << '\n'; // calls max(int, int) return 0; }Note how the syntax in the bottom case looks identical to a normal function call! In most cases, this normal function call syntax will be the one we use to call functions instantiated from a function template.There are a few reasons for this:The syntax is more concise.It’s rare that we’ll have both a matching non-template function and a function template.If we do have a matching non-template function and a matching function template, we will usually prefer the non-template function to be called.That last point may be non-obvious. A function template has an implementation that works for multiple types -- but as a result, it must be generic. A non-template function only handles a specific combination of types. It can have an implementation that is more optimized or more specialized for those specific types than the function template version. For example:#include <iostream> // This function template can handle many types, so its implementation is generic template <typename T> void print(T x) { std::cout << x; // print T however it normally prints } // This function only needs to consider how to print a bool, so it can specialize how it handles // printing of a bool void print(bool x) { std::cout << std::boolalpha << x; // print bool as true or false, not 1 or 0 } int main() { print<bool>(true); // calls print<bool>(bool) -- prints 1 std::cout << '\n'; print<>(true); // deduces print<bool>(bool) (non-template functions not considered) -- prints 1 std::cout << '\n'; print(true); // calls print(bool) -- prints true std::cout << '\n'; return 0; }Best practiceFavor the normal function call syntax when making calls to a function instantiated from a function template (unless you need the function template version to be preferred over a matching non-template function).Function templates with non-template parametersIt’s possible to create function templates that have both template parameters and non-template parameters. The type template parameters can be matched to any type, and the non-template parameters work like the parameters of normal functions.For example:// T is a type template parameter // double is a non-template parameter // We don't need to provide names for these parameters since they aren't used template <typename T> int someFcn(T, double) { return 5; } int main() { someFcn(1, 3.4); // matches someFcn(int, double) someFcn(1, 3.4f); // matches someFcn(int, double) -- the float is promoted to a double someFcn(1.2, 3.4); // matches someFcn(double, double) someFcn(1.2f, 3.4); // matches someFcn(float, double) someFcn(1.2f, 3.4f); // matches someFcn(float, double) -- the float is promoted to a double return 0; }This function template has a templated first parameter, but the second parameter is fixed with type double. Note that the return type can also be any type. In this case, our function will always return an int value.Instantiated functions may not always compileConsider the following program:#include <iostream> template <typename T> T addOne(T x) { return x + 1; } int main() { std::cout << addOne(1) << '\n'; std::cout << addOne(2.3) << '\n'; return 0; }The compiler will effectively compile and execute this:#include <iostream> template <typename T> T addOne(T x); template<> int addOne<int>(int x) { return x + 1; } template<> double addOne<double>(double x) { return x + 1; } int main() { std::cout << addOne(1) << '\n'; // calls addOne<int>(int) std::cout << addOne(2.3) << '\n'; // calls addOne<double>(double) return 0; }which will produce the result:2 3.3 But what if we try something like this?#include <iostream> #include <string> template <typename T> T addOne(T x) { return x + 1; } int main() { std::string hello { "Hello, world!" }; std::cout << addOne(hello) << '\n'; return 0; }When the compiler tries to resolve addOne(hello) it won’t find a non-template function match for addOne(std::string), but it will find our function template for addOne(T), and determine that it can generate an addOne(std::string) function from it. Thus, the compiler will generate and compile this:#include <iostream> #include <string> template <typename T> T addOne(T x); template<> std::string addOne<std::string>(std::string x) { return x + 1; } int main() { std::string hello{ "Hello, world!" }; std::cout << addOne(hello) << '\n'; return 0; }However, this will generate a compile error, because x + 1 doesn’t make sense when x is a std::string. The obvious solution here is simply not to call addOne() with an argument of type std::string.Instantiated functions may not always make sense semanticallyThe compiler will successfully compile an instantiated function template as long as it makes sense syntactically. However, the compiler does not have any way to check that such a function actually makes sense semantically.For example:#include <iostream> template <typename T> T addOne(T x) { return x + 1; } int main() { std::cout << addOne("Hello, world!") << '\n'; return 0; }In this example, we’re calling addOne() on a C-style string literal. What does that actually mean semantically? Who knows!Perhaps surprisingly, because C++ syntactically allows addition of an integer value to a string literal (we cover this in future lesson 17.9 -- Pointer arithmetic and subscripting), the above example compiles, and produces the following result:ello, world! WarningThe compiler will instantiate and compile function templates that do not make sense semantically as long as they are syntactically valid. It is your responsibility to make sure you are calling such function templates with arguments that make sense.For advanced readersWe can tell the compiler that instantiation of function templates with certain arguments should be disallowed. This is done by using function template specialization, which allow us to overload a function template for a specific set of template arguments, along with = delete, which tells the compiler that any use of the function should emit a compilation error.#include <iostream> #include <string> template <typename T> T addOne(T x) { return x + 1; } // Use function template specialization to tell the compiler that addOne(const char*) should emit a compilation error // const char* will match a string literal template <> const char* addOne(const char* x) = delete; int main() { std::cout << addOne("Hello, world!") << '\n'; // compile error return 0; }We cover function template specialization in lesson 26.3 -- Function template specialization.Function templates and default arguments for non-template parametersJust like normal functions, function templates can have default arguments for non-template parameters. Each function instantiated from the template will use the same default argument.For example:#include <iostream> template <typename T> void print(T val, int times=1) { while (times--) { std::cout << val; } } int main() { print(5); // print 5 1 time print('a', 3); // print 'a' 3 times return 0; }This prints:5aaa Beware function templates with modifiable static local variablesIn lesson 7.11 -- Static local variables, we discussed static local variables, which are local va'''
