full_description = "The C++ TutorialLearnCpp.com is a free website devoted to teaching you how to program in modern C++. The lessons on this site will walk you through all the steps needed to write, compile, and debug your C++ programs. No prior programming experience is necessary, but programmers of all levels will benefit from our best practices, tips, and insights.Becoming an expert won’t happen overnight, but with a bit of patience, you’ll get there. And LearnCpp.com will show you the way.(adsbygoogle=window.adsbygoogle||[]).push({});Chapter 0Introduction / Getting Started0.1Introduction to these tutorials0.2Introduction to programs and programming languages0.3Introduction to C/C++0.4Introduction to C++ development0.5Introduction to the compiler, linker, and libraries0.6Installing an Integrated Development Environment (IDE)0.7Compiling your first program0.8A few common C++ problems0.9Configuring your compiler: Build configurations0.10Configuring your compiler: Compiler extensions0.11Configuring your compiler: Warning and error levels0.12Configuring your compiler: Choosing a language standard0.13What language standard is my compiler using?Chapter 1C++ Basics1.1Statements and the structure of a program1.2Comments1.3Introduction to objects and variables1.4Variable assignment and initialization1.5Introduction to iostream: cout, cin, and endl1.6Uninitialized variables and undefined behavior1.7Keywords and naming identifiers1.8Whitespace and basic formatting1.9Introduction to literals and operators1.10Introduction to expressions1.11Developing your first program1.xChapter 1 summary and quiz(adsbygoogle=window.adsbygoogle||[]).push({});Chapter 2C++ Basics: Functions and Files2.1Introduction to functions2.2Function return values (value-returning functions)2.3Void functions (non-value returning functions)2.4Introduction to function parameters and arguments2.5Introduction to local scope2.6Why functions are useful, and how to use them effectively2.7Forward declarations and 