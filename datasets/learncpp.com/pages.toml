full_description = '''14.12 — Delegating constructorsAlex September 7, 2007, 9:22 am PDT January 21, 2025(adsbygoogle=window.adsbygoogle||[]).push({});Whenever possible, we want to reduce redundant code (following the DRY principle -- Don’t Repeat Yourself).Consider the following functions:void A() { // statements that do task A } void B() { // statements that do task A // statements that do task B }Both functions have a set of statements that do exactly the same thing (task A). In such a case, we can refactor like this:void A() { // statements that do task A } void B() { A(); // statements that do task B }In that way, we’ve removed redundant code that existed in functions A() and B(). This makes our code easier to maintain, as changes only need to be made in one place.When a class contains multiple constructors, it’s extremely common for the code in each constructor to be similar if not identical, with lots of repetition. We’d similarly like to remove constructor redundancy where possible.Consider the following example:#include <iostream> #include <string> #include <string_view> class Employee { private: std::string m_name { "???" }; int m_id { 0 }; bool m_isManager { false }; public: Employee(std::string_view name, int id) // Employees must have a name and an id : m_name{ name }, m_id { id } { std::cout << "Employee " << m_name << " created\n"; } Employee(std::string_view name, int id, bool isManager) // They can optionally be a manager : m_name{ name }, m_id{ id }, m_isManager { isManager } { std::cout << "Employee " << m_name << " created\n"; } }; int main() { Employee e1{ "James", 7 }; Employee e2{ "Dave", 42, true }; }The body of each constructor has the exact same print statement.Author’s noteIt’s generally not a good idea to have a constructor print something (except for debugging purposes), as this means you can’t create an object using that constructor in cases where you do not want to print something. We’re doing it in this example to help illustrate what’s happening.Constructors are allowed to call other functions, including other member functions of the class. So we could refactor like this:#include <iostream> #include <string> #include <string_view> class Employee { private: std::string m_name { "???" }; int m_id{ 0 }; bool m_isManager { false }; void printCreated() const // our new helper function { std::cout << "Employee " << m_name << " created\n"; } public: Employee(std::string_view name, int id) : m_name{ name }, m_id { id } { printCreated(); // we call it here } Employee(std::string_view name, int id, bool isManager) : m_name{ name }, m_id{ id }, m_isManager { isManager } { printCreated(); // and here } }; int main() { Employee e1{ "James", 7 }; Employee e2{ "Dave", 42, true }; }While this is better than the prior version (as the redundant statement has been replaced by a redundant function call), it requires introduction of a new function. And our two constructors are also both initializing m_name and m_id. Ideally we’d remove this redundancy too.Can we do better? We can. But this is where many new programmers run into trouble.Calling a constructor in the body of a function creates a temporary objectAnalogous to how we had function B() call function A() in the example above, the obvious solution seems like it would be to call the Employee(std::string_view, int) constructor from the body of Employee(std::string_view, int, bool) in order to initialize m_name, m_id, and print the statement. Here’s what that looks like:#include <iostream> #include <string> #include <string_view> class Employee { private: std::string m_name { "???" }; int m_id { 0 }; bool m_isManager { false }; public: Employee(std::string_view name, int id) : m_name{ name }, m_id { id } // this constructor initializes name and id { std::cout << "Employee " << m_name << " created\n"; // our print statement is back here } Employee(std::string_view name, int id, bool isManager) : m_isManager { isManager } // this constructor initializes m_isManager { // Call Employee(std::string_view, int) to initialize m_name and m_id Employee(name, id); // this doesn't work as expected! } const std::string& getName() const { return m_name; } }; int main() { Employee e2{ "Dave", 42, true }; std::cout << "e2 has name: " << e2.getName() << "\n"; // print e2.m_name }But this doesn’t work correctly, as the program outputs the following:Employee Dave created e2 has name: ???Even though Employee Dave created printed, after e2 finished construction, e2.m_name still appears to be set to its initial value of "???". How is that possible?We were expecting Employee(name, id) to call the constructor in order to continue initialization of the current implicit object (e2). But initialization of a class object is finished once the member initializer list has finished executing. By the time we begin executing the constructor’s body, it’s too late to do more initialization.When called from the body of a function, what looks like a function call to a constructor usually creates and direct-initializes a temporary object (in one other case, you’ll get a compile error instead). In our example above, Employee(name, id); creates a temporary (unnamed) Employee object. This temporary object is the one whose m_name is set to Dave, and is the one that prints Employee Dave created. Then the temporary is destroyed. e2 never has its m_name or m_id changed from the default values.Best practiceConstructors should not be called directly from the body of another function. Doing so will either result in a compilation error, or will direct-initialize a temporary object.If you do want a temporary object, prefer list-initialization (which makes it clear you are intending to create an object).So if we can’t call a constructor from the body of another constructor, then how do we solve this issue?Delegating constructorsConstructors are allowed to delegate (transfer responsibility for) initialization to another constructor from the same class type. This process is sometimes called constructor chaining and such constructors are called delegating constructors.To make one constructor delegate initialization to another constructor, simply call the constructor in the member initializer list:#include <iostream> #include <string> #include <string_view> class Employee { private: std::string m_name { "???" }; int m_id { 0 }; public: Employee(std::string_view name) : Employee{ name, 0 } // delegate initialization to Employee(std::string_view, int) constructor { } Employee(std::string_view name, int id) : m_name{ name }, m_id { id } // actually initializes the members { std::cout << "Employee " << m_name << " created\n"; } }; int main() { Employee e1{ "James" }; Employee e2{ "Dave", 42 }; }When e1 { "James" } is initialized, matching constructor Employee(std::string_view) is called with parameter name set to "James". The member initializer list of this constructor delegates initialization to other constructor, so Employee(std::string_view, int) is then called. The value of name ("James") is passed as the first argument, and literal 0 is passed as the second argument. The member initializer list of the delegated constructor then initializes the members. The body of the delegated constructor then runs. Then control returns to the initial constructor, whose (empty) body runs. Finally, control returns to the caller.The downside of this method is that it sometimes requires duplication of initialization values. In the delegation to the Employee(std::string_view, int) constructor, we need an initialization value for the int parameter. We had to hardcode literal 0, as there is no way to reference the default member initializer.A few additional notes about delegating constructors. First, a constructor that delegates to another constructor is not allowed to do any member initialization itself. So your constructors can delegate or initialize, but not both.As an aside…Note that we had Employee(std::string_view) (the constructor with less parameters) delegate to Employee(std::string_view name, int id) (the constructor with more parameters). It is common to have the constructor with fewer parameters delegate to the constructor with more parameters.If we had instead chosen to have Employee(std::string_view name, int id) delegate to Employee(std::string_view), then that would have left us unable to initialize m_id using id, as a constructor can only delegate or initialize, not both.Second, it’s possible for one constructor to delegate to another constructor, which delegates back to the first constructor. This forms an infinite loop, and will cause your program to run out of stack space and crash. You can avoid this by ensuring all of your constructors resolve to a non-delegating constructor.Best practiceIf you have multiple constructors, consider whether you can use delegating constructors to reduce duplicate code.Reducing constructors using default argumentsDefault values can also sometimes be used to reduce multiple constructors into fewer constructors. For example, by putting a default value on our id parameter, we can create a single Employee constructor that requires a name argument but will optionally accept an id argument:#include <iostream> #include <string> #include <string_view> class Employee { private: std::string m_name{}; int m_id{ 0 }; // default member initializer public: Employee(std::string_view name, int id = 0) // default argument for id : m_name{ name }, m_id{ id } { std::cout << "Employee " << m_name << " created\n"; } }; int main() { Employee e1{ "James" }; Employee e2{ "Dave", 42 }; }Since default values must be attached to the rightmost parameters in a function call, a good practice when defining classes is to define members for which a user must provide initialization values for first (and then make those the leftmost parameters of the constructor). Members for which the user can optionally provide (because the default values are acceptable) should be defined second (and then make those the rightmost parameters of the constructor).Best practiceMembers for which the user must provide initialization values should be defined first (and as the leftmost parameters of the constructor). Members for which the user can optionally provide initialization values (because the default values are acceptable) should be defined second (and as the rightmost parameters of the constructor).Note that this method also requires duplication of the default initialization value for m_id (‘0’): once as a default member initializer, and once as a default argument.A conundrum: Redundant constructors vs redundant default valuesIn the above examples, we used delegating constructors and then default arguments to reduce constructor redundancy. But both of these methods required us to duplicate initialization values for our members in various places. Unfortunately, there is currently no way to specify that a delegating constructor or default argument should use the default member initializer value.There are various opinions about whether it is better to have fewer constructors (with duplication of initialization values) or more constructors (with no duplication of initialization values). Our opinion is that it’s usually more straightforward to have fewer constructors, even if it results in duplication of initialization values.For advanced readersWhen we have an initialization value that is used in multiple places (e.g. as a default member initializer and a default argument for a constructor parameter), we can define a named constant and use that wherever our initialization value is needed. This allows the initialization value to be defined in one place.Although you could use a constexpr global variable for this, a better option is to use a static constexpr member inside the class:#include <iostream> #include <string> #include <string_view> class Employee { private: static constexpr int default_id { 0 }; // define a named constant with our desired initialization value std::string m_name {}; int m_id { default_id }; // we can use it here public: Employee(std::string_view name, int id = default_id) // and we can use it here : m_name { name }, m_id { id } { std::cout << "Employee " << m_name << " created\n"; } }; int main() { Employee e1 { "James" }; Employee e2 { "Dave", 42 }; }Use of the static keyword in this context allows us to have a single default_id member that is shared by all Employee objects. Without the static, each Employee object would have its own independent default_id member (which would work, but be a waste of memory).The downside of this approach is that each additional named constant adds another name that must be understood, making your class a little more cluttered and complex. Whether this is worth it depends on how many of such constants are required, and in how many places the initialization values are needed.We cover static data members in lesson 15.6 -- Static member variables.Quiz timeQuestion #1Write a class named Ball. Ball should have two private member variables, one to hold a color (default value: black), and one to hold a radius (default value: 10.0). Add 4 constructors, one to handle each case below:int main() { Ball def{}; Ball blue{ "blue" }; Ball twenty{ 20.0 }; Ball blueTwenty{ "blue", 20.0 }; return 0; }The program should produce the following result:Ball(black, 10) Ball(blue, 10) Ball(black, 20) Ball(blue, 20) Show Solution#include <iostream> #include <string> #include <string_view> class Ball { private: std::string m_color{ "black" }; double m_radius{ 10.0 }; public: // Default constructor (color and radius will use default value) Ball() { print(); } // Constructor with only radius parameter (color will use default value) Ball(double radius) : m_radius{ radius } { print(); } // Constructor with only color parameter (radius will use default value) Ball(std::string_view color) : m_color{ color } { print(); } // Constructor with both color and radius parameters Ball(std::string_view color, double radius) : m_color{ color } , m_radius{ radius } { print(); } void print() const { std::cout << "Ball(" << m_color << ", " << m_radius << ")\n"; } }; int main() { Ball def{}; Ball blue{ "blue" }; Ball twenty{ 20.0 }; Ball blueTwenty{ "blue", 20.0 }; return 0; }Question #2Reduce the number of constructors in the above program by using default arguments and delegating constructors.Show Solution#include <iostream> #include <string> #include <string_view> class Ball { private: std::string m_color{ "black" }; double m_radius{ 10.0 }; public: // Handles Ball(radius) Ball(double radius) : Ball{ "black", radius } // delegate to the other constructor { // We don't need to call print() here since it will be called by // the constructor we delegate to } // Handles Ball(color, radius), Ball(color), and Ball() Ball(std::string_view color="black", double radius=10.0) : m_color{ color } , m_radius{ radius } { print(); } void print() const { std::cout << "Ball(" << m_color << ", " << m_radius << ")\n"; } }; int main() { Ball def{}; Ba'''
