title = "Get OmniFocus Back on Track  - Learn OmniFocus"
description = "Complete the Getting Back on Track with OmniFocus 4 course, then join us for this interactive workshop to put what you’ve learned into practice."
full_description = '''@media (max-width:767px){.event-sidebar{display:none}}.tribe-events-content a{border-bottom:1px solid var(--color-content-link)!important}.tribe-events-single>.tribe_events{overflow:visible!important}.single-tribe_events .tribe-events-c-subscribe-dropdown .tribe-events-c-subscribe-dropdown__list-item,.tribe-events .tribe-events-c-subscribe-dropdown .tribe-events-c-subscribe-dropdown__list-item{margin-bottom:0!important}#tribe-events-footer{padding:0!important}<img width="64" height="64" class="tribe-events-spinner-medium" src="https://learnomnifocus.com/wp-content/plugins/the-events-calendar/src/resources/images/tribe-loading.gif" alt="Loading Events" /> « All Events Get OmniFocus Back on Track February 27, 2025 | 1:00 pm – 2:30 pm PST Complete the Getting Back on Track with OmniFocus 4 course, then join us for this interactive workshop to put what you’ve learned into practice.Perhaps you started using OmniFocus with great enthusiasm, but somewhere along the way, your excitement has waned. OmniFocus may have begun to feel like another obligation to fulfill rather than a powerful ally that helps you do your best work.Participate in this interactive workshop and be guided through making OmniFocus useful and welcoming. During this workshop, you’ll:Mind Sweep – Be guided through a “mind sweep” to surface thoughts in your head and identify important tasks missing from OmniFocus. OmniFocus Inbox – Process your OmniFocus inbox, identifying things that belong in OmniFocus and those that are best kept elsewhere. Projects – Review your projects and determine whether your system needs minor tweaks or a major overhaul. Tags – Review your OmniFocus tags and streamline your system by adding, removing and organizing tags. Due Dates – Review your use of due dates, identifying legitimately due tasks and those assigned arbitrarily. System Maintenance – Create System Maintenance projects and actions to help you keep OmniFocus on the rails.Please complete the Getting Back on Track with OmniFocus 4 course before attending this workshop. We’ll be building on the material covered in this course.Registration in this session is limited to 20 participants to allow maximum interactivity. When you register, you’ll be asked to agree to participate with your video camera turned on and to keep what other participants share confidential. Sessions won’t be recorded to help protect participants’ privacy.When you register for a session, you’ll be sent a Zoom link by email and prompted to add the session to your calendar. Please plan to arrive at least a couple of minutes before the start time to make sure that your camera and microphone are working. You’re welcome to join up to ten minutes early and stick around for ten minutes after for some social time. Event Navigation « Virtual Coworking Office Hours » Join Learn OmniFocus You need to be an active Learn OmniFocus Member to register for this live session. Not a member yet? Join here Membership Benefits A membership gives you full access to all of our content and allows you to join sessions that centre around themes and workflow guests. You’ll also be able to participate in Learn OmniFocus Office Hours, highly interactive video-conferenced sessions in small groups (maximum 10 people per session). @media(max-width:766px){ #y11e{height:0!important}} Join Learn OmniFocus You need to be an active Learn OmniFocus Member to register for this live session. Not a member yet? Join here Membership Benefits A membership gives you full access to all of our content and allows you to join sessions that centre around themes and workflow guests. You’ll also be able to participate in Learn OmniFocus Office Hours, highly interactive video-conferenced sessions in small groups (maximum 10 people per session). {"slug":"widget-events-list","prev_url":"","next_url":"https:\/\/learnomnifocus.com\/?post_type=tribe_events&eventDisplay=widget-events-list&paged=2","view_class":"Tribe\\Events\\Views\\V2\\Views\\Widg