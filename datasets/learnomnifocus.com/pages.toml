description = "Learn OmniFocus Office Hours allows you to discuss and ask questions about your OmniFocus setup and workflows in a video-conferenced virtual conference room ..."
full_description = '''@media (max-width:767px){.event-sidebar{display:none}}.tribe-events-content a{border-bottom:1px solid var(--color-content-link)!important}.tribe-events-single>.tribe_events{overflow:visible!important}.single-tribe_events .tribe-events-c-subscribe-dropdown .tribe-events-c-subscribe-dropdown__list-item,.tribe-events .tribe-events-c-subscribe-dropdown .tribe-events-c-subscribe-dropdown__list-item{margin-bottom:0!important}#tribe-events-footer{padding:0!important}<img width="64" height="64" class="tribe-events-spinner-medium" src="https://learnomnifocus.com/wp-content/plugins/the-events-calendar/src/resources/images/tribe-loading.gif" alt="Loading Events" /> « All Events Office Hours March 5, 2025 | 9:00 am – 10:00 am PST Office Hours gives you the opportunity to discuss and ask questions about your OmniFocus setup and workflows in a video-conferenced virtual conference room. Learn OmniFocus Founder Tim Stringer will facilitate this session.Registration in this session is limited to 10 participants to allow for maximum interactivity. When you register, you’ll be asked to agree to participate with your video camera turned on and to keep what other participants share confidential. Sessions won’t be recorded to help protect participants’ privacy.You’re welcome to discuss and ask questions about anything related to OmniFocus and complementary third-party apps.If you register and discover that you cannot attend, please let us know ASAP so we can make your spot available to another Learn OmniFocus Member. Event Navigation « Get OmniFocus Back on Track Virtual Coworking » Join Learn OmniFocus You need to be an active Learn OmniFocus Member to register for this live session. Not a member yet? Join here Membership Benefits A membership gives you full access to all of our content and allows you to join sessions that centre around themes and workflow guests. You’ll also be able to participate in Learn OmniFocus Office Hours, highly interactive video-conferenced sessions in small groups (maximum 10 people per session). @media(max-width:766px){ #e8e9{height:0!important}} Join Learn OmniFocus You need to be an active Learn OmniFocus Member to register for this live session. Not a member yet? Join here Membership Benefits A membership gives you full access to all of our content and allows you to join sessions that centre around themes and workflow guests. You’ll also be able to participate in Learn OmniFocus Office Hours, highly interactive video-conferenced sessions in small groups (maximum 10 people per session). {"slug":"widget-events-list","prev_url":"","next_url":"https:\/\/learnomnifocus.com\/?post_type=tribe_events&eventDisplay=widget-events-list&paged=2","view_class":"Tribe\\Events\\Views\\V2\\Views\\Widgets\\Widget_List_View","view_slug":"widget-events-list","view_label":"View","view":null,"should_manage_url":true,"id":null,"alias-slugs":null,"title":"Office Hours - Learn OmniFocus","limit":"3","no_upcoming_events":true,"featured_events_only":false,"jsonld_enable":false,"tribe_is_list_widget":false,"admin_fields":{"title":{"label":"Title:","type":"text","classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-title","name":"widget-tribe-widget-events-list[2][title]","options":[],"placeholder":"","value":null},"limit":{"label":"Show:","type":"number","default":5,"min":1,"max":10,"step":1,"classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-limit","name":"widget-tribe-widget-events-list[2][limit]","options":[],"placeholder":"","value":null},"metadata_section":{"type":"fieldset","classes":"tribe-common-form-control-checkbox-checkbox-group","label":"Display:","children":{"cost":{"type":"checkbox","label":"Price","classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-cost","name":"widget-tribe-widget-events-list[2][cost]","options":[],"placeholder":"","value":null},"venue":{"type":"checkbox","label":"Venue","classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-ven