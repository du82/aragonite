full_description = '''@media (max-width:767px){.event-sidebar{display:none}}.tribe-events-content a{border-bottom:1px solid var(--color-content-link)!important}.tribe-events-single>.tribe_events{overflow:visible!important}.single-tribe_events .tribe-events-c-subscribe-dropdown .tribe-events-c-subscribe-dropdown__list-item,.tribe-events .tribe-events-c-subscribe-dropdown .tribe-events-c-subscribe-dropdown__list-item{margin-bottom:0!important}#tribe-events-footer{padding:0!important}<img width="64" height="64" class="tribe-events-spinner-medium" src="https://learnomnifocus.com/wp-content/plugins/the-events-calendar/src/resources/images/tribe-loading.gif" alt="Loading Events" /> « All Events Virtual Coworking March 14, 2025 | 9:00 am – 10:30 am PDT Not finding time to complete your important OmniFocus actions and projects? Join us for Virtual Coworking sessions and get things done in a focused and supportive virtual environment.Virtual Coworking sessions give you the opportunity to engage in focused work with the encouragement and support of people in your worldwide Learn OmniFocus community. By registering for these sessions, you’re committing to spending time on the important actions and projects you’ve articulated in OmniFocus. Being in a virtual room where others have the same commitment can lead to highly productive work.When you register for a session, you’ll be sent a Zoom link by email and prompted to add the session to your calendar. Please plan to arrive at least a couple of minutes before the start time to make sure that your camera and microphone are working. You’re welcome to join up to ten minutes early and stick around for ten minutes after for some social time.Please visit the Virtual Coworking page to learn more about how these sessions work, for guidelines to help you prepare to get the most out of these sessions, and for answers to frequently asked questions. Event Navigation « Office Hours Office Hours » Join Learn OmniFocus You need to be an active Learn OmniFocus Member to register for this live session. Not a member yet? Join here Membership Benefits A membership gives you full access to all of our content and allows you to join sessions that centre around themes and workflow guests. You’ll also be able to participate in Learn OmniFocus Office Hours, highly interactive video-conferenced sessions in small groups (maximum 10 people per session). @media(max-width:766px){ #oeca{height:0!important}} Join Learn OmniFocus You need to be an active Learn OmniFocus Member to register for this live session. Not a member yet? Join here Membership Benefits A membership gives you full access to all of our content and allows you to join sessions that centre around themes and workflow guests. You’ll also be able to participate in Learn OmniFocus Office Hours, highly interactive video-conferenced sessions in small groups (maximum 10 people per session). {"slug":"widget-events-list","prev_url":"","next_url":"https:\/\/learnomnifocus.com\/?post_type=tribe_events&eventDisplay=widget-events-list&paged=2","view_class":"Tribe\\Events\\Views\\V2\\Views\\Widgets\\Widget_List_View","view_slug":"widget-events-list","view_label":"View","view":null,"should_manage_url":true,"id":null,"alias-slugs":null,"title":"Virtual Coworking - Learn OmniFocus","limit":"3","no_upcoming_events":true,"featured_events_only":false,"jsonld_enable":false,"tribe_is_list_widget":false,"admin_fields":{"title":{"label":"Title:","type":"text","classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-title","name":"widget-tribe-widget-events-list[2][title]","options":[],"placeholder":"","value":null},"limit":{"label":"Show:","type":"number","default":5,"min":1,"max":10,"step":1,"classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-limit","name":"widget-tribe-widget-events-list[2][limit]","options":[],"placeholder":"","value":null},"metadata_section":{"type":"fieldset","classes":"tribe-common-form-control-checkbox-checkbox-group","label"