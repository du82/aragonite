title = "Custom Perspectives for OmniFocus  - Learn OmniFocus"
description = """
Email                                            NameThis field is for validation purposes and should be left unchanged."""
full_description = 'Custom Perspectives for OmniFocus Custom perspectives provide a quick and convenient way to tap into your OmniFocus database.Below, you’ll find examples showing some of the many ways custom perspectives can be used to quickly and conveniently access the most relevant information from OmniFocus and help ensure that your database is up-to-date and relevant.Custom perspectives require OmniFocus Pro. As noted in the descriptions, some reference specific tags and folders. You may need to make changes to adapt them to work with your OmniFocus setup.Installing Custom Perspectives on Mac – You can download and install these custom perspectives on the Mac. Click the download link to download the zip file. Install the perspective by double-clicking the “.ofocus-perspective” file in the zip file.Table of ContentsAction PerspectivesWhen it’s time to take action, it’s helpful to hone in on the most relevant actions as quickly and conveniently as possible. The following are some examples of how OmniFocus perspectives can help.Projects: What’s Next — The next available action for each of your active projects (defined outcomes). Today — Actions that are candidates for completion today. Some actions show up automatically, and others are handpicked from your available actions. Today: Important — Available actions that are particularly important, either because they’re flagged, overdue, or due soon. Today: BIG Rocks – Actions from your Today list that will take over 30 minutes to complete. Today: Small Rocks – Actions from your Today list that will take 5-30 minutes to complete. Today: Pebbles – Actions from your Today list that can be completed in five minutes or less.Review PerspectivesIt’s important to review OmniFocus regularly to ensure that it accurately reflects your life and work and to keep your commitment level in check. These perspectives give you a quick way of seeing what’s on your plate and what’s on your radar.Projects: Active — All projects (defined outcomes) you’re actively working towards. Single action lists, checklists, and template projects are automatically excluded from the list. Projects: Completed – All completed projects (defined outcomes) grouped according to when they were completed. Projects: Due — All incomplete projects (defined outcomes) with a due date. Projects: Inactive — All projects (defined outcomes) that are inactive, either because they’ve been deferred to a future date or put on hold. Single action lists, checklists and template projects are automatically excluded from the list. Waiting — Everything that you’re currently waiting for grouped by tag.System Maintenance PerspectivesOmniFocus perspectives can be very helpful for maintaining a system that is complete and consistent. The following perspectives help ensure that OmniFocus will serve you well when it’s time to take action.Actions: No Duration — All remaining actions that don’t have an estimated duration. Actions: Stale – Available actions that haven’t been touched for a while. Actions: Untagged — All untagged actions, excluding unprocessed actions in the inbox. Overdue – All projects, action groups, and actions past their due date and time. Projects: Stalled – All active projects (defined outcomes) with no remaining actions. Projects: Unfiled — All projects (defined outcomes) that haven’t been filed into a folder.All PerspectivesActions: No DurationIt can be helpful to give each of your actions an Estimated Duration. This adds a bit of extra work upfront and allows you to quickly pull up a list of short or long actions, whatever’s most relevant to your current circumstances. Additionally, spending a few extra seconds to think about how long an action will take can help ensure that you don’t try to pack too much into the day.This perspective shows all remaining actions without an estimated duration. Items in the inbox are excluded from this list as they’re considered unprocessed.<img fetchpriority="high" decoding="async" width="746" height="1024" src="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1-746x1024.png" alt="" class="wp-image-247056" style="width:400px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1-746x1024.png 746w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1-219x300.png 219w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1-36x50.png 36w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1-300x412.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1-44x60.png 44w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1-66x90.png 66w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-No-Duration-1.png 956w" sizes="(max-width: 746px) 100vw, 746px" />Tap the screenshot to see a larger image.Download Perspective (Mac)↑ Table of ContentsActions: StaleThis perspective identifies available actions you’ve added to OmniFocus that haven’t been touched in a while. Review this perspective periodically and make a point of doing actions that have been taking up space in your system for a while. Along the way, clarify the action to be taken. If an action is no longer worth your time and energy, drop it or delete it.This perspective considers actions “stale” if they haven’t been modified in six months. Adjust the “modified date” rule if six months is too long or too short. If this perspective surfaces an available action that you don’t consider “stale,” modify it in some way (e.g. add a note) to reset the modification date and time.<img decoding="async" width="772" height="1024" src="https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale-772x1024.png" alt="OmniFocus Custom Perspective - Actions - Stale" class="wp-image-247525" style="width:400px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale-772x1024.png 772w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale-226x300.png 226w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale-38x50.png 38w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale-300x398.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale-45x60.png 45w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale-68x90.png 68w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-Custom-Perspective-Actions-Stale.png 956w" sizes="(max-width: 772px) 100vw, 772px" />Tap the screenshot to see a larger image.Download Perspective (Mac)↑ Table of ContentsActions: UntaggedAdding at least one tag to each action helps ensure that nothing slips through the cracks. For example, if you create an action of “Pick up supplies at Home Depot” and forget to give it a tag of “errand,” you may miss it when you’re out running errands and must make an extra trip.This perspective lists all remaining actions that are currently untagged. Items in the inbox are excluded from this list as they’re considered unprocessed.<img decoding="async" width="746" height="1024" src="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2-746x1024.png" alt="OmniFocus 4 - Custom Perspective - Actions: Untagged" class="wp-image-247059" style="width:400px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2-746x1024.png 746w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2-219x300.png 219w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2-36x50.png 36w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2-300x412.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2-44x60.png 44w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2-66x90.png 66w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Actions-Untagged-2.png 956w" sizes="(max-width: 746px) 100vw, 746px" />Tap the screenshot to see a larger image.Download Perspective (Mac)Visit our OmniFocus Tags Directory to learn more about how tags can add ease and efficiency to your system.↑ Table of ContentsOverdueThis perspective identifies all remaining projects, action groups, and actions with a due date and time in the past. Actions are grouped by when they became due, so it’s easy to distinguish tasks that recently became overdue from those whose due dates passed some time ago.On a related note, we recommend only using the due field if there’s a consequence of not completing a task by a specific date and time. Assigning due dates/times arbitrarily makes distinguishing between aspirational and actual due dates difficult. Read the article Best Practice: Use Due Dates Sparingly to learn more.<img decoding="async" width="830" height="1024" src="https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue-830x1024.png" alt="OmniFocus Custom Perspective - Overdue" class="wp-image-247561" style="width:400px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue-830x1024.png 830w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue-243x300.png 243w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue-41x50.png 41w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue-300x370.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue-49x60.png 49w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue-73x90.png 73w, https://learnomnifocus.com/wp-content/uploads/2024/05/OmniFocus-4-for-Mac-Custom-Perspective-Overdue.png 956w" sizes="(max-width: 830px) 100vw, 830px" />Tap the screenshot to see a larger image.Download Perspective (Mac)↑ Table of ContentsProjects: ActiveIt’s helpful to quickly pull up a list of all projects (defined outcomes) you’re working towards. If you’re considering taking on something new, refer to this list to ensure you won’t become overcommitted by adding another project.This perspective includes projects with a defined outcome (i.e. sequential and parallel projects) and omits lists of one-off items (i.e. single action “projects”).You may want to enhance this perspective to, for example, exclude folders that contain templates and checklists. New projects can be created using templates, but the template projects don’t represent defined outcomes. Checklists are called up when needed and don’t belong in this perspective.Active projects appear in the sidebar; click on a project or folder to see their contents. Completed actions and action groups are filtered out.<img decoding="async" width="772" height="1024" src="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active-772x1024.png" alt="OmniFocus 4 - Custom Perspective - Projects: Active" class="wp-image-247035" style="width:400px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active-772x1024.png 772w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active-226x300.png 226w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active-38x50.png 38w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active-300x398.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active-45x60.png 45w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active-68x90.png 68w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Active.png 956w" sizes="(max-width: 772px) 100vw, 772px" />Tap the screenshot to see a larger image.Download Perspective (Mac)↑ Table of ContentsProjects: CompletedLooking back at all the projects you’ve brought to fruition can be very helpful. This review helps clarify where you’re spending your time and attention and can be useful when providing status updates to your employer. It also provides a great opportunity to celebrate your accomplishments.This perspective excludes single action lists as these don’t represent defined outcomes. Repeated projects (e.g. morning reviews) can clutter up this perspective and are excluded. Consider disabling the “Is repeating” rule if your repeating projects represent significant outcomes and you want to see them in this perspective.The sidebar shows completed projects. Projects are grouped in the outline based on when they were completed.<img decoding="async" width="772" height="1024" src="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1-772x1024.png" alt="" class="wp-image-247040" style="width:400px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1-772x1024.png 772w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1-226x300.png 226w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1-38x50.png 38w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1-300x398.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1-45x60.png 45w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1-68x90.png 68w, https://learnomnifocus.com/wp-content/uploads/2024/04/OmniFocus-4-for-Mac-Custom-Perspective-Projects-Completed-1.png 956w" sizes="(max-width: 772px) 100vw, 772px" />Tap the screenshot to see a larger image.Download Perspective (Mac)You could further enhance this perspective by adding a date range rul'
