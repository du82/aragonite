description = "Join us for our engaging small-group (maximum 10 participants) Office Hours sessions. Meet other OmniFocus users and ask questions about your OmniFocus setu ..."
full_description = '''Office Hours Join us for our engaging small-group (maximum 10 participants) Office Hours sessions. Meet other OmniFocus users and ask questions about your OmniFocus setup and workflows.Learn OmniFocus Office Hours are live sessions that allow you to connect face-to-face with Learn OmniFocus Founder Tim Stringer and other Learn OmniFocus Members to discuss and ask questions about your OmniFocus setup and workflows.During the session, you can discuss and ask questions about anything related to OmniFocus and complementary third-party apps. For example, you can get advice on what tags to use, what perspectives will support you as you go through the day, how to establish a habit around regular reviews, and how to use OmniFocus alongside your mail and calendar apps of choice.Connect Face to Face With Other OmniFocus UsersWe aim to make these as much like an in-person experience as possible, even though participants are often thousands of miles apart. Connecting with people in other countries, cultures, and professions exposes you to fresh new perspectives that can positively impact all areas of your life and work.When you register, you’ll be asked to agree to join with your video camera turned on and keep what others in your group share confidential. To protect the privacy of participants, these sessions aren’t recorded.Upcoming Office Hours SessionsThe following Learn OmniFocus Office Hour sessions are currently open for registration. All dates and times are in Pacific Time. To register for these sessions, join Learn OmniFocus or reactivate your account. Each session has a View in Your Time Zone button that displays the date and time in your local time zone. After registering for a session, you’ll be emailed a Zoom link. You’ll also be prompted to add the session to your calendar. Can’t find a date and time that works for you? Drop us a line and let us know your preferred days and times. We’ll do our best to accommodate. {"slug":"widget-events-list"