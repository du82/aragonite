description = "Learn OmniFocus was founded by Tim Stringer, who has been providing OmniFocus coaching, consulting, and training to people worldwide since 2010. OmniFocus h ..."
full_description = '''About Learn OmniFocus Learn OmniFocus was founded by Tim Stringer, who has been providing OmniFocus coaching, consulting, and training to people worldwide since 2010. OmniFocus has the potential to make your life easier, more fulfilling and more creative. This potential is realized by taking the time to thoughtfully craft your setup and to develop skills and habits that result in OmniFocus being deeply integrated into your day-to-day life. That’s where we come in… We’re here to support you in this process by sharing best practices and practical techniques through articles, videos and in-depth courses. Some content is freely available to everyone, and some are only accessible to Learn OmniFocus Members. Memberships are our primary source of income and help us keep the lights on as we continue to create content. Members can also attend our interactive Learn OmniFocus LIVE sessions. These include themed sessions, workflow guests, small-group (maximum ten people) Learn OmniFocus Office Hours, Virtual Coworking and Workshops. A Holistic Approach to Productivity Our content is rooted in the Holistic Productivity™ approach that Tim Stringer developed. This approach acknowledges the multi-faceted nature of life and stipulates that a positive shift created in one area of life impacts all other areas of life to a large or a small degree. For example, someone will naturally be more productive in their work environment if they create a positive shift around their health, for example, by getting more sleep at night. True to its name, OmniFocus can be a highly effective tool for articulating and tracking commitments across all areas of life while allowing you to quickly and easily focus on the specific area of life that currently warrants your time and attention. Tim spoke on this topic at the Omni Group’s inaugural OmniFocus Setup event in San Francisco in 2013. {"slug":"widget-events-list","prev_url":"","next_url":"https:\/\/learnomnifocus.com\/?post_type=