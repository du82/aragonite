full_description = '''Contact Learn OmniFocus Have a Question?Answers to Frequently Asked Questions are in Support. Complete the form below if you have other questions. Go to SupportInterested in Private OmniFocus Sessions?Learn OmniFocus Founder, Tim Stringer has been providing Private OmniFocus Coaching & Consulting since 2011. Learn MoreSend Us a Message We typically respond to billing and customer service requests within two business days. We appreciate feedback and requests. We read these carefully and will respond if additional clarification is needed. The OmniFocus app is developed, sold, and supported by The Omni Group. Please contact Omni Support if you require technical support or have feature requests. Name* First Last Email* Subject*Billing InquiryCustomer ServiceMedia InquiryRequest for ContentWebsite FeedbackCompany Name*Please provide the name of the media organization you represent.Media Opportunity*Interview Tim StringerFeature Learn OmniFocusOtherPlease provide additional information in the message field.Date of Transaction* YYYY dash MM dash DD Message*CommentsThis field is for validation purposes and should be left unchanged. {"slug":"widget-events-list","prev_url":"","next_url":"https:\/\/learnomnifocus.com\/?post_type=tribe_events&eventDisplay=widget-events-list&paged=2","view_class":"Tribe\\Events\\Views\\V2\\Views\\Widgets\\Widget_List_View","view_slug":"widget-events-list","view_label":"View","view":null,"should_manage_url":true,"id":null,"alias-slugs":null,"title":"Contact Learn OmniFocus -\u00a0Learn OmniFocus","limit":"3","no_upcoming_events":true,"featured_events_only":false,"jsonld_enable":false,"tribe_is_list_widget":false,"admin_fields":{"title":{"label":"Title:","type":"text","classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-title","name":"widget-tribe-widget-events-list[2][title]","options":[],"placeholder":"","value":null},"limit":{"label":"Show:","type":"number","default":5,"min":1,"max":10,"step":1,"classes":""