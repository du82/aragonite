["https://learnomnifocus.com/black-friday-giving-tuesday-promotion-2024"]
title = "Join by November 30, 2024: SAVE 20% + Support the Environment  - Learn OmniFocus"
description = "Not currently a Learn OmniFocus Member? Join by November 30, 2024 to SAVE 20% on an annual membership and support the International Conservation Fund of Canada."
full_description = '''Join by November 30, 2024: SAVE 20% + Support the Environment3 months agoAnnouncementsTim StringerAre you not a Learn OmniFocus Member yet, or have you let your membership lapse? Join (or rejoin) by Saturday, November 30, 2024 (midnight PST) and SAVE 20% on the first year of an Annual Membership.You’ll have instant access to our growing library of content, including in-depth courses for OmniFocus 4 to support you in making productive use of OmniFocus and complementary productivity apps. As a Learn OmniFocus Member, you’ll also be able to attend upcoming LIVE sessions, including Office Hours, Virtual Coworking and Workshops.How to Apply the Promotional DiscountTo apply the promotional discount, sign up for an Annual Membership and enter the coupon code SAVEGIVE2024 at the top of the Checkout page. All of our memberships come with a 30-day money-back guarantee.<img fetchpriority="high" decoding="async" width="1814" height="792" src="https://learnomnifocus.com/wp-content/uploads/2024/11/Learn-OmniFocus-Checkout-SAVEGIVE2024.png" alt="How to Apply 2024 Promotional Discount" class="wp-image-250105" style="width:600px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/11/Learn-OmniFocus-Checkout-SAVEGIVE2024.png 1814w, https://learnomnifocus.com/wp-content/uploads/2024/11/Learn-OmniFocus-Checkout-SAVEGIVE2024-300x131.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/11/Learn-OmniFocus-Checkout-SAVEGIVE2024-1024x447.png 1024w, https://learnomnifocus.com/wp-content/uploads/2024/11/Learn-OmniFocus-Checkout-SAVEGIVE2024-50x22.png 50w" sizes="(max-width: 1814px) 100vw, 1814px" />Giving Tuesday Donation to ICFCI believe in sharing the wealth and supporting projects that benefit humanity and the planet. A portion of our November membership income will be donated to the International Conservation Fund of Canada (ICFC). ICFC works with local partners and communities in regions where biodiversity is the richest and most threatened. We’re honoured to support their mission to protect and restore nature worldwide.<img decoding="async" width="1024" height="351" src="https://learnomnifocus.com/wp-content/uploads/2024/11/International-Conservation-Fund-Of-Canada-ICFC-Banner-1-1024x351.jpg" alt="International Conservation Fund of Canada (ICFC) logo" class="wp-image-250181" style="width:500px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/11/International-Conservation-Fund-Of-Canada-ICFC-Banner-1-1024x351.jpg 1024w, https://learnomnifocus.com/wp-content/uploads/2024/11/International-Conservation-Fund-Of-Canada-ICFC-Banner-1-300x103.jpg 300w, https://learnomnifocus.com/wp-content/uploads/2024/11/International-Conservation-Fund-Of-Canada-ICFC-Banner-1-50x17.jpg 50w" sizes="(max-width: 1024px) 100vw, 1024px" />I was motivated to support ICFC after learning that they provide both financial support and scientific expertise to strategically-chosen environmental projects. Their approach acknowledges that biodiversity loss and climate change are global issues. Their work strategically targets areas where biodiversity is most threatened. For example, 95% of deforestation occurs in the tropics.A core group of donors covers ICFC’s administrative and fundraising costs, so 100% of the money I donate on behalf of Learn OmniFocus will be applied to projects.How to Donate to ICFCIn addition to supporting ICFC financially, my goal is to spotlight their excellent work worldwide, including the Kayapo Project in Brazil (read on to learn more). You’re encouraged to donate to ICFC to support their work and, by extension, the health of our planet. You’ll receive an income tax receipt if you’re based in Canada or the USA.Kayapo Project in Brazil<img decoding="async" width="819" height="1024" src="https://learnomnifocus.com/wp-content/uploads/2024/11/1-1-819x1024.png" alt="A Future for the Amazon, Led by the Kayapo" class="wp-image-250172" style="width:300px" srcset="https://learnomnifocus.com/wp-content/uploads/2024/11/1-1-819x1024.png 819w, https://learnomnifocus.com/wp-content/uploads/2024/11/1-1-240x300.png 240w, https://learnomnifocus.com/wp-content/uploads/2024/11/1-1-40x50.png 40w, https://learnomnifocus.com/wp-content/uploads/2024/11/1-1-300x375.png 300w, https://learnomnifocus.com/wp-content/uploads/2024/11/1-1.png 1080w" sizes="(max-width: 819px) 100vw, 819px" />ICFC works closely with the Kayapo Indigenous people to protect a region of the Brazilian Amazon that is larger than close to half the countries in the world.The impact of this work is well documented:“For three decades an alliance of the Kayapo Indigenous people with international conservation organizations has resulted in one of the world’s most significant forest conservation success stories. This project has meant the survival of intact forests, a wealth of biodiversity and stored carbon, and the traditional way of life of the Kayapo people.”– Source: International Conservation Fund of CanadaWatch this video to learn more about ICFC and their work in the Amazon and elsewhere. {"slug":"widget-events-list","prev_url":"","next_url":"https:\/\/learnomnifocus.com\/?post_type=tribe_events&eventDisplay=widget-events-list&paged=2","view_class":"Tribe\\Events\\Views\\V2\\Views\\Widgets\\Widget_List_View","view_slug":"widget-events-list","view_label":"View","view":null,"should_manage_url":true,"id":null,"alias-slugs":null,"title":"Join by November 30, 2024: SAVE 20% + Support the Environment -\u00a0Learn OmniFocus","limit":"3","no_upcoming_events":true,"featured_events_only":false,"jsonld_enable":false,"tribe_is_list_widget":false,"admin_fields":{"title":{"label":"Title:","type":"text","classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-title","name":"widget-tribe-widget-events-list[2][title]","options":[],"placeholder":"","value":null},"limit":{"label":"Show:","type":"number","default":5,"min":1,"max":10,"step":1,"classes":"","dependency":"","id":"widget-tribe-widget-events-list-2-limit","name":"widget