description = "Learn OpenGL . com provides good and clear modern 3.3+ OpenGL tutorials with clear examples. A great resource to learn modern OpenGL aimed at beginners."
full_description = "Tessellation Guest-Articles/2021/Tessellation/Tessellation #content-title { display: none; } Tessellation Chapter II: Rendering Terrain using Tessellation Shaders & Dynamic Levels of Detail In order to complete this chapter, you will need to be able to create an OpenGL 4.0+ context. This should not be a technical concern as Windows and Linux support OpenGL 4.6 and OS X only supports OpenGL 4.1. The Tessellation Shaders to be discussed are only available starting in OpenGL 4.0. Using OpenGL 3.3 or earlier will result in errors. The sample shader code will user OpenGL 4.1 for cross-platform compatibility between OS X, Windows, and Linux. In the previous chapter, we implemented a terrain height map on the CPU and it worked but it had its deficiencies: The mesh generation is time intensive ( O(n2). The mesh storage is memory intensive to store the vertices and indices ( width * height * 3 * sizeof(float) + width * (height+1) * sizeof(unsigned int) - almost 72MB in our example). The mesh has a fixed uniform resolution (width * height vertices and (height-1) * (width*2) triangles - 4,607,744 vertices and 9,206,730 triangles in our example). The Vertex Shader needs to process a minimum of width * height vertices. To draw the entire mesh, we need to have height - 1 draw calls. In this chapter we'll offload the work to the GPU making use of tessellation shaders to improve the performance and memory footprint. We will render the corresponding terrain using a new method: Dynamically subdividing a low resolution mesh on the GPU This method will give us comparable results, greater control & flexibility, and better performance. In this chapter, we will expand our existing OpenGL Rendering Pipeline and introduce two new programmable shaders. This chapter is organized in to the following sections: CPU / OpenGL Setup GPU Implementation using Tessellation Shaders Expanded Rendering Pipeline Tessellation Control Shader Tessellation Primitive Generation Tessellation Evaluation Shader Dynamic Level of Detail Exercises References CPU / OpenGL Setup The first step is to specify the number of vertices that make up each of our primitives. When dealing with tessellation, our new primitive type is a patch denoted by the constant GL_PATCHES. A patch is an abstract primitive that is comprised of a set of n vertices that will be interpolated between. The number of vertices per patch is specified CPU side via the OpenGL command below: glPatchParameteri(GL_PATCH_VERTICES, 4); Here we are specifying that each set of four verticies refer to a single patch (which matches our quad subdivision previously). Depending on your interpolation calculation, the number of vertices may vary. In the next chapter, we'll see an instance where we'll have more verticies used. We'll set up our VBO as the set of vertices that represent our quad. We will do a course subdivision of our terrain. Here, width and height correspond to the size of the height map image we read in. The rez is the number of patches across and down our terrain. Therefore, we'll be generating rez2 patches, each to be individually tessellated. Each vertex of our quad has an (x,y,z) location in space and a (u,v) texture coordinate. The locations span through the X range of [-width/2, width/2] and Z range of [-height/2, height/2. Y is set to be zero and will be modified by the height map in our shaders. The texture coordinates span [0, 1] to correspond to each resolution block of the texture. // vertex generation std::vector<float> vertices; unsigned rez = 20; for(unsigned i = 0; i <= rez-1; i++) { for(unsigned j = 0; j <= rez-1; j++) { vertices.push_back(-width/2.0f + width*i/(float)rez); // v.x vertices.push_back(0.0f); // v.y vertices.push_back(-height/2.0f + height*j/(float)rez); // v.z vertices.push_back(i / (float)rez); // u vertices.push_back(j / (float)rez); // v vertices.push_back(-width/2.0f + width*(i+1)/(float)rez); // v.x vertices.push_back(0.0f); // v.y vertices.push_back(-height/2.0f + height*j/(float)rez); // v.z vertices.push_back((i+1) / (float)rez); // u vertices.push_back(j / (float)rez); // v vertices.push_back(-width/2.0f + width*i/(float)rez); // v.x vertices.push_back(0.0f); // v.y vertices.push_back(-height/2.0f + height*(j+1)/(float)rez); // v.z vertices.push_back(i / (float)rez); // u vertices.push_back((j+1) / (float)rez); // v vertices.push_back(-width/2.0f + width*(i+1)/(float)rez); // v.x vertices.push_back(0.0f); // v.y vertices.push_back(-height/2.0f + height*(j+1)/(float)rez); // v.z vertices.push_back((i+1) / (float)rez); // u vertices.push_back((j+1) / (float)rez); // v } } We'll send the vertices vector to a VBO. When it comes time to actually render and draw the patch, we'll use the same draw command we're accustomed to but using the primtive type GL_PATCHES. glBindVertexArray(terrainVAO); glDrawArrays(GL_PATCHES, 0, 4*rez*rez); That is the extent of what's done on the CPU and via OpenGL. We specify the vertices per patch and will leave the subdivision of each patch to the GPU and our tessellation shaders. GPU Implementation using Tessellation Shaders The previous chapter performed the quad subdivision once on the CPU and then sent the precomputed results to the GPU to render. We will now move the quad subdivision to the GPU. The quad subdivision, or tessellation of the quad, is broken in to three steps: Determine how much tessellation to do Perform the tessellation to generate intermediate points Evaluate the intermediate point to generate a new vertex point Each of those three steps will correspond to each of the new stages in our rendering pipeline. Expanded Rendering Pipeline The Geometry Shader sits after the Vertex Shader and before the clipping & culling stage of the pipeline. However, between the Vertex and Geometry Shaders are two more optional shaders called the Tessellation Control Shader and the Tessellation Evaluation Shader. The image below displays a simplified OpenGL Rendering Pipeline. The boxes name each stage in the pipeline and the clouds name the input/output objects for each stage. The Tessellation Evaluation Shader is required for the tessellation process to be computed. If the Tessellation Control Shader is omitted then the output of the Vertex Shader is sent directly to the Tessellation Primitive Generator. The new stages we have added, and their responsibilites, are: Tessellation Control Shader - Determine how much tessellation to do Tessellation Primitive Generator - Perform the tessellation to generate intermediate points Tessellation Evaluation Shader - Evaluate the intermediate point to generate a new vertex point As we walk through the tessellation process, we will start the shader program with a simple pass-through vertex shader, shown below. // vertex shader #version 410 core // vertex position layout (location = 0) in vec3 aPos; // texture coordinate layout (location = 1) in vec2 aTex; out vec2 TexCoord; void main() { // convert XYZ vertex to XYZW homogeneous coordinate gl_Position = vec4(aPos, 1.0); // pass texture coordinate though TexCoord = aTex; } Tessellation Control Shader (TCS) The main task of the control shader, as stated above, is to determine how much tessellation to do. How that is done specifically is a multistep process. The three steps are the following: Specify the number of vertices per patch Perform any transformations to each vertex of the patch Specify the tessellation levels to perform - which controls how much tessellation to do When specifying the number of vertices per patch, this value needs to match the number specified on the CPU. This is accomplished via a output layout parameter. layout (vertices=4) out; The tessellation control shader will be run on each vertex that is part of the patch. The shader receives its inputs as an array whose size equals the number of vertices in the patch. The built-in GLSL variable gl_InvocationID tracks which vertex of the patch we are currently processing. We'll use this value to access the proper element within the array. Any varyings we are using will also be arrays, both as input and output: // varying input from vertex shader in vec2 TexCoord[]; // varying output to evaluation shader out vec2 TextureCoord[]; The vertex positional data gets sent through the built-in GLSL variables gl_in and gl_out which are both arrays of the following struct type: in gl_PerVertex { vec4 gl_Position; float gl_PointSize; float gl_ClipDistance[]; } gl_in[gl_MaxPatchVertices]; With all the inputs and outputs set up properly, we're ready to pass through all of the vertex attribute data. gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position; TextureCoord[gl_InvocationID] = TexCoord[gl_InvocationID]; Now that we've specified the patch data, the final step is to actually specify how much tessellation to do. How the tessellation is performed exactly will be described below in the next section. Each edge of our quad can be subdivided independently. Therefore, there are four different edge values we can set as specified by the built-in GLSL array gl_TessLevelOuter. Additionally, the patch can be internally tessellated along each dimension. There are two dimensions we can set as specified by the built-in GLSL array gl_TessLevelInner. The image below shows the correspondance of each element in the array to the associated quad edge. Image Source: OpenGL Wiki We will set each element within the two arrays to the number of subdivisions to perform. These are float values and how these values get used will be explained below when the tessellation algorithm is explained. Initially, we will hardcode all the values to be 16. This will be result in 162 tessellated points to be generated. gl_TessLevelOuter[0] = 16; gl_TessLevelOuter[1] = 16; gl_TessLevelOuter[2] = 16; gl_TessLevelOuter[3] = 16; gl_TessLevelInner[0] = 16; gl_TessLevelInner[1] = 16; The full tessellation control shader code looks as follows: // tessellation control shader #version 410 core // specify number of control points per patch output // this value controls the size of the input and output arrays layout (vertices=4) out; // varying input from vertex shader in vec2 TexCoord[]; // varying output to evaluation shader out vec2 TextureCoord[]; void main() { // ---------------------------------------------------------------------- // pass attributes through gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position; TextureCoord[gl_InvocationID] = TexCoord[gl_InvocationID]; // ---------------------------------------------------------------------- // invocation zero controls tessellation levels for the entire patch if (gl_InvocationID == 0) { gl_TessLevelOuter[0] = 16; gl_TessLevelOuter[1] = 16; gl_TessLevelOuter[2] = 16; gl_TessLevelOuter[3] = 16; gl_TessLevelInner[0] = 16; gl_TessLevelInner[1] = 16; } } Tessellation Primitive Generation The Tessellation Primitive Generator is responsible for doing the actual tessellation of the patch and generating each intermediate point. There is no specific shader code written for the Tessellation Primitive Generator. However, it uses the output of the tessellation control shader and the input of the tessellation evaluation shader to dictate how the generation is performed. The tessellation control shader output the tessellation levels, or number of times to subdivide each edge. The tessellation evaluation shader's input then specifies how to space the subdivisions on each edge. There are three options for how to specify the subdivision spacing: equal_spacing - creates subdivisions of equal sizes fractional_odd_spacing - creates an odd number of subdivisions broken into long & short segments fractional_even_spacing - creates an even number of subdivisions broken into long & short segments A visual of each option is shown below. For more details and specifics, jump over to the OpenGL Wiki page. Equal Subdivision (Image Source: OpenGL Wiki) Fractional Odd Subdivision (Image Source: OpenGL Wiki) Fractional Even Subdivision (Image Source: OpenGL Wiki) The tessellation is performed in a two-step process - first the inner patch is recursively tessellated and then the outer edges are subdivided. The image below shows different tessellations that would result based on different values of the inner tessellation levels. Image Source: OpenGL Wiki Once the inner rings have been generated, the outer ring was its final intermediate points generated based on each outer tessellation level. Image Source: OpenGL Wiki The abstract patch space spans its dimensions within the range [0, 1]. Each intermediate point is represented by a fractional coordinate (u, v) that corresponds to its location within the patch. The tessellation evaluation shader will then be run on every generated intermediate point. Tessellation Evaluation Shader The Tessellation Evaluation Shader has a relatively simple job after the above steps have been completed - to specify the (x, y, z)location of the generated intermediate point. The presence of the tessellation evaluation shader in the pipeline is what triggers the tessellation primitive generation. Therefore, the inputs for the tessellation primitive generator are placed in the tessellation evaluation shader as input layout paramaters. We will need to specify the abstract patch type and can optionally specify the spacing and winding order for the generated primitives. Our patch is representing a quad to be subdivided, so the patch type will be quads (other options include triangles and isolines). The spacing options were outlined above and the winding order can be either ccw or cw, with ccw being the default. layout (quads, fractional_odd_spacing, ccw) in; The tessellation evaluation shader receives the following inputs: the array of patch vertices, again through the built-in gl_in the array of varying attributes the 2D tessellation coordinate for the generated point through the built-in gl_TessCoord We then use the gl_TessCoord values as the parameters to interpolate the patch vertices as desired. Here, we will apply the same quad subdivision as we did CPU side in the previous chapter. The difference being that we are now determining the interpolated texture coordinate and final vertex position within the GPU in parallel, opposed to on the CPU in sequence. The process is also simplified since our code is performing only a single interpolation opposed to having to generate the fractional interpolation parameters and do the interpolation. We have now offloaded the generation of the interpolation parameters to the tessellation primitive generator. The full tessellation evaluation shader is displayed below with equivalent steps from the CPU tessellation subdivision. // tessellation evaluation shader #version 410 core layout (quads, fractional_odd_spacing, ccw) in; uniform sampler2D heightMap; // the texture corresponding to our height map uniform mat4 model; // the model matrix uniform mat4 view; // the view matrix uniform mat4 projection; // the projection ma"
