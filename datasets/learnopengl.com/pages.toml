title = "LearnOpenGL - Phys. Based Bloom"
description = "Learn OpenGL . com provides good and clear modern 3.3+ OpenGL tutorials with clear examples. A great resource to learn modern OpenGL aimed at beginners."
full_description = '''Phys. Based Bloom Guest-Articles/2022/Phys.-Based-Bloom #content-title { display: none; } Physically Based Bloom "When using PBR the dynamic range is usually very high, so you don’t need to threshold. The blurred bloom layer is set to a low value (say 0.04), which means that only very bright pixels will bloom noticeably. That said, the whole image will receive some softness, which can be good or bad, depending on the artistic direction. But in general, it leads to more photorealistic results." - Jorge Jimenez. Prerequisites You should have a solid grasp on HDR-rendering, tonemapping, and gamma correction before reading this article. Going through the tutorials on this website should be sufficient. Introduction Bloom is cool. It is one of the post-processing effects, or post FX, that are very sought-after for its nice visual feel. Yet it also has a somewhat tarnished reputation. Why is that? I know that many gamers have made it a habit to jump into graphics settings and disable bloom when they install a new game. I have met a few of them, and besides the increased rendering times, bloom has very often been misused, which is probably one of the reasons why so many gamers are reluctant to enable it. To understand why we want bloom, we must also understand why we might not want bloom, as that perspective is equally important in forming a well-informed opinion. Then, when we have discussed the drawbacks we will have a better understanding of how to make it right. So without further ado... The bloom disaster For anyone who wishes to understand bloom or even implement it themselves, this article is an absolute must-read: Bloom disasters. This statement cannot be stressed enough. A consistent misuse of the effect through the pre-HDR gamedev era has given rise to suspicion and outright disdain. And looking at the images, it is probably not hard to understand why: Everything that is white or very bright just becomes a mess of light, actually hurting the eyes. Anything in close vicinity to bright areas is absorbed in a fiery explosion of brightness. Everything is just too washed-out because of excessive blur. The rendered images lose contrast because of an artificial threshold. Everything above a certain level is just "white", and aliasing artifacts ("jaggies") in dark areas become even more noticeable because blur is not applied to those areas. Besides these obvious drawbacks, bloom is also very difficult to get right when applied to a thresholded color image (ie. only to pixels above a certain brightness level). And the threshold level needs a different value depending on whether or not bloom is applied on an HDR image. Furthermore, for very bright scenes we might want a higher threshold, and for darker scenes a lower threshold, as to simulate the natural adaption to changes in luminance that our eyes perform. That being said, applying a threshold also yields problems when we are using a physically-based rendering approach, as bloom in the real world is actually applied to everything - not only bright objects! The perfect lens does not exist, so even with very high quality cameras bloom effects can still be observed, because light is scattered in the lens (and thus "bleeds out"). Our eyes are also not perfect, so all incoming light will scatter. The effect is just clearer with bright objects because they emit more photons. Bloom done right We live in a world where everybody in the graphics industry is using physically-based rendering models with HDR and tonemapping. So it makes sense, from a "modern" perspective, to compose a bloom effect which fits into such environments. The finer details differ, but the overall process is this: Scene with lighting applied is rendered into an HDR color buffer. To mimic how our eyes work, we do not use a color threshold, but instead downsample and blur directly on the HDR color buffer and store this result into a bloom buffer. We render a mix between the HDR color buffer and the bloom buffer, which is usually a linear interpolation with a strong bias (~0.04) towards the HDR color buffer. It may seem counter-intuitive to bloom the entire scene and not only the bright objects, but since we are composing a bloom effect for an HDR pipeline, this is not a problem. With HDR we usually have a huge range between dark and bright, and because the downsampling and blurring automatically favours the brighter colors, the effect on dark areas of the scene are barely noticable. So we get everything from a good bloom effect, but it's more physically correct, and we don't have to worry about defining a good color threshold. By reading this article, we can see that very large filter kernels such as 41x41 can be approximated quite well by applying a small filter kernel, such as 3x3, on a downsampled version of the image. This should be an order of magnitude faster since we are performing a lot fewer texture lookups. Naturally, this will depend on the resolution of the source texture, the filter kernel size, and the number of times we downsample. But in general, we will save a lot of computation! The quality of the bloom is highly dependent upon the downsampling filter, so we need to use a good one. Poorly designed filters lead to pulsating artifacts and temporal stability issues. The method that inspired this article was presented at ACM Siggraph in 2014 by Jorge Jimenez for Call of Duty: Advanced Warfare. The algorithm follows this recipe: Run a shader which downsamples (downscales) the HDR buffer containing per-pixel color with light and shadows applied. This shader is run a fixed number of times to continually produce a smaller image, each time with half resolution in both X and Y axes. We then run a small 3x3 filter kernel on each downsampled image, and progressively upsample them until we reach image A (first downsampled image). Finally, we mix the overall bloom contribution into the HDR source image, with a strong bias towards the HDR source. We can go smaller if we wish, e.g. by also having a texture "F". But for this drawing that would probably look too small. Also note that we are using the word "progressively" when we upsample - we are not upsampling from E → A, D → A, etc. - instead we perform the upsampling gradually up through the image chain. This will result in a much better blur. We also do not need to worry about running the 3x3 filter kernel several times on each image, as the downsampling and upsampling will result in blur that closely resembles a gaussian filter. Downsampling Now that we have the algorithm in place we just need to figure out which filter kernels to use. Fortunately, the people at Sledgehammer Games did the hard work for us. They present a customly designed downsample kernel that perform 13 texture lookups around the current pixel and blends the values using a weighted average. The number 13 really is the number of lookups applied with bi-linear filtering enabled, so in reality the shader performs 36 lookups. :) The above image deserves some explanation: The lookup pattern is divided into 5 colored regions. The center pixel, which corresponds to the "current pixel", has 4 colored rings on top of each other. As shown with text, the 4 red texels should contribute to 0.5 of the final contribution, such that texels closer to the center pixel will be weighted higher. You may take a look at the slides from the 2014 presentation, which provides a little more information. The below code is the downsample fragment shader. I have added some thorough documentation (encouraged software development practice btw! :)) to help you understand how the filtering works: #version 330 core // This shader performs downsampling on a texture, // as taken from Call Of Duty method, presented at ACM Siggraph 2014. // This particular method was customly designed to eliminate // "pulsating artifacts and temporal stability issues". // Remember to add bilinear minification filter for this texture! // Remember to use a floating-point texture format (for HDR)! // Remember to use edge clamping for this texture! uniform sampler2D srcTexture; uniform vec2 srcResolution; in vec2 texCoord; layout (location = 0) out vec3 downsample; void main() { vec2 srcTexelSize = 1.0 / srcResolution; float x = srcTexelSize.x; float y = srcTexelSize.y; // Take 13 samples around current texel: // a - b - c // - j - k - // d - e - f // - l - m - // g - h - i // === ('e' is the current texel) === vec3 a = texture(srcTexture, vec2(texCoord.x - 2*x, texCoord.y + 2*y)).rgb; vec3 b = texture(srcTexture, vec2(texCoord.x, texCoord.y + 2*y)).rgb; vec3 c = texture(srcTexture, vec2(texCoord.x + 2*x, texCoord.y + 2*y)).rgb; vec3 d = texture(srcTexture, vec2(texCoord.x - 2*x, texCoord.y)).rgb; vec3 e = texture(srcTexture, vec2(texCoord.x, texCoord.y)).rgb; vec3 f = texture(srcTexture, vec2(texCoord.x + 2*x, texCoord.y)).rgb; vec3 g = texture(srcTexture, vec2(texCoord.x - 2*x, texCoord.y - 2*y)).rgb; vec3 h = texture(srcTexture, vec2(texCoord.x, texCoord.y - 2*y)).rgb; vec3 i = texture(srcTexture, vec2(texCoord.x + 2*x, texCoord.y - 2*y)).rgb; vec3 j = texture(srcTexture, vec2(texCoord.x - x, texCoord.y + y)).rgb; vec3 k = texture(srcTexture, vec2(texCoord.x + x, texCoord.y + y)).rgb; vec3 l = texture(srcTexture, vec2(texCoord.x - x, texCoord.y - y)).rgb; vec3 m = texture(srcTexture, vec2(texCoord.x + x, texCoord.y - y)).rgb; // Apply weighted distribution: // 0.5 + 0.125 + 0.125 + 0.125 + 0.125 = 1 // a,b,d,e * 0.125 // b,c,e,f * 0.125 // d,e,g,h * 0.125 // e,f,h,i * 0.125 // j,k,l,m * 0.5 // This shows 5 square areas that are being sampled. But some of them overlap, // so to have an energy preserving downsample we need to make some adjustments. // The weights are the distributed, so that the sum of j,k,l,m (e.g.) // contribute 0.5 to the final color output. The code below is written // to effectively yield this sum. We get: // 0.125*5 + 0.03125*4 + 0.0625*4 = 1 downsample = e*0.125; downsample += (a+c+g+i)*0.03125; downsample += (b+d+f+h)*0.0625; downsample += (j+k+l+m)*0.125; } Upsampling The upsampling shader works on the opposite way, ie. progressively blur and upsample. From the previous figure, using the letters A-E, this is the flow: E' = E D' = D + blur(E', b4) C' = C + blur(D', b3) B' = B + blur(C', b2) A' = A + blur(B', b1) Fullres = mix(FullRes, A', bloomStrength) This means that we blur as we upsample, using a 3x3 filter kernel. E.g. when we perform the second line, we have D bound as target (color attachment 0) and then we sample into E, with a 3x3 kernel around the current pixel, using b4 as a radius to spread out the lookup texel positions. An important detail is that we need a different radius for each upsample, with larger radii on larger mips. So by using a radius in texel space, the radius will automatically grow during the upsampling procedure. The upsampling fragment shader is shown here: #version 330 core // This shader performs upsampling on a texture, // as taken from Call Of Duty method, presented at ACM Siggraph 2014. // Remember to add bilinear minification filter for this texture! // Remember to use a floating-point texture format (for HDR)! // Remember to use edge clamping for this texture! uniform sampler2D srcTexture; uniform float filterRadius; in vec2 texCoord; layout (location = 0) out vec3 upsample; void main() { // The filter kernel is applied with a radius, specified in texture // coordinates, so that the radius will vary across mip resolutions. float x = filterRadius; float y = filterRadius; // Take 9 samples around current texel: // a - b - c // d - e - f // g - h - i // === ('e' is the current texel) === vec3 a = texture(srcTexture, vec2(texCoord.x - x, texCoord.y + y)).rgb; vec3 b = texture(srcTexture, vec2(texCoord.x, texCoord.y + y)).rgb; vec3 c = texture(srcTexture, vec2(texCoord.x + x, texCoord.y + y)).rgb; vec3 d = texture(srcTexture, vec2(texCoord.x - x, texCoord.y)).rgb; vec3 e = texture(srcTexture, vec2(texCoord.x, texCoord.y)).rgb; vec3 f = texture(srcTexture, vec2(texCoord.x + x, texCoord.y)).rgb; vec3 g = texture(srcTexture, vec2(texCoord.x - x, texCoord.y - y)).rgb; vec3 h = texture(srcTexture, vec2(texCoord.x, texCoord.y - y)).rgb; vec3 i = texture(srcTexture, vec2(texCoord.x + x, texCoord.y - y)).rgb; // Apply weighted distribution, by using a 3x3 tent filter: // 1 | 1 2 1 | // -- * | 2 4 2 | // 16 | 1 2 1 | upsample = e*4.0; upsample += (b+d+f+h)*2.0; upsample += (a+c+g+i); upsample *= 1.0 / 16.0; } Both the upsampling and downsampling shaders need a vertex shader which fills out a screen-filled quad: #version 330 core layout (location = 0) in vec2 aPosition; layout (location = 1) in vec2 aTexCoord; out vec2 texCoord; void main() { gl_Position = vec4(aPosition.x, aPosition.y, 0.0, 1.0); texCoord = aTexCoord; } Writing the program Now that we have the shaders and the algorithm out of the way, we need to define the CPU-side of things as well. We need 1 framebuffer for the downsamping and upsampling, create some textures to contain the mips, two shader programs, a prerendered HDR color buffer, and some geometry to render. I will not be demonstrating in this tutorial how to do the last 2 things, as I consider that trivial or out of scope :). For the bloom framebuffer I decided to go for a minimalistic object-oriented approach, but you are welcome to structure this in any way that you see fit. struct bloomMip { glm::vec2 size; glm::ivec2 intSize; unsigned int texture; }; class bloomFBO { public: bloomFBO(); ~bloomFBO(); bool Init(unsigned int windowWidth, unsigned int windowHeight, unsigned int mipChainLength); void Destroy(); void BindForWriting(); const std::vector<bloomMip>& MipChain() const; private: bool mInit; unsigned int mFBO; std::vector<bloomMip> mMipChain; }; The most important method here is the Init function. It creates mips from a fixed screen resolution, and a number of mips which corresponds to the letters A-E described earlier. You may go as small as you wish, though 5 or 6 is usually good enough. If you go too small, make sure that you stop when you reach 1x1 in mip size! bool bloomFBO::Init(unsigned int windowWidth, unsigned int windowHeight, unsigned int mipChainLength) { if (mInit) return true; glGenFramebuffers(1, &mFBO); glBindFramebuffer(GL_FRAMEBUFFER, mFBO); glm::vec2 mipSize((float)windowWidth, (float)windowHeight); glm::ivec2 mipIntSize((int)windowWidth, (int)windowHeight); // Safety check if (windowWidth > (unsigned int)INT_MAX || windowHeight > (unsigned int)INT_MAX) { std::cerr << "Window size conversion overflow - cannot build bloom FBO!\n"; return false; } for (unsigned int i = 0; i < mipChainLength; i++) { bloomMip mip; mipSize *= 0.5f; mipIntSize /= 2; mip.size = mipSize; mip.intSize = mipIntSize; glGenTextures(1, &mip.texture); glBindTexture(GL_TEXTURE_2D, mip.texture); // we are downscaling an HDR color buffer, so we need a float texture format glTexImage2D(GL_TEXTURE_2D, 0, GL_R11F_G11F_B10F, (int)mipSize.x, (int)mipSize.y, 0, GL_RGB, GL_FLOAT, null'''
