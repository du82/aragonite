full_description = "About About Hi, my name is Joey de Vries and I'm the sole author of LearnOpenGL. As you have probably guessed, I'm a computer graphics enthusiast. Computer graphics have always been a strong interest of mine, either because I enjoyed the visuals of movie effects and video games, or simply liked moving pixels. It wasn't until joining a computer science program at Utrecht University that I started to take programming and computer graphics seriously. I developed a strong eagerness to learn computer graphics (specifically OpenGL) and video game development, honing these skills as a hobby alongside my studies; using a multitude of online tutorials similar to sites like this. However, I always felt that the available online tutorials regarding OpenGL were either incomplete, contained errors or try to be overly complicated for no good reason. Therefore, it's always been in my mind to set up an OpenGL tutorial resource one day that tries to overcome these hurdles. Around June 2014 I published this website and started generating a large batch of content for everyone to enjoy. I am continuously striving to create one of the best OpenGL resources while also making it easy-to-understand and fun to learn. This means I will try to add as much content as I see fit and frequently revisit old chapters to improve their content. By now I have over 5 years of professional industry experience, both in WebGL/OpenGL and as a AAA game engine developer. This experience translates in continuous improvements on Learn OpenGL as I fix mistakes, improve explanations, and learn better approaches to teaching. Let me know what you think of the site in the comments or by contacting me personally and let's try to together make this the number one resource for learning modern OpenGL! All code samples, unless explicitly stated otherwise, are licensed under the terms of the CC BY-NC 4.0 license as published by Creative Commons, either version 4 of the License, or (at your option) any later version. You can find a human-readable format of the license here and the full license here. Similarly, all images (and videos) are licensed under the terms of the CC BY 4.0 license as published by Creative Commons, either version 4 of the License, or (at your option) any later version. You can find a human-readable format of the license here and the full license here. When attributing any of the licensed works, please include a copyright notice including a (hyper)link to the copyrighted work and a link to the specific license. Please also mention my full name (Joey de Vries), this website (or a link to the relevant article where applicable), and my personal twitter handle: https://twitter.com/JoeyDeVriez."
