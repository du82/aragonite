title = "LearnOpenGL - Area Lights"
description = "Learn OpenGL . com provides good and clear modern 3.3+ OpenGL tutorials with clear examples. A great resource to learn modern OpenGL aimed at beginners."
full_description = '''Area Lights Guest-Articles/2022/Area-Lights Sponza scene illuminated by a textured, rectangular area light. [1] Introduction We want lights. And we want them everywhere. In the basic tutorial series 3 distinct light types have been presented thoroughly: directional lights, point lights, and spotlights. And while we can achieve good results with them, they all have a major drawback: Light sources in the real world are (almost) never restricted to a single (infinitely-small) point - rather they usually cover an area. But we cannot easily represent such a light source using those 3 basic types of light. Imagine if we wanted to display a rectangular light source: It would require us to place hundreds, if not thousands, of tiny spot lights next to each other in a close uniform grid. Besides the obvious loss of rendering efficiency the result would likely not be very good, and if the camera would be very close to the area light source we would probably need even more small lights in that area. And this is not even taking into account the amount of over- illumination which would most likely appear, so each light would have to be dimmed quite a lot for all these lights to give a combined, realistic appearance. Clearly, this is not desirable. With raytracing this problem can be solved quite straight-forward by Monte-Carlo sampling, but assuming most readers in here are interested in real-time applications (ie. games), this is not really of much relevance to us. (yet!) This tutorial describes how to render area light sources from arbitrarily convex polygons using a method called ”Linearly Transformed Cosines”, originally published in 2016 by Eric Heitz, Jonathan Dupuy, Stephen Hill, and David Neubelt. Later extensions have been made to this method to support circular shapes in addition to rectangular or sharp-edged polygons. In this article, we will look at the theory behind implementing rectangular area lights. Prerequisites This method builds upon physically-based rendering techniques (PBR), so familiarity with the core concepts is recommended for an optimal learning experience. It is also very math-heavy, so familiarity with several mathematical concepts is recommended for a full learning experience, including: Integrals, linear algebra, trigonometry, solid angle measurement, and distributions. But if you simply want to implement it and see it working then you may copy/paste the code snippets. This stuff is very advanced, and while studying the mathematics can be worthwhile, you are certainly not expected to understand it all. Some clever researchers did the hard work for us, so that our rendering applications can look cool! :) You may also have noticed that the cover image has a textured light source. This article will not go into details on how to accomplish this, although it might be touched upon in a future chapter. So let's get started... Problem description Let’s say we have a scene, and we place a rectangle in the scene at some position in close proximity to our game objects. We wish for this rectangle to represent a light source and thus, emit light. We also have our BRDF, which describes how the surfaces in the scene scatter light. So given incoming radiance from the light source around a given shading point (ie. a fragment), we need to solve the integral of the BRDF, over the spherical polygon, as the solid angle of the light source polygon subtended at the unit hemisphere around the shading point, to calculate the outgoing radiance. This outgoing radiance is what will reflect back to our eyes and thusly illuminate the scene. The article which introduced this method describes how a linear transformation, represented by a 3x3 matrix, can be applied to a distribution thus yielding a new family of distributions which share some core properties. These properties are very well-explained in Eric Heitz’ presentation slides [3]. But since this is meant to be a programming guide primarily, we will not discuss their derivations here. The new family of distributions have been conveniently dubbed ”Linearly Transformed Cosines”, because a clamped cosine distribution (by choice) has been applied a linear transformation, while retaining the important properties which makes them a suitable approximation to physically-based BRDFs. ”Clamped” refers to a cosine distribution (or ”Lambertian” distribution), which has been clamped to the hemisphere. This is important since unit sphere solid angle measures are in the interval [0, 4π], while a light source should probably never illuminate objects facing away from them; thus we clamp the distribution to the ”upper” hemisphere (oriented around the surface normal of the incident shading point). Well-known BRDFs, such as the GGX microfacet model, have sophisticated shapes that support anisotropic stretching at grazing angles, skewness, and varying degrees of material roughnesses, among others. It is due to these properties that BRDFs yield realistically-looking results. So if we can design a linear transformation that adds these properties to the cosine distribution, through matrix-multiplication, then we can obtain these desired properties. The article [1] describes how this is possible. The cosine distribution is a very good choice because we have a closed-form representation of its integral: \[ D_o(\omega_o) = \dfrac{1}{\pi}cos \theta_o \] In summary, our strategy is this: Construct a 3x3 matrix which represents our BRDF, use it to transform a clamped cosine distribution, and then compute the solid angle measure through the closed-form representation. You may remember from linear algebra that if we multiply two matrices A and B, we may also perform an ”inverse” operation (given that B is invertible): \[ A \times B = C \qquad \Leftrightarrow \qquad C \times B^{-1} = A \] If our linear transformation matrix, M, is applied to our cosine distribution to yield our BRDF-approximation, then we may compute in reverse order, allowing us to elegantly solve the integral. This idea is illustrated below. As the authors suggest, we may think of this as transforming back to cosine space. Inverse transformation back to cosine space, using the inverse linear transformation matrix. Taken from [2]. Construction of the transformation matrix The linear transformation matrix M needs to represent the BRDF, parameterized over both the viewing angle and the material roughness. The following images illustrate the idea: Constructing the linear transformation by a chained matrix-multiplication to represent desired features of a BRDF. [2] The roughness parameter is directly translated to the value from the material’s roughness texture found in a typical PBR-pipeline, and the anisotropy and skewness stretches and skews the reflected highlight at increasingly grazing viewing angles for realistic renderings. As illustrated, we may choose an arbitrary amount of transformations, depending on our requirements and the specific BRDF model we wish to represent. In this tutorial we will use a matrix which approximates (but not perfectly replicates) the GGX microfacet model. As mentioned, we need 1 matrix M, for each combination of material roughness and viewing angle, which directly translates to 1 matrix M for each shaded fragment! Not only that, but we need to sample the matrix several times and minimize the error compared to our chosen BRDF. Clearly, this is not doable for real-time purposes, so the matrix M needs to be precomputed for each roughness/view-angle pair. Since both the matrix M and its inverse are sparse matrices with 5 non-zero values, we can store the inverted matrix in a 4-vector by normalizing by the middle field. This works well in pratice and neatly allows us to send the matrices to the GPU in a 2D-texture. We choose a 64x64 texture to save memory bandwith, and because it yields acceptable results. Computing the integral To compute the integral, we can calculate a sum of integrals over the boundary edges of the spherical polygon. This may sound like sorcery, and without making this tutorial too lengthy I will quote the presentation slides [2] and encourage the reader to investigate further: ”One way to think about it is as an application of Stoke’s theorem, which you might have encountered in other areas, such as fluid simulation.” Stoke's Theorem states that "a line integral of a vector field over a loop is equal to the flux of its curl through the enclosed surface." (source: Wikipedia [11]). Given a boundary edge of the polygon, defined by vertices v1 and v2, we calculate the edge’s integral as follows: \[ acos(v_1 \cdot v_2) \dfrac{v_1 \times v_2}{|| v_1 \times v_2 ||} \cdot n \] And for a light polygon with N edges we can quite accurately calculate the solid angle of the polygon by summing the edge integrals: \[ \int_{\Omega}\, \approx \, \frac{1}{2\pi} \sum_{i=1}^{N} \left[ acos(v_1 \cdot v_2) \dfrac{v_1 \times v_2}{|| v_1 \times v_2 ||} \cdot n \right] \] Here the vectors v1 and v2 are direction vectors from the shading point to the polygon edge’s vertices, the ”acos(v1 · v2 )” is the arc length in radians of the polygon edge projected onto the unit sphere situated about the shading point, and the normalized cross product yields a vector, u, which is perpendicular to v1 and v2 . We dot with the normal vector of the shading point to project onto the plane that is tangent to the shading point and which has normal vector n. The subtended area integral is computed from the sum of edge integrals, by application of Stoke's Theorem. Images taken from [2]. As described in [2], the authors found significant visual artifacts when computing the edge integrals, because of missing precision found in the acos function. So instead they introduced a cubic function which approximates acos. The function for calculating the edge integral with the cubic function is shown below in glsl-code. This function differs from the cubic fit originally introduced in [2]. This optimized version is a later iteration, and yields a better fit. vec3 IntegrateEdge(vec3 v1, vec3 v2, vec3 N) { float x = dot(v1, v2); float y = abs(x); float a = 0.8543985 + (0.4965155 + 0.0145206*y)*y; float b = 3.4175940 + (4.1616724 + y)*y; float v = a / b; float theta sintheta = (x > 0.0) ? v : 0.5*inversesqrt(max(1.0 - x*x, 1e-7)) - v; return dot(cross(v1, v2)*theta sintheta, N); } Clip polygon to upper hemisphere The IntegrateEdge function shown above is, although a very good solution, not perfect. In order to get the correct radiance calculation we need to clamp the transformed cosine distribution to the upper hemisphere. This process may also be referred to as ”horizon-clipping”, and involves a lot of branching. See this image below: If the light source moves below, or partially below, the horizon, it needs to be clipped, which in practice involves moving the lower vertices of each edge upwards such that they are no longer below the horizon. And if an edge is entirely situated below the horizon its vertices will be situated atop of each other. In either case the computed edge integral will yield a lower (or possibly zero) value resulting in less outgoing radiance. But if we need to make a comparison for each vertex of all edges then we will end up with heavily branched code, which is always bad in a fragment shader. So instead we will modify our formula for the edge integral by removing the dot product with the surface normal (and thus not project onto the plane). The formula now looks like this: \[ acos(v_1 \cdot v_2) \dfrac{v_1 \times v_2}{|| v_1 \times v_2 ||} \] This gives us a vector form instead, which we may think of as a vector form factor, or vector irradiance, and it has a neat property: The length of this vector is the form factor of the light polygon, in the direction of this vector. Let’s call this vector ”F ”. We can use F to compute the angular extent and elevation angle by constructing a ”proxy sphere” around our current shading point. The formulas are shown below: \[ F = acos(v_1 \cdot v_2) \dfrac{v_1 \times v_2}{|| v_1 \times v_2 ||} \] \[ length(F) \rightarrow \text{form factor in direction of } F \] \[ \text{angular extent} = asin(sqrt(length(F)) \] \[ \text{elevation angle} = dot(N, normalize(F)) \] This can help us since we have a couple of analytical solutions for horizon-clipped sphere form factors. So by precomputing the form factors for spheres of different angular extents and elevation angles, we can make an additional texture lookup at runtime to fetch clipped form factors, thereby efficiently solving our problem of horizon-clipping by close approximation. More details are found in the slides [2], as well as in the article [1]. A form factor is an expression of the amount of outgoing energy or "radiance", which emitted from a patch A1 reaches another patch A2. This is quite similar to how we subtend the area light polygon on a half-sphere around each shading point. Each form factor is stored in a 64x64 LUT, indexed by angular extent and elevation angle. We are using the term irradiance, because we focus on the incoming light energi. A more comprehensive introduction to form factors may be found in [13]. Putting it all together Congratulations if you were able to follow along so far. This is quite math heavy, so don’t worry if you didn’t understand everything. You may safely copy/paste the code examples and get it working yourself, and if you are feeling adventurous then you are warmly recommended to go through the source material yourself, linked at the bottom of this page. The mathematics will never lose relevance. But for now, let’s progress to the fun part! :) Our first step is loading the matrices onto the GPU as 2D-textures. We should remember to enable bilinear filtering for the smoothest results, and edge-clamping in case we were to index out-of-bounds of the texture: #include "ltc_matrix.hpp" // contains float arrays LTC1 and LTC2 unsigned int loadMTexture(float* matrixTable) { unsigned int texture = 0; glGenTextures(1, &texture); glBindTexture(GL_TEXTURE_2D, texture); glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, 64, 64, 0, GL_RGBA, GL_FLOAT, matrixTable); glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE); glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE); glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST); glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR); glBindTexture(GL_TEXTURE_2D, 0); return texture; } unsigned int m1 = loadMTexture(LTC1); unsigned int m2 = loadMTexture(LTC2); We use this function for the inverted transformation matrices. The authors have kindly precomputed them for us, and they can be found here, or you can generate them yourself by downloading the source code from [4]. We can either load them as a DXT10- compressed images (.dds), or we can include them as c++-headers. I have chosen the latter, because unfortunately DXT10-compression is unsupported in majority of image loading libraries (the file header is not standardized!).'''
