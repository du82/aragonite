["https://learnxinyminutes.com/cs/markdown"]
title = "Learn Markdown in Y Minutes"
full_description = "Markdown byl vytvořen Johnem Gruberem v roce 2004 jako značkovací jazyk, který lze snadno číst a psát a který je možné jednoduše převést do HTML (a dnes i do mnoha dalších formátů). Implementace markdownu se v různých parserech (syntaktických analyzátorech, které markdown dále zpracovávají) mírně odlišuje. V této příručce se snažíme upozorňovat, kdy se jedná o obecnou vlastnost markdownu a kdy se jedná o specifickou vlastnost daného parseru. Markdown je nadstavba HTML. To znamená, že každý HTML kód je zároveň validním kódem v Markdownu. HTML elementy <h1> až <h6> vytvoříte jednoduše tak, že nadpisu předsadíte takový počet křížků (#), jaký odpovídá úrovni nadpisu. Odstavce tvoří jeden nebo více řádků textu, oddělených jedním nebo více prázdnými řádky. Pokud byste chtěli vložit HTML element <br />, můžete na konec odstavce napsat dvě nebo více mezer a potom začít nový odstavec. Vytvořit lze i zaškrtávací seznamy. Takto lze vytvořit seznam s HTML checkboxy. (Boxy níže bez 'x' jsou nezaškrtnuté checkboxy.) Bloky kódu můžete označit tak, že řádek odsadíte čtyřmi mezerami nebo pomocí tabu. Pro interpretaci kódu parser používá <code> element. Jednořádkový kód můžete zabalit do dvou zpětných apostrofů (`) tak, jako kdybyste text normálně stylovali: Text výše nepotřebuje čtyřmezerové odsazení a parser navíc použije zvýraznění syntaxe pro zvolený jazyk. Vodorovnou oddělovací čáru lze snadno přidat pomocí 3 nebo více hvězdiček (nebo pomlček), a to buď s mezerami mezi jednotlivými znaky, nebo bez nich. Kombinace seznamů, odkazů a nadpisů využívají také některé parsery pro generování obsahu Markdown souborů. Jako identifikátory slouží jména nadpisů psané malými písmeny, které jsou uvozené křížkem (#). Víceslovné nadpisy bývají propojeny pomlčkou (-), která někdy nahrazuje i speciální znaky. Jiné speciální znaky mohou být vynechány."
