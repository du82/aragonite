["https://learnxinyminutes.com/ada"]
title = "Learn Ada in Y Minutes"
full_description = "Ada is a strong statically typed imperative, object-oriented, real-time, parallel and distributed programming language from the Pascal/Algol family of languages, but nowadays, it only has a passing resemblance to Pascal, with the only remnants left being the begin/end keyword pair, the := assignment symbol, records and if/case control statement structures. Ada was originally designed to be an object-based language and to replace 100's of languages in use by the US government. This means that all entities are objects, not in the object-oriented sense. The language became Object-Oriented in 1995, and added interfaces derived from Java in 2005. Contract based programming was introduced with Ada 2012. Ada was designed to be easy to read and learn, even for non-programmers, e.g. management within an organisation, therefore programs written in the language tend to be a bit more verbose. Ada is a modern programming language, and now has a package manager like other modern languages, Alire, see below. Now, that's a lot of information for a basic intro to Ada, and I've only touched the surface, there's much more to look at in the references section below. I haven't even touched on dynamic memory allocation which includes pools, this is because for the most part, Ada programs don't need it, you can do a lot without it. As I stated above, Ada barely looks like Pascal and if you look at the original Green specification (Warning: Huge 4575 page scanned PDF - starting on page 460), it looks nothing like it at all (page 505 of that PDF). The above source code will compile, but also will give warnings showing the power of the strong static type system. If you already have the GNAT toolchain installed, you can cut and paste the above into a new file, e.g. learn-ada-in-y.ada and then run the following: N.B. Alire will automatically install the toolchain for you if you don't have one installed and will ask you to select which you want to use. Such comments would require a closing comment delimiter and this would again raise the dangers associated with the (unintentional) omission of the closing delimiter: entire sections of a program could be ignored by the compiler without the programmer realizing it"
