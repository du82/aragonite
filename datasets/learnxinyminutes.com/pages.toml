["https://learnxinyminutes.com/ca/go"]
title = "Learn Go in Y Minutes"
full_description = '''Go es va crear degut a la necessitat de fer la feina ràpidament. No segueix la darrera tendència en informàtica, però és la nova forma i la més ràpida de resoldre problemes reals. Té conceptes familiars de llenguatges imperatius amb tipat estàtic. És ràpid compilant i ràpid al executar, afegeix una forma fàcil d'entedre de concurrència per CPUs de diferents núclis i té característiques que ajuden en la programació a gran escala. L'arrel de tot en Go és la web oficial official Go web site. Allà es pot seguir el tutorial, jugar interactivament i llegir molt més del que hem vist aquí.En el "tour", the docs conté informació sobre com escriure codi net i efectiu en Go, comandes per empaquetar i generar documentació, i història de les versions. És altament recomanable llegir La definició del llenguatge. És fàcil de llegir i sorprenentment curta (com la definició del llenguatge en aquests dies). Es pot jugar amb codi a Go playground. Prova de fer canvis en el codi i executar-lo des del navegador! Es pot fer servir https://go.dev/play/ com a REPL per provar coses i codi en el navegador sense haver d'instal·lar Go. En la llista de lectures pels estudiants de Go hi ha el codi font de la llibreria estàndard. Ampliament comentada, que demostra el fàcil que és de llegir i entendre els programes en Go, l'estil de programació, i les formes de treballar-hi. O es pot clicar en un nom de funció en la documentació i veure'n el codi! Go Mobile afegeix suport per plataformes mòbils (Android i iOS). Es poden escriure aplicacions mòbils o escriure llibreries de paquets de Go, que es poden cridar des de Java (android) i Objective-C (iOS). Comproveu la Go Mobile page per més informació. Got a suggestion? A correction, perhaps? Open an Issue on the GitHub Repo, or make a pull request yourself! © 2025 Sonia Keys, Christopher Bess, Jesse Johnson, Quint Guvernator, Jose Donizetti, Alexej Friesen, Clayton Walker, Leonid Shevtsov'''
