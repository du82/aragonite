["https://learnxinyminutes.com/compojure"]
title = "Learn Compojure in Y Minutes"
full_description = "Compojure apps will run on any ring-compatible server, but we recommend http-kit for its performance and massive concurrency. In compojure, each route is an HTTP method paired with a URL-matching pattern, an argument list, and a body. Clojure uses Ring for routing. Handlers are just functions that accept a request map and return a response map (Compojure will turn strings into 200 responses for you). You can easily write middleware that wraps all or part of your application to modify requests or responses: The return value of a route block determines the response body passed on to the HTTP client, or at least the next middleware in the ring stack. Most commonly, this is a string, as in the above examples. But, you may also return a response map: To serve up static files, use compojure.route.resources. Resources will be served from your project's resources/ folder. Got a suggestion? A correction, perhaps? Open an Issue on the GitHub Repo, or make a pull request yourself!"
