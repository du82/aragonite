["https://learnxinyminutes.com/javascript"]
title = "Learn JavaScript in Y Minutes"
full_description = "JavaScript was created by Netscape's Brendan Eich in 1995. It was originally intended as a simpler scripting language for websites, complementing the use of Java for more complex web applications, but its tight integration with Web pages and built-in support in browsers has caused it to become far more common than Java in web frontends. JavaScript isn't just limited to web browsers, though: Node.js, a project that provides a standalone runtime for Google Chrome's V8 JavaScript engine, is becoming more and more popular. JavaScript has a C-like syntax, so if you've used languages like C or Java, a lot of the basic syntax will already be familiar. Despite this, and despite the similarity in name, JavaScript's object model is significantly different to Java's. The Mozilla Developer Network (MDN) provides excellent documentation for JavaScript as it's used in browsers. MDN's A re-introduction to JavaScript covers much of the concepts covered here in more detail. This guide has quite deliberately only covered the JavaScript language itself; if you want to learn more about how to use JavaScript in web pages, start by learning about the Document Object Model. javascript.info is a modern JavaScript tutorial covering the basics (core language and working with a browser) as well as advanced topics with concise explanations. Got a suggestion? A correction, perhaps? Open an Issue on the GitHub Repo, or make a pull request yourself!"
