["https://learnxinyminutes.com/ca/html"]
title = "Learn HTML in Y Minutes"
full_description = "És un llenguatge que permet escriure pàgines pel sistema web (World Wide Web). És un llenguatge de marques que permet escriure pàgines web fent servir codi per indicar com s'ha de visualitzar el text i les dades. De fet, els fitxers html són simples fitxers de text. Què són les 'marques'? Són un mètode d'organitzar les dades d'una pàgina mitjançant etiquetes d'obertura i tancament. Aquestes marques serveixen per donar significat al text que hi ha entre les etiquetes. Com d'altres llenguatges de marques, hi ha moltes versions de l'HTML. Aquí es desenvoluparà l'HTML5. NOTA: Pots provar les diferents etiquetes i elements a mesura que progressis a través del tutorial a pàgines web com codepen. D'aquesta manera podràs veure'n els efectes, entendre com funcionen i familiaritzar-te amb el llenguatge. Aquest article tracta principalment la sintaxi de l'HTML i alguns consells útils. Got a suggestion? A correction, perhaps? Open an Issue on the GitHub Repo, or make a pull request yourself!"
