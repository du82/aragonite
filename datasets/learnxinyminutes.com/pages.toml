["https://learnxinyminutes.com/ansible"]
title = "Learn Ansible in Y Minutes"
full_description = "Ansible is (one of many) orchestration tools. It allows you to control your environment (infrastructure and code) and automate the manual tasks. Ansible has great integration with multiple operating systems (even Windows) and some hardware (switches, Firewalls, etc). It has multiple tools that integrate with the cloud providers. Almost every noteworthy cloud provider is present in the ecosystem (AWS, Azure, Google, DigitalOcean, OVH, etc...). Migration - Ansible <-> Salt is fairly easy - so if you would need an event-driven agent environment - it would be a good choice to start quick with Ansible, and convert to Salt when needed. Ansible uses ssh or paramiko as a transport layer. In a way you can imagine that you are using a ssh with API to perform your action. The simplest way is to execute remote command in more controlled way (still using ssh). On the other hand - in advanced scope - you can wrap Ansible (use python Ansible code as a library) with your own Python scripts! It would act a bit like Fabric then. A program (usually python) that executes, does some work and returns proper JSON output. This program performs specialized task/action (like manage instances in the cloud, execute shell command). The simplest module is called ping - it just returns a JSON with pong message. Execution of a single Ansible module is called a task. The simplest module is called ping as you could see above. Another example of the module that allows you to execute a command remotely on multiple resources is called shell. See above how you were using them already. Execution plan written in a form of script file(s) is called playbook. Playbooks consist of multiple elements - Playbook script language is YAML. You can think that playbook is very advanced CLI script that you are executing. An inventory is a set of objects or hosts, against which we are executing our playbooks or single tasks via shell commands. For these few minutes, let's assume that we are using the default ansible inventory (which in Debian based system is placed in /etc/ansible/hosts)."
