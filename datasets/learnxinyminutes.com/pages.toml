["https://learnxinyminutes.com/amd"]
title = "Learn AMD in Y Minutes"
full_description = "The Asynchronous Module Definition API specifies a mechanism for defining JavaScript modules such that the module and its dependencies can be asynchronously loaded. This is particularly well suited for the browser environment where synchronous loading of modules incurs performance, usability, debugging, and cross-domain access problems. In contrast to the introductory example, require.js (the most popular AMD library) actually implements the A in AMD, enabling you to load modules and their dependencies asynchronously via XHR: By convention, you usually store one module in one file. require.js can resolve module names based on file paths, so you don't have to name your modules, but can simply reference them using their location. In the example someClass is assumed to be in the modules folder, relative to your configuration's baseUrl: require.js-based apps will usually have a single entry point (main.js) that is passed to the require.js script tag as a data-attribute. It will be automatically loaded and executed on pageload: Many people prefer using AMD for sane code organization during development, but still want to ship a single script file in production instead of performing hundreds of XHRs on page load. require.js comes with a script called r.js (that you will probably run in node.js, although Rhino is supported too) that can analyse your project's dependency graph, and build a single file containing all your modules (properly named), minified and ready for consumption. Got a suggestion? A correction, perhaps? Open an Issue on the GitHub Repo, or make a pull request yourself!"
