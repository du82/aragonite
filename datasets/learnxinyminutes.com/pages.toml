["https://learnxinyminutes.com/cmake"]
title = "Learn CMake in Y Minutes"
full_description = "CMake is a cross-platform, open-source build system. This tool allows you to test, compile, and create packages of your source code. The problem that CMake tries to solve is the problem of Makefiles and Autoconfigure on cross-platforms (different make interpreters have different commands) and the ease-of-use on linking 3rd party libraries. CMake is an extensible, open-source system that manages the build process in an operating system and compiler-agnostic manner. Unlike many cross-platform systems, CMake is designed to be used in conjunction with the native build environment. Simple configuration files placed in each source directory (called CMakeLists.txt files) are used to generate standard build files (e.g., makefiles on Unix and projects/workspaces in Windows MSVC) which are used in the usual way. Got a suggestion? A correction, perhaps? Open an Issue on the GitHub Repo, or make a pull request yourself!"
