["https://learnxinyminutes.com/cs/go"]
title = "Learn Go in Y Minutes"
full_description = "Jazyk Go byl vytvořen, jelikož bylo potřeba dokončit práci. Není to poslední trend ve světě počítačové vědy, ale je to nejrychlejší a nejnovější způsob, jak řešit realné problémy. Go používá známé koncepty imperativních jazyků se statickým typováním. Rychle se kompiluje a také rychle běží. Přidává snadno pochopitelnou podporu konkurenčnosti, což umožňuje využít výhody multi-core procesorů a jazyk také obsahuje utility, které pomáhají se škálovatelným programováním. Vše hlavní o Go se nachází na oficiálních stránkách go. Tam najdete tutoriály, interaktivní konzolu a mnoho materiálu ke čtení. Kromě úvodu, dokumenty tam obsahují jak psát čistý kód v Go popis balíčků (package), dokumentaci příkazové řádky a historii releasů. Také doporučujeme přečíst si definici jazyka. Je čtivá a překvapivě krátká. Tedy alespoň proti jiným současným jazyků. Pokud si chcete pohrát s Go, tak navštivte hřiště Go. Můžete tam spouštět programy s prohlížeče. Také můžete https://go.dev/play/ použít jako REPL, kde si v rychlosti vyzkoušíte věci, bez instalace Go. Na vašem knižním seznamu, by neměly chybět zdrojáky stadardní knihovny. Důkladně popisuje a dokumentuje Go, styl zápisu Go a Go idiomy. Pokud kliknete na dokumentaci tak se podíváte na dokumentaci. Go mobile přidává podporu pro Android a iOS. Můžete s ním psát nativní mobilní aplikace nebo knihovny, které půjdou spustit přes Javu (pro Android), nebo Objective-C (pro iOS). Navštivte web Go Mobile pro více informací. Máš připomínku, nebo si našel chybu? Otevři tiket v GitHub repozitáři, nebo pošli rovnou svojí úpravu! © 2025 Sonia Keys, Christopher Bess, Jesse Johnson, Quint Guvernator, Jose Donizetti, Alexej Friesen, Clayton Walker"
