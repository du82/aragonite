["https://learnxinyminutes.com/cs/javascript"]
title = "Learn JavaScript in Y Minutes"
full_description = "JavaScript byl vytvořen Brendanem Eichem v roce 1995 pro Netscape. Původně byl zamýšlen jako jednoduchý skriptovací jazyk pro webové stránky, jako doplněk Javy, která byla zamýšlena pro komplexnější webové aplikace. Úzké propojení JavaScriptu s webovými stránkami a vestavěná podpora v prohlížečích způsobila, že se stal ve webovém frontendu běžnějším než Java. JavaScript není omezen pouze na webové prohlížeče. Např. projekt Node.js, který zprostředkovává samostatně běžící prostředí V8 JavaScriptového jádra z Google Chrome se stává stále oblíbenější i pro serverovou část webových aplikací. Mozilla Developer Network obsahuje perfektní dokumentaci pro JavaScript, který je používaný v prohlížečích. Navíc je to i wiki, takže jakmile se naučíte více, můžete pomoci ostatním tím, že přispějete svými znalostmi. MDN's A re-introduction to JavaScript pojednává o konceptech vysvětlených zde v mnohem větší hloubce. Tento návod pokrývá hlavně JavaScript sám o sobě. Pokud se chcete naučit, jak se používá na webových stránkách, začněte tím, že se podíváte na DOM JavaScript: The Right Way je průvodcem JavaScriptem pro začínající vývojáře i pomocníkem pro zkušené vývojáře, kteří si chtějí prohloubit své znalosti. javascript.info je moderním JavaScriptovým průvodcem, který pokrývá základní i pokročilé témata velice výstižným výkladem. Jako dodatek k přímým autorům tohoto článku byly na těchto stránkách části obsahu převzaty z Pythonního tutoriálu Louiho Dinha, a tak0 z JS Tutorial na stránkách Mozilla Developer Network. Máš připomínku, nebo si našel chybu? Otevři tiket v GitHub repozitáři, nebo pošli rovnou svojí úpravu!"
