["https://learnxinyminutes.com/chapel"]
title = "Learn Chapel in Y Minutes"
full_description = "You can read all about Chapel at Cray's official Chapel website. In short, Chapel is an open-source, high-productivity, parallel-programming language in development at Cray Inc., and is designed to run on multi-core PCs as well as multi-kilocore supercomputers. This tutorial is for people who want to learn the ropes of chapel without having to hear about what fiber mixture the ropes are, or how they were braided, or how the braid configurations differ between one another. It won't teach you how to develop amazingly performant code, and it's not exhaustive. Refer to the language specification and the module documentation for more details. Occasionally check back here and on the Chapel site to see if more topics have been added or more tutorials created. The Chapel language is still in active development, so there are occasional hiccups with performance and language features. The more information you give the Chapel development team about issues you encounter or features you would like to see, the better the language becomes. There are several ways to interact with the developers: If you're really interested in the development of the compiler or contributing to the project, check out the master GitHub repository. It is under the Apache 2.0 License. Chapel can be built and installed on your average 'nix machine (and cygwin). Download the latest release version and it's as easy as You will need to source util/setchplenv.EXT from within the Chapel directory ($CHPL_HOME) every time your terminal starts so it's suggested that you drop that command in a script that will get executed on startup (like .bashrc). Got a suggestion? A correction, perhaps? Open an Issue on the GitHub Repo, or make a pull request yourself!"
