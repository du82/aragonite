title = "The Count of Applications | Learn You Some Erlang for Great Good!"
description = "A more advanced approach to applications. We take the application from the previous chapter and build a new one that depends on it"
full_description = '''Hey there, it appears your Javascript is disabled. That's fine, the site works without it. However, you might prefer reading it with syntax highlighting, which requires Javascript! The Count of Applications From OTP Application to Real Application Our ppool app has become a valid OTP application and we are now able to understand what this means. It would be nice to build something that actually uses our process pool to do anything useful, though. To push our knowledge of applications a bit further, we will write a second application. This one will depend on ppool, but will be able to benefit from some more automation than our 'nagger'. This application, that I will name erlcount, will have a somewhat simple objective: recursively look into some directory, find all Erlang files (ending in .erl) and then run a regular expression over it to count all instances of a given string within the modules. The results are then accumulated to give the final result, which will be output to the screen. This specific application will be relatively simple, relying heavily on our process pool instead. It will have a structure as follows: In the diagram above, ppool represents the whole application, but only means to show that erlcount_counter will be the worker for the process pool. This one will open files, run the regular expression and return the count. The process/module erlcount_sup will be our supervisor, and erlcount_dispatch will be a single server in charge of browsing the directories, asking ppool to schedule workers and compiling the results. We'll also add an erlcount_lib module, taking charge of hosting all the functions to read directories, compile data and whatnot, leaving the other modules with the responsibility of coordinating these calls. Last will be an erlcount module with the single purpose of being the application callback module. The first step, as for our last app, is to create the directory structure needed. You can also add a few file stubs if you feel like doing so: ebin/ - erlcount.app include/ priv/ src/ - erlcount.erl - erlcount_counter.erl - erlcount_dispatch.erl - erlcount_lib.erl - erlcount_sup.erl test/ Emakefile Nothing too different from what we had before, you can even copy the Emakefile we had before. We can probably start writing most parts of the application pretty quickly. The .app file, the counter, library and supervisor should be relatively simple. On the other hand, the dispatch module will have to accomplish some complex tasks if we want things to be worth it. Let's start with the app file: {application, erlcount, [{vsn, "1.0.0"}, {modules, [erlcount, erlcount_sup, erlcount_lib, erlcount_dispatch, erlcount_counter]}, {applications, [ppool]}, {registered, [erlcount]}, {mod, {erlcount, []}}, {env, [{directory, "."}, {regex, ["if\\s.+->", "case\\s.+\\sof"]}, {max_files, 10}]} ]}. This app file is a bit more complex than the ppool one. We can still recognize some of the fields as being the same: this app will also be in version 1.0.0, the modules listed are all the same as above. The next part is something we didn't have: an application dependency. As explained earlier, the applications tuple gives a list of all the applications that should be started before erlcount. If you try to start it without that, you'll get an error message. We then have to count the registered processes with {registered, [erlcount]}. Technically none of our modules started as part of the erlcount app will need a name. Everything we do can be anonymous. However, because we know ppool registers the ppool_serv to the name we give it and because we know we will use a process pool, then we're going to call it erlcount and note it there. If all applications that use ppool do the same, we should be able to detect conflicts in the future. The mod tuple is similar as before; we define the application behaviour callback module there. The last new thing in here is the env tuple. As seen earlier, this entire tuple gives us a key/value store for application-specific configuration variables. These variables will be accessible from all the processes running within the application, stored in memory for your convenience. They can basically be used as substitute configuration file for your app. In this case, we define three variables: directory, which tells the app where to look for .erl files (assuming we run the app from the erlcount-1.0 directory, this means the learn-you-some-erlang root), then we have max_files telling us how many file descriptors should be opened at once. We don't want to open 10,000 files at once if we end up have that many, so this variable will match the maximum number of workers in ppool. Then the most complex variable is regex. This one will contain a list of all regular expressions we want to run over each of the files to count the results. I won't get into the long explaining of the syntax of Perl Compatible Regular Expressions (if you're interested, the re module contains some documentation), but will still explain what we're doing here. In this case, the first regular expression says "look for a string that contains 'if' followed by any single white space character (\s, with a second backslash for escaping purposes), and finishes with ->. Moreover there can be anything in between the 'if' and the -> (.+)". The second regular expression says "look for a string that contains 'case' followed by any single whitespace character (\s), and finishes with 'of' preceded by single whitespace character. Between the 'case ' and the ' of', there can be anything (.+)". To make things simple, we'll try to count how many times we use case ... of vs. how many times we use if ... end in our libraries. Don't Drink Too Much Kool-Aid: Using regular expressions is not an optimal choice to analyse Erlang code. The problem is there are lots of cases that will make our results inaccurate, including strings in the text and comments that match the patterns we're looking for but are technically not code. To get more accurate results, we would need to look at the parsed and the expanded version of our modules, directly in Erlang. While more complex (and outside the scope of this text), this would make sure that we handle everything like macros, exclude comments, and just generally do it the right way. With this file out of the way, we can start the application callback module. It won't be complex, basically only starting the supervisor: -module(erlcount). -behaviour(application). -export([start/2, stop/1]). start(normal, _Args) -> erlcount_sup:start_link(). stop(_State) -> ok. And now the supervisor itself: -module(erlcount_sup). -behaviour(supervisor). -export([start_link/0, init/1]). start_link() -> supervisor:start_link(?MODULE, []). init([]) -> MaxRestart = 5, MaxTime = 100, {ok, {{one_for_one, MaxRestart, MaxTime}, [{dispatch, {erlcount_dispatch, start_link, []}, transient, 60000, worker, [erlcount_dispatch]}]}}. This is a standard supervisor, which will be in charge of only erlcount_dispatch, as it was shown on the previous little schema. The MaxRestart, MaxTime and the 60 seconds value for shutdown were chosen pretty randomly, but in real cases you'd want to study the needs you have. Because this is a demo application, it didn't seem that important at the time. The author keeps himself the right to laziness. We can get to the next process and module in the chain, the dispatcher. The dispatcher will have a few complex requirements to fulfill for it to be useful: When we go through directories to find files ending in .erl, we should only go through the whole list of directories once, even when we apply multiple regular expressions; We should be able to start scheduling files for result counting as soon as we find there's one that matches our criteria. We should not need to wait for a complete list to do so. We need to hold a counter per regular expression so we can compare the results in the end It is possible we start getting results from the erlcount_counter workers before we're done looking for .erl files It is possible that many erlcount_counters will be running at once It is likely we will keep getting result after we finished looking files up in the directories (especially if we have many files or complex regular expressions). The two big points we have to consider right now is how we're going to go through a directory recursively while still being able to get results from there in order to schedule them, and then accept results back while that goes on, without getting confused. At a first look, the way that looks the simplest to gain the ability to return results while in the middle of recursion would be to use a process to do it. However, it's a bit annoying to change our previous structure just to be able to add another process to the supervision tree, then to get them working together. There is, in fact, a simpler way to do things. This is a style of programming called Continuation-Passing Style. The basic idea behind it is to take one function that's usually deeply recursive and break every step down. We return each step (which would usually be the accumulator), and then a function that will allow us to keep going after that. In our case, our function will basically have two possible return values: {continue, Name, NextFun} done Whenever we receive the first one, we can schedule FileName into ppool and then call NextFun to keep looking for more files. We can implement this function into erlcount_lib: -module(erlcount_lib). -export([find_erl/1]). -include_lib("kernel/include/file.hrl"). %% Finds all files ending in .erl find_erl(Directory) -> find_erl(Directory, queue:new()). Ah, something new there! What a surprise, my heart is racing and my blood is pumping. The include file up there is something given to us by the file module. It contains a record (#file_info{}) with a bunch of fields explaining details about the file, including its type, size, permissions, and so on. Our design here includes a queue. Why is that? Well it is entirely possible that a directory contains more than one file. So when we hit a directory and it contains something like 15 files, we want to handle the first one (and if it's a directory, open it, look inside, etc.) and then handle the 14 others later. In order to do so, we will just store their names in memory until we have the time process them. We use a queue for that, but a stack or any other data structure would still be fine given we don't really care about the order in which we read files. Anyway, the point is, this queue acts a bit like a to-do list for files in our algorithm. Alright so let's start by reading the first file passed from the first call: %%% Private %% Dispatches based on file type find_erl(Name, Queue) -> {ok, F = #file_info{}} = file:read_file_info(Name), case F#file_info.type of directory -> handle_directory(Name, Queue); regular -> handle_regular_file(Name, Queue); _Other -> dequeue_and_run(Queue) end. This function tells us few things: we only want to deal with regular files and directories. In each case we will write ourselves a function to handle these specific occurrences (handle_directory/2 and handle_regular_file/2). For other files, we will dequeue anything we had prepared before with the help of dequeue_and_run/1 (we'll see what this one is about soon). For now, we first start dealing with directories: %% Opens directories and enqueues files in there handle_directory(Dir, Queue) -> case file:list_dir(Dir) of {ok, []} -> dequeue_and_run(Queue); {ok, Files} -> dequeue_and_run(enqueue_many(Dir, Files, Queue)) end. So if there are no files, we keep searching with dequeue_and_run/1, and if there are many, we enqueue them before doing so. Let me explain this. The function dequeue_and_run will take the queue of file names and get one element out of it. The file name it fetches out from there will be used by calling find_erl(Name, Queue) and we just keep going as if we were just getting started: %% Pops an item from the queue and runs it. dequeue_and_run(Queue) -> case queue:out(Queue) of {empty, _} -> done; {{value, File}, NewQueue} -> find_erl(File, NewQueue) end. Note that if the queue is empty ({empty, _}), the function considers itself done (a keyword chosen for our CPS function), otherwise we keep going over again. The other function we had to consider was enqueue_many/3. This one is designed to enqueue all the files found in a given directory and works as follows: %% Adds a bunch of items to the queue. enqueue_many(Path, Files, Queue) -> F = fun(File, Q) -> queue:in(filename:join(Path,File), Q) end, lists:foldl(F, Queue, Files). Basically, we use the function filename:join/2 to merge the directory's path to each file name (so that we get a complete path). We then add this new full path to a file to the queue. We use a fold to repeat the same procedure with all the files in a given directory. The new queue we get out of it is then used to run find_erl/2 again, but this time with all the new files we found added to the to-do list. Whoa, we digressed a bit. Where were we? Oh yes, we were handling directories and now we're done with them. We then need to check for regular files and whether they end in .erl or not. %% Checks if the file finishes in .erl handle_regular_file(Name, Queue) -> case filename:extension(Name) of ".erl" -> {continue, Name, fun() -> dequeue_and_run(Queue) end}; _NonErl -> dequeue_and_run(Queue) end. You can see that if the name matches (according to filename:extension/1), we return our continuation. The continuation gives the Name to the caller, and then wraps the operation dequeue_and_run/1 with the queue of files left to visit into a fun. That way, the user can call that fun and keep going as if we were still in the recursive call, while still getting results in the mean time. In the case where the file name doesn't end in .erl, then the user has no interest in us returning yet and we keep going by dequeuing more files. That's it. Hooray, the CPS thing is done. We can then focus on the other issue. How are we going to design the dispatcher so that it can both dispatch and receive at once? My suggestion, which you will no doubt accept because I'm the one writing the text, is to use a finite state machine. It will have two states. The first one will be the 'dispatching' state. It's the one used whenever we're waiting for our find_erl CPS function to hit the done entry. While we're in there, we will never think about us being done with the counting. That will only happen in the second and final state, 'listening', but we will still receive notices from ppool all the time: This will thus require us to have: A dispatching state with an asynchronous event for when we get new files to dispatch A dispatching state with an asynchronous event for when we are done getting new files A listening state with an asynchronous event for when we're done getting new files A global event to be sent by the ppool workers when they're done running their re'''
