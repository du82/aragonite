["https://learnyousomeerlang.com/common-test-for-uncommon-tests"]
title = "Common Test For Uncommon Tests | Learn You Some Erlang for Great Good!"
description = "A smooth introduction for Common Test, a testing framework for blackbox and whitebox testing in Erlang, including distributed tests."
full_description = '''Hey there, it appears your Javascript is disabled. That's fine, the site works without it. However, you might prefer reading it with syntax highlighting, which requires Javascript! Common Test for Uncommon Tests A few chapters ago, we've seen how to use EUnit to do unit and module testing, and even some concurrent testing. At that point, EUnit started to show its limits. Complex setups and longer tests that needed to interact between each other became problematic. Plus, there was nothing in there to handle our new knowledge of distributed Erlang and all of its power. Fortunately, there's another test framework that exists, this one more appropriate to the heavy lifting we now want to do. What is Common Test As programmers, we enjoy treating our programs as black boxes. Many of us would define the core principle behind a good abstraction as being able to replace whatever it is we've written by an anonymous black box. You put something in the box, you get something out of it. You don't care how it works on the inside, as long as you get what you want. In the testing world, this has an important connection to how we like to test systems. When we were working with EUnit, we've seen how to treat a module as a black box: you only test the exported functions and none of the ones inside, which are not exported. I've also given examples on testing items as a white box, like in the case of the process quest player module's tests, where we looked at the innards of the module to make its testing simpler. This was necessary because the interaction of all the moving parts inside the box made testing it from the outside very complex. That was for modules and functions. What if we zoom out a bit? Let's fiddle with our scope in order to see the broader picture. What if what we want to test is a library? What if it's an application? Even broader, what if it's a complete system? Then what we need is a tool that's more adept at doing something called system testing. EUnit is a pretty good tool for white box testing at a module level. It's a decent tool to test libraries and OTP applications. It's possible to do system testing and black box testing, but it's not optimal. Common Test, however, is pretty damn good at system testing. It's decent for testing libraries and OTP applications, and it's possible, but not optimal, to use it to test individual modules. So the smaller what you test is, the more appropriate (and flexible, and fun) EUnit will be. The larger your test is, the more appropriate (and flexible, and, uh, somewhat fun) Common Test will be. You might have heard of Common Test before and tried to understand it from the documentation given with Erlang/OTP. Then you likely gave up real quick. Don't worry. The problem is that Common Test is very powerful and has an accordingly long user guide, and that at the time of this writing, most of its documentation appears to be coming from internal documentation from the days when it was used only within the walls of Ericsson. In fact, its documentation is more of a reference manual for people who already understand it than a tutorial. In order to properly learn Common Test, we'll have to start from the simplest parts of it and slowly grow our way to system tests. Common Test Cases Before even getting started, I have to give you a little overview of how Common Test organises its things. First of all, because Common Test is appropriate for system testing, it will assume two things: We will need data to instantiate our stuff We will need a place to store all that side-effecty stuff we do, because we're messy people. Because of this, Common Test will regularly be organized as follows: The test case is the simplest one. It's a bit of code that either fails or succeeds. If the case crashes, the test is unsuccessful (how surprising). Otherwise, the test case is thought to be successful. In Common Test, test cases are single functions. All these functions live in a test suite (3), a module that takes care of regrouping related test cases together. Each test suite will then live in a directory, the Test Object Directory (2). The test root (1) is a directory that contains many test object directories, but due to the nature of OTP applications often being developed individually, many Erlang programmers tend to omit that layer. In any case, now that we understand that organisation, we can go back to our two assumptions (we need to instantiate stuff, and then mess stuff up). Each test suite is a module that ends with _SUITE. If I were to test the magic 8-ball application from last chapter, I might thus call my suite m8ball_SUITE. Related to that one is a directory called the data directory. Each suite is allowed to have one such directory, usually named Module_SUITE_data/. In the case of the magic 8-ball app, it would have been m8ball_SUITE_data/. That directory contains anything you want. What about the side-effects? Well because we might run tests many times, Common Test develops its structure a bit more: Whenever you run the tests, Common Test will find some place to log stuff (usually the current directory, but we'll see how to configure it later). When doing so, it will create a unique directory where you can store your data. That directory (Priv Dir above), along with the data directory, will be passed as part of some initial state to each of your tests. You're then free to write whatever you want in that private directory, and then inspect it later, without running the risk of overwriting something important or the results of former test runs. Enough with this architectural material; we're ready to write our first simple test suite. Create a directory named ct/ (or whatever you'd like, this is hopefully a free country, after all). That directory will be our test root. Inside of it, we can then make a directory named demo/ for the simpler tests we'll use as examples. This will be our test object directory. Inside the test object directory, we'll begin with a module named basic_SUITE.erl, to see the most basic stuff possible. You can omit creating the basic_SUITE_data/ directory — we won't need it for this run. Common Test won't complain. Here's what the module looks like: -module(basic_SUITE). -include_lib("common_test/include/ct.hrl"). -export([all/0]). -export([test1/1, test2/1]). all() -> [test1,test2]. test1(_Config) -> 1 = 1. test2(_Config) -> A = 0, 1/A. Let's study it step by step. First of all, we've got to include the file "common_test/include/ct.hrl". That file gives a few useful macros, and even though basic_SUITE doesn't use them, it's usually a good habit of including that file. Then we have the function all/0. That function returns a list of test cases. It's basically what tells Common Test "hey, I want to run these test cases!". EUnit would do it based on the name (*_test() or *_test_()); Common Test does it with an explicit function call. What about these _Config variables? They're unused for now, but for your own personal knowledge, they contain the initial state your test cases will require. That state is literally a proplist, and it initially contains two values, data_dir and priv_dir, the two directories we have for our static data and the one where we can mess around. We can run the tests either from the command line or from an Erlang shell. If you use the command line, you can call $ ct_run -suite Name_SUITE. In Erlang/OTP versions before R15 (released around December 2011), the default command was run_test instead of ct_run (although some systems had both already). The name was changed with the objective of minimizing the risk of name clashes with other applications by moving to a slightly less generic name. Running it, we find: ct_run -suite basic_SUITE ... Common Test: Running make in test directories... Recompile: basic_SUITE ... Testing ct.demo.basic_SUITE: Starting test, 2 test cases - - - - - - - - - - - - - - - - - - - - - - - - - - basic_SUITE:test2 failed on line 13 Reason: badarith - - - - - - - - - - - - - - - - - - - - - - - - - - Testing ct.demo.basic_SUITE: *** FAILED *** test case 2 of 2 Testing ct.demo.basic_SUITE: TEST COMPLETE, 1 ok, 1 failed of 2 test cases Updating /Users/ferd/code/self/learn-you-some-erlang/ct/demo/index.html... done Updating /Users/ferd/code/self/learn-you-some-erlang/ct/demo/all_runs.html... done And we find that one of our two test cases fails. We also see that we apparently inherited a bunch of HTML files. Before looking to know what this is about, let's see how to run the tests from the Erlang shell: $ erl ... 1> ct:run_test([{suite, basic_SUITE}]). ... Testing ct.demo.basic_SUITE: Starting test, 2 test cases - - - - - - - - - - - - - - - - - - - - - - - - - - basic_SUITE:test2 failed on line 13 Reason: badarith - - - - - - - - - - - - - - - - - - - - - - - - - - ... Updating /Users/ferd/code/self/learn-you-some-erlang/ct/demo/index.html... done Updating /Users/ferd/code/self/learn-you-some-erlang/ct/demo/all_runs.html... done ok I've removed a bit of the output above, but it gives exactly the same result as the command line version. Let's see what's going on with these HTML files: $ ls all_runs.html basic_SUITE.beam basic_SUITE.erl ct_default.css ct_run.NodeName.YYYY-MM-DD_20.01.25/ ct_run.NodeName.YYYY-MM-DD_20.05.17/ index.html variables-NodeName Oh what the hell did Common Test do to my beautiful directory? It is a shameful thing to look at. We've got two directories there. Feel free to explore them if you feel adventurous, but all the cowards like me will prefer to instead look at either the all_runs.html or the index.html files. The former will link to indexes of all iterations of the tests you ran while the latter will link to the newest runs only. Pick one, and then click around in a browser (or press around if you don't believe in mice as an input device) until you find the test suite with its two tests: You see that test2 failed. if you click on the underlined line number, you'll see a raw copy of the module. If you instead click on the test2 link, you'll see a detailed log of what happened: === source code for basic_SUITE:test2/1 === Test case started with: basic_SUITE:test2(ConfigOpts) === Current directory is "Somewhere on my computer" === Started at 2012-01-20 20:05:17 [Test Related Output] === Ended at 2012-01-20 20:05:17 === location [{basic_SUITE,test2,13}, {test_server,ts_tc,1635}, {test_server,run_test_case_eval1,1182}, {test_server,run_test_case_eval,1123}] === reason = bad argument in an arithmetic expression in function basic_SUITE:test2/1 (basic_SUITE.erl, line 13) in call from test_server:ts_tc/3 (test_server.erl, line 1635) in call from test_server:run_test_case_eval1/6 (test_server.erl, line 1182) in call from test_server:run_test_case_eval/9 (test_server.erl, line 1123) The log lets you know precisely what failed, and it is much more detailed than whatever we had in the Erlang shell. This is important to remember because if you're a shell user, you'll find Common Test extremely painful to use. If you're a person more prone to use GUIs anyway, then it'll be pretty fun for you. But enough wandering around pretty HTML files, let's see how to test with some more state. Note: if you ever feel like traveling back in time without the help of a time machine, download a version of Erlang prior to R15B and use Common Test with it. You'll be astonished to see that your browser and the logs' style brought you back into the late 1990s. Testing With State If you have read the EUnit chapter (and haven't skipped around), you'll remember that EUnit had these things called fixtures, where we'd give a test case some special instantiation (setup) and teardown code to be called before and after the case, respectively. Common Test follows that concept. Instead of having EUnit-style fixtures, it instead relies on two functions. The first is the setup function, called init_per_testcase/2 and the second one is the teardown function, called end_per_testcase/2. To see how they're used, create a new test suite called state_SUITE (still under the demo/ directory), add the following code: -module(state_SUITE). -include_lib("common_test/include/ct.hrl"). -export([all/0, init_per_testcase/2, end_per_testcase/2]). -export([ets_tests/1]). all() -> [ets_tests]. init_per_testcase(ets_tests, Config) -> TabId = ets:new(account, [ordered_set, public]), ets:insert(TabId, {andy, 2131}), ets:insert(TabId, {david, 12}), ets:insert(TabId, {steve, 12943752}), [{table,TabId} | Config]. end_per_testcase(ets_tests, Config) -> ets:delete(?config(table, Config)). ets_tests(Config) -> TabId = ?config(table, Config), [{david, 12}] = ets:lookup(TabId, david), steve = ets:last(TabId), true = ets:insert(TabId, {zachary, 99}), zachary = ets:last(TabId). This is a little normal ETS test checking a few ordered_set concepts. What's interesting about it is the two new functions, init_per_testcase/2 and end_per_testcase/2. Both functions need to be exported in order to be called. If they're exported, the functions are going to be called for all test cases in a module. You can separate them based on the arguments. The first one is the name of the test case (as an atom), and the second one is the Config proplist that you can modify. Note: to read from Config, rather than using proplists:get_value/2, the Common test include file has a ?config(Key, List) macro that returns the value matching the given key. The macro is in fact equivalent to proplists:get_value/2 and is documented as such, so you know you can deal with Config as a proplist without worrying about it ever breaking. As an example, if I had tests a, b, and c and only wanted a setup and teardown function for the first two tests, my init function might look like this: init_per_testcase(a, Config) -> [{some_key, 124} | Config]; init_per_testcase(b, Config) -> [{other_key, duck} | Config]; init_per_testcase(_, Config) -> %% ignore for all other cases Config. And similarly for the end_per_testcase/2 function. Looking back at state_SUITE, you can see the test case, but what's interesting to note is how I instantiate the ETS table. I specify no heir, and yet, the tests run without a problem after the init function is done. You'll remember that we've seen, in the ETS chapter, that ETS tables are usually owned by the process that started them. In this case, we leave the table as it is. If you run the tests, you'll see the suite succeeds. What we can infer from this is that the init_per_testcase and end_per_testcase functions run in the same process as the test case itself. You can thus safely do things like set links, start tables and whatnot without worrying about different processes breaking your things. What about errors in the test case? Fortunately, crashing in your test case won't stop Common Test from cleaning up and calling the end_per_testcase function, with the exception of kill exit signals. We're now pretty much equal to EUnit with Common Test, at least in terms of flexibility, if not more. Alth'''
