["https://learnyousomeerlang.com/event-handlers"]
title = "Event Handlers | Learn You Some Erlang for Great Good!"
description = "Learning about event handlers and their OTP equivalent (gen_event) in the context of writing a system for a curling game."
full_description = '''Hey there, it appears your Javascript is disabled. That's fine, the site works without it. However, you might prefer reading it with syntax highlighting, which requires Javascript! Event Handlers Handle This! *pumps shotgun* There is a certain thing that I've avoided getting into in a few of the previous examples. If you look back at the reminder app, you'll see that I somehow mentioned that we could notify clients, whether they were IM, mail, etc. In the previous chapter, our trading system used io:format/2 to notify people of what was going on. You can probably see the common link between both cases. They're all about letting people (or some process or application) know about an event that happened at some point in time. In one case, we only output the results while in the other, we took the Pid of subscribers before sending them a message. The output approach is minimalist and can not be extended with ease. The one with subscribers is certainly valid. In fact, it's pretty useful when each of the subscribers has a long-running operation to do after receiving an event. In simpler cases, where you do not necessarily want a standby process waiting for events for each of the callbacks, a third approach can be taken. This third approach simply takes a process which accepts functions and lets them run on any incoming event. This process is usually called an event manager and it might end up looking a bit like this: Doing things that way has a few advantages: If your server has many subscribers, it can keep going because it only needs to forward events once If there is a lot of data to be transferred, it's only done once and all callbacks operate on that same instance of the data You don't need to spawn processes for short lived tasks And of course there are a few downsides too: If all functions need to run for a long time, they're going to block each other. This can be prevented by actually having the function forward the event to a process, basically turning the event manager as an event forwarder (something similar to what we did for the reminder app) In fact, a function that loops indefinitly can prevent any new event from being handled until something crashes. There is a way to solve these downsides, which is a bit underwhelming. Basically, you have to turn the event manager approach into the subscriber one. Luckily, the event manager approach is flexible enough to do it with ease and we'll see how to do it later in this chapter. I usually write a very basic version of the OTP behaviour we'll see in pure Erlang beforehand, but in this case, I'll instead come straight to the point. Here comes gen_event. Generic Event Handlers The gen_event behaviour differs quite a bit from the gen_server and gen_fsm behaviours in that you are never really starting a process. The whole part I've described above about 'accepting a callback' is the reason for this. The gen_event behaviour basically runs the process that accepts and calls functions, and you only provide a module with these functions. This is to say, you have nothing to do with regards to event manipulation except give your callback functions in a format that pleases the event manager. All managing is done for free; you only provide what's specific to your application. This is not really surprising given OTP is, again, all about separating what's generic from specific. This separation, however, means that the standard spawn -> init -> loop -> terminate pattern will only be applied to event handlers. Now if you recall what has been said before, event handlers are a bunch of functions running in the manager. This means the currently presented model: Switches to something more like this for the programmer: Each event handler can hold its own state, carried around by the manager for them. Each event handler can then take the form: This is nothing too complex so let's get it on with the event handlers' callbacks themselves. init and terminate The init and terminate functions are similar to what we've seen in the previous behaviours with servers and finit state machines. init/1 takes a list of arguments and returns {ok, State}. Whatever happens in init/1 should have its counterpart in terminate/2. handle_event The handle_event(Event, State) function is more or less the core of gen_event's callback modules. It works like gen_server's handle_cast/2 in that it works asynchronously. It differs with regards to what it can return though: {ok, NewState} {ok, NewState, hibernate}, which puts the event manager itself into hibernation until the next event remove_handler {swap_handler, Args1, NewState, NewHandler, Args2} The tuple {ok, NewState} works in a way similar to what we've seen with gen_server:handle_cast/2; it simply updates its own state and doesn't reply to anyone. In the case of {ok, NewState, hibernate} it is to be noted that the whole event manager is going to be put in hibernation. Remember that event handlers run in the same process as their manager. Then remove_handler drops the handler from the manager. This can be useful whenever your event handler knows its done and it has nothing else to do. Finally, there's {swap_handler, Args1, NewState, NewHandler, Args2}. This one is not used too frequently, but what it does is remove the current event handler and replace it with a new one. This is done by first calling CurrentHandler:terminate(Args1, NewState) and removing the current handler, then adding a new one by calling NewHandler:init(Args2, ResultFromTerminate). This can be useful in the cases where you know some specific event happened and you're better of giving control to a new handler. This is likely the kind of thing where you'll simply know when you need it. Again, it's not that frequently used. All incoming events can come from gen_event:notify/2 which is asynchronous like gen_server:cast/2 is. There is also gen_event:sync_notify/2 which is synchronous. This is a bit funny to say, because handle_event/2 remains asynchronous. The idea here is that the function call only returns once all event handlers have seen and treated the new message. Until then, the event manager will keep blocking the calling process by not replying. handle_call This is similar to a gen_server's handle_call callback, except that it can return {ok, Reply, NewState}, {ok, Reply, NewState, hibernate}, {remove_handler, Reply} or {swap_handler, Reply, Args1, NewState, Handler2, Args2}. The gen_event:call/3-4 function is used to make the call. This raises a question. How does this work when we have something like 15 different event handlers? Do we expect 15 replies or just one that contains them all? Well, in fact we'll be forced to choose only one handler to reply to us. We'll get into the details of how this is done when we actually see how to attach handlers to our event manager, but if you're impatient, you can look at how the function gen_event:add_handler/3 works to try to figure it out. handle_info The handle_info/2 callback is pretty much the same as handle_event (same return values and everything), with the exception that it only treats out of band messages, such as exit signals, messages sent directly to the event manager with the ! operator, etc. It has use cases similar to those of handle_info in gen_server and in gen_fsm. code_change Code change works in exactly the same manner as it does for gen_servers, except it's for each individual event handler. It takes 3 arguments, OldVsn, State, and Extra, which are in order, the version number, the current handler's state and data we can ignore for now. All it needs to do is return {ok, NewState}. It's Curling Time! With the callbacks seen, we can start looking at implementing something with gen_event. For this part of the chapter, I've chosen to make a set of event handlers used to track game updates of one of the most entertaining sports in the world: curling. If you've never seen or played curling before (which is a shame!), the rules are relatively simple: You have two teams and they try to send a curling stone sliding on the ice, trying to get to the middle of the red circle. They do this with 16 stones and the team with the stone closest to the center wins a point at the end of the round (called an end). If the team has the two closest stones, it earns two points, and so on. There are 10 ends and the team with the most points at the end of the 10 ends wins the game. There are more rules making the game more fascinating, but this is a book on Erlang, not extremely fascinating winter sports. If you want to learn more about the rules, I suggest you head up to the Wikipedia article on curling. For this entirely real-world-relevant scenario, we'll be working for the next winter Olympic Games. The city where everything happens are just done building the arena where the matches will take place and they're working on getting the scoreboard ready. It turns out that we have to program a system that will let some official enter game events, such as when a stone has been thrown, when a round ends or when a game is over, and then route these events to the scoreboard, a stats system, news reporters' feeds, etc. Being as clever as we are, we know this is a chapter on gen_event and deduce we will likely use it to accomplish our task. We won't implement all the rules given this is more of an example, but feel free to do so when we're done with the chapter. I promise not to be mad. We'll start with the scoreboard. Because they're installing it right now, we'll make use of a fake module that would usually let us interact with it, but for now it'll only use standard output to show what's going on. This is where curling_scoreboard_hw.erl comes in: -module(curling_scoreboard_hw). -export([add_point/1, next_round/0, set_teams/2, reset_board/0]). %% This is a 'dumb' module that's only there to replace what a real hardware %% controller would likely do. The real hardware controller would likely hold %% some state and make sure everything works right, but this one doesn't mind. %% Shows the teams on the scoreboard. set_teams(TeamA, TeamB) -> io:format("Scoreboard: Team ~s vs. Team ~s~n", [TeamA, TeamB]). next_round() -> io:format("Scoreboard: round over~n"). add_point(Team) -> io:format("Scoreboard: increased score of team ~s by 1~n", [Team]). reset_board() -> io:format("Scoreboard: All teams are undefined and all scores are 0~n"). So this is all the functionality the scoreboard has. They usually have a timer and other awesome functionalities, but whatever. Seems like the Olympics committee didn't feel like having us implementing trivialities for a tutorial. This hardware interface lets us have a little bit of design time to ourselves. We know that there are a few events to handle for now: adding teams, going to the next round, setting the number of points. We will only use the reset_board functionality when starting a new game and won't need it as part of our protocol. The events we need might take the following form in our protocol: {set_teams, TeamA, TeamB}, where this is translated to a single call to curling_scoreboard_hw:set_teams(TeamA, TeamB); {add_points, Team, N}, where this is translated to N calls to curling_scoreboard_hw:add_point(Team); next_round, which gets translated to a single call with the same name. We can start our implementation with this basic event handler skeleton: -module(curling_scoreboard). -behaviour(gen_event). -export([init/1, handle_event/2, handle_call/2, handle_info/2, code_change/3, terminate/2]). init([]) -> {ok, []}. handle_event(_, State) -> {ok, State}. handle_call(_, State) -> {ok, ok, State}. handle_info(_, State) -> {ok, State}. code_change(_OldVsn, State, _Extra) -> {ok, State}. terminate(_Reason, _State) -> ok. This is a skeleton that we can use for every gen_event callback module out there. For now, the scoreboard event handler itself won't need to do anything special except forward the calls to the hardware module. We expect the events to come from gen_event:notify/2, so the handling of the protocol should be done in handle_event/2. The file curling_scoreboard.erl shows the updates: -module(curling_scoreboard). -behaviour(gen_event). -export([init/1, handle_event/2, handle_call/2, handle_info/2, code_change/3, terminate/2]). init([]) -> {ok, []}. handle_event({set_teams, TeamA, TeamB}, State) -> curling_scoreboard_hw:set_teams(TeamA, TeamB), {ok, State}; handle_event({add_points, Team, N}, State) -> [curling_scoreboard_hw:add_point(Team) || _ <- lists:seq(1,N)], {ok, State}; handle_event(next_round, State) -> curling_scoreboard_hw:next_round(), {ok, State}; handle_event(_, State) -> {ok, State}. handle_call(_, State) -> {ok, ok, State}. handle_info(_, State) -> {ok, State}. You can see the updates done to the handle_event/2 function. Trying it: 1> c(curling_scoreboard_hw). {ok,curling_scoreboard_hw} 2> c(curling_scoreboard). {ok,curling_scoreboard} 3> {ok, Pid} = gen_event:start_link(). {ok,<0.43.0>} 4> gen_event:add_handler(Pid, curling_scoreboard, []). ok 5> gen_event:notify(Pid, {set_teams, "Pirates", "Scotsmen"}). Scoreboard: Team Pirates vs. Team Scotsmen ok 6> gen_event:notify(Pid, {add_points, "Pirates", 3}). ok Scoreboard: increased score of team Pirates by 1 Scoreboard: increased score of team Pirates by 1 Scoreboard: increased score of team Pirates by 1 7> gen_event:notify(Pid, next_round). Scoreboard: round over ok 8> gen_event:delete_handler(Pid, curling_scoreboard, turn_off). ok 9> gen_event:notify(Pid, next_round). ok A few things are going on here. The first of them is that we're starting the gen_event process as a standalone thing. We then attach our event handler to it dynamically with gen_event:add_handler/3. This can be done as many times as you want. However, as mentioned in the handle_call part earlier, this might cause problems when you want to work with a particular event handler. If you want to call, add or delete a specific handler when there's more than one instance of it, you'll have to find a way to uniquely identify it. My favorite way of doing it (one that works great if you don't have anything more specific in mind) is to just use make_ref() as a unique value. To give this value to the handler, you add it by calling add_handler/3 as gen_event:add_handler(Pid, {Module, Ref}, Args). From this point on, you can use {Module, Ref} to talk to that specific handler. Problem solved. Anyway, you can then see that we send messages to the event handler, which successfully calls the hardware module. We then remove the handler. Here, turn_off is an argument to the terminate/2 function, which our implementation currently doesn't care about. The handler is gone, but we can still send events to the event manager. Hooray. One awkward thing with the code snippet above is that we're forced to call the gen_event module directly and show everyone what our protocol looks like. A better option would be to provide an abstraction module on top of it that just wraps all we need. This will look a lot nice'''
