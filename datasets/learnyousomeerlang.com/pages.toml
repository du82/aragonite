full_description = "Hey there, it appears your Javascript is disabled. That's fine, the site works without it. However, you might prefer reading it with syntax highlighting, which requires Javascript! Table of Contents Introduction About this tutorial So what's Erlang? Don't drink too much Kool-Aid What you need to dive in Where to get help Starting Out The Shell Shell Commands Starting Out (for real) Numbers Invariable Variables Atoms Boolean Algebra and Comparison Operators Tuples Lists List Comprehensions Bit Syntax Binary Comprehensions Modules What are modules Module Declaration Compiling the Code More About Modules Syntax in Functions Pattern Matching Guards, Guards! What the If!? In Case ... of Which to use? Types (or lack thereof) Dynamite-strong Typing Type Conversions To Guard a Data Type For Type Junkies Recursion Hello recursion! Length Length of Tail Recursion More recursive functions Quick, Sort! More than lists Thinking recursively Higher Order Functions Let's get functional Anonymous functions Maps, filters, folds and more Errors and Exceptions Not so fast! A Compilation of Errors No, YOUR logic is wrong! Run-time Errors Raising Exceptions Dealing with Exceptions Wait, there's more! Try a try in a tree Functionally Solving Problems Reverse Polish Notation Calculator Heathrow to London A Short Visit to Common Data Structures Won't be too long, promised! Records Key-Value Stores Arrays A Set of Sets Directed Graphs Queues End of the short visit The Hitchhiker's Guide to Concurrency Don't Panic Concepts of Concurrency Not Entirely Unlike Linear Scaling So long and thanks for all the fish! More On Multiprocessing State Your State We love messages, but we keep them secret Time Out Selective Receives Errors and Processes Links It's a Trap! Monitors Naming Processes Designing a Concurrent Application Understanding the Problem Defining the Protocol Lay Them Foundations An Event Module The Event Server Hot Code Loving I Said, Hide Your Messages A Test Drive A