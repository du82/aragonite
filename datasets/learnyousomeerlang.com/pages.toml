title = "Errors and Processes | Learn You Some Erlang for Great Good!"
description = "Error management with multiple processes in Erlang: links, monitors, exit signals (and how to trap them), the logic behind being able to give names to processes."
full_description = '''Hey there, it appears your Javascript is disabled. That's fine, the site works without it. However, you might prefer reading it with syntax highlighting, which requires Javascript! Errors and Processes Links A link is a specific kind of relationship that can be created between two processes. When that relationship is set up and one of the processes dies from an unexpected throw, error or exit (see Errors and Exceptions), the other linked process also dies. This is a useful concept from the perspective of failing as soon as possible to stop errors: if the process that has an error crashes but those that depend on it don't, then all these depending processes now have to deal with a dependency disappearing. Letting them die and then restarting the whole group is usually an acceptable alternative. Links let us do exactly this. To set a link between two processes, Erlang has the primitive function link/1, which takes a Pid as an argument. When called, the function will create a link between the current process and the one identified by Pid. To get rid of a link, use unlink/1. When one of the linked processes crashes, a special kind of message is sent, with information relative to what happened. No such message is sent if the process dies of natural causes (read: is done running its functions.) I'll first introduce this new function as part of linkmon.erl: myproc() -> timer:sleep(5000), exit(reason). If you try the next following calls (and wait 5 seconds between each spawn command), you should see the shell crashing for 'reason' only when a link has been set between the two processes. 1> c(linkmon). {ok,linkmon} 2> spawn(fun linkmon:myproc/0). <0.52.0> 3> link(spawn(fun linkmon:myproc/0)). true ** exception error: reason Or, to put it in picture: However, this {'EXIT', B, Reason} message can not be caught with a try ... catch as usual. Other mechanisms need to be used to do this. We'll see them later. It's important to note that links are used to establish larger groups of processes that should all die together: chain(0) -> receive _ -> ok after 2000 -> exit("chain dies here") end; chain(N) -> Pid = spawn(fun() -> chain(N-1) end), link(Pid), receive _ -> ok end. This function will take an integer N, start N processes linked one to the other. In order to be able to pass the N-1 argument to the next 'chain' process (which calls spawn/1), I wrap the call inside an anonymous function so it doesn't need arguments anymore. Calling spawn(?MODULE, chain, [N-1]) would have done a similar job. Here, I'll have many processes linked together, dying as each of their successors exits: 4> c(linkmon). {ok,linkmon} 5> link(spawn(linkmon, chain, [3])). true ** exception error: "chain dies here" And as you can see, the shell does receive the death signal from some other process. Here's a drawn representation of the spawned processes and links going down: [shell] == [3] == [2] == [1] == [0] [shell] == [3] == [2] == [1] == *dead* [shell] == [3] == [2] == *dead* [shell] == [3] == *dead* [shell] == *dead* *dead, error message shown* [shell] <-- restarted After the process running linkmon:chain(0) dies, the error is propagated down the chain of links until the shell process itself dies because of it. The crash could have happened in any of the linked processes; because links are bidirectional, you only need one of them to die for the others to follow suit. Note: If you wanted to kill another process from the shell, you could use the function exit/2, which is called this way: exit(Pid, Reason). Try it if you wish. Note: Links can not be stacked. If you call link/1 15 times for the same two processes, only one link will still exist between them and a single call to unlink/1 will be enough to tear it down. Its important to note that link(spawn(Function)) or link(spawn(M,F,A)) happens in more than one step. In some cases, it is possible for a process to die before the link has been set up and then provoke unexpected behavior. For this reason, the function spawn_link/1-3 has been added to the language. It takes the same arguments as spawn/1-3, creates a process and links it as if link/1 had been there, except it's all done as an atomic operation (the operations are combined as a single one, which can either fail or succeed, but nothing else). This is generally considered safer and you save a set of parentheses too. It's a Trap! Now to get back to links and processes dying. Error propagation across processes is done through a process similar to message passing, but with a special type of message called signals. Exit signals are 'secret' messages that automatically act on processes, killing them in the action. I have mentioned many times already that in order to be reliable, an application needs to be able to both kill and restart a process quickly. Right now, links are alright to do the killing part. What's missing is the restarting. In order to restart a process, we need a way to first know that it died. This can be done by adding a layer on top of links (the delicious frosting on the cake) with a concept called system processes. System processes are basically normal processes, except they can convert exit signals to regular messages. This is done by calling process_flag(trap_exit, true) in a running process. Nothing speaks as much as an example, so we'll go with that. I'll just redo the chain example with a system process at the beginning: 1> process_flag(trap_exit, true). true 2> spawn_link(fun() -> linkmon:chain(3) end). <0.49.0> 3> receive X -> X end. {'EXIT',<0.49.0>,"chain dies here"} Ah! Now things get interesting. To get back to our drawings, what happens is now more like this: [shell] == [3] == [2] == [1] == [0] [shell] == [3] == [2] == [1] == *dead* [shell] == [3] == [2] == *dead* [shell] == [3] == *dead* [shell] <-- {'EXIT,Pid,"chain dies here"} -- *dead* [shell] <-- still alive! And this is the mechanism allowing for a quick restart of processes. By writing programs using system processes, it is easy to create a process whose only role is to check if something dies and then restart it whenever it fails. We'll cover more of this in the next chapter, when we really apply these techniques. For now, I want to come back to the exception functions seen in the exceptions chapter and show how they behave around processes that trap exits. Let's first set the bases to experiment without a system process. I'll successively show the results of uncaught throws, errors and exits in neighboring processes: Exception source: spawn_link(fun() -> ok end) Untrapped Result: - nothing - Trapped Result: {'EXIT', <0.61.0>, normal} The process exited normally, without a problem. Note that this looks a bit like the result of catch exit(normal), except a PID is added to the tuple to know what processed failed. Exception source: spawn_link(fun() -> exit(reason) end) Untrapped Result: ** exception exit: reason Trapped Result: {'EXIT', <0.55.0>, reason} The process has terminated for a custom reason. In this case, if there is no trapped exit, the process crashes. Otherwise, you get the above message. Exception source: spawn_link(fun() -> exit(normal) end) Untrapped Result: - nothing - Trapped Result: {'EXIT', <0.58.0>, normal} This successfully emulates a process terminating normally. In some cases, you might want to kill a process as part of the normal flow of a program, without anything exceptional going on. This is the way to do it. Exception source: spawn_link(fun() -> 1/0 end) Untrapped Result: Error in process <0.44.0> with exit value: {badarith, [{erlang, '/', [1,0]}]} Trapped Result: {'EXIT', <0.52.0>, {badarith, [{erlang, '/', [1,0]}]}} The error ({badarith, Reason}) is never caught by a try ... catch block and bubbles up into an 'EXIT'. At this point, it behaves exactly the same as exit(reason) did, but with a stack trace giving more details about what happened. Exception source: spawn_link(fun() -> erlang:error(reason) end) Untrapped Result: Error in process <0.47.0> with exit value: {reason, [{erlang, apply, 2}]} Trapped Result: {'EXIT', <0.74.0>, {reason, [{erlang, apply, 2}]}} Pretty much the same as with 1/0. That's normal, erlang:error/1 is meant to allow you to do just that. Exception source: spawn_link(fun() -> throw(rocks) end) Untrapped Result: Error in process <0.51.0> with exit value: {{nocatch, rocks}, [{erlang, apply, 2}]} Trapped Result: {'EXIT', <0.79.0>, {{nocatch, rocks}, [{erlang, apply, 2}]}} Because the throw is never caught by a try ... catch, it bubbles up into an error, which in turn bubbles up into an EXIT. Without trapping exit, the process fails. Otherwise it deals with it fine. And that's about it for usual exceptions. Things are normal: everything goes fine. Exceptional stuff happens: processes die, different signals are sent around. Then there's exit/2. This one is the Erlang process equivalent of a gun. It allows a process to kill another one from a distance, safely. Here are some of the possible calls: Exception source: exit(self(), normal) Untrapped Result: ** exception exit: normal Trapped Result: {'EXIT', <0.31.0>, normal} When not trapping exits, exit(self(), normal) acts the same as exit(normal). Otherwise, you receive a message with the same format you would have had by listening to links from foreign processes dying. Exception source: exit(spawn_link(fun() -> timer:sleep(50000) end), normal) Untrapped Result: - nothing - Trapped Result: - nothing - This basically is a call to exit(Pid, normal). This command doesn't do anything useful, because a process can not be remotely killed with the reason normal as an argument. Exception source: exit(spawn_link(fun() -> timer:sleep(50000) end), reason) Untrapped Result: ** exception exit: reason Trapped Result: {'EXIT', <0.52.0>, reason} This is the foreign process terminating for reason itself. Looks the same as if the foreign process called exit(reason) on itself. Exception source: exit(spawn_link(fun() -> timer:sleep(50000) end), kill) Untrapped Result: ** exception exit: killed Trapped Result: {'EXIT', <0.58.0>, killed} Surprisingly, the message gets changed from the dying process to the spawner. The spawner now receives killed instead of kill. That's because kill is a special exit signal. More details on this later. Exception source: exit(self(), kill) Untrapped Result: ** exception exit: killed Trapped Result: ** exception exit: killed Oops, look at that. It seems like this one is actually impossible to trap. Let's check something. Exception source: spawn_link(fun() -> exit(kill) end) Untrapped Result: ** exception exit: killed Trapped Result: {'EXIT', <0.67.0>, kill} Now that's getting confusing. When another process kills itself with exit(kill) and we don't trap exits, our own process dies with the reason killed. However, when we trap exits, things don't happen that way. While you can trap most exit reasons, there are situations where you might want to brutally murder a process: maybe one of them is trapping exits but is also stuck in an infinite loop, never reading any message. The kill reason acts as a special signal that can't be trapped. This ensures any process you terminate with it will really be dead. Usually, kill is a bit of a last resort, when everything else has failed. As the kill reason can never be trapped, it needs to be changed to killed when other processes receive the message. If it weren't changed in that manner, every other process linked to it would in turn die for the same kill reason and would in turn kill its neighbors, and so on. A death cascade would ensue. This also explains why exit(kill) looks like killed when received from another linked process (the signal is modified so it doesn't cascade), but still looks like kill when trapped locally. If you find this all confusing, don't worry. Many programmers feel the same. Exit signals are a bit of a funny beast. Luckily there aren't many more special cases than the ones described above. Once you understand those, you can understand most of Erlang's concurrent error management without a problem. Monitors So yeah. Maybe murdering processes isn't what you want. Maybe you don't feel like taking the world down with you once you're gone. Maybe you're more of a stalker. In that case, monitors might be what you want. More seriously, monitors are a special type of link with two differences: they are unidirectional; they can be stacked. Monitors are what you want when a process wants to know what's going on with a second process, but neither of them really are vital to each other. Another reason, as listed above, is stacking the references. Now this might seem useless from a quick look, but it is great for writing libraries which need to know what's going on with other processes. You see, links are more of an organizational construct. When you design the architecture of your application, you determine which process will do which jobs, and what will depend on what. Some processes will supervise others, some couldn't live without a twin process, etc. This structure is usually something fixed, known in advance. Links are useful for that and should not necessarily be used outside of it. But what happens if you have 2 or 3 different libraries that you call and they all need to know whether a process is alive or not? If you were to use links for this, you would quickly hit a problem whenever you needed to unlink a process. Now, links aren't stackable, so the moment you unlink one, you unlink them all and mess up all the assumptions put up by the other libraries. That's pretty bad. So you need stackable links, and monitors are your solution. They can be removed individually. Plus, being unidirectional is handy in libraries because other processes shouldn't have to be aware of said libraries. So what does a monitor look like? Easy enough, let's set one up. The function is erlang:monitor/2, where the first argument is the atom process and the second one is the pid: 1> erlang:monitor(process, spawn(fun() -> timer:sleep(500) end)). #Ref<0.0.0.77> 2> flush(). Shell got {'DOWN',#Ref<0.0.0.77>,process,<0.63.0>,normal} ok Every time a process you monitor goes down, you will receive such a message. The message is {'DOWN', MonitorReference, process, Pid, Reason}. The reference is there to allow you to demonitor the process. Remember, monitors are stackable, so it's possible to take more than one down. References allow you to track each of them in a unique manner. Also note that as with links, there is an atomic function to spawn a process while monitoring it, spawn_monitor/1-3: 3> {Pid, Ref} = spawn_monitor(fun() -> receive _ -> exit(boom) end end). {<0.73.0>,#Ref<0.0.0.100>} 4> erlang:demonitor(Ref). true 5> Pid ! die. die 6> flush(). ok In this case, we demonitored the other process before it crashed and as such we had no trace of it dying. The function demonitor/2 also exists and gives a little bit more information. The second parameter can be a list of options. Only two exist, info and flush: 7> f(). ok 8> {Pid, Ref}'''
