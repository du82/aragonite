["https://learnyousomeerlang.com/eunit"]
title = "EUnited Nations Council | Learn You Some Erlang for Great Good!"
description = "A first foray into testing with Erlang, using EUnit as a test framework. We see EUnit's most important features and put them in practice by studying real tests."
full_description = '''Hey there, it appears your Javascript is disabled. That's fine, the site works without it. However, you might prefer reading it with syntax highlighting, which requires Javascript! EUnited Nations Council The Need for Tests The software we've written has gotten progressively bigger and somewhat more complex with time. When that happens, it becomes rather tedious to start an Erlang shell, type things in, look at results, and make sure things work after code has been changed. As time goes on, it becomes simpler for everyone to run tests that are all prepared and ready in advance rather than following checklists of stuff to check by hand all the time. These are usually pretty good reasons to want tests in your software. It's also possible that you're a fan of test-driven development and so will also find tests useful. If you recall the chapter where we wrote a RPN calculator, we had a few tests that we had manually written. They were simply a set of pattern matches of the form Result = Expression that would crash if something went wrong, or would succeed otherwise. That works for simple bits of code you write for yourself, but when we get to more serious tests, we will definitely want something better, like a framework. For unit tests, we'll tend to stick to EUnit (which we see in this chapter). For integration tests, EUnit as well as Common Test can both do the job. In fact, Common Test can do everything from unit tests up to system tests, and even testing of external software, not written in Erlang. For now we'll go with EUnit, given how simple it is for the good results it yields. EUnit, What's a EUnit? EUnit, in its simplest form, is just a way to automate running functions that end in _test() in a module by assuming they are unit tests. If you go dig out that RPN calculator I mentioned above, you'll find the following code: rpn_test() -> 5 = rpn("2 3 +"), 87 = rpn("90 3 -"), -4 = rpn("10 4 3 + 2 * -"), -2.0 = rpn("10 4 3 + 2 * - 2 /"), ok = try rpn("90 34 12 33 55 66 + * - +") catch error:{badmatch,[_|_]} -> ok end, 4037 = rpn("90 34 12 33 55 66 + * - + -"), 8.0 = rpn("2 3 ^"), true = math:sqrt(2) == rpn("2 0.5 ^"), true = math:log(2.7) == rpn("2.7 ln"), true = math:log10(2.7) == rpn("2.7 log10"), 50 = rpn("10 10 10 20 sum"), 10.0 = rpn("10 10 10 20 sum 5 /"), 1000.0 = rpn("10 10 20 0.5 prod"), ok. This was the test function we wrote to make sure the calculator worked fine. Find the old module and try this: 1> c(calc). {ok,calc} 2> eunit:test(calc). Test passed. ok Calling eunit:test(Module). was all we needed! Yay, we now know EUnit! Pop the champagne and let's head to a different chapter! Obviously a testing framework that only does this little wouldn't be very useful, and in technical programmer jargon, it might be described as 'not very good'. EUnit does more than automatically exporting and running functions ending in _test(). For one, you can move the tests out to a different module so that your code and its tests are not mixed together. This means you can't test private functions anymore, but also means that if you develop all your tests against the module's interface (the exported functions), then you won't need to rewrite tests when you refactor your code. Let's try separating tests and code with two simple modules: -module(ops). -export([add/2]). add(A,B) -> A + B. -module(ops_tests). -include_lib("eunit/include/eunit.hrl"). add_test() -> 4 = ops:add(2,2). So we have ops and ops_tests, where the second includes tests related to the first. Here's a thing EUnit can do: 3> c(ops). {ok,ops} 4> c(ops_tests). {ok,ops_tests} 5> eunit:test(ops). Test passed. ok Calling eunit:test(Mod) automatically looks for Mod_tests and runs the tests within that one. Let's change the test a bit (make it 3 = ops:add(2,2)) to see what failures look like: 6> c(ops_tests). {ok,ops_tests} 7> eunit:test(ops). ops_tests: add_test (module 'ops_tests')...*failed* ::error:{badmatch,4} in function ops_tests:add_test/0 ======================================================= Failed: 1. Skipped: 0. Passed: 0. error We can see what test failed (ops_tests: add_test...) and why it did (::error:{badmatch,4}). We also get a full report of how many tests passed or failed. The output is pretty bad though. At least as bad as regular Erlang crashes: no line numbers, no clear explanation (4 didn't match with what, exactly?), etc. We're left helpless by a test framework that runs tests but doesn't tell you much about them. For this reason, EUnit introduces a few macros to help us. Each of them will give us cleaner reporting (including line numbers) and clearer semantics. They're the difference between knowing that something goes wrong and knowing why something goes wrong: ?assert(Expression), ?assertNot(Expression) Will test for boolean values. If any value other than true makes it into ?assert, an error will be shown. Same for ?assertNot, but for negative values. This macro is somewhat equivalent to true = X or false = Y. ?assertEqual(A, B) Does a strict comparison (equivalent to =:=) between two expressions, A and B. If they are different, a failure will occur. This is roughly equivalent to true = X =:= Y. Since R14B04, the macro ?assertNotEqual is available to do the opposite of ?assertEqual. ?assertMatch(Pattern, Expression) This allows us to match in a form similar to Pattern = Expression, without variables ever binding. This means that I could do something like ?assertMatch({X,X}, some_function()) and assert that I receive a tuple with two elements being identical. Moreover, I could later do ?assertMatch(X,Y) and X would not be bound. This is to say that rather than properly being like Pattern = Expression, what we have is closer to (fun (Pattern) -> true; (_) -> erlang:error(nomatch) end)(Expression): variables in the pattern's head never get bound across multiple assertions. The macro ?assertNotMatch has been added to EUnit in R14B04. ?assertError(Pattern, Expression) Tells EUnit that Expression should result in an error. As an example, ?assertError(badarith, 1/0) would be a successful test. ?assertThrow(Pattern, Expression) Exactly the same as ?assertError, but with throw(Pattern) instead of erlang:error(Pattern). ?assertExit(Pattern, Expression) Exactly the same as ?assertError, but with exit(Pattern) (and not exit/2) instead of erlang:error(Pattern). ?assertException(Class, Pattern, Expression) A general form of the three previous macros. As an example, ?assertException(error, Pattern, Expression) is the same as ?assertError(Pattern, Expression). Starting with R14B04, there is also the macro ?assertNotException/3 available for tests. Using these macros, we could write better tests in our module: -module(ops_tests). -include_lib("eunit/include/eunit.hrl"). add_test() -> 4 = ops:add(2,2). new_add_test() -> ?assertEqual(4, ops:add(2,2)), ?assertEqual(3, ops:add(1,2)), ?assert(is_number(ops:add(1,2))), ?assertEqual(3, ops:add(1,1)), ?assertError(badarith, 1/0). And running them: 8> c(ops_tests). ./ops_tests.erl:12: Warning: this expression will fail with a 'badarith' exception {ok,ops_tests} 9> eunit:test(ops). ops_tests: new_add_test...*failed* ::error:{assertEqual_failed,[{module,ops_tests}, {line,11}, {expression,"ops : add ( 1 , 1 )"}, {expected,3}, {value,2}]} in function ops_tests:'-new_add_test/0-fun-3-'/1 in call from ops_tests:new_add_test/0 ======================================================= Failed: 1. Skipped: 0. Passed: 1. error See how much nicer the error reporting is? We know that the assertEqual on line 11 of ops_tests failed. When we called ops:add(1,1), we thought we'd receive 3 as a value, but we instead got 2. Of course you've got to read these values as Erlang terms, but at least they're there. What's annoying with this, however, is that even though we had 5 assertions, only one failed but the whole test was still considered a failure. It would be nicer to know that some assertion failed without behaving as if all the others after it failed too. Our test is the equivalent of taking an exam in school, and as soon as you make a mistake, you fail and get thrown out of school. Then your dog dies and you just have a horrible day. Test Generators Because of this common need for flexibility, EUnit supports something called test generators. Test generators are pretty much shorthand for assertions wrapped in functions that can be run later, in clever manners. Instead of having functions ending with _test() with macros that are of the form ?assertSomething, we will use functions that end in _test_() and macros of the form ?_assertSomething. Those are small changes, but they make things much more powerful. The two following tests would be equivalent: function_test() -> ?assert(A == B). function_test_() -> ?_assert(A == B). Here, function_test_() is called a test generator function, while ?_assert(A == B) is called a test generator. It is called that way, because secretly, the underlying implementation of ?_assert(A == B) is fun() -> ?assert(A == B) end. That is to say, a function that generates a test. The advantage of test generators, compared to regular assertions, is that they are funs. This means that they can be manipulated without being executed. We could, in fact, have test sets of the following form: my_test_() -> [?_assert(A), [?_assert(B), ?_assert(C), [?_assert(D)]], [[?_assert(E)]]]. Test sets can be deeply nested lists of test generators. We could have functions that return tests! Let's add the following to ops_tests: add_test_() -> [test_them_types(), test_them_values(), ?_assertError(badarith, 1/0)]. test_them_types() -> ?_assert(is_number(ops:add(1,2))). test_them_values() -> [?_assertEqual(4, ops:add(2,2)), ?_assertEqual(3, ops:add(1,2)), ?_assertEqual(3, ops:add(1,1))]. Because only add_test_() ends in _test_(), the two functions test_them_Something() will not be seen as tests. In fact, they will only be called by add_test_() to generate tests: 1> c(ops_tests). ./ops_tests.erl:12: Warning: this expression will fail with a 'badarith' exception ./ops_tests.erl:17: Warning: this expression will fail with a 'badarith' exception {ok,ops_tests} 2> eunit:test(ops). ops_tests:25: test_them_values...*failed* [...] ops_tests: new_add_test...*failed* [...] ======================================================= Failed: 2. Skipped: 0. Passed: 5. error So we still get the expected failures, and now you see that we jumped from 2 tests to 7. The magic of test generators. What if we only wanted to test some parts of the suite, maybe just add_test_/0? Well EUnit has a few tricks up its sleeves: 3> eunit:test({generator, fun ops_tests:add_test_/0}). ops_tests:25: test_them_values...*failed* ::error:{assertEqual_failed,[{module,ops_tests}, {line,25}, {expression,"ops : add ( 1 , 1 )"}, {expected,3}, {value,2}]} in function ops_tests:'-test_them_values/0-fun-4-'/1 ======================================================= Failed: 1. Skipped: 0. Passed: 4. error Note that this only works with test generator functions. What we have here as {generator, Fun} is what EUnit parlance calls a test representation. We have a few other representations: {module, Mod} runs all tests in Mod {dir, Path} runs all the tests for the modules found in Path {file, Path} runs all the tests found in a single compiled module {generator, Fun} runs a single generator function as a test, as seen above {application, AppName} runs all the tests for all the modules mentioned in AppName's .app file. These different test representations can make it easy to run test suites for entire applications or even releases. Fixtures It would still be pretty hard to test entire applications just by using assertions and test generators. This is why fixtures were added. Fixtures, while not being a catch-all solution to getting your tests up and running to the application level, allow you to build a certain scaffolding around tests. The scaffolding in question is a general structure that allows us to define setup and teardown functions for each of the test. These functions will allow you to build the state and environment required for each of the tests to be useful. Moreover, the scaffolding will let you specify how to run the tests (do you want to run them locally, in separate processes, etc.?) There are a few types of fixtures available, with variations to them. The first type is simply called the setup fixture. A setup fixture takes one of the many following forms: {setup, Setup, Instantiator} {setup, Setup, Cleanup, Instantiator} {setup, Where, Setup, Instantiator} {setup, Where, Setup, Cleanup, Instantiator} Argh! It appears we need a little bit of EUnit vocabulary in order to understand this (this will be useful if you need to go read the EUnit documentation): Setup A function that takes no argument. Each of the tests will be passed the value returned by the setup function. Cleanup A function that takes the result of a setup function as an argument, and takes care of cleaning up whatever is needed. If in OTP terminate does the opposite of init, then cleanup functions are the opposite of setup functions for EUnit. Instantiator It's a function that takes the result of a setup function and returns a test set (remember, test sets are possibly deeply nested lists of ?_Macro assertions). Where Specifies how to run the tests: local, spawn, {spawn, node()}. Alright, so what does this look like in practice? Well, let's imagine some test to make sure that a fictive process registry correctly handles trying to register the same process twice, with different names: double_register_test_() -> {setup, fun start/0, % setup function fun stop/1, % teardown function fun two_names_one_pid/1}. % instantiator start() -> {ok, Pid} = registry:start_link(), Pid. stop(Pid) -> registry:stop(Pid). two_names_one_pid(Pid) -> ok = registry:register(Pid, quite_a_unique_name, self()), Res = registry:register(Pid, my_other_name_is_more_creative, self()), [?_assertEqual({error, already_named}, Res)]. This fixture first starts the registry server within the start/0 function. Then, the instantiator two_names_one_pid(ResultFromSetup) is called. In that test, the only thing I do is try to register the current process twice. That's where the instantiator does its work. The result of the second registration is stored in the variable Res. The function will then return a test set containing a single test (?_assertEqual({error, already_named}, Res)). That test set will be run by EUnit. Then, the teardown function stop/1 will be called. Using the pid returned by the setup function, it'll be able to shut down the registry that we had started beforehand. Glorious! What's even better is that this whole fixture itself can be put inside a test set: some_test_() -> [{setup, fun start/0, fun stop/1, fun some_instantiator1/1}, {setup, fun start/0, fun stop/1, fun some_instantiator2/1}, ... {setup, fun start/0, fun stop/1, fun some_instantiatorN/1}]. And this will work! What's annoying there is the need to always repeat t'''
