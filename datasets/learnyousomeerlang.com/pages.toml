title = "Leveling Up in The Process Quest | Learn You Some Erlang for Great Good!"
description = "Finding how to take a complete release and then safely upgrade it without taking it down or losing data. Done with a Progress Quest clone."
full_description = '''Hey there, it appears your Javascript is disabled. That's fine, the site works without it. However, you might prefer reading it with syntax highlighting, which requires Javascript! Leveling Up in The Process Quest The Hiccups of Appups and Relups Doing some code hot-loading is one of the simplest things in Erlang. You recompile, make a fully-qualified function call, and then enjoy. Doing it right and safe is much more difficult, though. There is one very simple challenge that makes code reloading problematic. Let's use our amazing Erlang-programming brain and have it imagine a gen_server process. This process has a handle_cast/2 function that accepts one kind of argument. I update it to one that takes a different kind of argument, compile it, push it in production. All is fine and dandy, but because we have an application that we don't want to shut down, we decide to load it on the production VM to make it run. Then a bunch of error reports start pouring in. It turns out that your different handle_cast functions are incompatible. So when they were called a second time, no clause matched. The customer is pissed off, so is your boss. Then the operations guy is also angry because he has to get on location and rollback the code, extinguish fires, etc. If you're lucky, you're that operations guy. You're staying late and ruining the janitor's night (he usually loves to hum along with his music and dance a little bit, but he feels ashamed in your presence). You come home late, your family/friends/WoW raid party/children are mad at you, they yell, scream, slam the door and you're left alone. You had promised that nothing could go wrong, no downtime. You're using Erlang after all, right? Oh but it didn't happen so. You're left alone, curled up in a ball in the corner of the kitchen, eating a frozen hot pocket. Of course things aren't always that bad, but the point stands. Doing live code upgrades on a production system can be very dangerous if you're changing the interface your modules give to the world: changing internal data structures, changing function names, modifying records (remember, they're tuples!), etc. They all have the potential to crash things. When we were first playing with code reloading, we had a process with some kind of hidden message to handle doing a fully-qualified call. If you recall, a process could have looked like this: loop(N) -> receive some_standard_message -> N+1; other_message -> N-1; {get_count, Pid} -> Pid ! N, loop(N); update -> ?MODULE:loop(N); end. However, this way of doing things wouldn't fix our problems if we were to change the arguments to loop/1. We'd need to extend it a bit like this: loop(N) -> receive some_standard_message -> N+1; other_message -> N-1; {get_count, Pid} -> Pid ! N, loop(N); update -> ?MODULE:code_change(N); end. And then code_change/1 can take care of calling a new version of loop. But this kind of trick couldn't work with generic loops. See this example: loop(Mod, State) -> receive {call, From, Msg} -> {reply, Reply, NewState} = Mod:handle_call(Msg, State), From ! Reply, loop(Mod, NewState); update -> {ok, NewState} = Mod:code_change(State), loop(Mod, NewState) end. See the problem? If we want to update Mod and load a new version, there is no way to do it safely with that implementation. The call Mod:handle_call(Msg, State) is already fully qualified and it's well possible that a message of the form {call, From, Msg} is received in between the time we reload the code and handle the update message. In that case, we'd update the module in an uncontrolled manner. Then we'd crash. The secret to getting it right is buried within the entrails of OTP. We must freeze the sands of time! To do so, we require more secret messages: messages to put a process on hold, messages to change the code, and then messages to resume the actions you had before. Deep inside OTP behaviours is hidden a special protocol to take care of all that kind of management. This is done through something called the sys module and a second one called release_handler, part of the SASL (System Architecture Support Libraries) application. They take care of everything. The trick is that you can suspend OTP processes by calling sys:suspend(PidOrName) (you can find all of the processes using the supervision trees and looking at the children each supervisor has). Then you use sys:change_code(PidOrName, Mod, OldVsn, Extra) to force the process to update itself, and finally, you call sys:resume(PidOrName) to make things go again. It wouldn't be very practical for us to call these functions manually by writing ad-hoc scripts all the time. Instead, we can look at how relups are done. The 9th Circle of Erl The act of taking a running release, making a second version of it and updating it while it runs is perilous. What seems like a simple assembly of appups (files containing instructions on how to update individual applications) and relups (file containing instructions to update an entire release) quickly turns into a struggle through APIs and undocumented assumptions. We're getting into one of the most complex parts of OTP, difficult to comprehend and get right, on top of being time consuming. In fact, if you can avoid the whole procedure (which will be called relup from now on) and do simple rolling upgrades by restarting VMs and booting new applications, I would recommend you do so. Relups should be one of these 'do or die' tools. Something you use when you have few more choices. There are a bunch of different levels to have when dealing with release upgrades: Write OTP applications Turn a bunch of them into a release Create new versions of one or more of the OTP applications Create an appup file that explains what to change to make the transition between the old and the new application work Create a new release with the new applications Generate a relup file from these releases Install the new app in a running Erlang shell Each of which can be more complex than the preceding one. We've only seen how to do the first 3 steps here. To be able to work with an application that is more adapted to long-running upgrades than the previous ones (eh, who cares about running regexes without restarting), we'll introduce a superb video game. Progress Quest Progress Quest is a revolutionary Role Playing Game. I would call it the OTP of RPGs in fact. If you've ever played an RPG before, you'll notice that many steps are similar: run around, kill enemies, gain experience, get money, level up, get skills, complete quests. Rinse and repeat forever. Power players will have shortcuts such as macros or even bots to go around and do their bidding for them. Progress Quest took all of these generic steps and turned them into one streamlined game where all you have to do is sit back and enjoy your character doing all the work: With the permission of the creator of this fantastic game, Eric Fredricksen, I've made a very minimal Erlang clone of it called Process Quest. Process Quest is similar in principle to Progress Quest, but rather than being a single-player application, it's a server able to hold many raw socket connections (usable through telnet) to let someone use a terminal and temporarily play the game. The game is made of the following parts: regis-1.0.0 The regis application is a process registry. It has an interface somewhat similar to the regular Erlang process registry, but it can accept any term at all and is meant to be dynamic. It might make things slower because all the calls will be serialized when they enter the server, but it will be better than using the regular process registry, which is not made for that kind of dynamic work. If this guide could automatically update itself with external libraries (it's too much work), I would have used gproc instead. It has a few modules, namely regis.erl, regis_server.erl and regis_sup.erl. The first one is a wrapper around the two other ones (and an application callback module), regis_server is the main registration gen_server, and regis_sup is the application's supervisor. processquest-1.0.0 This is the core of the application. It includes all the game logic. Enemies, market, killing fields and statistics. The player itself is a gen_fsm that sends messages to itself in order to keep going all the time. It contains more modules than regis: pq_enemy.erl This module randomly picks an enemy to fight, of the form {<<"Name">>, [{drop, {<<"DropName">>, Value}}, {experience, ExpPoints}]}. This lets the player fight an enemy. pq_market.erl This implements a market that allows to find items of a given value and a given strength. All items returned are of the form {<<"Name">>, Modifier, Strength, Value}. There are functions to fetch weapons, armors, shields and helmets. pq_stats.erl This is a small attribute generator for your character. pq_events.erl A wrapper around a gen_event event manager. This acts as a generic hub to which subscribers connect themselves with their own handlers to receive events from each player. It also takes care of waiting a given delay for the player's actions to avoid the game being instantaneous. pq_player.erl The central module. This is a gen_fsm that goes through the state loop of killing, then going to the market, then killing again, etc. It uses all of the above modules to function. pq_sup.erl A supervisor that sits above a pair of pq_event and pq_player processes. They both need to be together in order to work, otherwise the player process is useless and isolated or the event manager will never get any events. pq_supersup.erl The top-level supervisor of the application. It sits over a bunch of pq_sup processes. This lets you spawn as many players as you'd like. processquest.erl A wrapper and application callback module. It gives the basic interface to a player: you start one, then subscribe to events. sockserv-1.0.0 A customized raw socket server, made to work only with the processquest app. It will spawn gen_servers each in charge of a TCP socket that will push strings to some client. Again, you may use telnet to work with it. Telnet was technically not made for raw socket connections and is its own protocol, but most modern clients accept it without a problem. Here are its modules: sockserv_trans.erl This translates messages received from the player's event manager into printable strings. sockserv_pq_events.erl A simple event handler that takes whatever events come from a player and casts them to the socket gen_server. sockserv_serv.erl A gen_server in charge of accepting a connection, communicating with a client and forwarding information to it. sockserv_sup.erl Supervises a bunch of socket servers. sockserv.erl Application callback module for the app as a whole. The release I've set everything up in a directory called processquest with the following structure: apps/ - processquest-1.0.0 - ebin/ - src/ - ... - regis-1.0.0 - ... - sockserv-1.0.0 - ... rel/ (will hold releases) processquest-1.0.0.config Based on that, we can build a release. Note: if you go look into processquest-1.0.0.config, you will see that applications such as crypto and sasl are included. Crypto is necessary to have good initialisation of pseudo-random number generators and SASL is mandatory to be able to do appups on a system. If you forget to include SASL in your release, it will be impossible to upgrade the system A new filter has appeared in the config file: {excl_archive_filters, [".*"]}. This filter makes sure that no .ez file is generated, only regular files and directories. This is necessary because the tools we're going to use can not look into .ez files to find the items they need. You will also see that there are no instructions asking to strip the debug_info. Without debug_info, doing an appup will fail for some reason. Following last chapter's instructions, we start by calling erl -make for all applications. Once this is done, start an Erlang shell from the processquest directory and type in the following: 1> {ok, Conf} = file:consult("processquest-1.0.0.config"), {ok, Spec} = reltool:get_target_spec(Conf), reltool:eval_target_spec(Spec, code:root_dir(), "rel"). ok We should have a functional release. Let's try it. Start any version of the VM by doing ./rel/bin/erl -sockserv port 8888 (or any other port number you want. Default is 8082). This will show a lot of logs about processes being started (that's one of the functions of SASL), and then a regular Erlang shell. Start a telnet session on your localhost using whatever client you want: $ telnet localhost 8888 Trying 127.0.0.1... Connected to localhost. Escape character is '^]'. What's your character's name? hakvroot Stats for your character: Charisma: 7 Constitution: 12 Dexterity: 9 Intelligence: 8 Strength: 5 Wisdom: 16 Do you agree to these? y/n That's a bit too much wisdom and charisma for me. I type in n then <Enter>: n Stats for your character: Charisma: 6 Constitution: 12 Dexterity: 12 Intelligence: 4 Strength: 6 Wisdom: 10 Do you agree to these? y/n Oh yes, that's ugly, dumb and weak. Exactly what I'm looking for in a hero based on me: y Executing a Wildcat... Obtained Pelt. Executing a Pig... Obtained Bacon. Executing a Wildcat... Obtained Pelt. Executing a Robot... Obtained Chunks of Metal. ... Executing a Ant... Obtained Ant Egg. Heading to the marketplace to sell loot... Selling Ant Egg Got 1 bucks. Selling Goblin hair Got 1 bucks. ... Negotiating purchase of better equipment... Bought a plastic knife Heading to the killing fields... Executing a Pig... Obtained Bacon. Executing a Ant... OK, that's enough for me. Type in quit then <Enter> to close the connection: quit Connection closed by foreign host. If you want, you can leave it open, see yourself level up, gain stats, etc. The game basically works, and you can try with many clients. It should keep going without a problem. Awesome right? Well... Making Process Quest Better There are a few issues with the current versions of the applications of Process Quest. First of all, we have very little variety in terms of enemies to beat. Second, we have text that looks a bit weird (what is it with Executing a Ant...). A third issue is that the game is a bit too simple; let's add a mode for quests! Another one is that the value of items is directly bound to your level in the real game, while our version doesn't do it. Last of all, and you couldn't see this unless you read the code and tried to close the client on your own end, a client closing their connection will leave the player process alive on the server. Uh oh, memory leaks! I'll have to fix this! First, I started by making a new copy of both applications that need fixes. I now have processquest-1.1.0 and sockserv-1.0.1 on top of the others (I use the version scheme of MajorVersion.Enhancements.BugFixes). Then I implemented all the changes I needed. I won't go through all of them, because the details are too many for the purpose of this chapter — we're here to upgrade an app, not to know all its little '''
