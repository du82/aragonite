["https://lego.com/en-us/categories/adults-welcome/discover-10-things-about-tudor-corner"]
title = "10 things you need to know about LEGO® Icons Tudor Corner | Official LEGO® Shop US"
description = "Join us for a look through the new LEGO® Icons Tudor Corner"
full_description = '{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.lego.com/"},{"@type":"ListItem","position":2,"name":"Interests","item":"https://www.lego.com/categories/interests"},{"@type":"ListItem","position":3,"name":"Adults welcome","item":"https://www.lego.com/categories/adults-welcome"},{"@type":"ListItem","position":4,"name":"10 things you need to know about LEGO® Icons Tudor Corner"}]}HomeInterestsAdults welcome10 things you need to know about LEGO® Icons Tudor Corner10 things you need to know about LEGO® Icons Tudor CornerLearn moreProducts10 things you need to know about LEGO® Icons Tudor Corner Welcome, LEGO® Modular lovers, to the LEGO Icons Tudor Corner. A cozy, rustic new spot with endless charm and featuring everything the historically minded minifigure might need. Certain to lend a touch of old-world charm to your existing Modular collection or to be a beautiful start of something new, we spoke to designer François Zapf to discover 10 things you need to know about this splendid new set. 1. The designers did lots of real-world researchWhile Modular Buildings are not based on real-world buildings, the designers do work hard to capture the spirit of the real architectural style.“We looked at many Tudor buildings,” says François. “Particularly ones that were built ages ago but still survive to today.”2. It was born of a passion within its model designer “Being an architecture lover myself,” says François, “I had a rough vision from the beginning of what I wanted to integrate into the model. It was about capturing a certain aesthetic while still being creative and original.” Builders are sure to love the care and attention that have gone into every aspect of this new set. 3. It’s a celebration of all things British Tudor architecture is distinctly British, and the design team leant into this unique aesthetic throughout their design. “After the Natural History Museum, massive and institutional in its aesthetic, we wanted a cozier and warmer corner with the idea of celebrating British architecture.” 4. It’s part of the LEGO® Modular Buildings Collection The LEGO Icons Tudor Corner is the latest in the ever-popular Modular line, but while exciting, this did come with some pressure for the designer. “Modulars can be intimidating to design because they are highly anticipated and particularly appreciated sets, so expectations are high,” says François. “Over the years, they have become increasingly complex and daring. It is about meeting fans’ expectations and innovating, while respecting the DNA of the range and finding new original stories.” 5. It’s filled with Tudor-specific detail The set features a timber-style building with a steep pitched roof, rustic chimney stacks and an array of vintage treasures within. “This iconic architectural style is easily recognizable with hallmarks such as half-timbering, gabled roofs, decorative brickwork and chimneys which create a striking silhouette,” says François. “When I started working on the model, I focused on the roof first because I knew it was going to be a challenge. And it was! We put a lot of thought into all these different angles to make it work. In the end, it was worth it.” 6. It includes a range of individual businessesDespite being one set, the LEGO Icons Tudor Corner features a restaurant, haberdashery and a clockmaker’s workshop.“We wanted to integrate a living space into the model, and the attic apartment came naturally to mind,” says François. “The idea of the clockmaking workshop came late in the process because we wanted a business that made sense without having a storefront, but that was instantly recognizable.” 7. It hints back to a classic set “The name of the restaurant is The Old Guarded Inn,” says François. “Of course, the different Modulars are interconnected and self-referencing each other, but that name is directly taken from an old set from 1986 (6067 Guarded Inn). I like to imagine that these two buildings are actually the same place at different times.” 8. It comes with eight new minifiguresModular sets are always populated by a range of characters and the LEGO Icons Tudor Corner is no different. “Most of the characters have a function linked to the place,” says François. “Like shopkeepers, tenants, a chef or a chimney sweep. But there is also a passer-by with a red hat. She is the common thread of this modular, wandering through the streets and shops.” 9. It’s perfect for roleplay or for display The Tudor Corner building in this 3,266-piece construction set measures over 12 in. (31 cm) high, 10 in. (26 cm) wide and 10 in. (25 cm) deep. It will provide hours of play and is the perfect gift for people interested in architecture. 10. It’s packed with storytelling potential “The recipe for a great Modular set needs both exciting architecture and engaging storytelling,” says François. “For me, a good design necessarily involves a good story. With a Modular, things get complicated since you also must consider the stories taking place in the previous buildings to bring something new. Fortunately, our team never lack ideas!” PETAL POWER: UNLEASH YOUR LEGO BOTANICALS CREATIVITY WITH JEFF LEATHAM Discover Petal Power, a LEGO Botanicals Workshop, led by the renowned celebrity floral designer, Jeff Leatham. Find out his top tips here.Read moreHow LEGO® designers and the Van Gogh Museum built a masterpieceWe take you behind the scenes to showcase how we made the new LEGO® Art Vincent van Gogh – Sunflowers using color theory and bricks! Read more here.Read moreBehind the Scenes of the LEGO® Ideas The Evolution of STEM SetGo behind the scenes of the LEGO® Ideas The Evolution of STEM set as we discover the process the LEGO designer went through to create this beautiful set.Read moreSink your teeth into the hidden details of the LEGO® Ideas Twilight The Cullen House! Our latest set is perfect for those of you who grew up loving The Twilight Saga… Read moreThe historic details of LEGO® Icons The EnduranceJoin us when we speak to the LEGO® designer behind the design of LEGO Icons The EnduranceRead moreBest Star Wars™ Gift Ideas for AdultsFrom detailed droid models to action-packed starship sets, explore our special selection of the best LEGO® Star Wars™ gift ideas for adults.Read more10 things to discover in The Botanical GardenJoin us for a walk around the new LEGO® Ideas The Botanical Garden and discover this tranquil space.Read moreEverything you need to know about LEGO® Star Wars™ Jabba’s Sail Barge™Join us for a tour of Jabba’s decadent sail barge. The LEGO® Star Wars™ Jabba’s Sail Barge™ Ultimate Collector Series display set is certain to delight fans of the original trilogy.Read moreLooking for more?Check out the Adults Welcome homepage to see our collection of adult-focused sets and articles!Learn more'
