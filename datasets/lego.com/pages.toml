title = "The Best Artificial Plants from the LEGO® Botanicals Collection | Official LEGO® Shop US"
description = "Explore the LEGO® Botanicals collection for stunning artificial plants and flowers that combine creativity, lasting beauty, and zero maintenance"
full_description = '''18+7494.7Pretty Pink Flower Bouquet$59.99Added to My BagPretty Pink Flower BouquetQty: 1Continue ShoppingView My BagAdd to Bag 18+9394.8Wildflower Bouquet$59.99Added to My BagWildflower BouquetQty: 1Continue ShoppingView My BagAdd to Bag 18+7564.6Flower Bouquet$59.99Added to My BagFlower BouquetQty: 1Continue ShoppingView My BagAdd to Bag 8+4304.3Cherry Blossoms$14.99Added to My BagCherry BlossomsQty: 1Continue ShoppingView My BagAdd to Bag {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.lego.com/"},{"@type":"ListItem","position":2,"name":"Interests","item":"https://www.lego.com/categories/interests"},{"@type":"ListItem","position":3,"name":"Adults welcome","item":"https://www.lego.com/categories/adults-welcome"},{"@type":"ListItem","position":4,"name":"The Best Artificial Plants from the LEGO® Botanicals Collection"}]}HomeInterestsAdults welcomeThe Best Artificial Plants from the LEGO® Botanicals CollectionThe Best Artificial Plants from the LEGO® Botanicals CollectionProductsLearn moreThe Best Artificial Plants from the LEGO® Botanicals CollectionPotted plants and flower bouquets can add a special touch to liven up indoor spaces. Whether used as office or home decor, they provide a nice bit of nature to brighten the mood of any room. For plant lovers that want all the beauty of the natural world without the maintenance, there's LEGO® Botanicals sets. Fun to build and beautiful to display, these decorative artificial plants come in a wide variety of shapes, colors and sizes. The best part? These LEGO flowers are guaranteed to never wilt or die, and there’s no watering required. We’ve rounded up a list of the best LEGO Botanicals artificial plants and flowers. Whether you’re looking for decor for your own space, a project to do with someone special or a gift for a plant-loving friend, there’s a perfect set for you.Flower ArrangementThere’s nothing more uplifting than a flower arrangement, apart from the LEGO® Botanicals Flower Arrangement (10345)! This set is guaranteed to brighten up any room, and you won’t even have to replace it. The set has 14 flowers including hydrangeas, baby’s breath, lilies and peonies, all arranged in a white vase.Take your time building each individual flower before arranging them in a beautiful display. Then, you can use the pin system to rearrange the flower heads, which means you can also swap them around with flower heads from other LEGO Botanicals sets to adapt your arrangement to the seasons or for any special occasion!The Four GentlemenLooking for a thoughtful and elegant floral gift? “The Four Gentlemen”, a collection of four plants made famous by traditional art, is an ideal arrangement for a truly stunning floral decoration.The gentlemen include the Chrysanthemum (10368), Plum Blossom (10369), Mini Orchid (10343) and Lucky Bamboo (10344) — individual floral sets each symbolizing the four seasons and timeless virtues like humility, perseverance, and purity. From vibrant petals and delicate blooms to sleek, calming designs, these sets make a meaningful addition to any space.18+3254.4Lucky Bamboo$29.99Added to My BagLucky BambooQty: 1Continue ShoppingView My BagAdd to Bag18+2744.6Mini Orchid$29.99Added to My BagMini OrchidQty: 1Continue ShoppingView My BagAdd to Bag18+2784.8Chrysanthemum$29.99Added to My BagChrysanthemumQty: 1Continue ShoppingView My BagAdd to Bag18+3274.7Plum Blossom$29.99Added to My BagPlum BlossomQty: 1Continue ShoppingView My BagAdd to BagPretty Pink Flower BouquetUnleash your inner florist with this calming and rewarding building experience. The LEGO® Botanicals Pretty Pink Flower Bouquet (10342) set includes 15 unique LEGO flower stems, each crafted to resemble real blooms. Among the bouquet’s array of flowers are daisies, cornflowers, roses, ranunculus, cymbidium orchids and a waterlily dahlia. Not only does this set make for a creative project, but it also offers lasting decor that’s both fun to build and stylish once displayed. Unlike traditional flowers, these LEGO blooms stay vibrant forever, making them a stunning centerpiece or accent for any space. For an added touch, you can incorporate the LEGO Botanicals Wildflower Bouquet (10313) or the LEGO Botanicals Flower Bouquet (10280) to customize an even bigger floral display!18+7494.7Pretty Pink Flower Bouquet$59.99Added to My BagPretty Pink Flower BouquetQty: 1Continue ShoppingView My BagAdd to Bag18+9394.8Wildflower Bouquet$59.99Added to My BagWildflower BouquetQty: 1Continue ShoppingView My BagAdd to Bag18+7564.6Flower Bouquet$59.99Added to My BagFlower BouquetQty: 1Continue ShoppingView My BagAdd to BagBonsai TreeA tree well known for its association with mindfulness and inner peace, the LEGO® Botanicals Bonsai Tree (10281) set is perfect as a birthday gift, a thoughtful gesture for a loved one or a personal indulgence. This set captures imagination with its beauty and creativity, and even allows you to choose between classic green leaves or beautiful pink cherry blossoms to customize your display. What makes it even better? The leaf elements are made from sustainable, plant-based plastic sourced from sugarcane, adding an extra touch of nature to this fun gift. Whether you’re a seasoned LEGO builder or just getting started, the LEGO Bonsai Tree is a relaxing and rewarding way to celebrate the beauty of nature.Bouquet of RosesBring home a dozen of these beautiful red blooms with the LEGO Botanicals Bouquet of Roses (10328). With separate instructions and brick bags for building roses in three stages of bud, blooming and fully open, this set is an absolute joy to build alone or with someone else. The long stems make them perfect for displaying in a vase alongside white sprigs of brick-built baby’s breath.Tiny PlantsWe understand that flowers aren’t for everyone. The LEGO Botanicals Tiny Plants (10329) set is perfect for those of us who like our plants a little more prickly. This collection of nine models of cacti, succulents, tropical and even carnivorous plants has a little something for everyone. With separate building instructions and models ranging from easy to advanced, this set will keep you entertained for hours. And when the building is finished, keep the fun going by arranging a plant display you can enjoy for years to come – without worrying what you’re going to feed the Venus flytrap.OrchidAdd a touch of elegance to your décor with the LEGO® Botanicals Orchid (10311) building kit. The perfect blend of playfulness and sophistication, this relaxing build includes authentic details like white and pink flowers, basal leaves and creeping aerial roots. Keep an eye out for the little pink frog elements in the center of each bright bloom!Build-Your-Own Arrangement with LEGO® FlowersLet your creativity bloom with a build-your-own bouquet. Create your own arrangement with LEGO flowers such as Cherry Blossoms (40725), Sunflowers (40524), Lotus Flowers (40647) and Roses (40460), or add them to the Flower Bouquet (10280) or Wildflower Bouquet (10313). Or make a mixed-media bouquet, bundling your flowers with chocolates, origami flowers or something else that inspires you. Whatever you choose, one thing is certain: you’ll make something that is truly unique to you.8+1914.5Sunflowers$14.99Added to My BagSunflowersQty: 1Continue ShoppingView My BagAdd to Bag8+1204.7Roses$14.99Added to My BagRosesQty: 1Continue ShoppingView My BagAdd to Bag8+4304.3Cherry Blossoms$14.99Added to My BagCherry BlossomsQty: 1Continue ShoppingView My BagAdd to Bag8+2204.8Lotus Flowers$14.99Added to My BagLotus FlowersQty: 1Continue ShoppingView My BagAdd to Bag8+2164.6Daffodils$14.99Added to My BagDaffodilsQty: 1Continue ShoppingView My BagAdd to BagSucculentsSucculents have become a beloved way to bring a touch of greenery and style into any home. With the LEGO® Botanicals Succulents (10309) building kit for adults, you can enjoy the beauty of these charming plants without the upkeep. This hands-on project offers a relaxing and rewarding experience as you craft 9 unique succulent models, each inspired by real-life varieties. Once complete, you’ll have an elegant, low-maintenance plant display to brighten up your living space. The LEGO Succulents set makes a thoughtful gift for plant lovers and design enthusiasts alike. Whether you’re building together or gifting it to someone special, it’s sure to offer hours of fun and inspiration.WreathLooking for a creative way to celebrate the changing seasons? The LEGO® Botanicals Wreath (10340) building set offers a unique opportunity to craft a stunning centerpiece that captures the beauty of fall and winter. Perfect for adults seeking a relaxing activity or a thoughtful gift, this elegant home decor piece brings seasonal charm to any space. Whether displayed on a wall, arranged as a table decoration or gifted during the holidays, it makes a timeless addition to your celebrations. A wonderful addition to this set is the LEGO Botanicals Poinsettia (10370). This detailed LEGO plant replica of the stunning ‘Grande Italia’ poinsettia, nestled in a charming woven-basket-style flowerpot, captures the vibrant colors and intricate design of the beloved holiday flower.Looking for more LEGO® sets?The LEGO® Botanicals collection offers a stunning array of artificial plants and flowers that combine creativity, relaxation and lasting beauty. Whether you're looking to brighten up your home, find a unique gift or simply enjoy a mindful building experience, these sets deliver something truly special. From timeless bouquets to seasonal wreaths and charming succulents, there’s a set for every taste and occasion. If you’re in search of a Valentine’s Day gift, check out our Best Flowers for Valentine’s Day.Want to grow your collection?Try the new Gift FinderLooking for the perfect set? Let us lend a handTry now!Stunning sets for grownupsAdults are very welcomeLearn moreJoin LEGO® InsidersDiscover a world of members-only rewards and exciting experiences.Learn moreBest Gifts for CouplesFrom beautiful wildlife to stunning display pieces, you’ll be sure to find something that will delight every couple, wherever their interests are.Read moreBest LEGO® Flowers for Valentine’s DayGive your Valentine the gift of timeless botanical beauty this Valentine’s Day with our collection of stunning flower sets.Read moreBest Gifts for Art LoversFrom timeless paintings to iconic superhero skylines, here’s the ultimate list of the best LEGO® gifts for art lovers.Read moreCreative Girls’ Room IdeasDiscover a world of playful and imaginative girls' room decor with these creative LEGO® sets and products.Read moreBest Gifts to Give Your FriendsCelebrate your friends with a unique LEGO® gift! We’ve got LEGO set ideas for everyone on your list.Read moreBest Gifts for Animal LoversWhether they’re into mythical unicorns, or adorable puppies, you’re sure to find the perfect gift for any animal-lover in our extensive collection of LEGO® sets.Read moreUnique LEGO® Valentine’s Day Gifts 2025From nostalgic characters and romantic bouquets to historic masterpieces, find the perfect unique Valentine’s Day LEGO® set for your loved one this year.Read more'''
