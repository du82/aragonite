["https://lego.com/en-us/categories/adults-welcome/article/the-evolution-of-stem"]
title = "Behind the Scenes of the LEGO® Ideas The Evolution of STEM Set | Official LEGO® Shop US"
description = "Go behind the scenes of the LEGO® Ideas The Evolution of STEM set as we discover the process the LEGO designer went through to create this beautiful set"
full_description = '''{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.lego.com/"},{"@type":"ListItem","position":2,"name":"Interests","item":"https://www.lego.com/categories/interests"},{"@type":"ListItem","position":3,"name":"Adults welcome","item":"https://www.lego.com/categories/adults-welcome"},{"@type":"ListItem","position":4,"name":"Behind the Scenes of the LEGO® Ideas The Evolution of STEM Set"}]}HomeInterestsAdults welcomeBehind the Scenes of the LEGO® Ideas The Evolution of STEM SetBehind the Scenes of the LEGO® Ideas The Evolution of STEM SetLearn moreProductsBehind the Scenes of the LEGO® Ideas The Evolution of STEM SetWe love science, technology, engineering and mathematics (STEM). There, we said it.After all, every time we (or, for that matter, you) create with LEGO® bricks, we’re using STEM principles and techniques.To celebrate the wonder of STEM and encourage fan builders to do the same, we launched a platform challenge on LEGO Ideas in collaboration with TARGET. The challenge was called Celebrate the Wonder of STEM, and challenged creators with designing a new model that celebrated any and all aspect of science, technology, engineering and mathematics.The winning entry eventually became the LEGO Ideas The Evolution of STEM set, and we’re here to tell you everything you need to know.An encyclopedic childhood loveThe winner was UK-based Daniel Bradley for his entry Knowledge is Power. Daniel is an accountant by trade, so he’s presumably well-versed in the M of STEM, but his idea for an open book bursting with the very best of STEM came from his favorite book when he was younger.“As a child, I had an encyclopedia for kids that I was just obsessed with,” said Daniel. “I wanted to convey the curiosity it sparked in me by having this open book with all the different fields of STEM coming alive, sprouting from the pages.”A brick-built book forms the buildable base and is topped by mini builds that represent historic innovations.And what are those innovations?Well, we’re glad you asked.Celebrating the best breakthroughsThe history of STEM has more inventions, innovations and ideas than we could ever cram into one set, but we’ve packed plenty of them into this one. From the smallest molecules to large buildings, it’s all there.Let’s start small with the 3D replica of a carbon atom. Now, this one is pretty important, since carbon, made up of six neutrons, six protons and six electrons, is the element on which all life on earth is based. Possibly equally important, is the DNA strand diagram representing a small section of deoxyribonucleic acid with the corresponding base pairs ATCG.At the other end of the size scale, there is a bustling metropolis, a distillation of many capital cities icons of the world that symbolize modern city living and globalization. There’s also an early model car to signify the importance of transport and, to represent the digital age, an early home computer with internet screen and a robotic arm symbolizing automation and mass-manufacturing.The natural world is well represented too, through Sir Isaac Newton’s apple tree, where the British polymath developed his theory of gravity, George Washington Carver’s botanical bed, including cotton, peanut and corn flowers, which he is famous for promoting throughout America, and a bumble bee. After all, they are one of nature’s great engineers.Next, we blast off into the space age, with a brick-built model of the NASA Voyager Probe. Launched in 1977, the Voyager probes are NASA’s longest-operating mission and the only spacecraft ever to explore interstellar space. The probe carries with it a Golden Record, which contained sounds and images showing the diversity of life and culture on Earth.It's important to remember too, that almost all these things began life as an idea in someone’s head. So, to pay homage to some of the most important theories from history, there’s a chalkboard that features references to Fibonacci’s spiral and Einstein’s theory of relativity.And because there would be no STEM without the incredible people that have dedicated their lives to it, Daniel and the LEGO design team picked some of the very best to showcase in the set.Meet the MinifiguresThe set includes LEGO minifigures of three famous scientists: Marie Curie (née Skłodowska), Sir Isaac Newton and George Washington Carver. It’s an extraordinary line-up of truly great figures in history.Polish chemist and physicist Marie Curie (née Skłodowska) discovered two new elements, pioneered research on radioactivity and was the first person ever to win two Nobel prizes.While he may be famous for an apple that he saw falling to the ground that led to his law of universal gravitation, Sir Isaac Newton was prolific in mathematics, astronomy, physics and more.A pioneering agricultural scientist and early environmentalist, George Washington Carver used science to improve efficiency in farming, prevent soil depletion and improve the lives of farmers.Celebrate STEM or give a great giftMaybe you have a passion for STEM yourself or maybe you’re looking for great STEM gifts for friends or family. Whatever you’re looking for, there is a whole universe to be discovered in our new set.PETAL POWER: UNLEASH YOUR LEGO BOTANICALS CREATIVITY WITH JEFF LEATHAM Discover Petal Power, a LEGO Botanicals Workshop, led by the renowned celebrity floral designer, Jeff Leatham. Find out his top tips here.Read moreHow LEGO® designers and the Van Gogh Museum built a masterpieceWe take you behind the scenes to showcase how we made the new LEGO® Art Vincent van Gogh – Sunflowers using color theory and bricks! Read more here.Read moreSink your teeth into the hidden details of the LEGO® Ideas Twilight The Cullen House! Our latest set is perfect for those of you who grew up loving The Twilight Saga… Read more10 things you need to know about LEGO® Icons Tudor CornerJoin us for a look through the new LEGO® Icons Tudor CornerRead moreThe historic details of LEGO® Icons The EnduranceJoin us when we speak to the LEGO® designer behind the design of LEGO Icons The EnduranceRead moreBest Star Wars™ Gift Ideas for AdultsFrom detailed droid models to action-packed starship sets, explore our special selection of the best LEGO® Star Wars™ gift ideas for adults.Read more10 things to discover in The Botanical GardenJoin us for a walk around the new LEGO® Ideas The Botanical Garden and discover this tranquil space.Read moreEverything you need to know about LEGO® Star Wars™ Jabba’s Sail Barge™Join us for a tour of Jabba’s decadent sail barge. The LEGO® Star Wars™ Jabba’s Sail Barge™ Ultimate Collector Series display set is certain to delight fans of the original trilogy.Read moreLooking for more?Check out the Adults Welcome homepage to see our collection of adult-focused sets and articles!Learn more'''
