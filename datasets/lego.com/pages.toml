["https://lego.com/en-us/categories/interests"]
title = "Interests | Official LEGO® Shop US"
full_description = "Adults welcomeCreativity isn’t just for kids. LEGO® sets designed and curated with adult builders in mind provide a more challenging yet rewarding experience. From epic builds to fantastically detailed models, LEGO® sets offer a relaxing way to spend your time creating display-worthy sets.Shop Now AnimalsLions and tigers and bears, oh my! Your animal lover will love all of our LEGO® animal sets! Don't feed the animals, but they can build them!Shop Now Arts and craftsLooking for a fun way to unleash creative possibilities? Many LEGO® sets are perfect for Arts and Crafts fans, from LEGO DOTS to LEGO Art, Classic and more.Shop Now BuildingsBuild from the ground up to create structures big and small as a rewarding experience for all ages. Featuring modular city buildings, architecturally authentic houses, world monuments and pop culture-inspired TV sets, you’ll find your creative spirit here. These make a great gift that’s worthy of display.Shop Now CarsWhat drives your passion? Car enthusiasts of all ages can build authentic-looking vehicles both big and small, recreate iconic speedsters and construct finely detailed Technic™ sports cars. Get behind the wheel of action-packed toy cars and collectibles.Shop Now Coding for kidsAs a rule of thumb, everyone can learn to code with these LEGO® sets. You’re off to a very good start if you’re curious and playful by nature, as kids are. That’s really the only basic skills you need to begin your coding experiments.Shop Now DragonsWhere do dragons come from? How many species are there? Sure, some breathe fire. But why stop there? Yours may be vegetarian. Others could dance the flamenco. Find YOUR kind of dragon right here.Shop Now FantasyIf your builder loves the fantasy world, they’ll really enjoy LEGO® fantasy sets. From Harry Potter™ and The Lord of the Rings™ to Disney and Avatar, LEGO sets can take you on endless adventures to magical worlds.Shop Now MoviesReady to become a LEGO® director? Relive your favourite moments from films in miniature with these instantly recognisable scenes and characters - or use your imagination to create whole new stories!Shop Now"
