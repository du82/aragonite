title = "Design | Lennart Jörgens"
description = "Lennart is a product-focused full stack engineer with years of experience in building large-scale projects and shipping high-quality work to millions of users. Adept at building delightful, inclusive, and well-documented solutions to customers' needs."
full_description = "Design While I began doing UI & webdesign with Photoshop I’m now primarily using Figma to create my designs. I enjoy creating minimalistic designs with strong typography, a lot of whitespace and emphasis on a couple of vibrant colors. From time to time I switch to creating whimsical designs that incorporate other disciplines I’m proficient in such as 3D art and illustration. I still stick to Photoshop when I create compositings – to me the most rewarding craft as it’s about stitching multiple photos together to a coherent image."
