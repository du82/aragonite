["https://lesswrong.com/events/JNL2bmDXmaG7YnRbF/maisu-minimal-ai-safety-unconference"]
title = "MAISU - Minimal AI Safety Unconference  — LessWrong"
description = "MAISU starts with an Opening session on April 18th (Friday), but most of the sessions will happen during April 19th-21th. You’re welcome to join as m…"
full_description = "MAISU starts with an Opening session on April 18th (Friday), but most of the sessions will happen during April 19th-21th. You’re welcome to join as much or little as you want.The event is for anyone who wants to help prevent AI-driven catastrophe. Other than that, we’re open to all perspectives. However each individual session will typically have narrower scope. When attending a session please respect the specific scope of that session.Because this is an Unconference, the schedule is open to anyone to add sessions. Expect the schedule to continuously expand as the event approaches. Official websiteThe official website is guaranteed to have the latest information. This LessWrong event post might be updated less frequently.Register hereIf you register, you will receive email updates about the event.You can attend without registering, but you might miss important information.Click here to see who else has registered.Schedule Don’t worry if it looks sparse now. More sessions will be added (maybe by you?), this is how unconferences work.You can put anything you want on the schedule, any type of session, as long as it’s safety relevant.If you put something on the schedule you’re responsible for hosting it.When scheduling something, please make sure it’s clear how it’s relevant to AI Safety (unless it’s a purely fun/social session).Some examples of things you can hostA talk presenting …… your results… other peoples results that you find interesting… an intro level overview of some subset of AI safety… an in-progress project you want feedback onAn open discussion on a topic you’re interested inA fun game, or other social activitySome type of exercise that you find useful for thinking about AI safetySharing your hot takes with an open invitation to debate youGeneral adviceIf you host a talk, make sure to leave plenty of time for discussions afterwards1h hour is a good length for most sessionsWarning!TeamUp (the scheduling app we’re using) does not automatically update. You need to manually refresh the schedule, or you might miss things. Sessions will be added continuously to the schedule. There will likely be some last minute additions and/or changes even after the event has started.Discussions & Networking in the AI Alignment SlackWe don’t have an event-specific Slack or Discord, instead we’re invading the AI Alignment Slack for the duration of the event.#eventsUse this channel for event related discussions, e.g. logistics questions, or advertising your session.#generalUse this channel for general AI Safety related discussions. Avoid anything too MAISU specific.#introductionsUse this channel to introduce yourself to other MAISU participants and everyone else who frequents this slack. MAISU & AISCMAISU is part of AISC in the sense that all AISC teams are asked to present their projects during MAISU, and the organiser of MAISU is one of the organisers for AISC.But MAISU is also not part of AISC in the sense that it’s an open event, where anyone is invited to give a talk and/or host other sessions. Posted on: 21st Feb 2025"
