["https://lesswrong.com/posts/nAsMfmxDv6Qp7cfHh/fabien-s-shortform"]
title = "Fabien's Shortform — LessWrong"
description = "A collection of shorter posts by LessWrong user Fabien Roger"
full_description = "This is a special post for quick takes by Fabien Roger. Only they can create top-level comments. Comments here also appear on the Quick Takes page and All Posts page. Here are the 2024 AI safety papers and posts I like the most.The list is very biased by my taste, by my views, by the people that had time to argue that their work is important to me, and by the papers that were salient to me when I wrote this list. I am highlighting the parts of papers I like, which is also very subjective.Important ideas - Introduces at least one important idea or technique.★★★ The intro to AI control (The case for ensuring that powerful AIs are controlled) ★★ Detailed write-ups of AI worldviews I am sympathetic to (Without fundamental advances, misalignment and catastrophe are the default outcomes of training powerful AI, Situational Awareness)★★ Absorption could enable interp and capability restrictions despite imperfect labels (Gradient Routing)★★ Security could be very powerful against misaligned early-TAI (A basic systems architecture for AI agents that do autonomous research) and (Preventing model exfiltration with upload limits) ★★ IID train-eval splits of independent facts can be used to evaluate unlearning somewhat robustly (Do Unlearning Methods Remove Information from Language Model Weights?) ★ Studying boar... (read more) Someone asked what I thought of these, so I'm leaving a comment here. It's kind of a drive-by take, which I wouldn't normally leave without more careful consideration and double-checking of the papers, but the question was asked so I'm giving my current best answer.First, I'd separate the typical value prop of these sort of papers into two categories:Propaganda-masquerading-as-paper: the paper is mostly valuable as propaganda for the political agenda of AI safety. Scary demos are a central example. There can legitimately be valuable here.Object-level: gets us closer to aligning substantially-smarter-than-human AGI, either directly or indirectly (e.g. by making it easier/safer to use weaker AI for the problem).My take: many of these papers have some value as propaganda. Almost all of them provide basically-zero object-level progress toward aligning substantially-smarter-than-human AGI, either directly or indirectly.Notable exceptions:Gradient routing probably isn't object-level useful, but gets special mention for being probably-not-useful for more interesting reasons than most of the other papers on the list.Sparse feature circuits is the right type-of-thing to be object-level usef... (read more)"
