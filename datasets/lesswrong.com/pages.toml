description = "How can we think better on purpose? Why should we think better on purpose?      For two years Eliezer Yudkowsky wrote a blogpost a day, braindumping thoughts on rationality, ambition and artificial intelligence. Those posts were edited into this introductory collection, recommended reading for all Lesswrong users."
full_description = "How can we think better on purpose? Why should we think better on purpose? For two years Eliezer Yudkowsky wrote a blogpost a day, braindumping thoughts on rationality, ambition and artificial intelligence. Those posts were edited into this introductory collection, recommended reading for all Lesswrong users. LessWrong can be kind of intimidating - there's a lot of concepts to learn. We recommend getting started with the Highlights, a collection of 50 top posts from Eliezer's Sequences. A day or two read, covering the foundations of rationality. What if Harry Potter was a scientist? What would you do if the universe had magic in it? A story that conveys many rationality concepts, making them more visceral and emotionally compelling. Essays by Scott Alexander exploring science, medicine, philosophy, futurism, and politics. (There's also one about hallucinatory cactus people but it's not representative). Each December, the LessWrong community reviews the best posts from the previous year, and votes on which ones have stood the tests of time."
