["https://lesswrong.com/users/benito"]
title = "Ben Pace - LessWrong"
description = "Ben Pace's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = '''I'm an admin of LessWrong. Here are a few things about me.I generally feel more hopeful about a situation when I understand it better.I have signed no contracts nor made any agreements whose existence I cannot mention.I believe it is good take responsibility for accurately and honestly informing people of what you believe in all conversations; and also good to cultivate an active recklessness for the social consequences of doing so.It is wrong to directly cause the end of the world. Even if you are fatalistic about what is going to happen.(Longer bio.) Thanks for this short story! I have so many questions.This was during training camp? How many days/weeks/month in was this?How many people went through this training camp with you? Are you still friends with any of them?How long was training, and then how long did you serve as a professional?I encourage any links you have to content about these folks in future stories. I had to check the Wikipedia page before I fully believed that the logo was a skull with knife through it.Yes, I would be interested in reading another story about your time there. This story gave me some insight into the context, I think I would like something heavier on the logos, but I'd be happy with either. Intercom please! Helps for us to have back and forth like "What device / operating system / browser?" and other relevant q's. That sounds good to me i.e. draft this post, and then make it a comment in one of those places instead (my weak guess is a quick take is better, but whatever you like). Posted either as a comment on the seasonal open thread or using the quick takes / shortform feature, which posts it in your shortform (e.g. here is my shortform).I'm saying that this seems to me not on the level of substance of a post, so it'd be better as a comment of one of the above two types, and also that it's plausible to me you'd probably get more engagement as a comment in the open thread. I have used my admin powers to put it into a collapsible section so that people who expand this in recent discussion do not have to scroll for 5 seconds to get past it.'''
