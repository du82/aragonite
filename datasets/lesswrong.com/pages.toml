["https://lesswrong.com/users/halinaeth"]
title = "halinaeth - LessWrong"
description = "halinaeth's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = '''found LW as a child, found it 10 years later through a fortunate series of coincidences :)say hi from LW: @halina_eth on X So grateful to Ben, Aella, and Ronny for hosting and for all the people with whom I had lively debates with this past Saturday! Like Matt it was my first in person rat event, and I really enjoyed meeting everyone and seeing how open everyone is to friendly debate and probing questions.I really hope these meetups continue- happy to help & support to help make it possible.Thanks again everyone, cheers to many fun connections to come in 2025! Even things like biological limits which turned out to be mental (the idea a 4 minute mile was impossible, for instance). I wonder if we just told people the problem was solved, and ask them to find the solution, would the mere fact of confidence there is a solution lead to greater chances of finding a solution? I remember the story of the mathematician to which this exact thing happened (he accidentally was assigned a famous unsolved problem as homework, and solved it). Someone feel free to correct if that was a myth or a real incident. Reminds me of how @visakanv (on X) said he's very happy with a day's work if he got in 3-4 hours of good solid work. And how over the timescale of years, it compounds much more than anyone would believe. Definitely gives me optimism, and appreciate the two definitions of "impossible" you've outlined too. Fascinating post, like a version of prions on an orthogonal axis, but with way more possibility to expand. Wonder if other fields have a version of this, where by inverting or adjusting a basic principle you unlock a whole field as rich and diverse as the original. Perhaps imaginary numbers are analogous? Loved reading this! Suspected the premise based on title, but nevertheless great to see the premise fleshed out in a short story. And the pov “plot twist” was really fun, thanks for the thought experiment! Comments have great nuance i.e. "systems/processes greatly expand word count". But I'd say assuming lack of system & a randomly selected audience, the author's point stands. After all, in media there's a reason they value "sound bites" so much- and those are more like 5 syllables. Think, "grab em by the ****" and "nasty woman" from the 2016 election.Would love to be corrected though!'''
