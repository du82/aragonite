full_description = '''"The problem is that Johnson is expecting this to translate into defeating aging, which I very much do not expect."I'm fairly confident Johnson is betting on future tech solving aging and his goal is to live long enough to be there for it by creating measurements and therapies for the health of every organ.From his site: "2023: don’t die because we don’t know how long and well we can live ""This time, our time, right now - the early 21st century - will be defined by the radical evolution of intelligence: human, AI and biology. Our opportunity is to be this exciting future. "https://protocol.bryanjohnson.com/ Hey Adam, please review some of replies I've made to other commentators for issues I don't address here.>ease of useA keyboard shortcut, chrome extension that serves the results in a side bar or some other spot, autocomplete in the search bar, or bookmark would remove that friction. If I want to go to lesswrong, I hit ctrl-t for a new tab, type "les" and chrome completes the url. The same would apply.>cognitive overheadI do not think about those things for something that delivers me consistent value. If the starting premise is "I don't value this." It doesn't matter what comes after it.>less time browsingWanting to spend less time doing semi-productive browsing isn't something a better search engine can fix - unless it's because the result quality is the reason the time is semi-productive. Tried that previously. It limits the search results and it doesn't rank the results it simply spits out first results it finds on the first domain it searches. You can give the one I made a try to see what it mean. Don't be fooled by the number of pages it lists at the bottom - that's fake: https://cse.google.com/cse?cx=cced60b51960f6137 Use cases: superconductor, Ukraine war, LLM development, diet or exercise, dealing with anxiety, etc. But you would only get results from a curated list of sites with higher epistemic standards.I should have been more explicit in my initial post. I was relying on the word "rationalist" to do too much. No worries about negativity. It is exactly what I want, so thank you.'''
