full_description = '''PDF version. Image sizes best at berkeleygenomics.org with a wide monitor. Twitter thread Introduction This article summarizes the technical pathways to make healthy humans with significantly modified genomes. These are the pathways that I'm aware of and that seem plausibly feasible in the next two decades. A short summary, in a diagram: Annotated table of contents: Reproductive genomic vectoring explains the general idea of human germline genomic engineering, and distinguishes editing and selection. Comparing editing and selection talks about general differences between the two kinds of genomic vectoring methods. Reproductive GV and epigenomic correctness (EC), Methods to handle epigenomic correctness, and How GV and EC interact discuss the epigenomic correctness problem in germline engineering—what it is, why it matters, and how to address it. Summary of genomic vectoring methods gives an annotated table of contents for the following Methods sections. The Methods sections—on Simple embryo selection, Gamete selection, Chromosome selection, Iterated recombinant selection, and Iterated multiplex CRISPR editing—give more detail about each genomic vectoring method: what it is, obstacles, variations, and how powerful it is. The appendices give additional technical information, if you're looking around and saying "I'm not in the weeds enough, I want to be more in the weeds.". Here's a sneak peek about the strength of different genomic vectoring methods: The list of specific methods that this table summarizes starts after the section Summary of genomic vectoring methods. This article is roughly organized from general to specific, first discussing things that apply to the whole area, and then later discussing specific methods. I won't lie, this article book is a bit of a slog. You try writing a book about the state of the art of realistic germline engineering in a way that is automatically fun, and then get back to me, ok? But listen: There's lots of pictures, and some of them are good pictures. You could just skim through and look at the pictures, and then read more if there's something you really want to know. If you're looking for mathy stuff, or you just want to hear about the genomic vectoring methods, start here. Also, if you have some sort of oomph you might put into this (such as brainpower or moneypower), or if you're up for a recorded and published conversation, you can message me or email me, and I'll talk you through this stuff. Gmail address: berkeleygenomicsproject Takeaways The bottleneck to strong human germline genomic engineering is not polygenic scores. The bottleneck also isn't really about making a cell with the genome you want. Rather, the bottleneck is epigenomic correction—making an engineered cell have the right epigenomic state so that it can make a healthy baby. You would be surprised at how soon strong germline engineering can be made technically feasible. The scientific and technological precursors to strong human germline genomic engineering are ripening. There are several paths that look fairly feasible. Peering through the looking glass at biotechnology, small feats may appear much easier than they really are, but big feats may appear much harder than they really are. It would probably take much less than a Manhattan project to make germline engineering real; the question is more about deciding to do it, rather than whether it can be done. This is an "enchanted field". Many advances could be combined with each other to make the methods safer, more powerful, and less expensive. That means that efforts are helpful not just in expected value, but with substantial probability. To some extent this is true of science in general. But in germline genomic engineering, different last-mile startups in the area will likely literally synergize, e.g. through licensing, collaboration, or serving as multiple inputs to other groups (see below). Many methods have a nice innovation ramp. You could perform a few edits at first, then more and more; or transplant just one chromosome, then several; or do iterated meiotic selection for one or two rounds, then several. The innovation ramp, plus the potential for combinations, sets the field up for a sustained ramp-up of energy once it gets started in earnest. The component technologies—reproductive, genomic—need more funding, talent, and project organization. There are lots of things to do, and the existing academic funding and commercial investment landscape is far from efficient with respect to accelerating germline engineering technology. Experts and their projects need more funding to go faster and create more public goods for frontier assisted reproductive technologies. Some other projects that could be created de novo: Create a primate research center focused on studying frontier reproductive technologies, e.g. verifying that they produce healthy offspring. Make an atlas of single-cell RNA sequencing data in primate embryonic development. More epigenomic sequencing for human reproduction. E.g. characterize the natural range of variation in epigenomic state between single cells within one early-stage human embryo. More talent and funding for ovarian follicle culture, which is a likely way forward for making oocytes in vitro. Some genomic vectoring methods could likely be applied today or very soon in animals. Testing these methods would give valuable feedback about the techniques and about what happens when you genomically vector strongly according to a PGS in one shot. Gather more human phenotype/genotype data, especially for personality traits. Develop methods for intact chromosome transplantation. (Three remarkable and little appreciated facts: First, recombinant chromosome selection is a quite strong genomic vectoring method. Second, average chromosome selection with many donors is also quite strong. Third, chromosome selection might largely bypass the epigenomic correction problem, which is a major bottleneck for strong genomic vectoring. It might be infeasible, but for reasons decorrelated from other approaches.) Scientists, technologists, investors, grantmakers, parents, policymakers, other stakeholders: If you want to help the field along by coordinating, starting projects, or funding work, we'd love to hear from you in DMs or at this gmail address: berkeleygenomicsproject Consider joining us at the Reproductive Frontiers Summit 2025. Disclaimers I'm not a biologist. Parts of this article attempt to summarize some aspects of a large, complex, changing subarea of biology—the cell biology of human reproduction—as it relates to the possible future technology of human germline engineering. These summaries will necessarily be very incomplete, and unfortunately likely contain errors and confusions. Further, my knowledge is only a few steps from the shallow end, so for example I might say things based on outdated consensus. My hope is that the summaries, while lossy, will help others think about the subarea by pulling lots of threads together into one place and analyzing the basics of how those threads interact with germline genomic engineering. This article is not intended as an explainer, but rather an attempt to summarize the state of the art for people interested in understanding or contributing to future developments. Unfortunately several of the sections are not independent from the rest of the article, so you might have to jump around and also internet search things. In trying to find ways to implement strong human germline engineering, my understanding of what's possible, feasible, or easy seems to continually change, even aside from the fact that the field is progressing. There is a "layman's optimism" I've encountered in myself and in others. For example, to my layman's eyes, chromosome selection seems so simple—you just, you know, move the little guys around a bit until they're all together. But any specific plan has big holes in it (micromanipulator? nah, chromosomes are tiny; FACS? that'll probably break the DNA; do it on sperm DNA? it's highly compacted and inaccessible; etc.). Yes, a woman could extract some of her ovary tissue and then grow a myriad of eggs... if she knows someone who knows how to do ovarian culture well, and if ovarian follicle dominance doesn't get in the way too much. Yes, you could edit spermatogonial stem cells and transplant them into testes... but they'd be outcompeted by unedited spermatogonia and die out. I've tried fairly carefully to not overstate the feasibility of methods. The math about the genomic vectoring power of different methods should be fairly solid, given the assumptions I make. The assumptions that connect the math with actual cells and DNA moving around are shakier; I make many simplifications, some knowingly and some not. The conclusions I give are based on simulations of a simplified abstract model of genomic selection protocols, and is not based on using real DNA sequences of real genomes and operating on those. But I think that the qualitative conclusions should hold fairly well in most cases—e.g. comparisons of strength between different methods, and general ballpark estimates of strength. My hope is to communicate not "this is exactly how powerful these methods are" but rather "a natural first-order estimate says this method is really strong". I think history shows that "surprisingly large first-order estimate plus lots of complications" is, while very far from a sure bet, nevertheless often a very good thing to bet on. In this article I speak solely on my own behalf. The entire process of reproductive genomic vectoring (i.e. human germline genomic engineering) is likely to be complicated, especially at first, and hard to foresee. This article is not trying to address everything that would be required for reproductive GV. For example, any reproductive GV protocol must involve several health verifications, e.g. genome sequencing, epigenome sequencing, and morphological normality. This article just addresses the two core elements: genomic vectoring and epigenomic correctness. Terms Non-standard terms Most terms in this article are standard. Some non-standard terms: Genomic vectoring (GV) Unfortunately this conflicts with "germinal vesicle oocyte". In this article, GV always means genomic vectoring. Reproductive genomic vectoring Epigenomic correctness (EC) Chromosome selection Iterated meiotic selection (IMS) Standard terms Some standard terms with abbreviations: PGS (polygenic score) SNP (single nucleotide polymorphism) IVG (in vitro gametogenesis) IVO (in vitro oogenesis) IVS (in vitro spermatogenesis) ESC (embryonic stem cell) iPSC (induced pluripotent stem cell) PGC (primordial germ cell) SSC (spermatogonial stem cell) Combinatorial abbreviations: Before an acronym: i means induced, h means human, m means mouse After an acronym: LC means "-like cell" So an miPSC is a mouse induced pluripotent stem cell, and an hiPGCLC is a human induced (primordial germ cell)-like cell . This is quasi-standard, but to clarify: I use -etic (genetic, epigenetic) to refer to a small number of DNA loci, and -omic (genomic, epigenomic) to refer to genome-wide effects. Reproductive genomic vectoring Reproductive genomic vectoring means making a baby who has a genome that was intentionally influenced, rather than solely by the natural reproductive process. There are many downside risks, both technical and social, to reproductive genomic vectoring. See "Potential perils of germline genomic engineering". I'll address these elsewhere, along with the case in favor of germline engineering. Genomic vectoring (GV) Genomic vectoring (GV) means making a cell that contains a genome that has been modified to score highly according to some criterion. The genome could be diploid—a full complement of 46 chromosomes, two of each index, like all non-germline cells in your body; or it could be haploid—23 chromosomes, one of each index, like sperm or eggs. Once you've genomically vectored a cell, you aren't done. Your GVed cell might just be a generic stem cell. It's not automatic that you can make a healthy baby from any old stem cell. The epigenomic correctness (EC) problem is the problem of making cells that are epigenomically developmentally competent: they have the right epigenomic states so that they can contribute to growing a healthy baby. Any GV method requires some way of handling the epigenomic correctness problem. See the later sections "Reproductive GV and epigenomic correctness (EC)" and "Methods to handle epigenomic correctness". As a view from 30,000 feet, the elements of a method for human germline engineering are to know and make the target genome and epigenome in a cell: Strong GV and why it matters By "strong GV", I mean something a little nebulous. The term is meant to include methods that can greatly decrease the risk of several diseases in a future child, or substantially enhance some capacity, e.g. afford 30 IQ points or more. The term is meant to exclude simple embryo selection on normal numbers of embryos, and is meant to exclude editing a few loci. Strength matters for reproductive genomic vectoring: A stronger GV method can be used to improve the baby's health on more dimensions (decreasing the risk of more diseases). Besides the obvious, decreasing disease risk is good because it helps to protect the baby against potential health problems introduced by the GV method itself. Strong GV removes many difficult tradeoffs between traits. With weak GV, parents have to evaluate whether they prefer to decrease their child's risk of diabetes by an additional 0.5% or to increase their child's expected IQ by a couple points (or something). With strong GV, the question becomes about what genomic foundation do the parents view as most desirable to give their children. Strong GV methods also remove tradeoffs between GV strength and the similarity of the resulting children. GV strength is generally interchangeable with cutting costs. Cutting costs is crucial for making GV technology widely available, in order to have the greatest benefit and to prevent problems with inequality. Strong GV would enable parents to have children with more opportunity for true genius of some flavor—scientific, scholarly, artistic, philosophical, political, communicative, technological, organizational. This would give the next generation high capability for both personal thriving as well as intellectual and altruistic contributions, such as helping humanity navigate the rapidly changing world. If a strong GV can be made safe and soon, then we can more quickly demonstrate the large benefits of the technology. This will more quickly bring the scaled-up accessibility of very beneficial implementations of the technology. Polygenic scores Generally, the criterion for vectoring is a polygenic score—a function that predicts a trait from a genome. Genomic vectoring (GV) seeks to make a cell that scores highly according to the PGS, i.e. is predicted '''
