["https://lesswrong.com/posts/bg3LBMSuEhi52kNBQ/open-thread-spring-2025"]
title = "Open Thread Spring 2025 — LessWrong"
description = "If it’s worth saying, but not worth its own post, here's a place to put it. …"
full_description = '''If it’s worth saying, but not worth its own post, here's a place to put it.If you are new to LessWrong, here's the place to introduce yourself. Personal stories, anecdotes, or just general comments on how you found us and what you hope to get from the site and community are invited. This is also the place to discuss feature requests and other ideas you have for the site, if you don't want to write a full top-level post.If you're new to the community, you can start reading the Highlights from the Sequences, a collection of posts about the core ideas of LessWrong.If you want to explore the community more, I recommend reading the Library, checking recent Curated posts, seeing if there are any meetups in your area, and checking out the Getting Started section of the LessWrong FAQ. If you want to orient to the content on the site, you can also check out the Concepts section.The Open Thread tag is here. The Open Thread sequence is here. I am a long-time lurker; I started following EY in Overcoming Bias and then here, where I visit on and off. I have been a business school professor for about 15 years. I use a pseudonym to keep my online professional profile distinct from my non-professional online activity. I notice that business topics are not often discussed in LW, or at least not in the same detail and precision as other topics. It is certainly not a focal theme of the blog, but I was wondering if there would be interest to discuss business topics without the "fluff" that one inevitably finds in airport books and business school discussions.For instance, there is a strong link between decision-making and the foundations of marketing. There are also interesting connections between branding and categorization and linguistics. If you guys think this could be a contribution to the blog, I would be more than happy to give it a go. Let me introduce myself! I am a PhD candidate in philosophy (epistemology and decision theory). I found this forum almost randomly and started reading some related posts that brought me here. I am basically interested in heuristics under conditions of uncertainty and how these are modelled by the mind after successfully using them. In the future, I would like to open a research centre for historical heuristics (basically, descriptively and possibly non-prescriptively analysing decisions from the documents and dynamics that caused certain decisions, really difficult without bias). Any questions or discussions, I am open to answers!'''
