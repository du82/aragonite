["https://lesswrong.com/faq"]
title = "LessWrong FAQ — LessWrong"
description = "This is a new FAQ written LessWrong 2.0. This is the first version and I apologize if it is a little rough. Please comment or message with further qu…"
full_description = '''This is a new FAQ written LessWrong 2.0. This is the first version and I apologize if it is a little rough. Please comment or message with further questions, typos, things that are unclear, etc.The old FAQ on the LessWrong Wiki still contains much excellent information, however it has not been kept up to date.Advice! We suggest you navigate this guide with the help on the table of contents (ToC) in the left sidebar. You will need to scroll to see all of it. Mobile users need to click the menu icon in the top left.The major sections of this FAQ are:LessWrong MetaGetting StartedReading ContentPosting & Commentingspecial mention: The EditorKarma & VotingNotifications & SubscriptionsMessagingQuestionsCommunity Events PageModerationPrivacy Policy & Terms of UseAbout LessWrongWhat is LessWrong?LessWrong is a community dedicated to improving our reasoning and decision-making. We seek to hold true beliefs and to be effective at accomplishing our goals. More generally, we want to develop and practice the art of human rationality.To that end, LessWrong is a place to 1) develop and train rationality, and 2) apply one’s rationality to real-world problems.LessWrong serves these purposes with its library of rationality writings, community discussion forum, open questions research platform, and community page for in-person events.See also: Welcome to LessWrong!What is rationality?Rationality is a term which can have different meanings to different people. You might already associate with a few things. On LessWrong, we mean something like the following:Rationality is thinking in ways which systematically arrive at truth.Rationality is thinking in ways which cause you to systematically achieve your goals.Rationality is trying to do better on purpose.Rationality is reasoning well even in the face of massive uncertainty.Rationality is making good decisions even when it’s hard.Rationality is being self-aware, understanding how your own mind works, and applying this knowledge to thinking better.See also: What Do We Mean By "Rationality"?, Why Spock is Not Rational, What are the open problems in Human Rationality?What is the history of LessWrong?In 2006, Eliezer Yudkowsky and others began writing on Overcoming Bias, a group blog with the general theme of how to move one’s beliefs closer to reality despite biases such as overconfidence and wishful thinking. In 2009, Eliezer moved to a new community blog, LessWrong. Eliezer seeded LessWrong with a series of daily blog posts which became known as The Sequences. These writings attracted a large community of readers and writers interested in the art of human rationality.See also: A Brief History of LessWrongWhat makes LessWrong different from other discussion forums?A combination of traits makes LessWrong distinct among online communities.We have unusually high standards of discourse. We emphasize curiosity, truth-seeking, critical self-reflection, intellectual collaboration, and the long attention spans required to actually think through complicated ideas.We are open to unusual ideas and are willing to doubt conventional wisdom. Curiosity and truth-seeking require a willingness to sometimes consider positions which are strange by ordinary standards, and in some cases, these positions will turn out to be credible. As a result of this openness, some unconventional ideas are prevalent on LessWrong and many more are entertained.We make intellectual progress by building on a large number of communally-shared background ideas and concepts.Why the name? It is a bit odd . . .I (Ruby) personally wasn’t there when the name was chosen so I’m not certain of the historical thought process, but I interpret the name “LessWrong” as expressing two important points:A humble recognition that no human is ever going to attain perfectly true beliefs and be right about everything. We should always believe that some of our beliefs are mistaken, we just don’t know which ones.A bold recognition that notwithstanding the impossibility of being perfectly right, there is still the possibility of being less wrong. Everyone believes false things, but some believe a lot fewer wrong things than others.And so the aspiration of LessWrong is that by dedicating ourselves to learning how to think in ways which more systematically lead to truth (what we succinctly call rationality), we can meaningfully reduce our mistaken notions and have far more accurate models of reality.Who is this Eliezer guy I keep hearing about?Eliezer Yudkowsky was the original founder of LessWrong back in 2009. His writings on rationality attracted to the site a large number of people enthusiastic about learning to think better. Eliezer’s best-known works are The Sequences, (later renamed Rationality: From AI to Zombies) and Harry Potter and the Methods of Rationality. These texts are part of LessWrong’s philosophical foundation, and so unsurprisingly, you will see mentions of Eliezer not infrequently.How does LessWrong make money?We don’t. The LessWrong organization is a nonprofit funded by donations.This hopefully has the benefit of reducing our incentives to optimize for clicks and pageviews. Instead, we can focus on our stated purpose.Can I see the source code for the site?Yes you can! We are open source, and you can find the code on Github here.I have feedback, bug reports, or questions not answered in this FAQ. What should I do?You have several options.Message the LessWrong team via Intercom (available in the bottom right). Ensure you don't have Hide Intercom set in your account settings.Send a private message to a member of the LessWrong team (see these on the team page)Open an issue on the LessWrong Github repository.Ask a questionFor complaints and concerns regarding the LessWrong team, you can message Vaniver.Oh no! I think I lost my post/draft/sanity! What can I do?LessWrong stores revisions of posts as you’re drafting them. If you think you have lost content, please message the team via Intercom and we’ll see what we can do.Getting StartedI’m new. Where do I start?We encourage new users to read for a while before diving into discussions or making their own posts. This is helpful for new users to understand the site’s culture and background.Our welcome page offers a high-level description of LessWrong and includes a list of sample posts. It is a great way to get a feel for what LessWrong is like.For new members who want to get up to speed, we direct you towards our core readings which can be found on the Library page and are described elsewhere in this FAQ.At the same time, feel free to browse more recent content. This answer describes all the way you can locate content on LessWrong.Unlike other places on the Internet, it is often worthwhile to read the comment sections on posts. Our commenting guidelines state that is preferable:Aim to explain, not persuade.Present your own perspective rather than state group consensus or invoking authorities.Get curious. If you disagree with some, try to figure out what they’re thinking. What’s their model? Don’t just assume they’re dumb or evil.If you’re very new and you begin posting or commenting, you might find that you are quickly downvoted. This doesn’t mean you’re bad or unwelcome! But you are probably violating a norm or ignoring expected knowledge on the site. We suggest you read up a bit more before trying again later.What's a good and fast way to learn about how the website works?LessWrong extensively uses tool-tips and content previews to help users understand how the site works and see what content is even before they click.We encourage you to mouse over most elements of the site to see what pops up. You will find:Items in the left sidebar have tool-tips.Hovering over post titles displays an excerpt, reading time, and other meta info.Hovering over usernames displays karma, join date, number of posts and comments, and a bio if the user has set one.Hovering over karma scores displays the number of votes (in our karma system, karma does not usually equal the number of votes).How do I create an account? (And why should I?)Although not required to use the LessWrong website; we recommend creating an account so that you can:Subscribe to users and different classes of posts.Save your user settingsVote and comment on posts.Store your reading history, enabling tailored recommendations and potentially new features such as viewing your reading history and creating custom reading lists.Creating an account takes under 30 seconds. Click login in the top right and enter a username, email, and password. Once you have created an account, feel free to introduce yourself in the latest Open/Welcome thread. Let others know how you found LessWrong, your background, and what you’re hoping for from LessWrong. This allows existing members to point you in the direction of material which you might especially like.How do I Ask Questions/Make Posts/Go to My Profile/Private Message/Log Out?For logged-in users, you can access all these options via the drop-down menu accessible by clicking your username.The star to the right of your username is the karma notifier (star icon) and button for notifications panel (bell icon).How do I edit my account settings? What can I do?By clicking on your username and clicking Edit Account, you access your account settings. There you can:Set a bio for your account to let other LessWrong members know about you. If you set one, it will show up when they mouse-over your username.Hide or show Intercom (messaging service with the LessWrong team members).Activate the markdown editor.Toggle comment collapse settings.Opt into beta features (new)Adjust settings for notifications of responses to your posts and commentsAdjust settings for the karma notifier.Unsubscribe from your email subscriptions.Reading ContentWhat are all the ways to access content on LessWrong?Ah, there are many ways!HomepageLessWrong’s homepage has the following content sections:Core Reading (shown only to logged-out users)CuratedLatest PostsRecent DiscussionCore ReadingsThe core readings section provides links to texts which describe the intellectual foundations of LessWrong. They are described here.CuratedEach week, LessWrong’s moderation team selects on average three posts which seem to us to be especially well-written, insightful, instructive, or otherwise important. These are tagged as curated posts and appear with a star icon next to the title.Curated posts are emailed out to the mailing list of people who have signed up for them. As of January 2025, this mailing list has over 30,000 subscribers, and typically over half of them open the email.The three most recently curated posts appear in the Curated section. You can view more Curated posts by clicking View All Curated Posts or selecting the Curated filter on the AllPosts page.Beneath the Curated section is a button to subscribe via email or RSS to curated posts (~3/week).All Curated posts are selected from the Frontpage posts (i.e. they are basically never organizational announcements or news that will be unimportant in a few years).Latest PostsThe Latest Posts section displays all* recent posts to LessWrong. These sorted magically** to balance between recency and quality (as indicated by karma score), i.e. more upvoted posts remain higher up in the Latest Posts section for longer.*By default, only Frontpage posts are displayed in the Latest Posts section. To enable Personal blogposts to appear as well, check the checkbox beneath the section. See more in What’s the difference between Personal Blogposts and Frontpage Posts?**LessWrong uses the following formula to rank posts in Latest Posts:karmaScore(ageInHours+2)1.15.mjx-chtml {display: inline-block; line-height: 0; text-indent: 0; text-align: left; text-transform: none; font-style: normal; font-weight: normal; font-size: 100%; font-size-adjust: none; letter-spacing: normal; word-wrap: normal; word-spacing: normal; white-space: nowrap; float: none; directio