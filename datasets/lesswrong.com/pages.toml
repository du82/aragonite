description = "Said Achmiz's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = "When a magnificent body is just one more of the things that is yours for the asking, what will you do with it in paradise? See also Stanislaw Lem on this subject: “The freedom I speak of, it is not that modest state desired by certain people when others oppress them. For then man becomes for man—a set of bars, a wall, a snare, a pit. The freedom I have in mind lies farther out, extends beyond that societal zone of reciprocal throat-throttling, for that zone may be passed through safely, and then, in the search for new constraints—since people no longer impose these on each other—one finds them in the world and in oneself, and takes up arms against the world and against oneself, to contend with both and make both subject to one’s will. And when this too is done, a precipice of freedom opens up, for now the more one has the power to accomplish, the less one knows what ought to be accomplished.” I’d bet that I’m still on the side where I can safely navigate and pick up the utility, and I median-expect to be for the next couple months ish. With respect, I suggest to you that this sort of thinking is a failure of security mindset. (However, I am content to leave the matter un-argued at this time.) … if you’re going to be that paranoid about LLM interference (as is very reasonable to do), it makes sense to try and eliminate second order effects and never talk to people who talk to LLMs, for they too might be meaningfully harmful e.g. be under the influence of particularly powerful LLM-generated memes. Yes… this is true in a personal-protection sense, I agree. And I do already try to stay away from people who talk to LLMs a lot, or who don’t seem to be showing any caution about it, or who don’t take concerns like this seriously, etc. (I have never needed any special reason to avoid Twitter, but if one does—well, here’s yet another reason for the list.) However, taking a pure personal-protection stance on this matter does not seem to me to be sensible even from a selfish perspective. It seems to me that there is no choice but to try to convince others, insofar as it is possible to do this in accordance with my principles. In other words, if I take on some second-order effect risk, but in exchange I get some chance of several other people considering what I say and deciding to do as I am doing, then this seems to me to be a positive trade-off—especially since, if one takes the danger seriously, it is hard to avoid the conclusion that choosing to say nothing results in a bad end, regardless of how paranoid one has been."
