["https://lesswrong.com/posts/mELQFMi9egPn5EAjK/my-attempt-to-explain-looking-insight-meditation-and"]
title = "My attempt to explain Looking, insight meditation, and enlightenment in non-mysterious terms — LessWrong"
description = '''Frustrated by claims that "enlightenment" and similar meditative/introspective practices can't be explained and that you only understand if you exper…'''
full_description = "Epistemic status: pretty confident. Based on several years of meditation experience combined with various pieces of Buddhist theory as popularized in various sources, including but not limited to books like The Mind Illuminated, Mastering the Core Teachings of the Buddha, and The Seeing That Frees; also discussions with other people who have practiced meditation, and scatterings of cognitive psychology papers that relate to the topic. The part that I’m the least confident of is the long-term nature of enlightenment; I’m speculating on what comes next based on what I’ve experienced, but have not actually had a full enlightenment. I also suspect that different kinds of traditions and practices may produce different kinds of enlightenment states.While I liked Valentine’s recent post on kensho and its follow-ups a lot, one thing that I was annoyed by were the comments that the whole thing can’t be explained from a reductionist, third-person perspective. I agree that such an explanation can’t produce the necessary mental changes that the explanation is talking about. But it seemed wrong to me to claim that all of this would be somehow intrinsically mysterious and impossible to explain on such a level that would give people at least an intellectual understanding of what Looking and enlightenment and all that are. Especially not after I spoke to Val and realized that hey, I actually do know how to Look, and that thing he’s calling kensho, that’s happened to me too.(Note however that kensho is a Zen term and I'm unfamiliar with Zen; I don't want to use a term which might imply that I was going with whatever theoretical assumptions Zen might have, so I will just talk about “my experience” when it comes up.) So here is my attempt to give an explanation. I don’t know if I’ve succeeded, but here goes anyway.----One of my key concepts is going to be cognitive fusion.Cognitive fusion is a term from Acceptance and Commitment Therapy (ACT), which refers to a person “fusing together” with the content of a thought or emotion, so that the content is experienced as an objective fact about the world rather than as a mental construct. The most obvious example of this might be if you get really upset with someone else and become convinced that something was all their fault (even if you had actually done something blameworthy too). In this example, your anger isn’t letting you see clearly, and you can’t step back from your anger to question it, because you have become “fused together” with it and experience everything in terms of the anger’s internal logic. Another emotional example might be feelings of shame, where it’s easy to experience yourself as a horrible person and feel that this is the literal truth, rather than being just an emotional interpretation.Cognitive fusion isn’t necessarily a bad thing. If you suddenly notice a car driving towards you at a high speed, you don’t want to get stuck pondering about how the feeling of danger is actually a mental construct produced by your brain. You want to get out of the way as fast as possible, with minimal mental clutter interfering with your actions. Likewise, if you are doing programming or math, you want to become at least partially fused together with your understanding of the domain, taking its axioms as objective facts so that you can focus on figuring out how to work with those axioms and get your desired results.On the other hand, even when doing math, it can sometimes be useful to question the axioms you’re using. In programming, taking the guarantees of your abstractions as literal axioms can also lead to trouble. And while it is useful to perceive something as objectively life-threatening and out to get you, that perception is going to get you in a lot of trouble if it’s actually false. Such as if you get into a fight with your romantic partner and assume that they actively want to hurt you, when they’re just feeling hurt over something that you said.Cognitive fusion trades flexibility for focus. You will be strongly driven and capable of focusing on just the thing that’s your in mind, at the cost of being less likely to notice when that thing is actually wrong.Some simple defusion techniques suggested by ACT include things like noticing when you’re thinking something bad about yourself, and prefacing it with “I’m having the thought that”. So if you find yourself thinking “I am a terrible person”, you can change that into “I’m having the thought that I am a terrible person”. Or you can repeat the word “terrible” a hundred times, until it stops having any meaning. Or you can see if you can manipulate the way that the thought sounds like in your head, such as turning it into a comical whine that sounds like it’s from a cartoon, until you can no longer take it seriously. (Eliezer’s cognitive trope therapy should also be considered as a cognitive defusion technique.) In one way or the other, all of these highlight the fact that the thought or emotion is just a mental construct, making it easier to question its truthfulness.However, managing to defuse from a thought that is actively bothering you, is a relatively superficial level of defusion. We must go deeper.Meditation as cognitive defusion practiceWhile there are many different forms of meditation, many of them could be reasonably characterized as practicing the skill of intentional cognitive defusion.One of the most basic forms of meditation is to just concentrate on your breath - or on any other focus that you have happened to choose. Soon, a distraction will come up in your mind - something that says that there’s a more important thing to do, or that you are bored, or that this isn’t leading anywhere. If you start engaging with the content of that distraction, you’re already failing to keep your focus. That is, if a thought comes to you saying that there’s a more important thing to do, and you start arguing with yourself and trying to make a logical case for why meditation is actually the most important thing, then you’ve already been distracted from whatever it was that you were supposed to be focusing on. On some level, you have bought into the internal logic of the distraction, and into the belief that the argument must be beaten on its own terms.What you must do instead, is to disregard the content of the distraction. Instead of becoming fused with its contents, defuse and redirect your attention back towards your focus. Whenever a new distraction rises, do this again.As your skill improves and your attention becomes more reliably anchored on the focus, you can start learning additional skills. If you are doing something like the meditation program outlined in e.g. The Mind Illuminated, one of the next steps is to develop an awareness of distractions that are just on the edge of your consciousness, which are not yet distracting you but are going to steal your attention any moment now. By cultivating a sensitivity to those subtle movements of your mind, you are increasing your ability to notice lower-level details of what’s going on in your consciousness, in a way which helps with cognitive defusion by making you more aware of the ways in which your experience is constructed.As an example of such increased sensitivity, some time back I was doing concentration meditation, using an app which plays the sound of something hitting a woodblock, 50 times per minute. As I was concentrating on listening to the sound, I noticed that what had originally been just one thing in my experience - a discrete sound event - was actually composed of many smaller parts. The beginning and end of the sound were different, so there were actually two sound sensations; and there was a subtle visualization of something hitting something else; and a sense of motion accompanying that visualization. I had not previously even been fully aware that my mind was automatically creating a mental image of what it thought that the sound represented.Continuing to observe those different components, I became more aware of the fact that my visualization of the sound changed over time and between meditation sessions, in a rather arbitrary way. Sometimes my mind conjured up a vision of a hammer hitting a rock in a dwarven mine; sometimes it was two wooden sticks hitting each other; sometimes it was drops of water falling on the screen of my phone. By itself, this would mostly just be a curiosity. However, developing the kind of mental precision that actually lets you separate your experience into these kinds of small subcomponents, seems like a prerequisite for slicing your various mental outputs in a way which lets you see what they’re made of.Last summer, I noticed myself having the thought that I couldn’t be happy, which made me feel bad. And then I noticed that associated with that thought, was a mental image of what a happy person was like - that image was of a young, cheerful, outgoing and extraverted girl. In other words, my prototypical concept of a happy person included not just happiness, but extraversion and high energy as well. And so my mind was comparing my self-concepts with this concept of happiness, noticing that I wasn’t that kind of a person, and so concluding that I couldn’t be happy. Realizing that my concept of a “happy person” was uselessly narrow allowed me to fix the problem.But if we break down what happened with the dysfunctional “happiness concept” into slightly smaller steps, something like this seems to have happened:1) me feeling unhappy -> 2) mental image of a happy person -> 3) thought that I can’t be happyNotice that this has a similarity with the way my mind automatically produced a visualization for the woodblock sound:1) sensation of the woodblock sound -> 2) mental image of two woodblocks hitting each other -> 3) thought of “oh, it’s two woodblocks hitting each other”In both cases, some stimulus seemed to have produced a subtle mental image as a preliminary interpretation of what the stimulus meant, which then translated into a higher-level abstract concept. In both cases, something was off about the middle step. In the case of the happiness example, I had a too narrow view of what happy people are like. With the sound, the problem was that my mind was making up various interpretations of what was making the sound, despite having too little data to actually determine what it was.Having developed the ability to notice those earlier steps in my mental processes, allowed me to notice a potential problem, as opposed to only being aware of the final output of the process.I believe that this kind of thing is what Valentine means when he talks about Looking: being able to develop the necessary mental sharpness to notice slightly lower-level processing stages in your cognitive processes, and study the raw concepts which then get turned into higher-level cognitive content, rather than only seeing the high-level cognitive content.This seems like a core rationality skill, since seeing slightly earlier stages of your cognitive process helps question its validity, which is to say it makes it easier for you to engage in cognitive defusion when desired. (If the process seems valid, you can still choose to fuse with it if that provides a benefit.) And being able to apply selective cognitive defusion means being able to not believe everything that you think, which is an essential requirement for things like actually changing your mind.Understanding sufferingUnderstanding suffering is a special case of Looking, but a sufficiently important one that it deserves to be briefly discussed in some detail.Usually, most of us are - on some implicit level - operating off a belief that we need to experience pleasant feelings and need to avoid experiencing unpleasant feelings. In a sense, thinking about getting into an unpleasant or painful situation may feel almost like death: if we think that the experience would be unpleasant enough, then no matter how brief it might be, we might do almost anything to avoid ending up there.There’s a sense in which this is absurd. After all, a moment of discomfort is just that - a moment of discomfort. By itself, it won’t do us any lasting damage, and trying to avoid can produce worse results even on its own terms. For instance, consider the person who keeps putting off making a doctor’s appointment because they suspect that there’s something wrong with them. If there really is something seriously wrong, then the best thing would be to get a diagnosis as fast as possible. And even if it is something harmless, it would still be better to find out about that earlier rather than later, so as to stop feeling the nervous about it. Not going to the doctor, and continuing to feel nervous about it, is about the worst possible outcome - even if you cared about avoiding discomfort.On a conscious level, we realize that this kind of behavior is absurd. Then we go on doing it.You might say that it’s because there’s a part of us that remains cognitively fused with the alief that all painful experiences need to be avoided, and that there’s something vaguely death-like about them. Typically, if we are only talking about relatively mild discomfort, then that alief doesn’t manifest itself very strongly. We are okay with the thought of facing mild discomfort. But just as it’s easy to remain calm and defused from feelings of anger as long as there isn’t anything strongly upsetting going on, on some level we will tend to experience cognitive fusion with the “pain is death” alief more and more strongly the worse we expect the pain to be.The general way by which incorrect aliefs are changed is by giving the part of your brain holding them, experiences about what the world is really like. If you have a dog phobia, you might do desensitization therapy, gradually exposing yourself to dogs in controlled circumstances. Eventually, seeing that you have encountered dogs many times and that it’s safe, your brain updates and ceases to have the phobia.Similarly, if you Look at the process of yourself flinching away from thoughts of painful experiences, you will come to directly experience the fact that it’s the flinching away from them that actually produces suffering, and that the thoughts would be harmless by themselves. The dog doesn’t hurt you: it’s your own fear that hurts you. Similarly, pain isn’t bad by itself, but turns into suffering when we come to believe that we need to avoid it. Seeing this, the parts of your mind that have been doing the flinching away, will gradually start updating towards not habitually flinching away.When I say that it is the automatic flinching away that actually produces suffering, I don’t mean that just in the sense of “putting off painful experiences causes us to experience more pain in the long run”. I mean that the processes involved with the flinching away are literally what turns pain into suffering: if you can get the flinching away to stop, pain (whether physical or emotional) will still be present as an"
