["https://lesswrong.com/posts/tmWMuY5HCSNXXZ9oq/buck-s-shortform"]
title = "Buck's Shortform — LessWrong"
description = "A collection of shorter posts by LessWrong user Buck"
full_description = '''This is a special post for quick takes by Buck. Only they can create top-level comments. Comments here also appear on the Quick Takes page and All Posts page. Two different meanings of “misuse”The term "AI misuse" encompasses two fundamentally different threat models that deserve separate analysis and different mitigation strategies:Democratization of offense-dominant capabilitiesThis involves currently weak actors gaining access to capabilities that dramatically amplify their ability to cause harm. That amplification of ability to cause harm is only a huge problem if access to AI didn’t also dramatically amplify the ability of others to defend against harm, which is why I refer to “offense-dominant” capabilities; this is discussed in The Vulnerable World Hypothesis.The canonical example is terrorists using AI to design bioweapons that would be beyond their current technical capacity (c.f. Aum Shinrikyo, which failed to produce bioweapons despite making a serious effort)Power Concentration RiskThis involves AI systems giving already-powerful actors dramatically more power over othersExamples could include:Government leaders using AI to stage a self-coup then install a permanent totalitarian regime, using AI to maintain a regime with currently impossible levels of surveillance.AI company CEOs using advanced AI systems... (read more) Computer security, to prevent powerful third parties from stealing model weights and using them in bad ways. By far the most important risk isn't that they'll steal them. It's that they will be fully authorized to misuse them. No security measure can prevent that. 2Fabien Roger4moActually, it is not that clear to me. I think adversarial robustness is helpful (in conjunction with other things) to prevent CEOs from misusing models. If at some point in a CEO trying to take over wants to use HHH to help them with the takeover, that model will likely refuse to do egregiously bad things. So the CEO might need to use helpful-only models. But there might be processes in place to access helpful-only models - which might make it harder for the CEO to take over. So while I agree that you need good security and governance to prevent a CEO from using helpful-only models to take over, I think that without good adversarial robustness, it is much harder to build adequate security/governance measures without destroying an AI-assisted-CEO's productivity. There is a lot of power concentration risk that just comes from people in power doing normal people-in-power things, such as increasing surveillance on dissidents - for which I agree that adversarial robustness is ~useless. But security against insider threats is quite useless too.'''
