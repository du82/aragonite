title = "Statistical Challenges with Making Super IQ babies — LessWrong"
description = "This is a critique of How to Make Superbabies on LessWrong. …"
full_description = '''This is a critique of How to Make Superbabies on LessWrong.Disclaimer: I am not a geneticist[1], and I've tried to use as little jargon as possible. so I used the word mutation as a stand in for SNP (single nucleotide polymorphism, a common type of genetic variation).BackgroundThe Superbabies article has 3 sections, where they show: Why: We should do this, because the effects of editing will be bigHow: Explain how embryo editing could work, if academia was not mind killed (hampered by institutional constraints)Other: like legal stuff and technical details. Here is a quick summary of the "why" part of the original article articles arguments, the rest is not relevant to understand my critique.we can already make (slightly) superbabies selecting embryos with "good" mutations, but this does not scale as there are diminishing returns and almost no gain past "best of 40"They show that when you edit, you don't have the issue outlined above, because each edit helps, here the only source of diminishing returns is that you of course pick the most important mutations first.Then they switch from IQ to a disease focus by removing bad mutations. They also show that most diseases risk can be reduced 50-100% by 3-25 mutations, but if you swap from disease association to life expectancy, then 300 edits may only gain you 14 years, Interesting it only take 16 edits to get the first 5 years.They show that there are less tradeoffs between mutations than one might initially anticipate, the correlations are mostly positive, ie, curing one disease might protect you from another one.Then they use chicken becoming 4 times larger over 50 year, which is 40 standard deviation! to motivate the intuition that a specie can go fare out of equilibrium, using selective breeding, so selective editing should allow us to push even further.Finally, they make theoretical curves for IQ gain and longevity, under the assumption that if we had more data, we could more and better mutations to edit if we had stronger data.My PositionAt a high level, I appreciate the effort in the original post and think most of it is well-written. The main points about the difference between editing and selecting, the parts about diseases, and to some extent longevity, are valid. However, I am skeptical of the claimed IQ effects.My critique can be broken down into the following subtopics:Correlation vs. CausationThis is based on observational data of mutation and traits, and thus has all the usual issues with causality.The additive assumption of geneticsWe observe that a simple model simply adding up all the mutation effect works well, on normal humans who usually only have a tiny subset of the mutations, and therefore also assume that it generalizes to the super babies who have all lot more of them.Regression towards the meanThe largest measured effects in genetic studies often benefit from measurement luck. I believe modern genetic analysis techniques don't fully account for this statistical phenomenon.I'm less skeptical about disease prevention through genetic editing because some powerful examples exist—like how a single edit can reduce Type 2 diabetes risk by half. This suggests a likely causal relationship rather than just a socioeconomic correlation. The additive assumption is also less problematic when dealing with a small number of high-impact edits. In contrast, IQ appears to be influenced by more than 1,000 genetic variations, most predicted to have much smaller effects than +1 IQ point.Correlation vs. CausationThis point was mostly raised by lgs and richardjacton and others in the comments to the original post. The issue here is that we only have traits such as IQ and mutations, and thus any relation between the two could be spurious. For example, a mutation might be shared between people who don't like living in old buildings, and thus the causal path runs through lower exposure to leaded paint and asbestos.While I think the association critique of the baby IQ effects is a very strong argument, I will set that aside for the remainder of this post and focus more on the model assumptions baked into their extrapolations.It is important to note that when the authors says.We take into account uncertainty about which of a cluster of nearby genetic variants is actually CAUSING the observed effect.the more clear wording would be "CAUSING the observed association", so it is a claim about which of a cluster of mutations actually "causes" the "non-causal" statistical association between mutation and IQ.The last part of the author's posts explains the step they did to not overestimate the IQ effects, where they adjust for the poor retest quality of the UK Biobank IQ test, and for assortative mating (people like people like themselves). while this does not fully close the association to causation gap, nor the challenges I present in the next two section, they are still very sensible, so I feel they deserve to be mentioned.The gold standard for causal evidence in genetic is called Mendelian Randomization, where you measure a biomarker, related to the disease, sort of like this: a people with a specific mutation in a gene for glucose metabolism (at birth) has a higher blood glucose after birth which explains why they have a higher incidence of diabetes. This is almost as strong evidence as a clinical trial, because you get your genes before your biomarker, so it is correctly "time sorted", and the "mutation" assignment is random, like in a clinical trial. The main limitation is most biomarkers are measured in bio fluids, and even Cerebrospinal fluid, would probably only capture a tiny effect of the IQ, because I suspect that actual causal mutations for IQ probably influences brain development, or protein levels in brain cells, which are hard to measure without influencing IQ.So the authors went to war with the data they had, which is totally fine, but also why I think they to optimistic with regards to correlation vs causation.The Additive Effect of GeneticsOne of the great paradoxes of statistics is that there is no natural scale between variables in a statistical model. This means it is very hard to know how to link mutations to disease risk. In statistics, we call this the "link function," because it links the predictors (in this case, the mutations) to the outcome (in this case, IQ). The question statisticians ask is: should I link each mutation to the probability, odds, risk, relative risk, or hazard of the outcome? "In other words, we don't know if genetic effects combine by simple addition or through more complex relationships.However, because most genetic effects are tiny, this is not a significant issue in practice. Let's consider a simple toy example, comparing modeling mutations' association with IQ as either linear or exponential.Imagine 5 mutations, rarely observed in the same individuals, that have either an additive +1 or a multiplicative ×1.01 effect on IQ, which is assumed to start at 100.If you have 1 mutation, both models agree because:Additive: 100+1×1=101.mjx-chtml {display: inline-block; line-height: 0; text-indent: 0; text-align: left; text-transform: none; font-style: normal; font-weight: normal; font-size: 100%; font-size-adjust: none; letter-spacing: normal; word-wrap: normal; word-spacing: normal; white-space: nowrap; float: none; direction: ltr; max-width: none; max-height: none; min-width: 0; min-height: 0; border: 0; margin: 0; padding: 1px 0} .MJXc-display {display: block; text-align: center; margin: 1em 0; padding: 0} .mjx-chtml[tabindex]:focus, body :focus .mjx-chtml[tabindex] {display: inline-table} .mjx-full-width {text-align: center; display: table-cell!important; width: 10000em} .mjx-math {display: inline-block; border-collapse: separate; border-spacing: 0} .mjx-math * {display: inline-block; -webkit-box-sizing: content-box!important; -moz-box-sizing: content-box!important; box-sizing: content-box!important; text-align: left} .mjx-numerator {display: blo