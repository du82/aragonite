full_description = "A couple of hours ago, the Turing Award was given to Andrew Barto and Richard Sutton. This was the most thorough description of Sutton's views on AGI risk I could find: https://danfaggella.com/sutton1/ He appears to be quite skeptical. I was unable to find anything substantial by Andrew Barto. A fun illustration of survivorship/selection bias is that nearly every time I find myself reading an older paper, I find it insightful, cogent, and clearly written. 4wonder14dBased on my observations, I would also think some current publication chasing culture could get people push out papers more quickly (in some particular domains like CS), even though some papers may be partially completed Based on my observations, I would also think some current publication chasing culture could get people push out papers more quickly (in some particular domains like CS), even though some papers may be partially completed 17David Hornbein14dSelection bias isn't the whole story. The median paper in almost every field is notably worse than it was in, say, 1985. Academia is less selective than it used to be—in the U.S., there are more PhDs per capita, and the average IQ/test scores/whatever metric has dropped for every level of educational attainment. Grab a journal that's been around for a long time, read a few old papers and a few new papers at random, and you'll notice the difference. Selection bias isn't the whole story. The median paper in almost every field is notably worse than it was in, say, 1985. Academia is less selective than it used to be—in the U.S., there are more PhDs per capita, and the average IQ/test scores/whatever metric has dropped for every level of educational attainment. Grab a journal that's been around for a long time, read a few old papers and a few new papers at random, and you'll notice the difference. Academia is less selective than it used to be To what degree is this true regarding elite-level Ph.D. programs that are likely to lead to publication in (i) mathematics and/or (ii) computer science?Separately, we should remember that academic selection is a relative metric, i.e. graded on a curve. So, when it comes to Ph.D. programs, is the median 2024 Ph.D. graduate more capable (however you want to define it) than the corresponding graduate from 1985? This is complex, involving their intellectual foundations, depth of their specialized knowledge, vario... (read more)"
