title = "Arthur Conmy - LessWrong"
description = "Arthur Conmy's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = '''Upweighting positive dataData augmentation...It maybe also worth up-weighting https://darioamodei.com/machines-of-loving-grace along with the AI optimism blog post in the training data. In general it is a bit sad that there isn't more good writing that I know of on this topic. the best vector for probing is not the best vector for steeringAKA the predict/control discrepancy, from Section 3.3.1 of Wattenberg and Viegas, 2024 I suggested something similar, and this was the discussion (bolding is the important author pushback): Arthur Conmy11:33 1 DecWhy can't the YC company not use system prompts and instead:1) Detect whether regex has been used in the last ~100 tokens (and run this check every ~100 tokens of model output)2) If yes, rewind back ~100 tokens, insert a comment like # Don't use regex here (in a valid way given what code has been written so far), and continue the generationDhruv Pai10:50 2 DecThis seems like a reasonable baseline with the caveat that it requires expensive resampling and inserting such a comment in a useful way is difficult. When we ran baselines simply repeating the number of times we told the model not to use regex right before generation in the system prompt, we didn't see the instruction following improve (very circumstantial evidence). I don't see a principled reason why this would be much worse than the above, however, since we do one-shot generation with such a comment right before the actual generation. Here are the other GDM mech interp papers missed:https://arxiv.org/abs/2307.15771https://arxiv.org/abs/2404.16014https://arxiv.org/abs/2407.14435We have some blog posts of comparable standard to the Anthropic circuit updates listed:https://www.alignmentforum.org/posts/C5KAZQib3bzzpeyrg/full-post-progress-update-1-from-the-gdm-mech-interp-teamhttps://www.alignmentforum.org/posts/iGuwZTHWb6DFY3sKB/fact-finding-attempting-to-reverse-engineer-factual-recall You use a very wide scope for the "enhancing human feedback" (basically any post-training paper mentioning 'align'-ing anything). So I will use a wide scope for what counts as mech interp and also include:https://arxiv.org/abs/2401.06102https://arxiv.org/abs/2304.14767There are a few other papers from the PAIR group as well as Mor Geva and also Been Kim, but mostly with Google Research affiliations so it seems fine to not include these as IIRC you weren't counting pre-GDM merger Google Research/Brain work'''
