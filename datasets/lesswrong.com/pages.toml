["https://lesswrong.com/users/ank"]
title = "ank - LessWrong"
description = "ank's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = '''Right now an agentic AI is a librarian, who has almost all the output of humanity stolen and hidden in its library that it doesn't allow us to visit, it just spits short quotes on us instead. But the AI librarian visits (and even changes) our own human library (our physical world) and already stole the copies of the whole output of humanity from it. Feels unfair. Why we cannot visit (like in a 3d open world game or in a digital backup of Earth) and change (direct democratically) the AI librarian's library? Yep, people are trying to make their imperfect copy, I call it "human convergence", companies try to make AIs write more like humans, act more like humans, think more like humans. They'll possibly succeed and make superpowerful and very fast humans or something imperfect and worse that can multiply very fast. Not wise. Any rule or goal trained into a system can lead to fanaticism. The best "goal" is to direct democratically gradually maximize all the freedoms of all humans (and every other agent, too, when we'll be 100% sure we can safely do it, when we'll have mathematical proofs). To eventually have maximally many non-AI agents with maximally many freedoms (including the freedoms to temporarily forget that they have some or all of those freedoms. Informed adults can be able to choose to die, too. Basically if you have a bunch of adults and they want to do something and they don't take anyone else's freedoms - why not to allow, at least in the future, we shouldn't permanently censor/kill things for eternity, shouldn't enforce eternal unfreedoms on others). Understanding and static places of all-knowing where we are the only all-powerful agents is all you need. It's a bit like a simulated direct democratic multiverse, we can (and urgently need to) start building right now. P.S. This book helped me achieve a "secular nirvana", almost all the recent and older meta analyses say that Beck's cognitive therapy* (tablets are of similar effect, but it's better to listen to doctors of course, the cognitive therapy I think is often not understood well enough, it's good to read the primary source, too) are the state-of-the-art for treating depression, anxiety and anger management problems (for anger there is another cognitive approach - REBT - that is comparable, too). Basically, I think you'll find the following book enlightening (suffering is mostly unhelpful worry/fear (that is often caused by not understanding enough) and/or pain. You can generalize and say that suffering is an enforcement of some unfreedom upon you, we sometimes do it to ourselves too, it’s something that “tries to make you/the world around you more static forcefully” or “change your shape/shape of the world around you forcefully”): https://www.amazon.com/Anxiety-Worry-Workbook-Cognitive-Behavioral/dp/1462546161 * It’s like rewriting your source code, your thoughts from the unhelpful ones that cause unhelpful worry, to the helpful ones that help you do what you want. Many people have 600+ lines of code in their head, a whole hidden constitution, thoughts like: No one should interrupt me ever and such) By reading primary sources, Beck’s books on cognitive therapy of depression, anger, suicidality, I basically learned HumanScript++, it’s a lot like changing the hidden prompting text that LLMs have really, helped a lot to have great relationships and understand people and the world'''
year_published = 2025
