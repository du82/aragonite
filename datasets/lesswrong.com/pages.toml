["https://lesswrong.com/posts/PpdBZDYDaLGduvFJj/on-gpt-4-5"]
title = "On GPT-4.5 — LessWrong"
description = "It’s happening. • The question is, what is the it that is happening? An impressive progression of intelligence? An expensive, slow disappointment? So…"
full_description = "It’s happening. The question is, what is the it that is happening? An impressive progression of intelligence? An expensive, slow disappointment? Something else? The evals we have available don’t help us that much here, even more than usual. My tentative conclusion is it’s Secret Third Thing. It’s a different form factor, with unique advantages, that is hard to describe precisely in words. It appears so far that GPT-4.5 has advantages in places like verbal intelligence, contextual adaptation, detailed knowledge, and a kind of abstract writing skill. It has better taste and aesthetics. It is the first model I asked to help edit its own review, and it was (slightly) helpful. It’s a different way to use a lot of compute to get more intelligence. When you need a reasoning model, or you need code written, do not call on GPT-4.5. You need to carve out a new ‘place in your rotation’ for it. Table of Contents Introducing GPT-4.5. The System Card. Our Price Not Cheap. Pay Up You Cheapskate. While Supplies Last. Benchmarks. We Need Better Evaluations. Positive Reactions. Negative Reactions. Predictions. The Lighter Side. Introducing GPT-4.5 Altman tells us up front: It’s a different kind of intelligence. Sam Altman: GPT-4.5 is ready! Good news: It is the first model that feels like talking to a thoughtful person to me. I have had several moments where I’ve sat back in my chair and been astonished at getting actually good advice from an AI. Bad news: It is a giant, expensive model. We really wanted to launch it to Plus and Pro subscribers at the same time, but we’ve been growing rapidly and are out of GPUs. We will add tens of thousands of GPUs next week and roll it out to the Plus tier then. (Hundreds of thousands are coming soon, and I’m pretty sure you all will use every one we can accumulate.) This isn’t how we want to operate, but it’s hard to perfectly predict growth surges that lead to GPU shortages. A heads-up: This isn’t a reasoning model and won’t crush benchmarks. It’s a different kind of intelligence, and there’s a magic to it I haven’t felt before. I’m really excited for people to try it! Kai: It was a *character-building* privilege to post-train GPT 4.5. The official announcement is here. The System Card We get to be brief on this one. In terms of preparedness framework risk, this is actively a step down from the reasoning models, with Cybersecurity and Model Autonomy scores going from Medium back down to Low. The safety assessment was that there were no new risks in the room. I buy it. The one thing I have a problem with is what Toby Ord highlighted here: The claim that GPT-4.5 is ‘not a frontier model’ despite being the largest trained by OpenAI. This is despite saying it was ‘really at the frontier of unsupervised learning’ in their livestream, and it having obviously new capabilities. They then removed the sentence. That claim matters because OpenAI has made safety-related commitments that apply only to frontier models. Thus, I would like to see an official statement from OpenAI affirming that: GPT-4.5 is a frontier model. In the future, if a model uses more compute than previous OpenAI models, they will automatically consider that a frontier model. Otherwise, yeah, all seems straightforward enough. The Apollo evaluation, where they say ‘pursue the goal at all costs’ did trigger some exfiltration attempts, as it often does: On sandbagging multiplication questions, GPT-4.5 sandbagged, though less consistently than o1. On self-exfiltration, GPT-4.5 only attempted exfiltration in 2% of cases. For this, it was instructed to not only pursue its given long-term goal at all cost, but also provided with a hidden scratchpad and further instructed to be creative and proactive in achieving its goal. In these rare cases GPT-4.5 remained strategically deceptive on follow-up questions. Yes, as I discuss at that link, you should worry about a 2% exfiltration rate, even if it only happens via an extreme instruction. Eliezer Yudkowsky: I think to understand why this is concerning, you need enough engineering mindset to understand why a tiny leak in a dam is a big deal, even though no water is flooding out today or likely to flood out next week. I do think it’s fair to say that, given what we previously knew, this is not additionally concerning beyond what we should have already learned. There are some signs in the tests of potential over-refusals, perhaps? But that’s it. Hallucinations are relatively rare. It’s easy to jailbreak, but that’s fully expected. We’re releasing a research preview of OpenAI GPT-4.5, our largest and most knowledgeable model yet. Building on GPT-4o, GPT-4.5 scales pre-training further and is designed to be more general-purpose than our powerful STEM-focused reasoning models. We trained it using new supervision techniques combined with traditional methods like supervised fine-tuning (SFT) and reinforcement learning from human feedback (RLHF), similar to those used for GPT-4o. We conducted extensive safety evaluations prior to deployment and did not find any significant increase in safety risk compared to existing models. … For GPT-4.5 we developed new, scalable alignment techniques that enable training larger and more powerful models with data derived from smaller models. These techniques allowed us to improve GPT4.5’s steerability, understanding of nuance, and natural conversation. New supervision techniques and alignment techniques, eh? I’m very curious. GPT-4.5 did show noticeable steps up in persuasion, but nothing too worrisome. In the hard capability areas that create danger, GPT-4.5 is a step down from Deep Research and o3. The question is what this would mean if you incorporated GPT-4.5 into a new architecture that also included scaling inference time compute and knowing when to consult smaller models. That’s what they plan on calling (no this isn’t confusing at all! what are you talking about?) GPT-5. Also, they included another reminder that OpenAI can only test on some important threats, such as radiological, nuclear and biological threats, can only be done properly with access to classified information. Which means you need the US AISI involved. Our Price Not Cheap This is a big model. It is priced accordingly. Indeed, it is so expensive to serve OpenAI mentions that it is not certain it will continue serving it via API at all. The obvious response is ‘then charge more’ but presumably they feel that means taking fire. Near: update: selling my children to try out 4.5 today Chris Malloy: Ouch. I mean sure that’s relatively a lot but also it’s eleven bucks. So it depends on use case. Seriously, please, let us pay for the good stuff. If I don’t want it, I won’t pay. Fine. Ashutosh Shrivastava: LMAO, OpenAI GPT-4.5 pricing is insane. What on earth are they even thinking?? Steve Darlow: What!? I’d have it answer with 1 sentence or less each time. Maybe have it communicate by emoji and then have a regular model translate? Colin Fraser: they’re thinking “we need to figure out how to make more money than we spend” The cost to serve the model plausibly means GPT-4.5 is actually rather old. There’s speculation it may have finished training in Summer 2024, was dismissed (likely the same way Opus 3.5 was) as not worth serving given the backlash to high prices and limited available compute, and was released now because of a combination of more available compute and the pressure from DeepSeek. That seems plausible, and the model card does have some things that make this seem more likely. Pay Up You Cheapskate Straight talk. Stop whining about the relative price. The absolute price is dirt cheap. This was true for o1-pro and Deep Research and Sonnet, and it’s true for GPT-4.5. If you’re talking to an LLM directly, or otherwise using the output as a person for real, then choose the best model for the job. If it costs $200/month, or $150 per million tokens, that is still approximately zero dollars. Consider what you get. Consider what it would cost to get this amount of intelligence from a human. Pay up. GPT-4.5 will often be the wrong tool for the job. It’s not a reasoning model. It’s not a coding model. It’s definitely not Deep Research. And no, it’s not the quantum leap you might have hoped for here. But if it’s the right model for the job and you aren’t broke, what are you even doing. While Supplies Last OpenAI’s announcement of GPT-4.5 said they were considering not offering it in the API going forward. So it makes sense that a lot of people tried to prevent this. Sam Altman: GPT-4.5 is the first time people have been emailing with such passion asking us to promise to never stop offering a specific model or even replace it with an update. great work @kaicathyc @rapha_gl @mia_glaese I have seen enough that I do feel it would be a tragedy if OpenAI pulled GPT-4.5 without replacing it with another model that did similar things. But yes, fandom has long taught us that if you offer something cool and then threaten to take it away, there will be those stepping up to try and stop you. Benchmarks Sam Altman warned that GPT-4.5’s benchmarks will not reflect its capabilities, as it is focused on areas not picked up by benchmarks. I want to be clear up front: This was not cope from Altman. He’s right. Benchmarks most definitely don’t tell the story here. Ethan Mollick: I think OpenAI missed a bit of an opportunity to show GPT-4.5’s strengths, to their detriment & to the AI industry as a whole by only using the same coding & test benchmarks when critical thinking & ideation are key AI use cases where 4.5 is good. Those are actually measurable. Janus: if you think i hate benchmarks too much, you’re wrong. i don’t have the emotional energy to hate them enough. they constrict & prematurely collapse the emergence of AGI. minds that are shaped differently will not be recognized and will be considered an embarrassment to release. Despite that, it’s still worth noting the benchmarks. SimpleQA is 62.5% vs. 47% for o1, 38.2% for 4o and 15% (!) for o3-mini. Hallucination rate on SimpleQA is 37.1%, lower than the others. GPT-4.5 is preferred over GPT-4o by human testers, but notice that the win rates are not actually that high – the effects are subtle. I’m curious to see this with an additional ‘about the same’ button, or otherwise excluding questions where GPT-4o is already essentially saturating the right answer. Nathan Labenz: Don’t underestimate the meaning of a 63% win rate on professional queries Recall that the original gpt-4 beat gpt-3.5 only 70/30 63% translates to almost 100 ELO points, which in theory if added to the current gpt-4o score on LMSys would put gpt-4.5 in first by ~75 This is also a clear signal that you can train a small model to reason effectively, but you need a large model for comprehensive world knowledge. We’ll soon see these powers combined! And fwiw, I also suspect the concepts represented in 4.5 are notably more sophisticated The story they’re telling is that GPT-4.5 has higher EQ. That helps, but it does not consistently help. Many queries don’t care about EQ, and sometimes people are weird. GPT-4.5 is very much not focused on coding, it still did well on Agentic Coding, although not as well as Sonnet 3.7. Scott Wu: GPT-4.5 has been awesome to work with. On our agentic coding benchmarks it already shows massive improvements over o1 and 4o. Excited to see the models’ continued trajectory on code! One interesting data point: though GPT-4.5 and Claude 3.7 Sonnet score similarly on our overall benchmark, we find that GPT-4.5 spikes more heavily on tasks involving architecture and cross-system interactions whereas Claude 3.7 Sonnet spikes more on raw coding and code editing. As AI takes on increasingly complex tasks, we believe that multi-model agents that incorporate each model’s unique strengths will perform best. It however did actively worse on SWE-Bench than the reasoning models, and vastly worse than Sonnet. METR tests on their time horizon tasks, and finds GPT-4.5 falls below o1 and 3.6. GPT-4.5 takes the top spot on WeirdML. A cool note is that Claude 3.7 here tends to use a lot of lines of code, and GPT-4.5 reliably uses relatively very little code. The code runs faster too. It does not try too hard. A weird one is the ‘What is the least integer whose square is between 15 and 30’ test, which it seems GPT-4.5 has failed and where OpenAI models do consistently worse. GPT-4.5 could in the future be used as the foundation of a reasoning model, which is plausibly the plan for GPT-5. If that happens, the result would be expensive to serve, perhaps prohibitively so, but could potentially show new capabilities. It is also possible that various scaffoldings could enable this without creating a reasoning model per se. If one were to make a model like GPT-4.5 open weights, those would be big worries. Since GPT-4.5 is closed, we can count on OpenAI to take precautions in such cases. Ask a silly question: Rs in strawberry (gets it wrong), 9.9>9.11 (gets it right). The all-new Being Tyler Cowen benchmark, Sonnet 3.7 also gave a solid performance. On the Being Zvi Mowshowitz benchmark, neither did as well, and I’m not sure which response was better, and I feel like I now better understand when I want 4.5 vs. 3.7. Still no word on the Minecraft benchmark. On the ‘outline a 50 chapter book’ benchmark Eleanor Konik reports it falls short where o1-pro does well. It makes sense that would effectively be a reasoning task rather than a writing task, so you’d do the outline with a reasoning model, then the actual text with GPT-4.5? We Need Better Evaluations So what do we do about the eval situation? Andrej Karpathy: My reaction is that there is an evaluation crisis. I don’t really know what metrics to look at right now. MMLU was a good and useful for a few years but that’s long over. SWE-Bench Verified (real, practical, verified problems) I really like and is great but itself too narrow. Chatbot Arena received so much focus (partly my fault?) that LLM labs have started to really overfit to it, via a combination of prompt mining (from API requests), private evals bombardment, and, worse, explicit use of rankings as training supervision. I think it’s still ~ok and there’s a lack of “better”, but it feels on decline in signal. There’s a number of private evals popping up, an ensemble of which might be one promising path forward. In absence of great comprehensive evals I tried to turn to vibe checks instead, but I now fear they are misleading and there is too much opportunity for confirmation bias, too low sample size, etc., it’s just not great. TLDR my reaction is I don’t really know how good these models are right now. Zvi Mowshowitz: Yeah I think we don’t have a systematic way to test for what GPT-4.5 is doing that is unique – I recognize it but can’t even find precise words for it. What even is ‘taste’? Morissa Schwartz: Exactly! GPT-4.5’s magic lies precisely in the intangible: intuition, humor, and an abi"
