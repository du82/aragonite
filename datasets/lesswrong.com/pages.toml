["https://lesswrong.com/posts/wJSG56nRjkYoGJwwf/soren-elverlin-s-shortform"]
title = "Søren Elverlin's Shortform — LessWrong"
description = "A collection of shorter posts by LessWrong user Søren Elverlin"
full_description = '''This is a special post for quick takes by Søren Elverlin. Only they can create top-level comments. Comments here also appear on the Quick Takes page and All Posts page. I made my most strident and impolite presentation yet in the AISafety.com Reading Group last night. We were discussing "Conversation with Ernie Davis", and I attacked this part: "And once an AI has common sense it will realize that there’s no point in turning the world into paperclips..." I described this as fundamentally mistaken and like an argument you'd hear from a person that had not read "Superintelligence". This is ad hominem, and it pains me. However, I feel like the emperor has no clothes, and calling it out explicitly is important. Explaining things across long inferential distance is frustrating. The norm that arguments should be opposed by arguments (instead of e.g. ad hominems) is good in general, but sometimes a solid argument simply cannot be constructed in five minutes. At least you have pointed towards an answer... Today, I bought 20 shares in Gamestop / GME. I expect to lose money, and bought them as a hard-to-fake signal about willingness to coordinate and cooperate in the game-theoretic sense. This was inspired by Eliezer Yudkowsky's post here: https://yudkowsky.medium.com/ In theory, Moloch should take all the ressources of someone following this strategy. In practice, Eru looks after her own, so I have the money to spare. Unclear. It's hard to know what any part of a distributed group thinks, let alone what the current gestalt is. With expiring options last Friday, and a noticeable price drop, it looks like the gamma squeeze (https://www.fool.com/investing/2021/01/26/gamestops-gargantuan-gamma-squeeze/) is over. A lot of shorts seem to have covered (redeemed or returned their borrows), but by no means all - last I saw there are still 40% as many shorts as the normal float (shares available without shorting). Which is a lot, and enough to fuel a squeeze if enough shares are held and not trading. But much much smaller than the 140% two weeks ago. https://isthesqueezesquoze.com/ says no, but predicting a mass of internet trolls with brokerage accounts is non-trivial.'''
