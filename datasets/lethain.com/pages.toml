["https://lethain.com/a-picture-of-a-couple"]
title = "A Picture of a Couple | Irrational Exuberance"
description = "A picture of a couple, one of whom I know rather well, and the other who is more of a brief acquaintance. A picture made interesting because it tells its story better blurred than it would have with proper focus."
full_description = "A Picture of a CouplePublished on May 3, 2008. japan (44), photo (2)One picture can tell a number of stories, if you're willing to let it. In the same way, one picture won't tell any stories if you're not particularly interested. I took this picture of a friend and a girl he was interested in about a month ago, and at the time it was a bit of an interesting picture for me (I enjoy playing around with focusing), but wasn't necessarily a standout that screamed for individual attention.However, at a latter point, the friend mentioned that the first thing that really drew him to her was her brightness. Not necessarily, as one might cheerfully assume, the brightness of her personality or an aura of kindness that danced in the shadows surrounding her, but a slightly more literal sense of it: red hair and a wardrobe filled with strong colors.After hearing that, I felt like this picture was somehow a perfect portrait of the two of them together. There he stands in the center of the picture, surrounded by her bright red glow.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.RelatedA Week In The JobFailed Night Time Pictures of Sakura BlossomsA Brief Winter HikeCatching Up On Some ThoughtsQuick Reflections on JET in Haiku"
