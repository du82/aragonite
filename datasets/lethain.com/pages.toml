["https://lethain.com/a-python-markdown-extension-for-embedding-graphviz"]
title = "A Python-Markdown Extension for Embedding Graphviz | Irrational Exuberance"
description = "I use Markdown for most of my online writing, and also as the format for most of my personal notes. Since I also use Graphviz quite frequently, adding an extension to handle both seemed like a reasonable next step."
full_description = '''A Python-Markdown Extension for Embedding GraphvizPublished on January 16, 2010. python (65), markdown (6)Two of the tools I use most frequently in my writing (both public writing on this blog and notes I jot down for personal consumption) are graphviz and markdown. The last few days I've been tossing around the idea of embedding Graphviz graphs into Markdown, and today I had a couple of hours to quickly throw it together.The proof of concept, python-markdown-graphviz, is available on Github.I chose to extend Python-Markdown because that is how I implemented my custom (and some have claimed, arbitrary) Markdown extensions I use for this blog.The syntax for writing documents is straightforward: enclose the Graphviz graphs in a tag whose type corresponds with the Graphviz executable to render the snippet (dot, neato, lefty, dotty).* hi * there <dot> digraph a { b -> c -> d } </dot> ## And a title <neato> digraph a { b -> c -> d } </neato> This is some text A simple example of usage is (requiring that mdx_graphviz.py be in the Python path):import markdown txt = "* this is some\n<dot>\ndigraph a {\n a -> b;\n}\n</dot>\nhi\n" md = markdown.Markdown(extensions=['graphviz']) print md.convert(txt) You can customize a few settings:BINARY_PATH is the path to the dot, neato, etc executables (defaults to no path, i.e. assumes will be in $PATH).FORMAT is the format for images created by Graphviz (defaults to png).WRITE_IMGS_DIR is the directory to write images into (defaults to local directory).BASE_IMG_LINK_DIR is the base directory for the links to the generated images (defaults to local directory).An example of changing the defaults settings:import markdown txt = "* this is some\n<dot>\ndigraph a {\n a -> b;\n}\n</dot>\nhi\n" md = markdown.Markdown( extensions=['graphviz'], extension_configs={'graphviz': {'FORMAT':'gif'} }, ) print md.convert(txt) There is a lot of room for improvement, in particular a few ideas:use the name of the graph (extracted from the graphviz syntax) for the filename instead of numeric filenames.option to specify dimensions of graphs, or at least specify the width and auto-calculate the height.That's all there really is to it. I'll probably make some improvements as I keep using it, but would always be glad to have others build on it as well if it's useful.Repository is available here.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.RelatedCleanly Extending Python Markdown with Syntax HighlightingA Photo Album with Python and PILCleaning up erlang_markdownA Failed Stack-based Markdown InterpreterHow To Remotely Admin Servers Via Twitter'''
