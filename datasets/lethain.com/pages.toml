["https://lethain.com/2-traffic-jams"]
title = "2. Traffic Jams | Irrational Exuberance"
description = "Sometimes we find relief in life’s nuances… simply because they are predictable when nothing else can be relied upon. Part two of Zen and the Art of Teaching English Poorly."
full_description = '''2. Traffic JamsPublished on December 1, 2007. writing (37)Somehow I find myself in a car hurtling down Interstate 75 towards Atlanta. This is made a bit more distressing by the fact that I am the one guiding the mechanical beast through ephemeral gaps between other large mechanical beasts who regard my personal safety with the proper modern indifference.BEEPHmm. Maybe I should focus on driving, but I just realized I never explained where I am going. I am not a habitual packer of suitcases or driver on long trips. Instead, it turns out, I have both a purpose and a destination.If my father wasn't snoring in the passenger's seat, I would try to convey my purpose in a contrived conversation, but I am afraid I will simply have to explain without any dialog to foster a false impression of impartiality.The purpose is a job in something called Japanese Exchange and Teaching Program, or more simply: JET. I've already signed their year long contract to teach English. The destination is a small town that has too weak a gravitational pull to exist outside of its physical location and a few silent memories never recorded outside of diaries. I am heading towards this place that has not yet given proof of its existence except for a piece of paper inside an internationally mailed envelope. More mysterious than the town, is this job I have accepted.What do I actually know? A quick mental inventory of pertinent knowledge:a once lush rain-forest lies barren to facilitate the endless packets I have received that are full of official propaganda that relishes the usage of phrases like "International Exchange" and "Fostering Cultural Understanding",a summer friend's stories,an hour with a friend of my mother's,a hundred anonymous voices on the Internet,three emails with my predecessor,one email from my supervisor,and one motto that I can't decide whether to label as distressing or as hopeful: "Every Situation is Different."Staring at the tightly packed mass of angry truckers, soccer moms, and lost souls crowded around me, I am forced to accept that even a carefully wrought conversation couldn't conceal one awkward truth: the sum of my knowledge is adequate for little more than breeding Will-O-Wisps in the sulfuric marsh I occasionally refer to as my future.Th slow traffic placates my unrest. I am anxious, but for now a traffic jam is a comforting presence. Something I can peacefully reduce to causes and effects, and cleanly merge into my world view. Will I often long for traffic jams in the upcoming year?Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.Related1. Beginnings0. IntroductionExamining Web Analytics to Implement (repost)Anti-Objects and Reflexive Decisions (repost)A Comp. Sci Degree is What You Make Of It (repost)'''
