title = "Accolades for Pygments 0.9 | Irrational Exuberance"
description = "Pygments 0.9 adds lexers for Common Lisp along with a handful of other languages. I am an unabashed fan."
full_description = "Accolades for Pygments 0.9Published on January 3, 2008. python (65)The last time I looked at Pygments they were lacking support for Common Lisp, which was kind of a pain for me. But I just used the Scheme lexer and kind of looked at myself with loathing for not manning up and contributing a Common Lisp lexer myself.Today though, I was wondering if anything had changed in Pygments recently (I use Pygments to provide highlighting for my LifeFlow blog), and I happened to glance at the lexers page.I was overjoyed to find that they now have a Common Lisp lexer included in version 0.9!Other new lexers are:ErlangLiterate HaskellMooDesbian control filesGettext catalog filesSquid configuration filesActionScriptGood stuff, and glad to see that Pygments is getting even more comprehensive as time goes on. It, along with BeautifulSoup, is one of the few Python libraries that I know by arbitrary name.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.RelatedUsing PyFacebook without the Facebook middlewareAdding Social Bookmarking To a Django AppSyntax Highlighting with MarkDown, and a pinch of Automagick for DjangoExtracting Models From Django DatadumpHow to Migrate Data Across Model Changes"
