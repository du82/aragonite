["https://lethain.com/a-brief-winter-hike"]
title = "A Brief Winter Hike | Irrational Exuberance"
description = "A few weeks ago I ended up on a short abortive hike on the third tallest mountain in Japan. Here are a few documenting pictures."
full_description = "A Brief Winter HikePublished on April 5, 2008. hiking (2), japan (44)The second weekend of March (give or take) a few friends of George, one of the ALTs in Takayama, came from England to take a week long sojourn in Japan. We ended up on the third tallest mountain in Japan (mostly by way of a long ropeway as opposed to the efforts of our legs). Here are a few pictures documenting the event.Clearly we were not universally equipped for a five hour hike on three feet of compacted snow. This is probably why we did not in-fact attempt the five hour hike. Despite anticipating the development, it was still slightly to my chagrin.The sky was really captivating that day. Genuinely gorgeous.Warren and I went ahead of the rest of the group for a bit just to feel like we had done a little bit of hiking. We got about 40 minutes away from that lodge in our exploratory hike. We both agreed that we need to return and hike it again once the snow has melted... sometime around mid May.A tree I thought was particularly pretty.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.RelatedHiking TengaisanCatching Up On Some ThoughtsQuick Reflections on JET in HaikuSpring Doesn't Come in February, But Snow DoesTeaching Elementary Classes as an ALT"
