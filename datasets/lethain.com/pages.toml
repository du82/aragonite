full_description = '''"Good Process is Evolved, Not Designed" in 97 Things Every Engineering Manager Should KnowPublished on December 20, 2019. management (204), writing (37)Earlier in the year, I got the chance to contribute an article to Camille Fournier’s latest book, 97 Things Every Engineering Manager Should Know, and jumped at the chance to write something. The piece I contributed is Good Process is Evolved, Not Designed, and is a streamlined version of an earlier blog post, which I’ve also converted into a short conference talk.I enjoyed this process quite a bit, in particular because it was an opportunity to work in a different medium with different folks than my typical writing workflow, similarly to how I loved getting to write a piece in Increment about Do engineering managers need to be technical?At some point I’m quite hopefully I’ll put together another book or two, but in the meantime these shorter writing slots are a bit more scalable and I hope I’ll find a couple for 2020 as well.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.Related"Do engineering managers need to be technical?" in Increment.An Elegant Puzzle is released today!An Elegant Puzzle: Systems of Eng Management.Mailbag: When your team wants your job, personal brand, and service registries."How to successfully design organizational processes"'''
