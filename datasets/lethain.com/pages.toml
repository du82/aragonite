["https://lethain.com/a-filter-to-display-neighbors-in-a-list"]
title = "A Filter to Display Neighbors in a List | Irrational Exuberance"
description = "When you have a lot of content to show but not enough room to it, a helpful UI pattern is to show just the content surrounding your current position. We see this in search result pages, and now in a series’ list of entries on my blog."
full_description = '''A Filter to Display Neighbors in a ListPublished on January 20, 2009. design (5), django (72)When you don't spend much time thinking about them, sometimes it's easy to miss out on obvious UI patterns. This really struck me recently when I was making some minor tweaks to my blog.In my last redesign I wanted to focus on articles as much as possible--modeling presentation after books and newspapers--and part of that was throwing out the sidebar. I eliminated as much redundant information as possible, but eventually reached a point where everything remaining seemed too important to cut.I expanded the header to contain as much as possible, but knew I didn't have enough room to fit everything I wanted. So I decided to try making the header content contextual. Specifically, I broke the header into five segments.With the restrictions of spaces A, B, and C, it was pretty clear that I couldn't fit all of the content I wanted; I'd need to economize a bit. I decided to start out with a simple strategy that I could optimize on later:Always show additional nav links in slot C.If an article has a related series, show it in slot A.Backfill empty slots with related tags.Backfill an empty slot with recent entries.Backfill an empty slot with random entries.This meant that navigation pages (like the Life page or the front) would always display the recent and random entries, and an entry would show fairly relevant articles (a mix entries in the same series and entries sharing the same tags). Although simplistic, these rules do seem to surface relevant content.(I'm tinkering with the idea of replacing random entries with the top five entries by comment volume, which might do a better job of exposing interesting content.)Since I had five navigational links in the C slot, I decided to include at most five articles in the A and B slots as well. Then I got mentally stuck for a few months: how could I handle a series of articles that was longer than five entries?Somewhere after implementing half a dozen search prototypes at work I realized there is a pattern for this, and it exists in every search result page's UI.More specifically, what is interesting is what happens when you reach a page such that the first page of results is no longer being shown.Ah, there it is: if I have more than five entries in a series, I just need to display the current entry, the two preceeding it, and the two following it. So blinding when I finally saw the light.Implementation this concept as a template filter is fairly straightforward.from django import template register = template.Library() def nearby(lst, obj, count=5): lst = list(lst) l = len(lst) try: pos = lst.index(obj) except ValueError: pos = 0 dist = count / 2 if pos <= dist: return lst[:count] if pos >= l - dist: return lst[l-count:] else: return lst[pos-dist:pos+dist+1] register.filter('nearby', nearby) Here is usage in a template (assuming an entry named object and a list of entries named series in the template context).<h1>{ { object.title }}</h1> <ol class="series"> {% for entry in series|nearby:object %} <li>{ { entry.title }}</li> {% endfor %} </ol> I can only wonder how it took me so long to figure this one out.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.RelatedDjango-Portfolio: Organize and Display ProjectsA Different Approach to local_settings.pySlides from django-nyc on 11/18/2008Bad Ideas and Regular Expressions in TemplatesDeploying Django with Fabric'''
