["https://lethain.com/1-beginnings"]
title = "1. Beginnings | Irrational Exuberance"
description = "Chapter one of Zen and the Art of Teaching English Poorly. On beginnings."
full_description = '''1. BeginningsPublished on December 1, 2007. writing (37)When I was in junior high school I once sat down with my father to work through several math problems that were giving me trouble. While working through them he made a simple instruction that has stayed with me: "Always leave enough whitespace. Always use more paper if it makes your work easier to understand."This sweeping permission to value expression over a sheet of paper is easily lost on a child, but has come back to haunt me as an adult. We're killing the environment and ruining our oceans... but my ideas may be all I have. Is it wrong to use two sheets of paper when one will suffice? What if it is a really important idea?I couldn't answer that question. Pitting science's calculated reality against a visceral love of uncluttered paper is an equation I didn't know how to balance. That and a thousand other uncertainties about living compounded into one simple scene: sitting in my childhood room, and staring at my life packed into two suitcases and a messenger's bag.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.Related0. IntroductionExamining Web Analytics to Implement (repost)Anti-Objects and Reflexive Decisions (repost)A Comp. Sci Degree is What You Make Of It (repost)Is the JVM the "next assembly"? I hope not. (repost)'''
