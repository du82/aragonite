["https://lethain.com/a-command-line-tool-for-loading-couchdb-documents"]
title = "A Command Line Tool for Loading CouchDB Documents | Irrational Exuberance"
description = "This is a simple command line tool, implemented in Python, which makes it easy to use JSON and Python data structures as the data-source of CouchDB documents. Handles bulk and individual submission, and has a handful of command-line options (specify hostname, port, path, etc)."
full_description = '''A Command Line Tool for Loading CouchDB DocumentsPublished on December 9, 2008. python (65), couchdb (6)While working with CouchDB this weekend, I found myself wanting a bit more than creating CouchDB content in Futon, and a bit less than writing a new custom script for each new experiment; a script that would take a file or directory of files, convert them into JSON, and upload them into CouchDB.So, I wrote it.JustificationsCreating multi-line values in Futon is not particularly straight-forward, so the standby save-in-another-file-and-paste-in solution is suboptimal.For experimentation, I was often deleting databases, and wanted a quick and simple way to load sample data and views.Wanted an easy way to add one-off data, without writing throw-away code (the perfect domain for a command-line tool).Writing document data in Python gives me some niceties:good tabbing and syntax highlighting for cleaner data,handles translating data structures into JSON via simplejson, which validates syntax of the Python data structure, as well as ensuring that the output JSON is valid.Command line tools play together much better than scripts do.File FormatsThere are four possible file formats for the script:A Python dict in a file with extension .py.{ '_id':'123',"title":"hi","etc":"blah" } A Python list of dicts in a file with extension .py.[ {'title':'a'}, {'title':'b'}] A JSON dict in a file with extension .js or .json. (Um. A simple example is actually identical in structure to the Python example.)A JSON array of dicts in a file with extension .js or .json. (Again, this will actually be identical with the Python list example.)The array formats are always sent via the bulk document api (each dict within the array is a document), and the dict formats are always sent via the PUT api for creating doucments.UsageUsage is fairly straight forward.python doc_utils.py database-name python doc_utils.py db path/to/folder python doc_utils.py db path/my_views.py python doc_utils.py db --port=3432 python doc_utils.py db --hostname=example.com Any combination of the above options works as well, so you can use it to load arbitrary paths to arbitrary instances of CouchDB.DownloadYou can grab the source code at its GitHub repository, as well as download a zip.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools.RelatedFull-Text Search in CouchDB Using... CouchDBParallel HTTP Requests in PythonPython-Brightkite for... you get the ideaDeploying Django with FabricR.I.P. Your Resume Site to Awesome'''
