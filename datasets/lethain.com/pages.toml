full_description = "Will LarsonPublished on April 1, 2007.Want help with something? Here are ways I’m available to help!Looking for my investments? Here they are!Bio and headshots for an event? Check at the bottom.Hi folks,I’m a software engineering leader and writer, currently serving as Carta’s CTO. I’ve worked at Calm, Stripe, Uber, Digg, a few other places, and cofounded a defunct iOS gaming startup with Luke Hatcher, Monocle Studios. I’ve written three books: An Elegant Puzzle (2019), Staff Engineer (2021), and The Engineering Executive’s Primer (2024). This blog, Irrational Exuberance, has been around since 2007, and I’ve done some public speaking as well.Further back, I grew up in North Carolina, studied computer science at Centre College in Kentucky, and spent a year in Japan on the JET Program.For more detail, check out some of my recent years in review: 2024, 2023, 2022, 2021.WillBioWill Larson is CTO at Carta, and has been a software engineering leader at Calm, Stripe, and Uber. He is the author of An Elegant Puzzle, Staff Engineer, and The Engineering Executive’s Primer. He lives with his family in San Francisco.Images1315x16613730x24842333x34993552x2462Some smaller thumbnails as well at 100x100, 400x400, 512x512.Hi folks. I'm Will Larson.If you're looking to reach out to me, here are ways I help. If you'd like to get a email from me, subscribe to my weekly newsletter.I wrote An Elegant Puzzle, Staff Engineer, and The Engineering Executive's Primer.PopularEng org seniority-mix model.How to create software quality.Useful tradeoffs are multi-dimensional.Layers of context.Writers who operate.RecentHow to integrate Stripe's acquisition of Index? (2018)Diagnosis in engineering strategy.Exploring for strategy.How should we control access to user data?Our own agents with their own tools."
