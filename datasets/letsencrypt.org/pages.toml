["https://letsencrypt.org/privacy"]
title = "Privacy Policy -  Let's Encrypt"
description = """
The Let&rsquo;s Encrypt Privacy Policy describes how we collect, use, and disclose your information in three different contexts:
When, as a Relying Party, you visit a web site secured with HTTPS that uses a certificate from Let&rsquo;s Encrypt, When you are a Subscriber, i.e., when you request and use certificates from Let&rsquo;s Encrypt, When you are a Visitor to the Let&rsquo;s Encrypt web site, community discussion forum, other web pages under letsencrypt."""
full_description = "The Let’s Encrypt Privacy Policy describes how we collect, use, and disclose your information in three different contexts: Let’s Encrypt is a service provided by Internet Security Research Group, a California (United States) Nonprofit Public Benefit Corporation. When you use an HTTPS web site or other TLS service with a Let’s Encrypt certificate, your browser (or TLS client) may query Let’s Encrypt to check whether the certificate has been revoked. If your browser makes such a request, our servers may automatically record your IP address, browser, and operating system in temporary server log files. We do not use this data to build profiles or identify individuals. Temporary server logs are used for operational purposes only and are normally deleted in less than seven days. We may retain a subset of server logs for longer periods in order to investigate software failures or abuse. If we do so, we will delete any stored logs when we are done investigating. We may also compute, retain and publish aggregate information from server logs, such as which certificates generate the largest volume of requests. We will always strive to ensure that such datasets do not contain information about the activities of identifiable users or devices. If you are a Subscriber, you are requesting a trusted certificate from Let’s Encrypt intended to publicly vouch that you control a certain domain name or names that are reachable on the Internet. As part of the process of proving that control, Let’s Encrypt will collect various information related to certificate authentication and management. That information includes the IP addresses from which you access the Let’s Encrypt service; all resolved IP addresses for any requested identifiers; server information related to any validation requests; full logs of all inbound HTTP / ACME requests, all outbound validation requests; and information sent by or inferred from your client software. We will store this information for a minimum of two years per trusted root program requirements."
