["https://letsencrypt.org/da/docs/faq"]
title = "FAQ -  Let's Encrypt"
description = """
Denne FAQ er opdelt i følgende afsnit:
Generelle spørgsmål Tekniske Spørgsmål Generelle spørgsmål Hvilke tjenester tilbyder Let&rsquo;s Encrypt? Let&rsquo;s Encrypt er en global certifikatautoritet (CA). Vi lader folk og organisationer i hele verden anskaffe, forny og administrere SSL/TLS-certifikater. Vores certifikater kan bruges af websites til at aktivere sikre HTTPS-forbindelser.
Let&rsquo;s Encrypt tilbyder domæne validerede (DV) certifikater. Vi tilbyder ikke Organization Validation (OV) eller Extended Validation (EV) primært fordi vi ikke kan automatisere udstedelsen af disse typer af certifikater."""
full_description = "Let’s Encrypt er en global certifikatautoritet (CA). Vi lader folk og organisationer i hele verden anskaffe, forny og administrere SSL/TLS-certifikater. Vores certifikater kan bruges af websites til at aktivere sikre HTTPS-forbindelser. Let’s Encrypt tilbyder domæne validerede (DV) certifikater. Vi tilbyder ikke Organization Validation (OV) eller Extended Validation (EV) primært fordi vi ikke kan automatisere udstedelsen af disse typer af certifikater. Vi opkræver ikke noget gebyr for vores certifikater. Let’s Encrypt er en non-profit, vores mission er at skabe en mere sikker og respekt for privatlivets fred Web ved at fremme den udbredte vedtagelse af HTTPS. Vores tjenester er gratis og nem at bruge, så alle hjemmesider kan implementere HTTPS. Vi har brug for støtte fra generøse sponsorer, tilskudsgivere, og enkeltpersoner for at kunne levere vores tjenester gratis over hele kloden. Hvis du er interesseret i at støtte os, bedes du overveje at donere eller blive en sponsor. I nogle tilfælde integratorer (f.eks. hosting-udbydere) vil opkræve et nominelt gebyr, der afspejler de administrations- og administrationsomkostninger, de pådrager sig for at levere Let’s Encrypt certifikater. Let’s Encrypt køres af et lille hold og er afhængig af automatisering for at holde omkostningerne nede. Vi kan derfor ikke tilbyde direkte støtte til vores brugere. Vi har dog nogle gode støttemuligheder: Vi anbefaler, at sådanne websteder rapporteres til Google Safe Browsing og Microsoft Smart Screen program, som er i stand til mere effektivt at beskytte brugerne. Her er de rapporterings webadresserne: Lad os kryptere certifikater er standard domæne valideringscertifikater, så du kan bruge dem til enhver server, der bruger et domænenavn, som webservere, mailservere, FTP-servere og mange flere. E-mail-kryptering og kode-signering kræver en anden type certifikat, som Let’s Encrypt ikke udsteder. Den private nøgle er altid genereret og administreres på dine egne servere, ikke af Let’s Encrypt certifikatmyndigheden."
year_published = 2024
clearnet = "https://letsencrypt.org/da/docs/faq"
