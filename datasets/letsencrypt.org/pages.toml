full_description = "ලෙට්’ස් එන්ක්‍රිප්ට් යනු මහජන ප්‍රයෝජනය සඳහා ක්‍රියාත්මක වන නොමිලේ, ස්වයංක්‍රීය සහ විවෘත සහතික අධිකාරියකි (CA). එය අන්තර්ජාල ආරක්‍ෂණ පර්යේෂණ සමූහය (අයි.එස්.ආර්.ජී.) විසින් සපයන සේවාවකි. වියමන අඩවි සඳහා HTTPS (SSL/TLS) සබල කිරීමට අපි මිනිසුන්ට ඇවැසි සංඛ්‍යාංක සහතික හැකි උපරිම පරිශීලක-හිතකාමී ආකාරයෙන් නොමිලේ ලබා දෙන්නෙමු. අපට වඩාත් ආරක්‍ෂිත සහ පෞද්ගලිකත්වයට ගරු කරන වියමනක් සෑදීමට ඇවැසි බැවින් මෙය සිදු කෙරේ. අපගේ වාර්ෂික වාර්තාව බාගැනීමෙන් වඩාත්ම මෑත වසරේ සමාලෝචනය කියවීමට හැකිය. ලෙට්’ස් එන්ක්‍රිප්ට් පිටුපස ඇති ප්‍රධාන මූලධර්ම වන්නේ: ලෙට්’ස් එන්ක්‍රිප්ට් ක්‍රියා කරන ආකාරය පිළිබඳව වඩාත් විස්තරාත්මක තොරතුරු සහිත පිටුවක් අප සතුව ඇත. Let's Encrypt යනු නොමිලේ, ස්වයංක්‍රීය සහ විවෘත සහතික අධිකාරියකි. ලාභ නොලබන අන්තර්ජාල ආරක්‍ෂණ පර්යේෂණ සමූහය (අයි.එස්.ආර්.ජී.) විසින් මෙහෙයවයි."
