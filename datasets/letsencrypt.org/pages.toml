["https://letsencrypt.org/de/donate"]
title = "Spenden -  Let's Encrypt - Freie SSL/TLS Zertifikate"
description = "Sind Sie eine Organisation, die unsere Arbeit unterstützen möchte? Eine Patenschaft ist vielleicht besser für Sie geeignet. Erfahren Sie mehr. Wir machen es möglich, dass jeder ein sicheres und die Privatsphäre respektierendes Web erleben kann. Wir machen es einfach, Zertifikate für HTTPS zu erhalten, da die Benutzerfreundlichkeit für die Akzeptanz entscheidend ist. Wir stellen Zertifikate kostenlos zur Verfügung, denn Kosten schließen Menschen aus. Unsere Zertifikate sind in jedem Land der Welt verfügbar, denn das sichere Web ist für alle da."
full_description = "Sind Sie eine Organisation, die unsere Arbeit unterstützen möchte? Eine Patenschaft ist vielleicht besser für Sie geeignet. Erfahren Sie mehr. Wir machen es möglich, dass jeder ein sicheres und die Privatsphäre respektierendes Web erleben kann. Wir machen es einfach, Zertifikate für HTTPS zu erhalten, da die Benutzerfreundlichkeit für die Akzeptanz entscheidend ist. Wir stellen Zertifikate kostenlos zur Verfügung, denn Kosten schließen Menschen aus. Unsere Zertifikate sind in jedem Land der Welt verfügbar, denn das sichere Web ist für alle da. Wir bemühen uns um Offenheit und Transparenz, weil diese Werte für das Vertrauen unerlässlich sind. Wertvolle Wertpapiere oder Investmentfondsanteile, die Sie bereits seit mehr als einem Jahr besitzen, eignen sich hervorragend für wohltätige Zwecke. Bitte teilen Sie uns mit, wenn Sie Wertpapiere übertragen wollen: sponsor@abetterinternet.org. Sie können auch das Genehmigungsschreiben Ihres Maklers per E-Mail senden. Empfehlen Sie eine Spende an die Internet Security Research Group (unsere Mutterorganisation) aus Ihrem Spendenfonds. Ihre Spende kommt zu 100 % der Förderung eines sicheren und die Privatsphäre achtenden Internets zugute. Viele Unternehmen verdoppeln die Spenden ihrer Mitarbeiter an gemeinnützige Organisationen. Prüfen Sie, ob Ihre Organisation ein entsprechendes Programm anbietet und verdoppeln Sie Ihre Wirkung! Die Internet Security Research Group ist die 501(c)(3) gemeinnützige Organisation hinter Let's Encrypt. Unser EIN ist: 46-3344200. Let's Encrypt ist eine gratis, automatisierte, und offene Zertifizierungsstelle, die Ihnen von der gemeinnützigen Internet Security Research Group (ISRG). Lesen Sie alles über unsere gemeinnützige Arbeit in diesem Jahr in unserem jährlichen Geschäftsbericht 2024."
