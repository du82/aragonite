["https://letsencrypt.org/docs/account-id"]
title = "Finding Account IDs -  Let's Encrypt"
description = """
When reporting issues it can be useful to provide your Let&rsquo;s Encrypt account ID. Most of the time, the process of creating an account is handled automatically by the ACME client software you use to talk to Let&rsquo;s Encrypt, and you may have multiple accounts configured if you run ACME clients on multiple servers.
Your account ID is a URL of the form https://acme-v02.api.letsencrypt.org/acme/acct/12345678.
If you&rsquo;re using Certbot and you&rsquo;re running version 1."""
full_description = "When reporting issues it can be useful to provide your Let’s Encrypt account ID. Most of the time, the process of creating an account is handled automatically by the ACME client software you use to talk to Let’s Encrypt, and you may have multiple accounts configured if you run ACME clients on multiple servers. If you’re using Certbot and you’re running version 1.23.0 or newer, you can find your account ID by running the certbot show_account subcommand. If your Certbot is older than 1.23.0, then you can find the account ID by looking at the “uri” field in /etc/letsencrypt/accounts/acme-v02.api.letsencrypt.org/directory/*/regr.json. If you’re using another ACME client, the instructions will be client-dependent. Check your logs for URLs of the form described above. If your ACME client does not record the account ID, you can retrieve it by submitting a new registration request with the same key. See the ACME spec for more details. You can also find the numeric form of your ID in the Boulder-Requester header in the response to each POST your ACME client makes. Let's Encrypt is a free, automated, and open Certificate Authority brought to you by the nonprofit Internet Security Research Group (ISRG). Read all about our nonprofit work this year in our 2024 Annual Report."
