full_description = "Let’s Encrypt là chứng nhận (CA) mở, miễn phí và tự động, hoạt động vì lợi ích cộng đồng. Đây là dịch vụ được cung cấp bởi Internet Security Research Group (ISRG). Chúng tôi cung cấp cho mọi người các chứng chỉ kỹ thuật số họ cần để kích hoạt HTTPS (SSL/TLS) cho các trang web, miễn phí, theo cách thân thiện nhất với người dùng mà chúng tôi có thể. Chúng tôi làm điều này bởi vì chúng tôi muốn tạo ra một trang web an toàn và bảo mật hơn. Bạn có thể đọc đánh giá năm gần đây nhất bằng cách tải về báo cáo hàng năm của chúng tôi. Chúng tôi có một trang với thông tin chi tiết hơn về việc Let’s Encrypt CA hoạt động như thế nào. Let's Encrypt là một chứng nhận mở, miễn phí và tự động được cung cấp bởi tổ chức phi lợi nhuận Internet Security Research Group (ISRG)."
