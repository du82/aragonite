["https://letsencrypt.org/cs/getinvolved"]
title = "Zapojte se -  Let's Encrypt"
description = """
Komunita Vždy nám pomůže, pokud budete odpovídat na dotazy na komunitní podpoře Let&rsquo;s Encrypt. Podívejte se na tento blog post, proč jsou komunitní příspěvky na podpoře tak důležité.
Kód Hodí se nám také pomoc s vývojem softwaru. Veškerý náš kód je na GitHubu.
Klientský software Certbot je nástroj napsaný v Pythonu, který pracuje společně s vaším webovým serverem a automaticky získává certifikát a převádí webové stránky na protokol HTTPS. Certbot je klient, který pro začáteik doporučujeme většině lidí."""
full_description = "Vždy nám pomůže, pokud budete odpovídat na dotazy na komunitní podpoře Let’s Encrypt. Podívejte se na tento blog post, proč jsou komunitní příspěvky na podpoře tak důležité. Certbot je nástroj napsaný v Pythonu, který pracuje společně s vaším webovým serverem a automaticky získává certifikát a převádí webové stránky na protokol HTTPS. Certbot je klient, který pro začáteik doporučujeme většině lidí. K dispozici je mnoho dalších klientů třetích stran. Boulder je implementace certifikační autority Let’s Encrypt. Je založena na protokolu ACME a napsána prvotně v Go. Skvělým místem, kde začít, je seznam issues ‘help wanted’ a příručka pro přispěvatele. Let's Encrypt je bezplatná, automatizovaná a otevřená certifikační autorita, kterou vám přináší nezisková organizace Internet Security Research Group (ISRG). Vše o naší letošní neziskové práci si můžete přečíst v naší výroční zprávě za rok 2024."
