["https://letsencrypt.org/da/getting-started"]
title = "Kom godt i gang -  Let's Encrypt"
description = """
Let&rsquo;s Encrypt udstedelsescertifikater via et automatisk API baseret på ACME-protokollen.
For at kunne interagere med Let&rsquo;s Encrypts API og få et certifikat, er et stykke software kaldet en &ldquo;ACME-klient&rdquo; nødvendig. Ingen del af processen for at få et certifikat sker på denne hjemmeside, som er blot informativ.
Det første spørgsmål, der skal besvares for folk, der ønsker at komme i gang med Let&rsquo;s Encrypt, er: vil min værtsudbyder få og administrere certifikater fra Let&rsquo;s Encrypt for mig, eller skal jeg selv køre en ACME-klient?"""
full_description = "For at kunne interagere med Let’s Encrypts API og få et certifikat, er et stykke software kaldet en “ACME-klient” nødvendig. Ingen del af processen for at få et certifikat sker på denne hjemmeside, som er blot informativ. Det første spørgsmål, der skal besvares for folk, der ønsker at komme i gang med Let’s Encrypt, er: vil min værtsudbyder få og administrere certifikater fra Let’s Encrypt for mig, eller skal jeg selv køre en ACME-klient? For mange mennesker, deres hosting udbyder vil få og administrere certifikater fra Let’s Encrypt for dem. Hvis dette er din situation, vil din udbyder håndtere en ACME-klient, og du behøver ikke selv at tænke på at få eller håndtere ACME-klientsoftware. Hvis din udbyder får og administrerer certifikater for dig, det vil enten ske automatisk, eller der vil være en konfigurationsmulighed, som du bliver nødt til at aktivere. Tjek din udbyders dokumentation og konfigurationsmuligheder. Hvis din værtsudbyder ikke håndterer at få og administrere certifikater til dig, og hvis du har mulighed for at køre kommandoer på din server med tilstrækkelige privilegier, du kan vælge en ACME-klient og køre det selv for at få certifikater fra Let’s Encrypt. For de fleste mennesker anbefaler vi Certbot ACME-klient. Certbots hjemmeside har fremragende dokumentation og instruktioner til driften af Certbot. Der er mange flere muligheder for ACME-klientsoftware, hvis Certbot af en eller anden grund ikke opfylder dine behov. Hvis du har spørgsmål om at vælge en ACME-klient, eller om at bruge en bestemt klient, eller noget andet relateret til Lad os Kryptere, prøv venligst vores nyttige fora. Let's Encrypt er en gratis, automatiseret og åben certifikatmyndighed bragt til dig af non-profit Internet Security Research Group (ISRG). Læs alt om vores non-profit arbejde i år i vores 2024 Årsrapport."
year_published = 2025
