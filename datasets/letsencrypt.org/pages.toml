["https://letsencrypt.org/cs/donate"]
title = "Přispět -  Let's Encrypt"
description = "Jste organizace a chcete podpořit naši práci? Možná je pro vás vhodnější stát se sponzorem. Zjistěte více. Umožňujeme všem využívat bezpečný web, který respektuje soukromí. Usnadňujeme získání certifikátů pro HTTPS, protože pro přijetí je klíčové, aby je šlo snadno získat. Certifikáty poskytujeme zdarma, protože náklady lidi odrazují. Naše certifikáty jsou dostupné ve všech zemích světa, protože bezpečný web je pro každého. Snažíme se být otevření a transparentní, protože tyto hodnoty jsou pro důvěru zásadní."
full_description = "Jste organizace a chcete podpořit naši práci? Možná je pro vás vhodnější stát se sponzorem. Zjistěte více. Umožňujeme všem využívat bezpečný web, který respektuje soukromí. Usnadňujeme získání certifikátů pro HTTPS, protože pro přijetí je klíčové, aby je šlo snadno získat. Certifikáty poskytujeme zdarma, protože náklady lidi odrazují. Naše certifikáty jsou dostupné ve všech zemích světa, protože bezpečný web je pro každého. Snažíme se být otevření a transparentní, protože tyto hodnoty jsou pro důvěru zásadní. Zhodnocené cenné papíry nebo akcie podílových fondů, které vlastníte déle než jeden rok, mohou být vynikajícím charitativním darem. Pokud převádíte cenné papíry, informujte nás prosím na adrese sponsor@abetterinternet.org. Pomůže, když také pošlete e-mailem pověřovací dopis od svého makléře. Doporučte dar skupině Internet Security Research Group (naší mateřské organizaci) ze svého dárcovského fondu. 100% vašeho daru půjde na podporu bezpečného internetu, který respektuje soukromí. Mnoho organizací dorovnává dary neziskovým organizacím od zaměstnanců. Zjistěte, zda vaše organizace nemá dorovnávací program, a zdvojnásobte rozsah svého daru! Za Let's Encrypt stojí Internet Security Research Group, veřejně prospěšná organizace podle paragrafu 501(c)(3). Naše identifikační číslo EIN je: 46-3344200. Let's Encrypt je bezplatná, automatizovaná a otevřená certifikační autorita, kterou vám přináší nezisková organizace Internet Security Research Group (ISRG). Vše o naší letošní neziskové práci si můžete přečíst v naší výroční zprávě za rok 2024."
