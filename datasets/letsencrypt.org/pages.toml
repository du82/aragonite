title = "Donér -  Let's Encrypt"
description = "Er du fra en organisation, der ønsker at støtter vores arbejde? At blive en sponsor kan være en bedre egnet for dig. Læs mere. Vi gør det muligt for alle at opleve et internet, der er sikkert og med respekt for privatlivets fred. Vi gør det enkelt at få certifikater til HTTPS gennem brugervenlig adgang er afgørende for udbredelsen. Vi leverer certifikater gratis, fordi omkostningerne udelukker personer. Vores certifikater er tilgængelige i alle lande i verden, fordi et sikkert Web er for alle."
full_description = "Er du fra en organisation, der ønsker at støtter vores arbejde? At blive en sponsor kan være en bedre egnet for dig. Læs mere. Vi gør det muligt for alle at opleve et internet, der er sikkert og med respekt for privatlivets fred. Vi gør det enkelt at få certifikater til HTTPS gennem brugervenlig adgang er afgørende for udbredelsen. Vi leverer certifikater gratis, fordi omkostningerne udelukker personer. Vores certifikater er tilgængelige i alle lande i verden, fordi et sikkert Web er for alle. Vi stræber efter at være åbne og gennemsigtige, fordi disse værdier er afgørende for tillid. Værdsatte værdipapirer eller andele i investeringsforeninger, som du har ejet i mere end et år, kan være fremragende velgørende gaver. Lad os venligst vide, om du overfører værdipapirer på sponsor@abetterinternet.org. Du vil muligvis også ønske at e-maile brevet af autorisation fra din mægler. Anbefal en donation til Internet Security Research Group (vores forælder org) fra din gavefond. 100% af din donation vil gå til at støtte en sikker og beskyttelse af privatlivets fred på internettet. Mange organisationer matcher donationer til nonprofit foretaget af medarbejdere. Tjek om din organisation har et matchende program, der kan fordoble din donation! Internet Security Research Group er den offentlige almennyttige organisation 501(c)(3) bag Let's Encrypt. Vores EIN-kode er: 46-3344200. Let's Encrypt er en gratis, automatiseret og åben certifikatmyndighed bragt til dig af non-profit Internet Security Research Group (ISRG). Læs alt om vores non-profit arbejde i år i vores 2024 Årsrapport."
