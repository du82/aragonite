["https://letsencrypt.org/docs/certificate-compatibility"]
title = "Certificate Compatibility -  Let's Encrypt"
description = "The determining factor for whether a platform can validate Let&rsquo;s Encrypt certificates is whether that platform trusts ISRG&rsquo;s &ldquo;ISRG Root X1&rdquo; or &ldquo;ISRG Root X2&rdquo; certificates. Both of these roots have been included in platform trust stores for several years now (ISRG Root X1 since late 2016, ISRG Root X2 since mid 2022), but it can take much longer for platform updates to be widely installed. Today, trust in ISRG Root X1 is nearly ubiquitous, while trust in ISRG Root X2 is still propagating."
full_description = "The determining factor for whether a platform can validate Let’s Encrypt certificates is whether that platform trusts ISRG’s “ISRG Root X1” or “ISRG Root X2” certificates. Both of these roots have been included in platform trust stores for several years now (ISRG Root X1 since late 2016, ISRG Root X2 since mid 2022), but it can take much longer for platform updates to be widely installed. Today, trust in ISRG Root X1 is nearly ubiquitous, while trust in ISRG Root X2 is still propagating. If your certificate validates on some of the “Known Compatible” platforms but not others, the problem may be a web server misconfiguration. If you’re having an issue with modern platforms, the most common cause is failure to provide the correct certificate chain. Test your site with SSL Labs’ Server Test. If that doesn’t identify the problem, ask for help in our Community Forums. If your platform is not listed here, we appreciate pull requests that include documentation of when each root was added to that platform’s trust store. In addition, all platforms which trust ISRG Root X1 also trust the cross-signed version of ISRG Root X2. Let's Encrypt is a free, automated, and open Certificate Authority brought to you by the nonprofit Internet Security Research Group (ISRG). Read all about our nonprofit work this year in our 2024 Annual Report."
year_published = 2025
year_updated = 2025
