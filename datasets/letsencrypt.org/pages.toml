full_description = "Let’s Encrypt je bezplatná, automatizovaná a otevřená certifikační autorita (CA), která je provozována pro veřejnost. Jedná se o službu poskytovanou Internet Security Research Group(ISRG). Poskytujeme lidem digitální certifikáty, které potřebují k zapnutí protokolu HTTPS (SSL/TLS) pro webové stránky, a to zdarma a uživatelsky nejpřívětivějším možným způsobem. Děláme to proto, že chceme, aby web byl bezpečnější a respektoval soukromí. O našem posledním roce si můžete přečíst v přehledu, který si stáhnete z naší výroční zprávy. Let's Encrypt je bezplatná, automatizovaná a otevřená certifikační autorita, kterou vám přináší nezisková organizace Internet Security Research Group (ISRG). Vše o naší letošní neziskové práci si můžete přečíst v naší výroční zprávě za rok 2024."
