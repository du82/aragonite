["https://letsencrypt.org/zh-tw/about"]
title = "關於 Let's Encrypt -  Let's Encrypt - 免費的 SSL/TLS 憑證"
description = """
Let&rsquo;s Encrypt 是一個免費、自動化、開放，為了公眾利益而運作的憑證頒發機構 (Certificate Authority, CA)。它是由 Internet Security Research Group (ISRG) 所提供的服務。
為了建立一個更加安全；更尊重隱私的網際網路，我們免費提供用戶數位憑證，並以最友善的方式替網站啟用 HTTPS (SSL/TLS)。
Let&rsquo;s Encrypt 的基本原則為：
免費: 任何擁有網域名稱的人都可以免費使用 Let&rsquo;s Encrypt 取得可信任的憑證。 自動化: 運行於網頁伺服器上的程式可以透過與 Let&rsquo;s Encrypt 溝通，輕鬆地獲取憑證，安全地設定並使用它，並且自動進行憑證更新。 安全: Let&rsquo;s Encrypt 將是推動 TLS 安全的最佳平台，無論是在 CA 方面，還是幫助網站營運者正確地保護他們的伺服器。 透明: 公開記錄所有頒發或註銷的憑證，供任何人查閱。 公開: 公開自動頒發和更新協議，作為他人可以使用的開放標準。 合作: Let&rsquo;s Encrypt 是一個為了網路社群利益所做的共同努力，就像網路底層協議一樣，不受任何單一組織的控制。 請訪問此頁面以取得更多關於 Let&rsquo;s Encrypt CA 工作方式的詳細資訊"""
