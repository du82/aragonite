full_description = "Let’s Encrypt היא רשות אישורים (CA) חינמית, אוטומטית ופתוחה שמופעלת לרווחת הציבור הרחב. שירות זה מסופק על ידי Internet Security Research Group (ISRG). אנו מעניקים לאנשים את האישורים הדיגיטליים הדרושים להם כדי להפעיל HTTPS‏ (SSL/TLS) לאתרים שלהם, בחינם, בצורה הכי ידידותית שאנחנו יכולים. אנו עושים זאת כיוון שאנו מעוניינים לקדם את האבטחה והפרטיות ברשת האינטרנט. ניתן לקרוא סקירה על השנה האחרונה שלנו על ידי הורדת הדוח השנתי שלנו. יש לנו עמוד עם פירוט רב יותר בנוגע לאיך עובדת רשות האישורים ‎(CA) ‏Let’s Encrypt. Let's Encrypt היא רשות אישורים חופשית, אוטומטית ופתוחה שמוגשת לך באדיבות קבוצת מחקר אבטחת האינטרנט (ISRG). למידע נוסף על הפעילות שאנו עושים ללא מטרות רווח ניתן לקרוא את דוח שנת 2024."
