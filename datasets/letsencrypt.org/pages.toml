["https://letsencrypt.org/2025/01/09/acme-profiles"]
title = "Announcing Certificate Profile Selection -  Let's Encrypt"
description = """
We are excited to announce a new extension to Let&rsquo;s Encrypt&rsquo;s implementation of the ACME protocol that we are calling &ldquo;profile selection.&rdquo; This new feature will allow site operators and ACME clients to opt in to the next evolution of Let&rsquo;s Encrypt.
As of today, the staging environment is advertising a new field in its directory resource:
GET /directory HTTP/1.1 HTTP/1.1 200 OK Content-Type: application/json { ... &#34;meta&#34;: { &#34;profiles&#34;: { &#34;classic&#34;: &#34;The same profile you&#39;re accustomed to&#34;, &#34;tlsserver&#34;: &#34;https://letsencrypt."""
full_description = '''We are excited to announce a new extension to Let’s Encrypt’s implementation of the ACME protocol that we are calling “profile selection.” This new feature will allow site operators and ACME clients to opt in to the next evolution of Let’s Encrypt. As of today, the staging environment is advertising a new field in its directory resource: GET /directory HTTP/1.1 HTTP/1.1 200 OK Content-Type: application/json { ... "meta": { "profiles": { "classic": "The same profile you're accustomed to", "tlsserver": "https://letsencrypt.org/2025/01/09/acme-profiles/" } } } Here, the keys are the names of new “profiles”, and the values are human-readable descriptions of those profiles. A profile describes a collection of attributes about the certificate that will be issued, such as what extensions it will contain, how long it will be valid for, and more. For example, the “classic” profile is exactly what it sounds like: certificates issued under the classic profile will look exactly the same as those that we have always issued, valid for 90 days. But certificates issued under the “tlsserver” profile will have a number of differences tailored specifically towards TLS server usage: No Common Name field (including a CN has been NOT RECOMMENDED by the Baseline Requirements for several years now) No Subject Key Identifier (including a SKID is NOT RECOMMENDED by the Baseline Requirements) No TLS Client Auth Extended Key Usage (root programs are moving towards requiring “single-purpose” issuance hierarchies, where every certificate has only a single EKU) No Key Encipherment Key Usage for certificates with RSA public keys (this KU was used by older RSA-based TLS cipher suites, but is fully unnecessary in TLS 1.3) Additionally, in the near future we will offer a “shortlived” profile which will be identical to the “tlsserver” profile but with a validity period of only 6 days. This profile isn’t available in Staging just yet, so keep an eye out for further announcements regarding short-lived certificates and why we think they’re exciting. An ACME client can supply a desired profile name in a new-order request: POST /acme/new-order HTTP/1.1 Host: example.com Content-Type: application/jose+json { "protected": base64url(...), "payload": base64url({ "profile": "tlsserver", "identifiers": [ { "type": "dns", "value": "www.example.org" }, { "type": "dns", "value": "example.org" } ], }), "signature": "H6ZXtGjTZyUnPeKn...wEA4TklBdh3e454g" } If the new-order request is accepted, then the selected profile name will be reflected in the Order object when it is returned, and the resulting certificate after finalization will be issued with the selected profile. If the new-order request does not specify a profile, then the server will select one for it. Guidance for ACME clients and users If you are an ACME client author, we encourage you to introduce support for this new field in your client. Start by taking a look at the draft specification in the IETF ACME Working Group. A simple implementation might allow the user to configure a static profile name and include that name in all new-order requests. For a better user experience, check the configured name against the list of profiles advertised in the directory, to ensure that changes to the available profiles don’t result in invalid new-order requests. For clients with a user interface, such as a control panel or interactive command line interface, an implementation could fetch the list of profiles and their descriptions to prompt the user to select one on first run. It could also use a notification mechanism to inform the user of changes to the list of available profiles. We’d also love to hear from you about your experience implementing and deploying this new extension. If you are a site operator or ACME client user, we encourage you to keep an eye on your ACME client of choice to see when they adopt this new feature, and update your client when they do. We also encourage you to try out the modern “tlsserver” profile in Staging, and let us know what you think of the changes we’ve made to the certificates issued under that profile. What’s next? Obviously there is more work to be done here. The draft standard will go through multiple rounds of review and tweaks before becoming an IETF RFC, and our implementation will evolve along with it if necessary. Over the coming weeks and months we will also be providing more information about when we enable profile selection in our production environment, and what our production profile options will be. Thank you for coming along with us on this journey into the future of the Web PKI. We look forward to your testing and feedback!'''
year_published = 2025
clearnet = "https://letsencrypt.org/2025/01/09/acme-profiles"
