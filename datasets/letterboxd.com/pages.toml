title = "‎THE OTHER HALF OF THE SKY: A CHINA MEMOIR – AFI Catalog Spotlight, a story by AFI • Letterboxd"
description = "Looking for a new film or TV series to watch? Check out these projects by Alumni from the AFI Conservatory film school."
full_description = "THE OTHER HALF OF THE SKY: A CHINA MEMOIR – AFI Catalog Spotlight 2025-03-01T18:00:00.713Z In celebration of Women’s History Month, the AFI Catalog shines a spotlight on the Oscar®-nominated documentary THE OTHER HALF OF THE SKY: A CHINA MEMOIR, which was released 50 years ago this March. Co-directed and co-produced by AFI Life Achievement Award recipient Shirley MacLaine and feminist filmmaker Claudia Weill, THE OTHER HALF OF THE SKY follows MacLaine and a delegation of 11 women as they visit China in 1973, shortly after the Communist Chinese government led by Chairman Mao Zedong opened its borders to the U.S. (The title itself is adapted from an adage by Mao who referred to women as “holding up the other half of the sky.”[i])According to MacLaine’s autobiography, “You Can Get There from Here” (1975), concepts for the project began in October 1971. At that time, members of the Permanent Mission to the United Nations of the People’s Republic of China, including one of its foreign ministers Chiao Kuan-Hua, visited New York, and MacLaine was welcomed to a luncheon in their honor by Iran’s Princess Ashraf Pahlavi. The three-hour conversation was not political, focusing instead on universal human capacities for development and change, and by the end of the event, Chiao invited MacLaine to his country, as he believed it was “very important for the American people to understand China.”[ii] MacLaine also noted in her autobiography that Chiao appreciated the significance of Hollywood performers and writers in “influencing masses of people and public opinion.”[iii]Read more at AFI.com/news. Older What to Watch - March 2025 | AFI Alumni Projects Looking for a new film or TV series to watch? Check out these projects by Alumni from the AFI Conservatory film school. Read Story Edit or delete story… Backstage Share Copy URL to Clipboard Tweet a link Share to Facebook What to Watch - March 2025 | AFI Alumni Projects Looking for a new film or TV series to watch?