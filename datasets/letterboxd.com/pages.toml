["https://letterboxd.com/de_cinema/story/de-cinema-spotlight-on-womxn-directors"]
title = "‎DE CINEMA | SPOTLIGHT ON WOMXN DIRECTORS, a story by De Cinema • Letterboxd"
description = "“Show, don’t tell.” The first lesson screenwriters get taught. Nonetheless, countless filmmakers resist this idea. And that's a good thing. Look at mumblecore, the independent film wave that 'originated' twenty years ago at the South by Southwest festival. But before intimate, often cheaply made indie films like HANNAH TAKES THE STAIRS portrayed talkative millennials with chronic unhappiness, there were artists who wanted to eavesdrop on daily dialogues and meandering conversations than tell stories with visual ingenuity. Look at how filmmakers like Éric…"
full_description = "DE CINEMA | SPOTLIGHT ON WOMXN DIRECTORS 2025-03-01T08:00:04.210Z In honour of International Women's Day on 8 March, De Cinema presents the second edition of SPOTLIGHT ON WOMXN DIRECTORS. From 8 March until 8 April 2025, we spotlight female filmmakers and directors who identify as women. We want to break the dominance of white, male voices in the film canon with films offering new perspectives and thereby pleading for more equality, visibility, and recognition for female directors.Full programme and ticketsWomen directors are often overlooked. Last year, we gave the floor to the works of Dorothy Arzner, a pioneer who made films in the 1930s and 40s about female autonomy and self-expression, but who was often ignored by the industry. This year, we present the works of MURIEL BOX, whose films from the 1940s and 50s offered socially relevant themes as well as entertainment, but which after time got lost in obscurity. Similarly, groundbreaking directors like Bridgett M. Davis with NAKED ACTS and Cheryl Dunye with THE WATERMELON WOMAN were pushed more and more to the background. We also do a retrospective on the works of ANDREA ARNOLD, one of Great Britain's most renowned filmmakers known for her socially-realistic style.Today, only 21% of films made worldwide are directed by women, and in Flanders 28%. Despite their huge contributions to the film industry, female directors often don't get the recognition they deserve. Since the founding of the Oscars in 1929, only two women – Kathryn Bigelow and Chloé Zhao– have won the prize for Best Director. This recently became even more clear at the Flemish Ensors, where not a single woman received a prize.SPOTLIGHT ON WOMXN DIRECTORS is a call for change and a chance to discover the works of female directors which not only transform the film industry but how we look at the world. The future of cinema is diverse – and starts here.The programme features the following films:Nadine Labaki's CARAMEL (2007), ET MAINTENANT ON VA OÙ? (2011) and CAPERNAUM (2018).Andrea Arnold's RED ROAD (2006), FISH TANK (2009), WUTHERING HEIGHTS (2011), AMERICAN HONEY (2016), COW (2021) and BIRD (2024).Chantal Akerman's GOLDEN EIGHTIES (1986), J'AI FAIM, J'AI FROID (1984) and JE, TU, IL, ELLE (1974).Debra Granik's WINTER'S BONE (2010) and LEAVE NO TRACE (2018).Muriel Box's THE TRUTH ABOUT WOMEN (1957), RATTLE OF A SIMPLE MAN (1964), THE PASSIONATE STRANGER (1957) and SIMON AND LAURA (1955) in our matinees.As well as THE MURDER OF MR. DEVIL (1970), SOMETHING DIFFERENT (1963), SHE-DEVIL (1989), LITTLE (2019), NAKED ACTS (1996), THE WATERMELON WOMAN (1996), TOMBOY (2011), LES FEMMES AU BALCON (2024), HOW TO HAVE SEX (2023), LINGUA FRANCA (2019), POLITE SOCIETY (2023) as kick-off for our upcoming (S)HEROES programme, PARIAH (2011), L'UNE CHANTE, L'AUTRE PAS (1977) and a collection of Lotte Reiniger's fairy tale films with live musical accompaniment.And, last but not least, documentaries BLACK BOX DIARIES (2024), LES DAMES BLANCHES (2024), SHAKEDOWN (2018), CARNOTSTRAAT 17 (2015) and UNE FEMME QUI PART (2025).Trailer by Jasper Loos Older DE CINEMA | MUMBLECORE: CASUAL CONVERSATIONS “Show, don’t tell.” The first lesson screenwriters get taught. Nonetheless, countless filmmakers resist this idea. And that's a good thing. Look at mumblecore, the independent film wave that 'originated' twenty years ago at the South by Southwest festival. But before intimate, often cheaply made indie films like HANNAH TAKES THE STAIRS portrayed talkative millennials with chronic unhappiness, there were artists who wanted to eavesdrop on daily dialogues and meandering conversations than tell stories with visual ingenuity. Look at how filmmakers like Éric… Read Story Edit or delete story… Backstage Share Copy URL to Clipboard Tweet a link Share to Facebook In this Story"
