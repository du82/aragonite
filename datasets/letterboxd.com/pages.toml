full_description = "THE OTHER HALF OF THE SKY: A CHINA MEMOIR – AFI Catalog Spotlight In celebration of Women’s History Month, the AFI Catalog shines a spotlight on the Oscar®-nominated documentary THE OTHER HALF OF THE SKY: A CHINA MEMOIR, which was released 50 years ago this March. Co-directed and co-produced by AFI Life Achievement Award recipient Shirley MacLaine and feminist filmmaker Claudia Weill, THE OTHER HALF OF THE SKY follows MacLaine and a delegation of 11 women as they visit China in 1973, shortly after the Communist Chinese government led by Chairman Mao Zedong… Read Story What to Watch - March 2025 | AFI Alumni Projects Looking for a new film or TV series to watch? Check out these projects by Alumni from the AFI Conservatory film school. Read Story 2025 Hollywood Guild Awards Honor AFI Conservatory Alumni As awards season comes to a close, it’s the perfect moment to reflect on the projects nominated by the major Hollywood guilds, recognizing the year’s top achievements in film and television. Join us in congratulating the exceptional graduates of the AFI Conservatory, whose outstanding creative work has earned well-deserved recognition from their peers. Check out the AFI Conservatory Alumni who were nominated and won guild awards this year. Read Story AFI Announces DWW+ Class of 2026 and Names Marie Jamora as Guest Artistic Director for New Cohort Today, AFI announced the eight directors selected for this year’s edition of the prestigious AFI DWW+ directing program. Read Story AFI AWARDS Celebrates the 2024 Honorees Today, AFI honored the 2024 AFI AWARDS recipients, bringing together the creative community to shine a light on excellence in the art of the moving image. Held at the Four Seasons Hotel Los Angeles at Beverly Hills, AFI AWARDS is the only national program that honors creative teams as a whole, recognizing the collaborative nature of the work by embracing those in front of and behind the camera. Read Story What to Watch: February 2025 | AFI Conservatory Alumni Projects Looking for a new film or TV series to watch? Check out these projects by Alumni from the AFI Conservatory film school. Read Story"
