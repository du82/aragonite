full_description = "Announcing our first 2025 Prize Sponsors! 2025-03-01T23:06:38.386Z Hi Everyone!As the year races past, we are quickly approaching our early bird deadline on April 1st.However, if you are still brainstorming, writing, shooting or editing, don’t worry! There is still plenty of time to make your film. Central Coast Film Festival has several mini-milestone deadlines throughout the year before we close entries on September 1st. While submission will be slightly cheaper the earlier you submit, we are also offering FilmFreeway Gold subscribers 10% off.Our team is hard at work preparing this year’s festival and we are excited to announce the first official prize sponsors for our 2025.AvidAVID is not just the industry standard software for video editing, it has unmatched speed and stability to enable your creative freedom. Whether you are a seasoned pro, or a beginner, it’s never to late to start your AVID journey.AVID is offering our Best Editing winner a 12-month-subscription to Media Composer Ultimate & ProTools Ultimate.Fade inUsed by the writing teams behind Knives Out, Rogue One & The Last of Us, Fade In is the perfect software to get writing. Download the free trial now to experience its effortless formatting, scene organisation and character tracking.Fade In is awarding the best writer at our 2025 festival a free copy of the full software. Edit or delete story… Backstage Share Copy URL to Clipboard Tweet a link Share to Facebook"
