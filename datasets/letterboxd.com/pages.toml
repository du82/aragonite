full_description = "Maart Bij Concordia In de maand maart kun je je weer helemaal onderdompelen in de beste films bij Concordia. We trappen de maand af met de sci-fi thriller Rise of the Planet of the Apes, waarin het testen van een Alzheimer-medicijn ervoor zorgt dat apen ineens hyperintelligentie ontwikkelen en in opstand komen, daarnaast zit deze maand ook weer boordevol geweldige specials! Read Story Met Concordia naar IFFR 2025! Van 30 januari t/m 9 februari 2025 vond de 54ste editie van het Internationale Film Festival Rotterdam (IFFR) plaats, en wij waren weer van de partij! Read Story In februari bij Concordia! In de maand februari kun jij weer volop genieten van de beste films bij ons. Naast Luis Buñuels surrealistische klassieker Belle de Jour, over een jonge huisvrouw die besluit haar doordeweekse middagen als prostituee door te brengen, zit deze maand ook weer ramvol met de beste specials! Read Story Nightcrawler: Duisternis in L.A. Ga mee op een intense rit door de neonverlichte straten van Los Angeles! Op dinsdag 25 februari vertoont Cinema Unfiltered de psychologische thriller Nightcrawler (2014). Deze duistere film van regisseur Dan Gilroy grijpt je vanaf de eerste minuut. Het is een must-see voor filmliefhebbers die houden van verhalen die zowel ongemakkelijk als fascinerend zijn. De film verkent de schaduwkant van ambitie en de sensatiebeluste mediawereld. Read Story 2025 Oscarfilms bij Concordia! De Oscarnominaties zijn bekend gemaakt! De beste films, de meest indrukwekkende performances en de meest baanbrekende verhalen strijden om de felbegeerde gouden beeldjes. Read Story The Big Lebowski: Absurd, hilarisch en onvergetelijk “Take it easy, man.” Na het kijken van The Big Lebowski is dit niet zomaar meer een quote, maar jouw nieuwe levensstijl! Op dinsdag 21 januari draait deze legendarische cultklassieker van de Coen Brothers bij Cinema Unfiltered. The Big Lebowski (1998) is een mix van komedie, mysterie en totale absurditeit. Maar wat maakt deze film zo onvergetelijk? Read Story"
