["https://letterboxd.com/concordia053/story/maart-bij-concordia"]
title = "‎Maart Bij Concordia, a story by Concordia053 • Letterboxd"
description = "Van 30 januari t/m 9 februari 2025 vond de 54ste editie van het Internationale Film Festival Rotterdam (IFFR) plaats, en wij waren weer van de partij!"
full_description = "Maart Bij Concordia 2025-03-01T11:00:03.798Z In de maand maart kun je je weer helemaal onderdompelen in de beste films bij Concordia. We trappen de maand af met de sci-fi thriller Rise of the Planet of the Apes, waarin het testen van een Alzheimer-medicijn ervoor zorgt dat apen ineens hyperintelligentie ontwikkelen en in opstand komen, daarnaast zit deze maand ook weer boordevol geweldige specials!SpecialsIn onze specials-reeksen kun je op 11 maart de klassieker Fucking Åmål bekijken als onderdeel van onze reeks Movies with Pride. Het verhaal gaat over heftige verlangens, gierende hormonen en een bloeiende lesbische liefde in het dorpje Åmål, waar homoseksualiteit de wenkbrauwen doet fronsen.Op 17 maart vertonen we het historische afscheidsconcert van The Band, vastgelegd door Martin Scorsese in The Last Waltz. Op 24 maart ga je terug de middeleeuwen in tijdens Zien & Geloven met de komedie Il Decameron, gebaseerd op de seksueel geladen verhalen van de Italiaanse schrijver/dichter Giovanni Boccaccio (1313-1375).Derek Zoolander staat op het punt om alles te verliezen, wanneer zijn titel als de nummer één mannelijke model bedreigt wordt door de opkomende ster Hansel. Een verhaal over fashion, nieuwe vriendschappen en een complot theorie op de premier van Malesië in de really, really, really ridiculously good movie Zoolander op 25 maart. En op 31 maart starten we de reeks boek & film met de eeuwen oude liefdes tragedie Romeo + Juliet ... maar dan uit 1996. De film laat het verhaal zien van een verboden liefde tussen Romeo en Juliet en hoe hun familie er alles aan doet om ze uit elkaar te houden, wat lastiger gezegd is dan gedaan. Tijdens boek & film staat Janneke Blenke stil bij de schrijvers en hun verhaal en hoe de filmmakers dit vertalen. Een unieke ervaring voor zowel boekliefhebbers en filmliefhebbers! Daarnaast gaan onder andere deze films in première: • Hard Truths | Vanaf 6 maart • September 5 | Vanaf 6 maart • I’m Still Here | Vanaf 13 maart • En Fanfare | Vanaf 13 maart • Memoir of a Snail | Vanaf 13 maart • Vermiglio | Vanaf 20 maart • De Propagandist | Vanaf 28 maart﻿De hele agenda bekijken? Bekijk onze website! Older Met Concordia naar IFFR 2025! Van 30 januari t/m 9 februari 2025 vond de 54ste editie van het Internationale Film Festival Rotterdam (IFFR) plaats, en wij waren weer van de partij! Read Story Edit or delete story… Backstage Share Copy URL to Clipboard Tweet a link Share to Facebook"
