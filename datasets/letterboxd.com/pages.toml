description = "De Cinema uses Letterboxd to share film news, lists and more. Bio: CELEBRATING CINEMA | Independent Antwerp film theatre De Cinema treats film lovers with an extensive programme. Come and dive into film history and actuality on the big screen."
full_description = '''DE CINEMA | SPOTLIGHT ON WOMXN DIRECTORS In honour of International Women's Day on 8 March, De Cinema presents the second edition of SPOTLIGHT ON WOMXN DIRECTORS. From 8 March until 8 April 2025, we spotlight female filmmakers and directors who identify as women. We want to break the dominance of white, male voices in the film canon with films offering new perspectives and thereby pleading for more equality, visibility, and recognition for female directors. Read Story DE CINEMA | MUMBLECORE: CASUAL CONVERSATIONS “Show, don’t tell.” The first lesson screenwriters get taught. Nonetheless, countless filmmakers resist this idea. And that's a good thing. Look at mumblecore, the independent film wave that 'originated' twenty years ago at the South by Southwest festival. But before intimate, often cheaply made indie films like HANNAH TAKES THE STAIRS portrayed talkative millennials with chronic unhappiness, there were artists who wanted to eavesdrop on daily dialogues and meandering conversations than tell stories with visual ingenuity. Look at how filmmakers like Éric… Read Story DE CINEMA | SWEET DREAMS, DAVID LYNCH “Where we’re from, the birds sing a pretty song... and there’s always music in the air.” Read Story DE CINEMA | UNBOUND SELVES: QUEER VOICES For decades, queer voices have been excluded from mainstream media, and even today, their cinematic representation is limited or often too one-sided. Following last fall's (R)EVOLUTION programme on the camera as a weapon of resistance, our new series, UNBOUND SELVES: QUEER VOICES, explores the power of unbound self-expression on the silver screen. The struggle for recognition on and off screen has shaped LGBTQIA+ history. This programme collects several cinematic highlights illuminating the liberating power of honest representation, both in arthouse… Read Story DE CINEMA | ROBBY MÜLLER: COMPAGNON DE ROUTE "I was always fascinated by stories that said something about life", said Robby Müller during a masterclass in 1994. "The consequence was: I had to find directors and stories that made sense to me. Who also enriched my life. Who made me think about life." For such inspiring collaborations, the Dutch cameraman had been looking for his entire career, and he happily found them with the likes of Wim Wenders, Jim Jarmusch and Lars von Trier. Together they went on… Read Story'''
