["https://www.lettoysbetoys.org.uk/only-girls-have-eyelashes-how-and-why-cartoon-characters-are-coded-female"]
title = "'Only girls have eyelashes': how and why cartoon characters are coded female - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "10th February 2023 Children’s media consultant and Let Toys Be Toys campaigner Olivia Dickinson finds out how and why cartoon characters are ‘coded female’. How long are your son’s eyelashes? I know it’s not a question you often get asked, but it’s something I notice about boy babies and little boys. A good friend has three boys under 10, all of whom have the longest sweeping eyelashes ever. Never been accentuated with any mascara, but there they are, practically brushing the tips of their noses, and often commented on by her friends when she posts photos on social media. My own son has quite long eyelashes and I know plenty of other boys with long eyelashes. ‘Boys don’t have eyelashes’ Beth Cox on Instagram, September 2020 However, if you only understood male and female characteristics from cartoons you would think that boys – and men – do not have eyelashes. Not that they don’t have long sweeping ones, but that they don’t have any. Have a think about the cartoons you watch or used to watch with your children. Do any of the male characters have eyelashes? Obviously, humans need eyelashes. They have a functional purpose, and they don’t need to be extra long to be keep dust or dirt out of your eyes. And all children need them. So how have we ended up with boys like Beth Cox’s son saying that boys don’t have eyelashes? Eyelashes are one of the ways that illustrators and animators use to ‘code’ that a character is female. Beth, who is an Inclusion & Equality Consultant for children’s books, explains: “creators want to show they are representing girls, so to ensure characters aren’t perceived as boys, they tend to code them. Where coding is necessary, it can be subtle, with just one or two codes used, and not on every character.” Bluey This is helpful, and makes me look again at different animated characters. I’ve started to get ridiculously excited when I find animated female characters without eyelashes. Recent finds have been Moonminmamma and Little My in Moominvalley, Amy in Tom Gates, JoJo and Gran Gran in JoJo and Gran Gran, and Bluey, Bingo and their mum in Bluey. Sarah from Sarah and Duck and Xuli from Go Jetters are examples from my son’s younger years. What other ones can you add? Snufkin, Moominmamma, Snorkmaiden and Moomintroll “Creators want to show they are representing girls, so to ensure characters aren’t perceived as boys, they tend to code them. Where coding is necessary, it can be subtle, with just one or two codes used, and not on every character.” Beth Cox The big question though, is why does there seem to be an unspoken rule that male characters should never have eyelashes? I spoke to Alan Robinson, a designer, animator and showrunner who has most recently worked on School of Roars and Big Cook Little Cook for the BBC. He explained that often animators and illustrators have been taught a particular visual language to distinguish between male and female, or a brand’s style guide uses certain codes to do so, and that ‘language’ and coding is intentionally exaggerated. Why does there seem to be an unspoken rule that male characters should never have eyelashes? He says: “When creating a character, we are manipulating visual traits to help the audience categorise characters in the simplest and quickest way. This is especially important for children so the characters are clear and relatable to them. And this is what leads to some stereotypical representation within their features and accessories.” Peso But does it matter whether a small child knows that a character is the sex intended by the creators? When my son was little, we watched a lot of Octonauts. Peso is the medic, and is a he, but for ages my son thought Peso was female. Was that because Peso is sometimes scared, and is always caring? Or just because he hadn’t thought about it and made an assumption? It’s an interesting assumption to make, according to Beth, as one of the reasons coding is often exaggerated for female characters is because we have all learnt to assume a character is male unless we are told otherwise. This reflects how the most popular picture books are dominated by male protagonists, even those with animals (see The Guardian research of the top 100 illustrated children’s books from 2019 and 2018). Xuli Eyelashes are not the only way to code characters as female: it can also be done through hair, make-up, accessories, clothes, and colours. As Alan says when we discuss Sarah and Duck, Moominvalley, Go Jetters, and JoJo and Gran Gran, “there are other features which could be deemed stereotypical: Moominmamma wears an apron, when Xuli takes off her hood she has a pony tail and fringe, in JoJo and Gran Gran, JoJo has cute bunches. Should these be seen as negative things or just what little girls wear? Do they make the character more appealing because they have these traits?” “There are other features which could be deemed stereotypical: Moominmamma wears an apron, when Xuli takes off her hood she has a pony tail and fringe, in JoJo and Gran Gran, JoJo has cute bunches. Should these be seen as negative things or just what little girls wear? Do they make the character more appealing because they have these traits?” Alan Robinson We have all learnt to assume a character is male unless we are told otherwise Or do they make them more stereotyped? Beth asks, “by helping children to recognise and identify characters, are we making it easier for them to categorise and therefore stereotype others? It’s a problem not that those traits are there, but because they are the only thing we tend to see and we need to see other ways of being a girl/woman/human so that children can understand the world of opportunity.” While long eyelashes have become a persistent signifier of being female, Beth suggests that “we need to consider what messages coding via accessories and make-up gives about the expectations of women and how they should look.” I rarely wear make-up, and yet the animated adult women my son sees frequently have long eyelashes. For some children that is accurate, but that is still only one way to represent being female, and reinforces that make-up is for women only. It is also a particular representation that emphasises appearance and beauty as the most important aspect of being female, something that children are already receiving in other parts of their lives, through toys, adverts and language they hear, and that contributes to girls’ aspirations and self-esteem, as well as to how boys view girls as they grow up. JoJo and Gran Gran From my brief research I have established that some female animated characters are ‘allowed’ to not have accentuated eyelashes or don’t have to wear pink, but it is never the reverse for the male characters. It is still desirable for female characters to look more like a boy, but never the other way round. I asked Alan what would happen if a male character was shown with noticeable eyelashes, or wearing pink? “As with all design, we will gradually evolve away from these [stereotypes] but it will take time and symbolism will always play a part. And if you take eyelashes out of the equation, they will inevitably be replaced with another visual identifier which could be deemed equally stereotypical.” Can animators, illustrators and TV execs use their creativity to show equal gender representation without coding? If part of creating animated characters is to give children something relatable, then it’s even more important not to present very stereotypical notions of girl and boys: most children don’t fit into those narrow boxes. The challenge to animators, TV execs and illustrators is to rethink that visual language and remember those ways of coding are not the only option. Can they use their creativity to show equal gender representation without coding? This article was first published in March 2021 in Sonshine, a magazine about raising boys for a more equal world. Olivia Dickinson is a children’s media consultant and a key member of the Let Toys Be Toys campaign. Find out more about Olivia on LinkedIn and follow her on Twitter @OlivaceousD Share2"
