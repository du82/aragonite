["https://www.lettoysbetoys.org.uk/research/toy-catalogues"]
title = "Toy catalogues research - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "Tracking changing trends in toy catalogues Our research into toy catalogues over two years provides a valuable snapshot of trends in toy marketing in relation to gender stereotyping. Our 2016 research showed that the promotional images used in toy catalogues tended to fall back on the same old tired stereotypes, with only a handful of boys shown with dolls, and girls accounting for just 11% of the children shown with cars or other vehicles. This research looked at six 2016 Christmas toy catalogues (Smyths toys, Argos, Tesco Toys, The Entertainer, Early Learning Centre and Toys R Us) to see what messages children and other shoppers were being offered about boys’ and girls’ play. We found: Only 11% of children playing with cars or other vehicles were girls, and those girls were almost always shown with pink versions of toys. 97% of children playing with guns/weapons and war toys were boys. Only 13% of children playing at ‘caregiving’ activities were boys. Only one catalogue included any boys playing with fashion or baby dolls (Early Learning Centre). Girls were twice as likely as boys to be shown playing with ‘household’ toys. (Though many toy kitchens were pictured with girls and boys playing together.) Girls were twice as likely to be shown with art, craft and music toys. Boys were more than twice as likely to be shown with construction toys. We revisited toy catalogues in 2017, and found the majority continued to represent children’s play in very stereotyped ways, reinforcing to children, and the adults who buy for them, that certain interests and activities are more suitable for a boy or a girl. However, we were happy to note some examples of good practice, showing that it is possible to present toys in appealing yet non-stereotypical ways. We found: Most of the imagery provided by manufacturers to promote their toys seems to stick to a pretty limited script. None of the catalogues we looked at had any explicit ‘Boys’ or ‘Girls’ labelling, but some used colour (pink and blue) as a cue to indicate toys stereotypically associated with girls or boys. Most catalogues had areas that were ‘no go zones’ for one gender or the other, eg whole spreads of vehicles or Nerf blasters featuring only boys, or whole spreads of baby dolls, collectibles or art/craft materials featuring only girls. All catalogues except Tesco showed boys with home corner toys, but girls were still nearly twice as likely to be shown with kitchens or other ‘domestic’ play. Girls were nearly 7 times as likely to be shown in caring/nurturing play, and 12 times as likely to be shown playing with baby dolls. Only 10 out of 128 images were of boys with dolls, 8 of them in the ELC catalogue. Disappointingly in some areas we found no improvement on the previous year: 97% of children shown with guns and war toys were boys. Girls were twice as likely to be shown with art and craft toys. Boys were almost twice as likely to be shown with construction toys. 26 children were shown with beauty/grooming toys – none were boys. Broadly similar numbers of boys and girls were shown with other kinds of doll/action figure, but within that, boys were ten times more likely to be shown with superhero-themed ‘action figures’ and much less likely to be shown with other kinds of ‘small world’ play. Girls were more likely to be shown in dressing-up clothes, but boys got more variety. Over half the girls in dressing up were shown in princess or fairy outfits, mostly in passive poses. 40% of boys were shown in superhero outfits, mostly in active poses. However, we did see some positive developments. Some examples of good practice we found in 2017: Early Learning Centre’s catalogue showed boys and girls playing together with toys across their range, from kitchens, baby dolls and dolls houses, to transport playsets and vehicles. Most of the Toys R Us catalogue is filled with pretty stereotypical images, but the photos taken specifically for the catalogue, and for own-brand toys do stand out for being more inclusive. Eg girl with Nerf-style blaster, with ‘fast lane’ vehicle play set, boys and girls shown together with ‘just like home’ toys. While Tesco’s catalogue was dominated by stereotyped images, there are a few pictures which stand out, eg a boy with baby and pram, a boy with Barbie, and girls with SpiderMan toys. The proportion of girls shown playing with vehicles was slightly up on the previous year. A boy with a baby doll was featured in both Tesco and TRU catalogues. Download the full reportDownload"
