["https://www.lettoysbetoys.org.uk/research/tv-advertising-research"]
title = "Toy ads on TV - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "What do toy ads on UK TV tell children about boys’ and girls’ play? Our television toy ad research was carried out by Let Toys Be Toys volunteers who watched over 30 hours of programming on nine UK TV channels to find out how boys and girls are represented in ads for toys. The results will probably come as no surprise to those parents who watch commercial television with their children. The majority of TV adverts show boys and girls playing separately, and in very stereotypical ways: Boys were shown as active and aggressive, and the language used in adverts targeted at them emphasises control, power and conflict. Not one advert for baby or fashion dolls included a boy. Girls were generally shown as passive, unless they were dancing. The language used in the ads focuses on fantasy, beauty and relationships. Out of 25 ads for toy vehicles, only one included a girl. Ads targeted at boys were mainly for toys such as vehicles, action figures, construction sets and toy weapons, while those targeted at girls were predominantly for dolls, glamour and grooming. Ads that featured boys and girls together were usually in categories such as action/board games, art/craft materials, interactive toys and soft toys. The action games we watched all had boys and girls playing together, although boys outnumbered girls 3:2, and these ads all had male voiceovers. Some ads that featured boys and girls together showed them as adversaries, for example girls screaming and running away from a boy’s remote control spider, or a boy trying to break into a girl’s secret journal. Download the full reportDownload"
