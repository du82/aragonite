["https://www.lettoysbetoys.org.uk/research/2016-research"]
title = "2016 retailer survey - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "More retailers move away from gendered marketing This year our team of mystery shoppers found big changes in store signage across the board but it was mixed news in catalogues, websites and store layouts. Across our survey of retailers, our major findings included: Gendered signs on the way out. Our mystery shoppers looked at stores across the UK to see how toys were presented. They found only two stores using ‘Boys Toys’ and ‘Girls Toys’ signs. We’ve gone from 50% of the shops we visited in 2012 having these signs to virtually none. Gendered navigation disappearing from websites. Only a fifth (21%) of stores reviewed used gender at all as a way to sort and sell toys online, compared with 46% in 2014, 49% in 2013 and 76% in 2012. This is a drop of over 70% since 2012. Store layouts often rely on pink and blue. Many survey respondents mentioned the colour pink as a way that stores continue to tell children that there is a ‘girls’ section’, either by using pink signage or flooring or by grouping toys together in a de facto ‘girls aisle’. Stereotypes still the norm in toy catalogues. Our research showed that the promotional images used in toy catalogues fell back on the same old tired stereotypes, with only a handful of boys shown with dolls, and girls accounting for just 11% of the children shown with cars or other vehicles. However improvements were noted in the promotion of science toys. Retailers appear to be ahead of most toy companies on this area. For example, Tesco’s own photography for their catalogue covers shows a boy and a girl together, playing in less stereotyped ways. Early Learning Centre was the only catalogue to include images of boys playing with baby dolls, and had far more balanced numbers of boys and girls playing with vehicles."
