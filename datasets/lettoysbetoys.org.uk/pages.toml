title = "Toys and books under £10 - Let Toys Be Toys 2024 gift guide - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "10th November 2024 Shopping ethically and without stereotypes needn’t break the bank. Here are some of our top picks this holiday for toys and games under a tenner, starting from £3.00. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Bug Eye Wooden Kaleidoscope Discover the world through a new lens with this Bug Eye Wooden Kaleidoscope! With this bug eye wooden kaleidoscope you can view the world through an insect’s eye. This beautifully crafted kaleidoscope offers a unique perspective and endless visual possibilities. Perfect for imaginative play and curious minds, it makes a great gift for kids and adults alike. Unleash your creativity and see the world in a whole new way. Suitable from 3 years and above £6.00 from Moo Like a Monkey Festive Friends Christmas Stickers This Christmas Ricemonster sticker pack is perfect for letters, journals, photo albums, and even party favours! Each pack comes with 6 unique fun designs to add a touch of magic to your day. This pack features: Angel Ricespud, Reindeer Ricespud, Carrot Ricespud, Ricemas Tree, a snowy Ricemonster and Santa Ricetodd ! £3.00 from Noodoll Goodnight Moon by Margaret Wise Brown This gentle bedtime story, which has lulled generations of children to sleep, is the perfect first book to share at bedtime. In a great green room a little bunny is tucked up snugly and safely in bed and is getting ready to say goodnight to all the familiar things in his room, one by one. Margaret Wise Brown’s comforting, rhythmical text accompanied by the warmth of Clement Hurd’s classic mid-century illustrations make Goodnight Moon a timeless picture book, which is known and loved around the world. Printed with a beautifully vivid orange pantone ink to preserve the magic of the 1947 original, Goodnight Moon makes the perfect birthday or christening gift. £7.99 now reduced to £7.59 from Malvern Book Cooperative Create your own buzzy bee Make your own buzzy bee with this paper craft kit. Play the pollination game and use your bee counters to help pollinate the flowers. With fun bee jokes and facts No glue or scissors needed Suitable for age 5+ £3.50 from Zany Pig League of Thieves Puzzle Adventure Book by Usborne Find the way through your own adventure with this exciting tale. You are at the centre of the story and there are so many twists and turns. Follow the twists and turns in this puzzle adventure book and use your dice to add an element of risk as you choose your own adventure. To complete this puzzle you will need to break into the infamous Castle Flaggstone to rescue your friend, steal a priceless treasure and uncover an ancient secret. With wonderful illustrations and twists and turns along the way, this is a book where you are at the centre of the story. Designed for confident readers who love a non-linear narrative, this Usborne paperback book is one that will be pounced on by gamers and lovers of adventure stories. Age guidance 9+ £7.99 from Whirligig Felt Dog Finger Puppet These cute felt dog finger puppets are sure to be a hit. Each is about 13cm tall and there are five different designs to choose from. Hand made in Nepal under fair trade conditions from 100% wool felt. £5.50 from One World Shop Christmas Advent Cards Tin Generate giggles, grow gratitude and celebrate Christmas! These 24 Christmas Advent Calendar cards are the perfect way to help with the Christmas countdown and start a lovely new family tradition. This educational, sustainable gift can be reused each year. You’ll look forward to hearing how your child’s answers change, as they grow older! Recommended for ages 3-9 £7.95 from Happy Home Learning Fairy Wings Enjoy magical fun with this sparkly pair of fairy wings for children, ideal for fancy dress or fairy tale role play adventures. The wings come with two elastic straps for easy wearing and ensuring the wings stay on the shoulders. A matching star wand is also available to buy separately to complete any fairy outfit! £8.95 from Busy Brain Activity Packs Five Little Ducks Favourite Song Mitt Manufactured in a soft stretchy fabric with superb printed detail, the mitts are suitable for both adults and children to use. The words for these classic counting songs can be found on the colourful backing card. Good for interactive play with your children. Recommended age 12 months + £8.50 from Tinker Tray Play What the Oak Tree Sees The first book in The World of Hiddel Brock Wood series, What The Oak Tree Sees is a poetic introduction to the most loved woodland wildlife, aimed at 2-7 year olds. Follow their tracks and discover where they go when the people visit the woodland. With classic hand-drawn illustrations full of treasures to discover, it is perfect for reading aloud to younger children as well as for early readers to enjoy. Ideal for nature loving children at home or in a school or Forest School setting, this delightful story subtly reinforces the importance of respecting our natural environment and leaving no trace other than footprints, whilst also teaching children to recognise classic woodland animal tracks. Age Guidance 2-7 years £9.00 from Hiddel Brock Wood Bumblebee Trump Game Beautifully illustrated by artist Meg Kelly, and made in collaboration with the Bumblebee Conservation Trust, our Bumblebee Bumps card game is as fun as it is educational. Featuring all the Bumblebees of Europe plus some cheeky mimics, this is a great way to learn all about, and identify, our precious Bumblebees! £6.50 from Curiosity Box Giraffe 3D Card Mask This amazing giraffe design is so much fun to build and wear. There’s nothing children love more than fancy dress, dressing up in their favourite costume and entering into a world of fantasy and role play. With this 3D full-head mask kit, they can enjoy all of that and more, because this self-build mask also encourages their love of arts and crafts. Adult help will be required to build. In just a few easy steps, children will become immersed in a world of fantasy and make-believe as they build their own mask and make it the centerpiece of a whole new role play costume. Suitable from age 5 £9.00 now reduced to £7.50 from Button and Squirt Giant Robots Colouring Poster Young engineers, coders and roboticists can colour-in and delve into the delightful world of Okido robots in this giant colouring poster. Okido favourites are featured including Stan Tall, Smoothie-bot and Flavour Robot are are keeping everyone refreshed, DJ-bot is keeping the dancefloor full and loads more. Can you do the robot? Beautifully illustrated by the OKIDO artists, this giant colouring posters offer hours of fun – they can colour by themselves, with friends or you can all join in as a family. £4.99 from Okido Mini Penguin Pairs Game A fun-packed travel size matching game with quirky penguin characters. Penguin Pairs features 32 colourful penguin character cards to match. Suitable as a single player activity or a multi-player game, children will love matching the quirky penguin characters in their cool costumes! This travel size game is for 1 – 4 players. The mini games are Orchard Toys’ smallest games in a compact and portable size, perfect for at home or on the move. Suitable for ages 3-6 years £6.00 from Salty Dog Emporium Sea Life 20 Piece Puzzle by eeBoo eeBoo is a boutique toy manufacturer that specialises in well made and beautiful educational games and gifts to assist with literacy, story telling, drawing, imaginative play and basic maths. Puzzles are a wonderful toy for young children. As well as being fun, they help to develop hand eye coordination, memory, problem solving and fine motor skills. With artwork by Monika Forsberg, this jigsaw depicts a wonderful view of the underwater world including fish and seahorses. It has 20 large pieces (perfect for small hands to hold) and comes in a small box with a cord handle so it is easy to take out and about. Suitable from 3 years £9.00 from Little Tiger Gifts Pet Dog Set Take care of this adorable basset hound. Feed it a bone when it’s hungry. Give it the bowl when it’s thirsty. This is a lovely toy for dog lovers and the kennel with its handle and small size is great for little ones to carry with them. Great for teaching little ones about looking after others and talking about what we and other living things need e.g, food and water. Also helps develop fine motor skills and communication Suitable from age 3 £9.95 from All the Kids The Great Phoenix of London London, 1666: When fire breaks out, eleven-year-old Gil is separated from his family in the chaos. One of his few remaining possessions is a mysterious ball of rock that fell from the sky. As he races to beat the inferno spreading across the city, neither he, nor his new friend Jennet, has any idea that the stone in his satchel is an unhatched bird of myth and fire. And that there are some who will stop at nothing to get their hands on a legendary phoenix . . . Age guidance 8 years + £7.99 from News from Nowhere Bookshop Knitted Sausage Dog with Present Christmas Decoration This fun sausage dog hanging decoration holding a sweet red present in its mouth is sure to delight any dachshund dog fan. This dachshund hanging decoration would look fantastic on your Christmas tree or in just hanging in any room in the house adding a fun touch to your decor. Best Years sells a range of knitted decorations which make lovely stocking stuffers, cute gifts or could even be used as a bag charm, and are a seasonal favourite with the Toymark team. Please note that this is a decoration and *NOT a toy* £9.00 from Best Years For more stereotype-free shopping, check out our Toymark directory of great inclusive retailers, along with our other gift guides on a range of themes. Share1"
