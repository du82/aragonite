["https://www.lettoysbetoys.org.uk/the-2021-let-toys-be-toys-silliness-awards"]
title = "The 2021 Let Toys Be Toys Silliness Awards - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "31st December 2021 It’s once again time to look back on some of the most startling and ridiculous examples of gendered marketing to make their way into our inbox over the past year. Over the course of a decade, we have noticed that the number of entries to this celebrated list of infamy has steadily decreased. Good news, of course, but there’s still a few corkers to be found… Get back in the box! Our supporters find these gendered tins keep popping up with dismaying regularity and this year was no different. In these versions, the world is neatly divided into boys whose interests are “Lego and space stuff”, and girls who like “sparkly things, magic stuff and something pink and fluffy”. As one commentator so succinctly put it, “predictably disappointing”. Chocolate, but only for girls Few things are such a universal pleasure as chocolate, but that doesn’t stop manufacturers from trying to drive a lipstick-shaped wedge between the genders. For this pack of girls mini chocolates, we thank child by nature on Instagram who spotted this in a shop in Holbrook, New York. Leaves a bit of a bitter taste… 404 error? These sketchbooks were “drawn” to our attention by @adamtweets85 who commented that it’s “actually decent inside but why can’t my daughters draw cars, witches or boats? So weird”. We’re happy to note that 11 children’s publishers in the UK have already committed to ditching these limiting labels and stereotypes and hope that any others still producing these kinds of titles will finally choose to let books be books in 2022. Princesses working 9 to 5 This Disney Princess Working Mum Gift Set from Tesco shows that nothing is safe from pinkification, even such workaday items as credit cards and work ID. Says @RattyMcRat, “Ahhh we’ve come so far haven’t we… what are you thinking @Tesco and @Disney ? As a working mother I just wait to look glam at work with my pink accessories – please stop these ridiculous gender stereotypes !” We couldn’t have put it better ourselves. And while we’re on the subject of work, our jaws hit the floor when our attention was brought to this CV template and its description: Some jobs are seriously feminine in nature. And even when not, being a bit feminine in your application materials can be a good thing… Muted, typically feminine, colors work well. And, to demonstrate that you also have a strong side, note the “Objective” section in black, a decidedly masculine color. Let both your soft and hard sides show with this template – you can be feminine and assertive at the same time. “Feminine and assertive at the same time” – colour us surprised! Barking Spotted by @benniekara, these expensive-looking his ‘n’ hers shampoos are too sophisticated for mere humans and are reserved for the canine population. At last a product for the male pooch who is concerned to seem “modern” and “confident”, while the female pup can express her “glamour” and “finesse”. A word to the wise though, in our experience the average doggie, male or female, would much prefer to soak themselves in “eau de muddy puddle”. It’s a small world And finally, there was another shout-out this year for our old friend, the pink globe. This one was seen by @JulietJFall, who commented, “Thank goodness someone remembered to gender the globe.” A case of seeing the world through rose-tinted spectacles, perhaps. And that’s all for another year (see here for all our past Silliness Awards). Thanks once more to everyone who has tweeted and messaged examples of gendered silliness this year, and a very Happy New Year to you all! Share8"
