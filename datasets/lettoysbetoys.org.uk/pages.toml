title = "Toymark Directory - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "All of the retailers on this page have been awarded our Toymark for their great practice in marketing inclusively to children. Shop online, or use the map to find a toy or bookshop near you. Map Wood Bee Nice Wood Bee Nice is a small family business offering quality sustainable toys to develop young minds, creativity and physical growth whilst being fun fso they are played with again and again.Website The Phive The Phive produce and sell phonics cards, story writing cards, creative writing books and magical prints to stoke the imagination, and improve the confidence, enthusiasm and skills of children ages 3-12.Website Dr Zigs Dr Zigs produce and sell a range of fun bubble kits, and are the leader in eco-friendly and child-safe bubble products in the UK.Website Happy Home Learning Happy Home Learning offer a range of pocket-sized activity tins with colour-coded activity cards with different levels of challenge for a range of ages between 2 – 10.Website Insect Lore Insect Lore sells an exciting range of toys and kits to give children a friendly, hands-on introduction to insect metamorphosis, entomology and life-cycle learning, as well as offering ladybird, ant, stick insect and silkworm kits, bug catchers, keepers, viewers and other exciting items for insect lovers.Website Salty Dog Emporium Salty Dog Emporium sells a lovely range of wooden toys, games and soft toys to inspire and ignite children’s imaginationsWebsite Busy Brains Activity Packs In addition to offering educational activity cards for parents of babies, toddlers & children up to five, Busy Brains sells a lovely range of toys to promote independent playWebsite Button and Squirt Button and Squirt creates and sells a range of animal-themed items including books and fact cards to help kids learn and develop a passion for wildlife and nature.Website Dinosuit Dinosuit offers eco-friendly wearable fossil kit for dinosaur for kids ages 6 and over.Website Busy Boards London Busy Board London create bespoke fun and engaging educational activity boards tailored to the individual user’s needs and interests.Website Happy Little Doers Happy Little Doers offers a range of self-designed educational and fun activity flashcards, prints & games for kids ages 3 to 9.Website Zany Pig Zany Pig is an online store selling a range of eco-friendly, wooden and creative toys to inspire children’s imaginations and play.Website Happy Squares Happy Squares creates and sells sets beautifully designed panels and connectors, allowing children to use their imaginations and be the architects of their own world while being kind to the planet.Website Yes Bebe Yes Bebe is a toy store with a mission to make a difference and build a better world by bring affordable, quality, eco-friendly toys to customersWebsite Jiminy Eco Toys Jiminy Eco Toys offers a range of over 700 nature-themed books and climate neutral toys made locally from natural or recycled materials with minimal waste, for babies through to teens.Website All the Kids All the Kids is an online store offering a range of beautiful, unusual, environmental focused toys, games, books, crafts and more for 1-6 year-olds.Website Tinker Tray Play Tinker Tray Play sells a wide range of engaging educational toys and resources with a focus on wooden and natural play in the early years.Website Little Acorns Little Acorns is a family-run online retailer offering a wide range of play and learning resources, toys, eco living products and preloved treasures for children.Website Hiddel Brock Wood Offering a lovely variety of children’s books, toys, designs, poetry and wildlife art Inspired by the magic of the ancient Northumbrian woodland of the same name.Website Creswell Crags Archeological museum shop with a great range of prehistoric and geological themed toys, board games and moreWebsite One World Shop One World Shop has been sourcing and selling the very best in fairly traded products included a range of toys from around the world since 1983.Website Malvern Book Cooperative A member owned bookshop with friendly and helpful staff selling a great range of children’s books alongside a cozy cafe.Website Good things Selling a lovely range of fun, ethical and sustainable toys that support charities, empower people and protect our planet.Website Timeless Toys A family run independent toy shop in Brighton selling beautiful and fun plastic-free, planet-friendly, sustainable and ethical toys for 0-6 year olds.Website Moo Like a Monkey Folkestone toy shop that celebrates individualism, diversity and design, with a focus on sustainability and stocking items a little different from the mainstream kids market. Shop online tooWebsite Lottie Dolls Lottie Dolls are an independent toy company with a great range of award winning, empowering diverse and inclusive girl and boy dolls based on real children, made with great attention to detail, using tactile fabrics with sustainability in mind.Website Noodoll Unique and adorable plush toys as well as music mobiles, stationary and wooden toys to suit a variety of budgets.Website The Curiosity Box STEM themed subscription boxes with fun hands-on activities for kids aged 4-6/7-11, as well as a range of fab science kitWebsite Best Years Specialising in selling beautiful and ethically knitted and crocheted toys for kids and babies – with the distinction of having introduced knitted dinosaurs to the world!Website Whirligig Toys – Tunbridge Wells Whirligig was our inaugural Toymark winner in 2013, and have since expanded to four stores including this branch in Tunbridge Wells. The toy shop specialises in ‘things to make and do’ – fun and creative toys sourced from small and independent suppliers that get children involved in what they are doing.Website Whirligig Toys – Chichester Whirligig was our inaugural Toymark winner in 2013, and have since expanded including this branch in Chichester. The toy shop specialises in ‘things to make and do’ – creative toys sourced from small and independent suppliers that get children involved in what they are doing.Website Whirligig Toys – Canterbury Whirligig was our inaugural Toymark winner in 2013, and have since expanded including this branch in Canterbury. The toy shop specialises in ‘things to make and do’ – creative toys sourced from small and independent suppliers that get children involved in what they are doing.Website Nickel Books An online independent children’s bookshop, offering tailor made goody bags, national book tokens and a schools service as well as a great range of book titles.Website Okido An online shop with Okido themed toys, books and party supplies designed by science and education experts with the aim of engaging young kids in the scientific world around them using play, art and fun.Website Little Wise Toys Little A5 travel friendly boxes packed with fun learning opportunities.Website One World Shop Sourcing and selling the very best in fairly traded products from around the world since 1983.Website News From Nowhere Community bookshop going for over 40 years with a great selection of diverse and interesting children’s books.Website Child’s Play Innovative, award-winning books for childrenWebsite Ottie and the Bea A modern children’s shop in SE London that believes playing and having fun is a very serious matter, no matter what age you are.Website Little Tiger Gifts Toy shop specialising in gifts for babies and young children.Website Whirligig Toys – Brighton Winner of our inaugural Toymark award back in 2013, this lovely toy shop in the North Laine district specialises in ‘things to make and do’ – fun and creative toys sourced from small and independent suppliers that get children involved in what they are doing.Website Letterbox Library Excellent online bookshop selling gender inclusive, multicultural, non-sexist books for children celebrating equality and diversity.Website Buttercup Traditional wooden toys, gifts, books and clothing for babies and childrenWebsite Babi Pur Ethical shopping for kids, specialising in sustainable, ethical, fair trade, safe and green toys.Website"
