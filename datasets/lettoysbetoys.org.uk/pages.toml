["https://www.lettoysbetoys.org.uk/2024foodietoysandbooksgiftguide"]
title = "Let's get cooking! Let Toys Be Toys 2024 foodie toys and books gift guide - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "6th November 2024 Whether it’s imaginative play on a food theme or recipes and activities to cook up with the kids, we’ve chosen a selection of toys, books and games to get children all fired up at a range of prices starting from £5.99. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Fair Trade Toy Cooking Set Aspiring chefs will have hours of fun creating delicious dishes from this Fair Trade toy set beautifully handmade from cotton. Grown ups will love the way it’s light, soft, quiet and washable – and that it all folds up into a cotton bag. This cute 30-piece toy set includes full-size hob with two velcro dials which sits perfectly on a table-top; pan with lid; frying pan; spatula; spoon; four pan holders; basket to hold food; fried egg; two sausages; drumstick; fish; a selection of colourful vegetables, plus “cooking set” carry bag all handmade from eco-friendly cotton. Hob measures 50 x 50cm Suitable for ages 3 years and over. £59.00 from Good Things Junior Baker Money Maker Activity Flashcards What better way to understand the value of money than by baking? Shop, make, and sell simple recipes through role play, or make the recipes at home. Use the ‘Coin Stacker’ to find out how much you have saved, use the recipe cards to work out your ingredients, what it costs to make and how much you can sell each recipe for. The pack includes 19 wipeable flashcards to be used with a dry wipe marker to calculate sums, write down costs and more. Featuring: 1 x Activity Card 1 x Coin Stacker & Pound Maker Card 1 x Shopping Checklist & Notes Card 6 x Recipe Cards (with real recipes that can be made at home!) 10 x Ingredients Cards Age guidance 4 to 10 years £14.95 from Happy Little Doers Simply Scandi Kitchen This sustainably-made Simply Scandi Kitchen has been crafted to look and feel just like the real thing. It features a twin hob, an oven, a sink and an under-the-counter cupboard, with a wooden pot, saucepan, serving spoon and spatula also included. Perfect for kitchen role play, little chefs can act out fun make-believe scenes as they plan and prepare delicious meals for the family (or their teddies!). Meanwhile, the muted colours and stylish wooden design of our kids’ play kitchen will look gorgeous in your tot’s bedroom or playroom. Made from FSC® Certified wood and coloured with non-toxic paints and lacquers. Suitable from 3 years + £99.99 from Moo LIke a Monkey Candyvan Cupcake There’s never been a SWEETER wooden toy. Please welcome the Cupcake Van: complete with groovy graphics and an adorable squishy topper. Sprinkle this CANDYCAR® into any playset or collection! Dimensions: 3.3″ L x 1.6″ W x 2.6″ H (8.4cm L x 4cm W x 6.6cm H) Recommended age 3+ £16.95 from Ottie and the Bea Plan Toys Fruit and Vegetable Play Set Get your five-a-day with this colourful wooden Plan Toys Fruit and Vegetable set. This wooden fruit and veggie set for the play kitchen includes a pear, lemon, orange, mushroom and carrot. Budding chefs will enjoy chopping them up and pretending to cook with them or eat them fresh. Chomp on that crunchy carrot and squeeze that juicy lemon! Bright and colourful, each piece can be cut in half with the little wooden knife. Suitable from 18 months £29.95 from Babipur Small Fry by David Baddiel A funny, exciting, David vs Goliath adventure with a heart-warming father-son relationship – perfect for fans of Danny the Champion of the World, Millions, and Ratatouille. The story of one boy and his brilliant burgers! Benny Burns spends every weekend helping his dad by working at their burger van, parked outside the local football ground. And when Benny finds his grandfather’s old recipe book and begins following its instructions, he starts cooking INCREDIBLE food – so good, in fact, that he attracts the unwanted attention of fast-food giant Bonkers Burgers! and its CEO, Bodley Bonkers. To Bodley, Benny and his burgers are a threat that must be eliminated… by any means necessary. And so, along with his dad and his two best friends, Jasper and Mina, Benny must find a way to defeat Bonkers Burgers, help rescue his dad’s business, and share his passion for cooking with the world – a mission that leads to him competing with the world’s greatest chef to cook the best burger. David Baddiel’s book ‘My Family: A Memoir’ was a Sunday Times bestseller. Recommended age 8+ £14.99 from Nickel Books Home Baking Set A stylish mixer with metal swivel whisk, wooden bowl, and clacking on and off button. Learn to mix up ingredients for successful baking with mum or dad. Items to weigh out on a modern kitchen scale include a wooden egg which opens to reveal a felt egg, a pack of butter and a box of flour containing 10 white felt discs. Mix this all up together and bake your cake in a wooden cake tin. Tastefully styled with soft contemporary colours and a cute mini chef motif. Made from sustainable rubberwood painted in matte and gloss non-toxic contemporary colours. Product measures 28 x 21.5 x 27.5 cms Perfect for pretend play and for inspiring children to be creative in the kitchen! Suitable from age 3 years and over (due to small parts) £39.95 now reduced to £29.99 from Busy Brains Activity Packs Cook It! Book Who’s home for dinner? What shall we cook? What do we need to buy? And don’t forget the washing-up! Helping with real tasks is a natural progression from pretend play, and is a crucial stage in a child’s development. Achieving a shared goal encourages a sense of responsibility, and develops many skills useful in later life. Simple conversational text and lively illustrations are carefully designed to encourage further dialogue between reader and child. Age guidance 2-6 years £5.99 from Child’s Play Books Hape Grey Stars Cooking Set This Stars Cooking Set for children is influenced by a stylish colour palette and Scandinavian design. The carry case cleverly doubles up as a play cooker and the inside features a contrasting yellow and grey chevron design. This product is playful yet subtle and will make a great addition to any play box for children. In fact, it is so beautifully designed, you’ll be wanting an adult version! Dimensions 24.3 x 12.3 x 16cm Suitable for age 3+ £23.95 now reduced to £17.95 from Zany Pigs Where Is The Cheese? Pocket Game Race to find the 10 ingredients the cook needs to make a meal. The ingredient tokens are laid out and each player takes a turn to choose a card from the deck – if it’s an ingredient they need they find the token and pop it in their game card – first player to find all their ingredients wins and doesn’t have to do the washing up!) A brilliant game for talking about food and ingredients, practising observation skills and turn taking. It’s a handy pocket sized version too, so it’s a great choice when you’re on the go! Suitable from age 3+ £16.95 from All The Kids Vegetables Sensory Play Stones These sturdy vegetable stones offer the perfect ingredients for creative cookery in the mud kitchen, or for inspired role play (indoors or out)! Boiled, roasted, fried or steamed, the vegetables can be used to make all sorts of dishes: soups, stews, salads or stir fries. As sliced vegetables, children can see how the beautiful sculptures compare to the real thing. Set includes eight vegetables: tomato, pak choi, onion, peas, carrot, mushroom, cucumber and broccoli. Suitable from age 2+ £26.99 from Little Acorns World Kitchen – A Children’s Cookbook This heartfelt book features a unique collection of recipes contributed by families from around the world. Each recipe has an introduction featuring the family who contributed it, and simple, step-by-step instructions, all illustrated in a bold, graphic-novel style by Chaaya Prabhat. From good old U.S. chocolate chip cookies (courtesy of Marlee from Philadelphia) to Ugandan ‘rolled eggs’ (from Jacob and his uncle Senti), each recipe brings authentic international flavours and stories to your table. With additional fascinating facts about regional traditions, cooking equipment and ingredients. All the recipes are vegetarian, and instructions are also included to make them vegan, nut-free, dairy-free, egg-free and gluten-free – or any combination of these.. £9.99 from Yes Bebe Picnic Set Bring your soft friends on a picnic no matter if it is in the forest, garden or playroom. This small picnic set for Maileg mice comes in a small metal suitcase and includes all you need of food and tableware for a lovely meal. Small variations may occur in the painting. Measures H6.5cm, x W7.5cm x D2.5cm. Suitable for 3 years + £28.25 from Buttercup Whitstable A Fruit and Veg Alphabet Crinkly Cloth Newspaper A Nursery Times Crinkly Newspaper all about Fruit & Veg! 6 pages of bright fun illustrations and simple text alphabet of healthy fruit and veg. This CE tested and machine washable cloth book is practical and lightweight with fun crinkly pages. It makes a great sensory toy and a unique gift. Packed in a card pop box. Suitable from 3 months £14.00 from Tinker Tray Play For more stereotype-free shopping, check out our Toymark directory of great retailers and seasonal gift guides on a range of themes – more added soon! Share0"
