full_description = "Who we are Our website address is: https://www.lettoysbetoys.org.uk/dev. Cookies This site uses cookies – small text files that are placed on your machine to help the site provide a better user experience. We only use cookies to provide anonymised tracking data to Google Analytics. This helps us understand activity on our website, which in turn helps us improve the website and the effectiveness of our campaign. For example, we can use cookies to look at which pages are most popular. We do NOT use cookies for advertising or marketing purposes. You may prefer to disable cookies on this site and on others. The most effective way to do this is to disable cookies in your browser. Donations Donations are made via PayPal. If you make a donation, we can see your name and email address as provided to us via PayPal. We will never share this information outside of the campaign and will only use it for processing your donation. Comments If you have previously left a comment on our site, you can request to receive an exported file of the personal data we hold about you. You can also request that we erase any personal data we hold about you."
