["https://www.lettoysbetoys.org.uk/lets-play-outdoors"]
title = "Let's play outdoors! Let Toys Be Toys gift guide - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "17th August 2024 We’ve chosen a selection of toys, kits and books to get both little ones and older children playing and exploring the great outdoors, at a range of prices starting from £2.99. Mini Butterfly Kite Take to the skies with a colourful butterfly with long streaming tails. Try out some tricks with this easy-to-fly mini kite in vibrant colours. Made from spinnaker nylon with fiberglass spars, this kite measures 40 x 30 cm and has long tails that will fly in the wind. It can be used as a traditional kite to fly or as a run along kite for younger children. A perfect first kite for children age 5 and up. Age 5+ £6.99 from Whirligig Walk and Wonder Tin Fun and educational activities, family games and conversation starters to help your child learn on walks and journeys! A unique, sustainable, plastic-free gift. Get little legs from A to B and learn together playfully! These innovative activities have been carefully designed to boost your child’s curiosity and listening skills and develop an appreciation of the natural world. Have these nifty ideas at your fingertips, in a perfectly portable tin, to make learning fun with all these playful challenges along the way. These clever activities will make return journeys home with your child so much easier. For ages 2-10 £12.50 from Happy Home Learning Butterfly Mini Magnifier With this super cute mini magnifier, your young adventurers can observe nature wherever and whenever they find it! A useful tool for woodland walks, school outings or just exploring in the comfort of the home. These fun magnifiers have a useful wrist strap, allowing them to be easily carried and come 3 different colours (orange/green/purple) – one colour chosen at random when you order. Each plastic Mini Butterfly Magnifier measures approx. 5.5cm making them ideal for small hands. Recommended from age 4+ £2.99 from Insect Lore Out and About Night Explorer The perfect introduction to nature once the sun has gone down, for children aged 8-12! Ideal for any budding wildlife explorers, this book encourages children to get outside and discover nature at night-time! It is packed with fun activities and useful information about how to identify creatures whilst out and about, whether in a garden or adventuring further afield on a night-time nature walk. Written by Robyn Swift in consultation with experts from the National Trust and featuring gorgeous illustrations by Sara Lynn Cramb. Recommended for ages 8-12 £6.99 from Buttercup Whitstable Stegosaurus Dinosuit Create your very own wearable Stegosaurus and feel what it’s like to stomp and chomp like a real dinosaur. This fabulous dino suit fits all sizes with ergonomically designed legs, operational head, snapping jaw and quick release straps. The stegosaurus is easy to store and hang and you can take it apart and make it over and over again. Triceratops and T Rex also available! Recommended for ages 6+ with younger children needing a little more help making. £54.95 from Dinosuit Balloon Powered Boat Have you got enough puff to move this boat? The Balloon powered boat is a simple yet brilliant toy, everyone will love watching this little boat whizz across the water providing endless fun. Little ones will love learning to blow up the balloon, connecting it to the boat and then releasing it into the water to race off. Compact and easy to transport, there is endless fun to be had. This boat is wooden, with a wooden tube for the air to leave the balloon through. It can be played with inside and out. Recommended for age 4+ £8.50 from Wood Bee Nice Amazing British Bugs ID Cards Do you love Bugs? Then you are going to love this super fun set of cards, introducing you to 70 amazing bugs that you might see when you are out and about. Each card is double sided, with a bug featured on each side, and is designed, illustrated and printed in the UK using sustainable materials in a solar powered factory. There is an illustration of the bug along with their common name, scientific name, when to see them in the year and a fun fact. The colours help you organise your cards into different types of bugs, so you can have a look at all of the butterflies, or slugs, or spiders etc together. Age: 3+ £10.00 from Button and Squirt Let’s Investigate – Seashore Be transported to the ocean and explore the enticing flora and fauna of the seashore with these tactile stones. Durable for use in their natural environment, in water and sand, they are perfect for outdoor discoveries and investigative play, and can easily be cleaned for the next adventure! Why not take them on a beach trip and compare with some real natural treasures? They can be used to create small world rockpools, to make imprints in play dough and to take crayon rubbings. Children will enjoy learning more about one of the richest and diverse environments on the planet. Recommended for ages 2+ £24.95 from All The Kids Balance Bike A balance bike with a difference. Convert your trike to a bike in a few simple steps with the conversion kit that comes with your Trybike. From 15 months old, build your little one’s confidence with the Trike. As they grow and learn, easily turn the Trike into a Bike with the included conversion kit so they start learning how to balance and manoeuvre with 2 wheels. The beautifully finished vintage look Trybike comes in various colours, 12 inch spoked steel wheels with nylon brushings, sealed smooth cartridge ball bearings and extra wide rubber inflatable tyres. Suitable from 15 months to 6 years £129.95 from Moo Like A Monkey Glückskäfer Stilts with Handles These children’s wooden stilts with handles are great fun for kids, helping improve balance and getting them active outdoors. Made from smooth FSC beech wood with wooden handles and 3 adjustable height settings. Wooden stilts are a classic children’s toy, and kids will love the challenge of hopping up onto the blocks and taking their first tentative steps – taking in the world from a brand-new perspective. Start at the lowest setting and as your child gains confidence the foot blocks can be raised up. Stilts are a great introduction to basic circus skills for kids, and they soon pick up this new skill – great fun for taking turns with friends or siblings. Suitable from 5 years + £58.50 from Babipur Potent Potions Jumbo Box This is a bit of a messy one, so perfect for doing outside, and is for all those curious kids who love mixing things together then seeing what happens – which is most! The Potent Potions Jumbo box contains 4 activities that bubble, heat up, foam, ooze, and change colour: Fizzing Fountains – test chemical reactions to discover which mixture makes the best fizzing fountain. Colour Changing Potion – craft a potion that’s the envy of any witch or wizard! Erupting Slime – mix chemicals to make a foaming slime. Big Bubbles – make the best bubble mixture ever and engineer a bubble blower for enormous bubbles! Recommended age 7 – 11 years £16.00 – 28.95 from Curiosity Box Outdoor Activity Set – Back to Nature Outdoor Activity Set – Back to Nature is a gentle, activity-based introduction to mindfulness designed to get children off the couch, unplugged and outside exploring nature. This set includes a handy magnifying glass, coloured chalks and a note-taking pencil, as well as an activity book filled to the brim with engaging activities and hands-on projects. Suitable from 5+ years £17.99 now reduced to £12.82 from Yes Bebe Dr Zigs Bubble Pollinator Kit Did you know that you can use Bubbles to Pollinate flowers?! With this new educational kit, learn all about the importance of pollination, how it works, and what you can do to help our natural pollinators. You can collect and add pollen to our unique plant-based Bubble Mix, so children (and adults) can blow Bubbles that will actually pollinate flowers! It’s a world first – combining play with a huge innovation in pollination technique, and education about our environment. This kit includes: 100ml Bottle of Pollinator Bubble Mix Paint brush for collecting pollen from flowers Bamboo cup to hold collected pollen Bamboo straw for blowing Bubbles Instruction and information booklet to learn all about Pollination Suitable from age 3+ £24.99 from Dr Zigs Moulin Roty Le Jardin Explorer’s Case This wonderful Explorer’s Case is perfect for budding adventurers who love to explore the great outdoors. It contains a compass, binoculars, log book, water bottle and treasure tin and comes in a stylish cardboard case with map illustrations. Suitable from age 6+ £60.00 now reduced to £54.00 from Little Tiger Gifts Outdoor Opposites Book Standing/sitting, smiling/frowning, high/low, whisper/shout, shrink/grow! A fun collection of opposites are explored, including some less obvious candidates. All are demonstrated by a happy band of children enjoying the great outdoors. Activities include picnicking, tree climbing, tadpole catching, camping and fireside sausage sizzling. Recommended for ages 2-5 £8.09 from Letterbox Library Scrunch Scoop Roll it, fold it, scrunch it…. the Scrunch Scoop is designed in the shape of a cheeky puffer fish, which is perfect for scooping up, pouring out, digging, shoveling and burrowing. Reusable and truly eco-friendly from start to finish, these silicone products derived from sand are perfect for the garden or the beach. Check out the rest of the Scrunch Kids range too! Suitable from 12 months + £10.99 from Salty Dog Emporium Woodland Animal Tracks & Signs Cards Comprising 18 cards in 3 sets of 6 (animals, tracks and poo), these are a fantastic addition to the What The Oak Tree Sees book (also available from Hiddel Brock Wood), or perfect as standalone cards to help children connect with nature and improve their wildlife knowledge. All track and sign illustrations are technically accurate and most are actual size for ease of identification in the field. Simple illustrations and labels for younger children are supplemented with more details for adults and older children. UKCA tested for 3+ £9.00 from Hiddel Brock Wood Wooden Catapult Back to basics and a touch of wildness with this toy / tool used by humans back to ancient times. Jiminy Eco Toy is sure you’ll be conscious of the safely aspects of a toy like this and think about the child’s personality and environment. A super addition to a family who encourages kids to get outside and use real tools and learn about their risks and benefits. Comes with 2 super-soft projectiles (pompoms). Suitable from age 7+ £12.00/€12,99 at Jiminy Eco Toy For more stereotype-free shopping, check out our Toymark directory of great inclusive retailers and Toymark gift guides on other themes. Share1"
