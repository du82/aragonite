["https://www.lettoysbetoys.org.uk/dolls-soft-toys-let-toys-be-toys-imagination-play-gift-guide"]
title = "Dolls & soft toys: Let Toys Be Toys 2024 imagination play gift guide - Let Toys Be Toys"
description = "Cuddle up to Marli the Puffin every night! This gorgeous, supersoft puffin is made from recycled materials so you know that you are helping our environment with every cuddle! These eco-friendly toys are manufactured and stuffed with 100% recycled polyester from plastic waste. Weighted with recycled glass beads, these floppy toys have been perfectly designed for hugging by a loving new friend.  Measures ‎13 x 25 x 15 cm."
full_description = "11th November 2024 Soft toys, dolls and figures are wonderful for stoking the imagination, exploring caring themes, and make lovely play companions. With prices starting at £2.75, there’s something here to inspire everyone. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Marli – Puffin Teddy Cuddle up to Marli the Puffin every night! This gorgeous, supersoft puffin is made from recycled materials so you know that you are helping our environment with every cuddle! These eco-friendly toys are manufactured and stuffed with 100% recycled polyester from plastic waste. Weighted with recycled glass beads, these floppy toys have been perfectly designed for hugging by a loving new friend. Measures ‎13 x 25 x 15 cm. Suitable from 1 month + £10.00 from imogen ruby Noodoll Ricespud Mini Plush Toy This Reindeer Ricespud is stuffed to the brim for those extra chubby cuddles and ready to be the perfect Xmas gift for you or your loved ones this Christmas. Made from super soft fluffy brown fabric, with little felt antlers, a soft white tummy, white pompom tail and a little red pompom nose – just like Rudolph! Plus, their handy velcro strap and new fabric keyring loop mean you can attach or hang them anywhere you like. Measures approximately 11 x 13cm Suitable from birth £18.50 from Noodoll Hape All Season Furnished Doll House There are as many ways to play with this house as there are families in the world. Six rooms, moveable stairs, and a reversible winter/summer-themed, solar-paneled roof inspire year-round activities. Includes four room sets: Master Bedroom, Family Bathroom, Media Room and Kitchen. Suitable for ages 3+ £159.99 from Timeless Toys Superhero Mouse This mouse is ready for hours of play and sleeps tight in a little matchbox. The clothes and bed linen come in unique prints and beautiful colors. Two face masks included – one for flying and one for sleeping. Measures 11cm high. Suitable from 3 years + £24.00 from Ottie and the Bea Elmer hand puppet Everyone’s favourite patchwork elephant is now available as a hand puppet! Part of The Puppet Company’s My First Puppet range, this gorgeous, soft puppet measures 8 inches tall and is machine washable at 30º Suitable from birth £9.95 from Little Acorns Shop Kangaroo and Joey Knitted Soft Toys A beautifully created soft toy kangaroo, with a baby joey hidden in its pouch! Hand-made in Zimbabwe in Fair Trade conditions, the knitters who’ve made this toy earn a living wage (a wage sufficient for a worker and their family to live comfortably), work in fair conditions, and use saving schemes to increase their financial resilience. Each toy is individually named by the woman who knitted it and made with mix of acrylic and cotton yarns. Suitable from birth £22.00 from Good Things Gifts Clive and his Babies Meet Clive – and his imagination! Clive loves his dolls. He enjoys playing with them, and sharing them with his friends. A gentle, affectionate board book, celebrating diversity and challenging gender stereotypes. Age guidance 1-3 years £5.99 from Child’s Play Books Boy Doll – multi ethnicities This little boy doll is hand made in Sri Lanka and wears colourful removable dungarees The doll is 220mm tall, and is made from handwoven cotton fabric with polyester filling and acrylic hair This fair trade doll is handcrafted by skilled artisans in Sri Lanka from fabric which is hand woven by local weavers. Colours and design of outfit can vary as every doll is unique. Suitable from birth £16.50 from One World Shop Nursery Rhyme Puppet and Story Set This beautifully boxed set contains a book and also finger puppets depicting the main characters in the story. The book measures 14cm x 20cm and the gift box measures 25 x 35 x 6cm. Suitable for ages 12 months and above. £29.99 from Tinker Tray Play Messy Monster Messy fans can cuddle up with the lovable monster and go on their own adventures. This super-soft toy is made from high-quality materials and is machine-washable, so it can withstand all sorts of fun and games. Measures 28 x 15cm Suitable from birth £12.99 from Okido Olli Ella Cozy Dinkum Doll – Zebra Mini Zebra Mini is a super cute, limited edition cuddly Cozy Animal Dinkum Doll from Olli Ella. Perfect for cuddles, this soft toy has an adorable sleepy embroidered face and snuggly plush zebra stripe onesie, and strokable zebra ears. The Olli Ella Cozy Dinkum Zebra Mini is a gorgeous soft doll with a plush white non-removable onesie outer, with grey zebra stripes, an attached hood with black fluffy mane and soft zebra ears. Zebra Mini has a happy sleepy face, black skin with a small tuft of black hair sticking out above the forehead. All snuggled up and ready for trips out or snuggles inside, this little Cozy Dinkum is light but gently weighted for added calm. Suitable from birth £34.90 from Babipur Dolls House Pet Set Animal lovers will go wild for this adorable wooden pet set. It will make a wonderful addition to any little one’s small world universe. With 6 sweet pieces including a dog, with a kennel and a bed along with a cat, scratching post and joint watering bowl. Great for inspiring imaginative play, encouraging social and language skills and nurturing early learning development such as fine motor skills and coordination. Understanding how to take care of a pet is a great life skill which can be carried through to later life. The kennel measures 10x 5.7×7.5cm Suitable for ages 3 and over £9.95 from Wood Bee Nice Grande Famille Moulin Roty Little Camille Turtle Moulin Roty’s little Camille soft toy is part of the ever popular La Grande Famille. This happy Grande Famille turtle cuddly toy has a soft green body, a big smile, long limbs and of course a spotty shell on her back. This lovely Moulin Roty is machine washable and measures approximate 30 cm. Suitable from birth £27.00 now reduced to £24.30 from Little Tiger Gifts Woolly Mammoth Knitted Dinosaur Soft Toy If you are looking for dinosaur toys for toddlers, why not consider a woolly mammoth? This new stripy woolly mammoth from Best Years is also tactile and knitted with soft tusks. A cuddly and sturdy knitted toy – a fabulous alternative to their brown pre-historic Woolly Mammoth toys. Measures 24 x 17 x 14cm and is machine washable. Suitable from birth. £17.99 from Best Years Tender Leaf Dolls House Dovetail wooden dolls house is a large spacious, double fronted 3 storey wooden dolls house. The house opens up at the middle to reveal 6 rooms which are all decorated in a stylish colour scheme. Dovetail House is the perfect dolls house for children to enjoy small world play either on their own or with friends. They will love creating stories and characters around this beautiful dolls house. Using top quality birch plywood to construct the house and furniture made from sustainable rubberwood which never chips, this is a toy that will really last. The house is supplied empty so you can either fill it with your own possessions, or really go to town and invest in the designer furniture that can be purchased with it. There is a kitchen set, a sitting room set, a bathroom set, a bedroom set, a kids room set and with the growing family, a nursery set. Self assembly required. Furniture not included Suitable for ages 3+ £200.00 from ZanyPig Sloth Full Bodied Animal Puppet This cuddly Full-Bodied Animal puppet has been designed to be a beautiful soft toy, but with all the functionality of a puppet. Measures approximately 15 x 11 x 24cm Recommended age 1+ £17.50 from Salty Dog Emporium For more stereotype-free shopping, check out our other Toymark gift guides on a range of themes, full of great toys and books from our Toymark retailers. Share1"
