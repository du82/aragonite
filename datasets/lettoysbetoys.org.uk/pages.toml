["https://www.lettoysbetoys.org.uk/teachers-lack-training-in-challenging-gender-stereotyping-survey-results"]
title = "Teachers lack training in challenging gender stereotyping: survey results - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "1st November 2020 Challenging stereotypes in the classroom has social and educational benefits for boys and girls, but a survey by the Let Toys Be Toys campaign reveals that teachers lack training and support. We asked teachers and educators how understanding gender stereotypes featured in their initial and ongoing training. What we found: Only 19% of teachers were advised as part of their initial teacher training (ITT) to challenge gender stereotypes, and that they were not always given ways to combat stereotyping effectively A quarter of teachers said that their training reinforced, rather than challenged, gender stereotypes Eight out of ten teachers had not been offered any training (Continuing Professional Development/CPD) in the previous five years about challenging gender stereotypes and unconscious bias Download the full report ‘Tying pencils to dinosaurs’: gender stereotyping in Initial Teacher Training and Continuing Professional Development (PDF) Download Stereotypes in the classroom Let Toys Be Toys is a campaign challenging stereotypes in in the way toys and books are marketed to children. But parents often tell us how their young children encounter stereotypes when they start nursery, pre-school or Reception, from other children or parents, and sometimes from staff. In order for girls and boys to thrive in education from early years onwards, and reach their full potential, gender stereotyping needs to be challenged. Stereotypes restrict learning opportunities and limit children’s ideas about what they can do, and challenging them can deliver real benefits in terms of children’s aspirations, self-confidence and behaviour. The BBC documentary ‘No More Boys and Girls: Can Our Kids Go Gender Free?’ demonstrated this clearly in a mini experiment in a UK primary classroom. Presenter Dr Javid Abdelmoneim and a film crew spent six weeks with a Year 3 class and their teacher, Graham Andre. Changes to classroom practice were introduced focusing in on challenging gender stereotypes – changes that were shown to have measurable positive effects on the children, including improved self-esteem among the girls, and improved behaviour among the boys. The documentary generated a great deal of interest and discussion on social media, especially among teachers. Many commented that they were keen to implement similar approaches in their classrooms, but didn’t always know where to start. This inspired us to investigate what training teachers had received around recognising and challenging gender stereotypes. About the survey We carried out an online survey, asking UK teachers and educators to share what training and support they had received related to challenging gender stereotypes, either as part of their initial training, or as part of continuing professional development. We also asked about when their training had taken place, location, and the age groups they worked with. Further information Since 2014, Let Toys Be Toys has offered many resources for parents, teachers, schools and childcare settings, including lesson plans from EYFS through to Y9/S3, advice to parents on how to raise concerns with their child’s school, and our popular ‘10 ways to challenge gender stereotypes in the classroom’ (adapted from the National Union of Teachers’ Breaking the Mould project). A full list of our resources for schools is available here. The benefits of challenging stereotypes in the classroom have been demonstrated through research. The links below give a sample: Institute of Physics – improving gender balance Lifting Limits – we can all be who we want to be NUT/NEU – Breaking the Mould UK Dept for Children, Families and Schools – Gender and education mythbusters Related: When Let Toys Be Toys campaigner Megan Perryman retrained as a primary school teacher a few years ago, she was disappointed to find gender stereotypes being actively promoted during her training. Read more in her blog here. Share0"
