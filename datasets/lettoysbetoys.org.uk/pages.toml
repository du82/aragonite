title = "Dear toy manufacturers... #Just4Asks - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "22nd September 2019 Click the image for a larger version and transcript. We’re calling on toy manufacturers to market toys in a more inclusive way. Here’s what we’d love to see: Inclusive names and language Avoid referring to ‘boys’ or ‘girls’ in product names or descriptions. Drop the labels and give children the freedom to choose for themselves. Representation Include a diverse range of children in product photos and graphics, challenging narrow stereotypes and showing boys and girls playing together with the same toys. Colour without stereotypes Pink and blue are powerful signals. Let’s avoid using them to direct children’s choices. Imaginative language and motifs Stereotyped symbols and language such as beautful hearts vs busy robots can be used to signal to children that a product is not really meant for them. Let’s see more variety. You can download this graphic as a PDF ready to print and display. At Let Toys Be Toys we’re keen to engage directly with toy manufacturers to talk about inclusive product development and marketing. Contact us at info@lettoysbetoys.org.uk Share0"
