["https://www.lettoysbetoys.org.uk/support-us"]
title = "Support us - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "Make a donation Let Toys Be Toys is a grassroots organisation and receives no funding; it is run wholly by volunteers in their own time. If you share our vision of a world where children are free to play without pressure to conform to gender stereotypes, please consider making a gift to support the campaign. Our PayPal details our currently being updated, but you can make a donation directly to our Coop account via bank transfer: Account Name: Let Toys Be Toys Sort Code: 08-92-99 Acct Number: 6568 0193 Where does the money go? You contribution will enable us to: Spread the word – paying for website hosting and printing flyers and other resources for schools and conferences Persuade the industry to change – funding award stickers and other costs around our Toymark good practice scheme Plan bigger and better for the future – including Let Toys Be Toys events and other ways we can reach supporters who are offline Tell the retailers/manufacturers/advertisers what you think If you see gendered products or displays in a shop, or advertising for children on TV, online or in a catalogue that reinforces stereotypes, why not raise it directly with the retailer or the manufacturer? You can also help the campaign by sharing photos or information about examples via our social media channels or by email at info@lettoysbetoys.org.uk. Sometimes shops make changes right away – it’s always worth asking! Support retailers that are selling without the gender stereotypes Let Toys Be Toys recognises retailers who are ‘getting it right’ and selling without the stereotypes with a Toymark award for good practice. You can use your consumer buying power to support retailers that are doing the right thing and selling inclusively to all children – see our directory of over 50 awarded retailers throughout the UK. Conversely, if you know a great shop who you feel is worthy of our Toymark award, you can nominate them by emailing toymark@lettoysbetoys.org.uk."
