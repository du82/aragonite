full_description = "Research reveals websites dropping boys and girls filters Our 2014 website research investigated how popular online outlets offering children’s toys and books organised and presented their products. We were encouraged to find in the main that categorising toys as ‘Boys’ or ‘Girls’ was falling out of favour online, with under half of retailers reviewed using gender as a navigation aid or filter in online stores. Just under half (24/50) of the websites reviewed use gender to categorise toys or direct shoppers. Only half (12/24) of these offer gender as a prominent way to browse products. None of the online booksellers surveyed used gender to organise children’s books. Sites are much less likely to use gender to organise toys than two years ago, with household names including Tesco, Asda, Boots, M&S, Sainsbury’s and Hamley’s dropping gendered navigation or filters during this time. Download the full reportDownload"
