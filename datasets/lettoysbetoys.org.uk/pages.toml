["https://www.lettoysbetoys.org.uk/lets-get-building-let-toys-be-toys-2024-construction-books-and-toys-gift-guide"]
title = "Let's get building! Let Toys Be Toys 2024 construction books and toys gift guide - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "1st November 2024 Want to inspire or develop a love of making and building? Check out these building & construction themed toys and books, with prices starting at £5.00 and a range of items suitable for babies through to older kids. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Wheels at Work – Construction Concrete mixers, bulldozers, crane lorries, diggers and tippers! Lift the robust, fold-out, flaps to reveal the tasks carried out by each of these huge machines. Unusually, both men and women get to go in the drivers’ seats. Recommended age 1-3 £8.99 now reduced to 8.09 from Letterbox Library Green Toys Stacking Cups A robust and multi-coloured six-piece set of cups in graduating sizes with so many possibilities! scoop and play build towers learn to count using the numbers on the bottom learn about volumes – the numbers on the bottom relate to the cup’s volume so cup 5 holds the contents of cups 2 and 3, and so on! Recommended for 6 months+ £14.00 from Good Things Gifts Screw Board A fantastically practical learning toy, which enables little ones to develop real life skills in a fun way. The board has different sized holes, which means that thought has to be put into which screw will fit in which hole – can this be remembered? Using the wooden screwdriver, insert and remove the different sized and coloured screws for hours of fun. There is even a set of test cards, included, to enhance the gameplay element! Great for helping to improve colour and shape recognition, honing in on fine motor skills, dexterity and cognitive thinking. This set includes a wooden base board, a wooden screwdriver, 25 screws and 7 double-sided test cards. Suitable for ages 3+ £19.95 now reduced to 15.95 from Wood Bee Nice Rosa’s Big Bridge Experiment What is a bridge? Rosa and her friends investigate, using critical thinking and the objects found on the beach around them. There are many kinds of bridges but not all of the ones they make are sturdy! Can they apply what they have learned when Rosa’s pet dog finds himself stranded? £6.99 from Child’s Play Books Sealife Animals to Colour & Assemble Build your own underwater kingdom with this beautiful colouring and construction set. Each of the 13 animals in this set can be built by slotting together the strong card pieces. They come with lovely outlines and details on them which can be coloured in to recreate the beauty of the deep sea world. Easy to create and once built they make a wonderful story telling set. Suitable from ages 5+ £9.99 from Whirligig Happy Squares – Rainbow medium set This set contains enough elements to create an infinity of inventions, such as house, theatre, totem, shop, kitchen, rocket, shelter, reading corner, vehicle, etc… Great to play around with the 6 colours of the rainbow and combine them. Recommended ages 3 – 9 years old £43.00 from Happy Squares BioBUDDi Duplo Click-together building blocks (very similar to, and compatible with, LEGO Duplo) – made locally in Europe? Without plastic or any petroleum, just plants!?! Yes! That’s BiOBUDDi! Sets ranging in price from £5.00 – 39.00 from Jiminy Eco Toys Tap Tap Toolbox This woodpecker themed tool box is filled with everything you need to build something on your own. With two removable lid pieces that turn into screwable plates, and a cloth printed bag to pack away after play, this set makes a great gift idea for any child who is a budding creative. This set includes: a woodpecker hammer, some pliers, a screwdriver, a spanner, three screws, three nuts and three bolts. Measures 23 x 15 x 20 cm and made from sustainable rubber wood and responsibly sourced plywood, coloured with soft non-toxic colours for a contemporary style Suitable from ages 3+ £40.95 from All the Kids Cork Block Set – 20 pieces Korko, a sustainable building block set made from cork, connects children with nature in a playful, intuitive way. Suitable for water play and in the bath as cork floats! Korko building blocks foster little ones’ imagination and dexterity and are based on the classic design by Friedrich Fröbel. They come in a range of bright colours and in eight different shapes. Thanks to their light weight and natural non-slip surface texture, Korko blocks won’t fall down as you build constructions: hours of playtime fun guaranteed for mini master builders! This 20 piece set includes 8 shapes. Suitable from 18 months £19.99 from Timeless Toys Freckled Frog Tray of Play Open ended construction is made all the more engaging with these beautiful, bright, sturdy wooden building blocks. The eye-catching colours combined with the variety of shapes such as squares, rectangles and rods to name a few, make these blocks a versatile aid in creative play. Promotes shape and colour recognition when building with these blocks. Ideal for fine motor skills and hand eye coordination. This generously sized set is large enough for several children to use at the same time promoting collaboration skills. The tray is ideal for storage. Approximately 36 x 36 x 5cm, largest block 6 x 6 x 2.5cm and smallest 5 x 3cm. Each set contains 44 pieces and a wooden tray. Made with sustainably sourced pine wood and plywood. Suitable from 12 months + £87.99 from Tinker Tray Play T Rex Dinosuit Transform playtime into a thrilling adventure with this T Rex Dinosuit! Construct this dinosuit and then walk, stalk, and roar just like your favorite dinosaur in this eco-friendly, wearable dinosaur toy. Easy to build, wear and control, it’s perfect for young explorers ready to unleash their inner dinosaur. Kit comes with easy to follow picture instructions booklet , purpose-made high strength crush resistant card, wooden construction rods, sustainable construction components, construction washers, and an illustrated dinosaur fact pack. Recommended ages 6 and up £54.95 now reduced to £44.95 from Dinosuit How Was That Built? Join Roma Agrawal, the award-winning structural engineer who worked on The Shard, for an exciting behind-the-scenes look at some of the world’s most amazing landmarks. Meet the extraordinary people who challenged our beliefs about what’s possible, pioneering remarkable inventions that helped build the Brooklyn Bridge in the US, the Pantheon in Italy, the Burj Khalifa in Dubai, the Shard in England and the Sapporo Dome in Japan. Discover the ingenious methods engineers have come up with to enable us to build underground, underwater, on ice and even in space. And learn about the impact different forces and materials can have on a structure by carrying out your own engineering experiments from the ‘Try it at Home’ sections. Beautiful and detailed illustrations by Katie Hickey, including cross-sections, skylines and close-ups of engineering techniques in action, provide unique and illuminating perspectives of our most awe-inspiring constructions. Get ready to see the built world around you like never before! £14.99 now reduced to £14.24 from Malvern Book Cooperative Build your own honey bee Build Your Own Honey Bee kit will inspire children to discover and learn. With striking yellow and black markings, and a pull-tab flapping wing action, this busy bee is brilliant fun to build. Easy to assemble using slot together techniques – there’s no glue, no mess, no fuss. Everything you need is provided in the kit – simply follow the instructions: press out the pre-cut parts, build and play! This innovative kit also comes with a press-out Honey Bee Fact Stand for children to find out more about the critical role bees play in our ecosystem. Made using 100% sustainable cardboard and paper, the Build Your Own Honey Bee is not only fun and engaging to play with, but also eco-friendly. 5% from every order is donated to various wildlife charities. Age 8+ £10.00 from Button and Squirt Wooden Rocket Construction Kit Delight and inspire young scientists with a passion for building and space. They can build three classic-looking, robust rockets from 9 interchangeable parts. With strong plastic clips, this set allows for easy construction and deconstruction, creating endless rocket designs. Suitable for ages 3+ £16.50 from Okido Playpress Farmyard Build & Play Set The Farmyard Playset from Playpress is a creative toy children construct themselves. They can then enjoy hours of imaginative play with the farmyard characters and buildings. This toy farm set with animals is made of robust playboard and is plastic free, fully recyclable and biodegradable. The play set makes a brilliant gift for any child who loves playing with and caring for animals. Our toy farm set includes 2 farmers, 8 animals, a vegetable patch, a scarecrow, a barn and a chicken coop. Recommended age 4+ £11.99 from Zany Pig For more stereotype-free shopping, check out our other Toymark gift guides on a range of themes, full of great toys and books from our Toymark retailers. Share0"
