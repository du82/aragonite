["https://www.lettoysbetoys.org.uk/tescosellinggenderstereotypes"]
title = "Gender Stereotypes: Every Little Helps - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "2nd November 2023 After a decade of letting toys be toys, why is Tesco suddenly selling gender stereotypes again? Over ten years ago, during a sustained campaign from Let Toys Be Toys including a change.org petition addressed to major UK toy retailers, Tesco agreed to ditch the ‘boy’ and ‘girl’ signs from its toy aisles, alongside other major toy retailers including Boots, Entertainer, Morrisons, Sainsbury’s and TK Maxx. During the past decade, although a few rogue signs were occasionally spotted (and swiftly removed) at Tesco, these retailers have kept to their pledge to let toys be toys, with the result that signposting toys as for boys or for girls in UK toy shops is largely a thing of the past. ‘Girls’ Fun’ and ‘Boys’ Fun’ signs Tesco performed well in our retailer survey of 2016, and in our 2022-23 in-store research (not published yet), so we were surprised and disappointed when we were contacted on 16 September 2023 via Facebook by Shelley who spotted these signs in Lincoln: We hoped, similar to those previous incidents, that this was a one-off and the signs would be removed. However, we soon received reports of signs in Altrincham: In Yate and in Warwick: And in Scotland, in Maryhill Glasgow and in Musselburgh: One supporter on X.com commented: @Tesco look out your office window. Can you see dinosaurs roaming? Or are they all inside your stores? Please give girls and boys the message they can have whatever interests they want, and so BE anything they want. Girls *can* grow up to be scientists, and boys can be nurses. Signs stay up despite protests A Let Toys Be Toys campaigner contacted the Tesco Customer Care team on 23 September and was told the following: I can confirm that these are old signs that shouldn’t have been displayed in-store in the first place and new signs have been sent to all stores in the UK. If you see any of the old signs in-store, please report this directly to the Duty Manager of the store and they will be able to rectify the issue swiftly. – Thomas Unfortunately, not all the Tesco branches seemed to get the memo and over a month later we are still getting messages about the signs. ‘Girls’ Fun’ and ‘Boys’ Fun’ signs were spotted in Southend and Bexhill, and we were flagged about signs in Cardiff by multiple shoppers, one of whom (Lucy) commented: Hi, saw this in Cardiff the other day. Someone that had to follow instructions but clearly disagreed with the idea! In other branches, it seems wires got crossed – this only seeming to reinforce the idea of certain types of toys being for girls or for boys: So far, these signs have been reported to us in a dozen different branches. The most recent report came in on 28 October 2023 about these spotted in Bursledon, near Southampton: Whose decision and why? This step backwards in Tesco has been frustrating to see. One of our campaigners visited a couple of Tesco branches, finding signs like these in the Osterley store on 21 September: And signs categorising toys by Action and Adventure, Games & Puzzles like these in Beverley, East Yorkshire: We therefore know that the supermarket can market and sell toys according to type rather than by girl/boy. In fact, Tesco’s toy catalogues and many stores have marketed toys without resorting to gendered signs for successive years. So, why the change now? Supporter Sarah tweeted: At which point are they claiming the error took place? It’s not like they were produced with felt tip pen in the stockroom is it. The error was one of judgement by whoever passed these signs for production and distribution. Not good @Tesco Another annoyed supporter messaged: I would challenge that these signs are NOT error. I used to work for Tesco – POS [point of sale] signage is made on demand and usually discarded after use. Very little is kept because a) lack of storage space and b) the paper/card gets ruined. This signage is new and a team at head office would have signed it off. We can’t help but speculate if this is true – the signage looks new and we’d love to know who has signed it off. Ask Tesco to remove the signs and ditch the stereotypes We are asking Tesco to remove all the signs saying ‘Girls’ Fun’ and ‘Boys’ Fun’. Please don’t restrict children’s play choices and limit their interests. As dad Matthew Allen tweeted: “Come on Tesco, don’t tell my daughter what she can and can’t play with”. The problem of gender stereotyping is a massive one, but as Tesco says: “Every little helps”. Join our call in asking Tesco to ditch the signs and the stereotypes. They can be contacted: Phone: 0800 505 555 WhatsApp: 0800 917 7403 X.com: @tesco Instagram: @tescofood Facebook: https://www.facebook.com/tesco Email: customer.service@tesco.co.uk – UPDATE 9/11/2023: we’ve now found out that the Tesco this one gives a reply saying that “This email address is not monitored, and we will not be able to reply to your email” Alternatively, you can email Tesco’s CEO Ken Murphy at ken.murphy@uk.tesco.com with your concerns. Share7"
author = "Tessa Trabue"
year_published = 2023
year_updated = 2024
