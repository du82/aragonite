["https://www.lettoysbetoys.org.uk/roar-let-toys-be-toys-dinosaur-gift-guide"]
title = "Roar! Let Toys Be Toys 2024 Dinosaur Gift Guide - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "30th October 2024 Check out this great range of dinosaur and prehistoric-themed books and toys, with items suitable for babies, older kids and all those in-between. With prices starting at £2.39, there’s something here for every young dino fan. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Dino Magnetic Fun and Games The Dino Magnetic Fun & Games set is perfect for anywhere you go! Whether travelling, on holiday, or at a restaurant with your friends and family – kids will have plenty of fun playing these classic dino games. This comes in a dinosaur-themed tin, complete with pieces and counters to play four distinct games: Dinosaurs & Ladders, Tic Tac Toe, a Dinosaur Magnetic Scene, and Word Search. It even has a drawstring bag so that all the pieces are ready to go when you leave. Suitable for age 3+ £15.95 from Zany Pig Build Your Own Dinosaur Skeletons These great little glow in the dark skeletons simply snap together (no glue or tools required). Choose from Brachiosaurus, Tyrannosaurus Rex and Stegosaurus. Which is your favourite? Not suitable for children under 3 due to small parts. £4.95 from Curiosity Box Stegosaurus Dinosuit Create your very own wearable Stegosaurus and feel what it’s like to stomp and chomp like a real dinosaur. Designed in the UK with care, this fabulous dinosaur suit fits all sizes with ergonomically designed legs and an operational head and snapping jaw. With quick release straps, the suit is strong and light and you can take apart and make it over and over again. Includes easy to follow picture instructions booklet and a Stegosaurus fact sheet. Recommended for ages 6+ with younger children needing a little more help making. £54.95 from Dinosuit Little Wise Dinosaur Kit The Little Wise Dinosaur Kit is a magnetic educational toy offering a fun and interactive way to support early learning for young kids aged 3-6. The activity set offers a great homeschooling educational toy as well as a fun learning bridge between home and early years settings/early school as it is fully aligned with the Early Years Foundation Stage and Key Stage 1. Everything also comes in a nice and compact size box making the kit an ideal educational game that can be used on the move as well as at home. There’s a magnetic dinosaur collage, plus lots of fun and interactive resources supporting early learning. Suitable for ages 3-6 £17.00 from Little Wise Toys Best Years Knitted Diplodocus Small and perfectly formed this organic cotton dinosaur teddy in mustard with tactile white spots is made from sustainably sourced organic cotton with recycled polyester fill. This cute and cuddly diplodocus would make in ideal baby shower gift or newborn baby toy.This tactile knitted baby toy is suitable from birth and machine washable. Suitable from birth £18.99 from Best Years Dinosaur Memory Match & Snap Game A portable pack of 44 jumbo playing cards for the little dino lover in your life. Play fun games with these beautifully illustrated cards and learn how to pronounce each dinosaur name at the same time. Play snap and the classic memory game but, let me warn you . . . these aren’t just for kids but grown-ups too! So, how good is your memory compared to your kids? Suitable for ages 3+ £12.95 from Happy Little Doers Dinosaurium Junior Edition by Chris Wormell and Lily Murray Welcome to Dinosaurium. This museum in a book is open all hours. It will transport you millions of years back in time to discover the largest and most ferocious land animals that ever lived – the dinosaurs. So where did the T.rex live? What did Brachiosaurus eat? Could dinosaurs swim and fly? And why did they die out?With specially written text for younger readers, step inside to explore the incredible world of the dinosaurs. £12.99 from Ottie and the Bea Mosasaurus from Lanka Kade This chunky Mosasaurus is a tactile, colourful, chunky figure perfect for little hands. And what’s more, there are 5 other wooden dinosaur figures to collect. Brightly painted, they are ideal for story sacks, stacking, sorting and more! Made from eco-friendly wood and printed on both sides with a bright design showing a natural wood grain edge, these super chunky figures are handcrafted by skilled artisans in Sri Lanka from sustainably sourced rubber wood and non toxic paints. Blemishes should be expected, these are part of the beauty of a natural wood product. Also available in this range: Stegosaurus, Diplodocus, Ichthyosaur, Caudipteryx and T-Rex. Suitable from 10 months + £2.99 now reduced to 2.39 from Timeless Toys Dinosaur Themed Busy Board Dinosaurs are just one of the many themes you can choose when ordering a customised Busy Board. Each one is completely unique and a great sensory play aid, in supporting those with a range of learning and developmental needs. Please note that each Busy Board is a bespoke creation and needs to be ordered well in advance. From around 12-15 months onwards, children can use Busy Boards with individually made, age-appropriate activities. From £110 from Busy Boards London Dinosaur Jigsaw Puzzle Explore a prehistoric world with the Dinosaur Jigsaw Puzzle, specially created for curious minds aged 4 and up! This puzzle showcases the artistic talent of OKIDO’s illustrators and features over 100 dinosaurs – this captivating design will spark your child’s imagination and transport them back to the Jurassic age.This dinosaur-themed jigsaw puzzle is a gateway to a world of discovery, where young minds can explore, learn, and play – all while having a fantastic time. Let the adventure begin! Suitable for age 4+ £8.99 from Okido Dinosaur Pull Along This dinosaur pull along is a fantastic addition to any children’s toy collection. As the diplodocus dinosaur is pulled along with the purple cord, the colourful head, body and tail all move. Made of rubber wood. Measures 135mm (H) x 265mm (W) x 100mm (D) Suitable from 10 months £18.00 from Imogen Ruby Jumbo Dinosaurs – 10 to choose from Stomp! Roar! Screech! Imaginative play is larger than life with these realistically detailed jumbo plastic dinosaurs. Choose from 10 different figures including the largest dinosaur (Brachiosaurus) measuring 25cm x 24cm. Suitable from 2 years £6.99 from Little Acorns Rosa Loves Dinosaurs Let’s find out which toys Rosa and her friends are playing with today! An important series that celebrates inclusivity, promotes gender equality and embraces the uniqueness of every child. Age guidance 1-3 years £5.99 from Child’s Play Maileg Gantosaurus in Egg This wonderful soft toy is perfect for all dinosaur fans. This sweet Gantosaurus is a rose colour with a stripy tummy. Beans in her bottom allow her stand up and she even comes with her own cardboard egg which she can be enclosed in. Machine washable. Approx 23 cm. Suitable from birth £27.00 now reduced to £24.30 from Little Tiger Gifts Build a Terrible T-Rex Head Create your own giant T-Rex head to hang up on your bedroom wall so, it looks like a terrible T-Rex is crashing through into your room. Rahh! No glue or scissors needed. All pieces come pre-cut with tabs and slots to lock them together. Made from recycled paper and card. Recommended for ages 7+ £11.00 from Buttercup Alphabet of Amazing Dinosaur Flashcards This beautiful set of cards by Button and Squirt (another Toymark winner) acts as an introduction to 35 amazing dinosaurs, some that you may already know, and some that you may never have heard of before, but each totally amazing. The set includes 36 cards. One key card and 35 Dinosaur cards, made up of 26 letter cards and 9 number cards. Each letter card features the letter on one side, in upper and lower case, with a close up of the Dinosaur behind it. Then, when you turn it over you get to see the full Dinosaur illustration with its name, along with how to pronounce it and a little symbol to show what type of food they ate. The background colour of the card shows what time period the Dinosaur lived in, meaning you can see which ones would have lived together. The number cards work the same but have the same number of Dinosaurs on them as the card shows, meaning you can count them. Suitable from age 3+ £10.00 from Salty Dog Emporium A Day with Dinosaurs – My First Crinkly Newspaper This Nursery Times Crinkly Newspaper contains 6 pages of bright fun illustrations and simple text introducing colours. This practical, lightweight cloth book with crinkly pages makes great sensory toy and a unique gift. Packed in a card pop box, and CE tested and machine washable. Suitable for babies from 3 months + £14.00 from Tinker Tray Play Dinosaur Roar Pop Out Playset This dinosaur play set includes Roar, Stomp, Boo and Squeak from The World of Dinosaur Roar. The pack unfolds to reveal a prehistoric landscape waiting to be explored! Developed in association with the Natural History Museum. This plastic-free, colourful playset is like a 3D puzzle and toy in one and will challenge and inspire young minds. It’s made from durable and 100% recyclable playboard from sustainable FSC certified sources and cleverly fits together (no need for glue!) meaning you can pack it up and play with it over and over again. Made in the UK by a family company. We love their attention to detail and sustainable ways of working. Suitable from age 4+ £9.00 from Good Things Knitted Woolly Mammoth Spot the imposter! This cute and cuddly knitted mammoth toy isn’t a dinosaur, but is another firm favourite made by Best Years, the home of the knitted dinosaur, and so we wanted to fit this in. Carefully stitched and cared for to combine education with a play mate. Size approximately 15cm x 25cm Suitable from birth £16.50 from Creswell Crags For more stereotype-free shopping, check out our other Toymark gift guides on a range of themes, full of great toys and books from our Toymark retailers. Share0"
