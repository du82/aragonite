["https://www.lettoysbetoys.org.uk/one-campaigners-experience-of-initial-teacher-training"]
title = "One campaigner's experience of Initial Teacher Training - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "1st November 2020 When LTBT campaigner Megan Perryman decided to retrain as a teacher, she was struck by the lack of a coherent approach to gender stereotyping in the training she received. Anyone who has conducted a learning walk in a primary school, starting in Early Years and ending up in Year Six, will tell you how children learn to conform. In Early Years boy/girl friendships abound and children play together in the home corner and the construction area alike. As you move up into Key Stage One you might start to hear phrases like “pink is for girls” or “girls can’t play football” (although you’re also likely to hear children robustly challenge those assertions too!). In Key Stage 2 for the most part boys and girls form separate tribes. It becomes much less common for boys and girls to be friends, and interests seem to diverge. Nobody knows for sure how much of our gender difference we’re born with, but it’s clear that much is learnt. When I decided to leave my job in the charity sector and retrain as a teacher I hadn’t been in a classroom for a long time, but I had seen my own children growing up and witnessed how they adapted to the world around them. I saw how constant messages about the “right” way to be a boy or girl could make my daughter go through a predictable princess phase and my son hide his dolls when his friends came to play. At the same time I could see that if children are given choice, real choice without judgement, they tend to have a range of interests just like adults. I was so excited to become a teacher. I sat in my first seminar buzzing with anticipation. Looking ahead at my timetable there was one session that concerned me. It was called Raising Boys’ Attainment. I had already read the NUT’s Breaking the Mould resources and the Gender Issues in School report from the Department for Children, School and Families, both of which emphasised the importance of challenging gender stereotypes and steering clear of a so-called “boy friendly” curriculum. Despite this I decided not to judge until I’d sat through the session. In reality it was more shocking than I expected. In complete contradiction to a very good training session on diversity from the National Education Union we were told: “Girls innately prefer toys for form and colour. Boys innately prefer toys for movement.” “Boys have larger muscles enabling them to run faster, jump further.” “Girls have 30 times more language in pre-school than boys.” “Many boys develop fine motor skills later [which] makes writing difficult and even painful.” [session slides] None of these assertions cited sources and all of them seemed completely contradictory to what I had learnt from my own research, which largely demonstrates that boys and girls are more alike than different (and that similarity is particularly obvious pre-puberty). The session encouraged us to teach boys and girls in different ways and didn’t address their similarities much at all. We were told to give books about football to boys to encourage them to read (Let Toys Be Toys has a great blogpost on why ‘boy books’ aren’t the solution to getting boys reading!). The trainer said boys would only play in a home corner if it was redesigned as a rocket or a dinosaur cave. We should forgive boys who didn’t sit still because they just couldn’t help it, unlike girls who are naturally able to sit still and be good (my blood was boiling at this point). It made me wonder: how many new teachers are receiving training like this? How many start their careers determined to treat boys and girls differently, thinking they are doing the right thing? The Let Toys Be Toys teacher training survey gives us some insight into just how widespread the problem is. Only 20% of teachers remember being taught to challenge gender stereotypes in the classroom during their initial teacher training (ITT). And when looking at training beyond those dedicated sessions, 26% of teachers felt their ITT reinforced stereotypes compared with just 15% who felt they were challenged. I am lucky to work for school that tries to challenge stereotypes and includes all children. I don’t know if all teachers would describe their school in this way. I do know that the ideas generated during your training can stay with you for the rest of your career. Teachers play a significant role for so many children and it’s vital we get this right. Read the results of our teacher training survey here. Since 2014, Let Toys Be Toys has offered many resources for parents, teachers, schools and childcare settings, including lesson plans from EYFS through to Y9/S3, advice to parents on how to raise concerns with their child’s school, and our popular ‘10 ways to challenge gender stereotypes in the classroom’ (adapted from the National Union of Teachers’ Breaking the Mould project). A full list of our resources for schools is available here. Share0"
