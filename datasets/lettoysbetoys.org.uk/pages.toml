["https://www.lettoysbetoys.org.uk/blast-off-let-toys-be-toys-space-gift-guide-4"]
title = "Blast off! Let Toys Be Toys Space Gift Guide - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "7th November 2024 Check out this great range of space themed books and toys, with items suitable for babies, older kids and all those in-between. Updated for 2024 but still featuring some former favourites with prices starting at £6.29. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Space Jigsaw Puzzle Unlock the wonders of the cosmos and inspire your child’s sense of wonder with our Space Jigsaw Puzzle. It’s an exciting way to introduce them to the captivating realm of space, astronomy, and STEM learning, all while providing hours of entertainment and education. Piece by piece, they’ll uncover the secrets of the solar system and dream of reaching for the stars. Embark on your cosmic adventure today! Recommended for ages 4+ £8.99 from Okido Space Adventure Play Mat These magnetic blocks are the perfect size for little fingers to manipulate and build with. The blocks are of different The Space Adventure play mat is a spaced themed toy and has everything you need to enjoy an adventure in space. This space toy is great for imaginative play and includes a solid wood flying saucer with a little green alien encased in an acrylic dome, a space shuttle, and an Apollo rocket in 3 parts. Suitable for ages 3+ £32.00 now reduced to £23.60 from Zany Pig Cosmic Blast Off Nano Discover how spacecrafts land back to Earth safely by designing your very own landing gear for an egg! Create a cosmic view of what astronauts might see in space. The nano box contains 2 sciencey activities for when 1 activity just won’t do! Both of the activities are related to the same topic. Age 7+ £16.00 from The Curiosity Box Wallace and Grommit Rocket Kit Build a wonderful machine created by Wallace to lift off into space. f you remember ‘A Grand Day Out’, you will know that the rocket that takes them to discover the cheese is their living room, converted into a wonderful flying machine. You can now recreate this, with 135 and no glue or scissors required. Just slot the pieces together to recreate the amazing details and characters, with flames leaping out of the bottom to get it into space. A wonderful build for a fan of this amazing series. Suitable for ages 8+ £29.99 from Whirlgig Toys Dear Universe Playset by Grapat Discover the wonders of outer space with the Grapat Dear Universe wooden play set. This set includes seven hand-painted planets that can represent the days of the week and a selection of pearly white moons and craggy asteroids to create your own solar system. The Grapat Dear Universe will inspire open-ended imaginative play, learning about celestial bodies and helping young children visualise the planets in the night skies. This set can also be combined with the Grapat 7 Moons weekday calendar – can you match the days of the week with their planet? This space play set includes 40 individual pieces including planets, moons and asteroids or stars. Each piece is tactile and beautifully hand-painted in soft colours and incredible detail and presented in a decorated cardboard box for storage. Suitable from 3 years £41.80 from Babipur Space Activity Flashcards Inspire kids to believe that space exploration is a real possibility. Discover the planets that are within our solar system; a planet that always smells of egg and even a planet that rains diamonds. Enjoy a range of activities, including how to build a rocket and launch into outer space and building your own space suit! Learn about our solar system, the sun and the planets within it. Understand how ‘lunar phases’ work with the sun and the moon. Featuring the International Space Station, Mars Rovers, the parts of a rocket and more! In 2025, astronauts will be sent to the surface of the moon for the first time in over 50 years by NASA. It will be the first time ever that either a female astronaut and a person of colour will set foot on the moon – both of which are proudly represented within this pack. The Space Flashcards also features the latest spacesuit designed by Axiom, an inclusive design to be worn by both male and female astronauts. Suggested age 4+ £14.95 from Happy Little Doers Look Up! by Nathan Bryon, illustrated by Dapo Adeola “All I know is that one day I’m going to be the greatest astronaut, star-catcher, space traveller who has ever lived.” Meet Rocket- a budding astronaut who is getting all of her prep in right now: catching exotic species, spaceship-building, reading up on the dustiness of meteors, victory dancing…. In a world where everyone is looking down- at their phones, their newspapers, the floor- Rocket is pitched firmly upwards. Can she get everyone to join her in looking up for the amazing Phoenix Meteor Shower? Will brother Jamal finally put his phone away?Everything about this picture book soars: the ambition of its sparky protagonist, the nod to superstar Mae Jemison, the individuals who come together in a shared moment of outer-worldy wonder. The child-friendly illustrations resemble a near-edible spread of treats: Mum’s daisy-patterned leggings, Rocket’s gleaming orange astrosuit matched only by the kitten’s, the child in pink tutu and lurid spotted green wellies, the dancing supermarket fruit. As for the hairstyles…! Mum has really excelled herself with Rocket’s expert cornrow-puff combo. On every level this is a winner. Age guidance 4-7 years £6.99 now reduced to £6.29 from Letterbox Library Create Your Own Solar System The 3-in-1 solar system activity set packed with facts and activities. A board game with dice and counters and a create your own giant 3D solar system wall art scene take a trip into space and have an amazing adventure travelling around the solar system. No glue or scissors are needed for any part of the product. All items come pre-cut with tabs and slots so that they can be locked together. The solar system scene and board game measures 137 cm long by 30 cm high and is made from recycled cardboard. Age guidance 7-12 years £10.99 from Salty Dog Emporium Counting in Space – Crinkly Newspaper Cloth Book Nursery Times Crinkly Newspaper. Counting to 10 and countdown from 10 – 1 in Space. 6 pages of Space themed illustrations. Dimensions approx: 30cm x 20cm. CE tested and machine washable. A practical, lightweight cloth book with crinkly pages. A great sensory toy and a unique gift. Packed in a card pop up box. Suitable from 3 months £14.00 from Tinker Tray Play Space Ranger Eco Friendly Playset 3, 2, 1 Blast Off! With the Space Ranger Playset you can build a launch pad, open the large hatch and prepare for astronomical adventures. Remember to put your astronaut in the driving seat and he can explore once the destination is reached. The play board pieces slot together and can be brought out again and again. Varied creative play: All PlayPress sets can be switched up, adjusted and connected, so there are no limits on imagination and every playtime is different. Great for developing construction, problem solving and motor skills whilst exploring the characters and telling stories. This set includes 41 press out pieces and the outer packaging which folds out to make the inside of a spaceship. All the pieces can then be collapsed and stored back in the outer packaging that folds around and keeps everything together. Recommended age 4 years + £11.95 from Wood Bee Nice Space Activity Lab: a book of exciting space projects This fun, fact-filled book is brimming with exciting outdoor experiments to help budding astronomers aged 9+ explore the secrets of space. Using household items, combine astronomy with art and craft by launching your own rocket, build a moon lander to learn how astronauts touch down safely on the moon’s surface, and make a pinhole camera to observe a solar eclipse. Packed with photography, easy-to-follow instructions, and attention to detail, Space Activity Lab will make young astronomers excited from the get-go! Each of the super-fun make-and-do projects in this book comes with simple step-by-step photographs and instructions that will inspire children’s imagination and reveal some of the secrets of space. This children’s craft book on space offers: – 19 hands-on projects that appeals to kids aged 9+.– Materials easily found around the home with no specialist equipment needed.– Information boxes full of fascinating facts and panel stories that explain the science throughout the book.– A clear explanation how STEM is involved in creating the project or the results of the experiment. Suitable for ages 9+ £14.99 from Yes Bebe Knitted Astronaut Baby Rattle This knitted astronaut baby rattle is the perfect size for little hands to grasp onto and babies will love the stimulating gentle rattle sound. This sweet astronaut baby toy makes an ideal new baby gift or baby shower gift. Part of a range of knitted space dolls from Best Years. Suitable from birth £11.99 from Best Years Wondercloth – To The Moon Take littles on a journey through the vast expanse of space, where a rocket is heading straight for the moon. Zoom past glittering stars and rainbow-bright galaxies bursting with colors. The possibilities of the universe are limitless, just like their imagination. This beautifully hand-illustrated cloth is a wonderfully open-ended resource, and inspires fun & learning through self-directed play. From small world play to den building, from dressing up to wrapping presents, children can dance with it, let it blow in the wind, tie it on a stick, wear it as a cape or even hang it on the wall as a piece of art. Your child decides how to use the cloth, and that’s where the magic lies. £34.99 from Little Acorns Space Shape Sorter This space shape sorter is a fun twist on a classic toy, children can explore the Moon and it’s surroundings! Chunky colourful characters are double sided, to be sorted into corresponding slots or used as a playset. Characters and pieces are printed on both sides with a colourful design showing natural wood grain edges and it’s super chunky – the pieces are 20mm thick. This set includes an astronaut, planet, rocket, Earth, UFO and alien, all supplied in an informative box (an easy shape to wrap if a gift!) This fair trade wooden shape sorter is handcrafted by skilled artisans in Sri Lanka from sustainably sourced rubber wood and non toxic paints. Blemishes should be expected, these are part of the beauty of a natural wood product. Recommended for ages 1-5 £28.95 from One World Shop For more stereotype-free shopping, check out our other Toymark gift guides on a range of themes, full of great toys and books from our Toymark retailers. Share0"
