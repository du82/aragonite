["https://www.lettoysbetoys.org.uk/about/our-story"]
title = "Our story - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "How we started Let Toys Be Toys is a grassroots campaign that formed off of a thread on parenting site Mumsnet, which brought together parents frustrated by the increase in marketing to children that pushed narrow stereotypes, especially ‘girls’ and ‘boys’ signs in the toy aisles. One evening, over a dozen participants decided to take action and the campaign was born. After forming, we quickly carried out a survey revealing the extent of gendered signs across the UK toy retailers. We then launched a petition asking retailers to take down girls and boys signs, which we shared widely on social media. What we’ve achieved so far – retailers The campaign gained a lot of support from the beginning. Frustrated supporters shared examples of gendered signs they were seeing up in the toy aisles in their local stores, and we shared these widely on our social media channels, also writing to retailers directly with our asks. A few months into the campaign, we started receiving favourable responses from some retailers, and were even invited to meet with some of them in person to discuss our requests. By Christmas of our first year, 15 major UK retailers, including Sainsburys, Tesco, TK Maxx, Boots, Fenwick, Debenhams, Toys R Us, Hobbycraft and the Entertainer had agreed to take the signs down and let toys be toys. In 2014 we surveyed toy retailer websites, and found a 46% reduction in the use of ‘boy’ and ‘girl’ gender labelling in website navigation, compared with our initial survey in 2012. Our 2016 survey in the run up to Christmas found no ‘boys’ or ‘girls signs in stores, and a 70% drop in gender labels and navigation on websites. Let Books Be Books Our Let Books Be Books petition was launched on World Book Day in 2014, asking publishers to stop labelling story and activity books as ‘for girls’ or ‘for boys’. Find out more about our Let Books Be Books campaign. Toy advertising We are pleased with the progress we’ve made persuading toy shops and publishers to drop the boy/girl signs and labels, but despite these changes we find that toys and books are still being marketed to children in a very gendered way. In 2015 we looked at the stereotypes in TV toy ads, and found a marked contrast in how girls’ and boys’ play is shown, and the language used. And our 2017 research into how children are represented in toy catalogues shows that children’s play is still represented in very stereotypical ways, with boys four times as likely to be shown playing with cars, and girls twelve times as likely to be shown with baby dolls. We’re currently working to persuade the toy industry to market their toys in more inclusive ways with our #Just4Asks to retailers and toy manufacturers. How we work We primarily campaign over social media, and have achieved great support and success over the years by sharing our asks to retailers and publishers over Twitter and Facebook. We also regularly attend conferences and events to give talks, run workshops and staff information stands about the campaign. The team Let Toys Be Toys is made up of a small group of volunteers. None of us is paid; there’s no funding or budget. We do this because we think it matters for children. Most of us are parents. As with our campaigning, we also organise our projects online, and we fit our campaigning around our paid work and family responsibilities. It was months after the campaign formed before any of the members met in real life, and even today we have volunteers who have never met another volunteer in real life. You can find out more about the campaign’s tactics and approach, and how it works behind the scenes in this interview with the Advocacy Iceberg podcast."
