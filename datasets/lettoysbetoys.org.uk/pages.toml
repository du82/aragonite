title = "Let's Make Music! - Let Toys Be Toys books and toys 2024 gift guide - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "7th November 2024 Looking for a music themed gift this holiday? Check out our 2024 gift guide with some fabulous musical themed toys and books for children. With prices starting from £4.50, there’s sure to be something for every budget. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Magnetic Music Box Friends Melody Friends melody is a round magnetic music box with a rabbit and a squirrel. Simply wind up the music box and the two magnetic figures will start to dance around and around to the “Lullaby” by Franz Schubert. The music lasts for approximately 2 minutes and 30 seconds. Your little one will delight in the moving figures and be soothed to sleep by the beautiful music. Recommended ages 1 and over £26.95 from Wood Bee Nice The Story Orchestra Musical Puzzle – The Nutcraker The Story Orchestra series brings classical music to life for children through gorgeously illustrated retellings of classic ballet, opera and program music stories paired with sound clips of orchestras playing from their musical scores. Using the full puzzle image on the poster as a reference, put together an enchanting illustration showing Clara, her grand Christmas tree, the nutcracker and some of the fantastic characters she meets on her adventure. Then, press the musical notes to hear the vivid sound of an orchestra playing from Tchaikovsky’s original score. Flip the poster over to find additional details on the story’s happy ending and biographical information about the composer and how the music connects with the story. This musical jigsaw puzzle is the perfect gift to introduce children to classical music. The box contains a 48-piece puzzle (44 regular pieces, plus 4 shaped pieces with cutouts that give access to the musical buttons on the included frame) and an educational poster; the finished puzzle measures 29.7 x 21 cm / 11.7 x 8.3 in. Recommended for children 4 – 7 £17.99 from Nickel Books Musical Xylophone For all budding musicians, multicoloured 8 tone glockenspiel with two strikers. This xylophone has a beautiful tone and comes with sets of music to follow along. Ideal to introduce little ones to music and to develop their motor skills and sense of rhythm. Suitable for ages 18+ months £23.00 at Buttercup Confetti Rock Guitar This electric guitar is perfect for children aged 3 and up, as they explore and create their own soundscapes while dreaming of a career in music. A set of extra strings is included. Plug in the guitars! If all it takes is those first few guitar chords to get your little rockers on their feet, then this perfect gift will let them imitate the biggest festival-headlining rock stars! This magnificent guitar with a powerful style will surely electrify all music fans! Concerts and tribute acts are guaranteed with this Confetti range-coloured wooden musical toy. Its light wood tones, enhanced with multicoloured polka dots and a red neck, make it a unique instrument! This toy guitar boasts 4 strings which will help children aged 3 years discover the different sounds and awaken their sense of rhythm. An additional set of strings is included to satisfy all musicians, including even the most dynamic! Recommended age 3 & up £29.99 from Yes Bebe Moulin Roty Crocodile Music Box Moulin Roty make wonderful traditional toys and this metal music box is no exception. Beautifully illustrated in vibrant shades of red and green, it features a frog and crocodile surrounded by birds. Made from strong metal, it will amuse and entertain in equal measures. Simply turn the handle to hear the melody of Chatanooga Choo Choo. No batteries required! Approximate size W 11 cm x H 7.5 cm. Suitable from 2 + years. £15.00 on sale now for £13.50 from Little Tiger Gifts Bell Stick with 10 bells The perfect equipment to make music together. Enhances the sense of rhythm and concentration. For that individual extra touch in music. Product measures 7 x 5 x 18.5cm. Recommended ages 3+ £8.95 from Salty Dog Emporium I am the Music Man – Book and CD Peer through the die-cut windows in each page of this interactive book to find out who is playing what. Anyone can be the Music Man in this joyful adaptation of the classic nursery song, and everyone can join in making music together! Bouncy illustrations, innovative die-cutting and popular rhymes make Books with Holes a must for every child. Available in three formats, suitable for babies, toddlers, pre-schoolers and the nursery or classroom. Complete with Audio CD. Recommended ages 3 – 6 £8.99 from Child’s Play Books Plan Toys Rhythm Box Tap out a beat with this fun wooden rhythm box. Inspired by the Cajon hand drum, this musical toy will get little kids inspired to create fast-faced rhythms they can dance along too. This drum is made from solid rubberwood and decorated with eco paints. This toy measures 21cm x 21cm x 11.3cm. Suitable for ages 3 and over 39.95 at Babipur Wooden Frog Guiro Run the stick up this little frog’s back and it will reward you with a croak. Hit it sharply on the head with the stick and it will make a “pock” sound. Or you can leave it in peace on a shelf to look cute. This little croaking frog is made in a factory in Northern Thailand where fair trade principles apply. The frogs are carved roughly by hand from acacia wood, then sanded down to the final shape. Great care is taken to protect against sawdust inhalation. The sawdust is disposed of at a nearby mushroom farm where it is part of the growing medium. Nothing is wasted! Suitable for ages 3+ £15.00 from One World Shop Retro Tambourine This beautiful tambourine is perfect for any budding musician, gorgeously designed and packaged. Great for sensory play, this working tambourine is ideal for sensory play and finding your child’s love of music. An exciting and engaging toy that makes an ideal birthday gift or stocking filler. Featuring a beautiful and bold retro design that suits any nursery or playroom. Recommended ages 3+ £9.99 from imogen ruby Tender Leaf Music Table Create your own band of forest sounds! Musical notes roll off the xylophone and the mushroom bell tops jingle as you hit them with your acorn stick. Bang the tree trunk drums, blow through the birdie whistle, clack the butterfly wings, sound an echo with the wooden wind chyme. Rub the stick along the hedghog back, what a cacophony of musical notes! Product measures 50 x 39 x 21.5 cm and is presented in an illustrated colour box. Suitable for ages 3+ £110.00 from Tinker Tray Play Wooden Harmonica Crafted from high-quality wood, this wooden harmonica adorned with colourful wild animals is perfect for budding musicians. Its durable construction and easy-to-use design make it ideal for children to learn and play music. Unlock their musical potential and foster a love for music in your child. The harmonica is made of wood, plastic and metal, packaged in a recyclable card box, and measures 2.7cm by 12.9cm by: 2.2cm. Not for children under 3 years. £7.00 from Moo Like a Monkey Stacking Music Set Make wonderful music and explore melody and rhythm with this innovative set. Children can stack the differently sized blocks in any way they see fit, exploring music and shapes as they play. 6 music pieces: a drum, a cymbal, xylophone, shaker and washboard. All packs down into a single box for easy storage. Suitable for 12 months and over £34.99 from Timeless Toys Painted Flute These delightful painted flutes are handmade and are Fairtrade. They are made from one piece of bamboo measure approx. 30cm long and 2.5cm in diameter £4.95 from Creswell Crags Music Machine A Mechanical Music Machine – for children who love to build and love to make music, this is the perfect combination. The kit starts off with sturdy MDF pieces which will slot together with no glue or scissors required. The machine is held together with clever mini elastic bands which will stretch and connect the pieces. There are 8 metal notes, with hammers to sound each one as they strike, caused by the turning of the crank handle. The key is the pins which activate the hammers as you turn – move the hammers around to make different tunes. The kit comes with a set of tunes to programme and of course you can combine them in any way to make your own tune, with single notes or combinations of chords depending on where you put the pins. A great build that it is not too difficult to complete and then endless opportunities to use it make music. Suitable for ages 6 and over £39.99 at Whirligig Toys, For more stereotype-free shopping, check out our Toymark directory of great inclusive retailers and Toymark gift guides on other themes. Share1"
