["https://www.lettoysbetoys.org.uk/about/retailers"]
title = "Retailers - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "Shops that have dropped the signs We’re pleased that we have persuaded most major UK toy retailers to remove the boy/girl signs and let toys be toys. So, who made the change? Boots Boots agreed to remove ‘boys toys’ and ‘girls toys’ signs after widespread criticism, focused on the categorisation of science toys under ‘boys’. Read more about Boots’ decision to drop gender signs. Centre Parcs Center Parcs’ on-site toy shops took gender labelling a step further, with signs telling shoppers the kind of fun that’s on offer for ‘Justboys’ or ‘Justgirls’! They originally told us that their toyshop refurbishment had had ‘very positive feedback’ from customers, but they confirmed in January 2014 that all the gender-specific signs had been removed. Read our letter to Center Parcs from May 2013. You can Tweet Center Parcs directly, or contact Nuance Group, who run the toy stores, to tell them what you think. Tweet to @CenterParcsUK Email: info@thenuancegroup.com Debenhams We wrote to them, and many supporters tweeted them back in May 2013. They finally responded in October with the good news that they would remove the ‘boys’ and ‘girls’ toy signs. Read more about the changes. Why not tell them what you think? Tweet to @Debenhams Facebook: Post on Debenhams Facebook page Email: head.office@contactdebenhams.com The Entertainer The Entertainer announced in July 2013 that they would replace all their ‘girls toys’ and ‘boys toys’ signs with themes such as ‘Action and adventure’ and ‘Construction’ in all stores by Christmas the same year. However the blue flooring and signage for ‘action and adventure’, pink for ‘pretend and play’ still send clear messages about what boys and girls are expected to enjoy. Read about our meeting with The Entertainer. Tell The Entertainer what you think of the changes: Twitter: @EntertainerToys Facebook: Post on The Entertainer Facebook Page Email: customerservice@theentertainer.com Fenwick Fenwick didn’t respond to our letter asking them to remove their ‘Girls’ and ‘Boys’ signs in their toy departments. Read our letter to Fenwick. But the signs were replaced with thematic signs such as ‘Dolls’ and ‘Craft’. Let Fenwick know what you think. You can find contacts for individual stores, or Tweet or write to their flagship Newcastle store. Tweet to @fenwicknew Hobbycraft Hobbycraft came out top in our 2013 survey of toyshops. We’re delighted that Hobbycraft have replaced their ‘Craft kits for girls’ signs with gender-neutral signs organising their kits by theme and type. Why not get in touch and tell them what you think? Tweet to @Hobbycraft Facebook: Hobbycraft Facebook Page Email: customerservices@hobbycraft.co.uk John Lewis John Lewis in store toy sections do a great job of organising toys by genre, not by gender, so we were glad to see in 2016 that they’d dropped the ‘Gifts for boys/Gifts for girls’ filters on their website. In response to our letter to John Lewis they had said that they used gender filters as an additional way for customers to view toys, and that they were popular. Read John Lewis’s reply, and our response. John Lewis have also made changes to the labelling and merchandising in their children’s clothing sections. Tweet to @johnlewisretail Facebook: John Lewis Facebook page Marks and Spencer Following contact from Let Toys Be Toys M&S said in May 2013that they were reviewing their toy ranges, and subsequently announced that all their own-brand toys would be gender-neutral by Spring 2014. See our correspondence with M&S. New inclusive ranges are now on the shelves, including colourful art materials for boys and girls, and all toys are displayed under signs saying ‘Toys and Books for Kids’ instead of ‘Boys’ or ‘Girls’. Tell M&S what you think: Tweet to @marksandspencer Facebook: Post to the Marks and Spencer Facebook Page Email: customer.services@marks-and-spencer.com Morrisons Morrison’s told us in June 2013 via Twitter that they would be taking down their ‘Boys Toys’ and ‘Girls Toys’ signs, saying “We’re really sorry about this. Please be assured that all the old signage is being updated.” Morrisons came out as the worst offender for gendered marketing in our 2013 toyshop survey, with the old signs still in widespread use, or replaced by identical pink and blue signs with the words ‘Boys’ and ‘Girls’ removed – not much of a step forward as they still tell children there are two kinds of toys, pink ones and blue ones… We’ve sent a copy of the survey to Morrisons and asked for their response but have not yet had a reply – read our letter to Morrisons. Please let Morrisons know what you think, and do email or tweet us @LetToysBeToys photos of any in store signage you see. Email Morrisons using their online customer services form. Morrisons facebook page Next Every single toy in Next’s Christmas 2012 toy range was packaged and labelled as ‘Boys stuff’, from plastic jungle animals to pocket fans, torches and dinosaurs. We’re pleased that their toy ranges for Christmas 2013 and subsequent years was more inclusive. Read our letter to Next. However, in 2020 several supporters spotted toys being labelled as ‘for girls’ or ‘for boys’ in their email circulars. Let Next know what you think: Next facebook page Sainsbury’s Sainsbury’s responded to our letter, saying that they agree with the direction of the Let Toys Be Toys campaign, and that ‘Boys’ and ‘Girls’ signage in stores is already being phased out, and gender categories removed from their website. Read our correspondence with Sainsbury’s. Please let Sainsbury’s know what you think: Tweet: @Sainsburys Facebook: Post to the Sainsbury’s Facebook page Email: customerservice@sainsburys.co.uk Tesco Tesco have said they will be removing all gender labels from toys on their website, and from stores. We do still occasionally hear about Boys’ and Girls’ Toys signs still up – do send us photos and location if you see any. Tesco have also been doing a good job of including boys and girls playing together, and playing in non-stereotypical ways in their toy catalogues and adverts. Tell Tesco to keep up the good work: Tweet: @UKTesco Facebook: Post to the Tesco Facebook Page tescodirect@tesco.co.uk Toys R Us We’re thrilled that Toys R Us have committed to work towards marketing toys in a more inclusive way, and that this announcement generated so much media coverage and discussion of the issue of gendered toy marketing. We also raised with them the issue of ‘boys’ and ‘girls’ filters on their website in December 2014. We followed up with Toys R Us in May 2015 – read our letter – and were thrilled to see Toys R Us drop gender filters from their website in 2015. Read all posts about Toys R Us. Let Toys R Us know what you think. Tweet to @ToysRUsUK Facebook: Post to the ToysR Us Facebook page Email: ukcustomerservices@toysrus.com TK Maxx We were really pleased that TK Maxx responded to our letter & phone call and took down their in-store shelf-edge ‘boys’ and ‘girls’ toy labels. Wilko In 2012, Wilkinson’s own brand toys had prominent ‘Just for boys’ or ‘Just for girls’ on the packs. We tweeted Wilko in July 2013 to ask about their toy range and they replied: “We are in the process of updating our packaging which does take on board feedback, but this obviously takes a little time. The new packaging will be in store later this year.” New, more inclusive packaging is now available. Let Wilko know what you think Email Wilko using their customer service online form. LoveWilko facebook page."
