["https://www.lettoysbetoys.org.uk/the-2020-let-toys-be-toys-silliness-awards"]
title = "The 2020 Let Toys Be Toys Silliness Awards - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "31st December 2020 In a year no-one is likely to forget, however much we might wish to, our annual round-up of sexist silliness may not seem the highest priority. But our supporters have been as vigilant as ever in drawing to our attention the daftest examples of gendered marketing they have had the (mis)fortune to come across. So, in as much the spirit of light relief as outrage, we bring you some of 2020’s silliest products. Let me count the ways We’ve seen different stickers, reading aids and even bibles for girls and boys, so it was with weary inevitability supporter Penelope spotted Amazon flogging this somewhat odd concept of ‘girls maths’. Another example of such casual sexism came in the form of a superheroes worksheet sent home from one kid’s school, in which the one and only Wonder Woman became a generic ‘Princess’. Play your cards right! Some of us will remember the card game Happy Families from our childhoods, with its somewhat narrow and outdated view of family make-up and allotted occupations. As we embark on the second decade of the 21st century, surely such things would be largely left to the archives? Sadly no, as this version found in The Works demonstrates. “Shocked at how sexist & dated these new playing cards are; all the women…are labelled as eg ‘The Mechanic’s Wife’. Erm, if she is also a mechanic, why isn’t she just called ‘The Mechanic’? It’s 2020 @TheWorksStores – sort yourselves out” #SexistPlayingCards #Womenarentjustwives Thanks to Ellen H to drawing our attention to this. Food without much thought Many of our silliness awards throughout the years have shown how products continue to draw on very sexist expectations of gender. One of the most annoying is surely the idea that girls should aspire to be restrained and rein in their appetites, while boys let rip and can be as greedy as they like. The ‘bad boy’ vs the ‘good girl’ breakfast perfectly sums this up. Thanks to @brokenbottleboy for spotting this one. Vote with your feet Another tedious dichotomy is the beauty vs brains one, drummed in from an early age as illustrated by these little booties tweeted by @PepiteSexiste in France, ‘Belle comme Maman’, ‘Intelligente comme Papa’. Jobs for the boys BM Stores really outdid themselves with this one! Their Headband Guess Game came with a range of occupations apparently exclusively occupied by white males, with four female options of ‘nurse’, ‘maid’, mermaid’ and ‘witch’. As @chrisghull put it, “your game should come with a warning it’s not suitable for anyone born after 1955” and prompted some excellent responses on our timeline. We suggest not buying their game and continuing to create your own using Post-it notes and a modicum of imagination. The masks slip Finally, of course, one item became essential this year. Some made of it an artistic one-off, a fashion item, a beautifully crafted reusable feature… while others couldn’t resist the opportunity for some crude in-your-face stereotyping. Here’s just a few of the many gendered face masks that we were tweeted this year. So that’s that for this year and it only remains for us to wish you all a very Happy New Year… and to hope that 2021 is an improvement on its predecessor. Share6"
