["https://www.lettoysbetoys.org.uk/research/teacher-training-survey"]
title = "Teacher training survey - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "Survey finds gender stereotyping missing from teacher training Let Toys Be Toys strongly believes stereotypes restrict learning opportunities and limit children’s ideas about what they can do, and that challenging them can deliver real benefits in terms of children’s aspirations, self-confidence and behaviour. But, in order for this to happen, teachers and educators need to be aware of what this means and how to work towards freeing their learning environments from gender stereotypes. The 2017 BBC documentary ‘No More Boys and Girls: Can Our Kids Go Gender Free?’ demonstrated this clearly in a mini experiment in a UK primary classroom. Changes to classroom practice were introduced focusing in on challenging gender stereotypes – changes that were shown to have measurable positive effects on the children, including improved self-esteem among the girls, and improved behaviour among the boys. The documentary generated a great deal of interest and discussion, especially among teachers. This inspired our survey to find out what training teachers had received around recognising and challenging gender stereotypes. When we asked teachers and educators how understanding gender stereotypes featured in their initial and ongoing training, we found: Only 19% of teachers were advised as part of their initial teacher training (ITT) to challenge gender stereotypes, and that they were not always given ways to combat stereotyping effectively. A quarter of teachers said that their training reinforced, rather than challenged, gender stereotypes. 8 out of 10 teachers had not been offered any training (Continuing Professional Development/CPD) in the previous five years about challenging gender stereotypes and unconscious bias. A full list of our resources for schools is available here Download the full reportDownload"
