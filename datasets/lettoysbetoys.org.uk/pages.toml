["https://www.lettoysbetoys.org.uk/research/2012-research"]
title = "2012 retailer survey - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "Half of stores signpost “boys” and “girls” toys As the Let Toys Be Toys campaign got underway, a group of volunteer parents carried out a pilot survey in November 2012, visiting toy stores, supermarkets and department stores across the UK and Ireland. They were tasked with checking whether they had sections for “boys’ toys” and “girls’ toys”, how strongly these were marked out, and which toys were included in each section. They also looked at the corresponding online toy stores. The initial survey visited 40 different retail branches to gain a snapshot of which retailers were doing the best at letting toys be toys, and which were limiting children’s choices by gender. We found that half of visited stores used “boy” and “girl” labels on their shelves, while a quarter had labels on the toys themselves. Half of stores used single sex pictures on their toys. Half also clustered otherwise unrelated toys by gender. And most stores used colour coding. Certain types of toys were overwhelmingly marketed to boys or girls: DIY – Ten times as many stores promoted toolkits to boys than to girls Engineering – Three times as many stores promoted construction toys to boys as girls Science – Twice as many stores promoted chemistry sets to boys as to girls Beauty – Six times as many stores promoted personal grooming/beauty products to girls as to boys Cooking – Four times as many stores promoted play kitchens to girls as to boys Cleaning – Four times as many stores promoted cleaning sets to girls as to boys Crafts – Three times as many stores promoted crafts to girls as to boys Download the full reportDownload"
