full_description = "Challenging gender stereotypes in childhood Let Toys Be Toys is asking the toy and publishing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys. Why it mattersTips & resourcesToymark shops We believe that play is an intrinsic part of child development and can help shape long-term attitudes and ambitions. When toys and books are narrowly divided into ‘boys’ and ‘girls’ or by pink and blue, we risk limiting the possibilities and interests of our children. Latest blog posts 11th November 2024Dolls & soft toys: Let Toys Be Toys 2024 imagination play gift guideRead more10th November 2024Toys and books under £10 – Let Toys Be Toys 2024 gift guideRead more7th November 2024Let’s Make Music! – Let Toys Be Toys books and toys 2024 gift guideRead more Let Toys Be Toys Silliness Awards Pink globes? Bibles for boys? Every year our supporters help us highlight the worst examples of gendered marketing for our annual Silliness Awards Check them out!"
