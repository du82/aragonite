["https://www.lettoysbetoys.org.uk/retailers-just4asks"]
title = "Retailers #Just4Asks - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "Our asks for toy retailers Let Toys Be Toys is calling on the toy industry to market toys in a more inclusive way. We’re keen to engage directly with toy retailers to talk about inclusive product development and marketing. Contact us at info@lettoysbetoys.org.uk. Here’s what we’d love to see from retailers in their catalogues and promotional material You can download this poster as an A4 PDF ready to print and display. More mixed groups of boys and girls This is a great way to signal to children and adult buyers that this toys is fun for all kids, and that boys and girls do play together. An end to ‘all girl’ and ‘all boy’ spreads Children will draw their own conclusions if only boys or only girls are shown in a particular section. Colour without stereotypes Pink and blue are powerful signals. Let’s avoid using them to direct children’s choices. More examples of children playing outside narrow gender stereotypes Include a diverse range of children in product photos and graphics, challenging narrow stereotypes and showing boys and girls playing together with the same toys."
