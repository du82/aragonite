["https://www.lettoysbetoys.org.uk/the-big-let-toys-be-toys-2020-round-up"]
title = "The Big Let Toys Be Toys 2020 Round-Up - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "22nd December 2020 Aside from the momentous events that have overtaken the world, things have been busy this year in the Let Toys Be Toys universe as we’ve tried to stay as safely active as we can during the pandemic. As the new decade got underway amidst fireworks, the year got off to a cracking start for us, as we were listed in January’s Big Issue Top 100 Changemakers. We were thrilled to be included in this list celebrating “the thinkers, creators and agitators campaigning for a better world in 2020”. Just before much of the world was plunged into lockdown, we took part in the annual WOW Festival at London’s Southbank Centre, where our very own Megan Perryman spoke at a session called Dolls: Life In Plastic, Is It Fantastic? on Saturday 7 March. Alongside chair and feminist journalist Bee Rowlatt, Megan discussed whether 21st-century dolls can help in the fight for gender equality. On the closing Sunday of the WOW Festival, we hosted a Let Toys Be Toys stand offering information about the campaign and enjoying some productive conversations with festival attendees, including our great friends Gender Diary. With gender stereotypes still prominent so many areas of childhood, including children’s media, we were delighted to take part in the 2020 Children’s Media Conference during July, in the Inclusivity Now strand. Campaigners Megan Perryman and Tessa Trabue created an online video The ‘Drip Drip Effect’- How to Combat Gender Stereotypes, with tips for children’s media makers to steer clear of the stereotypes. A preview of the session offered an informative write up of the campaign, and Olivia wrote up her post-conference reflections. In August, we published the worrying findings of our research into gender stereotyping and initial teacher training. The report made the case for including a comprehensive and sustained understanding of countering gender stereotypes in education within initial teacher training and CPD. Read about our findings and the full report. Campaigner Megan Perryman wrote about her own experiences during initial teacher training as well. Campaigner Tessa Trabue was honoured to be asked to be one of the judges for Toy Industries Europe’s inaugural Play for Change Awards, judging toys submitted in the Empowerment category. The judging was shifted online due to the pandemic, with the panel meeting online to discuss the merits of the entries. The winners were announced in September, with awards in the Empowerment category going to Barbie Empowerment (Gold), Twin Science Kit for the Visually Impaired (Silver) and Creatable World (Bronze). Tessa was particularly impressed with the Twin Science Kit, commenting, “It looks like an excellent toy, and is great to see both a boy and girl featured on the box – this ticks the boxes of our asks to toy manufacturers, ensuring that the product packaging is as inclusive as possible.” In early November, campaigner Olivia Dickinson spoke at the international Finding Ada Virtual STEM Conference, billed as a “29-hour extravaganza of talks, workshops, Q&As and more, starting at 9am in Wellington, New Zealand, and continuing through until 5pm in Seattle, USA”. Olivia gave a talk about the history of the Let Toys Be Toys campaign, what’s been achieved since 2012, and why it still needs to exist in 2020. The talk will soon be available to watch from Finding Ada. Unfinished Business: The Fight for Women’s Rights is a fascinating exhibition at the British Library focusing on some of the extraordinary women and campaigns that have worked for change in the UK. We are delighted to be featured in in exhibition in the shape of one our Let Toys Be Toys placards, made for the 2017 Women’s March and donated to the archive of The Bishopsgate Institute. The exhibition runs until 21 February 2021. Finally, to round off a year like no other, we were thrilled to see the launch of the report, Unlimited Potential, from the Fawcett Society’s Commission on Gender Stereotypes in Early Childhood on 15 December. Let Toys Be Toys was proud to be on the Commission and to take an active role in both submitting and considering evidence to the Commission. The report garnered plenty of column inches of media coverage, including in the Guardian, Independent and Telegraph, and culminated in a launch event on Tuesday 10 December. Speakers included Gillian Keegan MP, Parliamentary Under Secretary of State for Apprenticeships and Skills at the Department for Education, Janeen Hayat, Co-Founder of You Be You, and Commissioners Jess Day of Let Toys Be Toys, Owen Thomas of Future Men and Professor Becky Francis, Chief Executive of the Education Endowment Fund. We hope the report will be a stepping stone to lasting change. Share0"
author = "Tessa Trabue"
