["https://www.lettoysbetoys.org.uk/tvads2021"]
title = "Who gets to play now? – new research on TV toy ads - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "16th December 2021 New research from Let Toys Be Toys shows real progress since 2015, with more ads featuring both boys and girls, and fewer categories where either boys or girls are excluded altogether, but stereotypes still widespread. Let Toys Be Toys volunteer researchers analysed over 300 ads to examine what they’re telling kids about what it means to be a boy or a girl, repeating research carried out in 2015. While there’s been some progress, stereotypes are still alive and kicking in toy ads – take a look at our word clouds below to see the contrast between the vocabulary in ads featuring only girls, only boys and both boys and girls. We saw no reduction, and even a slight increase in the proportion of ads featuring only girls, or using stereotypes associated with girls, dominated by pink and glitter. These ads focused on themes of fashion, beauty, ‘be nice’ and consumerism. Who gets to play now? Download full TV toy ads research report (PDF) More boys and girls playing together • 49% of ads featuring children have both boys and girls, up from 36% in 2015. Girls joining the boys The proportion of ads featuring only boys dropped from 29% to just 12%. • 29% of ads for vehicles (11 out of 38) featured at least one girl, up from just 4% in 2015 (1 out of 25).• 63% (5 out of 8) ads for construction toys featured girls, up from just one out of 7 in 2015.• 100% (5 out of 5) of ads for toy weapons featured both boys and girls. In 2015, 6 ads in this category featured only boys, and one only girls. But the ‘pink zone’ is still mostly ‘no go’ for boys 30% of ads featured only girls, up from 28% in 2015. The proportion of ads featuring no children had increased and 42% of these were strongly ‘feminine’ coded in a similar way to the ‘girl only’ ads, with pink colour schemes, female voiceovers etc. So while we’re seeing an increase in boys and girls playing together, this is mostly in the form of girls being included in traditionally ‘masculine’ activities like playing with vehicles or construction toys. The good news is that out of 13 ads for baby dolls, three featured boys (23%), up from 0 out of 4 in 2015. But otherwise, there’s not much sign of boys being included in play activities traditionally seen as ‘feminine’. This trend conveys a strong message that a concern with appearance, glamour and fashion is associated with being a girl. It also excludes boys from creative fun, and from nurturing or caring play. Children’s viewing patterns have shifted, with 96% viewing content via Video on Demand (VoD) services, and only 56% via broadcast TV, but toy ads remain a key way that children are exposed to gender stereotypes – see our why it matters page, or the Unlimited Potential report from 2020 for more on why gender stereotypes are harmful to children. Read our full report for more on the specific issues raised by the rise in VoD. It’s great to see some real progress since we looked at ads in 2015, with a higher proportion of ads including both boys and girls, and more girls appearing in ads for vehicles and construction for example. There’s definitely more to do though, particularly in tackling the overwhelming pinkification of ads and products aimed at girls. Our four asks for advertisers below give some simple principles to think about. What do the words in ads say to kids about boys and girls? Key words used in ads featuring only girls focused on appearance and beauty (fashion, wear, style, stylist, glitter, glam, cool), consumerism (shop, mall), magic and fantasy (magic, magical), and relationships (love, cute, together, talk). The language in ads featuring only boys was dominated by themes of action (speed, activate, race, spin, flex) and conflict (battle, fight, smash, blast). Ads featuring both boys and girls together had a vocabulary covering a wider range of types of play and fun (game, fun, care, adventure, create, play, magic, make). Time for change in the ad industry There is growing recognition of the negative effects of gender stereotyping in marketing and advertising. Since we last looked at toy ads in 2015, a new rule has been added to the UK Code for Broadcast Advertising, that “Advertisements must not include gender stereotypes that are likely to cause harm, or serious or widespread offence”. While there have been no rulings on toy ads to date, it’s likely that the new rule has prompted advertisers to think about avoiding stereotypes in the commissioning and creative process. #Just4Asks We have four simple headline asks to encourage advertisers to think more creatively about how they promote toys to avoid stereotypes A free downloadable poster is available to go with these four asks, and four shareable videos, showing best practice, with examples showing how it’s possible to promote toys in an inclusive way. Boys and girls playing togetherInclude a diverse range of children, with mixed groups of boys and girls playing with the same toys in the same ways. Avoid a token boy or girl. Watch the video RepresentationSteer clear of narrow idea of what it means to be a boy or a girl. Show children as friends and equals, and include diverse families. Watch the video Colour without stereotypesPink and blue are powerful signals – let’s avoid using them to direct children’s choices. Watch the video Ditch the clichesMusic, voiceover, setting, stereotyped motifs and language can all be used to indicate to children that a toy or game is not really meant for them. Let’s see more variety all round. Watch the video Detailed guidance for creatives A new guide – Smashing Stereotypes in Advertising – has been published by LIONS and The Fawcett Society to support advertising, marketing and communications practitioners who want to actively challenge gender stereotypes throughout the creative process. It provides a blueprint for action, with case studies and checklists for the creative industry to draw upon at every stage, from pitching and storyboarding to styling and casting. Who gets to play now? Download full TV toy ads research report (PDF) Share1"
