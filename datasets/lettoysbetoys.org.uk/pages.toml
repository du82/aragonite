title = "15 fun STEM toys and books - Let Toys Be Toys 2024 gift guide - Let Toys Be Toys"
description = """
This is a bit of a messy one and is for all those curious kids who love mixing things together then seeing what happens –  which is most!  These kits contain up to 4 activities (depending on size chosen) that bubble, heat up, foam, ooze,  and change colour. The Potent Potions box contains:
⛲ Fizzing Fountains – test chemical reactions to discover which mixture makes the best fizzing fountain.
🌈 Colour Changing Potion  – craft a potion that’s the envy of any witch or wizard!
🌋 Erupting Slime (Jumbo/Tots only) – mix chemicals to make a foaming slime.
💭 Big Bubbles (Jumbo/Tots only) – make the best bubble mixture ever and engineer a bubble blower for enormous bubbles!
⚛️ PLUS a collectable Molymod mini kit! *Jumbo only*"""
full_description = "30th October 2024 As well as being fun, STEM (Science, Technology, Engineering and Maths) toys and books are a great way to build skills such as problem solving, spatial awareness and critical thinking. We’ve chosen a variety of toys and books at a range of prices from £2.75 upwards to help curious children everywhere develop an interest in science and discovery. All shops featured on this page have received the Let Toys Be Toys Toymark award – our good practice award for the stores that are getting it right and marketing to children inclusively. Quadrilla Race to the Finish Marble Run Get started building your own marble runs with this Quadrilla beginner’s set. Drop two marbles into the top and watch as they race down different paths to the bottom. These marble runs are completely unique for their design in that they require the child to assemble and decide which blocks connect together to make the marble drop down a path. Great for STEM skills. Suitable for ages 4+ £41.99 from Timeless Toys Lanka Kade Scientist Figure This natural scientist figure has a white and blue design with a beautiful wood grain edge – each one is unique! Add this figure to any children’s toy collection for hours of play at a pocket money price. Printed on both sides showing a natural wood grain edge and a super chunky size, perfect for little hands, this fair trade wooden toy is handcrafted by skilled artisans in Sri Lanka from sustainably sourced rubber wood and non toxic paints. Suitable from 10 months + £2.75 from Imogen Ruby Maths Lab: Exciting Projects for Budding Mathematicians A fun and engaging STEM activity book for kids that combines creativity and calculations – perfect for budding mathematicians! Choose between 27 creative projects and experiments that will turn your child into a maths whizz! It’s the perfect book for curious minds interested in taking the mystery out of maths. Explore the exciting world of numbers and maths problem-solving! Easy-to-follow step-by-step instructions will show you how to make each project. All materials used can be easily found around your home with no specialist equipment needed. Every project includes an explanation of how maths is involved in creating the project or the results of the experiment. Real-world maths projects show that maths isn’t just abstract – it has an impact in the real world too! Produced in conjunction with the Smithsonian Institution, Maths Lab is designed to appeal to maths geeks and those that prefer practical projects. Age guidance 9-12 years £12.99 from Nickel Books Magnetic Wooden Prism Pocket Pouch by Tegu Who can make the most imaginative creation? This fabulous wooden set will be a hit with children and adults. The magnets sealed inside the wood allow you to create seemingly impossible structures and so many different shapes. A fun introduction to design, engineering, maths and endless imaginative play! All Tegu’s sets are fully compatible – with the magnets the fun just keeps on growing. This 6-piece set has four triangular prisms and two parallelograms. The set comes in a felt pouch, perfect to grab and go. Every block is carefully designed to work with the others, and to fit in a child’s hand. These pocket pouches are neat enough to take out and about and will keep children entertained for hours. Great for restaurants, long journeys and offices. Suitable from 1 year £22.00 from Good Things Gifts Potent Potions Science Kit This is a bit of a messy one and is for all those curious kids who love mixing things together then seeing what happens – which is most! These kits contain up to 4 activities (depending on size chosen) that bubble, heat up, foam, ooze, and change colour. The Potent Potions box contains: ⛲ Fizzing Fountains – test chemical reactions to discover which mixture makes the best fizzing fountain. 🌈 Colour Changing Potion – craft a potion that’s the envy of any witch or wizard! 🌋 Erupting Slime (Jumbo/Tots only) – mix chemicals to make a foaming slime. 💭 Big Bubbles (Jumbo/Tots only) – make the best bubble mixture ever and engineer a bubble blower for enormous bubbles! ⚛️ PLUS a collectable Molymod mini kit! *Jumbo only* Curiositots and Tots Nano box suitable for ages 4-6; The Jumbo Box and the Nano suitable for ages 7-11 Prices range from £16.00 – £28.95 depending on box chosen at The Curiosity Box Ada Twist, Scientist Get ready to inspire your small scientist with Ada Twist, a curious child who asks endless questions about the world around her. This beautifully illustrated rhyming book is perfect for encouraging interest in STEM subjects for children aged 3-7 years old. As Ada grows up, her curiosity leads to hilarious adventures and even a stint in the Thinking Chair! This book celebrates the importance of supporting your child’s curiosity and creativity, while also promoting greater representation of girls – and girls of colour – in STEM subjects and industries. Inspired by Ada Lovelace, the pioneer mathematician and programmer, Ada Twist is a must-read for all young, inquisitive minds. Age guidance 3-7 years £12.99 from All the Kids Little Wise Box of Maths The Little Wise Box of Maths is a magnetic educational toy offering a fun and interactive way for 3-6 year olds to learn all about maths. The activity set is a great homeschooling educational toy as well as an ideal fun and interactive learning bridge between home and early years settings/early school. All aspects of early years maths are covered including areas such as numbers, shapes (including 3D shapes), distances and sizes. The maths kit also comes with a 1-20 number line and apple magnetic tabs to make arrays, which are really useful tools kids can use when exploring numbers (guidance is provided in the accompanying activity book). Everything is tucked away in a small A5 size box making it a perfect educational and learning travel game for kids that can be used on the move, as well as at home. Recommended ages 3 – 6 £17.00 from Little Wise Toys Inventions Aircraft Building Kit The sky’s the limit with Toyi’s fantastic Inventions Aircraft Building Kit! Soaring to new creative heights, this innovative craft kit is perfect for turning everyday household items into incredible flying machines. Young pilots can use the 44 construction pieces to build their own water bottle jet or milk carton cargo plane! Teaching kids to upcycle through play is an excellent way to instil sustainability and foster an eco-conscious mindset from a young age. Additionally, using their creativity to design unique planes, helicopters, and rockets will greatly enhance their creative thinking, problem-solving abilities, and cognitive development. Toyi’s eco-friendly craft kits are made from recycled plastics, inspiring children to give new life to disposable items by transforming them into toys. Complies with European safety standards. Suitable for ages 6+ £14.99 from Yes Bebe Walk and Wonder Activity Tin Fun and educational activities, family games and conversation starters to help your child learn on walks and journeys! A unique, sustainable, plastic-free gift to help get little legs from A to B and learn together playfully! These innovative activities have been carefully designed to boost your child’s curiosity and listening skills and develop an appreciation of the natural world. Have these nifty ideas at your fingertips, in a perfectly portable tin, to make learning fun with all these playful challenges along the way. These clever activities will make return journeys home with tired legs so much easier. Recommended ages 2-10 £12.50 from Happy Home Learning STEM Detectives: The Case of the Missing Noodles It’s noodle day at school, but all the noodles have gone missing… Can you help to solve the case? You will need to put your skills in science, technology, engineering and maths to the test, but don’t worry, the great STEM Detectives are on hand to help! If you crack the case, you could even become part of the STEM Detectives yourself. Get over to the evidence board and start investigating! Age guidance 5-7 £12.99 from News From Nowhere Water Songs by Mandy Ross, illustrated by Sam Rudd New for November 2024: a true cascade of poems that combine learning with the art of words. Beautifully illustrated by Sam Rudd, this collection of haunting and lyrical songs by Mandy Ross explores and celebrates our relationship with water in its many forms – playful, industrious, productive, life-giving – and more. With a strong environmental message, this book will be a source of fascination and inspiration for young readers and poetry lovers of all ages. £7.99 from Child’s Play Books Insect Lore Butterfly Garden – Growing Kit This educational kit from Insect Lore (also a Toymark award winner) gives children, students and families an unforgettable opportunity to watch caterpillars change into chrysalides and then emerge as beautiful Painted Lady Butterflies. Raise and feed your very own butterflies and then release them into the wild! The entire transformation from caterpillar to adult butterfly takes about three to five weeks. The Live Butterfly Garden Includes: Pop-up, reusable 30cm tall super clear mesh habitat; A voucher for a Cup of 3-5 LIVE caterpillars with food (caterpillars available March to mid-September) You just head to the Insect Lore website to order and pay for delivery; Feeding Pipette; Complete instruction guide; Chrysalis station; Insect Lore sugar packet to make your very own butterfly nectar (arrives with the caterpillars) Recommended ages 4+ (family activity requiring adult supervision) £20.00 from Button and Squirt Woodland Animal Tracks and Signs Cards Comprising 18 cards in 3 sets of 6 (animals, tracks and poo), these cards to help children connect with nature and improve their wildlife knowledge. Learn through play with games like pairs or snap, take out and use to identify animal tracks and signs or use as a storytelling prop, matching the card to the animal whilst reading What The Oak Tree Sees (also available from Hiddel Brock Wood). All track and sign illustrations are technically accurate and most are actual size for ease of identification in the field. Simple illustrations and labels for younger children are supplemented with more details for adults and older children. Suitable from age 3+ £9.00 from Hiddel Brock Wood Happy Squares Rainbow Set With these Happy Squares (also a Toymark winner) your young architect can create an infinity of inventions, such as house, theatre, totem, shop, kitchen, rocket, shelter, reading corner, vehicle, etc. all while developing fine motor skills, balance, imagination & exploration, vocabulary, counting, problem solving, knowledge and understand of the world. The cardboard is made from recycled materials and sourced in the UK and the bags are made of GOTS certified organic cotton, and are screen-printed in Wiltshire with eco-friendly based inks. Recommended age 3-8 years From £14.00 from Okido Oceans Memory Match and Snap Game Dive deep into the Ocean Memory Game and train your brain with this portable pack of 44 jumbo playing cards showing incredible Ocean life! Play snap and the classic memory game but, let me warn you . . . these aren’t just for kids but grown-ups too! So, how good is your memory compared to your kids? The perfect family game at home or whilst travelling. This game boosts memory, recognition and concentration, speech and vocabulary and most of all happiness. Suitable for ages 3+ £12.95 from Happy Little Doers First Book of Numbers – Animals A sweet introduction to numbers, this Let’s Count book is an ideal gift for the littlest member of the family! The vibrant colours and simple illustrations make learning to count fun and engaging. £4.95 from Busy Brain Activity Packs Wooden Mechanical Model Tractor This tractor is a wonderful piece of engineering that is both creative and innovative. It’s easy to assemble thanks to the clear instructions provided. It’s a great starter piece for younger mechanical model fans. Made from sustainability-certified* birch plywood, this set contains 54 parts and 6 spare parts, Rubber bands, Axles (large and small) and ruler and thread. There is no need for paint or glue but you can choose to paint it if you want! Suitable for age 8+ £12.00 from Jiminy Eco Toys For more stereotype-free shopping, check out our Toymark directory of great inclusive retailers, along with our other gift guides on a range of themes. Share0"
