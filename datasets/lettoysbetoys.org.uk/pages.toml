["https://www.lettoysbetoys.org.uk/research/2013-research"]
title = "2013 retailer survey - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "A year into the campaign finds positive indicators of change A year after our first research into the gendered marketing of toys on the high street, we launched a follow-up survey. Some 209 stores across the UK and Ireland were visited by members of the public to find out what, if any, progress was being made. Most stores still demonstrated some level of segregation by gender, with 72% using some form of gender cues (such as grouping stereotypically girls’ toys together rather than organising by type). However, the survey provided evidence to confirm the significant ways in which UK and Irish stores have adapted to become less gendered. The research also revealed that although the signs are coming down in many stores, a majority of retailers still used gender in their marketing in some way. Encouragingly we found examples of good practice to highlight where stores demonstrated how to market toys in an inclusive way. Download the full reportDownload"
