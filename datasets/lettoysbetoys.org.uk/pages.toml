["https://www.lettoysbetoys.org.uk/toyads-just4asks"]
title = "Dear toy advertisers... #Just4Asks - Let Toys Be Toys"
description = "The Let Toys Be Toys campaign is asking the toy and book publishing, advertising and manufacturing industries to stop limiting children’s interests by promoting some toys and books as only suitable for girls, and others only for boys."
full_description = "15th December 2021 We’re calling on toy advertisers to market toys in a more inclusive way. Our 2015 research on TV toy ads found that the majority of TV adverts showed boys and girls playing separately, in very stereotypical ways. We’ve repeated the research this year, and while some of the findings are more positive, there is still room for improvement. Our latest findings are here. Below are our four main asks to advertisers. The video links show examples of ads we came across in our project, including ads with great practice as well as highlighting some things we’d love to see improved. You can download this graphic as a PDF ready to print and display. Boys and girls playing together Include a diverse range of children, with mixed groups of boys and girls playing with the same toys in the same ways. Avoid a token boy or girl. Representation Steer clear of narrow ideas of what it means to be a boy or girl. Show children as friends and equals, and include diverse families. Colour without stereotypes Pink and blue are powerful signals. Let’s avoid using them to direct children’s choices. Imaginative language and motifs Music, voiceover, setting, stereotyped motifs and language can all be used to indicate to children that a toy or game is not really for meant for them. Let’s see more variety all round. At Let Toys Be Toys we’re keen to engage directly with toy advertisers to talk about inclusive marketing. Contact us at info@lettoysbetoys.org.uk. Share0"
