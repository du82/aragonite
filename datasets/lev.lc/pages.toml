["https://lev.lc/the-duoton-newsletter"]
title = "the duoton newsletter - notes by @lev.lc"
description = "Today I’m starting the"
full_description = '''June 27, 2023 the duoton newsletter Today I’m starting the "duoton" newsletter, and the "bender" piece will serve as its inaugural issue. That seems like an appropriate moment to discuss the reasons why you should subscribe. Many Substacks and cozy channels on messaging apps have a clear pitch, urging readers to sign up to learn how to excel in a specific area. Something along the lines of “Join this newsletter to embark on a journey of personal growth and discover what makes you the best version of yourself in your own unique way.” But explaining how to become the very best someone in a very important something is not even remotely close to what I want to do. Whether I mentor, coach, or write, I don’t aspire to be an expert. I prefer to embrace being a generalist. My aim is to inspire individuals to trust spontaneity and cultivate their own unique expressions, rather than imitating others. Every now and then, I stumble upon an extraordinary space where someone candidly shares their life stories, thoughts, and ideas, and it is truly beautiful. I also come across artists on social who post digital imprints of their work, evoking the nostalgia of the early days of the internet, when it was much less intimidating place. Not everyone needs to be a marketer, even though “to sell” is inherent in human nature. Unfortunately, the pursuit of selling, just because we gain access to a marketplace, regardless of the product or method, has become a prevalent focus for many. Often disguised as achievement, in my view, its clearly a self-deception. In essence, my intention is to write this newsletter with a deeply personal touch, exploring topics that hold immense significance to me. Here in my emails and on my website, I seek to express my authentic self and invite you to find your own “why” and “what for” leaving behind the confines of measurable normalities. I have no intentions of advertising, tracking, or manipulating my readers, nor succumbing to sensationalism by exploiting current trends. Which brings me to today's duoton character — bender1. to bender — means to twist, shape, or manipulate something, often in a creative or artistic way. It can refer to the act of bending or contorting an object physically or metaphorically.↩︎ linked mentions for "the duoton newsletter": bender As of this moment, I have been in my forties for a straight 15 hours, five of which I spent sleeping. So far, so good! Today, I am launching a new website and starting a newsletter, sending out its first issue called 'Bender'. Take a look at the latest artwork and subscribe to the emails! duotons — is a series of artworks that summons forth the soulful characters, each one an avatar I must then clothe in words. Most arise spontaneously, whimsical lines of understanding In the intricate workings of my curious mind, the distinction between the utterances “I don’t have a ticket to Mars” and “I have a ticket to Mars”'''
