["https://lev.lc/shades-of-many-colors"]
title = "Shades of Many Colors by Charles Eisenstein"
description = "Trump, Kennedy, Palestine, Us, and Them."
full_description = "September 10, 2024 #society #leadership #ideology ✱ Charles Eisenstein However, if one side holds the other as irredeemable, beyond negotiation, then no peace is possible outside of total annihilation, and the side that succeeds in annihilating the other will have destroyed its own soul in the process. But I have never thought that if only presidents or billionaires or CEOs would see the light, they would transform the world. They are less powerful than we think. They seem powerful when they comply with dominant systems and ideologies; when they extend the reigning mythology of civilization. But when they defy it, the forces that had filled their sails turn against them. They may still accomplish beautiful goals, tacking against the wind. But they cannot change its direction. The prevailing winds do change. Cosmic and elemental forces, all co-resonating with human consciousness in evolution, gather and disperse the winds. Therefore my work has been mostly on the level of narrative, to alter the basic myths that run civilization in the background: the discrete and separate self, the human/nature divide, the separation of matter and spirit, the cult of quantity, the illusion of progress, the story of money, the denial of death, the primacy of force-based causality. secure nation needs no force of arms Shades of Many Colors Trump, Kennedy, Palestine, Us, and Them. In the wake of Robert F. Kennedy Jr.’s announcement that he is suspending his campaign to endorse Donald Trump, I’ve received lots of pleas, demands, and requests to declare my opinion on this choice. I was privy to the decision-making process. Countless people reached out to Bobby and those around him with fervent, compelling, and contradicting advice. Many were under the impression that their insights had somehow escaped the candidate. So let me distill the two main arguments, and combine them with one or two other ingredients into a potion that may sooth the divisive passions that Bobby’s choice has ignited. But I warn you, some of the ingredients may induce dizziness and nausea. The temptation, in presenting these two opposing arguments, is to signal in advance which one I favored. I could thereby present the clubhouse password that assures at least one half of my readers that I am still an acceptable person, who has not gone to the dark side in violation of all norms of human decency. So, I will attempt to be inscrutable as I present each argument in the most generous way I can. Argument 1: Stay in the race! You have spent sixteen months building a massive, independent political movement. You have campaigned in part by denouncing the two-party straightjacket that is strangling our country, and you have offered an alternative. You have inspired hope in tens of millions of supporters, including a hundred thousand volunteers who have worked tirelessly on your behalf, and a similar number of donors. They dug deep, because they believed in you. You are the standard-bearer for an independent movement that can liberate the country. Even if you don’t win this election, you will have laid*** the foundation for future candidates. Change does not come overnight. But if you join Trump, the most divisive figure in American politics, all of this effort will have been wasted. You will have betrayed the people who believed in you. The people who stood out in 117-degree heat and bitter cold to collect signatures for you. And for what? For empty promises from a man who is famous for not keeping his word? For someone who will ditch you the moment it becomes expedient? For someone who evokes the worst impulses in the American psyche? Don’t be naive. Don’t give up now. In any hard journey, the key moment is when if seems all is lost. If you push through that moment, you will find on its other side that the goal was not so far way after all. Argument 2: Join Trump! You have been steadily sinking in the polls, and this campaign is feeling more and more like a vanity project. You can continue this impossible crusade, pretending to your supporters that you can actually win when you don’t believe it yourself. You can take their hard-earned donation dollars, and become a footnote in history, perhaps as the one who split the anti-establishment vote and handed the election to the Democrats — to the party that has reviled you, censored you, sabotaged your campaign, and waged legal warfare against you… to the party that IS the establishment. If you can’t win, you can still avert the catastrophe of another Democratic administration that will continue to pursue the neocon agenda of endless war; that will consolidate its powers of propaganda, surveillance, and censorship to a degree where elections will become meaningless; and that will continue to be the lackey of big tech, big pharma, the military contractors, and Wall Street. But you can have a huge influence in the Trump administration. You can help him root out corruption from the federal agencies. He wanted to drain the swamp, but he didn’t know how. You know how. You can reform the health agencies and save millions of children from death and misery. You can fulfill the mission to which you’ve dedicated your career. And you can encourage Trump’s best impulses and counteract his worst. Friends, supporters, donors, family, and advisors strenuously warned Bobby that he would be making a horrible mistake if he chose (1). Others issued similar warnings about (2). Sincere, passionate, well-reasoned warnings. In some cases, the same advisor would make one argument one day, and the opposite argument the next, on each occasion believing that argument fervently. The taint of association When Kennedy finally announced his decision to endorse Donald Trump, those who wanted him to stay in the race felt dismayed and bewildered. They reached out to me by the dozens or hundreds seeking explanation, or to commiserate with me. “How are you doing?” “Are you OK?” Many of these outreaches were no doubt sincere. They really wanted to know if I was OK. Yet across the span of hundreds of messages I also detected — or imagined — a subtext. The implicit question was, “Have you gone over to the dark side?” The question of which side I am on — have I “gone over” to MAGA — evokes in me a primal dread. The question cannot be met with a discussion of the relative merits of Trump’s policies compared to those of Kamala Harris. It is asking, Are you one of us, or one of them? Are you an acceptable member of society – my society? Because, Charles, your proximity to the untouchable one now makes you untouchable, unless you purify yourself of his taint by performing the necessary ablutions. The implicit plea then is for me to clearly disavow, denounce, and repudiate Donald Trump along with Kennedy’s alliance with him. Then I will have established myself as an acceptable person again. To make a measured assessment of Trump’s flaws and virtues, or those of the people around him, or the possible ramifications, good and ill, of his administration, violates the requirements of the purification ritual. One must other him. One must cast him out of the circle of one’s “associations.” Which group are you are part of? This is an ancient and terrifying social force. When a witch-hunt is on, you’d better not have any friendly relations with a witch, or with anyone who does. You must protect yourself by loudly condemning witchcraft or, better yet, by joining the witch-hunt yourself. When the hunt was for communists, you had to make sure not to associate with anyone accused of being one, lest you be named a “fellow traveler.” The present situation is not quite like a witch hunt, because the Trump camp is not a small or powerless minority. In times of stress, societies turn ever toward a scapegoat or scapegoat class to blame for its troubles and to unify that society in a bloody purge. For the scapegoat class to be a suitable receptacle for society’s fear and anger, it must be marginal and relatively powerless. Then the witch-hunt, the lynching, the pogrom can claim its victims without igniting a civil war. Civil war is exactly what we will face if the polarized thinking that sees human affairs in terms of my side and your side continues to intensify. In the United States, civil war could erupt in the event of a widespread perception of election cheating or, in case of a Trump victory, social turmoil leading up to an attempt at a “color revolution.” On the species level, we are already fighting a civil war. All war is civil war. Equally grim, the civil unrest that might follow a disputed election will be a pretext for an authoritarian crackdown. The establishment will consolidate its control over the public, the media, and the Internet. It will co-opt or take down free speech platforms like Telegram and Twitter. It will deploy terrifying AI-enhanced technologies of surveillance and censorship, silencing dissent in the name of “combating mis-, dis-, and malinformation.” It will freeze the bank accounts of dissidents. It will imprison political opponents. Meaningful elections will cease. And there will be nowhere to hide, because these totalitarian powers transcend national boundaries. The more divisive, the more contemptuous, the more hateful, the more inflammatory the political rhetoric, the more we set the stage for these outcomes. A bilious gas spouts from both the left- and the right-hand burners of the stove. Its stench fills the house. And this election is sure to generate plenty of sparks. That is why I refuse to play the game of distancing and denouncing. I first felt the heat of this drama around 2018, when I was a guest on Russell Brand’s podcast. Shortly thereafter, Russell hosted Jordan Peterson. So, I was on the same platform as Jordan Peterson. I soon received emails demanding that I “distance myself” from Russell Brand and denounce his association with Peterson. The popular kids had declared that Jordan Peterson had cooties. Therefore Russell Brand had cooties too, and so would I if I didn’t distance myself. What does it mean to “distance oneself”? It means to issue a ritual denunciation of the dehumanized subject of the mob’s ire. I am sure a lot of my readers would be feeling more comfortable right now, if I had begun this essay with a ritual denunciation of Donald Trump. And some of you are scrutinizing my every word to discern at least a hint of scorn, a subtle signal, to assure them that I’m on the side of decency and virtue, to quell the horrified suspicion that, having been a close advisor and speechwriter to RFK Jr., I might migrate my skills, my support, my endorsement to Donald Trump. Another portion of my readers would be delighted if that were the case. But if this is the focus of your scrutiny, my message will pass you by. Winning is not the main goal What is this thing we call an ‘endorsement’? It says, “You should vote for this candidate,” and it settles which camp I identify with. But I do not believe that “you” (for there are innumerable unique you’s) “should” vote for any particular candidate. If that seems like non-committal aloofness and fence-sitting you may want to ask me, “Will you work to get Trump elected as you worked to get Kennedy elected?” Well, why do you want to know that? Maybe because then you will know whether I am “us” or “them.” You will know whether to continue reading my work. And I will have capitulated to the tribal impulse that is driving society toward disaster. I would prefer people to accept or reject my writing on its own merits, and not based on which (if any) political tribe I belong to. But to answer the question, my highest priority as a campaign advisor and speechwriter was never to get the candidate elected. Yes, of course, I wanted him to win, but my main fidelity was (1) to that which his campaign might serve: truth, peace, transparency, freedom; and behind all those, a new story for civilization, and (2) to the best version of himself that I could witness, believe in, and encourage as an advisor and a friend. From within the mindset of politics, winning an election seems like the most important thing in the world. Everything rides on it. Oh, the changes you will make if you get elected! ==But I have never thought that if only presidents or billionaires or CEOs would see the light, they would transform the world. They are less powerful than we think. They== ==seem== ==powerful when they comply with dominant systems and ideologies; when they extend the reigning mythology of civilization. But when they defy it, the forces that had filled their sails turn against them. They may still accomplish beautiful goals, tacking against the wind. But they cannot change its direction.== ==The prevailing winds== ==do== ==change. Cosmic and elemental forces, all co-resonating with human consciousness in evolution, gather and disperse the winds. Therefore my work has been mostly on the level of narrative, to alter the basic myths that run civilization in the background: the discrete and separate self, the human/nature divide, the separation of matter and spirit, the cult of quantity, the illusion of progress, the story of money, the denial of death, the primacy of force-based causality.== Lest this mission sound grandiose, I hasten to add that my part in it is very small. A light lift. The heavy lifting has been done by those who, through thankless sacrifice and patience, have built a field of love, kindness, healing, and generosity. They are the ones who summon the wind. We story-tellers merely draw on energy of their sacraments. So, who is really in a “position of power”? Today somewhere in Sudan or Haiti or Gaza, a man gave up his last piece of bread to a grandmother he barely knew, so that she could feed a famished child. He never advertised his sacrifice. Maybe no one will ever know. Maybe neither he, the child, nor the grandmother will ever live to tell the tale. The dominant theory-of-change says that his sacrifice, therefore, had no effect on the world. But anyone who is fortunate enough to witness such an act understands upon witnessing it that something important has happened; that it was in service not just to that child, but to all children; that a principle of human nature has been fortified; that a declaration has been issued to God’s witness: “This is what a human being shall be. This is what a human being shall choose.” These are the hidden yogis who have held our world together. I will be sharing their stories from time to time in this column. When I do, it won’t be because I am retreating from the pressure and danger of the political engagement that actually changes things. It will be because these are medicine stories that help cohere a new-and-ancient mythology. When they are heard, and gratitude and honor flow into them, the guardian spirits of this world gain strength. Nonetheless, as fate and circumstance have brought me adjacent to the circles of the “powerful,” I will continue to devote to them a portion"
