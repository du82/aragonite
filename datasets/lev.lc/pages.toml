full_description = '''10 notes tagged "coaching" now Nov 2024 Interspersing writing, drawing, reading, and practicing keeps my ideas fresh and creativity sharp. Breaks from projects let solutions emerge. Small iterative improvements prevent burnout and sustain momentum. Working on multiple projects brings new insights and richer outcomes. #drawing #coaching #spontaneity on coaching May 2024 In today’s world, the effort of self-improvement has become a relentless pursuit, with many seeking guidance from various experts, traditions, and #coaching #introspective #autotelic #spontaneity Perspective on Psychological Work May 2024 We often fall into the trap of believing that we are defined by our pasts, that we are our past. The past, however, is merely a construction of the #coaching #individuality #culture #change #concentration #spontaneity heron Oct 2023 In this letter, I explore the metaphor of the Heron battle an inner voice of doubt, represented by a croaking frog. I relate this to doing meaningful creative work by outlining principles from Steven Pressfield's “Do the Work.” We must engage with resistance and persist despite the obstacles. Just as the Heron achieves flight through courage and determination, we realise our potential by battling resistance and ship our creative or entrepreneurial work. #coaching #resistance #distraction #journey #letters the eye of the heron Oct 2023 In “The Eye of the Heron”, Ursula K. Le Guin’s characters must find the strength to stand up for their beliefs and work towards a better future. Luz #coaching #resistance #distraction #journey thrashing Sep 2023 In Seth Godin’s book “Linchpin: Are You Indispensable?”, the focus is on becoming a linchpin—a person who adds unique value to their organization #resistance #creative #coaching Who is a Good Coach? Feb 2023 Coaching assumes clients possess emotional integration and focuses on creating the life they desire, not fixing problems. Effective coaching encourages clients to value themselves and set intrinsic, joy-filled goals. Coaches should never impose their truths, allowing clients' self-actualization through awareness, responsibility, and authentic values. Seasoned coaches prioritize nurturing, intuition, self-expression, and joy while aligning with clients' essence and remaining supportive observers. #coaching #introspective #therapeutic #individuality Why Coach Introspection? Feb 2023 Introspection, while potentially yielding valuable self-knowledge, may also lead to self-obsession and chronic rumination. We have to penetrate the layers of appearances and develop the capacity to hold several contradictory or paradoxical ideas about ourselves in our minds at the same time. #coaching #introspective #journaling #cartesian #society What is Introspection? Feb 2023 Embracing spontaneity and inner genius, we can reshape notions and know ourselves intimately. This self-knowledge lets us create our lives rather than follow others' expectations. Introspection illuminates our inner world. It helps us examine our beliefs, find our voice, and integrate our notions with outer reality. We can understand our roles and personalities, and the difference between our self-perception and others' views. #coaching #introspective #journaling #worldly #spontaneity What are Us? Feb 2023 In today’s society, information, facts, and even concepts like “to be” are taken as concrete, but our intuition, emotions, and somatic response — #society #coaching #cartesian #introspective #journaling ❍ rss feed for notes tagged "coaching"'''
