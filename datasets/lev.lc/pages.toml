["https://lev.lc/english"]
title = "english - notes by @lev.lc"
description = "My writing style is a distinct blend — primarily British English with occasional American influences whenever it fits the moment. I favour em-dashes and en-dashes to maintain a rhythm, spaced for visual appeal. I follow logical punctuation, placing commas and periods outside quotation marks when they don’t belong to the quoted material."
full_description = '''November 1, 2024 #writing #artist #disobedience #deliberate “Style is the answer to everything. A fresh way to approach a dull or dangerous thing — To do a dull thing with style is preferable to doing a dangerous thing without it. To do a dangerous thing with style is what I call art.” — Charles Bukowski english To me, Russian captures the melancholy of late-night kitchen talks, Brazilian Portuguese embodies carefree beach walks, and English handles everything in-between. Less than a millennium old, shaped by migration and the internet, its grammar is forever evolving, making it a true DIY, punk language for artists. Not as refined as French, English’s raw mix of forces grants writers high expressivity with minimal constraints. English, however, is a language of layered diversity. Its spellings drift across conventions, allowing writers to choose shades of tone, hint at personality, or even rebel a little. Its invisible rhythms and regional textures linger beneath, lending each word its own subtle resonance. My writing style is a distinct blend — primarily British English with occasional American influences whenever it fits the moment. I favor em-dashes and en-dashes to maintain a rhythm, spaced for visual appeal. I follow logical punctuation, placing commas and periods outside quotation marks when they don’t belong to the quoted material. You might spot American spellings in words like ‘color’, ‘humor’, ‘honor’, and ‘favorite’ — an intentional choice to omit the ‘u’ found in traditional British English. Yet, I retain British suffix version with an ‘s’ in ‘organise’ and ‘realise’. This reflects the evolution of the Greek ‘-izo’ suffix into the softer, modern ‘-ise’ ending, lending a more natural, contemporary feel to these words without veering into academic rigidity. To keep my writing clean, I avoid repeating words more than several times per piece. English, with over 170,000 words in current use, offers plenty of variety — tools like Reverse Dictionary and “intelligent” assistants help me find the right analogies to keep my linguistic produce fresh. Writing, for me, isn’t about following conventions or fearing rigid rules. It’s about exploring the depths of language and chiselling narratives that feel resonant, stepping beyond dogma to capture expression in its rawest form. linked mentions for "english": now Interspersing writing, drawing, reading, and practicing keeps my ideas fresh and creativity sharp. Breaks from projects let solutions emerge. Small iterative improvements prevent burnout and sustain momentum. Working on multiple projects brings new insights and richer outcomes. Pelevin Empire V A reflection on Pelevin’s Empire V, exploring the philosophical depth and unique language of the Russian book, comparing key chapter Villa dei Misteri in English and Russian, to assess the translation’s ability to convey Pelevin’s style, including his use of matershchina and the word bablós. Hope Victor Ginzburg's upcoming film adaptation may reveal more.'''
