description = "‘Know thyself’ was written over the portal of the antique world. ‘Be thyself’ — the message of Christ to man 1 — shall be written over the portal of"
full_description = '''August 10, 2021 #christian #individuality #society ✱ Oscar Wilde be thyself and the ideas of Jesus ‘Know thyself’ was written over the portal of the antique world. ‘Be thyself’ — the message of Christ to man 1 — shall be written over the portal of the new world. What Jesus meant, was “You have a wonderful personality. Develop it. Be yourself. Don’t imagine that your perfection lies in accumulating or possessing external things. Your affection is inside of you.” Jesus moved in a community that allowed the accumulation of private property, when he talks about the rich he simply means people who have not developed their personalities. Man reaches his perfection, not through what he has, not even through what he does, but entirely through what he is … The ideals that we owe to Christ are the ideals of the man who abandons society entirely, or of the man who resists society absolutely. But man is naturally social. 2 Oscar Wilde’s quote, “Be thyself” — the message of Christ to man, reflects his personal interpretation of Christian ideals rather than a direct biblical teaching. Wilde envisioned a world where individualism and authenticity flourish, aligning this with the essence of Christ’s message of love and acceptance. Though Jesus never explicitly said “Be thyself,” Wilde reimagines his teachings as a call for personal freedom, suggesting that true spiritual fulfillment and societal progress come from embracing one’s unique identity rather than conforming to external pressures. This interpretation beautifully captures Wilde’s advocacy for individualism and creativity.↩︎ reminds me of "Try not to become a man of success but rather try to become a man of value"↩︎ linked mentions for "be thyself and the ideas of Jesus": principles An ongoing exercise of radical introspection expressed through first-person singular writing, the slash-principles page serves as a fluid document that reflects my evolving truths, beliefs, and principles. Discomfort is not an enemy, it’s a teacher! Each tenet is shaped and refined by the hard choices I make, aligning with my personal raison d'être and ikigai.'''
