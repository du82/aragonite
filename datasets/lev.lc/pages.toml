["https://lev.lc/heron"]
title = "heron - notes by @lev.lc"
description = "In this letter, I explore the metaphor of the Heron battle an inner voice of doubt, represented by a croaking frog. I relate this to doing meaningful creative work by outlining principles from Steven Pressfield's “Do the Work.” We must engage with resistance and persist despite the obstacles. Just as the Heron achieves flight through courage and determination, we realise our potential by battling resistance and ship our creative or entrepreneurial work."
full_description = 'October 8, 2023 #coaching #resistance #distraction #journey #letters heron Perched on slender legs, the mighty Heron stands motionless at the edge of the pond, peering intently at the expanse of sky before him. His long wings ache to spread and take flight, to soar high above the jungle on the mission he has contemplated for so long. A noise echoes through the jungle. A faint croaking, steadily growing louder. Ribbit, ribbit. Heron pauses and glances around. A bloated grey Frog sits on a lily pad, peering at him with murky eyes. “It is not a good time,” says the Frog. “You are not ready”! Heron nods slowly as the hesitation wells up inside him. “What if I fail? What if I’m not good enough? Maybe I should just stay here where it’s safe…” The Frog’s croaking grows louder, like an alarm bell ringing in Heron’s mind. Heron shakes his head, trying to silence the noise. He wants to embark on the journey, though the path ahead seems daunting, he must battle so many obstacles and stay focused on his purpose. Taking a deep breath, and closing his eyes, he visualizes himself soaring high above the trees. The cool air streams beneath his wings. Below him, the landscape unfolds in a stunning panorama. The vast blue sky opens before him, beckoning him onward. His heart thrills at the beauty and freedom that await. Heron opens his eyes, with a gentle thrust of his legs, he takes flight. His wings slice through the humid air as he climbs higher and higher. He feels the warmth of the sun on his back and his spirit soars. Looking down, Heron sees the Frog still roosted on the lily pad, but growing smaller. The croaking fades away, drowned out by the rush of the wind. As he marvels at the endless expanse of the canopy stretching out in all directions, details come into focus. A monkey swings from a vine, chattering with delight. Colourful parrots flit between the towering mahogany trees. Far below, a river snakes through the landscape, glistening silver. The jungle is alive with beauty. The Heron’s excitement builds. “This is what I was made for!” — he thinks — “exploring new horizons, pursuing my dreams”. Up ahead, mountains pierce the clouds, their rocky peaks dusted white. Heron angles towards them, unshaken by their imposing height. He tells himself that with patience and persistence, he can scale even the steepest cliffs. Step by step, wingbeat by wingbeat, he will make the ascent. As he nears the mountains, dark clouds gather. Thunder rumbles in the near distance. Heron’s heart pounds, he attempts to steel himself. Though the path ahead seems treacherous, he will not allow fear to turn him back. If he aims for the heights, he must be ready to weather the storms. The first cold raindrops spatter his feathers. The wind buffets him from side to side. Remaining focused amid the storm, Heron pushes upward. He keeps his eyes fixed on the light breaking through the clouds ahead. Suddenly, a powerful gust knocks him off course, sending him into a perilous spiral. Heron struggles to right himself, fighting against the buffeting winds. For a moment he falters, doubt rising. Shaking off the hesitation, he refuses to give up. Heron reminds himself of his purpose. “Let the fear wash over me. Let the failure wash over me.” With determined flaps, he steadies his flight and continues the climb. The winds pummel him again and again, threatening to dash his hopes. Each time, Heron recovers and pushes onward. His wings ache with effort, but his spirit remains unbroken. With a final mighty pump of his wings, Heron bursts through the gloom into dazzling sunlight. Below him, the storm rages on, but he has risen above it now. As he glides over the mountain’s craggy peak, he feels the thrill of triumph. Though the way was fraught with setbacks, he proved his courage to follow his dreams. The journey ahead may bring more trials to test his resolve. But Heron feels ready to embrace the challenges, to pick himself up each time he falls. “I have found the inner strength needed to achieve my highest aspirations. From this hard-won peak, I am determined to keep doing the dangerous things with style” — he says. Heron spots a small lake nestled amid the cliffs below. He spirals down gracefully and lands at its edge with a contented sigh. He drinks water and feels grateful for having conquered his doubts. He acknowledges to himself that his epic flight has left him feeling tired but stronger. “After resting by these serene waters, I will be ready to take to the skies once more” — he says. Heron rests and allows the cool mountain air to soothe his weary wings. As his breathing slows, he notices a disturbingly familiar sound — the faint croak of a frog. Ribbit, ribbit. There, sitting on a lily pad just as before, is the same bulbous grey Frog gazing at him with unblinking eyes. “You barely made it through that storm,” croaks the Frog. “It’s too dangerous to go on further”. With calm acceptance, Heron stays put, he rests. But the Frog’s croaks grew louder again, like clamouring alarms in the Heron’s mind. Heron closes his eyes and returns to his breathing, recentring himself on his true desire. When he opens his eyes, he sees with clarity what must be done. With lightning reflexes, his slender beak darts out and snaps up the Frog in one smooth motion. The croaking silences instantly. The Heron’s body comes to a stillness in satisfaction, as he swallows the wriggling toad. He now had cleared his path forward, and fortified himself with a nourishing meal. With the potent sweeps of his wings, he takes back to the skies. Gazing out into the breathtaking view, he knows that each completion is only the new beginning. linked mentions for "heron": writings bender traincat heron pip boy Perspective on Psychological Work What are Us? What is Introspection? Why Coach Introspection? Who is a Good Coach?'
