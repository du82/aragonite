title = "Freud’s self-interpretation of psychoanalysis by Viktor Frankl"
description = "Columbus believed that he had found a new way to India, when what he had discovered was a new continent. There is also a difference between what"
full_description = 'August 21, 2017 #therapeutic #existential #cartesian ✱ Viktor Frankl Freud’s self-interpretation of psychoanalysis Columbus believed that he had found a new way to India, when what he had discovered was a new continent. There is also a difference between what Freud believed and what he achieved. Freud believed that man could be explained by a mechanistic theory and that his psyche could be cured by means of techniques. But what he achieved was something different, something still tenable, provided that we reevaluate it in the light of existential facts. According to a statement once made by Sigmund Freud, psychoanalysis rests on the recognition of two concepts, repression as the cause of neurosis and transference as its cure. Whoever believes in the importance of these two concepts may justifiably regard and call himself a psychoanalyst. Repression is counteracted by growing awareness. Repressed material should be made conscious. Or, as Freud put it, where id had been, ego should become. Freed from the mechanistic ideology of the nineteenth century, seen in the light of the existentialist philosophy of the twentieth century, one could say that psychoanalysis promotes self-understanding in man. inventing psychotherapeutic vocabulary longing for the freedom of our chains poiesis of psychoanalysis dissonance of maximum amplitude nomophobia, The Fear of Being With a Smartphone linked mentions for "Freud’s self-interpretation of psychoanalysis": atomic notes and incremental writing Levdotlc is an outlet for self-expression which supplies me with an opportunity to connect with like-minded individuals who appreciate the intersection of creativity and thought-provoking socio-cultural insights. With a minimalist, search-centered design, the site features a vast collection of writings, drawings, and study notes that reflect my creative pursuits and personal experiences.'
