title = "What is Introspection? - notes by @lev.lc"
description = "Embracing spontaneity and inner genius, we can reshape notions and know ourselves intimately. This self-knowledge lets us create our lives rather than follow others' expectations. Introspection illuminates our inner world. It helps us examine our beliefs, find our voice, and integrate our notions with outer reality. We can understand our roles and personalities, and the difference between our self-perception and others' views."
full_description = '''February 20, 2023 #coaching #introspective #journaling #worldly #spontaneity what is introspection? We are engaged in introspection when we reflect on our thoughts, sensations, emotions, and memories and examine what they mean. When we seek to understand prominent aspects of ourselves and make a distinction between first-person knowledge of our own minds and objective, externally available information. When we constantly develop our own methods of exploring the self and interact in a procedure of consciousness-raising. Introspection is not a specific process that is distinctively aimed at gaining insights about a psychological state. There are dozens of situations and practices that can be introspective, some of which don’t seem to be self-reflective at all and some of which contrast others in terms of their workings and depth of understandings they exhibit. By contemplating and actualizing unconscious material, it is possible to transform one’s mental state and attain solutions to irritating disputes. Practice of skillful thought, the functional process of introspection, allows us to spirit into personal psychology as one dives into reading a book, illuminating our inner sentiments. It helps us to deliberate our beliefs and desires, to find our voice and speak for ourselves. To study our inner world and integrate our notions with what is in the world around us. To work with our roles and personalities, and the difference between how we see ourselves and how others see us. Beyond Introspection What are Us? Who is a Good Coach? my Perspective on Psychological Work linked mentions for "What is Introspection?": principles An ongoing exercise of radical introspection expressed through first-person singular writing, the slash-principles page serves as a fluid document that reflects my evolving truths, beliefs, and principles. Discomfort is not an enemy, it’s a teacher! Each tenet is shaped and refined by the hard choices I make, aligning with my personal raison d'être and ikigai. transcendence, love and conscience Man passes the noological dimension whenever he is reflecting upon himself — or, if need be, rejecting himself; whenever he is making himself an traincat 'Operation Y': 3 offenders plot a heist. Heroism seen through emulation, brute force, control. Elsewhere, leaders choose 'guardian-architect' or humble 'scholar-gardener'. Surrendering to healing fiction I aim to design a better human experience embracing human empathy and creativity. going to the place of the Mothers Any man embarking on this symbolic quest must understand that he will be swept into one enthusiasm after another. Such enthusiasms soon wane and are Why Coach Introspection? Introspection, while potentially yielding valuable self-knowledge, may also lead to self-obsession and chronic rumination. We have to penetrate the layers of appearances and develop the capacity to hold several contradictory or paradoxical ideas about ourselves in our minds at the same time. What are Us? In today’s society, information, facts, and even concepts like “to be” are taken as concrete, but our intuition, emotions, and somatic response — atomic notes and incremental writing Levdotlc is an outlet for self-expression which supplies me with an opportunity to connect with like-minded individuals who appreciate the intersection of creativity and thought-provoking socio-cultural insights. With a minimalist, search-centered design, the site features a vast collection of writings, drawings, and study notes that reflect my creative pursuits and personal experiences. more like strangers to ourselves A social psychologist Timothy Wilson made a long career studying the perils of introspection. In his “Strangers to Ourselves” (2002), he writes writings bender traincat heron pip boy Perspective on Psychological Work What are Us? What is Introspection? Why Coach Introspection? Who is a Good Coach? on coaching In today’s world, the effort of self-improvement has become a