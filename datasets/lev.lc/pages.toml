full_description = '''September 13, 2024 #introspective #concentration #conversation #solitude ✱ William Deresiewicz discovering what you believe by articulating it to a friend So solitude can mean introspection, it can mean the concentration of focused work, and it can mean sustained reading. All of these help you to know yourself better. But there’s one more thing I’m going to include as a form of solitude, and it will seem counterintuitive: friendship. Of course friendship is the opposite of solitude; it means being with other people. But I’m talking about one kind of friendship in particular, the deep friendship of intimate conversation. Long, uninterrupted talk with one other person. Not Skyping with three people and texting with two others at the same time while you hang out in a friend’s room listening to music and studying. Multitasking, is not only not thinking, it impairs your ability to think. That’s what Emerson meant when he said that “the soul environs itself with friends, that it may enter into a grander self-acquaintance or solitude.” Introspection means talking to yourself, and one of the best ways of talking to yourself is by talking to another person. One other person you can trust, one other person to whom you can unfold your soul. One other person you feel safe enough with to allow you to acknowledge things—to acknowledge things to yourself—that you otherwise can’t. Doubts you aren’t supposed to have, questions you aren’t supposed to ask. Feelings or opinions that would get you laughed at by the group or reprimanded by the authorities. finding yourself through solitary work and concentration finding courage through community and seeing people as whole linked mentions for "discovering what you believe by articulating it to a friend": Solitude and Leadership If you want others to follow, learn to be alone with your thoughts finding yourself through solitary work and concentration Thinking means concentrating on one thing long enough to develop an 