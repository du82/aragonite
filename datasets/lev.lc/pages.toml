["https://lev.lc/now"]
title = "now - notes by @lev.lc"
description = "Interspersing writing, drawing, reading, and practicing keeps my ideas fresh and creativity sharp. Breaks from projects let solutions emerge. Small iterative improvements prevent burnout and sustain momentum. Working on multiple projects brings new insights and richer outcomes."
full_description = '''November 2, 2024 #drawing #coaching #spontaneity ⚑ Bali, Nusantara — 👋 This page will give you a snapshot of my current inquiries and pursuits, and the location tag at the top should accurately states where I am traveling at the moment. now This weekend, I sat wedged between a part-Irish, part-Scottish American and their very English partner — two people, four historic narratives, one language. They shared how their word choices and accents often led to misunderstandings between them — even the occasional spat. Inspired by their story, I map out my perspective of English and the nuances of my writing style. I’ve discovered that context switching by interspersing different subjects and mediums of work provides me with fresh perspectives on each project. Iterating between projects enables me to return with renewed creativity and effective problem-solving skills. Taking time away from a task often leads to idea betterment. I may choose to work on each project in spaced intervals, allowing myself moments for reflection at distance, my subconscious mind continues to work on problems in the background. Focusing on small, continuous improvements over time helps me maintain creative energy and achieve incremental progress without any project stagnating. Iterating on each project in turns helps me sustain momentum and encourages the cross-fertilization of ideas, resulting in more holistic outcomes. I work on multiple projects simultaneously, letting insights from one influence and enhance the others. I guess it’s principles season for me now, as I radically revisit my own principles page and launch the principles page project. I call it a project because I need to call it something — and “movement” feels like too big a claim. Yet, it’s a serious effort for me to step out of my portable hermit mode and spark new conversations. a “now page” on a personal website tells you what the author is currently focused on in their life. It’s like an “about” page but for the present moment, offering a big picture view of their current activities, interests, and priorities. Unlike social media updates, it provides a concise overview and helps with prioritization linked mentions for "now": what to si “C” is not an “a”, and it is not a “b” — this is to suggest that C is consequently flowing and not merely a choice. They don’t have to watch the principles An ongoing exercise of radical introspection expressed through first-person singular writing, the slash-principles page serves as a fluid document that reflects my evolving truths, beliefs, and principles. Discomfort is not an enemy, it’s a teacher! Each tenet is shaped and refined by the hard choices I make, aligning with my personal raison d'être and ikigai. the duoton newsletter Today I’m starting the "duoton" newsletter, and the "bender" piece will serve as its inaugural issue. That seems like an appropriate moment to Trusted Disclosure Agreement The Trusted Disclosure Agreement introduces a shift from conventional NDAs toward co-creative confidence and trust-driven collaboration. The page highlights a broader cultural problem where fear and symbolic control have overtaken genuine accountability in business. A critique of the performative tools of distrust that offers an alternative focused on transparency and mutual respect.'''
