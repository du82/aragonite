["https://lev.lc/tda"]
title = "Trusted Disclosure Agreement - notes by @lev.lc"
description = "The Trusted Disclosure Agreement introduces a shift from conventional NDAs toward co-creative confidence and trust-driven collaboration. The page highlights a broader cultural problem where fear and symbolic control have overtaken genuine accountability in business. A critique of the performative tools of distrust that offers an alternative focused on transparency and mutual respect."
full_description = 'January 31, 2025 #authority #belonging This page introduces my TDA — a commitment to co-creative confidence — over legal posturing. I move past the traditional NDA (Non-Disclosure Agreement) in favor of a human-centered approach — the Trusted Disclosure Agreement. The goal is to foster belonging through mutual respect and collaboration, not by imposing integrity through legal threats. Why that shift? Because a traditional NDA can feel like wearing a tuxedo to a yoga class — all the appearances, no freedom of movement. It tends to reinforce some kind of paranoia. Trust often falters not because of a single betrayal but because of a broader atmosphere of distrust, where every interaction is laced with suspicion. This culture of fear shapes many modern business practices, from rigid legal agreements to performative shows of professionalism, sometimes driven by the need to project productivity as an identity. NDAs exemplify this — they are less about safeguarding secrets and more about signaling compliance with expected business norms. Instead, a Trusted Disclosure Agreement, as outlined by Charles Eisenstein, invites transparency and responsibility, breaking the cycle of pervasive fear. It acknowledges that genuine relationships thrive not on coercion but on shared accountability. Though risky, embracing trust beats living in a world where symbolic gestures of control erode confidence at every turn. This TDA reflects my commitment to creating collaborative spaces. Perhaps you’re here because I sent you the link after you asked me for a signed NDA. I hope this page clarifies why I’m choosing a different path, and I invite you to join in co-creative confidence. The following template is the original Trusted Disclosure Agreement by Charles Eisenstein. Since I’ve sent you this link, please consider it signed by me. Trusted Disclosure Agreement This Agreement aims to be the spiritual and practical successor of the traditional NDA. It applies to all matters pertaining to the _________ Institute, and is written by ___________ on behalf of all who have inspired, encouraged, and guided it. This Agreement will refer to the collective of these beings as “the Institute.” I, levelsi, understand that I will be entrusted with sensitive information that the Institute holds confidential or even sacred, including its founding documents. I understand that the Institute trusts me, trusts my judgment, and trusts my discretion. I understand that some of the information that will be shared with me may not ready for public view. I understand as well that people who are not aligned with the Institute’s values could use this information to undermine its goals. Most important of all, I understand the necessity for certain material to incubate inside a circle of trust before circulating to those who may not treat it with respect, or who may use it in ways contrary to the intentions of its creators. Therefore, I agree to share the information in all documents and conversations pertaining to the Institute with great care. I agree to exercise careful discretion regarding how much to share, and whom to share it with. I agree to honor the care with which its authors hold it. I agree to seek guidance from these authors if I am not clear about whether to share something. And when I am clear, I agree to trust my judgment and not hold back from sharing, knowing that I too am trusted. I understand that this in not a legal document. I understand that I will suffer no legal consequences from violating the agreements and understandings herein. We do not outsource our trust to the legacy legal system and the state monopoly on violence that backs it up. Instead, we pray that we may be worthy of trust ourselves as we become people of our word. I understand that the Institute will hold my signature with respect and gratitude. Even as I acknowledge any doubts, cynicism, or distrust that I may harbor, toward myself or toward the author of this Agreement, I sign from a place of sincerity and trust. — Lc. Thank you for reading. If you’ve enjoyed this, there are a few more pages you might appreciate. The /principles page reflects on the values shaping my work and thinking — an evolving guide to what grounds and inspires me. Over at the /site page, I share how this artistic playground is designed and maintained, offering a peek at how concepts take their form. Finally, the /now page gives a current snapshot of my priorities — an open window into ongoing projects and what’s capturing my focus right now. linked mentions for "Trusted Disclosure Agreement": Can’t Get You Out of My Head Lucy Mangan (in The Guardian’s review of Curtis’s 2021 series): The six hour-and-bit long documentaries set out to tell no more and no less than how tda-response Charles Eisenstein’s proposal for a Trusted Disclosure Agreement resonated with me because it dismantles fear-based business structures. He shows'
