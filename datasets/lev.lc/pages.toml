hing for our souls acquired mind; Taoist, culture #therapeutic #individuality #manly #womanly #phenomenology #subject say my name Jul 2019 How do we live by the names given to us? How do we choose a name, or should I ask how does the name choose us? I use a mononym — levèlsi — and choose to write it in lowercase letters. This stylistic decision is my way of resisting the authority over personal names. #individuality #society #authority immediate short-term goal approaches May 2019 heuristic technique, often called simply an heuristic, is any approach to problem solving or self-discovery that employs a practical method, not #individuality #discovery ❍ rss feed for notes tagged "individuality"'''
