["https://lev.lc/site"]
title = "atomic notes and incremental writing - notes by @lev.lc"
description = "Levdotlc is an outlet for self-expression which supplies me with an opportunity to connect with like-minded individuals who appreciate the intersection of creativity and thought-provoking socio-cultural insights. With a minimalist, search-centered design, the site features a vast collection of writings, drawings, and study notes that reflect my creative pursuits and personal experiences."
full_description = "atomic notes and incremental writing This site serves as my private notebook — a collection primarily comprised of clippings from the literary works I delve into. However, these are not mere excerpts; rather, they are meticulously transformed snapshots. I adapt, edit, and merge these snippets, forging connections between them according to my intrinsic vision while intentionally keeping the sources somewhat elusive. This design reflects my focus on spontaneity and change, rather than a sprawling accumulation of factual knowledge. Even when labeled “zettelkasten” or “second brain” — I question the conventional belief that acquiring vast quantities of information is of utmost importance, especially in a world steeped in ambiguity, with generative models and big data handed to the machines. Mistaking the act of collecting data for true understanding means missing out on the living world itself. Understanding is akin to the ripening of a fruit, carefully nurtured and harvested at the appropriate moment. Plucking someone else’s fruitful results will never yield the same satisfaction as cultivating and tending to your own. To truly comprehend the intricacies of life, we must study ourselves first — and such a study amounts to turning our gaze inward and trusting intuition. At moments, I find myself captivated by the interconnections among fleeting notes, observing how certain themes and intentions gradually flourish or get dim over time, independent of any external influences or personal exertion. It’s akin to a sprawling tree with countless branches and an abundance of buds, though most may never blossom or even sprout a hint of green. On my end this site functions as a simple text-file folder, I have maintained for the past seven years, migrating it from one application to another. It is presently rendered into the website with “blot”, which I appreciate for balance of function and simplicity. In the early days, the folder served exclusively as my personal journal, where I diligently compartmentalized the intrinsic aspects. Later the line between inherents of the diary and reading notes, between “their words” and “mine” blured. I came to understand that all the words are borrowed, and no thought stands as completely original. The essence of genuine craftsmanship does not reside in the “creation,” particularly when writing becomes a process of words manufacturing. Here, I find myself inadvertently disappointing the last Christian among us. For in the most esoteric sense, it may be the act of “remembering” and not “creation” that holds sway. While perusing my site may prove beneficial to a select few, I suspect that its utility in a conventional sense may not be widespread. The preceding 450 words should serve as ample evidence that this platform serves as both an artistic outlet and a tool for enhancing my own creativity. While many pages contain links to other content and atomic notes, some links may lead to a “not found” page. This can occur for several reasons, such as certain texts are excluded from render and search while still referenced on my end, or because the note has undergone a transformation into a different form. As I’m improving the ‘Obsidian schematics’ and enhancing ‘mustache templates,’ such ‘disappearing pages’ will be harder to come by. This site is where the writing begins for me, but where it goes changes all the time. With that said, I sincerely hope you find enjoyment in this experiment of mine. Should you wish to connect or simply say ‘hi,’ considering you’ve read this far, please don’t hesitate to get in touch with me. — 👋 This site doesn’t have an ‘/about’ page, but it does have ‘/work’ and ‘/now’ pages, as well as a ‘/name’ page instead."
