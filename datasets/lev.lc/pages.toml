["https://lev.lc/good-coach"]
title = "Who is a Good Coach? - notes by @lev.lc"
description = "Coaching assumes clients possess emotional integration and focuses on creating the life they desire, not fixing problems. Effective coaching encourages clients to value themselves and set intrinsic, joy-filled goals. Coaches should never impose their truths, allowing clients' self-actualization through awareness, responsibility, and authentic values. Seasoned coaches prioritize nurturing, intuition, self-expression, and joy while aligning with clients' essence and remaining supportive observers."
full_description = '''February 23, 2023 #coaching #introspective #therapeutic #individuality who is a good coach? Unlike psychotherapy, coaching assumes that clients have sufficient emotional integration to function fully and that they focus on the life they want to create rather than on fixing what’s wrong. A good coaching client treats themselves as a person whose life has a unique value on its own, instead of as a machine that makes money and takes care of others. A good coach would help a client set goals with intrinsic value that will bring them authentic joy and passion, rather than the objectives they may believe they should accomplish. Anyone who coaches operates from a position of teacher and could easily become a model for coachee. A good coach knows their principles, but they will never project their truths onto coachees, committing to their work in teaching by providing experience without transferable material. That material, the insight, the understanding, and the willingness to act should always come from the client’s own realisation. This is why people who have good coaches are more self-actualized than the average psychotherapy client. Self-actualized clients need a fully realised coach with a mature consciousness who will bear a skillful observer, a witness of their life unconcealment. Young coaches — and “young” is meant to suggest the life journey, and not the age or length of professional experience — they only care about winnings. These are the success-oriented coaches who say they can get their clients better jobs, bodies, brains, and relationships. All of them are material coaches1, even when they talk about mindfulness and regular meditation practices. They use excitement by the hips, prowling the sidelines, screaming at their coachee, and refuse to alter the elegant techniques they learned in their training programs. Producing a discernible result, they make life miserable in general for themselves and their clients. Unfortunately, material coaches are also the most noticeable in the marketplace. An older coach will know that winning is not everything. They will encourage the coachee to do what nurtures them, teach the client how to develop intuition, and strengthen self-expression skills, fostering their will for joy. A coach aims to build the coachee’s level of awareness and self-responsibility based on the client’s core values, providing structure, support, and feedback. It is crucial that the inquiries be those of the client and that the coach doesn’t take on a mentor’s role. Good coach connects to the client’s essence with silent appreciation and affirmation of who that person is as a being. They meet their coachees at the level of their ability, however humble, and remain on the sidelines. — Why Coach Introspection? materialistic pathology↩︎ linked mentions for "Who is a Good Coach?": Why Coach Introspection? Introspection, while potentially yielding valuable self-knowledge, may also lead to self-obsession and chronic rumination. We have to penetrate the layers of appearances and develop the capacity to hold several contradictory or paradoxical ideas about ourselves in our minds at the same time. What is Introspection? Embracing spontaneity and inner genius, we can reshape notions and know ourselves intimately. This self-knowledge lets us create our lives rather than follow others' expectations. Introspection illuminates our inner world. It helps us examine our beliefs, find our voice, and integrate our notions with outer reality. We can understand our roles and personalities, and the difference between our self-perception and others' views. writings bender traincat heron pip boy Perspective on Psychological Work What are Us? What is Introspection? Why Coach Introspection? Who is a Good Coach? on coaching In today’s world, the effort of self-improvement has become a relentless pursuit, with many seeking guidance from various experts, traditions, and do the work In his book “The War of Art”, my teacher Steven Pressfield1 — I refer to him as my teacher because I am learning from him, and therefore he is'''
year_published = 2023
