["https://lev.lc/traincat"]
title = "traincat - notes by @lev.lc"
description = "'Operation Y': 3 offenders plot a heist. Heroism seen through emulation, brute force, control. Elsewhere, leaders choose 'guardian-architect' or humble 'scholar-gardener'. Surrendering to healing fiction I aim to design a better human experience embracing human empathy and creativity."
full_description = '''July 2, 2023 #triplicity #mimetic #film #artist #letters traincat In his short slapstick comedy “Operation Y”, Leonid Gaidai portrays three incompetent offenders “Fool,” “Coward,” and “Pro.” The middle-aged men conspiring in a warehouse heist gather at a secure location to practice their ridiculous skills. “Pro” punches a speed bag. “Fool” exercises his crowbar technique on drawer pulls and wall hooks. He sings a realistic song and plays guitar, as it often happens in Soviet films, while “Coward” futilely attempts a chloroformed hanky gag on him. “Fool” tells “Coward” to “train on cats” instead, pointing at a sizable collection of ceramic toys found at the safehouse. 1 In our narrative of reality blending with poetry, and within the stories we construct for ourselves, the singular force that remains steadfast, shielding us from the solipsistic tyranny of engineered desire, is our common bond. We exist not in isolation but in profound interconnection, ingrained with an ability for creation and compassion, our birthright. It becomes an undeniable obligation of every individual entrusted with leadership, or who harbors aspirations to guide others, to deliberate their role in the grand theater — a valiant "guardian-architect" or a modest “scholar-gardener.” To embrace the former signifies a treacherous idealism, ensnared by a ceaseless pursuit of resources and dominion. In this grim venture, people are reduced to mere metrics and commodified as the “new oil,” steering our meticulously measured, orchestrated, and fragmented world toward a harrowing dystopia. This is the manifestation of a heroic ego at work, eagerly seeking to wage battles against poverty, illness, substance abuse, old age, non-productiveness, boredom, and any form of adversity the humanity may symptomize. The course of heroism often entails lying in wait for opportune moments to emulate the “Pro,” resorting to brute force, or adopting the tactics of the “Coward” by ambushing opponents from the shadows. Alternatively, it may involve assuming the guise of the “Fool,” employing surveillance and algorithms in a mission of control, foolhardy veiled beneath a shroud of common welfare. To tread the path of the “scholar-gardener” is to surrender to the healing realism it brings. It requires treating symptoms as phenomena, devoid of judgment, to alternate heroic fantasy with less inspiring humbler stance, free from the burden of superiority. By donning the mantle of a “scholar-gardener,” one embarks on an introspective journey, fostering genuine understanding, and nurturing our common bond with deliberate discernment and compassion. video: a delicately rearranged scene from Leonid Gaidai's “Operation Y”↩︎ linked mentions for "traincat": atomic notes and incremental writing Levdotlc is an outlet for self-expression which supplies me with an opportunity to connect with like-minded individuals who appreciate the intersection of creativity and thought-provoking socio-cultural insights. With a minimalist, search-centered design, the site features a vast collection of writings, drawings, and study notes that reflect my creative pursuits and personal experiences. writing healing fiction I define my writing style as “healing fiction.” It’s not merely because I gather most of the paragraphs from the transformative journaling process, training wheels In my journaling and coaching, I use a construct of a tricycle — a bicycle with the additional wheels intended for young children. ‘Training principles An ongoing exercise of radical introspection expressed through first-person singular writing, the slash-principles page serves as a fluid document that reflects my evolving truths, beliefs, and principles. Discomfort is not an enemy, it’s a teacher! Each tenet is shaped and refined by the hard choices I make, aligning with my personal raison d'être and ikigai. writings bender traincat heron pip boy Perspective on Psychological Work What are Us? What is Introspection? Why Coach Introspection? Who is a Good Coach?'''
