full_description = "The name Level1 is a bit tongue-in-cheek. It’s meant to be a bit funny. To someone that doesn’t work in the tech industry, Level1 sounds good. To insiders, the Level 1’s are the entry-level folks – the lower tier helpers. At one time or another, we were all Level1; we all had to start somewhere. Our aim for our channel and our community is to be that ‘somewhere’ for a new generation of nerds. We aim to bring together both technology enthusiasts and professionals to accomplish more using our collective minds, skills and resources. Whether you want to optimize your gaming experience, improve your programming skills, learn to design a website or even just live vicariously through others posts about their projects, everyone is welcome to help us grow the community. We are the official Level1 content creators, staff, editors and interns. Find out more about each of us here. We are passionate about technology and how it shapes our world. We create videos to share our knowledge about tech, science and design."
