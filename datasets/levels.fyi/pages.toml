title = "End of Year Pay Report 2023 | Levels.fyi"
description = "View compensation trends, top paying companies, cities & more"
full_description = "Our mission at Levels.fyi is to help people build better careers. This past year was a big one. We collected over 200,000 submissions across thousands of companies. Pay transparency is powerful when its realtime, in context, and at scale. Last week we released a major mobile refresh to bring that power into your hands. If you haven’t yet, download the app on iOS or Android and take 2 minutes to add your salary, benefits, or leveling. The data shown below reflects the median total yearly compensation for the job families listed highlighting the overall percentage differentials. You can also select different titles to view the boxplot distributions for compensation compared to last year. The Levels.fyi Software Engineer Leveling Standard is a leveling hierarchy we've abstracted from company-specific names to make compensation aggregation easier. Click through the tabs below to view up to 7 top paying companies by level from 2023. View the compensation for all companies here. We've developed a leveling standard for all IC and management roles part way through this year. Since we didn't have the leveling framework set from the beginning of this year, we show the top 5 highest compensating companies by using the median value at the company within the following job families irrespective of level. Note that these are the absolute highest medians, and may not reflect the entire market. Benchmark with the highest fidelity, realtime data. Group by custom peer groups, locations, and more down to individual granularity. Get access to our most cutting edge compensation tools. We crunched the numbers across the United States, Europe, and Internationally for software engineering compensation. We found the following cities to have the highest total median pay (including stocks and bonuses). Our other more specific international reports are coming soon. Sign up to get notified below. Note that this list only includes the single highest paying city from each country. Other cities within a country may have high pay that isn't shown on this list."
