["https://levien.com/artofcode/eventone"]
title = "Even Toned Screening"
full_description = '''7 Oct 2005: Version 1.37 of ETS is now available. This release contains a number of refinements over previous versions, including a much refined static threshold modulation pattern (previous versions used white noise), and improvements to the vector-optimized versions to make them more consistent with the C version. 9 Feb 2004: Version 1.30 of ETS is now available. This release contains a number of dramatic improvements over previous releases. For one, it includes full support for variable ink droplet sizes. It also screens multiple ink planes at the same time to optimize interactions between the planes. Last but not least, this version also contains assembly language speedups for Altivec and Pentium 4 architectures. Even Toned Screening controls undesirable halftone patterns and textures, a form of error diffusion screening optimized for inkjet printers, using a technique known as Output-Dependent Feedback Screening. The earliest error diffusion algorithm was invented by Floyd and Steinberg in 1975, and is still considered one of the best. However, many error diffusion algorithms produce visually noticeable artifacts as a result of the dot placement choices. Techniques to reduce these artifacts are an active area of research. Exceptional features of error diffusion screening include total freedom from moire, as well as unparalleled fidelity in reproducing fine detail. These features have helped ensure error diffusion's dominant role in halftoning for inkjet printers. This high quality screening technique adds output-dependent feedback to the conventional error diffusion halftone, improving these halftones significantly. Error diffusion halftones are plagued by a "wormy" texture in highlights and shadows. This undesirable effect is caused by limitations in the logic used by error diffusion to place dots. With Even Toned Screening, the visual texture of highlight and shadow tones are made more uniform, eliminating the wormy textures that can occur with conventional error diffusion halftones.'''
