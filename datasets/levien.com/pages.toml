["https://levien.com/phd/phd.html"]
title = "Raph Levien’s thesis"
full_description = "This is the Web home of Raph Levien's PhD thesis. He completed it and presented his defense on Sept. 3, 2009. The final, official version (PDF) is 191 pages, in 11 points and formatted according to the (revised) official rules. (There's also a version formatted to the old paper rules, double spaced, odd margins, etc.) The thesis itself is in LaTeX format, and many of the figures are drawn using Python code (generally to Postscript). You'll need darcs to access the respository, Python, Ghostscript, NumPy, and Gnuplot. All should be standard in any decent Linux distro, and not hard install on a Mac (I used MacPorts, but fink should also work). Among other things, the thesis describes the mathematical theory and numerical techniques behind Spiro, a library for interactive curve design."
