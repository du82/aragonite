["https://levien.com/gfonted"]
title = "gfonted"
full_description = '''The development of gfonted has been transferred to the Gill project. Gill is not quite as capable as gfonted at actually editing bezier glyphs, but will soon. Gill uses the Gnome Canvas instead of GtkCaanvas. Basically, all of the "live" development is going into the Gnome version of the code. The gfonted project is destined to become a font editor for Adobe Type 1 format fonts. It is currently in the very early stages of development. The gfonted project is also a vehicle for some infrastructure upgrades to Gtk+. Currently, gfonted contains: A current module in progress provides general vector path operations, including intersection, union, symmetric difference, and stroke outline. 29 Sep 1998: This module is now almost complete - it just needs some code to handle the degenerate cases with numerical stability. It is anticipated that most of these infrastructure improvements will be folded back into the Gtk+ development tree, hopefully in time for the 1.2 release. Here's a screenshot of gfonted, showing a glyph loaded from an Adobe Type1 font (the URW version of Times Roman):'''
