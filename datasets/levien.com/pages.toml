["https://levien.com/type/myfonts"]
title = "Fonts in progress"
full_description = "Here are the fonts I'm currently working on. Some of them are very incomplete or rough, especially in spacing and fit. In most cases, I've posted a PDF file so you can zoom in and see the letters up close, and also a FontForge SFD file so you can play with the outlines yourself. I'm always open to criticism and encouragement, so drop me a note (firstname.lastname@gmail.com is most likely to be read). This font is currently the closest to release, with a decent glyph complement. It's a straightforward revival of a somewhat forgotten, but handsome and utilitarian, font from the ATF collection. It's obviously very similar to the familiar Century Oldstyle, but with more refined proportions and stroke. This version is based on the 18pt from the 1923 catalog. I've fallen in love with the Centaur of Bruce Rogers. There is a respectable digital version by Monotype, but, as some have noted, it suffers from overly crisp rendering on modern devices. I think there's a lot of potential to implement optical scaling, and perhaps revive the Bible Centaur version as well. It may well be years until I release this font, as I want to do it justice. I also want to make sure to strictly follow ethical guidelines for the release, as a version of the font is being sold by more or less the same company that first released it. One of the most revelatory plates in Harry Carter's View of Early Typography is a specimen by one Guillaume LeBe. I have done a very literal tracing of both titling and book sizes of the letters, which might be the basis for a good font. I'm not really happy with the book size, as it faithfully reproduces the serious degradation I'm sure the specimen sheet endured in its (reduced size) reproduction. The ATF Bodonis are quite beautiful, and technical tour de force as well. As part of an effort to understand the optical scaling done by Morris Benton Fuller, I traced a number of the Bodoni Book 12pt lowercase letters. I now realize that, both for better quality and to be more faithful to the scaling technology developed by Morris Benton and his father Linn Boyd Benton, I should consider the 18pt size of Bodoni Book to be the authoritative master. I have a feeling I'll come back to this one."
year_published = 2025
