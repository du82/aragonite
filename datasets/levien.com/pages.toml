["https://levien.com/libart"]
title = "Libart"
description = "Libart, a library for high-performance 2D vector and bitmap graphics"
full_description = "Libart is a library for high-performance 2D graphics. It is currently being used as the antialiased rendering engine for the Gnome Canvas. It is also the rendering engine for Gill, the Gnome Illustration app. Libart is free software (all components are either GPL or LGPL). Libart is also available for commercial licensing. I own the copyright to the libart code base. Libart supports a very powerful imaging model, basically the same as SVG and the Java 2D API. It includes all PostScript imaging operations, and adds antialiasing and alpha-transparency. Libart is also highly tuned for incremental rendering. It contains data structures and algorithms suited to rapid, precise computation of Region of Interest, as well as a two-phase rendering pipeline optimized for interactive display."
