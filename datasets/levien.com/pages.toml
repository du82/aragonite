["https://levien.com/tp600.html"]
title = "Linux on IBM ThinkPad 600"
full_description = '''22 Oct 2002: I've summarized the battery problem and feedback I've gotten on its own page. As far as I know, this is a defect in the product, and affects both Windows and Linux users. 20 Oct 2002: Redhat 8.0 installs cleanly, with the exception of sound. I'm sure it can be made to work, but don't really care enough. 13 Feb 2001: IBM has released a GPL modem driver for the MWave modems. More discussion is at Slashdot. Huzzah! I haven't really been updating this page, but a few notes are in order. I haven't resolved the battery issues. I broke down and bought an Xtend B320 replacement battery, and so far it's working just fine. I've also switched my laptop to Debian Potato. For the most part, the installation went easily, although I did have to recompile the kernel to get APM working. Unfortunately, I did the install in a bit of a hurry, so I didn't have time to post a blow-by-blow description here. 7 Feb 2000: Till Straumann has written a user mode TrackPoint driver for ThinkPads. It enables Z-axis clicking. Till would like help with raw Z-axis data, as well as the usual testing. Check it out! 6 Feb 2000: I've been experiencing frustrating lifetime problems with my battery, and am determined to fix them. See the Battery section below. 14 Sep 1999: Amazingly, IBM has a Guide to installing Red Hat Linux 6.0 on their support webpage. It's quite informative. 14 Jul 1999: Benedikt Eric Heinen has set up a linux-tp600 mailing list. Subscription info is below, archive is coming soon. I've reinstalled my system more or less from scratch using RedHat 6.0. You can also read about my experiences setting up older Linux versions on the ThinkPad. As before, the basic install went smoothly, but there were quite a number of issues to iron out before the machine really came up to speed. I've divided the rest of this page into individual sections. The only insoluble problem currently is the modem. Aside from that, the ThinkPad 600 makes a nice Linux platform. Very good news for the video display: the default install for RH 6.0 works fine. I set "Generic 1024x768 monitor" with 31.5-57.0 KHz horizontal and 50-100 Hz vertical.'''
