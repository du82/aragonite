["https://levien.com/free/patent-rant.html"]
title = "A rant against bad patents"
full_description = "While reading a bit on the current W3C patent controversy in Linux Weekly News, I came across a posting describing a patent taken out by Apple on alpha compositing. Looking at patent US5379129 itself, I see that it contains no new intellectual content. Usually, when I see a claim that Company X has patented Obvious Technique Y, I'm skeptical. Whether you agree with the patent system or not, in many cases the actual patent contains claims that show that Company X has at least used Obvious Technique Y in a new context, or figured out an implementation trick. Here, however, the patent really is as dumb as it looks at first glance. Every person whose name appears on it should be deeply ashamed of themselves - the inventors, Konstantin Othmer (now a venture capitalist) and Bruce A. Leak (later a cofounder of WebTV), for being so unaware of the field that they actually believed it patentable, the Apple lawyer, Mark Aaker, for not bothering to find out whether it was patentable, and of course the primary examiner, Bentsu Ro, for letting the patent go through. And Mr. Ro has been honored on the Patents Recognition Wall, at that! At the time that this patent was filed in 1992, the technique of integral alpha had already been published for about 12 years: Smith, A.R., Painting Tutorial Notes, SIGGRAPH '79 course on Computer Animation Techniques, 1979, ACM. Alvy Ray Smith went on to receive an Academy Award for this work in 1996. In the interim, this seminal work has been cited by many, many other researchers, including Bruce Wallace's 1981 SIGGRAPH paper, and the landmark Porter-Duff paper, which added the additional innovations of premultiplied alpha and an image algebra: However, the Apple patent contains no trace of these later innovations. Everything in it is in the Wallace paper's description of Alvy Ray Smith's work, and in essentially identical mathematical terminology to boot. Thus, this patent can easily serve as a poster child for well known techniques, widely published in the academic literature, and then patented."
year_published = 2025
clearnet = "https://levien.com/free/patent-rant.html"
