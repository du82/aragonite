full_description = "Welcome to Liao, a modern public IRC network powered by Ergo with the quality of life features necessary to house modern internet communities: Chat history by default Always-on clients (more info) Host cloaking The ability to receive private messages while offline Traditionally, IRC networks did not have these features, which made them significantly more difficult to understand for less tech-savvy individuals. Liao aims to fix this issue by providing modern chat features which are indispensable for modern communities. Speaking of communities, Liao's rules are suitable for any type of community, as long as they follow the related rules. Connect You can connect to irc.liao.ws +6697 with your favorite IRC client or use the web client. See the connection guide for more info, including how to connect using Tor. Main channels are #cheers for general chat, and #help for help."
