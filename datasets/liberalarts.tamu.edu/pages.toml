title = "Faculty – The College of Arts & Sciences at Texas A&M University"
full_description = '''Faculty The College of Arts & Sciences Our college has transitioned into the College of Arts and Sciences, meaning our website is being updated and moved. We appreciate your patience as we move into our new home and hope you'll explore the new website with the most up to date information. Learn More <!-- div.artsci-announcement { background:linear-gradient( 60deg, #eaeaea 0%, #eaeaea 25%, #f6f6f6 25%, #f6f6f6 100% ); @media only screen and (max-width: 700px) { background:linear-gradient( 60deg, #eaeaea 0%, #eaeaea 45%, #f6f6f6 45%, #f6f6f6 100% ); } div.artsci-container { h2.artsci-content-header { @media only screen and (max-width: 450px) { font-size:1.75rem; } } a.artsci-cta { @media only screen and (max-width: 700px) {margin-bottom:1.5rem;} @media only screen and (max-width: 450px) { width:calc(100% - 3rem); text-align:center; } } } } } --> Our Faculty Are Making Great Strides The College of Arts & Sciences comprises faculty and staff who dedicate themselves to providing a transformational learning experience for our students, conducting research that changes fields of study, and fostering inclusive and welcoming learning environments and workplaces. Together, we are all fulfilling our college motto of "Knowledge for Life" through our research, teaching, support, service, and outreach. We can continue to be successful because of the contributions of our outstanding employees. Our faculty are leaders in their fields and have brought Arts & Sciences education to the forefront of Texas A&M. Our dedicated staff provide the outstanding support needed for student and faculty success. We invite you to learn more about the resources we offer to facilitate their academic and research initiatives.'''
