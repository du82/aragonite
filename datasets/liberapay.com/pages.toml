["https://liberapay.com/Minardil"]
title = "Minardil's profile - Liberapay"
description = "Free and accessible software for all All programs should be accessible to anyone, without tying their use to economic availability. The virtual world can and should offer …"
full_description = "All programs should be accessible to anyone, without tying their use to economic availability. The virtual world can and should offer better opportunities to everyone. Privacy is an inalienable right and its moderation is a limitation of freedom. The use of software, especially on mobile devices, that monitors usage or shares data poses a real threat to this right. Software development requires time and effort. Therefore, economic recognition, even if minimal, is a valuable support for continuing to offer programs and apps that uphold the principles mentioned above. Thank you for your support."
