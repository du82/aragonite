["https://liberapay.com/Changaco"]
title = "Changaco's profile - Liberapay"
description = "Hi, I'm Charly. I create, improve, and maintain free software (and other commons). To fund this work I have chosen to rely on the direct support of the community."
full_description = "Hi, I'm Charly. I create, improve, and maintain free software (and other commons). To fund this work I have chosen to rely on the direct support of the community. I'm the creator of Liberapay, the website you're on right now, and before that I had contributed a lot to its predecessor (Gittip/Gratipay). I maintain several other free software projects, mostly written in Python. You can find them on my GitHub profile. I'm also interested in Open Data. I started working on legi.py when the database of French laws was released as open data in 2014. One of the things my code does is generate lists of anomalies in the data, to encourage the maintainers to correct them. I'm an ArchLinux user. Throughout the years I've added some packages to the AUR, contributed to the wiki, and a long time ago I wrote the initial implementation of the -Qk command for pacman. I'm unsatisfied with all the programming languages I've used or looked into, so in the last days of 2023 I started writing a compiler for a new programming language: Gato. I occasionally post on social media and contribute to Wikipedia to share some of the knowledge I've accumulated over the years on various topics."
year_published = 2025
