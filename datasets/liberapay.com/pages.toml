["https://liberapay.com/Liberapay/donate"]
title = "Donate to Liberapay via Liberapay"
description = "Support Liberapay's work with a recurrent donation."
full_description = "Liberapay currently receives €824.59 per week, they need your help to reach their funding goal (€1,000.00 per week). We have confirmed through an automated verification process that Liberapay has control of the following accounts on other platforms: Donations to Liberapay can be paid using: a credit or debit card (American Express, Cartes Bancaires, Diners, Discover, JCB, Mastercard, UnionPay, and Visa), a euro bank account (SEPA Direct Debit), or a PayPal account. On Liberapay, donations are funded in advance. You have control over when and how much you pay. Sending more money at once usually results in a lower percentage of transaction fees. We will notify you whenever a donation needs to be renewed. If you've opted for automatic renewals, then we will attempt to debit your card or bank account as agreed. One-time donations aren't properly supported yet, but you can discontinue your donation immediately after the first payment. Liberapay has been running for 9 years without any significant security incident. We do everything we can to keep your data safe and comply with the laws of the European Union (GDPR, PSD2, et cetera)."
