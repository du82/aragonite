full_description = '''https://c64g.com is a website which hosts Commodore 64 games. It is hosted on a VPS in Germany, which costs a bit under 33€ per month. On February 25th, 2025 Google Adsense was removed as a means to finance the site. The site has been online since 2005. It was ranked #1 once and that guaraneed its existence, because ad earnings would be high enough to pay the server bills and do some maintenance and development work (30-90€ / month). Nowadays, that is no longer the case, because Google favors Wikis, and c64g.com is not a wiki. It is a custom built "download c64 games" frontend, actually full-stack site, because everything is rendered server side. I'm asking for donations to keep this site running, so the goal is at least 33€ / month. However, in order to do some development, so people are able to upload images and write descriptions, larger amounts would be welcome.'''
