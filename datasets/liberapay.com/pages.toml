["https://liberapay.com/about/global"]
title = "Global - Liberapay"
full_description = "Donors can choose between up to 133 currencies, depending on the preferences of the recipient and the capabilities of the underlying payment processor. Donations can only be received in territories where at least one supported payment processor is available. Moreover, some features are only available in some of the territories supported by a payment processor. The currently supported payment processors are Stripe and PayPal. You can find a list of the differences between them in the “Payment Processors” page. Liberapay is also available to creators in the 10 territories listed below. However, donations going to those territories cannot be grouped to lower the payment processing fees, and the euro direct debit payment method isn't available to the donors. Liberapay is partly available to creators in the 71 territories listed below, which are supported by PayPal but not by Stripe. If you don't live or have a registered business in one of the territories listed above, then you currently can't use Liberapay to receive donations. Sorry."
