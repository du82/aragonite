["https://liberapay.com/about/privacy"]
title = "Privacy - Liberapay"
full_description = "We do our best to protect everyone's privacy: we do not attempt to track people who visit our website, we strive to collect only the personal information we actually need, and we don't sell it to anyone. A cookie is a piece of information sent by a website to your browser, stored on your machine, and resent by your browser to that same website in every subsequent request. The liberapay.com website only sets technical cookies which are required to authenticate the user or to perform a specific operation. These cookies are restricted to same-site requests, so we don't know who visits websites that contain Liberapay widgets. Visitors of the liberapay.com website can also receive cookies sent by Cloudflare. Please read “Understanding the Cloudflare Cookies” if you want to learn more about them. On some payment pages, extra cookies may be set by the payment processor. Please read these documents if you want more information: Stripe's cookie policy and PayPal's cookie policy. Liberapay currently has integrations with GitHub, Twitter, Mastodon, GitLab.com, Twitch, YouTube, OpenStreetMap, Bitbucket, Pleroma, and LinuxFr.org. When an account from one of those platforms is connected to a Liberapay profile, we retrieve and store some data from that platform, for example the unique identifier of the linked account. We only keep public information about the linked account, no private data. The primary purpose of these integrations is to confirm that a Liberapay account hasn't been created by an impostor attempting to profit from someone's else work. The second purpose is to help patrons find the Liberapay accounts of the creators they follow on other platforms. Liberapay relies on payment service providers to actually transfer money from donors to creators, as we have neither the resources nor the desire to directly interface with banks and payment networks. If you want to learn about the personal data collected by these payment processors, please read these documents: Stripe's privacy policy and PayPal's privacy policy."
year_published = 2025
clearnet = "https://liberapay.com/about/privacy"
