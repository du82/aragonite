["https://liberapay.com/about"]
title = "Introduction - Liberapay"
full_description = "Payments come with no strings attached. By default, recipients don't know who their patrons are, and donations are capped at $100.00 per week per donor to dampen undue influence. By default, the total amount you give and the total amount you receive are public (you can opt out of sharing this info). Liberapay does not take a cut of payments, the service is funded by the donations to its own account. However there are payment processing fees. Liberapay is an open project, you can help us translate it, improve its code, and manage its legal entity. If you do so, you'll be able to join the Liberapay team and receive a share of the money that our users donate to keep the service running. People who contribute to the commons need you to support their work. Building free software, spreading free knowledge, these things take time and cost money, not only to do the initial work, but also to maintain it over time. Liberapay's recurrent donations system is designed to provide a stable crowdfunded basic income to creators, enabling them to keep doing great work that benefits everyone. Ready to contribute? Then let's get started:"
