["https://www.libgosu.org/cgi-bin/mwf/forum_help.pl"]
title = "Gosu Forums"
full_description = '''Note: as the mwForum software is highly configurable, not all of the features mentioned below are necessarily enabled in this installation. The forum is the whole installation, and usually contains multiple boards. You should always enter the forum through a link that ends in "forum.pl" (not "forum_show.pl") to let the forum know when you start a new session. Otherwise the forum won't know when to display posts as new or old. A user is anyone who registers an account in the forum. Registration is usually not required for reading most boards, but depending on configuration only registered users will have access to certain boards and features. Users can be granted membership in user groups. Open groups can also be joined by users themselves. The groups in turn are granted member or moderator rights in selected boards, allowing members of the group to read and write in or moderate those boards. A board contains topics, which in turn contain the posts. Boards can be set to be visible to registered users or to moderators and board members only. Boards can optionally allow posts by unregistered guests. Announcement boards can be read-only, so that they only allow posts by moderators and members, or reply-only, which means that only moderators and members can start new topics, but everybody can reply. Another option for boards is moderation. If this option is activated, new posts will be invisible to normal users until a moderator approves them. A topic, otherwise known as thread, contains all the posts on a specific subtopic, that should be named in the topic's subject. Boards have expiration values that determine after how many days their topics will expire or get locked after their last post has been made. Moderators can also manually lock topics, so that no replies can be made and no post can be edited anymore. A post is a public message by a user. It can be either a base post, which starts a new topic, or a reply to an existing topic. Posts can be edited and deleted, which may be limited to a certain time frame. Posts can be locked by moderators, making it impossible to reply or edit. Posts can be reported to the moderators in case of rule violations.'''
year_published = 2025
clearnet = "https://www.libgosu.org/cgi-bin/mwf/forum_help.pl"
