["https://libgosu.org/cpp.html"]
title = "C++ / iOS • Gosu"
full_description = "Gosu is written in C++ 2017 with minimal dependencies (no boost). It has CMake files for macOS and Linux, Xcode support for macOS and iOS, and project files for Visual C++ 2019. You can check out the GitHub CI configurations to see which compilers and OS versions are verified to work at the moment. The port is unfinished and rough, but the project can be built for Linux and macOS with CMake, and for macOS and iOS with Xcode. The motion-gosu GitHub project includes an example project that is structured in a way that makes it easy to run the same code with ‘normal’ Ruby, RubyMotion for macOS, and RubyMotion for iOS. The C++ and RubyMotion versions of Gosu are not for the faint of heart. They are nowhere near as polished as Ruby/Gosu. You’ll see terrible error messages, and you’ll need to know your tools well enough to fix them. Poking around the source code often helps, too. Nevertheless, if you have written a great Ruby/Gosu game, porting it to RubyMotion or C++ might be the best way to share it with the world through Apple’s App Store for iOS and macOS. Please file an issue if you run into unexpected limitations."
year_published = 2025
clearnet = "https://libgosu.org/cpp.html"
