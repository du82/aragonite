["http://libguestfs.org/virt-df.1.html"]
title = "virt-df"
full_description = '''virt-df is a command line tool to display free space on virtual machine filesystems. Unlike other tools, it doesn't just display the size of disk allocated to a virtual machine, but can look inside disk images to see how much space is really being used. If used without any -a or -d arguments, virt-df checks with libvirt to get a list of all active and inactive guests, and performs a df-type operation on each one in turn, printing out the results. If any -a or -d arguments are specified, virt-df performs a df-type operation on either the single named libvirt domain, or on the disk image(s) listed on the command line (which must all belong to a single VM). In this mode (with arguments), virt-df will only work for a single guest. If you want to run on multiple guests, then you have to invoke virt-df multiple times. Use the --csv option to get a format which can be easily parsed by other programs. Other options are similar to the standard df(1) command. If a single guest has multiple disks, use the -a option repeatedly. A plus sign (+) is displayed for each additional disk. Note: Do not do this with unrelated guest disks. Add FILE which should be a disk image from a virtual machine. If the virtual machine has multiple block devices, you must supply all of them with separate -a options. The format of the disk image is auto-detected. To override this and force a particular format use the --format=.. option. This parameter sets the sector size of the disk image. It affects all explicitly added subsequent disks after this parameter. Using --blocksize with no argument switches the disk sector size to the default value which is usually 512 bytes. See also "guestfs_add_drive_opts" in guestfs(3). If using libvirt, connect to the given URI. If omitted, then we connect to the default libvirt hypervisor. Write out the results in CSV format (comma-separated values). This format can be imported easily into databases and spreadsheets, but read "NOTE ABOUT CSV FORMAT" below. The default for the -a option is to auto-detect the format of the disk image. Using this forces the disk format for -a options which follow on the command line. Using --format with no argument switches back to auto-detection for subsequent -a options.'''
year_published = 2025
