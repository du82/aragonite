["https://libguestfs.org/virt-builder-repository.1.html"]
title = "virt-builder-repository"
full_description = 'Virt-builder is a tool for quickly building new virtual machines. It can be configured to use template repositories. However creating and maintaining a repository involves many tasks which can be automated. virt-builder-repository is a tool helping to manage these repositories. Virt-builder-repository loops over the files in the directory specified as argument, compresses the files with a name ending by qcow2, raw, img or without extension, extracts data from them and creates or updates the index file. Some of the image-related data needed for the index file can’t be computed from the image file. virt-builder-repository first tries to find them in the existing index file. If data are still missing after this, they are prompted in interactive mode, otherwise an error will be triggered. Create a folder and copy the disk image template files in it. Then run a command like the following one: Note that this example command runs in interactive mode. To run in automated mode, a minimal index file needs to be created before running the command containing sections like this one: The file value needs to match the image name extended with the .xz suffix if the --no-compression parameter is not provided or the image name if no compression is involved. Other optional data can be prefilled. Default values are computed by inspecting the disk image. For more informations, see "Creating and signing the index file" in virt-builder(1). In this use case, a new image or a new revision of an existing image needs to be added to the repository. Place the corresponding image template files in the repository folder. To update the revision of an image, the file needs to have the same name than the existing one (without the xz extension). As in the repository creation use case, a minimal fragment can be added to the index file for the automated mode. This can be done on the signed index even if it may sound a strange idea: the index will be signed again by the tool. To remove an image from the repository, just remove the corresponding image file before running virt-builder-repository.'
