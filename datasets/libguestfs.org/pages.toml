["https://libguestfs.org/hivexregedit.1.html"]
title = "hivexregedit - Merge and export Registry changes from regedit-format files."
full_description = '''Please note hivexregedit is a low-level tool for manipulating hive files directly. To merge or export registry changes to Windows virtual machines it's better to use virt-win-reg(1). Given a local binary ("hive") file, there are two modes. --merge imports (merges) changes from a regedit-format file into the hive. It is similar to using the /s switch in Windows regedit.exe. hivexregedit expects that regedit files have already been re-encoded in the local encoding. Usually on Linux hosts, this means UTF-8 with Unix-style line endings. Since Windows regedit files are often in UTF-16LE with Windows-style line endings, you may need to re-encode the whole file before or after processing. To re-encode a file from Windows format to Linux (before processing it with the --merge option), you would do something like this: To go in the opposite direction, after using --export and before sending the file to a Windows user, do something like this: If you are unsure about the current encoding, use the file(1) command. Recent versions of Windows regedit.exe produce a UTF-16LE file with Windows-style (CRLF) line endings, like this: Be careful when passing parameters containing \ (backslash) in the shell. Usually you will have to use 'single quotes' or double backslashes (but not both) to protect them from the shell. Registry keys like CurrentControlSet don't really exist in the Windows Registry at the level of the hive file, and therefore you cannot modify these. CurrentControlSet is usually an alias for ControlSet001. In some circumstances it might refer to another control set. The way to find out is to look at the HKLM\SYSTEM\Select key: Enable debugging in the hivex library. This is useful for diagnosing bugs and also malformed hive files. Merge regfile (a regedit-format text file) into the hive hivefile. If regfile is omitted, then the program reads from standard input. (Also you can give multiple input files). --prefix specifies the Windows Registry prefix. It is almost always necessary to use this when dealing with real hive files.'''
