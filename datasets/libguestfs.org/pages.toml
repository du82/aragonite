["https://libguestfs.org/guestfs-recipes.1.html"]
title = "guestfs-recipes"
full_description = '''This page contains recipes for and links to things you can do using libguestfs, guestfish(1) and the virt tools. If the disk image is on a remote server which is accessible using SSH, HTTP, FTP, NBD, iSCSI, or similar, then you can open it directly. See "ADDING REMOTE STORAGE" in guestfish(1) for several examples. This requires libguestfs ≥ 1.22 and qemu ≥ 1.5. See: https://rwmj.wordpress.com/2013/05/16/scanning-offline-guests-using-openscap-and-guestmount/#content The links below explain how to use guestfish(1) to change the background image for a user of a Windows XP VM. Unfortunately the technique appears to be substantially different for each version of Windows. https://lists.fedoraproject.org/pipermail/virt/2011-May/002655.html https://lists.fedoraproject.org/pipermail/virt/2011-May/002658.html Replace md5 with the type of checksum you want. See "guestfs_checksum_device" in guestfs(3) for a list of supported types. /dev/sda1 means "the first partition". You could use /dev/sda to checksum the whole disk image, or the name of a logical volume or RAID device. Use a combination of tools like cp(1), dd(1), and virt tools like virt-sysprep(1), virt-sparsify(1) and virt-resize(1). If you have a data disk in one format / filesystem / partition / volume manager, you can convert it another using this technique. In this example, we start with a data disk that has a single partition containing a filesystem, and we want to create another disk that contains the same files but on an ext3 filesystem embedded in a logical volume on a sparse raw-format disk. This technique is quite powerful, allowing you for example to split up source directories over the target filesystems. Note this won’t work (at least, not directly) for bootable virtual machine disks because it doesn't copy over the boot loader. http://rwmj.wordpress.com/2013/05/09/tip-convert-a-windows-dvd-iso-to-a-bootable-usb-key-using-guestfish/#content Xen disk images are often partitionless, meaning that the filesystem starts directly at the beginning of the disk with no partition table. You can in fact use these directly in KVM (provided the guest isn't Windows), but some people like to convert them to regular partitioned disk images, and this is required for Windows guests. Here is how to use guestfish to do this:'''
