["https://libguestfs.org/guestfs-internals.1.html"]
title = "guestfs-internals"
full_description = '''This manual page is for hackers who want to understand how libguestfs works internally. This is just a description of how libguestfs works now, and it may change at any time in the future. Internally, libguestfs is implemented by running an appliance (a special type of small virtual machine) using qemu(1). Qemu runs as a child process of the main program. The library, linked to the main program, creates the child process and hence the appliance in the "guestfs_launch" in guestfs(3) function. Inside the appliance is a Linux kernel and a complete stack of userspace tools (such as LVM and ext2 programs) and a small controlling daemon called "guestfsd". The library talks to "guestfsd" using remote procedure calls (RPC). There is a mostly one-to-one correspondence between libguestfs API calls and RPC calls to the daemon. Lastly the disk image(s) are attached to the qemu process which translates device access by the appliance’s Linux kernel into accesses to the image. A common misunderstanding is that the appliance "is" the virtual machine. Although the disk image you are attached to might also be used by some virtual machine, libguestfs doesn't know or care about this. (But you will care if both libguestfs’s qemu process and your virtual machine are trying to update the disk image at the same time, since these usually results in massive disk corruption). The normal transitions are (1) CONFIG (when the handle is created, but there is no child process), (2) LAUNCHING (when the child process is booting up), (3) READY meaning the appliance is up, actions can be issued to, and carried out by, the child process. The guest may be killed by "guestfs_kill_subprocess" in guestfs(3), or may die asynchronously at any time (eg. due to some internal error), and that causes the state to transition back to CONFIG. Configuration commands for qemu such as "guestfs_set_path" in guestfs(3) can only be issued when in the CONFIG state. The API offers one call that goes from CONFIG through LAUNCHING to READY. "guestfs_launch" in guestfs(3) blocks until the child process is READY to accept commands (or until some failure or timeout). "guestfs_launch" in guestfs(3) internally moves the state from CONFIG to LAUNCHING while it is running.'''
year_published = 2025
clearnet = "https://libguestfs.org/guestfs-internals.1.html"
