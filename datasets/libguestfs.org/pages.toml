["http://libguestfs.org/virt-rescue.1.html"]
title = "virt-rescue"
full_description = "Using virt-rescue in write mode on live virtual machines, or concurrently with other disk editing tools, can be dangerous, potentially causing disk corruption. The virtual machine must be shut down before you use this command, and disk images must not be edited concurrently. Use the --ro (read-only) option to use virt-rescue safely if the disk image or virtual machine might be live. You may see strange or inconsistent results if running concurrently with other changes, but with this option you won't risk disk corruption. virt-rescue is like a Rescue CD, but for virtual machines, and without the need for a CD. virt-rescue gives you a rescue shell and some simple recovery tools which you can use to examine or rescue a virtual machine or disk image. When you run virt-rescue on a virtual machine or disk image, you are placed in an interactive bash shell where you can use many ordinary Linux commands. What you see in / (/bin, /lib etc) is the rescue appliance. You must mount the virtual machine’s filesystems. There is an empty directory called /sysroot where you can mount filesystems. To automatically mount the virtual machine’s filesystems under /sysroot use the -i option. This uses libguestfs inspection to find the filesystems and mount them in the right place. You can also mount filesystems individually using the -m option. Another way is to list the logical volumes (with lvs(8)) and partitions (with parted(8)) and mount them by hand: To run commands in a Linux guest (for example, grub), you should chroot into the /sysroot directory first: Virt-rescue can be used on any disk image file or device, not just a virtual machine. For example you can use it on a blank file if you want to partition that file (although we would recommend using guestfish(1) instead as it is more suitable for this purpose). You can even use virt-rescue on things like USB drives, SD cards and hard disks. You can get virt-rescue to give you scratch disk(s) to play with. This is useful for testing out Linux utilities (see --scratch)."
year_published = 2025
clearnet = "http://libguestfs.org/virt-rescue.1.html"
