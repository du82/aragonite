["https://libguestfs.org/guestfs-golang.3.html"]
title = "guestfs-golang"
full_description = "This manual page documents how to call libguestfs from the Go programming language. This page just documents the differences from the C API and gives some examples. If you are not familiar with using libguestfs, you also need to read guestfs(3). Use either guestfs.Create or guestfs.Create_flags to create the handle. The handle is closed implicitly if it is garbage collected. However it is probably a good idea to close it explicitly, either by calling g.Close () or by deferring the same. guestfs.Create and guestfs.Create_flags return a simple *error, which is really just a C errno wrapped up in the appropriate golang struct. All other calls return a *GuestfsError which (if non-nil) is a richer struct that contains the error string from libguestfs, the errno (if available) and the operation which failed. This can also be converted to a string for display. guestfs(3), guestfs-examples(3), guestfs-erlang(3), guestfs-gobject(3), guestfs-java(3), guestfs-lua(3), guestfs-ocaml(3), guestfs-perl(3), guestfs-python(3), guestfs-recipes(1), guestfs-ruby(3), http://www.golang.org/, http://libguestfs.org/. This manual page contains examples which we hope you will use in your programs. The examples may be freely copied, modified and distributed for any purpose without any restrictions. To get a list of bugs against libguestfs, use this link: https://bugzilla.redhat.com/buglist.cgi?component=libguestfs&product=Virtualization+Tools To report a new bug against libguestfs, use this link: https://bugzilla.redhat.com/enter_bug.cgi?component=libguestfs&product=Virtualization+Tools"
