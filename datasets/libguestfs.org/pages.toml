["https://libguestfs.org/guestfs-java.3.html"]
title = "guestfs-java"
full_description = "This manual page documents how to call libguestfs from the Java programming language. This page just documents the differences from the C API and gives some examples. If you are not familiar with using libguestfs, you also need to read guestfs(3). The handle is closed when it is reaped by the garbage collector. Because libguestfs handles include a lot of state, it is also possible to close (and hence free) them explicitly by calling the close method. Errors from libguestfs functions are mapped into the LibGuestFSException exception. This has a single parameter which is the error message (a String). If malloc(3) or some other allocation fails inside the bindings, the LibGuestFSOutOfMemory exception is thrown. The libguestfs event API is fully supported from Java. Create a class which implements the EventCallback interface, create an instance of this class, and then call the GuestFS#set_event_callback method to register this instance. The event method of the class is called when libguestfs generates an event. Some methods take an optional map of optional parameters. An example of this is g.add_drive which can be called in one of two ways: The pure Java JAR file which contains several classes, the primary one being com.redhat.et.libguestfs.GuestFS. Upstream, the JAR file contains a version number in the filename, but some Linux distros may rename it without the version number. The JNI code (written in C). This contains private native functions that interface between Java code and the regular libguestfs C library. You should not call these directly. To compile your Java program, you need to locate the JAR file and add it to the class path. For example: To run your Java program, you also need to ensure that the JAR file is on the class path, as well as the path of your program. For example: guestfs(3), guestfs-examples(3), guestfs-erlang(3), guestfs-gobject(3), guestfs-golang(3), guestfs-lua(3), guestfs-ocaml(3), guestfs-perl(3), guestfs-python(3), guestfs-recipes(1), guestfs-ruby(3), http://libguestfs.org/, http://caml.inria.fr/."
