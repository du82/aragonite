["https://libguestfs.org/hivex.3.html"]
title = 'hivex - Windows Registry "hive" extraction library'
full_description = '''Hivex is a library for extracting the contents of Windows Registry "hive" files. It is designed to be secure against buggy or malicious registry files. Unlike other tools in this area, it doesn't use the textual .REG format, because parsing that is as much trouble as parsing the original binary format. Instead it makes the file available through a C API, and then wraps this API in higher level scripting and GUI tools. There is a separate program to export the hive as XML (see hivexml(1)), or to navigate the file (see hivexsh(1)). There is also a Perl script to export and merge the file as a textual .REG (regedit) file, see hivexregedit(1). If you just want to export or modify the Registry of a Windows virtual machine, you should look at virt-win-reg(1). This is a node handle, an integer but opaque outside the library. Valid node handles cannot be 0. The library returns 0 in some situations to indicate an error. The enum below describes the possible types for the value(s) stored at each node. Note that you should not trust the type field in a Windows Registry, as it very often has no relationship to reality. Some applications use their own types. The encoding of strings is not specified. Some programs store everything (including strings) in binary blobs. This is a value handle, an integer but opaque outside the library. Valid value handles cannot be 0. The library returns 0 in some situations to indicate an error. The typedef hive_set_value is used in conjunction with the hivex_node_set_values call described below. Note that the value field is just treated as a list of bytes, and is stored directly in the hive. The caller has to ensure correct encoding and endianness, for example converting dwords to little endian. The correct type and encoding for values depends on the node and key in the registry, the version of Windows, and sometimes even changes between versions of Windows for the same key. We don't document it here. Often it's not documented at all. Flags is an ORed list of the open flags (or 0 if you don't want to pass any flags). These flags are defined:'''
