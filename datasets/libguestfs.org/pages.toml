["http://libguestfs.org/guestfs.3.html"]
title = "guestfs"
full_description = '''Examples of using the API from C. For examples in other languages, see "USING LIBGUESTFS WITH OTHER PROGRAMMING LANGUAGES" below. This section provides a gentler overview of the libguestfs API. We also try to group API calls together, where that may not be obvious from reading about the individual calls in the main section of this manual. Before you can use libguestfs calls, you have to create a handle. Then you must add at least one disk image to the handle, followed by launching the handle, then performing whatever operations you want, and finally closing the handle. By convention we use the single letter g for the name of the handle variable, although of course you can use any name you want. The code above doesn't include any error checking. In real code you should check return values carefully for errors. In general all functions that return integers return -1 on error, and all functions that return pointers return NULL on error. See section "ERROR HANDLING" below for how to handle errors, and consult the documentation for each function call below to see precisely how they return error indications. The code above does not free(3) the strings and arrays returned from functions. Consult the documentation for each function to find out how to free the return value. The image filename ("guest.img" in the example above) could be a disk image from a virtual machine, a dd(1) copy of a physical hard disk, an actual block device, or simply an empty file of zeroes that you have created through posix_fallocate(3). Libguestfs lets you do useful things to all of these. The call you should use in modern code for adding drives is "guestfs_add_drive_opts". To add a disk image, allowing writes, and specifying that the format is raw, do: or by calling the older function "guestfs_add_drive_ro". If you use the readonly flag, libguestfs won't modify the file. (See also "DISK IMAGE FORMATS" below). Be extremely cautious if the disk image is in use, eg. if it is being used by a virtual machine. Adding it read-write will almost certainly cause disk corruption, but adding it read-only is safe.'''
