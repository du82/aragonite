["https://libguestfs.org/guestfsd.8.html"]
title = "guestfsd"
full_description = 'guestfsd is the libguestfs daemon. Normal users never need to run this program explicitly. This man page discusses what guestfsd does in both the libguestfs appliance and when using libguestfs live. After the appliance boots, the /init script in the appliance starts guestfsd with no arguments. guestfsd opens the virtio-serial port on a known path (see "FILES"). It initiates the protocol (see "COMMUNICATION PROTOCOL" in guestfs(3)) and processes requests one at a time from the library until the appliance is destroyed. Filesystems are mounted under /sysroot and all filesystem operations happen relative to this directory. Currently (because of limitations in virtio-serial) only one client can connect at a time, and guestfsd must be restarted after each client disconnects. If libguestfs live were changed to use a different transport such as TCP/IP then this limitation could be removed. Pass the name of the virtio-serial channel, serial port, etc. over which guestfsd will communicate with the library. If this parameter is not given, then an internal default port is used. Instead of opening the guestfs_channel and thus expecting that it already exists, create the channel as a Unix domain socket, listen on it, and accept a single connection. This is mainly used for testing the daemon. Set the root filesystem to be / (instead of the default which is /sysroot). Also do not unmount filesystems when the daemon exits. Enable verbose messages. This flag is passed by the libguestfs library to the appliance to make the daemon more verbose (it acts like the -v flag on the command line). Unrelated to the daemon, it also causes the appliance init script to print out a lot more debugging information. Set the path to the virtio-serial channel to something other than the default (which is /dev/virtio-ports/org.libguestfs.channel.0). This is used by the User-Mode Linux backend to use a regular emulated serial port instead of virtio-serial. This program is free software; you can redistribute it and/or modify it under the terms of the GNU General Public License as published by the Free Software Foundation; either version 2 of the License, or (at your option) any later version.'
year_published = 2025
clearnet = "https://libguestfs.org/guestfsd.8.html"
