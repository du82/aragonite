["https://libguestfs.org/supermin.1.html"]
title = "supermin - Tool for creating and building supermin appliances"
full_description = '''Supermin is a tool for building supermin appliances. These are tiny appliances (similar to virtual machines), usually around 100KB in size, which get fully instantiated on-the-fly in a fraction of a second when you need to boot one of them. This program used to be called febootstrap. This manual page documents supermin 5.x which is a complete rewrite and quite different from febootstrap 2.x. If you are looking for the febootstrap 2.x tools, then this is not the right place. The supermin tool can be used in two modes, preparing a tiny supermin appliance, which is done on a build system. And building, which takes the supermin appliance and constructs a full, bootable appliance, which is done on the end user's system. Supermin does not need to be run as root, and generally should not be run as root. It does not affect the host system or the packages installed on the host system. --prepare creates the tiny supermin appliance in the given output directory. You give it a list of packages that you want installed, and supermin will automatically find the dependencies. The list of packages has to be installed on the host machine. creates a supermin appliance containing the packages bash and coreutils. Specifically, it creates some files in directory supermin.d. This directory is the supermin appliance. (See "SUPERMIN APPLIANCES" below). It is intended that the --prepare step is done on a central build machine, and the supermin appliance is distributed to end users (which is easy because supermin appliances are so small). --build (previously a separate program called supermin-helper) builds the full appliance from the supermin appliance: This will create files called appliance.d/kernel, appliance.d/root etc, which is the full sized bootable appliance. It is intended that the --build step is done on the end user's machine at the last second before the appliance is needed. The packages in the supermin appliance (those specified when the supermin appliance was prepared) must be installed on the end user's machine.'''
