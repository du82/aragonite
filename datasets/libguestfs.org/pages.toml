["http://libguestfs.org/guestmount.1.html"]
title = "guestmount"
full_description = '''Using guestmount in write mode on live virtual machines, or concurrently with other disk editing tools, can be dangerous, potentially causing disk corruption. The virtual machine must be shut down before you use this command, and disk images must not be edited concurrently. Use the --ro (read-only) option to use guestmount safely if the disk image or virtual machine might be live. You may see strange or inconsistent results if running concurrently with other changes, but with this option you won't risk disk corruption. The guestmount program can be used to mount virtual machine filesystems and other disk images on the host. It uses libguestfs for access to the guest filesystem, and FUSE (the "filesystem in userspace") to make it appear as a mountable device. Along with other options, you have to give at least one device (-a option) or libvirt domain (-d option), and at least one mountpoint (-m option) or use the -i inspection option. How this works is better explained in the guestfish(1) manual page, or by looking at the examples below. FUSE lets you mount filesystems as non-root. The mountpoint must be owned by you. The filesystem will not be visible to any other users unless you make configuration changes, see "NOTES" below. For a typical Linux guest which has a /boot filesystem on the first partition, and the root filesystem on a logical volume: If you don’t know what filesystems are contained in a guest or disk image, use virt-filesystems(1) first: If you mount a filesystem as one user (eg. root), then other users will not be able to see it by default. The fix is to add the FUSE allow_other option when mounting: On some distros, you may need to add yourself to a special group (eg. fuse) before you can use any FUSE filesystem. This is necessary on Debian and derivatives. On other distros, no special group is required. It is not necessary on Fedora or Red Hat Enterprise Linux. You can see this error when another process on the system jumps into the mountpoint you have just created, holding it open and preventing you from unmounting it. The usual culprits are various GUI "indexing" programs.'''
year_published = 2025
