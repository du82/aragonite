["https://libguestfs.org/guestfs-lua.3.html"]
title = "guestfs-lua"
full_description = 'This manual page documents how to call libguestfs from the Lua programming language. This page just documents the differences from the C API and gives some examples. If you are not familiar with using libguestfs, you also need to read guestfs(3). require "guestfs" returns the module, so you have to assign it to a local variable. Typical usage is: For functions that take optional arguments, the first arguments are the non-optional ones. The optional final argument is a table supplying the optional arguments. Currently 64 bit values must be passed as strings, and are returned as strings. This is because 32 bit Lua cannot handle 64 bit integers properly. We hope to come up with a better solution later. These objects also have __tostring functions attached to them so you can use tostring (or implicit conversion) to convert them into printable strings. You can also remove a callback using the event handle (eh) that was returned when you registered the callback: guestfs(3), guestfs-examples(3), guestfs-erlang(3), guestfs-gobject(3), guestfs-golang(3), guestfs-java(3), guestfs-ocaml(3), guestfs-perl(3), guestfs-python(3), guestfs-recipes(1), guestfs-ruby(3), http://www.lua.org/, http://libguestfs.org/. This manual page contains examples which we hope you will use in your programs. The examples may be freely copied, modified and distributed for any purpose without any restrictions. To get a list of bugs against libguestfs, use this link: https://bugzilla.redhat.com/buglist.cgi?component=libguestfs&product=Virtualization+Tools To report a new bug against libguestfs, use this link: https://bugzilla.redhat.com/enter_bug.cgi?component=libguestfs&product=Virtualization+Tools'
