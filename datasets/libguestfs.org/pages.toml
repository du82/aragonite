["https://libguestfs.org/guestfs-testing.1.html"]
title = "guestfs-testing"
full_description = '''This page has manual tests you can try on libguestfs. Everyone has a slightly different combination of platform, hardware and guests, so this testing is very valuable. Thanks for helping out! Tests marked with a * (asterisk) can destroy data if you're not careful. The others are safe and won't modify anything. or post on the mailing list (registration is not required, but if you're not registered then you'll have to wait for a moderator to manually approve your message): This command does a very simple, non-destructive test that basic libguestfs is functioning. You don't need to run it as root. If it doesn't print ===== TEST FINISHED OK =====, report it as a bug. It is very important that you include the complete, unedited output of libguestfs-test-tool in your bug report. See the "BUGS" section at the end of this page. If your host has hardware virt acceleration, then with a hot cache libguestfs should be able to start up in a few seconds. Run the following command a few times: After a few runs, the time should settle down to a few seconds (under 3 seconds on fast 64 bit hardware). Which kernel is being used? supermin(1) will try to pick the latest kernel installed on your machine. You can see the version in the appliance output, eg: You can use any guest disk image for this test. Make sure you use the --ro flag so that guestfish(1) will open the disk image read-only. If the command is successful, it should print out the guest operating system name and put you at the guestfish ><fs> prompt. You can use guestfish commands like ll / to look inside the disk image. To exit, type exit. If you get an error, try enabling debugging (add -v to the command line). Also make sure that libguestfs-test-tool(1) succeeds. For SSH you will need to make sure that ssh-agent is set up so you don't need a password to log in to the remote machine. Then a command similar to this should work: If you get an error, try enabling debugging (add -v to the command line). Also make sure that libguestfs-test-tool(1) succeeds.'''
