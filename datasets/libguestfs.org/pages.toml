["https://libguestfs.org/guestfs-security.1.html"]
title = "guestfs-security"
full_description = 'This manual page discusses security implications of using libguestfs, particularly with untrusted or malicious guests or disk images. If you wish to privately report a security issue, please follow the Red Hat security procedure at https://access.redhat.com/security/team/contact If the security problem is not so serious, you can simply file a bug (see "BUGS" below), or send an email to our mailing list (https://lists.libguestfs.org). You do not need to subscribe to the mailing list to send email, but there will be a delay while the message is moderated. You should never mount an untrusted guest filesystem directly on your host kernel (eg. using loopback or kpartx). When you mount a filesystem, mistakes in the kernel filesystem (VFS) can be escalated into exploits by attackers creating a malicious filesystem. These exploits are very severe for two reasons. Firstly there are very many filesystem drivers in the kernel, and many of them are infrequently used and not much developer attention has been paid to the code. Linux userspace helps potential crackers by detecting the filesystem type and automatically choosing the right VFS driver, even if that filesystem type is unexpected. Secondly, a kernel-level exploit is like a local root exploit (worse in some ways), giving immediate and total access to the system right down to the hardware level. We run a Linux kernel inside a qemu virtual machine, usually running as a non-root user. The attacker would need to write a filesystem which first exploited the kernel, and then exploited either qemu virtualization (eg. a faulty qemu driver) or the libguestfs protocol, and finally to be as serious as the host kernel exploit it would need to escalate its privileges to root. Additionally if you use the libvirt back end and SELinux, sVirt is used to confine the qemu process. This multi-step escalation, performed by a static piece of data, is thought to be extremely hard to do, although we never say ‘never’ about security issues. Callers can also reduce the attack surface by forcing the filesystem type when mounting (use "guestfs_mount_vfs" in guestfs(3)).'
year_published = 2025
clearnet = "https://libguestfs.org/guestfs-security.1.html"
