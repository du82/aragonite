["https://libguestfs.org/guestunmount.1.html"]
title = "guestunmount"
full_description = '''guestunmount is a utility to clean up mounted filesystems automatically. guestmount(1) mounts filesystems using libguestfs. This program unmounts the filesystem when a program or script has finished with it. guestunmount is a wrapper around the FUSE fusermount(1) program, which must exist on the current PATH. it waits until the pipe FD is closed. This can be used to monitor another process and clean up its mountpoint when that process exits, as described below. You can just call guestunmount mountpoint from the program, but a more sophisticated way to use guestunmount is to have it monitor your program so it can clean up the mount point if your program exits unexpectedly. In the program, create a pipe (eg. by calling pipe(2)). Let FD be the file descriptor number of the read side of the pipe (ie. pipefd[0]). After mounting the filesystem with guestmount(1) (on mountpoint), fork and run guestunmount like this: Now, when the write side of the pipe (ie. pipefd[1]) is closed for any reason, either explicitly or because the parent process exits, guestunmount notices and unmounts the mountpoint. If your operating system supports it, you should set the FD_CLOEXEC flag on the write side of the pipe. This is so that other child processes don't inherit the file descriptor and keep it open. Since bash doesn't provide a way to create an unnamed pipe, use a trap to call guestunmount on exit like this: Don’t display error messages from fusermount. The return status is still set (see "EXIT STATUS" below). By default, guestunmount will retry the fusermount operation up to 5 times (that is, it will run it up to 6 times = 1 try + 5 retries). guestunmount performs an exponential back-off between retries, waiting 1 second, 2 seconds, 4 seconds, etc before each retry. Program error, eg. could not allocate memory, could not run fusermount. See the error message printed for more information. The mount point could not be unmounted even after retrying. See the error message printed for the underlying fusermount error.'''
year_published = 2025
clearnet = "https://libguestfs.org/guestunmount.1.html"
