["https://libguestfs.org/hivexsh.1.html"]
title = "hivexsh - Windows Registry hive shell"
full_description = '''This program provides a simple shell for navigating Windows Registry 'hive' files. It uses the hivex library for access to these binary files. Firstly you will need to provide a hive file from a Windows operating system. The hive files are usually located in C:\Windows\System32\Config and have names like software, system etc (without any file extension). For more information about hive files, read hivex(3). For information about downloading files from virtual machines, read virt-cat(1) and guestfish(1). Navigate through the hive's keys using the cd command, as if it contained a filesystem, and use ls to list the subkeys of the current key. Other commands are listed below. Enable lots of debug messages. If you find a Registry file that this program cannot parse, please enable this option and post the complete output and the Registry hive file in your bug report. If this option is given, then writes are allowed to the hive (see "commit" command below, and the discussion of modifying hives in "WRITING TO HIVE FILES" in hivex(3)). Important Note: Even if you specify this option, nothing is written to a hive unless you call the "commit" command. If you exit the shell without committing, all changes will be discarded. Add a subkey named name below the current node. The name may contain spaces and punctuation characters, and does not need to be quoted. There must be no existing subkey called name, or this command will fail. To replace an existing subkey, delete it first like this: Change to the subkey path. Use Windows-style backslashes to separate path elements, and start with a backslash in order to start from the root of the hive. For example: moves from the root node, to the Classes node, to the * node. If you were already at the root node, you could do this instead: Path elements (node names) are matched case insensitively, and characters like space, *, and ? have no special significance. Be careful with cd \ since the readline library has an undocumented behaviour where it will think the final backslash is a continuation (it reads the next line of input and appends it). Put a single space after the backslash.'''
year_published = 2025
