["https://libguestfs.org/guestfs-building.1.html"]
title = "guestfs-building"
full_description = '''If that command doesn't work, take a look at the Debian source package http://packages.debian.org/source/libguestfs, at the list of build-depends and build-depends-indep, and install everything listed there. Install as many package names found in this file as possible. (It is not strictly required to install all of them). Note: If you build libguestfs followed by installing appliance packages, the build will not pick them up automatically, even if you do make clean. You have to do this command to clean the old supermin appliance and force a new one to be prepared: Required. The following features must be enabled: virtio-pci, virtio-serial, virtio-block, virtio-net. Required. We use the custom printf formatters extension of glibc (see "DAEMON CUSTOM PRINTF FORMATTERS" in guestfs-hacking(1)). Required. We use the XDR implementation from <rpc/xdr.h>, which may come from glibc, tirpc or another library. The rpcgen tool is optional, except if you want to compile from git and/or patch libguestfs with new APIs. Required. Various build steps and tests are written in Perl. Perl is not needed at runtime except if you need to run a small number of virt tools which are still written in Perl. Required. These are the OCaml bindings for Augeas, found at: http://people.redhat.com/~rjones/augeas/ Optional. fusermount(1), libfuse and kernel module are all needed if you want guestmount(1) and/or mount-local support. Optional. If available, virt-builder will use this library for fast, parallel uncompression of templates. Optional. Used to build the Erlang bindings. Note that Erlang ≤ 22 will not work unless you use libguestfs ≤ 1.42. You will need to install additional dependencies autoconf, automake, gettext, OCaml findlib and po4a when building from git. Tarballs are downloaded from http://download.libguestfs.org/. Stable tarballs are signed with the GnuPG key for rich@annexia.org, see https://pgp.mit.edu/pks/lookup?op=vindex&search=0x91738F73E1B768A0. The fingerprint is F777 4FB1 AD07 4A7E 8C87 67EA 9173 8F73 E1B7 68A0.'''
