["http://libguestfs.org/virt-edit.1.html"]
title = "virt-edit"
full_description = '''Using virt-edit on live virtual machines, or concurrently with other disk editing tools, can be dangerous, potentially causing disk corruption. The virtual machine must be shut down before you use this command, and disk images must not be edited concurrently. virt-edit is a command line tool to edit file where each file exists in the named virtual machine (or disk image). Multiple filenames can be given, in which case they are each edited in turn. Each filename must be a full path, starting at the root directory (starting with '/'). If Perl is installed, you can also edit files non-interactively (see "NON-INTERACTIVE EDITING" below). To change the init default level to 5: Add file which should be a disk image from a virtual machine. If the virtual machine has multiple block devices, you must supply all of them with separate -a options. The format of the disk image is auto-detected. To override this and force a particular format use the --format=.. option. Create a backup of the original file in the guest disk image. The backup has the original filename with extension added. This parameter sets the sector size of the disk image. It affects all explicitly added subsequent disks after this parameter. Using --blocksize with no argument switches the disk sector size to the default value which is usually 512 bytes. See also "guestfs_add_drive_opts" in guestfs(3). If using libvirt, connect to the given URI. If omitted, then we connect to the default libvirt hypervisor. When prompting for keys and passphrases, virt-edit normally turns echoing off so you cannot see what you are typing. If you are not worried about Tempest attacks and there is no one else in the room you can specify this flag to see what you are typing. Instead of launching the external editor, non-interactively apply the Perl expression EXPR to each line in the file. See "NON-INTERACTIVE EDITING" below. The default for the -a option is to auto-detect the format of the disk image. Using this forces the disk format for -a options which follow on the command line. Using --format with no argument switches back to auto-detection for subsequent -a options.'''
year_published = 2025
