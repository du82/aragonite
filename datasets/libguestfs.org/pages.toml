["https://libguestfs.org/virt-builder.1.html"]
title = "virt-builder"
full_description = 'Virt-builder is a tool for quickly building new virtual machines. You can build a variety of VMs for local or cloud use, usually within a few minutes or less. Virt-builder also has many ways to customize these VMs. Everything is run from the command line and nothing requires root privileges, so automation and scripting is simple. Note that virt-builder does not install guests from scratch. It takes cleanly prepared, digitally signed OS templates and customizes them. This approach is used because it is much faster, but if you need to do fresh installs you may want to look at virt-install(1) and oz-install(1). will list out the operating systems available to install. A selection of freely redistributable OSes is available as standard. You can add your own too (see below). will build a Fedora 25 image for the same architecture as virt-builder (so running it from an i686 installation will try to build an i686 image, if available). This will have all default configuration (minimal size, no user accounts, random root password, only the bare minimum installed software, etc.). The first time this runs it has to download the template over the network, but this gets cached (see "CACHING"). The name of the output file is derived from the template name, so above it will be fedora-27.img. You can change the output filename using the -o option: As above, but the output size will be 20 GB. The guest OS is resized as it is copied to the output (automatically, using virt-resize(1)). Note if you don’t set --root-password then the guest is given a random root password which is printed on stdout. (In Fedora, @ is used to install groups of packages. On Debian you would install a meta-package instead.) There are many options that let you customize the installation. These include: --run/--run-command, which run a shell script or command while the disk image is being generated and lets you add or edit files that go into the disk image. --firstboot/--firstboot-command, which let you add scripts/commands that are run the first time the guest boots. --edit to edit files. --upload to upload files.'
year_published = 2025
