["https://libguestfs.org/virt-alignment-scan.1.html"]
title = "virt-alignment-scan"
full_description = 'When older operating systems install themselves, the partitioning tools place partitions at a sector misaligned with the underlying storage (commonly the first partition starts on sector 63). Misaligned partitions can result in an operating system issuing more I/O than should be necessary. The virt-alignment-scan tool checks the alignment of partitions in virtual machines and disk images and warns you if there are alignment problems. Currently there is no virt tool for fixing alignment problems. You can only reinstall the guest operating system. The following NetApp document summarises the problem and possible solutions: http://media.netapp.com/documents/tr-3747.pdf The output consists of 4 or more whitespace-separated columns. Only the first 4 columns are significant if you want to parse this from a program. The columns are: When listing all libvirt domains (no -a or -d option given) this column is prefixed by the libvirt name or UUID (if --uuid is given). eg: WinXP:/dev/sda1 The exit code from the program changes depending on whether poorly aligned partitions were found. See "EXIT STATUS" below. The format of the disk image is auto-detected. To override this and force a particular format use the --format=.. option. This parameter sets the sector size of the disk image. It affects all explicitly added subsequent disks after this parameter. Using --blocksize with no argument switches the disk sector size to the default value which is usually 512 bytes. See also "guestfs_add_drive_opts" in guestfs(3). If using libvirt, connect to the given URI. If omitted, then we connect to the default libvirt hypervisor. The default for the -a option is to auto-detect the format of the disk image. Using this forces the disk format for -a options which follow on the command line. Using --format with no argument switches back to auto-detection for subsequent -a options. If you have untrusted raw-format guest disk images, you should use this option to specify the disk format. This avoids a possible security problem with malicious guests (CVE-2010-3851).'
year_published = 2025
clearnet = "https://libguestfs.org/virt-alignment-scan.1.html"
