["https://libguestfs.org/guestfs-erlang.3.html"]
title = "guestfs-erlang"
full_description = "This manual page documents how to call libguestfs from the Erlang programming language. This page just documents the differences from the C API and gives some examples. If you are not familiar with using libguestfs, you also need to read guestfs(3). The Erlang bindings are implemented using an external program called erl-guestfs. This program must be on the current PATH, or else you should specify the full path to the program: For functions that take optional arguments, the first arguments are the non-optional ones. The last argument is a list of tuples supplying the remaining optional arguments. On success, most functions return a Result term (which could be a list, string, tuple etc.). If there is nothing for the function to return, then the atom ok is returned. This indicates that the function you called is not known. Generally this means you are mixing erl-guestfs from another version of libguestfs, which you should not do. guestfs(3), guestfs-examples(3), guestfs-golang(3), guestfs-java(3), guestfs-lua(3), guestfs-ocaml(3), guestfs-perl(3), guestfs-python(3), guestfs-recipes(1), guestfs-ruby(3), http://www.erlang.org/. http://libguestfs.org/. This manual page contains examples which we hope you will use in your programs. The examples may be freely copied, modified and distributed for any purpose without any restrictions. To get a list of bugs against libguestfs, use this link: https://bugzilla.redhat.com/buglist.cgi?component=libguestfs&product=Virtualization+Tools To report a new bug against libguestfs, use this link: https://bugzilla.redhat.com/enter_bug.cgi?component=libguestfs&product=Virtualization+Tools"
year_published = 2025
