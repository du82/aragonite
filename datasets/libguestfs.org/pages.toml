["https://libguestfs.org/libguestfs-test-tool.1.html"]
title = "libguestfs-test-tool"
full_description = 'libguestfs-test-tool is a test program shipped with libguestfs to allow you to check basic libguestfs functionality is working. This is needed because libguestfs occasionally breaks for reasons beyond our control: usually because of changes in the underlying qemu or kernel packages, or the host environment. If it fails (and/or exits with non-zero error code), please paste the complete, unedited output of the test tool into a bug report. More information about reporting bugs can be found on the http://libguestfs.org/ website. If you have downloaded another qemu binary, point this option at the full path of the binary to try it. Set the launch timeout to N seconds. The default is 600 seconds (10 minutes) which does not usually need to be adjusted. If you have compiled another version of qemu from source and would like to try that, then you can use the --qemudir option to point to the qemu source directory. Note when using these options, you can ignore the business of qemu wrapper scripts ("QEMU WRAPPERS" in guestfs(3)), since libguestfs-test-tool writes a wrapper script for you if one is needed. You can tell supermin to try a different kernel. You do this by setting the environment variables SUPERMIN_KERNEL, SUPERMIN_KERNEL_VERSION and/or SUPERMIN_MODULES. If you are using the libvirt backend, then you can try out a different (eg. upstream) version of libvirt by running these commands (not as root): The first command kills any session libvirtd process(es) that may be running on the machine. The second command uses libvirt’s run script (in the top-level libvirt build directory) to set some environment variables so that the alternate version of libvirt is used to run the program. If you are using the libvirt backend, you can try without (ie. libguestfs directly launching qemu) by doing: If you are using libvirt, SELinux and sVirt, then you can try to see if changing SELinux to "permissive" mode makes any difference. Use this command as root: You can convert AVCs into suggested SELinux policy rules using tools like audit2allow(1). For more information, see the "Security Enhanced Linux User Guide".'
year_published = 2025
clearnet = "https://libguestfs.org/libguestfs-test-tool.1.html"
