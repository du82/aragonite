["http://libguestfs.org/virt-ls.1.html"]
title = "virt-ls"
full_description = 'virt-ls lists filenames, file sizes, checksums, extended attributes and more from a virtual machine or disk image. To list directories from a libvirt guest use the -d option to specify the name of the guest. For a disk image, use the -a option. virt-ls can do many simple file listings. For more complicated cases you may need to use guestfish(1), or write a program directly to the guestfs(3) API. Although it is possible to use virt-ls to look for differences, since libguestfs ≥ 1.26 a new tool is available called virt-diff(1). With the -l (--long) option, the output is like the ls -l command (more specifically, like the guestfs_ll function). Note that while this is useful for displaying a directory, do not try parsing this output in another program. Use "RECURSIVE LONG LISTING" instead. Using -lR options together changes the output to display directories recursively, with file stats, and optionally other features such as checksums and extended attributes. The fields are normally space-separated. Filenames are not quoted, so you cannot use the output in another program (because filenames can contain spaces and other unsafe characters). If the guest was untrusted and someone knew you were using virt-ls to analyze the guest, they could play tricks on you by creating filenames with embedded newline characters. To safely parse the output in another program, use the --csv (Comma-Separated Values) option. The file type, one of: - (regular file), d (directory), c (character device), b (block device), p (named pipe), l (symbolic link), s (socket) or u (unknown). The size of the file. This is shown in bytes unless -h or --human-readable option is given, in which case this is shown as a human-readable number. The UID and GID of the owner of the file (displayed numerically). Note these only make sense in the context of a Unix-like guest. The time fields are displayed as string dates and times, unless one of the --time-t, --time-relative or --time-days flags is given. The device containing the file (displayed as major:minor). This may not match devices as known to the guest.'
