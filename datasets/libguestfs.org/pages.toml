["https://libguestfs.org/virt-customize.1.html"]
title = "virt-customize"
full_description = 'Using virt-customize on live virtual machines, or concurrently with other disk editing tools, can be dangerous, potentially causing disk corruption. The virtual machine must be shut down before you use this command, and disk images must not be edited concurrently. Virt-customize can customize a virtual machine (disk image) by installing packages, editing configuration files, and so on. Virt-customize modifies the guest or disk image in place. The guest must be shut down. If you want to preserve the existing contents of the guest, you must snapshot, copy or clone the disk first. The format of the disk image is auto-detected. To override this and force a particular format use the --format option. Add a remote disk. The URI format is compatible with guestfish. See "ADDING REMOTE STORAGE" in guestfish(1). The given disk is attached to the libguestfs appliance. This is used to provide extra software repositories or other data for customization. You probably want to ensure the volume(s) or filesystems in the attached disks are labelled (or use an ISO volume name) so that you can mount them by label in your run-scripts: Specify the disk format for the next --attach option. The FORMAT is usually raw or qcow2. Use raw for ISOs. Use ANSI colour sequences to colourize messages. This is the default when the output is a tty. If the output of the program is redirected to a file, ANSI colour sequences are disabled unless you use this option. If using libvirt, connect to the given URI. If omitted, then we connect to the default libvirt hypervisor. Perform a read-only "dry run" on the guest. This runs the sysprep operation, but throws away any changes to the disk at the end. When prompting for keys and passphrases, virt-customize normally turns echoing off so you cannot see what you are typing. If you are not worried about Tempest attacks and there is no one else in the room you can specify this flag to see what you are typing. The default for the -a option is to auto-detect the format of the disk image. Using this forces the disk format for -a options which follow on the command line. Using --format auto switches back to auto-detection for subsequent -a options.'
year_published = 2025
clearnet = "https://libguestfs.org/virt-customize.1.html"
