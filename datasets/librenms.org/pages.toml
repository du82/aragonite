full_description = "Krystal is proud to help support LibreNMS with the Cloud services through our Katapult platform. With over 33,000 happy customers, Krystal provides a range of services from web hosting through dedicated servers to public cloud and more. With a 4.9/5 score on Trustpilot, you're in safe hands when it comes to choosing a trusted partner to help you with your digital needs. Wavedirect Telecommunications has been an Internet Service Provider since 2004 in the South Western region of Ontario and now Texas. We specialize in providing Internet to both urban and rural areas using wireless and cabled technology. We monitor and graph thousands of our customer and corporate devices through several programs. We found LibreNMS to be an excellent product to use with a friendly and supportive team . We helped the LibreNMS team develop support for our wireless devices and created a mobile app (IOS and Android) to help us monitor our network. We plan on supporting and working with the highly professional and skilled developers on the LibreNMS team for years to come."
