["https://librivox.org/bushido-el-alma-del-japon-by-inazo-nitobe"]
title = "LibriVox"
description = "Inazō Nitobé, plasmó el código de los samuráis, guerreros japoneses, para dar a conocer y difundir los valores y cultura de Japón, su país natal. Este conjunto de reglas no escritas y guías de acción, similar al código de caballería occidental, contribuyó a que Occidente comprendiese un poco mejor la manera de pensar y actuar de los japoneses que tanto sorprendían a los extranjeros que lo visitaban y que provocaban reacciones desde lo cómico hasta la incomprensión indignada. Fue tal el éxito que consiguió que, a pesar de ser escrito y publicado en inglés en 1908 fue traducido al japonés y a multitud de idiomas y desde entonces goza de gran difusión y es una obra de referencia incluso hoy día (Introducción por Epachuko)"
