full_description = "Listen to LibriVox Community Podcast #154 – I Can’t Wait To Record This. Hosted by jpercival. Duration: 14:16 With contributions from Jpercival, ShrimpPhish, LightCrystal, Piotrek, and KevinS. 0:00 – Introduction0:23 – My Heart has Known Its Winter by Arna Bontemps from the Short Poetry Collection 2601:20 – News Highlight: Project Status Table, Statistics, and February Libriversaries3:26 – Archive Diving: From 2007, the New York Times was opening their archives and their current Time Machine3:48 – I Can’t Wait to Record This, Submissions from LightCrystal (The Voyage of James Cook), Piotrek, and KevinS9:16 – Forum Highlights: To Breathe or Not To Breathe, How-To For Audacity, Reaper Discussion Group, Wet Magic Dramatic Reading project start up.10:20 – Bloopers by ShrimpPhish14:04 – Goodbyes We are interested in whatever feedback – positive or constructively critical – anyone has about our podcasts. Add a comment below or pop over to this forum thread. Any member of the community who has contributed readings to the LibriVox catalog can host a podcast and is most welcome to do so. Visit this thread on the forum to express an interest and float your ideas. To Subscribe to the Librivox Community Podcast, go to: http://feeds.feedburner.com/LibrivoxCommunityPodcast Or hit this itunes link to get you to the subscribe page: http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=203970211 Recent past LibriVox Community Podcast files can be found at our spot on: Archive.org and archived shows for previous years can be found at: 2006, 2007, 2008, 2009, 2010, 2011, 2012 and 2013-2018. Archived shownotes for the Community Podcast can be found at: http://librivox.org/category/librivox-community-podcast/ And the rss feed for those shownotes is: http://librivox.org/category/librivox-community-podcast/feed Listen to LibriVox Community Podcast #153 – New Year, New Goals, New Plans. Hosted by Jpercival. Duration: 15:39 With contributions from Jpercival, ShrimpPhish, TriciaG, redrun, Kitty, HannaPonomarenko. 0:00 – Introduction0:22 – A Happy New Year from A Happy New Year and Other Verses by Charles Edward de la Poer Beresford, read by Larry Wilson1:21 – 20,000 Release: Hardcase by Luke Short, Statistics, and Libriversaries3:00 – Archive Diving: Broadcasting LibriVox to Space3:50 – Goals and Planning: Discussion thread4:24 – Community Submissions – TriciaG (works by Pansy), redrun – read by jpercival7:52 – Multilingual Collection and Collaboration Information by Kitty – Pronunciation Help: All Languages – Read by ShrimpPhish9:48 – The accomplishments of the Russian-Ukrainian team by HannaPonomarenko – read by jpercival Russian Folk Tales by Afanasyev Marskarad by Olena Pchilka Chelovek v Futlyare by Anton Checkhov Samoubiytsa by Averchenko Anna Akhmatova’s Poems Zapiski okhotlika by Ivan Turgenev 12:16 – Bloopers by ShrimpPhish15:27 – Goodbyes We are interested in whatever feedback – positive or constructively critical – anyone has about our podcasts. Add a comment below or pop over to this forum thread. Any member of the community who has contributed readings to the LibriVox catalog can host a podcast and is most welcome to do so. Visit this thread on the forum to express an interest and float your ideas. To Subscribe to the Librivox Community Podcast, go to: http://feeds.feedburner.com/LibrivoxCommunityPodcast Or hit this itunes link to get you to the subscribe page: http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=203970211 Recent past LibriVox Community Podcast files can be found at our spot on: Archive.org and archived shows for previous years can be found at: 2006, 2007, 2008, 2009, 2010, 2011, 2012 and 2013-2018. Archived shownotes for the Community Podcast can be found at: http://librivox.org/category/librivox-community-podcast/ And the rss feed for those shownotes is: http://librivox.org/category/librivox-community-podcast/feed"
