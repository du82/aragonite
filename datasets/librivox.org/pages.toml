hishThe Stranger: Greg GiordanoA Voice: Winnifred Assmann6. Alfred the Great by Thomas Arne. BC for this play is alanmapstoneAlfred, King of England: Adrian StephensEltruda, Queen of England: Winnifred AssmannPrince Edward: Greg GiordanoCorin, a shepherd: Larry WilsonEmma, a shepherdess: ShrimpPhishFirst Spirit: Agnes Robert BehrEdith: dcChorus/Narration: Alan Mapstone7. A Sunny Morning by Serafín and Joaquín Alvarez Quintero, translated by Lucretia Xavier Floyd. BC for this play is RapunzelinaDoña Laura: SylphwyldPetra, her maid: ShrimpPhishDon Gonzalo: stepheatherJuanito, his servant: Greg GiordanoStage Directions: Inkell8. The Sub-Contractor, from Over the Footlights by Stephen Leacock. BC for this play is Winnifred Dump: Larry WilsonVamp: ShrimpPhishSlump: Greg GiordanoSimp: Agnes Robert BehrNarrator: Winnifred Assmann9. The Clod by Lewis Beach. BC for this play is InkellThaddeus Trask: InkellMary Trask: Agnes Robert BehrA Northern Soldier: stepheatherA Southern Sergeant: Greg GiordanoDick: Alan MapstoneStage Directions: ShrimpPhish10. Acis and Galatea by John Gay (1685-1732). BC for this play is alanmapstoneAcis: Larry WilsonGalatea: stepheatherPolyphemus: Greg GiordanoDamon: Agnes Robert BehrChorus: Alan Mapstone"
