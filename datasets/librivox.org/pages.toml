full_description = "Listen to LibriVox Community Podcast #152 – What LibriVox Taught Me, hosted by Jessie Percival. Duration: 15:25 This episode includes contributions from jpercival, shrimpphish, and redrun. * * * * * * * * * * * * * * * 0:00 – Intro0:25 – Here We Come a Wassailing from the Christmas Carol Collection 20062:12 – Archive.org update, Statistics, and Libriviersaries3:45 – Adventskalender 2024 release announcement5:37 – Archive diving – What if LibriVox Dies? a discussion inspired by a Reason Magazine Article6:42 – Ceremonies for Christmas read by Tomas Cruz for Weekly Poetry7:30 – Community Submissions12:22 – Forum Highlights – Reaper Discussion Group and How to Become a DR/Play Coordinator12:56 – Bloopers15:09 – Goodbyes * * * * * * * * * * * * * * * We are interested in whatever feedback – positive or constructively critical – anyone has about our podcasts. Add a comment below or pop over to the forum thread for this episode, for comments. Any member of the community who has contributed readings to the LibriVox catalog can host a podcast and is most welcome to do so. Visit the Community Podcast planning thread to express an interest and float your ideas. * * * * * * * * * * * * * * * To Subscribe to the Librivox Community Podcast, subscribe to the RSS feed on FeedBurner, or visit our page on the Apple Podcast Index or your favorite podcast app. Past LibriVox Community Podcast recordings can be found at our spot on Archive.org: 2006, 2007, 2008, 2009, 2010, 2011, 2012 and 2013-present. The show notes for each episode can be found on LibriVox.org."
