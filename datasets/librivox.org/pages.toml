["https://librivox.org/the-last-space-ship-by-murray-leinster"]
title = "LibriVox"
description = "Here are three stories from Murray Leinster, The Disciplinary Circuit, The Manless Worlds, and The Boomerang Circuit.  All three were published by Galaxy Magazine as one novel, The Last Spaceship. The Disciplinary Circuit is watching you. Always watching that your thoughts are correct and pure. They want only what is best for you and society. Trust the council and the Disciplinary Circuit. You are a good citizen. Aren't you? (Summary by phil chenevert)In The Manless Worlds, throughout the galaxy each planet is controlled by a government that can punish its citizens at will with death rays. On the edges a group has figured out how to tune the death rays so that they target only men. They are building a spreading empire. The planets they have attacked are now occupied primarily by women and the occupying men who arrived after the attack. Can the crew of Starshine stop them at planet Ades and save the status quo? (Summary by Vinny Lerin)In the The Boomerang Circuit, Kim Rendell is determined to escape the tyranny of his world.  He takes the Starshine out of the museum for one last trip, back to Terranova."
