["https://librivox.org/pages/thank-a-reader"]
title = "Thank a Reader |  LibriVox   Thank a Reader | free public domain audiobooks"
full_description = "General Readers love to get positive feedback. Recording can be a lonely task, and it’s nice to know that down the line someone appreciated the work, and enjoyed the recording. Thanking a reader is a lovely thing to do. Important, please read this first: It is LibriVox Policy that we do not allow unasked-for negative criticism of LibriVox recordings. If you want to give feedback to a reader, please only mention the good points. This policy applies to public forum posts as well as private messages (PMs) or emails to readers. Thanking a reader if you are not registered on the LibriVox forum: What will happen to your message Your message will be sent to a general email account that is monitored by LibriVox admins. – Thank you messages will be passed on to the relevant readers via private message on the LibriVox forum, so you can be sure it reaches the reader directly. Your comment will also be posted in the ‘Thank You’ messages for LibriVox readers thread in “Suggestions, Comments, News & Discussion” on the Librivox forum. A note about your email: We will never publish your full last name or your email address on the public forum or pass it on to a third party. However, if a reader you thanked wishes to reply to you, we will privately pass on your email address. If you do not want this, please specify in your email. Please specify in your mail: • to which book title you’re referring, if possible with the link to the relevant LibriVox catalogue page • which reader/s you’re thanking (sometimes we have more than one version of a book) • please put the reader’s name in the email subject Click here to send a thank you email! Note: clicking the link above should open a new, pre-addressed message in your email client (Outlook, or Mail, or whatever you’re using). If this doesn’t work for you, please manually type in the email address thankyou AT librivox DOT org with the usual replacements for AT and DOT. Thanking a reader if you are familiar with the LibriVox forum Please send the reader a PM directly. If you like, also post a public message in this thread in the LibriVox “Suggestions, Comments, News & Discussion” forum. If you do this, please include a note that you’ve PM’d the reader yourself, otherwise an admin will notify the reader with a link to your message."
year_published = 2025
