["https://librivox.org/pages/donate-to-librivox"]
title = "LibriVox Thanks You for Your Generous Donations |  LibriVox   LibriVox Thanks You for Your Generous Donations | free public domain audiobooks"
full_description = "Dear LibriVox Friends, Whether you’ve listened to one LibriVox book, or many, your generous donations over the past 10 years will go a long way to helping us reach our goal of recording all books in the public domain. That has always been the spirit of LibriVox: if many contribute a little, we can build something big. (Of course, this is also true of the larger donations we have received!) Even if you’ve never listened to a LibriVox book, but you believe in making books accessible to the whole world, and have to supported our work … well, we couldn’t be more grateful to you. Because of the generosity of you, our donors, and the Internet Archive, we are pleased to say that we will no longer be accepting donations specifically for LibriVox until such time as a new need arises. We encourage you to continue to support the LibriVox site through donations directly to the Internet Archive, where our forum, catalog pages and audiobook files are hosted. https://archive.org/donate And while you are here, maybe you’d like to help us by recording more public domain audiobooks? Join us … http://forum.librivox.org/ucp.php?mode=register It’s fun! Thank you! Hugh McGuire Founder, LibriVox"
