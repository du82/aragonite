description = "Ella Young (26 December 1867 – 23 July 1956) was an Irish poet and Celtic mythologist active in the Gaelic and Celtic Revival literary movement of the late 19th and early 20th century. Born in Ireland, Young was an author of poetry and children's books. She emigrated from Ireland to the United States in 1925 as a temporary visitor and lived in California. For five years she gave speaking tours on Celtic mythology at American universities, and in 1931 she was involved in a publicized immigration controversy when she attempted to become a citizen."
