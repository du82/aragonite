["https://librivox.org/pages/translation-german-pages"]
title = "Translation: German Pages |  LibriVox   Translation: German Pages | free public domain audiobooks"
full_description = "Ins Deutsche übersetzte Seiten NOTE: The “LibriVox” website and the “LibriVox” project are not associated with the German book trading company Libri GmbH (home.libri.de) or any of its affiliates and subsidiaries. Dieser Internetauftritt und das “LibriVox” Projekt stehen nicht in Zusammenhang mit dem deutschen Buchhandelsunternehmen Libri GmbH (http://home.libri.de/) oder dessen Tochterunternehmen und Niederlassungen. Wir sind dabei, die wichtigsten Teile unserer Website in verschiedene Sprachen zu übersetzten. Bitte habe Verständnis, dass es sehr schwierig ist, die Übersetzungen immer auf dem neuesten Stand zu halten, da das sehr viel Zeit braucht. Außerdem lässt es sich häufig nicht vermeiden, dass Links von den übersetzten Seiten auf englische Seiten führen. Hören LibriVox bietet freie Hörbücher aus der Public Domain. Es gibt mehrere Möglichkeiten, sie anzuhören. Der erste Schritt ist, die mp3 oder ogg Dateien auf deinen Computer zu bringen. LibriVox Katalog LibriVox Podcasts Vorlesen Hast du Lust, Kapitel von Büchern in der Public Domain aufzunehmen? Mitmachen ist ganz einfach.. Alles was du brauchst, ist dein Computer, freie Aufnahmesoftware und deine eigene Stimme. Mitmachen Besuche das Forum Die Freiwilligen bei LibriVox nehmen Kapitel gemeinfreier Bücher auf und veröffentlichen die Sprachdateien im Internet. Unser Ziel ist es, einmal alle gemeinfreien Bücher aufgenommen zu haben. LibriVox: Freie Hörbücher LibriVox Amateure nehmen Kapitel von Büchern aus der Public Domain auf und stellen die Aufnahmen wieder ins Internet. Unser Ziel ist, alle Bücher in der Public Domain als kostenlose Hörbücher zur Verfügung zu stellen. Weitere Informationen FAQ Kontakt LibriVox Links Unser Katalog So kannst Du zuhören So kannst du mitmachen Das LibriVox Forum LibriVox Wiki LibriVox Feeds LibriVox Books Podcast LibriVox Community Podcast New Releases Podcast New Releases Feed Latest News Feed Externe Links Andere Projekte"
