full_description = "Technology is ubiquitous in our world, and it’s all based on scientific discoveries. Let’s look at the beginnings of what we consider normal these days with 10 gems from our catalog. One of the best-known families of scientists with three Nobel Prizes to their name are the Curies. The biography of Pierre Curie, written by his wife Marie Curie, gives insights into their public as well as their private lives. For actress Ruth Morton, there is barely a distinction between these two. But when this gains her the attention of a stalker, detective couple Richard and Grace Duvall must look behind the scenes of the Film of Fear in the book by Frederick Arnold Kummer. Everybody is afraid of something, whether it be spiders, the dark, strangers… Arthur Christopher Benson explores the reasons and psychology behind it in Where No Fear Was: A Book About Fear. Robert Graves had to face his fears in the trenches of WWI. His early poetry, Over the Brazier, was published around that time, and it includes topics related to astronomy like the Jolly Yellow Moon and Star Talk. There must have been a lot of talk when a group of space explorers strand on a distant planet. There, they try to colonize it despite the alien life surrounding them. Florence Carpenter Diendonne describes what happens in those 33 Years in a Star. Much more pleasant is the trip through India with a steam-powered elephant. Until one of the group is targeted by his arch nemesis – who also wants to take control of the country… See what they do to step up to the challenge in Jules Verne’s novel The Steam House – also available in Spanish. When a certain Mr. Snell calls on Nicholas Carter about a kidnapping, he is so unconvincing that the famous detective refuses to take the case. Can the Photographer’s Evidence change his mind? Much more persuasive was the man who seduced Madeline, much to her fiance’s chagrin. When she cannot get over the incident, he gets her to undergo Dr. Heidenhoff’s Process to remove the haunting memory. See if it’s successful in the novel by Edward Bellamy. Could the hive mind of bees be erased? While this is not addressed in la vie des abeilles, Maurice Maeterlinck discusses everything else going on in a beehive. This book is also available in German and English. Science is never “done”, we discover something new every day. Paolo Mantegazza explores life in l’anno 3000 through the eyes of a couple planning to get married. Written in 1897, many of his predictions already came true – who knows where we’ll go from here? Enjoy – and stay curious!"
year_published = 2025
clearnet = "https://librivox.org/category/blog"
