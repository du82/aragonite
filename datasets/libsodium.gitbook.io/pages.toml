["https://libsodium.gitbook.io/doc/key_derivation"]
title = "Key derivation | Libsodium documentation"
full_description = '''Key derivationDeriving a key from a passwordSecret keys used to encrypt or sign confidential data have to be chosen from a very large keyspace. However, passwords are usually short, human-generated strings, making dictionary attacks practical.The pwhash operation derives a secret key of any size from a password and salt.Refer to the Password hashing section for more information and code examples.Deriving keys from a single high-entropy keyMultiple secret subkeys can be derived from a single master key.Given the master key and a key identifier, a subkey can be deterministically computed. However, given a subkey, an attacker cannot compute the master key nor any other subkeys.The crypto_kdf API can derive up to 2^64 keys from a single master key and context, and individual subkeys can have an arbitrary length between 128 (16 bytes) and 512 bits (64 bytes).Example:Copy#define CONTEXT "Examples" uint8_t master_key[crypto_kdf_KEYBYTES]; uint8_t subkey1[32]; uint8_t subkey2[32]; uint8_t subkey3[64]; crypto_kdf_keygen(master_key); crypto_kdf_derive_from_key(subkey1, sizeof subkey1, 1, CONTEXT, master_key); crypto_kdf_derive_from_key(subkey2, sizeof subkey2, 2, CONTEXT, master_key); crypto_kdf_derive_from_key(subkey3, sizeof subkey3, 3, CONTEXT, master_key);Usage:Copyvoid crypto_kdf_keygen(uint8_t key[crypto_kdf_KEYBYTES]);The crypto_kdf_keygen() function creates a master key.Copyint crypto_kdf_derive_from_key(unsigned char *subkey, size_t subkey_len, uint64_t subkey_id, const char ctx[crypto_kdf_CONTEXTBYTES], const unsigned char key[crypto_kdf_KEYBYTES]);The crypto_kdf_derive_from_key() function derives a subkey_id-th subkey subkey of length subkey_len bytes using the master key key and the context ctx.subkey_id can be any value up to (2^64)-1. However, with 128-bit subkeys, it is not safe to derive more than 2^48 subkeys from the same key. With subkeys that are at 160 bits or more, 2^64 subkeys can be safely derived.subkey_len must be between crypto_kdf_BYTES_MIN (inclusive) and crypto_kdf_BYTES_MAX (inclusive).Similar to a type, the context ctx is an 8 character string describing what the key is going to be used for.Its purpose is to mitigate accidental bugs by separating domains. The same function used with the same key but in two distinct contexts is likely to generate two different outputs.Contexts don’t have to be secret and can have a low entropy.Examples of contexts include UserName, __auth__, pictures, and userdata.They must be crypto_kdf_CONTEXTBYTES bytes long.If more convenient, it is also fine to use a single global context for a whole application. This will still prevent the same keys from being mistakenly used by another application.Constants:crypto_kdf_PRIMITIVEcrypto_kdf_BYTES_MINcrypto_kdf_BYTES_MAXcrypto_kdf_CONTEXTBYTEScrypto_kdf_KEYBYTESAlgorithm details:BLAKE2B-subkeylen(key=key, message={}, salt=subkey_id || {0}, personal=ctx || {0})Nonce extensionUnlike AEGIS-256, XSalsa20 (used by crypto_box_* and crypto_secretbox_*) and XChaCha20, ciphers such as AES-GCM and ChaCha20 require a nonce too short to be chosen randomly (64 or 96 bits). With 96-bit random nonces, 2^32 encryptions is the limit before the probability of duplicate nonces becomes too high.Using a counter instead of random nonces prevents this. However, keeping a state is not always an option, especially with offline protocols.As an alternative, the nonce can be extended: a key and part of a long nonce are used as inputs to a pseudorandom function to compute a new key. This subkey and the remaining bits of the long nonce can then be used as parameters for the cipher.For example, this allows using a 192-bit nonce with a cipher requiring a 64-bit nonce:Copyk = <key> n = <192-bit nonce> k' = PRF(k, n[0..127]) c = E(k', n[128..191], m)Sodium also provides the crypto_core_hchacha20() function, which can be used as a PRF for that purpose:Copyint crypto_core_hchacha20(unsigned char *out, const unsigned char *in, const unsigned char *k, const unsigned char *c);This function accepts a 32-byte (crypto_core_hchacha20_KEYBYTES) secret key k as well as a 16-byte (crypto_core_hchacha20_INPUTBYTES) input in and outputs a 32-byte (crypto_core_hchacha20_OUTPUTBYTES) value indistinguishable from random data without knowing k.Optionally, a 16-byte (crypto_core_hchacha20_CONSTBYTES) constant c can be specified to personalize the function to an application. c can be left to NULL to use the default constant.The following code snippet illustrates how XChaCha20, the variant of ChaCha20-Poly1305 with a 192-bit nonce, is built:Copy#define MESSAGE (const unsigned char *) "message" #define MESSAGE_LEN 7 unsigned char c[crypto_aead_chacha20poly1305_ABYTES + MESSAGE_LEN]; unsigned char k[crypto_core_hchacha20_KEYBYTES]; unsigned char k2[crypto_core_hchacha20_OUTPUTBYTES]; unsigned char n[crypto_core_hchacha20_INPUTBYTES + crypto_aead_chacha20poly1305_NPUBBYTES]; randombytes_buf(k, sizeof k); randombytes_buf(n, sizeof n); /* 192-bits nonce */ crypto_core_hchacha20(k2, n, k, NULL); assert(crypto_aead_chacha20poly1305_KEYBYTES <= sizeof k2); assert(crypto_aead_chacha20poly1305_NPUBBYTES == (sizeof n) - crypto_core_hchacha20_INPUTBYTES); crypto_aead_chacha20poly1305_encrypt(c, NULL, MESSAGE, MESSAGE_LEN, NULL, 0, NULL, n + crypto_core_hchacha20_INPUTBYTES, k2);PreviousThe pwhash* APINextHKDFLast updated 9 months ago'''
