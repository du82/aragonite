["https://libsodium.gitbook.io/doc/public-key_cryptography/authenticated_encryption"]
title = "Authenticated encryption | Libsodium documentation"
full_description = 'Public-key cryptographyAuthenticated encryptionExampleCopy#define MESSAGE (const unsigned char *) "test" #define MESSAGE_LEN 4 #define CIPHERTEXT_LEN (crypto_box_MACBYTES + MESSAGE_LEN) unsigned char alice_publickey[crypto_box_PUBLICKEYBYTES]; unsigned char alice_secretkey[crypto_box_SECRETKEYBYTES]; crypto_box_keypair(alice_publickey, alice_secretkey); unsigned char bob_publickey[crypto_box_PUBLICKEYBYTES]; unsigned char bob_secretkey[crypto_box_SECRETKEYBYTES]; crypto_box_keypair(bob_publickey, bob_secretkey); unsigned char nonce[crypto_box_NONCEBYTES]; unsigned char ciphertext[CIPHERTEXT_LEN]; randombytes_buf(nonce, sizeof nonce); if (crypto_box_easy(ciphertext, MESSAGE, MESSAGE_LEN, nonce, bob_publickey, alice_secretkey) != 0) { /* error */ } unsigned char decrypted[MESSAGE_LEN]; if (crypto_box_open_easy(decrypted, ciphertext, CIPHERTEXT_LEN, nonce, alice_publickey, bob_secretkey) != 0) { /* message for Bob pretending to be from Alice has been forged! */ }PurposeUsing public-key authenticated encryption, Alice can encrypt a confidential message specifically for Bob, using Bob’s public key.Based on Bob’s public key, Alice can compute a shared secret key. Using Alice’s public key and his secret key, Bob can compute the same shared secret key. That shared secret key can be used to verify that the encrypted message was not tampered with before decryption.To send messages to Bob, Alice only needs Bob’s public key. Bob should never share his secret key, even with Alice.For verification and decryption, Bob only needs Alice’s public key, the nonce, and the ciphertext. Alice should never share her secret key either, even with Bob.Bob can reply to Alice using the same system without needing to generate a distinct key pair.The nonce doesn’t have to be confidential, but it should be used with just one invocation of crypto_box_easy() for a particular pair of public and secret keys.One easy way to generate a nonce is to use randombytes_buf(). Considering the size of the nonce, the risk of a random collision is negligible.For some applications, if you wish to use nonces to detect missing messages or to ignore replayed messages, it is also acceptable to use a simple incrementing counter as a nonce. However, you must ensure that the same value is never reused. Be careful as you may have multiple threads or even hosts generating messages using the same key pairs. A better alternative is to use the crypto_secretstream() API.As stated above, senders can decrypt their own messages and compute a valid authentication tag for any messages encrypted with a given shared secret key. This is generally not an issue for online protocols. If this is not acceptable, then check out the Sealed Boxes and Key Exchange sections of the documentation.Key pair generationCopyint crypto_box_keypair(unsigned char *pk, unsigned char *sk);The crypto_box_keypair() function randomly generates a secret key and the corresponding public key. The public key is put into pk (crypto_box_PUBLICKEYBYTES bytes) and the secret key into sk (crypto_box_SECRETKEYBYTES bytes).Copyint crypto_box_seed_keypair(unsigned char *pk, unsigned char *sk, const unsigned char *seed);Using crypto_box_seed_keypair(), the key pair can also be deterministically derived from a single key seed (crypto_box_SEEDBYTES bytes).Copyint crypto_scalarmult_base(unsigned char *q, const unsigned char *n);In addition, crypto_scalarmult_base() can be used to compute the public key given a secret key previously generated with crypto_box_keypair():Copyunsigned char pk[crypto_box_PUBLICKEYBYTES]; crypto_scalarmult_base(pk, sk);Combined modeIn combined mode, the authentication tag and encrypted message are stored together. This is usually what you want.Copyint crypto_box_easy(unsigned char *c, const unsigned char *m, unsigned long long mlen, const unsigned char *n, const unsigned char *pk, const unsigned char *sk);The crypto_box_easy() function encrypts a message m, whose length is mlen bytes, using the recipient’s public key pk, the sender’s secret key sk, and a nonce n.n should be crypto_box_NONCEBYTES bytes.c should be at least crypto_box_MACBYTES + mlen bytes long.This function writes the authentication tag, whose length is crypto_box_MACBYTES bytes, in c, immediately followed by the encrypted message, whose length is the same as the plaintext mlen.c and m can overlap, making in-place encryption possible. However, do not forget that crypto_box_MACBYTES extra bytes are required to prepend the tag.Copyint crypto_box_open_easy(unsigned char *m, const unsigned char *c, unsigned long long clen, const unsigned char *n, const unsigned char *pk, const unsigned char *sk);The crypto_box_open_easy() function verifies and decrypts a ciphertext produced by crypto_box_easy().c is a pointer to an authentication tag and encrypted message combination, as produced by crypto_box_easy(). clen is the length of this authentication tag and encrypted message combination. Put differently, clen is the number of bytes written by crypto_box_easy(), which is crypto_box_MACBYTES + the length of the message.The nonce n must match the nonce used to encrypt and authenticate the message.pk is the public key of the sender that encrypted the message. sk is the secret key of the recipient that is willing to verify and decrypt it.The function returns -1 if the verification fails and 0 on success. On success, the decrypted message is stored into m.m and c can overlap, making in-place decryption possible.Detached modeSome applications may need to store the authentication tag and encrypted message at different locations.For this use case, “detached” variants of the functions above are available.Copyint crypto_box_detached(unsigned char *c, unsigned char *mac, const unsigned char *m, unsigned long long mlen, const unsigned char *n, const unsigned char *pk, const unsigned char *sk);This function encrypts a message m of length mlen using a nonce n and a secret key sk for a recipient whose public key is pk. The encrypted message is put into c.Exactly mlen bytes will be put into c since this function does not prepend the authentication tag.The tag, whose size is crypto_box_MACBYTES bytes, will be put into mac.Copyint crypto_box_open_detached(unsigned char *m, const unsigned char *c, const unsigned char *mac, unsigned long long clen, const unsigned char *n, const unsigned char *pk, const unsigned char *sk);The crypto_box_open_detached() function verifies and decrypts an encrypted message c, whose length is clen, using the recipient’s secret key sk and the sender’s public key pk.clen doesn’t include the tag, so this length is the same as the plaintext.The plaintext is put into m after verifying that mac is a valid authentication tag for this ciphertext with the given nonce n and key k.The function returns -1 if the verification fails and 0 on success.Precalculation interfaceApplications that send several messages to the same recipient or receive several messages from the same sender can improve performance by calculating the shared key only once and reusing it in subsequent operations.Copyint crypto_box_beforenm(unsigned char *k, const unsigned char *pk, const unsigned char *sk);The crypto_box_beforenm() function computes a shared secret key given a public key pk and a secret key sk and puts it into k (crypto_box_BEFORENMBYTES bytes).Copyint crypto_box_easy_afternm(unsigned char *c, const unsigned char *m, unsigned long long mlen, const unsigned char *n, const unsigned char *k); int crypto_box_open_easy_afternm(unsigned char *m, const unsigned char *c, unsigned long long clen, const unsigned char *n, const unsigned char *k); int crypto_box_detached_afternm(unsigned char *c, unsigned char *mac, const unsigned char *m, unsigned long long mlen, const unsigned char *n, const unsigned char *k); int crypto_box_open_detached_afternm(unsigned char *m, const unsigned char *c, const unsigned char *mac, unsigned long long clen, const unsigned char *n, const unsigned char *k);The _afternm variants of the previously described functions accept a precalculated shared secret key k instead of a key pair.Like any secret key, a precalculated shared key should be wiped from memory (for example, using sodium_memzero()) as soon as it is not needed anymore.c and m can overlap, making in-place encryption possible. However, do not forget that crypto_box_MACBYTES extra bytes are required to prepend the tag.Constantscrypto_box_PUBLICKEYBYTEScrypto_box_SECRETKEYBYTEScrypto_box_MACBYTEScrypto_box_NONCEBYTEScrypto_box_SEEDBYTEScrypto_box_BEFORENMBYTESAlgorithm detailsKey exchange: X25519Encryption: XSalsa20Authentication: Poly1305NotesThe original NaCl crypto_box API is also supported, albeit not recommended.crypto_box() takes a pointer to 32 bytes before the message and stores the ciphertext 16 bytes after the destination pointer, with the first 16 bytes being overwritten with zeros. crypto_box_open() takes a pointer to 16 bytes before the ciphertext and stores the message 32 bytes after the destination pointer, overwriting the first 32 bytes with zeros.The _easy and _detached APIs are faster and improve usability by not requiring padding, copying, or tricky pointer arithmetic.PreviousPublic-key cryptographyNextPublic-key signaturesLast updated 1 year ago'
