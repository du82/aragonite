["https://libsodium.gitbook.io/doc/libsodium_users"]
title = "Projects using libsodium | Libsodium documentation"
full_description = "Projects using libsodiumApplications using libsodiumHere are some applications using libsodium. Send a pull request to add yours to the list.Abot: Anonymous messaging for Slack.Aspia Remote Desktop: A remote desktop implementation (client and server) for Windows systems.Apache Tuweni: A set of libraries and other tools to aid development of blockchain and other decentralized software in Java and other JVM languages.Astroport.ONE: A spherical planetary blockchain built on IPFS run by cooperative hosts swarms based on trust level. Exclusively using libsodium through keygen and duniterpy as seed as generator for PGG, SSH, IPFS, Bitcoin, Duniter Ğ1, and more...Babble Browser Extension: A platform agnostic browser extension that allows for easy encryption and decryption of text data across the web.Cloaker: Very simple cross-platform file encryption.CurveLock: Message encryption for Windows.Cyph: End-to-end encrypted, authenticated, and ephemeral chat with voice, video, and file transfers.DAT: Nonprofit-backed data sharing protocol for applications of the future.Detsign: Use passphrases to generate deterministic Ed25519 signing keys.Discord: All-in-one voice and text chat for gamers that’s free, secure, and works on both your desktop and phone.Dircifrar: A directory synchronization and encryption tool.Dovecot: Dovecot is an open source IMAP and POP3 email server for Linux/Unix-like systems, written with security primarily in mind.Duniter: Duniter is an open source Relative Money Theory distributed forged blockchain, and the clients (silkaj, duniterpy, cesium, …) use libsodium.emberclear: An open source, privacy-first, encrypted chat app using progressive web app technologies. Built with Ember using all of the latest experimental features.ente: A simple, end-to-end encrypted backup solution for photos and videos.EQEmu: An open source project committed to providing custom EverQuest servers.Evernym Plenum: A byzantine fault tolerant protocol.Fastd: A fast and secure tunnelling daemon.FeCl: A secure message-passing server based on libsodium.Flocksy: An anonymous file synchronisation tool.Glorytun: A small, simple and very fast VPN.Ghost-Notes: A user-friendly, password protected note taking application for iOS.Habitat: Habitat, by Chef, is automation that travels with the app.Hat-Backup: A backend-agnostic snapshotting backup system.Husarnet: Open source P2P VPN to connect your laptops, servers and microcontrollers over the Internet with zero configuration.KadNode: A small P2P DNS resolution daemon based on a Distributed Hash Table.Keystone Enclave: An open source secure enclave for RISC-V processors.KeepassXC: KeePass Cross-Platform Community Edition. KeePassXC stores your passwords safely and auto-types them into your everyday websites and applications.Kickpass: A stupid simple password manager.Kryptonite: The new home for your SSH private key on your iPhone or Android.Kryptor: Free and open source file encryption software.Lageant: Libsodium Authentication Agent.Lawncipher: An embedded, encrypted, multi-purpose document store.libagentcrypt: Library for symmetric encryption using SSH Agent. It includes a command line utility able to encrypt/decrypt files and/or passwords securely with your SSH keys.Lumimaja: PasswordSafe with Argon2 KDF, data encrypted with ChaCha20-Poly1305, and YubiKey support.MLVPN: A multi-link VPN (ADSL/SDSL/xDSL/Network aggregator)Magic Wormhole: Get things from one computer to another, safely.MaidSafe: A new secure way to access a world of existing apps where the security of your data is put above all else.Metastream: Watch streaming media with friends.Minisign: A dead simple tool to sign files and verify signatures.Molch: An implementation of the Axolotl ratchet.Muon: A fast stateless VPN with obfuscation to escape traffic monitoring.Nahoft: An offline encryption tool for mobile phones designed to let people communicate during Internet shutdowns in Iran.NTPsec: A security-hardened implementation of Network Time Protocol Version 4.NanoChat: A P2P, E2E encrypted and discoverable chat application on top of nanomsg library.Network Next: A real-time CDN for game traffic. You control the network!Open Reputation: An open source decentralized platform that maps identity and reputation onto the Internet of Things.OpenBazaar: A free market for all. No fees, no restrictions.OpenGKS: An RFID gate keeper solution that automatically tracks, records data and sends text messages (SMS) and email notifications to parents upon a student’s entrance and exit in school.OpenR: Facebook’s internally designed and developed routing protocol/platform.PAVE: The password manager. Easy password sharing for teams. No cloud.PCP: Pretty Curved Privacy (pcp1) is a command line utility that can be used to encrypt files.Phase: An all-in-one platform for developers to securely create, manage and deploy application secrets across local development 💻, CI tools 🔨, and cloud ☁️ infrastructure.Pbox: A CLI password manager.Petmail: A secure communication and file-sharing system.Pichi: An Application Layer Proxy controlled via RESTful APIs.PipeSocks: A pipe-like SOCKS5 tunnel system.PowerDNS: PowerDNS has been designed to serve both the needs of small installations by being easy to set up as well as for serving very large query volumes on large numbers of domains. Additionally, PowerDNS offers very high domain resolution performance.QtCrypt: Lightweight, portable application that encrypts files and directories using a symmetric-key algorithm.Quick Crypt: A small-batch text-focused online cipher tool designed to be easy to use, trustworthy, and convenient.RavenDB: A LINQ-enabled document database for .NET.Rebel Backup: Encrypted backups of important files to Dropbox and Google Drive.Remembear: A full-featured, multi-platform password manager by TunnelBear.Reop: Reasonable expectation of privacy.Rubinius: Rubinius is a platform for building programming language technology.SODA: The SODA project aims to investigate the relationship between server components and server performance.SaltStack: SaltStack software orchestrates the build and ongoing management of any modern infrastructure.Sandstorm: An open source operating system for personal and private clouds.Secrets: Easily and securely store passwords, credit card numbers, bank details, and confidential information. Available for Mac and iOS.ShadowSocks: A secure SOCKS5 proxy designed to protect your Internet traffic.Sharekey: Encrypted data storage.Simple DnsCrypt: A simple management tool for dnscrypt-proxy.Snackis: A post-modern enigma-deviceSPAKE2+EE: A SPAKE2+ Elligator Edition implementation for libsodium.Splonebox: An open source network assessment tool with a focus on modularity.Stellar: An open platform for building financial products that connect people everywhere.TREES: A Dovecot email storage encryption plugin.Tbak: Encrypted, compressed, distributed backups.Telehash: An embeddable private network stack for mobile, web, and devices.Tezos: A new decentralized blockchain that governs itself by establishing a true digital commonwealth.Tinfoil Chat: An onion-routed, endpoint secure messaging system.Tox: A new kind of instant messaging.Ultrapowa Clash Server: UCS is a server emulator for the famous game Clash of Clans.Vim: Vim is a greatly improved version of the good old UNIX editor Vi. Libsodium is used for reading and writing encrypted files.VOLTTRON: VOLTTRON is an innovative distributed control and sensing software platform. Its source code has been released, making it possible for researchers and others to use this tool to build applications for more efficiently managing energy use among appliances and devices, including heating, ventilation and air conditioning (HVAC) systems, lighting, electric vehicles and others.Wifibroadcast: Transmitter and receiver of UDP packets using raw Wi-Fi radio.Wire: Modern, private communications. Crystal clear voice, video and group chats. No advertising. Your data