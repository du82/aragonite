["https://libsodium.gitbook.io/doc/installation"]
title = "Installation | Libsodium documentation"
full_description = '''InstallationCompilation on Unix-like systemsSodium is a shared library with a machine-independent set of headers, so it can easily be used by 3rd party projects.The library is built using Autotools, making it easy to package.Installation is trivial, and both compilation and testing can take advantage of multiple CPU cores.Download a tarball of libsodium, preferably the latest stable version, then follow the ritual:Copy./configure make && make check sudo make installOn aarch64, with some compilers, you may currently have to define -march=armv8-a+crypto+aes:Copyenv CFLAGS="$CFLAGS -march=armv8-a+crypto+aes" ./configure make && make check sudo make installSince different files are compiled for different CPU classes, and to prevent unwanted optimizations, link-time optimization (LTO) should not be used.Also, do not enable sanitizers (such as -fsanitize=signed-integer-overflow). These can introduce side channels.On Linux, if the process hangs at the make check step, your system PRG may not have been properly seeded. Please refer to the notes in the “Usage” section for ways to address this.Also, on Linux, like any manually installed library, running the ldconfig command is required to make the dynamic linker aware of the new library.Compilation on WindowsCompilation on Windows is usually not required, as pre-built libraries for MinGW and Visual Studio are available (see below).However, if you want to compile it yourself, start by cloning the stable branch from the Git repository.Visual Studio solutions can be then found in the builds/msvc directory.In order to compile with MinGW, run either ./dist-build/msys2-win32.sh or ./dist-build/msys2-win64.sh for Win32 or x64 targets.Alternatively, you can build and install libsodium using vcpkg dependency manager:Copygit clone https://github.com/Microsoft/vcpkg.git cd vcpkg ./bootstrap-vcpkg.bat ./vcpkg install libsodium ./vcpkg integrate installThe libsodium port in vcpkg is kept up to date by Microsoft team members and community contributors. If the version is out of date, please create an issue or pull request on the vcpkg repository.Pre-built librariesPre-built x86 and x86_64 libraries for Visual Studio 2017, 2019, and 2022 with stable additions (see below) are available, as well as pre-built libraries for MinGW32 and MinGW64. Note that pre-built libraries are built with the run-time Multi-threaded (/MT) and not with Multi-threaded DLL (/MD).They include header files as well as static (.LIB) and shared (.DLL) libraries for all the supported compiler versions.Note for Visual StudioProjects willing to statically link Sodium must define a macro named SODIUM_STATIC. This will prevent symbol definitions from being referenced with __dllexport.Cross-compiling to AndroidAfter unpacking the source distribution (stable is recommended), set ANDROID_NDK_HOME to the path to the Android SDK. Note that compilation is only tested on CI with the LTS version of the SDK.Then, run the android-aar.sh script:Copy./dist-build/android-aar.shThis will compile libsodium (full builds and minimal builds) for every Android architectures. The resulting libraries are in libsodium-android-<architecture> folders.In addition, this creates AAR files, that can be directly included in projects using gradle or cmake. After compilation, the script outputs the instructions to do so.Cross-compiling to Apple devicesThe apple-xcframework.sh scripts crates an xcframework package containing libsodium for iOS, macOS, Catalyst, watchOS, tvOS, visionOS and their respective emulators:Copy./dist-build/apple-xcframework.shCross-compiling to ARM microcontrollersHere is an example of cross-compiling to ARM using the GNU tools for ARM embedded processors:Copyexport PATH=/path/to/gcc-arm-none-eabi/bin:$PATH export LDFLAGS='--specs=nosys.specs' export CFLAGS='-Os' ./configure --host=arm-none-eabi --prefix=/install/path make installmake check can also build the test apps, but these have to be run on the native platform.Note: --specs=nosys.specs is only required for the ARM compilation toolchain.Please note that using libsodium on ARM Cortex M0, M3, and M4 CPUs is untested and not recommended if side-channels are a concern.Compiling with CompCertReleases can be compiled using the CompCert compiler.A typical command to compile Sodium on a little-endian system with CompCert is:Copy$ env CC=ccomp CFLAGS="-O2 -fstruct-passing" ./configure --disable-shared && \ make && sudo make installCompiling and cross-compiling with ZigZig can be used to compile or cross-compile to any supported target:Compilation for the current target:Copy$ zig build -Doptimize=ReleaseFastSize-optimized builds:Copy$ zig build -Doptimize=ReleaseSmallCross-compilation:Copy$ zig build -Doptimize=ReleaseFast -Dtarget=aarch64-windows $ zig build -Doptimize=ReleaseFast -Dtarget=riscv64-linux $ zig build -Doptimize=ReleaseFast -Dtarget=wasm32-wasiStable branchWe recommend using distribution tarballs over cloning the libsodium Git repository, especially since tarballs do not require dependencies, such as Libtool and Autotools.However, if cloning a Git repository happens to be more convenient, the stable branch always contains the latest stable release of libsodium, plus minor patches that will be part of the next version and critical security fixes while new packages including them are being prepared.Code in the stable branch also includes generated files, and does not require the autotools (Libtool, Autoconf, and Automake) to be present.To check out the stable branch, use:Copygit clone https://github.com/jedisct1/libsodium --branch stableTarballs of the stable code are also available for download and recommended if you are compiling libsodium from source.Getting startedSee the quickstart and usage sections to get started!Integrity checkingDistribution files can be verified with Minisign using the following Ed25519 key:RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3The .minisig file should be present in the same directory as the main file. The typical command to verify a file is:Copyminisign -VP RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3 -m <file>Or with GnuPG and the following RSA key:Copy-----BEGIN PGP PUBLIC KEY BLOCK----- Version: GnuPG v1 (OpenBSD) mQINBFTZ0A8BEAD2/BeYhJpEJDADNuOz5EO8E0SIj5VeQdb9WLh6tBe37KrJJy7+ FBFnsd/ahfsqoLmr/IUE3+ZejNJ6QVozUKUAbds1LnKh8ejX/QegMrtgb+F2Zs83 8ju4k6GtWquW5OmiG7+b5t8R/oHlPs/1nHbk7jkQqLkYAYswRmKld1rqrrLFV8fH SAsnTkgeNxpX8W4MJR22yEwxb/k9grQTxnKHHkjJInoP6VnGRR+wmXL/7xeyUg6r EVmTaqEoZA2LiSaxaJ1c8+5c7oJ3zSBUveJA587KsCp56xUKcwm2IFJnC34WiBDn KOLB7lNxIT3BnnzabF2m+5602qWRbyMME2YZmcISQzjiVKt8O62qmKfFr5u9B8Tx iYpSOal9HvZqih8C7u/SKeGzbONfbmmJgFuA15LVwt7I5Xx7565+kWeoDgKPlfrL 7zPrCQqS1a75MB+W/fOHhCRJ3IqFc+dT1F4hb8AAKWrERVq27LEJzmxXH36kMbB+ eQg336JlS6TmqelVFb15PgtcFh972jJK8u/vpHY0EBPij5chjYQ2nCBmFLT5O4UZ Y4Gm8Z3QLFG1EeOiz+uRdNfchxwfLkjng1UhKXSq5yuOAAeMaNoYFtCf1hAHG6tx vWyIijRxUd5c8cDZsKMuLQ34O6DuvPZyeCy6q8BTfW18miMMhIH0QTS9MwARAQAB tC5GcmFuayBEZW5pcyAoSmVkaS9TZWN0b3IgT25lKSA8akBwdXJlZnRwZC5vcmc+ iQI2BBMBCAAgAhsDAh4BAheABQJU2dF6BAsJCAcFFQoJCAsFFgIDAQAACgkQIQYn qrpwn+GpOBAAkJu5yZhLPBIznDZMr0oJ/pJiSea7GUCY4fVuFUKLpLlSjIaSxC4E 2oWG8cJoMdMhwW1x166rRZPdXFpW8eC5r+h8m25HBJ649FjMUPDi2r9uQgPdBy80 I+gFlrsinSy7xbdlUSpjrcYYCx9jYjjTwH6L1QZa+YCMFya8dob/NcdzQ0o7cNRu 5NG988cScsscXYXzI6SMouSwPGCMrQHAsM31Yb8YFbJLuDxFRCZY5+qiR8DXDzW4 Lp68fJq0X/UGW9Q+i29LMTvZZWDGBQ9bwQNtvDrPZ8SYp249cMOsR4W7FK4Y0Oea YRTBFcXaeXEKAP1ZqYrY22BDiHJO5IGY72D3j3vPATAYigwjr/qNFOt/DaERFpQ4 L7RD+E6WLHATFWxZHH/APck6q8bY4EHr8GJWA77sIqN/Ctvap759QKB8nrerT6lA 0cojhS5Ie8Lro6YsMAXDqwjzsv+VgnTgql8oAFmuU+o+6cmHUwGNHgEs+xe2UDQi kxu685gOCHfHmBwue391glHufQdveChy5eikif6q6Ndg7VH9mR335o8VJ9I+Vp/k 3W8XZBA9OEuwrxjy1EzWvcb2WGXrUHVZ32w+E9CICvFFV7JiTntG3t1Ch4/bbFwr wdkc5EZTh0c6B7YfIkEWnOnBovWBPEBkSGve371MsqBuKuBr1W4jecyIRgQQEQgA BgUCVNnRHAAKCRCSa8UXHN6kOWXzAKCGlk6DvVCqExkBd6OEsaEoOBgH5ACfcVQa z/FEgCdRsJeLi7xNwZXZ22O0IUZyYW5rIERlbmlzIDxnaXRodWJAcHVyZWZ0cGQu b3JnPokCNgQTAQgAIAIbAwIeAQIXgAUCVNnRaQQLCQgHBRUKCQgLB