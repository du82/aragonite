on libsodium.minisign-net: .NET library to handle and create Minisign signatures.neuropil: An IoT secure messaging library with end-to-end encryption written in C and using libsodium.pgsodium: Postgres extension wrapper around libsodium.spake2+ee: A SPAKE2+ implementation.iota.c: An IOTA Client library in C.Companies using libsodiumHere are some companies using libsodium, possibly in closed source products. Send a pull request to add yours to that list.Arpa Information Technology SolutionsAssa AbloyAuth0Bearch Inc.Digital OceanEAM GmbH (bytejail)Espressif SystemsFacebookInfobloxInformaticaInnovis Solutions KGKeybaseKrypt.coMagento (Adobe)MalwarebytesMongoDBMullvad VPNNetFoundry (maintainers of the OpenZiti project)OVHParagon Initiative EnterprisesPeerioPi-larPrivate Internet AccessQ-Leap NetworksRiseupSplunkSupercellTankerValveWireYandexPreviousQuickstart and FAQNextCommercial supportLast updated 2 months ago"
