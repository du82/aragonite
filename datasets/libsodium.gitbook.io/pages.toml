full_description = "Roadmaplibsodium’s roadmap is driven by its user community, and new ideas are always welcome.New features will gladly be implemented if they are not redundant and solve common problems.pre-1.0.0 roadmapAEAD construction (ChaCha20-Poly1305)API to set initial counter value in ChaCha20/Salsa20Big-endian compatibilityBLAKE2ChaCha20Constant-time comparisonCross-compilation supportDetached authentication for crypto_box() and crypto_secretbox()Detached signaturesDeterministic key generation for crypto_box()Deterministic key generation for crypto_sign()DocumentationEd25519 signaturesEmscripten supportFP rounding mode independent Poly1305 implementationFaster portable Curve25519 implementationFix undefined behaviors for C99Guarded memoryHMAC-SHA512, HMAC-SHA256Hex codecHide specific implementations, expose wrappersHigher-level API for crypto_boxHigher-level API for crypto_secretboxLift ZEROBYTES requirementsMake all constants accessible via public functionsMinGW portMinimal build modeNuGet packagesPassword hashingPluggable random number generatorPortable memory lockingPosition-independent codeReplace the build system with Autotools/LibtoolRuntime CPU features detectionSecure memory zeroingSeed and public key extraction from an Ed25519 secret keySipHashStreaming support for hashing and authenticationStreaming support for one-time authenticationSupport for arbitrary HMAC key lengthsSupport for architectures requiring strict alignmentVisual Studio port100% code coverage, static and dynamic analysisarc4random*() compatible APIEd25519 to X25519 keys conversioniOS/Android compatibility1.0.x roadmapConstant-time bin2hex() [DONE] and hex2bin() [DONE]Constant-time base64 codecs [DONE]Improve consistency and clarity of function prototypesImprove the documentationConsider getrandom(2) [DONE]Consider GitianComplete the sodium-validation projectOptimized implementations for ARM w/NEONAVX optimized Curve25119 [DONE]Precomputed interface for crypto_box_easy() [DONE]Firs