["https://libsodium.gitbook.io/doc/advanced/point-arithmetic"]
title = "Finite field arithmetic | Libsodium documentation"
full_description = "AdvancedFinite field arithmeticA set of low-level APIs to perform computations over the edwards25519 curve, only useful to implement custom constructions.Points are represented as their Y coordinate.ExamplePerform a secure two-party computation of f(x) = p(x)^k. x is the input sent to the second party by the first party after blinding it using a random invertible scalar r, and k is a secret key only known by the second party. p(x) is a hash-to-curve function.Copy// -------- First party -------- Send blinded p(x) unsigned char x[crypto_core_ed25519_UNIFORMBYTES]; randombytes_buf(x, sizeof x); // Compute px = p(x), an EC point representative for x unsigned char px[crypto_core_ed25519_BYTES]; crypto_core_ed25519_from_uniform(px, x); // Compute a = p(x) * g^r unsigned char r[crypto_core_ed25519_SCALARBYTES]; unsigned char gr[crypto_core_ed25519_BYTES]; unsigned char a[crypto_core_ed25519_BYTES]; crypto_core_ed25519_scalar_random(r); crypto_scalarmult_ed25519_base_noclamp(gr, r); crypto_core_ed25519_add(a, px, gr); // -------- Second party -------- Send g^k and a^k unsigned char k[crypto_core_ed25519_SCALARBYTES]; randombytes_buf(k, sizeof k); // Compute v = g^k unsigned char v[crypto_core_ed25519_BYTES]; crypto_scalarmult_ed25519_base(v, k); // Compute b = a^k unsigned char b[crypto_core_ed25519_BYTES]; if (crypto_scalarmult_ed25519(b, k, a) != 0) { return -1; } // -------- First party -------- Unblind f(x) // Compute vir = v^(-r) unsigned char ir[crypto_core_ed25519_SCALARBYTES]; unsigned char vir[crypto_core_ed25519_BYTES]; crypto_core_ed25519_scalar_negate(ir, r); crypto_scalarmult_ed25519_noclamp(vir, ir, v); // Compute f(x) = b * v^(-r) = (p(x) * g^r)^k * (g^k)^(-r) // = (p(x) * g)^k * g^(-k) = p(x)^k unsigned char fx[crypto_core_ed25519_BYTES]; crypto_core_ed25519_add(fx, b, vir);Point validationCopyint crypto_core_ed25519_is_valid_point(const unsigned char *p);The crypto_core_ed25519_is_valid_point() function checks that p represents a point on the edwards25519 curve, in canonical form, on the main subgroup, and that the point doesn’t have a small order.It returns 1 on success, and 0 if the checks didn’t pass.Random group elementCopyvoid crypto_core_ed25519_random(unsigned char *p);Fills p with the representation of a random group element.Elligator 2 mapCopyint crypto_core_ed25519_from_uniform(unsigned char *p, const unsigned char *r);The crypto_core_ed25519_from_uniform() function maps a 32 bytes vector r to a point, and stores its compressed representation into p.The point is guaranteed to be on the main subgroup.This function directly exposes the Elligator 2 map, uses the high bit to set the sign of the X coordinate, and the resulting point is multiplied by the cofactor.Scalar multiplicationCopyint crypto_scalarmult_ed25519(unsigned char *q, const unsigned char *n, const unsigned char *p);The crypto_scalarmult_ed25519() function multiplies a point p by a scalar n and puts the Y coordinate of the resulting point into q.q should not be used as a shared key prior to hashing.The function returns 0 on success, or -1 if n is 0 or if p is not on the curve, not on the main subgroup, is a point of small order, or is not provided in canonical form.Note that n is “clamped” (the 3 low bits are cleared to make it a multiple of the cofactor, bit 254 is set and bit 255 is cleared to respect the original design).Copyint crypto_scalarmult_ed25519_base(unsigned char *q, const unsigned char *n);The crypto_scalarmult_ed25519_base() function multiplies the base point (x, 4/5) by a scalar n (clamped) and puts the Y coordinate of the resulting point into q.The function returns -1 if n is 0, and 0 otherwise.Scalar multiplication without clampingIn order to prevent attacks using small subgroups, the scalarmult functions above clear lower bits of the scalar. This may be indesirable to build protocols that requires n to be invertible.The noclamp variants of these functions do not clear these bits, and do not set the high bit either. These variants expect a scalar in the ]0..L[ range.Copyint crypto_scalarmult_ed25519_noclamp(unsigned char *q, const unsigned char *n, const unsigned char *p);The function verifies that p is on the prime-order subgroup before performing the multiplication, and return -1 if this is not the case or n is 0. It returns 0 on success.Copyint crypto_scalarmult_ed25519_base_noclamp(unsigned char *q, const unsigned char *n);The function returns 0 on success, or -1 if n is 0.Point addition/subtractionCopyint crypto_core_ed25519_add(unsigned char *r, const unsigned char *p, const unsigned char *q);The crypto_core_ed25519_add() function adds the point p to the point q and stores the resulting point into r.The function returns 0 on success, or -1 if p and/or q are not valid points.Copyint crypto_core_ed25519_sub(unsigned char *r, const unsigned char *p, const unsigned char *q);The crypto_core_ed25519_sub() function subtracts the point p to the point q and stores the resulting point into r.The function returns 0 on success, or -1 if p and/or q are not valid points.Scalar arithmetic over LThe crypto_core_ed25519_scalar_*() function set operates over scalars in the [0..L[ interval, L being the order of the main subgroup (2^252 + 27742317777372353535851937790883648493).Non-reduced inputs are expected to be within that interval.A random scalar can be obtained using the crypto_core_ed25519_scalar_random() function introduced in libsodium 1.0.17:Copyvoid crypto_core_ed25519_scalar_random(unsigned char *r);crypto_core_ed25519_scalar_random() fills r with a crypto_core_ed25519_SCALARBYTES bytes representation of the scalar in the ]0..L[ interval.A scalar in the [0..L[ interval can also be obtained by reducing a possibly larger value:Copyvoid crypto_core_ed25519_scalar_reduce(unsigned char *r, const unsigned char *s);The crypto_core_ed25519_scalar_reduce() function reduces s to s mod L and puts the crypto_core_ed25519_SCALARBYTES integer into r.Note that s is much larger than r (64 bytes vs 32 bytes). Bits of s can be left to 0, but the interval s is sampled from should be at least 317 bits to ensure almost uniformity of r over L.Copyint crypto_core_ed25519_scalar_invert(unsigned char *recip, const unsigned char *s);The crypto_core_ed25519_scalar_invert() function computes the multiplicative inverse of s over L, and puts it into recip.Copyvoid crypto_core_ed25519_scalar_negate(unsigned char *neg, const unsigned char *s);The crypto_core_ed25519_scalar_negate() function returns neg so that s + neg = 0 (mod L).Copyvoid crypto_core_ed25519_scalar_complement(unsigned char *comp, const unsigned char *s);The crypto_core_ed25519_scalar_complement() function returns comp so that s + comp = 1 (mod L).Copyvoid crypto_core_ed25519_scalar_add(unsigned char *z, const unsigned char *x, const unsigned char *y);The crypto_core_ed25519_scalar_add() function stores x + y (mod L) into z.Copyvoid crypto_core_ed25519_scalar_sub(unsigned char *z, const unsigned char *x, const unsigned char *y);The crypto_core_ed25519_scalar_sub() function stores x - y (mod L) into z.Copyvoid crypto_core_ed25519_scalar_mul(unsigned char *z, const unsigned char *x, const unsigned char *y);The crypto_core_ed25519_scalar_mul() function stores x * y (mod L) into z.Constantscrypto_scalarmult_ed25519_BYTEScrypto_scalarmult_ed25519_SCALARBYTEScrypto_core_ed25519_BYTEScrypto_core_ed25519_UNIFORMBYTEScrypto_core_ed25519_SCALARBYTEScrypto_core_ed25519_NONREDUCEDSCALARBYTESNoteThese functions were introduced in libsodium 1.0.16, 1.0.17 and 1.0.18.For a complete example using these functions, see the SPAKE2+EE implementation for libsodium.crypto_core_ed25519_from_uniform() exposes the Elligator 2 map, using the high bit for the sign of the X coordinate.PreviousEd25519 to Curve25519NextRistrettoLast updated 6 months ago"
