description = "Belkin's new Stand Pro pairs seamlessly with iPhones and follows you around the room—perfect for livestreams."
full_description = "CES 2024: Belkin’s New 'Stand Pro' Might Be the Best Motion-Tracking Dock for iPhones Belkin's new Stand Pro pairs seamlessly with iPhones and follows you around the room—perfect for livestreams. Khamosh Pathak Jan 10, 2024 Belkin’s new iPhone stand, the Stand Pro, is showcasing at CES 2024 and is the first device to use Apple’s DockKit framework to connect to your iPhone without using a third-party app. The $179.99 Stand Pro has a cylindrical base that can rotate 360 degrees, and there’s a MagSafe motorized arm that can tilt up and down to 90 degrees. You can prop up any iPhone 12 and higher with a MagSafe connector, connect to the dock using NFC, and in an instant, it can follow you around the room. It works with your iPhone camera or any third-party app that uses it, like Instagram, TikTok, WhatsApp, and Zoom. When the dock is active, it'll automatically shift the iPhone to keep you or your subject in frame while you record or stream, and it works with both the front-facing and rear-facing cameras. When the Stand Pro is plugged into a 30W power supply, it can support up to 15W fast charging using MagSafe. You can also use the built-in battery which will last up to five hours on a charge, in case you want to use for videos away from home. The tracking can be enabled or disabled using a built-in button, and an LED will tell you when the tracking is activated. Belkin isn't the first to think about motion-tracking stands—you can find cheaper motorized stands on Amazon—but this is the first one that uses Apple’s official DockKit framework for seamlessly pairing the dock. It should have far better performance than what exists in the market right now, but we won’t truly know until the product is released. Belkin hasn't provided a release date yet, but they will start taking pre-orders in January 2024, which means the shipping date won't be too far off.[The Verge] Latest Connections Today's NYT Connections Hints (and Answer) for Sunday, March 2, 2025 