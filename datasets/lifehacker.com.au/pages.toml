["https://lifehacker.com.au/hardware/112561/news/ces-2025-the-7-coolest-things-i-saw-at-ces-unveiled"]
title = "CES 2025: The 7 Coolest Things I Saw at CES Unveiled - Hardware"
description = "Robots, motorized skis, and ice cream."
full_description = '''CES 2025: The 7 Coolest Things I Saw at CES Unveiled Robots, motorized skis, and ice cream. Jake Peterson Jan 06, 2025 I saw a lot of tech at this year's CES Unveiled. The event is filled with row after row of AI-powered, motorized, holographic, shape-shifting technology, and is only a fraction of the amount there is to see at CES in total.While there were plenty of cool, interesting, wacky, and weird things on display, seven products in particular caught my eye. In fact, some of my favorites are not necessarily products you'd be able to pickup and buy. But I appreciate both the concepts behind some of these things, as well as where the tech could go in the future. ColdSnapThis poor ColdSnap unit, with its "faulty pod" warning, was not the machine that served me ice cream.Credit: Jake PetersonI saw ColdSnap at least year's CES, and it was equally fun both times I visited the booth. ColdSnap acts like a Keurig machine for ice cream: You use a single-serve pod—a particular flavor, of course—but instead of coffee, out comes ice cream.Last year, I assumed ColdSnap's deserts wouldn't impress. An interesting concept, sure, but I imagined the single-serve design, in execution, would not be more compelling than buying a pint of ice cream from the store.Truth be told, ColdSnap makes excellent ice cream. Last year, I got the bourbon flavor, and I don't know if it was just the bourbon talking, but I really enjoyed it. (I made the same joke last time.) This year, I tried their coffee flavor, and I was impressed once again. Better yet, the rep tells me all their flavors are gluten free, and use certified gluten free oats. As someone with celiac disease, I appreciate that, and appreciate more being able to safely test taste food at a mega convention like CES. It almost takes the sting out of the $3,000 price tag. LOOICredit: Jake PetersonThere were a number of robots to see at Unveiled. Many companies seem keen on not only making a robot, but one with an anthropomorphic face. Most of them don't interest me all that much; some, in fact, creep me out. However, LOOI caught my eye. It's a robot with a WALL-E-like face, which in and of itself isn't necessarily groundbreaking. But what I found particularly interesting is you don't buy LOOI's face: You only buy the robot's body, and provide the face with your own smartphone. Your iPhone or Android sticks to LOOI and, through the app, turns it into a robot you can interact with. LOOI responds to hand gestures, so you can "push" the bot back by moving your hand towards it. (This doesn't always seem to work—or, at least, not under CES Unveiled's indoor lights.) You can also talk to LOOI: The rep asked LOOI to introduce itself to me, and it did, complete with a virtual microphone to speak into. Because LOOI operates from your smartphone's display, it can display other things besides its face. It can show text when "talking" to you; graphics, like a digital microphone or even a cheeseburger it can "eat;" or a camera view if taking a selfie. I don't think LOOI is necessarily practical, and I'm not sure what I'd actually do with one. But it's a unique concept I certainly haven't seen before.E-SKIMOCredit: Jake PetersonIf you've ever ridden an e-bike, you know how cool an experience it is. When you're used to relying on just your own momentum to move a bike, the boost from an e-bike's motor is really something else. That's how I imagine electric skis would be. E-SKIMO is working on just that: a motorized ski, that can offer a boost whether you're skiing downhill or cross-country. Trying to move on skis across long stretches of flat land is always a low-point of any ski day, so I totally welcome motorized skis (or e-skis).In addition to the motor, E-SKIMO has sensors built into the skis to collect data as you complete your runs. If you're someone who likes to track their performance and look for ways to improve, that's an enticing concept. Concept is the key word here: The product E-SKIMO showed off at CES isn't available commercially, and isn't aimed at consumers; rather, the company is looking to sell the tech to brands to integrate into their own skis. I hope it works out, so I can look forward to power-assisted skiing in my future.Electric Salt SpoonCredit: Jake PetersonThis one drew a crowd, and for good reason: "Electric Salt Spoon," developed by Kirin, claims to be able to make low sodium food taste salty. The spoon, according to Kirin, adds a "mild electrical current" through the food in your mouth, which supposedly stimulates Na+ ions that would otherwise be lost to your taste buds. To use the spoon, you scoop up your food, then press the button to trigger the electricity flow. There are four intensity levels to choose from (Kirin recommends first-time users start with the lowest setting). Then, you hit the button, and eat. The light on the spoon will turn white while you're eating, and the company advises you try to make each bite count—about half a second per bite. I did not test the spoon, so I cannot personally attest to its powers. But it's a wild idea: Can you save yourself some added salt by using an electric spoon?LISSOME R1Credit: Jake PetersonI spent many years living in small apartments without dishwasher—and I hated it. I actively avoided cooking because I could not stand having to hand wash every plate, bowl, or utensil I used. That's why LISSOME R1 piqued my interest. To be honest, I couldn't care less about its "AI wash features," or that it dries dishes in 15 minutes (even if that would be convenient). It's a low-profile portable dish washer that I would have loved having in my small kitchens. I hope this one lives up to my personal hype.Aurzen ZIPCredit: Jake PetersonAurzen's portable projector doesn't have the highest resolution at 720p. It also only lasts 90 minutes, so it's probably not excellent for most movie nights. However, its folding design is really cool: When fully folded up, it looks like a Game Boy Advance SP, which speaks to me directly. But as you unfold it, you're able to customize how you want it to project. One orientation lets you project on the wall, while another lets you project on the ceiling.I could live with the resolution on a product like this, actually. It's so portable, that if the battery life could be extended just a bit, it could make for an excellent movie machine on the go. As it is now, it's probably better for portable presentations, or movie and shows that are 90 minutes or less. BodyfriendCredit: Jake PetersonI'd be remiss not to mention the transformer massage chair. Bodyfriend was impossible to miss, since it looked like Bumblebee retired from fighting Decepticons to become a masseuse. Aside from moving around like a giant robot, it offers a slew of different zones for massages. I'm not sure I see catching on in the average household, but it was very fun to watch in action. Latest Strands Today's NYT Strands Hints (and Answer) for Saturday, March 1, 2025 Jan 06, 2025 Wordle Today’s Wordle Hints (and Answer) for Saturday, March 1, 2025 Jan 06, 2025 Connections Today's NYT Connections Hints (and Answer) for Saturday, March 1, 2025 Jan 06, 2025'''
