["https://lifehacker.com.au/mobile-apps/20019/news/you-can-now-log-into-whatsapp-with-your-email-address"]
title = "You Can Now Log Into WhatsApp With Your Email Address - Mobile Apps"
description = "You can finally sign into WhatsApp from anywhere, even if you don't have a cell signal."
full_description = "You Can Now Log Into WhatsApp With Your Email Address You can finally sign into WhatsApp from anywhere, even if you don't have a cell signal. Jake Peterson Nov 22, 2023 WhatsApp is the go-to app for texting friends and family for billions of people. But even with that giant user base, Meta has been slow to roll out certain feature and quality of life improvements we'd all benefit from.Take authentication, for example: Until now, WhatsApp has required you to authenticate your account via SMS when signing in. That's fine when it works, but you don't always have access to SMS. If all you have is a wifi connection, for example, or you don't have your phone on hand, you won't be able to receive the SMS code to verify your identity. An alternative authentication method would go a long way here. And we finally have one. Meta has added an option to verify your email address with your WhatsApp account for the first time. When you do, you'll be able to use a code sent yo your email to confirm your identity, rather than rely on traditional SMS. The change comes with the latest update to WhatsApp on iOS, as spotted by WABetaInfo. You wouldn't know it by looking at WhatsApp version 23.24.70 on the App Store: The release notes only mention the update fixes a bug responsible for app slowdown for some users. To be clear, this isn't wholly replacing SMS. You still need to connect your phone number with WhatsApp, as you always have. This is instead a secondary verification option for those times you can't or don't want to use SMS.How to verify your email address with WhatsAppTo check out the new feature, update WhatsApp to the latest version, then head to Settings > Account. Here, you'll see a new Email Address option. Tap it, then enter an email address you'd like to use to verify your WhatsApp account. Tap Next, then wait for WhatsApp's six digit code to hit your inbox. If you have your email account set up in iOS 17, you might even see the option to autofill the code from the Mail app. In either case, enter the code, then tap Verify.Once WhatsApp verifies your email address, you're all set. Going forward, if you sign into WhatsApp on a new device, or you need to log into your own app again, you can choose to authenticate yourself with your email address instead of via SMS. Latest Strands Today's NYT Strands Hints (and Answer) for Saturday, March 1, 2025 Nov 22, 2023 Wordle Today’s Wordle Hints (and Answer) for Saturday, March 1, 2025 Nov 22, 2023 Connections Today's NYT Connections Hints (and Answer) for Saturday, March 1, 2025 Nov 22, 2023"
