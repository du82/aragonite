title = "Apple Intelligence Is Now on by Default, but You Can Turn It Off"
description = "iOS 18.3 is going to drag you kicking and screaming into the AI era."
full_description = "Apple Intelligence Is Now on by Default, but You Can Turn It Off iOS 18.3 is going to drag you kicking and screaming into the AI era. Michelle Ehrhardt Jan 29, 2025 Credit: Apple Apple Intelligence had a slow rollout, launching with a waitlist and only recently allowing access to AI images and its emoji generator. But following yesterday's release of iOS 18.3/iPadOS 18.3/MacOS 15.3, it seems Apple is finally ready to follow Microsoft and Google’s leads and start putting its AI features front-and-center.According to the update's release notes, Apple Intelligence has gone from an opt-in feature to an opt-out one. In other words, if you have an AI-compatible iPhone (meaning the iPhone 15 Pro and above) or iPad (meaning it has an A17 chip or above), Apple Intelligence will be toggled on by default as soon as you upgrade. As seen in a separate post here, that also extends to AI-compatible Macs, or any Mac running an M1 chip or above.Here’s Apple explaining it in the company’s own words:For users new or upgrading to iOS 18.3, Apple Intelligence will be enabled automatically during iPhone onboarding. Users will have access to Apple Intelligence features after setting up their devices. To disable Apple Intelligence, users will need to navigate to the Apple Intelligence & Siri Settings pane and turn off the Apple Intelligence toggle. This will disable Apple Intelligence features on their device.It’s a major last-minute change to what was a fairly boring update during its betas—although unlike Google’s plan to eventually replace Google Assistant with Gemini, at least Apple still gives you the option to opt out. That tracks with Apple’s other big change for the patch, which sees the company rolling back some of the features associated with Apple Intelligence’s AI-generated notification summaries.Apple Intelligence isn’t without its perks, although for me, the biggest difference I’ve seen since enabling it is that Siri’s UI looks a little different. It’s still got more features on the way, including the ability for Siri to natively pull context from your screen and your messages, so it’ll presumably get better, but it’s understandable if you’d rather hold off for now. Especially given that it now takes up a whole 7GB of storage space.How to opt out of Apple Intelligence in iOS 18.3To ensure you’ve got Apple Intelligence disabled, keep an eye on your device's screen. If summoning Siri turns on a purple border all around your display, you’ve been opted into AI. To opt out of Apple Intelligence and go back to the standard, AI-less experience, navigate to Settings > Apple Intelligence & Siri and flip off the Apple Intelligence toggle at the top of the page. Latest Connections Today's NYT Connections Hints (and Answer) for Sunday, March 2, 2025 Jan 29, 2025 Tech You Can Get This PC Gaming Cheats Subscription on Sale for A$55 Right Now Jan 29, 2025 Strands Today's NYT Strands Hints (and Answer) for Saturday, March 1, 2025 Jan 29, 2025"
