["https://lifehacker.com.au/hardware/112573/news/ces-2025-this-beach-umbrella-can-charge-your-phone"]
title = "CES 2025: This Beach Umbrella Can Charge Your Phone - Hardware"
description = "The built-in solar panels mean you don't need to lug a battery backup to the beach."
full_description = "CES 2025: This Beach Umbrella Can Charge Your Phone The built-in solar panels mean you don't need to lug a battery backup to the beach. Amanda Blum Jan 07, 2025 If what you enjoy most about the beach is sitting in the shade, sipping a cold beverage, and scrolling on your phone, have I got exciting news for you: Today at CES, Anker Solix announced the immanent release of a new Solar Beach Umbrella, as well as an electric cooler, the EverFrost 2. When used together, these devices can quite literally work to keep you cool this summer. Outdoor umbrellas with solar panels aren’t entirely new, and the options currently on the market typically have a small solar-capturing panel that can power lights built into the frame. However, Anker is approaching solar integration in its outdoor furniture differently. The panels span the entire crown of the umbrella, offering 100W of maximum solar input, which is the same as a standard solar panel. They seem wildly efficient at producing energy, too—Anker promises 200% solar generation in low light (20,000lux), and 130% in bright light intensity (50,000lux). This means the umbrella will create a generous amount of solar driven energy even when it is overcast. Credit: Anker SolixWhat will you do with all that energy? Probably recharge your phone, or perhaps a speaker. But Anker thinks you might also want to plug in any of the many power stations it sells, to get even more juice for your devices. Maybe you'll plug it directly into the EverFrost 2, to keep food and drinks frosty? (Though fully charged, the cooler will last 52 hours using only the onboard battery, so you’d only need the umbrella to power if you're planning to spend a long time at the beach.) The umbrella has XT-60 and USB-C ports, and the battery on the cooler also acts as a power bank, offering 60W USB-C and 12W USB-A charging. The umbrella is 84 inches tall and 74 inches in diameter, enough to keep a few people shaded during the day. The solar panels are waterproof (rated IP67) and use sunshade fabric to reduce heat under the umbrella. Anker hasn't indicated what the cooler or umbrella weigh, an important omission given hauling these things to the beach might be a lot of work, what with all that battery power onboard. It's more likely you'll keep the umbrella on your patio, where it will become an additional source of power in your yard. Anker Solix is solidly a battery company. They make terrific backup batteries, from tiny portables to whole home backups. They have a whole line of solar generators, and the solar panels to go with them. While solar power was for years relegated to powering outdoor goods that you didn’t have electricity for, and was generally unreliable, these days I actively choose solar over batteries because the technology has improved phenomenally. The solar panels on my outdoor security cameras perform astoundingly, even through weeks of overcast weather. While umbrella and cooler companies have previously tred to bring solar into their products, the results haven't always been reliable, and the part they struggled with—the solar panels—is precisely the tech that Anker Solix is known for. But more importantly, I think this speaks to where solar is headed. Consider what smart plugs can tell us: For years inside the home, we have been able to install smart plugs to turn common items into “smart” devices. Eventually, that connectivity made its way to the devices themselves. By bringing solar panels to devices themselves, Anker Solix is reducing the need for its own power stations. Imagine a future where you don't need to lug around a giant power bank, but only the devices you want to use, all of which will all have onboard solar power. It will be interesting to see how Anker leverages solar moving forward to build out other experiences. Why not patio furniture that heats in winter or cools in summer?The Anker Solix Beach Umbrella will be available this summe, with pricing to be announced. The Everfrost 2 will be available Feb. 21 in three sizes, starting at $699. Latest Strands Today's NYT Strands Hints (and Answer) for Sunday, March 2, 2025 Jan 07, 2025 Wordle Today’s Wordle Hints (and Answer) for Sunday, March 2, 2025 Jan 07, 2025 Connections Today's NYT Connections Hints (and Answer) for Sunday, March 2, 2025 Jan 07, 2025"
