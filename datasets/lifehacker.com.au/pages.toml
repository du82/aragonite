description = "A surprise, to be sure, but a welcome one."
full_description = "CES 2025: Sony Just Revealed When 'The Last of Us' Season Two Is Dropping A surprise, to be sure, but a welcome one. Jake Peterson Jan 07, 2025 Sony may have won CES as far as I’m concerned—and the expo hasn’t even officially started. The company made a number of announcements during its big CES media event, including pricing and availability information for its highly anticipated AFEELA car (a joint partnership with Honda). But it was the last announcement of the night that particularly caught my attention and excitement. Sony surprised us all by welcoming Neil Druckmann, studio head of Naughty Dog, to the stage. Druckmann mentioned the studio’s upcoming space adventure game, The Intergalactic, but then revealed the company had one small announcement to make. Credit: Jake PetersonThe Last of Us season two drops in April As you might expect after a CES introduction from Neil Druckmann, Sony presented a new teaser for The Last of Us season two. Of course, there's fresh footage we didn't see in the season's first trailer, as well as intriguing snippets of performances from Pedro Pascal, Bella Ramsey, Kaitlyn Dever, and Gabriel Luna. I don't want to spoil the story for anyone who hasn't played The Last of Us Part II, but if you're a fan of season one, you're in for a ride. All that said, the teaser closed with the most important announcement of all CES: Season two kicks off in April. Sony hasn’t given an exact date for this April release, but it’s more information than we’ve had before, and I’m here for it. I’ll be watching this teaser on repeat until the show aires. Sony is turning more of its games into shows and moviesIn addition to The Last of Us’ second season, Sony also announced a Ghost of Tsushima anime, a movie adaptation of Helldivers 2, as well as a Horizon Zero Dawn feature film, however the latter is only in the early stages of development. Sony is clearly all-in on adapting its IP, and I don't blame them. The company touted the box office success of its Uncharted movie, and noted that it was proud of other adaptations like Grand Turismo, Twisted Metal, and, of course, The Last of Us. The company also reminded the audience of its upcoming film adaptation of Until Dawn, showing off a spot filmed with actor Peter Stormare to promote it. Latest Strands Today's NYT Strands Hints (and Answer) for Saturday, March 1, 2025 Jan 07, 2025 Wordle Today’s Wordle Hints (and Answer) for Saturday, March 1, 2025 Jan 07, 2025 Connections Today's NYT Connections Hints (and Answer) for Saturday, March 1, 2025 Jan 07, 2025"
