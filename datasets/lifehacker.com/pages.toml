title = "The Horniest Erotic Thrillers Ever Made | Lifehacker"
description = "Demi Moore is very much back in the conversation with her well-deserved Oscar nomination. The star of films like Indecent Proposal, Mortal Thoughts, and Disclosure is back, which begs us to take another look at the best erotic thrillers, then and now."
full_description = '''Whatever happened to the erotic thriller? There’s something of a bell curve to the distribution of the subgenre, rising with the relaxing of the production code in the late 1960s, topping out in the ‘80s with prestige fare like Fatal Attraction, and tailing off by the mid-2000s to the dominance of franchise culture. Today’s box office values big-budget, four-quadrant blockbusters, making marketing of films about adult sexuality nearly impossible. Streaming has opened a window for movies that resemble the erotic thrillers of yore, but the kind they used to make—feature lurid hooks and big stars—remain decidedly absent from theaters. (Genre master Adrian Lyne even returned to the director’s chair for the Ben Affleck/Ana de Armas Hulu thriller Deep Water in 2022, which was a welcome—if largely critically reviled—throwback.) Sex on the big screen is creeping back in as the superhero tide recedes, but sex on the big screen is down by nearly half since 2000. Plenty will say that's a good thing; those people are wrong. Yes, there’s plenty to criticize, even in the best examples of the form. The sex is often more titillating than realistic; the movies have also almost always been written and directed by men and emphasized on male perspectives, and many of the women who starred in them didn’t have the best time of it (consider Sharon Stone’s oft-repeated accusations that an iconic nude scene in Basic Instinct involved a nasty bit of trickery from director Paul Verhoeven). It's also very much the case that explicit imagery isn't a requirement for eroticism, as some of these films will show—but we're also not here to be prudish.And yet, it remains curious the way sex seems to have largely vanished from mainstream, theatrically released films. So without further ado, let’s celebrate some of the best—or at least the most interesting—examples of a type of movie that they just don’t make anymore.Dressed to Kill (1980) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-AE37peg5fTU', data: {"slug":"AE37peg5fTU","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=AE37peg5fTU"}, videoPlayerType: 'in-content' }); Any erotic thriller worth its salt pays at least some tribute to Alfred Hitchcock, film noir, or both, and director Brian de Palma set the tone with Dressed to Kill, a juicy mystery involving a sex worker (Nancy Allen) who witnesses a murder and becomes both the prime suspect and the killer’s probable next victim. The style is absolutely delicious, and there’s a reason it started a new trend; the blend of classic tropes and overt sex is almost too hot to handle. Without spoiling too much, though, it very much comes from an era in film when queer representation was limited to absolutely batshit killers, and so loses some points for falling back on lazy (and overused, even in 1980) stereotypes. You can stream Dressed to Kill on Tubi and MGM+ or rent it from Prime Video. Dressed to Kill (1980) at Prime Video Learn More Learn More at Prime Video After Dark, My Sweet (1990)If it weren't for the sweaty couplings between Jason Patric and Rachel Ward, the plot of After Dark, My Sweet would be perfectly befitting that of a classic noir. Patric plays an ex-boxer (and mental hospital escapee) who takes a job fixing up an old house for widow Ward although, naturally, there's more to it—Uncle Bud (Bruce Dern), almost certainly not an uncle, shows up to embroil them all in a kidnapping scheme involving a rich man's kid. Based on the Jim Thompson novel, and almost certainly the purest adaptation of that great crime writer's work, there's a visceral, believable sleaziness here that suits the material perfectly. You can stream After Dark, My Sweet on Tubi or rent it from Prime Video. After Dark, My Sweet (1990) at Prime Video Learn More Learn More at Prime Video Dangerous Game (1993) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-aUgOLi4f2G4', data: {"slug":"aUgOLi4f2G4","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=aUgOLi4f2G4"}, videoPlayerType: 'in-content' }); Provocative director Abel Ferrara is best known, perhaps, for Bad Lieutenant, while Madonna's very brief erotic-thriller phase is typically seen to be represented by Body of Evidence. Dangerous Game, though, is better than both of them: brutal and immediate, with a couple of stunning lead performances from Harvey Keitel and Madonna. Keitel plays an indie director increasingly obsessed with the low-budget marital drama he's filming, while Madonna plays a young actress whose confidence is slowly eroded by the role, and by the increasingly unhinged demands of her director. You can stream Dangerous Game on Prime Video and MGM+. Dangerous Game (1993) at Prime Video Learn More Learn More at Prime Video Body Double (1984) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-LyqYgOQHzRc', data: {"slug":"LyqYgOQHzRc","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=LyqYgOQHzRc"}, videoPlayerType: 'in-content' }); Though it's far less successful than his earlier Dressed to Kill, Brian de Palma’s Body Double is, in many ways, a better film, upping the sex and violence while also simplifying the plot and narrowing the focus. Craig Wasson plays Scully, a failed actor housesitting in the Hollywood Hills. Bored and looking through the house’s telescope, he spies a beautiful woman and then, of course, witnesses her murder. He winds up a suspect in the case, getting caught up in the world of Hollywood porn when he seeks the help of adult film actress Holly (played by Melanie Griffith in a career-making role) to solve it. There’s nothing particularly sympathetic about Scully—he’s alternately a dupe or a bad decision maker—and that’s as it should be. As with the best classic noir, we’re not cheering for Scully; we’re witnessing his long fall. You can stream Body Double on Tubi and The Criterion Channel or rent it from Prime Video. Body Double (1984) at Prime Video Learn More Learn More at Prime Video Eyes Wide Shut (1999) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-VSS47StLOhk', data: {"slug":"VSS47StLOhk","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=VSS47StLOhk"}, videoPlayerType: 'in-content' }); As an erotic thriller, Stanley Kubrick's Eyes Wide Shut is a bit of a bait-and-switch, but just a bit. Teasers promised nothing less than a look inside the bedroom of then-power couple Nicole Kidman and Tom Cruise, with Kubrick doing for cinematic fucking what he'd done for space travel or spooky hotels. And he does, just not in the way we expected: Bill Harford (Cruise) goes on a long night's journey involving murders and sex clubs full of R-rated kink, discovering the dangers of raw titillation and the dehumanizing nature of sexual obsession. For his last film, Kubrick created an erotic thriller that challenges expectations of the genre. You can stream Eyes Wide Shut on The Criterion Channel or rent it from Apple TV+. Eyes Wide Shut (1999) at Apple TV+ Learn More Learn More at Apple TV+ Angel Heart (1987) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-0iKzekw3xn8', data: {"slug":"0iKzekw3xn8","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=0iKzekw3xn8"}, videoPlayerType: 'in-content' }); Mickey Rourke plays private dick Harry Angel, under contract from Robert De Niro’s Louis Cypher to track down an iconic singer who has disappeared. Not only do Angel’s leads keep turning up dead, but he crosses paths with Epiphany Proudfoot (Lisa Bonet), daughter of the singer, with whom he has enjoys some memorably rough sex. There’s a ton of style and eroticism on display, as well as a questionable voodoo aesthetic, but the film is memorable for its blend of tones and for the performances, particularly those of Bonet and Rourke. You can rent Angel Heart from Prime Video. Angel Heart (1987) at Prime Video Learn More Learn More at Prime Video 9 1/2 Weeks (1986) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-IMmbnLR3VC4', data: {"slug":"IMmbnLR3VC4","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=IMmbnLR3VC4"}, videoPlayerType: 'in-content' }); The movie that helped to propel director Adrian Lyne (Fatal Attraction, Indecent Proposal, Unfaithful, and 2022's Deep Water) to fame was also co-written by Zalman King of Red Shoe Diaries fame. In that, it represents a team-up of erotic thriller royalty that’s still mostly effective because of the performances from an early-career Mickey Rourke and Kim Basinger. Very much the Fifty Shades of Grey of its era (except with actual heat), Rourke plays a Wall Street trader who leads Basinger’s art gallery assistant down an increasingly kinky road.Rourke, by then at a much different place in his career, starred in a direct-to-video sequel in 1997, but kept away from 1998's similarly low-rent prequel. Which is all to say that you could spend a fair bit of time in the steamy 9 1/2 Weeks-verse if you are so inclined. You can rent 9 1/2 Weeks from Prime Video. 9 1/2 Weeks (1986) at Prime Video Learn More Learn More at Prime Video Fatal Attraction (1987) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-IAsBghop-hw', data: {"slug":"IAsBghop-hw","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=IAsBghop-hw"}, videoPlayerType: 'in-content' }); Elements of Fatal Attraction aren’t nearly as appealing today as they were three decades ago, but it remains a taut, suspenseful thriller that brought its adult sexuality (including a memorably awkward bit involving the kitchen sink) all the way to the Oscars; though it didn’t win anything, the movie was nominated in all the top categories. Glenn Close (as femme fatale Alex) is clearly having the time of her life playing an unhinged woman who absolutely loses her shit over married Dan (Michael Douglas). The setup has a strong whiff of “women, amirite?,” but the screenplay is smart enough to recognize that Dan isn’t the hero either, and the two generate real heat. You can stream Fatal Attraction on Paramount+ or rent it from Prime Video. Fatal Attraction (1987) at Paramount+ Learn More Learn More at Paramount+ Trois (2000) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-iTjTlgCyeYY', data: {"slug":"iTjTlgCyeYY","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=iTjTlgCyeYY"}, videoPlayerType: 'in-content' }); What we think of as the erotic thriller genre is overwhelmingly white. Major studios, who had already shown little interest in making films about and marketed for Black people, were clearly even less interested in dealing with sexuality among POC characters. That reticence is a big part of the reason Trois stands out, even though it doesn’t subvert genre tropes in any other way. But it’s also a juicy drama in its own right, about a man who talks his wife into joining him in a threesome, only to discover their choice of a third wasn’t smart. It did respectable business as an independent film, and very well among Black audiences. It spawned two less successful, but generally sweatier, sequels. You can stream Trois on Tubi and Prime Video. Trois (2000) at Prime Video Get Deal Get Deal at Prime Video No Way Out (1987) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-N69MOeO5bi0', data: {"slug":"N69MOeO5bi0","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=N69MOeO5bi0"}, videoPlayerType: 'in-content' }); There’s a lot of Hitchcock in the more overtly sexual thrillers of the ‘80s and ‘90s, reflecting the full expression of the master’s more subdued eroticism (Hitchcock himself seemed eager, at the end of his career, to explore filmmaking with more freedom in movies like Frenzy). Neo-noir No Way Out certainly doesn’t hit the heights of the films that inspired it, but does make a lot out of a twisty-turny plot involving a love triangle between Kevin Costner, Sean Young, and Gene Hackman(!) and a murder for which Costner is the chief investigator—and also the prime suspect. It’s not the hottest movie of the era, but there’s real chemistry at work, as Costner’s all-American charm plays well against Young at her early-career peak—and before Hollywood misogyny shoved her aside. You can stream No Way Out on Tubi and MGM+ or rent it from Prime Video. No Way Out (1987) at Prime Video Learn More Learn More at Prime Video Bad Influence (1990) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-tCUzYCUouMA', data: {"slug":"tCUzYCUouMA","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=tCUzYCUouMA"}, videoPlayerType: 'in-content' }); The female characters in this Curtis Hanson film are almost entirely incidental, if you couldn’t tell from the poster, which features Rob Lowe, James Spader, and a nondescript woman whose face we don’t see. Nebbishy Michael (James Spader) starts palling around with more experienced Alex (Rob Lowe), going on adventures involving sex, drugs, and light crime. Which is all fine and fun, until Michael realizes thrill-loving Alex is 100% going to get him killed. The movie loses points for a lack of substantive female presence (and for being a creepy choice for a comeback following Lowe’s teenage sex tape scandal), but stands out by focusing its sexual chemistry around the two mismatched leading men. You can stream Bad Influence on Pluto TV. Bad Influence (1990) at Pluto TV Learn More Learn More at Pluto TV Basic Instinct (1992) window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-cvktbdKzsq4', data: {"slug":"cvktbdKzsq4","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=cvktbdKzsq4"}, videoPlayerType: 'in-content' }); A genuine pop-culture phenomenon as much for its controversies as for its quality, Basic Instinct nabbed a couple of Academy Award nominations as well as plenty of appreciation for Sharon Stone’s career-making performance. Director Paul Verhoeven (Showgirls) knows all about elevating lurid material to the level of art, or at least camp, so the movie works even though its central mystery doesn’t make much sense. Michael Douglas plays a police detective investigating a murder who gets caught up in a torrid, occasionally kinky affair with the prime suspect Catherine Tramell (Stone). The bisexual serial killer angle was already a tired trope by the time of the movie’s release, but there’s no question that Catherine Tramell is a memorable (and, I suppose, sex-positive) villain. Stone participated in the big budget, entirely forgettable 2006 sequel. You can stream Basic Instinct on Paramount+ and Pluto TV or rent it from Prime Video. Basic Instinct (1992) at Paramount+ Learn More Learn Mor'''
