full_description = '''Prime Video has new installments of two familiar series coming in March. First up is season three of The Wheel of Time (March 13), an adaptation of Robert Jordan's fantasy books of the same name. Rosamund Pike stars as sorceress Moiraine Damodred, a member of the powerful Aes Sedai. The season opens with a magical battle between members of the order—viewers will get a three-episode premiere with five weekly episodes to follow. Also in its third season is Bosch: Legacy (March 27)—also an adaptation, this time of Michael Connolly's crime novels. A sequel to Prime Video hit Bosch, the series was originally canceled after its second season but was revived for a third and final installment. Titus Welliver reprises his role as former LAPD detective Harry Bosch working to solve his final case. Prime Video is also releasing Holland (March 27), a mystery thriller starring Nicole Kidman as a teacher and homemaker in an idyllic Michigan town, where mysteries and secrets begin to unravel her life. The film also stars Matthew Macfadyen (of Succession) as Kidman's husband and Gael García Bernal as her close friend. window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-IJm3LHoqdA4', data: {"slug":"IJm3LHoqdA4","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=IJm3LHoqdA4"}, videoPlayerType: 'in-content' }); Here are all the originals coming to Prime Video in March.What’s coming to Prime Video in March 2025Available March 6For the Win: NWSLPicture ThisAvailable March 13The Wheel of Time S3Available March 20Tyler Perry's DuplicityAvailable March 27Bosch: Legacy S3Holland'''
