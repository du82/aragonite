title = "The Best TV Series to Stream This Week | Lifehacker"
description = "If you're looking for a new show to watch this week, I've got your back. I've scoured the schedules of Netflix, Prime, Max, Hulu, and other streaming platforms to bring you the best and most notable shows streaming this week."
full_description = '''If you're looking for a new show to watch this week, I've got your back. I've scoured the schedules of Netflix, Prime, Max, Hulu, and other streaming platforms to bring you the best and most notable shows streaming this week. Running Point window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-thA5bHMjOI4', data: {"slug":"thA5bHMjOI4","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=thA5bHMjOI4"}, videoPlayerType: 'in-content' }); Kate Hudson stars in this basketball-based comedy series created by the always inventive Mindy Kaling. Hudson plays Isla Gordon, whose family owns storied Los Angeles basketball team the LA Waves. When her brother is forced to step down as president, Isla takes over, setting up a classic culture-clash of a woman entering a massively male-dominated space. Will she win over skeptical players, fans, investors, and her own brothers? I'd bet on "yes," now that sports betting is allowed in the U.S. Where to stream: NetflixHouse of David window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-sqk1J3R9Rg4', data: {"slug":"sqk1J3R9Rg4","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=sqk1J3R9Rg4"}, videoPlayerType: 'in-content' }); No matter what you think of this "God" person, the Bible contains a lot of great stories, including that of David, who, like Madonna, needs no last name. House of David is a faith-based series that starts with the fall of King Saul and the anointing of his successor, David, a teenage outcast who seems to have no business being king of anything. But David embarks on a personal journey of discovery and eventually (spoiler alert) becomes the greatest king of Israel. God, as they say, works in mysterious ways. Where to stream: PrimeGrosse Pointe Garden Society window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-iwJ8P6GZvkU', data: {"slug":"iwJ8P6GZvkU","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=iwJ8P6GZvkU"}, videoPlayerType: 'in-content' }); Black comedies about rich people committing crimes are generally awesome, and Grosse Pointe Garden Society's creators have a track record in the space: Bill Krebs and Jenna Bans created Good Girls. The suburban "garden society" of the title is made up of a real estate agent, a socialite, a high school teacher, and a single dad, and they share a secret: a body buried under the hydrangeas. They have a pact to never tell a soul, but I have a feeling someone's gonna break that promise. Where to stream: PeacockShoresey, season 4 window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-m0uKJ8OGJ3g', data: {"slug":"m0uKJ8OGJ3g","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=m0uKJ8OGJ3g"}, videoPlayerType: 'in-content' }); I have a confession to make: I'd never heard of Shoresey before today, and I can't believe I haven't been watching this show. Why wasn't I informed? This Canadian sports comedy series is excellent and totally deserves the 100% fresh rating it has on rotten tomatoes. Shoresy follows the adventures of Shoresy, a foul-mouthed, fan-favorite hockey player on the Sudbury Bulldogs in Sudbury, Ontario, known as the dirtiest player in the game. Hockey comedy hasn't been this funny since the original Slap Shot!Where to stream: HuluLast week's picksZero Day This is the first time Robert De Niro has starred in a TV series, so Netflix is going big with Zero Day, a political drama/thriller series detailing the aftermath of a deadly cyberattack. De Niro plays respected former President George Mullen, who's heading up the investigation of an information attack that killed thousands of Americans. Mullen must navigate a world of shady tech moguls, government power brokers, and his own past if he's going to prevent a second, even deadlier cyber-disaster. Where to stream: NetflixThe White Lotus, Season 3 window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-XwQRkOK5KC4', data: {"slug":"XwQRkOK5KC4","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=XwQRkOK5KC4"}, videoPlayerType: 'in-content' }); Mike White's Emmy-winning series The White Lotus is the best. Its mix of biting commentary on wealth and privilege, well-drawn (but nearly always reprehensible) characters, and pitch-black humor add up to a nothing-else-like-it TV series. Season 3 sees a new group of pampered Americans arriving at a White Lotus luxury resort in Thailand. I can't say for sure, but I'm guessing they'll have unexpected and troubling times instead of a restful vacation. Season 3 also see the return of Natasha Rothwell, who played the spa manager from season one—one of the few sympathetic characters in the show's run. Other notable cast members include Walton Goggins (The Ghoul in Prime's Fallout series), Carrie Coon, Scott Glenn, Leslie Bibb, Michelle Monaghan, and Parker Posey.Where to stream: Max1923, Season 2 window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-ZE_MzBIMz50', data: {"slug":"ZE_MzBIMz50","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=ZE_MzBIMz50"}, videoPlayerType: 'in-content' }); Harrison Ford and Helen Mirren return for the second, and reportedly final, season of critically lauded drama 1923, a show that aims to tell a story as big as its stars. In this prequel to Yellowstone, Ford and Mirren play Jacob and Cara, matriarch and patriarch of the Dutton family, proud ranchers from Montana whose lives are shaped by drought, pandemics, and war, and who must face off against and a cadre of evil moguls who have their eyes on the ranch. Big drama!Where to stream: Paramount+Last Week Tonight with John Oliver, season 12 window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-Xrdri8nalPA', data: {"slug":"Xrdri8nalPA","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=Xrdri8nalPA"}, videoPlayerType: 'in-content' }); There's a new season of Last Week Tonight premiering this month, and I'm pretty sure sardonic host John Oliver will to have a lot to talk about in 2025 America. Oliver promises to ask the hard questions, like "Have two presidents ever kissed?" and "Did Tucker Carlson's mom really leave him $2 in her will?" (She actually left him $1.) Don't miss it if you like pointed political humor, because who knows how long pointed political humor will remain legal.Where to stream: MaxA Thousand Blows window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-cCbx8wVTnc0', data: {"slug":"cCbx8wVTnc0","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=cCbx8wVTnc0"}, videoPlayerType: 'in-content' }); Created by Steven Knight, the genius behind Peaky Blinders, this British boxing drama is made for fans of hardcore Victoriana. A Thousand Blows takes viewers to the mean streets of London in the 1880s where we follow Hezekiah (Malachi Kirby) and Alec (Francis Lovehall), two friends from Jamaica who immigrate to the UK only to find themselves fighting for their lives in the crime-ridden East End. The pair run afoul of criminal kingpin and pugilist Sugar Goodson (Stephen Graham) and find a friend in Mary Carr (Erin Doherty), head of an all-woman shoplifting gang known as the Forty Elephants.Where to stream: HuluReacher, season 3 window.videoEmbeds = window.videoEmbeds || []; window.videoEmbeds.push({ elemId: 'video-container-mCFXvDeUoi0', data: {"slug":"mCFXvDeUoi0","start_time":null,"url":"https:\/\/www.youtube.com\/watch?v=mCFXvDeUoi0"}, videoPlayerType: 'in-content' }); Universally praised action series Reacher returns for a third season. Based on Lee Child’s seventh Reacher novel, Persuader, season 3 sees former military operative Jack Reacher going undercover for the DEA in New England and facing off against a character played by Olivier Ritchers, the seven-foot bodybuilder called “the Dutch Giant" in muscle-show circles, and Zachary Beck, played by Anthony Michael Hall, the six-foot tall American actor called "The Geek" in 16 Candles.Where to stream: Prime'''
