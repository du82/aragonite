full_description = '''Lindsey Ellefson Features Editor Lindsey Ellefson is Lifehacker’s Features Editor. She currently covers study and productivity hacks, as well as household and digital decluttering, and oversees the freelancers on the sex and relationships beat. She spent most of her pre-Lifehacker career covering media and politics for outlets like Us Weekly, CNN, The Daily Dot, Mashable, Glamour, and InStyle. In recent years, her freelancing has focused on drug use and the overdose crisis, with pieces appearing in Vanity Fair, WIRED, The New Republic, The Daily Beast, and more. Her story for BuzzFeed News won the 2022 American Journalism Online award for Best Debunking of Fake News.In addition to her journalism, Lindsey is a student at the NYU School of Global Public Health, where she is working toward her Master of Public Health and conducting research on media bias in reporting on substance use with the Opioid Policy Institute’s Reporting on Addiction initiative. She is also a Schwinn-certified spin class teacher. She won a 2023 Dunkin’ Donuts contest that earned her a year of free coffee. Lindsey lives in New York, NY. MORE BY Lindsey Mobile Apps My Favorite Apps to Make Studying Less Painful Time to learn your material with an assist from one of these great apps. Lindsey Ellefson February 28, 2025 Cleaning & Organizing The ‘Out in the Open’ Method Can Help Even the Most Organized People to Declutter Try this even if you're already organized—maybe especially if you're already organized. Lindsey Ellefson February 28, 2025 Cleaning & Organizing Try the Viral ‘GFD Bin’ Decluttering Method the Next Time Guests Are on Their Way Over For when guests are about to arrive to your home and your home isn't exactly looking guest-worthy. Lindsey Ellefson February 27, 2025 Cleaning & Organizing This Dyson Vacuum Is $120 Off Right Now This is a great time to get a fancy new vacuum. Lindsey Ellefson February 27, 2025 Cleaning & Organizing Designate a 'Purgatory' Box for Le