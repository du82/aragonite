full_description = '''Beth Skwarecki Senior Health Editor Beth Skwarecki is Lifehacker’s Senior Health Editor and has been writing about health, fitness, and science here since 2015. Beth was the recipient of the 2017 Carnegie Science Award in science communication, and has written two books: Outbreak! 50 Tales of Epidemics That Terrorized the World (2016) and Genetics 101: From Chromosomes and the Double Helix to Cloning and DNA Tests, Everything You Need to Know About Genes (2018). She has a bachelor’s degree in biology, has worked as a bioinformatics analyst, and has taught college-level courses in biology, environmental science, and nutrition.Beth is also certified as a personal trainer and coach, with qualifications as an ACE-CPT, IKO kettlebell instructor, and USA Weightlifting Level 2 coach. She has competed in powerlifting, weightlifting, strongwoman, kettlebell sport, grip sport, and odd lift competitions (USAWA). Olympic weightlifting is her current focus. Her best front squat is 101 kilograms, and the lift she’s most proud of is a 510 pound Dinnie deadlift. Beth has also run races ranging from a 2K to a marathon. Beth has a 100% win rate in Wordle and lives in Pittsburgh, Pennsylvania. MORE BY Beth Fitness How to Prepare for Your First 5K Race How to train, how to deal with nerves, and what's a good time to aim for, anyway? Beth Skwarecki February 28, 2025 Body Oura’s Readiness Score Finally Takes Menstrual Cycles Into Account The company says 35% of cycling users will see higher, more accurate scores. Beth Skwarecki February 28, 2025 Fitness How to Hook Grip a Barbell Will it hurt? Only a little—if you follow these tips. Beth Skwarecki February 27, 2025 Fitness The Pixel Watch 3 Will Be Able to Detect If You Lose a Pulse The feature is already available in Europe, and is coming to the U.S. in March 2025. Beth Skwarecki February 26, 2025 Fitness Four Questions to Ask Yourself When You’re Lifting ‘Heavy’ What qualifies as "heavy" will vary from person to person. Beth Skwarecki February 26, 2025 Fitness You Can Finally Set a Passcode to Lock Your Garmin Watch The feature is in beta, and will lock everything past the watch face—here's how to install it. Beth Skwarecki February 25, 2025 Fitness Five Ways to Warm Up Before You Lift Weights Do you need cardio, mobility, just sets of the empty bar—or perhaps a personalized combination? Beth Skwarecki February 25, 2025 Body The Best Cold Medicines Aren't in the Cough and Cold Aisle Most OTC cold medicines don't work. Here are the things that actually will help—and where to find them. Beth Skwarecki February 24, 2025 Fitness The Best Ways to Find a Running Track Near You (and a Beginner’s Workout to Try) Most school tracks are open to the public. Here's how to find one, and navigate the etiquette once you're there. Beth Skwarecki February 24, 2025 Fitness How Apple Watch, Fitbit, Garmin, Oura, and Whoop Compare on Measuring HRV I tracked my sleep and recovery with five different devices for two weeks. Here’s what I learned. Beth Skwarecki February 21, 2025 Fitness How to Do Fartlek Runs (and Seven Different Kinds to Try) This semi-structured workout can be great speedwork, once you figure out how to get started. Beth Skwarecki February 20, 2025 Fitness All the Different Bars at the Gym, Explained How much does a regular bar weigh? Is that thinner one a women's bar? Your questions, answered. Beth Skwarecki February 19, 2025 Fitness Six Things to Do Between Sets at the Gym Does “rest” really mean "sit there and do nothing"? Beth Skwarecki February 19, 2025 Body The Truth About Cortisol, the Hormone That Health Influencers Like to Blame for Everything In which cancer symptoms and ordinary human experience are rolled together and marketed as the same thing (which ashwagandha will surely cure). Beth Skwarecki February 18, 2025 Fitness The Powerbeats Pro 2 Track Your Heart Rate From Your Ears (but Not Very Well) I put this ambitious feature to the test. Beth Skwarecki February 18,