title = "Lighterra"
description = "Lighterra is the software company of Jason Robert Carey Patterson, developer of VGO, Threads++, istring, EmbedVideo and more."
full_description = "Modern Microprocessors A 90-Minute Guide! A brief, pulls-no-punches, fast-paced introduction to the main design aspects of modern processor microarchitecture. Okay, so you're a CS graduate and you did a hardware course as part of your degree, but perhaps that was a few years ago now and you haven't really kept up with the details of processor designs since then. In particular, you might not be aware of some key topics that developed rapidly in recent times... pipelining (superscalar, OOO, VLIW, branch prediction, predication) multi-core and simultaneous multi-threading (SMT, hyper-threading) SIMD vector instructions (MMX/SSE/AVX, AltiVec) caches and the memory hierarchy Fear not! This article will get you up to speed fast. In no time, you'll be discussing the finer points of in-order vs out-of-order, hyper-threading, multi-core and cache organization like a pro. Read on..."
