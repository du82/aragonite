["https://lighthaven.space/index.html"]
title = "Lighthaven"
full_description = '''We offer cozy nooks with firepits, discussion rooms with endless whiteboards, and up to 44 bedrooms (with up to 80 beds). Conference space for up to 600 people. 20+ session spaces. 80 conference attendees can book accommodation on the campus. We can host events ranging from 20 person talks to large 500 person mixers. We can provide sound setup, music, private kitchens, snacks, catering. Lighthaven is a space dedicated to hosting events and programs that help people think better and to improve humanity's long-term trajectory. Past programs we hosted and were excited about have been the MATS program, which helps young researchers break into the field of AI Alignment and workshops run by the Machine Intelligence Research Institute and the Topos institute on helping people better understand the long-term consequences of developing Artificial General Intelligence. Lighthaven is a project by Lightcone Infrastructure, which is dedicated to facilitating intellectual progress on humanity's most important questions. We offer some groups large discounts (including free) if we think a project seems particularly great to us. Please feel quite free to ask us about this. You can use your own caterer, but our default caterer offers meals from $20/meal to $50/meal that most visitors have found quite satisfying. We do engage in some price discrimination. If we think your best alternative to our venue would be much more expensive, we may charge more than our listed price. We try to find a fair price that splits the difference between our own costs and the value you get out of the space. Lighthaven felt rambly and wondrous and fun without being pretentious? Felt like an incredibly-well-executed, 11-of-10 house party venue (laudatory) crossed with Disneyland. I am still learning about cool things and spaces in the venue that I missed (there was a robot sand table?) I heard something like that ~2/3 of the time as I was walking guests of honor in & giving them a tour. Something like "wow, how did you find this place?" or "damn, you guys got a good spot."'''
year_published = 2025
clearnet = "https://lighthaven.space/index.html"
