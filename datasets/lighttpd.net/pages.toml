["https://www.lighttpd.net/2010/2/1/security-announce-slow-request-dos-oom-attack"]
title = "Security Announce: slow request DoS/OOM attack - Lighttpd - fly light"
full_description = "Security Announce: slow request DoS/OOM attack February 01, 2010 Li Ming reported a serious bug in lighttpd: If you send the request data very slow (e.g. sleep 0.01 after each byte), lighttpd will easily use all available memory and die (especially for parallel requests), allowing a DoS within minutes. See: lighttpd_sa_2010_01.txt Bug #2147 The bug is tracked as CVE-2010-0295. As far as we know all versions are affected. Posted by stbuehler If you send the request data very slow (e.g. sleep 0.01 after each byte), lighttpd will easily use all available memory and die (especially for parallel requests), allowing a DoS within minutes."
