["https://www.lighttpd.net/2010/8/22/1-4-28"]
title = "1.4.28 - Lighttpd - fly light"
full_description = "1.4.28 August 22, 2010 1.4.27 introduced some serious bugs in our fdevent system; one resulted in segfaults with FreeBSD; this should be fixed now. Downloads https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.28.tar.gz SHA256: efd7623f43182723b99c51d57a24158e22a207cd90dca35aaf3b2e3bac115712 SHA1: 24d614f75b3aba18f3cff5e52a27ec9fdcf853b5 MD5: 202d36efc6324adb95a3600d2826ec6a https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.28.tar.bz2 SHA256: 7e55747a4feb74545d80a1f2d85b5866b8600705eac946e4402e3364b0666ed2 SHA1: 42915dffe2af4f870cc1cdc0218edb60a0a315c2 MD5: 586eb535d31ac299652495b058dd87c4 SHA256 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.28.sha256sum SHA1 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.28.sha1sum MD5 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.28.md5sum Changes from 1.4.27 Rename fdevent_event_add to _set to reflect what the function does. Fix some handlers. (fixes #2249) Fix buffer.h to include stdio.h as it is needer for SEGFAULT() (fixes #2250) Posted by stbuehler"
