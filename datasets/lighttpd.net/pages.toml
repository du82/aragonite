full_description = 'Lighttpd 1.4.15 - The "following traditions" release April 13, 2007 Here we are again. As a good tradition with lighttpd release we are bitten by a last minute hotfix in 1.4.14. :) The bug appeared in 1.4.14 and users of 1.4.13 or older releases are not affected. You can read up on the other 1.4.14 changes here. Download lighttpd-1.4.15.tar.gz (sha1sum: 67ba1279a0eaeda728c1e1143d302beb364a034c md5sum: d2ceaaf242b2b3593ff4d8222d543649) lighttpd-1.4.15.tar.bz2 (sha1sum: 742b567eca011fa5ef2cc506038389a4959eab56 md5sum: b994b8c359da578dec073cae52c4924f) Thanks for using lighttpd! :) P.S.: BTW: reporting bugs in blog comments is not the right way. Please use Trac for that! Posted by darix'
