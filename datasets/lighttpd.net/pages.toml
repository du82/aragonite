["https://www.lighttpd.net/2021/10/3/1.4.60"]
title = "1.4.60 - Lighttpd - fly light"
full_description = "1.4.60 October 03, 2021 Important changes improve performance, reduce memory use, bugfixes Downloads lighttpd-1.4.60.tar.gz (GPG signature) SHA256: 9c284107f8ed7dd3a8a25b06c6acfcf49ae2f19e66e384ebe51f7bc4dc57621c lighttpd-1.4.60.tar.xz (GPG signature) SHA256: 4bb1dd859e541a3131e5be101557d2e1195b4129d3a849a3a6fbd21fe1c946f0 SHA256 checksums Highlights HTTP/2 smoother and lower memory use (in general) HTTP/2 tuning to better handle aggressive client initial requests reduce memory footprint; workaround poor glibc behavior; jemalloc is better mod_magnet lua performance improvements mod_dirlisting performance improvements and new caching option memory constraints for extreme edge cases in mod_dirlisting, mod_ssi, mod_webdav connect(), write(), read() time limits on backends (separate from client timeouts) lighttpd restarts if large discontinuity in time occurs (embedded systems) RFC7233 Range support for all non-streaming responses, not only static files Behavior Changes connect() to backend now has default 8 second timeout (configurable) Future Scheduled Behavior Changes (estimated early 2022) graceful restart/shutdown default timeout will change from 0 (infinite/no timeout) to 5 seconds (or some similar non-zero period) configure an alternative with: server.feature-flags += (“server.graceful-shutdown-timeout” => 5) lighttpd (optional) dependencies on libev and on FAM are deprecated. lighttpd event loop and file monitoring use native OS interfaces except on obscure platforms. FAM and gamin appear to be abandoned. Package maintainers on Linux and *BSD: please remove —with-libev and —with-fam from package builds lighttpd uses epoll() on Linux, kqueue() on *BSD for event notification. lighttpd uses inotify() on Linux, kqueue() on *BSD for file monitoring. https://wiki.lighttpd.net/Docs_ConfigurationOptions#Deprecated mod_compress is DEPRECATED; use mod_deflate mod_compress has been subsumed by mod_deflate Note: mod_compress config options may be removed in a future release mod_geoip is DEPRECATED; use mod_maxminddb Note: mod_geoip will be removed from a future lighttpd release mod_authn_mysql is DEPRECATED; use mod_authn_dbi Note: mod_authn_mysql will be removed from a future lighttpd release mod_mysql_vhost is DEPRECATED; use mod_vhostdb_dbi or mod_vhostdb_mysql Note: mod_mysql_vhost will be removed from a future lighttpd release mod_cml is DEPRECATED; use mod_magnet Note: mod_cml will be removed from a future lighttpd release mod_flv_streaming is DEPRECATED; (Adobe Flash Video (.flv)) (Note: can be replaced with a few lines of lua code and mod_magnet) (sample script flv-streaming.lua is posted at https://redmine.lighttpd.net/projects/lighttpd/wiki/AbsoLUAtion ) Adobe Flash is deprecated and support has been removed from modern clients Changes from 1.4.59 [meson] add with_zstd to meson_options.txt [mod_magnet] reject stat() of empty string (fixes #3064) [mod_magnet] avoid infinite loop in atpanic (fixes #3065) [mod_magnet] do not call luaL_error outside pcall (#3065) [core] 101 upgrade fails if Content-Length incl (fixes #3063) [mod_gnutls,mod_mbedtls] recog common cipherstring [tests] remove stray option in test lighttpd.conf [mod_auth] close HTTP/2 connection after bad pass [build] fix SCons pkg-config err handling (fixes #3066) [core] inline funcs to decode h2 framing nums (fixes #3067) [build] use -pipe with gcc and clang [mod_mbedtls] preproc wrap ssl_parse_client_hello [build] augment configure.ac msgs to remove FAM (#3068) [core] allow ‘*’ in “*:80” socket spec [core] rename local var [core] mark config registration funcs cold [core] fix -fsanitize=undefined pedantic warning (fixes #3069) [core] algo_hmac.[ch] wrapper (portability) [mod_secdownload] use algo_hmac.[ch] [mod_secdownload] use http_auth_const_time_memeq() [autoconf] add ajp13 to build msgs [mod_auth] send 401 if digest algo not supported [mod_deflate] do not cache 206 Partial Content [core] chunkqueue_append_cq_range() [core] http_range.[ch] RFC 7233 Range handling [core] RFC 7233 Range handling for non-streaming [TLS] fix crash for (broken) nested $SERVER[] cfg [core] ignore server.event-handler = “libev” [mod_openssl] use newer openssl 3.0.0 interfaces [core] quiet coverity warning [core] http_cgi_local_redir() rename [core] http_cgi.[ch] CGI interfaces (RFC 3875) [core] save parsed listen addrs at startup [core] http_cgi_encode_varname() [core] add some ifdefs in algo_hmac.c [core] use epoll_create1() if available [core] adjust stat_cache_get_entry() conditions [core] _WIN32 impl of read-only mmap(), munmap() [core] remove stream.[ch] [multiple] use binary ‘|’ to reconstruct ts [core] check EAGAIN if unix socket connect() delay [multiple] prefer monotonic time for internal use [core] optimize buffer_urldecode_path() [mod_openssl] skip cert chain build if self-issued [mod_nss] avoid NSS crash w/ config file error [multiple] prefer monotonic time for internal use [core] http_response_handle_cachable() optim [core] fix chunkqueue_small_resp_optim partial rd [core] defer pcre_compile until after config parse [multiple] PCRE w/ PCRE_STUDY_JIT_COMPILE (fixes #2361) [mod_dirlisting, mod_trigger_b4_dl] use keyvalue [multiple] add attrs from gcc -Wsuggest-attribute= [mod_gnutls] quiet clang warning [core] http_response_physical_path_error() [multiple] buffer_has_slash_suffix() [core] modify path in-place checking for path-info [multiple] optimize primitives, buffer_extend() [multiple] do not clear physical.path if finished [core] http_kv.[ch] perf tuning [core] remove bad prototype from algo_splaytree.h [multiple] mark addtl funcs attr returns_nonnull [TLS] init STEK even if time is 1970 (fixes #3075) [core] restart if large large clock jump detected (#3075) [core] copy string and len directly from tmp_buf [core] move special case for Content-Type CGI hdr [mod_ssi] inline some buffers in ssi plugin_data [core] use monotonic secs for piped loggers start [mod_cml] use cached time from log_epoch_secs [mod_dirlisting] limit buffer use for large dirs [multiple] http_header APIs to reduce str copies [mod_userdir] use stat_cache_path_isdir() [mod_indexfile] reduce copying of base path [TLS] https_add_ssl_client_verify_err() [TLS] use stack for SSL_CLIENT_S_DN_* tag [core] buffer_append_strftime() perf annotations [mod_userdir] use 2-element cache [mod_magnet] use http_chunk_* APIs [mod_accesslog] reformat numeric timestamp [mod_accesslog] strftime %z for numeric timestamp [mod_accesslog] reformat numeric timestamp code [multiple] strftime %F and %T [mod_trigger_b4_dl] gdbm_reorganize once a day [mod_status] double-buffer large output to tmpfile [mod_ssi] shared code to wrap strftime() [mod_ssi] use intermediate chunkqueue to aggregate [multiple] pass len when copying constant strings [core] short-circuit encoding if nothing to encode [build] check for mempcpy() [core] buffer_append_* aggregates [core] config_vars_init() [multiple] use buffer_append_* aggregates [core] define attribute_nonnull [core] mark select buffer.[ch] funcs attr nonnull [core] mark select http_kv.[ch] funcs attr nonnull [core] mark some chunk.h funcs attr cold [core] remove an excess check [core] mark debug path unlikely [core] ignore empty headers unless pseudo-headers [multiple] buffer_copy_path_len2() aggregate [mod_dirlisting] process dir in subrequest handler [mod_dirlisting] restructure and keep state [mod_dirlisting] read dir in pieces; less blocking [mod_dirlisting] upper limit on parallel dirlist [mod_dirlisting] parse query string in javascript [mod_dirlisting] dir-listing.cache option [mod_webdav] webdav_log_xml_response() [mod_webdav] limit mem use under extreme condition [core] vector.h tweaks [mod_proxy] send HTTP/1.0 to backend if no Host [build] fix zstd option in meson (fixes #3076) [multiple] more reuse of http_date_time_to_str() [TLS] rename ssl.verifyclient.ca-*file options [mod_openssl] issue error trace if < openssl 1.1.1 [mod_webdav] always define webdav_mmap_file_chunk [mod_dirlisting] ignore error if include file fail [multiple] quiet coverity warnings [scons] link lighttpd with pcre for fullstatic [scons] link lighttpd with pcre for static build [core] exit 0 upon shutdown if no connections open [mod_nss] define TLSv1_3 as bitflag [core] update ls-hpack [core] discard some HTTP/2 DATA after response (fixes #3078) [mod_expires,mod_webdav] fix truncated date string [mod_expire] accept time labels without plural ‘s’ [mod_webdav] accept alt syntax in webdav.opts [core] recognize “enabled”/”disabled” for bool [mod_expire] check for default if mime not found [core] move timegm() impl inline in sys-time.h [mod_expire] send only Cache-Control to >=HTTP/1.1 [mod_webdav] quiet pedantic compiler warning [core] reuse code to parse backend response [core] consistent inclusion of sys-time.h [mod_authn_file] wipe password/digest after use [TLS] ALPN h2 policy [core] tolerate dup array config values if match [multiple] static file optimization; reuse cache [mod_staticfile] move cold paths to separate func [build] —with-nss add test for /usr/include/nspr4 [core] li_base64_decode similar to li_to_base64 [core] li_base64_decode mark cold code path [core] li_to_base64 alt code to add padding [core] buffer_append_base64_encode_opt() [core] base64_charset enum supports only 2 tables [core] consolidate overflow checks in li_to_base64 [mod_auth] include unistd.h for crypt() on Mac OS [core] tighten code in request_check_hostname() [core] merge http_response_send_file 0-size case [mod_extforward] shared mod_extforward_bad_request [core] http_response_send_file() mark cold paths [core] improve HTTP/2 behavior w/ max-request-size [tests] disable secdownload HMAC tests for NSS [core] check for Upgrade before h2 upgrade check [core] remove buffer_is_equal_right_len() [core] buffer_is_equal_string -> buffer_eq_slen [core] mark cold paths in http_response_config [core] http_response_prepare() OPTIONS *, CONNECT [core] mark some likely hot paths (better asm) [core] simplify buffer_path_simplify() [core] remove excess assertions in buffer_commit() [core] quiet coverity noise [mod_auth] include unistd.h for crypt() on *nix [cmake] improve cmake detection of timegm [cmake] update src/config.h.cmake [core] adjust r->http_host ptr caching [core] merge uri_raw and uri_clean hooks [core] reorder hook enum for better mem locality [core] remove redundant check for max_conns [multiple] mark con->srv_socket a const ptr [core] accept in network_server_handle_fdevent() [mod_*_dbi] fix sqlite3_dbdir spelling in comments [core] remove HANDLER_UNSET enum value [core] add option to read config file from stdin [mod_flv_streaming] check range before sending FLV [mod_magnet] use http_chunk_append_file_ref_range [core] range chk http_chunk_append_file_ref_range [core] remove some (now) unused http_chunk APIs [core] document error edge case for HTTP/1.0 [core] fix kill workers and shutdown by signal [core] store int* ptr to common gw status counters [tests] quite coverity warning in test_request.c [core] tighter OS event poll loops (better asm) [core] omit fdevent select() code if poll() avail [core] adjust some array code (better asm) [core] base64 encode round-up for required space [core] base64 encode w/ reduced data dependencies [core] merge base64 encoding to li_base64_enc() [core] li_base64_dec() on 4 bytes at a time [core] load padding char from base64_table [core] remove size maint in algo_splaytree [core] remove excess counts from print config [core] consolidate config printing code [core] move data_{array,integer,string} to array.c [core] define attribute_unused if needed [core] ck.[ch] - C11 Annex K wrappers [multiple] use thread-safe strerror where avail [multiple] move const time cmp funcs to ck.[ch] [multiple] rename safe_memclear() -> ck_memzero() [multiple] http_auth_digest_hex2bin -> li_hex2bin [mod_auth,mod_vhostdb] move helper funcs to mods [mod_auth] rename http_auth. -> mod_auth_api.* [mod_vhostdb*] rename http_vhostdb->mod_vhostdb_api [core] comment out ck_getenv_s() (unused) [mod_secdownload] include algo_hmac.c in mod [core] make insert_dup an optional array method [core] return entry from array_insert_data_at_pos [core] network_write optimizations [core] network_write prefer writev() over write() [core] connection_handle_read_state mark hot case [core] buffer_commit() optim; better asm [TLS] write_cq_ssl defer remove_finished_chunks [core] compare entire “/bin/sh” “-c” after execve [core] reduce repeated work in http_cgi_headers() [core] code reuse with array_match_value_prefix() [build] adjustments for autotools on Mac OS X [build] autoupdate; still autoconf 2.60 compatible [build] MacOS linker compat [core] http_header_hkey_get() perf (better asm) [TLS] reset stek_rotate_ts if clock moves backward [core] sock_addr_from_buffer_hints_numeric unused [core] tweaks writing response header (better asm) [core] adjust buffer use for hdr name for lshpack [core] comment out unused part of http_etag_remix [core] inline fam_dir_entry buffer ‘name’ member [multiple] reduce redundant NULL buffer checks [core] calculate backend host gw_hash at startup [core] gw_host_get() comment out devel debugging [core] request_config_reset() [mod_magnet] inline name and etag buffers in cache [mod_magnet] sync script load w/ stat_cache [core] clear etag in stat_cache_get_entry_open() [mod_auth] merge some repeated code; code reuse [core] add iovec wrappers to sys-crypto-md.h [core] li_base64_dec() [multiple] use <algo>_iov() digest funcs [mod_auth] mod_auth_digest_get() [mod_auth] mod_auth_algorithm_parse() w/ algo len [mod_authn_dbi] copy strings before escaping [mod_auth] refactor mod_auth_check_digest() [mod_auth] refactor mod_auth_check_basic() [build] look for memcpy and define HAVE_MEMCPY [core] buffer_path_simplify() quick(er) path [core] reduce memcmp in http_request_parse_header [build] look for port.h on Solaris, not sys/port.h [core] buffer_realloc() using power-2 realloc [core] lowercase r[http_host, r]{style=”text-align:right;”}>uri.authority [multiple] buffer_copy_string_len_lc() [mod_magnet] cache script objects at config time [core] move backtrace and assert macros to ck.[ch] [core] allocate initial request pool w/ srv->conns [mod_extforward] inline some more data structures [mod_access] remove excess trace [multiple] reduce use of BUFFER_INTLEN_PTR [multiple] inline struct in con->dst_addr_buf [core] reset large path buffers from long URLs [core] construct file path after docroot hook [core] avoid inlining buffer_eq_icase_ssn() [core] order gw_proc members for packing and usage [core] order gw_host members for packing and usage [mod_proxy] proxy_response_headers load v earlier [core] proxy_create_env() tweaks [core] write_all() simpler loop; better asm [core] http_date_time_append() convenience macro [core] reduce excess cc inlining in http_chunk.c [core] const buffer * in config_check_cond_nocache [core] parse $HTTP[“remote-ip”] CIDR mask at start [core] reduce $HTTP[“host”] compare str scanning [mul"
