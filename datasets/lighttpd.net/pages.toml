["https://www.lighttpd.net/2007/2/2/lighttpd"]
title = "lighttpd - Lighttpd - fly light"
full_description = "lighttpd February 02, 2007 Security, speed, compliance, and flexibility–all of these describe LightTPD which is rapidly redefining efficiency of a webserver; as it is designed and optimized for high performance environments. With a small memory footprint compared to other web-servers, effective management of the cpu-load, and advanced feature set (FastCGI, CGI, Auth, Output-Compression, URL-Rewriting and many more) LightTPD is the perfect solution for every server that is suffering load problems. And best of all it’s Open Source licensed under the revised BSD license. light footprint + httpd = LightTPD (pronounced lighty) Web 2.0 lighttpd powers several popular Web 2.0 sites like YouTube, wikipedia and meebo. Its high speed io-infrastructure allows them to scale several times better with the same hardware than with alternative webservers. This fast web server and its development team create a webserver with the needs of the future web in mind: Faster FastCGI COMET meets mod_mailbox Async IO Its event-driven architecure is optimized for a large number of parallel connections (keep-alive) which is important for high performant AJAX applications. Posted by jan"
