["https://lighttpd.net/2021/12/4/1.4.63"]
title = "1.4.63 - Lighttpd - fly light"
full_description = "1.4.63 December 04, 2021 Important changes bugfixes Downloads lighttpd-1.4.63.tar.gz (GPG signature) SHA256: 6d706d55d2e11de8d28a2044afae70b3847ec0b9688f84bc5362d4d7df1ad386 lighttpd-1.4.63.tar.xz (GPG signature) SHA256: 2aef7f0102ebf54a1241a1c3ea8976892f8684bfb21697c9fffb8de0e2d6eab9 SHA256 checksums FUTURE SCHEDULED BEHAVIOR CHANGES (estimated Jan 2022): graceful restart/shutdown default timeout will change from 0 (infinite/no timeout) to 5 seconds (or some similar non-zero period) configure an alternative with: server.feature-flags += (“server.graceful-shutdown-timeout” => 5) lighttpd (optional) dependencies on libev and on FAM are deprecated. lighttpd event loop and file monitoring use native OS interfaces except on obscure platforms. FAM and gamin appear to be abandoned. Package maintainers on Linux and *BSD: please remove —with-libev and —with-fam from package builds lighttpd uses epoll() on Linux, kqueue() on *BSD for event notification. lighttpd uses inotify() on Linux, kqueue() on *BSD for file monitoring. lighttpd will default to —with-pcre2 instead of —with-pcre pcre2 is current. pcre is no longer maintained. Explicitly specify —with-pcre in build to use pcre instead of pcre2. https://wiki.lighttpd.net/Docs_ConfigurationOptions#Deprecated mod_compress is DEPRECATED; use mod_deflate mod_compress has been subsumed by mod_deflate Note: mod_compress config options may be removed in a future release mod_geoip is DEPRECATED; use mod_maxminddb Note: mod_geoip will be removed from a future lighttpd release mod_authn_mysql is DEPRECATED; use mod_authn_dbi Note: mod_authn_mysql will be removed from a future lighttpd release mod_mysql_vhost is DEPRECATED; use mod_vhostdb_dbi or mod_vhostdb_mysql Note: mod_mysql_vhost will be removed from a future lighttpd release mod_cml is DEPRECATED; use mod_magnet Note: mod_cml will be removed from a future lighttpd release mod_flv_streaming is DEPRECATED; (Adobe Flash Video (.flv)) Note: mod_flv_streaming will be removed from a future lighttpd release (Note: can be replaced with a few lines of lua code and mod_magnet) (sample script flv-streaming.lua is posted at https://redmine.lighttpd.net/projects/lighttpd/wiki/ModMagnetExamples ) Adobe Flash is deprecated and support has been removed from modern clients mod_trigger_b4_dl is DEPRECATED; use mod_magnet Note: mod_trigger_b4_dl will be removed from a future lighttpd release (Note: can be replaced with a few lines of lua code and mod_magnet) (sample script mod_trigger_b4_dl.lua is posted at https://redmine.lighttpd.net/projects/lighttpd/wiki/ModMagnetExamples ) Changes from 1.4.62 [core] import xxHash v0.8.1 [core] isolate use of sys/filio.h [core] fix reqpool mem corruption in 1.4.62 (fixes #3118) Posted by gstrauss"
