["https://lighttpd.net/2011/7/3/1-4-29"]
title = "1.4.29 - Lighttpd - fly light"
full_description = "1.4.29 July 03, 2011 Important changes solve name conflict of md5 functions with OpenSSL lib mod_proxy, mod_cgi and other mod_*cgi fixes ssl improvements Native solaris ports fdevent handler “solaris-eventports” Downloads https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.29.tar.gz GPG signature: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.29.tar.gz.asc SHA256: ff9f4de3901d03bb285634c5b149191223d17f1c269a16c863bac44238119c85 https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.29.tar.bz2 GPG signature: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.29.tar.bz2.asc SHA256: afd8af213e65afb48b397d004696c6620a7ae7f3d4f162ec46a04b9b9dbfd599 Changes from 1.4.28 Fix mod_proxy waiting for response even if content-length is 0 (fixes #2259) Silence annoying “connection closed: poll() -> ERR” error.log message (fixes #2257) mod_cgi: make read buffer as big as incoming data block [build] Fix detection of libev (fixes #2300) ssl: Support for Diffie-Hellman and Elliptic-Curve Diffie-Hellman key exchange (fixes #2301) add ssl.use-sslv3 (fixes #2246) load all algorithms (fixes #2239) [ssl/md5] prefix our own md5 implementation with li_ so it doesn’t conflict with the openssl one (fixes #2269) [ssl/build] some minor fixes; fix compile without ssl, cleanup ssl config buffers [proc,include_shell] log error if exec shell fails (fixes #2280) [*cgi] Use physical base dir (alias, userdir) as DOCUMENT_ROOT in cgi environments (fixes #2216) [doc] Move docs to outdated/ subdir and refer to wiki instead (fixes #2248) fdevent: add solaris eventports (fixes #2171) Posted by stbuehler"
