["https://www.lighttpd.net/2020/11/29/1.4.56"]
title = "1.4.56 - Lighttpd - fly light"
full_description = '1.4.56 November 29, 2020 Important changes HTTP/2, TLS library options, brotli, bugfixes Downloads lighttpd-1.4.56.tar.gz (GPG signature) SHA256: bcb477cc06aa22246f540a02f946529ad03ba7c4d60d9bff142fb213b43307f9 lighttpd-1.4.56.tar.xz (GPG signature) SHA256: e4ce84cd79e8ae8ba193c7a7cc79c4afba9a076b443ef9f8d4bcd13a3354df77 SHA256 checksums Highlights HTTP/2 support must be enabled in lighttpd.conf in lighttpd 1.4.56; may be enabled by default in a future release server.feature-flags += ("server.h2proto" => "enable", "server.h2c" => "enable") TLS library options: OpenSSL, mbedTLS, wolfSSL, GnuTLS, NSS mod_openssl (existing) mod_mbedtls (experimental) mod_wolfssl (experimental) mod_gnutls (experimental) mod_nss (experimental) TLS OCSP stapling (except mbedTLS; not currently supported by mbedTLS) TLS session ticket key rotation control (except NSS; API limitation in NSS) mod_deflate brotli support mod_proxy makes HTTP/1.1 requests to backends (change from HTTP/1.0) RFC 8297 support for 103 Early Hints produced by backends (scripts) graceful restart option to transfer listen fds (minimal pause) server.systemd-socket-activation = "enable" server.feature-flags += ("server.graceful-restart-bg" => "enable", "server.graceful-shutdown-timeout" => "15") Behavior Changes mod_openssl default MinProtocol TLSv1.2 TLSv1 and TLSv1.1 are deprecated and no longer supported by major browsers. https://news.netcraft.com/archives/2020/03/03/browsers-on-track-to-block-850000-tls-1-0-sites.html If prior behavior is required, configure: ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1") If using openssl <= 1.0.2 (end-of-life) ssl.openssl.ssl-conf-cmd = ("Protocol" => "-ALL, TLSv1, TLSv1.1, TLSv1.2") (internal) TLS session cache is disabled by default, replaced by lighttpd robust TLSv1.2 session ticket support If backward compatibility is needed: server.feature-flags += ("ssl.session-cache" => "enable") (internal) openssl creates a session ticket encryption key per SSL_CTX. lighttpd 1.4.56 and later assigns a single session ticket encryption key for the lighttpd server (across all SSL_CTX) for consistency. behavior change with ssl.ca-dn-file (uncommon); applies to client certificate verification and ssl.ca-dn-file (uncommon) If client certificate verification is enabled (ssl.verifyclient.activate = “enable”), all CAs used for client certificate verification must be present in ssl.ca-file. This is the typical use case when client certificate verification is enabled. Certificates in (optional) ssl.ca-dn-file are used to send issuer names to client when the server sends a client certificate request. These names are use by the client during certificate selection, and the server requires that the certificate sent by the client be issued by one of the subjects in ssl.ca-dn-file. (Prior behavior merged ssl.ca-file and ssl.ca-dn-file for trusted CAs. New behavior requires all trusted CAs be listed in ssl.ca-file, and a subset be duplicated into ssl.ca-dn-file to specify allowed client cert issuer.) mod_deflate: support for bzip2 is now disabled by default in the build (enable using ./configure --with-bzip2) bzip2 Content-Encoding is not widely supported Prefer to build --with-brotli brotli Content-Encoding is more widely supported than bzip2 Future Scheduled Behavior Changes HTTP/2 support will be enabled by default in a future release graceful restart/shutdown default timeout will change from 0 (infinite/no timeout) to 5 seconds (or some similar non-zero period) configure an alternative with: server.feature-flags += ("server.graceful-shutdown-timeout" => 5) mod_compress is DEPRECATED; use mod_deflate mod_compress has been subsumed by mod_deflate Note: mod_compress config options may be removed in a future release mod_geoip is DEPRECATED; use mod_maxminddb Note: mod_geoip will be removed from a future lighttpd release mod_authn_mysql is DEPRECATED; use mod_authn_dbi Note: mod_authn_mysql will be removed from a future lighttpd release mod_mysql_vhost is DEPRECATED; use mod_vhostdb_dbi or mod_vhostdb_mysql Note: mod_mysql_vhost will be removed from a future lighttpd release mod_cml is DEPRECATED; use mod_magnet Note: mod_cml will be removed from a future lighttpd release Changes from 1.4.55 [core] perf: request processing [core] http_header_str_contains_token() [mod_flv_streaming] parse query string w/o copying [mod_evhost] use local array to split values [core] remove srv->split_vals [core] add User-Agent to http_header_e enum [core] store struct server * in struct connection [core] use func rc to indicate done reading header [core] replace connection_set_state w/ assignment [core] do not pass srv to http header parsing func [core] cold buffer_string_prepare_append_resize() [core] chunkqueue_compact_mem() [core] connection_chunkqueue_compact() [core] pass con around request, not srv and con [core] reduce use of struct parse_header_state [core] perf: HTTP header parsing using \n offsets [core] no need to pass srv to connection_set_state [core] perf: connection_read_header_more() [core] perf: connection_read_header_hoff() hot [core] inline connection_read_header() [core] pass ptr to http_request_parse() [core] more ‘const’ in request.c prototypes [core] handle common case of alnum or - field-name [mod_extforward] simplify code: use light_isxdigit [core] perf: array.c performance enhancements [core] mark some data_* funcs cold [core] http_header.c internal inline funcs [core] remove unused array_reset() [core] prefer uint32_t to size_t in base.h [core] uint32_t for struct buffer sizes [core] remove unused members of struct server [core] short-circuit path to clear request.headers [core] array keys are non-empty in key-value list [core] keep a[data[] sorted; remove a]{style=”text-align:right;”}>sorted[] [core] attribute_returns_nonnull [core] differentiate array_get_* for ro and rw [core] (const buffer *) in (struct burl_parts_t) [core] (const buffer *) for con->server_name [core] perf: initialize con->conf using memcpy() [core] run config_setup_connection() fewer times [core] isolate data_config.c, vector.c [core] treat con->conditional_is_valid as bitfield [core] http_header_hkey_get() over const array [core] inline buffer as part of DATA_UNSET key [core] inline buffer key for *_patch_connection() [core] (data_unset *) from array_get_element_klen [core] inline buffer as part of data_string value [core] add const to callers of http_header_*_get() [core] inline array as part of data_array value [core] const char *op in data_config [core] buffer string in data_config [core] streamline config_check_cond() [core] keep a->data[] sorted (REVERT) [core] array a->sorted[] as ptrs rather than pos [core] inline header and env arrays into con [mod_accesslog] avoid alloc for parsing cookie val [core] simpler config_check_cond() [mod_redirect,mod_rewrite] store context_ndx [core] const char *name in struct plugin [core] srv->plugin_slots as compact list [core] rearrange server_config, server members [core] macros CONST_LEN_STR and CONST_STR_LEN [core] struct plugin_data_base [core] improve condition caching perf [core] config_plugin_values_init() new interface [mod_access] use config_plugin_values_init() [core] (const buffer *) from strftime_cache_get() [core] mv config_setup_connection to connections.c [core] use (const char *) in config file parsing [mod_staticfile] use config_plugin_values_init() [mod_skeleton] use config_plugin_values_init() [mod_setenv] use config_plugin_values_init() [mod_alias] use config_plugin_values_init() [mod_indexfile] use config_plugin_values_init() [mod_expire] use config_plugin_values_init() [mod_flv_streaming] use config_plugin_values_init() [mod_magnet] use config_plugin_values_init() [mod_usertrack] use config_plugin_values_init() [mod_userdir] split policy from userdir path build [mod_userdir] use config_plugin_values_init() [mod_ssi] use config_plugin_values_init() [mod_uploadprogress] use config_plugin_values_init() [mod_status] use config_plugin_values_init() [mod_cml] use config_plugin_values_init() [mod_secdownload] use config_plugin_values_init() [mod_geoip] use config_plugin_values_init() [mod_evasive] use config_plugin_values_init() [mod_trigger_b4_dl] use config_plugin_values_init() [mod_accesslog] use config_plugin_values_init() [mod_simple_vhost] use config_plugin_values_init() [mod_evhost] use config_plugin_values_init() [mod_vhostdb*] use config_plugin_values_init() [mod_mysql_vhost] use config_plugin_values_init() [mod_maxminddb] use config_plugin_values_init() [mod_auth*] use config_plugin_values_init() [mod_deflate] use config_plugin_values_init() [mod_compress] use config_plugin_values_init() [core] add xsendfile* check if xdocroot is NULL [mod_cgi] use config_plugin_values_init() [mod_dirlisting] use config_plugin_values_init() [mod_extforward] use config_plugin_values_init() [mod_webdav] use config_plugin_values_init() [core] store addtl data in pcre_keyvalue_buffer [mod_redirect] use config_plugin_values_init() [mod_rewrite] use config_plugin_values_init() [mod_rrdtool] use config_plugin_values_init() [multiple] gw_backends config_plugin_values_init() [core] config_get_config_cond_info() [mod_openssl] use config_plugin_values_init() [core] use config_plugin_values_init() [core] collect more config logic into configfile.c [core] config_plugin_values_init_block() [core] gw_backend config_plugin_values_init_block [core] remove old config_insert_values_*() funcs [multiple] plugin.c handles common FREE_FUNC code [core] run all trigger and sighup handlers [mod_wstunnel] change DEBUG_LOG to use log_error() [core] stat_cache_path_contains_symlink use errh [core] isolate use of data_config, configfile.h [core] split cond cache from cond matches [mod_auth] inline arrays in http_auth_require_t [core] array_init() arg for initial size [core] gw_exts_clear_check_local() [core] gw_backend less pointer chasing [core] connection_handle_errdoc() separate func [multiple] prefer (connection ) to (srv) 