["https://www.lighttpd.net/2007/9/9/1-4-18-speeding-up-a-bit"]
title = "1.4.18 - speeding up a bit - Lighttpd - fly light"
full_description = "1.4.18 - speeding up a bit September 09, 2007 “Release early, release often.” So here we are again. The previous release is already 12 days old! It already got grey hair. And again we have a small security bug! It seems, if you get the more popular, more people are looking at your code. This time Mattias Bengtsson and Philip Olausson from secweb.se took a look at the code. They found a small bug that could lead to remote code execution in fastcgi applications. (We wont mention names here.) Lighttpd SA 2007:12 (patch: lighttpd-1.4.x_mod_fastcgi_overrun.patch) Download lighttpd-1.4.18.tar.gz (sha1sum: 30eb24cdfcfeadf10fa16f187330bdc5deb25ed2 md5sum: 5db3204d57436a032f899ff9dbce793f) lighttpd-1.4.18.tar.bz2 (sha1sum: a53a8f8ae8d42d036f0b5129764b822e943cc778 md5sum: 26f98dddf9d8c0775221b800986003ee) Changes fixed compile error on IRIX 6.5.x on prctl() (#1333) fixed forwarding a SIGINT and SIGHUP when using max-workers (#902) fixed FastCGI header overrun in mod_fastcgi (reported by mattias@secweb.se) fixed hanging redirects with keep-alive due to missing “Content-Length: 0” headers fixed crashing when using undefined environment variables in the config fixed compilation of mod_mysql_vhost on irix (#1341) For all the packagers: if you wonder what happened to lighttpd 2007-SA:11 and lighttpd 2007-SA:10, they will be released in the next days. Posted by darix"
