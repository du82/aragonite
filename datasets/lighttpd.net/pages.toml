full_description = "1.4.45 January 14, 2017 Important changes bug fixes (bug-fix-only release) Downloads lighttpd-1.4.45.tar.gz (GPG signature) SHA256: bfc0d87ff9396185e3556c2bf2e685fc5b28d9461c8ce65e4f88286d4eb0ebc6 lighttpd-1.4.45.tar.xz (GPG signature) SHA256: 1c97225deea33eefba6d4158c2cef27913d47553263516bbe9d2e2760fc43a3f SHA256 checksums Changes from 1.4.44 [mod_cgi] skip local-redir handling if to self (fixes #2779, #2108) [mod_webdav] fix crash when plugin_ctx cleaned up (fixes #2780) [mod_fastcgi] detect child exit, restart proactively [mod_scgi] detect child exit, restart proactively [TLS] ssl.read-ahead = “disable” for low mem (fixes #2778) Posted by gstrauss"
