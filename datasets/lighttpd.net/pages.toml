["https://www.lighttpd.net/2009/3/7/1-4-22-echoes"]
title = "1.4.22 - Echoes - Lighttpd - fly light"
full_description = "1.4.22 - Echoes March 07, 2009 And here we are again… we had some bad regressions, so 1.4.22 was needed earlier than we expected and spawn-fcgi is still included in this release. But spawn-fcgi 1.6.0 has been released, see https://redmine.lighttpd.net/projects/spawn-fcgi/news, so expect it to be removed soon. Important Changes Fix default vhost in mod_simple_vhost (fixes #1905) Fix segfault in mod_scgi (fixes #1911) Fix error handling in freebsd sendfile (fixes #1913) Downloads https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.22.tar.gz MD5: 949c33a81e83f7718a47280bef21b90c SHA1: e5268929dff832c7786e3b623ca67e6bb0c2913e https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.22.tar.bz2 MD5: ed4ca3897eadf419c893b03fee53c982 SHA1: 33390d4cc72b61405c0803358f8d9112821c194b SHA1 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.22.sha1sum MD5 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.22.md5sum Changes from 1.4.21 Fix wrong lua type for CACHE_MISS/CACHE_HIT in mod_cml (fixes #533) Fix default vhost in mod_simple_vhost (fixes #1905) Handle EINTR in mod_rrdtool (fixes #604) Fix rrd error after graceful restart (fixes #419) Fix EAGAIN handling for freebsd sendfile (fixes #1913, thx AnMaster for spotting the problem) Fix segfault in mod_scgi (fixes #1911) Treat EPIPE as connection-closed error in network_freebsd_sendfile.c (another fix from #1913) Fix useless redirection of stderr in mod_rrdtool, as it gets redirected to /dev/null later. (fixes #1922) Fix some problems with more strict compilers (#1923) Fix segfault if siginfo_t* is NULL in sigaction handler (fixes #1926) Posted by stbuehler"
