e [core] store cq->tempdirs in stack var [core] remove tempdirs ptr from struct chunkqueue [core] treat upload_temp_file_size=0 as default sz [core] hide unused var on _WIN32 compiler warning [mod_nss] nspr include prefix portability(attempt) [CI] scripts/ci-build.sh arg consistency;add meson [CI] remove wolfssl from autobuild; let rest build [CI] remove NSS from autobuild; let rest build [CI] remove mbedtls from autobuild; let rest build [mod_nss] nspr include prefix portability(attempt) [CI] ci-build.sh: adjust meson; add pam, maxminddb [CI] ci-build.sh: fix typo –with-pam [CI] remove maxminddb from autobuild,cmake; let rest build [CI] ci-build.sh re-enable additional dependencies [core] optimize for non-Range requests [core] allow larger number of Ranges if sorted [tests] test_http_range.c [core] attempt to quiet coverity warning [build] packdist.sh now produces .md for www.l.n [core] disable keep-alive if HTTP/1.1 CL and TE [core] reject empty Content-Length for HTTP/1.x [core] reject uppercase in unrecognized HTTP/2 hdr [core] warn dynamic mods listed before staticfile [core] dev-only internal request state debugging [core] short-circuit connection_state_machine_loop [core] reset connection-level state at con level [core] optim for non-throttle writes [core] remove connection_handle_write HTTP/1.x opt [core] yield writing large HTTP/1.x on slow device [core] tighten h2_process_streams() [core] h2_process_streams() simpler loop to retire [core] http_response_physical_pathinfo() [core] http_response_prepare() tweaks [meson] Fix ‘getoption’ meson typo [core] use different getxattr() prototype on MacOS [mod_deflate] do not compress any 1xx status [core] http_response_304(), http_response_412() [core] add config option to reject pathinfo [core] expand mimetype.assign builtin defaults [core] mark some cold routines noinline [core] add config opt to send GOAWAY for bad auth [core] show_features() show inotify or kqueue [core] stat_cache_refresh_entry() [core] splaytre