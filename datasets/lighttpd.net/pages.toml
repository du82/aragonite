full_description = "1.4.35 March 12, 2014 Important changes This release contains a lot of bug fixes, many detected by scan.coverity.com (and more to come). The main reason for the release is a fix for an SQL injection (and path traversal) bug triggered by specially crafted (and invalid) Host: headers. Security fixes lighttpd SA-2014-01 (CVE-2014-2323, CVE-2014-2324) Downloads lighttpd-1.4.35.tar.gz (GPG signature) SHA256: 62c23de053fd82e1bf64f204cb6c6e44ba3c16c01ff1e09da680d982802ef1cc lighttpd-1.4.35.tar.bz2 (GPG signature) SHA256: 4a71c1f6d8af41ed894b507720c4c17184dc320590013881d5170ca7f15c5bf7 lighttpd-1.4.35.tar.xz (GPG signature) SHA256: 113e9b72ccbd1da5deb0774bf93cf0ca15dc82aad2da0f04e5ab27d37d3f30a3 SHA256 checksums Changes from 1.4.34 [network/ssl] fix build error if TLSEXT is disabled [mod_fastcgi] fix use after free (only triggered if fastcgi debug is active) [mod_rrdtool] fix invalid read (string not null terminated) [mod_dirlisting] fix memory leak if pcre fails [mod_fastcgi,mod_scgi] fix resource leaks on spawning backends [mod_magnet] fix memory leak add comments for switch fall throughs remove logical dead code [buffer] fix length check in buffer_is_equal_right_len fix resource leaks in error cases on config parsing and other initializations add force_assert() to enforce assertions as simple assert()s are disabled by -DNDEBUG (fixes #2546) [mod_cml_lua] fix null pointer dereference force assertion: setting FD_CLOEXEC must work (if available) [network] check return value of lseek() fix unchecked return values from stream_open/stat_cache_get_entry [mod_webdav] fix logic error in handling file creation error check length of unix domain socket filenames fix SQL injection / host name validation (thx Jann Horn, CVE-2014-2323, CVE-2014-2324) Posted by stbuehler"
