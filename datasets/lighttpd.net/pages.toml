["https://www.lighttpd.net/2009/11/21/1-4-25-the-slogan-is-a-lie"]
title = "1.4.25 - the slogan is a lie - Lighttpd - fly light"
full_description = "1.4.25 - the slogan is a lie November 21, 2009 We did some important bug fixes (some of them new since 1.4.24, and some older bugs). Only 2 small new features: traceback for lua errors and the SSL_CLIENT_* vars export for ssl client cert validation. Downloads https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.25.tar.gz SHA256: 0e71cd677a2282fff0ee0248a0e70a593a75e06f8a26411ca5314d0c01debbc3 SHA1: 53537f0b1da35e9974e278adc7e959bb77e8dd75 MD5: 87e936ec272ddaba8a2fdfecd8c6b704 https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.25.tar.bz2 SHA256: 7e803089f18b179097cb33b64b37d8a3b537ce9c196c88e3fb09881b471c88ce SHA1: bc4592930292ae8d0990a94a584f49fe8f52445b MD5: 2027c49fb46530e45338c5e2da13c02f SHA256 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.25.sha256sum SHA1 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.25.sha1sum MD5 checksums: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.25.md5sum Changes from 1.4.24 mod_magnet: fix pairs() for normal tables and strings (fixes #1307) mod_magnet: add traceback for printing lua errors mod_rewrite: fix compile error if compiled without pcre disable warning “CLOSE-read” (fixes #2091) mod_rrdtool: fix creating file if it doesn’t exist (#1788) reset tlsext_server_name in connection_reset - fixes random hostnames in the $HTTP[“host”] conditional export some SSL_CLIENT_* vars for client cert validation (fixes #1288, thx presbrey) mod_fastcgi: fix mod_fastcgi packet parsing mod_fastcgi: Don’t reconnect after connect() succeeded (fixes #2096) Fix configure.ac to allow autoreconf, also enables make V=0 Posted by stbuehler"
