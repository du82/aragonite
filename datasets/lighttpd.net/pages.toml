["https://www.lighttpd.net/2022/6/7/1.4.65"]
title = "1.4.65 - Lighttpd - fly light"
full_description = '1.4.65 June 07, 2022 Important changes WebSockets over HTTP/2, bugfixes Highlights WebSockets over HTTP/2 RFC 8441 Bootstrapping WebSockets with HTTP/2 HTTP/2 PRIORITY_UPDATE RFC 9218 Extensible Prioritization Scheme for HTTP prefix/suffix conditions in lighttpd.conf mod_webdav safe partial-PUT webdav.opts += (“partial-put-copy-modify” => “enable”) mod_accesslog option: accesslog.escaping = “json” mod_deflate libdeflate build option speed up request body uploads via HTTP/2 Behavior Changes change default server.max-keep-alive-requests = 1000 to adjust to increasing HTTP/2 usage and to web2/web3 application usage (prior default was 100) mod_status HTML now includes HTTP/2 control stream id 0 in the output which contains aggregate counts for the HTTP/2 connection (These lines can be identified with URL ‘*’, part of “PRI *” preface) alternative: https://wiki.lighttpd.net/ModMagnetExamples#lua-mod_status MIME type application/javascript is translated to text/javascript (RFC 9239) Future Scheduled Behavior Changes TLS modules will default to using stronger, modern ciphers and will default to allow client preference in selecting ciphers. Allowing client preference in selecting ciphers is safe to do along with restrictions to use modern ciphers supporting PFS, and is better for mobile users without AES hardware acceleration. Legacy ciphers can still be configured in lighttpd.conf using ssl.openssl.ssl-conf-cmd, as long as the ciphers are supported by the underlying TLS libraries. https://wiki.lighttpd.net/Docs_SSL new defaults: "CipherString" => "EECDH+AESGCM:AES256+EECDH:CHACHA20:!SHA1:!SHA256:!SHA384" "Options" => "-ServerPreference" old defaults: "CipherString" => "HIGH" "Options" => "ServerPreference" Deprecated TLS options will be removed. ssl.honor-cipher-order ssl.dh-file ssl.ec-curve ssl.disable-client-renegotiation ssl.use-sslv2 ssl.use-sslv3 See https://wiki.lighttpd.net/Docs_SSL for replacements with ssl.openssl.ssl-conf-cmd, but prefer lighttpd defaults instead. Continue gradual deprecation of “mini-application” lighttpd modules for which mod_magnet lua implementations are better and more flexible. Please post on lighttpd forums to share feedback if you use these modules. Forums: https://redmine.lighttpd.net/projects/lighttpd/boards Deprecated: mod_evasive will be removed. mod_evasive can be replaced by mod_magnet and a few lines of lua: Replacement: https://wiki.lighttpd.net/ModMagnetExamples#lua-mod_evasive https://wiki.lighttpd.net/AbsoLUAtion#Fight-DDoS https://wiki.lighttpd.net/AbsoLUAtion#Mod_Security Deprecated: mod_secdownload will be removed. mod_secdownload can be replaced by mod_magnet and a few lines of lua: Replacement: https://wiki.lighttpd.net/ModMagnetExamples#lua-mod_secdownload mod_secdownload historically uses insecure MD5 though SHA1, SHA256 available Deprecated: mod_uploadprogress will be removed. mod_uploadprogress can be replaced by mod_magnet and a few lines of lua: Replacement: https://wiki.lighttpd.net/ModMagnetExamples#lua-mod_uploadprogress Deprecated: mod_usertrack will be removed. mod_usertrack can be replaced by mod_magnet and a few lines of lua: Replacement: https://wiki.lighttpd.net/ModMagnetExamples#lua-mod_usertrack mod_usertrack historically uses insecure MD5. Downloads lighttpd-1.4.65.tar.gz (GPG signature) SHA256: 396bdbe28e77cf68ffbc914e0280e4f3c6b42574277ccb7f776d572fdddea6d0 lighttpd-1.4.65.tar.xz (GPG signature) SHA256: bf0fa68a629fbc404023a912b377e70049331d6797bcbb4b3e8df4c3b42328be SHA256 checksums SHA512 checksums Changes from 1.4.64 [build] meson: fix typo in variable name [build] autoconf: report if building with zstd [build] meson -Dlua_version=… to specify lua ver [core] avoid CCRandomGenerateBytes on MacOS <10.12 (fixes #3140) [core] use diff var name w/ CCRandomGenerateBytes (fixes #3141) [core] parse conf cmds with SHELL or /bin/sh [core] fix HMAC with openssl 3.0 [mod_webdav] no COPYFILE_CLONE_FORCE on OSX <10.12 (fixes #3142) [mod_deflate] fix to return 304 with If-None-Match (fixes #3143) [core] Illumos epoll incompatible w/ lighttpd impl [core] feature flag to allow Range w/ HTTP/1.0 [mod_mbedtls] set usekeysize for mbedtls 3.2.0+ [mod_deflate] collect mmap code [mod_deflate] prototype using libdeflate w/ mmap [mod_deflate] —with-libdeflate to use libdeflate [mod_deflate] mark input bytes const [core] sys-setjmp.[ch] [mod_magnet] check lighty.result.content b4 setjmp [core] include guard consistency in sys-time.h [core] network_write_file_chunk_remap separate fn [multiple] use new sys_setjmp_eval3() interface [multiple] pedantic chunk.c checks for 0-len chunk [multiple] shared code for struct chunk and mmap [mod_deflate] use pread if available [mod_deflate] improve loop compressing file chunk [core] prep server_tag at startup for h2 resp hdr [mod_magnet] defer req_env init unless needed [mod_magnet] reset after error attaching content [mod_magnet] lua_tointegerx() avoids raising error [mod_mbedtls] use newer mbedtls 3.2.0+ interfaces [mod_magnet] adjust hot path for more inlining [mod_magnet] collect chk for magnet lua_State init [mod_magnet] use type returned from lua_getfield() [core] chunk_file_pread() to wrap pread() [core] disable keep-alive if forcing HTTP/1.0 resp [mod_magnet] use lua_getextraspace() to store r [core] fall back to getauxval(AT_RANDOM), if avail [mod_magnet] keep message handler on stack [doc] update external links [mod_magnet] pass lighty table index, defer pops [mod_magnet] clear and reuse script-env table [mod_magnet] clear stack when reloading script [mod_magnet] use lua_isnoneornil() in interfaces [mod_magnet] fix lighty.c.cookie_tokens() [mod_magnet] fix lighty.c.urldec_query() [mod_magnet] remove duplicated NULL checks [mod_magnet] adjust magnet_lighty_result_get() [mod_magnet] magnet_tmpbuf_acquire(),release() [mod_magnet] lighty.c.quotedenc(),dec() funcs [mod_magnet] fix header,content legacy table clear [mod_cgi] cgi.local-redir request_reset thru fnptr [core] isolate plugins