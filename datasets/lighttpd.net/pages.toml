["https://lighttpd.net/2021/10/3/1.4.60"]
title = "1.4.60 - Lighttpd - fly light"
full_description = "1.4.60 October 03, 2021 Important changes improve performance, reduce memory use, bugfixes Downloads lighttpd-1.4.60.tar.gz (GPG signature) SHA256: 9c284107f8ed7dd3a8a25b06c6acfcf49ae2f19e66e384ebe51f7bc4dc57621c lighttpd-1.4.60.tar.xz (GPG signature) SHA256: 4bb1dd859e541a3131e5be101557d2e1195b4129d3a849a3a6fbd21fe1c946f0 SHA256 checksums Highlights HTTP/2 smoother and lower memory use (in general) HTTP/2 tuning to better handle aggressive client initial requests reduce memory footprint; workaround poor glibc behavior; jemalloc is better mod_magnet lua performance improvements mod_dirlisting performance improvements and new caching option memory constraints for extreme edge cases in mod_dirlisting, mod_ssi, mod_webdav connect(), write(), read() time limits on backends (separate from client timeouts) lighttpd restarts if large discontinuity in time occurs (embedded systems) RFC7233 Range support for all non-streaming responses, not only static files Behavior Changes connect() to backend now has default 8 second timeout (configurable) Future Scheduled Behavior Changes (estimated early 2022) graceful restart/shutdown default timeout will change from 0 (infinite/no timeout) to 5 seconds (or some similar non-zero period) configure an alternative with: server.feature-flags += (“server.graceful-shutdown-timeout” => 5) lighttpd (optional) dependencies on libev and on FAM are deprecated. lighttpd event loop and file monitoring use native OS interfaces except on obscure platforms. FAM and gamin appear to be abandoned. Package maintainers on Linux and *BSD: please remove —with-libev and —with-fam from package builds lighttpd uses epoll() on Linux, kqueue() on *BSD for event notification. lighttpd uses inotify() on Linux, kqueue() on *BSD for file monitoring. https://wiki.lighttpd.net/Docs_ConfigurationOptions#Deprecated mod_compress is DEPRECATED; use mod_deflate mod_compress has been subsumed by mod_deflate Note: mod_compress config options may be removed in a future release mod_geoip is DEPRECATED; use mod_maxminddb Note: mod_geoip will be removed from a future lighttpd release mod_authn_mysql is DEPRECATED; use mod_authn_dbi Note: mod_authn_mysql will be removed from a future lighttpd release mod_mysql_vhost is DEPRECATED; use mod_vhostdb_dbi or mod_vhostdb_mysql Note: mod_mysql_vhost will be removed from a future lighttpd release mod_cml is DEPRECATED; use mod_magnet Note: mod_cml will be removed from a future lighttpd release mod_flv_streaming is DEPRECATED; (Adobe Flash Video (.flv)) (Note: can be replaced with a few lines of lua code and mod_magnet) (sample script flv-streaming.lua is posted at https://redmine.lighttpd.net/projects/lighttpd/wiki/AbsoLUAtion ) Adobe Flash is deprecated and support has been removed from modern clients Changes from 1.4.59 [meson] add with_zstd to meson_options.txt [mod_magnet] reject stat() of empty string (fixes #3064) [mod_magnet] avoid infinite loop in atpanic (fixes #3065) [mod_magnet] do not call luaL_error outside pcall (#3065) [core] 101 upgrade fails if Content-Length incl (fixes #3063) [mod_gnutls,mod_mbedtls] recog common cipherstring [tests] remove stray option in test lighttpd.conf [mod_auth] close HTTP/2 connection after bad pass [build] fix SCons pkg-config err handling (fixes #3066) [core] inline funcs to decode h2 framing nums (fixes #3067) [build] use -pipe with gcc and clang [mod_mbedtls] preproc wrap ssl_parse_client_hello [build] augment configure.ac msgs to remove FAM (#3068) [core] allow ‘*’ in “*:80” socket spec [core] rename local var [core] mark config registration funcs cold [core] fix -fsanitize=undefined pedantic warning (fixes #3069) [core] algo_hmac.[ch] wrapper (portability) [mod_secdownload] use algo_hmac.[ch] [mod_secdownload] use http_auth_const_time_memeq() [autoconf] add ajp13 to build msgs [mod_auth] send 401 if digest algo not supported [mod_deflate] do not cache 206 Partial Content [core] chunkqueue_append_cq_range() [core] http_range.[ch] RFC 7233 Range handling [core] RFC 7233 Range handling for non-streaming [TLS] fix crash for (broken) nested $SERVER[] cfg [core] ignore server.event-handler = “libev” [mod_openssl] use newer openssl 3.0.0 interfaces [core] quiet coverity warning [core] http_cgi_local_redir() rename [core] http_cgi.[ch] CGI interfaces (RFC 3875) [core] save parsed listen addrs at startup [core] http_cgi_encode_varname() [core] add some ifdefs in algo_hmac.c [core] use epoll_create1() if available [core] adjust stat_cache_get_entry() conditions [core] _WIN32 impl of read-only mmap(), munmap() [core] remove stream.[ch] [multiple] use binary ‘|’ to reconstruct ts [core] check EAGAIN if unix socket connect() delay [multiple] prefer monotonic time for internal use [core] optimize buffer_urldecode_path() [mod_openssl] skip cert chain build if self-issued [mod_nss] avoid NSS crash w/ config file error [multiple] prefer monotonic time for internal use [core] http_response_handle_cachable() optim [core] fix chunkqueue_small_resp_optim partial rd [core] defer pcre_compile until after config parse [multiple] PCRE w/ PCRE_STUDY_JIT_COMPILE (fixes #2361) [mod_dirlisting, mod_trigger_b4_dl] use keyvalue [multiple] add attrs from gcc -Wsuggest-attribute= [mod_gnutls] quiet clang warning [core] http_response_physical_path_error() [multiple] buffer_has_slash_suffix() [core] modify path in-place checking for path-info [multiple] optimize primitives, buffer_extend() [multiple] do not clear physical.path if finished [core] http_kv.[ch] perf tuning [core] remove bad prototype from algo_splaytree.h [multiple] mark addtl funcs attr returns_nonnull [TLS] init STEK even if time is 1970 (fixes #3075) [core] restart if large large clock jump detected (#3075) [core] copy string and len directly from tmp_buf [core] move special case for Content-Type CGI hdr [mod_ssi] inline some buffers in ssi plugin_data [core] use monotonic secs for piped loggers start [mod_cml] use cached time from log_epoch_secs [mod_dirlist