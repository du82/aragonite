["https://lighttpd.net/2016/10/31/1.4.43"]
title = "1.4.43 - Lighttpd - fly light"
full_description = "1.4.43 October 31, 2016 Important changes improve FastCGI, SCGI, proxy reconnect on failure bug fixes Downloads lighttpd-1.4.43.tar.gz (GPG signature) SHA256: 29cb2d58ba60edf5243ca76a3dcda2279470104cfc9a2e58409baefe47986fde lighttpd-1.4.43.tar.xz (GPG signature) SHA256: fe0c4a06dd2408a83ee7a2bfedc45e09597f3313cbda82485507573ae8fa948a SHA256 checksums Highlights improvements improve FastCGI, SCGI, proxy reconnect on failure build systems: do not build modules for which dependencies are not present autobuild: use CC_FOR_BUILD for lemon when cross-compiling config: warn if mod_authn_ldap,mysql not listed config file remote IP conditions are valid for TLS SNI mod_deflate ignore trailing ‘*’ in deflate.mimetypes mod_deflate skip deflate if loadavg too high mod_accesslog %{ratio}n logs compression ratio mod_expire by mimetype mod_evhost partial matching patterns mod_dirlisting config header and readme files bug fixes fix potential tempfile corruption with streaming response fix fd leak when using libev (1.4.42) fix ssl client certificate authentication segfaults (1.4.42) fix mod_scgi prefix matching to always match url Changes from 1.4.42 [autobuild] remove mod_authn_gssapi dep on resolv [mod_deflate] ignore ‘*’ in deflate.mimetypes [autobuild] omit module stubs when missing deps [TLS] openssl 1.1.0 hides struct bignum_st [autobuild] move http_cgi_ssl_env() for Mac OS X (fixes #2757) [core] use paccept() on NetBSD (replace accept4()) [TLS] remote IP conditions are valid for TLS SNI (fixes #2272) [doc] lighttpd-angel.8 (fixes #2254) [cmake] build fcgi-auth, fcgi-responder for tests [mod_accesslog] %{ratio}n logs compression ratio (fixes #2133) [mod_deflate] skip deflate if loadavg too high (fixes #1505) [mod_expire] expire by mimetype (fixes #423) [mod_evhost] partial matching patterns (fixes #1194) build: use CC_FOR_BUILD for lemon when cross-compiling [mod_dirlisting] config header and readme files [config] warn if mod_authn_ldap,mysql not listed fix FastCGI, SCGI, proxy reconnect on failure [core] network_open_file_chunk() temp file opt [mod_rewrite] add more info in error log msg [core] fix fd leak when using libev (fixes #2761) [core] fix potential streaming tempfile corruption (fixes #2760) [mod_scgi] fix prefix matching to always match url [autobuild] adjust Makefile.am for FreeBSD Posted by gstrauss"
