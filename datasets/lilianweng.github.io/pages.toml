title = "Adversarial Attacks on LLMs | Lil'Log"
description = """
The use of large language models in the real world has strongly accelerated by the launch of ChatGPT. We (including my team at OpenAI, shoutout to them) have invested a lot of effort to build default safe behavior into the model during the alignment process (e.g. via RLHF). However, adversarial attacks or jailbreak prompts could potentially trigger the model to output something undesired.
A large body of ground work on adversarial attacks is on images, and differently it operates in the continuous, high-dimensional space. Attacks for discrete data like text have been considered to be a lot more challenging, due to lack of direct gradient signals. My past post on Controllable Text Generation is quite relevant to this topic, as attacking LLMs is essentially to control the model to output a certain type of (unsafe) content."""
full_description = '''Adversarial Attacks on LLMs Date: October 25, 2023 | Estimated Reading Time: 33 min | Author: Lilian Weng Table of Contents Basics Threat Model Classification Text Generation White-box vs Black-box Types of Adversarial Attacks Token Manipulation Gradient based Attacks Jailbreak Prompting Humans in the Loop Red-teaming Model Red-teaming Peek into Mitigation Saddle Point Problem Some work on LLM Robustness Citation References The use of large language models in the real world has strongly accelerated by the launch of ChatGPT. We (including my team at OpenAI, shoutout to them) have invested a lot of effort to build default safe behavior into the model during the alignment process (e.g. via RLHF). However, adversarial attacks or jailbreak prompts could potentially trigger the model to output something undesired. A large body of ground work on adversarial attacks is on images, and differently it operates in the continuous, high-dimensional space. Attacks for discrete data like text have been considered to be a lot more challenging, due to lack of direct gradient signals. My past post on Controllable Text Generation is quite relevant to this topic, as attacking LLMs is essentially to control the model to output a certain type of (unsafe) content. There is also a branch of work on attacking LLMs to extract pre-training data, private knowledge (Carlini et al, 2020) or attacking model training process via data poisoning (Carlini et al. 2023). We would not cover those topics in this post. Basics# Threat Model# Adversarial attacks are inputs that trigger the model to output something undesired. Much early literature focused on classification tasks, while recent effort starts to investigate more into outputs of generative models. In the context of large language models In this post we assume the attacks only happen at inference time, meaning that model weights are fixed. Fig. 1. An overview of threats to LLM-based applications. (Image source: Greshake et al. 2023) Classification# Adversarial attacks on classifiers have attracted more attention in the research community in the past, many in the image domain. LLMs can be used for classification too. Given an input $\mathbf{x}$ and a classifier $f(.)$, we would like to find an adversarial version of the input, denoted as $\mathbf{x}_\text{adv}$, with imperceptible difference from $\mathbf{x}$, such that $f(\mathbf{x}) \neq f(\mathbf{x}_\text{adv})$. Text Generation# Given an input $\mathbf{x}$ and a generative model $p(.)$, we have the model output a sample $\mathbf{y} \sim p(.\vert\mathbf{x})$ . An adversarial attack would identify such $p(\mathbf{x})$ that $\mathbf{y}$ would violate the built-in safe behavior of the model $p$; E.g. output unsafe content on illegal topics, leak private information or model training data. For generative tasks, it is not easy to judge the success of an attack, which demands a super high-quality classifier to judge whether $\mathbf{y}$ is unsafe or human review. White-box vs Black-box# White-box attacks assume that attackers have full access to the model weights, architecture and training pipeline, such that attackers can obtain gradient signals. We don’t assume attackers have access to the full training data. This is only possible for open-sourced models. Black-box attacks assume that attackers only have access to an API-like service where they provide input $\mathbf{x}$ and get back sample $\mathbf{y}$, without knowing further information about the model. Types of Adversarial Attacks# There are various means to find adversarial inputs to trigger LLMs to output something undesired. We present five approaches here. Attack Type Description Token manipulation Black-box Alter a small fraction of tokens in the text input such that it triggers model failure but still remain its original semantic meanings. Gradient based attack White-box Rely on gradient signals to learn an effective attack. Jailbreak prompting Black-box Often heuristic based prompting to “jailbreak” built-in model safety. Human red-teaming Black-box Human attacks the model, with or without assist from other models. Model red-teaming Black-box Model attacks the model, where the attacker model can be fine-tuned. Token Manipulation# Given a piece of text input containing a sequence of tokens, we can apply simple token operations like replacement with synonyms to trigger the model to make the incorrect predictions. Token manipulation based attacks work in black box settings. The Python framework, TextAttack (Morris et al. 2020), implemented many word and token manipulation attack methods to create adversarial examples for NLP models. Most work in this area experimented with classification and entailment prediction. Ribeiro et al (2018) relied on manually proposed Semantically Equivalent Adversaries Rules (SEARs) to do minimal token manipulation such that the model would fail to generate the right answers. Example rules include (What NOUN→Which NOUN), (WP is → WP’s’), (was→is), etc. The semantic equivalence after adversarial operation is checked via back-translation. Those rules are proposed via a pretty manual, heuristic process and the type of model “bugs” SEARs are probing for are only limited on sensitivity to minimal token variation, which should not be an issue with increased base LLM capability. In comparison, EDA (Easy Data Augmentation; Wei & Zou 2019) defines a set of simple and more general operations to augment text: synonym replacement, random insertion, random swap or random deletion. EDA augmentation is shown to improve the classification accuracy on several benchmarks. TextFooler (Jin et al. 2019) and BERT-Attack (Li et al. 2020) follows the same process of first identifying the most important and vulnerable words that alter the model prediction the most and then replace those words in some way. Given a classifier $f$ and an input text string $\mathbf{x}$, the importance score of each word can be measured by: $$ I(w_i) = \begin{cases} f_y(\mathbf{x}) - f_y(\mathbf{x}_{\setminus w_i}) & \text{if }f(\mathbf{x}) = f(\mathbf{x}_{\setminus w_i}) = y\\ (f_y(\mathbf{x}) - f_y(\mathbf{x}_{\setminus w_i})) + ((f_{\bar{y}}(\mathbf{x}) - f_{\bar{y}}(\mathbf{x}_{\setminus w_i}))) & \text{if }f(\mathbf{x}) = y, f(\mathbf{x}_{\setminus w_i}) = \bar{y}, y \neq \bar{y} \end{cases} $$ where $f_y$ is the predicted logits for label $y$ and $x_{\setminus w_i}$ is the input text excluding the target word $w_i$. Words with high importance are good candidates to be replaced, but stop words should be skipped to avoid grammar destruction. TextFooler replaces those words with top synonyms based on word embedding cosine similarity and then further filters by checking that the replacement word still has the same POS tagging and the sentence level similarity is above a threshold. BERT-Attack instead replaces words with semantically similar words via BERT given that context-aware prediction is a very natural use case for masked language models. Adversarial examples discovered this way have some transferability between models, varying by models and tasks. Gradient based Attacks# In the white-box setting, we have full access to the model parameters and architecture. Therefore we can rely on gradient descent to programmatically learn the most effective attacks. Gradient based attacks only work in the white-box setting, like for open source LLMs. GBDA (“Gradient-based Distributional Attack”; Guo et al. 2021) uses Gumbel-Softmax approximation trick to make adversarial loss optimization differentiable, where BERTScore and perplexity are used to enforce perceptibility and fluency. Given an input of tokens $\mathbf{x}=[x_1, x_2 \dots x_n]$ where one token $x_i$ can be sampled from a categorical distribution $P_\Theta$, where $\Theta \in \mathbb{R}^{n \times V}$ and $V$ is the token vocabulary size. It is highly over-parameterized, considering that $V$ is usually around $O(10,000)$ and most adversarial examples only need a few token replacements. We have: $$ x_i \sim P_{\Theta_i} = \text{Categorical}(\pi_i) = \text{Categorical}(\text{Softmax}(\Theta_i)) $$ where $\pi_i \in \mathbb{R}^V$ is a vector of token probabilities for the $i$-th token. The adversarial objective function to minimize is to produce incorrect label different from the correct label $y$ for a classifier $f$: $\min_{\Theta \in \mathbb{R}^{n \times V}} \mathbb{E}_{\mathbf{x} \sim P_{\Theta}} \mathcal{L}_\text{adv}(\mathbf{X}, y; f)$. However, on the surface, this is not differentiable because of the categorical distribution. Using Gumbel-softmax approximation (Jang et al. 2016) we approximate the categorical distribution from the Gumbel distribution $\tilde{P}_\Theta$ by $\tilde{\boldsymbol{\pi}}$: $$ \tilde{\pi}_i^{(j)} = \frac{\exp(\frac{\Theta_{ij} + g_{ij}}{\tau})}{\sum_{v=1}^V \exp(\frac{\Theta_{iv} + g_{iv}}{\tau})} $$ where $g_{ij} \sim \text{Gumbel}(0, 1)$; the temperature $\tau > 0$ controls the smoothness of the distribution. Gumbel distribution is used to model the extreme value, maximum or minimum, of a number of samples, irrespective of the sample distribution. The additional Gumbel noise brings in the stochastic decisioning that mimic the sampling process from the categorical distribution. Fig. 2. The probability density plot of $\text{Gumbel}(0, 1)$. (Image created by ChatGPT) A low temperature $\tau \to 0$ pushes the convergence to categorical distribution, since sampling from softmax with temperature 0 is deterministic. The “sampling” portion only depends on the value of $g_{ij}$, which is mostly centered around 0. Fig. 3. When the temperature is $\tau \to 0$, it reflects the original categorical distribution. When $\tau \to \infty$, it becomes a uniform distribution. The expectations and samples from Gumbel softmax distribution matched well. (Image source: Jang et al. 2016) Let $\mathbf{e}_j$ be the embedding representation of token $j$. We can approximate $\mathbf{x}$ with $\bar{e}(\tilde{\boldsymbol{\pi}})$, a weighted average of the embedding vector corresponding to the token probabilities: $\bar{e}(\pi_i) = \sum_{j=1}^V \pi_i^{(j)} \mathbf{e}_j$. Note that when $\pi_i$ is a one-hot vector corresponding to the token $x_i$, we would have $\bar{e}(\pi_i) = \mathbf{e}_{z_i}$. Combining the embedding representation with the Gumbel-softmax approximation, we have a differentiable objective to minimize: $\min_{\Theta \in \mathbb{R}^{n \times V}} \mathbb{E}_{\tilde{\boldsymbol{\pi}} \sim \tilde{P}_{\Theta}} \mathcal{L}_\text{adv}(\bar{e}(\tilde{\boldsymbol{\pi}}), y; f)$. Meanwhile, it is also easy to apply differentiable soft constraints with white-box attacks. GBDA experimented with (1) a soft fluency constraint using NLL (negative log-likelihood) and (2) BERTScore (“a similarity score for evaluating text generation that captures the semantic similarity between pairwise tokens in contextualized embeddings of a transformer model.”; Zhang et al. 2019) to measure similarity between two text inputs to ensure the perturbed version does not diverge from the original version too much. Combining all constraints, the final objective function is as follows, where $\lambda_\text{lm}, \lambda_\text{sim} > 0$ are preset hyperparameters to control the strength of soft constraints: $$ \mathcal{L}(\Theta)= \mathbb{E}_{\tilde{\pi}\sim\tilde{P}_\Theta} [\mathcal{L}_\text{adv}(\mathbf{e}(\tilde{\boldsymbol{\pi}}), y; h) + \lambda_\text{lm} \mathcal{L}_\text{NLL}(\tilde{\boldsymbol{\pi}}) + \lambda_\text{sim} (1 - R_\text{BERT}(\mathbf{x}, \tilde{\boldsymbol{\pi}}))] $$ Gumbel-softmax tricks are hard to be extended to token deletion or addition and thus it is restricted to only token replacement operations, not deletion or addition. HotFlip (Ebrahimi et al. 2018) treats text operations as inputs in the vector space and measures the derivative of loss with regard to these vectors. Here let’s assume the input vector is a matrix of character-level one-hot encodings, $\mathbf{x} \in {0, 1}^{m \times n \times V}$ and $\mathbf{x}_{ij} \in {0, 1}^V$, where $m$ is the maximum number of words, $n$ is the maximum number of characters per word and $V$ is the alphabet size. Given the original input vector $\mathbf{x}$, we construct a new vector $\mathbf{x}_{ij, a\to b}$ with the $j$-th character of the $i$-th word changing from $a \to b$, and thus we have $x_{ij}^{(a)} = 1$ but $x_{ij, a\to b}^{(a)} = 0, x_{ij, a\to b}^{(b)} = 1$. The change in loss according to first-order Taylor expansion is: $$ \nabla_{\mathbf{x}_{i,j,a \to b} - \mathbf{x}} \mathcal{L}_\text{adv}(\mathbf{x}, y) = \nabla_x \mathcal{L}_\text{adv}(\mathbf{x}, y)^\top ( \mathbf{x}_{i,j,a \to b} - \mathbf{x}) $$ This objective is optimized to select the vector to minimize the adversarial loss using only one backward propagation. $$ \min_{i, j, b} \nabla_{\mathbf{x}_{i,j,a \to b} - \mathbf{x}} \mathcal{L}_\text{adv}(\mathbf{x}, y) = \min_{i,j,b} \frac{\partial\mathcal{L}_\text{adv}}{\partial \mathbf{x}_{ij}}^{(b)} - \frac{\partial\mathcal{L}_\text{adv}}{\partial \mathbf{x}_{ij}}^{(a)} $$ To apply multiple flips, we can run a beam search of $r$ steps of the beam width $b$, taking $O(rb)$ forward steps. HotFlip can be extended to token deletion or addition by representing that with multiple flip operations in the form of position shifts. Wallace et al. (2019) proposed a gradient-guided search over tokens to find short sequences (E.g. 1 token for classification and 4 tokens for generation), named Universal Adversarial Triggers (UAT), to trigger a model to produce a specific prediction. UATs are input-agnostic, meaning that these trigger tokens can be concatenated as prefix (or suffix) to any input from a dataset to take effect. Given any text input sequence from a data distribution $\mathbf{x} \in \mathcal{D}$, attackers can optimize the triggering tokens $\mathbf{t}$ leading to a target class $\tilde{y}$ ($\neq y$, different from the ground truth) : $$ \arg\min_{\mathbf{t}} \mathbb{E}_{\mathbf{x}\sim\mathcal{D}} [\mathcal{L}_\text{adv}(\tilde{y}, f([\mathbf{t}; \mathbf{x}]))] $$ Then let’s apply HotFlip to search for the most effective token based on the change in loss approximated by first-order Taylor expansion. We would convert the triggering tokens $\mathbf{t}$ into their one-hot embedding representations, each vector of dimension size $d$, form $\mathbf{e}$ and update the embedding of every trigger tokens to minimize the first-order Taylor expansion: $$ \arg\min_{\mathbf{e}'_i \in \mathcal{V}} [\mathbf{e}'_i - \mathbf{e}_i]^\top \nabla_{\mathbf{e}_i} \mathcal{L}_\text{adv} $$ where $\mathcal{V}$ is the embedding matrix of all the tokens. $\nabla_{\mathbf{e}_i} \mathcal{L}_\text{adv}$ is the average gradient of the task loss over a batch around the current embedding of the $i$-th token in the adversarial triggering sequence $\mathbf{t}$. We can brute-force the optimal $\mathbf{e}’_i$ by a big dot product of size embedding of the entire vocabulary $\vert \mathcal{V} \vert$ $\times$ the embedding '''
