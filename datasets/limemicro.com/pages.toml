full_description = "-----LimeRFE-----LimeRFEBUY FROM Mouser Lime RF Front-End (LimeRFE) is an open hardware RF front-end module with support circuitry to augment the LimeSDR family of boards and LimeNET Micro, providing a complete solution that addresses applications ranging from amateur radio to standards-compliant cellular networks.LimeRFE will enhance any SDR based wireless solution by providing:A stronger, clearer signal when transmittingLess noise when receivingImproved range for bothfeaturesspecificationsresourcesA Software-Definable RF Front End Module for LimeSDR PlatformsA single LimeRFE covers three very different sets of bands: cellular, amateur radio and wideband. The exact band used at any given time is software selectable. By making the RF front-end definable in software, LimeRFE is the next step in the evolution of software-defined radio.A highly integrated solution with a wealth of convenient featuresLimeRFE provides not only transmit and receive amplification, but also band-specific filtering and integrates duplexers for cellular band FDD operation. In addition to which it provides power and VSWR (requires external directional coupler) metering, and configuration is possible via either USB or direct connection to a LimeSDR board.-----Specifications.max-h-0 { max-height: 0; }Cellular Open menu BandDuplexDownlink (MHz)Uplink (MHz)Modulated Power (dBm)Tx Gain (dB)Tx P1dB (dBm)Rx Gain (dB)Rx NF (dB)Rx IIP3 (dBm)1FDD2110-21701920-1980243728116.5192 / PCS-1900FDD1930-19901850-1910244030.5125.519.53 / DCS-1800FDD1805-18801710-1785244029.5136197FDD2620-26902500-2570243726862138TDD2570-26202570-26202438268620.max-h-0 { max-height: 0; }Wideband Open menu BandFreq (MHz)Min Tx Gain (dB)Max Tx Gain (dB)Min Tx P1dB (dBm)Max Tx P1dB (dBm)Min Rx Gain (db)Max Rx Gain (db)Min Rx NF (dB)Max Rx NF (dB)Min Rx IIP3 (dBm)Max Rx IIP3 (dBm)WB10001-1000274522.528.51721.83.44.411.518WB40001000-4000123314247.818.42.75.51023.max-h-0 { max-height: 0; }Amateur Radio Open menu Ban