["https://limemicro.com/systems"]
title = "Lime Microsystems | Systems"
description = "Fully customisable systems and network solutions that integrate Lime software-defined radio, commodity compute and best-in-class software stacks for a turnkey user experience."
full_description = "The LimeNET AdvantageLimeNET integrated systems are built on the field-proven LimeSDR platform and in turn Lime’s Field-Programmable RF (FPRF) silicon. They offer unprecedented flexibility, are suited to a wide variety of use cases, and can be tailored for customer requirements such as processing power, bandwidth, frequency range, RF output power (coverage) and backhaul connectivity.LimeNET systems run Linux and benefit from a fully software-defined radio access network (RAN) and optional integrated core network. With the ability to also run customer workloads alongside the cellular stack at the very edge of the network, and to leverage platforms such as Docker and Kubernetes for containerisation and orchestration.LimeNET replaces highly proprietary equipment, software and knowledge, with commodity hardware and open source software. Providing a radical alternative to the closed wireless network equipment offered by incumbent vendors, with all the benefits this brings in terms of reusing existing tooling, skills and support infrastructure.Thanks to their software-defined nature, LimeNET systems may be configured for numerous radio access technologies and are able to support future 3GPP releases via software update.Typical uses include mobile private (MPN) and public networks, IoT networks, media streaming and test & measurement, to name but a few.Pricing is provided for low quantities of semi-custom reference designs. Please contact us for comprehensive customisation and volume pricing.html { scroll-padding-top: 130px; } @media only screen and (max-width: 600px) { html { scroll-padding-top: 75px; } }LimeNET 2.0LimeNET 2.0 is a modular, rack-mount solution which can be configured to support any 4G or 5G band up to 5GHz (TDD & FDD) and bandwidths of up to 100MHz (2x2) with 5G NR. It’s modular nature provides a future-proof solution which maximises the return on investment.LimeNET Mini 2.0LimeNET Mini 2.0 is a self-contained, network-in-a-box solution solution packaged in a convenient desktop form factor, which can be configured to support any 4G or 5G band up to 3.8GHz (TDD & FDD) and bandwidths of up to 100MHz (2x2) with 5G NR.LimeNET Micro 2.0LimeNET Micro 2.0 is an eminently compact, self-contained, network-in-a-box solution solution, which can be configured to support any 4G or 5G band up to 3.8GHz (TDD & FDD) and bandwidths of up to 10MHz SISO or 5MHz 2x2 MIMO.LimeNET DASLimeNET DAS allows telecom operators to quickly upgrade their current in-building infrastructure, and they can also deploy the solution progressively and enable MIMO coverage using a single coaxial cable infrastructure of in-building sites.LimeRRHLime Remote Radio Head (LimeRRH) for use with the LimeNET DAS solution."
