["https://limemicro.com/about"]
title = "Lime Microsystems | About"
description = "About Lime Microsystems."
full_description = "Lime pioneered the field-programmable RF (FPRF) transceiver and has been producing software-defined radio (SDR) silicon since 2012, offering products and solutions which have been adopted by mobile operators and numerous adjacent industries — from instrumentation to space applications.Our silicon and associated software is field-proven and has been validated through its use in a diverse array of applications, with over 16,000 LimeSDR boards alone having shipped to developers, research laboratories and system integrators across the globe.Since 2014 Lime has been at the forefront of innovation in the industry in applying SDR to mobile infrastructure, with the LimeNET family of products which enable operators to dynamically adapt to their band of interest with extremely low unit cost. While promising to deliver an unprecedented return on investment as infrastructure may be upgraded to new 3GPP releases via software update.Lime presented a breakthrough technology at MWC23: a complete 5G network including radio and core network running on a Raspberry Pi CM4 (industrial variant). Entirely SDR based, the solution is packaged in a WiFi router-like form factor, while being capable of operating on any cellular standard and frequency band.As creators of the industry leading FPRF silicon technology which is at the heart of the LimeSDR and LimeNET product families, Lime are in an entirely unique position to deliver groundbreaking innovation, backed by a deep and broad level of expertise which no other vendor can match."
