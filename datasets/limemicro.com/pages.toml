["https://limemicro.com/silicon"]
title = "Lime Microsystems | Silicon"
description = "Lime pioneered the creation of the single chip transceiver. Our field-programmable RF (FPRF) transceivers offer unmatched levels of programmability, and support frequency bands and international standards including all global variants of 2G (GSM), 3G (CDMA, HSPA), 4G (LTE), 5G (NR) and many others."
full_description = "Since 2005 Lime has set out to radically change the wireless landscape. Our introduction of single chip fully programmable transceivers shook up the consensus that Software-Defined RF components cannot be highly integrated. In order to make wireless technology available to a much broader range of system designers, we went beyond just providing the semiconductor components to providing open source SDR products under the LimeSDR brand.Our next step was to build on the success of the SDR products by providing integrated systems that can be configured as base stations, gateways and an entire wireless network-in-a-box. These products are based on Lime’s software-defined radio and commodity compute, plus Ubuntu Linux and best-in-class software stacks. Fully software-defined and upgradable, this philosophy introduces the white box concept into wireless communications for the first time.LMS6002DLMS7002MLMS8001+LMS9000Radio Spectrum300 MHz – 3.8 GHz100 kHz – 3.8 GHz100 kHz – 12 GHzUp to 100GHzRF Bandwidth28 MHz120 MHz (through analog ports) 60 MHz (through digital interface)120 MHz>2 GHzTRX ConfigurationSISOMIMOMIMOMIMODuplexFullFull and halfFull and halfFull and halfSample Rate (ADC/DAC)40 MSPS160/640 MSPS160/640 MSPSTBCDigital Gates50K1M1M1MPower consumption (W)1.511.5TBCAvailabilityJan 2011Oct 2014Sep 2017TBChtml { scroll-padding-top: 130px; } @media only screen and (max-width: 600px) { html { scroll-padding-top: 75px; } }LMS8001+LMS8001 is a single chip up/down RF frequency shifter with continuous coverage up to 10 GHz.LMS7002MLime’s second-generation field programmable RF (FPRF) transceiver IC covers all the way from 100kHz to 3.8GHz, with 2x2MIMO and extended functionality.LMS6002DThe LMS6002D is the world’s first field programmable RF (FPRF) transceiver IC and remains the most cost-effective product on the market. The transceiver IC operates from 300MHz to 3.8GHz – on both licensed and unlicensed bands – and can run any standard, making it ideal for wireless communications and broadband applications."
