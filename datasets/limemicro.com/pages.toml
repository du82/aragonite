["https://limemicro.com/sdr"]
title = "Lime Microsystems | SDR"
description = "LimeSDR is a disruptive radio access innovation platform allowing equipment manufacturers, wireless providers and operators to rapidly offer new products and services, and to compete in otherwise unprofitable business sectors."
full_description = "Over 16,000 LimeSDR Boards ShippedLimeSDR allows any device to be equipped with a software enabled radio, opening up the possibility of embedding IoT gateways, 4G and/or 5G small cells in everyday consumer products. Lime’s board level products are available in a variety of configurations, making them ideal for integration into products as varied as high capacity macro cell solutions or cost-optimized consumer premises equipment.Given their unique combination of industry leading performance and outstanding value for money, LimeSDR is also extremely popular with research, amateur radio, maker and enthusiast communities.The list of potential applications is endless and LimeSDR hardware has been used in Digital Video Broadcasting (DVB), radio astronomy, satcom, positioning and nuclear magnetic resonance (NMR) to name but a few.Radically OpenLimeSDR design and manufacturing files, FPGA gateware, firmware, software and APIs are all open source and made freely available. This gives customers a level of flexibility which only open source can provide, enabling further SWaP-C optimisation with very high volumes, and customisation for other specific requirements.LimeSDR is supported via the MyriadRF open source community and in excess of 16,000 boards have been shipped to developers, labs and system builders across the globe.html { scroll-padding-top: 130px; } @media only screen and (max-width: 600px) { html { scroll-padding-top: 75px; } }LimeSDR Mini 2.0LimeSDR Mini 2.0 is a software defined radio with the same form factor as the original LimeSDR Mini, and the same LMS7002 RF transceiver, but a new more powerful FPGA - the Lattice ECP5.LimeSDR XTRXLimeSDR XTRX is high-performance software-defined radio (SDR) board in a compact Mini PCIe form factor.LimeSDR X3LimeSDR X3 is an advanced PCIe software-defined radio with three LMS7002M transceivers, which can simultaneously support 4G and 5G operation, plus adaptive digital pre-distortion.LimeRFELime RF Front-End (LimeRFE) is an open hardware RF front-end module with support circuitry to augment the LimeSDR family of boards and LimeNET Micro."
