["https://limemicro.com/sdr/limesdr-xtrx"]
title = "Lime Microsystems | LimeSDR XTRX"
description = "LimeSDR XTRX is high-performance software-defined radio (SDR) board in a compact Mini PCIe form factor."
full_description = "-----LimeSDR XTRX-----LimeSDR XTRXBUY FROM Mouser LimeSDR XTRX is high-performance software-defined radio (SDR) board in a compact Mini PCIe form factor which has been optimised for embedding into larger designs. With an AMD Artix™ 7 XC7A50T-2CPG236I FPGA and a Lime Microsystems LMS7002M RF transceiver at its core, LimeSDR XTRX is a perfect platform for developing logic-intensive digital and RF designs.LimeSDR XTRX can be used as a building block for MIMO configurations from 2Tx2R to 32Tx32R, and in conjunction with digital processors (ASICs, GPPs and GPUs) of varying speed, power dissipation, and cost to fit any air interface, whether narrowband or broadband.LimeSDR XTRX is based on the Fairwaves XTRX Rev 5, with many many refinements and updates, plus comprehensive software support via the Lime Suite NG driver stack and plug-in modules.featuresspecificationsresourcesA building block for MIMO systems from 2T2R to 32T32RIt can be used in conjunction with digital processors (ASICs, GPPs and GPUs) of varying speed and power dissipation and cost, to fit any air interface, whether narrowband or broadband. The board is designed for the following key features:Frequency and Bandwidth: The heart of the board is the Lime transceiver RFIC (LMS7002), covering frequencies up to 3.8 GHz with a bandwidth of over 100 MHz.Baseband Interface: A significant level of digital circuitry resides within the LMS7002 and accompanying FPGA for the implementation of key physical layer radio functions, including filtering, decimation, interpolation, and flexible interfaces such as PCIe and SerDes.The compact, embedded nature of LimeSDR XTRX lends it to use in MIMO systems up to 32T32R, with interfacing possible via PCIe or SerDes link.Open SourceLimeSDR XTRX is based on the Fairwaves XTRX Rev 5, with many refinements. One of the biggest changes is that we have open sourced the design, providing customers with far greater flexibility and potential for customisation.The LimeSDR XTRX BOM, schematics, and layout are available in the LimeSDR XTRX repository. Meanwhile FPGA gateware sources can be found in the LimeSDR XTRX gateware repository.-----Specifications.max-h-0 { max-height: 0; }RF Transceiver Open menu RF transceiver: Lime Microsystems LMS7002MConfiguration: MIMO (2xTX, 2xRX)Frequency range: 30 MHz – 3.8 GHzBandwidth: 120 MHzSample depth: 12 bitSample rate: 120 MSPS SISO / 90 MSPS MIMOTransmit power: max 10 dBm (depending on frequency).max-h-0 { max-height: 0; }FPGA Open menu FPGA: AMD Artix™ 7 XC7A50T-2CPG236I236-pin CSBGA package (10mm x 10mm, 0.5mm)52160 LUTs logic capacity2700 Kb Embedded Memory600 Kb distributed RAM120 x 18x18-bit multipliers5 x PLL4 x DLL106 x IOFPGA configuration via JTAG.max-h-0 { max-height: 0; }FLASH Memory Open menu FLASH Memory: 256 Mb Flash memory for FPGA configuration.max-h-0 { max-height: 0; }Clock system Open menu 26.00 MHz (or 30.72 MHz) onboard VCTCXOVCTCXO may be tuned by onboard DACReference clock input and output connector (U.FL).max-h-0 { max-height: 0; }GPIO Open menu 2 x green LEDs4 x GPIO 3.3V in GPIO connector1 x GPIO in baseband connectors.max-h-0 { max-height: 0; }USB 2.0 Controller Open menu USB 2.0 controller: Microchip USB3333E-GL.max-h-0 { max-height: 0; }Temperature Sensor Open menu Temperature sensor: TMP1075NDRLR.max-h-0 { max-height: 0; }EEPROM Memory Open menu 128 Kb EEPROM for LMS MCU firmware (optional)128 Kb EEPROM for FPGA data (optional).max-h-0 { max-height: 0; }Connectors Open menu USB 2.0 (Micro-B) socketCoaxial RF (U.FL female) connectorsFPGA GPIO 8-pin FPC connectorFPGA JTAG connector (unpopulated)Mini PCIe edge connectorRF baseband 15-pin FPC connectors.max-h-0 { max-height: 0; }Dimensions Open menu Dimensions: 50.8mm x 20.97mm (Mini PCIe form factor).max-h-0 { max-height: 0; }Power sources Open menu USB connector (5 V)Mini PCIe (3.3 V)----- Contact us to discuss your requirement-----ResourcesDocumentation DocsDriver Stack Lime Suite NGSupport Forum"
