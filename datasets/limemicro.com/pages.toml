["https://limemicro.com/systems/limenet-micro-2-0"]
title = "Lime Microsystems | LimeNET Micro 2.0"
description = "LimeNET Micro 2.0 is an eminently compact, self-contained, network-in-a-box solution solution, which can be configured to support any 4G or 5G band up to 3.8GHz (TDD & FDD) and bandwidths of up to 10MHz SISO or 5MHz 2x2 MIMO."
full_description = "-----LimeNET Micro 2.0-----LimeNET Micro 2.0US$14,000[x-cloak] { display: none; } Quantity: 12345678910 In StockBuy Item added View CartLimeNET Micro 2.0 is the next step in the evolution of cellular infrastructure and is an eminently compact, self-contained, network-in-a-box solution built on the field proven Lime Software-Defined Radio (LimeSDR) platform. It is supplied complete with a pre-installed Linux O/S and cellular network stack, which can be configured to support any 4G or 5G band up to 3.8GHz (TDD & FDD), with RF channel bandwidths of up to 10MHz SISO or 5MHz 2x2 MIMO.LimeNET Micro 2.0 may be operated fully independently — with its own core network, plus IMS for voice and SMS support — or it can be integrated with existing core networks via standard 3GPP interfaces. Typical uses for LimeNET Micro 2.0 include mobile private network (MPN) and public networks, IoT networks, media streaming, and test & measurement, to name but a few.A licence is included for eNodeB, gNodeB, EPC, 5GC and IMS functions, with one year of software updates (this may be extended and please contact us for details).The current lead time for LimeNET Micro 2.0 is 6 weeks.featuresspecificationsresourcesA Compact and Highly Flexible SolutionLimeNET Micro 2.0 is incredibly flexible and in addition to building upon the field-proven LimeSDR platform, it integrates a wideband RF Front-End (RFE) which can be used with any frequency band up to 3.8GHz.Furthermore, LimeNET Micro 2.0 can be powered via Ethernet (PoE+), USB-C PD or 12VDC supply, and integrates a high quality OCXO for frequency stability and may be synchronised via GNSS, IEEE 1588 PTP v2, or an external reference input.Expert SupportWe are committed to getting customers up and running as quickly as possible and configuration support for network-in-a-box type deployments is included. Please contact us to discuss requirements for support on more advanced topics, such as integration with existing core networks.-----Specifications.max-h-0 { max-height: 0; }RF Open menu Transceiver Platform (LimeSDR XTRX):Bandwidth supported determined by CPU (Raspberry Pi CM4):10MHz SISO5MHz 2x2 MIMOSynchronisation: GNSS, IEEE 1588 PTP v2 or external reference inputRF Front-End:20dBm max (P1dB) 2x2 MIMOExternal bandpass filtering.max-h-0 { max-height: 0; }Baseband Open menu Raspberry Pi Compute Module 4RAM: 8GBStorage: 32GB eMMCBackhaul: 1G Ethernet.max-h-0 { max-height: 0; }Mechanical Open menu 19x13x6cm (WxLxH).max-h-0 { max-height: 0; }Power Open menu PoE+USB-C PD (12V, 1.5 A or 2.5 A)Barrel jack connector (9-14V, 2-3 A)----- Contact us to discuss your requirement-----ResourcesDocumentation Contact LimeSupport Create Ticket"
