["https://limemicro.com/story/limenet-micro-20-developer-edition-campaign-launches"]
title = "Lime Microsystems | LimeNET Micro 2.0 Developer Edition Campaign Launches"
description = "The crowdfunding campaign for LimeNET Micro 2.0 has launched today on Crowd Supply and purchasing options include the LimePSB RPCM board-only, a complete LimeNET Micro 2.0 kit, and also a deluxe kit which includes the Amarisoft 5G stack with core network, plus two 5G smartphones and ten SIM cards."
full_description = "-----LimeNET Micro 2.0 Developer Edition Campaign LaunchesJune 05, 2024By: Andrew BackLimeNET Micro 2.0 DE (Developer Edition) is a modular radio platform that leverages the Raspberry Pi Compute Module 4 (CM4) and LimeSDR XTRX for their respective computing and RF features. It is based around the new LimePSB RPCM, a planar system — a.k.a. “main” — board, which is significantly more versatile than the previous version of LimeNET Micro, which was limited by its support for a less powerful compute module (CM3) and an integrated SISO radio.LimeNET Micro 2.0 DE is comprised of LimePSB RPCM, Raspberry Pi CM4, and LimeSDR XTRX, which together form a complete baseband + RF solution and is an ideal tool for a wide range of wireless applications.The crowdfunding campaign for LimeNET Micro 2.0 has launched today on Crowd Supply and purchasing options include the LimePSB RPCM board-only, a complete LimeNET Micro 2.0 kit, and also a deluxe kit which includes the Amarisoft 5G stack with core network, plus two 5G smartphones and ten SIM cards.-----Share this storyLinkedIn Twitter Facebook Vimeo -----LimeNET Micro 2.0 Developer Edition Campaign LaunchesJune 05, 2024By: Andrew BackLimeNET Micro 2.0 DE (Developer Edition) is a modular radio platform that leverages the Raspberry Pi Compute Module 4 (CM4) and LimeSDR XTRX for their respective computing and RF features. It is based around the new LimePSB RPCM, a planar system — a.k.a. “main” — board, which is significantly more versatile than the previous version of LimeNET Micro, which was limited by its support for a less powerful compute module (CM3) and an integrated SISO radio.LimeNET Micro 2.0 DE is comprised of LimePSB RPCM, Raspberry Pi CM4, and LimeSDR XTRX, which together form a complete baseband + RF solution and is an ideal tool for a wide range of wireless applications.The crowdfunding campaign for LimeNET Micro 2.0 has launched today on Crowd Supply and purchasing options include the LimePSB RPCM board-only, a complete LimeNET Micro 2.0 kit, and also a deluxe kit which includes the Amarisoft 5G stack with core network, plus two 5G smartphones and ten SIM cards."
