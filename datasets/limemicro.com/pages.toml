["https://limemicro.com/systems/limenet-mini-2-0"]
title = "Lime Microsystems | LimeNET Mini 2.0"
description = "LimeNET Mini 2.0 is a self-contained, network-in-a-box solution solution packaged in a convenient desktop form factor, which can be configured to support any 4G or 5G band up to 3.8GHz (TDD & FDD) and bandwidths of up to 100MHz (2x2) with 5G NR."
full_description = "-----LimeNET Mini 2.0-----LimeNET Mini 2.0US$32,000-US$58,000[x-cloak] { display: none; } Quantity: 12345678910 In Stock RF Front-End: RFE with 1W PA (2x2)No RFE Support: BasicEnhancedBuy const productOpts = { 'gid://shopify/ProductVariant/42763261739214' : { variantOption1: 'rfe-with-1w-pa-2x2', variantOption2: 'basic', variantOption3: '', price: 'US$50,000' }, 'gid://shopify/ProductVariant/42774081863886' : { variantOption1: 'rfe-with-1w-pa-2x2', variantOption2: 'enhanced', variantOption3: '', price: 'US$58,000' }, 'gid://shopify/ProductVariant/42763261771982' : { variantOption1: 'no-rfe', variantOption2: 'basic', variantOption3: '', price: 'US$32,000' }, 'gid://shopify/ProductVariant/42774081896654' : { variantOption1: 'no-rfe', variantOption2: 'enhanced', variantOption3: '', price: 'US$40,000' }, }; const handleSelectChange = (val) => { const variantOption1 = document.getElementById('variantOption1');const variantOption2 = document.getElementById('variantOption2'); for (const productOpt in productOpts) { // console.log(productOpts[productOpt]) if (variantOption1.value === productOpts[productOpt].variantOption1 && variantOption2.value === productOpts[productOpt].variantOption2) { document.getElementById('merchandiseId').value = productOpt; document.getElementById('productPrice').innerHTML = productOpts[productOpt].price; } } }; Item added View CartLimeNET Mini 2.0 is the next step in the evolution of cellular infrastructure and is a self-contained, network-in-a-box solution built on the field proven Lime Software-Defined Radio (LimeSDR) platform. It is supplied complete with a pre-installed Linux O/S and cellular network stack, which can be configured to support any 4G or 5G band up to 3.8GHz (TDD & FDD), with bandwidths of up to 20MHz (2x2) with LTE networks and 100MHz (2x2) with 5G NR.LimeNET Mini 2.0 may be operated fully independently — with its own core network, plus IMS for voice and SMS support — or it can be integrated with existing core networks via standard 3GPP interfaces. Typical uses for LimeNET Mini 2.0 include mobile private network (MPN) and public networks, IoT networks, media streaming, and test & measurement, to name but a few.A licence is included for eNodeB, gNodeB, EPC, 5GC and IMS functions, with one year of software updates (this may be extended, please contact us for details).Either 4G or 5G SA operation is supported as standard and please contact us to discuss requirements such as support for 5G NSA, multiple cells and carrier aggregation etc.The RFE frequency band will be specified by the customer after ordering. Please contact us with RFE requirements for different MIMO layer configurations or transmit power levels etc.The current lead time for LimeNET Mini 2.0 is 4 weeks.featuresspecificationsresourcesAvailable with or without RFELimeNET Mini 2.0 is typically supplied with an integrated 2x2 MIMO RF Front-End (RFE) which features 1W per channel RF power output.LimeNET Mini 2.0 may also be ordered without an RFE for development purposes and use with third party RF front-ends. In this case it is packaged in a slightly smaller desktop enclosure, pictured right.Expert SupportWe are committed to getting customers up and running as quickly as possible and LimeNET Mini 2.0 may be purchased with either basic or enhanced support. The former provides configuration support for network-in-a-box type deployments, while the latter also covers more advanced tasks, such as integration with existing core networks. Please contact us for further details.-----Specifications.max-h-0 { max-height: 0; }RF Open menu Transceiver Platform (LimeSDR X3):RF #1: LTE up to 20MHz 2x2 MIMORF #2: 5G NR up to 100MHz 2x2 MIMOSynchronisation: GNSS, White Rabbit or external reference inputRF Front-End:1W 2x2 MIMO (4G or 5G)Frequency range specified by the customerCustom options also available and please contact us for details.max-h-0 { max-height: 0; }Baseband + MEC Open menu CPU: AMD Ryzen 7 7700 (8C/16T) or Ryzen 9 7900 (12C/24T), 4.60GHzRAM: 16GBStorage: 500GB SATA SSDBackhaul: 1G EthernetCustom options also available and please contact us for details.max-h-0 { max-height: 0; }Mechanical Open menu With integrated RFE: 28x40x39cm (WxLxH)Without RFE: 17x35x25cm (WxLxH).max-h-0 { max-height: 0; }Power Open menu 100-240 VAC supply750W power supply----- Contact us to discuss your requirement-----ResourcesDocumentation Contact LimeSupport Create Ticket"
