["https://limemicro.com/sdr/limesdr-x3"]
title = "Lime Microsystems | LimeSDR X3"
description = "LimeSDR X3 is an advanced PCIe software-defined radio with three LMS7002M transceivers, which can simultaneously support 4G and 5G operation, plus adaptive digital pre-distortion."
full_description = "-----LimeSDR X3-----LimeSDR X3US$20,000[x-cloak] { display: none; } Quantity: 12345678910 In StockBuy Item added View CartLimeSDR X3 is a full size PCIe Gen 2 x4 card that integrates three Lime Microsystems LMS7002M transceivers, which may be used to simultaneously support 4G, 5G and adaptive digital pre-distortion (ADPD) for power amplifier (PA) linearisation. LimeSDR X3 is the radio transceiver platform used in turnkey systems such as LimeNET 2.0 and LimeNET Mini 2.0.While designed with cellular networks in mind, LimeSDR X3 may be used to support any air interface and in applications such as Digital Video Broadcasting (DVB), for example.As standard LimeSDR X3 is supplied with RF matching networks optimised for popular 4G and 5G bands, but the matching networks may be optimised for other frequency bands upon request.featuresspecificationsresourcesAn advanced radio platform for high performance applicationsLimeSDR X3 employs an AMD Artix-7 FPGA with 215K logic elements and 740 DSP slices, plus three LMS7002M transceivers, which are typically designated for 4G, 5G and ADPD use.The 5G designated transceiver utilises high speed ADCs and DACs and is able to support up to 100MHz RF bandwidth 2x2 MIMO. RF switches on the board also enable this to be connected to the third transceiver, which is intended for use with ADPD and for calibration purposes.The 4G and 5G designated transceivers both feature PA drivers in their transmit paths.LimeSDR X3 is the target platform for Lime Adaptive Digital Pre-Distortion (LimeADPD), a fully open source software and FPGA gateware implementation which provides not only ADPD, but also crest factor reduction (CFR) and an equaliser for I/Q imbalance correction and gain flattening.White Rabbit support for high precision time and frequency transferLimeSDR X3 can be configured to support White Rabbit Precision Time Protocol (WR PTP) in order to provide high accuracy time and frequency transfer, enabling applications to scale up to thousands of nodes and with up to 10km between network elements.White Rabbit timing networks employ fibre optic media and are able to achieve high precision synchronisation, thanks to using IEEE 1588 PTP together with Synchronous Ethernet (SyncE) for L1 syntonisation, plus phase measurement for link delay calculation. This results in a sub-nanosecond synchronisation accuracy, compared with sub-microsecond for IEEE 1588-2008.LimeSDR X3 features an SFP cage for use with White Rabbit (a 1000BASE-BX10 standard bi-directional transceiver with a single LC connector is recommended). For evaluation purposes and where only two nodes are required, two LimeSDR X3 boards may be directly connected, with one configured as PTP grandmaster. A White Rabbit switch is required with three or more nodes.-----Specifications.max-h-0 { max-height: 0; }RF Transceivers Open menu #1 (4G): Lime Microsystems LMS7002M:Configuration: MIMO (2xTX, 2xRX)Frequency range: 30 MHz – 3.8 GHzBandwidth: 120 MHzSample depth: 12 bitSample rate: 120 MSPS SISO / 90 MSPS MIMOTransmit power: max 10 dBm (depending on frequency)#2 (5G): Lime Microsystems LMS7002M with external ADCs + DACs:Configuration: MIMO (2xTX, 2xRX)Frequency range: 300 MHz – 3.8 GHzBandwidth: 100 MHz (flat response)Sample depth: 14 bit ADC and 16 bit DACSample rate: Up to 160 Msps ADCs / 250 Msps DACsTransmit power: max 10 dBm (depending on frequency)#3 (calibration/ADPD): Lime Microsystems LMS7002M with external ADCs:Configuration: MIMO (2xTX, 2xRX)Frequency range: 30 MHz – 3.8 GHzBandwidth: 120 MHzSample depth: 14 bit ADC / 12 bit DACSample rate: Up to 160 Msps ADCsTransmit power: max 10 dBm (depending on frequency).max-h-0 { max-height: 0; }FPGA Open menu Artix-7 XC7A200T:676-FCBGA (27x27) package215,360 logic elements740 DSP slices13 Mb block RAMx4 Gen 2 PCIe interface10 clock management tile (CMT), each containing one MMCM and one PLL.max-h-0 { max-height: 0; }Flash Memory Open menu 256 Mbit FPGA configuration flash.max-h-0 { max-height: 0; }EEPROM Memory Open menu 4x 128Kbit (16K x 8) EEPROM (for each RF transceiver and FPGA data).max-h-0 { max-height: 0; }Other Devices Open menu Temperature sensorCrypto Authentication DeviceGNSS receiver.max-h-0 { max-height: 0; }Clock System Open menu 30.72MHz (default) VCOCXO and 38.4MHz (optional) VCTCXOVCOCXO disciplined (synchronisation) options:GNSS PPS signalReference clock input or onboard DACWhite Rabbit PTP (slave or grandmaster)Clock generator/PLL for baseband DACs, ADCs.max-h-0 { max-height: 0; }GPIO Open menu 2x PMOD headers (0.1” pitch) connected to FPGA4x dual color (RG) LEDs connected to FPGA4x Switches connected to FPGA.max-h-0 { max-height: 0; }Connectors Open menu Coaxial RF (SMA and uFL/MMCX) connectorsuFL/MMCX connectors and headers for reference clock IN/OUT, GNSS antenna12V header for powering external devicesFan headersFPGA JTAG connector (2mm pitch).max-h-0 { max-height: 0; }Dimensions Open menu Dimensions: 232.5mm x 106.7mm (9.15” x 4.2”) excluding connectors.max-h-0 { max-height: 0; }Power Open menu 12V 6-pin PCIe power connector----- Contact us to discuss your requirement-----ResourcesDocs DocumentationDriver Stack Lime Suite NGSupport Forum"
