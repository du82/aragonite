["https://limemicro.com/sdr/limesdr-mini-2-0"]
title = "Lime Microsystems | LimeSDR Mini 2.0"
description = "LimeSDR Mini 2.0 is a software defined radio with the same form factor as the original LimeSDR Mini, and the same LMS7002 RF transceiver, but a new more powerful FPGA - the Lattice ECP5."
full_description = "-----LimeSDR Mini 2.0-----LimeSDR Mini 2.0BUY FROM Mouser LimeSDR Mini 2.0 is an upgraded, drop-in replacement for LimeSDR Mini, a hardware platform for high-performance and logic-intensive digital and RF designs that use an FPGA coupled with Lime Microsystems’ LMS7002M RF transceiver. It has the same form factor as the original LimeSDR Mini and the same RF transceiver, but a new FPGA — the Lattice ECP5 — which has more resources and benefits from an extensive set of open source tools and a vibrant community of developers.Since we first introduced LimeSDR over eight years ago, and LimeSDR Mini about a year later, we’ve shipped tens of thousands of units to engineers around the world for use in everything from satellite ground stations to digital television.Whether you’re a hobbyist using the LimeSDR platform to learn about software-defined radio, or a company integrating hundreds of units into your commercial product, we’ve been thrilled at the breadth and depth of LimeSDR Mini applications that you've come up with.featuresspecificationsresourcesstoriesAn open, full-duplex, USB stick software-defined radioIt can be used in conjunction with host computers of varying speed, power dissipation and cost, to fit any air interface, whether narrowband or broadband. The board is designed for the following key features:Frequency and Bandwidth: The heart of the board is the Lime transceiver RFIC (LMS7002), covering frequencies up to 3.8 GHz with a bandwidth of up to 40 MHz.Baseband Interface: A significant level of digital circuitry resides within the LMS7002 and accompanying FPGA for the implementation of key physical layer radio functions, including filtering, decimation and interpolation. Interfacing is via USB 3.0.ApplicationsThe SDR community has has used Lime products for a wide range of applications, such as:Amateur digital TV broadcastSatellite ground stationStreaming FM to the InternetOreSat, Oregon's first satelliteSpectrum-scanning jammer and controller for dronesBit pattern generator aligned with the SDR data streamDigital audio broadcastSince LimeSDR Mini 2.0 has an FPGA with even more logic gates than its predecessors, we expect the number and types of applications to increase accordingly.-----Specifications.max-h-0 { max-height: 0; }RF Transceiver Open menu Lime Microsystems LMS7002MFrequency Range: 10 MHz - 3.5 GHzRF Bandwidth: 40 MHzSample Depth: 12 bitsSample Rate: 30.72 MSPSTX Channels: 1RX Channels: 1Duplex: FullTransmit Power: max 10 dBm (depending on freq.).max-h-0 { max-height: 0; }FPGA Open menu Lattice ECP5 LFE5U-45F285-pin csfBGA package44K LUTs logic capacity108 sysMEM Blocks (18 Kb)1944 Kb Embedded Memory351 Kb distributed RAM72x 18x18-bit multipliers4x PLL and 4x DLL118x IOFPGA configuration via JTAG.max-h-0 { max-height: 0; }Flash Memory Open menu 128Mb Flash memory for FPGA configuration.max-h-0 { max-height: 0; }Clock System Open menu 40.00MHz on board VCTCXOVCTCXO can be tuned by onboard DACReference clock input and output connectors (U.FL).max-h-0 { max-height: 0; }GPIO Open menu 3x Dual colour (RG) LEDs8x + 2x FPGA GPIO pin headers (3.3V) (optional).max-h-0 { max-height: 0; }USB 3.0 Controller Open menu FTDI FT601.max-h-0 { max-height: 0; }Temperature Sensor Open menu LM75.max-h-0 { max-height: 0; }Connectors Open menu USB 3.0 (type A) plugCoaxial RF (SMA female) connectorsFPGA GPIO headers (unpopulated)FPGA JTAG connector (unpopulated)FAN (5V default or 3.3V) connector.max-h-0 { max-height: 0; }Dimensions Open menu 69mm x 31.4mm.max-h-0 { max-height: 0; }Power Open menu USB connector (5V)----- Contact us to discuss your requirement-----ResourcesDocumentation DocsDriver Stack Lime SuiteSupport Forum-----Related storiesBarefoot LimeSDR Mini Digital TV Transmission over 16 kmAugust 10, 2020DreamCatcher Launches LTE, LTE-Advanced Courseware with LimeSDR-Powered Training KitMarch 06, 2020Lime Provides LimeSDR Mini and Raspberry Pi Base Stations for EMF CampAugust 24, 2018QRadioLink and Smartphone Transmit & Receive Demo using LimeSDR MiniDecember 22, 2017"
