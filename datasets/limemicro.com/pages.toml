["https://limemicro.com/story/raspberry-pi-compute-module-5-provides-significant-performance-boost-for-limenet-micro-20"]
title = "Lime Microsystems | Raspberry Pi Compute Module 5 Provides Significant Performance Boost for LimeNET Micro 2.0"
description = "We are delighted to announce that LimeNET Micro 2.0 has been updated to be compatible with CM5 and to take advantage of the marked increase in performance that it provides, while also retaining compatibility with Compute Module 4."
full_description = "-----Raspberry Pi Compute Module 5 Provides Significant Performance Boost for LimeNET Micro 2.0November 28, 2024By: Andrew BackYesterday Raspberry Pi launched their latest and most powerful yet system-on-module for embedded compute, the Compute Module 5 (CM5). We are delighted to announce that LimeNET Micro 2.0 — the eminently compact 5G/4G network-in-a-box — has been updated to be compatible with CM5 and to take advantage of the marked increase in performance that it provides, while also retaining compatibility with Compute Module 4.With CM4 the LimeNET Micro 2.0 is able to support 5G NR TDD SISO operation with 10MHz RF bandwidth. However, with CM5 it is now able to support FDD 2x2 MIMO with 20MHz bandwidth. Which is to say a significant increase in performance and all while still being able to run a 5G Core network also on the Compute Module, for fully self-contained operation.All new orders placed for LimeNET Micro 2.0, LimeNET Micro 2.0 Developer Edition and the LimePSB RPCM which these are based upon will be compatible with Compute Module 5. While we expect that orders placed for LimeNET Micro 2.0 from January 2025 onwards will ship with CM5 fitted as standard, but please contact us first to confirm where this is a requirement.-----Share this storyLinkedIn Twitter Facebook Vimeo -----Raspberry Pi Compute Module 5 Provides Significant Performance Boost for LimeNET Micro 2.0November 28, 2024By: Andrew BackYesterday Raspberry Pi launched their latest and most powerful yet system-on-module for embedded compute, the Compute Module 5 (CM5). We are delighted to announce that LimeNET Micro 2.0 — the eminently compact 5G/4G network-in-a-box — has been updated to be compatible with CM5 and to take advantage of the marked increase in performance that it provides, while also retaining compatibility with Compute Module 4.With CM4 the LimeNET Micro 2.0 is able to support 5G NR TDD SISO operation with 10MHz RF bandwidth. However, with CM5 it is now able to support FDD 2x2 MIMO with 20MHz bandwidth. Which is to say a significant increase in performance and all while still being able to run a 5G Core network also on the Compute Module, for fully self-contained operation.All new orders placed for LimeNET Micro 2.0, LimeNET Micro 2.0 Developer Edition and the LimePSB RPCM which these are based upon will be compatible with Compute Module 5. While we expect that orders placed for LimeNET Micro 2.0 from January 2025 onwards will ship with CM5 fitted as standard, but please contact us first to confirm where this is a requirement."
