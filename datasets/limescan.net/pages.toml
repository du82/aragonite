title = "limescan"
full_description = "LimeSCAN is built on the award winning, low cost LimeSDR platform and combines this with commodity embedded compute, to create a fully software-defined wireless probe that is integrated with a data platform and web based visualisation. With Lime’s FPRF technology at it’s heart, LimeSCAN devices can be remotely configured at an instant to run different completely scan profiles. Note: LimeSCAN is currently a pre-production alpha, the data shown here is likely to change at any time and may not yet be fully accurate."
