title = "Alex Limi ⁂ Improving download behaviors in web browsers"
description = "Saving the world,<br> one file at a time"
full_description = "March 25th, 2010 Improving download behaviors in web browsers Saving the world, one file at a time The confusing & inconsistent state of downloading files using a web browser has long been a pet peeve of mine. The current situation is pretty much a mess in every web browser. Issues with file systems in general notwithstanding, even doing simple downloads to a centrally defined folder can be confusing, even frustrating. The aim of this article is to give an introduction to how the most common browsers behave when it comes to downloading files, what opportunities exist, and close with a set of recommendations for how to fix this in Firefox and other browsers. It is my hope that putting these ideas out there will spur some innovation in this area both in Firefox and competing browsers. We’ll try to cover the most obvious issues in the most common browsers, so we can all get better at this. This article will cover: Firefox 3.6, Internet Explorer 8, Chrome 5 beta, & Opera 10.50 beta. Beverage warning Every once in a while, I publish articles that may require some time commitment, because I think the subject matter warrants an in-depth treatment, and because that’s how I roll. As per Blaise Pascal, “Je n’ai fait celle-ci plus longue que parce que je n’ai pas eu le loisir de la faire plus courte” — I would have written a shorter letter, but I did not have the time. So find a beverage of a suitable size and persuasion — this stuff can certainly drive UI designers to go for the hard liquor — and let’s look at the current landscape for browser download handling, and how it can be improved. Existing approaches It’s useful to have a basic understanding of how downloads are handled in the various browsers: Firefox Let’s start with Firefox: In addition to the download window itself, there’s also a download progress indicator in the status bar, that — when clicked — will bring up the download manager window: There’s a lot to like about the current download manager in Firefox: It tells you the size of the file, the domain you got it from, and when you downloaded it. It has a built-in filter labeled “Search…” — which is slightly misleading — but it works well for locating files that you have already downloaded. The status bar download indicator tells you how much time is left, and provides an easy (although not necessarily very discoverable) way to bring up the download manager window. …but there are also elements that are problematic: It’s a dedicated window, which easily gets lost if you’re not careful — it will be hidden under the browser window or other windows you activate. This is especially noticable in OSes that are more app-centric than window-centric — prominent examples are Mac OS X, and now Windows Vista/7. It has a lot of “administrative debris” — my pet peeves are: The window doesn’t automatically resize to fit the downloads shown, Certain personality types (present party included) will obsessively click the “Clear List” button to clean up the list once they are done. Of course, this doesn’t actually remove the history entries of these sites, but more about that later. There are still some valid cases here, some people never clear their downloads, and use the search filter to find files they downloaded a long time ago, for instance. This is a use case we should still support. When the downloads are done, the download indicator in the status bar disappears. Yes, read that again. It disappears. This is crazy. Just when you need it to activate the downloads window — gone. Internet Explorer Moving on to everyone’s favorite browser, the approach is pretty simple, no dedicated download manager, everything is handled by dialog windows: The good: There’s a you-can’t-miss-it dialog when saving, it shows you a dialog box every time you do a download. This is crude, but effective — it works well, especially with novice users. Asking where to put the file every time minimizes confusion about where it went to some extent — of course, after a while, this turns into a classic “Whatever” dialog, and the users lose track of it anyway. The progress bar shown in the application icon while a download is in progress is nifty: — this shows that the download is 50% complete. I believe we are in the process of landing something similar on Windows Vista/7 in the nightly Windows builds of Firefox too. The bad: Every download opens a separate window, which becomes unmaintainable when you do a lot of downloads, and also leads to a lot of stray windows unless you manually clean them up. There’s no way to search in downloads. Seeing a dialog box for every single download gets annoying after a while. The download window can still get lost, this is magnified with the Vista/7 approach where the windows live inside the icon of the application. Especially frustrating: it will throw up a dialog box that you may miss if you click somewhere else at that exact moment, which results in the download never starting if it was an exe, since it blocks the download until the question has been answered. It also seems to ask multiple times whether you really want to download/run the file (once when initiating download, once when running it? There’s some slightly inconsistent behavior here that we haven’t quite been able to figure out the logic behind) Safari Nothing revolutionary, overwhelmingly similar to the Firefox approach, with a few improvements and a few missing features. It has the same dedicated “download manager” window approach: The good: Minimalist presentation. Easy way to reveal the location on the file system where the file ended up, and it also selects the file for you. The same upsides as the Firefox download manager. The bad: The clear button introduces administrative debris (similar to the problem with Firefox). No way to search in downloads. Doesn’t indicate where the file came from or when you downloaded it. Separate window that will disappear behind the main browser window if you use it while waiting for the download — and we have seen people waiting for the download to complete before continuing browsing because they “don’t know how to find the file again” once the window disappears. The overhead that comes with it being a separate window (scrolling, minimize/maximize, no auto-resize, etc), also shared with Firefox. No indicator of download progress if you can’t see the download window Chrome Chrome has actually done a fair amount of work on attempting to improve download handling, and is — in my opinion — one of the better experiences out there right now when it comes to handling files with a web browser. Of course, it has its share of problems too. The fundamental difference is that it puts downloads in a bar along the bottom of the browser window: To make sure you don’t miss where the download goes, Chrome seems to follow the age-old philosopy of “if you want people to not miss it, make it big and red.” When you initiate a new download, it displays a falling arrow for approximately a second, to bring your attention to the download bar at the bottom. This does give the impression of “usability testing gone horribly wrong”, where — no matter what the UI designer does — he can’t get people to notice where the downloaded file went, since there’s no dialog box to obstruct the view and call attention to itself. Hence, the only solution is to add an arrow that is so big that you can’t possibly miss it. To Chrome’s credit, they have iterated quickly on the download UI over the past few versions. Earlier versions had the download bar pinned to the tab it was initiated from — which is pretty much exactly the opposite of what you want, since you’re likely to browse other sites until the download is done. Thankfully, this is now fixed, and the download bar is now global. A curious side effect of the global download bar UI is that it goes contrary to Chrome’s philosophy of taking up as little space for the browser UI as possible. The download bar steals the equivalent of two status bars of pixels in every tab you’re using unless you dismiss it by closing it: Another problem, illustrated above, is that it doesn’t really have a solution for overflow. Similar to how Chrome doesn’t yet have a strategy to deal with the case when you have too many tabs (they just get smaller and smaller until they are unusable), the screenshot above actually contains three downloads — the only problem is that download #3 is (presumably) wrapped to an invisible line below the two visible downloads. Clicking “Show all downloads…” will bring up a download tab, where you can see all the downloads you have made: This was an approach originally introduced by Opera, which we’ll talk about next: Opera Does quite a few things right (as usual), but have some weird defaults that mar the overall experience. The idea of downloads-window-as-a-tab was first done in Opera, but can still be improved. Opera shares most of the same issues as most of the other browsers (asks every time it downloads, opening with non-sensical applications like DiskImageMounter, etc), but overall it is standard fare. One thing to note is the amount of Power User functionality included in the main UI, with things like the “Quick Download” field that will download whatever URL you paste into it directly, its support for downloading all the resources linked from a page, etc. The quick download field is also curiously positioned in exactly the same location as you would expect to find a search/filter bar, and people do try to use it as such — with predictably bad results. Suggested improvements to the download handling in Firefox Informed by what other browsers do for downloads, it’s clear that Firefox already does a good job in comparison — but it can also be made a lot better without an ovwerwhelming amount of work. The infrastructure is solid, we have the necessary functionality for most of this already — but the user experience of how it all fits together can be significantly improved. From the Firefox point of view, we have a list of things we can do to make the user experience of downloading more streamlined and easier on the users. This advice pretty much applies uniformly across all browsers, and as usual — feel free to steal any of these ideas for other browsers. It’s how we make web browsers better. Replacing the download manager window The current download manager tries to do a lot in too small a space, so we propose to split the downloads into the following two components: An easily accessible panel that shows you current state of downloads, your recent downloads, and gives you a good indicator of how far along your download is. Its goal is to surface status, not to perform download management outside of the basics of showing progress & number of files, as well as operations to stop & resume the download. A sketch of our current thinking is shown to the right; it will also light up when starting a download, and possibly add some subtle glow effects to indicate that downloads are in progress, and a more significant event once a download completes. A more powerful full-window UI for advanced operations like searching, clearing entries, sorting, and everything else related to Download History. This is also where operations like rename or delete are present. This window should ideally be shown as a tab, and since we have tear-off tabs, you can keep the old-style dedicated download window too, if you prefer that. You probably caught on to this idea already, but the main point of #2 is that there is no need for a dedicated download manager. The download manager is a listing of history, and should simply be a filter inside the history window that says “show me only files”. Download history is intimately tied to browsing history, and sometimes the additional context is useful when looking for a download you did as part of a browsing task. Being able to show history, and then narrow down to only show files is a natural way of approaching download history. Other things that would improve the experience: At the end of the download progress bar, a “what happens next?” indicator could be shown — ie. “is saved in the download folder,” “is opened with iTunes,” etc. The download history should support simple file system operations (copy/move works, rename), and show where the file is located. If a file is deleted, ghost it in the download log to indicate that the file has gone missing, and make it possible to re-download. Keep track of the new location if file is moved. Warn when a download is in progress and you attempt to quit the browser. Drag and drop should work from all representations (download panel & download history). File & application handling On the infrastructure side, there are a lot of smaller problems that conspire to give the user a less-than-pleasant experience with regards to how files are handled. Some of the issues that should be fixed: Replace “Save” with “Download” in the menus? People do get confused by the difference between Save and Download. Right now, you “Save” a page in Google Docs when you edit, but you can also “Save” the page itself to disk on your computer. How are you supposed to know which one does what? Additionally, the word “download” has entered the mainstream vocabulary; for better or for worse. In the Firefox menu, we currently have a “Save As,” but no “Download” — should we stop using the word “Save” in our UI to make it more consistent? It makes sense, but probably requires some testing to find out whether people are comfortable with it. According to the Test Pilot studies, people use this menu entry quite a bit. Don’t ask every time, just do the default action for the common file types. If you ask questions all the time, people stop paying attention. This is the classic UI problem that Windows traditionally had when compared to Mac OS X. If there’s a very logical, straightforward outcome of an action — don’t get in the way of the user. At Mozilla, we jokingly call the “OK” button the “Whatever” button, and there’s even an extension that replaces all “OK/Agree/Yes” buttons with “Whatever” buttons to drive the point home. Make the default action simple, make the advanced action powerful. “Open With” (Save As?) should be how you get to adjust location/options. When you choose to special-case something (ie. explicitly choose to download using the right-click menu), we should give you all of the”explicit” options — you might want to rename the file and choose a location when you save it. If you just click the file, we give you the file, no questions asked. The browser should be better at remembering locations. It should remember where on the file system you got the last file you uploaded to the current site from, and the other way around — if you ask to download a file from a site, and you’ve done it before, we should remember which folder you saved it to. This has partially landed in the Firefox nightly builds, and when I go back to using a version of Firefox (or other browse"
