full_description = "March 15th, 2011 User Experience improvements in Firefox 4 UX details worth checking out With Firefox 4 right around the corner — we might have the final release as early as next week — it’s a good time to take a quick look at some of the user interface and user experience improvements in the release. There’s a million (only slightly less, really) improvements in Firefox 4, and other blogs and our own fantastic engagement team will tell you about the other great improvements — but I thought I’d publish this quick “changes we think you should take a look at” post for those of you who can’t wait. New look As you probably know, we have an entirely new look across all our platforms — Windows, Mac OS X & Linux/BSD. Among the improvements: Tabs are now on top — and they move into the space in the titlebar when running in maximized mode on Windows, Full Windows 7 & Vista integration with Aero Glass, Less busy layout, improved icons and glyphs, More space for your web pages, Whole-window Personas, …& you can even choose to not have a dedicated search box for an even cleaner look, since you can enter searches directly in the location bar now, and always get a predictable search result. Firefox 3.6 vs Firefox 4 on Windows 7: Firefox 3.6 vs Firefox 4 on Mac OS X: …and since I don’t have a Linux setup available for screenshots right now, you’ll have to trust GNOME and Linux hacker Jeff Waugh on this one: More efficient menu New single-access menu for Windows 7, Vista & Linux, which was adopted by Opera (and in a similar vein, Chrome unified their two menus into one, too) soon after we put our original designs online1. And for the record, we think this is great — everyone wins, and we get a better UI in all browsers when this happens! Faster, faster, faster In addition to the impressive speed from our new JavaScript and HTML5 engines and making use of hardware acceleration, there are a lot of improvements in Firefox 4 that make the user experience much faster