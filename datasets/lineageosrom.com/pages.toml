full_description = '''[Guide] How to install Lineage Os ROM on any device [2 methods] Lineage OS android, root, (adsbygoogle = window.adsbygoogle || []).push({}); Updated Guide How to install lineageos rom 15.0 or 14.0 via twrp recovery and how to install lineageos rom via cwm recovery. This guide will show you how to install or flash lineageos rom on your android device using custom recovery like twrp or cwm. Before starting make sure to complete below task Before Starting Take care of following tasks before you proceed with flashing custom ROM: Task 1: Install USB drivers for your device on your PC. Task 2: Be sure to backup your data including Contacts, SMS / MMS, APN & MMS Settings as well as photos and videos stored on your device’s internal or external storage. Task 3: Make sure that your device is well charged. Ideally, the battery level should be around 60-80%. The more the better. Task 4: USB Debugging should be enabled on your device. Important: Most of the custom ROM will not have Google Apps in them. So, you will have to download and install GApps manually. (adsbygoogle = window.adsbygoogle || []).push({}); Done with preliminary precautionary steps? So, here’s the guide: TWRP recovery let’s you do a number of cool stuff but the whole point of having a custom recovery is to be able to flash unsigned .zip files. These .zip files could be anything from a custom kernel, boot, recovery, MODs or full custom ROMs. Let’s see how to flash a lineage os rom on any Android device using TWRP recovery. see also: How To Flash / Install GApps Via TWRP Recovery? (adsbygoogle = window.adsbygoogle || []).push({}); How to Install a Custom ROM using TWRP Recovery Download and transfer the Lineageos ROM and Gapps for linage os you wish to flash to your device’s storage. Boot your device into TWRP recovery. Select “Wipe” from TWRP main menu and do a “Swipe to Factory Reset” on the bottom of screen.└ Note: This will factory reset your device. If your custom ROM doesn’t require a factory reset, then simply skip this step. (adsbygoogle = window.adsbygoogle || []).push({}); Go back to TWRP main menu, tap on “Install” and select the Lineage os ROM .zip file and gapps for lineage os that you transferred to your device in Step 1. After selecting the .zip file, do “Swipe to Confirm Flash” on the bottom of screen to begin the custom ROM installation process. This may take some time. Once your ROM is successfully flashed, you’ll see “Wipe cache/dalvik” option, select it and then do “Swipe to wipe” on bottom of screen. Once cache & dalvik wipe completes, hit the “Back” button on-screen and then select “Reboot System” button. (adsbygoogle = window.adsbygoogle || []).push({}); #How To Enable Root In Lineage OS Using Super SU Second methods of installing lineage os rom is via CWM recovery. I you are having CWM recovery then you can follow below step to install it. How to Install Custom ROM in CWM Recovery ClockworkMod Recovery can be used to flash Lineageos rom or any other custom ROM on Android devices. There’s a “install zip from sdcard” option that will let you install a ROM zip file on your device. Being the most popular custom recovery for Android, most users prefer it over other solutions. Also, it’s fairly easy to use CWM recovery to install CM or any other ROM. Here is the step by step guide: How to Install Custom ROM using ClockworkMod (CWM) Recovery This guide can be used to install custom ROM on your Android device. Not to mention that your device should be rooted and should have CWM Recovery installed. Also, please download the custom ROM zip file that you will be installing. Some of the popular ROMs are: Lineage os rom, Modaco, AOKP, Slim ROM, MIUI. There are many other ROMs for different Android devices. You can choose the one that suits your needs the best. (adsbygoogle = window.adsbygoogle || []).push({}); How to Install Lineage rom using CWM Recovery Step 1: Download the ROM zip file and copy it on root of the SD card of your device. Also copy the GApps zip file, if you want to install Google Apps too. Download Google apps (gapps) for lineage os roms Step 2: Disconnect your device from the computer and boot it into CWM recovery mode: Switch off your device Press & hold Volume buttons + Power button to boot into bootloader mode (Note: button combination may vary depending on your device) Now select “Recovery” option using Power button to boot into CWM recovery mode (adsbygoogle = window.adsbygoogle || []).push({}); You are now in CWM recovery more. Use volume keys to navigate up & down and use Power button to select an option. Step 3 (Optional but important): Take a NANDROID backup of your ROM: From Recovery screen, select “Backup and Restore” Now select “Backup” to start the nandroid backup process. After backup is done, navigate back to main recovery screen. Step 4: Now select “wipe data/factory reset” option. When it asks for confirmation, select “Yes” to confirm data wipe process. Then navigate back to main recovery. Step 5: Now you will install the ROM zip file that you placed to SD card of your device in step 1. Follow these steps: Select option “install zip from sdcard” Then select “choose zip from sdcard” Now select the zip file that you want to install (the file that you copied onto the SD card) When it asks for confirmation, select “Yes” to start installation The custom ROM installation will now begin. Wait for it till its complete. Note: If you copied any other zip file alongside the ROM file (like GApps zip), repeat the above steps to install that zip file. Step 6: After installation is complete, navigate back to main recovery screen and select “reboot system now” option to reboot your device. Your device will now reboot. Please note that first boot may take some time, so be patient and do not interrupt the boot process. When it boots up, your device will have custom ROM installed. Same steps can be followed to install any zip file like Google Apps on your device. android, root Share 