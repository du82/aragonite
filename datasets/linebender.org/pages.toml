["https://linebender.org/blog/tmil-09"]
title = "This Month in Linebender, September 2024 - Linebender"
description = "This Month in Linebender, September 2024"
full_description = '''This Month in Linebender, September 2024 Daniel McNab, Olivier Faure, October 15, 2024 Linebender is an informal open-source organization working on various projects to advance the state of the art in GUI for the Rust programming language. Xilem Xilem is our flagship GUI project, inspired by SwiftUI. It lets you build user interfaces declaratively by composing lightweight views together, and will diff them to provide minimal updates to a retained layer. HTTP cats example (xilem#571). lens, a shorthand for a common component pattern (xilem#587). We added Views for some existing and new widgets: Grid layout (xilem#570). Images (xilem#571). The HTTP cats example. Masonry Masonry is the widget system used by Xilem. It provides a non-opinionated retained widget tree, designed as a base layer for high-level GUI frameworks. Our ongoing pass specification project has been largely implemented. That work is now in a wrapping-up stage, which has allowed Olivier to work on improving the codebase's quality in general. Some highlights of work from September: xilem#515: Removes unimplemented functionality from our text handling code. xilem#570: An implementation of a grid layout, by Jared O'Connell. xilem#550: Restores scroll requests, as used by text inputs. xilem#565: Allows widgets to implement more efficient pointer position dispatching, by new Linebender member Tom Churchman. xilem#580: Adds screen reader support for the textbox widget. Some ongoing work includes: xilem#615: Detailed accessibility information for text input and prose widgets. xilem#606: Custom client side decorations for Wayland, by Marco Melorio. xilem#605: Greater flexibility in the layout of the Image widget, by failingprovince. xilem#591: An SVG-like widget for absolute positioning, by Muhammad Ragib Hasin. Vello Vello is our GPU vector renderer. It can draw large 2D scenes with high performance, using GPU compute shaders for most of the work. The month of september included a lot of progress towards the 0.3.0 release. We no longer consider Vello to be experimental (vello#691). Please note that Vello is still an alpha, and has several known issues. An implementation of the single pass scan described last month is being created by Thomas Smith in vello#685. Parley Parley is a text layout library. It handles text layout, mostly at the level of line breaking and resolving glyph positions. Nico Burns contributed a new way to assign layout properties in parley#76. Others Daniel and Olivier's "office hours" appointments can still be booked by anyone for open-ended discussion of the ecosystem. See Daniel's schedule here. See Olivier's schedule here.'''
