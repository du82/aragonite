full_description = '''Color resources This page is an annotated list of resources about color. Libraries Rust crates Color is the Linebender crate for color palette - does more color science stuff kolor - color conversion crate with minimal API bevy_color - color representations in Bevy colstodion - practical, opinionated color management library color.js is co-developed with CSS Color, can be considered authoritative Colour for Python - quite comprehensive OpenColorIO - widely used in motion pictures Nanocolor - lightweight library (motion picture / XR focus) Standards CSS Color Level 4 Note that the editor's draft may be more up to date There's also Color Level 5 (cmyk & relative colors) Color Level 6 - contrast-color and color-layers Color HDR Color spaces Oklab by Björn Ottosson Raph's review Okhsv and Okhsl - color spaces for color picking HWB–A More Intuitive Hue-Based Color Model (PDF) ICtCp color space (Wikipedia) Jzazbz color space - Observable notebook by Jacob Rus sRGB (Wikipedia) DeviceN Color Space and Color Model - (PDF, Adobe) ICC profiles International Color Consortium Argyll Color Management System - see also qcms which is a Rust port about icc colour profiles by Neil Barstow Tone mapping ACES Central Tone Mapping Considerations for Physically-Based Rendering Tone Mapping by Matt Taylor Pedagogical work Color Spaces from Bartosz Ciechanowski handprint watercolors - art focus but deep color theory Bruce McEvoy was working on a book called "Color Experience" but it seems to have been taken down A Better Default Colormap for Matplotlib (video) - basis for viridis color scales Poynton's Color FAQ - also see related Gamma FAQ Guided Tour of Color Space by Poynton is also good Chromatic adaptation Chromatic adaptation by Bruce Lindbloom color.js documentation Chromatic adaptation by Glenn Davis (mathematical vignette) Color systems Pantone is widely used in commercial applications Freiefarbe is a free alternative based on CIE HLC Munsell color system (Wikipedia) - the great historical color system Color appearance models Algorithmic improvements for the CIECAM02 and CAM16 color appearance models The non-Riemannian nature of perceptual color space Other color management resources color-and-Color management and HDR documentation for FOSS graphics - freedesktop CG Cinematography book by Chris Brejon Chapter 1: Color management Chapter 1.5: Academy Color Encoding System (ACES) Chapter 2: Color theory'''
