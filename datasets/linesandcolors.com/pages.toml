title = "Happy Leyendecker Baby New Year! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year! Dec 31, 2006 — by cparker in Illustration There are traditions that seem as though they’ve always been in place. Some of them have origins that are obscured by time, but others can be assigned to a particular time and person. The tradition of representing the new year with the image of a baby is one of the latter. In addition to helping codify the modern image of Santa Claus (see my recent post on Illustrators’ Visions of Santa Claus), the great Golden Age illustrator J.C. Leyendecker originated the idea of using a baby to symbolize the birth of the new year. Starting with a Saturday Evening Post cover in 1906 for which he painted a winged cherub that was close to the idea, he began using an actual baby in the December, 1907 issue to welcome in 1908; and continued to represent the coming year that way on New Year’s covers of the Post into the 1940’s. Leyendecker was the Post’s major artist in the first half of the 20th Century, and was routinely given the assignments for the important major holiday issues. It was only years later that Norman Rockwell, who considered Leyendecker his artistic ideal, began to take on those duties. (See my previous post on J. C. Leyendecker.) Curtis Publishing, publishers of The Saturday Evening Post, provide a nice archive of their covers, often arranged by artist or subject, including a two page gallery of Leyendecker New Year’s Baby covers. (The images are linked to larger versions. It’s easy to miss the link to the second page at the bottom of the first.) It’s a treat to look through them, not only as great illustration, but as a fascinating chronicle of 20th Century history. Leyendecker would play with the idea of the New Year’s Baby to conceptualize the political, social and economic concerns of the day, be it stock market worries, balanced budgets or the looming shadow of war. Layendecker New Year’s Baby covers for The Saturday Evening PostLeyendecker New Years covers second pageMy previous post on J. C. LeyendeckerLeyendecker artisle and links on DT&G design Comments 4 responses to “Happy Leyendecker Baby New Year!” T.O. December 31, 2006 I’ll never tire of Leyendecker. great work, thanks ParisBreakfasts December 31, 2006 Wonderful to be reminded of such an excellent artist! Thank you Carolg C. Ousley January 1, 2007 My hero! Marty Weil January 7, 2007 I’m glad you featured this ephemera. Illustration art is often under-appreciated. I enjoy your blog and thought this was a very cool post. Thanks for featuring it. ←Previous: Annibale Carracci’s Book of Portraiture (?) Next: Sergei Bongart→"
