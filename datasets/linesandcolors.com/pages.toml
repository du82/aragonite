title = "Lines and Colors"
full_description = "Lines and Colors is a blog about painting, drawing, sketching, illustration, comics, cartoons, webcomics, art history, concept art, gallery art, digital art, artist tools and techniques, motion graphics, animation, sci-fi and fantasy illustration, paleo art, storyboards, matte painting, 3d graphics and anything else I find visually interesting. If it has lines and/or colors, it’s fair game. SearchSearch New posts are announced on: Categories 3d CGI Amusements Animation Anime & Manga Art Videos Blogroll Book Reviews Cartoons Color Comics Concept & Visual Dev. Creativity Digital Art Digital Painting Displaying Art on the Web Drawing Eye Candy for Today Gallery and Museum Art High-res Art Images Illustration Motion Graphics & Flash Museums Online Museums Outsider Art Painting Painting a Day Paleo Art Pastel, Conté & Chalk Pen & Ink Prints and Printmaking Sc-fi and Fantasy Sculpture & Dimensional Site Comments Sketching Storyboards Tools and Techniques Uncategorized Vector Art Vision and Optics Watercolor and Gouache Webcomics Archives January 2025 December 2024 November 2024 October 2024 September 2024 August 2024 June 2024 April 2024 March 2024 February 2024 January 2024 December 2023 November 2023 October 2023 September 2023 August 2023 July 2023 May 2023 April 2023 March 2023 February 2023 January 2023 December 2022 November 2022 September 2022 August 2022 July 2022 June 2022 May 2022 April 2022 March 2022 February 2022 January 2022 December 2021 November 2021 October 2021 September 2021 August 2021 July 2021 June 2021 May 2021 April 2021 March 2021 February 2021 January 2021 December 2020 November 2020 October 2020 September 2020 August 2020 July 2020 June 2020 May 2020 April 2020 March 2020 February 2020 January 2020 December 2019 November 2019 October 2019 September 2019 August 2019 July 2019 June 2019 May 2019 April 2019 March 2019 February 2019 January 2019 December 2018 November 2018 October 2018 September 2018 August 2018 July 2018 June 2018 May 2018 April 2018 March 2018 February 2018 January 2018 December 2017 November 2017 October 2017 September 2017 August 2017 July 2017 June 2017 May 2017 April 2017 March 2017 February 2017 January 2017 December 2016 November 2016 October 2016 September 2016 August 2016 July 2016 June 2016 May 2016 April 2016 March 2016 February 2016 January 2016 December 2015 November 2015 October 2015 September 2015 August 2015 July 2015 June 2015 May 2015 April 2015 March 2015 February 2015 January 2015 December 2014 November 2014 October 2014 September 2014 August 2014 July 2014 June 2014 May 2014 April 2014 March 2014 February 2014 January 2014 December 2013 November 2013 October 2013 September 2013 August 2013 July 2013 June 2013 May 2013 April 2013 March 2013 February 2013 January 2013 December 2012 November 2012 October 2012 September 2012 August 2012 July 2012 June 2012 May 2012 April 2012 March 2012 February 2012 January 2012 December 2011 November 2011 October 2011 September 2011 August 2011 July 2011 June 2011 May 2011 April 2011 March 2011 February 2011 January 2011 December 2010 November 2010 October 2010 September 2010 August 2010 July 2010 June 2010 May 2010 April 2010 March 2010 February 2010 January 2010 December 2009 November 2009 October 2009 September 2009 August 2009 July 2009 June 2009 May 2009 April 2009 March 2009 February 2009 January 2009 December 2008 November 2008 October 2008 September 2008 August 2008 July 2008 June 2008 May 2008 April 2008 March 2008 February 2008 January 2008 December 2007 November 2007 October 2007 September 2007 August 2007 July 2007 June 2007 May 2007 April 2007 March 2007 February 2007 January 2007 December 2006 November 2006 October 2006 September 2006 August 2006 July 2006 June 2006 May 2006 April 2006 March 2006 February 2006 January 2006 December 2005 November 2005 October 2005 September 2005 August 2005 A Fresh Look: Vermeer’s Girl with a Pearl Earring January 14, 2025 Hopefully — even if only for a moment — you got to see in the top two images Vermeer’s iconic painting with fresh eyes. The images are reversed left to right. It is not an uncommon practice for artists to pause in the process of working on a painting or other artwork and view the work in a mirror. This briefly provides a fresh view of the work, a contrast to the the kind of familiarity that makes it difficult to see something objectively. We can use the same effect to view images that are so culturally familiar they are difficult to see in the way we might have when first encountering them. The effect doesn’t last long; we soon become accustomed to the “new” view, but it’s nice to get a fresh view of something so familiar. I’ve included an image of the painting in its normal orientation at the bottom. Wikimedia Commons has a high resolution image of the painting, available from this page. I did the same thing back in 2006 with Da Vinci’s Mona Lisa, and in the process, I believe I gained some insight into her enigmatic smile/not smile. Girl with a Pearl Earring, Wikimedia Commons Related posts: La Gioconda (The Mona Lisa), flipped for your viewing pleasure Categories: Eye Candy for Today, Gallery and Museum Art Philip de Laszlo January 1, 2025 Hungarian born painter Philip de László, who was active in the late 19th and early 20th centuries, spent much of his life and career in the UK, where he was noted for his portraits of royalty and the wealthy. The de Lazlo Archive Trust website features information about the artist, as well as a catalogue raisonné of his work. de Lazlo Archive Trust ArtUK Wikimedia Commons Wikiart Invaluable Wikipedia Categories: Gallery and Museum Art Happy Leyendecker Baby New Year 2025! January 1, 2025 As I’ve done every New Year’s Eve since 2005, I’ll wish Lines and Colors readers a Happy New Year with one of J. C. Leyendecer’s New Year’s covers for the Saturday Evening Post, in this case marking the arrival of 1925.For more Leyendecker to while away your New Year’s day, check the list of Lines and Colors J C. Leyendecker posts at the end of this article.I wish you all a new year rich with artistic exploration and inspiration! My previous Leyendecker Baby New Year posts: Happy Leyendecker Baby New Year 2024! Happy Leyendecker Baby New Year 2023! Happy Leyendecker Baby New Year 2022! Happy Leyendecker Baby New Year 2021! Happy Leyendecker Baby New Year 2020! Happy Leyendecker Baby New Year 2019! Happy Leyendecker Baby New Year 2018! Happy Leyendecker Baby New Year 2017 Happy Leyendecker baby New Year 2016 Happy Leyendecker Baby New Year 2015 Happy Leyendecker Baby New Year 2014 Happy Leyendecker Baby New Year 2013 Happy Leyendecker Baby New Year 2012 Happy Leyendecker Baby New Year 2011 Happy Leyendecker Baby New Year 2010 Happy Leyendecker Baby New Year 2009 Happy Leyendecker Baby New Year 2008 Happy Leyendecker Baby New Year 2007 Happy Leyendecker Baby New Year (2006) My other previous J.C. Leyendecker posts: Beleaguered Leyendecker Santa Eye Candy for Today: Leyendecker turkey SEP cover Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustration Another wonderful Leyendecker Santa Claus Eye Candy: JC Leyendecker illustration for Arrow Shirt advertisement Leyendecker’s Santas More J.C. Leyendecker from Leif Peng and Roger Reed Even more Leyendecker wonderfulness, in high resolution no less J.C. Leyendecker on Illustration Art The Haggin Museum Leyendecker Collection J.C. Leyendecker; America’s “Other” Illustrator More Leyendecker and other great stuff A little Bit of Leyendecker Greatness Illustrators’ Visions of Santa Claus Thanks J.C. Leyendecker Categories: Illustration LearnFromMasters YouTube channel December 15, 2024 If, like me, you enjoy YouTube videos about art and artists, you may have come across a number of slideshow style videos showcasing the art of historic painters. In many of these, if not the majority, the creator of the videos seems compelled to add motion — panning, zooming and using transitions that flip, swipe, rotate, dissolve into blocks and otherwise try to be “entertaining”. It’s a video, so things have to move, right? While I appreciate the effort invested in gathering and presenting the images in these presentations, as soon as I realize it’s one of those, I click away in search of another. I like viewing art images whole, or with simple close crops, without them squirming around on my screen! (Sigh.) Fortunately, there are other options. One of them I enjoy is a YouTube series under the name of LearnFromMasters. The channel offers an extensive selection slideshows of varied and interesting artists that are mercifully free of unnecessary motion. They are arranged as simple straightforward slides of the full image separated by basic jump cuts. (What a concept!) In addition to the regular YouTube listing of the videos, there is a text list here of all of the videos posted to date. The channel has a Patreon account for those who wish to support the effort. The LearnFromMasters videos are engaging and plentiful enough that I will issue a Timesink Warning. LearnFromMasters, YouTube channel Text list of videos Patreon Categories: Art Videos, Gallery and Museum Art Brock Larson December 13, 2024 Brock Larson is a contemporary American painter living in Minnesota. On his website you will find landscape and still life paintings along with portrait drawings. In his landscapes, Larson often pulls us into the shadowy depths of deep woods, while at others times leading us out onto broad fields and expanses of water. Brock Larson is the son of well-known painter Jeffery T. Larson. www.brocklarson.com Categories: Gallery and Museum Art Eye Candy for Today: Carl Theodor Reiffenstein castle December 6, 2024 Weite Landschaft mit idealer rheinischer Burg (Wide landscape with an ideal Rhenish castle), Carl Theodor Reiffenstein, oil on canvas, 18 x 14 inches (45 x 36 cm) This landscape painting by the 19th century German painter is a perfect example of counterchange — the reversal of value relationships between a shape or object and the background against which it’s set. In this case the dark against light at the top of the castle becomes light against dark in the center of the base. See James Gurney’s excellent explanation of the principle in his 2008 post: Counterchange. Weite Landschaft mit idealer rheinischer Burg, Van Ham past auction Categories: Eye Candy for Today, Gallery and Museum Art 1 2 3 … 764 Next Page Relevant BlogsArt, Painting & SketchGurney JourneyUnderpaintingsArt and InfluencePainting PerceptionsOil Painters of AmericaVasari Paint POVFlying FoxUrban SketchersBento (Smithsonian)Art InconnuThe Hidden PlaceStill LifeMaking a MarkThe Art of the LandscapeExploring Color & CreativityArt ContrarianArtist A DaybeinArt Surreal Art CollectiveEye LevelDavid Dunlopp.i.g.m.e.n.t.i.u.mCultureGrrlJoaquín Sorolla blogArtists in Pastel “Painting a Day”A Painting a Day (Keiser)On Painting (Keiser)Julian Merrow-SmithKaren JurickJeffrey HayesCarol MarineAbbey RyanDaily PaintworksOther Painting Blogs Virtual Gouache LandNeil HollingsworthMarc HansonKevin MenckMarc DalessioLarry SeilerStapleton KearnsColin PageRoos SchuringHans VersfeltTitus MeeuwsRégis PettinariRené Plein AirBelinda Del PescoRobin WeissNathan Fowkes (Land Sketch)William WrayFrank SerranoStephen MagsigMichael Chesley JohnsonTwice a WeekSarah WimperisRob AdamsMichael Cole ManleyThe Dirty Palette ClubMike Manley’s Draw! Gallery Art & Illustration mix JuxtapozArtorama (RU) Illustration Howard Pyle100 Years of IllustrationBibliOdysseyIllustration ArtToday’s InspirationIllustration MundoLittle Chimp SocietyDanny GregoryR D (John MartzIllustration Friday blogMonster BrainsIllustrators & Illustrations (RU)Elwood H. SmithDaniDraws.comDesigners Who BlogiSpot Blog Sci-Fi & Fantasy The Art DepartmentBob Eggleton Illustration & Comics Drawn!Le blog de Li-An (FR)Flesk Publications (FR)Barbara Canepa (IT/FR)Parka Blogs (book reviews) Comics & Cartoons Comics BeatRobot 6Newsarama BlogComic VineComi