full_description = "Happy Leyendecker Baby New Year 2017! Dec 31, 2016 — by cparker in Illustration As I’ve done every New Year’s Eve Since 2006, I’ll wish all Lines and Colors readers a Happy New Year with a few more of J.C. Leyendecker’s terrific New Year’s babies. See that post for background on the origin of the Leyendecker New Years baby covers for the Saturday Evening Post. Images above are from a three decade run of The Saturday Evening Post covers from the early 20th century. For more, see my previous links, below. I wish you all a new year filled with beautiful, inspiring art! J.C. Leyendecker on Cover BrowserMy previous Leyendecker Baby New Year posts:Happy Leyendecker baby New Year 2016Happy Leyendecker Baby New Year 2015Happy Leyendecker Baby New Year 2014Happy Leyendecker Baby New Year 2013Happy Leyendecker Baby New Year 2012Happy Leyendecker Baby New Year 2011Happy Leyendecker Baby New Year 2010Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)My other previous J.C. Leyendecker posts:Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustrationAnother wonderful Leyendecker Santa ClausEye Candy: JC Leyendecker illustration for Arrow Shirt advertisementLeyendecker’s SantasMore J.C. Leyendecker from Leif Peng and Roger ReedEven more Leyendecker wonderfulness, in high resolution no lessJ.C. Leyendecker on Illustration ArtThe Haggin Museum Leyendecker CollectionJ.C. Leyendecker; America’s “Other” IllustratorMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanksJ.C. Leyendecker Comments 8 responses to “Happy Leyendecker Baby New Year 2017!” Sherrill January 1, 2017 Happy New Year, Charley! Thanks for all the great posts you treat us to! Martin Hoade January 1, 2017 Back at you and may your new year hold new visions of the world and new pathways from your inner eye and heart to canvas. AElle January 2, 2017 “The Bad News Is Time Flies, The Good News Is You’re The Pilot.” ― Michael Altshuler May Lines & Colors never fade away, Charley! John Simlett January 2, 2017 Thanks for a good year’s posts, Charley; here’s to the next one Patrick Connors January 6, 2017 Happy New Year to you Charley! Time and time again, Lines and Colors does an excellent job on posting & commenting on art, artists, exhibitions, and art-related topics. It is an incredible resource, a veritable treasure trove. Thank you Charley. Charley Parker January 7, 2017 Thanks, Patrick! Much appreciated. Eric Joye January 24, 2017 All the best to you Charley. 1000 thanks for relentlessly showing us great art . Take care Eric Charley Parker January 24, 2017 Thanks, Eric. Glad you’re enjoying it! ←Previous: Adoration of the Shepherds, Nicolas Maes Next: Arthur Parton→"
