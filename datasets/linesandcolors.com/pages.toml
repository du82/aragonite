["http://linesandcolors.com/2017/12/31/happy-leyendecker-baby-new-year-2018"]
title = "Happy Leyendecker Baby New Year 2018! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year 2018! Dec 31, 2017 — by cparker in Illustration As I’ve done every December 31st for the last 12 years, I’ll wish Lines and Colors readers a Happy New Year with more of J.C. Leyendecker’s wonderful Saturday Evening Post New Years covers. The brilliant American illustrator J.C. Leyendecker set our modern conception of representing the new year as a baby, with the use of a New Years baby to welcome in 1908 in the cover shown above, top. He continued the practice every year into the 1940s, usually incorporating topics of the day into his interpretation of the baby. Here’s hoping you all have a great new year, filled with lots of fantastic art and inspiration! -Charley J.C. Leyendecker on Cover BrowserMy previous Leyendecker Baby New Year posts:Happy Leyendecker Baby New Year 2017Happy Leyendecker baby New Year 2016Happy Leyendecker Baby New Year 2015Happy Leyendecker Baby New Year 2014Happy Leyendecker Baby New Year 2013Happy Leyendecker Baby New Year 2012Happy Leyendecker Baby New Year 2011Happy Leyendecker Baby New Year 2010Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)My other previous J.C. Leyendecker posts:Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustrationAnother wonderful Leyendecker Santa ClausEye Candy: JC Leyendecker illustration for Arrow Shirt advertisementLeyendecker’s SantasMore J.C. Leyendecker from Leif Peng and Roger ReedEven more Leyendecker wonderfulness, in high resolution no lessJ.C. Leyendecker on Illustration ArtThe Haggin Museum Leyendecker CollectionJ.C. Leyendecker; America’s “Other” IllustratorMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanksJ.C. Leyendecker Comments 6 responses to “Happy Leyendecker Baby New Year 2018!” Bill Marshall December 31, 2017 Happy New Year, Charley! Thank you for sharing so much that inspires so many. Bill Charley Parker January 1, 2018 Thanks, Bill! ælle January 1, 2018 To all the readers- artists and particularly our host Charley we owe so much happiness and inspiration, thank you: https://www.youtube.com/watch?v=3Uo0JAUWijM Charley Parker January 1, 2018 Thanks, ælle! David J. Teter January 3, 2018 Always (selfishly?) happy to see you pushing into a new year Charlie, Thanks! Charley Parker January 4, 2018 Thanks, David! ←Previous: Thierry Duval Next: Eye candy for Today: Edward Redfield’s Winter in the Valley→"
