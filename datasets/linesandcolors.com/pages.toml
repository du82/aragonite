title = "Happy Leyendecker Baby New Year 2019! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year 2019! Dec 31, 2018 — by cparker in Illustration As has become my tradition every December 31st for the last 13 years, I’ll wish Lines and Colors readers a Happy New Year with some of J.C. Leyendecker’s wonderful Saturday Evening Post New Years covers. American illustrator J.C. Leyendecker set our modern conception of representing the new year as a baby, with the use of a New Years baby to welcome in 1908. He continued the practice every year into the 1940s, usually incorporating topics of the day into his interpretation of the baby. Here’s hoping you all have a great new year, filled with lots of great art and inspiration! -Charley New Year’s Babies on Saturday Evening PostJ.C. Leyendecker on Cover BrowserMy previous Leyendecker Baby New Year posts:Happy Leyendecker Baby New Year 2018!Happy Leyendecker Baby New Year 2017Happy Leyendecker baby New Year 2016Happy Leyendecker Baby New Year 2015Happy Leyendecker Baby New Year 2014Happy Leyendecker Baby New Year 2013Happy Leyendecker Baby New Year 2012Happy Leyendecker Baby New Year 2011Happy Leyendecker Baby New Year 2010Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)My other previous J.C. Leyendecker posts:Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustrationAnother wonderful Leyendecker Santa ClausEye Candy: JC Leyendecker illustration for Arrow Shirt advertisementLeyendecker’s SantasMore J.C. Leyendecker from Leif Peng and Roger ReedEven more Leyendecker wonderfulness, in high resolution no lessJ.C. Leyendecker on Illustration ArtThe Haggin Museum Leyendecker CollectionJ.C. Leyendecker; America’s “Other” IllustratorMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanksJ.C. Leyendecker Comments 2 responses to “Happy Leyendecker Baby New Year 2019!” Ælle January 3, 2019 110 Years later Leyendecker Baby is still knocking and not a year older. https://www.youtube.com/watch?v=lb0dBVWozRo Thanks to you too, Charley. Tim Langenderfer January 6, 2019 Happy New Year ! And thank you for this blog. It is a lot of work and you’ve been so generous for so many years! There is so much high quality art info out there but you have such a variety of art styles, time periods, genres, ‘isms, types, etc. that you share with such thoughtful analysis and commentary. There is nothing else out there like what you share. I thank you and wish you the very best! ←Previous: Berthe Morisot Next: Eye Candy for Today: Constable graphite drawing→"
