full_description = "Happy Leyendecker Baby New Year 2008! Dec 31, 2007 — by cparker in Illustration As I mentioned in my Happy Leyendecker Baby New Year! post from last year, master illustrator J.C. Leyendecker is responsible for initiating the tradition of representing the New Year visually as a baby. Here are a few more of his wonderful New Years babies from the cover of The Saturday Evening Post. Their archive is here and here. Happy New Year! SEP Leyendecker Baby covers, and page 2My previous posts with additional links and resources for J.C. Leyendecker:A little Bit of Leyendecker GreatnessHappy Leyendecker Baby New Year!Illustrators’ Visions of Santa ClausJ.C. LeyendeckerThanks Comments 3 responses to “Happy Leyendecker Baby New Year 2008!” Jason Waskey December 31, 2007 Happy Leyendecker Baby New Year Mr. Parker! Izzat Sajdi December 31, 2007 Hello Friend, Would it be OK if I would put your link with my favourites links? Happy New Year Izzat Sajdi http://www.izzat-sajdi.blogspot.com Dr BLT January 2, 2008 Great post! Here are a few other New Year songs for 2008: Spread Some New Year Cheer Dr BLT copyright 2007 Frosty Rock Records http://www.drblt.net/music/SpreadDemo2.mp3 *Don’t Fear the New Year* Dr BLT altered cover of Blue Oyster Cult classic http://www.drblt.net/music/DontFearDem2.mp3 Here’s one for Dan Fogelberg, who recently passed away: *It’ll Never Be the Same Old Lang Syne * Dr BLT copyright 2007 Frosty Rock Records http://www.drblt.net/music/SameOldDem.mp3 It’ll Never Be the Same Old Lang Syne It’ll Never be the same Auld Lang Syne words and music by Dr BLT Copyright Â© Frosty Rock Records the paper said that you were dead that you had slipped away and the snow that fell upon the pages soon “turned into rain” chorus: and I realized it would never be the Same Auld Lang Syne and I realized that every year you’ll be missed and Christmastime December 19th just a day before my Starbucks show I heard the news and wrote this song about the songs you sewed your tender songs were sewn into our hearts and in our souls and Auld Lang Syne won’t be the same without your rock n roll and I realized it would never be the Same Auld Lang Syne and I realized that every year you’ll be missed and Christmastime time slips away and so did you you slipped away too soon and every year at Christmastime we’ll sing your Christmas tune and I realized it would never be the Same Auld Lang Syne and I realized that every year you’ll be missed and Christmastime ←Previous: Asaf Hanuka Next: Project Gutenberg eBooks, Masters of Water-colour Painting→"
