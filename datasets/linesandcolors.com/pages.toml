["http://linesandcolors.com/2020/12/24/beleaguered-leyendecker-santa"]
title = "Beleaguered Leyendecker Santa – Lines and Colors"
full_description = "Beleaguered Leyendecker Santa Dec 24, 2020 — by cparker in Illustration Another wonderful Saturday Evening Post Santa Claus cover by the brilliant American illustrator J.C. Leyendecker, who I think played a major role in forming our modern image of the Jolly One. Here, he is portrayed as not so jolly as he fends off the unwanted attention of the house’s stalwart defender, who apparently doesn’t recognize “Santa” under his costume and strap-on beard as he attempts to put up decorations. This illustration from Leyendecker, who worked primarily in the early part of the 20th century was reprinted here on a 1993 issue. I don’t know the date of its original publication. The only large copy of this image I could find was on Pinterest. The Pinterest post is here, the image itself is here. Leyendecker SEP cover December ‘93, from this Pinterest postRelated PostsLines and Colors search: Santa ClausLines and Colors search: JC Leyendecker ←Previous: Eye Candy for Today: Asano Takeji woodblock print Next: Adoration of the Shepherds, Matthias Stom→"
