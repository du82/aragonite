title = "Happy Leyendecker Baby New Year 2016! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year 2016! Dec 31, 2015 — by cparker in Illustration As I’ve done every New Year’s Eve for the past 10 years, I’ll wish all Lines and Colors readers a Happy New Year with a few more of J.C. Leyendecker’s terrific New Year’s babies. These are from a three decade run of The Saturday Evening Post covers from the early 20th century. For more, see my previous links, below. I hope your crystal ball reveals a new year filled with art and inspiration! J.C. Leyendecker on Cover BrowserMy previous Leyendecker Baby New Year posts:Happy Leyendecker Baby New Year 2015Happy Leyendecker Baby New Year 2014Happy Leyendecker Baby New Year 2013Happy Leyendecker Baby New Year 2012Happy Leyendecker Baby New Year 2011Happy Leyendecker Baby New Year 2010Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)My other previous J.C. Leyendecker posts:Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustrationAnother wonderful Leyendecker Santa ClausEye Candy: JC Leyendecker illustration for Arrow Shirt advertisementLeyendecker’s SantasMore J.C. Leyendecker from Leif Peng and Roger ReedEven more Leyendecker wonderfulness, in high resolution no lessJ.C. Leyendecker on Illustration ArtThe Haggin Museum Leyendecker CollectionJ.C. Leyendecker; America’s “Other” IllustratorMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanksJ.C. Leyendecker Comments 7 responses to “Happy Leyendecker Baby New Year 2016!” Sherrill December 31, 2015 These are great, Charley! Thanks for another great year of posts and I look forward to more in the upcoming year! Happy New Year to you! David J Teter December 31, 2015 Happy New Year Charley! Thanks for another year of posts and those special finds you always manage to dig up. A lot our inspiration comes from them! tb January 1, 2016 Happy New Year, Charley! Looking forward to all the new posts. Thanks for the hard work! Bill Carman January 1, 2016 Happy New year Charley. Thanks for all the joy. Carl January 7, 2016 Thank you for all the Leyendeckers! Enzo del Brocco January 2, 2017 I recently saw a revisited “2017” edition of Leyndecker’s Saturday Evening Post cover of December 27, 1930…”Forging a New Year”. Have you seen it and would you now who the artist is..?? Charley Parker January 2, 2017 I haven’t seen the version you mention, Enzo. I searched briefly, but didn’t find it. For the benefit of other readers, the original Leyendecker painting of “Forging a New Year” referred to shows the baby forging the “1” of year 1931, as seen on this page: https://www.nrm.org/2011/12/happy-new-year-baby/ ←Previous: William Logsdail Next: Eye Candy for Today: Henri Harpignies’ View of Moulins→"
