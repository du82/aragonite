["http://www.linesandcolors.com/2006/11/25/j-c-leyendecker"]
title = "J. C. Leyendecker – Lines and Colors"
full_description = "J. C. Leyendecker Nov 25, 2006 — by cparker in Illustration If you were to ask most people to name the most successful American illustrator of the first half of the 20th Century, who was a classically trained artist and master craftsman, who was in large part responsible for the popular image we have of Santa Claus, who created the notion of using a baby to represent the New Year in illustrations, whose productive career spanned 50 years, who basically invented the look of 20th Century magazine cover design, and who painted more Saturday Evening Post covers than any other artist — the answer would invariably be “Norman Rockwell”, an answer that would just as invariably be wrong. In fact, this is a description of Joseph Christian Leyendecker, whose position of relative modern obscurity compared to Rockwell just boggles my mind. Leyendecker was a fantastic illustrator whose paintings are marvels of design, draughtsmanship and the beautifully controlled application of color. At a time when illustrators of his stature were treated like current day rock stars, Leyendecker led a very private life, perhaps to keep his relationship with Charles Beach, his model, manager, assistant and companion, out of the public eye. His creations became stars in their own right, though. Leyendecker’s most famous illustrations were the series he created for Arrow Shirts featuring the “Arrow Collar Man”, an elegantly dapper guy who received thousands of fan letters and marriage proposals from swooning women, and who set standards for what was considered a masculine ideal at the time (sort of a male version of the Gibson Girl). The campaign was notable as being one of the first to deliberately sell a “lifestyle” instead of just a product. Leyendecker also set new standards for illustration art. He and his brother Frank X. Leyendecker, also a terrific and under-appreciated illustrator, studied in Paris at the famed Académie Julian when William Bouguereau, the Academician’s Academician and a superb painter, was its director. They attracted much attention even then as talented art students among the best in Europe, in sharp contrast to their current lack of attention. Frank receives even less attention than Joseph, apparently in his brother’s shadow in posterity as well as in life. Norman Rockwell was a great admirer of Leyedecker, who he considered the ideal for which he aimed when he began doing Post covers. He eventually became friends with the Leyendecker brothers and a chapter in his autobiography is one of the few personal accounts that exist from those who knew them. Leyendecker had a tremendous impact on other illustrators. His work is dazzling in its technical proficiency, beautifully composed and designed, and drawn with the kind of flair and refined skill that only comes to the best of the best. He would make the application of paint (supposedly with a secret proprietary oil painting medium) appear as part of the design, with strokes of color defining the form in his paintings the way hatching is used in drawings, and often allowing parts of the underpainting show through. He was also a genius for finding “the straight within the curved”, and his figures have a sharp, crisp geometry that makes them really snap. Seemingly simple things like folds in cloth became wonders of painted design, zig-zagging valleys of carefully controlled color, highlighted with those amazing strokes of color hatching. Leyendecker reportedly worked in stages, creating many small-scale studies from which he would then construct the whole using the traditional technique of “squaring up” to transfer to the larger canvas. The American Art Archives site has a great page of his studies that is not to be missed by anyone interested in the techniques of one of the great illustrators. I mentioned Leyendecker in my post on Thanksgiving two days ago and Shane White left a comment about a current Leyendecker show I wasn’t aware of. For those fortunate enough to live within reach, there is a Leyendecker exhibit titled J. C. Leyendecker: America’s “Other” Illustrator, at The Haggin Museum in Stockton, California that continues through the end of December. J.C Schau’s monograph J. C. Leyendecker (cover shown at left, bottom) is long out of print, as is The J. C. Leyendecker Collection: American Illustrators Poster Book by Frederic B. Taraba, though you may be able to find them with used book searches through Amazon and elsewhere. There is a good chapter on Leyendecker in Susan E. Meyer’s America’s Great Illustrators, a terrific book that can be found used for under $15. If nothing else, look for them in libraries so you can get a feeling for how great his work looks in print. I’ve assembled what resources I can find for you below. American Art Archives is the best, but I would love to know of others I may have missed. Maybe if enough interest is generated from the show, and a little buzz gets going on the web, we might be able to convince a publisher to cough up a new book on this fantastic and amazingly underappreciated artist. J. C. Leyendecker on American Art ArchivesJ. C. Leyendecker Studies on American Art ArchivesFrank X. Leyendecker on American Art ArchivesThe Haggin MuseumReview of show with images from Louis Gonzales’ blogForum post with images on ConceptArt.orgLeyendecker images on labazov (blog)Saturday Evening Post archive of Leyendecker coversIllustrated bio on Bud Plant Illustrated BooksPost with three images on KuvituskirhahyllyArtcyclopedia Comments 11 responses to “J. C. Leyendecker” J Scoutten November 26, 2006 Leyendecker is one of my favorites. I have the Schau book mentioned above. It’s a treasure. Carlos November 26, 2006 Very nice articles about Leyendecker! I am a great fan, and have to agree that is hard to find information about him. Thanks for all the blog posts! Your text are enlightening. hai November 26, 2006 Didn’t Alex Ross use the last pic as reference for his Joker dancing with Harlequinn painting? I vaguely remember so… but darn memory implants. =shane white= November 27, 2006 Another great Leyendecker resource. http://www.americanartarchives.com/leyendeceker,jc_studies.htm Corbin Hollis Choate November 27, 2006 A true giant in any era. I highly recommend the Leyendecker DVD. You’ll be able to freeze each painting frame by frame and study them in close detail. It’s transcendant. T.O. November 27, 2006 Leyendecker is better than Rockwell, imho. I find it interesting that he never used photo reference. He always relied on his studies when he created his illustrations. C F July 16, 2007 Check out the NMAI(national museum of american illustrators. Just got back from New port RI and saw many Leyendecker origionals. This place is a treasure. And thaks for this info too! its great. Ponholio Corderbrero October 11, 2010 Who’s Rockwell? He was a good photographer and rocked the camera luceida,but an artist? Paint by numbers boy with the camera eye…. todd zalewski January 18, 2011 Ponholio Corderbrero, my friend. You need to become acquainted with Rockwell’s work from 1920’s to the end of the 1930’s. ALL of his work was painted from life/ live models during that time. It wasn’t until he moved from New Rochelle that he used the Photograph. AND his work during that time(1922- 1939) is outstanding, Check out the painting “Peach Crop” as an example. THICK brushwork, visible underpainting. Painted from life… Ponholio January 1, 2012 Thank you Todd for the complimentary title… Being a freak for J.C.,great artists of that era and Norman Perceval have come into the range,so I’m very familiar with his works.Compare the two to see who was the talent. Rockwell’s painting of motorists at the Greenfield Village museum is my fave-no doubt a result of lensed models.Consider the perspective? Peruse the recent book concerning NR and his love of photography.The line from Leyendecker,”Are you an artist or a photographer?” is appropo Leyendecker the Master,Rockwell the fan who watched from the train station,moved into the same neighborhood and sought the acceptance of the great one… danner james January 28, 2013 Both Rockwell and Leyendecker were great illustrators; two of my personal favorites. The two men were friends not competitors. They didn’t need to be enemies. They were both wildly successful and any back-handed comments about either of these two only raises the same question one biographer of a Rockwell asked: if they are not a threat to you, why do you need to find a way to discredit them? There are many bad painters to insult in local galleries everywhere. Why attempt to disqualify and dismantle two such wonderful and proven masters of illustration? Jealousy. If they truely sucked, it wouldn’t bother the people who critize them or slam one artist over the other. We attack when we feel threatened. Personally, they INSPIRE me to better my own work. Danner James ←Previous: Evgeny and Lydia Baranov Next: MUVA→"
