["http://linesandcolors.com/2020/12/31/happy-leyendecker-baby-new-year-2021"]
title = "Happy Leyendecker Baby New Year 2021! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year 2021! Dec 31, 2020 — by cparker in Illustration As I’ve done every New Year’s Eve for the past 15 years, I’ll wish all Lines and Colors readers a Happy New Year with another of J.C. Leyendecker’s terrific New Year’s Baby covers for the Saturday Evening Post. Equipped with a pickaxe and shiny lunchpail, our 1921 Leyendecker baby seems ready to get to work in the new year. Let’s hope that’s the case for the rest of us in 2021. This is the image on the Saturday Evening Post website. There is a larger one here, from this post on Mr. Magazine. See my 2006 post for background on the origin of the Leyendecker New Years baby covers for the Saturday Evening Post. No matter what else happens, I wish you all a new year filled with beautiful, inspiring art! Image on Saturday Evening Post websiteLarge image on Mr. MagazineNew Year’s Babies on Saturday Evening PostJ.C. Leyendecker on Cover BrowserMy previous Leyendecker Baby New Year posts:Happy Leyendecker Baby New Year 2020!Happy Leyendecker Baby New Year 2019!Happy Leyendecker Baby New Year 2018!Happy Leyendecker Baby New Year 2017Happy Leyendecker baby New Year 2016Happy Leyendecker Baby New Year 2015Happy Leyendecker Baby New Year 2014Happy Leyendecker Baby New Year 2013Happy Leyendecker Baby New Year 2012Happy Leyendecker Baby New Year 2011Happy Leyendecker Baby New Year 2010Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)My other previous J.C. Leyendecker posts:Beleaguered Leyendecker SantaEye Candy for Today: Leyendecker turkey SEP coverEye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustrationAnother wonderful Leyendecker Santa ClausEye Candy: JC Leyendecker illustration for Arrow Shirt advertisementLeyendecker’s SantasMore J.C. Leyendecker from Leif Peng and Roger ReedEven more Leyendecker wonderfulness, in high resolution no lessJ.C. Leyendecker on Illustration ArtThe Haggin Museum Leyendecker CollectionJ.C. Leyendecker; America’s “Other” IllustratorMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanksJ.C. Leyendecker Comments 7 responses to “Happy Leyendecker Baby New Year 2021!” Tim Langenderfer January 2, 2021 Thank you for all of the years of wonderful, insightful, thoughtful posts. I’ve gotten to used to instagram this past year. Instagram serves incredible appetizers but you have been serving complete and satisfying meals. I was glad to see your posts on Instagram that reminded me of your blog. Visiting here more often is one of my healthy New Year’s resolutions! Charley Parker January 4, 2021 Thanks, Tim. I try to encourage folks to pull their attention out of social media to indulge in some more extensive info & images when I can. Glad you’re enjoying the “meals”! I’m going to try to update more often this year than I could last year. tudza January 3, 2021 A fresh new start on some black lung disease. With luck the pickaxe doesn’t mean he’s going down the mines. Charley Parker January 4, 2021 Thanks, tudza. Someone pointed out that this marked the end of a mining strike. Ryan Compton January 18, 2021 What will you do when you run out of Leyendecker New Year’s covers? Charley Parker January 18, 2021 Cry. manu January 22, 2021 I wish you a very good year, and I thank you for your work of making this great blog for 15 years. it’s always a joy to come here see all this beautiful artworks. ←Previous: Fanny Churberg (Update) Next: Valentine Cameron Prinsep→"
