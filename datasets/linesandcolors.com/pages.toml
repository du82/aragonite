["http://linesandcolors.com/2022/12/31/happy-leyendecker-baby-new-year-2023"]
title = "Happy Leyendecker Baby New Year 2023! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year 2023! Dec 31, 2022 — by cparker in Gallery and Museum Art As I’ve done every New Year’s Eve for the past 17 years, I’ll wish Lines and Colors readers a Happy New Year with one of J. C. Leyendecer’s New Year’s covers for the Saturday Evening Post, in this case marking the arrival of 1923. American illustrator J.C. Leyendecker first represented the new year as a baby (or occasionally a cherub) on the cover of the Saturday Evening Post for the New Year’s in 1906. Over the thirty odd years following, his New Year’s covers made the idea into one of our cultural icons. The covers were themed in keeping with major events likely to impact the coming year. In this case — as far as I can determine from the figure draped with a banner representing Europe, with a treaty in his back pocket — marking the impending signing of the The 1923 Treaty of Lausanne, the last major peace treaty at the end of WWI. I wish you all a bounty of artistic delights and inspiration, whether found in the existing art of the past and present, or in the creation of new art in the coming year! My previous Leyendecker Baby New Year posts:Happy Leyendecker Baby New Year 2022!Happy Leyendecker Baby New Year 2021!Happy Leyendecker Baby New Year 2020!Happy Leyendecker Baby New Year 2019!Happy Leyendecker Baby New Year 2018!Happy Leyendecker Baby New Year 2017Happy Leyendecker baby New Year 2016Happy Leyendecker Baby New Year 2015Happy Leyendecker Baby New Year 2014Happy Leyendecker Baby New Year 2013Happy Leyendecker Baby New Year 2012Happy Leyendecker Baby New Year 2011Happy Leyendecker Baby New Year 2010Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)My other previous J.C. Leyendecker posts:Beleaguered Leyendecker SantaEye Candy for Today: Leyendecker turkey SEP coverEye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustrationAnother wonderful Leyendecker Santa ClausEye Candy: JC Leyendecker illustration for Arrow Shirt advertisementLeyendecker’s SantasMore J.C. Leyendecker from Leif Peng and Roger ReedEven more Leyendecker wonderfulness, in high resolution no lessJ.C. Leyendecker on Illustration ArtThe Haggin Museum Leyendecker CollectionJ.C. Leyendecker; America’s “Other” IllustratorMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanksJ.C. Leyendecker Comments 4 responses to “Happy Leyendecker Baby New Year 2023!” Thierry Leyva January 1, 2023 Happy New Year !! Looking forward to your interesting posts in 2023. Tatyana January 1, 2023 Consistency! From the artist if not politicians. Happy New Year, Charley! Let’s hope for consistency of art and inspiration. Angus January 1, 2023 Wishing you the very same and what a lovely wish it is!! Tim Langenderfer February 21, 2023 Thank you! Not only for this post but for all of the years of thoughtful commentary on the art you’ve very thoughtfully selected. One of my resolutions for this year is to visit this blog at least weekly, but it is already the eighth week of the year before I get around to visiting. ←Previous: Eye Candy for Today: DeCamp’s Blue Mandarin Coat Next: Eugen Jettel→"
