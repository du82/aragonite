["http://linesandcolors.com/2015/11/26/eye-candy-for-today-j-c-leyendecker-pilgrim-and-football-player-illustration"]
title = "Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustration – Lines and Colors"
full_description = "Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustration Nov 26, 2015 — by cparker in Eye Candy for Today, Illustration Pilgrim and Football Player, cover illustration for The Saturday Evening Post, November 24, 1928, J. C. Leyendecker This is on the website of the Norman Rockwell Museum’s Rockwell Center for American Visual Studies. The page has fascinating information both about the origins of the association of American Football with the holiday of Thanksgiving, and about Leyendecker’s use of Augustus Saint-Gaudens’ sculpture of a pilgrim as his model for the pilgrim figure. In my many Lines and Colors posts about the brilliant American illustrator, J.C. Leyendecker, I’ve often pointed out my admiration for his ability to combine solid academic draftsmanship with a confident looseness in his rendering. Plus, I never tire of the way he spots his highlights. Pilgrim and Football Player, Rockwell CenterMy previous posts about J.C. Leyendecker Comments 2 responses to “Eye Candy for Today: J.C. Leyendecker Pilgrim and Football Player illustration” Patrick Connors November 27, 2015 Hello Charley, Thank you for the wonderful and auspicious serving of “Eye Candy” for Thanksgiving. Also, appreciated the mention of Augustus Saint- Gaudens’ original model for Leyendecker’s Pilgrim. [For your Philadelphia region readers they can visit one version of that statue, there are about 20 versions throughout the country of the original displayed in Springfield, Mass., at the beginning of the River Drive across from the “Schuylkill Navy” Boathouses.] Your insightful comments on Leyendecker’s thematic re-interpretation, form concept & execution, and just his delight in the making of art are a pleasure to read. Jo December 4, 2015 Gets me everytime. That Leyendecker sigh. ←Previous: Lost Property Next: Vilhelm Hammershøi→"
