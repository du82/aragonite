title = "Happy Leyendecker Baby New Year 2015! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year 2015! Dec 31, 2014 — by cparker in Illustration As I’ve done every New Year’s Eve for the past nine years, I’ll wish all Lines and Colors readers a Happy New Year with more of J.C. Leyendecker’s terrific New Year’s babies from early 20th century covers for The Saturday Evening Post. Have a wonderful, art-filled year! J.C. Leyendecker on Cover BrowserMy previous Leyendecker Baby New Year posts:Happy Leyendecker Baby New Year 2014Happy Leyendecker Baby New Year 2013Happy Leyendecker Baby New Year 2012Happy Leyendecker Baby New Year 2011Happy Leyendecker Baby New Year 2010Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)My other previous J.C. Leyendecker posts:Another wonderful Leyendecker Santa ClausEye Candy: JC Leyendecker illustration for Arrow Shirt advertisementLeyendecker’s SantasMore J.C. Leyendecker from Leif Peng and Roger ReedEven more Leyendecker wonderfulness, in high resolution no lessJ.C. Leyendecker on Illustration ArtThe Haggin Museum Leyendecker CollectionJ.C. Leyendecker; America’s “Other” IllustratorMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanksJ.C. Leyendecker Comments 7 responses to “Happy Leyendecker Baby New Year 2015!” mark December 31, 2014 A happy, peaceful new year to all. Thanks for the postings. I just made my first pizza and buffalo wing, online order from my favored carryout. I wounder how Mr. Leyendecker would have interpreted our newfangled society for us..judging by these works of these vastly different American eras I believe he would have done us well. Thanks again, Mark P Brian Harrison December 31, 2014 Thanks Charley, for another wonderful year of art 🙂 Looking forward to another year already !! Have a safe, but happy New Year :)) Sherrill January 1, 2015 Looking forward to another great year of posts from you! Thank you and Happy New Year! Jeff Hayes January 1, 2015 Happy New Year, Charley! Thanks for all of your work in continuing to make this excellent resource available to us. Charley Parker January 2, 2015 Thanks, all, for the good wishes. I’m looking forward to digging up lots of great art to share with everyone in 2015. Smaragdine January 3, 2015 Best wishes to you too and thanks for all that you share 🙂 Best regards. Charley Parker January 3, 2015 Thanks! ←Previous: Chris Riddell Next: Emilio Sánchez-Perrier→"
