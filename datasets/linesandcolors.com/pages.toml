["http://www.linesandcolors.com/2009/12/31/happy-leyendecker-baby-new-year-2010"]
title = "Happy Leyendecker Baby New Year 2010! – Lines and Colors"
full_description = "Happy Leyendecker Baby New Year 2010! Dec 31, 2009 — by cparker in Illustration In what is becoming something of a tradition, I’ll wrap up the year with four more Saturday Evening Post covers from the early 20th Century featuring New Year’s babies from J.C. Leyendecker, the illustrator who started the practice of representing the new year as a baby. For more on the history of Leyendecker’s New Year’s babies, see my post Happy Leyendecker Baby New Year from 2006. I’ve also listed below some of my previous posts about this amazing illustrator, one of the all time greats, who should be much better known than he is today. The good news is that after many years without an in-print book of Leyendecker’s work, J.C. Leyendecker by Laurence S. Cutler and Judy Goffman Cutler was published last year and is still available. I hope you all have a new year filled with great art, old and new! -Charley SEP Leyendecker Baby covers, and page 2My previous posts with additional links and resources for J.C. Leyendecker:Happy Leyendecker Baby New Year 2009Happy Leyendecker Baby New Year 2008Happy Leyendecker Baby New Year 2007Happy Leyendecker Baby New Year (2006)J.C. LeyendeckerMore Leyendecker and other great stuffA little Bit of Leyendecker GreatnessIllustrators’ Visions of Santa ClausThanks Comments 7 responses to “Happy Leyendecker Baby New Year 2010!” James Gurney December 31, 2009 Thanks, Charley, for all your fascinating posts, and all the best to you in 2010. Charley Parker December 31, 2009 Thanks. James. Thank you for your great year of posts as well, not to mention the terrific book that grew out of them. Dave Dubé December 31, 2009 I didn’t find you until late in 2009, Charley, but I’m really looking forward to following you in 2010! Keep it up! Charlotte painting December 31, 2009 Happy New year!!! Love your blog! adebanji alade December 31, 2009 Always enjoy being here! Wishing you a prosperous New Year! Dee January 3, 2010 Great Post, Correct me if I’m wrong but wasn’t Leyendecker – Norman Rockwell’s mentor and hero? Since Rockwell is my hero I guess I have look up to and Thank Mr. Leyendecker for his work. Charley Parker January 4, 2010 You’re correct. In fact, Rockwell’s autobiography is one of the few first-person accounts we have of Leyendecker. ←Previous: David Levine Next: John Berkey (update)→"
