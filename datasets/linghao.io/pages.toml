["https://linghao.io/posts/noogler-learning-effective-engineer"]
title = "Grow @ Google 01: Noogler 成长的必经之痛"
description = "Grow @ Google 是一个基于我在 Google 的经历来讨论如何成为更高效的软件工程师的系列。本期的话题包括：建立高效的反馈回路；当心不假思索便做下的假设；主导和推动你所负责的项目。"
full_description = "在「大厂」工作的体验就像当一颗螺丝钉？读过很多软件工程的书却仍会犯下里面的典型错误？感到自己工作效率低下却不知如何改进？要成为一名高效的软件工程师，在理论和实践之间是存在不小的距离需要我们通过广泛学习、勇敢试错和不断反思去跨越的。在 Grow @ Google 这个系列中，我会结合自己在 Google 的工作经历来分享一些经验和教训，帮助大家少走一些弯路。系列中的其他文章请见： 我在 Google 参与的第一个项目主要是修改和运行一个 C++ pipeline 来 backfill1 几年的用户数据。过程如下： 许多人将作为 entry level 工程师在 Google 工作的体验形容为当一颗螺丝钉，而我的感受则是自己所扮演的角色更接近于润滑油一般的存在。一言以蔽之，我所发挥的是「在一个巨大的组织里促成一件事情」的作用。作为一个新人，我需要频繁地借助来自他人的反馈。 为了验证 pipeline 生成的数据是否正确，我们将其与其它数据源进行比较。由于之前存在过的一些 bug 的影响，它们之间并不是 100% 一致的。我们投入了大量的时间和精力去调查数据的不一致，最终找到了超过 10 个 bug，并确认了大约 99.5% 的数据是一致的。 由于部分不一致的数据是对用户可见的，我们需要得到来自 PM 的 approval。这里我们犯的错误是没有及时跟 PM 沟通。后来我们了解到，他们所关心的是在更高的颗粒度上数据之间的差异有多大，并且更侧重于那些用户频繁查询的数据。也就是说，我们闷头所做的调查有很大一部分是无用的。 一个项目往往牵扯到承担不同职能的 stakeholder：工程师、产品经理、销售、客服等等。不同角色的思维模式相去甚远，所关心的问题也往往有比较大的出入。及时 involve 相关的 stakeholder 并明确共识，对个人和整个团队的生产力都有帮助。"
