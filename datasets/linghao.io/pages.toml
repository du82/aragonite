["https://linghao.io/notes/steven-pinker-linguistics-style-writing"]
title = "Steven Pinker on Linguistics, Style and Writing"
description = "Notes on Steven Pinker's lecture on Linguistics, Style and Writing."
full_description = "Not true in general: good people can write bad prose. E.g. scientist who have nothing to hide and no need to impress. Corollary 1: minimize apologizing. E.g. The problem of language acquisition is extremely complex. It is difficult to give precise definitions of the concept of 'language' and the concept of 'acquisition' and the concept of 'children'. There is much uncertainty about the interpretation of experimental data and a great deal of controversy surrounding the theories. More research needs to be done. Avoids metaconcepts: approach, assumption, concept, condition, context, framework, issue, level, model, paradigm, perspective, process, role, strategy, tendency, variable Present some bits of information to the reader before others (affects how the information is absorbed) The passive is the better construction when the done-to is currently the target of the reader's mental gaze It's all right to split an infinitive in the interest of clarity. Since clarity is the usual reason for splitting, this advice means merely that you can split them whenever you need to. -- Merriam-Webster Unabridged"
