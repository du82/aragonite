["https://linghao.io/posts/grow-at-google-03"]
title = "Grow @ Google 03: 文档意识与培养新人"
description = "Grow @ Google 是一个基于我在 Google 的经历来讨论如何成为更高效的软件工程师的系列。本期的话题包括：培养文档意识和能力；培养新人的心得和益处。"
full_description = "本文将是短期内 Grow at Google 系列的最后一篇文章，可能也会是近期以软件工程师的自我成长作为话题的最后一篇。 在《Noogler 成长的必经之痛》、《「能用就行」还远远不够》、《「程序员」和「软件工程师」是一回事吗？》这三篇文章中，笔者围绕「如何成为一个更好的软件工程师1」谈了不少话题。包括这些文章在内，本博客绝大部分文章的创作灵感都来自于笔者在学习工作中收获的经验和教训。而随着工作的逐渐稳定，笔者自身的成长速度已经跟不上理想的博客更新速度了。笔者在目前能言之有物的内容，基本都已经分享过了。其中一些核心的老生常谈话题也已经反复出现，比如缩短 Feedback Loop 等。 简而言之，过去那种写博客的思路已经无以为继了。在这篇较为简短的文章之后，笔者将开始尝试把写作重心转移到专注某个单一话题的文章上。话题也会逐渐多样化，包括许多技术之外的内容。敬请期待。 这里所说的文档指的不是 API / 库 / 框架的文档（documentation），而是最普遍意义上的文档（document）。以 Google 为例，我们在工作中大量使用 Google Docs 进行沟通和协作。在开始一个新项目时，产品经理们经常要写 Product Requirements Document (PRD)，而工程师们则要写 Design Doc (DD)2。有时我们也会针对更小的话题写一些 One-pager（实际并不一定只有一页）。 当然，具体采取什么形式和使用哪种工具是次要的。笔者在这里想要呼吁的是：在条件合适的前提下，希望有更多的工程师能够具备使用文档进行沟通和协作的意识和能力。 从半年前开始，笔者承担起了 mentor 刚加入我们团队的新人的责任。总的来说，这是一种不错的体验 manager 的部分职责的方式。笔者在这个过程中积攒了一些心得： 与此同时，笔者也体会到了培养新人的一系列益处。希望有更多的工程师能够愿意花费时间按和精力去培养新人。"
year_published = 2021
