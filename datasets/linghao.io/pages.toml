["https://linghao.io/notes/david-perell-writing-online"]
title = "David Perell 关于在线写作的建议"
description = "David Perell 在《The Ultimate Guide to Writing Online》一文中阐述了在线写作的诸多好处，并给出了大量有操作性的建议。本文是对这些建议的精简摘录版本。"
full_description = "David Perell 在《The Ultimate Guide to Writing Online》一文中阐述了在线写作的诸多好处，并给出了大量有操作性的建议。本文是对这些建议的精简摘录版本。 首先，你要购买自己的域名，搭建自己的网站。你当然也可以借助 Medium 之类的平台来推广自己的文章，但放弃对内容的控制是不明智的。一定要有属于自己的网站！ 从零开始运营博客是一个先有鸡还是先有蛋的问题：在拥有足够数量的读者之前，你并不知道应该着重创作怎样的内容；而没有足够的优质内容，你又很难吸引大量读者。一个解决方案是从甄选他人的优质内容做起，可以有两种做法： 你可以把这个列表发给你选择的作者或是话题领域内的专家，说不定他们会将其分享给自己的读者，从而为你带来流量。 出于种种原因（借口），许多人在一开始会畏惧下笔。跨越这个阶段最好的办法是 develop a bias towards action：优先注重于数量而不是质量。如果能坚持每周发表一篇文章，一年以后你就拥有足够的数据来弄明白究竟应该创作什么内容。 在这个时代，不再只有那些独来独往、逃避社会的人能成为写作者。采取主动、社交和协作3的方式来写作。 写作的主题跟写作本身一样重要。不过时的文章能够持续为你带来新的读者。优先选择那些在三年后依然能有价值的主题来进行写作。 忘记学校教给你的那些写作原则。避免使用晦涩的单词，抛开所谓的字数限制。文风很重要，但内容更为关键。写作的最终目的是传达你的想法，其他所有的东西都要让步。 Copywriters are masters of the written word. They write with clarity, energy, and simplicity, which is exactly what readers on the Internet are looking for. They write in specifics, not generalities. There’s no fluff. They get straight to the point. By writing in a persuasive, outcome-oriented (instead of academic) style, copywriters provoke responses and feedback. They rewrite and rewrite, and only hit publish once they’ve said what they wanted to say in the fewest possible words. In short, most people would improve their writing more by emulating copywriters instead of heeding the advice of famous novelists."
year_published = 2019
clearnet = "https://linghao.io/notes/david-perell-writing-online"
