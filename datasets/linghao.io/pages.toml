["https://linghao.io/notes/programming-beyond-practices"]
title = "Programming Beyond Practices"
description = "Notes on Programming Beyond Practices."
full_description = "Programming Beyond Practices by Gregory Brown is one of the most insightful books I've read about software engineering. The book is consisted of 8 chapter-length stories that present a series of interesting topics that go beyond the sheer scope of programming. This chapter discusses how exploratory programming techniques can be used to build and ship a meaningful proof of concept for a product idea within hours after development begins. This chapter discusses issues that can crop up whenever a production codebase is gradually extended to fit a new purpose. This chapter discusses some of the various ways that third-party systems can cause failures, as well as how flawed thinking about service integrations can lead to bad decision making. This chapter discusses several straightforward tactics for breaking down and solving challenging problems in a methodical fashion. You should go read the book if you're interested in the specific puzzle used for illustration. This chapter discusses a step-by-step approach to bottom-up software design, and examine the tradeoffs of this way of working. The example here is just-in-time production workflow. You should go read the book if you're interested in pithy details of the whole approach. This chapter discusses how small adjustments to the basic building blocks of a data model can fundamentally change how people interact with a system for the better. This chapter discusses some common anti-patterns that lead to struggles in software project management, and how incremental process improvements at all levels can alleviate some of those pains. This chapter is basically an imagination of what programming would look like in a future where the technology has advanced to a extent that we could focus purely on problem solving and communication rather than writing code. There isn't any takeaways in this chapter. You should go read the book if you're interested in author's depiction of the future. Instead, I'd like to quote some of author's ending remarks to end this post."
