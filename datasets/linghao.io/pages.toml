title = "Alistair Croll on Lean Analytics and Growth Hacking"
description = "Notes on Alistair Croll's talk on Lean Analytics and Growth Hacking."
full_description = "Prepaid problem: months before you find out that customers are gone. Trick: send out emails some time after subscription. (would you like to cancel model) Growth hacking demystified: Pick a metric to change -> Find correlation -> Test causality -> Optimize the causal factor Growth “hacking” is making a system to do something it wasn’t supposed to do. (e.g. LinkedIn API, early day AirBnB and Craiglist, Airport baggage delivery system) An entrepreneur is (maybe) not a founder. The goal is to discover a new business model in an uncertain environment. Learning trumps planning. A startup is an organization desgined to search for a sustainable repeatable business model. Degrees of uncertainty: Market with unmet need -> Job to be done -> Business diagram -> Business model -> Business plan Three currencies of the Internet: Reputation, Attention, and Money. Startup success is often about your exchange rate between the three."
