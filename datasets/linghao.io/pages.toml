["https://linghao.io/posts/liqi-interview"]
title = "利器访谈：创造者和他们的工具"
description = "「利器社群计划」的访谈。"
full_description = '工具和灵感，都是利器。当来自不同的领域，不同类型的创造者的工具和灵感互相碰撞的时候，才会迸发出更多的可能性。为了鼓励更多的工具和灵感的出现，我们发起了「利器社群计划」。「利器社群计划」鼓励独立的组织或个人，在自己的平台上分享「利器」。 作为一名刚刚进入第一份全职工作的工程师，很难说自己经历过什么称得上是转折点的事件。硬要说的话，2016 年暑假在 Strikingly 的实习，让我确信了自己喜欢的是开发面向消费者的产品，从而彻底打消了进入学术界的念头。这也算是对职业生涯有重要影响的事件吧。 由于喜欢 X1C 优秀的工业设计和便携性，15 年入坑之后我一直将其作为主力笔记本。而作为一名中度游戏玩家，在 X1C 之外我另有一台联想的游戏本（Y520）。入职以后我在公司主要使用 Linux Workstation，同时还配了一台 13" rMBP。由于在工作之外没有高强度的开发需求，所以目前在家里接有显示器的游戏本加上 MBP 基本可以覆盖日常需求，于是 X1C 正在吃灰。 但如果有朝一日成为了无业游民，我想作为主要生产力的笔记本还会是 X1C。（应该会考虑入 X1 Extreme 作为 Y520 的替代。） 在这之前用的是朋友送的 Cherry G80-3000（青轴），目前在老家吃灰。主要是因为全键盘尺寸携带不便，而且青轴不适合长时间游戏。 我从 2011 年开始就是 iPhone 用户，先后使用过 iPhone 4、iPhone 4S、iPhone 6S 和 iPhone 7。最近由于 7 的电池损耗严重而换到 XS。 我很少在手机上进行生产活动，在社交、娱乐等功能以外主要是将其作为摄影和图片编辑工具。有时我也会用 iBooks 看电子书。手机同时也是保障我个人账户安全的 2nd Factor， 这里想单独提一下 AirPods。因为它实在是太好用了。在 AirPower 遥遥无期的现在，买到就是赚到。'
