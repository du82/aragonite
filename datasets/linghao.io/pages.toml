["https://linghao.io/posts/how-to-be-great-101"]
title = "How To Be Great 101"
description = 'A "theory of everything" on how to be great: the most important lessons in my life so far.'
full_description = '''I've been lucky enough to have had a few accomplishments in my studies and career, for which I've been writing and giving people advice on how to be great on various subjects since middle school. Having just turned 30 this year, however, for the first time in my life I feel reasonably confident that I can now articulate a "theory of everything" on being great (luck excluded, as much as possible). In this first of potentially several posts, I'm sharing with you the most important lessons I've learned. The inspiration for this post, How to Be Great? Just Be Good, Repeatably, said it the best. Being great is not about getting to a destination with meticulous planning and herculean efforts. It's about being consistent in the act of being good, from which greatness emerges as a by-product. Of course, this is a mental distinction, not a material one. You would still set goals and work hard to achieve them. But framing that as a side effect of consistently being good rather than the end result is immensely liberating and empowering! Greatness cannot be planned and few can navigate the path to get there, but most people instinctively know what goodness is or can learn that easily. Being good on one occasion is to do things that create positive changes for our lives; being good consistently is to turn that into behavior patterns that run automatically to help us go beyond goodness and toward greatness. That's it, the single most fundamental axiom in the theory of being great. Everything else, be it an atomic habit, a decision heuristic, a focus ritual, a mental model, a productivity technique, etc, is either a tool of goodness for you to exercise, or a tool to facilitate other tools (finding them, knowing when to apply which, making them easier to hold on to, etc). Excellence is mundane. Superlative performance is really a confluence of dozens of small skills or activities, each one learned or stumbled upon, which have been carefully drilled into habit and then are fitted together in a synthesized whole. There is nothing extraordinary or superhuman in any one of those actions; only the fact that they are done consistently and correctly, and all together, produce excellence. -- The Mundanity of Excellence'''
year_published = 2024
