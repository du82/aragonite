["https://linghao.io/posts/my-time-management-system-2020"]
title = "我的时间管理系统"
description = "A minimalist approach to time management that tracks and reviews to-dos in a single, easily accessible list."
full_description = "最近我的朋友 Nova 做了一个时间管理访谈，其形式是由参与者自发回答给定的访谈问题（类似我之前参与的利器访谈），目前已经积累了 20 多篇风格各异的回答。 我认为时间管理的核心永远是 Getting Things Done (GTD) —— 在有限的时间内完成尽量多的事情。我曾经在《过去这五年，我学到了什么》中介绍过自己的 GTD 系统，但当时讲得比较抽象且不够全面。所以，在回答访谈问题之前，我打算先完整介绍一下自己实际在使用的系统。 为什么需要这个列表？短期记忆不是大脑的强项。Todo List 可以为大脑分担「记住我有哪些任务」这一「不重要」的工作——毕竟，任何系统都只能帮你规划任务，最重要的还是执行任务，而这需要大脑全方位的投入1。 为什么只用一个列表？为了避免在不同列表之间切换，降低认知负担。尤其当我们试图调整多个任务之间的相对优先级，或是将任务在「现在做」和「近期做」之间移动时，能够同时在单个屏幕中看到所有任务是非常有帮助的。 用什么工具来维护这个列表？在工具链中越是处于基本和重要地位的部分，就越需要避免过度设计带来的干扰。市面上生产力工具层出不穷，但许多都有过度设计的问题，而我这套系统只需要一个文本编辑工具。理论上来说，一张纸一支笔就可以管理 Todo List。当然为了方便修改，我使用的是朋友 Shu 开发的 Markdown 编辑器 Mak。它是一个以 GitHub Gist 作为存储后端的 Single Page App，平时就作为一个标签页常驻于浏览器中。 当你建立了这样一个单一 Todo List，而它又时刻处于伸手可及之处，你就会频繁地浏览和更新这个列表。这是一种非常有效的自我暗示，可以利用到大脑的排演机制2，去「均摊」做那些相对较困难的任务的精神负担。同时，你也会更倾向于记下转瞬即逝的想法，以及更勤快地调整任务的优先度。"
