title = "过去这五年，我学到了什么"
description = "本文是前一篇五年总结的后续，以如何实现自己的目标为主题整理了过去五年中学到的经验和教训。"
full_description = "本文是前一篇五年总结的后续。希望就如何实现自己的目标这个话题给各位带来一些启发。 了解自我是伴随每个人终身最重要的课题。人生的早期阶段，尤其是高等教育期间，是了解自我的黄金时期。 进入一个好大学，就读有竞争力的专业，获得优秀的学习成绩，拿到心仪的工作机会。这些固然是非常重要的目标，但不应该仅仅只是目标。达到这些目标的过程同时也应该被看作是了解自我的一种手段。 具体来说，了解自我可以体现在方方面面。比如弄清楚自己一天中什么时候学习、工作效率最高，连续集中注意力的时间上限是多少；又比如探索自己分别擅长和不擅长哪种类型的任务，或是哪种类型的回报对自己的激励作用最强等。 以我的个人经历为例，过去五年间我最重要的两点发现是：1、我完全无法做好自己不发自内心认同的事情。2、我享受做面向用户的产品。这样的自我认识对职业道路的选择就有着重要的指导意义。 在人生的早期阶段，我们面临的困境跟创业者们所面临的困境很像：世界每分每秒都在变化，对事物的认知永远无法达到完全正确，甚至很多时候错得离谱。创业公司拥抱这种现实的方式，是通过快速的迭代和试错，来最大化他们理解市场和用户的速度。 我们可以从中得到许多借鉴。总的来说，每个人都应该把自己当做一家创业公司，接受失败和试错的常态，在考虑多个机会时偏向于能够更多更快地学到新东西的那个选择。 师傅领进门，修行在自身。一个潜在的问题是如何跨越从零到一的槛。基于个人经历，我的建议有： 建立高效的反馈回路对快速的迭代和试错来说至关重要。寻求外界的帮助（比如学校的导师和工作的前辈）或是自行设立衡量指标，用来帮助你在学习新事物或是实验新技巧时了解当前的效果如何以及如何改进。"
