["https://linghao.io/posts/demystifying-tlm"]
title = "Demystifying TLMs"
description = "What does becoming a TLM mean, and should I take the role?"
full_description = '''A Tech Lead Manager, or a TLM, is a role split between a Tech Lead and an Engineering Manager. Most if not all TLMs come from previous TLs when: TLMs are highly regarded and well sought after, at least by some people and in certain parts of the industry. As a newly minted TLM of 6 months, however, I'm leaning toward the other side of the argument: taking a TLM role could harm your team and your own career growth. The reason is simple. You need to do both the "TL" part and the "M" part of the role. And either of them should have been a full time job. When your manager offers you this position, it could be a fitting recognition of your contributions, or it could be an invitation for disaster. In this post, I will talk about what's the delta from TL to TLM, and why you might or might not want to take the role. Some managerial duties grow linear to the number of reports you have: 1-1s, goal setting, performance reviews, etc. This part is more predictable. There are other duties that you might already be performing previously as a TL. Now that you are a manager, they become official: All of these eat up your time to do TL and IC work. Not to mention that many of them require a completely new set of skills to do well. To make things worse, in some companies TLMs are still mostly evaluated as ICs. So let's say you did 60% of the TL/IC part and 60% of the M part. Then you overworked by 20% and will likely still be considered not as good as an IC who delivered 70% of their expectations. Most TLMs I know, including myself, spend more time on TL/IC work and do some lightweight management. If this applies to you, talk to your pure EM colleagues and give them some hypothetical examples. You'd be amazed by how much more you could have done if you were spending 100% of the time on engineering management. You will be making many more decisions as a TLM, and not just technical ones. You will often need to act on incomplete data and in uncomfortable situations. To give a few examples:'''
year_published = 2023
