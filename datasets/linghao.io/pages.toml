["https://linghao.io/notes/stay-gold"]
title = "初心"
description = "两个关于「初心」的知乎回答的备份。"
full_description = "原文这篇 14 年的文章可以说是我的 Backstory。虽然后半段提到的具体目标早已发生了变化，前半段所描述的价值观念依然是我之所以是我的核心。 毫无疑问我在大学里付出的一切努力都是为了成为自己想成为的人，所以要回答这个问题我必须先谈谈自己想成为一个怎样的人。 在三观和理想形成的过程中，我受到了来自这三个人的巨大影响：Randy Pausch、Aaron Sorkin 和 Aaron Swartz。 Randy Pausch 在他举世闻名的「最后一课」上讲述了自己童年时的诸多梦想以及自己是如何逐个实现这些梦想的。他直面死亡的坚强驱使我去读了他与记者 Jeff Zaslow 合著的《The Last Lecture》。书里有许多他在课上没有讲到的细节，其中有一段我一直记得特别清楚。Randy 说他小时候的一个梦想就是去 Disneyland 工作，而长大后他所学的计算机图形学和虚拟现实的知识使他得以参与 Walt Disney Imagineering 的一项虚拟现实项目研究。而之后他在大学里开了一门虚拟现实入门课程，其中有一名学生告诉 Randy 他将来想参与到 Star Wars 电影的制作当中。Randy 当时并不以为意，但没想到若干年后那名学生真的成功地实现了自己的梦想。Randy 在书中说，实现自己的梦想，并能为他人实现梦想打开大门，是一件非常美妙的事情。 第一次知道 Aaron Sorkin，源自去年寒假在某英语培训机构上课时被一位老师推荐的美剧 The Newsroom。它至今是我最爱的一部美剧，没有之一。Sorkin 在剧中刻画了一位新闻主播 Will McAvoy。这里我不打算详述了，因为展开来就是另一篇打算写的文章的主题了。简而言之，Will 自诩堂吉诃德，做着在他人看来过于理想主义的事。他喜欢说自己是「on a mission to civilize」，面对着各种障碍却还是做着整个国家 95% 的人不会去做的事情来改善选民的知情权，尽管他认为那 95% 的人都是大猩猩，尽管有人说他是不是「look down upon us」的时候他毫不犹豫地回答「down are where some people are」。"
