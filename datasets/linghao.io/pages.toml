["https://linghao.io/posts/notes-learning-how-to-learn"]
title = "《Learning How to Learn》课程笔记"
description = "UCSD 开设在 Coursera 上的课程《Learning How to Learn》的笔记。"
full_description = "这是 UCSD 开设在 Coursera 上的课程 Learning How to Learn 的课程笔记。这门课程主要基于神经科学和认知心理学的一些研究成果讲述高效学习的理论和技巧，涉及了大脑的记忆机制、拖延的成因和应对方式，以及许多关于学习抽象复杂知识的小技巧。 由于时间有限，我只看了视频和通过了所有的 Quiz，Optional Assignment 和参考文献里的内容需要花费数倍的时间去仔细研究。尽管如此我依然感觉获益匪浅，故决定将笔记公开造福大家。 文中几乎所有的观点都是来自于授课材料，我尽量少做二度演绎。这些观点全部有详实的研究作为支撑，相信大家读了以后也能感受到，其中不少内容我们在日常学习中已经深有体会了。 Focused Mode 和 Diffuse Mode 是两种不同的思考状态。对于 Focused Mode 你一定不陌生，当集中精力解决一道数学题时，大脑就是处于 Focused Mode。而 Diffuse Mode 指的是一种放松的思考模式。你可以借助下面这幅 Pinball 的示意图来更好地理解这两个概念。 在左边对应的 Focused Mode 中，思绪很快集中于几个临近的神经元组成的神经回路。而在右边对应的 Diffuse Mode 中，可以看到思绪在随性地跳跃。 要随时牢记，Focused Mode 适合用于解决已经熟练掌握的内容，比如计算个位数乘法；而 Diffuse Mode 则对于新事物的学习至关重要，比如学习一门新的语言。这两种模式也分别对应了两种不同的思维模式：顺序思考（Sequential Thinking）和整体思考（Holistic Thinking）。 要注意在解决问题时，整体思考所获得的灵感必须经由顺序思考来确认其正确性。所以说在理想的学习模式中，你要能够在这两种模式中自如地切换，从而更好地掌握新知识。 Working Memory 就好比计算机的内存，是指大脑用于处理当下的任务的那部分记忆。Working Memory 的大小因人而异，内存比较小的人在学习抽象和复杂的概念时可能就会遇到困难。也就是我们常说的学到后面忘了前面。这种情况的应对办法，一是 Chunking（之后会介绍），二是通过比喻和类推等手段来改变知识的表示。这是因为不同的人思维方式不同，所以他们对知识的不同表示的接受度也就不同，一个表示可能对 A 来说正好能 fit 进他的 Working Memory 中，而对 B 来说却是 overload 了。"
year_published = 2016
