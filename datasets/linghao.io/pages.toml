["https://linghao.io/hyperbola"]
title = "Hyperbola Archive"
description = "Archive of Hyperbola episodes, my discontinued podcast attempt."
full_description = "本期节目是独立游戏系列的第一期，我与有过独立游戏开发经验的朋友 Shu 聊了聊游戏作为一种媒介的特殊性，独立游戏的定义、起源和兴起，我们为什么要玩独立游戏等话题，并以 Florence、Firewatch 和 Journey 为例探讨了游戏是如何开展情感叙事的。 本期节目是独立游戏系列的第二期，我与上期嘉宾 Shu 和新嘉宾 K 聊了聊 Jonathan Blow 的最新作品《The Witness / 见证者》，探讨了它在单纯的谜题之上所构建的层层深意。剧透警告：不建议打算玩但还未玩过这款游戏的听众收听本期节目。 本期节目将开辟一个新系列，我会邀请一些从事软件行业的朋友来聊聊软件开发、职业规划、行业见闻等话题。在这期节目中，我与 Ruby 开发者 Yiming 聊了聊各自对敏捷开发（Agile）的理解，实践敏捷开发时遇到的痛点和积累的经验，并交流了如何将敏捷开发的思想运用在生活中的其他方面。 如果全人类都获得了永生的能力会发生什么？让我们又爱又恨的 Deadline 在软件工程和项目管理中发挥的是什么作用？在本期节目中，我与 Ruby 开发者 Yiming 就这些话题进行了一番闲谈。 在大公司工作的体验就像当一颗螺丝钉？看过很多软件工程的书却依然会犯下里面的典型错误？以我在 Google 的实际项目经历为鉴，Yiming 和我讨论了如何成为更高效的软件工程师。"
