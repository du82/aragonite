["https://linghao.io/posts/tl-learnings-2022"]
title = "Learnings as a Tech Lead"
description = "What makes a great TL? Sharing what I've learned in the past 1.5 years as a TL at Google. Topics include: engaging in design discussions, leading by example, creating space for others, become better at context switching but limiting work in progress, writing everything down, and book recommendations."
full_description = "At the two year mark of joining my current team at Google, I became a TL somewhat prematurely due to the previous TL's departure. It has been one and a half years since then and I'm now transitioning into a TLM role on the same team. In this post, I'll share what I've learned about what makes a great TL. This is the most important aspect of being a TL. If you're only gonna do one thing well, it should be this. Design discussions take many forms, from formal engineering design reviews to informal debate on how to write a specific piece of code during code reviews. I've found that the most effective angle is to focus on reducing the project's overall risk. Think about the following during design reviews: One thing I've seen junior engineers struggle with in particular is to structure their design doc. A useful tip is to have a high level overview upfront, and break down the design into a series of critical design decisions. The design doc should then be structured around those, e.g. each critical design decision would make a separate section. It's relatively easy to lead a team of ramped-up junior engineers to implement technical tasks and make progress toward a larger goal. But how do you help grow them into reliable teammates who can fully own their solutions beyond coding -- monitoring, alerting, testing, documentation, etc. How do you nudge them toward working on non-feature work that's in the team's best interest in the long run? If you are their manager, you'd probably have more than a few tricks in your pocket for this. But as a TL, I found leading by example to be the most effective approach. Set an example with your own projects. Design and implement something that adheres to a high quality standard. Then put cherries on top by building monitoring graphs, setting up alerts, adding tests, writing documentation, etc. Your junior teammates will see it's not that hard to do all this. And they will start mimicking your behavior in their own projects. In addition, usually there are some parts of the system that are not owned by anyone. It pays to do some of the above in those parts (a TL probably ends up doing those anyway if nobody else does it). If you're seen personally doing something you've been encouraging others to do, it's much more likely they will agree it's worth their time too."
year_published = 2022
