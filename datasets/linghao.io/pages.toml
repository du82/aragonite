["https://linghao.io/posts/five-year-summary-2013-2018"]
title = "过去这五年"
description = "对过去五年的学习工作的总结和记录。"
full_description = "这是一篇对过去五年的忠实记录。有成功也有失败，有欢笑也有泪水。作为一篇很大程度上为自己而写的回忆录，倘若能对你有些许启发，便是无憾。 在高中准备了两年信息学竞赛却没能拿到全国赛（NOI）资格之后，我通过计算机特长生夏令营保送来到了复旦。那时保送生有一个选择是提前半年过去读预科，上三门数学课并进行 ACM 训练。而我并不打算在大学继续参加算法竞赛，同时也觉得利用高三的时间提高英语能力更为重要，就没有选择去读预科。那一年我的自主学习成果还是不错的：英语水平突飞猛进；掌握了微积分和线性代数的基础知识；开始学习 Python 并尝试写出了一些自动化脚本；还在无意中浅尝了机器学习这一领域。 与那段时光相比，我在复旦的第一年可以说是浑浑噩噩。人生第一次离家独立生活；从三线城市来到一线城市被新鲜事物包围而感到迷失；对 CS 的学术/职业道路缺乏概念，看不清未来在哪；复旦特色的大类加通识教育导致课表上堆满了不感兴趣的课；…… 种种因素叠加起来，我的大一虽然过得还算开心，但在个人发展上几乎一事无成。不仅结结实实吃了三个 C 档成绩使得 GPA 彻底不能看，还经历了许多的半途而废：加入了一打感兴趣的社团却都没有坚持参加，一时兴起买的树莓派在新鲜感褪去之后也惨遭废弃等。单从结果来看，大一做的唯一正确的选择居然是选了一门网球课，从而跟之后成为室友兼良师益友的余神混熟，并且连带着认识了戍爷和 Farter 这两位未来室友。 第二个学期的时候，在余神和戍爷的推荐下，我加入了复旦学生网（STU）这个神奇的组织。我在那里得到了技术启蒙，也结交了好几位至今仍然志同道合的朋友。那时的我简单地满足于写出能工作的脚本，在 STU 与众不同的报名环节还提交了参考朋友代码开发的 Pixiv 图片批量下载工具作为自信作。然而刚加入 STU 没多久，余神就随手表演了如何闭着眼睛写出一个选课信息爬虫。当我还在依葫芦画瓢使用 urllib2 的时候，余神早已建立了使用 requests 和 pyquery 等工具编写爬虫的最佳实践，并且对 HTTP 等原理层面的知识也已经有了切实的掌握。我完全折服于能够将业务逻辑级别的代码写得如此熟练和优美的这种能力，也认识到了自己在技术上是何等的无知。在同一时期，戍爷和 QS 学长的前端入门教学也成为了我进入 Web 开发领域的起始点。"
