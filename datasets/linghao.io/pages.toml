["https://linghao.io/posts/toefl-gre-prep"]
title = "如何备考 TOEFL/GRE"
full_description = "先晒一下成绩以表诚意： TOEFL：14 年 11 月 110；15 年 10 月 112GRE：15 年 10 月 Verbal 161 + Quant 170 + AW 4.0 本文的目的是分享一些对于有一定英语基础的人适用的 DIY 备考经验，而不会讨论诸如“我听力很烂应该怎么提高”之类的问题的。因为这些问题基本上都可以用“努力多练”四个字来回答。当然，本文提到的一些备考资源和工具是完全可以拿来提高自己的弱项的。 T 是一个衡量日常和学术英语能力的考试，而不是一个需要死记硬背考前突击的考试。所以，英语基础比较好的同学并不用花很大的力气去准备。 我第一次考 T 的时候就是做了 15 套 TPO 里面的听力和阅读，除此以外只在考前熟悉了一下口语和写作的题型。 曾经有好几位基础还不错的同学来找我询问 T 的备考策略。他们都提到了要不要花钱去英语培训机构上课。我始终认为那些培训结构除了满足伸手党的惰性和督策一部分极度不自律的人以外没有任何帮助。我也接触过一些培训机构，拿到过一些所谓的内部资料，并不觉得是什么自己动手所比不上的资源。事实上那几位同学听从我的建议 DIY 备考以后几乎都拿到了 100 分以上的成绩。 听力除了因为词汇量和练习量的问题听不懂以外，另一个问题就是注意力不集中，使得原本能听懂的内容也没能听懂。我两次考 T 听力都是满分，即便如此我在考试中照样也遇到了因为一个分心就没听到一个信息点的情况。我的经验是，在考场上不要花太多经历去记笔记，而是专注于听懂材料的内容。一个 Section 里面三篇材料，第一篇是不需要记任何东西的，后面两篇也只需要记一些很明显是分点叙述的关键句。比如材料里面教授说某某艺术流派有三个重要的特点，那么把这三点的第一句记下来就差不多了。虽然题目里一定会考到一些细节，但仔细去听去理解往往比手忙脚乱用笔去记要更容易回忆起细节来。"
