title = "「程序员」和「软件工程师」是一回事吗？"
description = "「软件工程」区别于「编程」的三个方面是什么？从「程序员」到「软件工程师」的角色转变让我学到了什么？谈谈软件工程中的可持续化开发、Code Review、认知负荷、知识共享、降低犯错成本以及做更好的决策。"
full_description = "同样是写代码开发软件，有人自称「程序员」，也有人自称「软件工程师」。真要抠字眼的话，这两者之间有怎样的区别呢？Google 今年出版的新书 Software Engineering at Google (SWE Book) 在第一章开头就提出：「编程」和「软件工程」是两回事。 「编程」指生产代码的活动，而「软件工程」则是在此基础上再添加时间这一维度。正如三维的立方体不等同于二维的正方形，距离不等同于速度，「软件工程」也不等同于「编程」。 要区分一种软件开发的模式是更接近于「编程」还是「软件工程」，我们可以问这样一个问题：这份软件的预期生命周期有多长？或者说这份软件需要被维护到什么时候为止？一般而言，这些活动会更接近于「编程」： 而像 Google 搜索或是 Linux 内核这样的项目，它们的生命周期可以认为是无限期的。 在动辄以年为单位的预期生命周期下，改动是不可避免的。一个软件系统即使没有需求上的变动，也必然会由于时间的流逝而面临不得不做的改动，比如： 现代软件工程几乎无一例外都是团队合作的结果。随着规模的扩大，团队组织、项目结构、政策、流程、实践等等都需要跟着 scale。经验告诉我们，一些东西比较容易 scale，而另一些则更为困难。SWE Book 从多个方面进行了具体介绍1，而本文主要关注作为个人可以做的。 在软件工程中做决策也更为有挑战性：风险和机会成本更高、做决策时信息不充分，对问题的理解永远不够全面并且在时刻变化，等等。 对这些区别的认知可以为我们提供一个关于「软件工程师应该怎么做」的框架。 对个人而言，可持续化开发大致就是要实践笔者以前提到过的 Strategic Programming。摘录相关段落如下： ... 就像着眼全局的战略家，能持之以恒地投入资源从而在完成开发目标的同时逐步地、系统性地提升整个 codebase 的可维护性、可拓展性以及测试覆盖率等。"
year_published = 2020
clearnet = "https://linghao.io/posts/programming-vs-software-engineering"
