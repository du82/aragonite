["https://linghao.io/notes/a-philosophy-of-software-design"]
title = "A Philosophy of Software Design"
description = "A Philosophy of Software Design is a short yet to-the-point book on high level ideas about how to design a software system with less complexity. This note mostly consists of quote-worthy excerpts from the book and aims to serve as a verbose version of the book's table of contents."
full_description = '''A Philosophy of Software Design is a short yet to-the-point book on high level ideas on how to design a software system with less complexity. It's a book I would recommend to every entry-level software engineer. This note mostly consists of quote-worthy excerpts from the book and aims to serve as a verbose version of the book's table of contents. Readers can use this note to quickly browse the main arguments of the book, or to locate the chapters of interest that deserves reading. A tip for those who decide to read the book: pay attention to examples, red flags and "taking it too far" sections of the book, which are of great value but are not covered by this note for brevity. The greatest limitation in writing software is our ability to understand the systems we are creating. Definition: complexity is anything related to the structure of a software system that makes it hard to understand and modify the system. It is more apparent to readers than writers. Think of each module in two parts: an interface and an implementation. The best modules are those whose interfaces ware much simpler than their implementations. An abstraction is a simplified view of an entity, which omits unimportant details. An abstraction that omits important details is a false abstraction. Red flag: shallow modules don't help much in the battle against complexity, because the benefit they provide is negated by the cost of learning and using their interfaces. Unfortunately, the value of deep classes is not widely appreciated today. Students are often taught that the most important thing in class design is to break up larger classes into smaller ones. The same advice is often given about methods: "Any methods longer than N lines should be divided into multiple methods" (N can be as low as 10). This approach results in a large number of shallow classes and methods, which add to overall system complexity. Information hiding: each module should encapsulate a few pieces of knowledge, which represent design decisions. The knowledge is embedded in the module's implementation but does not appear in its interface,so it is not visible to other modules.'''
year_published = 2020
year_updated = 2020
