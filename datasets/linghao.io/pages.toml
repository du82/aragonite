["https://linghao.io/notes/blindsight-excerpts"]
title = "Excerpts from Blindsight"
description = "Excerpts from Blindsight."
full_description = '''Pack animals always tear apart the weaklings in their midst. Every child knows that much instinctively. Watching the world from a distance, it occurred to me at last: I knew exactly what Chelsea had meant, with her Luddite ramblings about desaturated Humanity and the colorless interactions of virtual space. I'd known all along. I'd just never been able to see how it was any different from real life. "I think I'll call you Cygnus," Chelsea said. "The swan?" I said. A bit precious, but it could have been worse. She shook her head. "Black hole. Cygnus X-1." I furrowed my brow at her, but I knew exactly what she meant: a dark, dense object that sucks up the light and destroys everything in its path. I brought her flowers one dusky Tuesday evening when the light was perfect. I pointed out the irony of that romantic old tradition— the severed genitalia of another species, offered as a precopulatory bribe—and then I recited my story just as we were about to fuck. To this day, I still don't know what went wrong. I believed it. They would never have shipped us out fully-assembled if there'd been a cheaper alternative. The will to resist is no less mechanical than the urge to breathe. Both can be subverted with the right neurochemical keys. "Leaders are visionaries with a poorly developed sense of fear and no concept of the odds against them." Surely, said the Optimists, space travel implies enlightenment, for it requires the control of great destructive energies. Any race which can't rise above its own brutal instincts will wipe itself out long before it learns to bridge the interstellar gulf. What is Human history, if not an ongoing succession of greater technologies grinding lesser ones beneath their boots? But the subject wasn't merely Human history, or the unfair advantage that tools gave to any given side; the oppressed snatch up advanced weaponry as readily as the oppressor, given half a chance. No, the real issue was how those tools got there in the first place. The real issue was what tools are for.'''
