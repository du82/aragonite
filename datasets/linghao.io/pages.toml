["https://linghao.io/posts/staff-eng-learnings-2024"]
title = "Becoming a Staff Engineer"
description = "A post on what helped me grow into a staff engineer in 1.5 years at Google."
full_description = '''I recently became a staff software engineer at Google, 1.5 years after reaching the senior level. In this post, I'll share a few things that helped the most with my growth. This is not a post about the "requirements" for a staff engineer. But I do want to start by emphasizing a few things that I find crucial for a staff engineer to do well: Starting around the senior level, you'll inevitably face some degree of organizational politics whenever you try to work toward the next level. Hopefully, your organization isn't too toxic and the "politics" is no more than simply a different dimension of the puzzle you need to solve. If you have these mapped out in your head and keep them updated, it makes reasoning about organizational puzzles surprisingly easier. I've worked with a lot of senior and staff+ engineers by now. Apart from apparent gaps in skills and scope, one of the key differences in their mindsets is whether to make it a habit to take a step back. Looking at the bigger picture is how you avoid tunnel vision and find the best leverage point to direct your efforts. The tricky part is there isn't always a bigger picture -- sometimes tunnel vision, or shall we say focused execution, is exactly what's needed to solve the problem. But the fix is simple too: just make it an atomic habit to always look for the bigger picture. The downside is trivial -- at worst you lose a few minutes thinking and maybe asking questions about it. You could do something simple like asking the 5 whys. For example, if a proposal or an existing design feels odd, dig into why. 9 out of 10 times, there are good reasons and historical context behind it. But from those you might just find the idea for your next big project. This one is straightforward. Be the bridge between teams, organizations, and functions. Make things flow between them. However, some of its nuances are not always appreciated. Usually you become the bridge when you own the full scope: you know everything about the system so you become the natural representative when collaborating with interested parties. But there is a reason why you need bridges to cross a river instead of simply jumping over.'''
