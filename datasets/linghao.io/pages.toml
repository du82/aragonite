["https://linghao.io/posts/grow-at-google-02"]
title = "Grow @ Google 02: 「能用就行」还远远不够"
description = "Grow @ Google 是一个基于我在 Google 的经历来讨论如何成为更高效的软件工程师的系列。本期的话题包括：在开发中平衡战术和战略的思维方式；再谈反馈回路；在个人和团队之间建立健康的平衡。"
full_description = "在「大厂」工作的体验就像当一颗螺丝钉？读过很多软件工程的书却仍会犯下里面的典型错误？感到自己工作效率低下却不知如何改进？要成为一名高效的软件工程师，在理论和实践之间是存在不小的距离需要我们通过广泛学习、勇敢试错和不断反思去跨越的。在 Grow @ Google 这个系列中，我会结合自己在 Google 的工作经历来分享一些经验和教训，帮助大家少走一些弯路。系列中的其他文章请见： 站在工程师的角度，代码最终是为解决实际问题服务的。不论它们有多么优美、能给人带来多少理性愉悦，更多的代码就意味着更高的维护成本和更多的潜在 bug。 能够明确和认同这一点，在我看来是作为一个工程师迈向成熟的标志之一。这意味着不再对代码本身持有过度甚至病态的执着，也就能够不带（关于编程语言、工具链和技术栈等的）偏见地去欣赏特定场景下特定解决方案的美。 《A Philosophy of Software Design》是继《The Effective Engineer》之后又一本我相信每个工程师都应该读的书。这本书主要讨论了软件工程中的复杂性（Complexity）从何而来，以及如何降低一个软件系统的复杂度。书中对比了两类不同的工程师在解决问题时会采取的不同思路：Tactical Programming 和 Strategic Programming。 第一类工程师就像战术家，只着眼解决当下的问题：可能是抢修一个 bug，又或者是扫除新 feature 上线的障碍。为了在最短时间内达成目标，他们往往会放宽对代码质量的要求，或是违背工程上的最佳实践；第二类工程师就像着眼全局的战略家，能持之以恒地投入资源从而在完成开发目标的同时逐步地、系统性地提升整个 codebase 的可维护性、可拓展性以及测试覆盖率等。 第一类工程师将复杂性和技术债务带入软件系统，而第二类工程师则是我们应该效仿的对象。在现实中，第一类工程师却往往是多数。我们总能找出理由来为自己辩解，比如「能用就行了」，又比如「上一个维护者的代码就写得稀烂，我没有义务去为了下一个维护者的开发效率而牺牲自己的时间」。然而，这样看待问题的结果往往是搬起石头砸自己的脚。"
