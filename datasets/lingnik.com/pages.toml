["https://lingnik.com/2004/09/23/ccfl-backlight-replacement.html"]
title = "Replacing an LCD or Laptop CCFL backlight tube/bulb | Lingnik : Taylor J. Meek"
description = "If you laptop or LCD screen goes dark, black, red, or orange, what do you do? You can always try replacing the backlight bulb, so long as it's a CCFL."
full_description = "What to do when your Laptop or LCD screen/laptop screen goes dark, black, red, orange, or any other annoying color. UPDATE 2014-05-07: I wrote this a long time ago, and there are much clearer instructions (with pictures) elsewhere. Reader be warned. UPDATE 2004-09-23: I have actually replaced my own bulb some time ago! A while after posting this, I found a source for CCFL lamps–Mouser Electronics, based out of Texas. With a catalog the size of a small metro phonebook, they have everything. Soooo. Couple of things: Make /sure/ that you measure your old bulb precisely. Anticipate that the new bulb will have flared tips at both ends. Be gentle when bending the leads, and make certain you form them properly if the old leads were shaped strangely. These little guys are cheaper than expected–less than $20 including shipping for a bulb. That’s about it. Email me if you have more questions, or concerns. Good luck! The Story Anatomy of an LCD Screen (for laptops) LCD Backlight Inverter Board CCFL Replacement PRECAUTIONS Sources/Links The Story Some number of years ago, my father gave me his old work laptop. It was a home-style laptop. A Compaq Presario 1681. Compaqs, I have since determined, are not going to be a sort of computer I will ever purchase myself. This system, I should say now, has had numerous issues. But anyways. After using this system extensively, in a manner which was not prescribe by the surgeon general (long nights hacking beauticious MUSHcode, and leaving it on as a -server- under linux), it began to develop issues. First was the screen going floppy on me, which was annoying and mechanical. I’m not good at mechanical, and to this day, it is still floppy. It has no tension in one of the feet which clamp onto the skeleton of the laptop body. I guess the gear-teeth got stripped, from what I can tell. Other issues developed, which next included the screen itself–the subject of this text. What happened was an annoying thing. The laptop’s LCD screen turned orange-red. Not completely. I mean, you could still -read- everything just fine. Just that everything had an orange hue. Not only is this annoying, but it is most likely unhealthy for you. (Your eyes are not used to staring at one hue for hours at a time, I imagine.) I dealt with it by attaching an external monitor. And then the system began overheating more and more, and finally melted its own solder, on the DC jack. Hence, she died, and was shelved for some number of years. For most computers in this situation, with most owners, this would mean the end of a potentially useful life. A computer without a use is landfill. But then, a few weeks ago (as of this writing, 10/4/2003), around the beginning of September, I was rummaging through my garage, looking for a stereo y-adapter (which I never did find) for hooking various sound sources together. And then I found the old laptop. Dusty, stuffed haphazardly in a box of miscellanous other computer-related things. And so I get brave. I pulled her out, as well as her AC adapters, and began messing about with it in my room. Obviously, the power had long drained out of her batteries, and since the AC adapters didn’t work (her solder melted. Remember?), I was left with one choice. Okay. Well. I should regress, and note now. I had two choices. I could have shipped her off for repairs; but I’m cheap, and I know I’ll get charged anally. So that left me with fixing it myself. This in and of itself consisted of prying her apart, and carefully removing each and every part of her chassis to get to the motherboard, which itself was nigh impossible to remove. (I’ll do disassembly instructions, some day, maybe.) Finally, with that removed, I worked at resoldering the DC jack properly. That finish, reassembly was a breeze, and she charged to a full 100% within the hour. I was very pleased. Finally, she booted up, and I was greeted with an orange-on-darker-orange version of ‘COMPAQ’ as her BIOS snappily shifted bits and bytes about. And then she bit me. She had no functional bootloaded; but that didn’t matter right now. I would later reinstall Windows 95, and then upgrade to 98. But that was some time later. What struck me, as I stared at a blank screen, with a single underscore in the corner, was how orange everything was. And then I felt inspired to fix that, before doing anything else to her. It was at this point that I briefly installed Linux and such, so that I could open an image editor (the Gimp), to throw some color bars on the screen. I took out my prismacolors, and drew identical bars on a sheet of white paper, held it up to the screen, and took a digital picture. (available at the link below) Just for proof. And comparison. Then I got to the real work. Turning her off, pulling her battery, and making to to have discharged anything nasty in my body, I began prying the LCD screen off. I first detached it from the body itself. (her feet brackets were removed by their screws, and any cables/sheet-cables were removed from the main system) I then proceeded to remove the front bezel-panel from the LCD (there were four screws, covered by rubber feet), to give access to the LCD panel and circuitry proper. For anyone who has never seen the inside of one, they are rather simple. Mine, being for a laptop, also had a microphone mounted inside, but other than that and its cable, the guts were the LCD screen itself (surrounded by a hard metal bezel), the cable attached to it, the inverter board (I’ll explain later) and the cables to it. It’s a very neat package. Anyways. After that was done, I dismantled the LCD screen after removing it from the screen body itself, and finally got to the backlight tube. (This was a very hard thing to get to.) Finally, I removed the tube from the reflector, attached it to the inverter board, attached the board to the laptop, and turned it on with only those two things connected. Sure enough. I had an orange backlight tube. At this point, I should explain that this is wrong. This backlight tube should, ideally, be pure white, without variance (though each manufacturer will design their LCD screen to varying definitions of ‘pure white,’ thereby lending any screen with a replaced CCFL tube a slight color variance) so that your screen colors (produced by the liquid-crystal color pixels) are represented naturally. Now, having determined that the source of the problem is most likely the tube itself (which are usually rated for around 20,000 hours or so of operation), and not the inverter board (which output variable voltage; a voltage drop should not change the color of the tube. only the brightness), it’s time to find a new tube. This, however, I will warn you, is not easy. In three days of researching that very thing, and nothing else, I found nothing useful. I found one or two merchants online that would, naturally, take your LCD and replace it for you at a figure of $99 or so. If you aren’t comfortable doing this operation yourself, I’d suggest finding such a place, and paying the $99. (Try my links section below.) It really isn’t worth damaging a $300 LCD panel over a thing that is 250mm long by 3mm in diameter. ;P But me, I want to replace it myself. And nobody in known existance seems to sell them, by themselves. I made the next logical step, and tried the local stores in town. Most notably were Radio Shack (who is an authorized HP repair center, btw; they handle the Compaq laptops, too. But not in-house, which is what I need.), who wasn’t able to sell me or order the lamp by itself. The store manager wasn’t even nice about it. So I’m not returning there ever again. The second place I went was a local electronics supply store that is housed in a warehouse, called Norvac Electronics. If you’re ever in need of electronics supplies, and you live in the Northwest in an area with one of these, go there. They certainly had more than I expected them to have. In fact, they even had CCFL lamps. Don’t think it was that easy, though. Their lamps were too big. How? Too big around, in diameter. The lamp reflector housing was too small for the lamps they sold, so I walked out empty-handed. (excluding my laptop; they were nice enough to let me dismantle it in-store for explanation and to try to see if it would work.) I was at a loss. Nowhere else in town had them, and I couldn’t find them online. I could find vague references to cost, but none of them would work. It sounded like it would be a cheap operation. Something like $8-30 for a single tube. That’s all I needed. I just needed to find a place that had them. So a month passes, and I took the computer apart and made it into a simple box with an external monitor, so that I could at least use it without wasting the hours of life for the LCD screen itself. Or the inverter, or anything else like that. It’s sitting on a speaker right now, hooked up to everything, without its top cover, with its components exposed. WHEE. I pulled up google a few hours ago, and typed in my search string. Lo and behold, something comes up. JKL Lamps Corporation. (“If it lights, and you need it, we have it!”) This is a company that produces and distributes miniature lamps (of the old visible filament style), laptop ccfls, various other ccfls, UV ccfls, and inverters for above. And what do you know, they have a product listing with pictures right on their page. With pdf catalogs. And links to their ditributors, which allow online ordering. I am shocked, and very pleased. Plus here’s the greatest part: The prices for the tubes are $15 for the most expensive type they have , with $10.29 being the cheapest (and for most of them, I should say) each. Now, the only problem is that they list them by specification, and I don’t have the specifications for my current lamp. But I know who will. The manufacturer of my inverter board. Dissecting it from my LCD screen once more, I gaze over it carefully for a long time. (I can’t tell if there is a capacitor in it or not, though I assume if there is it is discharged) Markings on the back indicate ‘Delta,’ and so I pull a google on Delta Electronics. Instantly, I come up with a Taiwanese company that produces a number of electronics components. And after some searching, I find the inverters. I know who made it, for sure. And after peering over their parts listing, I peer at the part no. on my board, and search for that. No luck. It doesn’t appear to be manufactured anymore. (This laptop is old. ‘97, at best.) I sent an e-mail tonight to their US technical support rep, requesting specifications on this very board. I’ll have to wait until next week for a response, though. However, I did find a similar part-numbered component on their site, and so I may base my tube decision on that if I receive no response, or no help. (Really, I can make a best guess anyways. There aren’t many choices for the length I need.) So once I get the specifications, I’ll be able to order the lamp from one of JKL’s distributors, get it, and simply install it. That’s it. From reading the instructions on several other websites about replacing them, I may or may not have to resolder the leads to the lamp to the inverter board connector. No biggie there, though. Once that’s done, I should have a perfectly functional laptop LCD screen again. Assuming, of course, that the inverter board isn’t bad. But then, at least I know who manufactures them now. Anatomy of an LCD Screen (for laptops) A laptop LCD screen is comprised of several basic elements. As a whole, you have your LCD screen itself, a backlight bulb, and an inverter. (Not counting the controller boards and such for controlling your video.) LCD screens will always vary. Configurations are wide and broad. In general, though, they will always have the above. LCD The LCD screen itself is what presents the image. With no power to the monitor, you have a black screen, which looks really slick. It is comprised of several layers of various elements, housed in a metal bezel. Either on the sides, or the top/bottom of the screen, a reflector is mounted with the backlight. The elements of the LCD screen include (from back to front, visually), the mirror/reflector of the backlight. Usually a very high-reflective metal, or similar setup; sometimes, the mirror may be the only source of light, and there will be no secondary light source. This is why some LCD screens do not work in the dark. On top of the mirror is a polarization filter (to only allow light to pass in one direction), and then a sheet of glass (or some transparent polymer). Next is one of the most important components. Essentially, there are two sheets of transparent electrodes, with liquid crystal sandwiched between them. These many, many electrodes will change the orientation of the crystals, to allow/disallow light to pass through them. (Because of this orientation, this is also why LCD screens will appear to be in odd colors, or darker, when viewed at non-standard angles. The properly orientated crystals will now be under the wrong colors, or orientated in such a way so as not to allow the light to shine any way but directly forward.) On top of the outer layer of transparent electrodes is another sheet of glass or polymer, with a polarized filter on it. You may or may not have another layer on top of this, for simple protection purposes. The rear sheet of glass, before the mirror, will be made with various different methods. Either it will be constructed in such a way so as to diffuse the light evenly from the rear over the entire pane with methods I don’t entirely understand myself, or it will just be opaque on one side (generally, the side opposite the mirror), hence diffusing naturally. Now, you can get gray shades by making the crystals only change orientation partially. (Hence allowing x% of the light to go through; otherwise it’s 0% or 100%.) You can get color by adding more filter layers. (IE, the three primaries used,arranged each as a pixel, with each color affected by a electrode.) An interesting note is that you can use a magnifying glass to view the spaces between where the electrodes operate. They appear black. Also, the layout of the color pixels is RGB; Red-Green-Blue. The same theory applies to regular CRTs; only they use an electron gun and I don’t really know what else. Anyways. The only other parts of your screen are the various controller boards, which vary by manufacturer. These control which pixels do what. Yay. Backlight The backlight is just a fluorescent lamp. Basically. The technical name for it, generally, is the Cold Cathode Fluorescent Lamp, or CCFL. It is this lamp which brightens your screen in the dark. (There is another kind found in older PDAs and watches, called Electroluminescant; but that relies on a different method.) The lamp(s) will be mounted on the top and bottom of your screen, or on the sides. If you only have one, chances are it will be on top. With most screens, the CCFL will be part of the LCD screen itself; in others, it wi"
