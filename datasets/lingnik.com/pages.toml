title = "Lingnik : Taylor J. Meek"
description = "Taylor is a senior software engineering manager who used to write software, do things with machine learning and linguistics, and mess around with servers. He fancies the outdoors and is grateful that Portland, OR has so much of it. He currently works for Heroku, a Salesforce company, where he leads the Heroku Tools Team--a stellar group of Ruby and Go engineers who build internal tools and services that help our colleagues focus on what they do best. Although he enjoys talking about himself in the third person, he'd rather be talking to you face-to-face. Stupid pandemic."
full_description = "That door wasn't there a minute ago. Even now, you aren't certain it's really real. As you push against it, soft dust smears on your hand. It creaks like a trope. Beyond, a room filled with strange curios, more dust, cobwebs, broken windows, even more dust, and the occasional missing floorboard. You step forward into an ancient, forgotten space. The smell of must and and old permeates your nose. Should have worn your mask after all. These relics of my past websites are pretty much abandoned. Some things might not work for you, but some may! Enjoy spelunking. The meaning and purpose behind this content is left as an exercise to the reader. Taylor is a senior software engineering manager who used to write software, do things with machine learning and linguistics, and mess around with servers. He fancies the outdoors and is grateful that Portland, OR has so much of it. He currently works for Heroku, a Salesforce company, where he leads the Heroku Tools Team--a stellar group of Ruby and Go engineers who build internal tools and services that help our colleagues focus on what they do best. Although he enjoys talking about himself in the third person, he'd rather be talking to you face-to-face. Stupid pandemic."
