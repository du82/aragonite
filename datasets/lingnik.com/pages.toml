title = "Reverse Engineering the Yaesu VX-8DR GPS Interface | Lingnik : Taylor J. Meek"
description = "UPDATE 2014-04-13 David Fannin built on this work and came up with some Arduino code that interfaces between the VX-8DR and a Ublox GPS module. You can see m..."
full_description = "UPDATE 2014-04-13 David Fannin built on this work and came up with some Arduino code that interfaces between the VX-8DR and a Ublox GPS module. You can see more information at his project’s github page. Incompatible, Proprietary, and Non-Standard Garmin GPSMAP 60CSx Serial Interface Yaesu VX-8DR Serial Interface Sending GPS NMEA Strings to the Yaesu VX-8DR The NMEA 0183 Standard VX-8DR NMEA Handshake NMEA Address Field Proprietary Message Codes $GPGGA Messages - GPS Time, Position, and Fix Data Our Garmin $GPGGA Sample $GPRMC Messages - GNSS Time, Date, Position, Course, and Speed If it doesn’t conform, what is the right way to do it? VX8R Yahoo Group Yaesu VX-8DR $GPGGA NMEA Sentence Syntax Yaesu VX-8DR $GPRMC NMEA Sentence Syntax Yaesu VX-8DR $GPZDA NMEA Sentence Syntax How different is the Yaesu from the Garmin? What about those other messages the Yaesu supports? Summary Yaesu VX-8DR NMEA Controller I finally got my Technician Class amateur radio operator license (KG7BBG) last week, and I’ve been sitting on a Yaesu VX-8DR radio for about a year waiting to use it until now. My first time on the air was an APRS beacon transmission, which was cool and all, getting to see my location at aprs.fi. However, the VX-8DR is notoriously cumbersome to manually enter latitude and longitude coordinates. The OEM GPS module for this radio retails at $160 for the module and mount, and the internal antenna is notorious for being mounted in such a way that if you wanted to get good coverage, you would have to lay the radio down on its back.(Source) Sitting in one of my boxes, however, is a Garmin GPSMAP 60CSx GPS receiver with an RS232 serial interface (with a proprietary connector) for NMEA data. So naturally, I want to use this piece of equipment I already have in lieu of spending another $160 for something that doesn’t work very well. This does mean that using GPS-fed APRS will be a little more cumbersome, since I’ll have to carry a second piece of equipment (and also, as I think we’ll see, a converter module). Incompatible, Proprietary, and Non-Standard The first discovery I had was that the serial interfaces on these two devices is incompatible, and cannot be connected together directly. But before we get to that, here’s some technical information on these two devices. Garmin GPSMAP 60CSx Serial Interface The Garmin 60CSx has a round plug on the back with a four-pin interface. This is a proprietary interface which has several cabling options, such as a bare cable (010-10082-00, $20.83 on Amazon) ready for custom wiring integrations. In order to mock this up, I built a simple interface cable out of the hand-hacked equivalent of Adafruit’s female-male extension jumper wires. (I only had male-male and female-female, so I soldered half of a male to half of a female.) The white wire in this photo is the transmit pin from the Garmin, and the black wire is ground. With this, I was able to connect this to my PC using an RS232 serial-to-USB adapter, and, using PComm Lite Terminal Emulator from MOXA, capture the NMEA strings off the device. I configured the 60CSx (Setup>Interfaces) to output NMEA formatted data and in the advanced settings (Menu>Advanced NMEA Setup), enabled only GPS Status, Waypoint/Route, and left Lat/Lon precision at 4 digits. The 60CSx only supports 4800 baud on the NMEA serial interface, so I used the settings 4800/8/N/1 in PComm, and retrieved the following raw data. I’ve highlighted the relevant strings for what we’ll need later. $GPRTE,1,1,c,*37 $GPRMC,024006,A,1234.5678,N,12345.6789,W,3.3,26.2,100213,17.4,E,D*08 $GPRMB,A,,,,,,,,,,,,V,D*19 $GPGGA,024006,1234.5678,N,12345.6789,W,2,07,1.6,65.5,M,-20.2,M,,*49 $GPGSA,A,3,,03,,,07,08,10,13,16,,23,,1.8,1.6,0.9*3C $GPGSV,3,1,12,02,01,290,00,03,27,101,18,05,07,327,00,06,23,079,00*72 $GPGSV,3,2,12,07,60,277,33,08,30,259,23,10,43,280,21,13,78,098,17*79 $GPGSV,3,3,12,16,36,050,15,19,11,120,00,23,49,123,16,48,36,194,30*7F $GPGLL,1234.5678,N,12345.6789,W,024006,A,D*51 $GPBOD,,T,,M,,*47 $GPVTG,26.2,T,8.7,M,3.3,N,6.1,K,D*18 $HCHDG,8.7,,,17.4,E*14 $GPRTE,1,1,c,*37 The 60CSx supports NMEA 0183 version 3.01, and the manual goes more into detail on the sentences it supports. Yaesu VX-8DR Serial Interface The Yaesu VX-8DR has a round plug on the top with seven-pin interface. This is a proprietary interface with several cabling options, such as a bare cable (CT-M11, $23.95 on Universal Radio) ready for custom wiring integrations. In order to mock this up, I used a Maxton RPC-Y8R-UF programming cable I picked up from G4HFQ (I can’t find the link to buy these cables on his site anymore, however). This is essentially an FTDI cable, which in this case is a three-wire interface (Ground, Rx, and Tx) at 3.3V levels. RS232 is a 5V%2B interface, which exposes the incompatibility between these two devices. The CT-M11 cable from Yaesu exposes all of the pins, which is useful for integrating a custom microphone/speaker interface along with GPS/programming. At this point, I can connect the VX-8DR to my PC and, using PComm, transmit data to the radio over serial. Configuration settings are 9600/8/N/1 (NOT 4800 baud, another point of incompatibility between these two devices). Enter the APRS GPS menu (press ‘MENU’ once). You will see a compass with no arrow and empty coordinate fields. Sending GPS NMEA Strings to the Yaesu VX-8DR Now that we can connect to the VX-8DR over 9600-baud 3.3V FTDI serial, we can send a string to the device with PComm Lite. Let’s try the NMEA $GPGGA string from the Garmin directly – paste it (CTRL%2BALT%2BP) into the session, and press ENTER to send it. $GPGGA,013622,1234.5678,N,12345.6789,W,2,09,0.9,00078,M,0020,M,,*49 The Yaesu spits out some information the first time you send it a serial message. Also, the Yaesu displays something on its display! That’s weird. The latitude and longitude are garbled, and speed/altitude are empty. Time to figure out what we sent means, and what we received means. The NMEA 0183 Standard The NMEA 0183 standard is a product of the National Marine Electronics Association. It’s a proprietary standard, and costs $250 to obtain. Thanks to the wonders of the internet, this is not a major hindrance. As explained before, the Garmin 60CSx uses NMEA 0183 version 3.0.1. The Yaesu VX-8DR’s version is not published, but we can try to infer it by doing a little research on the model used in the FGPS-2. Allegedly, the unit is a Position GPS-72(C). Datasheets are hard to find from this company, but we can find a Position GPS-72 summary sheet (translated, original in Japanese). Unfortunately, this doesn’t tell us what version of NMEA it supports. Let’s hope it uses something compatible with version 3.01. From here on out, you need to understand that every NMEA sentence needs to include a carriage return (CR) and line feed (LF) at the end of each transmission. This is equivalent to hitting ENTER in a terminal session, assuming your application settings are correct. VX-8DR NMEA Handshake Let’s look at what the VX-8DR sends us first: $PSRF106,21*0F $PSRF103,0,0,1,1*25 $PSRF103,1,0,0,1*25 $PSRF103,2,0,0,1*26 $PSRF103,3,0,0,1*27 $PSRF103,4,0,2,1*22 $PSRF103,5,0,0,1*21 $PSRF103,8,0,0,1*2C NMEA Address Field $PSRFnnn: The first field is called the “address”, and it is broken down as follows: $: The first character in an NMEA message is either $ or !, and marks the beginning of a new sentence. $ identifies a sentence that conforms to a format of a delimited series of parameters. PSRF: The second character, a P, followed by a three-character manufacturer code, indicates that this is a Proprietary Address Field registered with SRF(Source), or SiRF Technology. There are two other types of Fields: Approved Address Fields (things like GPGGA, which we sent to the radio), and Query Address Fields (which always start with a Q), which are used to ask another device to send it some information. NMEA is extremely complex in this regard. It doesn’t just support GPS (it supports things like engine room monitoring, electronic chart systems, and radar), so there are a whole host of possible commands that are perfectly valid in NMEA, but would be ignored by a device that doesn’t support them. The VX-8DR doesn’t really have a SiRF chip inside it, although it may have code provided by SiRF. Or an engineer just emulated existing SiRF modules. There’s no way to know without having access to the firmware source code. nnn: The proprietary message code is the remainder of the address field. It is a unique code that indicates the type of command or message being sent. Proprietary Message Codes 106/103: The proprietary message codes that the Yaesu advertises are as follows, and the meaning of the specific instances we received: 106: The proprietary message code 106 is a command from the radio that specifies the GPS datum to use. 21 = WGS84(source). 103: The proprietary message code 103 is a command from the radio that specifies which NMEA messages to send and how often(source). 0=GGA, 1=GLL, 2=GSA, 3=GSV, 4=RMC, 5=VTG, 8=ZDA (if 1PPS output is supported)(sup). The second field (0) is SetRate, the third (1, 0, 2) is the rate in seconds, and the fourth enables (1) or disables (0) the checksum. The number after the asterisk ( * ) is the checksum for the command. The handshake sentences that the Yaesu VX-8DR sends mean it is asking the GPS receiver to use GPS datum WGS84, to transmit GGA every second, to transmit RMC every 2 seconds, and to send a checksum with those messages. We don’t know whether other messages would normally be passed between the FGPS-2 and the VX-8DR, for example to negotiate a different baud rate, so we can’t assume it’s safe to use messages other than the ones it advertises. Based on this, we know that the unit may support other messages, but it is expecting GGA and RMC to update its information. So let’s look at what those two sentences look like. $GPGGA Messages - GPS Time, Position, and Fix Data Much like the handshake, these sentences follow a fixed format as well. As before, we have an address. This time it is an Approved Address Field. Approved Address Fields beginning with GP indicate the position is GPS based. GGA is the Sentence Formatter, specifically, the GPS Fix Data Sentence Formatter. GGA retrieves time, position, and fix related data for a GPS receiver. It should be formatted like this: $--GGA,hhmmss.ss,llll.ll,a,yyyyy.yy,a,x,xx,x.x,x.x,M,x.x,M,x.x,xxxx*hh It also must be terminated with a Line-Feed and Carriage-Return character – in our terminal emulator, this is the equivalent of hitting the ENTER key. Our Garmin $GPGGA Sample Let’s break down what we sent. The format of the GGA messages should be as follows, and I’ve broken down the message we were sending.(source) $GPGGA,013622,1234.5678,N,12345.6789,W,2,09,0.9,00078,M,0020,M,,*49 $GPGGA,hhmmss.ss,llll.ll,a,yyyyy.yy,a,x,xx,x.x,x.x,M,x.x,M,x.x,xxxx*kk` $GPGGA, hhmmss.ss = UTC of position 013622, llll.ll = latitude of position 1234.5678, a = N or S N, yyyyy.yy = Longitude of position 12345.6789, a = E or W W, x = GPS Quality indicator (0=no fix, 1=GPS fix, 2=Dif. GPS fix) 2, xx = number of satellites in use 09, x.x = horizontal dilution of precision 0.9, x.x = Antenna altitude above mean-sea-level 00078, M = units of antenna altitude, meters M, x.x = Geoidal separation 0020, M = units of geoidal separation, meters M, x.x = Age of Differential GPS data (seconds) , xxxx = Differential reference station ID *49 kk = checksum It is worth noting that the spec says .ss, .ll, and .yy are all optional, and there are no minimum or maximum requirements on precision. Leading 0s are always required to maintain fixed length. For variables numbers (such as altitude or dilution of precision), the decimal point and decimal fractions are also optional. At this point, our sentence appears to conform to the specification. If the sentence we sent the Yaesu was valid, but it did not extract the altitude data from the message, that must mean the VX-8DR does not conform to the NMEA standard. That is bad – it means that now we have to figure out what the Yaesu is expecting. (This is also a poor engineering choice. Cutting corners happens all the time in software engineering, but when you have a closed interface and proprietary hardware that magically work with the device, this kind of choice is exactly how you keep it closed. Some frustrated part of me wants to say this was intentional, and that a product manager at Yaesu chose to lock consumers into their hardware to make more profit.) We’ll have to figure that sentence structure out later. Thankfully others have already done part of the job. We’ll come back to that, but we have one more required and advertised sentence to examine. $GPRMC Messages - GNSS Time, Date, Position, Course, and Speed RMC, Recommended Minimum Specific GNSS Data, retrieves time, date, position, course, and speed data. RMC is unique in that it is often accompanied by RMB, which handles destination waypoints. This isn’t required by the Yaesu, and there’s no advertisement that it is supported either. The format for RMC messages is: $--RMC,hhmmss.ss,A,llll.ll,a,yyyyy.yy,a,x.x,x.x,xxxxxx,x.x,a,a*hh 1 = UTC of position fix 2 = Data status (V=navigation receiver warning) 3 = Latitude of fix 4 = N or S 5 = Longitude of fix 6 = E or W 7 = Speed over ground in knots 8 = Track made good in degrees True 9 = UT date 10 = Magnetic variation degrees (Easterly var. subtracts from true course) 11 = E or W 12 = Checksum Again, the spec optionality, precision, and padding requirements stay the same. Let’s try sending a message to the Yaesu. We’ll start from scratch. $GPGGA,013622,1234.5678,N,12345.6789,W,2,09,0.9,00078,M,0020,M,,*49 $GPRMC,013622,A,1234.5678,N,12345.6789,W,1.1,63.5,100213,17.4,E,D*0F Same result as before. Garbage on the screen, and more importantly, speed is not displayed, which was a crucial part of GPRMC. The Yaesu does not conform with these messages either. If it doesn’t conform, what is the right way to do it? At this point, I’m wishing I had that $160 GPS module. I would hook it up and sniff the messages between the VX-8DR and the FGPS-2, because there may be 1) more to the handshake than we witnessed, and 2) some unique formatting the Yaesu expects NMEA messages to be in. Others have picked up on 2), as we’ll see shortly. VX8R Yahoo Group Some very useful information can be gleaned from the work of others. In particular, EA2CXK posted some extremely helpful information. In particular, some sample raw messages from the FGPS-2: $GPZDA,123223.000,30,10,2011,,*55 $GPGGA,123223.000,4131.2334,N,00021.1216,E,1,04,02.7,00123.4,M,0051.7,M,000.0,0000*41 $GPRMC,123223.000,A,4131.2334,N,00021.1216,E,0000.00,291.33,301011,,*3E As it turns out, the Yaesu does expect a certain format for its messages. Let’s compare these with our original Garmin messages. Message Type Source Sentence $GPGGA Garmin $GPGGA,013622,1234.5678,N,12345.6789,W,2,09,0.9,00078,M,0020,M,,*49 FGPS-2 $GPGGA,123223.000,4131.2334,N,000"
