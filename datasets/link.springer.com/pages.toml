n" priceInfo.hidden = "hidden" } else { toggle.click() } }) } initialStateOpen() if (window.buyboxInitialised) return window.buyboxInitialised = true initKeyControls() })() ;(function () { dataLayer.push({ "ecommerce": { "currency": "USD", "impressions": [{ "name" : "Managing your Mental Health during your PhD", "id" : "978-3-031-14194-2", "price" : 19.99, "brand" : "Springer International Publishing", "category" : "Mental Health", "variant" : "ebo", "quantity" : 1 }, { "name" : "Managing your Mental Health during your PhD", "id" : "978-3-031-14193-5", "price" : 24.99, "brand" : "Springer International Publishing", "category" : "Mental Health", "variant" : "print", "quantity" : 1 }] } }) })() Other ways to access Licence this eBook for your library Institutional subscriptions About this book This book explores the PhD experience as never before and provides a “survival guide” for current and prospective PhD students. The book investigates why mental health issues are so common among the postgraduate population, going beyond the statistics, looking at lived experience of both the author and as well as current PhD students, who have found balancing mental wellness with the PhD endeavour challenging.The author discusses tips and tricks she wished she had known at the start of her PhD process for managing mental health, such as managing imposter feelings, prioritising workload, and self-care strategies to help others throughout their own journey.The book goes beyond typical mental health discussions (where the focus for improving mental health is placed on PhD students to become “more resilient”) and explores some of the often unspoken environmental factors that can impact mental health. These include the PhD student-supervisor relationship, the pressure to publish, and deep systemic problems in academia, such as racism, bullying and harassment. Finally, the book is a call to action, providing tangible improvements from the author’s perspective that university institutions can make to ensure that academia is a place for all to thrive. Similar content being viewed by others Intrapersonal Wellbeing and the Academic Mental Health Crisis Chapter © 2019 Evaluating Mental Health and Wellbeing of Postgraduate Researchers: Prevalence and Contributing Factors Article Open access 22 December 2021 Student wellness trends and interventions in medical education: a narrative review Article Open access 23 March 2022 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739737176, embedded_user: 'null' } }); Keywords Mental Health PhD Postgraduate Research Survival Well-being #AcademicMentalHealth Workplace Stress Search within this book Search Table of contents (12 chapters) Front Matter Pages i-xix Download chapter PDF Defining the Problem Front Matter Pages 1-1 Download chapter PDF Introduction Zoë J. Ayres Pages 3-12 Challenging Perceptions: What Is Mental Health Anyway? Zoë J. Ayres Pages 13-23 Setting the Scene: Understanding the PhD Mental Health Crisis Zoë J. Ayres Pages 25-37 Mindset Matters Front Matter Pages 39-39 Download chapter PDF Self-Care: Without You There Is No PhD Zoë J. Ayres Pages 41-60 Not Another Yoga Session: University Wellbeing Programs and Why They so Often Miss the Mark Zoë J. Ayres Pages 61-70 “I’ll Read It Later” and Other Lies We Tell Ourselves: Managing Expectations and Guilt Zoë J. Ayres Pages 71-83 Why You Earned It: Fighting the Impostor Zoë J. Ayres Pages 85-100 Environmental Stressors Front Matter Pages 101-101 Download chapter PDF Dismantling the Ivory Tower: Systemic Issues That Might Impact Your Mental Health Zoë J. Ayres Pages 103-134 Perhaps It’s Not You It’s Them: PhD Student-Supervisor Relationships Zoë J. Ayres Pages 135-154 Publish or Perish: On the Myth of Meritocracy Zoë J. Ayres Pages 155-170 The High-Walled Rose Garden: Understanding There Is Life Outside the Academy Zoë J. Ayres Pages 171-181 Seeking Help Front Matter Pages 183-183 Download chapter PDF Thriving, Not Just Surviving Zoë J. Ayres Pages 185-198 Back Matter Pages 199-199 Download chapter PDF Back to top Authors and Affiliations Rugby, UK Zoë J. Ayres About the author Zoë Ayres (PhD) is an analytical scientist by background, with a PhD in electrochemical sensor development. After spending several years as a postdoctoral researcher in academia post-PhD, she now works in industry as a Senior Scientist. Additionally, Zoë is a mental health advocate, spurred on by experiencing mental illness herself during her PhD. Her advocacy work focuses on improving mental health in research settings, primarily focusing on PhD mental health. She raises awareness of the common issues PhD students face through various campaigns and initiatives, and can be found under the handle @zjayres on Twitter. Bibliographic Information Book Title: Managing your Mental Health during your PhD Book Subtitle: A Survival Guide Authors: Zoë J. Ayres DOI: https://doi.org/'''
