 and financial technology valuation. Special topics also covered include Moore’s law, S-curves, the singularity and fundamental limits to technology. Ideal for university courses in engineering, management, and business programs, as well as self-study or online learning for professionals in a range of industries, readers of this book will learn how to develop and deploy comprehensive technology roadmaps and R&D portfolios on diverse topics of their choice.Introduces a unique framework, Advanced Technology Roadmap Architecture (ATRA), for developing quantitative technology roadmaps and competitive R&D portfolios through a lucid and rigorous step-by-step approach;Elucidates the ATRA framework through analysis which was validated on an actual $1 billion R&D portfolio at Airbus, leveraging a pedagogy significantly beyond typical university textbooks and problem sets;Reinforces concepts with in-depth case studies, practical exercises, examples, and thought experiments interwoven throughout the text;Maximizes reader competence on how to explicitly link strategy, finance, and technology.The book follows and supports the MIT Professional Education Courses “Management of Technology: Roadmapping & Development,” https://professional.mit.edu/course-catalog/management-technology-roadmapping-development and “Management of Technology: Strategy & Portfolio Analysis” https://professional.mit.edu/course-catalog/management-technology-strategy-portfolio-analysis Similar content being viewed by others Technology Cycles Chapter © 2016 Technology Cycles Chapter © 2018 Roadmapping for Strategic Alignment, Integration and Synchronization Chapter © 2023 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739733326, embedded_user: 'null' } }); Keywords Technology Roadmapping S-Curve Exponential Progress Technology Scouting Technology Transfer Technology Management R&D Portfolio Management