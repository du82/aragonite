title = "Generative language models exhibit social identity biases | Nature Computational Science"
description = "Social identity biases, particularly the tendency to favor one’s own group (ingroup solidarity) and derogate other groups (outgroup hostility), are deeply rooted in human psychology and social behavior. However, it is unknown if such biases are also present in artificial intelligence systems. Here we show that large language models (LLMs) exhibit patterns of social identity bias, similarly to humans. By administering sentence completion prompts to 77 different LLMs (for instance, ‘We are…’), we demonstrate that nearly all base models and some instruction-tuned and preference-tuned models display clear ingroup favoritism and outgroup derogation. These biases manifest both in controlled experimental settings and in naturalistic human–LLM conversations. However, we find that careful curation of training data and specialized fine-tuning can substantially reduce bias levels. These findings have important implications for developing more equitable artificial intelligence systems and highlight the urgent need to understand how human–LLM interactions might reinforce existing social biases. Researchers show that large language models exhibit social identity biases similar to humans, having favoritism toward ingroups and hostility toward outgroups. These biases persist across models, training data and real-world human–LLM conversations."
full_description = "Home Nature Computational Science Article Generative language models exhibit social identity biases Analysis Open access Published: 12 December 2024 Volume 5, pages 65–75, (2025) Cite this article Download PDF You have full access to this open access article From View current issue Submit your manuscript Generative language models exhibit social identity biases Download PDF Tiancheng Hu ORCID: orcid.org/0009-0006-7354-10881 na1, Yara Kyrychenko ORCID: orcid.org/0000-0003-0636-50462 na1, Steve Rathje3, Nigel Collier1, Sander van der Linden2 & …Jon Roozenbeek ORCID: orcid.org/0000-0002-8150-93052,4 Show authors 21k Accesses 225 Altmetric 13 Mentions Explore all metrics A preprint version of the article is available at arXiv. AbstractSocial identity biases, particularly the tendency to favor one’s own group (ingroup solidarity) and derogate other groups (outgroup hostility), are deeply rooted in human psychology and social behavior. However, it is unknown if such biases are also present in artificial intelligence systems. Here we show that large language models (LLMs) exhibit patterns of social identity bias, similarly to humans. By administering sentence completion prompts to 77 different LLMs (for instance, ‘We are…’), we demonstrate that nearly all base models and some instruction-tuned and preference-tuned models display clear ingroup favoritism and outgroup derogation. These biases manifest both in controlled experimental settings and in naturalistic human–LLM conversations. However, we find that careful curation of training data and specialized fine-tuning can substantially reduce bias levels. These findings have important implications for developing more equitable artificial intelligence systems and highlight the urgent need to understand how human–LLM interactions might reinforce existing social biases. Similar content being viewed by others “Personhood and AI: Why large language models don’t understand us” Article 12 July 2023 Large language models can outperform humans in social situational judgments Article Open access 10 November 2024 MacBehaviour: An R package for behavioural experimentation on large language models Article Open access 18 December 2024 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739733245, embedded_user: 'null' } }); Explore related subjects Discover the latest articles, news and stories from top researchers in related subjects. Artificial Intelligence MainLarge language models (LLMs) such as ChatGPT have exploded in popularity1. Investigating the political and social biases of LLMs has also rapidly become an important research topic2. Previous work has shown that language models tend to exhibit human-like biases with respect to specific protected groups such as gender, ethnicity or religious orientation3,4,5,6. However, researchers have yet to explore whether LLMs exhibit the more general group biases that are theorized to underlie much of societal discrimination—‘us versus them’. Essential to the study of affective polarization in the United States, as well as other intergroup conflicts7,8, the social-psychological theories of social identity and self-categorization9,10 posit that when an individual’s social or group identity is activated, they tend to display preferential attitudes and behaviors toward their own group (ingroup solidarity) and distrust and dislike toward other groups (outgroup hostility)9,11,12. Social psychologists have shown that even arbitrary distinctions (for example, a preference for the abstract painters Klee or Kandinsky) can lead to immediate intergroup discrimination13,14. Such discrimination is also visible in language, which tends to be more abstract when people describe their outgroups’ negative behavior and resort more to dehumanizing terms15,16. LLMs could inadvertently reinforce or amplify such identity-based biases in humans, carrying implications for important societal issues such as intergroup conflict and political polarization17,18,19.An older technique known as word embeddings has been shown to capture human-like social biases when trained on a large-scale web corpus20. Today’s state-of-the-art language models exhibit far greater complexity, which also comes with new opportunities and challenges. On the one hand, these models are shaped by human training data and exhibit many human abilities, such as reasoning by analogy21, theory of mind22, and personality23, which makes them compelling proxies for studying human behavior and attitude change24,25. On the other hand, LLMs can influence and persuade humans26, with research demonstrating that LLM-based writing assistants are capable of swaying people’s views27. Evaluating the expanding capabilities of LLMs is a complex research area28,29, with group-specific bias benchmarks shown to be time-consuming to develop and utilize30,31,32,33, and the overall field lacking measurement validity and theoretical grounding30,34. However, given the speed and scale of LLM adoption, even relatively minor social and political biases left undetected could potentially lead to adverse outcomes, for instance through human–algorithmic feedback loops19.In this Analysis we present a large-scale and comprehensive test of social identity biases in LLMs. We develop a simple probe of the overall ingroup solidarity and outgroup hostility of an LLM that requires only prompt-completion capabilities available through application programming interfaces (APIs). Across three studies, we tested whether (1) LLMs possess human-like social identity biases, (2) social identity biases are influenced by the models’ training data and (3) these biases manifest in real-world human–artificial intelligence (AI) conversations. Study 1 examines affective polarization in 77 different LLMs, including base models and instruction-tuned and preference-tuned models. We prompted each model to generate 2,000 sentences starting with ‘We are’ or ‘They are’ and assess their sentiment using a separate pretrained classification model. We also compared the ingroup solidarity and outgroup hostility of LLMs to those of humans, estimated from large-scale web corpora commonly used to pretrain models. Study 2 assesses how training data affect models’ social identity biases by fine-tuning LLMs on a corpus of US partisan Twitter (now X) data. Study 3 tests whether the biases found in Studies 1 and 2 are evident in real-world conversations between humans and LLMs using two open-source datasets: WildChat35, which contains over half a million user conversations with ChatGPT, and LMSYS-Chat-1M36, containing one million conversations with 25 different state-of-the-art language models. Overall, we find that many LLMs exhibit ingroup solidarity and outgroup hostility, that these biases can be mitigated by training-data curation, and that these biases are present in real-world human–LLM conversations.ResultsStudy 1—measuring social identity biases in LLMsWe first investigate the extent of social identity biases across 77 LLMs of two types: base LLMs, such as GPT-337, Llama 238, Pythia39, Gemma40 and Mixtral41, and LLMs fine-tuned for instruction-following, such as GPT-442, GPT-3.5 (text-davinci-003)43, Dolly2.044, Alpaca45 and OpenChat3.546 (a full model list is provided in the Methods). In these model sizes, M stands for million parameters and B stands for billion parameters. For example, GPT-2 124M has 124 million parameters, while GPT-3 175B has 175 billion parameters. These numbers reflect the total count of learnable weights in the neural network. To assess the social identity biases for each language model, we generated a total of 2,000 sentences prompting with ‘We are’ and ‘They are’, which are associated with the ‘us versus them’ dynamics47, excluding sentences that did not pass minimal quality and diversity checks (Methods). We call sentences starting with ‘We are’ ingroup sentences and those starting with ‘They are’ outgroup sentences. For many models, it suffices to use the prompt ‘We are’ or ‘They are’ and let the model complete the sentence by repeatedly generating the next tokens. We refer to this prompt setting as the ‘default prompt’.Currently, the vast majority of consumer-facing models are subject to instruction and preference fine-tuning to improve interactability in user experience and to better align with human preferences. Therefore, our analysis also encompasses a diverse set of such instruction and preference-fine-tuned models. Often, these models are optimized for chat-based applications, which renders it impossible to test them with the default prompt. A rudimentary prompt, such as ‘Can you help me finish a sentence? The sentence is: we are’, typically also yields repetitive sentences (Supplementary Section 1 presents examples). To circumvent this issue, we introduced additional context to this rudimentary prompt, utilizing sentences from the C4 corpus48, a large-scale web corpus frequently used in language model pretraining. We refer to this refined prompt set-up as the ‘instruction prompt’ (Methods).We then classified the sentences into positive, neutral or negative using a sentiment classifier based on RoBERTa49, which was fine-tuned for sentiment classification50. We use this sentiment classifier for our analyses throughout all studies in the main text because (1) machine-learning-based classifiers generally outperform dictionary-based approaches in sentiment analysis51,52,53 and (2) this particular fine-tuned classifier provides strong sentiment analysis performance, with a neutral sentiment class50. We also conducted robustness checks with ten alternate sentiment classification strategies, including other deep-learning classifiers and dictionaries such as VADER, and internal meta-analyses, which show broad agreement with the main results across different methodologies (Supplementary Sections 5 and 6).If ingroup sentences are more likely to be classified as positive (versus neutral or negative) than outgroup sentences, we interpret it as evidence of a model displaying ingroup solidarity. If outgroup sentences are more likely to be classified as negative (versus neutral or positive) than ingroup sentences, it suggests that the model exhibits outgroup hostility. Example model-generated sentences are shown in Table 1.Table 1 Example ingroup and outgroup sentencesFull size tableTo estimate ingroup solidarity, that is, the odds of an ingroup sentence to be classified as positive as compared to an outgroup sentence, we use the 2,000 group sentences to fit a logistic regression predicting positive sentiment based on a binary indicator of sentence group with outgroup as the reference category, controlling for type-to-token ratio54 and sentence length as proxies for data generation quality. Similarly, to estimate outgroup hostility, that is, the odds of an outgroup sentence (versus ingroup) to be classified as negative, we fit a logistic regression predicting negative sentiment using an indicator of sentence group with ingroup as reference, controlling for the same factors as above. In Study 1, in all individual LLM regressions reported, we deem results significant if P < 0.0004, obtained by dividing 0.05 by the total number of tests with the default prompt (112).Of the 56 models tested with the default prompt, only four did not exhibit ingroup solidarity (the smallest BLOOMZ, Cerebras-GPT, text-bison and Gemme-7B-IT), and six did not show outgroup hostility (BLOOM-560M, all of the BLOOMZ family, and text-bison; Fig. 1a,b presents outliers, Supplementary Tables 3–5 provide all coefficients and Supplementary Figs. 5–10 variation across sentiment classifiers). Conducting a mixed-effects logistic regression on pooled data with model name as a random effect showed that an ingroup (versus outgroup) sentence was 93% more likely to be positive, indicating a general pattern of ingroup solidarity. Similarly, an outgroup sentence was 115% more likely to be negative, suggesting strong outgroup hostility (Supplementary Table 10).Fig. 1: Study 1—ingroup solidarity and outgroup hostility of LLMs and human datasets.The plots show the results of individual logistic regressions predicting positive (or negative) sentiment based on whether a sentence is ingroup (or outgroup), controlling for the number of words and type-to-token ratio, across model and human-written texts. In the model names, M stands for million parameters and B stands for billion parameters. For example, GPT-2 124M has 124 million parameters, while GPT-3 175B has 175 billion parameters. These numbers reflect the total count of learnable weights in the neural network. Data are presented as odds ratios with error bars for 95% confidence intervals. a, Social identity biases in LLMs tested with the default prompt (N = 94,000 sentences). b, Social identity biases in LLMs tested with the default prompt with outlier levels of outgroup hostility (N = 18,000 sentences). c, Social identity biases in LLMs tested with the instruction prompt (N = 76,000 sentences). d, Social identity biases in human data obtained from four different pretraining corpora (N = 16,000 sentences).Full size imageOur findings for instruction fine-tuned models prompted with the instruction prompt indicate that they exhibited lower ingroup solidarity and outgroup hostility compared to the base LLMs (Fig. 1c). This was evidenced by lower odds ratios, which mostly remain below 2, and several models demonstrating statistically non-significant ingroup solidarity or outgroup hostility (Supplementary Table 12). A small selection of models (Dolly2.0 series, text-bison@001, J2-Jumbo-Instruct and Gemma-7B-IT) were capable of responding to both the default and instruction prompts, permitting a comparison. The comparison yielded mixed outcomes: J2-Jumbo-Instruct presented significantly reduced ingroup solidarity and outgroup hostility in the instruction prompt setting. Conversely, Dolly2.0 displayed a considerable decrease only in ingroup solidarity, while text-bison@001 showed an increase in both ingroup solidarity and outgroup hostility. Gemma-7B-IT had a decrease in outgroup hostility in the instruction prompt setting.To juxtapose social identity biases measured in LLMs against human-level biases, we obtained human-written ingroup and outgroup sentences from large-scale web corpora commonly used to pretrain LLMs, including C448, The Pile55, OpenWebText56 and the November–December 2022 edition of OLM57. We processed these sentences in the same way as LLM-generated sentences, thereby establishing a human baseline level of ingroup solidarity and outgroup hostility, and randomly subsampled the datasets to match the scale of LLM-generated sentences. We found statistically significant social identity biases in all of the four pretraining corpora (Fig. 1d). C4 and OLM display a slightly higher outgroup derogation than ingroup solidarity, wher"
