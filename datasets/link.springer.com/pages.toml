title = "Incidence and Prevalence of Post-COVID-19 Myalgic Encephalomyelitis: A Report from the Observational RECOVER-Adult Study | Journal of General Internal Medicine"
description = "Background Myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS) may occur after infection. How often people develop ME/CFS after SARS-CoV-2 infection is unknown. Objective To determine the incidence and prevalence of post-COVID-19 ME/CFS among adults enrolled in the Researching COVID to Enhance Recovery (RECOVER-Adult) study. Design, Setting, and Participants RECOVER-Adult is a longitudinal observational cohort study conducted across the U.S. We included participants who had a study visit at least 6 months after infection and had no pre-existing ME/CFS, grouped as (1) acute infected, enrolled within 30 days of infection or enrolled as uninfected who became infected (n=4515); (2) post-acute infected, enrolled greater than 30 days after infection (n=7270); and (3) uninfected (1439). Measurements Incidence rate and prevalence of post-COVID-19 ME/CFS based on the 2015 Institute of Medicine ME/CFS clinical diagnostic criteria. Results The incidence rate of ME/CFS in participants followed from time of SARS-CoV-2 infection was 2.66 (95% CI 2.63–2.70) per 100 person-years while the rate in matched uninfected participants was 0.93 (95% CI 0.91–10.95) per 100 person-years: a hazard ratio of 4.93 (95% CI 3.62–6.71). The proportion of all RECOVER-Adult participants that met criteria for ME/CFS following SARS-CoV-2 infection was 4.5% (531 of 11,785) compared to 0.6% (9 of 1439) in uninfected participants. Post-exertional malaise was the most common ME/CFS symptom in infected participants (24.0%, 2830 of 11,785). Most participants with post-COVID-19 ME/CFS also met RECOVER criteria for long COVID (88.7%, 471 of 531). Limitations The ME/CFS clinical diagnostic criteria uses self-reported symptoms. Symptoms can wax and wane. Conclusion ME/CFS is a diagnosable sequela that develops at an increased rate following SARS-CoV-2 infection. RECOVER provides an unprecedented opportunity to study post-COVID-19 ME/CFS."
full_description = "Home Journal of General Internal Medicine Article Incidence and Prevalence of Post-COVID-19 Myalgic Encephalomyelitis: A Report from the Observational RECOVER-Adult Study Original Research Open access Published: 13 January 2025 (2025) Cite this article Download PDF You have full access to this open access article Journal of General Internal Medicine Aims and scope Submit manuscript Incidence and Prevalence of Post-COVID-19 Myalgic Encephalomyelitis: A Report from the Observational RECOVER-Adult Study Download PDF Suzanne D. Vernon PhD ORCID: orcid.org/0000-0002-5241-89141, Tianyu Zheng MS2, Hyungrok Do PhD3, Vincent C. Marconi MD4, Leonard A. Jason PhD5, Nora G. Singer MD6, Benjamin H. Natelson MD7, Zaki A. Sherif PhD8, Hector Fabio Bonilla MD9, Emily Taylor MA10, Janet M. Mullington PhD11, Hassan Ashktorab PhD12, Adeyinka O. Laiyemo MD12, Hassan Brim PhD13, Thomas F. Patterson MD14, Teresa T. Akintonwa BA15, Anisha Sekar BA16, Michael J. Peluso MD17, Nikita Maniar MD18, Lucinda Bateman MD1, Leora I. Horwitz MD19 & Rachel Hess MD2,20 on behalf of the NIH Researching COVID to Enhance Recovery (RECOVER) ConsortiumShow authors 22k Accesses 1045 Altmetric 80 Mentions Explore all metrics AbstractBackgroundMyalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS) may occur after infection. How often people develop ME/CFS after SARS-CoV-2 infection is unknown.ObjectiveTo determine the incidence and prevalence of post-COVID-19 ME/CFS among adults enrolled in the Researching COVID to Enhance Recovery (RECOVER-Adult) study.Design, Setting, and ParticipantsRECOVER-Adult is a longitudinal observational cohort study conducted across the U.S. We included participants who had a study visit at least 6 months after infection and had no pre-existing ME/CFS, grouped as (1) acute infected, enrolled within 30 days of infection or enrolled as uninfected who became infected (n=4515); (2) post-acute infected, enrolled greater than 30 days after infection (n=7270); and (3) uninfected (1439).MeasurementsIncidence rate and prevalence of post-COVID-19 ME/CFS based on the 2015 Institute of Medicine ME/CFS clinical diagnostic criteria.ResultsThe incidence rate of ME/CFS in participants followed from time of SARS-CoV-2 infection was 2.66 (95% CI 2.63–2.70) per 100 person-years while the rate in matched uninfected participants was 0.93 (95% CI 0.91–10.95) per 100 person-years: a hazard ratio of 4.93 (95% CI 3.62–6.71). The proportion of all RECOVER-Adult participants that met criteria for ME/CFS following SARS-CoV-2 infection was 4.5% (531 of 11,785) compared to 0.6% (9 of 1439) in uninfected participants. Post-exertional malaise was the most common ME/CFS symptom in infected participants (24.0%, 2830 of 11,785). Most participants with post-COVID-19 ME/CFS also met RECOVER criteria for long COVID (88.7%, 471 of 531).LimitationsThe ME/CFS clinical diagnostic criteria uses self-reported symptoms. Symptoms can wax and wane.ConclusionME/CFS is a diagnosable sequela that develops at an increased rate following SARS-CoV-2 infection. RECOVER provides an unprecedented opportunity to study post-COVID-19 ME/CFS. Similar content being viewed by others A prospective observational study of post-COVID-19 chronic fatigue syndrome following the first pandemic wave in Germany and biomarkers associated with symptom severity Article Open access 30 August 2022 Prevalence of myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS) in Australian primary care patients: only part of the story? Article Open access 09 August 2022 Review of case definitions for myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS) Article Open access 29 July 2020 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1740890249, embedded_user: 'null' } }); Use our pre-submission checklist Avoid common mistakes on your manuscript. INTRODUCTIONMyalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS) can be triggered following acute infection. A landmark prospective study followed patients from the time of acute infection with Epstein-Barr virus, Coxiella burnetii, or Ross River virus and found that 11% met ME/CFS criteria at 6 months post-infection.1Researching COVID to Enhance Recovery (RECOVER) is a national initiative funded by the National Institutes of Health to conduct research on post-COVD-19 conditions, including postacute sequelae of SARS-CoV-2 infection (PASC), also known as long COVID.2 One component of RECOVER, the longitudinal observational adult cohort (RECOVER-Adult), reported that 85% of participants with PASC had fatigue.3 Other symptoms that PASC patients experience include post-exertional malaise (PEM), brain fog, dizziness, and unrefreshing sleep. These are consistent with the core symptoms that are diagnostic for ME/CFS that include new onset of fatigue that has persisted for at least 6 months and is accompanied by a reduction in pre-illness activities, post-exertional malaise (PEM), and unrefreshing sleep plus either cognitive impairment or orthostatic intolerance (OI).4We applied the ME/CFS clinical diagnostic criteria to (1) determine the incidence rate of post-COVID-19 ME/CFS among prospectively followed participants enrolled within 30 days of SARS-CoV-2 infection, and (2) compare the occurrence of new onset ME/CFS in participants with and without SARS-CoV-2 infection who were enrolled in the RECOVER-Adult study. We hypothesized that there would be an increased rate of ME/CFS in RECOVER-Adult participants infected with SARS-CoV-2 compared to matched uninfected participants.METHODSThe study was approved by the institutional review board at NYU Grossman School of Medicine, serving as a single institutional review board. All participants provided written informed consent. The study is registered at NCT05172024. Study Design RECOVER-Adult includes participants with and without SARS-CoV-2 infection.2 Participants with SARS-CoV-2 infection met World Health Organization suspected, probable, or confirmed criteria for infection and were enrolled in RECOVER from 83 sites in 33 states plus Puerto Rico and Washington, DC.5 Uninfected individuals did not meet any WHO criteria for infection and had a documented negative SARS-CoV-2 nucleic acid and nucleocapsid antibody test result at the time of enrollment. Participants The RECOVER-Adult study included 15,181 people enrolled as (1) acute infected, enrolled within 30 days of infection; (2) post-acute infected, enrolled greater than 30 days after infection; or (3) uninfected. As SAR-CoV-2 infections continued to occur in study participants, participants who were initially enrolled as uninfected and then became infected during the study were reclassified as acute infected for post-infection visits (n=954) and were not included in the uninfected analyses. We excluded participants people who were hospitalized for COVID-19 (n=294), those who did not respond to the symptom questionnaires (n=640), any infected participant that did not undergo a study visit ≥6-month after incident SARS-CoV-2 infection (n=773), and those with pre-existing ME/CFS (n=198 infected, n=22 uninfected). The remaining 11,785 infected participants were assigned to three groups using the first qualifying visit at least 6 months from index infection: (1) post-COVID-19 ME/CFS participants, (2) ME/CFS-like participants, and (3) participants who did not report any ME/CFS symptoms. The 1439 uninfected participants were classified to parallel the infected participant groups. Exposure The exposure was SARS-CoV-2 infection. Data Source Outcome measures were drawn from self-reported symptoms and comorbid medical conditions, as reported by participants at 3-month interval study visits.2 All data were ascertained from the September 2024 data lock. Outcome The primary outcome was new ME/CFS determined using the Institute of Medicine (IOM) ME/CFS clinical diagnostic criteria that require fatigue accompanied by physical impairment, PEM, unrefreshing sleep and either cognitive impairment or OI.4 The first symptom survey response at least 6 months, or later from first infection was used to group infected participants as post-COVID-19 ME/CFS and ME/CFS-like; for uninfected participants, we included symptoms from any survey response. Questionnaires to Assess ME/CFS Symptoms Patient-Reported Outcomes Measurement Information System (PROMIS) Global Health 10 was used to assess (1) severity of fatigue over the past 7 days and (2) physical impairment by inability to carry out daily physical activities. PROMIS Sleep Disturbance question “My sleep was refreshing” was used to assess the severity of unrefreshing sleep over the past 7 days; responses of “Not at all” or “A little bit” were considered moderate to severe unrefreshing sleep. Cognitive impairment was determined by having a self-reported Neuro-QoL cognition T-score of ≤40 (1 SD below national mean) or a raw Neuro-QoL score of <24.3,6 PEM and OI were assessed with a question asking if the participant had “post-exertional malaise (symptoms worse after even minor physical or mental effort)” (PEM) and “Feeling faint, dizzy, ‘goofy’; difficulty thinking soon after standing up from a sitting or lying position” (OI), respectively. Responses that indicated the presence of PEM or OI included “Yes, I have it NOW,” or “Yes, and I STILL HAVE IT.” Frequency and severity measures were not available for these symptoms; thus, all positive symptoms were considered qualifying. ME/CFS was defined as reporting moderate to very severe fatigue over the past 7 days plus moderate to complete interference with ability to carry out every day physical activities, AND presence of PEM, AND not at all or a little bit of refreshing sleep over the past 7 days PLUS the presence of OI and/or a Neuro-QoL cognitive T-score of <40 or raw score of <24. Those having at least one ME/CFS symptom but not meeting all the above criteria were considered ME/CFS-like.The RECOVER case definition for PASC identified four clusters composed of 44 symptoms among those with PASC.3 Cluster 1 was characterized primarily by loss/change in smell or taste, and those participants had lowest symptom burden and quality of life impairment. Nearly all participants in cluster 2 had PEM (99%); half had dizziness and gastrointestinal symptoms; none had brain fog. Cluster 3 was defined by the presence of brain fog (100%) in addition to PEM (99%) and other symptoms. Cluster 4 participants had high levels of all symptoms, including PEM, dizziness, gastrointestinal symptoms, and brain fog, and overall had the worst quality of life. We determined which cluster post-COVID-19 ME/CFS and ME/CFS-like participants were assigned to in the study visit used for analysis. Statistical Analysis RECOVER-Adult data collected between October 2021 and September 2024, and stored on the RECOVER analytic platform, Seven Bridges, were used in this analysis. Analytic groups were created using the ME/CFS criteria. Chi-square tests were used to assess differences in demographics between analytic groups and the two-sample t-test to test whether age at enrollment differed among the infected and uninfected groups. Fisher’s exact test was used to determine differences in comorbid conditions between infected and uninfected participants. All analyses were conducted by restricting infected participants to those enrolled within 30 days of the first infection and then repeated the analyses with all participants regardless of time from SARS-CoV2 infection. The incidence rate of post-COVID-19 ME/CFS was calculated among participants enrolled <30 days after acute SARS-CoV-2 infection compared to matched uninfected controls. We used propensity score matching with replacement to minimize selection bias given differences in baseline characteristics between infected and uninfected participants.7 Propensity scores were estimated using logistic regression and adjusting for potential demographic and comorbidity condition confounders that were unrelated to SARS-CoV-2 infection but had features that were related to ME/CFS (Supplemental Material Table 1). We paired each uninfected participant with the acutely infected participant who had the closest propensity score that was within 0.2 standard deviations of the logit of propensity score (“greedy matching”). Among the 1439 uninfected participants, 847 (58.9%) had no matched acute infected participants, indicating substantial differences between the characteristics of the acutely infected and uninfected cohorts. After matching, the standard mean differences (SMD) were 0.036 meaning that the propensity score matching was successful. The demographic characteristics and comorbid conditions in the acute infected and uninfected groups before and after propensity matching are provided (Supplemental Material Tables 2 and 3). The hazard ratio for acute COVID-19 infection compared with no infection was calculated. Finally, we determined which PASC cluster the post-COVID-19 ME/CFS and ME/CFS-like participants were assigned to at their first qualifying visit. We considered a two-sided P value of less than 0.05 to be statistically significant. Analyses were conducted using SAS Studio, R, and Python 3.11 with scikit-learn (1.3.1; http://scikit-learn.org), lifelines (0.29.1; https://github.com/CamDavidsonPilon/lifelines), and pymatch (0.3.4; https://github.com/benmiroglio/pymatch) packages. Table 1 Demographic Characteristics of Infected Participants of the RECOVER-Adult StudyFull size tableTable 2 Demographic Characteristics of Uninfected Participants of the RECOVER-Adult StudyFull size tableTable 3 Comorbidities in Post-COVID-19 ME/CFS and ME/CFS-like Compared to those Who Never Met ME/CFS Criteria and Total Infected and UninfectedFull size tableRESULTSME/CFS prevalence was determined among infected participants and uninfected participants (Fig. 1). Among the 11,785 infected participants, 531 (4.5%) met ME/CFS diagnostic criteria at the first study visit at least 6 months after acute SARS-CoV-2 infection; 4692 (39.8%) were ME/CFS-like, with at least one ME/CFS symptom; and 6562 (55.7%) did not report any ME/CFS symptoms. Of the 1439 uninfected participants, 9 (0.6%) met ME/CFS clinical diagnostic criteria, 232 (16.1%) had at least one ME/CFS symptom, and 1198 (83.3%) did not report any ME/CFS symptoms.Figure 1The ME/CFS clinical diagnostic criteria was applied to both infected and uninfected participants in the RECOVER Adult study groupFull size imageThe 4515 acute infected participants provided the opportunity to estimate the incidence of new post-COVID-19 ME/CFS cases. The incidence rate of ME/CFS among acute infected participants was 2.66 (95% CI 2.63–2.70) per 100 person-years, which was significantly greater than the incidence rate in the propensity score-matched uninfected participants (0.93 per 100 person-years, 95% CI 0.91–0.95) (p<.0001). This is an attributable risk of 1.74 per 100"
