el: 'specter', policy_id: 'NA', timestamp: 1739733326, embedded_user: 'null' } }); Keywords Nuclear Power Nuclear safety Nuclear Power explained How does a Nuclear Power Station work Pressurised Water Reactor Nuclear Power safety Criticality in nuclear reactor Fission Chain Reaction Reactor Start-up Reactor Shutdown Reactor Accidents Nuclear accidents Search within this book Search Table of contents (25 chapters) Front Matter Pages i-xvii Download chapter PDF One Man and His Dog Colin Tucker Pages 1-5 Physics Is Phun! Colin Tucker Pages 7-13 Being Friendly to Neutrons Colin Tucker Pages 15-23 Criticality Is Not as Bad as It Sounds Colin Tucker Pages 25-34 What Makes Nuclear Special? Colin Tucker Pages 35-41 The Thing You Put Your Reactor in… Colin Tucker Pages 43-55 Pull the Rods Out and Stand Back Colin Tucker Pages 57-67 Watt Power? Colin Tucker Pages 69-80 Your Reactor Is Stable (Part One) Colin Tucker Pages 81-90 You’ve Got to Do Something with All that Steam Colin Tucker Pages 91-103 The Big Red Button… Colin Tucker Pages 105-113 Your Reactor Is Stable (Part Two) Colin Tucker Pages 115-125 Putting a Spin on It Colin Tucker Pages 127-134 Going Up! Colin Tucker Pages 135-143 Power, and How to Change It Colin Tucker Pages 145-153 Steady Power with Nothing to Do? Colin Tucker Pages 155-165 It’s All About Safety Colin Tucker Pages 167-179 What Can Go Wrong (and What You Can Do About It) Colin Tucker Pages 181-192 Smaller Isn’t Always Easier Colin Tucker Pages 193-203 1 2 Next page Back to top Reviews “The book is great with the perfect mid-point of useful technical detail and easily understandable explanations. An excellent read for anyone interested in something a bit more in-depth than most popular science books, just so long as you go in with your brain switched on.” (Popular Science, popsciencebooks.blogspot.com, September 7, 2020)“It should be of interest to both general readers wanting to know how a nuclear reactor works, those new to the industry, and specialists wanting a broader overview. … The book is well produced, well written and the author’s enthusiasm and sense of humour come over.” (Nigel Buttery, Nuclear Future, May-June, 2020) Authors and Affiliations Wickham Market, UK Colin Tucker About the author Colin Tucker has worked in the UK nuclear industry for 30 years, most of that time at Sizewell B power station. He specialises in ‘Nuclear Safety’: the safe running of the reactor, ensuring that the station is always ready to cope with anything that might happen. Over much of his career he has spent time visiting Schools, Clubs and other venues to talk about nuclear power stations – how they work, how they can be kept safe etc. In his spare time he is a bat enthusiast and a guard and signalman on the Ffestiniog Railway. Bibliographic Information Book Title: How to Drive a Nuclear Reactor Authors: Colin Tucker Series Title: Springer Praxis Books DOI: https://doi.org/10.1007/978-3-030-33876-3 Publisher: Springer Cham eBook Packages: Physics and Astronomy, P'''
