ers have been introduced on human-computer interaction, mHealth, personal health informatics and precision medicine, while the structure of the other chapters has undergone extensive revisions to reflect the developments in the area. The organization and philosophy remain unchanged, focusing on the science of information and knowledge management, and the role of computers and communications in modern biomedical research, health and health care. Similar content being viewed by others 1.1 Clinical Informatics Chapter © 2018 What Is Informatics? Chapter © 2021 Public Health Informatics in the Larger Context of Biomedical and Health Informatics Chapter © 2020 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739733326, embedded_user: 'null' } }); Keywords Bioinformatics Biomedical Decision Making Clinical Decision-Support Systems Clinical Research Informatics Consumer Health Informatics Electronic Health Record Systems Health Information Imaging Informatics Information Technology Policy Patient Monitoring Systems Patient-Centered Care Personal Health Records Software Engineering for Health Care Telehealth big data Search within this book Search Table of contents (30 chapters) Front Matter Pages I-XLIII Download chapter PDF Recurrent Themes in Biomedical Informatics Front Matter Pages 1-2 Download chapter PDF Biomedical Informatics: The Science and the Pragmatics Edward H. Shortliffe, Michael F. Chiang Pages 3-44 Biomedical Data: Their Acquisition, Storage, and Use Edward H. Shortliffe, Michael F. Chiang Pages 45-75 Biomedical Decision Making: Probabilistic Clinical Reasoning Douglas K. Owens, Jeremy D. Goldhaber-Fiebert, Harold C. Sox Pages 77-120 Cognitive Informatics Vimla L. Patel, David R. Kaufman Pages 121-152 Human-Computer Interaction, Usability, and Workflow Vimla L. Patel, David R. Kaufman, Thomas Kannampallil Pages 153-175 Software Engineering for Health