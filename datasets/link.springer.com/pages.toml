title = "Associations of accelerometer-measured physical activity, sedentary behaviour, and sleep with next-day cognitive performance in older adults: a micro-longitudinal study | International Journal of Behavioral Nutrition and Physical Activity"
description = "Background Previous studies suggest short-term cognitive benefits of physical activity occurring minutes to hours after exercise. Whether these benefits persist the following day and the role of sleep is unclear. We examined associations of accelerometer-assessed physical activity, sedentary behaviour, and sleep with next-day cognitive performance in older adults. Methods British adults aged 50-83 years (N = 76) without evidence of cognitive impairment or dementia wore accelerometers for eight days, and took daily cognitive tests of attention, memory, psychomotor speed, executive function, and processing speed. Physical behaviour (time spent in moderate-to-vigorous physical activity [MVPA], light physical activity [LPA], and sedentary behaviour [SB]) and sleep characteristics (overnight sleep duration, time spent in rapid eye movement [REM] sleep and slow wave sleep [SWS]) were extracted from accelerometers, with sleep stages derived using a novel polysomnography-validated machine learning algorithm. We used linear mixed models to examine associations of physical activity and sleep with next-day cognitive performance, after accounting for habitual physical activity and sleep patterns during the study period and other temporal and contextual factors. Results An additional 30 min of MVPA on the previous day was associated with episodic memory scores 0.15 standard deviations (SD; 95% confidence interval = 0.01 to 0.29; p = 0.03) higher and working memory scores 0.16 SD (0.03 to 0.28; p = 0.01) higher. Each 30-min increase in SB was associated with working memory scores 0.05 SD (0.00 to 0.09) lower (p = 0.03); adjustment for sleep characteristics on the previous night did not substantively change these results. Independent of MVPA on the previous day, sleep duration ≥ 6 h (compared with < 6 h) on the previous night was associated with episodic memory scores 0.60 SD (0.16 to 1.03) higher (p = 0.008) and psychomotor speed 0.34 SD (0.04 to 0.65) faster (p = 0.03). Each 30-min increase in REM sleep on the previous night was associated with 0.13 SD (0.00 to 0.25) higher attention scores (p = 0.04); a 30-min increase in SWS was associated with 0.17 SD (0.05 to 0.29) higher episodic memory scores (p = 0.008). Conclusions Memory benefits of MVPA may persist for 24 h; longer sleep duration, particularly more time spent in SWS, could independently contribute to these benefits."
full_description = "Home International Journal of Behavioral Nutrition and Physical Activity Article Associations of accelerometer-measured physical activity, sedentary behaviour, and sleep with next-day cognitive performance in older adults: a micro-longitudinal study Research Open access Published: 10 December 2024 Volume 21, article number 133, (2024) Cite this article Download PDF You have full access to this open access article International Journal of Behavioral Nutrition and Physical Activity Aims and scope Submit manuscript Associations of accelerometer-measured physical activity, sedentary behaviour, and sleep with next-day cognitive performance in older adults: a micro-longitudinal study Download PDF Mikaela Bloomberg ORCID: orcid.org/0000-0003-2453-62831, Laura Brocklebank2, Aiden Doherty2, Mark Hamer3 & …Andrew Steptoe4 Show authors 17k Accesses 2512 Altmetric 424 Mentions Explore all metrics AbstractBackgroundPrevious studies suggest short-term cognitive benefits of physical activity occurring minutes to hours after exercise. Whether these benefits persist the following day and the role of sleep is unclear. We examined associations of accelerometer-assessed physical activity, sedentary behaviour, and sleep with next-day cognitive performance in older adults.MethodsBritish adults aged 50-83 years (N = 76) without evidence of cognitive impairment or dementia wore accelerometers for eight days, and took daily cognitive tests of attention, memory, psychomotor speed, executive function, and processing speed. Physical behaviour (time spent in moderate-to-vigorous physical activity [MVPA], light physical activity [LPA], and sedentary behaviour [SB]) and sleep characteristics (overnight sleep duration, time spent in rapid eye movement [REM] sleep and slow wave sleep [SWS]) were extracted from accelerometers, with sleep stages derived using a novel polysomnography-validated machine learning algorithm. We used linear mixed models to examine associations of physical activity and sleep with next-day cognitive performance, after accounting for habitual physical activity and sleep patterns during the study period and other temporal and contextual factors.ResultsAn additional 30 min of MVPA on the previous day was associated with episodic memory scores 0.15 standard deviations (SD; 95% confidence interval = 0.01 to 0.29; p = 0.03) higher and working memory scores 0.16 SD (0.03 to 0.28; p = 0.01) higher. Each 30-min increase in SB was associated with working memory scores 0.05 SD (0.00 to 0.09) lower (p = 0.03); adjustment for sleep characteristics on the previous night did not substantively change these results. Independent of MVPA on the previous day, sleep duration ≥ 6 h (compared with < 6 h) on the previous night was associated with episodic memory scores 0.60 SD (0.16 to 1.03) higher (p = 0.008) and psychomotor speed 0.34 SD (0.04 to 0.65) faster (p = 0.03). Each 30-min increase in REM sleep on the previous night was associated with 0.13 SD (0.00 to 0.25) higher attention scores (p = 0.04); a 30-min increase in SWS was associated with 0.17 SD (0.05 to 0.29) higher episodic memory scores (p = 0.008).ConclusionsMemory benefits of MVPA may persist for 24 h; longer sleep duration, particularly more time spent in SWS, could independently contribute to these benefits. Similar content being viewed by others Bidirectional associations between physical activity and sleep in older adults: a multilevel analysis using polysomnography Article Open access 13 September 2022 Physical activity and cognitive function: moment-to-moment and day-to-day associations Article Open access 22 November 2023 The association of previous night's sleep duration with cognitive function among older adults: a pooled analysis of three Finnish cohorts Article Open access 03 August 2023 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739733889, embedded_user: 'null' } }); BackgroundAgeing-related decline in cognitive function is an important predictor of loss of autonomy and reduction in wellbeing for older adults [1]. Identifying modifiable behavioural factors that contribute to the maintenance of daily cognitive function for older adults is therefore of utmost importance to maintain quality of life and active social participation and to mitigate cognitive symptoms for adults living with cognitive impairment and dementia. Physical activity is one such behavioural factor identified as protective for cognitive function [2, 3], where individuals who habitually participate in more physical activity may have a reduced rate of cognitive decline with ageing and reduced dementia risk [2, 4]. Exercise is also linked with short-term improvements in cognitive performance [5]. Accordingly, sedentary behaviour at the expense of physical activity is linked with worse cognitive performance [6]. Laboratory-based studies suggest the largest exercise-induced improvements in cognitive performance occur in the minutes to hours immediately following exercise [7, 8], and are attributable to increased blood flow to the brain and stimulation of neurotransmitters [5].Accumulating acute cognitive benefits of physical activity could contribute to mitigation of cognitive decline. However, whether acute cognitive benefits of physical activity persist—even to the following day—is not yet known. Several studies use ecological momentary assessments to examine cognitive performance and accelerometery-assessed physical activity to suggest links between physical activity and same-day improvements in cognitive performance [9,10,11,12]. One study found associations between physical activity and working memory performance on the following day in pre-adolescents, but did not examine adults [10]. These studies do not consider the role of sleep. Physical activity may influence sleep duration [13], which is itself independently associated with cognitive performance, cognitive decline, and risk of dementia [14,15,16]. Several studies also find sleep stage specific associations with cognitive performance, where rapid eye movement (REM) sleep deprivation is associated with impairments to nondeclarative memory, while non-REM stage III (also referred to as slow wave sleep or SWS) sleep deprivation is associated with impairments to declarative memory [17,18,19,20,21]. Physical activity has been found to promote SWS and delay onset of REM sleep [22,23,24,25].To elucidate next-day cognitive benefits of physical activity and sleep, we used eight days of wrist-worn accelerometer data from 76 British adults aged 50-83 years who took online cognitive tests on each day of accelerometer wear. We examined associations of physical activity (time spent in moderate-to-vigorous physical activity [MVPA] and light physical activity [LPA]), sedentary behaviour (SB), and sleep (overnight sleep duration, time spent in REM sleep and SWS) with next-day cognitive performance in five cognitive domains (attention, memory [episodic memory and working memory], psychomotor speed, executive function, and processing speed). We hypothesised that more physical activity, less sedentary behaviour, and longer sleep would be associated with better cognitive performance on the following day.MethodsData sourcesA convenience sample of 85 adults able to walk around with or without an aid, aged 50 + years, living in the UK, fluent in English, and with internet access were recruited via email using university contacts or word of mouth as part of a micro-longitudinal free-living validation study aiming to establish equivalency between two brands of wrist-worn accelerometer (Axivity AX3 and the newly developed Matrix 003). A micro-longitudinal study refers to longitudinal studies undertaken over hours or days rather than months or years (see for example, Zhang et al. 2021, Dautovich et al. 2013 [26, 27]). For the present analysis, data from the validated Axivity AX3 accelerometer [28, 29] were used. A secondary aim of the micro-longitudinal study was to examine day-to-day associations of movement behaviours (physical activity, sedentary behaviour, and sleep) with cognitive health and mental wellbeing; as such, participants were also asked to take daily cognitive tests. The study was approved by the University College London Research Ethics Committee (Reference: 20243/001). Participants provided written informed consent. Data were collected between October 2021 and November 2022.Accelerometer data collectionParticipants were asked to start wearing the accelerometer immediately after receiving it in the post and wear it on their dominant wrist 24 h per day for eight consecutive days. Participants were informed that they could wear the waterproof accelerometer when bathing or swimming but not in extremely high temperature or pressure environments (e.g., in a sauna or when diving) and were asked to carry on with their normal activities. Participants were not given feedback on their activity levels until after the accelerometer was returned.The Axivity AX3 (Axivity Ltd, Newcastle, UK) is a validated wrist-worn triaxial accelerometer that has been used to measure 24-h movement behaviours (physical activity, sedentary behaviour, and sleep) in the UK Biobank [29] and the China Kadoorie Biobank [28]. The Axivity was set to start recording at 10am two working days after postal dispatch and capture triaxial acceleration data at 100 Hz with a dynamic range of ± 8 g.Physical activity and sedentary behaviour patterns were derived from raw acceleration data using the open-source Biobank Accelerometer Analysis Tool (https://github.com/OxWearables/biobankAccelerometerAnalysis, v7.0.1), which was developed and validated by the Oxford Wearables Group (Big Data Institute, University of Oxford). Similar procedures as those used in the UK Biobank were used to process the raw acceleration data [29]. Participants were excluded if the data could not be parsed, the device could not be calibrated, more than 1% of readings fell outside the device’s dynamic range of ± 8 g before or after calibration, or the average acceleration was implausibly high (> 100 mg). The Biobank Accelerometer Analysis Tool was used to produce the percentage of the 24-h day spent in MVPA, LPA, and SB, which was then converted into hours per day. For days with wear time less than 22 h (7 of 291 days for the present analysis with a median wear time of 20.0 h, interquartile range = 10.0–21.6 for days with < 22 h), we imputed time spent in MVPA, LPA, and SB using the weekday or weekend mean proportion for that individual, with non-wear time defined as unbroken episodes of at least 60 min during which the standard deviation (SD) of each axis of acceleration was less than 13 mg [29].Sleep quality characteristics were derived using an open-source sleep staging algorithm (SleepNet: https://github.com/OxWearables/asleep, v0.4.12, which was also developed and validated using polysomnography by the Oxford Wearables Group [30]. SleepNet classifies each 30-s window of acceleration data into sleep stages (wake, REM, non-REM stages I or II, or SWS). For SleepNet, participants were excluded if the data could not be parsed, the device could not be calibrated, more than 1% of readings fell outside ± 3 g before or after calibration, or the average acceleration was implausibly high (> 200 mg). SleepNet excludes days if the participant wore the accelerometer for less than 22 h, based on evidence suggesting at least 22 h of wear time was required for stable weekly sleep parameter estimates [31], with non-wear time defined as unbroken episodes of at least 90 min during which the SD of each axis of acceleration was less than 13 mg.SleepNet was used to determine sleep parameters for the longest sleep window over a noon-to-noon interval, with up to 60 min of sleep discontinuity allowed. In the present study, the sleep parameters we examined were overall sleep duration and minutes spent in REM sleep and SWS; we focussed on these parameters based on the large body of evidence suggesting their association with cognitive function [14, 16,17,18,19,20,21]. Overall sleep duration was categorised into short (2- < 6 h) or optimal (≥ 6 h) based on evidence that 6–8 h of sleep per night is optimal for cognitive performance [14]. As sleep durations longer than 8.7 h accounted for just 5% of observations, we did not include a ‘long sleep duration’ category.Cognitive functionThere were two sets of cognitive tests (set A and set B) self-administered using an online platform (Neuropsychology Online [NeurOn]: https://neuropsychology.online/). Participants took a set of cognitive tests every day, alternating between set A and set B in a random order to reduce learning effects (Fig. 1). Participants were asked to complete the cognitive tests at the same time each day, using the same type of device (computer, tablet, or smartphone), and using the same input method (keyboard and mouse or touchscreen). Participants were not given feedback on their cognitive scores until after the accelerometer was returned.Fig. 1Two example timelines of data collection. Cognitive battery set A: cancellation test and picture recall. Cognitive battery set B: Corsi block-tapping test, simple reaction time, Trail Making Test B. Physical behaviours include time spent in moderate-vigorous physical activity, light physical activity, and sedentary behaviour. Sleep quality characteristics include overall sleep duration and time spent in rapid eye movement sleep and slow wave sleepFull size imageCognitive domains assessed were those that have been previously demonstrated to be associated with physical activity and sleep quality [8, 17, 19, 32,33,34], including attention (the cancellation test [35]), memory (episodic memory using picture recall and working memory using the Corsi block-tapping test [36]), psychomotor speed (simple reaction time [37]), executive function (Trail Making Test B [38]), and processing speed (total time to complete Trail Making Test B [38]).Cognitive battery set A included the cancellation test and picture recall. Set B included the Corsi block-tapping test, simple reaction time, and Trail Making Test B. In the cancellation test, participants were asked to scan through an array of different symbols and select all occurrences of one particular symbol. Participants were scored on the number of symbols correctly selected of the total number of symbols they were supposed to select, which was converted to a percentage. In the picture recall task, participants were shown a series of pictures and then after a short delay asked whether they had been shown that picture previously. The picture recall task was scored as a percentage corresponding to the number of correctly identified pictures minus the number of pictures incorrectly identified out of the total number of pictures shown. In the Corsi block-tapping task, squares were highlighted with an increa"
