 © 2021 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739737095, embedded_user: 'null' } }); Keywords Jung Hollywood Contemporary Film Television Studies Protagonist Character Arc Archetypes Screenwriting Character-driven Storytelling Search within this book Search Table of contents (21 chapters) Front Matter Pages i-xxxvi Download chapter PDF The Protagonist’s Journey as Narrative Imperative Front Matter Pages 1-1 Download chapter PDF The Protagonist’s Journey Scott Myers Pages 3-18 Character Arc Scott Myers Pages 19-34 Disunity Scott Myers Pages 35-53 Deconstruction Scott Myers Pages 55-73 Reconstruction Scott Myers Pages 75-94 Unity Scott Myers Pages 95-115 The Screenplay Universe Scott Myers Pages 117-127 The Protagonist’s Journey as Family of Characters Front Matter Pages 129-129 Download chapter PDF Primary Character Archetypes Scott Myers Pages 131-143 Nemesis Scott Myers Pages 145-158 Attractor Scott Myers Pages 159-174 Mentor Scott Myers Pages 175-192 Trickster Scott Myers Pages 193-208 Subplots Scott Myers Pages 209-224 Character Map Scott Myers Pages 225-237 The Protagonist’s Journey as Screenplay Front Matter Pages 239-239 Download chapter PDF Breaking Story I Protagonist Character Treatment Scott Myers Pages 241-255 Breaking Story II Master Brainstorming List Scott Myers Pages 257-274 1 2 Next page Back to top Reviews “Scott has one of the best analytical minds on the planet and his approach to writing is so compassionate and kind, you will absolutely benefit from this book.” (Jessica Ellis, 2018 Black List/Women In Film lab writer, What Lies West writer-director)“I wish I had this book when I began my screenwriting journey. Kudos Scott. I love how you have used classic films as examples as well as TV. I'm already using your book for problem solving.” (Gary Scott Thompson (The Fast and the Furious, Las Vegas))“Action is character. Scott takes a very simple and often-overlooked aspect of dramatic writing and skillfully turns it into a tour de force tutorial that is compelling, inspirational and practical. The Protagonist's Journey immediately joins the classics of screenwriting literature.” (Arash Amel (Rise))“Scott Myers is a canny and thoughtful teacher of the craft of screenwriting, and brings all of his impressive knowledge, insight and experience to The Protagonist's Journey: this book is full of essential lessons for the novice, and crucial reminders for the professional.” (Javier Grillo-Marxuach, Writer/Producer, Lost, The Dark Crystal, The Middleman) “Scott Myers is an uncommonly sensitive and erudite thinker and writer about the craft of modern screenwriting. I think so many writers at all stages of their careers will find nourishment in his character-forward approach, as well as anyone who is interested in the mysteries of storytelling or just plain loves movies. Great films are about remarkable, compelling, and challenging characters. '''
