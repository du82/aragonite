title = "How do people change their beliefs about climate change? A qualitative study on opinion shift in the U.S. Midwest | Climatic Change"
description = "Beliefs and attitudes about climate change are the building blocks from which humans create and support mitigation and adaptation strategies. In the United States, 72% of the public now believes that the earth is warming and 58% believe humans are the cause. Although these figures represent some increase since 2010, they also represent a significant remaining gap in acceptance of climate change realties. While a wealth of research has identified isolated factors that influence opinions on climate change, less attention has been given to understanding the process that changes people’s opinions. Our study uniquely applies qualitative methods to examine the context and experiences underlying climate change opinion shift. We conducted in-depth interviews with 15 participants in Kansas City and its surrounding peri-urban and rural communities who had changed their beliefs on fundamental climate change realities and were purposely selected for diversity across political ideology, age, and urban/ rural residence. We inductively coded transcripts and synthesized codes into a hierarchical structure to derive themes. Findings suggest that prior to shifting beliefs, participants were similarly skeptical or rejecting of climate change, while remaining diverse in the ideologies that influenced these beliefs. For most participants, shifting beliefs were catalyzed by three key experiences: (1) distancing from ideological community, (2) desire to seek out information, and (3) solidifying experiences of gradual or epiphanic realization. Despite these common experiences, attitudes following change in beliefs remained diverse. Our framework can guide individuals and organizations in facilitating greater acceptance of climate change realities through interpersonal and public communication strategies."
full_description = "Home Climatic Change Article How do people change their beliefs about climate change? A qualitative study on opinion shift in the U.S. Midwest Open access Published: 15 January 2025 Volume 178, article number 8, (2025) Cite this article Download PDF You have full access to this open access article Climatic Change Aims and scope Submit manuscript How do people change their beliefs about climate change? A qualitative study on opinion shift in the U.S. Midwest Download PDF Emily A. Hurley ORCID: orcid.org/0000-0003-1806-075X1,2,3 & Micheal S. Molloy ORCID: orcid.org/0000-0003-4199-81214 14k Accesses 241 Altmetric Explore all metrics AbstractBeliefs and attitudes about climate change are the building blocks from which humans create and support mitigation and adaptation strategies. In the United States, 72% of the public now believes that the earth is warming and 58% believe humans are the cause. Although these figures represent some increase since 2010, they also represent a significant remaining gap in acceptance of climate change realties. While a wealth of research has identified isolated factors that influence opinions on climate change, less attention has been given to understanding the process that changes people’s opinions. Our study uniquely applies qualitative methods to examine the context and experiences underlying climate change opinion shift. We conducted in-depth interviews with 15 participants in Kansas City and its surrounding peri-urban and rural communities who had changed their beliefs on fundamental climate change realities and were purposely selected for diversity across political ideology, age, and urban/ rural residence. We inductively coded transcripts and synthesized codes into a hierarchical structure to derive themes. Findings suggest that prior to shifting beliefs, participants were similarly skeptical or rejecting of climate change, while remaining diverse in the ideologies that influenced these beliefs. For most participants, shifting beliefs were catalyzed by three key experiences: (1) distancing from ideological community, (2) desire to seek out information, and (3) solidifying experiences of gradual or epiphanic realization. Despite these common experiences, attitudes following change in beliefs remained diverse. Our framework can guide individuals and organizations in facilitating greater acceptance of climate change realities through interpersonal and public communication strategies. Similar content being viewed by others Changes in Global Warming’s Six Americas: an analysis of repeat respondents Article 10 June 2024 Making sense of climate change—the lived experience of experts Article 23 January 2021 The use of qualitative research to better understand public opinions on climate change Article 06 June 2023 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1740890243, embedded_user: 'null' } }); Use our pre-submission checklist Avoid common mistakes on your manuscript. 1 BackgroundPublic attitudes, opinions and beliefsFootnote 1 about climate change provide foundation for societal response to the crisis, influencing everything from individual environmental behaviors to broader support for policy-level action (Leiserowitz 2005; Weber and Stern 2011). Since 2008, Yale’s Climate Change in the American Mind (CCAM) surveys have systematically assessed public attitudes, opinions and beliefs regarding climate change across the United States. The latest 2023 survey estimated that 72% [69–75%] believe “global warming is happening” and 58% [55–61%] believe it is “caused mostly by human activities” (Leiserowitz et al. 2024). While these figures represent an increase since a low point in 2010, when 57% [54%−60%] believed global warming was happening and 47% [44–50%] believed its human cause, data from CCAM and other sources suggest no substantial increase in public opinion on the fundamental realities of climate change since the early 2000s or since 2016 (Leiserowitz et al. 2024; Gallop Organization 2024). Understanding how individuals shift their opinions of these fundamental realities of climate change is critical in shaping communication strategies aimed at garnering public support for climate action.Attitudes and beliefs about climate change are generally reflective of political, family, religious, and/or social identity (Stedman 2004; Kellstedt et al. 2008; Scannell and Gifford 2013; Brulle et al. 2012; Leviston et al. 2014; Devine-Wright et al. 2015; Carmichael and Brulle 2017; Hornsey et al. 2016; McCright et al. 2016; Shao 2016; Shao et al. 2016; Shao and Goidel 2016; Kerr and Wilson 2018; Bostrom et al. 2019). Gender and generational differences are also apparent, with women and younger generations more likely to accept realties of climate change. Beliefs can also be influenced by direct experience of the crisis, a factor becoming increasingly prevalent as 3.4 million Americans were exposed to extreme weather events in 2022 alone (Hornsey et al. 2016; Ballew et al. 2019; Brown and Hamilton 2024; U.S. Census Bureau 2023). Trust in science, exposure to media coverage, localized messaging, elite cues, perceived social norms, and interactions with others are also known to influence climate change opinions (Brulle et al. 2012; Carmichael and Brulle 2017; Ballew et al. 2022; Brown and Hamilton 2024).This multitude of influential factors can be understood through several theoretical perspectives. McCright and colleagues (2016) identify five: (1) Values-Beliefs-Norms Theory, which explains how individuals adopt beliefs that are compatible with their worldview and values; (2) Anti Reflexivity Thesis, which claims the political Right is more dismissive of the problems caused by industrial capitalism than the political Left; (3) Gender Socialization Theory, which argues that females are more likely to be socialized toward empathy and care; (4) Postmaterialist Values Thesis, which describes how younger and more affluent individuals have stronger pro-environmental views because their other basic needs are met; and (5) Cultural Theory; which explains how various cultural worldviews and societal structure shape perceptions of environmental risk and collective action. These theories highlight various influences on opinion, which as McCright and colleagues explain, can coexist or interact. While they all associate climate change beliefs with different facets of identity, they do not adequately explain how beliefs may change, if the experience of change exhibits common features across different identities and worldviews, as well as how changed beliefs are reassumed within identity and work to influence related opinions.Despite the growing body of literature that identifies factors and theoretical underpinnings related to climate change opinion, less attention has been given to understanding the processes and experiences that change opinion. A 2018 supplement to the CCAM survey examined individuals that changed their mind about climate change, with the overwhelming majority reporting becoming “more concerned” about the issue versus less (Deeg et al. 2019). Although some demographic groups showed slightly higher likelihood of opinion change (women more likely than men, Democrats more likely than Independents, older adults more likely than younger), shifts in opinion were generally consistent across different age, sex, educational level, and political party groups. Reported reasons for increased concern included directly experiencing climate change impacts (21%), taking it more seriously (for unspecified reasons, 20%) and becoming more informed (20%). Notably, a full 24% did not provide a clear or complete response. Beyond CCAM, other survey-based research examining opinion shift has identified the influence of social norms and messaging (featuring political mobilization, morality appeals, and/or extreme weather). (Brulle et al. 2012; Salomon et al. 2017; Egan and Mullin 2017; Ballew et al. 2022). One large longitudinal study found opinion change was significantly associated with political ideology, party identification, relative concern about environmental conservation and economic development, and, to small extent, exposure to extreme weather events (Palm et al. 2017).Theoretical explanations for opinion change are less developed in the literature. Palm and colleagues situate their work within the Theory of Motivated Reasoning, which explains how emotional biases and social identity serve as filters for new information (Palm et al. 2017). Social network influence, cognitive dissonance, and information processing biases have also been described within and outside of climate change literature as part of the complexities of opinion change (Nielsen et al. 2021; McGrath 2017; Dennison et al. 2023; Merry and Mattingly 2023). These theories provide valuable insights into some factors that can influence opinion shifts in a population. However, they do not offer a complete perspective of an individual’s journey to opinion change, nor how multiple influential factors may appear or interact within an individual experience. Psychology’s classic Transtheoretical, or “stages of change” model, has been widely applied to describe the overall process of how individuals change behavior, but may be problematic to apply to a change in opinion that could result in a variety of behavioral outcomes (Prochaska and Diclemente 1982).While survey-based research and theoretical discourse offer some insight into climate change opinion shift, we still lack a deep understanding of the process and experiences that underly changes within individuals (Egan and Mullin 2017). Qualitative methodology- specifically grounded theory that co-constructs and analyzes in-depth interviews—is uniquely positioned to offer such insights but has rarely been applied to understanding climate change opinions. Kleinberg and Toomey (2023) were among the first to apply qualitative methodology to broadly explore climate change attitudes in the United States. Their work demonstrated the importance of uncovering the nuance and diversity underlying the quantitative data currently dominating the literature on climate change opinion. They advocate for the expanded use of qualitative methods in building a more comprehensive understanding of environmental perspectives that can guide effective scientific communication. While Kleinberg and Toomey do apply qualitative methods to explore climate change attitudes, we have yet to see in-depth qualitative studies that examine process and construct explanatory frameworks. By applying qualitative methodology to climate change opinion shift research, we can move our understanding beyond statistical trends and offer contextual insight into how and why shifts occur. Although findings are expected to resonate with many existing theoretical explanations for opinion formation, they are also expected to offer novel insight into the dynamics of influences on climate change opinion revision via novel processual view.While climate change opinions are infinitely more complex than the belief of its existence and its anthropogenic cause, examining how individuals come to change their beliefs on these two fundamental realities serves as an essential starting point. Understanding commonalities across experiences of individuals with changed beliefs can help align community and population-level communication strategies aiming to encourage further acceptance of climate change realities. In this study, we use qualitative methods to explore the experience of individuals in Kansas City and its surrounding communities who came to accept the existence and/or human cause of climate change after previously stating disbelief. We aimed to identify common features of their experiences and to generate an explanatory framework to better understand the overall process of individual opinion change.2 Methods2.1 Setting and participantsWe conducted a qualitative study guided by grounded theory methodology with participants residing in Kansas City and surrounding rural and suburban communities in Kansas (KS) and Missouri (MS) (Charmaz 2006; Mfinanga et al. 2019). The region is notable for being particularly vulnerable to climate change, with extreme weather expected to decrease crop yields by 50% and quadruple the number of days over 100 degrees Fahrenheit by the year 2050 (Pryor et al. 2014). Paradoxically, the region’s population tends to exhibit more conservative opinions and beliefs on climate change compared to the rest of the country. At the time we conducted our study (beginning in 2019, into 2020) both states had similar proportions of people who believed that “global warming is happening” (63% [60–66%]) and who believed that “global warming is caused mostly by human activities” (48% [45–51%]; Leiserowitz et al. 2019).We recruited participants for initial screening using a variety of in-person (distributing flyers at grocery stores, community events) and virtual strategies (listservs, social media postings). Interested individuals were directed to an online eligibility screening. Participants were eligible if they lived within a 50-mile radius of Kansas City (determined by zip code), were 18 years of age or older, and indicated one or more changes in responses to two items from the CCAM survey: (1) “Do you think global warming is happening?” (Yes/No/Don’t know) and (2) “Assuming global warming is happening, do you think it is…” (Caused mostly by human activities/ Caused mostly by natural changes in the environment/ None of the above because global warming isn’t happening/ Other/ Don’t know). Specifically, participants were asked to answer these questions first in past tense with the stem “Five years ago...” and then a second time in present tense. Those who indicated a shift from “Yes” to “No” in the first item or a shift from “Caused mostly by natural changes in the environment” to “Caused mostly by human activities” in the second item were eligible. We then employed an iterative, purposive sampling strategy to invite selected participants for interviews (Charmaz 2006). We aimed for a maximum diversity of demographics to construct a sample that together provided the different perspectives necessary in gaining a holistic understanding of opinion shift in the region. We planned to recruit until we reached thematic saturation, an estimated 12–18 interviews based on established guidance (Guest et al. 2006).2.2 Data collectionIndividuals who passed the eligibility screening were invited to give their contact information if they were interested in scheduling an in-depth interview and to answer additional demographic and climate opinion questions. Interviews were conducted in-person in private spaces (e.g., private rooms at public libraries and workplaces) or by phone, according to participant preference. The first author or a trained research assis"
