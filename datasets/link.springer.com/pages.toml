tudies. It further examines the major mechanisms involved in cardiovascular complications among type 2 diabetes mellitus individuals and discusses the various pharmacological interventions and agents developed to delay cardiovascular events and thereby the quality and duration of the patients. Towards the end, the book summarizes the potential impact of ketogenic diets on diabetic patients, and the role of genetic vulnerability in diabetic nephropathy. As such, this book is a valuable source for students, researchers, and practitioners working in glucose metabolism, diabetes, and human health. Similar content being viewed by others Type 2 diabetes mellitus Article 23 July 2015 The Evolution of Diabetes Treatment Through the Ages: From Starvation Diets to Insulin, Incretins, SGLT2-Inhibitors and Beyond Article Open access 01 January 2023 Diabetes and Treatments Chapter © 2020 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739733326, embedded_user: 'null' } }); Keywords Diabetes Mellitus Nanotechnology Glucose sensors Insulin Delivery Stem cells Microvascular and Macrovascular complications Search within this book Search Table of contents (11 chapters) Front Matter Pages i-xii Download chapter PDF Biochemical Assay for Measuring Diabetes Mellitus Taniya Sur, Aishwariya Das, Sheerin Bashar, Sambit Tarafdar, Bhanumati Sarkar, Nithar Ranjan Madhu Pages 1-20 Diabetes and Other Comorbidities: Microvascular and Macrovascular Diseases Diabetes and Cancer V. Nithya, P. Sangavi, R. Srinithi, K. T. Nachammai, S. Gowtham Kumar, D. Prabu et al. Pages 21-39 Diabetes and Cardiovascular Disorder S. Santhi Priya, K. Kumar Ebenezar Pages 41-61 Diabetes and Neurological Disorder Iyshwarya Bhaskar Kalarani, Ramakrishnan Veerabathiran Pages 63-79 Diabetic and Nephropathy Langeswaran Kulanthaivel, Geevaprabhakaran Ganesan, Chandrashekar Kirubhanand, Gowtham Kumar Subbaraj Pages 8