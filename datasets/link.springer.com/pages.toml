l impact How CSOs landed in their roles without climbing a traditional career ladder Who This Book Is ForExecutives and board members generally or those establishing a sustainability or ESG strategy; current and aspiring CSOs and ESG leaders; business leaders partnering with sustainability leaders and teams; and students studying the integration of sustainability and business.Advance praise for Chief Sustainability Officers At Work:"Chief sustainability officers play a critical role in supporting the broader business transition to a more just and sustainable global economy. Through dialogue with influential sustainability professionals, Chrissa brings to life the essential role in bridging gaps and helping to eliminate the divide between "traditional" business functions, senior leadership, and the sustainability teams to drive transformational change within their firms." - Mindy Lubber, CEO and President, Ceres "Chief Sustainability Officers at Work, is a fresh new book by seasoned business leader Chrissa Pagitsas that offers succinct ways anyone can implement and achieve ESG goals – whether they own the company or simply aspire to improve its impact on people and the planet. Chrissa roots this book in her own experience leading change within major companies that not only improved the businesses where she worked but improved the markets within which they needed to thrive. This is a must read for a seasoned ESG practitioner as much as it is for the young professional just getting started. Chrissa knows it is imperative we all just get started doing better and she opens up the otherwise dark box of how-tos for all of us to do our part." – Dana Bourland, SVP, The JPB Foundation and author of Gray to Green Communities: A Call to Action on the Housing and Climate Crises. Similar content being viewed by others Sustainable Business Models: Rethinking Value and Impact Chapter © 2019 Sustainability as Opportunity: Unilever’s Sustainable Living Plan Chapter © 2019 Sustainability and Green Supply Chain Awareness in Nigerian Organizations Chapter © 2017 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739733326, embedded_user: 'null' } }); Keywords Chief Sustainability Officer Corporate Social Responsibility Officer ESG sustainability strategy value of sustainability C Suite CSO sustainability principles positive environmental and social impact Sustainability executives Search within this book Search Table of contents (24 chapters) Front Matter Pages i-xviii Download chapter PDF Consumer Goods, Hospitality, and Entertainment Front Matter Pages 1-1 Download chapter PDF Beatriz Perez Chrissa Pagitsas Pages 3-17 Ezgi Barcenas Chrissa Pagitsas Pages 19-29 Pia Heidenmark Cook Chrissa Pagitsas Pages 31-41 Virginie Helias Chrissa Pagitsas Pages 43-54 Marissa (Pagnani) McGowan Chrissa Pagitsas Pages 55-69 Jyoti Chopra Chrissa Pagitsas Pages 71-84 Emma Stewart, PhD Chrissa Pagitsas'''
