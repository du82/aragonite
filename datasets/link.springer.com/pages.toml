() { dataLayer.push({ "ecommerce": { "currency": "USD", "impressions": [{ "name" : "Electronics for Beginners", "id" : "978-1-4842-5979-5", "price" : 49.99, "brand" : "Apress", "category" : "Maker", "variant" : "ebo", "quantity" : 1 }, { "name" : "Electronics for Beginners", "id" : "978-1-4842-5978-8", "price" : 64.99, "brand" : "Apress", "category" : "Maker", "variant" : "print", "quantity" : 1 }] } }) })() Other ways to access Licence this eBook for your library Institutional subscriptions About this book Jump start your journey with electronics! If you’ve thought about getting into electronics, but don’t know where to start, this book gives you the information you need. Starting with the basics of electricity and circuits, you'll be introduced to digital electronics and microcontrollers, capacitors and inductors, and amplification circuits – all while gaining the basic tools and information you need to start working with low-power electronics.Electronics for Beginners walks the fine line of focusing on projects-based learning, while still keeping electronics front and center. You'll learn the mathematics of circuits in an uncomplicated fashion and see how schematics map on to actual breadboards. Written for the absolute beginner, this book steers clear of being too math heavy, giving readers the key information they need to get started on their electronics journey.What You’ll LearnReview the basic “patterns” of resistor usage—pull up, pull down, voltage divider, and current limiterUnderstand the requirements for circuits and how they are put togetherRead and differentiate what various parts of the schematics doDecide what considerations to take when choosing componentsUse all battery-powered circuits, so projects are safeWho This Book Is ForMakers, students, and beginners of any age interested in getting started with electronics. Similar content being viewed by others Circuits and Signals Chapter © 2024 Battery Makers Chapter © 2020 Battery Makers Chapter © 2018 