ogramming to calculus. He is a technical lead for ITX, where his specialty is getting stuck projects unstuck. Jonathan regularly writes for the blog MindMatters.ai. Bibliographic Information Book Title: Electronics for Beginners Book Subtitle: A Practical Introduction to Schematics, Circuits, and Microcontrollers Authors: Jonathan Bartlett DOI: https://doi.org/10.1007/978-1-4842-5979-5 Publisher: Apress Berkeley, CA eBook Packages: Professional and Applied Computing, Apress Access Books, Professional and Applied Computing (R0) Copyright Information: Jonathan Bartlett 2020 Softcover ISBN: 978-1-4842-5978-8Published: 02 September 2020 eBook ISBN: 978-1-4842-5979-5Published: 01 September 2020 Edition Number: 1 Number of Pages: XXIII, 507 Number of Illustrations: 127 b/w illustrations, 49 illustrations in colour Topics: Hardware and Maker Publish with us Policies and ethics Back to top'''
