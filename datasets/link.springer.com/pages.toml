title = "Vole hunting: novel predatory and carnivorous behavior by California ground squirrels | Journal of Ethology"
description = "Dietary flexibility allows animals to respond adaptively to food pulses in the environment. Here we document the novel emergence of widespread hunting of California voles and carnivorous feeding behavior by California ground squirrels. Over two months in the twelfth year of a long-term study on the squirrel population, we document 74 events of juvenile and adult ground squirrels of both sexes depredating, consuming, and/or competing over vole prey. Our video footage, photographic evidence, and direct observations of marked individual squirrels provide insights into the ecological circumstances favoring behavioral flexibility in foraging associated with a decadal peak in vole abundance. Digital video images related to the article are available at http://www.momo-p.com/showdetail-e.php?movieid=momo241126ob01a ."
full_description = "Home Journal of Ethology Article Vole hunting: novel predatory and carnivorous behavior by California ground squirrels Video Article Open access Published: 18 December 2024 Volume 43, pages 3–12, (2025) Cite this article Download PDF You have full access to this open access article Journal of Ethology Aims and scope Submit manuscript Vole hunting: novel predatory and carnivorous behavior by California ground squirrels Download PDF Jennifer E. Smith ORCID: orcid.org/0000-0002-3342-44541, Joey E. Ingbretson1, Mackenzie M. Miner1, Ella C. Oestreicher1, Mari L. Podas1, Tia A. Ravara1, Lupin M. L. Teles2,3, Jada C. Wahl1, Lucy M. Todd2 & …Sonja Wild ORCID: orcid.org/0000-0002-5904-00962 Show authors 39k Accesses 1 Citation 2681 Altmetric 439 Mentions Explore all metrics This article has been updated AbstractDietary flexibility allows animals to respond adaptively to food pulses in the environment. Here we document the novel emergence of widespread hunting of California voles and carnivorous feeding behavior by California ground squirrels. Over two months in the twelfth year of a long-term study on the squirrel population, we document 74 events of juvenile and adult ground squirrels of both sexes depredating, consuming, and/or competing over vole prey. Our video footage, photographic evidence, and direct observations of marked individual squirrels provide insights into the ecological circumstances favoring behavioral flexibility in foraging associated with a decadal peak in vole abundance. Digital video images related to the article are available at http://www.momo-p.com/showdetail-e.php?movieid=momo241126ob01a. Similar content being viewed by others Daily foraging activity of an imperiled ground squirrel: effects of hibernation, thermal environment, body condition, and conspecific density Article 07 February 2022 Population density and vegetation resources influence demography in a hibernating herbivorous mammal Article 09 July 2024 Seasonal variation in the activity pattern of red squirrels and their mammalian predators Article Open access 14 May 2024 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739731282, embedded_user: 'null' } }); Use our pre-submission checklist Avoid common mistakes on your manuscript. IntroductionBehavioral flexibility is an important mechanism by which animals may respond to changing environments (Wright et al. 2010). Within the context of foraging, dietary shifts allow animals to flexibly respond to changes in foraging risks and opportunities (Abrams 2010). Indeed, a large literature exists on the ‘ecology of fear’, demonstrating that many prey species, including various squirrel species (family Sciuridae), dynamically adjust their foraging decisions to predation risk (e.g., Brown et al. 1999; Palmer et al. 2022; Ortiz-Jimenez et al. 2025). However, far fewer studies have systematically documented the behavioral shifts of squirrels to large pulses of food, and most focus on the anticipation of seeds associated with masting events (e.g., Boutin et al. 2006). This is likely because the diet of squirrels is made up of mainly acorns, seeds, nuts, and fruits (Thorington et al. 2012). Any supplementation of their vegetarian diet was historically believed to primarily occur through eating insects or, on occasion, nest predation of eggs or young hatchlings (Bradley and Marzluff 2003).Roughly 30 years ago, Callahan (1993) radically altered our perception of squirrels by characterizing as many as 30 species of the family Sciuridae as facultative predators of small vertebrates capable of killing and consuming adult fish, amphibians, reptiles, birds, and mammals (Table S1). Despite the growing consensus that many squirrel species opportunistically consume meat (Callahan 1993; O’Donoghue 1994), much of the early evidence for predation is based on stomach contents or the killing of heterospecifics in captive settings (e.g., zoos, traps). This makes it challenging to distinguish between scavenging and direct predation. The direct study of hunting behavior by squirrels remains rare, and most reports in field settings are still limited to a single depredation event (Table S1). Studies characterizing the demographic and social aspects of hunting behavior in free-living squirrels are therefore needed to better understand these patterns and inform our understanding of the processes shaping hunting behavior in mammals more broadly. Such studies also offer important insights into behavioral flexibility.Here, we provide the first evidence of California ground squirrels (Otospermophilus beecheyi, Richardson, 1829, formerly Beechey ground squirrel, and recently distinguished from O. douglasii (Smith et al. 2016; Long and Smith 2023)) repeatedly hunting, killing and consuming adult vertebrate prey in nature. Native to California grasslands, this ecosystem engineer is a major prey species for mammalian carnivores, snakes, and birds (Smith et al. 2016). It is a socially tolerant species that resides in groups structured by fission–fusion dynamics (Gall et al. 2022; Person et al. 2024). It typically forages alone or in small groups (Ortiz et al. 2019; Owings et al. 1977) on seeds from grasses and oaks (Linsdale 1946), and almost exclusively on green herbaceous vegetation in the growing season (Fitch 1948). It consumes leaves, flowers, buds, stems, shoots, roots, tubers, twigs, and bark (Grinnell and Dixon 1918; Evans and Holdenried 1943; Linsdale 1946; Fitch 1948) from over 100 different native and invasive plant species (Smith et al. 2016) and is a serious agricultural pest of fruit, nut, and vegetable harvests (Grinnell and Dixon 1918; Stanton 1944; Baker 1984; Schramm and Bullard 2004).There is some evidence of meat-eating in California ground squirrels. Despite its primarily granivorous diet, previous studies have documented occasional consumption of invertebrates (Evans and Holdenried 1943; Stanton 1944; Baker 1984; Carlton and Hodder 2003) and avian eggs or nestlings of killdeer, California quail, bobwhite quail, ring-necked pheasant, mourning dove, dark-eyed junco, and American robin (Grinnell and Storer 1924; Emlen and Glading 1938; Stanton 1944; Fitch 1948; Linsdale 1946; Leopold 1977; Baker 1984; Purcell and Verner 1999; Yeh et al. 2007Y; Bataille and Baldassarre 1993). It has also been reported to eat eggs of domestic chickens (Grinnell and Dixon 1918; Howell 1938) and a small fish, the California grunion (Olson 1950). Fitch (1948) observed it consuming, but not directly killing, young desert cottontails, adult pocket gophers, and kangaroo rats.Several studies have also reported scavenging of trapped fish, meat, woodrats (Neotoma), songbirds, and, in one case, an adult conspecific (Grinnell and Dixon 1918; Fitch 1948; Miller and Stebbins 1964). It also has killed, but did not eat, young gopher snakes (Fitch 1948). The direct killing of adult animals is limited to a few reports such as the killing and eating of side-blotched and western fence lizards in captivity (Sandberg and Banta 1973), a possible killing of a domestic chicken (Grinnell and Storer 1924), and the killing and consumption of several Northern broad-footed moles (Trulio et al. 1986). Infanticide, the direct killing of newly emerged young has also been documented extensively in California ground squirrels (Trulio et al. 1986; Trulio 1996). For example, 40 killings of post-emergent juvenile ground squirrels were documented over 4 years; juveniles were cannibalized in at least 22 of these cases (Trulio 1996).For the first time, we document the occurrence of widespread hunting of mammalian prey, the California vole (Microtus c. californicus) by the California ground squirrel (Fig. 1; http://www.momo-p.com/showdetail-e.php?movieid=momo241126ob01a; SI). The California vole is a species that feeds primarily on grasses and sedges and is mainly preyed upon by hawks, owls, egrets, long-tailed weasels, coyotes, skunks, mountain lions, and garter snakes (Cudworth and Koprowski 2010). Although some population densities are stable (Ostfeld and Klosterman 1986), most cycle, peaking every 3–5 years (Garsd and Howard 1982) at densities of up to roughly 400–2000 voles per hectare (Pearson 1966; Batzli and Pitelka 1971; Lidicker 1973; Ostfeld et al. 1985; Cudworth and Koprowski 2010) with mean rates of increase from 0.08 to 2.14 in open areas (Lidicker and Anderson 1962). In 2024, parts of Northern California experienced vole ‘infestations’ (Curry 2024; Hill 2024) and our team also noticed more voles at the study site compared to any of the previous years of our long-term study. After a decadal peak in numbers of California voles (hereafter “voles”), and in the twelfth year of study on California ground squirrels (hereafter “ground squirrels”), we document the emergence and widespread nature of the newly observed hunting of voles by ground squirrels. We characterize the demographic and social aspects of this novel behavior never previously observed in our study population. We discuss how these observations fundamentally change our understanding of the dietary flexibility of this ground squirrel.Fig. 1a An adult California vole at the study site and b an adult female California ground squirrel consuming the head of a freshly hunted adult California vole (http://www.momo-p.com/showdetail-e.php?movieid=momo241126ob01a)Full size imageMethodsStudy site and subjectsThe current research is part of a long-term study on the behavioral ecology of California ground squirrels in a 9596 m2 recreational area with open grassland, walnut, and oak trees at Briones Regional Park in Contra Costa County, California in the United States (37.9377014 N, 122.1388542 W, WGS 84; Fig. 2b; Hammond et al. 2019). Since 2013, we have live-trapped, marked, and released known individuals in June and July, the time of year when most animals, including young of the year, are active aboveground (Tomich 1962; Smith et al. 2018). On a biweekly basis, Tomahawk live traps were baited with sunflower seeds and peanut butter. Sex, body mass, and reproductive status of each individual were noted. Upon first capture, we marked each individual with a uniquely numbered Monel metal ear tag (National Band and Tag Co.) and a passive integrated transponder (PIT) tag (Biomark, Inc.). For visual identification during observations, we also painted a unique fur mark on their backs using Nyanzol dye (Greenville Colorants).Fig. 2Number of monthly reports of California voles across a time (10 years: September 2014–August 2024) across the state of California, and b geographic location (5 years: September 2019–August 2024)Full size imageWhile we did not directly quantify vole densities at our field site, we extracted reports of California voles from the citizen science platform iNaturalist (iNaturalist community 2024) between September 2014 and August 2024 at this site and other regions across the state of California, and compared the highest peak in 2024 to the number of reports in previous years.From June 10th to July 30th 2024, we recorded all sightings of squirrels hunting, killing and/or consuming voles both opportunistically on trapping days and during formal behavioral observations. Formal behavioral observations were conducted on non-trapping days between 0800 and 1200 h on a total of 16 weekdays between June 7th and July 25th 2024. To ensure full coverage of the study site, three groups of observers watched subsets of the population at the same time; each group sat ≥ 20 m from squirrels to minimize disturbance of the subjects (Gall et al. 2022). Each set of observers was responsible for a spatially distinct area at the study site and communicated via radios during observations to avoid any potential overlap in instances reported here. Combined notes were integrated into the final data set after being thoroughly checked to resolve any potential redundancies in the data collection. Areas visible to each set of observers were watched for 51, 45, and 50 h, respectively, for a total of 146 observation hours.During formal observations, we recorded all occurrences of vole hunting, killing and/or consumption as well as all occurrences of social interactions among conspecifics (Altmann 1974). Starting times and locations of these behavior were logged relative to the nearest natural (e.g., tree) or artificial (e.g., picnic table) landmarks in the study area (for details, see Ortiz-Jimenez et al. 2022). Affiliative behaviors included greeting, sitting, or foraging in close proximity (< 1 m), and play, whereas intraspecific competition was characterized by agonistic behaviors (e.g., displacement, chases, and physical pushing, pouncing, or biting; Smith et al. 2016).Statistical analysesTo explore the demographic aspects of this novel behavior, we applied three separate Fisher’s exact tests comparing the number of adult females, adult males, juvenile females and juvenile males engaging in hunting of, consumption of, and competition over voles (versus those that did not) in the whole population. To ensure sufficient opportunities to observe these behaviors, analyses were limited to marked individuals that were present on at least three formal observation days.ResultsA peak in vole abundanceOverall, vole sightings reported on iNaturalist across California fluctuated over time, but numbers reported in 2024 far exceeded numbers from the past decade (Fig. 2a). In 2024, the peak in vole abundance was roughly seven times greater than the 10 year average. Over these ten years, reports of vole sightings were also higher at Briones Regional Park than those reported across the state (Fig. 2b).Occurrences of vole events during field seasonWe recorded a total of 74 events of vole hunting and/or consumption over a total of 18 days of fieldwork (Fig. 3a). Sixty-five of these events occurred on formal observation days (Table S2). We observed vole hunting and/or consumption on nearly all (N = 13 days, 86%) of the 16 formal observations days during the season, with incidents peaking during the first two weeks of July (Fig. 3). The identity of foraging squirrels was clearly recognizable for 51 (69%) of the 74 events, involving a total of 27 unique squirrels. Across the field season, we observed a total of 125 marked individual squirrels from the study population during social observations, of which 53 marked squirrels were observed on three or more different observation days. Of the 27 identified squirrels seen interacting with voles, 26 (96%) were observed on at least three observation days and therefore included in our statistical analyses (Table S2).Fig. 3Number of observations of vole hunting and consumption (and total number of vole interactions) observed on formal observation daysFull size imageBehavioral patterns associated with hunting and consumptionOut of 74 events of observed interactions with voles, nearly half of these (N"
