title = "Drivers of global tourism carbon emissions | Nature Communications"
description = "Tourism has a critical role to play in global carbon emissions pathway. This study estimates the global tourism carbon footprint and identifies the key drivers using environmentally extended input-output modelling. The results indicate that global tourism emissions grew 3.5% p.a. between 2009-2019, double that of the worldwide economy, reaching 5.2 Gt CO2-e or 8.8% of total global GHG emissions in 2019. The primary drivers of emissions growth are slow technology efficiency gains (0.3% p.a.) combined with sustained high growth in tourism demand (3.8% p.a. in constant 2009 prices). Tourism emissions are associated with alarming distributional inequalities. Under both destination- and resident-based accounting, the twenty highest-emitting countries contribute three-quarters of the global footprint. The disparity in per-capita tourism emissions between high- and low-income nations now exceeds two orders of magnitude. National tourism decarbonisation strategies will require demand volume thresholds to be defined to align global tourism with the Paris Agreement. The tourism carbon footprint grew 2.3 times faster than the rest of the economy, reaching nearly 9% of global emissions by 2019. Rapid tourism demand growth (3.8% per year) has outpaced energy efficiency gains among businesses (0.3% per year)."
full_description = "Home Nature Communications Article Drivers of global tourism carbon emissions Article Open access Published: 10 December 2024 Volume 15, article number 10384, (2024) Cite this article Download PDF You have full access to this open access article From View current issue Drivers of global tourism carbon emissions Download PDF Ya-Yen Sun ORCID: orcid.org/0000-0001-6788-76441, Futu Faturay ORCID: orcid.org/0000-0001-5636-17941,2, Manfred Lenzen ORCID: orcid.org/0000-0002-0828-52883,4, Stefan Gössling ORCID: orcid.org/0000-0003-0505-92075,6 & …James Higham ORCID: orcid.org/0000-0003-1405-70357,8 Show authors 40k Accesses 889 Altmetric 94 Mentions Explore all metrics AbstractTourism has a critical role to play in global carbon emissions pathway. This study estimates the global tourism carbon footprint and identifies the key drivers using environmentally extended input-output modelling. The results indicate that global tourism emissions grew 3.5% p.a. between 2009-2019, double that of the worldwide economy, reaching 5.2 Gt CO2-e or 8.8% of total global GHG emissions in 2019. The primary drivers of emissions growth are slow technology efficiency gains (0.3% p.a.) combined with sustained high growth in tourism demand (3.8% p.a. in constant 2009 prices). Tourism emissions are associated with alarming distributional inequalities. Under both destination- and resident-based accounting, the twenty highest-emitting countries contribute three-quarters of the global footprint. The disparity in per-capita tourism emissions between high- and low-income nations now exceeds two orders of magnitude. National tourism decarbonisation strategies will require demand volume thresholds to be defined to align global tourism with the Paris Agreement. Similar content being viewed by others The carbon footprint of global tourism Article 07 May 2018 The Input–Output Method for Calculating the Carbon Footprint of Tourism: An Application to the Spanish Tourism Industry Chapter © 2022 Studying tourism development and its impact on carbon emissions Article Open access 29 March 2024 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739734500, embedded_user: 'null' } }); IntroductionTravel plays a significant role in contemporary society. Before the COVID-19 pandemic, global tourism contributed US$ 6 trillion in annual economic output and was one of the fastest-growing sectors in the world for ten consecutive years1,2,3. The post-pandemic tourism rebound has been rapid and global tourism is likely to again surpass 20 billion trips in 20244. This sector is pivotal to global emissions trajectories and must be aligned with the Paris Agreement.UN Tourism (World Tourism Organization) is leading the Glasgow Declaration on Climate Action, in collaboration with the UN Environment Programme, to mobilize tourism stakeholders to support the global goals of cutting emissions in half by 2030 and achieving Net Zero at the latest5. The Carbon Offsetting and Reduction Scheme for International Aviation (CORSIA) aims to reach carbon-neutral growth of international aviation emissions from 2020 onwards6. The World Travel and Tourism Council, a representative body for major tourism firms, has put forward a proactive roadmap for private tourism businesses, including accommodation, aviation, cruise, tour operators and travel agents, with the aim to reach net-zero by 20507.Mitigating tourism’s carbon footprint however is an imposing task. In 2013, global tourism contributed 8% of global greenhouse gas (GHG) emissions, and its carbon intensity, defined as emissions per dollar sales, was 20% higher than the average for the global economy8. Historically, most destinations have demonstrated an inability to decouple growth in tourist demand from increasing tourism emissions1,9,10,11,12,13,14,15.A rising emissions pathway is determined by multiple factors, such as demand growth and consumption of carbon-intensive tourism products and services. A critical understanding of these drivers is crucial for assessing and informing effective policy responses. Such an analysis requires a comprehensive tourism footprint database to track both the direct and indirect emissions arising from domestic and international travel over an extended timeframe. Lenzen et al.8 evaluated global tourism emissions over a five-year period (2009–2013) but did not perform a formal analysis to quantify the drivers of emissions growth. National data on the drivers of tourism emissions is now available for individual countries such as Australia, Austria, China, Norway, Portugal, Spain and Iceland9,10,11,12,14,16,17,18. However limited insights are available for other countries where substantial variations exist in tourism demand patterns, technology progress and international trade across destinations.In this study, we present an analysis of global and national tourism carbon footprints between 2009 and 2020. Using environmentally extended input-output modelling we investigate how tourism emissions increase or decrease in relation to technology and demand drivers, and the similarities or differences within and between countries in terms of tourism emissions. To comprehensively answer these research questions, we identify and analyse five key factors that influence tourism emissions: 1. Technology improvements regarding energy efficiency gains; 2. The supply chain concerning the production structure among suppliers; 3. Population growth relating to changes in the volume of tourists; 4. Tourism consumption for the evolving patterns of tourist expenditure; and 5. The use of private vehicles regarding direct emissions generated by internal combustion vehicles used by tourists.This study uses tourism expenditure profiles from 175 countries, including the tourism satellite accounts of 62 countries and tourism consumption data of 113 countries, which are combined with multipliers from the GLORIA database to estimate macro-level tourism emissions from 2009-202019,20 (see Method). Drawing these sources together allows the development of a comprehensive global database from which tourism carbon footprints can be estimated through input-output analysis. This high-resolution database affords unprecedented analytical depth. Carbon footprints were estimated for inbound, outbound and domestic travel for 175 countries, distinguished by source including those produced by local businesses, foreign producers, international flights, and private vehicle use. Tourism carbon footprints were calculated using both residence-based accounting (RBA) to attribute emissions to the countries of visitor origin and destination-based accounting (DBA) for countries where tourism expenditures takes place8 (Supplementary Method 1).ResultsTourism emissions 2009–2020Tourism has outpaced growth of the global economy, rising from US$3.5 trillion in 2009 to US$6.0 trillion in 2019 (US$5.1 trillion, constant price 2009). This represents an annual expenditure growth rate of 5.5% (3.8%, constant price 2009). This consumption is associated with a tourism carbon footprint of 5.2 Gt CO2-e in 2019 (5.1–5.5 Gt, 99% likelihood range) (Supplementary Method 2). The breakdown is as follows: direct emissions amounted to 1.8 Gt (52% from aviation, 18% from road transport), indirect emissions were 2.5 Gt (34% from utilities, 14% from petroleum manufacturing), and private vehicle emissions added 0.9 Gt (detailed in SI 1). In total, global tourism in 2019 was responsible for 8.8% of global anthropogenic warming, or 9.9% when excluding LULUCF (Table 1). Substantial non-CO2 radiative forcing effects from air transport was not included in this assessment21,22,23.Table 1 Expenditure, carbon footprint and carbon intensity of global tourism, 2009–2020Full size tableBetween 2009 and 2019, the sector’s emissions increased by 1.5 Gt CO2-e (from 3.7 Gt to 5.2 Gt), which is equivalent to the annual emissions produced by all of Latin America and the Caribbean. The tourism carbon footprint expanded at a rate (3.5% p.a.) twice that of the global economy (1.5% p.a.) during this period, highlighting its status as a sector that is challenging to decarbonize. If the same growth rate is maintained into future years, tourism emissions are expected to double every 20 years.Tourism is carbon intensive. Every dollar earned in tourism generates 1.02 kg of GHG emissions in 2019 (SI 2). This is approximately 4 times higher than the service sector (0.24 kg/$), and 30% higher than the global economy (0.77 kg/$). From a sectoral perspective, most net emissions were generated by air transport (0.27 Gt) and utilities (0.26 Gt). Travellers’ use of private vehicles also contributed substantially, with combustion engines estimated to produce net emissions of 0.29 Gt and petrol production resulting in 0.13 Gt.The COVID-19 pandemic is the only event that drastically reduced tourism’s carbon footprint, producing a smaller environmental impact than the base year 2009 (Table 1). In 2020, limitations in international travel and reductions in domestic tourism led to a decline in global tourism emissions from 5.2 Gt in 2019 to 2.2 Gt in one year. The sector’s carbon intensity improved from 1.02 to 0.85 kg CO2-e per US$ (constant price 2009). The decline in emissions is a result of foregone consumption of US$ 3.1 trillion (US$2.5 trillion, constant price 2009) and the concomitant reduction in air travel and private vehicle use. Expenditure associated with these two components decreased by 50% within one year. The net decline of 3.0 Gt CO2-e in tourism carbon footprints represents two thirds of total global carbon emissions reduction in the first year of the COVID-19 pandemic15. The pandemic provides a living experiment of the significance of tourism as a driver of growth in global emissions.Tourism carbon emissions vary considerably by country. RBA analysis reveals that visitors from the United States produced 1.0 Gt CO2-e, accounting for 19% of the total global tourism footprint in 2019. In that year three countries, the United States, China (0.8 Gt CO2-e, or 15%) and India (0.3 Gt CO2-e, or 6%), produced 39% of global tourism CO2-e. The top twenty countries, predominantly highly developed countries with large populations, contributed 3.9 Gt CO2-e in total, or three quarters of the total tourism footprint (Fig. 1, left). A substantial inequality in emissions contributions by countries is observed (SI 3-5). DBA analysis again highlights the significance of the United States (19%), China (15%) and India (6%), while several Middle East countries including Saudi Arabia, and the United Arab Emirates, have emerged in the twenty highest emitting countries due to substantial increases in inbound tourism over the past decade (Fig. 1, right).Fig. 1: Tourism carbon footprints according to residence-based accounting (RBA) and destination-based accounting (DBA).RBA measures emissions resulting from residents’ domestic and outbound travel, while DBA measures emissions from domestic and inbound tourism activities occurring within a country. The domestic travel footprint is represented in grey, the inbound tourism footprint in green, and the outbound tourism footprint in blue.Full size imageDrivers of tourism emissions: technology vs consumptionUsing structural decomposition analysis (see Method), the net increase of 1.5 Gt CO2-e tourism emissions between 2009 and 2019 can be broken down into five components. At the global level, growth in tourism consumption is the largest factor driving tourism emissions. The amount of money spent on accommodation, gastronomy and transport has constantly increased over time24. Per capita tourism expenditure increased from US$536 per capita in 2009 to US$672 in 2019 (constant price 2009), and this caused tourism emissions to rise by 1.4 Gt CO2-e (Fig. 2).Fig. 2: Decomposition result of the tourism carbon footprints, 2009-2019.Tourism carbon footprints increased from 3.7 GtCO2-e to 5.2 Gt from 2009 to 2019. The net changes, 1.5 Gt CO2-e, were broken down into five components to highlight relative contribution of individual factors.Full size imageGlobal population growth from 6.9 billion to 7.8 billion over the decade is an important factor behind changes in tourism consumption that is responsible for 0.3 Gt CO2-e. As people travel more frequently, the use of private internal combustion vehicles by tourists accounted for 0.3 Gt CO2-e whereas two thirds of the increase in emissions resulted from domestic travel.Technology improvements simultaneously led to a decline in emissions of 0.5 Gt CO2-e. Emissions intensities, defined as emissions per dollar economic output, improved by 0.3% per annum over the period 2009–2019 (Table 1). In comparison, tourism expenditure growth was 3.8% per year, confirming that emissions intensity improvements were heavily outweighed by consumption growth. These findings are corroborated by airlines, cruise lines and hotel chains that report efficiency gains of 1–2.6% per annum, and sales increases of 3–7%25.Overall, production factors (technology and the supply chain) only offset around 25% of the tourism emissions growth that was driven by consumption factors (expenditure per capita, population and private car use). The global tourism carbon footprint has expanded at approximately two-thirds of the speed of tourism consumption in nominal price.Drivers of tourism emissions: top countriesThe net increase in tourism emissions is unevenly distributed, with growth in domestic travel in three countries—the USA, China, and India—contributing most to the absolute rise in emissions (Fig. 3). China’s domestic tourism expenditure expanded by 17% per annum over the past decade and pushed global emissions up by 0.4 Gt CO2-e, followed by domestic tourism in the USA (0.2 Gt) and India (0.1 Gt). A noteworthy rise in emissions was also caused by outbound travel from China (0.1 Gt).Fig. 3: Decomposition result for the top 10 RBA countries, 2009–2019.Changes in tourism carbon footprints can be attributed to production factors: technology (blue) and supply chain (red) and consumer factors: per capita expenditure (yellow), population (purple), and private vehicle use (green). Negative values indicate the extent to which emissions are reduced through a particular factor, ceteris paribus. Conversely, positive values demonstrate how that particular factor contributes to an increase in emissions.Full size imageAssessing relative emissions over economic status reveals that middle-income countries, were drivers of the growth trajectory in outbound tourism, with emissions increasing by more than 57% from the base year in 2009 (SI 6). In comparison, high-income and low-income countries experienced 27% and 38% increases, respectively, in emissions over the past decade.Tourism emissions in all countries have been mitigated to varying degrees by technology innovation, most notably China (−0."
