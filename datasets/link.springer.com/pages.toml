title = "Starvation remains the leading cause of death in Tigray, northern Ethiopia, after the Pretoria deal: a call for expedited action | BMC Public Health"
description = "Background People in war-affected areas are more likely to experience excess mortality with hunger. However, information on the causes of death associated with hunger is often nonexistent. The purpose of this study was to verify and investigate hunger and hunger-related deaths after the Pretoria deal in Tigray, northern Ethiopia. Methods A cross-sectional study was conducted in nine districts and 53 IDP sites, which were randomly selected. All households with deceased family members were included and screened for perceived causes of death between November 2, 2022, and August 30, 2023. Suspected starvation deaths were further verified by the WHO-adapted verbal autopsy questionnaire to establish cause-specific mortality. Using a standardized cause-of-death list, three physicians assigned the causes of death, and disagreements over-diagnoses were settled by consensus. The Food and Nutrition Technical Assistance guidelines were also used to quantify household hunger status. Results Verbal autopsies were conducted for 72.2% (1946/2694) of deaths. Of these deaths, 201 (7.5%) in under-five children and 1205 (44.7%) in females were recorded. Deaths increased from 8.6% in March to 16.4% in July. A total of 90.6% of deaths occurred at home. Starvation was the predominant cause of death across all ages (49.3%, n = 1329). About 94/155 (60.3%) in the IDP center and 1235/2539 (48.6%) in the community died due to starvation. Children under five had a higher risk of starvation-related deaths (OR = 1.7; 95% CI: 1.22–2.34). Females were also more likely to die by starvation than males. Large proportions of households (60.1%) had moderate or severe hunger. Conclusion Starvation was the leading cause of death across all ages in the study group. This reflects an expedited humanitarian response from aid agencies to prevent more deaths. Interventions, including the return of the displaced communities to their original homes, are needed to rescue those facing moderate to severe hunger."
full_description = "Home BMC Public Health Article Starvation remains the leading cause of death in Tigray, northern Ethiopia, after the Pretoria deal: a call for expedited action Research Open access Published: 18 December 2024 Volume 24, article number 3413, (2024) Cite this article Download PDF You have full access to this open access article BMC Public Health Aims and scope Submit manuscript Starvation remains the leading cause of death in Tigray, northern Ethiopia, after the Pretoria deal: a call for expedited action Download PDF Mekonnen Haileselassie1, Hayelom Kahsay1, Tesfay Teklemariam1, Ataklti Gebretsadik1, Ataklti Gessesse1, Abraham Aregay Desta1, Haftamu Kebede1, Nega Mamo1, Degnesh Negash1, Mengish Bahresilassie2, Rieye Esayas2, Amanuel Haile2, Gebremedhin Gebreegziabiher3, Amaha Kahsay3, Gebremedhin Berhe Gebregergs3, Hagos Amare3 & …Afework Mulugeta3 Show authors 7382 Accesses 242 Altmetric Explore all metrics AbstractBackgroundPeople in war-affected areas are more likely to experience excess mortality with hunger. However, information on the causes of death associated with hunger is often nonexistent. The purpose of this study was to verify and investigate hunger and hunger-related deaths after the Pretoria deal in Tigray, northern Ethiopia.MethodsA cross-sectional study was conducted in nine districts and 53 IDP sites, which were randomly selected. All households with deceased family members were included and screened for perceived causes of death between November 2, 2022, and August 30, 2023. Suspected starvation deaths were further verified by the WHO-adapted verbal autopsy questionnaire to establish cause-specific mortality. Using a standardized cause-of-death list, three physicians assigned the causes of death, and disagreements over-diagnoses were settled by consensus. The Food and Nutrition Technical Assistance guidelines were also used to quantify household hunger status.ResultsVerbal autopsies were conducted for 72.2% (1946/2694) of deaths. Of these deaths, 201 (7.5%) in under-five children and 1205 (44.7%) in females were recorded. Deaths increased from 8.6% in March to 16.4% in July. A total of 90.6% of deaths occurred at home. Starvation was the predominant cause of death across all ages (49.3%, n = 1329). About 94/155 (60.3%) in the IDP center and 1235/2539 (48.6%) in the community died due to starvation. Children under five had a higher risk of starvation-related deaths (OR = 1.7; 95% CI: 1.22–2.34). Females were also more likely to die by starvation than males. Large proportions of households (60.1%) had moderate or severe hunger.ConclusionStarvation was the leading cause of death across all ages in the study group. This reflects an expedited humanitarian response from aid agencies to prevent more deaths. Interventions, including the return of the displaced communities to their original homes, are needed to rescue those facing moderate to severe hunger. View this article's peer review reports Similar content being viewed by others Continuing with “…a heavy heart” - consequences of maternal death in rural Kenya Article Open access 06 May 2015 Adult Undernutrition in Rural Post-conflict Northern Uganda Chapter © 2017 Adult Undernutrition in Rural Post-conflict Northern Uganda Chapter © 2019 window.dataLayer = window.dataLayer || []; window.dataLayer.push({ recommendations: { recommender: 'semantic', model: 'specter', policy_id: 'NA', timestamp: 1739734374, embedded_user: 'null' } }); BackgroundHunger and undernutrition are the greatest threats to public health, killing more people than HIV/AIDS, malaria, and tuberculosis combined [1]. Globally, about 735 million people faced hunger in 2022 [2]. Each day, 25,000 people, including more than 18,000 children, die from hunger and hunger-related causes [1]. Nearly 98% of worldwide hunger exists in underdeveloped countries and Africa takes the biggest share (20%), followed by Asia (8.5%) [2, 3]. Focusing on East Africa, hunger is expected to claim one life every second [1]. This is in contradiction to the fundamental right of human beings to have access to adequate food and the international law binding all nations to keep their citizens free of hunger [4, 5]. Moreover, it also erodes the global commitment to end hunger by 2030 [6].Regrettably, this deprivation is not because of insufficient food production. But people are getting starved to death, with women and children paying the highest price, in the world of plenty, owing to uneven distribution and poor access to food while weather extremes, the COVID-19 pandemic, and spiraling food prices all contribute; armed conflict is the main cause of hunger and malnutrition [7, 8].In many places, conflict and hunger are intertwined, one reinforcing the other, forming a vicious cycle that is hard to break [9]. Conflict precipitates hunger in many ways, all of which were apparent in the war on Tigray, Northern Ethiopia. Fighting disrupts environmental security and hinders access to farmland and food production [10]. It also prevents access to markets and interferes with the flow of commercial food commodities and humanitarian aid, limiting access to sufficient food suppliesm [11, 12]. Combatants to the fighting burn harvest steal or slaughter livestock, intentionally loot and/or destroy food stocks, seed crops, and other productive assets [9, 10, 12, 13]. Warring parties systematically cause mass displacement of civilians by burning their houses and properties [10, 14]. Moreover, hunger is a weapon of war through the deliberate killing of humanitarian workforces and the blockade of humanitarian corridors [11, 15]. Conversely, hunger can also lead to violence and fuel conflict. For instance, displacement could result in straining over the resources of the host communities and cause tension and violence [10].Given that the link between conflict and hunger is multidimensional, it is essential to ensure a strong nexus between humanitarian assistance, development, and peace-building activities to break this cyclical relationship and sustainably rehabilitate the community [16]. Specifically, regarding the situation in Tigray, the cessation of hostilities occurred following the signing of the Pretoria peace deal on November 2, 2022, between the Government of the Federal Democratic Republic of Ethiopia and the Tigray People’s Liberation Front (TPLF), marking a significant milestone [17].However, the effort to sustain this peace accord through humanitarian assistance and high-impact developmental interventions to transform the livelihood of the community is meager. There was a noticeable delay in the resumption of aid; the flow after resumption was infrequent and inadequate; the distribution process was tardy; and since April 2023, there has been a complete aid suspension over allegations of aid diversion [18, 19]. Altogether, the post-war engagement is insufficient to address the food shortage legacy of the active fighting. Hence, hunger is continuing in its worst form, and death reports are mounting concerning it.Referring to Tigray’s Disaster Risk Management (DRM) Commission, Addis Standard [20], Reuters [21], Associated Press (AP) [22], and The Telegraph [19] have reported hunger deaths among more than 700 people. Unpublished research findings from Mekelle University also uncovered 165 deaths in seven internally displaced people (IDP) camps [19]. The claimed death rate is understated in light of the following reality on the ground. Ethiopia as a nation is in a state of serious hunger as per the global metric (GHI 27.6, ranking 104th out of the 121 countries) [23]. The war on Tigray has left 5.4 million people food insecure, with a considerable number of them in a reportedly famine-like condition [22]. A recent systematic study conducted by the Tigray Health Research Institute (THRI) discovered severe food insecurity being pervasive in two-thirds of households (66.9%), with half of the households (50.1%) having no food to eat at home. Moreover, 38% of the under-five children studied were acutely malnourished, with severe acute malnutrition ensuing in 9.2% of them [24]. Overall, surpassing the 15% Global Acute Malnutrition (GAM) rate as a threshold for a widespread emergency and the 18% point increase (from 10% in 2019 to 28% in 2022) in children of Tigray [25], we expect more hunger deaths to unfold.Generating the hunger death statistics will be useful in updating the international community about the food and nutrition security status of the community to influence the aid agencies toward the resumption of humanitarian aid and other pertinent services essential to the debilitated community.Therefore, the objective of this study was two-fold: 1. Verify and investigate hunger and hunger-related deaths among the study communities. 2. Explore the community level of risks for death due to hunger. Methods and materialsStudy areaThe study was carried out in nine woredas, namely, Bora, Samre, Seharti, DeguaTemben, Quolatemben, Rural Hawzien, Rular Adwa, Zana, and Laelay Qoraro. All IDP centers in Maichew, Mekelle, AbiAdi, Adigrat, and Shire were also part of the study setting (Fig. 1). More than five million people reside in the region, with rural inhabitants constituting 81.5% of the total population. The region has 1,165,575 households (HH), averaging 4.4 persons per household; this includes 3.4 persons per household in urban areas and 4.6 persons per household in rural areas. Prior to the conflict, the region had 712 health posts, 214 health centers, and 38 hospitals, which comprised one specialized hospital, fifteen general hospitals, and twenty-two primary hospitals. Additionally, there were 629 private health facilities, resulting in a healthcare coverage of 92%. There are close to one million internally displaced people in the region residing in 94 IDP centers.Fig. 1Study districts from the Tigray Administrative Region, Northern EthiopiaFull size imageStudy design and periodWe conducted a cross-section survey to verify starvation suspected deaths among individuals who have died since the Pretoria peace agreement from November 02, 2022, until July 30, 2023. Data were collected from August 15 to 29, 2023.Study populationAll households with deceased family members were eligible for inclusion in the study. This inclusive approach facilitated a comprehensive examination of mortality within the community, enabling a deeper understanding of the factors contributing to these losses.Sampling technique and sample sizeInitially, we had the plan to assess and verify all causes of death from all accessible (76) districts of Tigray. However, due to budget constraints, we opted to randomly select nine districts. In the selected woreda, all Tabias were censused to trace for deaths of any cause in the community. Besides, we included 53 IDP centers in five big towns (Fig. 2). In each selected woreda, all causes of death were enrolled, screened, and verified accordingly. A total of 2694 deaths were identified from the study area.Fig. 2Diagrammatic representation of the research method to verify suspected starvation deaths in Tigray, northern EthiopiaFull size imageScreening approach for cause of deathThe screening for causes of death in the study employed a systematic approach involving households with deceased family members. Initially, all deaths were identified within each Tabia, the smallest administrative unit, and subsequently screened for perceived causes, with a particular emphasis on suspected starvation-related deaths using a screening tool (S1 cause of death screening tool, HHS and verbal autopsy questionnaire). This process included the application of a verbal autopsy questionnaire to validate suspected cases, enabling the collection of detailed information from caregivers regarding the circumstances surrounding each death. This methodology was similarly applied to confirm deaths attributed to starvation among internally displaced persons (IDPs) during the specified timeframe.Data collection procedureFifty trained health professionals utilized the VA tool to conduct individual household visits to the families of deceased individuals. During these visits, they interviewed family members or close relatives and collected data electronically using smartphones. We collected primary data on socio-demographic information, feeding status and clinical data of the deceased, and hunger risk of household (HH). Data collection was made using face-to-face interviews with family members of the deceased. During the field investigation, we first met woreda health office/social affairs to record the number of deaths; then we interviewed family members of the deceased to screen the nutritional situation (food intake) of the deceased one month before death. We also conducted a verbal autopsy to verify starvation-related deaths among households with suspected ones. All households were also screened with a deceased for current hunger using a household hunger scale. For further clarity and trustworthiness of the data collected, GPS data were taken from each household.Data collection toolWe utilized Verbal Autopsy (VA) Questionnaires adapted from guidelines for investigating suspected starvation deaths. This tool was developed by the Hunger Watch Group of Jan Swasthya Abhiyan (JSA) and the Public Health Resource Network (PHRN) of India [26]. The adaptation of the questionnaire draws from WHO guidelines while integrating local knowledge and practices to enhance its applic uh ability and effectiveness in low-resource settings where formal medical records may not be available [26]. The questionnaire is not only scientifically robust but also more relevant to allow for accurate data collection regarding the circumstances surrounding starvation-related deaths.The VA questionnaire had major sections such as (1) Personal identification details, (2) Family food supply-related information, and category-wise status of food items being consumed by the family, (3) Individual dietary history during the week and the month before death, (4) Unnatural food consumption patterns such as begging or borrowing food, consumption of unusual foods such as leaves of plants, forest tubers, (5) Signs and symptoms during the last illness, as well as any medical records and prescriptions, (6) Physical appearance at the time of death (S1 cause of death screening tool and verbal autopsy questionnaire).Outcome ascertainmentWe used the Physician-coded verbal autopsy (PCVA), which is the most widely used method which was mainly developed to offer information on the cause of death in communities where there was very limited access to healthcare and medical certification of causes of death [27, 28]. In such situations, the only viable source of information on the terminal illness is from caregivers of the deceased, most often the family members. Hence, the information collected on the symptoms suffered and signs observed was given individually and independently to a panel of physicians t"
