["https://www.linode.com/content-type/webinars"]
title = "Cloud Computing Webinars | Akamai"
description = "Live and on-demand cloud computing webinars from Akamai."
full_description = "Subscribe Webinars Live and on-demand cloud computing webinars. Categories: Compute, Containers (Kubernetes, Docker), Linode, Storage Webinar Building in the Cloud: How to Optimize Cost and Performance In a new three-part video series, Building in the Cloud: How to Optimize Cost and Performance, our cloud engineering team and other experts will walk you through the mechanics and benefits of cloud optimization. Linode Webinar 3 Lessons in Cloud Management Tune into this webinar to hear Akamai’s CIO Kate Prouty share with IDC’s Adam Reeves how with the right tools, executive level support, diligence, and a modern platform as a service approach, you can bring your cloud costs and sprawl under control. Linode Webinar Discover How Akamai & Ateme Lower the Barrier to Entry in Media & Entertainment In this webinar, media owners will learn and discover ways to boost viewership and subscriber engagement, while unifying delivery. Compute Webinar From Edge to Cloud Ecocast This webinar will show you how the new generation of solutions work, what factors to take into consideration when selecting among solutions, and how to get the most out of the latest backup and recovery technology. Storage Webinar Dynamically rebalancing workloads and optimizing resource utilization in Kubernetes In this session, you will learn how the Kubernetes scheduler works and why assigning the correct requests is essential and much more. Containers (Kubernetes, Docker) Webinar How to (right) size your Kubernetes cluster for efficiency In this session, you will explore how Kubernetes reserves resources in a worker node, including how different cloud providers address this. Containers (Kubernetes, Docker) Webinar Kubernetes (down)scaling: combining autoscalers for minimal resource allocations In this video, Salman will show you how to combine ausoscalers for minimal resource allocation and cost opitmization. Containers (Kubernetes, Docker) Webinar Monolith Architecture to Microservices Gain valuable insights into the tools, patterns, and technologies for a successful transition from monolithic architecture to microservices. Containers (Kubernetes, Docker) Webinar Try Knative In this course, Justin Mitchel will show you how to deploy serverless containerized applications on Kubernetes by using Knative. Containers (Kubernetes, Docker) Webinar Scaling Kubernetes to multiple clusters and regions Learn how to create, connect and operate three Kubernetes clusters in different regions: North America, Europe and South East Asia. Containers (Kubernetes, Docker) Webinar Request-based autoscaling in Kubernetes: scaling to zero and back In this session, you'll learn how to monitor HTTP requests to your apps and how to define autoscaling rules for your workloads. Containers (Kubernetes, Docker) Webinar CI/CD for Kubernetes with Jenkins X The lab focuses on real-life examples and shows you how JenkinsX and GitOps can be used to speed your development practices and train high-performing teams. Containers (Kubernetes, Docker) 1 2 Next »"
