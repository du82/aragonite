["https://www.linode.com/developers/api-tools-and-libraries"]
title = "Linode API Developer Tools and Libraries | Akamai"
description = "For Developers Linode API Tools and Libraries Tools and libraries for the Linode API Tools Libraries API Tools pip3 install linode-cli linode-cli linodes"
full_description = '''For Developers Linode API Tools and Libraries Tools and libraries for the Linode API Tools Libraries API Tools pip3 install linode-cli linode-cli linodes create Linode CLI An easy way to get up and running with the Linode API. Linode CLI on GitHub Linode terraform-provider-linode Linode's official Terraform Provider. Terraform is an Infrastructure-as-code tool that includes management features for various types of Linode resources. Linode Linode Ansible Collection The Ansible Linode Collection allows for provisioning Linode infrastructure through Ansible. Community Ansible linode_v4 module Ansible includes a "linode_v4" module for automating Linode instance provisioning by Luke Murphy Linode Rancher Rancher's UI centralizes Kubernetes management concerns when dealing with multiple clusters across multiple clouds. Linode Pulumi Pulumi lets you use the full feature set of a general purpose programming language, like Python, JavaScript, and GO to manage Linode resources. Linode packer-builder-linode The Packer Builder plugin for Linode Images makes it easy to create private Linode Images. Linode Images can be used in subsequent deployments in any Linode region. Linode linode-blockstorage-csi-driver Container Storage Interface driver for Linode Block Storage integration with Kubernetes and other container orchestrators. Linode linode-cloud-controller-manager Kubernetes Addon featuring automatic Linode NodeBalancers provisioning to enable LoadBalancer services and Linode status reporting to allow resources to be rescheduled when Linodes are powered down or removed. Community Kubernetes External-DNS External-DNS is a Kubernetes Incubator project that assigns DNS names to Service and Ingress resources in Kubernetes Clusters. Linode DNS Manager is a supported backend. Community terraform-provider-acme The Automated Certificate Management Environment (ACME) provider for Terraform can be used to configure Let's Encrypt, Boulder, and other ACME CAs using Linode's DNS Manager. Community traefik Traefik is a HTTP reverse proxy and load balancer for Container Orchestrators (Kubernetes, Docker Swarm, and others) that features automatic TLS configuration using Linode DNS Manager for ACME challenge requests. Community vagrant-linode Vagrant-linode is a provider plugin for Vagrant that supports the management of Linode instances by Marques Johansson Community Pharmer Kubernetes Cluster Manager for Kubeadm (Technical Preview) Community kube-linode Provision a Kubernetes/CoreOS cluster on Linode by Andrew Low Linode docker-machine-driver-linode The Linode Docker Machine Driver provisions Linode instances to run Docker Engine. Linode docker-volume-linode The Docker Volume Driver for Linode Block Storage makes it possible to use Docker commands to provision, attach, and detach volumes to containers. Volumes can be destroyed automatically when not in use. Linode Linode Add-on for Splunk The Linode Add-on for Splunk ingests Linode account information into Splunk. API Libraries Go-Acme lego Let's Encrypt client and ACME library written in Go featuring support for the Linode DNS Provider Linode Linode JavaScript SDK JavaScript client for the Linode APIv4. Community linode-api Unofficial Linode APIv4 PHP wrapper by tzurbaev Community linode-api-node Unofficial Linode APIv4 Node.js wrapper by RobinJ1995 Community linode-api-v4 Unofficial Linode APIv4 PHP wrapper by iDimensionz Linode linode_api4-python The official python library for the Linode APIv4 in python. Linode linodego Official Go client for Linode APIv4 Community php-linode-api Unofficial Linode APIv4 PHP wrapper by H&H|Digital Community php-linode-unofficial Unofficial Linode APIv4 PHP wrapper by Will Blew'''
