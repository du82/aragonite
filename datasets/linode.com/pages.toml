full_description = '''Gaming INDUSTRY SOLUTIONS Cost-effective game server hosting and development solutions to build your game and scale as you grow. Drive performance and speed to market with developer-friendly cloud computing services. Create Account Let's Chat TRUSTED BY Cloud Computing Services Transform your game workloads with affordable, feature-rich cloud services that are fast to deploy and backed by expert human support, regardless of how much you spend with us. Cloud GPU On-demand GPUs for parallel processing workloads such as machine learning, scientific computing, and video processing. High Memory CPU Run workloads that require enterprise-grade performance with large amounts of system RAM and 100% CPU resources 24/7. Dedicated CPU Powerful infrastructure for CPU-intensive applications such as video encoding, machine learning, and data analytics processing. Low-cost, no-cost add-ons Cloud Firewall Filter network traffic DDoS Protection Advanced DDoS mitigation DNS Manager Create and managed DNS records Backups Safe and simple cloud backups Why millions of developers choose us. Award-Winning Support No tiers or hand-offs. A highly-trained service team who answer the phone and solve your issue 24/7/365. Predictable Pricing CPU, transfer, storage, and RAM bundled into one flat price. Cloud Simplified Easily manage and scale your infrastructure with our intuitive Cloud Manager, automation, one-click apps, and more. Global Network Our global data centers and Next Generation Network deliver the low latency, security, and reliability you need to scale. Certifications Featured Services Kubernetes Simplified Kubernetes for projects of all sizes. Deploy Kubernetes clusters with our fully-managed container orchestration. Monitoring Easily analyze performance graphs and keep track of your transfer usage right from our Cloud Manager. Create custom alerts for when you near thresholds you set. Images Easily create, store, and deploy one image across multiple machines with Custom Images. Gaming Success The move to Akamai solved cost, security, and performance concerns. "I’m looking forward to the new integrations we can put in place enabled by our work with Akamai and Linode.” Mike Kasprzak, Co-founder, Caretaker, Lead Developer Ludum Dare More Resources for Game Developers The latest content, technical guides, apps, customer stories, and more. Guides, How-to's, and Technical Docs Explore technical documentation Installing MySQL: A Definitive Guide Learn how to install MySQL on Linux (through your distribution's native repositories or by using MySQL's own), Windows, and macOS. Database Sharding: Concepts, Examples, and Strategies Database sharding divides data into smaller chunks and distributes it across different database nodes. Learn more about sharding practices and strategies. Use Terraform With Linode Object Storage This guide provides a brief introduction to Terraform, and explains how to use it to configure Linode Object Storage. Use Terraform to Provision Infrastructure on Linode This article gives you step-by-step instructions on how to use Terraform to provision, modify, and destroy infrastructure using only code and simple commands. Install and Configure Apache Kafka on Ubuntu Learn how to install and configure Apache Kafka, a popular open-source platform for stream management and processing first developed by LinkedIn. Navigate MongoDB and Query Your Data Learn how to navigate your MongoDB database. From examples of the various query operators through text searches and indexing, this tutorial has you covered. How to Use Indexes in MongoDB Learn what MongoDB indexes are, how to create and modify them to improve your database query performance. Getting Started with MongoDB MongoDB gives you a flexible and less rigid way to store your data than traditional relational databases. This tutorial gives everything you need to start using MongoDB. Secrets Management with Ansible Ansible is a powerful tool for automating server provisioning and management. But these tasks often require secrets like passwords and access tokens. To keep your secrets secure, you should implement secrets management with Ansible. Learn how to choose the best secrets management solution for your needs and how to get started using it with Ansible in this tutorial. Deploy Secure Linodes using Cloud Firewalls and Terraform This guide will show you how to use the Terraform application to deploy Linode instances with pre-configured Cloud Firewalls assigned to them. Deploy a Packer Image with Terraform Packer automates the process of developing machine images, and Terraform automates the provisioning of infrastructure. Not surprisingly, combining the two can give you a full and robust chain for automating deployments, including CI/CD. Through this tutorial, learn what you need to put these tools together for your infrastructure. Install Chef on Ubuntu 20.04 This guide provides a brief introduction to the Chef configuration management software and explains how to install and use it. Understand and Use IP Addresses This guide will help you understand the Internet Protocol (IP) which underpins the entire Internet, as well as IP addresses, and how to describe and use them. Use Buildah to Build OCI Container Images Buildah is a powerful open-source tool for creating containers and container images. Whether you want to create containers for Dockerfiles and Containerfiles or entirely from scratch, Buildah provides a robust set of features to carry you through. Learn all about Buildah and how to get started using it in this tutorial. Podman vs Docker: Comparing the Two Containerization Tools Containers offer portable, lightweight environments for developing and deploying applications. And while Docker has been the most popular containerization tool, Podman has arisen as a compelling alternative. What sets the two tools apart, and when should you use one over the other? Find out in this tutorial comparing Podman and Docker. Install Podman for Running Containers Podman has risen as a compelling alternative to Docker for deploying and managing containers. Podman stands out for its daemonless architecture, which gives it true rootless containers and heightened security. In this tutorial, find out all you need to get started installing and using Pdoman for running containers. Use the Linode Ansible Collection to Deploy a Linode The Linode Ansible collection provides plugins for managing Linode services with Ansible. This guide shows how to install and use the Linode Ansible collection. Use Redis for Client-Side Caching Modern web applications rely on client-side caching to enhance its performance. This guide shows you how to use Redis for server-assisted client-side caching. Automatically Backup Mongodb Databases Using Bash Scripting In this guide, you learn how to create a Bash script that creates a backup of all current MongoDB databases. The MongoDB backup is in a .tar file format and is configured to be uploaded to a Linode object storage bucket. You also learn how to configure a Cron job that automatically runs the backup script daily. Use Hashes in Redis Databases Redis Hashes are maps of field and value pairs. In this guide, you learn how to use Redis hashes, maps of fields, and values frequently used for storing objects. Prev Next Marketplace Solutions See all Marketplace solutions VS Code Server Run VS code in the cloud, right from your browser GitLab Most popular self-hosted Git tool to manage the DevOps lifecycle Jenkins Automate your infrastructure by delegating jobs and tasks to Jenkins MySQL/MariaDB World’s most popular open source database PostgreSQL Powerful and flexible open source relational database management system RabbitMQ Most popular open source message broker Prev Next Ready to get started or have questions? Set up your free account today or contact a sales consultant to learn more. Create account Contact sales'''
