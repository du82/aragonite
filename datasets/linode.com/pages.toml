full_description = '''Docs Home List Sections Tiles Product docs and API reference are now on Akamai TechDocs.Search product docs. Search for “” in product docs.Search API reference. Search for “” in API reference.Search Results results matching resultsNo Results Previous NextFiltersFilters ( ) All Add tags All Add authors All <p class=my-8>This page requires JavaScript enabled to work properly.</p><section class="mb-5 md:mb-10 pt-7 pb-10 kind-home__hero full-width bg-brand"><div class=mt-4 style=max-width:864px><h1 class="font-semibold text-4xl text-white">Welcome to Linode Docs</h1><div><div class="mt-4 md:space-x-4 space-y-4 md:space-y-0 w-full flex flex-col md:flex-row text-white text-2xl tracking-tight">Developer resources for building on Akamai Connected Cloud</div></div></div></section>Welcome to Linode DocsDeveloper resources for building on Akamai Connected CloudCloud Guides & TutorialsMigrating from AWS SNS to RabbitMQ on AkamaiLearn how to migrate from AWS SNS to RabbitMQ running on Akamai. Discover RabbitMQ's queue-based messaging and advanced routing features compared to AWS SNS.Migrating from Azure Service Bus to RabbitMQ on AkamaiLearn how to migrate from Azure Service Bus to RabbitMQ on Akamai. Discover RabbitMQ's customizable routing and multi-protocol messaging advantages over Azure …Migrating from GCP Pub/Sub to RabbitMQ on AkamaiLearn how to migrate from GCP Pub/Sub to RabbitMQ on Akamai. Discover RabbitMQ's flexibility and advanced routing capabilities over GCP Pub/Sub.Deploy an AI Chatbot and RAG Pipeline for Inferencing on LKEUtilize the Retrieval-Augmented Generation technique to supplement an LLM with your own custom data.Deploying RabbitMQ on a LinodeLearn how to install and configure RabbitMQ on a Linode instance. This guide covers setting up the message broker, enabling management tools, and testing …Migrating From AWS CloudWatch to Prometheus and Grafana on AkamaiMigrating from AWS CloudWatch to Prometheus and Grafana? Learn how to configure metrics, build custom dashboards, and optimize monitoring with cost-effective, …Migrating From Azure Monitor to Prometheus and Grafana on AkamaiMigrating from Azure Metrics to Prometheus and Grafana? Learn how to configure metrics, build custom dashboards, and optimize monitoring with cost-effective, …Migrating From GCP Cloud Monitoring to Prometheus and Grafana on AkamaiMigrating from GCP Cloud Monitoring to Prometheus and Grafana? Learn how to configure metrics, build custom dashboards, and optimize monitoring with …Deploying RabbitMQ on Kubernetes with LKELearn how to deploy RabbitMQ on Linode Kubernetes Engine (LKE) using the RabbitMQ Cluster Kubernetes Operator in this step-by-step guide.New and updated Cloud Guides & TutorialsExplore all Cloud Guides & Tutorials Reference ArchitectureAutoscaling on Linode using PrometheusGuidance on IaaS primitives, open source software, and architecture design to implement a highly available and production ready Cloud-based document management …Cloud-based Document ManagementGuidance on IaaS primitives, open source software, and architecture design to implement a highly available and production ready Cloud-based document management …Horizontal Scaling with Observability and MonitoringHorizontally scale infrastructure to meet demands of a growing application through HAProxy, and monitor with Prometheus and Grafana.Explore all Reference ArchitectureMarketplace AppsDeploy a Galera Cluster through the Linode MarketplaceThis guide shows how to deploy a MySQL/MariaDB Galera Cluster through the Linode Marketplace.Deploy a LAMP Stack through the Linode MarketplaceThis guide shows you how to use the Linode Marketplace One-Click Application to deploy a LAMP (Linux, Apache, MySQL, PHP) stack on a Linode running Linux.Deploy a LEMP Stack through the Linode MarketplaceThis guide shows you how to use the Linode Marketplace to deploy a LEMP (Linux, NGINX, MySQL, PHP) server stack on a Linode Compute Instance.Explore all Marketplace AppsNow on Akamai TechDocsProduct docsBuild, deploy, and scale your modern applications faster and easier on Akamai Connected Cloud.Linode API referenceProgrammatically manage the full range of Akamai cloud computing products and services using the Linode API.BlogBrowse All Content ResourcesBrowse All'''
