agement tools and resources to get the most out of your applications – and the docs to show you how. Cloud Manager Intuitive cloud interface API Manage your Linodes via our API CLI Command line access to your cloud infrastructure Terraform Provider Describe your infrastructure as code Marketplace Deploy with preinstalled One-Click Apps Images Custom and prebuilt image distributions Integrations Leverage powerful third-party tools StackScripts Custom recipes for your Linodes Monitoring Accurate and detailed usability reporting Users & Permissions Manage user roles and privileges Akamai Content Delivery Network (CDN) Pair our scalable cloud platform with content delivery solutions to maximize application price-performance. Adaptive Media Delivery Highly performant multimedia streaming Download Delivery Optimize download speeds for large files Ion Content delivery automation and analytics Global Traffic Management Cross-region load balancing Learn more about securing and scaling your cloud workloads Akamai Security Secure application workloads at every level and gain more insight into potential vulnerabilities to protect application data. Guardicore Segmentation Network micro-segmentation and visualization Kona Site Defender Cloud-based web application firewall App & API Protector Adaptive web and API estate firewall Bot Manager Protect applications from bot users Account Protector Monitor for account fraud Enterprise Application Access (EAA) Scalable and secure access verification Learn more about securing and scaling your cloud workloads "Linode [now Akamai] gives us the advertised performance, a superior support experience, and the bandwidth we need for worldwide coverage — all for a great price." Luke Seelenbinder, Co-Founder of Stadia Maps Ready to get started or have questions? Set up your free account today or contact a sales consultant to learn more. Create account Contact sales'
