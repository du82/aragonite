["https://www.linode.com/free-bundled-services"]
title = "Free Bundled Cloud Services For All Customers | Akamai"
description = "Buying and managing cloud infrastructure should be simple. Linode includes free. cloud services to launch, secure, and scale applications."
full_description = "No-cost security, networking, maintenance, and monitoring solutions Free Bundled Services Buying and managing cloud infrastructure should be simple. These free cloud services will help you launch, secure, and scale your applications. Create Account Contact Sales Cloud Computing Developers Trust Core building blocks of cloud infrastructure are included with every plan. Explore these free cloud solutions to deploy and support your applications. DDoS ProtectionAutomatically detect and mitigate DDoS attacks on your network from large-volume traffic intended to make your service unavailable. Learn More About DDoS Cloud Firewall RulesControl network traffic to and from your Linodes. Customize firewall rule sets and secure traffic based on trusted IP addresses, ports, and protocols. Learn More About Firewalls Simple MonitoringEasily analyze performance, keep track of your transfer usage, and create custom alerts for when you near thresholds you set. Learn More About Monitoring IPv6 SupportLinodes are created with one IPv6 address that is fully enabled on all of our supported operating systems. Also, local IPv6 traffic doesn’t count against your network transfer quota. Read the Overview on IPv6 Private Networks with VLANConfigure your Linodes with private and/or public network interfaces to control which of your workloads has access to public and private networks. Learn More About VLANs DNS ManagementOversee your DNS records managed within Linode even if your website is living on another cloud host. Learn More About DNS Manager Multiple Deployment MethodsManage your infrastructure using the intuitive Cloud Manager web interface, fully-featured API or CLI. All supported by robust documentation. Growing App MarketplaceDeploy applications to your Linode in one click. Choose from a variety of apps on the Marketplace like control panels, databases, monitoring, gaming, and more. Browse the Marketplace Additional Benefits Generous Transfer Allowances All plans include generous transfer allowances, starting at 1 TB for a 1 GB Shared instance and up to 20 TB on the largest Dedicated, Shared, or GPU instances. Extensive Documentation Library Our documentation library features more than 1,000 guides and tutorials to help you make deploying and managing your Linode services easy. 24/7/365 Email & Phone Support No tiers and no handoffs. Get help when you need it most from our highly-trained team of service professionals, available 24/7/365 by email or phone. 99.99% Uptime SLA With a 99.99% uptime guarantee, be confident your cloud infrastructure is online, available, and operational. And if there is a problem, we’ll make it right. Worldwide Availability Linode data centers support global markets, enabling secure and reliable networking through our network backbone. You might also like... Linode, Explained Linode and the power of the cloud explained in under 2 minutes. Watch this video and get started on the Linode Cloud today. Linode About Linode Grow your business with our Linux virtual machines, API, intuitive interface, and next generation global network. Linode Get Started Today! Create Account See Products"
