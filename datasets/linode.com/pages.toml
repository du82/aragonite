["https://www.linode.com/accessibility"]
title = "Accessibility Commitment Statement: Cloud Manager"
full_description = "Accessibility Commitment Statement: Cloud Manager The Linode, now Akamai, mission is to accelerate innovation by making cloud computing simple, affordable, and accessible to all. In support of that mission we actively work to ensure our website, including our self-service platform, Cloud Manager, meets the accessibility needs of our users. Our goal is to provide a user experience that is consistent with the World Wide Web Consortium (W3C) Web Content Accessibility Guidelines 2.1 (WCAG) Level AA. This includes leveraging common interaction patterns and apply them consistently, using plain language for labels and actions, reviewing interactive elements for sufficient contrast, testing for compatibility with mouse and keyboard navigation and assistive devices, and other recognized peer practices. We strive to take into consideration the needs of our customers regarding accessibility of our platform. If you find a portion of our services inaccessible to individuals with disabilities, please contact our support team at support@linode.com with your feedback. Download our Voluntary Product Accessibility Templates (VPATs) in PDF format here. A VPAT describes how a product or service addresses U.S. Section 508 guidelines."
