["https://linux-sunxi.org/Identification_guide"]
title = "Identification guide - linux-sunxi.org"
full_description = 'Identification guide From linux-sunxi.org Jump to navigation Jump to search There are several different options to attempt to identify your device. Contents 1 Search for marketing name 2 Search for Android model number 3 Search by classification 3.1 Boards 3.2 HTPCs 3.3 Tablets 3.4 Netbooks 4 When all fails Search for marketing name Many of the devices we have listed are often rebadged. This means that one company (a good example is Inet-tek) builds the tablet for a customer, and provides the customers desired logo and printing on the device. A good example is the Inet 86vz, which is sold as (at least) both the "Freelander PH20" and the "Storex TAB LC7". Both rebadgers come with slightly redesigned back covers, with the respective marketing information printed on the back, but they are 100% clones. This is why each documented device has an "Also known as" section, so that this can aid device identification. You can most easily search for the marketing names, by using google and a search prefix: site:linux-sunxi.org Freelander PH20 Search for Android model number When you boot your device under the stock android, you can check "Settings", "About Tablet", to find out the following: Model Number: SXZ-PH20 Build Number: A13_86VZ_M758C2_*.* We collect these Model/Build Numbers on our Device pages as well, so you can google for those strings, or parts of those strings: site:linux-sunxi.org SXZ site:linux-sunxi.org PH20 site:linux-sunxi.org 86VZ site:linux-sunxi.org M758C2 Search by classification If the above fails, you have no option but to manually check the list of available devices. There should be exterior and interior pictures of each device available. It pays to know what the interior of your device looks like at this point, refer to the device disassembly guide for more information on that. At sunxi, we first break up devices in 4 categories, and then subdivide those categories per SoC. Boards This category is development boards of all kinds. ► A10 Boards► A10s Boards► A13 Boards► A13 Ereaders► A20 Boards► A31 Boards► A31s Boards► A527 Boards► A64 Boards► A80 Boards► A83T Boards► D1 Boards► D1s Boards► H2+ Boards► H3 Boards► H5 Boards► H6 Boards► H616 Boards► H8 Boards► R329 Boards► T113-s3 Boards► T527 Boards► V3s Boards HTPCs Home theater PCs means all set-top-boxes and HDMI sticks and similar devices. There are a few cases where the same housing/case is re-used multiple times, with different internals. It pays to have a look through those common HTPC formats first, as they could potentially vastly speed up identification. Format MK802 If your HTPC is not one of the common case designs, then you will have to look through the full list. ► A10 HTPC► A10s HTPC► A20 HTPC► A31 HTPC► A31s HTPC► A80 HTPC► H3 HTPC► H64 HTPC Tablets This naturally means those flat oblong things which have a big display on one side. There are a few cases where the same exterior tablet design is re-used multiple times, with different internals. It pays to have a look through those common tablet formats first, as they could potentially vastly speed up identification. Format Q8 If your tablet is not one of the common case designs, then you will have to look through the full list. ► A10 Tablets► A13 Tablets► A20 Tablets► A23 Tablets► A31 Tablets► A31s Tablets► A33 Tablets► A63 Tablets► A83T Tablets Eken t01a Fukuda FCT94AW8 Teclast P85T Netbooks Although rare, there are some netbooks with allwinner chips out there. ► A10 Netbooks When all fails When your device still cannot be found, then it probably is not known to our community, or not documented yet. In this case you will need to work through our New Device Howto. Retrieved from "https://linux-sunxi.org/index.php?title=Identification_guide&oldid=12187"'
year_published = 2025
clearnet = "https://linux-sunxi.org/Identification_guide"
