title = "BSP - linux-sunxi.org"
full_description = '''BSP From linux-sunxi.org Jump to navigation Jump to search "BSP" means Board Support Package. Contents 1 Requirements 2 Usage 2.1 hwpack 2.1.1 Installation 2.1.1.1 Build an SD-card from a hwpack and a root FS 2.1.1.2 Update an SD-card from a hwpack 2.1.2 Create your own hwpack 2.2 Kernel 2.2.1 Change kernel configuration 2.3 rootfs images 2.4 LiveSuit image Requirements These three steps are only required if you are planning to create your own hwpack or configure kernel on an x86 PC running Linux and will install all packages required. (Tested and working on Linux Mint 13/14, Ubuntu 12.04/12.10/13.04) Note: On Debian (wheezy) / Ubuntu 13.10 (saucy) onwards, uboot-mkimage package is removed, mkimage command is included in u-boot-tools package. apt-get update apt-get upgrade apt-get install build-essential u-boot-tools uboot-mkimage gcc-arm-linux-gnueabihf \ libusb-1.0-0-dev git wget fakeroot \ kernel-package zlib1g-dev libncurses5-dev pkg-config The git project is available at https://github.com/linux-sunxi/sunxi-bsp To download it: git clone git://github.com/linux-sunxi/sunxi-bsp.git Usage hwpack Installation Build an SD-card from a hwpack and a root FS ./scripts/sunxi-media-create.sh [device] [hwpack] [rootfs] Update an SD-card from a hwpack ./scripts/sunxi-media-create.sh [device] [hwpack] norootfs Create your own hwpack ./configure # to list all currently supported boards ./configure <selected board> make Kernel Change kernel configuration # Following command calls 'make menuconfig' with correct O= parameter make linux-config rootfs images Rootfs images can be downloaded from Linaro's site: https://releases.linaro.org/ In addition, Ubuntu Core is a rootfs image for Ubuntu, available at http://cdimage.ubuntu.com/ubuntu-core/releases/ Read more about the Ubuntu Core rootfs images for armhf at https://wiki.ubuntu.com/Core For example the latest Linaro nano is: https://releases.linaro.org/13.04/ubuntu/quantal-images/nano/linaro-quantal-nano-20130422-342.tar.gz LiveSuit image Requires 64bit linux. sunxi-bsp supports generating Android and Linux LiveSuit images. You can generate Linux LiveSuit image by following next steps. ./configure # to list all currently supported boards ./configure <selected board> make linux # generate kernel and modules wget <rootfs.tar.gz> make livesuit ROOTFS=<rootfs.tar.gz> Flash and boot. Kernel modules can be found on nanda (FAT partition). Retrieved from "https://linux-sunxi.org/index.php?title=BSP&oldid=14465" Category: Tutorial'''
year_published = 2025
