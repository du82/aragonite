title = "Category:Community - linux-sunxi.org"
full_description = 'Help Category:Community From linux-sunxi.org Jump to navigation Jump to search The linux-sunxi community is the Open Source community that gathered around the Allwinner SoCs. It sees only very limited support from Allwinner itself (usually, and only since recently, some code drops and some documentation). Very few people in this community make a living from working on this hardware, and thus most are volunteers spending their free time and their own money. There are however a few companies which actively contribute to our community, and their hardware is the best supported. Contents 1 Get Supported 2 Contribute 2.1 Bring up your own hardware 2.2 Help with documentation 2.3 Help with packaging 2.4 Help with development Get Supported First off, search our wiki and check our frequently asked questions (FAQ) page. If you are unsure what hardware you have, then read our guide to identify your device. You are also free to contact us through the the mailing list and/or through IRC (Internet Relay Chat). Contribute The best way to contribute is to install linux-sunxi software on your own hardware, and to work through our countless howtos and tutorials to get your hardware supported as you want it. You will undoubtedly run into things which are either wrong, not completely documented or broken. By subsequently improving our wiki and our software you will not only help linux-sunxi and countless linux-sunxi users, you will also be helping yourself. You should of course start by creating a wiki account, by subscribing to our mailing list, and by joining the active discussions on IRC. Caveat: Our wiki sometimes is refused access by the SMTP server and unable to send emails. If when creating a user account on the wiki, after several hours you do not get your account creation email, contact us on IRC. Bring up your own hardware You should first start with attempting to identify your hardware. If you cannot identify your device from this wiki, you will need to work through our New Device Howto. Help with documentation For this you obviously need to get a wiki account first. The Wiki category lists all sorts of pages related to our sunxi wiki, some of which are guides on how to improve our wiki, some of which are categories labeling pages which need improvement. Help with packaging There are several linux-sunxi specific packages, and our community could use a hand with improving our own package repositories. Help with development Subcategories This category has the following 3 subcategories, out of 3 total. C ► Community Devices‎ (15 P)N ► NDH TODO‎ (231 P, 1 F)O ► Olimex‎ (13 P) Pages in category "Community" The following 8 pages are in this category, out of 8 total. F Frequently asked questionsI IRCM Mailing listN New Device howtoP PackagingS Sending patchesT Translations are bad Tutorials Retrieved from "https://linux-sunxi.org/index.php?title=Category:Community&oldid=13604"'
