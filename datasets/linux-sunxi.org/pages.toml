full_description = '''Allwinner SoC Family From linux-sunxi.org Jump to navigation Jump to search Contents 1 SoC series 1.1 "A"-Series 1.2 "F"-Series 1.3 "H"-Series 1.4 "R"-Series 1.5 "T"-series 1.6 "V"-series 1.7 "X" - (B/MR/S/VR/TV) - series 1.8 "RISC-V"-Series 2 2013 naming scheme change 3 Features 3.1 Comparison table 4 References SoC series A series processors are used for mobile applications, mainly referring to tablet application here; B for "Book", used for E-book tablet reader. H for “Homlet”, mainly used in home entertainment applications, including smart OTT boxes, HDMI mini PCs, gaming boxes, etc; V for video-related applications, including video surveillance, automotive DVR, etc; T series processors target the Automotive products like ADAS. TV series processors target to the video-related applications, projector, TV F series are processors based on Allwinner’s melis OS, mainly used in smart video radios, video MP5, etc; "A"-Series Based on ARMv7 Cortex-A cores (Cortex-A7, A8 and A15) targeted for high-end devices like digital media players, tablets, and netbooks: Allwinner A10 (sun4i) 1 x Cortex-A8 CPU-core Allwinner A13 (sun5i) 1 x Cortex-A8 CPU-core Allwinner A10s (sun5i) 1 x Cortex-A8 CPU-core Allwinner A20[1] (sun7i) 2 x Cortex-A7 CPU-cores Allwinner A23 (sun8i) 2 x Cortex-A7 CPU-cores Allwinner A31 (sun6i) 4 x Cortex-A7 CPU-cores Allwinner A31s (sun6i) 4 x Cortex-A7 CPU-cores Allwinner A33[2] (sun8i) 4 x Cortex-A7 CPU-cores Allwinner A40i[3] (sun8i) 4 x Cortex-A7 CPU-cores Allwinner A50[4] (sun8i) 4 x Cortex-A7 CPU-cores Allwinner A80 (sun9i) 4 x Cortex-A7 CPU-cores + 4 x Cortex-A15 CPU-cores (using ARM big.LITTLE heterogeneous CPU architecture) Allwinner A83T[5] (sun8i) 8 x Cortex-A7 CPU-cores 64-bit Based on ARMv8 Cortex-A cores (Cortex-A53, A55) targeted for high-end devices like digital media players, tablets, and netbooks: Allwinner A63[6] (sun50i) 4 x Cortex-A53 CPU-core Allwinner A64[7] (sun50i) 4 x Cortex-A53 CPU-core Allwinner A100 (sun50i) 4 x Cortex-A53 CPU-cores Allwinner A133[8] (sun50i) 4 x Cortex-A53 CPU-core Allwinner A523 (sun55i) 8 x Cortex-A55 CPU-core Allwinner A733 (sun60i) 2 x Cortex-A76 CPU-core + 6 x Cortex-A55 CPU-core Allwinner A537 (sun65i) 2 x Cortex-A73 CPU-core + 2 x Cortex-A53 CPU-core + 4 x Cortex-A53 CPU-core Allwinner A333 (sun65i) 1 x Cortex-A73 CPU-core + 4 x Cortex-A53 CPU-core "F"-Series Note: The F series is not supported by the linux-sunxi community due to lack of developers and hardware. sun3i have only official linux support, sunii have no linux support, only Allwinner's "Melis" RTOS. Based on ARMv5 ARM926-EJS core and currently targeted for low market devices such as cheap ebook readers, etc. F1C700 seems to be a remarked A13, and it's ARMv7. Boxchip C100 (sun3i) Boxchip E200 (sun3i) Boxchip F10 aka SoChip SC9800 aka Teclast T8100 (sunii) Boxchip F13 (sunii) Boxchip F15 aka SoChip SC8600 aka Teclast T7200 (sunii) Boxchip F18 (sunii) Boxchip F20 (sun3i) Allwinner F23[9] aka F1C100A (suniv) Allwinner F25[10] (suniv) Allwinner F1C100A[11] (suniv) Allwinner F1C100s[12] (suniv) Allwinner F1C200s[13] (suniv) Allwinner F1C500[14] (suniv) Allwinner F1C500s[15] (suniv) Allwinner F1C600[16] (suniv) Allwinner F1C700 (sun5i) Allwinner F1C800[17] (suniv) Allwinner F1D100[18] (suniv) "H"-Series Based on ARMv7/ARMv8 Cortex-A cores (A7/A53) targeted for video OTT (over-the-top) boxes and high-end gaming consoles: Allwinner H2+[19] (sun8i) 4 x Cortex-A7 CPU-core Allwinner H3[20] (sun8i) 4 x Cortex-A7 CPU-core Allwinner H8 (sun8i) 8 x Cortex-A7 CPU-core Allwinner H80[21] (sun8i) 8 x Cortex-A7 CPU-core Allwinner H133 (sun8i) 2 x Cortex-A7 CPU-core 64-bit Allwinner H5[22] (sun50i) 4 x Cortex-A53 CPU-core Allwinner H6[23] (sun50i) 4 x Cortex-A53 CPU-core Allwinner H64[24] (sun50i) 4 x Cortex-A53 CPU-core Allwinner H313[25] (sun50i) 4 x Cortex-A53 CPU-core Allwinner H616[26] (sun50i) 4 x Cortex-A53 CPU-core Allwinner H618 (sun50i) 4 x Cortex-A53 CPU-core "R"-Series Allwinner R6[27] (sun3i) 1 x ARM926EJ-S CPU-core Allwinner R7[28] (sun8i) 1 x Cortex-A7 CPU-core Allwinner R8[29] (sun5i) 1 x Cortex-A8 CPU-core Allwinner R11[30] (sun8i) 1 x Cortex-A7 CPU-core Allwinner R16[31] (sun8i) 4 x Cortex-A7 CPU-core Allwinner R40[32] (sun8i) 4 x Cortex-A7 CPU-core Allwinner R58[33] (sun8i) 8 x Cortex-A7 CPU-core Allwinner R311[34] (sun8i) 4 x Cortex-A7 CPU-core Allwinner R328[35] (sun8i) 2 x Cortex-A7 CPU-core Allwinner R853 (sun8i) 1 x Cortex-A7 CPU-core + 1 x RISC-V MCU The Allwinner R8 is repackaged version of the A13. This SoC gets used in the minicomputer presented in Next Thing Co.'s C.H.I.P. kickstarter project ("The $9 computer")[36]. By comparing the product pages the R16 seems to be a relabeled version of A33. This is somewhat confirmed by the (identical) SoC ID the BROM reports.[37] 64-bit Allwinner R18[38] sun50i 4 x Cortex-A53 CPU-core Allwinner R329[39] (sun50i) 2 x Cortex-A53 CPU-core Allwinner R818[40] (sun50i) 4 x Cortex-A53 CPU-core 64-bit Heterogeneous Allwinner R128 sun20i 1 x Cortex-m33, 1 x Xuantie C906, 1 x HiFi5 DSP "T"-series Allwinner T2[41] (sun8i) 2 x Cortex-A7 CPU-core Allwinner T3[42] (sun8i) 4 x Cortex-A7 CPU-core Allwinner T7[43] (sun8i) 6 x Cortex-A7 CPU-core Allwinner T8[44] (sun8i) 8 x Cortex-A7 CPU-core Allwinner T113-S3 (sun8i) 2 x Cortex-A7 CPU-core Allwinner T113-I (sun8i) 2 x Cortex-A7 CPU-core + 1 x RISC-V T-Head XuanTie C906 CPU-core 64-bit Allwinner T507(T5 Series)[45] (sun50i) 4 x Cortex-A53 CPU-core Allwinner T527[46] (sun55i) 8 x Cortex-A55 CPU-core Allwinner T536 (sun55i) 4 x Cortex-A55 CPU-core "V"-series Allwinner V3[47] (sun8i) 1 x Cortex-A7 CPU-core Allwinner V3s[48] (sun8i) 1 x Cortex-A7 CPU-core Allwinner V5[49] (sun8i) 4 x Cortex-A7 CPU-core Allwinner V40[50] (sun8i) 4 x Cortex-A7 CPU-core Allwinner V66[51] (sun8i) 8 x Cortex-A7 CPU-core Allwinner V316[52] (sun8i) 2 x Cortex-A7 CPU-core Allwinner V536[53] (sun8i) 2 x Cortex-A7 CPU-core Allwinner V831 (sun8i) 1 x Cortex-A7 CPU-core Allwinner V833 (sun8i) 1 x Cortex-A7 CPU-core Allwinner V837s (sun8i) 1 x Cortex-A7 CPU-core + 1x RISC-V MCU Core Allwinner V853s (sun8i) 1 x Cortex-A7 CPU-core + 1x RISC-V MCU Core Allwinner V853 (sun8i) 1 x Cortex-A7 CPU-core + 1x RISC-V MCU Core Allwinner V851s (sun8i) 1 x Cortex-A7 CPU-core + 1x RISC-V MCU Core Allwinner V851se (sun8i) 1 x Cortex-A7 CPU-core + 1x RISC-V MCU Core Allwinner V821 (sun300i) 1 x RISC-V CPU-core + 1x RISC-V MCU Core "X" - (B/MR/S/VR/TV) - series Allwinner B288[54] (sun8i) 2 x Cortex-A7 CPU-core Allwinner B300[55] (sun8i) 4 x Cortex-A7 CPU-core Allwinner MR100[56] (sun8i) 4 x Cortex-A7 CPU-core Allwinner MR133[57] (sun8i) 4 x Cortex-A7 CPU-core Allwinner S3[58] (sun8i) 1 x Cortex-A7 CPU-core 64-bit Allwinner VR9[59] (sun50i) 4 x Cortex-A53 CPU-core Allwinner MR813 (sun50i) 4 x Cortex-A53 CPU-core Allwinner MR527 (sun55i) 8 x Cortex-A55 CPU-core Allwinner TV303 (sun50i) 4 x Cortex-A53 CPU-core "RISC-V"-Series Allwinner D1[60] (sun20i) 1 x RISC-V T-Head XuanTie C906 CPU-core Allwinner D1s (or F133)[61] (sun20i) 1 x RISC-V T-Head XuanTie C906 CPU-core 2013 naming scheme change Initially, Allwinner named their SoCs chronologically: sun4i = A10 sun5i = A13/A10s sun6i = A31 sun7i = A20 but, somewhere in 2013, Allwinner decided to update their naming scheme to be based on the ARM core used instead: (taken from the A80 SDK kernel code). Note: SoCs with "?" have never appeared on Allwinner's website. [62] TODO: Add to the following table: F1C800, F23, F25, R11, R328, T2, T5, T8, MR100, VR9, H716, V837s, V821 sunxi (arm cores) sunxiwx (soc id) p (rev id) soc name cores notes sun3i (arm926ejs) sun3iw1 (0x1663) sun3iw1p1 F1C100s, F1C100A, F1C200s, F1C500, F1C500s, F1C600, F1D100, R6 1xARM926EJ-S sun4i (cortex-a8) sun4iw1 (0x1623) sun4iw1p1 A10 1xCortex-A8 sun4iw2 (0x1625) sun4iw2p1 A13 1xCortex-A8 sun4iw2p2 A12 ? sun4iw2p3 A10s 1xCortex-A8 sun8i (cortex-a7 smp) sun8iw1 (0x1633) sun8iw1p1 A31 4xCortex-A7 sun8iw1p2 A31s 4xCortex-A7 sun8iw2 (0x1651) sun8iw2p1 A20 2xCortex-A7 su