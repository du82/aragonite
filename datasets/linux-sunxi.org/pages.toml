["https://linux-sunxi.org"]
title = "linux-sunxi.org"
full_description = 'Main Page From linux-sunxi.org Jump to navigation Jump to search Welcome to the wiki of the linux-sunxi community, an open source software community dedicated to providing open source operating system support for Allwinner SoC based devices. Contents 1 What is sunxi 2 Community 3 Allwinner based devices 4 Documentation What is sunxi sunxi represents the family of ARM SoCs from Allwinner Technology, a Chinese fabless semiconductor company. Their best known products are the sunxi SoC series, such as the A10 (sun4i), A13 (sun5i) and A20 (sun7i) chips, which were very successful in the low-budget tablet market. See Allwinner SoC Family for more information on the different Allwinner chips. Community The sunxi community is a very active and advanced one. For more information, check our linux-sunxi community page. It explains how to get help and how to contact us, and how you can contribute as well. Allwinner does not actively participate in or support this community. In fact, it is violating the GPLv2 license in several ways and has so far not shown willingness to resolve this. Allwinner based devices Due to the popularity of the cheap Allwinner SoCs, there are literally thousands of different devices out there. If you are looking for support for your device from the sunxi community here, please take a look at our guide to identifying your device. If you cannot find your exact device, then you need to work through our new device howto to get it supported. If you are interested in buying an Allwinner SoC based device, then read through our buying guide. Documentation Use the table below, or expand these categories: ► Hardware ► Software Hardware Software Device Identification guide New Device howto ► Devices ► Register guide ► Video Engine Table of Allwinner based boards Used IP cores - used IP cores in current generation SoCs Media IP cores - Relationship between the media related IP cores JTAG on A10 devices through µSD port GPIO - General Purpose Input/Output PIO - Programmed input/output MicroSD Breakout Audio Codec Cpufreq CSI - Camera Sensor Interface I2Cdev - I2c communication in the userspace. Networking SPIdev - SPI communication in the userspace. Storage - data storage interfaces 1-Wire - 1-Wire communication in the userspace. PS/2 - keyboard and mouse interface. LCD - LCD video output Bootable OS images: Complete ready-to-use SD card images Board Support Package (BSP): A scripted way to create images and SD-Cards. Manual build howto: Getting a specific U-Boot, Linux kernel, and a rootfs on an SD card. sunxi-tools: Command line utilities for sunxi devices Packages: The linux-sunxi package repository Linux Kernel: Kernel repositories and versions Linux mainlining effort: Status of the mainline effort Mainline U-Boot: Status of the mainline U-Boot bootloader ► Linux Distributions ► Android ► BSD ► Proprietary Software ► Development This wiki includes many other tutorials: ► Tutorial Retrieved from "https://linux-sunxi.org/index.php?title=Main_Page&oldid=22911"'
