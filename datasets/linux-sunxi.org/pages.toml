["https://linux-sunxi.org/PS/2"]
title = "PS/2 - linux-sunxi.org"
full_description = 'PS/2 From linux-sunxi.org Jump to navigation Jump to search IBM PS/2 is a legacy keyboard and mouse interface (violet and green round mini-din connectors) used mostly in x86 PCs. The A10 and A20 SoCs supposedly have this interface but no known device uses it. PS/2 lacks any standard defining exact electrical and data protocol which leads to difficulties with some devices failing to work when connected together. On the other hand, in contrast to USB HID protocol the PS/2 protocol has no practical limit on number of simultaneously pressed keys (full NKRO). This is important for special applications like computer stenography or hardcore gaming. Driver for sunxi exists but is not integrated neither in sunxi-3.4 nor mainline kernel so far. If you have a devboard that happens to have the PS/2 pins exposed on a header adding support should not be difficult. Retrieved from "https://linux-sunxi.org/index.php?title=PS/2&oldid=11511" Category: Hardware'
year_published = 2025
