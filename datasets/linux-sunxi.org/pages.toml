["https://linux-sunxi.org/Buying_guide"]
title = "Buying guide - linux-sunxi.org"
full_description = '''Buying guide From linux-sunxi.org Jump to navigation Jump to search If you are looking to acquire an Allwinner based device, then chances are that you are looking for the device with the best community support. While some development boards are very common in our sunxi community, and they therefore are best supported, we have the ability to easily support just about any A10, A13, A10s and A20 based device (support for newer SoCs, like A31, A23 and A31s, is still lagging behind). This means that we can easily bring up previously unknown devices, but it might still be a good idea to choose the best known hardware. Contents 1 Recommended Development boards 1.1 Open Source Hardware 1.1.1 Olimex 1.2 Community Hardware 1.2.1 Cubietech 1.2.2 Rhombus Tech 2 Recommended tablets 3 Other devices 4 Support status Recommended Development boards Open Source Hardware At sunxi we fully support the OSHW initiative, as this gives people the freedom to adapt hardware designs to their own needs. Olimex Currently, Olimex is the only company creating Allwinner based OSHW, and Olimex actively contributes to the sunxi project. We particularly recommend: A10-OLinuXino-LIME: An ultra cheap board with 512MiB RAM, HDMI, ethernet and SATA. A13-OLinuXino: A more full featured board with 512MiB RAM, optional 4GB NAND and optional 4GB Wifi. A20-OLinuXino-LIME: Based on the A10-OLinuXino-LIME, but with a more advanced A20 CPU. A20-OLinuXino-LIME2: Similar to A20-OLinuXino-LIME, features 1GB RAM and Gigabit ethernet. A20-OLinuXino-Micro: Powerful and complete Olimex board, with 1GB RAM, 4GB NAND, ethernet (100MBit/s), SATA and HDMI. Olimex devices offer a lot of expansion possibilities through GPIO connectors, or Olimex's own expansion modules. Community Hardware Some companies actively participate with and contribute to the sunxi community. While they don't always produce OSHW devices, schematics tend to be available. Cubietech Cubietech has been working with the sunxi community from the start, and the devices they create come with full schematics. Cubieboard: The original cubietech board. Comes with an A10 SoC, 1GB RAM, 4GB NAND, SATA, Ethernet and HDMI. Cubieboard2: An updated cubieboard with an A20 SoC. Cubietruck: A full featured A20 board with 2GB RAM, 4GB NAND, Gigabit ethernet, WiFi, SATA, Bluetooth, HDMI and VGA. Rhombus Tech Rhombus Tech has been working on creating libre software supported devices since the start: they started the initial community that formed around Allwinner SoCs and became linux-sunxi. They are working on a range of modular platforms, the first being EOMA-68, with plans for a huge range of community designs including a modular tablet, modular desktop and modular netbook. Currently running is a crowd-funding campaign on Crowd Supply which turns into a "shop" after the campaign ends. Recommended tablets This section is still under construction and no particular tablet recommendations are available yet. While we can hardly expect the tablets to be proper OSHW hardware, some tablets are expected to be much less problematic than the others for free software enthusiasts. A preliminary checklist for the wanted features: The device should be preferably easy to identify and the advertised specs should be reasonably accurate (trying to buy an Allwinner tablet and getting a Rockchip, Mediatek, Amlogic or Active instead is not always a pleasant surprise). If you are buying a no-name tablet from Aliexpress, Amazon or Ebay, pay special attention to negative reviews even if the vast majority of reviews are positive. Even if the description clearly states "Allwinner", it may still have a different SoC under the hood. Most users are happy as long as their cheap tablet just boots some sort of Android and works with it. But a few people who actually care about the SoC choice, may leave a lone warning somewhere in the comments. Read reviews of the device. eg. WiFi reception, screen durability and brightness, touch response, build quality and many other features of the tablet cannot be determined from a vendor specification. If the device is not identifiable easily enough that you can find reviews of it or that you can be sure the review actually applies to the device you are ordering you will never know what you get. Availability of the stock firmware for download from the vendor site (for unbricking) Availability of the firmware sources (for GPL compliance) Good support for the peripherals (touchscreen, WIFI, ...) in the mainline kernel and sunxi-3.4 Reasonable features (screen resolution, screen quality, HDMI/USB connectors, battery capacity, ...) Reasonable price Somewhat worldwide available brands that produce Allwinner based tablets include Prestigio MSI KD Interactive(Kurio) Sencor Hewlett-Packard Please add any other producers of recognizable Allwinner based hardware that you find. Other devices If none of the above boards suit your goals, then there are plenty more devices to choose from: ► A10 Boards► A10 HTPC► A10 Netbooks► A10 Tablets ► A10s Boards► A10s HTPC► A10s Other ► A13 Boards► A13 Ereaders► A13 Tablets ► A20 Boards► A20 HTPC► A20 Other► A20 Tablets ► A23 Tablets ► A31 Boards► A31 HTPC► A31 Tablets ► A31s Boards► A31s HTPC► A31s Tablets ► A33 Boards► A33 Tablets ► A64 Boards► A64 Tablets Pine Pinebook PinePhone ► A80 Boards► A80 HTPC ► A83T Boards► A83T Tablets ► H2+ Boards ► H3 Boards► H3 HTPC 8BCraft Retrostone ► H5 Boards ► H8 Boards ► H64 HTPC As previously stated, we have the ability to easily support previously unknown hardware, so the above list should not limit your options. Support status The device support is being developed on several fronts: The U-Boot bootloader development is being tracked on the Mainline U-Boot page. Each device page also has a detailed description of the bootloader status and instructions for that particular device. U-Boot is the de facto way of booting the devices so it is crucial for operating with the device. If a board is not supported yet in the official U-Boot, sometimes a compatible device configuration might work. Some Linux distributions (such as Armbian) also have pretty up to date support for devices with 3rd party patches. Devices such as development boards (see the Table of Allwinner based boards page for more info) might come with official kernels and distributions. The device pages provide links to 3rd party sites offering this support. While the official kernel support from the device makers is often lacking, depends on badly outdated kernels, and might contain closed source binary blobs or licensing issues, the mainline support for devices is improving with each new kernel release. The long term goal is to provide official support for the devices in the mainline kernel. The status of this work for the sunxi devices is summarized on the Linux mainlining effort page. Again, each device page also has a detailed description of the kernel support status. There are also numerous kernel and userspace subsystems dealing with device specific hardware support, which have their own status pages with more details. For instance, the wiki contains pages for Cedrus and Cryptographic Hardware Accelerators. Retrieved from "https://linux-sunxi.org/index.php?title=Buying_guide&oldid=24297" Categories: HardwareOlimexCubieboard'''
year_published = 2025
clearnet = "https://linux-sunxi.org/Buying_guide"
