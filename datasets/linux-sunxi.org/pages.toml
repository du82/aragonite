full_description = '''Linux mainlining effort From linux-sunxi.org Jump to navigation Jump to search The purpose of this page is to try and define sub-goals and milestones for the mainlining effort, containing goals and sub-goals with milestones for adding Allwinner support in the upstream mainline Linux Kernel. Contents 1 Overview 2 Status 2.1 Status Matrix 2.2 Work In Progress 2.2.1 Core Stuff 2.2.2 Major drivers 2.2.3 Minor drivers 2.2.4 Drivers that can still be improved/added 2.3 Planned for next 2.4 Merged into 6.10 2.5 Merged into 6.9 2.6 Merged into 6.8 2.7 Merged into 6.7 2.8 Merged into 6.6 (LTS) 2.9 Merged into 6.5 2.10 Merged into 6.4 2.11 Merged into 6.3 2.12 Merged into 6.2 2.13 Merged into 6.1 (LTS) 2.14 Merged into 6.0 2.15 Merged into 5.19 2.16 Merged into 5.18 2.17 Merged into 5.17 2.18 Merged into 5.16 2.19 Merged into 5.15 (LTS) 2.20 Merged into 5.14 2.21 Merged into 5.13 2.22 Merged into 5.12 2.23 Merged into 5.11 2.24 Merged into 5.10 (LTS) 2.25 Merged into 5.9 2.26 Merged into 5.8 2.27 Merged into 5.7 2.28 Merged into 5.6 2.29 Merged into 5.5 2.30 Merged into 5.4 (LTS) 2.31 Merged into 5.3 2.32 Merged into 5.2 2.33 Merged into 5.1 2.34 Merged into 5.0 2.35 Merged into 4.20 2.36 Merged into 4.19 (LTS) 2.37 Changes merged up to 4.18 3 References 4 See also 5 External Links 5.1 How to upstream 6 Notes Overview The idea is to submit the code needed to run the Linux kernel on Allwinner SoCs upstream, ie. to the official Linux kernel. This can be achieved by following the concept outlined in the Your new ARM SoC Linux support check-list! article published by Thomas Petazzoni from Bootlin.[1][2] Where relevant, I have attempted to include who is currently working on an item, mostly separate from any particular mainlining goal. Status The Mainline Kernel howto contains the currently used repositories for the mainlining process. The U-Boot repository and toolchain is described in the Mainline U-Boot howto. The Mainline Kernel category gives an overview of currently supported devices. Status Matrix The goal of this matrix is to give an easy view of work on each SoC worked on by linux-sunxi. Model F1C-100s200s A10 A10s A13R8 GR8 A20T2 R40V40T3A40i A80 A31 A23 A33R16 A83T H3H2+ S3S3LV3V3s A64H64 H5 H6 A50 V831V833 H313H616H618H700T507 A100A133 R329 D1D1sT113 A523A527MR527T527 ADC GPADC N/A 4.12 4.12 4.12 4.12 4.12 WIP NO WIP N/A N/A N/A N/A N/A N/A N/A N/A ? ? 6.11 ? WIP 6.6 NO LRADC 6.2 4.0 4.0 4.0 4.9 4.0 ? ? 4.0 4.0 4.2 5.2 ? 4.13 5.3 ? N/A ? ? 6.11 ? 5.19 5.19 NO Thermal NO 3.16 3.14 3.14 4.9 3.16 5.7 WIP WIP ? 4.12 5.6 5.6 N/A 5.6 5.6 5.6 ? ? 6.9 5.10 ? 6.8 NO Touch NO 3.16 3.14 3.14 4.9 3.16 WIP NO 4.0 N/A N/A N/A N/A N/A N/A N/A N/A ? ? N/A ? ? NO N/A Audio AC97 N/A NO N/A N/A N/A NO NO N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A ? ? N/A ? ? N/A N/A Analog Codec WIP 4.4 4.4 4.4 4.9 4.4 NO N/A 4.10 4.10 4.11 N/A 4.10 4.13 5.0 4.12 NO ? ? WIP ? WIP WIP NO Audio Hub N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A NO N/A N/A NO N/A N/A N/A N/A DMIC N/A N/A N/A N/A N/A N/A N/A N/A NO N/A N/A N/A N/A N/A N/A N/A 6.1 ? N/A ? ? ? ? NO I2S NO 4.8 ? N/A 4.9 4.8 NO NO 4.13 ? 4.11 4.16 4.14 WIP 4.17 NO 5.11 ? ? NO ? 5.18 5.18 NO SPDIF NO 4.7 N/A N/A 4.9 4.7 ? ? 4.9 N/A N/A 4.13 4.11 N/A 4.17 4.12 5.4 ? ? 6.9 ? ? WIP NO Camera BT656 NO 5.6 ? ? ? 5.4 5.6 ? 5.0 ? ? 5.3 5.0 5.0 5.1 5.0 ? ? ? ? ? ? ? NO ISP N/A NO N/A N/A N/A NO N/A NO NO N/A N/A NO N/A WIP N/A N/A N/A ? ? N/A ? ? ? ? MIPI CSI-2 N/A N/A N/A N/A N/A N/A N/A NO WIP N/A N/A WIP N/A 5.19 N/A N/A N/A ? ? N/A ? ? ? NO Parallel NO 5.6 ? ? ? 5.4 5.6 ? 5.0 ? ? 5.3 5.0 5.0 5.1 5.0 ? ? ? ? ? ? ? NO CAN bus ? 4.4 N/A N/A N/A 4.4 5.17 N/A N/A N/A N/A N/A N/A N/A N/A N/A N/A ? ? N/A ? ? 6.6 NO Clocks 5.0 3.10 3.11 3.10 4.9 3.12 4.14 3.19 3.12 3.17 4.2 4.13 4.8 4.11 4.10 4.12 4.17 ? WIP 5.12 5.10 WIP 5.17 WIP CPUFreq (DVFS) NO 4.0 4.0 4.0 NO 4.0 6.0 NO 4.2 NO 4.11 4.17 4.18 NO 5.6 5.9 5.8 ? ? 6.10-rc1 WIP ? WIP NO CPUIdle NO NO NO NO NO NO NO NO NO NO NO NO Crus