full_description = 'Raspberry Pi 4 Ваш настольный микрокомпьютер: модернизированный, быстрый, мощный. С поддержкой выхода на два 4К-дисплея и до 8Gb оперативной памяти. Купить в интернет-магазине Узнать подробнее Сейчас в продаже Выберите объем памяти 2 GB RAM Этого объема вполне хватит для использования Raspberry Pi 4 в качестве адаптивного рабочего стола с функцией просмотра веб-страниц с несколькими вкладками и возможностями для программирования 4 GB RAM У вас гораздо больше «пространства для маневров». Используйте дополнительные 2 GB в качестве файлового кэша для ускорения работы или выделите больше памяти для графического процессора. 8 GB RAM Ещё больше возможностей для многозадачности: запускайте несколько приложений одновременно, поддерживайте виртуальные машины, веб-серверы и базы данных Сейчас в продаже Технические характеристики Процессор Broadcom BCM2711, quad-core Cortex-A72 (ARM v8) 64-bit SoC @ 1.5GHz Память 2GB, 4GB или 8GB LPDDR4 (в зависимости от модели) Интерфейсы 2.4 GHz and 5.0 GHz IEEE 802.11b/g/n/ac wireless LAN, Bluetooth 5.0, BLE Gigabit Ethernet 2 × USB 3.0 ports 2 × USB 2.0 ports GPIO Стандартный для всей линейки Raspberry Pi 40-пиновый GPIO (полностью совместим с предыдущими платами) Видео и Аудио 2 micro-HDMI ports (up to 4kp60 supported) порт дисплея 2-lane MIPI DSI порт для камеры 2-lane MIPI CSI 4-контактный стерео-аудио-видеовыход Мультимедиа H.265 (4kp60 decode), H264 (1080p60 decode, 1080p30 encode) OpenGL ES 3.0 Поддержка SD карт Слот для карты Micro SD для установки операционной системы и хранения пользовательских данных Питание 5 V DC via USB-C connector (minimum 3A*) 5 V DC via GPIO header (minimum 3A*) Поддержка PoE (Power over Ethernet) (требует отдельного устройтва PoE HAT) Надежность Температура использования: 0—50 °C Быстрый старт Что понадобится для запуска Чтобы начать работу с Raspberry Pi помимо самой платы вам обязательно понадобится: SD-карта от 8 до 64Gb Дисплей с разъемом HDMI Кабель HDMI-microHDMI для подключения д