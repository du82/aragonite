["https://linuxcenter.ru/article/zaschischaem_apache_2__shag_za_shagom"]
title = "Защищаем Apache 2. Шаг за шагом | LinuxCenter - интернет-портал об СПО и электронике"
description = "В этой статье мы расскажем о пошаговой установке и конфигурировании Apache 2.0, чтобы снизить риск неавторизованного доступа или успешного взлома в случае применения новой уязвимости, обнаруженной в Apache Web сервере. В результате, можно будет пользовать"
full_description = 'К списку статей СтатьиБезопасность Автор: Артур Май Защищаем Apache 2. Шаг за шагом При выборе Web сервера, Apache очень часто побеждает своих конкурентов из-за стабильности, высокой производительности, открытого исходного кода и множеством других преимуществ. Сейчас Apache существует в виде двух версий - устойчивая версия 1.3, используемая миллионами пользователей и, с другой стороны, усовершенствованная и перепроектированная версия 2.0.Хотя новая версия имеет ряд существенных дополнений и особенностей, многие администраторы все еще используют более старую версию 1.3, считая ее более устойчивой и безопасной. Множество фактов потверждают это. Так как версия 1.3 использовалась миллионами пользователей в течение долгого времени, большинство брешей в защите в этой версии, по всей, было уже обнаружены. В то же самое время версия 2.0 может быть имеет множество пока еще не обнаруженных уязвимостей.Продолжая серию предыдущих статей (Apache, PHP, MySQL), в этой статье мы расскажем о пошаговой установке и конфигурировании Apache 2.0, чтобы снизить риск неавторизованного доступа или успешного взлома в случае применения новой уязвимости, обнаруженной в Apache Web сервере. В результате, можно будет пользоваться новыми особенностями Apache Web сервера 2.0, не слишком волнуясь о новых ошибках защиты, которые могут представлять серьезную угрозуФункциональные требованияВ мире безопасности, существует несколько золотых принципов, которые обязаны всегда соблюдаться. Один из таких принципов - правило, которое говорит, что должны использоваться только необходимые части программного обеспечения. Все другие компоненты должны быть заблокированы, сделаны недоступными или даже не должны вообще быть установлены.Логика этого правила очень проста - если есть программное обеспечение с множеством компонентов, которые включены по умолчанию, то обнаруженная уязвимость защиты только в одном из этих компонентов, может поставить под угрозу целую систему под опасность успешного взлома. С другой стороны, если используются только несколько крайне необходимых компонентов, обнаруженная новая уязвимость защита не обязательно делает программное обеспечение уязвимым - потому что обнаруженная уязвимость может затрагивать компоненты, которые отключены или не установлены. Вероятность успешного взлома в этом случае очевидно намного ниже, чем в случае заданной по умолчанию инсталляции.Поэтому, перед установкой Apache 2, очень важно знать, какие функциональные возможности мы действительно ожидаем от Web сервера. Это позволит нам подготовить список модулей, которые мы оставим включенными, а остальные будут отключены в процессе установки.Согласно этому правилу, мы предполагаем, что будут использоваться только следующие основные особенности Apache 2:Обрабатываться будут только статические HMTL страницы.Сервер должен поддерживать механизм виртуального хостинга.Доступ к некоторым Web страницам может быть ограничен по IP адресам или пользователям (basic authentication).Сервер должен регистрировать все Web запросы (включая информацию о web браузере).Обратите внимание, что вышеупомянутые функциональные возможности не поддерживают CGI сценарии, SSL протокол или другие полезные особенности Apache сервера. Это сделано так, потому что главная цель статьи состоит в том, чтобы представить общий метод защиты Apache 2.0, не сосредотачиваясь на специфическом выполнении. Если есть потребность в дополнительных функциональных возможностях, читатели могут использовать представленное решение как отправную точку, и расширить его, включая дополнительные модули, например mod_ssl, mod_cgi и тд.Предположения защитыЧтобы обеспечить наиболее возможный уровень защиты, и в то же самое время сделать это решение переносимым среди различных Linux/BSD систем, мы будем использовать следующие уровни защиты:Операционная системаоперационная система должна быть укреплена в максимально возможной степени; все ненужные компоненты должны быть удалены из системы.Операционная система не должна позволять выполнять программы на стеке (если поддерживается).Все ненужные сетевые службы должны быть заблокированы.Число SUID/SGID файлов должно быть минимизировано.Apache web serverВключены быть только абсолютно необходимые модули Apache; остальное должно быть заблокировано в процессе компиляцииДолжны быть выключены все диагностические web-страницы и автоматическая служба индексации каталога.Cервер должен раскрыть наименьшее количество количества информации о себе насколько возможно - политика запутывания. Хотя это - не реальный уровень защиты, его применение делает возможные проникновения трудно осуществимыми.Web сервер должен выполнятся под выделенным UID/GID, который не используется другими системными процессами.Apache процесс должен иметь ограниченный доступ к файловой системе (chrooting).В Apache chrooted среде не должно присутствовать никаких программных оболочек (/bin/sh, /bin/csh и т.п.) - это позволяет намного усложнить процесс выполнения вредоносного кода.Установка операционной системыПрежде всего, мы должны выбрать операционную систему, на которой будет выполняться Web сервер. Основная часть этой статьи описывает защиту Apache на FreeBSD (5.1), однако читатели могут свободно использовать их любимую Unix, BSD, Linux или Linux-подобную операционную систему.Относительно наших предположений защиты, после установки операционной системы она должна быть защищена против удаленных и локальных нападений. Независимо от выбора UNIX/Linux/BSD дистрибутива, очень важно установить только основную операционную систему и удалить любые избыточные пакеты и применять на современном уровне исправления к ядру и всему установленному программному обеспечению.Также рекомендуют периодически синхронизировать локальное время с доверенным сервером времен, используя часы с сервера времени, которому доверяют, используя Network Time Protocol (NTP), и посылать журналы регистрации удаленному, выделенному регистрационному серверу.После того, как система подготовлена, мы можем начать устанавливать Apache 2.0. Первым шагом мы должены добавить новую группу и правильного пользовател,я названного Apache. Пример для FreeBSD показан ниже:pw groupadd apache pw useradd apache -c "Apache Server" -d /dev/null -g apache -s /sbin/nologin Дочерние Apache процессы должны выполнятся с привилегиями группы и пользователя apache. вышеупомянутая учетная запись будет выделена Apache Web серверу, это поможет обеспечить разделение привилегий и избежать потенциальных проблем защиты, когда несколько различных процессов выполняются под той же самой учетной записью, например под пользователем nobody.Загрузка программного обеспеченияДалее, нам необходимо загрузить последнюю версию Apache Web сервера из Web сайта Apache. Так как мы хотим отключить ненужные модули в процессе компиляции, очень важно загрузить исходный код Apache. Также важно проверить загруженное программное обеспечение против PGP сигнатуры, чтобы удостовериться, что загруженная версия немодифицирована.lynx http://httpd.apache.org/download.cgi gpg --import KEYS gpg httpd-2.0.49.tar.gz.asc gpg: Good signature from "Sander Striker " tar zxvf httpd-2.0.49.tar.gz cd ./httpd-2.0.49/ Выбор Apache модулейПосле того, как распакован исходный код Apache, мы должны выбрать, какие модули останутся, и какие должны быть удалены. Краткое описание всех модулей, доступных в Apache 2.0, могут быть найдены в http://httpd.apache.org/docs-2.0/mod/. Выполняя функциональные возможности и требования защиты, принятые в начале этой статьи, мы компилируем только следующие модули:Имя модуляОписанияcoreОсновное ядро Apache, необходимое для инсталляции.http_coreОсновное HTTP ядро, необходимое для Apache 2.0 инсталляции.preforkМодуль мультизадачного режима (MPM), для обеспечения многозадачной работы.mod_accessОбеспечивает управление доступом, основанным на имени хоста клиента, IP-адресе и других характеристиках запроса клиента. Поскольку этот модуль необходим, чтобы использовать директивы "order", "allow" и "deny", он должен оставаться доступным.mod_authТребуется для осуществления пользовательской идентификации (базовая HTTP идентификация).mod_dirТребуется, для поиска и обслуживания каталога с индексными файлами: "index.html", "default.htm", и т.д.mod_log_configТребуется для регистрации запросов, сделанных на сервер.mod_mimeТребуется для установки набора символов, content encoding, обработчика, content-language, и документов MIME типа.Так как мы хотим использовать только минимальное число модулей, мы компилируем все модули статически. Благодаря этому, мы устраним возможность применения уязвимости еще в одном модуле - mod_so.Компилирование и установка программного обеспеченияВ этом шаге мы конфигурируем, компилируем, и устанавливаем Apache Web сервер следующим образом:./configure \--prefix=/usr/local/apache2 \ --with-mpm=prefork \ --disable-charset-lite \ --disable-include \ --disable-env \ --disable-setenvif \ --disable-status \ --disable-autoindex \ --disable-asis \ --disable-cgi \ --disable-negotiation \ --disable-imap \ --disable-actions \ --disable-userdir \ --disable-alias \ --disable-so make su umask 022 make install chown -R root:sys /usr/local/apache2После того, как Apache установлен, мы должны удостовериться, что используются только следующие модули: /usr/local/apache2/bin/httpd -l Compiled in modules: core.c mod_access.c mod_auth.c mod_log_config.c prefork.c http_core.c mod_mime.c mod_dir.c Конфигурирование ApacheПеред первым запуском Apache, мы должны изменить файл конфигурации Apache. Мы должны сделать это, потому что заданный по умолчанию файл конфигурации использует модули, которые мы отключили, и без модификаций Apache не будет выполнятся.Таким образом, мы должны удалить/usr/local/apache2/conf/httpd.conf файл и создать новый httpd.conf в его месте, со следующим содержанием:# ================================================= # Basic settings # ================================================= Listen 0.0.0.0:80 User apache Group apache ServerAdmin webmaster@www.ebank.lab UseCanonicalName Off ServerSignature Off HostnameLookups Off ServerTokens Prod ServerRoot "/usr/local/apache2" DocumentRoot "/www" PidFile /usr/local/apache2/logs/httpd.pid ScoreBoardFile /usr/local/apache2/logs/httpd.scoreboard DirectoryIndex index.html # ================================================= # HTTP and performance settings # ================================================= Timeout 300 KeepAlive On MaxKeepAliveRequests 100 KeepAliveTimeout 15 MinSpareServers 5 MaxSpareServers 10 StartServers 5 MaxClients 150 MaxRequestsPerChild 0 # ================================================= # Access control # ================================================= Options None AllowOverride None Order deny,allow Deny from all Order allow,deny Allow from all Order allow,deny Allow from all # ================================================= # MIME encoding # ================================================= TypesConfig /usr/local/apache2/conf/mime.types DefaultType text/plain AddEncoding x-compress .Z AddEncoding x-gzip .gz .tgz AddType application/x-compress .Z AddType application/x-gzip .gz .tgz AddType application/x-tar .tgz # ================================================= # Logs # ================================================= LogLevel warn LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined LogFormat "%h %l %u %t \"%r\" %>s %b" common LogFormat "%{Referer}i -> %U" referer LogFormat "%{User-agent}i" agent ErrorLog /usr/local/apache2/logs/error_log CustomLog /usr/local/apache2/logs/access_log combined # ================================================= # Virtual hosts # ================================================= NameVirtualHost * DocumentRoot "/www/www.ebank.lab" ServerName "www.ebank.lab" ServerAlias "www.e-bank.lab" ErrorLog logs/www.ebank.lab/error_log CustomLog logs/www.ebank.lab/access_log combined DocumentRoot "/www/www.test.lab" ServerName "www.test.lab" ErrorLog logs/www.test.lab/error_log CustomLog logs/www.test.lab/access_log combined По сравнению с заданным по умолчанию файлом конфигурации, были сделаны следующие важные изменения:Уменьшено до минимума число допускаемых модулейПроцессы Apache (кроме rootпроцесса) установлены, чтобы выполнятся с уникальными привилегиями пользователя/группы.Apache раскрывает наименьшее количество информации о себе насколько это возможно.Установлены более ограниченные права доступа к содержанию сайта.Согласно нашим требованиям, вышеупомянутая конфигурация предполагает, что есть два виртуальных хоста, поддержавшие Apache:www.ebank.lab(псевдоним:www.e-bank.lab)www.test.labСодержание вышеупомянутых виртуальных хостов физически хранятся под /www каталогом, поэтому перед запуском Apache, мы также должны создать соответствующие каталоги с типовыми web-страницами:mkdir -p /www/www.ebank.lab mkdir -p /www/www.test.lab echo "eBank.labeBank.lab works!" > /www/www.ebank.lab/index.html echo "test.labTest.lab works!" > /www/www.test.lab/index.html chmod -R 755 /www chown -R root:sys /www Мы должны также подготовить каталоги для хранения журналов регистраций:mkdir -p /usr/local/apache2/logs/www.ebank.lab mkdir -p /usr/local/apache2/logs/www.test.lab chmod -R 755 /usr/local/apache2/logs chown -R root:sys /usr/local/apache2/logs Наконец, мы можем попробовать выполнить Apache, и проверить, что все работает должным образом:/usr/local/apache2/bin/apachectl start Если доступен сайт www.ebank.lab через web-браузер, мы можем завершение Apache:/usr/local/apache2/bin/apachectl stop И затем перейдем к chroot сервера. Если возникли проблемы, должны быть проанализированы журналы регистрации или команда truss (для BSD и Solaris пользователей) следующим образом:truss /usr/local/apache2/bin/httpd Обратите внимание, что для Linux пользователей, эквивалентная команда - strace. Анализ данных, представленных командами truss (или strace), могут помочь в решении возникших проблем.Chrooting сервераДалее, ограничим доступ Apache процесса к файловой системе. Техника chrooting подробно описана в предыдущей статье, поэтому в этом пункте мы просто создадим структуру директорий для нашего нового Apache: mkdir -p /chroot/httpd/dev mkdir -p /chroot/httpd/etc mkdir -p /chroot/httpd/var/run mkdir -p /chroot/httpd/usr/lib mkdir -p /chroot/httpd/usr/libexec mkdir -p /chroot/httpd/usr/local/apache2/bin mkdir -p /chroot/httpd/usr/local/apache2/lib mkdir -p /chroot/httpd/usr/local/apache2/logs/www.ebank.lab mkdir -p /chroot/httpd/usr/local/apache2/logs/www.test.lab mkdir -p /chroot/httpd/usr/local/apache2/conf mkdir -p /chroot/httpd/usr/local/lib mkdir -p /chroot/httpd/www Владелец весь выше каталогов должен быть root, и права доступа не должны позволить обычным пользователям выполнять любые изменения в этих каталогах:chown -R root:sys /chroot/httpd chmod -R 0755 /chroot/httpd Затем, мы создадим специальный файл устройства,/dev/null:ls -al /dev/null crw-rw-rw- 1 root wheel 2, 2 Mar 14 12:53 /dev/null mknod /chroot/httpd/dev/null c 2 2 chown root:sys /chroot/httpd/dev/null chmod 666 /chroot/httpd/dev/null Мы также дол'
