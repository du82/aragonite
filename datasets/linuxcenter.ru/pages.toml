title = ""
description = """
FreeBSD. Настраиваем файловые системы          FreeBSD. Свободные записки о свободной системе. В качестве объекта для изучения был избран однодисковый вариант FreeBSD стабильной версии - 4.2      Читать далее"""
full_description = 'К списку статей СтатьиПресс-релизы Автор: - Поддерживаю РФ: Кириллические домены должны поддерживаться в российском ПО и сервисах Кириллические домены должны поддерживаться в российском ПО и сервисахПоддержка российским ПО и отечественными сервисами кириллических доменов и адресов электронной почты станет ключевой задачей проекта Поддерживаю.РФ в 2021 году. По словам директора Координационного центра доменов .RU/.РФ Андрея Воробьева, национальный домен .РФ является важной частью культурного суверенитета России в интернете и его полноценная поддержка должна учитываться в любом IT-продукте, претендующем на льготы или государственные субсидии. «Сегодня, когда государство вводит меры стимулирования IT-отрасли и, в частности, сформирован Единый реестр отечественного ПО, а также список социально значимых интернет-ресурсов, необходимо, чтобы все такие продукты и ресурсы в должной мере поддерживали русский язык и, в частности, кириллические домены», - рассказал он. «Мы, в свою очередь, готовы оказать производителям программного обеспечения всю возможную поддержку. В течение прошлого года мы исследовали различное ПО на предмет поддержки интернационализированных доменных имен, прежде всего, с символами русского алфавита, а также возможные решения связанных с этим проблем, и наработали большой опыт в этой области. Сейчас готовы поделиться им, а для ряда продуктов, например, CMS «1C-Битрикс» уже разработаны решения по внедрению поддержки кириллических IDN-доменных имен и e-mail адресов», - добавила Мария Колесникова, руководитель проекта Поддерживаю.РФ. Пока согласно результатам исследований, проведенных проектом Поддерживаю.РФ в прошлом году, только 19% сайтов Рунета смогли принять и обработать e-mail адреса, полностью составленные из символов национального алфавита (EAI-адреса), что является вторым результатом в мире. Первое место принадлежит Германии, где сайтов, поддерживающих локальный алфавит, оказалось 28%. А Китай занял лишь четвертое место. При этом по данным Поддерживаю.РФ, среди производителей программного обеспечения лидерами в работе с интернационализированными e-mail адресами стали Microsoft и Apple, реализовавшие практически полную поддержку таких адресов в своих почтовых продуктах. Следом за ними идут группы разработчиков серверного почтового свободного программного обеспечения, а наиболее проблемными являются CMS и офисные продукты. Проект Поддерживаю.РФ создан Координационным центром доменов .RU/.РФ в 2020 году в ознаменование десятилетнего юбилея российского кириллического домена верхнего уровня .РФ. Он призван помочь разработчикам программного обеспечения реализовать полноценную поддержку кириллических доменных имен и почтовых адресов в их продуктах, а системным администраторам – правильно выбрать и настроить ПО, имеющее такой функционал. На сайте проекта собрана русскоязычная документация по работе с интернационализированными доменными именами и почтовыми адресами, включая стандарты и best practices по их обработке в программном обеспечении, а также постоянно обновляемый каталог программных продуктов с указанием их текущего статуса поддержки IDN и EAI-протоколов. Информационные партнеры проекта: интернет-порталы D-Russia.ru, Nag.ru, Digital-Report.ru, MSKIT.ru, linuxcenter.ru, «Мобильные телекоммуникации», журналы «Вестник связи», «Радиочастотный спектр», «RUБЕЖ», «БИТ.Бизнес&Информационные технологии» и «Системный администратор». Другие статьи по данной теме: Пресс-релизы Поддерживаю РФ: Опубликованы новые рекомендации по поддержке доменных имен и адресов электронной почты на кириллице Поддерживаю РФ: Опубликованы рекомендации по поддержке кириллических доменов при организации гостендеров на разработку или закупку ПО Поддерживаю РФ: Пользователи смогут проверить готовность почтовых сервисов к работе с кириллическими адресами электронной почты Поддерживаю РФ: CommuniGate Pro – первый российский продукт, получивший подтверждение соответствия критериям универсального принятия в домене .РФ Поддерживаю РФ: Уровень поддержки кириллических доменных имен вырос Поддерживаю.РФ и REG.RU начали тестирование полностью кириллической почты Поддерживаю РФ: «1C-Битрикс: Управление сайтом» поддерживает кириллические почтовые адреса Поддерживаю РФ: Во всем мире происходит перелом в сторону интернационализации Поддерживаю РФ: К тестированию кириллической почты присоединился Hoster.ru Поддерживаю РФ: Лишь 2% социально значимых сайтов поддерживают кириллические e-mail-адреса FreeBSD. Настраиваем файловые системы FreeBSD. Свободные записки о свободной системе. В качестве объекта для изучения был избран однодисковый вариант FreeBSD стабильной версии - 4.2 Читать далее Поддерживаю РФ: Кириллические домены должны поддерживаться в российском ПО и сервисах Поддержка российским ПО и отечественными сервисами кириллических доменов и адресов электронной почты станет ключевой задачей проекта Поддерживаю.РФ в 2021 году. По словам директора Координационного центра доменов .RU/.РФ Андрея Воробьева, национальный дом Читать далее Защищаем Apache 2. Шаг за шагом В этой статье мы расскажем о пошаговой установке и конфигурировании Apache 2.0, чтобы снизить риск неавторизованного доступа или успешного взлома в случае применения новой уязвимости, обнаруженной в Apache Web сервере. В результате, можно будет пользовать Читать далее Защита ваших данных. PGP & Linux Эта статья написана для тех, кому необходимо сохранить некоторую информацию в секрете и кто пока не решил как это сделать.... Читать далее DragonFlyBSD: загрузка и инициализация В этом цикле статей я хочу рассказать об операционной системе, родившейся прямо на наших глазах - летом 2004 года. Имя ей - DragonFlyBSD, и являет она собой представителя славного племени BSD-систем. В сущности, исходно это fork (порождение) FreeBSD 4-й в Читать далее Читать все статьи Специальные предложенияинтернет-магазина 880 руб Набор для пайки CyberLight 3300 руб Чехол для переноски Portable Hard Shell для Oculus Quest 2 VR 1550 руб Книга: Дронов В.А. "Laravel 9