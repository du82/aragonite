Бортовые датчики · 3-х осевой гироскоп (MPU-9250) · 3-х осевой акселерометр (MPU-9250) · 3-х осевой магнитометр (MPU-9250) · Прецизионный датчик абсолютного давления (LPS25H) Микроконтроллеры · STM32F405 основной микроконтроллер (Cortex-M4, 168MHz, 192kb SRAM, 1Mb flash) · nRF51822 микроконтроллер радиомодуля и управления питанием (Cortex-M0, 32Mhz, 16kb SRAM, 128kb flash) · uUSB коннектор · Бортовой LiPo контроллер заряда с поддержкой режимов 100mA, 500mA и 980mA · Full speed USB интерфейс · Частичная поддержка USB OTG (USB OTG без выхода питания 5V) Основные характеристики · Время полета : 7 минут с элементом питания LiPol 250 мAч (0,925 Втч) · Время заряда: 40 минут с элементом питания LiPol 250 мAч (0,925 Втч) · Время полета: 15 минут с элементом питания LiPol 950 мАч · Вес полезной нагрузки: 15 гр. · Ввод/вывод: · VCC (3.0V, макс. 100mA) · GND Дополнительные характеристики · VCOM (unregulated VBAT or VUSB, макс. 1A) · VUSB (дуплексный ввод/вывод) · I2C (400kHz) · SPI · 2 x UART · 4 x GPIO/CS for SPI · 1-проводная шина для автоматической идентификации периферийных устройств · 2 x GPIO контроллера nRF51 · 8KB EEPROM Курс обучения разработке и программированию БПЛА для детей Урок 1 Вводный урок направлен на получение информации о летательном аппарате, его летательный свойствах и предосторожностей во время его использования, урок должен дать представление о летательном аппарате как о воздухоплавательном судне в руках ученика. Урок 2 Урок №2 закрепляет представление ученика о летательном устройстве и его физических свойствах, демонстрирует способности квадрокоптера зависать в воздухе. Урок 3 Первый практический урок, где ученики смогут сами поднять квадрокоптер в воздух и посадить его. Это основные навыки, которые будут использоваться в дальнейшем при программировании более сложных задач. Урок объясняет, как правильно делать программу, которая бы позволила посадить квадрокоптер, если вдруг что-то пойдет не так. Урок 4 Объясняется такое понятие как пилотаж. На уроке показывают, насколько важна ровная поверхность под запуск квадрокоптера и учат правильно выбирать такую площадку. Ученики программируют простейшее движение квадрокоптера в воздухе. Первые фигуры - основы пилотирования. Урок 5 В этом уроке ученики узнают о поворотах квадрокоптера вокруг своей оси, сами программируют его на такие полеты и обучаются более сложному управлению, повышают свои навыки, а также способы задания движения летательного аппарата в воздухе. Урок 6 Урок, который выводит навыки управления квадрокоптера за рамки использования одиночных блоков, так как к этому уроку все блоки изучены, и ученики комбинируют свои знания и умения в области программирования и геометрии, чтобы задавать движение квадрокоптера по кругу. Урок 7 Комбинирование знаний, полученных в предыдущих уроках. Программирование движения по «восьмерке» с использованием переменных и особенностей квадрокоптера, решение сложных задач, повышение навыков пилотирования и программирования. Движение по «восьмерке» как продвинутое пилотирование. Урок 8 Урок позволяет понять, как можно использовать квадрокоптер при движении над неровным рельефом, позволяет просчитать его особенности, правильно выбирать высоты и переменные для них. Урок позволит использовать квадрокоптер в любых условиях и укрепит знания о системе координат квадрокоптера и ее использовании. Урок 9 Урок позволит создать собственный контроллер для квадрокоптера на примере использования лаборатории. Данный урок направлен на то, чтобы ученики понимали, как связывать устройства друг с другом и правильно их программировать при этом. Урок 10 Рефлексия и закрепления информации по всему курсу в виде соревнования. Ученики используют все приобретенные навыки за курс, чтобы пройти трассу за максимально быстрое время. Важным этапом этого урока служит проверка всех приобретенных навыков и их практическое использование. На этом уроке ученики и педагоги смогут понять, насколько хорошо освоен курс, и что еще нужно изучить или повторить. Конкурсы По завершению курса обучения разработке и программированию БПЛА для детей, каждый участник будет обладать компетенциями требуемыми для выступления в конкурсах, соревнованиях и других событиях, посвещенных БПЛА. Видеоуроки На нашем ютуб-канале представлены видео-уроки по использованию конструктора квадрокоптера. В видеоуроках демонстрируется код программы и то, как квадрокоптер его выполняет. Смотреть уроки на YouTube Сейчас в продаже Среда программирования квадрокоптера Разработана и прошла государственную регистрацию программа CrazyScratch - основанная на языке визуального программирования Scratch Блоки для программирования квадрокоптера Пример написанной программы для квадрокоптера АгроНТИ Мы стремимся к тому, чтобы наш конструктор использовался в качестве аппаратной основы соревнований Всероссийский конкурс для учащихся сельских школ Проводится серия соревнований для сельских школ, в которых есть отдельный трек по использованию квадрокоптеров в сельском хозяйстве Перейти на сайт конкурса Конструктор разработан при финансовой поддержке Фонда Содействия Инновациям © 2000 - 2021 ГНУ/Линуксцентр © .cls-1{fill:#fff;}youtube .cls-1{fill:#fff;}linux-shop (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)}; m[i].l=1*new Date(); for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }} k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)}) (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym"); ym(92483244, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true, webvisor:true, ecommerce:"dataLayer" }); <div><img src="https://mc.yandex.ru/watch/92483244" style="position:absolute; left:-9999px;" alt="" /></div>'
