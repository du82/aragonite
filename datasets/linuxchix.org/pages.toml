title = "Africa | LinuxChix"
full_description = "Book traversal links for Africa ‹ Regional Chapters Up Australasia and Oceania › **Note** LinuxChix Africa seems to be gone. Their Website doesn't resolve, and we haven't been able to contact any of the members. Please contact coordinator-at-address-removed if you have any information, or visit here for information on starting a Linuxchix chapter. ******** LinuxChix Africa Contact: Anna Badimo or Dorcas Muthoni Homepage: http://www.africalinuxchix.org/ Linuxchix Africa was formed in 2004 by African women and for African women. It is a chapter in Africa affiliated to Linuxchix worldwide. The aim of the African chapter is to help toward building the critical mass of Linux skills among African women, and to advocate for the use of Free and Open Source Software for the many community development challenges being faced by Africans, especially African women. Africa LinuxChix welcomes women from any part of Africa to join us and give us ideas on how we can make that difference. Interested women might like to join the mailing list so as we can start discussing the way forward. Le LinuxChix d'Afrique est un nouveau chapitre étant formé par les femmes Africaines pour les femmes Africaines. Le dessein de ce chapitre sera obligé à aider vers la construction de la masse critique de compétences de Linux parmi les femmes Africaines, et recommander pour l'usage de Logiciel de Source Libre et Ouvert pour les beaucoup de défis de développement de communauté étant fait face à par les Africains, les femmes surtout Africaines. Et aussi souligner l'importance de sexe comme un problème qui a besoin d'étre adressé dans le champ qui est principalement mâle dominé. LinuxChix d'Afrique accueille des femmes de n'importe quelle partie d'Afrique pour nous joindre et nous donne les idées sur comment nous pouvons faire cette diff´rence. Les femmes intéressées pourraient aimer joindre l'envoie la liste si comme nous pouvons commencer discuter l'avant de façon."
