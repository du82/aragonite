["http://linuxchix.org/content/italy.html"]
title = "Italy | LinuxChix"
full_description = "Book traversal links for Italy ‹ Indonesia Up Los Angeles, California › LinuxChix Italy What The Italian LinuxChix Chapter is a fresh project inspired by the activity of a local LUG that is now trying to grow up and get its own personality. We are a group of people who basically want to encourage girls to know, appreciate and use free software, and also be helpful in learning and improving computer skills. How We need to meet, talk and choose our modus operandi. We hope there will be a large number of women interested in this project and we want be open to the contribution of everyone. We have now four main ways to communicate: mailing list irc channel #linuxchix on server irc.azzurra.org project page Monday GULP meetings Who Lili is a Linux user and a GULP member since 2003. You can mail her at liliweb at yahoo dot it. There are also some more volunteers and we hope we'll soon be able to mention them all. If you want to join this community you're very welcome. You can bring your knowledge, experience and support or you can simply let us know that you are there :) Send Lili a mail or, better, subscribe to the mailing list, and you'll get news and information from the project."
