full_description = "Chicas Linux es una comunidad creada por mujeres que tiene como objetivos brindar un espacio de reuniÃ³n para personas que tienen a Linux y el software libre como un interes comÃºn. Pero el objetivo mÃ¡s importante de esta comunidad es el incentivar a las mujeres a la participaciÃ³n e iniciaciÃ³n en el mundo del software libre mostrÃ¡ndoles que sÃ­ es posible participar activamente, apoyando de esta forma la causa iniciada por LinuxChix. ------ Chicas Linux is a community created by women with the goal of offering a meeting space for people with a common interest in Linux and free software. But this community's most important objective is to stimulate women to participate and take initiative in the world of free software, showing that it is indeed possible to participate actively, thus supporting the cause initiated by LinuxChix."
