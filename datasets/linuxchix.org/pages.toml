["https://linuxchix.org/content/linuxchix-press-information.html"]
title = "LinuxChix: Information for the media | LinuxChix"
full_description = "About LinuxChix is an international group of Free Software users and developers, founded in 1999 with the aim of supporting women in Linux. Founder Deb Richardson described it as an alternative to the locker room atmosphere found in some online technical forums and gave LinuxChix two core rules: be polite and be helpful. LinuxChix has been continually active for eight years and its forums have attracted over one thousand members worldwide. In addition, it has over fifteen active regional chapters, including LinuxChix Africa, LinuxChix India and LinuxChix Brazil. LinuxChix members range from novice Linux users to Linux kernel developers and technical and project leads. Contact For additional information on LinuxChix contact us through our contact form and select the Media Inquiries category. Press mentions See In the News."
