["https://www.linuxchix.org/content/courses.html"]
title = "Courses | LinuxChix"
full_description = "One of the activities of LinuxChix is to run online courses on a variety of subjects on both technical and non-technical subjects. Courses are run on the Courses mailing list; subscribe to that list to participate. Current courses None. (But we have several courses that might be starting up in summer or fall 2015.) Starting a new course Any linuxchix member is welcome to run a course. Courses can be as long or as short as you want, but you might want to check out the archived courses to get an idea of what's been run in the past. That doesn't mean you can't do something different, but it does give you an idea of what's worked before. Typically, the first thing to do is to determine if there's enough interest by asking on the mailing lists. Either the grrltalk mailing list is usually the best place to ask and discuss things before your course starts, since not as many people subscribe to the courses mailing list unless there's a course they want to take. If there's enough interest, send a message to the volunteers mailing list to make sure that the admins for the courses mailing list can set up a subject tag for your use, and the Moodle admins can set up a new course for you. Announce your new course to the announce mailing list and give people a few days to subscribe and/or familiarize themselves with Moodle, then start posting lessons and running your course! Some hints: shorter lessons are easier for people to fit into their spare time, so try to make at least your first few lessons fairly short. And if you want feedback and/or discussion, don't be afraid to ask for it! A sampling of past Courses Beginning Programming in Python Akkana Peck Spineful Living Carla Schroder GIMP Akkana Peck Tools for Participating in Free Software Mary Gardiner Linux Commands Carla Schroder Firewalls Devdas Bhagat C programming Mary Gardiner LaTeX Isabelle Hurbain Kernel Hacking Val Henson and Sonja Krause-Harder Programming Basics Sonja Krause-Harder and Karen Hall Security Raven Alder and Katie Bechtold Basic Networking Hamster Unix File Systems Meredydd Luff Perl Dan Richter Using PostgreSQL Michelle Murrain See all archived courses."
