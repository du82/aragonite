e, genderIT.org, 10 Feb 2006, translation 4 Mar 2006. Yuwei Lin, Gender Dimensions of Floss Development, Mute magazine, 23rd November 2005. Fernanda G. Weiden Women in Free Software, Groklaw, 11th September 2005. Todd R. Weiss, Geeks want women, TechWorld.com, 9th August 2005. Jay Lyman, Getting in touch with the feminine side of open source, Newsforge, 8th August 2005. Michelle Levesque and Greg Wilson, Women in Software: Open Source, Cold Shoulder, Software Development Online, November 2004. Kirrily Robert, Geek chicks: Second thoughts, freshmeat.net editorial, 5th February 2000. Presentations (If you're looking for someone to give a presentation or panel discussion, check the Chix Who Speak page.) Angela Byron, Women in Free/Libre and Open Source Software (FLOSS) [slides], talk at Flourish 2007, 6th April 2007. Stormy Peters, You're a Girl!?! ... and Other Reactions Women Encounter in Open Source Software [slides], talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Jean T. Anderson, How to Participate at the Apache Software Foundation (ASF) [slides], talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Strata R. Chalup, The Secrets of Computer Technology Explained: for Every Woman, talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Dru Lavigne, Using Open Source to Remove Barriers for Women Within IT [slides], talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Sulamita Garcia, Is Free Software a Macho thing? Women and FOSS, talk at the LinuxChix MiniConf, Sydney Australia, 16 January 2007. Val Henson, Closing the Gender Pay Gap One Salary at a Time, talk at the LinuxChix MiniConf, Sydney Australia, 16 January 2007. Elizabeth Bevilacqua, Women in Free/Open Source Software [slides], talk at MontcoLUG meeting, Royersford, PA USA, 15 January 2007. Mary Gardiner, Women in FOSS groups [slides not available], lightning talk at the Open Source Developers' Conference (OSDC), Monash University, Melbourne, Australia, 8th December 2006. Bernhard Krieger, What makes a valuable contributor: social dynamics in F/LOSS [abstract], talk at FOSS.IN/2006, 26th November 2006. Hanna M. Wallach, Women in Free Software: Findings from FLOSSPOLS [slides], talk at the Free and Open Source Developers' European Meeting (FOSDEM), Brussels, Belgium, 26th February 2006. Hanna M. Wallach, Women in Free and Open Source Software [slides], invited talk at the Women in Computing series, University of Pennsylvania, Philadelphia, U.S., 22nd November, 2005. Erinn Clark and Magni OnsÃ¸ien, Debian Women and Women in Free Software [slides] (see also video: Ogg Theora 368x288 [132MB], Ogg Theora 720x576 [334MB], MPEG [259MB]), talk at Debconf 5, Helsinki, Finland, 15th July 2005. Hanna M. Wallach, The Debian Women Project [slides], talk at the Libre Software Meeting (Rencontres Mondiales du Logiciel Libre), Dijon, France, 8th July 2005. Meike Reichle, The Debian Women Project [slides not available], talk at LinuxTag 2005, 23rd June 2005. Magni OnsÃ¸ien and Hanna M. Wallach, Women in Free Software [slides], lightning talk at the Free and Open Source Developers' European Meeting, Brussels, Belgium, 27th February 2005. Hanna M. Wallach, The Debian Women Project [slides], invited talk at the Women@CL Lunch Series, Computer Laboratory, University of Cambridge, U.K., 9th March 2005. Hanna M. Wallach, The Debian Women Project [slides], talk at the Free and Open Source Developers' European Meeting, Brussels, Belgium, 27th February 2005. Erinn Clark, Women in Debian [slides not available], talk at Debconf 4, Porto Allegre, Brazil, 1st June 2004. Sulamita Garcia, Software Livre coisa pra Macho? As mulheres e o Software Livre [slides - .sxi file] [Is Free Software a Macho Thing? Women and 