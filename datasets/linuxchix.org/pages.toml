["https://www.linuxchix.org/index.php/content/linuxchix-charter.html"]
title = "LinuxChix charter | LinuxChix"
full_description = "Book traversal links for LinuxChix charter ‹ Join LinuxChix Up Is LinuxChix solely for women? Are the lists solely for women? How about the chapters? › The purpose of LinuxChix is to support women in computing. At its narrowest, the scope of LinuxChix is to support women in Free and Open Source computing. Methods of supporting women in computing include but are not limited to: social support sharing common experience providing a space to vent mentoring networking teaching sharing technical skills providing encouragement identifying common problems Technologies for doing this include but are not limited to: mailing lists IRC web pages phone face to face meetings Anything which does not support women in computing is outside the LinuxChix charter. This does not mean that these things are not worth doing, merely that they are not part of what LinuxChix is for."
