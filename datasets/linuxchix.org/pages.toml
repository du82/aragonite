["https://linuxchix.org/content/women-open-source-free-software-bibliography.html"]
title = "Women in Open Source/Free Software bibliography | LinuxChix"
full_description = "Book traversal links for Women in Open Source/Free Software bibliography ‹ Other groups for Women in Computing Up Chix who Speak › This list is intended to be a complete bibliography of published research findings on female participation in Open Source or Free Software (note: not on female participation in IT, technical careers or computing in general). Please send bibliographic information suitable for citation (and links to online copies where available) through our contact form. Please note that this list is restricted to publications by third parties (as in, you must have submitted the article or talk somewhere and had it chosen for publication) rather than self-published articles, because the latter list is too long. Drafts Yuwei Lin, Gender Dimensions of the Free/Libre Open Source Software Development [draft], to appear in the Gender and IT encyclopedia to be published by IDEA Groups in 2006. Yuwei Lin, A Techno-Feminist View on Free/Libre Open Source Software Development [draft], to appear in the Gender and IT encyclopedia to be published by IDEA Groups in 2006. Reports FLOSSPOLS, D16 - Gender: Integrated Report of Findings, 1st March 2006. FLOSSPOLS, D17 - Gender: Policy Recommendations, 1st March 2006. Val Henson, HOWTO Encourage Women in Linux, the Linux Documentation Project, October 2002. Press articles India's Linux Women Step Up, Linux-magazine.com, 2008. Thomas Holbrook, Portrait: ZaReason founder Cathy Malmrose, Linux.com, November 19, 2007. Joe Brockmeier, Portrait: LinuxChix Brazil's Sulamita Garcia, Linux.com, 9th February 09 2007. Lisa Hoover, Opening doors to open source for women, IT Manager's Journal, October 2006. Joe Brockmeier, GNOME and Google reach out to women, Newsforge, 21st August 2006. Joe Brockmeier, GNOME needs women, Newsforge, 16th June 2006. Graciela Selaimen, Women developing FLOSS - freedom for knowlege free from prejudice/Mujeres que desarrollan software libre â€“ liberar de prejuicios al conocimiento libre, genderIT.org, 10 Feb 2006, translation 4 Mar 2006. Yuwei Lin, Gender Dimensions of Floss Development, Mute magazine, 23rd November 2005. Fernanda G. Weiden Women in Free Software, Groklaw, 11th September 2005. Todd R. Weiss, Geeks want women, TechWorld.com, 9th August 2005. Jay Lyman, Getting in touch with the feminine side of open source, Newsforge, 8th August 2005. Michelle Levesque and Greg Wilson, Women in Software: Open Source, Cold Shoulder, Software Development Online, November 2004. Kirrily Robert, Geek chicks: Second thoughts, freshmeat.net editorial, 5th February 2000. Presentations (If you're looking for someone to give a presentation or panel discussion, check the Chix Who Speak page.) Angela Byron, Women in Free/Libre and Open Source Software (FLOSS) [slides], talk at Flourish 2007, 6th April 2007. Stormy Peters, You're a Girl!?! ... and Other Reactions Women Encounter in Open Source Software [slides], talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Jean T. Anderson, How to Participate at the Apache Software Foundation (ASF) [slides], talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Strata R. Chalup, The Secrets of Computer Technology Explained: for Every Woman, talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Dru Lavigne, Using Open Source to Remove Barriers for Women Within IT [slides], talk at Southern California Linux Expo (SCALE) Women in Open Source Mini-Conf, Los Angeles, California USA, 9 February 2007. Sulamita Garcia, Is Free Software a Macho thing? Women and FOSS, talk at the LinuxChix MiniConf, Sydney Australia, 16 January 2007. Val Henson, Closing the Gender Pay Gap One Salary at a Time, talk at the LinuxChix MiniConf, Sydney Australia, 16 January 2007. Elizabeth Bevilacqua, Women in Free/Open Source Software [slides], talk at MontcoLUG meeting, Royersford, PA USA, 15 January 2007. Mary Gardiner, Women in FOSS groups [slides not available], lightning talk at the Open Source Developers' Conference (OSDC), Monash University, Melbourne, Australia, 8th December 2006. Bernhard Krieger, What makes a valuable contributor: social dynamics in F/LOSS [abstract], talk at FOSS.IN/2006, 26th November 2006. Hanna M. Wallach, Women in Free Software: Findings from FLOSSPOLS [slides], talk at the Free and Open Source Developers' European Meeting (FOSDEM), Brussels, Belgium, 26th February 2006. Hanna M. Wallach, Women in Free and Open Source Software [slides], invited talk at the Women in Computing series, University of Pennsylvania, Philadelphia, U.S., 22nd November, 2005. Erinn Clark and Magni OnsÃ¸ien, Debian Women and Women in Free Software [slides] (see also video: Ogg Theora 368x288 [132MB], Ogg Theora 720x576 [334MB], MPEG [259MB]), talk at Debconf 5, Helsinki, Finland, 15th July 2005. Hanna M. Wallach, The Debian Women Project [slides], talk at the Libre Software Meeting (Rencontres Mondiales du Logiciel Libre), Dijon, France, 8th July 2005. Meike Reichle, The Debian Women Project [slides not available], talk at LinuxTag 2005, 23rd June 2005. Magni OnsÃ¸ien and Hanna M. Wallach, Women in Free Software [slides], lightning talk at the Free and Open Source Developers' European Meeting, Brussels, Belgium, 27th February 2005. Hanna M. Wallach, The Debian Women Project [slides], invited talk at the Women@CL Lunch Series, Computer Laboratory, University of Cambridge, U.K., 9th March 2005. Hanna M. Wallach, The Debian Women Project [slides], talk at the Free and Open Source Developers' European Meeting, Brussels, Belgium, 27th February 2005. Erinn Clark, Women in Debian [slides not available], talk at Debconf 4, Porto Allegre, Brazil, 1st June 2004. Sulamita Garcia, Software Livre coisa pra Macho? As mulheres e o Software Livre [slides - .sxi file] [Is Free Software a Macho Thing? Women and Free Software], lecture, 25th September 2004. Sulamita Garcia, Why there are so few women in computing [trans. Camila Sanches], LinuxChix Brasil, 10th March 2003. Panels Danese Cooper et al, Women in Open Source, panel discussion at OSCON 2005, 5th August 2005. Danese Cooper et al, Women in Open Source: Challenges and Opportunities [PDF notes no longer available], panel discussion at the Grace Hopper Celebration of Women in Computing, 7th October 2004."
