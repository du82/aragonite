["https://www.linuxchix.org/content/announce-list.html"]
title = "announce list guidelines | LinuxChix"
full_description = "Book traversal links for announce list guidelines ‹ Join our email lists (or read the archives) Up The announce list is a moderated list for announcements only. All subscribers to any other LinuxChix list should consider subscribing to announce. It is very low traffic and only announcements relevant to the community will be posted to announce. Sending announcements Please email announce in preference to cross-posting to the other lists. If your announcement is likely to spark discussion, please mark in your announcement which list you want followups sent to as discussion will not be allowed on announce. If you're posting for an event (eg: chapter meeting, rally of some sort, lecture being offered, etc.) you should keep in mind the following guidelines: Please post at least two days before an event if possible.. This is to make sure that the post is seen and approved by a moderator in plenty of time Please put the date as well as the location and event name in the subject of your posting. You need enough location information so that people know if it's in their area or not. Remember, since LinuxChix come from around the world, you probably need to include the country. The date will also help the moderators because it's clear then if the post needs to be authorized quickly."
