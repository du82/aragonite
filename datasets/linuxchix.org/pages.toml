full_description = "Book traversal links for Madison, Wisconsin ‹ Los Angeles, California Up Ottawa › Web site: madlc.orgContact: Jade Katneko Valentine Mission Statement: Madison's LC chapter believes in making freely available the knowledge and resources needed to expand our minds and the minds of others. Our mission is to educate ourselves in interesting technology, while introducing the less fortunate and digitally-deprived to free and available technology solutions to suit their situation. Please check our website for more information, scheduled LC meetings (which will include interesting tech talks), and current community outreach projects involving technology."
