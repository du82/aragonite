full_description = '''Mailing List Changes Read more about Mailing List Changes Policy Change The Problem Leading to the Policy Change LinuxChix's Chosen Solution Differences a Member Will See A Note of Thanks Member DMARC FAQ How many LinuxChix members does DMARC affect? Which LinuxChix lists does DMARC affect? Which domains publish a DMARC record? The "Makers" Group Goes Live! Read more about The "Makers" Group Goes Live! LinuxChixxors have formed a new group called "Makers" for chixxors who are exploring DIY electronic and other projects. We'll talk Arduino and other microcontroller boards, RaspberryPi and other single board computers, sensors, robots, drones, 3D printing, and anything else people are interested in. Whatever level you are at, whether it be a total beginner, or have been doing this for years, you're welcome to join in. Are Women Leaving the Tech Industry in Droves? Read more about Are Women Leaving the Tech Industry in Droves? Sue Gardner, the former executive director of the Wikimedia Foundation, says yes, and offers her insight in her Op-Ed piece in the LA Times, Why women are leaving the tech industry in droves. Why Do Ambitious Women Have Flat Heads? Read more about Why Do Ambitious Women Have Flat Heads? That's the title of a TED talk given by Dame Stephanie Shirley. Billed as the most successful tech entrepreneur you never heard of, Dame Shirley started a software house in England in 1962. Her talk is educational, inspiring and humorous and well worth the 14 minutes you'll spend.'''
