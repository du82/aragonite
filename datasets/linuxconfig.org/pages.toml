["https://linuxconfig.org/how-to-check-nvidia-driver-version-on-your-linux-system"]
title = "How to Check NVIDIA Driver Version on Linux - LinuxConfig"
description = "Understanding the version of the NVIDIA driver installed on your Linux system is crucial for compatibility with various applications, especially for gaming, scientific computing…"
full_description = '''How to Check NVIDIA Driver Version on Linux 23 April 2024 by Lubos Rendek Understanding the version of the NVIDIA driver installed on your Linux system is crucial for compatibility with various applications, especially for gaming, scientific computing, and machine learning tasks. Whether you are troubleshooting a driver issue or ensuring that you meet the prerequisites for software that requires a specific driver version, knowing how to check your NVIDIA driver version is a useful skill. In this tutorial you will learn: How to use the command line to find the NVIDIA driver version Different commands that can provide detailed information about the installed NVIDIA driver Additional tips for accessing NVIDIA driver information through graphical tools and system logs How to Check NVIDIA Driver Version on Linux Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Linux OS with NVIDIA GPU installed Software NVIDIA driver, Terminal Other Optional: sudo privileges for certain commands Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user How to install NVIDIA drivers on Ubuntu – Quick and Easy <img src="https://i.ytimg.com/vi/pmGfi1ldBqc/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe style="border-top: 3px solid #000;" src="https://www.youtube.com/embed/pmGfi1ldBqc?start=0" width="920" height="474" frameborder="0" allowfullscreen="allowfullscreen"></iframe> LONG-LIVED VS. SHORT-LIVED BRANCH NVIDIA DRIVERS NVIDIA offers two types of driver releases: Long-Lived Branch (LLB) and Short-Lived Branch (SLB). LLB drivers are intended for more stable and tested features, suitable for enterprise and productivity users who need reliability over cutting-edge features. On the other hand, SLB drivers include the latest enhancements and improvements, which are ideal for gamers and developers who prioritize access to the newest capabilities. Methods to Check NVIDIA Driver Version There are several methods to determine the version of the NVIDIA driver on a Linux system, ranging from simple command line queries to examining system logs. Using nvidia-smi Command: This command provides the easiest way to check your NVIDIA driver version. $ nvidia-smi This tool not only displays the driver version but also provides information about the GPU type, its memory, and current usage statistics. <img decoding="async" class="size-full wp-image-22094" src="https://linuxconfig.org/wp-content/uploads/2015/12/01-how-to-check-nvidia-driver-version-on-your-linux-system.avif" alt="Check NVIDIA driver version by using nvidia-smi command" width="1139" height="634" srcset="https://linuxconfig.org/wp-content/uploads/2015/12/01-how-to-check-nvidia-driver-version-on-your-linux-system.avif 1139w, https://linuxconfig.org/wp-content/uploads/2015/12/01-how-to-check-nvidia-driver-version-on-your-linux-system-300x167.avif 300w, https://linuxconfig.org/wp-content/uploads/2015/12/01-how-to-check-nvidia-driver-version-on-your-linux-system-1024x570.avif 1024w, https://linuxconfig.org/wp-content/uploads/2015/12/01-how-to-check-nvidia-driver-version-on-your-linux-system-768x427.avif 768w" sizes="(max-width: 1139px) 100vw, 1139px" />Using nvidia-smi Command Using modinfo Command: Detailed driver information can be accessed through the kernel module. $ modinfo nvidia | grep ^version This command retrieves detailed information about the NVIDIA driver module, specifically filtering to show the version. <img decoding="async" class="size-full wp-image-22096" src="https://linuxconfig.org/wp-content/uploads/2015/12/03-how-to-check-nvidia-driver-version-on-your-linux-system.avif" alt="Using modeinfo command to check driver version" width="1140" height="88" srcset="https://linuxconfig.org/wp-content/uploads/2015/12/03-how-to-check-nvidia-driver-version-on-your-linux-system.avif 1140w, https://linuxconfig.org/wp-content/uploads/2015/12/03-how-to-check-nvidia-driver-version-on-your-linux-system-300x23.avif 300w, https://linuxconfig.org/wp-content/uploads/2015/12/03-how-to-check-nvidia-driver-version-on-your-linux-system-1024x79.avif 1024w, https://linuxconfig.org/wp-content/uploads/2015/12/03-how-to-check-nvidia-driver-version-on-your-linux-system-768x59.avif 768w" sizes="(max-width: 1140px) 100vw, 1140px" />Using modeinfo command to check driver version $ modinfo /usr/lib/modules/$(uname -r)/kernel/drivers/video/nvidia.ko | grep ^version This command looks up the version of the NVIDIA driver in the specific module directory for the currently running kernel. <img decoding="async" class="size-full wp-image-22097" src="https://linuxconfig.org/wp-content/uploads/2015/12/04-how-to-check-nvidia-driver-version-on-your-linux-system.avif" alt="Check NVIDIA driver version in module directory" width="1139" height="107" srcset="https://linuxconfig.org/wp-content/uploads/2015/12/04-how-to-check-nvidia-driver-version-on-your-linux-system.avif 1139w, https://linuxconfig.org/wp-content/uploads/2015/12/04-how-to-check-nvidia-driver-version-on-your-linux-system-300x28.avif 300w, https://linuxconfig.org/wp-content/uploads/2015/12/04-how-to-check-nvidia-driver-version-on-your-linux-system-1024x96.avif 1024w, https://linuxconfig.org/wp-content/uploads/2015/12/04-how-to-check-nvidia-driver-version-on-your-linux-system-768x72.avif 768w" sizes="(max-width: 1139px) 100vw, 1139px" />Check NVIDIA driver version in module directory $ modinfo /lib/modules/$(uname -r)/updates/dkms/nvidia.ko.zst | grep ^version This command checks the version in a dynamically updated kernel module, useful when drivers are managed by DKMS (Dynamic Kernel Module Support). Checking Graphical Interface: For users who prefer a graphical interface, the NVIDIA X server settings application can be accessed from the GUI menu. This application provides a user-friendly way to view not only the driver version but also other settings related to the NVIDIA GPU. <img decoding="async" class="size-full wp-image-22095" src="https://linuxconfig.org/wp-content/uploads/2015/12/02-how-to-check-nvidia-driver-version-on-your-linux-system.avif" alt="NVIDIA X server settings reveals driver version" width="1200" height="675" srcset="https://linuxconfig.org/wp-content/uploads/2015/12/02-how-to-check-nvidia-driver-version-on-your-linux-system.avif 1200w, https://linuxconfig.org/wp-content/uploads/2015/12/02-how-to-check-nvidia-driver-version-on-your-linux-system-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2015/12/02-how-to-check-nvidia-driver-version-on-your-linux-system-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2015/12/02-how-to-check-nvidia-driver-version-on-your-linux-system-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />NVIDIA X server settings reveals driver version Using inxi Tool: The inxi command is a full-featured system information script that provides detailed reports about various hardware components, including graphics cards. $ inxi -G This command displays information about the graphics card(s) in the system. For NVIDIA devices, it will show the driver version along with other graphics card details like the GPU model and display resolution. This tool is particularly useful for getting a quick overview of the graphics setup, especially when troubleshooting or comparing performance across different systems. <img decoding="async" class="size-full wp-image-22098" src="https://linuxconfig.org/wp-content/uploads/2015/12/05-how-to-check-nvidia-driver-version-on-your-linux-system.avif" alt="inxi shows GPU details, including driver" width="1144" height="199" srcset="https://linuxconfig.org/wp-content/uploads/2015/12/05-how-to-check-nvidia-driver-version-on-your-linux-system.avif 1144w, https://linuxconfig.org/wp-content/uploads/2015/12/05-how-to-check-nvidia-driver-version-on-your-linux-system-300x52.avif 300w, https://linuxconfig.org/wp-content/uploads/2015/12/05-how-to-check-nvidia-driver-version-on-your-linux-system-1024x178.avif 1024w, https://linuxconfig.org/wp-content/uploads/2015/12/05-how-to-check-nvidia-driver-version-on-your-linux-system-768x134.avif 768w" sizes="(max-width: 1144px) 100vw, 1144px" />inxi shows GPU details, including driver Reviewing System Logs: System logs can sometimes reveal the driver version at the time of system events like booting or hardware detection. $ sudo dmesg | grep 'loading NVIDIA' This command filters the kernel ring buffer messages for mentions of “loading NVIDIA,” which typically indicates when the NVIDIA driver is being initialized. $ sudo cat /var/log/syslog | grep "NVIDIA GLX" This command searches the syslog for entries related to NVIDIA GLX, which can include mentions of the NVIDIA driver version during graphical system initialization. <img decoding="async" class="size-full wp-image-22099" src="https://linuxconfig.org/wp-content/uploads/2015/12/06-how-to-check-nvidia-driver-version-on-your-linux-system.avif" alt="Find NVIDIA GLX entries in syslog to check for drivers version" width="1142" height="155" srcset="https://linuxconfig.org/wp-content/uploads/2015/12/06-how-to-check-nvidia-driver-version-on-your-linux-system.avif 1142w, https://linuxconfig.org/wp-content/uploads/2015/12/06-how-to-check-nvidia-driver-version-on-your-linux-system-300x41.avif 300w, https://linuxconfig.org/wp-content/uploads/2015/12/06-how-to-check-nvidia-driver-version-on-your-linux-system-1024x139.avif 1024w, https://linuxconfig.org/wp-content/uploads/2015/12/06-how-to-check-nvidia-driver-version-on-your-linux-system-768x104.avif 768w" sizes="(max-width: 1142px) 100vw, 1142px" />Find NVIDIA GLX entries in syslog to check for drivers version Conclusion Checking the NVIDIA driver version on a Linux system can be done through various methods depending on your preference for using the command line or graphical interfaces. Each method provides a reliable way to ascertain the driver version, which is vital for troubleshooting and ensuring optimal system performance. Related Linux Tutorials:Best Linux Distro for GamingCloud Gaming with GeForce NOW on Ubuntu / Debian LinuxBest Linux Distro: How to Choose Guide for Every UserHow to Install NVIDIA Drivers on Ubuntu 24.04Setting Up NVIDIA CUDA Toolkit in a Docker Container…Monitoring NVIDIA GPU Usage on UbuntuAn Introduction to Linux Automation, Tools and TechniquesThings to install on Ubuntu 22.04How to Set NVIDIA Power Limit on UbuntuBash Scripting: Mastering Arithmetic Operations Categories Multimedia, Games and Crypto Tags administration, multimedia, nvidia, video Installation of Amazon s3cmd Command Line S3 tool on Debian LinuxInstallation of Amazon s3cmd Command Line S3 tool on CentOS Linux Comments and Discussions<img src="https://linuxconfig.org/wp-content/uploads/2024/04/linuxconfig-forum-logo-1.webp" alt="Linux Forum" width="250" height="46"> DiscourseEmbed = { discourseUrl: 'https://forum.linuxconfig.org/', discourseEmbedUrl: document.querySelector("link[rel='canonical']").getAttribute("href") }; (function() { var d = document.createElement('script'); d.type = 'text/javascript'; d.async = true; d.src = DiscourseEmbed.discourseUrl + 'javascripts/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(d); })();'''
