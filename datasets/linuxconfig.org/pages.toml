["https://linuxconfig.org/linux-commands"]
title = "Linux Commands - LinuxConfig"
description = "Are you a beginner GNU/Linux user and wish to look beyond the usual window dragging and mouse clicking? This guide is intended for the absolute beginner users wishing to learn the basics of GNU/"
full_description = 'Linux Commands 12 February 2022 by Lubos Rendek Are you a beginner GNU/Linux user and wish to look beyond the usual window dragging and mouse clicking? This guide is intended for the absolute beginner users wishing to learn the basics of GNU/Linux command line. This tutorial intends to walk through basic Linux commands related to navigation, file and directory administration, software installation and basic system troubleshooting. In this tutorial you will learn: How to use Linux commands Linux commands tutorial Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Any Linux system Software Bash shell Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user What is the GNU/Linux Command Line The chances are that whenever you hear somebody talking about the GNU/Linux operating system you also listen to them talking about command line or Linux commands. Run this command and execute this and that command! Right? However, why? Why is it that the GNU/Linux operating system is almost always linked with commands and command line? The simple answer is that command line is an integral part of the GNU/Linux operating system, and as such it offers the user a possibility to perform tasks more efficiently, with better precision and most importantly with additional insight information about the entire execution process. <img width="382" height="142" decoding="async" style="margin-right: 20px;" src="https://linuxconfig.org/wp-content/uploads/2013/03/linux-command-line-tty-terminal.avif" alt="linux command line terminal" align="left" />Many GNU/Linux’s beginner users associate the command line, and Linux commands with trepidation, high-level wizard magic skills and unnecessary overhead. Let’s be honest with ourselves! No matter what excuse you might have for your aversion to GNU/Linux system and its command line, the cause is most likely linked to the lack of understanding and reluctance to learn. Therefore, let’s not blame the GNU/Linux system for our shortcomings! It is here to help whether you are a complete beginner or advanced level user. To what extent the system can help you does not depend on the depth of your wallet as this is the case with some other proprietary operating systems! The amount of help you receive from the GNU/Linux system is solely dependent on your willingness to learn and your determination. At this stage, I’m sure that the question you are asking yourself is: Do I need to learn the GNU/Linux command line and the myriads of commands to use GNU/Linux operating system? The quick answer is no! Any decent GNU/Linux operating system with GUI installed does not require the user to use the command line to perform basic and even advanced tasks. The only reason why you might consider to learn the GNU/Linux command line is to improve your efficiency to get the most of the system and if the task ahead requires you to do so. Remember many GNU/Linux users go for years without even knowing what command line is! Not knowing the Linux command line is perfectly fine, and if the system does what you need there is no need to learn even the most basic commands. No matter what flavour of GNU/Linux operating system you are using, whether it has Graphical User Interface or not, the command line is always present in some form. <img width="1474" height="733" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2013/03/linux-command-line-ubuntu-gnome-terminal.avif" alt="Command line terminal window on Ubuntu Linux Operating system" /> Command line terminal window on Ubuntu Linux Operating system Hence, if you know the command line basics, you still feel at home regardless of the system in use. Command line, by use of the variety of commands, allows you to administer the system and perform even the most complex tasks on any the GNU/Linux system without GUI as well as remotely across the long distances seemingly making you feel you are sitting right in front of the computer. However, to do so, one needs to possess at least the rudimentary understanding of the GNU/Linux command line and learn some basic usage of some of the commands it offers. Do not be afraid, as this is precisely what you are going to learn by reading this Linux commands tutorial. What are Linux Commands Linux commands are the essence of the entire GNU/Linux operating system used to administer the entire system. You may not know it, but most of the applications you run within the graphical user interface are executing Linux commands for you in the background to accomplish the given task. Letting the application to run Linux commands automatically for us has many obvious benefits. However, the disadvantage is that in many cases we are unable to customise the command execution to craft it towards the desired result. Furthermore, if something goes wrong, the user is most likely left in the dark without any hint on how to even begin to troubleshoot the issue. Now you might be thinking: Ok, that is all fine but how many commands are there and should I learn all of them? The amount of Linux commands available on your GNU/Linux system is irrelevant as the number is always different from system to system. However, if you insist on the exact number execute the following command in your terminal: $ for i in ${PATH//:/ }; do ls $i; done | sort | uniq | wc -l <img width="1280" height="558" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2013/03/linux-commands-number-of-commands.avif" alt="commands available on a default Ubuntu Desktop Linux installation" /> There are exactly 2024 commands available on a my Ubuntu Desktop Linux installation. The number of commands available on your system will be different. The bottom line is that on average the GNU/Linux operating system may contain few thousands of commands which ultimately also answers our next question which is whether the user needs to learn all of them. Well, you may try, but this quest is destined for failure. For this reason, the best approach is to start with the basics; the absolute must learn Linux commands to help you navigate the GNU/Linux filesystem and to perform the basic administration tasks. Once you accomplish this task and grow confident with the Linux command line, the rest comes naturally with the minimum effort simply by just using the GNU/Linux system. All you need is an open mind and determination. Ok, enough with this idle talk and let’s get to it! Basic File-system and Navigation Linux Commands Command line arguments, options and parameters Understanding the difference between Linux command line arguments, options and parameters is likely the most crucial part if one wishes ever to understand the GNU/Linux command line fully. Hence, do not skip this topic but instead make sure you understand it thoroughly before moving forward to the next section. The best tool to explain the difference between Linux command line arguments, options and parameters is the ls command. Do not worry if you do not know the ls command yet as this command is in detail covered in later sections. Open up terminal and run the following command. Do not enter the $sign as this sign only serves a purpose to inform you that this is a command to be executed on the command line and is to be executed as a regular non-privileged user: $ ls After you typed the above command and hit the ENTER key, the command lists all files and directories within your current directory. For now, disregard the output of the command and note that this command consists of a single argument which is the command ls itself. We refer to this argument as the argument 0. Next, try this command: $ ls -a The above command consists of two arguments. The first argument referred to as argument 0 is the ls command itself and the second argument numbered as 1 is the ls command’s option -a. The command options allow the user to modify the command output. Every Linux command has a different set of options. The command options are hard-coded into the command itself. As the name suggests, the command options are optional and do not require the user to use them. In this case the lscommand’s option -a instructs the command to print also hidden files or directories located within our directory. While still in your home directory, run the following command: $ ls -l .bashrc If you follow, you already know that the above command consists of three arguments. First, there is the 0 argument of the command itself. The second argument, more precisely, the argument 1 is the ls command’s option -l which instructs the ls command to produce long listing output giving the user more information about one or more files. Lastly, the third argument number 2 is a parameter supplied to the ls command telling the command to act only on a single file named .bashrc. <img width="100" height="100" decoding="async" class="uk-comment-avatar" src="https://linuxconfig.org/wp-content/uploads/2013/03/tips-png-7.avif" alt="" /> Quick Tip:Please note that in the case of the above .bashrc file the prefixed . is part of the filename and it indicates that the file is hidden. Hidden means that the ls command will not list this file as part of its output by default, unless the -a option is used. A parameter is a command line argument that provides additional information to either the command itself or one or more of its options. Depending on what command you are executing you can supply one or more options or parameters. Consider the following example: $ ls -l -h .bashrc .bash_history In this case, our command consists of five arguments. There is the ls command, two options, namely they are -l and -h and lastly there are two file names as parameters, the .bashrc and .bash_history file. The order in which you supply all arguments on the command line depends on the Linux command you are executing. However, the recommended and the universal rule is to supply all your required options after the command followed by all required parameters. For example, the below is also a valid command which produces the same output as the one above, however, this kind of command syntax should be avoided: $ ls .bashrc -l .bash_history -h Lastly, to shorten your command, thus make it more readable, most of the commands allow the user to combine multiple options into a single argument. Meaning that it is possible to combine the options -l and -h into a single argument as -lh. For example: $ ls -lh .bashrc .bash_history The following video summarises the entire section. By now you should have a clear understanding of what are command line arguments, options and parameters. <img src="https://i.ytimg.com/vi/VUasJs4cta0/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe src="https://www.youtube.com/embed/VUasJs4cta0?rel=0" width="720" height="404" frameborder="0" allowfullscreen="allowfullscreen"></iframe> File system navigation This section covers yet another essential part of Linux command line which is the filesystem navigation. Over the years I have seen many users having a hard time to understand the GNU/Linux filesystem navigation as it dramatically differs from the usual C: or D: drives. In this section, you will also learn a first two Linux commands, which are the cd command and the pwd command. Let us start with the following statement: Forget about C: or D: drives you know from other proprietary operating systems. This knowledge does not apply here and can only confuse you. The GNU/Linux filesystem allows access to any hard drive or partition from any directory within the entire filesystem. However, at this stage, we should not be concerned about that. Perhaps the best analogy to describe the GNU/Linux filesystem is the one I have already used for my Bash Scripting Tutorial. Imagine the GNU/Linux filesystem as a multiple storey building. The so called root directory (building’s entrance door) indicated by / provides the entry to the entire filesystem (building), hence giving access to all directories (levels/rooms) and files (people). To navigate to room 1 on level 3 we first need to enter the main door /, then make our way to level 3 level3/ and from there enter the room1. Hence, the absolute path to this particular room within a building is /level3/room1. From here, if we wish to visit room2 also on level3 we first need to leave our current location that is room1 by entering ../ and then include room’s name room2. We took a relative path to room2 which in this case is ../room2. We were already on level 3, so there was no need to leave the entire building and take absolute path via the main entrance /level3/room2. Confusing? Do not worry after few sessions with the GNU/Linux command line the knowledge sinks in and becomes a second nature to you. Believe it or not, the GNU/Linux operating system provides all users with a compass to aid in filesystem navigation in the form of the pwd (print working directory) command. Every time you get lost merely enter the pwd command, and it will show you the path. Try it now. Open the terminal and type pwd followed by ENTER: $ pwd <img width="1280" height="425" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2013/03/linux-commands-print-working-directory.avif" alt="pwd command print current path" /> The pwd command example to print the current working directory path. By default, your starting working directory is always your home directory. Every non-system user has its directory located within the /home directory. As illustrated on the above image the absolute path to the home directory of the user linuxconfig is /home/linuxconfig. If your system includes user “john”, then the absolute path to this user’s home directory is /home/john. <img width="100" height="100" decoding="async" class="uk-comment-avatar" src="https://linuxconfig.org/wp-content/uploads/2013/03/tips-png-7.avif" alt="" /> Quick Tip:The access to any user home directory is only available to the actual user who owns the directory and to the administrator who in the case of GNU/Linux is the root user. At this stage, we should know how to enter commands on the command line, and we also know how to obtain our current location within the filesystem. It is time to start moving around. To do just that, we use the cd (change directory) command. The cd command allows the user to navigate to any directory available on the filesystem under the condition that the user has proper access permissions. Try it by executing the following commands and do not be afraid to experiment. Do not forget about your personal compass, the pwd command, to instantly tell you your current location. Please ensure to replace the below linuxconfig user wi'
