["https://linuxconfig.org/author/korbinpublisher/page/70"]
title = "Author: Korbin Brown - Page 70 - LinuxConfig"
full_description = 'Install And Set Up KVM On Ubuntu 20.04 Focal Fossa Linux 21 April 2020 by Korbin Brown KVM is Kernel-based Virtual Machine. It’s a module built directly into the Linux kernel that allows the operating system to act as a hypervisor. Although some people may prefer a third-party solution like VirtualBox, there’s no need to install extra software since the Linux kernel already gives us the necessary tools we need to make virtual machines. KVM requires a little configuration if you want some conveniences like a graphical manager or the ability to allow VM guests to login from your network – but we’ll cover that in this guide. Once it’s up and running, you’ll find that KVM provides the most stable and seamless experience for your virtualization needs on Linux. In this tutorial you will learn: How to install necessary KVM utilities on Ubuntu 20.04 How to install and configure virt-manager How to configure network interfaces for bridged connection How to create a new virtual machine Read more Categories Ubuntu <img width="300" height="168" src="https://linuxconfig.org/wp-content/uploads/2020/03/03-how-to-setup-sftp-server-on-ubuntu-20-04-focal-fossa-linux-300x168.png" class="attachment-medium size-medium wp-post-image" alt="How to setup SFTP server on Ubuntu 20.04 Focal Fossa Linux" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2020/03/03-how-to-setup-sftp-server-on-ubuntu-20-04-focal-fossa-linux-300x168.png 300w, https://linuxconfig.org/wp-content/uploads/2020/03/03-how-to-setup-sftp-server-on-ubuntu-20-04-focal-fossa-linux-1024x574.png 1024w, https://linuxconfig.org/wp-content/uploads/2020/03/03-how-to-setup-sftp-server-on-ubuntu-20-04-focal-fossa-linux-768x430.png 768w, https://linuxconfig.org/wp-content/uploads/2020/03/03-how-to-setup-sftp-server-on-ubuntu-20-04-focal-fossa-linux.png 1365w" sizes="(max-width: 300px) 100vw, 300px" /> How to setup SFTP server on Ubuntu 20.04 Focal Fossa Linux 18 April 2020 by Korbin Brown In this guide, we will show you how to setup an SFTP server using VSFTPD on Ubuntu 20.04 Focal Fossa. If you haven’t already, check out our tutorial on How to setup FTP server on Ubuntu 20.04 Focal Fossa with VSFTPD, as this article on SFTP assumes that you’ve applied the configuration covered in the FTP guide. FTP is a great protocol for accessing and transferring files, but it has the shortcoming of being a clear text protocol. In other words, it’s not secure to use over an internet connection, since your credentials and data are transmitted without encryption. The ‘S’ in SFTP stands for ‘Secure’ and tunnels the FTP protocol through SSH, providing the encryption needed to establish a secure connection. In this tutorial you will learn: How to install and configure SSH daemon How to setup an SFTP user account and group How to connect to SFTP server via command line How to connect to SFTP server via command line Read more Categories Ubuntu'
