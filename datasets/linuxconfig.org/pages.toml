["https://linuxconfig.org/how-to-install-the-nvidia-drivers-on-ubuntu-20-04-focal-fossa-linux"]
title = "How to install the NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux - LinuxConfig"
description = "In this tutorial, we will see how to install the NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux and switch from a opensource Nouveau driver to the proprietary Nvidia driver. You can install Nvidia…"
full_description = '''How to install the NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux 7 December 2023 by Lubos Rendek In this tutorial, we will see how to install the NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux and switch from a opensource Nouveau driver to the proprietary Nvidia driver. You can install Nvidia drivers on Ubuntu 20.04 using several different methods, including the official Ubuntu repository, the Nvidia PPA repository, and as a direct download from the official website. You will also learn how to uninstall the Nvidia driver. The main advantage of the Nouveau driver is that it is free and open source, and comes installed by default. The proprietary driver may perform better on some systems, especially for the case of high end games or video editing, etc. For the official driver, we can install from PPA or from the official website (the official website may have a slightly more up to date driver). Follow along with our step by step instructions below to install NVIDIA drivers on Ubuntu. To install Nvidia driver on other Linux distributions, follow our Nvidia Linux Driver guide. In this tutorial you will learn: Perform an automatic Nvidia driver installation using standard Ubuntu Repository Learn how to perform an Nvidia driver installation using PPA repository How to install the official Nvidia.com driver Uninstall/switch back from Nvidia to Nouveau opensource driver <img width="1920" height="1080" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2019/12/01-how-to-install-the-nvidia-drivers-on-ubuntu-20-04-focal-fossa-linux.avif" alt="Installed NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux" /> Installed NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux. After installation, optionally run Nvidia graphic card test by following our Benchmark Your Graphics Card On Linux guide. Software Requirements and Conventions Used Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Installed or upgraded Ubuntu 20.04 Focal Fossa Software N/A Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user <img src="https://i.ytimg.com/vi/pmGfi1ldBqc/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe style="border-top: 3px solid #000;" src="https://www.youtube.com/embed/pmGfi1ldBqc?start=0" width="920" height="474" frameborder="0" allowfullscreen="allowfullscreen"></iframe> How to install Nvidia Drivers on Ubuntu 20.04 using a standard Repository step by step instructions The first method of installing Nvidia drivers on Ubuntu 20.04 is the easiest to perform and in most cases it is the recommended approach. GNOME GUI Nvidia Installation on Ubuntu Method Open the Software & Updates application window. Select the “Additional Drivers” tab and choose any proprietary NVIDIA driver. Keep in mind that the higher the driver number, the later the version. Select the latest NVIDIA driver from the Software and Updates application. Command Line Nvidia Installation Method First, detect the model of your nvidia graphic card and the recommended driver. To do so execute the following command. Please note that your output and recommended driver will most likely be different: $ ubuntu-drivers devices == /sys/devices/pci0000:00/0000:00:01.0/0000:01:00.0 == modalias : pci:v000010DEd00001C03sv00001043sd000085ABbc03sc00i00 vendor : NVIDIA Corporation model : GP106 [GeForce GTX 1060 6GB] driver : nvidia-driver-390 - distro non-free driver : nvidia-driver-435 - distro non-free driver : nvidia-driver-440 - distro non-free recommended driver : xserver-xorg-video-nouveau - distro free builtin From the above output we can conclude that the current system has NVIDIA GeForce GTX 1060 6GB graphic card installed and the recommend driver to install is nvidia-driver-440. Install driver.If you agree with the recommendation feel free to use the ubuntu-drivers command again to install all recommended drivers: $ sudo ubuntu-drivers autoinstall Alternatively, install desired driver selectively using the apt command. For example: $ sudo apt install nvidia-driver-440 Once the installation is concluded, reboot your system and you are done. $ sudo reboot Automatic Install Nvidia drivers on Ubuntu 20.04 using PPA repository – Beta drivers Using graphics-drivers PPA repository allows us to install bleeding edge Nvidia beta drivers at the risk of an unstable system. To proceed first add the ppa:graphics-drivers/ppa repository into your system: $ sudo add-apt-repository ppa:graphics-drivers/ppa Next, identify your graphic card model and recommended driver: $ ubuntu-drivers devices == /sys/devices/pci0000:00/0000:00:01.0/0000:01:00.0 == modalias : pci:v000010DEd00001C03sv00001043sd000085ABbc03sc00i00 vendor : NVIDIA Corporation model : GP106 [GeForce GTX 1060 6GB] driver : nvidia-driver-440 - distro non-free recommended driver : nvidia-driver-390 - distro non-free driver : nvidia-driver-435 - distro non-free driver : xserver-xorg-video-nouveau - distro free builtin Install Nvidia DriverSame as with the above standard Ubuntu repository example, either install all recommended drivers automatically: $ sudo ubuntu-drivers autoinstall or selectively using the apt command. Example: $ sudo apt install nvidia-driver-440 All done.Reboot your computer: $ sudo reboot Manual Nvidia Install Ubuntu 20.04 using the Official Nvidia.com driver step by step instructions identify your NVIDIA VGA card.The below commands will allow you to identify your Nvidia card model: $ lshw -numeric -C display or $ lspci -vnn | grep VGA or $ ubuntu-drivers devices Download the Official Nvidia Driver.Using your web browser navigate to the official Nvidia website and download an appropriate driver for your Nvidia graphic card.Alternatively, if you know what you are doing you can download the driver directly from the Nvidia Linux driver list. Once ready you should end up with a file similar to the one shown below: $ ls NVIDIA-Linux-x86_64-440.44.run Install Prerequisites. The following prerequisites are required to compile and install Nvidia driver: $ sudo apt install build-essential libglvnd-dev pkg-config Disable Nouveau Nvidia driver.Next step is to disable the default nouveau Nvidia driver. Follow this guide on how to disable the default Nouveau Nvidia driver. WARNING Depending on your Nvidia VGA model your system might misbehave. At this stage be ready to get your hands dirty. After the reboot you may end up without GUI at all. Be sure that you have the SSH enabled on your system to be able login remotely or use CTRL+ALT+F2 to switch TTY console and continue with the installation. Make sure you reboot your system before you proceed to the next step. Stop Desktop Manager.In order to install new Nvidia driver we need to stop the current display server. The easiest way to do this is to change into runlevel 3 using the telinit command. After executing the following linux command the display server will stop, therefore make sure you save all your current work ( if any ) before you proceed: $ sudo telinit 3 Hit CTRL+ALT+F1 and login with your username and password to open a new TTY1 session or login via SSH. Install Nvidia Driver.To start installation of Nvidia driver execute the following linux command and follow the wizard: $ sudo bash NVIDIA-Linux-x86_64-440.44.run The Nvidia driver is now installed.Reboot your system: $ sudo reboot Configure NVIDIA X Server Settings.After reboot your should be able to start NVIDIA X Server Settings app from the Activities menu. How to Uninstall Nvidia Driver Follow our guide on how to uninstall Nvidia Driver hence switch back from Nvidia to Nouveau opensource driver. Appendix Error messages: WARNING: Unable to find suitable destination to install 32-bit compatibility libraries Depending on your needs, this can be safely ignored. However, if you wish to install steam game platform this issue cannot be ignored. To resolve execute: $ sudo dpkg --add-architecture i386 $ sudo apt update $ sudo apt install libc6:i386 and re-run the nvidia driver installation. An incomplete installation of libglvnd was found. All of the essential libglvnd libraries are present, but one or more optional components are missing. Do you want to install a full copy of libglvnd? This will overwrite any existing libglvnd libraries. You are missing the libglvnd-dev package. Execute the following command to resolve this issue: $ sudo apt install libglvnd-dev Oct 9 10:36:20 linuxconfig gdm-password]: gkr-pam: unable to locate daemon control file Oct 9 10:36:20 linuxconfig gdm-password]: pam_unix(gdm-password:session): session opened for user linuxconfig by (uid=0) Oct 9 10:36:20 linuxconfig systemd-logind[725]: New session 8 of user linuxconfig. Oct 9 10:36:20 linuxconfig systemd: pam_unix(systemd-user:session): session opened for user linuxconfig by (uid=0) Oct 9 10:36:21 linuxconfig gdm-password]: pam_unix(gdm-password:session): session closed for user linuxconfig Oct 9 10:36:21 linuxconfig systemd-logind[725]: Session 8 logged out. Waiting for processes to exit. Oct 9 10:36:21 linuxconfig systemd-logind[725]: Removed session 8. Oct 9 10:36:45 linuxconfig dbus-daemon[728]: [system] Failed to activate service 'org.bluez': timed out (service_start_timeout=25000ms) To resolve do not overwrite any existing libglvnd libraries during the Nvidia driver installation. WARNING: Unable to determine the path to install the libglvnd EGL vendor library config files. Check that you have pkg-config and the libglvnd development libraries installed, or specify a path with --glvnd-egl-config-path. Make sure to install pkg-config package: $ sudo apt install pkg-config Closing Thoughts In this tutorial, we saw how to install the NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux. There are several methods used for this process, including automatic installation from the default Ubuntu repository, from the PPA repository, and from the official NVIDIA website. Related Linux Tutorials:How to uninstall the NVIDIA drivers on Ubuntu 22.04…How to Install NVIDIA Drivers on Ubuntu 24.04Best Linux Distro: How to Choose Guide for Every UserHow to disable/blacklist Nouveau nvidia driver on…Things to install on Ubuntu 22.04Things to do after installing Ubuntu 22.04 Jammy…Setting Up NVIDIA CUDA Toolkit in a Docker Container…An Introduction to Linux Automation, Tools and TechniquesHow to install Nvidia driver on Debian 12 Bookworm LinuxUltimate Web Server Benchmark: Apache, NGINX,… Categories Ubuntu Tags desktop, multimedia, nvidia, ubuntu, ubuntu 20.04 How to disable AppArmor on Ubuntu 20.04 Focal Fossa LinuxHow to uninstall the NVIDIA drivers on Ubuntu 20.04 Focal Fossa Linux'''
