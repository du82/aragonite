full_description = 'Simplify Restic Backups with Backrest: A Step-by-Step Tutorial 31 January 2025 by Egidio Docile In a previous article, we learned how to create secure and efficient backups with Restic on Linux. Restic works on multiple platforms, but comes without a GUI. In this article, we learn how to install and use Backrest, a free and open source, user-friendly web-based interface for Restic. Read more Categories Guides, System Administration <img width="300" height="193" src="https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-add-custom-launchers-directories-on-linux-300x193.avif" class="attachment-medium size-medium wp-post-image" alt="How to add custom launchers directories on Linux" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-add-custom-launchers-directories-on-linux-300x193.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-add-custom-launchers-directories-on-linux-768x495.avif 768w, https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-add-custom-launchers-directories-on-linux.avif 1024w" sizes="(max-width: 300px) 100vw, 300px" /> How to add custom launchers directories on Linux 16 September 2024 by Egidio Docile On Linux, we create application launchers as files with the “.desktop” extension: they contain metadata about the application they are related to, and instructions about how the latter should be executed. In order for a launcher to appear in the application menu of a desktop environment, it must be placed in certain dedicated directories. In this tutorial, we learn what are the default target directories for application launchers according to the Freedesktop.org specification, and how to add custom ones. Read more Categories Guides, System Administration <img width="300" height="171" src="https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-manage-snapshots-with-snapper-on-linux-300x171.avif" class="attachment-medium size-medium wp-post-image" alt="How to manage snapshots on Linux with Snapper" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-manage-snapshots-with-snapper-on-linux-300x171.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-manage-snapshots-with-snapper-on-linux-1024x585.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-manage-snapshots-with-snapper-on-linux-768x438.avif 768w, https://linuxconfig.org/wp-content/uploads/2024/09/00-how-to-manage-snapshots-with-snapper-on-linux.avif 1200w" sizes="(max-width: 300px) 100vw, 300px" /> How to manage snapshots with Snapper on Linux 2 September 2024 by Egidio Docile Snapper is a free and open source application we can use to manage snapshots on Linux. It was originally designed to work with BTRFS snapshots, but was extended to supports also LVM thin-provisioned logical volumes. In this tutorial, we learn how to install Snapper on the most used Linux distributions, and how to use it to manage snapshots on Linux. Read more Categories Guides, System Administration'
