["https://linuxconfig.org/how-to-install-arch-linux-alongside-ubuntu-dual-boot"]
title = "How to install Arch Linux alongside Ubuntu (Dual Boot) - LinuxConfig"
description = "In this tutorial, we go over the step by step instructions to install Arch Linux alongside Ubuntu Linux in a dual boot configuration."
full_description = 'How to install Arch Linux alongside Ubuntu (Dual Boot) 26 September 2024 by Korbin Brown Arch Linux and Ubuntu are two extremely popular Linux distributions. While they naturally have a lot of functional overlap, their core principles, user friendliness, and native features are very different. Ubuntu is easy to use, while Arch Linux is more customizable. Rather than trying to decide between the two, it is possible to configure a dual boot system so that you can boot into whichever operating system you feel like using. With a dual boot system, you are prompted at system boot to select which operating system to load into. The Arch Linux and Ubuntu installations will remain completely separate, and whenever you need to access the other system, you just need to perform a quick reboot. In this tutorial, we will take you through the step by step instructions of installing Arch Linux alongside a pre-existing Ubuntu Linux installation. NOTE Virtualization is also a viable approach to running two Linux distributions on your computer. The disadvantage of virtualization, however, is that the operating system will not have direct access to the host hardware. This is a big drawback for users that want to squeeze every drop of performance from Arch Linux, such as gamers or those that tend to run resource intensive processes. In this tutorial you will learn: How to create free up space on the Ubuntu data partition How to partition a hard drive for Arch Linux installation How to install Arch Linux alongside Ubuntu Linux in dual boot configuration How to load into Arch Linux or Ubuntu Linux during system boot How to install Arch Linux alongside Ubuntu (Dual Boot) Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Ubuntu Linux and Arch Linux Software N/A Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Preliminary Steps Before getting started, let’s go over the creation of an Arch Linux installation USB drive and discuss hard drive partitioning schemes. Creating a bootable USB for installation One of the prerequisites is a USB drive that has the bootable Arch Linux installer on it. Head over to the Arch Linux download page to grab the latest ISO available. Then, on Ubuntu, you can create a bootable USB with the ISO and dd command: $ sudo dd bs=4M if=path/to/archlinux.iso of=/dev/usb conv=fsync oflag=direct status=progress Of course substitute the proper values in place of the ISO file device path for the USB that we have above. Hard drive partitioning The Arch Linux installation is going to require three different hard drive partitions: EFI system swap root The EFI partition should already exist due to your Ubuntu installation. Arch Linux can share this partition, so we do not need to create it. However, the swap space should be at least 4 GiB, and the root partition can be any size you want, with a minimum of about 25 GiB. The way you set up the partitions may depend on how you have your disk currently configured. There are a few possibilities: Ubuntu currently takes up the entirety of the hard drive There is some free space on the drive already available for Arch Linux You plan to install Arch Linux on a different hard drive than Ubuntu The majority of users probably fall into the first scenario, with their Ubuntu installation configured to take up their entire hard drive. In this case, you will need to partition the hard drive in order to free up some space for the Arch Linux install. This process will not affect your Ubuntu files, rather simply give away some free space to the future Arch Linux installation by shrinking the Ubuntu volume. You will see how to do that in the first steps below. If you already have a section of unpartitioned free space on your hard drive, Arch Linux can use some or all of that space for installation. Likewise if you have a secondary disk that you want to install Arch Linux on, this can house the Arch Linux installation and be totally separate from the Ubuntu install. Create a bootable USB for hard drive partitioning If you need to resize your main partition in order to accommodate the Arch Linux installation, then we recommend using a Ubuntu USB to boot into a live environment and work with gparted to resize the partition. It is not possible to resize the partition from in Ubuntu itself, since the partition will be mounted, so that is why it is necessary to use the live environment. We will cover the steps below for booting into an Ubuntu live environment and resizing the partition for Arch Linux. Back up your hard drive first Remember to perform a back up of all important files before proceeding. A slight mishap in the configuration can lead to the loss of files, though nothing should happen if you are careful. Even still, we highly recommend backing up your files before tinkering with the hard drive partitioning and installation of a new OS. Dual Boot Ubuntu and Arch Linux Now that you have your bootable Arch Linux USB drive handy and have checked off all the considerations above, let’s proceed with installing Arch Linux alongside Ubuntu. We will first boot into the Ubuntu live environment for resizing our partition, but this is not necessary for users that already have unpartitioned space on their hard drive or are installing to a different drive altogether. Follow along with the step by step instructions below to configure the dual boot system: We need to begin by freeing up some space for the Arch Linux installation by shrinking Ubuntu’s root partition. For this, we will boot into our Ubuntu USB drive’s live environment. When the computer boots up, depending on the configured boot order, the USB may load automatically. Otherwise, you will have to press a certain key – sometimes Escape or a function key like F11 or F12 (it varies by manufacturer) – in order to load into the boot menu and select your installation media. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/09/01-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif" alt="Select the option to try Ubuntu (boots into live environment)" width="978" height="574" class="size-full wp-image-23640" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/01-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif 978w, https://linuxconfig.org/wp-content/uploads/2024/09/01-how-to-install-arch-linux-alongside-ubuntu-dual-boot-300x176.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/01-how-to-install-arch-linux-alongside-ubuntu-dual-boot-768x451.avif 768w" sizes="(max-width: 978px) 100vw, 978px" />Select the option to try Ubuntu (boots into live environment) When Ubuntu presents you with the installation prompts (about selecting your language and that kind of stuff), you can close the window and you will be brought to the live environment’s desktop. Use the Activities menu to open GParted, which should be installed by default: <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/09/02-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif" alt="Opening GParted from the Activities menu" width="1066" height="437" class="size-full wp-image-23639" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/02-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif 1066w, https://linuxconfig.org/wp-content/uploads/2024/09/02-how-to-install-arch-linux-alongside-ubuntu-dual-boot-300x123.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/02-how-to-install-arch-linux-alongside-ubuntu-dual-boot-1024x420.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/09/02-how-to-install-arch-linux-alongside-ubuntu-dual-boot-768x315.avif 768w" sizes="(max-width: 1066px) 100vw, 1066px" />Opening GParted from the Activities menu In GParted, click on your root partition, which we plan to resize. It will probably be the biggest partition you have, and the one formatted with the ext4 file system. Then, click on Partition > Resize/Move. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/09/03-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif" alt="Choose to resize/move the root partition" width="1200" height="651" class="size-full wp-image-23638" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/03-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/09/03-how-to-install-arch-linux-alongside-ubuntu-dual-boot-300x163.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/03-how-to-install-arch-linux-alongside-ubuntu-dual-boot-1024x556.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/09/03-how-to-install-arch-linux-alongside-ubuntu-dual-boot-768x417.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Choose to resize/move the root partition We will configure the “Free space following option.” In our case, we want to free up about 30 GiB total for Arch Linux, so we enter 30000 MiB into this box. But you may enter whatever size you please, as long as you also leave enough room for your Ubuntu installation. Click on “Resize/Move” one you are happy with the proposed changes. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/09/04-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif" alt="Adjusting the size of our partition" width="1200" height="758" class="size-full wp-image-23637" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/04-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/09/04-how-to-install-arch-linux-alongside-ubuntu-dual-boot-300x190.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/04-how-to-install-arch-linux-alongside-ubuntu-dual-boot-1024x647.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/09/04-how-to-install-arch-linux-alongside-ubuntu-dual-boot-768x485.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Adjusting the size of our partition You should see the unallocated space listed in GParted. Click on the green checkmark “Apply All Operations” box when you are finished, and then close GParted. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/09/05-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif" alt="GParted shows our unallocated disk space" width="1200" height="759" class="size-full wp-image-23636" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/05-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/09/05-how-to-install-arch-linux-alongside-ubuntu-dual-boot-300x190.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/05-how-to-install-arch-linux-alongside-ubuntu-dual-boot-1024x648.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/09/05-how-to-install-arch-linux-alongside-ubuntu-dual-boot-768x486.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />GParted shows our unallocated disk space You can now power off the system and boot into the Arch Linux USB. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/09/06-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif" alt="Booting into the Arch Linux installer" width="981" height="624" class="size-full wp-image-23635" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/06-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif 981w, https://linuxconfig.org/wp-content/uploads/2024/09/06-how-to-install-arch-linux-alongside-ubuntu-dual-boot-300x191.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/06-how-to-install-arch-linux-alongside-ubuntu-dual-boot-768x489.avif 768w" sizes="(max-width: 981px) 100vw, 981px" />Booting into the Arch Linux installer DID YOU KNOW? Installation of Arch Linux is not as straightforward as Ubuntu. The entire installation will take place on the command line, and we recommend that you follow all of these steps exactly. Also be sure to substitute your own partition paths where you see ours in the examples below. You should now be brought to the command prompt of the Arch Linux installer. By default, the keyboard map is set to US. If you are using a US keyboard, then you can skip this part. Otherwise, list available keyboard layouts with the following command: # localectl list-keymaps And then select the keyboard layout that corresponds to your setup with: # loadkeys [keymap selection] If you find the default tty console font difficult to read then you can change it to any font in the /usr/share/kbd/consolefonts directory using the setfont command like so: # setfont ter-g32n Next, let’s make sure we are connected to the internet by pinging a website: $ ping archlinux.org If your internet is not connected, you will need to configure connectivity manually. Instructions for this will vary depending on how your network is set up. The next step is to update your system clock by simply executing: # timedatectl Now we can move on to partitioning the hard disk. In our example, we will be partitioning the same disk that has Ubuntu installed on it. Even if you are using a separate disk, you will still need to partition that disk instead and adapt to these instructions as appropriate. Let’s execute the fdisk command so we can identify the disk we are going to work with: # fdisk -l <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/09/07-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif" alt="Using the fdisk command to find the name of the disk" width="1079" height="704" class="size-full wp-image-23634" srcset="https://linuxconfig.org/wp-content/uploads/2024/09/07-how-to-install-arch-linux-alongside-ubuntu-dual-boot.avif 1079w, https://linuxconfig.org/wp-content/uploads/2024/09/07-how-to-install-arch-linux-alongside-ubuntu-dual-boot-300x196.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/09/07-how-to-install-arch-linux-alongside-ubuntu-dual-boot-1024x668.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/09/07-how-to-install-arch-linux-alongside-ubuntu-dual-boot-768x501.avif 768w" sizes="(max-width: 1079px) 100vw, 1079px" />Using the fdisk command to find the name of the disk In our case, our disk is /dev/sda as shown above, but yours may be different. Execute the next command to be taken into fdisk prompts to begin the disk partitioning: # fdisk [path to disk] The path of the disk is the /dev file we located in the previous step. The way you partition your disk will depend on your preferences. Now is the time to think about how you want your drive to be partitioned. We will follow the general recommendations that Arch Linux lists in their Wiki guide, which is: An EFI system partition of 1 GiB size (Ubuntu already has on'
