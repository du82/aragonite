["https://linuxconfig.org/how-to-configure-static-ip-address-on-ubuntu-18-10-cosmic-cuttlefish-linux"]
title = "Ubuntu Static IP configuration - LinuxConfig"
description = "In this tutorial, you will learn all about Ubuntu static IP address configuration. We will provide the reader with a step by step procedure on how to set static IP address on Ubuntu Server via netplan…"
full_description = '''Ubuntu Static IP configuration 7 December 2023 by Lubos Rendek In this tutorial, you will learn all about Ubuntu static IP address configuration. We will provide the reader with a step by step procedure on how to set static IP address on Ubuntu Server via netplan and Ubuntu Desktop using NetworkManager. Static IP address is recommended for servers as the static address does not change as oppose to a dynamic IP address assignment via DHCP server. This tutorial will work for all recent versions of Ubuntu, including the latest LTS release, Ubuntu 22.04 Jammy Jellyfish. Ubuntu offers us a GUI method and command line method to set a static IP address, and both methods are covered below. DID YOU KNOW? Did you know that static IP address can also be achieved by DHCP server? DHCP server allows for a manual MAC address binding to a specific IP address, which will result in client receiving same static IP address with each dynamic IP address request. In this tutorial you will learn how to: Set static IP address on Ubuntu Desktop using a NetworkManager Configure static IP address on Ubuntu server via networkd daemon Ubuntu Static IP configuration Software Requirements and Conventions Used Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Installed or Ubuntu Server/Desktop N/A Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Ubuntu Static IP configuration step by step Ubuntu Desktop The simplest approach on how to configure a static IP address on Ubuntu Desktop is via GNOME graphical user interface: Click on the top right network icon and select settings of the network interface you wish to configure to use a static IP address on Ubuntu. <img decoding="async" class="size-full wp-image-4660" src="https://linuxconfig.org/wp-content/uploads/2018/10/01-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Open network settings Ubuntu Desktop" width="1288" height="937" />Open network settings Ubuntu Desktop Click on the settings icon to start IP address configuration. <img decoding="async" class="size-full wp-image-4661" src="https://linuxconfig.org/wp-content/uploads/2018/10/02-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Start network configuration to set static IP address" width="1288" height="937" />Start network configuration to set static IP address Select IPv4 tab. <img decoding="async" class="size-full wp-image-4662" src="https://linuxconfig.org/wp-content/uploads/2018/10/03-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Static IPv4 IP address Ubuntu Desktop" width="1288" height="937" />Static IPv4 IP address Ubuntu Desktop Select manual and enter your desired IP address, netmask, gateway and DNS settings. Once ready click Apply button. <img decoding="async" class="size-full wp-image-4663" src="https://linuxconfig.org/wp-content/uploads/2018/10/04-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Enter your desired static IP address" width="1288" height="937" />Enter your desired static IP address Turn OFF and ON switch to apply your new network static IP configuration settings. <img decoding="async" class="size-full wp-image-4664" src="https://linuxconfig.org/wp-content/uploads/2018/10/05-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Apply your new network configuration settings" width="1288" height="937" />Apply your new network configuration settings Click on the network settings icon once again to confirm your new static IP address settings. <img decoding="async" class="size-full wp-image-4665" src="https://linuxconfig.org/wp-content/uploads/2018/10/06-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Confirm your new IP address settings" width="1288" height="937" />Confirm your new IP address settings Ubuntu Server To configure a static IP address on your Ubuntu server you need to modify a relevant netplan network configuration file within /etc/netplan/ directory. NOTE Carefully check the renderer stanza in your configuration file. If the renderer configuration is set to NetworkManager then your Ubuntu’s system network configuration is managed by GUI Network Manager. Change the renderer to renderer: networkd if you do not wish to configure your network IP address via Graphical User Interface ( desktop ). For example, you might find there a default netplan configuration file called 50-cloud-init.yaml or 01-network-manager-all.yaml with a following content using the networkd deamon to configure your network interface via DHCP: # This file is generated from information provided by # the datasource. Changes to it will not persist across an instance. # To disable cloud-init's network configuration capabilities, write a file # /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg with the following: # network: {config: disabled} network: ethernets: enp0s3: addresses: [] dhcp4: true version: 2 <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2018/10/07-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Default dynamic IP address settings on Ubuntu Server" width="800" height="572" />Default dynamic IP address settings on Ubuntu Server To set your network interface enp0s3 to static IP address 192.168.1.233 with gateway 192.168.1.1 and DNS server as 8.8.8.8 and 8.8.4.4 replace the above configuration with the one below. WARNING Note, you must adhere to a correct code indent for each line of the block. In other words the prefix number of spaces for each line is important. Otherwise you may end up with an error message similar to: Invalid YAML at //etc/netplan/01-netcfg.yaml line 7 column 6: did not find expected key. # This file is generated from information provided by # the datasource. Changes to it will not persist across an instance. # To disable cloud-init's network configuration capabilities, write a file # /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg with the following: # network: {config: disabled} network: version: 2 renderer: networkd ethernets: enp0s3: dhcp4: no addresses: [192.168.1.233/24] gateway4: 192.168.1.1 nameservers: addresses: [8.8.8.8,8.8.4.4] <img decoding="async" title="Ubuntu server configured with static IP address." src="https://linuxconfig.org/wp-content/uploads/2018/10/08-configure-static-ip-ubuntu-18.10-cosmic.avif" alt="Ubuntu server configured with static IP address." width="801" height="578" />Ubuntu server configured with static IP address. Once ready apply changes with: $ sudo netplan apply In case you run into some issues execute: $ sudo netplan --debug apply Closing Thoughts In this tutorial, we saw how to configure a static IP address on an Ubuntu Linux system. This ensures that our private internal IP address will not change again, unless we manually do so at a later time. This has some advantages over DHCP since it means that our system can always be found at the same network address. Related Linux Tutorials:Things to do after installing Ubuntu 22.04 Jammy…Things to install on Ubuntu 22.04The 8 Best Ubuntu Desktop Environments (22.04 Jammy…How to install Ubuntu 22.04 Jammy Jellyfish DesktopHow to Update Ubuntu packages on Ubuntu 22.04 Jammy…How to install MATLAB on Ubuntu 22.04 Jammy Jellyfish LinuxUbuntu 22.04 GuidePDF viewer list on Ubuntu 22.04 Jammy Jellyfish LinuxHow to configure static IP address on Ubuntu 22.04…How to install macOS theme on Ubuntu 22.04 Jammy… Categories Ubuntu Tags administration, networking, server, ubuntu How to enable autologin on Kali LinuxHow to install Google Chrome web browser on Ubuntu 18.10 Cosmic Cuttlefish Linux'''
