["https://linuxconfig.org/bash-scripting-tutorial"]
title = "Bash Scripting Tutorial: How to Write a Bash Script - LinuxConfig"
description = "The Bash shell is one of the most powerful components of a Linux system, as well as one of the most compelling reasons to use Linux. Users can interact with Bash through the command line…"
full_description = '''Bash Scripting Tutorial: How to Write a Bash Script 25 October 2024 by Luke Reynolds The Bash shell is one of the most powerful components of a Linux system, as well as one of the most compelling reasons to use Linux. Users can interact with Bash through the command line, and write scripts to automate tasks. Although this may sound intimidating to beginning users, it is not hard to get started with Bash scripting. What is Bash Script? A Bash script is a text file containing a series of commands written for the Bash shell, used to automate tasks, execute multiple commands, or create simple programs on Unix-based systems like Linux and macOS. That means that if you regularly use the Linux command line, then Bash scripts are pretty simple. Anything that exists in a Bash script can also be executed in the command line. In this tutorial, we will take you through various examples of Bash scripts to show you what it is capable of, and how to utilize different aspects of Bash. To go from beginner to expert in Bash scripting, you can start by copying some of our examples on to your own system. Use the scripts in this Bash scripting tutorial to modify them, execute them, and keep practicing. We will help you through all the essential aspects of Bash. Let’s begin! In this Bash scripting tutorial you will learn: How to write your first Hello World Bash script How to pass arguments to a Bash script How to use global and local variables in Bash How to read user input How to load and read arrays in Bash How to compare integers and strings How to detect file types in Bash How to use for, while, and until loops How to use functions in Bash How to use if statements How to use case statements How to use quotes and special characters in Bash How to perform arithmetic calculations with Bash How to use Bash redirection Bash Scripting Tutorial: How to Write a Bash Script Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Linux system Software Bash shell (installed by default) Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user NOTE For more verbose and beginner style Bash scripting tutorial visit our Bash Scripting Tutorial for Beginners. Hello World Bash Shell Script – Bash Scripting Tutorial First you need to find out where is your Bash interpreter located. Enter the following into your command line: $ which bash /bin/bash This command reveals that the Bash shell is stored in /bin/bash. This will come into play momentarily. The next thing you need to do is open our favorite text editor and create a file called hello_world.sh. We will use nano for this step. $ nano hello_world.sh Copy and paste the following lines into the new file and save it: #!/bin/bash # declare STRING variable STRING="Hello World" # print variable on a screen echo $STRING WHAT IS SHEBANG Every bash shell script in this tutorial starts with a shebang: #! which is not read as a comment. First line is also a place where you put your interpreter which is in this case: /bin/bash. Navigate to the directory where your hello_world.sh bash script is located and make the file executable: $ chmod +x hello_world.sh Now you are ready to execute your first bash script: $ ./hello_world.sh The output you receive should simply be: Hello World <img decoding="async" class="size-full wp-image-24064" src="https://linuxconfig.org/wp-content/uploads/2013/03/01-bash-scripting-tutorial-how-to-write-a-bash-script-image.avif" alt="Creating, saving and executing a simple hello world Bash Script." width="1033" height="277" srcset="https://linuxconfig.org/wp-content/uploads/2013/03/01-bash-scripting-tutorial-how-to-write-a-bash-script-image.avif 1033w, https://linuxconfig.org/wp-content/uploads/2013/03/01-bash-scripting-tutorial-how-to-write-a-bash-script-image-300x80.avif 300w, https://linuxconfig.org/wp-content/uploads/2013/03/01-bash-scripting-tutorial-how-to-write-a-bash-script-image-1024x275.avif 1024w, https://linuxconfig.org/wp-content/uploads/2013/03/01-bash-scripting-tutorial-how-to-write-a-bash-script-image-768x206.avif 768w" sizes="(max-width: 1033px) 100vw, 1033px" />Creating, saving and executing a simple hello world Bash Script. Simple Backup bash shell script When writing a Bash script, you are basically putting into it the same commands that you could execute directly on the command line. A perfect example of this is the following script: #!/bin/bash tar -czf myhome_directory.tar.gz /home/linuxconfig This will create a compressed tar file of the home directory for user linuxconfig. The tar command we use in the script could easily just be executed directly on the command line. So, what’s the advantage of the script? Well, it allows us to quickly call this command without having to remember it or type it every time. We could also easily expand the script later on to be more complex. Variables in Bash scripts In this example we declare simple bash variable $STRING and print it on the screen (stdout) with echo command. #!/bin/bash STRING="HELLO WORLD!!!" echo $STRING The result when we execute the script: $ ./hello_world.sh HELLO WORLD!!! Circling back to our backup script example, let’s use a variable to name our backup file and put a time stamp in the file name by using the date command. #!/bin/bash OF=myhome_directory_$(date +%Y%m%d).tar.gz tar -czf $OF /home/linuxconfig The result of executing the script: $ ./backup.sh $ ls myhome_directory_$(date +20220209).tar.gz Now, when we see the file, we can quickly determine that the backup was performed on February 9, 2022. Global vs. Local variables In Bash scripting, a global variable is a variable that can be used anywhere inside the script. A local variable will only be used within the function that it is declared in. Check out the example below where we declare both a global variable and local variable. We’ve made some comments in the script to make it a little easier to digest. #!/bin/bash # Define bash global variable # This variable is global and can be used anywhere in this bash script VAR="global variable" function bash { # Define bash local variable # This variable is local to bash function only local VAR="local variable" echo $VAR } echo $VAR bash # Note the bash global variable did not change # "local" is bash reserved word echo $VAR The result of executing this script: $ ./variables.sh global variable local variable global variable Passing arguments to the bash script When executing a Bash script, it is possible to pass arguments to it in your command. As you can see in the example below, there are multiple ways that a Bash script can interact with the arguments we provide. #!/bin/bash # use predefined variables to access passed arguments #echo arguments to the shell echo $1 $2 $3 ' -> echo $1 $2 $3' # We can also store arguments from bash command line in special array args=("$@") #echo arguments to the shell echo ${args[0]} ${args[1]} ${args[2]} ' -> args=("$@"); echo ${args[0]} ${args[1]} ${args[2]}' #use $@ to print out all arguments at once echo $@ ' -> echo $@' # use $# variable to print out # number of arguments passed to the bash script echo Number of arguments passed: $# ' -> echo Number of arguments passed: $#' Let’s try executing this script and providing three arguments. $ ./arguments.sh Bash Scripting Tutorial The results when we execute this script: Bash Scripting Tutorial -> echo $1 $2 $3 Bash Scripting Tutorial -> args=("$@"); echo ${args[0]} ${args[1]} ${args[2]} Bash Scripting Tutorial -> echo $@ Number of arguments passed: 3 -> echo Number of arguments passed: $# Executing shell commands with bash The best way to execute a separate shell command inside of a Bash script is by creating a new subshell through the $( ) syntax. Check the example below where we echo the result of running the uname -o command. #!/bin/bash # use a subshell $() to execute shell command echo $(uname -o) # executing bash command without subshell echo uname -o Notice that in the final line of our script, we do not execute the uname command within a subshell, therefore the text is taken literally and output as such. $ uname -o GNU/LINUX $ ./subshell.sh GNU/LINUX uname -o Reading User Input We can use the read command to read input from the user. This allows a user to interact with a Bash script and help dictate the way it proceeds. Here’s an example: #!/bin/bash echo -e "Hi, please type the word: \c " read word echo "The word you entered is: $word" echo -e "Can you please enter two words? " read word1 word2 echo "Here is your input: \"$word1\" \"$word2\"" echo -e "How do you feel about bash scripting? " # read command now stores a reply into the default build-in variable $REPLY read echo "You said $REPLY, I'm glad to hear that! " echo -e "What are your favorite colours ? " # -a makes read command to read into an array read -a colours echo "My favorite colours are also ${colours[0]}, ${colours[1]} and ${colours[2]}:-)" Our Bash script asks multiple questions and then is able to repeat the information back to us through variables and arrays: $ ./read.sh Hi, please type the word: Linuxconfig.org The word you entered is: Linuxconfig.org Can you please enter two words? Debian Linux Here is your input: "Debian" "Linux" How do you feel about bash scripting? good You said good, I'm glad to hear that! What are your favorite colours ? blue green black My favorite colours are also blue, green and black:-) Bash Trap Command The trap command can be used in Bash scripts to catch signals sent to the script and then execute a subroutine when they occur. The script below will detect a Ctrl + C interrupt. #!/bin/bash # bash trap command trap bashtrap INT # bash clear screen command clear; # bash trap function is executed when CTRL-C is pressed: # bash prints message => Executing bash trap subrutine ! bashtrap() { echo "CTRL+C Detected !...executing bash trap !" } # for loop from 1/10 to 10/10 for a in `seq 1 10`; do echo "$a/10 to Exit." sleep 1; done echo "Exit Bash Trap Example!!!" In the output below you can see that we try to Ctrl + C two times but the script continues to execute. $ ./trap.sh 1/10 to Exit. 2/10 to Exit. ^CCTRL+C Detected !...executing bash trap ! 3/10 to Exit. 4/10 to Exit. 5/10 to Exit. 6/10 to Exit. 7/10 to Exit. ^CCTRL+C Detected !...executing bash trap ! 8/10 to Exit. 9/10 to Exit. 10/10 to Exit. Exit Bash Trap Example!!! Arrays – Bash script tutorial Bash is capable of storing values in arrays. Check the sections below for two different examples. Declare simple bash array This example declares an array with four elements. #!/bin/bash #Declare array with 4 elements ARRAY=( 'Debian Linux' 'Redhat Linux' Ubuntu Linux ) # get number of elements in the array ELEMENTS=${#ARRAY[@]} # echo each element in array # for loop for (( i=0;i<$ELEMENTS;i++)); do echo ${ARRAY[${i}]} done Executing the script will output the elements of our array: $ ./arrays.sh Debian Linux Redhat Linux Ubuntu Linux Read file into bash array Rather than filling out all of the elements of our array in the Bash script itself, we can program our script to read input and put it into an array. #!/bin/bash # Declare array declare -a ARRAY # Link filedescriptor 10 with stdin exec 10<&0 # stdin replaced with a file supplied as a first argument exec < $1 let count=0 while read LINE; do ARRAY[$count]=$LINE ((count++)) done echo Number of elements: ${#ARRAY[@]} # echo array's content echo ${ARRAY[@]} # restore stdin from filedescriptor 10 # and close filedescriptor 10 exec 0<&10 10<&- Now let’s execute the script and store four elements in the array by using a file’s contents for input. $ cat bash.txt Bash Scripting Tutorial Guide $ ./bash-script.sh bash.txt Number of elements: 4 Bash Scripting Tutorial Guide Bash if / else / fi statements Here is a simple if statement that check to see if a directory exists or not. Depending on the result, it will do one of two things. Please note the spacing inside the [ and ] brackets! Without the spaces, it won’t work! #!/bin/bash directory="./BashScripting" # bash check if directory exists if [ -d $directory ]; then echo "Directory exists" else echo "Directory does not exist" fi The output: $ ./bash_if_else.sh Directory does not exist $ mkdir BashScripting $ ./bash_if_else.sh Directory exists Nested if/else It is possible to place an if statement inside yet another if statement. This is called nesting. Scripts can get a bit complex depending on how many if statements deep it is. #!/bin/bash # Declare variable choice and assign value 4 choice=4 # Print to stdout echo "1. Bash" echo "2. Scripting" echo "3. Tutorial" echo -n "Please choose a word [1,2 or 3]? " # Loop while the variable choice is equal 4 # bash while loop while [ $choice -eq 4 ]; do # read user input read choice # bash nested if/else if [ $choice -eq 1 ] ; then echo "You have chosen word: Bash" else if [ $choice -eq 2 ] ; then echo "You have chosen word: Scripting" else if [ $choice -eq 3 ] ; then echo "You have chosen word: Tutorial" else echo "Please make a choice between 1-3 !" echo "1. Bash" echo "2. Scripting" echo "3. Tutorial" echo -n "Please choose a word [1,2 or 3]? " choice=4 fi fi fi done Output from the script: $ ./nested_if_else.sh 1. Bash 2. Scripting 3. Tutorial Please choose a word [1,2 or 3]? 5 Please make a choice between 1-3 ! 1. Bash 2. Scripting 3. Tutorial Please choose a word [1,2 or 3]? 2 You have chosen word: Scripting Bash Comparisons Bash can compare two or more values, either integers or strings, to determine if they are equal to each other, or one is greater than the other, etc. Arithmetic Comparisons -lt < -gt > -le <= -ge >= -eq == -ne != Now let’s use these operators in some examples. #!/bin/bash # declare integers NUM1=2 NUM2=2 if [ $NUM1 -eq $NUM2 ]; then echo "Both values are equal" else echo "Values are NOT equal" fi The result: $ ./statement.sh Both values are equal Let’s try changing one of the numbers. #!/bin/bash # declare integers NUM1=2 NUM2=1 if [ $NUM1 -eq $NUM2 ]; then echo "Both Values are equal" else echo "Values are NOT equal" fi The result: $ ./statement.sh Values are NOT equal Let’s add a little more complexity by including an elif statement and determing which number is larger. #!/bin/bash # declare integers NUM1=2 NUM2=1 if [ $NUM1 -eq $NUM2 ]; then echo "Both values are equal" elif [ $NUM1 -gt $NUM2 ]; then echo "NUM1 is greater than NUM2" else echo "NUM2 is greater than NUM1" fi The result: $ ./statement.sh NUM1 is greater than NUM2 String Comparisons = equal != not equal < less then > greater then -n s1 string s1 is not empty -z s1 string s1 is empty Let’s try comparing two strings to see if they are equal. #!/bin/bash #Declare string S1 S1="Bash" #Declare string S2 S2="Scripting" if [ $S1 = $S2 ];'''
