["https://linuxconfig.org/how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux"]
title = "How to Install Adobe Acrobat Reader on Ubuntu and Debian Linux - LinuxConfig"
description = "While Ubuntu and Debian come with native applications to open PDF documents by default, some users may prefer to install Adobe Acrobat Reader for its additional features and compatibility."
full_description = 'How to Install Adobe Acrobat Reader on Ubuntu and Debian Linux 19 July 2024 by Lubos Rendek While Ubuntu and Debian come with native applications to open PDF documents by default, some users may prefer to install Adobe Acrobat Reader for its additional features and compatibility. This tutorial will guide you through the process of installing Adobe Acrobat Reader on Ubuntu and Debian. This application will provide enhanced capabilities for opening and managing PDF documents on these Linux distributions. The advantage of Acrobat Reader, of course, is that it’s the official program and recommended for reading PDF documents in the way they are intended. However, many other free applications exist for reading PDF documents. You may also be interested in our list of PDF viewers available for Ubuntu and Debian. PDF documents are a standard created and maintained by Adobe, but it has become a widespread document type that many applications can now open or even edit. WARNING Please note that Adobe no longer supports Acrobat Reader for Linux. The latest native Linux version is 9.5.5 dated from 26/04/2013. From this reason you should refrain using/installing Adobe Acrobat Reader to avoid potential vulnerabilities and hacker exploits. You are recommended to consider installation of Adobe Acrobat Reader on Wine. In this tutorial you will learn: How to install Adobe Acrobat Reader prerequisites How to download Adobe Acrobat Reader How to install Adobe Acrobat Reader How to start Adobe Acrobat Reader Alternative method to install Adobe Acrobat Reader using Snap How to Install Adobe Acrobat Reader on Ubuntu and Debian Software Requirements and Conventions Used Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Installed or upgraded Ubuntu or Debian Software Adobe Acrobat Reader Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Install Adobe Acrobat Reader using Snap Open the terminal and enter the following snap command to install Adobe Acrobat Reader: $ sudo snap install acrordrdc Once installed, you can run Adobe Acrobat Reader by entering: $ acrordrdc <img decoding="async" class="size-full wp-image-23024" src="https://linuxconfig.org/wp-content/uploads/2019/12/05-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux.avif" alt="Adobe Reading installed on Ubuntu Linux" width="1200" height="675" srcset="https://linuxconfig.org/wp-content/uploads/2019/12/05-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux.avif 1200w, https://linuxconfig.org/wp-content/uploads/2019/12/05-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2019/12/05-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2019/12/05-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Adobe Reading installed on Ubuntu Linux Install Adobe Acrobat Reader on Ubuntu and Debian step by step instructions from package Follow along with the step by step instructions below to get Adobe Acrobat Reader installed on Ubuntu or Debian. Note again that this is an old release and Adobe no longer develops an Acrobat Reader version for Linux systems. To download Adobe Acrobat Reader open the terminal and enter the following wget command: $ wget -O ~/adobe.deb ftp://ftp.adobe.com/pub/adobe/reader/unix/9.x/9.5.5/enu/AdbeRdr9.5.5-1_i386linux_enu.deb Next, enable i386 architecture: $ sudo dpkg --add-architecture i386 $ sudo apt update Install all prerequisites by executing: $ sudo apt install libxml2:i386 libcanberra-gtk-module:i386 gtk2-engines-murrine:i386 libatk-adaptor:i386 Now, we are ready to install the actual Adobe Acrobat Reader package downloaded previously: $ sudo dpkg -i ~/adobe.deb To start the Adobe Acrobat Reader use the activities menu to search for adobe and click on the relevant icon. Or you can find your PDF document in the file browser, right click, press “Open with other application” and find Adobe Acrobat Reader in the list of options. <img width="1438" height="900" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2019/12/01-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux.avif" alt="Launch Adobe Acrobat Reader on Ubuntu and Debian" /> Launch Adobe Acrobat Reader on Ubuntu and Debian <img width="1439" height="898" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2019/12/02-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux.avif" alt="Accept terms and conditions" /> Accept terms and conditions Alternatively, you can start the Adobe Acrobat Reader on Ubuntu or Debian from a command line: $ acroread <img width="1440" height="899" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2019/12/03-how-to-install-adobe-acrobat-reader-on-ubuntu-20-04-focal-fossa-linux.avif" alt="Adobe Acrobat Reader on Ubuntu and Debian" /> Adobe Acrobat Reader on Ubuntu and Debian Closing Thoughts In this tutorial, we saw how to install Adobe Acrobat Reader on Ubuntu and Debian Linux. The program can now be used to open PDF documents on your system. You may eventually wish to migrate to a new reader, or use the Windows version with WINE, as Acrobat has become out of date and unsupported on Linux. Related Linux Tutorials:Best PDF Reader for LinuxPDF viewer list on Ubuntu 22.04 Jammy Jellyfish LinuxBest Linux Distro: How to Choose Guide for Every UserUltimate Web Server Benchmark: Apache, NGINX,…An Introduction to Linux Automation, Tools and TechniquesHow to get and change PDF metadata in LinuxThings to install on Ubuntu 22.04How to convert JPG to PDFIntroduction to Linux capabilitiesMastering Bash Script Loops Categories Ubuntu Tags applications, desktop, ubuntu, ubuntu 20.04 How to enable Gnome desktop dark theme on Ubuntu 20.04 Focal Fossa LinuxHow to Install Adobe Acrobat Reader DC (WINE) on Ubuntu 20.04 Focal Fossa Linux'
