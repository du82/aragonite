full_description = 'How to resize ext4 root partition live without umount on Linux 22 November 2024 by Luke Reynolds It is possible to resize the root partition in Linux, even if you are actively booted into the installation that resides on the partition. Ordinarily, hard drive partitioning changes should only be carried out on unmounted partitions and hard drive space that is not being actively used. However, in a situation where you need to change the root partition size, and can’t load into a different installation environment to carry out the changes, you may have no other choice but to resize the root partition while it is still mounted and and the computer is booted into it. Read more Categories System Administration <img width="300" height="188" src="https://linuxconfig.org/wp-content/uploads/2023/03/00-how-to-run-python-scripts-with-bash-tips-and-examples-300x188.png" class="attachment-medium size-medium wp-post-image" alt="How to Run Python Scripts with Bash: Tips and Examples" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2023/03/00-how-to-run-python-scripts-with-bash-tips-and-examples-300x188.png 300w, https://linuxconfig.org/wp-content/uploads/2023/03/00-how-to-run-python-scripts-with-bash-tips-and-examples-1024x640.png 1024w, https://linuxconfig.org/wp-content/uploads/2023/03/00-how-to-run-python-scripts-with-bash-tips-and-examples-768x480.png 768w, https://linuxconfig.org/wp-content/uploads/2023/03/00-how-to-run-python-scripts-with-bash-tips-and-examples.png 1200w" sizes="(max-width: 300px) 100vw, 300px" /> How to Use a Bash Script to Run Your Python Scripts 11 May 2024 by Luke Reynolds Python is a popular programming language used in a wide range of applications, from data analysis and scientific computing to web development and artificial intelligence. Bash is a powerful scripting language used primarily in Unix and Linux environments for automating tasks and running commands. By combining the two languages, developers can create powerful scripts that can automate complex tasks and workflows. Read more Categories Programming & Scripting'
