title = "Author: Korbin Brown - Page 2 - LinuxConfig"
full_description = 'How to use Raspberry Pi to monitor network traffic 2 April 2024 by Korbin Brown There are a plethora of tools available for the Raspberry Pi that system administrators can use to monitor network traffic. Newer Raspberry Pi models even come with a built in WiFi chip in addition to the traditional Ethernet port, giving us even more options for connecting to networks and monitoring traffic. Network monitoring can be useful for troubleshooting connectivity problems or identifying bottlenecks that are slowing down connections. Read more Categories System Administration <img width="300" height="225" src="https://linuxconfig.org/wp-content/uploads/2024/04/00-setup-raspberry-pi-as-router-300x225.webp" class="attachment-medium size-medium wp-post-image" alt="Set up Raspberry Pi as Router" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/04/00-setup-raspberry-pi-as-router-300x225.webp 300w, https://linuxconfig.org/wp-content/uploads/2024/04/00-setup-raspberry-pi-as-router-1024x768.webp 1024w, https://linuxconfig.org/wp-content/uploads/2024/04/00-setup-raspberry-pi-as-router-768x576.webp 768w, https://linuxconfig.org/wp-content/uploads/2024/04/00-setup-raspberry-pi-as-router.webp 1200w" sizes="(max-width: 300px) 100vw, 300px" /> Set up Raspberry Pi as Router 2 April 2024 by Korbin Brown The Raspberry Pi can be a great choice if you want to implement a customizable router for your home network. Rather than paying big bucks for a router which is not as configurable due to its proprietary software, the Raspberry Pi can be transformed into a router while retaining its default Linux operating system, with which system administrators are very familiar. Firewall rules and network monitoring are made easy when all of the traffic is passing through the Raspberry Pi instead of a locked down router. Read more Categories System Administration <img width="300" height="200" src="https://linuxconfig.org/wp-content/uploads/2024/04/00-raspberry-pi-4-enable-uart-300x200.webp" class="attachment-medium size-medium wp-post-image" alt="Raspberry Pi 4 enable UART" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/04/00-raspberry-pi-4-enable-uart-300x200.webp 300w, https://linuxconfig.org/wp-content/uploads/2024/04/00-raspberry-pi-4-enable-uart-1024x683.webp 1024w, https://linuxconfig.org/wp-content/uploads/2024/04/00-raspberry-pi-4-enable-uart-768x512.webp 768w, https://linuxconfig.org/wp-content/uploads/2024/04/00-raspberry-pi-4-enable-uart.webp 1200w" sizes="(max-width: 300px) 100vw, 300px" /> Raspberry Pi 4 enable UART 2 April 2024 by Korbin Brown Among the GPIO pins on the Raspberry Pi are two that are capable of UART (Universal Asynchronous Receiver/Transmitter). UART is a serial connection which, when utilized on the Raspberry Pi, can send data between the Raspberry Pi and an external device. It is one of simplest connection types available on Raspberry Pi, which means it is easy to use but also more limited in functionality. Read more Categories System Administration'
