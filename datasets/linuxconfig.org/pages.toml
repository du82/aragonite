["https://linuxconfig.org/author/egidio"]
title = "Author: Egidio Docile - LinuxConfig"
full_description = 'Simplify Restic Backups with Backrest: A Step-by-Step Tutorial 31 January 2025 by Egidio Docile In a previous article, we learned how to create secure and efficient backups with Restic on Linux. Restic works on multiple platforms, but comes without a GUI. In this article, we learn how to install and use Backrest, a free and open source, user-friendly web-based interface for Restic. Read more Categories Guides, System Administration <img width="300" height="233" src="https://linuxconfig.org/wp-content/uploads/2024/10/00-introduction-to-dm-integrity-300x233.avif" class="attachment-medium size-medium wp-post-image" alt="Introduction to dm-integrity" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/10/00-introduction-to-dm-integrity-300x233.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/10/00-introduction-to-dm-integrity-1024x796.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/10/00-introduction-to-dm-integrity-768x597.avif 768w, https://linuxconfig.org/wp-content/uploads/2024/10/00-introduction-to-dm-integrity.avif 1152w" sizes="(max-width: 300px) 100vw, 300px" /> Protecting Data Integrity on Ext4 and XFS with dm-integrity and LUKS 2 December 2024 by Egidio Docile Unlike COW filesystems like BTRFS and ZFS, traditional Linux filesystems like ext4 and XFS have no way to detect slow data degradation (also known as bitrot), since they don’t perform data checksumming. When using those filesystems, however, we can store and verify integrity information at the block level, using dm-integrity. In this tutorial, we learn how to create dm-integrity devices with the integritysetup utility, and when creating LUKS containers, using cryptsetup. Read more Categories System Administration <img width="300" height="159" src="https://linuxconfig.org/wp-content/uploads/2024/11/00-introduction-to-the-findmnt-command-300x159.avif" class="attachment-medium size-medium wp-post-image" alt="Introduction to the findmnt command" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/00-introduction-to-the-findmnt-command-300x159.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/00-introduction-to-the-findmnt-command-1024x541.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/00-introduction-to-the-findmnt-command-768x406.avif 768w, https://linuxconfig.org/wp-content/uploads/2024/11/00-introduction-to-the-findmnt-command.avif 1200w" sizes="(max-width: 300px) 100vw, 300px" /> Findmnt Command: Querying Filesystems in Linux Made Easy 2 December 2024 by Egidio Docile Findmnt is a free and open source utility usually included in the core packages of all the major Linux distributions. It is able to list all mounted filesystems or retrieve data for only those we specify. In this tutorial, we learn how to use findmnt, and how to query filesystems by type, mount options and other parameters. Read more Categories Commands, System Administration'
