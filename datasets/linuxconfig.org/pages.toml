title = "How to install missing ifconfig command on Linux - LinuxConfig"
description = "Most of us longtime Linux users have the command seared into our brain, after years of repetitive use. It comes as a shock to some when they type the command and are met with an error message…"
full_description = '''How to install missing ifconfig command on Linux 11 October 2024 by Luke Reynolds Most of us longtime Linux users have the ifconfig command seared into our brain, after years of repetitive use. It comes as a shock to some when they type the command and are met with an error message (ifconfig command not found). Indeed, the command has become deprecated, but it’s still possible to install the ifconfig command. The newer alternative is the ip command, which has new functions but also a different syntax that takes some getting used to. In this tutorial, you will see how to install ifconfig command on Debian based and Red Hat based Linux distributions, as well as how to use the newer ip a command, which is meant to replace ifconfig. In this tutorial you will learn: How to install the ifconfig command on Linux How to use the ip a command Installing and using the ifconfig command on Linux Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Ubuntu, Debian, CentOS, RHEL, Kali Software net-tools Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Install missing ifconfig command – ifconfig command not found Video <img src="https://i.ytimg.com/vi/eebp7l8rMLE/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe title="YouTube video player" src="https://www.youtube.com/embed/eebp7l8rMLE" width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"><span data-mce-type="bookmark" style="display: inline-block; width: 0px; overflow: hidden; line-height: 0;" class="mce_SELRES_start">﻿</span></iframe> DID YOU KNOW? The ifconfig is deprecated. We highly recommend that you eventually grow accustomed to its replacement, the ip command. Eventually all of us must adopt the newer conventions and leave behind old commands. We will show you how to use ip in this tutorial. Don’t worry, it’s easy! The ifconfig command has been deprecated and thus missing by default on some modern Linux distributions. You will receive a message “ifconfig command not found” if you try to use it. $ ifconfig -bash: ifconfig: command not found The new and recommended alternative for examining a network configuration on Linux is with the ip command. For example, to use ip command to display a network configuration, run the following: $ ip address The above ip command can be abbreviated to: $ ip a If you still prefer to use ifconfig as part of your daily sysadmin routine, you can easily install ifconfig as part of the net-tools package. On Debian based distros: $ sudo apt update $ sudo apt install net-tools On Red Hat based distros: $ sudo dnf install net-tools The ifconfig command is now available: <img decoding="async" class="size-full wp-image-11909" src="https://linuxconfig.org/wp-content/uploads/2017/01/01-how-to-install-missing-ifconfig-command-on-debian-linux.avif" alt="Installing and using the ifconfig command on Debian" width="1200" height="605" />Installing and using the ifconfig command on Debian Closing Thoughts In this tutorial, we saw how to install the ifconfig command on Debian based and Red Hat based Linux systems. Even though the command has been deprecated and there is a new successor, there is no harm in still using the old command if you find that it’s a habit which is difficult to break. The ip command is actually much more flexible and capable of some new things, so eventually you will find yourself using it as well. Related Linux Tutorials:Best Linux Distro: How to Choose Guide for Every UserLinux commands: Top 20 most important commands you…Basic Linux CommandsMastering Bash Script LoopsSolving the 'Command Not Found' Error on LinuxMastering String Concatenation in Bash ScriptingHow to install Arch Linux alongside Ubuntu (Dual Boot)Ultimate Web Server Benchmark: Apache, NGINX,…Bash Scripting: Mastering Arithmetic OperationsHow to install Arch Linux alongside Windows 11 (Dual Boot) Categories Commands Tags commands, installation, networking, terminal Raspbian GNU/Linux upgrade from Jessie to Raspbian Stretch 9How to install Docker engine on Debian 9 Stretch Linux'''
author = "Luke Reynolds"
