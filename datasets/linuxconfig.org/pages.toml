title = "How to Install Pi-hole Server on Linux - LinuxConfig"
description = "Pi-hole is a powerful network-level advertisement and Internet tracker blocking application that acts as a DNS sinkhole. It is lightweight and can run on most Linux-based systems…"
full_description = '''How to Install Pi-hole Server on Linux 29 January 2025 by Lubos Rendek Pi-hole is a powerful network-level advertisement and Internet tracker blocking application that acts as a DNS sinkhole. It is lightweight and can run on most Linux-based systems, offering an efficient way to block ads across all devices on your network. This guide walks you through the step-by-step process of installing Pi-hole on your Linux server. In this tutorial, you will learn: How to prepare your Linux server for Pi-hole installation How to install and configure Pi-hole How to set up and use the Pi-hole dashboard How to Install Pi-hole Server on Linux Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Linux server with a static IP address Software Pi-hole, Git Other Root or sudo privileges Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Step-by-Step Guide to Installing Pi-hole on Linux Video Tutorial <img src="https://i.ytimg.com/vi/AMKEktNvtmM/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe title="Install Pi.Hole on Linux Tutorial" src="https://www.youtube.com/embed/AMKEktNvtmM " width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"></iframe> Follow the steps below to set up and use Pi-hole on your Linux server. Ensure Your Server Has a Static IP Address: Pi-hole requires a static IP address to function correctly. Configure your Linux server with a static IP address by editing your network configuration files. For example, to set an IP address of 172.16.1.74 with a subnet mask of /24, you can use the following configuration: # Example configuration in /etc/network/interfaces iface eth0 inet static address 172.16.1.74 netmask 255.255.255.0 gateway 172.16.1.1 Alternatively, if you manage your network via a router, you can use a DHCP static map to assign the server a static IP address. This approach links the server’s MAC address to a specific IP address, ensuring consistency without manually configuring the server. Setting a static IP ensures that your Pi-hole DNS server remains accessible to your network devices. Install Prerequisites: Before installing Pi-hole, ensure you have Git installed on your Linux server. $ sudo apt update $ sudo apt install git This installs the Git package, which is required to download the Pi-hole installation scripts. Install Pi-hole: Clone the Pi-hole repository and run the installer. $ git clone --depth 1 https://github.com/pi-hole/pi-hole.git Pi-hole $ cd "Pi-hole/automated install/" $ sudo bash basic-install.sh This command downloads the Pi-hole setup scripts and initiates the installation wizard. Follow the Installation Wizard: The wizard will guide you through the configuration of Pi-hole. During this process, you will: Choose the DNS provider (e.g., Google, OpenDNS, Cloudflare) (ANY WILL DO) <img decoding="async" class="size-full wp-image-24660" src="https://linuxconfig.org/wp-content/uploads/2025/01/01-how-to-install-pi-hole-server-on-linux-image.avif" alt="Choose the DNS provider" width="1200" height="744" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/01-how-to-install-pi-hole-server-on-linux-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/01-how-to-install-pi-hole-server-on-linux-image-300x186.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/01-how-to-install-pi-hole-server-on-linux-image-1024x635.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/01-how-to-install-pi-hole-server-on-linux-image-768x476.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Choose the DNS provider Set default list (YES) <img decoding="async" class="size-full wp-image-24659" src="https://linuxconfig.org/wp-content/uploads/2025/01/02-how-to-install-pi-hole-server-on-linux-image.avif" alt="Default list selection" width="1200" height="631" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/02-how-to-install-pi-hole-server-on-linux-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/02-how-to-install-pi-hole-server-on-linux-image-300x158.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/02-how-to-install-pi-hole-server-on-linux-image-1024x538.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/02-how-to-install-pi-hole-server-on-linux-image-768x404.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Default list selection Set up the web interface and logging (YES) Note the generated admin password <img decoding="async" class="size-full wp-image-24658" src="https://linuxconfig.org/wp-content/uploads/2025/01/03-how-to-install-pi-hole-server-on-linux-image.avif" alt="Pi-hole installation is now completed." width="1200" height="676" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/03-how-to-install-pi-hole-server-on-linux-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/03-how-to-install-pi-hole-server-on-linux-image-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/03-how-to-install-pi-hole-server-on-linux-image-1024x577.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/03-how-to-install-pi-hole-server-on-linux-image-768x433.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Pi-hole installation is now completed. Set Your DNS to Point to Pi-hole: Configure your devices or DHCP server to use the Pi-hole server as the DNS resolver. For individual devices, update the /etc/resolv.conf file: # Example to set DNS server nameserver 172.16.1.74 <img decoding="async" class="size-full wp-image-24657" src="https://linuxconfig.org/wp-content/uploads/2025/01/04-how-to-install-pi-hole-server-on-linux-image.avif" alt="Configure DNS service for your system" width="1200" height="697" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/04-how-to-install-pi-hole-server-on-linux-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/04-how-to-install-pi-hole-server-on-linux-image-300x174.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/04-how-to-install-pi-hole-server-on-linux-image-1024x595.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/04-how-to-install-pi-hole-server-on-linux-image-768x446.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Configure DNS service for your system Alternatively, configure your router’s DHCP settings to assign Pi-hole’s IP address as the default DNS server for all devices on the network. Access the Pi-hole Web Dashboard: Open your browser and navigate to the Pi-hole web interface: http://pi.hole/admin Log in using the password provided by the installation wizard. This dashboard allows you to monitor blocked requests, customize blocklists, and configure additional settings. Test and Verify: Browse some websites and check the Pi-hole dashboard for blocked requests. You should notice a significant reduction in ads. If the dashboard shows blocked requests, your Pi-hole setup is successful. <img decoding="async" class="size-full wp-image-24656" src="https://linuxconfig.org/wp-content/uploads/2025/01/05-how-to-install-pi-hole-server-on-linux-image.avif" alt="pi-hole is blocking ad requests" width="1200" height="675" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/05-how-to-install-pi-hole-server-on-linux-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/05-how-to-install-pi-hole-server-on-linux-image-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/05-how-to-install-pi-hole-server-on-linux-image-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/05-how-to-install-pi-hole-server-on-linux-image-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />pi-hole is blocking ad requests Conclusion Installing Pi-hole on a Linux server is a straightforward process that can significantly enhance your browsing experience by blocking ads and trackers at the network level. With its powerful web interface and customization options, Pi-hole is an excellent choice for maintaining a clean and efficient online environment. Related Linux Tutorials:Best Linux Distro: How to Choose Guide for Every UserBest Small Linux Distros for 2024An Introduction to Linux Automation, Tools and TechniquesUltimate Web Server Benchmark: Apache, NGINX,…Mastering Bash Script LoopsAutomate Dynamic IP Updates for Your Domain with…How to create and share torrent on LinuxThings to do after installing Ubuntu 22.04 Jammy…How to check Internet connection on Raspberry PiCan Linux Get Viruses? Exploring the Vulnerability… Categories System Administration Tags administration, install, multimedia, server Create a Desktop Shortcut for Terminal on Linux Mintbash: ping: command not found: How to Install on Linux Comments and Discussions<img src="https://linuxconfig.org/wp-content/uploads/2024/04/linuxconfig-forum-logo-1.webp" alt="Linux Forum" width="250" height="46"> DiscourseEmbed = { discourseUrl: 'https://forum.linuxconfig.org/', discourseEmbedUrl: document.querySelector("link[rel='canonical']").getAttribute("href") }; (function() { var d = document.createElement('script'); d.type = 'text/javascript'; d.async = true; d.src = DiscourseEmbed.discourseUrl + 'javascripts/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(d); })();'''
