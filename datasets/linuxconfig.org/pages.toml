title = "How to Install Google Chrome Browser on Linux Mint - LinuxConfig"
description = "Google Chrome is one of the most popular web browsers, known for its speed, reliability, and extensive ecosystem of extensions. In this guide, we will walk you through the detailed steps to install…"
full_description = '''How to Install Google Chrome Browser on Linux Mint 21 January 2025 by Lubos Rendek Google Chrome is one of the most popular web browsers, known for its speed, reliability, and extensive ecosystem of extensions. In this guide, we will walk you through the detailed steps to install Google Chrome on Linux Mint, ensuring you have access to all its features and functionality. For other Linux distributions visit our Google Chrome on Linux installation page. In this tutorial you will learn: How to download the Google Chrome .deb package How to install the downloaded package using the terminal How to launch Google Chrome after installation How to Install Google Chrome Browser on Linux Mint Software Requirements and Linux Command Line Conventions Category Requirements, Conventions, or Software Version Used System Linux Mint 22 or later Software Google Chrome Browser .deb package Other Stable internet connection Conventions # – requires given Linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given Linux commands to be executed as a regular non-privileged user Steps to Install Google Chrome on Linux Mint Video <img src="https://i.ytimg.com/vi/6MSMZfBq_7M/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe title="Install Chrome Browser on Linux Mint" src="https://www.youtube.com/embed/6MSMZfBq_7M" width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"></iframe> Follow these steps to install Google Chrome browser on Linux Mint: Download the Google Chrome .deb Package: Start by opening your existing web browser and navigating to the official Google Chrome download page. Select the version for Linux (Debian/Ubuntu-based distributions) and download the .deb package. https://www.google.com/chrome/ This step ensures that you have the installation file needed to install Google Chrome on your system. <img decoding="async" class="size-full wp-image-24624" src="https://linuxconfig.org/wp-content/uploads/2025/01/01-install-chrome-on-linux-mint-image.avif" alt="Download the Google Chrome .deb Package" width="1200" height="827" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/01-install-chrome-on-linux-mint-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/01-install-chrome-on-linux-mint-image-300x207.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/01-install-chrome-on-linux-mint-image-1024x706.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/01-install-chrome-on-linux-mint-image-768x529.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Download the Google Chrome .deb Package Update Package Indexes: Open your terminal and update the package indexes to ensure your system is up to date. $ sudo apt update Keeping the package index updated helps avoid issues during the installation process. Install the Google Chrome Package: Navigate to the directory where the .deb file was downloaded (typically the Downloads folder) and install the package using the following command: $ sudo apt install ./google-chrome-stable_current_amd64.deb This command installs the Google Chrome browser on your system. <img decoding="async" class="size-full wp-image-24623" src="https://linuxconfig.org/wp-content/uploads/2025/01/02-install-chrome-on-linux-mint-image.avif" alt="Install the Google Chrome Package" width="1200" height="677" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/02-install-chrome-on-linux-mint-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/02-install-chrome-on-linux-mint-image-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/02-install-chrome-on-linux-mint-image-1024x578.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/02-install-chrome-on-linux-mint-image-768x433.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Install the Google Chrome Package Launch Google Chrome: Once the installation is complete, you can log out and log back in to ensure all configurations are updated. Then, use the Start menu to search for “Google Chrome” and launch the browser. This step confirms that the installation was successful and allows you to start using Google Chrome immediately. <img decoding="async" class="size-full wp-image-24622" src="https://linuxconfig.org/wp-content/uploads/2025/01/03-install-chrome-on-linux-mint-image.avif" alt="Launch Google Chrome" width="1200" height="679" srcset="https://linuxconfig.org/wp-content/uploads/2025/01/03-install-chrome-on-linux-mint-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2025/01/03-install-chrome-on-linux-mint-image-300x170.avif 300w, https://linuxconfig.org/wp-content/uploads/2025/01/03-install-chrome-on-linux-mint-image-1024x579.avif 1024w, https://linuxconfig.org/wp-content/uploads/2025/01/03-install-chrome-on-linux-mint-image-768x435.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Launch Google Chrome Conclusion By following the steps outlined above, you can successfully install Google Chrome on your Linux Mint system. With its powerful features and seamless performance, Google Chrome will enhance your browsing experience. Remember to keep the browser updated to benefit from the latest features and security patches. Related Linux Tutorials:Best Linux Distro: How to Choose Guide for Every UserHow to install Google Chrome web browser on Ubuntu…List of Browsers available on LinuxTop 10 Best Gnome extensions for Ubuntu 22.04 DesktopThings to install on Ubuntu 22.04An Introduction to Linux Automation, Tools and TechniquesUltimate Web Server Benchmark: Apache, NGINX,…Exploring the Foundations of Linux: A Look at Major…Install DEB file on Ubuntu 22.04 Jammy Jellyfish LinuxThings to do after installing Ubuntu 22.04 Jammy… Categories Multimedia, Games and Crypto Tags administration, brow, installation, multimedia How to Install Safari Browser on LinuxCreate a Desktop Shortcut for Terminal on Linux Mint Comments and Discussions<img src="https://linuxconfig.org/wp-content/uploads/2024/04/linuxconfig-forum-logo-1.webp" alt="Linux Forum" width="250" height="46"> DiscourseEmbed = { discourseUrl: 'https://forum.linuxconfig.org/', discourseEmbedUrl: document.querySelector("link[rel='canonical']").getAttribute("href") }; (function() { var d = document.createElement('script'); d.type = 'text/javascript'; d.async = true; d.src = DiscourseEmbed.discourseUrl + 'javascripts/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(d); })();'''
