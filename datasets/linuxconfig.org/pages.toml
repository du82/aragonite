title = "Author: Egidio Docile - Page 2 - LinuxConfig"
full_description = 'SSH Tunnels: Secure Remote Access and Port Forwarding 3 June 2024 by Egidio Docile SSH is a communication protocol that allows us to access remote hosts and securely transfer data over unsecure networks, thanks to encrypted connections. By using the SSH tunneling technique, we can forward TCP traffic from and to a local machine, bypassing firewall restrictions. In this tutorial, we learn the difference between local and remote SSH tunnels, and how to create them. Read more Categories Guides, System Administration <img width="300" height="200" src="https://linuxconfig.org/wp-content/uploads/2024/05/00-introduction-to-immich-300x200.avif" class="attachment-medium size-medium wp-post-image" alt="Introduction to Immich" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/05/00-introduction-to-immich-300x200.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/05/00-introduction-to-immich-1024x683.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/05/00-introduction-to-immich-768x512.avif 768w, https://linuxconfig.org/wp-content/uploads/2024/05/00-introduction-to-immich.avif 1200w" sizes="(max-width: 300px) 100vw, 300px" /> Self-Host Immich: Open Source Google Photos Alternative 31 May 2024 by Egidio Docile Immich is a free and open source alternative to Google Photos, with a focus on privacy. Both the server software and the mobile client application, are developed in the open on GitHub. Thanks to the container technology, deploying a private, self-hosted instance of Immich is quite easy. In this tutorial, we learn how to run a self-hosted Immich instance using Docker, to manage and backup our photos and videos. Read more Categories Guides <img width="300" height="200" src="https://linuxconfig.org/wp-content/uploads/2024/05/00-how-to-manage-files-on-cloud-storage-with-rclone-on-linux-300x200.avif" class="attachment-medium size-medium wp-post-image" alt="How to manage files on cloud storage with Rclone on Linux" itemprop="image" decoding="async" srcset="https://linuxconfig.org/wp-content/uploads/2024/05/00-how-to-manage-files-on-cloud-storage-with-rclone-on-linux-300x200.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/05/00-how-to-manage-files-on-cloud-storage-with-rclone-on-linux-1024x683.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/05/00-how-to-manage-files-on-cloud-storage-with-rclone-on-linux-768x512.avif 768w, https://linuxconfig.org/wp-content/uploads/2024/05/00-how-to-manage-files-on-cloud-storage-with-rclone-on-linux.avif 1200w" sizes="(max-width: 300px) 100vw, 300px" /> How to manage files on cloud storage with Rclone on Linux 26 May 2024 by Egidio Docile Rclone is a free and open source command line program to manage files on cloud storage services like Google Drive, Backblaze B2, Amazon S3, and many more. The application is written in the Go programming language, and its source code is hosted on GitHub. In this tutorial we learn how to install Rclone on the most used Linux distributions, and how to perform basics operations like copying, syncing, moving and deleting data. In the process, we also see how to obtain Google Drive API credentials, and how to configure a Google Drive remote for Rclone. Read more Categories Guides, System Administration'
