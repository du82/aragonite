["https://linuxconfig.org/how-to-install-tar-gz-file-on-linux"]
title = "How to install tar.gz file on Linux - LinuxConfig"
description = "The file format is a tar archive that has been compressed with gunzip compression. These archives are designed to be opened on Linux systems and can contain any type of files within them. Sometimes…"
full_description = '''How to install tar.gz file on Linux 2 September 2024 by Korbin Brown The .tar.gz file format is a tar archive that has been compressed with gunzip compression. These archives are designed to be opened on Linux systems and can contain any type of files within them. Sometimes, software comes packaged in a .tar.gz file, and users can extract its contents in order to install what is inside. Normally, software comes in the form of a compressed archive whenever it is to be compiled from source. Whereas distributable binaries are normally installed through other means, such as via the system’s package manager. In this tutorial, we will go over the step by step instructions to install software from a .tar.gz file on a Linux system. In this tutorial you will learn: How to extract content from a compressed tar file How to install prerequisite packages to build from source How to configure, make, and install source files How to install tar.gz file on Linux Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Any Linux distro Software tar, gzip, development tools Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user <img src="https://i.ytimg.com/vi/efeT_an8aks/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe title="YouTube video player" src="https://www.youtube.com/embed/efeT_an8aks" width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"><span data-mce-type="bookmark" style="display: inline-block; width: 0px; overflow: hidden; line-height: 0;" class="mce_SELRES_start"></span></iframe> Install prerequisites To install software from a compressed archive, we will need the proper tools to extract the files and to compile the source code. We can use our system’s package manager to install these tools by executing the appropriate command below. To install tar extraction and compiling tools on Ubuntu, Debian, and Linux Mint: $ sudo apt update $ sudo apt install tar gzip build-essential To install tar extraction and compiling tools on Fedora, CentOS, AlmaLinux, and Red Hat: $ sudo dnf groups mark install "Development Tools" $ sudo dnf groupinstall "Development Tools" $ sudo dnf install tar gzip To install tar extraction and compiling tools on Arch Linux and Manjaro: $ sudo pacman -Sy base-devel tar gzip Install software from .tar.gz WARNINGThe recommended way to install software from source is to check the README file or official website for instructions. They may tell you to execute certain commands or include particular options, and may also reveal other prerequisite packages that are needed for installation in addition to the ones we showed you above. With the disclaimer above out of the way, keep in mind that different packages may require a different set of instructions for installation. We will run through the most general steps that the majority of software packages follow for installation: Start by extracting the contents of your archive. $ tar xf software-name.tar.gz Change into the extracted directory, and see if there is a file that we can execute named configure. If so, execute it and follow the instructions on screen (if any). $ ./configure Next, use the make command to build and compile the software from the included source code files: $ make Then, to install the software on your system, run the following command. This part will require root permissions as we are installing software on the system. $ sudo make install These are general instructions that most programs follow for installation. But please note that the developer may have special instructions that need to be followed in order for the program to function as expected. It is impossible for us to predict exactly how to install your specific .tar.gz file that you have downloaded, so use the instructions above only as a general guide. Closing Thoughts In this tutorial, we saw how to install software from a .tar.gz archive on a Linux system. Software source files are normally distributed this way, and require the user to build and compile the code before finally installing it on the system. Various software will require a unique set of instructions, but in general, most software installation will follow the steps shown above, and sometimes with slight differences that may or may not have an impact on the final result. Definitely make sure you consult the readme file or official instructions for the exact process. Related Linux Tutorials:Introduction to Borg BackupConverting Images to AVIF on Linux, Including JPG,…Best Linux Distro: How to Choose Guide for Every UserHow to create incremental and differential backups with tarHow to format USB with exFAT on LinuxHow to extract text from imageGranting Full User Rights to a Folder and Its…Ultimate Web Server Benchmark: Apache, NGINX,…How to install, configure and customize Waybar on LinuxAn Introduction to Linux Automation, Tools and Techniques Categories System Administration Tags administration, installation, multimedia, terminal How to setup Linux Apache Mysql Python serverGraphical user interface (GUI) applications for managing MySQL Comments and Discussions<img src="https://linuxconfig.org/wp-content/uploads/2024/04/linuxconfig-forum-logo-1.webp" alt="Linux Forum" width="250" height="46"> DiscourseEmbed = { discourseUrl: 'https://forum.linuxconfig.org/', discourseEmbedUrl: document.querySelector("link[rel='canonical']").getAttribute("href") }; (function() { var d = document.createElement('script'); d.type = 'text/javascript'; d.async = true; d.src = DiscourseEmbed.discourseUrl + 'javascripts/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(d); })();'''
