title = "How to Secure GRUB Boot Loader with Password - LinuxConfig"
description = "The GRUB boot loader plays a critical role in booting Linux systems, serving as the first program executed when the computer starts. Securing GRUB with a password can prevent unauthorized users from…"
full_description = '''How to Secure GRUB Boot Loader with Password 4 December 2024 by Lubos Rendek The GRUB boot loader plays a critical role in booting Linux systems, serving as the first program executed when the computer starts. Securing GRUB with a password can prevent unauthorized users from tampering with boot parameters or gaining root access to the system. This is especially important for systems that require heightened security. In this tutorial you will learn: How to set a secure password for GRUB How to update GRUB configuration to enforce password protection How to Secure GRUB Boot Loader with Password Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System A Linux-based system using GRUB (e.g., Ubuntu, Debian) Software GRUB bootloader Other Administrative/root privileges Conventions # – requires given Linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given Linux commands to be executed as a regular non-privileged user How to Secure GRUB with a Password Video <img src="https://i.ytimg.com/vi/p4zZI6Svrwo/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe title="How to Secure GRUB Boot Loader with Password" src="https://www.youtube.com/embed/p4zZI6Svrwo" width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"></iframe> Follow these detailed steps to secure the GRUB bootloader with a password and protect your system’s boot parameters from unauthorized access. Generate a GRUB Password: First, create a secure password hash that will be used for authentication by GRUB. sudo grub-mkpasswd-pbkdf2 After running the above command, you will be prompted to enter and confirm a password. The command will then output a hashed version of your password of your current user, which looks something like this: PBKDF2 hash of your password is grub.pbkdf2.sha512.10000.xxxxxxxxxxxxxxxxxxx Copy the entire hash, as it will be required in the next step. <img decoding="async" class="size-full wp-image-24587" src="https://linuxconfig.org/wp-content/uploads/2024/12/01-how-to-secure-grub-boot-loader-with-password-image.avif" alt="Generate a GRUB Password" width="1200" height="675" srcset="https://linuxconfig.org/wp-content/uploads/2024/12/01-how-to-secure-grub-boot-loader-with-password-image.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/12/01-how-to-secure-grub-boot-loader-with-password-image-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/12/01-how-to-secure-grub-boot-loader-with-password-image-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/12/01-how-to-secure-grub-boot-loader-with-password-image-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Generate a GRUB Password Edit GRUB Configuration: Next, update the GRUB configuration to include the new password. This involves modifying the custom GRUB settings file. sudo nano /etc/grub.d/40_custom Add the following lines to the file, replacing your_username with your desired username and [your_generated_hash] with the password hash generated in the previous step: set superusers="your_username" password_pbkdf2 your_username [your_generated_hash] Save and exit the file by pressing CTRL+O, followed by CTRL+X. <img decoding="async" class="size-full wp-image-24588" src="https://linuxconfig.org/wp-content/uploads/2024/12/02-how-to-secure-grub-boot-loader-with-password-image.avif" alt="Edit GRUB configuration with a password" width="1136" height="742" srcset="https://linuxconfig.org/wp-content/uploads/2024/12/02-how-to-secure-grub-boot-loader-with-password-image.avif 1136w, https://linuxconfig.org/wp-content/uploads/2024/12/02-how-to-secure-grub-boot-loader-with-password-image-300x196.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/12/02-how-to-secure-grub-boot-loader-with-password-image-1024x669.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/12/02-how-to-secure-grub-boot-loader-with-password-image-768x502.avif 768w" sizes="(max-width: 1136px) 100vw, 1136px" />Edit GRUB configuration with a password Update GRUB: To apply the changes made to the configuration, update GRUB by running the following command: sudo update-grub This command ensures that the new password settings are included in the GRUB configuration. Once complete, your GRUB bootloader is secured with a password. Confirm the new GRUB password protection settings by rebooting your Linux system. Conclusion By following these steps, you have successfully secured your GRUB bootloader with a password. This additional layer of security helps prevent unauthorized access to boot parameters and protects your system from potential misuse. Always remember to keep your GRUB password secure, as losing it could complicate access to your system. Related Linux Tutorials:Introduction to Ansible rolesBest Linux Distro: How to Choose Guide for Every UserUbuntu 22.04 not booting: Troubleshooting GuideLinux Configuration files: Top 30 most importantHow to set kernel boot parameters on LinuxHow to Install and Secure MariaDB on Ubuntu 24.04How to install Arch Linux alongside Ubuntu (Dual Boot)Container Security Best Practices: Securing DockerCan Linux Get Viruses? Exploring the Vulnerability…Advanced Logging and Auditing on Linux Categories System Administration Tags boot, grub, secure boot, security How to Install KDE Plasma on Linux MintHow to Install Safari Browser on Linux Comments and Discussions<img src="https://linuxconfig.org/wp-content/uploads/2024/04/linuxconfig-forum-logo-1.webp" alt="Linux Forum" width="250" height="46"> DiscourseEmbed = { discourseUrl: 'https://forum.linuxconfig.org/', discourseEmbedUrl: document.querySelector("link[rel='canonical']").getAttribute("href") }; (function() { var d = document.createElement('script'); d.type = 'text/javascript'; d.async = true; d.src = DiscourseEmbed.discourseUrl + 'javascripts/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(d); })();'''
