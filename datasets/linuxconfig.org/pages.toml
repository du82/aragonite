title = "How to enable/disable wayland on Ubuntu Desktop - LinuxConfig"
description = "Wayland is a communication protocol that specifies the communication between a display server and its clients. On Ubuntu, users can choose to enable or disable Wayland according to their needs."
full_description = 'How to enable/disable wayland on Ubuntu Desktop 18 April 2024 by Korbin Brown Wayland is a communication protocol that specifies the communication between a display server and its clients. On Ubuntu, users can choose to enable or disable Wayland according to their needs. By default, Ubuntu’s desktop environment runs on Wayland, but it is also possible to switch to the Xorg display server. This tutorial will demonstrate how to enable and disable Wayland on the Ubuntu desktop. Reasons for using Xorg instead of Wayland are if you are encountering graphical errors or performance issues while using Wayland. Wayland does not always play nicely with every kind of software. Xorg is the safe fall back choice whenever you are having problems with Wayland. Since both are included on Ubuntu and installed by default, it is relatively easy to switch back and forth between them. In this tutorial you will learn: How to enable Wayland How to disable Wayland How to enable/disable wayland on Ubuntu Desktop Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Ubuntu 18.04, 20.04, 22.04, 24.04 Desktop Software GNOME desktop environment, Wayland Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user How to enable/disable wayland on Ubuntu Desktop step by step instructions DID YOU KNOW? Users may want to enable or disable Wayland due to application compatibility. Some applications still lack support for Wayland, so Ubuntu gives users the option to enable X display server to resolve these types of issues. The default display manager for the GNOME desktop environment is GDM3. Therefore, we will edit the /etc/gdm3/custom.conf file to either disable or enable Wayland. Open a command line terminal and use nano or your favorite text editor to open this file with root permissions. $ sudo nano /etc/gdm3/custom.conf Within this file, look for the line that says #WaylandEnable=false. You can uncomment this line and either set it to true or false, depending on whether you want Wayland enabled or not.Enable Wayland: WaylandEnable=true Or disable Wayland: WaylandEnable=false <img decoding="async" class="size-full wp-image-12879" src="https://linuxconfig.org/wp-content/uploads/2022/01/01-how-to-enable-disable-wayland-on-ubuntu-22-04-desktop.avif" alt="Editing the Wayland settings inside the GDM3 configuration file" width="1200" height="671" />Editing the Wayland settings inside the GDM3 configuration file After you have made the desired changes, save this file and exit it. You will need to restart GDM3 or reboot your Ubuntu desktop for the changes to take effect. $ sudo systemctl restart gdm3 To login to Ubuntu Desktop using the Wayland click on the gear button and select Ubuntu option before you login. If you have disabled the Wayland display server, you will only see the Xorg option appear, or the gear button doesn’t show up at all. UBUNTU WAYLAND VS X11 Ubuntu supports two display server protocols: Xorg and Wayland. Xorg is the older, traditional server known for broad compatibility but is less secure and efficient compared to modern standards. Wayland, introduced as the default in Ubuntu 17.10, simplifies this model by handling rendering through clients, enhancing performance, reducing latency, and improving security by isolating applications. However, Wayland can face compatibility issues with older software, necessitating occasional fallbacks to Xorg. This transition highlights Ubuntu’s move towards a more secure and robust user experience while maintaining support for a wide range of applications. <img decoding="async" class="wp-image-12878 size-full" src="https://linuxconfig.org/wp-content/uploads/2022/01/02-how-to-enable-disable-wayland-on-ubuntu-22-04-desktop.avif" alt="Login to Ubuntu using Wayland display server" width="1200" height="671" />Login to Ubuntu using Wayland display server Conclusion In this tutorial, we saw how to enable or disable the Wayland communication protocol in Ubuntu Desktop Linux. Having more than one option is a good thing for Linux users, as they all have their pros and cons and one may work better with a certain configuration than another. By offering both Xorg and Wayland, Ubuntu ensures that users can choose the most suitable environment based on their specific hardware and software needs. This flexibility not only enhances user satisfaction but also broadens Ubuntu’s appeal as a versatile and adaptable operating system. Whether prioritizing performance and security with Wayland or ensuring maximum compatibility with Xorg, users can tailor their setup to provide the optimal desktop experience. Related Linux Tutorials:Ultimate Web Server Benchmark: Apache, NGINX,…Ubuntu 22.04: List of torrent clientsBest Linux Distro: How to Choose Guide for Every UserComparing Linux Apache Prefork vs Worker MPMsHow often do you have to reboot your Linux server?Things to do after installing Ubuntu 22.04 Jammy…Mastering Bash Script LoopsHow to Use X instead of Wayland on Ubuntu 22.04?FTP client list and installation on Ubuntu 22.04…How to play Movies on Raspberry Pi Categories Ubuntu Tags administration, desktop, gnome, ubuntu How to install Gnome Shell Extensions on Ubuntu 22.04 Jammy Jellyfish Linux DesktopHow to install and manage fonts on Linux'
author = "Korbin Brown"
