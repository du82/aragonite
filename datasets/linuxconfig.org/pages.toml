title = "How to use curl to get public IP address - LinuxConfig"
description = "The curl command on Linux systems is commonly used to download and upload files to or from a remote server. Another interesting thing we can use it for is to determine the public IP address of our…"
full_description = '''How to use curl to get public IP address 8 January 2024 by Korbin Brown The curl command on Linux systems is commonly used to download and upload files to or from a remote server. Another interesting thing we can use it for is to determine the public IP address of our system. To do this, we can use curl to query websites that are configured to do nothing more than return the IP address of whichever system is connecting to it. This is one of the quickest and easiest ways to get your public IP address on the Linux command line. In this tutorial, you will see how to use the curl command to get your system’s public IP address. In this tutorial you will learn: How to install curl on major Linux distros How to use curl to get public IP address How to use curl to get public IP address Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Any Linux distro Software curl Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Install curl Although curl is a common utility, it’s not included on every single Linux distro. Specifically, it may be missing from more desktop oriented distros. Just in case it’s not already installed, you can use the appropriate command below to install it through your system’s package manager. To install curl on Ubuntu, Debian, and Linux Mint: $ sudo apt install curl To install curl on CentOS, Fedora, AlmaLinux, and Red Hat: $ sudo dnf install curl To install curl on Arch Linux and Manjaro: $ sudo pacman -S curl Use curl to get public IP address There are many websites that have been configured to show someone’s public IP address. Use one or more of the following examples below to determine yours. This site will also work with the -4 or -6 curl options, if you need to retrieve your IPv4 or IPv6 address specifically. $ curl icanhazip.com OR $ curl -4 icanhazip.com OR $ curl -6 icanhazip.com $ curl ifconfig.me $ curl api.ipify.org $ curl bot.whatismyipaddress.com $ curl ipinfo.io/ip $ curl ipecho.net/plain <img width="1365" height="761" decoding="async" src="https://linuxconfig.org/wp-content/uploads/2021/04/01-how-to-use-curl-to-get-public-ip-address.avif" alt="Using curl to get public IP address on the Linux command line"> Using curl to get public IP address on the Linux command line Of course, other sites also exist that can do the same thing, but these should be enough to cover your needs. In the future, some sites may stop working and new ones will fill their place, so keep in mind that any website on the list may not be permanent. Closing Thoughts In this guide, we saw how to retrieve the public IP address of a system by using curl on the Linux command line. This relies on third party public websites to show us our IP address, but it proves to be one of the quickest and easiest ways to see our public IP on the command line. Related Linux Tutorials:Ultimate Web Server Benchmark: Apache, NGINX,…How to manage files on cloud storage with Rclone on LinuxSetup FTP server on LinuxBest Linux Distro: How to Choose Guide for Every UserConnecting Your Raspberry Pi to Wi-Fi: A How-ToAn Introduction to Linux Automation, Tools and TechniquesBasic Linux CommandsHow to query NTP serverLinux commands: Top 20 most important commands you…How to mount a remote filesystem over SSH with sshfs Categories System Administration Tags bash, beginner, commands, server How to append to file on bash shell command lineExamples on how to use xargs command on Linux Comments and Discussions<img src="https://linuxconfig.org/wp-content/uploads/2024/04/linuxconfig-forum-logo-1.webp" alt="Linux Forum" width="250" height="46"> DiscourseEmbed = { discourseUrl: 'https://forum.linuxconfig.org/', discourseEmbedUrl: document.querySelector("link[rel='canonical']").getAttribute("href") }; (function() { var d = document.createElement('script'); d.type = 'text/javascript'; d.async = true; d.src = DiscourseEmbed.discourseUrl + 'javascripts/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(d); })();'''
