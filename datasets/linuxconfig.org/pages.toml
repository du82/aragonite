["https://linuxconfig.org/how-to-configure-static-ip-address-on-ubuntu-18-04-bionic-beaver-linux"]
title = "Netplan static IP on Ubuntu configuration - LinuxConfig"
description = "In this tutorial, we will discuss a netplan static IP configuration on Ubuntu Linux. Netplan allows for straightforward network IP address configuration using human-readable data-serialization…"
full_description = '''Netplan static IP on Ubuntu configuration 30 April 2024 by Lubos Rendek In this tutorial, we will discuss a netplan static IP configuration on Ubuntu Linux. Netplan allows for straightforward network IP address configuration using human-readable data-serialization language YAML. The article will also discuss a default Netplan network settings and the location of the Netplan configuration file. You have two options when configuring the IP address on your Ubuntu system, and that is either a static IP address or DHCP. A static IP address allows you to manually select your IP address by configuring it on the Linux system, whereas DHCP relies on the router or DHCP server to lease you an IP address – either a reserved one or the next available one that is currently free, depending on the setup. In this tutorial you will learn how to: Use netplan to set static IP on Ubuntu Server Configure netplan to set static IP on Ubuntu Server Netplan static ip on Ubuntu configuration Software Requirements and Conventions Used Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Any version of Ubuntu Linux system Software Netplan.io Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Configure static IP address using Netplan Netplan network configuration had been first introduced starting from Ubuntu 18.04, hence Netplan is available to all new Ubuntu from this version and higher. Ubuntu uses Netplan to configure static IP addesses, which utilizes a YAML syntax. This makes it easy to configure a static IP and change minute details in the future if necessary. Let’s get started with some basic understating on how netplan works on Ubuntu. Netplan allows network configuration via both: networkd daemon or NetworkManager. networkd daemon is mainly used for server configuration, whereas NetworkManager is used by GUI users. To switch between both you need to specify renderer explicitly via netplan configuration file. NOTE If no renderer is specified within the netplan’s configuration file, then the default handler for the network configuration on this particular device will be networkd daemon. The netplan configuration file location is set to /etc/netplan/ directory. Other possible locations are /lib/netplan/ and /run/netplan/. Depending on your Ubuntu installation the actual Netplan configuration file can take one of the following three forms: 01-netcfg.yaml 01-network-manager-all.yaml 50-cloud-init.yaml In case you cannot find your configuration file, you may attempt to generate the new netplan config by executing the below command: $ sudo netplan generate DID YOU KNOW YOU CAN CONFIGURE STATIC IP USING DHCP SERVER? Most likely your current Ubuntu system uses DHCP server to configure its networking settings. Hence, the configuration of your IP address is dynamic. In many scenarios, simply configuring your router or local DHCP server is a preferred way to set a static address to any host regardless of the operating system in use. Check your router manual and assign the static IP address to your host based on its MAC address using the DHCP service. Netplan static ip step by step instructions Ubuntu Server To configure a static IP address on your Ubuntu server you need to find and modify a relevant netplan network configuration file. See the above section for all possible Netplan configuration file locations and forms.For example you might find there a default netplan configuration file called 50-cloud-init.yaml with a following content instructing the networkd deamon to configure your network interface via DHCP: # This file describes the network interfaces available on your system # For more information, see netplan(5). network: version: 2 renderer: networkd ethernets: enp0s3: dhcp4: yes To set your network interface enp0s3 to static IP address 192.168.1.222 with gateway 192.168.1.1 and DNS server as 8.8.8.8 and 8.8.4.4 replace the above configuration with the one below. WARNING You must adhere to a correct code indent for each line of the block. In other words, the number of spaces before each configuration stanza matters. Otherwise you may end up with an error message similar to: Invalid YAML at //etc/netplan/01-netcfg.yaml line 7 column 6: did not find expected key #network: version: 2 renderer: networkd ethernets: enp0s3: dhcp4: false dhcp6: false addresses: - 192.168.1.122/24 routes: - to: default via: 192.168.1.1 nameservers: addresses: [8.8.8.8,8.8.4.4] NOTE: Due to recent updates in network configuration methods, the error message “gateway4 has been deprecated, use default routes instead” signifies the need to substitute the outdated gateway4 option with the routes configuration. Users should define default and specific routes within the network interface settings, as illustrated in the provided example, to ensure more flexible and straightforward network routing. This adjustment is integral to the continuous efforts to standardize and streamline network configurations. To permanently disable cloud-init’s network configuration capabilities on systems where configurations are typically overridden upon reboot, you can create a configuration file in the /etc/cloud/cloud.cfg.d/ directory. Use the command: $ sudo bash -c 'echo "network: {config: disabled}" > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg' This will write the necessary settings directly. This action will ensure that changes to network configurations do not persist across reboots, effectively disabling cloud-init’s control over network settings. Creating this file informs cloud-init to leave network configurations as manually set, rather than resetting them based on the instance’s data source. It is crucial to implement this in environments where consistent, manual network configuration is necessary. Once ready apply the new Netplan configuration changes with the following commands: $ sudo netplan apply In case you run into some issues execute: $ sudo netplan --debug apply Ubuntu Desktop This is a preferred way of setting the static IP address on Ubuntu Desktop. It is important to note the if your Ubuntu system is using Netplan to configure network on your hosts you need to set the renderer within the Netplan’s configuraiton file to renderer:NetworkManager. Having the Netplan’s renderer set to networkd daemon will result in the Wired Unmanaged error. Click on top right network icon and select settings corresponding to the network interface you wish to assign with the static IP address. <img decoding="async" class="size-full wp-image-10618" src="https://linuxconfig.org/wp-content/uploads/2018/01/01-set-configure-static-ip-address-ubuntu-18.04-bionic-linux.avif" alt="Select wired or Wifi network settings" width="740" height="603" />Select wired or Wifi network settings Next, click on the gear box icon next to your network connection you wish to configure. This could be wired or wireless connection. <img decoding="async" class="size-full wp-image-10617" src="https://linuxconfig.org/wp-content/uploads/2018/01/02-set-configure-static-ip-address-ubuntu-18.04-bionic-linux.avif" alt="Click on the network you wish to configure" width="740" height="598" />Click on the network you wish to configure Select IPv4 from the top menu. <img decoding="async" class="size-full wp-image-10616" src="https://linuxconfig.org/wp-content/uploads/2018/01/03-set-configure-static-ip-address-ubuntu-18.04-bionic-linux.avif" alt="Select IPv4 to start configuring a new IP address" width="740" height="600" />Select IPv4 to start configuring a new IP address Choose Manual for the IPv4 settings, enter your desired configuration and hit Apply. <img decoding="async" class="size-full wp-image-10619" src="https://linuxconfig.org/wp-content/uploads/2018/01/04-set-configure-static-ip-address-ubuntu-18.04-bionic-linux.avif" alt="Set your desired static IP address" width="740" height="601" />Set your desired static IP address Restart your network by ON/OFF switch. <img decoding="async" class="size-full wp-image-10615" src="https://linuxconfig.org/wp-content/uploads/2018/01/05-set-configure-static-ip-address-ubuntu-18.04-bionic-linux.avif" alt="Restart to apply new network settings" width="740" height="598" />Restart to apply new network settings Check your new static IP address configuration. <img decoding="async" class="size-full wp-image-10614" src="https://linuxconfig.org/wp-content/uploads/2018/01/06-set-configure-static-ip-address-ubuntu-18.04-bionic-linux.avif" alt="Check you new static IP configuration" width="740" height="603" />Check you new static IP configuration Closing Thoughts In this tutorial, you saw how to configure a static IP address on an Ubuntu Linux system. We have covered a GUI and command line method here, so that users with a desktop system or server (without GUI) will be able to follow along. Your static IP address settings will persist after reboots, and you will need to manually reconfigure the IP address or revert to DHCP in order to stop using it. Related Linux Tutorials:Set up Raspberry Pi as RouterChange IP address on Ubuntu ServerHow to configure static IP address on Ubuntu 22.04…Ultimate Web Server Benchmark: Apache, NGINX,…Set static IP on Raspberry PiThings to do after installing Ubuntu 22.04 Jammy…Best Linux Distro: How to Choose Guide for Every UserNetplan network configuration tutorial for beginnersHow to install Arch Linux alongside Ubuntu (Dual Boot)Things to install on Ubuntu 22.04 Categories Ubuntu Tags administration, beginner, networking, ubuntu How to install Unity desktop on Ubuntu 18.04 Bionic Beaver LinuxHow To Upgrade Ubuntu To 18.04 LTS Bionic Beaver'''
