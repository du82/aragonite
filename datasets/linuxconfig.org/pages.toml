["https://linuxconfig.org/how-to-install-ubuntu-on-windows"]
title = "How to install Ubuntu on Windows - LinuxConfig"
description = "If you currently use Windows as your primary operating system, but feel that you are missing out on some important Linux features, it is possible to install Ubuntu on Windows through the WSL (Windows…"
full_description = 'How to install Ubuntu on Windows 22 November 2024 by Korbin Brown If you currently use Windows as your primary operating system, but feel that you are missing out on some important Linux features, it is possible to install Ubuntu on Windows through the WSL (Windows Subsystem for Linux) feature. WSL is essentially virtualization, but it allows Ubuntu to closely integrate with Windows, resulting in only a small overhead to run the additional operating system, and the ability to natively access the entire Windows file system within Ubuntu. Microsoft accomplishes this close integration between Ubuntu and Windows by installing a modified Linux kernel that has been configured to run on Hyper-V architecture (Windows’ native virtualization system) and fine tuned it to operate on top of Windows seamlessly. This is a much different virtualization experience than you might have come to expect with other software like VMware or VirtualBox. In this tutorial, we will go over the step by step instructions of enabling WSL and installing Ubuntu on Windows. OTHER OPTIONS WSL is the perfect choice for users that want to execute Linux commands or utilize Linux software packages in the easiest way possible. However, if your Linux work is going to be more extensive, you may consider installing Ubuntu alongside Windows as dual boot operating systems, or using a dedicated hypervisor like VirtualBox to run a full Ubuntu installation with a GUI. In this tutorial you will learn: How to enable Virtual Machine Platform and Windows Subsystem for Linux How to install Ubuntu for WSL via Microsoft Store How to launch Ubuntu via WSL on Windows How to install Ubuntu on Windows Software Requirements and Linux Command Line Conventions Category Requirements, Conventions or Software Version Used System Windows 11, Ubuntu 24.04 Software Windows Subsystem for Linux Other Privileged access to your Linux system as root or via the sudo command. Conventions # – requires given linux commands to be executed with root privileges either directly as a root user or by use of sudo command $ – requires given linux commands to be executed as a regular non-privileged user Video Tutorial <img src="https://i.ytimg.com/vi/YToHA7Lxbwo/hqdefault.jpg" alt="YouTube video" width="480" height="360" data-pin-nopin="true" nopin="nopin"><iframe title="How to install Ubuntu on Windows" src="https://www.youtube.com/embed/YToHA7Lxbwo" width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"></iframe> Installing Ubuntu on Windows (WSL) Follow along with the steps below to enable WSL and install Ubuntu on Windows: The first step is to open the Windows Start menu and search for the Turn Windows features on or off menu. Click on the indicated option to open the Windows Features panel. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/11/01-how-to-install-ubuntu-on-windows.avif" alt="Open the Windows features control panel" width="1200" height="675" class="size-full wp-image-24390" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/01-how-to-install-ubuntu-on-windows.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/11/01-how-to-install-ubuntu-on-windows-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/01-how-to-install-ubuntu-on-windows-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/01-how-to-install-ubuntu-on-windows-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Open the Windows features control panel Inside of the Windows Features window, check the boxes next to the Virtual Machine Platform and Windows Subsystem for Linux options to turn on these features. Then, click OK to enable the features. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/11/02-how-to-install-ubuntu-on-windows.avif" alt="Enable Virtual machine platform and Windows Subsystem for Linux" width="1200" height="675" class="size-full wp-image-24389" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/02-how-to-install-ubuntu-on-windows.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/11/02-how-to-install-ubuntu-on-windows-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/02-how-to-install-ubuntu-on-windows-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/02-how-to-install-ubuntu-on-windows-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Enable Virtual machine platform and Windows Subsystem for Linux Windows will make the changes, which may take a minute or two, then ask you to restart your system for the changes to take effect. Proceed with the reboot. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/11/03-how-to-install-ubuntu-on-windows.avif" alt="Reboot your Windows system for the changes to take effect" width="1200" height="675" class="size-full wp-image-24388" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/03-how-to-install-ubuntu-on-windows.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/11/03-how-to-install-ubuntu-on-windows-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/03-how-to-install-ubuntu-on-windows-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/03-how-to-install-ubuntu-on-windows-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Reboot your Windows system for the changes to take effect Once Windows loads back to the desktop, open the Start menu and navigate to the Windows Store. Once there, search for Ubuntu and click on the latest LTS release. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/11/04-how-to-install-ubuntu-on-windows.avif" alt="Search for Ubuntu inside of the Microsoft Store" width="1200" height="675" class="size-full wp-image-24387" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/04-how-to-install-ubuntu-on-windows.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/11/04-how-to-install-ubuntu-on-windows-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/04-how-to-install-ubuntu-on-windows-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/04-how-to-install-ubuntu-on-windows-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Search for Ubuntu inside of the Microsoft Store After clicking on the search result and loading into Ubuntu LTS page, click on the “Get” button to begin downloading and installing the operating system. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/11/05-how-to-install-ubuntu-on-windows.avif" alt="Start downloading Ubuntu for WSL" width="1200" height="675" class="size-full wp-image-24386" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/05-how-to-install-ubuntu-on-windows.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/11/05-how-to-install-ubuntu-on-windows-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/05-how-to-install-ubuntu-on-windows-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/05-how-to-install-ubuntu-on-windows-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Start downloading Ubuntu for WSL After the download is completed, it is recommended that you open a Windows command prompt and run the following command to ensure that the kernel is completely updated: > wsl --update Next, you can open the Windows Start menu and search for Ubuntu to open it. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/11/06-how-to-install-ubuntu-on-windows.avif" alt="Opening Ubuntu from the Windows Start menu" width="1200" height="675" class="size-full wp-image-24385" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/06-how-to-install-ubuntu-on-windows.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/11/06-how-to-install-ubuntu-on-windows-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/06-how-to-install-ubuntu-on-windows-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/06-how-to-install-ubuntu-on-windows-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Opening Ubuntu from the Windows Start menu You will be asked to create a new user for Ubuntu. Note that this does not need to be the same username or password as what you currently use for Windows. <img decoding="async" src="https://linuxconfig.org/wp-content/uploads/2024/11/07-how-to-install-ubuntu-on-windows.avif" alt="Running Ubuntu via WSL on Windows" width="1200" height="675" class="size-full wp-image-24384" srcset="https://linuxconfig.org/wp-content/uploads/2024/11/07-how-to-install-ubuntu-on-windows.avif 1200w, https://linuxconfig.org/wp-content/uploads/2024/11/07-how-to-install-ubuntu-on-windows-300x169.avif 300w, https://linuxconfig.org/wp-content/uploads/2024/11/07-how-to-install-ubuntu-on-windows-1024x576.avif 1024w, https://linuxconfig.org/wp-content/uploads/2024/11/07-how-to-install-ubuntu-on-windows-768x432.avif 768w" sizes="(max-width: 1200px) 100vw, 1200px" />Running Ubuntu via WSL on Windows We are all done. Now you can proceed with using Ubuntu as you normally would. Get started by creating Bash scripts, installing additional software via the apt command, accessing the C: drive through the /mnt/c directory, and doing other activities. Closing Thoughts In this tutorial, we saw how to install Ubuntu on Windows. This was made possible by Windows Subsystem for Linux, which is virtualization that has been customized to run Linux on top of Windows in a very seamless way. This allows users to utilize Linux features and software with negligible overhead and easy access to the Windows file system. Related Linux Tutorials:Ubuntu 22.04 on WSL (Windows Subsystem for Linux)Best Linux Distro: How to Choose Guide for Every UserInstall Microsoft fonts on Ubuntu 22.04 Jammy…Things to install on Ubuntu 22.04Things to do after installing Ubuntu 22.04 Jammy…How to Install Microsoft Edge on Ubuntu/Debian LinuxSetting Up Virtual Machines with QEMU, KVM, and…Best Small Linux Distros for 2024How to install Arch Linux alongside Ubuntu (Dual Boot)Ubuntu 22.04 Guide Categories Ubuntu Tags administration, installation, ubuntu, virtualization How to resize ext4 root partition live without umount on LinuxFindmnt Command: Querying Filesystems in Linux Made Easy'
