full_description = '''Professor Lisa P. RamseyProfessor Lisa Pondrom RamseyUniversity of San Diego School of Law5998 Alcala Park, San Diego, CA 92110-2492Telephone: 619-260-7977Email: lramsey@sandiego.edu@lpramsey on Bluesky and X/TwitterLisa Ramsey is a Professor of Law at the University of San Diego School of Law, where she teaches and writes in the intellectual property law area. She is an expert on trademark law and has given presentations on this topic to attorneys, professors, and students throughout the United States and around the world. Professor Ramsey’s scholarship focuses on potential conflicts between trademark laws and free speech rights, and explains how trademark protection of certain inherently valuable words, symbols, and product features can harm fair competition and freedom of expression. She is currently working on a book about this topic which will be published by Cambridge University Press. In 2024, she testified at a hearing held by the U.S. Senate Judiciary Committee's Intellectual Property Subcommittee about the First Amendment implications of a proposed anti-impersonation law targeted at unauthorized digital replicas called the No FAKES Act. She has also talked about free speech limits on trademark rights on panels at San Diego Comic-Con in 2023 and 2024. Professor Ramsey is an active member of the Trademark Law Committee of the American Intellectual Property Law Association and worked on the subcommittee that updated the International Trademark Association's Model Trademark Law Guidelines in 2019 (note: the 2024 version of the guidelines is here). Before joining the USD law faculty in 2004, she was an intellectual property litigator at Gray Cary Ware & Freidenrich and a judicial law clerk for the Honorable Rebecca Beach Smith in the United States District Court for the Eastern District of Virginia. Examples of Professor Ramsey's publications include Raising the Threshold for Trademark Infringement to Protect Free Expression in the American University Law Review (2023) (with Christine Haight Farley) (judged by the editor of the 2024 Entertainment, Publishing and the Arts Handbook to be one of the best law review articles in this field published in 2023); Protectable Trademark Subject Matter in Common Law Countries and the Problem with Flexibility in The Cambridge Handbook of International and Comparative Trademark Law (Irene Calboli & Jane Ginsburg eds., Cambridge University Press 2020); Using Failure to Function Doctrine to Protect Free Speech and Competition in Trademark Law in the Iowa Law Review Online (2020); Non-Traditional Trademarks and Inherently Valuable Expression in The Protection of Non-Traditional Trademarks (Irene Calboli & Martin Senftleben eds., Oxford University Press 2018); Free Speech Challenges to Trademark Law After Matal v. Tam in the Houston Law Review (2018); A Free Speech Right to Trademark Protection? in The Trademark Reporter (2016); Reconciling Trademark Rights and Free Expression Locally and Globally in International Intellectual Property: A Handbook of Contemporary Research (Daniel J. Gervais ed. 2015); Mechanisms for Limiting Trade Mark Rights to Further Competition and Free Speech in the International Review of Intellectual Property and Competition Law (2013) (with Jens Schovsbo); and Free Speech and International Obligations to Protect Trademarks in the Yale Journal of International Law (2010). Her article Descriptive Trademarks and the First Amendment in the Tennessee Law Review (2003), was judged by the editor of the 2024 Intellectual Property Law Review to be one of the best intellectual property law review articles of 2003.EXPERIENCEUniversity of San Diego School of LawProfessor of Law, 2009 to present; Associate Professor of Law, 2006 to 2009; Assistant Professor of Law, 2004 to 2006 - San Diego, CACourses: Trademark Law, International Intellectual Property, Civil Procedure, Trademark Litigation, Intellectual Property Survey, Intellectual Property Seminar Award for scholarship: Thorsnes Prize for Outstanding Legal Scholarship, 2020-2021Award for teaching and scholarship: Class of 1975 Endowed Professorship, 2017-2018New Zealand Centre of International Economic Law, Faculty of Law, Victoria University of WellingtonSenior Visiting Research Fellowship - Oct. 16-20, 2017 - Wellington, New ZealandMelbourne Law School, The University of MelbourneVisiting Scholar - Feb. & Mar. 2011 - Melbourne, AustraliaLaw Offices of Lisa P. RamseyAppellate Litigation - 2003 to 2004 - San Diego, CAGray Cary Ware & Freidenrich (now DLA Piper)Associate in Intellectual Property Litigation Group - 1997 to 2002 - San Diego, CAUnited States District Court Eastern District of VirginiaJudicial Law Clerk for the Honorable Rebecca Beach Smith - 1996 to 1997 - Norfolk, VAEDUCATIONUCLA School of LawOrder of the Coif, UCLA Law Review, Moot Court Honors Program - J.D. 1996 - Los Angeles, CAUCLAMagna Cum Laude, Phi Beta Kappa, UCLA Advertising Club - B.A. 1993 - Los Angeles, CAWORKS IN PROGRESSTrademarks and Free Speech: Conflicts and Resolutions (working title of book accepted for publication by Cambridge University Press)PUBLICATIONSRaising the Threshold for Trademark Infringement to Protect Free Expression, 72 American University Law Review 1225 (2023) (with Christine Haight Farley) - also posted on SSRNReprinted in the Entertainment, Publishing and the Arts Handbook (Karen B. Tripp ed. 2024), an anthology published annually by Thomson Reuters, and judged to be one of the best law review articles related to entertainment, publishing, and/or the arts published in 2023Protectable Trademark Subject Matter in Common Law Countries and the Problem with Flexibility, in The Cambridge Handbook of International and Comparative Trademark Law 193 (Irene Calboli & Jane Ginsburg eds., Cambridge University Press 2020)Using Failure to Function Doctrine to Protect Free Speech and Competition in Trademark Law, 104 Iowa Law Review Online 70 (2020) - also posted on SSRNNon-Traditional Trademarks and Inherently Valuable Expression, in The Protection of Non-Traditional Trademarks: Critical Perspectives 337 (Irene Calboli & Martin Senftleben eds., Oxford University Press 2018) Free Speech Challenges to Trademark Law After Matal v. Tam, 56 Houston Law Review 401 (2018) - also posted on SSRNReprinted in Alexander Lindey & Michael Landau, Lindey on Entertainment, Publishing, and the Arts: Agreements and the Law, § 2:11.50 (3d ed. 2023) A Free Speech Right to Trademark Protection? 106 Trademark Reporter 797 (2016) - also posted on SSRNCited by Advocate General Michal Bobek in his Opinion in Constantin Film Produktion GmbH v. European Union Intellectual Property Office, Case C-240/18. Reconciling Trademark Rights and Free Expression Locally and Globally, in International Intellectual Property: A Handbook of Contemporary Research 341 (Daniel J. Gervais ed., Edward Elgar Publishing 2015) Mechanisms for Limiting Trade Mark Rights to Further Competition and Free Speech, 44 International Review of Intellectual Property and Competition Law 671 (2013) (with Jens Schovsbo) Free Speech and International Obligations to Protect Trademarks, 35 Yale J. Int'l L. 405 (2010) - also posted on SSRN Brandjacking on Social Networks: Trademark Infringement by Impersonation of Markholders, 58 Buff. L. Rev. 851 (2010) (symposium article for the Advertising and the Law conference) - also posted on SSRN Increasing First Amendment Scrutiny of Trademark Law, 61 SMU L. Rev. 381 (2008) - also posted on SSRN First Amendment Limitations on Trademark Rights, in 3 Intellectual Property and Information Wealth: Issues and Practices in the Digital Age 147 (Peter K. Yu ed., 2007) Intellectual Property Rights in Advertising, 12 Mich. Telecomm. Tech. L. Rev. 189 (2006) - also posted on SSRN Descriptive Trademarks and the First Amendment, 70 Tenn. L. Rev. 1095 (2003) - also posted on SSRNReprinted in 36 Intellectual Property Law Review 271 (Karen B. Tripp ed., Thomson West 2004) and judged to be one of the best law review articles related to intellectual property law published in 2003Predicting the Unpredictable under Rule 11(b)(3): When are Allegations “Likely” to Have Evidentiary Support? 43 UCLA L. Rev. 1393 (1996) (student comment)GUEST BLOG POSTS, COMMENTARY ON CASES, AND BOOK REVIEWSGuest Blog Post, Heightened Constitutional Scrutiny is Not Required for Content-Based Trademark Registration Laws that are Viewpoint-Neutral--Vidal v. Elster, Technology & Marketing Law Blog (June 27, 2024) Guest Blog Post, Evaluating the Constitutionality of Viewpoint-Neutral Trademark Registration Laws That Do Not Restrict Speech--Vidal v. Elster, Technology & Marketing Law Blog (Nov. 27, 2023) Dog Toys, Trademarks, and Free Speech in Jack Daniel's v. VIP Products, The Blue Brief: Faculty Review of the 2022-23 U.S. Supreme Court Term (July 13, 2023) (published by the University of San Diego School of Law)Guest Blog Post, Resolving Conflicts Between Trademark and Free Speech Rights After Jack Daniel's v. VIP Products, Technology & Marketing Law Blog (June 21, 2023) Guest Blog Post, The First Amendment Limits Trademark Rights, But How? - Jack Daniel's v. Bad Spaniels, Technology & Marketing Law Blog (April 3, 2023)Guest Blog Post, Trademark Registration of Political Messages for Expressive Merchandise-In re Elster, Technology & Marketing Law Blog (March 4, 2022)The First Amendment Protects Offensive Trademarks, The Regulatory Review (July 25, 2017) (published by the Penn Program on Regulation at the University of Pennsylvania Law School; discussing the implications of the Supreme Court's Matal v. Tam decision) Guest Blog Post, Symposium: Increasing First Amendment scrutiny of trademark law after Matal v. Tam, SCOTUSblog (June 20, 2017)Book Review: Trademark Protection and Territoriality Challenges in a Global Economy edited by Irene Calboli and Edward Lee, 5 The IP Law Book Review 1 (2014)Book Review: Australian Trade Mark Law by Robert Burrell and Michael Handler, 16 Media & Arts Law Review 218 (2011) PRESENTATIONS, CONGRESSIONAL TESTIMONY, AND OTHER SPEAKING ENGAGEMENTSPresentation, Raising the Threshold for Trademark Infringement to Protect Free Expression, Hofstra Intellectual Property Colloquium (Nov. 18, 2024) (virtual presentation) Presentation, Balancing Trademark and Free Speech Rights After Tam, Brunetti, Jack Daniel's and Elster, World Intellectual Property Review Trademarks North America Conference, San Diego, CA (Sept. 5, 2024)Presentation, Comic Book Law School 303: AI, Spec Scripts and Fan Fiction, Free Speech vs. Trademark Rights, and Other Hot Topics, Comic-Con International, San Diego, CA (July 27, 2024) (discussing how the First Amendment limits trademark rights and the implications of the Supreme Court's recent decision in Vidal v. Elster--the "Trump Too Small" case--for comic book creators and other authors and artists)Presentation, Trademarks, Free Speech, and Inherently Valuable Expression, 42nd Annual Congress of the International Association for the Advancement of Teaching and Research in Intellectual Property (ATRIP), Luiss University, Rome, Italy (July 2, 2024)Panelist, Professor's Panel - To Infinity and Beyond: What is the Proper Scope of Trademark Protection for Characters After Their Copyrights Expire? International Trademark Association 2024 Annual Meeting, Atlanta, GA (May 20, 2024)Senate Testimony, The No FAKES Act: Protecting Americans from Unauthorized Digital Replicas, Hearing Before the U.S. Senate Judiciary Committee's Intellectual Property Subcommittee (April 30, 2024) (testifying about the First Amendment implications of a proposed anti-impersonation law targeted at unauthorized digital replicas called the No FAKES Act and whether Congress should enact a federal right of publicity law) - a recording of the hearing is available on CSPAN and the Senate Judiciary Committee's website, and here are links to my written testimony, my Answers to Questions for the Record after the hearing, and Prof. Jennifer Rothman's summary of the hearing. Cited and quoted in Part 1 Digital Replicas of the U.S. Copyright Office Report on Copyright and Artificial Intelligence (July 31, 2024) (pages 38-40)A bipartisan group of Senators proposed the No FAKES Act bill targeting unauthorized digital replicas on July 31, 2024; for more information, see the proposed text of the No FAKES Act, the section-by-section summary of the bill, and Senator Coons' press release about the No FAKES Act billInvited Participant, Trademark Scholars Roundtable, University of Nevada Las Vegas School of Law (Feb. 23-24, 2024)Presentation, Free Speech or Free Riding: Does the First Amendment Trump Trademark Law?, Evil Twin Debate Series hosted by the University of Richmond School of Law, Santa Clara, CA (Feb. 1, 2024) (debate with Jake Linford of Florida State University College of Law the evening before the 2024 Works-in-Progress for Intellectual Property Scholars Conference held at Santa Clara University School of Law) Presentation, Trademark and Free Speech at the Crossroads, Beverly Hills Bar Association (Dec. 12, 2023) (virtual presentation) Presentation, Trademark, Free Speech, and the "Trump Too Small" Case, Maurer School of Law, Indiana University Bloomington (Nov. 8, 2023) (virtual presentation)Presentation, Trademark Registration Laws and the First Amendment, Section Two Small: Exploring the New Constitutional Limits on Trademark Law, University of New Hampshire Franklin Pierce School of Law (Nov. 3, 2023) (virtual presentation)Presentation, Trademark Law and Expressive Works in a Post-Jack Daniel's World, Media Law Resource Center (Nov. 2, 2023) (virtual presentation)Presentation, Trademarks and the First Amendment, American Intellectual Property Law Association 2023 Annual Meeting, National Harbor, MD (Oct. 19, 2023)Trademarks, Free Speech, and the Bad Spaniels CasePresentation, World Intellectual Property Review Trademarks North America Conference, San Diego, CA (Sept. 19, 2023)P