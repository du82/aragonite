["https://lists.ozlabs.org/listinfo/linuxppc-dev"]
title = "linuxppc-dev@lists.ozlabs.org info page"
full_description = '''This is the Linux on PowerPC developers'mailing list. It is free and open to all those interested in development of Linux on PowerPC hardware, but discussions/patches should pertain to software development for the kernel core PowperPC support. Patches are welcomed, but please refrain from posting excessively large ones (400K is currently the limit for the entire message). Large patches should be made available at an accessible web site and the URL posted to this list. The list owner reserves the right to implement filtering of list messages, unsubscribe offenders, and/or otherwise prevent posting of messages to enforce the list charter. In particular, HTML formatted messages may be rejected. Sorry to shout, but here's the legalese: NEITHER THE ADMINISTRATORS OF THIS LIST NOR THE PARTICIPANTS OF THIS LIST SHALL BE LIABLE TO PARTICIPANT FOR ANY LIABILITY, LOSS, OR DAMAGE CAUSED OR ALLEGED TO BE CAUSED DIRECTLY OR INDIRECTLY BY THE PROVISION OF THIS LIST, OR WITH RESPECT TO ANY OBLIGATIONS RELATED TO THIS LIST, WHETHER DIRECT, INDIRECT, CONSEQUENTIAL, SPECIAL, EXEMPLARY OR PUNITIVE, OR FOR LOSS OF PROFITS, AND WHETHER OR NOT THE ADMINISTRATORS OF THIS LIST OR THE PARTICIPANTS OF THIS LIST HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES. IN NO EVENT SHALL THE ADMINISTRATORS' OF THIS LIST OR THE PARTICIPANTS' OF THIS LIST LIABILITY EXCEED THE AMOUNT PAID TO THE ADMINISTRATORS OF THIS LIST BY PARTICIPANT FOR SUBSCRIBING TO THIS LIST, I.E. NOTHING. PARTICIPANT IS SOLELY RESPONSIBLE FOR THE CONTENT AND PROTECTION OF ANY OF ITS MATERIALS PUBLISHED HERE, AND PARTICIPANT SHALL MAKE NO CLAIM AGAINST THE ADMINISTRATORS OF THIS LIST OR THE PARTICIPANTS OF THIS LIST ARISING OUT OF THE CONTENT OR PROTECTION OF SUCH MATERIALS, INCLUDING BUT NOT LIMITED TO INVASION OF PRIVACY, DEFAMATION, INFRINGEMENT OF INTELLECTUAL PROPERTY RIGHTS OR MISAPPROPRIATION OF TRADE SECRETS. In other words, no one associated with or participating in this mail list is liable for any problems you might have, whether it's bad advice, failure to keep a promise made to you or anyone else, disclosure of propriety information, errors, omissions, lies, flames, not receiving the list mail, being subscribed and/or unsubscribed without your permission, or anything else we haven't thought of no matter who's at fault. However, everyone is expected to be polite and abide by the law when you participate in this list. In addition, the information and text published on this list and its derivatives (digests, archives, etc.) remain the property of the respective authors, who have, by the act of mailing said information and text to the list, granted permission to the list owner to publish it and any derivatives with the understanding that the list owner must not materially profit from such publications nor grant any subsidiary rights to the material. No one else may republish this list's material or its derivatives for anything other than "fair use" purposes without the express permission of each of the respective authors. Specifically, e-mail addresses may not be extracted and used for any commercial purposes. Now for the useful stuff.... To post to the list, mail to <linuxppc-dev@lists.ozlabs.org> but please read the rules first and look for answers to your questions in the archives before posting. There are also many useful links at penguinppc.org. To subscribe to, or unsubscribe from, the linuxppc-dev list, point your web browser at https://lists.ozlabs.org/listinfo/linuxppc-dev or send mail to subscribe/unsubscribe. To contact this list's wetware or to report problems with the list, mail to <linuxppc-dev+owner@lists.ozlabs.org>. There used to be a separate list for discussion of development issues on 64 bit PowerPC platforms, but these lists were merged in March, 2006. The archives of the other list are still available. The linuxppc-embedded list was merged into this list in January, 2009. The archives of that list are still available.'''
