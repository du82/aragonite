full_description = "Kolab-users-de -- German-speaking Kolab user list Über Kolab-users-de Deutsch Englisch (USA) Deutschsprachige Anwenderliste f�r Kolab Um frühere Nachrichten an diese Liste zu sehen, besuchen Sie bitte das Archiv der Liste Kolab-users-de. Benutzung von Kolab-users-de Um eine Nachricht an alle Listenmitglieder zu senden, schicken Sie diese an kolab-users-de@kolab.org. Sie können im folgenden Abschnitt diese Liste abonnieren oder ein bestehendes Abonnement ändern. Abonnieren von Kolab-users-de Abonnieren Sie Kolab-users-de, indem Sie das folgende Formular ausfüllen: In Kürze erhalten Sie eine Bestätigungs-E-Mail, um sicherzustellen, dass es wirklich Sie sind, der abonnieren möchte. Dies ist eine private Mailingliste, was bedeutet, dass die Abonnentenliste von Nichtmitgliedern nicht eingesehen werden kann. Ihre E-Mail-Adresse: Ihr Name (optional): Sie können weiter unten ein Passwort eingeben. Dieses Passwort bietet nur eine geringe Sicherheit, sollte aber verhindern, dass andere Ihr Abonnement manipulieren. Verwenden Sie kein wertvolles Passwort, da es ab und zu im Klartext an Sie geschickt wird! Wenn Sie kein Passwort eingeben, wird für Sie ein Zufallspasswort generiert und Ihnen zugeschickt, sobald Sie Ihr Abonnement bestätigt haben. Sie können sich Ihr Passwort jederzeit per E-Mail zuschicken lassen, wenn Sie weiter unten die Seite zum ändern Ihrer persönlichen Einstellungen aufrufen. Wählen Sie ein Passwort: Erneute Eingabe zur Bestätigung: Welche Sprache bevorzugen Sie zur Benutzerführung? Deutsch Englisch (USA) Möchten Sie die Listenmails gebündelt in Form einer täglichen Zusammenfassung (digest) erhalten? Nein Ja Abonnenten der Liste Kolab-users-de (Die Liste der Abonnenten ist nur für die Abonnenten der Liste zugänglich.) Geben Sie Ihre e-mail-adresse und das Passwort ein, um die Liste der Abonnenten einzusehen: E-Mail-Adresse: Passwort: Austragen / Ändern einer Mailadresse Falls Sie Ihr Abonnement der Liste Kolab-users-de kündigen, eine Passwort-Erinnerung erhalten oder Ihre Einstellungen ändern möchten, geben Sie Ihre E-Mail-Adresse an: Wenn Sie dieses Feld leer lassen, werden Sie nach Ihrer E-Mail-Adresse gefragt."
