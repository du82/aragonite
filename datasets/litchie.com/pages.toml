["https://litchie.com/2013/tex-writer-v1-5"]
title = "TeX Writer v1.5"
full_description = '''HOME APPS ABOUT TeX Writer v1.5 January 18, 2013 I've received a lot of feedbacks on package installation. People don't like it at all. It's too much work. On the other hand, I don't like to bundle everything into the app and blow it into some hundreds-of-megabytes monster. Therefore in TeX Writer v1.5 we introduce an on-demand package downloader to make everyone happy. By default it's off. You will need to go to settings and turn "Auto download" on. If this feature is proven to be stable, then we'll try to turn it on by default in future. Here is how it works: During compilation, if a package file is neither found in the bundled app folder nor in the texmf-local directory, TeX Writer will try to look it up in online repository (Internet connection is required). If a match is found, the package will be downloaded into texmf-local. And next time, it will just use the one in texmf-local without looking for online version any more. If you would like to redownload everything, just delete the texmf-local folder. Another good news for CJK Chinese and Greek users: you don't need to download the zip files and install them manually. All the files and fonts will be downloaded on demand. Just make sure you have a stable internet connection. Both of them are large packages. /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
