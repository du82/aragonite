["https://litchie.com/2020/11/idos-update-v2.3"]
title = "iDOS UI Redesign for iPad"
full_description = "iDOS v2.3 is finally available in AppStore. Things we did in the new design: Bigger screen in portrait mode, making it more comfortable to play; Keyboard in portrait mode has been extended with 6 additional keys: insert, delete, home, end, page up, and page down. Now we don't need fn to switch. If you like to write code in iDOS (some do and me too), this will be very convenient. The landscape keyboard has a thumb key that you can use to slide the keyboard up and down. You can also tap on the thumb key to hide the keyboard and show it again. The transparency of the keyboard is auto adjusted so that it's easier to type over the screen. Dedicated CDROM drive button to mount CD images. On iPhone, we don't have the space for the CDROM drive, so we assign the function to floppy drive button. There are rough edges which we hope to fix in upcoming releases. Personally I find it hard to let go the original design done by Nick Line 10 years ago. Hopefully we can come back with a classic theme in future."
year_published = 2020
clearnet = "https://litchie.com/2020/11/idos-update-v2.3"
tags = ["idos", "ipad", "keyboard", "redesign"]
language = "en"
