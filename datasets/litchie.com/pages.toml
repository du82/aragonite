["https://litchie.com/2012/new-app-tex-notebook-plain-tex-for-ipad"]
title = "New App: TeX Notebook - Plain TeX for iPad"
full_description = '''HOME APPS ABOUT New App: TeX Notebook - Plain TeX for iPad August 23, 2012 The absence of TeX on iPad has long been felt by many people. Ever since TeX Equation was released two years ago, there have been strong requests for a full version of Plain TeX. However, the display resolution on iPad was not very good back in those days. Now with a 264 dpi retina display, iPad has become a first class device for high quality typesetting, and here comes the first real game in town. TeX Notebook lets you write, compile and preview TeX documents right on your iPad. Compilation happens on your device, no internet connection is required. It has a very straight forward user interface that can get you started in seconds. With Dropbox syncing support, you can share the TeX files among different devices, including your desktop computers. If your TeX file compiles successfully, you can preview the output immediately. Although the display dpi is not as high as paper print, we have taken extra care of the rendering process with anti-aliasing and subpixel positioning, your eyes can't really tell the difference. Even on iPad 1 or iPad 2, the result is still very comfortable. Background color can be customized to predefined themes. The preview is as clean as a paper, it is all about the content you produced. The iOS software keyboard is not very good for writing TeX. Frequently used characters like '\' hide too deep. Therefore we provide a very handy key bar containing most used TeX special characters. The landscape mode has even more extra keys. Now, the beauty of TeX on iPad must be seen to be believed. TeX Notebook on App Store /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
