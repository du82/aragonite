["https://litchie.com/2011/golden-ear-v1-6-update"]
title = "Golden Ear v1.6 Update (Now v2.0)"
full_description = '''HOME APPS ABOUT Golden Ear v1.6 Update (Now v2.0) July 9, 2011 In the past half year, Golden Ear has seen 6 updates, averagely 1 update per month. The driving force behind is the feedback sent from our enthusiastic users -- audiophiles, music producers. All the suggestions received are very valuable and we carefully sort them into a list. However, we don't put too many features into a single update because there is significant risk in new features. We prefer frequent update with a few well tested features at a time. So if your requested feature is not implemented yet, that only means we have spent the time in something more important or more asked features. Golden Ear v1.6 has the most changes among all these updates. Some are just improvements, some are entirely new features. Now let's have a quick walk through. Being a music player acoustic features always come first. Support wav/aiff up to 24bit/96KHz. On iPad and iPhone4 it sounds perfect without any stuttering. Gapless track transition. Subtracks in separate files will be played without interruption as if it is a single CD. The most important update is now you can create folders inside GE. There has been a lot of requests asking for folders and playlists. The reason they are postponed to this far is we have been trying to make GE sound better. Finally after all this wait, now we can organize files in folders right on the device. You can select several files and move them to a new folder or to an existing folder. There is no way to create folder inside folders. As a result we can only have two levels: the root folder and sub folders. You can play musics in a folder exclusively. Enter a folder and tap on the play button will bring you back to the playlist view, with only the titles listed in the folder. Play in the root folder will play all musics found, including those in subfolders. To rename a folder, tap the name at the title bar. Root folder can't be renamed. By selecting a file, you can now view detail info about this file, such as sample rate, bits per sample, file size, titles, artists, etc. You can also rename files. This is very useful if you are going to rename cue file or image names on device. You can also delete several files at a time. A convenient new feature is sleep timer. There are times when I listen to music in bed before sleep. Sometimes I just wake up and find out the musics are still playing -- disaster for both my hearing and battery life. When another user proposed this feature, I know I am not alone. Now you can setup a timer before you go to sleep and GE will stop playing when timer is out. There are some minor features that I think you will find out when you need them. Please send your suggestions as always. iTunes Link: Golden Ear in App Store Update v1.7 (Jul 15, 2011): - Fix bug: track name doesn't update when switched inside a cuesheet - Cover Art can also be in the form of "Album Title.jpg" - Add Russian localization Update v1.9 (Oct 15, 2011) - Add FTP transfer method. Update v2.0 (Oct 19, 2011) - Can not trust new compiler just yet. /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
year_published = 2011
