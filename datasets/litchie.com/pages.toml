["https://litchie.com/2010/idos-1-0-1-in-review"]
title = "iDOS 1.0.1 in Review (REJECTED)"
full_description = '''HOME APPS ABOUT iDOS 1.0.1 in Review (REJECTED) October 26, 2010 When I left the iDOS thread in touch arcade, it is like 12 pages, now when I check it again, it is more than 45 pages! I guess I missed the fun part. There are so many wonderful screenshots, definitely better than my poor ones in appstore. The moment when someone told me it is illegal to bundle those two little games, I put up with a new update to remove them. Bundling games is never my intention; they are there to serve demo purpose. Otherwise people would stuck at the command prompt. If this is the sole reason this app get pull I will be extremely sorry for ruin the fun. Some people report they can mount root directory. But I doubt if they can do anything further except for directory listing. If this is going to be a security issue, I think iOS should not permit such access in the first place. Anyway, I am willing to fix this issue if this is part of the reason. The only thing we can do is wait for approval. UPDATE: Rejected because an app must not install executables. /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
