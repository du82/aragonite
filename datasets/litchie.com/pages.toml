["https://litchie.com/2012/upcoming-tex-writer-with-graphics-and-colors"]
title = "Upcoming: TeX Writer with Graphics and Colors"
full_description = '''HOME APPS ABOUT Upcoming: TeX Writer with Graphics and Colors September 2, 2012 The upcoming TeX Writer will include several important features. 1. Sync folders. You can create a project folder on the Dropbox website or desktop computer, and then TeX Writer will sync it down on your iPad. 2. Add required LaTeX packages (See http://tug.ctan.org/pkg/required except psnfss) and more (xcolor, geometry). It's now possible to typeset a colorful page: ![](https://dl.dropbox.com/u/18357422/www/litchie/Photo 12 27 09 05.09.12.png) 3. Introducing a texmf-local folder structure. You can create the following folders in Dropbox/Apps/TeX Writer: ~/Dropbox/Apps/TeX Writer: - texmf-local - TeXinput (Everything except the following two cases) - TeXfonts (*.tfm font metrics) - GFfonts (font bitmaps) TeX Writer will looking into these folders for inputs. With a flat folder structure, TeX Writer can find and sync files faster. 4. File list view now shows PNG and JPEG files. You can preview the image inside the app. You can even adjust the image size and TeX Writer will generate the corresponding \includegraphics command for you. There will be other minor fixes to make TeX Writer work better and faster. If you hope this update comes sooner, please go to App Store and give us a review! /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
