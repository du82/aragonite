["https://litchie.com/2021/07/idos2-will-be-gone"]
title = "iDOS 2 will be gone soon"
full_description = '''I hate to say it again: Get it while you can. Recently I tried to submit an iDOS update with a few bug fixes, but then got a notification from Apple Review Team, and my heart dropped cold. To ensure there is no interruption of the availability of your app on the App Store, please submit an update within 14 days of the date of this message. If we do not receive an update compliant with the App Store Review Guidelines within 14 days, your app will be removed from sale. I think it's beneficial to all to understand Apple's reasoning behind this, so I have included the entire message at the end. Long time iDOS users are aware that we have been able to update iDOS meaningfully since last year , because we have enabled file sharing access which gives iDOS the ability to run custom games or programs. We didn't play any trick to fool the reviewers, on the contrary, for any submission, we always provide the following note up front to them: HI, This version enables Document Browser mode, but it - doesn't download code from internet, - doesn't provide store front, - only runs emulation in a small portion of screen. We are perfectly aware of AppStore policy on interpreted code. The reason of this submission is that there are similar apps on AppStore, running js or python code. In principle, iDOS is no different. No security risk since the user code is running inside emulator within the app sandbox. For years, we have been requested by thousands of users to enable iTunes file sharing. They really want their old DOS apps to continue to work for them on their iOS devices. So we think we should try for them. Please let us know if there is any problem. Apology to js/python app devs who may be concerned. I was just being desperate. That said, somehow the updates always got through, and led to the recent polularity, then it may have caught some unfavorable attention inside Apple. The bottom line is that I can not bring myself to cut the critical functionalities of iDOS2 in order to be compliant with Apple's policy. That would be a betrayal to all the users that have purchased this app specifically for those features. Existing users should still be able to download this app in your purchased history, however, if someday you can't and the appstore says "removed by developer", it's definitely not my doing. UPDATE Aug 10: Apple has removed iDOS 2 from App Store. FYI: The entire message from AppStore Review Jul 22, 2021 at 11:15 PM From Apple 2. 5.2 - Apps should be self-contained Please review this information carefully as it impacts your app’s availability on the App Store and requires your immediate action. Hello, We are writing to let you know about new information regarding your app, iDOS 2, version 2.6.2. Upon re-evaluation, we found that your app is not in compliance with the App Store Review Guidelines. Specifically, we found your app is in violation of the following: Guideline 2.5.2 - Performance - Software Requirements During review, your app installed or launched executable code, which is not permitted on the App Store. Specifically, your app executes iDOS package and image files and allows iTunes File Sharing and Files support for importing games. Executing code can introduce or changes features or functionality of the app and allows for downloading of content without licensing. Please note that while educational apps designed to teach, develop, or allow students to test executable code may, in limited circumstances, download code, such code may not be used for other purposes and such apps must make the source code completely viewable and editable by the user. Next Steps - Review the Software Requirements section of the App Store Review Guidelines. - Ensure your app is compliant with all sections of the App Store Review Guidelines and the Terms & Conditions of the Apple Developer Program. - Once your app is fully compliant, resubmit your app for review. To ensure there is no interruption of the availability of your app on the App Store, please submit an update within 14 days of the date of this message. If we do not receive an update compliant with the App Store Review Guidelines within 14 days, your app will be removed from sale. Please note, if your app is found to be out of compliance for any reason and rejected after the time period provided has elapsed, your app will be removed from sale until a compliant update is submitted, approved and released to the App Store. If your app is removed from sale, the TestFlight version of this app will also be unavailable for external and internal testing and all public TestFlight links will no longer be functional. Deliberate disregard of the App Store Review Guidelines and attempts to deceive users or undermine the review process are unacceptable and is a direct violation Section 3.2(f) of the Apple Developer Program License Agreement. Continuing to violate the Terms & Conditions of the Apple Developer Program will result in the termination of your account, as well as any related or linked accounts, and the removal of all your associated apps from the App Store. Future submissions of this app may require a longer review time, and this app will not be eligible for an expedited review. If you have any questions about this information, please reply to this message to let us know. Best regards, App Store Review'''
year_published = 2021
clearnet = "https://litchie.com/2021/07/idos2-will-be-gone"
tags = ["apple", "apps", "appstore", "code", "compliant", "entire", "fyi:", "gone", "guidelines", "idos"]
language = "en"
internal-references = ["none"]
external-references = ["9to5mac.com", "apps.apple.com", "itunes.apple.com"]

["https://litchie.com/2020/11/idos-update-v2.2"]
title = "iDOS UI Redesign for iPhone"
full_description = "I am happy to announce that iDOS v2.2 is now available in AppStore. This is a major update for iPhone, with brand new UI redesign for iPhone. The work on iPad is still going on, but I figure it would be more safe to release iPhone version first, so we can get feedbacks in time. iDOS was first released in Oct 26, 2010. If you remember well, the resolution of iPhone at that time had always been 320x480@2x, a lovely number by the way, up to iPhone 4S. After that point, there has been a Cambrian explosion of iPhone screens, and iDOS wasn't very good at using the extra screen space. And frankly, there was no point to update UI, since all you can do in the app was to play three bundled demos. Later on, we weren't even allowed to update with any bundled games at all. After hybernating for almost 10 years, iDOS finally can live a normal life, and now I want to give it all the nice things it deserves. Gamepad The gamepad has been totally rewritten, both graphics and code. Given the larger working space, two more buttons have been added to the gamepad. If you don't like them, you can hide them. Tap on the small screwdriver icon at the bottom, the gamepad will enter editing mode. You can tap on any button to change its keybinding or disable it. You can't hide dpad though. Gamepad buttons can be mapped to a text command. For example, if you are a text adventure gamer, you may find it handy to bind one of the buttons to LOOK, or INVENTORY. You can even bind arrow up button to NORTH, and down button to SOUTH. The key binding of gamepad is saved under the config directory of each iDOS package. So that any game can have its own settings. Previously, the dpad works only in 4 directions, that is, only one arrow button can be down at a time. Now if you move your fingers to the northeast direction, the two arrow buttons, up and right, will be down simultaneously. This makes movement control more interesting in games like wolf3d. Keyboard The soft keyboard is also updated with fine tuned layout so that keys line up better than ever. On tall iphone models, you are going to have an extra row for all sorts of symbols. If you are using iDOS for programming purpose, you will find it much more convenient than having to tap fn all the time. Floppy drive The floppy drive button can be used to mount an external folder. After you tap the button, in the file browser, tap select button on the top, so that the file list enters selecting mode. Then you can tap on a folder, .idos or not, it will be automatically mounted as disk D. Right now, it simply issues mount commands, but we hope to find a better way in future. I hope you will enjoy the new look and the new features. Going forward, we will implement the same changes on iPad. There are still rough edges, but we will sort them out in upcoming releases."
year_published = 2020
year_updated = 2020
clearnet = "https://litchie.com/2020/11/idos-update-v2.2"
tags = ["button", "drive", "floppy", "gamepad", "idos", "iphone", "keyboard", "redesign"]
language = "en"
internal-references = ["none"]
external-references = ["apps.apple.com"]

["https://litchie.com/2011/last-bow-of-idos-2"]
title = "Last Bow of iDOS"
full_description = '''HOME APPS ABOUT Last Bow of iDOS January 22, 2011 [caption id="attachment_192" align="alignleft" width="211" caption="XTREE on iDOS"][/caption] Jeff Johson, the author of XTREE, wrote to us: "watching history come alive and then disappear is heartbreaking". Yes, it takes some time for my initial feelings to chill out too. To comply to appstore policy, I would have to cripple iDOS further more, and it won't be able to run the programs people already uploaded. Nothing can compensate for that loss, no matter how much better it will look. We all hope that apple will finally realize that emulator doesn't place any threat to their customers and their business. Before that happens, this should be the last release of iDOS. If there will ever be any further development on iDOS, it will be under a different app name. We've received many positive feedbacks, and many valuable suggestions. There are still a lot of space to improve: - Choppy sound - Too slow.. - Game control is still not perfect - Voice over - How to reset game - ... The list goes on and on. These are going to keep us busy for a long while, and like we did before, they will be made into DOSPad. Please let us know if you still like to play on a restricted version of iDOS. We'll try our best when it is worth the trouble. Special Thanks: Mike Burlingame -- Long time supporter for DOSPad project and its forum. Nick Line -- Talented designer. The interface on iPad portrait mode looks almost the same as the first version he sent me, and people really love it. Many many people contribute their valuable ideas. They basically define the shape and function of iDOS/DOSPad you saw today. I just implement them. /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.ur