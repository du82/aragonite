full_description = '''HOME APPS ABOUT iDOS 1.0 one day report October 27, 2010 Despite a short stay in AppStore for a few hours, iDOS was grabbed by a lot of people in time:-) It all started with the thread iDOS - DOS Emulator on touch arcade, became popular with the blog http://toucharcade.com/2010/10/26/idos/, and then was removed from App Store. I wasn't there to witness the pull, but most of the sales should happen in its last 5 hours. Another interesting thing is it doesn't show up in any game categories, probably because I didn't assign a secondary category for it. Emulator is not a kind of game, but it basically runs all kinds of games. So I was not sure which category it should be. And now I've found that even installing windows has become quite popular a game for iDOS users. /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
