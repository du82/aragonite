["https://litchie.com/2012/tex-writer-v1-4-with-bibtexmakeindex"]
title = "TeX Writer v1.4 with Bibtex/Makeindex"
full_description = '''HOME APPS ABOUT TeX Writer v1.4 with Bibtex/Makeindex November 8, 2012 This update includes a lot of new features, and some of them have been asked for since the very beginning of this app. We have been working very hard to make them happen. bibtex is very important when writing research papers for publish, and makeindex is almost a must-have when writing books. Now we pack both into TeX Writer and run them automatically when necessary. Normally you don't have to do anything, however if you want to install bst files, then just put them into texmf-local/TeXinput, like installing a LaTeX package. A big change is when you press the compile button it won't generate PDF immediately. It runs tex, and generates dvi file. Only when you press the preview button, the pdf generation will be actually started. The reason behind this change is, since we have bibtex and makeindex, you may need to run tex multiple times before you get a final version output. DVI -> PDF is still very slow, so we want to get rid of the overhead when you're recompiling. We have other very important new features: You can create folders right in the app; Hold on an item in the file list will reveal more actions like move or rename; Any text file is editable right inside the app, including the configuration file twinit.l; Better looking accessory keyboard; You can specify a master tex file in a book project containing many separate tex files; Overview of tex file; Add listings/algorithm2e/IEEEtrans; Type a number in the command line will jump to that line. Convert latin1 encoded file to UTF8 automatically. Also various bug fixes to make TeX Writer more robust. Enjoy our new update! TeX Writer v1.4 on App Store /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
