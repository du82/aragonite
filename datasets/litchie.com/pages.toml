["https://litchie.com/2011/a-special-app"]
title = "A Special App"
full_description = '''HOME APPS ABOUT A Special App November 30, 2011 I didn't realize that a blind person can enjoy iPhone as much as sighted people. Then our world crossed when Michael Barnes came forward and proposed an app idea to port some classic text games on iPhone. We talked and I listened to him using his iPhone with Voice Over. I never used this feature before, and suddenly I think it is the best feature on the phone. iOS SDK doesn't provide direct Text-To-Speech APIs, it was a bit of challenge using only the UIKit accessibility functions. I also tried to use a free TTS engine, but was unable to make it sound better than the built-in one. After some investigation, I figured out a way (or a hack, worked well most of the time) to use Voice Over to speak out text changes on the screen automatically, and I thought it is fairly usable for text games. The app is a game pack of six classic games developed by Richard L. De Steno. A detailed list is put on the App Store description page. I never played these games before, but Michael had fond memories of them. If you are interested, you can visit it in App Store (Free). /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
