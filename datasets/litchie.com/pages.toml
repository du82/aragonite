["https://litchie.com/2012/update-tex-equation-2-0"]
title = "Update: TeX Equation 2.0"
full_description = '''HOME APPS ABOUT Update: TeX Equation 2.0 September 12, 2012 Since the date TeX Equation came out, our users have been asking for PDF output support. Now I am very happy to say that this feature is finally implemented in the latest update. When you copy the equation image, you are actually copying generated PDF data instead of PNG image. (For existing equations, you need to "touch" the equation text by appending one whitespace or two so that the engine has a chance to regenerate.) Now go to the Pages or Keynote app, and paste it. You will be able to scale the equation to any size you want, and it should look as crisp as possible at any size! Another big change is that we are now using LaTeX syntax instead of Plain TeX. This may bring some inconvenience to old users initially, however, I believe the troubles will be outweighted by the huge advantages brought by LaTeX and AMS Fonts. Now you can download TeX Equation in App Store, and create the most beautiful math equations in the world. /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
