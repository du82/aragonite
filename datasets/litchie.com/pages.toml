["https://litchie.com/2012/introducing-light-text"]
title = "Introducing Light Text"
full_description = '''HOME APPS ABOUT Introducing Light Text November 12, 2012 We have built a great editor for TeX Writer. Some of our customers love the extensible two-row accessory keyboard, some love that they can add commands, and some love the cursor control. One customer wrote a request in our forum that we should build a standalone app so that he can do all his writing in the editor. We took his advice, tried to separate the editing core from TeX Writer, and here is the editing app that shares the same powerful features -- Light Text. The only difference is we have a different default settings for the accessory keyboard. Of course, you can customize it if this is not what you want. We also make a demo video to let you know how editing in Light Text looks like. If you are not familiar with the way cursor control and text selection works, then you must not miss this. Official Website: http://www.lighttext.net App Store Link: https://itunes.apple.com/us/app/light-text/id576284301?ls=1&mt=8 /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
