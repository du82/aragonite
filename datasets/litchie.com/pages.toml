["https://litchie.com/2012/why-apple-hates-emulators"]
title = "Why Apple Hates Emulators"
full_description = '''HOME APPS ABOUT Why Apple Hates Emulators July 25, 2012 Sorry, I don't have the answer. I just can't think of any possible reason. Emulators have ZERO threat on Apple's business model. Emulators are for running old programs, no one in his/her right mind would create new apps for emulators. Most of the programs are out of market, their companies even don't exist any more. Emulated programs run in a closed environment, they do not have any more specialty than ordinary apps in generating security holes. Some may ask, if Apple allows loading custom executables, doesn't it open the gate for competitors like Flash/Java? Truth is iOS has no support for JIT compilation (except Webkit), apps written in competing technologies are impossible to keep the same performance, therefore Apple always has the upper hand. Having apps like Aemula on iOS is actually good for Apple. Apple has the best developing environment for writing emulators. Good emulators have parts that are written in assembly language. I can write and debug assembly in xcode, but it is impossible to do so on Android. For the Android port, I actually had to write and debug the core on iPad first, then I moved the whole thing to Android. This is a perfect example of how Apple beats Android on native code development. Emulating x86 programs on ARM is very performance demanding, Aemula is a perfect example to show case what Apple's devices are capable of. Now that is all I have to say for all emulator developers/users who love iOS platform. It may not go any where, but if Apple really cares about right and wrong, then it deserves some attention from the people who can make decisions. /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
