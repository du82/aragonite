["https://litchie.com/2012/a-critical-fix-for-tex-writer-v1-2-is-on-the-way"]
title = "A Critical Fix for TeX Writer v1.2 is On the Way"
full_description = '''HOME APPS ABOUT A Critical Fix for TeX Writer v1.2 is On the Way September 14, 2012 Last night, we had a bug report from a new user saying that Dropbox sync doesn't work. It didn't took us long to find out the real problem is that TeX Writer wasn't activated by Dropbox linking. This is very unfortunate and embarrassing too. We have a much better Dropbox syncing support, and now what good is it if you can not link? We submitted a quick fix immediately and hope it will be available soon enough. As a temporary solution, please use iTunes file sharing to upload tex and image files. This problem doesn't affect upgrading users as long as you do not unlink Dropbox, and please don't until update is available. (If you are curious about the cause: a last-minute feature -- importing tex file from other apps -- conflicts with Dropbox linking code. Since all our test devices were linked already, this bug somehow slipped through.) Update(9/21): TeX Writer v1.2.1 is now available /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://litchie.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
