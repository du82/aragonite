["https://litecoin.net/privacy"]
title = "Privacy"
full_description = "Your privacy is important to us. This Litecoin Foundation Limited (“Organisation”) Personal Data Protection Policy sets out how we comply with the provisions of the Personal Data Protection Act 2012 of Singapore (“PDPA”). We also want you to understand the way in which we collect, use, disclose and/ or retain your Personal Data. This Personal Data Protection Policy sets out:a. our policies on how we manage your Personal Data;b. the types of Personal Data we collect, use, disclose and/ or retain;c. how we collect, use, disclose and/ or retain your Personal Data; andd. the purpose(s) for which we collect, use, disclose and/ or retain your Personal Data. You agree and consent to us, the Organisation, and our authorised service providers and third parties to collect, use and disclose and/ or retain your Personal Data in the manner set forth in this Personal Data Protection Policy. This Personal Data Protection Policy supplements but does not supersede nor replace any other consent which you may have previously provided to us nor does it affect any right that we may have at law in connection with the collection, use, disclosure and/ or retention of your Personal Data. We may update this Personal Data Protection Policy to ensure that our Policy is consistent with any regulatory changes. Should any revision(s) be made to this Personal Data Protection Policy, updates will be published on our public site. In this Personal Data Protection Policy, “Personal Data” refers to any data and/or information about you from which you can be identified by, either (a) from that data; or (b) from that data and other information to which we may have legitimate access to. Examples of such Personal Data include but are not limited to:a. your name, passport or other identification number, telephone number(s), mailing address, email address and any other information relating to you which you have provided in any forms you may have submitted to use, or in other forms of inte