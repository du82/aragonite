["https://litecoin.net/news/mobilizing-mweb-litecoin-core-v0-21-3---a-new-era-for-mobile-wallets"]
title = "Mobilizing MWEB: Litecoin Core v0.21.3 - A new era for mobile wallets"
description = "We are pleased to announce the release of Litecoin Core v0.21.3! In this update, we focused on accelerating MWEB adoption..."
full_description = "Litecoin processed its 300 millionth transaction! A milestone for permissionless currency, decentralization, financial freedom and inclusion. 2024 was a big year for Litecoin. Record-breaking milestones, meme-fueled friendships, life-enhancing privacy updates, and unprecedented institutional interest. Here are the highlights! We are pleased to announce the release of Litecoin Core v0.21.3! In this update, we focused on accelerating MWEB adoption, by making it easier than ever to access MWEB via mobile wallets. Essentially, MWEB (MimbleWimble Extension Blocks) is an optional technology making Litecoin a sounder way to transact. MWEB offers the sender and receiver of a transaction some additional confidentiality, by obfuscating the amount of Litecoin being sent. And it's completely optional. MWEB makes Litecoin one of the most fungible digital assets to ever exist and increases Litecoin's scalability! For this update, we designed the LIP006 specification, and added the server component of LIP006 to Litecoin Core. You can read more in-depth about LIP006 here and the release notes for v0.21.3 here. In short, if you want to support MWEB adoption, please upgrade to Litecoin Core 0.21.3. If you don’t already run a full node, or aren’t sure what that is, we hope to explain and convince you to run a full node yourself. The Litecoin Network is powered by an interconnected system of ‘nodes’ which communicate with each other. When a transaction is detected by one node, it relays this transaction to another node. When a block is mined, the new block data is also shared between the nodes of the network. Each one of these nodes individually verify and validate transactions and blocks, which is part of the fundamental design that makes Litecoin decentralised - without a single person being able to change or dictate ‘consensus’. Full nodes are slightly different from light nodes, in that they contain the full history of all Litecoin data, from when Charlie Lee created the first Litecoin in the “genesis block” to today. These full nodes are the powerhouses of the Litecoin Network and provide access to light nodes to access the Litecoin Network without having a full copy of the Litecoin blockchain. This is why we want to encourage as many people to run a full node."
year_published = 2025
