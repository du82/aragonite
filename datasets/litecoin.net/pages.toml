["https://litecoin.net/news/announcing-the-inaugural-proof-of-work-summit"]
title = "Announcing the inaugural ‘Proof-of-Work Summit’"
description = "We at the Litecoin Foundation have joined forces with the ETC Cooperative to bring world-class speakers and thought leaders together for the Proof-of-Work Summit!"
full_description = 'Litecoin processed its 300 millionth transaction! A milestone for permissionless currency, decentralization, financial freedom and inclusion. 2024 was a big year for Litecoin. Record-breaking milestones, meme-fueled friendships, life-enhancing privacy updates, and unprecedented institutional interest. Here are the highlights! We at the Litecoin Foundation have joined forces with the ETC Cooperative to bring world-class speakers and thought leaders together for the Proof-of-Work Summit! ‍Already included in the line-up is Bitcoin pioneer, Charlie Shrem, people’s favorite and creator of Litecoin, Charlie Lee, infamous cypherpunk, Jameson Lopp, and Wall St veteran turned CEO of Custodia Bank, Caitlin Long. It seemed fitting that the first Proof-of-Work (POW) Summit be hosted in Prague - birthplace of the world’s first Bitcoin mining pool, hardware wallet and Bitcoin cafe. A city with a rich history and affinity for proof-of-work cryptocurrencies. The POW Summit aims to reinvigorate the spirit and ethos of cypherpunks – instigators of the blockchain revolution. With a host of marquee names confirmed already - and more of the world’s top innovators, thought-leaders and decision-makers - and more announced soon, the two-days are shaping up to be nothing short of phenomenal. Alongside members of the Litecoin Foundation will be community representatives from all major proof-of-work chains, and their respective mining communities, providing Summit attendees with further in-person networking opportunities, intimate discussions, presentations and workshops on subjects like network security, environmental sustainability, privacy and the merits of proof-of-work vs proof-of-stake. “The Proof-of-Work Summit is an opportunity for industry leaders - and interested individuals alike - to come together to discuss everything from mining and privacy, to the merits of proof-of-work itself”, says Alan Austin, Managing Director of Litecoin Foundation. “Joining forces with other communities with shared goals made total sense. The more we converse, collaborate and knowledge-share, the more we can build a stronger future for proof-of-work and the networks and communities represented.”Bob Summerwill, Executive Director at the ETC Cooperative echoed Austin’s thoughts, adding, "the POW Summit will be a unique event. For the first time we’re bringing together the major proof-of-work communities around a common cause. We’re going back to cypherpunk fundamentals. Highlighting that censorship resistance, decentralization, proof-of-work and privacy are more relevant than ever in 2023".'
