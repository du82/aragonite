full_description = "Sailing Club Of The Year 2018 Posted on November 17, 2018 by Justin Boating and sailing clubs in and around Northern Ireland have an opportunity to be rewarded for their dedication and hard work. This is because the RYA Northern Ireland has opened its nominations to present the Club of the Year Award. The annual awards event in association with Sunsail would be organized for the first time and the team is quite excited for the same. There is no doubt that volunteers have a significant role to play to make the sailing event successful and also to ensure that the overall activities of the club run smoothly and efficiently. RYA Northern Ireland has affiliated clubs as well as organizations and to sustain boating, the organization recognizes and promotes the best efforts and hard work undertaken by the club. The Club of the Year is one of the significant titles and the nominations for the same are now open and the award ceremony will take place next year in 15th of February. It will be for the first time that the winner of this year will directly qualify as the representative for the RYA national final. There will be 12 finalist clubs that would have public votes and the winner of the whole would be chosen by the member of the RYA. The announcement of the UK National winner will be made at the RYA Dinghy Show held in 2019. However, the nominations for the same should be received by 24th of September. As far as the winner of RYA Northern Ireland Club of the Year of 2017 is concerned, it was Carrickfergus. As per Trevor McCaig, the Past Commodore, it has been a wonderful experience. He said it’s a good feeling when the volunteers are recognized for the hard work. It helps to encourage them so as to ensure that they put in continuous efforts to make the sailing club grow successfully. Posted in Travel"
