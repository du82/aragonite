title = "GoogleCTF2021 - weather writeups - Midas Blog"
description = "Writeup for GoogleCTF2021 weather challenge"
full_description = '''GoogleCTF2021 - weather writeups Midas included in writeups 2021-07-19 4728 words 23 minutes Contents Introduction Analyzing main function Analyzing init function Analyzing each format handler function Writing an emulator + disassembler Analyze the first code block Analyze the decrypted code block Inserting z3 Appendix Note Use the table of contents on the right to navigate to the section that you are interested in. Introduction Challenge Info Given files: weather. Description: I heard it's raining flags somewhere, but forgot where... Thankfully there's this weather database I can use. Category: Reverse engineering Summary: A VM reverse engineering challenge. This VM is created using custom printf formats. My solution is to build an emulator for it and use z3 to solve it automatically without digging deep into the VM code. TL;DR Analyze the main function -> pretty normal, can notice some unfamiliar printf formats. Analyze the init function -> learn that this program registers a bunch of new different printf formats. Analyze each handler function -> learn that most of them are used to create a register based VM. Write an emulator + disassembler to analyze it -> learn that the first block of VM code tries to decode a larger block of code using the first byte of our input. Because this is a format string VM, the first byte of the block of code must be % -> find out the first correct byte of the input is T. Use the emulator + disassembler to analyze the decrypted code block -> reach the check instruction. Insert z3 variables into the input bytes, change the emulator a bit -> let z3 solve the correct input automatically. Run the original program, pass in the correct input -> get flag Analyzing main function The main function is quite ordinary, it first reads in 100 bytes of input from the user and stores it at address 6080. It then compares the input with some constant city names and prints the corresponding values. The interesting bit in main is that it uses some unfamiliar printf formats like %P, %W, %T, %F: printf("Precipitation: %P\n", &v7, a4); printf("Wind: %W\n", &v10); printf("Temperature: %T\n", &v5); printf("Flag: %F\n", a4); When we run the program, it will print using these formats just fine, it means that these formats must be registered somewhere else in the binary. The oldest trick in the book to do this is to use the ELF init function. Analyzing init function We can see a function sub_2328 in .init_array: int init_register_printf() { register_printf_function('W', format_W, arginfo); register_printf_function('P', format_P, arginfo); register_printf_function('T', format_T, arginfo); register_printf_function('F', format_F, arginfo); register_printf_function('C', format_C_jcc, do_nothing); register_printf_function('M', format_M_load, do_nothing); register_printf_function('S', format_S_add, do_nothing); register_printf_function('O', format_O_sub, do_nothing); register_printf_function('X', format_X_mult, do_nothing); register_printf_function('V', format_V_div, do_nothing); register_printf_function('N', format_N_mod, do_nothing); register_printf_function('L', format_L_lshift, do_nothing); register_printf_function('R', format_R_rshift, do_nothing); register_printf_function('E', format_E_xor, do_nothing); register_printf_function('I', format_I_and, do_nothing); return register_printf_function('U', format_U_or, do_nothing); } This function uses register_printf_function to register new formats for printf, more about it can be found here. The most important parts are the first and second parameters to it. The first one is a single char, which is the new format, and the second one is the handler function for that format. So it is clear that the job now is to reverse each of them. Analyzing each format handler function There are 16 new formats registered, I will explain each of them: %W, %P and %T are pretty standard, they are just wrappers around traditional printf formats. %F is also a wrapper around other printf formats, but it uses %C, which is a new format. %C is where it gets interesting. In this handler function we can see that instead of using the printf’s args, it uses the info instead. The struct definition for printf_info can be found here and it’s documentation can be found here: struct printf_info { int prec; /* Precision. */ int width; /* Width. */ wchar_t spec; /* Format letter. */ unsigned int is_long_double:1;/* L flag. */ unsigned int is_short:1; /* h flag. */ unsigned int is_long:1; /* l flag. */ unsigned int alt:1; /* # flag. */ unsigned int space:1; /* Space flag. */ unsigned int left:1; /* - flag. */ unsigned int showsign:1; /* + flag. */ unsigned int group:1; /* ' flag. */ unsigned int extra:1; /* For special use. */ unsigned int is_char:1; /* hh flag. */ unsigned int wide:1; /* Nonzero for wide character streams. */ unsigned int i18n:1; /* I flag. */ unsigned int is_binary128:1; /* Floating-point argument is ABI-compatible with IEC 60559 binary128. */ unsigned int __pad:3; /* Unused so far. */ unsigned short int user; /* Bits for user-installed modifiers. */ wchar_t pad; /* Padding character. */ }; I will explain the fields that our binary uses: width is the width of the string to be printed with the format, for example: %69x results in info->width = 69. By default if width is not specified then it’s 0. prec is the precision of a non-integer number, for example %.69f results in info->prec = 69. By default this is -1. is_long_double, is_short, is_long and is_char are 1-bit fields that correspond to the flags ll, h, l, hh, respectively, before the format type. Only one of these bit can be 1 at a time, for example: %lx sets info->is_long to 1 and the rest to 0. left, showsign are also 1-bit fields that correspond to the flags - and + at the start of the format, right after %. Only one of these two can be 1 at a time, for example %+6x or %-9x. pad is the padding character and can only be either whitespace (' ') or zero ('0'), default to whitespace. The first byte after % or +/- will determine this, if it’s 0 then info->pad = '0', for example: %69x is whitespace-padded and %069 is 0-padded. Note You may be unfamiliar with the :1 after field names. This in C is used to define bit fields. For example: all 8 fields from is_long_double to group are only 1 bit in size, so they all will be stored in 1 single byte instead of 8 different bytes for memory optimization. With the above knowledge, let’s get back to the registered printf formats: %C is easier to understand now, it uses left, showsign and pad fields to determine the type of comparison. Afterwards, it uses the comparison result to decide to call another fprintf or not (all functions in printf family shares the registered format handlers). Notice that there are 2 different memory regions that are accessed here: one is 32-bit accessed in the comparison at address 70A0, I called it REGS; the other is 8-bit accessed and contains other format strings at address 5080, I called it MEM. So this %C format is basically a conditional call function that implements 4 different calls, I name them CLZ, CGZ, CEZ and CALL. __int64 __fastcall format_C_call(FILE *stream, const struct printf_info *info, const void *const *args) { int prec; // [rsp+24h] [rbp-Ch] _BOOL4 cmp_flag; // [rsp+2Ch] [rbp-4h] prec = info->prec; if ( (*((_BYTE *)info + 12) & 0x20) != 0 ) // - flag { cmp_flag = REGISTERS[prec] < 0; } else if ( (*((_BYTE *)info + 12) & 0x40) != 0 )// + flag { cmp_flag = REGISTERS[prec] > 0; } else if ( info->pad == '0' ) // padding char { cmp_flag = REGISTERS[prec] == 0; } else { cmp_flag = 1; } if ( cmp_flag ) fprintf(stream, &MEM[info->width]); return 0LL; } All the other formats follows the same structure, which uses left and showsign fields to get an address, and is_long_double, is_short, is_long, is_char fields to get a value. It then performs an arithmetic operation on what is at the address and the value and store the result back to address. The operations are: %M - load, %S - add, %O - sub, %X - mult, %V - div, %N - mod, L - left shift, R - right shift, E - xor, I - and, U - or. __int64 __fastcall format_M_load(FILE *stream, const struct printf_info *info, const void *const *args) { int prec; // [rsp+24h] [rbp-14h] int width; // [rsp+28h] [rbp-10h] int val; // [rsp+2Ch] [rbp-Ch] char *addr; // [rsp+30h] [rbp-8h] width = info->width; prec = info->prec; if ( (*((_BYTE *)info + 12) & 0x20) != 0 ) // - flag { addr = &MEM[width]; } else if ( (*((_BYTE *)info + 12) & 0x40) != 0 )// + flag { addr = &MEM[REGISTERS[width]]; } else { addr = (char *)&REGISTERS[width]; } val = 0; if ( (*((_BYTE *)info + 13) & 2) != 0 ) // hh flag { val = *(_DWORD *)&MEM[prec]; } else if ( (*((_BYTE *)info + 12) & 2) != 0 ) // h flag { val = *(_DWORD *)&MEM[REGISTERS[prec]]; } else if ( (*((_BYTE *)info + 12) & 1) != 0 ) // L flag { val = info->prec; } else if ( (*((_BYTE *)info + 12) & 4) != 0 ) // l flag { val = REGISTERS[prec]; } *(_DWORD *)addr = val; return 0LL; } So in summary, these formats defined a VM as follow: A register-based VM that operates on a set of 32-bit registers and an 8-bit accessed memory. It has 11x3x4 arithmetic instructions and 4 call instructions. However, there is one more instruction that is not explicitly defined which is RET. After all, this VM operates on printf, and printf will stop printing at the end of a string. Therefore, a null byte \x00 can be understood as a RET instruction. The binary will jump into this VM using the printf format %F, which then call printf format %52C, which means an unconditional CALL to MEM[52]. Writing an emulator + disassembler Emulating unfamiliar instruction sets is actually one of my interest, so immediately I decided to solve this challenge using an emulator. The first step is to parse each format strings into different fields. My method is a naive one but it works in this case, the steps are: Initiating all fields with there default values. Get the first byte after %, if it’s + then set showsign to 1, if it’s - then set left to 1. Get the next byte after that, if it’s 0 then set pad to '0'. If hh is in the string, set hh to 1, goto step 8. If h is in the string, set h to 1, goto step 8. If ll is in the string, set L to 1, goto step 8. If l is in the string, set l to 1. Get the format type as the last character of the string. If . is in the string, goto 12. From the bottom up, remove all non-digit characters. What is left is width, end. Split the string by ., the first half is width if it’s not empty. From the bottom up of the second half, remove all non-digit characters. What is left is prec, end. def parse_fmt(fmt): fmt = fmt[1:] typ = None prec = -1 width = 0 pad = ord(' ') left = False showsign = False L = False h = False l = False hh = False if fmt[0] == "+": showsign = True fmt = fmt[1:] elif fmt[0] == "-": left = True fmt = fmt[1:] if fmt[0] == "0": pad = ord("0") if "hh" in fmt: hh = True elif "h" in fmt: h = True elif ("ll" in fmt) or ("L" in fmt): L = True elif "l" in fmt: l = True typ = fmt[-1] if "." in fmt: fmt1, fmt2 = fmt.split('.') if len(fmt1) > 0: width = int(fmt1) while not fmt2[-1].isdigit(): fmt2 = fmt2[:-1] prec = int(fmt2) else: while not fmt[-1].isdigit(): fmt = fmt[:-1] width = int(fmt) return (typ, prec, width, pad, left, showsign, l, h, L, hh) With all the fields parsed, we can emulates the instructions easily using the knowledge from the last section. There is a little gimmick here about memory access, because accessing MEM is by 8-bit and REGS is by 32-bit, but the arithmetic instructions treat both of them the same way. Therefore, I have to define both of them as 8-bit arrays and use 2 helper functions load32 and store32 to access the registers. The code for emulating is quite lengthy but straight-forward, everything that needs to be known to implement it has been explained, so I will just leave the code here without explaining more about it. def exec_calc(typ, prec, width, pad, left, showsign, l, h, L, hh): addr = 0 where = 0 val = 0 dbg_cmd = "" dbg_where = "" dbg_addr = "" dbg_val = "" if left: addr = width where = mem dbg_where = "MEM" dbg_addr = str(addr) elif showsign: addr = load32(regs, width*8) where = mem dbg_where = "MEM" dbg_addr = "REGS[{}]".format(str(width)) else: addr = width*8 where = regs dbg_where = "REGS" dbg_addr = str(width) if hh: val = load32(mem, prec) dbg_val = "MEM[{}]".format(prec) elif h: val = load32(mem, load32(regs, prec*8)) dbg_val = "MEM[REGS[{}]]".format(prec) elif L: val = prec dbg_val = str(prec) elif l: val = load32(regs, prec*8) dbg_val = "REGS[{}]".format(prec) left = load32(where, addr) right = val if typ == "M": val = val dbg_cmd = "LOAD" elif typ == "S": val = (load32(where, addr) + val) & 0xffffffff dbg_cmd = "ADD" elif typ == "O": val = (load32(where, addr) - val) & 0xffffffff dbg_cmd = "SUB" elif typ == "X": val = (load32(where, addr) * val) & 0xffffffff dbg_cmd = "MULT" elif typ == "V": val = load32(where, addr) // val dbg_cmd = "DIV" elif typ == "N": val = load32(where, addr) % val dbg_cmd = "MOD" elif typ == "L": val = (load32(where, addr) << val) & 0xffffffff dbg_cmd = "LSHIFT" elif typ == "R": val = (load32(where, addr) >> val) & 0xffffffff dbg_cmd = "RSHIFT" elif typ == "E": val = load32(where, addr) ^ val dbg_cmd = "XOR" elif typ == "I": val = load32(where, addr) & val dbg_cmd = "AND" elif typ == "U": val = load32(where, addr) | val dbg_cmd = "OR" else: print("UNKNOWN TYPE", typ) sys.exit(-1) store32(where, addr, val) print("{} {}[{}], {}".format(dbg_cmd, dbg_where, dbg_addr, dbg_val).ljust(30, " "), end="") print("# addr = {}, val_1 = {}, val_2 = {}, result = {}".format(hex(addr), hex(left), hex(right), hex(val))) def exec_call(typ, prec, width, pad, left, showsign, l, h, L, hh): if typ != "C": print("UNKNOWN TYPE", typ) sys.exit(-1) cmp_flag = True dbg_cmd = "" dbg_reg = prec dbg_addr = width if left: cmp_flag = load32(regs, prec*8) > 0x7fffffff dbg_cmd = "CLZ" elif showsign: cmp_flag = (load32(regs, prec*8) < 0x80000000) and (load32(regs, prec*8) > 0) dbg_cmd = "CGZ" elif pad == ord('0'): cmp_flag = load32(regs, prec*8) == 0 dbg_cmd = "CEZ" else: cmp_flag = True dbg_cmd = "CALL" print("{} REGS[{}], {}".format(dbg_cmd, dbg_reg, dbg_addr).ljust(30, " "), end="") print("# val = {}, cmp_flag = {}".format(load32(regs, prec*8), cmp_flag)) if cmp_flag: execute(width) def execute(init_pc): global regs, mem, s, v pc = init_pc while True: try: next_pc = mem[pc+1:].index(ord("%")) + 1 + pc fmt = ''.join([chr(b) for b in mem[pc:next_pc]]) null = mem[pc+1:].index(ord("\0")) + 1 + pc except: # At the end no more % null = mem[pc+1:].index(ord("\0")) + 1 + pc fmt = ''.join([chr(b) for b in mem[pc:null]]) next_pc = null + 1 fmt = fmt.strip('\0') print("{}".format(pc).ljust(10, " "), end="") print("{}".format(fmt).ljust(30, " "), end="") pc = next_pc typ, prec, width, pad, left, showsign, l, h, L, hh = parse_fmt(fmt) if typ == "C": exec_call(typ, prec, width, pad, left, showsign, l, h, L, hh) else: exec_calc(typ, prec, width, pad, left, showsign, l'''
