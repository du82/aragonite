title = "GoogleCTF2022 - eldar writeups - Midas Blog"
description = "Writeup for GoogleCTF2022 eldar challenge"
full_description = '''GoogleCTF2022 - eldar writeups Midas included in writeups 2022-07-03 4885 words 23 minutes Contents Preface Introduction Analyzing the binary About the ELF relocation metadata machine Writing a VM parser Attempting to one-shot with Z3 Debugging the VM Analyzing the first shuffling algorithm Analyzing the 24-byte buffer checking algorithm Analyzing the last 12 bytes of serial checking algorithm Appendix Note Use the table of contents on the right to navigate to the section that you are interested in. Preface Another year another exotic VM reversing challenge from Google CTF. In my opinion, this year’s challenge is way more difficult and complex than last year, but it is also a lot more interesting as well. There are actually so many little delicate details in this challenge that I don’t think I can recall every single step that I did, but hopefully I can explain how everything works and my solution to solving them. Introduction Challenge Info Given files: eldar, serial.c, Makefile. Description: We found this app on a recent Ubuntu system, but the serial is missing from serial.c. Can you figure out a valid serial? Just put it into serial.c and run the app with make && make run. Category: Reverse engineering Summary: A VM reverse engineering challenge. This VM is created using ELF relocation metadata and symbol metadata. The flag is divided into 2 parts and each of them goes through a series of arithmetic operations and algorithms to reach the final check. Several z3 scripts are required to solve this challenge. TL;DR Analyze eldar file -> it’s just a simple file that takes a value serial from libserial.so that we can compile from serial.c, but the check is nowhere to be seen and instead the relocation section of the file is MASSIVE with tons of relocation metadata. This paper and this talk provide many useful information about using ELF relocation metadata as a VM -> write a script to parse the relocation metadata out as VM instructions. Analyze the VM code -> figure out that the first 16 bytes of serial and the last 12 bytes go through different calculations -> our goal is to make the output of the VM equals to 0. Analyze the first part -> figure out that the first 16 bytes go through a shuffling algorithm to generate a 24 bytes buffer, each 2 bytes of serial correspond to 3 bytes of this buffer -> each byte of the buffer is multiplied by a constant and sum together several times with other negative constants -> the sum needs to be equal to 0 for the output to be 0. Write a script to parse out the constants. Write a z3 script to solve the 24-byte buffer -> bruteforce the first 16 bytes of serial using this result. Analyze the second part -> figure out that the last 12 bytes of serial are treated somewhat the same as the 24-byte buffer, except that not only multiplications, the VM jumps to x86 shellcodes to do bitwise operations as well. Write a script to parse out the multiplication constants from the VM code and the bitwise operations from the pieces of shellcodes. Write a z3 script to solve the last 12 bytes of serial -> combine the 2 parts to get flag. Analyzing the binary The code in the binary itself is super simple. The binary is linked with libserial.so which we can build from the give source file serial.c. This lib’s only purpose is to provide the binary with a string serial in a buffer at address 0x404040, which is expected to be 29 bytes (28 bytes and a NULL byte). There is a value fail at address 0x404060 and if it’s equal to 0, our serial is the correct flag. The problem here is that there is no other code in the binary, there is no function to check serial, no function to set fail. Instead, if we scroll down in IDA to the relocation section at 0x804000, we can see a huge region with an unsual amount of relocation metadata. These metadata are not processed by the binary itself, but instead by the system’s ELF Loader. So the suspicion here is that the binary actually uses the ELF Loader to perform checks on serial before executing itself, using those metadata. By the sheer size of the metadata region, I suspected this to be a VM revering challenge (also because Google CTF loves this kind of weird machine challenges). About the ELF relocation metadata machine This technique of running a “weird” virtual machine using ELF relocation metadata and symbol metadata has been discovered and explained a long time a go in the paper “Weird Machines” in ELF: A Spotlight on the Underappreciated Metadata and the talk Programming Weird Machines with ELF Metadata (yes they were 10 years ago!). The idea is to use the ELF Loader as an interpreter to execute a weird VM with carefully crafted ELF relocation metadata as VM instructions and symbol metadata as registers. In our binary eldar, those metadata is located in the section mapped at address 0x804000, which can be inspected in IDA. The symbol metadata table is located at 0x804064, while the relocation metadata is located at 0x80428A. I’d like to talk about relocation metadata first, because these are our VM instructions. Take a look at the structure of each relocation Elf64_Rela: typedef struct { Elf64_Addr r_offset; Elf64_Xword r_info; Elf64_Sxword r_addend; } Elf64_Rela; #define ELF64_R_SYM(info) ((info)>>32) #define ELF64_R_TYPE(info) ((Elf64_Word)(info)) By looking at a few of them, we can see that r_offset contains an address, r_info contains the type of relocation in the lower 32 bits and the index of a symbol in the higher 32 bits, r_addend contains a value, all of these fields are 64 bits in length. We can dump all of these metadata in a neat and pretty format using the command readelf -r eldar. By quickly looking through the relocation metadata, we can see that the binary uses only 4 types of relocation: R_X86_64_RELATIVE, R_X86_64_COPY, R_X86_64_64 and R_X86_64_32, so basically this VM only has 4 types of instruction. Since out binary doesn’t have PIE, the base address of it is considered to be 0. Let sym be the corresponding ELF64_R_SYM part of r_info, this is how each type of relocation works: R_X86_64_RELATIVE : *r_offset = r_addend R_X86_64_COPY : memcpy(r_offset, sym.value, sym.size) R_X86_64_64 : *r_offset = sym.value + r_addend R_X86_64_32 : *(DWORD*)r_offset = (DWORD)(sym.value + r_addend) Note IDA goes absolutely crazy and wrong when displaying the relocation metadata, I don’t really know why it happens, but it’s better to look at the output of readelf -r when inspecting those. Turns out IDA behaves this way because it tries to apply the relocations and because they are self-modifying, they will go all chaotic. Launching IDA with IDA_NORELOC=1 might fix it. Thanks @aaSSfxxx on Twitter for this info. In this VM, symbols act as registers. By using readelf -s eldar, we can see that the VM uses 10 of them with the names from ^A to ^J: Num: Value Size Type Bind Vis Ndx Name 0: 0000000000000000 0 NOTYPE LOCAL DEFAULT UND 1: 0000000000000000 8 OBJECT LOCAL DEFAULT 1 ^A 2: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^B 3: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^C 4: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^D 5: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^E 6: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^F 7: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^G 8: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^H 9: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^I 10: 0000000000804000 8 OBJECT LOCAL DEFAULT 1 ^J They are located at address 0x804064 as mentioned before, so by writing to this memory region, it can modify the values of its registers. Let’s take a look at the structure of each symbol metadata to understand it more: typedef struct { Elf64_Word st_name; unsigned char st_info; unsigned char st_other; Elf64_Half st_shndx; Elf64_Addr st_value; Elf64_Xword st_size; } Elf64_Sym; This structure is 24 bytes in size. The first 64 bits contains st_name, st_info, st_other and st_shndx, these are not so important yet so I’ll explain them later when needed. Then the last 2 fields contain the value of the symbol (sym.value) and it’s size (sym.size). Therefore, the VM can use R_X86_64_RELATIVE to move an immediate value to a symbol or any place in memory, R_X86_64_64 or R_X86_64_32 to move the value (64 bits or 32 bits, respectively) of a symbol to another symbol or any place in memory, and R_X86_64_COPY to copy the data at the address in a symbol’s value to another place in memory, and by changing sym.size, it can control how many bytes to copy. Note Because the relocation metadata also reside in the same memory region, it can self-modify its “instructions” on the fly as well. This is actually the technique that this VM uses a lot. After understanding how this ELF relocation metadata VM works, I proceeded to write a parser to parse out the instructions and format them in a way that is easy to read. Writing a VM parser Because of the self-modifying nature of this VM, a static code parser is not good enough. Instead, we need to write a parser that also has an emulator inside it, to emulate the execution of the VM at each instruction while parsing them. Luckily for us, there is no jump instruction in this VM, so we can simply emulate and parse the instructions linearly one by one. I used the serial input value of abcdefghijklmnopqrstuvwxyz{\} to easily recognize in the code where our input is used. For the instructions, I decided to print them in the form of <dest> <- <data>. For the symbol registers. I name each of their 8 bytes as FLAG_X, VAL_X and LEN_X, with X being the name of the symbols from A to J. I also associate their exact address in the memory with them for pretty printing: dynsym = 0x80406c regs = {} for i in range(1, 11): regs[dynsym + i*24] = "VAL_" + chr(ord('A') + i - 1) regs[dynsym + 8 + i*24] = "LEN_" + chr(ord('A') + i - 1) regs[dynsym - 8 + i*24] = "TYPE_" + chr(ord('A') + i - 1) Below is the main part of the parser code in parse_opcode.py. while pc < 0xa5a000: print("{:08x}: ".format(pc), end="") r_offset = read64(pc) r_type = read64(pc+8) & 0xffff r_sym = read64(pc+8) >> 32 r_addend = read64(pc+16) print_offset = hex(r_offset)[2:] print_addend = hex(r_addend)[2:] if r_offset in regs: print_offset = regs[r_offset] if r_addend in regs: print_addend = "&" + regs[r_addend] sym_addr = dynsym + r_sym*24 if r_type == 8: write64(r_offset, r_addend) print("{} \t<- {}".format(print_offset, print_addend)) elif r_type == 5: sym_len = read64(sym_addr + 8) writen(r_offset, r_addend + readn(read64(sym_addr), sym_len), sym_len) print("{} \t<- [{} + {}]".format(print_offset, regs[sym_addr], print_addend)) elif r_type == 1: write64(r_offset, r_addend + read64(sym_addr)) print("{} \t<- {} + {}".format(print_offset, regs[sym_addr], print_addend)) elif r_type == 0xa: write32(r_offset, r_addend + read64(sym_addr)) print("{} \t<- DWORD({} + {})".format(print_offset, regs[sym_addr], print_addend)) elif r_type == 0: break else: print("UNKNOWN R_TYPE") break pc += 24 The parser outputs a massive file with 100,000+ lines of instructions. Although this is understandable because the VM can only do assignments and additions, without any control flow instructions, so it will have to unroll every loop and also each mathematical operation takes many instructions to execute. This is a small part of the parsed code for example, reading out input at 0x404040: ... 00806372: VAL_B <- 404040 0080638a: LEN_B <- 1 008063a2: VAL_G <- [VAL_B + 0] 008063ba: VAL_B <- &VAL_G 008063d2: LEN_B <- 8 008063ea: 806412 <- [VAL_B + 0] 00806402: VAL_D <- VAL_D + 804061 0080641a: 806412 <- 0 00806432: 8040cd <- DWORD(VAL_A + 0) 0080644a: VAL_B <- 8042ba 00806462: VAL_F <- [VAL_B + 0] 0080647a: VAL_B <- &VAL_D 00806492: 8064ba <- [VAL_B + 0] 008064aa: VAL_E <- VAL_D + 61 008064c2: 8064ba <- 0 ... Note There is a lot of 804000 <- 0 instructions in the code, this is basically just a NOP instruction. Attempting to one-shot with Z3 As usual with VM flag checker reversing challenges, with the VM code emulator in hand, I decided to try injecting z3 variables to the input and let the emulator solve itself (just like what I did with Google CTF 2021 VM challenge). However, things are not as easy this time. There are some problems that prevents this approach to success: The first algorithm in the VM code uses out input as index to memory, both on ther read side and on the write side. Unfortunately, z3 variables can’t be used as array index, and using z3 Array() to model the whole VM memory is not feasible at all. The final part of the VM code actually jumps to x86 shellcode to execute them, then jump back to VM code (will explain later). A lot more work would be needed to parse and emulate those code as well. There are way too many operations that z3 might not be able to solve by itself without manual simplification (not so sure about this one). Therefore, in the end, I had to go back to the good old way of doing proper reversing on the VM code to understand its algorithm. Debugging the VM As I said, the VM code is quite complex, so statically reading the code and writing scripts are error-prone methods. I needed a way to verify if my assumptions are correct or not. To do this, the easiest way is to debug the VM code. However, this VM is special: relocation metadata are processed by the ELF Loader, not by the binary itself, so debugging the binary is useless because the VM already finishes executing the moment the binary starts to run. The first debugging method that comes to mind is to debug the loader itself. We can see what loader the binary use with the command ldd eldar, in my case it’s /lib64/ld-linux-x86-64.so.2. Then we can run /lib64/ld-linux-x86-64.so.2 ./eldar to run the loader on the binary and debug it this way. However, the loader is a very big program that does multiple different things, not just processing relocation metadata. This method for me is purely pain and suffering to even try. The method that I used is that I wrote a simple script to patch the binary and remove parts of relocation metadata. For example, if I want to debug the VM up to the instruction at address 0x956c42, I can just remove all metadata from address 0x956c5a onwards, then set a breakpoint at the binary’s main and inspect the memory of the VM region. This is indeed quite time-consuming, but it’s super easy to do. data = open("eldar", "rb").read() start = 0x956c5a - 0x800000 end = 0xa59d3a - 0x800000 new_data = data[:start] + b"\0"*(end-start) + data[end:] open("eldar-test", "wb").write(new_data) Now that we have all the tools ready to reverse the code, let me try to explain its algorithms part by part. Analyzing the first shuffling algorithm By searching for the address of out input bytes from 0x404040 to 0x40405b, I realized that serial is divided into 2 parts that get checked separately: the first 16 bytes and the last 12 bytes. The first 16 bytes go through 2 stages of calculations and this part will explain the first. The first algorithm to be applied on the first 16 bytes starts at address 0x804ae2 and ends at 0x97eb2a. Here I'''
