["https://llvm.org/Users.html"]
title = "The LLVM Compiler Infrastructure Project"
full_description = 'This page lists the people and organizations that have used or are currently using LLVM in research, education, industry, or open source development. It only includes users who have publicly discussed their use of LLVM in one form or another (mentioned it on llvm-dev, published work on it, etc.). We believe there are many other users not listed here and would welcome a brief note telling us about your use so that we can add you to the list. This page has only brief entries. Some of these projects are described in more detail on the "Projects Using LLVM" page. All of Apple’s operating systems, iOS, macOS, tvOS and watchOS, are built with LLVM technologies. And Xcode, Apple’s integrated development environment, supports development in Swift, C, C++, and Objective-C, all of which use and are built with LLVM technologies. Apple’s implementations of OpenCL and OpenGL, the Metal Shading Language, Core Image, and macOS graphics drivers also use LLVM technologies. WebKit Meta 2.0 SDK includes a specialized LLVM/clang toolchain for web application and game development featuring transparent C++ DOM and JavaScript bridging. C++/CLI NG is a clang-based .NET compiler that embraces and extends the Microsoft / ECMA-372 language standard.'
year_published = 2025
