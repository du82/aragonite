["https://llvm.org/devmtg/2019-10"]
title = "The LLVM Compiler Infrastructure Project"
full_description = "The LLVM Developers' Meeting is a bi-annual 2 day gathering of the entire LLVM Project community. The conference is organized by the LLVM Foundation and many volunteers within the LLVM community. Developers and users of LLVM, Clang, and related subprojects will enjoy attending interesting talks, impromptu discussions, and networking with the many members of our community. Whether you are a new to the LLVM project or a long time member, there is something for each attendee. The LLVM Developers' Meeting strives to be the best conference to meet other LLVM developers and users. The LLVM Foundation will host a half day Women in Compilers and Tools Workshop held the day before the 2019 LLVM Developers’ Meeting - Bay Area. The workshop will be held at the Fairmont Hotel on October 21st from 12:30-5:30PM and includes a cocktail reception. This event aims to connect women in the field of compilers and tools and provide them with ideas and techniques to overcome barriers or enhance their careers. It also is open to anyone (not just women) who are interested in increasing diversity within the LLVM community, their workplace or university. The online schedule may be found here: https://llvmdevmtg2019.sched.com. Bookmark this on your mobile device. Round tables are informal get togethers where attendees talk about a specific subject. Each group will be given a round table and a flip chart to discuss and brainstorm ideas on a specific topic. If you are interested in organizing a round table discussion, please use the link above. Round tables may be arranged during the conference, but it is better to schedule in advance so it appears ahead of time on the online schedule. During the conference we will attempt to put the topics online, but we will also list them on a flip chart outside the room where you can add it yourself. The LLVM Foundation sponsors student travel to attend the LLVM Developers' Meeting. Travel grants cover some or all of travel related expenses. This program is open to full time undergraduate and graduate students."
