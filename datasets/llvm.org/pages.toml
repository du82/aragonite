project/labels/bugzilla","__typename":"Label"},"cursor":"MQ"},{"node":{"id":"LA_kwDOBITxeM7XITWI","color":"6699cc","name":"code-cleanup","nameHTML":"code-cleanup","description":null,"url":"https://github.com/llvm/llvm-project/labels/code-cleanup","__typename":"Label"},"cursor":"Mg"},{"node":{"id":"LA_kwDOBITxeM7XIW-0","color":"6699cc","name":"llvm:core","nameHTML":"llvm:core","description":null,"url":"https://github.com/llvm/llvm-project/labels/llvm%3Acore","__typename":"Label"},"cursor":"Mw"}],"pageInfo":{"endCursor":"Mw","hasNextPage":false}},"__isNode":"Issue","assignees":{"nodes":[]},"milestone":null,"databaseId":1071016122,"viewerDidAuthor":false,"locked":false,"author":{"__typename":"User","__isActor":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw","profileUrl":"https://github.com/lattner","avatarUrl":"https://avatars.githubusercontent.com/u/15152540?u=bb801174d6fe5cea542dfb3ff8c59a2b55c0b5e0\u0026v=4"},"__isComment":"Issue","body":"| | |\n| --- | --- |\n| Bugzilla Link | [10367](https://llvm.org/bz10367) |\n| Resolution | FIXED |\n| Resolved on | Jun 02, 2014 21:54 |\n| Version | 1.0 |\n| OS | All |\n| CC | @asl,@majnemer,@jayfoad,@arsenm,@pcc,@rnk,@TNorthover |\n\n## Extended Description \nGlobal alias is currently defined to have its own type, and then have an initializer of the same type. The initializer is a \"Constant*\" which is either a) a global value, b) a constant expr bitcast, c) a constantexpr gep with all zero indices, d) null (which isn't valid, but transiently happens).\n\nThis doesn't make sense for a number of reasons. Instead, the initializer of a GlobalAlias should be required to be a GlobalValue, but the type of the source and dest of the alias should not be required to be the same, they should just be completely decoupled.\n\n-Chris","bodyHTML":"\u003cmarkdown-accessiblity-table\u003e\u003ctable role=\"table\"\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBugzilla Link\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://llvm.org/bz10367\" rel=\"nofollow\"\u003e10367\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eResolution\u003c/td\u003e\n\u003ctd\u003eFIXED\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eResolved on\u003c/td\u003e\n\u003ctd\u003eJun 02, 2014 21:54\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVersion\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOS\u003c/td\u003e\n\u003ctd\u003eAll\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCC\u003c/td\u003e\n\u003ctd\u003e\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/asl/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/asl\"\u003e@asl\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/majnemer/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/majnemer\"\u003e@majnemer\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/jayfoad/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/jayfoad\"\u003e@jayfoad\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/arsenm/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/arsenm\"\u003e@arsenm\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/pcc/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/pcc\"\u003e@pcc\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/rnk/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/rnk\"\u003e@rnk\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/TNorthover/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/TNorthover\"\u003e@TNorthover\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/markdown-accessiblity-table\u003e\n\u003ch2 dir=\"auto\"\u003eExtended Description\u003c/h2\u003e\n\u003cp dir=\"auto\"\u003eGlobal alias is currently defined to have its own type, and then have an initializer of the same type. The initializer is a \"Constant*\" which is either a) a global value, b) a constant expr bitcast, c) a constantexpr gep with all zero indices, d) null (which isn't valid, but transiently happens).\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThis doesn't make sense for a number of reasons. Instead, the initializer of a GlobalAlias should be required to be a GlobalValue, but the type of the source and dest of the alias should not be required to be the same, they should just be completely decoupled.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003e-Chris\u003c/p\u003e","bodyVersion":"cd5865f89ebd6d68e7cb6173192da69c1843d47a37ccaaaf8431aee99da27ae9","createdAt":"2011-07-15T08:25:33Z","__isReactable":"Issue","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"viewerCanUpdateMetadata":false,"viewerCanComment":false,"viewerCanAssign":false,"viewerCanLabel":false,"__isIssueOrPullRequest":"Issue","projectItemsNext":{"edges":[],"pageInfo":{"endCursor":null,"hasNextPage":false}},"viewerCanSetMilestone":false,"isPinned":false,"viewerCanDelete":false,"viewerCanTransfer":false,"viewerCanConvertToDiscussion":false,"viewerCanLock":false,"viewerCanType":false,"frontTimelineItems":{"pageInfo":{"hasNextPage":true,"endCursor":"Y3Vyc29yOnYyOpPPAAABRClpXZgAqTk4MDg5NzU3NQ=="},"totalCount":17,"edges":[{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980897589,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDU6SXNzdWUxMDcxMDE2MTIy","number":10739,"locked":false,"databaseId":1071016122},"author":{"__typename":"User","login":"asl","avatarUrl":"https://avatars.githubusercontent.com/u/67392?u=9f657dd5773037fe1915aa6f5574f0727c75cd93\u0026v=4","id":"MDQ6VXNlcjY3Mzky"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDg5NzU4OQ==","body":"But what are these reasons? Right now everyone can look \"through\" alias without thinking how it should interpret the stuff.","bodyHTML":"\u003cp dir=\"auto\"\u003eBut what are these reasons? Right now everyone can look \"through\" alias without thinking how it should interpret the stuff.\u003c/p\u003e","bodyVersion":"afaa4b76a28a90b8d7713ab42309c95665331df7a1c63cecb53169df50fa2819","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/10739#issuecomment-980897589","createdAt":"2011-07-15T11:58:38Z","authorAssociation":"COLLABORATOR","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":