["https://llvm.org/devmtg/2019-04"]
title = "The LLVM Compiler Infrastructure Project"
full_description = "The LLVM developers' meeting is a bi-annual 2 day gathering of the entire LLVM Project community. The conference is organized by the LLVM Foundation and many volunteers within the LLVM community. Developers and users of LLVM, Clang, and related subprojects will enjoy attending interesting talks, impromptu discussions, and networking with the many members of our community. Whether you are a new to the LLVM project or a long time member, there is something for each attendee. The LLVM developers' meetings strive to be the best conference to meet other LLVM developers and users. After several Women in Compiler's and Tools events that generated amazing discussions and ideas, it is now time to turn the focus on action and change. One such area that has been consistently brought up in conversations between WiCT attendees, LLVM Developers, and students is how the LLVM project is viewed from a newcomer's perspective. While our community is open and inviting, our documentation, tutorials, and web presence is challenging for a newcomer to navigate and get involved. Changing this is critical to the long term success of the LLVM project as it is not only a barrier for more women to learn about LLVM and compilers, but a barrier to everyone. The focus of this workshop will be on documentation and removing barriers for newcomers. If you are interested in helping make the LLVM Project more approachable for newcomers and increasing diversity, then please attend this workshop! The LLVM Foundation sponsors student travel to attend the LLVM developers' meeting. Travel grants cover some or all of travel related expenses. This program is open to full time undergraduate and graduate students. The LLVM Foundation is dedicated to providing an inclusive and safe experience for everyone. We do not tolerate harassment of participants in any form. By registering for this event, we expect you to have read and agree to the LLVM Code of Conduct."
year_published = 2025
