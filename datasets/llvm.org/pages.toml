 that the non optimized LLVM code I was getting of\nthe attached C++ code was related to this issue.\nIt becomes optimized when the string 's' becomes small, like \"this\".","bodyHTML":"\u003cp dir=\"auto\"\u003e\u003ca href=\"https://user-images.githubusercontent.com/60944935/143736335-8af5dfbc-8458-4f05-8022-56c8a29c7089.gz\" rel=\"nofollow\"\u003eEdits a hard-coded string in an unrolled loop\u003c/a\u003e\u003cbr\u003e\nI was told in the IRC channel that the non optimized LLVM code I was getting of\u003cbr\u003e\nthe attached C++ code was related to this issue.\u003cbr\u003e\nIt becomes optimized when the string 's' becomes small, like \"this\".\u003c/p\u003e","bodyVersion":"f633a096bdf19b66c13eef9001b43287c7cbc6294c51f1ffcc0922b5123abdf2","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/824#issuecomment-980854322","createdAt":"2007-04-05T23:57:46Z","authorAssociation":"MEMBER","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/llvm"},"isPrivate":false,"slashCommandsEnabled":false,"nameWithOwner":"llvm/llvm-project","databaseId":75821432},"__isComment":"IssueComment","viewerCanReadUserContentEdits":true,"lastEditedAt":null,"lastUserContentEdit":null,"__isReactable":"IssueComment","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactor