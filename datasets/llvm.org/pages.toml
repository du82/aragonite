full_description = '''llvm / llvm-project Public Notifications You must be signed in to change notification settings Fork 12.7k Star 30.9k Code Issues 5k+ Pull requests 3.8k Actions Security Insights Additional navigation options Code Issues Pull requests Actions Security Insights {"payload":{"preloaded_records":{},"preloadedQueries":[{"queryId":"cd87f7430f54aadbc3796a541edfe198","queryName":"IssueViewerViewQuery","variables":{"id":"repository","number":2488,"owner":"llvm","repo":"llvm-project"},"result":{"data":{"repository":{"isOwnerEnterpriseManaged":false,"issue":{"id":"MDU6SXNzdWUxMDcwOTM2MDQ0","updatedAt":"2023-08-15T13:17:22Z","title":"Add support for 'transactions' in the pass manager","number":2488,"repository":{"nameWithOwner":"llvm/llvm-project","id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","login":"llvm","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","url":"https://github.com/llvm"},"hasAnyTemplates":false,"isSecurityPolicyEnabled":true,"isArchived":false,"isPrivate":false,"databaseId":75821432,"slashCommandsEnabled":false,"viewerCanInteract":false,"viewerInteractionLimitReasonHTML":"","planFeatures":{"maximumAssignees":10},"visibility":"PUBLIC","pinnedIssues":{"totalCount":0},"viewerCanPinIssues":false,"issueTypes":{"edges":[{"node":{"id":"IT_kwDOAQWwKc4AIvNg"}},{"node":{"id":"IT_kwDOAQWwKc4AIvNj"}},{"node":{"id":"IT_kwDOAQWwKc4AIvNl"}}]}},"titleHTML":"Add support for 'transactions' in the pass manager","url":"https://github.com/llvm/llvm-project/issues/2488","viewerCanUpdateNext":false,"issueType":null,"state":"OPEN","stateReason":null,"duplicateOf":null,"linkedPullRequests":{"nodes":[]},"subIssuesSummary":{"total":0,"completed":0},"__isLabelable":"Issue","labels":{"edges":[{"node":{"id":"LA_kwDOBITxeM7Wz_4q","color":"29A8A3","name":"bugzilla","nameHTML":"bugzilla","description":"Issues migrated from bugzilla","url":"https://github.com/llvm/llvm-project/labels/bugzilla","__typename":"Label"},"cursor":"MQ"},{"node":{"id":"MDU6TGFiZWw0OTYxNjk3ODU=","color":"84b6eb","name":"enhancement","nameHTML":"enhancement","description":"Improving things as opposed to bug fixing, e.g. new or missing feature","url":"https://github.com/llvm/llvm-project/labels/enhancement","__typename":"Label"},"cursor":"Mg"},{"node":{"id":"LA_kwDOBITxeM7XIW-0","color":"6699cc","name":"llvm:core","nameHTML":"llvm:core","description":null,"url":"https://github.com/llvm/llvm-project/labels/llvm%3Acore","__typename":"Label"},"cursor":"Mw"}],"pageInfo":{"endCursor":"Mw","hasNextPage":false}},"__isNode":"Issue","assignees":{"nodes":[]},"milestone":null,"databaseId":1070936044,"viewerDidAuthor":false,"locked":false,"author":{"__typename":"User","__isActor":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw","profileUrl":"https://github.com/lattner","avatarUrl":"https://avatars.githubusercontent.com/u/15152540?u=bb801174d6fe5cea542dfb3ff8c59a2b55c0b5e0\u0026v=4"},"__isComment":"Issue","body":"| | |\n| --- | --- |\n| Bugzilla Link | [2116](https://llvm.org/bz2116) |\n| Version | 2.2 |\n| OS | All |\n| CC | @asl,@chandlerc,@nlewycky |\n\n## Extended Description \nLots of passes operate by making incremental changes to a function: instcombine iterates through a worklist, mem2reg promotes allocas one at a time, and the inliner inlines a function one at a time. Before and after each transformation, the IR is valid, and could be snapshotted. It would be really awesome to expose this behavior through to the passmanager to allow the verifier to be run after each transaction and for bugpoint to be able to reduce bugs down to the level of a single transaction.\n\nI haven't thought fully about how this would work, but it seems that a pass should be able to opt-in to the transaction system. Each time it does something, it should bump the per-pass counter (which is owned/maintained by the passmgr) and before it does a transaction it checks some counter or something. If the counter is reaches zero, then it stops making transformations.\n\nThis is a fairly large and open ended project, but would be incredibly valuable for tracking down nasty bugs, particularly miscompilations.","bodyHTML":"\u003cmarkdown-accessiblity-table\u003e\u003ctable role=\"table\"\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBugzilla Link\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://llvm.org/bz2116\" rel=\"nofollow\"\u003e2116\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVersion\u003c/td\u003e\n\u003ctd\u003e2.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOS\u003c/td\u003e\n\u003ctd\u003eAll\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCC\u003c/td\u003e\n\u003ctd\u003e\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/asl/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/asl\"\u003e@asl\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/chandlerc/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/chandlerc\"\u003e@chandlerc\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/nlewycky/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/nlewycky\"\u003e@nlewycky\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/markdown-accessiblity-table\u003e\n\u003ch2 dir=\"auto\"\u003eExtended Description\u003c/h2\u003e\n\u003cp dir=\"auto\"\u003eLots of passes operate by making incremental changes to a function: instcombine iterates through a worklist, mem2reg promotes allocas one at a time, and the inliner inlines a function one at a time. Before and after each transformation, the IR is valid, and could be snapshotted. It would be really awesome to expose this behavior through to the passmanager to allow the verifier to be run after each transaction and for bugpoint to be able to reduce bugs down to the level of a single transaction.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eI haven't thought fully about how this would work, but it seems that a pass should be able to opt-in to the transaction system. Each time it does something, it should bump the per-pass counter (which is owned/maintained by the passmgr) and before it does a transaction it checks some counter or something. If the counter is reaches zero, then it stops making transformations.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThis is a fairly large and open ended project, but would be incredibly valuable for tracking down nasty bugs, particularly miscompilations.\u003c/p\u003e","bodyVersion":"a00ba72e380d4d1c0722db70806b890139bc022b6a2a0cad315a17629ded37b4","createdAt":"2008-03-01T11:23:58Z","__isReactable":"Issue","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"viewerCanUpdateMetadata":false,"viewerCanComment":false,"viewerCanAssign":false,"viewerCanLabel":false,"__isIssueOrPullRequest":"Issue","projectItemsNext":{"edges":[],"pageInfo":{"endCursor":null,"hasNextPage":false}},"viewerCanSetMilestone":false,"isPinned":false,"viewerCanDelete":false,"viewerCanTransfer":false,"viewerCanConvertToDiscussion":false,"viewerCanLock":false,"viewerCanType":false,"frontTimelineItems":{"pageInfo":{"hasNextPage":false,"endCursor":"Y3Vyc29yOnYyOpPPAAABiflYAtABqzEwMDk2OTUwNjU1"},"totalCount":4,"edges":[{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980863594,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDU6SXNzdWUxMDcwOTM2MDQ0","number":2488,"locked":false,"databaseId":1070936044},"author":{"__typename":"User","login":"llvmbot","avatarUrl":"https://avatars.githubusercontent.com/u/60944935?v=4","id":"MDQ6VXNlcjYwOTQ0OTM1"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDg2MzU5NA==","body":"I got here via the open projects page.\n\nIs this something we still want to do? It looks like we could get most of the benefit by just doing something like IfCvtLimit. That is, add a debug command line option -max-transforms that each pass can check to see how many inlines, if conversions, alloca promotions, etc it should do.\n\nIf bugpoint gets down to a single pass, it can try \"-max-transforms 0\" to see if that pass supports limiting the amount of work it does.","bodyHTML":"\u003cp dir=\"auto\"\u003eI got here via the open projects page.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eIs this something we still want to do? It looks like we could get most of the benefit by just doing something like IfCvtLimit. That is, add a debug command line option -max-transforms that each pass can check to see how many inlines, if conversions, alloca promotions, etc it should do.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eIf bugpoint gets down to a single pass, it can try \"-max-transforms 0\" to see if that pass supports limiting the amount of work it does.\u003c/p\u003e","bodyVersion":"6708eccefb7c7a500b666a217cd6781f465a08ee9a41d9f35ea8e29c4b0873e6","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/2488#issuecomment-980863594","createdAt":"2014-03-14T15:07:37Z","authorAssociation":"MEMBER","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/llvm"},"isPrivate":false,"slashCommandsEnabled":false,"nameWithOwner":"llvm/llvm-project","databaseId":75821432},"__isComment":"IssueComment","viewerCanReadUserContentEdits":true,"lastEditedAt":null,"lastUserContentEdit":null,"__isReactable":"IssueComment","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"__isNode":"IssueComment"},"cursor":"Y3Vyc29yOnYyOpPPAAABRMEiVqgAqTk4MDg2MzU5NA=="},{"node":{"__typename":"TransferredEvent","__isIssueTimelineItems":"TransferredEvent","__isTimelineEvent":"TransferredEvent","databaseId":5714198445,"createdAt":"2021-12-03T20:19:05Z","actor":{"__typename":"User","login":"llvmbot","id":"MDQ6VXNlcjYwOTQ0OTM1","__isActor":"User","avatarUrl":"https://avatars.git