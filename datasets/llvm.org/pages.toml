title = "The LLVM Compiler Infrastructure Project"
full_description = "The LLVM Developers' Meeting is a bi-annual gathering of the entire LLVM Project community. The conference is organized by the LLVM Foundation and many volunteers within the LLVM community. Developers and users of LLVM, Clang, and related subprojects will enjoy attending interesting talks, impromptu discussions, and networking with the many members of our community. Whether you are a new to the LLVM project or a long time member, there is something for each attendee. To see the agenda, speakers, and register, please visit the Event Site here:https://llvm.swoogo.com/2021devmtg/ The LLVM Developers' Meeting strives to be the best conference to meet other LLVM developers and users. The LLVM Foundation is dedicated to providing an inclusive and safe experience for everyone. We do not tolerate harassment of participants in any form. By registering for this event, we expect you to have read and agree to the LLVM Code of Conduct."
