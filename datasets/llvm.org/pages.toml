["https://llvm.org/devmtg/2013-04"]
title = "The LLVM Compiler Infrastructure Project"
full_description = '''"We are pleased to announce the third European LLVM conference on April 29-30 2013 in Paris, France. This will be a two day conference which aims to present the latest developments in the LLVM world and help strengthen the network of LLVM developers. The format will be similar to that of the previous meetings held in London but with more time for presentations and networking. The meeting is open to anyone whether from business or academia, professional or enthusiast and is not restricted to those from Europe - attendees from all regions are welcome." At the end of the event we had 91 questionnaires returned and the results were pretty good. Below are some overall results, but each presenter will receive the results of their own talks by personal email. Each question had a range of four possible results (excellent-poor, very useful-waste of time, etc), and below are the percentage of the results that were 1 or 2 (excellent+good, very useful+useful, etc). We're not considering "average" as a positive result, for obvious reasons. At the end, there's a table with the percentages of a geometric mean of all talks and another for the lightning talks, so you can get a feel of the response without going in too much detail. (*) Positive results for this question are those that answered "disagree" and "strongly disagree", since we expected that the talks shouldn't required too much detailed knowledge to understand, specially from a crowd as specialized as ours. Dagger: decompilation to LLVM IR Ahmed Bougacha Dagger is a decompilation framework based on LLVM. It enables existing backends to easily provide instruction-level semantics. These are then used to translate target instructions to an IR-like architecture, Mir (for micro-IR), and further to LLVM IR itself. Dagger also enables easy retargetability of several planned tools, like rewriters, static or dynamic binary translators (with valgrind-like instrumentation), and even simple instruction set emulators. The IR can also be transformed to do static analysis, or even, using a revived and improved C backend, full-blown decompilation.'''
