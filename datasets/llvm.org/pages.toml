ITxeM7XIW_L","color":"6699cc","name":"code-quality","nameHTML":"code-quality","description":null,"url":"https://github.com/llvm/llvm-project/labels/code-quality","__typename":"Label"},"cursor":"Mg"}],"pageInfo":{"endCursor":"Mg","hasNextPage":false}},"__isNode":"Issue","assignees":{"nodes":[]},"milestone":null,"databaseId":1070922425,"viewerDidAuthor":false,"locked":false,"author":{"__typename":"User","__isActor":"User","login":"llvmbot","id":"MDQ6VXNlcjYwOTQ0OTM1","profileUrl":"https://github.com/llvmbot","avatarUrl":"https://avatars.githubusercontent.com/u/60944935?v=4"},"__isComment":"Issue","body":"| | |\n| --- | --- |\n| Bugzilla Link | [1604](https://llvm.org/bz1604) |\n| Resolution | LATER |\n| Resolved on | Oct 15, 2008 11:06 |\n| Version | unspecified |\n| OS | Windows XP |\n| Reporter | LLVM Bugzilla Contributor |\n\n## Extended Description \nWith this simple C++ code:\n\n#include \u003ccstdio\u003e\n\nstruct test\n{\n int val;\n virtual ~test() {}\n};\n\nint main()\n{\n test t;\n std::scanf(\"%d\", \u0026t.val);\n std::printf(\"%d\\n\", t.val);\n}\n\nLLVM generates a lot of unneeded things:\n\ntarget datalayout = \"e-p:32:32:32-i1:8:8-i8:8:8-i16:16:16-i32:32:32-i64:32:64-f32:32:32-f64:32:64-v64:64:64-v128:128:128-a0:0:64\"\ntarget triple = \"i686-pc-linux-gnu\"\n\t%struct.__class_type_info_pseudo = type { %struct.__type_info_pseudo }\n\t%struct.__type_info_pseudo = type { i8*, i8* }\n\t%struct.test = type { i32 (...)**, i32 }\n@\u0026#8203;_ZTV4test = internal constant [4 x i32 (...)*] [ i32 (...)* null, i32 (...)* bitcast (%struct.__class_type_info_pseudo* @\u0026#8203;_ZTI4test to i32 (...)*), i32 (...)* bitcast (void (%struct.test*)* @\u0026#8203;_ZN4testD1Ev to i32 (...)*), i32 (...)* bitcast (void (%struct.test*)* @\u0026#8203;_ZN4testD0Ev to i32 (...)*) ], align 8\t\t; \u003c[4 x i32 (...)*]*\u003e [#uses=1]\n@\u0026#8203;_ZTI4test = internal constant %struct.__class_type_info_pseudo { %struct.__type_info_pseudo { i8* inttoptr (i32 add (i32 ptrtoint ([0 x i32 (...)*]* @\u0026#8203;_ZTVN10__cxxabiv117__class_type_infoE to i32), i32 8) to i8*), i8* getelementptr ([6 x i8]* @\u0026#8203;_ZTS4test, i32 0, i32 0) } }\t\t; \u003c%struct.__class_type_info_pseudo*\u003e [#uses=1]\n@\u0026#8203;_ZTVN10__cxxabiv117__class_type_infoE = external constant [0 x i32 (...)*]\t\t; \u003c[0 x i32 (...)*]*\u003e [#uses=1]\n@\u0026#8203;_ZTS4test = internal constant [6 x i8] c\"4test\\00\"\t\t; \u003c[6 x i8]*\u003e [#uses=1]\n@.str = internal constant [3 x i8] c\"%d\\00\"\t\t; \u003c[3 x i8]*\u003e [#uses=1]\n@.str1 = internal constant [4 x i8] c\"%d\\0A\\00\"\t\t; \u003c[4 x i8]*\u003e [#uses=1]\n\ndefine i32 @\u0026#8203;main() {\nentry:\n\t%t = alloca %struct.test, align 16\t\t; \u003c%struct.test*\u003e [#uses=2]\n\t%tmp2 = getelementptr %struct.test* %t, i32 0, i32 0\t\t; \u003ci32 (...)***\u003e [#uses=1]\n\tstore i32 (...)** getelementptr ([4 x i32 (...)*]* @\u0026#8203;_ZTV4test, i32 0, i64 2), i32 (...)*** %tmp2\n\t%tmp4 = getelementptr %struct.test* %t, i32 0, i32 1\t\t; \u003ci32*\u003e [#uses=2]\n\t%tmp5 = call i32 (i8*, ...)* @\u0026#8203;scanf( i8* getelementptr ([3 x i8]* @.str, i32 0, i32 0), i32* %tmp4 )\t\t; \u003ci32\u003e [#uses=0]\n\t%tmp7 = load i32* %tmp4\t\t; \u003ci32\u003e [#uses=1]\n\t%tmp10 = call i32 (i8*, ...)* @\u0026#8203;printf( i8* getelementptr ([4 x i8]* @.str1, i32 0, i32 0), i32 %tmp7 )\t\t; \u003ci32\u003e [#uses=0]\n\tret i32 0\n}\n\ndefine internal void @\u0026#8203;_ZN4testD1Ev(%struct.test* %this) {\nentry:\n\t%tmp2 = getelementptr %struct.test* %this, i32 0, i32 0\t\t; \u003ci32 (...)***\u003e [#uses=1]\n\tstore i32 (...)** getelementptr ([4 x i32 (...)*]* @\u0026#8203;_ZTV4test, i32 0, i64 2), i32 (...)*** %tmp2\n\tret void\n}\n\ndefine internal void @\u0026#8203;_ZN4testD0Ev(%struct.test* %this) {\nentry:\n\t%tmp2 = getelementptr %struct.test* %this, i32 0, i32 0\t\t; \u003ci32 (...)***\u003e [#uses=1]\n\tstore i32 (...)** getelementptr ([4 x i32 (...)*]* @\u0026#8203;_ZTV4test, i32 0, i64 2), i32 (...)*** %tmp2\n\t%tmp56 = bitcast %struct.test* %this to i8*\t\t; \u003ci8*\u003e [#uses=1]\n\ttail call void @\u0026#8203;_ZdlPv( i8* %tmp56 )\n\tret void\n}\n\ndeclare void @\u0026#8203;_ZdlPv(i8*)\n\ndeclare i32 @\u0026#8203;scanf(i8*, ...)\n\ndeclare i32 @\u0026#8203;printf(i8*, ...)\n\nNone of the internal (apart from string literals) and external constants and the @\u0026#8203;_ZN4testD1Ev and @\u0026#8203;_ZN4testD0Ev functions are useful at all.\nFor example, if there is no scanf performed (initialized to 0 instead), we get the following code:\n\ntarget datalayout = \"e-p:32:32:32-i1:8:8-i8:8:8-i16:16:16-i32:32:32-i64:32:64-f32:32:32-f64:32:64-v64:64:64-v128:128:128-a0:0:64\"\ntarget triple = \"i686-pc-linux-gnu\"\n\t%struct.test = type { i32 }\n@.str = internal constant [4 x i8] c\"%d\\0A\\00\"\t\t; \u003c[4 x i8]*\u003e [#uses=1]\n\ndefine i32 @\u0026#8203;main() {\nentry:\n\t%tmp4 = tail call i32 (i8*, ...)* @\u0026#8203;printf( i8* getelementptr ([4 x i8]* @.str, i32 0, i32 0), i32 0 )\t\t; \u003ci32\u003e [#uses=0]\n\tret i32 0\n}\n\ndeclare i32 @\u0026#8203;printf(i8*, ...)\n\nIt seems that because scanf takes a pointer to a member of test, the test object must be kept as it is, including the pointer to the vtable, and the vtable itself must thus stay in the code.\nHowever it's only a member of test, not a test object itself, so this is not really needed.\nIs this a bug or this is normal behaviour? If it's not a bug, would there be a way to instruct the compiler or extend the language in a way where it would be possible to elide the unneeded bloat?","bodyHTML":"\u003cmarkdown-accessiblity-table\u003e\u003ctable role=\"table\"\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBugzilla Link\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://llvm.org/bz1604\" rel=\"nofollow\"\u003e1604\u003c/a\u003e\