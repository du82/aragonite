full_description = "Check to see if the loop has a canonical induction variable: an integer recurrence that starts at 0 and increments by one each time through the loop. References llvm::LoopBase< BasicBlock, Loop >::getHeader(), getIncomingAndBackEdge(), llvm::PHINode::getIncomingValueForBlock(), H, and I. References assert(), llvm::LoopBase< BasicBlock, Loop >::contains(), llvm::LoopBase< BasicBlock, Loop >::getHeader(), H, llvm::pred_begin(), llvm::pred_end(), and std::swap(). Note: the induction variable doesn't need to be canonical, i.e. starts at zero and increments by one each time through the loop (but it can be). References assert(), llvm::LoopBase< BasicBlock, Loop >::getHeader(), getLatchCmpInst(), llvm::LoopBase< BasicBlock, Loop >::getLoopLatch(), llvm::User::getOperand(), llvm::InductionDescriptor::isInductionPHI(), and isLoopSimplifyForm(). References DL, llvm::drop_begin(), llvm::LoopBase< BasicBlock, Loop >::getHeader(), getLoopID(), and llvm::LoopBase< BasicBlock, Loop >::getLoopPreheader(). Return a string containing the debug location of the loop (file name + line number if present, otherwise module name). References llvm::LoopBase< BasicBlock, Loop >::getHeader(), llvm::Module::getModuleIdentifier(), llvm::GlobalValue::getParent(), llvm::BasicBlock::getParent(), getStartLoc(), and OS. This currently only works on simplified loop, as it requires a preheader and a latch to identify the guard. It will work on loops of the form: References assert(), llvm::LoopBase< BasicBlock, Loop >::getLoopLatch(), llvm::LoopBase< BasicBlock, Loop >::getLoopPreheader(), llvm::BranchInst::getSuccessor(), llvm::BasicBlock::getTerminator(), llvm::LoopBase< BasicBlock, Loop >::getUniqueExitBlock(), llvm::BasicBlock::getUniquePredecessor(), isLoopSimplifyForm(), isRotatedForm(), llvm::BranchInst::isUnconditional(), and llvm::LoopNest::skipEmptyBlockUntil(). If this loop contains the same llvm.loop metadata on each branch to the header then the node is returned. If any latch instruction does not contain llvm.loop or if multiple latches contain different nodes then 0 is returned."
