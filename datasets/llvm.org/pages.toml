["https://llvm.org/docs/Passes.html"]
title = "LLVM’s Analysis and Transform Passes — LLVM 21.0.0git documentation"
full_description = "LLVM’s Analysis and Transform Passes¶ Introduction Analysis Passes aa-eval: Exhaustive Alias Analysis Precision Evaluator basic-aa: Basic Alias Analysis (stateless AA impl) basiccg: Basic CallGraph Construction da: Dependence Analysis domfrontier: Dominance Frontier Construction domtree: Dominator Tree Construction dot-callgraph: Print Call Graph to “dot” file dot-cfg: Print CFG of function to “dot” file dot-cfg-only: Print CFG of function to “dot” file (with no function bodies) dot-dom: Print dominance tree of function to “dot” file dot-dom-only: Print dominance tree of function to “dot” file (with no function bodies) dot-post-dom: Print postdominance tree of function to “dot” file dot-post-dom-only: Print postdominance tree of function to “dot” file (with no function bodies) globals-aa: Simple mod/ref analysis for globals instcount: Counts the various types of Instructions iv-users: Induction Variable Users kernel-info: GPU Kernel Info lazy-value-info: Lazy Value Information Analysis lint: Statically lint-checks LLVM IR loops: Natural Loop Information memdep: Memory Dependence Analysis print<module-debuginfo>: Decodes module-level debug info postdomtree: Post-Dominator Tree Construction print-alias-sets: Alias Set Printer print-callgraph: Print a call graph print-callgraph-sccs: Print SCCs of the Call Graph print-cfg-sccs: Print SCCs of each function CFG function(print): Print function to stderr module(print): Print module to stderr regions: Detect single entry single exit regions scalar-evolution: Scalar Evolution Analysis scev-aa: ScalarEvolution-based Alias Analysis stack-safety: Stack Safety Analysis Transform Passes adce: Aggressive Dead Code Elimination always-inline: Inliner for always_inline functions argpromotion: Promote ‘by reference’ arguments to scalars block-placement: Profile Guided Basic Block Placement break-crit-edges: Break critical edges in CFG codegenprepare: Optimize for code generation constmerge: Merge Duplicate Global Constants dce: Dead Code Elimination deadargelim: Dead Argument Elimination dse: Dead Store Elimination function-attrs: Deduce function attributes globaldce: Dead Global Elimination globalopt: Global Variable Optimizer gvn: Global Value Numbering indvars: Canonicalize Induction Variables inline: Function Integration/Inlining instcombine: Combine redundant instructions aggressive-instcombine: Combine expression patterns internalize: Internalize Global Symbols ipsccp: Interprocedural Sparse Conditional Constant Propagation ir-normalizer: Transforms IR into a normal form that’s easier to diff jump-threading: Jump Threading lcssa: Loop-Closed SSA Form Pass licm: Loop Invariant Code Motion loop-deletion: Delete dead loops loop-extract: Extract loops into new functions loop-reduce: Loop Strength Reduction loop-rotate: Rotate Loops loop-simplify: Canonicalize natural loops loop-unroll: Unroll loops loop-unroll-and-jam: Unroll and Jam loops lower-global-dtors: Lower global destructors lower-atomic: Lower atomic intrinsics to non-atomic form lower-invoke: Lower invokes to calls, for unwindless code generators lower-switch: Lower SwitchInsts to branches mem2reg: Promote Memory to Register memcpyopt: MemCpy Optimization mergefunc: Merge Functions mergereturn: Unify function exit nodes partial-inliner: Partial Inliner reassociate: Reassociate expressions rel-lookup-table-converter: Relative lookup table converter reg2mem: Demote all values to stack slots sroa: Scalar Replacement of Aggregates sccp: Sparse Conditional Constant Propagation simplifycfg: Simplify the CFG sink: Code sinking simple-loop-unswitch: Unswitch loops strip: Strip all symbols from a module strip-dead-debug-info: Strip debug info for unused symbols strip-dead-prototypes: Strip Unused Function Prototypes strip-nondebug: Strip all symbols, except dbg symbols, from a module tailcallelim: Tail Call Elimination Utility Passes deadarghaX0r: Dead Argument Hacking (BUGPOINT USE ONLY; DO NOT USE) extract-blocks: Extract Basic Blocks From Module (for bugpoint use) instnamer: Assign names to anonymous instructions verify: Module Verifier view-cfg: View CFG of function view-cfg-only: View CFG of function (with no function bodies) view-dom: View dominance tree of function view-dom-only: View dominance tree of function (with no function bodies) view-post-dom: View postdominance tree of function view-post-dom-only: View postdominance tree of function (with no function bodies) transform-warning: Report missed forced transformations Introduction¶ Warning This document is not updated frequently, and the list of passes is most likely incomplete. It is possible to list passes known by the opt tool using opt -print-passes. This document serves as a high level summary of the optimization features that LLVM provides. Optimizations are implemented as Passes that traverse some portion of a program to either collect information or transform the program. The table below divides the passes that LLVM provides into three categories. Analysis passes compute information that other passes can use or for debugging or program visualization purposes. Transform passes can use (or invalidate) the analysis passes. Transform passes all mutate the program in some way. Utility passes provides some utility but don’t otherwise fit categorization. For example passes to extract functions to bitcode or write a module to bitcode are neither analysis nor transform passes. The table of contents above provides a quick summary of each pass and links to the more complete pass description later in the document. Analysis Passes¶ This section describes the LLVM Analysis Passes. aa-eval: Exhaustive Alias Analysis Precision Evaluator¶ This is a simple N^2 alias analysis accuracy evaluator. Basically, for each function in the program, it simply queries to see how the alias analysis implementation answers alias queries between each pair of pointers in the function. This is inspired and adapted from code by: Naveen Neelakantam, Francesco Spadini, and Wojciech Stryjewski. basic-aa: Basic Alias Analysis (stateless AA impl)¶ A basic alias analysis pass that implements identities (two different globals cannot alias, etc), but does no stateful analysis. basiccg: Basic CallGraph Construction¶ Yet to be written. da: Dependence Analysis¶ Dependence analysis framework, which is used to detect dependences in memory accesses. domfrontier: Dominance Frontier Construction¶ This pass is a simple dominator construction algorithm for finding forward dominator frontiers. domtree: Dominator Tree Construction¶ This pass is a simple dominator construction algorithm for finding forward dominators. dot-callgraph: Print Call Graph to “dot” file¶ This pass, only available in opt, prints the call graph into a .dot graph. This graph can then be processed with the “dot” tool to convert it to postscript or some other suitable format. dot-cfg: Print CFG of function to “dot” file¶ This pass, only available in opt, prints the control flow graph into a .dot graph. This graph can then be processed with the dot tool to convert it to postscript or some other suitable format. Additionally the -cfg-func-name=<substring> option can be used to filter the functions that are printed. All functions that contain the specified substring will be printed. dot-cfg-only: Print CFG of function to “dot” file (with no function bodies)¶ This pass, only available in opt, prints the control flow graph into a .dot graph, omitting the function bodies. This graph can then be processed with the dot tool to convert it to postscript or some other suitable format. Additionally the -cfg-func-name=<substring> option can be used to filter the functions that are printed. All functions that contain the specified substring will be printed. dot-dom: Print dominance tree of function to “dot” file¶ This pass, only available in opt, prints the dominator tree into a .dot graph. This graph can then be processed with the dot tool to convert it to postscript or some other suitable format. dot-dom-only: Print dominance tree of function to “dot” file (with no function bodies)¶ This pass, only available in opt, prints the dominator tree into a .dot graph, omitting the function bodies. This graph can then be processed with the dot tool to convert it to postscript or some other suitable format. dot-post-dom: Print postdominance tree of function to “dot” file¶ This pass, only available in opt, prints the post dominator tree into a .dot graph. This graph can then be processed with the dot tool to convert it to postscript or some other suitable format. dot-post-dom-only: Print postdominance tree of function to “dot” file (with no function bodies)¶ This pass, only available in opt, prints the post dominator tree into a .dot graph, omitting the function bodies. This graph can then be processed with the dot tool to convert it to postscript or some other suitable format. globals-aa: Simple mod/ref analysis for globals¶ This simple pass provides alias and mod/ref information for global values that do not have their address taken, and keeps track of whether functions read or write memory (are “pure”). For this simple (but very common) case, we can provide pretty accurate and useful information. instcount: Counts the various types of Instructions¶ This pass collects the count of all instructions and reports them. iv-users: Induction Variable Users¶ Bookkeeping for “interesting” users of expressions computed from induction variables. kernel-info: GPU Kernel Info¶ Reports various statistics for codes compiled for GPUs. This pass is documented separately. lazy-value-info: Lazy Value Information Analysis¶ Interface for lazy computation of value constraint information. lint: Statically lint-checks LLVM IR¶ This pass statically checks for common and easily-identified constructs which produce undefined or likely unintended behavior in LLVM IR. It is not a guarantee of correctness, in two ways. First, it isn’t comprehensive. There are checks which could be done statically which are not yet implemented. Some of these are indicated by TODO comments, but those aren’t comprehensive either. Second, many conditions cannot be checked statically. This pass does no dynamic instrumentation, so it can’t check for all possible problems. Another limitation is that it assumes all code will be executed. A store through a null pointer in a basic block which is never reached is harmless, but this pass will warn about it anyway. Optimization passes may make conditions that this pass checks for more or less obvious. If an optimization pass appears to be introducing a warning, it may be that the optimization pass is merely exposing an existing condition in the code. This code may be run before instcombine. In many cases, instcombine checks for the same kinds of things and turns instructions with undefined behavior into unreachable (or equivalent). Because of this, this pass makes some effort to look through bitcasts and so on. loops: Natural Loop Information¶ This analysis is used to identify natural loops and determine the loop depth of various nodes of the CFG. Note that the loops identified may actually be several natural loops that share the same header node… not just a single natural loop. memdep: Memory Dependence Analysis¶ An analysis that determines, for a given memory operation, what preceding memory operations it depends on. It builds on alias analysis information, and tries to provide a lazy, caching interface to a common kind of alias information query. print<module-debuginfo>: Decodes module-level debug info¶ This pass decodes the debug info metadata in a module and prints it to standard output in a (sufficiently-prepared-) human-readable form. postdomtree: Post-Dominator Tree Construction¶ This pass is a simple post-dominator construction algorithm for finding post-dominators. print-alias-sets: Alias Set Printer¶ Yet to be written. print-callgraph: Print a call graph¶ This pass, only available in opt, prints the call graph to standard error in a human-readable form. print-callgraph-sccs: Print SCCs of the Call Graph¶ This pass, only available in opt, prints the SCCs of the call graph to standard error in a human-readable form. print-cfg-sccs: Print SCCs of each function CFG¶ This pass, only available in opt, prints the SCCs of each function CFG to standard error in a human-readable fom. function(print): Print function to stderr¶ The PrintFunctionPass class is designed to be pipelined with other FunctionPasses, and prints out the functions of the module as they are processed. module(print): Print module to stderr¶ This pass simply prints out the entire module when it is executed. regions: Detect single entry single exit regions¶ The RegionInfo pass detects single entry single exit regions in a function, where a region is defined as any subgraph that is connected to the remaining graph at only two spots. Furthermore, a hierarchical region tree is built. scalar-evolution: Scalar Evolution Analysis¶ The ScalarEvolution analysis can be used to analyze and categorize scalar expressions in loops. It specializes in recognizing general induction variables, representing them with the abstract and opaque SCEV class. Given this analysis, trip counts of loops and other important properties can be obtained. This analysis is primarily useful for induction variable substitution and strength reduction. scev-aa: ScalarEvolution-based Alias Analysis¶ Simple alias analysis implemented in terms of ScalarEvolution queries. This differs from traditional loop dependence analysis in that it tests for dependencies within a single iteration of a loop, rather than dependencies between different iterations. ScalarEvolution has a more complete understanding of pointer arithmetic than BasicAliasAnalysis’ collection of ad-hoc analyses. stack-safety: Stack Safety Analysis¶ The StackSafety analysis can be used to determine if stack allocated variables can be considered safe from memory access bugs. This analysis’ primary purpose is to be used by sanitizers to avoid unnecessary instrumentation of safe variables. Transform Passes¶ This section describes the LLVM Transform Passes. adce: Aggressive Dead Code Elimination¶ ADCE aggressively tries to eliminate code. This pass is similar to DCE but it assumes that values are dead until proven otherwise. This is similar to SCCP, except applied to the liveness of values. always-inline: Inliner for always_inline functions¶ A custom inliner that handles only functions that are marked as “always inline”. argpromotion: Promote ‘by reference’ arguments to scalars¶ This pass promotes “by reference” arguments to be “by value” arguments. In practice, this means looking for internal functions that have pointer arguments. If it can prove, through the use of alias analysis, that an argument is only loaded, then it can pass the value into the function instead of the address of the value. This can cause recursive simplification of code and lead to the elimination of allocas (espec"
