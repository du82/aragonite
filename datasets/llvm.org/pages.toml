ursor":"MQ"}],"pageInfo":{"endCursor":"MQ","hasNextPage":false}},"__isNode":"Issue","assignees":{"nodes":[]},"milestone":null,"databaseId":1070887588,"viewerDidAuthor":false,"locked":false,"author":{"__typename":"User","__isActor":"User","login":"llvmbot","id":"MDQ6VXNlcjYwOTQ0OTM1","profileUrl":"https://github.com/llvmbot","avatarUrl":"https://avatars.githubusercontent.com/u/60944935?v=4"},"__isComment":"Issue","body":"| | |\n| --- | --- |\n| Bugzilla Link | [810](https://llvm.org/bz810) |\n| Resolution | FIXED |\n| Resolved on | Sep 03, 2020 07:29 |\n| Version | trunk |\n| OS | All |\n| Blocks | llvm/llvm-bugzilla-archive#3100 |\n| Reporter | LLVM Bugzilla Contributor |\n| CC | @atrick,@mkurdej,@dwblaikie,@fhahn,@yuanfang-chen,@irishrover |\n\n## Extended Description \nHi,\n\nI'd like to open a discussion on adding assert/assume intrinsics to\nLLVM. Here I will describe the syntax, semantics, and applications \nof both.\n\nThose statements should have the following syntax:\n\nassert/assume ( Boolean_variable, String )\n\n\"Boolean_variable\" represents a condition.\n\nThe only purpose of \"String\" is to classify assertions and assumptions\ninto classes, so that, for example, certain class of assertions can be\nenabled or disabled during the code generation. For maximal generality,\nI'd suggest leaving \"String\" unspecified for now. The users can come up\nwith identifiers like \"Range_check\" or similar.\n\n\nThe semantics of statements is:\n\nASSERT - if the condition evaluates to TRUE, the statement is a NOP,\notherwise the assertion terminates the program. Code generators should\nbe able to enable/disable assertions, but are also allowed to completely\nignore them.\n\nASSUME - is always a NOP, but the code generators might generate code\nthat issues a warning if the condition evaluates to FALSE. Assumptions\npresent the conditions that \"should\", but are not guaranteed to hold.\n\n\nApplications:\n\nASSERT - debugging, code reliability, can represent both user provided\nassertions (invariants, pre/post-conditions) and automatically inserted\nchecks, like range checking.\n\nASSUME - primarily as a tool for communication between passes. Some\npossible applications include: \n\n* language independent attribute mechanism\n[ like assume(restricted(ptr_x), \"Restricted Pointer\") ] \n\n* passing information through different stages of the compilation \nframework, for example, a loop analysis pass might store an inferred\nloop invariant as assume(x + y \u003c 200, \"Loop Invariant\").\n\n* static checking. For details I'd suggest papers from Dijkstra, Greg\nNelson, Rustan Leino.\n\n\nIt should be noted that ASSUMEs have application specific meaning, and\nshould not be touched by passes that do not use them (something like dbg\nintrinsics).\n\nLooking forward to your comments,\n\nDomagoj Babic","bodyHTML":"\u003cmarkdown-accessiblity-table\u003e\u003ctable role=\"table\"\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBugzilla Link\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://llvm.org/bz810\" rel=\"nofollow\"\u003e810\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eResolution\u003c/td\u003e\n\u003ctd\u003eFIXED\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eResolved on\u003c/td\u003e\n\u003ctd\u003eSep 03, 2020 07:29\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVersion\u003c/td\u003e\n\u003ctd\u003etrunk\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOS\u003c/td\u003e\n\u003ctd\u003eAll\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBlocks\u003c/td\u003e\n\u003ctd\u003ellvm/llvm-bugzilla-archive#3100\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eReporter\u003c/td\u003e\n\u003ctd\u003eLLVM Bugzilla Contributor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCC\u003c/td\u003e\n\u003ctd\u003e\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/atrick/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/atrick\"\u003e@atrick\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/mkurdej/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/mkurdej\"\u003e@mkurdej\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/dwblaikie/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/dwblaikie\"\u003e@dwblaikie\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/fhahn/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/fhahn\"\u003e@fhahn\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/yuanfang-chen/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/yuanfang-chen\"\u003e@yuanfang-chen\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/irishrover/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/irishrover\"\u003e@irishrover\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/markdown-accessiblity-table\u003e\n\u003ch2 dir=\"auto\"\u003eExtended Description\u003c/h2\u003e\n\u003cp dir=\"auto\"\u003eHi,\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eI'd like to open a discussion on adding assert/assume intrinsics to\u003cbr\u003e\nLLVM. Here I will describe the syntax, semantics, and applications\u003cbr\u003e\nof both.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThose statements should have the following syntax:\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eassert/assume ( Boolean_variable, String )\u003c/p\u003e\n\u003cp dir=\"auto\"\u003e\"Boolean_variable\" represents a condition.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThe only purpose of \"String\" is to classify assertions and assumptions\u003cbr\u003e\ninto classes, so that, for example, certain class of assertions can be\u003cbr\u003e\nenabled or disabled during the code generation. For maximal generality,\u003cbr\u003e\nI'd suggest leaving \"String\" unspecified for now. The users can come up\u003cbr\u003e\nwith identifiers like \"Range_check\" or similar.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThe semantics of statements is:\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eASSERT - if the condition evaluates to TRUE, the statement is a NOP,\u003cbr\u003e\notherwise the assertion terminates the program. Code generators should\u003cbr\u003e\nbe able to enable/disable assertions, but are also allowed to completely\u003cbr\u003e\nignore them.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eASSUME - is always a NOP, but the code generators might generate code\u003cbr\u003e\nthat issues a warning if the condition evaluates to FALSE. Assumptions\u003cbr\u003e\npresent the conditions that \"should\", but are not guaranteed to hold.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eApplications:\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eASSERT - debugging, code reliability, can represent both user provided\u003cbr\u003e\nassertions (invariants, pre/post-conditions) and automatically inserted\u003cbr\u003e\nchecks, like range checking.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eASSUME - primarily as a tool for communication between passes. Some\u003cbr\u003e\npossible applications include:\u003c/p\u003e\n\u003cul dir=\"auto\"\u003e\n\u003cli\u003e\n\u003cp dir=\"auto\"\u003elanguage independent attribute mechanism\u003cbr\u003e\n[ like assume(restricted(ptr_x), \"Restricted Pointer\") ]\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp dir=\"auto\"\u003epassing information through different stages of the compilation\u003cbr\u003e\nframework, for example, a loop analysis pass might store an inferred\u003cbr\u003e\nloop invariant as assume(x + y \u0026lt; 200, \"Loop Invariant\").\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp dir=\"auto\"\u003estatic checking. For details I'd suggest papers from Dijkstra, Greg\u003cbr\u003e\nNelson, Rustan Leino.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp dir=\"auto\"\u003eIt should be noted that ASSUMEs have application specific meaning, and\u003cbr\u003e\nshould not be touched by passes that do not use them (something like dbg\u003cbr\u003e\nintrinsics).\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eLooking forward to your comments,\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eDomagoj Babic\u003c/p\u003e","bodyVersion":"d1e3e461bde0ff89545e8c83c97d238acaaca6eb2989adc7f0ec101fbe8c3824","createdAt":"2006-06-19T08:14:53Z","__isReactable":"Issue","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"viewerCanUpdateMetadata":false,"viewerCanComment":false,"viewerCanAssign":false,"viewerCanLabel":false,"__isIssueOrPullRequest":"Issue","projectItemsNext":{"edges":[],"pageInfo":{"endCursor":null,"hasNextPage":false}},"viewerCanSetMilestone":false,"isPinned":false,"viewerCanDelete":false,"viewerCanTransfer":false,"viewerCanConvertToDiscussion":false,"viewerCanLock":false,"viewerCanType":false,"frontTimelineItems":{"pageInfo":{"hasNextPage":true,"endCursor":"Y3Vyc29yOnYyOpPPAAABdE5K5AgAqTk4MDg1NjA0Nw=="},"totalCount":19,"edges":[{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980856061,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"llvmbot","id":"MDQ6VXNlcjYwOTQ0OTM1"},"id":"MDU6SXNzdWUxMDcwODg3NTg4","number":1182,"locked":false,"databaseId":1070887588},"author":{"__typename":"User","login":"lattner","avatarUrl":"https://avatars.githubusercontent.com/u/15152540?u=bb801174d6fe5cea542dfb3ff8c59a2b55c0b5e0\u0026v=4","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDg1NjA2MQ==","body":"Basic question about \"ASSERT\": why bother? LLVM already has the ability to express \"if this condition isn't \ntrue, abort\", you need no intrinsic for that.\n\nAssume is useful as an intrinsic, and could conceptually be useful for conveying information from the \nfront-end to the optimizers. However, using it this way would require a bunch of new predicates (e.g. \n'restricted' which aren't defined here), and it would seriously bloat the code.\n\nWhy do you need assume for loop invariants? Those are trivial to compute.\n\n-Chris","bodyHTML":"\u003cp dir=\"auto\"\u003eBasic question about \"ASSERT\": why bother? LLVM already has the ability to express \"if this condition isn't\u003cbr\u003e\ntrue, abort\", you need no intrinsic for that.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eAssume is useful as an intrinsic, and could conceptually be useful for conveying information from the\u003cbr\u003e\nfront-end to the optimizers. However, using it this way would require a bunch of new predicates (e.g.\u003cbr\u003e\n'restricted' which aren't defined here), and it would seriously bloat the code.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eWhy do you need assume for loop invariants? Those are trivial to compute.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003e-Chris\u003c/p\u003e","bodyVersion":"6a05877b7ad016f0857a8b85a4308b93f101cb334b193eb434ae95bb7c3e50b1","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/1182#issuecomment-980856061","createdAt":"2006-06-19T20:52:52Z","authorAssociation":"COLLABORATOR","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/llvm"},"isPrivate":false,"slashCommandsEnabled":false,"nameWithOwner":"llvm/llvm-project'''
