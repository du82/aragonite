title = "The LLVM Compiler Infrastructure Project"
full_description = "The Euro LLVM Developers' Meeting is a bi-annual gathering of the entire LLVM Project community. The conference is organized by the LLVM Foundation and many volunteers within the LLVM community. Developers and users of LLVM, Clang, and related subprojects will enjoy attending interesting talks, impromptu discussions, and networking with the many members of our community. Whether you are a new to the LLVM project or a long time member, there is something for each attendee. To see the agenda, speakers, and register, please visit the Event Site here: https://llvm.swoogo.com/2024eurollvm The LLVM Developers' Meeting strives to be the best conference to meet other LLVM developers and users. For future announcements or questions: Please visit the LLVM Discourse forums. Most posts are in the Announcements or Community categories and tagged with usllvmdevmtg. Rust ❤️ LLVM Nikita Popov [ Video ] [ Slides ] This talk is about how Rust uses LLVM, how the two projects interact, and the challenges and opportunities that arise. State of Clang as a C and C++ Compiler Aaron Ballman [ Video ] [ Slides ] Come along with Clang's lead maintainer on a whirlwind tour of what new standard C and C++ language features have been added to Clang in the past 1-2 years, an overview of what standards-related work the community is actively implementing for Clang 20 and beyond, and discussion of what challenges the community is facing and could use help with. Using MLIR from C and Python Alex Zinenko [ Video ] [ Slides ] MLIR, like the rest of LLVM, is primarily written in C++. However, the C++ API is known to be complex and unstable. Moreover, both quick prototyping and deep integration with client frameworks calls for uses of different languages to work with MLIR, most often Python for its simplicity and C for its ubiquity. This talk will present the MLIR C API and demonstrate how it is used to construct Python bindings. Attendees of this talk will learn how to expose custom dialects in both C and Python as well as how to leverage C API to interact with MLIR from different languages"
