["https://llvm.org/devmtg/2020-09"]
title = "2020 Virtual LLVM Developers Meeting"
full_description = "The LLVM Developers' Meeting is a bi-annual gathering of the entire LLVM Project community. This year we will be having our first virtual event! The conference is organized by the LLVM Foundation and many volunteers within the LLVM community. Developers and users of LLVM, Clang, and related subprojects will enjoy attending interesting talks, impromptu discussions, and networking with the many members of our community. Whether you are a new to the LLVM project or a long time member, there is something for each attendee. These 25 minutes talks cover all topics from core infrastructure talks, to project’s using LLVM’s infrastructure. Attendees will take away technical information that could be pertinent to their project or general interest. Tutorials are 60 minute sessions that dive down deep into a technical topic. Expect in depth examples and explanations. These are fast 5 minute talks that give you a taste of a project or topic. Attendees will hear a wide range of topics and probably leave wanting to learn more. Students present their research using LLVM or related subproject. These are usually 20 minute technical presentations with Q&A. The audience will vote at the end for the winning presentation and paper. An hour long session where selected posters are on display, with the presenters available for learning more on each poster. Informal and impromptu discussions on a specific topic. During the conference there are set time slots where groups can organize to discuss a problem or topic. The LLVM Foundation is a nonprofit that supports the LLVM Project. We support the LLVM community by helping it to grow, foster community interactions, work to keep LLVM development productive through infrastructure, and work to ensure the long term health of the LLVM project."
