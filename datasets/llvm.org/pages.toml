o":{"endCursor":"MQ","hasNextPage":false}},"__isNode":"Issue","assignees":{"nodes":[]},"milestone":null,"databaseId":1076787623,"viewerDidAuthor":false,"locked":false,"author":{"__typename":"User","__isActor":"User","login":"vedantk","id":"MDQ6VXNlcjk3Njgz","profileUrl":"https://github.com/vedantk","avatarUrl":"https://avatars.githubusercontent.com/u/97683?u=0448468f14c077f96170626c540e1e839c677013\u0026v=4"},"__isComment":"Issue","body":"| | |\n| --- | --- |\n| Bugzilla Link | [37728](https://llvm.org/bz37728) |\n| Version | unspecified |\n| OS | All |\n| Depends On | llvm/llvm-project#36588 llvm/llvm-project#37063 llvm/llvm-bugzilla-archive#37727 llvm/llvm-project#40314 llvm/llvm-project#40456 llvm/llvm-project#43204 llvm/llvm-project#43767 llvm/llvm-project#44225 llvm/llvm-project#49035 llvm/llvm-project#49044 llvm/llvm-project#50454 llvm/llvm-project#50525 llvm/llvm-project#50539 llvm/llvm-project#50540 llvm/llvm-project#50911 llvm/llvm-project#50912 llvm/llvm-project#51880 llvm/llvm-project#51881 llvm/llvm-project#51882 llvm/llvm-project#36654 llvm/llvm-project#37061 llvm/llvm-project#37062 llvm/llvm-bugzilla-archive#37726 llvm/llvm-project#41483 llvm/llvm-project#42636 llvm/llvm-project#43103 llvm/llvm-project#43309 llvm/llvm-project#48790 llvm/llvm-project#49326 llvm/llvm-project#49924 |\n| CC | @bjope,@dstenb,@dwblaikie,@fredriss,@gregbedwell,@jmorse,@jryans,@pogo59,@rgal,@wjristow,@yuanfang-chen |\n\n## Extended Description \nThis is a meta bug for tracking work related to making llvm passes debug info invariant. That means that the output of llvm passes should be the same, modulo debug info metadata \u0026 intrinsics, regardless of whether the input IR contains debug info. The motivation for this is that enabling debug info should not degrade optimizations.\n\nThere are at least two different approaches for detecting debug invariance bugs:\n\n1. Compile a C program with/without -g, and check that the resulting text sections are identical.\n\n2. Compile some LLVM IR using opt, with/without -debugify-each enabled, and check that the stripped output is identical. The -debugify-each mode applies/removes synthetic debug info to a Module before/after each pass in opt's pipeline.\n\nThe second approach might be a bit more flexible, seeing as it's possible to generate LLVM IR from a C program, and to then run a custom pipeline over the IR using opt.\n\nIn addition to finding debug invariance bugs, we should think about setting up infrastructure to detect regressions, and about adding utilities to the codebase which might make it easier to write debug info invariant passes.","bodyHTML":"\u003cmarkdown-accessiblity-table\u003e\u003ctable role=\"table\"\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBugzilla Link\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://llvm.org/bz37728\" rel=\"nofollow\"\u003e37728\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVersion\u003c/td\u003e\n\u003ctd\u003eunspecified\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOS\u003c/td\u003e\n\u003ctd\u003eAll\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDepends On\u003c/td\u003e\n\u003ctd\u003e\u003ca class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"1076764136\" data-permission-text=\"Title is private\" data-url=\"https://github.com/llvm/llvm-project/issues/36588\" data-hovercard-type=\"issue\" data-hovercard-url=\"/llvm/llvm-project/issues/36588/hovercard\" href=\"https://github.com/llvm/llvm-project/issues/36588\"\u003e#36588\u003c/a\u003e \u003ca class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"1076787002\" data-permission-text=\"Title is private\" data-url=\"https://github.com/llvm/llvm-project/issues/37063\" data-hovercard-type=\"issue\" data-hovercard-url=\"/llvm/llv