title = "About — LLVM 21.0.0git documentation"
full_description = "About¶ Warning If you are using a released version of LLVM, see the download page to find your documentation. The LLVM compiler infrastructure supports a wide range of projects, from industrial strength compilers to specialized JIT applications to small research projects. Similarly, documentation is broken down into several high-level groupings targeted at different audiences: LLVM Design & Overview¶ Several introductory papers and presentations. Frequently Asked Questions (FAQ)Frequently asked questions. The LLVM LexiconGlossary. Introduction to the LLVM CompilerPresentation providing a users introduction to LLVM. Intro to LLVMA chapter from the book “The Architecture of Open Source Applications” that describes high-level design decisions that shaped LLVM. LLVM: A Compilation Framework for Lifelong Program Analysis & TransformationDesign overview. LLVM: An Infrastructure for Multi-Stage OptimizationMore details (quite old now). Documentation¶ Getting Started, How-tos, Developer Guides, and Tutorials. Getting Started/TutorialsFor those new to the LLVM system. User GuidesUser guides and How-tos. ReferenceLLVM and API reference documentation. Discourse Migration GuideGuide for users to migrate to Discourse Community¶ LLVM welcomes contributions of all kinds. To learn more, see the following articles: Getting Involved Development Process Forums & Mailing Lists Meetups and social events Community wide proposals Reporting a security issue How to report a security issue? Indices and tables¶ Index Search Page"
