t should greatly speed up bugpointing real-world programs on\npeople's shiny new multicore systems...\n\n2) when bugpoint is down to testing single instructions, can you make a \"work\nlist\" out of these and have however many threads the user says are available\nchipping away at it?\n\n3) (for extra fish) - get 1) and 2) working when trying to find JIT bugs!\n\n4) email me your address (I'm not joking about the fish ;)","bodyHTML":"\u003cp dir=\"auto\"\u003eReid, cool! A few thoughts/requests:\u003c/p\u003e\n\u003col dir=\"auto\"\u003e\n\u003cli\u003e\n\u003cp dir=\"auto\"\u003eInstead of just forking at each branch in the (binary) tree of tests bugpoint\u003cbr\u003e\ndoes (when trying to nail a function being miscompiled), can you turn it into an\u003cbr\u003e\nn-ary tree? i.e. at the first stage, compile say 4 threads x (1/4 the program\u003cbr\u003e\nwith llc, 3/4 with native) - this will increase the amount of \"wasted\"\u003cbr\u003e\ncomputation but should greatly speed up bugpointing real-world programs on\u003cbr\u003e\npeople's shiny new multicore systems...\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp dir=\"auto\"\u003ewhen bugpoint is down to testing single instructions, can you make a \"work\u003cbr\u003e\nlist\" out of these and have however many threads the user says are available\u003cbr\u003e\nchipping away at it?\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp dir=\"auto\"\u003e(for extra fish) - get 1) and 2) working when trying to find JIT bugs!\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp dir=\"auto\"\u003eemail me your address (I'm not joking about the fish ;)\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e","bodyVersion":"5e75746e404781469951165c651cfc9012f9d7fa6d1705da6e226b9eddc0323e","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/911#issuecomment-980854696","createdAt":"2005-12-27T03:26:17Z","authorAssociation":"MEMBER","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/llvm"},"isPrivate":false,"slashCommandsEnabled":false,"nameWithOwner":"llvm/llvm-project","databaseId":75821432},"__isComment":"IssueComment","viewerCanReadUserContentEdits":true,"lastEditedAt":null,"lastUserContentEdit":null,"__isReactable":"IssueComment","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"'''
