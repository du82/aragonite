full_description = "It was a half-day meeting for LLVM users to exchange ideas, expose new developments and generally strengthen the network of LLVM developers in and around Europe. The meeting is open to anyone, from corporate to academia, professionals to enthusiasts. While this was not a full conference like the US LLVM Developers' Meeting, we had talks, posters, demonstrations and a lot of discussion. There were almost 80 people, from academia and industry, experts and newbies, and the feedback we received was excellent. The organisers of the Euro-LLVM 2011 would like to thank every one for helping us make this successful event."
