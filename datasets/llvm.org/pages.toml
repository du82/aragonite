full_description = "Its members provide the baseline state available to passes during their construction. The PassRegistry.def file specifies how to construct all of the built-in passes, and those may reference these members during construction. References llvm::PassManager< IRUnitT, AnalysisManagerT, ExtraArgTs >::addPass(), assert(), llvm::CSFDO, llvm::FDO, and Options. This also adds target-specific alias analyses registered via TargetMachine::registerDefaultAliasAnalyses(). References EnableGlobalAnalyses, llvm::TargetMachine::registerDefaultAliasAnalyses(), llvm::AAManager::registerFunctionAnalysis(), and llvm::AAManager::registerModuleAnalysis(). This builds a pipeline that runs the LTO/ThinLTO pre-link pipeline, and emits a section containing the pre-link bitcode along side the object code generated in non-LTO compilation. References addAnnotationRemarksPass(), llvm::PassManager< IRUnitT, AnalysisManagerT, ExtraArgTs >::addPass(), llvm::lowertypetests::All, buildLTOPreLinkDefaultPipeline(), buildModuleOptimizationPipeline(), buildThinLTODefaultPipeline(), buildThinLTOPreLinkDefaultPipeline(), llvm::None, and llvm::PGOOptions::SampleUse. This is a long pipeline and uses most of the per-function optimization passes in LLVM to canonicalize and simplify the IR. It is suitable to run repeatedly over the IR and is not expected to destroy important information about the semantics of the IR. Note that Level cannot be O0 here. The pipelines produced are only intended for use when attempting to optimize code. If frontends require some transformations for semantic reasons, they should explicitly build them. References llvm::PassManager< IRUnitT, AnalysisManagerT, ExtraArgTs >::addPass(), llvm::PassManager< Loop, LoopAnalysisManager, LoopStandardAnalysisResults &, LPMUpdater & >::addPass(), llvm::ExtraLoopPassManager< MarkerTy >::addPass(), llvm::AreStatisticsEnabled(), assert(), llvm::createFunctionToLoopPassAdaptor(), EnableConstraintElimination, EnableDFAJumpThreading, EnableGVNHoist, EnableGVNSink, EnableJumpTableToSwitch, llvm::EnableKnowledgeRetention, EnableLoopFlatten, EnableLoopHeaderDuplication, EnableLoopInterchange, llvm::PipelineTuningOptions::ForgetAllSCEVInLoopUnroll, invokeLateLoopOptimizationsEPCallbacks(), invokeLoopOptimizerEndEPCallbacks(), invokePeepholeEPCallbacks(), invokeScalarOptimizerLateEPCallbacks(), llvm::PGOOptions::IRUse, isLTOPreLink(), llvm::PipelineTuningOptions::LicmMssaNoAccForPromotionCap, llvm::PipelineTuningOptions::LicmMssaOptCap, llvm::PipelineTuningOptions::LoopUnrolling, llvm::ModifyCFG, llvm::OptimizationLevel::O0, llvm::OptimizationLevel::O3, llvm::OptimizationLevel::Oz, Phase, RunNewGVN, llvm::PGOOptions::SampleUse, and llvm::ThinLTOPreLink."
