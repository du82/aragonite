title = "LLVM Tutorial: Table of Contents — LLVM 21.0.0git documentation"
full_description = "LLVM Tutorial: Table of Contents¶ Kaleidoscope: Implementing a Language with LLVM¶ My First Language Frontend with LLVM TutorialThis is the “Kaleidoscope” Language tutorial, showing how to implement a simple language using LLVM components in C++. 1. Kaleidoscope: Kaleidoscope Introduction and the Lexer 2. Kaleidoscope: Implementing a Parser and AST 3. Kaleidoscope: Code generation to LLVM IR 4. Kaleidoscope: Adding JIT and Optimizer Support 5. Kaleidoscope: Extending the Language: Control Flow 6. Kaleidoscope: Extending the Language: User-defined Operators 7. Kaleidoscope: Extending the Language: Mutable Variables 8. Kaleidoscope: Compiling to Object Code 9. Kaleidoscope: Adding Debug Information 10. Kaleidoscope: Conclusion and other useful LLVM tidbits Building a JIT in LLVM¶ 1. Building a JIT: Starting out with KaleidoscopeJIT 2. Building a JIT: Adding Optimizations – An introduction to ORC Layers 3. Building a JIT: Per-function Lazy Compilation 4. Building a JIT: Extreme Laziness - Using LazyReexports to JIT from ASTs External Tutorials¶ Tutorial: Creating an LLVM Backend for the Cpu0 ArchitectureA step-by-step tutorial for developing an LLVM backend. Under active development at https://github.com/Jonathan2251/lbd (please contribute!). Howto: Implementing LLVM Integrated AssemblerA simple guide for how to implement an LLVM integrated assembler for an architecture. Advanced Topics¶ Writing an Optimization for LLVM"
