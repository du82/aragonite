["http://llvm.org/devmtg/2013-11"]
title = "The LLVM Compiler Infrastructure Project"
full_description = "The meeting serves as a forum for LLVM, Clang, LLDB and other LLVM project developers and users to get acquainted, learn how LLVM is used, and exchange ideas about LLVM and its (potential) applications. More broadly, we believe the event will be of particular interest to the following people: We also invite you to sign up for the official Developer Meeting mailing list to be kept informed of updates concerning the meeting. LLVM: 10 years and going strong Chris Lattner - Apple, Vikram Adve - University of Illinois, Urbana-Champaign Slides[1] Slides[2] Video Keynote talk celebrating the 10th anniversary of LLVM 1.0. Emscripten: Compiling LLVM bitcode to JavaScript Alon Zakai - Mozilla Slides Video Emscripten is an open source compiler that converts LLVM bitcode to JavaScript. JavaScript is a fairly unusual target for compilation, being a high-level dynamic language instead of a low-level CPU assembly, but efficient compilation to JavaScript is useful because of the ubiquity of web browsers which use it as their standard language. This talk will detail how Emscripten utilizes LLVM and clang to convert C/C++ into JavaScript, and cover the specific challenges that compiling to JavaScript entails, such as the lack of goto statements, while on the other hand making other aspects of compilation simpler, for example having native exception handling support. Some such issues are general and have to do with JavaScript itself, but specific challenges with Emscripten's interaction with LLVM will also be described, as well as opportunities for better integration between the projects in the future. Code Size Reduction using Similar Function Merging Tobias Edler von Koch - University of Edinburgh / QuIC, Pranav Bhandarkar - QuIC Slides Video Code size reduction is a critical goal for compiler optimizations targeting embedded applications. While LLVM continues to improve its performance optimization capabilities, it is currently still lacking a robust set of optimizations specifically targeting code size. In our talk, we will describe an optimization pass that aims to reduce code size by merging similar functions at the IR level. Significantly extending the existing MergeFunctions optimization, the pass is capable of merging multiple functions even if there are minor differences between them. A number of heuristics are used to determine when merging of functions is profitable. Alongside hash tables, these also ensure that compilation time remains at an acceptable level. We will describe our experience of using this new optimization pass to reduce the code size of a significant embedded application at Qualcomm Innovation Center by 2%."
