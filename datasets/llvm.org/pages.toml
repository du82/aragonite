["https://llvm.org/devmtg/2018-04"]
title = "The LLVM Compiler Infrastructure Project"
full_description = "The meeting serves as a forum for LLVM, Clang, LLDB and other LLVM project developers and users to get acquainted, learn how LLVM is used, and exchange ideas about LLVM and its (potential) applications. The conference will be two full days that include technical talks, BoFs, hacker’s lab, tutorials, a poster session and a reception. The LLVM Foundation is excited to announce our second Women in Compilers and Tools Reception to be held in conjuction with the 2018 European LLVM Developers' Meeting! Tickets are available here. This is an evening reception on April 15th that includes dinner, drinks, and a panel featuring well known women in the field of compilers and tools. The confirmed speakers are Anastasia Stulova and Karine Heydemann. The event will be held at a restaurant called Riverstation. This event aims to connect women in the LLVM community and the field of compilers and tools. It also is open to anyone (men or women) who is intersted in increasing diversity within the LLVM community, their workplace or university. The LLVM Foundation sponsors student travel to attend the LLVM Developers' Meeting. Travel grants cover some or all of travel related expenses. This program is open to full time undergraduate and graduate students. Please submit your application by February 26th 2018 at 5:00PM PDT. Full details on eligibility and selection process are provided in the application. Notification of successful travel grant awards will be sent via email by March 2 2018. The LLVM Foundation is dedicated to providing an inclusive and safe experience for everyone. We do not tolerate harassment of participants in any form. By registering for this event, we expect you to have read and agree to the LLVM Code of Conduct. To contact the organizers, Arnaud de Grandmaison, Phillip Power, please email eurollvm-organizers@lists.llvm.org"
