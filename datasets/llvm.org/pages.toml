["https://llvm.org/devmtg/2016-03"]
title = "The LLVM Compiler Infrastructure Project"
full_description = "The LLVM Foundation announces the sixth annual European LLVM Developers' Meeting will be held March 17th and 18th in Barcelona, Spain. This year, the conference will be collocated with CGO and CC, enabling collaboration and exchange of ideas with the research community. The conference will be 2 full days that include technical talks, BoFs, hacker’s lab, tutorials, and a poster session. The meeting serves as a forum for LLVM, Clang, LLDB and other LLVM project developers and users to get acquainted, learn how LLVM is used, and exchange ideas about LLVM and its (potential) applications. More broadly, we believe the event will be of particular interest to the following people: Clang, libc++ and the C++ standard Marshall Clow - Qualcomm Richard Smith - Google Slides Video The C++ standard is evolving at a fairly rapid pace. After almost 15 years of little change (1998-2010), we've had major changes in 2011, 2014, and soon (probably) 2017. There are many parallel efforts to add new functionality to the language and the standard library. In this talk, we will discuss upcoming changes to the language and the standard library, how they will affect existing code, and their implementation status in LLVM. Codelet Extractor and REplayer Chadi Akel - Exascale Computing Research Pablo De Oliveira Castro - University of Versailles Michel Popov - University of Versailles Eric Petit - University of Versailles William Jalby - University of Versailles Slides Video Codelet Extractor and REplayer (CERE) is an LLVM-based framework that finds and extracts hotspots from an application as isolated fragments of code. Codelets can be modified, compiled, run, and measured independently from the original application. Through performance signature clustering, CERE extracts a minimal but representative codelet set from applications, which can significantly reduce the cost of benchmarking and iterative optimization. Codelets have proved successful in auto-tuning target architecture, compiler optimization or amount of parallelism. To do so, CERE goes trough multiple llvm passes. It first outlines at IR level the loop to capture into a function using CodeExtractor pass. Then, depending on the mode, CERE inserts the necessary instructions to either capture or replay the loop. Probes can also be inserted at IR level around loops to enable instrumentation through externals libraries. Finally CERE also provides a python interface to easily use the tool."
