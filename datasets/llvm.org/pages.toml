n. Aliases are aliases to *a global* not a constant expression. The fact that we have to allow getelementptr (for example) is a sign that this is a hack.","bodyHTML":"\u003cp dir=\"auto\"\u003eBecause the design is broken. Aliases are aliases to \u003cem\u003ea global\u003c/em\u003e not a constant expression. The fact that we have to allow getelementptr (for example) is a sign that this is a hack.\u003c/p\u003e","bodyVersion":"0576f4e33ecb8e75e7cfb738f684ab3691865b567ed614236a35218f995d9ef0","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/10739#issuecomment-980897588","createdAt":"2011-07-15T17:48:27Z","authorAssociation":"COLLABORATOR","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/llvm"},"isPrivate":false,"slashCommandsEnabled":false,"nameWithOwner":"llvm/llvm-project","databaseId":75821432},"__isComment":"IssueComment","viewerCanReadUserContentEdits":true,"lastEditedAt":null,"lastUserContentEdit":null,"__isReactable":"IssueComment","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"__isNode":"IssueComment"},"cursor":"Y3Vyc29yOnYyOpPPAAABMS7p6fgAqTk4MDg5NzU4OA=="},{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980897587,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDU6SXNzdWUxMDcxMDE2MTIy","number":10739,"locked":false,"databaseId":1071016122},"author":{"__typename":"User","login":"lattner","avatarUrl":"https://avatars.githubusercontent.com/u/15152540?u=bb801174d6fe5cea542dfb3ff8c59a2b55c0b5e0\u0026v=4","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDg5NzU4Nw==","body":"I'm not saying that this is a huge priority to fix. I know that the current implementation works fine.","bodyHTML":"\u003cp dir=\"auto\"\u003eI'm not saying that this is a huge priority to fix. I know that the current implementation works fine.\u003c/p\u003e","bodyVersion"'''
