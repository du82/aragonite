title = "LLVM Command Guide — LLVM 21.0.0git documentation"
full_description = "LLVM Command Guide¶ The following documents are command descriptions for all of the LLVM tools. These pages describe how to use the LLVM commands and what their options are. Note that these pages do not describe all of the options available for all tools. To get a complete listing, pass the --help (general options) or --help-hidden (general and debugging options) arguments to the tool you are interested in. Basic Commands¶ dsymutil - manipulate archived DWARF debug symbol files llc - LLVM static compiler lli - directly execute programs from LLVM bitcode llvm-as - LLVM assembler llvm-cgdata - LLVM CodeGen Data Tool llvm-config - Print LLVM compilation options llvm-cov - emit coverage information llvm-cxxmap - Mangled name remapping tool llvm-debuginfo-analyzer - Print a logical representation of low-level debug information. llvm-diff - LLVM structural ‘diff’ llvm-dis - LLVM disassembler llvm-dwarfdump - dump and verify DWARF debug information llvm-dwarfutil - A tool to copy and manipulate debug info llvm-lib - LLVM lib.exe compatible library tool llvm-libtool-darwin - LLVM tool for creating libraries for Darwin llvm-link - LLVM bitcode linker llvm-lipo - LLVM tool for manipulating universal binaries llvm-mc - LLVM Machine Code Playground llvm-mca - LLVM Machine Code Analyzer llvm-opt-report - generate optimization report from YAML llvm-otool - Mach-O dumping tool llvm-profdata - Profile data tool llvm-readobj - LLVM Object Reader llvm-reduce - LLVM automatic testcase reducer. llvm-stress - generate random .ll files llvm-symbolizer - convert addresses into source code locations opt - LLVM optimizer GNU binutils replacements¶ llvm-addr2line - a drop-in replacement for addr2line llvm-ar - LLVM archiver llvm-cxxfilt - LLVM symbol name demangler llvm-install-name-tool - LLVM tool for manipulating install-names and rpaths llvm-nm - list LLVM bitcode and object file’s symbol table llvm-objcopy - object copying and editing tool llvm-objdump - LLVM’s object file dumper llvm-ranlib - generates an archive index llvm-readelf - GNU-style LLVM Object Reader llvm-size - print size information llvm-strings - print strings llvm-strip - object stripping tool Debugging Tools¶ bugpoint - automatic test case reduction tool llvm-extract - extract a function from an LLVM module llvm-bcanalyzer - LLVM bitcode analyzer Developer Tools¶ FileCheck - Flexible pattern matching file verifier tblgen - Description to C++ Code clang-tblgen - Description to C++ Code for Clang lldb-tblgen - Description to C++ Code for LLDB llvm-tblgen - Target Description to C++ Code for LLVM mlir-tblgen - Description to C++ Code for MLIR lit - LLVM Integrated Tester llvm-exegesis - LLVM Machine Instruction Benchmark llvm-ifs - shared object stubbing tool llvm-locstats - calculate statistics on DWARF debug location llvm-pdbutil - PDB File forensics and diagnostics llvm-profgen - LLVM SPGO profile generation tool llvm-tli-checker - TargetLibraryInfo vs library checker Remarks Tools¶ llvm-remarkutil - Remark utility"
