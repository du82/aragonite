eComment","viewerCanReadUserContentEdits":true,"lastEditedAt":null,"lastUserContentEdit":null,"__isReactable":"IssueComment","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"__isNode":"IssueComment"},"cursor":"Y3Vyc29yOnYyOpPPAAABEYZhrOAAqTk4MDg1ODg0Ng=="},{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980858845,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"llvmbot","id":"MDQ6VXNlcjYwOTQ0OTM1"},"id":"MDU6SXNzdWUxMDcwOTE0MDU4","number":1641,"locked":false,"databaseId":1070914058},"author":{"__typename":"User","login":"llvmbot","avatarUrl":"https://avatars.githubusercontent.com/u/60944935?v=4","id":"MDQ6VXNlcjYwOTQ0OTM1"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDg1ODg0NQ==","body":"Some increments to map this work out (feedback would be welcome):\n\n 1. Add an \"unwindTo\" member to BasicBlock.\n 2. Add \"unwind to\" keywords to block label in assembly parser\n 3. Add \"unwind to\" keywords to block label in assembly writer\n 4. Add support for \"unwind to\" to bytecode reader\n 5. Add support for \"unwind to\" to bytecode writer.\n 6. Fix prune-eh to deal with \"unwindTo\" in BasicBlock.\n 7. Remove generation of invoke instructions in llvm-gcc\n 8. Remove invoke instruction from assembly parser\n 9. Remove invoke instruction from assembly writer\n10. Remove invoke instruction from bytecode reader\n11. Remove invoke instruction from bytecode writer\n12. Replace all uses of invoke instruction in LLVM passes with Call instruction\n13. Remove all uses of CallSite class \n14. Remove CallSite class.\n15. Remove invoke instruction from LLVM IR\n\nAnything I forgot, or anything that would lead to an inconsistent state?","bodyHTML":"\u003cp dir=\"auto\"\u003eSome increments to map this work out (feedback would be welcome):\u003c/p\u003e\n\u003col dir=\"auto\"\u003e\n\u003cli\u003eAdd an \"unwindTo\" member to BasicBlock.\u003c/li\u003e\n\u003cli\u003eAdd \"unwind to\" keywords to block label in assembly parser\u003c/li\u003e\n\u003cli\u003eAdd \"unwind to\" keywords to block label in assembly writer\u003c/li\u003e\n\u003cli\u003eAdd support for \"unwind to\" to bytecode reader\u003c/li\u003e\n\u003cli\u003eAdd support for \"unwind to\" to bytecode writer.\u003c/li\u003e\n\u003cli\u003eFix prune-eh to deal with \"unwindTo\" in BasicBlock.\u003c/li\u003e\n\u003cli\u003eRemove'''
