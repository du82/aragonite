description = "Bugzilla Link 10368 Version 1.0 OS All CC @asl,@zmodem,@pcc,@rengolin,@rjmccall Extended Description We currently allow ConstantExprs occur for any side-effect free LLVM IR instruction, and use ConstantExpr::get as the primitive constant..."
full_description = '''llvm / llvm-project Public Notifications You must be signed in to change notification settings Fork 12.7k Star 30.9k Code Issues 5k+ Pull requests 3.8k Actions Security Insights Additional navigation options Code Issues Pull requests Actions Security Insights {"payload":{"preloaded_records":{},"preloadedQueries":[{"queryId":"cd87f7430f54aadbc3796a541edfe198","queryName":"IssueViewerViewQuery","variables":{"id":"repository","number":10740,"owner":"llvm","repo":"llvm-project"},"result":{"data":{"repository":{"isOwnerEnterpriseManaged":false,"issue":{"id":"MDU6SXNzdWUxMDcxMDE2MTI1","updatedAt":"2021-12-03T22:23:08Z","title":"Redesign ConstantExpr's","number":10740,"repository":{"nameWithOwner":"llvm/llvm-project","id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","login":"llvm","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","url":"https://github.com/llvm"},"hasAnyTemplates":false,"isSecurityPolicyEnabled":true,"isArchived":false,"isPrivate":false,"databaseId":75821432,"slashCommandsEnabled":false,"viewerCanInteract":false,"viewerInteractionLimitReasonHTML":"","planFeatures":{"maximumAssignees":10},"visibility":"PUBLIC","pinnedIssues":{"totalCount":0},"viewerCanPinIssues":false,"issueTypes":{"edges":[{"node":{"id":"IT_kwDOAQWwKc4AIvNg"}},{"node":{"id":"IT_kwDOAQWwKc4AIvNj"}},{"node":{"id":"IT_kwDOAQWwKc4AIvNl"}}]}},"titleHTML":"Redesign ConstantExpr's","url":"https://github.com/llvm/llvm-project/issues/10740","viewerCanUpdateNext":false,"issueType":null,"state":"OPEN","stateReason":null,"duplicateOf":null,"linkedPullRequests":{"nodes":[]},"subIssuesSummary":{"total":0,"completed":0},"__isLabelable":"Issue","labels":{"edges":[{"node":{"id":"LA_kwDOBITxeM7Wz_4q","color":"29A8A3","name":"bugzilla","nameHTML":"bugzilla","description":"Issues migrated from bugzilla","url":"https://github.com/llvm/llvm-project/labels/bugzilla","__typename":"Label"},"cursor":"MQ"},{"node":{"id":"LA_kwDOBITxeM7XITWI","color":"6699cc","name":"code-cleanup","nameHTML":"code-cleanup","description":null,"url":"https://github.com/llvm/llvm-project/labels/code-cleanup","__typename":"Label"},"cursor":"Mg"},{"node":{"id":"LA_kwDOBITxeM7XIW-0","color":"6699cc","name":"llvm:core","nameHTML":"llvm:core","description":null,"url":"https://github.com/llvm/llvm-project/labels/llvm%3Acore","__typename":"Label"},"cursor":"Mw"}],"pageInfo":{"endCursor":"Mw","hasNextPage":false}},"__isNode":"Issue","assignees":{"nodes":[]},"milestone":null,"databaseId":1071016125,"viewerDidAuthor":false,"locked":false,"author":{"__typename":"User","__isActor":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw","profileUrl":"https://github.com/lattner","avatarUrl":"https://avatars.githubusercontent.com/u/15152540?u=bb801174d6fe5cea542dfb3ff8c59a2b55c0b5e0\u0026v=4"},"__isComment":"Issue","body":"| | |\n| --- | --- |\n| Bugzilla Link | [10368](https://llvm.org/bz10368) |\n| Version | 1.0 |\n| OS | All |\n| CC | @asl,@zmodem,@pcc,@rengolin,@rjmccall |\n\n## Extended Description \nWe currently allow ConstantExprs occur for any side-effect free LLVM IR instruction, and use ConstantExpr::get as the primitive constant folding API in LLVM.\n\nThis doesn't make sense for a number of reasons:\n\na) code generators can't codegen arbitrary constant exprs at arbitrary places, causing global variable initializers to explode in funny ways if the optimizer gets creative. \nb) constant expressions like divides canTrap() which is a common source of bugs.\nc) optimizers typically treat constants as cheap or free, but a ConstantExpr can have arbitrary cost.\nd) optimizers try to handle both instructions and constantexprs equally well in many cases, leading to complexity in PatternMatch.h and to the existence of the Operator classes, which are gross.\ne) we have no way to represent target-specific relocations that don't conveniently map to ConstantExprs.\n\nInstead, I propose that we implement the following plan:\n\n1. Switch everything off using ConstantExpr::get as constant folding API, onto the InstSimplify APIs, which are more general and powerful anyway.\n2. Move all of the constant folding logic out of ConstantExpr::get into InstSimplify so that ConstantExpr::get *just* creates them.\n3. Remove the canTrap() constant exprs, simplifying the world and cleaning up tons of stuff.\n4. Introduce new ConstantExprs for target specific things that we currently need like darwin_symbol_difference.\n5. Remove various extraneous constantexprs other than GEP and bitcast.\n6. Introduce a new ConstantExpr \"base_offset\" node which takes a constant pointer and integer and adds them together, returning a new pointer. Teach the optimizer to optimize them as well as ConstantExpr GEP's are right now.\n7. Remove the gep constantexpr, leaving us with the target specific ones, bitcast, and base_offset.\n8. Profit!\n\n-Chris","bodyHTML":"\u003cmarkdown-accessiblity-table\u003e\u003ctable role=\"table\"\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBugzilla Link\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://llvm.org/bz10368\" rel=\"nofollow\"\u003e10368\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVersion\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOS\u003c/td\u003e\n\u003ctd\u003eAll\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCC\u003c/td\u003e\n\u003ctd\u003e\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/asl/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/asl\"\u003e@asl\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/zmodem/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/zmodem\"\u003e@zmodem\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/pcc/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/pcc\"\u003e@pcc\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/rengolin/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/rengolin\"\u003e@rengolin\u003c/a\u003e,\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hovercard-url=\"/users/rjmccall/hovercard\" data-octo-click=\"hovercard-link-click\" data-octo-dimensions=\"link_type:self\" href=\"https://github.com/rjmccall\"\u003e@rjmccall\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/markdown-accessiblity-table\u003e\n\u003ch2 dir=\"auto\"\u003eExtended Description\u003c/h2\u003e\n\u003cp dir=\"auto\"\u003eWe currently allow ConstantExprs occur for any side-effect free LLVM IR instruction, and use ConstantExpr::get as the primitive constant folding API in LLVM.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThis doesn't make sense for a number of reasons:\u003c/p\u003e\n\u003cp dir=\"auto\"\u003ea) code generators can't codegen arbitrary constant exprs at arbitrary places, causing global variable initializers to explode in funny ways if the optimizer gets creative.\u003cbr\u003e\nb) constant expressions like divides canTrap() which is a common source of bugs.\u003cbr\u003e\nc) optimizers typically treat constants as cheap or free, but a ConstantExpr can have arbitrary cost.\u003cbr\u003e\nd) optimizers try to handle both instructions and constantexprs equally well in many cases, leading to complexity in PatternMatch.h and to the existence of the Operator classes, which are gross.\u003cbr\u003e\ne) we have no way to represent target-specific relocations that don't conveniently map to ConstantExprs.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eInstead, I propose that we implement the following plan:\u003c/p\u003e\n\u003col dir=\"auto\"\u003e\n\u003cli\u003eSwitch everything off using ConstantExpr::get as constant folding API, onto the InstSimplify APIs, which are more general and powerful anyway.\u003c/li\u003e\n\u003cli\u003eMove all of the constant folding logic out of ConstantExpr::get into InstSimplify so that ConstantExpr::get \u003cem\u003ejust\u003c/em\u003e creates them.\u003c/li\u003e\n\u003cli\u003eRemove the canTrap() constant exprs, simplifying the world and cleaning up tons of stuff.\u003c/li\u003e\n\u003cli\u003eIntroduce new ConstantExprs for target specific things that we currently need like darwin_symbol_difference.\u003c/li\u003e\n\u003cli\u003eRemove various extraneous constantexprs other than GEP and bitcast.\u003c/li\u003e\n\u003cli\u003eIntroduce a new ConstantExpr \"base_offset\" node which takes a constant pointer and integer and adds them together, returning a new pointer. Teach the optimizer to optimize them as well as ConstantExpr GEP's are right now.\u003c/li\u003e\n\u003cli\u003eRemove the gep constantexpr, leaving us with the target specific ones, bitcast, and base_offset.\u003c/li\u003e\n\u003cli\u003eProfit!\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp dir=\"auto\"\u003e-Chris\u003c/p\u003e","bodyVersion":"fdc80b1a5ed23c90ede6ff3e24ecaa8de50c4452eaee5da3988ed86d5b4cbc4c","createdAt":"2011-07-15T08:32:18Z","__isReactable":"Issue","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"viewerCanUpdateMetadata":false,"viewerCanComment":false,"viewerCanAssign":false,"viewerCanLabel":false,"__isIssueOrPullRequest":"Issue","projectItemsNext":{"edges":[],"pageInfo":{"endCursor":null,"hasNextPage":false}},"viewerCanSetMilestone":false,"isPinned":false,"viewerCanDelete":false,"viewerCanTransfer":false,"viewerCanConvertToDiscussion":false,"viewerCanLock":false,"viewerCanType":false,"frontTimelineItems":{"pageInfo":{"hasNextPage":false,"endCursor":"Y3Vyc29yOnYyOpPPAAABfYJk3OABqjU3MTQ2NzQ5MDQ="},"totalCount":5,"edges":[{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980897593,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDU6SXNzdWUxMDcxMDE2MTI1","number":10740,"locked":false,"databaseId":1071016125},"author":{"__typename":"User","login":"rengolin","avatarUrl":"https://avatars.githubusercontent.com/u/1040968?u=e7216d2f91358c32633a1e924a364d910cd6a6cf\u0026v=4","id":"MDQ6VXNlcjEwNDA5Njg="},"id":"MDEyOklzc3VlQ29tbWVudDk4MDg5NzU5Mw==","body":"Chris,\n\nReading again the description, it seems steps 1 and 2 are the same thing. I'm assuming you meant InstCombine, which has a lot of visitors, not all of them pertinent to constant folding.\n\nMaybe there is another pass that does it to constants, or there could be a visitor on InstCombine that calls all constant folding visitors, so we could call that pass at the same time (if possible) as the IR being built, emulating the current behaviour, and breaking less tests for now.\n\nThe new visitors (the ones created by moving ::get folding to InstCombine) can also run on other constants, during other passes, de-duplicating the logic and making the move easier.\n\nLater on, we can add more foldings and remove the need for folding while building IR independently of each other, and fixing the tests.\n\nDoes it make sense?","bodyHTML":"\u003cp dir=\"auto\"\u003eChris,\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eReading again the description, it seems steps 1 and 2 are the same thing. I'm assuming you meant InstCombine, which has a lot of visitors, not all of them pertinent to constant folding.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eMaybe there is another pass that does it to constants, or there could be a visitor on InstCombine that calls all constant folding visitors, so we could call that pass at the same time (if possible) as the IR being built, emulating the current behaviour, and breaking less tests for now.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThe new visitors (the ones created by moving ::get folding to InstCombine) can also run on other constants, during other passes, de-duplicating the logic and making the move easier.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eLater on, we can add more foldings and remove the need for folding while building IR independently of each other, and fixing the tests.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eDoes it make sense?\u003c/p\u003e","bodyVersion":"4c4201e02cfee2c99128d99eec2220fd232622eb133d8f4a6f4b362652224447","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/10740#issuecomment-980897593","createdAt":"2012-06-19T21:46:01Z","authorAssociation":"MEMBER","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/