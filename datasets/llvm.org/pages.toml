title = "The LLVM Compiler Infrastructure Project"
full_description = "The Euro LLVM Developers' Meeting is a bi-annual gathering of the entire LLVM Project community. The conference is organized by the LLVM Foundation and many volunteers within the LLVM community. Developers and users of LLVM, Clang, and related subprojects will enjoy attending interesting talks, impromptu discussions, and networking with the many members of our community. Whether you are a new to the LLVM project or a long time member, there is something for each attendee. To see the agenda, speakers, and register, please visit the Event Site here: https://llvm.swoogo.com/2025eurollvm The LLVM Developers' Meeting strives to be the best conference to meet other LLVM developers and users. For future announcements or questions: Please visit the LLVM Discourse forums. Most posts are in the Announcements or Community categories and tagged with usllvmdevmtg. All developers and users of LLVM and related sub-projects are invited to present at the 2025 EuroLLVM Developers’ Meeting in Berlin, Germany! This conference will be held in-person on April 15-16, and workshops on April 14th. Submit your talk proposals here by Feb 14, 2025 (end of day AoE): https://hotcrp.llvm.org/eurollvm2025/ Submission Requirements: Submissions should be sent by Feb 14 (end of day AoE). Notifications will be sent on Feb 28. Please submit your proposal here. Speakers must present in person. There is no option for virtual or recorded presentations. Free registration for speakers is limited to: Technical Talks: 1 Tutorials: 1 Student Talks: 1 Panels: 1 There is no free or discounted registration for posters, lightning talks, quick talks, or multiple presenters. For each proposal you must submit the following: Talk title Abstract Submission type For technical talk submissions, you can indicate if you would give a shorter talk (ie. Lightning or Quick instead of full length Technical Talk) Photo and bios for all speakers (required). Please do not put authors here as its used by the A/V and logistics team for A/V requirements. Short abstract for the website/program Extended PDF abstract (optional) Submissions without the required information may not be accepted. For any questions, please email events@llvm.org."
