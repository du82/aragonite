["https://llvm.org/devmtg/2014-10"]
title = "The LLVM Compiler Infrastructure Project"
full_description = "The LLVM Foundation announces the eighth annual bay area LLVM Developers' Meeting will be held October 28th and 29th in San Jose, CA. This year the conference will be 2 full days that include technical talks, BoFs, hacker’s lab, tutorials, and a poster session. Attendance will be capped at 300. The meeting serves as a forum for LLVM, Clang, LLDB and other LLVM project developers and users to get acquainted, learn how LLVM is used, and exchange ideas about LLVM and its (potential) applications. More broadly, we believe the event will be of particular interest to the following people: OpenMP Support in Clang/LLVM: Status Update and Future Directions Alexey Bataev (Speaker) - Intel, Zinovy Nis (Speaker) - Intel Slides Video OpenMP is a well-known and widely used API for shared-memory parallelism. Support for OpenMP in Clang/LLVM compiler is currently under development. In this talk, we will present current status of OpenMP support, what is done and what remains to be done, technical details behind OpenMP implementation. Also, we will elaborate on accelerators and pragma-assisted SIMD vectorization, introduced in the latest 4.0 edition of the OpenMP standard. Alive: Provably Correct InstCombine Optimizations Nuno Lopes - Microsoft Research, David Menendez (Speaker) - Rutgers University, Santosh Nagarakatte - Rutgers University John Regehr - University of Utah Slides Video Optimizations are hard to get right. Even seemingly innocuous transformations in InstCombine can miss important corner cases. With Alive, you can specify peephole optimizations in a friendly, LLVM-like language, automatically determine their correctness, and generate the corresponding C++ code. LLVM Stable Releases Tom Stellard - Advanced Micro Devices Slides Video This talk will cover LLVM stable releases, how they work, who uses them, and how we can make them better. Supporting Precise Relocating Garbage Collection in LLVM Philip Reames (Speaker) - Azul Systems, Sanjoy Das - Azul Systems (Speaker) Slides Video Generating efficient code that is compatible with common high performance garbage collector implementations will strengthen LLVM's ability to support languages with managed runtime environments. To support this common use case, we have built and are in the process of contributing a safepoint insertion pass which can rewrite optimized IR into a form which respects the invariants required by a fully relocating garbage collector, and a set of intrinsics which enable work towards efficient lowering of safepoints. We'll cover the motivation, high level design, and show off some examples."
