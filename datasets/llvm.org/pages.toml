title = "The LLVM Compiler Infrastructure Project"
full_description = '''The meeting serves as a forum for LLVM, Clang, LLDB and other LLVM project developers and users to get acquainted, learn how LLVM is used, and exchange ideas about LLVM and its (potential) applications. More broadly, we believe the event will be of particular interest to the following people: Please sign up for the LLVM Developers' Meeting list for future event announcements and to ask questions. Keynotes: Falcon: An optimizing Java JIT - Philip Reames [Video] [Slides] Compiling Android userspace and Linux kernel with LLVM - Stephen Hines, Nick Desaulniers and Greg Hackmann [Video] [Slides] Talks: Apple LLVM GPU Compiler: Embedded Dragons - Marcello Maggioni and Charu Chandrasekaran [ Video ] [ Slides ] Bringing link-time optimization to the embedded world: (Thin)LTO with Linker Scripts - Tobias Edler von Koch, Sergei Larin, Shankar Easwaran and Hemant Kulkarni [ Video ] [ Slides ] Advancing Clangd: Bringing persisted indexing to Clang tooling - Marc-Andre Laperle [ Video ] [ Slides ] The Further Benefits of Explicit Modularization: Modular Codegen - David Blaikie [ Video ] [ Slides ] eval() in C++ - Sean Callanan [ Video ] [ Slides ] The Type Sanitizer: Free Yourself from -fno-strict-aliasing - Hal Finkel [ Video ] [ Slides ] Enabling Parallel Computing in Chapel with Clang and LLVM - Michael Ferguson [ Video ] [ Slides ] Structure-aware fuzzing for Clang and LLVM with libprotobuf-mutator - Kostya Serebryany, Vitaly Buka and Matt Morehouse [ Video ] [ Slides ] Adding Index‐While‐Building and Refactoring to Clang - Alex Lorenz and Nathan Hawes [ Video ] [ Slides ] XRay in LLVM: Function Call Tracing and Analysis - Dean Michael Berris [ Video ] [ Slides ] GlobalISel: Past, Present, and Future - Quentin Colombet and Ahmed Bougacha [ Video ] [ Slides ] Dominator Trees and incremental updates that transcend time - Jakub Kuderski [ Video ] [ Slides ] Scale, Robust and Regression-Free Loop Optimizations for Scientific Fortran and Modern C++ - Tobias Grosser and Michael Kruse [ Video ] [ Slides ] Implementing Swift Generics - Douglas Gregor, Slava Pestov and John McCall [ Video ] [ Slides ] lld: A Fast, Simple, and Portable Linker - Rui Ueyama [ Video ] [ Slides ] Vectorizing Loops with VPlan – Current State and Next Steps - Ayal Zaks and Gil Rapaport [ Video ] [ Slides ] LLVM Compile-Time: Challenges. Improvements. Outlook. - Michael Zolotukhin [ Video ] [ Slides ] Challenges when building an LLVM bitcode Obfuscator - Serge Guelton, Adrien Guinet, Juan Manuel Martinez and Pierrick Brunet [ Video ] [ < a href="slides/Guelton-Challenges_when_building_an_LLVM_bitcode_Obfuscator.pdf">Slides ] Building Your Product Around LLVM Releases - Tom Stellard [ Video ] [ Slides ]'''
