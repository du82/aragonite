uld really purge all the remaining static constructors and destructors, then turn on the clang -Wglobal-constructors warning flag to prevent regressing in the future.\u003c/p\u003e","bodyVersion":"aa82f5d9aea03f87d7bc1bd71e81c71b616151b4c48ceb27ec52ea01b99cf939","createdAt":"2012-02-08T03:42:59Z","__isReactable":"Issue","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"viewerCanUpdateMetadata":false,"viewerCanComment":false,"viewerCanAssign":false,"viewerCanLabel":false,"__isIssueOrPullRequest":"Issue","projectItemsNext":{"edges":[],"pageInfo":{"endCursor":null,"hasNextPage":false}},"viewerCanSetMilestone":false,"isPinned":false,"viewerCanDelete":false,"viewerCanTransfer":false,"viewerCanConvertToDiscussion":false,"viewerCanLock":false,"viewerCanType":false,"frontTimelineItems":{"pageInfo":{"hasNextPage":true,"endCursor":"Y3Vyc29yOnYyOpPPAAABNWQKjuAAqTk4MDkwMzkzNQ=="},"totalCount":18,"edges":[{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980903949,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDU6SXNzdWUxMDcxMDI4MTU2","number":12316,"locked":false,"databaseId":1071028156},"author":{"__typename":"User","login":"d0k","avatarUrl":"https://avatars.githubusercontent.com/u/16542?v=4","id":"MDQ6VXNlcjE2NTQy"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDkwMzk0OQ==","body":"The biggest static ctor contributor in LLVM is the cl::opt command line interface. If we want to remove static ctors from LLVM we will need a replacement for that library.","bodyHTML":"\u003cp dir=\"auto\"\u003eThe biggest static ctor contributor in LLVM is the cl::opt command line interface. If we want to remove static ctors from LLVM we will need a replacement for that library.\u003c/p\u003e","bodyVersion":"2268078e058e0216bdbec6e49d30696f24b8d0835c3f64a405969b1aab12ac75","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/12316#issuecomment-980903949","createdAt":"2012-02-08T15:28:44Z","authorAssociation":"MEMBER","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/llvm"},"isPrivate":false,"slashCommandsEnabled":false,"nameWithOwner":"llvm/llvm-project","databaseId":75821432},"__isComment":"IssueComment","viewerCanReadUserContentEdits":true,"lastEditedAt":null,"lastUserContentEdit":null,"__isReactable":"IssueComment","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"__isNode":"IssueComment"},"cursor":"Y3Vyc29yOnYyOpPPAAABNV2Uv-AAqTk4MDkwMzk0OQ=="},{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980903948,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDU6SXNzdWUxMDcxMDI4MTU2","number":12316,"locked":false,"databaseId":1071028156},"author":{"__typename":"User","login":"dwblaikie","avatarUrl":"https://avatars.githubusercontent.com/u/20646145?u=604343c2cd478b1f44acb4056a30b51033b73cc3\u0026v=4","id":"MDQ6VXNlcjIwNjQ2MTQ1"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDkwMzk0OA==","body":"\u003e The biggest static ctor contributor in LLVM is the cl::opt command line\n\u003e interface. If we want to remove static ctors from LLVM we will need a\n\u003e replacement for that library.\n\nAny idea how we do that? Given that cl::opt is a registration system so that parsing command line arguments can populate/use those registrations - the trick (trivial type for the global, converting ctor for the 'real' type) done with the global Attributes doesn't apply here - because without a real ctor the registration would not occur.\n\nThe only other trick I know of is pinning data into particular linker sections that could then be walked at runtime - it'd remove the static ctor but I've only ever done something like that on Windows \u0026 not sure if/how we'd do it in a portable way for LLVM.\n\nOther ideas/thoughts?","bodyHTML":"\u003cblockquote\u003e\n\u003cp dir=\"auto\"\u003eThe biggest static ctor contributor in LLVM is the cl::opt command line\u003cbr\u003e\ninterface. If we want to remove static ctors from LLVM we will need a\u003cbr\u003e\nreplacement for that library.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp dir=\"auto\"\u003eAny idea how we do that? Given that cl::opt is a registration system so that parsing command line arguments can populate/use those registrations - the trick (trivial type for the global, converting ctor for the 'real' type) done with the global Attributes doesn't apply here - because without a real ctor the registration would not occur.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eThe only other trick I know of is pinning data into particular linker sections that could then be walked at runtime - it'd remove the static ctor but I've only ever done something like that on Windows \u0026amp; not sure if/how we'd do it in a portable way for LLVM.\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eOther ideas/thoughts?\u003c/p\u003e","bodyVersion":"cbdb454c7996d9c90de0c13afef387ed6aa96ef51c2de2bf5d6854932d2a5b23","viewerCanUpdate":false,"url":"https://github.com/llvm/llvm-project/issues/12316#issuecomment-980903948","createdAt":"2012-02-08T21:10:36Z","authorAssociation":"COLLABORATOR","viewerCanDelete":false,"viewerCanMinimize":false,"viewerCanReport":false,"viewerCanReportToMaintainer":false,"viewerCanBlockFromOrg":false,"viewerCanUnblockFromOrg":false,"isHidden":false,"minimizedReason":null,"showSpammyBadge":false,"createdViaEmail":false,"authorToRepoOwnerSponsorship":null,"repository":{"id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","login":"llvm","url":"https://github.com/llvm"},"isPrivate":false,"slashCommandsEnabled":false,"nameWithOwner":"llvm/llvm-project","databaseId":75821432},"__isComment":"IssueComment","viewerCanReadUserContentEdits":true,"lastEditedAt":null,"lastUserContentEdit":null,"__isReactable":"IssueComment","reactionGroups":[{"content":"THUMBS_UP","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"THUMBS_DOWN","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"LAUGH","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HOORAY","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"CONFUSED","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"HEART","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"ROCKET","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}},{"content":"EYES","viewerHasReacted":false,"reactors":{"totalCount":0,"nodes":[]}}],"__isNode":"IssueComment"},"cursor":"Y3Vyc29yOnYyOpPPAAABNV7NvOAAqTk4MDkwMzk0OA=="},{"node":{"__typename":"IssueComment","__isIssueTimelineItems":"IssueComment","databaseId":980903947,"viewerDidAuthor":false,"issue":{"author":{"__typename":"User","login":"lattner","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDU6SXNzdWUxMDcxMDI4MTU2","number":12316,"locked":false,"databaseId":1071028156},"author":{"__typename":"User","login":"lattner","avatarUrl":"https://avatars.githubusercontent.com/u/15152540?u=bb801174d6fe5cea542dfb3ff8c59a2b55c0b5e0\u0026v=4","id":"MDQ6VXNlcjE1MTUyNTQw"},"id":"MDEyOklzc3VlQ29tbWVudDk4MDkwMzk0Nw==","body":"There are a couple of ways to hand'''
