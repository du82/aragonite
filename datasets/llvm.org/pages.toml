1Ev to i32 (...)\u003cem\u003e), i32 (...)\u003c/em\u003e bitcast (void (%struct.test*)* @​_ZN4testD0Ev to i32 (...)\u003cem\u003e) ], align 8\t\t; \u0026lt;[4 x i32 (...)\u003c/em\u003e]\u003cem\u003e\u0026gt; [#uses=1]\u003cbr\u003e\n@​_ZTI4test = internal constant %struct.__class_type_info_pseudo { %struct.__type_info_pseudo { i8\u003c/em\u003e inttoptr (i32 add (i32 ptrtoint ([0 x i32 (...)\u003cem\u003e]\u003c/em\u003e @​_ZTVN10__cxxabiv117__class_type_infoE to i32), i32 8) to i8*), i8* getelementptr ([6 x i8]* @​_ZTS4test, i32 0, i32 0) } }\t\t; \u0026lt;%struct.__class_type_info_pseudo*\u0026gt; [#uses=1]\u003cbr\u003e\n@​_ZTVN10__cxxabiv117__class_type_infoE = external constant [0 x i32 (...)\u003cem\u003e]\t\t; \u0026lt;[0 x i32 (...)\u003c/em\u003e]\u003cem\u003e\u0026gt; [#uses=1]\u003cbr\u003e\n@​_ZTS4test = internal constant [6 x i8] c\"4test\\00\"\t\t; \u0026lt;[6 x i8]\u003c/em\u003e\u0026gt; [#uses=1]\u003cbr\u003e\n@.str = internal constant [3 x i8] c\"%d\\00\"\t\t; \u0026lt;[3 x i8]\u003cem\u003e\u0026gt; [#uses=1]\u003cbr\u003e\n@.str1 = internal constant [4 x i8] c\"%d\\0A\\00\"\t\t; \u0026lt;[4 x i8]\u003c/em\u003e\u0026gt; [#uses=1]\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edefine i32 @​main() {\u003cbr\u003e\nentry:\u003cbr\u003e\n%t = alloca %struct.test, align 16\t\t; \u0026lt;%struct.test*\u0026gt; [#uses=2]\u003cbr\u003e\n%tmp2 = getelementptr %struct.test* %t, i32 0, i32 0\t\t; \u0026lt;i32 (...)\u003cem\u003e\u003cstrong\u003e\u0026gt; [#uses=1]\u003cbr\u003e\nstore i32 (...)\u003c/strong\u003e getelementptr ([4 x i32 (...)\u003c/em\u003e]* @​_ZTV4test, i32 0, i64 2), i32 (...)*** %tmp2\u003cbr\u003e\n%tmp4 = getelementptr %struct.test* %t, i32 0, i32 1\t\t; \u0026lt;i32*\u0026gt; [#uses=2]\u003cbr\u003e\n%tmp5 = call i32 (i8*, ...)* @​scanf( i8* getelementptr ([3 x i8]* @.str, i32 0, i32 0), i32* %tmp4 )\t\t; [#uses=0]\u003cbr\u003e\n%tmp7 = load i32* %tmp4\t\t; [#uses=1]\u003cbr\u003e\n%tmp10 = call i32 (i8*, ...)* @​printf( i8* getelementptr ([4 x i8]* @.str1, i32 0, i32 0), i32 %tmp7 )\t\t; [#uses=0]\u003cbr\u003e\nret i32 0\u003cbr\u003e\n}\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edefine internal void @​_ZN4testD1Ev(%struct.test* %this) {\u003cbr\u003e\nentry:\u003cbr\u003e\n%tmp2 = getelementptr %struct.test* %this, i32 0, i32 0\t\t; \u0026lt;i32 (...)\u003cem\u003e\u003cstrong\u003e\u0026gt; [#uses=1]\u003cbr\u003e\nstore i32 (...)\u003c/strong\u003e getelementptr ([4 x i32 (...)\u003c/em\u003e]* @​_ZTV4test, i32 0, i64 2), i32 (...)*** %tmp2\u003cbr\u003e\nret void\u003cbr\u003e\n}\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edefine internal void @​_ZN4testD0Ev(%struct.test* %this) {\u003cbr\u003e\nentry:\u003cbr\u003e\n%tmp2 = getelementptr %struct.test* %this, i32 0, i32 0\t\t; \u0026lt;i32 (...)\u003cem\u003e\u003cstrong\u003e\u0026gt; [#uses=1]\u003cbr\u003e\nstore i32 (...)\u003c/strong\u003e getelementptr ([4 x i32 (...)\u003c/em\u003e]* @​_ZTV4test, i32 0, i64 2), i32 (...)*** %tmp2\u003cbr\u003e\n%tmp56 = bitcast %struct.test* %this to i8*\t\t; \u0026lt;i8*\u0026gt; [#uses=1]\u003cbr\u003e\ntail call void @​_ZdlPv( i8* %tmp56 )\u003cbr\u003e\nret void\u003cbr\u003e\n}\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edeclare void @​_ZdlPv(i8*)\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edeclare i32 @​scanf(i8*, ...)\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edeclare i32 @​printf(i8*, ...)\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eNone of the internal (apart from string literals) and external constants and the @​_ZN4testD1Ev and @​_ZN4testD0Ev functions are useful at all.\u003cbr\u003e\nFor example, if there is no scanf performed (initialized to 0 instead), we get the following code:\u003c/p\u003e\n\u003cp dir=\"auto\"\u003etarget datalayout = \"e-p:32:32:32-i1:8:8-i8:8:8-i16:16:16-i32:32:32-i64:32:64-f32:32:32-f64:32:64-v64:64:64-v128:128:128-a0:0:64\"\u003cbr\u003e\ntarget triple = \"i686-pc-linux-gnu\"\u003cbr\u003e\n%struct.test = type { i32 }\u003cbr\u003e\n@.str = internal constant [4 x i8] c\"%d\\0A\\00\"\t\t; \u0026lt;[4 x i8]*\u0026gt; [#uses=1]\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edefine i32 @​main() {\u003cbr\u003e\nentry:\u003cbr\u003e\n%tmp4 = tail call i32 (i8*, ...)* @​printf( i8* getelementptr ([4 x i8]* @.str, i32 0, i32 0), i32 0 )\t\t; [#uses=0]\u003cbr\u003e\nret i32 0\u003cbr\u003e\n}\u003c/p\u003e\n\u003cp dir=\"auto\"\u003edeclare i32 @​printf(i8*, ...)\u003c/p\u003e\n\u003cp dir=\"auto\"\u003eIt seems that because scanf takes a pointer to a member of test, the test object must be kept as it is, including the pointer to the vtable, and the vtable itself must thus stay in the code.\u003cbr\u003e\nHowever it's only a member of test, not a test object itself, so this is not really needed.\u003cbr\u003e\nIs this a bug or this is normal behaviour? If it's not a bug, would there be a way to instruct the compiler or extend the language in a way where it would be possible to elide the unneeded bloat?\u003c/p\u003e","bodyVersion":"dfd843a9cde4860b0f50451adf0e083bc24f3fdb7c3d2da4c8ce613c5'''
