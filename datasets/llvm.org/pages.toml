["https://llvm.org/docs/AliasAnalysis.html"]
title = "LLVM Alias Analysis Infrastructure — LLVM 21.0.0git documentation"
full_description = "LLVM Alias Analysis Infrastructure¶ Introduction AliasAnalysis Class Overview Representation of Pointers The alias method Must, May, and No Alias Responses The getModRefInfo methods Other useful AliasAnalysis methods The getModRefInfoMask method The doesNotAccessMemory and onlyReadsMemory methods Writing a new AliasAnalysis Implementation Different Pass styles Required initialization calls Required methods to override Interfaces which may be specified AliasAnalysis chaining behavior Updating analysis results for transformations The deleteValue method The copyValue method The replaceWithNewValue method The addEscapingUse method Efficiency Issues Limitations Using alias analysis results Using the MemoryDependenceAnalysis Pass Using the AliasSetTracker class The AliasSetTracker implementation Using the AliasAnalysis interface directly Existing alias analysis implementations and clients Available AliasAnalysis implementations The -basic-aa pass The -globalsmodref-aa pass The -steens-aa pass The -ds-aa pass The -scev-aa pass Alias analysis driven transformations The -adce pass The -licm pass The -argpromotion pass The -gvn, -memcpyopt, and -dse passes Clients for debugging and evaluation of implementations The -print-alias-sets pass The -aa-eval pass Memory Dependence Analysis Introduction¶ Alias Analysis (aka Pointer Analysis) is a class of techniques which attempt to determine whether or not two pointers ever can point to the same object in memory. There are many different algorithms for alias analysis and many different ways of classifying them: flow-sensitive vs. flow-insensitive, context-sensitive vs. context-insensitive, field-sensitive vs. field-insensitive, unification-based vs. subset-based, etc. Traditionally, alias analyses respond to a query with a Must, May, or No alias response, indicating that two pointers always point to the same object, might point to the same object, or are known to never point to the same object. The LLVM AliasAnalysis class is the primary interface used by clients and implementations of alias analyses in the LLVM system. This class is the common interface between clients of alias analysis information and the implementations providing it, and is designed to support a wide range of implementations and clients (but currently all clients are assumed to be flow-insensitive). In addition to simple alias analysis information, this class exposes Mod/Ref information from those implementations which can provide it, allowing for powerful analyses and transformations to work well together. This document contains information necessary to successfully implement this interface, use it, and to test both sides. It also explains some of the finer points about what exactly results mean. AliasAnalysis Class Overview¶ The AliasAnalysis class defines the interface that the various alias analysis implementations should support. This class exports two important enums: AliasResult and ModRefResult which represent the result of an alias query or a mod/ref query, respectively. The AliasAnalysis interface exposes information about memory, represented in several different ways. In particular, memory objects are represented as a starting address and size, and function calls are represented as the actual call or invoke instructions that performs the call. The AliasAnalysis interface also exposes some helper methods which allow you to get mod/ref information for arbitrary instructions. All AliasAnalysis interfaces require that in queries involving multiple values, values which are not constants are all defined within the same function. Representation of Pointers¶ Most importantly, the AliasAnalysis class provides several methods which are used to query whether or not two memory objects alias, whether function calls can modify or read a memory object, etc. For all of these queries, memory objects are represented as a pair of their starting address (a symbolic LLVM Value*) and a static size. Representing memory objects as a starting address and a size is critically important for correct Alias Analyses. For example, consider this (silly, but possible) C code: int i; char C[2]; char A[10]; /* ... */ for (i = 0; i != 10; ++i) { C[0] = A[i]; /* One byte store */ C[1] = A[9-i]; /* One byte store */ } In this case, the basic-aa pass will disambiguate the stores to C[0] and C[1] because they are accesses to two distinct locations one byte apart, and the accesses are each one byte. In this case, the Loop Invariant Code Motion (LICM) pass can use store motion to remove the stores from the loop. In contrast, the following code: int i; char C[2]; char A[10]; /* ... */ for (i = 0; i != 10; ++i) { ((short*)C)[0] = A[i]; /* Two byte store! */ C[1] = A[9-i]; /* One byte store */ } In this case, the two stores to C do alias each other, because the access to the &C[0] element is a two byte access. If size information wasn’t available in the query, even the first case would have to conservatively assume that the accesses alias. The alias method¶ The alias method is the primary interface used to determine whether or not two memory objects alias each other. It takes two memory objects as input and returns MustAlias, PartialAlias, MayAlias, or NoAlias as appropriate. Like all AliasAnalysis interfaces, the alias method requires that either the two pointer values be defined within the same function, or at least one of the values is a constant. Must, May, and No Alias Responses¶ The NoAlias response may be used when there is never an immediate dependence between any memory reference based on one pointer and any memory reference based the other. The most obvious example is when the two pointers point to non-overlapping memory ranges. Another is when the two pointers are only ever used for reading memory. Another is when the memory is freed and reallocated between accesses through one pointer and accesses through the other — in this case, there is a dependence, but it’s mediated by the free and reallocation. As an exception to this is with the noalias keyword; the “irrelevant” dependencies are ignored. The MayAlias response is used whenever the two pointers might refer to the same object. The PartialAlias response is used when the two memory objects are known to be overlapping in some way, regardless whether they start at the same address or not. The MustAlias response may only be returned if the two memory objects are guaranteed to always start at exactly the same location. A MustAlias response does not imply that the pointers compare equal. The getModRefInfo methods¶ The getModRefInfo methods return information about whether the execution of an instruction can read or modify a memory location. Mod/Ref information is always conservative: if an instruction might read or write a location, ModRef is returned. The AliasAnalysis class also provides a getModRefInfo method for testing dependencies between function calls. This method takes two call sites (CS1 & CS2), returns NoModRef if neither call writes to memory read or written by the other, Ref if CS1 reads memory written by CS2, Mod if CS1 writes to memory read or written by CS2, or ModRef if CS1 might read or write memory written to by CS2. Note that this relation is not commutative. Other useful AliasAnalysis methods¶ Several other tidbits of information are often collected by various alias analysis implementations and can be put to good use by various clients. The getModRefInfoMask method¶ The getModRefInfoMask method returns a bound on Mod/Ref information for the supplied pointer, based on knowledge about whether the pointer points to globally-constant memory (for which it returns NoModRef) or locally-invariant memory (for which it returns Ref). Globally-constant memory includes functions, constant global variables, and the null pointer. Locally-invariant memory is memory that we know is invariant for the lifetime of its SSA value, but not necessarily for the life of the program: for example, the memory pointed to by readonly noalias parameters is known-invariant for the duration of the corresponding function call. Given Mod/Ref information MRI for a memory location Loc, MRI can be refined with a statement like MRI &= AA.getModRefInfoMask(Loc);. Another useful idiom is isModSet(AA.getModRefInfoMask(Loc)); this checks to see if the given location can be modified at all. For convenience, there is also a method pointsToConstantMemory(Loc); this is synonymous with isNoModRef(AA.getModRefInfoMask(Loc)). The doesNotAccessMemory and onlyReadsMemory methods¶ These methods are used to provide very simple mod/ref information for function calls. The doesNotAccessMemory method returns true for a function if the analysis can prove that the function never reads or writes to memory, or if the function only reads from constant memory. Functions with this property are side-effect free and only depend on their input arguments, allowing them to be eliminated if they form common subexpressions or be hoisted out of loops. Many common functions behave this way (e.g., sin and cos) but many others do not (e.g., acos, which modifies the errno variable). The onlyReadsMemory method returns true for a function if analysis can prove that (at most) the function only reads from non-volatile memory. Functions with this property are side-effect free, only depending on their input arguments and the state of memory when they are called. This property allows calls to these functions to be eliminated and moved around, as long as there is no store instruction that changes the contents of memory. Note that all functions that satisfy the doesNotAccessMemory method also satisfy onlyReadsMemory. Writing a new AliasAnalysis Implementation¶ Writing a new alias analysis implementation for LLVM is quite straight-forward. There are already several implementations that you can use for examples, and the following information should help fill in any details. For examples, take a look at the various alias analysis implementations included with LLVM. Different Pass styles¶ The first step to determining what type of LLVM pass you need to use for your Alias Analysis. As is the case with most other analyses and transformations, the answer should be fairly obvious from what type of problem you are trying to solve: If you require interprocedural analysis, it should be a Pass. If you are a function-local analysis, subclass FunctionPass. If you don’t need to look at the program at all, subclass ImmutablePass. In addition to the pass that you subclass, you should also inherit from the AliasAnalysis interface, of course, and use the RegisterAnalysisGroup template to register as an implementation of AliasAnalysis. Required initialization calls¶ Your subclass of AliasAnalysis is required to invoke two methods on the AliasAnalysis base class: getAnalysisUsage and InitializeAliasAnalysis. In particular, your implementation of getAnalysisUsage should explicitly call into the AliasAnalysis::getAnalysisUsage method in addition to doing any declaring any pass dependencies your pass has. Thus you should have something like this: void getAnalysisUsage(AnalysisUsage &AU) const { AliasAnalysis::getAnalysisUsage(AU); // declare your dependencies here. } Additionally, your must invoke the InitializeAliasAnalysis method from your analysis run method (run for a Pass, runOnFunction for a FunctionPass, or InitializePass for an ImmutablePass). For example (as part of a Pass): bool run(Module &M) { InitializeAliasAnalysis(this); // Perform analysis here... return false; } Required methods to override¶ You must override the getAdjustedAnalysisPointer method on all subclasses of AliasAnalysis. An example implementation of this method would look like: void *getAdjustedAnalysisPointer(const void* ID) override { if (ID == &AliasAnalysis::ID) return (AliasAnalysis*)this; return this; } Interfaces which may be specified¶ All of the AliasAnalysis virtual methods default to providing chaining to another alias analysis implementation, which ends up returning conservatively correct information (returning “May” Alias and “Mod/Ref” for alias and mod/ref queries respectively). Depending on the capabilities of the analysis you are implementing, you just override the interfaces you can improve. AliasAnalysis chaining behavior¶ Every alias analysis pass chains to another alias analysis implementation (for example, the user can specify “-basic-aa -ds-aa -licm” to get the maximum benefit from both alias analyses). The alias analysis class automatically takes care of most of this for methods that you don’t override. For methods that you do override, in code paths that return a conservative MayAlias or Mod/Ref result, simply return whatever the superclass computes. For example: AliasResult alias(const Value *V1, unsigned V1Size, const Value *V2, unsigned V2Size) { if (...) return NoAlias; ... // Couldn't determine a must or no-alias result. return AliasAnalysis::alias(V1, V1Size, V2, V2Size); } In addition to analysis queries, you must make sure to unconditionally pass LLVM update notification methods to the superclass as well if you override them, which allows all alias analyses in a change to be updated. Updating analysis results for transformations¶ Alias analysis information is initially computed for a static snapshot of the program, but clients will use this information to make transformations to the code. All but the most trivial forms of alias analysis will need to have their analysis results updated to reflect the changes made by these transformations. The AliasAnalysis interface exposes four methods which are used to communicate program changes from the clients to the analysis implementations. Various alias analysis implementations should use these methods to ensure that their internal data structures are kept up-to-date as the program changes (for example, when an instruction is deleted), and clients of alias analysis must be sure to call these interfaces appropriately. The deleteValue method¶ The deleteValue method is called by transformations when they remove an instruction or any other value from the program (including values that do not use pointers). Typically alias analyses keep data structures that have entries for each value in the program. When this method is called, they should remove any entries for the specified value, if they exist. The copyValue method¶ The copyValue method is used when a new value is introduced into the program. There is no way to introduce a value into the program that did not exist before (this doesn’t make sense for a safe compiler transformation), so this is the only way to introduce a new value. This method indicates that the new value has exactly the same properties as the value being copied. The replaceWithNewValue method¶ This method is a simple helper method that is provided to make clients easier to use. It is implemented by copying the old analysis information to the new value, then deleting the old value. This method cannot be overr"
