full_description = 'llvm / llvm-project Public Notifications You must be signed in to change notification settings Fork 12.7k Star 30.9k Code Issues 5k+ Pull requests 3.8k Actions Security Insights Additional navigation options Code Issues Pull requests Actions Security Insights {"payload":{"preloaded_records":{},"preloadedQueries":[{"queryId":"cd87f7430f54aadbc3796a541edfe198","queryName":"IssueViewerViewQuery","variables":{"id":"repository","number":36588,"owner":"llvm","repo":"llvm-project"},"result":{"data":{"repository":{"isOwnerEnterpriseManaged":false,"issue":{"id":"MDU6SXNzdWUxMDc2NzY0MTM2","updatedAt":"2022-02-04T20:58:17Z","title":"-g causes different code to be generated due to PostRA scheduling differences","number":36588,"repository":{"nameWithOwner":"llvm/llvm-project","id":"MDEwOlJlcG9zaXRvcnk3NTgyMTQzMg==","name":"llvm-project","owner":{"__typename":"Organization","login":"llvm","id":"MDEyOk9yZ2FuaXphdGlvbjE3MTQ5OTkz","url":"https://github.com/llvm"},"hasAnyTemplates":false,"isSecurityPolicyEnabled":true,"isArchived":false,"isPrivate":false,"databaseId":75821432,"slashCommandsEnabled":false,"viewerCanInteract":false,"viewerInteractionLimitReasonHTML":"","planFeatures":{"maximumAssignees":10},"visibility":"PUBLIC","pinnedIssues":{"totalCount":0},"viewerCanPinIssues":false,"issueTypes":{"edges":[{"node":{"id":"IT_kwDOAQWwKc4AIvNg"}},{"node":{"id":"IT_kwDOAQWwKc4AIvNj"}},{"node":{"id":"IT_kwDOAQWwKc4AIvNl"}}]}},"titleHTML":"-g causes different code to be generated due to PostRA scheduling differences","url":"https://github.com/llvm/llvm-project/issues/36588","viewerCanUpdateNext":false,"issueType":null,"state":"OPEN","stateReason":null,"duplicateOf":null,"linkedPullRequests":{"nodes":[]},"subIssuesSummary":{"total":0,"completed":0},"__isLabelable":"Issue","labels":{"edges":[{"node":{"id":"MDU6TGFiZWwxOTU4OTc0MTc5","color":"1dd617","name":"backend:AArch64","nameHTML":"backend:AArch64","description":"","url":"https://github.com/llvm/llvm-project/labels/backend%3AAArch64","__typename":"Label"},"cursor":"MQ"},{"node":{"id":"LA_kwDOBITxeM7Wz_4q","color":"29A8A3","name":"bugzilla","nameHTML":"bugzilla","description":"Issues migrated from bugzilla","url":"https://github.com/llvm/llvm-project/labels/bugzilla","__typename":"Label"},"cursor":"Mg"}],"pageInfo":{"endCursor":"Mg","hasNextPage":false}},"__isNode":"Issue","assignees":{"nodes":[]},"milestone":null,"databaseId":1076764136,"viewerDidAuthor":false,"locked":false,"author":{"__typename":"User","__isActor":"User","login":"llvmbot","id":"MDQ6VXNlcjYwOTQ0OTM1","profileUrl":"https://github.com/llvmbot","avatarUrl":"https://avatars.githubusercontent.com/u/60944935?v=4"},"__isComment":"Issue","body":"| | |\n| --- | --- |\n| Bugzilla Link | [37240](https://llvm.org/bz37240) |\n| Version | trunk |\n| OS | All |\n| Blocks | llvm/llvm-project#37076 |\n| Reporter | LLVM Bugzilla Contributor |\n| CC | @Arnaud-de-Grandmaison-ARM,@francisvm,@froydnj,@hiraditya,@jmorse,@OCHyams,@pogo59,@smithp35,@yuanfang-chen |\n\n## Extended Description \nWhen -g (or just -gline-tables-only) is passed to clang, CFI_INSTRUCTIONs are added to the function prologue by the Prologue/Epilogue insertion pass. These instructions act as scheduling region barriers when the PostRA scheduler is run. This can lead to different schedules for the prologue block, which can further lead to differences in tail merging/duplication.\n\nA simple example the illustrates the problem:\n\ntarget triple = \"aarch64-linux-gnu\"\n\n@\u0026#8203;X1 = global i32 0, align 4\n@\u0026#8203;X2 = global i32 0, align 4\n@\u0026#8203;X3 = global i32 0, align 4\n@\u0026#8203;X4 = global i32 0, align 4\n\ndefine void @\u0026#8203;test(i32 %i) #\u0026#8203;0 {\nentry:\n %0 = load i32, i32* @\u0026#8203;X1, align 4\n %x1 = add i32 %0, 1\n %x2 = add i32 %0, 2\n %x3 = add i32 %0, 3\n %x4 = add i32 %0, 4\n tail call void @\u0026#8203;foo()\n store i32 %x1, i32* @\u0026#8203;X1, align 4\n store i32 %x2, i32* @\u0026#8203;X2, align 4\n store i32 %x3, i32* @\u0026#8203;X3, align 4\n store i32 %x4, i32* @\u0026#8203;X4, align 4\n ret void\n}\n\ndeclare void @\u0026#8203;foo()\n\nattributes #\u0026#8203;0 = { nounwind }\n\n!llvm.dbg.cu = !{#0}\n!llvm.module.flags = !{#3, !\u0026#8203;4, !\u0026#8203;5}\n!\u0026#8203;0 = distinct !DICompileUnit(language: DW_LANG_C99, file: !\u0026#8203;1, producer: \"clang version 7.0.0 (trunk 330790) (llvm/trunk 330787)\", isOptimized: true, runtimeVersion: 0, emissionKind: LineTablesOnly, enums: !\u0026#8203;2)\n!\u0026#8203;1 = !DIFile(filename: \"test.c\", directory: \"\")\n!\u0026#8203;2 = !{}\n!\u0026#8203;3 = !{i32 2, !\"Dwarf Version\", i32 4}\n!\u0026#8203;4 = !{i32 2, !\"Debug Info Version\", i32 3}\n!\u0026#8203;5 = !{i32 1, !\"wchar_size\", i32 4}\n\n\nwhen compiled as is (i.e. with debug info), produces the following code:\n\n stp x23, x22, [sp, #-48]! // 8-byte Folded Spill\n stp x21, x20, [sp, #\u0026#8203;16] // 8-byte Folded Spill\n stp x19, x30, [sp, #\u0026#8203;32] // 8-byte Folded Spill\n .cfi_def_cfa_offset 48\n .cfi_offset w30, -8\n .cfi_offset w19, -16\n .cfi_offset w20, -24\n .cfi_offset w21, -32\n .cfi_offset w22, -40\n .cfi_offset w23, -48\n adrp x19, X1\n ldr w8, [x19, :lo12:X1]\n add w20, w8, #\u0026#8203;1 // =1\n add w21, w8, #\u0026#8203;2 // =2\n add w22, w8, #\u0026#8203;3 // =3\n add w23, w8, #\u0026#8203;4 // =4\n bl foo\n adrp x8, X2\n str w20, [x19, :lo12:X1]\n str w21, [x8, :lo12:X2]\n ldp x19, x30, [sp, #\u0026#8203;32] // 8-byte Folded Reload\n ldp x21, x20, [sp, #\u0026#8203;16] // 8-byte Folded Reload\n adrp x9, X3\n adrp x10, X4\n str w22, [x9, :lo12:X3]\n str w23, [x10, :lo12:X4]\n ldp x23, x22, [sp], #\u0026#8203;48 // 8-byte Folded Reload\n ret\n\n\nbut when the debug metadata is commented out, it produces the following code instead:\n\n stp x23, x22, [sp, #-48]! // 8-byte Folded Spill\n stp x19, x30, [sp, #\u0026#8203;32] // 8-byte Folded Spill\n adrp x19, X1\n ldr w8, [x19, :lo12:X1]\n stp x21, x20, [sp, #\u0026#8203;16] // 8-byte Folded Spill\n add w20, w8, #\u0026#8203;1 // =1\n add w21, w8, #\u0026#8203;2 // =2\n add w22, w8, #\u0026#8203;3 // =3\n add w23, w8, #\u0026#8203;4 // =4\n bl foo\n adrp x8, X2\n str w20, [x19, :lo12:X1]\n str w21, [x8, :lo12:X2]\n ldp x19, x30, [sp, #\u0026#8203;32] // 8-byte Folded Reload\n ldp x21, x20, [sp, #\u0026#8203;16] // 8-byte Folded Reload\n adrp x9, X3\n adrp x10, X4\n str w22, [x9, :lo12:X3]\n str w23, [x10, :lo12:X4]\n ldp x23, x22, [sp], #\u0026#8203;48 // 8-byte Folded Reload\n ret\n\nNote the different position in the schedule of the first adrp and ldr instructions.","bodyHTML":"\u003cmarkdown-accessiblity-table\u003e\u003ctable role=\"table\"\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBugzilla Link\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://llvm.org/bz37240\" rel=\"nofollow\"\u003e37240\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVersion\u003c/td\u003e\n\u003ctd\u003etrunk\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOS\u003c/td\u003e\n\u003ctd\u003eAll\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBlocks\u003c/td\u003e\n\u003ctd\u003e\u003ca class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"1076787623\" data-permission-text=\"Title is private\" data-url=\"https://github.com/llvm/llvm-project/issues/37076\" data-hovercard-type=\"issue\" data-hovercard-url=\"/llvm/llvm-project/issues/37076/hovercard\" href=\"https://github.com/llvm/llvm-project/issues/37076\"\u003e#37076\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eReporter\u003c/td\u003e\n\u003ctd\u003eLLVM Bugzilla Contributor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCC\u003c/td\u003e\n\u003ctd\u003e\u003ca class=\"user-mention notranslate\" data-hovercard-type=\"user\" data-hov