["https://lmb.informatik.uni-freiburg.de/Publications/2023/Bro23"]
title = "Unsupervised semantic segmentation with self-supervised object-centric representations"
full_description = 'Unsupervised semantic segmentation with self-supervised object-centric representations A. Zadaianchuk, M. Kleindessner, Y. Zhu, F. Locatello, Thomas Brox International Conference on Learning Representations (ICLR), 2023 Abstract: In this paper, we show that recent advances in self-supervised representation learning enable unsupervised object discovery and semantic segmentation with a performance that matches the state of the field on supervised semantic segmentation 10 years ago. We propose a methodology based on unsupervised saliency masks and self-supervised feature clustering to kickstart object discovery followed by training a semantic segmentation network on pseudo-labels to bootstrap the system on images with multiple objects. We show that while being conceptually simple our proposed baseline is surprisingly strong. We present results on PASCAL VOC that go far beyond the current state of the art (50.0 mIoU) , and we report for the first time results on MS COCO for the whole set of 81 classes: our method discovers 34 categories with more than 20% IoU, while obtaining an average IoU of 19.6 for all 81 categories. Other associated files : Images and movies BibTex reference @InProceedings{Bro23, author = "A. Zadaianchuk and M. Kleindessner and Y. Zhu and F. Locatello and T. Brox", title = "Unsupervised semantic segmentation with self-supervised object-centric representations", booktitle = "International Conference on Learning Representations (ICLR)", month = " ", year = "2023", url = "http://lmb.informatik.uni-freiburg.de/Publications/2023/Bro23" } Other publications in the database » Thomas Brox'
