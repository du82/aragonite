["https://lmb.informatik.uni-freiburg.de/Publications/2021/CRB21"]
title = "Deep learning is widely applicable to phenotyping embryonic development and disease"
full_description = '''Deep learning is widely applicable to phenotyping embryonic development and disease T. Naert, �. Cicek, P. Ogar, M. Buergi, N. Shaidani, M. Kaminski, Y. Xu, K. Grand, M. Vujanovic, D. Prata, F. Hildebrandt, Thomas Brox, Olaf Ronneberger, F. Voigt, F. Helmchen, J. Loffing, M. Horb, H. Willsey, S. Lienkamp Development, 148(21), 2021 Abstract: Genome editing simplifies the generation of new animal models for congenital disorders. However, the detailed and unbiased phenotypic assessment of altered embryonic development remains a challenge. Here, we explore how deep learning (U-Net) can automate segmentation tasks in various imaging modalities, and we quantify phenotypes of altered renal, neural and craniofacial development in Xenopus embryos in comparison with normal variability. We demonstrate the utility of this approach in embryos with polycystic kidneys (pkd1 and pkd2) and craniofacial dysmorphia (six1). We highlight how in toto light-sheet microscopy facilitates accurate reconstruction of brain and craniofacial structures within X. tropicalis embryos upon dyrk1a and six1 loss of function or treatment with retinoic acid inhibitors. These tools increase the sensitivity and throughput of evaluating developmental malformations caused by chemical or genetic disruption. Furthermore, we provide a library of pre-trained networks and detailed instructions for applying deep learning to the reader's own datasets. We demonstrate the versatility, precision and scalability of deep neural network phenotyping on embryonic disease models. By combining light-sheet microscopy and deep learning, we provide a framework for higher-throughput characterization of embryonic model organisms. This article has an associated 'The people behind the papers' interview. Publisher's link Images and movies BibTex reference @Article{CRB21, author = "T. Naert and {\"O}. Cicek and P. Ogar and M. Buergi and N.-I. Shaidani and M. Kaminski and Y. Xu and K. Grand and M. Vujanovic and D. Prata and F. Hildebrandt and T. Brox and O. Ronneberger and F. Voigt and F. Helmchen and J. Loffing and M. Horb and H. Willsey and S. Lienkamp", title = "Deep learning is widely applicable to phenotyping embryonic development and disease", journal = "Development", number = "21", volume = "148", month = " ", year = "2021", url = "http://lmb.informatik.uni-freiburg.de/Publications/2021/CRB21" } Other publications in the database » �zg�n �i�ek » Olaf Ronneberger » Thomas Brox'''
