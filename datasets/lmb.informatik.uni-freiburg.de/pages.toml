["https://lmb.informatik.uni-freiburg.de/Publications/2022/GBB22"]
title = "Probing Contextual Diversity for Dense Out-of-Distribution Detection"
full_description = '''Probing Contextual Diversity for Dense Out-of-Distribution Detection Silvio Galesso, Maria A. Bravo, M. Naouar, Thomas Brox European Conference on Computer Vision (ECCV) Workshops, 2022 Abstract: Detection of out-of-distribution (OoD) samples in the context of image classification has recently become an area of interest and active study, along with the topic of uncertainty estimation, to which it is closely related. In this paper we explore the task of OoD segmentation, which has been studied less than its classification counterpart and presents additional challenges. Segmentation is a dense prediction task for which the model's outcome for each pixel depends on its surroundings. The receptive field and the reliance on context play a role for distinguishing different classes and, correspondingly, for spotting OoD entities. We introduce MOoSe, an efficient strategy to leverage the various levels of context represented within semantic segmentation models and show that even a simple aggregation of multi-scale representations has consistently positive effects on OoD detection and uncertainty estimation. Paper Supplementary Images and movies BibTex reference @InProceedings{GBB22, author = "S. Galesso and M. Bravo and M. Naouar and T. Brox", title = "Probing Contextual Diversity for Dense Out-of-Distribution Detection", booktitle = "European Conference on Computer Vision (ECCV) Workshops", month = " ", year = "2022", url = "http://lmb.informatik.uni-freiburg.de/Publications/2022/GBB22" } Other publications in the database » Silvio Galesso » Maria A. Bravo » Thomas Brox'''
