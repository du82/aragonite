["https://lmb.informatik.uni-freiburg.de/Publications/2017/SZB17a"]
title = "Orientation-boosted voxel nets for 3D object recognition"
full_description = 'Orientation-boosted voxel nets for 3D object recognition Nima Sedaghat, Mohammadreza Zolfaghari, E. Amiri, Thomas Brox British Machine Vision Conference (BMVC), 2017 Abstract: Recent work has shown good recognition results in 3D object recognition using 3D convolutional networks. In this paper, we show that the object orientation plays an important role in 3D recognition. More specifically, we argue that objects induce different features in the network under rotation. Thus, we approach the category-level classification task as a multi-task problem, in which the network is trained to predict the pose of the object in addition to the class label as a parallel task. We show that this yields significant improvements in the classification results. We test our suggested architecture on several datasets representing various 3D data sources: LiDAR data, CAD models, and RGB-D images. We report state-of-the-art results on classification as well as significant improvements in precision and speed over the baseline on 3D detection. Other associated files : Images and movies See also Code and datasets available on our GitHub page. BibTex reference @InProceedings{SZB17a, author = "N. Sedaghat and M. Zolfaghari and E. Amiri and T. Brox", title = "Orientation-boosted voxel nets for 3D object recognition", booktitle = "British Machine Vision Conference (BMVC)", month = " ", year = "2017", url = "http://lmb.informatik.uni-freiburg.de/Publications/2017/SZB17a" } Other publications in the database » Nima Sedaghat » Mohammadreza Zolfaghari » Thomas Brox'
