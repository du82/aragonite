full_description = "Jobs PostDoc/PhD positions PhD positions in 2025 will be filled via the ELLIS PhD program. The deadline for applications is November 15, 2024. Only use the application portal and do not write emails. Highly qualified postdocs in Computer Vision or Machine Learning are welcome to reach out with their CV. They come from a good lab, have a strong track record from their PhD, e.g. publications at CVPR, ECCV, ICCV, NeurIPS, ICML, ICLR, and are capable working largely independently on their own research idea while co-supervising one or two PhD students from my group. If your CV looks promising, we will come back to you. HiWi positions There are currently no open HiWi positions. If you are interested in working as a tutor for the Image Processing and Computer Graphics course in the next summer term, and you have the necessary qualification (successfully taken the course yourself), please contact Prof. Thomas Brox and Prof. Matthias Teschner. Internships We do not offer any summer internship positions. All applications for internships will be ignored."
