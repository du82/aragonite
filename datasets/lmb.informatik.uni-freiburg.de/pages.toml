["https://lmb.informatik.uni-freiburg.de/Publications/2023/MB23a"]
title = "Best Practices in Active Learning for Semantic Segmentation"
full_description = 'Best Practices in Active Learning for Semantic Segmentation Sudhanshu Mittal, J. Niemeijer, J. Sch�fer, Thomas Brox German Conference on Pattern Recognition (GCPR), 2023 Abstract: Active learning is particularly of interest for semantic segmentation, where annotations are costly. Previous academic studies focused on datasets that are already very diverse and where the model is trained in a supervised manner with a large annotation budget. In contrast, data collected in many driving scenarios is highly redundant, and most medical applications are subject to very constrained annotation budgets. This work investigates the various types of existing active learning methods for semantic segmentation under diverse conditions across three dimensions - data distribution w.r.t. different redundancy levels, integration of semi-supervised learning, and different labeling budgets. We find that these three underlying factors are decisive for the selection of the best active learning approach. As an outcome of our study, we provide a comprehensive usage guide to obtain the best performance for each case. We also propose an exemplary evaluation task for driving scenarios, where data has high redundancy, to showcase the practical implications of our research findings. Paper Images and movies BibTex reference @InProceedings{MB23a, author = "S. Mittal and J. Niemeijer and J. Sch{\"a}fer and T. Brox", title = "Best Practices in Active Learning for Semantic Segmentation", booktitle = "German Conference on Pattern Recognition (GCPR)", month = " ", year = "2023", note = "Best Paper Award", url = "http://lmb.informatik.uni-freiburg.de/Publications/2023/MB23a" } Other publications in the database » Sudhanshu Mittal » Thomas Brox'
