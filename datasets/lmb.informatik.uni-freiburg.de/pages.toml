title = "Nikolaus Mayer | Computer Vision Group, Freiburg"
full_description = '''$(document).ready(function(){ /* Remove all class='needs_js' elements */ $('.needs_js').css('display', 'none'); /* Dirty trick to keep code XHTML 1.0 compliant: Add canvas at runtime */ var canvas = document.createElement('canvas'); $('#myCanvas')[0].appendChild(canvas); /* Initialize widget and start render loop */ ThreeJSViewer_DisplayWidget(); }); Dr. Nikolaus Mayer Computer Vision Lab Department of Computer Science University of Freiburg Germany Georges-Köhler-Allee, Building 052 79110 Freiburg E-Mail: Brief Bio Scientific Interests Publications Projects Teaching Miscellaneous Find me on GitHub ResearchGate Google Scholar DBLP LinkedIn ORCID arXiv Brief Bio Nikolaus Mayer received his Bachelor's degree in Computer Science in 2011 and his Master's degree in Applied Computer Science in 2014 at the University of Freiburg, Germany. Each time he was honored as best of the year. For his Master's thesis work he was awarded the 2014 VDI-Förderpreis (sponsorship award of the Association of German Engineers). In 2014 he joined the Computer Vision Group in Freiburg under Prof. Thomas Brox as a full-time PhD student, and went on to graduate in 2020. Scientific Interests Neural networks for 3D vision Synthetic data generation for deep learning Input Output Sorry, this display widget needs JavaScript. (Viewer requires WebGL support) Input images from Disney Research: C. Kim, H. Zimmer, Y. Pritch, A. Sorkine-Hornung, and M. Gross. Scene Reconstruction from High Spatio-Angular Resolution Light Fields. ACM Transactions on Graphics 32(4) (Proceedings of ACM SIGGRAPH 2013) Publications 2022 Journal Evaluation of a boxwood topiary trimming robot doi> B. van Marrewijk, B. Vroegindeweij, J. Gen�-Mola, A. Mencarelli, J. Hemming, Nikolaus Mayer, M. Wenger, G. Kootstra Biosystems Engineering, 214: 11--27, Feb 2022 2020 Conference DiskMask: Focusing Object Features for Accurate Instance Segmentation of Elongated or Overlapping Objects Paper doi> Anton B�hm, Nikolaus