["https://lmb.informatik.uni-freiburg.de/Publications/2022/MB22a"]
title = "Conserved structures of neural activity in sensorimotor cortex of freely moving rats allow cross-subject decoding"
full_description = '''Conserved structures of neural activity in sensorimotor cortex of freely moving rats allow cross-subject decoding Svenja Melbaum, E. Russo, D. Eriksson, A. Schneider, D. Durstewitz, Thomas Brox, I. Diester Nature Communications, 2022 Abstract: Our knowledge about neuronal activity in the sensorimotor cortex relies primarily on stereotyped movements that are strictly controlled in experimental settings. It remains unclear how results can be carried over to less constrained behavior like that of freelymoving subjects. Toward this goal, we developed a self-paced behavioral paradigm that encouraged rats to engage in different movement types. We employed bilateral electrophysiological recordings across the entire sensorimotor cortex and simultaneous paw tracking. These techniques revealed behavioral coupling of neurons with lateralization and an anterior�posterior gradient fromthe premotor to the primary sensory cortex. The structure of population activity patterns was conserved across animals despite the severe under-sampling of the total number of neurons and variations in electrode positions across individuals.We demonstrated cross-subject and cross-session generalization in a decoding task through alignments of lowdimensional neural manifolds, providing evidence of a conserved neuronal code. Publisher's link Other associated files : Images and movies BibTex reference @Article{MB22a, author = "S.Melbaum and E. Russo and D. Eriksson and A. Schneider and D. Durstewitz and T. Brox and I. Diester", title = "Conserved structures of neural activity in sensorimotor cortex of freely moving rats allow cross-subject decoding", journal = "Nature Communications", month = " ", year = "2022", url = "http://lmb.informatik.uni-freiburg.de/Publications/2022/MB22a" } Other publications in the database » Thomas Brox'''
year_published = 2025
clearnet = "https://lmb.informatik.uni-freiburg.de/Publications/2022/MB22a"
