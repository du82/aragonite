hing in variational motion estimation, IEEE Transactions on Pattern Analysis and Machine Intelligence, 33(3):500-513, March 2011. Classical Variational Optical Flow Download Executable for 64-bit Linux Download C++ Library for 64-bit Linux Download Executable for 32-bit Windows Download Matlab Mex-functions for 64-bit Linux, 32-bit and 64-bit Windows Download Source code (special case of large displacement optical flow) The code is not exactly identical to the work described in the original ECCV 2004 paper. The Windows executable is less efficient and uses an outdated output file format. If you have access to a Linux machine or Matlab, I recommend using these versions. T. Brox, A. Bruhn, N. Papenberg, J. Weickert High accuracy optical flow estimation based on a theory for warping, T. Pajdla and J. Matas (Eds.), European Conference on Computer Vision (ECCV) Prague, Czech Republic, Springer, LNCS, Vol. 3024, 25-36, May 2004. ©Springer-Verlag Berlin Heidelberg 2004 (bibtex) Nonlocal means with cluster trees Download Executables for 64-bit Linux The program runs the non-iterative method described in the paper using no overlap for the cluster tree. T. Brox, O. Kleinschmidt, D. Cremers Efficient nonlocal means for denoising of textural patterns, IEEE Transactions on Image Processing 17(7):1083-1092, July 2008."
