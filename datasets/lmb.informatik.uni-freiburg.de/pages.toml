["https://lmb.informatik.uni-freiburg.de/Publications/2022/MB22"]
title = "You Mostly Walk Alone: Analyzing Feature Attribution in Trajectory Prediction"
full_description = 'You Mostly Walk Alone: Analyzing Feature Attribution in Trajectory Prediction Osama Makansi, J. von K�gelgen, F. Locatello, P. Gehler, D. Janzing, Thomas Brox, B. Sch�lkopf International Conference on Learning Representations (ICLR), 2022 Abstract: Predicting the future trajectory of a moving agent can be easy when the past trajectory continues smoothly but is challenging when complex interactions with other agents are involved. Recent deep learning approaches for trajectory prediction show promising performance and partially attribute this to successful reasoning about agent-agent interactions. However, it remains unclear which features such black-box models actually learn to use for making predictions. This paper proposes a procedure that quantifies the contributions of different cues to model performance based on a variant of Shapley values. Applying this procedure to state-of-the-art trajectory prediction methods on standard benchmark datasets shows that they are, in fact, unable to reason about interactions. Instead, the past trajectory of the target is the only feature used for predicting its future. For a task with richer social interaction patterns, on the other hand, the tested models do pick up such interactions to a certain extent, as quantified by our feature attribution method. We discuss the limits of the proposed method and its links to causality. Paper Images and movies BibTex reference @InProceedings{MB22, author = "O. Makansi and J. von K{\"u}gelgen and F. Locatello and P. Gehler and D. Janzing and T. Brox and B. Sch{\"o}lkopf", title = "You Mostly Walk Alone: Analyzing Feature Attribution in Trajectory Prediction", booktitle = "International Conference on Learning Representations (ICLR)", month = " ", year = "2022", url = "http://lmb.informatik.uni-freiburg.de/Publications/2022/MB22" } Other publications in the database » Osama Makansi » Thomas Brox'
year_published = 2025
clearnet = "https://lmb.informatik.uni-freiburg.de/Publications/2022/MB22"
