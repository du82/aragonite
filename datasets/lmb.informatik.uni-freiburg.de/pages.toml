["https://lmb.informatik.uni-freiburg.de/Publications/2018/RDB18"]
title = "Artistic style transfer for videos and spherical images"
full_description = '''Artistic style transfer for videos and spherical images Manuel Ruder, Alexey Dosovitskiy, Thomas Brox International Journal of Computer Vision, 126(11): 1199-1219, Nov 2018 Abstract: Manually re-drawing an image in a certain artistic style takes a professional artist a long time. Doing this for a video sequence single-handedly is beyond imagination. We present two computational approaches that transfer the style from one image (for example, a painting) to a whole video sequence. In our first approach, we adapt to videos the original image style transfer technique by Gatys et al. based on energy minimization. We introduce new ways of initialization and new loss functions to generate consistent and stable stylized video sequences even in cases with large motion and strong occlusion. Our second approach formulates video stylization as a learning problem. We propose a deep network architecture and training procedures that allow us to stylize arbitrary-length videos in a consistent and stable way, and nearly in real time. We show that the proposed methods clearly outperform simpler baselines both qualitatively and quantitatively. Finally, we propose a way to adapt these approaches also to 360 degree images and videos as they emerge with recent virtual reality hardware. Publisher's link Other associated files : Images and movies BibTex reference @Article{RDB18, author = "M. Ruder and A. Dosovitskiy and T. Brox", title = "Artistic style transfer for videos and spherical images", journal = "International Journal of Computer Vision", number = "11", volume = "126", pages = "1199-1219", month = "Nov", year = "2018", note = "online first", url = "http://lmb.informatik.uni-freiburg.de/Publications/2018/RDB18" } Other publications in the database » Alexey Dosovitskiy » Thomas Brox'''
year_published = 2025
clearnet = "https://lmb.informatik.uni-freiburg.de/Publications/2018/RDB18"
