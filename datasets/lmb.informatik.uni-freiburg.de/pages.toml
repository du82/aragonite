["https://lmb.informatik.uni-freiburg.de/Publications/2022/ZB22"]
title = "3D pose estimation enables virtual head fixation in freely moving rats"
full_description = '''3D pose estimation enables virtual head fixation in freely moving rats A. Schneider, Christian Zimmermann, M. Alyahyay, F. Steenbergen, Thomas Brox, I. Diester Neuron, 110(13): 2080-2093, Jul 2022 Abstract: The impact of spontaneous movements on neuronal activity has created the need to quantify behavior. We present a versatile framework to directly capture the 3D motion of freely definable body points in a marker-free manner with high precision and reliability. Combining the tracking with neural recordings revealed multiplexing of information in the motor cortex neurons of freely moving rats. By integrating multiple behavioral variables into a model of the neural response, we derived a virtual head-fixation for which the influence of specific body movements was removed. This strategy enabled us to analyze the behavior of interest (e.g., front paw movements). Thus, we unveiled an unexpectedly large fraction of neurons in the motor cortex with tuning to the paw movements, which was previously masked by body posture tuning. Once established, our framework can be effciently applied to large datasets while minimizing the experimental workload caused by animal training and manual labeling. Publisher's link Other associated files : Images and movies BibTex reference @Article{ZB22, author = "A. Schneider and C. Zimmermann and M. Alyahyay and F. Steenbergen and T. Brox and I. Diester", title = "3D pose estimation enables virtual head fixation in freely moving rats", journal = "Neuron", number = "13", volume = "110", pages = "2080-2093", month = "Jul", year = "2022", url = "http://lmb.informatik.uni-freiburg.de/Publications/2022/ZB22" } Other publications in the database » Christian Zimmermann » Thomas Brox'''
