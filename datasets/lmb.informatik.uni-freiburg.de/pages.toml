["https://lmb.informatik.uni-freiburg.de/Publications/2017/TDB17b"]
title = "Octree Generating Networks: Efficient Convolutional Architectures for High-resolution 3D Outputs"
full_description = 'Octree Generating Networks: Efficient Convolutional Architectures for High-resolution 3D Outputs Maxim Tatarchenko, Alexey Dosovitskiy, Thomas Brox IEEE International Conference on Computer Vision (ICCV), 2017 Abstract: We present a deep convolutional decoder architecture that can generate volumetric 3D outputs in a compute- and memory-efficient manner by using an octree representation. The network learns to predict both the structure of the octree, and the occupancy values of individual cells. This makes it a particularly valuable technique for generating 3D shapes. In contrast to standard decoders acting on regular voxel grids, the architecture does not have cubic complexity. This allows representing much higher resolution outputs with a limited memory budget. We demonstrate this in several application domains, including 3D convolutional autoencoders, generation of objects and whole scenes from high-level representations, and shape from a single image. Paper Images and movies BibTex reference @InProceedings{TDB17b, author = "M. Tatarchenko and A. Dosovitskiy and T. Brox", title = "Octree Generating Networks: Efficient Convolutional Architectures for High-resolution 3D Outputs", booktitle = "IEEE International Conference on Computer Vision (ICCV)", month = " ", year = "2017", url = "http://lmb.informatik.uni-freiburg.de/Publications/2017/TDB17b" } Other publications in the database » Maxim Tatarchenko » Alexey Dosovitskiy » Thomas Brox'
