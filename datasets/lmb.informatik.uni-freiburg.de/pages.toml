["https://lmb.informatik.uni-freiburg.de/Publications/2017/MR17"]
title = "A new fate mapping system reveals context-dependent random or clonal expansion of microglia"
full_description = '''A new fate mapping system reveals context-dependent random or clonal expansion of microglia T. Leng Tay, Dominic Mai, J. Dautzenberg, F. Fern�ndez-Klett, G. Lin, S. , M. Datta, A. Drougard, T. Stempfl, A. Ardura-Fabregat, O. Staszewski, A. Margineanu, A. Sporbert, L. M Steinmetz, J. Andrew Pospisilik, S. Jung, J. Priller, D. Gr�n, Olaf Ronneberger, M. Prinz Nature Neuroscience, 2017 Abstract: Microglia constitute a highly specialized network of tissue-resident immune cells that is important for the control of tissue homeostasis and the resolution of diseases of the CNS. Little is known about how their spatial distribution is established and maintained in vivo. Here we establish a new multicolor fluorescence fate mapping system to monitor microglial dynamics during steady state and disease. Our findings suggest that microglia establish a dense network with regional differences, and the high regional turnover rates found challenge the universal concept of microglial longevity. Microglial self-renewal under steady state conditions constitutes a stochastic process. During pathology this randomness shifts to selected clonal microglial expansion. In the resolution phase, excess disease-associated microglia are removed by a dual mechanism of cell egress and apoptosis to re-establish the stable microglial network. This study unravels the dynamic yet discrete self-organization of mature microglia in the healthy and diseased CNS. Publisher's link Images and movies BibTex reference @Article{MR17, author = "T. Leng Tay and D. Mai and J. Dautzenberg and F. Fern{\'a}ndez-Klett and G. Lin and S. and M. Datta and A. Drougard and T. Stempfl and A. Ardura-Fabregat and O. Staszewski and A. Margineanu and A. Sporbert and L. M Steinmetz and J. Andrew Pospisilik and S. Jung and J. Priller and D. Gr{\"u}n and O. Ronneberger and M. Prinz", title = "A new fate mapping system reveals context-dependent random or clonal expansion of microglia", journal = "Nature Neuroscience", month = " ", year = "2017", url = "http://lmb.informatik.uni-freiburg.de/Publications/2017/MR17" } Other publications in the database » Dominic Mai » Olaf Ronneberger'''
