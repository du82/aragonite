["https://loadable-components.com/docs/api-loadable-server"]
title = "@loadable/server - Loadable Components"
description = "The recommended Code Splitting library for React."
full_description = '''@loadable/serverChunkExtractorUsed to collect chunks server-side and get them as script tags or script elements.ArgumentsDescriptionoptionsAn object options.options.statsFileStats file path generated using @loadable/webpack-plugin.options.statsStats generated using @loadable/webpack-plugin.options.entrypointsWebpack entrypoints to load (default to ["main"]).options.outputPathOptional output path (for functions using the file system, like requireEntrypoint).options.namespaceNamespace of your application (use only if you have several React apps on the same page).options.inputFileSystemFile system used to read files (default to fs).options.publicPathThe public path used at runtime.You must specify either statsFile or stats to be able to use ChunkExtractor.Using statsFile will automatically reload stats for you if they change.import { ChunkExtractor } from '@loadable/server'const statsFile = path.resolve('../dist/loadable-stats.json')const chunkExtractor = new ChunkExtractor({ statsFile })chunkExtractor.collectChunksWrap your application in a ChunkExtractorManager.ArgumentsDescriptionelementJSX element that will be wrapped in ChunkExtractorManager.const app = chunkExtractor.collectChunks(<YourApp />)chunkExtractor.requireEntrypointRequire the entrypoint of your application as a commonjs module.ArgumentsDescriptionnameOptional name the entrypoint, default to the first one (main).const { default: App } = chunkExtractor.requireEntrypoint()const app = <App />chunkExtractor.getScriptTagsGet scripts as a string of <script> tags.ArgumentsDescriptionattributes or attrFnOptional attributes added to script tags, or a function that receives a chunk and returns the attributes.const body = `<body><div id="root">${html}</div>${chunkExtractor.getScriptTags()}</body>`chunkExtractor.getScriptElementsGet scripts as an array of React <script> elements.ArgumentsDescriptionattributes or attrFnOptional attributes added to script elements, or a function that receives a chunk and returns the attributes.const body = renderToString( <body> <div id="root" dangerouslySetInnerHtml={{ __html: html }} /> {chunkExtractor.getScriptElements()} </body>,)chunkExtractor.getLinkTagsGet "prefetch" and "preload" links as a string of <link> tags.ArgumentsDescriptionattributes or attrFnOptional attributes added to link tags, or a function that receives a chunk and returns the attributes.const head = `<head>${chunkExtractor.getLinkTags()}</head>`chunkExtractor.getLinkElementsGet "prefetch" and "preload" links as an array of React <link> elements.ArgumentsDescriptionattributes or attrFnOptional attributes added to link elements, or a function that receives a chunk and returns the attributes.const head = renderToString(<head>{chunkExtractor.getLinkElements()}</head>)chunkExtractor.getStyleTagsGet style links as a string of <link> tags.ArgumentsDescriptionattributes or attrFnOptional attributes added to style tags, or a function that receives a chunk and returns the attributes.const head = `<head>${chunkExtractor.getStyleTags()}</head>`chunkExtractor.getStyleElementsGet style links as an array of React <link> elements.const head = renderToString(<head>{chunkExtractor.getStyleElements()}</head>)chunkExtractor.getInlineStyleTagsGet inline style links as a string of <link> tags (returns a promise).ArgumentsDescriptionattributes or attrFnOptional attributes added to style tags, or a function that receives a chunk and returns the attributes.chunkExtractor.getInlineStyleTags().then((styleTags) => { const head = `<head>${styleTags}</head>`}chunkExtractor.getInlineStyleElementsGet inline style links as an array of React <link> elements (returns a promise).ArgumentsDescriptionattributes or attrFnOptional attributes added to style elements, or a function that receives a chunk and returns the attributes.chunkExtractor.getInlineStyleElements().then((styleElements) => { const head = renderToString(<head>{styleElements}</head>)}chunkExtractor.getCssStringGet css as a raw string for using directly within app (e.g. in custom AMP style tag)chunkExtractor.getCssString().then((cssString) => { const head = renderToString( <head> <style dangerouslySetInnerHTML={{ __html: cssString }} /> </head> )}ChunkExtractorManagerUsed to inject a ChunkExtractor in the context of your application.import { ChunkExtractor, ChunkExtractorManager } from '@loadable/server'const extractor = new ChunkExtractor()const app = ( <ChunkExtractorManager extractor={extractor}> <YourApp /> </ChunkExtractorManager>)'''
