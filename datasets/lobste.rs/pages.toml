["https://lobste.rs/s/udj6qf/hosting_update"]
title = "Hosting Update | Lobsters"
description = "53 comments"
full_description = "I’ve migrated the site to a new server setup. We’re now on a 4 vCPU / 8GB RAM / 160GB disk VPS at Digital Ocean with their managed MySQL database. (Which our replying_comments view overwhelms, so that’s off until we figure out how to tune it or redesign the feature.) Our sysadmin @alynpost is resigning as moderator and sysadmin to focus on other projects. Prgmr will no longer be donating hosting. For security’s sake, I’ve reset all tokens and you’ll have to log in again - sorry for the hassle. Is there any way to support Lobsters’ hosting? Now that the server is not donated, I wouldn’t mind chipping in a little bit every month to subsidize operating costs. Ever hear the internet rule of thumb: “Anyone who asks to be a moderator should never be made one.” ? Our sysadmin @alynpost is resigning as moderator and sysadmin to focus on other projects. Prgmr will no longer be donating hosting. For security’s sake, I’ve reset all tokens and you’ll have to log in again - sorry for the hassle. Isn’t that very overpriced? 40€/month at hetzner gets you a dedicated machine with a Ryzen 5 3600, 64GB of RAM and 512GB of SSD on RAID1 (no affiliation or anything, it’s just the provider I know). Hetzner also just uses electricity from sustainable sources, while with digital ocean it depends on the location Hetzner is the goat! I use them for my VPS and it’s the best deal I’ve seen yet for cloud services. The fact that they’re environmentally friendly as well makes it that much better! You can rent a managed server with Hetzner and they have a panel to install and mange MySQL on it, but I don’t think it’s comparable to DigitalOcean’s managed offerings. Would be really interesting to hear what they’re doing with “managed”. Because based on the prices I’d say prgrmr.com is also not cheap compared to the hardware you get. I appreciate the offers but prefer not to, no. Still looking for someone to print-on-demand stickers, though. I support a lot of people on Patreon and expect nothing in return. Chipping in $5/month to Lobste.rs because I like the community and the stuff that gets shared here isn’t a tall order, and won’t come with any entitlement. (A lot of the people I support are artists and content creators that are usually in high demand from the rest of the community.)"
