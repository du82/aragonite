["https://lobste.rs/s/y9llde/how_i_clean_up_clean_install_windows_11"]
title = "How I clean up a “clean install” of Windows 11 and Edge | Lobsters"
description = "12 comments"
full_description = "I saw the headlines about W11 go by, but I recently helped a family member with a new Windows 11 laptop and I was still stunned by the tying and the ads on the desktop, lock screen, and menus. There’s two free utilities that I see as pretty much mandatory now. O&O ShutUp collects toggles for privacy, cross-selling, and misfeatures, which is much easier than this article’s list of where to find each toggle. O&O AppBuster allows uninstalling bundled apps, which allows removing many of the ads and reducing some of the enormous OS install size. (I know I started with PCs when hard drives were an optional feature but the fresh install was 27G.) I believe it really is time to give up on Windows now. I’ve been a Windows user since Windows 3.1 - I literally grew up with it - and it has become obvious to me that this ecosystem no longer offers me what I want and need. But, worst of all, there is no end in sight for all this nonsense. It’s not like we have to go through a period of hardship and it’ll pay off in the end. In fact, the pace at which they harm Windows with terrible decision-making seems to be accelerating. Linux desktop software like KDE offers production-grade quality that has far fewer bugs and far more features than what Microsoft is currently inflicting on their users. Yes, the battle lines have moved. Windows is a lost cause and all efforts should be to not depend on it as an ecosystem. Valve smelt the enshittification very early and wisely worked on their Proton runtime to be able to detach itself from Windows. Regarding enshittification, let us all watch out for those trying to enshittify the Linux ecosystem. Isn’t it beautiful and poetic, by the way, that Lennart Poettering - Red-Hat-sponsored inventor of systemd and pulseaudio - joined Microsoft last year? Microsoft is all-in to enshittify and EEE (embrace - extend - extinguish) Linux by giving it a deadly embrace, let’s hope they’re not successful. Systemd has its good parts, but it’s not built with a collaborative/modular system in mind, and more like for a deeply-integrated vendor-based system - no wonder Red Hat pushed it so hard. OpenRC needs to be replaced, but there were many many other solutions that looked much more promising and kept to their core task of being an init system, e.g. runit. Pulseaudio is fortunately replaced with Pipewire, but the damage is already done insofar that Pipewire has to emulate the horrible Pulseaudio APIs for compatibility."
year_published = 2025
