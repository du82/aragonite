["https://lobste.rs/s/upgnyr/gemini_protocol"]
title = "Gemini (protocol) | Lobsters"
description = "13 comments"
full_description = "Also, from 2023: https://daniel.haxx.se/blog/2023/05/28/the-gemini-protocol-seen-by-this-http-client-person/ I’ve basically given up on Gemini - granted, I was a vociferous critic, then tried it out in the interest of fairness, and then lost interest for good. If you’re interested, I can recommend the Lagrange browser (a very impressive project) and gemini://warmedal.se/~antenna/ as an aggregator of sorts. It’s a decent starting point for further exploration. I admire many of the philosophical and aesthetic choices in Gemini, but I remain frustrated at the choice of requiring TLS. Writing a rudimentary Gemini client is only “simple” if you can rely upon an existing TLS implementation, an enormous external dependency which attaches a similar sort of “complexity ratchet” to the protocol as encrypted HTTP. Nevertheless, many Gemini enthusiasts choose to make their capsules also accessible to gopherspace; the existence of Gemini seems to have greatly increased enthusiasm for the protocol it was most interested in updating! There was (and to a degree, still is) attempts to bring TLS to gopher but it’s not as easy as running it over TLS. To address this, Solderpunk thought of a new protocol, similar in nature to gopher, but starting with TLS. There is a version of Gemini sans TLS known as Spartan [1] if you want it [2]. During my time with Gemini, I found two groups of people who wanted to remove TLS. Group 1 wanted it at least optional, because TLS was too complex to handle and no one could implement TLS by themselves [3]. The second group because TLS was too complex and should be replaced by some bespoke encryption system they just read about (or developed). [4] I always found it amusing that the two groups wanted to remove TLS for different reasons. It sounds like you are in the first group. [3] Without realizing that most people don’t bother with implementing TCP by hand. And yes, there were a few people who felt that TCP should have been optional. [4] One person actually did implement their own encryption system for Gemini, only to realize after the fact that it was a mistake to do so."
