["https://lobste.rs/s/lin6a8/novel_attack_against_virtually_all_vpn"]
title = "Novel attack against virtually all VPN apps neuters their entire purpose | Lobsters"
description = "27 comments"
full_description = "Summary: a machine in your LAN can send you bad DHCP packets that add entries to your routing table, so now your traffic isn’t routed via the VPN. Don’t use untrusted LANs/remove untrustworthy devices from your LANs (e.g. use a hotspot while travelling) Summary: a machine in your LAN can send you bad DHCP packets that add entries to your routing table, so now your traffic isn’t routed via the VPN. It’s another way for vulnerable or malicious IoT devices on your LAN to attack you, which I think is notable. I know it’s not really perceived this way any more, but once upon a time end-user (non-corporate) VPN software and services were aimed at exactly that use case: you’re on a public network or hotspot and don’t trust it (e.g. you’re on public wifi at an airport in a “less friendly” country), so you use a VPN to surf from a safer standpoint. But oops — turns out, maybe you weren’t. Most public wireless networks have station isolation features that make them more of a 1:1 internet gateway than a LAN. Yep, indeed. I’m wondering if it makes any difference if it’s the station operator doing it, though; i.e. “less friendly” country wants to compromise your privacy, so the airport public wifi sends you option 121 to defeat your VPN use. There’s definitely still threat vectors for some to worry about. And while most wireless networks are configured this way it is nearly impossible to verify it in any given situation. So caution is warranted. Overall though, I feel like the linked article and the general consumer VPN market is based on a 2010 idea of public networks where low level criminals could eavesdrop on unencrypted HTTP traffic and swipe your gmail credentials. I’m not sure I agree. Routers are notoriously targets for malicious actors, I did a quick search on Ars and this article is from 6 days ago https://arstechnica.com/security/2024/05/hacker-free-for-all-fights-for-control-of-home-and-office-routers-everywhere/ Not if you actually pay attention to identify verification failures (and CAs are doing their job of not issuing bogus certificates.)"
year_published = 2025
