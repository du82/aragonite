["https://lobste.rs/s/jg3eet"]
title = "Lobsters by mail | Lobsters"
full_description = "In your settings is a new option that will turn on mailing list messages. All new stories and comments posted to lobste.rs will get e-mailed to you as though they were posted to a mailing list that you are subscribed to, including the text content of story URLs (as retrieved through Diffbot). Your tag filters still apply, and you will not receive e-mails for stories or their comments that would not be shown here on the website. Comments are delivered with proper References headers so if your e-mail client can thread messages, they will display properly: If you reply to your mailing list address (which all e-mails appear to be sent to, and have their Reply-To header set to), your e-mail message will get converted into a comment that will get posted to this site as a reply to the corresponding comment or story (assuming your e-mail client isn’t completely braindead and sends a proper In-Reply-To header). Most mailing lists just authenticate list postings by the From address, but all list subscribers can view the headers of those messages to see whether they are authentic. Since that wouldn’t be possible for comments posted here, I chose to authenticate users by giving each one a unique mailing list address. Any message posted to that unique list address will get posted here through your account, regardless of your From address. Just to make it clear, this doesn’t behave like a normal mailing list, where your e-mails are directly broadcast to every other subscribed user. When you reply, your message is processed, the text extracted, your mailing list token is looked up, and a comment is posted with your account and comment text. A separate process sees the new comment posted (just like any other comment posted to the website) and sends out a new e-mail to everyone by generating a new message with their unique mailing list address headers. Your actual e-mail address, name, and hopefully e-mail signature (assuming you use the standard dash-dash-space-newline separator) will never be seen by anyone else. If there is some error in your reply message, like it has no text/plain part, your list address is invalid, or your mail client didn’t send a proper In-Reply-To header, you’ll get a bounce back."
