["https://lobste.rs/s/ieig85/passkey_technology_is_elegant_it_s_most"]
title = "Passkey technology is elegant, but it’s most definitely not usable security | Lobsters"
description = "39 comments"
full_description = "I have no idea what is being stored where or how I should back it up so I’m refusing to use Passkeys. I’ve seen plenty of compelling arguments on why to use them, but it’s the ‘how’ that puts me off every time. A cynic might say that this is done on purpose. Many reductions in user autonomy are disguised as security innovations. For similar reasons I’m only using passkeys where they are a progressive enhancement (2FA or alternate login method). I almost got locked out of my pixel phone after wiping it because Google suddenly required me to 2 factor…using my phone. As a consumer I am extremely skeptical of the “something you have” method of security given how easy it is to lose things. Using a password manager to log into Gmail with a passkey ensures he’s protected by MFA. Using the password alone does not. I don’t understand this. If I store my passkey (a site-specific private/public key pair) in Bitwarden, isn’t it just sitting there unencrypted in memory the same as all my other passwords? Sure maybe the app doesn’t let me copy & paste the private key through the UI like with passwords but it isn’t hooking into a local secure hardware element, is it? Talking myself through it, perhaps Bitwarden will only sign challenges themselves signed by the public key of the relevant site. So I am protected from MITM phishing attacks where I copy and paste my password into the wrong site. Sure the key can be stolen from memory but I suppose that is still an upgrade compared to using a password. If the key were stored in a secure hardware element instead then we would expect it to rapidly fill up the limited key slots as each site gets a different key. Although perhaps yubico or similar is now offering hardware tokens that can store a large number of these keys. But then can they be securely backed up to a separate hardware token, or are they bound to that one? Quite a few passkey implementations do use a local secure hardware element; not sure what Bitwarden does, but presumably not."
year_published = 2025
