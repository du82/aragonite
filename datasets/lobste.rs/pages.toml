["https://lobste.rs/s/zck7bo/resigning_as_asahi_linux_project_lead"]
title = "Resigning as Asahi Linux project lead | Lobsters"
description = "191 comments"
full_description = "Leadership (likely Linus) needs to step in here and either say “rust is ok” or “rust is not ok.” Otherwise these same rehashed arguments in the LKML will be going over and over again, and nothing gets done except people burning out. But it is neither, I don’t know where people think to think that the adoption of Rust in the Linux kernel is already a decision that has been made years ago. From: https://docs.kernel.org/rust/index.html#the-rust-experiment The Rust support was merged in v6.1 into mainline in order to help in determining whether Rust as a language was suitable for the kernel, i.e. worth the tradeoffs. That said, people like GregKH are already convinced that Rust for Linux has been success (I do as well, but I’m just watching from the peanut gallery). But that doesn’t mean that “rust is ok” w/o further discussion. Different developers/maintainers still have to be convinced. Watching from the outside it seems that some maintainers don’t want to be convinced in the first place. Some seem ready to actually make an effort to see what the experiment will lead to, but that’s far from the majority. Watching from the outside it seems that some maintainers don’t want to be convinced in the first place. From personal experience with some of the involved in this thread from the maintainers side, I disagree. It’s unsurprising that, after years and years of holding the kernel as a pure C project for good reasons (not even allowing the sister language C++ in), there’s people that hold this as a value. Those aren’t convinced easily, not on a short timeline and not via email. I know people wish for a strong word from Linus, but this is only partially in his hands - particularly as the person who previously held the “pure C” line. I’m not a fan the tone, but I was for example completely unsurprised by Chris Hellman holding that line and not arbitrarily. R4L is not just a substantial engineering effort, it is also a substantial social effort. And that means a ton of legwork, and maybe some beers at a bar."
year_published = 2025
