["https://lobste.rs/s/t1enph/siren_call_sqlite_on_server"]
title = "Siren Call of SQLite on the Server | Lobsters"
description = "60 comments"
full_description = "This post caught my eye because we’re considering sqlite for lobsters, but this is not really a compelling set of points. I’m not well-informed enough to agree or disagree with this post, just frustrated that it doesn’t make the best case it could. Re: migrations: SQLite doesn’t support some commonplace ALTER TABLE behavior. Instead, you have to: Additionally, this is an error-prone process. Do this enough times and eventually you might get the steps wrong. Even if you don’t, I had an ORM delete data on a small project when it executed statements in an unintuitive, undocumented, and nondeterministic order, running the DROP before running the statement disabling foreign keys. The ORM’s built-in schema commands weren’t susceptible to this issue, but SQLite required me to use a lower-level approach. I’m very happy with the solution I built for this problem, which I’ve been using for several years: https://sqlite-utils.datasette.io/en/stable/cli.html#transforming-tables To me this does not sound much less nutso than mysql online schema change machinery or vitess or whatever. Postgres is more better about this, sure. But sqlite is not bad, all the DDL is fully supported in transactions and it has a handy slot for storing your schema version number. If you’re using an ORM that is shredding your data, like, don’t use that software, but it’s not SQLite’s fault. Yeah I agree this post does not make a compelling case. I have my own reasons I don’t love SQLite (really limited builtin methods and a too-flexible grammar) and I work for a Postgres company but from reading this article alone I can’t see a coherent reason not to use SQLite on the server. Did you miss the part about need to share a disk if you want more than one application server? Granted, not all applications need more than one copy running… I guess the other option is that each application server has their own sqlite and you use RAFT or something to drive consensus between them… which maybe works if you can have at least 3 of these servers, at the expense of extreme complexity. :)"
year_published = 2025
