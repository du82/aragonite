["https://lobste.rs/s/cqq0kg/story_merging"]
title = "Story merging | Lobsters"
description = "13 comments"
full_description = "Stories that are similar without enough new content (like general news sites all reporting on the same story) can now be merged into a single story rather than being downvoted or deleted, while preserving comments made on them and still working with the duplicate detector and other things. For example, a news article about the Heartbleed Bug has been merged into the original story for the bug. Visiting the first link automatically redirects to the original story and the one comment that was made is visible there. The original Heartbleed story gives a good example: the merged comment by apy is only applicable to the old story. And while it might be a 4 point comment for that story, it ends up displayed over a threaded group of comments that are very interesting & useful - links to the fix, updates on individual vendors, etc. And, again, while apy’s comment may be +4 in the pre-merged story, it becomes off-topic in the new one. That’s bad for the comments on the merged story, and it could end up bad for apy’s karma. All in all having merging is far better than not, so I definitely don’t intend this criticism to be taken harshly. And unfortunately I don’t know what the fix might be. Just some thoughts for consideration. Could this be avoided by turning the merged story into a comment on the original story, with all its existing comments as sub-comments? It’s off-topic because it’s sort of meta, but I think in most instances, the comments will still be on-topic for the merged-to story. Yeah, I think that’s probably fair. I’ve been trying to think about what kind of change could be applied (reorder comment display, no penalty for down votes after a story was merged, …) but I can’t think of any improvements that don’t add problems or make things worse. You could put an indicator near the carried over comments. Either a text label of “merged” or a little icon. This may help put the comment in context. This feature is great! Something I’ve wanted for a long time on lobsters. Is it appropriate to merge a link with an older version of the same link?"
