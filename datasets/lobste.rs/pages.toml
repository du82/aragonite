["https://lobste.rs/s/z2dczs"]
title = "Suggesting story tag and title changes | Lobsters"
description = "30 comments"
full_description = "A new feature has been committed enabling users to make formal suggestions for changing story tags and titles. Hopefully this will eliminate the need for moderators to have to do this all the time, as well as eliminate the annoying comment threads that only exist to argue about a story’s tags or title. By clicking the ‘suggest’ link under a story title, you’ll be brought to a page where you can edit the story title and select tags to add or remove. For the moment, saving these just writes records in the database. At some point in the near future, when enough users agree on a new set of tags, the tags on the story will automatically change. I would like to hear suggestions on what conditions to use for this event, either something as simple as “X number of users agreed” or something more complicated to prevent malice. A moderation event will be logged when this happens, but I’m not sure if all of the users that suggested those tags should be included in the log as well. For titles, I’m not yet sure how to present those suggestions since they will probably all be different, unless the story was submitted with a made-up title and everyone wants it changed back to the original one at the story’s URL. Or perhaps most of these will be identical when a few users lop off the “ | Site Title” from users not following the submission guidelines. Update: tag changes are now being done automatically, in response to at least 4 users agreeing on a new set of tags. Sweet. I didn’t really pay much attention to tags before, but now that I can change them, I see that they’re all wrong!. I would also like to propose that, as of today, comments on stories that are solely about their tags or titles should be considered off-topic and downvoted accordingly. Users have the formal means to propose tag changes, submitting users can see those proposals (anonymously) before a quorum changes them automatically, so there should not be a need for this noise anymore. It doesn’t appear to currently show the suggested tags…so getting a quorom is pure luck if everybody decides to nominate the same tag."
year_published = 2025
clearnet = "https://lobste.rs/s/z2dczs"
category = "SitesList"
tags = ["announce", "update:"]
