["https://lobste.rs/s/b7evyi/fine_art_human_prompt_engineering_how"]
title = "The fine art of human prompt engineering: How to talk to a person like ChatGPT | Lobsters"
full_description = "So anthropomorphic thinking is no good in the sense that it does not help. But is it also bad? Yes, it is, because even if we can point to some analogy between Man and Thing, the analogy is always negligible in comparison to the differences, and as soon as we allow ourselves to be seduced by the analogy to describe the Thing in anthropomorphic terminology, we immediately lose our control over which human connotations we drag into the picture. And as most of those are totally inadequate, the anthropomorphism becomes more misleading than helpful. I started as a theoretical physicist, became involved in computing and may end up as a mathematician. It is specifically my connection with computing that has made me allergic, since computing science is cursed by a rampant anthropomorphism. This has been so right from its inception, and found its way in the public perception of the topic, as is illustrated by the title of the book that Edmund C. Berkeley published in the fifties: “Giant Brains or Machines that Think”. The simplest way of showing how preposterous that title is is by pointing at its two companion volumes —still to be written— “Giant Hearts or Machines that Fall in Love” and “Giant Souls or Machines that Believe in God”, the most fascinating feature of the latter, of course, being that they can believe in God much faster than you. Regrettably we cannot sweep this nonsense under the rug by saying “Why bother? This is only popular press”. It finds its echo in publications that are intended to be serious, such as Grace M. Hopper’s article with the title “The education of a computer.”. It also finds its reflection in the multi-billion yen mistake of the Japanese “fifth generation computer project”, of which you may have heard. It would have taken care of the Japanese competition; regrettably —for the Western world— they seem to come to their senses, as the larger Japanese companies are pulling out of the efforts aimed at blurring the distinction between Man and Machine."
