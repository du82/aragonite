["https://lobste.rs/s/vhlagb/why_gemini_is_not_my_favorite_internet"]
title = "Why Gemini is not my favorite internet protocol | Lobsters"
description = "38 comments"
full_description = "I agree with what @gerikson wrote. My personal take, big-picture, is that Gemini just represents a creative bankruptcy in our industry; we only look backwards, not forwards. We’ve failed to think how things could be better, and our supposed brightest thinkers resort to eating ourselves at our supposed peak. (Perhaps that’s something of society in general, but that’s out of scope for here.) Actually, this kind of thinking isn’t even super uncommon: “change X sucks, therefore we need to not change anything at all”, or “situation X sucks, therefore we need to go back to situation Y of the past”. A lot of the times the observation that X sucks is perfectly reasonable and valid (not always though) and doing something is (often) perfectly reasonable, but a lot of times maintaining the status quo or going back to a previous situation isn’t really the answer. There’s probably a reason things are the way they are ya know. In my own country we have entire political parties whose entire program consists of this and nothing but this kind of reasoning (on both the left and right). But hey, if people want to muck about with Gemini or Gopher then that’s cool, and I’ll be the last to crap on that. I’ve done a lot of stuff that’s useful just for me personally or a small group of people and pointless for anyone else. And to be fair, the Gemini website at least is pretty clear that Gemini “will not replace either [the web or Gopher]”. The problems begin when you start thinking this is somehow a feasible alternative or that it will solve anything, as I’ve seen some claim, and it clearly won’t. I’ve resorted to using ‘simplicity as narcissism’ as a form of reductio to “only the shit I currently care about” Simplicity is Systemic, often a retrocomputing pipedream. Of course there is a lot of common grounds that can be reorganized in the web and so on to make solutions that are comprehensible and mutated / instrumented by much smaller groups than the mass that is needed now, but that’s not what is going on - suckless, gemini etc. are all in this other bin – “If feature x is not a member of the set of features that I need here and now, it is bloat and should not be included or considered” as knee-jerk reaction converging on “oh if things just looked like windows 98 again” (except for the 95% of it that was terrible to the ones that used to live it)."
