["https://lobste.rs/s/k7x5w6/secure_boot_is_completely_broken_on_200"]
title = "Secure Boot is completely broken on 200+ models from 5 big device makers | Lobsters"
description = "12 comments"
full_description = "Despite this article framing this as a huge new discovery, this is a fairly well known issue. LVFS has been blocking uploads of firmware with those strings for the past 4 years. https://gitlab.com/fwupd/lvfs-website/-/blob/master/plugins/blocklist/rules/ibv-example-certificate.yar?ref_type=heads In a public GitHub repository committed in December of that year, someone working for multiple US-based device manufacturers published what’s known as a platform key, the cryptographic key that forms the root-of-trust anchor between the hardware device and the firmware that runs on it. That happens because in large parts these OEMs don’t have a security team per se. Firmware didn’t use to be a relevant security boundary. When specs evolved that required firmwares to implement security features, most OEMs just had whoever they had on staff take care of it, and if it passes the compliance tests it ships to devices. It doesn’t help that there’s barely any consequence for OEMs shipping blatant security holes. What’s the incentive to hire security engineers when people will buy the motherboards regardless? most OEMs just had whoever they had on staff take care of it, and if it passes the compliance tests it ships to devices. It would be good to design one of these TPMs in a way that makes it very difficult to get the security wrong, if that’s possible I think the EU just started enforcing penalties for manufacturers that don’t properly secure what they sell with the Cyber Resilience Act (I haven’t actually read it) I don’t think it is generally possible for a TPM to detect a revoked key. Because our than the revocation information (which it can’t get itself) it is identical to a valid one. Maybe it would be good to have some computer-readable marker for test keys. But I wouldn’t be surprised if this “test mode” flag ends up still enabled in prod builds. The article has a ton of links, except to OP’s: https://www.binarly.io/blog/pkfail-untrusted-platform-keys-undermine-secure-boot-on-uefi-ecosystem"
year_published = 2025
