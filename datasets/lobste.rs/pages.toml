["https://lobste.rs/s/tx5ro4/ai_is_stifling_tech_adoption"]
title = "AI is Stifling Tech Adoption | Lobsters"
full_description = "I think in general, technologists need to be more aware of positive feedback loops. Without active dampening any system with positive loop gain is unstable, after all. Search engines become harder to search because of SEO. Social media becomes antisocial because of “the algorithm.” Really any kind of system that reinforces itself without outside compensation winds up optimizing for maxima or minima that are probably undesirable. LLMs constantly being trained on React/Tailwind promps and probably on their own outputs now is like an op amp railing out because of a slightly positive feedback gain. I’d suggest there’s some line where below the line this article applies; people there have less time, skills, deep tech knowledge and will make heavily assisted decisions. The other side of this line are people who may understand much more deeply the tools available in some area and are less likely to need make assisted decisions - getting some AI generated ‘average’ of global opinion isn’t useful to them at all - they’re more likely to use less well known tools, languages, etc., and indeed more likely to be building their own. It seems like this article is only talking about one side of my suggested ‘line’. Is there any effect on the other side of the line? Does the effect in the article drive these two groups apart further than they already would be? Like does the existence of the line make it harder to get above it? Yeah, this seems unquestionable. It’s sort of just a factual side effect of models being behind on training data, biasing towards trends, etc. But that was already the case, perhaps it’s amplified but I’m not sure. Also, ChatGPT has a “search” now that may assist a lot."
year_published = 2025
