["https://lobste.rs/about"]
title = "About | Lobsters"
full_description = '''Lobsters is a computing-focused community centered around link aggregation and discussion, launched on July 3rd, 2012. The administrator is Peter Bhat Harkins ("pushcx"), contact him or another moderator with any support issues. Lobsters was created by joshua stein with careful design touches to encourage a healthy community: Climate: Lobsters is more of a garden party than a debate club. We're learning things we didn't know to be curious about and sharing what we've made. Disagreements are normal but fights are not; it's OK to make your point, share a resource, and let someone be wrong. Abuse and bigotry are unwelcome. Topicality: Lobsters is focused pretty narrowly on computing; tags like art don't imply every piece of art is on-topic. Some rules of thumb for great stories to submit: Will this improve the reader's next program? Will it deepen their understanding of their last program? Will it be more interesting in five or ten years? Some things that are off-topic here but popular on larger, similar sites: entrepreneurship, management, news about companies that employ a lot of programmers, investing, world events, anthropology, self-help, personal productivity systems, last-resort customer service requests via public shaming, "I wanted to see what this site's amazing users think about this off-topic thing", and defining the single morally correct economic and political system for the entire world when we can't even settle tabs vs. spaces. Brigading: Lobsters is not to be used to whip up an outrage mob and direct them at targets, especially individuals and small projects. It always feels righteous at first and becomes an awful tool for abuse. For contentious topics, try to submit a link to an overviews rather than linking into a project's community spaces like issue trackers and mailing lists. There isn't a clear-cut line between this and discussing trends and advocating for improvements in the field, so expect frustrating judgement calls. Self-promotion: It's great to have authors participate in the community, but not to exploit it as a write-only tool for product announcements or driving traffic to their work. As a rule of thumb, self-promo should be less than a quarter of one's stories and comments.'''
