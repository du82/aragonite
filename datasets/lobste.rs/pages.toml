["https://lobste.rs/s/07jh0c/uk_demands_apple_break_encryption_allow"]
title = "UK demands Apple break encryption to allow gov’t spying worldwide, reports say | Lobsters"
description = "32 comments"
full_description = "It’s time for Apple to put its money where its mouth is once again, this time risking an entire UK market if it goes as far as pulling out of the UK entirely. But I hope they do the right thing and absolutely refuse the order, with no compromises. In china you can’t enable ADP and so your iCloud keys are always in escrow on Apple’s servers. That’s the access China will have. The UK wants access to the keys Apple don’t have, too. It is, of course, complicated. This is a simplified view. I am leaving some very important assumptions unanswered (such as: how does iMessage do key exchange). Disclaimer: I am an idiot, probably compromised by the government, and you should independently verify the claims below, most of which are probably completely wrong. There is a lot of trust, and a lot of external review around this. In some markets, such as China, you cannot disable Key Escrow, but iMessage is (supposedly) E2EE - a rare exception. So like… make your own conclusions about this, but I’m relatively confident that Apple currently cannot access your data with ADP on. Of course, I can be wrong and even more of course, things may change. They could, for example, silently disable ADP with an iOS update - such a move would hopefully be catastrophic to their public image. Fun fact: this is (possibly) why Apple requires a PIN to update iOS on demand. TLDR As it stands and as it’s publicly communicated (and verified by researchers): Apple can’t access your data on your phone but they can access anything stored in iCloud unless you use ADP in which case they can’t, unless you use iCloud on web. Your mileage may vary. Promotion not valid in China. [2] Apple claims that Apple does not maintain key escrow. I’m not saying to the contrary, I’m just highlighting one of many very important assumptions people might make Surely, there should be other so-called researchers to call the so-called researchers on their bluff for only so-called checking on so-called Apple’s so-called claims."
year_published = 2025
