["https://lobste.rs/s/zzprkr/weekly_lobsters_office_hours"]
title = "Weekly Lobsters office hours + development | Lobsters"
description = "18 comments"
full_description = "When this post is two hours old, and indefinitely twice a week, I’m going to stream Lobsters office hours and development on Twitch. The channel is here and more info + an archive is on my blog. (You don’t have to sign up to Twitch to watch.) The office hours are largely to support iteratively running queries. People don’t take me up on this very often except via IRC because it’s hard to write these things perfectly out of the gate. Having a fast feedback loop is essential. Also, maybe having an open office hours session will be a nicely informal opportunity to answer questions and generally demystify the site. If nobody has questions I’ll hack on the Lobsters codebase. Hopefully this encourages more activity on the repo. I’m also open to support people using the code to start a sister site, which is another activity that benefits from a tight feedback loop. (example) I plan to stream weekly on (US Central) Monday afternoons at 2 PM and Thursday mornings at 9 AM in the hopes that this gives reasonable timezone coverage. Sorry for the inconvenience if you are antipodal to Chicago, though the site has always run on Chicago time. Sessions will probably run 1.5 to 3 hours and I’ll put summaries and transcripts in my archive for easy searching. I’ll try to keep the twitch schedule up-to-date and I already know I’ll miss 9/1 for a vacation. This is pretty experimental! I did it a few streams back in summer of 2020 that went well, but everything was pretty chaotic that year for some reason and I dropped it. I did a technical rehearsal this weekend that went reasonably smoothly. If this continues to be interesting and useful, I’ll keep it up and try new things. Feedback here, in the stream chat, or by email (peter@ my domain) is much appreciated. Special guest host will be my cat (subject to his schedule and whim). See y’all in our weird parasocial future. Well, I failed at keeping it to 2-3 hours, I ran closer to 5. But it was fun taking questions and coding live, so I’ll definitely see folks on Thursday morning."
