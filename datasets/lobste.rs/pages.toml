["https://lobste.rs/s/kijqmv/tech_worker_movements_grow_as_threats_rto"]
title = "Tech worker movements grow as threats of RTO, AI loom | Lobsters"
description = "17 comments"
full_description = "The tech worker stuff I saw back in 2016-2017 was not compelling. When Macej came through town, he seemed more interested in riling us up to give donations to defeat Trump than to, you know, work on common issues like contracts. During a stint in Brooklyn in 2019, I attended a TWC event (I think it was them, could’ve been somebody else) and was summarily unimpressed with the organizing efforts–least of all the amount of time spent by a Google contractor who, bless her heart, didn’t seem to understand that they weren’t actually there for her but for “real employees”. There was also a bunch of time wasted with the usual progressive genuflections. For the past several years, I’ve had the pleasure of watching a CWA shop play out its bargaining from up close, and seen the slow disillusionment of the bargaining unit with the process–as a comrade noted after bouncing from the place, “having a union just means you get to help hold the knife when layoffs come”. If I had to sum up many of my criticisms and observations (and this is heavily anchored in a US background): To wit: the purpose of a union is ultimately to get pro-worker treatment via a monopoly on labor…so, it is fundamentally incompatible with any sort of pro-immigrant or pro-globalization stance. What? Immigrant/offshore workers can act as scabs, of course, but I don’t see why this is a fundamental truth. Immigrants can be union workers too. It’s not a fundamental truth. It’s cherry-picking of the most dysfunctional traits a union can have to build a strawman that is the easiest to shoot down and feel more intelligent about it. Are you in the US, or elsewhere (as I gather from your profile)? I was pretty clear I was addressing the US operating regime–if you’re in Germany or whatever you have a different kettle of fish. The de facto purpose of getting H1-B visas in the US is to have a captive workforce that can work more cheaply than native labor. If they cost the same to employers, I wager they wouldn’t be as attractive to hire. Here, go look for yourself–“some of these things are not like the others”, as one might say."
year_published = 2025
