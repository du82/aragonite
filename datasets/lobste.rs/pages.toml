["https://lobste.rs/comments"]
title = "Newest Comments | Lobsters"
full_description = "If we consider different methods of communicating in English in a spectrum from binary through Morse code (ternary) to IPA, this font’s 26 core letters can be rendered in exciting ways as can everything else. We could create a protocol only using interpretive dance, or only lines (of varrying thickness) and curves like various shorthand systems, which may include the alphabetic intermediate step or align them directly to the phonemes.. How do you like it there? I haven’t been for 20 years. I’ve been pondering moving there since my girlfriend is Mexican and it would be easy for her, language wise. I am a bit worried about the rift between foreigners and Spanish people, since I remember they have anti-tourist demonstrations now. Even though I’d be there for longer, I am worried that I’d never be accepted because of xenophobia. I migrated a few diagrams from MediaWiki’s Extension:Graph (based on Vega, and vulnerable to XSS) to Extension:Chart (less capable, but secure, it seems). Here is an example: https://sv.wikipedia.org/wiki/Mortalitet It’s only available on a few languages, but I am happy to see that an alternative is finally getting somewhere. Happy to help anyone who wants to try it out! I wouldn’t recommend its continued use to many, but I would recommend everyone to try it and learn from it. When I discovered it, I nearly immediately switched my blog to being Gemini-first (but with a transparent HTTP/HTML alternative front end). I still browse Antenna every few days. There’s an interesting community around Gemini where I have met people, went back to IRC, etc. It takes a certain kind of person to enjoy Gemini, but there are literally dozens of us having fun with Gemini. (The other cool thing, you can do interesting things in Gemini without a lot of effort. And because it’s “new”, you have many chances of innovating, or delivering things that others use! It has this unique, small world charm.) But yes, it’s very small, there’s not so much to do, and it has some technical issues (many of which cannot be solved because Gemini is intentionally locked). So in practice, most are not going to use it very much."
year_published = 2025
