["https://lobste.rs/s/etdzwd/ai_haters_build_tarpits_trap_trick_ai"]
title = "AI haters build tarpits to trap and trick AI scrapers that ignore robots.txt | Lobsters"
description = "12 comments"
full_description = "But to Aaron, the fight is not about winning. Instead, it’s about resisting the AI industry further decaying the Internet with tech that no one asked for […] This reminds me of a quotation that I can’t remember the source for but goes something like “If you’re getting eaten by a bear, you should fight back, not because you think you can win a fight against a bear, but because if you don’t, then someone might get the impression that you’re OK with the situation.” “Any time one of these crawlers pulls from my tarpit, it’s resources they’ve consumed and will have to pay hard cash for, but, being bullshit, the money [they] have spent to get it won’t be paid back by revenue,” To be clear, I love this project and I think it’s wonderful. However, this argument implies that if they had got real content, it would lead to (perhaps slightly more) revenue, and that does not seem to align with what we know about these companies; they are not doing this because it’s profitable. By all accounts, it’s deeply unprofitable and they do it anyway: https://www.wheresyoured.at/oai-business/ (this is admittedly a pretty minor nitpick) But the analysis in the article is a little … surface-level IMO. It paints a picture where either nepenthes, iocaine, and co are successful at “defeating” the abusive crawlers and ruining the data sets, or else they just feel a little better about themselves and it amounts to nothing. A more fruitful discussion would revolve around wanting to make disobeying robots.txt costly so that people stop doing it. This recently did happen, albeit on a smaller scale and not involving a megacorp: there was a fediverse crawler collecting stats in a way that ignored robots.txt, and one of the servers added an option to hide that endpoint behind robots.txt and serve up random numbers for the count of users. The crawler author threw a hissy fit but after a few days relented and agreed to add support for robots.txt like he should have done all along. So it can work, in some limited cases."
