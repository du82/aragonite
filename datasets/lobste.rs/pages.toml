["https://lobste.rs/s/9scmw4/what_are_you_doing_this_weekend"]
title = "What are you doing this weekend? | Lobsters"
description = "18 comments"
full_description = "My wife and son have been away for nearly five weeks, but I’m picking them up at the airport on Saturday morning. The rest of the weekend will primarily be hanging out with them, and doing what I can to soothe their jet lag. Taxes! And other bureaucracy. Xe have done a lot to organize xir physical spaces and now xe have to prioritize digital and bureaucratic organization. Hopefully play a bit of the Monster Hunter: Wilds beta before that wraps up entirely. Xe adored Rise. Got my first offer after a discouraging job search (right after the first interview, no less). It was verbal, so maybe “intent-to-offer” is more fitting. Still waiting for HR to send the magic papers in the next week or so. In any case, I’m glad my reserved spot in my local homeless shelter will go unused for the foreseeable future. Exploring Las Palmas de Gran Canaria, trying to get out and see things after working the week from here. Few days left, fly home next week. How do you like it there? I haven’t been for 20 years. I’ve been pondering moving there since my girlfriend is Mexican and it would be easy for her, language wise. I am a bit worried about the rift between foreigners and Spanish people, since I remember they have anti-tourist demonstrations now. Even though I’d be there for longer, I am worried that I’d never be accepted because of xenophobia. Last weekend I rolled my own crypto (https://insanitybit.github.io/2025/02/11/i-rolled-my-own-crypto). This weekend I might do it again, but better/worse in various regards. Alternatively, more grpc stuff. I’ve been doing a lot of ruby grpc and it’s been pretty painful. Maybe I’ll open source the gem I’ve built, or maybe contribute to the main repo or something. Working with Robot Framework (and the Selenium library) to implement UI End To End testing on FlowG : https://github.com/link-society/flowg/pull/395 Got my first flutter app working both on macos and iphone. Looks slick, so perhaps I could resolve some of my pains in this MacWorld."
