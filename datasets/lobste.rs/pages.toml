["https://lobste.rs/s/hlzin2/ward_christensen_bbs_inventor_architect"]
title = "Ward Christensen, BBS inventor and architect of our online age, dies at age 78 | Lobsters"
full_description = "I can safely say my life would’ve been entirely different but for the BBS scene in the 80’s and 90’s. Even then, even as a child, a huge amount of my social life was conducted via dialup BBS’s. I even wrote my own, as an ARexx script for the Amiga Term terminal emulator (I lived in a small town and no one ever called it but me and my friends but boy was it a learning experience). Discovering BBSes resulted in a very different direction in my life as well. As a teen a majority of my healthy social interactions took place on the local BBSes in the small town I grew up in. My in-person friends at the time were not exactly the best of people to be hanging around if I wanted to avoid getting in trouble. I was programming an SoC last year that still used X-modem protocol to load new images into flash. Some of these BBS technologies will outlive us all. Project I worked on a few years ago got buried under a highway for doing data collection (in a small vault, not just in the dirt). I had encouraged them to use IP-rated Ethernet connectors but they didn’t on the first prototype unit. Come winter there’s salt water ingress (presumed) and we can’t talk to it over SSH anymore. But… we had anticipated potentially having issues and had wired in a separate serial line to it so, mostly so that we could get into u-boot if things went catastrophically bad. After losing the Ethernet connection we looked at the most valuable data, realized it would only take about 2 hours per day to offload at 115,200 baud, and… well… transferred it all using z-modem every night. There was an extra complication though: the minimal Yocto-based custom Linux build we had on there didn’t have z-modem or any other serial-compatible way to transfer binary files! But it did have xxd… so… we ended up cross-compiling the z-modem binary, converting it to hex, sending that to cat, unhexifying it on the unit. That was a fun couple of days doing the Apollo 13-style “ok, we have this box of parts, how do we keep the system alive until spring” engineering effort."
year_published = 2025
clearnet = "https://lobste.rs/s/hlzin2/ward_christensen_bbs_inventor_architect"
