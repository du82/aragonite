["https://lobste.rs/s/eci07x/hundreds_code_libraries_posted_npm_try"]
title = "Hundreds of code libraries posted to NPM try to install malware on dev machines | Lobsters"
full_description = "Package managers really should have some sort of level of trust associated with packages. Not inferred trust from arbitrary metrics like number of downloads, more like actual vetting from trusted sources. A nice idea might be to have a number next to a package of all the sources that officially trust the package, and you can click the number to see the list of sources - be they websites, approval from notable figures in the community attached to the package’s profile itself, whatever. A particular source can be personally un-trusted, and people could even kick around custom lists of trusted and untrusted sources/packages, kind of like an adblock rule list. Even still, trusted packages can be hijacked. Malware on the dev’s machine, supply chain attacks on upstream packages, malicious contributors playing the long game à la Jia Tan, or a package changing hands via purchase/a maintainer stepping down due to lack of time or burnout. Cryptographic signatures could tamp down on some of these, but having endorsements could give a false sense of security, or introduce complacency. It’s a hard balance, since all it takes is one moment where your vigilance isn’t as high as it should be, and you could be infected with malware. A sophisticated targeted attack can hijack the repository of a trusted package. A burglar can break into my house and steal all my money. A superpower can decide they don’t like living things anymore and launch an ICBM somewhere important. None of these are excuses as to why we can’t have a more rigorous process of gaining user’s trust or separating known packages from unknown ones, instead of simply letting them all float in the same pool of indistinguishable packages where the only difference is the name and the number of downloads. Because right now, that is what users are using as a trust system, people are already using a trust system, and it’s far less reliable than what an actual, intentional system of trust reified into the package manager itself would most like be."
year_published = 2025
