["https://lobste.rs/comments/page/2"]
title = "Newest Comments | Lobsters"
full_description = "We currently fetch exchange rates from the European Central Bank (https://github.com/sharkdp/numbat/blob/b7f9d8e130b3303d118569f0ab1ea265e29d87b0/numbat-exchange-rates/src/lib.rs#L37). We plan to add other sources as well: https://github.com/sharkdp/numbat/issues/438 Honestly that nixpkgs doesn’t seem to have any requirements around approvals is way more concerning to me than the actual revert itself (still concerning but for a different reason). Anyone who has the ability to merge PRs can push code without any oversight. Just because this is was too funny to not share: https://www.youtube.com/watch?v=3Y0emgKbCwc - the interview with Jason Cross, the real creator of Fixi I’m wondering if you have any plans to add a history viewer on top of the git log to see the various experiments and how they are different from each other. I’m thinking about your “regular Joe Reviewer #2” use case where they might be interested in the development of the work but might not be able to use git log to track it. What I’m thinking about is an HTML overlay over git log that shows cards for each experiment, maybe all the commits that went into it (if they are tagged somehow to a specific experiment), and then the performance stats under each one. This would allow you to publish the log somewhere easy (like GitHub Pages/OSF.io/your university static HTML host) so that non-technical people can interact with the work. An additional bonus would also be to add “traceability” of the work by linking experiments to each other, so to visualize how each experiment builds onto other ones, kind of in a network. I’ve been thinking about treating the mTLS certs as MFA, and allowing people to use a username & password. You could even give them backup codes should they lose a cert (do to loss or expiry or whatever). It is nice that you can use mTLS so easily, but I do agree it has some edge cases for regular users (loss, multi-machine, &c). Yeah, this seems unquestionable. It’s sort of just a factual side effect of models being behind on training data, biasing towards trends, etc. But that was already the case, perhaps it’s amplified but I’m not sure. Also, ChatGPT has a “search” now that may assist a lot."
