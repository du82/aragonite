["https://lobste.rs/s/cuakjw/survey_every_iterator_variant"]
title = "A survey of every iterator variant | Lobsters"
full_description = "There are some iterator combinators such as count that take an additional Self: Sized bound². But because trait objects are themselves sized, it all mostly works as expected: This isn’t quite right. Trait objects are not themselves sized. The subsequent code sample works because of the impl<I> Iterator for &mut I where I: Iterator + ?Sized implementation. The count method isn’t being directly invoked on the trait object, it’s being invoked on the &mut which is a concrete iterator implementation. You can prove this yourself by making your own custom Iterator implementation that provides a custom implementation of the count() method, and then invoking it via a &mut dyn Iterator (Rust Playground). If you do that, your custom count() won’t be called, the default implementation on the &mut I instead will be used. The count method isn’t being directly invoked on the trait object, it’s being invoked on the &mut which is a concrete iterator implementation Is this considered a bug? I understand how and why works, but the code in your playground link is really counter-intuitive, it’s clearly a footgun. I wonder if this could be fixed? I searched whether [Coroutine] was actually being used today, and it doesn’t seem to be. Which is why I suspect it is likely fine to use an associated type for the input arguments. Coroutine is nightly-only, so it’s not surprising to me that it’s seen limited use. I used next-gen in a project a couple years ago and was pretty satisfied. Maybe look for it and crates like it? (e.g. genawaiter) IntoIterator has no type parameters. This means calling foo.into_iter() is unambiguous as to the type. Using Into<Iterator<…>> would allow for a single type to implement conversions into countless different iterators, and so the desugaring of for x in foo { would become ambiguous as to what concrete iterator type is to be used. No less ambiguous than any other use of an iterator though? x’s type would be resolved at use or with a type annotation on the variable declaration."
