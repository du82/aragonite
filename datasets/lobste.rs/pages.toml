["https://lobste.rs/s/3dzs83/i_keep_turning_my_google_sheets_into_phone"]
title = "I keep turning my Google Sheets into phone-friendly webapps, and I can’t stop | Lobsters"
full_description = "I wouldn’t really argue with that, but I think it’s worth considering how many developers write the type of app getting automatically generated here. Speaking purely for myself, I didn’t realize how far along this type of AI-generated app making had already come, so I appreciated the detailed write-up. Don’t think anything there was “AI-generated”. The no-code app builder stuff is, thankfully, entirely deterministic. Of course that platform integrates a bunch of “AI” stuff to use inside of the app but it’s optional. I just wish the phone app tool was open source or there was an open source competitor to it. The pricing as mentioned is far outside my “Let’s try it and see if we like it” budget Huh, the highlight for me was the “staff pick” that mentions TIddlyWiki. I thought it was just a wiki, but it seems that you can develop simple apps with it? I’m constantly looking at quirky open formats for these things; I am a light org-mode user, I am adopting Ledger, I have written tools for doing stuff with Markdown files (I wrote a small thingie to embed SQL queries that operate on Markdown tables; I think this concept has legs)… TiddlyWiki seems like another thing that should be on my radar. (I thought Ikiwiki was it.) If you like “quirky”, you might enjoy Decker. Just like TiddlyWiki, Decker can function as a self-contained single-file web application that can be customized and tweaked live by the user. The whole project is FOSS and the file format is designed to be diff-able and generally human-readable. Any (FOSS?) alternatives to Glide? I am using Airtable and Baserow directly instead of Google Sheets + X but they don’t seem particularly mobile-friendly (Airtable is ofc better than the OSS Baserow in that regard but still clunky, I guess). I’d have said Baserow was quite similar. I suspect I’m more tolerant of jank on mobile than many people are, though."
