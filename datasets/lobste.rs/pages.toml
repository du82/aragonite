["https://lobste.rs/s/3lqpko"]
title = "Gemini: the misaligned incentives | Lobsters"
description = "24 comments"
full_description = "A drum I like to beat is that, as the harmful behavior of AdTech companies continues to become public and explicit, there is an explicit opportunity for software practitioners to build less harmful software and organizational patterns around this software. This doesn’t however preclude the idea that software should empower and delight the user who can in many circumstances be non-technical. What ideas like Gemini do by merging these concepts is to frame the idea that user-centric software is harmful and developer-centric software is not, which I want to push back on. Being developer or user-centric is one axis; harmfully mining your information is a tangentially related concern. I have a different take on the long lines (but with the same conclusion). One line per paragraph essentially means that diffs, and therefore revision control, is unusable. One line per sentence (or perhaps clause, it doesn’t need to be strict) is a convention in areas where people work on text together (such as writing papers in LaTeX) for good reason. If that’s not a concern, sure, wrapping things to look nice in a text editor as the author wants to do here is reasonable. Which of these two makes the most sense depends on the context. Gemini’s approach is the worst of both worlds and does not make sense in any context. It’s just wrong. Sounds like our diffing and merge tools are too basic. There is no great reason for line based merge other than it seems to work well enough for code and reduces the computational complexity (mostly in pathological cases). I much prefer soft wraping because it looks nice whatever the current size of my editor or browser window happens to be. Fair enough, but what nearly all actually existing tools do seems like a pretty significant consideration for a platform that exists for the sole purpose of being simple… And of course very few tools support rendering hard-wrapped lines nicely. The options are basically either having a screen that is larger than what the author wrapped to or render as markdown or html."
