["https://lobste.rs/s/pnysdr/lobsters_emoji_adoption"]
title = "Lobsters Emoji Adoption | Lobsters"
description = "26 comments"
full_description = "We’re celebrating the inclusion of the lobster emoji in the new release of Emoji 11.0 from the Unicode Consortium by adopting it. There is no reward for donating besides the warm glow of knowing you’ve helped support an organization that is the source of so much error handling in our code. (Well, Unicode is a 501(c)3 charity, so if you itemize you can deduct that on your US taxes.) GoFundMe disburses directly to charities on the 25th of the month, so we’re only going to run for 11 days until late on 2018-02-24. I’ll turn it off whenever I’m going to bed (US Central time, GMT-6), so don’t wait until the deadline to get your donation in! Though we expect to reach the $1,000 Silver level for adoption, every single dollar we raise will be directly donated to Unicode regardless of how much we raise. Stretch goal: if we reach $5,000 we can be the sole Gold-level sponsor. Stretch reward: still just the warm glow. But won’t that be pretty funny? Edit: Silver! At noon on day one! Really glad to see this. I’ve bumped up the target to our stretch goal of $5,000 for gold-level sponsorship. That Maine Senator is going to be so jelly. Edit: At @jcs’s suggestion, I’ve added a progress meter to the homepage and recent/newest stories pages. Added: It has an id tag, so you can adblock it with lobste.rs###emojifundraiser if you don’t want to see it. The excellent lobster drawing is courtesy @goodger. It is off-center because the gofundme ajax image editor just hangs instead of editing the crop so… uh… I mean, it’s a design aesthetic. I’d say we go for it, and offer them to take over the gold spot for a 10k donation to Unicode instead. :-) The color signals “WARNING ALL ACCOUNTS COMPROMISED!”, even though it’s consistent with the color of boiled lobster… Could use the one referenced here -> https://www.thesun.co.uk/fabulous/5647842/lobster-emoji-issue/ maybe? Coming from the DM, I had a hard time finding the gofundme link. Just in case others are as dense as I am, here it is: https://www.gofundme.com/lobsters-emoji-adoption"
