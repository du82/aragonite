["https://lobste.rs/s/2az6nf/parallel_random_numbers_as_easy_as_1_2_3"]
title = "Parallel Random Numbers: As Easy as 1, 2, 3 | Lobsters"
full_description = "There’s a close correspondence between pseudorandom number generators and stream ciphers: a stream cipher is a PRNG that generates a keystream which is XORed with the plaintext/ciphertext to encrypt/decrypt it. A stream cipher is just a PRNG with hard mode turned up to 11. A standard way to make a stream cipher is to encrypt a counter with a block cipher; this is called counter mode when it’s done with a general-purpose block cipher like AES, but it’s also how stream-specific ciphers like ChaCha20 work. Cryptographically secure PRNGs emit the key stream from a stream cipher. (They also have machinery for secure rekeying.) For example arc4random was based on the RC4 stream cipher; the Linux kernel CSPRNG uses ChaCha20. Philox is designed like a simplified stream cipher: its state is a counter which is passed through a few rounds of a keyed mixing function to produce its output. PCG uses a linear congruential generator instead of a counter, ie, its state update is a multiply-add instead of an increment. PCG’s key is the LCG addend. PCG has much simpler output mixing functions, which use different bitfields from the state as the function’s input and key. I think the variant of Philox that is closest to pcg32 is Philox4x32-7. If I understood the description correctly, the comparison is roughly, pcg32 bandwidth was measured on a single core of a CPU that’s 12 years newer; compiled for AVX2 it was easily getting > 10 GB/s on a single core Thanks to the poster for making me aware of the paper, I was searching for some time for a good algorithm in this class. The one aspect that I think is overlooked from the paper, is that it doesn’t just provide a good random number generator, but also a bijective random number generator even for small counters (i.e. 32 bits). Why does this matter? Because sometimes you want to “scramble” an input, but at the same time avoid collisions, i.e. sometimes one needs a permutation that also looks randomly (and you don’t want to generate one and cache it in memory)."
year_published = 2025
