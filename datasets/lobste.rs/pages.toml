["https://lobste.rs/s/2mguw6/cracking_old_zip_file_help_open_source_anc"]
title = '''Cracking an old ZIP file to help open source the ANC's "Operation Vula" secret crypto code | Lobsters'''
full_description = "Fascinating history behind the code. When I think of BASIC, I think of toy maze generator programs, not exiled political parties trying to coordinate clandestine operations. Wikipedia says the ANC was getting a “considerable amount of support” from the Soviets; I don’t know precisely what kind of support, but I mention it to point out that this was definitely not just two or three activists photocopying newsletters. This was legit spycraft stuff—and they had to roll their own crypto. I had to know how they were generating their random numbers. Relevant code starts here. They do try to get more entropy by periodically reseeding the built-in RNG with some mash-the-keyboard input. But it all boils down to the concatenation of 100 outputs from three other RNGs, which I’m guessing are all LCGs or similar. So no matter how you mash the keyboard, you’ll still have many long runs of consecutive outputs from weak RNGs. (Not that I had high hopes for security. But hey, I guess it worked well enough for their purposes?)"
