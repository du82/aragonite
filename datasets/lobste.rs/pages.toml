["https://lobste.rs/s/sn8buz/tv_setup"]
title = "TV Setup | Lobsters"
description = "45 comments"
full_description = "Reminds me of a friends posts “how to use the German digital passport for online authentication in 25 simple steps”… Without specifically mentioning the ones you’re referring to it’s hard to know what this relates to. I’ve recently adopted Jellyfin, and found it to be generally fine - a few quirks here and there but generally fine. The biggest downside I’ve seen so far is that there isn’t (to my knowledge) a good Mac open source client for it - but this article is about an AppleTV which doesn’t have that issue. I’m aware some of the iOS/iPadOS clients can run on macOS, but none of the ones I’ve tried work very well with a large screen. Infuse has native support for jellyfin too. It’s quite a good app and has support for more codecs than just native iOS player (which jellyfin uses). My guess is the author doesn’t want multi-device streaming /status syncing so jellyfin isn’t required. In which case infuse on appletv is a decent choice. There’s a few mentions in there of having a phone and tablet; I do appreciate that Infuse makes it very easy to start watching a show on one screen and continue on another. I didn’t name the specific open source apps because I didn’t want to get into an inevitably pretty nitpicky arguments about each. As a programmer running a linux desktop I’m pretty tolerant of clunky UI, but the apps I tried felt significantly worse and were soundly rejected by the nontechnical TV users. There’s probably a lot of familiarity at work in the personal taste; Infuse looks a lot like the popular streaming services. I get that, and I have infuse on ios devices and very much like it. The cool thing is, if you ever want to expand and do plex/jellyfin style stuff, infuse has support for it baked right in. The other thing I like is offline downloads, for when I hit the road but still wanna watch curb on repeat This HN thread on Jellyfin hits all of the issues I had with the open source options and also hits all of the “you’re doing it wrong” nitpicking I was not interested in participating in."
