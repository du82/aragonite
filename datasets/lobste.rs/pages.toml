["https://lobste.rs/s/abkeck/hardest_working_font_manhattan"]
title = "The hardest working font in Manhattan | Lobsters"
description = "10 comments"
full_description = "I like the author’s observation that the font’s constraint (being drawn with a constant-width line) actually has typographic benefits. Missing an italic/bold/condensed/small-caps variant of your font? If it was a TTF, you could get an approximation (that won’t look as nice) by stretching and squishing the existing letters in various ways. But because Gorton is modeled as strokes instead of filled shapes, the equivalent transformations look a lot better. I’m reminded of other areas in computing where a constraint comes with a silver lining—like the aesthetics of pixel art, or the composability of text-based CLI tools. Marcin Wichary (author of this piece) also has a talk about pixel fonts, linked at the bottom of the article. If we consider different methods of communicating in English in a spectrum from binary through Morse code (ternary) to IPA, this font’s 26 core letters can be rendered in exciting ways as can everything else. We could create a protocol only using interpretive dance, or only lines (of varrying thickness) and curves like various shorthand systems, which may include the alphabetic intermediate step or align them directly to the phonemes.. an interesting thought! perhaps one of the main benefits of constraints is that they lead to predictability - creating almost something like an implicit standard? As the author of the article eventually discovered, engraving machine lettering is based on engineering diagram hand-lettering: there were fairly explicit standards and training for how to write on diagrams. I wonder how much the lettering templates were redesigned directly from the hand-lettering standards, and how much they were manufactured using pre-existing engraving machine templates. This was lovely. Industrial history mixed in with quiet appreciation of the prosaic artistry of a particular type. This essay is typeset in a strangely-spaced version of Century put together for Selectric Composer typewriters and recreated for on-screen use. If that didn’t bother you before, it will bother you through the rest of this article."
year_published = 2025
