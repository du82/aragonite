["https://lobste.rs/s/oxtari/fixi_js_minimal_general_hypermedia"]
title = "fixi.js - minimal general hypermedia controls | Lobsters"
full_description = "hey lobsters, i wanted to show you all fixi.js, a minimal take on generalized hypermedia controls. I am the creator of htmx[0] and the author of “Hypermedia Controls: Feral to Formal”[1], and, inspired by Niklaus Wirth’s paper “A Plea for Lean Software”[2] I wanted to create an implementation of generalized hypermedia controls that was as lean as possible while still being useful. One example of this minimalism is that the project consists of a total of three files: a README that serves as the docs, the js file and then an html file that serves as the tests. [2] - https://github.com/lproven/plea_for_lean_software/blob/master/Niklaus%20Wirth%20-%20A%20Plea%20for%20Lean%20Software.pdf I love how lean this is(the code is even quite readable!). As a far away admirer of htmx/hyperscript, I haven’t had the chance to use them for something yet, this has some neat stuff, particularly using fetch() and MutationObserver. Great design tradeoffs! I’m not entirely sure why/when somebody should use htmx over fixi.js. Or what are the options if somebody wants something with a mixture of the features of htmx and fixi.js. Is the idea that if you need anything more than that fixi.jsoffers, one should turn tohtmx`? I also wonder if this’ll start a trend of “build-less HTMX alternative frameworks”, which doesn’t need to be a bad thing, but it would be a bit ironic. Fixi uses dom transition that is not well supported yet (FF doesn’t support it so smooth element transitions will appear as sudden switches, which you might or might not care about), and drops some legacy browsers support. Other than this is just stripped down version of HTMX, AFAICT. fixi almost certainly requires a user to write some JavaScript to make it work the way you want in a real world situation, so if you are comfortable with that then it’ll be great, but a lot of folks just want that code to be written for them, in which case htmx is a better choice Just because this is was too funny to not share: https://www.youtube.com/watch?v=3Y0emgKbCwc - the interview with Jason Cross, the real creator of Fixi"
year_published = 2025
