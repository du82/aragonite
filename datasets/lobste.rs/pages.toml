["https://lobste.rs/s/fwz8zb/so_this_guy_is_now_s3_all_s3"]
title = "So this guy is now S3. All of S3 | Lobsters"
description = "15 comments"
full_description = "Looks like Bluesky needs to have a look at RFC 8615 (.well-known path), or avoid reinventing webfinger. I’d be shocked if they didn’t know about it already. They instead demand folks develop endpoints that Lexicon can hook into automatically, which rubs me entirely the wrong way, given (as you point out) there’s an RFC for exactly what they want to do here. Can someone explain what this shows. All I see is a screenshot from a unknown[0] website with a username @s3.amazonaws.com. So what are the security implications of this? [0] as far as I have understand it’s from Bluesky. This doesn’t help, because I don’t know what Bluesky is or does. Bluesky is a social media site. Part of their take on ‘verified users’ (and a part of how they notionally do ‘portable identity’) is to have a process where a user can claim a domain, and it gets verified. But they used a janky home rolled solution which did not think it through (rather than webfinger or something like the verification part of ACME/letsencrypt or one of the cert signing/identification standards or one of many other already existing options), making it easier than it should be for random people to claim your identity and get verified. That’s disappointing. I saw that they use DNS names in their IDs but I thought it was the more typical/scalable “user@domain”, not just “@domain”… [facepalm] Could you elaborate on scalability? I’m assuming you mean creating DNS records vs serving http responses, but I don’t see where wildcard records + Origin: fall short? I just meant that user@domain scales to any number of users per domain, vs. everyone needing to register their own. Interesting. Indeed, looks like he successfully registered @s3.amazonaws.com … luckily he indeed works as a security engineer at AWS so there’s that. Could it be that he, by being able to do this, pointed out a potential problem with the protocol? This is exactly what he did: pointed out a problem with the protocol. As far as I can tell, it doesn’t require any special access to be able to do that."
