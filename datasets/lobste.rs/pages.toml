["https://lobste.rs/s/x7nhcq/framework_ships_risc_v_board_for_its_13"]
title = 'Framework ships RISC-V board for its 13" laptops along with "boardless" laptop chassis | Lobsters'
description = "25 comments"
full_description = "It’d be great with a better CPU – the JH7110 is extremely slow; I have a VisionFive2 and running builds there is pain. but I think I may be, weirdly, more excited by the $400 “everything but the board” chassis they’ve now started offering: At $199, that is very reasonably priced! – I wonder what the software support landscape in RISC-V is presently. The software support isn’t bad, but the price is largely because this particular chip is no barnburner. Is it usable, speed wise? For, say Firefox? @deivid above mentions it’s slow, but that can also be IO or whatever. You’d need a DeviceTree overlay, as there are multiple versions of the board. This is a minimal one: Build the overlay with dtc -@. In u-boot’s extlinux.conf, use fdtoverlays command to specify your overlay. Maybe I had to google it more time, but it’s not described in the official documentation or the getting started guide. I know this will sound strange, but I believe the documentation could be improved in the past two years, considering the fact that this question has been answered several times on the forum. PS: I’m really liked radxa community and their hardware, maybe https://forum.radxa.com/t/radxa-rock-5-itx-vs-milk-v-oasis/20960 will have more opportunity from users. milk-v oasis is currently suspended, as sophgo, the company behind the SoC, was rejected by TSMC citing US trade restrictions. It doesn’t mean there won’t be similar SoCs from other companies (there are likely many in the pipelines), but that specific SoC is probably not happening at all. The best recent news is SG2044 exists and has been benchmarked (results have been posted in Geekbench). That’s a followup of SG2042, a 64-core monster, but using C930 or whatever the name of the newer core is. C910 was RVV 0.7 + proprietary extensions, the new one is standard-compliant RVV 1.0 and thus a big deal. It’s about 3-4x slower than a Raspberry Pi cpu-wise. The I/O is not great, even with an NVMe SSD, less than 100MB/s."
