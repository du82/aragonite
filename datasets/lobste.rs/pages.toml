["https://lobste.rs/s/cvxhqu/devenv_telemetry_warning"]
title = "Devenv telemetry warning | Lobsters"
description = "38 comments"
full_description = "We heard your feedback, I was personally very excited we can generate developer environments from source code. As someone who has been vocally supportive of devenv both here on lobste.rs and privately amongst colleagues at various software companies, this was embarrassing. Devenv is an objectively good piece of software that I appreciate as part of my development workflow every day. I’ll continue using devenv because of that, but pay more attention to release notes and the PRs that go into releases because of devenv 1.4. Now I’m in the awkward position of having convinced people at multiple commercial software shops to use devenv, knowing that you released a feature that I’m morally and commercially opposed to. Because of that, I’m notifying everyone I know who is using devenv because of me that 1.4 was released with a feature that is potentially hostile to them and their commercial interests. They can make their own decisions based on that information. I won’t continue recommending devenv freely, and if I do recommend it, it will be with an asterisk. This is what a loss of goodwill means to me. I appreciate the action you’ve taken based on pushback. Once devenv has a long pattern of behavior in users’ interest, I’ll re-evaluate my position on it. Until then, I’ll remain suspicious that your response is just another “we heard you” post from the CEO fuck-up playbook. I personally don’t have any interest in the feature, but it probably just needs more warnings / opt-ins in tooling. Anyway, thanks for responding to the furore in good time :) The most egregious thing about this, other than the part where the devenv maintainer reverted the PR that disabled the telemetry in nixpkgs, is that it, for some reason slurps up all of the files in your git repo. I’ve never heard of any telemetry that does this. I don’t use devenv, but the way I understand this the file sending isn’t related to telemetry, it’s part of an explicit feature to generate an environment for a local project by sending it to an LLM."
year_published = 2025
