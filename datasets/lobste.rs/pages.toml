["https://lobste.rs/s/l4olys/numbat_statically_typed_programming"]
title = "numbat: A statically typed programming language for scientific computations with first class support for physical dimensions and units | Lobsters"
description = "20 comments"
full_description = "Would be interested to see a comparison of this, Frink and Rink. If one doesn’t exist I’ll try them all and write it up somewhere. FWIW, I’ve tried to calculate 30 mpg to L/100km in both numbat and Rink, and neither can do it immediately. They both suggest inversion (numbat suggests inverting the right side, which is “wrong” if the unit on the right side is what you want), and then rink produces the correct value, while numbat ignores the 100 part: FWIW, I’ve tried to calculate 30 mpg to L/100km in both numbat and Rink, and neither can do it immediately. Oh, I hope they change that. The Rink unit conversion is pretty well specified, where x -> y computes x / y and then displays the result with y (unmodified) as the units. I think it’s surprising and less useful that numbat ignores the constants in y, but I could be missing something. We have a comparison with other tools in our documentation (https://numbat.dev/doc/comparison.html), but it does not include “Rink” at the moment. I would love to see that - I’ve used Rink regularly for years and my first question was how numbat differs from Rink. This tool has become very handy to me! From binary to hex conversion to km to Miles or voltage and watts to amps, it is very very handy! honestly numbat looks really nice but it, like every other calculator program i’ve seen, seems to be completely missing RPN support, so i’ll stick to my old HP calculator for now lol This looks like it could partially replace speedcrunch in the long run. especially for doing all my electronics computations, where stuff like figuring out the switching parameters of a buck converter is quite some math to do right, and not messing up the units the docs are quite good, the unit support seems great and having your own modules and functions makes it a good tool as well I have always wondered how these applications work with exchange rates; are they updated in the source code with each release? We currently fetch exchange rates from the European Central Bank (https://github.com/sharkdp/numbat/blob/b7f9d8e130b3303d118569f0ab1ea265e29d87b0/numbat-exchange-rates/src/lib.rs#L37). We plan to add other sources as well: https://github.com/sharkdp/numbat/issues/438"
