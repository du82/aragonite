["https://lobste.rs/s/m9ivcf/we_turned_lobste_rs_into_rails_benchmark"]
title = "We Turned Lobste.rs into a Rails Benchmark for YJIT | Lobsters"
full_description = "I learned about this while scrolling mastodon. This is the second time I’m aware of the codebase has been used for perf testing. Shame for them that they did this before I did all the cleanup to our ansible playbook. That can’t have been too much fun to stand up. We don’t run an APM so I don’t have a pretty chart with a line moving drastically. Cobbling together shell hackery from StackOverflow answers for an unrigorous (traffic characteristics are different between the US workday and evening) stats, we seem to be spending significantly less time in ruby: I’m going to go ahead and call that a (91.1488−72.0779)/72.0779 = 1.26x speedup for a trivial commit. In the time-honored tradition of ad-hoc invalid one-off benchmarks, this is now the popular understanding of the precise speedup yjit gives every Rails app for the next decade. Thanks yjit authors! Does anyone know what happened to Noria? 5k commits in their github repo, but nothing since 2021. Did it get forked? Is there a rewrite? Did the funding run out and no one cared? It is now a fully fledged company called ReadySet. The code for self hosting is open source: https://github.com/readysettech/readyset. Could TrufflyRuby run it, or does it have many incompatible extensions for that? I find that project extremely impressive and would be interested in how it fares."
