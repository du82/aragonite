["https://lobste.rs/s/v7yslc/including_screenshots_git_commit"]
title = "Including screenshots to git commit messages to show visual changes of features / bug fixes | Lobsters"
description = "18 comments"
full_description = "And in excess, a good way to make sure nobody ever actually goes back and learns about the things you reference. Think of inline Wikipedia Citation needed versus a reference number. Perhaps a future version of Git (or a future VCS altogether) could support a format less restrictive than text that is, by convention, plain and limited to a 50 character summary and 72 characters per line thereafter. I am probably bending this convention when I use Markdown syntax in my commits. Embedding base64 encoded images rather breaks it. This would also work well as a notes ref. The only downside being the git notes UX is somehow much worse than the normal git UX. I do this by having a gohugo site with blogposts INSIDE the git repo that I’m working on. My developer notes get committed at the same time as my changes making it easy to see what is going on. Sounds like an interesting idea, but I think it might be better added to something like git notes instead of into the commit message. Do you know of any online web frontend that shows git-notes? I think that not even cgit shows them. Same with github and gitea. Ahh, unfortunately I don’t think any frontends show git notes. GitHub used to do it, but dropped support way back. https://github.blog/2010-08-25-git-notes-display/ At the end of the day, these “images” are stored as Git blobs, regardless of whether they are a plain file added to your commit, or encoded base64 in your commit message. Having big blobs over time makes your git repository a pain to work with. Git is designed purely for plain-text content. A lot of work were put into making “git log” outputs and git commit messages searchable with regex so that you could look up relevant information in the future. If you really desire images, just check in a rendered file and use git-lfs to store it. Yeah, obviously? I don’t understand why everyone feels the need to state the obvious. I didn’t say it was different from anything else. I said I compressed a webp and converted it to a data uri that becomes less than 1000 bytes in your commit message. The entire point is how to do it inside the commit message, not anywhere else. It’s absurd how many critical comments I have received for this, I never claimed it was more efficient than anything else and I never said people should do it."
