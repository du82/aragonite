["https://lobste.rs/s/gfjbhp/how_backdoor_large_language_models"]
title = "How to Backdoor Large Language Models | Lobsters"
full_description = "“Even if it writes malicious code, we’ll catch it in code review” […] This assumes the backdoor is “obvious” — this could be as simple as a 1 character typo in a package name. I was thinking along these lines recently, as I was playing with the trial of a JetBrains autocomplete AI gadget and, before I gave up and turned it off, it kept suggesting things that were just confusingly similar to what I needed, but wrong. (Think “invites” instead of “invitations”, “receiver” instead of “recipient” in an API and things of that ilk.) I wasn’t even thinking of someone planting these deliberately, so much as predicting how the AI would foul things up for more potent typosquatting attacks. Being able to plant them would make them even more fun, for certain people’s definition of fun. Inverting the condition in an if statement. The code looked right, and it was off the most common path so only cropped up occasionally. The more painful one was in MDIO. Ethernet MACs expose the PHY registers via a uniform interface where you use a MMIO MAC register to control which PHY register you’re talking to and then read or write it. I pasted the docs from the device spec into a comment and was impressed that it autocompleted the MDIO read and write functions. Unfortunately, it flipped a bit in the middle of the command mask and so inverted read and write. Reading appeared to work, but would return the value from whichever PHY register you thought you’d written, writing would do nothing."
