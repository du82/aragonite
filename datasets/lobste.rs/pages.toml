["https://lobste.rs/s/3rqmav/how_we_are_defending_software_freedom"]
title = "How we are defending Software Freedom against Apple at the EU's highest court | Lobsters"
description = "52 comments"
full_description = "The Digital Markets Act definitely is one of the better EU laws. I value it at a similar regard as the GDPR, and hope the EC will not bow before Apple’s anti-competitive lobbyism and a potentially looming trade war. The FSF Europe is playing a crucial part in this, thank you! I do hope for a future where everyone will be able to use their own devices to the extent and capabilities they see fit. In that regard, I also hope the EC will rule the Core Technology Fee to be in violation of the DMA. Apple is making enough profit off their devices as-is, there is zero reason for them to collect additional fees on software distributed outside their own infrastructure. Many people are asking “Why force Apple to open up their platforms? Why don’t the users just pick another platform to run their software on?”. If you are genuinely interested in the long answer, I strongly recommend “Chokepoint Capitalism” and “The Internet Con” by Cory Doctorow This guy. I can’t tell his NY Times bestselling fiction apart from his NY Times bestselling nonfiction. At least his YA novels are clearly distinguishable by the cover graphic design. Anyway, I really don’t understand why he (or somebody!) can’t put up a free, concise summary of his argument(s?) if they’re so important. It always seems to boil down to more government regulation, as though regulatory capture hasn’t already paved so many miles of the road we’re on. It always seems to boil down to more government regulation, as though regulatory capture hasn’t already paved so many miles of the road we’re on. Thanks for the links. As for a summary, I think he regularly writes blogposts and columns and appears on podcasts and gives talks. Here is a random interview I found where the first two questions are about interoperability and regulatory capture. What is the tl;dr on this issue? It sounds like the litigators want to load their own software on Apple hardware and use legislation to force that? Sounds bogus to me. There’s a gazillion hardware platforms. Pick an android device. Pick any of a thousand laptop brands."
