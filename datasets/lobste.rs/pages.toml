["https://lobste.rs/s/oqfmhj/roomy_deep_dive_atproto_automerge"]
title = "Roomy Deep Dive: ATProto + Automerge | Lobsters"
full_description = "Isn’t a CRDT overkill for a chat program? I have no experience with this but seems to me there is are no conflicts that would arise in a chat log even if participants are allowed to add to it when offline. You can merge the logs with ordering based on timestamps? I’m not fluent in the technicals, but in short the answer is no, you can’t rely on local timestamps because they’re variable and can therefore even be used as an attack vector if not accounted for. you can’t rely on local timestamps because they’re variable and can therefore even be used as an attack vector I’m not an expert, but attack vectors seem iffy as a reason to prefer CRDTs. Don’t CRDTs also have attack vectors? As I understand it, most CRDT algorithms assume participants are acting in good faith; protecting against bad actors is usually not a guarantee. I can think of ways to attack a hypothetical chat program that sorts messages by timestamp: for example, forward-date a spam message by 1000 years to pin the spam message to the front of the chat. But with CRDTs, I don’t know in what ways they can fail. Is there a malicious Automerge message I could craft that would prevent new chat messages from appearing, or that would cause the chatroom to look different for different people? Maybe. But CRDTs are complex enough that they obscure the exact nature of any vulnerabilities. Speaking strictly from a security standpoint, you’d be better off with plain old timestamps—yes, there are ways they could fail, but at least they’re obvious, and the average dev can reason about those failures and how to mitigate them. (Not to be too harsh on CRDTs! I think it’s pretty cool that people can build distributed applications on top of high-quality libraries like Automerge, without having to solve every single tricky consensus problem themselves. They might even be the overall best solution for the chat room being discussed! I’m only saying that just because a black box magically solves consensus problems doesn’t mean it solves security problems.)"
year_published = 2025
