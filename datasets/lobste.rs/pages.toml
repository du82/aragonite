["https://lobste.rs/s/ajgc48/thunderbird_android_client_is_k_9_mail"]
title = "Thunderbird Android client is K-9 Mail reborn, and it’s in solid beta | Lobsters"
description = "24 comments"
full_description = "Thunderbird has one of the worst user experiences I’ve ever seen. It takes seconds to delete an email from my inbox, the UI thread hangs all the time, if I click on a notification, it makes a black window because the filter moved the email while the notification was up and they didn’t track it by its ID or some basic mistake like that. Every update the UI gets clunkier and slower. Searching has a weird UI and fails to find matches. I could go on and on, there are so many UX issues with this worthless software. I have no idea what’s going on over at Mozilla. I think the org just needs to be burned to the ground. I use it as my daily driver for now, but I feel like I’m on a sinking ship surrounded by nothing but ocean. Yep, same boat. 100k+ emails, lots of filters, etc., it just works honestly. Thunderbird has only gotten better for me since Mozilla stopped supporting them. Out of curiosity, are you using POP or IMAP? I imagine the performance characteristics would be very different, given their different network patterns. I run Dovecot as an IMAP server on a Thinkpad which was first sold in 2010 with an SSD in it. I keep thinking I should change the hardware but it just keeps trucking & draws less than 10W so it never seems worth the effort. Ah, IMAP, but on the local network? That’s likely to be much faster than IMAP over the internet, which I think is a very common use case. It’s stuck behind a 100Mbit ethernet connection (for power saving reasons) which is roughly equivalent to my Internet connection but the latency is probably lower than it would be to an IMAP server on the wider Internet. Branding is a powerful concept. You think Outlook on iOS or Android shares anything with the desktop app? Nope, it’s also a rebranded M&A. It is kind of funny the same happened with Thunderbird. Which leads to funny things where Outlook for mobile gets features before the desktop version (unified inbox and being able to see the sender’s email address as well as their name come to mind)."
