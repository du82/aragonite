["https://www.localstack.cloud"]
title = "Run Locally, Deploy Globally"
description = "Develop and test your AWS applications locally to reduce development time and increase product velocity. Reduce unnecessary AWS spend and remove the complexity and risk of maintaining AWS dev accounts."
full_description = '''Develop and test your AWS applications locally to reduce development time and increase product velocity. Reduce unnecessary AWS spend and remove the complexity and risk of maintaining AWS dev accounts. Allow your developers to focus their time and effort where it counts by developing and testing locally. Nobody likes setting up sandbox accounts, cleaning up resources or constantly monitoring AWS dev spending. Don't worry about IAM policies unless you really want to and enable or disable IAM enforcement however you need it. Have IAM policies generated on the fly and test your policies before hitting production. No dealing with complex permissions, or deciding who gets a cloud account anymore. Since everything runs locally these concerns disappear. Work across different branches without having to update your infrastructure every time. No need to go grab a cup of coffee waiting for your infrastructure to deploy, load a complete stack with all its data quickly. Hot reload and debug your lambdas locally. Setup a local no-risk, no-cost sandbox to rapidly onboard developers into your stack. Dev and test your app as you wish, there’s no cloud spend when running locally. By emulating cloud services locally, LocalStack enables additional features and workflows that are not feasible on the cloud. Backed by a large community and rooted in open source. Make cloud development more enjoyable by reducing some of the friction and wait times that sometimes come with it. Once tried, it's hard to go back to working without it. "After learning @localstack and #Terraform I definitely now sleep better at night knowing that the chances of AWS causing me to declare bankruptcy is much lower." “You can save a lot of time in testing your IAC or application using LocalStack in your local environment instead of using the AWS Cloud environment.” "Really nice experience using Localstack with Docker Compose. The Initialization Hooks in Localstack enable you to configure resources like Kinesis streams and DynamoDB before the app starts, all running locally with no significant code changes."'''
year_published = 2025
clearnet = "https://www.localstack.cloud"
