["http://www.localstack.cloud/about"]
title = "About"
description = "We are a young, fast-growing start-up building cutting-edge technology to revolutionize cloud development processes and support highly efficient dev & test feedback loops. Our mission is to empower developers to rapidly build and test their cloud applications, saving valuable time and resources."
full_description = "We are an international company with team members all over the world. We also have office spaces in Central Europe where parts of the team meet multiple times a week. We recognize that people have different needs in terms of social interaction, and respect that not everyone can do fully remote, while others prefer it, or have no choice. We accommodate flexible working hours and work style. It is important that we don’t block each other, but other than that, you are free to work the way you work best. Whether you are an early bird, night owl, or anything in between, asynchronous communication and flexibility can help us make it work. One of the biggest freedoms of our team is that we’re a fully remote and distributed team based around the world. We believe in working smarter, not harder, and choosing to live and work where we are the happiest and most productive selves, and we’re not afraid to find out where that is. We invite you to join our world class team in giving developers back control over their environments and free them from wasting time with inefficient dev & test loops in the cloud"
year_published = 2025
clearnet = "http://www.localstack.cloud/about"
