["https://localstack.cloud/legal/enterprise-sla"]
title = "Enterprise Service Level Agreement"
full_description = "This “Service Level Agreement” (or “SLA”) is made a part of and incorporated by reference into the Order Form and MSA between LocalStack and Customer.‍ “Downtime” means if Customer is unable to access the Service by means of a web browser and/or API as a result of failure(s) in the Service architecture, as confirmed by LocalStack but excluding Excused Downtime. “Emergency Downtime” means such time as the Service is offline due to a short-term emergency condition. “Maintenance Downtime” means such time as the Service is offline for maintenance or backup purposes, provided that the incident is scheduled with Customer at least twenty-four (24) hours in advance and such notice will be delivered via the Service Status Page (defined below). “Monthly Uptime Percentage” means the total number of minutes in a calendar month minus the number of minutes of Downtime suffered in a calendar month, divided by the total number of minutes in a calendar month. “Service Credit” means the number of days that LocalStack will add to the end of the Term, at no charge to Customer. During the Term, the Service will be operational and available to Customer at least 99.0% of the time in any calendar month (“Service Level Warranty”). If the Monthly Uptime Percentage does not meet the Service Level Warranty in any calendar month, and if Customer meets its obligations under this Agreement, then Customer will be eligible to receive Service Credit as follows: Customer may monitor the Service Monthly Uptime Percentage via LocalStack’s “Service Status Page” located here: https://localstack.statuspage.io/. In order to receive Service Credit, Customer must notify LocalStack within 30 days from the time Customer becomes eligible to receive a Service Credit under the terms of this Agreement. Failure to comply with this requirement will forfeit Customer’s right to receive Service Credit. LocalStack will establish whether a Service Level Warranty failure has occurred and whether any Credit is due in its sole discretion.‍"
year_published = 2025
