title = "Working at LocalStack Stefanie"
description = "Stefanie PlieschneggerStefanie Plieschnegger is a Senior Software Engineer and Squad Lead at Localstack. She is responsible for planning and leading projects, while mentoring and enabling the squad members and help them grow in their current and future roles."
full_description = "Stefanie Plieschnegger is a Senior Software Engineer and Squad Lead at Localstack. She is responsible for planning and leading projects, while mentoring and enabling the squad members and help them grow in their current and future roles. Hi, my name is Stefanie and I love exploring and learning new things in all kind of areas, not only related to tech. At LocalStack I work as a Senior Software Engineer and Squad Lead. In that role I am responsible for planning and leading projects, while mentoring and enabling the squad members and help them grow in their current and future roles. I started my career path into IT at university, when I decided to jump into Business Informatics in my bachelor with no prior tech knowledge, following a master degree in Software Engineering.During my studies I worked part time as an Android Developer in a startup. After I finished my master degree I joined a bigger company where I worked on enterprise workload automation.While the work was interesting, I still missed agility, flexibility, personal growth opportunities and especially the ability to shape and work on new ideas. That's why I joined LocalStack. At LocalStack we have an internal roadmap where we plan our strategic goal for the upcoming months, so more fine-grained quarterly planning of projects is part of my job. On a typical day my work therefore includes some organizational tasks, like: planning, aligning and syncing with people on projects (both async and synchronously) and make sure everyone from the squad is unblocked and can work on their tasks.The rest of the day I would spend working hands-on on the current running projects, and jump on issues that involve me as a code, service, or repository owner.I also dedicate some time for 1:1s with my mentees and squad members on a weekly basis, where we can discuss any challenges they might face, give feedback on their work, explore new project ideas, and help them to succeed in their role. You should definitely apply, especially when you enjoy working with dedicated and extremely smart people on exciting projects.As an engineer you will have the possibility to shape new ideas, projects and the future of LocalStack.Check out our github repos, official docs, YouTube channel, and dev hub samples to get a better understanding on how we are working at LocalStack."
year_published = 2025
clearnet = "https://localstack.cloud/working-at-localstack-stefanie"
