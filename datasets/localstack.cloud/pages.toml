["https://localstack.cloud/working-at-localstack-sannya"]
title = "Working at LocalStack Sannya"
description = "Sannya SingalSannya Singal is a software engineer at Localstack. She focuses on developing and enhancing features that help our users simulate a local AWS environment."
full_description = "Sannya Singal is a software engineer at Localstack. She focuses on developing and enhancing features that help our users simulate a local AWS environment. Hi, I’m Sannya Singal, a software engineer at Localstack. In my role, I focus on developing and enhancing features that help our users simulate a local AWS environment. I’m passionate about cloud technology and enjoy solving complex problems to make development and testing processes more efficient. Before joining Localstack, I worked at LambdaTest as a developer. During my time there, I was involved in building Hyperexecute, a powerful and efficient test execution platform. Prior to that, I contributed to the development of Falcon, a manual testing platform. These experiences equipped me with a strong foundation in test automation and cloud technologies, which I now leverage in my role at Localstack. A typical day for me starts with organisational tasks like planning and aligning tasks for the day. I make sure to reach out and sync, both synchronously and asynchronously, to address any blockers. I always look out for exciting projects to get involved in and engage in various discussions to share ideas.Additionally, I work on service, repo and code ownership and check for any critical issues, ensuring our multi-account and multi-region pipelines are functioning correctly. My day also includes regular check-ins with mentors and squad meetings to discuss our progress and plan our next steps along with working on the roadmap items. If you’re considering applying for a role at Localstack, be prepared for an admirable work culture that thrives on facing new challenges daily.As a member of Localstack, you'll have the opportunity to innovate and influence the development and direction of LocalStack. To learn more about our work, explore our repositories on GitHub, review our official documentation, watch our YouTube videos, and browse the Developer Hub samples and Academy e-course.You’ll encounter exciting problems to solve and will have readily available people to help you. The slack channels here are a great way to highlight and showcase your work, which is highly encouraged and appreciated."
year_published = 2025
