["http://www.localstack.cloud/pricing"]
title = "Pricing"
description = "$35per license, per monthbilled annually"
full_description = "Empowering teams to build, test, and deploy with confidence through lightweight cloud sandboxes and enterprise-grade tooling for fast, reproducible development workflows. “LocalStack has made cloud development easier to test and debug, significantly reducing our development and testing loops by approximately 30%. This enables faster iterations and quicker feature releases and translates to substantial financial savings.” “Our engineering team utilizes LocalStack to provide a complete, localized AWS environment where developers can build, test, profile and debug infrastructure and code ahead of deployment to the cloud.” “LocalStack has been a game changer in terms of development speed and efficiency for our team migrating our monolithic application to a serverless Node.js stack on AWS.” “LocalStack has revolutionized our development process by providing seamless Infrastructure-as-Code validation, rapid resource spin-up, and streamlined testing. It’s an essential component of our development toolkit and has greatly enhanced our team’s agility & efficiency.” “LocalStack has massively decreased the time when the local environment is breaking for our developers. That was a big pain point, and it’s not anymore!” To start a free, 14-day trial we only require your preferred email up front. Please make sure you use an active email as you will be asked to validate your account in order to log-in. When validated, you will be granted a trial of our Teams offering. Either before or when your trial ends, you will be able to add in a credit card to purchase a Starter or Teams plan. If you decide not to purchase LocalStack, you will have access to a limited state of the web app.To access or purchase Enterprise functionality, please submit a contact us form to discuss with our team Every build in a CI environment which spins up the LocalStack container will consume one credit. These credits are shared across all account licenses and replenish every month. For users on Starter, we provide a base of 100 credits for the first three licenses and an additional 20 credits for each additional licenses up to 240 total credits. In Teams, we provide a base of 1000 credits for the first three licenses and additional 200 credits for each additional licenses up to 2400 total credits. There are unlimited CI credits in Enterprise."
year_published = 2025
clearnet = "http://www.localstack.cloud/pricing"
