ity, our products are the point of connection between people and the digital world. We harness the transformative power of design to drive innovation and progress throughout our portfolio in order to deliver truly unique and meaningful experiences. With products available in nearly every country and more than 3.5 million items shipped each week, Logitech is dedicated to driving outcomes that are better for people and planet, reducing our environmental impact by leading the industry in designing for sustainability. @media(min-width: 1025px){ [data-aem-id="masonrytiles-ie0734854a9782fd7e8707dac8939ac62"] .desktop .p0{ grid-template-areas: "A B " "C D " } } @media(min-width: 720px) and (max-width: 1024px){ [data-aem-id="masonrytiles-ie0734854a9782fd7e8707dac8939ac62"] .tablet .p0{ grid-template-areas: "A B " "C D " } } @media(max-width: 719px){ [data-aem-id="masonrytiles-ie0734854a9782fd7e8707dac8939ac62"] .mobile .p0{ grid-template-areas: "A " } [data-aem-id="masonrytiles-ie0734854a9782fd7e8707dac8939ac62"] .mobile .p1{ grid-template-areas: "B " } [data-aem-id="masonrytiles-ie0734854a9782fd7e8707dac8939ac62"] .mobile .p2{ grid-template-areas: "C " } [data-aem-id="masonrytiles-ie0734854a9782fd7e8707dac8939ac62"] .mobile .p3{ grid-template-areas: "D " } } MEET OUR LEADERSHIP TEAM Board of Directors Group Management Team @media(max-width: 719px){#section-i7f4ee594b6890adbda1a3f536c745986-padding-options,[data-aem-id=section-i7f4ee594b6890adbda1a3f536c745986-padding-options]{padding-bottom:10px;}} @media(max-width: 719px){#section-i7f4ee594b6890adbda1a3f536c745986,[data-aem-id=section-i7f4ee594b6890adbda1a3f536c745986]{}} @media(min-width: 1025px){#image_editable-i8b1799002ab33a3b8f60b5a17e227dd0-padding-options, [data-aem-id=image_editable-i8b1799002ab33a3b8f60b5a17e227dd0-padding-options]{padding-bottom:20px;}} @media(min-width: 1025px){#image_editable-i8b1799002ab33a3b8f60b5a17e227dd0,[data-aem-id=image_editable-i8b1799002ab33a3b8f60b5a17e227dd0] {}} @media(min-width: 