) > .pangea-search-results .product-price, :lang(en-ZA) > .pangea-search-results .product-price, :lang(en-QA) > .pangea-search-results .product-price, :lang(en-KW) > .pangea-search-results .product-price, :lang(en-SA) > .pangea-search-results .product-price, :lang(en-AE) > .pangea-search-results .product-price, :lang(en-PH) > .pangea-search-results .product-price, :lang(en-HK) > .pangea-search-results .product-price, :lang(zh-HK) > .pangea-search-results .product-price, :lang(zh-TW) > .pangea-search-results .product-price, :lang(ko-KR) > .pangea-search-results .product-price, :lang(en-IN) > .pangea-search-results .product-price, :lang(zh-CN) > .pangea-search-results .product-price, :lang(en-IE) > .pangea-search-results .product-price, :lang(th-TH) > .pangea-search-results .product-price, :lang(en-AE) > .pangea-search-results .product-price, :lang(en-MY) > .pangea-search-results .product-price, :lang(en-SG) > .pangea-search-results .product-price, :lang(id-ID) > .pangea-search-results .product-price, :lang(vi-VN) > .pangea-search-results .product-price{ display: none !important; } /* https://jira.logitech.com/browse/LOGIWEB-6017 */ /* Price display overrides for comparison chart in non-commerce locales */ /*:lang(el-GR) > .compare-chart .product-price, :lang(ru-RU) > .compare-chart .product-price, :lang(tr-TR) > .compare-chart .product-price, :lang(pt-BR) > .compare-chart .product-price, :lang(es-AR) > .compare-chart .product-price, :lang(es-ROAM) > .compare-chart .product-price, :lang(en-ZA) > .compare-chart .product-price, :lang(en-QA) > .compare-chart .product-price, :lang(en-KW) > .compare-chart .product-price, :lang(en-SA) > .compare-chart .product-price, :lang(en-AE) > .compare-chart .product-price, :lang(en-PH) > .compare-chart .product-price, :lang(en-HK) > .compare-chart .product-price, :lang(zh-HK) > .compare-chart .product-price, :lang(zh-TW) > .compare-chart .product-price, :lang(ko-KR) > .compare-chart .product-price, :lang(en-IN) > .compare-chart .product-price, :lang(zh-CN) > .compare-chart .product-price, :lang(en-IE) > .compare-chart .product-price, :lang(th-TH) > .compare-chart .product-price, :lang(en-AE) > .compare-chart .product-price, :lang(en-MY) > .compare-chart .product-price, :lang(en-SG) > .compare-chart .product-price, :lang(id-ID) > .compare-chart .product-price, :lang(vi-VN) > .compare-chart .product-price{ display: none !important; }*/ /* Hide prices on pages. Uses JS hack */ /*body.hide-prices .price-atc-ctn { display: none !important; }*/ /* Avoid long URLs pushing over the next column in Tech Specs */ /* Remove when LOGIB2B-1813 is complete */ ul.tech-specs ul.specs-description-list, ul.tech-specs ul.dotted { overflow-wrap: anywhere; } /* https://jira.logitech.com/browse/LOGIWEB-6564 */ .pangea-grid-layout .layout-item { display: flex; flex-wrap: wrap; justify-content: var(--halign); } Pangea temporary hotfixes here // JavaScript (function() { function init() { // To make legacy nav change theme when banner carousel changes // no ticket // can be removed once Kepler is released and goes live across the board // const legacyNav = document.querySelector('.primary-nav-container'); // const secondaryNav = document.querySelector('.secondary-nav-container'); // if (legacyNav) { // window.addEventListener('window-update-nav-theme', (e) => { // const themeDesktop = e.detail.desktop === 'theme-light' ? 'theme-dark' : 'theme-light'; // const themeTablet = e.detail.tablet === 'theme-light' ? 'theme-dark' : 'theme-light'; // const themeMobile = e.detail.mobile === 'theme-light' ? 'theme-dark' : 'theme-light'; // legacyNav.setAttribute('data-theme-desktop', themeDesktop); // legacyNav.setAttribute('data-theme-tablet', themeTablet); // legacyNav.setAttribute('data-theme-mobile', themeMobile); // if (secondaryNav) { // secondaryNav.setAttribute('data-theme-desktop', themeDesktop); // secondaryNav.setAttribute('data-theme-tablet', themeTablet); // secondaryNav.setAttribute('data-theme-mobile', themeMobile); //