title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '1163 MINI MIXER The mini mixerthis was initially built without a plan to release. Initially for the Gameboy Megamachine project to mix together certain. modular signals. However due to a number of people asking if it will ever come out as a PCB/PANEL project! well got a few available. Its very very simple, 6 channel inputs with a mute and a level for each input, and a single output. thats it! super super simple.The jacks are connected via molex connectors to reduce the need for a second PCB, which in turn reduces the build complications somewhat.It can be used to mix any voltages, CV, AUDIO, BRAINWAVES, whatever! all the same or different. BILL OF MATERIALS SCHEMATIC View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600246732795-EPQBRMICI57CEI58D7JC/1.jpg" alt="1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600246732673-QNKMI54V4KJ8TBNDD5EN/2.jpg" alt="2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600246738543-CJZFB4VY7GEQ8KQZXSSD/3.jpg" alt="3.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600246738333-KNINUOVCIRBRYYY0Y67G/4.jpg" alt="4.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600246743368-AQPD9416IXQ5FSRQSOQQ/5.jpg" alt="5.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600246743807-EGM8W744ANLYYAMC9WRG/6.jpg" alt="6.jpg" /> #block-yui_3_17_2_1_1600246317512_9851 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1600246317512_9851 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } #block-d67f93833ae4abe3c935 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }'
