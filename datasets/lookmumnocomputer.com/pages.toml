["https://lookmumnocomputer.com/1181-dual-vca"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '1181 DUAL VCA THE 1181. 2xVCA is a dual VCA based on the AS3360 datasheet hereBoth VCA’s are exactly the same. with an in, an out, a CV input plus a Positive offset knob. The Effect The Voltage has on the VCA is shown with the LED. its great for your standard VCA. a ducking module, or whatever really! check out the 1183/1184 Quad VCA mixer for a VCA set that is in a slightly different orientation.PCB/PANEL NOW AVAILABLE View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308515235-OG0BAIL55VV4BXXGY7JY/IMG_3337.jpeg" alt="IMG_3337.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308528607-OWBGA65BB36BUHNJ0Z0R/IMG_3338.jpeg" alt="IMG_3338.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308536690-UM1P5266F61D5GCLE9YO/IMG_3342.jpeg" alt="IMG_3342.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308557193-89LB2D9O7GOPG48BNS0T/IMG_3347.jpeg" alt="IMG_3347.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308556705-Z0Y1DU719FLL2RYL4TXA/IMG_3348.jpeg" alt="IMG_3348.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308572028-L3183KMEO7DVC0BJAH0J/IMG_3349.jpeg" alt="IMG_3349.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308572079-XU1NAPLM74R53TEZDP9W/IMG_3350.jpeg" alt="IMG_3350.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308590170-YU1YSNOUXGXHB44A5Q6Z/IMG_3354.jpeg" alt="IMG_3354.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308590536-27VPA1Q8MTKKXUU4Q3VD/IMG_3353.jpeg" alt="IMG_3353.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308606036-RAZRFJ6GYN368YM39UQF/IMG_3352.jpeg" alt="IMG_3352.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308606263-QXVSBYO68ODAXSMEZIO7/IMG_3351.jpeg" alt="IMG_3351.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585308804434-AO317A0GPKG8GNV8PA9U/IMG_3344.jpeg" alt="IMG_3344.jpeg" /> #block-yui_3_17_2_1_1585307619262_14018 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -5px; } #block-yui_3_17_2_1_1585307619262_14018 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 5px; margin-bottom: 5px; } So this is a simple performance VCA based on the CEM3360 or AS3360 available from places like electric druid and soundtronics . This module has 1 of the 3360 chips in it. meaning you have 2 VCA’s as it is a dual VCA chip. check the schematic below :- View fullsize You’ll notice not a massive amount is going on, mainly the VCA sections. with a couple of mixers and this and that! the right hand side is all the connections going over to the small daughter board in the middle of the module View fullsize This of this as a VCA chunk. the Zener diode stops it from going above the specified range in the datasheet, however i have used it for months without one on it and it hasn’t died yet!!!! so up to you! :D BILL OF MATERIALS UPDATEyou can skip D3 and D4, as they are surplus to requirements. if you already have them in thats fine! but it saves you hunting for zener diodes! Knobs this one takes two of the medium ones here :-https://www.rapidonline.com/sci-rn-113b-line-indicator-control-knob-30mm-32-0110 Above is a builders livestream i did the other week on patreon building a 1181.Im actively updating these pages so keep an eye out! a bill of materials will be available before today is out #block-8ddfc8ebe7ce4f1748e1 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }'
