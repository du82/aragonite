["https://lookmumnocomputer.com/11831184-quad-vca-mixer"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '1183 / 1184 QUAD VCA MIXER This is a quad mixer built on 2 AS3360 dual VCA chips the datasheet is here.Its a different orientation the the 1181 2xVCA. Each channel has an audio input. Audio output, CV in for each channel. A volume for each channel. Which goes off into a mixer section. Also it has the inv switch which effectively acts as an offset to open up the VCA, this is useful if you want to use the channel to duck, like a sidechain. it also has a mute switch with an LED to signal which channels are LIVE.PCB/PANEL NOW AVAILABLE View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585309937555-RGIBHQSXOJIJ04CEPM04/IMG_3358.jpeg" alt="IMG_3358.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585309962776-W0ZZN9I9KYY1N73NS2NY/IMG_3360.jpeg" alt="IMG_3360.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310047543-URWQMJS6ZFC5YBKYM4BQ/IMG_3364.jpeg" alt="IMG_3364.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310085758-9DJ8BH1KDPYKZB1RTLW9/IMG_3365.jpeg" alt="IMG_3365.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585309983032-966QG8USSNXGSO1OJ3HA/IMG_3361.jpeg" alt="IMG_3361.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310117207-MRXB3MJJTEEOT9LZROJJ/IMG_3366.jpeg" alt="IMG_3366.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310004883-HUFIUE8XF8GAITGWU07Q/IMG_3362.jpeg" alt="IMG_3362.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310025847-BDV45D3GI5QNYXBWE3GI/IMG_3363.jpeg" alt="IMG_3363.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310086231-D8G9W8FY6S0MXLZD2EG1/IMG_3364.jpeg" alt="IMG_3364.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310119318-FYYHKXT967PNNWOR3OJ1/IMG_3365.jpeg" alt="IMG_3365.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310136950-5WIXNS1V3UJRVOEFLEEV/IMG_3366.jpeg" alt="IMG_3366.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310160901-TRJ4IC28MB8KF856KW4K/IMG_3340.jpeg" alt="IMG_3340.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310180130-88AW91QADOIN66D58HC8/IMG_3339.jpeg" alt="IMG_3339.jpeg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1585310290370-JAKU0W8TCWO24L2SRZQJ/IMG_3341.jpeg" alt="IMG_3341.jpeg" /> #block-yui_3_17_2_1_1585308856310_24631 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -5px; } #block-yui_3_17_2_1_1585308856310_24631 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 5px; margin-bottom: 5px; } This module is very much the same as the 1181 except 4 instead of 2, and slightly different controls. this is based on 2 AS3360 chips available from electric druid, or soundtronics, be sure to search them up as there may be stockers in your country! View fullsize HI RES SCHEMATIC it uses a very similar circuit to the 1181 which is pictured above. the 1184 has:-- mute switches for each channel, with a light to show you which ones are on or off!- volume for each VCA-seperate outputs and also a mixed output with a master volume, they are not normalled so you can plug them into both and it will not effect each other.-LED to signal what voltages are effecting the VCA’s-Thru knob which basically injects 6V into the circuit to sort of bypass it, but it means if you put in negative CV you can use it as a side chaining VCA for instance BILL OF MATERIALS UPDATEon the MK1 PCB, it has come apparent that the ZENER diodes are surplus to requirements, if you have them in its fine, but if your building this you can skip them. those being D1, D2, D3, D4.Also! d42kn355 has kindly put a BOM on the forum with links to all of the items! link hereKnobs! this takes 5 of the diddy ones here :-https://www.rapidonline.com/sci-rn-117b-arrow-control-knob-23mm-32-0250I am actively updating this page! so keep an eye out. #block-f36cd60d1c4c90926f93 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }'
