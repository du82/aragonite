["https://lookmumnocomputer.com/2001keyboardsequencer"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '2001 KEYBOARD SEQUENCERThis is an updated version of the Keyboard Sequencer DIY project from a couple of years ago, the biggest difference is the fact it is a PCB project in Kosmo format however there are other changes. PCB/PANEL AVAILABLE HERESerge Style Capacitive touch keyboard pads. Initially done this way to save the costs of the builder having to source and purchase arcade buttons which can add more cost to the build, this also reduces the depth of the module, but also makes it easier to play, the responsive nature of the buttons can also be changed in the code. the layout of the electronics connected to the arduino is in a very similar way to the original meaning to update and change the code is relatively easy for people who aren’t well versed in code, there are no multiplexers and other types of electronics.there is an output for the top sequence row and the bottom sequence row. however there is also an output that bounces between the two this means it can also be used as a 16 step sequencer. This means you can get any step length between 1 and 16, but you can also have it as a polyphonic 8 step sequencer. BUT! you can even have both settings at the same time as they are separate outputs.Switches that can send out either gates or triggers meaning you can use it like a “303” style sequencerA Gate output from the capacitive touch keys, this means you can use it like a musical keyboard. BILL OF MATERIALS NOTES on board revision 1. if R58 says 10k, please place a 1k instead. If you have built this and notice in the merge mode the bottom row doesnt seem to work replace R58 with 1k ARDUINO NANO CODE BELOW IS THE LATEST CODE, this is on the eurorack sequencers. But! if you modify the keyboard sequencers from 2021-2024 you can use this code too. it only requires 1 trace cut and jumper cable. this code is quicker and much more stable. :- VERSION 2.2 CODE, WORKS WITH EURORACK 2001 and modified 2001 kosmo format 2021-2024 Experimental Arping Code To use the updated code you need to modify the DIY Kosmo 2001. cut the trace that connects the capacitve resistors to 5v. and then add a jumper where the pink line is, between the resistors and the pin shown which is GND.If loading the code onto the Eurorack version, make sure the bootloader is set to Atmega168 :). <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243080666-BOBH1250LRWBE043J5GI/IMG_2014.jpeg" alt="IMG_2014.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243089843-DA92RL7JZHXGYMRRQ4Y0/IMG_2012.jpeg" alt="IMG_2012.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243127472-TL1KL2V5LEK20MQG5YWV/IMG_2013.jpeg" alt="IMG_2013.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243127422-OP4HGSKJ37SCK6EGQ3J1/IMG_2010.jpeg" alt="IMG_2010.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243169681-9RRLAPS9YN11YZYOBOCT/IMG_2009.jpeg" alt="IMG_2009.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243167809-XCHG7B126EEL5VOOLED1/IMG_2006.jpeg" alt="IMG_2006.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243200404-A7F0B68U295JIP57R672/IMG_2004.jpeg" alt="IMG_2004.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243239044-DXOKQEQOPT083GSHUXYE/IMG_2003.jpeg" alt="IMG_2003.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243242286-ZXJOYV30LTWKA6THD7G3/IMG_1999.jpeg" alt="IMG_1999.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243281358-PU2EJZVVXRHG6QTSEM1H/IMG_1998.jpeg" alt="IMG_1998.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243286599-RGH7AP2A3CP41OZ5RERY/IMG_2001.jpeg" alt="IMG_2001.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243322827-SO05LYAI57M2TTZ93V9Q/IMG_2011.jpeg" alt="IMG_2011.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243323002-WPQYC7RK6K2YHJWETIZ2/IMG_2007.jpeg" alt="IMG_2007.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1628243354277-SMZ889PZT87AE0I7IEM2/IMG_2015.jpeg" alt="IMG_2015.jpeg" /> #block-yui_3_17_2_1_1628242962650_2539 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1628242962650_2539 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } SCHEMATIC DOWNLOAD Learn more'
