["https://lookmumnocomputer.com/1158-vcadsr"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '1158 VCADSRThe next issue of KOSMO module a month (more like kosmo module every 2 months this year but im catching up!) is the 1158 VCADSR, which is the same envelope generator as the 1157 however its also got Control Voltages over all of the parameters, attack, decay, sustain, release, duration and Envelope level. While the 1157 cut down version still serves a purpose as a smaller more cut back version for synthvoices where space is a little tight or you want 2 envelope generators in the space of 1 for a more involved patch well the 1158 adds more function to get the sounds moving and evolving more. Like the 1157 it is based on the very good Electric Druid EngGen8C chip which is a great envelope chip based on the ones in poly synths of old, links to the information on it is available here. Since i started using this chip i have found no need for other alternatives unless its. much more cut back affair that just requires a decay, or an attack decay situation. its a really good chip! it offers looping, and also gated looping. <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081581659-SPPRCGR0588E1W0MWN71/IMG_2572.jpeg" alt="IMG_2572.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081586978-UY02J5JLLN60BQ1K9N2E/IMG_2563.jpeg" alt="IMG_2563.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081590750-NKUTTFX6VN9WVA2T0W9A/IMG_2573.jpeg" alt="IMG_2573.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081600441-5PH1MISFP8VLJY3K5TWZ/IMG_2564.jpeg" alt="IMG_2564.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081600126-XSUFC0X1K0M7EZZ2TTBD/IMG_2570.jpeg" alt="IMG_2570.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081608940-GKRWAQL6DAWGKEIMY27Y/IMG_2569.jpeg" alt="IMG_2569.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081610214-01A8MNLSEERCQEU8IHGS/IMG_2567.jpeg" alt="IMG_2567.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081621468-5L7UAL0HM8I1Q8Q2SPJ8/IMG_2561.jpeg" alt="IMG_2561.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1633081623080-0HE0VQWCWOGKXXHVJKME/IMG_2565.jpeg" alt="IMG_2565.jpeg" /> #block-yui_3_17_2_1_1633081179939_4281 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1633081179939_4281 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } View fullsize SCHEMATIC HIGHER RES DOWNLOAD BILL OF MATERIALS'
