["https://lookmumnocomputer.com/1157-mini-adsr"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '#1157 MINI ADSR MORE TO COME ON THE STORE ON THE 6th OF MARCH View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498438629-UZHR8TRS9TTIX3BM718O/1157+BAVCK+PIC.JPG" alt="1157 BAVCK PIC.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498415971-9ZTGI2R0CFZUXDO7A9KV/P1022040.JPG" alt="P1022040.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498415788-A85QWCIJ62U7ISJ2AYG1/P1022039.JPG" alt="P1022039.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498422972-44ZZHSESDOV8JD38VYNB/P1022038.JPG" alt="P1022038.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498424237-ZYBETT9BYWGSORRJ71VF/P1022037.JPG" alt="P1022037.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498434884-BJMF2P04UPYJ1A7CI8HG/P1022036.JPG" alt="P1022036.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498446746-VTORLEAD216P3M3OQXNJ/1157+BOARD+CLOSE+UP.JPG" alt="1157 BOARD CLOSE UP.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498451402-IB5ALJDYZQQ3Q8GIT4A3/1157+BOARD+PIC.JPG" alt="1157 BOARD PIC.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498455586-M7ZNXRQBXY7BGV89UYRL/1157+CHIP+PIC.JPG" alt="1157 CHIP PIC.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1583498943539-E8N0EVNJ19K7M67YL87C/1157+MAIN+PIC.jpg" alt="1157 MAIN PIC.jpg" /> #block-yui_3_17_2_1_1583408304492_18305 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -4px; } #block-yui_3_17_2_1_1583408304492_18305 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 4px; margin-bottom: 4px; } View fullsize above is the schematic of the module. as you can see its pretty simple! you can get away with not bothering with any of the 100nf decoupling capacitors! i have put a line through them on the board so you have the choice to add them or not! i have noticed zero difference, its an envelope generator not a nuclear reactor tester so if your short on caps it will be fine! :)I have been using this module since October last year and it hasn’t let me down yet. information on the envgen8C electric druid chip can be found here https://electricdruid.net/product/envgen8/This module was made because i already had the design sitting around from the gameboy megamachine polyphonic envelope generator, and this made sense to use to replace the un reliable ones i had in my touring rig which were old Music from outer space DUAL AD/AR’s these do the job plus a few more things. they fire out a hefty 8 volts so nice and chunky and also am inverted output.Its a very simple module! mainly based on the Datasheet Schematic over on the electric druid website so nothing revolutionary here! just very functional. it can also loop like an lfo :) #block-ff2edf3d9a16d73bbcac .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; } here is a simplified version. you can go even simpler if you want. like removing the circuit between the input jack and the chip. just watch out on your voltages! you run the risk of popping it if your trigger is too high. but hey! best of luck BILL OF MATERIALS Constantly updating forum Bill of materials hereKNOBS :- https://www.rapidonline.com/sci-rn-117b-arrow-control-knob-23mm-32-0250 There is a forum page dedicated to this module right here.however this page is good for looking for components in your country, here.Josh has put together a good US bill of materials here FAQ.I cant find an SPDT (on) off on switch! not to fear. check the forum posts above maybe someone has found one in your area. first of all lets figure out what it means. on off on means you have a switch you flick on way it turns on, in the middle its off and you flick it the other way its on again on different poles. when there is a bracket around the on, this means it only stays on when your finger is on it, this is called a momentary switch, usually you find them as (on) off (on) however i use a funky one in this design which is half way between both. Why? well its because if i flick the switch down it is momentary, which momentarily triggers the envelope generator, however if i flick it up the switch latches, latching the envelopge generator on, which means it can stay on so you twist the sustain it becomes a set voltage.You have a couple of options here. you can use an completely momentary switch and it will work just fine! infact it has a good function, an (on) off (on) switch will mean you can momentarily trigger the envelope on the up and the down meaning you can rapidly trigger it with your fingers. So if you can only find (on) off (on) switches not to fear! just use that :).LIKE ALL OTHER MODULES! always put potentiometers and switches etc into the pcb then screw them into the panel. THEN solder. this way you know it is all aligned :)'
