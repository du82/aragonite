["https://lookmumnocomputer.com/bio"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "About Hi my name is Sam Battle, Look Mum No Computer for short. Based in Kent, England, favorite food is beans on toast.LMNC started back in April 2016, initially as a name for a ZINE, about my un avoidable dodgy creative side, but quite quickly became something completely different, When i decided to get the video camera out. I've been a musician all my life, in various bands, ZIBRA, being the most recent one.Now i mainly build musical machines and make music with them! I tour quite a lot, check my homepage for tour dates, i take my synths along for the ride. I have no training in electronics, and about a year and a half of music at uni, so i wouldn’t trust anything i say because i don’t really know anything in an academic sort of sense, think of me more as a backyard engineer. #REFLECTIONINACTION.I also write and produce for other artists here and there. below are a couple i co wrote and produced and some co writes #block-367e07e521e4a69fcc15 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }"
