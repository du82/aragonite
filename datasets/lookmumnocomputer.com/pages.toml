["https://lookmumnocomputer.com/4051-plexquencer"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "4051 PLEXQUENCER The Multiplexing Sequencer, basically an 8 step sequencer. but instead of a clock input, it is a binary input.uses :- -control voltage sequencer that can be either in sequencer, out of sequencer or chaotic, depending what you plug into its 3 binay inputs.-Wavetable oscillator you can merge up to 3 audio rate oscillators together to make a separate wavetable oscillator based on the input of the 3 oscillators for a trippy sound./-Trigget oscillator, simultaneously to the sequencer is has 2 gate outputs, each channel you can flick between gate 1 out, gate off or gate 2 out. -In gate you can mess with the and gate that can turn it into a trigger, this makes weird ratchetting effects depending what you send into it.-Voltage input, this overtakes the stationary voltage fgoing into the multiplexer, which then can make it act as either a scaled output of the input, or you can use it to send an lfo to either the voltage output or either of the gate outputs, meaning it is a 3 output distributor. im sure there are more functions but that is what i have found it can do so far. GET THE PCB AND PANEL CLICK HERE it is based on the sequencer i made for the video below. :——— Download the BILL OF MATERIALS HERE :- 4051 BILL OF MATERIALS #block-d067bec38bd8f0125861 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }"
