["https://lookmumnocomputer.com/modular"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '''Building your own modular synth A couple of cabinets of my modular, chilling out with a plant in the photographers gallery at oxford street, London. 2017 Hello! so this is KOSMO well an early iteration, and you’ll be pleased to know this year (2020) i am releasing 1 pcb/panel project each month. The initial reasoning for this was to increase the reliability of my touring modular rig, however an offshoot of that is i have gone and designed fully fledged products, so may as well pop em up on the shop for people interested!WHY KOSMO FORMATI see kosmo format as a middle ground that makes sense to me, if you dont like having small and fiddly eurorack, this is the next step up, with big robust big jacks, its made to be performed. Inspired by the simplicity of finding 20cm panels. Its Actually cheap and easy to build. You could get a filter built for £40 including the pcb/panel.KOSMO FORMATyes all these designs are actually in their own format, i call it the kosmo format but it has also been called metric 5U in the past, but it is completely compatible with eurorack, it even uses the same power connectors, and here is the criteria :--20cm tall panels widths of 2.5cm/5cm/10cm/20cm/40cm/60cm/80cm-BIG jacks- allowance for 10mm top and bottom for rails, which will usually be inexpensive wooden rails, mounted with small wood screws. however the mounting holes are for M3 bolt sizes.- To ease the build and intergration with other systems it adheres to the eurorack power connector and voltage standard of -12v GND +12v-1v/octave, v trig-specifically for all projects and modules i will be offering, they will be of similar style, and the front panels are like a lot of eurorack modules made from the same material as pcb’s the reasoning for this being black metal panels are less hard wearing and these synths are made to be gigged, pcb material with black masks are very hard wearing, it is cheaper which keep kit costs down, as the size is larger. In the future there will be circuits on the front panel aswell, which for obvious reasons you cannot do on metal panels.If anyone else wants to make any designs or module products in kosmo format please by all means do so! If you do i will happily promote it either on this site or on my youtube, as i think kosmo format is basically the big jack “more useable” version of eurorack. This zine specifically covers a lot of questions i get. how to make a modular synth on the cheap! there are more zines on my patreon :- ZINE NO 6 MODULAR ON THE CHEAP Hopefully this will aid you in your journey!READERS BUILDSbelow are some builds of kosmo format synths from around the world! if you have any, send us a pic and ill include it here. Image of Damien S Fears modular project in the kosmo format above! Hes using minijacks to work with his arturia minibrute. Heres another pic of Damiens synth, its looking good so far! with an arduino 16 step sequencer. which is a project currently on my patreon but will be available soon! but if you can work it out its just a slight change in code to the keyboard sequencer on the projects page This was made by Michael Hoby https://m.soundcloud.com/michaelmundai , made to the kosmo format! looks proper neat, with the tolex on the outside of the case. it looks like he's put together the keyboard sequencer and the safety valve projects in my projects section. another great cabinet by dud! :- CABINET 1 by Dud. more info in the link below :- Above is dud’s double cabinets! more info on this build at the link below:- https://soundbender36.wordpress.com/sommaire-synthetiseur-modulaire-diy/PCB’sim starting to make PCB’s of the synth modules. i only have 1 out right now but that will be changing thick and fast check out Josh Rodriquez’s ongoing kosmo project!!!! PERFORMANCE FILTER PANEL/PCB VC LFO PANEL/PCB Below are creations by christian Pearen, Canada. Also a Link to soundcloud View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131109870-F9A80P588DCS5PCL9MLH/81517945_774396036396308_2174136024605655040_n.jpg" alt="81517945_774396036396308_2174136024605655040_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131109859-X6NZTWHZTFUUP47VFIW4/80883969_604503047043578_8035528994977742848_n.jpg" alt="80883969_604503047043578_8035528994977742848_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131110393-DACV3S64IV3EQBJMYEI3/81920919_1288606611340002_2317242780130213888_n.jpg" alt="81920919_1288606611340002_2317242780130213888_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131110560-MS4TIZ9AY8EO2GDF0F1R/81186823_613644066054879_4799196224622166016_n.jpg" alt="81186823_613644066054879_4799196224622166016_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131110950-FRR2TJ9LBHJSTWWLLOYX/81746022_1012317712439297_8628370477670203392_n.jpg" alt="81746022_1012317712439297_8628370477670203392_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131110983-V04FES4RD9S6TJN9WA42/81024013_1395721863967336_3501641971200425984_n.jpg" alt="81024013_1395721863967336_3501641971200425984_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131111582-1Z0XUXV55UP10NHVWXG1/81653115_596774207560647_2210629000215134208_n.jpg" alt="81653115_596774207560647_2210629000215134208_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131111675-9DEYMV3XYW7A627JML0W/81037495_563929627497270_9148236458799136768_n.jpg" alt="81037495_563929627497270_9148236458799136768_n.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1578131112134-ZKJBER4W97LP7QRNKD0S/82248503_23900245113279