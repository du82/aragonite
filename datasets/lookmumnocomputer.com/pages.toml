full_description = '#1114 FILTER/CLIPPER/VCASo this is a right weirdo!!!! This was made throughout a number of patreon builders livestreams last month looking into the LM13700 chip as i needed to do so for a number of upcoming projects. I began with the datasheet lowpass filter and went from there until i found some very funky sounds indeed. and i have to say it is pretty cool! and it actually is quite full of charater, you can even get it to step and stuff its proper odd. <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604071780951-EC1S68C4NFSUCRN8IDBV/6.JPG" alt="6.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604071782191-T91N5YLNB9P8WU5K2SKI/5.JPG" alt="5.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604071793150-AIJAWP7IJ6P67ONNAV3H/2.jpg" alt="2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604071801358-SWZWW5ECOGKMD6S8C5QG/1.jpg" alt="1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604071822040-A7D115MA7BHDD3BKC00K/4.JPG" alt="4.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604071816144-QB68PM7R98Y19W8I7YYV/3.jpg" alt="3.jpg" /> #block-yui_3_17_2_1_1604071713747_4253 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1604071713747_4253 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } BILL OF MATERIALS BUILD FORUM THREAD STORE'
