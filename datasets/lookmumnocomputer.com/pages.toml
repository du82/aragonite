["https://lookmumnocomputer.com/fart-box"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "About i made a small amount of pcb’s for this project for my november 2019 tour, sadly i wont be doing any more but there is nothing stopping you from having a bash at the kicad file below!FOR PEOPLE WHO HAVE BOUGHT THE PCB ON TOUR :- Learn more BILL OF MATERIALS the above bill of materials is from todd entriken, however the parta are rather self explanatory from the labelling on the pcb. also check the FORUM on peoples builds over here.things to note. the top potentiometer is 5k. and the bottom two are 1M and the rest are 100K. LINEARremember there isn’t much documentation for this! so proceed with caution!!!DRILL GUIDE AND EXTRA REFERENCES AVAILABLE HERE THE ENCLOSURE I USE, But you can use any! is the HAMMOND 1550 https://www.rapidonline.com/hammond-1550jbk-ip54-diecast-aluminium-enclosure-black-275-x-175-x-67mm-30-4376as for the 12v AC AC power any will work! it needs to be AC AC not AC DC though something like this :-https://www.ebay.co.uk/itm/12V-AC-AC-Replacement-Adaptor-Power-Supply-TDC-Power-20VA-For-Model-DB-20-12/173811821119?hash=item2877fdea3f:g:D8AAAOSwn2pcaxttREGARDING THE BUTTON CONNECTIONS:-as your looking at the pcb from the front, from the top to bottom the pins on that connector go :- 1 Trigger in,2 12v, 3 LED, 4 GND. so you solder the 12v and the trigger in to either side of the push switch, then LED and GND to the plus and minus of the signal LED. View fullsize FAQCan i power the fart box with my eurorack power supply?YESYou can just skip a few components on the fart box as it has a built in power filterNo need to solder in :-D9D10D11D12D13D14U8U9C17C18The above are the components you won’t need if your powering it from the Eurorack. You can still put them in, it will work either waySolder the eurorack +12v to the positive leg of C4Solder the eurorack -12v to the negative leg of C5Solder GND to the negative leg of C4That will make it powered by the eurorack power #block-36619c89de7a941d63f9 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }"
