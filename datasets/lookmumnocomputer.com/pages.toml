title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '5000 SERIES KOSMO MINI’s KOSMO MINI RANGE IN STORE CLICK HERE 5000 series KOSMO MINI’sThese are small prototyping aiders. Designed to be placed on grids, either screwed down or put on items for easily interchangeable prototyping. it even fits on LEGO® Bricks. The Breadboard mount boards are designed to be used in conjunction with standard MB-102 type breadboards which have adhesive on the back of them, all you do is remove the adhesive protection and stick the breadboard onto the mounting board and hey presto! it is now easily mountable. here is a link to the breadboards in question, notice the RED and BLUE strips dont have a break in them in the middle, personally these are preferable because the power runs down the whole breadboard. if the stripes stop in the middle of the breadboard then the power doesnt run down the whole breadboard. The first in this series is the 5010 BREADBOARD HELPER. 5010 EURORACK POWER CONNECTOR BOM <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600247611896-4CWA49VTYD41KL2DCUOJ/WhatsApp+Image+2020-09-16+at+10.08.48.jpeg" alt="WhatsApp Image 2020-09-16 at 10.08.48.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600247611500-WTQI2T92HQO3EEVJGC63/WhatsApp+Image+2020-09-16+at+09.53.09.jpeg" alt="WhatsApp Image 2020-09-16 at 09.53.09.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600247613143-HCV9E15EOE35E3SPK730/WhatsApp+Image+2020-09-16+at+09.52.59.jpeg" alt="WhatsApp Image 2020-09-16 at 09.52.59.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1600247613511-TC4A63Q6UE4B50XHULSZ/WhatsApp+Image+2020-09-16+at+09.52.45.jpeg" alt="WhatsApp Image 2020-09-16 at 09.52.45.jpeg" /> #block-yui_3_17_2_1_1600247237246_10242 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1600247237246_10242 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072675600-SPX8SOPVQF1RQ29KTJS9/P1066512.JPG" alt="P1066512.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072677602-225T4QDRKDH95MXT9AF0/P1066510.JPG" alt="P1066510.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072710978-04LJSULYM75OYQ9V3QIY/P1066509.JPG" alt="P1066509.JPG" /> #block-yui_3_17_2_1_1604071713747_27108 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1604071713747_27108 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Bill of material for the above 5012 jack board is nice and simple!3 x 2x6 Female pin headers like this these snap into chunks, so for instance these 2x12 pin headers can snap into 2 2x6 headers hereand it takes these types jack sockets because they are low down and are nice and rigid. here <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072579869-9455C2AQBSPY3AVKRATG/3.JPG" alt="3.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072586385-K2S2VYPJ1H4UEMSCP67W/2.JPG" alt="2.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072611030-BC8TTLXHHYEBIGFFWHHG/1.JPG" alt="1.JPG" /> #block-yui_3_17_2_1_1604071713747_22737 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1604071713747_22737 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Bill of material for the 5013 potentiometer board is below :-3 x 2x6 Female pin headers like this these snap into chunks, so for instance these 2x12 pin headers can snap into 2 2x6 headers here3 potentiometers any value! 