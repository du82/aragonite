title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "FIDGET SPINNERS Ok ok ok ok ok. yes they are so fadded up its insane. I was reluctant to get some, but when i did, i flipped into a fidget spinneraholic. however thankfully all the fidget spinners i own are now on a piece of equipment! phew.To date ive done two different fidget spinner projects heres an outline of them. This is the fidget spinner guitar synth thing. It was talked about a few times people mentioned, either magnets, or guitar pickups and stuff. so needed to give it a go, if i didn't i wouldn't have know how awesome of a race car sound it makes. Its simply an old guitar, with a hole drilled in it, an M8 bolt holding a fidget spinner in place with a handful of washers. SIMPLE. This was my first attempt, a few days before. Its a very simple idea yet again, the fidget spinner is glued to the front of the metal panel. then underneath the legs is a LIGHT DEPENDENT RESISTOR (LDR). this then gets obscured by the fidget spinner, blocking light to the LDR, the LDR is wired between two jacks. super simple, one jack socket, wired to one leg of the LDR, and the other leg of the LDR to the other jack socket, it doesn't matter which way around. then simply connect both grounds of the jack sockets together and its done!!! its kinda cool. but its a bit naff. #block-455d7621c73a1fd44709 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }"
