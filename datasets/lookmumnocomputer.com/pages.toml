["https://lookmumnocomputer.com/2001sequencer"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '2001 PERFORMANCE SEQUENCER The Kosmo 2001 Performance Keyboard Sequencer has now been faithfully recreated and improved for eurorack!It is a dual 8 step sequencer which can simultaneously be a 16 step sequencer also. Can be clocked to go forwards and backwards, even at the same time, and even at audio rate! (if you wanted to use it as a wavetable oscillator, dual wavetable output even!) it has a trigger/gate switch per step and most importantly a high note priority touch pad per step! which can either be played as a keyboard! or a step pauser/setter or all at the same time!.you can find the very similar schematic and code etc of its bigger brother here on the 2001 keyboard sequencer page . the code is available on that page under keyboar sequencer code V2.2 by all means download it and mess around with the code! make the eurorack one do whatever you want! <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1727943914855-LFDDYNNV1LZTXCGSV16K/2001+Picture+1.png" alt="2001 Picture 1.png" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1727943918860-3UBN395FD0RX0Y99RJ6X/2001+Picture+3.png" alt="2001 Picture 3.png" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1727943928914-F0BN90LNWFS09U8286VW/2001+Picture+2.png" alt="2001 Picture 2.png" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1727943909557-8M9SHD9AAYBYFI3ZEE8J/2001+Picture+4.png" alt="2001 Picture 4.png" /> #block-yui_3_17_2_1_1727943736755_3760 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1727943736755_3760 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Assembled by hack modular. LMNC video to come! but here is a video by hack modular also :- *We have tested this module with as many eurorack power supply and cases as we can. It works well with what we have tested including switching power supplies and AC wall wart types. To make the pads work the best make sure you have a clean solid ground connection on your power supply, in nearly all cases and power supply setups it works perfectly. Consumption + 12v 80ma -12v 20ma.48HP width.comes with eurorack power connector and mounting screws.'
