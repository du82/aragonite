title = "STUFF - LOOK MUM NO COMPUTER"
full_description = 'The 1153 BOUNCE BOUNCE BOUNCE BOUNCE BOUNCE BOUNCE BOUNCE is an enevelope generator module with a difference, instead of your usual ADSR mallarky this replicated the bouncing ball simulator patch on old analog computers. Why the heck is that useful you ask? well!!! its actually pretty awesome, making bounces of voltages in varying waveforms that slowly succumb to gravity. It is based on the one shot chip by electric druid here.PCB, Panel and chip bundle for the 1153 Bounce is available here.It has variable Bounce waveforms, Bounce rate, Bounce delay and the amount of bounce repeats, all controllable over CV!For more info on the build check out the forum page on the 1153 BOUNCE BOUNCE BOUNCE BOUNCE BOUNCE BOUNCE BOUNCEHere is a video i shared of a prototype on patreon a month back :- <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1608204221446-9RHBFN5DKFQNRQWHZ0MY/WhatsApp+Image+2020-12-17+at+11.17.38.jpeg" alt="WhatsApp Image 2020-12-17 at 11.17.38.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1608204222269-9406JIFL9FI19E568HPM/WhatsApp+Image+2020-12-17+at+11.17.33.jpeg" alt="WhatsApp Image 2020-12-17 at 11.17.33.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1608204225141-JEZ9M4CJSHNTUCZN167Q/WhatsApp+Image+2020-12-17+at+11.17.17.jpeg" alt="WhatsApp Image 2020-12-17 at 11.17.17.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1608204225289-ESC5WZVGAA74252G6OYE/WhatsApp+Image+2020-12-17+at+11.17.45.jpeg" alt="WhatsApp Image 2020-12-17 at 11.17.45.jpeg" /> #block-yui_3_17_2_1_1608204035943_6094 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1608204035943_6094 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } BOM (list of components) SCHEMATIC HI RES FORUM PAGE'
