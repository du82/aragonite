title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "MUSIC GEAR/TOOLS/COMPONENTS I USE FOR PROJECTS Here are some components i use. First off this is the large project enclosures i tend to use, they are a tad pricy but are finished in powdercoat and incredibly useful for any project! click here for the hammond 1550.Here is the solder i use, i used to always use lead solder but found this Lead free solder very easy to work with, and low melting and adhesion temperature click here for the solder.These are the potentiometers i use, they are amazing, they are big! but easy to solder and feel absolutely solid, i have not found a modern potentiometer that beats it on quality, feel, price and ease of use click here for 10k linear. Click here for 100k Linear. Click here for 1M Linear. These miniature toggle switches are the best in my opinion with lots of options, for instance this one is (on)-off-(on) which means it is momentary on both up and down, good for selection switches. This one is just an on off version. and this one is on-off-on which means it will latch up or down with an off inbetween.A good solid chunk of stripboard! i buy these a few at a time because they are easy to snap down to smaller sizes if need be.These are the BIG SILVER KNOBS I USESmall knobs Click hereMedium Knobs Click HereGood solid Jack Sockets! Click HEreBelow Is Good single core hookup wire in all of the colours! i used this in all of the projects as single core is easy to use and solder and keeps its form when wiring to panels.Purple Click HereGrey Click HereYellow Click HereBlue Click HEreWhite Click HerePink Click HereOrange Click HEreBlack Click HereGreen Click HereRed Click Here Cick On This Grey Box For Musical Gear List Over At Thomann ARDUINO NANO’s This i find now adays is the best way of getting them, good quality knock off’s that work well. These are the best multi voltage/multi use adapters i have found. I have a load of them they are good because aswell as having a decent standard output that can output plenty of current it also has a usb power socket on it’s side, its used in the organ build and anything that takes 5-18v, this has been my go to adapter The soldering iron i am using at the minute is the Hakko FX-951 this is the most reasonably priced listing i could find of the item, which is where i got it from. so far its been really good, and solid, and takes multiple solder tips. I also use the TS100 style of soldering iron, i have ordered this soldering iron from this listing a couple of times, each one lasted me at least 2 years of daily use. they are really good, and i still use for PCB/stripboard soldering. The Beatstep Pro Limited edition in black is surprisingly hard to find now adays, but here is a link to one. The best and most reasonably priced cables i have found to plug eurorack or beat step pro’s into big jack items like korg ms20’s or kosmo format modular synthesizers Actually good quality, nice colours too, a range of sizes, i use them for power connectors for my synths, also plugging my mixer into the synthesizer"
