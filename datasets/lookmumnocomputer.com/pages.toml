["https://lookmumnocomputer.com/sequencer-keyboard"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "ARDUINO 8 STEP SEQUENCER KEYBOARD ARDUINO 8 STEP SEQUENCER KEYBOARD Since the start of building modular synths, ive always been looking for an arduino powered sequencer. but never really happy with the projects that were about. because it was still menu dives and button combinations. which is not what you wanna be messing about with! you may aswell use a computer and a mouse ha.I wrote this a few years back, and it does exist in a few other variations like a clock skip sequencer, aswell as one that is sort of like the intellijel metropolis. and also a 16 step and a 64 step on an arduino mega! but one day i will share these!! the 16 step code actually comes with a zine on my patreon! so check that out. CODE DOWNLOAD REMEMBER TO SOLDER THE RED WIRES TO THE ARDUINOS 5V PIN. AND THE GREEN WIRES TO THE GROUND PINS! it wont work otherwise. sorry if that is not clear in the images above.MATERIALS. right you can get them from elsewhere but if your in UK, this is your lucky day! cus heres the links.:-16 x 100k potentiometer HERE14 x Jack sockets HERE8 x PUSH BUTTONS HERE1 x ARDUINO NANO HERE1x STRIPBOARD HERE35 x 1N4148 DIODES HERE18 x 1K resistor HERE (in the link is a pack of 100, dont guy buying 16 of these lol)12 x 10K resistor HERE8 LED's HERE (linked are super brights, but you can use whatever, have a look at the different ones :) )2 x SPST (on) OFF (on) switches HERE (when (on) is in brackets it means they are momentary, they dont latch on, they only turn on when you push them, they are like a sideways push button!)1 x 78L05 HEREPANEL i get it cut to size here, its just cheap and easy, i use 20x40 and 2mm thick. HEREM3 screws HERE (one for mounting, this is a pack of 100 soz)M3 Standoff for mounting the stripboard! HEREIC SOCKET FOR THE NANO HERE (this one is 2 pins too big, but youll figure it out!)AND DONT FORGET WIRE! i use this stuff HERE HI RES IMAGE DOWNLOAD This is true. if you want to skip all them 10k resistors! i challenge you to figure this out! it will be a case of swapping all the HIGHS, and LOWS......Also this raises stuff about the diodes! all of the diodes attached to the jacks, dont need to be there. they are there just incase sometimes you plug it into stuff that it dont play nice with. or the switches may trigger things they arent supposed to. if you aint bothered, you dont have to bother with them! They are just rudimentary circuit conditioning. jeremy weinstock sent this pic in of his. its looking pretty sweet! #block-fd250b8c27829fd96669 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }"
