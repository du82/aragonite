["https://lookmumnocomputer.com/beerhelmetinstrument"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = 'MUSICAL BEER HELMET This is the musical beer helmet! its a very simple project!all you need is an arduino nano, a 9v battery, either a speaker or a jack cable and a pressure sensor.To make this all i did was connect the pressure sensor to the arduino with 4 wires (as it says in the how to here https://learn.adafruit.com/adafruit-mprls-ported-pressure-sensor-breakout)these connections are :-\SCL PIN to the arduino nanos A5SDA PIN to the arduino nanos A4VIN PIN to the 5v pin on the arduino nanoGND pin to GND on the arduino nanothen attach your 9v battery pack RED WIRE to VIN on arduino nano, and BLACK WIRE to GND on arduino nanothen wire either a speaker or a jack socket to pin D9 on arduino nano, and the -ve to GND on the arduino nanoYOUR DONE. now go to the adafruit link above, and download and install the sensor library for the code to workthen install this code :- BEER HELMET SYNTH CODE basically the way this synth works is you blow into it, and the air gets split down to the two cans, one end the air is just expelled, and the other side it goes directly to the pressure sensor, this means when your blowing it feels like a natural instrument instead of just being blocked. #block-f4ea407bbc2bf8983ef6 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }'
