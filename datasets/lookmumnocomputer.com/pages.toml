title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "2000 MEGADRONE MODULE I HAVE A FEW PACKS OF 10 BSTOCKS STILL IF ANYONE WANTS A REDUCED PACK OF 10 PCB/PANEL please fire us a message on the contact form! :) This page is to cover the build of the #2000 mega drone module which was designed for the 1000 oscillator megadrone project.It is a bank of 10 super simple style oscillators with a simple tone control and a rather lofi CV control. it can be powered by a normal 12v DC power supply the type that comes with many other electronic appliances. but it can also be powered by modular synth power supplies too! it has footprints on the PCB for either a 12v barrel jack socket or a eurorack style power socket. The pcb/panel set is HUGE. its much larger than a eurorack panel so looks may deceive! its laid out in kosmo format measuring 20cm tall and 40cm wide, however it can easily be put in its own little box as it doesn’t need a synth power supply (but as mentioned above it can be powered by one if you wanted to!)Below is the first video on the Megadrone which touches on a single one of these modules. The schematic for the #2000 super simple oscillator. i kept all the idiosyncrasies of the circuit from the 100 oscillator megadrone from a few years back and added LOFI cv control and volume knobs to each of the oscillators. the best transistor for the job and recommended is the SS9018, and for the mosfet the P16NF06.The output is very low. this was so it could all be mixed together happily and passively. so multiple modules can be mixed together passive, also plenty of headroom going into the mixer as this was a place where distortion was rather prevalent. It hasnt changed massively since the 100 oscillator megadrone as i wanted to keep the character.you’ll notice in the 1000 oscillator finished video the audio is rather clipping, this is nothing to do with the circuit above. and if you keep an eye on the headroom it can be nice and clean! HI RES SCHEMATIC BILL OF MATERIALS BUILD FORUM i will be updating this page as the week progresses including a video of building it which i am currently editing, there is a forum page dedicated to this build here. #block-fb9b40f06b47d9f4aae6 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }"
