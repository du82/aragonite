["https://lookmumnocomputer.com/1008miditotrig"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '''#1008 MIDI TO TRIGGER Designed as a more compact replacement to the midi to trigger module in the kosmo synthesizer, this squeezes 18 trigger outputs into a 10cm wide module, with 2 midi thru connections. it is based on an arduino nano on the back and some code can be modified to send start stop commands and midi clocks if you don’t need all 18 trigger outputs. All outputs can be assigned to anything be it note outputs or program changes, it all relies on what you put into the code. also there is a tiny white square at the bottom for you to write what midi channel it is assigned to. Its a similar assembly process to the MIDIMUSO module. PCB/PANEL's available click here CODE/SCHEMATIC/BUILD VIDEO COMING WITHIN THE NEXT COUPLE OF DAYS. Below you can download the arduino code for this project, you can modify it so any of the trigger outputs can respond to any midi note, on any midi channel, the outputs do not even need to be on the same midi channels. You could also modify the code how you wish for instance to send midi clock commands or start stop messages if you were so inclined. DOWNLOAD THE MIDI CODE 1008 BILL OF MATERIALS <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1685609107336-5LJSLFFROYNUPP50ZV9S/IMG_2528.jpg" alt="IMG_2528.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1685609106722-QVRELNJWG5MZ8K7TP2CQ/IMG_2533.jpg" alt="IMG_2533.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1685609124616-7O4LAAE8SEDBW2K0GREE/IMG_2537.jpg" alt="IMG_2537.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1685609127868-6WYRK9J18C66LMNXJOTJ/IMG_2529.jpg" alt="IMG_2529.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1685609145148-MWXU533MJ4KHG8YT0XEG/IMG_2536.jpg" alt="IMG_2536.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dba