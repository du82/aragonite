["https://lookmumnocomputer.com/1171-oba"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = '#1171 OFFSET BOOST ATTENUVERTThis module came from the power glove project where i needed to offset the signal coming from the signal and boost it. i figured id make it more funky. so you can plug in 2 signals into it. 1 going in none inverted, then another input is inverted but beyond the offset. then you can boost it up to 10 times its original level (unless it goes over 12v then it will clip off) then the signal gets split off to 2 seperate attenuverters giving you 2 different seperate outputs that are related but can be as different as you want them to be.Uses :- no idea! im joking its quite useful for a lot of things. for instance you can use it to deal with annoying things with sensors going into a modular, you can use it to boost a guitar or a piezo mic going into the modular, you can use it to change up waveforms and merge them in funky ways from LFO’s or oscillators. you can use it as a distortion module, you can use it to make filters sound different by offsetting the osillators going in. i dont know there are plenty of uses!!! definitely a funky and useful thing. <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072090593-DLRQU4ZVYBANH79TZFIN/2.JPG" alt="2.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072090225-044G7Z0ZSD895YXVBEUR/P1066494.JPG" alt="P1066494.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072098133-K2HCE2XMQHUX84NHA1HI/1.jpg" alt="1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1604072101700-VO5MQLLRVCSMFA2GWIOO/3.jpg" alt="3.jpg" /> #block-yui_3_17_2_1_1604071713747_12514 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1604071713747_12514 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } BILL OF MATERIALS BUILD FORUM THREAD STORE the trimpots are used to fine tune the centre of the attenuverters. So if you find completely attenuated is not exactly central, adjust the trimpots until it is! :). there is 1 trimpot for each attenuverter.'
