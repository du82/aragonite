full_description = 'SYNTH VOICE #2221 CROSFOBERMORDULATOR 2221 CROSFOBERMORDULATOR PANEL AND PCB NOW AVAILABLE IN THE STORE HEREThe Crosfobermordulator is a full synth voice in kosmo format, it was built after sharing a DIY how to video of making a DIY synth voice on breadboard link here, i took that design and i built on it a tad, to make a cross modulating funky synth voice with its own funky quirks, its not a do all synth voice! but it sure is funky. with 2 oscillators (one primary oscillator and a modulation oscillator that can also be a second oscillator, or even both at the same time, 1 low pass funky distorting harmonic filter, noise, 2 envelope generators and a voltage controlled depth of modulation which really opens up to some funky sounds!BILL OF MATERIAL/SCHEMATIC/MORE INFO COMING ASAP! BILL OF MATERIALS <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1709891358089-OHOI6QZSFFAF9OMBGDOW/2221+6.jpg" alt="2221 6.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1709891358105-ONQMRAABOZXMNSUU6612/2221+5.jpg" alt="2221 5.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1709891362820-G2SPGZA2LBPU4TIKRJYN/2221+4.jpg" alt="2221 4.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1709891363140-0DO12DZP8HJ6KHJ4BGXF/2221+3.jpg" alt="2221 3.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1709891368231-YH9ADO94MJIGANE8538S/2221+2.jpg" alt="2221 2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5912db7ee6f2e1435dbab4fd/1709891367898-D86ASHEF4O9VO2DLRHJZ/2221+1.jpg" alt="2221 1.jpg" /> #block-yui_3_17_2_1_1709890990467_4273 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1709890990467_4273 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; }'
