["https://lookmumnocomputer.com/big-button"]
title = "STUFF - LOOK MUM NO COMPUTER"
full_description = "BIG BUTTON A drum trigger sequencer all powered by 1 button. Inside is 1 Arduino nano controlling the whole Shabang. Below is the Stripboard layout. View fullsize THERE HAS BEEN A MODIFICATION TO THE ABOVE IMAGE. the wire going off to the BIG BUTTON LED. is now on pin A3, so just solder that wire to the point on the stripboard that is connected to the arduino pin labelled A3. HERE IS THE ARDUINO CODE :- BIG BUTTON CODE 1.2 You can make this with a modular power supply, ignore the -12volts or whatever the -12 volt is, wire the +voltage to the plus and the gnd to the gnd and if the voltage regulator pops bummer. replace it. all good. :) Below is a shopping list from rapid online.ARDUINO NANO CHEAP AS CHIPS HEREILLUMINATED ARCADE BUTTON HEREMINI JACK SOCKETS HEREENCLOSURE PRICEY BUT YEAH IF YOU WANT THE REAL DEAL HERESTRIPBOARD HEREPOWER SOCKET HEREROTARY SWITCH HERE10k POTENTIOMETERS HEREKNOBS??? HEREEEWIRE? HERELED's??? HERE BUTTONS??? HEREEEEEE10K RESISTORS HERE1K RESISTORS HERE2K RESISTORS HERE MODIFICATIONSYou can add a jack in parallel with any of the buttons! even the big button, so you can add trigger control to reset for instance, or the big button control! even if you put a jack in parallel with the channel select. it will work :) MIDI ?max schanner has made a piece of code that allows the big button to also sync to midi clock/send out midi clock and send out midi notes! aswell as function normally. nice!over usb midi, and whilst it hasnt been double checked yet, over normal 5 pin din midi too! :-https://github.com/arthus701/midibigbutton #block-af56da667c7e1a8f2611 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }"
