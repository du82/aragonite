full_description = 'The Dalrymple Report: Mac mini, Patreon, and a coffee update Posted on Friday, August 16th, 2024 at 10:05 am. PTWritten by Jim DalrympleThere are rumors of a new M4 Mac mini in Apple’s future, which makes sense—this wouldn’t be the first time Apple has used the Mac mini to lead off its Mac upgrade cycle. Users of Patreon are up in arms over Apple’s requirement for the company to move to its in-app purchasing system or risk being removed from the App Store. I have an update on my quest for a good cup of coffee.Follow this podcastBrought to you by:Oracle Cloud: Upgrade to the next generation of the cloud–Oracle Cloud Infrastructure. You get a single platform for your infrastructure, database, application development, and AI needs.Show Notes: Apple’s fantastic new accessibility video The most dominant female athlete in America won Olympic gold — in wrestling The English Premier League Will Ditch Its Hated VAR Offside Tech for a Fleet of iPhones Apple to force Patreon to hand over 30% Another reason to buy an iPhone 16 Pro Rumored new M4 Mac miniShows and movies we’re watching Presumed Innocent, Apple TV+ Cowboy Cartel, Apple TV+ Payback, BritBox Shogun, Hulu Blue Eye Samurai, NetflixComments are closed. #carbonads { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; max-width:330px; background-color:hsl(0,0%,98%); box-shadow:0 0 1px 1px hsla(0,0%,0%,.1); border-radius:4px; overflow:hidden; } #carbonads a { color:inherit; text-decoration:none; } #carbonads a:hover { color:inherit; } #carbonads span { position:relative; display:block; overflow:hidden; } #carbonads .carbon-wrap { display:flex; } .carbon-img { display:block; margin:0; line-height:1; } .carbon-img img { display:block; } .carbon-text { font-size:11px; padding:10px; line-height:1.35; text-align:left; } .carbon-poweredby { display:block; padding:8px 10px; background:repeating-linear-gradient(