["https://www.loopinsight.com/2022/02/14/apple-watch-detects-symptom-of-thyroid-issue-months-ahead-of-diagnosis"]
title = "Apple Watch detects symptom of thyroid issue months ahead of diagnosis"
full_description = 'Apple Watch detects symptom of thyroid issue months ahead of diagnosis Posted on Monday, February 14th, 2022 at 7:38 am. PTWritten by Dave MarkMalcolm Owen, AppleInsider:A nursing student in Australia is encouraging Apple Watch owners to enable heart rate notifications, after the wearable device detected symptoms of a thyroid condition months before being diagnosed.And:“Instead of me waiting for the symptoms to get really bad, I could have gone to the doctor back in October, when there was this dramatic drop in a matter of days,” Lauren adds, alongside a screenshot of a graph from the Health app. “It dramatically dropped, which means my cardiovascular system wasn’t working as well as it once was.”The drop also correlated with other symptoms, including fatigue, a sensitivity to heat, gaining weight, dry skin, and increased irritability. In December, she was diagnosed with thyroid hemiagenesis, and is undergoing treatment.Here’s a link to Lauren’s video. Sound on.A few years ago, I had a long conversation with a cardiologist about the future of Apple Watch and the patterns that indicate various health conditions. I walked away from that conversation feeling that the potential for Apple Watch as diagnostic tool is massive, far beyond the benefits we already see, especially as more sensors are developed and integrated with Apple’s Health infrastructure. Lauren’s video made me feel this even more strongly. #carbonads { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; max-width:330px; background-color:hsl(0,0%,98%); box-shadow:0 0 1px 1px hsla(0,0%,0%,.1); border-radius:4px; overflow:hidden; } #carbonads a { color:inherit; text-decoration:none; } #carbonads a:hover { color:inherit; } #carbonads span { position:relative; display:block; overflow:hidden; } #carbonads .carbon-wrap { display:flex; } .carbon-img { display:block; margin:0; line-height:1; } .c