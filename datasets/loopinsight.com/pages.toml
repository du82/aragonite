full_description = "The Dalrymple Report: Is iPhone 16e worth it?, WiFi QR code, and Alexa+ Posted on Friday, February 28th, 2025 at 6:02 am.Written by Jim DalrympleThe iPhone 16e was announced a little while ago so Dave and I take some time to look at the features of the new device and wonder if it fills the needs of its target market. Dave gives us a tip about giving visitors to your house a QR code to join the WiFi instead of sharing or telling everyone the password. Alexa+, Amazon’s digital assistant is nearly complete and ready for primetime.Follow this podcastShow Notes: Steve Jobs’ 70th birthday Jony Ive on the BBC’s Desert Island Discs Steve Jobs coin Is the iPhone 16e worth it? Passwords app and WiFi QR code Amazon Debuts Alexa+ Generative AIShows and movies we’re watching Disclaimer, Apple TV+ The Pitt, Noah Wiley, ER fame, Max The Dalrymple Report: iPhone 16e, Spotify, Hot Corners Posted on Friday, February 21st, 2025 at 5:12 am.Written by Jim DalrympleThere is a lot to talk about this week. I suppose the biggest news is the announcement of the iPhone 16e, a new model of the budget iPhone from Apple. While it may be less expensive than other models in the lineup, it has some impressive specs, including Apple’s first cellular modem.Follow this podcastLinkedIn Jobs: LinkedIn Jobs helps you find the candidates you want to talk to, faster. Did you know every week, nearly 40 million job seekers visit LinkedIn? Post your job for free at LinkedIn.com/DALRYMPLE. Terms and conditions apply.Show Notes: Change Desktop & Dock settings on Mac macOS Tip: Set Up and Control Hot Corners With Modifier Keys Delta Offers $30,000 to Passengers on Plane That Crashed in Toronto Apple announces iPhone 16e Gruber: Thoughts and Observations on Today’s iPhone 16e Announcement Spotify may be planning a premium upgrade for its best subscription serviceShows and movies we’re watching The Night Agent, Netflix Sly Lives, Hulu SNL50: The Anniversary Special, Peacock The Dalrymple Report: Mac window, Apple TV, Apple health study, and iPhone SE Posted on Friday, February 14th, 2025 at 7:29 am.Written by Jim DalrympleDave and I have been running into an issue that we both have when we move a Mac Finder window around the screen. Someone out there knows the answer to why this is happening. The Apple TV is now available on Android, so we discuss if that will increase subscriptions to the service. Apple is launching another health study, one of the areas that the company has excelled i n recent years. The iPhone SE update appears to be right around the corner.Follow this podcastShow Notes: The Apple TV app is now available on Android New holistic Apple Health Study launches today in the Research app New Powerbeats Pro 2 What Powerbeats 2 has that AirPods do not Gurman: iPhone SE 4 Coming ‘By Next Week,’ An Ankle Monitor? No, That’s My Apple WatchShows and movies we’re watching Lioness, Paramount+ Flow QT8: The First Eight, Peacock"
