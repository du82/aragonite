["https://www.loopinsight.com/author/dave-mark"]
title = "Stolen from Apple"
full_description = "Stolen from Apple Posted on Thursday, February 24th, 2022 at 6:22 am.Written by Dave MarkOld school Apple story, posted on Folklore.org by Andy Hertzfeld:In 1980, a company called Franklin Computer produced a clone of the Apple II called the Franklin Ace, designed to run the same software. They copied almost every detail of the Apple II, including all of its ROM based software and all the documentation, and sold it at a lower price than Apple. We even found a place in the manual where they forgot to change “Apple” to “Ace”. Apple was infuriated, and sued Franklin. They eventually won, and forced Franklin to withdraw the Ace from the market.Even though Apple won the case, it was pretty scary for a while, and it wasn’t clear until the end that the judge would rule in Apple’s favor.This is where our story starts. Follow the link to see what Apple did to prevent someone from copying the Macintosh ROM. Damn clever. Making a portable Mac Mini Posted on Thursday, February 24th, 2022 at 6:14 am.Written by Dave MarkThis is a fantastic do-it-yourself project, inspiration for the maker in you.The whole thing is fascinating (if you have that DIY gene) but one bit that sticks out: 2:39 in, where Scott has the epiphany to use an iPad mini instead of a small HDMI display. The length of the iPad mini is exactly the same as the width of the Mac mini. Coincidence? Intentional on Apple’s part? How to permanently delete your Apple ID Posted on Thursday, February 24th, 2022 at 6:02 am.Written by Dave MarkAnkur Thakur, iDownloadBlog:This tutorial shows you how to delete your Apple ID or iCloud account. But first, it’s essential to know about the consequences of such action, what will stop working, and what you must do before deleting your Apple ID to prevent your devices from becoming unusable!Why delete your Apple ID? You have a second Apple ID and wish to stop using the first one. You migrated to non-Apple platforms like Android or Windows PC and no longer use or plan to use Apple devices. You have privacy concerns with Apple.This is serious business. The consequences are severe. Measure twice, cut once, caveat emptor, etc.But if you have a good reason, read through Ankur’s tutorial, proceed with caution."
