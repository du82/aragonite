full_description = "Apple AI, MacBook, and iPhone 15 Pro Posted on Friday, June 21st, 2024 at 7:57 am.Written by Jim DalrympleApple rolled out its AI strategy at WWDC this month. Dave and I take a look at that, as well as, a look at what Siri will be able to do, and what it won’t do at launch. There are rumors of a new M4 MacBook Pro, which makes sense since Apple just released an iPad with the same chip. The requirements for Apple’s new AI strategy calls for an iPhone 15 Pro, which leaves a lot of older iPhone users out in the cold.Follow this podcastShow Notes: Willie Mays M4 MacBook Pro Models Expected to Launch in Late 2024 FTC Takes Action Against Adobe Apple’s AI rollout strategy Apple Intelligence Apple Explains iPhone 15 Pro Requirement for Apple Intelligence Pixar’s ‘Inside Out 2’ Heads for Historic Box Office Opening The apps that Apple Sherlocked at WWDC 2024Shows and movies we’re watching Hidden Assets, Acorn Under the Bridge, Hulu Erased, Hulu Hit Man, Netflix The Dalrymple Report: Justin Long, Apple AI, and Netflix Posted on Friday, June 7th, 2024 at 9:41 am.Written by Jim DalrympleJustin Long is in the news again, this time doing commercials for Qualcomm. Apple is still in the news for uts rumored AI releases at WWDC, but this time it’s for a partnership with Sam Altman and OpenAI to make Apple’s AI actually work. Netflix is ending support for older Apple TVs, so if you have one of those devices, it may be time to upgrade.Follow this podcastBrought to you by:LinkedIn Jobs: LinkedIn Jobs helps you find the candidates you want to talk to, faster. Did you know every week, nearly 40 million job seekers visit LinkedIn? Post your job for free at LinkedIn.com/DALRYMPLE. Terms and conditions apply.Show Notes: Now Qualcomm Went Long Justin Long did it again. First Intel, and now Qualcomm Apple, AI, and Sam Altman WWDC AI announcements will spark iPhone 16 upgrade cycle Netflix to End Support for 2nd and 3rd Generation Apple TV Fake iPhone return scamShows and 