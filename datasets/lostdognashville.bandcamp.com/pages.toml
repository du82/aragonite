["https://lostdognashville.bandcamp.com/track/beautiful-curse"]
title = "Beautiful Curse | LOST DOG street band"
description = """
Beautiful Curse by LOST DOG street band, released 21 January 2022

Things I try to lock inside too ugly to bear
Find a seam inside my dream and begin to tear
Through my eyes they come alive and beckon for a stare
In your throat I hit a note for bells above to hear
Chorus:
The silence weeps for which of us will leave with something worse
Oh, what a beautiful curse
Take me out and put me down I’m dying for a cure
In this room a tortured few feast upon a spur
No sees the artist weep the bounty of his worth
Desperately try to breath and dig until it hurts
Chorus
Brother can you shape these hands and teach them how to feel
Something more than how to scorn or burn you in a deal
Who needs games or tempting fate when you know how to steal
I see in you the same old fool I was when things were real
Chorus"""
