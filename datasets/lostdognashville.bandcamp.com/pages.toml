["https://lostdognashville.bandcamp.com/track/sleeping-tight"]
title = "Sleeping Tight | LOST DOG street band"
description = """
Sleeping Tight by LOST DOG street band, released 01 January 2015

If I had one wish oh, I would sleeping tight. 

Rest my weary eyelids and drift off in the night.

But I’m still contemplating and in comes the morning light.

I choke on my breath as clouds go rolling by


In my dreams oh, your face it is quite clear

I held you so close were did you disappear?


Yonder comes my baby she’s prayin’ for a smile

she sees the hurt i’m in and the devil in my eyes

she knows i’m dreading but hoping for a sign

a long lost friend would save me from my nightmares tonight


I kept on walking and refused every ride

Said i’m searching for a ghost have you seen him pass by?


Somewhere I’m pickin’ daisies oh I’m laughin’ like a child

far from misfortune and a worn out tortured mind

maybe someday I’ll see you on a lonely drunken train  ride

you could pick a melody and I’ll just close my eyes


Life is hell and God can’t put you through it twice
Dreams are in between but I ain’t sleepin’ tonight"""
full_description = "One of the best country/folk albums in modern times, hit me so deep, very beautiful music, thanks Ben for your art and how help me go across my darkest times coreyTLW Former frontman of punk band Roidz has crafted a richly layered contemporary pop record exploring the world of lives lived on the fringe. Bandcamp New & Notable Sep 7, 2023 Margo Price's latest album tackles loss, failure, and freedom over lush pop, psychedelic country, and rock arrangements. Bandcamp New & Notable Jan 13, 2023 Kate Ellis uses melancholy Americana to conduct fearless soul searching. Bandcamp New & Notable Mar 3, 2022 Saw Matt open for Lost Dog Street Band in Portland Oregon after only listening to a couple of his songs. His performance was amazing, his talent as a writer, singer, and fiddle/now guitar player is something out of this world. Matt my Brother May the show never end for you and your dreams! jaredandkim19"
year_published = 2023
year_updated = 2023
