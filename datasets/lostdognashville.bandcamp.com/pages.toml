I’m wide awake I’m pumping blood
I cursed my cards into doves
And filled my wounds with salt and mud
Because you’re getting dead or getting tough
A king is crowned for the underground with every dawns ascent
You must choose the type of muse you’d force upon a friend
Coming down off every town is an awful way to live
You can’t use your O.D. blues to straighten out your bends
Chorus"""
