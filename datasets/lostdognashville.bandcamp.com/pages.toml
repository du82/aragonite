["https://lostdognashville.bandcamp.com/track/what-keeps-me-up-now"]
title = "What Keeps Me Up Now | LOST DOG street band"
description = """
What Keeps Me Up Now by LOST DOG street band, released 21 January 2022

Do I have what it takes to make it somehow
What if I fall on my face in front of the crowd
All my mistakes are reflected in shapes
That appear like a self loathing shroud
As I recede in the charm of my grief I am bound
What keeps me up now
Chorus:
Let nightmares control you and daylight expose you
And the blood in your head starts to pound
It’s twenty ’til three and you’ve got a cliff to climb down
What keeps me up now
Remember the time you first called me out
I laughed to pretend not to know what came out of your mouth
But it clung on my brain like a fresh coat of paint
And I fled on a train headed south
In New Orleans I wiped my mind on the town
What keeps me up now
Chorus
I used the dope to escape where I couldn’t be found
I burned through all petty cash and bank accounts
With nothing left but a guitar and belt
I hocked it and swore off the sound
The belt was a noose when I came to on the ground
What keeps me up now"""
