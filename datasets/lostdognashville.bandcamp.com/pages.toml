title = "Hayden's Lament | LOST DOG street band"
description = """
Hayden&#39;s Lament by LOST DOG street band, released 21 January 2022

The open road with a heavy load is a good place to begin
Treat you like a jagged knife on a newborn’s skin
Keep composed ‘cause no one knows the kind of mess you’re in
Are you sure the hurt will cure your penchant for the sin
