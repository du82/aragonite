title = "How to Be Tudor"
full_description = "How do we know her? The Secrets of Margaret Pole Hilary Mantel, 2 February 2017 Did she plot against the crown? Did she, as the regime alleged, burn the evidence that incriminated her? Or was there, as she claimed, nothing worth burning? How to Be Tudor: Can a King Have Friends? Hilary Mantel, 17 March 2016 Henry VIII came to the throne in 1509. Charles Brandon’s power as a court favourite endured till death removed him in 1545. How did he do it? Royal Bodies Hilary Mantel, 21 February 2013 Our current royal family doesn’t have the difficulties in breeding that pandas do, but pandas and royal persons alike are expensive to conserve and ill-adapted to any modern environment. The Crowe is White: Bloody Mary Hilary Mantel, 24 September 2009Mary’s bishops wanted recantations more than they wanted executions. There was always the possibility of a last-minute change of heart; this would not free the condemned person from the stake, but it would send the charred soul to heaven, or at least purgatory. Frocks and Shocks: Jane Boleyn Hilary Mantel, 24 April 2008Whatever emotion she felt when she found herself sentenced to death, it can’t have been surprise. Blame it on the Belgians Hilary Mantel, 25 June 1992‘You don’t want to see him,’ said the porter at Corpus, when Charles Nicholl went to Cambridge to look at the portrait that is probably Christopher Marlowe. ‘He died in a tavern brawl.’ London A-Z (and back again)Links to the 52 (actually 53!) pieces that comprise the alphabetical tour this year’s LRB Diary takes through London’s streets: from Keats to the Krays, Woolf to Windrush, the YBAs to the GLC, by...Read more about London A-Z (and back again) LRB Winter Lectures 2010-2024Judith Butler on who owns Kafka; Hilary Mantel on royal bodies; Andrew O’Hagan on Julian Assange; Mary Beard on women in power; Patricia Lockwood on the communal mind of the internet; Meehan Crist...Read more about LRB Winter Lectures 2010-2024 History & ClassicsPlato made it upWriting about myth and the stories we tell ourselves by Margaret Anne Doody, Marina Warner, Mary Beard, Anne Carson, James Davidson, Tom Shippey, Joanna Kavenna, Lorna Sage and Michael Wood. Read more about Plato made it up"
