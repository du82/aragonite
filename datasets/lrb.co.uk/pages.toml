title = "Analysis Gone Wrong"
full_description = "Saving Masud Khan Wynne Godley, 22 February 2001Khan always answered telephone calls during sessions. When Winnicott rang up I could clearly hear both sides of the conversation, so presumably he angled the phone towards me. Winnicott spoke respectfully to Khan, for instance about a paper which he had recently published. ‘I learned a great deal from it,’ Winnicott said deferentially. This particular conversation ended with a giggly joke about homosexual fellatio – the final two words of the conversation – accompanied by loud laughter. War Zone: In Winnicott’s Hands Sherry Turkle, 23 November 1989All his life Donald Winnicott took great pains to present himself as an orthodox Freudian. Yet few ‘Freudians’ have been more radical in their departures from orthodoxy. Fortress Freud Mary-Kay Wilmers, 18 April 1985Psychoanalysts have had good reasons for considering themselves beleaguered, but for the past twenty years at least, the world, being less interested in them, has been less interested than they imagine in finding them out. ‘No decent analyst would let his picture appear in the Times,’ one New York analyst snapped at another, as if he had caught him sneaking his image into the temple of Baal. I must be mad: Wild Analysis Nicholas Spice, 8 January 2004‘What on earth would possess you to do that?’ This, more or less, is the question anyone who hasn’t ever been in analysis asks of those who have. How a Fabrication Differs from a Lie Mikkel Borch-Jacobsen, 13 April 2000‘Was Freud a liar?’ Ever since Frank Cioffi had the audacity to ask this question in 1973, it has continued to rock the world of psychoanalysis. Till then, things had been so simple. I haven’t been nearly mad enough: Modern Madness Jenny Diski, 6 February 2014I return to the complete mystery of why some people are knocked flat and incapable by what seem like only the mildest of dysfunctional backgrounds, compared to others whose childhoods were devastated by cruelty and deprivation, let alone those who grow up with famine and war, yet seem to find a way to live their lives as if they were their own. And all that space in between the extremes of near harmlessness and full-blown misery: the whole regular family muddle and mess that everyone has to survive, or not."
