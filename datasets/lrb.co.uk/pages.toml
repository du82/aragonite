["https://lrb.co.uk/collections/smoked-out"]
title = "Smoked Out"
full_description = "Besides, I’ll be dead: When the Ice Melts Meehan Crist, 22 February 2018 In a high-emissions scenario, average high tides in New York could be higher than the levels seen during Sandy. A rise in global sea levels of 11 feet would fully submerge cities like Mumbai and a large part of Bangladesh. The question is no longer if – but how high, and how fast. Smoked Out: Travels in the Apocalypse McKenzie Funk, 7 February 2019 Disasters like the conflagration that consumed Paradise, California, in November, killing 81 people – the deadliest and most destructive wildfire in the state’s history – do happen. But the climate disaster facing millions of other residents of the American West is more insidious. The natives did a bunk: The Little Ice Age Malcolm Gaskill, 19 July 2018The winter of 1607-08 was extraordinarily bad, even by the standards of the age. Captain John Smith, Jamestown’s leader in waiting, wrote of ‘extreame sharpe’ weather, which caused the James River, as broad as it was brackish, to freeze almost completely; many European rivers, as far south as Greece, did the same. The Thames became a ‘frost fair’ for ‘those who delighted in the novelties of the times’, as a contemporary put it. What lives and what dies? The End-Cretaceous Event Francis Gooding, 3 January 2019No doubt some hardy creatures will ride out the current planetary catastrophe, and birds are as good a contender as any; after all, 66 million years ago they had what it took to evade the effects of a billion atom bombs. So maybe the dinosaurs will survive the sixth mass extinction too. London A-Z (and back again)Links to the 52 (actually 53!) pieces that comprise the alphabetical tour this year’s LRB Diary takes through London’s streets: from Keats to the Krays, Woolf to Windrush, the YBAs to the GLC, by...Read more about London A-Z (and back again) LRB Winter Lectures 2010-2024Judith Butler on who owns Kafka; Hilary Mantel on royal bodies; Andrew O’Hagan on Julian Assange; Mary Beard on women in power; Patricia Lockwood on the communal mind of the internet; Meehan Crist...Read more about LRB Winter Lectures 2010-2024"
