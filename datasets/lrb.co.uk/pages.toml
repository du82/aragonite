title = "Awayness"
full_description = "The Last Romantic John Bayley, 5 May 1983Transfiguration is into a kind of poetic absence which includes only the idea of love, not its quotidian betrayals or fulfilments. ‘What remains of us is love’ in the sense that love equates with self-extinction. I think Larkin here gives his own entombed precision to the symbol, which for the Symbolists gave out nothing but its own powers of suggestion. To Larkin it suggests the comfort of disappearance, selflessness, awayness, and in the universe this is no doubt the true comfort of love. Can we eat them? Knausgaard’s Escape Rivka Galchen, 24 January 2019Karl Ove Knausgaard talks about how much he used to dread summertime, the expectation it placed on a young man to be swimming or boating with other people. Writing solved this social awkwardness, he felt, and then he says: ‘When the children arrived, the problem of loneliness vanished definitively ... but by then the writing had become so entrenched within me, as a method and a solution to all problems.’ Keeping warm Penelope Fitzgerald, 30 December 1982Sylvia Townsend Warner courageously faced solitude, preferring ‘the sting of going to the muffle of remaining’. The crisis passed, because, STW thought, ‘I was better at loving and being loved,’ and they returned to a life which she could only call blessed. She meant travel, many friendships, gardening, jam-making, perilous motoring, cats, books and music. What made Albert run: Mad Travellers Mikkel Borch-Jacobsen, 27 May 1999You wake up one morning, the whole world is grey, you have had enough of your cold, colourless life. You want to drop everything, escape, far away, where life is real. Who has not had this dream from time to time? As for the Brioches Clarence Brown, 2 November 1995I chose a room in Beirut and engaged Matisse as decorator. The sunlit balcony looked onto a blue sea. The white wooden table beside my transatlantique held a sliced melon. Hibiscus bloomed nearby. Some other fragrance that I could not and cannot name is still available to my senses, as arc the other wholly abstract elements of this notional construct, invulnerable to all the manifold miseries of later Lebanese history."
