["https://lrb.co.uk/collections/ministry-of-apparitions"]
title = "Ministry of Apparitions"
full_description = "Poem: ‘The Warning’ Matthew Sweeney, 22 November 2012I had Coltrane playing from the hallway / and was humming along. The black cat / was poking and hissing at the white cat, / when a crow landed a couple of feet away. That Wilting Flower: The Lure of the Unexplained Hilary Mantel, 24 January 2008In the case of mediums, clairvoyants and other psychic operators, there’s a fine line between cheating and self-delusion, and it is worrying that people who claim to expose hoaxes are often no more scrupulous in their conduct than the people they are pursuing. Ministry of Apparitions: Magical Thinking in 1918 Malcolm Gaskill, 4 July 2019Talismans were universal. Soldiers wore heart amulets, sprigs of heather, four-leafed clovers, rabbits’ feet, miniature horseshoes, pebbles with holes in them (traditionally a witch-repellent), as well as Catholic medals depicting saints, angels, Christ and the Virgin. Diary: America is a baby Patricia Lockwood, 3 December 2020‘You’re not the only one,’ a friend assured me, and sent me screenshots of other people who couldn’t change their dresses or remove their ties until the official call came. At best, my superstitions were an attempt to stave off uncontrollable physical terror; at worst, I felt like I was giving the wrong answer to the ‘Do you think Margaret Thatcher had girl power?’ question a hundred times in a row. Stratagems of Ignorance Theodore Zeldin, 5 January 1989Superstition is one of the older religions of the Don’t Knows. For some, it may be a positive assertion of faith in supernatural forces, but for many it is a foggy compromise between knowledge and ignorance, an insurance policy that may or may not stop things going wrong, a part-time religion. It is a good way into the history of uncertainty. Consider the Hedgehog Katherine Rundell, 24 October 2019The Ebers Papyrus, dating from around 1550 bce, suggested that an amulet in the shape of a hedgehog would stop hair thinning. Its skin and spines have been thought to help with toothache, kidney stones, diarrhoea, vomiting, fever, deafness, cystitis, leprosy, elephantiasis and impotence."
