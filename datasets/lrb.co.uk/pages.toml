["https://lrb.co.uk/collections/marvel-years"]
title = "Marvel Years"
full_description = "Giving up the Ghost Hilary Mantel, 2 January 2003You come to this place, mid-life. You don’t know how you got here, but suddenly you’re staring fifty in the face. When you turn and look back down the years, you glimpse the ghosts of other lives you might have led; all houses are haunted. The wraiths and phantoms creep under your carpets and between the warp and weft of fabric, they lurk in wardrobes and lie flat under drawer-liners. Diary: My Marvel Years Jonathan Lethem, 15 April 2004As a child, I suffered a nerdish fever for authenticity and origins of all kinds, one which led me into some very strange cultural places. Any time I heard that, say, David Bowie was only really imitating Anthony Newley, I immediately lost interest in David Bowie and went looking for the source, sometimes with the pitiable results that this example suggests. The Old Devil and his wife Lorna Sage, 7 October 1993Grandfather’s skirts would flap in the wind along the churchyard path, and I would hang on. He often found things to do in the vestry, excuses for getting out of the vicarage (kicking the swollen door, cursing) and so long as he took me he couldn’t get up to much. I was a sort of hobble; he was my minder and I was his. On Writing a Memoir: Living by the Clock Edward Said, 29 April 1999I was given my first watch, an insipid-looking Tissot, at the age of 11 or 12; for several days I spent hours staring at it, mystified by my inability to see its movement, constantly worried that it had stopped. Diary: Brussels Mary-Kay Wilmers, 29 July 1999I was born, not long before the Second World War, in the United States, where until the age of nine I lived in a succession of different towns and states, of which New York was the last, the place from which I left the country for good. I didn’t know at the time that we weren’t going back; and it was only later that it occurred to me that I’d spent the rest of my childhood in some sort of exile. Diary: Evacuees Rosemary Dinnage, 14 October 1999Was I just too seasick to care? Or too stupid to understand that war can really kill? Does memory blot out fear? If so, I wish it would also blot out homesickness, friendlessness, a lifelong sense of – weirdness? numbness?"
