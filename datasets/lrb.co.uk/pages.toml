title = "Selma Dabbagh"
description = "The LRB is Europe’s leading magazine of books and ideas. Published twice a month, it provides a space for some of the..."
full_description = "LRB blogBlog ContributorsBlog Archive Selma Dabbagh5 March 2025‘How life is in there’The British brought the system of administrative detention to Palestine when they were the mandatory power. According to Article 111 of the Defence (Emergency) Regulations 1945, ‘a military commander may by order direct that any person shall be detained in such place of detention as may be specified by the military commander in the order.’ The rules also authorised military courts, restriction of movement, censorship, the expropriation and demolition of houses, arbitrary searches and curfews, and were used by the British against both Palestinians and immigrants of Jewish and other religious backgrounds.Despite many of its founders being caught on the wrong side of these laws, Israel adopted them in 1948 and has strenuously resisted attempts to modify their provisions. In December 2022 there were 791 Palestinians in administrative detention in Israel. By December 2024 the number had increased more than fourfold to 3327 – over a third of the nearly ten thousand Palestinians being held prisoner by Israel on security grounds.Read more about ‘How life is in there’12 February 2025RansackedOn 9 February, two branches of the Muna family’s bookshops in East Jerusalem were ransacked by Israeli police. They entered in civilian clothes, used Google Translate to decipher the titles of the English language books and confiscated box loads, picking out in particular any with a Palestinian flag on the cover. CCTV images show black bin bags being filled with books to be used as evidence against the Munas. The police arrested both Mahmoud (in front of his eleven-year-old daughter, Leila) and his nephew Ahmad, and took them to the notorious Moscobiyya interrogation centre in West Jerusalem.Read more about Ransacked24 January 2025CeasefireOn the first day of his second term as US president, Donald Trump described Gaza as a ‘phenomenal location on the sea’. Living in a tent close to the beach in southern Gaza, my friend Marwa has had her request for permission to travel to the north, to visit her elderly mother, denied three times for ‘security’ reasons. There has been no news of her cousin, who used to look after her mother, since he was taken by the Israeli army over a month ago.Read more about Ceasefire9 December 2024‘How has this year been for you?’‘How has this year been for you?’ a musician friend from the West Bank asked me when we met for the first time in several years. ‘For us, we have been through a lot before, but we were never scared,’ he said. ‘Now, we do not know. I could have a chance encounter with an Israeli soldier who does not like the look of my face, or my instrument, and just shoots me. It is like the country is in its death throes.’ I didn’t know how to respond. Attempts to reassure or reframe are an insult to the intelligence. Read more about ‘How has this year been for you?’29 October 2024We are not OKOver a million people have protested in London this year and a majority of the British population think the Israeli prime minister should be arrested for war crimes, yet the UK government continues to prostrate itself before Israel.Read more about We are not OK11 September 2024‘You die here, or you leave’On 28 August, Israel launched a ground and air attack on the northern West Bank, ‘the biggest of its kind since 2002’. With the military onslaught came images of medical staff rounded up, hospitals besieged, ambulances and paramedics stopped, cities and refugee camps sealed off, roads destroyed, water, fuel and electricity supplies cut. Israeli occupation forces were reported to have killed twenty Palestinians in Jenin in two days. They took over people’s homes and positioned snipers on the roofs of buildings. Mass arrests and abuse of detainees were filmed by residents. The human rights organisation al-Haq has shown footage of the destruction of the eastern part of the city by Israeli bulldozers.Read more about ‘You die here, or you leave’23 August 2024‘All we are left with is rubble’If, in 1948, firing had not been coming in the direction from masnaa al-bira (the beer factory) my family would have headed south to Gaza, where they would, according to my father, have stayed. By the time they tried to leave Jaffa later, by boat, my father was badly wounded, following a grenade attack. If the sea had not been too rough on one attempt to lift him onto a boat on his stretcher, we could have ended up in Lebanon. If a man called Sir James Craig had not walked into the British Council in Damascus in 1952 and discovered my uncle Hussein’s gift for languages, we might not have come to England. My brother-in-law has lost at least 23 members of his family in Gaza, mainly children. A cousin of his, Sumaya, worked as a teacher. She was sheltering in a school when she and her three children Leen (aged six), Mariam (three) and Malik (two) were killed in an airstrike.Read more about ‘All we are left with is rubble’8 July 2024Hope from NothingOne of the pieces in the recent retrospective of Barbara Kruger’s work at the Serpentine Gallery is an image of a woman’s divided face, with the slogan ‘your body is a battleground’ taped across it in red. Since October, women’s bodies have been blasted across the killing fields of Gaza and trapped under its rubble. Read more about Hope from Nothing11 June 2024Blood and Numbers‘I can start with saying it is an unbearable situation in terms of dignity,’ my friend Marwa says in one of the voice notes she leaves me from her tent in Deir al-Balah. ‘Today you caught me on a good day. Today I want to talk. It is not usually easy for me to express this’ – the sound of a drone cuts in – ‘pain.’Read more about Blood and Numbers24 May 2024Black OutsWhen a building under construction collapsed in George, South Africa, last week, dozens of workers were buried beneath the rubble. Delvin Safers, an electrician, was trapped next to a colleague who was ‘already deceased’. His girlfriend sent him photographs of their two-year-old son to keep his spirits up. Without the light from his phone, everything was dark. That was the hardest part of it, Safers said. ‘When you close your eyes, it is dark, then you open them, it is the same thing.’ He was freed after a couple of days, with the use of his legs. ‘That was the main thing,’ his father said, ‘when I saw my son walk.’ His life was saved thanks to the large teams of rescue workers with hard hats, sniffer dogs, cranes, bulldozers and trucks who came to his rescue.In Gaza more than ten thousand people are trapped under the rubble, according to the United Nations.Read more about Black OutsRead More Selma Dabbagh is a lawyer and writer of fiction. Her novel, Out of It, is set mainly in Gaza. She edited We Wrote in Symbols: Love and Lust by Arab Women Writers, published by Saqi in 2021. Contact Email: blog@lrb.co.uk var n_posts = 18; var pp = 10; var load_posts = 1;"
