["https://lrb.co.uk/collections/plato-made-it-up"]
title = "Plato made it up"
full_description = "Fear of Rabid Dogs Margaret Anne Doody, 18 August 1994In his last days, the exiled and ageing Aristotle wrote to a friend: ‘The lonelier and the more isolated I am, the more I have come to love myths.’ We may puzzle over what Aristotle meant. Did he love folk-tales, religious stories or high-minded allegories? The Greek word mythos means (centrally) ‘story’ but all stories have or acquire meanings, and we tell ourselves stories all the time. A culture is the stories that it tells itself. Did she go willingly? Helen of Troy Marina Warner, 7 October 2010Ever since Mephistopheles summoned a devil to delude Faust into believing that Helen of Troy stood before him and would make him immortal with a kiss, there has been something fugitive about her; for Laurie Maguire, her beauty, being absolute, cannot be grasped, and so leaves desire famished, unappeased. Helen of Troy comes to represent, not an ideal worth dying for, but a gap in meaning, a vanishing. Diary: Medea Marina Warner, 3 December 2015The fantastical way of reading a myth, often more sheerly pleasurable, is usually discounted as childish make-believe. It has been most powerfully adopted by writers like Philip Pullman who are read principally by children. It also serves the crucial mythic purpose of mapping limits and prohibitions, demarcating the centre ground where fathers don’t eat their children, brothers don’t marry their sisters, and mothers don’t cut their babies’ throats. Give her a snake Mary Beard, 22 March 1990The myth of Cleopatra may offer women an image of power, but at the cost of implicating them in the misogynistic fantasies of patriarchy. For women, ‘Cleopatra’ is a trap. Poem: ‘First Choral Ode from Norma Jeane Baker of Troy (a translation of Euripides’ Helen)’ Anne Carson, 7 March 2019Enter chorus. / I am my own chorus. / I think of my chorus as Mr Truman Capote. / He was a good friend, he told me the truth. / You’ll never admit it when you’ve made a mess, / he said to me once / and that was true."
