["https://lrb.co.uk/collections/52-ways-of-thinking-about-kafka"]
title = "52 ways of thinking about Kafka"
full_description = "Diary: Putting on Kafka’s Tux Patricia Lockwood, 24 March 2022If this were written in the 1990s it would be called ‘Kafka’s Tuxedo’, and in order to illustrate it, we would have resurrected Chagall for a single night so that he could paint Kafka as an empty suit riding a horse over the rooftops of Prague, with a violin between his legs to represent tragedy and two stars for his eyes. Diary: Fresh Revelations Alan Bennett, 20 October 199413 January. Having supper in the National Theatre restaurant are Lindsay Anderson and Gavin Lambert. ‘I suppose you like this place,’ says Lindsay. I do, actually, as the food is now... In the Nightmare Kitchen: Kafka’s Boyhood Rivka Galchen, 16 March 2017Born​ in 1928, Maurice Sendak grew up in Brooklyn, the child of Polish immigrants. On the day of Sendak’s bar mitzvah, his father learned that his family in Poland had all been killed.... On Being Left Out: On FOMO Adam Phillips, 20 May 2021Tragedies – which Freud uses to make sense of childhood experiences, never comedies – are about the tragic hero’s attempted self-cure for the ordeals of exclusion. Being left out begins as tragedy, and tragedy, Freud suggests, is integral to development. So the developmental question – the moral question – is this: is there another and better solution to feeling left out than revenge? How he got out of them Anne Hollander, 24 September 1992The jacket photo​ for Kafka’s Clothes shows him without any, sitting tailor-fashion on a beach, smiling above naked shoulders and a thin chest, the prominent ears rhyming with prominent... A Human Kafka Gabriel Josipovici, 5 March 1981 When Kafka died in 1924, not one of his novels had been published. He was known to a small circle – though Janouch’s testimony shows that that circle spread beyond his friends –... Short Cuts: Not a Little Kafkaesque Christian Lorentzen, 20 March 2014The salad​ was on expenses, the water was sparkling and the literary agent across the table was disappointed that I wasn’t a parent, I didn’t do yoga, I wasn’t a former cult..."
