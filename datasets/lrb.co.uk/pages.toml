title = "London A-Z (and back again)"
full_description = "Dudes in Drapes: At Westminster Abbey Miranda Carter, 6 October 2022The bald lesson of the abbey’s memorials is that money, power and connections repeatedly trump virtue and talent. So what to do with all these imperfect manifestations of wealth and inequality? Weed out the undeserving? Remove them all to the equivalent of a Soviet statue graveyard? There were at least four plans to do just that in the 1800s. But it’s hardly necessary. Wham Bang, Teatime: Bowie Ian Penman, 5 January 2017The scene-setting picture of Bowie at home featured black candles and doodled ballpoint stars meant to ward off evil influences. Bowie revealed an enthusiasm for Aleister Crowley’s system of ceremonial magick that seemed to go beyond the standard, kitschy rock star flirtation with the ‘dark side’ into a genuine research project. Cityphilia: the credit crunch John Lanchester, 3 January 2008 At the point when we bought our house in 1996, average house prices in the UK, adjusted for inflation, were some way below the levels they’d hit in the late 1980s bubble. Clapham was then... Blame it on the Belgians Hilary Mantel, 25 June 1992‘You don’t want to see him,’ said the porter at Corpus, when Charles Nicholl went to Cambridge to look at the portrait that is probably Christopher Marlowe. ‘He died in a tavern brawl.’ Utopian about the Present: The Brutalist Ethic Christopher Turner, 4 July 2019In​ 1972, the architects Alison and Peter Smithson completed Robin Hood Gardens, their only council estate. The couple were famous for projects such as the Mies van der Rohe-inspired Hunstanton... Grit in the Oyster-Shell: Pepys Colin Burrow, 14 November 2002 Samuel Pepys was the son of a London tailor and a president of the Royal Society. He was a philanderer who could feed a wench lobster before having his way with her under a chair in a tavern... London Lefties Paul Foot, 17 September 1987 The Greater London Council was set up by the Conservative Government in 1963 because the old London County Council was redistributing wealth of every kind from the London rich to the London..."
