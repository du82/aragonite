description = "The LRB is Europe’s leading magazine of books and ideas. Published twice a month, it provides a space for some of the..."
full_description = "LRB blogBlog ContributorsBlog Archive Alexander Fella21 February 2025All the Oxygen in the RoomOn 8 January I received an email from my boss at the health department where I work on social epidemiology. It was a message relayed from the US Centers for Disease Control and Prevention (CDC). ‘Data is the oxygen of public health,’ it said, ‘essential for improving health and saving lives.’ On 31 January, most, if not all, public health data were purged from the CDC’s website. Within hours of the erasure, health departments were stalled. If data were the oxygen of public health, then all the oxygen had just been sucked out of the room.Read more about All the Oxygen in the Room Alexander Fella teaches anthropology and philosophy in Norfolk, Virginia, where he also works on social epidemiology. His book on climate change and rental housing will be published in 2025 Contact Email: blog@lrb.co.uk var n_posts = 1; var pp = 10; var load_posts = 1;"
