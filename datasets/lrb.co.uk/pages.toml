["https://lrb.co.uk/blog/author/james-meek"]
title = "James Meek"
description = "The LRB is Europe’s leading magazine of books and ideas. Published twice a month, it provides a space for some of the..."
full_description = "LRB blogBlog ContributorsBlog Archive James Meek19 February 2025An Enemy to Its FriendsIn a wiser and more competent – to say nothing of a better – world, the initial approach to Putin would have been followed by a consultation between the US, Ukraine and other European countries on their counter-proposals, and the pressure they could put on Putin if he refused to budge. Perhaps this will still happen. For the time being, Ukraine and the rest of Europe will be consulted in the way the residents of a village are consulted before it gets demolished to make way for a new airport.Read more about An Enemy to Its Friends26 March 2024On the Crocus City Hall AttackMass murder at a Moscow light entertainment venue, where 140 people were gunned down at point blank range as they gathered to watch the nostalgic rock of the elderly band Picnic, may have promoted the long hand of Islamic State Khurasan Province to donors and potential recruits, but it changes nothing for the organisation where it most wants things to change, at home.Read more about On the Crocus City Hall Attack22 September 2022Putin’s ThreatsVladimir Putin launched his invasion of Ukraine on the assumption it would be comfortably wrapped up in a few days. Seven months, tens of thousands of deaths and hundreds of hectares of blackened ruins later, he still hopes to come out, by his definition, a winner, but he made clear yesterday that he was prepared to take as much time as he needs.Read more about Putin’s Threats9 May 2022Victory DayThe strangest thing about the Victory Day parade in Moscow this year was the absence of victory. Normally it’s there, the victory over Nazi Germany, a safely won triumph, unchangeably in the past, veterans and the glorious dead honoured, the country rebuilt, and in his speech today Vladimir Putin went through the motions of commemorating it. But this year, for the first time since the original Victory, Russian troops are openly fighting a war against the descendants of their Ukrainian former comrades-in-arms, on land whose evocative toponymy casts doubt on Russia’s traditional representation of May 1945.Read more about Victory Day25 February 2022In RuinsIt is striking how many commentators in the west have described Vladimir Putin, since he invaded Ukraine, as ‘detached from reality’, when he is not detached from reality. He is reality.Read more about In Ruins24 February 2022Willed MadnessAn airborne assault by Russian paratroopers using dozens of helicopters has seized a cargo airfield to the north-west of the capital. Ukrainian forces have fought back with the limited array of armour and missiles at their disposal. Aircraft have been shot down; tanks have been burned out; civilians killed and injured. In what so far seems like a pinnacle of willed madness, Russian and Ukrainian troops were reported to be fighting over control of the Chernobyl nuclear power station.Read more about Willed Madness23 February 2022Leaving KyivThe baleful alternative of Kyiv Beta, the Kyiv of war and the rage of slighted men, seemed closer. And that presence compels me to imagine – especially since I lived in Kyiv for two and a half years, at the time Ukraine came into independence – the choices faced by Kyivans. To stay or flee? To flee when, where, how? To stay and take up arms, or hunker down and look to your family? And if defence fails, what then?Read more about Leaving Kyiv22 February 202222/2/22Every day I ask people in Kyiv, and ask myself, whether the Russian president could seriously intend an assault on the Ukrainian capital. After Putin’s rant, and his announcement that he considers areas of Donbas controlled by Ukrainian forces no longer part of Ukraine, it seems more possible. More young men could be ordered to lay down their lives violently on Ukrainian earth around Kyiv, even as the bodies of Soviet soldiers from the 1940s are still being found.Read more about 22/2/2221 February 2022In the ZoneThirty miles from our destination, we came to a police post and a striped barrier. A policeman with a Kalashnikov strapped across his chest allowed us to proceed but warned us that we shouldn’t on any account stop along the way. I wondered what he meant. We passed relatively modern buildings without glass in their windows, as if a significant settlement had been abandoned a long time ago. We passed through an area that had been swept by fire. Blackened birch trees stood with their crowns lopped off, like an endless henge. It was the world of Tarkovsky’s Stalker. ‘Is this the Zone?’ I asked.Read more about In the Zone20 February 2022On Prospekt PeremohyArtem Chekh served in the Ukrainian army in the mid-2010s, on the front line in Donbas. He wrote a book about it. He’d be first in line to be called up in the event of mobilisation. He has a bag of odds and ends left over from his service; most of what he had he gave away to other soldiers. He still has a three-point strap for an automatic rifle, boots and a summer uniform. He’ll go if he has to.Read more about On Prospekt PeremohyRead MoreRead more by James Meek on the LRB website James Meek is a contributing editor at the LRB. His new novel, Your Life without Me, will be published in 2026. Contact Email: blog@lrb.co.uk var n_posts = 42; var pp = 10; var load_posts = 1;"
