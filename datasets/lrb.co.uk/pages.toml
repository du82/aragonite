title = "Down among the Press Lords"
full_description = "Who’s the real cunt? Dacre’s Paper Andrew O’Hagan, 1 June 2017The Daily Mail is like the drunken lout at a party who can’t get anyone to like him. Suddenly all the girls are sluts and all the men are poofs and he’s swinging at the chandelier before being huckled outside to vomit on the lawn. What makes Rupert run? Murdoch’s Politics Ross McKibbin, 20 June 2013Murdoch seems driven by insatiable ambition. He is never satisfied. Nothing appears complete, and the old man shows no sign of abandoning the struggle – especially as his heirs (his children) now publicly quarrel over the patrimony. What makes Rupert run? Money, power, glory, the business itself? Mirror Images: Piers Morgan Jenny Diski, 31 March 2005I can see that if you are 28 and editor of the News of the World, then you are 30 and getting £175,000 a year for editing the Mirror, until nine years later when you get the sack and score a reported £1.2 million for your reminiscences, you might be inclined to advise people not to take life too seriously. The Club and the Mob: The Shock of the News James Meek, 6 December 2018 The internet hasn’t so much changed people’s relationship to news as altered their self-awareness in the act of reading it. Before, we were isolated recipients of the news; now, we are self-consciously members of groups reacting to news in shared ways. Phwoar! Amanda Platell Suzanne Moore, 6 January 2000These days swearing occasionally or having a glass of wine at lunchtime is enough to qualify you as a bit of a character. As newspapers become less important, however, journalists become more self-important, especially the ones that report from the front line of their own lifestyles. Lady Rothermere’s Fan Mary-Kay Wilmers, 7 November 1985That her husband was a rich and powerful press tycoon was something which, in later accounts, Ann always played down: ‘I regarded newspapers as I did the arrival of groceries and milk and paid but little attention,’ she wrote in 1955 to her brother."
