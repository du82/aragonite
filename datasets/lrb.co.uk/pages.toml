full_description = "LRB blogBlog ContributorsBlog Archive Latest ‘How life is in there’ Selma DabbaghThe British brought the system of administrative detention to Palestine when they were the mandatory power. According to Article 111 of the Defence (Emergency) Regulations 1945, ‘a military commander may by order direct that any person shall be detained in such place of detention as may be specified by the military commander in the order.’ The rules also authorised military courts, restriction of movement, censorship, the expropriation and demolition of houses, arbitrary searches and curfews, and were used by the British against both Palestinians and immigrants of Jewish and other religious backgrounds.Despite many of its founders being caught on the wrong side of these laws, Israel adopted them in 1948 and has strenuously resisted attempts to modify their provisions. In December 2022 there were 791 Palestinians in administrative detention in Israel. By December 2024 the number had increased more than fourfold to 3327 – over a third of the nearly ten thousand Palestinians being held prisoner by Israel on security grounds.Read more about ‘How life is in there’ 0 3 March 2025 On Edward Said and Late Style 0 On Sunday, 9 March, at Southbank Centre’s Queen Elizabeth Hall, the City of London Sinfonia and the London Review of Books will be collaborating on an evening of music and readings inspired by Edward Said’s last, posthumous book, On Late Style: Music and Literature Against the Grain.Read more about On Edward Said and Late Style 0 28 February 2025 Nowhere to Run Forrest Hylton 0 Juan Camilo Hernández was born in Caldono, in south-west Colombia, in 1977. When he was sixteen he took part in a day of collective work (minga) with the Nasa Indigenous people. A commission from the FARC, led by nineteen-year-old Betty Lorena Castro, showed up to help. An elder Nasa woman told Castro that they wanted no guerrillas in the minga, since the Indigenous struggle was independent of la lucha armada.Read more about Nowhere to Run 0 27 February 2025 Fall of the Berlin Firewall Ruairí Casey 0 Friedrich Merz, the leader of the Christian Democratic Union (CDU) and soon to be chancellor of Germany, announced he was going ‘all in’ last month when he presented the Bundestag with his plan to turn asylum seekers away at the border. This meant openly courting support from the far-right Alternative for Germany (AfD), whose votes proved decisive. It was already clear that migration – not Ukraine, the climate or the recessionary economy – would be the dominant theme of the federal election on 23 February. But after a deadly knife attack by a rejected Afghan asylum seeker in Aschaffenburg on 22 January, Merz upped the ante. It was a characteristically impulsive and provocative move, without a clear purpose other than to prove his mettle by violating the taboo on co-operating with the far right.Read more about Fall of the Berlin Firewall24 February 2025 Nasrallah’s Funeral Loubna El AmineAs the two coffins were driven through the crowd, a deep, sorrowful voice came from the loudspeakers. The sound of a violin rose as the voice of the man receded. I texted people in Beirut to confirm that the music was playing at the funeral, not being added by the television broadcasters.Read more about Nasrallah’s Funeral 1 21 February 2025 All the Oxygen in the Room Alexander Fella 1 On 8 January I received an email from my boss at the health department where I work on social epidemiology. It was a message relayed from the US Centers for Disease Control and Prevention (CDC). ‘Data is the oxygen of public health,’ it said, ‘essential for improving health and saving lives.’ On 31 January, most, if not all, public health data were purged from the CDC’s website. Within hours of the erasure, health departments were stalled. If data were the oxygen of public health, then all the oxygen had just been sucked out of the room.Read more about All the Oxygen in the Room 0 20 February 2025 Bad Character Christopher Bertram 0 There is a troubling disconnect between the deterrent rationale and the mechanism that will be used to deny citizenship: the home secretary’s discretionary power to refuse someone on grounds of ‘bad character’. Perhaps the idea is that an asylum seeker has shown evidence of bad character by breaking the UK’s immigration laws, whatever the Refugee Convention may say. But this looks both implausible in itself and perversely at odds with other parts of the government’s rhetoric.Read more about Bad CharacterRead More var n_posts = 4232; var pp = 6; var load_posts = 1; var base_url = 'www.lrb.co.uk';"
