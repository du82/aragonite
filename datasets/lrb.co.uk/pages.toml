["https://lrb.co.uk/collections/how-shall-we-repaint-the-kitchen"]
title = "How shall we repaint the kitchen?"
full_description = "How Shall We Repaint the Kitchen? The Colour Red Ian Hacking, 1 November 2007Following the philosophers, Darwin had expected that colours would be cardinal among our concepts, and easy to learn by abstraction. They are not, at first. Nevertheless, life without our concept of colour seems unthinkable for us. That, the critics say, is an effect of our history, not of our genes. Diary: Looking at the Wallpaper Anne Enright, 2 January 1997Sitting in France writing about death and wallpaper, it is no surprise to find my walls orange: ‘that most morbid and irritating of colours’, as Huysmans described it, ‘with its acid glow and unnatural splendour’. Poem: ‘Yellow’ John Kinsella, 14 May 2009I say: see, yellow is fast, / and yellow is the colour of the sun, / it is the body of the flames, orange / is the colour of the sun, it is the body / of flames. The general tone is purple: Where the Poor Lived Alison Light, 2 July 2020The colour-coding on Charles Booth’s maps was far from innocent. At one extreme the glamour and heraldic grandeur of gold for, say, Grosvenor Square or Hyde Park; at the other, black for Whitechapel or Spitalfields, conjuring a ‘dark continent’ whose ignorant, savage tribes, like those elsewhere in the British Empire, needed the clarifying light of Christian missionaries or exposure to scientific reason. Eye Candy: Colour Julian Bell, 19 July 2007When was colour? Should we think back to the passion of postwar Americans for acrylic and metallic surfaces, for keeping the ‘paint as good as it was in the can’, in Frank Stella’s phrase? Or to the trenchant insistence on primary red, blue and yellow in the interwar Modernisms of Mondrian and the Bauhaus? When to Wear a Red Bonnett: Dressing up and down in 18th century France David Garrioch, 3 April 2003In 18th-century France, colour was a mark of status. Purple was the royal colour, forbidden to others, but reds and greens were popular. The richer the person, too, the better the quality of the cloth (wool, linen, silk), the more elaborate the lace of collars and cuffs, the more fashionable the cut."
