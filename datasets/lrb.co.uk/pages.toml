["https://lrb.co.uk/collections/lrb-winter-lectures-2010-2024"]
title = "LRB Winter Lectures 2010-2024"
full_description = "Eliot and the Shudder Frank Kermode, 13 May 2010So Eliot was sensitive to certain manifestations of the uncanny, and to terrors that might well cause shuddering. We have now to ask a more difficult question: why did those lines of In Memoriam affect Eliot so exceptionally, move him to use ‘shudder’ as a laudatory critical term? Who Owns Kafka? Judith Butler, 3 March 2011The very question of where Kafka belongs is already something of a scandal given the fact that the writing charts the vicissitudes of non-belonging, or of belonging too much. Remember: he broke every engagement he ever had, he never owned an apartment, and he asked his literary executor to destroy his papers, after which that contractual relation was to have ended. Memories of Amikejo: Europe Neal Ascherson, 22 March 2012In the mid-20th century the last airholes in the European pressure-vessel were sealed up, and the heat turned up high. Fortunately the vessel burst before it could reduce everything, all our cities, all our persecuted peoples, to ash. And yet even now, in diligently humane times, Europe is a place in which pressures, some creative and some destructive, repeatedly build up. Marx at 193 John Lanchester, 5 April 2012 Can capitalism evolve new forms to deflect the seemingly inevitable crisis, or do we need some entirely different social and economic order? A Rumbling of Things Unknown: Marilyn Monroe Jacqueline Rose, 26 April 2012 Monroe’s beauty is dazzling, blinding. Of what, then, is she the decoy? Royal Bodies Hilary Mantel, 21 February 2013 Our current royal family doesn’t have the difficulties in breeding that pandas do, but pandas and royal persons alike are expensive to conserve and ill-adapted to any modern environment. Destiny v. Democracy: The New Deal David Runciman, 25 April 2013The New Deal was fracturing, but the impetus behind it was far from over. One of the distinctive features of Ira Katznelson’s book is that he sees the New Deal period as extending well beyond the 1930s. The mid-20th century was the age of ‘fear’ and there was still plenty to be afraid of."
author = "LRB"
year_published = 2010
