["https://lrb.co.uk/collections/living-by-the-clock"]
title = "Living by the Clock"
full_description = "Time, Gentlemen, Please David Cannadine, 19 July 1984As someone once said, although we do not know exactly when, time is of the essence. It can be given or taken, saved or spent, borrowed or beaten, kept or killed. There are old timers and egg timers, time bombs and time tables, time signals and time machines. There is half time and full time, short time and over time, standard time and local time, the best of times and the worst of times. There is a time to be born and a time to die, a time to break down and a time to build up, a time to reap and a time to sow. Time Unfolded: Powell v. the World Perry Anderson, 2 August 2018Powell’s imagination was deeply historical, as Proust’s was not. He was also much more deeply conservative. That could easily have led to a threnody of time past, not individual as in A la recherche, but political and cultural. What checked any such move was the other side of his conservatism, conviction of the constancy of human nature, which he shared with Proust. Adventures at the End of Time Angela Carter, 7 March 1991All writers of fiction are doing something strange with time – are working in time. Not their own time, but the time of the reader. Time after Time Stanley Cavell, 12 January 1995Thoreau’s idea is that time has not touched the thoughts and texts he deals in. What chance is there for us to share his faith today, now? When is now? Love with Time Let in: ‘The Winter’s Tale’ Barbara Everett, 8 January 2004The care for time in The Winter’s Tale, that is, is not precisely or primarily a matter of ‘seasons’, or of what the undeveloped Imogen, like her husband, defines as the belief that ‘seasons comfort’. Beyond and within time stand love and nature, which are faculties of the human. On Writing a Memoir: Living by the Clock Edward Said, 29 April 1999I was given my first watch, an insipid-looking Tissot, at the age of 11 or 12; for several days I spent hours staring at it, mystified by my inability to see its movement, constantly worried that it had stopped."
