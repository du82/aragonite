["https://lrb.co.uk/collections/in-hyperspace"]
title = "In Hyperspace"
full_description = "My Year of Reading Lemmishly Jonathan Lethem, 10 February 2022Stanisław Lem was incommensurable – to SF, to literature, to himself. He was so many different writers – five, at least. I had too much to read. I risked missing the centenary in mute tribute. In Hyperspace Fredric Jameson, 10 September 2015The time-travel story literally depicts the physical conditions of ‘the Place’ where the ‘points’ from which we ‘view’ plots unfolding must be presumed to abide. But modernity has in fact invented such a hyperspace from which to observe the observer: it is called the camera. Ready to Go Off Jenny Turner, 18 February 2021Kindred is an act of generosity, an embodiment of the hope that one day, it will be nothing to write home about when a Black woman sits in her new house with her white husband, happily surrounded by piles and piles of books. History, Octavia Butler often said, is also ‘another planet – the only one we know to bear any life’. Out of the Gothic Tom Shippey, 5 February 1987Sometimes, one has to say, Science Fiction just seems too crowded. Too many people have had too many ideas, and now they come too cheap. It’s not Jung’s, it’s mine: Language-Magic Colin Burrow, 21 January 2021Ursula Le Guin was able to direct a whole array of ‘what if?’ questions against the conventions of children’s fantasy. What if you don’t need heroic quests? What if keeping going and tending children through damage and disaster and getting home is the form of heroism that matters most? What if girls can be dragons? Kick over the Scenery: Philip K. Dick Stephanie Burt, 3 July 2008Where other SF asks whether made-up entities (aliens, androids, emoting computers etc) deserve the respect we give real human beings, Philip K. Dick more often asks whether we ought to view ourselves as fakes or machines. On the Make: Jonathan Lethem Thomas Jones, 6 September 2001In Gun, with Occasional Music, the erasure of the individual memory is the final stage in a process that began with the elimination of the public record, of newspapers and books. Lethem’s dystopia is a version of the end of history."
