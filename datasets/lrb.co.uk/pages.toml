["https://lrb.co.uk/collections/a-child-let-loose"]
title = "A Child Let Loose"
full_description = "Orphans Joan Aiken, 17 July 1980The great virtue of the orphan story, I believe, and the reason why it has survived for so many centuries and will continue to do so, is that, when it comes to essentials, we are solitary beings; we are born alone, die alone, sleep alone, dream alone; stories about orphans are an instinctive means of acclimatising children, at an impressionable age, to this grim but pertinent fact. No Strings: Pinocchio Bee Wilson, 1 January 2009Carlo Collodi knew that real children are not so innocent. No matter. The power of the Disney Pinocchio myth has little to do with the business of becoming honest, brave and unselfish – the surface moral. It is about the pathos of a child let loose in a world of grown-ups. You must not ask Marina Warner, 4 January 1996The sustained parody of adult wooing in Lewis Carroll’s entertainments was part and parcel of that delighting delinquency that buoys the humour of both Alice in Wonderland and Through the Looking Glass as well as the wondrous nonsense poems, like ‘The Hunting of the Snark’. Carroll used childishness to mock pompousness and authority and rules and regulations; the little girl offered him a vehicle. Can you spot the source? Wendy Doniger, 17 February 2000Young Harry Potter’s parents are dead. So far, so good: many of the heroes and heroines of the classics of children’s literature are orphans, while others have invisible, unmentionable or irrelevant parents. The sorrow of grieving, not to mention the terror of helplessness, is quickly glossed over in favour of the joy of a fantasised freedom. (A particularly sharp 13-year-old patiently explained to me that if Harry’s parents weren’t dead, there would be no point in writing the book: it wouldn’t be interesting, no matter how many creative details there were.) Bang, Bang, Smash, Smash: Beatrix Potter Rosemary Hill, 22 February 2007Like Victorian children Beatrix Potter’s characters often live in the hidden parts of a house and their excursions into forbidden areas, the parlour or the kitchen or the vegetable garden, are fraught with danger, while like all children they are constantly at risk of being suddenly picked up and carried away."
