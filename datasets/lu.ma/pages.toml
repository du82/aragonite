full_description = "Presented byADPListSubscribeYour one-stop-shop for all things happening in the ADPList Community! We feature local meetups, ADPeople chapter events, and official events from ADPList HQ. Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​About the Meetup​🤠 Meet fellow ADPeople at our 7th casual meetup in Austin! Join us for a fun evening full of spirited conversation, casual networking, and community building over good brews and tasty food.​🌮 All designers, researchers, product people, entrepreneurs, engineers, and tech friends are welcome to register. You don't have to be a member of ADPList to come see what we're all about.​🌟 Hosted by ADPList Mentor Tharun Sure.​About ADPList​ADPList is a global community of mentors and learners, a community that was founded in 2021 with a mission to democratize mentorship for all. It has since grown to 30,000+ mentors who have mentored more than 100 million minutes in 141 countries across the globe. Our community gatherings are a great opportunity to meet new ADPeople, build community, talk shop, and get inspired.​👉 If you are an ADPList Mentor, we invite you to join our exclusive Mentor Slack Community! Email community@adplist.org for assistance.​​🫶 ADPList events and meetups are a safe, open and inclusive space for all. By participating, you agree to adhere to our community guidelines outlined here.​**Note: At this time, ADPList is not able to sponsor this event. All attendees will be responsible for their own purchases. Presented byADPListSubscribeYour one-stop-shop for all things happening in the ADPList Community! We feature local meetups, ADPeople chapter events, and official events from ADPList HQ."
