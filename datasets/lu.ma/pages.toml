["https://lu.ma/r7thv4gm"]
title = "Special Edition Meetup - LLMs and the Law · Luma"
description = "Nurturing the potential of ideas into viable solutions — BasisTech helps small ventures find their product, attract employees and customers, and prepare for funding and growth."
full_description = 'Presented byBasisTechSubscribeNurturing the potential of ideas into viable solutions — BasisTech helps small ventures find their product, attract employees and customers, and prepare for funding and growth. Ticket Price$20.00Welcome! To join the event, please get your ticket below.Get TicketYou will be asked to verify token ownership with your wallet. ​Join us on March 11 for a special edition of the Davis Square LLM Meetup, tailored for lawyers, entrepreneurs, and investors. This event will explore how legal professionals can harness advanced technologies—including machine learning, artificial intelligence, and large language models—to enhance their work while upholding professional ethics and personal moral responsibilities.​Please join us!​​Who: Lawyers, entrepreneurs, and investors interested in discussing LLMs and AI from a legal perspective​​When: 6:15-8:15pm Tuesday, March 11; doors open at 5:30pm​​Where: BasisTech, 1070 Broadway, Somerville, MA 02144 (directions) is a 10 minute walk from the Davis Square station​​What: Two speakers followed by Q&A. Food and soft drinks will be served.​​Talks​The AI-Powered Lawyer: Ethics & InnovationDallas K. Mosier, Senior Counsel, Gesmer Updegrove LLP​Lawyers traditionally rely on training, experience, and collaboration to serve clients effectively. They navigate legal complexities while considering human factors, risk tolerance, and business context to provide comprehensive solutions. As AI rapidly advances in understanding both law and human behavior, it will likely surpass human capabilities in basic legal tasks soon, with complex functions following in the coming years.​The legal profession has always utilized external tools and partnerships. With the emergence of machine learning, LLMs, and AI systems, lawyers must adapt these technologies into their practice while balancing professional ethics and personal moral obligations.​Dallas will explore current AI applications, ethical considerations, and future implications for legal practice.​The New Frontier: Legal Challenges of Agentic AIUdi Nessimyan, Legal Tech Entrepreneur​The legal landscape faces unprecedented challenges as AI systems evolve from passive assistants to autonomous agents capable of independent decision-making. Unlike traditional AI, Agentic AI can take actions, interact with other systems, and make complex decisions without direct human oversight. This shift raises urgent legal questions about liability, regulatory compliance, contract enforcement, data privacy, and AI’s role as an economic or legal entity.​In this session, we’ll explore:​Who is liable when AI acts autonomously? (Developers, users, or the AI itself?)​Can AI legally enter contracts or commit crimes?​How do existing laws apply to AI-driven financial transactions, surveillance, or cybersecurity?​What happens when Agentic AIs interact, collaborate, or even "collude"?​What legal frameworks are emerging to govern AI autonomy?​We might not have answers to these questions today, but we can and should have an insightful discussion.'
