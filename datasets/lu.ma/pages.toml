title = "Singapore: Interactions over Innovation · Luma"
description = 'Join us for the first session of 2025 "Interactions over Innovation" - a vibrant series of meetups designed to bring together Singaporeans in the research,…'
full_description = '''Presented byTINS Boston Events CalendarSubscribeStay updated with TINS events by subscribing to our calendar—don't miss out on any upcoming gatherings in the Kendall Square area! Approval RequiredYour registration is subject to approval by the host.Welcome! To join the event, please register below. Request to JoinYou will be asked to verify token ownership with your wallet. ​Join us for the first session of 2025 "Interactions over Innovation" - a vibrant series of meetups designed to bring together Singaporeans in the research, technology, innovation, and entrepreneurship space in Cambridge and Boston. This event is organized by SGN (Singapore Global Network) and hosted by TINS (Technology Innovation Studio). Link to our first event in 2024 for more background here (https://lu.ma/9fe2rvy3)​About Special Guest: Sean Gilbert​Sean Gilbert is the Managing Director of the MIT-China Program, MIT-Singapore Program, and the MIT-Australia & New Zealand Program. Sean is responsible for developing projects across this Asia Pacific region with MIT students, faculty, and institutional partners. Key programs include the Fung Scholars Program; the MIT Hong Kong Innovation Node-MISTI Collaboration, industry collaborations for students in Singapore and Taiwan, and a partnership on internships with the Australian Institute of Marine Science in the Great Barrier Reef. Sean founded the Singapore (2002) and Australia & New Zealand (2013) programs and is working on expanding Southeast Asia initiatives. He launched a MISTI Global Teaching Labs initiative in Vietnam in January 2025. Sean also is the Leads for the Center for International Studies Asia regional program and the MISTI AI Impact Area. Prior to arriving at MIT in 2000, Sean co-founded EcoTrends International Co., Ltd in Taipei, importing environmental technologies and products for Taiwan construction sites (1997-2000); and worked for Taiwan-based Panvest Group's Offshore Investment Department on Hawaii hotel investments and automotive and data processing ventures in mainland China (1993-1997). He has also worked in New York as a reinsurance broker at Guy Carpenter & Company, placing European facultative and East Asian treaty risks with international reinsurance companies. Sean holds a Master of Arts in Chinese Studies and a Princeton-in-Asia Teaching Certificate from Princeton University and a Bachelor of Arts in East Asian Studies & Chinese, with a Minor in Southeast Asian Cultural Anthropology, from New York University. Born in Shrewsbury, England; early childhood in Indooroopilly, Queensland, Australia; grew up in Sea Cliff, New York.​​​​📅 Date: 03/10/2025​​​​🕖 Time: 5:30PM - 7:00PM​​​​📍 Location: Cambridge Innovation Center, One Broadway, Kendall Square, MA 02142. Venue: Venture Cafe (Level 5)The Agenda:5:00 - 5:30 PM: Check In5:30 - 5:45 PM: Opening Remarks5:45 - 6:15 PM: Presentation by our guest speaker6:15 - 7:00 PM: Dinner and minglingWe are looking forward to seeing you all!​----​More on the Singapore Global Network - Your friend from Singapore​​​At Singapore Global Network, we are passionate about building connections and creating opportunities for people and businesses. As a team within the Singapore government, we aim to grow Singapore’s overseas networks by building meaningful and lasting relationships with family, friends and partners across the globe.​​​Whether you are a Singaporean living abroad, someone considering a move to Singapore or just curious to find out more about the opportunities here, we want to help connect you with the right people and resources to get you started.'''
