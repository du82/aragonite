full_description = "Presented bymHUB EventsSubscribeJoin the mHUB innovation center's marquee events from networking receptions to fireside chats and conferences. For a list of all upcoming events at mHUB, visit: https://www.mhubchicago.com/events Ticket Price$75.00Welcome! To join the event, please get your ticket below.Get TicketYou will be asked to verify token ownership with your wallet. ​Discover the Future with HardTech Innovation​The mHUB HardTech Summit is your ultimate destination to explore cutting-edge advancements in smart manufacturing, medical devices, clean energy, sustainability, and beyond. Join industry leaders, innovative startups, and forward-thinking investors to shape the future of what's possible with hardtech.​What to Expect at the Summit​Engage with industry experts and thought leaders as they discuss breakthrough technologies, manufacturing policies, and perspectives for startups and investors.​Main stage agenda:​2:00PM - 2:15PM - Opening remarks​2:15PM - 3:00PM - Pioneering Progress: Highlighting Remarkable Breakthroughs from the Midwest​Caleb Brooks, Associate Professor at University of Illinois at Urbana-Champaign, Department of Nuclear, Plasma, and Radiological Engineering​Professor Jian Cao, Associate Vice President of Research and Director of Initiative for Manufacturing Science and Innovation, Northwestern​Dr. Jennifer Hintzsche, CEO & Founder, PherDal Fertility Science​Sihong Wang, Assistant Professor of Molecular Engineering, University of Chicago​Moderator: Susan Martinis, Vice Chancellor for Research and Innovation at University of Illinois at Urbana-Champaign ​3:00PM - 3:30PM - Globalization in the Age of National Resilience​Kevin Kalb, Manager, Business Development, JETRO Chicago​Sameer Ahmed, Consul and Senior Trade Commissioner, Canadian Consulate General in Chicago​Moderator: Manas Mehandru, Chief Operating Officer, mHUB​3:30PM - 4:15PM - Industry Demands and Domestic Strategy in US Manufacturing ​Jacob Babcock, CEO, NuCurrent​Tony Reinhart, Director of Community & Government Affairs, Ford Motor Company​Mark Sami, Managing Partner, West Monroe​Charles Zuhoski, Owner and Chief Engineer, Atlantic Analytics and Engineering, LLC​Moderator: Christy George, President & CEO, Intersect Illinois​4:15PM - 5:00PM - Midwest Rising: How Collaboration is Leading to Big Bets and Big Investment​Colleen Wright, VP Corporate Strategy, Constellation​Alejandra Castillo, Former Secretary of Economic Development Administration​Nina Dudnik, Chief Commercial Officer, Current Water​Harley Johnson, Director and CEO, Illinois Quantum and Microelectronics Park​Moderator: John Pletz, Reporter, Crain's Chicago Business​5:00PM - 5:30PM - Rising Star Pitch Competition (part of the Fourth Revolution Awards)​5:30PM - 6:30PM - Fireside Keynote with Tim Brown, Chair IDEO, and Vice Chair kyu Collective​The Startup Pitch Stage welcomes attendees to hear back-to-back pitches from over 30 of the region's most exciting early-stage startups.​Pitch schedule:​2:30PM - 3:30PM - MedTech: Articulate Labs, Wave Therapeutics , Palm Plug , Madison Scientific Crimson Scientific, Nspire, Neuraura, Lemonaid, Co, EndoShunt, VasoWatch, Oli Technologies ​3:30PM - 4:30PM - HardTech and Smart Tech: Stroma, FixturFab, OtterLocks, Fluid Reality, Skyello, Maxwell Labs, HOOPTEQ, SymGym, CALYX, Framewrks, ParentCo ​4:30PM - 5:30PM - Sustainability and Energy: Sandbox Carbon, Kazadi Enterprises Ltd, Tikal Industries Inc., EcoBriqs, Quasar Solar, NET Energy, Earthics, CyroCellar, Aeternal Upcycling​Step into our prototyping labs to see over 40+ product demonstrations from mHUB startups and discover the next wave of hardtech brilliance.​Open 2:30PM - 5:00PM​End your day on a high note! Celebrate trailblazing innovation with networking, dinner, and awards at Venue West, just a 2-minute walk from the Summit​🎟 Additional ticket required: https://lu.ma/mHUB4REV2025​Thank you, event sponsors: Blue Cross Blue Shield Illinois, Clayco, CSC Leasing, ECI Foundation, Gensler and J.P. Morgan"
