full_description = "​Scrap, Yap & Charm | Atlanta Journal Club Workshop 🍀​Date & Time: Sunday, March 9th, 2025 | 1:00–4:00 PM​Location: Wild Leap Brewery, 125 Ted Turner Dr SW, Atlanta, GA 30303​Price: $23 per person​Parking Details:​Please type “Wild Leap Brewery Parking” into Maps to be directed to the correct lot. Parking is on a first-come, first-served basis, so arriving early is highly recommended to secure your spot.​About the Workshop:​Join us for an afternoon of creativity and connection at our Scrap, Yap & Charm Journal Workshop! ✨ This event offers a relaxing atmosphere for crafting your journal and scrapbook pages, with a special charm station where you can create your own charm bookmark for your journal. Whether you’re a seasoned crafter or new to journaling, you’ll have a blast expressing your creativity alongside fellow enthusiasts.​What to Bring:​Please bring your own journal and any personalized materials you’d like to incorporate into your projects. While we’ll provide shared crafting supplies—including scissors, tape, glue, journaling and scrapbook papers, and charms for the charm station—having your own materials ensures your creations are uniquely yours.​What’s Included in Your $23 Ticket:​Each attendee will receive a Lucky Goodie Bag, which contains:​• A sticker sheet​• A set of washi tape​• A surprise gift​Additionally, your ticket grants you access to shared crafting supplies for the event, including the charm station where you’ll have the chance to create a charm bookmark for your journal!​Seating and Socializing:​Seats are limited and on a first-come, first-served basis. Every seat requires a purchased ticket as we are limited to a certain threshold capacity. We kindly ask that all attendees refrain from placing bags or personal items in empty seats.​Important Notes:​• Limited capacity: Please RSVP only if you’re certain you can attend. If your plans change, notify us at least 48 hours in advance so we can accommodate others.​• No-shows will forfeit their ticket due to the custom nature of the event.​• Attendance implies permission to be photographed or recorded, with resulting content potentially used for promotional purposes.​We can’t wait to craft with you! ✂️💌📓"
