full_description = "Presented byThe Garage Chicago GymSubscribeChicago’s home for lifelong athletes. 🏋️‍♂️ Personal Training, Group Training, & Infrared Yoga @theapartmentchi fueled by Community. #TeamGarage Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​Welcome to Garage Run Club—where every step forward is a win, and the journey is what counts.​Garage Run Club is free and open to runners of all paces. Whatever start time you sign up for, know this: we run on time. We give a 10-minute window, then we’re off. No fuss, no waiting—we respect your time and your commitment to showing up.​Our 3-mile routes switch every 6 weeks to keep things fresh and help you see the city from new angles. Right now, we’re running Route Volume 1 (check it out here) 3/3-4/7.​This isn’t a race—unless you want it to be. If today’s your day to chase a PR, send it. But for most of us, it’s about moving at a comfortable pace and building each other up. If you see someone slowing down, run beside them. Encourage them. Make sure they get back feeling strong and part of the team. That’s the spirit of Garage Run Club. We do hard things together.​When you finish, hand out high-fives, fist bumps, smiles—whatever feels right. Because showing up is everything. Got time? Stick around for the best part: coffee and good vibes. Every Monday.​Let’s go, Garage Run Club!Route Runs 3/3-4/7Monday, March 03, 2025Monday, March 10, 2025Monday, March 17, 2025Monday, March 24, 2025Monday, March 31, 2025Monday, April 07, 2025 Presented byThe Garage Chicago GymSubscribeChicago’s home for lifelong athletes. 🏋️‍♂️ Personal Training, Group Training, & Infrared Yoga @theapartmentchi fueled by Community. #TeamGarage"
