title = "mHUB Fourth Revolution Awards · Luma"
description = "Join the mHUB innovation center's marquee events from networking receptions to fireside chats and conferences. For a list of all upcoming events at mHUB, visit: https://www.mhubchicago.com/events"
full_description = "Presented bymHUB EventsSubscribeJoin the mHUB innovation center's marquee events from networking receptions to fireside chats and conferences. For a list of all upcoming events at mHUB, visit: https://www.mhubchicago.com/events Welcome! Please choose your desired ticket type:Individual Ticket Branded Table​Require Approval Purchase a branded table for priority seating of up to ten guests. If you prefer to be invoiced for this purchase, please email christian@mhubchicago.comGet TicketYou will be asked to verify token ownership with your wallet. ​Celebrate the Midwest’s Hardtech and Industrial Visionaries​The Fourth Revolution Awards is your exclusive opportunity to honor the trailblazers shaping the future of hardtech and manufacturing in the Midwest. This prestigious event highlights groundbreaking innovation, technological advancement, and manufacturing's ability drive economic and social impact, serving as the perfect conclusion to the mHUB HardTech Summit.​By attending, you'll be joining the region's most visionary leaders, innovators, and community changemakers for an exhilarating evening of celebration and connection.​Your Registration Includes:​Full access to the mHUB HardTech Summit 2025​Admission to the Fourth Revolution Awards Cocktail Reception​Opportunities to network with award finalists, industry thought leaders, and peers​Don’t miss the chance to connect with the best and brightest driving innovation at the heart of the Midwest’s manufacturing ecosystem.​​The Event Program:​7:00 PM - 8:00 PM | Cocktails & Appetizers​8:00 PM - 8:30 PM | Remarks & Award Announcements​8:30 PM - 10:00 PM | Networking & Celebrating​​Each year, mHUB presents honorary awards based on exemplary leadership at the forefront of digital and technological transformation within manufacturing. Recipients of the Fourth Revolution Awards 2025 honorary awards include:​Manufacturer of the Year: Pella Corporation​Corporate Champion: Intersect Illinois​Fourth Revolution Champion: Michael Fassnacht ​​Community Empowerment Award​Calumet Area Industrial Commission (CAIC)​Native Sun Community Power Development​Northwestern Farley Center for Entrepreneurship and Innovation​P33​University of Illinois System Office of the Vice President for Economic Development and Innovation​US Center for Advanced Manufacturing​Excellence in Engineering Award​Bart Yang – Nexenior​Charles Murray – Switched Source​Herbie Kirn – Articulate Labs​Michael Finn-Henry – EndoShunt Medical Inc.​Ryan Walsh – Valqari​Innovation of the Year​Clarix Imaging​Nano Caralytics, Inc.​Niron Magnetics​Octane Coffee​PherDal Fertility Science, Inc.​Rising Star Award​AQUA Cultured Foods​Celadyne Technologies, Inc.​Joint Preservation Innovations​PherDal Fertility Science, Inc.​Small & Medium-Sized Manufacturer of the Year​American Midwest Manufacturing Inc.​ICR 24/7 Inc.​MsP'sGFree Inc.​PrefabPads LLC​TCCI Manufacturing​Be Inspired at the mHUB HardTech Summit​Before the awards ceremony, explore the future of hardtech at the mHUB HardTech Summit. With startup pitches, panels, and product showcases, this is your destinationjust for thought provoking experiences and inspiration. ​Key highlights:​30+ startup-pitches​3 panel conversations + a closing keynote​40 hardtech product demonstrations​Endless networking​Thank you, event sponsors: Blue Cross Blue Shield Illinois, Clayco, CSC Leasing, ECI Foundation, Gensler and J.P. Morgan"
