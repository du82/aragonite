full_description = "Presented byBuild ClubSubscribeThe best place in the world to learn AI. Curated with 💜 by the Build Club team Approval RequiredYour registration is subject to approval by the host.Welcome! To join the event, please register below. Request to JoinYou will be asked to verify token ownership with your wallet. ​Melbourne's two largest AI Communities are coming together to bring you a fantastic day of building and co-working!! ​This event is great for those who want to work on their AI products, see what others are building, get to know Melbourne's awesome AI community more, and just hang out and have a great time!​What happens on the day​Note: All of these are completely optional! If you'd prefer to just knuckle down and get some work done, you're welcome to do that.​10AM-10:30AM: Arrival and intros.This is a chance to introduce yourself and get to know the other attendees​10:30AM-11:30AM: DemosA tradition of Build Club days, and one we're sure the MLAI members will love - show us what you're working on!! No one has to do any demos, but we highly recommend showing off what you're working on! It's a great way to get feedback, advice, and inspiration from others!​12:30PM: Group LunchWith plenty of great places nearby, we usually grab lunch as a large group​1PM Onwards: Co-workingThis is the coworking part of the day - where people can buckle on down and get some serious work done.​The event is hosted in the State Library's fantastic StartSpace. ​StartSpace is a community and coworking hub at the State Library Victoria, designed to support early-stage founders and entrepreneurs. They provide access to resources, mentoring, and networking opportunities to help turn business ideas into reality. Whether you’re just starting out or looking to grow, StartSpace offers a vibrant environment to connect, learn, and thrive. ​Anyone can apply to Startspace to access the space for free, and we at Build Club can't recommend it enough!​Non-StartSpace members are only allowed access for the first until 2PM, but are free to continue to work in the public work spaces afterwards.​We recommend arriving at 10AM to get the most out of the day, but you're welcome to come in and out as needed.​Hope to see you there!​​This event is run by Xavier Andueza (Melbourne Co-city lead of Build Club) and Dr Sam Donegan (MLAI).​​Build Club is founded by Annie Liao and a closed membership community of Australia's most ambitious AI builders who are passionate about launching their dreams into reality. ​MLAI is Australia's Machine Learning and Artificial Intelligence Community born in Melbourne. It's our mission to support the creation of 1000 Australian startups by bringing industry and tech people together through fun events and learning.​Follow along at Build Club LinkedIn and Twitter​Follow MLAI Aus on LinkedIn, Slack or our website mlai.au"
