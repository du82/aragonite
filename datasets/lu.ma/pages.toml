title = "FINN Partners X humble ventures: Future of Education Day · Luma"
description = """
A Day of Innovation in Education:
9:25 - 9:30 AM: Welcome || Opening Remarks
Marina Stenos, Managing Partner, FINN Partners
Emily Embury, Senior Partner, FINN…"""
full_description = "Welcome! To join the event, please register below. Registration will close at .RegisterYou will be asked to verify token ownership with your wallet. ​A Day of Innovation in Education:​9:25 - 9:30 AM: Welcome || Opening Remarks​Marina Stenos, Managing Partner, FINN Partners​Emily Embury, Senior Partner, FINN Partners​​9:30 - 10:15 AM: Equipping the Workforce of Tomorrow with Resilience, Hope, and Belonging​Moderator: Scott Wortman, Senior Director, Communications, Battelle for Kids​Speakers:​Beth Silveira, Former WCPSS Senior Director, Innovative and Strategic Initiatives; Senior Director, Battelle for Kids​Sara Stockwell, Former Perrysburg Schools Executive Director of Pupil Services; Senior Director, Battelle for Kids​As the demands of the future workforce evolve, schools are recognizing the need to go beyond teaching academic and technical skills by fostering durable skills like adaptability, communication, and critical thinking. This panel will explore how integrating these essential competencies into core subjects such as math, science, and reading not only prepares students for career success, but also nurtures their personal well-being. Join education experts as they highlight the critical importance of cultivating hope, resilience, and a sense of belonging in students—qualities that are foundational for long-term success.​​10:15 - 11:00 AM: Leveraging Technology for the Future of Higher Education​Speaker: Nuno Fernandes, President, American Public University System​AI and related technologies can be catalysts to more personalized and immersive learning experiences. Higher education leaders must embrace these changes now, in responsible ways, in order to continue making positive contributions to society as a whole. In his presentation, Nuno Fernandes will highlight how technology is rapidly transforming the way students learn – and what this means for the future of higher education. This dynamic presentation will focus on:​How education has evolved over time, and how it will change in the next several years;​How AI itself is improving its value for students;​AI’s potential impact for society and education in particular; ​Realistic use cases for AI in education​11:00 - 11:30 AM: Communications in the Age of Education Disruption​Diana Marszalek, Global Head of News, PRovoke Media​Liz Willen, Executive Editor, The Hechinger Report​A one-on-one conversation between two leading journalists concerning the future of education in 2025. We anticipate a spirited and insightful discussion between the two editors of marquee outlets, PRovoke Media and The Hechinger Report, focused on the impact the new administration will have on education in the U.S. and globally. As we navigate a series of tectonic shifts—everything from AI to workforce readiness, changes in the teaching labor force to education technology coming into its own, major disruptions in higher education and long-established policy priorities—how will the sector continue to find relevance and authority with key audiences and influencers? This 30-minute discussion will illuminate the power of storytelling and high-quality journalism as well as the importance of trusted brands and voices at this unique moment.​11:30 AM - 12:30 PM: Lunch with Food Truck​12:45 - 1:30 PM: The State of K-12 Cybersecurity in 2025 & Navigating Top Threats​Speaker: Randy Rose, VP of Security Operations and Intelligence, The Center for Internet SecurityCyber attacks on K-12 institutions have become an inevitable reality; a staggering 82% of K-12 organizations experienced cyber incidents over the last 18 months. Between bad actors, malware, and now the rise of AI, education institutions have to be more vigilant than ever in their cybersecurity strategy. The Center for Internet Security will unpack findings from their latest cybersecurity report, assessing the K-12 threat landscape. Learn about top threats, concerns, and the most effective strategies in navigating these threats to keep your school, students, and data safe from cyber attacks.​​1:30 - 2:15 PM: Empowering Learners to Collaborate with AI (Carnegie Mellon University College of Engineering)​Speakers:​Jonathan Cagan, David and Susan Coulter Head of Mechanical Engineering and Associate Director of the Human+AI Design Initiative​Christopher McComb, Gerard G. Elia Associate Professor of Mechanical Engineering and Director of the Human+AI Design Initiative​AI is changing the way that we learn and practice STEM. Intelligent systems can provide real-time feedback to learners and are increasingly important in scientific innovation. Increasingly, students are learning how to use AI tools in the classroom. However, it is not sufficient to prepare students to simply master reactive AI tools. Instead, we also need to prepare them to be excellent collaborators with the proactive AI systems of tomorrow. In doing so, this session will emphasize the role of humans as central—not secondary—to drive effectiveness in the AI-enabled future, and the mandate for education to prepare practitioners for this new normal. By reimagining education through the lens of human-AI collaboration, we aim to equip students with the skills and mindset needed to thrive in an increasingly AI-driven world.​2:15 - 3:00 PM: Guardians of Democracy: Libraries Ensure Information Access​Moderator: Jennifer Leitman, CMO, OverDrive​Speakers:​Skip Dye, SVP, Library Sales and Digital Strategy, Penguin Random House​Lisa Varga, Executive Director, Virginia Library Association​Join us for an insightful session exploring the vital connection between literacy, access, and democracy. Libraries cultivate informed citizens through literacy and upskill programs that foster critical thinking, media literacy and civic participation. Learn how libraries are serving as indispensable hubs for lifelong learning and community empowerment for everyone as one of the most trusted local resources.​​3:00 - 3:45 PM: The Ripple Effect: How Teacher PD Shapes the Future STEM Workforce​Moderator: Jeremy Anderson, CEO, National Math and Science Initiative​Speakers:​Robin Johnson Ford MBA, M. Ed. Director, Advanced Academics & Gifted and Talented, Desoto ISD​Andy Smith, Director, Giving & Volunteering at Texas Instruments; Executive Director, TI Foundation​Dr. Kristen Vesely, Director of Advanced Academics, Ector County ISD​Our country relies on the next generation to fill STEM jobs—but how can we make that a reality when students often shy away from STEM and educators lack the confidence and support to teach it effectively? Enter high-quality professional development. This discussion, led by education experts, explores the critical shift from simply cultivating STEM learners to empowering future professionals, emphasizing the role of early, real-world exposure in shaping career readiness. When teachers feel empowered, they, in turn, empower students to become the STEM leaders of tomorrow.​​3:45 - 4:45 PM: Closing Keynote: The Future of Education​Moderator: Liz Willen, Executive Editor, The Hechinger Report​Speakers:​Randi Weingarten, President, American Federation of Teachers​Dr. Leah Austin, President & CEO, National Black Child Development Institute​Doreen Gehry Nelson, Founding Director, Design-Based Learning by the UCLA Graduate School of Education & Information Studies, Center X for the UCLA Design-Based Learning Project; Professor Emerita of California State Polytechnic University, Pomona, School of Education and Integrative Studies; Adjunct Professor in the Cal Poly College of Environmental Design; and was Professor at Art Center College of Design in Pasadena, California, from 2002-present ​​4:45 - 4:50 PM: Closing Remarks ​Marina Stenos, Managing Partner, FINN Partners​Emily Embury, Senior Partner, FINN Partners​5:00 - 6:00 PM: Humble Hang with music, cocktails & more"
