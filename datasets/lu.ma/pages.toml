full_description = "Approval RequiredYour registration is subject to approval by the host.Welcome! To join the event, please register below. Request to JoinYou will be asked to verify token ownership with your wallet. ​Global Insights, Local Impact: Trust, Technology & Collaboration in the Intelligent Age​Honoring the 5th anniversary of 924 CoOp and founder Sequoyah Glenn, and her impact on Atlanta’s innovation ecosystem.​Join Atlanta’s top innovators, strategists, and technologists for an evening of bold conversation and celebration as we bring the World Economic Forum’s 2025 vision back home. This exclusive gathering will unpack the most urgent themes shaping global innovation—from trust and technology to sustainability and AI’s role in reshaping industries.​Together, we’ll explore how Atlanta is poised to lead in this new era, inspired by WEF insights from ATL-based Davos attendees.​📅 Event Details​📍 Location: Stable Kernel Rooftop, 746 Willoughby Way NE, Atlanta, GA 30312📆 Date: Thursday, March 13, 2025⏰ Time: 6:00 PM - 8:00 PM EST​🔥 Program Highlights​🚀 Welcome & Global Innovation Showcase​Mary Elzey – Chief Strategy Officer, Stable Kernel​How Atlanta-based companies are leveraging global insights to break into new markets​The real-world impact of AI: From personalized customer experiences to intelligent automation​🌎 Atlanta’s Global Moment​Doug Busk – Principal, Arvo Advisory | Former Senior Strategist, Google​An inspirational call to action on Atlanta’s rise as a global business hub ahead of World Cup 2026​What business leaders need to know to stay competitive in the Intelligent Age​💡 Davos Insights: The Future of Intelligent Industries​Moderated by Sharon Harris – Chief Marketing Officer, The SH Collective | WEF Alumna​📢 Panelists:🔹 Sequoyah Glenn – Founder, 924 CoOp, WEF Attendee🔹 Ava Toro – Global Lead of Strategic Insights, Reddit, WEF Attendee🔹 Chrissa McFarlane – Founder & CEO, Patientory, WEF Attendee​🔥 What’s on the table?​Rebuilding trust in the digital economy​AI & automation: How they’re reshaping industries & human capital​The next trillion-dollar opportunity: Tech’s role in sustainable growth and ownership​What it takes to lead in the Intelligent Age​🍸 Networking & Celebration​Connect with Atlanta’s top innovators over light refreshments & drinks​Exclusive rooftop experience—because world-changing conversations deserve a world-class view​📌 Dress for the weather – Whether it’s chilly or warm, we’ll channel Davos vibes either way!​🎯 Why Attend?​✅ Get ahead of global trends shaping industries and economies✅ Meet the minds shaping the future of business, tech, and innovation✅ Celebrate 5 years of 924 CoOp’s impact and its future trajectory✅ Gain exclusive insights from leaders who experienced WEF 2025 firsthand​🚀 Secure your spot & be part of the conversation that defines the future."
