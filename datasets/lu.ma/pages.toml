full_description = "Presented byEdge CitySubscribeEdge City convenes people working at the frontiers of tech, science, and society in popup villages around the world. Welcome! Please choose your desired ticket type:Standard 1Kids (2-16 years old) 0Daily kids programming from 3 - 5:30pmStudent 0Please bring your student ID to check-in at the event.Patron (501c3 donation) 0Sun Mar 2 | Opening Day 0Mon Mar 3 | Health & Bio 0Tue Mar 4 | Embodied AI 0Wed Mar 5 | Hard Tech 0Thur Mar 6 | Cities of Tomo 0Fri Mar 7 | Morning Workout 0Workouts Only (8am - 11am) 0Get TicketYou will be asked to verify token ownership with your wallet. ​Edge City Austin - A weeklong unconference focused on frontier tech for human flourishing, featuring lightning talks, collaborative workshops, a hackathon, and daily workouts.Book your stay at Hotel Magdalena and get a FREE ticket!*(please send the booking confirmation to info@edgecity.live)Hackers who commit to build and submit a project during Edge City Austin are also eligible for the discount. If this applies to you, reach out to info@edgecity.live for a discount code.​Stop by Hotel Magdalena for an hour, a day or stay for the whole week. ​What is Edge City Austin?​A Collaborative Unconference: Belding deep discussions, hands-on workshops, and meaningful connection with frontier thinkers. A vibrant prelude to SXSW, it is a space to imagine, and build, a brighter future. ​Exploring the Edges of Innovation: A space to dive into cutting-edge ideas in technology, philosophy, biotech, and more—all while coliving, coworking, and building together.​What You’ll Experience​Sunday, Mar 2​⚡️ Lightning talks and workshops (10am - 3:30pm)​🏆 Opening Evening (4 - 6pm)​🧘 Yin yoga (8 - 9pm)​Mon, Mar 3- Thurs, Mar 6:​🏃‍♂️ Morning Workouts (8am - 9am | 9am - 10am)​💡 Coworking at Keiretsu (9am - 5pm)​👯 Kids activities (3:30pm - 5pm)​📚 Workshops in different themes daily: Mon - Health & Biotech, Tues - Embodied AI, Wed - Hard Tech, and Thurs - Cities of Tomorrow (4pm - 8pm)​🎨 Evening hangs after 8pm​TLDR: Edge City is a society incubator—a space to experiment with bold ideas, cutting-edge tech and living healthy. They typically host 1-2 month long pop-up villages but are keeping this Austin one shorter. It should be a great week.​*We do not offer ticket refunds."
