full_description = "Approval RequiredYour registration is subject to approval by the host.Welcome! To join the event, please register below. Request to JoinYou will be asked to verify token ownership with your wallet. ​🔮 Mujeres a la Vanguardia: Más que un Evento Crypto​🚀 Un espacio de liderazgo, innovación y comunidad​En el marco del Día Internacional de la Mujer, Mujeres en Crypto (MEC) presenta Mujeres a la Vanguardia, un evento diseñado para inspirar, educar y conectar a mujeres que están transformando la industria tecnológica. 🌍✨​Más allá del ecosistema cripto y blockchain, este encuentro celebra a todas aquellas que lideran en tecnología, innovación y emprendimiento. 💡👩‍💻​💜 ¿Qué te espera?​🔥 Charlas Inspiradoras – Historias de mujeres que han impactado la industria con su visión y liderazgo.📚 Workshops interactivos – Aprende habilidades prácticas en blockchain, IA, seguridad digital y más.💬 Paneles de discusión – Conversaciones dinámicas sobre el futuro de la tecnología y el papel de la mujer en la innovación.🤝 Networking & Comunidad – Conecta con referentes del sector y expande tus oportunidades.​📅 Detalles del evento​📆 Fecha: Sábado, 8 de marzo de 2025📍 Ubicación: Concepción Arenal 2989⏳ Duración: 14:00 a 20:00​Las acreditaciones empiezan 13.30 😉 No llegues tarde que te vas a quedar sin merch 😅​🙏 Agradecimientos​Este evento es posible gracias al apoyo de nuestros sponsors:💜 Crecimiento | 🪙 CoinEx | 🔗 HyperCycle | 🔺 Avalanche​Y a nuestros media partners, quienes amplifican nuestra voz y nuestra misión:📰 BeInCrypto | 🚀 Criptocuriosas | 👩‍💻 CryptoGirls | 🏛️ Club Blockchain Di Tella | 🌎 FILSE | ⚖️ FinLaw | 👩‍🚀 Her DAO Global | 🔬 Incubadora UNCUYO | 💡 Mujeres Creando Futuro | ⚖️ Mujeres en Derecho | 🏗️ Observatorio de Género UTN | 🏠 Solow | 🎓 Universidad Nacional de La Plata | 🏛️ Trama ITBA | ⚙️ Universidad Tecnológica Nacional | 👩‍💻 Women Techmakers​💜 Gracias por ser parte de este movimiento​¡Nos vemos en Mujeres a la Vanguardia! 🔮✨"
