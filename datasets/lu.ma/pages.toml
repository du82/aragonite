title = "Underscore VC Pearce Fellows Info Session · Luma"
description = "Join the Underscore team for an information session on our Peace Fellows Summer Program! Founders across any of the academic institutions in Boston are…"
full_description = "Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​​Join the Underscore team for an information session on our Peace Fellows Summer Program! Founders across any of the academic institutions in Boston are encouraged to attend, connect with the Underscore Team, and learn more about the opportunity!What is the Pearce Summer Fellowship Program?Turn your groundbreaking B2B software idea into a reality this summer! Open to academic innovators and spirited leaders from Boston-area institutions, our accelerator isn’t just another startup program—it’s your launchpad into Boston’s thriving tech ecosystem. With applications open through March 31, 2025, this program provides flexible financing (with a minimum $50K uncapped SAFE), a collaborative workspace in Historic Old City Hall, and direct access to our extensive network of potential customers, partners, and industry experts.​​Powered by Underscore VC’s proven track record and community-driven, “open source” investing model, the Pearce Summer Fellows Program offers world-class advisory firepower and dedicated VC mentorship. You’ll benefit from regular one-on-one sessions with our investment team, plus impromptu guidance from seasoned operators and founders from companies like Toast, Klaviyo, Amazon, and Anthropic. With $300M under management and half of our capital invested locally, we’re committed to fueling Boston’s innovation landscape and ensuring that 30% of our founders come from its world-class academic institutions.​​This program is designed for academic innovators—students, researchers, and professors—who embody the spirit of relentless optimism and intellectual curiosity in honor of John Pearce, our co-founder and champion of young entrepreneurs. Whether you’re testing your first hypothesis or ready to scale, the Pearce Summer Fellows Program provides the funding, mentorship, and community you need to transform your bold ideas into world-changing ventures.​​For more information or any questions, feel free to contact academic@underscore.vc"
year_published = 2025
