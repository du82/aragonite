full_description = '''Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​In Austin for SXSW Edu? Work in Gov Tech? Want to network with public minded designers? Come join Open Austin's monthly Design Community of Practice and hear from Mark Janchar about the City of Austin's website redesign.​Agenda:​Mingle (5-min)​"Service Design at the City of Austin" by Mark Janchar (15-min)​Q&A (15-min)​More mingling​About our speaker:Mark Janchar (he/him) is a service designer at the City of Austin's Communications & Technology Management Department. He'll share his experience getting hired into the Service Design Lab within the Office of Design and Delivery in 2018, and working for the Innovation Office, Emergency Operations Center, and the Airport. Mark will also touch on what’s going on with the City’s website, and how his current team, Digital Strategy and Solutions, uses service design to inform that process.Notes:​All Open Austin events are photographed. If you don't want your picture taken, let us know through Eventbrite or in-person during the event.​Check event photos to see parking info.'''
