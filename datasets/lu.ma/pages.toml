["https://lu.ma/9x1ss8b2"]
title = "Creative AI Meetup · Luma"
description = '''Join us in downtown Chicago at 1871 to chat about the current state of creative tools & AI. We'll share an "ICYMI" session as we explore how creative AI tools…'''
full_description = '''Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​Join us in downtown Chicago at 1871 to chat about the current state of creative tools & AI. We'll share an "ICYMI" session as we explore how creative AI tools have revolutionized our workflows. Since our last meetup, the AI landscape has evolved dramatically, and we’re eager to share our latest adventures with curious minds like yours. Plus, we'll have a special guest speaker walk us through his journey as a Principal Product Designer working with AI. Whether you’re a seasoned creative professional or simply intrigued by the possibilities of AI, CreativeAI warmly invites you to join us.​This event will be hosted downtown at 1871, Chicago's global startup innovation hub focused on bringing products, community, and supporters together. 👩‍💻Light food & drinks will be provided 🙌 Hope to see you there!​Design with AI: Raising the Bar / Lowering the Ceiling​We're excited to welcome our guest speaker, Daniel Destefanis, Principal Product Designer at Figma, for an exclusive session. In “Raising the Bar / Lowering the Ceiling,” Daniel will share his inspiring journey—from crafting innovative design tools and Figma plugins to building his first SwiftUI app. Learn how AI tools are reshaping product development, empowering creators to work faster and smarter, and paving the way for the future of UX and product design. Reserve your spot now and get ready to transform your creative process!​About Daniel DestefanisDaniel is a Chicago-based designer currently working at Figma on AI. He’s the creator of multiple design tools and several Figma plugins, and he’s now building his first SwiftUI app in public. https://www.danield.design/​About your host, Chris DurbinChris is a design leader passionate about exploring uncharted problem spaces and building 0-to-1 products that scale. As Design Director at VRChat, I lead design initiatives on one of the world’s largest virtual social platforms, focusing on immersive experiences, creator tools, and innovative monetization strategies that define the metaverse. Prior to VRChat, I spent nearly a decade at Amazon in the games and emerging tech industries. https://www.chrisdurbin.com/'''
