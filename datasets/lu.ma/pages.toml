🌟 Join us for an electrifying meetup, brought to you in collaboration with ODSC and Elastic, where…"""
full_description = "Presented byODSC (Open Data Science Conference)SubscribeSpread awareness of open-source languages and tools within the data science and data-centric community. Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​Ready to explore the cutting edge of search technology? ​🌟 Join us for an electrifying meetup, brought to you in collaboration with ODSC and Elastic, where we'll journey beyond the limitations of traditional TF/IDF and plunge into the dynamic world of machine learning-powered search. See how models are revolutionizing the way we find information!​Huge thanks to BasisTech for supporting our community with venue.​Get a Sneak Peek: Live Demo!​Event Details:​📍Date: Thursday March 6th​📍Time: 6:00 PM - 8:00 PM ET​📍Location: BasisTech, 1070 Broadway, Somerville, MA 02144-2078​What's in Store:​6:00 PM: Doors open! Come on in, grab some food, and connect with fellow search enthusiasts.​6:15 PM: Do MORE with StateLESS Elasticsearch: AJ Meyers, Principal Solutions Architect at Elastic, will unveil the secrets of building Elasticsearch for a modern era.​6:45 PM: Real-Time Semantics: Boosting Data Quality & Search with Kafka, Flink & Elasticsearch, by Zachary Hamilton, Senior Solutions Engineer, Confluent​7:15-7:30 PM: Networking time! Enjoy refreshments and mingle with other attendees.​🌟 Talk Spotlight:​Do MORE with StateLESS Elasticsearch:​How would you build Elasticsearch if it was started in 2024? Decouple compute and storage, outsource the persistence to a blob store like S3, dynamically scale up and down, have the right defaults, and a clear path for developers. This is what we have done!​In this talk, learn how we have redesigned Elasticsearch to do more with a stateless architecture that can run hot queries on cold storage. And see how you can get started with it today.​​​Some useful links:• Get free access to more talks/trainings like this at Ai+ Training platform:https://hubs.li/H0Zycsf0• ODSC blog: https://opendatascience.com/• Slack Channel: https://hubs.li/Q02zdcSk0• Code of conduct: https://odsc.com/code-of-conduct/"
