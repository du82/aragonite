full_description = "Approval RequiredYour registration is subject to approval by the host.Welcome! To join the event, please register below. Request to JoinYou will be asked to verify token ownership with your wallet. ​Mindvyne presents: Data & Drinks – Eliminating Data Silos in Biotech​[Buzzed for Biotech is now Mindvyne]​Biotech startups generate an overwhelming amount of data—but how do you ensure that data is actually useful? Data integration is a major hurdle in biotech, affecting everything from research collaboration to regulatory compliance to AI-driven insights.​This evening event is tailored for startup decision-makers: founders, data leaders, and scientists working in drug discovery, diagnostics, and beyond. Expect an informal yet insightful conversation, followed by quality networking over drinks.​What to Expect​Networking & DrinksConnect with industry peers, swap lessons, and explore collaborations over wine, beer, and appetizers.​10-Minute Roundtable Discussion with Sponsors A quick, insightful discussion with event sponsors on the challenges and opportunities in data integration—focused on real insights, not sales pitches.​30-Minute Actionable Panel Discussion with ExpertsNo long-winded presentations—just real-world insights on making data integration work in biotech.​Moderated by Daniel Dacey – An engaging and informal discussion with industry experts sharing practical strategies for overcoming common integration roadblocks:​Dean Lee - Senior Expert I, Data Science @ Novartis​Jonathan Weiss - Co-Founder @ Basis Digital Biotech​Liyang Diao - Senior Director, Data Science @ ROME Therapeutics​Key Discussion Themes:​✅ Data Silos & Interoperability – How to connect fragmented data across teams, tools, and platforms.✅ Practical Integration Strategies – What actually works in biotech? Lessons from companies that have tackled this.✅ AI & Analytics in a Messy Data World – How to extract insights when data is scattered and incomplete.✅ Actionable Takeaways – Tools, tactics, and next steps for startups to improve data integration today.​​​Sponsors:​​Collaborative Drug Discovery (CDD) offers CDD Vault, a comprehensive, web-based informatics platform for managing and analyzing chemical and biological data. Designed to facilitate secure collaboration among researchers globally, CDD Vault supports the entire drug discovery process, enabling efficient data capture, analysis, and sharing. This platform helps streamline research efforts, optimize decision-making, and accelerate the path from discovery to development in the pharmaceutical and biotech industries.​Reach out to Ralf Felsner to learn more-​​Dovetail BioPartners is your data catalyst for biological discovery. focuses on transforming data into actionable insights for biological innovation. They offer comprehensive data management, analysis, and bioinformatics solutions, tailored to propel research and development in the life sciences. Their approach is centered on enhancing efficiency and effectiveness in scientific inquiry, ensuring that each project not only advances in its specific goals but also contributes to the broader landscape of biological discovery.​Reach out to Daniel Dacey to learn more-​​Organizer:​Mindvyne is your hub for high-caliber networking and collaboration in the life sciences. We curate unique, insightful events that bring together founders, scientists, and industry leaders to foster meaningful discussions and connections.​Beyond events, Mindvyne is building a powerful networking platform to streamline event discovery and professional engagement. Our app will provide:🔹 A centralized event calendar covering key industry meetups, conferences, and networking opportunities.- This is the app's current capability.🔹 Advanced networking features that go beyond LinkedIn, making it easier to connect with the right people on the right topics.Check it out here: www.mindvyne.com​Whether in-person or online, Mindvyne is redefining how life science professionals connect, collaborate, and cultivate impactful relationships."
