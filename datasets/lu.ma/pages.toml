title = "How To Build A Brand On LinkedIn: Showing Up, Not Showing Off | ADPList Syracuse 🇺🇸 · Luma"
description = "Your one-stop-shop for all things happening in the ADPList Community! We feature local meetups, ADPeople chapter events, and official events from ADPList HQ."
full_description = "Presented byADPListSubscribeYour one-stop-shop for all things happening in the ADPList Community! We feature local meetups, ADPeople chapter events, and official events from ADPList HQ. Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​About the Event​LinkedIn is the place for professional networking, career growth, and building a brand—but let’s be honest, it can feel a bit awkward sometimes. Syracuse-based, Kate Erwin will share her insights with the ADPList Syracuse community on how to build a strong, authentic LinkedIn presence without falling into the overused traps we see every day. Join us!​🗓️ March 11 @ 5:00 PM📍 Salt City Market, Community Room​⚡️ Just like our last event in February, we'll have an engaging discussion then venture out to the usual bar we all know and love to enjoy refreshments and continue the conversation.​🐟 All designers, researchers, product people, entrepreneurs, engineers, and tech friends are welcome to register. You don't have to be a member of ADPList to come see what we're all about.​Please note that this event is not sponsored. All attendees will be responsible for their own purchases.​Agenda​5:00 PM: Moderated panel discussion + Q&A [Community Room]6:00 PM: Social mixer + community networking [Salt City Bar]​Guest Expert​Kate Erwin, Fractional Social Media Manager, Ghost Megaphone​Hosts​🌟 ​This event is brought to you by ADPList Mentors Dianna Miller and Gillian Schneider! They've been organizing meetups in Syracuse since May 2024.​​Stay Connected​​📣 Follow ADPList Syracuse on LinkedIn! We'll post updates about new meetups and events.​​➕ Subscribe to the ADPList Community Calendar on Luma and look for the 'Syracuse 🇺🇸' tag.​About ADPList​ADPList is a global community of mentors and learners, a community that was founded in 2021 with a mission to democratize mentorship for all. It has since grown to 30,000+ mentors who have mentored more than 100 million minutes in 141 countries across the globe. Our community gatherings are a great opportunity to meet new ADPeople, build community, talk shop, and get inspired.​👉 If you are an ADPList Mentor, we invite you to join our exclusive Mentor Slack Community! Email community@adplist.org for assistance.​​🫶 ADPList events and meetups are a safe, open and inclusive space for all. By participating, you agree to adhere to our community guidelines outlined here."
