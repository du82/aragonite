We're gathering some of the most thoughtful, curious, and kind folks in Austin for a monthly writing club. You should probably join us!"""
full_description = '''Presented byATX Writing ClubSubscribeIf you can write....you're a writer! We're gathering some of the most thoughtful, curious, and kind folks in Austin for a monthly writing club. You should probably join us! Welcome! Please choose your desired ticket type:I'm bringing a book 📖 For those who are bringing a book to swapI'm NOT bringing a book Your donation goes to supporting local arts in Austin!RegisterYou will be asked to verify token ownership with your wallet. ​What’s better than a good book? A good book and a golden, flaky piece of baklava. And what’s better than that? Adding coffee, beer, and a whole crew of thoughtful, curious people who love great stories and even better conversations.​Now, let’s talk about your SXSW schedule. ​Panels? Cool. Tech demos? Sure. Overpriced cocktails in a packed bar? Been there, but......​where else are you gonna walk away with a new book, a belly full of baklava, and a conversation that’s richer than the honey dripping off your fingers?​How It Works​10–11 AM: Grab a drink, mingle, and check out potential book trades.​11 AM–12 PM: The swap begins! Your book is your ticket in—bring one, take one. It should be newish (no stains, no rips) and something others might actually want to read.​Now keep in mind, this is not:​A lecture​A sales pitch​A "networking opportunity" in disguise. ​We’ve got cozy indoor nooks for deep talks and breezy outdoor seating for Austin outdoor social vibes. ​So....​If you’re the kind of person who’d rather bond over books than small talk… ​and if you believe baklava should be its own food group… ​📖🍻🍯 Presented byATX Writing ClubSubscribeIf you can write....you're a writer! We're gathering some of the most thoughtful, curious, and kind folks in Austin for a monthly writing club. You should probably join us!'''
