full_description = "Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​The Espacio Latino Innovation Hub 2025 at ATX ​Espacio Latino, now in its third year, has grown into the largest Latino side gathering during SXSW.​Designed to amplify representation for Latino builders and entrepreneurs, it has evolved into a central hub for driving innovation, fostering collaboration, and connecting the community with valuable resources.​Presented by Wells Fargo. This year, in partnership with Univision Foundation, we’re diving into the future of wealth, focusing on the transformative role of AI in the workforce, entrepreneurship, with a spotlight on sports and innovation.​📍 Location: ​Q-Branch ​200 E 6th St #310​Austin, TX 78701​Agenda - Espacio Latino ​March 8, 2025​✴️12:00 pm Doors open to the public​🪙12:50 pm Wealth Building and AI: The Future of Financial Growth​Moderator - Ramona Ortega​Arturo Cazares - LBAN​Luis Gonzalez - Wells Fargo​Betsabe Botaitis - Hedera ​Guillermo Diaz - Conectado​🌮1:20 pm Lunch Activation [Tacos & Tequila]​⚽2:00 pm Game Changers: Sports Meets Tech​Moderator - Jesse Martinez​Jennifer Yepez-Blundell​Camilo Isaza​Sandra Lopez​Alex Martinez​💪2:30 pm Breaking Barriers: Entrepreneurship​Moderator - Monica Talan​Sandra Velasquez​Maxeme Tuchman​Gustavo Suarez​Lala Elizondo ​📈3:00 pm Scaling Success​Moderator - Vicky Coello​Maribel Lara​HaKika DuBose Wise (Kika)​Robin Brooks, Senior Advisor, BLK GRVTY​💸3:30 pm Fueling Growth: VC and Capital Access​Moderator - Andres Morin​Jenny Flores​Laura Lucas​Erik Ibarra​🥂4:00 pm International Women’s DayToast​🪇4:30 pm Closing Party: DJ | Bin us in an all-day experience exploring the intersection of technology, wealth tech, sports, and entrepreneurship—and be part of the conversations shaping the future.​Learn, connect & support our thriving community. We will have great swag, food and drinks. See you in Austin! ​Follow us onInstagram: https://www.instagram.com/wealthbuild.ai​LinkedIn: https://www.linkedin.com/company/wealthbuild/​Entry to the event is on a first-come-first-serve basis. We recommend arriving early to secure your spot. A ticket does not guarantee entry if capacity is reached.​"
