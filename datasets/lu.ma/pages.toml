full_description = "Approval RequiredYour registration is subject to approval by the host.Welcome! To join the event, please register below. Request to JoinYou will be asked to verify token ownership with your wallet. ​Come join the SaaS Founders Mixer in Austin, Texas!​If you're a funded founder in town for SXSW, this is your ultimate networking opportunity. Connect with a curated group of innovative founders, investors, and industry leaders in a relaxed setting over drinks and light bites.​Why Attend?​Meet and mingle with like-minded entrepreneurs shaping the future of SaaS.​Build meaningful relationships that could lead to your next big partnership or breakthrough.​Enjoy a fun, vibrant atmosphere at an exclusive members-only Austin club, open for this event!​About the hosts:​​​​​​Deel makes hiring contractors and employees seamless across 150+ countries. They handle payroll, taxes, compliance, immigration, and more so that you can focus more time on building. Today, Deel serves over 25,000 customers from early stage startups to enterprises like Nike, Dropbox, Shopify, and Notion.​Forum Ventures is the leading early-stage fund, accelerator and AI venture studio for B2B SaaS startups. Founded in 2014, we’re on a mission to make the B2B SaaS journey easier, more accessible and successful for early-stage founders. From our Studio to Accelerator to Pre-Seed programming, we have the resources and network to help founders navigate the early stages of their founder journey. Forum is investing in 85+ SaaS companies this year. Pitch us here.​Silverton Partners is focused on funding and mentoring early-stage businesses led by founders who share in its commitment to disrupt growth markets and build enduring companies. Founded in 2006, the firm brings the benefits of its vast network and decades of rich experience to each partnership. Austin-based Silverton is the most active venture capital investor in Texas and has been the initial investor behind visionary companies including WP Engine, Storable, SailPoint, Silicon Labs, TurnKey Vacation Rentals, The Zebra, AlertMedia, Aceable, Self Financial, Wheel, and Billie. For more information, visit www.silvertonpartners.com.​Carta, the industry leader in equity management and valuation software, brings unparalleled expertise and innovation to the table. Designed for founders and investors like you, Carta leads the way in equity management, streamlining processes like cap table management and equity issuance.​Zendesk for Startups empowers startups with the best customer support platform that leverages AI capabilities to accelerate growth. Zendesk knows that startups move quickly, so we've designed an easy-to-use product that scales and provides you with critical metrics in the early days of your company's journey. Apply now to enjoy six free months of Zendesk."
