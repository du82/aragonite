full_description = "Presented bySEEDSubscribeWe're a collective driving decentralized solutions for global challenges within the blockchain space. Approval RequiredYour registration is subject to approval by the host.Welcome! To join the event, please register below. Request to JoinYou will be asked to verify token ownership with your wallet. ​Cátedra Blockchain: Hacia la adopción de blockchain en la enseñanza universitaria​Cátedra Blockchain es un evento que busca generar un espacio de discusión y debate sobre las oportunidades y el impacto de incorporar conceptos fundamentales de blockchain en los planes de estudio de las principales universidades de Argentina.​Convocamos autoridades educativas, docentes, representantes gubernamentales y referentes de la industria blockchain para explorar y debatir sobre cómo actualizar los planes de estudio para brindar las herramientas que demandará el futuro profesional.​Esta iniciativa impulsa la transformación de la formación universitaria y fortalece la preparación de profesionales para los retos de la economía digital.​¡Te esperamos el próximo 28 de marzo desde las 10:00 h en Aleph, Ciudad de Crecimiento, el hub de innovación de Buenos Aires!​📆 Agenda​(Próximamente anunciaremos los disertantes)​10:00 Acreditación ​10:30 Bienvenida y apertura del evento. ​10:40 Charla: Contexto educación en Argentina: Adopción, oferta, oportunidades.​10:55 Panel de docentes universitarios con moderación y Q&A​11:40 Break, desayuno y Networking​12:05 Desafíos pedagógicos en la enseñanza actual.​12:30 Charla Panel: El perfil profesional que buscan las empresas​12:50 Agradecimientos y cierre del evento. ​Aclaración: El programa está diseñado para docentes y autoridades universitarias, independientemente de si sus instituciones ya incluyen contenidos sobre tecnología descentralizada. Durante el evento, exploraremos casos prácticos y experiencias de iniciativas educativas vigentes, fomentando la colaboración y el intercambio de ideas.​¿Te gustaría aplicar como Speaker del evento? Todavía estás a tiempo y puedes hacerlo en el siguiente formulario​💬 Unite a nuestro grupo de Telegram para más información. ​​🐦 Seguinos en Twitter SEED Latam y nuestra nueva cuenta de IG SEEDLatamok para enterarte de próximas iniciativas."
