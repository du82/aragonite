full_description = "Suggested Donation$15.00Pay what you wantTickets1Get TicketYou will be asked to verify token ownership with your wallet. ​Join Film Girlz Brunch and Kinowerks for our first annual Oscars Viewing Party!​We’re rolling out the red carpet (okay, maybe not literally) for a night of movies, mingling, and more in Kinowerks' lounge and theater. Grab a seat, catch snippets of your favorite films on the big screen, and enjoy some tasty refreshments while you take it all in. ​Film Girlz Brunch is sponsored by RM.19 Productions and Players: A Film Industry Podcast with the intention of creating a communal space for femme folks in the film industry to come together and meet. Although our events usually center the filmmaker, please feel free to bring partners and/or any other pals to this one!!! And if you haven’t heard of Kinowerks yet, now’s the time! They’re a North Chicago creative hub built by and for artists—a space where storytellers connect, collaborate, and bring bold ideas to life.​There’s a suggested $15 donation, which helps Film Girlz Brunch keep the magic going with exciting programming all year long!​5:30 PM - Doors Open6:00-10:00 PM - Oscars Viewing​Come for the films, stay for the film girlz—see you there!"
