full_description = "​Este boleto no es reembolsable o transferible para otras fechas. ​​📍Mariscos El Puerto Sports Bar​​4771 Britt Rd​​Norcross, GA 30093​​21+​​Te esperemos en Noche de Despecho en Mariscos Sports Bar & Grill para nuestra edición especial de Día de la Mujer! 💜​Vestimenta SUGERIDA: Morado​​Desde Nashville te traemos el mejor show de Drag latino, con Acacia Mercury y para amenizar la noche, nos estará acompañando Naya Quetzal, reina de Puerto Vallarta! Así que recuerda llevar tus dollar bills para darle una propinita a nuestras drag queens!​​Puertas abren a las 8pm, drag show inicia a las 8:40pm, cocina disponible hasta las 12 am.​​Te recomiendo reservar mesa para personas de 4+.​​Preguntas Frecuentes:​​﻿﻿Cuenta con estacionamiento?​​Si, totalmente gratuito!​​Solo venden Mariscos?​​- No, también cuentan con servicios de parrilla.​​Donde poder ver mi boleto?​​Tu boleto llegará directamente a tu correo electrónico que proporciones al momento de comprarlo. Si no aparece en tu correo, revisa tu Junk Mail.​​Podré comprar boletos en la puerta?​​Si! Ese día habrá boletos disponibles en la puerta, solo si los boletos no se agotan antes.​​﻿﻿Cómo puedo reservar?​​706-371-1331 llamada, WhatsApp o mensaje, o mándame un dm en TikTok (@atlantalatinas) o en Instagram (@atlanta.latinas)​​﻿﻿Será totalmente en español?​​Si, pero nuestra host también habla inglés, podrás cantar lo que gustes!​​﻿﻿Este evento es específico para mujeres?​​Los hombres también tienen su corazoncito así que también son bienvenidos, pero seremos más mujeres!​​﻿﻿No tengo con quien ir, pero me gustaría acudir.​​Habrá una reservación bajo el nombre de Atlanta Latinas para las chicas que irán solas, para que ahí el desamor las una y se vuelvan amigas!! (Sígueme en Instagram como @ Atlanta. Latinas y mándame un mensaje para agregarte a la reservación.)​​Nos vemos pronto dolid@s! 💔​​Tendras que mostrar tu boleto en la puerta."
