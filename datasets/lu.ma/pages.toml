full_description = "Presented byBuild ClubSubscribeThe best place in the world to learn AI. Curated with 💜 by the Build Club team Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​**Sorry had wrong time, coworking kicks off at 1pm sharp today! see you there **​Ready to build your dream AI project? 🚀​​Are you tinkering with AI? Have you got an idea for a problem that AI can solve? Do you want to meet and work alongside other awesome founders working on AI?​​Then you've come to the right place.​​We're launching a global AI builder and entrepreneur community in Sydney.​​Event details​1:00 pm / Kick off + intros​​1:00 pm - 1:45 pm / Pairing up or begin coding​​1:45 - 3:00 pm / Building + coding session​​3:00 pm - 3:45 pm / Snacks, drinks, and networking​​3:45 pm - 5:30 pm / Arrival and settling​​5:30 pm - 7:00 pm / Speed demos + feedback​​7:00 pm / Wrap up​​About Build Club​​Build Club is one of the fastest-growing AI builders communities. We are home to 4000+ founders and builders from all around the world. Here's what we offer:​​Opportunity to demo products and get feedback from the global AI builder community and VCs​​Perks from leading companies like Nvidia, AWS, Stripe, Vercel, and more​​Network and connect with top founders working on AI from around the world​​Frequent Hackathons with Prize pools and rewards​​Follow along at Build Club's LinkedIn and Twitter​​What to expect in this session?​​Networking with other builders with similar mindset​​Brainstorming ideas and problems AI can solve​​Deep working and building session​​Speed demos at the end + feedback ⚡️​Please ensure you are applied to the AI Builder Slack here.​​​​Note​​​​Don't worry if you don't know what to work on. We have plenty of great ideas.​​Not technical? We have many no-code founders building awesome stuff. You should still come.​​Please only attend if you can stay the whole time​​This is hosted by Build Club City Lead"
