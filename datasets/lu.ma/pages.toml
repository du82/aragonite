["https://lu.ma/privacy-policy"]
title = "Privacy Policy · Luma"
full_description = '''Privacy Policy Last updated: 2023-11-28 Luma, Inc. ("us", "we", or "our") operates lu.ma (the "Service"). This page informs you of our policies regarding the collection, use and disclosure of Personal Information we receive from users of the Service. We use your Personal Information only for providing and improving the Service. By using the Service, you agree to the collection and use of information in accordance with this policy. Information Collection And Use While using our Service, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you. Personally identifiable information may include, but is not limited to your name and email address ("Personal Information"). We may share your personal data with third-parties to provide necessary services, including: if you are the host of an event, we will share your personal data with your guests; when you register for an event, we will share your personal data with the event host; and when you purchase ticket for an event, we will share relevant information with Stripe, our payment processor. We make it clear to you throughout the Service when we share your personal data with third-parties. We have no control over, and are not responsible or liable for the ways those third-parties use your personal data. Any information shared from our short code SMS program will not be shared with any third-parties for marketing or other reasons. Log Data Like many site operators, we collect information that your browser sends whenever you visit our Service ("Log Data"). This Log Data may include information such as your computer's Internet Protocol ("IP") address, browser type, browser version, the pages of our Service that you visit, the time and date of your visit, the time spent on those pages and other statistics. In addition, we may use third party services such as Google Analytics that collect data about your visit. Cookies Cookies are files with small amount of data, which may include an anonymous unique identifier. Cookies are sent to your browser from a web site and stored on your computer's hard drive. Like many sites, we use "cookies" to collect information. You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. However, if you do not accept cookies, you may not be able to use some portions of our Service. Security The security of your Personal Information is important to us, but remember that no method of transmission over the Internet, or method of electronic storage, is 100% secure. While we use commercially acceptable means to protect your Personal Information, we cannot guarantee its absolute security. Data Retention We retain your personal data in order to provide a consistent service. We retain different types of data for different lengths depending on the type of data and what it is used for. We will retain your Personal Information for the period necessary to fulfill obligations to the law. Third-Party Web Sites and Applications The Service contains links to third-party web sites and applications. Clicking on these links may allow those third parties to collect data about you. We do not control such web sites and applications and are not responsible for how they collect or use your data. Google and YouTube We use the Google and YouTube APIs to embed videos, upload videos to YouTube, and pull other associated data. Accordingly, we comply with YouTube's Terms of Service and Google's Privacy Policy. Luma's use and transfer to any other app of information received from Google APIs will adhere to Google API Services User Data Policy, including the Limited Use requirements Your Rights Where and when required by the law, you have the right to request access, correction or erasure of your personal data. We may need to request information from you to confirm your identity. If while using the Service, you grant us access to any external account of yours, for example your Zoom account, you may revoke such access at any time and we will delete the associated data. Changes To This Privacy Policy This Privacy Policy is effective as of the date above and will remain in effect except with respect to any changes in its provisions in the future, which will be in effect immediately after being posted on this page. We reserve the right to update or change our Privacy Policy at any time and you should check this Privacy Policy periodically. Your continued use of the Service after we post any modifications to the Privacy Policy on this page will constitute your acknowledgment of the modifications and your consent to abide and be bound by the modified Privacy Policy. If we make any material changes to this Privacy Policy, we will notify you either through the email address you have provided us, or by placing a prominent notice on our website. Contact Us If you have any questions about this Privacy Policy, please email us at support@lu.ma.'''
