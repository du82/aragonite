title = "Rethinking Work in the Age of AI: Beyond the Hype & Fear ✨ | ADPList Chicago x Uber 🇺🇸 · Luma"
description = """
Conversations about AI often swing between extremes: overblown hype on one side, and job-stealing fear on the other.
This event is a real talk with industry…"""
full_description = "Presented byADPListSubscribeYour one-stop-shop for all things happening in the ADPList Community! We feature local meetups, ADPeople chapter events, and official events from ADPList HQ. Event FullIf you’d like, you can join the waitlist.Please click on the button below to join the waitlist. You will be notified if additional spots become available.Join WaitlistYou will be asked to verify token ownership with your wallet. ​Conversations about AI often swing between extremes: overblown hype on one side, and job-stealing fear on the other.​This event is a real talk with industry leaders—from Uber, Microsoft, Creathinks and beyond—who are actively integrating AI into their work. ​Key Discussion Points:​✅ AI & Productivity: Is AI truly making us more creative and effective, or just adding more noise?✅ Human-AI Collaboration: How do we shift our mindset to leverage AI for optimal results?✅ Leadership in AI: What practical steps can corporate leaders take to educate teams, reduce fear, and build AI literacy?✅ Breaking the Clichés: AI won’t “replace” people—but it will change expectations. How do we adapt and take control of this shift?​This is not another AI hype session.​It’s a conversation about demystifying AI from a human standpoint, exploring real-world applications, and discussing how we can use AI to come together—not compete against it.​🚀 Join us for a constructive, no-BS conversation about the future of work and AI.​How to Attend?This is an exclusive event with spots limited to 40 people. 🔹 Register only if you are sure you will come.🔹 Registration will need to be approved by hosts.🔹 Registration closes 5 days before the event.​📅 Agenda:​🕦 5:00 PM – Doors Open & Social Hour 🕛 5:30 PM – Event Introduction 🕧 5:45 PM – Panel Discussion🕧 6:30 PM – Q&A🕒 7:00 PM – Networking 🕒 7:45 PM – Doors Close​✨ Spots are limited, so be sure to register if you are confident about coming!​How to Attend?!!! This is an exclusive event with spots limited to 40 people!!!🔹 Register only if you are sure you can attend.🔹 Registration will need to be approved by hosts.🔹 Registration closes 5 days before the event.​ADPList Chicago Team 🇺🇸​​​​This event is planned and hosted by Ambassadors representing the ADPList Chicago chapter!​​🏙️ City Host: Mila Shumilina📣 Speaker Lead: Chloe Na​🎨 Creative Lead: Aaron Montanez​🎨 Creative Team: Sanjana Shah, Arjo Bhattacharya, Sherry Yu🏛️ Venue Lead: Arzoo Mittal🥗 Nourishment Lead: Onur Kocan​​How to Get Involved​​​​1. ​Follow us on LinkedIn & Instagram!​​2. ​Bookmark our official page.​​3. ​Subscribe to the ADPList Community Calendar to stay in-the-know on all of our upcoming meetups and events.​​4. Interested in sponsoring a future event like this one? Email us at adplistchicago@gmail.com​About ADPList​​​​​ADPList is a global community of mentors and learners— a community that was founded in 2021 with a mission to democratize mentorship for all. It has since grown to 24,000+ mentors who have mentored more than 100 million minutes in 141 countries across the globe. Our meetups are a great opportunity to meet new people, build community, and talk shop.​​​​​👉 If you are an ADPList Mentor, we invite you to join our exclusive Mentor Slack Community! Email community@adplist.org for assistance.​​​​​​🫶 ADPList events and meetups are a safe, open and inclusive space for all. By participating, you agree to adhere to our community guidelines outlined here.​​​​​All ADPList Chapter Events are free and accessible to all, thanks to our generous sponsors.🌱 Nourishment Sponsor​Creathinks is a creative innovation tool powered by AI, designed to inspire and support artists, designers, and strategists in generating transformative ideas. It serves as a think-tank for visionary concepts by blending art, design, and technology insights to unlock layered, unconventional solutions tailored to each user’s needs. Through concise, imaginative, and contextually relevant guidance, Creathinks fuels boundary-breaking creativity for professionals and creatives eager to rethink possibilities and drive impactful change.​🏙️ Venue SponsorUber is a technology company that connects the physical and digital worlds to facilitate movement at the tap of a button. Founded in 2009, Uber has expanded its services beyond ride-hailing to include food delivery through Uber Eats, freight transportation with Uber Freight, and business solutions via Uber for Business. Operating in over 70 countries and 10,500 cities worldwide, Uber is committed to making movement accessible, safe, and sustainable for all, regardless of gender, race, religion, abilities, or sexual orientation."
