["https://lu.ma/vg4vkwjp"]
title = "✨ ayana x Cherub 2025 Founders Panel 🚀 · Luma"
description = """
Join the ayana Foundation & Cherub for an exciting kickoff for week of energized networking and connections! 🚀
📅 Date: Friday, March 7th | 4:00 pm - 7:00…"""
full_description = '''Presented byayana FoundationSubscribeayana, a 501(c)(3) foundation, uplifts women founders worldwide through education, community, and enhanced access to funding. Welcome! To join the event, please register below. RegisterYou will be asked to verify token ownership with your wallet. ​Join the ayana Foundation & Cherub for an exciting kickoff for week of energized networking and connections! 🚀​📅 Date: Friday, March 7th | 4:00 pm - 7:00 pm📍 Location: Own HQ (1114 E Cesar Chávez St Austin, TX 78701)🤝 In Partnership With: ayana, Beebizy, Cherub, Chloe Capital, Justworks & Own🌟 About: Mark your calendars - the ayana Foundation and own. is thrilled to host a dynamic event celebrating the vibrant community of entrepreneurs in Austin! Whether you're a seasoned founder, an emerging entrepreneur, or an investor, this event is designed to spark meaningful connections and provide valuable insights.​What You Can Look Forward To💬 Expert Founder Panel | 4:00 pm - 5:00 pm"From Startup to Sell: Real Talk on Exits & Acquisitions": A must-hear with founders discussing exit strategies, personal entrepreneurial journeys and sharing actionable steps to prepare for an exit or acquisition.​​Panelists:​​Kendra Scott - Founder & CCO | Kendra Scott​Kendra Scott is a billion-dollar namesake brand, known for its innovative jewelry, vibrant designs, and commitment to philanthropy. What started in 2002 with just $500 and a tea box of jewelry has grown into a global lifestyle brand with over 150 stores and 3,200 employees. Dedicated to empowering women and youth, Kendra has donated over $70 million to causes through her company and the Kendra Scott Foundation, and founded the Kendra Scott Women’s Entrepreneurial Leadership Institute (KS WELI) at UT Austin. A recurring Shark on ABC’s Shark Tank and a board member of the Breast Cancer Research Foundation, Kendra continues to lead with her philosophy of Family, Fashion, and Philanthropy from Austin, Texas.​Miki Agrawal - Founder, Chief Creative Officer | TUSHY​Miki Agrawal is a trailblazing entrepreneur, speaker, and two-time bestselling author renowned for founding disruptive companies like TUSHY and THINX. A "Young Global Leader" recognized by the World Economic Forum and named one of Fast Company's "Most Creative People," Miki infuses her talks with two decades of boundary-pushing business experience, captivating audiences with her insights into innovative marketing, product development, and business scaling. With a track record of building two nine-figure companies that disrupted two industries, Miki is now channeling her entrepreneurial spirit into her third venture, Hiro Technologies, aiming to solve the global plastic crisis with nature-inspired plastic eating mushrooms.​Adriana Carrig - Founder & CEO | Little Words Project​Little Words Project is a jewelry brand dedicated to spreading kindness and self-love through affirmation bracelets. Inspired by her own experiences with bullying, Adrianna launched the company in 2013, growing it into a multi-million-dollar brand with national retail partners like Target and Nordstrom, and a fan base that includes Selena Gomez, Alicia Keys, and Taylor Swift. Committed to philanthropy, her Little Words Big Impact initiative has raised over $1 million for meaningful causes, and she founded Herself Co., a nonprofit empowering young women through confidence education. Named Entrepreneur of the Year by Ernst & Young, Carrig has been featured in Forbes, TODAY, and Inc., and in Fall 2024, she published her first book, The Power of Little Words.​Kelly Ann Winget - Founder & CEO | Alternative Wealth Partners​Kelly Ann Winget is a visionary leader in alternative investments and the driving force behind Alternative Wealth Partners (AWP). She has raised nearly $1 billion in private capital, driven by a mission to bring institutional-grade investments to a diverse base of investors. At AWP, she leads a team specializing in non-correlated assets like oil and gas, private equity, and venture investing, all aimed at serving “everyday millionaires.” Committed to financial inclusivity, she advocates for investors who seek sophisticated options beyond traditional avenues. Kelly Ann shares her insights through LinkedIn, her book Pitch the Btch, and keynote appearances at events like Alts Expo and Women’s Venture Summit. Her insights have been featured in prominent media like Forbes, Fast Company, Inc. and NASDAQ. Through AWP, she continues to redefine wealth as a means of empowerment, paving the way for impactful investments across diverse communities.​Moderator: Jaclyn Johnson - Co-Founder | Cherub; Founder & Chief Creative Officer | Create & Cultivate​Jaclyn Johnson is a serial entrepreneur with an impressive track record, she sold her first business by the age of 28 and went on to build and sell her second multimillion-dollar company, Create & Cultivate, before turning 35. Recognizing a gap in resources, events, and community for female entrepreneurs, she launched Create & Cultivate as a first-of-its-kind platform that connects brands of all sizes to uplift and empower women in business. Through her work, Jaclyn has built and scaled businesses that make a lasting impact, cementing her status as one of the most well-known and respected female entrepreneurs today. Named a Forbes 30 Under 30 and Adweek Disruptor, Jaclyn has been featured in Fast Company, LA Times, Entrepreneur, and more. She is a thought leader for millennial and Gen Z women navigating their careers, offering insights on everything from starting a business to breaking barriers in leadership. Her passion for supporting underrepresented founders led her to launch Cherub, a marketplace connecting entrepreneurs with investors. ​🍸 Founder & Funder Happy Hour Mixer | 5:00 pm - 7:00 pmSponsored by Bowery Legal & Chloe CapitalProvided by Bloom Nutrition, Brae, Chareau, GutPersonal, Jeng, Kif Kefir Water, Mixim, Mom Juice Wine, Not a Celebrity Tequila, Rejuvenation, RingaA casual, fun space where founders and funders can connect and spark new opportunities ✨🎁 Cherub Angel ATMPowered by PerchMeet the 30+ brands ParticipatingFilled with products from Cherub brands who are actively fundraising. Low on deal flow? The first 100 angel investors who show their Cherub profiles at the Cherub Angel ATM will get a token to test before you invest. 💎 Kendra Scott | Merch Pop-Up20% of proceeds will go to the ayana FoundationAn exclusive shopping experience featuring iconic jewelry and accessories. ​📿 Little Words Project | Charm Bar Pop-UpAn interactive Charm Bar where guests are invited to adorn their bracelets with personalized charms that reflect their unique stories and personal affirmations. ​🎸 Live, Local Music from Anne B. Johnston | 5:00 PMJoin Anne B. Johnston, founder of Created and a Forbes Top Next-Gen Wealth Advisor, as she redefines finance - making it clear, approachable, and even beautiful. Through Fin Rock™, Anne blends financial education with rock and roll to empower people to take command of their financial lives.​🌮 Delicious Light BitesSponsored by Farmers Fridge & Partake Foods​📸 High Quality Content CaptureBy Ben Porter Photography👯 Why Attend?This is more than just an event—it's a celebration of community, innovation, and collaboration. Whether you're looking to learn from the best, connect with potential partners, or simply celebrate the incredible Austin entrepreneurial landscape. ​--------By registering for this event you consent to:-Being photographed, filmed, and/or recorded for promotional purposes by the event organizers for use in event-related materials, including but not limited to: social media, websites, and promotional materials.-Being notified about this event and future communications from ayana and Cherub - you may unsubscribe at any time.'''
