["https://lua.org/wshop06.html"]
title = "Lua: workshop 2006"
full_description = "A Lua workshop will be held at the R&D site of Océ Technologies b.v., Venlo, The Netherlands on September 4-5, 2006. The main goal of the workshop is to allow the Lua community (or at least part of it) to get together and meet in person and talk about the Lua language, its uses, and its implementation. Another goal is to help spread the word about Lua to the industry and academia, taking advantage of the location of the workshop. The workshop is open to everyone interested in Lua. There is no registration fee but participants are required to register. Mon Sep 4 9:00 Registration 9:25 A Word of WelcomeRoelof Hamberg, Océ Software Development 9:30 The Aranha Web App platformDaniel Silverstone 10:00 Lua and the Palm OSMatthew Burke 10:30 coffee break 11:00 The Evolution of LuaRoberto Ierusalimschy 12:00 lunch 13:30 LuaTeXHans Hagen 14:00 Developing desktop solutions with LuaAshwin Hirschi 14:30 Open Platform for Personal RoboticsDennis Taapken 15:00 Kepler/LuaForge next stepsAndré Carregal 15:30 coffee break 16:00 round table discussion 17:00 closing 17:30 buffet dinner Tue Sep 5 9:00 Exception patterns in LuaJohn Belmonte 9:45 MeLua - Lua for representing musical scoresChristof Schardt 10:00 Distributed programming in LuaNoemi Rodriguez 10:30 coffee break 11:00 Simulation of complex systemsWim Couwenberg 11:20 Websites with Lua - Lumikki web page creation toolsAsko Kauppi 12:00 lunch 13:30 NancyReuben Thomas 13:35 Crazy Ivan RobotErik Hougaard 14:30 Building Smalltalk with Lua (A Smalltalk to Lua Translator)Markus Fleck-Graffecancelled 15:00 WeaveGavin Wraith 15:30 coffee break 16:00 round table discussion 17:00 closing Please note: You are visiting a Research & Development site. The workshop takes place only at the ground floor of the main building (where you enter.) All other locations are strictly off-limits. We thank you for respecting this restriction. For all of you who are staying in hotel Venlo: The easiest way to get to Océ from the hotel is on foot. See the map below. The entrance (gate 2/3) to Océ is situated in the Hakkesstraat (west) just before the end of the blue line. There is no sidewalk in the Hakkesstraat, please use the bicycle lane along its south edge."
