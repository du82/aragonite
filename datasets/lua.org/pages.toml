["https://lua.org/wshop15.html"]
title = "Lua: workshop 2015"
full_description = "Erlang is well-known for its ability to build scalable, massively concurrent and fault tolerant systems. While it is relatively easy to interface Erlang with Lua this will generally not give Lua access to all these features. Luerl is an implementation of Lua in Erlang which runs natively on the Erlang VM. Lua programs running in Luerl are part of the Erlang system and therefore have full access to all of the features of the Erlang system. This talk will give a brief description of the main properties of the Erlang VM and how Luerl implemented and how it can interact with the Erlang system. It will also show a simple example program demonstrating these features. Shen is an API gateway where new http endpoints can be added at run-time to handle requests. Request handlers are written in Lua and can be dynamically added/removed/updated. The framework is written in Erlang and the talk will focus on our experiences integrating Lua with Erlang; different approaches are evaluated and we present examples how this is used in our backend service for mobile games. This talk will give details of recent improvements for LuaJIT for MIPS32 and MIPS64. It will give insight to MIPS64 porting challenges, problems, as well as the excitement that were encountered in the process. Furthermore, it will give details on improvements done for MIPS32 port, namely MIPS32 soft-float support. In the end, it will present the validation process and final results. LuaJIT compiler offers an efficient mechanism for calling external C functions and using C data structures inside Lua code, named LuaJIT FFI library. The FFI library requires C declarations of the functions and structures that will be used from Lua code. The talk will describe development of a tool that generates these declarations. It generates declarations for marked functions and structures in C code, using the functionalities offered by the Clang compiler. Ravi is a modified version of Lua 5.3 that provides limited optional static typing and an LLVM based JIT compiler; these enhancements are done to improve the performance of Lua. I would like to talk about the implementation of Ravi. I hope to cover how the static typing is implemented, the JIT compilation approach, the challenges and compromises made to maintain compatibility with Lua, and finally the array extensions in Ravi, including example use cases and benefits of the approach."
