["https://lua.org/wshop09.html"]
title = "Lua: workshop 2009"
full_description = "O projeto Kepler vem desde 2004 desenvolvendo m�dulos, ferramentas e padr�es para a comunidade Lua visando a cria��o de uma infra estrutura que facilite a integra��o de projetos no modelo de c�digo aberto. A palestra apresentar� uma breve hist�ria do projeto, suas caracter�sticas e planos para o futuro. O LuaRocks prov� um ferramental para baixar e instalar m�dulos de extens�o para a linguagem Lua. Esta palestra ir� apresentar a ferramenta e discutir as novidades do LuaRocks 2.0, que redefine o sistema de armazenamento de m�dulos tornando-o compat�vel com o carregador de m�dulos padr�o de Lua. Orbit � um framework para aplica��es web em Lua que alia uma maneira declarativa de associar URLs a fun��es da aplica��o � comunica��o f�cil com bancos de dados relacionais. Esta apresenta��o faz um resumo de como o Orbit funciona e mostra um exemplo de como ele pode ser usado como backend de uma aplica��o web din�mica. LuaEclipse � um IDE para a linguagem Lua constru�do sobre a plataforma Eclipse. Apresentaremos seu hist�rico e a arquitetura de sua nova vers�o, que se pretende uma plataforma colaborativa estendida em Linguagem Lua. Incidentalmente, ser�o apresentadas tend�ncias para diversos outros m�dulos que participam da nova vis�o da ferramenta. Sputnik is a content management system designed for extensibility. It works as a wiki out of the box, but can be extended into other things. Nessa palestra n�s descrevemos a cria��o e evolu��o de Lua e discutimos como ela se transformou de uma simples linguagem de configura��o em uma linguagem flex�vel e amplamente usada, com suporte para sem�ntica extens�vel, fun��es an�nimas, escopo l�xico, chamadas finais e corotinas. Essa palestra foi apresentada pela primeira vez por ocasi�o do III ACM Conference on History of Programming Languages. Iremos apresentar uma breve vis�o geral das ferramentas IUP, CD e IM, juntamente com seus respectivos bindings para Lua. IUP � um toolkit para constru��o de interfaces gr�ficas port�veis entre diferentes sistemas. CD � uma biblioteca gr�fica independente de plataforma. IM � um toolkit para captura, armazenamento, processamento e an�lise de imagens. IUP, CD e IM s�o usados em dezenas de aplica��es no Tecgraf que rodam em diversos sistemas. N�s temos um forte compromisso com compatibilidade e portabilidade."
