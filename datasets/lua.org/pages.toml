["https://lua.org/wshop08.html"]
title = "Lua: workshop 2008"
full_description = "A Lua workshop will be held at The George Washington University in Washington, D.C on July 14-15, 2008. Like previous workshops in 2005 and 2006, the main goal of the workshop is to allow the Lua community (or at least part of it) to get together and meet in person and talk about the Lua language, its uses, and its implementation. Another goal is to help spread the word about Lua to industry and academia, taking advantage of the location of the workshop. The workshop is open to everyone interested in Lua. There is no registration fee but participants are required to register. The workshop will be held on GW's Mount Vernon campus. In particular, Monday's session will be held in the Hand Chapel (Pictures: 1, 2, 3, 4; and campus map). Tuesday's session will be held in Post Hall (Picture: 1; and campus map). The A/V facilities include a PC connected to a large presentation screen, plugs if you want to project your laptop, a smart board (Hand Chapel only), a white board, CD/DVD, and a microphone/speakers. If you have any particular requests, please email the organizers. Please Note: if you have difficulty navigating stairs, email Matthew Burke. There is a free shuttle (10 minute ride) from GW's downtown campus. The shuttle leaves every 15 minutes from 23rd and H Streets (except from 6am-10am when it leaves from 21st and H Streets). See here for shuttle details. All parking must occur within the campus boundaries in either the Parking Garage inside the Whitehaven Parkway entrance or the Parking Lot inside the W street entrance. The Parking Lot inside the W street entrance has meters (so probably not a good choice for parking) that are monitored between 7:00am-7:00pm. The Parking Garage inside the Whitehaven Parkway entrance is attended between 7:00am-10:00pm (10 USD for the entire day). See the campus map. Single and double-occupancy dormitory rooms are available on GW's Mount Vernon campus (the site of the workshop). The cost (including tax) for a double-occupancy room is $39.80 per person per night if you are staying one or two nights and $36.35 per person per night if you stay more than two nights. For single occupancy, the costs are $70.70/$64.98 per night."
