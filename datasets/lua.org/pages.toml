["https://lua.org/wshop11.html"]
title = "Lua: workshop 2011"
full_description = "In this presentation we will discuss how Lua has helped the team at Reflexis develop and evolve Reflexis Flow, a model-driven platform for web application development. Since making software usually requires writing (and wrangling) lots of code, this talk will start by explaining how model-driven development tackles things differently. And as there are paradigms aplenty, it will present our particular take on it and why we feel Reflexis Flow provides people with an environment that makes it easy to create solutions for the web that are both flexible and secure. Next we'll show how Lua has enabled the team at Reflexis to take somewhat of a middle ground between a procedural, component-based world view and a more high-level, model-driven mindset, resulting in a web application platform that's straight-forward to use but also easy to extend. While Flow developers don't need to be familiar with scripting, it is fair to say that knowing Lua greatly enhances what they can get out of our platform. Last but not least, this talk will highlight several cases where Lua has really helped our team come up with practical solutions to specific problems. Time permitting we'll also demo some of our tools or a few of the projects completed using Reflexis Flow. SPLAY simplifies the prototyping and development of large-scale distributed applications and overlay networks. SPLAY covers the complete chain of distributed system design, development and testing: from coding and local runs to controlled deployment, experiment control and monitoring. Developers specify their applications using Lua, which is executed in a sandboxed environment. The talk will include a short live demo of a simple distributed protocol in Lua deployed on the PlanetLab. SPLAY is the outcome of research and development activities at the Computer Science Department of the University of Neuchatel, Switzerland. d'Arc offers an alternate and faster way to write C against both Lua and LuaJIT. It is faster, can be easier to write and uses less memory in many cases, than the the official API. d'Arc can be used to make libraries for both Lua and LuaJIT faster, and can make it less of a hassle to write patches that target both Lua and LuaJIT. d'Arc allows you to use direct (cost-less) C pointers to variable contents -- inside the universal Lua variable value holder C structure -- in a clear and unified way. After a brief historical intro, the talk will *primarily* take a closer look at the Lua and LuaJIT VMs. I will inspect how iteration works with the official Lua API and what happens 'under the hood', in both Lua and LuaJIT. I will look at the similarities and the differences in the implementation of the essential variable holder, TValue, in Lua and LuaJIT. Continue with a look at where LuaJIT tweaks things right there and how d'Arc allows you to write single source patches despite the differences. Finally, an easy example will be ported, from using the official API, to using d'Arc. We'll compare how it simplifies the source, and make live benchmarks to measure the difference, and look at pitfalls."
year_published = 2025
clearnet = "https://lua.org/wshop11.html"
