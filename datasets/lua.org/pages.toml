["https://lua.org/slides.html"]
title = "Lua: seminar slides"
full_description = 'Abstract. There is an important trend nowadays to split complex systems in two parts: kernel (written in a compiled language) and configuration (written in an interpreted language). Lua is a new language for configuring and extending applications, Lua combines procedural features with powerful data description facilities, by using a simple, yet powerful, mechanism of tables. This mechanism implements the concepts of records, arrays, and recursive data types (pointers), and adds some object-oriented facilities, such as methods with dynamic dispatching. Lua presents a mechanism of fallbacks that allows programmers to extend the semantics of the language in some unconventional ways. As a noteworthy example, fallbacks allow the user to add different kinds of inheritance to the language. Currently, Lua is being extensively used in production for several tasks, including user configuration, general-purpose data-entry, description of user interfaces, storage of structured graphical metafiles, and generic attribute configuration for finite element meshes. Lua is also being used in several research projects, such as "active" graphical objects, computing with distributed objects, and transparently extending WWW browsers with client-side code.'
