["https://lua.org/lua-l.html"]
title = "Lua: mailing list"
full_description = "Lua-l There is an active and friendly mailing list for discussing Lua called lua-l. The list is one of the focal points of the Lua community. Everyone is welcome to join. The list is open for discussions on all subjects directly related to Lua, including the language, its uses, its implementation, and also for announcements, requests for help, and special job offers. The list has been in continuous operation for over 25 years. It has many subscribers from all over the world, including several Lua experts and the Lua team. Almost 145000 messages have been posted since the list was created in 1997. All messages sent to the list are archived. You can read and search the archive at lua-users.org, at Google Groups, and at MARC. For discussions in Portuguese, join Lua BR. Posting To post a message to the list, send it to lua-l@googlegroups.com or use the interface at the list page. You must subscribe before posting. Be careful when replying to a message posted to the list, because your reply will be sent to the whole list, instead of just to the author. To avoid mixing threads, do not use a reply to start another thread: send a brand new message instead. Post attachments only when they are small; otherwise put them in a website and post the URL instead. Messages with large attachments may be rejected automatically. Everyone is welcome to post, but please get acquainted with the netiquette of the list, especially the part about doing your homework before asking questions. In particular, check whether your question has already been asked (and probably answered) by searching the archive. See also the FAQ and the community-maintained LuaFaq and uFAQ. Don't send administrative messages to the list. If you need, seek help. Netiquette Please take a moment and read some useful information on mailing list netiquette. An important part of netiquette is learning how to quote previous posts, how to ask questions effectively, and how to report bugs effectively. If you need help with code, learn how to prepare a short example. For background information on netiquette, see RFC1855. Subscribing The list is hosted at Google Groups. You don't need a Google account to join but you may need one for reading and interacting with the list using the web interface at Google Groups. To subscribe to the list using your Google account, visit the list page and join the group. To subscribe to the list using a different email account, send an empty message to lua-l+subscribe@googlegroups.com and reply to the message you receive. You must subscribe before posting. You can only post from the address you have subscribed. Postings from an unsubscribed address will be rejected automatically. To be able to post from a different address, subscribe again using that address and turn off delivery for it. Unsubscribing To unsubscribe from the list, visit the list page and leave the group if you have joined with your Google account. Otherwise, send an empty message to lua-l+unsubscribe@googlegroups.com using the account you have joined the list with. If you have trouble unsubscribing, seek help. Don't send unsubscribe requests to the list. Help You can manage your subscription to the list by visiting the list page. For further information, including how to interact with Google Groups, visit Google Groups Help. Search archive"
