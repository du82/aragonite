["https://lua.org/wshop13.html"]
title = "Lua: workshop 2013"
full_description = "McRobot is a module and message based framework for automation. It is used to control various types of machines, such as handling systems, pick and place (SMT) and wire processing machines. This talk will show several aspect of integrating Lua into an existing framework as its primary scripting language. It focuses on the following topics: Binding Lua with a message based framework Writing a custom scheduler for Lua in C Adding debugging support with Eclipse as IDE Building a cross-compiler library for Lua source code to embedded Lua bytecode I will cover the Gitano Git Service (written in Lua) and its attendant technologies: Lace - Lua Access Control Engine Clod - Configuration Language Organised (by) Dots Supple - Sandbox (for) Untrusted Procedure Partitioning (in) Lua - Engine Gall - Git Abstraction layer (for) Lua Gitano - A Git Service written in Lua I will cover the issues encountered and resolved while writing Gitano, some of the current uses of Gitano, and some of the future plans for the technology. Lua, besides its other virtues, is quite easy to learn. Nevertheless, Lua is a programming language, and in order to learn it one must invest a considerable effort to learn to write programs. It is often the case that, on one hand, there is a need to configure lots and lots of business logic intricate and ever-changing rules, but, on the other hand, the person who has the most expertise on the particular business logic area – domain expert – not have any clue on how to write code effectively (or even at all). All kinds of clumsy UIs, spaghetti code, wasted dedicated scripter's hours and other unpleasantries stem from that problem. Our flagship product – Business logic editor toolkit – to alleviate that somewhat by providing a programmer with a set of tools to easily build a business-logic configuration UI, suitable for a non-programmer domain expert, and an easy, platform-agnostic way to seamlessly tie business-logic configuration from that UI to an existing (or newly written) codebase, effectively creating a visual domain-specific programming language. Our toolkit is written in Lua (and some JavaScript), and it is a seventh generation implementation of the concept behind it. In this talk I'll talk a little about the past generations, describe the mechanics behind the current implementation in some detail, and I'll share our thoughts on how the next generation should look like – a new approach on the internal DSL design in Lua. And a promise: no marketing speak in the talk, and as much technical details as I'd dare (and time will permit)!"
year_published = 2025
