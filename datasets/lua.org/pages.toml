["https://lua.org/showcase.html"]
title = "Lua: showcase"
full_description = "Lua is used in many products and projects around the world. Here are some highlights. A different selection is shown every day. GitHub uses Lua scripts in the infrastructure of GitHub Pages, its static site hosting service. Neovim is a popular hyperextensible Vim-based text editor that supports Lua plugins. Celestia is a real-time 3D visualization of space that can be scripted with Lua. LuaTeX, the engine behind most modern installations of TeX, uses Lua as its embedded scripting language. Roblox is an online game platform and game creation system that hosts user-created games of multiple genres coded in Lua. The widely used VLC media player is scriptable in Lua. Nmap, a popular tool for network discovery and security auditing, is scriptable with Lua. Adobe Photoshop Lightroom is mostly written in Lua. Lightroom also supports Lua plug-ins."
