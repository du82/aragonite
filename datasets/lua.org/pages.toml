["https://lua.org/wshop05.html"]
title = "Lua: workshop 2005"
full_description = "The main goal of the workshop is to allow the Lua community (or at least part of it) to get together and meet in person and talk about the Lua language, its uses, and its implementation. Another goal is to help spread the word about Lua to the industry and academia, taking advantage of the location of the workshop. The workshop is open to everyone interested in Lua. There is no registration fee but participants are required to register because only a limited number of seats are available, which will be filled first-come, first-served. Wed July 27 9:00 breakfast 9:30 Io and LuaSteve Dekorte 10:00 Lua and BREWcancelledMarc Nijdam 10:30 coffee break 11:00 The Implementation of Lua Roberto Ierusalimschy 12:00 lunch 1:30 LuaSocket Behind the ScenesDiego Nehab 2:00 It's all glue: Experiences building a desktop application with LuaMark Hamburg 2:30 Lua and Instant MessagingMatthew Burke Embedding Lua into LabViewAlbert-Jan Brouwer Using Lua to Build Domain-Specific LanguagesThomas Wrensch Lua in ATEMarius Gheorghe 3:30 coffee break 4:00 open discussion 5:00 closing Thu July 28 9:00 breakfast 9:30 Embedding Lua in Grim FandangoBret Mogilefsky 10:00 Psychonauts and Lua: a case studyPaul Du Bois 10:30 coffee break 11:00 The Novelties of Lua 5.1Roberto Ierusalimschy 12:00 lunch 1:30 The Kepler ProjectAndr� Carregal 2:00 A Macro Facility for LuaLuiz Henrique de Figueiredo 2:30 Lua for Molecular BiologyYutaka Ueno LuaSynthAlex Mohr Lua Integrated into Embedded LinuxGlenn Edgar A Lua DecompilerHisham Muhammad 3:30 coffee break 4:00 The Future of Luaroundtable 5:00 closing There is no registration fee but registration is required. To register, please fill the form below and send it to lua.workshop@gmail.com. As confirmation, your name will appear in the list of participants. I shall describe an add-on core module for providing a macro facility for Lua via token filters. I shall also show how coroutines are a handy tool for implementing such filters. LabVIEW is a graphical dataflow language used for laboratory and industrial automation. Its dataflow nature posed particular obstacles to embedding that necessitated a yielding calling mechanism as well as cooperative scheduling provisions. The combination of both languages was used to develop a test environment for the European Space Agency. Lua turned out to be capable of performing many different roles."
