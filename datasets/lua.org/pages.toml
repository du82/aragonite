["https://lua.org/wshop14.html"]
title = "Lua: workshop 2014"
full_description = "This talk will discuss the latest developments in the world of LuaRocks, the package manager for Lua modules. It will start by introducing the LuaRocks tool, for those who are not familiar with it. Then, I will present what has changed in this past year: the move to a open repository, automation of the upload process and the latest efforts in making the tool more flexible. A revision of the format for specification files (rockspecs) has been long overdue, and in this talk we'll discuss the changes needed to make the format fully extensible. Currently we are developing an open source platform for Energy Systems Integration for industrial processes using Lua. The purpose of the project is to provide a generic modeling and optimization platform for industrial process integration and their optimization in terms of energy efficiencies and environmental issues. Already at our laboratory, there was a platform, developed on MatLab, for the purpose of Energy Integration. By developing a new generation of Energy Systems Integration platform in Lua, we are targeting the range of integration towards GIS Data integration and LCA issues. The presentation will mainly concern our project content and also our challenge in launching a new doctoral course in Lua. This talk will focus on technical aspects of building a complete Lua framework for scientific users with no or few programming skills. We will cover the strengths of Lua in this project such as, small footprint, speed, painless DSL, quick prototyping, glue language with other system components. We will also discuss some of the weaknesses that we've encountered and how we solved them. The Medusa compiler takes a book source including Lua code, e.g. for puzzles or exercises, and generates a (possibly very large) set of immutable hyperlinked pages. This 'printed once and for all' set of pages mimicks a runtime program behaving like the original code; the author can thus give the impression of complex dynamic behaviour (similar to the logic in modern graphic adventure games) in a static ebook, printed book or static Web site. Some topics of the talk are: From ancient gamebooks to static ebooks: how to represent variables and state. From an old runtime Javascript framework (Idra) to a metaprogramming Lua compiler (Medusa). Compiler structure and design choices; using Lua environments to efficiently handle page states."
