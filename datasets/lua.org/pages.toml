title = "Lua: download"
full_description = "Source Lua is free software distributed in source code. It may be used for any purpose, including commercial purposes, at absolutely no cost. All versions are available for download. The current version is Lua 5.4 and its current release is Lua 5.4.7. lua-5.4.7.tar.gz 2024-06-13, 365K, sha256: 9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30 Tools The main repository of Lua modules is LuaRocks. See also Awesome Lua. Pre-compiled Lua libraries and executables are available at LuaBinaries. The lua-users wiki lists many user-contributed addons for Lua. Building Lua is implemented in pure ANSI C and compiles unmodified in all platforms that have an ANSI C compiler. Lua also compiles cleanly as C++. Lua is very easy to build and install. There are detailed instructions in the package but here is a simple terminal session that downloads the current release of Lua and builds it in Linux: curl -L -R -O https://www.lua.org/ftp/lua-5.4.7.tar.gz tar zxf lua-5.4.7.tar.gz cd lua-5.4.7 make all test If you have trouble building Lua, read the FAQ. If you don't have the time or the inclination to compile Lua yourself, get a binary or try the live demo. Giving credit If you use Lua, please give us credit, according to our license. A nice way to give us further credit is to include a Lua logo and a link to our site in a web page for your product. Supporting Lua You can help to support the Lua project by buying a book published by Lua.org and by making a donation. You can also help to spread the word about Lua by buying Lua products at Zazzle. Lua is free software distributed in source code. It may be used for any purpose, including commercial purposes, at absolutely no cost. All versions are available for download. The current version is Lua 5.4 and its current release is Lua 5.4.7. lua-5.4.7.tar.gz 2024-06-13, 365K, sha256: 9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30 The main repository of Lua modules is LuaRocks. See also Awesome Lua. Pre-compiled Lua libraries and executables are available at LuaBinaries. The lua-users wiki lists many user-contributed addons for Lua."
