["https://lua.org/wshop12.html"]
title = "Lua: workshop 2012"
full_description = '''Textadept is a fast, minimalist, and ridiculously extensible cross-platform text editor for programmers. It is written in a combination of C and Lua. Textadept uses Lua to solve many interesting and complex problems encountered in text editor design, including syntax highlighting, syntax-based code completion, and scripting external C libraries and GUI components. This talk will focus on examining the internals of Textadept, from its innovative LPeg syntax highlighting engine to the embedded Lua scripting environment that provides nearly all of the editor's features. Come learn about Textadept and also about how you can use and extend it to fit your workflow. For the last 11 years, a competitor in the Danish robotic race "DTU RoboCup" has been a Lua driven robot called 'Crazy Ivan'. Crazy Ivan is one of the most successful robots in the competition. The Crazy Ivan robot is designed to drive through a predefined race track and solve different tasks such as climbing stairs, passing a guillotine, playing golf and much more. Lua is used as the programming language for the robot's "brain" and all decisions are taken in Lua. This is the fourth incarnation of the robot, now vision based. During the presentation, Crazy Ivan will be running live on the floor while its "Master" will try to control the action. Anything can? and will? happen! Gemini is an open source library under development that provides functionality for scripting iOS games in Lua. This talk will introduce the features of Gemini including the high performance OpenGl ES 2.0 based graphics system with support for layers, lines, rectangles, ellipses, and sprites. The talk will also discuss the overall architecture of the library including support for events, rendering callbacks (callbacks registered by the user to render specific layers in non-Lua code), and the class hierarchy used in the library. We shall explain the steps taken to modify the NetBSD kernel module, given an overview of functionality and some example uses.'''
year_published = 2025
clearnet = "https://lua.org/wshop12.html"
