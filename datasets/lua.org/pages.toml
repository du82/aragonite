["https://lua.org/manual/5.4/readme.html"]
title = "Lua 5.4 readme"
full_description = '''Lua is a powerful, efficient, lightweight, embeddable scripting language developed by a team at PUC-Rio, the Pontifical Catholic University of Rio de Janeiro in Brazil. Lua is free software used in many products and projects around the world. Lua's official website provides complete information about Lua, including an executive summary, tips on getting started, and updated documentation, especially the reference manual, which may differ slightly from the local copy distributed in this package. Lua is distributed in source form. You need to build it before using it. Building Lua should be straightforward because Lua is implemented in pure ANSI C and compiles unmodified in all known platforms that have an ANSI C compiler. Lua also compiles unmodified as C++. The instructions given below for building Lua are for Unix-like platforms, such as Linux and macOS. See also instructions for other systems and customization options. If you don't have the time or the inclination to compile Lua yourself, get a binary from LuaBinaries. If you're running Linux, try "make linux-readline" to build the interactive Lua interpreter with handy line-editing and history capabilities. If you get compilation errors, make sure you have installed the readline development package (which is probably named libreadline-dev or readline-devel). If you get link errors after that, then try "make linux-readline MYLIBS=-ltermcap". Once you have built Lua, you may want to install it in an official place in your system. In this case, do "make install". The official place and the way to install files are defined in the Makefile. You'll probably need the right permissions to install files, and so may need to do "sudo make install". To build and install Lua in one step, do "make all install", or "make xxx install", where xxx is your platform name. To install Lua locally after building it, do "make local". This will create a directory install with subdirectories bin, include, lib, man, share, and install Lua as listed below. To install Lua locally, but in some other directory, do "make install INSTALL_TOP=xxx", where xxx is your chosen directory. The installation starts in the src and doc directories, so take care if INSTALL_TOP is not an absolute path.'''
year_published = 2025
clearnet = "https://lua.org/manual/5.4/readme.html"
