title = "Lua: workshop 2023"
full_description = "The workshop is open to everyone interested in Lua. No registration is required. Space is limited in the auditorium. The workshop consists of invited talks. Meet the speakers. The event will be held in Portuguese, with one talk in English. 13:30 opening 13:45 Lua como motor de desenvolvimento e inova��o Marcelo Gattass 14:05 Viv�ncias das fases da linguagem Lua: dos prim�rdios � conquista do mundo Thais Batista 14:25 Lua no INPE Gilberto C�mara 14:40 Trajet�ria de um estudante de Lua Anna Hester 15:00 Os primeiros a pisar na Lua Andr� Clinio & Andr� Costa 15:20 Lua no n�cleo Lourival Vieira Neto 15:40 From supporting elephants to controlling shortwave transmitters: 15 years of using Lua for fun and profit Marc Balmer 16:30 break 17:00 Posse como professor titular e aula magistral Roberto Ierusalimschy 18:00 closing Marcelo Gattass is Vice President for Development and Innovation Affairs at PUC-Rio. He is also a professor in the Computer Science Department. He created Tecgraf in 1987 and was its director until recently. Thais Batista is the president of the Brazilian Computer Society and a professor in the Department of Informatics and Applied Mathematics at the Federal University of Rio Grande do Norte. Her DSc thesis at PUC-Rio was on LuaSpace, an environment for using Lua in distributed systems. Gilberto C�mara is senior researcher in GIScience, geoinformatics, spatial data science and land use change at the National Institute for Space Research (INPE). He was director of INPE from 2005 to 2012 and Director of the Secretariat of Group on Earth Observations (GEO) from 2018-2021. Anna Hester is Vice President of Product & Engineering, Windows + Devices at Microsoft. Her MSc dissertation at PUC-Rio was on CGILua, an early effort to bring Lua to the web. Andr� Clinio and Andr� Costa work on distributed systems at Tecgraf. They were one of the first to work with Lua in products. Lourival Vieira Neto is a co-founder at Ring-0 Networks and author of Lunatik, a framework for scripting the Linux kernel with Lua, the theme of his MSc dissertation at PUC-Rio."
