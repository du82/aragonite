["https://lua.org/donations.html"]
title = "Lua: donations"
full_description = "Supporting Lua You can help to support the Lua project by making a donation. Another great way to support the Lua project is to buy a book published by Lua.org. They make great gifts, too! You can also help to spread the word about Lua by buying Lua products at Zazzle. The Lua project is housed and developed at LabLua, a research laboratory of PUC-Rio (a non-profit philanthropic higher-education institution in Brazil). Your contribution will complement the support we need to keep the Lua project running and will allow us to dedicate more effort to it. A nice discussion of the costs of developing free software and a good case for why and how you can contribute to a free software project is made by Mary Gardiner in HOWTO Pay for Free Software. Thank you for supporting Lua! Making a donation To make a donation to the Lua project via PayPal, just click on the button below. Feel free to donate as little or as much as you wish. Every donation is very much appreciated. All donations are confidential and remain anonymous unless you say otherwise. If you'd like to see your name or your company acknowledged publicly as a donor in our thanks page, please let us know. If you wish to make a donation to the Lua project but PayPal is not convenient for you, please contact us to make other arrangements. Buying and promoting a book The books below are published by Lua.org. They are available at the main online stores and also as e-books at Feisty Duck. All proceeds from the sale of these books go directly to support the Lua project. You greatly help the Lua project by buying these books and by promoting them with good reviews. Voting up previous good reviews helps, too! Programming in Lua by R. Ierusalimschy Lua.org, fourth edition, August 2016 ISBN 8590379868 (also available as an e-book) Programando em Lua por Roberto Ierusalimschy LTC, January 2015 ISBN 9788521626992 Programming in Lua by R. Ierusalimschy Lua.org, third edition, January 2013 ISBN 859037985X (also available as an e-book) Lua Programming Gems edited by L. H. de Figueiredo, W. Celes, R. Ierusalimschy Lua.org, December 2008 ISBN 9788590379843 (also available as an e-book) Lua 5.1 Reference Manual by R. Ierusalimschy, L. H. de Figueiredo, W. Celes Lua.org, August 2006 ISBN 8590379833"
