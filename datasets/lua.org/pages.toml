["https://lua.org/versions.html"]
title = "Lua: version history"
full_description = "Here is a chronology of the versions of Lua. The evolution of Lua is documented in a paper presented at HOPL III, the Third ACM SIGPLAN History of Programming Languages Conference, in 2007. The source code and documentation for all releases of Lua are available in the download area. Different releases of the same version correspond to bug fixes. Different releases of the same version have the same reference manual, the same virtual machine, and are binary compatible (ABI compatible). Different versions are really different. The API is likely to be a little different (but with compatibility switches), and there is no ABI compatibility: applications that embed Lua and C libraries for Lua must be recompiled. The virtual machine is also very likely to be different in a new version: Lua programs that have been precompiled for one version will not load in a different version. Lua 5.4 was released on 29 Jun 2020. Its main new features are a new generational mode for garbage collection and const and to-be-closed variables. Lua 5.3 was released on 12 Jan 2015. Its main new features were integers, bitwise operators, a basic utf-8 library, and support for both 64-bit and 32-bit platforms. The last release was Lua 5.3.6, released on 25 Sep 2020. There will be no further releases of Lua 5.3. Lua 5.2 was released on 16 Dec 2011. Its main new features were yieldable pcall and metamethods, new lexical scheme for globals, ephemeron tables, new library for bitwise operations, light C functions, emergency garbage collector, goto statement, and finalizers for tables. The last release was Lua 5.2.4, released on 07 Mar 2015. There will be no further releases of Lua 5.2. Lua 5.1 was released on 21 Feb 2006. Its main new features were a new module system, incremental garbage collection, new mechanism for varargs, new syntax for long strings and comments, mod and length operators, metatables for all types, new configuration scheme via luaconf.h, and a fully reentrant parser. The last release was Lua 5.1.5, released on 17 Feb 2012. There will be no further releases of Lua 5.1."
year_published = 2025
