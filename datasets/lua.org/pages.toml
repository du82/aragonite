["https://lua.org/wshop18.html"]
title = "Lua: workshop 2018"
full_description = "This no-slides workshop guides you of how to quickly start making games without much experience in gamedev, but with good Lua skills. We'll start with an empty project and by the end of the workshop we'll have a small game running on mobiles and the browser. We'll give people the kick-start and supply them with a demo-project so they can experiment at home. So we won't require attendees to follow us on their laptops during the workshop. In our company, we have used Lua for more than 10 years to describe the business logic of our projects. The long journey started with PUC-Rio Lua, went through LuaJIT, and finally led us to our own implementation based on LuaJIT 2.0. In my talk, I would like to discuss: why we eventually decided to start a new implementation of Lua; how we tested it and ensured compliance for APIs provided by the Lua tandard libraries; how we extended our implementation (I will discuss adding support for immutable objects and preemptive coroutines as examples); what tools we created around our platform to ease troubleshooting and further development. At Cloudflare, ARM servers are coming. We're in the midst of a project to port all our services from the current Intel-only to a more diverse environment. Given that roughly half of each CPU's time is spent running LuaJIT code and the huge number of machines we deploy to, we have to follow and investigate many corner cases. This talk will present a few of the challenges and lessons learned so far. Multithreading is one of the eternal problems of script languages. Lua suffers from this problem too: no native support of OS threads and interpreter state lock. Existing solutions that work with threads in Lua use different approaches and do not cover all our needs at once. This talk explains how Effil solves this problem. The Effil is a multithreading library for Lua. It aims to provide high level abstraction of threads usage and interaction. Based on multiple interpreter states approach, Effil reimplements a set of Lua mechanisms (tables, metatables, GC) from scratch to make objects live outside of Lua state and be transmittable between threads. In sum with other features this library makes thread usage simple and efficient."
