title = "Y: The Most Beautiful Idea in Computer Science explained in JavaScript"
description = "In this post, we will talk about one of the most beautiful ideas in computer science: the Y-Combinator. And no, I’m not talking about the VC firm in Silicon ..."
full_description = "In this post, we will talk about one of the most beautiful ideas in computer science: the Y-Combinator. And no, I’m not talking about the VC firm in Silicon Valley, even though this post will explain why they’ve got this name. Put in simple terms, the Y-Combinator (also known as the fixed-point combinator) is a way of doing recursion in a language that does not explicitly supports it. Let’s say you want to implement a recursive factorial function. In JavaScript, for example, you could simply do this: const factorial = n => n === 0 ? 1 : n * factorial(n - 1); But what if you couldn’t use any “names”? What if JavaScript didn’t allow you to call factorial inside of factorial, how would you implement it? In that case, you’d use the Y-Combinator. It doesn’t have many use cases for solving real world problems, but it is not only one of the most mind blowing ideas in computer science and a great mental exercise, but it also separates those who really understand what functional programming is about from those who don’t. Before we start I need to warn you that deriving the Y-Combinator for the first time is hard and that it’s normal to struggle with it. So don’t feel bad if you have to read this blog post more than once in order to get it. I tried to make it very detailed and show every single step of what is happening on each example but if you feel like you’re advanced enough and want to read the short version of it, just click here. I recommend that you follow this post with a notebook or on Node’s REPL and test things by yourself, that will help you understand all the steps we’ll go through. Don’t be afraid of trying things out and testing each example. Doing your own exploration plays a great part in understanding how Y works. Also, if you want to learn more about recursion I’ve got a very popular post about it in this very same blog. It’s a bit old but it remains amazing and very informative. I guarantee you this will be one of the most amazing journeys you will go through when it comes to functional programming. The first time deriving the Y-Combinator is an indescribable joy, so get comfortable in your chair, bed, or whatever and let’s get started. First things first: what on earth is a combinator? A combinator is a function with no free variables. Free variables are variables defined outside of the function’s scope. They’re the opposite of bound variables, which are variables that only exist inside of a function’s scope. Let’s use an example to make it easier to understand: const num = 13; const sumPlusThirteen = (a, b) => a + b + num; In the example above, our function sumPlusThirteen uses the variables a, b and num. The variables a and b are bound variables because they are bound to the function’s parameters: when we refer to their names we are referring to values that were passed to the sumPlusThirteen function. However, the variable num refers to a value outside of the function’s scope, which means it is a free variable. Let’s look at some more examples: x => x - x is a bound variable, because it’s bound to the function’s parameters x => x + y - x is a bound variable because it’s bound to the function’s parameters and y is a free variable because it refers to a value outside of the function’s scope x => y + z - y and z are both free variables because they refer to values outside of the function’s context (x, y) => x + y - Both x and y are bound variables because they are bound to the function’s parameters Getting back to combinators, we can now say that the following functions are all combinators: x => x is a combinator because x is the only variable in the function’s body and it’s bound to the function’s parameters (x, y) => y - is a combinator because the only variable in its body (y) is bound to the function’s parameters. x => y - is not a combinator because the variable in its body (y) refers to something outside of the function’s context (x, y) => x(y(z)) is not a combinator, because one of the variables in its body (z) refers to a something outside of the function’s context I could write an entire blog post about this, but for now, this basic knowledge will suffice. I highly recommend that you read more about bound versus free variables and pass-by-context versus pass-by-name though. Deriving Y Discovering what we need Now that we know what a combinator is, let’s get to the funniest part of this post and derive the Y-Combinator itself. Let’s get back to our recursive factorial definition: const factorial = n => n === 0 ? 1 : n * factorial(n - 1); // I'm just using this to prove it actually works console.log(factorial(5)); // 120 This is how it works: As you might remember, what we want is a way of calling factorial without referring to its own name, we want a function which does not have any free variables, but is still recursive. Considering this goal, the most obvious thing here would be to eliminate the call to factorial inside the function’s body. In order to do this, we’d do one of the simplest and most common refactoring techniques in functional programming: we’ll remove the factorial reference from the function’s body and make it a parameter: const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); Now, in order for us to calculate the factorial of a number we must pass a function f to factorialGenerator so that it can call it with n - 1 whenever n is not 0. If you passed in a function myFun, for example, you’d get back: n => n === 0 ? 1 : n * myFun(n - 1). Let’s see what happens if we call this function with any function and then 0: const literallyAnyFunction = () => null const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); console.log(factorialGenerator(literallyAnyFunction)(0)); // 1 Look, it already works for 0, and we can use literallyAnyFunction for that! Isn’t it amazing? This is because when passing zero to the function returned by factorialGenerator, n will be equal 0 and then it will return 1. We won’t even need to call the function we passed in (which is literallyAnyFunction). But what if we try to calculate the factorial of 1 in the same way? const literallyAnyFunction = () => 'a string' const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); console.log(factorialGenerator(literallyAnyFunction)(1)); // NaN Whoah seems like we’ve got NaN. This definitely not right! In order to understand what has happened let’s take a look at the function returned by calling factorialGenerator and passing it literallyAnyFunction: const literallyAnyFunction = () => 'a string' const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const fn = factorialGenerator(literallyAnyFunction); // fn is: n => n === 0 ? 1 : n * (() => 'a string')(n - 1)); As you can see, in the function returned by factorialGenerator(literallyAnyFunction), if n is not 0 we will have to call literallyAnyFunction with n - 1 and then multiply the result of that by n. And what is the result of multiplying a String by a Number in JavaScript? Exactly, it’s NaN. Okay, but what if try calculating the factorial of 2 also using factorialGenerator(literallyAnyFunction)? Will it work? const literallyAnyFunction = () => 'a string' const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); console.log(factorialGenerator(literallyAnyFunction)(2)); // NaN Of course not. It’s still NaN. But that’s not what I want to show you this time. What I want to show you is that literallyAnyFunction has only been called once. This is what happened: factorialGenerator has been called with literallyAnyFunction and returned a function That function has been called with 2 2 is not equal 0, so we’ll do 2 * literallyAnyFunction(2 - 1) literallyAnyFunction(2 - 1) will return 'a string' We’ll try to multiply 'a string' by 2 and NaN will be returned As I’ve said, there was only a single call to literallyAnyFunction. Let’s make that more obvious by adding a console.log to literallyAnyFunction, like this: const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); console.log(factorialGenerator(literallyAnyFunction)(2)); See? literallyAnyFunction has only been called once. Now test it again with 0, 1 and 2. What happens? For 0 it returns 1, which is the correct answer and does not call literallyAnyFunction at all For 1 and 2 it returns NaN, which is the correct answer and calls literallyAnyFunction once Do you notice any pattern here? Whenever we have to call literallyAnyFunction and multiply the string it returns we get back NaN. If only we had a way to avoid it… Well, we actually have! If we call factorialGenerator with factorialGenerator(literallyAnyFunction), the first time f is called, it will be factorialGenerator, which means we’ll call factorialGenerator with n - 1 instead of calling literallyAnyFunction. Look! const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const result = factorialGenerator( factorialGenerator(literallyAnyFunction) )(1); // It works! console.log(result); // 1 Awesome, it works! But what did happen? The first thing that has been evaluated was factorialGenerator(literallyAnyFunction). That returned a function which returns 1 if the argument passed to it is 0, otherwise, it will call the literallyAnyFunction passed to it Then we call factorialGenerator again with that function we’ve just returned Finally, the function we’ve obtained will only call factorialGenerator the first time it has to call f. After that, it will call literallyAnyFunction When it’s called with it 1 it sees that 1 is not equal to 0, so it will call f (which is factorialGenerator) with n - 1 (a.k.a. 0) and multiply the result of that by 1 Now that factorialGenerator has been called with 0 it will see that n is equal to 0 and return 1. This 1 will be multiplied by 1, returning 1, which is the correct answer. Notice that literallyAnyFunction has not been called at all. If understanding recursion still seems hard to you, once again I recommend you to read this blog post where I explain how to think about recursion in an easy way first and then come back here. Another question for you: will this technique work with 2 too? const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const result = factorialGenerator( factorialGenerator(literallyAnyFunction) )(2); console.log(result); // NaN Oops! It doesn’t! As you can see, this time, literallyAnyFunction has been called, because the second time we have to call f it was literallyAnyFunction. How could we avoid it? Easy, just pass in factorialGenerator again. const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const result = factorialGenerator( factorialGenerator( factorialGenerator(literallyAnyFunction) ) )(2); console.log(result); // 2 Look, it works again! This happens because we don’t call, literallyAnyFunction, instead, we just keep calling factorialGenerator until we reach 0, then the results bubble back up, the same way it happened in the previous example. This is what happened this time: const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const result = factorialGenerator( factorialGenerator( factorialGenerator(literallyAnyFunction) ) )(2); // n => 2 === 0 ? 1 : 2 * factorialGenerator(2 - 1) // n => 1 === 0 ? 1 : 1 * factorialGenerator(1 - 1) // n => 0 === 0 ? 1 : 0 * literallyAnyFunction(0 - 1) - literallyAnyFunction won't be called! console.log(result); // 2 Want to make it work for 3? Easy, just add another call to factorialGenerator: const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const result = factorialGenerator( factorialGenerator( factorialGenerator( factorialGenerator(literallyAnyFunction) ) ) )(3); console.log(result); // 6 Feel like calculating the factorial of 4 too? There goes another call to factorialGenerator: const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const result = factorialGenerator( factorialGenerator( factorialGenerator( factorialGenerator( factorialGenerator(literallyAnyFunction) ) ) ) )(4); console.log(result); // 24 We’ve got so many parentheses in that example it already started looking like LISP. This shows that in order to be able to calculate the factorial of any number we’d just need to have infinite calls to factorialGenerator being passed to each other: const literallyAnyFunction = () => { console.log('f has been called!') return 'a string' } const factorialGenerator = f => n => n === 0 ? 1 : n * f(n - 1); const factorial = factorialGenerator( factorialGenerator( factorialGenerator( factorialGenerator(...) ) ) ); Another way to think about this is that what you want to happen is for the f inside factorialGenerator to always be the function returned by it. By doing this you guarantee that you will always call the inner function again. Fixed Points Now let’s stop for a moment a talk about another very important concept for understanding Y: the fixed point. The fixed point of a function is that value that when applied to it results in itself. Basically, if you call a function f with fixpoint, the output should be equal to fixpoint. Get a calculator and just keep pressing the cos key until the result doesn’t change anymore. You should get something like 0.73908513321 (might change depending on your calculator’s precision). This means that 0.73908513321 is the fixed point of the cos function since once we do cos(0.73908513321) we get back 0.73908513321. Let’s summarize this in a single expression: f(fixpoint) = fixpoint As you can see, since f(fixpoint) is the same thing as fixpoint we can just replace the fixpoint inside of f with f(fixpoint), like this: // I've put f(fixpoint) to the right to make it easier to read fixpoint = f(fixpoint) fixpoint = f(f(fixpoint)) fixpoint = f(f(f(fixpoint))) fixpoint = f(f(f(f(fixpoint)))) fixpoint = f(f(f(f(f(fixpoint))))) // We could go on forever... This looks familiar, doesn’t it? Of course it does, it’s exactly what we want! We want to be able to nest infinite calls to factorialGenerator inside of itself whenever we need to do recursion. This is why we want to find the Y combinator. The Y Combinator is the combinator that allows us to find the fixpoint of a function like factorialGenerator so that we can make it recursive! Finding Y When applying a function to Y we want it to return the fixed point of that function, like this: Y(f) = fixpoint Considering that the fixpoint of a function is the value that "
