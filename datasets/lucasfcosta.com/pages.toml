["https://lucasfcosta.com/2017/04/06/Testing-NodeJS-APIs.html"]
title = "Writing Good Tests for NodeJS APIs"
full_description = "Hello, everyone! Recently I’ve been working a lot with Node and I felt the urgent need to write a blog post about how to write good API tests. In those tests, all I do is send a request to an instance of my server and then I check its outputs (either in the database or in the returned response). Even though this content is focused on API testing, I’m a hundred percent sure you will learn techniques that will help you with any tests you will ever write using JavaScript. In this blog post I will show you how the tools we’re going to use work behind the scenes and their roles in the test process so you can choose your own tools later if you want to. We won’t get too tied to specific tools in this post even though I need to explain how they work. Differently to what happens with unit tests, these tests take into account how the software’s components work together instead of testing them individually. Before we get into technical stuff I must recommend you to read this blog post about how to write good assertions and, if you’re a Portuguese speaker, I can also recommend that you see my talk in JSDay Recife 2016 about JavaScript Testing. Basic knowledge about Promises and ES6 will be useful when reading this article. Our Sample Application In this example, we’re going to write a simple application that creates, reads, updates and deletes person objects through HTTP requests. If you want to see the whole code used in this post, here is the link to the repo. In this application, we’re going to use Express as our web framework and we’re going to store our documents in a MongoDB instance. To map the objects in our application to the documents in our database we’re going to use Mongoose. However, don’t get too tied to these tools, I’ll use these ones just to demonstrate what you’d need to do in the real world, but these concepts could easily be applied if you’re using other tools such as Sequelize and relational databases or other web frameworks such as Hapi or Sails. I’ll make sure to explain in detail all the concepts and how things work so you can apply those techniques doesn’t matter what you’re using. First of all, create a new directory and use npm init to create a package.json file. Now, let’s install Express and add it as a dependency to our project: $ npm install --save express If you’re using yarn (which I recommend), you could also do yarn add express. Now let’s create the server file itself and call it app.js. For now, we will only have a single route, which returns a JSON object with a hello world message. const express = require('express'); const app = express(); const port = 8080; app.get('/', (req, res) => { res.send({ message: 'Hello, world!' }); }); app.listen(port, () => { console.log(`Listening on localhost:${port}`); }) module.exports = app; To test this route manually, start your server by running node app.js, open your browser and go to localhost:8080. Our First Test Before we get to the real deal here, let’s start by writing a really simple test, which checks if our hello world route is working right. In order to run our tests we will be using Mocha, however, you could also use other tools such as AVA or Tape. It’s important to notice that we will be using these tools just to run tests. When using Mocha, for example, it will only be responsible for running the before, after, beforeEach and afterEach hooks in the correct order and the code inside test blocks, whether they have assertions or not. Mocha is also responsible for generating an output indicating which tests succeeded and which ones failed. As you might imagine, writing tests without assertions is something useless, so, in order to check the if the values we’ve got correspond to the expectations we have about them we will use Chai. Differently from Mocha, Chai does not run any tests, it just provides a bunch of assertions which will throw an error if they fail. This error will be an AssertionError, which is a type of error the test runners mentioned before know how to handle and display correctly. What we want to do here to test our application is start our server and send it a request, then we need to validate its output. In order to send HTTP requests to our server, I highly recommend you to use Chai HTTP, which also provides you cool new assertions related to HTTP requests. Let’s install these tools and start coding: $ npm install --save-dev mocha chai chai-http This time we will be adding those as dev dependencies because we don’t need them to run our server, we will only use them in our development environment. Create a folder called test and a file called helloWorldTest.js. By default, Mocha will run every test inside the test directory when using the mocha command, this is why we’re using this name. If you want to create a different folder to store your files then you must tell Mocha where your test files are located by passing the path to this directory as the second argument to the mocha command. Finally, we’re going to write our test. Start by importing chai and chai-http. By using chai.use(chaiHttp) you will be allowing the chaiHttp plugin to extend Chai and therefore add new assertions and features to it. For our tests, we will also need to have our server instance available so we can tell chai-http where to send its requests to. const chai = require('chai'); const expect = chai.expect; const chaiHttp = require('chai-http'); chai.use(chaiHttp); const app = require('../app.js'); Now let’s write the test itself: const chai = require('chai'); const expect = chai.expect; const chaiHttp = require('chai-http'); chai.use(chaiHttp); const app = require('../app.js'); describe('Hello World Route', () => { it('Returns a 200 response', (done) => { chai.request(app) .get('/') .end((error, response) => { if (error) done(error); // Now let's check our response expect(response).to.have.status(200); done(); }); }); }); As you can see above, we used functions that haven’t been defined earlier in our test file: describe and it, so how do they work and how can they be available? The describe function acts as a “folder”, you can nest your tests and other describe blocks inside it in order to organize your tests. The it function holds the test itself. If an exception happens inside the function passed to it or if the done callback was added as a parameter but did not get called before the configured timeout this test will be marked as failed. These two functions are available to us because when we want to run our tests we use the mocha command. This command is responsible for running a JavaScript file that starts mocha and uses require to load our tests files. This file also defines functions in the global scope, which makes them available in all files and this is why we can use describe and it without defining them first. In our first test, we use the request method added by chai-http to the chai object to send a get request to our app’s / route. When we get a response the callback function passed to end gets called and gets passed an error and a response object so we can check if these objects are what we expect them to be. In this case, we just expect the response send by the server to have a 200 (success) status. The done argument that gets passed to our test function needs to be called in order to indicate this test is finished. When your function takes this argument you must call it to tell Mocha your test is complete, otherwise, it will reach the specified timeout and fail. This is not mandatory, but you will certainly want to use it when running async tests. If your function does not take any arguments, Mocha will think it’s synchronous and you won’t need to call anything to indicate the test is complete. If done is called with an argument your test will fail, this is why we call it with error if it is a truthy value. To run this test we must use the mocha command in our terminal, so let’s install it globally: $ npm install -g mocha To run this test open your terminal, navigate to your project’s directory and run: $ mocha This will run your tests and display their status. However, it might be a bit inconvenient to force everyone to install mocha globally in order to run your project’s tests, especially because they already have mocha installed as one of this project’s dev dependencies. So, in order to allow people to run your tests with the mocha version in their dependencies directory, we need to modify package.json. Open your package.json file and add this to it: \"scripts\": { \"test\": \"mocha\" } The commands inside the scripts object will have all the runnable files from node_modules (the directory which holds your dependencies) available, so you won’t need to install mocha globally again. In order to run the command we have added to our package.json, we just need to run npm test instead of mocha. If you want to read more about NPM scripts I highly recommend you to read this blog post by my great friend Keith Cirkel. Now let’s use the knowledge we’ve just acquired to write a new test which checks the response’s message body: // ... describe('Hello World Route', () => { it('Returns a 200 response', (done) => { chai.request(app) .get('/') .end((error, response) => { if (error) done(error) // Now let's check our response expect(response).to.have.status(200) done() }); }); // Let's add this to the same describe block to keep this file organized it('Returns a \"Hello World\" message', (done) => { chai.request(app) .get('/') .end((error, response) => { if (error) done(error); expect(response.body).to.be.deep.equal({ message: 'Hello, world!' }); done(); }); }); }); If you want to read more about Chai and its assertions take a look at the official docs. Also, here goes another cool tip: some people like to keep their tests in the same folder as the source file they are testing. If this is your case you can use the following piece of code in your package.json file: \"scripts\": { \"test\": \"find ./ -name '*_test.js' | xargs mocha -R spec\" } This will run all the files that end in _test.js in your project’s root directory. When using chai-http, it returns a Promise for the requests we are doing. So, finally, let’s take that into account to refactor our tests and return ChaiHTTP’s promise from the function passed to Mocha’s it. When we return a Promise from a test, this test will end whenever that Promise gets resolved so we don’t need to call done explicitly anymore. // ... describe('Hello World Route', () => { it('Returns a 200 response', () => { return chai.request(app) .get('/') .end((error, response) => { if (error) done(error) // Now let's check our response expect(response).to.have.status(200) }); }); // Let's add this to the same describe block to keep this file organized it('Returns a \"Hello World\" message', () => { return chai.request(app) .get('/') .end((error, response) => { if (error) done(error); expect(response.body).to.be.deep.equal({ message: 'Hello, world!' }); }); }); }); Testing and your database Now that we know the basics about how API testing works, it’s about time we add a bit of complexity to our server and start solving real world problems™. Make sure you have MongoDB, body-parser and mongoose installed before continuing. To install body-parser and mongoose and them to our project as dependencies we must run: $ npm install --save mongoose body-parser Mongoose will be responsible for mapping the documents in our MongoDB instance to JavaScript objects in our code and body-parser will parse incoming request bodies so that we can read them later under the req.body property. Open your app.js file and let’s get these two working: const express = require('express'); const bodyParser = require('body-parser'); const mongoose = require('mongoose'); mongoose.Promise = global.Promise; const app = express(); const port = 8080; const mongoHost = 'localhost:27017'; // This connects to our MongoDB instance mongoose.connect(mongoHost); // This allows us to parse request's body // so we can have it available later app.use(bodyParser); app.get('/', (req, res) => { res.send({ message: 'Hello, world!' }); }); app.listen(port, () => { console.log(`Listening on localhost:${port}`); }) module.exports = app; As you can see in the code above, we have added require calls for body-parser and mongoose. Then we added the result of bodyParser.json as a middleware to our express server. Please make sure that you add bodyParser.json() as a middleware before your other routes because Express will run middlewares in the order they are added. This means that if you add that line of code after defining your routes you will only have your request’s body parsed after it has matched a route and ran its handler function. You can read more about Express’ middlewares at this link. We have also used mongoose.connect to connect the mongoose object to our MongoDB instance. If you are using a port other than the default one (27017) make sure you change that mongoHost variable’s value. You should also remember to set mongoose.Promise to the Promise implementation you are using, in this case, I’ll use the native implementation by assigning global.Promise to it. Now that we’ve got everything set up let’s create a new model to represent our Person documents. I’d highly recommend you to create a new folder called models to store your model files. I’m going to call the Person model file as person.js: const mongoose = require('mongoose'); const Schema = mongoose.Schema; const PersonSchema = new Schema({ name: { type: String, required: true }, phone: { type: String, required: true }, email: { type: String, required: true }, dogs: { type: Number, required: true } }); module.exports = mongoose.model('Person', PersonSchema); I’ll keep this model as simple as possible since our main goal here is to learn about testing, not about Mongoose. If you want to read more about Mongoose, they’ve got excellent docs. Finally, we will create a route to insert a person into our database. In order to do that, let’s add this to your app.js file: // ... // Don't forget to import your Person model! const Person = require('./models/person'); app.post('/person', (req, res) => { new Person({ name: req.body.name, phone: req.body.phone, email: req.body.email, dogs: req.body.dogs }).save() .then(() => { res.send({ message: 'Person saved successfully!' }); }) .catch(() => { res.send({ message: 'Ooops! There was an error saving this person.' }); }); }); This route is pretty simple, it just assigns attributes from your request’s body to a new Person object and saves it into our database. Now let’s write a test for it. Create a new file in your test folder called personTest.js: const chai = require('chai'); const expect = chai.expect; const chaiHttp = require('chai-http'); chai.use(chaiHttp); const app = require('../app.js'); describe('Person', () => { describe('Create Person', () => { it('Returns a 200 response', () => { return chai.request(app) .post('/person') .send({ name: 'John Doe', phone: '1-800 999', email: '"
year_published = 2017
clearnet = "https://lucasfcosta.com/2017/04/06/Testing-NodeJS-APIs.html"
