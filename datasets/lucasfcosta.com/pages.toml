["https://lucasfcosta.com/2021/09/20/monte-carlo-forecasts.html"]
title = "How to replace estimations and guesses with a Monte Carlo simulation"
description = "There are many ways of estimating how long a software project will take. All of them are a waste of time."
full_description = 'There are many ways of estimating how long a software project will take. All of them are a waste of time. Some prefer to spend days analysing and planning their changes so that they can estimate more accurately — others choose to multiply by N whatever estimations they make. I wouldn’t recommend any of these approaches. The problem with the first approach is that it considers software development to be a deterministic process when, in fact, it’s stochastic. In other words, you can’t accurately determine how long it will take to write a particular piece of code unless you have already written it. The problem with multiplying estimations by N is that you’re simply exchanging cycle time for predictability. Instead of actually trying to be accurate, you’re merely adding a buffer to your estimations. That buffer wouldn’t be a problem if it weren’t for the fact that engineers determine it by licking the tip of their finger and putting it up in the air. Unfortunately, the only way to win at the estimation game is not to play it. To learn more these types of problems, see Gordian Knot and The most efficient way to solve problems. “Estimation is a waste of time. Don’t do it.” — VACANTI, Daniel. Instead of making “informed” guesses or multiplying estimations by N, we can embrace the randomness and variability involved in writing software and use more suitable statical methods, in this case, stochastic modeling techniques, to devise better forecasts. One of these techniques is the Monte Carlo method, which I’ll use to make projections in the rest of this post. This post will teach you how to replace estimations and guesses with a Monte Carlo simulation. First, I’ll explain what is the Monte Carlo method and show how it works. Then, I will demonstrate how you could use it to forecast when a project is likely to be finished. In the third section of this blog post, I’ll show you how to attach a probability value to your projections, turning them into actual forecasts¹. In this section, you’ll understand how to generate more or less optimistic forecasts depending on your risk appetite. After those first three sections, I’ll explain a few caveats and factors to which you should pay attention when running your Monte Carlo simulations to generate projections. At last, explain where we’ll go in the next blog posts and recommend further reading material. What is the Monte Carlo method? The Monte Carlo method consists of repeatedly simulating random individual events to understand the likelihood of possible outcomes. Imagine, for example, that you’d like to calculate the likelihood of rolling two dice and obtaining a sum of seven. One of the ways of doing it is to enumerate all the 36 possible result combinations and count how many of those results yield a sum of seven. Considering 6 of those 36 results produce a sum of 7, the probability of rolling a seven is 16.67%. Alternatively, you could roll two dices for the next couple of months, take notes of all the results, and check how often you rolled a seven. The more rolls you’ve made, the more precise your final probability estimation will be. Now, rolling dice for days isn’t very exciting (and takes too long). Instead, we could get the computer to roll the dice for us. Thanks to the machines, we can roll two dice a million times quite quickly. Now, let’s write a simple Rust program to roll two dice a million times and tell us how often it rolls a seven. extern crate rand; use rand::distributions::{Distribution, Uniform}; use rand::thread_rng; const TOTAL_ROLLS: i32 = 1_000_000; fn main() { let mut rng = thread_rng(); let die = Uniform::from(1..7); let mut sevens = 0; for _ in 0..TOTAL_ROLLS { let first_die = die.sample(&mut rng); let second_die = die.sample(&mut rng); if first_die + second_die == 7 { sevens += 1 } } let p: f64 = f64::from(sevens) / f64::from(TOTAL_ROLLS) * f64::from(100); println!("Total Rolls: {}", TOTAL_ROLLS); println!("Total Sevens: {}", sevens); println!("Probability of rolling a seven: {:.2}%", p); } When running this program, it’ll simulate a million dice rolls, divide the number of sevens rolled by the total number of simulations, and output the empirical probability of rolling a seven. This probability will be close to 16.67%, which is the actual probability of rolling a seven. Total Rolls: 1000000 Total Sevens: 166446 Probability of rolling a seven: 16.64% Congratulations, you just did your first Monte Carlo simulation. Simulating when a project will be complete Now that you’ve done a Monte Carlo simulation, I’ll teach you how to apply the same principles to a software project so that you can estimate when you’ll complete it. Let’s imagine you’ve read a Tim Ferris blog post saying that the optimal number of blog posts a year is 60 or more. Because it’s Tim Ferriss, you’re convinced he’s right, and you’d like to follow his advice. However, before you commit to this time-consuming endeavour, you want to know how likely you are to be able to write 60 or more posts in 365 days and, if not, what changes you could make to hit that mark. How can we do that? A naive approach: uniformly distributed cycle-times First, we’ll take a naive approach: we’ll assume you know how long it took to write each of the blog posts you published in the past three months. For the sake of this example, let’s say that the shortest post took two days to complete, and the longest took ten. Then, we’ll pretend that you’re equally likely to complete posts in any number of days between two and ten. To put it another way, we’ll consider your posts’ cycle-time distribution to be uniform (just like a die). Considering these assumptions would hold, you could write a program to repeatedly simulate how long it would take to write 60 blog posts. In this simulation, for each blog post, your program would randomly pick a number between two and ten as if that were the number of days you took to write it. After simulating how long each post took to write, your program would sum each post’s turnaround and check whether all 60 posts took less than 365 days. Finally, once it has run all the simulations, your program would calculate the probability of success by dividing the number of times you “succeeded” by the total number of simulations. extern crate rand; use rand::distributions::{Distribution, Uniform}; use rand::thread_rng; const TOTAL_RUNS: i32 = 1_000_000; const TOTAL_BLOG_POSTS: i32 = 60; fn main() { let mut rng = thread_rng(); let time_to_completion = Uniform::from(2..11); let mut successes = 0; for _ in 0..TOTAL_RUNS { let mut current_duration = 0; for _ in 0..TOTAL_BLOG_POSTS { current_duration += time_to_completion.sample(&mut rng); } if current_duration <= 365 { successes += 1 } } let p = f64::from(successes) / f64::from(TOTAL_RUNS) * f64::from(100); println!("Total Simulations: {}", TOTAL_RUNS); println!("Successes: {}", successes); println!("Probability of succeeding: {:.2}%", p); } After running this program, you should see an output similar to this: Total Simulations: 1000000 Successes: 608671 Probability of succeeding: 60.87% That’s a great first attempt, but let’s say it doesn’t feel quite right to you. What could you do to make your simulation more accurate? An okay approach: weighted probabilities Now, assume that, even though the shortest story took two days and the longest took ten, you remembered that the time for most posts skews towards the ten-day mark. In other words, you don’t think that the posts cycle times are uniformly distributed: most posts take a long time, and only a few take two or three days. In an attempt to make the model more accurate and get a more realistic forecast, you then gather the start and end date of each post and calculate each post’s cycle time. N Title Start Date End Date Time Taken 1 Why Your Software Never Works Out the Way You Plan 12/01/2022 19/01/2022 8 2 Ways Your Mother Lied to You About Software 21/01/2022 29/01/2022 9 3 A Software Success Story You’ll Never Believe 02/02/2022 03/02/2022 2 4 Darth Vader’s Guide to Software 18/02/2022 23/02/2022 6 5 How to Win Big in the Software Industry 24/02/2022 29/02/2022 6 6 Why Do People Think Software is a Good Idea? 01/03/2022 08/03/2022 8 7 Shocking Ways Software Will Make You a Better Dancer 09/03/2022 12/03/2022 3 8 What The Beatles Could Learn from Software 14/03/2022 23/03/2022 10 9 What Your Parents Never Told You About Software 23/03/2022 28/03/2022 6 10 How To Create The Worst Blog Post Titles 28/03/2022 31/03/2022 4 With this data, you can now calculate the probability of each duration occurring and build a table like the one below. Duration Frequency Probability 10 1 10% 9 1 10% 8 2 20% 6 3 30% 4 1 10% 3 1 10% 2 1 10% Knowing how likely each duration is to occur will make your simulation much more accurate. In the naive approach you’ve just seen, an issue was equally likely to last two, six, or eight days, which doesn’t reflect reality. By looking at the table above, you can easily see that tasks are three times more likely to take six days than two days. In fact, only 30% of stories take four days or fewer. Now, let’s update our simulation so that it will obey the probability of each duration occurring. extern crate rand; use rand::distributions::{Distribution, Uniform}; use rand::thread_rng; const TOTAL_RUNS: i32 = 1_000_000; const TOTAL_BLOG_POSTS: i32 = 60; const DURATIONS: [i32; 10] = [2, 3, 4, 6, 6, 6, 8, 8, 9, 10]; fn main() { let mut rng = thread_rng(); let time_to_completion = Uniform::from(0..DURATIONS.len()); let mut successes = 0; for _ in 0..TOTAL_RUNS { let mut current_duration = 0; for _ in 0..TOTAL_BLOG_POSTS { let random_index = time_to_completion.sample(&mut rng); current_duration += DURATIONS[random_index]; } if current_duration <= 365 { successes += 1 } } let p = f64::from(successes) / f64::from(TOTAL_RUNS) * f64::from(100); println!("Total Simulations: {}", TOTAL_RUNS); println!("Successes: {}", successes); println!("Probability of succeeding: {:.2}%", p); } After running this simulation, which is much more accurate, it’ll tell you that you’re actually 36.69% likely to succeed. That’s almost half of the previous estimation! Total Simulations: 1000000 Successes: 366944 Probability of succeeding: 36.69% This estimation is probably good enough for a single person, but it won’t work for a team. At least not without adjustments². The problem with this simulation is that it assumes that blog posts will be written in series, not in parallel. If you had two or more people working in parallel, you’d have to record their individual cycle times, simulate how many blog posts each one could write in 365 days, and sum each person’s output. Not too difficult, but there is an easier way. Sampling throughput An easier way of simulating a team’s performance without using individuals’ cycle times is to sample the team’s throughput for each day in the simulation. To perform such a simulation, you need to record the daily number of completed items for a determined length of time. With that data, you’d then have the probability of having a throughput of 0, 1, 2, 3, or more items on any given day, which you’d use when sampling. If you were to write a program that did exactly that, you’d have a piece of code like the one below. extern crate rand; use rand::distributions::{Distribution, Uniform}; use rand::thread_rng; const TOTAL_RUNS: i32 = 1_000_000; const TOTAL_STORIES: i32 = 500; const TEN_DAY_THROUGHPUTS: [i32; 10] = [1, 2, 0, 1, 1, 2, 3, 1, 2, 1]; fn main() { let mut rng = thread_rng(); let throughput = Uniform::from(0..TEN_DAY_THROUGHPUTS.len()); let mut successes = 0; for _ in 0..TOTAL_RUNS { let mut stories_completed = 0; for _ in 0..366 { let random_index = throughput.sample(&mut rng); stories_completed += TEN_DAY_THROUGHPUTS[random_index]; } if stories_completed > TOTAL_STORIES { successes += 1 } } let p = f64::from(successes) / f64::from(TOTAL_RUNS) * f64::from(100); println!("Total Simulations: {}", TOTAL_RUNS); println!("Successes: {}", successes); println!("Probability of succeeding: {:.2}%", p); } You could use this approach to determine whether a software development team could finish a particular number of items within a specific period. Caveats to pay attention to when building Monte Carlo simulations Before claiming that the simulation above is reliable, I must expose a few things you’ll need to pay attention to when using a Monte Carlo Simulation to make forecasts: The quality of the inputs upon which your simulations depend. The consistency and predictability of your team. The need to re-forecast. The size of your work packages. Quality of the inputs Assume you had a team of ten engineers last year, but half of them quit the company three months ago. If you were to simulate how long this team would take to complete a project, you should not use throughput data from more than three months ago. If you use a 10-engineer team’s throughput data to forecast the performance of a 5-engineer team, you will get over-optimistic results. Similarly, if your team doubles in size, your simulation should not use historical data from when you had half the number of people. In this case, you also can’t just assume projects will take half the time because it’s extremely unlikely that productivity will scale linearly as you hire more developers. Additionally, other factors like holidays or a massive rewrite can impact your input data. Your team’s throughput between Christmas and New Year’s Eve, for example, will probably not be the same as the team’s throughput in February. Similarly, a massive rewrite that drastically increases how easy it is to change and extend your software will have an equally dramatic impact on your cycle times. As Daniel Vacanti explains in When Will It Be Done?, _ “the fundamental assumption that the Monte Carlo Simulation is making is that the future you’re trying to predict looks roughly like the past you have data for “_. Consistency and predictability Our simulation will work just fine for the circumstances above because I came up with more predictable throughput values. The range of throughputs used in that code is small, and, most of the days, the team is highly consistent: it gets one or two items done. In other words, the standard deviation for this cycle-time distribution is small. In another blog post, I’ll explain what would have happened if I had used more erratic throughput values in the previous section. For now, keep in mind that as long as you have a team with consistent throughput, this simulation will be reliable. Quantifying “predictability” and “consistency” is also a topic for another blog post. Re-forecast! As your project advances, you will encounter delays, and, sometimes, you’ll get to be ahead of schedule. Therefore, re-forecasting as you progress will make your forecast more accurate because there will be fewer items and more data and, consequently, less room for error. The more information and fewer items to simulate you have, the more y'
