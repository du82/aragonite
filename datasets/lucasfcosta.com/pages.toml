["https://lucasfcosta.com/2016/12/01/Meta-Programming-in-JavaScript-Part-Four.html"]
title = "Meta Programming In JavaScript - Part Four: Symbols"
full_description = '''Hello, everyone! So we finally got to the end of our Meta Programming series of blog posts (for now)! But there’s much more to explore on this matter, so if you have any ideas related to what you’d like me to write about, get in touch! If you didn’t read the first, the second or the third posts of this series I highly recommend you to do that since we’re going to use some concepts we have learned before, especially property descriptors and inheritance! What is a Symbol? First of all we must distinguish the Symbol object from the symbol type. The symbol type is a new primitive type of value introduced in ES6 and it is both immutable and unique, which means that, differently from other primitives, a symbol will never be equal another one (just as it happens with objects). This behavior very useful and soon we will see why. The Symbol object is a globally available object which acts as a wrapper around the symbol primitive data type. Everytime I write Symbol with a capital S I’ll be talking about the global object and everytime I write symbol I’ll be talking about the primitive type. To create a new symbol you just need to invoke the Symbol function, if you use the new operator a TypeError will be thrown. This becomes clear in the example below: // First we will invoke Symbol to create a new symbol primitive const mySymbol = Symbol(); // `mySymbol` is not an instanceof `Symbol`, since Symbol is not its constructor // Keep in mind that `symbol` is a primitive type! console.log(mySymbol instanceof Symbol); // false // If you try to call Symbol using the `new` operator you will get a TypeError: try { const newSymbol = new Symbol(); } catch (e) { console.log('A ' + e.constructor + ' was thrown.'); } This happens in order to prevent developers from creating other instances of the Symbol object instead of getting new values of type symbol. If you could do that, this is what would happen: // THIS IS NOT A RUNNABLE EXAMPLE! It is just a simulation // Let's imagine you could do this: const symbolInstance = new Symbol(); // Since you would be using the `new` operator with `symbolInstance` you would get back the `this` reference inside its constructor // If that was possible, the following would happen: console.log(typeof symbolInstance); // 'object' console.log(symbolInstance instanceof Symbol); // true console.log(symbolInstance.constructor === Symbol); // true If you want to create an instance of the Symbol constructor instead of creating a new symbol primitive you just gotta use the Object() function, which wraps primitives into objects. The Object() function is also great to detect whether or not something is a primitive, because if you use Object(myVar) === myVar this comparison will always return false when myVar is a primitive, since it will be wrapped in a object by Object() and therefore these two values will be different from each other. So take a look at the example below, which is the same as our simulation above except for the way we create an instance of the Symbol object: // Here we create a primitive `symbol` const sym = Symbol(); typeof sym; // "symbol" // Now we will wrap our primitive into a Symbol object using the Object function const symObj = Object(sym); // Now symbol is an object console.log(typeof symObj); // "object" console.log(symObj instanceof Symbol); // true // As you can see, our wrapped symbol has Symbol.prototype as its prototype // If you want to read more about `__proto__` and `prototype` make sure to read the second chapter of this series console.log(symObj.__proto__ === Symbol.prototype); // true Symbols and Their Behavior As we’ve seen in the previous section, symbols are a really special primitive type because, just as it happens with people, every symbol is unique. This means it will never be equal any other value no matter what. When creating a symbol you can also give it a description by passing a String to the Symbol function. This description, however, will only be used for debugability purposes since even though two symbols have the same description, they still won’t be considered equal, as you can see in the example below: const description = 'my description'; const symbolOne = Symbol(description); const symbolTwo = Symbol(description); console.log(symbolOne === symbolTwo); // false In JavaScript we have a global symbol registry, which holds symbols created with the Symbol.for method, which receives a String as its only argument. The Symbol.for method is really important when we’re dealing with symbols, because if we do not understand it we can end up in trouble, since it can make it seem like its possible to have non-unique symbols (symbols that can be considered equal when using the === operator). The Symbol.for method searches for a symbol with the given description in the global registry and returns it if it’s found, otherwise it creates a new symbol for that description and returns it. It’s also important to keep in mind that symbols in the global registry are uniquely identified by their description, which means that it’s impossible to have two symbols with the same description in the global registry. In the example below we demonstrate how Symbol.for works. Please read the comments carefully, they are essential to understanding the whole example. // First let's create a symbol in the global registry using `'ice cream'` as its description. // Here our JavaScript engine will look for a symbol with this description on the global symbol registry and since it won't // be able to find any symbol with this description, it will create a new symbol in the global registry and return it. const globalSymbol = Symbol.for('ice cream'); // Now let's create a local symbol with that same description const localSymbol = Symbol('ice cream'); // Notice how `localSymbol` is still different from `globalSymbol` even though they have the same description console.log(globalSymbol === localSymbol); // false // This comparison will return `true` because now `Symbol.for` will retrieve the existing symbol from the global registry console.log(Symbol.for('ice cream') === globalSymbol); // true // Everytime we call `Symbol.for('ice cream')` it will return the same instance on the global registry console.log(Symbol.for('ice cream') === Symbol.for('ice cream')); Another interesting thing to notice is that it is reasonably easy to end up having descriptions that clash with the ones that already exist in the global registry and this may cause trouble. MDN recommends that you prefix your symbol descriptions with your identifier to avoid this kind of issue. There is also another method similar to Symbol.for which instead of searching for a symbol in the global registry by its description, searches a description by its symbol. This method is called Symbol.keyFor and, as we said earlier, takes a symbol as argument. For example: // Here we create a global symbol with `'foo'` as its description const globalSymbol = Symbol.for('foo'); // We will also create a local symbol with the same description const localSymbol = Symbol('foo'); // Now let's say we want to retrieve the description for our mySymbol item from the global registry console.log(Symbol.keyFor(globalSymbol)); // 'foo' // Notice how we can't find any description on the global registry for the local symbol, even though it has the same description console.log(Symbol.keyFor(localSymbol)); // undefined If you use a symbol as the key for an object’s property you won’t be able to read it without using the specific Object.getOwnPropertySymbols method. Object.getOwnPropertySymbols works just like Object.getOwnPropertyNames, except that instead of returning every property’s name, it returns an array with the symbols being used as keys. Similarly to what happens when you use Object.getOwnPropertyNames, an object’s symbols are always returned by Object.getOwnPropertySymbols, it doesn’t matter if they are enumerable or not (if you want to read about what an enumerable property is, please read the first chapter of this series). This means that you will not be able to completely hide information in an object by using Symbols as the example below clearly demonstrates: const myObj = {}; // Let's define a non-enumerable property in `myObj` using a symbol as key Object.defineProperty(myObj, Symbol('aSymbol'), { value: 'This is not enumerable', enumerable: false }); // Now we will define an enumerable property in `myObj` using another symbol as key Object.defineProperty(myObj, Symbol('anotherSymbol'), { value: 'This is enumerable', enumerable: true }); // Notice how we are still able to see these two symbols when we use `Object.getOwnPropertySymbols` const ownPropertySymbols = Object.getOwnPropertySymbols(myObj); console.log(ownPropertySymbols); // [Symbol(aSymbol), Symbol(anotherSymbol)] console.log(myObj[ownPropertySymbols[0]]); // 'This is not enumerable' console.log(myObj[ownPropertySymbols[1]]); // 'This is enumerable' // However, we still can't see these symbols using `Object.getOwnPropertyNames` or `Object.keys` console.log(Object.getOwnPropertyNames(myObj)); // [] console.log(Object.keys(myObj)); // [] When retrieving symbols from objects we also need to pay attention to whether they exist on the current object or somewhere along its prototype chain, since Object.getOwnPropertySymbols returns only non-inherited symbols. If we want to retrieve every symbol throughout the inheritance chain we need to use Object.getPrototypeOf to go up the inheritance chain and then call Object.getOwnPropertySymbols again. As it happens in the example below: const fatherObj = {}; fatherObj[Symbol('fatherSymbol')] = 'father\'s property value'; const sonObj = Object.create(fatherObj); sonObj[Symbol('sonSymbol')] = 'son\'s property value'; const everySymbol = Object.getOwnPropertySymbols(sonObj).concat(Object.getOwnPropertySymbols(Object.getPrototypeOf(sonObj))); console.log(everySymbol); // [Symbol(sonSymbol), Symbol(fatherSymbol)]; Even though non-enumerable symbols still can be found by using Object.getOwnPropertySymbols, making a property which has a symbol as its key enumerable or not can be useful because when using Object.assign (which copies the values of all non-inherited enumerable properties of an object ot another) we can avoid copying undesirable symbols. Using Symbols to solve Real World Problems™ Now that we know how to create Symbols and their behavior, it’s time to see how we can take advantage of them in the real world. Due to the fact that every symbol is unique, using a symbol as the key for a property guarantees it won’t be overwritten if someone isn’t careful and ends up assigning to that same property. Since anyone can still use Object.getOwnPropertySymbols and retrieve all the symbols from an object, they will still be able to assign to that property, but then it will be on purpose and not just an unfortunate coincidence. Let’s say you’ve got a library which stores a bunch of flags about objects on the objects themselves in order to use this information later. You could use flag as the name for that property, but then if anyone has an object which represents a pirate ship, for example, they can end up assigning a value to the flag property and you will not have access to the data you need anymore. By using a symbol for that property we guarantee that anyone assigning to that property is fully aware of what they’re doing. For example: // This creates an instance of an example library function createLibrary() { // This symbol is the one which will be the key for our metadata on a target object const flagsPrivateSymbol = Symbol('flags'); return { // Here we have a function which marks a timestamp on an object addTimestamp: (anObj) => anObj[flagsPrivateSymbol] = Date.now(), // This other function checks if the timestamp was added more than 2 seconds ago isTimestampTwoSecondsOld: (anObj) => (Date.now() - anObj[flagsPrivateSymbol]) > 2000 }; }; // This is an instance of our example library const myLibrary = createLibrary(); // Here is our object const pirateShip = { name: 'Boaty McBoat', flags: 2 }; // Now we can add our personal metadata to it without worrying that someone will accidentally erase it myLibrary.addTimestamp(pirateShip); // Notice that the `flags` property is still `2` on the `pirateShip` object console.log(pirateShip.flags); // 2 // We can even reassign to it without erasing our metadata pirateShip.flags = 1; console.log(pirateShip.flags); // 1 // Let's schedule a check to see if our `pirateShip` timestamp is more than two seconds old setTimeout(() => { console.log('Is our pirateShip timestamp more than two seconds old? ' + myLibrary.isTimestampTwoSecondsOld(pirateShip)); // true }, 2500); As we could see, using symbols to store metadata on objects is a great idea, especially for “third-party” objects, because it avoids undesirable assignments which would otherwise overwrite the information we need. However, it’s important to reinforce that using symbols as keys for properties still doesn’t make them invisible, thus you still shouldn’t store sensitive information this way. Symbols are also useful because of the so called “Well Known” symbols we will see in the next section, which allow us to reimplement how some of JavaScript’s native operations work. Well Known Symbols The so called “Well Known Symbols” are symbols used to “guide” some native operations, such as instanceof or the new for of loop. By reassiging to properties whose the keys are one of these well known symbols we are able to manipulate how some operations work. These symbols can be accessed through static properties on the Symbol object. This may sound a bit abstract at first, but take a look at how each of the “well known symbols” explained below work and I guarantee you will fully understand this concept. I also need to highlight that these symbols are only taken into account by ES6 compliant engines. This means that some older browsers may not be able to run your code as you expect. Symbol.hasInstance - instanceof This symbol is used to hold the function which will be used by the instanceof operator. When using x instanceof y, for example, the y[Symbol.hasInstance] function will be called with x as argument. So let’s say we have a constructor function called Pirate and we want every other object with a property isPirate which has value true to be recognized as an instance of Pirate by the instanceof operator, this is what we would do: function Pirate(name) { this.name = name; } const jackSparrow = { isPirate: true }; // Notice how `jackSparrow` is not yet considered an instance of the `Pirate` object console.log(jackSparrow instanceof Pirate); // false // Now let's assign another function for `Pirate[Symbol.hasInstance]` // WARNING: Using `Pirate[Symbol.hasInstance] = aFunction` won't work! Object.defineProperty(Pirate, Symbol.hasInstance, { value: (anObj) => anObj.isPirate }); // This will cause Pirate[Symbol.hasInstance] to be called with `jackSparrow` console.log(jackSparrow instan'''
