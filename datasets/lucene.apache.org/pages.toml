["https://lucene.apache.org/pylucene/features.html"]
title = "Apache Lucene - Features"
description = "Warning Before calling any PyLucene API that requires the Java VM, start it by calling initVM(classpath, ...). More about this..."
full_description = "Before calling any PyLucene API that requires the Java VM, start it by calling initVM(classpath, ...). More about this function in here. To build PyLucene, JCC needs to be built first. Sources for JCC are included with the PyLucene sources. Instructions for building and installing JCC are here. PyLucene also includes a number of Lucene contrib packages: the Snowball analyzer and stemmers, the highlighter package, analyzers for other languages than English, regular expression queries, specialized queries such as 'more like this' and more. This document only covers the pythonic extensions to Lucene offered by PyLucene as well as some differences between the Java and Python APIs. For the documentation on Java Lucene APIs, see here. To help with debugging and to support some Lucene APIs, PyLucene also exposes some Java runtime APIs. The best way to learn PyLucene is to look at the samples and tests included with the PyLucene source release or on the web at: Before PyLucene APIs can be used from a thread other than the main thread that was not created by the Java Runtime, the attachCurrentThread() method must be called on the JCCEnv object returned by the initVM() or getVMEnv() functions. Java exceptions are caught at the language barrier and reported to Python by raising a JavaError instance whose args tuple contains the actual Java Exception instance. Java arrays are returned to Python in a JArray wrapper instance that implements the Python sequence protocol. It is possible to change array elements but not to change the array size. A few Lucene APIs take array arguments and expect values to be returned in them. To call such an API and be able to retrieve the array values after the call, a Java array needs to instantiated first. For example, accessing termDocs: In addition to int, the JArray function accepts object, string, bool, byte, char, double, float, long and short to create an array of the corresponding type. The JArray('object') constructor takes a second argument denoting the class of the object elements. This argument is optional and defaults to Object."
year_published = 2025
clearnet = "https://lucene.apache.org/pylucene/features.html"
