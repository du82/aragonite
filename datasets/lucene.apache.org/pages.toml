["https://lucene.apache.org/openrelevance/index.html"]
title = "Apache Lucene -"
description = "The Open Relevance Project (ORP) was a small Apache Lucene™ sub-project aimed at making materials for doing relevance testing for..."
full_description = '''The Open Relevance Project (ORP) was a small Apache Lucene™ sub-project aimed at making materials for doing relevance testing for Information Retrieval (IR), Machine Learning and Natural Language Processing (NLP) into open source. Our initial focus was on creating collections, judgments, queries and tools for the Lucene ecosystem of projects (Lucene Java, Solr™, Nutch™, Mahout™, etc.) that can be used to judge relevance in a free, repeatable manner. The Apache Lucene Project Management Committee decided in a vote, that the Apache Lucene sub-project "Open Relevance" will be discontinued. The Apache Lucene Project Management Committee decided in a vote, that the Apache Lucene sub-project "Open Relevance" will be discontinued. There was only modest activity during the last years and the project made no releases. Thank you to all committers for their support in this project! The ORP Wiki is now available at http://cwiki.apache.org/ORP. Anyone can edit it, so please feel free to help out the ORP! The Apache Lucene PMC has officially voted to add the Open Relevance Project (ORP) as a Lucene subproject. ORP's main goal is to build out collections, judgments and queries in an open environment to make it easier for Lucene developers and users to do relevance testing, much like one would get if using TREC or other evaluation conferences. Copyright © 2011-2024 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Privacy Policy Apache and the Apache feather logo are trademarks of The Apache Software Foundation. Apache Lucene, Apache Solr and their respective logos are trademarks of the Apache Software Foundation. Please see the Apache Trademark Policy for more information.'''
