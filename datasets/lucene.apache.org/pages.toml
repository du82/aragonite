["https://lucene.apache.org/solr/community.html"]
title = "Community - Apache Solr"
description = "Support The Solr Community provides user support for free through the users mailing list and other channels mentioned here. There are..."
full_description = "The Solr Community provides user support for free through the users mailing list and other channels mentioned here. There are also a number of external companies and professionals ready to help, see the user-maintained list at cwiki.apache.org/confluence/display/solr/Support. We use mailing lists for all official project communications. To subscribe or unsubscribe you need to send an email to special addresses (e.g. users-subscribe@solr.apache.org to subscribe to the users list). This email must be sent from the email address you want to subscribe as or unsubscribe from. You will then need to confirm by replying to an automated e-mail from the list software. Clicking the SUBSCRIBE or UNSUBSCRIBE buttons below will open your e-mail software with a pre-filled email that is ready to send. Written communication is hard and prone to misunderstandings. We recommend reading ComDev's etiquette page for some practical tips on how to improve. This list is for users of Solr to ask questions, share knowledge, and discuss issues. We strongly encourage users to send usage and configuration questions and problems to this mailing list. Before filing an issue in the JIRA issue tracker, make sure it's a real bug and that it hasn't been already discovered by discussing it here. NOTE: This list was named solr-user@lucene.apache.org while Solr was a Lucene subproject. The list was migrated to Solr in March 2021, including subscriptions and archive. This is the list where participating developers of the Solr project meet and discuss issues concerning Solr internals, code changes/additions, etc. Please do not send mail to this list with usage questions or configuration questions and problems, that is what the users mailing list is for. Also see developer discussion archives at dev@lucene.apache.org from when Solr was a Lucene subproject. Notifications from JIRA / Pull Requests - issues@solr.apache.org: 📧 Subscribe 📧 Unsubscribe 🔗 Archives Notifications about CI builds by Jenkins - builds@solr.apache.org: 📧 Subscribe 📧 Unsubscribe 🔗 Archives"
