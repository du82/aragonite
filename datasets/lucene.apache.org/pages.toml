ceptual scoring formula: formatting only formatting only formatting only score(q,d) = query-boost(q) · Lucene conceptual scoring formula V(q) · V(d) ––––––––– |V(q)| · doc-len-norm(d) · doc-boost(d) Lucene Conceptual Scoring Formula The conceptual formula is a simplification in the sense that (1) terms and documents are fielded and (2) boosts are usually per query term rather than per query. We now describe how Lucene implements this conceptual scoring formula, and derive from it Lucene's Practical Scoring Function. For efficient score computation some scoring components are computed and aggregated in advance: Query-boost for the query (actually for each query term) is known when search starts. Query Euclidean norm |V(q)| can be computed when search starts, as it is independent of the document being scored. From search optimization perspective, it is a valid question why bother to normalize the query at all, because all scored documents will be multiplied by the same |V(q)|, and hence documents ranks (their order by score) will not be affected by this normalization. There are two good reasons to keep this normalization: Recall that Cosine Similarity can be used find how similar two documents are. One can use Lucene for e.g. clustering, and use a document as a query to compute its similarity to other documents. In this use case it is important that the score of document d3 for query d1 is comparable to the score of document d3 for query d2. In other words, scores of a document for two distinct queries should be comparable. There are other applications that may require this. And this is exactly what normalizing the query vector V(q) provides: comparability (to a certain extent) of two or more queries. Document length norm doc-len-norm(d) and document boost doc-boost(d) are known at indexing time. They are computed in advance and their multiplication is saved as a single value in the index: norm(d). (In the equations below, norm(t in d) means norm(field(t) in doc d) where field(t) is the field associated with term t.) Lucene's Practical Scoring Function is derived from the above. The color codes demonstrate how it relates to those of the conceptual formula: formatting only formatting only Lucene conceptual scoring formula score(q,d) = ∑ ( tf(t in d) · idf(t)2 · t.getBoost() · norm(t,d) ) t in q Lucene Practical Scoring Function where tf(t in d) correlates to the term's frequency, defined as the number of times term t appears in the currently scored document d. Documents that have more occurrences of a given term receive a higher score. Note that tf(t in q) is assumed to be 1 and therefore it does not appear in this equation, However if a query contains twice the same term, there will be two term-queries with that same term and hence the computation would still be correct (although not very efficient). The default computation for tf(t in d) in ClassicSimilarity is: term frequency computation tf(t in d) = frequency½ idf(t) stands for Inverse Document Frequency. This value correlates to the inverse of docFreq (the number of documents in which the term t appears). This means rarer terms give higher contribution to the total score. idf(t) appears for t in both the query and the document, hence it is squared in the equation. The default computation for idf(t) in ClassicSimilarity is: inverse document frequency computation idf(t) = 1 + log ( inverse document frequency computation docCount+1 ––––––––– docFreq+1 ) t.getBoost() is a search time boost of term t in the query q as specified in the query text (see query syntax), or as set by wrapping with BoostQuery. Notice that there is really no direct API for accessing a boost of one term in a multi term query, but rather multi terms are represented in a query as multi TermQuery objects, and so the boost of a term in the query is accessible by calling the sub-query getBoost(). norm(t,d) is an index-time boost factor that solely depends on the number of tokens of this field in the document, so that shorter fields contribute more to the score. See Also: IndexWriterConfig.setSimilarity(Similarity) IndexSearcher.setSimilarity(Similarity) Nested Class Summary Nested classes/interfaces inherited from class org.apache.lucene.search.similarities.Similarity Similarity.SimScorer Constructor Summary Constructors Constructor Description TFIDFSimilarity() Default constructor: parameter-free TFIDFSimilarity(boolean discountOverlaps) Primary constructor. Method Summary All MethodsInstance MethodsAbstract MethodsConcrete Methods Modifier and Type Method Description abstract float idf(long docFreq, long docCount) Computes a score factor based on a term's document frequency (the number of documents which contain the term). Explanation idfExplain(CollectionStatistics collectionStats, TermStatistics termStats) Computes a score factor for a simple term and returns an explanation for that score factor. Explanation idfExplain(CollectionStatistics collectionStats, TermStatistics[] termStats) Computes a score factor for a phrase. abstract float lengthNorm(int length) Compute an index-time normalization value for this field instance. final Similarity.SimScorer scorer(float boost, CollectionStatistics collectionStats, TermStatistics... termStats) Compute any collection-level weight (e.g. abstract float tf(float freq) Computes a score factor based on a term or phrase's frequency in a document. Methods inherited from class org.apache.lucene.search.similarities.Similarity computeNorm, getDiscountOverlaps Methods inherited from class java.lang.Object clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait Constructor Details TFIDFSimilarity public TFIDFSimilarity() Default constructor: parameter-free TFIDFSimilarity public TFIDFSimilarity(boolean discountOverlaps) Primary constructor. Method Details tf public abstract float tf(float freq) Computes a score factor based on a term or phrase's frequency in a document. This value is multiplied by the idf(long, long) factor for each term in the query and these products are then summed to form the initial score for a document. Terms and phrases repeated in a document indicate the topic of the document, so implementations of this method usually return larger values when freq is large, and smaller values when freq is small. Parameters: freq - the frequency of a term within a document Returns: a score factor based on a term's within-document frequency idfExplain public Explanation idfExplain(CollectionStatistics collectionStats, TermStatistics termStats) Computes a score factor for a simple term and returns an explanation for that score factor. The default implementation uses: idf(docFreq, docCount); Note that CollectionStatistics.docCount() is used instead of IndexReader#numDocs() because also TermStatistics.docFreq() is used, and when the latter is inaccurate, so is CollectionStatistics.docCount(), and in the same direction. In addition, CollectionStatistics.docCount() does not skew when fields are sparse. Parameters: collectionStats - collection-level statistics termStats - term-level statistics for the term Returns: an Explain object that includes both an idf score factor and an explanation for the term. idfExplain public Explanation idfExplain(CollectionStatistics collectionStats, TermStatistics[] termStats) Computes a score factor for a phrase. The default implementation sums the idf factor for each term in the phrase. Parameters: collectionStats - collection-level statistics termStats - term-level statistics for the terms in the phrase Returns: an Explain object that includes both an idf score factor for the phrase and an explanation for each term. idf public abstract float idf(long docFreq, long docCount) Computes a score factor based on a term's document frequency (the number of documents which contain the term). This value is multiplied by the tf(float) factor for each term in the query and these products are then summed to form the initial score for a document. Terms that occur in fewer documents are better indicators of topic, so implementations of this method usually return larger values for rare terms, and smaller values for common terms. Parameters: docFreq - the number of documents which contain the term docCount - the total number of documents in the collection Returns: a score factor based on the term's document frequency lengthNorm public abstract float lengthNorm(int length) Compute an index-time normalization value for this field instance. Parameters: length - the number of terms in the field, optionally discounting overlaps Returns: a length normalization value scorer public final Similarity.SimScorer scorer(float boost, CollectionStatistics collectionStats, TermStatistics... termStats) Description copied from class: Similarity Compute any collection-level weight (e.g. IDF, average document length, etc) needed for scoring a query. Specified by: scorer in class Similarity Parameters: boost - a multiplicative factor to apply to the produces scores collectionStats - collection-level statistics, such as the number of tokens in the collection. termStats - term-level statistics, such as the document frequency of a term across the collection. Returns: SimWeight object with the information this Similarity needs to score a query.'''
