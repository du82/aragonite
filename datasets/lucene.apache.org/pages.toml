["https://lucene.apache.org/core/10_1_0/MIGRATE.html"]
title = "Apache Lucene Migration Guide"
full_description = '''LUCENE-10376 started allowing DataInput#readVLong() to read negative vlongs. In particular, this feature is used by the DataInput#readZLong() method. A practical implication is that DataInput#readVLong() may now read up to 10 bytes, while it would never read more than 9 bytes in Lucene 9.x. As part of GITHUB#13820, GITHUB#13825, GITHUB#13830, this issue corrects DataInput.readGroupVInts to be public and not-final, allowing subclasses to override it. This change also removes the protected DataInput.readGroupVInt method: subclasses should delegate or reimplement it entirely. Apache OpenNLP 2.x opens the door to accessing various models via the ONNX runtime. To migrate you will need to update any deprecated OpenNLP methods that you may be using. Snowball has folded the "German2" stemmer into their "German" stemmer, so there's no "German2" anymore. For Lucene APIs (TokenFilter, TokenFilterFactory) that accept String, "German2" will be mapped to "German" to avoid breaking users. If you were previously creating German2Stemmer instances, you'll need to change your code to create GermanStemmer instances instead. For more information see https://snowballstem.org/algorithms/german2/stemmer.html RomanianAnalyzer now works with Romanian in its modern unicode form, and normalizes cedilla forms to forms with commas. Both forms are still in use in "the wild": you should reindex Romanian documents. For indices newly created as of 10.0.0 onwards, IndexWriter preserves document blocks indexed via IndexWriter#addDocuments or IndexWriter#updateDocuments when index sorting is configured. Document blocks are maintained alongside their parent documents during sort and merge. The internally used parent field must be configured in IndexWriterConfig only if index sorting is used together with documents blocks. See IndexWriterConfig#setParendField for reference. The API of interfaces for accepting highlights has changed to allow performance improvements. Look at the issue and the PR diff to get a sense of what's changed (changes are minor).'''
