full_description = "Lucene 10.1.0 expressions API The Expressions Module for Apache Lucene The expressions module is new to Lucene 4.6. It provides an API for dynamically computing per-document values based on string expressions. The module is organized in two sections: org.apache.lucene.expressions - The abstractions and simple utilities for common operations like sorting on an expression org.apache.lucene.expressions.js - A compiler for a subset of JavaScript expressions For sample code showing how to use the API, see Expression. Packages Package Description org.apache.lucene.expressions Expressions. org.apache.lucene.expressions.js Javascript expressions."
