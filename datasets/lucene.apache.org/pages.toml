title = "Overview (Lucene 10.1.0 test-framework API)"
description = "package index"
full_description = "Lucene 10.1.0 test-framework API The Lucene Test Framework is used by Lucene as the basis for its tests. The framework can also be used for testing third-party code that uses the Lucene API. Packages Package Description org.apache.lucene.tests.analysis Support for testing analysis components. org.apache.lucene.tests.analysis.standard Classes to support StandardAnalyzer component testing. org.apache.lucene.tests.codecs.asserting Codec for testing that asserts various contracts of the codec apis. org.apache.lucene.tests.codecs.blockterms Codecs for testing that support org.apache.lucene.codecs.blockterms. org.apache.lucene.tests.codecs.bloom Support for generating test indexes using the BloomFilteringPostingsFormat. org.apache.lucene.tests.codecs.cheapbastard Codec that unreasonably tries to use as little RAM as possible. org.apache.lucene.tests.codecs.compressing Support for testing Lucene90CompressingStoredFieldsFormat. org.apache.lucene.tests.codecs.compressing.dummy Dummy CompressingCodec implementation used for testing. org.apache.lucene.tests.codecs.cranky Codec for testing that throws random IOExceptions org.apache.lucene.tests.codecs.mockrandom Frankenstein codec for testing that pieces together random components. org.apache.lucene.tests.codecs.ramonly Codec for testing that never writes to disk. org.apache.lucene.tests.codecs.uniformsplit Test PostingsFormat for testing org.apache.lucene.codecs.uniformsplit with block encryption using basic ROT13. org.apache.lucene.tests.codecs.uniformsplit.sharedterms Test PostingsFormat for testing org.apache.lucene.codecs.uniformsplit.sharedterms with block encryption using basic ROT13. org.apache.lucene.tests.codecs.vector Codecs for testing different vector formats. org.apache.lucene.tests.geo Reusable geo test utilities. org.apache.lucene.tests.index Support for testing of indexes. org.apache.lucene.tests.mockfile Support for testing/debugging with virtual filesystems org.apache.lucene.tests.search Support for testing search components. org.apache.lucene.tests.search.similarities Support for testing similarities. org.apache.lucene.tests.store Support for testing store mechanisms. org.apache.lucene.tests.util General test support. org.apache.lucene.tests.util.automaton Support for testing automata. org.apache.lucene.tests.util.fst Support for FST testing."
