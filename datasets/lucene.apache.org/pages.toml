title = "Apache Lucene - Welcome to JCC, PyLucene's code generator"
description = "What is JCC ? JCC is a C++ code generator that produces a C++ object interface wrapping a Java library via Java's Native Interface..."
full_description = "JCC is a C++ code generator that produces a C++ object interface wrapping a Java library via Java's Native Interface (JNI). JCC also generates C++ wrappers that conform to Python's C type system making the instances of Java classes directly available to a Python interpreter. When generating Python wrappers, JCC produces a complete Python extension module via the distutils or setuptools packages. JCC requires Python version 2.x (x >= 3.5) or Python version 3.x (x >= 3) and Java version 1.x (x >= 4). Building JCC requires a C++ compiler. Use of setuptools is recommended. If you'd like to contribute to JCC or are having issues or questions with JCC, please subscribe to the PyLucene developer mailing list Copyright © 2011-2024 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Privacy Policy Apache and the Apache feather logo are trademarks of The Apache Software Foundation. Apache Lucene, Apache Solr and their respective logos are trademarks of the Apache Software Foundation. Please see the Apache Trademark Policy for more information."
