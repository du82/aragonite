full_description = '''JCC's source code is included with PyLucene's. If you've downloaded the PyLucene source code already, JCC's is to be found in the jcc subdirectory. JCC is a Python extension written in Python and C++. It requires a Java Runtime Environment to operate as it uses Java's reflection APIs to do its work. It is built and installed via distutils or setuptools. On MacOS and Windows, setup.py will attempt to find a JDK on your system and report what it found by showing the values for JAVAHOME and JAVAFRAMEWORKS it was able to derive. If the JDK installation that was found is not the one you wish to use or if you are not on MacOS or Windows, you can either edit setup.py and review that the values in the INCLUDES, CFLAGS, DEBUG_CFLAGS, LFLAGS, JAVAC, and JAVADOC dicts are correct for your system or set all of the environment variables JCC_JDK, JCC_INCLUDES, JCC_CFLAGS, JCC_DEBUG_CFLAGS, JCC_LFLAGS, JCC_JAVAC and JCC_JAVADOC, using os.pathsep as value separator to override them. The values hereby configured are going to be compiled into JCC's config.py file and are going to be used by JCC when invoking setuptools to compile the extensions it is used to generate code for. JCC requires a Java Development Kit to be present. It uses the Java Native Invocation (JNI) interface and expects <jni.h> and the Java libraries to be present at build and runtime. JCC requires a C++ compiler. A recent C++ compiler for your platform is recommeded and should work as expected. JCC includes a small runtime that keeps track of the Java VM and of Java objects escaping it. Because there can be only one Java VM embedded in a given process at a time, the JCC runtime must be compiled as a shared library when more than one JCC-built Python extension is going to be imported into a given Python process. Shared mode depends on setuptools' capability of building plain shared libraries (as opposed to shared libraries for Python extensions). Currently, shared mode is supported with setuptools 0.6c7 and above out of the box on MacOS and Windows. On Linux, a patch to setuptools needs to be applied first. This patch is included in the JCC source distribution in the jcc2/patches directory, patch.43. This patch was submitted to the setuptools project years ago via "Issue 43", originally tracked in the long defunct bugs.python.org/setuptools bug tracker. setup.py will attempt to apply the patch for you via monkeypatching.'''
