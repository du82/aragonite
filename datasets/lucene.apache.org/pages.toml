["https://lucene.apache.org/code-of-conduct.html"]
title = "Apache Lucene - Code of Conduct"
description = """
Apache Lucene set the standard for search and indexing performance.  Lucene is the search core of both Apache Solr™ and Elasticsearch™."""
full_description = "Apache Lucene set the standard for search and indexing performance. Lucene is the search core of both Apache Solr™ and Elasticsearch™. Our core algorithms along with the Solr search server power applications the world over, ranging from mobile devices to sites like Twitter, Apple and Wikipedia. For a large and diverse community like ours to be friendly, welcoming and respectful, we recognize the need for some guidelines. The project follows Apache's Code of Conduct statement. Please take some time to read and understand it. If you feel there has been a violation of this code, please point out your concerns publicly in a friendly and matter of fact manner. Nonverbal communication is prone to misinterpretation and misunderstanding. Everyone has bad days and sometimes says things they regret later. Someone else's communication style may clash with yours, but the difference can be amicably resolved. After pointing out your concerns please be generous upon receiving an apology. Should there be repeated instances of code of conduct violations, or if there is an obvious and severe violation, the Lucene PMC may become involved. Written communication is hard and prone to misunderstandings. We recommend reading ComDev's etiquette page for some practical tips on how to improve. As an Apache project we strive to follow The Apache Way. If you are new to the community or to open source in general, you may benefit from understanding our core values as a community, and why we operate the way we do. Copyright © 2011-2024 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Privacy Policy Apache and the Apache feather logo are trademarks of The Apache Software Foundation. Apache Lucene, Apache Solr and their respective logos are trademarks of the Apache Software Foundation. Please see the Apache Trademark Policy for more information."
