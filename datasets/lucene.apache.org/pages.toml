title = "Apache Lucene - Welcome to PyLucene"
description = "What is PyLucene ? PyLucene is a Python extension for accessing Java Lucene™. Its goal is to allow you to use Lucene's text indexing..."
full_description = "PyLucene is a Python extension for accessing Java Lucene™. Its goal is to allow you to use Lucene's text indexing and searching capabilities from Python. It is API compatible with Java Lucene version 10.0.0 as of October 20th, 2024. PyLucene is not a Lucene port but a Python wrapper around Java Lucene. PyLucene embeds a Java VM with Lucene into a Python process. The PyLucene Python extension, a Python module called lucene is machine-generated by JCC. PyLucene is built with JCC, a C++ code generator that makes it possible to call into Java classes from Python via Java's Native Invocation Interface (JNI). Sources for JCC are included with the PyLucene sources. PyLucene requires Python 3.x (x >= 3), and Java x (x >= 8 for PyLucene 8 and earlier, x >= 11 for PyLucene 9, x >= 21 for PyLucene 10). Python 2 support is untested since PyLucene 9.4.1 / JCC 3.13. Building PyLucene requires GNU Make and a C++ compiler. Use of setuptools is recommended. See the PyLucene installation instructions for more information about building PyLucene from sources. This release tracks Lucene Core's 10.0.0 release and requires Java 21 or greater. See PyLucene 10.0.0 CHANGES and JCC 3.15 CHANGES for details. Source distributions are available here. This release tracks Lucene Core's 9.12.0 release and requires Java 11 or greater. See PyLucene 9.12.0 CHANGES and JCC 3.14 CHANGES for details. Source distributions are available here. This release tracks Lucene Core's 9.10.0 release and requires Java 11. See PyLucene 9.10.0 CHANGES and JCC 3.14 CHANGES for details. Source distributions are available here. Copyright © 2011-2024 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Privacy Policy Apache and the Apache feather logo are trademarks of The Apache Software Foundation. Apache Lucene, Apache Solr and their respective logos are trademarks of the Apache Software Foundation. Please see the Apache Trademark Policy for more information."
