full_description = 'Official releases are usually created when the developers feel there are sufficient changes, improvements and bug fixes to warrant a release. Due to the voluntary nature of Lucene, no releases are scheduled in advance. System Requirements are detailed here. The above release files should be verified using the PGP signatures and the project release KEYS. See verification instructions for a description of using the PGP and KEYS files for verification. SHA checksums are also provided as alternative verification method. The lucene-VERSION.zip or .tar.gz (where VERSION is the version number of the release, e.g. 3.0.1) file contains the lucene-core jar file, html documentation, a demo application (see the "Getting Started" section) and various jar files containing contributed code. The lucene-VERSION-src.zip or .tar.gz contains the full source code for that version. Copyright © 2011-2024 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Privacy Policy Apache and the Apache feather logo are trademarks of The Apache Software Foundation. Apache Lucene, Apache Solr and their respective logos are trademarks of the Apache Software Foundation. Please see the Apache Trademark Policy for more information.'
