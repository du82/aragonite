full_description = "This list is for users of Java Lucene to ask questions, share knowledge, and discuss issues. Do send mail to this list with usage and configuration questions and problems. Also, please send questions to this list to verify your problem before filing issues in JIRA. This is the list where participating developers of the Java Lucene project meet and discuss issues concerning Lucene internals, code changes/additions, etc. NOTE: Please do not send mail to this list with usage questions or configuration questions and problems; that is what the java-user mailing list is for. This is an automated announcement only list where notifications about all JIRA issues and Github pull requests are sent. This is an automated announcement only list where notifications about all CI builds by Jenkins are sent. The IRC channel can be used for online discussion about Lucene related stuff, but developers should be careful to transfer all the official decisions or useful discussions to the issue tracking system. The project's Slack channel is the #lucene-dev channel in the the-asf organization. Link: https://the-asf.slack.com/messages/CE70MDPMF Use the Apache service Ponymail - lists.apache.org to browse the mail archives of all the project's mailing lists. Copyright © 2011-2024 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Privacy Policy Apache and the Apache feather logo are trademarks of The Apache Software Foundation. Apache Lucene, Apache Solr and their respective logos are trademarks of the Apache Software Foundation. Please see the Apache Trademark Policy for more information."
