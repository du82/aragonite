["https://lucidmeetings.com/legal/privacy"]
title = "Privacy Policy"
description = "Last Modified: September 28, 2021 See the previous version of this policy Thank you for your engagement in the Second Rise community! Our mission is to help people develop and scale effective meeting practices by providing education, technology, and services such as the Lucid Meetings platform and the Lucid Meeting School. Privacy Policy: The Short Version We never sell"
full_description = '''Legal All the Legal Bits Terms of Service Acceptable Use Policy Privacy Policy Referral Agreement Template Designer Privacy Policy Last Modified: September 28, 2021 See the previous version of this policy Thank you for your engagement in the Second Rise community! Our mission is to help people develop and scale effective meeting practices by providing education, technology, and services such as the Lucid Meetings platform and the Lucid Meeting School. Privacy Policy: The Short Version We never sell personal information to third parties for advertising, marketing, or any other purposes. We make money when people pay directly for our services and technology; not by selling your information to others. We love the many experts we feature on our websites, and we hope you will too. We provide details showing how you can learn more about each one and contact them directly, which they would appreciate because they will never hear about your interest from us. We do not share your personal information with anyone without your consent. We believe that your information belongs to you and that you should have full control over what you share, with whom, and when. Our services all include features designed to give you that control. You will see an option to unsubscribe from any marketing email we send you. Your online accounts with us include features for editing, exporting, or deleting any information you’ve provided. We conduct our business on the internet, which means we use standard tracking and monitoring technologies like nearly all modern internet-based businesses do. When you visit our websites and engage with our Services, tracking technologies record this activity. We guard this information closely and use it to help us improve our Services. We also rely on several third parties, such as secure payment processors and email delivery services, to provide our Services. These third parties will access your information only to perform tasks on our behalf, operating in compliance with this Privacy Policy. We’re available to answer your questions. You can contact us with questions about this Policy at info@secondrise.com. Privacy Policy: The Detailed Version Read below to learn more details about how we collect, use, and handle your personal information when you use our websites, software, and services (“Services”). What We Collect and Why Personal Information You Provide We may collect the following personal information directly from you when you use our Services. Contact Information, such as name, email address, mailing address, geographic location, or phone number; Information about your business, such as company name, company size, business type; Billing Information, such as credit card number and billing address; Unique Identifiers, such as username, account number or password; Some of our services let you access your accounts and your information with other service providers. You may be asked to share information from these third-party accounts with our Services. For example, if you log in to our Services using a Google account, you may choose to share your contact information, calendar details, and profile picture from Google with our Services. Information Our Users May Provide About You If you use our Services through another user’s account, such as your employer or someone who has invited you to a meeting, that user may have provided us with this information about you: Contact Information, such as name and email address; Your representation or role, including company name, and job title Your Content You may use our Services to collect Your Content. Our Services are designed to make it simple for you to store your files, meeting records, attendee information, communications, training progress, and so on (“Your Content”), collaborate with others, and work across multiple devices. To make that possible, we store, process, and transmit Your Content as well as information related to it. This related information includes your profile information that makes it easier to collaborate and share Your Content with others. We have no control over the information contained within Your Content, including any personal information. Our Services provide you with different options for sharing Your Content. Other Information You Provide We collect other information that you provide through our Services, for example when you participate in a survey, activity or event, apply for a job, request customer support, communicate with us via third-party social media sites or otherwise communicate with us. For example, information regarding a problem you are experiencing with our Services could be submitted to our support system. Usage Information We collect information related to how you use the Services, including actions you take in your account. We use this information to improve our Services, provide support, develop new services and features, and protect other users of the Services. Device Information We also collect information from and about the devices you use to access the Services. This includes things like IP addresses, the type of browser and device you use, the web page you visited before coming to our sites, and identifiers associated with your devices. Your devices (depending on their settings) may also transmit location information to the Services. Cookies and Other Technologies We use technologies like cookies and pixel tags to provide, improve, protect, and promote our Services. For example, cookies help us with things like remembering your username for your next visit, understanding how you are interacting with our Services, and improving them based on that information. You can set your browser to not accept cookies, but this will limit your ability to use the Services. Marketing We offer some of our Services free of charge. These free Services are made possible because some users choose to pay for one of our paid Services. If you provide information when using our free Services, we will, from time to time, send you information about our paid Services. You can opt out of these marketing materials at any time. If you do not want to receive marketing materials from us, simply click the "unsubscribe” link in any email, or update your preferences in the Notifications section of your personal account. Personal Information Provided by Other Users When a User (such as a Lucid Meetings Account Owner or Meeting Manager) includes your personal information in the Content they manage using our Services, that User is considered the data controller of that Content. Please understand that we do not own, control or direct the use of the Content stored or processed in the Services by our Users, and in fact, we are largely unaware of what that Content contains. We only access such information as reasonably necessary to provide the Services (including to respond to support requests), as authorized by our customers, or as required by law. It is our Users’ responsibility to obtain necessary consent for any personal information that is collected through use of our Services. As the processors of personal information on behalf of our users, we follow their instructions with respect to the information they control to the extent consistent with the functionality, Acceptable Use Policy, and Terms of Use for our Services. If you are an employee of or participate in meetings with one of our Users using our Services and would no longer like to have your personal information available in our Services, please contact the User (the data controller) that you interact with directly. Information We Do Not Share We do not sell information to advertisers or other third parties. We do not share Personal Information about you with third parties for their marketing purposes (including direct marketing purposes) without your permission. When We Share Information We may share information as discussed below. With Others Working for and with Second Rise We may transfer personal information to Second Rise employees and sub-contractors that help us provide our Services. Transfers to subsequent third parties are covered by the service agreements with our sub-contractors. Such sub-contractors may include third-party payment processors who process your credit card and data hosting providers, for example. These third parties will access your information only to perform tasks on our behalf in compliance with this Privacy Policy, and we remain responsible for their handling of your information per our instructions. With Other Users Our Services display Your Content to other users in places like the meeting records in which you both participated and in public online discussion forums. You can also share Your Content with other users if you choose. Third-Party Applications You can choose to give third-party providers access to your information and account—for example, via Second Rise APIs and integrations. Please note that their use of your information will be governed by their privacy policies and terms. Law & Order and the Public Interest We may disclose your information to third parties if we determine that such disclosure is reasonably necessary to: (a) comply with any applicable law, regulation, legal process, or appropriate government request; (b) protect any person from death or serious bodily injury; (c) prevent fraud or abuse of our Services or our users; (d) protect Second Rise’s rights, property, safety, or interest; or (e) perform a task carried out in the public interest. How We Protect Your Information We have a team dedicated to keeping your information secure and testing for vulnerabilities. We have implemented safeguards to protect the information we collect, including Your Content and personal information. However, no company, including Second Rise, can guarantee the absolute security of Internet communications. If you have any questions please contact us at info@secondrise.com. How You Can Limit the Use and Disclosure of Your Personal Data Individuals have the right to limit the use and disclosure of their personal information as required by the Privacy Shield's Principles, such as whether your personal information is disclosed to a third party or used for purposes materially different from the purpose for which the personal information was originally collected or subsequently authorized by you. If you wish to limit the use and disclosure of personal information in accordance with the Privacy Shield Principles, please contact us at info@secondrise.com. User Controls You can access, amend, download, and delete your personal information and content by logging into your account in the Services. Our Services are also designed to make it easy for you to export Your Content. Opting Out You may opt out of receiving marketing communications by using the unsubscribe link within each email or updating your email preferences within the Services account settings menu. Even after you opt out from receiving marketing messages from us, you will continue to receive transactional messages from us regarding the Services as long as you retain an active account in the Services. Closing Your Account and Data Retention When you sign up for an account with us, we’ll retain the information you store on our Services for as long as your account is in existence or as long as we need it to provide you the Services. If you delete your account, we will immediately remove any Content you own upon confirmation. But please note: (1) there might be some latency in deleting this information from our servers and back-up storage; (2) deleting your account will remove Content owned by your account but will not remove records of your participation in another User’s account; and (3) we may retain some information if necessary to comply with our legal obligations, resolve disputes, or enforce our agreements. Requesting Deletion of Your Data To request permanent deletion of your data from our systems, contact info@secondrise.com. Where We Store Data In the United States and Around the World We are based in the United States and the information we collect is governed by U.S. law. To provide you with the Services, we may store, process, and transmit information in the United States and locations around the world—including those outside your country. These locations (including the United States) may not guarantee the same level of protection of personal information as the location in which you reside. By using the Services, you acknowledge and agree to any such transfer of information outside of the location in which you reside. EU-U.S. Privacy Shield Second Rise complies with the EU-U.S. Privacy Shield Frameworks (Privacy Shield) as set forth by the U.S. Department of Commerce regarding the collection, use, and retention of personal information transferred from the European Union and the United Kingdom to the United States in reliance on Privacy Shield. Second Rise has certified to the Department of Commerce that it adheres to the Privacy Shield Principles with respect to such information. If there is any conflict between the terms in this privacy policy and the Privacy Shield Principles, the Privacy Shield Principles shall govern. You can find Second Rise’s Privacy Shield certification here. You can also learn more about Privacy Shield at https://www.privacyshield.gov. Complaints or Questions About Our Privacy Shield Certification Second Rise is subject to oversight by the U.S. Federal Trade Commission. If you have any questions or complaints regarding our Privacy Shield Certification, please first contact us at info@secondrise.com. We will promptly investigate and attempt to resolve any complaints, and will respond to you within 20 days of receiving any such complaint. If you aren’t satisfied with our response, please contact JAMS at https://www.jamsadr.com/eu-us-privacy-shield. JAMS is the US-based independent organization responsible for reviewing and resolving complaints about our Privacy Shield compliance—free of charge to you. In the event your concern still isn’t addressed by JAMS, you may be entitled to a binding arbitration under Privacy Shield and its principles. Changes If we are involved in a reorganization, merger, acquisition, or sale of our assets, your information may be transferred as part of that deal. We will notify you (for example, via a message to the email address associated with your account) of any such deal and outline your choices in that event. We may revise this Privacy Policy from time to time, and will post the most current version on our website. If a revision meaningfully changes your rights, we will notify you. CONTACT US Second Rise, LLC 7805 Sw 40th Ave #80037 Portland, OR, 97280 phone: +1 (877) 291-2384 email: info@secondrise.com Lucid Meetings is a service of Second Rise, LLC'''
year_published = 2025
