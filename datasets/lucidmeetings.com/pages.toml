["https://lucidmeetings.com/meeting-types"]
title = "The 16 Types of Meetings"
description = "Use this interactive chart of the 16 types of business meetings to learn about each type of meeting and how teams can use these meetings to solve problems, answer questions, and get work done."
full_description = "Background Learn more about meeting types. Read the Book: Where the Action Is: The Meetings that Make or Break Your Organization The 16 Types of Business Meetings (and Why They Matter) A Periodic Table of Meeting Types? Get the Taxonomy Overview PDF To make meetings work in your business, you must get specific and design them to do so. Explore the 16 types of business meetings to learn about each type of meeting and how teams can use these meetings to solve problems, answer questions, and get work done. Cadence Meetings Cadence meetings include meetings like day-to-day team check-ins, weekly project status meetings, One-on-Ones, and board meetings—all the regularly repeated meetings that make up the vast majority of the meetings held in the modern workplace. These meetings involve existing groups executing on known work. They maintain and shape the organization's current state. Team Cadence Examples Weekly Team Meeting Shift-Change Meeting Regular Committee Meeting Learn More Progress Check Examples The Project Status Meeting The Client Check-In The Sprint Demo Learn More One-on-One Examples The Manager One-on-One Coaching Sessions The “Check In” Learn More Action Review Examples Retrospectives After Action Reviews Win/Loss Review (Sales) Learn More Governance Cadence Examples Board Meetings Quarterly Strategic Reviews QBRs Learn More Catalyst Meetings Catalyst meetings are scheduled as needed, and include the people the organizers feel to be best suited for achieving the meeting goals. That could be an established team, like it is with product Planning or marketing Planning meetings, or the group could be a surprise, like it is with a community outreach Workshop. Idea Generation Examples Ad Campaign Brainstorming Session New Product Ideas Party Theme Ideas Learn More Planning Examples Project Planning Campaign Planning Event Planning Learn More Workshops Examples Kickoffs Design Workshops Team Building Workshop Learn More Problem Solving Examples Incident Response Strategic Issue Resolution Major Project Change Resolution Learn More Decision Making Examples New Hire Decision Go/No-Go Decision Logo Selection Learn More Context: Learn and Influence Meetings Evaluate, influence, persuade, investigate, inspect, inspire—these meetings are all designed to transfer information and intention from one person or group to another. The people involved can be clearly separated into groups that think of themselves as us and the others as them. Sensemaking Examples Project Discovery Meetings Incident Investigations Community Input Sessions Learn More Introductions Examples Job Interviews Sales Demos Investor Pitches Learn More Issue Resolution Examples Support Team Escalation Conflict Resolution Neighborhood Dispute Learn More Community of Practice Examples Monthly Safety Committee Meeting Project Manager’s Meetup Lunch-and-Learn Learn More Training Examples Client Training New Employee Onboarding Safety Training Learn More Broadcasts Examples Marketing Webinar Press Conference All-Hands Announcement Learn More"
