full_description = 'Legal All the Legal Bits Terms of Service Acceptable Use Policy Privacy Policy Referral Agreement Template Designer TERMS OF SERVICE Download these terms as PDF Last Modified: November 1, 2015 Last Reviewed: January 18, 2019 PLEASE READ THESE CUSTOMER TERMS OF SERVICE CAREFULLY. Lucid Meetings is a service of Second Rise, LLC. This is a contract between you (the Customer) and us (Lucid Meetings). It describes the services we will provide to you, how we will work together, and other aspects of our business relationship. By using the Subscription Service or receiving the Consulting Services, you are agreeing to these terms. We periodically update these terms and we will let you know when we do by, for example, sending an email to the contact you designate in the applicable Order, posting on our blog, or through your Lucid Meetings account. You can find archived versions of the terms here. We have several different services, and there are some provisions that apply only to specific services. The ‘General Terms’ apply to all of our services, except as we explain in the ‘Service Terms,’ which apply to the specific services identified. Please carefully review the ‘Service Terms,’ as this section will control if there’s any conflict between the ‘General Terms’ and the ‘Service Terms.’ GENERAL TERMS 1. Definitions "Agreement" means these Customer Terms of Service and all materials referred or linked to here. “Billable Users” means those types of Users (defined below) for which we charge you fees as defined in your Order and set forth at lucidmeetings.com/pricing. "Billing Period" means the period for which you agree to pay fees on your Order Form, and is the same as or shorter than the Subscription Term. For example, if you subscribe to the Subscription Service for a one (1) year Initial Subscription Term, with a twelve (12) month upfront payment, the Billing Period is twelve (12) months. Conversely, if you chose the monthly billing option, the Billing Period is one (1) month. “Confidential Information” means all information provided by you or us ("Discloser") to the other (“Receiver”), whether orally or in writing, that is designated as confidential. Confidential Information does not include any information that (i) is or becomes generally known to the public without breach of any obligation owed to the Discloser or (ii) was known to the Receiver before receipt from the Discloser. "Consulting Services" means the professional services provided to you by us, which may include training services, configuration, integration, or other consulting services. “Licensors” are entities or individuals with whom we have contracted for use of their service and that service is fully integrated into the Subscription Service such that you do not see or experience it as separate from the Subscription Service. A service owned by a Licensor is a Third-Party Service, but not all Third-Party Services belong to Licensors. "Lucid Meetings", "we", "us" or “our” means Lucid Meetings, a DBA of Second Rise, LLC. "Lucid Meetings Content" means all information, data, text, messages, software, sound, music, video, photographs, graphics, images, and tags that we incorporate into the Subscription Service or Consulting Services. "Maximum Users" means the maximum number of Billable Users you are permitted to use with the Subscription Service as identified in your Order Form. “Meeting Room” means a dedicated project or team space within the Subscription Service that is intended for use by one group running private meetings. “Order Form" or "Order" means the Lucid Meetings-approved form or online subscription process by which you agree to subscribe to the Subscription Service and purchase Consulting Services. The purchase form may be referred to as a "Statement of Work" if you are purchasing only Consulting Services. An “Order” also includes any applicable Service or Support and Maintenance renewal, or purchases you make to increase or upgrade your Scope of Use. "Sensitive Information" means credit or debit card numbers; personal financial account information; Social Security numbers; passport numbers; driver’s license numbers or similar identifiers; racial or ethnic origin; physical or mental health condition or information; or other employment, financial or health information, including any information subject to regulations, laws or industry standards designed to protect data privacy and security, such as the Health Insurance Portability and Accountability Act and the Payment Card Industry Data Security Standards. "Subscription Fee" means the amount you pay for access to the Subscription Service. "Subscription Service" means our web-based meeting and meeting management software, tools and platform that you have subscribed to by an Order Form or that we otherwise make available to you, and is developed, operated, and maintained by us, accessible via lucidmeetings.com or another designated URL, as well as any ancillary services that we provide to you. "Subscription Term" means the Initial Subscription Term and all Renewal Subscription Terms. “Telecommunication Services" means third-party screen sharing, telephone, web, and video conferencing communication services linked to or embedded in the Subscription Service that enable audio and video communication during a meeting. Use of some Telecommunication Services may incur additional fees. "Third-Party Services" means services that are provided by third parties and which interoperate with or are used in connection with the Subscription Service. These services include non-Lucid Meetings technologies available from, for example, the following: our integrations page, partner directory, template marketplace, and links made available through the Subscription Service. "Third-Party Sites" means third-party websites linked from within the Subscription Service. "Users" means you, your affiliates, employees, representatives, consultants, contractors, agents, customers, or other third parties who are acting for your benefit or on your behalf and have unique user identifications and passwords for the Subscription Service. "You", "your" or “Customer” means the person or entity using the Subscription Service or receiving the Consulting Services and identified in the applicable billing statement, online subscription process, Order Form or Statement of Work as the customer. “Your Data" means all data, content, images or other materials of any type that you provide or post, upload, input or submit for use within the Subscription Service. 2. The Subscription Service Orders: Your Order will specify your authorized scope of use for the Service, the type of user constituting a Billable User, and the expected payment schedule for all Subscription Fees. Access. During the Subscription Term, we will provide you access to use the Subscription Service as described in this Agreement. Limits. Limits may apply to the number of Meeting Rooms, Billable Users, data storage or capacity, Telecommunication Services or other restrictions or billable units, as applicable. Any limits will be specified either in your Order Form or this Agreement. Modifications. We may modify the Subscription Service from time to time, which may include adding or deleting features and functions, in an effort to improve your experience. We will not make changes to the Subscription Service that materially reduces the core functionality of the Subscription Service provided to you during the Subscription Term. We may provide some or all elements of the Subscription Service through third party service providers. Additional Features. You may subscribe to additional features of the Subscription Service by submitting and agreeing to a new Order Form. 3. Consulting Services You may purchase Consulting Services through an Order Form or Statement of Work. Fees for these Consulting Services are in addition to your Subscription Fee. If you purchase Consulting Services that recur, they will be considered part of your subscription and will renew in accordance with the ‘Renewal Subscription Term’ section below. Unless otherwise explicitly indicated on the Order, all Consulting Services are performed remotely. For Consulting Services performed on-site, you will reimburse us our reasonable cost for all expenses incurred in connection with the Consulting Services. Any invoices or other requests for reimbursements will be due and payable within thirty (30) days of the date of the invoice. Consulting Services are non-cancellable and all fees for Consulting Services are non-refundable. 4. Fees and Payments Fees and Payment. You are responsible for all fees associated with your use of the Subscription Service, including fees for any Consulting Services, Telecommunication Services, and other services or offerings you may order from us. All fees are due and payable as set forth in your invoice and, unless otherwise agreed in writing, payments are due no later than thirty (30) days from the date of the invoice. You agree to notify us of any fee dispute within fifteen (15) days of the invoice date. You agree to work with us in good faith to promptly resolve any dispute and pay the resulting fees within fifteen (15) days following resolution of the dispute. When applicable, you authorize us to charge your credit card or bank account for all fees and expenses in your invoice or in accordance with your Order. You further authorize us to use a third party to process payments, and consent to the disclosure of your payment information to such third party. We are not responsible for any overdraft or other charges that may arise as a result of processing payment. We reserve the right to update our prices and will notify you of any change in our prices by posting on our blog, through your Lucid Meetings account, or in the Service itself. Price changes will be effective as of the next Billing Period following the change. Payment Information. You agree to keep your contact information, billing information and credit card information (where applicable) up to date. You may make changes on your Billing Page within your Lucid Meetings account. All payment obligations are non-cancelable and all amounts paid are non-refundable, except as specifically provided for in this Agreement. Sales Tax. All fees are exclusive of taxes, which we will charge as applicable. You agree to pay any taxes applicable to your use of the Subscription Service and performance of Consulting Services. You shall have no liability for any taxes based upon our gross revenues or net income. If you are located in the European Union, all fees are exclusive of any VAT and you represent that you are registered for VAT purposes in your member state. At our request, you will provide us with the VAT registration number under which you are registered in your member state. If you are subject to GST, all fees are exclusive of GST. If you are required to deduct or withhold any tax, you must pay the amount deducted or withheld as required by law and pay us an additional amount so that we receive payment in full as if there were no deduction or withholding. 5. Subscription Term and Renewal The Subscription Services are provided for a set term specified in your Order (“Subscription Term”). Except as otherwise specified in your Order, all subscriptions will automatically renew for periods equal to your initial Subscription Term (and you will be charged at the then-current rates) unless you cancel your subscription. If you cancel, your subscription will terminate at the end of then-current Billing Period, but you will not be entitled to any credits or refunds for amounts accrued or paid prior to such termination. 6. Termination, Suspension and Expiration Termination for Cause. This Agreement is in effect for as long as you have a valid Subscription Term, unless sooner terminated as permitted in this Agreement. Either party may terminate this Agreement before the expiration of the Term if the other party materially breaches any of the terms of this Agreement and does not cure the breach within thirty (30) days after written notice of the breach. Either party may also terminate the Agreement before the expiration of the Term if the other party ceases to operate, declares bankruptcy, or becomes insolvent or otherwise unable to meet its financial obligations. You may terminate this Agreement at any time with notice to Lucid Meetings, but you will not be entitled to any credits or refunds as a result of convenience termination for prepaid but unused Subscription Services. Suspension for Prohibited Acts. We may suspend any User’s access to the Subscription Service for: (i) use of the Subscription Service in a way that violates applicable local, state, federal, or foreign laws or regulations or the terms of this Agreement, (ii) use of the Lucid Meetings email invitation sending service that results in excessive bounce-backs, SPAM notices or requests for removal from a mailing list by recipients, or (iii) repeated instances of posting or uploading material that infringes or is alleged to infringe on the copyright or trademark rights of any person or entity. Suspension for Non-Payment. We may suspend your access to all or any part of the Subscription Service upon ten (10) days’ notice to you of non-payment of any amount past due. We will not suspend the Subscription Service while you are disputing the applicable charges reasonably and in good faith and are cooperating diligently to resolve the dispute. If the Subscription Service is suspended for non-payment, we may charge a re-activation fee to reinstate the Subscription Service. Suspension for Present Harm. If your use of the Subscription Service: (i) is being subjected to denial of service attacks or other disruptive activity, (ii) is being used to engage in denial of service attacks or other disruptive activity, (iii) is creating a security vulnerability for the Subscription Service or others, (iv) is consuming excessive bandwidth, or (v) is causing harm to us or others, then we may, with electronic or telephonic notice to you, suspend all or any access to the Subscription Service. We will try to limit the suspension to the affected portion of the Subscription Service and promptly resolve the issues causing the suspension of the Subscription Service. Effect of Termination or Expiration. Upon termination or expiration of this Agreement, you will stop all use of the Subscription Service and Lucid Meetings Content. If you terminate this Agreement for cause, we will promptly refund any prepaid but unused fees covering use of the Subscription Service after termination. If we terminate this Agreement for cause, you will promptly pay all unpaid fees due through the end of the Subscription Term. Fees are otherwise non-refundable. Retrieval of Your Data. As long as you have paid all fees owed to us, if you make a written request within thirty (30) days after termination or expiration of your Subscription, we will p'
