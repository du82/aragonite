["https://lucumr.pocoo.org/2014/11/2/payments-in-the-future"]
title = "The Future of Payments and Open Source Support | Armin Ronacher's Thoughts and Writings"
description = "Some thoughts about various payment systems on the internet and how viable they are for open source project support."
full_description = '''I kept my mouth shut about Bitcoin on my blog so far, but I do feel like I need to bring it up now because of how many comments and mail I got about a bug report I wrote two weeks ago for removing projects of mine from a bounty website called tip4commit. It feels like you are not allowed to say anything other than "bitcoin is amazing" on the internet without getting loads of negative comments. I found that quite interesting because I did not actually have anything against Bitcoin in this particular case. However to have a place to point future hate mail against, this is why I'm less than lukewarm about Bitcoin. The actual problem I had was not that there was Bitcoin involved in and by itself. The problem was on one hand something I did not opt into (and there not being a way to opt out of) this tipping system and that it's a completely unregulated space that can cause me troubles I could have avoided otherwise. As of why that is the case I believe I need to provide a bit of explanation because I feel like the base assumptions that people have that wrote me mail are completely different from mine and no sensible discussion can be had in that situation. So let me explain you a bit in which world I grew up. I was born and raised in Austria, spent some time in London before going back to Austria. Money in Austria (and many other European countries) works different than in the United States where most comments on the internet come from. How big those differences are cannot be expressed because it affects everything in your life. Austrians pay a lot of taxes. How much taxes we pay is very hard to grasp, even as an Austrian because unless you are running a company you often do not even see all the costs that are associated with your salary. Taxes and other things are split into roughly three categories: social security, employer costs and income taxes. Those things are actually not called that way in Austria but since this is an English blog post I will stick with it. Your employer pays you social security and other employer costs which includes medical insurance and contributions to the pension system and many other things. These payments cover all kinds of things that are related to human beings. For instance if a woman gets pregnant and stops working, those payments come of a pool of money that was allocated through these measures. Each child in Austria gets support payments from the state and so forth. There are a lot of things that are paid out of the pool of things you do not see normally. From the amount that you get in the end, you also pay taxes. Those taxes are used for highways, kindergartens, schools, universities and lots of other things.'''
