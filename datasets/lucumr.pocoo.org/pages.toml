["https://lucumr.pocoo.org/2011/12/22/implicit-scoping-in-coffeescript"]
title = "The Problem with Implicit Scoping in CoffeeScript | Armin Ronacher's Thoughts and Writings"
description = "A longer explanation of why I think that the CoffeeScript scoping is problematic and should be changed."
full_description = "I love JavaScript and more than that I do love CoffeeScript quite a bit. It's beautiful, it follows largely the Ruby and Python design patterns that make sense and on top of all that is the code it generates really, really well done. However I do have a major problem with it, and that's unfortunately part of the language design and cannot be fixed unless you fork off the project. Generally when you want to have a language that supports closures that are not only readable but also reassignable you need to express the difference in intention of creating a new variable in the current scope or overriding the one in the top level scope. In JavaScript the var keyword explicitly specifies that you want a new variable. If it's missing you reassign a variable of the same name in a higher scope: In Python (Python 3 to be exact) the logic is inversed. You need a keyword to express the intent of reassigning from an outer scope: CoffeeScript does a third thing which is “always reassign unless unknown from higher scope”. In this case it looks like this: Now if you look at the code above the CoffeeScript one is the shortest. And you could even further simplify it. However there is a huge problem with it: it makes maintenance of large code much harder than it has to be and because the problem can be entirely silent you won't notice until it's too late. I had the problem for the first time where I was introducing a helper function in the same file that was named like a local helper variable. The purpose of that line is to “import” a bunch of functions from the Math “namespace”. The end result is that in that file you can then use tan(x) instead of Math.tan(x). However adding that line now lets shaderFromSource fail. Why? Because it assigns to a variable named log which previously was local and just became global. And the function will continue to work. I was able to use the code for a while until I spotted that. I did spot it late because of two reasons. One was that the log statement only ocurred if a shader failed loading and I had no shader errors for a while, secondly even after the function finished execution the code still worked up to the point where I called into the matrix calculation function again that needed the math imports."
year_published = 2011
clearnet = "https://lucumr.pocoo.org/2011/12/22/implicit-scoping-in-coffeescript"
