["https://lucumr.pocoo.org/2013/7/23/licensing"]
title = "Licensing in a Post Copyright World | Armin Ronacher's Thoughts and Writings"
description = "Some thoughts about the absolute madness that is currently going on with licensing in the Open Source community and how github's license chooser is making it worse."
full_description = "The GPL used to be the cornerstone of the Open Source movement. At least it always felt that way. Clearly if you looked closer the situation has always been a situation of many licenses and the GNU GPL was only a small part of it. In recent years however it has become painfully obvious that a lot of developers have built up an open hatred for the licenses on different levels. What I found surprising however is how little the license is being discussed nowadays. If you Google for discussions on the GPLv3 the most you are generally greeted with links to articles from 2006 and earlier when the debate about the latest revision of the GNU GPL was at its height. However none of the concerns of the discussions back then were ever addressed and you can see today that this has left a big impact on how the GPL is seen today. The whole topic got a lot of relevance for me again recently due to GitHub. GitHub is one of the pillars of Open Source development these days and yet it's also a place where there is more improperly than properly licensed software. Their attempt to change that has been a simple license selector and I believe that is a terrible idea, especially because it brings up the whole GPL topic again. This article is opening up a bit of the history of Open Source software licensing, how it seems to change and what we could do to improve it. Until the GNU GPLv3 released, the number one Copyleft license was the GNU GPLv2 [1]. Copyleft and GNU GPL were seen as the same thing. GPL is a very restrictive license in the sense that it whitelists rights instead of just putting a handful of requirements into a license that otherwise permits everything. This made the whole topic of GPL compatibility was always something that people discussed. GPL compatibility is generally just the idea that a license can downgrade to the GPL. Most licenses were able to do that, but some licenses had some pieces of text that made this impossible. Most famously the Apache License 2.0 was seen as GPL incompatible due to extra restrictions on patents and some versions of the Mozilla Public License."
year_published = 2013
year_updated = 2013
clearnet = "https://lucumr.pocoo.org/2013/7/23/licensing"
