["https://lucumr.pocoo.org/2010/11/26/computing-in-perspective"]
title = "Computing in Perspective | Armin Ronacher's Thoughts and Writings"
description = "Visualizing numbers and thinking about dimensions in computing."
full_description = "One of my professors at my university likes to “visualize” numbers by comparing them to things people know. That way you get a much better estimation, even without having an actual picture in your hand. I find this an especially interesting thought when it comes to comparing things of computing with things you have a rough idea of. A while ago I saw a recording of an interview with Grace Hopper where she compared a nanosecond with a 30 centimeter strip of copper wire. That would be the distance light can travel in one nanosecond. But keep in mind that this was in 1990 when computers were a lot slower and generally less interesting compared to the machines we are running nowadays where the computing power of a small business from the early 90'ies is now embedded into your mobile phone. A computer from 30 years ago was already way faster than one could think, but it was definitively simpler. Now we often think of computers as being these magical black boxes that just (sometimes) work. It's very hard to still imagine the speed of these things. One of the top notch CPUs money can buy for the consumer market is at the time of writing the Intel i7-940XM processor. It's smallest feature is 45 nanometers in size and has four processing cores equipped. Each of these cores is ticking at the frequency of 2.13 GHz. It's sitting on an LGA 1366 socket which connects it with the mainboard. The socket carries that name because of the 1,366 pins that act as connection between CPU and mainboard. That number is unrelated but amazing by itself when you think abuot how small these things have to be as the size of the CPU is only 4.4 × 4.3 cm. To get that particular part of the computer into perspective, we have to compare it with the physical limits of data transmission. The speed of light in vacuum is 299,792,458 meters per second. Inside a copper wire however signals only travel at around 3/4 of that, but let's just go with Grace Hopper's example and assume we're operating at the speed of light. If a processor is ticking at 2.13 GHz it means that a single tick takes around 0.39 nanoseconds. In that time a signal can travel about 12 centimeters."
year_published = 2010
clearnet = "https://lucumr.pocoo.org/2010/11/26/computing-in-perspective"
