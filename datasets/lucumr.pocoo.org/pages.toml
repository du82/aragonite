["https://lucumr.pocoo.org/2008/7/17/deploying-python-web-applications"]
title = "Deploying Python Web Applications | Armin Ronacher's Thoughts and Writings"
description = "Short tutorial on how to use fabric to deploy Python web applications."
full_description = '''Every once in a while I'm really impressed by a library I stumble upon. A while back that was virtualenv, now i stumbled upon fabric. I was using capistrano for a project I was working on which was kinda okay but somehow I wasn't sold to it. Yesterday however apollo13 stumbled upon fabric which is capistrano just in Python, with a working put command and less annoying in general. In combination with a custom virtualenv bootstrapping script Python web application deployment is a charm. One “fab bootstrap” later the servers are creating a virtual python environment, compiling all dependencies, checking out all eggs and initializing the application environment. Updates are just one “fab production deploy” away. And the best part is that fabric is not limited to Python. You can use it to deploy anything you can control over ssh. Saved as fabfile.py “fab bootstrap” then asks for some servers and bootstraps the application there, after changes in the repository you can “fab deploy” the latest version. Of course that's just a very basic made up example, but it shows how you can use fabric. I'm using makefiles currently to execute common tasks for various Python projects (like releasing code, resting unittests and much more), I suppose fabric could also do that for me. And that would have the advantage that it works for windows users too. Color scheme: auto, light, dark. document.querySelector('.theme-selector').removeAttribute('hidden'); document.querySelectorAll('input[name="theme"]').forEach(input => { input.checked = input.value === $THEME; input.addEventListener('change', () => { selectTheme(input.value); }); });'''
