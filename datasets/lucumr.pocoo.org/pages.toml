["https://lucumr.pocoo.org/2020/5/24/my-standard-desktop"]
title = "My Standard Desktop | Armin Ronacher's Thoughts and Writings"
description = "How my work from home situation looks like at the moment."
full_description = '''Like many others I'm spending a lot more time working from home now. This in no way is a new situation for me, but I figured I might as well write a bit about how I work from home given the increased interest. Mostly because after seeing so many complex dev setups recently I wanted to share something that's largely bland. Most of what I have here is from IKEA, like pretty much everything we own in this flat. This is for a handful of reasons. The first one is — and that's quite consistent with my general approach to most things — that it's standardized, mass produced and if something breaks you can get it repaired easily. The most important items are the IDÅSEN standing desk and the MARKUS swivel chair. Since it's a standing desk that is moving up and down close to the wall I attached a SKÅDIS pegboard behind it. It use it partially for cable management, partially to make sure stuff does not roll down and can lean against. There is also a GALANT drawer unit for storing some things. The monitor is on top of a SIGFINN monitor stand which I painted black. Below I store my Filco Tenkeyless mechanical keyboard. I have both it and a normal Apple Magic Keyboard connected to it. Like all other things I use a US keyboard layout there. I have a desktop PC too but I basically never use it. Since I carry my Macbook Pro around most of the time I just hook it up at home with a monitor. I'm trying to ensure that I can unplug it and continue working with very little interruption. This turns out to be a shockingly complex endeavour still. It turns out when it comes to USB-C hubs you either have "gives stable power" or "has lots of ports". So I ended up with a pretty straightforward Anker USB-C hub I use for power, and into it I plugged some Chinese off-brand multiport which I use for network, audio out, HDMI and various other things. I intentionally do not link to the adapters I'm using because I'm in no way confident that others will have the same good experience with the same hubs.'''
