["https://lucumr.pocoo.org/2024/2/26/austria-needs-a-vision"]
title = "Austria: A Fearful Country In Need Of A Vision | Armin Ronacher's Thoughts and Writings"
description = "Some very personal thoughts about the future of Austria."
full_description = "This will be a slightly different post. It has to do with the country I am living in with my family: Austria. More importantly it has to do with some some observations and of mine about how this country functions. There is a rather famous quote about Vienna: “If the world once ends, I'll move to Vienna, because that's where everything happens fifty years later”. It has been attributed to Gustav Mahler who lived at the tail end of the 19th century. It might also have been said by anyone else or about a different city. Yet as a description of Vienna is highly accurate — even today — and it in many ways describes the culture here. While Austrians might argue that Vienna really does not represent the country, the fundamentals of that mentality are inherent to Austria's culture. Austria is a very conservative country that chooses to disregard progress for as long as it can get away with. It's not always stuck in the past. There are definitely exceptions to the rule but in many ways this conservatism is the backdrop to every day decision making. The way I like to portray what is happening here is that there is a strong desire for “stability” and fear of the unknown. Austrians prefer to miss out on a fad over adopting something too early. While a country is defined by its borders, the culture is defined by it's population. So we need to define what an “Austrian” is. That turns out to be rather complex and this complexity matters a lot. Austria is a country of 9.1 Million people. Let's take a news article from a few days ago: “4,9 Million Austrians travelled for vacation in 2023” according to Statistics Austria. When you read a statistic like that, you can extrapolate that this refers to residents in Austria. Austria has almost 20% foreigners; in Vienna that number is 35%. Those foreigners are divided into EU citizens, refugees (and those applying and waiting to be processed) and other third country nationals. They have vastly different permissions and rights. It's comparatively easy to get a visa or work permit on paper (called “Aufenthaltstitel”) but it can involves a lot of bureaucracy to actually get one. Even as a dependent of a EU citizen it can take months to get your permit processed, particularly in Vienna despite the fact that EU law requires this to take effect immediately. The MA35 authority in Vienna responsible for permits is well known for lack of service quality."
year_published = 2024
clearnet = "https://lucumr.pocoo.org/2024/2/26/austria-needs-a-vision"
