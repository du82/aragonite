["https://lucumr.pocoo.org/2010/8/18/the-lazy-user-is-openid-s-security-issue"]
title = "The Lazy User is OpenID's Security Issue | Armin Ronacher's Thoughts and Writings"
description = "an alternative way to look at OpenID's security."
full_description = "For Lincoln Loop I am doing more with the Facebook API currently than is good for me. Now Facebook is not using OpenID but OAuth, but the core issue is the same and it becomes a little bit more obvious when you're doing OAuth based sign in. The problem is that users are lazy, and so are developers. Developers are especially lazy because when they have to sign into their development application multiple times a day for testing the authentication module you will take every measure possible to save time. And in my case it usually involves remembering the password for my OpenID for the session. But even without remembering the actual password of my OpenID account, it still means that my OpenID provider remembers the authentication request for my application and will skip the screen the next time the application requested authentication until the browser closes. For as long as I have to do with websites and authentication systems the following three rules were widely followed by application developers: Notice one thing? All these steps require you to enter a password. Now with OpenID / OAuth we don't have a password we could enter on that website, what we could do instead is redirecting to the OpenID provider / OAuth service to let the user confirm the action. Unfortunately these services will remember you. If you are a careful user you will not let the service there remember your password for general authentication, but it will remember you when you come back in the same browser session. So say you are logging in on your computer and not close the browser. Leave the notebook unattended for a few seconds and someone else comes to the PC to delete your account for example (or do something else of destructive nature). Even if the application does a OpenID auth check to delete the account (which no website I tested does) the OpenID provider will have remembered you (at least the ones I tried all do). Bam, you lost your account. Deleting here is not really the problem, just think about the OpenID equivalent of password change: linking another OpenID account to your profile. Most websites support more than one OpenID identity. To add another OpenID identity URL to a website you most of the time don't even have to confirm from an old one. It will just happily accept a second OpenID identity URL. And again, even if it would check for the old one, your provider would still have you remembered."
year_published = 2010
clearnet = "https://lucumr.pocoo.org/2010/8/18/the-lazy-user-is-openid-s-security-issue"
