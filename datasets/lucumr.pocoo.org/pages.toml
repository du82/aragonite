["https://lucumr.pocoo.org/2021/11/14/abusing-serde"]
title = "Rust Adventures: Abusing Serde | Armin Ronacher's Thoughts and Writings"
description = "Some things you can do with serde that were not in the mind of the creator."
full_description = '''When programmers point to things they like about Rust they are relatively quickly pointing out serde as an example of something that is a pleasure to work with. Serde is a Serialization and Deserialization framework for Rust. It's relatively format independent and lets you work with JSON, YAML and a range of different formats. Despite all of this, there is a lot that can be accomplished with it and some of the use cases I think are quite interesting and worth sharing. One of the very interesting use cases for serde is to use it as some form of reflection framework to expose structs to other “environments” that cannot natively support rust structs. These are situations where as a developer you serialize a serializable object just to immediately deserialize it again in a slightly different format. Instead of deserializing one can also get away with just a custom serializer that "captures" the serialization calls. For instance this is the pattern one typically uses for IPC, template engine context or format conversion. What does this look like in practice? Let's have a look at my MiniJinja template engine from a user's perspective. MiniJinja uses serde as a core data model to pass structured data to the templates so they can evaluate at runtime. Here is what this looks like for the developer: As you can see we're defining a struct called User here that can be serialized to serde with the default Serialize implementation. This object is then passed to the template via context!(user). What this does is creating a map with a single key called user and set to the value of that variable. The goal here is to allow the template engine to access “attributes” of this user like name. Now Rust is not dynamic by nature which means that normally doing something like this at runtime is not possible. We can however do this because serde will implement the Serialize trait like this (in pseudocode): Under normal circumstances the serializer would be something like a JSON serializer that writes the struct into a string or file, encoding it into JSON in the process. However the serde interface does not require this to happen. In fact MiniJinja directly encodes the struct into an in-memory structure which the template engine then knows how to deal with.'''
year_published = 2021
clearnet = "https://lucumr.pocoo.org/2021/11/14/abusing-serde"
