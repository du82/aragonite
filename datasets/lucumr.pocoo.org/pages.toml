["https://lucumr.pocoo.org/2011/7/27/the-pluggable-pipedream"]
title = "WSGI and the Pluggable Pipe Dream | Armin Ronacher's Thoughts and Writings"
description = "Why WSGI is not as big of a problem as you would believe and why framework independent pluggable applications don't work in practice."
full_description = "As a Python web developer you are at one point confronted with the term “WSGI” (which after 6 years of existence still does not have an official truncation. Some rhyme it with “Whisky”, others just pronounce the abbreviation, other's just call it by the pep number 333). WSGI when it was created was a pretty awesome thing. It made it possible to use any Python web application with any webserver by specifying a gateway layer. In fact, it became so popular and well supported in the Python world that similar protocols were created for other languages as well. One of the first was Rack for Ruby, then came Jack/JSGI for JavaScript, PSGI/Plack for Perl and many others. And yet ever since WSGI became from a niche protocol nobody knew to the protocol for web applications people tried to change and replace it. Why is that and why does nobody succeed in replacing it? WSGI stands for “Webserver Gateway Interface” and it really envisioned as this bridge between server and application. Additionally the PEP explained how you can use middlewares and this was the beginning of the end. The PEP also suggested that people would write their frameworks around WSGI which certainly many did. People tried to cram over the years more and more services into the WSGI layer with varying success. Session middlewares, authentication systems, caching layers etc. The vision of many people is or was to use the WSGI layer as a way to combine multiple applications together. WebOb for instance went very far with that. For as long as all your applications are only using WebOb and nothing else you can “attach” a request object to a WSGI environment at any point in the WSGI chain and you are operating on basically the same request object with the same data behind. This however goes well beyond what WSGI specifies or encourages. If you mix a WebOb application with Django, Werkzeug or anything your options of what is possible are greatly reduced. Consider this post a personal brain dump. It might be unstructured and appear raw and there is a reason for this: it's one of the topic where the more you think about it, the more details jump into your mind. WSGI is such a simple specification but there is so much around it that it can really make your head hurt."
