["https://lucumr.pocoo.org/2023/10/14/eurorust-whats-a-conference"]
title = "EuroRust 2023 Reflections: What's a Conference For? | Armin Ronacher's Thoughts and Writings"
description = "A recap of EuroRust 2023 and thoughts on Rust"
full_description = "I very rarely write recaps of conferences but this time around I could not resist. This is for a lot of reasons. To kick things off, quite a bit of what was on my mind relates quite directly to a perception of a general negativity in the Rust community that I share. Most specifically this quote by Adam Chalmer: Not only did this get me thinking, I also had a lot of reflection to do about myself and Rust this year. In case you are not familar, I posted a regretful tweet in response to the keynote fiasco. Those reflections let me come to the conclusion for myself that the following three things would be good for us as a Rust community: I have several critiques of Python, but I must admit that the Python community has excelled in certain areas over the years, and one of those is their conferences. How good Python conferences are is often only apparent once you go to other events that don't quite meet the same standards. One aspect where Python shines, and which I believe is somewhat lacking in the Rust conference landscape, is the clarity and purpose. When you attend a PyCon, you can anticipate a particular style of conference, and if you happen to attend the PyCon, you're guaranteed a well-defined and cohesive conference experience. You know what the PyCon conference is and what you get to expect. Rust has a few conferences these days but it's not clear who the target audience of that conference is. Here is my current interpretation of what the conferences are for: I confess that I'm uncertain if my interpretation is entirely accurate. From both the perspective of a potential speaker and an attendee, the lack of clarity about the purpose of these conferences leaves me hesitant. This also comes up when pitching or preparing a talk. At EuroRust this lack of clarity was at least in parts apparent by the somewhat random collection of talk topics. In my personal opinion, I believe Rust should consider two distinct styles of conferences: one that deliberately fosters connections between language developers and the core community, and another aimed at language users. These two conference styles would quite likely feature different types of content and cater to different audiences."
year_published = 2023
