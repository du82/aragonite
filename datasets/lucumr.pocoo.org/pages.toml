["http://lucumr.pocoo.org/2009/3/1/the-1000-speedup-or-the-stdlib-sucks"]
title = "The 1000% Speedup, or, the stdlib sucks | Armin Ronacher's Thoughts and Writings"
description = "How a small change on an import resulted in an 1000% speedup."
full_description = '''I hate the stdlib. There! I said it. Why do I hate it? Cookie, cgi, urllib, n'uff said. Today I can add another module to the “I hate you” list. I noticed that Werkzeug's SharedDataMiddleware was just delivering 50 requests a second. I tried around a bit but nothing changed. Until I removed the call to mimetypes.guess_type. Suddenly I got 500 requests the second instead of the previous 50. WTF? And then it hit me. init() was loading the mimetype database and monkey patching the module so that guess_type() was replaced by a new function. Actually a method of the mimetype database. So on every call the database was reloaded. GNAAAaa. So check out If you're doing the same mistake. If yes, change it to the following import: Color scheme: auto, light, dark. document.querySelector('.theme-selector').removeAttribute('hidden'); document.querySelectorAll('input[name="theme"]').forEach(input => { input.checked = input.value === $THEME; input.addEventListener('change', () => { selectTheme(input.value); }); });'''
