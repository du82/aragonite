["http://lucumr.pocoo.org/2012/6/22/hate-hate-hate-everywhere"]
title = "Python Packaging: Hate, hate, hate everywhere | Armin Ronacher's Thoughts and Writings"
description = "A sad example of how easy it is to dismiss certain design principles because it does not seem relevant at the time."
full_description = "I admit that I was a huge fan of the Python setuptools library for a long time. There was a lot in there which just resonated with how I thought that software development should work. I still think that the design of setuptools is amazing. Nobody would argue that setuptools was flawless and it certainly failed in many regards. The biggest problem probably was that it was build on Python's idiotic import system but there is only so little you can do about that. In general setuptools took the realistic approach to problem-solving: do the best you can do by writing a piece of software scratches the itch without involving a committee or require language changes. That also somewhat explains the second often cited problem of setuptools: that it's a monkeypatch on distutils. Update: I rarely do updates on my articles but I want to make one thing very clear: the point of this is not to complain about any of the established tools for package management in Python. For a long I did not care about binary distributions because I never had the use case, so I did not even notice that pip did not provide them. Then suddenly the use case came up and I realized that pip removed functionality from plain setuptools and it's very hard (impossible for myself) to bring it back. It's more of an observation how easy it is to miss use cases when replacing tools with something else. For the few Python guys that don't know what setuptools is or why it exists, let me provide you with a very basic recap of what it originally wanted to do. Back in the days someone (and I really don't know who) added a system called “distutils” to Python. The purpose of that library was to provide functionality to distribute Python libraries. And for its existence we should all be really glad because besides all it's faults it is still providing us with some of the most important bits of Python package distribution. In a nutshell: distutils can make tarballs of Python code, provides you with some simple helpers that help you make an installation script and also knows how to invoke compilers."
year_published = 2012
clearnet = "http://lucumr.pocoo.org/2012/6/22/hate-hate-hate-everywhere"
