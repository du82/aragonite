["https://lucumr.pocoo.org/2008/3/17/theres-music-and-then-there-is-progressive"]
title = "There’s Music, And then there is Progressive | Armin Ronacher's Thoughts and Writings"
description = "About my love to progressive metal and rock."
full_description = '''Many of you probably already know that I'm one of those metalheads. But mainly because the number of concept albums is a lot higher compared to other genres and that most of the songs are very technical and tell a story. There is one metal subgenre I like most: progressive metal. There are tons of bands in said genre and some of them go into the direction of progressive rock (or the other way round of course). I would compare progressive metal more with Jazz and classical music than with thrash metal or death metal (both subgenres I like!) which are what people think of when hearing about metal. But I think progressive metal is one of the not that extreme genres you usually don't hear on the radio. The reason for this is probably that the average length of the song is far beyond the usual four minutes and because the songs don't make that much sense if you don't listen to them in the context of the rest of the album. Whenever I play selected songs to my pals that don't listen to progressive normally the reaction is: "hmm. sounds not that bad, but I wouldn't listen to that myself.". And yes, progressive metal is not that kind of music you would listen to in the background only. It's that kind of music you listen to like you read a book. If you are a metal fan and you don't know one of the albums below: visit the pirate bay, download one of them and listen to them (And if you like them, buy the CD/send the musicians money, whatever). The following list is my all time favorite collection of progressive metal albums. Pain of Salvation — One Hour by the Concrete Lake tells the story of a stranger that works in the weapon industry who begins to have doubts about the morality of his profession. He realizes that he's just a part of a big "machine". The album then follows him on his voyage around the work that finally ends at Lake Karachay, the concrete lake, a lake in the former USSR where so much nuclear waste was dumped over the past fifty years that if one stood by the shore for one hour the radiation would be lethal.'''
year_published = 2008
