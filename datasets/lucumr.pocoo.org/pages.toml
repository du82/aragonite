["https://lucumr.pocoo.org/2013/7/1/say-yes-to-javascript"]
title = "Say “Yes” to JavaScript | Armin Ronacher's Thoughts and Writings"
description = "Some random notes about why I think that removing the option to disable JavaScript in Firefox is one of the best things."
full_description = "A few days ago Mozilla finally removed some options from their control panel. The one I am most happy about is the removal of the “Disable JavaScript” checkbox. This goes hand in hand with an earlier blog post by Alex Limi about Checkboxes that kill your product. If you have not read that link, do it now. My immediate response to change of removing the switch was: “Thank god, that should have happened ages ago”. When I was happily tweeting this I got some responses about how I can support such a step in the browser that removes features and restricts a user's freedom. Instead of replying to each and every tweet I figured I might just write down my thoughts on that topic. I believe there are two reasons why some people want to disable JavaScript: the feeling of extra privacy and improving page speeds. There are two main problems with that: none of those things are solved by disabling JavaScript categorically. The better solution to that are add-ons maintained by people that block out the right JavaScript and let everything else through. The reason for that is that a user cannot reliably decide on if the JavaScript is necessary or not. There is this general understanding among some more technically skilled people that a website should always work without JavaScript. This might have been true a few years ago, but nowadays that is impossible to do. Some applications now are written as frontends to APIs and the application does not provide any rendering on the server side besides a nice error message that the website requires JavaScript. Worse than that though, some websites just assume that JavaScript is actually activated. In some cases they might have one landing page that does a nice fallback to give you an error message if JavaScript is missing, but when it deep links you to a page that goes away. It's a great day for a web developer when we can finally assume that a browser will have JavaScript running. Many modern web applications can be much more performant because they take advantage of JavaScript. User interfaces that depend on JavaScript have much better abilities to make it enjoyable for a user."
year_published = 2013
