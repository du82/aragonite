["https://lucumr.pocoo.org/2008/4/3/use-os-x-you-git"]
title = "Use OS X you Git! | Armin Ronacher's Thoughts and Writings"
description = "Why a popular choice for an operating system does not necessarily mean you will become more productive and a better programmer."
full_description = '''So rails is ditching trac and subversion in favour of git and lighthouse. Additionally they won't host git themselves but rely on github. Keeping in mind that the preferred development environment called OS X + TextMate, rails is now kneedeep in closed source land. Something I could care less about as I'm thankfully not using rails or any rails powered application. But what hit me was the discussion attached to that blog post. Apparently there are quite a few pissed of Windows users left. Gosh, they still exist! David "Fuck You" Hansson could really care less as he stated in the past "that he would have a hard time hiring a programmer who was still on Windows". Skimming through the blog you can see enough mac users telling the windows crowd to switch and I think you can nowhere find as many mac users as in the rails community. He really did a great job converting proprietary windows developers into even more proprietary Mac users. There are some really great quotes in that blog: Windows users, please stop complaining about others using the right tool for their jobs and just start doing the same. You can get rid of this shit and use something serious. Really. Others are doing it and nobody ever looks back. So you can do it, too. Yeah stupid folks. Why in god's name are you still using windows, that proprietary crap from redmond. DDH your Führer already told you to use OS X, do so and don't ask questions. Interestingly though is that Linus himself is not that happy of OS X (the link goes to another post, I was refering to the reply, but that one is good too) as their filesystem handling is beyond broken, at least for git's requirements. So I'm asking. What exactly makes OS X better than Windows? Nicer hardware? I would count that as a major disadvantage of OS X as you're bound to vendor. The Apple support here is very weak (where weakhere is Austria) as far as I've noticed. Sending a notebook in for two weeks for a single broken key on the keyboard is ridiculous. Additionally you're paying a lot of money for it. I know that the design is the selling point of Apple computers but that doesn't mean all PCs are looking bad. A Thinkpad or one of the more expensive Sony Notebook next to an Macbook Pro and it's pretty hard to decide what looks better. Especially in terms of quality. My Macbook Pro is a bit more than half a year old and on the silver plastic you can spot where the palms of my hands are as the color is chipping off there. But even if the hardware was the selling point you could use other operating systems on it.'''
