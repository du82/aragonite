["https://lucumr.pocoo.org/2023/11/1/remote-before-and-after-covid"]
title = "Post Covid Remote Work Doesn't Work As Well | Armin Ronacher's Thoughts and Writings"
description = "What I learned about remote work after Covid and why it's so hard."
full_description = "This year I decided that I want to share my most important learnings about engineering, teams and quite frankly personal mental health. My hope is that those who want to learn from me find it useful. You can't make it 15 minutes on Twitter or elsewhere, without running into a post about a botched return to work implementation. You also can't make it for very long to hear about the San Francisco doom loop. These two topics relate in a quite deep way to me personally. This post is a reflection of working at Sentry for almost 10 years, a company primarily headquartered in San Francisco and how it is to work for it from a distance before and after Covid. I'm a being that thrives in cities. In fact, I'm genuinely amazed every day how humans have managed to form societies where cities can function. But not only function, but function really well. They are quite remarkable because they greatly benefit of economies of scale. You can provide services in cities that would otherwise not be possible economically, because there are not enough people around that otherwise are in need of that service. As a friend of mine once described: cities are like small social experiments. Each city uniquely nurtures specific communities, each with their own values and ideas. Since forever I have been a software developer (amateur or otherwise), there was really only one city heralded as the city of technology: San Francisco. It has a profound impact on many of us, even if we don't live there. It's not the city I want to live in, in many ways it's running the kind of social experiment with outcomes I'm not attracted to, but without doubt that experiment has an impact far beyond its borders. I'm in many ways a beneficiary of its existence. Where cities shine is collaboration and meeting like-minded folks. Where I grew up, I was the only programmer in a tiny town. If you want to talk with others about your problems, the internet really was the only place. I took advantage of the opportunities that IRC, bulletin boards and mailing lists gave me. It allowed me to meet people that were otherwise outside of my reach."
year_published = 2023
