["https://lucumr.pocoo.org/2011/12/7/thoughts-on-python3"]
title = "Thoughts on Python 3 | Armin Ronacher's Thoughts and Writings"
description = "My current thoughts on the state of Python 3 and where it's heading."
full_description = "I spent the last couple of days thinking about Python 3's current state a lot. While it might not appear to be the case, I do love Python as a language and especially the direction it's heading in. Python has been not only part of my life for the last couple of five years, it has been the largest part by far. Let there be a warning upfront: this is a very personal post. I counted a hundred instances of a certain capital letter in this text. That's because I am very grateful for all the opportunities I got over the last few years to travel the world, to talk to people and to share the spirit that an open source project like Python can drive innovation and make people happy. The whole Python community is amazing and I do not express that nearly as often enough. Quite the contrary actually. I love Python, I love discussing ways and implementations but I am not committing the project despite my commit bit. I am a pain in the ass at language summits, if I am attending them, and can see why my opinion would be unpopular. “Always complaining, not doing anything”. There is just so much stuff I would love to see Python do but at the end of the day, I'm a user of Python more than a developer. When you read my comments about Python 3 since it was released as the first version, you get the impression that I hate it and don't want to move to it. I do, but not in the state it's currently in. Since I learned my lesson that people link to articles long after the fact, let me first explain the situation in which Python 3 is as of writing: the release version of 3.2, the next version is 3.3 and there is no plan on ever having a Python 2.8. In fact there is even a PEP that specifies that a release will never happen. PyPy is making amazing progress but at the same time it continues to be a project that is so far from the architecture of other stuff that it will probably fight with acceptance problems for a longer time. In many ways PyPy is currently doing stuff that “you don't do”. And I think it's amazing."
year_published = 2011
