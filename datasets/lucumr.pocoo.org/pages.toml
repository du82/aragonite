["https://lucumr.pocoo.org/2013/1/20/that-was-my-2012"]
title = "What was my 2012 | Armin Ronacher's Thoughts and Writings"
description = "Recollection of what happened to me in 2012 and what might happen in 2013."
full_description = "I was close to writing my 2012 recollection post in December but the year really did not end until the last minutes of the 31st. It has undoubtedly been the most exciting year for myself. In November of 2011 Steve Gaffney from Splash Damage sent me a mail out of the blue if I was interested in a Skype call about their new venture. A month and a half later I was working for the Splash Damage offspring Fireteam. The first two months from home, then I relocated to London. I can't stress how much fun that last year with Fireteam has been. It all turned out massively differently than expected but that was half the fun. While we're technically a separate company but we work very closely together with both Splash Damage and WarChest and share the same office space. Without doubt I have learned more in the last year than in the last four combined because of that. Splash Damage / Fireteam / WarChest is a great environment for that in general because there is such a diverse bunch of people. I think we have people from more than 20 countries (I definitely counted 18) and due to the nature of the company there are different professions working together which gives you a ton of insight into new areas. We're certainly not flawless but so far I am tremendously enjoying the environment. Splash Damage's first iOS game RAD Soldiers launched properly in December and also promptly got an Apple feature. That definitely kept us all busy during Christmas time since it's using our stuff for the network infrastructure. Last year I was fortunate to give seven talks in seven different countries next to my work. This also for the first time included a talk outside of my comfort zone at GDC Online which I gave as a stand-in for our CEO Steve Gaffney. I hope to be able to continue doing that next year but I will definitely not increase the number of conferences I'm going to attend — after all I'm doing this next to my work and not as a professional thing. The last year to a large degree was looking back at what I did before and learning from mistakes. It has not gone unnoticed that I contributed less to my Open Source project over the course of the last year than I did before. A lot of that has to do with the fact that I based all of what I did on Python and my own stuff and never really thought outside of the box. I'm still enjoying using Python and Flask tremendously but I also being more in contact with other things."
