["https://lucumr.pocoo.org/2022/7/2/non-fungible-future"]
title = "A Non Fungible Future | Armin Ronacher's Thoughts and Writings"
description = "What a powerful NFT driven future could look like."
full_description = "NFTs and blockchains have now long been mainstream. It's no longer the early days of the web as they used to say. NFTs originally started out as a novel way to pay for digital art, and in many ways that is still where they are rooted, but they have some much farther. They have three very vital properties: they are largely freely and globally trade-able, whoever owns them does in fact own them as a record on the blockchain overrides anything else, and revenue sharing can be baked right into the contract. The revenue sharing property is what allows the original creator of the NFT to receive a fraction of any future sale. Everything turned into an NFT and because everything is now trade-able, there is a market for everything. This very advanced form of capitalism has also created many novel financial products that were previously unheard of. You can in fact create an NFT of a trade on the blockchain and you can create any financial product on the blockchain you might desire. Asset backed securities can now target the lives of people, the outcomes of their life choices as well as any artwork in existence. NFTs came out of the art world and they have definitely revolutionized it. Aspiring artists, enrolling into arts programs, no longer have to deal with student loans or similar. Where previous generations had expensive loans, modern students and pupils have blockchain traded lifestyle smart lending contracts. These are different than loans on the blockchain but they are intrinsically linked to future earnings of that person. Since every person has a digital identity on the blockchain that is linked to their wallets and NFTs (obviously cryptographically secure and anonymous through proof-of-birth). With these digital identities, students can enroll into for instance a 12 months arts bootcamp. This arts school then can offer to pay their students living expenses for 12 months and their education is completely free. This is enabled because this arrangement is backed by a smart contract on the blockchain. Artists who enter a prestigious bootcamp will give 2% of all future proceeds of future NFT based artwork with the bootcamp. All powered by the blockchain."
year_published = 2022
clearnet = "https://lucumr.pocoo.org/2022/7/2/non-fungible-future"
