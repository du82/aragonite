["https://lucumr.pocoo.org/2010/6/19/licenses-dammed-licenses"]
title = "Licenses dammed Licenses | Armin Ronacher's Thoughts and Writings"
description = "Adventures in License land. We need more lawyers in the open source world."
full_description = "Just wanted to share a few mistakes I made regarding licensing of Flask and some general suggestions of how to handle it. Also I would like to explain a problem I have with open source licenses in general and if you have some suggestions. Disclaimer: IANAL and what I write down there might be completely wrong. If you know better, please let me know. (And I mean it. Granted, I hate licensing, but I also depend on them so I want to have a good understanding of what the heck I'm actually doing by licensing my stuff) I love Open Source, I really do. All my code is licenses under the very generous BSD license which comes with barely any strings attached: do what you want, keep the copyright around, do not use my name to endorse derived products. And I am totally fine with that. But that is my take on code alone. When it comes to artwork and design I would love to use a less open license. Why? Let's take the Flask documentation as an example. This documentation has a nice and simple stylesheet and is still unique enough that one could recognize Flask or Flask related projects from it. So I would love (but can't) limit that license to something like: use this only for Flask related projects or modify it enough to be visually different. Now of course that is a fishy description, but this could be fixed. The problem however is that this is no longer an open source license (which I would not have any problems with). After all that also forces Linux distributions like Debian to ship a modified version of my project with a different style for the documentation because they have to reject such packages or put it into the non-free section. Both things I would love to avoid, so I back-paddled on my licensing plans and put the themes under the BSD license with friendly reminder now. But when I was changing the license an interesting thing came up: could it be that the old theme was partially unlicensed? Now one stylesheet was already BSD licensed, that was not a problem, the template files and everything else did not have a license header nor was a LICENSE file in place. The way Flask used that style was with a git submodule. Interestingly this was not present in the source distribution of Flask. So unless Debian made any changes, the docs would not build out of the box on a Debian system anyway which brought back my idea for going the non-free path with docs. But that is now past in any case, so let's move on. But the more interesting question here is what license that thing is under now. I am pretty sure one could argue that the original documentation was not licensed, thus closed source and all Flask extensions I did not write were violating the license (which was never the intention because the documentation strongly recommends the Flask documentation themes)."
year_published = 2010
year_updated = 2010
