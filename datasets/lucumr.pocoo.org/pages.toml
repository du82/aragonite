["https://lucumr.pocoo.org/2009/4/8/c%2B%2B-pitfalls"]
title = "C++ Pitfalls | Armin Ronacher's Thoughts and Writings"
description = "A concise list of some common C++ pitfalls."
full_description = "I just recently started using C++ for university (about two months ago) and still have a hard time accepting some of the weird syntax rules and semantics. For someone that mainly does Python development C++ feels very unnatural. In Python the syntax is clean and there are no ambiguities. C++ is drastically different in that regard. I know there are tons of resources on the net about C++ pitfalls already, but I thought I have to add my own for people switching to C++ with a background in Python and/or C. In Python you usually don't have to worry too much about that topic because the language is very dynamic, but it's somewhat of an issue in C. I'm talking about hiding implementation details behind a surface in a way that you can change the implementation in later version of a library without breaking backwards compatibility. If you have an object in C, or something that looks/works like an object, you usually have some kind of typedef to a struct or void*, and functions to create, delete and manipulate it. The reason why a lot of code does it that way is that the size and position of the struct members these functions access, is not stored in the calling code. So you can safely change the size of the struct for later versions of the library and code that compiled against the older version of the library continues to work. If you look at C++ classes, you will sooner or later notice that the “new” operator and size of the allocated structure where the operator is called. That means if you change the size of your class later (by adding a new private member for example) you have to recompile the code, otherwise new would not allocate enough memory and most likely crash in your constructor call. I don't really know how C++ libraries solve that problem, but I suppose they provide wrapper classes that contain the constructor call and proxy all the calls. This one is pretty obvious if you know C, but it's still something that could baffle a newcomer. If you have a class with a constructor that accepts arguments and you want to allocate it on the stack, you would usually do it like this:"
