["http://lucumr.pocoo.org/2010/4/3/april-1st-post-mortem"]
title = "April 1st Post Mortem | Armin Ronacher's Thoughts and Writings"
description = "My conclusions of an April's fools day joke I made this year that later lead to the development of the Flask micro framework."
full_description = '''This year I decided to finally do what I planned for quite some time: an April's fool joke. (I did contribute a bit to PEP 3117, but that does not count). This year I decided to make a little joke about Python microframeworks (micro-web-frameworks?) and wrote a little thing, and created a website and screencast for it: denied.immersedcode.org. I did expect some responses to that, but I was a little bit surprised by some of them though. So here my full disclosure of the april's fool prank, what people thought of it and what my conclusion is. It seems like everybody likes microframeworks. Not sure what caused that, but there are plenty of them. web.py (Python) and camping (Ruby) where the first of their kind I think. Later others followed and it seemed that people love the idea of software that does not have dependencies and comes in a single file. So I thought, I can do the same and make fun of it, so let's just create a framework based on existing technology and throw everything together in a large single file: denied was born. I just bundled a Werkzeug, simplejson and Jinja2 into a single file and added a bit of code that glues them together. Denied consists of 160 lines of code that implements a very basic WSGI application based on Werkzeug and Jinja2 that incorporates really stupid ideas into the code: I don't want to go into details why I hate everything there, that would be a blog post of its own, but I want to point out that nearly all of these "features" were inspired by existing microframeworks. I did not expect anyone to detect from these things that the framework was an April's fool joke, but I thought that the obfuscated sourcecode and the fact that it was basically just a zipfile would be obvious. However I got more than one mail asking me to release the sourcecode of it because people want to hack on it. Right now it has more than 50 followers and 6 forks on github which is insane if you keep in mind that Jinja2 and Werkzeug have less than 30 on bitbucket.'''
year_published = 2010
