["https://lucumr.pocoo.org/2014/2/13/programming-communities"]
title = "On Programming Communities | Armin Ronacher's Thoughts and Writings"
description = "Some personal thoughts on the Python community and programming communities in general."
full_description = "This post was a long time coming but Ian Bicking's recent post about Saying Goodbye to Python made me finally sit down and write it. This is personal and probably not all that interesting, but it's important for me to have it written down somewhere. It's very easy to forget about all the people that put you to the place you are today and often they don't even know it. In a few days Python will be with me for ten years now. I don't exactly remember which day I downloaded a Python interpreter for the first time, but thanks to living parts of my life on the internet, there is a good track record from a certain point onwards. I owe a lot to online communities and people I met on the internet. When I was about thirteen or so I bought two books on programming. A book on Delphi and a book on Python. The latter was a book by Gregor Lingl called “Python für Kids” which was a programming booked aimed towards young people. Without his book I my life would have been very different and I would have ended up as a Delphi programmer for a lot longer. Through that book I found the German Python forum and through that forum I first learned that people are actually using Linux for real things. The former administrator of that forum recommended me to have a look at the new Ubuntu Linux distribution if I want to have something to play around with, because it embraces Gnome. That administrator was Fritz Cizmarov aka Dookie who sadly passed away in 2005. While I did not touch Python much initially through the programming book and the recommendation of Fritz I became a Ubuntu user. That was a few months after the initial Ubuntu version shipped. I found the German ubuntuusers website which just appeared at that time. Since I have done a bit of PHP at that point, I volunteered to help out with the phpBB installation there to make it look a bit nicer and to add a news section to the website. Sascha Morr trusted me enough to give me access to the heart of the website and from 2004 to somewhere around 2007 or so I spent ungodly amounts of time trying to improve it."
year_published = 2014
