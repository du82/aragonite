["https://lucumr.pocoo.org/2013/5/25/my-slides-workflow"]
title = "My Slides Workflow | Armin Ronacher's Thoughts and Writings"
description = "A quick overview of how I do my slide decks for my presentations for others to learn from."
full_description = "I was asked multiple times in the past in regards to how I do my slide design, how my workflow looks like and what applications and tools I use to get them done. I'm very glad to hear that people seem to like my slides and I'm more than happy to share how I do that stuff. I think the most disappointing answer is probably: trial and error, a lot of time and practice. There is no silver bullet in this blog post that which will instantly create a nice slide. The reason for this is that I generally do things by hand and stay away from templates. I think my workflow of doing slides is a bit strange but it seems to work for me. At first I think about what the presentation is going to be about and roughly how to structure it. I usually write that stuff down in a text file or moleskine and do some revisions on it. After that I think what kind of visual identity can go with the slides and if they should be structured as bullet points or more abstract. When I have decided on something I pick colors and fonts. Once I am done with that I spend quite some time making the slides with Keynote and putting things into place. For some presentations I use Inkscape to make some vector art that goes with it. Lastly (and in fact after I have done my slides) I will roughly go through the timing of the slides. Due to how I do my presentations these timings are never accurate so I don't waste too much time on it. Times will be off when presenting anyways. Primarily because what I say to the slides might be different depending on how people in the audience seem to respond. This is the part where I waste most of the time. I have yet to find something that makes my life easier there but in many ways finding colors is try and error for me. For many presentations I just surrendered at one point and picked black/white + one or two colors. When I do presentations with strong background colors however this might take me multiple hours to feel happy with the end result. I generally use Colourlovers for a basic inspiration for colors that work together. The initial color I generally pick from the topic of the presentation. For instance for my MongoDB presentation I decided on an earthy brown due to the official MongoDB art guidelines. But my color choices sometimes just don't seem to make much sense for anyone but myself. For instance for my “Happiness Through Ignorance” presentation I had two things to guide me. One was the location of where I gave the presentation (Japan), the other one was the general topic of the presentation which was discussing the idea of “ignorance is bliss”. Both of these things made me go with pink as color due to the association of pink and light blue with young children and a blossoming cherry tree which I then also used as abstract art on the slides."
