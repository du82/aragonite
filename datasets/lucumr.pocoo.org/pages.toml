["https://lucumr.pocoo.org/2007/4/19/digital-fortress-stranger-than-fiction"]
title = "Digital Fortress — Stranger Than Fiction | Armin Ronacher's Thoughts and Writings"
description = "A book review from a really terrible science fiction book by Dan Brown."
full_description = '''I don't rant that often about books. But when I read that book I nearly had to vomit. I seldom read such a piece of crap. Susan Fletcher, a brilliant, beautiful mathematician and head of the National Security Agency's cryptography departement, finds herself faced with an unbreakable code resistant to brute-force attacks by the NSA's 3 million processor supercomputer. The code is written by Japanese cryptographer Ensei Tankado, a former employee of her departement, who now uses his knowledge to work against the NSA to avoid further intrusion into people's privacy. Tankado publishes the algorithm on his website, encrypted with itself. He sells the passphrase for encrypted data on an auction platform, threatening that his accomplice, "North Dakota", will release the algorithm for free if he dies. This algorithm would be the end of the NSA and the TRANSLTR supercomputer. Unfortunately Tankado is found dead in Seville, Spain. Susan Fletcher, along with her boyfriend, David Becker, a skilled linguist, must find a solution to stop the spread of the code. Alright. Here comes the problem. But first a small information: I'm not a cryptographer and thus not completely informed about that topic. Nonetheless I did enough encryption/decryption for my IT lessons in the past that I can accuse Dan Brown for not having the slightest knowledge about cryptography, information technology, computer viruses, worms and also not Spain. So let's start with non technology related bullshit in that book. I personally was never in Seville itself but I'm darn sure that the description of Spain in that book is terrible wrong. On my last visit to Spain it was a country like Italy or any other southern European country thus quite safe, friendly and modern. "He'd forgotten: Getting an international connection from Spain was like roulette, all a matter of timing and luck. He'd have to try again in a few minutes." "A punctured lung was fatal, maybe not in more medically advanced parts of the world, but in Spain, it was fatal."'''
