["https://lucumr.pocoo.org/2014/8/24/revenge-of-the-types"]
title = "Revenge of the Types | Armin Ronacher's Thoughts and Writings"
description = "Some notes about what appears to be current trend of programming languages and my thoughts about it."
full_description = '''This is part two about "The Python I Would Like To See" and it explores a bit the type system of Python in light of recent discussions. Some of this references the earlier post about slots. Like the earlier post this is a bit of a diving into the CPython interpreter, the Python language with some food for thoughts for future language designers. As a Python programmer, types are a bit suspicious to you. They clearly exist and they interact in different ways with each other, but for the most part you really only notice their existence when you fail and an exception tells you that a type does not behave like you think it does. Python was very proud of its approach to typing. I remember reading the language FAQ many years ago and it had a section about how cool duck typing is. To be fair: in practical terms duck typing is a good solution. Because there is basically no type system that fights against you, you are unrestricted in what you can do, which allows you to implement very nice APIs. Especially the common things are super simple in Python. Almost all the APIs I designed for Python do not work in other languages. Even such simple things such as click's general interface just does not work in other languages. The largest reason for that is that you constantly fight against types. Recently there have been discussions about adding static typing to Python and I wholeheartedly believe that train long left the station and will never come back. So for the interested, here my thoughts on why I hope Python will not adapt explicit typing. A type system are the rules of how types interact with each other. There is actually a whole part of computer science that seems to be exclusively concerned with types which is pretty impressive by itself. But even if you are not particularly interested in theoretical computer science, type systems are hard to ignore. I don't want to go too much into type systems for two reasons. The first one is that I barely understand them at all myself. The second one is that they are really not all that important to understand in order to "feel" the consequences of them. For me the way types behave is important because it influences how APIs are designed. So consider this basic introduction more influenced by my obsession with nice APIs than with a correct introduction to types.'''
