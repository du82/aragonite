["https://lucumr.pocoo.org/2011/2/6/automatic-semicolon-insertion"]
title = "Dealing with JavaScript's Automatic Semicolon Insertion | Armin Ronacher's Thoughts and Writings"
description = "Why automatic semicolon insertion in JavaScript was a bad idea and why you should be using explicit semicolons, even if you cannot disable that “feature”."
full_description = "If you look at the grammar of ECMAScript (or JavaScript for that matter) you will quickly notice that it requires semicolons as marker for the end of certain statements. However if you look a little further you will find this little gem: So how are these semicolons inserted for you? By following these rules (paraphrased and simplified from ECMA-262 3rd edition, 7.9.1): When, as the program is parsed, a token (called the offending token) is encountered that is not allowed by any production of the grammar, then a semicolon is automatically inserted before the offending token if one or more of the following conditions is true: When the end of the input stream of tokens is encountered and the parser is unable to parse the input token stream as a single complete program, then a semicolon is automatically inserted at the end of the input stream. A token is a restricted token when it is allowed by some production of the grammar, but the production is a restricted production and the token would be the first token for a terminal or nonterminal immediately following the annotation “[no LineTerminator here]” within the production. If furthermore the restricted token is separated from the previous token by at least one LineTerminator, then a semicolon is automatically inserted before the restricted token. There is an additional overriding condition on the above rules: a semicolon is never inserted automatically if the semicolon would then be parsed as an empty statement or that semicolon would become one of the two semicolons in the header of a for statement. The specification also lists a few examples of how semicolons are inserted into code where semicolons are missing (7.9.2): Except for the return example this seems straight forward and if you are avoiding linebreaks after the return statement you should be fine. The last example stays a function call because the assignment by itself is a valid sentence. If however one would add a plus after c, the expression in parentheses would not be the argument for a function call [1]."
