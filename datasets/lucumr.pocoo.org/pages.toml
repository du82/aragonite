["https://lucumr.pocoo.org/2022/11/14/scaling-mastodon"]
title = "Scaling Mastodon is Impossible | Armin Ronacher's Thoughts and Writings"
description = "Now that Twitter is dying, what can replace it?"
full_description = "In light of recent events at Twitter a lot of the people that I follow (or used to follow) on that platform have started evaluating (or moved) to Mastodon. And I also have a Mastodon account now. But after a few days with this thing I have a lot of thoughts on this that are too long for a Tweet or Toot. Since some of my followers asked though I decided do a longform version of this and explain my dissatifaction with Mastodon a bit better. The short version of this is that I believe that Mastodon — more specifically federation and decentralization won't work out. In the last few years a lot of centralized services did not develop like people wanted which I believe resulted in the pendulum prominently swinging towards decentralization. Decentralization promotes an utopian view of the world that I believe fails to address actual real problems in practice. Yet on that decentralization wave a lot of projects are riding from crypto-currencies [1], defi or things such as Mastodon. All of these things have one thing in common: distrust. Some movements come from the distrust of governments or taxation, others come from the distrust of central services. In my mind the discussion about centralization and decentralization completely misses the point of the intended outcomes. Centralization or decentralization should really be an implementation detail of the solution to an actual problem. For that particular problem the solution might be one of those two things, or something in the middle. But out of principle it should be neither of those two things. I rather understand what exactly the goals are that should be solved, and out of that the right approach on a technical level can be found. Let's ignore Twitter for a second and let's talk about software engineering. Specifically dependency management. I think dependency management is an interesting proxy for the problem here and there are some lessons to be learned from it. As a frequent reader of this blog you might remember me writing quite a lot about scaling code dependencies. When I started writing Python developers used much fewer dependencies than today. When you did use dependencies, it was your own problem to figure out how to get it as automated depencency downloading originally was not a thing yet. The Python tools over time gained the ability to declare dependencies and they were able to pick them up from PyPI (or the cheese-shop as it was frequently called) but we did not yet have centralized package hosting."
year_published = 2022
