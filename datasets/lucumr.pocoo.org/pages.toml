["https://lucumr.pocoo.org/2011/1/22/python-the-web-and-little-things"]
title = "Python, the Web and Little Things on my Mind | Armin Ronacher's Thoughts and Writings"
description = "A bunch of things currently on my mind regarding web development with Python and future directions."
full_description = "A few days ago PEP 3333 was accepted. In case you don't know what this is: it's a specification of WSGI (PEP 333) updated for Python 3. In case you are wondering what it does: it basically just specifies something very close to what everybody was expecting for Python 3 anyways. Together with that also some work went into improving the standard library for Python 3.2 so that it would become easier to port applications to Python 3. Besides that there were also some recent developments in the Python web world I would really love to share my thoughts about. When I was complaining about Python 3 for web development (or more exactly WSGI) at DjangoCon Europe a year ago, I wanted to raise concern about the state of WSGI and that part of the problem was that very few people cared about it. Also I was very unhappy with the idea of introducing Unicode for parts that are clearly not intended to be Unicode. A lot of things have changed. First of all I was wrong about Unicode on the WSGI layer. While I still think that it would have been a wiser choice to stick to bytes there the environment just does not support this very well. Python 3 does not provide any useful string operations for byte objects and there is also not really a plan to support it. Furthermore a lot of places in the standard library now accept Unicode where Unicode was not necessarily the best idea. However at the same time there is also a lot of opportunity now to drive things forward. The fact that urllib on Python 3 is behaving unexpected with regard to Unicode and bytes means that we will probably see some actual working IRI libraries. The problem there however is that a direct port of Werkzeug to Python 3 is very unlikely. To make a transition possible I would probably have to change some interfaces also for Python 2. Otherwise a painless upgrade seems to be pretty unlikely. This is a lot easier for higher level interfaces such as Flask which is based on Werkzeug. That will probably work the moment Werkzeug itself works as there is barely anything in there that would not survive a run through 2to3."
year_published = 2011
year_updated = 2011
