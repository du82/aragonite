["https://lucumr.pocoo.org/2012/10/18/such-a-little-thing"]
title = "Such a Little Thing: The Semicolon in Rust | Armin Ronacher's Thoughts and Writings"
description = "Look at a tiny syntax detail that shows up in current versions of rust that has profound implications on how the language deals with almost everything being an expression."
full_description = "I was very happy to see Rust 0.4 being released yesterday. It's the first language in a really long time that genuinely interests me. It might be the next language besides C, C# and Python that I would really enjoy. The language design strikes such an exciting balance between doing new things and staying familiar enough to feel easy to pick up. One of the exciting things of Rust is how it learns from other languages before in an experimental way. The language is designed and overthrown as it's being used and seeing the process unfold is very reminiscent of how Python's early days must have looked like. One of the surprising features of Rust is how it deals with statement termination and it has not been without criticism. Personally: I am absolutely in love with how it does it but I have seen some people being very opposed to it. So here is me explaining why I think it's the best thing since sliced bread. Before we can get to that, we need to do a detour into the dynamic language camp, mostly into the Ruby and Python camps. The languages seem familiar on the surface but they are actually very far apart. In fact, the languages could not be different in many ways. One of the most striking differences is how Ruby and Python deal with methods and statements versus expressions. In Python everything is an object and that includes functions. In fact calling it a function would be wrong, Python programmers like to call them callables. The reason for that is that there are a lot of things you can call but they behave differently in their lowlevel implementations. That's something you will not notice as a Python novice but it certainly shows up at times, especially when it comes to changing the implementation and exposing unintended side effects. For instance str() in Python used to be a function and was later converted into a type. dir() in Python is a builtin function whereas quit() is an instance of a quitter type. cgi.escape() is a “function”. On the surface they all work exactly the same, but really the only thing they have in common is that you can call them."
year_published = 2012
