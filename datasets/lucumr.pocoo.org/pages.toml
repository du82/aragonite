["https://lucumr.pocoo.org/2009/3/21/going-back-to-windows"]
title = "Going back to Windows | Armin Ronacher's Thoughts and Writings"
description = "Why I am running Windows on my desktop computer now instead of ubuntu."
full_description = "I was using my Macbook Pro for all of my development work lately. However for various reasons I decided to buy a desktop computer again and use that as main development system. Because you can only have Macs in either in crippled, in a monitor or incredible expensive a Mac was out of the question and I assembled a nice computer for about 600€. Because I'm kinda annoyed by the bad state of the Linux desktop lately I decided to give Windows Vista a try. Now. I'm not going to defend my decision here (I already got enough discussions about why I'm using Windows again) but to share my experiences with configuring Windows to work more like I was used to work the last few years. A lot of the stuff I learned to love depends on some sort of UNIX environment. There is a UNIX subsystem in Windows, but that's not what you want to use. A better choice is cygwin which installs a GNU user land with all the stuff you want on your system. I also added C:cygwinbin to my PATH. The latter has the advantage that you can use (non-symlinked) executables that come with cygwin from the normal Windows shell. This is great for a couple of reasons: This also makes the make command and the compilers available. If you're using a Windows Python installation (like I do) make sure to add the Windows Python path before the cygwin Python which is installed by default. I'm a vim user, so I installed vim. However the version control systems I installed (hg and subversion) decided that it was a better idea to use the windows notepad. That's easy to fix however. Here my .hgrc which sets the editor to vim and the ssh executable to the one from cygwin: The next thing I wanted to continue using was the ssh-agent. That tool keeps your SSH passwords for your keys in memory so that you don't have to enter them over and over again. This is especially useful when using hg or svn with the ssh protocol. Modern Linuxes automatically configure the ssh agent to start up with your X11 server and give you a nice UI prompt the first time the key is unlocked. Unfortunately you can't have it that nice in Windows, but it's not that far from it. All you have to do is to create a start-ssh-agent.sh script in C:cygwinhomeUSERNAME that with this code in it:"
