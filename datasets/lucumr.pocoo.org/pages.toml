["https://lucumr.pocoo.org/2010/12/24/open-source-and-games"]
title = "Open Source and Games | Armin Ronacher's Thoughts and Writings"
description = "Are games without assets open source? Why are there so few commercial games releasing with open source models, images and more?"
full_description = "A few days ago the Humble Indie Bundle 2 released. It contains five independently developed games including the universally acclaimed “Braid” puzzle and “Machinarium” adventure games. As with last year they upgraded the bundle after a certain amount of revenue was made. This year they included last year's bundle in its entirety for all people that bought it before a certain time and for everyone that pays more than the average. Additionally yesterday they announced that “Revenge of the Titans” will become open source. This is similar to last year where “Gish”, “Aquaria”, “Lugaru HD” and “Penumbra Overture” went Open Source. However here the important part is that all of these titles went Open Source for their sourcecode only. This does not include the assets. I totally understand the motivation behind that and I welcome any open sourcing of games as it makes it a lot easier to dive into game development. This is similar to how Quake went Open Source after a while (under the restrictive GPL license). I have not checked each and every Open Source release from the Humble Indie Bundle so far but I think all of them are GPL 2 or 3 and none of them include any assets of the games. Which I personally can totally understand but I find it a little bit sad. Mainly I find it sad because I don't care too much about the sourcecode. Why do people Open Source code in general? Looking at a lot of Open Source code I came in contact with I can probably assign each piece of code into one of four categories: However, independently of that there are also motivations for using Open Source code. And that's actually the more tricky piece. There are people that use Open Source code for political reasons, for learning, because they are the best solution available or because they like the fact that they have access to the code and are more flexible that way. So as mentioned earlier the Humble Indie Bundle campaign managed to convince developers to send a “Thank You” to the community by releasing the code under open source licenses. The motivation there is both a marketing reason (might convince other people to spend more money) and because it made sense for them. They earned a lot of money with that and they can strengthen the trust with the community by giving back."
year_published = 2010
year_updated = 2010
