["https://lucumr.pocoo.org/2020/7/6/usb-c-network-hubs"]
title = "USB-C Hubs and Ethernet | Armin Ronacher's Thoughts and Writings"
description = "A word of warning on USB-C/Thunderbolt hubs with ethernet ports."
full_description = "USB-C continues to be an exciting mess. And by exciting I mean frustrating and by mess I mean omnishambles. I already cycled through many, many USB-C hubs with various different degrees of success but the latest iteration of failure I think is pretty interesting that it's worth sharing. For the most part my USB-C hub pains have been isolated to them just breaking eventually, overheating, not delivering the necessary power or just plain not working. The most recent breakage is that I have three hubs where if I connect an ethernet cable to it and a USB-C charger but disconnect my laptop, after about 30 seconds the network goes haywire and eventually more and more devices in it become unavailable. The curious bit here is debugging this mess and why it happens. Initially I thought it was a faulty switch because only devices behind a certain switch (A Netgear one) cut out, so I got it replaced but that did nothing. It's also weird that this behavior did not immediately surface. I have been using these USB-C hubs for an extended period of time but only lately did it cause my network to completely go haywire. My hunch is that it has something to do with generally having an additional two switches on the network and changed the overall topology slightly. What I observed looked quite a bit like a broadcast storm so eventually I ended up Googling for that in conjunction with different devices I have on the network. I was wondering if one of the devices I added to my network lately would do this. Eventually I ran out of ideas and just tried to figure out if and how you can configure the spanning tree protocol on my Orbi. This surfaced a thread from earlier in the year where someone was explaining that their USB-C hub from AUKEY would cause the network to drop out when the laptop was disconnected. This eventually explained what was going on. Previously the USB-C hubs with the network adapter I used where powered off when the laptop was disconnected, as of recently they stay on due to some changes I made in how they are connected to the laptop."
year_published = 2020
