["https://lucumr.pocoo.org/2011/7/9/python-and-pola"]
title = "Python and the Principle of Least Astonishment | Armin Ronacher's Thoughts and Writings"
description = "Why Python follows the Principle of Least Astonishment even when some people are surprised."
full_description = "When you use something for a long time you will develop some kind of sensing of what goes together and what does not appear to fit the common pattern. The Python community seems to have given this effect a name: if something matches the common patterns it's “pythonic” if it's not, it's deemed “unpythonic”. Most aspects of the language itself are designed to not surprise you if you use them in case there would be more than one possible behavior. This is what many people refer to the Principle of Least Astonishment). In my mind there are only a handful exceptions to that rule in the language design which I will cover here as well. However if you ask beginners in Python where the language does not behave as expected you will get tons of results. There is a good reason for that: most beginners to Python are not beginners to programming. They have already a knowledge in some other language and are trying to use that experience to understand Python. I guess it would make a lot more sense to teach Python to experienced programmers by showing them how the idioms in the language work, more than what control structures there are in Python. I was quite fond of Raymond Hettinger's talk about what makes Python unique because he showed a bunch of small examples that almost exclusively used the good parts of the standard library and hardly any user written logic. One example used itertools and the gzip module to load a logfile, parse and analyze it. I found that a very interesting example because it showed that if you do not think of “I will use a while loop here, here and here, and a condition there and then I have the first part” but as “this is what I want to do, this is what I need and am done”. I think Python does an amazing job by making people look at the broader picture instead of boring implementation details. But let's assume for a moment that we are talking to a hypothetical new Python developer that has extensive knowledge in Ruby and Java. What, if we ask such a developer, what will their answer be?"
year_published = 2011
