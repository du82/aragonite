["http://lucumr.pocoo.org/2012/8/11/codec-confusion"]
title = "Codec Confusion in Python | Armin Ronacher's Thoughts and Writings"
description = "A recap of a sad example of where the wrong conclusion was drawn."
full_description = "Alright, I admit Alex Gaynor is a pretty clever guy but I was very close to strangling him today for this tweet: And that's because on the way to Python 3 these functions were removed because they cause confusion with people, but this broke a lot of really good use cases for them in the process. On top of that I truly believe the mere presence of these function did not actually cause confusion, but an unintended side effect did. And all in all I believe that's a really sad example of where wrong conclusions were drawn. One thing I believe is pretty true is that you should never ask people about their opinions directly. You should observe them, figure out what's wrong and then slowly figure out where the true problem lies. In this particular case it seems like many people missed the true problem and stopped noticing that the true solution was much simpler. I can't blame anyone for that and I did not notice it either until the damage was already done. So what do str.encode and str.decode actually do in Python 2.x? They are roughly implemented like this: Alright, so they are just shortcuts for functionality hidden in another module. One important thing of note here is that this is talking about encodings, not about charsets. Very important difference! The most important part here is that codecs in Python are not restricted to strings at all. If you look into the original Python sources you will see that the codecs module talks about objects and not strings. So what is actually the confusing part? The confusing part is not the codecs API but the Python default encoding. Let me show you the problem on a simple example. Alex was arguing against str.encode because of this: What's happening here? The call did not make any sense. The utf-8 codec encodes from Unicode to bytes, not from bytes to bytes like in the given example. Now that might let you believe the correct solution is just to get rid of the encode function on strings. However there are legitimate cases for string to string encodings:"
year_published = 2012
