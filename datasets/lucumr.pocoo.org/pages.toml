["https://lucumr.pocoo.org/2015/4/8/microservices-with-nameko"]
title = "Nameko for Microservices | Armin Ronacher's Thoughts and Writings"
description = "A basic overview of building service oriented architecture like microservices with the help of nameko."
full_description = "In December some of the tech guys at onefinestay invited me over to London to do some general improvements on their nameko library. This collaboration came together because nameko was pretty similar to how I generally like to build certain infrastructure and I had some experience with very similar systems. So now that some of those improvements hit the release version of nameko I figured it might be a good idea to give some feedback on why I like this sort of architecture. Right now if you want to build a web service in Python there are many tools you can pick from, but most of them live in a very specific part of your stack. The most common tool is a web framework and that will typically provide you with whatever glue is necessary to connect your own code to an incoming HTTP request that comes from your client. However that's not all you need in an application. For instance very often you have periodic tasks that you need to execute and in that case, your framework is often not just not helping, it's also in your way. For instance because you might have built your code with the assumption that it has access to the HTTP request object. If you now want to run it from a cronjob that request object is unavailable. In addition to crons there is often also the wish to execute something as the result of the request of a client, but without blocking that request. For instance imagine there is an admin panel in which you can trigger some very expensive data conversion task. What you actually want is for the current request to finish but the conversion task to keep on working in the background until your data set is converted. There are obviously many existing solutions for that. Celery comes to mind. However they are typically very separated from the rest of the stack. Having a system which treats all of this processes the same frees up your mind. This is what makes microservices interesting. Away with having HTTP request handlers that have no direct relationship with message queue worker tasks or cronjobs. Instead you can have a coherent system where any component can talk through well defined points with other parts of the system."
year_published = 2015
