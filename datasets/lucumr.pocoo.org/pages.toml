["https://lucumr.pocoo.org/2023/12/25/life-and-death-of-open-source"]
title = "The Life and Death of Open Source Companies | Armin Ronacher's Thoughts and Writings"
description = "More thoughts on Open Source licensing and companies."
full_description = "You likely know that I've contributed significantly to the Open Source community, that I work for an Open Source Company, that we got shit for calling ourselves Open Source and that we subsequently created a new license to address at least some of these concerns. I also shared my personal thoughts on that license recently which unfortunately promptly attracted a bunch more negative comments for that. That introduction might make me sound a tad bitter, so let's talk about something else. This Christmas I received a 3D printer and I love it for two reasons. Firstly, it was an unexpected gift from my wonderful wife, who chose it. She organized me a brand new Bambu Lab A1 3D printer. It has been a few years since I toyed around with 3D printing and it was mostly in the context of other people assembling printers. That's because even though I love toying around with software, I cannot say the same for hardware. This printer, however, is remarkably easy to set up and use, significantly boosting my enjoyment in this hobby. For this purchase she had to balance my love for Open Source with user friendly technology and I think given the good experience, she chose well. The printer comes with a brief guide for the initial setup. In about 15 minutes of removing some screws and mounting some components we were off to the races. The cloud account appears optional but after scanning a QR code I could operate it from my phone too. It's quick, it's super plug and play and it just feels like an incredibly well put together product. Since I've had to leave the printer at home over the holidays, I've been engaging in related activities like reading up, creating models, and exploring the slicer software. Emotions surrounding this printer are charged. If you step into the wrong parts of the internet you find a lot of hate. Some of it might be warranted, but others just feels incredibly out of proportion. I've noticed a fair amount of controversy surrounding the printer online, largely centered on its Chinese origins, its optional cloud service, and its impact on the Open Source 3D printing community. I won't talk much about the China part [1] here, but I do want to talk about the cloud and license aspect."
year_published = 2023
clearnet = "https://lucumr.pocoo.org/2023/12/25/life-and-death-of-open-source"
