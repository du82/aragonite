["https://lucumr.pocoo.org/2012/2/11/appreciating-design"]
title = "Appreciating Design | Armin Ronacher's Thoughts and Writings"
description = "A few thoughts about how design on different levels and how users respond to it."
full_description = "I think no piece of software had a bigger impact on my work than Trac. Nowadays people often look down on Trac for various different reasons but if you keep in mind how bug management and revision control web interfaces in the open source world looked before Trac you can see why it initially had that much hype around it. When Trac was released tons of Open Source projects used it. It had a slick design and did the few things it provided quite well. The wiki was not great but useable, the integrated subversion support was very well implemented and the bug Tracker was simple but friendly. It was the first bug Tracker that I had used that by default could have been presented to a non technical user without having to tweak it. Trac had a reasonable user interface design compared to the competition. But the beauty of Trac has always been the code that runs it. For the German ubuntu community I deployed a phpBB installation a few years prior to when I used Trac first. One of the great features of phpBB was that people wrote extensions for it that provided extra functionality to the base bulletin board system. The way these plugins worked however was by actually modifying the code. Called “mods” they came with long installation instructions that showed the specific places where you had to copy/paste code in. Not even diff files were provided in those days but it still sortof worked because people took the time to hand patch their installations. Trac on the other hand always had a real plugin system. The base system was littered with interfaces and hook points that plugins could utilize to add extra functionality. Trac's code taught me proper software and API design. Now it seems obvious that this is how you create libraries and applications but the perfection that Trac had in that regard is still largely unmatched. At least in the Python world. For instance Trac always supported running more than one Trac instance per Python interpreter. It was from the ground up designed for that. Django as a framework still does not do that. Which is especially sad considering that Django is a framework and not an application. You could not reimplement Trac in Django without losing this functionality. Trac also had the concept of an instance folder where the instance specific files are dropped (design, static files, uploads, configuration, the sqlite db if used, per instance plugins etc.) which more people should consider."
year_published = 2012
clearnet = "https://lucumr.pocoo.org/2012/2/11/appreciating-design"
