["https://lucumr.pocoo.org/2008/9/14/bitbucket-is-no-bit-bucket"]
title = "Bitbucket is no Bit bucket | Armin Ronacher's Thoughts and Writings"
description = "Old article about why I love bitbucket."
full_description = '''When github appeared on the internets for the first time, there was a short period of time when I saw the admins of that sitehappy github users [See the follow up to this post for an explanation] jump into many IRC channels of projects that were using git already to switch to github for hosting. Personally for me that was alarming because after a while it appered that git without the hub was no accepted option any more for open source projects. Ever since we're running our own server I think nobody of us ever regretted to host our personal development tools such as subversion (or now mercurial), trac, irc bots and a lot more. Root servers have become pretty cheap (especially in Germany) and debian/ubuntu make server administration a charm. It really hit me hard when I noticed that people are sacrificing the distributed nature of git and switch to a central hosting location, even though they have their own server infrastructure (I'm looking at you, rails team). Git was designed to not be dependent on a central server and it just doesn't feel right in my eye to force people to switch to a cental hosting platform because it provides things you would be missing otherwise (branchviewers, fork overviews or something). This was pretty much the reason why I wasn't interested that much in bitbucket either. I found it a well done version of hgweb with very fair hosting plans with builtin wiki and bug tracker. Basically the thing I would prefer over Google's code hosting (I'm not a big fan of subversion any more you know). A few days ago however I signed up on bitbucket so that I could push to the dozer repository. A few hours later jespern queried me on freenode and welcomed me to bitbucket. First I was afraid the conversion that started would evolve into a github like "switch to our service, you won't regret it" conversion but it was actually nothing of that sort. That fear out of the way I decided to try mirroring some of the pocoo repositories to bitbucket (because well, you know: we do have some server outages from time to time and a mirror is never a bad idea). And what should I say? It's a really, really nice way to host open source project. I won't compare it to github here which is very similar except that it uses git rather than mercurial and doesn't offer a bug tracker and different plans, but to google code which is a very popular project hosting platform these days.'''
year_published = 2008
