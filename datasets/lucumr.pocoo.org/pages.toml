["https://lucumr.pocoo.org/2007/5/21/getting-started-with-wsgi"]
title = "Getting Started with WSGI | Armin Ronacher's Thoughts and Writings"
description = "A friendly introduction into getting started with WSGI on Python."
full_description = "I finally finished the written matura and have some more time to work on projects and write articles. One of the things I wanted to write for a long time is a WSGI tutorial that does not require a specific framework or implementation. So here we go. Basically WSGI is lower level than CGI which you probably know. But in difference to CGI, WSGI does scale and can work in both multithreaded and multi process environments because it's a specification that doesn't mind how it's implemented. In fact WSGI is not CGI because it's between your web application and the webserver layer which can be CGI, mod_python, FastCGI or a webserver that implements WSGI in the core like the python stdlib standalone WSGI server called wsgiref. WSGI is specified in the PEP 333 and adapted by various frameworks including the well known frameworks django and pylons. Because that's a lot of information let's ignore it for now and have a look at a basic WSGI application: Here a simple, but not too simple example of a WSGI application that says Hello World! where World can be specified via url parameter. As you can see the start_response function takes two arguments. A status string and a list of tuples that represent the response headers. What you cannot see because it's not used here and nowhere else is that the start_response function returns something. It returns a write function that directly writes to the webserver output stream. Because it bypasses middlewares (we'll cover that later) it's a terrible bad idea to use that function. For debugging purposes however it can be useful. But how to start that application now? A webserver doesn't know how to handle that and neither does python because nothing calls that function. Because we're lazy we don't setup a server with WSGI support now but use the wsgiref WSGI standalone server bundled with python2.5 and higher. (You can also download it for python2.3 or 2.4) When you now start the file you should be able to get a Hello John! on http://localhost:8080/?subject=John."
year_published = 2007
