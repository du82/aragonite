["https://lucumr.pocoo.org/2012/11/12/death-by-million-cubes"]
title = "Death by Million Cubes | Armin Ronacher's Thoughts and Writings"
description = "Thoughts on Peter Molyneux' Curiosity game and why it's my biggest disappointment of the year."
full_description = "The year is not completely over yet but I already found my biggest disappointment in games of 2012: Peter Molyneux' Curiosity. In the unlikely case that you missed what the game is about: it's basically a huge cube floating in space that is made of millions of little cubelets that disappear when tapped upon. Everyone that downloaded the game taps on the same cube and together the players make the cube disappear and eventually the game self-destruct because there is nothing more to do. The person that taps on the last cube gets a reward. I was really looking forward to that game. Not because I find it an interesting game — far from it. I was looking forward to it because there are two things in life that I find more interesting than anything else: technology and human behavior. This game had the chance to showcase an excellent implementation on the technical side and tell is something new about how humans work. Instead what I got was a failure of monumental scale. The technology behind it is not very clever and because it barely works it won't be able to tell us anything about how humans work, at least as far as the game is concerned. In fact there is more to learn from discussions outside the game than behavior that people show in the game itself (if it even loads). So for the unlikely case that someone reads this blog who is not a programmer at heart, here is why Curiosity is an interesting technical challenge. Let's ignore Curiosity the final product for a moment because it actually does not at all behave like you think it should. I will come back to Curiosity a bit later. Let's say we would like to build our own Curiosity on the concept outlined previously. Let's assume our cube is made out of millions of cubelets: how large is it? Let's say one face on the top of the cube is set to 8001 by 8001. Since there are six sides and the cubes on the edge are shared with other sides the easiest way to count the cubes on the outside is to calculate the volume of the cube and subtract the volume of everything but the outer layer which leaves us with 8001^3 - 7999^3 (383.904.008) individual cubes on the outermost layer. That's three hundred eighty-four million two individual cubelets. The good news is that the cube gets smaller as we're going in. In fact the number of cubelets per layer is growing quadratically from the core outwards which also means that the time it takes to chip away layer after layer from the outside to the inside is quadratically. The more we're chipping to the core of the cube the faster it will get — quickly. Why is that interesting? It's interesting because it means as the cube gets smaller there will be higher contention as the same player count now operates on a much smaller surface."
year_published = 2012
