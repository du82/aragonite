["https://lucumr.pocoo.org/2017/6/5/diversity-in-technology"]
title = "Diversity in Technology and Open Source | Armin Ronacher's Thoughts and Writings"
description = "Some personal thoughts and observations about the topic of diversity in technology and in particular Open Source."
full_description = "It's a topic I generally do not talk much about but a recent Wired Article made me think about finally writing down my thoughts on this topic. The title of that article was “Diversity in Open Source Is Even Worse Than in Tech Overall” and that is undoubtedly true. When you start an Open Source project today, in particular one which is further disconnected from frontend technologies there is a very high chance the organic community development will be everything but diverse. The highest form of diversity you can naturally expect to form is people from different countries but even there you might have a bias. There are many arguments that can be had about this, but it's my personal opinion that at least in the longer run it's not healthy for a project or a community to lack diversity. I think it's natural for like-minded people to group together but the longer that process continues the more of an echo chamber it becomes. What's worse is the longer you wait to try to get people involved in the project that would naturally not try to join the harder it will be. When your team is 4 men, the first woman which joins will make a significant impact. When your team is already 20 men you need to get a lot more women on board to have the same impact. But it's not just gender that is making a difference, it's in particular cultural backgrounds. The reason Unicode is hard is not because Unicode is hard, but because a lot of projects start out with a lack of urgency since many of the original developers might live in ASCII constrained environments (It took emojis to become popular for people to develop a general understanding of why Unicode is useful in the western world). A lot of the criticism that comes against the diversity movement is that it undermines the idea of “meritocracy” and that it does not mirror the realities in the real world by artificially balancing teams. Both of those arguments are weird in a way because they are very hard to defend if you look at larger parts of society. Tech for recent historical reasons is very male heavy but society is not. Meritocracy in many ways is just sourcing the best from the pool of naturally available people in your environment. Sure by some measurements you will get the best but is the best really what is lacking in an Open Source project? We don't need more of the best, we need more of what is actually missing and what is missing in many ways is not more strong alpha males but people that are good in de-escalating arguments in bug trackers and mailing lists, people that take care of documentations, people that make software work in new cultural contexts (localization, globalization, internationalization, etc.), people that care about user experience etc."
year_published = 2017
clearnet = "https://lucumr.pocoo.org/2017/6/5/diversity-in-technology"
