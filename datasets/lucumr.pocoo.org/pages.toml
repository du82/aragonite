["https://lucumr.pocoo.org/2012/8/27/open-source-financing"]
title = "Open Source Financing | Armin Ronacher's Thoughts and Writings"
description = "A short writeup about finances for Open Source projects and ideas for how to improve it."
full_description = "It still feels unreal in a way how much my life has changed around in the last seven years thanks to the Python community and the concept of Open Source in general. I think I learned most of what I use on a day to day basis from talking to people in the community through IRC and I will always be in debt to many of them. That said: I would not bet my live on Open Source software. I help people on IRC on a daily basis as a form of repaying and I strongly believe that we need it and that we need more of it, but in my personal opinion there is a limit to it. Everybody needs a business model and I have not yet found one that would be compatible with doing Open Source libraries as a one man shop for a living. Without doubt you can have your company do open source development and be successful but there are very few companies that actually do that. The majority produce Open Source as a byproduct of their day to day operations. Google is a good example there. Their business is not the technology so they don't have any problems supporting Open Source. Does that mean there is no future in running Open Source as a one man business? Not necessarily. There are a few platforms showing up that might enable Open Source development as a viable means for income. The most obvious one is probably Kickstarter but it also comes with some problems. The main one is the overhead. Getting 250.000 into your account at once is not a trivial thing to do. The low hanging fruits are that successful Kickstarter campaigns come with rewards and you have to either pay for them or invest time into them which ultimately is an expense again. I did some scraping on Kickstarter projects a while ago and the most successful have many individual and high priced rewards. However there is more to that. A one time payment of a lot of money involves a lot of paperwork and knowledge about the tax system as well. If I would be handed 250.000 euro the first thing I would do was getting a good tax lawyer / accountant to ensure the money is handled properly and in the most efficient way possible."
