["https://lucumr.pocoo.org/2015/4/13/bitcoin-and-cryptocurrencies"]
title = "Bitcoin is Not a Good Consumer Product | Armin Ronacher's Thoughts and Writings"
description = "My thoughts on Bitcoin and some other cryptocurrencies and why many of us are probably better off just ignoring the whole thing."
full_description = "Writing critical essays about Bitcoin is probably not a very good idea, judging by past feedback on tweets. However the topic is burning on my heart and I really want to share my thoughts about it once and for all since I'm getting more and more the feeling I live in crazy land. Bitcoin brings out the worst in people. I really do not believe that Bitcoin (or any other cryptocurrency for that matter) is a viable consumer product. Not now and not in 50 years. More than that it feels like we're all wasting a lot of time and money trying to figure out what to do with Bitcoin. This is really not a very technical post because there is not much that should be said about Bitcoin on a technical level. While it might be a revolution in thinking, it's slow and wasteful and completely incapable of handling transactions on the volume of our banking system by itself. If Bitcoin wins as technology then because the actual use of the technology works for large money transmitters (banks, credit card companies) and not a typical end user. I do however believe that for those applications other systems are more appropriate than Bitcoin. I do want to point out that I definitely see the need for change in the financial system and I have very little doubt that change is not coming. The way current transactions clear is pretty ridiculous given how far we have advanced with technology in other areas. If Bitcoin was just that, I would embrace it in a heartbeat. Unfortunately Bitcoin is 10% technology and 90% politics. I absolutely do not agree with the idea that in the process of improving transaction infrastructure, we should do away with governments, banks and pretty much everything else. So while this criticism here applies to Bitcoin, Dogecoin, Peercoin and god knows what other cryptocurrencies are out there, it does not apply to Ripple or Stellar. If you are interested in the technical bits of Bitcoin, you might want to monitor those projects instead. Bitcoin is many things at once, and that makes it hard to write about it. It's an economic system, a currency, a distributed ledger and a community and some bizarre investment vehicle with ponzi incentives."
year_published = 2015
clearnet = "https://lucumr.pocoo.org/2015/4/13/bitcoin-and-cryptocurrencies"
