["https://lucumr.pocoo.org/2016/5/18/for-our-children"]
title = "A Europe For Our Children | Armin Ronacher's Thoughts and Writings"
description = "Thoughts about what I believe is wrong in Austria today and how we can maybe break the trend."
full_description = "Most of the readers of this blog are not from Europe, let alone Austria, the country I was born in. As such I'm not sure how many will actually care about Austrian politics here, especially if it's a lengthy post. But I would still like if you read it because I think the topic is important and not just because of Austria. Our problems here are not just ours, they are a general issue that affects all of Europe and the western world. So since you are probably in no way familiar with Austrian politics or the situation in the country I want to give you a brief overview. Austria has recovered very quickly from the war torn country it was after World War 2 and emerged as one of the most powerful economies of Europe if looked at on a GDP per capita basis. It underwent a conversion from an agricultural country with some tourism attached to being dominated by the service industry and producing technology and parts (the economical tree map looks confusing because it's so heavily diversified). However as great as the country has developed after the wars and as profitable the creation of the Eurozone was, there was an end to this positive trend and it came with the financial crisis of 2007/2008 (although with a bit of a delay). The economy did recover, but it did not do it to the extent people wanted. At the same time necessary reforms were not implemented (or not implemented in the right ways) and as a result the country has suffered major blows in the last few years. From a personal point of view I cannot stress enough how disappointed I am that many of my collegues went to other countries and started their companies there or work there. But it would be foolish to blame politics on this alone. This is as much a problem of politics as it is a problem of culture. We now reached the point where cheap and populist ideas like reducing social welfare for non citizens gets popular support. In this environment right wing parties emerge and this sunday Austrians will probably elect the first right wing leader of the country since the end of World War 2."
