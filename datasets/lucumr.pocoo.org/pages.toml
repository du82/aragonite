["https://lucumr.pocoo.org/2014/10/16/on-error-handling"]
title = "On Error Handling in Rust | Armin Ronacher's Thoughts and Writings"
description = "My thoughts about error handling in APIs after writing a Redis library in Rust."
full_description = "Rust is improving quite a lot lately and it makes it very exciting to play with the language and see how good API design could look like. There are areas in it however that are a bit frustrating still. For me one area is error handling. But some improvements might be coming up which I find quite exciting because it changes things around a bit from what most people are used to. I actually wanted to write about about the API design in my little redis library but I expect the changes in the error handling to change the dynamics around a lot. Because of that I want to write a bit about the error handling in Rust currently and where it could be going. Rust at present has two ways to indicate failure: results and hard task failures. In practical terms only the former is actually what you should be concerned with. Task failures are a last resort that you can fall back to if there is nobody who can pick up on your problem or if the problem is just of a nature that does not permit any error handling. At present a result is as good as it gets. A type Result<T, E> has two possible states in which it can be: Ok(T) or Err(E). So it either succeeded with an object of value T or it failed with an object of value E. I think this concept in generally is quite obvious to developers, even if they have not used Rust. Because failures are quite common there is also a macro provided in Rust called try! which implements an early return that propagates the error part upwards: As you can see, the try! macro makes things quite straightforward. There is however quite a big problem with it, and that is that all the errors from the function have to be the same. In many cases that is just wrong. A good example is my redis-rs library. Since all operations are happening over sockets you can either get an IOError or you might be presented with a redis specific error. The problem of errors that want to cross an abstraction boundary are a long standing issue in many programming languages. There have been quite a few extreme approaches to this problem."
year_published = 2014
clearnet = "https://lucumr.pocoo.org/2014/10/16/on-error-handling"
