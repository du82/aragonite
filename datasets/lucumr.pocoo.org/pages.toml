["https://lucumr.pocoo.org/2010/6/14/opening-the-flask"]
title = "Opening The Flask | Armin Ronacher's Thoughts and Writings"
description = "First part of a series of articles about how Flaks works internally and how you can create micro frameworks with Werkzeug."
full_description = '''Howdy everybody. This is the first part of a multi-part blog post about creating web frameworks based on Werkzeug and other existing code. This is obviously based on my Flask microframework. So it probably makes sense to head over to the documentation first to look at some example code. But before we get started, let's discuss first about why you should create your own frameworks. It is quite unpopular these days to go with building your own framework; everybody quickly shouts "reinventing the wheel" and points you to one of the tons of existing web frameworks out there. But it is actually a really good idea to create a framework for an application and not go with a stock one. Why? Because you are a lot more flexible and your application might require something that does not exist yet. For an application I wrote in the past in the very early Django days the development process looked a lot like this: Step 1: download django, Step 2: get started and feel happy, Step 3: encounter problems in the framework design and start modifiying the core, Step 4: phase more and more Django code out and end up with a completely new package that everybody hates. Turns out: Django like every other framework out there is improving quickly, but often not in the areas you might be interested in. Then you start modifying it yourself and when Django improves sideways, you suddenly end up in the situation where it becomes nearly impossible to upgrade to a newer Django version or it's too painful. Obviously Django has greatly improved since then, but a few things continue to work differently than I want them to work. For one I personally don't like the template engine too much and also would love the ORM to ensure that objects with the same primary key are actually the same objects and queries sent less often. These are things that are very unlikely to change in Django and there are really good reasons why this will not change which are totally fine, but certainly not what I want. Another reason to roll your own framework is that you know everything and you can fix it quickly yourself.'''
