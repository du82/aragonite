["https://lucumr.pocoo.org/2015/4/28/unintended-affordances"]
title = "Unintended Affordances (or why I believe encrypting everything is a bad idea) | Armin Ronacher's Thoughts and Writings"
description = "Some thoughts about the different effects of security and why sometimes less security and less enforcing has unintended positive aspects."
full_description = "In psychology there is the term of affordances. It's the concept that an object affords different actions for someone interacting with it. Most objects in this world have a plethora of things you can do with them, many are not even intended by the designer of that object. As a crude example: a chair does not just afford sitting on it, it could also be used as a table if you sit on the floor. What I find interesting about that concept is that most of the time the actions that you can perform on an object are heavily shaped by your state of mind and environment. An extreme example of this would be the use of bank notes. For you and me, the use of bank notes is to pay for goods and services. If you would have asked a person from the Weimar Republic however a not unlikely use of banknotes was to throw them into an oven and burn them for heat. Clearly never intended by the creator of the currency, but a very reasonable decision given that it was more expensive to buy wood than to burn the currency directly. A similar thing applies to the enforcement of rules. For instance in order to ride a subway you need a ticket. There are two ways in which this can be policed: you have gates that prevent people without a ticket from passing onto the platform or you instead make spot checks. The engineer in me would obviously argue for the gates as it's a technical solution to a problem but upon closer inspection the gates might actually have a bunch of unintended downsides. The gate is a very binary access method: you either get through or you don't based on if you have a valid ticket. It however leaves out a perfectly reasonable affordance which is the idea of riding the train without paying for it. Now obviously one could argue that the whole point of the gate is to prevent this from happening but there are plenty of situations in which it would be entirely legitimate to ride the train without a ticket. A good example for that are emergencies. You cannot really talk to a ticket gate and make your point, it's a soul-less thing."
year_published = 2015
clearnet = "https://lucumr.pocoo.org/2015/4/28/unintended-affordances"
