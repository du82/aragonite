["https://lucumr.pocoo.org/2011/1/1/things-are-not-as-easy-as-they-seem"]
title = "Things are not as easy as they seem | Armin Ronacher's Thoughts and Writings"
description = "Exploration into a human problem: the problem of simplifying complex matters."
full_description = "Every year around Christmas there is one event that I am always looking forward to: the chaos communication congress in Germany which is broadcasted live over the internet. This year that congress was called 27c3 and one of the talks there was entitled “Desktop on the Linux… (and BSD, of course)” and delivered by a raging man condemning everything about the desktop development in the last few years. It's not uncommon to see talks where people try to claim that everybody but themselves are wrong and misguided. The interesting thing this time was that Lennart Poettering was in the audience and at a specific point started to domination the talk. Now it is seen as rude if the presenter does not get a chance to hold his talk, but this time this was entirely justified. Every single point made by the talk was either partially or completely wrong and this actually made the talk fun to watch because it showed greatly how our world is more complex than some people want to acknowledge. This talk for me was a prime example of what might be wrong with Open Source development and an idea of how to improve it. But before I want to do that, I want to share a little story with you. The story is about prime numbers. Now I really suck at mathematics, so bear with me when this story does not make too much sense or is not told properly. However even with the little bit of knowledge about mathematics I can understand how prime numbers are defined: It's a wonderful definition in that it is a single sentence of clearly written English and everybody can interpret it. And with that definition you can easily probe the first few prime numbers. 1 is not a prime because from that definition it does not have two natural number divisors. It only has one and that is the number one itself. The first prime is 2 because the only natural divisors are 2 and 1 and nothing else. The next is 3, the following is 5 and so on. Now unfortunately for our little minds, prime numbers don't have a clear pattern. It's not even that all prime numbers are odd because there is one prime number (two) that is even. Leonard Euler said this about the pattern of prime numbers:"
