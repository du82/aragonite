["https://lucumr.pocoo.org/2013/7/19/application-mimetypes-and-encodings"]
title = "Application Mimetypes and Encodings | Armin Ronacher's Thoughts and Writings"
description = "Some quick notes on application mimetypes and how they deal with encodings."
full_description = "For some reason lots of people are under the impression that each and every mimetype accepts a charset parameter. If you think that is the case: that is incorrect. If a mimetype accepts a charset parameter depends on the mimetype and as a rule of thumb, mimetypes that don't start with “text/” often don't accept one. There are two mimetypes where I constantly see people putting charset declarations next to incorrectly, and then causing a lot of confusion, now to the point where implementations on the server side discard the actual specification. These mimetypes are application/json and application/x-www-form-urlencoded. Neither of those accept a charset. (On the other hand application/xml for instance accepts a charset). So how do you specify a charset for those? You don't! You don't have to or you can't and in both cases for different reasons. The JSON mimetype is defined by RFC 4627 and it specifies that the mimetype does not require any parameters and does not provide any optional parameters. About the encoding it has the following to say: Unfortunately, people started sending charset parameters. And as they started sending charset parameters, people started accepting those charset parameters. The Python requests library for instance will honor the charset parameter which now makes it possible to send latin1 data to it. Not just that, it also honors all kinds of BOMs even though they were never allowed in the mimetype to begin with. I don't negatively credit requests for that though because it's on the receiving side and there supporting more than what the standard says is a common practice. application/x-www-form-urlencoded does not support a charset either. This one for a different reason however. The reason for this is that browsers don't really follow HTTP much when it comes to text submission for legacy reasons. Browsers will usually not tell the server of which encoding their data is. That's usually also not necessary, because the encoding the browser should use is defined by the server (it's either defaulting to utf-8 or is defined in the accept-charset parameter of the form). Since the server already knows that, the web application will just know in which encoding it comes in."
year_published = 2013
clearnet = "https://lucumr.pocoo.org/2013/7/19/application-mimetypes-and-encodings"
