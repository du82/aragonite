["https://lucumr.pocoo.org/2023/11/19/cathedral-and-bazaaar-licensing"]
title = "FSL: A License For the Bazaar, Not the Cathedral | Armin Ronacher's Thoughts and Writings"
description = "My personal commentary on Sentry's new FSL license."
full_description = "Sentry relicensed under a new license, called the Functional Source License (FSL). Like the BUSL it replaces, It's not an Open Source license by the OSI definition, but it comes with an irrevocable grant: after two years it turns into an Apache 2.0 licensed artifact (or MIT for the alternative form). It's the response to a lot of feedback we have received about our previous use of the BUSL. You can read all about the switch to FSL in the Announcement Blog Post. (You can also find my original thoughts on the use of the BUSL here.) When I started Open Source development, there was a very famous essay by Eric S. Raymond called “The Cathedral and the Bazaar”. It describes the bazaar style development model that Linux propagated at the time. Patches were passed around freely on a mailing list, source was always available even between releases. This is how Raymond described the two development models: I believed that the most important software (operating systems and really large tools like the Emacs programming editor) needed to be built like cathedrals, carefully crafted by individual wizards or small bands of mages working in splendid isolation, with no beta to be released before its time. Linus Torvalds's style of development—release early and often, delegate everything you can, be open to the point of promiscuity—came as a surprise. No quiet, reverent cathedral-building here—rather, the Linux community seemed to resemble a great babbling bazaar of differing agendas and approaches (aptly symbolized by the Linux archive sites, who'd take submissions from anyone) out of which a coherent and stable system could seemingly emerge only by a succession of miracles. Today the Cathedral approach in Open Source is very uncommon. The Linux project has not only promoted building in the open, Linus himself has doubled down on that development model by creating git. Today we build in the open. Open Source projects are on GitHub, everything happens there. That's the model I know, it's the model all my Open Source projects use, it's the model Sentry uses. We build in the open."
year_published = 2023
