["https://lucumr.pocoo.org/2013/12/9/stop-being-clever"]
title = "Stop Being Cute and Clever | Armin Ronacher's Thoughts and Writings"
description = "An experience report of using JavaScript with angular for a few days and my thoughts on what's wrong with JavaScript libraries."
full_description = "The last few days I spent a bit of my spare time on making a world time scheduler. Some of you might recognize the concept from another website. The idea was quite simple: build a clone of worldtime buddy and explore working with third party AngularJS directives and a few JavaScript libraries and try to reuse as much as possible. It was not a fun experience. I have not raged so much about working with something in a really long time and that says something, because I'm quite quick at voicing my unhappiness (I'm so sorry for my Twitter followers). I'm using JavaScript quite regularly on my own, but I very rarely need to deal with other people's code. Normally I pretty much stick to jQuery, underscore and maybe AngularJS and I stay focused on the browser or command line utilities. This time around though, I went all-in and used various libraries. For this project I obviously used jQuery which is impossible to avoid (and why would you) but also AngularJS with a bunch of UI components (angular-ui and some bindings to jQuery UI). For timezone handling I used moment.js with moment-timezone. Let me preface this in that I really don't want to criticise anyone's individual code here. More than that, if someone would look at my own JavaScript code it would not be any better. If anything it's worse, because I did not spend much time on it and I'm not very experienced with JavaScript. However I do see a worrying trend of absolutely appalling code quality in JavaScript libraries (at least the selection of the ones I was using) and I started to do some thinking on why that is. There are so many problems I have with JavaScript libraries and all of them are pretty much a result of how the language works and that nobody seems to care. Not that you could not write better code, but it seems like everybody gravitates towards falling into the same traps. The reason I started actively looking into other people's JavaScript code was that my naive approach of sending 3MB of city names into the typeahead.js autocomplete library resulted in a really sluggish UI. Now obviously a clever person would not send that much into an autocomplete field. A better plan would be to filter the data on the server first, but it turns out that it wasn't the loading that was slow, but the filtering of the data. That made no sense to me, because even if the system did a linear search through 26.000 cities it should not have been this slow."
