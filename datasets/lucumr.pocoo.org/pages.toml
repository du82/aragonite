["https://lucumr.pocoo.org/2023/2/17/the-killing-ai"]
title = "I Think AI Would Kill my Wife | Armin Ronacher's Thoughts and Writings"
description = "Why I'm a worried, but not too worried about AIs."
full_description = "Turns out the Bing AI is bizarre and that is making quite the waves at the moment. In essence, the Bing version of ChatGPT has the capability of performing internet searches and as a result will feed some extra data into itself. Then it uses this to conjure up answers with hilarious results, particularly if its internal learned state does not line up with the results. Among other things this has lead to the bot gaslighting its users into believing that they are in the wrong calendar year. I think there is something quite a bit deeper being uncovered by these AI stories and it does worry me a bit. A while back I jokingly suggested giving ChatGPT access to an SSH terminal and Datadog and implement true “AI ops” (a fancy-pantsy term made up by Gartner or others to automate operations with machine learning). The joke was in a way that it probably just tries to reboot the machine for all its problems or just generally wrecks havoc by doing stupid things. Clearly you would not want to just give ChatGPT access to your shell and production services. From a programmer's point of view this is particularly obvious because ChatGPT is quite capable of outputting shell commands, and clearly you need a lot of context to properly operate a service, so it can only fail. It might figure out that your database is running out of disk space, but confined to its shell environment it probably will resolve this issue by randomly deleting data if not worse. The input/output interface of ChatGPT is text, and the capabilities that it has out of the box are the emotions that it evokes in the human operator. These will then feed back into the AI and create that conversation and feedback loop. My experience with ChatGPT were mostly amusing. It tried to make it talk like a drunk Hitler, give me short explanations in the style of the bible, that sort of thing. There was something slightly unnerving about it, but I did find it quite clever in many ways when someone expanded those capabilities by making it emit JSON and plug it into a home automation."
