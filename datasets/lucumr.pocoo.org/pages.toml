["https://lucumr.pocoo.org/2010/7/29/sharing-vim-tricks"]
title = "Sharing Vim Tricks | Armin Ronacher's Thoughts and Writings"
description = "Things I love about vim and that I think are worth sharing."
full_description = "If you are a Vim user, you probably have your own set of tricks that make your editing life a more pleasant experience. So here my set of things I love about Vim and might be worth sharing. Some things first: normal mode = mode you enter with ESC, insert mode = mode you enter with i (or any other insert starting key). That's probably a no brainer because everybody does it all the time, but searching in Vim is a pretty cool experience. Standard search is from normal mode by typing /searchword. To go to the next result use n. If you want to search in the reverse direction, use ? instead of /. If you want to continue the search with the last searchword, just use / or ?. Sometimes you want to search for the word you are just having your cursor over. That's possible by using * in normal mode, which will search for that words forward, # searches for that word backwards. When you use * you will notice in the status bar that Vim is wrapping the word in < and >. This marks beginning of word and end of word. That way if you search for <foo>, it will match foo but not foobar. Generally replacing works with the command :%s/search for/replace with/g. For replacing some weird rules exist which are worth knowing. First of all, the / can be replaced with pretty much everything else. If the slash is part of your searchword, you could also use :%s#search for#replace with#g. The second weird rule is that if you want to insert a newline, n won't do that, r does. For replacements n is actually the nullbyte! But don't worry, r inserts the correct newline sign that is currently in use for this document. The g means: “replace all matches in a line”. Without that, it would only replace the first occurrence of each line. This is a pretty obscure thing that this is not the default, but in some cases you might want to remove the /g. If you replace that way, Vim will do replacements for the searchword on each line in the file without asking. If you add a c to the flags, it will ask for confirmation for each match."
year_published = 2010
