["https://lucumr.pocoo.org/2012/12/29/sql-is-agile"]
title = "SQL is Agile | Armin Ronacher's Thoughts and Writings"
description = "Thoughts about why relational databases are not a bad choice when starting a new project."
full_description = "I have to admit, I was contemplating for a very long time if I should write an essay about databases because the whole topic feels so much like opening a can of worms. First of all there is very little that was not been written somewhere else, secondly the topic is too complex that it would be possible to draw any conclusion out of personal experience. The last two weeks however made me realize however that I would never start a project with MongoDB — or for that matter any other non relational database as primary data store — again. Notice however that I said “start”. I did not say I will never use MongoDB again, I said I will most likely not start a project with that again. Now before I start with explaining myself I want to give a few disclaimers here to make sure everyone is on the same page. First of all my main experience with non-relational datastores boils down to three rather different pieces of technology: MongoDB, hbase and redis. It's very likely that what I attribute as an intrinsic redeeming quality of SQL might be something that another non-relational datastore can do as well. When I'm talking non-relational here I'm mostly talking about MongoDB however because that's what everybody else is talking about as well. The newcomers to the pocoo IRC channel are overwhelmingly picking MongoDB as data store to get started. In fact that is happening in so high numbers that the sentence “MongoDB is not the only data store” was added to the title. The reason for this blog post is that I see a lot of people claiming that non-relational datastores are so much easier for prototyping than SQL based ones and I disagree somewhat with that. It seems like a lot of people are terribly afraid of the concept of a schema. Schema == explicit typing == productivity killer. The problem with this notion is that it's based on the idea that schemas could be removed entirely. Unfortunately this idea is a pipe dream. At one point you need to have an understanding of what you're dealing with: you need to know of what type a value is. If we would not want to write out types in programming languages we have some options. For instance we can solve that problem either by having some flow analysis on the code to see what type is contained in a variable at one point in time statically. That's how Rust's type inference works for instance. Alternatively we could do what Python and JavaScript do and switch to dynamic typing and solve the problem at runtime."
year_published = 2012
