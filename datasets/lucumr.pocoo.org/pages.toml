["https://lucumr.pocoo.org/2013/11/17/my-favorite-database"]
title = "My Favorite Database is the Network | Armin Ronacher's Thoughts and Writings"
description = "A reinforcement about how signed data is useful to create distributed systems."
full_description = "Every once in a while I see discussions about how nice key value stores like redis or memcache are for storing short lived things such as access tokens and session data. While it's true that redis and memcache are perfect for this, you still need to actually connect to a database to retrieve the data. One on hand this means that you need to be actually able to connect to that database, on the other hand it means that there will be load added to that database. It does not have to be this way. Instead of storing the data in the database, you can just store small data like this on the network. What I mean by that is that instead of storing it, you let the client transmit the data back to you when you need it again. This has two huge advantages: the biggest one is that your storage is unbounded. You're essentially allowed to store an unlimited amount of data, because you actually don't store anything. If data still needs to be stored is up to the other side to decide. For instance an application that forgets about it's access token will just no longer remember it and the data automatically expires. The second big advantage is that because there is no database, systems can be entirely decoupled from each other. So what would you store? The most trivial example is an access token. Access tokens usually have a unique ID, they have an expiration date and they store the ID of the client that created it. To store this, you would just put this data into a JSON object, base64 encode it and that's it. Now in most cases because you now transmit this data over the network in plain, you will need to make sure that nobody tampers with the data. This can be accomplished by putting a messages authentication code next to it. This is commonly called a signature (though I understand that people don't like that word much). This concept has been used for many, many years and is the basis of session storage in many web frameworks. For instance Flask uses the Python itsdangerous library to store signed data in Cookies. When further requests come in, the browser will send the data back to the server through a cookie. To prevent a client from tampering with the data, a HMAC based signature is added around the payload."
year_published = 2013
year_updated = 2013
