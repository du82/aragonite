["https://lucumr.pocoo.org/2015/8/9/on-countries-and-citizenships"]
title = "On Countries, Citizenships, Residence and Paying Taxes | Armin Ronacher's Thoughts and Writings"
description = "In which I share some of my personal experiences and discoveries about the more than confusing topic of moving countries and how citizenships and residences work."
full_description = "Like many software engineers my life involved moving from one country to another for work. Since that moment this whole concept of relocation fascinated me because almost everyone in my circle of friends ended up in a place far from where they came but their stories were different. I learned that the topic of relocation and immigration is a very complex and diverse one. How widely different the experience can be for different people! Most interesting about this however is how little people not affected by this understand the complexities of being an immigrant in another country. While my experience of moving to another country was the easiest imaginable, it was harder for my wife. How different immigration can be is hard to imagine from the outside. Since immigration is a big topic again I figured I might share some of my experience on the topic to shed some light on how all that stuff actually works. The most important part is to understand the legal basis for pretty much all topics related to entering and leaving a country and the permits. This is surprisingly complex because of the huge variety of different terms for related topics. Passports are travel documents and means to identify yourself internationally. As of a few years ago any person travelling will need one of those which includes little children. Interestingly however passports are a lot more complex than you might think because they are not directly linked to citizenship. More about this later. A passport gets you across a border and in many cases can act as an universally accepted way to proof something about yourself. For most states in the world the passports follow a generally accepted format which makes them very convenient and they are on of the few documents you never need to translate. Because of this, they will become your best friend when you are not at home though they are by no means the only document you need to reside in another country. Most people would assume that having a passport of one country makes you a citizen thereof. That however is not at all correct. There are different reasons for this and I can't go into all here. The biggest reason why you might have a passport of a country you are not a citizen of is because you are a stateless person."
year_published = 2015
