["https://lucumr.pocoo.org/2015/2/17/ui-and-hidden-consistency"]
title = "Why I Don't Hate Git: Hidden Consistency | Armin Ronacher's Thoughts and Writings"
description = "Some thoughts on why git's complex user interface works so well in practice."
full_description = "Git for me is an interesting topic. I used it initially when git had no UI and cogito was still a thing. I can't say I enjoyed using it much. At the time I did all my development tasks with SVN and the world was good. A little while later I played around with mercurial and instantly fell in love. I held onto mercurial for a long time and defended it vigorously. Only in 2008 did I finally start to use git and it took me multiple attempts until I was convinced that I should migrate my repositories from mercurial to git. I suppose anyone who comes from any version control system to git will be quickly surprised by its utter lack of consistency in the UI. Steve Losh famously made fun of this in his git koans. However every time this topic comes up I am a bit in disbelief because I don't remember the git UI confusing in daily operations. Sure enough, for whatever reason git remote works different from git branch and git tag for some reason but given that I also use them in a different way I would not even make that association. The only git command I actually remember being odd is git show which has a bit of an unfamiliar syntax for exploring object contents. Yet at the same time I remember fighting against Mercurial very commonly and I have a very strained relationship with perforce, but I can't remember many cases where I had issues with git. Thinking about this a bit more I think the reason git resonates so well with me is because I learned git differently than any other version control system. With mercurial and perforce you learn the UI and you learn how to solve some specific problems with it with the consequences or implementations of those actions being a mystery. With git on the other hand even the first page of the tutorial has a direct link to the internals chapter of the git book which explains the internal implementation of git. This was even more the case in the past when git did not even have a UI. As a user you were expected to work with some of the files in the .git folder yourself! I remember playing around in the very early days with git where there was not even a way to commit. The .git/HEAD was still a symlink to the current branch and a documented way to commit was this dance:"
year_published = 2015
clearnet = "https://lucumr.pocoo.org/2015/2/17/ui-and-hidden-consistency"
