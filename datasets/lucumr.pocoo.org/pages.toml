["https://lucumr.pocoo.org/2008/9/20/apologies-to-github"]
title = "Apologies to Github | Armin Ronacher's Thoughts and Writings"
description = "Apology for a mistake I made in an earlier blog post."
full_description = '''A few days ago I wrote a review about bitbucket and one part of the blog post was about how I was annoyed by the GitHub admins forcing people into using GitHub for hosting. Here the section in all its shaming glory: Turns out that either my mind played a trick on me, or I screwed up earlier and mixed up persons. Fortunately IRC logs exist to disprove what I wrote earlier. In the discussions I could grep in my IRC logs it were always non GitHub administrators that tried to convince the project owners to switch to GitHub and in one situation it was one GitHub author that briefly joined the discussion to explain the benefits of GitHub. So I screwed up and my negative bias towards GitHub was mostly based on something my mind made up. Because of that I want to apologise to the GitHub team for the false claims I made earlier. I hope I can somehow made up for that somehow. Color scheme: auto, light, dark. document.querySelector('.theme-selector').removeAttribute('hidden'); document.querySelectorAll('input[name="theme"]').forEach(input => { input.checked = input.value === $THEME; input.addEventListener('change', () => { selectTheme(input.value); }); });'''
