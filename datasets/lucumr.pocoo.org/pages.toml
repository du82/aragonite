["https://lucumr.pocoo.org/2010/1/6/status-update-2010"]
title = "Status Update 2010 | Armin Ronacher's Thoughts and Writings"
description = "Things that will change for me in 2010."
full_description = "As you can see from the archives, the activity in this blog was rather low the last couple of weeks. But not only the blog, also my visible programming activity and everything related. There are a couple of reason for that but unfortunately I'm not entirely sure how this will change in the next few weeks. University turned out to be boring and stressful at the same time and is the main limiting factor of my productivity. While at the same time many courses bore or frustrate me, there is still a lot of stuff that has to be delivered or learned for. While this is the primary reason for not being active at all, there are a couple of other reasons as well. What I spend most of my time with the last couple of years was certainly Open Source (I guess even free software), Python and web applications. For a time I am interested in other topics as well, I just never had the impression that I would be able to learn was has to be learned to succeed at it. I still don't know, but without trying I will never know. So my Python / Webdev activity will most likely stay as low as it currently is for a while. That however does not mean that my projects will be unmaintained. So this little bugger will certainly get a new release soon. I was actually planning a release before the beginning of the new year but there are a couple of things that I want to have sorted out first. I was planning to move the debugger together with a couple of things into a new library called Flickzeug, but because I don't think I will personally need debugging tools any time soon, I will put that plan on hold. If anyone is interested in helping out there, just drop me a line and I will help you as good as I can. The design of the library is pretty much finished, just the implementation is unfinished. Until something for Flickzeug is planned, the debugging component will stay in Werkzeug and not be deprecated. The same cannot be said about the Werkzeug templates however. Because it depends on a library that goes away in Python 3 I will only deprecate it for future Werkzeug Python 3 versions."
year_published = 2010
