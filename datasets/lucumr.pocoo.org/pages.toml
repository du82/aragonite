["http://lucumr.pocoo.org/2009/3/2/std-stands-for-sleazy-tattered-and-dead"]
title = "“STD” stands for Sleazy, Tattered and Dead | Armin Ronacher's Thoughts and Writings"
description = "My experiences with the Python standard library and why I'm not the biggest fan of it or at least the way it works currenctly."
full_description = "My latest discovery of a behavior bug in Python earned me some negative comments. I have to admit that the way I blogged about it and how I reported the bug was not that fair. It was just one bug in a million and I was surprised how late it was discovered. I was really puzzled because of that. Anyhow. That's not what I want to blog about here; more about my bad experiences with the standard library in general. Everybody who knows me know that I hate things quickly and that I'm crazy about beautiful code. Especially in the Python land there are some guys like Christopher Lenz and the trac team or Georg Brandl who write beautiful code just as I like it :) But why am I especially mad about the standard library? The reason for this is that the standard library has some problems (caused by the fact that it's the standard library). A lot of stuff ended up in Python a long, long time ago. And that was fine for the time. I can't blame anyone for the state of the standard library. A lot of stuff was added to it long before I even knew what a computer was. Let's take cgi as an excellent example. cgi was, when it was created, CGI a nice little protocol that just worked. And I really have to give kudos to the developers of this library for doing tons of stuff right. It may sound awkward if you know the library in detail, but believe me, the fact alone that it nearly worked flawlessly with WSGI is noteworthy. It's incredible if you think that WSGI was added years after the library was written. So some forward thinking in terms of “decoupling” it from CGI did the library very well. However the age of cgi shines through. I just recently discovered that the infamous cgi.FieldStorage provides multipart/mixed support. This is incredible. While it's specified as part of HTML4 it was never implemented in a browser people actually used on the world-wide web. The downside is that, like many other libraries in the stdlib, it mixes a high-level API with low-level parsing features. For example if you access a key in a field storage you can't trust that key. It could either be a string, a FieldStorage or a list or strings or FieldStorage`s or both at the time thanks to the `multipart/mixed support.. Hardly anyone knows that because he trusts the data in that it returns the correct value. I guess there are enough Python scripts out there that would die with an internal server error if you pass input data via form that changes from a string into a FieldStorage. The days when you could trust your user to submit the data you expect are long gone. And security and browser bugs are things that change on a nearly on a monthly basis."
year_published = 2009
year_updated = 2009
