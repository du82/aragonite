["https://lucumr.pocoo.org/2016/7/10/rust-rest"]
title = "Rust and Rest | Armin Ronacher's Thoughts and Writings"
description = "Lessons learned from implementing a restful HTTP client for Rust."
full_description = "A few months back I decided to write a command line client for Sentry because manually invoking the Sentry API for some common tasks (such as dsym or sourcemap management is just no fun). Given the choice of languages available I went with Rust. The reason for this is that I want people to be able to download a single executable that links everything in statically. The choice was between C, C++, Go and Rust. There is no denying that I really like Rust so it was already a pretty good choice for me. However what made it even easier is that Rust quite a potent ecosystem for what I wanted. So here is my lessons learned from this. To make an HTTP request you have a choice of libraries. In particular there are two in Rust you can try: hyper and rust-curl. I tried both and there are some releases with the former but I settled in rust-curl in the end. The reason for this is twofold. The first is that curl (despite some of the oddities in how it does things) is very powerful and integrates really well with the system SSL libraries. This means that when I compile the executable I get the native TLS support right away. rust-curl also (despite being not a pure rust library) compiles really well out of the box on Windows, macOS and Linux. The second reason is that Hyper is currently undergoing a major shift in how it's structured and a bit in flux. I did not want to bet on that too much. When I started it also did not have proxy support which is not great. For JSON parsing and serializing I went with serde. I suppose that serde will eventually be the library of choice for all things serialization but right now it's not. It depends on compiler plugins and there are two ways to make it work right now. One is to go with nightly Rust (which is what I did) the other is to use the build script support in Rust. This is similar to what you do in Go where some code generation happens as part of the build. It definitely works but it's not nearly as nice as using serde with nightly Rust. The next question is what a good API design for a Rust HTTP library is. I struggeld with this quite a bit and it took multiple iterations to end up with something that I think is a good pattern. What I ended up is a collection of multiple types:"
