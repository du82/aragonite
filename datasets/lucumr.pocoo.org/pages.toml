["https://lucumr.pocoo.org/2023/2/9/everybody-is-complex"]
title = "Everybody is More Complex Than They Seem | Armin Ronacher's Thoughts and Writings"
description = "Random thoughts about staying sane for people with ambitions."
full_description = "This year I decided that I want to share my most important learnings about engineering, teams and quite frankly personal mental health. My hope is that those who want to learn from me find it useful. When I wake up in the morning I usually have something to do. That doesn't necessarily mean I will do that, but it grounds me. When I was 21 my existence was quite monochromatic. I went to bed in the evening and I continued my work in the morning where I left it off the day before. And like a good performing stock, through that I went “up and to the right”. Probably all the metrics I would have used to measure my life were trending in only one direction and life was good. Work defined me and by my own standards and enough people that I interacted with I was successful. But this monochromatic experience eventually becomes a lot more complex because you're forced to make choices in life. When I went to conferences or interacted with other people online it was impossible not to compare myself in one way or another. My expectations and ambitions were steered by the lives of others around me. As much as I wanted to not compare myself to others, I did. Social media in particular is an awful way to do that. Everybody self censors. You will see much more of people's brightest sides of their life than all the things that go wrong. However even armed with that knowledge, it took me a long time to figure out how to think about myself in that. In the most trivial of all comparisons you take yourself and you plot yourself against other people of similar age that you aspire to and then measure yourself against in some form and then you keep doing that over time. There are some metrics that are somewhat obvious: your salary or income, your wealth, your debts, how much money you're able to spend without thinking about it. These are somewhat obvious and usually you're on some sort of trajectory about all of these. However there are less obvious things that are harder to measure. For instance if you are married, if you have children, what clout you have in your field or at work, if you are doing well mentally or physically."
year_published = 2023
clearnet = "https://lucumr.pocoo.org/2023/2/9/everybody-is-complex"
