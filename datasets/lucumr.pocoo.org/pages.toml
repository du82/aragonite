["https://lucumr.pocoo.org/2012/6/26/disconnects-are-good-for-you"]
title = "ZeroMQ: Disconnects are Good for You | Armin Ronacher's Thoughts and Writings"
description = "The hidden disconnects of ZeroMQ can be dangerous if you don't write your application to work around them."
full_description = "ZeroMQ is a cool technology. It's advertised as “better sockets” and I can get behind that idea for the most part. Unfortunately the high abstraction also makes it very easy to write applications that become unresponsive. That's because ZeroMQ has an implicit state machine for a very common socket type that can get stuck in the wrong state if the peer disconnects. If you walk over to the ZeroMQ website you will find an example of the REQ / REP socket pair. It works very similar to TCP sockets. One the one side you bind the socket to an interface and port, on the other side you connect to it. However there is one huge difference between those two. When talking about TCP sockets the server socket has a way to accept a new client connection. In the mainloop you typically wait until you accept a new connection which then “produces” a new socket. In ZeroMQ there are always only two sockets in the request / response relationship. So how do you send replies back if a request comes? It works because ZeroMQ switches state of the request socket. When the request socket gets a request it memorizes where the request came from and the next sent response goes to that socket. This example server shows the general pattern that is provided by the documentation. it runs in a loop and receives a request and sends a reply back: The client to this is very simple as well. Instead of using REP it uses REQ as socket type, connect, sends a message and waits for one reply: Now I hope you did not get too much carried away with marketing speak because I certainly were. Unfortunately it seems like there is something terribly wrong with these general pattern. It's basically this question that shows the problem: what happens if a disconnect happens between the send and the recv? Since ZeroMQ hides disconnects entirely from you, there is no way to be notified if the client or the server went away. Sadly the socket has an implicit state attached so if a disconnect happens while the socket is in the bound state everything falls apart. And to the best of my knowledge there is no way to force the socket into a different state by hand."
year_published = 2012
clearnet = "https://lucumr.pocoo.org/2012/6/26/disconnects-are-good-for-you"
