["https://ludumdare.com/resources/questions/who-hosted-ludum-dare"]
title = "Who hosted Ludum Dare? | Ludum Dare"
full_description = "Frequently Asked Questions Who hosted Ludum Dare? Throughout Ludum Dare’s history, the event has been hosted on a number of people on a few different websites. The Founding Years: 2002–2007 Ludum Dare 0 (24h) — April 2002 — Geoff Howland on ludumdare.com Ludum Dare 1 — July 2002 — Geoff Howland on ludumdare.com Ludum Dare 2 — November 2002 — Geoff Howland on ludumdare.com Ludum Dare 3 — April 2003 — Geoff Howland on ludumdare.com Ludum Dare 4 — April 2004 — Mike Hommel on hamumu.com Ludum Dare 5 — October 2004 — Richard Jones on mechanicalcat.net Ludum Dare 6 — April 2005 — Richard Jones on mechanicalcat.net Ludum Dare 7 — December 2005 — Geoff Howland on ludumdare.com Ludum Dare 8 — April 2006 — ??? (Mike?) Ludum Dare 9 — April 2007 — jinxd on thewavelength.net The WordPress Era: 2007–2016 After running Ludum Dare 10 in 2007, we set out to standardize Ludum Dare’s website and scheduling to make it more predictable and consistent. Ludum Dare 10 — December 2007 — Phil Hassey and Mike Kasprzak on immitationpickles.com Ludum Dare 11 — April 2008 — Phil Hassey and Mike Kasprzak on immitationpickles.com May 24th, 2008: Data migrated from immitationpickles.com to ludumdare.com Ludum Dare 12 — August 2008 — Mike Kasprzak and Phil Hassey on ludumdare.com/compo Starship/JammerCore: 2016–Today Ludum Dare 37 — December 2016 — Mike Kasprzak on ldjam.com and ludumdare.com/compo Ludum Dare 38 — April 2017 — Mike Kasprzak on ldjam.com"
