["https://ludumdare.com/resources/questions/what-is-a-keynote"]
title = "What is a keynote? | Ludum Dare"
full_description = "Frequently Asked Questions What is a keynote? Ludum Dare keynotes are videos shared with the community to encourage and inspire. Keynotes a shared on final round day. The content of keynotes vary from event to event. Some tell stories, some teach about the event, and others are just silly and fun. In 2009, inspired by Apple’s keynotes, Mike Hommel made a silly video welcoming everyone to Ludum Dare 15. The following year, Phil Hassey and Mike Kasprzak continued the tradition by creating their own videos. Since then, many members of the community have been invited to “keynote” Ludum Dare events. See also: Who has keynoted Ludum Dare? What is Final Round day?"
