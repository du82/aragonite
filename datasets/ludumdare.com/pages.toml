title = "What is the Demoscene? | Ludum Dare"
full_description = "Frequently Asked Questions What is the Demoscene? The Demoscene is a computer art subculture focused on creating “demos”: non-interactive audiovisual computer programs. Demoscene events or “parties” often run one or more competitive events or “compos”. Typically these are “demo compos”, but they may also include “game compos”, or “wild compos”. https://en.wikipedia.org/wiki/Demoscene Ludum Dare Ludum Dare takes much inspiration from the Demoscene. Before the term “game jam” had caught on, Ludum Dare referred to itself as a “game compo”."
