full_description = "Connect Your Wix Site With Lulu DirectWhen you connect your Wix site with Lulu Direct, every book you sell is automatically sent to Lulu for printing and shipping by our global network of printers, then shipped to your reader. Selling books direct-to-consumer has never been easier.Connect Your Wix StoreTo view more Lulu Direct tutorials for your Wix store, click here.Sell Your Book Direct-to-Consumer Using Lulu Direct and WixHow to Sell Your BooksSelling your book on your website is simple with Lulu Direct and Wix. Turn your content into a book to add revenue to your business and connect with new fans.1Upload your book using a free Lulu account.2Create a website using Wix.3Connect your Wix site in the Lulu Direct dashboard.4Sell your books from your website to fans all over the world.Using Wix With LuluScaling Your Business With WixWhether you're just starting your content business or expanding your reach with more products, Wix and Lulu Direct make it easy to monetize your content. Create a book using Lulu, connect it to your Wix store, and start selling! Lulu Direct makes it easy to add variants for each version of your book and create book bundles to offer custom products. Order ManagementLulu Direct's dashboard stores all order information for each book you sell on your Wix site. Quickly sort and manage orders from all your customers.Billing and HistoryTrack payments and fulfillment costs in one dashboard so you always know how much you'll earn from your book sales.Connect Your Wix StoreLearn How To Get ConnectedBook Creation GuideIncludes PDF specifications, spine guides, and formatting terms to help you print your book. Download the Free GuideStart Selling with WixLearn how to connect your book to a WooCommerce product for sale on your WordPress store.Got Questions?Our team is ready to help. The Lulu Direct Knowledge Base is the best place to start.Get AnswersOther Ways to Sell Direct"
