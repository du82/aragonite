hacking" or defacing any portion of the Site;Violate any applicable laws or regulations;Express or imply that any statements you make are endorsed by us, without our prior written consent;Upload to, transmit through, or display on the Site (a) any material that is unlawful, fraudulent, threatening, abusive, libelous, defamatory, obscene or otherwise objectionable, or infringes our or any third party's intellectual property or other rights; (b) any confidential, proprietary or trade secret information of any third party; or (c) any advertisements, solicitations, chain letters, pyramid schemes, investment opportunities or other unsolicited commercial communication (except as otherwise expressly permitted by us);Use the Site to harm minors in any way, including, but not limited to, by uploading content that violates child pornography laws, child sexual exploitation laws, and laws prohibiting the depiction of minors engaged in sexual conduct;Engage in spamming or flooding;Attempt to upload files by any method to another user's account without permission;Access or use (or attempt to access or use) another user's content without permission;Use any device or software to interfere with the proper working of the Site or of a destructive nature;Modify, adapt, sublicense, translate, sell, reverse engineer, decompile, or disassemble any portion of the Site;Remove any copyright, trademark, or other proprietary rights notices contained in or displayed on any portion of the Site;"Frame" or "mirror" any portion of the Site, or link to any page of or material on the Site other than the URLs provided by us to you for such purposes as part of the Site, without our prior written authorization;Use any robot, spider, site search/retrieval application or other manual or automatic device or process to retrieve, index, "data mine" or in any way reproduce or circumvent the navigational structure or presentation of the Site;Harvest or collect information about or from users of the Site without their express consent and, if such consent is provided, only pursuant to applicable law.WE MAY SUSPEND AND/OR TERMINATE YOUR ACCESS TO AND USE OF THE SITE AND/OR ANY FEATURES MADE AVAILABLE THROUGH THE SITE IMMEDIATELY IF YOU FAIL TO COMPLY WITH THE ABOVE RULES OR OTHERWISE FAIL TO COMPLY WITH THESE TERMS. A DETERMINATION TO BE MADE AT OUR SOLE DISCRETION.3. ContentIn the event that you post or upload to the Site in compliance with Section 2, or otherwise submit to or through Lulu as part of your use of the Site, any materials including, without limitation, text, photographs and other images, graphics, videos, visuals, sounds, data, files, links, and other materials (collectively, “Content”); you retain ownership of such Content. You hereby grant us and our designees a worldwide, non-exclusive, sub-licensable (through multiple tiers), assignable, royalty-free (except as otherwise agreed during the online publishing process) right to use, reproduce, distribute (through multiple tiers), and publicly display such Content, solely in connection with the Site. Should you decide to limit the access to and distribution of your Content, we will use commercially reasonable means to prevent such access and distribution. However, we cannot guarantee that these means will work all of the time. Please note that, while you retain ownership of your Content, any template or layout in which you arrange or organize such Content through tools and features made available through Lulu are not proprietary to you, and can be used by Lulu and others for any purposes. You acknowledge and agree that you have no rights in any such template and/or layout, and such template or layout shall be the sole and exclusive property of Lulu.Lulu may provide automatically generated example language, such as standard copyright practices, based on the information you provide during the publication process. You will hold Lulu harmless in using said language and guarantee you are providing and validating appropriate and accurate information regarding the copyright of your material. It is your obligation to review and verify the automatically generated example language if you choose to use this language in your book.You represent, warrant and covenant that (a) you own or otherwise possess all necessary rights with respect to your Content; (b) your Content does not and will not infringe, misappropriate, use or disclose without authorization, or otherwise violate any intellectual property or proprietary right of any third party, and are not unlawful, fraudulent, threatening, abusive, libelous, defamatory, obscene or otherwise objectionable; (c) at Lulu's request, and without further consideration, you will promptly provide Lulu with reasonable evidence of such adequate and enforceable rights of third parties (i.e., consents, approvals, licenses or sublicenses), and agree that Lulu may provide a copy of these Terms to anyone claiming an infringement of copyright/trademark relating to your Content or to law enforcement or other entities as required by law or as Lulu reasonably determines to be necessary to protect Lulu’s rights or the rights of others; (d) you will abide by any Content policy established in these terms and/or posted on the Site; and (e) you hereby consent to the use of your likeness, and you have obtained the written consent, release, and/or permission of every identifiable individual who appears in your Content to use such individual's likeness, for purposes of using and otherwise exploiting the Content in the manner outlined by these Terms (including for purposes of promoting the Site); or, if any such identifiable individual is under the age of eighteen (18), you have obtained such written consent, release and/or permission from said individual's parent or legal guardian (and you agree to provide to Lulu a copy of any such consents, releases and/or permissions upon request). Any violation of this Section, as determined in our sole discretion, can be cause to remove any and all of your Content from the Site, remove from applicable Global Distribution Channels, and to terminate your account and access to the Site.None of the Content will be subject to any obligation, whether of confidentiality, attribution or otherwise, on our part and we will not be liable for any use or disclosure of any Content. You acknowledge and agree that we may (but are not obligated to) do any or all of the following, at our discretion: (a) monitor and/or filter any Content (including without limitation by means of blocking or replacing expletives or other language that may be deemed harmful or offensive); (b) alter, remove, or refuse to send, transmit or otherwise use any Content (including, without limitation, by suspending the processing and shipping of any order relating to any Content); and/or (c) disclose any Content, and the circumstances surrounding the transmission or use thereof, to any third party in order to operate the services on the Site; to protect us and our affili'''
