title = "How to Use Kickstarter to Crowdfund a Book | Lulu"
description = "Kickstarter for Publishing is great for indie authors, artists, & charities to raise money. Plan your next book launch campaign with Lulu's printing-on-demand."
full_description = "How to Crowdfund a Book With KickstarterWhether using Kickstarter for your first book or your latest book, Kickstarter is focused on helping publishing projects come to life. Kickstarter is a great way for writers and publishers to fund new books or even special editions.When you use Kickstarter, you’ll create a funding goal and a Kickstarter campaign page with details about you, your book, and why readers should back you. You’ll add rewards to the campaign at different dollar amounts to entice your followers to fund you at the level that works best for them.Once your project is fully funded, you’ll get the money from Kickstarter. Use it for a content editor, copy editor, cover designer, and to print copies for your backers!Watch How to Crowdfund Your BookUsing Kickstarter For Your Book1Create a Kickstarter account and 'Start a Project'2Provide details about your project and add reward tiers3Promote the Kickstarter to your audience4Once the campaign ends, collect pledges and send rewards!Reward Tier Examples$201 Print and digital copy of your book$502 Print and digital copies of your book + an alternate cover art print$1002 Print and digital copies of your book + an alternate cover art print + a limited edition hardcover$2002 Print and digital copies of your book + an alternate cover art print + a limited edition hardcover + alternate art print editionSend Backer Rewards With Lulu’s Order Import Tool With your funding goal met, it's time to get your books printed and shipped to your fans! Easily place multiple orders at once to customers all over the world with the Order Import tool. Designed for creators using crowdfunding to launch their book, the Order Import tool is free to use and requires no upfront purchase. Simply place your order once your campaign is done and each book will be printed on-demand and shipped directly to your backer. Using the Order Import tool is easy. Export your list of backers from KickstarterFormat it to match our order CSV (we’ll give you a free template)Upload your orders to LuluWe’ll professionally print the orders and drop ship each one to your fans around the world.Use the Order Import ToolWatch How to Use Lulu’s Order Import ToolPopular Book FormatsLulu offers a variety of size, binding, and ink options to help you create your book exactly the way you imagine it.Print BooksMake a novel, photo book, or any book you want with a wide range of options, including paperback, hardcover, full color, black & white, and more!View Print Book OptionsGraphic Novels & Comic BooksWith true comic book printing including inside the cover printing, Lulu makes it easier than ever to create and sell professional quality comics and graphic novels.Make A Comic BookChildren's BooksUse print-on-demand to make a beautiful, full-color children's book in hardcover or paperback. Create a Children's BookHow to Successfully Start Your Kickstarter CampaignWe asked artist and author Lorenzo Etherington to help you get started by sharing some of his tips, tricks, and best advice for Kickstarter campaigns!Kickstarter Projects You'll LoveGet inspired to kickstart your own publishing with these amazing creations using Kickstarter and Lulu.Lorenzo EtheringtonLorenzo's series of art and guides to drawing are both stunning and inspiring!Go To KickstarterGirls Who Colored Outside the LinesThis Kickstarter was all about funding their coloring book!Go To KickstarterEmoji DickThis project published a copy of the classic Moby Dick using only emojis!Go To KickstarterCustom CalendarsCreate a unique calendar with our easy to use calendar tool. You have the option to upload images to make a simple calendar or use our template to make a completely original calendar design.Make a CalendarGet StartedCreate a free Lulu account today to self-publish your book and have your book printed for you, a friend, or readers all over the world.Start Making My Print Book"
