full_description = "Easy to Create Custom Wall CalendarsHigh quality custom calendar printing at any quantity. Making a print-on-demand calendar on Lulu is fast, easy & freeSpecial DatesAdd important dates - birthdays, anniversaries, or any custom holiday you want on any day.Gift or Sell Your Custom CalendarSell custom calendars online through your own site or Lulu's Bookstore with print-on-demand. Have 1 or 1,000+ custom calendars printed!Learn How to Make a CalendarREADHow to Make a Custom CalendarWATCHCalendar Creator Video TutorialCREATEFree Calendar Creation GuideStandard CalendarUS Letter Landscape | 11 x 8.5 inThe Standard Calendar hangs with the photo and month on 2 different pages separated by the coil. There are 4 Calendar grid themes to choose from.Two Paths To Create a CalendarCalendar Creator ToolDesign an original calendar using your images and Lulu's calendar themes. Include national holidays and add your own events. The fastest and easiest way to create your calendar.Upload Your Own Custom Calendar DesignDownload the Calendar Template Bundle below to create a calendar exactly the way you want. Follow Lulu's specifications and layout guide to ensure your unique calendar is amazing! Create a project and Upload your print PDF when your custom design is complete. Create a CalendarCalendar Design TemplatesDownload the Calendar bundle as a 12 or 18 month template in Adobe InDesign and Photoshop. Also includes our Calendar Creation Guide and PDF export settings.Plan Your CalendarUse our Pricing Calculator to see print costs and download a custom calendar template.Calendar Creation FAQWhat Are the Available Calendar Sizes and Formats?Our calendars are 11 x 8.5 in (279 x 216 mm) and feature a ‘wire O’ binding along the 11 in/279 mm edge. All Lulu calendars use the best ink and paper options to ensure a rich, vibrant calendar.How Can I Make Sure My Images Will Print Exactly as I Want?Please see Lulu’s information about Image Formatting. To ensure your images print exactly the way you want them to, please follow these tips:Format your images in sRGB formatOnly use 300 dpi imagesCan I Create a Calendar With More Than 12 Months? Yes, you can create up to an 18-month calendar!How Can I Sell My Custom Calendar Online?You have several options to sell your calendar!You can sell your calendar through your own website using Lulu’s integrations with Shopify, Wix, and WooCommerce. Lulu also offers a Printing API that connects with our international network of printers.Additionally, you can offer your calendar for sale on the Lulu Bookstore.How Long Does It Take to Print & Ship My Calendar?All printers across Lulu’s global network have a production of 3-5 business days, but your shopping cart will display the estimated production time specific to your order.Business days are Monday - Friday, and the first printing day is the day after the order is placed. For example, an order placed on a Monday will be sent to the printer by Tuesday and is expected to print between Thursday (day 3) and the following Monday (day 5).Learn more about printing books of all kinds.Get all the details about shipping Lulu orders around the world.Get StartedCreate a free Lulu account today to make your own photo or art calendar online!Start Making My Calendar"
