mpliance with these Terms. Any use of the Site constitutes your agreement to these Terms. If you do not agree to these Terms, do not use the Site. Note that any violation of these Terms may result in termination of your ability to access and use the Site and your rights to creator revenues.The Terms also include posted terms and conditions applicable to specific services and/or features, all of which are hereby incorporated by reference. Such additional terms and conditions (“Additional Terms”) will be posted for viewing in conjunction with the applicable feature or service. In the event of a conflict between these Terms (other than Section 16, 17, 18, and 19 of these Terms) and the Additional Terms, the Additional Terms shall control; with respect to conflicts between the Additional Terms and Sections 16, 17, 18, and 19 of these Terms, Sections 16, 17, 18, and 19 of these Terms shall control.We reserve the right at any time to change all or any part of these Terms; change the Site, including eliminating or discontinuing any content or feature of the Site; and change any fees or charges for use of the Site. Any changes we make will be effective immediately upon notice, which we may provide by any means including, without limitation, posting on the Site or by electronic mail. Your continued use of the Site after such notice will be deemed acceptance of such changes. You can determine when these Terms were last revised by referring to the 'REVISED' legend at the top of these Terms. It is your responsibility to ensure familiarity with the most current version of these Terms. You agree that we shall not be liable to you or to any third party for any elimination or discontinuation of any content or feature of the Site; or any change in any fees or charges for use of the Site.1. RegistrationWhen and if you register to use the Site, you agree to (a) being at least sixteen (16) years old; (b) providing accurate, current, and complete information about yourself as prompted by our registration form (including your valid email address); and (c) maintaining and updating your information (including your valid email address) to keep it accurate, current, and complete. You acknowledge that, if any information provided by you is untrue, inaccurate, not current or incomplete, (i) you cannot claim a lack of notice on communications we have attempted to send to you that could materially affect your rights under the Terms, and (ii) we reserve the right to terminate your access to and use of the Site. Our Privacy Policy governs the use and disclosure of any information you provide.As part of the registration process, you will be asked to provide your first name, last name, email address, preferred payment currency, and preferred language. Additionally, you will be asked to create a secure password. We may refuse any of the above information for any reason in our sole discretion, including in the event that we determine that such information impersonates someone else, is illegal, vulgar, or otherwise offensive, or is protected by trademark or other proprietary rights law, or otherwise may cause confusion. You will be responsible for the confidentiality and use of your personal information and password and agree not to transfer or resell your use of or access to the Site to any third party. YOU ARE RESPONSIBLE FOR MAINTAINING THE CONFIDENTIALITY OF YOUR PASSWORD, PERSONAL INFORMATION, AND FOR ANY AND ALL ACTIVITIES (INCLUDING PURCHASES, AS APPLICABLE) THAT ARE CONDUCTED THROUGH YOUR ACCOUNT.2. Use of the SiteSubject to and conditioned upon your compliance with these Terms, and solely for so long as you are permitted by Lulu to access the Site, we grant to you a non-exclusive, non-transferable, non-sublicensable, limited right and license to access the Site, including any text, images, graphics, videos, visuals, sounds, data, files, links, and other materials incorporated into the Site (other than your Content), solely as made available by us, solely