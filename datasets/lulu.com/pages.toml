["https://www.lulu.com/glossary/glossary-of-terms"]
title = "Publishing & Print-On-Demand Glossary | Lulu"
description = "Advanced Review Copies or ARCs are draft copies of your manuscript that you give to beta readers or book reviewers prior to publication in order to receive reviews, feedback, or endorsements."
full_description = '''ABCDEFGHIJKLMNOPQRSTUVWXYZAAdvanced Review CopyAdvanced Review Copies or ARCs are draft copies of your manuscript that you give to beta readers or book reviewers prior to publication in order to receive reviews, feedback, or endorsements.APIAn acronym for “Application Programming Interface.” An API lets different software systems communicate with each other.Author BioYour Author Bio is a brief description of you as an author. Your interests, influences, and background can all be a part of your author bio. This information can be included on the back cover or inside flap of your book, and should also be listed on your author website.Author BrandYour Author Brand is the story of what makes you a unique writer. It’s what comes to mind when your readers think of you. A well-managed author brand will build lasting connections with your readers and deliver a promise about what kind of work you’ll consistently create.Author NetworkAn Author Network refers to the readers, authors, colleagues, and other partners that make up your audience. Building an author network is an important part of maintaining your author brand and promoting your book(s).How to Grow Your Author NetworkAuthor NewsletterAn Author Newsletter is content you distribute to your readers via your email list. Your newsletter can include any information you feel would be relevant or beneficial to your readers, including updates on projects you’re working on or any special promotions or discounts you may be offering.Email Marketing For AuthorsHow To Create an Author NewsletterAuthor PlatformIf your author brand is what distinguishes you as a writer, then your Author Platform can be described as the tools you collectively use to create that distinction. The main pillar of your author platform should be your author website, but will also include your social media channels, blog, email list, and any other methods you use to connect and communicate with your audience.Building Your Author PlatformHow To Create An Author WebsiteAuthor Spotlight PageAuthor Spotlight Pages are unique to Lulu authors. This provides a place in the Lulu bookstore to list all of your available titles, as well as your author bio and social channels.BBack Cover BlurbAlso known as Cover Copy, a Blurb is a sales pitch for your book that should sound interesting and represent what’s in the book without giving too much away. If a blurb makes a reader want to read more, it’s successful; if a blurb bores or overwhelms the reader, or fails to explain what the book is about, it needs to be rewritten. For a novel, a back cover blurb is a short description of the book's main character and conflict, usually between 100 and 200 words, that traditionally is included on the inside cover or on the back of a print book. For a nonfiction book, a back cover blurb is a short description of the book’s content, goals, and what message or information the book promises to deliver.Back MatterBack Matter refers to the pages, such as the acknowledgements, index, and author bio, that follow the main text of a book.Beta ReadersBeta Readers are people from your ideal audience who will read your book and offer feedback on characters, plot, story flow (fiction), and content organization (non-fiction).How to Grow Your Author NetworkBinding TypeThe Binding Type defines the method by which your book is held together. Examples include perfect bound (better known as paperback), hardcover, saddle stitch, coil bound, and more.BISACBISAC is an acronym for Book Industry Standards and Communications. BISAC is a standard used by many companies and retailers throughout the supply chain to categorize books based on genre, keywords, and topical content to help with your book’s discoverability.BISAC: What It Is And Why It MattersBleedIn printing, Bleed is printing that goes beyond the edge of where the sheet will be trimmed. In other words, the bleed is the area to be trimmed off. The bleed is the part on the side of a document that gives the printer a small amount of space to account for movement of the paper, and design inconsistencies.What Is Bleed?BlogA regularly updated section on your website that is typically written in an informal or conversational style. Blogs can provide a consistent source of fresh content for your author newsletter and social media.How To Create an Author BlogBlog TourBlog Tours are a method for gaining exposure for new projects or releases by working with a group of bloggers in your genre or audience that are willing to interview you about your work or review your latest book.Book BlockThe Book Block is the printer term for the interior printed pages of a book before it has been bound into the cover.Book LaunchA Book Launch is a set date where you make your published book available for purchase. This can include multiple elements such as a release party, book signing, or social media campaign to drive sales. How To Plan Your Book LaunchWhy Direct Sales Should Be Part of Your Book LaunchBook ReviewsBook Reviews are usually written by a reader or media professional offering a critical synopsis of your book. Book reviews from your ideal readers can be incredibly useful for marketing purposes. When looking for people to review your book, you should aim for a mix of professional and reader reviews.How To Get Book ReviewsBudgetA Budget refers to the money you have allotted to spend on a specific project. This could be money used for editors, formatting, cover designers, social media ads, and any other products or services purchased in the process of completing your book.CCall To Action (CTA)Call To Action is a marketing term for any device designed to prompt an immediate response or encourage an immediate sale. For an author, this would be anything that directly encourages your readers to purchase your book, join your newsletter, follow you on social media, or leave a review of your book.CanvaCanva is a powerful online graphics designer and editor that allows users to create anything from book covers to interior planner and journal pages to marketing assets like social graphics, ads, website banners, etc. Canva offers both free and premium paid services for users - learn more about both at Canva.com.Using Canva To Create Your Photo BookCasewrapCasewrap refers to traditional hardcover binding with the cover image printed on the cover. Casewrap binding is most often used for textbooks and hardcover portfolios.Coil BoundCoil Bound books are bound with a flexible plastic coil wound through punched holes along the entire length of the spine. This allows the book to lie flat when open.ContentContent, in this capacity, refers to the material you are creating for your social media channels, website, blog, newsletter, and more. This can be video, written, or audio content but all serves to help you connect with your audience and engage new readers.ConversionConversion is a term used by marketers to denote someone who visited your website and took an action; like buying a book or signing up for emails.CopyIn marketing, Copy refers to the specific text being used in a project, design, graphic, ad, or other marketing tool. “Back Cover Copy” refers to the text that goes on your book’s back cover. “Ad Copy” is the text that makes up the description or body of, for example, a Facebook Ad.CopyeditingCopyediting is the process of reviewing a manuscript for spelling, punctuation, grammar, basic fact checking, usage and style inconsistencies or errors. However, the copyeditor’s job is not just to check grammar and spelling. They also check to make sure every element of your story is consistent, cohesive, and complete.CopyrightA form of protection provided by the laws of the United States for "original works of authorship," including literary, dramatic, musical, architectural, cartographic, choreographic, pantomimic, pictorial, graphic, sculptural, and audiovisual creations.US Copyright DefinitionsCover DesignCover Design is the process of creating and curating the images and text that will visually represent your book on the cover. Well designed covers can be incredible marketing tools that draw your readers in and establish genre expectations. Design Basics for Creating a Book CoverHow To Design a Book CoverHow To Use Your Book Cover as a Marketing ToolCover File Setup Using Adobe PhotoshopCrowdfundingCrowdfunding is a method of raising capital through the collective effort of friends, family, customers, and individual investors. You can employ crowdfunding to raise funds to complete the publication of your book.How to Crowdfund Your BookDDevelopmental EditorDevelopmental Editors work to improve the structure, con­tent and focus of your book. Developmental editing is also where problems of inconsistent tone or an unclear audience often surface.Direct SalesDirect Sales refer to selling your books directly to your audience via Lulu’s Print API, Lulu Direct, or hand-filling in person or through your own website. Selling directly cuts out the “middleman” retailers and distributors like Amazon, Bookshop.org, etc., often resulting in more direct profits for the author.Why Direct Sales Should Be Part of Your Book LaunchHow To Build Your Bookstore and Maximize ProfitsDiscoverabilityDiscoverability refers to the likelihood of your book to be found online by potential readers. Keywords, metadata, Search Engine Optimization (SEO) and Search Engine Marketing (SEM) can all contribute to your book’s discoverability.SEM for AuthorsSEO for AuthorsWhat the Hell is Metadata?DistributionDistribution refers to the methods or channels you use to sell your books to your readers. This can include third-party sellers, popular retailers, direct sales, and more. Lulu offers distribution through our bookstore as well as our Global Distribution service that reaches over 40,000 retailers and schools around the world.Dust JacketA hardcover book with linen wrap on the cover and foil stamping on the spine. The Dust Jacket is a glossy or matte finished printed cover jacket with flaps. Commonly used for first edition fiction, memoirs, and gift books.EEbookAn Ebook is a book publication made available in digital form, consisting of text, images, or both, readable on the flat-panel display of computers, ereaders, or other electronic devices.EcommerceEcommerce is short for Electronic Commerce. Any time you buy or sell something online, that's ecommerce. For authors, ecommerce presents an avenue to sell books directly to readers, leading to higher revenue and the opportunity to develop a direct relationship with that reader. Elevator PitchAn Elevator Pitch is a brief, persuasive speech that you use to spark interest in your book. A good elevator pitch should last no longer than a short elevator ride of 20 to 30 seconds, hence the name. If you can’t summarize the content and value of your book in 20-30 seconds, you may need to rethink your approach and cut unnecessary information. This should be just enough information to get potential readers or influencers interested in learning more.Crafting An Elevator Pitch Email MarketingEmail Marketing is a form of direct marketing that uses email to promote your business’s products or services. It can also play a pivotal role in your marketing strategy with lead generation, brand awareness, building relationships or keeping customers engaged between purchases through different types of marketing emails.Next Level Email MarketingEndpaperEndsheets are the pages at the beginning and end of hardcover books that are used to glue the inside pages, known as the book block, to the hardcover.EPUBAn EPUB is an ebook file format that uses the ".epub" file extension. EPUB is the most commonly used format for ebooks.FFacebook AdsFacebook Ads are posts that you pay to promote to a targeted audience of users on Facebook and their associated platforms (Messenger and Instagram). Facebook ads are a great way to get your book in front of like-minded or “lookalike” audiences of potential readers.Facebook Author PageAuthors may choose to have an Author Fan Page on Facebook, which allows friends and fans to follow your page and engage with content you share. Visit the “Pages” tab on your Facebook dashboard to get your page started. Facebook For AuthorsFacebook InsightsFacebook Insights provide information about your page's performance, such as demographic data about your audience and how people are responding to your posts. You can use Insights to understand how people are engaging with your page and view metrics about your page's performance.FlyleafThe Flyleaf is an extra blank page inserted during the binding process between the endsheet and the book block at the beginning and end of the book.FoldsThe Folds are represented by dotted blue lines in Lulu's book preview tool (on the Design step) and indicate where your cover is folded. In the case of paperback (perfect bound) books, there is one fold between the front cover and spine, and another between the spine and back cover. A book with a dust jacket will have additional folds where the front and back cover flaps wrap around the inside of the book cover, while our saddle-stitch books will have only one fold between the front and back cover.FormattingFormatting refers to the arrangement and stylistic presentation of text. This includes headings, paragraphs, quotations, and footnotes/endnotes, any images or graphics, and other elements like page numbering included in the manuscript. Another word for formatting is layout.Front MatterFront Matter refers to the pages, such as the title page, copyright page, and preface, that precede the main text of a book.FulfillmentFulfillment refers to a sequence of steps a business undertakes to process the order from the point of sale to the delivery of goods with customer satisfaction. GGalley CopyA Galley Copy is a rough copy of a manuscript that has not yet been copyedited or formatted, but has been bound and printed for early review or advance promotional purposes. Galley copies are usually limited to just the body of text, as front matter, back matter, interior art and formatting, and cover art usually haven’t been finished yet.GatekeepingGatekeeping is the activity of controlling, and usually limiting, general access to something. Gatekeepers are much more prevalent in traditional publishing and almost non-existent in self or independent publishing.Understanding The Publishing GatekeepersGenreGenre is a category of artistic composition characterized by similarities in form, style, or subject matter. Your book’s genre can refer to the general distinction between Fiction and Nonfiction, but may also be more nuanced to include the main theme, such as Mystery, Memoir, Personal Growth, or Poetry.Global DistributionGlobal Distribution is Lulu's service enabling you to list your book on retail channels. All sales are reported to Lulu and listed in your dashboard for easy access and tracking. When a reader buys your book from one of the participating sales cha'''
