full_description = "Connect Your Shopify Store with Lulu DirectWith Lulu Direct connected to your Shopify store, you can sell your Lulu books directly to your readers from your Shopify store. Orders are fully automated through Shopify and Lulu Direct; when a customer orders a book from your online bookstore, Lulu will print and ship that order directly to them. Selling books direct-to-consumer has never been easier. Connect Your Shopify StoreTo view more Lulu Direct tutorials for your Shopify store, click here.Sell Your Book Using Shopify and Lulu DirectYou wrote a book.Hooray! Now you want to sell your book. But how?1Upload and publish a book in your Lulu account. 2Create a Shopify store.3Connect your Shopify store to Lulu Direct.4Sell your Lulu books through your Shopify store!Using Lulu Direct for Shopify Shopify's Sales ToolsUse Shopify's ecommerce platform and Lulu Direct to sell your books directly to your readers. Create a book using Lulu, connect it to your Shopify store, and start selling! Lulu Direct makes it easy to add variants for each version of your book and create book bundles to offer custom products. Order Management Easily sort, pay for, and manage orders from all your customers within your Lulu Direct Dashboard. Global Printing and Fulfillment Sell your books all over the world with white label shipping to 150 countries.Connect Your Shopify StoreHear Directly From Our Creators“Lulu has a super handy integration with Shopify. Lulu makes it so easy to sell paperbacks directly to readers.”– Kelly Oliver, kellyoliverbooks.com“Lulu Direct has been a game changer for me in being able to provide resources to my community to grow and scale my business.”– Lauren Joyner, lauren-fit-foodie.comLearn How To Get ConnectedBook Creation GuideIncludes PDF specifications, spine guides, and formatting terms to help you print your book. Download the Free GuideConnecting Your Shopify StoreWatch this video guide for detailed information about connecting your Shopify store to your Lulu Direct account.Got Questions?Our team is ready to help. The Lulu Direct Knowledge Base is the best place to start.Get AnswersOther Ways to Sell Direct"
