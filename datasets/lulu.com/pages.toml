["https://lulu.com/shop/charmian-love-and-michael-norton/the-b-corp-book/paperback/product-1245v8vv.html"]
title = "The B Corp Book"
description = """
This is a book about B Corporations, explaining a new approach to doing business. How business can do better. Not just for profit, maximising gains for shareholders and ignoring the world around them. But better for its employees, the communities where it operates, the environment and our planet.

B Corps are springing up everywhere. There are now over 3,000 in over 60 countries, from small socially-minded businesses to multinational consumer goods companies.

The book aims to encourage awareness of this new way of doing business. And to encourage people to support B Corp businesses ¬– whether as a consumer, as an emerging entrepreneur, as an investor or as a young person thinking about the world and its problems."""
