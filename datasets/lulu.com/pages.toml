full_description = "Product Types You Can Make On LuluPrint BookMake a hardcover, paperback, coil bound, or saddle stitch book. Create your book using a wide range of paper, color, trim size and binding options. The most common print-on-demand book, perfect for a variety of projects.Publish a Print BookPhoto BookPreserve memories or create a lookbook of your work with a hardcover photo book. Featuring the highest quality paper and rich color ink, our photo book products highlight the best of Lulu's print options. Design Your Photo BookNotebookCreate a custom notebook, journal, or planner with our preformatted templates. Or design your own unique notebook for yourself or to sell to your fans.Create Planners & NotebooksWall CalendarCreate a 12 to 18-month wall calendar with our free calendar tool. Upload images and create custom holidays and events to build your calendar or upload an original calendar design.Customize a Wall CalendarComic Book or Graphic NovelTraditional comic book size with paperback binding or graphic novels. Bring your art to life with printing in black & white or rich color, including on the inside of the cover.Make a Comic BookMagazineCreate beautiful magazines in full color. Features paper stock designed for magazines, paperback binding and printing on the inside covers.Publish Your MagazineCookbookShare your favorite recipes with a cookbook with Lulu's print-on-demand. High-quality ink and paper options will have your recipes looking as good as they taste!Make a CookbookYearbookFor schools and institutions, a print-on-demand yearbook means flexibility and customization while saving money. Enjoy the best printing and binding at a fraction of the cost.Design Your YearbookEbookCreate an ebook from your PDF, DOCX, or EPUB file ready for viewing on an ereader, tablet, or smartphone.Create an EbookBook SizesAvailable for Global DistributioninUnitsPocket Book 4.25 x 6.875 in | 108 x 175 mmThe smallest Lulu format, used for fiction as well as references and poetry collections.Book SizeCompare With Another SizeBook Design TemplatesSelect your book size and download a free design bundle. The bundle includes book page and cover templates for InDesign, Photoshop, and Word, as well as our Book Creation Guide.Already Know Your Page Count?Use our Pricing Calculator to see print costs and download a custom cover template using your exact page count.Book BindingsAvailable for Global DistributionPaperback Perfect Bound32-800 pagesThe industry term for traditional paperback binding, perfect bound is the most cost-efficient and popular way to bind on-demand products. Suitable for most projects.Interior Color OptionsStandard Black & WhiteStandard black & white printing for novels, memoirs, and other text-heavy books. Premium Black & WhiteHeavy ink coverage great for books with black & white images, graphs, or other graphics.Standard ColorIf your book is predominantly text but has a few color images, standard color is the right option for you.Premium ColorThe best color printing on every page with rich colors and heavy ink coverage.Paper Types60# CreamUncoatedTraditional cream paper most frequently used for black & white novels and workbooks.60# WhiteUncoatedVersatile and economical white paper commonly found in a wide range of books.80# WhiteCoatedUltra-smooth, high opacity bright white paper used for photo books, magazines, and comic books.100# WhiteCoated (Calendar Only)The heaviest available stock, used to create durable, vibrant calendars.Cover FinishGlossyStiff cover stock with a glossy coating finish. Glossy covers withstand wear and tear well while emphasizing the cover imagery. Glossy finish is commonly used for gifts, textbooks, and art books, but is appropriate for a variety of projects.MatteA matte finish gives your cover a more subdued, natural look. Used most often with novels and notebooks, matte finish withstands scratches and wear better than any other cover finish.Hardcover Linen Wrap Color OptionsLinen is a cotton-poly blend, with a protective acrylic coating that is wrapped around the cover boards of your book. Text is foil stamped on the spine of your book cover.Available for Global DistributionNavyBlack, Gold or White Foil StampEbook FormatsPick from the most popular formats for your ebook. Publish an EPUB or PDF ebook for free with Lulu.EPUBCreate your ebook using our Word DOCX to EPUB converter, or bring your own EPUB. Sell your ebook on Amazon, Apple, Scribd, and more!PDFUpload your PDF and sell as an ebook. Retailers don't currently accept PDF ebooks, but PDFs can be sold on the Lulu Bookstore!Book Pricing CalculatorQuality book printing at a reasonable price. Check pricing, format variations, retail pricing, and shipping for custom books or calendars.Price Your Book"
