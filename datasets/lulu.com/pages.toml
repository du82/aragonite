title = "Create a Custom Journal, Notebook or Planner | Lulu"
description = "Free online tools to create, sell & print custom notebooks, journals, & more. It's easy to make a personalized notebook to sell with print-on-demand."
full_description = "Affordable Notebook PrintingGet the quality you need at affordable printing costs and enjoy on-demand printing that eliminates the need to warehouse your notebooksFree Customizable TemplatesUse our free templates to start your notebook or journal, then fully-customize your template using your favorite page layout tools Fast Printing & ShippingHave notebooks printed-on-demand in the exact quantity you need, when you need and shipped internationally. Have a single book copy printed or 1000+ Print a Custom Journal, Notebook, or PlannerWe make it easy to create a notebook or planner using our premade templates. Or design your own custom pages, and we'll print that too!READHow to Make a DIY PlannerWATCHCreate a Book Cover with the Lulu Cover CreatorCREATEFree New User GuidePopular Notebook FormatsA55.83 x 8.27 in | 148 x 210 mmCreate a simple paperback notebook, journal, or planner. Ideal for projects with 100+ pages.MOST POPULAR FORMATPaperbackStandard Black & White60# PaperStarting at 2.55 USDUS Trade6 x 9 in | 152 x 229 mmCoil bound paperback notebooks and planners are designed to lay flat for easy writing.MOST POPULAR FORMATCoil BoundStandard Black & White60# PaperStarting at 6.55 USDUS Letter8.5 x 11 in | 216 x 279 mmLarger format for journals and planners that use large print or include pages for sketching.MOST POPULAR FORMATPaperbackStandard Black & White60# PaperStarting at 3.09 USDDownload Interior PagesGet preformatted pages to create your notebook, journal, or planner. Notebook Interior Pages100 and 200-page interior print-ready PDFs for your notebook in every available book size.Blank Interior PagesLined Interior PagesGraph Interior PagesDot Grid Interior PagesPlanner Interior Pages100 and 200-page interior print-ready PDFs for your planner in 3 recommended sizes.Daily Planner Interior PagesWeekly Planner Interior PagesMonthly Planner Interior PagesHabit Tracker Planner Interior PagesPlanner Interior Bundles12 Month Weekly Undated Planner178-page complete planner interior PDF in 3 recommended sizes.12 Month Weekly Undated Planner & Habit Tracker218-page complete planner interior PDF in 3 recommended sizes.6 Month Daily/Monthly Planner302-page complete planner interior PDF in 3 recommended sizes.Book Design TemplatesSelect your notebook size and download a free design bundle. The bundle includes book page and cover templates for InDesign, Photoshop, and Word, as well as our Book Creation Guide.Already Know Your Page Count?Use our Pricing Calculator to see print costs and download a custom cover template using your exact page count.Custom Notebook FAQWhat Types of Custom Notebooks Can I Create with Lulu?Lulu offers the ability to create a wide range of custom notebooks, including lined, graph, dot grid, and blank pages. You can also design personalized planners with daily, weekly, or monthly layouts. Whether you’re making a journal, a sketchbook, or a planner, Lulu provides free customizable templates to get you started.How Do I Use the Templates?Lulu offers a variety of prepared templates for common notebook, journal, and planner designs. You can download and use them exactly as they come, or you can edit the template using InDesign or another PDF editing tool. Once you’re ready with your interior PDF, you’ll upload that file while publishing to create your notebook, journal, or planner.What Formats & Sizes Are Available for My Notebook?You can find a variety of common and recommended sizes along with free templates on this page. Just select a size and binding option that will work best for your notebook or journal, then download the free template to get started.Remember that notebooks, journals, and planners often benefit from being able to open flat, making coil binding a great option. How Long Does It Take to Print & Ship My Notebook?All printers across Lulu’s global network have a production of approximately 3-5 business days, but your shopping cart will display the estimated production time specific to your order. How Can I Sell My Notebook, Planner, or Journal Online?You have several options to sell your notebooks!You can sell through your own website using Lulu’s integrations with Shopify, Wix, and WooCommerce. Lulu also offers a Printing API that connects with our international network of printers.Additionally, you can offer your notebooks for sale on the Lulu Bookstore.Lastly, you can submit your notebook for sale through online retail distribution channels if your book is eligible for retail distribution.Can I Use Lulu to Create Branded Notebooks for My Business?Yes, Lulu’s self-publishing tools are ideal for creating branded notebooks, whether for client presentations, business portfolios, or promotional materials. Customize your notebook with your brand's colors and logos.Get StartedCreate a free Lulu account today to make a custom journal, notebook, or planner!Start Making My Notebook"
