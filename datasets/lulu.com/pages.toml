title = "Sell Books on WordPress | Lulu"
description = "Sell books on WordPress with WooCommerce. Build your Author Website & brand, sell directly to buyers, have books printed & drop shipped globally."
full_description = "Connect Your WordPress Site With Lulu DirectWith Lulu Direct, connect your Lulu books to your Wordpress website to sell directly to your customers. When someone buys a book, the order is automatically sent to Lulu for printing and shipping by our global network of printers. Selling books direct-to-consumer has never been easier.Connect Your WooCommerce StoreTo view more Lulu Direct tutorials for your WooCommerce store, click here.Sell Your Book Using Lulu Direct and WooCommerceYou wrote a book.Hooray! Now you want to sell your book. But how do you set up a WordPress bookstore? Easy! Follow the steps below.1Upload your book using a free Lulu account.2Create an author website using WordPress.3Connect your WordPress site to WooCommerce. 4Connect WooCommerce in the Lulu Direct dashboard!Using WooCommerce With LuluConnecting Lulu + WooCommerceView details and manage your books in the Lulu Direct dashboard. Connect print books uploaded to your Lulu account to products in your WooCommerce store. Create a product page on your store and start selling! Lulu Direct makes it easy to add variants for each version of your book and create book bundles to offer custom products. Order ManagementLulu Direct's dashboard stores all order information for each book you sell on your WordPress site. Easily sort and manage orders from all your customers.Billing and HistoryTrack payments and fulfillment costs in one dashboard so you always know how much you'll earn from your book sales.Connect Your WooCommerce StoreLearn How To Get ConnectedBook Creation GuideIncludes PDF specifications, spine guides, and formatting terms to help you print your book. Download the Free GuideStart Selling with WooCommerceLearn how to connect your book to a WooCommerce product for sale on your WordPress store.Got Questions?Our team is ready to help. The Lulu Direct Knowledge Base is the best place to start.Get AnswersOther Ways to Sell Direct"
