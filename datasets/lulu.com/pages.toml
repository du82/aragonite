title = "Girls Who Colored Outside the Lines"
description = """
Growing up, we all have heroes -- from cartoon characters that remind us of us, to famous people who've overcome the same challenges we face. But finding these heroes isn't easy for everyone, especially young girls of color.

That's why we made Girls Who Colored Outside the Lines, a coloring book featuring groundbreaking women of color. We want to tell a dozen stories and inspire hundreds 
of girls. By giving young women of color positive role models who look like them, we help them visualize a world where they become heroes, too.

Our pages pay tribute to Maya Angelou, Pura Belpré, Angela Davis, Katherine Johnson, Rita Moreno, Ibtihaj Muhammad, Mithali Raj, Naoko Takeuchi, Kara Walker, 
Anna May Wong, Holly Woodlawn and Malala Yousafzai!

ABOUT THINKING IN FULL COLOR
