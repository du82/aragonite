 about whether you’re doing any of it right. Cat will guide you the whole way through and walk you right up to the finish line—whether that’s querying agents and publishers, or supporting you through the self-publishing process to help make your book a success.Learn MorePublish Your PurposePublish Your Purpose is a hybrid publisher of non-fiction books. Our authors are thought leaders, experts in their fields, and visionaries paving the way to social change—from food security to anti-racism. As an LGBTQ+ and women-owned B Corporation™, our mission is to elevate the voices often excluded from traditional publishing. We intentionally seek out authors and storytellers with diverse backgrounds, life experiences, and unique perspectives to publish books that will make an impact in the world.Learn MoreStar Maker Marketing Star Maker Marketing offers financial advisors and business owners the opportunity to build authority and increase business opportunities with a lead-generation book. Home of the "BOOK It!" Home Study Program, Star Maker Marketing offers book coaching, ghostwriting and editing services, formatting and design, book cover design, and marketing strategies that will amplify your reach. From a book's concept to fulfillment, we'll take your dream of becoming an author and make it a reality. Click the "Learn More" button and schedule a conversation.Learn MoreSummit Book ServicesSummit helps all types of organizations in the book creation industry grow and prosper with our powerful outsourcing solution that’s simple to plug into your workflow. With our easy-to-use Workspace, you will have immediate access to a selection of professional quality book creation services you can use at any time from anywhere. Our strict quality control production standards will enable you to deliver an expertly produced book file to your client without the operational cost and challenge of doing it yourself. See how easy it is to increase your business productivity so you can focus on your business creativity. Create your free Workspace today!Learn MoreTell Tell PoetryTell Tell Poetry is a poetry resource site that turns wannabe poets into published authors by providing line edits, proofreading, book cover designs, interior layouts, and self-publishing support.Learn MoreWriting ToolsProlifikoSupercharge your writing! Prolifiko is a productivity coach for writers determined to finish. Feel more positive, keep focused and meet all your deadlines with our science-backed online coaching programs and courses.Learn MoreProWritingAidGreat writing, made easier. Become the writer you always wanted to be. ProWritingAid uses Artificial Intelligence to catch more spelling and grammar errors. It enhances the strength and clarity of your writing with style and readability improvements. It also helps you build your writing technique with in-app explanations, videos and quizzes. Join over one million writers who already use ProWritingAid to self-edit like a pro.Learn MoreRedbud Writing ProjectWrite. Workshop. Repeat. The Redbud Writing Project is a creative writing organization that offers classes in fiction, poetry, nonfiction, script-writing, and more. Redbud also offers manuscript consultations and coaching, either in-person or online, for writers at any stage of their process.Learn MoreEditing & FormattingEditorial Freelancers AssociationThe Editorial Freelancers Association is a national organization of more than 2,600 freelance editorial specialists who can help you take your manuscript to the next level. We help writers understand the editorial process and connect them to editors through our free Member Directory and Job List.Learn MoreEbook LaunchLooking to have your book professionally edited before you self-publish? Ebook Launch has a team of experienced and affordable editors to help. Ebook Launch also offers formatting services for epub, digest and trade print formatting. Our services for editing and formatting are simple, fast, and affordable. Get