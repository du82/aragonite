["https://lulu.com/about-us"]
title = "Lulu’s Company Profile & Mission | Lulu"
description = "Since 2002, Lulu offers free self-publishing tools to Print, Publish, & Sell books, calendars, ebooks, & more. See how authors & our employees are Lulu's core."
full_description = "CHAPTER 1Our MissionLulu is dedicated to making the world a better place, one book at a time, through sustainable practices, innovative print-on-demand products, and a commitment to excellent service.Lulu In the NewsCHAPTER 2Our Origin StoryAfter successfully navigating a record-breaking IPO for Red Hat in 1999, our founder, Bob Young, discovered publishing his amazing story through any of the traditional publishing houses was impossible. Determined to share his story, he employed a hybrid publisher but was frustrated, disappointed, and dissatisfied with the nominal results. At this point, he determined no one should have to share a similar experience, and Lulu was born.CHAPTER 3Our Quality StandardsLulu uses print-on-demand technology to print and ship books, calendars, & more. Our international network of printers handles each book individually, ensuring the highest-quality custom book printing in the industry.Today, Lulu has evolved to offer print-on-demand sales tools to address content creators' biggest challenges: monetizing content while developing a direct relationship with their fans. Direct-to-consumer sales tools like Lulu Direct allow anyone to sell books directly on their own website. Direct sales are the way of the future and Lulu brings the best ecommerce integrations for anyone who wants to publish and sell books.CHAPTER 4Our Ethical StandardsAs a Certified B Corporation, Lulu is committed to balancing purpose and profit. We prioritize sustainability and strive for the highest social and environmental performance standards.100% renewable energy consumptionPaid volunteer days for employeesIn-office composting and gardeningCHAPTER 5Our Core ValuesLulu is a company built on four core values representing who we are and why we believe in our work.1CommunityWe empower authors, creators, and employees to support local and global communities through diverse storytelling, volunteerism, and sustainable practices.2OptimismWe believe that a collective positive mental attitude drives meaningful change.3InnovationWe question everything and push boundaries to create the best publishing experience.4CreativityWe take a humble and imaginative approach to giving ourselves and others the freedom to create.CHAPTER 7Our TeamBased in the Research Triangle, NCJoin Our Team"
