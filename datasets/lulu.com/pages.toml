["https://www.lulu.com/privacy-policy"]
title = "Privacy Policy | Lulu"
description = "Review Lulu's Privacy Policy."
full_description = "Lulu Privacy Policy Lulu Press, Inc. 700 Park Offices Drive Suite 250 Research Triangle, NC 27709Welcome to Lulu Press, Inc. (“Lulu”, “we”, “us”, and its derivatives). Lulu makes available a multi-component SaaS platform and provides related services (the platform, software tools and resources, professional services and Site, collectively, the “Services”) that facilitate on-demand production and fulfillment of products such as books, calendars, and other branded and/or personalized merchandise that incorporate user-provided content. We are committed to protecting your privacy when you use the Services, and this Privacy Policy (the “Policy”) describes how we collect and use information about individuals related to the Services. As used herein, “you” and “user” are used interchangeably and refer to anyone who visits our Site or uses the Services. By visiting the Site and or using the Services, you consent to the practices described in this Policy. If you have any questions or comments about this Privacy Policy, please contact us at [email protected].REVISED: January 24, 20241. Data Types and OverviewPersonal Data means data that allows someone to identify or contact you, (for example, your name, address, telephone number, and e-mail address) as well as any other non-public information about you that can be associated with or linked to any data that allows the identification of individuals.Anonymous Data means data that is not associated with or linked to your Personal Data. Anonymous Data does not, by itself, permit the identification of individual people. We collect Personal Data and Anonymous Data, as described below. We collect and use both Personal Data and Anonymous Data about users to (i) provide, measure, and improve the Services, (ii) communicate with you about your Account (as defined below) or transactions, (iii) send you information about changes to the Services or our policies, (iv) send you offers and promotions, (v) personalize content for you on the Services, (vi) detect, investigate and prevent activities that may violate our policies or applicable law, and (vii) as otherwise described in this Policy.2. How We Obtain InformationInformation You Provide to UsYou do not have to provide Personal Data to use the Site. However, you may need to provide certain Personal Information use select Services, such as when you create a user account (an “Account”). When you create or update an Account, you must provide Personal Data that lets us contact you and deliver items purchased through the paid professional services, and when you place an order we collect financial details such as your bank account number and/or credit card number that allow us or our third party service providers to process payments (“Financial Information”) all of which we may store and use as set forth in this Policy. In addition, we may collect the following information in connection with the Services and Site: If you tell us where you are (e.g., by allowing your mobile device to send us your location), we may store and use that information to provide you with location-based information. This feature may be deactivated in the location settings of your device. After you establish an account, our Site lets you store preferences like how your content is displayed, your location, and safe search settings. As more fully described in our Terms & Conditions, we may associate these choices with your ID, browser or mobile device. We retain information on your behalf, such as content submitted via the Services in connection with an order, the creation of content, or the distribution of content. If you provide us feedback or contact us via e-mail, we will collect your name and e-mail address, as well as any other content included in the e-mail, in order to reply. If we provide the ability to post messages to the Site (i.e., a forum), the information in your posting will be stored on our servers and other users will be able to see it. We also collect other types of Personal Data that you may provide to us voluntarily in connection with support for the Services, such as your operating system and version and mobile device or computer type. If you participate in a survey, contest, or giveaway on our Site, we may ask for your e-mail address and/or phone number (to notify you if you win or not). We may also ask for first and last names, and sometimes post office addresses to verify your identity or to send prizes. Surveys and contests are voluntary, and you should read the rules for each contest that you enter. We may also collect Personal Data at other points during your use of our Site or Services that state that Personal Data is being collected.We use cookies to help keep track of items you put into your shopping cart, including when you have abandoned it. This information is used to determine when to send cart reminder messages via SMS to U.S. residents.Information Collected via TechnologyWe use standard online and mobile technologies to perform and improve the Services, and in some cases, these technologies provide additional information about you: Information Collected by Our Servers.To make our Site and Services more useful to you, our servers (which may be hosted by a third-party service provider) collect information from you, including your browser type, operating system, Internet Protocol (“IP”) address (a number that is automatically assigned to your computer when you use the Internet, which may vary from session to session), domain name, and/or a date/time stamp for your visit. Log Files.As is true of most websites, we gather certain information automatically and store it in log files. This information includes IP addresses, browser type, Internet service provider (“ISP”), referring/exit pages, operating system, date/time stamp, and clickstream data. We use this information to analyze trends, administer the Services, track users’ movements around the Site, gather demographic information about our user base as a whole, and better tailor our Services to our users’ needs. For example, some of the information may be collected so that when you visit the Site or the Services again, it will recognize you and the information could then be used to serve information more appropriate to your interests. Except as noted in this Policy, we do not link this automatically-collected data to Personal Data. Cookies.“Cookies” are small pieces of information that a website sends to your computer’s hard drive while you are viewing the website. We may use both session Cookies (which expire once you close your web browser) and persistent Cookies (which stay on your computer until you delete them) to provide you with a more personal and interactive experience of the Services. Pixel Tags.In addition, we use “Pixel Tags” (also referred to as clear Gifs, Web beacons, or Web bugs). Pixel Tags are tiny graphic images with a unique identifier, similar in function to Cookies, that track online movements of web users. In contrast to Cookies, Pixel Tags are embedded invisibly in Web pages and not stored on a user’s computer. Pixel Tags also let us to send e-mail messages in a format users can read, and tell us whether e-mails have been opened to ensure that we are sending only messages that are of interest to our users. We do not tie the information gathered by Pixel Tags to our users’ Personal Data. Flash LSOs.When we post videos, third parties may use local shared objects, known as “Flash Cookies,” to store your preferences for volume control or to personalize certain video features. Flash Cookies are different from browser Cookies because of the amount and type of data and how the data is stored. Cookie management tools provided by your browser will not remove Flash Cookies. How We Respond to Do Not Track Signals.Users may use the Lulu Privacy Setting tool to customize the amount of data that they will allow Lulu to collect when the User is accessing Lulu’s Site(s) or Services.Analytics Services.Other companies may set their own cookies or similar tools when you visit our Site or use the Services. This includes third party analytics services that we engage to help analyze how users use the Services. We may receive reports based on these parties’ use of these tools on an individual or aggregate basis. We use the information we get from Analytics Services only to improve our Site and Services. The information generated by the Cookies or other technologies about your use of our Site and Services (the “Analytics Information”) is transmitted to the Analytics Services, which use Analytics Information to compile reports on user activity. The Analytics Services may also transfer information to third parties where required to do so by law, or where such third parties process Analytics Information on their behalf. Each Analytics Services’ ability to use and share Analytics Information is restricted by such Analytics Services’ Terms of Use and Privacy Policy. By using our Site and Services, you consent to the processing of data about you by Analytics Services in the manner and for the purposes set out above. For a full list of Analytics Services, please contact us at [email protected].Information Collected from Third PartiesWe may receive Personal and/or Anonymous Data about you from companies that provide our Services by way of a co-branded or private-labeled Site or companies that offer their products and/or services on our Site. We may add this information to the information we have already collected from you as described in this Policy in order to improve the Services.3. Use and Disclosure of Personal DataGeneralPersonal Data you submit to us is typically used either to provide the Services, respond to requests that you or your customers make, or help us better serve you and your customers. We use your Personal Data in the following ways: facilitate the creation of and secure your Account;identify you as a user in our system;provide improved administration of our Site and Services;provide the Services you request;improve the quality of experience when you interact with our Site and Services;send you a welcome e-mail to verify ownership of the e-mail address provided when you create your Account;send you administrative e-mail notifications, such as security or support and maintenance advisories, as well as order and shipping confirmations;send newsletters, surveys, offers, and other promotional materials related to our Services.User Testimonials and Feedback; ForumsWe often receive testimonials and comments from users who have had positive experiences with our Services. We occasionally publish such content. When we do so, we may identify our users by their first and last name and indicate their home city, but will obtain the user’s consent prior to posting this information with the testimonial. We may post user feedback with a first name and last initial, or an Account handle that does not allow identification of the user, without obtaining advance consent. When you provide Feedback with respect to the Services, you consent to our using such Feedback, and identifying it, as described in this section. If you make any comments on a blog or forum associated with your Site, you should be aware that any Personal Data you submit there can be read, collected, or used by other users of these forums, and could be used to send you unsolicited messages. Even if you later delete the information, it may have been saved by other users on their computers and deleting the post will not affect any such other copies of the information. We are not responsible for the Personal Data you choose to submit in these blogs and forums.Creation of Anonymous DataWe may create Anonymous Data records from Personal Data by exchanging information that makes the data personally identifiable to you. We use this Anonymous Data to analyze request and usage patterns so that we may improve the Services and improve Site navigation. We may use Anonymous Data and aggregated and other de-identifiable information for any purpose and disclose Anonymous Data to third parties in our sole discretion.Disclosure of Personal Data.Third Party Service Providers.We may share your Personal Data with third party service providers to: provide you with the Services that we offer you through our Site; to conduct quality assurance testing; to facilitate creation of Accounts; to provide technical support; to perform ad measurements and retargeting; and/or to provide other services to Lulu. These third-party service providers are required not to use your Personal Data other than to provide the services requested by Lulu. Affiliates.We may share some or all of your Personal Data with our parent company, subsidiaries, joint ventures, or other companies under a common control (“Affiliates”), in which case we will require our Affiliates to honor this Policy. Corporate Restructuring. We may share some or all of your Personal Data in connection with or during negotiation of any merger, financing, acquisition or dissolution transaction or proceeding involving sale, transfer, divestiture, or disclosure of all or a portion of our business or assets. In the event of an insolvency, bankruptcy, or receivership, Personal Data may also be transferred as a business asset. If another company acquires our company, business, or assets, that company will possess the Personal Data collected by us and will assume the rights and obligations regarding your Personal Data as described in this Policy. Other Disclosures. Regardless of any choices you make regarding your Personal Data (as described below), we may disclose Personal Data if we believe in good faith that such disclosure is necessary (i) in connection with any legal investigation; (ii) to comply with relevant laws or to respond to subpoenas or warrants served on Company; (iii) to protect or defend the rights or property of Company or users of the Site or Services; and/or (iv) to investigate or assist in preventing any violation or potential violation of the law, this Privacy Policy, or our Terms & Conditions.The above excludes text messaging originator opt-in data and consent; this information will not be shared with any third parties.4. Protecting Your ContentLulu is designed to give you the ability to control who may access the Content and any associated information stored in your Lulu account. We seek not to make your Content publicly accessible, except by your explicit action, or as otherwise noted in this Privacy Policy (including Section 3 of this Privacy Policy).In order to provide quality products, the Lulu employees and third-party service providers fulfilling your order or providing Customer Support need to have access to your Content.5. Updating Your Personal InformationLulu will make an effort to keep all your Personal Information up to date when you provide it to us. Lulu provides you the ability to update your account information and change your password at any time. Visit your Account Profi"
