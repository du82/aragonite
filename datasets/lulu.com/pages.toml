full_description = "Custom Book PrintingChoose from thousands of sizes, paper types, and binding options to create a book and have your custom book professionally printedAffordable Book PrintingHave books printed-on-demand in the exact quantity you need, when you need and shipped internationally. Have a single book copy printed or 1000+ Print a Book or Self-PublishUse Lulu's book printing services or self-publish a book on your schedule & sell through the Lulu bookstore, online retailers, & your own websiteHow to Make a Book & Prepare Your Book's Files for PrintingREADBookmaking BasicsWATCHFormatting Tips for Print BooksCREATEFree New User GuidePopular Book FormatsA55.83 x 8.27 in | 148 x 210 mmBookstore quality printing at affordable costs, our A5 paperback is perfect for your book.MOST POPULAR FORMATPaperbackStandard Black & White60# paperStarting at 2.55 USDUS Trade6 x 9 in | 152 x 229 mmCasewrap with glossy or matte finish and a stiff cover board.MOST POPULAR FORMATPaperbackStandard Black & White60# paperStarting at 4.11 USDUS Letter 8.5 x 11 in | 216 x 279 mm The best format for manuals, guides, or lookbooks, our full color paperback combines value and quality. MOST POPULAR FORMATHardcoverStandard Color80# paperStarting at 11.43 USD Book Design TemplatesSelect your book size and download a free design bundle. The bundle includes book page and cover templates for InDesign, Photoshop, and Word, as well as our Book Creation Guide.Already Know Your Page Count?Use our Pricing Calculator to see print costs and download a custom cover template using your exact page count.Print Book FAQsWhat Are the Available Print Book Sizes, Specifications, and Formats?We offer multiple sizes and formats to suit your needs, including landscape, portrait, and square book sizes. When you create a standard print book, you’ll be able to select from any of our binding options, page sizes, and cover types.How Should I Prepare My Print Book Files?The best place to start is our Publishing Basics article. There we’ll outline everything involved in preparing your files and using Lulu to publish your project.Also, see Lulu’s articles on formatting your interior file. You can upload a PDF cover file or use Lulu’s Cover Tool to create your cover.How Long Does It Take to Print & Ship My Book? All printers across Lulu’s global network have a production of 3-5 business days, but your shopping cart will display the estimated production time specific to your order.Business days are Monday - Friday, and the first printing day is the day after the order is placed. For example, an order placed on a Monday will be sent to the printer by Tuesday and is expected to print between Thursday (day 3) and the following Monday (day 5).Learn more about printing books of all kinds.Get all the details about shipping Lulu orders around the world.How Can I Sell My Book Online?You have several options to sell your book!You can sell your book through your own website using Lulu’s integrations with Shopify, Wix, and WooCommerce. Lulu also offers a Printing API that connects with our international network of printers.Additionally, you can offer your book for sale on the Lulu Bookstore.Lastly, you can submit your book for sale through online retail distribution channels if your book is eligible for retail distribution.Get StartedCreate a free Lulu account today to self-publish your book and have your book printed for you, a friend, or readers all over the world.Start Making My Print Book"
