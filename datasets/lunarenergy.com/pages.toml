["https://lunarenergy.com/lunar-system"]
title = "Lunar System"
description = "We see the future where solar is always paired with a Lunar. Add on one of the highest rated inverters and you will be able to power your whole home through a grid outage."
full_description = "You can start by designing your system and be the first to know when the Lunar System is available in your area. Following that we’ll put you in touch with a Lunar Installation Partner for a final assessment, proposal and they will also do the installation. The Lunar System is a solar and battery product brilliantly designed to let you capture, store and use every ray of sunshine — day, night, and even during an outage. Get it together with solar panels or add the system to existing solar to complete the system. To date, it’s been too complex and cumbersome for homeowners to take the first step towards clean energy. While we at Lunar spend quite a bit of time discussing inverter efficiency, battery chemistry, and electrical controls, we appreciate not everyone shares these interests. Most would rather have something that works seamlessly, looks great, and makes the complicated clear. So we did just that. We worked through all the complexity to deliver a brilliantly designed product with high performance, endless adaptability, and an app that puts the power in your hands. Our brilliant, iF award-winning design has only two (not the standard four to five) boxes on the wall: the Lunar Battery and the Lunar Bridge. We minimize the number of boxes, conduits, and disconnects so that customers can enjoy a clean, sleek look of the system. We also have a compact and mighty hybrid inverter rated at nearly 10 kW. This means you can power your home through an outage without a worry. The entire Lunar System is highly configurable. Install it inside or outside your house, in a basement, on a wall or on a floor: whatever works wherever. The Lunar App lets you see at a glance what your System is doing now, what it did yesterday, what it plans to do tomorrow — so you’re ready for whatever blows your way."
year_published = 2025
