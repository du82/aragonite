["https://lunarenergy.com/support/meet-the-lunar-system"]
title = "Support – Meet the Lunar System"
description = "Understand the hardware that makes up the Lunar System, including a battery, inverter, Bridge, and Maximizers. Also, see answers to frequently asked questions."
full_description = "This includes modular battery blocks and a powerful solar and battery inverter. The top unit is the inverter, which converts power from solar panels and the battery for household uses, synchronizes with the grid, and ensures the whole system runs efficiently, whether connected to the grid or not. The Bridge is a smart panel that manages energy flow between solar panels, the battery, and the grid, ensuring seamless on-grid and off-grid operation. During outages, it instantly isolates your home from the grid to provide backup power. It also monitors real-time energy consumption for display in the Lunar App, and manages the operation of the system in line with requirements for compliance standards. Behind every solar panel is a Maximizer. It is a small device attached to each solar panel to improve the system's efficiency. The Maximizer also monitors each panel's performance and enhances operation safety on the roof. The entire Lunar System is designed in Mountain View, CA, in the heart of Silicon Valley, and manufactured in North America. The Lunar System offers 20 kWh capacity, designed to meet the increasing energy demands of modern homes. As one of the larger battery systems available, it’s designed to support your growing energy needs and keep your home powered longer during grid outages. The Lunar Battery and Bridge comes with a 12.5-year performance warranty. The Maximizers come with a 25-year warranty. This warranty reflects Lunar Energy’s commitment to quality and support, ensuring your system will consistently power and protect your home for many years. The Lunar System is designed for durability, ensuring reliable performance in any environment. It has undergone rigorous testing under extreme conditions, including earthquakes, floods, coastal fog and salt, and fire soot. In fact, the system has been proven to operate after being immersed under 3 feet of water for 24 hours. The Lunar System is more than a battery system; it’s your personal energy manager. Daily AI-driven energy plans save you money, help secure your home in an outage, and even make you money when you join a virtual power plant program. The Lunar System learns your home's energy patterns and can create a personalized battery control plan for you each day. This helps you save money, make money, and live your life with clean, reliable energy."
year_published = 2025
