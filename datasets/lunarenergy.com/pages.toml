full_description = "Endless EnergyExplore the Lunar System Introducing the Lunar SystemYour time machine has arrived.Now you can move the day to night. Light up the peak hours of life with energy you make, store, and use from the strikingly compact Lunar System.Design your System The team behind the productIt’s brilliant to be simple (it’s not simple to be brilliant).When talented people work together, you create a product that’s powerful and beautiful—inside and out.Hear from the team Design your Lunar System todayThe new power couple, solar and the Lunar System. Designed to work together to save you money, eliminate outages and let you live off the sun. Now you can use energy like it’s endless.Design your System “Lunar’s modular hardware is designed to grow as needs increase over time, allowing homes to add blocks with the relative ease of LEGO bricks.”“Lunar’s app is packed with features and data — but only if users want to see it. It’ll also give you an easily readable report on how power is being utilized at any given time.”“Lunar’s Big Battery Can Electrify Your Home and Make the Grid Greener.”"
