["https://lunarenergy.com/design-your-system"]
title = "Design your system"
description = "Meet the all new, all-in-one Lunar System. It is stunningly compact, including everything you need to capture more clean energy and power everything in your home. Reserve your design today to enjoy endless energy future."
full_description = "Using your address, we’ll estimate your monthly electricity bill and how much sunlight lands on your home. By clicking Get Lunar, you agree to the Lunar Energy Terms of Use and you further acknowledge that you have read and understand the disclosures in Lunar Energy’s Privacy Policy. A Lunar Installation Partner will provide a final proposal including solar panel options and complete your installation. We determine your potential 1st year savings by comparing your current annual energy bill with a potential bill after installing solar and the Lunar System. To calculate your annual energy bill, we assume an energy rate plan based on the major utilities in your state and evaluate your annual solar production profile based on your zip code. For solar owners in California, we use NEM2 tariffs, and for those without solar, we use NEM3 tariffs. To estimate the hours of backup, we divide the total usable capacity of the battery by the consumption rate (total annual consumption divided by hours in a year). Even without grid power, solar and the Lunar System continuously power your home. So long as the sun shines, you can recharge your Lunar System and power on. Increased energy usage or unfavorable weather can, however, affect the duration of your backup power. The Lunar System includes software to participate in Virtual Power Plant programs. You can get paid every time you contribute power from your Lunar System to the grid during emergency load reduction events. Terms and conditions are set by your installer or grid services provider. Based on your state and the approximated square footage of your home, we estimate your total annual energy consumption. We then take the average energy cost in your state to calculate your monthly energy bill. This is an estimate that can be adjusted. To suggest your solar system size, we generate a total annual production (based on the average solar irradiance of your state) equal to our estimated total annual consumption of your home. If you manually adjust your solar size to a larger option, we adjust your total annual consumption accordingly, to maintain 100% sizing. If you decrease your solar size, we maintain the total annual consumption we estimated, and an undersized solar is used."
