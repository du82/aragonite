full_description = "Lunar Energy Privacy PolicyLast Updated: July 22, 2024Lunar Energy, Inc. and its affiliates (“Lunar,” “we,” “our,” and/or “us”) values the privacy of individuals who use our website (https://www.lunarenergy.com (our “Site”)), customer mobile application (the “Lunar Energy App”), installer application (the “Installer App”), home battery system and associated hardware (the “Lunar Home Battery System”), and related services, such as through participation in a grid services program operated by Lunar (collectively, our “Services”). This privacy policy (the “Privacy Policy”) explains how we collect, use, and share personal information from or about the users of our Services (“you” or your”). By using our Services, you agree to the collection, use, and disclosure of your personal information as described in this Privacy Policy. Beyond the Privacy Policy, your use of our Site is also subject to our Terms of Service.INFORMATION WE COLLECTWe may collect a variety of personal information from or about the devices you use to access the Services from various sources, as described below.A. Information You Provide to UsAccount and Profile Information. When you sign up for an account, register to use our applications, or sign up for notifications or updates, we ask you for your name, email address, postal address, and tariff details. After you create an account, you may also be asked to update your profile, and provide us with your address and information related to your utility provider, such as the name of your utility provider, your energy tariff, and other relevant information about your energy usage.Communications. If you contact us directly, we may receive personal information about you. For example, if you contact us through a form on our Services, we will receive any information you provide on the form such as your name, email address, country, zip code, solar array size and/or monthly electricity bill, and the contents of your message. When you communicate with us online, third party vendors may receive and store these communications on our behalf. When we send you emails, we may use embedded pixels or other technologies to track information about your receipt and interaction with our emails, such as whether and when you open them, whether you access any links included in our emails, how long you read our emails, whether you forward our emails and to whom, your Location Information (described below), and your Device Information (described below), to learn how to deliver a better customer experience and improve our product offerings through our website.Careers. If you decide to apply for a job with us, you may submit your contact information and your resume online. We will collect the personal information you choose to provide us as part of your job application, such as your contact information, education, and employment experience. If you apply for a job with us through a third-party platform (such as LinkedIn) or job board, we will collect the personal information you make available to us through such third-party platform or job board.B. Information We Collect When You Use Our SiteLocation Information. When you use our Site, we may infer your general location information (for example, your IP address may indicate your general geographic region). If you have the Lunar Home Battery System, we also receive the location of the home where it is installed. We use this location information to enable our optimized battery control and to generate predictions about your household energy behavior in connection with your use of the Services.Device Information. We receive information about the web browsers and devices you use to access our Services, including internet protocol (IP) address, web browser type, device model, battery information, operating system version, push notification tokens, device identifiers, and information on available device storage.Usage Information. To help us understand how you use our Services and to help us improve them, we automatically receive information about your interactions with our Services, like how you use our applications and how often, the pages or other content you view, the searches you conduct, and the dates and times of your visits.Information Automatically Collected from Your Lunar Home Battery System. If you have the Lunar Home Battery System, we automatically receive information related to your household energy consumption and solar energy generation, battery usage, and utility grid import and export. Depending on your hardware configuration, we may also receive energy consumption information related to specific circuits or electrical devices in your home.Information Automatically Collected from Lunar and Other Home Battery Systems for Grid Services Programs. By participating in a grid services program operated by Lunar, you authorize us to automatically receive and store information related to the operation of your home battery to facilitate your participation in the program. This includes information regarding your home battery’s installed location, energy consumption and charging, power rating, energy capacity, device identifiers, and other energy telemetry and battery configuration information.Information from Cookies and Other Tracking Technologies. We and third-party partners collect information using cookies, pixel tags, SDKs, or other tracking technologies. Our third-party partners, such as analytics partners, may use these technologies to collect information about your online activities over time and across different services. Cookies are small text files containing a string of alphanumeric characters. We may use both session cookies and persistent cookies. A session cookie disappears after you close your browser. A persistent cookie remains after you close your browser and may be used by your browser on subsequent visits to our Site. Below is an overview of the types of cookies we and third parties may use to collect personal information.Strictly necessary cookies. Some cookies are strictly necessary to make the Site available to you. We cannot provide you with the Site without this type of cookie.Functional cookies. These are used to recognize you when you return to the Site. This enables us to adapt our content for you, and remember your preferences (for example, your choice of language or region).Analytical or Performance cookies. We also use cookies for analytics purposes in order to operate, maintain and improve our Site. We may use our own analytics cookies or use third party analytics providers such as Google Analytics to collect and process certain analytics data on our behalf.Where required by applicable law, we obtain your consent to use cookies.Please review your web browser’s “Help” file to learn the proper way to modify your cookie settings, but note that modifying your cookie settings will not affect other tracking technologies we utilize. Please note that if you delete or choose not to accept cookies from our Site, you may not be able to utilize the features of our Site to its fullest potential.C. Information We Receive from Third PartiesInstallation Partners. If you receive a Lunar Home Battery System from one of our partners in connection with your use of the Services, we may receive information about you, such as your address, the location and photos of the installation, or information about your house related to the installation, from our installation partners. We use this information to validate proper installation and improve performance of our Services.Grid Services Program Partners. If you participate in a grid services program operated by Lunar and sign up through your battery installer or another third party, that party will send us information about you, your service address, your phone number, the battery installed in your home and its capabilities, your electric utility provider, and IDs related to your utility service and battery.Other Third Parties. We may receive additional personal information about you from third parties such as data or marketing partners and combine it with other personal information we have about you.HOW WE USE THE INFORMATION WE COLLECTWe use the personal information we collect:To provide, maintain, improve, and enhance our Services;To communicate with you, provide you with updates and other information relating to our Services, provide information that you request, respond to comments and questions, and otherwise provide support;To enable staff and installer training;For marketing and advertising purposes, such as developing and providing promotional and advertising materials that may be relevant, valuable, or otherwise of interest to you;To send you text messages and push notifications;To process job applications;To find and prevent fraud, and respond to trust and safety issues that may arise;To send instructions to operate or optimize your home battery system relating to our Services, such as solar energy optimization, time-of-use tariff optimization, and grid service or other energy management program operations;To validate delivery of grid service or other energy management programs to utilities, system operators, energy regulatory authorities, or other energy market entities;For compliance purposes, including recordkeeping requirements for our grid services programs, enforcing our Terms of Service, End User Agreement and other legal rights, or as may be required by applicable laws and regulations or requested by any judicial process or governmental agency; andFor other purposes for which we provide specific notice at the time the personal information is collected.HOW WE SHARE THE INFORMATION WE COLLECTWe do not share or otherwise disclose personal information we collect from you except as described below or otherwise disclosed to you at the time of the collection.Affiliates. We may share any personal information we receive with our affiliates for any of the purposes described in this Privacy P