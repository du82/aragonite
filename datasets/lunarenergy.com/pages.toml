["https://lunarenergy.com/blog/learn/how-much-lunar-system-cost"]
title = "The price depends on the all-in-cost of the Lunar System, solar panels, and installation."
description = "The final price provided by a Lunar Install Partner takes into account solar panels, the Lunar System and installation costs, which can vary widely depending on the unique needs of your home."
full_description = "Learn articlesWhat is the price of the Lunar System?5 min readByPost contentsExample H2Example H3Example H4Example H5Example H6Learn moreMost frequently asked questionsTried. Tested. True.Brains. Beauty. Both. Light up the peak hours of life with the Lunar SystemDesign your System There’s a lot of confusion about the pricing of solar battery systems, and we at Lunar wanted to explain not only what’s included in the price but also the incredible benefits that come with it.The final price, provided by a Lunar Install Partner, takes into account solar panels, the Lunar System and installation costs, which can vary widely depending on the unique needs of your home. So what’s included in the all-in cost for solar and a Lunar System?Lunar SystemThe Lunar System includes everything needed for your own personal power plant, except the solar panels. Learn more about the System here.Solar PanelsSolar panels are sized to match the annual energy consumption of your home. The Lunar System works with most residential solar panels, giving your installer the flexibility to select the right solution. Installation and other costsInstallation costs can vary because every home was built differently over time and across regions. A Lunar Install Partner will need to evaluate your home conditions and design for your needs. Permitting and interconnection costs are also taken into account when determining the final price.What is the full system price and payback?Take an average home in California with a 20 kWh Lunar System paired with 5 kW of solar. The total purchase price, including installation, is estimated to fall within the range of $20,000 to $30,000 after factoring in incentives.1If you decide to get the system with a loan or lease, you'll pay less on your payment than you would on your monthly utility bill right from the beginning, without any upfront investment. And if you decide to purchase the system outright, it will take around 7 years to reach the breakeven point.2If that’s not enough, by choosing the Lunar System you will have the opportunity to enroll in virtual power plant programs3, which means you can actually earn money from your System. You will also have peace of mind during a grid outage as the Lunar System can power your entire home indefinitely with solar. And you will be able to reduce your home’s carbon footprint. ‍Footnotes:The 30% residential federal investment tax credit (ITC) is available to any U.S. taxpayer who purchases a solar electric system. Energy storage paired with solar systems are considered qualified expenditures eligible for the tax credit. Always consult a tax professional to evaluate your specific situation. Number based on a typical household with 5 kWdc solar and 20 kWh Lunar System, under PG&E NEM3 rate. The exact payback depends on multiple factors like your energy consumption, utility tariff, system size, and whether you buy or lease your system. Some utility territories and tariffs may not result in savings for customers. We recommend working with our Lunar Installation partners to find out the right solution for your home. Where programs are available.Share this post Share on LinkedIn Share on Twitter Share on Facebook Post author"
