["https://lunarenergy.com/about"]
title = "About Lunar Energy: what we do and how we got here."
description = "Lunar was founded to power homes around the world with endless clean energy."
full_description = '''Our missionEndless energy,across the planetLearn more We’ve seen the effects of climate change across the globe, and we believe that we can change our future—starting right at home.Lunar was founded to power homes around the world with endless clean energy.Just as the moon gets its glow from the sun, Lunar takes the sun’s energy and converts it into consistent, convenient, cost-effective clean energy that we all can count on 24 hours a day, day after day.Lunar's storyHear from Lunar’s CEO Kunal and learn about the vision of Lunar. { "items": [ { "url": "https://vimeo.com/lunarenergy/lunarstoryceo?share=copy", "originalUrl": "https://vimeo.com/lunarenergy/lunarstoryceo?share=copy", "width": 940, "height": 529, "thumbnailUrl": "https://i.vimeocdn.com/video/1687288195-b925e15f94d1686ddba139fc02295f7c0d4347c19e4353a4a159b7a5a690e6dc-d_1280", "html": "<iframe class=\"embedly-embed\" src=\"//cdn.embedly.com/widgets/media.html?src=https%3A%2F%2Fplayer.vimeo.com%2Fvideo%2F838371740%3Fapp_id%3D122963&dntp=1&display_name=Vimeo&url=https%3A%2F%2Fvimeo.com%2F838371740&image=https%3A%2F%2Fi.vimeocdn.com%2Fvideo%2F1687288195-b925e15f94d1686ddba139fc02295f7c0d4347c19e4353a4a159b7a5a690e6dc-d_1280&key=96f1f04c5f4143bcb0f2e68c87d65feb&type=text%2Fhtml&schema=vimeo\" width=\"940\" height=\"529\" scrolling=\"no\" title=\"Vimeo embed\" frameborder=\"0\" allow=\"autoplay; fullscreen\" allowfullscreen=\"true\"></iframe>", "type": "video" } ], "group": "" }Our teamThe Lunar team is made up of savvy entrepreneurs as well as passionate technology and industry experts, bringing years of experience to a young company. Meet some of our team members.Kunal GirotraFounder & CEOKunal Girotra Linkedin profileFounder & CEOKunal is Founder and CEO of Lunar Energy. He has 20 years of experience as an engineer, technology leader and entrepreneur.He holds a Masters in Chemical Engineering from Stanford and began his career scaling hardware technologies from lab to production for both fortune 500 companies and startups in consumer electronics and cleantech. He joined Tesla Energy in 2015 where he held several leadership positions in product, deployment and operations and was head of Tesla Energy until March 2020.Kunal founded Lunar in August 2020 with a mission to power homes around the world with endless clean energy.Mark HolveckChief ArchitectMark Holveck Linkedin profileChief ArchitectMark leads the technical vision behind Lunar’s products. He has a long history of delivering electrification technologies and holding R&D leadership roles at several companies, including recent roles at Tesla and Lyft. Mark also co-founded Princeton Power Systems, developing the first AC-coupled solar battery microgrid still powering Alcatraz today. Outside work Mark loves to invent and build things and have fun with his family.Chris WrightSVP of Software Technology & ProductChris Wright Linkedin profileSVP of Software Technology & ProductChris leads Software Product development at Lunar, leading software engineering, product and R&D teams focused on the Gridshare software platform and Lunar's apps. Prior to Lunar, Chris co-founded Moixa where he led hardware and software development. Since 2010, Chris has been leading energy R&D projects, developing smart battery systems, sensors, software controls and platforms. He holds a Masters of Arts in Architecture from Cambridge University.Grace HsuVP of Legal & PeopleGrace Hsu Linkedin profileVP of Legal & PeopleGrace oversees the company’s legal and human resources departments and is Lunar's corporate secretary. Before joining Lunar Energy, Grace was in-house counsel at Clearway Energy Group and an associate at the law firm of Wilson Sonsini Goodrich and Rosati. Grace holds a BS in chemical engineering and an MS in environmental engineering from Stanford and a JD from Berkeley Law.Jeff BarnesVP of FinanceJeff Barnes Linkedin profileVP of FinanceJeff is responsible for finance and accounting at Lunar. Previously, he held roles in corporate development at Sunrun and finance at Proterra. Earlier in his career, Jeff worked in investment banking at Goldman Sachs and private equity investing at TPG Capital. Jeff holds an MBA, MS in environmental engineering, and BA in economics from Stanford University.Marissa MullerVP of Marketing & CommsMarissa Muller Linkedin profileVP of Marketing & CommsMarissa is focused on redefining the way we power our lives and engaging homeowners to make their home Lunar powered. Previously, she led marketing at Honor and product marketing at Tesla. Marissa started her career as a producer at CNN and Reuters where she learned the fundamental skill of telling great stories. She has an M.B.A. from IESE Business School and a B.A. in Journalism from U.C. Berkeley.Mark RohanVP of OperationsMark Rohan Linkedin profileVP of OperationsMark is responsible for the management of all programs and operations at Lunar with the goal of bringing reliable products in a rapid time to market. He brings over 12 years of experience launching numerous groundbreaking products into production. Outside of work, Mark is learning how to be a dad and enjoys hiking with his family.Ed GunnSr. Director, Commercial SalesEd Gunn Linkedin profileSr. Director, Commercial SalesEd is running the end to end "commercial engine" and bringing Lunar’s mission to life via business development, client management and delivery. Prior to Lunar, Ed held multiple commercial and operational roles at Moixa which he joined in 2016 coming from a venture capital background. He holds masters in Geography, Cambridge University with specialization in resource economics and geo-politics.Jesus PrietoSr. Director of Software EngineeringJesus Prieto Linkedin profileSr. Director of Software EngineeringJesús is a physicist that specialized in statistical and computational physics as part of his MSc before starting his professional career as a software developer. He has extensive experience in full-stack software development, functional programming, cloud technologies, IOT and the clean-tech, and after working for multiple international companies is currently leading the Software department at Lunar.Anu DameguntaDirector of Technical ProgramsAnu Damegunta Linkedin profileDirector of Technical ProgramsAnu leads Technical Programs at Lunar Energy.Prior to Lunar, Anu worked in the semiconductor industry engineering complex electro-mechanical products from concept to launch and beyond.Anu holds a BS in Electrical Engineering and a MS in Engineering Management from Santa Clara University.Anu strives to create a sustainable tomorrow by utilizing her engineering skills and at the same time is trying to raise her two sons to be kind hearted human beings.Ed FranklinDirector of People & UK General ManagerEd Franklin Linkedin profileDirector of People & UK General ManagerEd is running all aspects of Lunar Energy operations in the UK. Ed started his career as a commercial lawyer before switching to high growth ventures in 2007. Ed holds an MA in Classics and a MBA from Cambridge Judge Business School.Xu SheSr. Director of Electrical EngineeringXu She Linkedin profileSr. Director of Electrical EngineeringDr. Xu She leads the electrical engineering group at Lunar Energy. Previously he held engineering leadership roles at General Electric and Carrier Corporation. Xu is a recognized leader in power electronics and has made foundational contributions to several groundbreaking products. He was the recipient of several prestigious awards, including 2017 IEEE Andrew W. Smith Outstanding Achievement Award, 2018 GE Whitney Technical Achievement Award, and 2022 IEEE Rudolf Chope Research and Development Award.Sam WeversDirector of Software ProductSam Wevers Linkedin profileDirector of Software ProductSam leads the software product team at Lunar, focused on Lunar's Gridshare platform and apps.Prior to Lunar, he led the design and delivery of a world-first local flexibility market platform at Centrica. Sam started his career as a corporate lawyer in New Zealand, focusing on energy market regulation.Sam holds a Masters of Public Policy from Oxford University, and a Bachelor of Laws and Bachelor of Arts (Japanese) from Otago University.John LinfootHead of Energy Platform ProductJohn Linfoot Linkedin profileHead of Energy Platform ProductJohn heads up the product manager team, focussed on EVs, new technology and global deployment of virtual power plants.He has held a number of different roles at Moixa since joining in 2017, primarily focussed on R&D. Prior to joining Moixa, for 10 years he worked in geophysical sensing equipment R&D, focussing on data science and system engineering.John holds a Masters in Exploration Geophysics from Leeds University and a Bachelors in Geophysics from Edinburgh University.Ash MistryDirector of Test SystemsAsh Mistry Linkedin profileDirector of Test SystemsAsh is engaged in the development of test systems and infrastructure across Lunar for all applications. He has over twenty years experience in test engineering across automotive, energy, complex self-driving car ECUs(ADAS HW) and consumer products.Jason HaerDirector, Cell, Safety, Testing & ReliabilityJason Haer Linkedin profileDirector, Cell, Safety, Testing & ReliabilityAt Lunar, Jason is excited to build safe and reliable products. Jason has worked in the energy sector for 8+ years involved in both the testing and regulatory space. Jason spends his free time building unique projects with his 3D printer.Load moreWe’re hiringExplore global career opportunitiesView open positions'''
