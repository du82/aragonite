ase "route": route = component.long_name; break; case "locality": city = component.long_name; break; case "administrative_area_level_1": state = component.short_name; break; case "postal_code": zipCode = component.long_name; break; case "country": country = component.long_name; break; } } // Populate form fields using IDs const streetField = document.getElementById("street"); const cityField = document.getElementById("city"); const stateField = document.getElementById("state"); const zipcodeField = document.getElementById("zipcode"); const countryField = document.getElementById("country"); if (streetField) streetField.value = `${streetNumber } ${route }`.trim(); if (cityField) cityField.value = city; if (stateField) stateField.value = state; if (zipcodeField) zipcodeField.value = zipCode; if (countryField) countryField.value = country; }); }; // Load the Google Places API script window.addEventListener('load', function () { const script = document.createElement("script"); script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyDgQwK9IikV6SubEN0XyKTdC3gHB52CEk0&libraries=places&callback=initAutocomplete"; script.async = true; script.defer = true; document.head.appendChild(script); }); document.addEventListener('DOMContentLoaded', function() { // Initialize data layer if it doesn't exist window.dataLayer = window.dataLayer || []; // Get the form element var form = document.querySelector('#get-lunar-lead-form'); // Add submit event listener to the form form.addEventListener('submit', function(event) { // Get the email input element var emailInput = form.querySelector('input[type="email"]'); if (emailInput) { var userEmail = emailInput.value; // Save the email to session storage sessionStorage.setItem('userEmail', userEmail); // Push email to data layer window.dataLayer.push({ 'event': 'form_submission', 'user_email': userEmail }); } }); }); Thanks for reaching out.We will be in touch.Oops! Something went wrong while submitting the form.Discover the most brilliant system under the sun, from Lunar.Take control of your home's energy while watching your bills go down, down, down. With the simple and intuitive Lunar App, you can rest assured your system will keep your home ready – regardless of what the weather blows your way. Enjoy powerful performance with award-winning design today.Our industrial and software design was recognized by the international iF Design Award jury.Get Lunar Follow us Instagram LinkedInYouTubeFacebook© 2024 Lunar Energy. All rights reserved.Privacy PolicyTerms of UseCookies Settings'''
