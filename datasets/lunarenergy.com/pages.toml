full_description = '''At Lunar, you have the power to be youIn a world where you can be anything, we just want you to be you. Join us and change the way we power our planet.Join usPower to be extraordinaryWe take our mission seriously and act with a sense of urgency—moving fast and driving action. We empower everyone to solve problems differently, make bold decisions and build for lasting change. Meet Kielan Learn what motivates Kielan to come to work every day and what he thinks is a secret sauce of Lunar's success. Watch video { "items": [ { "url": "https://vimeo.com/873997463", "originalUrl": "https://vimeo.com/873997463", "width": 1920, "height": 1080, "thumbnailUrl": "https://i.vimeocdn.com/video/1737764289-b06bed1a89e0d8983fb8ca3867bd061908e3823332d418440c87e9c048643abc-d_1280", "html": "<iframe class=\"embedly-embed\" src=\"//cdn.embedly.com/widgets/media.html?src=https%3A%2F%2Fplayer.vimeo.com%2Fvideo%2F873997463%3Fapp_id%3D122963&dntp=1&display_name=Vimeo&url=https%3A%2F%2Fvimeo.com%2F873997463&image=https%3A%2F%2Fi.vimeocdn.com%2Fvideo%2F1737764289-b06bed1a89e0d8983fb8ca3867bd061908e3823332d418440c87e9c048643abc-d_1280&key=c4e54deccf4d4ec997a64902e9a30300&type=text%2Fhtml&schema=vimeo\" width=\"1920\" height=\"1080\" scrolling=\"no\" title=\"Vimeo embed\" frameborder=\"0\" allow=\"autoplay; fullscreen; encrypted-media; picture-in-picture;\" allowfullscreen=\"true\"></iframe>", "type": "video" } ], "group": "meet" }Meet CharlotteHear from Charlotte about the people behind Lunar products and the impact she wants to make as a female developer. Watch video { "items": [ { "url": "https://vimeo.com/872486197", "originalUrl": "https://vimeo.com/872486197", "width": 1920, "height": 1080, "thumbnailUrl": "https://i.vimeocdn.com/video/1735562073-fc82075a48d4d61c6e9bbb8370c506080b53d7fd0d8f5eedf4015edc81c59b8e-d_1280", "html": "<iframe class=\"embedly-embed\" src=\"//cdn.embedly.com/widgets/media.html?src=https%3A%2F%2Fplayer.vimeo.com%2Fvideo%2F872486197%3Fapp_id%3D122963&dntp=1&display_name=Vimeo&url=https%3A%2F%2Fvimeo.com%2F872486197&image=https%3A%2F%2Fi.vimeocdn.com%2Fvideo%2F1735562073-fc82075a48d4d61c6e9bbb8370c506080b53d7fd0d8f5eedf4015edc81c59b8e-d_1280&key=c4e54deccf4d4ec997a64902e9a30300&type=text%2Fhtml&schema=vimeo\" width=\"1920\" height=\"1080\" scrolling=\"no\" title=\"Vimeo embed\" frameborder=\"0\" allow=\"autoplay; fullscreen; encrypted-media; picture-in-picture;\" allowfullscreen=\"true\"></iframe>", "type": "video" } ], "group": "meet" }Meet Sam Hear from Sam about the benefits of working with an international team and what makes Lunar a great place to develop your career.Watch video { "items": [ { "url": "https://vimeo.com/768958367?share=copy", "originalUrl": "https://vimeo.com/768958367?share=copy", "width": 1920, "height": 1080, "thumbnailUrl": "https://i.vimeocdn.com/video/1543668930-a171ccf70f8b72b803eed8a1e722ef4065a9640bcb95c005fd572dd6d8fba1fe-d_1280", "html": "<iframe class=\"embedly-embed\" src=\"//cdn.embedly.com/widgets/media.html?src=https%3A%2F%2Fplayer.vimeo.com%2Fvideo%2F768958367%3Fapp_id%3D122963&dntp=1&display_name=Vimeo&url=https%3A%2F%2Fvimeo.com%2F768958367&image=https%3A%2F%2Fi.vimeocdn.com%2Fvideo%2F1543668930-a171ccf70f8b72b803eed8a1e722ef4065a9640bcb95c005fd572dd6d8fba1fe-d_1280&key=96f1f04c5f4143bcb0f2e68c87d65feb&type=text%2Fhtml&schema=vimeo\" width=\"1920\" height=\"1080\" scrolling=\"no\" title=\"Vimeo embed\" frameborder=\"0\" allow=\"autoplay; fullscreen; encrypted-media; picture-in-picture;\" allowfullscreen=\"true\"></iframe>", "type": "video" } ], "group": "meet" }Meet ShantiListen to Shanti explaining how Lunar's team approaches solving hard problems and how that motivates her in her role. Watch video { "items": [ { "url": "https://vimeo.com/lunarenergy/shanti?share=copy", "originalUrl": "https://vimeo.com/lunarenergy/shanti?share=copy", "width": 1920, "height": 1080, "thumbnailUrl": "https://i.vimeocdn.com/video/1492500026-4f5eb2d2d6a367574f38441ff31db38291ef0d49e1371c6e85e8f80947a767d0-d_1280", "html": "<iframe class=\"embedly-embed\" src=\"//cdn.embedly.com/widgets/media.html?src=https%3A%2F%2Fplayer.vimeo.com%2Fvideo%2F741705742%3Fapp_id%3D122963&dntp=1&display_name=Vimeo&url=https%3A%2F%2Fvimeo.com%2F741705742&image=https%3A%2F%2Fi.vimeocdn.com%2Fvideo%2F1492500026-4f5eb2d2d6a367574f38441ff31db38291ef0d49e1371c6e85e8f80947a767d0-d_1280&key=96f1f04c5f4143bcb0f2e68c87d65feb&type=text%2Fhtml&schema=vimeo\" width=\"1920\" height=\"1080\" scrolling=\"no\" title=\"Vimeo embed\" frameborder=\"0\" allow=\"autoplay; fullscreen; encrypted-media; picture-in-picture;\" allowfullscreen=\"true\"></iframe>", "type": "video" } ], "group": "meet" }Meet SiyiHear from Siyi how the collaborative environment at Lunar enables the best results. Watch video { "items": [ { "url": "https://vimeo.com/lunarenergy/siyi?share=copy", "originalUrl": "https://vimeo.com/lunarenergy/siyi?share=copy", "width": 1920, "height": 1080, "thumbnailUrl": "https://i.vimeocdn.com/video/1491531400-19eb89fac0413ff2546f8bb40f2a89a53c4eda8b7959bb19e1997e64fa69d235-d_1280", "html": "<iframe class=\"embedly-embed\" src=\"//cdn.embedly.com/widgets/media.html?src=https%3A%2F%2Fplayer.vimeo.com%2Fvideo%2F741053562%3Fapp_id%3D122963&dntp=1&display_name=Vimeo&url=https%3A%2F%2Fvimeo.com%2F741053562&image=https%3A%2F%2Fi.vimeocdn.com%2Fvideo%2F1491531400-19eb89fac0413ff2546f8bb40f2a89a53c4eda8b7959bb19e1997e64fa69d235-d_1280&key=96f1f04c5f4143bcb0f2e68c87d65feb&type=text%2Fhtml&schema=vimeo\" width=\"1920\" height=\"1080\" scrolling=\"no\" title=\"Vimeo embed\" frameborder=\"0\" allow=\"autoplay; fullscreen; encrypted-media; picture-in-picture;\" allowfullscreen=\"true\"></iframe>", "type": "video" } ], "group": "meet" }Power to be valuedWe know that for all of us to do our best work we need to rally behind shared values. This is what we’re all committed to at Lunar.We’re a united teamWe choose to trustWe take the leadWe’re curious and courageousWe succeed, when our customers succeedPower to be supportedWe’re creating a remarkable employee experience beyond offering competitive salary, benefits and equity in a growing company.Love where you workLunar is headquartered in the heart of Silicon Valley, CA, and we also have UK offices in London and Manchester. You can work from any of our offices or remotely for specific roles.Enjoy time offWe work hard and at a fast pace, but we believe in a healthy work/life balance. We encourage employees to take time off for their wellbeing in order to return refreshed.Work with the bestOur team has a proven track record of building energy products, and we know that a great idea can come from anywhere. Lunar’s collaborative and inclusive culture allows for everyone to contribute, create and make an impact.Make a global impactLunar is deploying its products to homes in the US, UK and Japan with plans to expand further. Our mission—to transition homes to 100% clean energy—is critical and our impact needs to be global to make a meaningful difference.Detailed list of location-specific benefits available upon application.Current openingsExplore global career opportunitiesAll TeamsThank you! Your submission has been received!Oops! Something went wrong while submitting the form.Text LinkThis is some text inside of a div block.Department'''
