["https://luvit.io"]
title = "Luvit.io"
full_description = "If you don’t like callbacks and event emitters, use coroutines and write blocking style code without actually blocking your event loop! The various projects in the luvit ecosystem can be mixed and matched to build the ideal runtime for your application. The luvit CLI tool can be used as a scripting platform just like node. This can be used to run lua scripts as standalone servers, clients, or other tools. For example, @creationix has made a set of libraries that use coroutines instead of callbacks for async I/O and published these to lit. This very site is being served by weblit and its source can be found at https://github.com/luvit/luvit.io Luvit is licensed under the Apache 2.0 License to The Luvit Authors. This was done to make the project as accessible as possible to users and contributors."
