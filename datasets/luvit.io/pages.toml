["https://luvit.io/install.html"]
title = "Installing Luvit - Luvit.io"
full_description = "If you’re on Linux, FreeBSD, or OSX, run the following script to download luvi and build lit and luvit for your platform: If you’re on windows, run the sister command in your cmd.exe command prompt (requires Powershell >= 3.0). Put both lit and luvit in your path somewhere. We recommend /usr/local/bin or $HOME/bin if that’s in your path. To test your install run luvit to enter the repl. This has readline-like capabilities implemented in lua and has tab completion of expressions for interactive exploring the runtime. While the lit method is quick and easy, we’re working on an even easier with pre-bundled luvit and lit binaries for popular platforms. If you system is not one of the platforms for which we publish pre-built luvi binaries, you can still build lit from a manually compiled luvi. This requires a C compiler such as gcc, clang, or Visual Studio. You also need to have cmake installed and in your path. The final binary will be at build/luvi on most platforms (cmake decides this path). Once you have this, build lit manually using this luvi. Note: if you cloned lit source in to a directory named lit, you should to cd path/to/lit and then path/to/luvi . -- make . This will create a lit executable in your current directory. Then you can continue to build luvit normally with:"
