full_description = "Programme 2019 Chairs Anne Breitbarth (morning) Veronique Hoste (afternoon) Welcome 9:00 – 9:10 Veronique Hoste (FLW research director) Keynote lecture 9:10 – 10:10 Rens Bod (professor of Digital Humanities and History of Humanities, UVA): “Who’s Afraid of Patterns? The Pearls and Perils of Digital Tools” Meeting moment 10:10 – 10:30 Coffee break Focus on digital humanities (1) 10:30 – 11:45 Four digital humanities projects in the picture Joke Meheus (Department of Philosophy and Moral Sciences): “Logic-based knowledge representations in the digital humanities: errors and inconsistencies” Miriam Bouzouita (Department of Linguistics): “Tracking Language Variation and Change Using Apps: The Case of Dialectos del español, the Spanish Dialects App” Jeroen Deploige, Eric Vanhaute, Christophe Verbruggen en Sven Vrielinck (Department of History): “Bruges, Ghent and beyond. Spatial history, prospects and limitations of linked data” Gunther Martens, Julie Birkholz, e.a. (Department of Literary Studies): “Digital Humanities in literature. An overview by the department of Literary Studies” Break-out sessions Research data management 11:45 – 12:15 Frederic Lamsens (FLW IT-staff) en Lien Vanmarsnille (FLW library) (presentation) Research integrity 11:45 – 12:15 Veerle Provoost (Department of Philosophy and Moral Sciences): “Research integrity and our faculty’s ethics committee” Meeting moment 12:15 – 13:30 Lunch Focus on digital humanities (2) 13:30 – 14:00 Jeroen Bourgognon (De Krook): “Societal impact creation by Ghent University researchers in De Krook” Christophe Verbruggen, Sally Chambers (GhentCDH): “Faculty Services by the Ghent Centre for Digital Humanities” Focus on digital humanities (3) 14:00 – 15:15 Four digital humanities projects in the picture Lieve Macken (Department of Translation, Interpreting and Communication): “How product and process data complement each other in translation studies” (presentation) Birger Stichelbaut, Wouter Gheyle (Department of Archaeology): “The application of historical aerial photographs for modern conflict archaeology” Phaedra Claeys (Department of Languages and Cultures): “La Russie illustrée. Minimum input, maximum output: data management and (social) valorization thanks to Digital Humanities” Marc Leman (Department of Art History, Musicology & Theatre Studies): “The Art & Science Interaction Lab (ASIL) at the KROOK. A perspective on Digital Humanities” Research in the picture Poster/demo session 15:15 – 16:45 Overview of the digital humanities research at the faculty on the basis of scientific posters and demos, which were explained by the authors Visit to IPEM 15:15 – 16:45 Musicology-IPEM presents the following demonstrations of ongoing research in its laboratories in the Krook: Demo 1. Piano performance demonstrating the use of motion capture (using infra red camera’s) coupled to 3D-audio effect rendering system (using a 64 loudspeakers). The goal is to explore musical expression with innovative interactive multimedia that could be deployed in future concert halls. Demo 2. Hocket singing, demonstrating an experiment with focus on data-analysis. The goal is to measure the quality of an interaction, for better understanding the effect of musics on social empowerment. Demo 3. EEG-response on music, using a reinforcement learning system for music generation. The goal is to research brain-based biofeedback with music for medical applications. Demo 4. Looking at the Mystic Lamb with eye-tracking and responses on an fNIRS system. The goal is measure empathic responses due to interaction with the painting. Meeting moment 16:45 – 17:30 Reception"
