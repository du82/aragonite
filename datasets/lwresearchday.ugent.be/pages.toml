["https://www.lwresearchday.ugent.be/research-day-2022"]
title = "Research Day 2022 – LW Research Day"
full_description = "Research Day 2022 The third LW Research Day took place on Thursday April 28, 2022, in the Faculty Library. Central theme was ‘research valorisation’. The Faculty of Arts and Philosophy wants to encourage the social and economic valorisation of research. Research valorisation is the process of transferring and deploying scholarly knowledge and expertise outside the scientific field. During our LW Research Day we organize several lectures and information sessions, and we present various initiatives of the faculty. Posters Presentations Photos Op donderdag 28 april 2022 vond in de faculteitsbibliotheek de derde LW Research Day plaats. Het centrale thema was ‘onderzoeksvalorisatie’. Het onderzoeksbeleid van de faculteit Letteren en Wijsbegeerte bestaat onder meer in het stimuleren van maatschappelijke en economische valorisatie van onderzoek. Onderzoeksvalorisatie is het proces van het overbrengen en inzetten van wetenschappelijke kennis en expertise buiten het wetenschappelijke veld. Tijdens onze onderzoeksdag organiseren we diverse lezingen en infosessies en stellen we verschillende initiatieven van de faculteit voor. Posters Presentaties Foto’s"
