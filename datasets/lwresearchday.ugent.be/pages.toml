["https://lwresearchday.ugent.be"]
title = "LW Research Day"
full_description = "LW Research Day 2024 – From Source to Understanding The 4th LW Research Day took place on Wednesday 27 November 2024, in the Ghent University Museum (GUM). Central theme was ‘From Source to Understanding’. What is the role of interpretation in our journey from studying source material to scientific understanding? Indeed, that journey can never be devoid of interpretation, which, in many cases, serves as the quintessential bridge between source material and understanding, whether it pertains to a historical study based on ego documents, the archaeological perspective on the material culture of the past or the anthropological view of human behaviour. Not infrequently, interpretation itself becomes the object of research. For instance, translation scholars examine translation choices that result from interpretations. Literary and art scholars investigate works that themselves provide an interpretation of the world in which they originate and the world they create. Similarly, language itself reflects a particular understanding of the world in a historical and sociological sense, which linguists further explore. In times of digital humanities, the interpretation of (big) data by AI becomes not only conceivable but even the norm. What do interpretation and hermeneutics signify for our fields today? What constitutes a successful or legitimate interpretation, and what are the pitfalls of interpretation? Posters Lectures and projects Photos Op woensdag 27 november 2024 vond in het Gents Universiteitsmuseum (GUM) de 4de LW Research Day plaats. Het centrale thema was ‘Van Bron naar Begrip’. Wat is de rol van interpretatie in het traject dat we afleggen van bronnenstudie naar wetenschappelijke inzichten? Die weg kan immers nooit zonder interpretatie en in veel gevallen vormt interpretatie dé brug bij uitstek van bron naar begrip, of het nu gaat om een geschiedkundige studie gebaseerd op egodocumenten, de archeologische blik op de materiële cultuur van het verleden of de antropologische kijk op menselijk gedrag. Niet zelden wordt interpretatie zelf het object van onderzoek. Zo buigen vertaalwetenschappers zich over vertaalkeuzes die het product zijn van interpretaties. Letterkundigen en kunstwetenschappers onderzoeken werken die zelf een interpretatie geven aan de wereld waarin ze ontstaan en aan de wereld die ze zelf tot stand brengen. En zo reflecteert ook de taal zelf in historische en sociologische zin een bepaald begrip van de wereld, dat taalkundigen verder onderzoeken. In tijden van digital humanities wordt de interpretatie van (big) data door AI niet alleen denkbaar maar zelfs de norm. Wat betekenen interpretatie en hermeneutiek vandaag voor onze vakgebieden? Wat geldt er als geslaagde of legitieme interpretatie en wat zijn de valkuilen van interpretatie? Posters Lezingen en projecten Foto’s"
