title = "MacInTouch – timely, accurate info since 1985"
description = "timely, accurate info since 1985"
full_description = "Posted on Sat. Mar. 1, 2025 20:30 ESTSat. Mar. 1, 2025 20:35 ESTMicrosoft cloud meltdown Microsoft’s cloud infrastructure had a meltdown today, breaking services for many customers. Microsoft Outlook, 365 ‘global outage’ affects millions Microsoft Outlook, 365 and other services crashed Saturday, affecting tens of thousands in the United States and millions globally before services were restored in less than an hour. … Outages reported for Outlook cited a server connection as affecting 61% causing most of the issues with Outlook, followed by website problems, 20%, and app issues, 19%. Microsoft 365 outage reports cited login issues, 43%, followed by problems with Outlook, 36%, and Microsoft Exchange, 21%. Microsoft Teams and the Microsoft Store also were affected by the outages… Posted on Fri. Feb. 28, 2025 11:49 ESTSat. Mar. 1, 2025 20:38 ESTFinder follies Although the Mac’s Finder app has certain advantages over file managers on other platforms, it is also consistently buggy and, year after year after year, demonstrates a cynical lack of respect, support, and development on Apple’s part for such a critical component. As just one example, the Finder is completely dysfunctional when reporting critical drive free space information, as Howard Oakley illustrates. Friday Magic: How to make disk space unpurgeable … Although I much preferred the Finder’s figure of nearly 400 GB of “available” space, I realised that could only come at the cost of purging all that 228 GB of “purgeable” space. As that seemed to include many of my files, I thought it was time to work this week’s magic trick. I therefore restarted the Mac, and all of a sudden purgeable space had vanished, leaving me with only about 165 GB of free space after all. To remind you of what I found nearly two years ago, after updating to macOS 13.3.1, the Finder found 83.71 GB “purgeable”, and my SSD had then grown to 1.08 TB in size. That’s two major versions of macOS and almost two years apart, and the Finder still can’t come up with correct figures. For more examples of Finder problems see: Finder & Folder Search Issues on macOS Sequoia 15.3.1 The Finder column width bug is over 11 years old Finder Sidebar Icons are Missing, How to Restore Them?"
