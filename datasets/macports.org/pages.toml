The MacPorts Project is an open-source community initiative to design an easy-to-use    system for compiling, installing, and upgrading either command-line, X11 or Aqua based open-source software on the Mac    OS X operating system."""
full_description = "MacPorts v1.4.0 released April 5, 2007 The MacPorts project is pleased to announce the release of MacPorts v1.4.0. Change log is at MacPorts 1.4.0 ChangeLog. Downloads are available at MacPorts 1.4.0 downloads. Thanks to all project members who contributed to this release, and especially to Juan Manuel Palacios, who served as release manager. Bugs may be filed at the MacPorts bug reports page. We plan to release a v1.4.1 within weeks with some ongoing enhancements. Please note that our official plan is to build disk images only for 1.x.0 releases, and let subsequent point releases selfupdate from there. Note also that if you have a previous release of MacPorts installed, the easiest path to MacPorts 1.4.0 is simply “sudo port selfupdate”."
