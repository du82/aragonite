title = "MacPorts applies for Google Summer of Code"
description = """
The MacPorts Project is an open-source community initiative to design an easy-to-use    system for compiling, installing, and upgrading either command-line, X11 or Aqua based open-source software on the Mac    OS X operating system."""
full_description = "MacPorts applies for Google Summer of Code March 12, 2007 MacPorts today filed an application with Google for Summer of Code 2007. Summer of Code is a Google-sponsored program under which students work over the summer on an open source project, gaining valuable experience while also contributing important effort to open source projects. We’ll know by March 14 whether our application has been accepted. We’ve set up a tracking page at SummerOfCode with more information and a list of potential tasks. Please join us in sending good vibes to google to get our application approved so that we can help students learn while enhancing MacPorts."
