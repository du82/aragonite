["https://macports.org/news"]
title = "News"
description = """
The MacPorts Project is an open-source community initiative to design an easy-to-use    system for compiling, installing, and upgrading either command-line, X11 or Aqua based open-source software on the Mac    OS X operating system."""
full_description = "News Security issue in MacPorts 2.10.4 and older December 28, 2024 MacPorts versions 2.10.4 and older contain a vulnerability that can allow a compromised rsync mirror to add Portfiles to the synced ports tree, thus allowing arbitrary code to be executed when those Portfiles are parsed. (Note that we currently have no reason to believe that any of our mirrors have been compromised.) The fix for this issue is included in versions 2.10.5 and later. We recommend that all users running an affected version upgrade as soon as possible. Full details are available here. Thanks to Simon Scannell of Google’s Cloud Vulnerability Research team for discovering and analysing the issue. The MacPorts Port Managers MacPorts 2.10.5 now available November 23, 2024 The MacPorts Project is pleased to announce the release of version 2.10.5. This is a bugfix release with small changes only. See the ChangeLog for the list of changes. If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfupdate For new installs, package installers are available for the most current macOS 15 Sequoia and all older releases back to Mac OS X 10.5 Leopard. The source is also available as tarballs compressed with gzip or bzip2, or from the git tag. Detached PGP signatures for the disk images, package installers and source tarballs have been made by Joshua Root, and the git tag has been signed with the same key. The public key is available on the keyservers and the MacPorts wiki, the fingerprint being: 0x01FF673FB4AAE6CD: C403 7936 5723 6DCF 2E58 0C02 01FF 673F B4AA E6CD The MacPorts Port Managers MacPorts 2.10.4 now available November 1, 2024 The MacPorts Project is pleased to announce the release of version 2.10.4. This is a bugfix release with small changes only. See the ChangeLog for the list of changes. If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfupdate For new installs, package installers are available for the most current macOS 15 Sequoia and all older releases back to Mac OS X 10.5 Leopard. The source is also available as tarballs compressed with gzip or bzip2, or from the git tag. Detached PGP signatures for the disk images, package installers and source tarballs have been made by Joshua Root, and the git tag has been signed with the same key. The public key is available on the keyservers and the MacPorts wiki, the fingerprint being: 0x01FF673FB4AAE6CD: C403 7936 5723 6DCF 2E58 0C02 01FF 673F B4AA E6CD The MacPorts Port Managers MacPorts 2.10.3 now available October 31, 2024 The MacPorts Project is pleased to announce the release of version 2.10.3. This is a bugfix release with small changes only. See the ChangeLog for the list of changes. If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfupdate For new installs, package installers are available for the most current macOS 15 Sequoia and all older releases back to Mac OS X 10.5 Leopard. The source is also available as tarballs compressed with gzip or bzip2, or from the git tag. Detached PGP signatures for the disk images, package installers and source tarballs have been made by Joshua Root, and the git tag has been signed with the same key. The public key is available on the keyservers and the MacPorts wiki, the fingerprint being: 0x01FF673FB4AAE6CD: C403 7936 5723 6DCF 2E58 0C02 01FF 673F B4AA E6CD The MacPorts Port Managers MacPorts 2.10.2 now available October 1, 2024 The MacPorts Project is pleased to announce the release of version 2.10.2. This is a bugfix release with small changes only. See the ChangeLog for the list of changes. If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfupdate For new installs, package installers are available for the most current macOS 15 Sequoia and all older releases back to Mac OS X 10.5 Leopard. The source is also available as tarballs compressed with gzip or bzip2, or from the git tag. Detached PGP signatures for the disk images, package installers and source tarballs have been made by Joshua Root, and the git tag has been signed with the same key. The public key is available on the keyservers and the MacPorts wiki, the fingerprint being: 0x01FF673FB4AAE6CD: C403 7936 5723 6DCF 2E58 0C02 01FF 673F B4AA E6CD The MacPorts Port Managers MacPorts 2.10.1 now available August 16, 2024 The MacPorts Project is pleased to announce the release of version 2.10.1. This is a bugfix release with small changes only. See the ChangeLog for the list of changes. If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfupdate For new installs, package installers are available for the most current macOS 14 Sonoma and all older releases back to Mac OS X 10.5 Leopard. The source is also available as tarballs compressed with gzip or bzip2, or from the git tag. Detached PGP signatures for the disk images, package installers and source tarballs have been made by Joshua Root, and the git tag has been signed with the same key. The public key is available on the keyservers and the MacPorts wiki, the fingerprint being: 0x01FF673FB4AAE6CD: C403 7936 5723 6DCF 2E58 0C02 01FF 673F B4AA E6CD The MacPorts Port Managers MacPorts 2.10.0 now available August 7, 2024 The MacPorts Project is happy to announce that the 2.10.0 version has now been released. It is available via the usual methods: selfupdate if you already have MacPorts installed package installers for macOS 14 Sonoma and all older releases back to Mac OS X 10.5 Leopard (universal arm64/x86_64 for macOS 11+, i386/x86_64 for 10.6, i386/ppc for 10.5, and the rest x86_64) source tarballs, both .tar.bz2 and .tar.gz git tag The list of what’s new in 2.10.0 can be found in the ChangeLog. A big thanks to the developers for their hard work with all of the various features and bug fixes in 2.10.0, and to all those who helped out by reporting bugs or testing. Detached PGP signatures for the pkg/dmgs and source tarballs have been made by Joshua Root, whose public key is available on the keyservers and the MacPorts wiki. Key ID: 0x01FF673FB4AAE6CD Fingerprint: C403 7936 5723 6DCF 2E58 0C02 01FF 673F B4AA E6CD The MacPorts Port Managers MacPorts 2.10.0 release candidate 1 available August 2, 2024 Source code and pkgs for MacPorts 2.10.0-rc1 are now available. Testing of either of these install methods is helpful. Be prepared to encounter bugs. As always, having a recent backup would be wise. Please report any bugs that you find (after first searching Trac, of course!) If no show-stopping bugs are found in the next few days, this will become the 2.10.0 release. There are a large number of changes in this release. See the ChangeLog for a list of most of the major ones. You may like to focus your testing on the new features in that list, as well as your normal usage. Changes since beta2 are: Version number only. MacPorts 2.10.0 beta2 available July 26, 2024 Source code and pkgs for MacPorts 2.10.0-beta2 are now available. Testing of either of these install methods is helpful. Be prepared to encounter bugs. As always, having a recent backup would be wise. Please report any bugs that you find (after first searching Trac, of course!) There are a large number of changes in this release. See the ChangeLog for a list of most of the major ones. You may like to focus your testing on the new features in that list, as well as your normal usage. Notable changes since beta1 are: port migrate syncs the ports tree before reinstalling ports. Various fixes and improvements to error handling and reporting in the snapshot and restore code. MacPorts, Open Collective, and GitHub Sponsors June 17, 2024 Many people have asked us if there is a way to contribute to MacPorts financially. We are happy to announce that we are now able to accept contributions via the Open Collective platform, with The Open Source Collective as our fiscal host. Click here to get started. We also have a GitHub Sponsors profile, which may be more convenient for some people to use. Payments made through GitHub Sponsors also go to our Open Collective account. Open Collective has extensive documentation explaining how the system works. The Contributors FAQ is a good place to start. The collected funds will be used to cover expenses related to the operation of the MacPorts project. Expenses will be approved at the discretion of the PortMgr team. Transactions will be publicly visible on the Open Collective site (with personal information redacted). We expect that initial expenses will be for hosting costs, with new BuildBot hardware being a more ambitious goal. Please feel free to suggest anything else that you think would be useful! The MacPorts Port Managers MacPorts 2.9.3 now available April 4, 2024 The MacPorts Project is pleased to announce the release of version 2.9.3. This is a bugfix release with small changes only. See the ChangeLog for the list of changes. If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfupdate For new installs, package installers are available for the most current macOS 14 Sonoma and all older releases back to Mac OS X 10.4 Tiger. The source is also available as tarballs compressed with gzip or bzip2, or from the git tag. Detached PGP signatures for the disk images, package installers and source tarballs have been made by Joshua Root, and the git tag has been signed with the same key. The public key is available on the keyservers and the MacPorts wiki, the fingerprint being: 0x01FF673FB4AAE6CD: C403 7936 5723 6DCF 2E58 0C02 01FF 673F B4AA E6CD The MacPorts Port Managers MacPorts 2.9.2 now available April 2, 2024 The MacPorts Project is pleased to announce the release of version 2.9.2. This is a bugfix release with small changes only. See the ChangeLog for the list of changes. If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfu