["https://macports.org/post/macports-171-now-available"]
title = "MacPorts 1.7.1 now available"
description = """
The MacPorts Project is an open-source community initiative to design an easy-to-use    system for compiling, installing, and upgrading either command-line, X11 or Aqua based open-source software on the Mac    OS X operating system."""
full_description = "MacPorts 1.7.1 now available March 29, 2009 The MacPorts Project is proud to announce the release of version 1.7.1. This is a bugfix release with small changes only. Notable changes for end users: port upgrade will no longer act on ports which are not installed Notable changes for port authors: port lint no longer requires master_sites if the port does not have any distfiles ${applications_dir} and ${frameworks_dir} are automatically created in the destroot configure.compiler supports apple-gcc-4.2 New use_7z yes port option to allow distfiles in 7z format If you already have MacPorts installed, the preferred method for updating is to run: sudo port selfupdate For new installs, there are also package installers in disk images available for 10.3, 10.4, and 10.5 (with the latter two being universal builds). The source is available as tarballs compressed with gzip or bzip2 in the same directory and it is also available from the subversion tag. You can also read the email announcement."
