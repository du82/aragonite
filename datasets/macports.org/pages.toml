["https://macports.org/post/CVE-2024-11681"]
title = "Security issue in MacPorts 2.10.4 and older"
description = """
The MacPorts Project is an open-source community initiative to design an easy-to-use    system for compiling, installing, and upgrading either command-line, X11 or Aqua based open-source software on the Mac    OS X operating system."""
full_description = "Security issue in MacPorts 2.10.4 and older December 28, 2024 MacPorts versions 2.10.4 and older contain a vulnerability that can allow a compromised rsync mirror to add Portfiles to the synced ports tree, thus allowing arbitrary code to be executed when those Portfiles are parsed. (Note that we currently have no reason to believe that any of our mirrors have been compromised.) The fix for this issue is included in versions 2.10.5 and later. We recommend that all users running an affected version upgrade as soon as possible. Full details are available here. Thanks to Simon Scannell of Google’s Cloud Vulnerability Research team for discovering and analysing the issue. The MacPorts Port Managers"
author = "Jim Mock (mij@macports.org)"
year_published = 2025
