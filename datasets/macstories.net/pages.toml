["https://www.macstories.net/author/johnvoorhees/page/2"]
title = "John Voorhees | MacStories - Part 2"
description = "John is MacStories' Managing Editor, has been writing about Apple and apps since joining the team in 2015, and today, runs the site alongside Federico. John also co-hosts four MacStories podcasts: AppStories, which covers the world of apps, MacStories Unwind, which explores the fun differences between American and Italian culture and recommends media to listeners, Ruminate, a show about the weird web and unusual snacks, and NPC: Next Portable Console, a show about the games we take with us."
full_description = "The Latest from Comfort Zone, MacStories Unwind, and Magic Rays of Light By John Voorhees Enjoy the latest episodes from MacStories’ family of podcasts: Comfort Zone Matt has a lot of feelings about podcast players, Niléane has gone on an adventure where the sounds are just warmer and somehow better but she can’t quite explain why, and Chris tries to make an all-out war break out. MacStories Unwind This week on Unwind, Federico and I offer a peek behind what it’s like to wait for an Apple press release to drop, Federico critiques an Italian’s recommendations of what to buy at Costco and shares a videogame pick, and I have a new movie for listeners. Magic Rays of Light Sigmund and Devon check in after the Netflix “bug” that briefly enabled integration with TV app. Then, they highlight the return of Surface, share their thoughts on the Apple TV app coming to Android, and discuss the new iPhone 16e. Read more Recipes Are Coming to Apple’s News+ Service By John Voorhees Source: Apple. Apple continues to layer new features into its News+ service. With iOS and iPadOS 18.4, the company says the service will add recipes from well-known publishers including Allrecipes, Bon Appétit, Food & Wine, Good Food, and Serious Eats: With the new Food feature, users will be able to find stories curated by Apple News editors, as well as browse, search, and filter tens of thousands of recipes in the Recipe Catalog — with new recipes added every day. The beautifully designed recipe format makes it easy to review ingredients and directions, and a new cook mode takes step-by-step instructions to the full screen. Users can also save their favorite recipes for later and access them offline. Source: Apple. Interestingly, Apple’s press release makes no mention of the Mac. I’d rather use my iPhone or iPad in the kitchen, but a Mac is a great place to browse recipes, so hopefully News+ Food will be brought to the Mac eventually. Vision Pro to Gain Apple Intelligence, Spatial Gallery App, and Companion iPhone App By John Voorhees Source: Apple. Apple announced today that visionOS 2.4 will add some big features to the Vision Pro. For starters, Apple Intelligence is coming to the Vision Pro. When I was at WWDC, I was surprised when there was no mention that Apple Intelligence would be added to visionOS. Since then, visionOS 2.0 and three subsequent releases have debuted without any sign of Apple Intelligence. However, that will change with the release of visionOS 2.4 in April. Apple says visionOS 2.4 will include: Writing Tools; ChatGPT integration; Genmoji; Image Playground; and Other unspecified features Spatial Gallery. Source: Apple In addition, visionOS will debut Spatial Gallery, a new Vision Pro app that Apple says will feature “a curated collection of spatial photos, spatial videos, and panoramas from artists, filmmakers, photographers, and more,” including new Immersive video titles. Apple is also releasing a Vision Pro app for the iPhone that adds: a new way to download apps and games from the App Store; discover experiences from Apple TV, Spatial Gallery, and more; easily find helpful tips; and quickly access information for their Vision Pro. Enhancements to Guest User make it easier than ever for users to share apps and experiences with family, friends, and colleagues using a nearby iPhone or iPad. The Apple Vision Pro app. Source: Apple. Apple says you’ll be able to queue a download from your iPhone for your Apple Vision Pro. I gave up trying to share my Vision Pro with my family almost immediately because it was such a cumbersome process, so better sharing will be welcome. If it works as promised, this sounds like a much better approach: With new enhancements to Guest User in visionOS 2.4, users can start a Guest User session with their nearby iPhone or iPad. When their device is unlocked, they can choose which apps are accessible to their guest and start View Mirroring with AirPlay, making it easy to guide a guest through their Vision Pro experience. It’s great to see Apple continue to push the Vision Pro forward with better user experiences, new content, and additional ways to enjoy its unique features."
