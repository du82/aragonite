full_description = "The Latest from Magic Rays of Light and Comfort Zone By Devon Dundee Enjoy the latest episodes from MacStories’ family of podcasts: This week, Sigmund is joined by guest co-host Christopher Lawley to highlight the debut of Time Bandits and talk about Apple’s upcoming slate of immersive video releases. This week, Niléane reviews the AirPods Max, Matt got a new GPU, and Chris keeps things non-controversial by bringing up The Acolyte. Then we get into using the Vision Pro for something new and Niléane challenges us to bring some old tech back to life. Magic Rays of Light, Episode 129 Show Notes Guest Co-Host: Christopher Lawley YouTube Mastodon Threads Instagram The Untitled Site Comfort Zone Highlight Time Bandits Main Topic New Immersive Video Content for the Vision Pro and Creative Aspirations Trailer Talk Cowboy Cartel Pachinko Season Two Yo Gabba GabbaLand! TV App Highlights Ghostbusters: Frozen Empire Bad Boys: Ride Or Die Femme Primos Thelma Up Next Civil War Godzilla x Kong Godzilla Minus One Sunny Olympic Games Send us a voice message all week via iMessage or email to [email protected]. Subscribe to Magic Rays of Light on YouTube. Sigmund Judge | Follow Sigmund on X, Mastodon, or Threads Devon Dundee | Follow Devon on Mastodon or Threads Comfort Zone, Episode 8 Show Notes Weekly Topics AirPods Max NVIDIA RTX 4070 Super The Acolyte Other Stuff We Discussed Sony WH-1000XM5 headphones AirCover for Vision Pro SoloTop for Vision Pro Follow the Hosts Chris on YouTube Matt on Birchtree Niléane on Mastodon Comfort Zone on Mastodon MacStories launched its first podcast in 2017 with AppStories. Since then, the lineup has expanded to include a family of weekly shows that also includes MacStories Unwind, Magic Rays of Light, Ruminate, Comfort Zone, and NPC: Next Portable Console that collectively, cover a broad range of the modern media world from Apple’s streaming service and videogame hardware to apps for a growing audience that appreciates our thoug