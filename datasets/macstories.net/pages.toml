full_description = "With Pokémon Champions, Competitive Pokémon ‘VGC’ May Finally Go Mainstream By Federico Viticci Pokémon Champions artwork. Source: Pokémon.com. Today is Pokémon Day, and, as they do every year, The Pokémon Company held a Pokémon Presents keynote showcasing the latest updates coming to their slate of titles, including a gameplay reveal for the upcoming Pokémon Legends: Z-A for Nintendo Switch. Read more PicoChat or PictoChat: Can You Tell the Difference? By John Voorhees It’s been a very long time since I reviewed an iMessage app, but past issues of MacStories Weekly and this site chronicle the hundreds of iMessage apps Federico and I tried and wrote about. Today, though, I was reminded that there’s still fun to be had in what has to be Apple’s most obscure corner of the App Store because this afternoon, Brendon Bigley sent me a link to PicoChat for iMessage, a nostalgia-filled delight from developer Idrees Hassan. PicoChat lovingly recreates the look and feel of PictoChat, a local messaging app that shipped with the Nintendo DS beginning in 2004 and later with the DS Lite and DSi. PictoChat used a short-range proprietary wireless protocol that could only extend about 65 feet, which ultimately led to its demise as smartphones with cellular connections and Wi-Fi became popular. However, for several years, it served as a short-range communications and creative outlet for a generation of kids. For context, here’s PictoChat running on my matte black Nintendo DSi, a model that is one of Brendon’s ‘dream devices,’ as he recently shared on NPC: Next Portable Console: Now, here’s a close-up of the original PictoChat interface and the iMessage app side-by-side. PictoChat on a DS (left) and the PicoChat for iMessage app (right). Just like the DS, the iMessage version has a teeny tiny keyboard with space above it for doodles. If it weren’t for the lower resolution of the DS’s screen, I bet most people would have a hard time telling them apart. Getting back to Hassan’s app, it’s accessed like other iMessage apps from the Plus button in a Messages thread. Once you’re finished composing your masterpiece, the app converts it into an image and sends it like any other image is sent in Messages. That’s it, but it’s more than enough to have sent a whole lot of Nintendo DS fans down a nostalgia-filled rabbit hole today, which was cool. Even if the DS wasn’t your thing, check out PicoChat and send some doodles to your friends and family. It’s a lot of fun. PicoChat is available as a free download on the App Store."
