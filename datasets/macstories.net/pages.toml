full_description = "Michael MJD Revisits the Short-Lived HP TouchPad and Its Precursor Multitasking UI→ Linked By Niléane On YouTube, the fantastic Michael MJD—known for exploring the history of tech devices and software—recently revisited the 2011 HP TouchPad. This short-lived tablet is quite fascinating. It originally shipped with webOS, an operating system which was ahead of its time, featuring a gesture- and card-based multitasking interface. In many ways, it resembled the iOS and iPadOS interfaces we’re all familiar with today. Much like today’s iOS and iPadOS, webOS on the HP TouchPad allowed users to navigate the interface and switch between apps through swipes on the Home Screen, which hosted an overview of all your open apps. I remember reading about the excitement surrounding the HP TouchPad when it launched—only to be discontinued a mere 49 days later. Watching Michael MJD explore its OS and unique UI truly felt like time travel to a time when the iPad was just beginning to take off as a computer for power users. I highly recommend checking out his walkthrough. Source: youtube.com"
