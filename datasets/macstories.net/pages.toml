S screen saver. Or, if all you want is the eBook of Federico’s iOS and iPadOS 18 review, you can simply join Club MacStories with a $5/month or $50/year Club MacStories plan using the buttons below: Join Annual$50/yearJoin Monthly$5/month Now more than ever, an indie publication such as MacStories depends on income from members who want to directly support what we do. As always, though, we aim to provide as much value as we can in return. If you want to support MacStories and our ongoing efforts to team up with creatives such as Scout and James, I hope you’ll consider signing up for a Club membership and unlock all the extra perks we’ve prepared this year. For more details on all the extras, membership plans, and release schedule of other digital downloads, you can refer to our standalone article here. Table of ContentsQuality-of-Life ImprovementsNavigationHome View CustomizationKeyboard Awareness and Mouse SupportOther Quality-of-Life ImprovementsAirPlay ReceiverPhotosAppsSafariTVMessagesMindfulnessDeveloper ToolsWhat’s Next?ConclusionSpecial Thanks Page: 1 2 3 … 8 Next pageTags: Vision Pro, visionOS 2, visionOS Reviews JoinAccess Extra Content and PerksFounded in 2015, Club MacStories has delivered exclusive content every week for nearly a decade. What started with weekly and monthly email newsletters has blossomed into a family of memberships designed every MacStories fan. Learn more here and from our Club FAQs. Club MacStories: Weekly and monthly newsletters via email and the web that are brimming with apps, tips, automation workflows, longform writing, early access to the MacStories Unwind podcast, periodic giveaways, and more; Club MacStories+: Everything that Club MacStories offers, plus an active Discord community, advanced search and custom RSS features for exploring the Club’s entire back catalog, bonus columns, and dozens of app discounts; Club Premier: All of the above and AppStories+, an extended version of our flagship podcast that’s delivered early, a