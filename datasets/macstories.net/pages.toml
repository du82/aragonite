full_description = "visionOS 2: The MacStories Review By Devon Dundee In the lead-up to this year’s WWDC, it was hard to predict what an update to visionOS would look like. After all, the initial version had only shipped four months earlier when Apple Vision Pro became available for purchase in the United States. Given how late in the software cycle visionOS 1 shipped, it was reasonable to wonder if there would be a visionOS 2 announced at all, and if so, how much it could realistically add to an operating system that had just debuted the previous quarter. Of course, Apple’s software cycle waits for no one, so like watchOS before it, visionOS is receiving a 2.0 version rapidly on the heels of its initial release. But the shortened development window doesn’t mean that this update isn’t a significant one. I believe that the 2.0 moniker is well deserved based on the features and enhancements included in this release, especially given the quieter updates across all of Apple’s platforms this year in the wake of Apple Intelligence. visionOS 2 moves spatial computing forward with an array of welcome quality-of-life improvements, deeper integration with some of Apple’s other platforms, additional tools for developers to create spatial experiences, system app updates in line with Apple’s other platforms, and a new way to experience photos that you have to see to believe. The combination of user experience refinements and new features makes for a solid update that Vision Pro users are definitely going to notice and enjoy. Some of the changes we’ll dive into feel so obvious that you might wonder why they weren’t included in visionOS to begin with. Having used Vision Pro almost daily since it was released, I fully understand the sentiment. But then I remember that the iPhone didn’t gain the ability to copy and paste text until iPhone OS 3, and I’m reminded that developing new platforms takes time – even for a company as big as Apple. So while some might seem basic, many of the changes included in visionOS 2 improve users’ experiences in significant ways every time they interact with the platform. The end result is a smoother, more intuitive operating system that will delight Vision Pro believers and, if Apple has its way, convince more skeptics to take the plunge into spatial computing. Let’s jump into what visionOS 2 has to offer. a.button { text-decoration: none !important; padding: 8px; margin: 8px; white-space: nowrap; display: inline-block; line-height: 1.18; text-align: center; } a.button:hover { transition: none; } a.club { isolation: isolate; position: relative; z-index: 1; width: max-content; padding: 8px 16px; background: transparent; border: none; border-radius: 25px; transition: transform 400ms, box-shadow 400ms; will-change: transform, box-shadow; transform: translateY(0); } a.club:hover { box-shadow: 0 0 4px #d4af37; transition: transform 200ms, box-shadow 100ms; transform: translateY(-1px); padding: 8px 16px; } a.club:after { transition: transform 200ms; transform: translateY(1px); } a.club:active { box-shadow: 0 0 2px hsl(0 0 0 / 0.4); transition: transform 100ms, box-shadow 100ms; transform: translateY(0); } a.club:active:after { transition: transform 200ms; transform: translateY(0); } a.club:before { content: ''; position: absolute; isolation: isolate; z-index: -1; top: 0; left: 0; width: 100%; height: 100%; border-radius: 25px; box-shadow: 0 1px 2px hsl(0 0 0 / 0.4); background: linear-gradient( hsl(46, 88%, 80%) 0%, hsl(45, 44%, 47%) 100% ); } a.club:after { content: ''; position: absolute; isolation: isolate; z-index: -2; background: transparent; top: 0; left: 0; width: 100%; height: 100%; border-radius: 25px; background-color: hsl(0 0 0 / 0.4); box-shadow: 0 2px 2px hsl(0 0 0 / 0.4); will-change: transform; transform: translateY(0); transition: transform 400ms; } a.plan-club, a.plan-appstories, a.plan-plus, a.plan-premier { min-width: 150px; font-weight: 700 !important; } a.plan-club span { display: block; color: #00