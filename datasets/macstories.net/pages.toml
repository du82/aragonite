["https://www.macstories.net/stories/ios-18-public-beta-preview"]
title = "iOS 18 After One Month: Without AI, It's Mostly About Apps and Customization - MacStories"
description = "My experience with iOS 18 and iPadOS 18, launching today in public beta for everyone to try, has been characterized by smaller, yet welcome enhancements to Apple’s productivity apps, a redesign I was originally wrong about, and an emphasis on customization. There’s a big omission looming over the rollout of these public betas, and that’s"
full_description = "iOS 18 After One Month: Without AI, It’s Mostly About Apps and Customization By Federico Viticci iOS 18 launches in public beta today. My experience with iOS 18 and iPadOS 18, launching today in public beta for everyone to try, has been characterized by smaller, yet welcome enhancements to Apple’s productivity apps, a redesign I was originally wrong about, and an emphasis on customization. There’s a big omission looming over the rollout of these public betas, and that’s the absence of any Apple Intelligence functionalities that were showcased at WWDC. There’s no reworked Siri, no writing tools in text fields, no image generation via the dedicated Image Playground app, no redesigned Mail app. And that’s not to mention the AI features that we knew were slotted for 2025 and beyond, such as Siri eventually becoming more cognizant of app content and gaining the ability to operate more specifically inside apps. As a result, these first public betas of iOS and iPadOS 18 may be – and rightfully so – boring for most people, unless you really happen to care about customization options or apps. Fortunately, I do, which is why I’ve had a pleasant time with iOS and iPadOS 18 over the past month, noting improvements in my favorite system apps and customizing Control Center with new controls and pages. At the same time, however, I have to recognize that Apple’s focus this year was largely on AI; without it, it feels like the biggest part of the iOS 18 narrative is missing. As you can imagine, I’m going to save a deeper, more detailed look at all the visual customization features and app-related changes in iOS and iPadOS 18 for my annual review later this year, where I also plan to talk about Apple’s approach to AI and what it’ll mean for our usage of iPhones and iPads. For now, let’s take a look at the features and app updates I’ve enjoyed over the past month. Supported By Setapp Setapp: End the search, start the work. One subscription to dozens of apps for Mac and iPhone. crickets So, Yeah, About iPadOS 18 In this article (and, most likely, in my review later this year), I will focus on iOS 18 and use screenshots taken on my iPhone 15 Pro Max. The reason is simple: if Apple isn’t working to fix the glaring limitations of iPadOS 18, which I documented in May, there is nothing new for me to say here. To the best of my knowledge, there are two iPad-exclusive features in this year’s release: a redesigned tab bar for apps, and Smart Script to enhance and straighten Apple Pencil handwriting. I don’t use the Apple Pencil, so I don’t feel that I’m qualified to cover its new features in iPadOS 18. I’m also on the record as being skeptical regarding the new tab bar UI for iPad apps, which I have also been unable to test since none of the developers of my favorite third-party apps have adopted it in beta versions of their apps yet. Other features that we initially thought were going to be iPad-only (Math Notes and formatting external drives in the Files app) are also available on iOS. At the very least, iPadOS received support for dynamic Home Screen layouts and icon theming this year, bucking the historical trend that forced iPad users to wait a year before getting the iPad version of any Home Screen changes. What a sad state of affairs it is when we have to be grateful that the iPad gets iOS’ latest features instead of rejoicing that Apple is devoting time and resources to iPad-specific enhancements. And yet here we are, once again. Apps There are lots of app-related improvements in iOS 18, which is why I’m looking forward to the next few months on AppStories, where we’ll have a chance to discuss them all more in-depth. For now, here are my initial highlights. Reminders and Calendar, Together At Last I almost can’t believe I’m typing this in 2024, but as things stand in this public beta, I’m very excited about…the Calendar app. In iOS and iPadOS 18, the Calendar app is getting the ability to show your scheduled reminders alongside regular calendar events. I know, I know: that’s not the most incredible innovation since apps like Fantastical have been able to display events and tasks together for over a decade now. The thing is, though, with time I’ve realized that I don’t need a tool as complex as Fantastical (which is a great app, but its new business-oriented features are something I don’t need); I’m fine with Apple’s built-in Calendar app, which does everything I need and has an icon on the Home Screen that shows me the current date. By enabling the ‘Scheduled Reminders’ toggle in the app’s Calendars section, all your scheduled tasks from the Reminders app will appear alongside events in the calendar. You can click a reminder inside Calendar to mark it as complete or use drag and drop to reschedule it to another day. As someone who creates only a handful of calendar events each week but gives every task a due date and time, I find it very helpful to have a complete overview of my week in once place rather than having to use two apps for the job. Reminders alongside events in the Calendar app. Right now, the ability to use drag and drop to reschedule reminders in the calendar only works on iPad, not on iPhone. The integration even extends to Calendar’s Home Screen widgets, including the glorious ‘XL’ one on iPad, which can now show you reminders and events for multiple days at a glance. Reminders are also displayed in the XL Calendar widget on iPad. iOS and iPadOS 18 also include the ability to resize widgets without deleting and re-adding them from scratch every time. Historically speaking, this is not the first time we’ve seen a direct, two-way communication between Apple apps on iOS: in iOS 12, Apple brought News articles to the Stocks app, which I covered in my review at the time as an exciting opportunity for system apps to cross-pollinate and for Apple to provide iOS users with an experience greater than the sum of its parts. This year, the company is going to much greater lengths with the same idea. Not only is Reminders data appearing inside Calendar, but tasks are interactive in the Calendar app, to the point where you can access the full-blown Reminders task creation UI from inside Calendar: The Reminders UI embedded within Calendar. Does this mean the Calendar app has become the one productivity app to rule them all for me? Obviously not, since there are still plenty of reasons to open the standalone Reminders app, if only to browse my various lists and smart lists or use specific features like tagging and rich links. But the idea of providing a common ground between the two apps is solid, and as a result, I find myself spending more time managing my week inside the Calendar app now. As we’ll see later this year, these two apps aren’t the only ones becoming capable of talking to each other in iOS 18: Notes and Calculator will also get the ability to share Math Notes and allow users to edit the same document in two distinct places. This is a trend worth keeping an eye on. Speaking of Reminders, there are a handful of improvements in the app I want to mention. For starters, subtasks now appear in the ‘Today’ and ‘Scheduled’ lists as well as custom smart lists. Previously, reminders nested within a parent reminder would be hidden from those special views, which – again, as someone who schedules everything in his task manager – hindered the utility of subtasks in the first place. To give you a practical example, I have an automation that creates a new list for the next issue of MacStories Weekly every week (which I adapted from my Things suite of shortcuts), and one of the tasks inside that list is an ‘App Debuts’ parent reminder. When I come across an interesting app or update during the week, I save it as a subtask of that reminder. In iOS and iPadOS 18, those subtasks can appear in the ‘Today’ view on Saturday morning, when it’s time to assemble MacStories Weekly. Subtasks for a reminder in a specific list (left) can now appear in the Today page and other smart lists. Although the ‘Today’ default smart list still doesn’t support columns, it now lets you customize the order of its default sections: all-day, overdue, and timed reminders. You can now customize the order of sections in the Today page. I’m also intrigued by Apple’s promise of new Shortcuts actions for Reminders, though I suspect the work is unfinished and we’re only seeing partial results in this public beta. There is a new ‘Create Reminder’ action in Shortcuts (which I can only see on my iPhone, not on the iPad) that exposes more options for task creation than the old ‘Add New Reminder’ action. The ‘Create Reminder’ action was introduced in developer beta 2 of iOS 18; it still works in developer beta 3 and the public beta, but I can’t find it anymore in the Shortcuts action library. I hope it comes back soon. Namely, this action now lets you enter properties for a list’s sections and assignees; strangely enough, the action doesn’t contain an option to enter a URL attachment for a task, which the previous action offered. I’m guessing that, as part of Apple Intelligence and with the ultimate goal of making Siri more integrated with apps, Apple is going to retool a lot of their existing Shortcuts actions. (It’s about time.) I wouldn’t be surprised if more apps follow Reminders in modernizing their Shortcuts integrations within the iOS 18 cycle because of Apple Intelligence. Passwords: The “Finally” of the Year At long last – and the finally is deserved here – Apple has made a standalone Passwords app for iOS, iPadOS, and macOS. I (and many others) have been arguing in favor of cutting password management out of Settings to let it blossom into a full-blown app for years now; I’m not kidding when I say that, on balance, the addition of the Passwords app has been the most important quality-of-life improvement in iOS 18 so far. The addition of the Passwords app has been the most important quality-of-life improvement in iOS 18. I moved all of my passwords out of 1Password and into iCloud Keychain just before WWDC (following Simon’s excellent guide). As soon as I updated to iOS 18, they were all transferred to the Passwords app, and I didn’t have to do anything else. iCloud Keychain already supported key password management features like verification codes; with the Passwords app, you don’t need to go hunt for them inside Settings anymore thanks to a more intuitive UI that also adds some welcome options. The Passwords app has a design that’s reminiscent of Reminders, with pinned sections at the top for passkeys, logins that have one-time codes, Wi-Fi networks, security recommendations, and deleted items. With the exception of the Wi-Fi section, these aren’t new features, but the presentation makes them easier to find. These sections are followed by your shared groups, which aren’t new either, but are more discoverable and prominent. The design of login item pages is consistent with iOS 17’s old iCloud Keychain UI, but the app now supports multiple URLs for the same login; the main list view also includes sorting options. The Passwords app is my favorite addition of the year. My favorite detail of the Passwords app, however, is this: if you need to quickly copy an item’s username, password, code, or URL, you can simply right-click it in the main view and copy what you need: This is a good menu. The best thing I can say about Passwords is that it obliterated a particular kind of frustration from my life. With Apple’s app, I don’t need to worry about my password manager not working anymore. In fact, I’d argue that Passwords’ strongest quality is that you never think about it that much, and that means it’s doing its job. Those who, like me, come from more than a decade of using 1Password and have witnessed the app’s slow descent into instability know what I’m talking about: having to constantly worry about the app’s Safari extension not working, search not bringing up results inside the app, or the extension auto-filling the wrong information on a page. With Passwords, all these issues have evaporated for me, and I can’t describe how happy it makes me that I just don’t have these thoughts about my password manager anymore. Don’t get me wrong; there are features of 1Password that Apple’s Passwords app can’t match yet, and that I’m guessing will be the reason why some folks won’t be able to switch to it just yet. The biggest limitation, in my opinion, is the lack of secure attachments: if you want to store a file (like, say, a PDF document or an encryption key) associated with a login item, well, you can’t with Passwords yet. Apple’s Notes app can’t act as backup here since it still can’t lock notes that contain attachments such as PDFs. I also find it quite strange that I can look up my known Wi-Fi networks in the Passwords app, but if I want to find my saved credit cards, I still need to open the Settings app. Ideally, I should be able to see my saved credit cards in the Passwords app and store all kinds of secure attachments in Notes. These limitations need to be addressed, and now that Passwords is a standalone experience, I’m more confident that Apple will have the headroom to do so rather than having to cram everything into a Settings page. Moving from 1Password to the Passwords app has been one of the most useful tech-related migrations I’ve made in recent memory; if you’re on the verge and primarily use Apple devices, I highly recommend taking the time to do it. The New Photos App: Tradition, Discovery, and Customization Beyond Apple Intelligence, I’d argue that the most important change of iOS 18 – and something you can try right now, unlike AI – is the redesigned Photos app. As I shared on MacStories a couple of weeks ago, I was initially wrong about it. Having used it every day for the past month, not only do I think Apple is onto something with their idea of a single-page app design, but, more importantly, the new app has helped me rediscover old memories more frequently than before. The concept behind the new Photos app is fairly straightforward to grasp, yet antithetical to decades of iOS UI conventions: rather than organize different app sections into tabs, everything has been collapsed into a single page that you can scroll to move from your library to various kinds of collections and suggestions. And that’s not at all; this fluid, single-page layout (which is powered by SwiftUI) is also highly customizable, allowing users to fine-tune which sections they want to see at the top in the main carousel and which pinned collections, albums, or trips they want to see further down the page. The new Photos UI on iPad. It’s easy to understand why the move from a tabbed interface to a unified single-page design may – at least in theory – bolster discovery inside the app: if people aren’t using the app’s other sections, well, let’s just move all those sections into the screen we know they’re using. Or, think about it this way: we already spend hours of our lives discove"
