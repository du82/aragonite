full_description = "Horse Browser Tries Its Hooves at a New Take on Tabs By Niléane In 2024, web browsers mostly all look the same. Their user interfaces always feature an address bar at the top of the window and horizontal tabs that allow you to navigate through multiple websites. So whenever a new browser tries to shake things up and innovate on this basic premise, it’s inevitable that it will elicit a certain amount of interest – sometimes to the point of fashioning its own fanbase. For example, with a novel approach to organizing, pinning, and managing tabs in a customizable sidebar, Arc Browser by The Browser Company has been a great showcase of what creating a brand new user experience for browsing the web can look like. Last week, though, I stumbled upon a newcomer called Horse Browser by Pascal Pixel that immediately caught my attention. Horse is unlike anything I’ve ever seen in this space. The browser is based on a new approach that completely does away with the traditional address bar and horizontal tab layout. Instead of tabs, navigation in Horse Browser is structured in hierarchical trees called ‘Trails.’ The resulting UI is unique, appealing, and clever. But how does it hold up in everyday use? Let’s find out. Read more Raycast Overhauls Its Notes Feature By John Voorhees Raycast has always been more than an app launcher. From the start, it has included a multitude of other handy utilities, including Floating Notes. I’ve used Floating Notes now and then to park a bit of text where I knew I’d be able to find it later. Because the note floated above other windows, it was easy to access, but Floating Notes always felt a little too rudimentary to use for much more than that. Today, Raycast released an extensive update to the feature and renamed it Raycast Notes. Your notes still occupy a floating window, but now, the window auto-resizes to fit the content by default. The window’s width is fixed, but you can always resize its height to adjust how much space it occupies on your screen. Read more"
