["https://www.macstories.net/author/devon/page/2"]
title = "Devon Dundee | MacStories - Part 2"
description = "Devon Dundee is the co-host of Magic Rays of Light, a podcast exploring the world of Apple TV, where he's covered Apple TV, tvOS, and Apple Originals since 2021. He's also written about apps, TV, and film on his personal website for over ten years. Devon lives in Arkansas with his wife, their son, and their dog Winter."
full_description = "Apple Announces New Features Coming to Its Services This Fall→ Linked By Devon Dundee Alongside updates to Apple’s platforms and Apple Intelligence, the company announced an assortment of new features coming to its line of services this fall. From the press release in Apple Newsroom: “So many of our users rely on Apple services throughout their day, from navigating their commute with Apple Maps, to making easy and secure payments with Apple Pay, to curating playlists with Apple Music,” said Eddy Cue, Apple’s senior vice president of Services. “We’re excited to give them even more to love about our services, like the ability to explore national parks with hikes in Apple Maps, redeem rewards or access installments with Apple Pay, and enjoy music with loved ones through SharePlay in Apple Music.” I like that this services roundup is becoming an annual WWDC tradition. Some of these features were mentioned or shown on-screen during the keynote, but it’s easy for them to get overlooked in light of major operating system changes. While they might seem small in comparison, improvements to Apple’s services can have lasting day-to-day impacts on those who use them, myself included. Supported By 1Password 1Password Extended Access Management: Secure every sign-in for every app on every device A few of my favorite services updates this year: A new Places Library in Maps that allows you to save locations and write notes about them. Tap to Provision, an easier way to add credit and debits cards to Wallet by tapping them instead of entering card numbers. Redesigned event tickets in Wallet that can feature new types of data, including parking and weather information. The Library tab in Apple Fitness+ for quicker access to saved workouts, Custom Plans, and Stacks. Redesigned iCloud settings to better surface recommendations and features you’re using. Check out the press release for all the updates coming to Apple’s services this fall. There’s a lot to look forward to there, and I’m happy to see the company continuing to push its services forward. You can follow all of our WWDC coverage through our WWDC 2024 hub or subscribe to the dedicated WWDC 2024 RSS feed. Permalink"
year_published = 2025
