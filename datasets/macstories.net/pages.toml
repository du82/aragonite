full_description = "Apple Announces the New iPad Air and Base Model iPad By John Voorhees The new iPad Air. Source: Apple. Apple today introduced an update to the iPad Air featuring the company’s M3 chip and a new base model iPad with the A16 chip and more starting storage at 128GB. According to Apple’s press release, the new Air is almost twice as fast as the model with an M1 chip and up to 3.5 times faster than the Air with an A14 Bionic chip. Apple elaborates: The powerful M3 chip offers a number of improvements over M1 and previous-generation models. Featuring a more powerful 8-core CPU, M3 is up to 35 percent faster for multithreaded CPU workflows than iPad Air with M1. M3 features a 9-core GPU with up to 40 percent faster graphics performance over M1. M3 also brings Apple’s advanced graphics architecture to iPad Air for the first time with support for dynamic caching, along with hardware-accelerated mesh shading and ray tracing. For graphics-intensive rendering workflows, iPad Air with M3 offers up to 4x faster performance than iPad Air with M1, enabling more accurate lighting, reflections, shadows, and extremely realistic gaming experiences. The new model is available in blue, purple, starlight, and space gray and in 11-inch and 13-inch screen sizes. The Air also has 128GB, 256GB, 512GB, and 1TB storage options. The 11-inch iPad Air starts at $599, and the 13-inch model starts at $799 with education customers getting $50 off those prices. The cellular models add $150 to the price tag. The iPad Air can be preordered today for delivery and in-store pickup on March 12th. The base model iPad. Source: Apple. As for the base model iPad, it comes in blue, pink, yellow, and silver, starting at $349 for the 128GB model. Cellular costs an additional $150, and education customers get $20 off. The other storage options for the iPad update are 256GB and 512GB. Like the iPad Air, the base model iPad can be ordered today for delivery March 12th. From a Turntable to an iPad Home Dashboard: My First Experience with Vinyl By Niléane This month, amidst the increasingly chaotic rumblings of the world in the news, I found myself looking for a new distraction. Since Civilization VII wasn’t out just yet, my eyes quickly turned to the vinyl record player that my partner and I had been storing in its cardboard box for months without ever taking the time to set it up. It’s not even ours; we’ve been keeping it safe, along with a sizable vinyl collection, for a close friend who unfortunately doesn’t have enough space for it in their current home. This turntable is definitely not fancy – it’s even quite affordable compared to similar models – but it looks pretty, and our friend gracefully gave us permission to set it up for ourselves in the living room. While I’m sure they only pitied my desperate need for a new distraction, I took them up on this offer and opened the turntable’s box for the first time. At the risk of sounding like a total youngster, I must disclose that until three weeks ago, I had never interacted with vinyl before. All I had were some presumptuous preconceptions. ”Doesn’t music sound worse on vinyl? Also, why should I bother with large, fragile music discs and a whole record player when I already have Apple Music in my pocket with lossless audio and Dolby Atmos?” Still, I was not only intrigued, but also motivated to solve the main problem that setting up this record player posed: how can I make it work when our audio gear at home consists only of a handful of HomePod minis, one pair of wired headphones, and several pairs of Bluetooth headphones? While some turntables ship with built-in Bluetooth connectivity, ours can only output audio over USB or RCA with the help of a sound amplifier, and it definitely can’t broadcast audio to AirPlay devices like our HomePod minis. Allow me to spoil the ending of this story for you: in the end, unboxing this turntable escalated into a legitimately awesome tech upgrade to our living room. It’s now equipped with a docked 11“ iPad Pro that acts as a shared dashboard for controlling our HomeKit devices, performing everyday tasks like consulting the weather and setting up timers, and of course, broadcasting our vinyls to any HomePod mini or Bluetooth device in the apartment. This setup is amazing, and it works perfectly; however, getting there was a tedious process that drastically reinforced my long-standing frustrations with Apple’s self-imposed software limitations. Let me tell you how it all went. Read more"
year_published = 2025
