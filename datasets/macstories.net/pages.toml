["https://www.macstories.net/author/nileane/page/2"]
title = "Niléane | MacStories - Part 2"
description = "Niléane is a French-Réunionnese podcaster and activist, working and advocating for the advancement of trans rights. She is passionate about technology and always likes to experiment with Apple products and software to improve her workflows and everyday life."
full_description = "iOS and iPadOS 18.1: Everything New Besides Apple Intelligence By Niléane Today, Apple released iOS and iPadOS 18.1, the first major release since the operating system versions that launched in September and were reviewed by Federico. As you may know, the main highlight of this new release is the first wave of Apple Intelligence features available to the public. AI has arrived, and for better or for worse for Apple’s platforms, this is only the beginning. Be sure to check out John’s review of all the new Apple Intelligence features included in iOS and iPadOS 18.1 (as well as macOS Sequoia 15.1) for the details. Fortunately, Apple Intelligence isn’t the only highlight of this release. It also includes a series of changes to the system, from Control Center and the Camera app to Shortcuts and the arrival of new health features for AirPods Pro 2 users. Here’s a roundup of everything new besides Apple Intelligence in iOS and iPadOS 18.1. Read more Postcards and a Mac: Niléane’s Desk Setup By Niléane It’s been a while since I last showed off my desk. The last time I did so as part of MacStories Weekly Issue 405 in February, I had just acquired an 11-inch iPad Pro, and my desk looked quite different than it does now. It had an imposing corner shelf holding a variety of plushies, accessories, and other knickknacks, in addition to providing support for my microphone arm. Overall, it felt a lot more cluttered than it does now. As the months went on, I’ve had to rethink my desktop layout to accommodate the many changes that I’ve made to my device usage. Now more than ever, my M2 MacBook Air is at the center of everything I do – so much so that the iPad Pro is now nothing more than an eBook reader for me and rarely lives on my desk as a result. This summer, we also launched Comfort Zone, a new weekly show in the MacStories family of podcasts. Since Comfort Zone is both an audio and video podcast, I started recording video at my desk for the first time ever, which also meant that I had to tweak my desk to optimize it for lighting and a new microphone setup. In the end, these changes have added up to a completely new desk setup. So today, I’m going to take you on a quick desk tour. Let me walk you through the main highlights of what makes this desk my favorite little corner in our home. Read more"
