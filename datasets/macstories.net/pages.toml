full_description = "Hands-On with Raycast’s New AI Extensions By Niléane Yesterday, Raycast unveiled AI Extensions as yet another addition to the app’s ever-expanding feature set. As we’ve covered on MacStories before, Raycast is a powerful launcher and command bar for the Mac with a sizable ecosystem of built-in and third-party extensions. Extensions allow the launcher to integrate with apps installed on your Mac as well as a multitude of online services such as Google Calendar, translation tools like DeepL, and even handy development tools like Color Picker and Git Commands. Starting this week, Raycast says it will be possible for any of these extensions to integrate with AI so they can be invoked with natural language directly from the app’s main command window and even chained together as part of complex workflows. Here are my first impressions. Read more Hyperspace: Quickly Recover Mac Storage Without Deleting Files By John Voorhees Earlier today, John Siracusa released a Mac app called Hyperspace. The app scans any folder on your Mac, identifying duplicates. When the scan is finished, you can review the results and choose whether to reclaim the unnecessary space taken up by the duplicates. Ready to scan. Because of the way Apple’s APFS file system works on the Mac, Hyperspace’s deduplication of files doesn’t delete or move anything. How APFS does this is complicated and explained on the app’s website if you want to learn more, but to over-simplify a bit, APFS allows Hyperspace to eliminate duplicative data without changing the location of the files or their metadata. That means it’s a non-destructive operation, allowing you to reclaim drive space at no cost to your data’s integrity. Hyperspace gives you a chance to review the files it has identified as duplicates. The app has safety measures in place so system files aren’t affected, and users can label certain folders as ‘Source’ folders that will never be altered. You also have an opportunity to review the results of Hyperspace’s scan before the app does anything to your files. Hyperspace requires a subscription or one-time purchase to reclaim space. I took Hyperspace for a spin to see what it could find on my Mac Studio, which stores about 2.5 TB of data. The scan was impressively fast at around 30 seconds, identifying 4.04 GB of data that it could free up. That’s not a lot in the grand scheme of things, but it was also nice to know that I don’t generate a lot of duplicate files with my workflows. Hyperspace is free to download from the Mac App Store. The free version allows you to scan the folders on your system. However, to recover space, you need to subscribe for $9.99 per month or $19.99 per year, or purchase a lifetime license for $49.99. There are also options to purchase a single month license for $9.99 or a single year for $19.99."
