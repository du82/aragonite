title = "iOS and iPadOS 18: The MacStories Review - MacStories"
description = "DetailsPro: Design with SwiftUI, no coding required."
full_description = "iOS and iPadOS 18: The MacStories Review iOS and iPadOS 18: The MacStories Review There is still fun beyond AI. By Federico Viticci There are two versions of iOS 18 coming out this year. Or, think about it this way: Inside Apple, there are two versions of iOS 18. The version I’ve been able to test since June, and which will be the focus of this review, is the debut of iOS 18, which emphasizes user customization and smaller app updates. The other one – and, arguably, the version most are anticipating since WWDC – is iOS 18.1, which will mark the launch of Apple Intelligence in the United States later this year as well as the beginning of a process to roll out more AI features over time. Technically, iOS 18.1 is going to be a major update to iOS 18.0, which will introduce the first slate of AI features on iPhones and iPads; in spirit, it might as well be the version of iOS 18 that is going to steal the spotlight and become The Conversation in our community for months to come. However, due to a mix of legal and political reasons, as an Italian citizen, I won’t be able to participate in that discourse just yet. Thankfully, there’s plenty to like in iOS 18 even without Apple Intelligence, especially if, like yours truly, you’re the kind of MacStories reader who cares about apps, minor system tweaks, and making your Home Screen look nice. This is what my review will focus on this year. There are two versions of iOS 18: I’m going to cover the fun, nerdy one. Supported By DetailsPro DetailsPro: Bring your iOS 18 app ideas to life effortlessly – design smarter, faster, and with more creativity. I’ve been writing annual reviews of iOS (and later iPadOS too) for ten years now. During this time, I’ve seen my fair share of mobile OS trends, and I’ve observed how Apple judiciously iterated on their post-iOS 7 design language and stoically ignored the majority of the tech industry’s fads, staying the course of their vision for what their ecosystem of devices and OSes should empower people to do. Never have I been in the position to witness the company finding itself unable to ignore a major industry shift. That’s exactly what is happening with AI. As we saw back in June, Apple announced a roadmap of AI features that will be gradually doled out to users and developers over the iOS 18 cycle. Most of them won’t even be launching this year: I wouldn’t be surprised if we see them just in time before the debut of iOS 19 at WWDC 2025. What’s even more fascinating is realizing just how much of a priority Apple Intelligence must have been for the iOS, iPadOS, and macOS teams. Let’s face it: if it weren’t for the handful of additions to iOS, which are also cross-compatible with iPadOS, I wouldn’t have much to cover today without Apple Intelligence. This is quite apparent in macOS Sequoia: as John will cover in his review, with no Apple Intelligence, there are only two main features worth analyzing in detail. Thus, dear reader, don’t be surprised if this will be my shortest annual iOS review to date. Plus, it’s not like I was particularly looking forward to Apple Intelligence anyway. In any case, as I argued in my preview story back in July, the smaller features that found their way onto iOS and iPadOS this year are still interesting enough to justify a “traditional” review. And it’s not just that these are good features: they’re also my favorite kind, for they’re primarily about customization and apps. From more flexible Home Screens to Control Center finally becoming extensible with third-party controls, some big improvements to Notes and Journal, plus a brand new Passwords app, how could I not be excited about iOS 18? This intrinsic duality of iOS 18 is the reason why I’ve never felt so ambivalent about a new version of iOS. Or, think about it this way: Inside me, there are two takes. I fundamentally dislike generative AI tools and, from what I’ve seen so far, I don’t think I’m ever going to take advantage of Apple’s features that modify text or create images. At the same time, I’m excited about the prospect of a smarter Siri that is better integrated with apps; and today, with the version of iOS 18 that is shipping to customers, I think there are plenty of smaller features worth appreciating, especially if you’re into customization. Today, we don’t need to reconcile those two takes. We don’t have to be grownups for this one. We’re just going to dive into what makes iOS 18 a smaller update than previous years, but a fun one nonetheless. a.button { text-decoration: none !important; padding: 8px; margin: 8px; white-space: nowrap; display: inline-block; line-height: 1.18; text-align: center; } a.button:hover { transition: none; } a.club { isolation: isolate; position: relative; z-index: 1; width: max-content; padding: 8px 16px; background: transparent; border: none; border-radius: 25px; transition: transform 400ms, box-shadow 400ms; will-change: transform, box-shadow; transform: translateY(0); } a.club:hover { box-shadow: 0 0 4px #d4af37; transition: transform 200ms, box-shadow 100ms; transform: translateY(-1px); padding: 8px 16px; } a.club:after { transition: transform 200ms; transform: translateY(1px); } a.club:active { box-shadow: 0 0 2px hsl(0 0 0 / 0.4); transition: transform 100ms, box-shadow 100ms; transform: translateY(0); } a.club:active:after { transition: transform 200ms; transform: translateY(0); } a.club:before { content: ''; position: absolute; isolation: isolate; z-index: -1; top: 0; left: 0; width: 100%; height: 100%; border-radius: 25px; box-shadow: 0 1px 2px hsl(0 0 0 / 0.4); background: linear-gradient( hsl(46, 88%, 80%) 0%, hsl(45, 44%, 47%) 100% ); } a.club:after { content: ''; position: absolute; isolation: isolate; z-index: -2; background: transparent; top: 0; left: 0; width: 100%; height: 100%; border-radius: 25px; background-color: hsl(0 0 0 / 0.4); box-shadow: 0 2px 2px hsl(0 0 0 / 0.4); will-change: transform; transform: translateY(0); transition: transform 400ms; } a.plan-club, a.plan-appstories, a.plan-plus, a.plan-premier { min-width: 150px; font-weight: 700 !important; } a.plan-club span { display: block; color: #000; font-weight: 400; } a.plan-appstories span { display: block; color: #000; font-weight: 400; } a.plan-plus span { display: block; color: #000; font-weight: 400; } a.plan-premier span { display: block; color: #000; font-weight: 400; } a.plan-club { color: hsl(358, 89%, 36%) !important; } a.plan-appstories { color: #210a30 !important; } a.plan-appstories:before { background: linear-gradient(hsl(204, 100%, 75%) 0%, hsl(204, 100%, 40%) 100%); } a.plan-appstories:hover { box-shadow: 0 0 4px #0099FF; } a.plan-plus { color: #760087 !important; } a.plan-premier { color: #060e1d !important; } Exclusive Extras & Support MacStories eBook, Wallpapers, and Illustrated macOS Screen Saver We’re taking a different approach with paid extras for this year’s review: there’s still an eBook version for all Club MacStories members; if you’re a Club MacStories Plus or Premier member, however, you get access to everything else. And, this year, it’s a lot. To better explain all the extras we’ve prepared this year, we’ve teamed up with our friend Chris Lawley for a trailer that describes everything you can unlock: So, to sum up: You can unlock the eBook version of the review with a $5/month or $50/year Club MacStories plan using the buttons below: Join Annual$50/yearJoin Monthly$5/month Or you can unlock all the other eBooks, full-res illustrated wallpapers, and macOS screen saver with a Club Plus or Premier plan using the buttons below: Join Club MacStories+: Join Annual$100/yearJoin Monthly$10/month Join Club Premier: Join Annual$120/yearJoin Monthly$12/month Scout’s illustrations are gorgeous, and they make for some amazing wallpapers (I use one on my iPad’s Lock Screen, with a blurred version on the Home Screen). The screen saver is remarkable, too: since the illustrations were hand-drawn in Procreate (which automatically generates a time-lapse of the entire process), we were able to create a screen saver (developed by James Thomson) that makes the artwork come alive on your Mac’s display. The macOS screen saver. Now more than ever, an indie publication such as MacStories depends on income from members who want to directly support what we do. As always, though, we aim to provide as much value as we can in return. If you want to support MacStories and our ongoing efforts to team up with creatives such as Scout and James, I hope you’ll consider signing up for a Club membership and unlock all the extra perks we’ve prepared this year. For more details on all the extras, membership plans, and release schedule of other digital downloads, you can refer to our standalone article here. 1 … 14 Next → Tags: iOS 18, iOS Reviews, iPadOS 18 DetailsPro: Design with SwiftUI, no coding required. IntroductionCustomization: Home Screen and Control CenterGoodbye, Legacy WidgetsHome Screen CustomizationFlexible LayoutsResizable WidgetsLarge IconsIcon Colors: Dark Mode and TintingMinor Lock Screens ChangesThe New Control CenterThe Return of Multi-Page ControlsControls Everywhere, for EverythingiPadOS 18Home Screen and Control CenterSidebars and Tab BarsCalculatorThe New Document BrowserAppsCalculatorCalendarCameraFilesJournalMessagesMusicNotesPasswordsPhonePhotosPodcastsRemindersSettingsShortcutsWeatherEverything ElseDesignPrivacyBatteryKeyboardScreen Sharing with Remote ControlLive ActivitiesConclusion A A Add Bookmark DarkLightAutomatic Use this link to save your spot in the review and return to it later.You can add this as a bookmark or share it with friends. Copy"
