full_description = "Podcast Rewind: What’s Next for Apps and Hands-On with the Latest Android and Retro Handhelds By John Voorhees Enjoy the latest episodes from MacStories’ family of podcasts: AppStories This week, Federico and I make five app predictions for the next five years covering everything from App Intents and automation to the fate of the App Store. This episode is sponsored by: P – The water reminder and hydration app. NPC: Next Portable Console On the latest NPC, ASUS gaming phones, Retroid’s big surprise, and more Nintendo emulation drama, plus 8BitDo tries to solve the iPhone vertical controller problem, Federico weighs in on the Any Odin2 Portal, and the whole gang has nothing but love for the TrimUI Brick. AppStories, Episode 424, ‘5 for 5: Five Predictions, Five Years’ Show Notes Links and Show Notes Additional Reading: Apple Intelligence: The MacStories Overview iOS and iPadOS 18: The MacStories Review macOS Sequoia: The MacStories Review Gemini 2.0 and LLMs Integrated with Apps Apple Intelligence in iOS 18.2: A Deep Dive into Working with Siri and ChatGPT, Together Apple Reveals A Partial Timeline for the Rollout of More Apple Intelligence Features Apple’s Commitment to AI Is Clear, But Its Execution Is Uneven Widgets and What Apple’s Recent Expansion of App Intents Might Mean for the Shortcuts App An App Store First: Delta Adds Patreon Link for Purchase and Perks The Delta Videogame Emulator Launches on the App Store Subscribe here. On AppStories+, I talk through a very specific use case for Apple’s new iPhone 16e. We deliver AppStories+ to subscribers with bonus content, ad-free, and at a high bitrate early every week. To learn more about the benefits included with an AppStories+ subscription, visit our Plans page, or read the AppStories+ FAQ. NPC, Episode 21, ‘Brick Gang’ Show Notes Links and Show Notes Follow-Up Bazzite Potential Effect of Tariffs on Retro Handheld Collectors The Latest Portable Gaming News Chris Plante of Polygon reviews the AYANEO 3 Asus ROG Phone 9 FE launches as a (somewhat) cheaper gaming phone Asus ROG Phone 9 FE launches as a (somewhat) cheaper gaming phone Retroid Pocket Flip 2 Officially Teased Powkiddy taking pre-orders on V20 The Nintendo DS Drastic emulator is gone from Google Play 8BitDo Micro Clip [8BitDo Micro controller] Amazon Direct Link Federico’s First Impressions of the Ayn Odin2 Portal Ayn Odin2 Portal TrimUI Brick The gang shares their love for the Brick Amazon Keepretro MacStories launched its first podcast in 2017 with AppStories. Since then, the lineup has expanded to include a family of weekly shows that also includes MacStories Unwind, Magic Rays of Light, Ruminate, Comfort Zone, and NPC: Next Portable Console that collectively, cover a broad range of the modern media world from Apple’s streaming service and videogame hardware to apps for a growing audience that appreciates our thoughtful, in-depth approach to media. If you’re interested in advertising on our shows, you can learn more here or by contacting our Managing Editor, John Voorhees.÷ Tags: appstories, NPC, podcast JoinAccess Extra Content and PerksFounded in 2015, Club MacStories has delivered exclusive content every week for nearly a decade. What started with weekly and monthly email newsletters has blossomed into a family of memberships designed every MacStories fan. Learn more here and from our Club FAQs. Club MacStories: Weekly and monthly newsletters via email and the web that are brimming with apps, tips, automation workflows, longform writing, early access to the MacStories Unwind podcast, periodic giveaways, and more; Club MacStories+: Everything that Club MacStories offers, plus an active Discord community, advanced search and custom RSS features for exploring the Club’s entire back catalog, bonus columns, and dozens of app discounts; Club Premier: All of the above and AppStories+, an extended version of our flagship podcast that’s delivered early, ad-free, and in high-bitrate audio."
