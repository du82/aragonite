description = "Apple news, app reviews, and stories by Federico Viticci and friends."
full_description = "Apple Frames 3.3 Adds Support for iPhone 16 and 16 Pro, M4 iPad Pro, and Apple Watch Series 10 (feat. An Unexpected Technical Detour) By Federico Viticci Apple Frames 3.3 supports all the new devices released by Apple in 2024. Well, this certainly took longer than expected. Today, I’m happy to finally release version 3.3 of Apple Frames, my shortcut to put screenshots inside physical frames of Apple devices. In this new version, which is a free update for everyone, you’ll find support for all the new devices Apple released in 2024: 11” and 13” M4 iPad Pro iPhone 16 and iPhone 16 Pro lineup 42mm and 46mm Apple Watch Series 10 To get started with Apple Frames, simply head to the end of this post (or search for Apple Frames in the MacStories Shortcuts Archive), download the updated shortcut, and replace any older version you may have installed with it. The first time you run the shortcut, you’ll be asked to redownload the file assets necessary for Apple Frames, which is a one-time operation. Once that’s done, you can resume framing your screenshots like you’ve always done, either using the native Apple Frames menu or the advanced API that I introduced last year. So what took this update so long? Well, if you want to know the backstory, keep on reading. Read more A Feature from 10 Years Ago Is Back – with a Twist – in My Favorite RSS Client By Federico Viticci Unread’s new custom shortcuts. When it comes to productivity apps, especially those that have to work within the constraints of iOS and iPadOS, it’s rare these days to stumble upon a new idea that has never been tried before. With the exception of objectively new technologies such as LLMs, or unless there’s a new framework that Apple is opening up to developers, it can often feel like most ideas have been attempted before and we’re simply retreading old ground. Let me be clear: I don’t think there’s anything inherently wrong with that. I’ve been writing about iPhone and iPad apps for over a decade now, and I believe there are dozens of design patterns and features that have undeservedly fallen out of fashion. But such is life. Today marks the return of a very MacStories-y feature in one of my longtime favorite apps￼, which – thanks to this new functionality – is gaining a permanent spot on my Home Screen. Namely, the RSS client Unread now lets you create custom article actions powered by the Shortcuts app. Read more"
