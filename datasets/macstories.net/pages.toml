title = "Shortcuts Archive - MacStories"
description = "Welcome to the MacStories Shortcuts Archive, the official repository for shortcuts created by Federico Viticci and the MacStories team. Since the original release of Workflow in 2014, we’ve created hundreds of automations to help readers use their iOS devices more efficiently. The goal of this archive is to offer a complete catalogue of our old"
full_description = "Shortcuts Archive Welcome to the MacStories Shortcuts Archive, the official repository for shortcuts created by Federico Viticci and the MacStories team. Since the original release of Workflow in 2014, we’ve created hundreds of automations to help readers use their iOS devices more efficiently. The goal of this archive is to offer a complete catalogue of our old workflows as well as new custom shortcuts for Apple’s Shortcuts app. Each shortcut in this archive has been created, updated, and tested by Federico and the MacStories team. Shortcuts are organized in categories, and you can jump directly to a specific category by using one of the section links below. For more details on downloading and using shortcuts, see this section below. a.button { text-decoration: none !important; padding: 8px; margin: 8px; white-space: nowrap; display: inline-block; line-height: 1.18; text-align: center; } a.button:hover { transition: none; } a.club { isolation: isolate; position: relative; z-index: 1; width: max-content; padding: 8px 16px; background: transparent; border: none; border-radius: 25px; transition: transform 400ms, box-shadow 400ms; will-change: transform, box-shadow; transform: translateY(0); } a.club:hover { box-shadow: 0 0 4px #d4af37; transition: transform 200ms, box-shadow 100ms; transform: translateY(-1px); padding: 8px 16px; } a.club:after { transition: transform 200ms; transform: translateY(1px); } a.club:active { box-shadow: 0 0 2px hsl(0 0 0 / 0.4); transition: transform 100ms, box-shadow 100ms; transform: translateY(0); } a.club:active:after { transition: transform 200ms; transform: translateY(0); } a.club:before { content: ''; position: absolute; isolation: isolate; z-index: -1; top: 0; left: 0; width: 100%; height: 100%; border-radius: 25px; box-shadow: 0 1px 2px hsl(0 0 0 / 0.4); background: linear-gradient( hsl(46, 88%, 80%) 0%, hsl(45, 44%, 47%) 100% ); } a.club:after { content: ''; position: absolute; isolation: isolate; z-index: -2; background: transparent; top: 0; left: 0; width: 100%; height: 100%; border-radius: 25px; background-color: hsl(0 0 0 / 0.4); box-shadow: 0 2px 2px hsl(0 0 0 / 0.4); will-change: transform; transform: translateY(0); transition: transform 400ms; } a.plan-club, a.plan-appstories, a.plan-plus, a.plan-premier { min-width: 150px; font-weight: 700 !important; } a.plan-club span { display: block; color: #000; font-weight: 400; } a.plan-appstories span { display: block; color: #000; font-weight: 400; } a.plan-plus span { display: block; color: #000; font-weight: 400; } a.plan-premier span { display: block; color: #000; font-weight: 400; } a.plan-club { color: hsl(358, 89%, 36%) !important; } a.plan-appstories { color: #210a30 !important; } a.plan-appstories:before { background: linear-gradient(hsl(204, 100%, 75%) 0%, hsl(204, 100%, 40%) 100%); } a.plan-appstories:hover { box-shadow: 0 0 4px #0099FF; } a.plan-plus { color: #760087 !important; } a.plan-premier { color: #060e1d !important; } Advanced Apple Automation Guides Level Up Your Shortcuts Game with Automation Academy Want to unlock the full power of Apple’s Shortcuts app? Join our Automation Academy and transform how you use your iPhone, iPad, and Mac. As a Club MacStories+ or Premier member, you’ll get: Step-by-step guides that make complex automation simple Ready-to-use, advanced shortcuts you can download and customize Personal tips and tricks I’ve learned from over a decade of Shortcuts experimentation Plus, connect with fellow Shortcuts enthusiasts in our members-only Discord channel where you can share ideas, get answers to your questions, and see what others are creating. The Automation Academy is just one of many benefits waiting for you at Club MacStories, which you can join using the buttons below. You can view all our plans here. Join Club Premier: Join Annual$120/yearJoin Monthly$12/month Join Club MacStories+: Join Annual$100/yearJoin Monthly$10/month Archive Details Total number of shortcuts in archive: 317 Last update: Nov 27, 2024 Jump to section: Action Button Apple TV App Store Calendar Contacts Email Evernote Files Health Home JavaScript Mac Markdown Media Music Notes Photos Podcasts Task Management Text Time Tracking Twitter Weather Web Other Action Button Take Screenshot and ShareTake a screenshot and share it. Get the shortcut here. MultiButtonToggle between two shortcuts from the Action button. MultiButton will run a secondary shortcut if you press the Action button within a few seconds of your first press. MultiButton 1.1 introduces support for CAPS (Contextual Apps Plugin System) automation; CAPS lets MultiButton run a different set of shortcuts when specific apps are open. CAPS is available exclusively for Club MacStories members and was released in Issue 409 of MacStories Weekly. Get the shortcut here. Screenshot, Markup, and ShareTake a screenshot, edit it, and share it. Get the shortcut here. Pause MediaIf media is playing, pause playback. Get the shortcut here. Run Shortcut From FolderSelect and run one of your shortcuts from a specific folder. Get the shortcut here. Blinds After 9Open the blinds/shutters via HomeKit only if you’re on your home WiFi network and if it’s after a certain hour of the day. Get the shortcut here. Apple TV Apple TV+ LauncherLaunch different sections of the Apple TV+ service in Apple’s TV app. The shortcut supports the Apple TV+ front page and individual shows, and can be customized to launch more shows or movies. Get the shortcut here. Wake TV and Set LightsWake up an Apple TV on the local network and, if it’s past sunset, dim the lights in the room. Check if the current time is after predicted sunset time for today. Add a HomeKit scene that will dim the lights. Get the shortcut here. Wake Apple TVWake an Apple TV on the local network and show the remote control for it on an iOS device. Best used as a widget for fast activation. Get the shortcut here. App Store Redeem iTunes CodeRedeem an iTunes code contained in the system clipboard. The shortcut will prompt you to pick a code you previously copied before launching the App Store’s redemption page, where the code will be already filled in. Get the shortcut here. App Store: SearchOpen the Search page of the App Store. Get the shortcut here. App Store: AppsOpen the Apps page of the App Store. Get the shortcut here. App Store: TodayOpen the Today page of the App Store. Get the shortcut here. App Release NotesCopy the release notes for the latest version of an app shared from the App Store. By default, the shortcut searches the U.S. App Store, but you can change the country to your locale. Get the shortcut here. App Store: GamesOpen the Games page of the App Store. Get the shortcut here. App Store: ArcadeOpen the Apple Arcade page of the App Store. Get the shortcut here. Save App Store ScreenshotsSearch the App Store for an app and save screenshots from the product page to the Photos app. Get the shortcut here. App Store: UpdatesOpen the Updates page of the App Store. Get the shortcut here. Scan iTunes Gift CardScan an iTunes gift card, extract its text, and open the App Store to redeem the associated promo code. You can import an image of a gift card from the clipboard or take a new picture. Toolbox Pro is required for this shortcut. Get the shortcut here. App Store Story as Safari Reader ArticleRead an App Store story (from the ‘Today’ tab) as a text-only webpage, cleaned up by Safari Reader. To run the shortcut, copy a link to an editorial story from the App Store first. Get the shortcut here. Save App to TrelloSave an app from the App Store as a card in Trello. The app’s icon, title, and other metadata are used to compose a rich card in Trello. Get the shortcut here. App Store: SubscriptionsOpen the Subscriptions page of the App Store. Get the shortcut here. Save App Store IconSearch the App Store for an app and save its icon to the Photos app. Get the shortcut here. Copy App LinkSearch for an app on the App Store, then copy its link to the system clipboard. Get the shortcut here. Calendar Upcoming EventsView your next five calendar events in a list. The selected event will be opened in the system Calendar app. This shortcut can be used from the widget. Get the shortcut here. Days Until…Calculate how many days are left until a date you can type in natural language. The shortcut was designed in English, but can be adapted to other languages as well. Get the shortcut here. Load Calendar SetThis shortcut lets you reopen one of your existing calendar sets in Fantastical. Optionally, you can also pair a specific set with a specific calendar view in Fantastical. The shortcut works on iOS, iPadOS, and macOS, and it uses Fantastical’s native Shortcuts integration. Get the shortcut here. Create Event From DateCreate a new calendar event based on a date passed to the shortcut as input. Get the shortcut here. Time Until Important Event LocationCalculate how much time you have until an important event comes up. If you specify a location to filter important events, driving time to the selected address is also calculated by the shortcut. Get the shortcut here. Fantastical Schedule (Multi-Platform)View Fantastical’s schedule for today using native app shortcuts for the iPhone and iPad versions of the app. The shortcut doesn’t require any user interaction to choose platforms. Get the shortcut here. Calendar LocationsGet a list of upcoming calendar events that contain locations. Get the shortcut here. Travel Time to Next Calendar EventCalculate travel time to get to the next calendar event that has an address attached to it. The shortcut can be configured for different transportation methods and can be invoked from Siri or the widget. Get the shortcut here. Create Calendar Event from TemplateCreate a new calendar event choosing from a list of templates. Templates are represented by a Dictionary action at the beginning of the shortcut and they support customization for calendar name, location, duration, notes, alert time, and the all-day setting. The shortcut will only ask to confirm the event’s title and start date. This shortcut was originally created for members of Club MacStories. Get the shortcut here. Weather for Upcoming EventsGet the weather forecast for the location of an upcoming calendar event. Get the shortcut here. Days In a MonthList of months and how many days they have. Get the shortcut here. Contacts Multilingual iMessage DictationDictate an iMessage to a friend from a widget. The dictation language is set automatically based on the recipient’s address stored in their contact card. iMessages are sent in the background, but you’ll be asked to confirm the message before sending it. Get the shortcut here. Message Last PhotoQuickly send the last photo you’ve taken on your device to a contact over iMessage. The shortcut supports both photos and screenshots, but you can add filters to remove one of the two media types. Get the shortcut here. Share Song with ContactAdd the currently playing song to an Apple Music playlist and tell one of your favorite contacts about the addition by sending them an iMessage. Get the shortcut here. Quick ContactCreate a new contact from the Shortcuts app or Siri. The new contact is created using the Name, Email Address, Company, and Notes field. This shortcut requires the app Quickness to be installed. Get the shortcut here. Invert NamesGiven a list of last and first names separated by a comma, the shortcut inverts their position and returns a plain text list of first names followed by last names. Get the shortcut here. WhatsApp LauncherOpen a WhatsApp conversation for a selected contact. The shortcut needs to be configured for contacts that have a Country in their contact card’s Address field; the country and its phone prefix (country code) have to be added in a list at the beginning of the shortcut. Get the shortcut here. Email Mail MergeA mail merge shortcut that supports multiple variables for email addresses and a second piece of information for each recipient. Each email address is automatically paired with the corresponding variable in the second group. Supports customizable message and subject templates. Get the shortcut here. Evernote Get Evernote LinksSearch your Evernote account for a specific note and copy its link to the system clipboard. Your can choose whether you want to copy the shareable URL or the local Evernote URL scheme for that note. Get the shortcut here. Evernote ScratchpadQuickly append text or an audio recording to a note called Scratchpad in your Evernote account. Audio will be recorded using Shortcuts’ native microphone access and recording UI; the audio file supports inline playback within Evernote. Get the shortcut here. Evernote ArticleTurn any web article into a clutter-free Evernote note that maintains formatting but removes extra visual elements from the original webpage. The shortcut has to be run in the extension from Safari or Safari View Controller. Get the shortcut here. Save Safari Webarchive EvernoteGenerate a .webarchive version of the current Safari webpage and save it in the Evernote app. The shortcut needs to open Evernote for iOS and is also supported in Safari View Controller. The title of the original webpage is copied to the clipboard for easy pasting in Evernote’s title field. Get the shortcut here. Save Quote to EvernoteSave selections from Safari webpages as highlights in Evernote. Ideal for articles that will have multiple highlights, which will be appended to the same note. The shortcut integrates with the ShareQuote shortcut to make it easy to share highlights with iOS extensions later. Get the shortcut here. Twitter to EvernoteConvert a tweet URL into an embeddable rich text version that contains the original text and links of the tweet. The rich text is then appended to an existing note in Evernote. The shortcut cleans up shortened Twitter links, maintains author names, and lets you customize the list of Evernote notes to append tweets to. Get the shortcut here. EverSafariA comprehensive menu to save webpages from Safari as notes in Evernote. The shortcut supports saving links as rich text, .webarchive files, PDFs, plain text, or attachments. The shortcut can either create new notes or append to an existing note. See comments below for instructions on how to store a list of your favorite Evernote notebooks, tags, and notes. Get the shortcut here. Save to Evernote and ShareSave any file shared with the Shortcuts extension to Evernote as a new note. At the end of the shortcut, an Evernote link to the note is copied to the clipboard. Get the shortcut here. Append Links to EvernoteAppend a link to an existing note in Evernote. The link is either passed to the Shortcuts extension or read from the clipboard. Get the shortcut here. Files Compress Dropbox FilesPick multiple files from Dropbox and share them as a single .zip archive. Get the shortcut here. Extract Individual Files from Zip ArchiveGiven a compressed archive passed as input via t"
