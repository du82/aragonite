full_description = "Our Setups Our desk setups. Federico (left) and John (right). It’s no secret that, here at MacStories, we like to experiment with different hardware and apps in the constant pursuit of more portable setups, more customizable apps, or more powerful workflows. And we recognize that, for readers, it can sometimes be…tricky to keep up with the “latest” state of our setups. With this Setups page, our goal is to provide readers with a summary of our hardware and software setups. The list will be updated on a regular basis over time. For more questions, feel free to reach out on Mastodon @viticci or @johnvoorhees, or ping us on Discord. Changelog January 16, 2025FedericoRemoved iPhone 16 Plus Added iPhone 16 Pro Max Added Nomad Magnetic Leather Back Removed PlayStation 5 Added PlayStation 5 Pro Added Kiloview N60 NDI encoder Removed Steam Deck OLED 1 TB Added Steam Deck OLED, Limited Edition White Added Official Steam Deck Docking Station Removed XREAL Air glasses Added XREAL One glasses Added Lenovo y700 2024 gaming tablet Removed MacPad Removed 4K 120Hz HDMI 2.1 dummy plug and USB-C to HDMI cable for Moonlight streaming Added AirPods Max USB-C Removed Legion Go and eGPU setup Removed Sofa Added Backloggd Added Pocket Casts Removed Lire Added Unread Removed Reminders Added Todoist Removed Apple Notes Added Obsidian Removed Spark Added Superhuman Removed GoodLinks Added Readwise Reader Removed Elgato FaceCam Pro Removed Elgato Key Light with Mini Mount Added Sony ZV-E10 II camera Added SD card (for MixPre and camera) Added Dummy battery for camera Added Neewer 12” ring light with stand and cold shoe mount Added Apple SD card adapter Removed Belkin 10K power bank Removed UGREEN Nexode 25,000 mAh power bank Removed Anker Nano II 65W and Anker 726 PowerPort III 65W Added UGREEN 300W 48000mAh Portable Charger Power Bank Removed CARROT Weather Added Mercury Weather Added SanDisk 1TB Ultra Luxe flash drive Added Files, Dropbox, and FileBrowser Professional Jo