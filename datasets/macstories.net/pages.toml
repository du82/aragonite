full_description = "The Latest from Comfort Zone, MacStories Unwind, and Magic Rays of Light By John Voorhees Enjoy the latest episodes from MacStories’ family of podcasts: Comfort Zone Chris has a first look at a new iPad stand, Matt is ready to drop out and have some fun, and a our Coldplay challenges pushes some of the gang to their limits. MacStories Unwind This week, Federico questions my character before discovering the joy of audiobooks, while I have been listening to more podcasts and have a question for listeners about which TV show he should watch next. Magic Rays of Light Devon and Jonathan highlight the premiere of German-language medical drama Berlin ER and go immersive arctic surfing on Apple Vision Pro. Comfort Zone, Episode 38, ‘The Son of a U.S. Something-or-Other’ Show Notes Weekly Topics MagFlött Pro Dropout Other Things Discussed Paul F. Tompkins on Make Some Noise Christmas Lights by Coldplay (YouTube) The Scientist by Coldplay (on YouTube) MacStories Unwind, ‘A Question of Character’ Show Notes Links and Show Notes Unplugged Segment Federico digs into John’s history as a sports fan. Picks Federico’s Pick: Co-Intelligence: Living and Working with AI by Ethan Mollick Audiobook version Audiobook on Audible Apple Books Digital Kindle Apple Books Print John’s Pick: Channels with Peter Kafka Which should I watch: Day of the Jackal Apple Cider Vinegar MacStories Unwind+ We deliver MacStories Unwind+ to Club MacStories subscribers ad-free and early with high bitrate audio every week. To learn more about the benefits of a Club MacStories subscription, visit our Plans page. Magic Rays of Light, Episode 158, ‘Berlin ER and Immersive Arctic Surfing’ Show Notes Guest Co-Host: Jonathan Reed Mastodon Bluesky Pre-Roll: Kids’ Screen Time ‎Pok Pok Playroom Highlight Berlin ER tvOS, visionOS, and iOS Betas Vision Pro to Gain Apple Intelligence, Spatial Gallery App, and Companion iPhone App Recipes Are Coming to Apple’s News+ Service Apple Intelligence to Expand to New Languages, the EU, and Vision Pro in April Releases Adventure: Deep Water Solo Extras Severance x JEOPARDY! Severance — Inside the Episode 206: “”Attila”“ Getting Severed From Parents’ Car Insurance | State Farm Severance — Music To Refine To feat. ODESZA The Gorge — Friendship Quiz with Miles Teller & Anya Taylor-Joy Ten Gorgeous Gorges You Can Actually Visit Immersive Recap Boundless: Arctic Surfing TV App Highlights La Cocina A Complete Unknown Presence Nickel Boys Up Next Conclave 50th Monologue – SNL50 (360°) Weekend Update: SNL’s 50th Anniversary – SNL50 (360°) Debbie Downer: Bar – SNL50 (360°) Running Point MacStories launched its first podcast in 2017 with AppStories. Since then, the lineup has expanded to include a family of weekly shows that also includes MacStories Unwind, Magic Rays of Light, Ruminate, Comfort Zone, and NPC: Next Portable Console that collectively, cover a broad range of the modern media world from Apple’s streaming service and videogame hardware to apps for a growing audience that appreciates our thoughtful, in-depth approach to media. If you’re interested in advertising on our shows, you can learn more here or by contacting our Managing Editor, John Voorhees. Tags: Comfort Zone, Magic Rays of Light, podcast, unwind JoinAccess Extra Content and PerksFounded in 2015, Club MacStories has delivered exclusive content every week for nearly a decade. What started with weekly and monthly email newsletters has blossomed into a family of memberships designed every MacStories fan. Learn more here and from our Club FAQs. Club MacStories: Weekly and monthly newsletters via email and the web that are brimming with apps, tips, automation workflows, longform writing, early access to the MacStories Unwind podcast, periodic giveaways, and more; Club MacStories+: Everything that Club MacStories offers, plus an active Discord community, advanced search and custom RSS features for exploring the Club’s entire back catalog, bonus columns, and dozens of