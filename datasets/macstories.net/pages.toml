["https://www.macstories.net/author/viticci"]
title = "Federico Viticci | MacStories"
description = "Federico is the founder and Editor-in-Chief of MacStories, where he writes about Apple with a focus on apps, developers, iPad, and iOS productivity. He founded MacStories in April 2009 and has been writing about Apple since. Federico is also the co-host of AppStories, a weekly podcast exploring the world of apps, Unwind, a fun exploration of media and more, and NPC: Next Portable Console, a show about portable gaming and the handheld revolution."
full_description = "Introducing NPC XL: More NPC, Every Week By Federico Viticci Welcome to NPC XL. Ever since Brendon, John, and I started our podcast about portable gaming – NPC: Next Portable Console – last year, I knew I’d found something special. It’s not just that the three of us are obsessed with handhelds and portable consoles; it’s that we work well together, and we’re having so much fun doing the show every two weeks. Who wouldn’t want to do even more with a project they love? So today, we’re announcing some big changes to NPC: We’re taking the regular show weekly, for free, for everyone! We’re introducing NPC XL, a members-only version of NPC with extra content, available exclusively through our new Patreon for $5/month. NPC is getting its own YouTube channel. With an expansion of the show, it made sense to let it grow beyond the MacStories YouTube channel. NPC is joining the (awesome) TWG Discord server with a dedicated channel for community feedback and participation. You can find our Patreon here, and we also dropped a surprise episode of NPC today announcing the expansion of the show: Now, allow me to spend a few more words on why we’re doing this and what you can expect from becoming a patron of NPC XL. Read more Gemini for iOS Gets Lock Screen Widgets, Control Center Integration, Basic Shortcuts Actions By Federico Viticci Gemini for iOS. When I last wrote about Gemini for iOS, I noted the app’s lackluster integration with several system features. But since – unlike others in the AI space – the team at Google is actually shipping new stuff on a weekly basis, I’m not too surprised to see that the latest version of Gemini for iOS has brought extensive support for widgets. Specifically, Gemini for iOS now offers a collection of Lock Screen widgets that also appear as controls in iOS 18’s Control Center, and there are barebones Shortcuts actions to go along with them. In both the Lock Screen’s widget gallery and Control Center, you’ll find Gemini widgets to: type a prompt, Talk Live, open the microphone (for dictation), open the camera, share an image (with a Photos picker), and share a document (with a Files picker). It’s nice to see these integrations with Photos and Files; notably, Gemini now also has a share extension that lets you add the same media types – plus URLs from webpages – to a prompt from anywhere on iOS. The Shortcuts integration is a little less exciting since Google implemented old-school actions that do not support customizable parameters. Instead, Gemini only offers actions to open the app in three modes: type, dictate, or Talk Live. That’s disappointing, and I would have preferred to see the ability to pass text or images from Shortcuts directly to Gemini. While today’s updates are welcome, Google still has plenty of work left to do on Apple’s platforms. For starters, they don’t have an iPad version of the Gemini app. There are no Home Screen widgets yet. And the Shortcuts integration, as we’ve seen, could go much deeper. Still, the inclusion of controls, basic Shortcuts actions, and a share extension goes a long way toward making Gemini easier to access on iOS – that is, until the entire assistant is integrated as an extension for Apple Intelligence."
