["https://www.macstories.net/linked/transit-can-now-track-underground-trains-without-gps"]
title = "Transit Can Now Track Underground Trains without GPS - MacStories"
description = "Earlier this month, Transit, one of my favorite apps of all time, gained an impressive new feature: the app is now able to track your train and warn you when you are about to reach your destination even when your train is underground. Previously, Transit had to rely on GPS and cellular service to precisely"
full_description = "Transit Can Now Track Underground Trains without GPS→ Linked By Niléane Source: Transit Earlier this month, Transit, one of my favorite apps of all time, gained an impressive new feature: the app is now able to track your train and warn you when you are about to reach your destination even when your train is underground. Previously, Transit had to rely on GPS and cellular service to precisely locate your train on its route, which meant it couldn’t reliably function as soon as you entered a subway tunnel. The way they have been able to achieve this is fascinating. Transit now utilizes the iPhone’s built-in accelerometer and analyzes its patterns to identify when the vehicle you boarded is in motion, and every time it reaches a station. The company’s account of the whole process is nothing short of impressive. The team spent a week riding buses and trains to collect data and proceeded to create an entirely new prediction model that is able to count down the underground stations that you will need to ride through to reach your destination. Transit says the model works completely offline and on-device. I know I’m going to give this new feature a try as soon as I get a chance to ride the Paris Métro next week. Source: blog.transitapp.comTags: app"
