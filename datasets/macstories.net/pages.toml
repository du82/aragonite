full_description = "Hands-On with Raycast’s New AI Extensions By Niléane Yesterday, Raycast unveiled AI Extensions as yet another addition to the app’s ever-expanding feature set. As we’ve covered on MacStories before, Raycast is a powerful launcher and command bar for the Mac with a sizable ecosystem of built-in and third-party extensions. Extensions allow the launcher to integrate with apps installed on your Mac as well as a multitude of online services such as Google Calendar, translation tools like DeepL, and even handy development tools like Color Picker and Git Commands. Starting this week, Raycast says it will be possible for any of these extensions to integrate with AI so they can be invoked with natural language directly from the app’s main command window and even chained together as part of complex workflows. Here are my first impressions. To start using AI-enabled extensions, head to the Raycast Store by typing the command “Store”, then select ‘AI Extensions’ in the dropdown menu of categories. When browsing the Store, you can identify AI-enabled extensions by the sparkle icon next to their download stats. As of writing, Raycast says it has already worked to enable AI for about 50 existing extensions. To invoke an AI-enabled Raycast extension, start typing a command with the “@“ symbol, and suggestions will highlight the ones you have installed. Once you’ve selected an AI extension, all you have to do is continue typing your command using natural language or choose one of the suggested prompts below the command field, where you will also find your recently used prompts for that extension. Invoke AI Extensions with the “@” symbol. Once an AI Extension is selected, continue typing using natural language, or select one of the suggested prompts. It’s easy to tell at first glance that AI Extensions mostly use LLMs as a layer of interaction for existing commands. For example, Raycast’s existing Apple Music extension allows you to search your music library and play albums, playlists, or individual tracks. While it is now AI-enabled, its capabilities remain limited to these specific functions. However, the addition of AI allows you to type in natural language and instruct the extension to chain together several of its existing commands to achieve the desired result. Here is how I prompted the extension to start playing an album from my library, even though I had forgotten its name, by searching for a specific song included in the album. In this instance, the Apple Music extension combined its ‘Get Library Albums’ and ‘Play Library Album’ commands to start playing the album I was looking for in the Music app: Prompt: “@music Play Feu Chatterton Album containing track ‘Monde Nouveau’”. In their current state, AI Extensions often encounter errors such as the ones you see in the above screenshot, which regularly result in the prompt failing to complete because the extension isn’t able to move past the error. Raycast is seemingly aware of the feature’s flaky performance, as it is actively encouraging users to send feedback using the built-in feedback form during the beta phase. That being said, AI Extensions show a lot of potential, especially when you start to play with some of the more system-grounded extensions. One example of this is the Finder extension, which lets you manipulate files and folders in surprisingly complex operations. Here is how I was able to list the files contained in my Downloads folder, batch rename them, and then move them into a new folder: Prompt: “@finder List my downloads.” Follow-up prompt: “Rename all of those PNG files to ‘sample-number.png’”. All five PNG files were successfully renamed.Follow-up prompt: “Put them in a folder named ‘sample’.The new folder was successfully created and now contains the renamed PNG files. These prompts amount to a series of file operations that, considering the speed at which Raycast operates, could end up saving a lot of time when dealing with a large number of files and folders. The productivity gains are even more significant when you combine multiple AI Extensions together. For instance, after moving those PNG files into a new folder using the Finder extension, Raycast allows me to invoke any other AI Extension to follow up with those files – at least in theory. Here, I attempted to invoke the Apple Notes extension to attach a selection of my PNG images to a new note. The operation seemed to work at first, but Raycast kept asking for Full Disk Access in System Settings, even though I’d already granted that permission on my system: Follow-up prompt: “@apple-notes Attach 1 & 2 to a new note.” Unfortunately, this operation repeatedly failed on my Mac. Granting the permission again in System Settings did not resolve the issue. To be fair, I had more luck combining multiple AI Extensions in simpler operations that did not rely on manipulating files in Finder. For instance, here is how I was able to invoke the Weather extension to look up the sunset time for my location, then ask the Calendar extension to create an event at that time. In this case, I used Raycast’s dedicated AI chat window: Combining the Weather and Calendar AI Extensions to create an event at sunset. On YouTube, the Raycast team has showcased several more complex use cases for AI Extensions: Even if it is hard at the moment to grasp the extent to which AI Extensions will be able to complement each other and create new types of workflows on the Mac, I’m glad to see Raycast move in this direction with its integration with LLMs. Putting in place a framework that can be leveraged by third-party developers and easily added to existing extensions seems like a great way to further position Raycast as a modular toolkit for a variety of use cases and workflows. Not only that, but Raycast’s approach with AI Extensions feels a lot closer to what I would have expected Apple to create with Shortcuts and Siri (or even Spotlight) as part of Apple Intelligence on the Mac. That being said, it will be interesting to see whether the Raycast team is able to resolve the recurrent errors AI Extensions currently run into. Reliability will be critical for AI Extensions to be embraced by the app’s paid subscribers and third-party extension developers. AI Extensions are now available in beta for Raycast Pro subscribers. Raycast Pro starts at $96/year. Tags: mac, Raycast JoinAccess Extra Content and PerksFounded in 2015, Club MacStories has delivered exclusive content every week for nearly a decade. What started with weekly and monthly email newsletters has blossomed into a family of memberships designed every MacStories fan. Learn more here and from our Club FAQs. Club MacStories: Weekly and monthly newsletters via email and the web that are brimming with apps, tips, automation workflows, longform writing, early access to the MacStories Unwind podcast, periodic giveaways, and more; Club MacStories+: Everything that Club MacStories offers, plus an active Discord community, advanced search and custom RSS features for exploring the Club’s entire back catalog, bonus columns, and dozens of app discounts; Club Premier: All of the above and AppStories+, an extended version of our flagship podcast that’s delivered early, ad-free, and in high-bitrate audio."
