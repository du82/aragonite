title = "WWDC 2023 - MacStories"
description = "Apple news, app reviews, and stories by Federico Viticci and friends."
full_description = "From Conference to Festival: The Evolution of WWDC By John Voorhees WWDC never gets old. There’s the excitement surrounding Apple’s announcements, but it’s far more than that. At its heart, the value of WWDC is in the people you see. Ten years ago, I attended my first WWDC ever as the parent of what is now called the Swift Student Challenge. At the time, I’d already begun dipping my toe into iOS development and arrived knowing nobody. By the end of the week, I’d met long-time indie developers like Daniel Jalkut, Craig Hockenberry, and Paul Kafasis, plus a couple of baby podcasters named Myke and Stephen. WWDC 2013. WWDC was in San Francisco in those days, which had its pluses and minuses. There were great restaurants and a vibrant nightlife, but the city was also crowded and expensive. I’m glad Federico got to experience that version of WWDC in 2016, but I was happy about the switch to San Jose. The city is sleepier than San Francisco, but the big courtyard outside the convention center and the handful of hotels people stayed at made it easier to bump into people than you could in San Francisco. Supported By Concepts Concepts: Concepts - Sketch, Note, Draw When WWDC kicked off this year, I could have comfortably sat at home at my desk in my home office, taking in the keynote. If I’d done that, I certainly would have written more and gotten podcast episodes out faster. Still, I would have lost something far more valuable: the chance meetings with MacStories readers, podcast listeners, developers of the apps we cover, and the Apple engineers and other Apple folks who work hard to make WWDC something special every year. Read more AppStories, Episode 337 – WWDC 2023: Swift Student Challenge Winners, The MacStories Interviews→ Linked By John Voorhees Federico and John also had the opportunity to sit down with three winners of the Swift Student Challenge in the Apple Podcasts Studio at Apple Park. It was fun and inspiring to chat with Damian Perez, Henri Bredt, and Maria Eduarda Cabral de Lucena. Sponsored by: Setapp – An efficient way to get and distribute apps on macOS, iOS, and web. Subscribe here. We deliver AppStories+ to subscribers with bonus content, ad-free, and at a high bitrate early every week. To learn more about the benefits included with an AppStories+ subscription, visit our Plans page, or read the AppStories+ FAQ. Permalink"
year_published = 2025
