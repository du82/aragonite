full_description = "Apple’s Commitment to AI Is Clear, But Its Execution Is Uneven By John Voorhees The day has finally arrived. iOS 18.1, iPadOS 18.1, and macOS 15.1 are all out and include Apple’s first major foray into the world of artificial intelligence. Of course, Apple is no stranger to AI and machine learning, but it became the narrative that the company was behind on AI because it didn’t market any of its OS features as such. Nor did it have anything resembling the generative AI tools from OpenAI, Midjourney, or a host of other companies. However, with today’s OS updates, that has begun to change. Each update released today includes a far deeper set of new features than any other ‘.1’ release I can remember. Not only are the releases stuffed with a suite of artificial intelligence tools that Apple collectively refers to as Apple Intelligence, but there are a bunch of other new features that Niléane has written about, too. The company is tackling AI in a unique and very Apple way that goes beyond just the marketing name the features have been given. As users have come to expect, Apple is taking an integrated approach. You don’t have to use a chatbot to do everything from proofreading text to summarizing articles; instead, Apple Intelligence is sprinkled throughout Apple’s OSes and system apps in ways that make them convenient to use with existing workflows. If you don’t want to use Apple Intelligence, you can turn it off with a single toggle in each OS’s settings. Apple also recognizes that not everyone is a fan of AI tools, so they’re just as easy to ignore or turn off completely from System Settings on a Mac or Settings on an iPhone or iPad. Users are in control of the experience and their data, which is refreshing since that’s far from given in the broader AI industry. The Apple Intelligence features themselves are a decidedly mixed bag, though. Some I like, but others don’t work very well or aren’t especially useful. To be fair, Apple has said that Apple Intelligence is a beta feature. This isn’t the first time that the company has given a feature the “beta” label even after it’s been released widely and is no longer part of the official developer or public beta programs. However, it’s still an unusual move and seems to reveal the pressure Apple is under to demonstrate its AI bona fides. Whatever the reasons behind the release, there’s no escaping the fact that most of the Apple Intelligence features we see today feel unfinished and unpolished, while others remain months away from release. Still, it’s very early days for Apple Intelligence. These features will eventually graduate from betas to final products, and along the way, I expect they’ll improve. They may not be perfect, but what is certain from the extent of today’s releases and what has already been previewed in the developer beta of iOS 18.2, iPadOS 18.2, and macOS 15.2 is that Apple Intelligence is going to be a major component of Apple’s OSes going forward, so let’s look at what’s available today, what works, and what needs more attention. Siri Siri’s fancy new animation. Siri announces itself with a flourish in Apple’s latest OS updates. Trigger it on your iPhone, for example, and a shimmering, iridescent glow animates around the edges of your screen as long as the assistant is active. Similar animations play on the iPad and Mac, too. It’s a very cool effect that sets high expectations Siri can’t live up to because many of the features Apple has planned for it won’t be out for months to come. Down the road, the company says you’ll be able to ask the assistant to perform tasks in apps on your behalf using the technology underlying Shortcuts. Apple also promises that Siri will understand your personal context. If Apple can pull that off, Siri will be leagues ahead of where it is today, but it’s not there yet. Siri uses the questions that precede it as context for follow-up requests. Still, there is more to Siri in today’s updates than just a fancy animation. It may not understand your personal context yet, but Siri does have contextual awareness in the sense that it can now follow the meaning of multiple requests made one after the other. Here’s a simple example: Me: “What time is it in Rome?” Siri: “1:20 AM.” (Correct.) Me: “What’s the weather there?” Siri: “62°F.” (Also correct) Me: “How do I get there?” Siri: Opens Maps to show me where I am and where Rome, Italy is, as well as to let me know Maps can’t do overseas directions. That sort of interaction is handy. I didn’t have to repeat “Rome” every time I spoke, and even though personal context is not incorporated into Siri yet, the assistant responded (perhaps coincidentally) with information for Rome, Italy, which is far more relevant to me personally than a town like Rome, Georgia – even though Georgia is far closer to my home. Siri also does a better job than before of understanding if you trip over your words and correct yourself. That means if you ask about the weather in Philadelphia and, halfway through speaking your request, you say, “No, I mean Baltimore,” Siri will understand and give you the weather conditions in Baltimore. It’s a small change that will make a big difference if you’re like me and find yourself self-editing requests aloud. Siri is the Kbase now. Siri also now supports documentation for Apple products. If you ask how to turn on Dark Mode, for example, you’ll get a simple list of instructions pulled from the iPhone User Guide. I don’t foresee myself using this much, but it’s easier than opening Safari and typing a search, even if the same information is often the first result of a Google search. Perhaps the biggest change of all is the new ability to type requests to Siri. The assistant defaults to verbal requests in most cases, but you can tap a result on the iPhone or iPad to edit it and even use a completely different query if you want. You can also double-tap on the bottom of an iPhone or iPad’s screen, use Globe + S on any compatible keyboard, or enable a double-tap on the Command button on your Mac’s keyboard to activate Siri. On the Mac, you can also drag the Siri text field anywhere onscreen, where it will sit pinned above your other windows, ready to take requests by voice or typing at any time. Using Type to Siri to quickly capture tasks and events. Of all the changes to Siri in today’s updates, Type to Siri is by far the most useful. On my Mac, I can leave it open at all times and, with a double-tap of the Command key, add a task to Reminders or an event to Calendar. It solves the problem of neither app having a global hotkey for quick entry. I’m not sure what other uses I’ll find for Type to Siri in the future, but for now, jotting down tasks or events as they come to me is plenty. So far so good, but there’s one big caveat when it comes to Siri: it’s the same old Siri that isn’t any smarter than it was before today’s updates. It can pull information out of apps like Contacts, Calendar, and Messages, which isn’t new, but the results remain spotty at best. I can reliably get Siri to find a phone number or email address from Contacts and show me my schedule, but it often gets stuck in a particular mode, which leads to incorrect or unhelpful results. I guess maybe I should be flattered that Siri expected to find Brad Pitt in my contacts. For example, if I’ve asked about people in my contacts and then ask, “Who is Brad Pitt?” Siri is likely to tell me that there’s no one by that name in my contacts. Fair enough, but that’s not what I meant. I wanted information on the actor instead. If, however, I follow a question about someone in my contacts with a request for the weather forecast and then ask who Brad Pitt is, I’ll get a short bio of the actor. “What did Jennifer tell me about Christine?” I’ve seen the same sort of behavior in Messages, too. If I’ve asked a question that requires a web result and then ask Siri something like, “What did Jennifer tell me about Christine yesterday?” I’ll get Google results, including an obituary for someone named Jennifer Christine. If I follow that with, “Who is Jennifer?” Siri will open my wife’s contact card. Then when I follow up by repeating my question, “What did Jennifer tell me about Christine yesterday?” Siri will read an excerpt from my iMessages with Jennifer containing the information I wanted to remember. The order of requests shouldn’t matter, but it does because Siri seems to get stuck in a particular mode and doesn’t always handle switching to another gracefully. Siri is good at showing you your schedule for a particular day, too. However, it struggles to find individual events unless you phrase them exactly as they’re written in your calendar, and even that rarely works. For example, I asked Siri when Michael’s birthday is. I figured it would tell me about my nephew Michael’s birthday, which is on my calendar a few days from now. Instead, it told me that Michael Jackson was born on August 29th, 1958. I guess there’s just One True Michael. Apple’s marketing promises results Siri can’t yet deliver. Source: Apple. Siri’s data retrieval struggles aside, it’s still good at setting timers, including multiple timers. It will find people in the Contacts app, tell you the time and weather, provide driving directions, and search the web. However, Siri could already do those things. Its ability to understand multiple requests made in a row, respond better when you trip over your own words, and accept typed requests are all meaningful improvements to the feature, but its core “intelligence” is still a problem. Siri’s new features are welcome, but the UI and Apple’s marketing of Apple Intelligence have written a check that Siri can’t cash yet. To be fair, Apple has said additional Siri “smarts” are coming later. If so, why enable new interaction modes now? Siri’s new features are welcome, but the UI and Apple’s marketing of Apple Intelligence have written a check that Siri can’t cash yet. I appreciate the new features; however, what I really want is personal contextual awareness and App Intents-powered automations. Reduce Interruptions Reduce Interruptions is easily one of my favorite Apple Intelligence features. As I’ve been writing this review, I’ve turned to Apple Intelligence’s new Reduce Interruptions Focus mode multiple times. It’s similar to Do Not Disturb, but it still lets through some notifications that it deems important, which is a key difference. In my experience, Reduce Interruptions works well. Today as I was writing, a call came through from my wife, and I saw a notification of a text message from Federico, neither of which I’d want to be blocked. What didn’t get through were messages from Discord where some MacStories team members were chatting about iOS 18.2. Now, I could have (and have before) created Focus modes with elaborate rules about which people and apps can break through while I’m working, but with Reduce Interruptions, I’ve been able to dispense with those other Focus modes and simply turn it on when I need some “mostly quiet” time. There’s also a new ‘Intelligent Breakthrough & Silencing’ toggle in Focus mode settings that allows you to apply a similar effect to any Focus mode. So far, though, Reduce Interruptions has been all I’ve really needed. Two thumbs up, would enable again. Photos Erasing a lawn chair with Clean Up. There are three Apple Intelligence features available in the Photos app: Clean Up Memory Movie creation Improved search Like similar tools I’ve used for years, Clean Up lets you tap, circle, or paint over an item in a photo with your finger to remove it. My first test was to erase a lawn chair from a grassy field. Clean Up did an excellent job, replacing the brightly colored chair with grass. If I zoomed in closely, I could tell that the grass was different from the area surrounding the edit, but if I were flicking through my photos and didn’t realize that one had been edited, I doubt I would have noticed. However, I do appreciate that the feature adds an ‘Edited with Clean Up’ message in the photo’s metadata and that it’s non-destructive, meaning it can be reversed at any time. In my experience, Clean Up works best with image elements that have clearly defined outlines with good lighting and high contrast. Apple Intelligence confusing a pint of Guinness with a coffee in a “Coffee Time” Memory Movie. The second feature, which is only available on the iPhone and iPad, is the ability to create Memory Movies based on text prompts. I’m sure a lot of people will want to try this as soon as they install iOS or iPadOS 18.1, but you’ll have to be patient if you have a big photo library. Apple Intelligence processes photos when your device is connected to power, and depending on how many photos you have, it can take days. I installed iOS 18.1 on my new iPhone 16 Pro Max on Friday, September 20, and it was still processing photos on Sunday afternoon. I’m not sure when it finished, but it eventually did. Apple suggests prompts to help get you started with Memory Movies. My results with Memory Movies have been mixed. Using “At the coffee shop” as a prompt was just as likely to include a photo of a bar or restaurant as it was a coffee shop. The feature also has a short memory when it comes to concepts like your home. I picked one of Apple’s suggested prompts, “Home love and laughter,” and the results were all photos taken where I live now; there wasn’t a single picture from the decades I lived in Illinois. Still, the time saved is worth it because it’s easier to generate a Memory Movie that mostly works and edit it than it is to start from scratch. I don’t have a lot to say about Photos’ search, which now supports natural language and can find frames inside of videos, too. I’ve always thought search worked reasonably well in Photos, and it still does. It seems to handle a wider range of requests that don’t need to be as tightly defined as before, though, which is welcome. Overall, Photos’ Clean Up feature works well. We can debate whether erasing people and other things from pictures is a good thing because it alters the reality of what was captured. In my opinion, it’s wild and a little disconcerting to completely erase someone you know from one of your photos as opposed to someone in the background who photobombed your family portrait. But in practice, I expect Clean Up will primarily be used to remove smaller distractions in a way that will improve the images without distorting reality in a meaningful way. Improved search and simpler Memory Movie creation are examples of artificial intelligence implementations that show off how it can make it easier to access and enjoy large collections of information. With so many people carrying tens of thousands of images on their iPhones and other devices, leveraging AI to make them more accessible is a win, although it’s disappointing that Memory Movies generation isn’t available on the Mac, too. Writing Tools Apple Intelligence features several Writing Tools."
