title = "Oil pastels are not pencils - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Oil pastels are not pencilsFeb 15, 2019 — by Michael Rose in NotesNot to overstate the obvious here, but oil pastels do not behave like colored pencils.Their size and shape should have been enough to clue me into that fact, but I proceeded to use them like a pencil anyways. Punished severely for this ignorance I was.Made a slight recovery when I began using the tool like I would with oil paint. Globing on specks of color, and letting them mix with each other naturally. They don’t quite have the mixing quality of paint, but with a finger or blending stumps pigment can be pulled about.Attempting to create form with precise strokes is totally not the way to approach oil pastels.Tools UsedPentel Arts Oil Pastels, 25 CountJack Richeson Blending Stomp, 3/8″Made Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: DrawingTILCSS blur effectConfiguring publishing sources for GitHub PagesMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
