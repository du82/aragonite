full_description = "The Killing JokeSep 7, 2017 — by Michael Rose in PaperFaces iPad projectWhile browsing through Mix looking for inspiration I came across a drawing shared by 赵 志欣 of Heath Ledger from The Dark Knight.I gave it a star to bookmark it for later, and then during the holiday weekend I got around to enhancing it some. I started by reworking the placement and proportions of the face and hand using an image of the Joker from one of the film’s posters.Using a soft and more loose approach, I painted with white to pull out highlights from the darker background. Followed by painting blue tones over the entire canvas to mimic the colors found in the poster. As always I finished up with pencil strokes to sharpen edges and correct any paint strokes that might have bleed more than I liked.Tools used:Pencil by FiftyThreePaper by WeTransferMade Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: Paper appPortraitHooded Girl that HidesTiger StyleMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.Related entriesTiger StyleHooded Girl that HidesYou Need a Mouth to Mumble"
