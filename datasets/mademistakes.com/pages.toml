["https://mademistakes.com/notes/diy-record-cube-back-spacers"]
title = "DIY record cube back spacers - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = 'DIY record cube back spacersFeb 22, 2024 — by Michael Rose in NotesFor the longest time, it has driven me mad that my records get out of alignment any time I slide one out to play. To solve this problem, Turntable Revival sells wooden back spacers for cube shelves (Ikea Kallax, Target Threshold, Walmart - Better Homes & Gardens) to straighten your records out.To save a buck I decided to MacGyver a cheap solution with black foam board and double-sided tape.ProcedureStep 1: Measure the length of each cube. I have two 6-cube Target Threshold organizers, with each cube measuring 13 ½" wide.Measure the empty shelf space to determine the back spacer’s size.Step 2: Grab a record, place it to the far left and align it with the cube’s back edge. Then measure the distance from the record’s spine to the front of the cube. For my shelving, this ended up being 2" deep.Pro tipTo leave room for lighting (or if you want the records recessed some) subtract about an inch from the measurement in step 2.Step 3: With a ruler and a pencil add guidelines to the foam board and use a sharp utility blade to cut the spacers.I took a 16" x 20" foam board, cut the shorter side down to 13 ½" and then cut that down at 2" intervals — ending up with 10 back spacers.Step 4: Using rubbing alcohol and a paper towel, clean the bottom side of each cube you’re adding a spacer to. Once dry, cut a strip of double-sided tape for each spacer and remove one side of the backing.Place the tape (sticky side down) onto the spacer and run your finger over it to make a good connection. Then remove the top piece of backing and place the spacer into the shelf making sure its edge is aligned with the back of the cube.Press down firmly on the foam board, using a circular motion to fully adhere the tape to the shelf.Step 5: Slide a record into the cube shelf and verify you are happy with the placement. Repeat the process for the remaining cubes.Made Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: TutorialsVinyl recordsGoodbye Gatsby, Hello HugoAnd just like that, I was done with NetlifyMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.'
