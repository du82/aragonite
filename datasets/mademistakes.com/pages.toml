title = "Drawing clouds and skies with Paper - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = 'Drawing clouds and skies with PaperJul 30, 2021 — by Michael Rose in Mastering PaperPaper by FiftyThree makes painting realistic skies and clouds a breeze. If you had fun drawing trees, just wait until you fluff out happy clouds that would make Bob Ross proud. Honestly, with just a few washes of watercolor and strokes of pencil, you’ll have an instant masterpiece. Here…let me show you how.Blue skies fadeLet’s start with the easier of the two, a nice bright blue sky. One of the more important steps is choosing a blue to paint with. The hue…the saturation…and the brightness all play a role in the overall emotion of the piece. I tend to mix in a swirl of green and keep it slightly over saturated to contrast against skin tones as seen in my many PaperFaces portraits. If you’re going for doom and gloom, back off the blue and mix in gray instead to set the foundation for an overcast sky.With the base sky color mixed, select the pencil tool and draw a line across the screen to represent the horizon. This step isn’t always necessary, so if you’re a pro and don’t need the help of a guide feel free to move on.Watercolor base coatPrep work complete, now you can start the actual painting of the sky. What you’re trying to accomplish with this step is a smooth coat that gradually fades to white as you approach the horizon line. The easiest way to do this is with the watercolor brush, starting from the top of the composition, working down in a slight zig zag pattern.When painting, do not lift the stylus or your finger from the screen until you finish this first coat. The trick is to move very slow near the top, and progressively speed up the zig zag pattern as you approach the horizon line. Depending on how gradual of a fade you want in the sky, multiple coats may be required. Follow the same pattern from before to keep everything looking smooth.Painting puffy cloudsNow comes my favorite part, painting happy clouds ala Bob Ross1. Sticking with the watercolor brush, we’re going to fluff a few clouds in using short circular strokes. If you have a Pogo Connect Smart Pen, you can control the amount of background lightening easier. But if you don’t, just focus on making quick strokes — the faster the better.Pro tip: go easy on the whiteWhite lightens quickly and you don’t want to remove too much blue at once, so be careful with this step. If you remove too much, just rewind and try again.The technique I use for fluffing in clouds with the brush is very similar to how I create leaves.With the clouds shaped and looking like clumps of cotton, it’s time to add a few wispy cirrus clouds and clean the edges up. Again, a Pogo Connect Smart Pen comes in handy, allowing you to work lightly and gradually. Finger painters and normal stylus creators fear not, quick strokes can achieve the same results.No need to overdo it with the wisps, just a few light crosshatches is all that’s needed. For those longer streaky clouds your pencil strokes should be longer and more horizontal. I usually stick with just a pencil to create these wisp textures, but if you’re feeling adventurous a light touch of white watercolor can be used to finish them off.Don’t be afraid to go back into the clouds with the blue color we initially painted the sky with. The same “streaky” pencil pattern used to draw wisps (see above) can be used to add subtle cloud shadows. I often flip flop between blue and white to get the detail just right.Adding subtle blue shadows to the larger fluffy clouds followed by the finished result.Sunsets and fire skiesTo paint a sunset, I use the same exact techniques and process. The only difference is the addition of three to four colors to create all the sunset fades and multi-colored clouds.Fiery red skies and silhouetted foreground subjects look super dramatic, so that’s what I’m going to demonstrate in the following steps. Remember, color is extremely subjective, I’m merely showing a few examples to get you started. Feel free to experiment and vary them up — there is no right or wrong here.We’ll start by mixing orange into red and then draw a light line at the sky’s horizon to act as our guide. Select the watercolor brush and apply paint from the horizon line up — in the opposite direction from before. Remember the zig zag pattern we used earlier to paint a blue sky? Good. Because it’s going to come in handy here.Just like the blue sky from before, paint slowly from left to right, slightly overlapping the row before without lifting your pen or finger. As you approach the top of the sky move faster to fade the color into the background.Gradations of colorA few coats to build up the sky into a smooth gradation of color may be necessary. What you’re looking for is a darker red at the horizon, that gradually fades into the background about halfway up from the top. I fade the red around halfway to leave room to fade a dark blue-violet down from the top in this next step.After you’re satisfied with the red coat, mix a dull and dark blue gray to paint the other half of the sunset. Use the same zig zag painting pattern, only this time start in the upper left corner and work your way down. As you approach the faded red, paint faster to fade into the background just before it, leaving about an inch of background between.Don’t be afraid to rewind and redo your gradations. I usually don’t get the shape and fade right on the first try.You could leave the sunset washes as is and proceed to drawing clouds, but if you want to add even more drama to the sunset, apply a thin wash of yellow. I like to mix a creamy color like so:And paint a light coat over the red, background area in the middle, and gradually fade into the blue.Pro tip: speed mattersPaint faster as you approach the blue wash to avoid turning it into a green color. Yellow and blue make…Sunset cloudsTo add clouds to our sunset let’s start by mixing a red into white. You want a pink color that has just enough white in it to lighten while you paint — some trial and error may be necessary to get the mix right. Once you successfully mixed a pink, fluff in a few clouds using short circular strokes (same technique used in the blue sky).Giving these clouds depth and dimension can be achieved by adding a little more red to the mix. You’re looking to add just enough to make the color translucent instead of opaque. A few strokes is all that’s needed when applying red tinted shadows to the clouds.Pro tip: find the right mixIf you don’t add enough red to the color mix, the watercolor brush will lighten the cloud instead of darkening it.A pencil filled with a pinkish red is also perfect for refining clouds edges or drawing in long wispy clouds.An added benefit of painting a sunset, is how it reacts with objects that are placed in silhouette. You can draw or paint almost anything and fill it with a dark color to add drama to your creation. The outline of a figure in the foreground, hills and mountain tops, or a half circle at the horizon to represent an eclipsed sun are all appropriate choices.Variations on a themeUsing all of these techniques I was able to create a variety of backdrops for the portraits in my PaperFaces Project. Below are finished skies and clouds to show what is possible by varying the color and composition.Next up — the perfect landscape compliment to happy trees and clouds, crashing waves and water.Watching Bob Ross paint on his PBS show, The Joy of Painting was an influence on me during my high school years. The techniques I use to paint with Paper by 53 have been adapted from him. RIP in you silly son of a gun. ↩︎Made Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: DrawingPaper appTutorialsDrawing trees and grass with PaperDrawing water with PaperMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.17 commentsJosh Medeski · Sep 6, 2013I’m really enjoying this series, thanks so much!Guest · Sep 9, 2013Love these Mastering Paper articles. Very helpful! Thanks!elysdir · Sep 17, 2013This is great–thank you very much for providing these tutorials! Really useful.Two questions about this one:I don’t quite understand what you’re doing to create the cloud wisps. Is that the pencil tool? And is it more like shading, or crosshatching, or just a few individual lines? In your closeup (with the arrows drawn on it), it looks like a few short angled individual lines, but in the finished piece it looks more like a few longer almost-flat individual lines, and somewhere in one of the sample image writeups (which are also really useful!) I think you said something about shading.I’m not understanding why/when the sun would appear as a silhouetted black half-circle–isn’t the light of the sun what’s causing other things to appear as silhouettes?Thanks again, and I’m looking forward to the rest of the series!"Michael Rose · Sep 17, 2013Yes. It’s kind of like crosshatching. I use that to build up the beefier parts of a light and thin cloud. For the really thin streaky ones it’s basically just some horizontal pencil strokes. I use shading more in the fluffier clouds to add roundness to some parts.And you’re right on the sun being lit and everything else in silo. I went with a more dramatic eclipse that you’d almost never see. Just my artistic interpretation.Don · Sep 20, 2013Thank you for these great tutorials. I appreciate he very helpful attention to detail and really well written text\r\nEloquent exposition… beautiful art.Looking forward to more. Thanks again.Shelina Valmond · Sep 26, 2013Love the series and can’t wait to see animation. I am new to drawing but not to paper if that makes sense. Excited to see how everything fits together.Angelic Peraga · Feb 27, 2014Thanks for a big help. I love what you do.. Please continue to do more tutorials like this. I’m a frustrated artist. I can’t wait for more tutorials. :)Michael Rose · Feb 27, 2014Thank you so much. I have a few I’m working on now so hopefully the wait isn’t too long.Anything in particular you’d like to see a tutorial of?Angelic Peraga · Feb 28, 2014I’d love to see a city wise. Sky scrapers. I drew something. I tried your clouds and the silhouette. Turned out okay for a beginner like me. I can’t wait for your portrait tutorials :)Michael Rose · Feb 28, 2014This looks pretty good to me!Cityscapes is a good one. I’ve done a few buildings and such that I could probably turn into a tutorial. Drawing buildings can get complicated fast, especially when trying to get the correct perspective and all that.Rob · Mar 4, 2014Love the website! Keep up the good work.Nan · Apr 3, 2014Michael, help. Brand new to this app. How do you flip to a new page after you’ve finished a painting without backing out of the app and launching it again?Thanks for your response!Michael Rose · Apr 3, 2014If you pinch the page in the center of the canvas as if you were folding it in half it will zoom out to a view where you can add a new page or go to another journal.You can also flip through pages by swiping from the left or right edges inwards. Doing a swipe from the right edge on the last page of a journal will create a new blank page.On FiftyThree’s support site they have videos that show all of these gestures in action if you need a visual.Frances · Apr 20, 2014Thanks Michael for sharing all these tutorials! I had the paper app for a while, but I discovered this site a few days ago and now I can’t stop drawing. I finally start to understand how to make the most out of it and I already see a big improvement.Keep up the great work and I am looking forward for more, especially how to draw faces!gerard · May 22, 2014Hi, what strokes did you do to make the clouds? Thanks for the tutorial by the way. Looking forward to your next tutorial.Michael Rose · May 22, 2014Quick watercolor strokes in a circular motion using white to rough out the big clouds.For the thinner clouds that streak across the sky I used a white pencil with criss-crossing strokes. I used the same technique to define the edges of the larger clouds too.Show all 17 commentsRelated entriesDolphin whispererHalf peekabooSweater weather'
