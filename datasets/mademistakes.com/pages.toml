full_description = "Tag: Web developmentSelect works from my portfolio along with thoughts on HTML, CSS, JavaScript, and other front-end development topics.Related topics: Tutorials Web development Static sites Design Open sourceJekyll themesOpen source Jekyll themes to get you started building a site or blog on GitHub Pages, Netlify, and other hosts.And just like that, I was done with NetlifyFeb 29, 2024 ~ Read in 4 minsAs someone who uses Netlify’s Starter plan to host this site, the following situation is the kind of nonsense that keeps me up late at night…Goodbye Gatsby, Hello HugoJan 14, 2023 ~ Read in 11 minsHugo has ruined me. Other static site generators that rely on community plugins and copypasta to fill out their gaps don’t cut it anymore…URLs and links in JekyllJul 20, 2021 ~ Read in 18 minsHow Jekyll uses URLs and how to link posts, pages, assets, and other resources together.Jekyll’s site.url and baseurlJul 11, 2021 ~ Read in 6 minsLearn what Jekyll’s site url and baseurl variables are and how to properly set them with relative_url and absolute_url filters to avoid broken links and 404 errors.Not so quick with the Gatsby site optimizationsJun 22, 2021 ~ Read in 7 minsThis is the post where I talk about neglecting the site and pledge to blog more… wait, wasn’t I suppose to do this on January 1st?2 Little RosebudsCreative and site development for 2 Little Rosebuds — a blog all about subscription boxes.Twenty NineteenJan 1, 2020 ~ Read in 10 minsFirst time doing a year in review post. The statistics contained are just for fun as there’s nothing to compare them against yet.Autumn refreshNov 12, 2018 ~ Read in 4 minsUsing CSS Grid Layout Module to redesign a Jekyll site and further improve performance and accessibility.Optimizing and automating my Jekyll site buildAug 30, 2017 ~ Read in 17 minsLessons learned from building, optimizing, and deploying a huge static site with everyone’s favorite SSG — Jekyll.Styling language specific code blocks with JekyllMay 16, 2017 ~ Read in 2 minsInteresting styling possibilities with Kramdown syntax highlighted code blocks in Jekyll.Relic ScoutSite design and creative for Relic Scout — an app to make collecting simpler, while saving you money.Eko WaveSite design and creative for Eko Wave — a team specializing in niche applications.Basically Basic Jekyll themeYour new Jekyll default theme.Accessing static files in JekyllJan 30, 2017 ~ Read in 4 minsLearn how to use static files with Jekyll to create a gallery of images automatically without a plugin.Improving Staticman comments on a Jekyll siteDec 8, 2016 ~ Read in 13 minsHow to use Staticman to add threaded comments and reply notifications to a static-based Jekyll site.HTML inside Kramdown table cells with JekyllNov 8, 2016 ~ Read in 2 minsThe question of how to write a list inside of a table cell with Kramdown recently came up in a thread on Jekyll Talk — prompting me to look for a solution.Configuring publishing sources for GitHub PagesNov 4, 2016 ~ Read in 1 minYou know what sucks? Maintaining two separate branches of an open source project, just to host its source code and documentation together with GitHub Pages.CSS blur effectOct 25, 2016 ~ Read in 1 minPlaying with the new Depth Effect (aka fauxkeh) on my iPhone 7 Plus got me thinking about Gaussian blurs, and how to improve their use on this site.Using SSI to detect cookiesOct 24, 2016 ~ Read in 3 minsIn my never ending quest to micro-optimize the hell out of my site, I ran into a snag when trying to use SSI directives to improve the loading of critical CSS and cached stylesheets.Adding comments to a Jekyll site with StaticmanAug 21, 2016 ~ Read in 16 minsUninstall Disqus and learn how to add a static-based commenting system to Jekyll with Staticman.Minimal MistakesA flexible two-column Jekyll theme for building a personal site, blog, project documentation, or portfolio.How I’m using Jekyll in 2016Feb 17, 2016 ~ Read in 27 minsDocumenting my approach to using Jekyll, how that’s evolved over the years, and web development learnings I’ve picked up along the way.Building a living style guide with JekyllFeb 10, 2015 ~ Read in 9 minsHow I used Jekyll to build a living style guide and pattern library for Made Mistakes.Skinny BonesA lightweight website starter for Jekyll.HPSTRJekyll blog theme designed to give your site a tumble-log look.So SimpleA simple Jekyll theme for words and pictures.Going static: Using Jekyll without a CMSMar 19, 2012 ~ Read in 9 minsMigrating Made Mistakes from a Wordpress powered website back to its static file roots using Jekyll without a CMS.Makings of a mistake, designing this siteApr 4, 2011 ~ Read in 2 minsAs a designer we’ve all been there. When was the last time you got bored with a design and decided to just burn it and start anew?"
