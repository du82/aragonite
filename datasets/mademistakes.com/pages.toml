full_description = "Red vs GreenMar 12, 2015 — by Michael Rose in PaperFaces iPad projectPaperFaces portrait of Ally Cat inspired by a photograph on Sktchy.I tend to work in landscape mode with Paper by FiftyThree because the tools and interface appear to be more optimized for it. Since the tool tray is always situated in the same location regardless of how you hold the iPad, it can sometimes get in your way or be tricky to hide/reveal. But that’s a tale for another day…The reference photo I selected from Sktchy doesn’t really work horizontally, so in the best interest of the drawing I flipped the iPad into portrait mode. Sure it won’t be orientated correctly when shared to FiftyThree’s Mix, but that’s a small detail I’m willing to look past…Continuing on with my time-lapse kick, here’s another video I recorded over several drawing sessions using an iPhone 5s and the Lapse It app. Took me around 3 hours to complete with some subtle blend action going on towards the end. Enjoy!Play YouTube videoTools used:Pencil by FiftyThreePaper by WeTransferLapse ItMade Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: Paper appPortraitSktchy appTime-lapseThe Battle WithinDriving SunsetMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.Related entriesWhite Eyes Glow SometimesThe Battle WithinFlipped Shirt"
