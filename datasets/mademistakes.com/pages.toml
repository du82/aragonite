full_description = "Tag: ProcreateDigital artwork painted with the iPad OS app Procreate, by Savage Interactive.Related topics: Portrait Black and white Beard Time-lapse DrawingProcreate paintingsDigital portraits, painted on an iPad with the app Procreate by Savage Interactive.Where possible I’ve included time-lapse videos exported directly from Procreate as a way of showing my drawing and painting process.Water tensionPortrait of Marie M. digitally painted with Procreate on an iPad.The two hour beardPortrait of Ale B. digitally painted with Procreate on an iPad.Turn awayPortrait of Tatha S. digitally painted with Procreate on an iPad.Corpse paint your tearsPortrait of Maya Z. digitally painted with Procreate on an iPad.Glowing pencil practicePortrait of Foggy 365 digitally painted with Procreate on an iPad.Back at itPortrait of Marion K. digitally painted with Procreate on an iPad.Choke’s embracePortrait of Lunar Ashes digitally painted with Procreate on an iPad.Eyes be damnedPortrait of Mahalia H. digitally painted with Procreate on an iPad.Blue and pink lightsPortrait of Jonathan H. digitally painted with Procreate on an iPad.Nose ring oilPortrait of María G. digitally painted with Procreate on an iPad.Watercolor, not watercolorPortrait of Emil I. digitally painted with Procreate on an iPad.Messy paint across the scalpPortrait of April C. digitally painted with Procreate on an iPad.Tales of round brushingPortrait of Morgan F. digitally painted with Procreate on an iPad.Painterly fringed collarPortrait of Jenny x. digitally painted with Procreate on an iPad.Right amount of beard sparklePortrait of Rakso S. digitally painted with Procreate on an iPad.Beard strokes for daysPortrait of David G. digitally painted with Procreate on an iPad.Rough is not rough enoughPortrait of Skylár S. digitally painted with Procreate on an iPad.The better to see youPortrait of Molly M. digitally painted with Procreate on an iPad.Noise on the grainPortrait of T. Steinheil digitally painted with Procreate on an iPad.That vintage lookPortrait of Madison S., digitally painted with Procreate on an iPad.Sunny sky in your eyePortrait of Jj Plix, digitally painted with Procreate on an iPad.The path to iPad ProSep 25, 2015 ~ Read in 11 minsConvincing myself that I need an iPad Pro and Apple Pencil to fulfill all my digital illustration needs.Blushing my cheeksPortrait of Jordan S., digitally painted with Procreate on an iPad.Don’t play with sootPortrait of Jenell D., digitally painted with Procreate on an iPad.Getting lost in the drabPortrait of Mr. Allan, digitally painted with Procreate on an iPad.Tattoos turning to mudPortrait of Wendy Rose, digitally painted with Procreate on an iPad."
