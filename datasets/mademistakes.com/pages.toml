full_description = "Notes — 50 entriesShort, bite sized thoughts, inspirations, mistakes, and other minutia. The sort of scraps you’d jot down in a notebook to remember for later…For longer, more thorough writing — peruse the articles section.Related topics: Time-lapse Drawing Tutorials Web development Static sitesAnd just like that, I was done with NetlifyFeb 29, 2024 ~ Read in 4 minsAs someone who uses Netlify’s Starter plan to host this site, the following situation is the kind of nonsense that keeps me up late at night…DIY record cube back spacersFeb 22, 2024 ~ Read in 1 minTutorial for building cheap alternatives to Turntable Revival’s wooden back spacers.Goodbye Gatsby, Hello HugoJan 14, 2023 ~ Read in 11 minsHugo has ruined me. Other static site generators that rely on community plugins and copypasta to fill out their gaps don’t cut it anymore…Adding last modified timestamps with GitAug 4, 2021 ~ Read in 2 minsToday I learned how to automatically add last modified dates to Markdown files used by static site generators like Jekyll and Gatsby.Not so quick with the Gatsby site optimizationsJun 22, 2021 ~ Read in 7 minsThis is the post where I talk about neglecting the site and pledge to blog more… wait, wasn’t I suppose to do this on January 1st?Twenty NineteenJan 1, 2020 ~ Read in 10 minsFirst time doing a year in review post. The statistics contained are just for fun as there’s nothing to compare them against yet.Faster Netlify buildsFeb 26, 2019 ~ Read in 2 minsDiscover how I optimized my Jekyll site’s build time on Netlify with practical tips to streamline static site performance and speed up deployments.Autumn refreshNov 12, 2018 ~ Read in 4 minsUsing CSS Grid Layout Module to redesign a Jekyll site and further improve performance and accessibility.Configuring publishing sources for GitHub PagesNov 4, 2016 ~ Read in 1 minYou know what sucks? Maintaining two separate branches of an open source project, just to host its source code and documentation together with GitHub Pages.Oil pastels are not pencilsOct 27, 2016 ~ Read in 1 minNot to overstate the obvious here, but oil pastels do not behave like colored pencils…CSS blur effectOct 25, 2016 ~ Read in 1 minPlaying with the new Depth Effect (aka fauxkeh) on my iPhone 7 Plus got me thinking about Gaussian blurs, and how to improve their use on this site.Using SSI to detect cookiesOct 24, 2016 ~ Read in 3 minsIn my never ending quest to micro-optimize the hell out of my site, I ran into a snag when trying to use SSI directives to improve the loading of critical CSS and cached stylesheets.Inktober failureOct 17, 2016 ~ Read in 1 minLike previous years, I started out with the best of intentions for Inktober and then quickly lost steam…How to glitch imagesAug 26, 2016 ~ Read in 1 minTo create profile images that look like they’ve been run through a television set with poor reception, I use DECIM8. It’s available as both an iOS and Android app.How to make time-lapse videos on iPadAug 26, 2016 ~ Read in 2 minsMethods used to capture time-lapse videos of drawing and painting on an iPad, to show an artwork’s progression.iPad stylus recommendationsAug 26, 2016 ~ Read in 2 minsLong story short, if you have an iPad Pro do yourself a favor and get an Apple Pencil. If you have an older (or non-Pro) model below are all the styli I’ve had experience with.Learning to draw on iPadAug 26, 2016 ~ Read in 1 minHow did I git gud at drawing and painting on an iPad? The answer that no one likes to hear is “practice, practice, practice.” I wish there was some magical shortcut for learning how to draw, but there isn’t.What tablet do you use?Aug 26, 2016 ~ Read in 1 minIf it wasn’t obvious from the artwork on this site, I draw, paint, and create on Apple’s iPad. My current model is a 12.9″ Pro (256GB) with the Space Gray finish. Before I took the plunge and upgraded to the larger screen I had an Air 2 and the first retina iPad — both of which I’ve handed down to my kids.Drawing experienceMar 12, 2015 ~ Read in 2 minsI’ve been drawing with traditional tools and materials — on and off for the last 20 years. And drawing with digital tools on iPad, the last 3 years.Paperfaces digital drawing giveawayAug 24, 2014 ~ Read in 1 minEnter to win a portrait of your choice drawn by Michael Rose in his signature PaperFaces style.Inspiring faces want to knowApr 1, 2014 ~ Read in 1 minFinding inspiration from the faces of strangers on Sktchy for iOS.Starting youngMar 7, 2014 ~ Read in 3 minsIt was only natural the two little rosebuds would become early adopters of technology.365 days of drawing facesAug 29, 2013 ~ Read in 1 minYear one of my 365 day portrait project may be over, but I’m just getting started.Sketching PaperFaces portraitsAug 31, 2012 ~ Read in 7 minsAn experiment in humanizing the web — drawing a portrait everyday on iPad with the app Paper.Easter egg marriage proposalApr 4, 2012 ~ Read in 2 minsTwo years ago on this day, I proposed to my wife Wendy by leading her on an Easter egg scavenger hunt.Corn On Macabre record art ⁠— vellum and metallic ink blissMay 19, 2011 ~ Read in 2 minsMy favorite thing about this Corn On Macabre 7-inch record is the use of vellum and metallic inks in the sleeve.My About.me profileMay 10, 2011 ~ Read in 1 minHow 5 minutes spent creating an About.me profile nabbed me free Moo business cards of my own design.Urban Outfitters, ya typography dun goofed againMay 8, 2011 ~ Read in 2 minsGlad to see improvements in the May 2011 Urban Outfitters catalog. Especially since I took a few issues with their typography last month.Agna Moraine’s Autobiography, handwritten record artApr 25, 2011 ~ Read in 2 minsI couldn’t begin to tell you what the artwork in this emo record means. But silk screening lyrics on fabric scrapes is kind of cool.Collecting records for the artworkApr 21, 2011 ~ Read in 2 minsHow the hand crafted aesthetics found in DIY released emo and hardcore records started my collecting addiction.Typography no nos with Urban OutfittersApr 12, 2011 ~ Read in 3 minsThe typography in Urban Outfitters latest catalog has some serious readability issues.Knowing grids means breaking gridsApr 6, 2011 ~ Read in 4 minsExploring what it means to develop a grid system that helps facilitate strong design with purpose.Makings of a mistake, designing this siteApr 4, 2011 ~ Read in 2 minsAs a designer we’ve all been there. When was the last time you got bored with a design and decided to just burn it and start anew?Impressions of iPhone 4 from a long time Palm userJun 25, 2010 ~ Read in 3 minsThe following are some of my experiences and observations transitioning from Palm to iOS after nearly 10 years of baggage.Getting the sold out iPhone 4 at launchJun 16, 2010 ~ Read in 2 minsLooks like I might actually get two iPhone 4s on launch day.Bizarro me, a credit card scammer?Dec 13, 2009 ~ Read in 1 minApparently there is a bizarro version of me in Niagara County using scammed credit cards.The Eviltron and a scary movie makes for a great prankOct 17, 2009 ~ Read in 1 minThe Eviltron device, when setup properly, can land some convincing scares.The iPhone is great, but the Palm Pre is more my styleJun 9, 2009 ~ Read in 3 minsQuick impressions of the Palm Pre from a long time smartphone user.Wendy’s bird cage & flying birds tattoosMar 29, 2009 ~ Read in 2 minsPut a bird on it. Photographs of Wendy’s bird cage tattoos and some ink splat trees on my arms.The quality of my first Blurb book is greatJan 25, 2009 ~ Read in 1 minUsing Blurb’s BookSmart software was painless and having it printed was equally enjoyable.Rasterbating a large wall sized owl printApr 6, 2008 ~ Read in 2 minsTutorial and time-lapse using the Rasterbator web app to print and assemble a wall sized poster of an owl.Seeing through blurred eyes — The Diving Bell and The ButterflyJan 29, 2008 ~ Read in 1 minQuick impressions of the film, The Diving Bell and The Butterfly.RRIICCEE show last nightDec 12, 2007 ~ Read in 3 minsMusically — RRIICCEE is fine, but not something I really want to see live again.Upgrading an iMac G5 to OS X LeopardNov 17, 2007 ~ Read in 4 minsWhat I went through upgrading an iMac G5 to Mac OS X Leopard (10.5).One week with the new iPod classicSep 14, 2007 ~ Read in 3 minsQuick impressions of the new iPod classic 60GB.Blinded by the light ⁠— Sunshine impressionsJul 28, 2007 ~ Read in 2 minsThe film Sunshine directed by Danny Boyle is science fiction without the big bang.A Tale of Two Sisters is almost Fatal FrameJun 10, 2007 ~ Read in 2 minsMy quick impressions of a Korean horror flick that gives off some serious Fatal Frame vibes.La Moustache quick reviewJun 5, 2007 ~ Read in 1 minMy quick impressions of La Moustache — a French film about a dude shaving his mustache.iPod battery settlement program statusOct 25, 2006 ~ Read in 2 minsA short update on the status of my iPod 3G battery settlement claim.Feeling kinda stuck in a Half NelsonSep 23, 2006 ~ Read in 2 minsMy impressions of the film Half Nelson, starring Ryan Gosling."
