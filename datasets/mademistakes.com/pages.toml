["https://mademistakes.com/mastering-paper/drawing-faces"]
title = "Drawing realistic portraits with Paper - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Drawing realistic portraits with PaperJun 24, 2021 — by Michael Rose in Mastering PaperPortraiture is at the heart of what I use Paper by FiftyThree to create with. After drawing over 700 faces some might think it would be easy for me to share my process and techniques — they would be wrong. After struggling writing this guide for the last month, I think I finally shaped it in a way that makes sense.Like the other parts of my Mastering Paper tutorials, this guide will explain my techniques and how I use them. My drawing style has evolved from the abstract to the more realistic since starting the PaperFaces portrait project almost 2 years ago. It only seems fitting to organize the guide in a way that mimics this same evolution.What this guide won’t be is a lesson in human anatomy. You’d be better served reading a book on the matter instead of me paraphrasing it for you. What I will do is explain the basics of drawing a face with Paper and how to get the most out of the app.Color palettes for skinBefore getting into any specific technique, I’d like to share my favorite palette. With this set of seven custom mixes I can pretty much reproduce any skin tone I want. Below I’ve painted a color wheel with each to show how they appear when layered, darkened, and lightened. Tapping the circles below will open into larger views allowing you to save1 a copy to use as reference.Paper by 53 currently doesn’t have a way of exporting or sharing color palettes. To recreate these on your iPad you will need to follow these steps:Buy the Color Mixer tool if you haven’t already.Tap the small circle within the Color Mixer and move the 3 sliders to match the color you are looking to copy.Tap the small circle again and drag it into a vacant spot in your palette to the right.Repeat the process for each color you wish to copy and use.Pro tip: organize your color palettesYou can move colors in the palettes by dragging them around into an order that works for you. For example I group all my skin tone colors together for easier access.Choosing colorsIn my previous guide I went over a few color theory basics that can help guide you to make more informed color selections. Building on top of those guidelines here are a few more that are specific to painting portraits.When I’m having trouble getting a mix just right I focus more on whether it is warm or cool and adjust accordingly. With regards to the face, you can roughly divide it into three sections. Lighting has an important role in this and variations will occur, but for the most part you can divide a face with fair complexion like so.ForeheadYour forehead is free of surface capillaries and muscles leaving it white or a golden yellow. Along the hairline you’ll notice a darker tone that I like to use as a way of blending hair follicles into the scalp. But I’m getting ahead of myself, more on painting hair in a future guide.Golden yellows and oranges are frequently used to glaze the forehead.Mid-face (cheeks/ears/nose)Traveling down the face just below the eyes and above the mouth is an area comprised of capillaries filled with blood. All this blood causes the ears, nose, and cheeks to turn a reddish color. A simple thing like glazing cheeks with warm mixes of orange and red can liven a face up, especially in females.ChinThe third section of the face with a noticeable color tone is the area below the nose to the chin. In men this section tends to be a blue, green, or even gray in color. Depending on the amount of facial hair present this color will be more pronounced.If you remember back to my previous guide, green and red are complementary colors. One way of accentuating a color is by surrounding it with its complement. I use this trick often when painting female faces, when I want to call out their lips by painting the shadows with glazes of blue or green.Painting skinTo some, the watercolor brush is magical while others find it extremely confusing and frustrating — I completely understand that. To master the brush you have to be mindful of a few things:Speed controls opacityThe brush produces a range of values by varying the speed at which they’re painted. If you move your finger (or stylus) slowly across the iPad’s screen, the mark will darken — moving fast, the mark will fade into the canvas and appear lighter.Speed is the single most important variable for creating smooth tones or glazes. The second is never lifting the tip off the screen until you’ve filled a shape.Play YouTube videoPro tip: smoothening out splotches of colorTo even out stubborn light spots, keep rubbing until they turn dark. You can’t overwork an area as long as don’t lift to make another stroke.New to Paper or drawing in general? Make your life easier and work large, filling up the entire page. The smaller the composition the harder all this becomes since the brush has a fixed size. Well that’s not completely true, but for those of you who don’t use Bluetooth stylus like FiftyThree’s Pencil or a Pogo Connect — it is.Update: Paper 2.0Painting with the watercolor brush has been greatly improved in the new version of Paper by FiftyThree. Learn all about the new brush tool in my post that includes videos of it in action.Whites to eraseA cheat I used in my early Paper portraits was to omit facial features by not drawing them. I’d spend my time adding detail to the background elements instead of a person’s face just because they were easier for me.To paint in this style, start by lightly sketching out the figure to act as your guide. To simplify things I’m going to pull a face out of a bland background. I’ve found that it is much easier to drop in a background first, because you don’t have to be as precise. It also helps reduce hard edges or gaps in color that may appear around the face’s edge.The color you choose to sketch with isn’t super important, but a lighter one is much easier to cover-up.With your background dropped in, select the pencil tool, a light color, and sketch out the general outline of the figure. Drawing sensitive lines will convey more meaning in your drawing and guide how you paint. For example, I place heavier lines in my sketches to show shadows or areas I will want to darken with watercolor later.Pro tip: skin color selectionWhen choosing a pencil color pick a flesh tone that is predominant in the face. This will make it easier to hide the lines later when you paint with white.With a rough sketch complete, it is time to put those skin tone palettes from before to work. For this example I’m going to choose the light red mix to start with. If you were to paint with this in its current state it wouldn’t be effective at pulling the face out of the background. What we need to do is mix white into it to make it opaque2 and act like an eraser.If you add just the right amount of white to a color it will allow you to lighten anything you paint over. This is how I pull a face out of the background.Of course you could just use the eraser tool to remove the background, but it will produce a harsher edge — which I like to avoid. Used as a lightener, the brush gives greater control over the amount of background you remove.Building the face with glazesWith the face’s shape pulled out from the background, we can start the process of rebuilding it. Referencing my custom skin tone colors, choose the light red again and apply an even glaze over the entire face. Don’t worry if you overlap into the background, we’ll fix that later.With this abstract style don’t try to paint everything. Focus on a few heavy shadows on the side of the face or eye sockets to give the impression of a face.If you decide to use your own color mix I suggest one that is light — the less intense the color the better. Take your time to carefully observe the shapes you are painting. Drawing is as much of seeing as it is putting a mark on the canvas.Don’t be afraid to Rewind a stroke and redo it. I’ve been known to repeat this action over 20 times until I feel a stroke captures the form’s essence. Be deliberate with your brush movements and try to convey more with less (if that makes any sort of sense).With practice you’ll become more confident in the shapes you are painting. I would urge you to avoid brushing with small choppy strokes to keep the skin smooth — unless you intend for it to look textured.Try to avoid this at all costs. You’re looking to produce smooth tones by making long sweeping strokes.Adding shadowsA complimentary color works great as a shadow, especially when dialing down the lightness of your glazes. A heavy and more opaque color is harder to control because it will darken painted areas way too fast.A variation of gray can also be effective for darkening areas. The important consideration here is to match the temperature of the gray to the area you want to darken. Tint your gray with reds and oranges for warmer tones, and blues and greens for cools.Pro tip: paint inwardsWork your glazes from the outside in, moving faster to produce soft transitions — speed and direction matter!To build up a realistic skin tone it may take numerous layers of varying colors. It’s not uncommon to mix in blue and green.Cleanup and refinementDepending on how accurate of a painter you are, your glazes may have bled outside of the face and into the background. To clean up these rough edges, use the pencil tool mixed with a color that matches the background. Then use it to cover up blotches or stray marks by drawing over them. Variations to the color may be necessary if your background is more complex than a single tone.Don’t be afraid to use one of the ink pens for cleanup instead. For stylistic reasons I prefer the softness of a pencil, but either tool is acceptable.Play YouTube videoCreating realism with colored pencilsAfter almost two years of drawing and painting hundreds of blank faces, I had a break through when I started applying pencil strokes on top of my glazes. I found that this extra layer of texture added depth and complexity to the drawings which ultimately made them appear more realistic.Like before we start with a loose sketch of the subject to rough out our composition. The pencil’s color doesn’t matter too much, just make it something light and easy to cover up.The face can be divided in half horizontally and vertically to help with placing features. Note: Depending on the orientation of the face these divisions may not be as obvious as a face viewed directly in front.To really capture an accurate likeness the placement of the eyes, nose, and mouth are very important. The use of lightly sketched guidelines across the face can help with their placement. While not true 100% of the time the width of the eyes can be used to accurately measure the distance between each of the face’s features.Generally Speaking:Pupils are placed just above the center line.An average face is approximately five eyes wide.The bottom of the ears align with the bottom of the nose.Refining the contoursInstead of switching to the brush, we’re going to stick with the pencil tool and begin refining the drawing. Color is going to play an important role in this step, if you’re not comfortable with that yet, I suggest working in black and white.Bouncing between the eraser and pencil tools, remove stray lines from the initial sketch and sharpen up lines. Build up tones as you work and avoid using black. Refer to the face color guidelines from earlier to help make smart color choices.To remove the guidelines I either partially erase them or lighten the sketch by blending it with my finger.With the rough sketch cleaned up you want to begin darkening some contour lines. Start with the eyes first and focus your efforts on getting their shape as accurate as possible. A detailed eye will help draw the viewer in and can take emphasis off of the other features if you happen to screw them up.The basic idea here is to sketch in all the dark spots around the eyes, nose, and mouth. If you’re using my skin color palette from earlier you’ll want to select one of the darks in the second row.The areas you’ll want to focus on first are the pupils, upper eyelids, nostrils, and the crevices found around the lips.Shaping skin with hatchingOnce you’ve finished darkening and refining contour lines you’ll want to begin shaping the skin. The primary way to do this is with hatching techniques and dry mixing colored pencils on the canvas.Starting with the eyes again, apply subtle shadows around them using the pencil tool. I use a Pogo Connect stylus to make even lighter strokes, but it can be pulled off without one.The idea is to build up tones from light to dark by overlapping pencil strokes and varying the distance between them. The amount of lines and the distance between them both effect how dark the tone will appear. I like to work from dark to light and use a combination of contour and cross-contour hatching to build up tones.The red arrows show the pencil stroke directions I used to round the skin’s shape.I’ve said this before in my Back to Basics guide, but it’s worth repeating. Be mindful of the direction of the strokes you are making when hatching to enhance the form. Observe how the skin bends and curves, and make pencil strokes that follow those same paths.Don’t feel the need to shade all surfaces! Focus your attention on the darkest values and build up those gradations first. Keep in mind that we will be covering these pencil strokes with watercolor so don’t go too dark. I suggest making your tones about 50% lighter than how they appear — you can always darken things up later.Pro tip: up your game with a fancy pressure sensitive stylusA Pogo Connect makes shading and using the pencil tool way easier. By varying the amount of pressure applied to the tip, you can make a darker line in a way that mimics a real pencil.To make the face appear more real you’ll want to use a wide range of colors. By applying washes of color pencil on top of each other, you can build up the skin in a more believable way. Don’t be afraid to dry mix blues and greens into pale oranges and tans.Washes of colored pencil can be blended into one another by lightly overlapping. It is crucial that these tones are applied smoothly to create a more pleasing effect.Continue hatching and coloring your way through the rest of the drawing. At this point you could call this a finished piece, but I’m going to take it a few steps further if you don’t mind.Pro tip: one color at a timeStick with one color and bounce around the face with it. It’ll save you from constantly opening and closing the tool tray to select different colors.Building the face with glazes, againBy applying a thin layer or glaze of watercolor on top, this colored pencil drawing will take on new properties. The colors will intensify with each layer of glaze, and pull everything together.Try to get your glaze color as close to white without it actually lightening the pencil strokes beneath. This will allow you to paint more layers without going too dark a"
