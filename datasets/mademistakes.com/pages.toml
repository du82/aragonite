full_description = "Tag: TutorialsGuides, short how-tos, and extensive tutorials explaining a variety of topics.Related topics: Time-lapse Drawing Tutorials Web development Static sitesDIY record cube back spacersFeb 22, 2024 ~ Read in 1 minTutorial for building cheap alternatives to Turntable Revival’s wooden back spacers.Adding last modified timestamps with GitAug 4, 2021 ~ Read in 2 minsToday I learned how to automatically add last modified dates to Markdown files used by static site generators like Jekyll and Gatsby.URLs and links in JekyllJul 20, 2021 ~ Read in 18 minsHow Jekyll uses URLs and how to link posts, pages, assets, and other resources together.Jekyll’s site.url and baseurlJul 11, 2021 ~ Read in 6 minsLearn what Jekyll’s site url and baseurl variables are and how to properly set them with relative_url and absolute_url filters to avoid broken links and 404 errors.Not so quick with the Gatsby site optimizationsJun 22, 2021 ~ Read in 7 minsThis is the post where I talk about neglecting the site and pledge to blog more… wait, wasn’t I suppose to do this on January 1st?Optimizing and automating my Jekyll site buildAug 30, 2017 ~ Read in 17 minsLessons learned from building, optimizing, and deploying a huge static site with everyone’s favorite SSG — Jekyll.Styling language specific code blocks with JekyllMay 16, 2017 ~ Read in 2 minsInteresting styling possibilities with Kramdown syntax highlighted code blocks in Jekyll.Accessing static files in JekyllJan 30, 2017 ~ Read in 4 minsLearn how to use static files with Jekyll to create a gallery of images automatically without a plugin.Improving Staticman comments on a Jekyll siteDec 8, 2016 ~ Read in 13 minsHow to use Staticman to add threaded comments and reply notifications to a static-based Jekyll site.HTML inside Kramdown table cells with JekyllNov 8, 2016 ~ Read in 2 minsThe question of how to write a list inside of a table cell with Kramdown recently came up in a thread on Jekyll Talk — prompting me to look for a solution.Using SSI to detect cookiesOct 24, 2016 ~ Read in 3 minsIn my never ending quest to micro-optimize the hell out of my site, I ran into a snag when trying to use SSI directives to improve the loading of critical CSS and cached stylesheets.How to draw straight linesAug 26, 2016 ~ Read in 1 minTo draw straight lines on the iPad in apps that don’t have a ruler tool, I use whatever straight edge I have laying around: plastic ruler, book cover, piece of cardboard, notepad, etc.How to export high resolution Paper sketchesAug 26, 2016 ~ Read in 1 minWith Paper by WeTransfer you can only export as large as your iPad’s native resolution. If you care about getting more pixels out of your Paper art than the largest iPad Pro1 is the way to go. Larger screen == higher resolution!How to make time-lapse videos on iPadAug 26, 2016 ~ Read in 2 minsMethods used to capture time-lapse videos of drawing and painting on an iPad, to show an artwork’s progression.Adding comments to a Jekyll site with StaticmanAug 21, 2016 ~ Read in 16 minsUninstall Disqus and learn how to add a static-based commenting system to Jekyll with Staticman.Switching tools with PaperMay 16, 2016 ~ Read in 1 minHow to switch tools in the app Paper for iPad and iPhone.How to paint smoothly with the brush toolMay 12, 2016 ~ Read in 1 minA smooth gradient can be achieved layering washes of watercolor on top of each other. Speed and pressure play an important role in how clean of a tone you end up with. My Paper app basics guide explains all the nuances of the watercolor brush and techniques for using it.How I’m using Jekyll in 2016Feb 17, 2016 ~ Read in 27 minsDocumenting my approach to using Jekyll, how that’s evolved over the years, and web development learnings I’ve picked up along the way.Mastering Pencil by FiftyThreeJun 24, 2015 ~ Read in 19 minsLearn how to create impressive effects with 53’s Pencil stylus and Paper app, using exclusive features like Blend and Surface Pressure.Faux layer technique for PaperApr 15, 2015 ~ Read in 5 minsLearn Paper’s faux layer technique and how it can aid in sketching and tracing on iPad.Building a living style guide with JekyllFeb 10, 2015 ~ Read in 9 minsHow I used Jekyll to build a living style guide and pattern library for Made Mistakes.Drawing outer space with PaperJan 2, 2015 ~ Read in 14 minsLearn how to draw stars, galaxies, planets, black holes and more with Paper on iPad and 53’s Pencil stylus.How to use Paper’s color pickerDec 18, 2014 ~ Read in 7 minsTutorial explaining how to use Paper’s new color picker tool to sample, mix, and share colors.Mastering Mix by FiftyThreeNov 25, 2014 ~ Read in 10 minsDownload these templates for Paper and discover how to use Mix to Learn, Sketch, Play, Write, Design, and Think.How to undo and erase in PaperOct 25, 2014 ~ Read in 7 minsLearn how to use Paper’s eraser tool to undo and cover-up mistakes on iPad.Watercolor brush improvementsSep 16, 2014 ~ Read in 2 minsDiscover the secrets of Paper’s newly updated watercolor brush in this short tutorial and video.Grid method of drawingJul 6, 2014 ~ Read in 6 minsHow to use the grid method of drawing to improve your accuracy when drawing with the app Paper on iPad.How to zoom while paintingJul 3, 2014 ~ Read in 3 minsLearn how to reposition Paper’s zoom loupe mid-stroke to help add detail to your drawings.Drawing realistic portraits with PaperApr 21, 2014 ~ Read in 15 minsAdvanced Paper tutorials and techniques for drawing and painting faces with an iPad.Drawing and painting basicsFeb 9, 2014 ~ Read in 11 minsLearn the basics of iPad drawing and painting with the app Paper by WeTransfer (formerly 53).Contour line drawing on iPadJan 13, 2014 ~ Read in 4 minsHow to use blind contour line drawing and the iPad app Paper, to improve hand eye coordination and observation skills.Drawing textures with PaperNov 25, 2013 ~ Read in 10 minsTutorials for drawing bricks, wood, and rock textures with the Paper app on iPad.Printing Moleskine books on