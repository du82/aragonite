full_description = "Tag: Tech geekWhere technology and geek intersect.Related topics: Time-lapse Drawing Tutorials Tech geek ReviewsHow to glitch imagesAug 26, 2016 ~ Read in 1 minTo create profile images that look like they’ve been run through a television set with poor reception, I use DECIM8. It’s available as both an iOS and Android app.How to make time-lapse videos on iPadAug 26, 2016 ~ Read in 2 minsMethods used to capture time-lapse videos of drawing and painting on an iPad, to show an artwork’s progression.iPad stylus recommendationsAug 26, 2016 ~ Read in 2 minsLong story short, if you have an iPad Pro do yourself a favor and get an Apple Pencil. If you have an older (or non-Pro) model below are all the styli I’ve had experience with.Learning to draw on iPadAug 26, 2016 ~ Read in 1 minHow did I git gud at drawing and painting on an iPad? The answer that no one likes to hear is “practice, practice, practice.” I wish there was some magical shortcut for learning how to draw, but there isn’t.What tablet do you use?Aug 26, 2016 ~ Read in 1 minIf it wasn’t obvious from the artwork on this site, I draw, paint, and create on Apple’s iPad. My current model is a 12.9″ Pro (256GB) with the Space Gray finish. Before I took the plunge and upgraded to the larger screen I had an Air 2 and the first retina iPad — both of which I’ve handed down to my kids.The path to iPad ProSep 25, 2015 ~ Read in 11 minsConvincing myself that I need an iPad Pro and Apple Pencil to fulfill all my digital illustration needs.Paper v3.0 featuresSep 11, 2015 ~ Read in 6 minsPaper comes to the iPhone with productivity boosting features like photo import, text notes, grid view, rotate, and more.Pencil by FiftyThree stylus reviewNov 28, 2014 ~ Read in 8 minsAn avid Paper creator’s impressions of FiftyThree’s new iPad stylus, Pencil.Paper v2.0.0 bugsSep 28, 2014 ~ Read in 5 minsDocumented bugs and other strange behaviors found in Paper for iOS version 2.0.0 when using Pencil.PaperFaces retrospective