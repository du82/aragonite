["https://mademistakes.com/mastering-paper/pogo-connect-smart-pen"]
title = "Pogo Connect iPad stylus review - Made Mistakes"
description = "The Pogo Connect is an iPad stylus that brings pressure sensitivity and enhanced functionality to devices and apps that support it."
full_description = 'Pogo Connect iPad stylus reviewJun 24, 2021 — by Michael Rose in Mastering PaperI’ve been lusting over the promise of pressure sensitive drawing on an iPad ever since I first read about the Pogo Connect Smart Pen1. Released back in January for around $80, I held off buying one until the price dropped. Waiting turned out to be smart since my favorite iOS app Paper by FiftyThree2 also received updates to better support the Pogo Connect.For my birthday my wife picked me up one and I started the process of learning all its nuances. I’ve gotten adept at using a LunaTik Alloy Touch Pen by drawing with it every day for the last 9 months, but the tip is starting to show signs of tearing — perfect time to try something new.Pogo Connect Smart Pen vs. normal stylusesIf you like how rubber nibbed tips feel when drawing you’ll be at home with the Pogo Connect.How does the Pogo Connect’s feel compare to other styluses? In your hand it doesn’t have the same solidness as the LunaTik or an AluPen. By no means is it cheap feeling, but it doesn’t have the heft as those other two pens.The tip isn’t any more accurate than your average rubber nub stylus, so if you’re looking for precision look at the Adonit Jot Touch 4 line3 instead.Setting it up is a breezeThe Pogo Connect comes with a name brand AAA battery to get you up and running right away. I’ve been drawing with it every day for over a month and I have around 60% of battery life remaining — not bad at all. To pair with your iPad, open up Paper by 53 (or one of the supported apps) and press the button near the tip. After a few seconds it should connect via Bluetooth and you’re good to go.Pogo Connect Smart Pen optionsPaper by 53 has a dedicated settings panel for the Pogo Connect that you can access from tapping the 53 logo in the upper right corner. Here you can check the stylus’ connection status, battery level, firmware, and toggle the pen button undo feature.There is an option labeled “Button” with a circle that I have no idea what it does or indicates. If anyone knows feel free to chime in below.Procreate nicetiesProcreate has similar options, along with a cool feature that Paper by 53 doesn’t — the LED light on the Pogo will match whatever color you select in the picker. Not really a useful feature when drawing and painting, but still kind of cool.Is the Pogo Connect better for drawing?I suppose you want to know if the Pogo Connect lives up to the hype. In my opinion, yes — yes it does.The pencil and watercolor tools in Paper by 53 have always been great at feeling and reacting like the real thing. When used with a Pogo Connect these tools are augmented to a point where you can create thick and thin marks with more precision and ease.Below is a sketch of all Paper’s tools using my finger. Each stroke was made by moving my finger slowly at the beginning of each line and progressively getting faster near the end.This has the effect of making strokes thicker or darker depending on the tools used — something I probably don’t have to tell you if you’ve used Paper for any amount of time.Finger drawn lines with varying speed (slow to fast).In this next example I drew strokes with the same five tools, but using a Pogo Connect Smart Pen. Instead of varying the speed at which I drew each line, I varied the amount of pressure applied to the tip of the pen. Each stroke began by touching the iPad’s screen lightly with increased pressure near the end.Pogo Connect drawn lines with varying pressure (soft to hard).If it’s not obvious from the sample sketches, the Pogo Connect Smart Pen reacts in the following ways compared to a standard capacitive stylus pen while applying pressure:Pencil: strokes get darkerFountain pen: strokes get widerMarker: strokes get widerPen: strokes get slightly widerWatercolor: strokes get widerThe two tools that benefit the most from using a Pogo Connect stylus are the watercolor brush and pencil. Both tools become more responsive and natural to use — especially the pencil when used for shading and sketching.The watercolor brush gets the added benefit of being able to draw thinner strokes than your finger or other styluses can. Which is nice since there is no other way to control brush size.On the subject of palm rejectionSeen this one mentioned on other reviews and forums so I figured I’d address it. I’ve never had a problem with iPad registering random marks while I draw or write. Not sure if I draw in a way that eliminates this, so I don’t have a way to judge if the Pogo fixes this.What I can say is when activated you can’t draw with anything except the Pogo. While gestures like pinch to zoom, rewind, and moving pages around all continue to work.If you rest your palm on the screen while you draw, things begin to behave erratically. Because of the way multi-touch gestures work in Paper, the palm rejection feature was likely turned off as not to conflict.On the other hand, palm rejection works nicely when multi-touch gestures are tutned off in the Procreate app.Is it worth the money?If you’re a Paper addict and use watercolor and pencil I think the high price of a Pogo Connect is justified. If you’re predominantly an inker then it’s probably not worth it. I find controlling the fountain pen to be much harder when using a Pogo Connect because of how sensitive it is.This makes drawing smooth lines hard unless you have a steady hand and don’t vary the pressure as you draw.It’s worth noting that there appears to be a major design flaw with the internals of the pen (see below). Constant pressure being applied to a soldered circuit board behind the tip, it eventually breaks and ceases to work properly.I don’t know of anyone in the Paper community who has reported this problem. But since it’s the only stylus Paper supports with pressure sensitivity you’ll have to decide how important that is to you. Buyer beware.What’s wrong with the Pogo ConnectAbout those bugs I mentioned earlier. Not sure if they’re hardware or software related, but I’ve experienced a ton of lockups with the Pogo Connect and Paper by 53.The stylus will randomly disconnect or become unresponsive and I have to force quit the app or remove the AAA battery inside of the Pogo Connect. It tends to become unresponsive when making a bunch of quick strokes, like when I’m drawing beard whiskers.Not a deal breaker because it doesn’t happen all the time, but it is an annoyance that interrupts the creative flow.Lock screen annoyancesDuring my first week with the Pogo Connect I encountered another issue that I thought might have been a Paper bug. Out of nowhere the iPad’s screen turned off and the lock “chhkk” sounded.After complaining about it on Tumblr a friend messaged me to say that I needed to turn off the iPad cover lock setting. It never occurred to me that there was a magnet in the tip that could trigger a screen lock when moved near the iPad’s outer bezel.Screen lockingToggling iPad Cover Lock/Unlock to OFF in Settings will stop the Pogo from turning off your screen if you get to close to the edge.Even with these hiccups I’m still a big fan of the Pogo Connect. Gives me hope that companies like Ten One Design will continue to innovate in this space, giving digital creators tools that are even closer to the real thing.Who knows, maybe someday Apple will rethink that whole “if you see a stylus they blew it” Steve Job’s line of thinking and do something to help nurture this.Update two months laterWell that didn’t take long. About a month after writing this review and two months of daily drawing, my Pogo Connect gave up the ghost. Out of the blue I was drawing and my strokes stopped registering in Paper. I figured it was a software hiccup and the stylus temporarily lost connectivity, but no.Removed the rubber tip to find this mess. Like others, the metal contact that is soldered to the internal circuit board broke free rendering the pressure sensitivity useless.I have an email out to Ten One Design to see what can be done. I’ve heard they respond quickly with free replacements, which could indicate they’re aware of a major design flaw and trying to do right by it.I don’t know if I can continue to recommend the product if it’s prone to breaking after a few months. I’ll let you know how things go…Update a week laterAnd like that Ten One Design sent me a replacement pen with 2 extra tips free of charge. Excellent customer service if you ask me! Not sure if it’s that new car smell effect, but this pen feels more sturdy and responsive than the last.Hoping that means the build quality has improved and the tip sensor breaking apart is no longer an issue.Update three months laterFeels like Groundhog Day all over again. My replacement Pogo didn’t fair too well and broke in the exact same way after three months of daily usage.Big shout out to Ten One Design’s customer service for setting me up with another replacement gratis. I’ve been told they beefed up the soldering for a new production run in September. Not sure if that will make much of a difference, but will report back after I get my hands on it.If it wasn’t for Paper I probably would have dumped the Pogo and moved to the Adonit Jot Touch and Procreate full time. But there’s something magical about Paper that keeps pulling me back…A new iPad stylusAfter having a long run with Ten One Design’s Pogo Connect stylus I have left it behind. After updating to an iPad Air 2 (which has poor support for the original Pogo Connect) and Paper being updated to include Surface Pressure, I’ve begun using FiftyThree’s Pencil stylus exclusively.It doesn’t vary strokes in the same way as a Pogo Connect (or other pressure sensitive styli), but it produces the same results and has a few tricks up its sleeve.Since publishing this review, Apple released the iPad Mini and iPad Air — both have some compatibility issues with a Pogo Connect Smart Pen. There’s something about these new screens that cause the Pogo to not function properly. The iPad Air it doesn’t work at all. The iPad Mini has better support, but a few of the new tips don’t work. For the full story check out Ten One Design’s website. ↩︎As of version 2.5 FiftyThree has dropped support for the Pogo Connect Smart Pen. ↩︎At the time of writing this review the Adonit Jot Touch 4 is not supported by Paper. If you were hoping to take advantage of the palm detection and pressure sensitive features you’ll need to use a different app — here’s the full list of Jot ready apps. ↩︎Made Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: DrawingPaper appPogo ConnectReviewsTech geekDrawing faceless portraits with PaperGetting started with PaperMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.12 commentsPICMAR · Aug 14, 2013Wonderful style of setting the words. As marvelous as the corresponding drawings.PICMAR · Aug 14, 2013And really helpful. Thanks!Luliio · Aug 16, 2013Amazing review but still I’m confused about the best stylus to use with Paper “drawing”.Especially if we are talking about the small details on the pictures.Your advice is highly appreciated.Michael Rose · Aug 16, 2013If it’s detail you’re after I suggest one of the pens by Adonit that have the plastic disc on the tip. They’re built for precision.If you want the ability to control line weight and darkness by varying the amount of pressure applied the Pogo Connect is the only way to go.\r\n\r\nI came across this new pen from Adonit called the Jot Touch 4 that looks like the holy grail of styli, but it’s not supported by Paper (and probably never will be). But if you use apps like Procreate and Sketchbook Pro on your iPad it might be the way to go.Luliio · Aug 17, 2013That’s great Mr. RoseActually I have Adonit jot mini + AluPen, but still confuse what’s the best between them and Pogo connect as I never use it ….Many thanks for your reply.Michael Rose · Aug 21, 2013This video might help explain the difference between pressure sensitive pen’s (like the Pogo Connect Smart Pen) and normal ones (like an AluPen).The other pressure sensitive styli shown in the video are not supported by Paper, but it does a good job of showing the basics of how line width and color can be manipulated by applying pressure with the pen.Luliio · Sep 12, 2013Mr.Rose, I would really like to thank you for all the support and advises you’ve been giving to me, it was really appreciated.You can say now i have a lot of stylus now, and the surprising funny thing that after weeks finally i got my Pogo connect and i am in love with it… ❤I didn’t believe how smooth and amazing drawing with Pogo …Keep watching your great draws & journals.Thank you again Mr.Rose .. Thanks to you also “TenOne Design”Luliio.Michael Rose · Sep 13, 2013Great. Glad you’re enjoying the Pogo Connect. It’s easily my favorite stylus to use with Paper.Iantm · Sep 26, 2013My third stylus just broke. They responded by sending me a fourth and saying that they have addresses the issue. I love their customer service. I hope the fourth pen won’t break like they say. I have looked at the jot touch 4 for its different approach and finer control but I’m not a fan of the rechargeable battery. I like the user replaceable option. I’ve eyestalks the Wacom but if the new Pogo holds up I’ll stick with it."Michael Rose · Sep 26, 2013Let me know how your fourth stylus goes. My replacement seems OK so far. I did have some trouble getting a battery out of it. Not sure what the deal was, but it was super tight and almost impossible to get out. The metal used in the pen’s frame is fairly soft and I ended up bending part of it trying to force the battery out. Not the end of the world, but definitely not the most well made product.It’s a shame, because I really like the tip and how it handles with Paper by 53. I’d love to give the Jot Touch 4 a go, but it’s not supported by Paper, and I don’t use Procreate or any of the dozen other apps it works with all that much.Alex · Feb 7, 2015Hey Michael! Was reading your block and your tricks and I’m really thankful for the effort you’re taking by creating all the tutorials!! Hope you’ll really write a book about paper, I’d be the first to buy it!!I have a question about the Pogo. There’s a bug i couldn’t get rid of. I have an iPad Air and a Pogo Connect 2… In the Pogo App, the pressure sensitivity works great and also in Procreate but in Paper everything works the other way round… The pencil for example draws dark when i use almost no pressure and when i press harder the lines get lighter… You also recognized those problems or do you have any solution for this?Michael Rose · Feb 7, 2015Thanks Alex. Not sure on the Pogo Connect 2. I only own the original and gave up drawing with it when I upgraded to an Air 2. It’s possible there’'
