description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Switching tools with PaperJul 28, 2021 — by Michael Rose in Mastering PaperNew to Paper by FiftyThree and can’t seem to figure out how to switch tools? I have the short answer for you right here.They may be subtle, but the white dots beneath the row of tools are a big clue to help solve this mystery. Similar to the dots you find at the bottom of your iOS device’s home screen, they indicate there are off-screen goodies to be had.Tool switching (iPad)Swipe across the row of Think Kit tools to reveal another set of five (Fountain Pen, Pencil, Marker, Fine Tip Ink Pen, and Watercolor Brush) to the right.Play YouTube videoTool switching (iPhone)And for you iPhone Paper users there are three sets of tools you can swipe through. Sorry, your browser doesn't support embedded videos, but don't worry, you can download it and watch it with your favorite video player!Animation showing how to switch tools in Paper for the iPhone.I know what you’re thinking, “wow how could anyone miss this?” Well from the amount of emails I receive a month asking how to change tools… quite a lot.Tags: DrawingPaper appTutorialsHow to paint smoothly with the brush toolHow to export high resolution Paper sketchesMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.9 commentsMikef2007 · Jul 3, 2016How do I type on a picture I’ve imported?Michael Rose · Jul 3, 2016You can’t add text directly on top of images you import. You can only add text as note below them.Carroll Durodola · Dec 15, 2016Can I save my work as 300dpi so it is printable in Paper53? My iPad is old, I can’t get Photoshop, Procreate keeps popping off my screen. I’m trying to find an app that will let me save as 300 dpi. HELP!Michael Rose · Dec 17, 2016When you export Paper ideas to your camera roll they’re saved at the same resolution as your iPad’s screen — which varies on what model you have (Pro 12″, Air, Mini, etc.)They also come out at 72 dpi I believe, so you’d need an app that can resample it to 300. On my Air 2 images are 2048 x 1536 which @ 300 dpi comes out to be 6.827 x 5.12 inches… more than enough to print a 4 x 6.You can certainly go larger, but there will likely be some image quality loss. I had one of my drawings blown up and printed at 40″ wide and it looks fine. It really depends on the image though.Cheryl · Oct 3, 2017Is there a way to widen the width of the pencil or brush or? And do you have a stylus you recommend?Michael Rose · Oct 3, 2017Yes you can change the width of the tools by either using styli that are pressure sensitive like Apple Pencil, or varying the speed at width you draw/paint.Here are all the styli I’ve used and my thoughts on them. If you have an iPad Pro I’d recommend Apple Pencil.Robin Baron · Dec 19, 2017How do I import a picture from photo library and edit and email it..?Michael Rose · Dec 20, 2017There is a new tool to the far right of the color wheel (you may need to swipe the tools to reveal it) called Canvas. Tap that and you can import a photo onto the canvas or use one of the included templates.For additional reference see Paper’s support site.Show all 9 commentsRelated entriesHair ScarfUnstoppable HandBokeh Behind that Purple"
