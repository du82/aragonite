elated to the topics of this website and products that a reader/subscriber would have a genuine interest in or need of.I do not and will not recommend a product for the sake of making money.I do not let the compensation I receive influence the content, posts, or opinions expressed on this website.I respect and value my readers too much to write anything other than my own opinions and advice.Like this website, my disclosure policy is a work in progress. As the revenue streams evolve, so will this page.Privacy policyThis Privacy Policy outlines the types of personal information that is received and collected and how it is used on the website. This website does not share your personal information with anyone except to comply with the law or protect my rights.Log filesThis website uses log files to help learn about when, from where, and how often traffic flows to this site. The information in these log files can include:IP address and device identifierRequest date/timePage requestedBytes servedUser agentReferrerError messagesLog data does not contain specific personal information like your name or email address.Cookies and web beaconsThird-party advertisers and services may also place and read cookies on your browser and/or use web beacons to collect information. This website has no access or control over these cookies. You should review the respective privacy policies on any and all third-party ad servers for more information about their practices and how to opt-out.If you wish to disable cookies, you may do so through your web browser options. Instructions for doing so can be found on the specific web browsers’ websites.AmazonAmazon, a third party affiliate marketing network, uses cookies to help make sure I get a commission when you buy a product after clicking on a link or ad banner that takes you to the site of one of their merchants. Read Amazon’s Privacy Notice.CloudflareThis site is hosted on Cloudflare Pages and is configured to use Cloudflare’s “privacy-first”