["https://mademistakes.com/articles/using-jekyll-2017"]
title = "Optimizing and automating my Jekyll site build - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = '''Optimizing and automating my Jekyll site buildAug 3, 2021 — by Michael Rose in ArticlesNot going to lie — I love Jekyll, but huge static sites like mine take forever to build. What used to take seconds now go on for over 30 minutes, as thousands of files are generated and optimized.Inspired by Anne Tomasevich’s post, Optimizing Jekyll Performance with Gulp — I begun digging into my build process to identify performance bottlenecks.At the time of writing this post, my site contained roughly:1,028 images generated at different sizes (5,140 in total).1,052 total documents (991 posts / 14 pages / 3 sets of collections).535 comments stored as YAML data files.And was built with the following Jekyll plugins: jekyll-picture-tag, sort_name, jekyll-archives, jekyll-assets, jekyll/tagging, jekyll-tagging-related_posts, jekyll-sitemap, jemoji, jekyll-category-post-navigation, and jekyll-typogrify.Using Jekyll’s profiler flag --profile, I measured how long the following tasks took to complete1. Before each build I ran jekyll clean to wipe _site, .asset-cache and any other temporary files to keep results more consistent.Task descriptionWindowsMacGenerate responsively sized page.image.feature images1288.29s1429.26sMinify HTML with layout: compress39.35s11.18sRead /images/ and copy to _site/32.39s23.63sBuild tag pages with jekyll-archives17.40s9.99sBuild tag index page with sort_tag filter2.62s0.59sList related posts with jekyll-tagging-related_posts, jekyll/tagging, and LSI: true38.36s17.87sList related posts with vanilla related_posts1.65s4.90sPreprocess, concatenate, minify, and cache bust SCSS and JS with jekyll-assets78.75s25.03sDisplay masthead and overlay menu from _data9.66s7.82sList post comments from _data7.10s2.22sDisplay colophon from _data0.20s0.49sList post taxonomy metadata3.48s1.18sList post breadcrumb links2.83s1.03sList featured posts0.20s0.44sBuild style guide collection1.16s0.31sList post social sharing links5.09s0.97sIs Jekyll faster on macOs or Windows?For giggles I also tested my Windows and Mac development environments against each other. While not exactly an apples to apples comparison I thought it would be interesting to note any variations.Windows EnvironmentMac EnvironmentLenovo ThinkStation E30iMac 21.5-inch, Late 2013Processor 3.30 GHz Intel Xeon E31245Processor 2.7 GHz Intel Core i5Memory 16 GBMemory 16 GB 1600 MHz DDR3Intel SSDSA2BW160G3L 137GB1.12 TB Fusion DriveWindows 7 Professional Service Pack 1OS X El Capitan 10.11.6ruby 2.2.4p230 [x64-mingw32]ruby 2.1.0p0 (2013-12-25 revision 44422) [x86_64-darwin12.0]OptimizationThe numbers above don’t lie. Relying on Jekyll and friends to do jobs more suited for a task runner like Gulp was slowing the build. Armed with this knowledge I started stripping down Jekyll to one of its core purposes — converting Markdown files into HTML.Doing this also allowed me to make my site’s content more portable and not as reliant on a specific static-site generator. In the off-chance I wanted to swap Jekyll for another SSG like Hugo or Gatsby, I could.CSS and JavaScript assetsJekyll Assets is a great plugin that served me well for a long time by: preprocessing, vendor prefixing, concatenating, minifying, and fingerprinting assets. But with a site of my size it was painfully slow to iterate with during front-end development.Making a change to a Sass partial would trigger a full site rebuild, which meant waiting a few minutes before it could be previewed in a browser. Jekyll’s incremental build feature might have helped here, but I never had much luck getting it to work reliably.During development CSS or JavaScript changes would ideally be pushed instantly to the browser with something like Browsersync. By replacing Jekyll Assets with the following Gulp alternatives I was able to do this, and improve build times by 93%:node-sass and gulp-sass: natively compile SCSS files to CSS.gulp-autoprefixer: vendor prefix CSS.gulp-cssnano: minify CSS.gulp-concat: concatenate JavaScript.gulp-uglify: minify JavaScript with UglifyJS.gulp-sourcemaps: add source maps for CSS and JS.gulp-gzip: gzip CSS and JS.gulp-rev: append hash to CSS and JS filenames for cache busting.Task descriptionJekyll AssetsGulpCSS and JavaScript asset pipeline25.031s1.577sHere’s a small taste of the Gulp file I’m using for the site’s styles if you’re curious:// 'gulp styles' -- creates a CSS file from SCSS, adds prefixes and creates a Sourcemap // 'gulp styles --prod' -- creates a CSS file from your SCSS, adds prefixes, // minifies, and cache busts it (does not create a Sourcemap) gulp.task('styles', () => { return gulp.src([paths.sassFiles + '/main.scss']) .pipe(when(!argv.prod, sourcemaps.init())) // preprocess Sass .pipe(sass({precision: 10}).on('error', sass.logError)) .pipe(postcss([ // add vendor prefixes autoprefixer({ browsers: [ 'last 2 versions', '> 5%', 'IE 9' ] }) ])) // minify for production .pipe(when(argv.prod, when('*.css', cssnano({autoprefixer: false})))) .pipe(size({showFiles: true})) // output sourcemap for development .pipe(when(!argv.prod, sourcemaps.write('.'))) .pipe(when(argv.prod, gulp.dest(paths.sassFilesTemp))) // hash CSS for production .pipe(when(argv.prod, rev())) .pipe(when(argv.prod, size({showFiles: true}))) // output hashed files .pipe(gulp.dest(paths.sassFilesTemp)) // generate manifest of hashed CSS files .pipe(rev.manifest('css-manifest.json')) .pipe(gulp.dest(paths.tempDir + paths.sourceDir + paths.dataFolderName)) .pipe(when(argv.prod, size({showFiles: true}))) .pipe(when(!argv.prod, browserSync.stream())) }); // function to properly reload your browser function reload(done) { browserSync.reload(); done(); } // 'gulp serve' -- open site in browser and watch for changes // in source files and update them when needed gulp.task('serve', (done) => { browserSync.init({ // tunnel: true, // open: false, port: 4000, // change port to match default Jekyll ui: { port: 4001 }, server: [paths.tempFolderName, paths.siteFolderName] }); done(); // watch various files for changes gulp.watch(paths.sassFilesGlob, gulp.series('styles', reload)); }); Without going too deep into how these Gulp tasks work, the gist is:A glob of files have “stuff” done to them using various plugins.These files are placed in a temporary folder excluded from Jekyll so they don’t trigger a full site rebuild during development.Production builds move these temporary files and deploys them alongside the HTML files generated by Jekyll.Image assetsResizing a thousand or so images to serve them responsively is no joke — taking over 20 minutes to complete in my site’s case. Up until now I was using the Jekyll Picture Tag plugin to do this work for me… which wasn’t ideal.To try and see if Node and Gulp could do this faster I came up with a set of Gulp tasks to:Generate thousands of “feature” images2 at 4 different sizes with gulp-responsive.Optimize all images using gulp-imagemin.Save the optimized images directly to the destination folder — bypassing Jekyll and a full-site rebuild.This helped some, but it wasn’t until I dropped GraphicsMagick for Sharp3 did I see a noticeable improvement…Sharp really is as fast as they sayI shaved 18 minutes off my build time using this high speed Node.js module!Task descriptionGraphics MagickSharpResize and optimize 1,014 source images into 5 target sizes1288.29s171.00sThe other missing piece was generating the necessary markup for responsive images4. Because I was no longer using the {% picture %} tag to output a fully formed <picture> element, I had to roll my own responsive image markup.{% if page.image.feature %} {% assign f = page.image.feature | split: '.' %} <img src="{{ f[0] | relative_url }}-320.{{ f[1] }}" srcset="{{ f[0] | relative_url }}-768.{{ f[1] }} 768w, {{ f[0] | relative_url }}-1024.{{ f[1] }} 1024w, {{ f[0] | relative_url }}.{{ f[1] }} 1920w" alt="{{ page.title }}"> {% endif %} This bit of Liquid takes the filename as defined by page.image.feature, splits it at the extension, appends suffixes that match those used in the gulp-responsive task, and adds them to the srcset attribute. Boom, resolution switching images!Liquid LimitationsThis Gulp + Liquid hybrid isn’t as nice as a plugin since there is no logic to actually verify if -lq, -320, -768, or -1024 versions of the images exist. I’m willing to overlook that since it did shave 16 minutes off my build time.Simplify layoutsWith the bulk of the time savings coming from faster image resizing tasks, I went after some low-hanging fruit next by decluttering my layouts. Anything that detracted from the main content or added visual noise to the page was fair game for removal.Remove social sharing moduleIncluding buttons at the bottom (or top of post) didn’t really boost shares of my content on Twitter or Facebook — so I dropped them. If someone wants to share it on social media they’ll use the builtin methods of iOS/Android or do it the old fashioned way of copy-pasting a URL.Replace layout: compressOccasionally things on the site would break if inline JavaScript with // styled comments were used. This happened because of a complex set of Liquid filters used in my compress layout to reduce whitespace in the generated HTML.The fix was easy, just surround inline JavaScript comments with /* */ instead. Or do what I did, stop using layout: compress and minify with these Gulp plugins instead: gulp-htmlmin and gulp-gzip.// 'gulp html' -- does nothing // 'gulp html --prod' -- minifies and gzips HTML files for production gulp.task('html', () => { return gulp.src(paths.siteFolderName + paths.htmlPattern) .pipe(when(argv.prod, htmlmin({ removeComments: true, collapseWhitespace: true, collapseBooleanAttributes: false, removeAttributeQuotes: false, removeRedundantAttributes: false, minifyJS: true, minifyCSS: true }))) .pipe(when(argv.prod, size({title: 'optimized HTML'}))) .pipe(when(argv.prod, gulp.dest(paths.siteFolderName))) .pipe(when(argv.prod, gzip({append: true}))) .pipe(when(argv.prod, size({ title: 'gzipped HTML', gzip: true }))) .pipe(when(argv.prod, gulp.dest(paths.siteFolderName))) }); Minifying HTML with GulpIn my tests, replacing _layouts/compress.html with Gulp tasks to minify and gzip every HTML file ended up being slightly slower.Task descriptioncompress layoutgulp-html and gulp-gzipMinify HTML files39.348s47.00sI’m willing to live with the extra 8 seconds of build time as it helps avoid potential site breakages due to badly minified scripts…Reduce and replace JavaScriptI’m close to ditching jQuery and going vanilla, but I’m not quite there yet. Where possible I’ve ditched jQuery plugins and replaced with “lighter” alternatives. Here’s a few highlights:Replaced Magnific Popup with Lity.Replaced Lazyload with Lazysizes + Lazysizes responsive images polyfill extension.Added SVG 4 Everybody for external SVG spritemap support.Replaced FitVids.JS with responsive embed CSS and a custom Jekyll video embed tag.ResultsDecoupling the asset pipeline from Jekyll and Gulp-ifying it made the biggest splash in terms of build time. Along with Browsersync, any asset (CSS, JavaScript, images and icons) updates could be previewed almost instantly. Greatly speeding up the time it takes to develop and iterate the site’s front-end.Made Mistakes Gulp filesThis set of Gulp tasks were heavily inspired by those in Sondre Nilsen’s Jekyllized Yeoman generator. The main gulpfile.js is broken down into smaller bits: assets, build, clean, copy, html, images, and uploading.With paths.js assigning all of the various paths used throughout the files to DRY things up.Automation & Continuous IntegrationAfter ditching Disqus last year to roll my own static-based solution powered by Staticman, I needed to find a better way of deploying the site. Merging in new comments, pulling those commits down, manually building the site locally, and then deploying to my web server wasn’t ideal.With some research I determined a continuous integration5 platform like Travis CI6 that integrates with GitHub was what I needed.Setting things up with Travis CI wasn’t too painful, but there was some trial and error getting dependencies squared away. I’d suggest reading through their documentation, but the basic idea is:Sign in to Travis CI with your GitHub account and grant it access.Configure the build and deployment scripts with a .travis.yml file.Set the type of triggers7 that initiate a build.Travis CI configurationLet’s take a closer look my .travis.yml config file and how I’ve set it up.language: ruby rvm: - 2.2 Since Jekyll is built on Ruby I set the language to ruby. Depending on what version of Jekyll you’re using you can change rvm to meet your needs. I went with 2.2 since that’s the latest Travis CI provides.sudo: false This enables quicker build start times using the new container-based infrastructure.branches: only: - master Fairly obvious, build only from the master branch.cache: bundler: true yarn: true directories: - node_modules # NPM packages Travis CI pulls down and installs gem and Node.js modules before every build. Depending on what you have in your Gemfile and package.json files this can take a bit of time.The above lines enable caching of these dependencies eliminating this installation step.addons: apt: sources: - ubuntu-toolchain-r-test packages: - g++-4.8 env: CXX=g++-4.8 Enables the GCC, GNU Compiler Collection using APT Addon and a newer version of gcc/g++ to properly install Sharp.Travis CI build lifecycleMy build lifecycle breaks down like this:Clone repo and any submodules.Install apt addons.Install Ruby gems.Upgrade Node.js and install Yarn + Node modules.Run Gulp production build task gulp build --prod.Decrypt private SSH keys needed to rsync files to my server.Run Gulp deploy task:deploy: provider: script skip_cleanup: true script: gulp deploy on: branch: master With everything configured I no longer need to build locally and deploy. I can merge in comments or make small edits to Markdown files directly on GitHub, and automatically trigger a site build/deploy.If there’s a problem Travis CI will notify me, otherwise in ~15 minutes (or however long the build takes) any changes committed will be live on the site.Pro tip: use Travis CI with sites hosted with GitHub PagesTravis CI comes in handy if you want to use Jekyll plugins or a more advanced Gulp workflow like I am. There are deployment scripts specifically for this purpose.Netlify, GitLab, and friends also do similar things if you’re feeling constrained by what’s currently allowed by GitHub Pages.Other Jekyll related bitsPagination upgradesLooking to wring a little more #WebPerf juice out of my site, I went after category and tag archive pages next. Depending on the tag, these index.html pages could be quite hefty due to the amount of HTML needed to display hundreds of post teasers.To trim them down in size I needed a way of paginating these pages into small chunks. Jekyll has an official pagination plugin, but unfortunately it’s limited (and deprecated) in what it can actually paginate. Jeky'''
