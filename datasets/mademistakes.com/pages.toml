full_description = "Tag: ReviewsMusings, thoughts, and rants about various “things”… some more in-depth than others.Related topics: Drawing Tutorials Tech geek Design ReviewsiPad stylus recommendationsAug 26, 2016 ~ Read in 2 minsLong story short, if you have an iPad Pro do yourself a favor and get an Apple Pencil. If you have an older (or non-Pro) model below are all the styli I’ve had experience with.Pencil by FiftyThree stylus reviewNov 28, 2014 ~ Read in 8 minsAn avid Paper creator’s impressions of FiftyThree’s new iPad stylus, Pencil.Mix by FiftyThree initial thoughtsSep 16, 2014 ~ Read in 2 minsMix by FiftyThree makes finding, sharing, and learning from inspiring Paper creators easy and fun.Blending with Pencil by 53, first look!Nov 20, 2013 ~ Read in 2 mins53’s Pencil stylus and new Blend feature is full of promise. Here’s a taste of what is possible when using both.Printing Moleskine books on iPadNov 8, 2013 ~ Read in 7 minsImpressions of a handmade Moleskine book designed and printed on iPad with the app Paper.Pogo Connect iPad stylus reviewJul 8, 2013 ~ Read in 9 minsThe Pogo Connect is an iPad stylus that brings pressure sensitivity and enhanced functionality to devices and apps that support it.Corn On Macabre record art ⁠— vellum and metallic ink blissMay 19, 2011 ~ Read in 2 minsMy favorite thing about this Corn On Macabre 7-inch record is the use of vellum and metallic inks in the sleeve.Agna Moraine’s Autobiography, handwritten record artApr 25, 2011 ~ Read in 2 minsI couldn’t begin to tell you what the artwork in this emo record means. But silk screening lyrics on fabric scrapes is kind of cool.Impressions of iPhone 4 from a long time Palm userJun 25, 2010 ~ Read in 3 minsThe following are some of my experiences and observations transitioning from Palm to iOS after nearly 10 years of baggage.The Eviltron and a scary movie makes for a great prankOct 17, 2009 ~ Read in 1 minThe Eviltron device, when setup properly, can land some convincing scares.The iPhone is great, but the Palm Pre is more my styleJun 9, 2009 ~ Read in 3 minsQuick impressions of the Palm Pre from a long time smartphone user.The quality of my first Blurb book is greatJan 25, 2009 ~ Read in 1 minUsing Blurb’s BookSmart software was painless and having it printed was equally enjoyable.Animal Crossing city folk still love the gossipJan 5, 2009 ~ Read in 9 minsA lengthy review of Animal Crossing City Folk for the Nintendo Wii — some things never change.Seeing through blurred eyes — The Diving Bell and The ButterflyJan 29, 2008 ~ Read in 1 minQuick impressions of the film, The Diving Bell and The Butterfly.RRIICCEE show last nightDec 12, 2007 ~ Read in 3 minsMusically — RRIICCEE is fine, but not something I really want to see live again.One week with the new iPod classicSep 14, 2007 ~ Read in 3 minsQuick impressions of the new iPod classic 60GB.Blinded by the light ⁠— Sunshine impressionsJul 28, 2007 ~ Read in 2 minsThe film Sunshine directed by Danny Boyle is science fiction without the big bang.A Tale of Two Sisters is almost Fatal FrameJun 10, 2007 ~ Read in 2 minsMy quick impressions of a Korean horror flick that gives off some serious Fatal Frame vibes.La Moustache quick reviewJun 5, 2007 ~ Read in 1 minMy quick impressions of La Moustache — a French film about a dude shaving his mustache.Feeling kinda stuck in a Half NelsonSep 23, 2006 ~ Read in 2 minsMy impressions of the film Half Nelson, starring Ryan Gosling."
