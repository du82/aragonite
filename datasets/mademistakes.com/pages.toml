ou what the artwork in this emo record means. But silk screening lyrics on fabric scrapes is kind of cool.Collecting records for the artworkApr 21, 2011 ~ Read in 2 minsHow the hand crafted aesthetics found in DIY released emo and hardcore records started my collecting addiction.Typography no nos with Urban OutfittersApr 12, 2011 ~ Read in 3 minsThe typography in Urban Outfitters latest catalog has some serious readability issues.Knowing grids means breaking gridsApr 6, 2011 ~ Read in 4 minsExploring what it means to develop a grid system that helps facilitate strong design with purpose.Makings of a mistake, designing this siteApr 4, 2011 ~ Read in 2 minsAs a designer we’ve all been there. When was the last time you got bored with a design and decided to just burn it and start anew?The quality of my first Blurb book is greatJan 25, 2009 ~ Read in 1 minUsing Blurb’s BookSmart software was painless and having it printed was equally enjoyable."
