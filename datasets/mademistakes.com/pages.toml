full_description = "Inspiring faces want to knowDec 8, 2023 — by Michael Rose in NotesIt’s been a lot of fun drawing the faces of strangers. But you know what’s even better’? Having strangers draw you in return.If you have an iOS device I encourage you to download the free Sktchy app. You don’t have to be an artist to use it — in fact most using the app aren’t. You just need to upload a selfie or two and hopefully inspire someone to create a work of art based on it.I’ve been known to peruse the Inspiration tab in look of faces to draw. So if you’ve been patiently waiting for me to draw you as part of my PaperFaces Project, Sktchy might be a nice alternative.Beard selfies are a mustBeards help get you noticed… the longer the better. Apparently Sktchy artists enjoy them because mine has managed to inspire a handful of drawings and sketches. Who knew?Tags: DrawingSktchy appTech geekStarting youngPaperfaces digital drawing giveawayMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.Related entriesTiger StyleHooded Girl that HidesYou Need a Mouth to Mumble"
