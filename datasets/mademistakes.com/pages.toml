full_description = "Tag: PortraitArtistic representations of people (mostly strangers) that have been created in digital and traditional media.Related topics: Portrait Black and white Beard Time-lapse DrawingPaperFaces projectPortraits (mostly faceless) painted digitally on an iPad with the app Paper by WeTransfer.Procreate paintingsDigital portraits, painted on an iPad with the app Procreate by Savage Interactive.Where possible I’ve included time-lapse videos exported directly from Procreate as a way of showing my drawing and painting process.Tiny paintingsMiniature watercolor portraits painted at really small sizes.Water tensionPortrait of Marie M. digitally painted with Procreate on an iPad.The two hour beardPortrait of Ale B. digitally painted with Procreate on an iPad.Turn awayPortrait of Tatha S. digitally painted with Procreate on an iPad.Corpse paint your tearsPortrait of Maya Z. digitally painted with Procreate on an iPad.Glowing pencil practicePortrait of Foggy 365 digitally painted with Procreate on an iPad.Back at itPortrait of Marion K. digitally painted with Procreate on an iPad.Choke’s embracePortrait of Lunar Ashes digitally painted with Procreate on an iPad.Eyes be damnedPortrait of Mahalia H. digitally painted with Procreate on an iPad.In Your FaceTiny portrait of Adam Vitry, painted with watercolor on hot press paper.Blue and pink lightsPortrait of Jonathan H. digitally painted with Procreate on an iPad.Nose ring oilPortrait of María G. digitally painted with Procreate on an iPad.Watercolor, not watercolorPortrait of Emil I. digitally painted with Procreate on an iPad.Messy paint across the scalpPortrait of April C. digitally painted with Procreate on an iPad.Tales of round brushingPortrait of Morgan F. digitally painted with Procreate on an iPad.Painterly fringed collarPortrait of Jenny x. digitally painted with Procreate on an iPad.Right amount of beard sparklePortrait of Rakso S. digitally painted with Procreate on an iPad.Beard strokes for daysPortrait of David G. digitally painted with Procreate on an iPad.Rough is not rough enoughPortrait of Skylár S. digitally painted with Procreate on an iPad.The better to see youPortrait of Molly M. digitally painted with Procreate on an iPad.Noise on the grainPortrait of T. Steinheil digitally painted with Procreate on an iPad.That vintage lookPortrait of Madison S., digitally painted with Procreate on an iPad.Sunny sky in your eyePortrait of Jj Plix, digitally painted with Procreate on an iPad.Charming to the lastTiny portrait of a Grand Moff Tarkin painted with watercolor on hot press paper.Close the Blast DoorsTiny portrait of a Star Wars Stormtrooper painted with watercolor on hot press paper.Cut My Face in HalfTiny portrait of Michael Rose painted with watercolor on hot press paper.Going somewhere, Solo?Tiny portrait of Greedo painted with watercolor on hot press paper.He Doesn’t Like YouTiny portrait of Ponda Baba painted with watercolor on hot press paper.Hey BlueTiny portrait of Myah Graham, painted with watercolor on hot press paper.Pig LizardTiny portrait of a Gamorrean Guard from Return of the Jedi, painted with watercolor on hot press paper.Sexy SaxophoneTiny portrait of a Bith painted with watercolor on hot press paper.Hair ScarfPaperFaces portrait of Brooke T. drawn with Paper for iOS on an iPad.Blushing my cheeksPortrait of Jordan S., digitally painted with Procreate on an iPad.Don’t play with sootPortrait of Jenell D., digitally painted with Procreate on an iPad.Unstoppable HandPaperFaces portrait of Katelyn M. drawn with Paper for iOS on an iPad.Bokeh Behind that PurplePaperFaces portrait of Neon L. drawn with Paper for iOS on an iPad.Getting lost in the drabPortrait of Mr. Allan, digitally painted with Procreate on an iPad.Unfinished except the nosePaperFaces portrait of Myriam J. drawn with Paper for iOS on an iPad.Broken Neck LinesPaperFaces portrait of the Becca P.J. drawn with Paper for iOS on an iPad.…I feel cold. Death.PaperFaces portrait Lu