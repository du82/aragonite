["https://mademistakes.com/notes/stylus-recommendations"]
title = "iPad stylus recommendations - Made Mistakes"
description = "Long story short, if you have an iPad Pro do yourself a favor and get an Apple Pencil. If you have an older (or non-Pro) model below are all the styli I’ve had experience with."
full_description = "iPad stylus recommendationsAug 2, 2021 — by Michael Rose in NotesLong story short, if you have an iPad Pro do yourself a favor and get an Apple Pencil. If you have an older (or non-Pro) model below are all the styli I’ve had experience with.StylusQuick Impressions1Apple PencilBest stylus I’ve used hands down. Paired with an iPad Pro it’s the closest thing to drawing for real.2Pencil by FiftyThreeSuper reliable, well designed, and long battery life. Tips tend to tare quickly, but they’re replaceable.3Adobe Ink stylusGreat build quality, light weight, and easier to adapt to as the tip is hard like a real pen or pencil.4Ten One Design Pogo ConnectConnectivity issues and hardware flaws are maddening to deal with. Ignoring these problems, apps with pressure sensitivity support perform well.5LunaTik Alloy Touch PenMy trusted sidekick for a long time. Tip (not replaceable) took some serious abuse and kept on licking. Has a refillable roller ball pen if you need a traditional writing instrument.6Just-Mobile AluPenWears out after a few months of use. Nice solid construction. Tips aren’t replaceable.7ZEN 3 in 1Precision disc tip dead on arrival so I couldn’t test that. Rubber nib seems well made and slightly smaller than others giving a bit more precision to your draws.8Chalkee Series Kids StylusGood for kids with small hands. Tip isn’t replaceable and wears out fast.9Universal Touch Screen PenCheap, small, light, and pretty crappy. Comes in a 3 pack that are good as backup styli.The first iPad stylus I purchased was a Just-Mobile AluPen and used it for some time before the rubber tip wore out. Following it I ended up with a LunaTik Alloy Touch Pen after winning one in an art competition.I like the Touch Pen because of its solid construction. The tip isn’t a squishy rubber nib and is super durable. I’ve drawn close to 400 portraits with it and it works as flawless as the day I got it. I’d still be using it if I hadn’t been lured over to the dark-side of smart Bluetooth styli.Speaking of Bluetooth styli, before Apple’s Pencil, FiftyThree’s Pencil was my go to when using Paper. Before that, I was all about the Pogo Connect Smart Pen — even if it’s a piece of crap.Made Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: DrawingReviewsTech geekLearning to draw on iPadHow to make time-lapse videos on iPadMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
