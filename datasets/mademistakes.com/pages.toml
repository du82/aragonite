["https://mademistakes.com/notes/sunshine-movie-impressions"]
title = "Blinded by the light ⁠— Sunshine impressions - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Blinded by the light ⁠— Sunshine impressionsApr 26, 2013 — by Michael Rose in NotesScience fiction movies, now those be my jams. Have been looking forward to seeing Danny Boyle’s new film Sunshine, when I saw a trailer before Sicko a month or so ago. I couldn’t tell you any of the actors’ names other than Cillian Murphy, but they all are pretty familiar faces (ie: dude who played the Human Torch in Fantastic Four & Rise of the Silver Surfer).Armageddon, Deep Impact, The Core… yeah this film is nothing like that garbage. Things start off in space where we are quickly brought up to speed on Earth’s dire condition through some brief narration. About 50 years in the future, 8 scientists are taking a nuke to the Sun in hopes of reigniting it and saving the entire population from certain doom.Quick plot summary, goWe learn that they are the second group to attempt this mission after Icarus I lost contact about six and a half years ago. Before passing into the dead zone they compose their final video messages to send back to their family on Earth since communication will be cut from here on in. Cillian’s character is the only scientist we see recording his message.Shit hits the fan after Icarus II picks up a distress beacon from the missing Icarus I. The eight decide to change course and intercept Icarus I — which always means disaster in these flicks. The idea of igniting a dying star with a nuclear warhead being hypothetical and all — regaining control of Icarus I means two tries. Makes sense to me…Somewhere along the third act this film takes a right turn into a different kind of film. I won’t ruin anything for you, but it’s nothing crazy like blood thirsty aliens showing up. It’s very plausible and works well with the rest of the film up to that point.Closing thoughtsSunshine never tries to insult your intelligence with over simplified scientific babble a 5 year old could understand. In fact there really is little explanation about what is going on or what they are doing. Instead it focuses on philosophical themes and how expendable life is in the greater scheme of things.If you’re looking for a big budget science fiction action adventure skip this one. You’ll think the story moves along too slowly and not enough shit blows up. If you enjoy your sci-fi cut from the indie vein or dug Primer and its realistic explanation of time travel, then you can’t go wrong. B+Tags: EntertainmentReviewsA Tale of Two Sisters is almost Fatal FrameOne week with the new iPod classicMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
