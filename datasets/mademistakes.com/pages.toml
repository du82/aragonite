full_description = "Getting the sold out iPhone 4 at launchNov 8, 2018 — by Michael Rose in NotesLooks like I might actually get an iPhone 4 on launch day. Took AT&T all day to process the order I made at 6:50 AM EST (6/15/2010), but everything is looking good. Guessing I had no problems getting through because I was a new customer and didn’t have to deal with the servers looking up my account info for upgrade eligibility.Tue, Jun 15, 2010 at 6:49 AMDear Michael Rose,Thank you for placing your order with AT&T.Pre-orders for iPhone 4 and iPhone 3GS 8GB will be processed to arrive as early as June 24, 2010, if submitted by 2 p.m. ET, June 22, 2010.The actual shipment date and receipt of your order is not guaranteed and may be subject to delays for reasons that include, but are not limited to, product availability, inventory, credit issues, number porting or carrier delays, and completion of other required AT&T business processes.Additional items added to the cart at the time of your pre-order may ship separately depending on availability. All pre-orders taken online are being handled on a first-come, first-served basis.We appreciate your business and take pride in providing you with the fastest 3G network in America and the best coverage worldwide.Here is a copy of your order summary:Now I’m worried that my existing number will be ported from Sprint today and I’ll be without service on my Palm Pre. From the looks of it AT&T confirmed my number port for 12:30pm today (6/16/2010). Sure hope it doesn’t take effect until I activate via iTunes next week.Now the waiting game begins…Tags: LifeTech geekBizarro me, a credit card scammer?Impressions of iPhone 4 from a long time Palm userMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
