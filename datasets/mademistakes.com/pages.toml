["https://mademistakes.com/mastering-jekyll/how-to-link"]
title = "How to use URLs and links in Jekyll - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = 'URLs and links in JekyllDec 8, 2023 — by Michael Rose in Mastering JekyllBefore you can link pages and assets together with Jekyll, you need to know how it assigns URLs (or permalinks1) to each. If you are a seasoned Jekyll users and have a good understanding of how this all works, skip down below to linking methods.This tutorial will explain the various URL types, how to use them when building with Jekyll, and then how to link content and assets together.How URLs work in JekyllJekyll’s system for creating URLs is simple and flexible, allowing you to structure files how you want. That is…once you understand how permalinks work for posts, pages, collection documents, and static files.Below are the core concepts and conventions you’ll need to get started with each. For an exhaustive list of possible URL patterns and styles, be sure to read Jekyll’s permalink documentation.Global permalinksChanging the global output path for posts and pages is one of the first settings you’ll configure in _config.yml. The default pattern used by Jekyll is permalink: date, which is short for:permalink: /:categories/:year/:month/:day/:title:output_ext This permalink pattern is made up of the :categories, :year, :month, :day, :title, and :output_ext placeholders. For an entire list of placeholders review Jekyll’s placeholder documentation.PlaceholderDescriptioncategoriesAssigned categories for a post from its YAML front matter. Multiple categories e.g., categories: [development, CSS] would output as /development/css.yearYear value (four digits e.g., 2021) from the post’s filename.monthMonth value (two digits 01 through 12) from the post’s filename.dayDay value (two digits 01 through 31) from the post’s filename.titleString from the document’s filename.output_extExtension of the output file, usually .html.In addition to the date permalink, Jekyll has the following patterns built-in for posts. Note: date based placeholders are ignored for documents like pages and collections.Permalink aliasPermalink patterndate/:categories/:year/:month/:day/:title:output_extpretty/:categories/:year/:month/:day/:title/ordinal/:categories/:year/:y_day/:title:output_extweekdate/:categories/:year/W:week/:short_day/:title:output_extnone/:categories/:title:output_extURL defaultsWhen building a fresh Jekyll site using the jekyll new command, the following URL defaults apply. The same is true if your _config.yml omits the permalink configuration as Jekyll falls back to the /:categories/:year/:month/:day/:title:output_ext.Post URL defaultsPosts are a special collection in Jekyll and have filename requirements as described in their posts documentation. Because of this YYYY-MM-DD-title.ext convention, Jekyll is able to determine a post’s title and date without either being manually added via YAML front matter.For example, let’s create a new Markdown post and name it 2021-06-30-new-post.md, making sure it’s in the _posts directory.├── _posts │ └── 2021-06-30-new-post.md Jekyll knows the title of this post is new post and the date is 2021-06-30 for the reasons stated above.When Jekyll builds the site it will use the default permalink pattern of permalink: date and output a HTML file into the _site directory with a root-relative URL of /2021/06/30/new-post.html.├── _site │ └── 2021 │ └── 06 │ └── 30 │ └── new-post.html Posts (unlike pages and other collections) have complete support for categories, which become part of their URL when using the default permalink pattern.Using the example post created above and adding categories to it via YAML front matter:--- categories: ["development", "CSS"] --- The resulting URL would become /development/css/2021/06/30/new-post.html with this file structure:├── _site | └── development | └── css │ └── 2021 │ └── 06 │ └── 30 │ └── new-post.html Note: Categories array is hierarchicalOrder of categories is important as Jekyll applies a hierarchy to them. In the example above development precedes CSS implying a parent-child relationship to the terms, nesting /css inside of /development.Pro tip: Slugified categories (Jekyll v4.1+)Use slugified_categories permalink placeholder to downcase and replace non-alphanumeric characters with hyphens.For example categories: [Ruby on Rails] would convert to ruby-on-rails in the context of a permalink.Page URL defaultsA common Jekyll page convention is to add HTML or Markdown files in the root directory. In fact when running the jekyll new command it scaffolds out the following two pages in the root:├── about.markdown ├── index.html When Jekyll builds the site it will use the default permalink pattern of permalink: date and output two HTML files into the _site directory with root-relative URLs of /about.html and /index.html.├── _site | └── about.html | └── index.html Don’t let permalink: date fool youBecause pages are not date based like posts, even if you add a date via YAML front matter to about.md like so:--- date: 2021-07-07 --- It will not output the file into a year/month/day directory structure. You’ll still end up with:├── _site | └── about.html Note: There are other inconsistencies between posts, collections, and pages that have been documented in this GitHub issue.Pages can be organized into sub-directories and Jekyll will respect that structure and output matching folders and files. For example, if we create a page named privacy-policy.md and place it a directory named terms.├── terms │ └── privacy-policy.md When Jekyll builds the privacy policy page it will output a HTML file into the _site directory with a root-relative URL of /terms/privacy-policy.html.├── _site │ └── terms │ └── privacy-policy.html Note: Page categories and permalinksPages ignore post specific placeholder parameters like date and categories. This is because pages are not date based nor are they included in the site.categories object. Jekyll will omit these values when constructing URLs for pages.For example, if we add categories: [legal] to the privacy-policy.md page above, it has no affect on the permalink of the output file.Collection URL defaultsCollection documents have a default permalink style of permalink: /:collection/:path when output: true is enabled. These files output in a similar way to pages. Meaning they ignore some permalink placeholders like categories.For example, if we create a collection named recipes with the following minimal configuration:collections: recipes: output: true And then create two documents — apple-pie.md and minestrone.md, and place them in the _recipes directory.├── _recipes │ ├── apple-pie.md │ └── minestrone.md When Jekyll builds the site it will use the default permalink pattern of permalink: /:collection/:path and output two HTML files into the _site directory with root-relative URLs of /recipes/apple-pie.html and /recipes/minestrone.html.├── _site │ └── recipes │ ├── apple-pie.html │ └── minestrone.html Collection documents can be organized into sub-directories (just like pages) and Jekyll will respect that structure and output matching folders and files.For example, if we group the apple pie and minestrone recipes into deserts and soups directories inside of _recipes:├── _recipes │ ├── deserts │ │ └── apple-pie.md │ └── soups │ └── minestrone.md Now when Jekyll builds the site these two recipes will output into the following structure:├── _site │ └── recipes │ ├── deserts │ │ └── apple-pie.html │ └── soups │ └── minestrone.html Static file URL defaultsFiles that do not contain any YAML front matter (aka static files), Jekyll outputs in the same structure it sourced from. This applies to images, videos, PDFs, and other assets that aren’t processed via Jekyll’s Sass and CoffeeScript pipelines.Like pages and collection documents, static files can be organized in whichever way you choose and Jekyll will match naming and structure. For example, if we have a image named logo.png and place it in a static/images sub-directory.├── static │ └── images │ └── logo.png When Jekyll builds the site it will and output the logo into the _site directory with a root-relative URL of /static/images/logo.png.├── _site │ └── static │ └── images │ └── logo.png File specific permalinksPermalinks can be set in a file’s YAML front matter, overriding globally set patterns in the _config.yml file. Organizing files in a _pages2 folder and outputting them with a root-relative URL is a common use case.For example, if we create a resume.md page and place it in a _pages subdirectoy.├── _pages │ └── resume.md When Jekyll builds the site it will output the resume page into _pages/resume.html which isn’t what we’re looking to achieve. We’d much rather it end up in pages/resume.html without the leading _.You could of course rename the _pages directory to pages and get the desired result. But if you’re looking to follow the convention of naming Jekyll source directories with underscores, then setting a permalink override is the solution.Inside of _pages/resume.md we can add the following path to force where it outputs to.--- permalink: /resume.html --- Now when Jekyll builds the site it will output the resume page into:├── _site │ └── resume.html We can even change the filename it outputs as:--- permalink: /resume/index.html --- Pro tip: Permalink placeholders in YAML front matterAny of the placeholders you’d typically use to configure a global permalink pattern in _config.yml can also be configured in YAML front matter.Note: aliases like permalink: pretty do not work in front matter, you’ll need to use the full pattern of /:categories/:year/:month/:day/:title/.Duplicate permalinksDifferent source files with the same permalink can cause all sorts of confusion when troubleshooting a Jekyll build. Maybe you made some changes to your home page’s content and can’t figure out why it’s not updating. Or maybe you see nothing at all and the page is blank.This is quite common when forking or copying other Jekyll repositories and ending up with both index.html and index.md files in your project. Since they share a filename, they’ll output to the same location and conflict 💥.This could also happen if you had a file like _pages/home.md with permalink: / or permalink: index.html added to its YAML front matter. Thankfully in newer versions, Jekyll’s CLI will warn you about such conflicts.Conflict: The following destination is shared by multiple files. The written file may end up with unexpected contents. C:/Users/michael/sites/jekyll-site/_site/index.html - home.md - index.md How to linkHow do you link posts, pages, documents, images, videos, and other resources together with Jekyll? Before answering that question, it’s useful to learn about the following URL types:URL typesTypeDescription1Document-relativeURL contains path relative to the current page.2Root-relativeURL contains path relative to the site’s root directory — starts with a forward slash /.3AbsoluteFull URL including protocol, domain, port, and or path.Document-relative URLsA relative URL that does not start with /, is document-relative and will instruct the browser to look for the document or file in the context of the current page.Meaning if the browser has the following page open: https://mademistakes.com/articles/index.html, and there is a document-relative link pointing to article-two/index.html it would browse to the article-two sub-directory inside of the articles directory. Then look for a file named index.html.├── https://mademistakes.com/articles │ └── index.html (current document) │ └── articles-two │ └── index.html When do you use document-relative URLs?In my experience document-relative URLs are not all that common when working with Jekyll unless you have a flat directory structure. The one use case where I think they are helpful is if you want to organize supporting assets with a post in the same directory.├── _posts │ └── 2021-07-12 │ ├── 2021-07-12-weeknotes-8.md │ ├── bbq.jpg │ └── fireworks.jpg Unfortunately Jekyll doesn’t make this easy out of the box as it doesn’t know what to do with the non-Markdown files above.2021-07-12-weeknotes-8.md would be read and output as expected to _site/2021/07/12/weeknotes-8.html, but the static assets bbq.jpg and fireworks.jpg would not.With the help of Nicolas Hoizey’s jekyll-postfiles plugin this can be fixed. Once installed, static assets will follow the same permalink pattern as posts and output alongside them like this:├── _site │ └── 2021 │ └── 07 │ └── 12 │ ├── weeknotes-8.html │ ├── impossible-burgers.jpg │ └── fireworks.jpg Now we can add document-relative links to images (or other assets) in Markdown and HTML files without them 404ing.![Impossible burgers on the grill](impossible-burgers.jpg) <img src="fireworks.jpg" alt="Fireworks exploding in the sky"> Root-relative URLsAs the name implies, root-relative URLs make the path relative to the root directory of the site, denoted by a forward slash /.Meaning if the browser has the following page open: https://mademistakes.com/about/index.html, and there is a root-relative link pointing to /legal/privacy-policy/index.html it would browse to the legal directory from the root directory. Then down into the privacy-policy sub-directory, where it would open a file named index.html.├── https://mademistakes.com │ ├── about │ │ └── index.html (current document) │ └── legal │ └── privacy-policy | └── index.html The forward slash / is import as it starts from the root of the server. If the / was omitted and the link was legal/privacy-policy.html, the browser would try to open https://mademistakes.com/about/legal/privacy-policy/index.html instead. Which would lead to a 404 error page as this file does not exist on the server.When do you use root-relative URLs?Root-relative are most often used to link internal pages (e.g., related posts, category and tag archives, an about page, etc.) from the same site together. In my experience they are helpful when building sites with a deep directory structure.It’s much easier to avoid broken links and 404 pages this way as you don’t have to worry page context when crafting URLs.Some examples of root-relative URLs are:[root-relative file](/root-relative-file.html) <!-- anchor link --> <a href="/root-relative-file.html">root-relative file</a> <!-- sitemap --> <link href="/sitemap.xml" rel="sitemap" type="application/xml"> <!-- JavaScript file --> <script src="/app.js"></script> Absolute URLsUnlike relative URLs, absolutes or full URLs have all of the necessary elements (protocol, domain, port, and path) needed to resolve a URL.When do you use absolute URLs?Absolute URLs are used when linking to pages and files that live outside of the current site.For example, the about page on this site links out to Twitter with the following absolute URL https://twitter.com/mmistakes which contains the protocol https://, domain twitter.com and path of /mmistakes.Some examples of absolute URLs are:[file on another domain](https://not-mademistakes.com/absolute-file.html) <!-- external anchor link --> <a href="https://not.mademistakes.com/absolute-fil'
