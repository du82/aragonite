full_description = "Glitching outJan 17, 2017 — by Michael Rose in PaperFaces iPad projectPaperFaces portrait of @thenimesh.When I edit drawing footage I captured from an iPad, I like to speed up the final movie to around 4-5 minutes max. Keeps the video more interesting and fun to watch.At this speed it can be hard to observe what is going on and looks more like a magic trick if you ask me. YouTube has bumped my account allowing uploads over 15 minutes so I decided to try a longer edit. I’m not entirely sure what the hard limit is, but I decided against uploading the 1 hour and 23 minute real time capture, and instead went with this 17 minute cut.Even at 17 minutes it’s fairly boring to watch, but maybe 2 or 3 of you will enjoy it.Play YouTube videoTools used:Pogo Connect Bluetooth Smart PenPaper by WeTransferMade Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: Paper appPortraitTime-lapseRed sweatshirt, I thinkBird backMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.Related entriesI knowSmile and blushWhite Eyes Glow Sometimes"
