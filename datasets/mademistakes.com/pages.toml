["https://mademistakes.com/articles/using-jekyll-2016"]
title = "How I’m using Jekyll in 2016 - Made Mistakes"
description = "Documenting my approach to using Jekyll, how that's evolved over the years, and web development learnings I've picked up along the way."
full_description = '''How I’m using Jekyll in 2016Mar 21, 2022 — by Michael Rose in ArticlesI first started using Jekyll — a static site generator, back in 2012. In the four years since, it has indirectly introduced me to a host of new tools and ways of building websites. Hell, I wasn’t even using version control when developing this site — so you know a lot has changed.What follows is a brain dump documenting my approach to using Jekyll, how that’s evolved over the years, and any other learnings I’ve picked up along the way. This is mostly an excuse for me to capture and reflect on things, but maybe you’ll find some useful nuggets in the mess that’s sure to follow.Converting and restructuring contentTo learn how Jekyll works I set off on a journey to turn a Wordpress powered site into the static version you see now. I read several tutorials, learned Kramdown1 and Liquid, blogged about the process, and eventually ended up with something I was happy with — all without a database or CMS.Posts for all the thingsAs Jekyll has matured and added features, the complexity at which I use it has too. In those early days, content could only be considered a post or page. Posts became more valuable to me than pages since they could reap the benefits of site.tags and site.categories for creating archives and as a way to surface “related content”.Posts made a lot of sense then because the only type of content I had on the site were blog posts. As I started incorporating things like portfolio pieces into the site I used categories as a way to structure content by “post type.” For example, Blog Articles would get categories: articles added to their YAML Front Matter and path: /:categories/:title/ in _config.yml to produce pretty URLs like /articles/jekyll-is-the-best/.A drawback I hit with this method was reliable pagination between posts. Jekyll provides the variables page.previous and page.next to help create previous/next style links between posts. But because I was trying to section off posts by category, these links didn’t always behave as expected.For example, when reading a post in the articles category, I’d expect the NEXT → link to show the next article post. Instead, something from the portfolio category came up because it was the next item in the site.posts array. With plugins or a messy bit of Liquid you could probably filter on the current category and get around this, but I never took it that far.Details like this drive me bonkers, so instead I opted for a You May Also Enjoy module that displays three related posts (with the help of a plugin2) at the bottom of the page. In my eyes, this provided a better reading experience even if my site took longer to generate at build…Jekyll versionBuild timePostsThen0.12.1< 1s25Now3.1.1121.62s980It’s no coincidence that my build times went from under a second to a few minutes as I hit almost 1,000 posts. Moving to solid-state drives and reducing the amount of Liquid for loops in my layouts and includes has helped — but I still have ways to go if I want to speed things up further.The new --incremental regeneration feature will eventually play a big role in speeding things up. On a default jekyll new site it works really well, but unfortunately I haven’t had much luck getting it to play nicely with the plugins I use. Work currently being done on this feature seems like its going in the right direction, so I’m sure in time things will sort out.For now the best I can do is use the new Liquid Profiler3 to identify problematic bits and simplify where I can. I add new content so infrequently that it really isn’t a bother waiting 2 minutes for a build to finish, but damn it would be nice to hit < 1s again!jekyll build --profile Configuration file: _config.yml Configuration file: _config.dev.yml Source: /Users/michael/Sites/made-mistakes-jekyll Destination: /Users/michael/Sites/made-mistakes-jekyll/_site Incremental build: disabled. Enable with --incremental Generating... Filename | Count | Bytes | Time ---------------------------------------+-------+-----------+------- _layouts/default.html | 1379 | 42258.40K | 36.456 _layouts/autopage_tags.html | 344 | 7192.14K | 27.259 _layouts/post.html | 994 | 5557.85K | 26.212 _includes/posts-paginated.html | 354 | 6967.45K | 25.228 _includes/entry.html | 351 | 6826.94K | 24.220 _includes/head.html | 1379 | 23448.94K | 22.107 _includes/page-intro.html | 1378 | 1879.93K | 17.263 _includes/head-seo.html | 1379 | 2031.35K | 12.697 _includes/pager-category.html | 994 | 518.13K | 4.545 _includes/contact-list.html | 1379 | 1424.79K | 4.059 _includes/favicons.html | 1379 | 1082.73K | 3.544 _includes/comment.html | 42 | 1172.45K | 3.157 _includes/comments.html | 52 | 939.71K | 2.429 sitemap.xml | 1 | 117.42K | 2.127 done in 131.732 seconds. Auto-regeneration: disabled. Use --watch to enable. CollectionsWhen collections were introduced back in v2.0, I decided to build out a Frequently Asked Questions section on my site to familiarize myself with the feature.Creating a collection of FAQ items turned out to be easier than expected. Make a _faqs directory populated with Markdown-formatted text files (like any other post or page), configure the collection in _config.yml, build an index page to display all of the collection’s documents, and done!# _config.yml collections: faqs: output: true path: /:collection/:path/ title: FAQs As collections have elevated in status they’re increasingly becoming my preferred way of working with static content. In addition to the FAQs collection I’ve also created one to build a “living style guide” of sorts — documenting the look and feel of the site with visual representations and code samples.Eventually I plan to convert more posts into their own collections. Posts currently categorized as work seem like the obvious choice since its always felt funny shoe-horning them into _posts. As far as others? Not sure yet.What I’d like to investigate deeper is adding taxonomies to collections and how they mingle with the tags and categories already in site.posts. I’m not exactly sure if they coexist with site.tags or how tag archives generated by Jekyll Archives might see them. A job best saved for a rainy day I suppose…Pages for everything elseContent that doesn’t need to be ordered chronologically or grouped in any way becomes a page. To keep things nice and tidy I place all of the source .md or .html files into a _pages directory and assign path overrides in the YAML Front Matter of each.An architecture like this helps centralize the content so you’re not poking around trying to locate files. Meaningfully naming files should be the goal. Avoid patterns like /about/index.md as it makes distinguishing between multiple index.md files harder.project-name/ ├── _assets/ ├── _data/ ├── _drafts/ ├── _includes/ ├── _layouts/ ├── _pages/ | ├── 404.md # custom 404 page | ├── about.md # about page | ├── contact.md # contact page | └── home.md # home page (eg. <root>/index.html) ├── _posts/ ├── .gitignore ├── _config.yml └── Gemfile And then in each Markdown file I set a path that fits in with the format used on the rest of the site.Examples: about.md ~> path: /about/, home.md ~> path: /, contact.md ~> path: /contact/, etc.Pro tip: include your pages directoryTo be sure Jekyll “sees” and processes the files inside of _pages, be sure to include it. Add include: ["_pages"] to _config.yml and you should be good to go.An evolutionFrom a workflow perspective, things have mostly stayed the same. I still “write in Markdown”, build this site locally, and push the contents of the _site directory to a web server. On the development side, however, complexities have been introduced in an effort to optimize and improve website performance.Tinkering and experimenting with the visual design of Made Mistakes whenever I want is important to me. Since I work on both Mac OS X and Windows based devices I need tooling that plays nicely with each. Below are the tools, configurations, and Jekyll plugins that help do that.BundlerInstalling Ruby, Bundler, and Ruby Gems were all new to me four years ago. Running jekyll build on different operating systems felt like a crap shoot. A setup that worked one day would most certainly break the next after updating Jekyll on a Windows machine.I eventually learned to embrace Bundler from the advice of numerous Stack Overflow threads and GitHub issues. Since Bundler is the official way to install Jekyll it wasn’t that big of a leap for me to start using a Gemfile to manage all dependencies. To do that:Run bundle init to create an empty GemfileAdd gem 'jekyll' and any other gems to the Gemfile.# Made Mistakes example Gemfile source 'https://rubygems.org' gem 'breakpoint' gem 'wdm', '~> 0.1.0' if Gem.win_platform? gem 'mini_magick' gem 'autoprefixer-rails' gem 'uglifier' # Jekyll and Plugins gem 'jekyll' gem 'jekyll-archives' gem 'jekyll-tagging-related_posts' group :jekyll_plugins do gem 'jekyll-assets', github: 'jekyll/jekyll-assets' gem 'jekyll-sitemap', github: 'jekyll/jekyll-sitemap' end Now when running bundle install each of the gems specified above are installed and a Gemfile.lock is created listing all of the dependencies. Prepending all Jekyll commands with bundle exec ensures only the versions in Gemfile.lock are executed helping to mitigate conflicts.Committing both of these Gemfiles to a git repository also makes it easy to revert back if a gem update goes bad. Sure it’s a few more characters to type, but the headaches it solves are more than worth it. You can even write shortcut tasks with Rakefiles to eliminate the extra keystrokes — if automation is your thing (more on that below).Environments and configurationsWith the introduction of asset related plugins and various other build steps, I eventually settled on two Jekyll configuration files. A default _config.yml with production settings and _config.dev.yml for development specific ones.The cool thing is you can chain together these configuration files, overriding settings from the previous. For example, when building locally I’d like {{ site.url }} and {{ site.disqus-shortname }} to default to their development equivalents for testing purposes. Adding the following values to _config.dev.yml overrides the ones in _config.yml:url: http://localhost:4000 disqus-shortname: mmistakes-dev A development server can then be fired up with the relevant settings using…bundle exec jekyll serve --config _config.yml,_config.dev.yml Going one step further a Jekyll environment can be specified as well. By default Jekyll runs in development with a value of JEKYLL_ENV=development. The compress.html layout and Jekyll-Assets plugin both make use of this triggering HTML, CSS, and JavaScript compression with the following command:JEKYLL_ENV=production bundle exec jekyll build Windows environment gotchaOn Windows I had issues minifying when JEKYLL_ENV=production bundle exec jekyll build silently failed. Instead, I found that the SET command had to be used to assign environment variables.set JEKYLL_ENV=production Other configurationsAs mentioned earlier I have a moderately sized Jekyll site at 1,005 posts. Combine that fact with an /images/ directory that is close to 2 GB, a liberal use of Liquid for loops, and generator plugins like Jekyll Archives — you get site builds that are far from instant. And in the rare cases when I run jekyll clean to flush caches and everything in /_site/, builds can take over 15 minutes as the Jekyll Picture Tag plugin regenerates appropriately sized hero images for every posts. Yikes!So as you might have guessed, I sure as hell never start up a server with auto-regeneration enabled. Instead, I start with bundle exec jekyll serve --no-watch and then run a rake task to manually build every time I want to check changes locally.When working on the site’s design it can be cumbersome to sit through a 2 minute build just to check a CSS change. But until --incremental works reliably its something I have to suffer through (or use plugins to isolate posts at build). Its a good thing I do a lot of my ‘designing’ in-browser with Chrome’s DevTools before editing the actual source as this hasn’t been too annoying.Automation tools and shortcutsTo save time (and my sanity) when working on the site locally, I employee a few tools to perform common development related tasks.GruntGrunt describes itself as “the JavaScript task runner.” Grunt has a fairly large set of plugins that can handle pretty much any mundane task you through at it.Prior to Jekyll natively supporting Sass I used Grunt plugins to pre-process .less files, concatenate a set of JavaScript files, and optimize image assets. Now that I’m running Jekyll 3.1 and the Jekyll-Assets plugin I no longer need Grunt to mess with my scripts and stylesheets.These days I use Grunt solely for optimizing images and SVGs with the following plugins:// Grunt plugins in package.json "devDependencies": { "grunt": "~0.4.2", "grunt-newer": "^0.7.0", "grunt-imgcompress": "~0.1.1", "grunt-svgmin": "~0.3.1", "grunt-svgstore": "^0.5.0" } When I add new JPEG or PNG assets to /images/ I use the following command to optimize them — reducing their file size and speeding up page loads.grunt images On the SVG side of things any files added to /_svg/ are optimized and merged into a single sprite map with the following command:grunt svg In combination with both of these tasks I use the grunt-newer plugin. This dramatically speeds up things as only new and modified files are processed.RakeOn the build and deployment side of things I have a few shortcut tasks defined in Rakefile.rb. As mentioned earlier typing out bundle exec before Jekyll commands can get old fast. Instead, I use the following:Start up a Jekyll serverrake serve Production build, development build, and build with draftsrake build rake build:dev rake build:drafts DeploymentSince I self-host my site I need a way of pushing the contents of the /_site/ directory after a production build. Years ago I’d use Cyberduck or FileZilla to transfer everything over slowly to Media Temple via FTP.These days I use rsync to speed that transfer way the hell up, sending only new and modified files. It’s also a task that I can automate by adding the following to my Rakefile.rb file.# Usage: rake rsync desc "rsync the contents of ./_site to the server" task :rsync do puts "* rsyncing the contents of ./_site to the server" system "rsync --perms --recursive --verbose --compress --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r _site/ [email protected]" end As part of my deployment process I also run tasks that notify Ping-O-Matic, Google, and Bing that the site has been updated and to index the sitemap.xml and atom.xml feeds. These tasks look something like this:# Usage: rake notify task :notify => ["notify:pingomatic", "notify:google", "notify:bing"] desc "Notify various services that the site has been updated" namespace :notify do desc "Notify Ping-O-Matic" task :pingomatic do begin require 'xmlrpc/client' puts "* Notifying Ping-O-Ma'''
