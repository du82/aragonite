full_description = "Tag: Paper appPaper by WeTransfer is a sketching, drawing, painting, diagraming, wireframing, and collaging app for iPad and iPhone.The following tutorials and tricks are from my Mastering Paper series. For hundreds of portraits drawn with the app, peruse the PaperFaces gallery.Related topics: Portrait Black and white Beard Time-lapse DrawingPaperFaces projectPortraits (mostly faceless) painted digitally on an iPad with the app Paper by WeTransfer.How to draw straight linesAug 26, 2016 ~ Read in 1 minTo draw straight lines on the iPad in apps that don’t have a ruler tool, I use whatever straight edge I have laying around: plastic ruler, book cover, piece of cardboard, notepad, etc.How to export high resolution Paper sketchesAug 26, 2016 ~ Read in 1 minWith Paper by WeTransfer you can only export as large as your iPad’s native resolution. If you care about getting more pixels out of your Paper art than the largest iPad Pro1 is the way to go. Larger screen == higher resolution!Learning to draw on iPadAug 26, 2016 ~ Read in 1 minHow did I git gud at drawing and painting on an iPad? The answer that no one likes to hear is “practice, practice, practice.” I wish there was some magical shortcut for learning how to draw, but there isn’t.Switching tools with PaperMay 16, 2016 ~ Read in 1 minHow to switch tools in the app Paper for iPad and iPhone.How to paint smoothly with the brush toolMay 12, 2016 ~ Read in 1 minA smooth gradient can be achieved layering washes of watercolor on top of each other. Speed and pressure play an important role in how clean of a tone you end up with. My Paper app basics guide explains all the nuances of the watercolor brush and techniques for using it.Hair ScarfPaperFaces portrait of Brooke T. drawn with Paper for iOS on an iPad.Paper v3.0 featuresSep 11, 2015 ~ Read in 6 minsPaper comes to the iPhone with productivity boosting features like photo import, text notes, grid view, rotate, and more.Unstoppable HandPaperFaces portr