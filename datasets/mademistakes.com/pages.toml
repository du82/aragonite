["https://mademistakes.com/tag/drawing"]
title = "Drawing - Made Mistakes"
description = "Tutorials and thoughts on drawing digitally and with traditional media such as pencil, paint, pen, charcoal, etc."
full_description = "Tag: DrawingTutorials and thoughts on drawing digitally and with traditional media such as pencil, paint, pen, charcoal, etc.Related topics: Portrait Time-lapse Drawing Tutorials Tech geekPaperFaces projectPortraits (mostly faceless) painted digitally on an iPad with the app Paper by WeTransfer.Procreate paintingsDigital portraits, painted on an iPad with the app Procreate by Savage Interactive.Where possible I’ve included time-lapse videos exported directly from Procreate as a way of showing my drawing and painting process.Tiny paintingsMiniature watercolor portraits painted at really small sizes.Oil pastels are not pencilsOct 27, 2016 ~ Read in 1 minNot to overstate the obvious here, but oil pastels do not behave like colored pencils…Inktober failureOct 17, 2016 ~ Read in 1 minLike previous years, I started out with the best of intentions for Inktober and then quickly lost steam…How to draw straight linesAug 26, 2016 ~ Read in 1 minTo draw straight lines on the iPad in apps that don’t have a ruler tool, I use whatever straight edge I have laying around: plastic ruler, book cover, piece of cardboard, notepad, etc.iPad stylus recommendationsAug 26, 2016 ~ Read in 2 minsLong story short, if you have an iPad Pro do yourself a favor and get an Apple Pencil. If you have an older (or non-Pro) model below are all the styli I’ve had experience with.Learning to draw on iPadAug 26, 2016 ~ Read in 1 minHow did I git gud at drawing and painting on an iPad? The answer that no one likes to hear is “practice, practice, practice.” I wish there was some magical shortcut for learning how to draw, but there isn’t.What tablet do you use?Aug 26, 2016 ~ Read in 1 minIf it wasn’t obvious from the artwork on this site, I draw, paint, and create on Apple’s iPad. My current model is a 12.9″ Pro (256GB) with the Space Gray finish. Before I took the plunge and upgraded to the larger screen I had an Air 2 and the first retina iPad — both of which I’ve handed down to my kids.Switching tools with PaperMay 16, 2016 ~ Read in 1 minHow to switch tools in the app Paper for iPad and iPhone.How to paint smoothly with the brush toolMay 12, 2016 ~ Read in 1 minA smooth gradient can be achieved layering washes of watercolor on top of each other. Speed and pressure play an important role in how clean of a tone you end up with. My Paper app basics guide explains all the nuances of the watercolor brush and techniques for using it.The path to iPad ProSep 25, 2015 ~ Read in 11 minsConvincing myself that I need an iPad Pro and Apple Pencil to fulfill all my digital illustration needs.Mastering Pencil by FiftyThreeJun 24, 2015 ~ Read in 19 minsLearn how to create impressive effects with 53’s Pencil stylus and Paper app, using exclusive features like Blend and Surface Pressure.Faux layer technique for PaperApr 15, 2015 ~ Read in 5 minsLearn Paper’s faux layer technique and how it can aid in sketching and tracing on iPad.Drawing experienceMar 12, 2015 ~ Read in 2 minsI’ve been drawing with traditional tools and materials — on and off for the last 20 years. And drawing with digital tools on iPad, the last 3 years.Drawing outer space with PaperJan 2, 2015 ~ Read in 14 minsLearn how to draw stars, galaxies, planets, black holes and more with Paper on iPad and 53’s Pencil stylus.How to use Paper’s color pickerDec 18, 2014 ~ Read in 7 minsTutorial explaining how to use Paper’s new color picker tool to sample, mix, and share colors.Pencil by FiftyThree stylus reviewNov 28, 2014 ~ Read in 8 minsAn avid Paper creator’s impressions of FiftyThree’s new iPad stylus, Pencil.Mastering Mix by FiftyThreeNov 25, 2014 ~ Read in 10 minsDownload these templates for Paper and discover how to use Mix to Learn, Sketch, Play, Write, Design, and Think.How to undo and erase in PaperOct 25, 2014 ~ Read in 7 minsLearn how to use Paper’s eraser tool to undo and cover-up mistakes on iPad.Mix by FiftyThree initial thoughtsSep 16, 2014 ~ Read in 2 minsMix by FiftyThree makes finding, sharing, and learning from inspiring Paper creators easy and fun.Watercolor brush improvementsSep 16, 2014 ~ Read in 2 minsDiscover the secrets of Paper’s newly updated watercolor brush in this short tutorial and video.PaperFaces retrospectiveAug 29, 2014 ~ Read in 8 minsA look back at two years of drawing over 800 portraits using an iPad and Paper for iOS.Paperfaces digital drawing giveawayAug 24, 2014 ~ Read in 1 minEnter to win a portrait of your choice drawn by Michael Rose in his signature PaperFaces style.Grid method of drawingJul 6, 2014 ~ Read in 6 minsHow to use the grid method of drawing to improve your accuracy when drawing with the app Paper on iPad.How to zoom while paintingJul 3, 2014 ~ Read in 3 minsLearn how to reposition Paper’s zoom loupe mid-stroke to help add detail to your drawings.Drawing realistic portraits with PaperApr 21, 2014 ~ Read in 15 minsAdvanced Paper tutorials and techniques for drawing and painting faces with an iPad.Inspiring faces want to knowApr 1, 2014 ~ Read in 1 minFinding inspiration from the faces of strangers on Sktchy for iOS.Drawing and painting basicsFeb 9, 2014 ~ Read in 11 minsLearn the basics of iPad drawing and painting with the app Paper by WeTransfer (formerly 53).Contour line drawing on iPadJan 13, 2014 ~ Read in 4 minsHow to use blind contour line drawing and the iPad app Paper, to improve hand eye coordination and observation skills.Drawing textures with PaperNov 25, 2013 ~ Read in 10 minsTutorials for drawing bricks, wood, and rock textures with the Paper app on iPad.Blending with Pencil by 53, first look!Nov 20, 2013 ~ Read in 2 mins53’s Pencil stylus and new Blend feature is full of promise. Here’s a taste of what is possible when using both.Printing Moleskine books on iPadNov 8, 2013 ~ Read in 7 minsImpressions of a handmade Moleskine book designed and printed on iPad with the app Paper.Drawing water with PaperSep 29, 2013 ~ Read in 6 minsTechniques for drawing water and waves using the app Paper on iPad.Drawing clouds and skies with PaperSep 5, 2013 ~ Read in 7 minsiPad tutorials and techniques for drawing blue skies, clouds, and sunsets with the app Paper.Drawing trees and grass with PaperAug 31, 2013 ~ Read in 6 minsTechniques on how to draw trees, grass, and other foliage using the Paper app on iPad.365 days of drawing facesAug 29, 2013 ~ Read in 1 minYear one of my 365 day portrait project may be over, but I’m just getting started.Getting started with PaperJul 31, 2013 ~ Read in 11 minsAn introduction to Paper’s tools and how best to exploit them for drawing realistically.Pogo Connect iPad stylus reviewJul 8, 2013 ~ Read in 9 minsThe Pogo Connect is an iPad stylus that brings pressure sensitivity and enhanced functionality to devices and apps that support it.Drawing faceless portraits with PaperMay 16, 2013 ~ Read in 5 minsQuick tutorial for drawing faceless (e.g., PaperFaces) portraits on iPad with the Paper app.Drawing hair with PaperMay 10, 2013 ~ Read in 3 minsLearn how I draw hair quickly with the Paper app for iPad.Quick tips for iPad sketchingFeb 13, 2013 ~ Read in 5 minsHow to sketch faceless (e.g., PaperFaces) portraits and landscapes on an iPad, with the app Paper.Sketching PaperFaces portraitsAug 31, 2012 ~ Read in 7 minsAn experiment in humanizing the web — drawing a portrait everyday on iPad with the app Paper."
