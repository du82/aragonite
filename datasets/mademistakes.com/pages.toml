["https://mademistakes.com/mastering-paper/introduction-tool-guide"]
title = "Getting started with Paper - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Getting started with PaperSep 8, 2021 — by Michael Rose in Mastering PaperPaper by FiftyThree and me were BFFs from the start. Spread across my journals you’d find around 600 pages with creation times ranging from 30 minutes to 4 hours. A conservative estimate has me logged at around 500 hours of drawing and painting in this iOS app — which is kind of crazy when I think about it.I’m not sure if that qualifies me as a good teacher or not, but I’m going to try and expand on my tips and techniques in the following guide.In this first part you’ll learn about the benefits of a stylus, how the Paper app tools work, and basic gestures you’ll want to master.The remaining parts will dig deeper into techniques I use when drawing, page management, advanced features, and how to record the iPad’s screen and make time-lapse videos of your work.Is a stylus necessary?Finger painting with Paper can yield some impressive results, but may feel unnatural if you’re used to drawing with pens and pencils. If you decide to go with a capacitive stylus be aware that it won’t match the precision of a traditional pen because of the fat and rubbery tip.Pro tip: use an iPad stylus meant for accuracyFor those craving precision I’d suggest trying one of the many Adonit Jot styli. The tips on these bad boys have clear plastic tips that can pivot and tilt allowing you to see where you are on the iPad’s screen. Paper doesn’t support the fancier Bluetooth ones, but apps like Procreate do.Going one step further are styli built with pressure sensitivity in the tip that can alter the characteristics of a mark depending on how hard you press on it. Paper by 53 supports Ten One Design’s Pogo Connect Smart Pen out of the box, and has become my go to stylus when creating on iPad. To learn more about how it became a favorite, check out my image filled Pogo Connect review.The tools and how they behaveStarting with order of appearance you have the following tools at your disposal: eraser, fountain pen, pencil, marker, ink pen, watercolor brush, and color mixer. The fountain pen and eraser are included with the free app — the rest can be downloaded via in-app purchase as a set or individually.When describing these tools I will be using the following descriptors:Speed: How does the speed of drawing affect a line’s weight.Blending: Are marks opaque1 or translucent and how many layers are needed to make a pure color2.Sensitivity: How are marks and line quality affected by the amount of pressure applied when using a Pogo Connect Smart Pen.EraserThe eraser does what its name implies — it erases. It is not the most precise tool with such a fat tip, which is why I prefer to undo mistakes with the rewind tool instead (more on that later).For handling cleanup duty, the eraser is very effective at defining edges and making them straight. By simply running it along an edge you can remove jaggies left by a pencil or watercolor stroke.Speed: Slow = thin. Fast = thick.Blending: Completely opaque. One stroke erases down to the egg shell white colored background.Sensitivity: Soft = thin. Hard = thick.Fountain pen (Draw)Along with the eraser, the fountain pen is included for free when you download Paper by FiftyThree from the App Store. This was the tool I originally used the most when experimenting with Paper a year ago. It’s hard not to fall in love with the flowing lines it makes when sliding your fingertips across the iPad’s glass screen.The fountain pen is slightly transparent.My drawing style has evolved over the year from crisp line work to soft blended edges and tones. Because of this shift the fountain pen sees less usage and has been demoted to janitorial status like the eraser. Perfect for getting into tight places it also works well when coloring large blocks of color.Pro tip: quick and dirty erasingThe eraser removes everything — including a background filled with color. A fountain pen filled with color that matches the background can be used instead of the eraser to correct mistakes. Improvements to the eraser tool have made this technique less needed, but it still has its uses.Speed: Slow = thin. Fast = thick.Blending: Almost fully opaque. Depending on the color it can take 2–3 layers to create a purely opaque color.Sensitivity: Soft = thin. Hard = thick.Pencil (Sketch)Versatile and perfect in almost any situation — this is the one tool you should invest time in learning. The marks it makes resemble a traditional 2B pencil leaving behind a texture perfect for shading. The pencil also works great for lightly sketching to nail your composition before painting.Shading power is amplified immensely when used with a fancy Bluetooth stylus with pressure sensitivity. If you’ve used a pencil in real life to draw you already know how to use this digital incarnation — making it one of the most precise and forgivable tools in Paper’s toolbox.Speed: Slow = dark. Fast = light.Blending: Semi-transparent — takes many layers to create a purely opaque color.Sensitivity: Soft = light. Hard = dark.Marker (Outline)Unlike the fountain pen, the marker makes transparent marks you can see through. To make sense of the marker I pretend it’s one of those neon yellow highlighters. If you drew yellow over black it wouldn’t show up, the same is true in Paper.The exception to this rule is when the marker is filled with white. In this case it would act almost identically to the eraser but instead of an off-white color it makes a pure white.If you look closely you can spot the slight difference in color.When sharp shadows and values are desired in your illustrations, the marker tool is A+++. I tend to work more photo-realistic, but if you want that cartoon or comic book look the marker might be for you.Speed: Slow = thick. Fast = thin.Blending: Transparent, except white and black colors.Sensitivity: Soft = thin. Hard = thick.Ink pen (Write)Like the name implies the ink pen behaves like a roller-ball pen. If you look at the lines it creates you’ll notice heavier spots where a stop or start occurs. Uniform lines can be achieved by moving quickly throughout the entire stroke.If you found the fountain pen’s thick/thins undesirable or hard to control the ink pen might be a better choice. The ink pen has less variation in line-width making it a perfect choice for writing or doing detail work.Before I began using a Pogo Connect Smart Pen, I did all my lettering and writing with the fountain pen. I found the pressure sensitivity of that stylus difficult to control when crafting letter forms, so I switched to the ink pen3 instead.Speed: The difference is barely noticeable. Moving slower will make a slightly thicker line.Blending: Opaque.Sensitivity: The difference is barely noticeable. Pressing harder will make a slightly thicker line.Watercolor brush (Color)Like the pencil, the watercolor brush is another tool you should spend time experimenting with to learn all its nuances. This tool sets Paper apart from other apps by replicating the natural feel of pushing and pulling paint across a canvas. Without it I wouldn’t be able to shade, paint skies, or render hair realistically at all.Pro tip: manipulate the brush’s sizeWhile there is no obvious way to change the size of your brush in Paper by FiftyThree, you can make thinner lines when used with a pressure sensitive stylus like the Pogo Connect Smart Pen. Pressing lightly will make a line about a 1/4th as thick as the default one. FiftyThree’s Pencil stylus also allows you to dynamically change brush size depending on how you hold it.It helps to think of your stylus tip as a brush loaded with watered down paint. Because the paint has been thinned it won’t be as intense or saturated as the color from one of the pens. Instead you need to build up color in multiple layers.This “thinned out” behavior also factors into how even of a coat you can apply. Moving the brush faster doesn’t let the paint fully cover a spot and will make it appear choppy. While moving slowly allows the paint to flow evenly off the brush and build into a dark even value. Mastering the speed at which you apply color is essential to creating even tones and shading.It may be helpful to create a few color scales with the primary colors, gray, and black to practice. Below are watercolor tests I created for myself after FiftyThree updated Paper to include the Color Mixer tool.Pro tip: white to lightenWhen loaded with white the watercolor brush can become a way to lighten areas you’ve painted or drawn. Keep in mind that white paint doesn’t behave like other colors and can be difficult to master. If you paint too slowly it will remove most of the color and leave you with bright white spots.Color MixerBefore the Color Mixer existed, you had to get creative if you wanted a color other than the nine Paper shipped with. By mixing these colors directly on canvas you could make other colors. Some colors worked great with this technique while others turned to mud if too many layers were applied.First row: mixing colors directly on canvas. Second row: mixing colors with the Color Mixer.Color theory is a tricky dick — thankfully FiftyThree did something great with their Color Mixer. Mixing together any color will almost always make a new one that looks great.For those who need more control or want a traditional color picker — one can be accessed by dragging a color swatch onto the mixing wheel, then tapping on it. From here you can adjust a color’s hue, saturation, and brightness (luminosity).For a good shadow color, I adjust the base color I’m shading with by cranking the saturation down and the brightness up.Pro tip: point of no returnIf you go too far in any direction you will approach pure white, which will make the watercolor brush or marker opaque. Each color has a different “point of no return,” that can be found by experimenting with the sliders.Sometimes approaching the “point of no return” is a good thing — especially when you need a color for lightening. Instead of using pure white, I like to start with the base color I’m working with and crank the brightness way up to make less dramatic tints when erasing.Gestures to masterIf you only learn two gestures when using Paper, make them Rewind and Zoom.RewindI’m going to let you in on a little secret. The first couple of months I used Paper by 53, I hated the Rewind feature because I couldn’t use it consistently. It pissed me off so much, that I gave up and used the eraser instead. I would have killed for a software button that triggered an undo back then…I eventually came to my senses and gave it another go by forcing myself to use Rewind exclusively. After a few drawings I mastered it and was time traveling back through my boo boos with ease.It’s entirely possible that FiftyThree tweaked Rewind behind the scenes to make it easier to use, but I like to think it was my perseverance that made the difference.Stick with it if you’re having trouble, I promise it will eventually come naturally. And if it doesn’t, you can always purchase a Pogo Connect Smart Pen and map the button to undo. To correct simple one step mistakes the undo button works great, for anything else I prefer the rewind gesture to avoid pressing the button a million times.ZoomThe single most requested feature by fans and haters of Paper… Zoom. I’ve drawn a hundreds portraits fine without zoom, but boy was I happy when FiftyThree finally added the feature.That said I did cheat a bit by using an accessibility feature in iOS4 that lets you magnify the screen by tapping with 3 fingers. Not a true zoom, but it does have its place when you need to magnify an area — the tools don’t scale so it isn’t that useful if you’re trying to vary line widths.There isn’t much else to Zoom — I’m merely mentioning it to increase awareness around it. Unlike other drawing and painting apps with zoom, the entire canvas doesn’t scale. Instead you control the area you want magnified by you opening a circular portal loupe that can be moved around or dismissed by tapping outside of it.Full screen zoom and grid indicatorThe loupe shown above has been retired and replaced with a more traditional zoom tool in Paper v3. Pinching the screen now magnifies the entire canvas allowing for more room to work. As you magnify, a grid of dots appear on the screen to indicate how far you’ve zoomed in.Well there you have it. I hope this has served as a good introduction to Paper by 53, how to use the tools, the gestures, and a taste of what is possible with the app.Not transparent or translucent; impenetrable to light; not allowing light to pass through. ↩︎I define pure as matching the color selected in the mixer. Many of the tools have a hint of translucency to them and need 2–3 layers to match exactly. ↩︎I suppose I could break the creative flow and switch to a traditional capacitive stylus for lettering if I wanted to continue using the fountain pen. Nah… ↩︎The iPad has a system wide zoom feature that allows you to enlarge the screen by 3 finger tapping it. To activate, go to Settings > General. Tap on Accessibility and then turn on Zoom. ↩︎Made Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy.Tags: DrawingPaper appTutorialsPogo Connect iPad stylus reviewDrawing trees and grass with PaperMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.58 commentsJim · Jul 31, 2013This writeup is AMAZING, thank you for teaching me all the tricks of this amazing app!megan · Aug 2, 2013Great guide! :DAbdul Rahman · Aug 16, 2013is there any difference if one is drawing on retina or non retina display i mean do we have more details on retina ipad ?Michael Rose · Aug 16, 2013Detail is probably about the same while drawing, but on export a retina iPad gives you a file that is twice as large. Which is an advantage if you’re trying to make prints.Rozhana Art · Aug 18, 2013Great article! I’m new to paper so this was very helpful, Very clear and to the point. I love how you don’t completely praise the app but simply mention its good features while still giving its limitations. :)Abdul Rahman · Aug 20, 2013thanks :) it means i dont have to upgrade to ipad retina :)Mbova3 · Aug 31, 2013I love the watercolor brush but am also interested in using a bamboo tablet for drawing. Does anyone know of any mac software that is as nice as paper for watercolor?Michael Rose · Sep 1, 2013I wish I could get get the brushes in Photoshop to react like Paper’s watercolor. It’s the number one reason I keep going back to the app. It may not have all the bells and whistles as pro apps, but their watercolor is so damn nice.That said, have you tried Tayasui Sketches? They have a Universal iOS app as well as a macOS app that are very similar to Paper by FiftyThree.Gillybede · Sep 15, "
