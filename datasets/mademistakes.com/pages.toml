full_description = "Tiny paintings — 9 entriesMiniature watercolor portraits painted at really small sizes.Related topics: Portrait Watercolor Self portraitTrying to emulate the look and feel of watercolor on the iPad has inspired me to revisit painting traditionally. I’ve gone mini in an effort to fit some painting in amongst family and work obligations.My plan was to complete a miniature 1.5″ painting a day, but the challenge of painting so small is eating up way too much time. Instead I’m going to keep things casual and let images happen as they happen.In Your FaceTiny portrait of Adam Vitry, painted with watercolor on hot press paper.Charming to the lastTiny portrait of a Grand Moff Tarkin painted with watercolor on hot press paper.Close the Blast DoorsTiny portrait of a Star Wars Stormtrooper painted with watercolor on hot press paper.Cut My Face in HalfTiny portrait of Michael Rose painted with watercolor on hot press paper.Going somewhere, Solo?Tiny portrait of Greedo painted with watercolor on hot press paper.He Doesn’t Like YouTiny portrait of Ponda Baba painted with watercolor on hot press paper.Hey BlueTiny portrait of Myah Graham, painted with watercolor on hot press paper.Pig LizardTiny portrait of a Gamorrean Guard from Return of the Jedi, painted with watercolor on hot press paper.Sexy SaxophoneTiny portrait of a Bith painted with watercolor on hot press paper. Close the Blast DoorsTiny portrait of a Star Wars Stormtrooper painted with watercolor on hot press paper. Pig LizardTiny portrait of a Gamorrean Guard from Return of the Jedi, painted with watercolor on hot press paper."
