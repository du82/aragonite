["https://mademistakes.com/mastering-paper/drawing-trees"]
title = "Drawing trees and grass with Paper - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Drawing trees and grass with PaperJan 12, 2023 — by Michael Rose in Mastering PaperSorry for the delay in publishing the next installment of my Mastering Paper Guide — between the twins and my day job, I’ve had my hands full this summer. But enough of all the excuses, let’s get right into it OK?Drawing treesWhen I draw trees I select the watercolor brush and jump right in, using one continuous stroke to rough out a general shape. Don’t worry about being precise here, we’ll refine the edges later. You could start with a light pencil sketch to nail your the composition, but I usually don’t — it keeps the tree feeling organic and less rigid (a happy accident is your friend).Pro tip: build up tones by layeringWhen using the watercolor brush, try and mix a color around 50–75% lighter than the desired color. This lighter color allows you to layer multiple coats to create a nice vivid color. Going dark right away usually makes shapes flat and lifeless, with color that lacks richness.Building up a color with multiple layers usually yields better results than one dark glaze.Pro tip: painting with the brushRemember the watercolor brush is translucent and no matter what color you pick it won’t match without a few coats.Here are some of my favorite colors to get you started painting leaves:Once you’re happy with the general shape of the tree, it’s time to add some shadows. You can continue to use the same base color from before or darken it up depending on how much shadow you have to color. What I like to do is make short strokes to create a blotchy texture. For you traditional painters out there, it’s kind of like scumbling, only we’re not scraping paint around with a dry brush.The primary goal here is to give the illusion of leaf clusters and indicate where the branches and trunk flow. FiftyThree’s Pencil or a Pogo Connect Smart Pen can help immensely to paint branches of varying widths — an ability no other styli support when used with Paper by 53.A fast way to create leaves is to make short quick strokes with the watercolor brush.Now it’s time to start adding detail to the tree with highlights. Using a reference photo can help determine a good highlight color, but if you don’t have one check below for my favorite mixes. Stay away from colors that are too white — you want a color that is still in the family of your base color, just warmed and lightened.Pro tip: mixing leaf highlightsIf you’re having trouble mixing a highlight I like to start with a green from the leaf’s base, and add yellow. Yellow with orange mixed in also makes for a nice leaf highlight — note the example on the left.With our highlight color mixed, select the pencil tool and start lightly sketching small “scratchy” marks over the base coat. The more times you go over a pencil stroke, the more intense the color will get. Try not to overwork one area with the pencil, the key is to keep everything harmonious.Pro tip: pencil in highlightsApply highlight strokes on dark shadows to define individual leaves or groupings. A well placed pencil highlight can go a long way in adding texture and realism to your art.For a more textured look use the pencil tool instead of the fountain or ink pens.At this point your tree is pretty much done — it really depends on how much detail you think it needs. If this tree is the primary subject of your composition then you probably want to work it some more and sharpen the edges. If it’s just background filler I’d suggest keeping it soft and blurry so it doesn’t compete with whatever you’re placing in the foreground.For extra detail grab the base green from before, and mix in some brown and black, for a nice dark color. Armed with a pencil, use this color to add branches, and refine edges. If you overworked areas with highlights earlier, this darker color is perfect for adding shadows back in.This dark green can also be used to add texture to the leaves by making small scratchy strokes.To finish, quick strokes of watercolor with either a light gray or light dull green, can be used to add subtle gradations. Don’t go crazy here, a few small strokes on top of the pencil marks is enough to add depth.Pro tip: background cleanupFill the pencil with a color that matches the background and use it to refine the tree’s outline, cleaning up any watercolor that might have bled.This technique works great to “erase” any spots in the middle of the tree where the sky might be showing through leaves.Grass and foliageWhen drawing grass, bushes, and other greenery, the same tree techniques can be applied — with some slight variations.Instead of painting a base coat with watercolor, I like to use the marker or fountain pen. If done in one stroke (without lifting your pen or finger) you’ll get a single continuous color. Otherwise two coats will be required to make this shape smooth because of the translucent nature of these tools.This next step can be tedious, especially if you have a lot of grass to add. To draw each shard of grass, I use green mixed with yellow (pretty much the same highlight color used for trees), and draw small strokes with the pencil. The direction and length of these strokes are important to render realistic looking grass.Grass cut short is painless to draw. Making small subtle marks with the pencil to suggest grass is all that’s needed — texture is what’s important here.Pro tip: treat grass like hairWhen drawing longer grass, I like to think of it as hair and block out the major sections with stroke guides. These help determine what direction the rest of the grass should be moving when filling in each chunk.Pro tip: use stroke speed to your advantageTo feather out each shard of grass, move slow as you begin a stroke and faster as you finish. For those using a Pogo Connect Smart Pen, press hard at the start of your stroke and lighten up as you follow through.You can create different types of grass by varying their length and direction.Dark green pencil strokes from the grass’s base up to the middle can be used to add shadow to longer grass. For shorter strands, well placed marks below highlight strokes will add an amount of depth.One final tip for creating depth is to paint over everything with light gray or tan colors. Grass that is furthest back receives more coats of watercolor — while grass that is in the foreground gets less.Pro tip: cool and warm colorsA general rule of thumb is to mix blue/gray to your background colors, and warm them up as you move forward. A couple of well placed pencil strokes using this principle can enhance a composition’s depth quite effectively.Variations on a themeUsing these techniques on their own or in concert, I was able to create lush backgrounds for many of the portraits in my PaperFaces Project. Below are a few tree and grass examples to show what is possible by varying the color and composition.In the next article in this series I’ll take you through the techniques and steps I use to paint a blue skies, fluffy clouds, and sunsets. All three are the perfect compliments to a well drawn tree…Tags: DrawingPaper appTutorialsGetting started with PaperDrawing clouds and skies with PaperMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.7 commentsChris Harbinson · Aug 31, 2013Thank you for the wonderful guidance you are providing. I’ll be awaiting the next installment with the same eagerness I looked out for this one!Kim · Aug 31, 2013Excellent! Thank you for taking the time to put this guide together.Raadiya Lüssi-Begg · Sep 2, 2013Love love this! I bought the full 53 simply because I think its an amazeballs app and a great way for me to create my own graphics for my blog. Now i just need to learn how to draw! Excited about receiving your next tutorial!David W Slack · Sep 4, 2013Wow. Many thanks. This is brilliant. New to Paper but I love it already. My work is in oil or oil pastel, and Paper will give me a great way to get the best composition and keep me loosened up. The step by step is a great way to get stuck in with fab results straight away. Good teacher. Cheers.Baard Overgaard Hansen · Apr 28, 2014Thanks for some great tutorials. Looking forward to the next ones.Sel Orm · Jan 29, 2016On the 4th image on the grass tutorial, you have 2 zoom loupes on the screen. Was this ever possible in paper previously ? How did you do it?Michael Rose · Jan 29, 2016No that was never possible. Just a Photoshopped screenshot to show details.Show all 7 commentsRelated entriesDolphin whispererHalf peekabooSweater weather"
