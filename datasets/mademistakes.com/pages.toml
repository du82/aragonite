["https://mademistakes.com/mastering-jekyll/static-comments"]
title = "Adding comments to a Jekyll site with Staticman - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = '''Adding comments to a Jekyll site with StaticmanSep 8, 2021 — by Michael Rose in Mastering JekyllOffloading comments to an third party service like Disqus1 has always felt like a necessary evil to me when building static Jekyll sites.Convenient to embed a small bit of <script> voodoo from them into your pages — sure. But kiss goodbye to controlling the user experience, look and feel, site performance, data, and your privacy. Disqus alternatives haven’t been all that great for the statically-minded unless you were willing to make some compromises…In this tutorial follow my journey as I explore the possible ways of adding commenting to a Jekyll static site. Eventually working towards a setup that could statically generate comments from files not at all different from those already consumed by Jekyll for posts and pages.Self hosted comment systemsIsso describes itself as “commenting software similar to Disqus.” You host a SQLite database and embed some JavaScript on your pages (just like Disqus and friends) and you’re ready to roll. After freeing my content from Wordpress and “going static” I really didn’t want to manage a server and database again just to have comments on my site. So these solutions were out.Other self-hosted commenting systems include: Commento, Remark42, Discourse, talkatv, Juvia, HashOver, and Savas.GitHub based commentsIf you’re against using a 3rd party or spinning up your own server. The thought of leveraging GitHub’s API for commenting may appeal to you. utterances and giscus are two open source projects that rely on GitHub issues and discussions to store comments.Connect their respective app to your GitHub repository, configure how posts are mapped to issues/discussions, set a theme, add lightweight JavaScript to your site, and you’re done.Both are ideal solutions for sites with an audience that skews towards developers and may already have a GitHub account. I want something platform agnostic and didn’t require any sort of account to leave a comment… so the search continued.Static commentsWhat I really was searching for was a commenting system to compliment the rest of my statically generated Jekyll site.Over the years I’ve come across several solutions that seemed promising:Use mailto links (how very retro) to email comments to yourself to then manipulate and add directly to a post.Use PHP to do something similar.Jekyll plugins like Jekyll::StaticComments and Jekyll AWS Comments were pretty close to what I was looking for. A PHP <form> captures a comment, converts into YAML and emails it over to be placed in a prescribed location. Then with the help of a Liquid for loop, comments are displayed on the appropriate pages.I can’t really explain it, but something about using PHP in combination with Jekyll felt off to me. And so I didn’t pull the trigger on these solutions either.It wasn’t until I discovered Eduardo Bouças’s blog post “Rethinking the Comment System for My Jekyll Site” and the launch of Staticman 2.0 that I finally decided to remove Disqus from my site.And with that, started the process of migrating years of comment data and integrating them into the rest of my statically built site.Enter StaticmanOn paper and in practice Staticman was the app I was looking for to power static-based commenting on my site.Designed to work with Jekyll and GitHub Pages.Free and open source. Run it on your own server as a Node.js app or go the free hosted route with Heroku.Complete control over the data, content, user experience, and user interface.Not just for comments! Perfect for any sort of user generated content: reviews, comments, polls, and more.User submitted content can be merged in automatically or moderated.Getting startedMuch like building my first Jekyll site, I found the process of integrating Staticman into my workflow very rewarding. It was nice to get dirty again crafting form markup and styling comments to fit in with the rest of my site.Thankfully I didn’t have to start from scratch as I was able to draw inspiration from the Staticman demo site — Popcorn and Eduardo Bouças’s personal site. The documentation for Staticman does a good job of explaining how to set things up so definitely give that a read first to familiarize yourself with what the app can do.Building the formI set my gaze on marking up the “Leave a comment” submission form first. Seemed like an easy target as the styling of various form elements like <input>, <label>, <textarea> and buttons were already done as part of my living style guide.To complete it, was to make a decision on what fields I wanted to capture, and write a little bit of JavaScript for form handling and submission. Arriving at this for my post__comments.html include (class names and Liquid removed for brevity).<form id="comment-form" method="post" action="{{ site.staticman.endpoint }}{{ site.repository }}/{{ site.staticman.branch }}"> <fieldset> <label for="comment-form-message">Comment</label> <textarea type="text" rows="3" id="comment-form-message" name="fields[message]"></textarea> </fieldset> <fieldset> <label for="comment-form-name">Name</label> <input type="text" id="comment-form-name" name="fields[name]"/> </fieldset> <fieldset> <label for="comment-form-email">Email address</label> <input type="email" id="comment-form-email" name="fields[email]"/> </fieldset> <fieldset> <label for="comment-form-url">Website</label> <input type="url" id="comment-form-url" name="fields[url]"/> </fieldset> <fieldset class="hidden" style="display: none;"> <!-- used by Staticman to generate filenames for each comment --> <input type="hidden" name="options[slug]" value="{{ page.slug }}"> <!-- honey pot used to filter out spam --> <label for="comment-form-location">Not used. Leave blank if you are a human.</label> <input type="text" id="comment-form-location" name="fields[hidden]" autocomplete="off"/> </fieldset> <fieldset> <button type="submit" id="comment-form-submit">Submit Comment</button> </fieldset> </form> <!-- End new comment form --> Staticman’s documentation covers this in more detail, but essentially I’m adding fields[] values to the name attributes. message, name, email, and url fields are then used to generate a .yml file similar to this:message: "![Bill Murray](http://www.fillmurray.com/400/300)\r\n\r\n“It's hard to be an artist. It's hard to be anything. It's hard to be.”" name: Bill Murray email: b0caa2a71f5066b3d90711c224578c21 website: '' hidden: '' date: '2016-08-11T19:33:25.928Z' Some notes on the hidden and date fields you may have noticed in the sample comment above:Hidden: is used as a spam deterrent in the form of a honeypot. The thought is a human wouldn’t fill out an input they can’t see, but a spam bot may. Adding fields[hidden] to this input and not placing it in the allowedFields array in our Jekyll config, instructs Staticman to reject the entry. Hopefully filtering out bots who are dumb enough to populate it with something.Date: is captured when the entry is generated by Staticman. Its format can be changed from iso8601 (default) to timestamp-seconds or timestamp-milliseconds.Interactions and stateUsing Popcorn’s main.js as a guide I added all the AJAX goodness, alert messaging, along with disabled and loading form states.To avoid disrupting the flow too much I went with inline alert messaging directly above the submit button.And to improve the user experience upon submission the submit button’s text changes to Loading..., becomes disabled, and an animated SVG icon inserted for bit of extra flare.$(form).addClass('disabled'); $('#comment-form-submit').html('<svg class="icon spin"><use xlink:href="#icon-loading"></use></svg> Loading...'); Sorry, your browser doesn't support embedded videos, but don't worry, you can download it and watch it with your favorite video player!Submit button loading animation.If the form is successfully submitted a message appears notifying the user that the comment has been received and is pending moderation. Since my site takes a bit to generate with Jekyll I felt it necessary to convey this to the user, hopefully avoiding duplicate submissions.With smaller sites hosted with GitHub Pages this becomes less of a problem — as they build much faster. Especially true if you decide to go with the auto merge option and skip moderating comments. Sorry, your browser doesn't support embedded videos, but don't worry, you can download it and watch it with your favorite video player!Form submit success animation.Displaying commentsThere’s a bunch of Staticman settings available to you, but forget all that for right now. The important bit to remember is: static comment files will live in _data/comments/<post slug>/. By predictably placing them here we will be able to access their contents from the following array: site.data.comments[page.slug].With this array we’ll be looping through it with for just like you would with site.posts to spit out a list of all posts. But first we’ll use an assign tag to rename the array and apply a sort2 filter on the objects. This will order them by filename, which in our case should be chronological3.{% assign comments = site.data.comments[page.slug] | sort %} {% for comment in comments %} show a comment {% endfor %} Since I’m capturing message, name, email, and url in the comment form these will be the same fields I’ll want to pull from to build each comment. Using an assign tag again we’ll cleanup variable names like comment[1].avatar into just avatar. Which will then be used to pass parameters into the comment.html include:{% assign comments = site.data.comments[page.slug] | sort %} {% for comment in comments %} {% assign avatar = comment[1].avatar %} {% assign email = comment[1].email %} {% assign name = comment[1].name %} {% assign url = comment[1].url %} {% assign date = comment[1].date %} {% assign message = comment[1].message %} {% include comment.html index=forloop.index avatar=avatar email=email name=name url=url date=date message=message %} {% endfor %} If done correctly the values and strings in a data file like _data/comments/basics/comment-2014-02-10-040840.yml--- id: comment-1237690364 date: '2014-02-10 04:08:40 +0000' updated: '2014-02-10 04:08:40 +0000' post_id: "/basics" name: Tamara website: '' message: "This? This is freakin' awesome! Thanks so much for sharing your mad skills and expertise with us!" Should pass through _includes/comment.html and spit out as the following HTML:<article id="comment1" class="js-comment comment" itemprop="comment" itemscope itemtype="http://schema.org/Comment"> <div class="comment__avatar-wrapper"> <img class="comment__avatar" src="https://www.gravatar.com/avatar/?d=mm&amp;s=50" srcset="https://www.gravatar.com/avatar/?d=mm&amp;s=100 2x" alt="Tamara" height="50" width="50"> </div> <div class="comment__content-wrapper"> <h3 class="comment__author" itemprop="author" itemscope itemtype="http://schema.org/Person"> <span itemprop="name">Tamara</span> </h3> <div class="comment__date"> <a href="#comment1" itemprop="url"> <time datetime="2014-02-09T23:08:40-05:00" itemprop="datePublished">February 09, 2014 at 11:08 PM</time> </a> </div> <div itemprop="text"><p>This? This is freakin’ awesome! Thanks so much for sharing your mad skills and expertise with us!</p></div> </div> </article> Looking like this when styled with CSS:There’s not much magic in the comment.html include — some structured data markup sprinkled about and a few Liquid conditionals for displaying author avatars and URLs.Pro tip: encode email addresses as MD5 hashesStaticman supports transforming a string into a MD5 hash. By doing this you avoid compromising a commenter’s email address in what could potentially be accessible from a public GitHub repo. These hashed emails also have the benefit of being used with Gravatar to pull in avatar images.Setting up StaticmanWith the front-end portion of my static-based comment system squared away, it was time to configure Staticman. Because I went with the hosted version, it only took a few quick steps to setup.Adding Staticman as a collaboratorFirst you need to grant Staticman access to your Jekyll repository on GitHub. You don’t have to actually host the site there (I use Netlify for that), but it does need to be a standard Jekyll site with valid _config.yml.⚠ Staticman and GitHub API limitsThe following steps are for installing the public instance of Staticman. As of September 2018, Staticman is reaching GitHub API limits due to its popularity, and it is that users deploy their own instances for production instead of using the public endpoint of https://api.staticman.net/v1/entry/.Consult the “Get Started” guide for more info on hosting your own Staticman instance for free.Following the docs I added GitHub username staticmanapp as a collaborator and then pinged https://api.staticman.net/v1/connect/{your GitHub username}/{your repository name} as instructed to accept the invitation.Configuring StaticmanStaticman is configured by settings defined in your Jekyll _config.yml under a staticman object. There’s a whole list of stuff you can configure — the important stuff being allowedFields, branch, format, moderation, and path.Branch settingThis is the branch comment files will be sent to via pull requests. If you host your site on GitHub Pages it will likely be master or gh-pages. If you’re unsure check the Configuring a Publishing Source documentation to refresh your memory.There’s also an undocumented generatedFields4 setting that is useful for time stamping each file Staticman creates.I ended up with the following settings in my _config.yml:staticman: allowedFields : ['name', 'email', 'url', 'message'] branch : "master" commitMessage : "New comment." filename : comment-{@timestamp} format : "yml" moderation : true path : "_data/comments/{options.slug}" requiredFields : ['name', 'email', 'message'] transforms: email : "md5" generatedFields: date: type : "date" options: format : "iso8601" In case any spam makes it through, you may like another layer of “protection” to block it. Setting moderation: true will make Staticman send a pull request whenever a new comment entry is submitted. At this point you can examine the content inside of the PR and decide if you want to merge or close it.When hosting with Netlify, GitHub Pages, and the like — a merge will instantly force Jekyll to rebuild the site and deploy. Since I self host I have the extra step of pulling from remote, before building locally and deploying via rsync.Pro tip: webhooks for branch auto deletionAvoid manually cleaning up Staticman generated branches. Create a GitHub webhook instead that sends a POST request to the following payload URL https://api.staticman.net/v1/webhook and triggers a pull_request event automatically to delete Staticman branches on merge or close.Hooking up the formFor your forms to work with Staticman they need to POST to:{Staticman endpoint}{your GitHub repository}/{your repository name}/{the name of the branch} Instead of hard-coding these values, use site va'''
