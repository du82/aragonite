["https://mademistakes.com/mastering-paper/contour-drawing"]
title = "Contour line drawing on iPad - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Contour line drawing on iPadJun 24, 2021 — by Michael Rose in Mastering PaperOne of the first things I drew on my iPad with Paper by FiftyThree was a blind contour line drawing. It has always been an interest of mine and Paper’s expressive ink tools are a great fit for the technique.Drawing contour linesWorking in a loose and gestural manner is an excellent way to warm-up and sharpen your observation skills. I like to draw with the fountain pen (draw) because it has a greater range than some of the other tools, but feel free to use the ink pen (write) or even the pencil. I think you’ll find this exercise to be very cathartic, especially when compared against the technical and time consuming nature of photo realistic drawing.The ideal way to practice this technique is by drawing a real object (hands are good to start with) — avoiding photographs if you can. To begin, fix your eyes on the subject in front of you. As your eyes track across the subject’s shape, draw a slow continuous line in sync with what you are viewing.Getting sensitivePay close attention to how the form’s contour and shape relate to each other making sure to keep your stylus or finger firmly placed on the iPad’s screen at all times. The line should remain solid and confident, this isn’t an exercise in sketching or shading.When you observe a shadow or a dark division, move your stylus faster to produce a thicker line. For highlights and lighter areas move slowly to draw a thinner line.I find drawing with a Pogo Connect allows for greater control over the line’s weight.Producing sensitive lines becomes infinitely easier with a Pogo Connect since you can varying their thickness by pressing harder. This added complexity isn’t for everyone, but for someone with a background in the fine arts or illustration, it can feel more natural.Play YouTube videoI also find that it helps to think of this line as a piece of string — pretending that I’m wrapping it around the object as I follow along with my stylus. Don’t worry if your drawing ends up looking like a ball of yarn — that’s part of the charm. As the link between hand and eye builds, so will the accuracy of your lines.Variations and enhancementsThere’s a world of possibilities to explore with this technique. For example, you can stick with black ink on white paper and add splashes of color with the brush tool, emulate a scratch board drawing, or layer multiple lines on top of each other.A splash of colorWhen applying color to a contour line drawing start by looking for the shadows in your subject and brush those in first. If you work from the outside edge in, it is easier to fade your strokes using a sweeping motion. When done right this feathering of color can mimic the wet on wet look of traditional watercolors.If you’re feeling overwhelmed by color, try working with just black and white. Limiting the selection simplifies the process and causes you to focus more on contour and line quality before tackling advanced color theory principles. I experienced the most learning by being limited to the 9 colors Paper originally shipped with. This led to many hours of mistakes and experimentation, ending with a higher understanding of how the tools and colors behaved.Paper paint brush techniquesFor a refresher on watercolor brush techniques take a look at my set of Mastering Paper Guides. If you can get the hang of making smooth continuous tones with the brush, there isn’t much else you can’t do with the app.White on blackAnother variation to try is drawing in white ink over a black background. To start you would select black from the palette and then drag it onto the canvas to fill it in. This color inversion gives the lines new qualities that closely resemble scratch board drawings.Adding linesThere is no hard fast rule that says the drawing has to be made up of a single line. Breaking it up into multiple lines, made up of different colors and values can produce nice results. Just be mindful of the lines’ starts and stops when switching tools or colors, you don’t want to kill the free form nature of the drawing.If you end up trying out this technique I’d love to see what you’ve created. Leave a link or attach an image of your work below in the comments.Tags: DrawingPaper appPogo ConnectTutorialsPogo Connect stylus sensitivity fixDrawing and painting basicsMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.11 commentsGuest · Jan 21, 2014When you do these, do you draw the whole thing in a single line, or do you look from time to time and reposition? My “understanding” is that one is to draw the whole thing without looking? Thanks! Good stuff as always.Michael Rose · Jan 21, 2014Guess it depends on what you want to get out of the exercise. If you want to develop your hand eye coordination than doing them blind, never looking down, and completing the drawing in one line is the preferred method.I like the look of contour line drawings so I often use it as a stylist approach and less of an drawing exercise. When I do that I will look down to check results or make course corrections to fit the piece.Guest · Jan 21, 2014thank you kindly. about what i suspected but i like to know what real people do. :)Michael Rose · Jan 21, 2014I’m probably the worst person to compare against. I tend to do things in ways they weren’t intended or completely backwards. Hah.Guest · Jan 21, 2014well as someone with few if any clues, i can say that your tutorials and examples and answers help me improve.Eric · Mar 11, 2014My take on this (and I’m a Noob) is to have fun with the drawing. Choose a method you like or come up with your own. I find this fun to do during meetings as I draw faces of coworkers while not included in conversations. :)mismo · Mar 25, 2014How do you drag the solid black color into the canvas for a solid black background?Michael Rose · Mar 25, 2014You do it exactly how you described it. Drag the color onto the background and release. One thing to note is it’s not a fill. If you have something on the canvas already it will cover it all up with whatever color you drag over.The following page explains how to fill the page with color if you need more detail.Carole Ann Faust · Apr 16, 2014Hoping for an honest critique.Michael Rose · Apr 16, 2014Very nice! I love the traditional watercolor feel of both.Carole Ann Faust · Apr 16, 2014Thank you! That means a lot coming from you! I go to your site every so often to see what I am forgetting to do. Love your work!Show all 11 commentsRelated entriesTiger StyleThe Killing JokeHooded Girl that Hides"
