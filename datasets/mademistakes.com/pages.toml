full_description = "Mastering Jekyll — 8 entriesCollection of tutorials to help you master Jekyll, a static site generator built in Ruby.As developer of some popular themes, I’ve become well versed in using Jekyll. Below you’ll find answers to common issues, posts explaining features, tips, tricks, Liquid snippets, and more.Related topics: Tutorials Web development Static sites Open sourceURLs and links in JekyllJul 20, 2021 ~ Read in 18 minsHow Jekyll uses URLs and how to link posts, pages, assets, and other resources together.Jekyll’s site.url and baseurlJul 11, 2021 ~ Read in 6 minsLearn what Jekyll’s site url and baseurl variables are and how to properly set them with relative_url and absolute_url filters to avoid broken links and 404 errors.Styling language specific code blocks with JekyllMay 16, 2017 ~ Read in 2 minsInteresting styling possibilities with Kramdown syntax highlighted code blocks in Jekyll.Accessing static files in JekyllJan 30, 2017 ~ Read in 4 minsLearn how to use static files with Jekyll to create a gallery of images automatically without a plugin.Improving Staticman comments on a Jekyll siteDec 8, 2016 ~ Read in 13 minsHow to use Staticman to add threaded comments and reply notifications to a static-based Jekyll site.HTML inside Kramdown table cells with JekyllNov 8, 2016 ~ Read in 2 minsThe question of how to write a list inside of a table cell with Kramdown recently came up in a thread on Jekyll Talk — prompting me to look for a solution.Adding comments to a Jekyll site with StaticmanAug 21, 2016 ~ Read in 16 minsUninstall Disqus and learn how to add a static-based commenting system to Jekyll with Staticman.Building a living style guide with JekyllFeb 10, 2015 ~ Read in 9 minsHow I used Jekyll to build a living style guide and pattern library for Made Mistakes. URLs and links in JekyllJul 20, 2021 ~ Read in 18 minsHow Jekyll uses URLs and how to link posts, pages, assets, and other resources together. Jekyll’s site.url and baseurlJul 11, 2021 ~ Read in 6 minsLearn what Jekyll’s site url and baseurl variables are and how to properly set them with relative_url and absolute_url filters to avoid broken links and 404 errors."
