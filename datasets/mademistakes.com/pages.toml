full_description = "Jekyll themes — 5 entriesOpen source Jekyll themes to get you started building a site or blog on GitHub Pages, Netlify, and other hosts.Related topics: Web development Static sites Design Open sourceBelow are the Jekyll themes and starters I’ve designed, developed, and released as open source. Each theme contains the _layouts, _includes, Sass/CSS, JavaScript, and other sample files needed to build with Jekyll and host a static site or blog.Getting started with each is roughly the same:Install as a Ruby gem, remote theme, or fork the theme repository you’d like to use or modify.Install Bundler gem install bundler and run bundle install to install all dependencies (Jekyll, plugins, and so on).Update Jekyll’s _config.yml file, customize data files (found in the _data directory), and replace sample posts and pages with your own content.For more specifics, consult each theme’s documentation by visiting the setup guide links below.Basically Basic Jekyll themeYour new Jekyll default theme.Minimal MistakesA flexible two-column Jekyll theme for building a personal site, blog, project documentation, or portfolio.Skinny BonesA lightweight website starter for Jekyll.HPSTRJekyll blog theme designed to give your site a tumble-log look.So SimpleA simple Jekyll theme for words and pictures. Minimal MistakesA flexible two-column Jekyll theme for building a personal site, blog, project documentation, or portfolio."
