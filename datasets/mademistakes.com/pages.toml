["https://mademistakes.com/work/jekyll-themes/skinny-bones"]
title = "Skinny Bones Jekyll starter and theme - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Skinny Bones Jekyll starter and themeSep 5, 2021 — by Michael Rose in Jekyll themesWhat originally started as a site refresh quickly turned into something else when Jekyll baked in native support for Sass with a 2.0 release.This was a good excuse to learn Sass and figured starting a new repository to experiment with would be better than breaking my existing site and Jekyll themes. I ended up with what I’m calling Skinny Bones by completely rewriting all of Made Mistakes’s stylesheets, _layouts, and _includes to be more modular.I like to think of Skinny Bones as a starter for building your own Jekyll powered site — versus a theme you use as is. I’ve purposely kept the styling minimal and light to make adding your own flare and markup easier. If that’s not your thing you can still use it without modification, but where is the fun in that?Setup guide Live previewNotable featuresGitHub Pages compatible.Stylesheets built using Sass to help theme your site with ease. Requires Jekyll 2.xData files for easier customization of the site navigation/footer and for supporting multiple authors.Optional Disqus comments, table of contents, social sharing links, and Google AdSense ads.And more.ContributingSkinny Bones was built predominately as a framework for myself. My intention was never to make it all things for all people. So please keep that in mind before submitting new features or enhancements. If you’ve used any of my Jekyll themes I think it’s pretty clear what I like and what I try to avoid. When in doubt ask before wasting your time on a feature that might not get merged in.LicenseThis theme is free and open source software, distributed under the MIT License. So feel free to use this Jekyll theme on your site without linking back to me or including a disclaimer.Tags: DesignOpen sourceStatic sitesWeb developmentHPSTRMinimal MistakesMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.Related entriesBasically Basic Jekyll themeMinimal MistakesHPSTR"
