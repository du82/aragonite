["https://mademistakes.com/mastering-paper/drawing-hair"]
title = "Drawing hair with Paper - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Drawing hair with PaperJun 24, 2021 — by Michael Rose in Mastering PaperBlock out the hairI like to rough out a general shape of the subject’s hair using watercolor loaded with black or dark brown. Depending on what the overall palette is I might adjust the brown — usually mixing in red to warm it up or blue to cool it down.When working with the watercolor brush remember to layer numerous strokes to get a rich dark base. Just painting one coat of black won’t give great results needed for the next step.Draw each strandThe key here is observation — look at how each strand(or section) of hair moves, where they start, and where they end. Using the pencil draw each strand of hair from root to tip, following the same paths you observed. For these initial strokes use mid tones to shape the major hair sections and parts. Then gradually brighten the color as you draw in hair with highlights. Adding small strokes of white and light yellow can really bring life to the hair, just be careful not to over do it.For those new to the app I suggest drawing in grays — limiting your palette to get a feel for the tools and how they behave. Working with a limitless selection of color could complicate and distract you from learning the tools. Thankfully FiftyThree’s excellent color mixer just works when you’re ready to exploit it.The browns in this default palette are good to start with before mixing your own.On the subject of palettes… I stick with the default sets. Since I draw a ton of portraits, it’s much quicker for me to adjust a color on the fly. But I do see the benefit of setting up a predetermined palette beforehand to give your illustration a feeling of cohesion. Before the color mixer existed you had to get inventive if you wanted additional colors. A limitation that encouraged experimentation and sometimes unexpected results.The following are some of my favorite color presets for drawing hair:Dark strokes add definitionWorking an area too much with the pencil can cause your hair to flatten out. To fix this, draw dark pencil strokes over the problematic areas. If you follow the hair paths, drawing root to tip again — these dark strokes can help add detail back to the hair. Make your strokes quick and try not to go over the same line twice or else it might darken too much.Watercolor for dimensionIf you’re a maniac with the pencil and prefer to draw in all the gradations then feel free to omit this step. I’m much too lazy for that and prefer to paint over the strokes to achieve the same effect. A warm light gray works great for brunettes and a light orange or pink for redheads. Experimentation is the key here. If you don’t like the result just two finger rewind that noise and try another color. Lighter layers of watercolor that are built up gradually allow for subtler tones than a stroke of black would.Mastering Paper tutorialsSince publishing this short guide I’ve gone through several iPad styli and written numerous tutorials expanding on the techniques described above. | Be sure to check out my Mastering Paper by FiftyThree series to learn the latest ways I’m using the app and tools to create realistic portraits and other pieces of art.Tags: DrawingPaper appTutorialsQuick tips for iPad sketchingDrawing faceless portraits with PaperMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.4 commentsLMM · Feb 20, 2014Outstanding! Thank you so much :)Robert Hamm · Jun 15, 2014Really great info. This is the kind of tutorials I would have expected on 53’s site. I’m so used to drawing with layers, that I’ve almost forgotten how to draw without them. Thanks for your info.Neehal Shaikh · Oct 8, 2017I have been following your page for quite a while now. I should say, you’ve helped me lot. :) I have made some paintings too. You got a great page, please keep sharing the knowledge.Related entriesDolphin whispererHalf peekabooSweater weather"
