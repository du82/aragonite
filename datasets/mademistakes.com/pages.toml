full_description = "What do you use?Read on friend to learn about the hardware and software I use for play and to build Made Mistakes. None of it is terribly exciting or unexpected, but hey — maybe the curious of you will find it interesting.Hardware🖥️ iMac 24-inch, 2021 M1 model in blue with 8GB of memory, and stock Apple Magic Mouse and keyboard.iPad 12.9″ Pro (5th generation) with Magic Keyboard (black) and Apple Pencil (2nd generation).📱 iPhone 13 Pro with Graphite finish.⌚️ Apple Watch Series 5 with Space Gray aluminum case.AirPods Pro (1st generation).AirPods (2nd generation).📷 Canon Rebel XTi DSLR Camera with EF-S 18-55mm and 50mm lenses.Design and developmentOperating systems: macOS and Windows 10Visual Studio Code with the following notable extensions:GrammarlyWrite Good LinterInsert Date StringLorem ipsumCode Spell CheckerCSS Var CompleteHugo - Go based static site generator.Pattern Lab - Atomic design system generator.Jekyll - Ruby based static site generator.Sourcetree for Git heavy lifting when VS Code doesn’t cut it.Adobe Creative Cloud - Photoshop and Illustrator.I’ve been on a static site generator kick ever since discovering Jekyll. I use Hugo and a custom theme to build this page and the rest of the site. The general idea is I write content in Markdown and Hugo spits out a set of files that are then deployed to a web server for the world to see.This is where I’d link out to my public GitHub repository for this site. But due to a bunch of lazy developers ripping me off and changing the bylines and such I’ve made it private for the time being.Site detailsHugo build and deployment via Cloudflare Pages.Domain name registered with Hover.Interested in my previous site designs? Check out the old Made Mistakes Jekyll repository or my Jekyll themes instead, which are all open source and free for you to use and abuse.Other softwareBackblaze - cloud backups.Made Mistakes is a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means to earn fees when linking to Amazon.com and affiliated sites. For full details read the complete disclosure policy."
