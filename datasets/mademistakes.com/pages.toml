title = "Configuring publishing sources for GitHub Pages - Made Mistakes"
description = "You know what sucks? Maintaining two separate branches of an open source project, just to host its source code and documentation together with GitHub Pages."
full_description = "Configuring publishing sources for GitHub PagesFeb 15, 2019 — by Michael Rose in NotesYou know what sucks? Maintaining two separate branches of an open source project, just to host its source code and documentation together with GitHub Pages.For example, my Jekyll theme’s are setup on GitHub with the following branches:master holds the theme files for cloning and installinggh-pages is a dupe of master with example posts and theme documentationAnytime I push updates to master I switch to the gh-pages branch, cherry pick commits, and deal with any conflicts. Wouldn’t it be nice if there was a better way to keep everything together in a single branch?Well there is. Under Settings there is a drop-down menu under GitHub Pages/Source that allows you to choose where to build from1.Flip the source to master branch /docs folder, move contents of gh-pages into /docs on master, and boom!Source code and documentation in a single branch. No more switching branches and “cherry picking” for me.You can configure GitHub Pages to publish your site’s source files from master, gh-pages, or a /docs folder on your master branch for Project Pages and other Pages sites that meet certain criteria. ↩︎Tags: Static sitesTILWeb developmentOil pastels are not pencilsAutumn refreshMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.2 commentsstefano · Jun 11, 2017i guess that’s why GitHub has made the gh-pages option difficult to find, lately/docs is the best indeed :)Sean · Apr 12, 2019I don’t have the drop down under GitHub Pages/Source!Related entriesMinimal MistakesBasically Basic Jekyll themeSkinny Bones stefano · Jun 11, 2017i guess that’s why GitHub has made the gh-pages option difficult to find, lately/docs is the best indeed :)"
