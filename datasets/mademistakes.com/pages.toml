title = "Pencil by FiftyThree stylus review - Made Mistakes"
description = "Just another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home."
full_description = "Pencil by FiftyThree stylus reviewJun 24, 2021 — by Michael Rose in Mastering PaperFor the last year I’ve been using FiftyThree’s first hardware product, Pencil. A Bluetooth stylus that was designed to work seamlessly with Paper for iPad by delivering an experience that feels closer to “the real thing” than any other styli.Look and feelThe Walnut and Graphite finishes both look beautiful. If pressed to pick a favorite, I would probably choose Graphite, just because it feels heavier and more solid to me. But there is something nostalgic and comforting about Walnut’s wooden texture that makes it a close second.If you haven’t noticed, Pencil is flat like a carpenter pencil, which keeps it from rolling about and getting lost1. Because of the wide and flat shape, I did find it uncomfortable to hold at first. Although after a few drawing sessions it wasn’t a concern as my hand adapted to the contour of Pencil.Between the two finishes, Walnut is lighter and softer to the touch with a wood texture allowing for more grip. Because of Graphite’s slick finish I occasionally had to readjust how I held it. When trying to fill in large continuous tones of watercolor I noticed it slipping the most. Slightly annoying sure, but not a deal breaker by any means.Similar to Paper, Pencil shares the same minimally designed aesthetic — that means no buttons, no battery indicator lights2, and no on/off switches.I love how the UI in Paper doesn’t get in your way, and it’s refreshing that Pencil’s design echoes this theme. Common tasks like erasing or blending become more natural, without the need to open the tool tray or press buttons.Want to erase something? Flip Pencil upside down and erase a mistake like you would “in real life.” Need to soften pencil strokes? Use your finger to smudge the pixels.So I lied. There is one LED light hidden inside, only visible when charging Pencil via USB.Just the tipTo be honest I was a little disappointed when I discovered Pencil’s tip wouldn’t be pressure sensitive like the one in a Pogo Connect. It took some time but with the recent addition of Surface Pressure to Pencil + Paper, my desire to use a Pogo Connect has vanished.The tip is responsive and as accurate as one can expect from the limitations the iPad’s digitizer imposes on stylus makers. Wedge shaped, offering a slightly finer point than the rubber nibs found on AluPens, Bamboos, and their capacitive tipped peers.Pencil’s tip does a great job of repelling any finger grease that may accumulate on the iPad’s screen — unlike some cheap styli that simply push it around obscuring your drawing.When Pencil by FiftyThree originally launched drawing with the broadside of the tip had zero affect on the marks you made. That all changed in iOS 8 and Paper 2.0.Is the tip durable?Pencil’s tip is by no means the most durable I’ve used. The longevity of the rubber that encases the 14kt gold plated tip is affected by the amount of pressure you apply and how held.Press hard as you draw or use the tip’s point more and you’re going to wear it out faster. I’ve had tips begin to show signs of tearing in under 5 hours and others last much longer.These numbers are relative to the user, which makes locking in a specific number hard. Using the longer side of the tip without a doubt prolongs its age. I suggest to use that whenever filling in larger areas of colorEven if you do manage to tear through the rubber, the tips are still usable, albeit with some black streaking3 across the screen.Replacement tipsThe good news is FiftyThree now offers replacement tips and erasers in their shop. For $7.95 USD (+ shipping) you get two tips and an eraser for Pencil, which isn’t too bad if you do a lot of drawing like me.Will it blend?For me Blend is the most exciting thing about Pencil. Sure a ton of other art apps have smudging and blending tools, but they all break the creative flow in their implementations.FiftyThree has made this valuable tool fun and more true to real drawing by allowing you to switch between smudging and drawing in a fluid and natural way.If you take the time to experiment with Blend I think you’ll find it fairly sophisticated. Moving your finger slowly allows the pixels beneath to be pulled and pushed around like finger-paints. Moving your finger fast over an area slightly blurs which I’ve found useful in creating depth of field effects and simulating a bokeh.Constant pressure is the keyIf you’re soft with the amount of pressure you apply to the tip while drawing, Blend may trigger inadvertently. The software is pretty good at figuring out when you want to Blend and corrects itself before blurring something.But if you’re trying to draw lightly to preserve your Pencil tips then you and Mr. Rewind are going to become close friends because of this.Pencil tip springI’m curious to learn about the experiences of others using Pencil and Blend. As I’ve broken the tips in, there’s loss of springiness when pressing down, which appears to decrease Pencil’s sensitivity — causing smudges mid-stroke.Not sure if this is a common occurrence or a symptom of me pressing too hard on the tip. Let me know your observations below in the comments section.What about the eraser?I’m not one for erasing all that much and instead rely heavily on the Rewind gesture to undo mistakes. But for those of you who use the eraser tool often, you’re going to love Pencil.Instead of opening the tool tray, selecting the eraser, removing your mistake, and going back to a drawing tool — you now can flip Pencil on its head and erase instantly.In combination with Surface Pressure you can get into tight spots with ease — something that is impossible to do without Pencil.Comparison of erasing positions with Pencil.Erasing and undoing techniquesIf you’re looking for more erasing techniques you’re in luck. I wrote an entire guide dedicated to correcting and covering-up mistakes.Palm resters of the world rejoiceBack in art school I trained my wrists to avoid resting on the canvas so I wouldn’t smudge my work as I drew. For those new to using an iPad stylus — resting your palms on the screen usually feels more natural.The problem is, most apps don’t do a good job of discerning between those resting touches and the ones being made with your stylus or finger. I’m happy to say FiftyThree delivers on the following promise:Rest your hand on the screen, write from any angle. No calibration or setup.In my tests I had no issues drawing with palms resting on the iPad’s screen. All gestures worked fine without causing stray marks: opening the zoom loupe, rewinding mistakes, flipping through pages, and closing the tool tray.App compatibilityFiftyThree has made available a SDK for Pencil that other apps4 can take advantage of. The first app to use the SDK was Procreate, which happens to be my second in command behind Paper. The current version of Procreate supports the same features as Paper except Surface Pressure.Palm rejection works to eliminate stray marks, but I did notice that it will sometimes rotate the canvas by mistake. Both smudging and erasing worked flawlessly for me.Final thoughts on PencilI’m interested to see where FiftyThree continues to take Pencil as it and Paper evolve. I’d like to see Blend get some love and offer even more variation in the way that it smudges. So many possibilities…If you’re a casual doodler looking for a well built stylus that mimics traditional drawing utensils and have a need for palm rejection, then Pencil should be your number one choice. On the other hand if you’re a pro-user who relies on pressure sensitivity to work in other iOS apps, you may be left wanting more.Additional resourcesMastering Pencil by FiftyThree GuideMy iPad stylus recommendationsQuestionsWant to know more about Pencil or the new features it enables — ask away in the comments below and I’ll do my best to answer.Play YouTube videoThe Walnut model has a built in clip that allows it to stick to an iPad Smart Cover magnetically — magnets, how do they work? Cool party trick but not something I don’t use all that often. ↩︎A LED light does exist, but it is not visible during normal use. When the battery is plugged into a USB port an amber light can be observed as it charges. If you do need to check how much charge is left on your Pencil you can find them under Settings > Pencil in the Paper app along with a Serial Number and Firmware Version. ↩︎Black rubber streaking from the tip taring can be cleaned off the iPad’s screen by wiping with a microfiber cloth. ↩︎The following iOS apps are compatible with Pencil’s unique set of features: Procreate, Noteshelf, and Squiggle (coming soon). ↩︎Tags: DrawingPaper appPencil by 53ReviewsTech geekMastering Mix by FiftyThreeHow to use Paper’s color pickerMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.78 commentsmarkwhite007 · Dec 12, 2013All we need now is the ability to buy extra tips.Michael Rose · Dec 12, 2013Agreed!Jay Versluis · Dec 14, 2013It’s a nice enough stylus alright, but for $60 you might as well buy a Pogo Connect and use it with many other apps. Who wants a stylus that works with only a single app, with severe limitations, that prides itself on not having a proper backup option?Nice try, FiftyThree… but get with the picture!Guest · Dec 14, 2013Do you have a screen protector on your iPad? FiftyThree said having one would severely affect the tip. Which might explain why yours wore down so quickly.Michael Rose · Dec 14, 2013No screen protector for me so that’s not it. How quickly it wears is based on the amount of pressure you apply. Because there’s a hard tip behind the rubber covering it eventually tares through it. Other styli that are just a rubber nib don’t have that problem.Michael Rose · Dec 14, 2013Well Pencil does work with other apps, as a normal “dumb” capacitive stylus ;-)Maybe they’ll work on a SDK for Pencil and allow app makers to support it like TenOne Design does with the Pogo Connect.Bill Morein (FiftyThree) · Dec 18, 2013We are planning to release an SDK - details to come soon.Bill Morein (FiftyThree) · Dec 18, 2013That is coming soon. If you need some urgently email [email protected].Knight2472000 · Dec 20, 2013How responsive is it? Using my finger on an iPad Air there is a small delay. Does it pass for a real pencil speed?Michael Rose · Dec 20, 2013For what it’s worth I’ve never noticed any serious lag drawing with my finger, normal styli, Bluetooth styli, or Pencil with Paper. At least not enough to effect how I use the app.I know Apple made changes to their screen tech and that screwed with how some styli function (like the Pogo Connect). I use a 3rd gen iPad so I can’t confirm if Paper and Pencil lags on the Air. I suspect if it was an issue I would have seen mention of it from a few folks I follow on Twitter and Tumblr.Allison Atsiknoudas · Jan 9, 2014Great. I’m looking forward to your next update very much.I had been using pencil as a dumb stylus while waiting to upgrade to the iPad air. In comparison to the bamboo, I find that you need very little pressure to use pencil which makes it seem more life-like. I actually prefer the tip as just a plain stylus. With the same light pressure, the bamboo does not register. On the flip side, the bamboo is better weighted and is slightly textured which makes it grippy. The graphite pencil is beautiful but too smooth. Wouldn’t it be interesting if pencil acted more like a real rectangular pencil such as the Generals sketch? Designed to be cut with a knife, the chisel point line quality varies as you turn it (that would be cool)…. Or to use pencil + blend as you would real charcoal!Michael Rose · Jan 9, 2014I really like how Pencil feels to draw with and how it glides across the screen compared to other styli I’ve used. I get the whole pressure sensitivity thing. It adds another layer of complexity when drawing that most will never use. Once you’re exposed to it though it’s really hard going back to a “dumb” stylus that doesn’t have the feature.I’d love to see Blend continue to evolve instead of using the same Gaussian blur effect on everything you smudge. If pencil marks blended more like real charcoal with a sense of texture to it that would be amazing. Hell I’d love for a pastel or charcoal tool to be added to compliment the pencil. Sure would make shading easier.Paul · Jan 10, 2014Hi Michael, I had a question. So I’ve been having that issue with pencil marks being mistaken for blend. Do you continue to have that issue? And a few times, it won’t register lines that I’m trying to make. It’s either extremely delayed and then it will appear or it won’t appear at all. Have you had that issue at all? Basically, I just wanted to know if these are issues that I’m just having with my specific pencil or if these are kind of universal bugs that all pencil users are experiencing.If these are universal issues, you think they’ll be taken care of with software updates?Michael Rose · Jan 10, 2014Hi Paul. Yes I still experience the mistaken blends. It has gotten better from software updates, but I do notice it still happening. I’ve seen others go as far as turning off the Blend feature in Paper’s settings until they need it and then flipping it back on.That’s pretty much how I use it now. I do 90% of my drawing with a Pogo Connect (just because I like the extra sensitivity it allows) and then I’ll connect a Pencil if I need to Blend something.The only other suggestion I have is to press hard when you draw. If you press too light it won’t trigger as an input and therefore Paper thinks it’s your finger and begins blending. The delays you’ve noticed I think are from the software trying to be smart and determine if a stroke was made by Pencil or your finger after the fact, and correcting accordingly.I’ve also noticed Pencil’s tip “dulling” after using it for a bit. The mechanism behind the tip appears to lose its springiness and that could be another reason why blend is falsely triggered.Hope this helps!Paul · Jan 11, 2014Thanks for your thoughts/tips. Very helpful.Mark McKay · Jan 12, 2014So which one do you prefer in the end — graphite or walnut? You seem to list pros and cons of both, but which one do you like best and why?Michael Rose · Jan 12, 2014Personally I like the extra weight and brushed metal look of the graphite one. And since I have no use for the magnetic clip-on feature of the walnut one I choose graphite, especially since it’s $10 cheaper.They both function exactly the same so it really comes down to which one you like the look of better and if clipping it onto a Smart Cover matters to you or not.Dean · Feb 10, 2014How does Pencil perform in writing task? I’m a court interpreter who rely more heavily on note taking and sketching than on drawing. Thanks!Michael Rose · Feb 10, 2014It’s about the same as other styli… maybe slightly better. I find writing with Paper hard. The only way I can write something is by "
