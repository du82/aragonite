full_description = "Paperfaces digital drawing giveawayFeb 16, 2019 — by Michael Rose in NotesTo celebrate two years of drawing portraits every day, I’m launching a fun giveaway leading up to the special day.On August 31st I’ll select (3) winners at random to draw digitally1 on my iPad, using portrait reference photographs of their choice. Here’s a refresher of the type of drawing I will end up doing if you’re new to my work.Entering the PaperFaces Giveaway is simple. Contest has ended: Just fill out the Rafflecopter form below and follow the directions. You can increase your odds of winner by completing some or all of the entry types2. Have fun and good luck!Winning portraitsWinners of my first PaperFaces portrait giveaway.Upon the drawing’s completion the winners will receive PNG files measuring 2048×1536 pixels. This contest is for a digital drawing only, the winners will not receive a physical drawing. ↩︎All entries will be verified for completion prior to randomly selecting winners. Following and then unfollowing will do you no good as those entries won’t be counted in the giveaway. ↩︎Tags: DrawingPaper appInspiring faces want to knowDrawing experienceMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.Related entriesTiger StyleThe Killing JokeHooded Girl that Hides"
