full_description = "All tagsBrowse content organized by topic.BeardArtwork and other errata celebrating the process of growing facial hair… from mustaches to yeards.Black and whiteArtwork lacking any significant color… monochrome, grayscale, two-tone, and other desaturated goodness.BokehArtwork that is partially blurred or out of focus for aesthetic reasons.DesignSelect design works from my portfolio along with thoughts on typography, layout, and other visual design topics.DrawingTutorials and thoughts on drawing digitally and with traditional media such as pencil, paint, pen, charcoal, etc.EntertainmentRants and reviews about the games, films, and music I’ve experienced.LifeReflections, journals, happenings, and other bits related to my life.Open sourceThemes, software, and source code I’ve made available for others to use and learn from.PaintingArtwork painted traditionally and digitally on iPad.Paper appPaper by WeTransfer is a sketching, drawing, painting, diagraming, wireframing, and collaging app for iPad and iPhone. The following tutorials and tricks are from my Mastering Paper series.Pencil by 53Pencil is a smart stylus designed by FiftyThree for their iPad sketching app, Paper. Pre-dating Apple’s own stylus, Pencil’s unique tip and exclusive blend feature made it a favorite with Paper diehards.Pogo ConnectiPad pressure sensitive stylus with interchangeable tips designed to work with older models of iPad prior to Apple releasing their own stylus.PortraitArtistic representations of people (mostly strangers) that have been created in digital and traditional media.ProcreateDigital artwork painted with the iPad OS app Procreate, by Savage Interactive.ReviewsMusings, thoughts, and rants about various “things”… some more in-depth than others.Self portraitDrawings and paintings by, of, and for myself.Sktchy appDrawings and paintings inspired by photographs shared by users of the social app Sktchy.Star WarsArtwork inspired by and directly referencing characters and events from the Star Wars universe.Static sitesMusings and tutorials about building websites using static site generators (SSG) and what is commonly referred to as the jamstack.Tech geekWhere technology and geek intersect.TILShort hand for Today I Learned (TIL). An archive of learnings captured for educational purposes and posterity.Time-lapseArtwork and photography captured over an extended period of time to show significant changes and process.TutorialsGuides, short how-tos, and extensive tutorials explaining a variety of topics.Vinyl recordsThe fine art of collecting analog audio pressed on vinyl.WatercolorArtwork painted with watercolors.Web developmentSelect works from my portfolio along with thoughts on HTML, CSS, JavaScript, and other front-end development topics."
