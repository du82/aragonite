title = "Mastering Pencil by FiftyThree - Made Mistakes"
description = "Learn how to create impressive effects with 53's Pencil stylus and Paper app, using exclusive features like Blend and Surface Pressure."
full_description = "Mastering Pencil by FiftyThreeSep 27, 2021 — by Michael Rose in Mastering PaperNot convinced you need FiftyThree’s Pencil stylus in your life? Or maybe you just want to level-up your digital drawing skills?With the following tutorials, I reveal all of my techniques for using Surface Pressure and Blend in the iPad app, Paper. Turning you into a Pencil stylus master in no time!What makes Pencil so unique and special?Pencil by FiftyThree is not like other styli designed to work with Apple’s iPad tablet. Pencil’s unique shape and meticulously crafted finishes (Walnut, Graphite, and Gold) are the obvious differentiators, but it’s the experiential qualities that truly sets it apart from the rest.For the uninitiated, Pencil allows you to switch between tools in an intuitive and natural way when working with Paper (and apps that support FiftyThree’s SDK). Bounce between drawing, erasing, and blending without ever having to “switch tools” — the tip draws, the eraser erases, and your finger smudges.Switching between modes of working is a breeze with Pencil.Paper’s tools have a level of expressiveness that I’ve yet to see matched by other iPad apps. Pencil augments each of them with improved accuracy, finer controls, and a sort of intelligence that reduces unwanted marks — allowing you to rest your wrists on the screen as you work.Pencil, a year later…Apart from the addition of Surface Pressure, little has changed since first pairing Pencil with Paper over a year ago. It still feels great to use, still has an insanely long battery life, still enables blending, and still lets you rest your wrists on the screen without messing up your drawing.Looking for more? Read my full Pencil by FiftyThree Review.A different kind of tipPencil’s wedge shaped tip is covered in a rubbery material like many other iPad styli, but unlike these “dumb” capacitive siblings, Pencil’s is much smarter. Using a combination of hardware + software wizardry, strokes become more expressive depending on their speed, direction, and alignment to the iPad’s screen.Thin lines are made with Pencil’s fine point while wider ones are made with angled edge of the tip. No other stylus I know of has this ability, making Pencil feel less like a digital tool and more like a real piece of charcoal or graphite (without the mess of course). Oh, and in case you were wondering, the tip is user replaceable too.A built-in eraserWhat would a pencil be without an eraser? Well FiftyThree’s Pencil has one of those too. When you want to erase something you just flip Pencil on its head and glide the rubbery edge over the mistake to remove it.Size can be controlled by making contact with the eraser’s corner (for small mistakes) or the entire surface to remove a larger area. Just like the tip the eraser is replaceable, though I haven’t needed to replace mine yet.Erasing and undoingIf you’re looking for other erasing techniques that don’t rely on Pencil’s hardware eraser you’re in luck. I wrote an entire guide dedicated to correcting and covering-up mistakes in Paper by FiftyThree.Palm rejectionI’m going to come right out and say it.Drawing, painting, and writing digitally on the iPad’s glass surface feels really weird.Thankfully FiftyThree put the engineering effort into Paper and Pencil to alleviate these issues — specifically related to palm rejection.When Pencil is connected to Paper (or supporting apps), Palm Rejection completely transforms the drawing experience making it more accessible.Play YouTube videoRegistering touches consistently is almost impossible for my two little girls at this age because:The iPad is easily confused by touches made by resting wrists and palms on the screen.Their small fingers are often ignored by the iPad’s sensors.Pencil makes coloring on the iPad a reality for my easily frustrated daughters without fanfare or setup — Palm Rejection just works.Setting up PencilThere’s not much you need to do before using Pencil. Upon opening the box and removing the plastic wrap you’ll want to slide out the tip to charge the battery via USB. In about 90 minutes you’ll be good to connect it with Paper (or any Pencil ready app) by pressing the tip to the pairing spot.To view more details about your Pencil (battery level, firmware, serial number) tap the FiftyThree logo (or your profile icon when signed into Mix) located in the upper right corner.Finger settings: Blend, Draw, NothingYou also have the option to toggle whether your finger Blends, Draws, or does Nothing when Pencil is connected to Paper. If you find Paper mistakenly smudging as you draw, switching to Nothing is a great way to prevent that.For even more information on how to setup Pencil, change tips, and performing maintenance like updating the firmware — check out FiftyThree’s Support pages. It’s where I first learned about this little fix:If you have Multitasking Gestures or Accessibility Zoom enabled, this will prevent Pencil from operating effectively. Turn off Multitasking Gestures in your iPad Settings, under General. Turn off Accessibility Zoom under General / Accessibility.support.fiftythree.comSurface Pressure, what’s that?When Pencil is connected to Paper it gains enhanced control and expressiveness over the tools with a feature FiftyThree calls Surface Pressure. Stroke sizes become directly related to how much or how little Pencil’s tips touch the screen.Curious on the range you can achieve with Surface Pressure enhanced tools?Marks made with each tool: using the tip’s point, angled edge, point while zoomed in, and angled edge while zoomed in.If you ask me, Surface Pressure is Pencil’s killer feature. It has completely transformed how I interact with Paper by allowing me to be more loose with drawing. What does that mean exactly? Well let me show you…By design Pencil’s invites you to hold it differentlyTo get the most out of Surface Pressure you’ll want to practice holding it with different grips.Play YouTube videoI like to hold Pencil as if it’s a piece of charcoal and utilize the angled tip when sketching. Not only does this change the characteristics of pencil strokes (I’ll get to that in a minute), but it also encourages you to use your entire arm instead of the wrist.Sketching in this way is more fun serves and serves practical reasons as well. By moving your entire arm you’ll find that:Drawing straight lines and ovals becomes much easier.You can create sensitive lines1 at will.Your drawings will have more movement and energy to them.It becomes quicker to fill in large areas of space.A new tool for shadingYou may have noticed in the cheat sheet above (or in your own experiments), that the sketch tool takes on new qualities with Surface Pressure. With this tool selected, the angled edge of Pencil’s tip turn into wide textured strokes that resembles those made with charcoal or graphite.Wide strokes made with the pencil tool overlap differently than the ink, marker, and brush tools. These “shade” strokes have a more defined edge and can cause color banding2 in tones if not smoothed out. To better illustrate this concept here’s what I consider a tone with “blocky” strokes. Sorry, your browser doesn't support embedded videos, but don't worry, you can download it and watch it with your favorite video player!Animation showing overlapping wide pencil strokes.Pro tip: shade in circlesReduce color banding by holding Pencil on its side and moving in a circular motion to evenly fill things in.Play YouTube videoIf you look closely at the wide strokes of the pencil (sketch) tool, you’ll notice it fades from dark to light.In my tests, it seems as if the placement of the darker edge is determined by the angle of the stroke. Dark points up and light points down. I’ve yet to find a way to reverse that, so it’s worth keeping that in the back of your mind when shading horizontally.Dark points up, light points down.What’s Surface Pressure good for?Now that you know what Surface Pressure is and how it works. I thought it would be useful to show off what you can do with it in Paper by FifyThree.Gesture drawing and other warm-upsA great way to warm-up before doing any sort of serious drawing is with quick gesture sketches. In art school we’d start each class capturing a model’s movement in a series of 2 minute poses with charcoal and conté crayons.When drawing with Pencil and the sketch tool you can get a look that resembles charcoal rubbed onto paper. Even better, by working digitally you avoid any of the mess from handling a stick of charcoal.Examples of gesture drawings created with Pencil and Surface Pressure:To get the most out of this technique you’re going to want to hold Pencil differently than you’re accustomed to. Instead of a tripod grip you’ll want to wrap your fingers around Pencil and rest your thumb just below (or on) the tip.Tripod grip: good for writing, palm grip: good for gesture drawing.As you sketch and draw with this palm grip you’ll need to get comfortable with both pushing and pulling your strokes. Your entire arm and wrist should be moving — wrist only movements will lack fluidity. To better illustrate what I mean here’s a video of me drawing with the palm grip.Play YouTube videoAnother great way to loosen up your arm and hand is to draw ovals over and over again. Focus on moving your entire arm in a circular motion directly above the iPad’s screen.Play YouTube videoIf you take a close look above you’ll notice I make practice strokes in the air above the iPad’s screen before making contact with the Pencil’s tip. This helps achieve accurate and crisp lines without constantly rewinding mistakes.Shading and tone buildingThe same layering principles used when glazing can be applied to the pencil tool with Surface Pressure.Painting with watercolorIf you’re new to Paper and the color tool, learn all about glazing with my Mastering Paper: Back to Basics guide.Surface Pressure enabled shading does most of the hard work by automatically making marks that fade into the canvas. If you’ve had trouble painting smoothly with the watercolor brush before, give the sketch tool a try — it’s way more forgiving.Create smooth transitions by overlapping colors using Surface Pressure.Remember, each pass with Pencil’s angled tip leaves a noticeable edge when overlapped — use this to your advantage! By being deliberate in the direction of your strokes you will help define and reinforce the form of an object. Sort of like how hatching works, but with fatter strokes.Play YouTube videoBy curving my strokes around the contour of the tomato I let Pencil and Surface Pressure do all the work.Pro tip: zoom inFor even more granularity over how fast a shade darkens, zoom in! You get more levels of variation to add nuance to the gradations.Blend, the smudge toolAs you might have guessed from the above heading, Blend lets you smudge stuff. This feature is only available to Paper when Pencil is connected, so you’ll want to pick one up to partake in blending fun. Trust me it’s totally worth it!How does blending work in Paper?It’s not a tool you select like the others, triggering it is way more intuitive than that. You use your finger to smudge whatever it is you want to blend or blur. And like most of Paper’s tools it reacts to the speed of your movement allowing dynamic control on the fly.Play YouTube videoPro tip: blending with a non-Pencil stylusIf you’re looking for more control and accuracy over your blends, try a capacitive stylus instead of your finger. As long as the tip of the stylus is big enough and Pencil is connected this should work. I’ve had success using a Pogo Connect and some cheap styli I picked up from Amazon.Using a cheap capacitive stylus to Blend instead of a finger.How does blending work in other apps?Apps that support FiftyThree’s SDK (like Procreate) get some special abilities when connecting Pencil to them. In Procreate for example, your finger will activate the Smudge tool so you can freely switch between it and the Paint tool.Play YouTube videoPro tip: Pencil’s eraser in ProcreateLike Paper, Pencil’s physical eraser will trigger the eraser tool in Procreate. The current Erase tool settings will be used whenever you flip Pencil on it’s top to correct mistakes.Paper and Blend settingsIn case you skimmed through the first half of this article where I covered Pencil’s settings panel in Paper, here’s the important part to gleam.Paper is good about distinguishing between the tip of Pencil and your finger to avoid unwanted blends. But if you have a lighter touch when drawing you might find that you trigger it more than you’d like. In this case I suggest flipping between Blend and Nothing to toggle it on/off when needed.What’s Blend good for?When used in moderation smudging and blurring your drawings can take them to the next level. If you thought Surface Pressure was cool wait till you see what’s possible with Blend.Depth of field and “bokeh” effectsThe first thing I did when experimenting with Pencil was to smudge up the background of a portrait I drew of my wife. Before Blend I was using the watercolor brush to dab blotches of white to simulate a bokeh3 effect.By rubbing my finger across the background in a circular motion I was able to drop it out-of-focus, creating a more realistic bokeh.Experiment with the speed at which you move your finger. The slower the more intense the blur…As you blend the background pay careful attention not to cut too far into the foreground. It’s this contrast between sharp and blurry that will ultimately help sell the effect by creating depth in the piece.Pro tip: sketch over a BlendAfter blurring a background with the Blend tool go back over the edges of foreground objects. When drawing portraits I like to sketch wispy hair over a blurred background to add depth to the drawing.More blurred backgroundsHere’s a few Paper portraits I used Pencil and Blend to draw. In the second drawing I purposely smudged the figure’s hand instead of the background to mix things up. Have fun and experiment with focal points!This technique of blurring the background doesn’t have to be used with just portraiture. In the following example it can be used to simulate macro photography, focusing on one object and throwing the rest out of focus.The process is the same:Start by blocking out the background with the watercolor brush.Refine shapes and drop in color using the fountain pen.Evenly blend the objects you want to appear out-of-focus (in this case the entire background).Draw the “in-focus” object leaving sharp edges and adding highlights and other details to make the illusion more convincing.ReflectionsAh reflections… they’re so magical and easy to achieve with Blend. With a few minutes of quick drawing and a couple of swipes of your finger you can create photo realistic scenes like these:To start you’ll want to use the pencil tool to mark the horizon, and sketch out your scene — I like to use a light gray color for that. Then start to paint in the sky and shape the mountains using the brus"
