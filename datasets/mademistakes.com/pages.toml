full_description = "Minimal Mistakes Jekyll themeSep 5, 2021 — by Michael Rose in Jekyll themesMinimal Mistakes is a flexible two-column Jekyll theme. Perfect for hosting your personal site, blog, or portfolio on GitHub or your own server.Source on GitHub Live demoSplash layout, ideal for landing pages.Group posts by year with this archive layout.A post layout with optional author sidebar and customizable social media links, share buttons, and related posts widget.Flexible and customizable. Easily add custom navigation and table of contents sidebars to documentation heavy pages.FeaturesIncludes responsive layouts (single, archive index, search, splash, and paginated home page) that look great on mobile and desktop browsers. As the name implies — styling is purposely minimalistic to be enhanced and customized by you.Support for large header images and videos.Custom sidebars including support for navigation lists.Table of contents navigationPhoto gallery componentRelated posts componentBreadcrumb navigationGitHub Pages compatibilityInstalls as a remote theme for an easier upgrade path. You can also install it as a Ruby gem or fork the repository and use it as a starter template.Native Sass supportLeverages Jekyll’s built-in Sass/SCSS preprocessor for easier maintenance and customization of the theme’s colors and typography.Color variationsComes bundled with nine different “skins”.Air skinContrast skinDark skinDirt skinMint skinSunrise skinAqua skinNeon skinPlum skinCommentingIncludes support for the following commenting systems and providers: Disqus, Facebook, Discourse, static-based via Staticman, utterances, and giscus.Localized user-interfaceIncludes translated text for all UI used across the theme in a YAML data file. Custom the text for any of the following languages (or add your own): English (default), Arabic (عربي), Brazilian Portuguese (Português brasileiro), Catalan, Chinese, Danish, Dutch, Finnish, French (Français), German (Deutsch), Greek, Hebrew, Hindi (हिंदी), Hungarian, Indonesian, Irish (Gaeilge), Italian (Italiano), Japanese, Korean, Malayalam, Myanmar (Burmese), Nepali (Nepalese), Norwegian (Norsk), Persian (فارسی), Polish, Punjabi (ਪੰਜਾਬੀ), Romanian, Russian, Slovak, Spanish (Español), Swedish, Thai, Turkish (Türkçe), and Vietnamese.DocumentationTo learn more about how to customize this theme, include feature images in posts, modify the look and feel, and create new posts, read up here. Includes sample pages showing off all layouts, components, and more.TroubleshootingNeed help setting up the theme or getting it configured? Search the discussions or issues on GitHub. Having trouble installing or using Jekyll, the Jekyll Talk forum is a good place to ask for help.LicenseThis theme is free and open source software, distributed under the MIT License.Tags: DesignOpen sourceStatic sitesWeb developmentSkinny BonesBasically Basic Jekyll themeMichael RoseJust another tattooed, bearded, vinyl-collecting designer, front-end developer, and illustrator calling Buffalo, New York, home.Related entriesBasically Basic Jekyll themeSkinny BonesHPSTR"
