title = "madhadron  - A criticism of Ruby"
full_description = 'A criticism of Ruby Status: Done Confidence: Possible This is a criticism of the Ruby language and its community. Some of the criticisms point out fundamental errors in the language design, or poor choices in what historical examples to follow. Others are about errors in the process of developing the language that have reduced its usability. I have intentionally avoided all criticisms based on my own familiarity with some particular language. This means I have had to lay out a clear statement of the criteria a given language construct is supposed to address in practice, with examples of how various languages have handled it, and then turn to how Ruby has failed in this area. There are things about Ruby that I think are poor choices—usings symbols like @ and $ instead of spelling out names, or Perlisms such as $/ for newline separator. I can make cases for my tastes here, but I acknowledge these as questions of taste. I am concerned here with substantive errors in Ruby’s language design, often cases where an infelicitous combination of small choices led to a cascade of complexities. This document is necessarily negative about Ruby. Every section culminates with a criticism of Ruby. I have used what I found frustrating about Ruby as a lens for examining issues of language design. If I had used C++ or PL/I as a lens, then this document would be a sequence of negative statements about those languages instead. I must admit that the choice of Ruby was no accident, and I felt a certain gleeful sadism in the dissection, perhaps in revenge for my own frustrations in programming in the language. Documentation The degree and form of documentation is nearly uniform within a programming language community. Look at the language, its standard library, and those libraries and tools in common use, and the organization, the amount of detail, the structure of the reference material, and the form in which the documentation is presented and distributed is nearly uniform. For those who work in a single community this may seem unremarkable, but for those of us who wander (more or less uncomfortably) among many communities, it is a cause for astonishment. The appendix goes into detail about the documentation cultures of several programming communities, but there are some defining questions: How is expository and reference information organized? Is API documentation completely separate from tutorials, as in Java, or does every API reference begin with a short introduction and some examples of use, as in Python? How closely intertwined are code and documentation? They may be completely separate, as in C, or one and the same, as in Knuth’s literate programming. How is the documentation accessed? Is it from static manuals, even hard copy books, is it found by quering a running instance of the language runtime, or both? How much detail is typical in the expository and reference information for the language? This can range from scanty vignettes as in BioConductor to Common Lisp’s closely defined standard. Each of these decisions has tradeoffs. If I use docstrings extracted by a running image, then a piece of code that defines a large number of functions on the fly, none of which have an explicit representation in the source code, can easily give them documentation accessible like any other function. On the other hand, it is easy to lose the docstring on an object when transforming it in the instance (as with Python’s decorators)—a problem that static comments a la Java do not have. Other criteria have some choices that are clearly superior. The lack of both complete exposition and complete reference documentation in BioConductor’s vignettes, for example, is inferior to Common Lisp’s standard by all criteria except saving the implementor the time and effort to write documentation. What are Ruby’s characteristics in this area? Expository information is separate from reference information. Reference information is provided in HTML format. Expository information is scattered among books, blog posts, and tutorials. The reference documentation is extracted from the source code, though there are at least three separate tools—RDoc, Tomdoc, and Yard, each with separate formatting conventions—for doing so. The documentation is accessed via static manuals. Ruby does not use docstrings or provide documentation in the runtime. The reference documentation is sketchy. It is typical for a Ruby programmer to refer to the source code to figure out the semantics of a function. Interfaces, protocols, and abstractions What are the methods on a socket object? Most programmers will immediately respond: read, write, and close. There may be more—whether the socket has data ready to read, is it closed already, and various others depending on the exact semantics a programmer learned for sockets—but those three will be universal. What methods will a stream have? Read and close at least. Such fixed sets of methods on a group of types we refer to as an interface. All languages have interfaces. In Java, they are explicitly called interfaces and are distinct entities in the language: public interface Stream { public String read(int n); public void close(); } Clojure and Haskell give them their own existance under the names “protocol” and “typeclass”, respectively. Common Lisp, Python, and (weirdly) C don’t give interfaces a language entity, but make heavy use of them in practice. Any object in Python with a read method and a close method, obeying some basic semantics, is usable as a stream, whether it is a file or a network socket. In C, we can write a generic function over streams by passing, in addition to the stream to work with, a function to read from that stream and a function to close that stream. Such interfaces are essentially untyped, but common practice among good practitioners of the language, and are found even in the C standard library. For example, qsort (a quicksort function) has the signature void qsort( void *base, size_t nel, size_t width, int (*compar)(const void *, const void *) ); The first three arguments give a pointer to an array of memory, the number of elements in the array, and the number of bytes per element. The last argument is a function to compare two elements. The actual types and widths of the elements, and the types and widths the function expects to operate on, are completely unavailable to the compiler. Interfaces extend beyond simple things like streams. Something as complicated as a SAX parser has an interface. There may be multiple SAX parsers in a language, with different tradeoffs of speed, memory use, ease of installation, etc., but there is no reason that they should not all share an API for SAX parsing. Python has codified this. Many elements of its standard library will have a version written in Python (for portability) and one written in C (for speed). The C version has its library name prefixed with a lowercase ‘c’, but the API within the libraries is identical. So whether you use ElementTree or cElementTree, your code should produce identical results, but it will run much faster with the latter. The most obvious argument for strict interfaces is reducing how much a programmer must memorize. You avoid having distinct blocks of code to handle this kind of socket versus that kind of socket. But the real argument for interfaces is not what they save you from having to do, but what they make possible. For example, you can define a function that takes two streams, and returns a stream which concatenates them, or that returns a stream with all XML doctype definitions removed, or returns a stream that allows you to peek an arbitrary number of characters ahead into the stream it is transforming. These are all still streams. The glory of interfaces is not that they save you work, but that they make disparate types with common behavior into something that can be combined and transformed. Any one of these transformed streams can be used as an argument to any other of them. They have become an algebra. In the absence of an interface, none of these transformed streams are usable by existing code. This is one of Ruby’s weaknesses, possibly because the documentation is sparse and it is impossible to satisfy an undocumented interface. A few (by no means comprehensive) examples: TcpSocket and SslSocket do not name their read and write methods the same thing. The SAX parsers in Rexml (which is pure Ruby) and Nokogiri (which is a binding to the C library libxml2) differ only cosmetically. Their constructors are slightly different, and the name of the event handling functions they expect are different, though they do precisely the same thing. There is no reason they could not have identical APIs. The XML libraries, and everything else that uses a stream, don’t use any well defined interface, so writing stream transformers is an exercise in frustration: run, see what method the library tried to use that was missing, implement it, repeat. Namespaces, compilation units, and modules I know of three concepts in computer science for organizing large amounts of code. The three are orthogonal. That is, if we write out the algebraic properties satisfied by the operations on them, there are no properties relating operations of one to operations of another (though there are optimizations in compilation that can be made that interact among them). The three concepts are: Compilation units to control how much work a compiler must do to recompile a program when parts of it have changed. Namespaces to make the bindings of symbols predictable. Modules to define interfaces among components of the system. All languages in general use today provide at least a partial implementation of all three, at least by social convention if not by actual language support. Many language provide a notion of library, package, or assembly, but these can be seen as recursion in these three notions: a library as a namespace containing namespaces, versioning of packages as a compilation unit containing compilation units. Compilation units When recompiling a program, the simplest way is to compile all of the code from scratch, as if this were the first time it had been compiled. In practice, this is often impractical. Some systems require hours or even days to build. In systems where the build time is long, the code going into the present build usually differs only slightly from the code that went into previous builds. To take advantage of this, we can divide a program into pieces and draw a directed, acyclic graph between the pieces, with one piece linked to another if its code, in the course of its life, will transfer control to a piece of code in the other. When we change code in one piece, we only need to recompile it and any pieces with a path to it in the graph. For systems with thousands or tens of thousands of pieces, this can be a remarkable speedup. These pieces are what we refer to as compilation units. In most languages today, compilation units are some combination of files. In Python, the compilation unit is a single file. In C and C++, it is a source file and one more headers. For a compilation unit we expect to be able to compile it, to be able to measure if it has changed since the last compilation, and, for any pair of compilation units, whether changes to one will also require the other to be recompiled. Namespaces Say you decide to use a third party library when writing your program. You don’t want to worry about what every binding in that library is, and whether you are going to collide with it when making your own bindings. Further, you want to be able to write your code to be interpreted in the context of a known set of bindings. Yet you also want to be able to override existing bindings, or attach bindings from other libraries to your current context. Handling these cases has leads us to namespaces. A namespace encapsulates a set of bindings—functions, classes, constants, macros, or whatever other constructs the language allows a name to be assigned to—so they are not impacted by bindings in other namespaces. To make namespaces useful they must have what I call the “relocatability property”: if I move some code from one namespace to another, then attach that namespace, there should be no change in the behavior of the program. In languages without explicit namespace support, such as C, Smalltalk, and Emacs Lisp, developers usually prefix their bindings with a library name. Every binding in GLib in C is prefixed with g_. All of org-mode’s bindings are prefixed with org-. If everyone adheres to this convention, leaving unprefixed symbols to the default language and its standard library, then there need be no namespace collisions. Continuously prefixing everything gets awkward quickly, so languages with more explicit namespace support, such as C++ and Python, allow you to attach part or all of a namespace, possibly qualified or renamed in some systematic way, to another namespace. In Python, where namespaces are files (which are also compilation units and modules as well) you can write import something something.f() import something as new_name new_name.f() from something import f f() from something import * f() In C++, where namespaces are separate from compilation units, you can do the same thing: namespace something { void f() { … } } something::f(); namespace new_name = something; new_name::f(); using namespace something::f; f() using namespace something; f(); There is another notion of namespace which is similar enough to be justifiably called a namespace, but different enough to be confusing: different syntactic usages of a symbol may refer to different bindings. That’s obscure, but a bit of obfuscated Java will make all clear: public class Main { public static class T<T> { public T T; public T(T value) { this.T = value; } } public static String T() { return "Hello, World!"; } public static void main(String[] argv) { String value = T(); T<String> T = new T<String>(value); System.out.println(T.T); } } Everything in sight is called T, but almost every T refers to something different. In Java, the same symbol can refer, based on its syntactic position, to a local variable a function or method a type or package a generic type parameter The extreme cases of this kind of namespace are Common Lisp, where you can add your own namespaces of this kind to the language (and Common Lisp already has five or six of its own built in), and, at the other end of the spectrum, Scheme, which has one namespace for everything. These are also namespaces, but the operations on namespaces that we define next make no sense on them. Returning to our namespaces for encapsulating bindings in code, there are a clear set of operations to support. We must be able to import the bindings from one namespace into to another, we must be able map a namespace into another with all its bindings qualified, typically by a prefix, and we must be able to extract a subset of a namespace. These operations'
