title = "madhadron  - Easier, faster software testing"
full_description = '''Easier, faster software testing Status: Finished Confidence: Very likely We all know that we should test our code, but the slog of figuring out what tests to write, generating all the test data, and figuring out what to assert for each case can end up taking longer than writing the code. And most of the advice on doing so isn’t that helpful. Most of what you find is information about continuous integration, or arguments about unit tests versus integration tests, or whether test driven development is the One True Way™. And all you want is to know is how to not have to spend two hours writing boilerplate to test ten lines of code. Picking test cases can take only a few minutes if you have a few heuristics, and there are techniques that make generating test data vastly simpler. And a few coding guidelines shrink the number of tests you have to write dramatically. And testing concurrent systems is never easy, but it can be relatively straightforward. There are also ways to make your code easier to test, which I’ve detailed elsewhere. The code in these lessons is all on GitHub. Lessons: Lesson 1. Getting started Lesson 2. Formal methods are your friend Lesson 3. Choosing test conditions Lesson 4. Multiparameter functions Lesson 5. Testing recursive problems Lesson 6. Structs and records Lesson 7. More complicated boundaries Lesson 8. “Hidden” parameters Lesson 9. Setting up implicit state Lesson 10. Randomized data Where next… Lesson 1. Getting started All our examples are going to be in Python 3 and use only its standard library and the third party tool mypy. Python is the closest to pseudocode or a lingua franca that we have today. So let’s start at the beginning. We have a function under test. Let’s choose something simple, like Boolean and. def _and(x, y): return x and y By convention in Python we put tests in a file with the same name but with test_ prefix to the filename. So in test_addfunc.py, we write import unittest from andfunc import _and class TestAnd(unittest.TestCase): def test_and(self): cases = [ ((True, True), True), ((True, False), False), ((False, True), False), ((False, False), False), ] for (input, expected) in cases: with self.subTest(input=input): found = _and(input[0], input[1]) self.assertEqual(expected, found) The unittest library provides a base class called TestSuite. Each test you write is a method of your subclass with a name starting with test_. Tip: You will often have lots of test cases that differ only by their input data and the expected output. Rather than write lots of boilerplate to do the same test for each input, set up a mapping as we have done here and iterate over it. Note that we have used with self.subTest(...). Each call to this context manager will make the asserts that happen in its body appear as separate tests when you run the test suite. This is important because when a test fails, you want to be able to understand what failed as quickly as possible. Much of the time people lose in testing is understanding what is leading to a failing test. Think about how to organize your test suite so that a single failure leads you straight to what is wrong. On Unix systems you can run this test suite by running > python3 -m unittest test_andfunc.py test_and (test_andfunc.TestAnd) ... ok -------------------------------------- Ran 1 test in 0.000s OK The next thing I recommend is to install and learn to use PyCharm, a Python IDE from JetBrains. The community edition is free, and it is worth learning the environment just for the time you will save by being able to single step through failing tests in the debugger in a nicely integrated environment. Exercises Skim through the documentation for the unittest module. Install PyCharm Community Edition and learn how to set a breakpoint and run unit tests in the debugger. Try rewriting test_addfunc.py so each of the conditions is its own test method instead of using subTest. How much more awkward is this? Lesson 2. Formal methods are your friend This lesson begins with a lot of exposition, but I promise we’ll get to the meat soon. There is a world view in parts of the programming community that the only true way to show program correctness is by formal proof. This reflects the fact that the major intellectual heritage of academic computer science is from mathematics and theoretical physics. This viewpoint will hold you back. Our world is built on things known primarily from experiment. When an engineer designs a steam turbine, they aren’t deriving the properties of water from first principles, or indeed from any mathematical model. They have big tables of the measured properties of steam that they reference. Toxicologists don’t prove a safe dose of some toxin by formal proof. They do so by carefully selected experiments. Antibiotics were not a result of a proof from first principles, nor were SSRI antidepressants. In fact, we don’t really know how either work. Their entire basis as useful artifacts is demonstrated by experiments. So even if we don’t have a formal proof of our program’s correctness, we can have high confidence in its correctness by testing correctly chosen cases. Now, when I say “formal methods,” many people immediately think of automatic verification of the properties of the entire system, such as the seL4 project that provides and end-to-end verified microkernel. seL4 is amazing, but it took years of work by specialists. End to end proof isn’t the only use for formal methods. We all use formal methods every day to get us part of the way. Consider structured programming. When it was created in the 1960’s, it was considered too abstract for real world use, too much formal mathematics. Today we are so used to working with these formal methods that the spaghetti of goto statements that it forbid is something young programmers today never imagine. Another example of a formal method we use when we write our code. There is a classic source of off by one errors when we write classic C loops to iterate over arrays or other data structures: int[] xs; int len; ... for (int i = 0; i < len; i++) { printf("%d\n", xs[i]); } Did we get the length right? Was it supposed to be <= or <? With experience programmers restrict themselves only to specific patterns and don’t use the broader possibilities of the loop, or have switched to constructs that, like structured programming, mathematically guarantee that we can’t make this class of error, such as in C++, for (auto it = xs.begin(); it < xs.end(); ++it) { printf("%d", *it); } or in Python, where this was made the default, for x in xs: print(x) So this leads us to our first principle: Principle 1. Wring everything you easily can from formal methods before you start testing. The quickest formal method, and one you can get enormous mileage from if you master it, is type checking. Let’s look at our tests from lesson 1 again. We can call the function def _and(x, y): return x and y with arguments of any type, whether booleans, strings, numbers, or more complicated data types. And in Python, this has well defined semantics. But say that we don’t want that. We want to operate on booleans. We could change the function to throw an exception, def _and(x, y): if not isinstance(x, bool) or not isinstance(y, bool): raise ValueError("Arguments must be boolean") return x and y but now we have to write more tests to check this behavior. During the slog of writing such tests, being able to say “Look, x is an int” in C or Java starts looking pretty nice. Fortunately, Python 3 has type annotation. We can write def _and(x: bool, y: bool) -> bool: return x and y By itself, this doesn’t do anything, but we can run the tool mypy to type check our code. Adding those “: bool” annotations is much faster to write, to read, and to maintain than writing tests for the same behavior. When we are testing code, we are doing so already assuming properties given to us by formal methods, and everything we can claw out of those formal methods will save us effort testing. Exercises Write a few calls to _and in andfunc.py that are of the wrong types. Install mypy and run it on andfunc.py so see what it produces. Look up INTERCAL’s COME FROM statement. What would this do to being able to reason about your program’s behavior? Lesson 3. Choosing test conditions So, we’ve got our basic test framework set up. We know that we should get everything out of formal methods that we easily can to make our testing easier and faster. How do we actually choose the conditions that we test? For _and, it’s easy. With the type annotations, there are only four possible inputs. We’ll test them all. But what about a function head that returns the first element of a list? We can’t test every possible list, and, intuitively, it would be incredibly wasteful even to try. So how do we choose which lists are important? First, we use formal methods again. We annotate the types by creating a generic type variable with TypeVar. from typing import List, TypeVar T = TypeVar('T') def head(xs: List[T]) -> T: if xs == []: raise ValueError('Cannot take head of empty list.') else: return xs[0] The type of elements in the list is generic, so it doesn’t matter what type we use. We could even let T be NoneType, which has only one value (None), and use lists [], [None], [None, None], … . That turns out not to be what we want because we would not be able to distinguish if we are accidentally taking the second or last element of the list instead of the first. For other functions, like finding the length of a collection, testing with NoneType is very useful. For this case, though, we want a bigger type that we can distinguish values of, like int. But which values of List<int> are important? This function only touches the first element of a list (if it exists). Passing a list of fifty one elements to this function is going to be basically the same as passing a list of fifty two elements or a hundred and two elements. On the other hand, the empty list, list with one element, and list with two elements are probably all things we want to test. This is a pattern we will see again and again. If we consider the space of possible inputs to a function, most functions have small boundaries in that space where their behavior changes dramatically, connected by broad stretches where things are pretty much the same. This gives us an heuristic: Principle 2: Carefully test the boundary. Sample the bulk. With that in mind, let’s write a test plan for head. import unittest from head import head class TestHead(unittest.TestCase): # Boundary: # [] -> raises ValueError # [522] -> 522 # [5, 2] -> 5 # Bulk: # [128, 53, 921, 1022, 41] -> 128 # [1, 5, 3, 12, 8, 1, 3, 2, 1, 5, 3, 19] -> 1 def test_empty_list(self): with self.assertRaises(ValueError): # head behaves quite differently on [], # so we can't lump it in with the other # cases without being ridiculously # complicated. head([]) def test_head(self): cases = [ ([522], 522), ([5, 2], 5), ([128, 53, 921, 1022, 41], 128), ([1, 5, 3, 12, 8, 1, 3, 2, 1, 5, 3, 19], 1), ] for input, expected in cases: with self.subTest(input=input): found = head(input) self.assertEqual(expected, found) The same approach works in general for other functions on containers. Consider the function from typing import Dict, Hashable from math import inf def maxval(m: Dict[Hashable, int]) -> int: if m == {}: return -inf else: return max(m.values()) that returns the highest value in the provided dict. What should its test plan be? (Note: The Hashable for keys is a detail of Python, which requires that dictionary keys be hashable so they can be put into a hashmap. Hashable is the most general type definition that can be a key.) The boundary obviously includes the empty dict {}, and dicts with one and two elements. We want to handle the two element cases when they have equal values and when they have different values. Then we take some large dicts out in the bulk. So we have something like: import unittest from maxval import maxval from math import inf class TestMaxval(unittest.TestCase): # Boundary: # {} → -inf # {'a': 1} → 1 # {'a': 1, 'b': 1} → 1 # {'a': 1, 'b': 2} → 2 # Bulk: # {'a': 5, 'b': 12, 'c': 42, 'd': 961, 'e': 128} → 961 # {'boris': 400, 'blah': 999, 'quirk': 421} → 999 def test_maxval(self): cases = [ ({}, -inf), ({'a': 1}, 1), ({'a': 1, 'b': 1}, 1), ({'a': 1, 'b': 2}, 2), ({'a': 5, 'b': 12, 'c': 42, 'd': 961, 'e': 128}, 961), ({'boris': 400, 'blah': 999, 'quirk': 421}, 999), ] for input, expected in cases: with self.subTest(input=input): found = maxval(input) self.assertEqual(expected, found) Boundary and bulk will carry us a long way, through parse trees and recursive structures and even to describing the behavior of external services. But before we do that, we need to talk about functions with more than one parameter. Exercises Write a boundary and bulk test plan for square(x: float) -> float that squares its input. Don’t forget to text overflow! Write a boundary and bulk test plan for length(xs: List[T]) -> int that returns the length of the list. Lesson 4. Multiparameter functions All the functions we have been testing so far have had one parameter. That obviously won’t do. How do we handle functions with two or more parameters? The field of statistical design of experiments provides us with the general answer, called a “factorial design.” Factorial designs first appeared in agricultural experiments. Say we have three kinds of fertilizer, two watering schedules, and two kinds of seeds. How do we find out what effect each of them has? Until the early 20th century, scientists would have said to fix two of them and vary only one factor at a time. It turns out that this isn’t the best way to do it. If the fertilizer you happen to choose when you hold it fixed kills the plants, then you learn nothing about watering schedule. Maybe one seed variety likes one watering schedule better and the other seed variety prefers the other schedule. For almost any sensible situation you might encounter, the best way is to do all combinations rather than vary only one factor at a time. When we’re testing software, we do the same thing. We write down boundary and bulk test plans for each parameter, and then test all combinations of test cases for the parameters. For example, consider the function from typing import List, Tuple, TypeVar T = TypeVar('T') U = TypeVar('U') def zip(xs: List[T], ys: List[U]) -> List[Tuple[T,U]]: n = min(len(xs), len(ys)) result = [] i = 0 while i < n: result.append((xs[i], ys[i])) i += 1 return result The first element of its output is a tuple of the first elements of its two input lists, the second element is a tuple of the second elements of its inputs, etc. The output list has the length of the shortest input list. We write down a boundary and bulk test plan for each input, such as xs equals [], [5], [3, 8], [1, 12, 5, 32, 9, 1, 3, 17], and ys equals [], [''], ['a', 'b'], ['vrrp', 'meep', 'baboon', 'trilobyte']. Our test for zip is then import unit'''
