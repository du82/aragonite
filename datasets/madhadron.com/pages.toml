["https://madhadron.com/programming/zero_downtime_deployments.html"]
title = "madhadron  - Zero downtime deployments"
full_description = "Zero downtime deployments Status: Finished Confidence: Certain You have a webservice. How do you push a new version of its software without downtime? This sometimes goes under the name of “blue/green deployment” or “rolling push” or a variety of other names for special cases. What we are replacing Before we dive into zero downtime deployments, let’s talk about deployments that have downtime. Here’s the scenario: You have a service listening for requests. Various users are issuing requests to the service. Service [Not supported by viewer] Users [Not supported by viewer] At some point you have a new version of the service to deploy. Obviously, because you are a conscientious individual, you have ensured that it is well tested and you are confident this is going to go well. You turn off the service, install the new version, and turn on the service. Ideally you give some warning before you do this by scheduling a “maintenance window,” but either way no one can reach the service during this operation. Service taken down <font style=“font-size: 24px” face=“Garamond”>Service taken down<br></font> New version started <font style=“font-size: 24px” face=“Garamond”>New version started<br></font> Maintenance window [Not supported by viewer] Before you go rushing out to set up a zero downtime deployment process, reflect whether you actually need it. Imagine you have a simple Django or Ruby on Rails web service. You’re running one copy on a single machine. It serves a few hundred concurrent sessions. The downtime for deploying a new version of the code is measured in seconds: copy the new code to the server, stop the service, and start it running the new code. Further, many services are only used during business hours in a small range of time zones. If your service is idle ten hours a day, it doesn’t matter if users can’t reach it for thirty minutes in those ten hours. If this is the case, you will be better served spending your time on other aspects of the system. Are you sure your backups are working? Zero downtime deployment: the basic procedure To do a zero downtime deployment, you need to have at least two instances of your program accepting traffic and a load balancer directing connections to them. To do a zero downtime deployment, you: Copy the new code to one of the instances. Tell the load balancer to stop routing requests to that instance, and wait for all current requests to the instance to complete. Stop the service on the instance. Start the service on the instance with the new code. Run a sanity check that the instance came up properly. Tell the load balancer to start routing requests to the instance. Repeat for the other instance. It should be obvious, but it must be said: if the sanity check in step 5 fails, you stop and figure out what went wrong. Once you have done so, you repeat steps 1, 3, 4, and 5 on the same instance until you have successfully brought up the new version. Leave the other instance that is still working alone. Someday you will be stressed in the middle of a deployment, and on that day I hope you remember this warning. Each of the instances must be able to handle the total traffic of your service. You pay for zero downtime deployments by running more hardware than the service’s usual load requires. On the other hand, you will need the same hardware if you need to be able to continue to provide service even when you lose parts of your system in a disaster. But sessions… The first wrinkle in this scheme comes from services that don’t interact with a user in a single request and response. Imagine you are deploying an upgrade to an online widgets catalog. In the new version you have replaced a misspelled HTTP request path /parts/wigdets/ with the correct /parts/widgets/. A user has loaded a page in your site with a link that calls /parts/wigdets/. Between the time that they load the page and they click the link, you deploy your new version to one of your two instances. When the user clicks the link, what happens? If the load balancer is sending requests randomly to each instance, there’s a 50% chance that the user gets what they expect, and a 50% chance that they get a 404 Page Not Found error. In a more extreme case, consider video chat. When a server receives a datagram of video data to forward to another user, it’s not practical for it to write the datagram to shared storage and for another machine to be alerted, read it, and send it out. At best, the latency it would cause would emulate the experience of trying to video chat with someone on the moon. Video chat sessions are handled in memory by one machine, and the packets for all parties in a particular call have to go to that one machine. What both these examples mean is that we need a way to tell the load balancer that a given user session must always go to the same instance of the program. This goes under the name of “session pinning,” “persistent sessions,” or “sticky sessions,” and any load balancer you would consider using in production should have it. The naive way of implementing sticky sessions for N servers is to number the servers from 0 to N-1, use the client’s IP address to calculate hash(IP address) mod N, and use that as the index into the array of servers. If that server is down, look it up some other way, such as hashing the hash to get a new, deterministic, random choice of server. This doesn’t work in general for several reasons: If you add another server to the list, all sessions to existing servers are randomly rerouted to a different server. Clients don’t retain the same IP address over the course of a connection. This is especially true with smartphones. Imagine a video chatting app that dropped the call every time your smartphone switched cellular networks. The usual solution is to teach the load balancer about your application protocol. Amazon’s Elastic Load Balancer, for example, uses a cookie to track sessions. This may not be a problem Most services aren’t video chat systems. All that complexity we were talking about above? You may be able to skip it if you: Store all session information in shared storage such as the database. If your Django app stores all session information in its MySQL database, then it doesn’t matter which instance an HTTP request is routed to by the load balancer. Check for backwards compatibility in your release process. The canonical way to do this is to have lots of tests that you run, but replaying real traffic to your test environment and making sure that it matches what production does may work as well if you have enough traffic covering all your app’s functionality. Deploy large user interface changes almost as new systems. Think about how Google rolls out major changes to GMail’s user interface. You opt in with a button to get the new one. Any changes that don’t require some action on the user’s part are tiny adjustments that users won’t notice as they work with the app. For a lot of situations this isn’t very onerous. It’s worth designing for if you can. How long are sessions? For those who do need sticky sessions, there are more difficulties. Look back at the basic procedure for zero downtime deployments. In step 2, we wait for all sessions to an instance to complete. How long is a video call? A minute? An hour? All day as a family opens a video chat to a distant relative on a holiday so they can be virtually together? How long can you wait to drain this instance? Or when someone is talking to their friend as they arrive at work in an underground bunker with only secured external communications, how long do you wait from the last time you hear from them before you declare the session over? When sessions are open ended, you need to set a time when no activity makes them expire, and you need a way to migrate them. This tends to be domain specific. For example, for a video chat system you might try something like this: The instance currently managing the session generates a nonce (a single use, random number) and sends it to all clients of the session. The clients open a new connection to the load balancer with the nonce as their session affinity key, so they all go to the same instance. The clients issue a special “resume” request to the new instance, including the nonce. The instance creates a session and connects all clients with that nonce to it. The clients send an acknowledgement on the old connection to the old instance. Once all the clients have acknowledged or the session expiration time has been reached, the old instance closes the session. Even if this whole process takes a two hundred milliseconds, users will experience it as only a minor blip. For a slightly more complicated example, consider a multiplayer real time game. Today they mostly follow the lead of Quake 3. Client and server send UDP datagrams, which may or may not arrive. Each datagram says, “The last time I know that you know about is a. I represent time b. The differences from a to b are x, y, and z.” A client sends such a datagram to the server with the player’s activity. The server sends such a datagram to the client to update the world the player interacts with. If you drop a datagram, it’s no big deal. The server maintains a list of the last times clients have sent descriptions for, and always sends updates based on that time. For example, here is a server with two clients. At each step, the server sends the changes relative to the last state the client has acknowledged. Server [Not supported by viewer] Client 1 [Not supported by viewer] Client 2 [Not supported by viewer] Sends change from time 0 to time 1 [Not supported by viewer] Sends change from time 0 to time 1 [Not supported by viewer] Sends change from time 0 to time 1 [Not supported by viewer] Sends change from time 0 to time 1 [Not supported by viewer] Sends change from time 1 to time 2 [Not supported by viewer] Sends change from time 2 to time 3 [Not supported by viewer] Sends change from time 3 to time 4 [Not supported by viewer] Sends change from time 1 to time 2 [Not supported by viewer] Sends change from time 2 to time 3 [Not supported by viewer] Sends change from time 3 to time 4 [Not supported by viewer] Sends change from time 1 to time 2 [Not supported by viewer] Datagrams lost [Not supported by viewer] Sends change from time 1 to time 3 [Not supported by viewer] Sends change from time 1 to time 4 [Not supported by viewer] Sends change from time 3 to time 4 [Not supported by viewer] Sends change from time 4 to time 5 [Not supported by viewer] Sends change from time 4 to time 5 [Not supported by viewer] Sends change from time 4 to time 5 [Not supported by viewer] Sends change from time 4 to time 5 [Not supported by viewer] If you miss some datagrams, who cares? As long as enough get through to keep the states enough in sync to play the game, it will work. How do we migrate a session here? Something very similar to the video chat method would work. Say we are going to migrate the session at time 7, but the last state that all client have acknowledged is 5. Then, The instance currently managing the session generates a nonce (a single use, random number) and sends it to all clients of the session. It saves a snapshot of the game state at times 5 to 7 and the last known times for each client to shared storage, using that nonce as its key. The server ignores all updates from clients and no longer sends game state updates. The clients open a new connection to the load balancer with the nonce as their session affinity key, so they all go to the same instance. The clients issue a special “resume” request to the new instance, including the nonce. The instance creates a session and connects all clients with that nonce to it. It loads the snapshot using the nonce, and starts handling datagrams from the clients and sending out updates. The clients send an acknowledgement on the old connection to the old instance. Once all the clients have acknowledged or the session expiration time has been reached, the old instance closes the session. So much for sessions. Let’s talk about zero downtime deployments of bigger, more complicated systems. More is basically the same There is a famous adage in condensed matter physics that “more is different.” In this case, though, more is basically the same. If we have five instances behind the load balancer instead of two, or fifty, or five thousand, the basic procedure stays the same. The only thing that changes is how many and which machines we deregister and upgrade at a time. Upgrading a batch at a time like this is called a “rolling push.” Recall that with two instances, each instance must be able to carry the entire traffic. The same principle applies here. If you have 50 instances and upgrade them 10 at a time, each of them must be able to handle 20% more traffic. If you upgrade them 5 at a time, they only need to be able to handle 10% more traffic. On the other hand, you have to make sure each batch is healthy after you upgrade them. If you let the new version “bake” for five minutes before starting the next batch, then upgrading 5 at a time will take nearly an hour, while upgrading 10 at a time will take half that. document.addEventListener('DOMContentLoaded', function() { var model = { nServers: 50, batchSize: 10, bakeTimeMinutes: 5, _observers: new Set(), notify: function() { this._observers.forEach(function(observer) { observer(); }); } }; nServerNumber = document.getElementById('n_servers'); nServerNumber.addEventListener('input', function() { model.nServers = nServerNumber.valueAsNumber; model.notify(); }); model._observers.add(function() { nServerNumber.value = model.nServers; }); batchSizeNumber = document.getElementById('batch_size'); batchSizeNumber.addEventListener('input', function() { model.batchSize = batchSizeNumber.valueAsNumber; model.notify(); }); model._observers.add(function() { batchSizeNumber.value = model.batchSize; batchSizeNumber.max = Math.floor(model.nServers / 2); }); batchSizeRange = document.getElementById('batch_size_range'); batchSizeRange.addEventListener('input', function() { model.batchSize = batchSizeRange.valueAsNumber; model.notify(); }); model._observers.add(function() { batchSizeRange.value = model.batchSize; batchSizeRange.max = Math.floor(model.nServers / 2); }); bakeTimeNumber = document.getElementById('bake_time'); bakeTimeNumber.addEventListener('input', function() { model.bakeTimeMinutes = bakeTimeNumber.valueAsNumber; model.notify(); }); model._observers.add(function() { bakeTimeNumber.value = model.bakeTimeMinutes; }); capacitySpan = document.getElementById('capacity'); model._observers.add(function() { capacitySpan.textContent = Math.round(100*(1 - (model.batchSize / model.nServers))); }); pushDurationSpan = document.getElementById('push_duration'); model._observers.add(function() { pushDurationSpan.textContent = Math.round(model.bakeTimeMinutes * model.nServers / model.batchSize); }) model.notify(); }); Take a few minutes to play around with the relationship amo"
