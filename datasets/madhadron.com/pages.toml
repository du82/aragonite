["https://madhadron.com/writing/igor.html"]
title = "madhadron  - Igor"
full_description = "Igor Rose sat before the fire in the dark, listening to the crackle of the wood. She started when a green hand snaked out of the dark behind her and placed a plate on the table at her elbow. “A snack, miss?” lisped the thin voice of Igor from the dark. She regarded the plate and mug in surprise. “Are those mice?” “Apple mice,” confirmed the voice as the hunched, gorilla armed form slipped silently into the firelight. “Apple, with raisins for eyes and noses, little strings of fudge for whiskers, all held together with peanut butter.” He squatted by the fire, facing her. “The young master liked them as a child.” Rose had been pleased when Kraus had suggested spending Thanksgiving with his father. She had grown steadily less pleased as they took a bus to the end of its line in New Jersey, ducked through holes in chain link fences in an old industrial park, dodged around scrap heaps and decrepit buildings, and finally came to a stop at the delivery entrance of an old, brick warehouse. When the door had opened to reveal a—she wasn’t at first willing to call it a man. There were stitches. The skin was green in places. The back was hunched and arms tipped with enormous hands, hands she wasn’t sure matched, that almost brushed the ground. Then it had grinned, a grin like a shark, revealing teeth that did not match. Some were yellow, others white. Some of them were pointed. “Young master!” it had cried, reaching out to embrace Kraus. The same creature was squatting next to the fire, regarding her now. “The young master has gone to bed?” “Yes.” “You are not tired?” “I told him I would be along in a little while.” “Ah.” They lapsed into silence. She picked up the mug, more in response to the awkwardness of the situation than anything else, and sniffed. Cocoa. Good cocoa, to judge by the smell. She took a sip, and felt the rich liquid coat her mouth and throat. “Mmm,” she moaned involuntarily. “Yes, chocolate on a dark November evening is a good thing,” Igor agreed, not stirring from his squat. The silence broken, she began, “Igor—” then trailed off. “Yes, miss?” A pause, and then it came out almost as a yell. “What’s going on here?” “Ah,” Igor said, smiling that shark-like smile. “I thought something like that was bothering you. What did the young master tell you?” “That his mother had died years ago, and his father lived alone with his caregiver.” “‘Caregiver’,” repeated Igor. His grin must have widened, for more teeth were reflecting the firelight now. “And you expected—what? A suburban ranch house, a sick old man, and a live in nurse?” “Well, maybe not in such detail, but yes.” The bald head cocked, stitches showing in the firelight. “What are you studying at university?” “Biology.” “And you like the lab, like hunkering down at the bench and working, sans interruption, don’t you?” “Yes—” she answered tentatively. “Yes, I thought I saw a bit of the spark. What’s going on here, then.” Igor gave himself a shake, resettling his hands where they lay loose on the floor. “The young master’s mother was a scientist. Frau Doktorin Privatdozentin Magold. The warehouse below us was her laboratory. I was her assistant. After her death, I stayed to take care of the laboratory. And of her husband. Matthew is a dear man. Not a bit of the spark, but his stories about the little forest creatures are endearing.” “Forest creatures?” “Oh yes, didn’t the young master tell you?” The head turned to glance at the fire, reflecting many more teeth. “Matthew writes and sells children’s stories about little forest animals. Does quite well at it, too, though the estate has plenty to maintain us both. But it gives him a purpose.” “And what’s your purpose?” The head swiveled back towards her and contemplated her for a moment. “I told you: I take care of the laboratory. And if the next master or mistress does not already have an assistant, I will become their Igor.” “I think I should go to bed now,” Rose said, not sure what to make of this. “Yes, sleep well. I hope you enjoyed your snack.” Rose looked at the now empty plate next to her. She vaguely remembered taking a bite at some point. “Apple mice,” she muttered. “Apple mice,” agreed Igor. “Sleep well.” She woke the next morning to sun in her face, unsure of where she was. Kraus was asleep beside her, but the bed was far too large to be either of their beds at school. She slipped from the bed without disturbing him and hastily dressed. Aside from Kraus, whose gentle snores she could still hear, there didn’t seem to be anyone there. The other bedroom stood open and empty. The living room was equally empty, the fire burnt to ashes, and the place where Igor had squatted innocuous and vacant. At last she heard stirring from the bottom of a stairwell in the kitchen. “Hello?” she called as she descended. The stirring stopped. “Miss Rose?” She almost stopped, but decided it would be rude to pretend not to have heard, and went on to where the stairwell turned. From the landing she looked out into a rough floored room crammed with equipment and lit from banks of windows. Amid the laboratory, for she recognized that it could be nothing else, was Igor, his hunched head just over the level of the workbench at which he was working. “I hope you slept well,” he offered. “Thank you, yes.” She had been astonished that she hadn’t had nightmares, but she had slept peacefully. “Matthew has gone for his morning walk, looking for ideas for his stories. Has Kraus begun to rise any earlier?” “He doesn’t get up before eleven unless he has class.” “He never did. If you can wait, Matthew will be back soon and we will have breakfast with him.” “Yes, thank you.” She hesitated on the stairs while he looked curiously up at her with his left eye. The right wandered aimlessly. “What are you working on?” she asked at last. “Come see,” he said. His grin really did look like a shark, she reflected as she made her way down to the laboratory floor and to the bench where he stood. The Petri dishes laid out on the bench were all covered in some luridly green microbe. “So what is it?” “Green,” he said. “Just green? Not a mutation or a screen or something?” “No, just green.” “Why?” “I have red ones, too. In a few weeks I’ll put them all on string and hang them around the laboratory.” “You use cultures as Christmas decorations?” “It’s good for the laboratory to be used, even if it’s not for research. Eventually someone will come and research here again.” “Why don’t you?” His smile drooped slightly. “I am a man of modest ambitions. Come, help me put these in the incubator, and we will have some tea.” That plan was disrupted by the rumble of the freight elevator. “Ah, Matthew is home,” Igor told her, putting the last plate in the incubator and closing it. He gestured her up the stairs before him. Matthew was already in the kitchen. She had reflected last night that now she knew where Kraus got his looks. He looked like his father: tall, broad shouldered, blond haired and blue eyed, their features sweet and regular. It made Igor all the more shocking. “The crows were chasing an eagle again,” Matthew greeted them. “How do you like your eggs, Rose?” “However you normally have them is fine.” “We have them all kinds of ways. Today we’re going to have the way you like.” “Over easy, then.” She was gestured into a chair while Matthew cooked and Igor set the table in the kitchen, poured orange juice, steeped tea, and laid out butter, jam, and marmalade, all the while thanking her for volunteering to help, but insisting that she “please sit and be served, miss. You are a guest.” Once Matthew had served them eggs, toast, and sliced fruit he sat and fidgeted with his fork. “I wanted to ask—” he began, then frowned. “I wanted to ask—you see, I don’t really understand these things, but—” A deep breath, and in a rush: “Is Kraus happy at university?” “I believe so,” Rose said, nonplussed. “Good.” All sign of hesitation gone, he beamed at her and turned his attention to his eggs. She turned a questioning gaze on Igor, who was spreading marmalade on his toast with surgical precision. He looked blandly back at her. “We all have our reasons for being where we are,” he observed cryptically. Then to Matthew, “So, the crows were chasing an eagle again.” “Yes,” Matthew said, his face lighting up. “Two chased him down the stream bed, and three more ambushed him near where it turns east. Quite a sight. The eagle didn’t even notice the field mouse hopping from rock to rock across the stream.” “There are eagles in an industrial park?” Rose asked. “Oh, no!” Matthew told her. “The concrete ends just behind the laboratory. It’s all woods from there.” “And you go walking in them every morning?” “Every morning,” he agreed, smiling. “How else would I see the animals’ stories so I can tell them to the children?” “Of course,” Rose said weakly, returning his smile. Matthew, still smiling, returned his attention to his food. Igor munched on his toast, still regarding her blandly. Under that gaze, an intense left eye, and the smaller right occasionally locking onto her before rolling away again, she dropped her own eyes to her food. They finished their meal in silence. Matthew bid them good morning and strode purposefully off—“to write,” Igor informed her—and Igor shooed her away when she tried to help with the dishes. “Go relax. And when I am done, perhaps we can check the red cultures in the lab?” He looked inquiringly up at her. Rose cursed her mother’s inculcation of manners as she heard herself say, “That would be nice.” She sat once again at the table and enjoyed the sunlight pouring through the kitchen’s big windows. “What would you like for lunch?” Igor asked her later as he handed her a pile of red cultures to put in the incubator. “Oh, whatever you were planning,” she answered, squatting to gently pile them on the wire racks. She closed the incubator and looked up at Igor, who’s left eye was regarding her. “What?” “You are very biddable,” he lisped. “I’m a guest,” she said, straightening up. “A guest, even the most assiduous, may express preferences.” He heaved himself up onto a bench and bent towards her. “Perhaps something less immediate. What’s bothering you in biology?” She shifted uncomfortably. “It’s rather basic. I hate to bother you with it.” “Miss Rose,” he lisped, “I grow red and green cultures in an empty laboratory to have something to do. Please. Bother me.” She thought his right eye was rolling a little more erratically than usual. “Well,” she started, then in a rush, “do bacteria respond slower when they grow slower?” Igor’s right eye stopped dead while pointing somewhere off to the side, then rolled forwards to join his left eye in regarding her fixedly. “I’m sorry, it’s stupid,” she muttered. “No, Miss Rose,” he said. “It’s not stupid. And I have no idea. Shall we find out?” She blinked at him. “How?” Igor inclined his head and gestured grandly with a misshapen hand. “We do have a laboratory.” “You have—” She looked at the incubator next to her. “Yes, of course you have cultures. But how will we control the growth rate?” “Change the growth medium?” offered Igor. “It’s not perfect, of course—” “No, but unless you have a chemostat somewhere around here—” “Oh, we do,” he intoned, his right eye rolling again, “but it might take us several days to get it in working order again.” “Then it will have to be growth medium. But do we have a strain we can measure response of?” “Let us look through the freezer catalog.” It was several hours later that she heard Kraus’s voice. “Rose?” he called sleepily from the top of the stairs. She looked up from where she was titrating stimulants. “Rose, what are you doing?” He sounded more awake and less pleased. “Igor and I were working on something,” she said pleasantly. “Did you sleep well?” She stood, stripping her gloves off, and running her hands through her hair. “Yes.” “Go on up,” Igor said, slipping up behind her. “I’ll finish.” He looked over the meticulous notes she had been made for the process, and picked up her pipette. She gave him a grateful smile and turned to the stairs. Matthew was already making lunch, and smiled at her. She sat across from Kraus while he sipped coffee. He kept glancing at her, frowning, until Matthew called down to Igor to come up for lunch. Matthew smiled at them all as they sat down, and dipped his grilled cheese sandwich into his tomato soup. Igor idly chewed on his, his left eye directed at it. His right eye was rolling back and forth between Rose and Kraus, and she wondered how much he saw with it. Kraus poked at his soup, occasionally glancing up at her, and then at Igor. Kraus begged off as soon as lunch was over, saying he had studying to do. Matthew cheerfully bid them a good afternoon and went off to his writing. Igor looked at her across the table. “Shall we continue?” “Yes,” she said with relief, rising and making for the stairs. That night, as she joined Kraus in bed, he turned to her. “What are you doing with Igor?” “We’re running some experiments.” “On what?” She looked at him. Kraus had never shown any interest in her science before. “Do you really want to know?” He opened his mouth, then closed it again, looked away. “Look, I appreciate you trying to be nice to my family, but you don’t have to try this hard. I know that they’re…” He trailed off. “Kraus, they’re lovely,” she said, resting her hand on his thigh. “They’re weird!” He waved her off when she opened her mouth to protest. “I know, they’re my family. And I thought you should meet them. And thank you for being so kind to Igor, but you don’t have to spend time in the lab. It’s fine to just read by the fire.” “Kraus,” she said, reaching to lift his chin to look at her. “Kraus,” she insisted, when he tried to duck away. “I had fun today. I’ve had a question that’s been bothering me. We’re rolling up our sleeves and trying to get some preliminary answers.” “Are you going to spend all tomorrow in the lab, too?” “Of course not! It’s Thanksgiving!” She smiled. “We’ll run down and split our cultures at some point, but I imagine we’ll all be busy cooking.” Kraus looked like he wanted to protest. “It’s okay, Kraus. I’m glad you brought me.” He sighed. “Okay. Good night.” “Good night.” She slipped out of bed the next morning, leaving Kraus sleeping again, and emerged to find Igor already up, slurping coffee and sharpening knives. He poured her a cup without comment and resumed working on a carving knife. “Matthew will be back shortly and make breakfast, then we’ll get started on the stuffing,” Igor told her once she had taken a large gulp of coffee. “I’ll start breakfast if he’ll be back in the next ten minutes.” “Let Matthew make breakfast, Miss Rose. He would be disappointed if he didn’t get to. But if you would cut bread crumbs?” He proffered a serrated knife and gestured to two loaves of bread on the counter. Matthew returned, asked if everyone would like pain perdu, then started mixing milk and eggs when Rose and Igor acceded"
