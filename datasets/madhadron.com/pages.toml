title = "madhadron  - Sample from Monologue: A Comedy of Telepathy"
full_description = "Sample from Monologue: A Comedy of Telepathy Chapter 1 It began with a dream. Her eyes opened suddenly. She was sitting in an easy chair, a cheerful fire in the hearth to her left. I’m awake. Broadcast! Broadcast everything! Automatically she had already begun to do so as she had been taught. “Ah, you’re awake.” The dancing fire and the two lamps turned low on the mantel above it barely illuminated the room. She hadn’t seen the man sitting in the chair on the other side of the hearth. He leaned forwards, his face coming into the fire’s light. He’s so young. He can’t be more than twenty five. It was a pleasant face, a face she would have found agreeable asking her to dance at a party. She shook her head. Her mind wouldn’t quite focus. But still she broadcast. “Before you exhaust yourself, there is a telepathic damper on this whole keep. I am not a telepath, but it was checked by one and appears to be functioning. There is also a telepathic perimeter, so for your sake please don’t try to escape. There are no other nobles here, so there will be no occasion for it to be deactivated.” Her mind whirled. This was a prison specially constructed for her. But where? She might be able to signal visually. “As you will see in the morning from the windows, this keep overlooks the sea on one side and fens as far as the eye can see on the other. You are a prisoner here, and I am your jailor.” He gave a wry smile. It was a smile she would have felt compelled to return under other conditions. “And how long will I be held here?” she asked. “Until further notice. A couple of months is what I was told. During that time, please treat the keep as if it were your own. The library two floors above is decent. The staff will see to your meals. We even have hot running water.” He stood. “I imagine you are still rather discomfited from being drugged and from the journey. I have had the maids lay out a light meal in the room above this, and linens for a bath. For my part, I am going to bed. You can find me in the office above the main gate in the morning if you have need of anything.” She wanted to chase down his lithe form and demand to know why she was being kept here, where she was, but her body responded clumsily as she pushed herself from the chair. By the time she had sorted out her legs, the door had closed and he was gone. It’s the aftereffects of the drug they used on me, she told herself. What would it have been? She would have used chloroform for the kidnapping, then prosperity flower extract to keep her under. Focus, she commanded herself. He claimed there is a telepathic damper. That seemed true. She should have gotten some response with her broadcast if there weren’t. I’m hungry, thirsty, tired, and none too clean. He had said there was food upstairs, and a bath. Would the food be drugged? She sat and tried to collect her thoughts. A couple of months, he had said. The only thing she was involved in which had both the right time table and enough importance to justify putting her out of the way was the wrangling over an oligarch seat. She was too well connected, particularly in the church, to be killed or misused, or even hidden much longer than that. It was a waiting game. If there were really a telepathic perimeter around her prison, she would be unconscious as soon as she stepped into it, and stay that way until a commoner or a nontelepathic noble pulled her out again. There was no reason to drug her, she concluded. Her stomach growled. She stood, more steadily this time, and took one of the lamps from the mantel. She turned the key at its base and the light glowed more strongly through the frosted glass. What is that cluster of furniture over there? Never mind, wait until morning. Those are windows, so I shan’t be in darkness forever, and that appears to be a spiral staircase. A keep, he had called it, and the heavy masonry of the stairwell seemed to agree. Halfway around the staircase’s spiral was another small window looking out on blackness. She paused and felt for a latch. It opened effortlessly, and the smell of salt and the sound of breakers far below wafted in to her. That was a bad sign. It sounded like the keep was atop a cliff. The seashore was flat and sandy anywhere in the central lands around the capitol. It only rose into cliffs far to the northeast. She was a long way from home. She shut the window and climbed again. The light of her lamp fell across a landing, and into a room beyond. Peering into the dimness, she discerned what she took to be a large, canopied bed and a table with irregular shapes on it. My meal, I imagine. A few steps closer and the light confirmed it. Other thoughts vanished. She sank into a chair at the table, pausing only long enough to set the lamp down, before falling upon the food. It was light fare—thin slices of bread with a light colored spread she barely tasted as she wolfed them down, a bowl of broth, a dish of pureed apples—but when it was gone her mind felt clearer and her body stronger. She looked down at the light blue dress she had been wearing when she was seized. She sniffed it. The promised bath was the next order of business. And with that thought, she realized perhaps she should stop broadcasting. The dream continued, silent and dark, a monologue of her musings. How big is the staff here? Can I suborn one of the servants? Best to try to get messages out, rather than escape myself. There was a moment of stunned silence, followed by, My clothes! They brought my clothes! My maid must have been part of this. Finally after much irascible grumbling about treacherous servants, Well, good night to anyone who can hear. Though with a telepathic damper, I suppose I’m talking to myself. The dream was still vivid when Joseph opened his eyes in the first light of dawn. He rolled off his cot, pulled on his trousers, and climbed down the ladder to the main room of his house. A few moments coaxed the fire to life in his tiny stove, and he stepped out into the cool morning air. On the way back from the outhouse he paused to look across the fields to the big house, then at the pink suffusing the sky over the forest behind his dugout. Then turning to his door, he went in, whistling. He whistled as he filled the kettle and put it on the stove, whistled as he measured out tea and oats for his breakfast, then paused when the woman’s voice from last night cried, Will you stop that! “Pardon me?” What kind of ass whistles before dawn? Then after a momentary pause, You can hear me! Thank heavens! I need you to go to—wait, are you in the capitol? I would think a monologue in my own head would know that I have never been to Nevintown. Though if I’m answering you, I suppose we constitute a dialogue. Cute, but you can at least go to the constabulary and tell them I’ve been abducted. Have you now? And why would the constabulary care about a voice in my head being abducted? Not that your timing isn’t excellent, since I promised Jeb to go into town with him today anyway. The kettle whistled, and he poured hot water into his mug and over the oats in his bowl, then carried them both to the small table. Jeb? Go into town? Where are* you?* A slight pause. As he was about to answer, she responded as though he had. Westfield? And you live in a one room house with a dirt floor! In disgust she added,* He probably can’t even read.* Of course I can read, he answered, irked. He heard that? You heard that? There was a touch of panic in the tone. Of course I heard that. It would be strange if I didn’t hear everything voices in my head chose to say to me. They do have rather unfettered access to my attention. Nonsense spilled through his mind as he spooned honey onto his oats, partial exclamations, suddenly chopped off. After a sip of tea, he finally said, Control yourself, voice, or I’ll have to drown you out. There was an impression of disbelief and annoyance. Very well. I know how to deal with this. “Give me wit and silvered tongue, equal to my tale…’ The Omnighastiad? the voice flared in surprise. Well, he can’t know more than a few lines. Joseph smiled slightly, and complacently spooned oatmeal into his mouth. “…Let me remember from the start, when that great man, strong, well traveled, trained, and cunning in deed, that Lord Omnighast, Did hear the call of sundry men to take up doleful arms And lead them massed to the darkest north…’ The roaring lines overwhelmed the occasional cries of protest that echoed in his head. Chapter 2 Joseph didn’t pause in his recitation as he crossed the fallow field to the main house. The two draft mules were in the harness, craning their heads to look at the porch, where a plump woman with a wicker basket in her hand was haranguing an ox of a man. Joseph pulled himself quietly onto the porch at the side of the house, unnoticed except by the mules, and kissed the woman on the cheek while relieving her of the basket. “Good morning, mother,” he said warmly. “And you’ve packed us lunch!” “Of course I’ve packed you lunch, Joseph. I was telling Jeb—” He smiled and nodded with the ease of long practice as he thought, “The heralds, at his command, went forth with braided, flowing locks, and claiming hospitality from yeomen on the way, went forth to the neighboring lands to bear Omnighast’s command Which bid them arm themselves anew, and mass and march to him… Joseph slipped the basket into Jeb’s hand and gave him a little push toward the wagon. Jeb moved his bulk unobtrusively down the steps and lithely jumped up to the wagon seat. Joseph nodded as his mother discussed once again the size of rope their father needed, then headed her off when she came again to the question of calico. “Now mother, are you sure about the calico? You know there’s unlikely to be a high thread count in stock this time of year, and you remember how Jeb wore holes in that shirt two years back.” He turned to Jeb for confirmation, while thinking, “From Omnighast’s seat in Nevintown, Belan, that swift herald, Took the great highway west, pausing only to give his news,’ “He doesn’t seem to have done this one much harm, though.” He led her off the porch and hopped up on the seat to finger the material of Jeb’s shirt. Jeb and the mules regarded him expressionlessly, and the voice in his head cringed as he began the enumeration of Belan’s stops: “in Dorcas, the spinner’s town, where the weavers paused their work in Allen’s Cross, where the roads meet, and the miners bring their wares…’ “That’s true. If there’s no good calico, best see if they have some linen that Jeb might not go through too easily, though he does prefer cotton.” “in Idle Bend, that white gem, sprawled along the river, and pausing only to tell his tale, he crossed the ancient bridge, That monument on the Idle, and left its verdant banks…’ “We’ll see to it.” Joseph subtly elbowed his brother, who equally subtly tapped the mules with the reins. The mules reluctantly put their heads forward, snorted at each other, and started off. Their mother’s advice continued, while they called back an occasional, well practiced, “Yes’m” or “No’m,” and Joseph with particular relish recited, “Onto the golden plains of Westfield, the protected grain land.’ “And Joseph, mind you don’t let those shop women swindle your brother!” was her final shout, which elicited another “Yes’m” as the cart turned onto the provincial road. At this point the voice in his head cried, Enough! I apologize! And combined with you yes’m’ing and no’m’ing your mother, I’m about to die laughing. Very well. Now, monologue, why are you still with me since I woke? First of all, I am not a monologue in your head. I am a very abducted noblewoman. You don’t sound particularly distressed, Joseph told her. I would appreciate it if you showed at least some instinct to spring to my rescue, she replied acerbically. “And having cried his warlike tale on Westfield’s peaceful roads…’ Spare me! We’re coming to the end of book one, and I particularly dislike book two. Why book two? Joseph tried to ask innocently. Your thoughts leak as well as mine, you know, she told him, smugly. You just quoted, “From peaceful Westfield levies came, seven divisions Untried and young, with hope and valor, bearing light arms…’ with as much fatigue as I feel trying to plow through that catalog of troops. That’s all book two is! A catalog of troops. After all, who cares about light arms? Don’t knock light arms. They got my father a land grant after he retired from the army. You’re a soldier’s son? she asked in surprise. Well, I’m certainly no nobleman. Jeb spoke, an unusual thing. Often they would pass the entire drive into town in comfortable silence. The voice in his head laughed at Joseph’s feeling of being set upon from all sides. “I had a strange dream last night, little brother.” Jeb paused and looked down at the reins. “I dreamt Bessie was foaling.” “Jeb, Bessie is your fiancée, not your horse,” Joseph said distractedly. “Women give birth, they don’t foal.” “I know that, Joseph,” reproved Jeb. “But she was foaling. And the little creature came out right and proper, and staggered up to its feet.” He considered the reins again. “It was a fine little filly.” “Why are you telling me this, Jeb?” “Well, brother, as father always says, you’re quicksilver to my clay. I figured you might know what to make of it. It was rather disturbing seeing my girl give birth to a horse. I wasn’t sure whether to go wrestle that stallion of her father’s until he confessed, or wipe the foal down with straw.” Quicksilver and clay? she asked. My father always says he spent his material producing a son in his image, and the rest of his children were elementals: clay, quicksilver, and fire. Who’s fire? My little sister has a temper, he told her, as an impression of a thin, black haired girl in a dire rage passed through his mind. Then, to Jeb, “Have you been thinking on starting a family of your own?” “Well, yes—” he admitted. “And how many human births have you attended?” “Well, now, none—” “And how many foalings, calvings, and lambings?” “Quite a number, Joseph. I would be hard pressed to count.” Jeb had a way with animals, and sitting up with mares near their time or spending nights in cold pastures in lambing season fell to him more often than not. “I’d say your mind just filled in a familiar event in a daydream, that’s all.” Joseph had an idea to distract him. “Look on the bright side. It was a fine filly, you said? Think about what kind of daughter you might call”fine’.” And be glad your dreams don’t wake up with you, he added silently. I am not your dream! Look! Joseph’s mind reeled at the double vision as a second set of sounds, sights, and smells assailed him. She was leaning on the stone sill of her high window, looking out over the cliffs at the roiling sea. Low storm clouds scudded overhead as a squall, its lightning just visible on the horizon, raced toward the shore. She turned at a knock on the door. “Come,” she called. The handle turned and"
