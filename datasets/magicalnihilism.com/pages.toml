full_description = "100 years of The Shipping Forecast, 15 years of making things celebrating it… January 4, 2025 moleitauLeave a comment Shipping Forecast Rosary The Shipping Forecast is celebrating its centenary. I’ve always loved this very British “accidental slice of nonsense poetry” About 15 years ago, I did a little project to make a ‘rosary’ for what is often referred to as a ‘secular prayer’. Shipping Forecast Rosary – South East Iceland Each of the forecast’s regions are represented in laser-cut marine plywood, and strung – in the order of the broadcast – to be thumbed through as you listen. Shipping Forecast Rosary – German Bight It was a very quick idea but I’ve always loved it – and it seemed to resonate with a few folks. Perhaps I’ll re-issue it for the centenary over at http://magpieprint.works? I also did another quick Shipping Forecast inspired piece for a newspaper the now-defunct cycling brand Vulpine put out back in 2013. This attempted to create alternate coastlines from the shipping forecast areas. I’m less happy with the execution here, but it’s still a fun idea. Might be more satisfying as something playable, generative – perhaps it has a future as a code experiment with an LLM’s assistance… However – my favourite Shipping Forecast associated project is Matt Brown’s beautifully simple and evocative typography piece that still has pride of place on the wall. Books read in 2024, with a highlight each January 2, 2025 moleitauLeave a comment Green Mars, Kim Stanley Robinson “Look at the pattern this seashell makes. The dappled whorl, curving inward to infinity. That’s the shape of the universe itself. There’s a constant pressure, pushing toward pattern. A tendency in matter to evolve into ever more complex forms. It’s a kind of pattern gravity, a holy greening power we call viriditas, and it is the driving force in the cosmos. Life, you see. Like these sand fleas and limpets and krill—although these krill in particular are dead, and helping the fleas. Like all of us,” waving a hand like a dancer. “And because we are alive, the universe must be said to be alive. We are its consciousness as well as our own. We rise out of the cosmos and we see its mesh of patterns, and it strikes us as beautiful. And that feeling is the most important thing in all the universe—its culmination, like the colour of the flower at first bloom on a wet morning. It’s a holy feeling, and our task in this world is to do everything we can to foster it.” The Star Builders: Nuclear Fusion and the Race to Power the Planet, Arthur Turrell “Deuterium–tritium fusion, the kind of fusion that most star builders are doing, releases ten million times the amount of energy per kilogram as coal. Ten million. If you had a fusion reactor in your house, you’d have to go to the deuterium-tritium shed once for every ten million times you went to the coal shed. What this means is that the mass of a single cup of water contains the equivalent energy of 290 times what the average person in the US uses each year. The mass of an Olympic swimming pool contains an amount of energy in excess of total world annual energy use.” Light, M. John Harrison ‘I don’t want you to understand it, Ed. I want you to surf it.’ The Weather Machine: How We See Into the Future, Andrew Blum “…even the most complex systems are still built by people; they exist in real places and evolve according to some human intention.” The Overstory, Richard Powers “People aren’t the apex species they think they are. Other creatures—bigger, smaller, slower, faster, older, younger, more powerful—call the shots, make the air, and eat sunlight. Without them, nothing.” Blue Mars, Kim Stanley Robinson “‘It’s going to be all right,’ he said, looking at as many of them as he could. ‘Every moment in history contains a mix of archaic elements, things from all over the past, right back into prehistory itself. The present is always a melange of these variously archaic elements. There are still knights coming through on horseback and taking the crops of peasants. There are still guilds, and tribes. Now we see so many people leaving their jobs to work in the flood relief efforts. That’s a new thing, but it’s also a pilgrimage. They want to be pilgrims, they want to have a spiritual purpose, they want to do real work – meaningful work. There is no reason to keep being stolen from. Those of you here who represent the aristocracy look worried. Perhaps you will have to work for yourselves, and live off that. Live at the same level as anyone else. And it’s true – that will happen. But it’s going to be all right, even for you. Enough is as good as a feast. And it’s when everyone is equal that your kids are safest.” How Infrastructure Works, Deb Chachra “There is a possible future for humanity where we have stabilized our climate, where everyone has the energy and resources that they need to survive and thrive, where we get to connect with each other in myriad ways. I get to use “we” in the best possible way, meaning all of humanity. Running the numbers and realizing exactly how abundant renewable energy is, and then realizing how close we are to being able to harness it—it’s an absolute game changer. We’re accustomed to thinking about making the transition away from fossil fuels to renewable sources as one that we are doing under duress, making a sacrifice to stave off disaster. But that’s not what we’re doing. What we’re doing is leveling up. We—you, me, anyone who is alive today—we have the opportunity to not just live through but contribute to a species-wide transition from struggle to security, from scarcity to abundance. We can be the best possible ancestors to future generations, putting them on a permanent, sustainable path of abundance and thriving. And we can do it for all of our descendants—all of humanity—not just a narrow line. But we can only do it together, and we still need to figure out how to get there.” In Ascension, Martin MacInnes “It’s a miracle the weeds push up. Where is their sustenance, what are they feeding on? They see them only on the roads, by the mast towers, and on the airport runway where they landed. It is as if they thrive on provocation, rising up only when they have something to tear down. They are impish and morbid and embittered and they sort of love them. On the black rubble beaches, on the lower hillsides, they linger; they sit back, wait for the hubris of industry.” The Unaccountability Machine: Why Big Systems Make Terrible Decisions – and How The World Lost its Mind, Dan Davies “I’ve often said in the past that if you don’t make predictions, you’ll never know what to be surprised by.” Nova Swing, M. John Harrison “Another of his favourites, even more puzzling to young men and women conditioned to seek answers, was, ‘Uncertainty is all we have. It’s our advantage. It’s the virtue of the day.’”"
