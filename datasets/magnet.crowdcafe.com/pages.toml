title = "Magnet – Window manager for Mac"
full_description = "Activated by dragging, customizable keyboard shortcuts or via menu bar, Magnet declutters your screen by snapping windows into organized tiles. Having multiple windows aligned neatly side by side eliminates app switching and greatly enhances multitasking. Fullscreen, halves, quarters & thirds. Up to six external displays supported. The potential combinations are endless. Drag windows to the corners and Magnet snaps them into quarters. Use side edges to arrange horizontal and vertical halves. Dragging to the top edge maximizes window size on a given screen. Bottom edge creates thirds. Slide on it to expand into two thirds. Create thirds along the sides on vertical display. Quarters and halves reside in the corners and on the bottom edge."
