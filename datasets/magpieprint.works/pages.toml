["https://magpieprint.works/pages/about-magpie-printworks"]
title = "About Magpie Printworks"
description = "Magpie Printworks designs, prints and sells short runs of screenprints. It is operated by Matt Jones, a designer based in South-East London. He produces the work at the wonderful Sonsoles Print Studio in Peckham, London. Matt began in print and design as a teenager in Porthcawl, South Wales, working at a local print sh"
full_description = ".section-template--22523385807113__main-padding { padding-top: 21px; padding-bottom: 21px; } @media screen and (min-width: 750px) { .section-template--22523385807113__main-padding { padding-top: 28px; padding-bottom: 28px; } } About Magpie Printworks Magpie Printworks designs, prints and sells short runs of screenprints. It is operated by Matt Jones, a designer based in South-East London. He produces the work at the wonderful Sonsoles Print Studio in Peckham, London. Matt began in print and design as a teenager in Porthcawl, South Wales, working at a local print shop after school and weekends. He installed and ran their first Macintosh SE30, Quark Xpress V1.0 and Laserwriter Plus. His dad Emrys was obsessed with Magpies and ran a framing workshop which the family lived above. One of his customers and friends was world-renowned lino & woodcut artist Paul Peter Piech. Magpie Printworks hopes to be a small tribute to both of them through the work."
year_published = 2025
