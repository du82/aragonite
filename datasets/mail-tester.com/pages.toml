["https://mail-tester.com/faq"]
title = "Frequently Asked Questions - mail-tester.com"
description = "Have a question about mail-tester.com? Find the answer here!"
full_description = '''We simply built on our own tool. Now we're sharing it for free via our web-interface and enable you to include our tests in your own app and whitelist our service by creating an account. Once done, click on the Check your score button and as soon as we receive your message, our snail will stop to give you your spam score. Mail-tester will analyze your message, your mail server, your sending IP... and show you a detailed report of what's configured properly and what's not. Your result will be accessible for 7 days with our free version or 30 days if you created an account and used your own prefix. If you send a new message to the same testing address, your previous test will be immediately deleted to be replaced by the new one. You can't. But you can do a lot to improve your chances, like getting a perfect score on mail-tester. It also depends on user preferences. For example, I hit on "this is spam" button in my Yahoo. But you don't. Yahoo will adapt to each person. Did you know that more emails are blocked than caught in a spam filter ? That means they disappear completely. If that's your case, the server you're sending from is most probably blacklisted. It's time to change your sending method. We have a vanilla install. In other words, it's an out of the box default installation.We reversed the score so a positive score is a good score and a negative one is bad. After the treehouse designed by our first awesome designer, we wanted to discover new lands and to travel across the seas just like an email travels across the web. We have an iframe and a JSON API which are both available with our paid plans so you can integrate mail-tester results into your own software. We'd like to see mail-tester in other languages. Please contact us to receive the latest version of your language file and help us improve it!'''
year_published = 2025
clearnet = "https://mail-tester.com/faq"
category = "SitesList"
