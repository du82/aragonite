["https://mail-tester.com/manager/api-documentation.html"]
title = "JSON API"
description = "Watch your spam test with the Mail Tester Manager"
full_description = '''First send an email to yourusername-whateveryouwant[at]mail-tester.com (yourusername should be replaced by your own username!) You can obviously replace "whateveryouwant" by everything you want... Please make sure it's an unique string so one test does not override another. Basically, after calling this url, Mail-tester will process the mail sent to the given email address and return a JSON object than you can exploit. Here is a short example of what you should execute to get the API result. This given example uses jQuery's function getJson but you can use whatever you prefer: If you don't want to waste time performing tests you don't need, you can add &test=key to get only specific tests. key must be replaced by one of our 5 main tests that are described in the structure part (for example &test=signature). Since Mail-Tester is providing a lot of information and we don't want you to be lost, we added a little that developers will love. If you replace &format=json by &format=dbug, you will indeed be able to visualize everything we return concerning your newsletter through a flexible interface. Want an example? Check this out! With this visualization, you can also click on the name of the variables (for example spamAssassin), to hide or display this part of the object. You can thus focus on certain aspects of the object that interest you. I told you, you're gonna love this. As you may have noticed, Mail-Tester provides quite a lot of information about your emails. Well the API includes everything on the result page and even more. Since we have implemented dBug in our API, the best way to have a good vision of what the API returns is to look at an example processed with dBug. So here is the result for one of our fabulous mail. If the variables' name are not clear enough for you, you can still take a look at our short sum-up about it. Six main sub-objects can be identified inside the main object. These sub-object are the same as the main categories on a classic Mail-Tester result page:'''
year_published = 2025
