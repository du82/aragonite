full_description = "If you call several times the same result without sending a new email, we will consider it as a unique test.If we do not receive your message, no credit will be removed from your account.If you send us an email but do not trigger the result page, no credit will be removed from your account (even if we don't know why you would do that...) There is no expiry date on your credits... Feel free to purchase a pack and perform tests until you don't have credits any more.You can refill your account at any time by purchasing a pack of credits. They will be added to your current number of credits left. We accept payments via Blue Card, Visa, Master Card, Amex and Paypal.None of your credit card information and/or Paypal account information are stored in any way on our website. Creating an account on our website will automatically give you some free tests so we consider you had the time to test our service and you know what you pay for.All purchases made through this website are final and there are no refunds."
