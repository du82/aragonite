ne komplette Kommunikationsplattform für alle Organisationen, die auf eine datenschutzkonforme Lösung setzen möchten. DSGVO-konform, Server in Deutschland Flexible Lösung, einfache Integration Offene Standards: kein Vendor Lock-in Zentrale Verwaltung für Admins & API-Schnittstelle E-Mail Der Kern unseres Services ist das professionelle E-Mail-Postfach. Übersichtlich, inkl. Kalender, Adressbuch und mit vielen Funktionen. Webmailer: keine Installation notwendig Einrichtung mit IMAP in E-Mail-Programmen möglich Inkl. Adressbücher und Kalender PGP und S/MIME im Webmailer Downloadlinks für große Anhänge Mehr erfahren Cloud-Speicher Im Cloud-Speicher sind alle Dokumente an einem zentralen Ort und immer erreichbar – wann und von wo Sie wollen. So einfach gehts: Dateien hochladen, verwalten und teilen. Und das Teilen ist besonders sicher, wenn Sie Dateien per Link mit Passwortschutz und begrenzter Laufzeit teilen. Upload per Drag & Drop Ideal für Kollaboration im Team Individuelles Rechte-Management Freigabe (optional mit Passwort und Ablaufdatum) PGP-Verschlüsselung aller Dateien möglich Mehr erfahren Office Erstellen und bearbeiten Sie jederzeit und von überall Ihre Dateien. Dokumente teilen und gemeinsam bearbeiten war noch nie so leicht. Das Online Office umfasst Textdokumente, Tabellen und Präsentationen. Läuft im Browser – ohne Installation Erstellen und bearbeiten Sie Dokumente, Tabellen und Präsentationen Arbeiten Sie online und direkt in Ihrem Cloud-Speicher Teilen per Weblink mit Gastzugang für den Empfänger Mehr erfahren Videokonferenzen Auf unsere Videokonferenzlösung können Sie sich verlassen: stabil und zuverlässig, basierend auf Open Source und gehostet in unseren Rechenzentren. So einfach wie ein Telefonat und dabei fast so nah wie ein persönliches Gespräch. Eigene Lösung: OpenTalk, die Videokonferenzlösung aus dem Hause Heinlein Support Läuft im Browser – ohne Installation Individualisierbar für Ihren Einsatz Inkl. vieler Funktionen Mehr erfahren Admin-Oberfläche & API Die Verwaltungsoberfläche für den Administrator Ihrer Organisation bietet eine Vielzahl an Informationen auf einem Blick. Darüber hinaus lassen sich hier die häufigsten Szenarien abdecken, wie Postfach einrichten, Tarife ändern und Passwörter zurücksetzen. Einfache Einrichtung der Firmen-Domains Übersichtliche Einrichtung der Mitarbeiter-Postfächer Steuerung der Features API-Schnittstelle Ihre Vorteile bei Business mailbox.org Account-Verwaltung, API-Integration, AV-Verträge nach DSGVO, Umzugsservice: So muss Business E-Mail-Hosting sein. Besonderheiten von mailbox.org Business So unterscheidet sich mailbox.org Business von einem privaten Postfach und Team-Postfach E-Mail-Adressen unter Ihrer geschäftlichen Domain Beliebige Nutzergruppen mit gemeinsamen Kalendern, Kontakten, Dateien & Co. Zentrale Accountverwaltung aller Ihrer E-Mail-Adressen und deren Einstellungen API zur Userverwaltung zur Einbindung in Ihre Prozesse oder Ihr Userportal Rechnungslegung mit Vorsteuerabzug, Lastschrifteinzug Priorisierter Support & Service bis hin zu 24/7 möglich Zentrale Verwaltung & API Behalten Sie den Überblick! Als Business Mail Kunde haben Sie Zugriff auf ein eigenes Verwaltungsinterface, mit dem Sie jederzeit alle Belange Ihres Mailhostings klären können. Zentrale AdministrationÜber einen zentralen Administrationszugang verwalten Sie Vertrag, Domains, Postfächer, Weiterleitungen, Passwörter, Speicherplatz und alle anderen Einstellungen der Accounts. Individuelle Einstellungen erlauben?Legen Sie fest, ob auch Ihre Nutzer individuelle Einstellungen bei Spamfilter, Backup und Speicherplatz (Quota) vornehmen dürfen, oder nicht. Groupware in NutzergruppenDefinieren Sie verschiedene Benutzergruppen innerhalb Ihres Accounts. Darüber lassen sich Groupware-Ressourcen wie Kalender, Kontakte und Dateien vereinfacht gemeinsam nutzen. API für ProfisPflegen Sie eine größere Umgebung und haben Sie eigene Verwaltungsprozesse? Oder möchten Sie als Reseller unsere Leistungen durch Ihr Kundenportal Ihren Nutzern zur Verfügung stellen? Sämtliche Einstellungen lassen sich zentral über unsere API ansprechen und damit bequem in Ihre Infrastruktur integrieren. Support & Service Je nach Service-Paket stehen Ihrem Account-Administrator unsere Spezialisten im Support per E-Mail-Ticketsystem oder am Telefon zur Verfügung – im Notfall sogar 24/7. Entscheiden Sie selbst, welches Support-Level Sie benötigen. 2nd/3rd -Level Supportmailbox.org übernimmt den 2nd/3rd-Level Support für Sie als Kunden bzw. Ihren Account-Administrator. 1st-Level Support je nach Postfach-TarifAuf Wunsch unterstützen wir Sie gerne beim 1st-Level-Support Ihrer Mitarbeiter. Bitte beachten Sie, dass dies nur in den Postfach-Tarifen STANDARD und PREMIUM möglich ist. Persönlicher AnsprechpartnerFür das Onboarding und vertragliche Fragen steht Ihnen, in den Service-Paketen Platin und Gold, Ihr persönlicher Ansprechpartner zur Verfügung. Vertrag & Rechnungslegung Als Geschäftskunde bleiben Sie bei uns flexibel: Flexible VertragsgestaltungE-Mail-Adressen können Sie tagesaktuell hinzu buchen oder auflösen. Tarife der Accounts wechseln Sie mit sofortiger Wirkung. Passen Sie den gebuchten Speicherplatz kurzfristig an und zahlen Sie nur, was Sie auch brauchen. Rechnungslegung für UnternehmenSie erhalten eine monatlicher Sammelrechnung, natürlich mit ausgewiesener Umsatzsteuer. Lastschrifteinzug ist möglich. Kurze KündigungsfristKeine Jahresverträge: Unsere Kunden sind bei uns, weil Sie bei uns sein wollen. Kurze Kündigungsfristen sind selbstverständlich. Beratung, Planung & Umzug Sie wissen noch nicht so recht, was für Sie sinnvoll ist? Sie haben bereits einen umfangreichen Datenbestand in der Cloud und scheuen sich vor dem Umzug? Egal ob Gmail, Office365, ein anderer Hoster oder sogar Ihre eigene Lösung: Professionelle Hilfe steht bereit. Vor, während und nach dem Umzug. Support für Sie und Ihren AdministratorWas ist möglich, was ist sinnvoll, was ist machbar? Als Business-Kunde steht Ihnen schon im Vorfeld ein persönlicher Ansprechpartner bei uns zur Verfügung. Er klärt mit Ihnen alle Fragen und kümmert sich um die Koordinierung Ihres Einzugs bei uns. Umzug mit AudrigaUnser Partner Audriga übernimmt den automatisierten Umzug der bisher gespeicherten Daten aller Accounts: E-Mail, Kalender, Kontakte und sogar Dateien aus Ihrem Cloud-Storage. - Umzug deluxe: Wenn Sie Ihr neues mailbox.org Office betreten, sind die Schränke schon eingeräumt. Hilfe bei der Einrichtung?Fragen zu Apps, zur Softwareauswahl oder zu Nutzungsmöglichkeiten und Vorgehensweisen? Einer unser Systempartner betreut gerne Ihr Onboarding und nimmt Sie und Ihre Nutzer auch bei der individuellen Softwareeinrichtung an die Hand. Höchste Sicherheit für Ihre Privatsphäre bei mailbox.org Damit Privates privat bleibt. Alles, was geht, wird gemacht. Bei uns können Sie nicht nur Ihre E-Mails direkt im Webmailer mit PGP verschlüsseln, sondern auch Ihr gesamtes Postfach. Dabei müssen Sie kein IT-Sicherheitsexperte sein. Das sind wir von mailbox.org. Unsere langjährigen Experten schützen Ihre Daten auf unseren Systemen. Auch deshalb betreiben wir mailbox.org nicht auf angemieteten Servern, sondern mit eigener Infrastruktur redundant in unseren Berliner Rechenzentren. Mit unserem Angebot konnten wir auch das Bundesamt für Sicherheit in der Informationstechnik überzeugen. So tragen die Tarife PREMIUM, STANDARD und LIGHT das IT-Sicherheitskennzeichen des BSI. Sicherheitsmerkmale Professioneller Spam- und Virenschutz PGP-Verschlüsselung im Webmailer via mailbox.org Guard oder Mailvelope Eigener PGP-Key-Server S/MIME im Webmailer Nutzung modernster Crypto-Algorithmen Einsatz von Perfect Forward Secrecy (PFS), DNSSEC und DANE/TLSA Im Webmailer integrierter TLS-Checker Weitere Infos über die Sicherheit bei mailbox.org Mustergültiger Datenschutz nach DSGVO/GDPR Mailhosting bei mailbox.org: vertrauenswürdig für Ihre Kunden, rechtlich sicher für Sie, selbstverständlich für uns. Datenschutz und Auftragsverarbeitung bei mailbox.org Wir von mailbox.org nehmen Datenschutz sehr ernst. Schon seit 1992 haben wir uns auf den sicheren Datenaustausch und den Schutz der Privatsphäre spezialisiert. Datenschutz ist für uns also kein lästiges Übel, sondern seit jeher politische Überzeugung, Aufgabe und Mission. Wenn Sie als Auftraggeber E-Mail-Postfächer Ihrer Mitarbeiter oder Daten Ihrer Kunden bei einem Provider ("Verarbeiter") speichern, müssen Sie diesen Provider durch einen Auftragsverarbeitungs-Vertrag ("AV-Vertrag") datenschutzrechtlich besonders verpflichten. Mit der Einführung der DSGVO im Mai 2018 sind die Anforderungen - und auch möglichen Strafen bei Nichteinhaltung für den Auftraggeber! - noch einmal deutlich gestiegen. Bei mailbox.org sind AV-Verträge selbstverständlich: In Ihrer zentralen Accountverwaltung können Sie online einen AV-Vertrag mit uns abschließen und sind mit wenig Aufwand rechtlich sauber. Zeigen Sie Ihren Kunden durch den Einsatz von mailbox.org, dass Sie Datenschutz ernst nehmen und auch tatsächlich leben. Und wenn Ihnen die nächste Datenschutzprüfung ins Haus steht, haben Sie ein ruhiges und gutes Gewissen. Geschäftskundentarife Zahlen Sie nur für das, was Sie wirklich brauchen und buchen Sie flexibel und individuell nach Ihrem Bedarf. Unsere Geschäftskundentarife im Überblick Ganz nach Ihren Anforderungen: Als Geschäftskunde wählen Sie die Anzahl der benötigten Postfächer und kombinieren diese mit dem passenden Service-Paket. Der LIGHT-Tarif eignet sich z.B. Ideal für Sammelpostfächer. Die Tarife STANDARD und PREMIUM bieten Ihren Mitarbeitern alle Funktionen für den produktiven Arbeitsalltag. Darüber hinaus übernehmen wir auf Wunsch den 1st-Level-Support. Für PREMIUM-Postfächer bieten wir Telefonsupport an. In allen Service-Paketen erhält Ihr Account-Administrator Support per E-Mail-Ticketsystem, im Platin-Paket bieten wir Ihnen eine 24/7 Notfall-Hotline an. Business-Kalkulator 1 E-Mail-Postfächer wählen Wie viele Postfächer mit welchem Lei