["https://mailbox.org/de/unternehmen"]
title = "Unser Team, unsere Geschichte, unsere Überzeugung | mailbox.org"
description = "E-Mail Anbieter ► E-Mail, Datenschutz, Security sind unsere DNA ✓ sichere, freie und unüberwachte Kommunikation ✓ Jetzt informieren ▷ Wir freuen uns auf Sie"
full_description = 'Unsere DNA: Datenschutz, Security und E-Mail Hinter mailbox.org steht das Berliner Familienunternehmen Heinlein Support GmbH, dessen Ursprünge bis ins Jahr 1992 zurückgehen. Geschäftsführer Peer Heinlein übernahm damals als Jugendlicher den heute noch existierenden Internet-& E-Mail-Provider JPBerlin, den er 2004 in die Heinlein Support GmbH eingliederte. Das Team von Heinlein Support hat heute über 30 festangestellte Mitarbeiter und zählt zu den bekanntesten und gefragtesten Netzwerk-, Linux- und E-Mail-Spezialisten in Deutschland. Wir betreuen die Administratoren tausender Unternehmen und auch zahlreicher (E-Mail-) Provider im persönlichen Linux-Consulting, im Notfall-Support, mit Schulungen an unserer Heinlein Akademie oder durch anspruchsvolles sicheres Server-Hosting in unseren Rechenzentren. Die Gründung von mailbox.org Im Zuge der Snowden-Affäre 2013 fiel die Entscheidung, einen neuen E-Mail-Dienst ins Leben zu rufen, der in Sachen Datenschutz und Sicherheit neue Maßstäbe setzt. Wir überarbeiteten unser langjähriges E-Mailhosting von JPBerlin.de und brachten es Anfang 2014 unter der neuen Marke mailbox.org komplett eigenfinanziert an den Start. mailbox.org steht seitdem für sichere, werbefreie, anonyme und trackingfreie E-Mail-Postfächer für Privat- und Geschäftskunden. Mit der Summe unserer Features sind wir eine echte Alternative zu den werbefinanzierten, datensammelnden und nur scheinbar kostenlosen Angeboten der großen Konzerne. Das zeigen auch unsere zweistelligen Wachstumszahlen in den letzten Jahren. Heute beschäftigt sich ein Großteil des Teams fast ausschließlich mit dem Betrieb und der Weiterentwicklung von mailbox.org. Sei es im Kunden-Support, in der Administration der Plattform, im Hosting der Server, der Programmierung und Implementierung neuer Features oder im Produktmanagement und Marketing. Und auch unsere erfahrenen Linux-Consultants packen bei mailbox.org immer wieder mal mit an.Mit vielen neuen und ungewöhnlichen Ideen gehören wir zu den Innovationstreibern in der Branche und erfinden „E-Mail-Sicherheit“ regelmäßig neu. Viele von uns entwickelte Features wurden zwischenzeitlich von Mitbewerbern übernommen. Besonders freuen wir uns über zahlreiche Testsiege und Auszeichnung. So wurden wir zweimal in Folge mit der Note SEHR GUT Testsieger der Stiftung Warentest unter 15 getesteten E-Mail-Diensten im Jahr 2015 und 2016. Peer HeinleinGeschäftsführer Seit über 25 Jahren ist Peer Heinlein im Geschäft und gefragter Mailserver- und Linux-Spezialist. Seine bislang sechs Fachbücher gehören zu den Klassikern der Branche. Als studierter Jurist und ehemaliger Journalist, ist für ihn eine freie und gleichberechtigte Kommunikation die Grundlage für Demokratie und Menschenrechte. Ein sicheres, datenschützendes E-Mail-Angebot wie mailbox.org liegt ihm darum besonders am Herzen. Wir verstehen unser Handwerk Wir betreiben unsere Dienste nicht auf extern angemieteten Root-Servern, sondern besitzen eine eigene IT-Infrastruktur unter unserer Kontrolle. Unsere Server laufen parallel in zwei verschiedenen Rechenzentren sowie einem weiteren Datenspeicherort in Berlin. Rund um die Uhr sind zwei Admin-Teams parallel im Einsatz und haben direkten, alleinigen Zugriff. Mit über 15.000 Messwerten überwachen unsere Administratoren kontinuierlich alle Dienste unseres Unternehmens. Aus Sicherheitsgründen setzen wir technisch ausschließlich auf Open Source-Komponenten. Wir sind mit unseren Rechenzentren mit Ökostrom versorgt, für weltweiten Datenaustausch direkt am BCIX angebunden, georedundant unabhängig. zurück nach Oben 25 Jahre sichere E-Mail:Unsere Geschichte E-Mail-Server und Verschlüsselung ziehen sich als roter Faden durch unsere Unternehmensgeschichte. 1989 Am 5. Juli 1989 geht’s los: Die Junge Presse Berlin e.V., ein Verbund von Schülerzeitungsredakteuren, gründet die „Mailbox JPBerlin“, um sich gegenseitig Nachrichten schicken zu können. Den Begriff Internet-Provider gab es damals noch nicht. Startkapital: Ein 2.400 baud-Modem, ein 286er Rechner mit immerhin 256 Kbyte RAM und ein Bernstein-Monitor. Ein Jahr später stößt Peer Heinlein mit seinem 300 baud Akkustikkoppler zu dem Projekt dazu. 1992 Als Jugendlicher übernimmt Peer Heinlein für den Verein die „Mailbox JPBerlin“, ist der verantwortliche Administrator (damals noch SysOp - System Operator genannt) und baut sie fortan in eigener Verantwortung aus. Die JPBerlin erhält einen 386er Rechner mit 512 KByte RAM und 20-MByte-Festplatte, sowie ein mit 19.200 baud wirklich unsagbar schnelles Modem nach dem Protokoll “Turbo-PEP”. 1993 Peer Heinlein und andere engagierte Mitstreiter bieten für verschiedene Träger systematisch Internet-Anwenderschulungen an. Wichtiger Schulungsinhalt: Richtig mailen, richtig zitieren, richtig die Suchmaschine benutzen. Wenig später wird stets auch der richtige Einsatz von PGP-Verschlüsselungssoftware zum elementaren Schulungsinhalt erhoben, denn PGP-Verschlüsselung war damals eine Selbstverständlichkeit. 1994 Aufgrund glücklicher technischer Fügung kann sich die JPBerlin über eine (damals sagenhaft schnelle) 128 KBit-Standleitung mit anderen Systemen vernetzen. Viele Gegenstellen gibt es nicht - wir unterhalten Verbindungen zum IN BErlin e.V. und zur Freien Universität Berlin. Das Internet entsteht und beginnt sich zu knüpfen. Die JPBerlin bietet als einer der ersten Internet-Einwahlzugänge für normale Menschen an. Anfangs mit Modem, später mit ISDN auf immerhin 32 Telefonleitungen. DSL gab es noch nicht. Außerdem revolutionär: Wir können für jedermann Webseiten hosten. Von unserer eigenen Webseite haben wir leider nur noch eine spätere Kopie mit Stand 1998 in den Archiven gefunden. Während andere Systeme noch einmal täglich per Telefonanruf Nachrichten austauschen, können wir in Echtzeit zu anderen Systemen im Internet senden und empfangen. Die JPBerlin wird aufgrund ihrer guten Infrastruktur und Größe einer der zentralen Verteilerknoten für viele der anderen Mailboxen in Berlin, für die wir Nachrichten weiterleiten. 1995 In Deutschland werden ISDN-Anschlüsse flächendeckend verfügbar und lösen alte analoge Telefonleitungen langsam ab. 1998 Nicht zuletzt auch durch die zahlreichen AOL-Gratis-CDs werden Spam-Mails zum ersten Mal ein Problem. Die JPBerlin ist einer der ersten Provider, der alle E-Mails nach Spam und später auch nach Viren filtert. Die Büroräume werden als Rechenzentrum umgerüstet. Als Kunden gewinnen wir in den Folgejahren viele sozial, ökologisch und politisch engagierte Einzelpersonen, Vereine und Organisationen. Auch NGOs wie Attac, Ärzte ohne Grenzen, Arbeitskreis Vorratsdatenspeicherung, Wikimedia und X1000malquer nutzten und nutzen die Kommunikationslösungen der JPBerlin erfolgreich für ihre Arbeit. Google wird gegründet und löst Yahoo als wichtige Suchmaschine ab. 2002 Peer Heinlein veröffentlicht das erste Mailserver-Fachbuch: Das Postfix-Buch. Es wird sich später zum Standardwerk für Postmaster entwickeln und in der 3. Auflage 1.000 Seiten umfassen. Schon in der ersten Auflage warnte Peer Heinlein vor umfassenden elektronischen Abhöraktionen amerikanischer Geheimdienste, die damals im Rahmen des Echelon-Projektes umfassend Satellitenkommunikation auch von Bad Aibling in Deutschland aus abhörten. 2004 Aufgrund des Wachstums wandelt sich die Rechtsform des Unternehmens im Mai 2004 in die “Heinlein Professional Linux Support GmbH” (ab 2012: „Heinlein Support GmbH”). Das Unternehmen zieht mit damals 5 Mitarbeitern an seinen heutigen Standort in Berlin Prenzlauer Berg. Die Server werden in ein professionelles Rechenzentrum umgezogen. Heinlein Support ist in der Branche für sein langjähriges Linux- und Mailserver-Fachwissen bekannt, zeichnet im Laufe der Jahre für Tausende von Server-Installationen verantwortlich und hat bis heute über 4.500 langjährig zufriedene Kunden. Die JPBerlin wird als einer von mehreren Geschäftsbereichen von der GmbH betrieben. Nicht der gewinnbringenste — aber der Bereich, der uns politisch am wichtigsten ist. 2013 Die Entwicklungen rund um Snowden und die NSA-Spionage lassen uns mit den Arbeiten zu einem neuen Provider beginnen: mailbox.org. Edward Snowden sagte damals im Guardian Chat: „Starke Verschlüsselung ist das Einzige, worauf Sie sich verlassen können.“ — Zeit, diesen Grundsatz umfassend anzugehen. Die Erfahrung, das passende Team von mittlerweile 20 Kollegen, die notwendige Technik in unseren eigenen Rechenzentren und die innere Motivation haben wir und sind innerhalb von 3 Monaten startklar. 2014 mailbox.org geht am 20. Februar als werbefreier, sicherer, datenschützender E-Mail-Anbieter an den Start. Unser Feature des „Verschlüsselten Postfachs“ ist die Innovation am Markt, die Verschlüsselung für jedermann einfacher und konsequenter nutzbar macht. Neben E-Mail bieten wir auch einen Webmailer mit umfangreichen Funktionen sowie einen Dateispeicher. Damit sind wir eine massentaugliche Alternative zu den großen Konzernen. Im Dezember 2014 öffnen wir unser Angebot für Geschäftskunden. Egal, ob Arztpraxis, Steuerbüro oder Mittelständler aus dem Technologie-Sektor. Sensible Daten gilt es überall zu schützen. 2015 Testsieger! Im Januar 2015 wird mailbox.org (zusammen mit einem Mitbewerber) Testsieger der Stiftung Warentest. Getestet wurden insgesamt 14 E-Mail-Dienste. Wir freuen uns riesig, dass Sicherheit & Privacy derart in den Fokus der Öffentlichkeit gelangt sind, dass ein solcher Schwerpunkt überhaupt in einen derartigen Test einfließt. Das wäre vor wenigen Jahren noch undenkbar gewesen. mailbox.org führt den mailbox.org Guard ein — die erste vollwertige PGP-Verschlüsselung im Webbrowser. Außerdem erfinden wir den TLS/DANE-Checker, eine Anzeige im Webmailer, die transparent macht, ob die empfangende E-Mail-Adresse den Versandweg verschlüsselt. 2016 Wir nutzen das Jahr um in allen Bereichen noch besser zu werden. Die Weboberfläche erfährt ein größeres Update und wir führen neue Sicherheitsfeatures ein (z.B. One-Time-Passwörter, eigener PGP-Keyserver). Stiftung Warentest kürt mailbox.org zum zweiten Mal in Folge zum Testsieger: Das Qualitätsurteil lautet: SEHR GUT (1,4). Spitzenreiter werden wir bei „Schutz und Privatsphäre“ unserer Nutzer (sehr gut, 1. Platz im Testfeld mit der bestmöglichen Note 1,0) und auch bei Handhabung („gut“) und Funktionalität („gut“) liegen wir mit Bestnoten ganz vorne. 2018 Ein neues Logo und ein kompletter Webseitenrelaunch verändern das Gesicht von mailbox.org. Das neue Design ist ansprechender und moderner, und öffnet mailbox.org so für eine größere Zielgruppe im Privat- und Geschäftskundenbereich. – Schließlich wollen wir weiter wachsen und eine sichere Kommunikation für jedermann ermöglichen. 2020 mailbox.org erweitert sein Webportal um sichere Videokonferenzen, die das Team wie gewohnt selbst betreibt und in den eigenen Rechenzentren hosted. Damit gehen wir den nächsten Schritt hin zu einer umfassenden Kommunikationsplattform für Privat- und Geschäftskunden. mehr Beiträge zurück nach Oben Unsere Motivation & Überzeugung Damit Privates privat bleibt: Mit mailbox.org schaffen wir bewußt Rückzugsräume für Ihre sichere und freie Kommunikation. Unser Ziel: sichere, freie und unüberwachte Kommunikation Als eines der Urgesteine des Internets haben wir die freie Kommunikation im Internet nicht nur kennengelernt, sondern selbst mit aufgebaut: Seit Jahrzehnten gehört dieses Thema zu unserem täglichen Leben und ist die Motivation unseres Handelns. Seit vielen Jahren müssen wir jedoch beobachten, dass die freie Kommunikation zunehmend auf der Strecke bleibt — hinter den Interessen großer kommerzieller Anbieter, die das freie Internet vereinnahmen und unter rein monetären Gesichtspunkten sehen. Wir haben gelernt, dass es immer wieder notwendig ist, genau hinzusehen, ob sich auch der Rechtsstaat und dessen Organe an die geltenden Gesetze sowie an die Menschen- und Grundrechte hält. Wir verteidigen diese Rechte, indem wir z.B. rechtswidrige Anfragen nach Kundendaten konsequent ablehnen. Auch Maßnahmen wie die geplante Vorratsdatenspeicherung widersprechen in unseren Augen dem Recht auf Privatsphäre, informeller Selbstbestimmung und freier Meinungsäußerung. Auch wenn wir als E-Mail-Anbieter zunächst nicht direkt betroffen sind, sehen wir uns doch gefährdet und beteiligen uns deshalb als aktiver Beschwerdeführer an der Verfassungsbeschwerde gegen die Vorratsdatenspeicherung zusammen mit Digitalcourage und weiteren betroffenen Verbänden, Journalisten, Anwälten u.a. Meinungsfreiheit & Privates bewahren. Digitale Freiräume ermöglichen. Die ausufernden staatlichen Überwachungsmaßnahmen, die die Unschuldsvermutung umkehren und tief in die Grundrechte unbescholtener Bürger eingreifen, sehen wir nicht erst seit dem NSA-Skandal 2013 als Gefährdung unserer Demokratie an. mailbox.org ist darum kein x-beliebiger technischer Anbieter, sondern schafft bewusst Rückzugs- und Sicherheitsräume, schützt so die Meinungsfreiheit und stellt die eigentlich selbstverständlichen Möglichkeiten einer unüberwachten privaten Kommunikation wieder her – bei allen Annehmlichkeiten, die das Internet heute so zu bieten hat. zurück nach Oben Gesellschaftliche & ökologische Verantwortung Mit hohem politischem und sozialen Selbstverständnis engagieren wir uns für freie und sichere Kommunikation. Nachhaltiges Handeln Wir unterstützen ein freies, unüberwachtes und sicheres Internet. Wir haben weder Lust auf eine permanente Überwachung durch Staaten, noch auf eine Ausspähung durch Unternehmen oder Konzerne mit kommerziellen Interessen. Als sicherer E-Mail-Anbieter sehen wir es als unseren gesellschaftlichen Beitrag, eine freie und unüberwachte Kommunikation für Privat- und Geschäftskunden möglich zu machen. Dabei setzen wir bewusst auf all unseren Systemen Linux- und OpenSource-Software ein, entwickeln diese Technik weiter und unterstützen finanziell Events wie die Chemnitzer Linux-Tage, Organisationen wie den Arbeitskreis Vorratsdatenspeicherung, Digitalcourage e.V. oder das Tor-Netzwerk, sowie Demonstrationen wie "Freiheit statt Angst". Als mittelständisches Unternehmen sind wir uns unserer sozialen Verantwortung gegenüber unseren Mitarbeitern, der Gesellschaft und auch der Umwelt bewusst. Und leisten gern unseren Beitrag. 100% Ökostrom Unsere energiesparenden Server laufen mit echtem Ökostrom verschiedener Anbieter in Berliner Rechenzentren, unser Büro bezieht seit jeher Ökostrom von Lichtblick. Für den Weg zum Rechenzentrum nutzen wir die Bahn oder Carsharing-Fahrzeuge von Stadtmobil. Ist doch mal ein Flug notwendig, leisten wir einen Ausgleich an atmosfair. Soziale Bank Das Konto von mailbox.org liegt bei der Sozialbank, die ihr Kerngeschäft in den Branchen Sozialwesen (Senioren-, Behinderten-, Kinder- und Jugendhilfe), Gesundheitswesen (Krankenhäuser, Reha-Einrichtungen) und Bildung hat. mailbox.org ist eigenfinanziert und schuldenfrei. Denn ohne Investoren und Werbetreibende bleiben wir unabhängig. Arbeit & Familie Als Arbeitgeber ermöglichen wir unseren festangestellten Mitarbeiter/innen HomeO'
