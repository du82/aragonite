title = "Sicheres E-Mail-Postfach für Privatkunden | mailbox.org"
description = "mailbox.org: E-Mail, Videokonferenzen, Groupware, Office & Cloud-Speicher. 100% Datenschutz, Server in DE, 30 Jahre Erfahrung. -> Jetzt informieren!"
full_description = '''Navigation überspringen 30 Tage kostenlos testen Ihr sicheres E-Mail-Postfach Für alle, die auch bei Ihren E-Mails auf Nummer sicher gehen wollen. Drei transparente Tarife – ab 1 € im Monat. E-Mails, Cloud-Speicher, Online Office und Videokonferenzen Einfach, unkompliziert und trotzdem sicher Jetzt kostenlos testen Damit Privates privat bleibt. Ihre Privatsphäre bestmöglich zu schützen: Das ist unsere Aufgabe! Bei uns finden Sie eine große Kommunikationsplattform mit viel Sicherheit und ohne Tracking und Werbung, versprochen. Ein Postfach bei mailbox.org bietet Ihnen genau das Level an Sicherheit, das Sie sich wünschen. Auch Stiftung Warentest findet uns "sehr gut". Wir sind 2015 und 2016 zum Testsieger aus 15 E-Mail-Diensten gekürt worden. Bei uns brauchen Sie kein Sicherheitsexperte zu sein – das übernehmen wir für Sie! Unser Team besteht aus Spezialisten, die immer up-to-date sind. Die wichtigsten Sicherheitsmerkmale im Überblick: Eigene Rechenzentren Anonyme Bezahlung PGP und S/MIME im Webmailer Spam-/Virenfilter IMAP, POP3 und SMTP Datenvermeidung und -sparsamkeit Zwei-Faktor-Authentifizierung (2FA) TLS 1.3 sofern möglich Garantiert verschlüsselter Versand „Have I Been Pwned“-Integration Mehr als nur E-Mail mailbox.org bietet eine komplette Kommunikationsplattform für den Alltag. Ideal für alle – vom Einsteiger bis zum Experten. Kalender, Adressbuch und Aufgaben Cloud-Speicher zum hochladen und teilen Online Office für mehr Flexibilität Videokonferenzen für mehr Nähe mit Ihren Liebsten Das sichere Postfach Unser Herzstück ist das Postfach. Übersichtlich, inkl. Kalender, Adressbuch und mit allen gewohnten Funktionen. Dazu kommt die alltagstaugliche PGP-Verschlüsselung, weitere E-Mail-Adressen (Aliasse) und die Integration externer Postfächer. Darüber hinaus sind bei uns sogar eigene Domains möglich. Läuft im Browser und in allen E-Mail-Programmen (POP3/IMAP) Kalender und Kontakte offline synchronisierbar Zuverlässiger Spam- und Virenfilter Weitere Infos über das Postfach Cloud-Speicher Der Cloud-Speicher ist der perfekte Ort für Ihre Bilder und Dateien – wann und wo Sie wollen. So einfach geht's: Dateien hochladen, verwalten und teilen. Auf Wunsch werden ganz bequem Ihre hochgeladenen Dateien direkt verschlüsselt. Und das Teilen wird noch sicherer mit einem Link inkl. Passwortschutz und begrenzter Laufzeit. Wir unterstützen den offenen WebDAV-Standard Einfache Einbindung als Netzlaufwerk (Desktop und mobil) Apps für iOS und Android verfügbar Weitere Infos über den Cloud-Speicher Online Office Erstellen und bearbeiten Sie jederzeit und von überall Ihre Dateien. Dokumente teilen und gemeinsam bearbeiten war noch nie so leicht. Das Online Office umfasst Textdokumente, Tabellen und Präsentationen. Läuft im Browser Gemeinsam an einem Dokument arbeiten Unterstützt gängige Office-Formate Weitere Infos über das Online Office Videokonferenzen Bleiben Sie mit Ihren Freunden und der Familie einfacher in Kontakt, egal wo Sie sich befinden. So einfach wie ein Telefonat und dabei fast so nah wie ein persönliches Gespräch. Dabei setzen wir auf OpenTalk, entwickelt von der Heinlein Gruppe, genau wie mailbox.org. Umfangreiche Funktionen Läuft im Browser – ohne Installation Einladungen einfach per Link Weitere Infos über die Videokonferenzen Besser organisiert im Team Ideal für Teams und Familien, die eine gemeinsame Kommunikationsplattform nutzen wollen. mailbox.org für Teams und Familien Für Teams und Familien haben wir eine ganz besondere Lösung. Während jedes Team-Mitglied sein eigenes E-Mail-Postfach besitzt, können Kalender, Adressbücher und Ordner im Cloud-Speicher spielend leicht geteilt werden. Darüber hinaus hat der Gründer des Teams die Admin-Rechte und kann damit Team-Mitglieder anlegen, vergessene Passwörter zurücksetzen und alle Accounts gemeinsam bezahlen. Ideal für Familien und kleine Teams mit bis zu 10 Mitgliedern. Für größere Teams bieten wir spezielle Business-Angebote an. Einfacheres Teilen (Adressbücher, Kalender, Cloud-Speicher) Verbinden Sie bis zu 10 Accounts miteinander Gemeinsame Abrechnung über einen Account möglich Ideal in Kombination mit der eigenen Domain Eigene Domains bei mailbox.org Nutzen Sie unsere Vorteile und Sicherheitsfunktionen auch mit Ihren eigenen Domains. Persönlicher kann Ihre E-Mail-Adresse kaum sein Nutzen Sie Ihre bestehende Domain mit allen mailbox.org-Funktionen und (fast) allen Sicherheitsmerkmalen. Selbstverständlich können Sie Ihre eigene Domain in mehreren Accounts einrichten, beispielsweise für Ihr Team oder Ihre Familie. Erfahren Sie mehr zur Einrichtung und Nutzung -> Ihre Features: bis zu 250 Aliasse inkl. Catch-All-Adressen mehrere eigene Domains möglich mehr Sicherheit mit SPF, DKIM und DMARC Ihre E-Mails sind sicher und Sie bleiben souverän mit Ihrer eigenen Domain! Verfügbar in den Tarifen STANDARD und PREMIUM. Höchste Sicherheit für Ihre Privatsphäre bei mailbox.org Damit Privates privat bleibt. Alles, was geht, wird gemacht. Bei uns können Sie nicht nur Ihre E-Mails direkt im Webmailer mit PGP verschlüsseln, sondern auch Ihr gesamtes Postfach. Dabei müssen Sie kein IT-Sicherheitsexperte sein. Das sind wir von mailbox.org. Unsere langjährigen Experten schützen Ihre Daten auf unseren Systemen. Auch deshalb betreiben wir mailbox.org nicht auf angemieteten Servern, sondern mit eigener Infrastruktur redundant in unseren Berliner Rechenzentren. Mit unserem Angebot konnten wir auch das Bundesamt für Sicherheit in der Informationstechnik überzeugen. So tragen die Tarife PREMIUM, STANDARD und LIGHT das IT-Sicherheitskennzeichen des BSI. Sicherheitsmerkmale Professioneller Spam- und Virenschutz PGP-Verschlüsselung im Webmailer via mailbox.org Guard oder Mailvelope Eigener PGP-Key-Server Nutzung modernster Crypto-Algorithmen Einsatz von Perfect Forward Secrecy (PFS), DNSSEC und DANE/TLSA Im Webmailer integrierter TLS-Checker Besonders sichere secure.mailbox.org-Adressen Weitere Infos über die Sicherheit bei mailbox.org E-Mails einfach & sicher umziehen E-Mails, Kalender, Aufgaben oder Dateien schnell, einfach und sicher umziehen. So einfach ist der Umzug zu mailbox.org Sie haben bereits ein E-Mail-Postfach mit umfangreichen Bestand und möchten zu mailbox.org wechseln? Kein Problem: Mit Ihrem kostenlosen 30-Tage-Testaccount können Sie auf Wunsch selbst in Ruhe Schritt für Schritt mit Ihren bestehenden Daten zu mailbox.org umziehen. Oder Sie lassen Ihr bisheriges Postfach bestehen und binden dieses komfortabel in Ihren neuen mailbox.org Webmailer ein. Für alle, die Ihren Umzug nicht selbst durchführen wollen, bietet unser deutscher Partner audriga einen komfortablen und sicheren Umzugs-Service. Mit ihm migrieren Sie Ihre E-Mails mit Anhängen und Statusinformationen sowie Kontakte, Kalender und Dateien zwischen beliebigen Anbietern einfach, schnell und sicher. Mehr Informationen zum Umzugsservice finden Sie in unserer Wissensdatenbank. Unsere Preise Starten Sie 30 Tage lang mit einem kostenlosen Test-Account. Wählen Sie danach den passenden Tarif. Unsere Preis-Pakete für Ihr sicheres E-Mail-Postfach Mit einem sicheren E-Mail-Postfach bei mailbox.org erhalten Sie die Kontrolle über Ihre persönlichen Daten zurück. Egal, ob als privates E-Mail-Postfach, für Familien oder auch Teams mit bis zu 10 Mitgliedern: mailbox.org ist für jeden Bedarf die passende E-Mail- und Kommunikationsplattform.mailbox.org-Tarife für Unternehmen -> PREMIUM STANDARD LIGHT Das umfangreichstesichere E-Mail-Postfachinkl. priorisiertem Support. 9 € pro Nutzer / Monat Jetzt 30 Tagekostenlos testen PREMIUM STANDARD LIGHT Unser Sorglos-Paket: SichereE-Mail & viele Features,die Datenschutz leicht machen. 3 € pro Nutzer / Monat Jetzt 30 Tagekostenlos testen PREMIUM STANDARD LIGHT Unser Basistarif:Sichere E-Mail inkl.Kalender und Adressbuch. 1 € pro Nutzer / Monat Jetzt 30 Tage kostenlos testen Mail-Speicher inklusive 25 GB 10 GB 2 GB Cloud-Speicher inklusive 50 GB 5 GB - Aliasse @mailbox.org 25 25 3 eigene Domains möglich i Verknüpfen Sie Ihre bestehenden Domains mit mailbox.org. nur in Team-Accounts i Nur verfügbar für Team-Mitglieder. keine Werbung, kein Tracking Serverstandorte nur in Deutschland Tarif & Details Premium Standard Light externe POP3-Accounts abrufbar 25 5 - Wegwerf-E-Mail-Adressen 50 Stück für 365 Tage 25 Stück für 90 Tage - Aliasse @eigene Domain 250 50 nur in Team-Accounts i Nur verfügbar für Team-Mitglieder: 3 Aliasse @eigene Domain Schutz gegen Wiederregistrierung i So lange bleibt eine E-Mail-Adresse nach einer Löschung für die Neuregistrierung gesperrt. mind. 2 Jahre mind. 1 Jahr 90 Tage Speicher flexibel erweiterbar - zusätzl. Mail-Speicher je 1 GB 0,10 € 0,20 € - zusätzl. Cloud-Speicher je 5 GB 0,20 € 0,40 € - Mindestvertragslaufzeit i Das eingezahlte Guthaben bestimmt die Vertragslaufzeit. Nur im Tarif LIGHT liegt die Mindesteinzahlung bei 12,- Euro. monatlich monatlich jährlich Rabatt bei jährlicher Zahlung i Sie erhalten 12 Monate Laufzeit zum Preis von 10. - Support & Service priorisiert i Wir beantworten Ihre Anfrage i.d.R. von Mo-Fr innerhalb von 24 Stunden. regulär i Wir beantworten Ihre Anfrage i.d.R. von Mo-Fr innerhalb von 48 Stunden. eingeschränkt i Wir können leider nur zu den Themen Vertrag, Finanzen und Passwort-Reset weiterhelfen. FAQ-Datenbank User-Forum E-Mail-Helpdesk priorisiert nur Vertragsfragen Telefonsupport i Im Tarif PREMIUM bieten wir einen Rückrufservice werktags zwischen 9 Uhr und 18 Uhr an. - - Backup im Self Service i Wir stellen, ohne Gewähr, Backups zum selbständigen Download zur Verfügung. - Umzugsservice via audriga - E-Mail & Kalender & Kontakte Webmail, IMAP, POP3 Kalender, Kontakte, Aufgaben Synchronisation mit Mobilgeräten Mobile Apps i E-Mail, Kalender und Kontakte sind kompatibel mit den Standard-Apps von iOS und Android. Push-Notifications bei Maileingang professioneller Spam- und Virenschutz verschiedene Themes im Webportal - Sicherheit & Verschlüsselung TLS-Checker i Wir checken, ob der Mailserver des Empfängers einen