title = "Sicheres E-Mail-Hosting für Bildung und Behörden | mailbox.org"
description = "mailbox.org Business: E-Mail, Videokonferenzen, Groupware, Office & Cloud-Speicher. 100% Datenschutz, Server in DE, 30 Jahre Erfahrung. -> Jetzt informieren!"
full_description = "Datenschutz ist unsere DNA mailbox.org ist der Experte für sichere, datenschutzkonforme Kommunikation. Das Unternehmen Heinlein Support, mit seinen über 30 Jahren Expertise, steht hinter dem 2014 gegründeten E-Mail-Provider. Mittlerweile ist aus dem E-Mail-Provider ein Anbieter für eine komplette Kommunikationsplattform geworden, die es auch mit den Großen am Markt aufnehmen kann. Bei uns brauchen Sie sich keine Gedanken über Diskussionen mit Ihrem Datenschützer zu machen. Wir sind ein Anbieter aus Deutschland mit zwei Serverstandorten in Berlin. Wir haben Erfahrung mit dem anspruchsvollen Anforderungsprofil von Behörden und Bildungseinrichten. Unsere Spezialisten haben Datenschutz und Sicherheit fest im Blick. Deutsche Rechenzentren Kein Vendor Lock-in Zugriffsmanagement PGP im Webmailer Spam-/Virenfilter IMAP, POP3 und SMTP Zentrale Admin-Oberfläche TLS 1.3 sofern möglich Datenvermeidung und -sparsamkeit Login mit Single Sign-on (SSO) Behörden und Bildungseinrichtungen, die uns Vertrauen Alle Referenzen ansehen -> Mehr als ein Mail-Postfach mailbox.org bietet eine komplette Kommunikationsplattform für alle Organisationen, die auf eine datenschutzkonforme Lösung setzen möchten. DSGVO-konform, Server in Deutschland Flexible Lösung, einfache Integration Offene Standards: kein Vendor Lock-in Zentrale Verwaltung für Admins & API-Schnittstelle E-Mail Der Kern unseres Services ist das professionelle E-Mail-Postfach. Übersichtlich, inkl. Kalender, Adressbuch und mit vielen Funktionen. Webmailer: keine Installation notwendig Einrichtung mit IMAP in E-Mail-Programmen möglich Inkl. Adressbücher und Kalender PGP und S/MIME im Webmailer Downloadlinks für große Anhänge Mehr erfahren Cloud-Speicher Im Cloud-Speicher sind alle Dokumente an einem zentralen Ort und immer erreichbar – wann und von wo Sie wollen. So einfach gehts: Dateien hochladen, verwalten und teilen. Und das Teilen ist besonders sicher, wenn Sie Dateien per Link mit Passwortschutz und begrenzter Laufzeit teilen. Upload per Drag & Drop Ideal für Kollaboration im Team Individuelles Rechte-Management Freigabe (optional mit Passwort und Ablaufdatum) PGP-Verschlüsselung aller Dateien möglich Mehr erfahren Office Erstellen und bearbeiten Sie jederzeit und von überall Ihre Dateien. Dokumente teilen und gemeinsam bearbeiten war noch nie so leicht. Das Online Office umfasst Textdokumente, Tabellen und Präsentationen. Läuft im Browser – ohne Installation Erstellen und bearbeiten Sie Dokumente, Tabellen und Präsentationen Arbeiten Sie online und direkt in Ihrem Cloud-Speicher Teilen per Weblink mit Gastzugang für den Empfänger Mehr erfahren Videokonferenzen Auf unsere Videokonferenzlösung können Sie sich verlassen: stabil und zuverlässig, basierend auf Open Source und gehostet in unseren Rechenzentren. So einfach wie ein Telefonat und dabei fast so nah wie ein persönliches Gespräch. Eigene Lösung: OpenTalk, die Videokonferenzlösung aus dem Hause Heinlein Support Läuft im Browser – ohne Installation Individualisierbar für Ihren Einsatz Inkl. vieler Funktionen Mehr erfahren Admin-Oberfläche & API Die Verwaltungsoberfläche für den Administrator Ihrer Organisation bietet eine Vielzahl an Informationen auf einem Blick. Darüber hinaus lassen sich hier die häufigsten Szenarien abdecken, wie Postfach einrichten, Tarife ändern und Passwörter zurücksetzen. Einfache Einrichtung der Firmen-Domains Übersichtliche Einrichtung der Mitarbeiter-Postfächer Steuerung der Features API-Schnittstelle Ihre Vorteile bei mailbox.org Account-Verwaltung, API-Integration, AV-Verträge nach DSGVO, Umzugsservice: So muss Business E-Mail-Hosting sein. Zentrale Verwaltung & API Behalten Sie den Überblick! Als Business Mail Kunde haben Sie Zugriff auf ein eigenes Verwaltungsinterface, mit dem Sie jederzeit alle Belange Ihres Mailhostings klären können. Zentrale AdministrationÜber einen zentralen Administrationszugang verwalten Sie Vertrag, Domains, Postfächer, Weiterleitungen, Passwörter, Speicherplatz und alle anderen Einstellungen der Accounts. Individuelle Einstellungen erlauben?Legen Sie fest, ob auch Ihre Nutzer individuelle Einstellungen bei Spamfilter, Backup und Speicherplatz (Quota) vornehmen dürfen, oder nicht. Groupware in NutzergruppenDefinieren Sie verschiedene Benutzergruppen innerhalb Ihres Accounts. Darüber lassen sich Groupware-Ressourcen wie Kalender, Kontakte und Dateien vereinfacht gemeinsam nutzen. API für ProfisPflegen Sie eine größere Umgebung und haben Sie eigene Verwaltungsprozesse? Oder möchten Sie als Reseller unsere Leistungen durch Ihr Kundenportal Ihren Nutzern zur Verfügung stellen? Sämtliche Einstellungen lassen sich zentral über unsere API ansprechen und damit bequem in Ihre Infrastruktur integrieren. Support & Service Je nach Service-Paket stehen Ihrem Account-Administrator unsere Spezialisten im Support per E-Mail-Ticketsystem oder am Telefon zur Verfügung – im Notfall sogar 24/7. Entscheiden Sie selbst, welches Support-Level Sie benötigen. 2nd/3rd -Level Supportmailbox.org übernimmt den 2nd/3rd-Level Support für Sie als Kunden bzw. Ihren Account-Administrator. 1st-Level Support je nach Postfach-TarifAuf Wunsch unterstützen wir Sie gerne beim 1st-Level-Support Ihrer Mitarbeiter. Bitte beachten Sie, dass dies nur in den Postfach-Tarifen STANDARD und PREMIUM möglich ist. Persönlicher AnsprechpartnerFür das Onboarding und vertragliche Fragen steht Ihnen, in den Service-Paketen Platin und Gold, Ihr persönlicher Ansprechpartner zur Verfügung. Vertrag & Rechnungslegung Als Geschäftskunde bleiben Sie bei uns flexibel: Flexible VertragsgestaltungE-Mail-Adressen können Sie tagesaktuell hinzu buchen oder auflösen. Tarife der Accounts wechseln Sie mit sofortiger Wirkung. Passen Sie den gebuchten Speicherplatz kurzfristig an und zahlen Sie nur, was Sie auch brauchen. Rechnungslegung für UnternehmenSie erhalten eine monatlicher Sammelrechnung, natürlich mit ausgewiesener Umsatzsteuer. Lastschrifteinzug ist möglich. Kurze KündigungsfristKeine Jahresverträge: Unsere Kunden sind bei uns, weil Sie bei uns sein wollen. Kurze Kündigungsfristen sind selbstverständlich. Beratung, Planung & Umzug Sie wissen noch nicht so recht, was für Sie sinnvoll ist? Sie haben bereits einen umfangreichen Datenbestand in der Cloud und scheuen sich vor dem Umzug? Egal ob Gmail, Office365, ein anderer Hoster oder sogar Ihre eigene Lösung: Professionelle Hilfe steht bereit. Vor, während und nach dem Umzug. Support für Sie und Ihren AdministratorWas ist möglich, was ist sinnvoll, was ist machbar? Als Business-Kunde steht Ihnen schon im Vorfeld ein persönlicher Ansprechpartner bei uns zur Verfügung. Er klärt mit Ihnen alle Fragen und kümmert sich um die Koordinierung Ihres Einzugs bei uns. Umzug mit AudrigaUnser Partner Audriga übernimmt den automatisierten Umzug der bisher gespeicherten Daten aller Accounts: E-Mail, Kalender, Kontakte und sogar Dateien aus Ihrem Cloud-Storage. - Umzug deluxe: Wenn Sie Ihr neues mailbox.org Office betreten, sind die Schränke schon eingeräumt. Hilfe bei der EinrichtungFragen zu Apps, zur Softwareauswahl oder zu Nutzungsmöglichkeiten und Vorgehensweisen? Ihr persönlicher Ansprechpartner betreut gerne Ihr Onboarding und nimmt Sie und Ihre Nutzer an die Hand. Höchste Sicherheit für Ihre Privatsphäre bei mailbox.org Damit Privates privat bleibt. Alles, was geht, wird gemacht. Bei uns können Sie nicht nur Ihre E-Mails direkt im Webmailer mit PGP verschlüsseln, sondern auch Ihr gesamtes Postfach. Dabei müssen Sie kein IT-Sicherheitsexperte sein. Das sind wir von mailbox.org. Unsere langjährigen Experten schützen Ihre Daten auf unseren Systemen. Auch deshalb betreiben wir mailbox.org nicht auf angemieteten Servern, sondern mit eigener Infrastruktur redundant in unseren Berliner Rechenzentren. Mit unserem Angebot konnten wir auch das Bundesamt für Sicherheit in der Informationstechnik überzeugen. So tragen die Tarife PREMIUM, STANDARD und LIGHT das IT-Sicherheitskennzeichen des BSI. Sicherheitsmerkmale Professioneller Spam- und Virenschutz PGP-Verschlüsselung im Webmailer via mailbox.org Guard oder Mailvelope Eigener PGP-Key-Server S/MIME im Webmailer Nutzung modernster Crypto-Algorithmen Einsatz von Perfect Forward Secrecy (PFS), DNSSEC und DANE/TLSA Im Webmailer integrierter TLS-Checker Weitere Infos über die Sicherheit bei mailbox.org Individuelle Tarife für den öffentlichen Sektor Zahlen Sie nur für das, was Sie wirklich brauchen. Wir beraten Sie gerne persönlich! Maßgeschneiderte Tarife Aus Erfahrung wissen wir: Jede Organisation hat ihre eigenen Anforderungen und Abläufe. Für einige unserer Kunden genügt das E-Mail-Postfach mit extra viel Mail-Speicher und andere nutzen das Komplettpaket mit E-Mail, Cloud-Speicher, Online Office und Videokonferenzen. Wir bieten Ihnen eine individuelle Lösung ohne unnötige Kosten. Zusätzlich erhält Ihr Account-Administrator Support per E-Mail-Ticketsystem oder bei Bedarf auch Zugriff auf unsere 24/7 Notfall-Hotline. Darüber hinaus bieten wir auf Wunsch den 1st-Level-Support für Ihre Mitarbeiter sowie Trainings an. Gerne unterstützen wir Sie auch bei den Themen rund um die Migration und Integration in bestehende Systeme. Sprechen Sie uns einfach an. Kontaktieren Sie uns! Datenschutz Unsere Datenschutzhinweise finden Sie hier. Dieses Feld nicht ausfüllen Dieses Feld nicht ausfüllenDieses Feld nicht ausfüllen * Bitte ausfüllen Anfrage absenden"
